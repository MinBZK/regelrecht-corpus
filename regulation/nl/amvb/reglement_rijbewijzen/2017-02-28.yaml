      Onverminderd [artikel 17][ref1] wordt aan de aanvrager die in het bezit is van een rijbewijs D1, respectievelijk
      D, dat is voorzien van een bij ministeriële regeling vastgestelde codering waaruit blijkt dat de houder van dat
      rijbewijs het praktijkexamen heeft afgelegd in een motorrijtuig met automatische schakeling, en ten behoeve van
      wie in het rijbewijzenregister een verklaring van rijvaardigheid is geregistreerd voor de rijbewijscategorie
      D1E, D of DE, respectievelijk DE, waaruit blijkt dat hij het praktijkexamen voor die categorie heeft afgelegd
      in een motorrijtuig met handschakeling, een rijbewijs afgegeven voor het besturen van de betrokken categorieën
      van motorrijtuigen, zonder dat voor een van die categorieën een beperking tot motorrijtuigen met automatische
      schakeling geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel17
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '17'
        hoofdstuk: I
        paragraaf: '6'
  - number: '18.7'
    text: |-
      Voor de toepassing van het eerste en tweede lid wordt met een rijbewijs voor de categorie A1 of A2 als daar bedoeld
      gelijkgesteld een door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of in een andere
      staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland aan de aanvrager
      afgegeven geldig rijbewijs voor de categorie A1 of A2.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel18
  - number: '18.8'
    text: |-
      Voor de toepassing van het derde en vierde lid wordt met een rijbewijs voor de categorie B als daar bedoeld
      gelijkgesteld:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel18
  - number: 18.8.a
    text: een rijbewijs B dat zijn geldigheid heeft verloren door het verstrijken van de geldigheidsduur;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel18
  - number: 18.8.b
    text: |-
      een door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of in een andere staat die partij
      is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland aan de aanvrager afgegeven geldig
      rijbewijs B.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel18
  - number: '18.9'
    text: |-
      Voor de toepassing van het vijfde lid wordt met een rijbewijs C1 of C als daar bedoeld gelijk gesteld een door
      het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of in een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland aan de aanvrager afgegeven geldig rijbewijs
      voor de categorie C1 of C.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel18
  - number: '18.10'
    text: |-
      Voor de toepassing van het zesde lid wordt met een rijbewijs D1 of D als daar bedoeld gelijkgesteld een door het
      daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of in een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland aan de aanvrager afgegeven geldig rijbewijs
      voor de categorie D1 of D.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel18
  - number: 18a.1
    text: |-
      In afwijking van [artikel 17][ref1] wordt aan de aanvrager die:


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel17
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '17'
        hoofdstuk: I
        paragraaf: '6'
  - number: 18a.1.a
    text: |-
      in het bezit is van een rijbewijs B dat geldig is voor het besturen van motorrijtuigen van die categorie met
      handschakeling,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel18a
  - number: 18a.1.b
    text: |-
      blijkens de geregistreerde verklaring van rijvaardigheid het praktijkexamen voor de categorie C, CE, D of DE heeft
      afgelegd in een motorrijtuig van die categorie met automatische schakeling, dat is voorzien van een schakelaar of
      hendel, waarmee de bestuurder invloed kan uitoefenen op de gangwissel van het motorrijtuig, en
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel18a
  - number: 18a.1.c
    text: bij dat praktijkexamen heeft voldaan aan bij ministeriële regeling gestelde voorwaarden,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel18a
  - number: 18a.2
    text: |-
      Voor de toepassing van het eerste lid, onderdeel a, wordt met een rijbewijs B dat in het bezit is van de in de
      aanhef bedoelde aanvrager gelijkgesteld een door het daartoe bevoegde gezag in een andere lidstaat van de Europese
      Unie of een staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland aan
      de aanvrager afgegeven geldig rijbewijs voor de categorie B.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel18a
  - number: '19'
    text: |-
      Aan de aanvrager van een rijbewijs, die blijkens de ten behoeve van hem in het rijbewijzenregister geregistreerde
      verklaring van geschiktheid slechts een motorrijtuig kan besturen binnen een geografisch beperkt gebied, wordt een
      rijbewijs afgegeven dat slechts geldig is voor het besturen van motorrijtuigen binnen dat gebied. In het rijbewijs
      is deze beperking aangeduid met een bij ministeriële regeling vastgestelde codering.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel19
  - number: 19a
    text: |-
      Aan de aanvrager van een rijbewijs, die blijkens de ten behoeve van hem in het rijbewijzenregister geregistreerde
      verklaring van geschiktheid de tot het besturen van motorrijtuigen vereiste geschiktheid slechts bezit indien hij
      het door hem te besturen motorrijtuig gebruikt voor privé doeleinden, wordt een rijbewijs afgegeven dat slechts
      geldig is voor het besturen van motorrijtuigen voor privé doeleinden. In het rijbewijs is deze beperking aangeduid
      met een bij ministeriële regeling vastgestelde codering.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel19a
  - number: 19b
    text: |-
      Indien de aanvraag betrekking heeft op de afgifte van een rijbewijs voor de categorie A1, A2, A, B, BE, C1, C1E, C,
      CE, D1, D1E, D of DE geeft degene die belast is met de afgifte van rijbewijzen tevens een rijbewijs af dat geldig
      is voor het besturen van motorrijtuigen waarvoor een rijbewijs AM is vereist.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel19b
  - number: 19c
    text: |-
      Aan de aanvrager van een rijbewijs, die blijkens de ten behoeve van hem in het rijbewijzenregister geregistreerde
      verklaring van geschiktheid slechts een motorrijtuig, niet zijnde een bromfiets, kan besturen waarin een
      alcoholslot is ingebouwd, wordt een rijbewijs afgegeven dat slechts geldig is voor het besturen van een
      motorrijtuig van de categorie B waarin ten behoeve van de aanvrager een alcoholslot is ingebouwd. Op het rijbewijs
      is deze beperking aangeduid met een bij ministeriële regeling vastgestelde codering.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel19c
  - number: '20.1'
    text: |-
      Aan de aanvrager van een rijbewijs die blijkens de ten behoeve van hem in het rijbewijzenregister geregistreerde
      verklaring van rijvaardigheid het praktijkexamen voor de rijbewijscategorie A2 heeft afgelegd, wordt een rijbewijs
      afgegeven dat geldig is voor de categorieën A1 en A2.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel20
  - number: '20.2'
    text: |-
      Aan de aanvrager van een rijbewijs die blijkens de ten behoeve van hem in het rijbewijzenregister geregistreerde
      verklaring van rijvaardigheid het praktijkexamen voor de rijbewijscategorie A heeft afgelegd, wordt een rijbewijs
      afgegeven dat geldig is voor de categorieën A1, A2 en A.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel20
  - number: '21.1'
    text: |-
      Aan de aanvrager van een rijbewijs, die blijkens de ten behoeve van hem in het rijbewijzenregister geregistreerde
      verklaring van rijvaardigheid het praktijk-examen voor de rijbewijscategorie E heeft afgelegd met een aanhangwagen,
      voortbewogen door een trekkend motorrijtuig voor het besturen waarvan een rijbewijs B is vereist, wordt een
      rijbewijs E afgegeven dat slechts geldig is voor het voortbewegen van een aanhangwagen of oplegger indien deze
      wordt voortbewogen door een motorrijtuig voor het besturen waarvan een rijbewijs B is vereist.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel21
  - number: '21.2'
    text: |-
      In afwijking van het eerste lid wordt desgevraagd aan degene die blijkens de ten behoeve van hem in het
      rijbewijzenregister geregistreerde verklaring van rijvaardigheid het praktijkexamen voor de rijbewijscategorie E
      heeft afgelegd met een aanhangwagen, voortbewogen door een trekkend motorrijtuig voor het besturen waarvan een
      rijbewijs B is vereist, een rijbewijs B afgegeven dat slechts geldig is voor het besturen van een samenstel van een
      trekkend motorrijtuig voor het besturen waarvan een rijbewijs B is vereist en een aanhangwagen of oplegger waarvan
      de toegestane maximum massa meer bedraagt dan 750 kg, en de toegestane maximum massa van het samenstel van trekkend
      motorrijtuig en aanhangwagen of oplegger meer bedraagt dan 3500 kg, maar niet meer bedraagt dan 4250 kg. In het
      rijbewijs is dit aangeduid met een bij ministeriële regeling vastgestelde codering.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel21
  - number: 21a
    text: |-
      Aan de aanvrager van een rijbewijs, die blijkens de ten behoeve van hem in het rijbewijzenregister geregistreerde
      verklaring van rijvaardigheid het praktijkexamen voor de rijbewijscategorie C heeft afgelegd met een motorrijtuig
      voor het besturen waarvan een rijbewijs C is vereist, wordt een rijbewijs C en C1, alsmede een rijbewijs T
      afgegeven.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel21a
  - number: 21b
    text: |-
      Aan de aanvrager van een rijbewijs, die blijkens de ten behoeve van hem in het rijbewijzenregister geregistreerde
      verklaring van rijvaardigheid het praktijkexamen voor de rijbewijscategorie D heeft afgelegd met een motorrijtuig
      voor het besturen waarvan een rijbewijs D is vereist, wordt een rijbewijs D en D1 afgegeven.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel21b
  - number: '22.1'
    text: |-
      Aan de aanvrager van een rijbewijs die blijkens de ten behoeve van hem in het rijbewijzenregister geregistreerde
      verklaring van rijvaardigheid het praktijkexamen voor de rijbewijscategorie E heeft afgelegd met een aanhangwagen,
      voortbewogen door een trekkend motorrijtuig voor het besturen waarvan een rijbewijs C1 is vereist, wordt een
      rijbewijs E afgegeven dat geldig is voor het voortbewegen van een aanhangwagen of oplegger indien deze wordt
      voortbewogen door een motorrijtuig voor het besturen waarvan een rijbewijs B of C1 is vereist en, indien de
      aanvrager in het bezit is van een rijbewijs D1, voor het voortbewegen van een aanhangwagen indien deze wordt
      voortbewogen door een motorrijtuig voor het besturen waarvan een rijbewijs D1 is vereist.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel22
  - number: '22.2'
    text: |-
      Aan de aanvrager van een rijbewijs, die blijkens de ten behoeve van hem in het rijbewijzenregister geregistreerde
      verklaring van rijvaardigheid het praktijkexamen voor de rijbewijscategorie E heeft afgelegd met een aanhangwagen,
      voortbewogen door een trekkend motorrijtuig voor het besturen waarvan een rijbewijs C is vereist, wordt een
      rijbewijs E afgegeven dat geldig is voor het voortbewegen van een aanhangwagen of oplegger, indien deze wordt
      voortbewogen door een motorrijtuig voor het besturen waarvan een rijbewijs B, C of C1 is vereist en, indien de
      aanvrager in het bezit is van een rijbewijs D respectievelijk D1, voor het voortbewegen van een aanhangwagen indien
      deze wordt voortbewogen door een motorrijtuig voor het besturen waarvan rijbewijs D, respectievelijk rijbewijs D1
      is vereist.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel22
  - number: 22a.1
    text: |-
      Aan de aanvrager van een rijbewijs op grond van [artikel 45][ref1] die beschikt over een rijbewijs C1
      respectievelijk C1E, afgegeven door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of
      in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland,
      dat blijkens de daarop aangegeven codering niet de bevoegdheid geeft tot het besturen van een motorrijtuig van
      de categorie C1 respectievelijk C1 en C1E dat onder Verordening (EEG) nr. 3821/85 valt, wordt een rijbewijs C1
      respectievelijk C1E afgegeven dat slechts geldig is voor het besturen van motorrijtuigen van de categorie C1
      respectievelijk C1 en C1E die niet onder de werking van die verordening vallen. Deze beperking is aangeduid met een
      bij ministeriële regeling vastgestelde codering.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel45
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '45'
        hoofdstuk: II
        paragraaf: '2'
  - number: 22a.2
    text: |-
      Aan de aanvrager van een rijbewijs C1 of C die in het bezit is van een rijbewijs C1 als bedoeld in het eerste lid
      wordt, indien ten behoeve van hem in het rijbewijzenregister een verklaring van vakbekwaamheid is geregistreerd
      voor de categorie C1 of C, een rijbewijs C1 of C afgegeven, zonder dat daarbij ten aanzien van categorie C1 de in
      het eerste lid bedoelde codering wordt vermeld.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel22a
  - number: '23.1'
    text: |-
      Aan de aanvrager van een rijbewijs die blijkens de ten behoeve van hem in het rijbewijzenregister geregistreerde
      verklaring van rijvaardigheid het praktijkexamen voor de rijbewijscategorie E heeft afgelegd met een aanhangwagen,
      voortbewogen door een trekkend motorrijtuig voor het besturen waarvan een rijbewijs D1 is vereist, wordt een
      rijbewijs E afgegeven dat geldig is voor het voortbewegen van een aanhangwagen indien deze wordt voortbewogen door
      een motorrijtuig voor het besturen waarvan een rijbewijs D1 is vereist respectievelijk een aanhangwagen of oplegger
      indien deze wordt voortbewogen door een motorrijtuig voor het besturen waarvan een rijbewijs B is vereist.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel23
  - number: '23.2'
    text: |-
      Aan de aanvrager van een rijbewijs, die blijkens de ten behoeve van hem in het rijbewijzenregister geregistreerde
      verklaring van rijvaardigheid het praktijkexamen voor de rijbewijscategorie E heeft afgelegd met een aanhangwagen,
      voortbewogen door een trekkend motorrijtuig voor het besturen waarvan een rijbewijs D is vereist, wordt een
      rijbewijs E afgegeven dat geldig is voor het voortbewegen van een aanhangwagen indien deze wordt voortbewogen door
      een motorrijtuig voor het besturen waarvan een rijbewijs D of D1 is vereist, respectievelijk een aanhangwagen of
      oplegger indien deze wordt voortbewogen door een motorrijtuig voor het besturen waarvan een rijbewijs B is vereist.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel23
  - number: '24'
    text: |-
      Aan de aanvrager van een rijbewijs, die blijkens de ten behoeve van hem in het rijbewijzenregister geregistreerde
      verklaring van geschiktheid de voor het besturen van motorrijtuigen vereiste geschiktheid slechts bezit indien
      hij corrigerende lenzen draagt, wordt een rijbewijs afgegeven dat slechts geldig is indien de aanvrager bij het
      besturen gebruik maakt van die corrigerende lenzen. In het rijbewijs is deze beperking aangeduid met een bij
      ministeriële regeling vastgestelde codering.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel24
  - number: '25.1'
    text: |-
      Aan de aanvrager van een rijbewijs, die blijkens de ten behoeve van hem in het rijbewijzenregister geregistreerde
      verklaring van geschiktheid de voor het besturen van motorrijtuigen vereiste geschiktheid slechts bezit voor een
      termijn die korter is dan de krachtens [artikel 25a, eerste of tweede lid][ref1], voorziene geldigheidsduur van het
      rijbewijs, wordt een rijbewijs afgegeven dat slechts geldig is gedurende die kortere termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel25a
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 25a
        hoofdstuk: I
        paragraaf: '7'
  - number: '25.2'
    text: |-
      Indien het de afgifte betreft van een rijbewijs T op grond van [artikel 21a][ref1] wordt een rijbewijs afgegeven
      dat voor de categorie T dezelfde geldigheidsduur heeft als voor de categorie B. Indien er sprake is van beperkende
      coderingen die zijn geregistreerd ten aanzien van houders van een rijbewijs B, worden deze bij de categorie
      T vermeld, met uitzondering van de in [artikel 17, derde lid][ref2], bedoelde codering die aanduidt dat het
      praktijkexamen is afgelegd in een motorrijtuig met automatische schakeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel21a
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel17
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 21a
        hoofdstuk: I
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0008074
        artikel: '17'
        hoofdstuk: I
        paragraaf: '6'
  - number: 25a.1
    text: |-
      Behoudens de [artikelen 123][ref1], [123a][ref2] en [123b van de wet][ref3] is een rijbewijs voor de categorieën
      AM, A1, A2, A, B, E bij B, of T, afgegeven aan een aanvrager die de leeftijd van


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel123
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel123a
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel123b
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '123'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 123a
      - id: ref3
        bwb_id: BWBR0006622
        artikel: 123b
  - number: 25a.1.a
    text: |-
      65 jaren nog niet heeft bereikt, geldig voor de duur van tien achtereenvolgende jaren, gerekend vanaf de in het
      rijbewijs vermelde datum van afgifte;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel25a
  - number: 25a.1.b
    text: |-
      65 jaren doch nog niet die van 70 jaren heeft bereikt, geldig vanaf de in het rijbewijs vermelde datum van afgifte
      tot de dag waarop hij de leeftijd van 75 jaren bereikt;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel25a
  - number: 25a.1.c
    text: |-
      70 jaren heeft bereikt, geldig voor de duur van vijf achtereenvolgende jaren, gerekend vanaf de in het rijbewijs
      vermelde datum van afgifte.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel25a
  - number: 25a.2
    text: |-
      Behoudens de [artikelen 123][ref1], [123a][ref2] en [123b van de wet][ref3] is een rijbewijs voor de categorieën
      C1, E bij C1, C, E bij C, D1, E bij D1, D en E bij D, geldig voor de duur van vijf achtereenvolgende jaren,
      gerekend vanaf de in het rijbewijs vermelde datum van afgifte.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel123
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel123a
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel123b
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '123'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 123a
      - id: ref3
        bwb_id: BWBR0006622
        artikel: 123b
  - number: 25a.3
    text: |-
      In afwijking van het eerste en tweede lid is een rijbewijs, afgegeven aan degene die naar verwachting op grond van
      zijn lichamelijke of geestelijke geschiktheid voor een beperkte termijn geschikt zal zijn voor het besturen van
      motorrijtuigen, geldig vanaf de in het rijbewijs vermelde datum van afgifte tot de dag waarop de termijn waarvoor
      de houder naar verwachting geschikt zal zijn voor het besturen van motorrijtuigen, verstrijkt.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel25a
  - number: '26'
    text: De aanvraag van een rijbewijs geschiedt op de wijze als in de volgende artikelen is bepaald.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel26
  - number: '27'
    text: |-
      Indien de aanvrager woonachtig is in Nederland, dient de aanvraag te zijn gericht tot en te worden ingediend bij de
      burgemeester van de gemeente waar hij als ingezetene met een adres is ingeschreven in de basisregistratie personen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel27
  - number: '28'
    text: Indien de aanvraag betrekking heeft op de afgifte van
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel28
  - number: 28.a
    text: |-
      een rijbewijs tegen overlegging van een rijbewijs, aan de aanvrager afgegeven door het daartoe bevoegde gezag
      buiten Nederland,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel28
  - number: 28.b
    text: |-
      een rijbewijs dat geldig is voor een categorie of categorieën waarop de ongeldigverklaring van een rijbewijs, aan
      de aanvrager afgegeven door het daartoe bevoegde gezag in een andere lid-staat van de Europese Gemeenschap of in
      een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, geen
      betrekking heeft,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel28
  - number: 28.c
    text: |-
      een rijbewijs dat geldig is voor een categorie of categorieën waarvoor een rijbewijs, aan de aanvrager afgegeven
      door het daartoe bevoegde gezag in een andere lid-staat van de Europese Gemeenschap of in een andere staat die
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, ongeldig is verklaard,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel28
  - number: 28.d
    text: |-
      een rijbewijs ter vervanging van een eerder door het daartoe bevoegde gezag in een andere lid-staat van de Europese
      Gemeenschap of in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte
      of Zwitserland aan de aanvrager afgegeven rijbewijs, dat versleten of geheel of ten dele onleesbaar is, dan wel
      verloren is geraakt of teniet is gegaan, dan wel,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel28
  - number: 28.e
    text: |-
      een rijbewijs ter vervanging van een rijbewijs dat op grond van [artikel 123b van de wet][ref1] ongeldig
      is geworden of ten aanzien van waarvan een aantekening als bedoeld in artikel 123b, derde lid, van de wet
      is geplaatst, voor zover dit laatste rijbewijs een rijbewijs betreft als bedoeld in respectievelijk de
      [artikelen 44, eerste lid][ref2], [45, eerste lid][ref3], [46, eerste lid][ref4], of [48, eerste lid][ref5],


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel123b
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0008074#Artikel45
      [ref4]: https://wetten.overheid.nl/BWBR0008074#Artikel46
      [ref5]: https://wetten.overheid.nl/BWBR0008074#Artikel48
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 123b
      - id: ref2
        bwb_id: BWBR0008074
        artikel: '44'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0008074
        artikel: '45'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0008074
        artikel: '46'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0008074
        artikel: '48'
        hoofdstuk: II
        paragraaf: '2'
  - number: '29'
    text: |-
      Indien de aanvrager woonachtig is in Nederland, doch niet als ingezetene is ingeschreven in de basisregistratie
      personen, dient de aanvraag te zijn gericht tot de Dienst Wegverkeer en te worden ingediend bij de burgemeester
      van de gemeente waar de aanvrager woonachtig is. De burgemeester geleidt de aanvraag terstond door naar de Dienst
      Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel29
  - number: '30'
    text: |-
      Indien de aanvraag betrekking heeft op de afgifte van een rijbewijs aan een aanvrager die vreemdeling in de zin
      van de Vreemdelingenwet 2000 is en aan wie op grond van zijn hoedanigheid van of betrekking tot diplomatiek of
      consulair personeel dan wel op grond van zijn hoedanigheid van of betrekking tot personeel in dienst van een
      in Nederland gevestigde internationale organisatie houder is van een door Onze Minister van Buitenlandse Zaken
      verstrekt identiteitsbewijs voor geprivilegieerden, dient de aanvraag in afwijking van [artikel 29][ref1] te zijn
      gericht tot en te worden ingediend bij de Dienst Wegverkeer. Hetzelfde geldt indien het een aanvraag betreft ter
      vervanging van een rijbewijs dat op grond van [artikel 123b van de wet][ref2] ongeldig is geworden of ten aanzien
      van waarvan een aantekening als bedoeld in artikel 123b, derde lid, van de wet is geplaatst, voor zover dit laatste
      rijbewijs een rijbewijs betreft als bedoeld in [artikel 47, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel123b
      [ref3]: https://wetten.overheid.nl/BWBR0008074#Artikel47
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '29'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 123b
      - id: ref3
        bwb_id: BWBR0008074
        artikel: '47'
        hoofdstuk: II
        paragraaf: '2'
  - number: '31'
    text: |-
      Indien de aanvraag betrekking heeft op de afgifte van een rijbewijs aan een buiten Nederland woonachtige aanvrager
      aan wie nog niet eerder een rijbewijs is afgegeven dan wel aan een buiten Nederland, anders dan in een andere
      lidstaat van de Europese Gemeenschap of in een andere staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte of Zwitserland, woonachtige aanvrager, dient de aanvraag te zijn gericht tot en te
      worden ingediend bij de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel31
  - number: '32.1'
    text: 'Onverminderd het tweede en derde lid dient de aanvrager, indien de aanvraag betrekking heeft op:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel32
  - number: 32.1.1.
    text: |-
      de afgifte van een rijbewijs aan een aanvrager aan wie nog niet eerder een rijbewijs is afgegeven voor de
      rijbewijscategorie waarop de aanvraag betrekking heeft,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel32
  - number: 32.1.2.
    text: |-
      de afgifte van een rijbewijs dat geldig is voor een categorie of categorieën waarvoor een eerder aan de aanvrager
      afgegeven rijbewijs in verband met een gevorderd onderzoek naar diens rijvaardigheid tot het besturen van
      motorrijtuigen ongeldig is verklaard,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel32
  - number: 32.1.3.
    text: |-
      de afgifte van een rijbewijs dat geldig is voor een categorie of categorieën waarvoor een eerder aan de aanvrager
      afgegeven rijbewijs op het tijdstip waarop de in [artikel 123b, eerste lid, van de wet][ref1] bedoelde uitspraak
      onherroepelijk is geworden, geldig was, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel123b
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 123b
  - number: 32.1.4.
    text: |-
      de afgifte van een rijbewijs dat geldig is voor een categorie of categorieën waarvoor
      een eerder aan de aanvrager afgegeven rijbewijs ongeldig is verklaard op grond van
      [artikel 124, eerste lid, onderdeel a, b of c, van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel124
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '124'
  - number: 32.1.4..a
    text: op het moment van de aanvraag in Nederland woonachtig te zijn en tevens
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel32
  - number: 32.1.4..a.I
    text: |-
      in de onmiddellijk aan de aanvraag voorafgaande periode van één jaar ten minste 184 dagen in Nederland woonachtig
      te zijn geweest, of
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel32
  - number: 32.1.4..a.II
    text: |-
      gedurende een periode van ten minste zes maanden te zijn ingeschreven aan een in Nederland gevestigde universiteit,
      school voor middelbaar, voortgezet of hoger beroepsonderwijs of andere school voor middelbaar, voortgezet of hoger
      onderwijs, of
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel32
  - number: 32.1.4..a.III
    text: |-
      indien hij wegens tijdelijk verblijf buiten Nederland gedurende een periode van maximaal vier jaar niet geheel
      kan voldoen aan de onder I genoemde voorwaarde, gedurende een periode van ten minste tien jaar onafgebroken in
      Nederland woonachtig te zijn geweest, dan wel
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel32
  - number: 32.1.4..b
    text: |-
      in de onmiddellijk aan het moment van de aanvraag voorafgaande periode van één jaar ten minste 185 dagen in
      Nederland woonachtig te zijn geweest.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel32
  - number: '32.2'
    text: |-
      Indien het een aanvraag betreft als bedoeld in de [artikelen 44 tot en met 48][ref1], dient de aanvrager in
      Nederland woonachtig te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel44
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '44'
        hoofdstuk: II
        paragraaf: '2'
  - number: '32.3'
    text: |-
      Het eerste lid geldt niet indien bij de aanvraag niet langer dan drie jaar voor de aanvraag door het daartoe
      bevoegde militaire gezag een verklaring van rijvaardigheid voor het besturen van motorrijtuigen van de
      rijbewijscategorie of rijbewijscategorieën waarop de aanvraag betrekking heeft, is geregistreerd in het
      rijbewijzenregister.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel32
  - number: '33.1'
    text: 'Bij de aanvraag van een rijbewijs dienen de volgende bescheiden te worden overgelegd:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel33
  - number: 33.1.a
    text: een volledig ingevuld aanvraagformulier volgens bij ministeriële regeling vastgesteld model;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel33
  - number: 33.1.b.I
    text: |-
      een op naam van de aanvrager gesteld identiteitsbewijs als bedoeld in
      [artikel 1, eerste lid, onder 1°, 2° of 3°, van de Wet op de identificatieplicht][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 33.1.b.II
    text: |-
      een eerder aan de aanvrager afgegeven rijbewijs dat hetzij nog geldig is hetzij zijn geldigheid heeft verloren door
      het verstrijken van de geldigheidsduur, dan wel
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel33
  - number: 33.1.b.III
    text: indien de aanvrager niet in Nederland woonachtig is, een fotokopie van een van de onder I genoemde documenten.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel33
  - number: 33.1.c.I
    text: |-
      indien de aanvrager woonachtig is in Nederland en is ingeschreven aan een in Nederland gevestigde universiteit,
      school voor middelbaar, voortgezet of hoger beroepsonderwijs of andere school voor middelbaar, voortgezet of hoger
      onderwijs, een bewijs van inschrijving aan die universiteit of school;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel33
  - number: 33.1.c.II
    text: |-
      indien aan de aanvrager die vreemdeling in de zin van de [Vreemdelingenwet 2000][ref1] is, op grond van diens
      hoedanigheid van of betrekking tot diplomatiek of consulair personeel dan wel op grond van diens hoedanigheid van
      of betrekking tot personeel in dienst van een in Nederland gevestigde internationale organisatie door Onze Minister
      van Buitenlandse Zaken een identiteitsbewijs voor geprivilegieerden is verstrekt, een fotokopie van dat bewijs;


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 33.1.c.III
    text: |-
      indien de aanvrager lid is van een in het kader van het op 19 juni 1951 te Londen gesloten Verdrag tussen de Staten
      die partij zijn bij het Noord-Atlantisch Verdrag, nopens de rechtspositie van hun krijgsmachten, in Nederland
      gelegerde krijgsmacht, lid is van de tot die krijgsmacht behorende civiele dienst of behoort tot het gezin van
      een lid van een krijgsmacht als hiervoor bedoeld of tot het gezin van een tot de civiele dienst van zodanige
      krijgsmacht behorende persoon, een door de betrokken basiscommandant ondertekende verklaring waaruit zulks blijkt.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel33
  - number: 33.1.d
    text: een pasfoto van de aanvrager, die voldoet aan de bij ministeriële regeling vastgestelde eisen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel33
  - number: '33.2'
    text: |-
      Bij de aanvraag van een rijbewijs raadpleegt de met de afgifte van rijbewijzen belaste autoriteit de in de
      basisregistratie personen opgenomen persoonsgegevens van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel33
  - number: '34.1'
    text: |-
      Indien aan de aanvrager nog niet eerder een rijbewijs is afgegeven, dient ten behoeve van hem in het
      rijbewijzenregister te zijn geregistreerd:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel34
  - number: 34.1.a
    text: |-
      een verklaring van rijvaardigheid voor iedere rijbewijscategorie waarop de aanvraag betrekking heeft, waarbij de
      datum van registratie niet langer dan drie jaar vóór de aanvraag mag liggen;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel34
  - number: 34.1.b
    text: |-
      een verklaring van geschiktheid voor iedere rijbewijscategorie waarop de aanvraag betrekking heeft, waarbij de
      datum van registratie niet langer dan een jaar vóór de aanvraag mag liggen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel34
  - number: '34.2'
    text: |-
      Het eerste lid, onderdeel b, is niet van toepassing op aanvragen die betrekking hebben op afgifte van een rijbewijs
      voor de categorie AM.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel34
  - number: 34a.1
    text: |-
      Indien de aanvraag betrekking heeft op de afgifte van een rijbewijs C aan een aanvrager die de in
      [artikel 5, negende lid][ref1], bedoelde leeftijd heeft bereikt, en die een op het beroep van chauffeur
      goederenvervoer gerichte beroepsopleiding als bedoeld in de [Wet educatie en beroepsonderwijs][ref2] of een bij
      ministeriële regeling daaraan gelijkwaardig verklaarde opleiding volgt, dient ten behoeve van de aanvrager in het
      rijbewijzenregister te zijn geregistreerd:


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '5'
        hoofdstuk: I
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0007625
  - number: 34a.1.a
    text: |-
      een verklaring van rijvaardigheid voor iedere rijbewijscategorie waarop de aanvraag betrekking heeft, waarbij de
      datum van registratie niet langer dan drie jaar vóór de aanvraag mag liggen;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel34a
  - number: 34a.1.b
    text: |-
      een verklaring van geschiktheid voor iedere rijbewijscategorie waarop de aanvraag betrekking heeft, waarbij de
      datum van registratie niet langer dan een jaar vóór de aanvraag mag liggen;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel34a
  - number: 34a.1.c
    text: een verklaring van deelname aan een in de aanhef bedoelde opleiding.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel34a
  - number: 34a.2
    text: |-
      De aanvraag tot registratie van de in het eerste lid, onderdeel c, bedoelde verklaring wordt gedaan bij de Dienst
      Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel34a
  - number: 34a.3
    text: 'Bij de aanvraag van de in het eerste lid, onderdeel c, bedoelde verklaring overlegt de aanvrager:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel34a
  - number: 34a.3.I
    text: |-
      een door het bevoegd gezag van een op het beroep van chauffeur goederenvervoer gerichte beroepsopleiding als
      bedoeld in de [Wet educatie en beroepsonderwijs][ref1] of een bij ministeriële regeling daaraan gelijkwaardig
      verklaarde opleiding afgegeven gewaarmerkte verklaring waaruit blijkt sinds welke datum hij de opleiding volgt, en


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: 34a.3.II
    text: |-
      een geldig bewijs van inschrijving waaruit blijkt dat hij op het tijdstip van de aanvraag staat ingeschreven bij
      die opleiding.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel34a
  - number: '35.1'
    text: |-
      Indien de aanvraag betrekking heeft op de vernieuwing van het eerder aan de aanvrager afgegeven rijbewijs, dient
      bij de aanvraag aan de volgende vereisten te worden voldaan:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel35
  - number: 35.1.a
    text: |-
      behoudens de in [artikel 33][ref1] genoemde bescheiden wordt tevens dat eerder afgegeven rijbewijs overgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel33
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '33'
        hoofdstuk: II
        paragraaf: '2'
  - number: 35.1.b
    text: |-
      in het rijbewijzenregister is ten behoeve van de aanvrager een verklaring van geschiktheid geregistreerd, waarbij
      de datum van registratie niet langer dan een jaar vóór de aanvraag mag liggen, indien
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel35
  - number: 35.1.b.I
    text: |-
      de aanvraag mede betrekking heeft op een der rijbewijscategorieën C, C1, D, D1, E bij C, E bij C1, E bij D of E
      bij D1,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel35
  - number: 35.1.b.II
    text: de aanvrager de leeftijd van 75 jaren heeft bereikt,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel35
  - number: 35.1.b.III
    text: |-
      de aanvrager de leeftijd van 70 jaren heeft bereikt en in het bezit is van een rijbewijs waarvan de geldigheidsduur
      verstrijkt op of na de dag waarop hij de leeftijd van 75 jaren bereikt, dan wel
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel35
  - number: 35.1.b.IV
    text: |-
      blijkens een aantekening in het rijbewijzenregister naar het oordeel van het CBR de registratie van een dergelijke
      verklaring noodzakelijk is op grond van de bij het CBR bekend zijnde gegevens met betrekking tot de lichamelijke en
      geestelijke gesteldheid van de aanvrager, dan wel
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel35
  - number: 35.1.b.V
    text: |-
      blijkens een door het CBR ingevolge [artikel 124, tweede lid, van de wet][ref1] in het rijbewijzenregister
      aangebrachte aantekening de registratie van een dergelijke verklaring noodzakelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel124
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '124'
  - number: 35.1.c
    text: |-
      in het rijbewijzenregister is ten behoeve van de aanvrager een verklaring van rijvaardigheid geregistreerd, waarbij
      de datum van registratie niet langer dan drie jaar vóór de aanvraag mag liggen, indien blijkens een door het CBR
      ingevolge [artikel 124, tweede lid, van de wet][ref1] in het rijbewijzenregister aangebrachte aantekening een
      registratie van een dergelijke verklaring noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel124
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '124'
  - number: '35.2'
    text: |-
      Het eerste lid, onderdeel b, is niet van toepassing op aanvragen die betrekking hebben op afgifte van een rijbewijs
      voor de categorie AM.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel35
  - number: '35.3'
    text: |-
      Indien de aanvraag betrekking heeft op een rijbewijs voor de categorie AM, wordt onder rijbewijs in het eerste lid,
      onderdeel a, mede verstaan een rijbewijs afgegeven voor een of meer andere categorieën dan AM, dat is afgegeven na
      30 juni 1985 en dat zijn geldigheid heeft verloren door het verstrijken van de geldigheidsduur.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel35
  - number: '35.4'
    text: |-
      Het eerste lid, onderdeel b, is niet van toepassing voor zover de aanvraag strekt ter vervanging van een eerder
      aan de aanvrager afgegeven rijbewijs van een of meer van de categorieën C, C1, D, D1, E bij C, E bij C1, E bij
      D en E bij D1, en de aanvraag uitsluitend verband houdt met de vermelding op het af te geven rijbewijs van een
      getuigschrift van vakbekwaamheid of een getuigschrift van nascholing.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel35
  - number: '35.5'
    text: |-
      Indien de aanvraag betrekking heeft op de vermelding op het af te geven rijbewijs van een getuigschrift
      van vakbekwaamheid dan wel een getuigschrift van nascholing, dient ten behoeve van de aanvrager in het
      rijbewijzenregister een verklaring van vakbekwaamheid dan wel een verklaring van nascholing geregistreerd te zijn,
      waarbij de datum van registratie niet langer dan vijf jaren vóór de aanvraag mag liggen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel35
  - number: '36.1'
    text: |-
      Indien de aanvraag betrekking heeft op de afgifte van een rijbewijs dat geldig is voor meer categorieën dan het
      eerder aan de aanvrager afgegeven rijbewijs, dient bij de aanvraag aan de volgende vereisten te worden voldaan:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel36
  - number: 36.1.a
    text: |-
      behoudens de in [artikel 33][ref1] genoemde bescheiden wordt tevens dat eerder afgegeven rijbewijs overgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel33
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '33'
        hoofdstuk: II
        paragraaf: '2'
  - number: 36.1.b
    text: |-
      in het rijbewijzenregister is ten behoeve van de aanvrager een verklaring van rijvaardigheid geregistreerd voor
      iedere rijbewijscategorie waarop de aanvraag betrekking heeft en waarvoor het eerder aan de aanvrager afgegeven
      rijbewijs niet geldig is, waarbij de datum van registratie niet langer dan drie jaar vóór de aanvraag mag liggen;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel36
  - number: 36.1.c
    text: |-
      in het rijbewijzenregister is ten behoeve van de aanvrager een verklaring van geschiktheid geregistreerd, waarbij
      de datum van registratie niet langer dan een jaar vóór de aanvraag mag liggen, voor iedere rijbewijscategorie
      waarop de aanvraag betrekking heeft en waarvoor het eerder aan de aanvrager afgegeven rijbewijs niet geldig is, met
      uitzondering van de rijbewijscategorie AM.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel36
  - number: '36.2'
    text: |-
      Indien de aanvraag tevens betrekking heeft op de vermelding op het af te geven rijbewijs van een getuigschrift
      van vakbekwaamheid dan wel een getuigschrift van nascholing, dient ten behoeve van de aanvrager in het
      rijbewijzenregister een verklaring van vakbekwaamheid dan wel een verklaring van nascholing geregistreerd te zijn,
      waarbij de datum van registratie niet langer dan vijf jaren vóór de aanvraag mag liggen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel36
  - number: '37'
    text: |-
      Voor de toepassing van de [artikelen 34][ref1] en [36][ref2] wordt met een niet langer dan drie jaar vóór
      de aanvraag in het rijbewijzenregister geregistreerde verklaring van rijvaardigheid gelijkgesteld een door
      het daartoe bevoegde militaire gezag niet langer dan drie jaar voor de aanvraag in het rijbewijzenregister
      geregistreerde verklaring van rijvaardigheid voor het besturen van motorrijtuigen van de rijbewijscategorie of
      rijbewijscategorieën waarop de aanvraag betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel36
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '34'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008074
        artikel: '36'
        hoofdstuk: II
        paragraaf: '2'
  - number: '38.1'
    text: |-
      Indien de aanvraag betrekking heeft op de afgifte van een rijbewijs ter vervanging van een eerder aan de aanvrager
      afgegeven rijbewijs dat nog geldig is hetzij zijn geldigheid door het verstrijken van de geldigheidsduur heeft
      verloren, welk rijbewijs versleten of geheel of ten dele onleesbaar is, dient, behoudens de in [artikel 33][ref1]
      genoemde bescheiden, bij de aanvraag tevens dat versleten of geheel of ten dele onleesbare rijbewijs te worden
      overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel33
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '33'
        hoofdstuk: II
        paragraaf: '2'
  - number: '38.2'
    text: |-
      Voor de toepassing van het eerste lid wordt onder een eerder aan de aanvrager afgegeven rijbewijs mede verstaan een
      rijbewijs dat eerder aan de aanvrager is afgegeven door het daartoe bevoegde gezag in een andere lid-staat van de
      Europese Gemeenschap of in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte of Zwitserland.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel38
  - number: '39.1'
    text: |-
      Indien de aanvraag betrekking heeft op de afgifte van een vervangend rijbewijs ter vervanging van een eerder aan de
      aanvrager afgegeven rijbewijs dat nog geldig is hetzij zijn geldigheid door het verstrijken van de geldigheidsduur
      heeft verloren, welk rijbewijs verloren geraakt of teniet gegaan is, wordt, behoudens de in [artikel 33][ref1]
      genoemde bescheiden, bij de aanvraag tevens een proces-verbaal ter zake van vermissing of diefstal van het
      rijbewijs overgelegd, dat in Nederland op ambtseed is opgemaakt door een daartoe bevoegd algemeen of buitengewoon
      opsporingsambtenaar; in het proces-verbaal worden de omstandigheden omschreven waaronder het rijbewijs verloren is
      geraakt of teniet is gegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel33
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '33'
        hoofdstuk: II
        paragraaf: '2'
  - number: '39.2'
    text: |-
      Indien de in het eerste lid bedoelde aanvrager woonachtig is buiten Nederland dan wordt bij de aanvraag een door de
      aanvrager ondertekende verklaring van een door de Dienst Wegverkeer vastgesteld model overgelegd. In de verklaring
      worden tevens de omstandigheden omschreven waaronder het rijbewijs verloren is geraakt of teniet is gegaan.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel39
  - number: '39.3'
    text: |-
      Indien de aanvraag betrekking heeft op de afgifte van een nieuw rijbewijs ter vervanging van een eerder aan de
      aanvrager afgegeven rijbewijs dat nog geldig is hetzij zijn geldigheid door het verstrijken van de geldigheidsduur
      heeft verloren, welk rijbewijs verloren geraakt of teniet gegaan is, dienen de in de voorgaande leden genoemde
      bescheiden te worden overgelegd en is [artikel 35, eerste lid, onderdeel b en c, en derde en vierde lid][ref1],
      van toepassing op de aanvragen die betrekking hebben op een rijbewijs voor andere categorieën dan AM en
      [artikel 35, eerste lid, onderdeel c][ref2], indien het een aanvraag voor een rijbewijs voor de categorie AM
      betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel35
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '35'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008074
        artikel: '35'
        hoofdstuk: II
        paragraaf: '2'
  - number: '40.1'
    text: |-
      Indien de aanvraag betrekking heeft op de afgifte van een rijbewijs in verband met een wijziging van de
      geslachtsnaam, de voornamen, de plaats of datum van geboorte dan wel het geslacht van de aanvrager, dient bij de
      aanvraag aan de volgende vereisten te worden voldaan:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel40
  - number: 40.1.a
    text: |-
      behoudens de in [artikel 33][ref1] genoemde bescheiden wordt tevens het eerder afgegeven rijbewijs overgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel33
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '33'
        hoofdstuk: II
        paragraaf: '2'
  - number: 40.1.b
    text: |-
      in het rijbewijzenregister is ten behoeve van de aanvrager een verklaring van geschiktheid geregistreerd, waarbij
      de datum van registratie niet langer dan een jaar vóór de aanvraag mag liggen, indien
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel40
  - number: 40.1.b.I
    text: |-
      de aanvraag mede betrekking heeft op een der rijbewijscategorieën C, C1, D, D1, E bij C, E bij C1, E bij D of E
      bij D1,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel40
  - number: 40.1.b.II
    text: de aanvrager de leeftijd van 75 jaren heeft bereikt,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel40
  - number: 40.1.b.III
    text: |-
      de aanvrager de leeftijd van 70 jaren heeft bereikt en in het bezit is van een rijbewijs waarvan de geldigheidsduur
      verstrijkt op of na de dag waarop hij de leeftijd van 75 jaren bereikt, dan wel
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel40
  - number: 40.1.b.IV
    text: |-
      blijkens een aantekening in het rijbewijzenregister naar het oordeel van het CBR de registratie van een dergelijke
      verklaring noodzakelijk is op grond van de bij het CBR bekend zijnde gegevens met betrekking tot de lichamelijke en
      geestelijke geschiktheid van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel40
  - number: '40.2'
    text: |-
      Het eerste lid, onderdeel b, is niet van toepassing op aanvragen die betrekking hebben op afgifte van een rijbewijs
      voor de categorie AM.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel40
  - number: '40.3'
    text: |-
      Voor de toepassing van het eerste lid wordt onder het eerder aan de aanvrager afgegeven rijbewijs mede verstaan
      het eerder door het daartoe bevoegde gezag in een andere lid-staat van de Europese Gemeenschap of in een andere
      staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland aan de aanvrager
      afgegeven rijbewijs.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel40
  - number: '41.1'
    text: |-
      Indien de aanvraag betrekking heeft op de afgifte van een rijbewijs dat geldig is voor een categorie of categorieën
      waarop de ongeldigverklaring van een eerder aan de aanvrager afgegeven rijbewijs geen betrekking heeft, dient,
      behoudens de in [artikel 33][ref1] genoemde bescheiden, bij de aanvraag tevens het eerder aan de aanvrager
      afgegeven rijbewijs te worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel33
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '33'
        hoofdstuk: II
        paragraaf: '2'
  - number: '41.2'
    text: |-
      Voor de toepassing van het eerste lid wordt onder een eerder aan de aanvrager afgegeven rijbewijs,
      onderscheidenlijk het eerder aan de aanvrager afgegeven rijbewijs, mede verstaan een rijbewijs dat eerder aan
      de aanvrager is afgegeven door het daartoe bevoegde gezag in een andere lid-staat van de Europese Gemeenschap of
      in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland,
      onderscheidenlijk het eerder door dat gezag aan de aanvrager afgegeven rijbewijs.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41
  - number: 41a.1
    text: |-
      Indien aan de aanvrager overeenkomstig [artikel 118, derde lid, van de wet][ref1] dan wel op grond van de
      [artikelen 132b, eerste lid][ref2], of [134, zevende lid, van de wet][ref3], de verplichting is opgelegd tot
      deelname aan het alcoholslotprogramma en zijn rijbewijs op grond van artikel 132b, tweede lid, van de wet
      ongeldig is verklaard, vindt de aanvraag tot afgifte van een rijbewijs dat geldig is voor de categorie B, dan
      wel de categorieën B en E bij B, met de voor deelname aan het alcoholslotprogramma vastgestelde codering plaats
      overeenkomstig de [artikelen 41a][ref4] en [41b][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel118
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel132b
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel134
      [ref4]: https://wetten.overheid.nl/BWBR0008074#Artikel41a
      [ref5]: https://wetten.overheid.nl/BWBR0008074#Artikel41b
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '118'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 132b
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '134'
      - id: ref4
        bwb_id: BWBR0008074
        artikel: 41a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0008074
        artikel: 41b
        hoofdstuk: II
        paragraaf: '2'
  - number: 41a.2
    text: 'Bij de aanvraag, bedoeld in het eerste lid, dient aan de volgende eisen te worden voldaan:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41a
  - number: 41a.2.a
    text: |-
      de in [artikel 33][ref1] genoemde bescheiden worden overgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel33
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '33'
        hoofdstuk: II
        paragraaf: '2'
  - number: 41a.2.b
    text: |-
      het ongeldig verklaarde rijbewijs wordt overgelegd, tenzij uit het rijbewijzenregister blijkt dat het reeds is
      ingeleverd;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41a
  - number: 41a.2.c
    text: |-
      in het rijbewijzenregister is ten aanzien van de aanvrager een verklaring van geschiktheid geregistreerd voor de
      rijbewijscategorie B, waarbij de datum van de aanvraag van die verklaring moet liggen na de datum van het besluit
      tot oplegging van de verplichting tot deelname aan het alcoholslotprogramma, en de datum van registratie van die
      verklaring niet langer dan een jaar vóór de aanvraag van het rijbewijs mag liggen;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41a
  - number: 41a.2.d
    text: |-
      indien het ongeldig verklaarde rijbewijs mede was afgegeven voor de rijbewijscategorie E bij B en de aanvraag
      mede betrekking heeft op deze rijbewijscategorie, is in het rijbewijzenregister ten aanzien van de aanvrager
      tevens een verklaring van geschiktheid geregistreerd voor deze categorie, waarbij de datum van de aanvraag van
      die verklaring moet liggen na de datum van het besluit tot oplegging van de verplichting tot deelname aan het
      alcoholslotprogramma, en de datum van registratie van die verklaring niet langer dan een jaar vóór de aanvraag van
      het rijbewijs mag liggen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41a
  - number: 41a.3
    text: |-
      In aanvulling op het tweede lid dient ten aanzien van de aanvrager in het rijbewijzenregister een verklaring
      van rijvaardigheid voor de categorie B, dan wel voor de categorieën B en E bij B, te zijn geregistreerd, waarbij
      de datum van de aanvraag van die verklaring moet liggen na het besluit tot oplegging van de verplichting tot
      deelname aan het alcoholslotprogramma, en de datum van registratie van die verklaring niet langer dan drie jaar
      vóór de aanvraag van het rijbewijs mag liggen, indien het rijbewijs bedoeld in het tweede lid, onderdeel b, een
      rijbewijs betreft als bedoeld in respectievelijk de [artikelen 44, eerste lid][ref1], [45, eerste lid][ref2],
      [46, eerste lid][ref3], [47, eerste lid][ref4], of [48, eerste lid][ref5], en dit rijbewijs niet voldoet aan de in
      respectievelijk de artikelen 44, 45, 46, 47 of 48 voor omwisseling gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0008074#Artikel46
      [ref4]: https://wetten.overheid.nl/BWBR0008074#Artikel47
      [ref5]: https://wetten.overheid.nl/BWBR0008074#Artikel48
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '44'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008074
        artikel: '45'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0008074
        artikel: '46'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0008074
        artikel: '47'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0008074
        artikel: '48'
        hoofdstuk: II
        paragraaf: '2'
  - number: 41a.4
    text: |-
      Voor de toepassing van het derde lid wordt met de daar bedoelde verklaring van rijvaardigheid gelijkgesteld een
      door het daartoe bevoegde militaire gezag niet langer dan drie jaar voor de aanvraag in het rijbewijzenregister
      geregistreerde verklaring van rijvaardigheid voor het besturen van motorrijtuigen van de rijbewijscategorie of
      rijbewijscategorieën waarop de aanvraag betrekking heeft, waarbij de datum van de aanvraag van die verklaring moet
      liggen na het besluit tot oplegging van de verplichting tot deelname aan het alcoholslotprogramma.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41a
  - number: 41a.5
    text: |-
      Indien het over te leggen rijbewijs wegens vermissing of diefstal niet kan worden overgelegd, worden in plaats
      daarvan de volgende documenten overgelegd:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41a
  - number: 41a.5.a
    text: |-
      een proces-verbaal ter zake van vermissing of diefstal, in Nederland op ambtseed opgemaakt door de daartoe bevoegde
      algemeen of buitengewoon opsporingsambtenaar, waarin de omstandigheden waaronder het rijbewijs verloren is geraakt
      of teniet is gegaan, worden omschreven;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41a
  - number: 41a.5.b
    text: |-
      indien het over te leggen rijbewijs een rijbewijs betreft afgegeven door het daartoe bevoegde gezag buiten
      Nederland, een door dat gezag afgegeven gewaarmerkte verklaring waaruit van de afgifte en de geldigheid blijkt
      en waaruit tevens blijkt dat door dat gezag jegens de aanvrager geen maatregelen van bestuursrechtelijke of
      strafrechtelijke aard betreffende de beperking, schorsing, intrekking of nietigverklaring van de rijbevoegdheid
      zijn getroffen en dat bij dat gezag ook overigens geen bezwaar tegen afgifte van een rijbewijs bestaat.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41a
  - number: 41a.6
    text: |-
      Door een besluit als bedoeld in [artikel 132b, eerste lid, van de wet][ref1] vervallen verklaringen van
      geschiktheid die zijn geregistreerd voor dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132b
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132b
  - number: 41a.7
    text: |-
      Indien de in het eerste lid bedoelde aanvrager niet aan de in het tweede lid, onderdeel c, bedoelde
      eis voldoet, kan hem een rijbewijs voor de categorie AM worden afgegeven. Indien het op grond van
      [artikel 132b, tweede lid, van de wet][ref1] ongeldig verklaarde rijbewijs een rijbewijs is als bedoeld in het
      derde lid, dient ten aanzien van de aanvrager wel een verklaring van rijvaardigheid voor de rijbewijscategorie AM
      te zijn geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132b
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132b
  - number: 41b.1
    text: |-
      Indien ten aanzien van de in [artikel 41a, eerste lid][ref1], bedoelde aanvrager de in
      [artikel 123b, eerste lid, van de wet][ref2] bedoelde rechterlijke uitspraak onherroepelijk is geworden, dient,
      naast de in artikel 41a, tweede lid, gestelde eisen, te worden voldaan aan de volgende eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel41a
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel123b
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41b
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 41a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 123b
  - number: 41b.1.a
    text: |-
      de in [artikel 42b, tweede lid, onderdeel b][ref1], bedoelde verklaring dient te worden overgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel42b
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41b
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 42b
        hoofdstuk: II
        paragraaf: '2'
  - number: 41b.1.b
    text: |-
      in het rijbewijzenregister dient een verklaring van rijvaardigheid te zijn geregistreerd voor de rijbewijscategorie
      of rijbewijscategorieën waarop de aanvraag bedoeld in [artikel 41a, eerste lid][ref1], betrekking heeft,
      waarbij de datum van de aanvraag van die verklaring of die verklaringen moet liggen na het tijdstip waarop de
      in [artikel 123b, eerste lid, van de wet][ref2] bedoelde uitspraak onherroepelijk is geworden en de datum van
      registratie van die verklaring of die verklaringen niet langer dan drie jaar voor de aanvraag mag liggen.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel41a
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel123b
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41b
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 41a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 123b
  - number: 41b.2
    text: |-
      De [artikelen 42b, vierde, vijfde en zevende lid][ref1], en [42c tot en met 42e][ref2] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel42b
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel42c
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41b
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 42b
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008074
        artikel: 42c
        hoofdstuk: II
        paragraaf: '2'
  - number: 41c.1
    text: |-
      Nadat ten aanzien van de aanvrager overeenkomstig [artikel 132d, eerste of derde lid, van de wet][ref1] door
      het CBR is geregistreerd dat de op het alcoholslotprogramma betrekking hebbende codering is vervallen, vindt
      een aanvraag tot afgifte van een rijbewijs zonder de voor het alcoholslotprogramma vastgestelde codering plaats
      overeenkomstig de [artikelen 41c][ref2] en [41d][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132d
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel41c
      [ref3]: https://wetten.overheid.nl/BWBR0008074#Artikel41d
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41c
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132d
      - id: ref2
        bwb_id: BWBR0008074
        artikel: 41c
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0008074
        artikel: 41d
        hoofdstuk: II
        paragraaf: '2'
  - number: 41c.2
    text: 'De aanvraag, bedoeld in het eerste lid, kan worden gedaan voor de volgende rijbewijscategorieën:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41c
  - number: 41c.2.a
    text: |-
      alle, dan wel een of meerdere categorieën waarvoor het eerder afgegeven rijbewijs tot het tijdstip van de
      ongeldigverklaring, bedoeld in [artikel 132b, tweede lid, van de wet][ref1], geldig was;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132b
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41c
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132b
  - number: 41c.2.b
    text: |-
      alle, dan wel een of meerdere categorieën die al voor het in de onderdeel a bedoelde tijdstip van de
      ongeldigverklaring, bedoeld in [artikel 132b, tweede lid, van de wet][ref1] ongeldig zijn verklaard


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132b
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41c
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132b
  - number: 41c.2.b.I
    text: |-
      wegens het niet verlenen van de vereiste medewerking aan een lichte educatieve maatregel alcohol en verkeer, een
      educatieve maatregel alcohol en verkeer of een onderzoek naar de geschiktheid,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41c
  - number: 41c.2.b.II
    text: |-
      wegens gebleken ongeschiktheid na een onderzoek naar de geschiktheid als bedoeld in
      [artikel 131, eerste lid, van de wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41c
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
  - number: 41c.2.b.III
    text: |-
      op grond van [artikel 124, eerste lid, onderdeel d, van de wet][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel124
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41c
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '124'
  - number: 41c.2.b.IV
    text: |-
      indien betrokkene bij een aanvraag tot vernieuwing van het eerder aan de aanvrager afgegeven rijbewijs door
      het niet aanvragen van de vereiste verklaring van geschiktheid heeft afgezien van vernieuwing van een of meer
      categorieën.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41c
  - number: 41c.3
    text: |-
      Bij de aanvraag van een rijbewijs in de in het tweede lid bedoelde gevallen dient te zijn voldaan aan de volgende
      eisen:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41c
  - number: 41c.3.a
    text: |-
      de aanvrager overlegt, behoudens de in [artikel 33][ref1] genoemde bescheiden, tevens het aan hem afgegeven
      rijbewijs met de voor deelname aan het alcoholslotprogramma vastgestelde codering;


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel33
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41c
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '33'
        hoofdstuk: II
        paragraaf: '2'
  - number: 41c.3.b
    text: |-
      in het rijbewijzenregister is ten aanzien van de aanvrager een verklaring van geschiktheid geregistreerd voor de
      categorie of categorieën, bedoeld in het tweede lid, waarop de aanvraag betrekking heeft, met uitzondering van de
      categorie AM, waarbij de datum van registratie niet langer dan een jaar vóór de aanvraag mag liggen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41c
  - number: 41c.4
    text: |-
      Indien het rijbewijs wegens vermissing of diefstal niet kan worden overgelegd, wordt in plaats daarvan overgelegd
      een proces-verbaal ter zake van vermissing of diefstal, in Nederland op ambtseed opgemaakt door een daartoe bevoegd
      algemeen of buitengewoon opsporingsambtenaar, waarin de omstandigheden waaronder het rijbewijs verloren is geraakt
      of teniet is gegaan, worden omschreven.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41c
  - number: 41d.1
    text: |-
      Indien ten aanzien van de in [artikel 41c, eerste lid][ref1], bedoelde aanvrager de in
      [artikel 123b, eerste lid, van de wet][ref2] bedoelde rechterlijke uitspraak onherroepelijk is geworden, dient,
      naast de in [artikel 41c, derde lid, onderdelen a en b][ref3], gestelde eisen, bij de aanvraag:


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel41c
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel123b
      [ref3]: https://wetten.overheid.nl/BWBR0008074#Artikel41c
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41d
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 41c
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 123b
      - id: ref3
        bwb_id: BWBR0008074
        artikel: 41c
        hoofdstuk: II
        paragraaf: '2'
  - number: 41d.1.a
    text: |-
      ten aanzien van de aanvrager in het rijbewijzenregister een verklaring van rijvaardigheid te zijn geregistreerd
      voor de zwaarste categorie die op de in [artikel 42b, tweede lid, onderdeel b][ref1], bedoelde verklaring is
      vermeld en waarop de aanvraag betrekking heeft, waarbij de datum van registratie niet langer dan drie jaar
      vóór de aanvraag mag liggen en waarbij de datum van de aanvraag tevens moet liggen na de datum waarop de in
      [artikel 123b, eerste lid, van de wet][ref2] bedoelde uitspraak onherroepelijk is geworden;


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel42b
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel123b
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41d
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 42b
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 123b
  - number: 41d.1.b
    text: |-
      ten aanzien van de aanvrager een verklaring van geschiktheid te zijn geregistreerd voor elke rijbewijscategorie
      waarop de aanvraag betrekking heeft, waarbij:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41d
  - number: 41d.1.b.I
    text: |-
      de datum van de aanvraag van die verklaring moet liggen na de datum van het besluit, bedoeld in
      [artikel 132d, eerste of derde lid, van de wet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132d
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41d
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132d
  - number: 41d.1.b.II
    text: de datum van registratie niet langer dan een jaar voor de aanvraag mag liggen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41d
  - number: 41d.2
    text: |-
      Het eerste lid, onderdeel a, geldt niet indien de zwaarste rijbewijscategorie waarop de aanvraag betrekking heeft
      de rijbewijscategorie B respectievelijk BE, of AM betreft.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41d
  - number: 41d.3
    text: |-
      [Artikel 41c, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel41c
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41d
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 41c
        hoofdstuk: II
        paragraaf: '2'
  - number: 41d.4
    text: |-
      Indien ten tijde van de aanvraag, bedoeld in [artikel 41c, eerste lid][ref1], de in
      [artikel 42b, tweede lid, onderdeel c, onder I][ref2], bedoelde verklaring van rijvaardigheid zijn geldigheid heeft
      verloren, kan alleen een rijbewijs worden aangevraagd voor de rijbewijscategorie of rijbewijscategorieën waarvoor
      het rijbewijs met de voor deelname aan het alcoholslotprogramma vastgestelde codering was afgegeven, alsmede voor
      de categorie AM.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel41c
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel42b
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel41d
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 41c
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008074
        artikel: 42b
        hoofdstuk: II
        paragraaf: '2'
  - number: '42.1'
    text: Indien de aanvraag betrekking heeft op de afgifte van
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel42
  - number: 42.1.a
    text: |-
      een rijbewijs dat geldig is voor een categorie of categorieën waarvoor een eerder aan de aanvrager afgegeven
      rijbewijs bij gebreke van de in [artikel 132, eerste lid, van de wet][ref1] bedoelde medewerking aan een
      educatieve maatregel gericht op de geschiktheid of aan een onderzoek naar de geschiktheid als bedoeld in
      [artikel 131, eerste lid, van de wet][ref2], of in verband met een gevorderd of een op verzoek van de aanvrager
      uitgevoerd onderzoek naar diens geschiktheid tot het besturen van motorrijtuigen ongeldig is verklaard,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '132'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '131'
  - number: 42.1.b
    text: |-
      een rijbewijs waarvan de geldigheidsduur betrekking heeft of mede betrekking heeft op een periode waarvoor een
      eerder aan de aanvrager afgegeven rijbewijs in verband met een gevorderd of een op verzoek van de aanvrager
      uitgevoerd onderzoek naar diens geschiktheid tot het besturen van motorrijtuigen ongeldig is verklaard dan wel
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel42
  - number: 42.1.c
    text: een rijbewijs met een kortere geldigheidsduur dan het eerder aan de aanvrager afgegeven rijbewijs,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel42
  - number: '42.2'
    text: Indien de aanvraag betrekking heef op de afgifte van
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel42
  - number: 42.2.a
    text: |-
      een rijbewijs dat geldig is voor een categorie of categorieën waarvoor een eerder aan de aanvrager afgegeven
      rijbewijs bij gebreke van de in [artikel 132, eerste lid, van de wet][ref1] bedoelde medewerking aan een
      educatieve maatregel gericht op de rijvaardigheid of aan een onderzoek naar de rijvaardigheid als bedoeld in
      [artikel 131, eerste lid, van de wet][ref2], in verband met een gevorderd of een op verzoek van de aanvrager
      uitgevoerd onderzoek naar diens rijvaardigheid tot het besturen van motorrijtuigen ongeldig is verklaard dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '132'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '131'
  - number: 42.2.b
    text: |-
      een rijbewijs dat geldig is voor een categorie of categorieën waarvoor een eerder aan de aanvrager afgegeven
      rijbewijs op grond van [artikel 124, eerste lid, onderdeel a, b of c, van de wet][ref1] ongeldig is verklaard,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel124
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '124'
  - number: '42.3'
    text: |-
      Indien de aanvraag betrekking heeft op de afgifte van een vervangend rijbewijs dat geldig is voor dezelfde
      categorieën waarvoor een eerder aan de aanvrager afgegeven rijbewijs geldig was waarop een getuigschrift van
      vakbekwaamheid of een getuigschrift van nascholing was vermeld die op grond van [artikel 124a van de wet][ref1]
      ongeldig is verklaard, dient, behoudens de in [artikel 33][ref2] genoemde bescheiden, tevens het eerder aan de
      aanvrager afgegeven rijbewijs te worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel124a
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel33
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 124a
      - id: ref2
        bwb_id: BWBR0008074
        artikel: '33'
        hoofdstuk: II
        paragraaf: '2'
  - number: '42.4'
    text: |-
      Indien de aanvraag betrekking heeft op de afgifte van een vervangend rijbewijs dat geldig is voor dezelfde
      categorieën waarvoor een eerder aan de aanvrager afgegeven rijbewijs geldig was waarop een getuigschrift van
      vakbekwaamheid of een getuigschrift van nascholing was vermeld die op grond van [artikel 124a van de wet][ref1]
      ongeldig is verklaard, dient, behoudens de in [artikel 33][ref2] genoemde bescheiden, tevens het eerder aan de
      aanvrager afgegeven rijbewijs te worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel124a
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel33
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 124a
      - id: ref2
        bwb_id: BWBR0008074
        artikel: '33'
        hoofdstuk: II
        paragraaf: '2'
  - number: '42.5'
    text: |-
      Indien de aanvraag betrekking heeft op de afgifte van een nieuw rijbewijs dat geldig is voor dezelfde categorieën
      waarvoor een eerder aan de aanvrager afgegeven rijbewijs geldig was waarop een getuigschrift van vakbekwaamheid
      of een getuigschrift van nascholing was vermeld die op grond van [artikel 124a van de wet][ref1] ongeldig is
      verklaard, dient, behoudens de in [artikel 33][ref2] genoemde bescheiden, tevens het eerder aan de aanvrager
      afgegeven rijbewijs te worden overgelegd en dient in het rijbewijzenregister ten behoeve van de aanvrager een
      verklaring van geschiktheid te zijn geregistreerd, waarbij de datum van registratie niet langer dan een jaar vóór
      de aanvraag mag liggen, indien


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel124a
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel33
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 124a
      - id: ref2
        bwb_id: BWBR0008074
        artikel: '33'
        hoofdstuk: II
        paragraaf: '2'
  - number: 42.5.a
    text: |-
      de aanvraag mede betrekking heeft op een der rijbewijscategorieën C, C1, D, D1, E bij C, E bij C1, E bij D en E
      bij D1,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel42
  - number: 42.5.b
    text: de aanvrager de leeftijd van 75 jaren heeft bereikt,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel42
  - number: 42.5.c
    text: |-
      de aanvrager de leeftijd van 70 jaren heeft bereikt en in het bezit is van een rijbewijs waarvan de geldigheidsduur
      verstrijkt op of na de dag waarop hij de leeftijd van 75 jaren bereikt, dan wel
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel42
  - number: 42.5.d
    text: |-
