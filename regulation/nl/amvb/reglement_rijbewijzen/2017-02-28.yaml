  - number: 67c.5
    text: 'Het tweede lid geldt niet, indien de aanvrager aantoont dat hij op de datum van het praktijkexamen:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel67c
  - number: 67c.5.a
    text: ten minste twee jaar in het bezit is van een geldig rijbewijs A2,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel67c
  - number: 67c.5.b
    text: |-
      ten minste twee jaar in het bezit is van een geldig rijbewijs A2, afgegeven door het daartoe bevoegde gezag in
      een andere lidstaat van de Europese Unie of in een andere staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte of Zwitserland,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel67c
  - number: 67c.5.c
    text: |-
      in het bezit is van een geldig rijbewijs A dat slechts geldig is voor het besturen van motorrijtuigen van die
      categorie met automatische schakeling, of
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel67c
  - number: 67c.5.d
    text: |-
      in het bezit is van een geldig rijbewijs A, afgegeven door het daartoe bevoegde gezag in een andere lidstaat van de
      Europese Unie of in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte
      of Zwitserland, dat slechts geldig is voor het besturen van motorrijtuigen van deze categorie met automatische
      schakeling.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel67c
  - number: 67d.1
    text: 'Voor de toelating tot het praktijkexamen voor de rijbewijscategorie B moet zijn voldaan aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel67d
  - number: 67d.1.a
    text: |-
      de aanvrager dient niet langer dan een jaar en zes maanden voor de dag van het praktijkexamen te zijn geslaagd voor
      het theorie-examen voor deze categorie of een van de volgende documenten over te leggen:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel67d
  - number: 67d.1.a.1°
    text: |-
      een rijbewijs B, dat slechts geldig is voor het besturen van motorrijtuigen van deze categorie met automatische
      schakeling, dat hetzij nog geldig is hetzij zijn geldigheid heeft verloren door het verstrijken van de
      geldigheidsduur, of
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel67d
  - number: 67d.1.a.2°
    text: |-
      een geldig rijbewijs B afgegeven door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of in
      een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, dat
      slechts geldig is voor het besturen van motorrijtuigen van deze categorie met automatische schakeling;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel67d
  - number: 67d.1.b
    text: |-
      de aanvrager dient bij de aanvraag een op zijn naam gesteld identiteitsbewijs als bedoeld in
      [artikel 1, eerste lid, onder 1°, 2° of 3°, van de Wet op de identificatieplicht][ref1] over te leggen, dan wel
      een eerder aan de aanvrager afgegeven rijbewijs dat hetzij nog geldig is hetzij zijn geldigheid heeft verloren door
      het verstrijken van de geldigheidsduur.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel67d
    references:
