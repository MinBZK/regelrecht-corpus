      dat slechts geldig is voor het besturen van motorrijtuigen van deze categorie met automatische schakeling;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
  - number: 7.2.f.7°
    text: een geldig rijbewijs B;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
  - number: 7.2.f.8°
    text: |-
      een geldig rijbewijs B, afgegeven door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of in
      een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
  - number: 7.2.g
    text: |-
      degene aan wie rijonderricht wordt gegeven voor de rijbewijscategorie A, dient in het bezit te zijn van een van de
      volgende documenten:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
  - number: 7.2.g.I
    text: 'indien hij de leeftijd van 24 jaren nog niet heeft bereikt:'
