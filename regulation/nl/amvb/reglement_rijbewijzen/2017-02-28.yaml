  - number: '187'
    text: |-
      Voor de toepassing van de [artikelen 67, onderdeel b][ref1], [67a, eerste lid, onderdeel b][ref2],
      [67c, eerste lid, onderdeel b][ref3], [67d, eerste lid, onderdeel b, en derde lid, onderdeel b][ref4],
      [67e, eerste lid, onderdeel c, en vierde lid, onderdeel b][ref5],
      [67f, eerste lid, onderdeel c, en vijfde lid, onderdeel b][ref6],
      [67g, eerste lid, onderdeel c, en vierde lid, onderdeel b][ref7],
      [67h, eerste lid, onderdeel c, en vijfde lid, onderdeel b][ref8], wordt onder een rijbewijs dat zijn geldigheid
      heeft verloren door het verstrijken van de geldigheidsduur mede verstaan een op basis van de Wegenverkeerswet
      afgegeven rijbewijs dat op het moment van de aanvraag zijn geldigheid heeft verloren door het verstrijken van de
      geldigheidsduur en dat niet behoort tot een bij ministeriële regeling aangewezen model.


