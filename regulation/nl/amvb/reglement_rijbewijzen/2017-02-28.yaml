        hoofdstuk: II
        paragraaf: '2'
  - number: '54'
    text: |-
      Het voor de aanvraag van een verklaring van rijvaardigheid verschuldigde tarief dient vóór de indiening van de
      aanvraag te zijn voldaan door overmaking op een door het CBR aangewezen bankrekening.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel54
  - number: '55.1'
    text: De aanvraag geschiedt op de door het CBR vastgestelde wijze.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel55
  - number: '55.2'
    text: 'Bij de aanvraag dienen te worden overgelegd:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel55
  - number: 55.2.a
    text: een volledig ingevuld aanvraagformulier volgens door het CBR vastgesteld model;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel55
  - number: 55.2.b.I
    text: |-
      indien aan de aanvrager in Nederland de status van diplomatiek of consulair ambtenaar is toegekend of de aanvrager
      behoort tot het gezin van een persoon aan wie in Nederland de status van diplomatiek of consulair ambtenaar is
      toegekend, een door Onze Minister van Buitenlandse Zaken afgegeven verklaring waaruit zulks blijkt;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel55
  - number: 55.2.b.II
    text: |-
      indien de aanvrager lid is van een in het kader van het op 19 juni 1951 te Londen gesloten Verdrag tussen de Staten
      die partij zijn bij het Noord-Atlantisch Verdrag, nopens de rechtspositie van hun krijgsmachten, in Nederland
      gelegerde krijgsmacht, lid is van de tot die krijgsmacht behorende civiele dienst of behoort tot het gezin van
      een lid van een krijgsmacht als hiervoor bedoeld of tot het gezin van een tot de civiele dienst van zodanige
      krijgsmacht behorende persoon, een door de betrokken basiscommandant ondertekende verklaring waaruit zulks blijkt;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel55
  - number: 55.2.c
    text: |-
      indien de aanvraag wordt gedaan met het oog op de aanvraag van een rijbewijs als bedoeld in de
      [artikelen 42b, eerste lid][ref1], of [42d, eerste lid][ref2], dient de aanvrager tevens te overleggen de in
      artikel 42b, tweede lid, onderdeel b, bedoelde verklaring;


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel42b
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel42d
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel55
    references:
      - id: ref1
