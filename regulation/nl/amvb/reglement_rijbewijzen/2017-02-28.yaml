    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel151
  - number: '152.1'
    text: 'De Dienst Wegverkeer verwerkt in het rijbewijzenregister de gegevens omtrent:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel152
  - number: 152.1.a
    text: de blanco rijbewijzen die ter beschikking zijn gesteld aan de met de afgifte van rijbewijzen belaste instanties;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel152
  - number: 152.1.b
    text: |-
      de ongeldigheid van rijbewijzen ingevolge [artikel 123, eerste lid, onderdeel b, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel123
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '123'
  - number: 152.1.c
    text: |-
      vermissing of diefstal, bedoeld in [artikel 145, onderdeel k][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel145
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '145'
        hoofdstuk: VII
  - number: 152.1.d
    text: de aanvraag van rijbewijzen, waaronder de stand van zaken betreffende de aanvraag;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel152
  - number: 152.1.e
    text: |-
      verklaringen van vakbekwaamheid en verklaringen van nascholing ten behoeve van aanvragers van een rijbewijs die één
      van de volgende documenten overleggen:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel152
  - number: 152.1.e.i
    text: |-
      een door de bevoegde autoriteit van een lidstaat van de Europese Gemeenschap overeenkomstig de richtlijn
      vakbekwaamheid bestuurders aan de aanvrager afgegeven geldige kwalificatiekaart bestuurder;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel152
  - number: 152.1.e.ii
    text: een buitenlands omwisselingscertificaat, dan wel
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel152
  - number: 152.1.e.iii
    text: een Nederlands omwisselingscertificaat;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel152
  - number: 152.1.f
    text: |-
      de verblijfplaats van rijbewijzen, bedoeld in [artikel 145, onderdeel l][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel145
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '145'
        hoofdstuk: VII
  - number: '152.2'
    text: |-
      De Dienst Wegverkeer verwerkt tevens de gegevens die op grond van [artikel 148, tweede lid][ref1], door het CBR en
      op grond van [artikel 150, tweede lid][ref2], door de officier van justitie aan hem zijn gemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel148
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel150
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '148'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0008074
        artikel: '150'
        hoofdstuk: VII
  - number: '153'
    text: Onze Minister van Defensie verwerkt in het rijbewijzenregister gegevens omtrent de verklaring van rijvaardigheid.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel153
  - number: 153a
    text: |-
      Indien een rijbewijs dat op grond van [artikel 124, eerste lid, onderdeel d, van de wet][ref1] voor
      ongeldigverklaring in aanmerking komt, niet ongeldig kan worden verklaard omdat het zijn geldigheid heeft verloren
      door het verstrijken van de geldigheidsduur, plaatst het CBR in het rijbewijzenregister een aantekening waaruit
      blijkt dat ten aanzien van de houder bij de aanvraag van een nieuw rijbewijs een verklaring van geschiktheid dient
      te zijn geregistreerd voor iedere rijbewijscategorie waarop de aantekening betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel124
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel153a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '124'
  - number: 153b
    text: |-
      Indien een rijbewijs dat op grond van [artikel 132, tweede lid, van de wet][ref1] voor ongeldigverklaring
      in aanmerking komt, niet ongeldig kan worden verklaard omdat het zijn geldigheid heeft verloren door het
      verstrijken van de geldigheidsduur of omdat het reeds van rechtswege ongeldig is geworden op grond van
      [artikel 123b van de wet][ref2], plaatst het CBR in het rijbewijzenregister een aantekening waaruit blijkt dat
      ten aanzien van de houder bij de aanvraag van een nieuw rijbewijs voor iedere rijbewijscategorie waarop het in
      [artikel 133, eerste lid, van de wet][ref3] bedoelde onderzoek betrekking had, al naar gelang de aard van het
      onderzoek hetzij een verklaring van rijvaardigheid en een verklaring van geschiktheid hetzij een verklaring van
      geschiktheid moet zijn geregistreerd overeenkomstig de daarvoor vastgestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel123b
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel133
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel153b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '132'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 123b
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '133'
  - number: 153c
    text: |-
      Indien een rijbewijs dat op grond van [artikel 134, tweede lid, van de wet][ref1] voor ongeldigverklaring
      in aanmerking komt, niet ongeldig kan worden verklaard omdat het zijn geldigheid heeft verloren door het
      verstrijken van de geldigheidsduur of omdat het reeds van rechtswege ongeldig is geworden op grond van
      [artikel 123b van de wet][ref2], plaatst het CBR in het rijbewijzenregister een aantekening waaruit blijkt dat ten
      aanzien van de houder bij de aanvraag van een nieuw rijbewijs voor iedere rijbewijscategorie waarvoor op grond van
      de uitslag van het in [artikel 131, eerste lid, van de wet][ref3] bedoelde onderzoek, al naar gelang de aard van
      het onderzoek, hetzij een verklaring van geschiktheid en een verklaring van rijvaardigheid, hetzij een verklaring
      van geschiktheid moet zijn geregistreerd overeenkomstig de daarvoor vastgestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel134
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel123b
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel153c
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '134'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 123b
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '131'
  - number: 153d
    text: |-
      Indien een rijbewijs dat op grond van [artikel 132b, tweede lid, van de wet][ref1] niet ongeldig kan worden
      verklaard omdat het zijn geldigheid heeft verloren door het verstrijken van de geldigheidsduur of omdat
      het op andere wijze reeds ongeldig is geworden, plaatst het CBR in het rijbewijzenregister een aantekening
      waaruit blijkt dat ten aanzien van de houder bij de aanvraag van een nieuw rijbewijs op grond van de
      [artikelen 41a tot en met 41d][ref2] alleen een verklaring van geschiktheid kan worden geregistreerd indien is
      voldaan aan [artikel 103, tweede en derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132b
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel41a
      [ref3]: https://wetten.overheid.nl/BWBR0008074#Artikel103
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel153d
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132b
      - id: ref2
        bwb_id: BWBR0008074
        artikel: 41a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0008074
        artikel: '103'
        hoofdstuk: IV
        paragraaf: '3'
  - number: '154'
    text: |-
      Het in [artikel 129 van de wet][ref1] bedoelde reglement alsmede de wijziging en intrekking daarvan wordt voor een
      ieder ter inzage gelegd bij de Dienst Wegverkeer te Veendam alsmede bij de secretarie van iedere gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel129
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel154
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '129'
  - number: 154a
    text: |-
      De Dienst Wegverkeer verstrekt op verzoek van Onze Minister de gegevens uit het rijbewijzenregister die
      noodzakelijk zijn ter uitvoering van de in [artikel 7:6, eerste lid, onder a, van de Arbeidstijdenwet][ref1]
      genoemde taak of ter uitvoering van de ingevolge de [artikelen 79, eerste lid, onderdeel e][ref2], en
      [104, eerste lid, onderdeel c, van de Wet personenvervoer 2000][ref3] aan Onze Minister verleende bevoegdheid.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel79
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel104
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel154a
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '79'
      - id: ref3
        bwb_id: BWBR0011470
        artikel: '104'
  - number: 154b
    text: |-
      De Dienst Wegverkeer verstrekt aan de in [artikel 552 van het Wetboek van Strafvordering][ref1] bedoelde
      ambtenaren de gegevens uit het rijbewijzenregister die noodzakelijk zijn voor de handhaving van de bij
      [artikel 437, eerste lid, onder b, van het Wetboek van Strafrecht][ref2] strafbaar gestelde feiten.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel552
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel437
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel154b
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '552'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '437'
  - number: '155.1'
    text: |-
      Uit het rijbewijzenregister worden door de Dienst Wegverkeer aan de met de afgifte van rijbewijzen, dan wel met de
      beoordeling van de geldigheid van afgegeven rijbewijzen, belaste autoriteiten in andere lidstaten van de Europese
      Gemeenschap en in andere staten die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte of
      Zwitserland inlichtingen verstrekt omtrent rijbewijzen waarvan de houder zich heeft gevestigd in de betrokken staat
      en aldaar om omwisseling heeft verzocht.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel155
  - number: '155.2'
    text: |-
      Uit het rijbewijzenregister worden door de Dienst Wegverkeer aan de met de afgifte van rijbewijzen, dan wel met de
      beoordeling van de geldigheid van afgegeven rijbewijzen, belaste autoriteiten buiten Nederland, anders dan in een
      andere lid-staat van de Europese Gemeenschap of in een andere staat die partij is bij de Overeenkomst betreffende
      de Europese Economische Ruimte of Zwitserland, inlichtingen verstrekt omtrent rijbewijzen waarvan de houder zich
      heeft gevestigd in Aruba, Curaçao, Sint Maarten of in de openbare lichamen Bonaire, Sint Eustatius en Saba of in de
      betrokken staat en aldaar om omwisseling heeft verzocht.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel155
  - number: 155a.1
    text: |-
      De Dienst Wegverkeer verstrekt informatie aan de met de afgifte van rijbewijzen of kwalificatiekaarten bestuurders
      belaste autoriteiten van andere lidstaten van de Europese Gemeenschap omtrent
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel155a
  - number: 155a.1.a
    text: |-
      in de vorm van een code op het rijbewijs vermelde getuigschriften van vakbekwaamheid of getuigschriften van
      nascholing;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel155a
  - number: 155a.1.b
    text: Nederlandse omwisselingscertificaten;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel155a
  - number: 155a.1.c
    text: bestuurdersattesten en
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel155a
  - number: 155a.1.d
    text: |-
      nationale certificaten, waarvan de houder zich heeft gevestigd in de betrokken staat en aldaar om omwisseling heeft
      verzocht. Daartoe verstrekken het CBR en de Stichting Nationale en Internationale Wegvervoerorganisatie gegevens
      aan de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel155a
  - number: 155a.2
    text: |-
      De Dienst Wegverkeer meldt de aangewezen exameninstantie de einddatum van in de vorm van een code op het rijbewijs
      vermelde getuigschriften van vakbekwaamheid en getuigschriften van nascholing.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel155a
  - number: '156'
    text: |-
      Uit het rijbewijzenregister worden door de Dienst Wegverkeer inlichtingen verstrekt aan de volgende
      belanghebbenden:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156
  - number: 156.a
    text: degenen omtrent wie gegevens in het register zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156
  - number: 156.b
    text: |-
      het Centraal Bureau voor de Statistiek, voor statistische doeleinden, voor zover het betreft niet tot personen
      herleidbare informatie;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156
  - number: 156.c
    text: |-
      het Verbond van Verzekeraars en andere belanghebbenden, ten behoeve van het vaststellen van rechten en plichten
      in het kader van de uitvoering van verzekeringsovereenkomsten, voor zover het betreft de datum van afgifte en de
      geldigheid van rijbewijzen alsmede omtrent de categorie of categorieën van motorrijtuigen waarvoor rijbewijzen
      zijn afgegeven;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156
  - number: 156.d
    text: |-
      het Verbond van Verzekeraars, ten behoeve van het vaststellen van rechten en plichten in het kader van de
      uitvoering van verzekeringsovereenkomsten, voor zover het betreft de oplegging van de bijkomende straf van
      ontzegging van de bevoegdheid tot het besturen van motorrijtuigen;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156
  - number: 156.e
    text: |-
      personen werkzaam bij een postkantoor van Postkantoren BV voor zover zij de gegevens nodig hebben voor de afgifte
      van kentekenbewijzen en voor zover het betreft gegevens omtrent de geldigheid van rijbewijzen;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156
  - number: 156.f
    text: |-
      voertuigbedrijven voor zover het de verificatie van als identiteitsdocument aan het bedrijf getoonde rijbewijzen
      betreft ter bescherming van het eigendom van het bedrijf in het kader van de verhuur van de voertuigen van het
      bedrijf alsmede voor zover zij de gegevens nodig hebben voor de afgifte van kentekenbewijzen;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156
  - number: 156.g
    text: |-
      instellingen als bedoeld in
      [artikel 1, eerste lid, onderdeel a, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref1],
      voor zover het betreft gegevens omtrent de geldigheid van rijbewijzen;


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '1'
  - number: 156.h
    text: |-
      personen en instanties aan wie de desbetreffende rijbewijzen worden getoond op grond van een wettelijke
      identificatieplicht, voor zover het betreft gegevens omtrent de geldigheid van rijbewijzen;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156
  - number: 156.i
    text: |-
      het Meldpunt ongebruikelijke transacties, bedoeld in de
      [Wet ter voorkoming van witwassen en financieren van terrorisme][ref1], voor zover het betreft de gegevens, bedoeld
      in [artikel 145, onderdelen a, b, c en d][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0024282
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel145
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0024282
      - id: ref2
        bwb_id: BWBR0008074
        artikel: '145'
        hoofdstuk: VII
  - number: 156.j
    text: |-
      overige belanghebbenden voor zover deze de gegevens gebruiken voor statistische doeleinden en slechts nadat
      de gegevens door de Dienst Wegverkeer zijn ontdaan van alle elementen die de gegevens herleidbaar maken tot
      individuele personen;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156
  - number: 156.k
    text: overige door Onze Minister aangewezen belanghebbenden ten behoeve van het bij de aanwijzing aangegeven doel.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156
  - number: 156a.1
    text: |-
      Verklaringen van vakbekwaamheid en verklaringen van nascholing worden op aanvraag en tegen betaling van het
      daarvoor vastgestelde tarief door het CBR in het rijbewijzenregister geregistreerd ten behoeve van een ieder die de
      basiskwalificatie heeft behaald dan wel de nascholing heeft afgerond.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156a
  - number: 156a.2
    text: |-
      Nederlandse omwisselingscertificaten worden op aanvraag en tegen betaling van het daarvoor vastgestelde tarief door
      het CBR afgegeven aan een ieder die de basiskwalificatie heeft behaald dan wel de nascholing heeft afgerond en deze
      op een in een andere lidstaat van de Europese Gemeenschap af te geven rijbewijs of kwalificatiekaart bestuurder wil
      laten vermelden.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156a
  - number: 156a.3
    text: |-
      Deelcertificaten worden op aanvraag en tegen betaling van het daarvoor vastgestelde tarief door het CBR afgegeven
      aan een ieder die een nascholingsonderdeel heeft gevolgd en de nascholing in een andere lidstaat van de Europese
      Gemeenschap wil afronden.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156a
  - number: 156a.4
    text: |-
      In afwijking van het eerste lid worden verklaringen van vakbekwaamheid en verklaringen van nascholing tegen
      overlegging van een door de bevoegde autoriteit van een lidstaat van de Europese Gemeenschap overeenkomstig de
      richtlijn vakbekwaamheid bestuurders aan de aanvrager afgegeven geldige kwalificatiekaart bestuurder dan wel een
      buitenlands omwisselingscertificaat door de Dienst Wegverkeer in het rijbewijzenregister geregistreerd.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156a
  - number: 156b.1
    text: |-
      Het voor de aanvraag van verklaringen van vakbekwaamheid, verklaringen van nascholing, Nederlandse
      omwisselingscertificaten of deelcertificaten verschuldigde tarief wordt vastgesteld door het CBR onder goedkeuring
      van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156b
  - number: 156b.2
    text: |-
      Het in het eerste lid bedoelde tarief dient vóór de indiening van de aanvraag te zijn voldaan door overmaking op
      een door het CBR aangewezen bankrekening.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156b
  - number: 156c.1
    text: 'Het CBR is verantwoordelijk voor:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156c
  - number: 156c.1.a
    text: het ontwikkelen van de vakbekwaamheidsexamens met inbegrip van de exameneisen;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156c
  - number: 156c.1.b
    text: het afnemen van de vakbekwaamheidsexamens;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156c
  - number: 156c.1.c
    text: het periodiek vaststellen van het raamwerk van nascholingscursussen;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156c
  - number: 156c.1.d
    text: |-
      het voor het verrichten van nascholing erkennen van opleidingscentra en het certificeren van nascholingscursussen
      die door die opleidingscentra worden aangeboden;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156c
  - number: 156c.1.e
    text: het uitoefenen van toezicht op de erkende opleidingscentra;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156c
  - number: 156c.1.f
    text: het registreren van toetsresultaten;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156c
  - number: 156c.1.g
    text: het registreren van gevolgde nascholingsuren;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156c
  - number: 156c.1.h
    text: |-
      het registreren van verklaringen van vakbekwaamheid, verklaringen van nascholing en van Nederlandse
      omwisselingscertificaten in het rijbewijzenregister;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156c
  - number: 156c.1.i
    text: het uitreiken van Nederlandse omwisselingscertificaten;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156c
  - number: 156c.1.j
    text: het uitreiken van deelcertificaten;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156c
  - number: 156c.1.k
    text: |-
      het ongeldig verklaren van getuigschriften van vakbekwaamheid, getuigschriften van nascholing en Nederlandse
      omwisselingscertificaten.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156c
  - number: 156c.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld inzake de taken, bevoegdheden en werkwijze van het
      CBR.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156c
  - number: 156d.1
    text: |-
      De aanvraag van een verklaring van vakbekwaamheid, een verklaring van nascholing, een Nederlands
      omwisselingscertificaat of een deelcertificaat geschiedt op de door het CBR vastgestelde wijze.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156d
  - number: 156d.2
    text: |-
      De aanvraag van een verklaring van vakbekwaamheid dan wel een verklaring van nascholing als bedoeld in
      [artikel 156a, vierde lid][ref1], geschiedt op de door de Dienst Wegverkeer vastgestelde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel156a
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156d
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 156a
        hoofdstuk: VIIa
        paragraaf: '1'
  - number: 156d.3
    text: |-
      Bij de aanvraag raadpleegt het CBR dan wel de Dienst Wegverkeer de in de basisregistratie personen opgenomen
      persoonsgegevens van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156d
  - number: 156e
    text: 'Het stelsel van basiskwalificatie omvat:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156e
  - number: 156e.a
    text: een theorie-examen vakbekwaamheid bestaande uit drie toetsen, en
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156e
  - number: 156e.b
    text: een praktijkexamen vakbekwaamheid bestaande uit drie toetsen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156e
  - number: 156f.1
    text: |-
      Het theorie-examen vakbekwaamheid voor de rijbewijscategorieën C1, C, E bij C1 en E bij C kan slechts worden
      afgelegd door personen die de leeftijd van zeventien jaren hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156f
  - number: 156f.2
    text: |-
      Het theorie-examen vakbekwaamheid voor de rijbewijscategorieën D1, D, E bij D1 en E bij D kan slechts worden
      afgelegd door personen die de leeftijd van zeventien jaren hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156f
  - number: 156g
    text: |-
      Voor toelating tot het theorie-examen vakbekwaamheid zijn de voorwaarden voor toelating tot het theorie-examen voor
      de rijbewijscategorieën C1, C, D1 of D van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156g
  - number: 156ga.1
    text: |-
      Het theorie-examen vakbekwaamheid voor rijbewijscategorie C1 bestaat uit theorietoets rijbewijs en
      vakbekwaamheid 1, theorietoets vakbekwaamheid 2 en theorietoets vakbekwaamheid 3.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156ga
  - number: 156ga.2
    text: |-
      Bij het theorie-examen vakbekwaamheid voor de rijbewijscategorie C1 wordt getoetst of een aanvrager beschikt over
      grondige kennis van de bij ministeriële regeling vastgestelde eisen omtrent onderwerpen die voor bestuurders van
      motorrijtuigen van die categorie zijn opgenomen in bijlage I van de richtlijn vakbekwaamheid bestuurders, alsmede
      op het op juiste wijze toepassen van die kennis.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156ga
  - number: 156ga.3
    text: |-
      De aanvrager die het theorie-examen vakbekwaamheid voor de rijbewijscategorie C1 met goed gevolg heeft afgelegd, is
      vrijgesteld van het theorie-examen voor rijbewijscategorie C1.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156ga
  - number: 156ga.4
    text: |-
      De aanvrager die reeds beschikt over een rijbewijs van de categorie C1, E bij C1, C of E bij C, dat hetzij nog
      geldig is hetzij zijn geldigheid heeft verloren door het verstrijken van de geldigheidsduur, verwerft het theorie-
      examen vakbekwaamheid voor de rijbewijscategorie C1 door in aanvulling op dat rijbewijs met goed gevolg de bij
      ministeriële regeling vastgestelde onderdelen van dat theorie-examen af te leggen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156ga
  - number: 156ga.5
    text: |-
      De aanvrager die het theorie-examen vakbekwaamheid voor de rijbewijscategorie D1 of D met goed gevolg heeft
      afgelegd, verwerft het theorie-examen vakbekwaamheid voor de rijbewijscategorie C1 door met goed gevolg de bij
      ministeriële regeling vastgestelde additionele onderdelen af te leggen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156ga
  - number: 156h.1
    text: |-
      Het theorie-examen vakbekwaamheid voor rijbewijscategorie C bestaat uit theorietoets rijbewijs en vakbekwaamheid 1,
