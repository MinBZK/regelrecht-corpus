  - number: 2.4.a.II
    text: |-
      die bestuurder, indien hij de leeftijd van 24 jaren heeft bereikt, in het bezit is van een van de volgende
      documenten:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel2
  - number: 2.4.a.II.1°
    text: |-
      een niet langer dan een jaar en zes maanden tevoren afgegeven verklaring dat de bestuurder is geslaagd voor het
      theorie-examen voor de rijbewijscategorie A;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel2
  - number: 2.4.a.II.2°
    text: |-
      een door het daartoe bevoegde militaire gezag niet langer dan een jaar en zes maanden tevoren afgegeven
      theoriecertificaat ten behoeve van de rijbewijscategorie A;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel2
  - number: 2.4.a.II.3°
    text: |-
      een geldig rijbewijs A dat slechts geldig is voor het besturen van motorrijtuigen van deze categorie met
      automatische schakeling;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel2
  - number: 2.4.a.II.4°
    text: |-
      een geldig rijbewijs A, afgegeven door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of in
      een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, dat
      slechts geldig is voor het besturen van motorrijtuigen van deze categorie met automatische schakeling;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel2
  - number: 2.4.a.II.5°
    text: een geldig rijbewijs A2;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel2
  - number: 2.4.a.II.6°
    text: |-
      een geldig rijbewijs A2, afgegeven door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of
      in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel2
  - number: 2.4.a.II.7°
    text: een geldig rijbewijs A1;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel2
  - number: 2.4.a.II.8°
    text: |-
      een geldig rijbewijs A1, afgegeven door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of
      in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel2
  - number: 2.4.a.II.9°
    text: een geldig rijbewijs B;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel2
  - number: 2.4.a.II.10°
    text: |-
      een geldig rijbewijs B, afgegeven door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of in
      een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel2
  - number: 2.4.a.III
    text: |-
      de bestuurder geen andere personen vervoert, uitgezonderd degene die aan de bestuurder rijonderricht in de zin van
      de [Wet rijonderricht motorrijtuigen 1993][ref1] geeft;


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: 2.4.b
    text: tijdens het praktijk-examen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel2
  - number: '2.5'
    text: |-
      De in het eerste lid, onderdeel a, tweede lid, onderdeel a, derde lid, onderdeel a, of vierde lid, onderdeel a,
      bedoelde bestuurders zijn verplicht op de eerste vordering van de in [artikel 159, onderdeel a, van de wet][ref1]
      bedoelde personen de door het CBR verstrekte verklaring ter inzage af te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
  - number: '3'
    text: |-
      Voor het besturen van motorrijtuigen van de rijbewijscategorieën C1, C, D1, D, E en T is geen rijbewijs vereist bij
      het uitvoeren van de van het praktijk-examen deel uitmakende bijzondere verrichtingen voor zover het motorrijtuig
      daarbij niet onder toezicht wordt bestuurd:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel3
  - number: 3.a
    text: |-
      gedurende de tijd dat aan de bestuurder rijonderricht in de zin van de [Wet rijonderricht motorrijtuigen 1993][ref1]
      wordt gegeven in het kader van de opleiding voor het praktijk-examen voor een van die rijbewijscategorieën, en


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: 3.b
    text: tijdens het praktijk-examen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel3
  - number: '4'
    text: |-
      Voor het besturen van motorrijtuigen is geen rijbewijs vereist tijdens het afleggen van de in de artikelen
      [101, eerste lid][ref1], aanhef, en [103, negende lid][ref2], bedoelde rijproef, mits de bestuurder in het bezit is
      van een oproep voor die rijproef.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel103
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '101'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008074
        artikel: '103'
        hoofdstuk: IV
        paragraaf: '3'
  - number: '5.1'
    text: 'Voor het besturen van motorrijtuigen gelden de volgende minimumleeftijden:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel5
  - number: 5.1.a
    text: 'voor de rijbewijscategorie AM: 16 jaren;'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel5
  - number: 5.1.b
    text: 'voor de rijbewijscategorie A1: 18 jaren;'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel5
  - number: 5.1.c
    text: 'voor de rijbewijscategorie A2: 20 jaren;'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel5
  - number: 5.1.d
    text: |-
      voor de rijbewijscategorie A, indien de bestuurder reeds in het bezit is van een rijbewijs voor de categorie A2:
      22 jaren;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel5
  - number: 5.1.e
    text: |-
      voor de rijbewijscategorie A, indien de bestuurder niet in het bezit is van een rijbewijs voor de categorie A2:
      24 jaren;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel5
  - number: 5.1.f
    text: 'voor de rijbewijscategorie B en E bij B: 18 jaren;'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel5
  - number: 5.1.g
    text: 'voor de rijbewijscategorie C1 en E bij C1: 18 jaren;'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel5
  - number: 5.1.h
    text: |-
      voor de rijbewijscategorieën C en E bij C, indien betrokkene niet tevens in het bezit is van het getuigschrift van
      vakbekwaamheid: 21 jaren;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel5
  - number: 5.1.i
    text: |-
      voor de rijbewijscategorieën C en E bij C, indien betrokkene tevens in het bezit is van het getuigschrift van
      vakbekwaamheid: 18 jaren;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel5
  - number: 5.1.j
    text: |-
      voor de rijbewijscategorieën D1 en E bij D1, indien betrokkene niet tevens in het bezit is van het getuigschrift
      van vakbekwaamheid: 21 jaren;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel5
  - number: 5.1.k
    text: |-
      voor de rijbewijscategorieën D1 en E bij D1, indien betrokkene tevens in het bezit is van het getuigschrift van
      vakbekwaamheid: 18 jaren;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel5
  - number: 5.1.l
    text: |-
      voor de rijbewijscategorieën D en E bij D, indien betrokkene niet tevens in het bezit is van het getuigschrift van
      vakbekwaamheid: 24 jaren;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel5
  - number: 5.1.m
    text: |-
      voor de rijbewijscategorieën D en E bij D, indien betrokkene tevens in het bezit is van het getuigschrift van
      vakbekwaamheid: 21 jaren.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel5
  - number: '5.2'
    text: 'Er geldt geen minimumleeftijd voor:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel5
  - number: 5.2.a
    text: |-
      bestuurders van gehandicaptenvoertuigen die zijn uitgerust met een elektromotor en die niet sneller kunnen rijden
      dan 10 km per uur;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel5
  - number: 5.2.b
    text: |-
      bestuurders van bromfietsen als bedoeld in [artikel 1, eerste lid, onderdeel e, subonderdeel d, van de wet][ref1],
      die beschikken over een gehandicaptenparkeerkaart of een kaart ten behoeve van het vervoer van gehandicapten als
      bedoeld in [artikel 5, zesde lid, van het RVV 1990][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004825#Artikel5
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004825
        artikel: '5'
  - number: '5.3'
    text: |-
      Voor bestuurders van landbouw- en bosbouwtrekkers, gehandicaptenvoertuigen, anders dan die bedoeld in het tweede
      lid, onderdeel a, en motorrijtuigen met beperkte snelheid geldt de minimumleeftijd van 16 jaren.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel5
  - number: '5.4'
    text: |-
      Van de in het derde lid vastgestelde minimumleeftijd kan ontheffing worden verleend voor zover het betreft
      gehandicaptenvoertuigen als bedoeld in dat lid.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel5
  - number: '5.5'
    text: |-
      In afwijking van het eerste lid, onderdeel b, geldt voor bestuurders van een motorrijtuig van de categorie A1
      de minimumleeftijd van 16 jaren, indien zij beschikken over een geldig rijbewijs voor de categorie A1, afgegeven
      door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie, een staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, dan wel over een door het daartoe bevoegde
      gezag in Nederland afgegeven rijbewijs voor die categorie dat is verkregen door omwisseling overeenkomstig
      [artikel 45][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel45
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '45'
        hoofdstuk: II
        paragraaf: '2'
  - number: '5.6'
    text: |-
      In afwijking van het eerste lid, onderdeel c, geldt voor bestuurders van een motorrijtuig van de categorie A2
      de minimumleeftijd van 18 jaren indien zij beschikken over een geldig rijbewijs voor de categorie A2, afgegeven
      door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie, een staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, dan wel over een door het daartoe bevoegde
      gezag in Nederland afgegeven rijbewijs voor die categorie dat is verkregen door omwisseling overeenkomstig
      [artikel 45][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel45
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '45'
        hoofdstuk: II
        paragraaf: '2'
  - number: '5.7'
    text: |-
      In afwijking van het eerste lid, onderdeel d, geldt voor bestuurders van een motorrijtuig van de categorie A, niet
      zijnde een driewielig motorrijtuig van die categorie, de minimumleeftijd van 20 jaren, indien zij beschikken
      over een geldig rijbewijs voor de categorie A, afgegeven door het daartoe bevoegde gezag in een andere lidstaat
      van de Europese Unie, een staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of
      Zwitserland, dan wel over een door het daartoe bevoegde gezag in Nederland afgegeven rijbewijs voor die categorie
      dat is verkregen door omwisseling overeenkomstig [artikel 45][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel45
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '45'
        hoofdstuk: II
        paragraaf: '2'
  - number: '5.8'
    text: |-
      In afwijking van het eerste lid, onderdeel d, geldt voor bestuurders van een driewielig motorrijtuig van de
      categorie A de minimumleeftijd van 21 jaren, indien zij beschikken over een geldig rijbewijs voor de categorie A,
      afgegeven door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of in een andere staat die
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, dan wel over een door
      het daartoe bevoegde gezag in Nederland afgegeven rijbewijs voor die categorie dat is verkregen door omwisseling
      overeenkomstig [artikel 45][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel45
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '45'
        hoofdstuk: II
        paragraaf: '2'
  - number: '5.9'
    text: |-
      In afwijking van het eerste lid, onderdeel h, geldt voor het Nederlandse grondgebied de leeftijd van 18 jaar,
      indien:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel5
  - number: 5.9.a
    text: |-
      de bestuurder een door het bevoegd gezag van een op het beroep van chauffeur goederenvervoer gerichte
      beroepsopleiding als bedoeld in de [Wet educatie en beroepsonderwijs][ref1] of een bij ministeriële regeling
      daaraan gelijkwaardig verklaarde opleiding afgegeven gewaarmerkte verklaring kan overleggen waaruit blijkt sinds
      welke datum hij de opleiding volgt, en


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: 5.9.b
    text: |-
      de bestuurder door middel van een geldig bewijs van inschrijving kan aantonen dat hij nog staat ingeschreven bij
      de opleiding.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel5
  - number: '6.1'
    text: |-
      De in [artikel 5, eerste lid][ref1], genoemde minimumleeftijden gelden ook voor degene aan wie rijonderricht in de
      zin van de [Wet rijonderricht motorrijtuigen 1993][ref2] wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '5'
        hoofdstuk: I
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006073
  - number: '6.2'
    text: |-
      In afwijking van het eerste lid geldt de in [artikel 5, eerste lid, onderdeel b][ref1], genoemde leeftijd van 18
      jaren niet voor zover degene aan wie rijonderricht wordt gegeven voor de rijbewijscategorie A1 de leeftijd van 17
      jaren heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel5
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '5'
        hoofdstuk: I
        paragraaf: '3'
  - number: '6.3'
    text: |-
      In afwijking van het eerste lid geldt de in [artikel 5, eerste lid, onderdeel c][ref1], genoemde leeftijd van 20
      jaren niet voor zover degene aan wie rijonderricht wordt gegeven voor de rijbewijscategorie A2 de leeftijd van
      19 jaren heeft bereikt en in het bezit is van een rijbewijs voor de categorie A1, dan wel een rijbewijs van de
      categorie A1, afgegeven door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of in een
      andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel5
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '5'
        hoofdstuk: I
        paragraaf: '3'
  - number: '6.4'
    text: |-
      In afwijking van het eerste lid geldt de in [artikel 5, eerste lid, onderdelen g en h][ref1], genoemde leeftijd van
      18, respectievelijk 21 jaren niet voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel5
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '5'
        hoofdstuk: I
        paragraaf: '3'
  - number: 6.4.a
    text: |-
      degene aan wie rijonderricht wordt gegeven voor de categorie C1 of C een opleiding volgt in het kader van de
      [Wet educatie en beroepsonderwijs][ref1] tot beroepschauffeur in het goederenvervoer over de weg,


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: 6.4.b
    text: dat rijonderricht wordt gegeven in dat kader, en
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel6
  - number: 6.4.c
    text: degene aan wie rijonderricht wordt gegeven de leeftijd van 17 jaren heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel6
  - number: '7.1'
    text: |-
      Bij het geven van rijonderricht in de zin van de [Wet rijonderricht motorrijtuigen 1993][ref1] in het kader van de
      opleiding voor het praktijkexamen voor rijbewijscategorie AM dient te worden voldaan aan de volgende eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: 7.1.a
    text: |-
      degene aan wie rijonderricht wordt gegeven op een tweewielige bromfiets dient in het bezit te zijn van een niet
      langer dan een jaar en zes maanden van tevoren afgegeven verklaring dat hij is geslaagd voor het theorie-examen
      voor de rijbewijscategorie AM;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
  - number: 7.1.b
    text: |-
      indien degene die rijonderricht geeft, zich achter de bestuurder op de tweewielige bromfiets bevindt, mag geen
      rijonderricht worden gegeven aan andere personen dan aan die bestuurder. Hetzelfde geldt indien degene die
      rijonderricht geeft, zich naast de bestuurder in de drie- of vierwielige bromfiets bevindt;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
  - number: 7.1.c
    text: |-
      indien degene die rijonderricht geeft aan bestuurders van tweewielige bromfietsen, zich niet achter de bestuurder
      op de tweewielige bromfiets bevindt, mag rijonderricht worden gegeven aan ten hoogste vier bestuurders en dient
      tussen degene die rijonderricht geeft en de bestuurder of bestuurders die rijonderricht ontvangt of ontvangen,
      radiografisch contact te bestaan;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
  - number: 7.1.d
    text: |-
      degene die rijonderricht geeft aan een bestuurder van een bromfiets mag niet tegelijkertijd rijonderricht geven in
      het kader van de opleiding voor een andere rijbewijscategorie.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
  - number: '7.2'
    text: |-
      Bij het geven van rijonderricht in de zin van de [Wet rijonderricht motorrijtuigen 1993][ref1] in het kader van de
      opleiding voor het praktijk-examen voor de rijbewijzen A1, A2 en A dient te worden voldaan aan de volgende eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: 7.2.a
    text: |-
      indien degene die rijonderricht geeft, zich achter de bestuurder op het motorrijtuig bevindt, mag geen
      rijonderricht worden gegeven aan andere personen dan aan die bestuurder;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
  - number: 7.2.b
    text: |-
      indien degene die rijonderricht geeft, zich niet achter de bestuurder op het motorrijtuig bevindt, mag
      rijonderricht worden gegeven aan ten hoogste twee bestuurders en dient tussen degene die rijonderricht geeft en de
      bestuurder of bestuurders die rijonderricht ontvangt of ontvangen, radiografisch contact te bestaan;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
  - number: 7.2.c
    text: |-
      degene die rijondericht geeft mag niet tegelijkertijd rijonderricht geven in het kader van de opleiding voor een
      andere rijbewijscategorie dan de categorie A1, A2 of A;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
  - number: 7.2.d
    text: |-
      het motorrijtuig of de motorrijtuigen waarmee rijonderricht wordt gegeven, dient of dienen te zijn voorzien van een
      bij ministeriële regeling vastgestelde aanduiding, aangebracht op de wijze als bij die regeling is voorgeschreven;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
  - number: 7.2.e
    text: |-
      degene aan wie rijonderricht wordt gegeven voor de categorie A1, dient in het bezit te zijn van een van de volgende
      documenten:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
  - number: 7.2.e.1°
    text: |-
      een niet langer dan een jaar en zes maanden tevoren afgegeven verklaring dat hij is geslaagd voor het theorie-
      examen voor de rijbewijscategorie A;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
  - number: 7.2.e.2°
    text: |-
      een door het daartoe bevoegde militaire gezag niet langer dan een jaar en zes maanden tevoren afgegeven
      theoriecertificaat ten behoeve van de rijbewijscategorie A;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
  - number: 7.2.e.3°
    text: |-
      een geldig rijbewijs A1 dat slechts geldig is voor het besturen van motorrijtuigen van deze categorie met
      automatische schakeling;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
  - number: 7.2.e.4°
    text: |-
      een geldig rijbewijs A1, afgegeven door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of
      in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland,
      dat slechts geldig is voor het besturen van motorrijtuigen van deze categorie met automatische schakeling;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
  - number: 7.2.e.5°
    text: een geldig rijbewijs B;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
  - number: 7.2.e.6°
    text: |-
      een geldig rijbewijs B, afgegeven door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of in
      een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
  - number: 7.2.f
    text: |-
      degene aan wie rijonderricht wordt gegeven voor de categorie A2, dient in het bezit te zijn van een van de volgende
      documenten:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
  - number: 7.2.f.1°
    text: een geldig rijbewijs A1;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
  - number: 7.2.f.2°
    text: |-
      een geldig rijbewijs A1, afgegeven door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of
      in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
  - number: 7.2.f.3°
    text: |-
      een niet langer dan een jaar en zes maanden tevoren afgegeven verklaring dat hij is geslaagd voor het theorie-
