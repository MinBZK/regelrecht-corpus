    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
  - number: 7.2.g.II.8°
    text: |-
      een geldig rijbewijs A, afgegeven door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of in
      een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, dat
      slechts geldig is voor het besturen van motorrijtuigen van deze categorie met automatische schakeling;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
  - number: 7.2.g.II.9°
    text: een geldig rijbewijs B;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
  - number: 7.2.g.II.10°
    text: |-
      een geldig rijbewijs B, afgegeven door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of in
      een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
  - number: 7a.1
    text: |-
      De bromfiets, waarmee rijonderricht in de zin van de [Wet rijonderricht motorrijtuigen 1993][ref1] wordt gegeven
      in het kader van de opleiding voor het praktijkexamen voor de rijbewijscategorie AM, tweewielige bromfietsen, dient
      te zijn voorzien van een bij ministeriële regeling vastgestelde aanduiding, aangebracht op de wijze als bij die
      regeling is voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: 7a.2
    text: |-
      De bromfiets waarmee rijonderricht in de zin van de [Wet rijonderricht motorrijtuigen 1993][ref1] wordt gegeven in
      het kader van de opleiding voor het praktijkexamen voor de rijbewijscategorie AM, drie- of vierwielige bromfietsen,
      dient te zijn voorzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: 7a.2.a
    text: |-
      inrichtingen die zo zijn aangebracht dat degene die rijonderricht geeft daarmee de bedrijfsrem en de koppeling
      vanaf zijn zitplaats doeltreffend kan bedienen, dan wel, indien het een motorrijtuig met automatische schakeling
      betreft, van een andere inrichting waarmee hij de aandrijving van het motorrijtuig door de motor kan onderbreken;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7a
  - number: 7a.2.b
    text: |-
      een binnen- en een buitenspiegel waarmee degene die rijonderricht geeft het achter en rechts naast hem gelegen
      weggedeelte kan overzien;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7a
  - number: 7a.2.c
    text: |-
      een bij ministeriële regeling vastgestelde aanduiding, aangebracht op de wijze als bij die regeling is
      voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7a
  - number: '8'
    text: |-
      Het motorrijtuig waarmee rijonderricht in de zin van de [Wet rijonderricht motorrijtuigen 1993][ref1] wordt gegeven
      in het kader van de opleiding voor het praktijk-examen voor rijbewijs B, dient te zijn voorzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: 8.a
    text: |-
      inrichtingen die zo zijn aangebracht dat degene die rijonderricht geeft, daarmee de bedrijfsrem en, indien het een
      motorrijtuig met handschakeling betreft, de koppeling vanaf zijn zitplaats doeltreffend kan bedienen;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel8
  - number: 8.b
    text: |-
      een binnen- en een buitenspiegel waarmee degene die rijonderricht geeft het achter en rechts naast hem gelegen
      weggedeelte kan overzien;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel8
  - number: 8.c
    text: |-
      een bij ministeriële regeling vastgestelde aanduiding, aangebracht op de wijze als bij die regeling is
      voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel8
  - number: '9.1'
    text: |-
      Bij het geven van rijonderricht in de zin van de [Wet rijonderricht motorrijtuigen 1993][ref1] in het kader van de
      opleiding voor het praktijk-examen voor rijbewijs C1, C, D1, D of E dient te worden voldaan aan de volgende eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: 9.1.a
    text: |-
      het motorrijtuig waarmee rijonderricht wordt gegeven, dient te zijn voorzien van inrichtingen die zo zijn
      aangebracht dat degene die rijonderricht geeft, daarmee de bedrijfsrem en, indien het een motorrijtuig met
      handschakeling betreft, de koppeling vanaf zijn zitplaats doeltreffend kan bedienen;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel9
  - number: 9.1.b
    text: |-
      het motorrijtuig waarmee rijonderricht wordt gegeven, dient te zijn voorzien van twee of meer buitenspiegels
      waarmee degene die rijonderricht geeft het rechts en links naast en achter hem gelegen weggedeelte kan overzien;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel9
  - number: 9.1.c
    text: |-
      het motorrijtuig waarmee rijonderricht wordt gegeven, dient te zijn voorzien van een bij ministeriële regeling
      vastgestelde aanduiding, aangebracht op de wijze als bij die regeling is voorgeschreven;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel9
  - number: 9.1.d
    text: |-
      degene aan wie rijonderricht wordt gegeven in het kader van de opleiding voor het praktijk-examen voor rijbewijs
      C1, C, D1 of D, dient in het bezit te zijn van een rijbewijs B dat hetzij nog geldig is hetzij zijn geldigheid
      heeft verloren door het verstrijken van de geldigheidsduur;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel9
  - number: 9.1.e
    text: |-
      degene aan wie rijonderricht wordt gegeven in het kader van de opleiding voor het praktijkexamen voor rijbewijs
      E, dient in het bezit te zijn van een rijbewijs dat geldig is voor het besturen van het trekkende motorrijtuig,
      al dan niet voorzien van een bij ministeriële regeling vastgestelde codering waaruit blijkt dat de houder van dat
      rijbewijs het praktijkexamen heeft afgelegd in een motorrijtuig met automatische schakeling, dat hetzij nog geldig
      is, hetzij zijn geldigheid heeft verloren door het verstrijken van de geldigheidsduur;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel9
  - number: '9.2'
    text: |-
      Het eerste lid, onderdelen d en e, geldt niet voor degene die rijonderricht ontvangt in het kader
      van een op het beroep van chauffeur goederenvervoer gerichte beroepsopleiding als bedoeld in de
      [Wet educatie en beroepsonderwijs][ref1] en voor degene die rijonderricht ontvangt met het oog op de aanvraag van
      een rijbewijs als bedoeld in [artikel 42b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel42b
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007625
      - id: ref2
        bwb_id: BWBR0008074
        artikel: 42b
        hoofdstuk: II
        paragraaf: '2'
  - number: '9.3'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel d, wordt met een rijbewijs B gelijk gesteld een geldig rijbewijs
      B, afgegeven door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of in een andere staat die
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel9
  - number: '9.4'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel e, wordt met een rijbewijs dat geldig is voor het besturen van
      het trekkende motorrijtuig gelijkgesteld een door het daartoe bevoegde gezag in een andere lidstaat van de Europese
      Gemeenschap of in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of
      Zwitserland afgegeven rijbewijs dat geldig is voor het besturen van het trekkende motorrijtuig.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel9
  - number: '9.5'
    text: |-
      Degene die rijonderricht ontvangt met het oog op een aanvraag als bedoeld in [artikel 42b, eerste lid][ref1], dient
      in het bezit te zijn van een verklaring als bedoeld in artikel 42b, tweede lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel42b
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 42b
        hoofdstuk: II
        paragraaf: '2'
  - number: 9a.1
    text: |-
      Bij het geven van rijonderricht in de zin van de [Wet motorrijtuigen 1993][ref1] in het kader van de opleiding voor
      het praktijkexamen voor rijbewijs T dient te worden voldaan aan de volgende eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: 9a.1.a
    text: |-
      het motorrijtuig waarmee rijonderricht wordt gegeven dient te zijn voorzien van inrichtingen die zo zijn
      aangebracht dat degene die rijonderricht geeft daarmee de bedrijfsrem en, indien het een motorrijtuig met
      handschakeling betreft, de koppeling vanaf zijn zitplaats doeltreffend kan bedienen;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel9a
  - number: 9a.1.b
    text: |-
      het motorrijtuig waarmee rijonderricht wordt gegeven dient te zijn voorzien van twee of meer buitenspiegels waarmee
      degene die rijonderricht geeft het rechts en links naast en achter hem gelegen weggedeelte kan overzien;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel9a
  - number: 9a.1.c
    text: |-
      het motorrijtuig waarmee rijonderricht wordt gegeven dient te zijn voorzien van een bij ministeriële regeling
      vastgestelde aanduiding, aangebracht op een wijze als bij die regeling is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel9a
  - number: 9a.2
    text: |-
      [Artikel 9, vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel9
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '9'
        hoofdstuk: I
        paragraaf: '4'
  - number: '10'
    text: |-
      [Artikel 9, eerste lid, onderdelen a tot en met c][ref1], is van overeenkomstige toepassing bij het geven van
      rijonderricht in de zin van de [Wet rijonderricht motorrijtuigen 1993][ref2] in het kader van het behalen van de
      basiskwalificatie.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '9'
        hoofdstuk: I
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0006073
  - number: '15.1'
    text: 'Rijbewijzen worden afgegeven voor het besturen van de volgende categorieën van motorrijtuigen:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel15
  - number: 15.1.a
    text: |-
      bromfietsen, niet zijnde bromfietsen als bedoeld in
      [artikel 1, eerste lid, onderdeel e, subonderdeel d, van de wet][ref1] (rijbewijs categorie AM);


