    text: |-
      een geldig rijbewijs A1, afgegeven door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of
      in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
  - number: 7.2.g.II.3°
    text: een geldig rijbewijs voor de rijbewijscategorie A2;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
  - number: 7.2.g.II.4°
    text: |-
      een geldig rijbewijs A2, afgegeven door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of
      in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
  - number: 7.2.g.II.5°
    text: |-
      een niet langer dan een jaar en zes maanden tevoren afgegeven verklaring dat hij is geslaagd voor het theorie-
      examen voor de rijbewijscategorie A;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
  - number: 7.2.g.II.6°
    text: |-
      een door het daartoe door het bevoegde militaire gezag niet langer dan een jaar en zes maanden tevoren afgegeven
      theoriecertificaat ten behoeve van de rijbewijscategorie A;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
  - number: 7.2.g.II.7°
    text: |-
      een geldig rijbewijs A dat slechts geldig is voor het besturen van motorrijtuigen van deze categorie met
