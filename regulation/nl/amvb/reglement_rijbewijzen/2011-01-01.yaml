  - number: '183.3'
    text: |-
      Voor de toepassing van de [artikelen 44, derde lid][ref1], [artikel 46, derde en zesde lid][ref2], [107][ref3]
      en [108][ref4] wordt onder een eerder aan de aanvrager afgegeven rijbewijs mede verstaan een eerder op basis van
      de Wegenverkeerswet aan de aanvrager afgegeven rijbewijs dat op het moment van de aanvraag na 30 juni 1985 zijn
      geldigheid heeft verloren door het verstrijken van de geldigheidsduur of door omwisseling tegen een rijbewijs dat
      is afgegeven door het daartoe bevoegde gezag buiten Nederland.


