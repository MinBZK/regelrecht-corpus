        paragraaf: '2'
  - number: '186.1'
    text: |-
      Voor de toepassing van [artikel 67, derde lid][ref1], wordt onder een rijbewijs B, al dan niet voorzien van een
      bij ministeriële regeling vastgestelde codering waaruit blijkt dat de houder het praktijkexamen heeft afgelegd
      in een motorrijtuig zonder koppelingspedaal, dat zijn geldigheid heeft verloren door het verstrijken van de
      geldigheidsduur mede verstaan een op basis van de Wegenverkeerswet afgegeven rijbewijs B, al dan niet voorzien
      van een bij ministeriële regeling vastgestelde codering waaruit blijkt dat de houder het praktijkexamen heeft
      afgelegd in een motorrijtuig zonder koppelingspedaal, dat na 30 juni 1985 zijn geldigheid heeft verloren door het
      verstrijken van de geldigheidsduur en dat niet behoort tot een bij ministeriële regeling aangewezen model.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel67
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel186
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '67'
        hoofdstuk: III
        paragraaf: '4'
  - number: '186.2'
    text: |-
      Voor de toepassing van [artikel 67, vierde lid][ref1], wordt onder een rijbewijs voor het trekkende motorrijtuig,
      al dan niet voorzien van een bij ministeriële regeling vastgestelde codering waaruit blijkt dat de houder van dat
      rijbewijs het praktijkexamen heeft afgelegd in een motorrijtuig dat is voorzien van een automatische gangwissel
      of van een automatische koppeling, dat zijn geldigheid heeft verloren door het verstrijken van de geldigheidsduur
      mede verstaan een op basis van de [Wegenverkeerswet][ref2] afgegeven rijbewijs voor het trekkende motorrijtuig,
      al dan niet voorzien van een bij ministeriële regeling vastgestelde codering waaruit blijkt dat de houder van dat
      rijbewijs het praktijkexamen heeft afgelegd in een motorrijtuig dat is voorzien van een automatische gangwissel
      of van een automatische koppeling, dat na 30 juni 1985 zijn geldigheid heeft verloren door het verstrijken van de
      geldigheidsduur en dat niet behoort tot een bij ministeriële regeling aangewezen model.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel186
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '67'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0006622
  - number: '187'
    text: |-
      Voor de toepassing van artikel 69, tweede lid, onderdeel *a*, wordt onder een rijbewijs dat zijn geldigheid
      heeft verloren door het verstrijken van de geldigheidsduur mede verstaan een op basis van de Wegenverkeerswet
      afgegeven rijbewijs dat op het moment van de aanvraag zijn geldigheid heeft verloren door het verstrijken van de
      geldigheidsduur en dat niet behoort tot een bij ministeriële regeling aangewezen model.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel187
  - number: '191'
    text: |-
      Voor de toepassing van de artikelen 145 tot en met 152 wordt onder rijbewijzen mede verstaan rijbewijzen als
      bedoeld in artikel 9, eerste lid onder [3e, van de Wegenverkeerswet](onbekend).
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel191
  - number: '193'
    text: |-
      Indien de aanvraag van een rijbewijs betrekking heeft op de afgifte van een rijbewijs in verband met het
      verstrijken van de geldigheidsduur van een voor de datum van inwerkingtreding van dit besluit op basis van de
      [Wegenverkeerswet][ref1] afgegeven rijbewijs dat geldig is voor de rijbewijscategorie A wordt, indien de aanvrager
      ten behoeve van het besturen van een motorrijtuig op drie wielen, waarvan de ledige massa niet meer bedraagt
      dan 400 kg, belang heeft bij afgifte van een rijbewijs dat geldig is voor het besturen van motorrijtuigen van de
      rijbewijscategorie B, tegen overlegging van dat eerder afgegeven rijbewijs en een vóór 1 juni 1996 op zijn naam
      gesteld kentekenbewijs dat is afgegeven voor een motorrijtuig als hier bedoeld, een rijbewijs afgegeven voor de
      rijbewijscategorieën A en B, dat voor wat betreft de rijbewijscategorie B slechts geldig is voor het besturen van
      motorrijtuigen op drie wielen, waarvan de ledige massa niet meer bedraagt dan 400 kg. In het rijbewijs is deze
      beperking aangeduid met een bij ministeriële regeling vastgestelde codering.


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel193
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: '194'
    text: |-
      Indien de aanvraag van een rijbewijs betrekking heeft op de afgifte van een rijbewijs tegen overlegging van
      een op basis van de Wegenverkeerswet aan de aanvrager afgegeven rijbewijs dat na 30 juni 1985 zijn geldigheid
      heeft verloren door het verstrijken van de geldigheidsduur en waarin de aanduiding «Automatische gangwissel of
      koppeling», al dan niet in combinatie met de aanduiding «Tot één jaar na datum van afgifte beperkt geldig» is
      geplaatst, wordt een rijbewijs afgegeven zonder die beperkende aanduiding of aanduidingen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel194
  - number: '195.1'
    text: |-
      Indien de aanvraag van een rijbewijs betrekking heeft op de afgifte van een rijbewijs tegen overlegging van een
      op basis van de Wegenverkeerswet aan de aanvrager afgegeven rijbewijs dat na 30 juni 1985 zijn geldigheid heeft
      verloren door het verstrijken van de geldigheidsduur en waarin vermeldingen of beperkende aantekeningen zijn
      aangebracht, wordt een rijbewijs afgegeven waarin die vermeldingen of beperkende aantekeningen zijn aangeduid met
      een bij ministeriële regeling vastgestelde codering.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel195
  - number: '195.2'
    text: |-
      Indien het op basis van de Wegenverkeerswet aan de aanvrager afgegeven rijbewijs, bedoeld in het eerste lid, niet
      kan worden overgelegd omdat het verloren is geraakt of teniet is gegaan, neemt degene die een rijbewijs afgeeft de
      in het rijbewijzenregister opgenomen vermeldingen of beperkende aantekeningen in de vorm van een bij ministeriële
      regeling vastgestelde codering over in het af te geven rijbewijs.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel195
  - number: '196'
    text: 'Indien de aanvrager van een rijbewijs in het bezit is van:'
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel196
  - number: 196.a
    text: |-
      een op basis van de [Wegenverkeerswet][ref1] afgegeven rijbewijs C met de aanduiding «Automaat», dat na 30
      juni 1985 zijn geldigheid heeft verloren door het verstrijken van de geldigheidsduur en dat niet behoort tot
      een bij ministeriële regeling aangewezen model, en hij ter verkrijging van een rijbewijs D een verklaring van
      rijvaardigheid overlegt waaruit blijkt dat hij het praktijkexamen heeft afgelegd met een motorrijtuig zonder
      koppelingspedaal,


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel196
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: 196.b
    text: |-
      een op basis van de [Wegenverkeerswet][ref1] afgegeven rijbewijs D met de aanduiding «Automaat», dat na 30
      juni 1985 zijn geldigheid heeft verloren door het verstrijken van de geldigheidsduur en dat niet behoort tot
      een bij ministeriële regeling aangewezen model, en hij ter verkrijging van een rijbewijs C een verklaring van
      rijvaardigheid overlegt waaruit blijkt dat hij het praktijkexamen heeft afgelegd met een motorrijtuig zonder
      koppelingspedaal,


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel196
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: 196.c
    text: |-
      een op basis van de [Wegenverkeerswet][ref1] afgegeven rijbewijs C dat na 30 juni 1985 zijn geldigheid heeft
      verloren door het verstrijken van de geldigheidsduur en dat niet behoort tot een bij ministeriële regeling
      aangewezen model, en hij ter verkrijging van een rijbewijs D een verklaring van rijvaardigheid overlegt waaruit
      blijkt dat hij het praktijkexamen heeft afgelegd met een motorrijtuig zonder koppelingspedaal, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel196
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: 196.d
    text: |-
      een op basis van de [Wegenverkeerswet][ref1] afgegeven rijbewijs D dat na 30 juni 1985 zijn geldigheid heeft
      verloren door het verstrijken van de geldigheidsduur en dat niet behoort tot een bij ministeriële regeling
      aangewezen model, en hij ter verkrijging van een rijbewijs C een verklaring van rijvaardigheid overlegt waaruit
      blijkt dat hij het praktijkexamen heeft afgelegd met een motorrijtuig zonder koppelingspedaal,


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel196
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: '197.1'
    text: |-
      Met ingang van de datum waarop de bevoegdheid van een Nederlands-Antilliaans bestuursorgaan tot afgifte van
      rijbewijzen is overgegaan op een bestuursorgaan van Curaςao of Sint Maarten, worden voor de toepassing van het
      Reglement rijbewijzen, rijbewijzen die op grond van die bevoegdheid vóór het tijdstip van transitie zijn afgegeven
      door het bevoegde gezag op de Nederlandse Antillen, gelijkgesteld met rijbewijzen die vanaf het tijdstip van
      transitie zijn afgegeven door het daartoe bevoegde gezag op Curaςao of Sint Maarten.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel197
  - number: '197.2'
    text: |-
      Onder tijdstip van transitie als bedoeld in het eerste lid wordt verstaan het tijdstip waarop
      [artikel I van de Rijkswet wijziging Statuut in verband met de opheffing van de Nederlandse Antillen][ref1] in
      werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0028249#ArtikelI
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel197
    references:
      - id: ref1
        bwb_id: BWBR0028249
        artikel: I
  - number: '198'
    text: |-
      Overtreding van [artikel 2, tweede lid][ref1], is een strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel2
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel198
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '2'
        hoofdstuk: I
        paragraaf: '2'
  - number: '199'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel199
  - number: '200'
    text: 'Dit besluit wordt aangehaald als: Reglement rijbewijzen.'
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel200
