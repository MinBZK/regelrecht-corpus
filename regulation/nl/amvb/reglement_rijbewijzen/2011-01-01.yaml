---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: reglement_rijbewijzen
regulatory_layer: AMVB
publication_date: '2021-07-16'
valid_from: '2011-01-01'
bwb_id: BWBR0008074
url: https://wetten.overheid.nl/BWBR0008074/2011-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 17 november 1993, nr. R 163248, Hoofddirectie van
    de Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken;

    Gelet op richtlijn nr. 91/439/EEG van de Raad van de Europese Gemeenschappen van 29 juli 1991 betreffende het
    rijbewijs (PbEG L 237) en op de Wegenverkeerswet 1994;

    De Raad van State gehoord (advies van 5 april 1994, nr. W09.93.0755);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 28 mei 1996, nr. R 219195, Hoofddirectie
    van de Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel1
  - number: 1.a
    text: |-
      wet: [Wegenverkeerswet 1994][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: 1.b
    text: |-
      ledige massa: massa van het voertuig, in bedrijfsvaardige staat, met inbegrip van een half gevulde brandstoftank,
      reservedelen en gereedschappen, die tot de normale uitrusting behoren, maar zonder lading en zonder de bestuurder
      en andere personen, die met het voertuig worden vervoerd;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel1
  - number: 1.c
    text: 'toegestane maximum massa: ledige massa, vermeerderd met het maximum toegestane gewicht aan lading;'
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel1
  - number: 1.d
    text: |-
      oplegger: aanhangwagen waarvan een aanzienlijk deel van de massa, bij gelijkmatig verdeelde lading, door het
      trekkend voertuig wordt gedragen;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel1
  - number: 1.e
    text: |-
      verklaring van rijvaardigheid: verklaring waaruit blijkt van een onderzoek met goed gevolg naar de rijvaardigheid
      van de aanvrager tot het besturen van motorrijtuigen van de in de verklaring vermelde rijbewijscategorie;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel1
  - number: 1.f
    text: |-
      verklaring van geschiktheid: verklaring waaruit blijkt dat de aanvrager de lichamelijke en geestelijke
      geschiktheid bezit tot het besturen van motorrijtuigen van de in de verklaring vermelde rijbewijscategorie of
      rijbewijscategorieën;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel1
  - number: 1.g
    text: |-
      eigen verklaring: verklaring van de aanvrager ter zake van zijn lichamelijke en geestelijke geschiktheid tot
      het besturen van motorrijtuigen van de categorie of categorieën waarvoor een verklaring van geschiktheid wordt
      verlangd;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel1
  - number: 1.h
    text: |-
      geneeskundig verslag: op basis van een keuring van de aanvrager opgemaakt verslag betreffende diens lichamelijke
      en geestelijke geschiktheid tot het besturen van motorrijtuigen van de in het verslag vermelde rijbewijscategorie
      of rijbewijscategorieën;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel1
  - number: 1.i
    text: |-
      theorie-certificaat: verklaring waaruit blijkt dat de aanvrager met goed gevolg een theorie-examen heeft afgelegd
      voor de in de verklaring vermelde rijbewijscategorie;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel1
  - number: 1.j
    text: 'richtlijn vakbekwaamheid bestuurders: de bij ministeriële regeling aangewezen richtlijn;'
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel1
  - number: 1.k
    text: |-
      basiskwalificatie: opleidings- en kennisniveau dat de in de richtlijn vakbekwaamheid bestuurders aangewezen
      onderwerpen en praktische vaardigheiden omvat;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel1
  - number: 1.l
    text: 'getuigschrift van vakbekwaamheid: document dat dient als bewijs dat de houder de basiskwalificatie heeft behaald;'
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel1
  - number: 1.m
    text: |-
      praktijkexamen vakbekwaamheid: praktijkgedeelte van het examen gericht op het behalen van een getuigschrift van
      vakbekwaamheid;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel1
  - number: 1.n
    text: |-
      theorie-examen vakbekwaamheid: theoretische gedeelte van het examen gericht op het behalen van een getuigschrift
      van vakbekwaamheid;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel1
  - number: 1.o
    text: |-
      nascholing: periodiek opleidingstraject dat in de richtlijn vakbekwaamheid bestuurders aangewezen onderwerpen en
      praktische vaardigheden omvat;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel1
  - number: 1.p
    text: 'getuigschrift van nascholing: document dat dient als bewijs dat de houder de nascholing heeft afgerond;'
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel1
  - number: 1.q
    text: |-
      aangewezen exameninstantie: persoon of instelling als bedoeld in
      [artikel 151f, eerste lid, van de Wegenverkeerswet 1994][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151f
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 151f
  - number: 1.r
    text: |-
      verklaring van vakbekwaamheid: verklaring die de aangewezen exameninstantie in het rijbewijzenregister registreert
      nadat de aanvrager de basiskwalificatie heeft behaald;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel1
  - number: 1.s
    text: |-
      verklaring van nascholing: verklaring die de aangewezen exameninstantie in het rijbewijzenregister registreert
      nadat de aanvrager de nascholing heeft afgerond;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel1
  - number: 1.t
    text: |-
      Nederlands omwisselingscertificaat: certificaat als bedoeld in
      [artikel 151g, vierde lid, van de Wegenverkeerswet 1994][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151g
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 151g
  - number: 1.u
    text: |-
      buitenlands omwisselingscertificaat: certificaat afgegeven door de bevoegde autoriteit van een lidstaat van
      de Europese Gemeenschap overeenkomstig de richtlijn vakbekwaamheid bestuurders aantonende dat de bestuurder de
      basiskwalificatie heeft behaald of de nascholing heeft afgerond;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel1
  - number: 1.v
    text: |-
      bestuurdersattest: bestuurdersattest als bedoeld in
      [artikel 151c, vierde lid, onderdeel a, van de Wegenverkeerswet 1994][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151c
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 151c
  - number: 1.w
    text: |-
      nationaal certificaat: certificaat als bedoeld in
      [artikel 151c, vierde lid, onderdeel b, van de Wegenverkeerswet 1994][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151c
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 151c
  - number: 1.x
    text: |-
      kwalificatiekaart bestuurder: kaart afgegeven door de bevoegde autoriteit van een lidstaat van de Europese
      Gemeenschap overeenkomstig de richtlijn vakbekwaamheid bestuurders aantonende dat de bestuurder de
      basiskwalificatie heeft behaald of de nascholing heeft afgerond;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel1
  - number: 1.y
    text: |-
      deelcertificaat: certificaat aantonende dat de bestuurder een aantal uren nascholing heeft gevolgd, maar nog niet
      heeft afgerond.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel1
  - number: '2.1'
    text: |-
      Voor het besturen van motorrijtuigen van de rijbewijscategorie AM, bromfietsen op twee wielen, is geen rijbewijs
      vereist:
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel2
  - number: 2.1.a
    text: |-
      gedurende de tijd dat aan de bestuurder rijonderricht in de zin van de [Wet rijonderricht motorrijtuigen 1993][ref1]
      wordt gegeven in het kader van de opleiding voor het praktijkexamen voor die rijbewijscategorie, mits:


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: 2.1.a.I
    text: |-
      die bestuurder in het bezit is van een niet langer dan een jaar van tevoren afgegeven theoriecertificaat voor de
      rijbewijscategorie AM;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel2
  - number: 2.1.a.II
    text: |-
      de bestuurder geen andere personen vervoert, uitgezonderd degene die aan de bestuurder rijonderricht in de zin van
      de [Wet rijonderricht motorrijtuigen 1993][ref1] geeft;


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: 2.1.b
    text: tijdens het praktijkexamen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel2
  - number: '2.2'
    text: 'Voor het besturen van motorrijtuigen van de rijbewijscategorie A is geen rijbewijs vereist:'
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel2
  - number: 2.2.a
    text: |-
      gedurende de tijd dat aan de bestuurder rijonderricht in de zin van de [Wet rijonderricht motorrijtuigen 1993][ref1]
      wordt gegeven in het kader van de opleiding voor het praktijk-examen voor die rijbewijscategorie, mits


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: 2.2.a.I
    text: 'die bestuurder in het bezit is van een van de volgende documenten:'
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel2
  - number: 2.2.a.I.1
    text: een niet langer dan een jaar tevoren afgegeven theorie-certificaat voor de rijbewijscategorie A;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel2
  - number: 2.2.a.I.2
    text: |-
      een door het daartoe bevoegde militaire gezag niet langer dan een jaar tevoren afgegeven theorie-certificaat voor
      de rijbewijscategorie A;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel2
  - number: 2.2.a.I.3
    text: |-
      een rijbewijs A dat slechts geldig is voor het besturen van motorrijtuigen die zijn voorzien van een automatische
      gangwissel of van een automatische koppeling;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel2
  - number: 2.2.a.I.4
    text: |-
      een rijbewijs A dat slechts geldig is voor het besturen van motorrijtuigen op twee wielen, waarvan het vermogen
      niet meer dan 25 kW en tevens niet meer dan 0,16 kW per kg ledige massa bedraagt;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel2
  - number: 2.2.a.I.5
    text: een geldig rijbewijs B;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel2
  - number: 2.2.a.II
    text: |-
      de bestuurder geen andere personen vervoert, uitgezonderd degene die aan de bestuurder rijonderricht in de zin van
      de [Wet rijonderricht motorrijtuigen 1993][ref1] geeft;


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: 2.2.b
    text: tijdens het praktijk-examen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel2
  - number: '2.3'
    text: |-
      De in het eerste lid, onderdeel a, of het tweede lid, onderdeel a, bedoelde bestuurders zijn verplicht op de eerste
      vordering van de in [artikel 159, onderdeel a, van de wet][ref1] bedoelde personen het theorie-certificaat ter
      inzage af te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
  - number: '2.4'
    text: |-
      Voor de toepassing van het tweede lid, onderdeel a onder I punt 5, wordt met een geldig rijbewijs B gelijkgesteld
      een geldig rijbewijs B, afgegeven door het daartoe bevoegde gezag in een andere lidstaat van de Europese
      Gemeenschap of in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte
      of Zwitserland.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel2
  - number: '3'
    text: |-
      Voor het besturen van motorrijtuigen van de rijbewijscategorieën C, D en E is geen rijbewijs vereist bij het
      uitvoeren van de van het praktijk-examen deel uitmakende bijzondere verrichtingen voor zover het motorrijtuig
      daarbij niet onder toezicht wordt bestuurd:
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel3
  - number: 3.a
    text: |-
      gedurende de tijd dat aan de bestuurder rijonderricht in de zin van de [Wet rijonderricht motorrijtuigen 1993][ref1]
      wordt gegeven in het kader van de opleiding voor het praktijk-examen voor een van die rijbewijscategorieën, en


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: 3.b
    text: tijdens het praktijk-examen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel3
  - number: '4'
    text: |-
      Voor het besturen van motorrijtuigen is geen rijbewijs vereist tijdens het afleggen van de in de artikelen
      [101, eerste lid][ref1], aanhef, en [103, derde lid][ref2], bedoelde rijproef, mits de bestuurder in het bezit is
      van een oproep voor die rijproef.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel103
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '101'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008074
        artikel: '103'
        hoofdstuk: IV
        paragraaf: '3'
  - number: '5.1'
    text: |-
      De in [artikel 110, eerste lid, van de wet][ref1] voor het besturen van motorrijtuigen vastgestelde minimumleefijd
      van achttien jaren geldt niet voor:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel110
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '110'
  - number: 5.1.a
    text: |-
      bestuurders van gehandicaptenvoertuigen die zijn uitgerust met een elektromotor en die niet sneller kunnen rijden
      dan 10 km per uur;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel5
  - number: 5.1.b
    text: |-
      bestuurders van bromfietsen, niet zijnde bestuurders van bromfietsen als bedoeld in onderdeel c, landbouw- of
      bosbouwtrekkers, gehandicaptenvoertuigen, andere dan die bedoeld in onderdeel a, en motorrijtuigen met beperkte
      snelheid, niet zijnde stoom- en motorwalsen; deze motorrijtuigen mogen slechts worden bestuurd door personen die de
      leeftijd van zestien jaren hebben bereikt;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel5
  - number: 5.1.c
    text: |-
      bestuurders van bromfietsen als bedoeld in [artikel 1, eerste lid, onderdeel e, subonderdeel d, van de wet][ref1]
      die beschikken over een gehandicaptenparkeerkaart of een kaart ten behoeve van het vervoer van gehandicapten als
      bedoeld in [artikel 5, zesde lid, van het RVV 1990][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004825#Artikel5
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004825
        artikel: '5'
  - number: '5.2'
    text: |-
      Van de in het eerste lid, onderdeel b, vastgestelde minimumleeftijd van zestien jaren kan ontheffing worden
      verleend voor zover het betreft gehandicaptenvoertuigen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel5
  - number: '6'
    text: |-
      De in [artikel 110][ref1] vervatte eis dat degene aan wie rijonderricht wordt gegeven, de leeftijd van achttien
      jaren dient te hebben bereikt, geldt niet voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel110b
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 110b
  - number: 6.a
    text: |-
      degene aan wie rijonderricht wordt gegeven, een opleiding volgt tot beroepschauffeur in het goederenvervoer over
      de weg,
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel6
  - number: 6.b
    text: |-
      de opleiding plaatsvindt in het kader van de [Wet educatie en beroepsonderwijs][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: 6.c
    text: degene aan wie rijonderricht wordt gegeven, de leeftijd van zeventien jaren heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel6
  - number: '7.1'
    text: |-
      Bij het geven van rijonderricht in de zin van de [Wet rijonderricht motorrijtuigen 1993][ref1] in het kader van de
      opleiding voor het praktijkexamen voor rijbewijscategorie AM dient te worden voldaan aan de volgende eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: 7.1.a
    text: |-
      degene aan wie rijonderricht wordt gegeven op een tweewielige bromfiets dient in het bezit te zijn van een niet
      langer dan een jaar tevoren afgegeven theoriecertificaat voor de rijbewijscategorie AM;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel7
  - number: 7.1.b
    text: |-
      indien degene die rijonderricht geeft, zich achter de bestuurder op de tweewielige bromfiets bevindt, mag geen
      rijonderricht worden gegeven aan andere personen dan aan die bestuurder. Hetzelfde geldt indien degene die
      rijonderricht geeft, zich naast de bestuurder in de drie- of vierwielige bromfiets bevindt;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel7
  - number: 7.1.c
    text: |-
      indien degene die rijonderricht geeft aan bestuurders van tweewielige bromfietsen, zich niet achter de bestuurder
      op de tweewielige bromfiets bevindt, mag rijonderricht worden gegeven aan ten hoogste vier bestuurders en dient
      tussen degene die rijonderricht geeft en de bestuurder of bestuurders die rijonderricht ontvangt of ontvangen,
      radiografisch contact te bestaan;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel7
  - number: 7.1.d
    text: |-
      degene die rijonderricht geeft aan een bestuurder van een bromfiets mag niet tegelijkertijd rijonderricht geven in
      het kader van de opleiding voor een andere rijbewijscategorie.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel7
  - number: '7.2'
    text: |-
      Bij het geven van rijonderricht in de zin van de [Wet rijonderricht motorrijtuigen 1993][ref1] in het kader van de
      opleiding voor het praktijk-examen voor rijbewijs A dient te worden voldaan aan de volgende eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: 7.2.a
    text: |-
      indien degene die rijonderricht geeft, zich achter de bestuurder op het motorrijtuig bevindt, mag geen
      rijonderricht worden gegeven aan andere personen dan aan die bestuurder;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel7
  - number: 7.2.b
    text: |-
      indien degene die rijonderricht geeft, zich niet achter de bestuurder op het motorrijtuig bevindt, mag
      rijonderricht worden gegeven aan ten hoogste twee bestuurders en dient tussen degene die rijonderricht geeft en de
      bestuurder of bestuurders die rijonderricht ontvangt of ontvangen, radiografisch contact te bestaan;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel7
  - number: 7.2.c
    text: |-
      degene die rijondericht geeft mag niet tegelijkertijd rijonderricht geven in het kader van de opleiding voor een
      andere rijbewijscategorie;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel7
  - number: 7.2.d
    text: |-
      het motorrijtuig of de motorrijtuigen waarmee rijonderricht wordt gegeven, dient of dienen te zijn voorzien van een
      bij ministeriële regeling vastgestelde aanduiding, aangebracht op de wijze als bij die regeling is voorgeschreven;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel7
  - number: 7.2.e
    text: 'degene aan wie rijonderricht wordt gegeven, dient in het bezit te zijn van een van de volgende documenten:'
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel7
  - number: 7.2.e.I
    text: een niet langer dan een jaar tevoren afgegeven theorie-certificaat voor de rijbewijscategorie A;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel7
  - number: 7.2.e.II
    text: |-
      een door het daartoe bevoegde militaire gezag niet langer dan een jaar tevoren afgegeven theorie-certificaat voor
      de rijbewijscategorie A;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel7
  - number: 7.2.e.III
    text: |-
      een rijbewijs A dat slechts geldig is voor het besturen van motorrijtuigen die zijn voorzien van een automatische
      gangwissel of van een automatische koppeling;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel7
  - number: 7.2.e.IV
    text: |-
      een rijbewijs A dat slechts geldig is voor het besturen van motorrijtuigen op twee wielen, waarvan het vermogen
      niet meer dan 25 kW en tevens niet meer dan 0,16 kW per kg ledige massa bedraagt;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel7
  - number: 7.2.e.V
    text: een geldig rijbewijs B.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel7
  - number: '7.3'
    text: |-
      Voor de toepassing van het tweede lid, onderdeel e, onder V, wordt met een geldig rijbewijs B gelijkgesteld een
      geldig rijbewijs B, afgegeven door het daartoe bevoegde gezag in een andere lidstaat van de Europese Gemeenschap of
      in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel7
  - number: 7a.1
    text: |-
      De bromfiets, waarmee rijonderricht in de zin van de [Wet rijonderricht motorrijtuigen 1993][ref1] wordt gegeven
      in het kader van de opleiding voor het praktijkexamen voor de rijbewijscategorie AM, tweewielige bromfietsen, dient
      te zijn voorzien van een bij ministeriële regeling vastgestelde aanduiding, aangebracht op de wijze als bij die
      regeling is voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: 7a.2
    text: |-
      De bromfiets waarmee rijonderricht in de zin van de [Wet rijonderricht motorrijtuigen 1993][ref1] wordt gegeven in
      het kader van de opleiding voor het praktijkexamen voor de rijbewijscategorie AM, drie- of vierwielige bromfietsen,
      dient te zijn voorzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: 7a.2.a
    text: |-
      inrichtingen die zo zijn aangebracht dat degene die rijonderricht geeft daarmee de bedrijfsrem en de koppeling
      vanaf zijn zitplaats doeltreffend kan bedienen, dan wel, indien het motorrijtuig niet is voorzien van een
      koppelingspedaal, van een andere inrichting waarmee hij de aandrijving van het motorrijtuig door de motor kan
      onderbreken;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel7a
  - number: 7a.2.b
    text: |-
      een binnen- en een buitenspiegel waarmee degene die rijonderricht geeft het achter en rechts naast hem gelegen
      weggedeelte kan overzien;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel7a
  - number: 7a.2.c
    text: |-
      een bij ministeriële regeling vastgestelde aanduiding, aangebracht op de wijze als bij die regeling is
      voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel7a
  - number: '8'
    text: |-
      Het motorrijtuig waarmee rijonderricht in de zin van de [Wet rijonderricht motorrijtuigen 1993][ref1] wordt gegeven
      in het kader van de opleiding voor het praktijk-examen voor rijbewijs B, dient te zijn voorzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: 8.a
    text: |-
      inrichtingen die zo zijn aangebracht dat degene die rijonderricht geeft, daarmee de bedrijfsrem en, indien het
      motorrijtuig is voorzien van een koppelingspedaal, de koppeling vanaf zijn zitplaats doeltreffend kan bedienen;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel8
  - number: 8.b
    text: |-
      een binnen- en een buitenspiegel waarmee degene die rijonderricht geeft het achter en rechts naast hem gelegen
      weggedeelte kan overzien;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel8
  - number: 8.c
    text: |-
      een bij ministeriële regeling vastgestelde aanduiding, aangebracht op de wijze als bij die regeling is
      voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel8
  - number: '9.1'
    text: |-
      Bij het geven van rijonderricht in de zin van de [Wet rijonderricht motorrijtuigen 1993][ref1] in het kader van de
      opleiding voor het praktijk-examen voor rijbewijs C, D of E dient te worden voldaan aan de volgende eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: 9.1.a
    text: |-
      inrichtingen die zo zijn aangebracht dat degene die rijonderricht geeft, daarmee de bedrijfsrem en, indien het
      motorrijtuig is voorzien van een koppelingspedaal, de koppeling vanaf zijn zitplaats doeltreffend kan bedienen;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel9
  - number: 9.1.b
    text: |-
      het motorrijtuig waarmee rijonderricht wordt gegeven, dient te zijn voorzien van twee of meer buitenspiegels
      waarmee degene die rijonderricht geeft het rechts en links naast en achter hem gelegen weggedeelte kan overzien;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel9
  - number: 9.1.c
    text: |-
      het motorrijtuig waarmee rijonderricht wordt gegeven, dient te zijn voorzien van een bij ministeriële regeling
      vastgestelde aanduiding, aangebracht op de wijze als bij die regeling is voorgeschreven;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel9
  - number: 9.1.d
    text: |-
      degene aan wie rijonderricht wordt gegeven in het kader van de opleiding voor het praktijk-examen voor rijbewijs C
      of D, dient in het bezit te zijn van een rijbewijs B dat hetzij nog geldig is hetzij zijn geldigheid heeft verloren
      door het verstrijken van de geldigheidsduur;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel9
  - number: 9.1.e
    text: |-
      degene aan wie rijonderricht wordt gegeven in het kader van de opleiding voor het praktijkexamen voor rijbewijs
      E, dient in het bezit te zijn van een rijbewijs dat geldig is voor het besturen van het trekkende motorrijtuig,
      al dan niet voorzien van een bij ministeriële regeling vastgestelde codering waaruit blijkt dat de houder van dat
      rijbewijs het praktijkexamen heeft afgelegd in een motorrijtuig dat is voorzien van een automatische gangwissel of
      van een automatische koppeling;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel9
  - number: '9.2'
    text: |-
      Het eerste lid, onderdelen *d* en *e*, geldt niet voor degene die rijonderricht ontvangt in het
      kader van een op het beroep van chauffeur goederenvervoer gerichte beroepsopleiding als bedoeld in de
      [Wet educatie en beroepsonderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: '9.3'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel e, wordt met een rijbewijs dat geldig is voor het besturen van
      het trekkende motorrijtuig gelijkgesteld een door het daartoe bevoegde gezag in een andere lidstaat van de Europese
      Gemeenschap of in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of
      Zwitserland afgegeven rijbewijs dat geldig is voor het besturen van het trekkende motorrijtuig.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel9
  - number: '10'
    text: |-
      [Artikel 9, eerste lid, onderdelen a tot en met c][ref1], is van overeenkomstige toepassing bij het geven van
      rijonderricht in de zin van de [Wet rijonderricht motorrijtuigen 1993][ref2] in het kader van het behalen van de
      basiskwalificatie.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '9'
        hoofdstuk: I
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0006073
  - number: '15.1'
    text: 'Rijbewijzen worden afgegeven voor het besturen van de volgende categorieën van motorrijtuigen:'
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel15
  - number: 15.1.a
    text: |-
      bromfietsen, niet zijnde bromfietsen als bedoeld in
      [artikel 1, eerste lid, onderdeel e, subonderdeel d, van de wet][ref1] (Rijbewijs AM);


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
  - number: 15.1.b
    text: |-
      motorrijtuigen op twee wielen, waarvan de cilinderinhoud meer dan 50 cm3 of de door de constructie bepaalde
      maximumsnelheid meer dan 45 km per uur bedraagt, al dan niet met zijspanwagen of aanhangwagen (Rijbewijs A);
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel15
  - number: 15.1.c
    text: |-
      motorrijtuigen op drie wielen, niet zijnde motorrijtuigen op twee wielen met zijspanwagen, en motorrijtuigen op
      vier of meer wielen, waarvan de toegestane maximum massa niet meer bedraagt dan 3500 kg en die niet zijn ingericht
      voor het vervoer van meer dan 8 personen, de bestuurder daaronder niet begrepen, alsmede door die motorrijtuigen
      voortbewogen aanhangwagens waarvan de toegestane maximum massa niet meer bedraagt dan 750 kg, dan wel meer
      bedraagt dan 750 kg, mits in dat geval de toegestane maximum massa van de aanhangwagen niet meer bedraagt dan de
      ledige massa van het motorrijtuig en de toegestane maximum massa van het samenstel van trekkend motorrijtuig en
      aanhangwagen niet meer bedraagt dan 3500 kg (Rijbewijs B);
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel15
  - number: 15.1.d
    text: |-
      motorrijtuigen, niet zijnde motorrijtuigen van de rijbewijscategorie D, waarvan de toegestane maximum massa meer
      bedraagt dan 3500 kg, alsmede daardoor voortbewogen aanhangwagens waarvan de toegestane maximum massa niet meer
      bedraagt dan 750 kg (Rijbewijs C);
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel15
  - number: 15.1.e
    text: |-
      motorrijtuigen, niet zijnde motorrijtuigen van de rijbewijscategorie D, waarvan de toegestane maximum massa meer
      dan 3500 kg, doch ten hoogste 7500 kg bedraagt, alsmede daardoor voortbewogen aanhangwagens waarvan de toegestane
      maximum massa niet meer bedraagt dan 750 kg (Rijbewijs C1);
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel15
  - number: 15.1.f
    text: |-
      motorrijtuigen die zijn ingericht voor het vervoer van meer dan 8 personen, de bestuurder daaronder niet begrepen,
      alsmede daardoor voortbewogen aanhangwagens waarvan de toegestane maximum massa niet meer bedraagt dan 750 kg
      (Rijbewijs D);
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel15
  - number: 15.1.g
    text: |-
      motorrijtuigen, die zijn ingericht voor het vervoer van meer dan 8 doch niet meer dan 16 personen, de bestuurder
      daaronder niet begrepen, alsmede daardoor voortbewogen aanhangwagens waarvan de toegestane maximum massa niet meer
      bedraagt dan 750 kg (Rijbewijs D1);
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel15
  - number: 15.1.h
    text: |-
      motorrijtuigen van een van de rijbewijscategorieën B, C, C1, D of D1 voor het besturen waarvan de bestuurder in
      het bezit is van een rijbewijs, met een andere aanhangwagen dan op grond van dat rijbewijs mag worden voortbewogen
      (Rijbewijs E) mits
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel15
  - number: 15.1.h.I
    text: |-
      in het geval van een motorrijtuig van de rijbewijscategorie C1 de toegestane maximum massa van de aanhangwagen
      niet meer bedraagt dan de ledige massa van het motorrijtuig en de toegestane maximum massa van het samenstel van
      trekkend motorrijtuig en aanhangwagen niet meer bedraagt dan 12000 kg of
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel15
  - number: 15.1.h.II
    text: |-
      in het geval van een motorrijtuig van de rijbewijscategorie D1 de toegestane maximum massa van de aanhangwagen
      niet meer bedraagt dan de ledige massa van het motorrijtuig en de toegestane maximum massa van het samenstel van
      trekkend motorrijtuig en aanhangwagen niet meer bedraagt dan 12000 kg en de aanhangwagen niet wordt gebruikt om
      personen te vervoeren.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel15
  - number: '15.2'
    text: |-
      Voor de bepaling van het aantal wielen worden twee op dezelfde as gemonteerde wielen als een wiel beschouwd, indien
      de afstand tussen de middens van de contactvlakken van deze wielen met de grond kleiner is dan 460 mm.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel15
  - number: '15.3'
    text: |-
      In afwijking van het eerste lid worden motorrijtuigen, ingericht voor het vervoer van ten hoogste 8 personen,
      de bestuurder daaronder niet begrepen, waarvan de toegestane maximum massa als gevolg van een aan het voertuig
      aangebrachte bepantsering meer dan 3500 kg bedraagt, begrepen onder de rijbewijscategorie B.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel15
  - number: '15.4'
    text: 'In afwijking van het eerste lid worden begrepen onder de rijbewijscategorie B:'
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel15
  - number: 15.4.a
    text: |-
      motorrijtuigen, bestemd voor het vervoer van goederen, met een toegestane maximummassa van meer dan 3500 kg,
      maar minder dan 7500 kg, die worden aangedreven door een elektromotor waarvoor de elektrische energie uitsluitend
      geleverd wordt door een batterij en waarvan de batterij wordt opgeladen door middel van een elektrisch oplaadpunt
      buiten het voertuig;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel15
  - number: 15.4.b
    text: |-
      hybride elektrische motorrijtuigen, bestemd voor het vervoer van goederen, met een toegestane maximummassa van
      meer dan 3500 kg, maar minder dan 7500 kg, waarvan de batterij kan worden opgeladen door middel van een elektrisch
      oplaadpunt buiten het voertuig.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel15
  - number: 15a
    text: |-
      Indien de aanvrager van een rijbewijs voor de categorie AM, die blijkens de ten behoeve van hem in het
      rijbewijzenregister geregistreerde verklaring van rijvaardigheid het praktijkexamen voor de categorie AM heeft
      afgelegd met een bromfiets op drie of vier wielen, wordt een rijbewijs AM afgegeven dat slechts geldig is voor
      het besturen van bromfietsen op drie of vier wielen. In het rijbewijs is deze beperking aangeduid met een bij
      ministeriële regeling vastgestelde codering.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel15a
  - number: '16'
    text: |-
      Aan de aanvrager van een rijbewijs, die blijkens de ten behoeve van hem in het rijbewijzenregister geregistreerde
      verklaring van geschiktheid slechts een motorrijtuig kan besturen dat aan bepaalde eisen voldoet dan wel slechts
      een motorrijtuig kan besturen indien hij gebruik maakt van kunst- of hulpmiddelen, wordt een rijbewijs afgegeven
      dat slechts geldig is voor het besturen van een motorrijtuig dat aan die eisen voldoet dan wel indien de aanvrager
      bij het besturen gebruik maakt van die kunst- of hulpmiddelen. In het rijbewijs is deze beperking aangeduid met een
      bij ministeriële regeling vastgestelde codering.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel16
  - number: '17.1'
    text: |-
      Aan de aanvrager van een rijbewijs, die blijkens de ten behoeve van hem in het rijbewijzenregister geregistreerde
      verklaring van rijvaardigheid het praktijkexamen heeft afgelegd in een motorrijtuig zonder koppelingspedaal of,
      indien het een motorrijtuig van de categorie A betreft, zonder handbediende hendel, dan wel blijkens de ten behoeve
      van hem in het rijbewijzenregister geregistreerde verklaring van geschiktheid slechts een motorrijtuig mag besturen
      zonder koppelingspedaal of, indien het een motorrijtuig van de categorie A betreft, zonder handbediende hendel,
      wordt een rijbewijs afgegeven dat slechts geldig is voor het besturen van motorrijtuigen van de in de verklaring
      van rijvaardigheid dan wel de verklaring van geschiktheid genoemde rijbewijscategorie zonder koppelingspedaal
      of, indien het een motorrijtuig van de categorie A betreft, zonder handbediende hendel. In het rijbewijs is deze
      beperking aangeduid met een bij ministeriële regeling vastgestelde codering.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel17
  - number: '17.2'
    text: Het eerste lid is niet van toepassing op aanvragen voor de rijbewijscategorie AM.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel17
  - number: '18.1'
    text: |-
      Onverminderd [artikel 17][ref1] wordt aan de aanvrager die in het bezit is van een rijbewijs B dat is voorzien van
      een bij ministeriële regeling vastgestelde code waaruit blijkt dat de houder van dat rijbewijs het praktijkexamen
      heeft afgelegd in een motorrijtuig zonder koppelingspedaal, en ten behoeve van wie in het rijbewijzenregister een
      verklaring van rijvaardigheid voor de rijbewijscategorie C of D is geregistreerd, een rijbewijs afgegeven voor het
      besturen van de betrokken categorieën van motorrijtuigen, zonder dat voor een van die categorieën een beperking tot
      motorrijtuigen zonder koppelingspedaal geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel17
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '17'
        hoofdstuk: I
        paragraaf: '6'
  - number: '18.2'
    text: |-
      In afwijking van [artikel 17][ref1] wordt aan de aanvrager die in het bezit is van een rijbewijs B, dat is
      voorzien van een bij ministeriële regeling vastgestelde codering waaruit blijkt dat de houder van dat rijbewijs
      het praktijkexamen heeft afgelegd in een motorrijtuig zonder koppelingspedaal, en ten behoeve van wie in het
      rijbewijzenregister een verklaring van rijvaardigheid voor de categorie E bij B is geregistreerd waaruit blijkt
      dat hij het praktijkexamen heeft afgelegd met een aanhangwagen, voortbewogen door een trekkend motorrijtuig
      van de categorie B met koppelingspedaal een rijbewijs afgegeven voor de categorie E bij B, zonder dat voor die
      categorie of voor de categorie waartoe het trekkend motorrijtuig behoort, een beperking tot motorrijtuigen zonder
      koppelingspedaal geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel17
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '17'
        hoofdstuk: I
        paragraaf: '6'
  - number: '18.3'
    text: |-
      In afwijking van [artikel 17][ref1] wordt aan de aanvrager die in het bezit is van een rijbewijs C, dat is
      voorzien van een bij ministeriële regeling vastgestelde codering waaruit blijkt dat de houder van dat rijbewijs
      het praktijkexamen heeft afgelegd in een motorrijtuig zonder koppelingspedaal, en ten behoeve van wie in het
      rijbewijzenregister een verklaring van rijvaardigheid voor de categorie E bij C is geregistreerd waaruit blijkt
      dat hij het praktijkexamen heeft afgelegd met een aanhangwagen, voortbewogen door een trekkend motorrijtuig van
      de categorie C, met koppelingspedaal, een rijbewijs afgegeven voor de categorie E bij C, zonder dat voor die
      categorie of voor de categorie waartoe het trekkend motorrijtuig behoort, een beperking tot motorrijtuigen zonder
      koppelingspedaal geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel17
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '17'
        hoofdstuk: I
        paragraaf: '6'
  - number: '18.4'
    text: |-
      In afwijking van [artikel 17][ref1] wordt aan de aanvrager die in het bezit is van een rijbewijs D, dat is
      voorzien van een bij ministeriële regeling vastgestelde codering waaruit blijkt dat de houder van dat rijbewijs
      het praktijkexamen heeft afgelegd in een motorrijtuig zonder koppelingspedaal, en ten behoeve van wie in het
      rijbewijzenregister een verklaring van rijvaardigheid voor de categorie E bij D is geregistreerd waaruit blijkt
      dat hij het praktijkexamen heeft afgelegd met een aanhangwagen, voortbewogen door een trekkend motorrijtuig van
      de categorie D, met koppelingspedaal, een rijbewijs afgegeven voor de categorie E bij D, zonder dat voor die
      categorie of voor de categorie waartoe het trekkend motorrijtuig behoort, een beperking tot motorrijtuigen zonder
      koppelingspedaal geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel17
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '17'
        hoofdstuk: I
        paragraaf: '6'
  - number: '18.5'
    text: 'Voor de toepassing van het eerste lid wordt met een rijbewijs B als daar bedoeld gelijkgesteld:'
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel18
  - number: 18.5.a
    text: een rijbewijs B dat zijn geldigheid heeft verloren door het verstrijken van de geldigheidsduur;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel18
  - number: 18.5.b
    text: |-
      een door het daartoe bevoegde gezag in een andere lidstaat van de Europese Gemeenschap of in een andere staat die
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland aan de aanvrager afgegeven
      geldig rijbewijs B.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel18
  - number: '19'
    text: |-
      Aan de aanvrager van een rijbewijs, die blijkens de ten behoeve van hem in het rijbewijzenregister geregistreerde
      verklaring van geschiktheid slechts een motorrijtuig kan besturen binnen een geografisch beperkt gebied, wordt een
      rijbewijs afgegeven dat slechts geldig is voor het besturen van motorrijtuigen binnen dat gebied. In het rijbewijs
      is deze beperking aangeduid met een bij ministeriële regeling vastgestelde codering.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel19
  - number: 19a
    text: |-
      Aan de aanvrager van een rijbewijs, die blijkens de ten behoeve van hem in het rijbewijzenregister geregistreerde
      verklaring van geschiktheid de tot het besturen van motorrijtuigen vereiste geschiktheid slechts bezit indien hij
      het door hem te besturen motorrijtuig gebruikt voor privé doeleinden, wordt een rijbewijs afgegeven dat slechts
      geldig is voor het besturen van motorrijtuigen voor privé doeleinden. In het rijbewijs is deze beperking aangeduid
      met een bij ministeriële regeling vastgestelde codering.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel19a
  - number: 19b
    text: |-
      Indien de aanvraag betrekking heeft op de afgifte van een rijbewijs voor een andere categorie dan AM, geeft
      degene die belast is met de afgifte van rijbewijzen tevens een rijbewijs af dat geldig is voor het besturen van
      motorrijtuigen waarvoor een rijbewijs AM is vereist.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel19b
  - number: '20'
    text: |-
      Aan de aanvrager van een rijbewijs, die blijkens de ten behoeve van hem in het rijbewijzenregister geregistreerde
      verklaring van rijvaardigheid het praktijk-examen voor de rijbewijscategorie A heeft afgelegd met een motorrijtuig
      op twee wielen, waarvan de cylinderinhoud meer dan 120 cm3 en het vermogen minder dan 35 kW bedraagt, wordt een
      rijbewijs A afgegeven dat gedurende twee jaren na de datum van afgifte slechts geldig is voor het besturen van
      motorrijtuigen van die rijbewijscategorie, waarvan het vermogen niet meer dan 25 kW en tevens niet meer dan 0,16
      kW per kg ledige massa bedraagt, en dat na die twee jaren geldig is voor het besturen van motorrijtuigen van die
      rijbewijscategorie zonder dat van die beperking sprake is.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel20
  - number: '21'
    text: |-
      Aan de aanvrager van een rijbewijs, die blijkens de ten behoeve van hem in het rijbewijzenregister geregistreerde
      verklaring van rijvaardigheid het praktijk-examen voor de rijbewijscategorie E heeft afgelegd met een aanhangwagen,
      voortbewogen door een trekkend motorrijtuig voor het besturen waarvan een rijbewijs B is vereist, wordt een
      rijbewijs E afgegeven dat slechts geldig is voor het voortbewegen van een aanhangwagen indien deze wordt
      voortbewogen door een motorrijtuig voor het besturen waarvan een rijbewijs B is vereist.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel21
  - number: 21a
    text: |-
      Aan de aanvrager van een rijbewijs, die blijkens de ten behoeve van hem in het rijbewijzenregister geregistreerde
      verklaring van rijvaardigheid het praktijkexamen voor de rijbewijscategorie C heeft afgelegd met een motorrijtuig
      voor het besturen waarvan een rijbewijs C is vereist, wordt een rijbewijs C en C1 afgegeven.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel21a
  - number: 21b
    text: |-
      Aan de aanvrager van een rijbewijs, die blijkens de ten behoeve van hem in het rijbewijzenregister geregistreerde
      verklaring van rijvaardigheid het praktijkexamen voor de rijbewijscategorie D heeft afgelegd met een motorrijtuig
      voor het besturen waarvan een rijbewijs D is vereist, wordt een rijbewijs D en D1 afgegeven.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel21b
  - number: '22'
    text: |-
      Aan de aanvrager van een rijbewijs, die blijkens de ten behoeve van hem in het rijbewijzenregister geregistreerde
      verklaring van rijvaardigheid het praktijkexamen voor de rijbewijscategorie E heeft afgelegd met een aanhangwagen,
      voortbewogen door een trekkend motorrijtuig voor het besturen waarvan een rijbewijs C is vereist, wordt een
      rijbewijs E afgegeven dat geldig is voor het voortbewegen van een aanhangwagen indien deze wordt voortbewogen
      door een motorrijtuig voor het besturen waarvan een rijbewijs B, C of C1 is vereist en, indien de aanvrager in het
      bezit is van een rijbewijs D, voor het voortbewegen van een aanhangwagen indien deze wordt voortbewogen door een
      motorrijtuig voor het besturen waarvan een rijbewijs D of D1 is vereist.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel22
  - number: '23'
    text: |-
      Aan de aanvrager van een rijbewijs, die blijkens de ten behoeve van hem in het rijbewijzenregister geregistreerde
      verklaring van rijvaardigheid het praktijkexamen voor de rijbewijscategorie E heeft afgelegd met een aanhangwagen,
      voortbewogen door een trekkend motorrijtuig voor het besturen waarvan een rijbewijs D is vereist, wordt een
      rijbewijs E afgegeven dat geldig is voor het voortbewegen van een aanhangwagen indien deze wordt voortbewogen door
      een motorrijtuig voor het besturen waarvan een rijbewijs B, D of D1 is vereist.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel23
  - number: '24'
    text: |-
      Aan de aanvrager van een rijbewijs, die blijkens de ten behoeve van hem in het rijbewijzenregister geregistreerde
      verklaring van geschiktheid de voor het besturen van motorrijtuigen vereiste geschiktheid slechts bezit indien
      hij corrigerende lenzen draagt, wordt een rijbewijs afgegeven dat slechts geldig is indien de aanvrager bij het
      besturen gebruik maakt van die corrigerende lenzen. In het rijbewijs is deze beperking aangeduid met een bij
      ministeriële regeling vastgestelde codering.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel24
  - number: '25'
    text: |-
      Aan de aanvrager van een rijbewijs, die blijkens de ten behoeve van hem in het rijbewijzenregister geregistreerde
      verklaring van geschiktheid de voor het besturen van motorrijtuigen vereiste geschiktheid slechts bezit voor een
      termijn die korter is dan de in [artikel 122, eerste lid, van de wet][ref1] voorziene geldigheidsduur van het
      rijbewijs, wordt een rijbewijs afgegeven dat slechts geldig is gedurende die kortere termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel122
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '122'
  - number: '26'
    text: De aanvraag van een rijbewijs geschiedt op de wijze als in de volgende artikelen is bepaald.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel26
  - number: '27'
    text: |-
      Indien de aanvrager woonachtig is in Nederland, dient de aanvraag te zijn gericht tot en te worden ingediend bij de
      burgemeester van de gemeente waar hij als ingezetene is ingeschreven in de basisadministratie persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel27
  - number: '28'
    text: Indien de aanvraag betrekking heeft op de afgifte van
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel28
  - number: 28.a
    text: |-
      een rijbewijs tegen overlegging van een rijbewijs, aan de aanvrager afgegeven door het daartoe bevoegde gezag
      buiten Nederland,
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel28
  - number: 28.b
    text: |-
      een rijbewijs dat geldig is voor een categorie of categorieën waarop de ongeldigverklaring van een rijbewijs, aan
      de aanvrager afgegeven door het daartoe bevoegde gezag in een andere lid-staat van de Europese Gemeenschap of in
      een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, geen
      betrekking heeft,
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel28
  - number: 28.c
    text: |-
      een rijbewijs dat geldig is voor een categorie of categorieën waarvoor een rijbewijs, aan de aanvrager afgegeven
      door het daartoe bevoegde gezag in een andere lid-staat van de Europese Gemeenschap of in een andere staat die
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, ongeldig is verklaard,
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel28
  - number: 28.d
    text: |-
      een rijbewijs ter vervanging van een eerder door het daartoe bevoegde gezag in een andere lid-staat van de Europese
      Gemeenschap of in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte
      of Zwitserland aan de aanvrager afgegeven rijbewijs, dat versleten of geheel of ten dele onleesbaar is, dan wel
      verloren is geraakt of teniet is gegaan, dan wel,
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel28
  - number: 28.e
    text: |-
      een rijbewijs tegen overlegging van een door het daartoe bevoegde militaire gezag afgegeven bewijs van
      rijvaardigheid voor het besturen van motorrijtuigen,
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel28
  - number: '29'
    text: |-
      Indien de aanvrager woonachtig is in Nederland, doch niet als ingezetene is ingeschreven in de basisadministratie
      persoonsgegevens van een gemeente, dient de aanvraag te zijn gericht tot de Dienst Wegverkeer en te worden
      ingediend bij de burgemeester van de gemeente waar de aanvrager woonachtig is. De burgemeester geleidt de aanvraag
      terstond door naar de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel29
  - number: '30'
    text: |-
      Indien de aanvraag betrekking heeft op de afgifte van een rijbewijs aan een aanvrager die vreemdeling in de zin
      van de Vreemdelingenwet 2000 is en aan wie op grond van zijn hoedanigheid van of betrekking tot diplomatiek of
      consulair personeel dan wel op grond van zijn hoedanigheid van of betrekking tot personeel in dienst van een
      in Nederland gevestigde internationale organisatie houder is van een door Onze Minister van Buitenlandse Zaken
      verstrekt identiteitsbewijs voor geprivilegieerden, dient de aanvraag in afwijking van [artikel 29][ref1] te zijn
      gericht tot en te worden ingediend bij de Dienst Wegverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel29
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '29'
        hoofdstuk: II
        paragraaf: '1'
  - number: '31'
    text: |-
      Indien de aanvraag betrekking heeft op de afgifte van een rijbewijs aan een buiten Nederland woonachtige aanvrager
      aan wie nog niet eerder een rijbewijs is afgegeven dan wel aan een buiten Nederland, anders dan in een andere
      lidstaat van de Europese Gemeenschap of in een andere staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte of Zwitserland, woonachtige aanvrager, dient de aanvraag te zijn gericht tot en te
      worden ingediend bij de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel31
  - number: '32.1'
    text: |-
      Onverminderd het tweede en het derde lid dient de aanvrager, indien de aanvraag betrekking heeft op de afgifte
      van een rijbewijs aan een aanvrager aan wie nog niet eerder een rijbewijs is afgegeven voor de rijbewijscategorie
      waarop de aanvraag betrekking heeft, de afgifte van een rijbewijs dat geldig is voor een categorie of categorieën
      waarvoor een eerder aan de aanvrager afgegeven rijbewijs in verband met een gevorderd onderzoek naar diens
      rijvaardigheid tot het besturen van motorrijtuigen ongeldig is verklaard, dan wel de afgifte van een rijbewijs dat
      geldig is voor een categorie of categorieën waarvoor een eerder aan de aanvrager afgegeven rijbewijs ongeldig is
      verklaard op grond van [artikel 124, eerste lid, onderdeel a, b of c, van de wet][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel124
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '124'
  - number: 32.1.a
    text: op het moment van aanvraag in Nederland woonachtig te zijn en tevens
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel32
  - number: 32.1.a.I
    text: |-
      in de onmiddellijk aan de aanvraag voorafgaande periode van één jaar ten minste 184dagen in Nederland woonachtig te
      zijn geweest, of
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel32
  - number: 32.1.a.II
    text: |-
      gedurende een periode van ten minste zes maanden te zijn ingeschreven aan een in Nederland gevestigde universiteit,
      school voor middelbaar, voortgezet of hoger beroepsonderwijs of andere school voor middelbaar, voortgezet of hoger
      onderwijs, of
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel32
  - number: 32.1.a.III
    text: |-
      indien hij wegens tijdelijk verblijf buiten Nederland gedurende een periode van maximaal vier jaar niet geheel
      kan voldoen aan de onder I genoemde voorwaarde, gedurende een periode van ten minste tien jaar onafgebroken in
      Nederland woonachtig te zijn geweest, dan wel
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel32
  - number: 32.1.b
    text: |-
      in de onmiddellijk aan het moment van de aanvraag voorafgaande periode van één jaar ten minste 185 dagen in
      Nederland woonachtig te zijn geweest.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel32
  - number: '32.2'
    text: |-
      Indien het een aanvraag betreft als bedoeld in de [artikelen 44 tot en met 48][ref1], dient de aanvrager in
      Nederland woonachtig te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel44
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '44'
        hoofdstuk: II
        paragraaf: '2'
  - number: '32.3'
    text: |-
      Het eerste lid geldt niet indien bij de aanvraag een door het daartoe bevoegde militaire gezag niet langer dan
      zes maanden voor de aanvraag afgegeven bewijs van rijvaardigheid voor het besturen van motorrijtuigen van de
      rijbewijscategorie of rijbewijscategorieën waarop de aanvraag betrekking heeft, wordt overgelegd.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel32
  - number: '33.1'
    text: 'Bij de aanvraag van een rijbewijs dienen de volgende bescheiden te worden overgelegd:'
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel33
  - number: 33.1.a
    text: een volledig ingevuld aanvraagformulier volgens bij ministeriële regeling vastgesteld model;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel33
  - number: 33.1.b.I
    text: |-
      een op naam van de aanvrager gesteld identiteitsbewijs als bedoeld in
      [artikel 1, eerste lid, onder 1°, 2° of 3°, van de Wet op de identificatieplicht][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 33.1.b.II
    text: |-
      een eerder aan de aanvrager afgegeven rijbewijs dat hetzij nog geldig is hetzij zijn geldigheid heeft verloren door
      het verstrijken van de geldigheidsduur, dan wel
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel33
  - number: 33.1.b.III
    text: indien de aanvrager niet in Nederland woonachtig is, een fotokopie van een van de onder I genoemde documenten.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel33
  - number: 33.1.c.I
    text: |-
      indien de aanvrager woonachtig is in Nederland en is ingeschreven aan een in Nederland gevestigde universiteit,
      school voor middelbaar, voortgezet of hoger beroepsonderwijs of andere school voor middelbaar, voortgezet of hoger
      onderwijs, een bewijs van inschrijving aan die universiteit of school;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel33
  - number: 33.1.c.II
    text: |-
      indien aan de aanvrager die vreemdeling in de zin van de [Vreemdelingenwet 2000][ref1] is, op grond van diens
      hoedanigheid van of betrekking tot diplomatiek of consulair personeel dan wel op grond van diens hoedanigheid van
      of betrekking tot personeel in dienst van een in Nederland gevestigde internationale organisatie door Onze Minister
      van Buitenlandse Zaken een identiteitsbewijs voor geprivilegieerden is verstrekt, een fotokopie van dat bewijs;


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 33.1.c.III
    text: |-
      indien de aanvrager lid is van een in het kader van het op 19 juni 1951 te Londen gesloten Verdrag tussen de Staten
      die partij zijn bij het Noord-Atlantisch Verdrag, nopens de rechtspositie van hun krijgsmachten, in Nederland
      gelegerde krijgsmacht, lid is van de tot die krijgsmacht behorende civiele dienst of behoort tot het gezin van
      een lid van een krijgsmacht als hiervoor bedoeld of tot het gezin van een tot de civiele dienst van zodanige
      krijgsmacht behorende persoon, een door de betrokken basiscommandant ondertekende verklaring waaruit zulks blijkt;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel33
  - number: 33.1.c.IV
    text: |-
      indien de aanvraag betrekking heeft op de afgifte van een rijbewijs aan een buiten Nederland woonachtige
      aanvrager aan wie nog niet eerder een rijbewijs is afgegeven dan wel aan een buiten Nederland, anders dan
      in een andere lidstaat van de Europese Gemeenschap of in een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte of Zwitserland, woonachtige aanvrager, enig bewijsstuk betreffende
      de woonplaats en de datum en plaats van geboorte van de aanvrager alsmede, in de gevallen bedoeld in
      [artikel 32, eerste lid, aanhef en onderdeel b][ref1], een bewijs uit de basisadministratie persoonsgegevens van de
      gemeente waar hij laatstelijk woonachtig was.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel32
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '32'
        hoofdstuk: II
        paragraaf: '1'
  - number: 33.1.d
    text: een pasfoto van de aanvrager, die voldoet aan de bij ministeriële regeling vastgestelde eisen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel33
  - number: '33.2'
    text: |-
      Bij de aanvraag van een rijbewijs raadpleegt de met de afgifte van rijbewijzen belaste autoriteit de in de
      gemeentelijke basisadministratie persoonsgegevens ingeschreven persoonsgegevens van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel33
  - number: '34.1'
    text: |-
      Indien aan de aanvrager nog niet eerder een rijbewijs is afgegeven, dient ten behoeve van hem in het
      rijbewijzenregister te zijn geregistreerd:
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel34
  - number: 34.1.a
    text: |-
      een verklaring van rijvaardigheid voor iedere rijbewijscategorie waarop de aanvraag betrekking heeft, waarbij de
      datum van registratie niet langer dan drie jaar vóór de aanvraag mag liggen;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel34
  - number: 34.1.b
    text: |-
      een verklaring van geschiktheid voor iedere rijbewijscategorie waarop de aanvraag betrekking heeft, waarbij de
      datum van registratie niet langer dan een jaar vóór de aanvraag mag liggen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel34
  - number: '34.2'
    text: |-
      Het eerste lid, onderdeel b, is niet van toepassing op aanvragen die betrekking hebben op afgifte van een rijbewijs
      voor de categorie AM.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel34
  - number: '35.1'
    text: |-
      Indien de aanvraag betrekking heeft op de vernieuwing van het eerder aan de aanvrager afgegeven rijbewijs, dient
      bij de aanvraag aan de volgende vereisten te worden voldaan:
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel35
  - number: 35.1.a
    text: |-
      behoudens de in [artikel 33][ref1] genoemde bescheiden wordt tevens dat eerder afgegeven rijbewijs overgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel33
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '33'
        hoofdstuk: II
        paragraaf: '2'
  - number: 35.1.b
    text: |-
      in het rijbewijzenregister is ten behoeve van de aanvrager een verklaring van geschiktheid geregistreerd, waarbij
      de datum van registratie niet langer dan een jaar vóór de aanvraag mag liggen, indien
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel35
  - number: 35.1.b.I
    text: |-
      de aanvraag mede betrekking heeft op een der rijbewijscategorieën C, C1, D, D1, E bij C, E bij C1, E bij D of E
      bij D1,
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel35
  - number: 35.1.b.II
    text: de aanvrager de leeftijd van 70 jaren heeft bereikt,
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel35
  - number: 35.1.b.III
    text: |-
      de aanvrager de leeftijd van 65 jaren heeft bereikt en in het bezit is van een rijbewijs waarvan de geldigheidsduur
      verstrijkt op of na de dag waarop hij de leeftijd van 70 jaren bereikt,
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel35
  - number: 35.1.b.IV
    text: |-
      blijkens een aantekening in het rijbewijzenregister naar het oordeel van het CBR de registratie van een dergelijke
      verklaring noodzakelijk is op grond van de bij het CBR bekend zijnde gegevens met betrekking tot de lichamelijke en
      geestelijke gesteldheid van de aanvrager, dan wel
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel35
  - number: 35.1.b.V
    text: |-
      blijkens een door het CBR ingevolge [artikel 124, tweede lid, van de wet][ref1] in het rijbewijzenregister
      aangebrachte aantekening de registratie van een dergelijke verklaring noodzakelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel124
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '124'
  - number: 35.1.c
    text: |-
      in het rijbewijzenregister is ten behoeve van de aanvrager een verklaring van rijvaardigheid geregistreerd, waarbij
      de datum van registratie niet langer dan drie jaar vóór de aanvraag mag liggen, indien blijkens een door het CBR
      ingevolge [artikel 124, tweede lid, van de wet][ref1] in het rijbewijzenregister aangebrachte aantekening een
      registratie van een dergelijke verklaring noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel124
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '124'
  - number: '35.2'
    text: |-
      Het eerste lid, onderdeel b, is niet van toepassing op aanvragen die betrekking hebben op afgifte van een rijbewijs
      voor de categorie AM.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel35
  - number: '35.3'
    text: |-
      Indien de aanvraag betrekking heeft op een rijbewijs voor de categorie AM, wordt onder rijbewijs in het eerste lid,
      onderdeel a, mede verstaan een rijbewijs afgegeven voor een of meer andere categorieën dan AM, dat is afgegeven na
      30 juni 1985 en dat zijn geldigheid heeft verloren door het verstrijken van de geldigheidsduur.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel35
  - number: '35.4'
    text: |-
      Het eerste lid, onderdeel b, is niet van toepassing voor zover de aanvraag strekt ter vervanging van een eerder
      aan de aanvrager afgegeven rijbewijs van een of meer van de categorieën C, C1, D, D1, E bij C, E bij C1, E bij
      D en E bij D1, en de aanvraag uitsluitend verband houdt met de vermelding op het af te geven rijbewijs van een
      getuigschrift van vakbekwaamheid of een getuigschrift van nascholing.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel35
  - number: '35.5'
    text: |-
      Indien de aanvraag betrekking heeft op de vermelding op het af te geven rijbewijs van een getuigschrift
      van vakbekwaamheid dan wel een getuigschrift van nascholing, dient ten behoeve van de aanvrager in het
      rijbewijzenregister een verklaring van vakbekwaamheid dan wel een verklaring van nascholing geregistreerd te zijn,
      waarbij de datum van registratie niet langer dan vijf jaren vóór de aanvraag mag liggen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel35
  - number: '36.1'
    text: |-
      Indien de aanvraag betrekking heeft op de afgifte van een rijbewijs dat geldig is voor meer categorieën dan het
      eerder aan de aanvrager afgegeven rijbewijs, dient bij de aanvraag aan de volgende vereisten te worden voldaan:
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel36
  - number: 36.1.a
    text: |-
      behoudens de in [artikel 33][ref1] genoemde bescheiden wordt tevens dat eerder afgegeven rijbewijs overgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel33
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '33'
        hoofdstuk: II
        paragraaf: '2'
  - number: 36.1.b
    text: |-
      in het rijbewijzenregister is ten behoeve van de aanvrager een verklaring van rijvaardigheid geregistreerd voor
      iedere rijbewijscategorie waarop de aanvraag betrekking heeft en waarvoor het eerder aan de aanvrager afgegeven
      rijbewijs niet geldig is, waarbij de datum van registratie niet langer dan drie jaar vóór de aanvraag mag liggen;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel36
  - number: 36.1.c
    text: |-
      in het rijbewijzenregister is ten behoeve van de aanvrager een verklaring van geschiktheid geregistreerd, waarbij
      de datum van registratie niet langer dan een jaar vóór de aanvraag mag liggen, voor iedere rijbewijscategorie
      waarop de aanvraag betrekking heeft en waarvoor het eerder aan de aanvrager afgegeven rijbewijs niet geldig is, met
      uitzondering van de rijbewijscategorie AM.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel36
  - number: '36.2'
    text: |-
      Indien de aanvraag tevens betrekking heeft op de vermelding op het af te geven rijbewijs van een getuigschrift
      van vakbekwaamheid dan wel een getuigschrift van nascholing, dient ten behoeve van de aanvrager in het
      rijbewijzenregister een verklaring van vakbekwaamheid dan wel een verklaring van nascholing geregistreerd te zijn,
      waarbij de datum van registratie niet langer dan vijf jaren vóór de aanvraag mag liggen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel36
  - number: '37'
    text: |-
      Voor de toepassing van de [artikelen 34][ref1] en [36][ref2] wordt met een niet langer dan drie jaar vóór de
      aanvraag in het rijbewijzenregister geregistreerde verklaring van rijvaardigheid gelijkgesteld een door het daartoe
      bevoegde militaire gezag niet langer dan zes maanden vóór de aanvraag afgegeven bewijs van rijvaardigheid voor het
      besturen van motorrijtuigen van de rijbewijscategorie of rijbewijscategorieën waarop de aanvraag betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel36
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '34'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008074
        artikel: '36'
        hoofdstuk: II
        paragraaf: '2'
  - number: '38.1'
    text: |-
      Indien de aanvraag betrekking heeft op de afgifte van een rijbewijs ter vervanging van een eerder aan de aanvrager
      afgegeven rijbewijs dat nog geldig is hetzij zijn geldigheid door het verstrijken van de geldigheidsduur heeft
      verloren, welk rijbewijs versleten of geheel of ten dele onleesbaar is, dient, behoudens de in [artikel 33][ref1]
      genoemde bescheiden, bij de aanvraag tevens dat versleten of geheel of ten dele onleesbare rijbewijs te worden
      overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel33
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '33'
        hoofdstuk: II
        paragraaf: '2'
  - number: '38.2'
    text: |-
      Voor de toepassing van het eerste lid wordt onder een eerder aan de aanvrager afgegeven rijbewijs mede verstaan een
      rijbewijs dat eerder aan de aanvrager is afgegeven door het daartoe bevoegde gezag in een andere lid-staat van de
      Europese Gemeenschap of in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte of Zwitserland.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel38
  - number: '39.1'
    text: |-
      Indien de aanvraag betrekking heeft op de afgifte van een vervangend rijbewijs ter vervanging van een eerder aan de
      aanvrager afgegeven rijbewijs dat nog geldig is hetzij zijn geldigheid door het verstrijken van de geldigheidsduur
      heeft verloren, welk rijbewijs verloren geraakt of teniet gegaan is, wordt, behoudens de in [artikel 33][ref1]
      genoemde bescheiden, bij de aanvraag tevens een proces-verbaal ter zake van vermissing of diefstal van het
      rijbewijs overgelegd, dat in Nederland op ambtseed is opgemaakt door een daartoe bevoegd algemeen of buitengewoon
      opsporingsambtenaar; in het proces-verbaal worden de omstandigheden omschreven waaronder het rijbewijs verloren is
      geraakt of teniet is gegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel33
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '33'
        hoofdstuk: II
        paragraaf: '2'
  - number: '39.2'
    text: |-
      Indien de in het eerste lid bedoelde aanvrager woonachtig is buiten Nederland dan wordt bij de aanvraag een door de
      aanvrager ondertekende verklaring van een door de Dienst Wegverkeer vastgesteld model overgelegd. In de verklaring
      worden tevens de omstandigheden omschreven waaronder het rijbewijs verloren is geraakt of teniet is gegaan.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel39
  - number: '39.3'
    text: |-
      Indien de aanvraag betrekking heeft op de afgifte van een nieuw rijbewijs ter vervanging van een eerder aan de
      aanvrager afgegeven rijbewijs dat nog geldig is hetzij zijn geldigheid door het verstrijken van de geldigheidsduur
      heeft verloren, welk rijbewijs verloren geraakt of teniet gegaan is, dienen de in de voorgaande leden genoemde
      bescheiden te worden overgelegd en is [artikel 35, eerste lid, onderdeel b en c, en derde en vierde lid][ref1],
      van toepassing op de aanvragen die betrekking hebben op een rijbewijs voor andere categorieën dan AM en
      [artikel 35, eerste lid, onderdeel c][ref2], indien het een aanvraag voor een rijbewijs voor de categorie AM
      betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel35
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '35'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008074
        artikel: '35'
        hoofdstuk: II
        paragraaf: '2'
  - number: '40.1'
    text: |-
      Indien de aanvraag betrekking heeft op de afgifte van een rijbewijs in verband met een wijziging van de
      geslachtsnaam, de voornamen, de plaats of datum van geboorte dan wel het geslacht van de aanvrager, dient bij de
      aanvraag aan de volgende vereisten te worden voldaan:
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel40
  - number: 40.1.a
    text: |-
      behoudens de in [artikel 33][ref1] genoemde bescheiden wordt tevens het eerder afgegeven rijbewijs overgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel33
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '33'
        hoofdstuk: II
        paragraaf: '2'
  - number: 40.1.b
    text: |-
      in het rijbewijzenregister is ten behoeve van de aanvrager een verklaring van geschiktheid geregistreerd, waarbij
      de datum van registratie niet langer dan een jaar vóór de aanvraag mag liggen, indien
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel40
  - number: 40.1.b.I
    text: |-
      de aanvraag mede betrekking heeft op een der rijbewijscategorieën C, C1, D, D1, E bij C, E bij C1, E bij D of E
      bij D1,
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel40
  - number: 40.1.b.II
    text: de aanvrager de leeftijd van 70 jaren heeft bereikt,
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel40
  - number: 40.1.b.III
    text: |-
      de aanvrager de leeftijd van 65 jaren heeft bereikt en in het bezit is van een rijbewijs waarvan de geldigheidsduur
      verstrijkt op of na de dag waarop hij de leeftijd van 70 jaren bereikt, dan wel
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel40
  - number: 40.1.b.IV
    text: |-
      blijkens een aantekening in het rijbewijzenregister naar het oordeel van het CBR de registratie van een dergelijke
      verklaring noodzakelijk is op grond van de bij het CBR bekend zijnde gegevens met betrekking tot de lichamelijke en
      geestelijke geschiktheid van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel40
  - number: '40.2'
    text: |-
      Het eerste lid, onderdeel b, is niet van toepassing op aanvragen die betrekking hebben op afgifte van een rijbewijs
      voor de categorie AM.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel40
  - number: '40.3'
    text: |-
      Voor de toepassing van het eerste lid wordt onder het eerder aan de aanvrager afgegeven rijbewijs mede verstaan
      het eerder door het daartoe bevoegde gezag in een andere lid-staat van de Europese Gemeenschap of in een andere
      staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland aan de aanvrager
      afgegeven rijbewijs.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel40
  - number: '41.1'
    text: |-
      Indien de aanvraag betrekking heeft op de afgifte van een rijbewijs dat geldig is voor een categorie of categorieën
      waarop de ongeldigverklaring van een eerder aan de aanvrager afgegeven rijbewijs geen betrekking heeft, dient,
      behoudens de in [artikel 33][ref1] genoemde bescheiden, bij de aanvraag tevens het eerder aan de aanvrager
      afgegeven rijbewijs te worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel33
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '33'
        hoofdstuk: II
        paragraaf: '2'
  - number: '41.2'
    text: |-
      Voor de toepassing van het eerste lid wordt onder een eerder aan de aanvrager afgegeven rijbewijs,
      onderscheidenlijk het eerder aan de aanvrager afgegeven rijbewijs, mede verstaan een rijbewijs dat eerder aan
      de aanvrager is afgegeven door het daartoe bevoegde gezag in een andere lid-staat van de Europese Gemeenschap of
      in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland,
      onderscheidenlijk het eerder door dat gezag aan de aanvrager afgegeven rijbewijs.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel41
  - number: '42.1'
    text: Indien de aanvraag betrekking heeft op de afgifte van
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel42
  - number: 42.1.a
    text: |-
      een rijbewijs dat geldig is voor een categorie of categorieën waarvoor een eerder aan de aanvrager afgegeven
      rijbewijs bij gebreke van de in [artikel 132, eerste lid, van de wet][ref1] bedoelde medewerking aan een
      educatieve maatregel gericht op de geschiktheid of aan een onderzoek naar de geschiktheid als bedoeld in
      [artikel 131, eerste lid, van de wet][ref2], of in verband met een gevorderd of een op verzoek van de aanvrager
      uitgevoerd onderzoek naar diens geschiktheid tot het besturen van motorrijtuigen ongeldig is verklaard,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '132'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '131'
  - number: 42.1.b
    text: |-
      een rijbewijs waarvan de geldigheidsduur betrekking heeft of mede betrekking heeft op een periode waarvoor een
      eerder aan de aanvrager afgegeven rijbewijs in verband met een gevorderd of een op verzoek van de aanvrager
      uitgevoerd onderzoek naar diens geschiktheid tot het besturen van motorrijtuigen ongeldig is verklaard dan wel
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel42
  - number: 42.1.c
    text: een rijbewijs met een kortere geldigheidsduur dan het eerder aan de aanvrager afgegeven rijbewijs,
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel42
  - number: '42.2'
    text: Indien de aanvraag betrekking heef op de afgifte van
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel42
  - number: 42.2.a
    text: |-
      een rijbewijs dat geldig is voor een categorie of categorieën waarvoor een eerder aan de aanvrager afgegeven
      rijbewijs bij gebreke van de in [artikel 132, eerste lid, van de wet][ref1] bedoelde medewerking aan een
