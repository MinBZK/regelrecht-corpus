    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel42
  - number: '42.8'
    text: |-
      Voor de toepassing van het eerste tot en met het vijfde lid wordt onder een eerder, respectievelijk het eerder,
      aan de aanvrager afgegeven rijbewijs mede verstaan een rijbewijs, respectievelijk het rijbewijs, dat eerder aan de
      aanvrager is afgegeven door
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel42
  - number: 42.8.a
    text: |-
      het daartoe bevoegde gezag in Aruba, Curaçao, Sint Maarten of in de openbare lichamen Bonaire, Sint Eustatius en
      Saba,
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel42
  - number: 42.8.b
    text: |-
      het daartoe bevoegde gezag n een andere lidstaat van de Europese Gemeenschap of in een andere staat die partij is
      bij de overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, of
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel42
  - number: 42.8.c
    text: |-
      het daartoe bevoegde gezag buiten Nederland, anders dan in Aruba, Curaçao, Sint Maarten, de openbare lichamen
      Bonaire, Sint Eustatius en Saba, een andere lidstaat van de Europese Gemeenschap of in een andere staat die partij
      is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, indien dat rijbewijs ingevolge
      [artikel 46, vierde lid][ref1], bij ministeriële regeling is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel46
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel42
