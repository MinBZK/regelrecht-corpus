        hoofdstuk: II
        paragraaf: '2'
  - number: '183.2'
    text: |-
      Voor de toepassing van [artikel 35, onderdeel b, onder III][ref1], wordt onder een rijbewijs waarvan de
      geldigheidsduur verstrijkt op of na de dag waarop hij de leeftijd van 70 jaren bereikt, mede verstaan een op basis
      van de Wegenverkeerswet afgegeven rijbewijs waarvan de geldigheidsduur verstrijkt op of na de dag waarop hij de
      leeftijd van 70 jaren bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel35
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel183
