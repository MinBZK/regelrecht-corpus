  - number: '65.1'
    text: |-
      Indien de aanvrager bij het theorie-examen naar het oordeel van het CBR heeft voldaan aan de eisen, registreert het
      CBR ten behoeve van de aanvrager dat hij is geslaagd voor het theorie-examen en draagt het CBR er zorg voor dat het
      resultaat van het examen aan de aanvrager bekend wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel65
  - number: '65.2'
    text: |-
      Ten behoeve van [artikel 7, eerste lid, onderdeel a, en tweede lid, onderdeel e, onder I][ref1], geeft het CBR aan
      de betrokken kandidaat een theoriecertificaat voor de rijbewijscategorie AM respectievelijk A af.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel7
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '7'
        hoofdstuk: I
        paragraaf: '4'
  - number: '66'
    text: Het model van het theorie-certificaat wordt bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel66
  - number: '67.1'
    text: 'Voor toelating tot het praktijkexamen moet zijn voldaan aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel67
  - number: 67.1.a
    text: |-
      indien de aanvraag de rijbewijscategorie AM, A, B, of E bij B betreft, dient de aanvrager niet langer dan een jaar
      voor de dag van het praktijkexamen te zijn geslaagd voor het theorie-examen voor de rijbewijscategorie waarop de
      aanvraag betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel67
  - number: 67.1.b
    text: |-
      indien de aanvraag de rijbewijscategorie C, C1, D, D1, E bij C, E bij C1, E bij D of E bij D1 betreft, dient de
      aanvrager niet langer dan twee jaren voor de dag van het praktijkexamen te zijn geslaagd voor het theorie-examen
      voor de rijbewijscategorie waarop de aanvraag betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel67
  - number: 67.1.c
    text: |-
      de aanvrager dient bij de aanvraag een op zijn naam gesteld identiteitsbewijs als bedoeld in
      [artikel 1, eerste lid, onder 1°, 2° of 3°, van de Wet op de identificatieplicht][ref1] te overleggen, dan wel
      een eerder aan de aanvrager afgegeven rijbewijs dat hetzij nog geldig is hetzij zijn geldigheid heeft verloren door
      het verstrijken van de geldigheidsduur.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '67.2'
    text: |-
      Indien de aanvraag betrekking heeft op het praktijkexamen verkeersdeelneming voor de rijbewijscategorie A
      dient de aanvrager tevens niet langer dan een jaar voor het examen te zijn geslaagd voor het praktijkexamen
      voertuigbeheersing voor die rijbewijscategorie.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel67
  - number: '67.3'
    text: |-
      Indien de aanvraag betrekking heeft op de rijbewijscategorie C of D dient tevens een rijbewijs B, al dan niet
      voorzien van een bij ministeriële regeling vastgestelde codering waaruit blijkt dat de houder van dat rijbewijs
      het praktijkexamen heeft afgelegd in een motorrijtuig zonder koppelingspedaal, te worden overgelegd dat hetzij nog
      geldig is hetzij zijn geldigheid heeft verloren door het verstrijken van de geldigheidsduur.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel67
  - number: '67.4'
    text: |-
      Indien de aanvraag betrekking heeft op een der rijbewijscategorieën E bij B, E bij C of E bij D dient tevens een
      rijbewijs voor het trekkende motorrijtuig, al dan niet voorzien van een bij ministeriële regeling vastgestelde
      codering waaruit blijkt dat de houder van dat rijbewijs het praktijkexamen heeft afgelegd in een motorrijtuig
      zonder koppelingspedaal, te worden overgelegd dat hetzij nog geldig is hetzij zijn geldigheid heeft verloren door
      het verstrijken door de geldigheidsduur.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel67
  - number: '67.5'
    text: |-
      Voor de toepassing van het eerste lid wordt, voorzover het de toelating tot het praktijkexamen voertuigbeheersing
      voor de rijbewijscategorie A betreft, met een theoriecertificaat voor de rijbewijscategorie A gelijkgesteld:
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel67
  - number: 67.5.a
    text: |-
      een door het daartoe bevoegde militaire gezag niet langer dan een jaar tevoren afgegeven theoriecertificaat voor de
      rijbewijscategorie A;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel67
  - number: 67.5.b
    text: een rijbewijs A dat slechts geldig is voor het besturen van motorrijtuigen zonder handbediende koppelingshendel;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel67
  - number: 67.5.c
    text: |-
      een rijbewijs A dat slechts geldig is voor het besturen van motorrijtuigen op twee wielen, waarvan het vermogen
      niet meer dan 25 kW en tevens niet meer dan 0,16 kW per kg ledige massa bedraagt;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel67
  - number: 67.5.d
    text: een geldig rijbewijs B.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel67
  - number: '67.6'
    text: 'Voor de toepassing van het derde lid wordt met een rijbewijs B gelijkgesteld:'
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel67
  - number: 67.6.a
    text: |-
      een door het daartoe bevoegde gezag in een andere lidstaat van de Europese Gemeenschap of in een andere staat die
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland aan de aanvrager afgegeven
      geldig rijbewijs B;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel67
  - number: 67.6.b
    text: |-
      een in het rijbewijzenregister geregistreerde verklaring van rijvaardigheid voor de rijbewijscategorie B, waarbij
      de datum van registratie niet langer dan drie jaar vóór het examen mag liggen, voor zover de aanvraag betrekking
      heeft op de rijbewijscategorie C en de aanvrager een op het beroep van chauffeur goederenvervoer gerichte
      beroepsopleiding als bedoeld in de Wet educatie en beroepsonderwijs volgt.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel67
  - number: '67.7'
    text: 'Voor de toepassing van het vierde lid wordt met een rijbewijs voor het trekkende motorrijtuig gelijkgesteld:'
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel67
  - number: 67.7.a
    text: |-
      een door het daartoe bevoegde gezag in een andere lidstaat van de Europese Gemeenschap of in een andere staat die
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland aan de aanvrager afgegeven
      geldig rijbewijs voor het trekkende motorrijtuig;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel67
  - number: 67.7.b
    text: |-
      een in het rijbewijzenregister geregistreerde verklaring van rijvaardigheid voor de rijbewijscategorie C, waarbij
      de datum van registratie niet langer dan drie jaar vóór het examen mag liggen, voor zover de aanvraag betrekking
      heeft op de rijbewijscategorie E bij C en de aanvrager een op het beroep van chauffeur goederenvervoer gerichte
      beroepsopleiding als bedoeld in de [Wet educatie en beroepsonderwijs][ref1] volgt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: '67.8'
    text: |-
      Voor de toepassing van het zesde lid, onderdeel d, wordt met een geldig rijbewijs B gelijkgesteld een geldig
      rijbewijs B, afgegeven door het daartoe bevoegde gezag in een andere lidstaat van de Europese Gemeenschap of in een
      andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel67
  - number: '68'
    text: |-
      Voor de toepassing van [artikel 67, eerste lid, onderdeel a][ref1], wordt met het niet langer dan een jaar voor de
      dag van het examen geslaagd zijn voor het theorie-examen voor de rijbewijscategorie waarop de aanvraag betrekking
      heeft gelijkgesteld een door het daartoe bevoegde militaire gezag niet langer dan een jaar voor de dag van het
      examen afgegeven theorie-certificaat voor de rijbewijscategorie waarop de aanvraag betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel67
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '67'
        hoofdstuk: III
        paragraaf: '4'
  - number: '69.1'
    text: |-
      [Artikel 67, eerste lid, aanhef en onderdeel a][ref1], geldt niet indien de aanvraag betrekking heeft op:


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel67
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '67'
        hoofdstuk: III
        paragraaf: '4'
  - number: 69.1.a
    text: |-
      de afgifte van een rijbewijs A dat geldig is voor het besturen van motorrijtuigen zonder handbediende hendel en de
      aanvrager aantoont dat hij reeds in het bezit is van een rijbewijs A dat slechts geldig is voor het besturen van
      motorrijtuigen zonder handbediende koppelingshendel;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel69
  - number: 69.1.b
    text: |-
      de afgifte van een rijbewijs A dat geldig is voor het besturen van motorrijtuigen van die rijbewijscategorie,
      waarvan het vermogen ten minste 35 kW bedraagt, en de aanvrager aantoont dat hij reeds in het bezit is van een
      rijbewijs A dat slechts geldig is voor het besturen van motorrijtuigen van die rijbewijscategorie, waarvan het
      vermogen niet meer dan 25 kW en tevens niet meer dan 0,16 kW per kg ledige massa bedraagt;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel69
  - number: 69.1.c
    text: |-
      de afgifte van een rijbewijs B dat geldig is voor het besturen van motorrijtuigen zonder koppelingspedaal en de
      aanvrager aantoont dat hij reeds in het bezit is van een rijbewijs B dat slechts geldig is voor het besturen van
      motorrijtuigen zonder koppelingspedaal.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel69
  - number: '69.2'
    text: 'Voor de toepassing van het eerste lid, onderdeel c, wordt met een rijbewijs gelijkgesteld:'
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel69
  - number: 69.2.a
    text: een rijbewijs dat zijn geldigheid heeft verloren door het verstrijken van de geldigheidsduur;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel69
  - number: 69.2.b
    text: |-
      een in het rijbewijzenregister geregistreerde verklaring van rijvaardigheid, waarbij de datum van registratie niet
      langer dan zes maanden vóór de aanvraag mag liggen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel69
  - number: 69a.1
    text: |-
      De eisen waaraan bij het praktijkexamen voor de rijbewijscategorie AM, bromfietsen op twee wielen, dient te worden
      voldaan, betreffen:
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel69a
  - number: 69a.1.a
    text: bedrevenheid in de bediening en de beheersing van het voertuig;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel69a
  - number: 69a.1.b
    text: het op juiste en veilige wijze deelnemen aan het verkeer;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel69a
  - number: 69a.1.c
    text: het kunnen toepassen van de bij of krachtens de wet vastgestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel69a
  - number: 69a.2
    text: |-
      De eisen waaraan bij het praktijkexamen voor de rijbewijscategorie AM, bromfietsen op drie of vier wielen, dient te
      worden voldaan, betreffen de bedrevenheid in de bediening en de beheersing van het voertuig.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel69a
  - number: 69b.1
    text: |-
      Het praktijkexamen voor de rijbewijscategorie AM, bromfietsen op twee wielen, bestaat uit het afleggen van een
      rijproef met een bromfiets op twee wielen die blijkens de gegevens in het kentekenregister of voor het voertuig
      afgegeven kentekenbewijs is geconstrueerd voor een maximumsnelheid die meer bedraagt dan 25 km/h.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel69b
  - number: 69b.2
    text: |-
      Het praktijkexamen voor de rijbewijscategorie AM, bromfietsen op drie of vier wielen, bestaat uit het afleggen van
      een rijproef met een bromfiets op drie of vier wielen die blijkens de gegevens in het kentekenregister of voor het
      voertuig afgegeven kentekenbewijs is geconstrueerd voor een maximumsnelheid die meer bedraagt dan 25 km/h.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel69b
  - number: '70.1'
    text: |-
      De eisen waaraan bij het praktijkexamen voertuigbeheersing voor de rijbewijscategorie A dient te worden voldaan
      betreffen het op juiste en veilige wijze uitvoeren van een aantal bijzondere verrichtingen met het voertuig.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel70
  - number: '70.2'
    text: |-
      De eisen waaraan bij het praktijk-examen verkeersdeelneming voor de rijbewijscategorie A dient te worden voldaan
      betreffen:
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel70
  - number: 70.2.a
    text: bedrevenheid in de bediening van het voertuig;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel70
  - number: 70.2.b
    text: het op juiste en veilige wijze deelnemen aan het verkeer;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel70
  - number: 70.2.c
    text: |-
      het kunnen toepassen van de bij en krachtens [de wet][ref1] vastgestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: '70.3'
    text: |-
      De eisen waaraan bij het praktijkexamen voor de rijbewijscategorieën B, C, D en E dient te worden voldaan,
      betreffen:
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel70
  - number: 70.3.a
    text: bedrevenheid in de bediening van het voertuig;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel70
  - number: 70.3.b
    text: het op juiste en veilige wijze deelnemen aan het verkeer;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel70
  - number: 70.3.c
    text: |-
      het kunnen toepassen van de bij en krachtens [de wet][ref1] vastgestelde voorschriften;


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: 70.3.d
    text: het op juiste en veilige wijze uitvoeren van een aantal bijzondere verrichtingen met het voertuig.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel70
  - number: '70.4'
    text: |-
      Het derde lid, onderdeel d, is niet van toepassing indien de aanvrager bij een vóór het betrokken praktijkexamen
      door hem afgelegde tussentijdse toets ten genoegen van het CBR heeft aangetoond aan de daar gestelde eis te
      voldoen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel70
  - number: '71.1'
    text: |-
      Het praktijkexamen voertuigbeheersing voor het rijbewijs A, af te leggen door een aanvrager die de leeftijd van
      21 jaren nog niet heeft bereikt, bestaat uit het afleggen van een rijproef met een motorrijtuig op twee wielen,
      waarvan de cylinderinhoud meer dan 120 cm3 en het vermogen minder dan 35 kW bedraagt en dat een snelheid kan
      bereiken van ten minste 100 km per uur.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel71
  - number: '71.2'
    text: |-
      Het praktijkexamen verkeersdeelneming voor het rijbewijs A, af te leggen door een aanvrager die de leeftijd van
      21 jaren nog niet heeft bereikt, bestaat uit het afleggen van een rijproef met een motorrijtuig op twee wielen,
      waarvan de cylinderinhoud meer dan 120 cm3 en het vermogen minder dan 35 kW bedraagt en dat een snelheid kan
      bereiken van ten minste 100 km per uur.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel71
  - number: '71.3'
    text: |-
      Het praktijkexamen voertuigbeheersing voor het rijbewijs A, af te leggen door een aanvrager die de leeftijd van 21
      jaren heeft bereikt, bestaat uit het afleggen van een rijproef met een motorrijtuig op twee wielen, waarvan
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel71
  - number: 71.3.a
    text: |-
      de cylinderinhoud meer dan 120 cm3 en het vermogen minder dan 35 kW bedraagt en dat een snelheid kan bereiken van
      ten minste 100 km per uur, dan wel
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel71
  - number: 71.3.b
    text: het vermogen ten minste 35 kW bedraagt.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel71
  - number: '71.4'
    text: |-
      Een aanvrager als bedoeld in het derde lid legt het praktijkexamen verkeersdeelneming af met een motorrijtuig
      op twee wielen dat behoort tot dezelfde in het derde lid genoemde categorie als het motorrijtuig op twee wielen
      waarmee hij het praktijkexamen voertuigbeheersing heeft afgelegd.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel71
  - number: '71.5'
    text: |-
      Voor de bepaling van het aantal wielen worden twee op dezelfde as gemonteerde wielen als een wiel beschouwd, indien
      de afstand tussen de middens van de contactvlakken van deze wielen met de grond kleiner is dan 460 mm.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel71
  - number: '72'
    text: |-
      Het praktijkexamen voor het rijbewijs B bestaat uit het afleggen van een rijproef met een motorrijtuig op vier
      wielen, waarvan de toegestane maximum massa niet meer bedraagt dan 3500 kg, en dat niet is ingericht voor het
      vervoer van meer dan 8 personen, de bestuurder daaronder niet begrepen. Het motorrijtuig dient een snelheid te
      kunnen bereiken van ten minste 100 km per uur.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel72
  - number: '73'
    text: |-
      Het praktijkexamen voor het rijbewijs C bestaat uit het afleggen van een rijproef met een motorrijtuig, niet
      zijnde een motorrijtuig bestemd voor het voortbewegen van een oplegger, dat niet is ingericht voor het vervoer van
      personen en waarvan de lengte ten minste 8 m, de breedte ten minste 2,40 m, de wielbasis ten minste 4,50 m en de
      toegestane maximum massa ten minste 12 000 kg bedraagt. Het motorrijtuig dient te zijn voorzien van een gesloten
      opbouw dan wel van een gesloten huif, ten minste even breed en hoog als de cabine, en dient met ten minste 3000
      kg te zijn beladen. Het motorrijtuig dient te zijn uitgerust met een anti-blokkeersysteem, een versnellingsbak met
      ten minste acht voorwaartse versnellingen, een toerenteller en een controle-apparaat als bedoeld in [verordening
      (EEG) nr. 3821/85](31985R3821) van de Raad van de Europese Gemeenschappen van 20 december 1985 betreffende de
      invoering van een controle-apparaat bij het wegvervoer (PbEG L 370). Het motorrijtuig dient te zijn voorzien van
      een slaapcabine. Het motorrijtuig dient een snelheid te kunnen bereiken van ten minste 80 km per uur.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel73
  - number: '74'
    text: |-
      Het praktijkexamen voor het rijbewijs D bestaat uit het afleggen van een rijproef met een ongeleed motorrijtuig dat
      is ingericht voor het vervoer van meer dan 8 personen, de bestuurder daaronder niet begrepen, en waarvan de lengte
      ten minste 10 m, de breedte ten minste 2,40 m en de wielbasis ten minste 5,25 m bedraagt. Het motorrijtuig dient te
      zijn uitgerust met een anti-blokkeersysteem, een versnellingsbak met ten minste vijf voorwaartse versnellingen, een
      toerenteller en een controle-apparaat als bedoeld in [verordening (EEG) nr. 3821/85](31985R3821) van de Raad van de
      Europese Gemeenschappen van 20 december 1985 betreffende de invoering van een controle-apparaat bij het wegvervoer
      (PbEG L 370). Het motorrijtuig dient een snelheid te kunnen bereiken van ten minste 80 km per uur.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel74
  - number: '75'
    text: |-
      Het praktijk-examen voor het rijbewijs E bij B bestaat uit het afleggen van een rijproef met een motorrijtuig als
      bedoeld in artikel 72, waarvan de toegestane maximum massa meer dan 1750 kg bedraagt, en een aanhangwagen waarvan
      de lengte ten minste 6 m en de toegestane maximum massa meer dan 1750 kg bedraagt. De aanhangwagen dient te zijn
      uitgerust met twee assen waarvan er maximaal één gestuurd is, dan wel met een samenstel van twee starre assen in
      het midden van de aanhangwagen. De aanhangwagen dient te zijn voorzien van een gesloten opbouw dan wel van een
      gesloten huif waarvan de breedte en de hoogte ten minste die van het trekkende motorrijtuig bedragen en dient voor
      ten minste 50% van het laadvermogen te zijn beladen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel75
  - number: '76.1'
    text: Het praktijkexamen voor het rijbewijs E bij C bestaat uit het afleggen van een rijproef
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel76
  - number: 76.1.a
    text: |-
      met een samenstel van een motorrijtuig als bedoeld in [artikel 73][ref1] en een aanhangwagen waarvan de lengte
      ten minste 8 m en de breedte ten minste 2,40 m bedraagt. De lengte van het samenstel van trekkend motorrijtuig
      en aanhangwagen dient ten minste 16 m te bedragen. Het samenstel dient een snelheid van ten minste 80 km per uur
      te kunnen bereiken. De toegestane maximum massa van het trekkend motorrijtuig en van de aanhangwagen te samen
      dient ten minste 20 000 kg te bedragen. De aanhangwagen dient te zijn uitgerust met twee of meer assen waarvan er
      maximaal één gestuurd is, dan wel met een samenstel van twee of meer starre assen in het midden van de aanhangwagen
      waarbij


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel73
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '73'
        hoofdstuk: III
        paragraaf: '4'
  - number: 76.1.a.I
    text: de afstand van het hart van de koppeling tot het hart van het samenstel van assen ten minste 5 m bedraagt;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel76
  - number: 76.1.a.II
    text: |-
      de afstand van het hart van de koppeling tot de achterste as van het trekkend motorrijtuig niet meer dan 1,55 m
      bedraagt en
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel76
  - number: 76.1.a.III
    text: de hoogte van het hart van de koppeling zich op niet meer dan 0,70 m boven het wegdek bevindt.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel76
  - number: 76.1.b
    text: |-
      met een samenstel van een trekkend motorrijtuig waarvan de wielbasis ten minste 3,20 m en ten hoogste 4,25 m
      bedraagt, en een oplegger. De lengte van het samenstel van trekkend motorrijtuig en oplegger dient ten minste 14,50
      m te bedragen. Het samenstel dient een snelheid van ten minste 80 km per uur te kunnen bereiken. De toegestane
      maximum massa van het samenstel dient ten minste 20 000 kg te bedragen. Het trekkend motorrijtuig dient te zijn
      uitgerust met een anti-blokkeersysteem, een versnellingsbak met ten minste acht voorwaartse versnellingen, een
      toerenteller en een controle-apparaat als bedoeld in [verordening (EEG) nr. 3821/85](31985R3821) van de Raad van de
      Europese Gemeenschappen van 20 december 1985 betreffende de invoering van een controle-apparaat bij het wegvervoer
      (PbEG L 370). Het trekkend motorrijtuig dient te zijn voorzien van een slaapcabine. De oplegger dient te zijn
      voorzien van een gesloten opbouw dan wel van een gesloten huif, ten minste even breed en hoog als de cabine van
      het trekkend motorrijtuig, en dient met ten minste 6000 kg te zijn beladen. De oplegger dient te zijn uitgerust met
      starre assen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel76
  - number: '77'
    text: |-
      Het praktijkexamen voor het rijbewijs E bij D bestaat uit het afleggen van een rijproef met een motorrijtuig als
      bedoeld in [artikel 74][ref1] en een aanhangwagen waarvan de lengte ten minste 5 m, de breedte ten minste 2,40 m
      en de toegestane maximum massa ten minste 3000 kg bedraagt. De aanhangwagen moet zijn voorzien van een gesloten
      opbouw dan wel van een gesloten huif die ten minste 2 m breed en 2 m hoog is en dient met ten minste 800 kg te zijn
      beladen. Het samenstel dient een snelheid te kunnen bereiken van ten minste 80 km per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel74
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '74'
        hoofdstuk: III
        paragraaf: '4'
  - number: '78'
    text: |-
      Het motorrijtuig waarmee de rijproef wordt afgelegd, behoeft niet te zijn voorzien van een koppelingspedaal of,
      indien het een motorrijtuig voor de categorie A betreft, een handbediende koppelingshendel.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel78
  - number: 78a
    text: |-
      Het motorrijtuig waarmee de rijproef voor het rijbewijs AM wordt afgelegd, dient te zijn voorzien van een bij
      ministeriële regeling vastgestelde aanduiding, aangebracht op de wijze als bij die regeling is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel78a
  - number: '79'
    text: |-
      Het motorrijtuig waarmee de rijproef voor het rijbewijs A wordt afgelegd, dient te zijn voorzien van een bij
      ministeriële regeling vastgestelde aanduiding, aangebracht op de wijze als bij die regeling is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel79
  - number: '80'
    text: 'Het motorrijtuig waarmee de rijproef voor het rijbewijs B wordt afgelegd, dient te zijn voorzien van:'
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel80
  - number: 80.a
    text: |-
      inrichtingen die zo zijn aangebracht dat degene die rijonderricht geeft, daarmee de bedrijfsrem en, indien het
      motorrijtuig is voorzien van een koppelingspedaal, de koppeling vanaf zijn zitplaats doeltreffend kan bedienen;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel80
  - number: 80.b
    text: |-
      een binnen- en een buitenspiegel waarmee de examinator het achter en rechts naast hem gelegen weggedeelte kan
      overzien;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel80
  - number: 80.c
    text: |-
      een bij ministeriële regeling vastgestelde aanduiding, aangebracht op de wijze als bij die regeling is
      voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel80
  - number: '81'
    text: 'Het motorrijtuig waarmee de rijproef voor het rijbewijs C, D of E wordt afgelegd, dient te zijn voorzien van:'
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel81
  - number: 81.a
    text: |-
      inrichtingen die zo zijn aangebracht dat degene die rijonderricht geeft, daarmee de bedrijfsrem en, indien het
      motorrijtuig is voorzien van een koppelingspedaal, de koppeling vanaf zijn zitplaats doeltreffend kan bedienen;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel81
  - number: 81.b
    text: |-
      twee of meer buitenspiegels waarmee de examinator het rechts en links naast en achter hem gelegen weggedeelte kan
      overzien;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel81
  - number: 81.c
    text: |-
      een bij ministeriële regeling vastgestelde aanduiding, aangebracht op de wijze als bij die regeling is
      voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel81
  - number: '82.1'
    text: |-
      Het motorrijtuig, het samenstel van trekkend motorrijtuig en aanhangwagen, dan wel het samenstel van trekkend
      motorrijtuig en oplegger, waarmee de rijproef wordt afgelegd, dient naar het oordeel van het CBR daartoe geschikt
      te zijn
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel82
  - number: '82.2'
    text: |-
      Aan het praktijkexamen voertuigbeheersing voor de rijbewijscategorie A en aan het praktijkexamen verkeersdeelneming
      voor de rijbewijscategorie A mag slechts worden deelgenomen door kandidaten met een naar het oordeel van het CBR
      daartoe geschikte beschermende uitrusting, bestaande uit handschoenen, schoeisel, beschermende kleding en een helm.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel82
  - number: '83'
    text: |-
      De duur van het praktijkexamen voor de rijbewijscategorie AM, voor zover het betreft de bromfietsen op twee wielen,
      bedraagt tenminste 25 minuten. De duur van het praktijkexamen verkeersdeelneming voor de rijbewijscategorie A en
      van het praktijkexamen voor de rijbewijscategoriëen B en E bij B bedraagt tenminste 35 minuten. De duur van het
      praktijkexamen voor de rijbewijscategorieën C, D, E bij C en E bij D bedraagt ten minste 60 minuten.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel83
  - number: '84'
    text: |-
      De rijproef kan binnen de voorgeschreven tijd worden gestaakt, indien naar het oordeel van de examinator
      de aanvrager door zijn wijze van rijden de veiligheid op de weg in gevaar brengt. Bij het praktijkexamen
      voertuigbeheersing voor de rijbewijscategorie A kan de rijproef eveneens binnen de voorgeschreven tijd worden
      gestaakt, indien naar het oordeel van de examinator de aanvrager de bijzondere verrichtingen niet op juiste of
      veilige wijze uitvoert.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel84
  - number: '85'
    text: |-
      Indien de aanvrager naar het oordeel van de examinator bij het onderzoek naar de rijvaardigheid heeft voldaan aan
      de bij ministeriële regeling vastgestelde eisen, registreert het CBR in het rijbewijzenregister ten behoeve van de
      aanvrager een verklaring van rijvaardigheid voor de rijbewijscategorie waarvoor de aanvrager aan die eisen heeft
      voldaan.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel85
  - number: '86.1'
    text: |-
      De aanvrager van een verklaring van rijvaardigheid, die binnen een tijdsbestek van vijf jaren tot vier maal toe ter
      zake van dezelfde rijbewijscategorie een mededeling heeft ontvangen dat hij niet aan de bij ministeriële regeling
      ten aanzien van die rijbewijscategorie vastgestelde eisen heeft voldaan, dient zich, indien hij een nieuwe aanvraag
      ter verkrijging van een verklaring van rijvaardigheid voor die rijbewijscategorie indient, te onderwerpen aan een
      nader onderzoek naar zijn rijvaardigheid.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel86
  - number: '86.2'
    text: |-
      Voor zover de aanvraag betrekking heeft op de rijbewijscategorie A, geldt het eerste lid slechts indien de daar
      bedoelde mededeling betrekking heeft op het niet voldoen aan de bij ministeriële regeling ten aanzien van het
      praktijkexamen verkeersdeelneming voor die rijbewijscategorie vastgestelde eisen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel86
  - number: '87'
    text: |-
      Het nader onderzoek bestaat uit het afleggen van een rijproef ten overstaan van een door het CBR aangewezen
      rijvaardigheidsadviseur. De artikelen 54 en 55, 67 tot en met 82 en 84 zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel87
  - number: '88'
    text: |-
      De duur van het nader onderzoek bedraagt voor de rijbewijscategorieën AM, A, B en E bij B ten minste 50 minuten en
      voor de rijbewijscategorieën C, D, E bij C en E bij D ten minste 80 minuten.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel88
  - number: '89'
    text: |-
      Indien de aanvrager naar het oordeel van de rijvaardigheidsadviseur bij het nader onderzoek voldoet aan de bij
      ministeriële regeling vastgestelde eisen, registreert het CBR in het rijbewijzenregister ten behoeve van de
      aanvrager een verklaring van rijvaardigheid voor de rijbewijscategorie waarvoor de aanvrager aan die eisen heeft
      voldaan.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel89
  - number: '90'
    text: |-
      Indien de aanvrager naar het oordeel van de rijvaardigheidsadviseur bij het nader onderzoek niet voldoet aan de bij
      ministeriële regeling vastgestelde eisen, adviseert de rijvaardigheidsadviseur de aanvrager omtrent de wijze waarop
      deze ten aanzien van die onderdelen waarop hij niet aan die eisen voldoet, zijn rijvaardigheid kan verbeteren.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel90
  - number: '91'
    text: |-
      De aanvrager die bij het nader onderzoek niet heeft voldaan aan de bij ministeriële regeling vastgestelde eisen
      ten aanzien van de rijvaardigheid voor het besturen van motorrijtuigen van de rijbewijscategorie waarop de aanvraag
      betrekking heeft, dient zich, indien hij een nieuwe aanvraag ter verkrijging van een verklaring van rijvaardigheid
      voor die rijbewijscategorie indient, opnieuw te onderwerpen aan een nader onderzoek naar zijn rijvaardigheid.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel91
  - number: '92.1'
    text: |-
      Indien de aanvrager van een verklaring van rijvaardigheid ook bij het tweede nader onderzoek voor dezelfde
      rijbewijscategorie niet blijkt te voldoen aan de bij ministeriële regeling ten aanzien van die rijbewijscategorie
      vastgestelde eisen, is het CBR bevoegd te vorderen dat de aanvrager, indien hij na het tweede nader onderzoek voor
      dezelfde rijbewijscategorie een nieuwe aanvraag ter verkrijging van een verklaring van rijvaardigheid voor die
      rijbewijscategorie indient, op eigen kosten een onderzoek naar zijn geschiktheid ondergaat. Het onderzoek wordt
      verricht door een of meer door het CBR aangewezen deskundigen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel92
  - number: '92.2'
    text: |-
      Het eerste lid en de [artikelen 93 tot en met 96][ref1] zijn niet van toepassing op aanvragers van een verklaring
      van rijvaardigheid voor de rijbewijscategorie AM.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel93
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '93'
        hoofdstuk: III
        paragraaf: '6'
  - number: '93'
    text: |-
      Door de aangewezen deskundige of deskundigen wordt aan het CBR schriftelijk medegedeeld of de aanvrager naar zijn
      of naar hun oordeel voldoet aan de bij ministeriële regeling vastgestelde eisen met betrekking tot de lichamelijke
      en geestelijke geschiktheid tot het besturen van motorrijtuigen van de rijbewijscategorie of rijbewijscategorieën
      waarop de aanvraag betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel93
  - number: '94'
    text: |-
      Het CBR onderzoekt mede op basis van de bevindingen van de aangewezen deskundige of deskundigen of de aanvrager al
      dan niet voldoet aan de bij ministeriële regeling vastgestelde eisen ten aanzien van de lichamelijke en geestelijke
      geschiktheid tot het besturen van motorrijtuigen van de rijbewijscategorie of rijbewijscategorieën waarop de
      aanvraag betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel94
  - number: '95'
    text: |-
      Indien de aanvrager naar het oordeel van het CBR voldoet aan de bij ministeriële regeling vastgestelde
      eisen ten aanzien van de lichamelijke en geestelijke geschiktheid tot het besturen van motorrijtuigen van de
      rijbewijscategorie of rijbewijscategorieën waarop de aanvraag betrekking heeft, dient hij zich in het kader van
      een nieuwe aanvraag ter verkrijging van een verklaring van rijvaardigheid voor de betrokken rijbewijscategorie te
      onderwerpen aan een nader onderzoek naar zijn rijvaardigheid als bedoeld in artikel 87. De artikelen 54 en 55, 67
      tot en met 82 en 84 zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel95
  - number: '96'
    text: |-
      Indien de aanvrager op basis van het in artikel 94 bedoelde onderzoek een mededeling ontvangt dat hij naar
      het oordeel van het CBR niet voldoet aan de bij ministeriële regeling vastgestelde eisen ten aanzien van de
      lichamelijke en geestelijke geschiktheid tot het besturen van motorrijtuigen van de rijbewijscategorie of
      rijbewijscategorieën waarop de aanvraag betrekking heeft, dient hij bij het indienen van een nieuwe aanvraag ter
      verkrijging van een verklaring van rijvaardigheid voor de betrokken rijbewijscategorie behoudens de in artikel 67
      genoemde bescheiden tevens een verklaring van geschiktheid voor die rijbewijscategorie over te leggen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel96
  - number: '97.1'
    text: |-
      Verklaringen van geschiktheid worden op aanvraag en tegen betaling van het daarvoor vastgestelde tarief door
      het CBR in het rijbewijzenregister geregistreerd ten behoeve van een ieder die voldoet aan de bij ministeriële
      regeling vastgestelde eisen met betrekking tot de lichamelijke en geestelijke geschiktheid tot het besturen van
      motorrijtuigen. Het CBR doet van deze registratie mededeling aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel97
  - number: '97.2'
    text: |-
      In afwijking van het eerste lid wordt ten behoeve van degene wiens rijbewijs op grond van
      [artikel 132, tweede lid, van de wet][ref1] ongeldig is verklaard wegens het niet-verlenen van de vereiste
      medewerking aan de hem opgelegde verplichting zich te onderwerpen aan een educatieve maatregel ter bevordering van
      de geschiktheid, gedurende een periode van ten hoogste drie jaren na de ongeldigverklaring van het rijbewijs geen
      verklaring van geschiktheid in het rijbewijzenregister geregistreerd zo lang hij niet alsnog aan die verplichting
      heeft voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '132'
  - number: '97.3'
    text: |-
      Het tweede lid is van overeenkomstige toepassing in de gevallen waarin de kosten van het onderzoek voor rekening
      komen van de betrokken rijbewijshouder en het rijbewijs ongeldig is verklaard wegens het niet-verlenen van
      de vereiste medewerking aan de hem opgelegde verplichting zich te onderwerpen aan een onderzoek naar zijn
      geschiktheid.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel97
  - number: '97.4'
    text: |-
      In afwijking van het eerste en derde lid wordt ten behoeve van degene die niet heeft meegewerkt
      aan een keuring of een onderzoek door gebruik te maken van het blokkeringsrecht bedoeld in
      [artikel 7:464, tweede lid, aanhef en onder b, van het Burgerlijk Wetboek][ref1], gedurende een periode van één
      jaar na de datum van de keuring of het onderzoek geen verklaring van geschiktheid in het rijbewijzenregister
      geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel464
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '464'
  - number: '98'
    text: |-
      Het voor de aanvraag van verklaringen van geschiktheid verschuldigde tarief wordt vastgesteld door het CBR
      onder goedkeuring van Onze Minister. Het tarief dient door de aanvrager te worden voldaan door aankoop van een
      aanvraagformulier volgens door het CBR vastgesteld model door het verschuldigde bedrag over te maken op een door
      het CBR aangewezen bankrekening.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel98
  - number: '100.1'
    text: 'Bij de aanvraag dienen te worden overgelegd:'
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel100
  - number: 100.1.a
    text: |-
      een niet langer dan twee weken voor de aanvraag getekende, volledig ingevulde eigen verklaring volgens door het CBR
      vastgesteld model;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel100
  - number: 100.1.b.I
    text: |-
      indien aan de aanvrager in Nederland de status van diplomatiek of consulair ambtenaar is toegekend of de aanvrager
      behoort tot het gezin van een persoon aan wie in Nederland de status van diplomatiek of consulair ambtenaar is
      toegekend, een door Onze Minister van Buitenlandse Zaken afgegeven verklaring waaruit zulks blijkt;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel100
  - number: 100.1.b.II
    text: |-
      indien de aanvrager lid is van een in het kader van het op 19 juni 1951 te Londen gesloten Verdrag tussen de Staten
      die partij zijn bij het Noord-Atlantisch Verdrag, nopens de rechtspositie van hun krijgsmachten, in Nederland
      gelegerde krijgsmacht, lid is van de tot die krijgsmacht behorende civiele dienst of behoort tot het gezin van
      een lid van een krijgsmacht als hiervoor bedoeld of tot het gezin van een tot de civiele dienst van zodanige
      krijgsmacht behorende persoon, een door de betrokken basiscommandant ondertekende verklaring waaruit zulks blijkt;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel100
  - number: 100.1.b.III
    text: |-
      indien de aanvrager niet in Nederland woonachtig is, enig bewijsstuk betreffende de woonplaats en de datum en
      plaats van geboorte van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel100
  - number: '100.2'
    text: |-
      Indien een of meer van de op de eigen verklaring gestelde vragen betreffende de lichamelijke en geestelijke
      geschiktheid van de aanvrager bevestigend worden beantwoord, dient op de eigen verklaring een aantekening van een
      arts te zijn gesteld waaruit de aard en de ernst van de afwijking blijken.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel100
  - number: '100.3'
    text: 'Indien de aanvraag betrekking heeft op:'
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel100
  - number: 100.3.a
    text: de afgifte van een rijbewijs aan een aanvrager die de leeftijd van 70 jaren heeft bereikt,
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel100
  - number: 100.3.b
    text: |-
      de afgifte van een rijbewijs aan een aanvrager die de leeftijd van 65 jaren heeft bereikt en die in het bezit is
      van een rijbewijs waarvan de geldigheidsduur verstrijkt op of na de dag waarop de aanvrager de leeftijd van 70
      jaren bereikt, dan wel
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel100
  - number: 100.3.c
    text: |-
      de afgifte van een rijbewijs dat geldig is voor een of meer van de rijbewijscategorieën C, C1, D, D1, E bij C, E
      bij C1, E bij D of E bij D1,
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel100
  - number: '100.4'
    text: |-
      Het eerste lid, onderdeel *b*, geldt niet indien de aanvraag van een verklaring van geschiktheid gelijktijdig met
      de aanvraag van een verklaring van rijvaardigheid wordt ingediend.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel100
  - number: '100.5'
    text: |-
      Voor de toepassing van het derde lid wordt met een geneeskundig verslag als daar bedoeld gelijkgesteld een niet
      langer dan twee weken voor de aanvraag afgegeven, door een arts opgemaakt, rapport van een niet in het kader van de
      aanvraag van een rijbewijs verrichte keuring waarbij de aanvrager is gekeurd op eisen die ten minste gelijkwaardig
      zijn aan de bij ministeriële regeling vastgestelde eisen met betrekking tot de lichamelijke en geestelijke
      geschiktheid tot het besturen van motorrijtuigen van de rijbewijscategorie of rijbewijscategorieën waarop de
      aanvraag betrekking heeft, welk rapport ten minste dezelfde gegevens bevat als een geneeskundig verslag.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel100
  - number: '100.6'
    text: |-
      Kosten verbonden aan het laten plaatsen van een aantekening als bedoeld in het tweede lid of het laten opmaken van
      het geneeskundig verslag als bedoeld in het derde lid, alsmede voor alle aanvullingen daarop, komen voor rekening
      van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel100
  - number: '100.7'
    text: |-
      Bij de aanvraag van een verklaring van geschiktheid raadpleegt het CBR de in de gemeentelijke basisadministratie
      persoonsgegevens ingeschreven persoonsgegevens van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel100
  - number: '101.1'
    text: |-
      Het CBR is bevoegd te vorderen dat de aanvrager zich op eigen kosten laat keuren door een of meer door het CBR
      aangewezen artsen of andere deskundigen dan wel dat de aanvrager zich onderwerpt aan een technisch onderzoek,
      verricht door een door het CBR aangewezen deskundige, of aan een rijproef, afgenomen door een door het CBR
      aangewezen deskundige, indien:
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel101
  - number: 101.1.a
    text: |-
      de door de aanvrager overgelegde eigen verklaring dan wel, indien een geneeskundig verslag wordt vereist, het
      geneeskundig verslag daartoe aanleiding geeft;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel101
  - number: 101.1.b
    text: |-
      het CBR beschikt over gegevens met betrekking tot de lichamelijke en geestelijke geschiktheid van de aanvrager,
      die het vermoeden rechtvaardigen dat de aanvrager niet voldoet aan de bij ministeriële regeling vastgestelde
      eisen ten aanzien van de lichamelijke en geestelijke geschiktheid tot het besturen van motorrijtuigen van de
      rijbewijscategorie of rijbewijscategorieën waarop de aanvraag betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel101
  - number: 101.1.c
    text: |-
      tijdens het praktijk-examen het vermoeden is gerezen dat de aanvrager niet voldoet aan de bij ministeriële regeling
      vastgestelde eisen ten aanzien van de lichamelijke en geestelijke geschiktheid tot het besturen van motorrijtuigen
      van de rijbewijscategorie of rijbewijscategorieën waarvoor het praktijk-examen wordt afgelegd.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel101
  - number: '101.2'
    text: 'De in het eerste lid bedoelde keuring mag slechts betreffen:'
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel101
  - number: 101.2.a
    text: de punten waaromtrent in de eigen verklaring vragen zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel101
  - number: 101.2.b
    text: |-
      bovendien de punten waaromtrent in het geneeskundig verslag vragen zijn gesteld, indien de aanvraag betrekking
      heeft op:
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel101
  - number: 101.2.b.I
    text: de afgifte van een rijbewijs aan een aanvrager die de leeftijd van 70 jaren heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel101
  - number: 101.2.b.II
    text: |-
      de afgifte van een rijbewijs aan een aanvrager die de leeftijd van 65 jaren heeft bereikt en die in het bezit is
      van een rijbewijs waarvan de geldigheidsduur verstrijkt op of na de dag waarop de aanvrager de leeftijd van 70
      jaren bereikt;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel101
  - number: 101.2.b.III
    text: |-
      de afgifte van een rijbewijs dat geldig is voor een of meer van de rijbewijscategorieën C, C1, D, D1, E bij C, E
      bij C1, E bij D of E bij D1.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel101
  - number: '101.3'
    text: |-
      Het in het eerste lid, aanhef, bedoelde technisch onderzoek en de daar bedoelde rijproef mogen slechts betrekking
      hebben op de bij ministeriële regeling aangewezen punten van onderzoek.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel101
  - number: '101.4'
    text: |-
      De in het eerste lid bedoelde vordering wordt in de gevallen genoemd in het eerste lid, onderdelen a en b, zo
      spoedig mogelijk, doch uiterlijk binnen vier weken, na ontvangst van de eigen verklaring respectievelijk na het
      praktijkexamen in de gevallen genoemd in het eerste lid, onderdeel c, door het CBR gedaan.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel101
  - number: '102.1'
    text: |-
      Door de aangewezen arts of artsen wordt zo spoedig mogelijk, doch uiterlijk acht weken na de aanvang van
      de keuring, bedoeld in [artikel 101, eerste lid][ref1] aan het CBR schriftelijk medegedeeld voor welke
      rijbewijscategorie of rijbewijscategorieën de aanvrager naar zijn of naar hun oordeel voldoet aan de bij
      ministeriële regeling vastgestelde eisen met betrekking tot de lichamelijke en geestelijke geschiktheid en voor
      welke rijbewijscategorie of rijbewijscategorieën hij aan die eisen niet voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel101
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '101'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '102.2'
    text: |-
      Indien naar het oordeel van de aangewezen arts of artsen redelijke grond bestaat voor de verwachting
      dat de aanvrager slechts aan de bij ministeriële regeling vastgestelde eisen met betrekking tot de
      lichamelijke en geestelijke geschiktheid voldoet voor een daarbij te bepalen termijn die korter is dan de
      in [artikel 122, eerste lid, van de wet][ref1] voorziene geldigheidsduur, wordt zulks door hem of door hen
      schriftelijk medegedeeld aan het CBR onder vermelding van de termijn waarvoor de aanvrager naar zijn of naar hun
      oordeel aan die eisen voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel122
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '122'
  - number: '102.3'
    text: |-
      Het CBR kan in bijzondere gevallen toestaan dat door de arts of artsen van de in het eerste lid bedoelde termijn
      wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel102
  - number: '103.1'
    text: |-
      Indien de aanvrager naar het oordeel van het CBR voldoet aan de bij ministeriële regeling vastgestelde
      eisen ten aanzien van de lichamelijke en geestelijke geschiktheid tot het besturen van motorrijtuigen van
      de rijbewijscategorie of rijbewijscategorieën waarop de aanvraag betrekking heeft, registreert het in het
      rijbewijzenregister ten behoeve van de aanvrager voor die categorie of categorieën een verklaring van geschiktheid.
      Deze registratie vindt plaats zo spoedig mogelijk, doch uiterlijk binnen vier weken na ontvangst van:
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel103
  - number: 103.1.a
    text: de bevindingen van de arts of artsen of deskundige of deskundigen, of
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel103
  - number: 103.1.b
    text: |-
      de eigen verklaring, indien geen vordering als bedoeld in [artikel 101, eerste lid][ref1], is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel101
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '101'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '103.2'
    text: |-
      Indien naar het oordeel van het CBR redelijke grond bestaat voor de verwachting dat de aanvrager slechts aan de
      bij ministeriële regeling vastgestelde eisen met betrekking tot de lichamelijke en geestelijke geschiktheid voldoet
      voor een daarbij te bepalen termijn die korter is dan de in [artikel 122, eerste lid, van de wet][ref1] voorziene
      geldigheidsduur, registreert het CBR die termijn in het rijbewijzenregister binnen de in het eerste lid aangegeven
      termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel122
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '122'
  - number: '103.3'
    text: |-
      Indien de aanvrager naar het oordeel van het CBR aan de bij ministeriële regeling vastgestelde eisen ten aanzien
      van de lichamelijke en geestelijke geschiktheid tot het besturen van motorrijtuigen van de rijbewijscategorie
      of rijbewijscategorieën waarop de aanvraag betrekking heeft, slechts kan voldoen indien het door hem te besturen
      motorrijtuig aan bepaalde eisen voldoet dan wel indien de aanvrager bij het besturen gebruik maakt van kunst-
      of hulpmiddelen, is het, ten einde de aard van de mogelijke aanpassingen aan het motorrijtuig of van de door de
      aanvrager te gebruiken kunst- of hulpmiddelen vast te stellen, bevoegd technisch onderzoek te verrichten of te doen
      verrichten dan wel van de aanvrager te vorderen dat deze zich onderwerpt aan een rijproef.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel103
  - number: '103.4'
    text: |-
      Indien de aanvrager naar het oordeel van het CBR aan de bij ministeriële regeling vastgestelde eisen met betrekking
      tot de lichamelijke en geestelijke geschiktheid tot het besturen van motorrijtuigen van de rijbewijscategorie
      of rijbewijscategorieën waarop de aanvraag betrekking heeft, slechts voldoet indien het door hem te besturen
      motorrijtuig aan bepaalde eisen voldoet dan wel indien de aanvrager bij het besturen gebruik maakt van kunst-
      of hulpmiddelen, registreert het CBR binnen de in het eerste lid aangegeven termijn de noodzakelijk geachte
      aanpassingen aan het motorrijtuig dan wel de door de bestuurder te gebruiken kunst- of hulpmiddelen in het
      rijbewijzenregister door middel van een bij ministeriële regeling vastgestelde codering.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel103
  - number: '103.5'
    text: |-
      Indien de aanvrager naar het oordeel van het CBR aan de bij ministeriële regeling vastgestelde eisen met betrekking
      tot de lichamelijke en geestelijke geschiktheid tot het besturen van motorrijtuigen van de rijbewijscategorie of
      rijbewijscategorieën waarop de aanvraag betrekking heeft, slechts voldoet indien hij het motorrijtuig bestuurt
      binnen een geografisch beperkt gebied, registreert het CBR binnen de in het eerste lid aangegeven termijn dat
      gebied in het rijbewijzenregister door middel van een bij ministeriële regeling vastgestelde codering.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel103
  - number: '103.6'
    text: |-
      Indien de aanvrager naar het oordeel van het CBR aan de bij ministeriële regeling vastgestelde eisen met betrekking
      tot de lichamelijke en geestelijke geschiktheid tot het besturen van motorrijtuigen slechts voldoet indien hij
      het door hem te besturen motorrijtuig gebruikt voor privé doeleinden, registreert het CBR binnen de in het eerste
      lid aangegeven termijn die beperking in het rijbewijzenregister door middel van een bij ministeriële regeling
      vastgestelde codering.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel103
  - number: '103.7'
    text: Het CBR kan de in dit artikel genoemde termijnen verlengen als de ontvangen gegevens onvolledig zijn.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel103
  - number: '104.1'
    text: |-
      Indien de aanvrager van een verklaring van geschiktheid een mededeling heeft ontvangen dat geen verklaring
      van geschiktheid in het rijbewijzenregister wordt geregistreerd, dat een verklaring van geschiktheid wordt
      geregistreerd voor minder categorieën dan waarop de aanvraag betrekking heeft, of dat in het rijbewijzenregister
      een termijn als bedoeld in [artikel 103, tweede lid][ref1], dan wel een gecodeerde aanduiding als bedoeld in
      [artikel 103, vierde, vijfde of zesde lid][ref2], is geregistreerd, kan hij binnen vier weken na ontvangst daarvan
      het CBR verzoeken een of meer artsen aan te wijzen voor een keuring of herkeuring op zijn eigen kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel103
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '103'
        hoofdstuk: IV
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0008074
        artikel: '103'
        hoofdstuk: IV
        paragraaf: '3'
  - number: '104.2'
    text: |-
      Zo spoedig mogelijk, doch uiterlijk vier weken na ontvangst van het in het eerste lid bedoelde verzoek om keuring
      of herkeuring wijst het CBR een of meer artsen aan en geeft het van die aanwijzing kennis aan de aanvrager en aan
      de aangewezen arts of artsen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel104
  - number: '104.3'
    text: De aanvrager geeft de aangewezen arts of artsen inzage van de in het eerste lid bedoelde mededeling.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel104
  - number: '104.4'
    text: |-
      Door de aangewezen arts of artsen wordt zo spoedig mogelijk, doch uiterlijk acht weken na de aanvang van
      het onderzoek, dan wel van het eerste gedeelte daarvan, aan het CBR schriftelijk medegedeeld voor welke
      rijbewijscategorie of rijbewijscategorieën de aanvrager naar zijn of naar hun oordeel voldoet aan de bij
      ministeriële regeling vastgestelde eisen met betrekking tot de lichamelijke en geestelijke geschiktheid en voor
      welke categorie of categorieën hij aan die eisen niet voldoet. Indien naar het oordeel van de aangewezen arts
      of artsen redelijke grond bestaat voor de verwachting dat de aanvrager slechts aan de bij ministeriële regeling
      vastgestelde eisen met betrekking tot de lichamelijke en geestelijke geschiktheid voldoet voor een daarbij te
      bepalen termijn die korter is dan de in [artikel 122, eerste lid, van de wet][ref1] voorziene geldigheidsduur,
      wordt zulks door hem of door hen schriftelijk medegedeeld aan het CBR onder vermelding van de termijn waarvoor de
      aanvrager naar zijn of naar hun oordeel aan die eisen voldoet. [Artikel 103][ref2] is verder van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel122
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel103
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '122'
      - id: ref2
        bwb_id: BWBR0008074
        artikel: '103'
        hoofdstuk: IV
        paragraaf: '3'
  - number: '104.5'
    text: |-
      Het CBR kan in bijzondere gevallen toestaan dat door de arts of artsen van de in het vierde lid bedoelde termijn
      wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel104
  - number: '104.6'
    text: |-
      Een op grond van [artikel 103][ref1] genomen besluit van het CBR vervalt met ingang van het tijdstip waarop de
      aanvrager het CBR heeft verzocht om een keuring of een herkeuring als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel103
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '103'
        hoofdstuk: IV
        paragraaf: '3'
  - number: '105.1'
    text: De afgifte van rijbewijzen geschiedt niet elektronisch.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel105
  - number: '105.2'
    text: 'Rijbewijzen worden afgegeven door de Dienst Wegverkeer:'
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel105
  - number: 105.2.a
    text: indien de aanvrager buiten Nederland woonachtig is;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel105
  - number: 105.2.b
    text: |-
      indien de aanvraag betrekking heeft op de afgifte van een rijbewijs tegen overlegging van een rijbewijs dat aan de
      aanvrager is afgegeven door het daartoe bevoegde gezag buiten Nederland;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel105
  - number: 105.2.c
    text: |-
      indien de aanvrager in Nederland woonachtig is, doch niet als ingezetene is ingeschreven in de basisadministratie
      persoonsgegevens van een gemeente;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel105
  - number: 105.2.d
    text: |-
      indien de aanvraag betrekking heeft op de afgifte van een rijbewijs tegen overlegging van een door het militaire
      gezag afgegeven bewijs van rijvaardigheid.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel105
  - number: 105a.1
    text: |-
      Aan de aanvrager aan wie eerder een rijbewijs is afgegeven dat verloren is geraakt of teniet is gegaan dan wel
      versleten of geheel of ten dele onleesbaar is, wordt overeenkomstig [artikel 120, eerste lid, van de wet][ref1] een
      vervangend rijbewijs afgegeven indien


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel120
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel105a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '120'
  - number: 105a.1.a
    text: |-
      het rijbewijs dat verloren is geraakt of teniet is gegaan dan wel versleten of geheel of ten dele onleesbaar is,
      mede is afgegeven voor een der rijbewijscategorieën C, C1, D, D1, E bij C, E bij C1, E bij D of E bij D1;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel105a
  - number: 105a.1.b
    text: |-
      de geldigheidsduur van het rijbewijs dat verloren is geraakt of teniet is gegaan dan wel versleten of geheel of ten
      dele onleesbaar is, verstrijkt op of na de dag waarop de aanvrager de leeftijd van 70 jaren bereikt;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel105a
  - number: 105a.1.c
    text: |-
      het rijbewijs dat verloren is geraakt of teniet is gegaan dan wel versleten of geheel of ten dele onleesbaar
      is, geldig is tot de dag waarop de in het rijbewijzenregister geregistreerde termijn waarvoor de houder naar
      verwachting geschikt zal zijn voor het besturen van motorrijtuigen verstrijkt;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel105a
  - number: 105a.1.d
    text: |-
      uit een aantekening in het rijbewijzenregister blijkt dat de houder bij de aanvraag van een nieuw rijbewijs dient
      aan te tonen dat hij beschikt over de lichamelijke en geestelijke geschiktheid die is vereist voor het besturen van
      motorrijtuigen van de categorie of categorieën waarop het onderzoek betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel105a
  - number: 105a.1.e
    text: |-
      de aanvrager een vreemdeling is in de zin van de [Vreemdelingenwet 2000][ref1], en geen onderdaan van een
      lidstaat van de Europese Gemeenschap of een andere staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte of Zwitserland, en hij niet rechtmatig in Nederland verblijft als bedoeld in
      [artikel 8, onder a tot en met d en l, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel105a
    references:
      - id: ref1
        bwb_id: BWBR0011823
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 105a.2
    text: |-
      Degene die ingevolge [artikel 120 van de wet][ref1] een vervangend rijbewijs afgeeft, plaatst in het af te geven
      vervangende rijbewijs een bij ministeriële regeling vastgestelde codering met betrekking tot het rijbewijs waarvoor
      dat vervangende rijbewijs in de plaats treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel120
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel105a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '120'
  - number: '106'
    text: |-
      In de gevallen, bedoeld in de artikelen 45, 47, eerste lid, aanhef en onderdeel c, en 48, eerste lid, aanhef
      en onderdeel c, geeft degene die is belast met de afgifte van rijbewijzen, een rijbewijs af voor het besturen
      van motorrijtuigen van de rijbewijscategorie of rijbewijscategorieën die gelijkwaardig zijn aan de categorie
      of categorieën waarvoor het overgelegde rijbewijs was afgegeven. Bij ministeriële regeling kunnen voorschriften
      omtrent de vaststelling van de gelijkwaardigheid worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel106
  - number: '107'
    text: |-
      Indien de aanvraag betrekking heeft op de afgifte van een rijbewijs tegen overlegging van een rijbewijs dat door
      het daartoe bevoegde gezag buiten Nederland, anders dan in een andere lid-staat van de Europese Gemeenschap of in
      een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland is
      afgegeven op basis van een eerder aan de aanvrager afgegeven rijbewijs, wordt een rijbewijs afgegeven dat geldig is
      voor de categorie of categorieën waarvoor dat eerder afgegeven rijbewijs geldig was.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel107
  - number: '108'
    text: |-
      Indien de aanvraag betrekking heeft op de afgifte van een rijbewijs tegen overlegging van een rijbewijs dat
      door het daartoe bevoegde gezag buiten Nederland is afgegeven op basis van een eerder aan de aanvrager afgegeven
      rijbewijs dat geldig was voor meer categorieën dan het buiten Nederland afgegeven rijbewijs, wordt een rijbewijs
      afgegeven dat geldig is voor de categorieën waarvoor dat eerder afgegeven rijbewijs geldig was.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel108
  - number: '109'
    text: |-
      Degene die een rijbewijs afgeeft tegen overlegging van een buiten Nederland afgegeven rijbewijs, neemt dat
      rijbewijs in en zendt het, onder vermelding van de reden van inname, terug naar het gezag dat het heeft afgegeven.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel109
  - number: '111'
    text: |-
      Degene die een rijbewijs afgeeft tegen overlegging van een rijbewijs dat is afgegeven buiten Nederland, anders
      dan in een andere lid-staat van de Europese Gemeenschap of in een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte of Zwitserland, vermeldt in het af te geven rijbewijs in welk deel van
      het Koninkrijk, onderscheidenlijk in welk land het overgelegde rijbewijs is afgegeven. De vermelding vindt plaats
      in de vorm van een bij ministeriële regeling vastgestelde codering.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel111
  - number: '112'
    text: |-
      Degene die een rijbewijs afgeeft tegen overlegging van een rijbewijs waarin is vermeld dat de aanvrager dat
      overgelegde rijbewijs heeft verkregen tegen overlegging van een rijbewijs dat is afgegeven buiten Nederland, anders
      dan in een andere lid-staat van de Europese Gemeenschap of in een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte of Zwitserland, neemt die vermelding over in het af te geven rijbewijs.
      De vermelding vindt plaats in de vorm van een bij ministeriële regeling vastgestelde codering.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel112
  - number: '113'
    text: |-
      Degene die een rijbewijs afgeeft tegen overlegging van een in een andere lid-staat van de Europese Gemeenschap of
      in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland
      afgegeven rijbewijs waarin is vermeld dat de aanvrager dit rijbewijs heeft verkregen op grond van een eerder
      in een ander land dan in een lid-staat van de Europese Gemeenschap of in een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland afgegeven rijbewijs, neemt die vermelding
      over in het af te geven rijbewijs. De vermelding vindt plaats in de vorm van een bij ministeriële regeling
      vastgestelde codering.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel113
  - number: '114'
    text: |-
      Degene die een rijbewijs afgeeft tegen overlegging van een buiten Nederland afgegeven rijbewijs waarvan de
      geldigheid voor een of meer categorieën is beperkt tot een subcategorie van motorrijtuigen, plaatst in het af te
      geven rijbewijs bij die categorie of categorieën een bij ministeriële regeling vastgestelde codering waaruit die
      beperking blijkt.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel114
  - number: '115'
    text: |-
      Degene die een rijbewijs afgeeft tegen overlegging van een in een andere lid-staat van de Europese Gemeenschap of
      in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland,
      afgegeven rijbewijs dat is voorzien van een aantekening dan wel een codering waaruit blijkt dat het onderzoek naar
      de rijvaardigheid van de aanvrager heeft plaatsgevonden met een motorrijtuig dat is voorzien van een automatische
      gangwissel of van een automatische koppeling, neemt die aantekening, omgezet in een bij ministeriële regeling
      vastgestelde codering, dan wel die codering over in het af te geven rijbewijs.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel115
  - number: '116'
    text: |-
      Degene die een rijbewijs afgeeft tegen overlegging van een buiten Nederland, anders dan in een andere lid-staat
      van de Europese Gemeenschap of in een andere staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte of Zwitserland, afgegeven rijbewijs waaruit blijkt dat het onderzoek naar de rijvaardigheid van
      de aanvrager heeft plaatsgevonden met een motorrijtuig dat is voorzien van een automatische gangwissel of van een
      automatische koppeling, plaatst in het af te geven rijbewijs een bij ministeriële regeling vastgestelde codering
      waaruit die beperking blijkt.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel116
  - number: '117.1'
    text: |-
      Degene die een rijbewijs afgeeft tegen overlegging van een buiten Nederland afgegeven rijbewijs waaruit blijkt
      dat het onderzoek naar de rijvaardigheid van de aanvrager voor zover het betreft de rijbewijscategorie E heeft
      plaatsgevonden met een samenstel van voertuigen als bedoeld in artikel 75, geeft een rijbewijs af dat voor wat
      betreft de categorie E slechts geldig is voor het voortbewegen van een aanhangwagen indien deze wordt voortbewogen
      door een motorrijtuig voor het besturen waarvan een rijbewijs B is vereist.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel117
  - number: '117.2'
    text: |-
      Degene die een rijbewijs afgeeft tegen overlegging van een buiten Nederland afgegeven rijbewijs waaruit blijkt
      dat het onderzoek naar de rijvaardigheid van de aanvrager voor zover het betreft de rijbewijscategorie E heeft
      plaatsgevonden met een samenstel van voertuigen als bedoeld in artikel 76, geeft een rijbewijs af dat voor wat
      betreft de categorie E geldig is voor het voortbewegen van een aanhangwagen indien deze wordt voortbewogen door een
      motorrijtuig voor het besturen waarvan een rijbewijs B of C is vereist en, indien de aanvrager in het bezit is van
      een rijbewijs D, voor het voortbewegen van een aanhangwagen indien deze wordt voortbewogen door een motorrijtuig
      voor het besturen waarvan een rijbewijs D is vereist.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel117
  - number: '117.3'
    text: |-
      Degene die een rijbewijs afgeeft tegen overlegging van een buiten Nederland afgegeven rijbewijs waaruit blijkt
      dat het onderzoek naar de rijvaardigheid van de aanvrager voor zover het betreft de rijbewijscategorie E heeft
      plaatsgevonden met een samenstel van voertuigen als bedoeld in artikel 77, geeft een rijbewijs af dat voor wat
      betreft de categorie E slechts geldig is voor het voortbewegen van een aanhangwagen indien deze wordt voortbewogen
      door een motorrijtuig voor het besturen waarvan een rijbewijs B of D is vereist.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel117
  - number: '118'
    text: |-
      Degene die een rijbewijs afgeeft tegen overlegging van een in een andere lid-staat van de Europese Gemeenschap of
      in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland,
      afgegeven rijbewijs dat is voorzien van een aantekening dan wel een codering waaruit blijkt dat de aanvrager
      slechts een motorrijtuig kan besturen dat aan bepaalde eisen voldoet dan wel slechts een motorrijtuig kan besturen
      indien hij gebruik maakt van kunst- of hulpmiddelen, neemt die aantekening, omgezet in een bij ministeriële
      regeling vastgestelde codering, dan wel die codering over in het af te geven rijbewijs.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel118
  - number: 118a.1
    text: |-
      Degene die een rijbewijs afgeeft tegen overlegging van een eerder afgegeven rijbewijs waarin vermeldingen of
      beperkende aantekeningen in de vorm van een bij ministeriële regeling vastgestelde codering zijn aangebracht, neemt
      die codering of coderingen over in het af te geven rijbewijs.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel118a
  - number: 118a.2
    text: |-
      Indien het eerder afgegeven rijbewijs niet kan worden overgelegd omdat het verloren is geraakt of teniet is
      gegaan, neemt degene die een rijbewijs afgeeft de in het rijbewijzenregister opgenomen vermeldingen of beperkende
      aantekeningen in de vorm van een bij ministeriële regeling vastgestelde codering over in het af te geven rijbewijs.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel118a
  - number: 118b
    text: |-
      Indien de aanvraag betrekking heeft op de vermelding van een getuigschrift van vakbekwaamheid of een getuigschrift
      van nascholing tegen overlegging van een kwalificatiekaart bestuurder of een buitenlands omwisselingscertificaat,
      neemt degene die het rijbewijs afgeeft de kwalificatiekaart bestuurder of het buitenlands omwisselingscertificaat
      in. De Dienst Wegverkeer vergewist zich van de echtheid van het overgelegde document en zendt het terug naar het
      gezag dat het heeft afgegeven.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel118b
  - number: '119.1'
    text: Rijbewijzen worden door tussenkomst van de Dienst Wegverkeer bij de leverancier besteld.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel119
  - number: '119.2'
    text: |-
      De met de afgifte van rijbewijzen belaste autoriteiten houden een registratie bij van de voor de bestelling van
      rijbewijzen geautoriseerde medewerkers.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel119
  - number: '119.3'
    text: Bestelling vindt plaats volgens de daarvoor bij ministeriële regeling vastgestelde procedure.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel119
  - number: '120'
    text: |-
      Het transport van rijbewijzen van de leverancier naar de met de afgifte van rijbewijzen belaste autoriteiten vindt
      plaats volgens de daarvoor bij ministeriële regeling vastgestelde procedure.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel120
  - number: '121'
    text: |-
      Rijbewijzen worden terstond na aflevering veilig gesteld in de in [artikel 125][ref1] bedoelde voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel125
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '125'
        hoofdstuk: V
        paragraaf: '3'
  - number: '122.1'
    text: |-
      De met de afgifte belaste autoriteiten registreren de ontvangst van de afgeleverde rijbewijzen in het
      rijbewijzenregister en controleren de levering op juistheid en volledigheid. Onjuist vervaardigde dan wel onjuist
      afgeleverde rijbewijzen worden volgens een bij ministeriële regeling vastgestelde procedure naar de Dienst
      Wegverkeer gezonden, waar ze worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel122
  - number: '122.2'
    text: |-
      De met de afgifte belaste autoriteiten controleren maandelijks aan de hand van de in het rijbewijzenregister
      opgeslagen gegevens welke rijbewijzen niet binnen drie maanden na de datum waarop het besluit tot afgifte is
      genomen, zijn uitgereikt. Deze rijbewijzen worden volgens een bij ministeriële regeling vastgestelde procedure naar
      de Dienst Wegverkeer gezonden, waar ze worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel122
  - number: '123.1'
    text: |-
      De Dienst Wegverkeer zendt in de eerste helft van elke kalendermaand aan de gemeenten een factuur voor en een
      opgave van de in de aan die maand voorafgaande maand door de burgemeesters van die gemeenten bestelde rijbewijzen
      en de bij die burgemeesters ingediende, tot de Dienst Wegverkeer gerichte aanvragen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel123
  - number: '123.2'
    text: |-
      De afdracht van het op grond van de in het eerste lid bedoelde factuur verschuldigde bedrag vindt plaats door
      middel van automatische verrekening bij de NV Bank Nederlandse Gemeenten op de eerste werkdag van de derde
      kalendermaand volgende op die waarin de betrokken factuur is verzonden.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel123
  - number: 123a
    text: |-
      De met de afgifte van rijbewijzen belaste autoriteiten vernietigen de in het kader van de aanvraag overgelegde en
      door de uitreiking van een nieuw dan wel vervangend rijbewijs ongeldig geworden rijbewijzen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel123a
  - number: '124.1'
    text: |-
      De met de afgifte van rijbewijzen belaste autoriteiten treffen maatregelen om de onder hen berustende rijbewijzen
      en de met de afgifte van rijbewijzen verband houdende materialen en apparatuur te beveiligen tegen ontvreemding dan
      wel vernietiging ten gevolge van inbraak, diefstal, verduistering, overvallen, brand of anderszins.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel124
  - number: '124.2'
    text: |-
      De met de afgifte van rijbewijzen belaste autoriteiten dragen er zorg voor dat toegangspassen en gebruikerscodes
      tot de met de afgifte van rijbewijzen verband houdende apparatuur alleen worden gebruikt door de onder hen
      ressorterende, met de afgifte van rijbewijzen belaste medewerkers aan wie de desbetreffende toegangspassen en
      gebruikerscodes zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel124
  - number: '125'
    text: |-
      De met de afgifte van rijbewijzen belaste autoriteiten dragen er zorg voor dat de voorraad rijbewijzen en de met
      de afgifte van rijbewijzen verband houdende materialen worden opgeslagen in een inbraakvertragende en brandwerende
      voorziening met een bij ministeriële regeling vast te stellen waardebergingsindicatie, welke voorziening dient te
      zijn geplaatst in een af te sluiten ruimte. De met de afgifte van rijbewijzen verband houdende apparatuur wordt
      geplaatst in een beveiligde ruimte.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel125
  - number: '126'
    text: |-
      De met de afgifte van rijbewijzen belaste autoriteiten dragen er zorg voor dat de plaatsen waar rijbewijzen en
      met de afgifte van rijbewijzen verband houdende materialen en apparatuur zijn opgeslagen, zijn uitgerust met
      een electronisch inbraakalarmeringssysteem dat voorziet in een permanente vaste lijn-verbinding met een door de
      rijksoverheid toegelaten alarmcentrale.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel126
  - number: '127'
    text: |-
      De met de afgifte van rijbewijzen belaste autoriteiten dragen er zorg voor dat de werkvoorraad rijbewijzen en de
      werkvoorraad met de afgifte van rijbewijzen verband houdende materialen en apparatuur zich tijdens de werkuren
      onder voortdurend toezicht bevinden, op een voor het publiek onzichtbare en voor onbevoegden onbereikbare plaats.
      Buiten de werkuren dienen de werkvoorraden alsmede de onjuist vervaardigde dan wel onjuist afgeleverde documenten
      te worden opgeslagen in de in [artikel 125][ref1] bedoelde voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel125
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '125'
        hoofdstuk: V
        paragraaf: '3'
  - number: '128.1'
    text: |-
      De met de afgifte van rijbewijzen belaste autoriteiten dragen zorg voor een op schrift gestelde
      beveiligingsprocedure, die in ieder geval voorschriften bevat met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel128
  - number: 128.1.a
    text: |-
      de toegang van personen tot en het beheer van rijbewijzen, de met de afgifte van rijbewijzen verband houdende
      materialen, apparatuur, toegangspassen en gebruikerscodes tot de apparatuur;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel128
  - number: 128.1.b
    text: de verantwoordelijkheden van de beveiligingsfunctionaris, bedoeld in het zesde lid;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel128
  - number: 128.1.c
    text: de functiescheiding tussen de bij de aanvraag en de uitreiking van rijbewijzen betrokken functionarissen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel128
  - number: '128.2'
    text: |-
      Indien het als gevolg van de omvang van het ambtelijk apparaat van een met de afgifte van rijbewijzen belaste
      autoriteit niet mogelijk is om te allen tijde te voldoen aan de in het eerste lid, onder c, gestelde eis van
      functiescheiding, kan daarvan met inachtneming van het derde en vierde lid worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel128
  - number: '128.3'
    text: 'In de situatie, bedoeld in het tweede lid, wordt schriftelijk vastgelegd:'
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel128
  - number: 128.3.a
    text: de reden waarom tijdelijk niet aan de eis van functiescheiding kan worden voldaan;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel128
  - number: 128.3.b
    text: de periode waarin niet aan de eis van functiescheiding wordt voldaan;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel128
  - number: 128.3.c
    text: |-
      de namen van de functionarissen die in de onder b bedoelde periode zijn belast met de aanvraag en de uitreiking
      van rijbewijzen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel128
  - number: '128.4'
    text: |-
      Na afloop van de periode, bedoeld in het derde lid, controleert de beveiligingsfunctionaris, bedoeld in het zesde
      lid, of de aanvraag en de uitreiking van rijbewijzen op de voorgeschreven wijze hebben plaatsgevonden. Indien de
      aanvraag en de uitreiking van rijbewijzen niet op de voorgeschreven wijze hebben plaatsgevonden, wordt gehandeld
      overeenkomstig [artikel 130, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel130
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '130'
        hoofdstuk: V
        paragraaf: '3'
  - number: '128.5'
    text: |-
      In de situatie, bedoeld in het tweede lid, wordt een eerder aan de aanvrager afgegeven rijbewijs niet vernietigd
      dan nadat de in het vierde lid bedoelde controle heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel128
  - number: '128.6'
    text: |-
      De met de afgifte van rijbewijzen belaste autoriteiten wijzen een beveiligingsfunctionaris aan, die is belast met
      het beheer van en het toezicht op de naleving van de beveiligingsprocedure.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel128
  - number: '128.7'
    text: De in het eerste lid bedoelde maatregelen maken deel uit van de reguliere accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel128
  - number: '128.8'
    text: |-
      De met de afgifte van rijbewijzen belaste autoriteiten dragen er zorg voor dat de beveiligingsprocedure, bedoeld in
      het eerste lid, telkenjare wordt geëvalueerd en zonodig wordt aangepast.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel128
  - number: '129'
    text: |-
      De met de afgifte van rijbewijzen belaste autoriteiten dragen er zorg voor dat de onder hen ressorterende, met de
      afgifte van rijbewijzen belaste medewerkers regelmatig worden geïnformeerd over ontvreemdings- en frauderisico’s
      en ten minste eenmaal per jaar worden geïnstrueerd met betrekking tot risicobeperkende afspraken en maatregelen
      ter zake.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel129
  - number: '130.1'
    text: |-
      De met de afgifte belaste autoriteiten controleren maandelijks de voorraad rijbewijzen aan de hand van de in het
      rijbewijzenregister opgeslagen gegevens.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel130
  - number: '130.2'
    text: |-
      De met de afgifte van rijbewijzen belaste autoriteiten dienen terstond na constatering van ontvreemding dan
      wel vermissing of vernietiging van rijbewijzen en met de afgifte van rijbewijzen verband houdende materialen en
      apparatuur ten gevolge van inbraak, diefstal, verduistering, overvallen, brand of anderszins, aangifte te doen
      bij de plaatselijke politie en, voor zover het de afgifte van rijbewijzen door de burgemeester betreft, de Dienst
      Wegverkeer in kennis te stellen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel130
  - number: '130.3'
    text: 'Een kennisgeving als bedoeld in het eerste lid bevat de navolgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel130
  - number: 130.3.a
    text: het tijdstip en de exacte toedracht van de ontvreemding of vernietiging;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel130
  - number: 130.3.b
    text: het nummer alsmede de persoonsgegevens van ieder ontvreemd, vermist of vernietigd rijbewijs;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel130
  - number: 130.3.c
    text: de overige ontvreemde, vermiste of vernietigde materialen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel130
  - number: '130.4'
    text: |-
      Zodra het door de plaatselijke politie opgemaakte proces-verbaal beschikbaar is, wordt daarvan een afschrift
      gezonden aan de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel130
  - number: '131'
    text: 'Tot het doen van de schriftelijke mededeling, bedoeld in artikel 130, eerste lid, van de wet zijn bevoegd:'
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel131
  - number: 131.a
    text: |-
      de korpschef, bedoeld in artikel 24, onderscheidenlijk [artikel 38 van de Politiewet 1993][ref1] en de door hem
      voor dit doel aangewezen plaatsvervangers;


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel38
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '38'
  - number: 131.b
    text: |-
      de commandant, bedoeld in [artikel 6, derde lid, van de Politiewet 1993][ref1] en de door hem voor dit doel
      aangewezen plaatsvervangers;


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel6
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '6'
  - number: 131.c
    text: de betrokken officier van justitie;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel131
  - number: 131.d
    text: de directeur van het CBR.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel131
  - number: 131a
    text: |-
      Bij de uitvoering van de maatregelen rijvaardigheid en geschiktheid raadpleegt het CBR de in de gemeentelijke
      basisadministratie persoonsgegevens ingeschreven persoonsgegevens van betrokkene.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel131a
  - number: '132.1'
    text: |-
      Zo spoedig mogelijk, doch uiterlijk binnen vier weken na ontvangst van de in
      [artikel 130, eerste lid, van de wet][ref1] bedoelde mededeling legt het CBR in de bij ministeriële regeling
      aangegeven gevallen betrokkene de verplichting op zich te onderwerpen aan een educatieve maatregel of maatregelen.
      Zo spoedig mogelijk doch uiterlijk binnen vier weken na ontvangst van de volledige betaling van de kosten van de
      educatieve maatregel of maatregelen stelt het CBR het tijdstip waarop en de plaats waar betrokkene de opgelegde
      educatieve maatregel of maatregelen dient te ondergaan, vast. Het wijst daarbij tevens de tot toepassing van die
      maatregel of maatregelen bevoegde deskundigen aan.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel130
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '130'
  - number: '132.2'
    text: |-
      Indien betrokkene niet op de vastgestelde tijd en plaats aanwezig is, worden zo spoedig mogelijk, doch uiterlijk
      binnen vier weken na ontvangst van het afwezigheidsbericht tijd en plaats waarop betrokkene de hem opgelegde
      educatieve maatregelen dient te ondergaan, door het CBR opnieuw vastgesteld, tenzij naar het oordeel van het CBR
      geen sprake is van een geldige reden van verhindering.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel132
  - number: '132.3'
    text: |-
      Indien betrokkene niet op de vastgestelde tijd en plaats aanwezig is zonder dat van een geldige reden van
      verhindering blijkt, wordt daarvan door de aangewezen deskundige of deskundigen onverwijld mededeling gedaan aan
      het CBR.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel132
  - number: '132.4'
    text: |-
      De bevindingen van de met de toepassing van de educatieve maatregelen belaste deskundige of deskundigen worden
      zo spoedig mogelijk, doch uiterlijk binnen vier weken aan het CBR medegedeeld. Het CBR stelt op basis van die
      bevindingen zo spoedig mogelijk, doch uiterlijk binnen vier weken na de ontvangst ervan, vast of betrokkene aan de
      hem opgelegde verplichtingen heeft voldaan.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel132
  - number: '133.1'
    text: |-
      Tijdstip en plaats van het in [artikel 131 van de wet][ref1] bedoelde onderzoek naar de rijvaardigheid of
      geschiktheid of, indien het onderzoek in gedeelten plaatsvindt, van die gedeelten, worden door het CBR vastgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
  - number: 133.1.a
    text: |-
      in de in [artikel 131, eerste lid, van de wet][ref1] bedoelde gevallen zo spoedig mogelijk, doch uiterlijk binnen
      vier weken na ontvangst van de volledige betaling van de kosten van het onderzoek, in die gevallen waarin betaling
      voor rekening van betrokkene komt;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
  - number: 133.1.b
    text: |-
      in de overige gevallen zo spoedig mogelijk doch uiterlijk binnen vier weken na het besluit als bedoeld in
      [artikel 131, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
  - number: '133.2'
    text: |-
      Indien betrokkene niet op de voor het onderzoek vastgestelde tijd en plaats aanwezig is, worden zo spoedig
      mogelijk, doch uiterlijk binnen vier weken na ontvangst van het afwezigheidsbericht tijd en plaats van het
      onderzoek door het CBR opnieuw vastgesteld tenzij naar het oordeel van het CBR geen sprake is van een geldige reden
      van verhindering.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel133
  - number: '133.3'
    text: |-
      Indien betrokkene niet op de vastgestelde tijd en plaats aanwezig is zonder dat van een geldige reden van
      verhindering blijkt, wordt daarvan door de aangewezen deskundige of deskundigen onverwijld mededeling gedaan aan
      het CBR.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel133
  - number: '134.1'
    text: |-
      Het in [artikel 131 van de wet][ref1] bedoelde onderzoek naar de rijvaardigheid omvat een theorie-gedeelte en een
      praktijk-gedeelte.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
  - number: '134.2'
    text: |-
      Indien het onderzoek betrekking heeft op meerdere rijbewijscategorieën, wordt de kennis van de theorie van alle
      categorieën gezamenlijk onderzocht.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel134
  - number: '134.3'
    text: Het praktijk-gedeelte bestaat uit een rijproef voor elk van de categorieën waarop het onderzoek betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel134
  - number: '134.4'
    text: |-
      Indien het onderzoek betrekking heeft op een of meer van de rijbewijscategorieën AM, A, B, C, C1, D, D1 en E dan
      wel mede op een of meer van die rijbewijscategorieën, bestaat het praktijk-gedeelte in afwijking van het derde lid
      uit een of meerdere rijproeven, afgenomen overeenkomstig [artikel 135][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel135
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '135'
        hoofdstuk: VI
  - number: '134.5'
    text: |-
      Bij ministeriële regeling worden richtlijnen vastgesteld omtrent de wijze van beoordelen van de rijvaardigheid
      van betrokkene.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel134
  - number: 134a
    text: |-
      Indien het in [artikel 131 van de wet][ref1] bedoelde onderzoek naar de rijvaardigheid een onderzoek betreft
      op basis van feiten of omstandigheden die het rijgedrag betreffen, dan bestaat het onderzoek alleen uit een
      praktijkonderzoek. [Artikel 134, derde tot en met vijfde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel134
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel134a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
      - id: ref2
        bwb_id: BWBR0008074
        artikel: '134'
        hoofdstuk: VI
  - number: '135.1'
    text: |-
      Indien het onderzoek betrekking heeft op de rijbewijscategorieën B, C, C1, D, D1 en E, wordt eerst een rijproef
      voor de categorie E bij C afgenomen. Indien betrokkene blijkens die rijproef aan de voor die categorie gestelde
      eisen voldoet, wordt aangenomen dat hij mede voldoet aan de eisen voor de categorieën C, E bij C1, C1, E bij D, D,
      E bij D1, D1, E bij B en B.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel135
  - number: '135.2'
    text: |-
      Indien betrokkene blijkens de rijproef voor de categorie E bij C niet aan de voor die categorie gestelde eisen
      voldoet, wordt een rijproef voor de categorie C afgenomen. Indien betrokkene blijkens die rijproef aan de voor die
      categorie gestelde eisen voldoet, wordt aangenomen dat hij mede voldoet aan de eisen voor de categorieën E bij C1,
      C1, E bij D, D, E bij B en B.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel135
  - number: '135.3'
    text: |-
      Indien betrokkene blijkens de rijproef voor de categorie C niet aan de voor die categorie gestelde eisen voldoet,
      wordt een rijproef voor de categorie E bij D afgenomen. Indien betrokkene blijkens die rijproef aan de voor die
      categorie gestelde eisen voldoet, wordt aangenomen dat hij mede voldoet aan de eisen voor de categorieën D, E bij
      D1, D1, E bij B en B.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel135
  - number: '135.4'
    text: |-
      Indien betrokkene blijkens de rijproef voor de categorie E bij D niet aan de voor die categorie gestelde eisen
      voldoet, wordt een rijproef voor de categorie D afgenomen. Indien betrokkene blijkens die rijproef aan de voor die
      categorie gestelde eisen voldoet, wordt aangenomen dat hij mede voldoet aan de eisen voor de categorieën E bij D1,
      D1, E bij B en B.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel135
  - number: '135.5'
    text: |-
      Indien betrokkene blijkens de rijproef voor de categorie D niet aan de voor die categorie gestelde eisen voldoet,
      wordt een rijproef voor de categorie E bij C1 afgenomen. Indien betrokkene blijkens die rijproef aan de voor die
      categorie gestelde eisen voldoet, wordt aangenomen dat hij mede voldoet aan de eisen voor de categorie E bij D1,
      D1, E bij B en B.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel135
  - number: '135.6'
    text: |-
      Indien betrokkene blijkens de rijproef voor de categorie E bij C1 niet aan de voor die categorie gestelde eisen
      voldoet, wordt een rijproef voor de categorie C1 afgenomen. Indien betrokkene blijkens die rijproef aan de voor die
      categorie gestelde eisen voldoet, wordt aangenomen dat hij mede voldoet aan de eisen voor de categorie E bij D1,
      D1, E bij B en B.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel135
  - number: '135.7'
    text: |-
      Indien betrokkene blijkens de rijproef voor de categorie C1 niet aan de voor die categorie gestelde eisen voldoet,
      wordt een rijproef voor de categorie E bij D1 afgenomen. Indien betrokkene blijkens die rijproef aan de voor die
      categorie gestelde eisen voldoet, wordt aangenomen dat hij mede voldoet aan de eisen voor de categorie D1, E bij B
      en B.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel135
  - number: '135.8'
    text: |-
      Indien betrokkene blijkens de rijproef voor de categorie E bij D1 niet aan de voor die categorie gestelde eisen
      voldoet, wordt een rijproef voor de categorie D1 afgenomen. Indien betrokkene blijkens die rijproef aan de voor
      die categorie gestelde eisen voldoet, wordt aangenomen dat hij mede voldoet aan de eisen voor de categorie E bij B
      en B.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel135
  - number: '135.9'
    text: |-
      Indien betrokkene blijkens de rijproef voor de categorie D1 niet aan de voor die categorie gestelde eisen voldoet,
      wordt een rijproef voor de categorie E bij B afgenomen. Indien betrokkene blijkens die rijproef aan de voor die
      categorie gestelde eisen voldoet, wordt aangenomen dat hij mede voldoet aan de eisen voor de categorie B.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel135
  - number: '135.10'
    text: |-
      Indien betrokkene blijkens de rijproef voor de categorie E bij B niet aan de voor die categorie gestelde eisen
      voldoet, wordt een rijproef voor de categorie B afgenomen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel135
  - number: '135.11'
    text: |-
      Indien betrokkene blijkens de rijproef voor categorie A of blijkens een rijproef op grond van een van de voorgaande
      leden niet aan de voor die categorie gestelde eisen voldoet, wordt een rijproef afgenomen voor de categorie AM.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel135
  - number: '136.1'
    text: |-
      Het in [artikel 131 van de wet][ref1] bedoelde onderzoek naar de rijvaardigheid vindt plaats aan de hand van de
      bij ministeriële regeling ter uitvoering van de [artikelen 60a tot en met 64][ref2], [69a][ref3] en [70][ref4]
      vastgestelde eisen met betrekking tot de rijvaardigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0008074#Artikel69a
      [ref4]: https://wetten.overheid.nl/BWBR0008074#Artikel70
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
      - id: ref2
        bwb_id: BWBR0008074
        artikel: '61'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0008074
        artikel: 69a
        hoofdstuk: III
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0008074
        artikel: '70'
        hoofdstuk: III
        paragraaf: '4'
  - number: '136.2'
    text: |-
      In afwijking van het eerste lid vindt het in [artikel 134a][ref1] bedoelde onderzoek plaats aan de hand van de
      bij ministeriële regeling ter uitvoering van de [artikelen 60a tot en met 64][ref2], [69a][ref3] en [70][ref4]
      vastgestelde eisen met betrekking tot het onderdeel rijgedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel134a
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0008074#Artikel69a
      [ref4]: https://wetten.overheid.nl/BWBR0008074#Artikel70
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 134a
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0008074
        artikel: '61'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0008074
        artikel: 69a
        hoofdstuk: III
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0008074
        artikel: '70'
        hoofdstuk: III
        paragraaf: '4'
  - number: '137.1'
    text: |-
      De rijproef wordt afgelegd met een motorrijtuig dan wel een samenstel van trekkend motorrijtuig en aanhangwagen van
      de rijbewijscategorie waarop het onderzoek betrekking heeft. De [artikelen 69b][ref1] en [71 tot en met 81][ref2]
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel69b
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel71
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 69b
        hoofdstuk: III
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0008074
        artikel: '71'
        hoofdstuk: III
        paragraaf: '4'
  - number: '137.2'
    text: |-
      Het motorrijtuig dan wel het samenstel van trekkend motorrijtuig en aanhangwagen, waarmee de rijproef wordt
      afgelegd, dient naar het oordeel van het CBR daartoe geschikt te zijn.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel137
  - number: '138'
    text: |-
      De duur van de rijproef bedraagt voor de rijbewijscategorieën AM, A, B en E bij B ten minste 35 minuten en voor de
      rijbewijscategorieën C, D, E bij C en E bij D ten minste 60 minuten.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel138
  - number: '139'
    text: |-
      De rijproef kan binnen de voorgeschreven tijd worden gestaakt, indien betrokkene naar het oordeel van de deskundige
      of deskundigen door zijn wijze van rijden de veiligheid op de weg in gevaar brengt. Indien het onderzoek naar de
      rijvaardigheid betrekking heeft op de rijbewijscategorie A, kan de rijproef eveneens binnen de voorgeschreven tijd
      worden gestaakt, indien betrokkene naar het oordeel van de deskundige of deskundigen de bijzondere verrichtingen
      niet op juiste en veilige wijze uitvoert.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel139
  - number: '140'
    text: |-
      Indien betrokkene bij een rijproef blijkt aan de eisen te voldoen doch bij het theorie-gedeelte wordt afgewezen,
      wordt hij in de gelegenheid gesteld binnen zes weken na het onderzoek aan een nieuw onderzoek voor dit theorie-
      gedeelte deel te nemen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel140
  - number: '141.1'
    text: |-
      Het CBR deelt de uitslag van het onderzoek en het naar aanleiding daarvan door hem genomen besluit mede aan degene
      die de in [artikel 130 van de wet][ref1] bedoelde mededeling heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel130
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '130'
  - number: '141.2'
    text: |-
      Indien de uitslag van het onderzoek inhoudt dat betrokkene niet de rijvaardigheid bezit voor een of meer
      categorieën motorrijtuigen die in de vordering zijn vermeld, deelt het CBR de uitslag van het onderzoek en het naar
      aanleiding daarvan door hem genomen besluit tevens mede aan:
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel141
  - number: 141.2.a
    text: |-
      degene die het rijbewijs heeft afgegeven, indien het ongeldig is verklaard voor alle categorieën waarvoor het is
      afgegeven;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel141
  - number: 141.2.b
    text: |-
      degene die is belast met de afgifte van rijbewijzen, indien het niet voor alle categorieën waarvoor het is
      afgegeven, ongeldig is verklaard dan wel indien de ongeldigverklaring betrekking heeft op een deel van de
      geldigheidsduur.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel141
  - number: '142'
    text: |-
      Het in artikel 131 van de wet bedoelde onderzoek naar de geschiktheid vindt plaats aan de hand van de bij
      ministeriële regeling vastgestelde eisen met betrekking tot de lichamelijke en geestelijke geschiktheid en mag
      slechts betreffen:
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel142
  - number: 142.a
    text: |-
      indien betrokkene de leeftijd van 70 jaren nog niet heeft bereikt, de punten waaromtrent in de eigen verklaring
      vragen zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel142
  - number: 142.b
    text: |-
      indien betrokkene de leeftijd van 70 jaren heeft bereikt, bovendien de punten waaromtrent in het geneeskundig
      verslag vragen zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel142
  - number: '143.1'
    text: |-
      Het CBR deelt de uitslag van het onderzoek en het naar aanleiding daarvan door hem genomen besluit mede aan degene
      die de in artikel 130 van de wet bedoelde mededeling heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel143
  - number: '143.2'
    text: |-
      Indien de uitslag van het onderzoek inhoudt dat betrokkene niet voldoet aan de bij ministeriële regeling
      vastgestelde eisen met betrekking tot de lichamelijke en geestelijke geschiktheid tot het besturen van een of meer
      categorieën van motorrijtuigen of dat er redelijke grond bestaat voor de verwachting dat betrokkene slechts aan
      die eisen voldoet voor een termijn die korter is dan de tijdsduur waarvoor het rijbewijs op het tijdstip van het
      onderzoek nog geldig is, deelt het CBR de uitslag van het onderzoek en het naar aanleiding daarvan door hem genomen
      besluit tevens mede aan degene die is belast met de afgifte van rijbewijzen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel143
  - number: '144'
    text: De Dienst Wegverkeer is verantwoordelijke voor de verwerking van persoonsgegevens in het rijbewijzenregister.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel144
  - number: '145.1'
    text: 'In het rijbewijzenregister worden de navolgende gegevens opgenomen:'
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel145
  - number: 145.1.a
    text: |-
      geslachtsnaam, voorvoegsels, eerste voornaam voluit, voorletters van eventuele overige voornamen, burgerlijke
      staat, plaats en datum en eventueel land van geboorte, geslacht, en burgerservicenummer van degenen aan wie een
      rijbewijs is afgegeven;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel145
  - number: 145.1.b
    text: |-
      indien in het rijbewijs op verzoek van de houder diens adellijke titel of predikaat zijn vermeld, adellijke titel
      of predikaat;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel145
  - number: 145.1.c
    text: |-
      indien in het rijbewijs op verzoek van de houder naamsgegevens van diens huidige echtgenoot, echtgenote of
      geregistreerd partner, dan wel van de laatste gewezen echtgenoot, echtgenote of geregistreerd partner zijn vermeld,
      geslachtsnaam, voorvoegsels en adellijke titel of predikaat van die huidige echtgenoot, echtgenote of geregistreerd
      partner, dan wel van de laatste gewezen echtgenoot, echtgenote of geregistreerd partner;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel145
  - number: 145.1.d
    text: |-
      het adres van degenen aan wie een rijbewijs is afgegeven en het adres zoals het bekend was ten tijde van de
      afgifte;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel145
  - number: 145.1.e
    text: pasfoto en handtekening van degene aan wie een rijbewijs is afgegeven;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel145
  - number: 145.1.f
    text: verklaringen van rijvaardigheid;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel145
  - number: 145.1.g
