      [artikel 131, eerste lid, van de wet][ref2], in verband met een gevorderd of een op verzoek van de aanvrager
      uitgevoerd onderzoek naar diens rijvaardigheid tot het besturen van motorrijtuigen ongeldig is verklaard dan wel


