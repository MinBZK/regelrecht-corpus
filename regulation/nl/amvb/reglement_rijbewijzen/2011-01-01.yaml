        paragraaf: '4'
  - number: '179.1'
    text: |-
      Voor de toepassing van [artikel 18, eerste lid][ref1], wordt onder een rijbewijs B dat is voorzien van een bij
      ministeriële regeling vastgestelde code waaruit blijkt dat de houder van dat rijbewijs het praktijk-examen heeft
      afgelegd in een motorrijtuig dat is voorzien van een automatische gangwissel of van een automatische koppeling mede
      verstaan een op basis van de Wegenverkeerswet afgegeven rijbewijs B met de aanduiding «Automaat».


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel18
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel179
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '18'
        hoofdstuk: I
        paragraaf: '6'
  - number: '179.2'
    text: |-
      Voor de toepassing van [artikel 18, tweede lid][ref1], wordt onder een rijbewijs dat zijn geldigheid heeft verloren
      door het verstrijken van de geldigheidsduur mede verstaan een op basis van de Wegenverkeerswet afgegeven rijbewijs
      dat zijn geldigheid heeft verloren door het verstrijken van de geldigheidsduur en dat niet behoort tot een bij
      ministeriële regeling aangewezen model.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel18
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel179
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '18'
        hoofdstuk: I
        paragraaf: '6'
  - number: '179.3'
    text: |-
      Voor de toepassing van [artikel 18, vijfde lid, onderdeel a][ref1], wordt onder een rijbewijs B dat zijn
      geldigheid heeft verloren door het verstrijken van de geldigheidsduur mede verstaan een op basis van de
      Wegenverkeerswet afgegeven rijbewijs B dat na 30 juni 1985 zijn geldigheid heeft verloren door het verstrijken van
      de geldigheidsduur.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel18
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel179
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '18'
        hoofdstuk: I
        paragraaf: '6'
  - number: '183.1'
    text: |-
      Voor de toepassing van de [artikelen 35, aanhef en onderdeel a][ref1], [36][ref2] en [38 tot en met 43][ref3],
      wordt onder een eerder aan de aanvrager afgegeven rijbewijs mede verstaan een eerder op basis van de
      Wegenverkeerswet aan de aanvrager afgegeven rijbewijs dat op het moment van de aanvraag na 30 juni 1985 zijn
      geldigheid heeft verloren door het verstrijken van de geldigheidsduur.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0008074#Artikel38
