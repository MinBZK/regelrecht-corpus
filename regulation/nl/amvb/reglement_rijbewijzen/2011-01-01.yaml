  - number: 152.b
    text: |-
      de ongeldigheid van rijbewijzen ingevolge [artikel 123, eerste lid, onderdeel b, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel123
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '123'
  - number: 152.c
    text: |-
      vermissing of diefstal, bedoeld in [artikel 145, onderdeel k][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel145
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '145'
        hoofdstuk: VII
  - number: 152.d
    text: de aanvraag van rijbewijzen, waaronder de stand van zaken betreffende de aanvraag;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel152
  - number: 152.e
    text: |-
      verklaringen van vakbekwaamheid en verklaringen van nascholing ten behoeve van aanvragers van een rijbewijs die één
      van de volgende documenten overleggen:
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel152
  - number: 152.e.i
    text: |-
      een door de bevoegde autoriteit van een lidstaat van de Europese Gemeenschap overeenkomstig de richtlijn
      vakbekwaamheid bestuurders aan de aanvrager afgegeven geldige kwalificatiekaart bestuurder;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel152
  - number: 152.e.ii
    text: een buitenlands omwisselingscertificaat, dan wel
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel152
  - number: 152.e.iii
    text: een Nederlands omwisselingscertificaat.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel152
  - number: 153a
    text: |-
      Indien een rijbewijs dat op grond van [artikel 124, eerste lid, onderdeel d, van de wet][ref1] voor
      ongeldigverklaring in aanmerking komt, niet ongeldig kan worden verklaard omdat het zijn geldigheid heeft verloren
      door het verstrijken van de geldigheidsduur, plaatst het CBR in het rijbewijzenregister een aantekening waaruit
      blijkt dat de houder bij de aanvraag van een nieuw rijbewijs een verklaring van geschiktheid dient over te leggen
      voor iedere rijbewijscategorie waarop de aantekening betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel124
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel153a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '124'
  - number: 153b
    text: |-
      Indien een rijbewijs dat op grond van [artikel 132, tweede lid, van de wet][ref1] voor ongeldigverklaring
      in aanmerking komt, niet ongeldig kan worden verklaard omdat het zijn geldigheid heeft verloren door het
      verstrijken van de geldigheidsduur, plaatst het CBR in het rijbewijzenregister een aantekening waaruit
      blijkt dat de houder bij de aanvraag van een nieuw rijbewijs voor iedere rijbewijscategorie waarop het in
      [artikel 131, eerste lid, van de wet][ref2] bedoelde onderzoek betrekking had, al naar gelang de aard van het
      onderzoek hetzij een verklaring van rijvaardigheid en een verklaring van geschiktheid hetzij een verklaring van
      geschiktheid dient over te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel153b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '132'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '131'
  - number: 153c
    text: |-
      Indien een rijbewijs dat op grond van [artikel 134, tweede lid, van de wet](onbekend) voor ongeldigverklaring in
      aanmerking komt, niet ongeldig kan worden verklaard omdat het zijn geldigheid heeft verloren door het verstrijken
      van de geldigheidsduur, plaatst het CBR in het rijbewijzenregister een aantekening waaruit blijkt dat de houder
      bij de aanvraag van een nieuw rijbewijs voor iedere rijbewijscategorie waarvoor op grond van de uitslag van het in
      [artikel 131, eerste lid, van de wet](onbekend) bedoelde onderzoek aanleiding tot ongeldigverklaring bestond, al
      naar gelang de aard van het onderzoek hetzij een verklaring van rijvaardigheid en een verklaring van geschiktheid
      hetzij een verklaring van geschiktheid dient over te leggen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel153c
  - number: '154'
    text: |-
      Het in [artikel 129 van de wet][ref1] bedoelde reglement alsmede de wijziging en intrekking daarvan wordt voor een
      ieder ter inzage gelegd bij de Dienst Wegverkeer te Veendam alsmede bij de secretarie van iedere gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel129
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel154
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '129'
  - number: 154a
    text: |-
      De Dienst Wegverkeer verstrekt op verzoek van Onze Minister de gegevens uit het rijbewijzenregister die
      noodzakelijk zijn ter uitvoering van de in [artikel 7:6, eerste lid, onder a, van de Arbeidstijdenwet][ref1]
      genoemde taak.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel7
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel154a
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '7'
  - number: '155.1'
    text: |-
      Uit het rijbewijzenregister worden door de Dienst Wegverkeer aan de met de afgifte van rijbewijzen belaste
      autoriteiten in andere lidstaten van de Europese Gemeenschap en in andere staten die partij zijn bij de
      Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland inlichtingen verstrekt omtrent rijbewijzen
      waarvan de houder zich heeft gevestigd in de betrokken staat en aldaar om omwisseling heeft verzocht.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel155
  - number: '155.2'
    text: |-
      Uit het rijbewijzenregister worden door de Dienst Wegverkeer aan de met de afgifte van rijbewijzen belaste
      autoriteiten buiten Nederland, anders dan in een andere lid-staat van de Europese Gemeenschap of in een andere
      staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, inlichtingen
      verstrekt omtrent rijbewijzen waarvan de houder zich heeft gevestigd in Aruba, Curaçao, Sint Maarten of in de
      openbare lichamen Bonaire, Sint Eustatius en Saba of in de betrokken staat en aldaar om omwisseling heeft verzocht.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel155
  - number: 155a.1
    text: |-
      De Dienst Wegverkeer verstrekt informatie aan de met de afgifte van rijbewijzen of kwalificatiekaarten bestuurders
      belaste autoriteiten van andere lidstaten van de Europese Gemeenschap omtrent
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel155a
  - number: 155a.1.a
    text: |-
      in de vorm van een code op het rijbewijs vermelde getuigschriften van vakbekwaamheid of getuigschriften van
      nascholing;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel155a
  - number: 155a.1.b
    text: Nederlandse omwisselingscertificaten;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel155a
  - number: 155a.1.c
    text: bestuurdersattesten en
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel155a
  - number: 155a.1.d
    text: |-
      nationale certificaten, waarvan de houder zich heeft gevestigd in de betrokken staat en aldaar om omwisseling
      heeft verzocht. Daartoe verstrekken de aangewezen exameninstantie en de Stichting Nationale en Internationale
      Wegvervoerorganisatie gegevens aan de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel155a
  - number: 155a.2
    text: |-
      De Dienst Wegverkeer meldt de aangewezen exameninstantie de einddatum van in de vorm van een code op het rijbewijs
      vermelde getuigschriften van vakbekwaamheid en getuigschriften van nascholing.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel155a
  - number: '156'
    text: |-
      Uit het rijbewijzenregister worden door de Dienst Wegverkeer inlichtingen verstrekt aan de volgende
      belanghebbenden:
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156
  - number: 156.a
    text: degenen omtrent wie gegevens in het register zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156
  - number: 156.b
    text: |-
      het Centraal Bureau voor de Statistiek, voor statistische doeleinden, voor zover het betreft niet tot personen
      herleidbare informatie;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156
  - number: 156.c
    text: |-
      het Verbond van Verzekeraars en andere belanghebbenden, ten behoeve van het vaststellen van rechten en plichten
      in het kader van de uitvoering van verzekeringsovereenkomsten, voor zover het betreft de datum van afgifte en de
      geldigheid van rijbewijzen alsmede omtrent de categorie of categorieën van motorrijtuigen waarvoor rijbewijzen
      zijn afgegeven;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156
  - number: 156.d
    text: |-
      het Verbond van Verzekeraars, ten behoeve van het vaststellen van rechten en plichten in het kader van de
      uitvoering van verzekeringsovereenkomsten, voor zover het betreft de oplegging van de bijkomende straf van
      ontzegging van de bevoegdheid tot het besturen van motorrijtuigen;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156
  - number: 156.e
    text: |-
      personen werkzaam bij een postkantoor van Postkantoren BV voor zover zij de gegevens nodig hebben voor de afgifte
      van kentekenbewijzen en voor zover het betreft gegevens omtrent de geldigheid van rijbewijzen;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156
  - number: 156.f
    text: |-
      voertuigbedrijven voor zover het de verificatie van als identiteitsdocument aan het bedrijf getoonde rijbewijzen
      betreft ter bescherming van het eigendom van het bedrijf in het kader van de verhuur van de voertuigen van het
      bedrijf alsmede voor zover zij de gegevens nodig hebben voor de afgifte van kentekenbewijzen;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156
  - number: 156.g
    text: |-
      instellingen als bedoeld in
      [artikel 1, eerste lid, onderdeel a, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref1],
      voor zover het betreft gegevens omtrent de geldigheid van rijbewijzen;


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '1'
  - number: 156.h
    text: |-
      personen en instanties aan wie de desbetreffende rijbewijzen worden getoond op grond van een wettelijke
      identificatieplicht, voor zover het betreft gegevens omtrent de geldigheid van rijbewijzen;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156
  - number: 156.i
    text: |-
      het Meldpunt ongebruikelijke transacties, bedoeld in de
      [Wet ter voorkoming van witwassen en financieren van terrorisme][ref1], voor zover het betreft de gegevens, bedoeld
      in [artikel 145, onderdelen a, b, c en d][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0024282
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel145
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0024282
      - id: ref2
        bwb_id: BWBR0008074
        artikel: '145'
        hoofdstuk: VII
  - number: 156.j
    text: |-
      overige belanghebbenden voor zover deze de gegevens gebruiken voor statistische doeleinden en slechts nadat
      de gegevens door de Dienst Wegverkeer zijn ontdaan van alle elementen die de gegevens herleidbaar maken tot
      individuele personen;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156
  - number: 156.k
    text: overige door Onze Minister aangewezen belanghebbenden ten behoeve van het bij de aanwijzing aangegeven doel.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156
  - number: 156a.1
    text: |-
      Verklaringen van vakbekwaamheid en verklaringen van nascholing worden op aanvraag en tegen betaling van het
      daarvoor vastgestelde tarief door de aangewezen exameninstantie in het rijbewijzenregister geregistreerd ten
      behoeve van een ieder die de basiskwalificatie heeft behaald dan wel de nascholing heeft afgerond.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156a
  - number: 156a.2
    text: |-
      Nederlandse omwisselingscertificaten worden op aanvraag en tegen betaling van het daarvoor vastgestelde tarief
      door de aangewezen exameninstantie afgegeven aan een ieder die de basiskwalificatie heeft behaald dan wel de
      nascholing heeft afgerond en deze op een in een andere lidstaat van de Europese Gemeenschap af te geven rijbewijs
      of kwalificatiekaart bestuurder wil laten vermelden.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156a
  - number: 156a.3
    text: |-
      Deelcertificaten worden op aanvraag en tegen betaling van het daarvoor vastgestelde tarief door de aangewezen
      exameninstantie afgegeven aan een ieder die een nascholingsonderdeel heeft gevolgd en de nascholing in een andere
      lidstaat van de Europese Gemeenschap wil afronden.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156a
  - number: 156a.4
    text: |-
      In afwijking van het eerste lid worden verklaringen van vakbekwaamheid en verklaringen van nascholing tegen
      overlegging van een door de bevoegde autoriteit van een lidstaat van de Europese Gemeenschap overeenkomstig de
      richtlijn vakbekwaamheid bestuurders aan de aanvrager afgegeven geldige kwalificatiekaart bestuurder dan wel een
      buitenlands omwisselingscertificaat door de Dienst Wegverkeer in het rijbewijzenregister geregistreerd.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156a
  - number: 156b.1
    text: |-
      Het voor de aanvraag van verklaringen van vakbekwaamheid, verklaringen van nascholing, Nederlandse
      omwisselingscertificaten of deelcertificaten verschuldigde tarief wordt vastgesteld door de aangewezen
      exameninstantie onder goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156b
  - number: 156b.2
    text: |-
      Het in het eerste lid bedoelde tarief dient vóór de indiening van de aanvraag te zijn voldaan door overmaking op
      een door de aangewezen exameninstantie aangewezen bankrekening.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156b
  - number: 156c.1
    text: 'De aangewezen exameninstantie is verantwoordelijk voor:'
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156c
  - number: 156c.1.a
    text: het ontwikkelen van de vakbekwaamheidsexamens met inbegrip van de exameneisen;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156c
  - number: 156c.1.b
    text: het afnemen van de vakbekwaamheidsexamens;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156c
  - number: 156c.1.c
    text: het periodiek vaststellen van het raamwerk van nascholingscursussen;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156c
  - number: 156c.1.d
    text: |-
      het voor het verrichten van nascholing erkennen van opleidingscentra en het certificeren van nascholingscursussen
      die door die opleidingscentra worden aangeboden;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156c
  - number: 156c.1.e
    text: het uitoefenen van toezicht op de erkende opleidingscentra;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156c
  - number: 156c.1.f
    text: het registreren van toetsresultaten;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156c
  - number: 156c.1.g
    text: het registreren van gevolgde nascholingsuren;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156c
  - number: 156c.1.h
    text: |-
      het registreren van verklaringen van vakbekwaamheid, verklaringen van nascholing en van Nederlandse
      omwisselingscertificaten in het rijbewijzenregister;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156c
  - number: 156c.1.i
    text: het uitreiken van Nederlandse omwisselingscertificaten;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156c
  - number: 156c.1.j
    text: het uitreiken van deelcertificaten;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156c
  - number: 156c.1.k
    text: |-
      het ongeldig verklaren van getuigschriften van vakbekwaamheid, getuigschriften van nascholing en Nederlandse
      omwisselingscertificaten.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156c
  - number: 156c.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld inzake de taken, bevoegdheden en werkwijze van de
      aangewezen exameninstantie.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156c
  - number: 156d.1
    text: |-
      De aanvraag van een verklaring van vakbekwaamheid, een verklaring van nascholing, een Nederlands
      omwisselingscertificaat of een deelcertificaat geschiedt op de door de aangewezen exameninstantie vastgestelde
      wijze.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156d
  - number: 156d.2
    text: |-
      De aanvraag van een verklaring van vakbekwaamheid dan wel een verklaring van nascholing als bedoeld in
      [artikel 156a, vierde lid][ref1], geschiedt op de door de Dienst Wegverkeer vastgestelde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel156a
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156d
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 156a
        hoofdstuk: VIIa
        paragraaf: '1'
  - number: 156d.3
    text: |-
      Bij de aanvraag raadpleegt de aangewezen exameninstantie dan wel de Dienst Wegverkeer de in de gemeentelijke
      basisadministratie persoonsgegevens ingeschreven persoonsgegevens van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156d
  - number: 156e
    text: 'Het stelsel van basiskwalificatie omvat:'
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156e
  - number: 156e.a
    text: een theorie-examen vakbekwaamheid bestaande uit drie toetsen, en
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156e
  - number: 156e.b
    text: een praktijkexamen vakbekwaamheid bestaande uit drie toetsen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156e
  - number: 156f.1
    text: |-
      Het theorie-examen vakbekwaamheid voor de rijbewijscategorieën C en E bij C kan slechts worden afgelegd door
      personen die de leeftijd van zeventien jaren hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156f
  - number: 156f.2
    text: |-
      Het theorie-examen vakbekwaamheid voor de rijbewijscategorieën D en E bij D kan slechts worden afgelegd door
      personen die de leeftijd van zeventien jaren hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156f
  - number: 156g
    text: |-
      Voor toelating tot het theorie-examen vakbekwaamheid zijn de voorwaarden voor toelating tot het theorie-examen voor
      de rijbewijscategorieën C of D van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156g
  - number: 156h.1
    text: |-
      Het theorie-examen vakbekwaamheid voor rijbewijscategorie C bestaat uit theorietoets rijbewijs en vakbekwaamheid 1,
      theorietoets vakbekwaamheid 2 en theorietoets vakbekwaamheid 3.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156h
  - number: 156h.2
    text: |-
      Bij het theorie-examen vakbekwaamheid voor de rijbewijscategorie C wordt getoetst of een aanvrager beschikt over
      grondige kennis van de onderwerpen die voor bestuurders van motorrijtuigen van die categorie zijn opgenomen in
      bijlage I van de richtlijn vakbekwaamheid bestuurders alsmede het op juiste wijze toepassen van die kennis.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156h
  - number: 156h.3
    text: |-
      De aanvrager die het theorie-examen vakbekwaamheid voor de rijbewijscategorie C met goed gevolg heeft afgelegd, is
      vrijgesteld van het theorie-examen voor rijbewijscategorie C.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156h
  - number: 156h.4
    text: |-
      De aanvrager die reeds beschikt over een geldig rijbewijs van de categorie C1, C of E bij C, verwerft het theorie-
      examen vakbekwaamheid voor rijbewijscategorie C door in aanvulling op dat rijbewijs met goed gevolg de bij
      ministeriële regeling vastgestelde onderdelen van dat theorie-examen af te leggen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156h
  - number: 156h.5
    text: |-
      De aanvrager die het theorie-examen vakbekwaamheid voor rijbewijscategorie D met goed gevolg heeft afgelegd,
      verwerft het theorie-examen vakbekwaamheid voor rijbewijscategorie C door met goed gevolg de bij ministeriële
      regeling vastgestelde additionele onderdelen af te leggen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156h
  - number: 156i.1
    text: |-
      Het theorie-examen vakbekwaamheid voor rijbewijscategorie D bestaat uit theorietoets rijbewijs en vakbekwaamheid 1,
      theorietoets vakbekwaamheid 2 en theorietoets vakbekwaamheid 3.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156i
  - number: 156i.2
    text: |-
      Bij het theorie-examen vakbekwaamheid voor de rijbewijscategorie D wordt getoetst of een aanvrager beschikt over
      grondige kennis van bij ministeriële regeling vastgestelde eisen omtrent de onderwerpen die voor bestuurders van
      motorrijtuigen van die categorie zijn opgenomen in bijlage I van de richtlijn vakbekwaamheid bestuurders alsmede
      het op juiste wijze toepassen van die kennis.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156i
  - number: 156i.3
    text: |-
      De aanvrager die het theorie-examen vakbekwaamheid voor de rijbewijscategorie D met goed gevolg heeft afgelegd, is
      vrijgesteld van het theorie-examen voor rijbewijscategorie D.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156i
  - number: 156i.4
    text: |-
      De aanvrager die reeds beschikt over een geldig rijbewijs van de categorie D1, D of E bij D, verwerft het theorie-
      examen vakbekwaamheid voor rijbewijscategorie D door in aanvulling op dat rijbewijs met goed gevolg de bij
      ministeriële regeling vastgestelde onderdelen van dat theorie-examen af te leggen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156i
  - number: 156i.5
    text: |-
      De aanvrager die het theorie-examen vakbekwaamheid voor rijbewijscategorie C met goed gevolg heeft afgelegd,
      verwerft het theorie-examen vakbekwaamheid voor rijbewijscategorie D door met goed gevolg de bij ministeriële
      regeling vastgestelde additionele onderdelen af te leggen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156i
  - number: 156j.1
    text: 'Het gedeelte van het praktijkexamen vakbekwaamheid dat niet op de openbare weg wordt afgelegd, kan worden afgelegd:'
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156j
  - number: 156j.1.a
    text: |-
      door personen die de leeftijd van zeventien jaren hebben bereikt indien het betreft een praktijkexamen
      vakbekwaamheid voor de rijbewijscategorieën C en E bij C, of
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156j
  - number: 156j.1.b
    text: |-
      door personen die de leeftijd van zeventien jaren hebben bereikt indien het betreft een praktijkexamen
      vakbekwaamheid voor de rijbewijscategorieën D en E bij D.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156j
  - number: 156j.2
    text: |-
      Het gedeelte van het praktijkexamen vakbekwaamheid dat op de openbare weg wordt afgelegd kan slechts worden
      afgelegd:
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156j
  - number: 156j.2.a
    text: |-
      door personen die de leeftijd van achttien jaren hebben bereikt indien het betreft een praktijkexamen
      vakbekwaamheid voor rijbewijscategorie C en E bij C, of
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156j
  - number: 156j.2.b
    text: |-
      door personen die de leeftijd van achttien jaar hebben bereikt indien het betreft een praktijkexamen vakbekwaamheid
      voor rijbewijscategorie D en E bij D.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156j
  - number: 156k.1
    text: |-
      Voor toelating tot het praktijkexamen vakbekwaamheid op de openbare weg zijn de voorwaarden voor toelating voor het
      praktijkexamen voor de rijbewijscategorieën C, E bij C, D of E bij D van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156k
  - number: 156k.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld inzake de toegang tot het praktijkexamen
      vakbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156k
  - number: 156l.1
    text: |-
      Het praktijkexamen vakbekwaamheid voor rijbewijscategorie C bestaat uit een rijproef die geïntegreerd wordt
      afgelegd met het praktijkexamen voor het rijbewijs C, en uit de praktijktoetsen vakbekwaamheid 1 en 2. De
      praktijktoets vakbekwaamheid 1 bestaat uit een praktische test. De praktijktoets vakbekwaamheid 2 kan op een
      besloten terrein of een simulator worden afgelegd.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156l
  - number: 156l.2
    text: |-
      De eisen voor het praktijkexamen vakbekwaamheid voor rijbewijscategorie C worden bij ministeriële regeling
      vastgesteld en betreffen in ieder geval:
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156l
  - number: 156l.2.a
    text: bedrevenheid in rationeel rijden op basis van veiligheidsvoorschriften;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156l
  - number: 156l.2.b
    text: |-
      het kunnen toepassen van voorschriften omtrent de onderwerpen die voor bestuurders van motorvoertuigen van die
      categorie zijn opgenomen in bijlage I van de richtlijn vakbekwaamheid bestuurders;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156l
  - number: 156l.2.c
    text: |-
      het op juiste en veilige wijze kunnen toepassen van kennis en vaardigheden met betrekking tot een aantal bijzondere
      onderwerpen die voor bestuurders van motorvoertuigen van die categorie zijn opgenomen in bijlage I van de richtlijn
      vakbekwaamheid bestuurders.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156l
  - number: 156l.3
    text: |-
      De aanvrager die reeds beschikt over een geldig rijbewijs van de categorie C1 of C, verwerft het praktijkexamen
      vakbekwaamheid voor rijbewijscategorie C door in aanvulling op dat rijbewijs met goed gevolg de bij ministeriële
      regeling vastgestelde onderdelen van dat praktijkexamen af te leggen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156l
  - number: 156m.1
    text: |-
      Het praktijkexamen vakbekwaamheid voor rijbewijscategorie D bestaat uit een rijproef die geïntegreerd wordt
      afgelegd met het praktijkexamen voor het rijbewijs D, en uit de praktijktoetsen vakbekwaamheid 2 en 3. De
      praktijktoets vakbekwaamheid 1 bestaat uit een praktische toets. De praktijktoets vakbekwaamheid 2 kan op een
      besloten terrein of een simulator worden afgelegd.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156m
  - number: 156m.2
    text: |-
      De eisen voor het praktijkexamen vakbekwaamheid voor rijbewijscategorie D worden bij ministeriële regeling
      vastgesteld en betreffen in ieder geval:
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156m
  - number: 156m.2.a
    text: bedrevenheid in rationeel rijden op basis van veiligheidsvoorschriften;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156m
  - number: 156m.2.b
    text: |-
      het kunnen toepassen van voorschriften omtrent de onderwerpen die voor bestuurders van motorvoertuigen van die
      categorie zijn opgenomen in bijlage I van de richtlijn vakbekwaamheid bestuurders;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156m
  - number: 156m.2.c
    text: |-
      het op juiste en veilige wijze kunnen toepassen van kennis en vaardigheden met betrekking tot een aantal bijzondere
      onderwerpen die voor bestuurders van motorvoertuigen van die categorie zijn opgenomen in bijlage I van de richtlijn
      vakbekwaamheid bestuurders.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156m
  - number: 156m.3
    text: |-
      De aanvrager die reeds beschikt over een geldig rijbewijs van de categorie D1 of D, verwerft het praktijkexamen
      vakbekwaamheid voor rijbewijscategorie D door in aanvulling op dat rijbewijs met goed gevolg de bij ministeriële
      regeling vastgestelde onderdelen van dat praktijkexamen af te leggen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156m
  - number: 156n.1
    text: |-
      De aangewezen exameninstantie kan een rij-instructeur die ingevolge de [Wet rijonderricht motorrijtuigen 1993][ref1]
      bevoegd is tot het geven van rijonderricht en die voldoet aan de door haar opgestelde eisen, aanwijzen tot het
      afnemen van praktijktoetsen vakbekwaamheid 1 en 2 voor de rijbewijscategorieën C en D.


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156n
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: 156n.2
    text: Een rij-instructeur als bedoeld in het eerste lid neemt de praktijktoetsen af met gebruikmaking van de exameneisen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156n
  - number: 156n.3
    text: |-
      Een rij-instructeur als bedoeld in het eerste lid meldt aan de aangewezen exameninstantie binnen de door deze
      vastgestelde termijn of een aanvrager voldoet aan de exameneisen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156n
  - number: 156o
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld ter uitvoering van de [artikelen 156g tot en met 156n][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel156g
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156o
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 156g
        hoofdstuk: VIIa
        paragraaf: '4'
  - number: 156p
    text: |-
      Op een praktijktoets vakbekwaamheid bedoeld in hoofdstuk VIIA zijn de [artikelen 78][ref1], [81][ref2],
      [82, eerste lid][ref3], en [84][ref4] van overeenkomstige toepassing met dien verstande dat in plaats van
      «rijproef» telkens wordt gelezen «praktijktoets vakbekwaamheid», en dat in [artikel 82, eerste lid][ref5], in
      plaats van «het CBR» wordt gelezen: de aangewezen exameninstantie.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel81
      [ref3]: https://wetten.overheid.nl/BWBR0008074#Artikel82
      [ref4]: https://wetten.overheid.nl/BWBR0008074#Artikel84
      [ref5]: https://wetten.overheid.nl/BWBR0008074#Artikel82
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156p
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '78'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0008074
        artikel: '81'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0008074
        artikel: '82'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0008074
        artikel: '84'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0008074
        artikel: '82'
        hoofdstuk: III
        paragraaf: '4'
  - number: 156q.1
    text: 'De volgende bestuurders zijn vrijgesteld van het behalen van een getuigschrift van vakbekwaamheid:'
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156q
  - number: 156q.1.a
    text: |-
      een bestuurder die houder is van een geldig rijbewijs van één van de categorieën D1, E bij D1, D of E bij D of van
      een als gelijkwaardig erkend rijbewijs, mits dat rijbewijs uiterlijk op 9 september 2008 is afgegeven;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156q
  - number: 156q.1.b
    text: |-
      een bestuurder die houder is van een geldig rijbewijs van één van de categorieën C1, E bij C1, C of E bij C of van
      een als gelijkwaardig erkend rijbewijs, mits dat rijbewijs uiterlijk op 9 september 2009 is afgegeven.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156q
  - number: 156q.2
    text: |-
      Een bestuurder als bedoeld in [artikel 151d, tweede lid, onderdeel a, van de wet][ref1] is bij het behalen van een
      getuigschrift van vakbekwaamheid vrijgesteld van het afleggen van bij ministeriële regeling te bepalen onderdelen
      van het vakbekwaamheidsexamen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151d
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156q
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 151d
  - number: 156q.3
    text: |-
      Een bestuurder als bedoeld in [artikel 151d, tweede lid, onderdeel b, van de wet][ref1] die een op het beroep van
      chauffeur goederenvervoer gerichte beroepsopleiding als bedoeld in de Wet educatie en beroepsonderwijs of een bij
      ministeriële regeling daaraan gelijkwaardig verklaarde opleiding volgt, is éénmaal voor een aaneengesloten periode
      van maximaal drie jaar voor Nederlands grondgebied vrijgesteld van de verplichting over een getuigschrift van
      vakbekwaamheid te beschikken indien hij:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151d
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156q
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 151d
  - number: 156q.3.a
    text: |-
      een door het bevoegd gezag van de opleiding gewaarmerkte verklaring kan overleggen waaruit blijkt sinds welke datum
      hij de opleiding volgt, en
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156q
  - number: 156q.3.b
    text: |-
      hij door middel van een geldig bewijs van inschrijving kan aantonen dat hij nog staat ingeschreven bij de
      opleiding.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156q
  - number: 156q.4
    text: |-
      Een bestuurder die houder is van een getuigschrift van vakbekwaamheid voor één van de in het eerste lid, onderdeel
      a, bedoelde rijbewijscategorieën is vrijgesteld van de verplichting een dergelijk getuigschrift te behalen voor de
      overige in genoemd onderdeel vermelde rijbewijscategorieën.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156q
  - number: 156q.5
    text: |-
      Een bestuurder die houder is van een getuigschrift van vakbekwaamheid voor één van de in het eerste lid, onderdeel
      b, bedoelde rijbewijscategorieën is vrijgesteld van de verplichting een dergelijk getuigschrift te behalen voor de
      overige in genoemd onderdeel vermelde rijbewijscategorieën.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156q
  - number: 156q.6
    text: |-
      Een bestuurder, geboren vóór 1 juli 1955, is vrijgesteld van de verplichting een getuigschrift van vakbekwaamheid
      te behalen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156q
  - number: 156q.7
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de vrijstelling bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156q
  - number: 156r.1
    text: |-
      Het stelsel van nascholing, bedoeld in [hoofdstuk VIIA van de wet][ref1], bevat de verplichting van de bestuurder
      om bij een of meer erkende opleidingscentra per vijf jaren 35 uur nascholingscursussen te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukVIIA
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156r
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: VIIA
  - number: 156r.2
    text: |-
      Voor bestuurders bedoeld in [artikel 156q, eerste lid][ref1], wordt de periode waarin de eerste nascholing kan
      worden gevolgd verlengd tot zeven jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel156q
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156r
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 156q
        hoofdstuk: VIIa
        paragraaf: '6'
  - number: 156s.1
    text: |-
      De nascholing bestaat uit nascholingscursussen die worden aangeboden in eenheden van ten minste 7 uur, waarin de
      onderwerpen die zijn opgenomen in bijlage I van de richtlijn vakbekwaamheid bestuurders opnieuw worden bestudeerd
      en uitgediept.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156s
  - number: 156s.2
    text: |-
      Het raamwerk van nascholingscursussen wordt periodiek vastgesteld door de aangewezen exameninstantie, die daarbij
      rekening houdt met de bij ministeriële regeling vastgestelde eisen voor nascholingscursussen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156s
  - number: 156s.3
    text: Bij de nascholingscursussen kan gebruik worden gemaakt van simulatoren.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156s
  - number: 156t.1
    text: |-
      Een bestuurder die tegen overlegging van bewijsstukken, afgegeven door bevoegde autoriteiten van andere lidstaten
      van de Europese Gemeenschap, ten genoegen van de aangewezen exameninstantie kan aantonen dat hij een gedeelte
      van de nascholing aldaar heeft gevolgd, kan het voor hem nog resterende gedeelte van de nascholing in Nederland
      afronden.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156t
  - number: 156t.2
    text: |-
      De aangewezen exameninstantie kan bij de toetsing van de in het eerste lid bedoelde bewijsstukken de hulp van de
      Dienst Wegverkeer inroepen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156t
  - number: 156t.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld inzake de toekenning van de nascholing.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156t
  - number: 156u.1
    text: |-
      Een erkend opleidingscentrum meldt binnen de door de aangewezen exameninstantie vastgestelde termijn voorafgaand
      aan de dag waarop een nascholingscursus wordt gehouden de voorgenomen cursus aan de aangewezen exameninstantie. De
      melding bevat de door de aangewezen exameninstantie bepaalde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156u
  - number: 156u.2
    text: |-
      Een erkend opleidingscentrum meldt binnen de door de aangewezen exameninstantie vastgestelde termijn aan deze het
      feit dat een bestuurder een nascholingsonderdeel heeft gevolgd.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156u
  - number: 156v.1
    text: |-
      Een bestuurder die houder is van een getuigschrift van nascholing voor één van de rijbewijscategorieën C, C1, D,
      D1, E bij C, E bij C1, E bij D of E bij D1 is vrijgesteld van de verplichting een getuigschrift van nascholing te
      behalen voor de overige genoemde rijbewijscategorieën.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156v
  - number: 156v.2
    text: |-
      Een bestuurder, geboren vóór 1 juli 1955, is vrijgesteld van de verplichting een getuigschrift van nascholing te
      behalen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156v
  - number: 156w.1
    text: |-
      De aangewezen exameninstantie kan aan een natuurlijke persoon of rechtspersoon een erkenning verlenen waardoor deze
      gerechtigd is nascholing te organiseren.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156w
  - number: 156w.2
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden vastgesteld die aan een erkenning worden verbonden en kunnen
      met betrekking tot die voorschriften regels worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156w
  - number: 156x.1
    text: |-
      Een erkenning als opleidingscentrum voor het verrichten van nascholing wordt op aanvraag en tegen betaling, op de
      door de aangewezen exameninstantie vastgestelde wijze, van het daarvoor door deze instantie vastgestelde tarief
      verleend indien is voldaan aan de bij ministeriële regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156x
  - number: 156x.2
    text: 'De in het eerste lid bedoelde eisen kunnen onder meer betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156x
  - number: 156x.2.a
    text: de certificering van de aangeboden nascholingscursussen;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156x
  - number: 156x.2.b
    text: de kwalificaties en werkterreinen van de nascholingsdocenten en -instructeurs;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156x
  - number: 156x.2.c
    text: de cursuslocaties;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156x
  - number: 156x.2.d
    text: het voor het praktijkgedeelte gebruikte wagenpark, en
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156x
  - number: 156x.2.e
    text: de omvang van het aantal deelnemers per nascholingscursus.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156x
  - number: 156x.3
    text: Een erkenning heeft een geldigheidsduur van maximaal vijf jaren.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156x
  - number: 156x.4
    text: |-
      Een erkenning als bedoeld in het eerste lid kan door de aangewezen exameninstantie worden geschorst of ingetrokken
      indien:
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156x
  - number: 156x.4.a
    text: de handelingen waarvoor de erkenning is verleend, niet meer worden verricht, of
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156x
  - number: 156x.4.b
    text: niet meer aan de in het tweede lid bedoelde eisen wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156x
  - number: 156x.5
    text: |-
      Bij ministeriële regeling kunnen nadere eisen worden vastgesteld met betrekking tot de aanvraag, schorsing en
      intrekking van een erkenning.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156x
  - number: 156y.1
    text: |-
      Degene die in het kader van [hoofdstuk VIIA van de wet][ref1] onderricht verricht anders dan rijonderricht bedoeld
      in de [Wet rijonderricht motorrijtuigen 1993][ref2], dan wel in het kader van [dat hoofdstuk][ref3] betrokken is
      bij de training, instructie of scholing van bestuurders, voldoet aan:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukVIIA
      [ref2]: https://wetten.overheid.nl/BWBR0006073
      [ref3]: https://wetten.overheid.nl/BWBR0006622#HoofdstukVIIA
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156y
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: VIIA
      - id: ref2
        bwb_id: BWBR0006073
      - id: ref3
        bwb_id: BWBR0006622
        hoofdstuk: VIIA
  - number: 156y.1.a
    text: de eisen die zijn opgenomen in onderdeel 5.2.3 van bijlage I van de richtlijn vakbekwaamheid bestuurders, en
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156y
  - number: 156y.1.b
    text: de bij ministeriële regeling bepaalde eisen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156y
  - number: 156y.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld aan het toezicht op de in het eerste lid bedoelde
      personen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156y
  - number: 156z
    text: |-
      Indien bij een praktijkexamen vakbekwaamheid of bij een nascholingscursus gebruik wordt gemaakt van een simulator
      voldoet deze aan de door de aangewezen exameninstantie gestelde en door Onze Minister goedgekeurde eisen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156z
  - number: 156aa.1
    text: |-
      Indien de aanvrager naar het oordeel van de aangewezen exameninstantie de basiskwalificatie heeft behaald,
      registreert de aangewezen exameninstantie in het rijbewijzenregister ten behoeve van de aanvrager een verklaring
      van vakbekwaamheid voor de rijbewijscategorieën waarvoor de aanvrager de basiskwalificatie heeft behaald.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156aa
  - number: 156aa.2
    text: |-
      Nadat uit de in [artikel 156u][ref1] bedoelde meldingen is gebleken dat een bestuurder de nascholing heeft
      afgerond, registreert de aangewezen exameninstantie ten behoeve van de aanvrager in het rijbewijzenregister een
      verklaring van nascholing.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel156u
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156aa
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 156u
        hoofdstuk: VIIa
        paragraaf: '7'
  - number: 156aa.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de in dit artikel bedoelde
      registraties en meldingen.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156aa
  - number: 156ab.1
    text: |-
      Een getuigschrift van vakbekwaamheid behaald voor één van de rijbewijscategorieën C1, E bij C1, C of E bij C wordt
      op het rijbewijs tevens vermeld naast alle andere van deze categorieën voor zover de desbetreffende bestuurder
      daarover beschikt.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156ab
  - number: 156ab.2
    text: |-
      Een getuigschrift van vakbekwaamheid behaald voor één van de rijbewijscategorieën D1, E bij D1, D of E bij D wordt
      op het rijbewijs tevens vermeld naast alle andere van deze categorieën voor zover de desbetreffende bestuurder
      daarover beschikt.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156ab
  - number: 156ab.3
    text: |-
      Een getuigschrift van nascholing behaald voor de rijbewijscategorieën C1, E bij C1, C, E bij C, D1, E bij D1, D of
      E bij D wordt op het rijbewijs tevens vermeld naast alle andere categorieën waarvoor de desbetreffende bestuurder
      over een getuigschrift van vakbekwaamheid beschikt.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156ab
  - number: 156ab.4
    text: Een Nederlands omwisselingscertificaat geeft aan
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156ab
  - number: 156ab.4.a
    text: voor welke rijbewijscategorieën een bestuurder de basiskwalificatie heeft behaald of
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156ab
  - number: 156ab.4.b
    text: dat de bestuurder de nascholing heeft afgerond.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156ab
  - number: 156ac
    text: |-
      Voor de toepassing van hoofdstuk VIIA wordt met een geldig rijbewijs van de rijbewijscategorieën C1, E bij C1, C, E
      bij C, D1, E bij D1, D of E bij D gelijkgesteld een geldig rijbewijs, afgegeven door het daartoe bevoegde gezag in
      een andere lidstaat van de Europese Gemeenschap, in een andere staat die partij is bij de Overeenkomst betreffende
      de Europese Economische Ruimte of in Zwitserland.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156ac
  - number: 156ad
    text: |-
      Een wijziging van bijlage I van de richtlijn vakbekwaamheid bestuurders gaat voor de toepassing van hoofdstuk VIIA
      gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel156ad
  - number: '168'
    text: |-
      De Dienst Wegverkeer is verantwoordelijke voor de verwerking van persoonsgegevens in het kader van het register
      betreffende de afgifte van bromfietscertificaten.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel168
  - number: '169'
    text: 'In het register betreffende de afgifte van bromfietscertificaten worden de navolgende gegevens verwerkt:'
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel169
  - number: 169.a
    text: |-
      geslachtsnaam, voorvoegsels, voorletters, plaats en datum en eventueel land van geboorte van degenen aan wie een
      bromfietscertificaat is afgegeven;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel169
  - number: 169.b
    text: adres van degenen aan wie een bromfietscertificaat is afgegeven, zoals dat bekend was ten tijde van de afgifte;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel169
  - number: 169.c
    text: nummer en datum van afgifte van bromfietscertificaten;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel169
  - number: 169.d
    text: gegevens omtrent de ongeldigverklaring van bromfietscertificaten.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel169
  - number: '170'
    text: |-
      Het CBR verwerkt in het rijbewijzenregister gegevens omtrent de afgifte van bromfietscertificaten alsmede omtrent
      de ongeldigverklaring van bromfietscertificaten.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel170
  - number: '172'
    text: |-
      Het in [artikel 145 van de wet][ref1] bedoelde reglement alsmede de wijziging en intrekking daarvan wordt voor een
      ieder ter inzage gelegd bij de Dienst Wegverkeer te Veendam alsmede bij de vestigingen van het CBR.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel145
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '145'
  - number: '173'
    text: |-
      Uit het register betreffende de afgifte van bromfietscertificaten worden door de Dienst Wegverkeer inlichtingen
      verstrekt aan de volgende belanghebbenden:
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel173
  - number: 173.a
    text: degenen omtrent wie gegevens in het register zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel173
  - number: 173.b
    text: het CBR;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel173
  - number: 173.c
    text: |-
      het Centraal Bureau voor de Statistiek, voor statistische doeleinden, voor zover het betreft niet tot personen
      herleidbare informatie;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel173
  - number: 173.d
    text: |-
      het Verbond van Verzekeraars, ten behoeve van het vaststellen van rechten en plichten in het kader van de
      uitvoering van verzekeringsovereenkomsten, voor zover het betreft de datum van afgifte van bromfietscertificaten;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel173
  - number: 173.e
    text: overige door Onze Minister aangewezen belanghebbenden ten behoeve van het bij de aanwijzing aangegeven doel.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel173
  - number: 173a.1
    text: |-
      Er wordt een experiment gehouden waarbij de minimumleeftijd voor het besturen van motorrijtuigen van
      rijbewijscategorie D wordt verlaagd.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel173a
  - number: 173a.2
    text: |-
      Het experiment beoogt een vermindering van het tekort aan buschauffeurs onder voorwaarde van gelijkblijvende
      verkeersveiligheid.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel173a
  - number: 173a.3
    text: |-
      Het experiment vindt plaats overeenkomstig de bepalingen van [hoofdstuk VIIIa][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008074#HoofdstukVIIIa
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel173a
    references:
      - id: ref1
        bwb_id: BWBR0008074
        hoofdstuk: VIIIa
  - number: 173b.1
    text: |-
      De in [artikel 110, eerste lid, van de wet][ref1] vastgestelde minimumleeftijd van eenentwintig jaren voor het
      besturen van motorrijtuigen van de rijbewijscategorie D geldt niet indien:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel110
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel173b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '110'
  - number: 173b.1.a
    text: de bestuurder de leeftijd van achttien jaren heeft bereikt,
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel173b
  - number: 173b.1.a.I
    text: voor zover het vervoer betreft zonder passagiers;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel173b
  - number: 173b.1.a.II
    text: voor zover het openbaar en besloten vervoer betreft waarvan het traject ten hoogste 50 km bedraagt; of
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel173b
  - number: 173b.1.b
    text: de bestuurder de leeftijd van twintig jaren heeft bereikt voor zover het openbaar en besloten vervoer betreft; en
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel173b
  - number: 173b.1.c
    text: de bestuurder beschikt over het getuigschrift van vakbekwaamheid voor rijbewijscategorie D;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel173b
  - number: 173b.1.d
    text: het vervoer in Nederland plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel173b
  - number: 173b.1.e
    text: |-
      de bestuurder beschikt over een arbeidsovereenkomst met een busvervoerder, niet zijnde een uitleenovereenkomst als
      bedoeld in [artikel 690 van Boek 7 van het Burgerlijk Wetboek][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel690
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel173b
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '690'
  - number: 173b.1.f
    text: de bestuurder een begeleidingstraject volgt.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel173b
  - number: 173b.2
    text: Onze Minister verstrekt de bestuurder die deelneemt aan het experiment een bewijs van deelname.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel173b
  - number: 173b.3
    text: 'Onze Minister trekt een bewijs van deelname in indien:'
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel173b
  - number: 173b.3.a
    text: |-
      een bewijs van deelname is afgegeven op grond van door de aanvrager verschafte onjuiste gegevens en het niet zou
      zijn afgegeven indien de onjuistheid van die gegevens ten tijde van de aanvraag bekend zou zijn geweest;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel173b
  - number: 173b.3.b
    text: na afgifte van het bewijs van deelname blijkt dat het kennelijk abusievelijk aan de houder is afgegeven;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel173b
  - number: 173b.3.c
    text: niet meer wordt voldaan aan de voorwaarden, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel173b
  - number: 173c
    text: |-
      In afwijking van [artikel 67, zesde lid][ref1], wordt voor de toepassing van artikel 67, derde lid, met een
      rijbewijs B gelijkgesteld een in het rijbewijzenregister geregistreerde verklaring van rijvaardigheid voor de
      rijbewijscategorie B, waarbij de datum van registratie niet langer dan drie jaar vóór het examen mag liggen, voor
      zover de aanvraag betrekking heeft op de rijbewijscategorie D en de aanvrager een op het beroep van chauffeur
      personenvervoer gerichte beroepsopleiding als bedoeld in de [Wet educatie en beroepsonderwijs][ref2] volgt.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel173c
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '67'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0007625
  - number: 173d.1
    text: |-
      Het is degene die rijonderricht in de zin van de [Wet rijonderricht motorrijtuigen 1993][ref1] geeft, verboden
      zodanig rijonderricht te geven indien degene aan wie rijonderricht wordt gegeven voor zover het betreft
      motorrijtuigen die zijn ingericht voor het vervoer van meer dan acht personen, de bestuurder daaronder niet
      begrepen, de leeftijd van achttien jaren nog niet heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel173d
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: 173d.2
    text: |-
      De in [artikel 110b, eerste lid, onderdeel b, van de wet][ref1] vervatte eis dat degene aan wie rijonderricht
      wordt gegeven, de leeftijd van eenentwintig jaren heeft bereikt, geldt niet voor zover degene aan wie rijonderricht
      wordt gegeven een opleiding volgt tot beroepschauffeur in het personenvervoer over de weg in het kader van de Wet
      educatie en beroepsonderwijs en de leeftijd van zeventien jaren heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel110b
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel173d
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 110b
  - number: 173e
    text: |-
      In afwijking van [artikel 34][ref1] is ten behoeve van de aanvrager in het rijbewijzenregister tevens
      geregistreerd een verklaring van vakbekwaamheid voor rijbewijscategorie D indien nog niet eerder een rijbewijs
      is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel34
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel173e
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '34'
        hoofdstuk: II
        paragraaf: '2'
  - number: 173f
    text: |-
      In afwijking van [artikel 111, eerste lid, onderdeel a, van de wet][ref1] wordt een rijbewijs met code
      vakbekwaamheid op aanvraag en tegen betaling van het daarvoor vastgestelde tarief, afgegeven aan diegene die de
      leeftijd van achttien jaren heeft bereikt voor zover het betreft een rijbewijs voor het besturen van motorrijtuigen
      van de rijbewijscategorie D.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel111
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel173f
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '111'
  - number: 173g
    text: |-
      Het rijbewijs dat overeenkomstig [artikel 173f][ref1] is afgegeven, is gedurende de periode dat de houder de
      leeftijd van eenentwintig jaren nog niet heeft bereikt, voor de rijbewijscategorie D slechts geldig in Nederland in
      combinatie met een aan de houder van het rijbewijs afgegeven bewijs van deelname.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel173f
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel173g
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 173f
        hoofdstuk: VIIIa
        paragraaf: '2'
  - number: 173h
    text: |-
      Onze Minister van Verkeer en Waterstaat zendt drie jaar na de inwerkingtreding van deze algemene maatregel van
      bestuur en ten minste zes maanden voor de beëindiging van het experiment aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van dit besluit in de praktijk.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel173h
  - number: '174'
    text: |-
      Aanvragen van rijbewijzen die betrekking hebben op de afgifte van een rijbewijs tegen overlegging van een op basis
      van de Wegenverkeerswet aan de aanvrager afgegeven rijbewijs dat na 30 juni 1985 zijn geldigheid heeft verloren
      door het verstrijken van de geldigheidsduur en dat behoort tot een bij ministeriële regeling aangewezen model,
      dienen:
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel174
  - number: 174.a
    text: |-
      indien de aanvrager woonachtig is in Nederland, te zijn gericht tot de Dienst Wegverkeer en te worden ingediend bij
      de burgemeester van de gemeente waar de aanvrager woonachtig is;
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel174
  - number: 174.b
    text: |-
      indien de aanvrager niet in Nederland woonachtig is, te zijn gericht tot en te worden ingediend bij de Dienst
      Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel174
  - number: '178'
    text: |-
      Voor de toepassing van [artikel 9, eerste lid, onderdeel d][ref1], wordt onder een rijbewijs B mede verstaan een
      op basis van de Wegenverkeerswet afgegeven rijbewijs B dat op het moment van de aanvraag na 30 juni 1985 zijn
      geldigheid heeft verloren door het verstrijken van de geldigheidsduur en dat niet behoort tot een bij ministeriële
      regeling aangewezen model.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel9
    url: https://wetten.overheid.nl/BWBR0008074/2011-01-01#Artikel178
