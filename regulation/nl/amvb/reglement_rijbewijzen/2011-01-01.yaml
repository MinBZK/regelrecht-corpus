  - number: '184.1'
    text: |-
      Voor de toepassing van de [artikelen 36][ref1], [43][ref2] en [59, derde lid][ref3], wordt onder een eerder aan de
      aanvrager afgegeven rijbewijs mede verstaan een eerder op basis van de Wegenverkeerswet aan de aanvrager afgegeven
      rijbewijs dat op het moment van de aanvraag na 30 juni 1985 zijn geldigheid heeft verloren door het verstrijken van
      de geldigheidsduur en dat niet behoort tot een bij ministeriële regeling aangewezen model.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel43
