preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onzen Minister van Waterstaat van 31 December 1924, La. X, afdeeling Spoorwegen;

    Gelet op de wet van 1 November 1924 (Staatsblad n°. 498);

    Den Raad van State gehoord (advies van 20 Januari 1925, n°. 26);

    Gezien het nader rapport van Onzen Minister voornoemd van 2 Februari 1925, n°. 391, afdeeling Spoorwegen;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0001922/1998-01-01#ArtikelAanhef
articles:
  - number: I
    text: 'Vast te stellen het volgende:'
    url: https://wetten.overheid.nl/BWBR0001922/1998-01-01#ArtikelI
  - number: '1'
    text: |-
      1 De spoorstaven moeten zoodanig met elkander verbonden zijn, dat de electrische weerstand van het spoor door de
      lasschen gemiddeld met niet meer dan 25 pct. verhoogd wordt.

      2 De weerstand van 1 Meter spoorstaaf, waarin een lasch voorkomt, mag niet hooger zijn dan die van 10 Meter
      spoorstaaf van gelijke doorsnede zonder lasch.

      3 Het eerste en tweede lid zijn niet van toepassing op wissels, kruisingen en dergelijke deelen.
    url: https://wetten.overheid.nl/BWBR0001922/1998-01-01#Artikel1
  - number: '2'
    text: |-
      1 De beide spoorstaven van een spoor moeten onderling in deugdelijke electrische verbinding staan door middel van
      stroomgeleiders, welke geen grooteren onderlingen afstand dan 10 spoorstaaflengten hebben. Deze dwarsverbindingen
      mogen, wanneer zij op den grootsten toegelaten afstand aangebracht worden, geen grooteren weerstand dan 0,5 milli-
      Ohm per Meter hebben. Is hun aantal grooter, dan mag de weerstand per Meter naar verhouding grooter zijn.

      2 Naast elkander gelegen sporen, waarvan de hartafstand 4 Meter of minder bedraagt, moeten worden verbonden door
      overeenkomstige dwarsverbindingen, welke echter bij vorengenoemde electrische weerstanden den dubbelen afstand
      mogen hebben.

      3 Soortgelijke electrische verbindingen moeten worden aangebracht ter overbrugging van spoorstaafkruisingen en
      wissels, voor zoover deze niet uit één stuk bestaan. Bestaan zij uit één stuk en zijn zij niet overbrugd, dan
      moeten zij door middel van laschverbindingen, als bedoeld in artikel 1, met de aansluitende spoorstaven worden
      verbonden.
    url: https://wetten.overheid.nl/BWBR0001922/1998-01-01#Artikel2
  - number: '3'
    text: |-
      Ter verzekering van eene deugdelijke electrische verbinding bij draaischijven, beweegbare bruggen en dergelijke
      werken moeten deze worden overbrugd door één of meer geïsoleerde stroomgeleiders. Deze moeten eene zoodanige
      doorsnede hebben, dat het spanningsverlies in deze geleidingen bij gemiddelde jaarbelasting niet meer bedraagt dan
      5 milli-Volt per Meter, met dien verstande, dat zij geen grooteren weerstand mogen hebben dan de geleiders, genoemd
      in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001922#Artikel2
    url: https://wetten.overheid.nl/BWBR0001922/1998-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001922
        artikel: '2'
  - number: '4'
    text: |-
      1 Voor de terugleiding van den stroom mogen behalve de spoorstaven alleen gebezigd worden van de aarde geïsoleerde
      leidingen. De aansluitingen van deze geïsoleerde leidingen aan de spoorstaven mogen over eene lengte van ten
      hoogste 3 Meter blank uitgevoerd worden.

      2 Het eerste lid is niet van toepassing op aan de spoorstaven aangesloten aardingsleidingen van palen,
      bliksemafleiders en dergelijke.

      3 Blanke aan de spoorstaven aangesloten leidingen mogen niet dieper dan 25 c.M. in den bodem of beneden het
      ondervlak der bestrating zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0001922/1998-01-01#Artikel4
  - number: '5'
    text: |-
      Het spanningsverschil tusschen twee willekeurig gekozen punten van de spoorstaven mag bij de gemiddelde
      jaarbelasting niet meer dan 2 Volt/K.M. bedragen. In bijzondere gevallen kan Onze Minister voornoemd het
      geoorloofde spanningsverschil verlagen tot 1 Volt/K.M.
    url: https://wetten.overheid.nl/BWBR0001922/1998-01-01#Artikel5
  - number: '6'
    text: |-
      1 De lasschen moeten in die gedeelten van het spoor, waar het spanningsverschil bij de gemiddelde jaarbelasting
      meer bedraagt dan drie vierden van het volgens [artikel 5][ref1] toegelaten maximum, jaarlijks en overigens ten
      minste éénmaal per drie jaar gecontroleerd worden.

      2 Van de uitkomsten der onderzoekingen wordt in een register aanteekening gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0001922#Artikel5
    url: https://wetten.overheid.nl/BWBR0001922/1998-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001922
        artikel: '5'
  - number: '7'
    text: |-
      1 Ingeval spoor- of tramwegen elkander kruisen of elkander naderen tot een hartafstand tusschen de sporen van
      4 Meter of minder, moeten de sporen, hetzij overeenkomstig [artikel 2][ref1] met elkander verbonden, hetzij van
      elkander geïsoleerd worden, ter beoordeeling van Onzen Minister voornoemd.

      2 In het eerste geval moeten zoowel elke spoor- of tramweg afzonderlijk als beide te zamen aan de voorschriften van
      dit reglement voldoen. Indien tusschen partijen omtrent de uitvoering geen overeenstemming wordt verkregen, beslist
      Onze Minister voornoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0001922#Artikel2
    url: https://wetten.overheid.nl/BWBR0001922/1998-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001922
        artikel: '2'
  - number: '8'
    text: |-
      Overtreding van enige bepaling van de [artikelen 1][ref1] tot en met [7][ref2] is een strafbaar feit als bedoeld
      in artikel 4, eerste lid, van de wet van 1 november 1924 (*Stb.* 498) houdende wettelijke maatregelen tegen
      aantasting van metalen voorwerpen in de bodem door zwerfstromen, afkomstig van de spoorstaven van elektrische
      spoor- en tramwegen;

      a. indien zij door bestuurders van een spoor- of tramwegdienst wordt gepleegd, of een spoorweg, als bedoeld bij
      [artikel 6 der Locaalspoor- en Tramwegwet][ref3], betreft;

      b. indien zij door beambten of bedienden van een spoor- of tramwegdienst wordt gepleegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001922#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001922#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0001866#Artikel6
    url: https://wetten.overheid.nl/BWBR0001922/1998-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001922
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001922
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0001866
        artikel: '6'
  - number: '9'
    text: |-
      Met de opsporing van de overtredingen van dit reglement zijn belast de ambtenaren, bedoeld in
      [artikel 10 van de Spoorwegwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel10
    url: https://wetten.overheid.nl/BWBR0001922/1998-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '10'
  - number: '10'
    text: |-
      1 Ten aanzien van spoor- en tramwegen of gedeelten daarvan, welke buiten openbare wegen zijn aangelegd, en waarvan
      de spoorstaven op houten, niet geheel door het ballastbed bedekte dwarsliggers zijn bevestigd, is van dit reglement
      alleen [artikel 1, eerste lid][ref1], van toepassing.

      2 Niettemin is dit reglement in zijn geheel van toepassing ten aanzien van kruisingen op gelijke hoogte met
      openbare wegen en van baanvakken met anderen bovenbouw dan in het eerste lid bedoeld, alsmede over afstanden van
      50 Meter aan weerskanten van deze kruisingen en baanvakken, voor zooveel niet door plaatselijke maatregelen eene
      isolatie is verkregen, welke naar het oordeel van Onzen Minister voornoemd, ten minste gelijke waarde heeft als
      die, verkregen bij den in het eerste lid bedoelden bovenbouw.


      [ref1]: https://wetten.overheid.nl/BWBR0001922#Artikel1
    url: https://wetten.overheid.nl/BWBR0001922/1998-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001922
        artikel: '1'
  - number: '11'
    text: |-
      1 Onze Minister voornoemd kan onder door hem te stellen voorwaarden geheel of gedeeltelijk ontheffing verleenen van
      bepalingen van dit reglement.

      2 Ten aanzien van spoor- en tramwegen, waarop bij het in werking treden van dit reglement de dienst wordt
      uitgeoefend, kan Onze Minister voornoemd onder door hem te stellen voorwaarden toestaan, dat de toepasselijkheid
      van dit reglement zal aanvangen op een door hem te bepalen later tijdstip.
    url: https://wetten.overheid.nl/BWBR0001922/1998-01-01#Artikel11
  - number: II
    text: |-
      te bepalen, dat de wet van 1 November 1924 (*Staatsblad* n°. 498) en het onder I bedoelde reglement in werking
      treden op 1 Juli 1925.
    url: https://wetten.overheid.nl/BWBR0001922/1998-01-01#ArtikelII
