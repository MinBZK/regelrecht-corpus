articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder de wet: de [Mededingingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008691
    url: https://wetten.overheid.nl/BWBR0031654/2012-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008691
  - number: '2'
    text: |-
      Een publiekrechtelijke rechtspersoon is in staat in een onderneming het beleid te bepalen in de zin van
      [artikel 25g, eerste lid, onder a, van de wet][ref1]:

      a. indien hij, al dan niet tezamen met een of meer andere publiekrechtelijke rechtspersonen, een bindende
      voordracht kan doen of kan laten doen voor de benoeming van meer dan de helft van de leden van het bestuur of het
      toezichthoudend orgaan van de rechtspersoon van de onderneming;

      b. indien de onderneming een dochtermaatschappij is in de zin van
      [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref2] van een rechtspersoon waarvoor onderdeel a van toepassing
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25g
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel24a
    url: https://wetten.overheid.nl/BWBR0031654/2012-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 25g
      - id: ref2
        bwb_id: BWBR0003045
        artikel: 24a
  - number: '3'
    text: |-
      De doorberekening van de integrale kosten van goederen of diensten, bedoeld in
      [artikel 25i, eerste lid, van de wet][ref1], geschiedt op grond van consequent toegepaste en objectief te
      rechtvaardigen bedrijfseconomische principes, met dien verstande dat de kosten worden berekend met toepassing van
      een stelsel van baten en lasten.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25i
    url: https://wetten.overheid.nl/BWBR0031654/2012-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 25i
  - number: '4'
    text: |-
      Indien bij het verrichten van economische activiteiten verscheidene soorten goederen of diensten worden aangeboden,
      kan de kostendoorberekening, bedoeld in [artikel 25i, eerste lid, van de wet][ref1], voor deze goederen of diensten
      gezamenlijk geschieden voor zover die goederen of diensten tot dezelfde markt behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25i
    url: https://wetten.overheid.nl/BWBR0031654/2012-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 25i
  - number: '5'
    text: |-
      1 Bij de kostendoorberekening, bedoeld in [artikel 25i, eerste lid, van de wet][ref1], worden in elk geval in
      aanmerking genomen:

      a. operationele kosten;

      b. afschrijvings- en onderhoudskosten;

      c. vermogenskosten.

      2 Een bestuursorgaan is niet gehouden bij de kostendoorberekening, bedoeld in
      [artikel 25i, eerste lid, van de wet][ref2], de kosten in aanmerking te nemen van:

      a. beleidsvoorbereiding en inspraak;

      b. toezicht en handhaving;

      c. bezwaar en beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25i
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel25i
    url: https://wetten.overheid.nl/BWBR0031654/2012-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 25i
      - id: ref2
        bwb_id: BWBR0008691
        artikel: 25i
  - number: '6'
    text: |-
      Indien voor de kostendoorberekening, bedoeld in [artikel 25i, eerste lid, van de wet][ref1], kosten worden bepaald
      die betrekking hebben op activa, wordt daarbij uitgegaan van de jaarstukken, voor zover deze relevante gegevens
      betreffende die activa bevatten, en van de regels die bij of krachtens wet inzake de waardering en afschrijving van
      activa zijn bepaald, onverlet het bepaalde in [artikel 3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25i
      [ref2]: https://wetten.overheid.nl/BWBR0031654#Artikel3
    url: https://wetten.overheid.nl/BWBR0031654/2012-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 25i
      - id: ref2
        bwb_id: BWBR0031654
        artikel: '3'
  - number: '7'
    text: |-
      Indien voor de kostendoorberekening, bedoeld in [artikel 25i, eerste lid, van de wet][ref1], de in artikel 25i,
      derde lid, van de wet bedoelde vermogenskosten worden bepaald, wordt daarbij uitgegaan van de gewogen gemiddelde
      kosten van het vermogen dat wordt aangewend voor de financiering van de desbetreffende economische activiteiten,
      tenzij het activiteiten betreft waarvoor afzonderlijke financiering plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25i
    url: https://wetten.overheid.nl/BWBR0031654/2012-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 25i
  - number: '8'
    text: |-
      Ongeacht of het directe of indirecte kosten betreft, worden bij de kostendoorberekening, bedoeld in
      [artikel 25i, eerste lid, van de wet][ref1], de kosten van productiemiddelen die geheel of gedeeltelijk worden
      aangewend voor het leveren van goederen of het verrichten van diensten naar rato van het gebruik van die
      productiemiddelen toegerekend aan die goederen of diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25i
    url: https://wetten.overheid.nl/BWBR0031654/2012-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 25i
  - number: '9'
    text: |-
      Als bevoordeling in de zin van [artikel 25j, eerste lid, van de wet][ref1] wordt aangemerkt de toekenning van
      een subsidie waarvoor ondernemingen die geen deel uitmaken van een publiekrechtelijke rechtspersoon en die geen
      overheidsbedrijf zijn, niet in aanmerking komen.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25j
    url: https://wetten.overheid.nl/BWBR0031654/2012-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 25j
  - number: '10'
    text: |-
      Voor de bepaling van de integrale kosten, bedoeld in [artikel 25j, tweede lid, onderdeel b, van de wet][ref1], zijn
      de [artikelen 3 tot en met 9][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25j
      [ref2]: https://wetten.overheid.nl/BWBR0031654#Artikel3
    url: https://wetten.overheid.nl/BWBR0031654/2012-07-01#Artikel10
    references:
