  - number: '4.1'
    text: |-
      Behoudens het in de [artikelen 5][ref1] en[ 9][ref2] bepaalde is de ten hoogste toelaatbare geluidsbelasting,
      vanwege het industrieterrein, van de uitwendige scheidingsconstructie van de in het derde lid, onder *a* en *b*,
      genoemde categorieën van gebouwen binnen de zone van dat industrieterrein 50 dB(A).


      [ref1]: https://wetten.overheid.nl/BWBR0003508#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003508#Artikel9
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003508
        artikel: '5'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003508
        artikel: '9'
        hoofdstuk: III
        paragraaf: '3'
  - number: '4.2'
    text: |-
      In afwijking van het eerste lid is, behoudens het in de [artikelen 5][ref1] en [9][ref2] bepaalde, de ten hoogste
      toelaatbare geluidsbelasting, vanwege het industrieterrein, van de uitwendige scheidingsconstructie van de in het
      derde lid, onder *a* tot en met *e*, genoemde categorieën van gebouwen die op het tijdstip van de vaststelling van
      een zone binnen de zone aanwezig, in aanbouw of geprojecteerd zijn en waarvan op dat tijdstip de geluidsbelasting
      hoger is dan 50 dB(A), 55 dB(A).


      [ref1]: https://wetten.overheid.nl/BWBR0003508#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003508#Artikel9
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003508
        artikel: '5'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003508
        artikel: '9'
        hoofdstuk: III
        paragraaf: '3'
  - number: '4.3'
    text: 'De in het eerste en tweede lid bedoelde gebouwen zijn:'
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel4
  - number: 4.3.a
    text: basisscholen;
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel4
  - number: 4.3.b
    text: |-
      scholen voor voortgezet onderwijs als bedoeld in de [Wet op het voortgezet onderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002399
  - number: 4.3.c
    text: instellingen voor hoger beroepsonderwijs;
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel4
  - number: 4.3.d
    text: algemene, categorale en academische ziekenhuizen, alsmede verpleeghuizen;
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel4
  - number: 4.3.e
    text: andere gezondheidszorggebouwen dan bedoeld onder *d*.
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel4
  - number: '4.4'
    text: |-
      Een gymnastieklokaal maakt voor de toepassing van dit besluit geen deel uit van de in het derde lid, onder *a*, *b*
      en *c*, genoemde scholen.
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel4
  - number: 4a.1
    text: |-
      Behoudens het in de [artikelen 6][ref1] en [9][ref2] bepaalde is de ten hoogste toelaatbare geluidsbelasting,
      vanwege het industrieterrein, aan de grens van binnen de zone van dat industrieterrein gelegen geluidsgevoelige
      terreinen als bedoeld in het vierde lid, onder *a* 50 dB(A).


      [ref1]: https://wetten.overheid.nl/BWBR0003508#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003508#Artikel9
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0003508
        artikel: '6'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003508
        artikel: '9'
        hoofdstuk: III
        paragraaf: '3'
  - number: 4a.2
    text: |-
      In afwijking van het eerste lid is, behoudens het in [artikel 9][ref1] bepaalde, de ten hoogste toelaatbare
      geluidsbelasting, vanwege het industrieterrein, aan de grens van binnen de krachtens [artikel 53 van de wet][ref2]
      vastgestelde zone van dat industrieterrein gelegen geluidsgevoelige terreinen als bedoeld in het vierde lid, onder
      *a* die op het tijdstip van de vaststelling van een zone binnen de zone aanwezig, in aanleg of geprojecteerd zijn
      en waarvan op dat tijdstip de geluidsbelasting hoger is dan 50 dB(A), 55 dB(A).


      [ref1]: https://wetten.overheid.nl/BWBR0003508#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel53
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0003508
        artikel: '9'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '53'
  - number: 4a.3
    text: |-
      Behoudens het in [artikel 6][ref1] bepaalde is de ten hoogste toelaatbare waarde van de geluidsbelasting vanwege
      een industrieterrein waarvan de zone wordt vastgesteld krachtens [artikel 41 van de wet][ref2], aan de grens van
      binnen die zone gelegen geluidsgevoelige terreinen als bedoeld in het vierde lid, onder *b*, 50 dB(A).


      [ref1]: https://wetten.overheid.nl/BWBR0003508#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel41
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0003508
        artikel: '6'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '41'
  - number: 4a.4.a
    text: |-
      De in het eerste en tweede lid bedoelde geluidsgevoelige terreinen zijn: terreinen die behoren bij gebouwen als
      bedoeld in [artikel 4, derde lid, onder ][ref1], voor zover deze bestemd zijn of gebruikt worden voor de in die
      gebouwen gegeven zorg;


      [ref1]: https://wetten.overheid.nl/BWBR0003508#Artikel4
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0003508
        artikel: '4'
        hoofdstuk: III
        paragraaf: '1'
  - number: 4a.4.b
    text: 'De in het derde lid bedoelde geluidsgevoelige terreinen zijn: woonwagenstandplaatsen.'
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel4a
  - number: '5.1'
    text: |-
      Voor gebouwen, behorend tot de in [artikel 4, derde lid, onder ][ref1], bedoelde categorieën, kan met
      toepassing van [artikel 50, eerste lid][ref2], of [artikel 68, tweede lid, van de wet][ref3] voor de
      ten hoogste toelaatbare geluidsbelasting, vanwege het industrieterrein, een hogere waarde dan de in
      [artikel 4, eerste of tweede lid][ref4], genoemde worden vastgesteld, met dien verstande dat deze waarde 60 dB(A)
      niet te boven mag gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003508#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel68
      [ref4]: https://wetten.overheid.nl/BWBR0003508#Artikel4
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel5
    references:
