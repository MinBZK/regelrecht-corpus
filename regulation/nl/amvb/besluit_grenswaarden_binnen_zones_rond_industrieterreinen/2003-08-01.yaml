      [ref2]: https://wetten.overheid.nl/BWBR0003508#Artikel4a
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003508
        artikel: '4'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003508
        artikel: 4a
        hoofdstuk: III
        paragraaf: '1'
  - number: 10.b
    text: |-
      burgemeester en wethouders van de gemeente waarin het industrieterrein gesitueerd is of wordt met betrekking
      waartoe de hogere waarde verzocht wordt;
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel10
  - number: 10.c
    text: degene die het beheer voert over het industrieterrein met betrekking waartoe de hogere waarde verzocht wordt;
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel10
  - number: 10.d
    text: |-
      het bestuur van de Kamer van Koophandel en Fabrieken van het gebied waarin het industrieterrein, met betrekking
      waartoe de hogere waarde verzocht wordt, gesitueerd is of wordt.
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel10
  - number: '11.1'
    text: |-
      Burgemeester en wethouders van de gemeente, bedoeld in [artikel 10, onder ][ref1], maken, zo nodig op verzoek van
      een verzoeker als bedoeld in [artikel 10, onder ][ref2], het voornemen tot het indienen van een verzoek in ieder
      geval zoveel mogelijk gelijktijdig bekend door middel van:


      [ref1]: https://wetten.overheid.nl/BWBR0003508#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003508#Artikel10
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003508
        artikel: '10'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003508
        artikel: '10'
        hoofdstuk: IV
  - number: 11.1.a
    text: |-
      kennisgeving in één of meer in de in [artikel 10, onder ][ref1] bedoelde gemeente verspreiding vindende dag-,
      nieuws- of huis-aan-huis-bladen en voorts op de in die gemeente gebruikelijke wijze;


      [ref1]: https://wetten.overheid.nl/BWBR0003508#Artikel10
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003508
        artikel: '10'
        hoofdstuk: IV
  - number: 11.1.b
    text: |-
      terinzagelegging van het ontwerp van het verzoek met de daarbij behorende stukken op het gemeentehuis van de in
      [artikel 10, onder ][ref1], bedoelde gemeente;


      [ref1]: https://wetten.overheid.nl/BWBR0003508#Artikel10
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003508
        artikel: '10'
        hoofdstuk: IV
  - number: 11.1.c
    text: |-
      niet op naam gestelde kennisgeving aan de gebruikers van de woningen of de woonwagenstandplaatsen, het bevoegd
      gezag van scholen en de directies van de in [artikel 4][ref1] bedoelde andere gebouwen waarvoor een hogere waarde
      wordt verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0003508#Artikel4
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003508
        artikel: '4'
        hoofdstuk: III
        paragraaf: '1'
  - number: '11.2'
    text: |-
      Burgemeester en wethouders van de gemeente, bedoeld in [artikel 10, onder ][ref1], stellen een ieder in de
      gelegenheid gedurende vier weken vanaf de dag waarop het ontwerp van het verzoek ter inzage is gelegd, het ontwerp
      met de daarbij behorende stukken in te zien en opmerkingen ten aanzien van het ontwerp schriftelijk te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0003508#Artikel10
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003508
        artikel: '10'
        hoofdstuk: IV
  - number: '11.3'
    text: |-
      Indien het voornemen tot het indienen van een verzoek verband houdt met een toepassing van
      [artikel 52, tweede lid, onder ][ref1] of van [artikel 19 van de Wet op de Ruimtelijke Ordening][ref2], kan in
      afwijking van het tweede lid het ontwerp van het verzoek gedurende twee weken ter inzage worden gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel19
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0002375
        artikel: '19'
  - number: '12.1'
    text: 'Het verzoek en het ontwerp van een verzoek bevatten ten minste:'
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel12
  - number: 12.1.a
    text: de verzochte hogere waarde;
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel12
  - number: 12.1.b
    text: de redenen die aan het verzoek ten grondslag liggen;
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel12
  - number: 12.1.c
    text: |-
      de resultaten van het akoestisch onderzoek als bedoeld in [artikel 43][ref1] of [62 van de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel62
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '43'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '62'
  - number: 12.1.d
    text: |-
      een beschrijving van de mogelijkheden om de geluidsbelasting, van de woningen of, voor zover van toepassing, andere
      geluidsgevoelige bestemmingen bedoeld in [artikel 4][ref1], tot een lagere waarde te verminderen dan onder *a*
      bedoelde, alsmede een schatting van de hieraan verbonden extra kosten;


      [ref1]: https://wetten.overheid.nl/BWBR0003508#Artikel4
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003508
        artikel: '4'
        hoofdstuk: III
        paragraaf: '1'
  - number: 12.1.e
    text: |-
      een verklaring dat maatregelen als bedoeld in [artikel 111, eerste lid, van de wet][ref1], zullen worden getroffen,
      indien de geluidsbelasting binnen de woning bij gesloten ramen meer bedraagt dan 35 dB(A).


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel111
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '111'
  - number: '12.2'
    text: |-
      Het verzoek gaat vergezeld van een of meer kaarten met bijbehorende verklaring. Met betrekking tot deze kaart of
      kaarten is [artikel 16 van het Besluit op de ruimtelijke ordening 1985][ref1] (*Stb.* 627) van overeenkomstige
      toepassing, met dien verstande dat in plaats van "plan" telkens gelezen wordt: "verzoek". De kaart of kaarten
      geven bovendien de ligging weer van geluidszones langs wegen, rond industrieterreinen en rond luchtvaartterreinen
      als bedoeld in [artikel 25, tweede lid, van de Luchtvaartwet][ref2] (*Stb.* 1958, 47), alsmede de in die zones
      voorkomende gebieden, aangewezen overeenkomstig [artikel 1.2, tweede lid, onder ][ref3], voor zover de woningen,
      gebouwen of terreinen waarop het verzoek betrekking heeft, binnen zodanige zones zijn of worden gesitueerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003889#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003889
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '25'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '1'
  - number: '12.3'
    text: |-
      Gedeputeerde staten kunnen van de verzoeker nadere toelichting, tekeningen en kaarten verlangen, indien zij deze
      noodzakelijk achten voor de beoordeling van het verzoek.
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel12
  - number: '12.4'
    text: |-
      Indien het verzoek wordt gedaan in samenhang met de voorbereiding van een bestemmingsplan dat met toepassing van
      [artikel 11 van de Wet op de Ruimtelijke Ordening][ref1] (*Stb.* 1985, 626) moet worden uitgewerkt of kan worden
      gewijzigd, kunnen gedeputeerde staten het verzoek in behandeling nemen, indien niet is voldaan aan het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel11
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '11'
  - number: '13'
    text: |-
      De verzoeker zendt gelijktijdig met het indienen van zijn verzoek een afschrift van het verzoek en de hierbij
      behorende stukken naar:
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel13
  - number: 13.a
    text: de inspecteur;
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel13
  - number: 13.b
    text: de inspecteur van de Volkshuisvesting;
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel13
  - number: 13.c
    text: |-
      de verzoekgerechtigden als bedoeld in [artikel 10][ref1], die het verzoek niet hebben gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003508#Artikel10
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003508
        artikel: '10'
        hoofdstuk: IV
  - number: '14'
    text: |-
      Gedeputeerde staten tekenen de datum van ontvangst van een verzoek aan op het geschrift waarbij het verzoek is
      ingediend, en zenden de verzoeker een bewijs van ontvangst, waarin de datum is vermeld.
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel14
  - number: 14a.1
    text: |-
      Burgemeester en wethouders van de gemeente, bedoeld in [artikel 10, onder ][ref1], houden binnen de in
      [artikel 11, tweede lid][ref2], bedoelde termijn een openbare zitting, waarbij een ieder de gelegenheid wordt
      gegeven opmerkingen te maken ten aanzien van het ontwerp van het verzoek, bedoeld in [artikel 11][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003508#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003508#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0003508#Artikel11
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0003508
        artikel: '10'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003508
        artikel: '11'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0003508
        artikel: '11'
        hoofdstuk: IV
  - number: 14a.2
    text: |-
      Burgemeester en wethouders van de gemeente, bedoeld in [artikel 10, onder ][ref1], stellen een rapport op van
      de wijze waarop de bevolking bij de totstandkoming van het verzoek, bedoeld in [artikel 10][ref2], is betrokken,
      waarin in ieder geval begrepen zijn een verslag van de openbare zitting en afschriften van de schriftelijk gemaakte
      opmerkingen over het ontwerp van het verzoek. Zij zenden dit rapport onmiddellijk toe aan degenen die op de
      openbare zitting opmerkingen ten aanzien van het ontwerp van het verzoek hebben gemaakt, en aan de verzoeker.


      [ref1]: https://wetten.overheid.nl/BWBR0003508#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003508#Artikel10
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0003508
        artikel: '10'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003508
        artikel: '10'
        hoofdstuk: IV
  - number: 14a.3
    text: |-
      Een verzoek als bedoeld in [artikel 10][ref1] gaat vergezeld van het in het tweede lid bedoelde rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0003508#Artikel10
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0003508
        artikel: '10'
        hoofdstuk: IV
  - number: 14a.4
    text: |-
      Dit artikel blijft van toepassing zolang de betrokken gemeente met inachtneming van [artikel 151][ref1] juncto
      [artikel 297 van de Gemeentewet][ref2] geen inspraakverordening heeft vastgesteld en in werking heeft laten treden.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel151
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel297
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '151'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '297'
  - number: '15.1'
    text: Dit besluit kan worden aangehaald als "Besluit grenswaarden binnen zones rond industrieterreinen".
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel15
  - number: '15.2'
    text: Het treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel15
