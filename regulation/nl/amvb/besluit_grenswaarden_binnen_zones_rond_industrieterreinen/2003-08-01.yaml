        artikel: '6'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: '68'
  - number: '7.2'
    text: 'Het eerste lid vindt slechts toepassing in die gevallen waarin:'
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel7
  - number: 7.2.a
    text: |-
      het referentieniveau ter plaatse van de uitwendige scheidingsconstructie van de gebouwen of aan de grens van de
      geluidsgevoelige terreinen waarvoor de hogere waarde is verzocht, hoger is dan of gelijk is aan het equivalente
      geluidsniveau vanwege het betrokken industrieterrein, of
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel7
  - number: 7.2.b
    text: de gebouwen ter plaatse gesitueerd zijn of worden voor het functioneren van de woonwijk of het industrieterrein.
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel7
  - number: 7a.1
    text: |-
      Bij wijziging van een zone of bij herziening van een bestemmingsplan, geldende voor tot de zone
      behorende gronden, kunnen gedeputeerde staten met toepassing van [artikel 50, eerste lid][ref1], of
      [artikel 68, eerste lid, van de wet][ref2], de ingevolge [artikel 4, eerste of tweede lid][ref3], of
      [artikel 5, eerste of tweede lid][ref4], geldende waarde voor gebouwen in dat gebied, behorend tot de in
      [artikel 4, derde lid, onder ][ref5], bedoelde categorieën, met ten hoogste 5 dB(A) verhogen, indien de toepassing
      van maatregelen, gericht op het terugbrengen van de te verwachten geluidsbelasting vanwege het industrieterrein,
      van de uitwendige scheidingsconstructie van de betrokken gebouwen tot de voordien geldende ten hoogste toelaatbare
      geluidsbelasting, onvoldoende doeltreffend zal zijn, dan wel overwegende bezwaren ontmoet van stedebouwkundige,
      landschappelijke of financiële aard.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel68
      [ref3]: https://wetten.overheid.nl/BWBR0003508#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0003508#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0003508#Artikel4
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '50'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '68'
      - id: ref3
