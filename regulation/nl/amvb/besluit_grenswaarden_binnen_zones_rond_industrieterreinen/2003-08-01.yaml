        bwb_id: BWBR0005181
        artikel: '1'
  - number: 1.a
    text: 'het hoogste van de volgende geluidsniveaus, gemeten over een door Onze Minister te bepalen periode:'
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel1
  - number: 1.a.1°
    text: |-
      het geluidsniveau in dB(A) dat gedurende 95% van de periode op een bepaalde plaats wordt overschreden, de bijdrage
      van het betrokken industrieterrein daaronder niet begrepen;
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel1
  - number: 1.a.2°
    text: het vanwege een weg op die plaats optredende equivalente geluidsniveau in dB(A), verlaagd met 10 dB;
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel1
  - number: 1.b
    text: |-
      het geluidsniveau, bedoeld in a, onder 1°, indien over de periode van 23.00 tot 07.00 uur minder dan 500
      motorvoertuigen van de weg gebruik maken.
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel1
  - number: 1a
    text: |-
      Indien [artikel 157 van de wet][ref1] van toepassing is geven gedeputeerde staten slechts toepassing aan de
      [artikelen 2][ref2], [2][ref3], [2][ref4], [3][ref5], [3][ref6], [5][ref7], [6][ref8] en [7][ref9], voor
      zover de gecumuleerde geluidsbelastingen na de correctie op grond van [artikel 157, derde lid, van de wet][ref10]
      niet leiden tot een naar hun oordeel onaanvaardbare geluidsbelasting.


