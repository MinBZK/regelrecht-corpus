        artikel: '67'
  - number: 3a.2
    text: |-
      Gedeputeerde staten kunnen voorts met betrekking tot aanwezige of in aanbouw zijnde woningen toepassing geven aan
      de [artikelen 48, eerste lid][ref1], en [67, eerste lid, van de wet][ref2], in die gevallen waarin door wijziging
      van industriële activiteiten op het industrieterrein voor een ongeveer gelijk aantal woningen binnen de zone
      aanmerkelijk lagere geluidsbelastingen optreden dan de voordien geldende.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel67
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel3a
