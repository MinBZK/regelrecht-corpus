  - number: 8.2.b
    text: |-
        - theorievaklokalen van scholen voor voortgezet onderwijs als bedoeld in de [Wet op het voortgezet onderwijs][ref1];
        - theorievaklokalen van instellingen voor hoger beroepsonderwijs;
        - ruimten voor patiëntenhuisvesting, alsmede recreatie- en conversatieruimten van ziekenhuizen en verpleeghuizen,
      bedoeld in [artikel 4, derde lid, onder d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399
