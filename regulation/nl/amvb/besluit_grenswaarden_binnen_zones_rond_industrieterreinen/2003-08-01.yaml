  - number: '6'
    text: |-
      Voor terreinen als bedoeld in [artikel 4][ref1], kan met toepassing van [artikel 50, eerste lid][ref2],
      of - indien het betreft terreinen als bedoeld in [artikel 4][ref3], - met toepassing van
      [artikel 68, tweede lid, van de wet][ref4] voor de ten hoogste toelaatbare geluidsbelasting, vanwege het
      industrieterrein, een hogere waarde dan de in [artikel 4][ref5], genoemde worden vastgesteld, met dien verstande
      dat deze waarde 55 dB(A) niet te boven mag gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003508#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0003508#Artikel4a
      [ref4]: https://wetten.overheid.nl/BWBR0003227#Artikel68
      [ref5]: https://wetten.overheid.nl/BWBR0003508#Artikel4a
