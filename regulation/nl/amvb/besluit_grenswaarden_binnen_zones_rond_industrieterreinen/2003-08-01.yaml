    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volksgezondheid en Milieuhygiëne van 12 februari 1982, DGMH/G,
    nr. 155879, gedaan in overeenstemming met Onze Ministers van Volkshuisvesting en Ruimtelijke Ordening en van
