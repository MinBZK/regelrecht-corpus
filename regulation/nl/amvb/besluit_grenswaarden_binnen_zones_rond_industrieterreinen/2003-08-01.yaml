  - number: '7.1'
    text: |-
      Gedeputeerde staten kunnen toepassing geven aan [artikel 5][ref1] of [6][ref2] indien de toepassing van
      maatregelen gericht op het terugbrengen van de geluidsbelasting, vanwege het industrieterrein, van de
      uitwendige scheidingsconstructie van het betrokken gebouw onderscheidenlijk aan de grens van het betrokken
      geluidsgevoelig terrein, tot 50 dB(A) onvoldoende doeltreffend zal zijn, dan wel, bij toepassing van
      [artikel 68, tweede lid, van de wet][ref3], overwegende bezwaren ontmoet van stedebouwkundige, landschappelijke of
      financiële aard.


      [ref1]: https://wetten.overheid.nl/BWBR0003508#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003508#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel68
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003508
        artikel: '5'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
