        artikel: '47'
  - number: '3.2'
    text: 'Het eerste lid vindt slechts toepassing in die gevallen waarin:'
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel3
  - number: 3.2.a
    text: |-
      het referentieniveau ter plaatse van de uitwendige scheidingsconstructie van de woningen waarvoor de hogere waarde
      is verzocht, hoger is dan of gelijk is aan het equivalente geluidsniveau vanwege het betrokken industrieterrein
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel3
  - number: 3.2.b
    text: de woningen ter plaatse noodzakelijk zijn om redenen van grond- of bedrijfsgebondenheid, of
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel3
  - number: 3.2.c
    text: |-
      de ligging van de geluidsbronnen op het betrokken industrieterrein zodanig is dat de geluidsbelasting, vanwege dit
      industrieterrein en vanwege andere geluidsbronnen, van ten minste één uitwendige scheidingsconstructie van elk van
      de woningen lager is dan of gelijk is aan 50 dB(A).
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel3
  - number: '3.3'
    text: |-
      Met betrekking tot aanwezige of in aanbouw zijnde woningen kunnen gedeputeerde staten toepassing geven aan
      [artikel 66 van de wet][ref1] in gevallen als bedoeld in het tweede lid, onder *a*, *b* en *c*, indien de
      toepassing van maatregelen, gericht op het terugbrengen van de geluidsbelasting, vanwege het industrieterrein, van
      de uitwendige scheidingsconstructie van de betrokken woningen tot 50 dB(A) onderscheidenlijk 55 dB(A) onvoldoende
      doeltreffend zal zijn, dan wel overwegende bezwaren ontmoet van stedebouwkundige, landschappelijke of financiële
      aard.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel66
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '66'
  - number: 3a.1
    text: |-
      Met betrekking tot aanwezige of in aanbouw zijnde woningen kunnen gedeputeerde staten toepassing geven aan de
      [artikelen 48, eerste lid][ref1], en [67, eerste lid, van de wet][ref2], indien de toepassing van maatregelen,
      gericht op het terugbrengen van de te verwachten geluidsbelasting vanwege het industrieterrein, van de uitwendige
      scheidingsconstructie van de betrokken woningen tot de voordien geldende ten hoogste toelaatbare geluidsbelasting,
      onvoldoende doeltreffend zal zijn, dan wel overwegende bezwaren ontmoet van stedebouwkundige, landschappelijke of
      financiële aard.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel67
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel3a
