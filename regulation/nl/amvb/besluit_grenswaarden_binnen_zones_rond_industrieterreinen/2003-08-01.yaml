  - number: '9'
    text: |-
      De [artikelen 71][ref1], [72][ref2] en [111, eerste lid, aanhef en onder ][ref3] zijn met
      betrekking tot op het tijdstip van de vaststelling van een zone krachtens of met overeenkomstige
      toepassing van [artikel 53 van de wet][ref4] aanwezige of in aanbouw zijnde gebouwen als bedoeld in
      [artikel 4, derde lid, onder ][ref5], alsmede van terreinen als bedoeld in [artikel 4][ref6], die op het
      tijdstip van de vaststelling een hogere geluidsbelasting, vanwege het industrieterrein, ondervinden dan
      55 dB(A), van overeenkomstige toepassing, met dien verstande dat: - de met overeenkomstige toepassing van
      [artikel 72, tweede lid, van de wet][ref7] door Onze Minister vast te stellen ten hoogste toelaatbare waarde
      voor de geluidsbelasting, vanwege het industrieterrein, van de uitwendige scheidingsconstructie van de in
      [artikel 4, derde lid, onder ][ref8], bedoelde categorieën van gebouwen, 65 dB(A) niet te boven mag gaan;
        - de met overeenkomstige toepassing van [artikel 72, tweede lid, van de wet][ref9] door Onze Minister vast te
      stellen ten hoogste toelaatbare waarde voor de geluidsbelasting, vanwege het industrieterrein, van de uitwendige
      scheidingsconstructie van de in artikel 4, derde lid, onder *e*, bedoelde categorieën van gebouwen, 60 dB(A) niet
      te boven mag gaan;
        - de met overeenkomstige toepassing van [artikel 72, tweede lid, van de wet][ref10] door Onze Minister vast te
      stellen ten hoogste toelaatbare waarde voor de geluidsbelasting, vanwege het industrieterrein, aan de grens van
      terreinen als bedoeld in [artikel 4][ref11], 60 dB(A) niet te boven mag gaan;
        - de met overeenkomstige toepassing van [artikel 111, eerste lid, aanhef en onder ][ref12] door de gemeenteraad
      te treffen maatregelen bevorderen, dat de geluidsbelasting, vanwege het industrieterrein, a. binnen de
      verblijfsruimten, bedoeld in [artikel 8, tweede lid, onder ][ref13], 35 dB(A), en b. binnen de verblijfsruimten,
      bedoeld in [artikel 8, tweede lid, onder ][ref14], 40 dB(A), niet te boven zal gaan.


