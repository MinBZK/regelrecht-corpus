articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: wet: de [Wet geluidhinder][ref1]; uitwendige scheidingsconstructie en
      verblijfsruimte: 'hetgeen onder die begrippen wordt verstaan in het [Bouwbesluit 2003][ref2]; gezondheidszorggebouw:'
      hetgeen onder gezondheidszorgfunctie wordt verstaan in het [Bouwbesluit 2003][ref3]; woonwagenstandplaats: een
      standplaats als bedoeld in [artikel 1, eerste lid, onderdeel h, van de Woningwet][ref4]; zone: een zone rond
      een industrieterrein; waarde: de etmaalwaarde van het equivalente geluidsniveau in dB(A) met betrekking tot een
      industrieterrein; referentieniveau:


      [ref1]: https://wetten.overheid.nl/BWBR0003227
      [ref2]: https://wetten.overheid.nl/BWBR0012727
      [ref3]: https://wetten.overheid.nl/BWBR0012727
