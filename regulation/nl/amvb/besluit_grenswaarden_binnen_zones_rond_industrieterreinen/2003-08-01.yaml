        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0003508
        artikel: '4'
        hoofdstuk: III
        paragraaf: '1'
  - number: 7a.2
    text: |-
      Het eerste lid vindt slechts toepassing indien degene ten behoeve van wie de waarde wordt verhoogd, heeft verklaard
      dat hij uiterlijk gelijktijdig met de verhoging financiële middelen ter beschikking stelt ten behoeve van de
      toepassing van maatregelen als bedoeld in [artikel 71, tweede lid, van de wet][ref1] met betrekking tot gebouwen,
      die door de wijziging van de zone of herziening van het bestemmingsplan een hogere geluidsbelasting ondervinden.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel71
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '71'
  - number: 7a.3
    text: 'Bij toepassing van het eerste lid mag de waarde niet hoger worden gesteld dan:'
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel7a
  - number: 7a.3.1°
    text: |-
      60 dB(A) voor gebouwen, behorende tot de in [artikel 4, derde lid, onder ][ref1], bedoelde categorieën, en


      [ref1]: https://wetten.overheid.nl/BWBR0003508#Artikel4
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0003508
        artikel: '4'
        hoofdstuk: III
        paragraaf: '1'
  - number: 7a.3.2°
    text: |-
      55 dB(A) voor gebouwen, behorende tot de in [artikel 4, derde lid, onder ][ref1], bedoelde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0003508#Artikel4
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0003508
        artikel: '4'
        hoofdstuk: III
        paragraaf: '1'
  - number: '8.1'
    text: |-
      Indien door de toepassing van [artikel 50, eerste lid][ref1], of [artikel 68, tweede lid, van de wet][ref2] voor
      de uitwendige scheidingsconstructie van één of meer in aanbouw zijnde of aanwezige gebouwen binnen een zone een
      hogere geluidsbelasting dan 50dB(A) als toelaatbaar is aangemerkt, treft de gemeenteraad met betrekking tot de
      geluidwering van die uitwendige scheidingsconstructie maatregelen om te bevorderen dat de geluidsbelasting, vanwege
      het industrieterrein,


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel68
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '50'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '68'
  - number: 8.1.a
    text: binnen de verblijfsruimten, genoemd in het tweede lid, onder *a,* 30dB(A), en
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel8
  - number: 8.1.b
    text: binnen de verblijfsruimten, genoemd in het tweede lid, onder *b,* 35dB (A),
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel8
  - number: '8.2'
    text: 'De verblijfsruimten, bedoeld in het eerste lid zijn:'
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel8
  - number: 8.2.a
    text: |-
        - leslokalen van basisscholen;
        - theorielokalen van scholen voor voortgezet onderwijs als bedoeld in de[Wet op het voortgezet onderwijs][ref1];
        - theorielokalen van instellingen voor hoger beroepsonderwijs;
        - onderzoeks- en behandelingsruimten van ziekenhuizen en verpleeghuizen, bedoeld in
      [artikel 4, derde lid, onder d][ref2];
        - onderzoeks-, behandelings-, recreatie-, en conversatieruimten, alsmede woon- en slaapruimten van gebouwen,
      bedoeld in [artikel 4, derde lid, onder e][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0003508#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003508#Artikel4
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel8
    references:
