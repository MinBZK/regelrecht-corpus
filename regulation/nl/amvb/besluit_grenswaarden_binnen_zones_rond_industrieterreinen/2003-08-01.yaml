  - number: '2.1'
    text: |-
      Met betrekking tot nieuw te bouwen, nog niet in aanbouw zijnde woningen kunnen gedeputeerde staten toepassing geven
      aan [artikel 47, eerste lid, van de wet][ref1], indien de toepassing van maatregelen, gericht op het terugbrengen
      van de geluidsbelasting, vanwege het industrieterrein, van de uitwendige scheidingsconstructie van de betrokken
      woningen, tot 50 dB(A) onvoldoende doeltreffend zal zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel47
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '47'
  - number: '2.2'
    text: 'Het eerste lid vindt slechts toepassing in die gevallen waarin:'
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel2
  - number: 2.2.a
    text: |-
      het referentieniveau ter plaatse van de uitwendige scheidingsconstructie van de woningen waarvoor de hogere waarde
      is verzocht, hoger is dan of gelijk is aan het equivalente geluidsniveau vanwege het betrokken industrieterrein, of
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel2
  - number: 2.2.b
    text: de woningen ter plaatse noodzakelijk zijn om redenen van grond- of bedrijfsgebondenheid, of
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel2
  - number: 2.2.c
    text: |-
      de woningen in een dorps- of stadsvernieuwingsplan worden opgenomen, dan wel door de gekozen situering een open
      plaats tussen aanwezige bebouwing opvullen, of
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel2
  - number: 2.2.d
    text: |-
      de ligging van de geluidsbronnen op het betrokken industrieterrein zodanig is dat de geluidsbelasting, vanwege dit
      industrieterrein en vanwege andere geluidsbronnen, van ten minste één uitwendige scheidingsconstructie van elk van
      de woningen lager is dan of gelijk is aan 50 dB(A), of
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel2
  - number: 2.2.e
    text: de woningen ter plaatse gesitueerd worden als vervanging van bestaande bebouwing.
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel2
  - number: '2.3'
    text: |-
      Met betrekking tot nieuw te bouwen, nog niet in aanbouw zijnde woningen kunnen gedeputeerde staten toepassing
      geven aan [artikel 66 van de wet][ref1] in gevallen als bedoeld in het tweede lid, onder *a* tot en met *e*, indien
      toepassing van maatregelen, gericht op het terugbrengen van de geluidsbelasting, vanwege het industrieterrein, van
      de uitwendige scheidingsconstructie van de betrokken woningen tot 50 dB(A) onvoldoende doeltreffend zal zijn dan
      wel overwegende bezwaren ontmoet van de stedebouwkundige, landschappelijke of financiële aard.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel66
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '66'
  - number: 2a.1
    text: |-
      Met betrekking tot nieuw te bouwen, nog niet in aanbouw zijnde woningen kunnen gedeputeerde staten toepassing
      geven aan de [artikelen 48, eerste lid][ref1], en [67, eerste lid, van de wet][ref2], indien de toepassing
      van maatregelen, gericht op het terugbrengen van de te verwachten toename van de geluidsbelasting vanwege het
      industrieterrein, van de uitwendige scheidingsconstructie van de betrokken woningen tot de voordien geldende ten
      hoogste toelaatbare geluidsbelasting, onvoldoende doeltreffend zal zijn, dan wel overwegende bezwaren ontmoet van
      stedebouwkundige, landschappelijke of financiële aard.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel67
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '48'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '67'
  - number: 2a.2
    text: |-
      Gedeputeerde staten kunnen voorts met betrekking tot nieuw te bouwen, nog niet in aanbouw zijnde woningen
      toepassing geven aan de [artikelen 48, eerste lid][ref1], en [67, eerste lid, van de wet][ref2] in die gevallen
      waarin door wijziging van industriële activiteiten op het industrieterrein voor een ongeveer gelijk aantal woningen
      binnen de zone aanmerkelijk lagere geluidsbelastingen optreden dan de voordien geldende.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel67
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '48'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '67'
  - number: 2b.1
    text: |-
      Met betrekking tot nieuw te bouwen, nog niet in aanbouw zijnde woningen kunnen gedeputeerde staten toepassing geven
      aan [artikel 67, vierde lid, van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel67
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '67'
  - number: 2b.1.1°
    text: bij herstructurering van havenbekkens, haventerreinen of activiteiten die zeehavengebonden zijn, en
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel2b
  - number: 2b.1.2°
    text: |-
      indien de toepassing van maatregelen, gericht op het terugbrengen van de geluidsbelasting, vanwege het
      industrieterrein, van de uitwendige scheidingsconstructie van de betrokken woningen tot 50 dB(A) onvoldoende
      doeltreffend zal zijn, dan wel overwegende bezwaren ontmoet van stedebouwkundige, landschappelijke of financiële
      aard.
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel2b
  - number: 2b.2
    text: |-
      Met betrekking tot nieuw te bouwen, nog niet in aanbouw zijnde woningen kunnen gedeputeerde staten toepassing geven
      aan [artikel 67, vijfde lid, van de wet][ref1], indien de toepassing van maatregelen, gericht op het terugbrengen
      van de geluidsbelasting, vanwege het industrieterrein, van de uitwendige scheidingsconstructie van de betrokken
      woningen tot 50 dB(A) onvoldoende doeltreffend zal zijn, dan wel overwegende bezwaren ontmoet van stedebouwkundige,
      landschappelijke of financiële aard.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel67
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '67'
  - number: '3.1'
    text: |-
      Met betrekking tot aanwezige of in aanbouw zijnde woningen kunnen gedeputeerde staten toepassing geven aan
      [artikel 47, eerste lid, van de wet][ref1], indien de toepassing van maatregelen, gericht op het terugbrengen
      van de geluidsbelasting, vanwege het industrieterrein, van de uitwendige scheidingsconstructie van de betrokken
      woningen, tot 50 dB(A) onvoldoende doeltreffend zal zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel47
    url: https://wetten.overheid.nl/BWBR0003508/2003-08-01#Artikel3
    references:
      - id: ref1
