---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: stoombesluit
regulatory_layer: AMVB
publication_date: '2001-11-27'
valid_from: '2005-08-01'
bwb_id: BWBR0002123
url: https://wetten.overheid.nl/BWBR0002123/2005-08-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken van 17 November 1953, no. 1826, Afdeling
    Arbeidsverhoudingen;

    Gelet op de Stoomwet;

    De Raad van State gehoord (advies van 8 December 1953, no. 44);

    Gezien het nader rapport van voornoemde Staatssecretaris van 15 December 1953, no. 1961, Afdeling
    Arbeidsverhoudingen;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Dit besluit verstaat onder: Onze Minister: Onze Minister van Sociale Zaken; de Dienst: de Dienst voor het
      Stoomwezen; het Districtshoofd: het bevoegde Districtshoofd van de Dienst; werkdruk: de hoogste absolute druk,
      welke in het hoogste punt van een stoomtoestel of damptoestel of in het hoogste punt van een afzonderlijk gedeelte
      van een zodanig toestel, wanneer het in werking wordt gebracht, tegen de wand kan ontstaan, uitgedrukt in de
      eenheid bar, verminderd met één bar; persdruk: de absolute druk, welke in een stoomtoestel of damptoestel of
      in een afzonderlijk gedeelte van een zodanig toestel bij de beproeving tegen de wand heerst, uitgedrukt in bar,
      verminderd met één bar; overdruk: het grootste verschil van de drukken, uitgedrukt in bar, die aan weerszijden
      van de wand van een stoomtoestel of damptoestel of van een gedeelte van een zodanig toestel kunnen ontstaan;
      bedrijfstemperatuur: de hoogste temperatuur, uitgedrukt in graden Celsius, welke in een stoomtoestel of damptoestel
      of in een afzonderlijk gedeelte van een zodanig toestel, ten gevolge van de wijze, waarop het kan worden gebruikt,
      zal heersen; verwarmd oppervlak: het wandoppervlak van een stoomtoestel of damptoestel, uitgedrukt in vierkante
      meters, waarmede de warmte afgevende stoffen in aanraking worden gebracht met het doel die warmte aan het toestel
      af te staan; vaten: stoomtoestellen andere dan stoomketels en damptoestellen andere dan dampketels.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel1
  - number: '1.2'
    text: |-
      Waar in dit besluit sprake is van druk zonder nadere aanduiding, wordt bedoeld de absolute druk, uitgedrukt in bar,
      verminderd met één bar. In een ruimte wordt geacht geen druk te kunnen ontstaan, wanneer deze ruimte in verbinding
      staat met de buitenlucht door openingen, waarvan de gezamenlijke doorlaat niet kleiner is dan de gezamenlijke
      doorlaat van de openingen van veiligheidskleppen of veiligheidsbuizen, welke voor stoomtoestellen en damptoestellen
      krachtens dit besluit zijn vereist.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel1
  - number: '1.3'
    text: |-
      Stoomtoestellen en damptoestellen worden geacht te worden verhit, wanneer de bedrijfstemperatuur een waarde van 45
      graden overschrijdt.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel1
  - number: '1.4'
    text: |-
      Bij stoomketels en dampketels, welke door middel van electrische stroom worden verhit, wordt geacht, dat het
      verwarmd oppervlak een uitgestrektheid heeft gelijk aan het twintigste gedeelte van het getal, aangevende het
      grootste aan de ketel toe te voeren vermogen, uitgedrukt in kilowatt.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel1
  - number: '2'
    text: |-
      Voor de uitoefening van het bij de [Stoomwet][ref1] voorgeschreven toezicht verdeelt Onze Minister het land in
      districten.


      [ref1]: https://wetten.overheid.nl/BWBR0002108
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002108
  - number: '3.1'
    text: De ambtenaren van de Dienst zijn werkzaam onder de bevelen van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel3
  - number: '3.2'
    text: |-
      Bij de uitoefening van hun ambt zijn de ambtenaren van de Dienst steeds voorzien van een hun door of namens Onze
      Minister afgegeven legitimatiebewijs, hetwelk desverlangd moet worden getoond.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel3
  - number: '4.1'
    text: Aan het hoofd van de Dienst staat de Hoofdingenieur-Directeur, wiens ambtskring het Rijk omvat.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel4
  - number: '4.2'
    text: |-
      Onze Minister wijst aan de overige ambtenaren van de Dienst een of meer van de in [artikel 2][ref1] bedoelde
      districten als ambtsgebied aan of voegt hen toe aan het Hoofd van de Dienst. Het Hoofd van de Dienst kan, indien
      dit wordt verzocht, een ambtenaar van de Dienst voor het verrichten van een keuring in het buitenland aanwijzen. In
      dit geval worden de door de aanvrager te dragen kosten berekend naar een door Onze Minister vastgesteld tarief. Het
      Hoofd van de Dienst kan de ambtenaren van de Dienst tijdelijk buiten hun ambtsgebied bevoegd verklaren.


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel2
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '2'
        hoofdstuk: I
  - number: '4.3'
    text: Onze Minister wijst aan ieder van de ambtenaren van de Dienst een standplaats aan.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel4
  - number: '5.1'
    text: Het Hoofd van de Dienst is belast met de leiding van en het toezicht op de Dienst.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel5
  - number: '5.2'
    text: |-
      Hij kan met betrekking tot het veilig gebruik van stoomtoestellen en damptoestellen eisen stellen aan het
      materiaal, de constructie en de wijze van vervaardigen van deze toestellen en van hun toebehoren, en daartoe zowel
      in het algemeen als ten aanzien van bepaalde stoomtoestellen en damptoestellen onderzoekingen doen verrichten.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel5
  - number: '5.3'
    text: |-
      Hij wordt in de vervulling van zijn ambt bijgestaan door de hem toegevoegde ambtenaren, aan wie hij daartoe
      opdrachten geeft.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel5
  - number: '5.4'
    text: |-
      Bij ziekte, verlof, afwezigheid of ontstentenis van het Hoofd van de Dienst worden door Onze Minister, voor zoveel
      nodig, maatregelen genomen ter voorziening in de tijdelijke waarneming van het ambt.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel5
  - number: '6.1'
    text: |-
      Aan het hoofd van de Dienst in elk van de districten, bedoeld in [artikel 2][ref1], staat een door Onze Minister
      aan te wijzen Hoofdingenieur-Districtshoofd.


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel2
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '2'
        hoofdstuk: I
  - number: '6.2'
    text: |-
      Het Districtshoofd draagt zorg voor de uitoefening van het bij de [Stoomwet][ref1] voorgeschreven toezicht in zijn
      district. Hij wordt in de vervulling van zijn taak bijgestaan door de overige ambtenaren, die in zijn district
      werkzaam zijn gesteld. Deze ambtenaren staan onder zijn bevelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002108
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002108
  - number: '6.3'
    text: |-
      Bij ziekte, verlof, verblijf buiten het district of ontstentenis van het Districtshoofd wordt door het Hoofd van
      de Dienst, voor zoveel nodig, een van de ambtenaren van de Dienst, niet beneden de rang van Ingenieur, met de
      waarneming van het ambt belast.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel6
  - number: '7.1'
    text: |-
      Het Districtshoofd verzamelt en bewaart de gegevens en rapporten omtrent stoomtoestellen en damptoestellen, welke
      in zijn district blijvend aanwezig zijn en - voor zover het betreft toestellen die ook elders worden gebruikt
        - omtrent stoomtoestellen en damptoestellen, welke in de regel in zijn district aan de keuringen, bedoeld in
      [artikel 60][ref1], worden onderworpen. In geval van twijfel beslist het Hoofd van de Dienst in welk district de
      gegevens en rapporten moeten worden verzameld en bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel60
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '60'
        hoofdstuk: VII
  - number: '7.2'
    text: |-
      Wordt in een district een stoomtoestel of damptoestel gekeurd, waarvan ingevolge het bepaalde in het voorgaande
      lid de gegevens en rapporten in een ander district behoren te worden verzameld, dan zendt het Districtshoofd de
      rapporten betrekking hebbende op deze keuring onverwijld aan zijn ambtgenoot in dat district.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel7
  - number: '8.1'
    text: |-
      Voor zover stoomtoestellen en damptoestellen niet bij of krachtens [artikel 21 van de Stoomwet][ref1]
      zijn uitgezonderd, zijn alle stoomtoestellen en damptoestellen aan keuring door de Dienst, als bedoeld in
      [artikel 4, lid 1, van deze Wet][ref2], onderworpen, met uitzondering van:


      [ref1]: https://wetten.overheid.nl/BWBR0002108#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002108#Artikel4
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002108
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0002108
        artikel: '4'
  - number: 8.1.a
    text: vaten, welke delen van krachtwerktuigen zijn;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel8
  - number: 8.1.b
    text: |-
      stoomtoestellen en damptoestellen ten aanzien waarvan één van de grenzen, genoemd in [artikel 10, lid 1][ref1],
      niet is overschreden, en ten aanzien waarvan tevens wordt voldaan aan de voorschriften bij of krachtens de
      [Stoomwet][ref2] gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002108
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '10'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002108
  - number: '8.2'
    text: |-
      Indien een stoomtoestel of damptoestel bestaat uit afzonderlijke gedeelten, als bedoeld in [artikel 11][ref1],
      geldt het bepaalde onder *b* in het voorgaande lid alleen dan, wanneer ten aanzien van elk afzonderlijk gedeelte
      één van de grenzen, genoemd in [artikel 10, lid 1][ref2], niet is overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002123#Artikel10
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '11'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002123
        artikel: '10'
        hoofdstuk: I
  - number: '8.3'
    text: |-
      Als stoomtoestellen en damptoestellen, bedoeld in [artikel 21, onder c, van de Stoomwet][ref1], worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0002108#Artikel21
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002108
        artikel: '21'
  - number: 8.3.a
    text: |-
      stoomtoestellen en damptoestellen aan boord van schepen waarop de [Schepenwet][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0001876
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001876
  - number: 8.3.b
    text: |-
      stoomtoestellen en damptoestellen die uitsluitend tot huishoudelijk gebruik dienen en waarvan hetzij de werkdruk
      niet meer bedraagt dan 0,5 bar, hetzij het produkt van de getallen, aangevende de inhoud in liters en de werkdruk,
      niet groter is dan 200;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel8
  - number: 8.3.c
    text: |-
      stoomtoestellen en damptoestellen waarop het [Warenwetbesluit drukapparatuur][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0010586
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0010586
  - number: 8a
    text: |-
      Keuringswerkzaamheden die met betrekking tot een stoomtoestel of damptoestel buiten Nederland in een Lid-
      Staat van de Europese Economische Gemeenschap of in een andere Staat, die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte zijn verricht door een aldaar gevestigde instantie, worden
      gelijkgesteld met dienovereenkomstige aan een gelijksoortig stoomtoestel of damptoestel door de Dienst verrichte
      keuringswerkzaamheden in de gevallen waarin met betrekking tot eerstbedoelde keuringswerkzaamheden inachtneming
      heeft plaatsgevonden van artikel 22 en bijlage IV van de Richtlijn van de Raad van de Europese Gemeenschappen van
      27 juli 1976 over de onderlinge aanpassing van de wetgevingen der Lid-Staten inzake gemeenschappelijke bepalingen
      betreffende toestellen onder druk en keuringsmethoden voor deze toestellen (*Pb. E.G.* van 27 september 1976, nr.
      L 262/153).
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel8a
  - number: '9.1'
    text: 'Stoomtoestellen en damptoestellen worden naar de plaats van opstelling onderscheiden in:'
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel9
  - number: 9.1.a
    text: vaste toestellen, zijnde stoomtoestellen en damptoestellen onbeweeglijk opgesteld op een vaste standplaats;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel9
  - number: 9.1.b
    text: |-
      vaartuigtoestellen, zijnde stoomtoestellen opgesteld aan boord van voor het vervoer van personen of lading bestemde
      vaartuigen en aan boord van sleepboten;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel9
  - number: 9.1.c
    text: |-
      vervoerbare toestellen, zijnde alle stoomtoestellen en damptoestellen niet behorende tot een van de voorgaande
      groepen.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel9
  - number: '9.2'
    text: |-
      Tot de vaste stoomtoestellen en damptoestellen worden ook geacht te behoren, stoomtoestellen en damptoestellen
      om een as draaibaar opgesteld op een vaste standplaats, mits het toebehoren, waarvan deze toestellen moeten zijn
      voorzien, onbeweeglijk is opgesteld.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel9
  - number: '9.3'
    text: 'De ruimten van afzonderlijke gedeelten van vaten worden onderscheiden in:'
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel9
  - number: 9.3.a
    text: dampruimten, zijnde ruimten waarin zich geen vloeistof bevindt;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel9
  - number: 9.3.b
    text: vloeistofruimten, zijnde ruimten waarin zich uitsluitend of tevens vloeistof bevindt.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel9
  - number: '10.1'
    text: |-
      De in [artikel 8, lid 1 en 2][ref1], bedoelde grenzen zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel8
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '8'
        hoofdstuk: I
  - number: 10.1.a
    text: |-
      ten aanzien van de werkdruk van stoomtoestellen of damptoestellen of van de afzonderlijke gedeelten van zodanige
      toestellen: 0,5 bar voor stoomketels, alsmede voor vloeistofruimten van vaten, voor zover de zich in die ruimten
      bevindende vloeistof een hogere temperatuur heeft dan zijn kookpunt bij een absolute druk van 1 bar; 1 bar voor
      dampruimten van vaten, alsmede voor vloeistofruimten van vaten, voor zover de zich in die ruimten bevindende
      vloeistof geen hogere temperatuur heeft dan zijn kookpunt bij een absolute druk van 1 bar;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel10
  - number: 10.1.b
    text: 'ten aanzien van de inhoud van stoomketels en dampketels: 0,5 liter;'
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel10
  - number: 10.1.c
    text: |-
      ten aanzien van het product van de getallen, aangevende de inhoud van stoomtoestellen of damptoestellen of van een
      afzonderlijk gedeelte van zodanige toestellen, uitgedrukt in liters, en de werkdruk: 200 voor stoomketels, waarvan
      de werkdruk niet hoger is dan 3 bar; 100 voor dampketels, waarvan de werkdruk niet hoger is dan 3 bar; 600 voor
      vloeistofruimten van vaten, andere dan pijpleidingen, voor zover de zich in die ruimten bevindende vloeistof een
      hogere temperatuur heeft dan zijn kookpunt bij een absolute druk van 1 bar; 1000 voor dampruimten van vaten, andere
      dan pijpleidingen, alsmede voor vloeistofruimten van vaten, andere dan pijpleidingen, voor zover de zich in die
      ruimten bevindende vloeistof geen hogere temperatuur heeft dan zijn kookpunt bij een absolute druk van 1 bar;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel10
  - number: 10.1.d
    text: |-
      ten aanzien van de inwendige middellijn van pijpen: 65 mm voor pijpen, welke aan beide einden of in zichzelf
      zijn gesloten, gedeeltelijk met water zijn gevuld en worden verhit; 145 mm voor pijpleidingen, waarvan de
      bedrijfstemperatuur hoger is dan 400°C, met dien verstande, dat, indien de grenswaarde, bepaald op overeenkomstige
      wijze als in dit lid voor pijpleidingen met een bedrijfstemperatuur niet hoger dan 400°C voorgeschreven, geringer
      is dan 145 mm, deze geringere waarde in de plaats treedt van de hier gestelde grens van 145 mm; (10 000 bar.mm) :
      (p + 10) bar voor pijpleidingen voor damp, indien de bedrijfstemperatuur niet hoger is dan 400°C; (10 000 bar.mm) :
      (p + 30) bar voor pijpleidingen voor vloeistoffen, indien de bedrijfstemperatuur niet hoger is dan 400°C. In deze
      vormen stelt p het getal voor, dat gelijk is aan de waarde van de werkdruk.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel10
  - number: '10.2'
    text: |-
      Behoudens het bepaalde in het vijfde lid wordt geacht, dat de werkdruk van stoomtoestellen of damptoestellen of van
      afzonderlijke gedeelten van zodanige toestellen gelijk is aan de druk, welke overeenkomt met de belasting van de
      veiligheidskleppen of met de hoogte van de veiligheidsbuizen.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel10
  - number: '10.3'
    text: |-
      Bij het berekenen van de op veiligheidskleppen aan te brengen belasting wordt aangenomen, dat de werkdruk tegen de
      klep een druk uitoefent op een oppervlak, begrensd door een cirkel, waarvan de middellijn 2 mm groter is dan die
      van de klepopening. De hoogte van veiligheidsbuizen is het verschil in hoogte van de bovenste en onderste opening
      van de buis, waarin de vloeistof opstijgt onder invloed van de druk in het toestel, waarop de buis is aangesloten.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel10
  - number: '10.4'
    text: |-
      Zijn ketels niet voorzien van een veiligheidsklep of van een veiligheidsbuis, dan wordt de werkdruk geacht een
      zodanige waarde te bereiken, dat de met de werkdruk verband houdende grenzen worden overschreden. Zijn vaten op een
      ruimte, waarin gas, damp of vloeistof door leidingen wordt aangevoerd, niet voorzien van een veiligheidsklep, dan
      wordt de werkdruk van die ruimte geacht gelijk te zijn aan de hoogste van de drukken, waaronder het gas, de damp of
      de vloeistof in die leidingen binnenstroomt.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel10
  - number: '10.5'
    text: |-
      Indien in een afzonderlijk gedeelte van een stoomtoestel of damptoestel uitsluitend vloeistof voorkomt, wordt -
      voor de toepassing van het bepaalde in [artikel 8][ref1] en in het eerste lid van dit artikel - de werkdruk van die
      ruimte geacht gelijk te zijn aan de druk van de verzadigde damp van die vloeistof bij de bedrijfstemperatuur.


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel8
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '8'
        hoofdstuk: I
  - number: '10.6'
    text: |-
      Indien een stoomtoestel of damptoestel, dat wordt verhit en is voorzien van het toebehoren als in dit besluit
      bepaald, tevens is voorzien van een betrouwbare inrichting, welke vóór overschrijding van een bepaalde temperatuur
      verdere verhitting verhindert, wordt - voor de toepassing van het bepaalde in het vijfde lid - geacht, dat de
      bedrijfstemperatuur gelijk is aan die temperatuur.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel10
  - number: '11.1'
    text: 'Als een afzonderlijk gedeelte van een stoomtoestel of damptoestel wordt beschouwd:'
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel11
  - number: 11.1.a
    text: |-
      een ruimte, welke direct noch indirect met een andere ruimte van het stoomtoestel of damptoestel in verbinding
      staat;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel11
  - number: 11.1.b
    text: |-
      een ruimte, welke met een andere ruimte van het stoomtoestel of damptoestel in verbinding staat door in de
      gemeenschappelijke wand van de beide ruimten aanwezige openingen met een gezamenlijke doorlaat van ten hoogste
      20 cm2;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel11
  - number: 11.1.c
    text: |-
      een ruimte, welke met een andere ruimte van het stoomtoestel of damptoestel in verbinding staat door pijpen met een
      gemiddelde lengte van tenminste het tienvoud van de middellijn van een cirkel, waarvan het oppervlak gelijk is aan
      de gezamenlijke doorlaat van de pijpen.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel11
  - number: '11.2'
    text: |-
      Indien de wand tussen twee ruimten zodanig is, dat deze geacht moet worden te zullen bezwijken, wanneer slechts aan
      één zijde de werkdruk heerst, worden deze ruimten - ongeacht het bepaalde in het voorgaande lid - tezamen als een
      ruimte van het stoomtoestel of damptoestel beschouwd.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel11
  - number: '11.3'
    text: |-
      De inhoud van pijpen, uitmondende in een ruimte van een stoomtoestel of damptoestel en deel uitmakende van het
      toestel, wordt geacht tot de inhoud van die ruimte te behoren, echter over geen grotere lengte dan het vijfvoud
      van de inwendige middellijn van de pijp en voor zoveel het betreft pijpen, als bedoeld onder *c* in het eerste lid,
      over geen grotere lengte dan het vijfvoud van de daarin genoemde middellijn.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel11
  - number: '12.1'
    text: |-
      Vergunning tot het in werking brengen van een stoomtoestel of damptoestel kan door de ingevolge
      [artikel 11, lid 1, der Stoomwet][ref1] aangewezen ambtenaar eerst worden verleend, nadat is gebleken, dat het
      gebruik onder de gewenste werkdruk en bij de gewenste bedrijfstemperatuur toelaatbaar is te achten op grond van de
      uitkomsten van:


      [ref1]: https://wetten.overheid.nl/BWBR0002108#Artikel11
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002108
        artikel: '11'
  - number: 12.1.1e
    text: de beoordeling van het gebezigde materiaal;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel12
  - number: 12.1.2e
    text: de beoordeling van de constructie van het toestel;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel12
  - number: 12.1.3e
    text: het onderzoek van de toestand, waarin de samenstellende delen en hun verbindingen zich bevinden;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel12
  - number: 12.1.4e
    text: |-
      de beproeving onder persdruk, met dien verstande dat voor vaten, pijpleidingen zijnde, de beproeving onder persdruk
      achterwege kan blijven, indien het Hoofd van de Dienst daartoe termen aanwezig acht;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel12
  - number: 12.1.5e
    text: |-
      het nader onderzoek, zijnde het onderzoek met betrekking tot de opstelling, de inrichting en de uitrusting van
      het toestel.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel12
  - number: '12.2'
    text: |-
      Indien de hoedanigheid van het gebezigde materiaal niet voldoende en overtuigend blijkt uit de overgelegde opgaven,
      is de ingevolge [artikel 11, lid 1, der Stoomwet][ref1] aangewezen ambtenaar bevoegd verdere proefnemingen voor
      te schrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0002108#Artikel11
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002108
        artikel: '11'
  - number: '12.3'
    text: |-
      Voor de beoordeling van de constructie van het stoomtoestel of damptoestel zijn duidelijke en volledige
      constructietekeningen nodig, uitgevoerd op een daarop aangegeven schaal en vermeldende de hoofdafmetingen en de
      afmetingen van de samenstellende delen en van de verbindingen.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel12
  - number: '12.4'
    text: |-
      Het stoomtoestel of damptoestel moet bij het onderzoek of de beproeving in een daarvoor geschikte toestand zijn
      gebracht en zodanig toegankelijk zijn, als de betrokken ambtenaar van de Dienst noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel12
  - number: '12.5'
    text: |-
      Het Districtshoofd gaat niet over tot de beproeving van het stoomtoestel of damptoestel, wanneer de beoordeling van
      het gebezigde materiaal, of de constructie dan wel het onderzoek van de samenstellende delen of hun verbindingen
      hem daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel12
  - number: '12.6'
    text: |-
      De beproeving geschiedt door middel van waterpersing. Is het gebruik van water tot dit doel naar het oordeel van
      het Hoofd van de Dienst bezwaarlijk, dan kan hij toestaan, dat een andere vloeistof of een gas wordt gebezigd. Hij
      bepaalt in dat geval welke persdruk moet worden uitgeoefend en welke bijzondere maatregelen in acht moeten worden
      genomen.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel12
  - number: '13.1'
    text: |-
      De persdruk po, welke bij de beproeving van een stoomtoestel of damptoestel moet worden uitgeoefend, is afhankelijk
      van de overdruk p tegen de wand van het toestel of tegen de wand van een gedeelte van het toestel, wanneer het
      in werking wordt gebracht. Is de overdruk niet hoger dan 20 bar, dan wordt de persdruk voor een eerste beproeving
      berekend volgens de formule: po = 1,4 p; voor latere beproevingen volgens de formule: po = 1,3 p, met dien
      verstande, dat de persdruk tenminste één bar meer dan de overdruk moet bedragen. Is de overdruk hoger dan 20 bar,
      dan wordt de persdruk voor een eerste beproeving berekend volgens de formule: po = 1,3 p + 2 bar, voor latere
      beproevingen volgens de formule: po = 1,2 p + 2 bar.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel13
  - number: '13.2'
    text: |-
      Op verzoek van belanghebbenden kan een stoomtoestel of damptoestel onder hogere persdruk worden beproefd dan die,
      bedoeld in het voorgaande lid, indien het Districtshoofd van oordeel is, dat op grond van de constructie van het
      toestel daartegen geen bezwaar bestaat.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel13
  - number: '13.3'
    text: |-
      Het Hoofd van de Dienst kan eisen, dat een stoomtoestel of damptoestel onder hogere, door hem vast te stellen,
      persdruk wordt beproefd, indien hij in verband met de bedrijfstemperatuur van het toestel daartoe termen aanwezig
      acht.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel13
  - number: '14.1'
    text: |-
      De beproeving onder persdruk duurt zo lang als nodig is, om de verschillende delen van het stoomtoestel of
      damptoestel behoorlijk te kunnen onderzoeken.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel14
  - number: '14.2'
    text: |-
      Bij de beproeving van een stoomtoestel of damptoestel moet dit zijn voorzien van een aansluiting met een flens van
      40 mm middellijn en 5 mm dikte, of van een andere aansluiting, welke het Districtshoofd in verband met de persdruk
      nodig acht.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel14
  - number: '14.3'
    text: |-
      Ten bewijze van een bevredigende uitkomst van een eerste onderzoek en beproeving van een stoomtoestel
      of damptoestel wordt door de betrokken ambtenaar van de Dienst op de stempelplaat, bedoeld in
      [artikel 25, lid 1][ref1], ter plaatse van elke tapbout een stempelafdruk ingeslagen van een door het Hoofd van
      de Dienst vastgesteld model, welke afdruk ten dele de kop van de tapbout en ten dele het omringende voorvlak
      van de stempelplaat moet beslaan. Tevens wordt door hem een zodanige stempelafdruk ter weerszijden van het in
      [artikel 26, lid 1][ref2], bedoelde registernummer ingeslagen. Bij stoomtoestellen en damptoestellen, welke
      overeenkomstig het bepaalde in [artikel 25, lid 4][ref3], niet zijn voorzien van een stempelplaat, wordt de
      stempelafdruk ingeslagen ter weerszijden van elk ingeslagen registernummer, ook in het geval, dat de beproeving
      achterwege is gebleven op grond van [artikel 12 lid 1 onder 4][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002123#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0002123#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0002123#Artikel12
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '25'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002123
        artikel: '26'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002123
        artikel: '25'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0002123
        artikel: '12'
        hoofdstuk: II
  - number: '15.1'
    text: |-
      Het vergunningsbewijs vermeldt een duidelijke aanwijzing van degene, die als gebruiker van het stoomtoestel, van
      het damptoestel of van meerdere zodanige toestellen, waarop het bewijs betrekking heeft, wordt aangemerkt, een
      opgave omtrent de uitgestrektheid van het verwarmd oppervlak bij ketels en omtrent de grootte van de inhoud bij
      vaten, voorts de gegevens, welke nodig worden geacht met betrekking tot de omstandigheden waaronder en de wijze
      waarop het toestel mag worden gebruikt, alsmede - in voorkomende gevallen - de ontheffing van voorschriften,
      verleend krachtens [artikel 65][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel65
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '65'
        hoofdstuk: VIII
  - number: '15.2'
    text: 'Aan het vergunningsbewijs worden toegevoegd:'
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel15
  - number: 15.2.1e
    text: |-
      een bewijs van onderzoek en beproeving met bijbehorende constructietekening van het toestel of van meerdere gelijke
      toestellen, dan wel meerdere zodanige bewijzen met bijbehorende constructietekening van de toestellen, waarop het
      vergunningsbewijs betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel15
  - number: 15.2.2e
    text: |-
      een aantal aantekeningenbladen, waarop door de betrokken ambtenaar van de Dienst bij latere keuringen zijn
      bevindingen aangaande het toestel of de toestellen, waarop het vergunningsbewijs betrekking heeft, worden vermeld.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel15
  - number: '15.3'
    text: |-
      Het bewijs van onderzoek en beproeving, als bedoeld in het voorgaande lid, vermeldt - voor zover de daartoe
      strekkende gegevens bekend zijn - de gegevens bedoeld in [artikel 25, lid 3][ref1], alsmede die betreffende de aard
      van het materiaal waarvan het toestel is vervaardigd, voorts - indien nodig - de toegestane bedrijfstemperatuur,
      een opgave waaruit blijkt of het toestel al dan niet inwendig kan worden onderzocht en de datum waarop de
      beproeving heeft plaats gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel25
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '25'
        hoofdstuk: III
  - number: '15.4'
    text: |-
      De in de voorgaande leden genoemde stukken worden verenigd tot een boek, aangeduid als contrôleboek. Behalve
      aan de daartoe door het Hoofd van de Dienst gemachtigde ambtenaren is het een ieder verboden in het contrôleboek
      aantekeningen te maken, dan wel stukken daaruit te verwijderen of daaraan toe te voegen.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel15
  - number: '15.5'
    text: |-
      Constructietekeningen, als in dit artikel bedoeld, moeten voldoen aan de eisen, gesteld in
      [artikel 12, lid 3][ref1], en bij de aanvragen, genoemd in de [artikelen 17][ref2], [18][ref3] en [19][ref4] worden
      overgelegd. De tekeningen moeten zijn gevouwen tot op afmetingen van ten hoogste 210 mm bij 297 mm, behoudens een
      uitstekende hechtrand van 20 mm bij 297 mm. Het Districtshoofd kan ten aanzien van de uitvoering en de afmetingen
      van deze tekeningen nadere eisen stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002123#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0002123#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0002123#Artikel19
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '12'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002123
        artikel: '17'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0002123
        artikel: '18'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0002123
        artikel: '19'
        hoofdstuk: II
  - number: '15.6'
    text: |-
      Op drukapparatuur en samenstellen waarop het [Besluit drukapparatuur][ref1] van toepassing is, is het tweede lid,
      onder 1e, derde en vijfde lid niet van toepassing. In aanvulling op het tweede lid wordt ten aanzien van deze
      drukapparatuur en samenstellen de EG-verklaring van overeenstemming ingevolge het [Besluit drukapparatuur][ref2]
      aan het vergunningsbewijs toegevoegd. Het vierde lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010586
      [ref2]: https://wetten.overheid.nl/BWBR0010586
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0010586
      - id: ref2
        bwb_id: BWBR0010586
  - number: '16.1'
    text: |-
      Het verzoek om vergunning tot het in werking brengen van een stoomtoestel of damptoestel moet door de
      belanghebbende schriftelijk worden ingediend bij het Districtshoofd.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel16
  - number: '16.2'
    text: |-
      Nadat is gebleken, dat tegen het verlenen van vergunning geen bezwaar bestaat, wordt het contrôleboek door het
      Districtshoofd aan de gebruiker uitgereikt; in de gevallen, bedoeld in artikel 20, tegen afgifte van het bewijs van
      de voorlopige vergunning, die alsdan vervalt.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel16
  - number: '17.1'
    text: |-
      Betreft het verzoek om vergunning een stoomtoestel of damptoestel, voor het in werking brengen waarvan nog
      nooit vergunning werd verleend, of waarvan de laatstverleende vergunning werd ingetrokken, dan moet de aanvraag
      vermelden:
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel17
  - number: 17.1.1e
    text: de naam en de plaats van vestiging van de gebruiker;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel17
  - number: 17.1.2e
    text: de bestemming van het toestel;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel17
  - number: 17.1.3e
    text: |-
      zo mogelijk de naam van de vervaardiger van het toestel, de plaats waar diens fabriek is gelegen, het
      fabrieksnummer van het toestel en het jaar, waarin het is vervaardigd;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel17
  - number: 17.1.4e
    text: de gewenste werkdruk en de gewenste bedrijfstemperatuur van het toestel;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel17
  - number: 17.1.5e
    text: het materiaal, waarvan het toestel is vervaardigd;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel17
  - number: 17.1.6e
    text: |-
      de van belang zijnde eigenschappen van de stoffen, andere dan stoom of water, welke in het toestel zullen
      voorkomen;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel17
  - number: 17.1.7e
    text: |-
      bij stoomtoestellen of damptoestellen, waarin damp wordt voortgebracht, de grootste hoeveelheid damp, welke per uur
      kan worden ontwikkeld, alsmede de uitgestrektheid van het verwarmd oppervlak;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel17
  - number: 17.1.8e
    text: |-
      indien het toestel van veiligheidskleppen moet zijn voorzien, het aantal en de wijze van belasten van deze kleppen,
      alsmede de middellijn van de klepopening;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel17
  - number: 17.1.9e
    text: de plaats, waar het toestel voor de keuring gereed zal staan.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel17
  - number: '17.2'
    text: |-
      Betreft het verzoek om vergunning een stoomtoestel of damptoestel, waarvan het gebruik wordt gewenst met afwijking
      van hetgeen in de bestaande vergunning is omschreven, dan moet de aanvraag de aard van de wijziging vermelden,
      alsmede de daarvoor in aanmerking komende opgaven, bedoeld in het voorgaande lid. Hierbij is overlegging
      vereist van het bestaande vergunningsbewijs en, indien het Districtshoofd dit nodig oordeelt, tevens van een
      constructietekening in tweevoud van het toestel.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel17
  - number: '18'
    text: |-
      Wanneer een bewijs van een vergunning, verleend vóór 15 Maart 1915, dan wel een contrôleboek is beschadigd of
      verloren gegaan, is de gebruiker van het desbetreffende stoomtoestel of damptoestel verplicht hiervan onverwijld
      kennis te geven aan het Districtshoofd. Tevens is overlegging vereist van een constructietekening in tweevoud van
      het toestel.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel18
  - number: '19.1'
    text: |-
      Voor stoomtoestellen en damptoestellen, die buiten het Rijk in werking zullen worden gebracht, wordt, indien
      het onderzoek en de beproeving bevredigende uitkomsten hebben opgeleverd, op schriftelijk verzoek aan het
      Districtshoofd, door deze een bewijs van onderzoek en beproeving uitgereikt.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel19
  - number: '19.2'
    text: |-
      De aanvraag moet de opgaven vermelden, bedoeld in [artikel 17, lid 1, onder 2e, 3e, 4e, 5e, 6e en 9e][ref1].
      Hierbij is overlegging vereist van een constructietekening in tweevoud van het toestel en zo mogelijk van opgaven
      omtrent de uitkomsten van het materiaalonderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel17
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '17'
        hoofdstuk: II
  - number: '20'
    text: 'Door het Districtshoofd kan een voorlopig vergunningsbewijs worden uitgereikt, wanneer:'
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel20
  - number: 20.a
    text: |-
      het onderzoek en de beproeving van het stoomtoestel of damptoestel en het nader onderzoek bevredigende uitkomsten
      hebben opgeleverd en de gebruiker het toestel in werking wenst te brengen vóór de uitreiking van het contrôleboek;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel20
  - number: 20.b
    text: |-
      het stoomtoestel of damptoestel of het toebehoren daarvan niet geheel in orde is bevonden, doch van het gebruik
      geen dadelijk gevaar is te duchten, echter onder voorwaarde, dat binnen een in de voorlopige vergunning gestelde
      termijn de door het Districtshoofd nodig geachte en nader daarin omschreven voorzieningen zijn getroffen, bij
      gebreke waarvan de vergunning vervalt;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel20
  - number: '21.1'
    text: 'Het gebruik van gietijzer is verboden voor:'
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel21
  - number: 21.1.a
    text: ketels, voor het in werking brengen waarvan vergunning is vereist;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel21
  - number: 21.1.b
    text: pijpleidingen en gedeelten daarvan, geen korte verbindingsstukken zijnde, als bedoeld onder *g*;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel21
  - number: 21.1.c
    text: |-
      vaten, voor het in werking brengen waarvan vergunning is vereist en welke zodanig in een pijpleiding zijn
      opgenomen, dat zij als een gedeelte daarvan zijn te beschouwen;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel21
  - number: 21.1.d
    text: |-
      van aangegoten tappen voorziene eindvlakken van vaten, welke op deze tappen om een horizontale of hellende as
      draaibaar zijn, indien de uitwendige middellijn van de eindvlakken meer bedraagt dan 1500 mm en tevens de werkdruk
      hoger is dan 3 bar;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel21
  - number: 21.1.e
    text: de voor het sluiten van deksels vereiste knevels, alsmede voor huizen van kranen;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel21
  - number: 21.1.f
    text: |-
      indien de werkdruk hoger is dan 3 bar, voor tuiten, bochtstukken en andere buisvormige verbindingsstukken aan een
      stoomketel of dampketel en voor huizen van afsluiters en kleppen, welke de vloeistofruimte van een ketel afsluiten;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel21
  - number: 21.1.g
    text: |-
      indien de werkdruk hoger is dan 3 bar en tevens de som van de getallen, aangevende de middellijn van
      de doorlaatopening in millimeters en het zesvoud van de werkdruk, groter is dan 150, voor potten van
      veiligheidskleppen, voor huizen van afsluiters en kleppen, andere dan die bedoeld onder *f,* alsmede voor korte
      bocht-, spruit- en andere verbindingsstukken in pijpleidingen, met dien verstande, dat dit verbod niet geldt
      ten aanzien van onderdelen, waardoor vloeistof wordt gevoerd met een temperatuur lager dan zijn kookpunt bij een
      absolute druk van 1 bar.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel21
  - number: '21.2'
    text: Het gebruik van brons, messing en roodkoper is verboden, wanneer de metaaltemperatuur meer kan bedragen dan 214°C.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel21
  - number: '21.3'
    text: |-
      Het Hoofd van de Dienst is bevoegd ten aanzien van de uitvoering van stoomtoestellen en damptoestellen en hun
      toebehoren eisen te stellen, alsmede het gebruik van bepaalde materialen te verbieden, indien hij deze voor het
      gestelde doel gevaarlijk of niet geschikt acht.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel21
  - number: '22.1'
    text: |-
      Een stoomtoestel of damptoestel moet op een betrouwbare ondersteuning zijn opgesteld en indien verschuiven of
      kantelen van het toestel is te duchten voldoende zijn vastgezet.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel22
  - number: '22.2'
    text: |-
      Een stoomtoestel of damptoestel moet, voor zover de aard van het toestel dit toelaat, zodanig zijn opgesteld, dat
      het aan alle zijden is te bereiken. Alle delen van het toebehoren, alsmede flensverbindingen en door middel van
      deksels af te sluiten openingen, moeten behoorlijk bereikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel22
  - number: '22.3'
    text: |-
      Vuurhaarden, alsmede de een stoomketel of dampketel omgevende rookkanalen, moeten toegankelijk zijn, tenzij deze
      zijn voorzien van openingen waardoor de daarbinnen gelegen ketelwand voldoende kan worden waargenomen. Indien zij
      toegankelijk zijn, moeten zij kunnen worden bereikt door doelmatige openingen, welke van voldoende grootte kunnen
      worden geacht, indien de afmetingen 450 mm bij 450 mm bedragen.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel22
  - number: '22.4'
    text: |-
      Het ruim van vaartuigen, waarin een stoomketel is geplaatst, moet door middel van deugdelijke metalen schotten zijn
      afgesloten van de gedeelten, bestemd voor het verblijf van de bemanning of andere personen, dan wel bestemd voor de
      lading of andere opgeslagen goederen.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel22
  - number: '23.1'
    text: |-
      Indien een stoomtoestel of damptoestel is voorzien van een uitwendig aangebracht deksel, dat ten behoeve van het
      gebruik van het toestel afwisselend wordt aangebracht en verwijderd, moet nabij het deksel een proefafsluiter zijn
      geplaatst. De proefafsluiter moet van voldoende grootte zijn, om duidelijk te kunnen waarnemen of in de ruimte,
      waarop deze is aangesloten, druk aanwezig is en moet zodanig zijn geplaatst of van een zodanige pijp zijn voorzien,
      dat bij het openen geen gevaar kan ontstaan.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel23
  - number: '23.2'
    text: |-
      Indien een deksel, als in het voorgaande lid bedoeld, van een zodanige sluiting is voorzien, dat bij het openen de
      verbinding met het toestel langs de gehele omtrek of een groot deel daarvan vrijwel gelijktijdig wordt opgeheven,
      moet de inrichting zo zijn uitgevoerd, dat alleen wanneer het deksel volledig is gesloten, het mogelijk is de
      proefafsluiter te sluiten en gesloten te houden.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel23
  - number: '23.3'
    text: |-
      Indien een deksel, als in het eerste lid bedoeld, wordt gesloten door middel van bouten, moeten deze tegen
      zijdelings afglijden zijn beveiligd.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel23
  - number: '24.1'
    text: |-
      Een stoomtoestel of damptoestel wordt geacht inwendig te kunnen worden onderzocht, indien het is voorzien van de
      nodige mangaten, kijkgaten of voor het gebruik noodzakelijke openingen, waardoor de betrokken ambtenaar van de
      Dienst in staat is het inwendige van het toestel voldoende waar te nemen.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel24
  - number: '24.2'
    text: Het Hoofd van de Dienst beslist of een stoomtoestel of damptoestel inwendig moet kunnen worden onderzocht.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel24
  - number: '24.3'
    text: |-
      Zijn de afmetingen van een stoomtoestel of damptoestel zodanig, dat een inwendige ruimte toegankelijk kan worden
      geacht, dan moet deze ruimte kunnen worden bereikt door een opening van tenminste 300 mm bij 400 mm, tenzij het
      Districtshoofd in verband met de constructie van de rand van de opening grotere afmetingen nodig acht. De opening
      moet zowel buiten als in het toestel behoorlijk bereikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel24
  - number: '25.1'
    text: |-
      Een stoomtoestel of damptoestel, voor het het in werking brengen waarvan vergunning is vereist, moet, behoudens
      het bepaalde in het vierde lid, zijn voorzien van een rechthoekige stempelplaat door middel van tapbouten met
      verzonken kop op een zodanige plaats aan de wand bevestigd, dat van de op de plaat vermelde gegevens te allen
      tijde gemakkelijk kennis kan worden genomen. De plaat moet van messing of brons zijn vervaardigd, de tapbouten van
      roodkoper. Om de kop van de tapbouten moet de plaat een vlak gedeelte van tenminste 5 mm breedte bezitten.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel25
  - number: '25.2'
    text: |-
      Indien de inhoud van een stoomtoestel of damptoestel groter is dan 600 liter, moet de stempelplaat een hoogte van
      80 mm en een breedte van 140 mm bezitten en de bevestiging door middel van vier in de hoeken aangebrachte tapbouten
      geschieden.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel25
  - number: '25.3'
    text: 'Op de stempelplaat moet, voor zover de daartoe strekkende gegevens bekend zijn, duidelijk en duurzaam zijn vermeld:'
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel25
  - number: 25.3.1e
    text: de naam van de vervaardiger van het toestel en de plaats, waar diens fabriek is gelegen;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel25
  - number: 25.3.2e
    text: het jaar, waarin het toestel is vervaardigd;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel25
  - number: 25.3.3e
    text: het getal, aangevende de hoogste druk, waarvoor het Districtshoofd het toestel geschikt acht;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel25
  - number: 25.3.4e
    text: het fabrieksnummer;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel25
  - number: 25.3.5e
    text: een door het Districtshoofd opgegeven registernummer.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel25
  - number: '25.4'
    text: |-
      Bij stoomtoestellen en damptoestellen met een inhoud van ten hoogste 10 liter en bij pijpleidingen behoeven de
      gegevens, in het voorgaande lid bedoeld onder 1e, 2e en 4e, niet te worden vermeld. De overige gegevens moeten
      op een door het Districtshoofd aan te wijzen onderdeel zijn vermeld, terwijl op de overige losse onderdelen het
      registernummer moet voorkomen. Deze gegevens mogen in de wand van het toestel zijn ingeslagen, indien deze van een
      hiertoe geschikt materiaal is vervaardigd.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel25
  - number: '26.1'
    text: Nabij de stempelplaat moet het registernummer in de wand van het stoomtoestel of damptoestel zijn ingeslagen.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel26
  - number: '26.2'
    text: |-
      Wanneer in een inrichting of vaartuig meerdere stoomketels en dampketels of meerdere vaten, voor het in werking
      brengen waarvan vergunning is vereist, zijn opgesteld, moeten deze toestellen elk zijn voorzien van een te allen
      tijde goed zichtbaar, door het Districtshoofd goedgekeurd, volgnummer.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel26
  - number: '26.3'
    text: |-
      Vervoerbare ketels, met uitzondering van die met een verwarmd oppervlak van ten hoogste 1 m², moeten - indien
      voor het in werking brengen vergunning is vereist - zijn voorzien van een plaat, vermeldende de naam en de plaats
      van vestiging van de gebruiker, zoals deze in de vergunning zijn aangegeven, alsmede een door het Districtshoofd
      vastgesteld of goedgekeurd volgnummer. De plaat moet van messing of brons zijn vervaardigd en op een zodanige
      plaats aan de wand zijn bevestigd, dat van de gegevens te allen tijde gemakkelijk kennis kan worden genomen.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel26
  - number: '27.1'
    text: |-
      Elke pijpleiding moet voldoende zijn ondersteund en zodanig zijn aangelegd, dat een vrije uitzetting mogelijk is
      en moet - tenzij het Districtshoofd dit niet nodig acht - zo dicht mogelijk bij het aangesloten stoomtoestel of
      damptoestel van een afsluiter zijn voorzien.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel27
  - number: '27.2'
    text: |-
      Als afsluiters aan stoomtoestellen en damptoestellen of in pijpleidingen mogen zowel klep- als schuifafsluiters
      worden gebruikt. In plaats van afsluiters mogen kranen worden toegepast, tenzij de werkdruk hoger is dan 3 bar en
      tevens de som van de getallen, aangevende de middellijn van de doorlaatopening in millimeters en het zesvoud van de
      werkdruk groter is dan 150.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel27
  - number: '27.3'
    text: |-
      Een kraanplug moet met pakking zijn afgedicht, wanneer de middellijn van de doorlaatopening van de kraan groter is
      dan 20 mm.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel27
  - number: '27.4'
    text: |-
      Een kraanplug mag niet uitsluitend door de inrichting, welke de pakking aandrukt, in het huis zijn opgesloten,
      wanneer de middellijn van de doorlaatopening van de kraan groter is dan 32 mm.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel27
  - number: '27.5'
    text: |-
      Een kraanplug moet op het naar buiten stekend uiteinde van merktekens zijn voorzien, waardoor de loop van de
      kanalen in de plug duidelijk wordt aangegeven.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel27
  - number: '28.1'
    text: |-
      Veiligheidskleppen en veiligheidsbuizen moeten in niet af te sluiten verbinding staan met de ruimten, waarin
      zij een ontoelaatbare drukstijging moeten voorkomen, behoudens in het geval dat de druk uitsluitend ontstaat
      door aanvoer uit een leiding, waarmede de veiligheidsklep of de veiligheidsbuis in niet af te sluiten verbinding
      staat. De klepopening van veiligheidskleppen, behoudens van die, bedoeld in de [artikelen 40, lid 2][ref1], en
      [53, lid 2][ref2], moet een middellijn van tenminste 25 mm hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0002123#Artikel53
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '40'
        hoofdstuk: IV
        paragraaf: II
      - id: ref2
        bwb_id: BWBR0002123
        artikel: '53'
        hoofdstuk: IV
        paragraaf: IV
  - number: '28.2'
    text: |-
      Veiligheidskleppen van stoomtoestellen en damptoestellen, waarin damp kan worden voortgebracht, of waarin een damp
      of een gas wordt aangevoerd, moeten een zodanige klepopening en doorlaat van de toe- en afvoerkanalen hebben, dat
      de grootst mogelijke ontwikkelde of aangevoerde hoeveelheid door die kleppen kan worden afgevoerd, zonder dat de
      druk in het toestel meer dan 15 procent boven de toegestane werkdruk stijgt.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel28
  - number: '28.3'
    text: |-
      In geval van twijfel of veiligheidskleppen voldoen aan de eisen in het voorgaande lid gesteld, hetzij in verband
      met de klepopening, de doorlaat van de toe- of afvoerkanalen of de toestand, waarin zich enig onderdeel van deze
      veiligheidskleppen bevindt, hetzij in verband met de mogelijk geachte dampontwikkeling, kan de betrokken ambtenaar
      van de Dienst die proefneming voorschrijven, welke hem voldoende zekerheid kan verschaffen.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel28
  - number: '29.1'
    text: |-
      Met inachtneming van het bepaalde in het volgende lid, moet het belasten van veiligheidskleppen, hetzij door middel
      van gewichten al of niet met behulp van een hefboom, hetzij rechtstreeks door middel van veren, hetzij door middel
      van druk tegen een aan de klep bevestigde zuiger, geschieden.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel29
  - number: '29.2'
    text: |-
      Gewichtsbelasting is verplicht voor: veiligheidskleppen van vaste toestellen, met uitzondering van: 1e.
      kleppen, waarvan de middellijn van de klepopening kleiner is dan 25 mm; 2e. kleppen, waarvan de overeenkomstig
      [artikel 10, lid 3][ref1], berekende drukkracht kleiner is dan 250 newton of groter dan 5000 newton; 3e. kleppen,
      bedoeld in [artikel 31, lid 3 en 4][ref2]; 4e. hulpkleppen, die het bewegen van een aan een veiligheidsklep
      bevestigde zuiger bewerkstelligen. Veerbelasting is verplicht voor: 1e. veiligheidskleppen van vaartuigtoestellen
      en van vervoerbare toestellen, welke zodanig in werking worden gebracht, dat zij ook tijdens het gebruik in
      beweging zijn; 2e. veiligheidskleppen, waarvan de middellijn van de klepopening kleiner is dan 25 mm.


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002123#Artikel31
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '10'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002123
        artikel: '31'
        hoofdstuk: IV
        paragraaf: I
  - number: '30.1'
    text: |-
      Een uit één stuk bestaand gewicht, waarmede een veiligheidsklep wordt belast, of elk van de schijven, waaruit een
      gewicht is samengesteld, moet massief zijn en de massa van zulk een gewicht of schijf mag niet meer bedragen dan
      25 kg.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel30
  - number: '30.2'
    text: |-
      De schijven moeten alle van dezelfde materiaalsoort zijn vervaardigd en mogen alleen in dikte verschillen; zij
      moeten stuksgewijze, doch niet door uitsluitend zijdelings verschuiven, afneembaar zijn.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel30
  - number: '30.3'
    text: De hefbomen moeten zodanig zijn ingericht, dat het gewicht aan de hefboom niet kan verschuiven.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel30
  - number: '30.4'
    text: |-
      Bij veerbelasting moet de inrichting zodanig zijn, dat bij breuk van de veer de klep niet geheel uit zijn geleiding
      kan worden gedrukt en dat, behalve in het geval bedoeld in [artikel 31, lid 4][ref1], de klep kan worden gelicht.


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel31
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '31'
        hoofdstuk: IV
        paragraaf: I
  - number: '30.5'
    text: |-
      Het instellen van de vereiste veerspanning moet geschieden door het verplaatsen van een van de uiteinden van
      de veren met behulp van schroefdraad. Nadat de juiste stand is bepaald, moeten stelringen of stelplaten worden
      tussengevoegd, die beletten, dat de veren sterker kunnen worden gespannen.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel30
  - number: '30.6'
    text: |-
      Indien de hoeveelheid damp, welke een veiligheidsklep kan afvoeren, regelbaar is, moet het instellen hiervan door
      middel van een zodanige inrichting geschieden, dat deze in de vereiste stand deugdelijk kan worden vastgezet.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel30
  - number: '31.1'
    text: |-
      Veiligheidskleppen, welke zodanig zijn geplaatst, dat zij voor hem, die het stoomtoestel of damptoestel bedient,
      niet gemakkelijk zijn te bereiken, moeten, behalve in het geval bedoeld in het vierde lid, zijn voorzien van een
      inrichting, welke het hem mogelijk maakt van een gemakkelijk bereikbare plaats af de kleppen te lichten.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel31
  - number: '31.2'
    text: |-
      Hooglichtende veiligheidskleppen moeten zijn voorzien van een doelmatige afvoerpijp, welke in de buitenlucht
      uitmondt.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel31
  - number: '31.3'
    text: |-
      Veiligheidskleppen, in verbinding met ruimten van stoomtoestellen of damptoestellen, waarin zich uitsluitend
      vloeistof bevindt, moeten zodanig zijn ingericht, dat bij het openen van de klep de vloeistof niet vrij in de
      ruimte, waarin het toestel staat opgesteld, kan worden uitgedreven.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel31
  - number: '31.4'
    text: |-
      Veiligheidskleppen, in verbinding met ruimten van stoomtoestellen of damptoestellen, waarin zich stoffen bevinden
      die gevaarlijk of schadelijk voor de omgeving zijn, moeten zodanig zijn ingericht en van een zodanige afvoerpijp
      zijn voorzien, dat de bij het openen van de klep ontwijkende stoffen op veilige wijze worden afgevoerd.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel31
  - number: '31.5'
    text: |-
      Het is verboden gebruik te maken van onderdelen van veiligheidskleppen welke niet door de betrokken ambtenaar van
      de Dienst of, indien [artikel 8][ref1] toepassing heeft gevonden, door een instantie als in dat artikel bedoeld,
      zijn onderzocht en goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel8a
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: 8a
        hoofdstuk: I
  - number: '32.1'
    text: |-
      Nabij veiligheidskleppen met veerbelasting en nabij de manometer, waarvan een stoomtoestel of damptoestel
      moet zijn voorzien, moet zich een contrôle-aansluiting, als bedoeld in [artikel 14, lid 2][ref1], bevinden. De
      manometer moet kunnen worden afgesloten en evenals de contrôle-aansluiting met het toestel zijn verbonden door een
      vloeistofhoudende pijp, welke, behoudens in het geval bedoeld in het volgende lid, moet kunnen worden doorgeblazen.


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel14
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '14'
        hoofdstuk: II
  - number: '32.2'
    text: |-
      Het aanbrengen van een contrôle-aansluiting, als bedoeld in het voorgaande lid, is niet vereist, wanneer het
      Districtshoofd heeft verklaard dit, in verband met de eigenschappen van de zich in het toestel bevindende stoffen,
      ongewenst te achten.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel32
  - number: '32.3'
    text: |-
      De manometer moet de druk nauwkeurig kunnen aanwijzen en tenminste de druk kunnen aangeven, welke voor een eerste
      beproeving als persdruk overeenkomstig het bepaalde in [artikel 13, lid 1][ref1], is aangeduid. De schaal moet in
      bar of gelijke veelvouden daarvan zijn verdeeld en bij de wijzerstand, aangevende de toegestane werkdruk, van een
      duidelijk merkteken zijn voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel13
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '13'
        hoofdstuk: II
  - number: '32.4'
    text: |-
      De manometer moet op betrouwbare wijze zijn geijkt; in geval van twijfel omtrent de nauwkeurigheid van de
      aanwijzingen kan de betrokken ambtenaar van de Dienst herijking voorschrijven.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel32
  - number: '32.5'
    text: |-
      De manometer moet op een zodanige plaats zijn aangebracht, dat degene die het stoomtoestel of damptoestel bedient
      de wijzerstand gemakkelijk kan waarnemen.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel32
  - number: '32.6'
    text: |-
      De manometer mag niet op een afvoerleiding of op een veiligheidspot zijn aangesloten. Voor ruimten, welke geheel
      met vloeistof zijn gevuld, moet de manometer op het bovenste deel daarvan zijn geplaatst; in andere gevallen buiten
      het bereik van in die ruimte aanwezige vloeistof.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel32
  - number: '33.1'
    text: |-
      Indien een stoomtoestel of damptoestel moet zijn voorzien van een thermometer, moet deze de temperatuur nauwkeurig
      kunnen aanwijzen. De schaal moet in graden Celsius of gelijke veelvouden daarvan zijn verdeeld, en op de plaats,
      overeenkomende met de toegestane bedrijfstemperatuur, van een duidelijk merkteken zijn voorzien.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel33
  - number: '33.2'
    text: |-
      De thermometer moet op betrouwbare wijze zijn geijkt; in geval van twijfel omtrent de nauwkeurigheid van de
      aanwijzingen kan de betrokken ambtenaar van de Dienst herijking voorschrijven.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel33
  - number: '33.3'
    text: |-
      De thermometer moet op een zodanige plaats zijn aangebracht, dat degene die het stoomtoestel of damptoestel bedient
      van de aanwijzingen gemakkelijk kennis kan nemen.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel33
  - number: '34.1'
    text: |-
      Een peilglas moet door af te sluiten kanalen met het stoomtoestel of damptoestel zijn verbonden. Is het glas
      cylindrisch, dan moet het zijn omgeven door een scherm, dat tegen het stuk stoten van het glas en het wegvliegen
      van de scherven daarvan voldoende beveiliging biedt en dat het waarnemen van de stand van het vloeistofpeil niet
      verhindert.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel34
  - number: '34.2'
    text: |-
      De af te sluiten kanalen van een peilglas, als in het voorgaande lid bedoeld, moeten afzonderlijk kunnen worden
      doorgeblazen, en indien het Hoofd van de Dienst dit nodig oordeelt kunnen worden doorgestoken. Staat een peilglas
      in verbinding met een ruimte, waarin zich voor de omgeving gevaarlijke of schadelijke stoffen bevinden, dan moet
      het zijn voorzien van een zodanige afvoerpijp, dat de bij het doorblazen ontwijkende stoffen op veilige wijze
      worden afgevoerd.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel34
  - number: '34.3'
    text: |-
      Bevindt het vloeistofpeil in een ketel, welke van een peilglas of van twee peilglazen moet zijn voorzien, zich op
      een zodanige hoogte, dat de aanwijzing door het peilglas op de plaats voor het bedienen van de ketel moeilijk is
      waar te nemen, dan moet tevens een ander peiltoestel zijn aangebracht, hetwelk zodanig is ingericht, dat degene
      die de ketel bedient, van de stand van het vloeistofpeil gemakkelijk en met zekerheid kennis kan nemen. Is dit
      peiltoestel voorzien van een cylindrisch glas, dan moet dit door af te sluiten kanalen met het overige gedeelte van
      het toestel zijn verbonden en zijn omgeven door een scherm, als in het eerste lid omschreven.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel34
  - number: '34.4'
    text: |-
      Indien het peilglas op de ketel is aangesloten door middel van pijpen of andere verbindingsstukken, welke langer
      zijn dan de dikte van de bekleding van de aangrenzende ketelwand vergt, mag de doorlaat van deze verbindingsstukken
      geen geringere middellijn hebben dan 30 mm; zijn twee peiltoestellen op de ketel aangesloten door middel van
      gemeenschappelijke pijpen of verbindingsstukken, dan mag de doorlaat daarvan geen geringere middellijn hebben dan
      50 mm. Het Districtshoofd kan, indien de aard van de in de ketel aanwezige stoffen zulks toelaat, toestaan, dat de
      middellijn van deze verbindingsstukken kleiner is dan die in de voorgaande volzin voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel34
  - number: '34.5'
    text: |-
      Indien pijpen of andere verbindingsstukken, als in het voorgaande lid bedoeld, door de rookkanalen worden gevoerd,
      moeten zij afdoende tegen verhitting zijn beschermd.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel34
  - number: '35.1'
    text: |-
      Het toestel, dat vloeistofgebrek in een ketel kenbaar moet maken, moet zodanig zijn ingericht, dat het een
      geluidsignaal voortbrengt, wanneer het vloeistofpeil is gedaald tot op een afstand van ten hoogste 50 mm beneden
      het toegestane laagste vloeistofpeil. Is het toestel met de waterruimte van de stoomketel verbonden door een
      pijp, dan moet deze pijp op gemakkelijke wijze kunnen worden verwijderd en een inwendige middellijn van tenminste
      25 mm hebben. Bij ketels met een verwarmd oppervlak van ten hoogste 10 m², welke worden verhit door middel van
      electrische stroom, dan wel met behulp van een gas- of oliebrander, behoeft het in de eerste volzin bedoelde
      toestel geen geluidsignaal voort te brengen, indien het zodanig is ingericht, dat de ketel niet verder kan worden
      verhit, wanneer het vloeistofpeil is gedaald tot op een afstand van ten hoogste 50 mm beneden het toegestane
      laagste vloeistofpeil.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel35
  - number: '35.2'
    text: |-
      Een smeltbare prop moet in de vatting zodanig zijn opgenomen, dat bij het smelten een opening van tenminste 10 mm
      en ten hoogste 20 mm middellijn geheel vrij komt. De prop moet deze opening tot de bovenzijde vullen.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel35
  - number: '36.1'
    text: |-
      Elk voedingtoestel, waarmede een ketel moet zijn verbonden, moet zelfwerkend zijn, behoudens bij stoomketels,
      waarvan het product van de getallen, aangevende de toegestane werkdruk en het verwarmd oppervlak, het getal 10 niet
      overschrijdt, in welk geval een handpomp is geoorloofd.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel36
  - number: '36.2'
    text: |-
      Stoomketels, welke stoom leveren aan een stoomwerktuig, dat dient voor het voortbewegen van een vaar- of voertuig,
      en stoomketels, welke behalve aan een stoomwerktuig, tevens stoom leveren voor andere doeleinden, moeten zodanig
      met voedingtoestellen zijn verbonden, dat, ook wanneer het stoomwerktuig buiten werking is, de stoomketel voldoende
      kan worden gevoed.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel36
  - number: '36.3'
    text: |-
      Is een ketel met een of meerdere voedingtoestellen verbonden, dan moeten deze toestellen, onverminderd het bepaalde
      in de tweede volzin, in staat zijn de ketel voldoende te voeden. Moet een stoomketel met meerdere voedingtoestellen
      zijn verbonden, dan moeten deze een zodanig vermogen hebben, dat, indien welk van deze voedingtoestellen ook buiten
      werking is, de ketel voldoende kan worden gevoed. Indien een stoomketel door middel van twee voedingleidingen met
      de voedingtoestellen moet zijn verbonden, moeten deze toestellen zodanig aan de voedingleidingen zijn aangesloten,
      dat, indien welke van deze leidingen ook wordt afgesloten, de stoomketel voldoende kan worden gevoed.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel36
  - number: '36.4'
    text: |-
      Aan het einde van elke voedingleiding moet een terugslagklep zijn geplaatst, welke van de ketel moet kunnen worden
      afgesloten.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel36
  - number: '37.1'
    text: |-
      Een ketel wordt geacht voldoende te kunnen worden gevoed, wanneer bij de grootst mogelijke dampontwikkeling in de
      gevallen, bedoeld in [artikel 36, lid 3][ref1], kan worden verhinderd, dat het vloeistofpeil daalt.


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel36
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '36'
        hoofdstuk: IV
        paragraaf: I
  - number: '37.2'
    text: |-
      In geval van twijfel of voedingtoestellen en voedingleidingen zodanig zijn, dat is voldaan aan de in het voorgaande
      lid gestelde eis, hetzij in verband met de aard van deze toestellen, de doorlaat van de voedingleidingen of de
      toestand, waarin zich enig onderdeel bevindt, hetzij in verband met de mogelijk geachte dampontwikkeling, kan de
      betrokken ambtenaar van de Dienst die proefneming voorschrijven, welke hem voldoende zekerheid kan verschaffen.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel37
  - number: '38.1'
    text: |-
      Een spuiafsluiter van een ketel moet van zodanige bijzondere constructie zijn, dat er waarborg bestaat, dat
      daarmede een dichte afsluiting wordt verkregen.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel38
  - number: '38.2'
    text: |-
      Elke spui-inrichting moet zodanig zijn aangebracht en, indien het Districtshoofd dit nodig acht, van een zodanige
      pijpleiding zijn voorzien, dat bij het openen van de spuiafsluiter geen gevaar kan ontstaan.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel38
  - number: '38.3'
    text: |-
      Is een spui-inrichting van een tweede spuiafsluiter voorzien, welke niet voldoet aan de in het eerste lid gestelde
      eis, dan moet de in dat lid bedoelde spuiafsluiter steeds zijn gesloten, wanneer niet wordt gespuid.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel38
  - number: '38.4'
    text: |-
      Indien een spui-inrichting uitsluitend dient voor het aftappen van vloeistof, behoeft de afsluiter niet van
      bijzondere constructie te zijn.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel38
  - number: '39.1'
    text: |-
      De openingen, waardoor delen van het toebehoren, als bedoeld in de [artikelen 28][ref1], [32][ref2], [34][ref3],
      [35][ref4] en [36][ref5], met een stoomtoestel of damptoestel in verbinding staan, moeten, indien het
      Districtshoofd daartoe termen aanwezig acht, zodanig zijn beschermd, dat de in het toestel aanwezige stoffen geen
      verstopping kunnen veroorzaken.


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0002123#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0002123#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0002123#Artikel35
      [ref5]: https://wetten.overheid.nl/BWBR0002123#Artikel36
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '28'
        hoofdstuk: IV
        paragraaf: I
      - id: ref2
        bwb_id: BWBR0002123
        artikel: '32'
        hoofdstuk: IV
        paragraaf: I
      - id: ref3
        bwb_id: BWBR0002123
        artikel: '34'
        hoofdstuk: IV
        paragraaf: I
      - id: ref4
        bwb_id: BWBR0002123
        artikel: '35'
        hoofdstuk: IV
        paragraaf: I
      - id: ref5
        bwb_id: BWBR0002123
        artikel: '36'
        hoofdstuk: IV
        paragraaf: I
  - number: '39.2'
    text: |-
      Een gemeenschappelijke manometer ten behoeve van meerdere stoomtoestellen en damptoestellen is geoorloofd, indien
      deze zodanig is aangebracht, dat geen van deze toestellen in werking kan worden gebracht, zonder dat de manometer
      met het toestel in verbinding staat op de wijze, als in dit hoofdstuk bepaald.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel39
  - number: '39.3'
    text: |-
      Een bepaling, als in het voorgaande lid bedoeld, geldt eveneens ten aanzien van veiligheidskleppen en
      voedingtoestellen, met dien verstande, dat het bepaalde in de [artikelen 28, lid 2][ref1], en [37][ref2] ook van
      kracht is, wanneer de stoomtoestellen en damptoestellen alle in werking zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0002123#Artikel37
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '28'
        hoofdstuk: IV
        paragraaf: I
      - id: ref2
        bwb_id: BWBR0002123
        artikel: '37'
        hoofdstuk: IV
        paragraaf: I
  - number: '40.1'
    text: |-
      Een ketel met een verwarmd oppervlak van ten hoogste 1 m² moet zijn voorzien van een veiligheidsklep; andere ketels
      moeten zijn voorzien van tenminste twee veiligheidskleppen. Ketels, waarvan het verwarmd oppervlak meer bedraagt
      dan 1 m² doch ten hoogste 10 m², welke worden verhit door middel van electrische stroom, dan wel met behulp van een
      gas- of oliebrander, kunnen in de plaats van een van deze veiligheidskleppen zijn voorzien van een toestel, hetwelk
      vóór overschrijding van de toegestane werkdruk bewerkt, dat de ketel niet verder kan worden verhit.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel40
  - number: '40.2'
    text: |-
      De klepopening van de veiligheidsklep van een ketel met een verwarmd oppervlak van ten hoogste 0,2 m² moet een
      middellijn hebben van tenminste 10 mm.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel40
  - number: '40.3'
    text: |-
      Bij stoomketels, welke met de hand worden gestookt en waarvan de vuurhaard onder natuurlijke trek staat, wordt
      geacht, dat de klepopening van de veiligheidskleppen voldoende is, wanneer het getal, aangevende de middellijn van
      deze opening in millimeters, een waarde heeft, welke niet kleiner is dan die van de vorm: , indien geen grotere
      waarde heeft dan 4; , indien een grotere waarde heeft dan 4. In deze vormen is: F het verwarmd oppervlak van de
      stoomketel; p1 de toegestane werkdruk van de stoomketel.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel40
  - number: '40.4'
    text: |-
      Een van de veiligheidskleppen, aangebracht op een stoomketel, welke stoom levert aan een stoomwerktuig dat dient
      voor het voortbewegen van een zeewaardig vissersvaartuig, moet een klepopening hebben met een middellijn van
      tenminste 50 mm en zodanig zijn ingericht, dat door verzegeling waarborg wordt verkregen, dat de belasting van de
      klep niet wordt gewijzigd. Het verzegelen geschiedt door de betrokken ambtenaar van de Dienst.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel40
  - number: '41'
    text: |-
      Een ketel moet zijn voorzien van een manometer en, indien het Districtshoofd dit nodig oordeelt, van een of
      meerdere thermometers.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel41
  - number: '42.1'
    text: |-
      Een ketel met een verwarmd oppervlak van ten hoogste 5 m² moet zijn voorzien van een peilglas; een vaartuigketel
      met een verwarmd oppervlak groter dan 5 m² moet zijn voorzien van tenminste twee peilglazen; andere ketels moeten
      zijn voorzien van tenminste twee peiltoestellen, waarvan één een peilglas moet zijn.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel42
  - number: '42.2'
    text: |-
      Nabij elk peilglas moet het door het Districtshoofd vastgestelde toegestane laagste vloeistofpeil op de ketel
      zijn aangegeven door middel van een van messing of brons vervaardigde strook, waarvan de hartlijn samenvalt
      met de genoemde peilhoogte. Op deze strook moet bij stoomketels "laagste waterpeil", bij dampketels "laagste
      vloeistofpeil" duidelijk en duurzaam zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel42
  - number: '42.3'
    text: |-
      Een peilglas moet zodanig op een ketel zijn aangebracht, dat de vloeistof in het glas slechts zichtbaar is tot
      op een afstand van 50 mm beneden de in het voorgaande lid bedoelde hartlijn of zoveel meer als het Districtshoofd
      nodig acht.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel42
  - number: '43.1'
    text: |-
      Vaste en vervoerbare ketels, met uitzondering van die genoemd in het volgende lid en van die welke overeenkomstig
      het bepaalde in het derde lid van een smeltbare prop zijn voorzien, moeten zijn voorzien van een toestel, dat
      vloeistofgebrek in de ketel kenbaar maakt.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel43
  - number: '43.2'
    text: 'Een toestel, als in het voorgaande lid bedoeld, is niet vereist voor:'
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel43
  - number: 43.2.a
    text: |-
      verticaal opgestelde cylindrische ketels, waarvan de verticale wand niet, of uitsluitend met behulp van een onder
      de bodem van de ketel geplaatste gasbrander, wordt verhit;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel43
  - number: 43.2.b
    text: vervoerbare stoomketels, opgesteld op of in drijvende inrichtingen.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel43
  - number: '43.3'
    text: |-
      Vervoerbare stoomketels, voorzien van vuurkisten, waarin het hoogste punt van het voor de verdamping bestemde
      gedeelte van het verwarmd oppervlak is gelegen, mogen ter plaatse van dat punt zijn voorzien van een smeltbare
      prop.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel43
  - number: '44.1'
    text: |-
      Vaste en vervoerbare stoomketels, waarvan het verwarmd oppervlak niet groter is dan 25 m², vaartuigketels, waarvan
      het verwarmd oppervlak niet groter is dan 5 m² en dampketels moeten met een voedingtoestel zijn verbonden. Andere
      ketels moeten met tenminste twee voedingtoestellen zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel44
  - number: '44.2'
    text: |-
      Vaartuigketels, waarvan het verwarmd oppervlak groter is dan 5 m², moeten van tenminste twee voedingleidingen zijn
      voorzien.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel44
  - number: '44.3'
    text: |-
      Indien de wijze, waarop ketels in werking zijn, van dien aard is, dat voor het veilig gebruik een voortdurende
      circulatie van de vloeistof door de ketel door middel van een pomp moet worden onderhouden, moet de inrichting
      zodanig zijn, dat - wanneer deze pomp tot stilstand komt - onmiddellijk een tweede pomp wordt ingeschakeld of de
      ketel niet verder kan worden verhit.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel44
  - number: '45'
    text: Ketels moeten op de plaatsen waar het Districtshoofd dit nodig acht van een spui-inrichting zijn voorzien.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel45
  - number: '46.1'
    text: 'Ketels, waarin geen dampontwikkeling plaats vindt, moeten zijn voorzien van:'
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel46
  - number: 46.1.1e
    text: een veiligheidsklep of een veiligheidsbuis;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel46
  - number: 46.1.2e
    text: een manometer;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel46
  - number: 46.1.3e
    text: een thermometer, indien het Districtshoofd dit nodig oordeelt;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel46
  - number: 46.1.4e
    text: |-
      een voedingtoestel, tenzij de ketel is aangesloten op een expansievat van voldoende grootte, hetwelk met de
      buitenlucht in open verbinding staat;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel46
  - number: 46.1.5e
    text: een spui-inrichting op de plaatsen waar het Districtshoofd dit nodig acht.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel46
  - number: '46.2'
    text: |-
      Indien de wijze, waarop ketels als bedoeld in het voorgaande lid in werking zijn, van dien aard is, dat een
      voortdurende circulatie van de vloeistof door de ketel en de daarmede verbonden warmte-opnemende toestellen wordt
      onderhouden door middel van een pomp, moet de inrichting zodanig zijn, dat - wanneer deze pomp tot stilstand komt -
      onmiddellijk een tweede pomp wordt ingeschakeld of de ketel niet verder kan worden verhit.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel46
  - number: '47'
    text: |-
      Ketels, waarvan het verhitte gedeelte geheel bestaat uit pijpen, waarin de vloeistof uitsluitend van een
      voedingtoestel uit toestroomt en gedurende de doorstroming verdampt, moeten zijn voorzien van:
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel47
  - number: 47.1e
    text: |-
      een of meer veiligheidskleppen, overeenkomstig het bepaalde in [artikel 40, lid 1 en 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel40
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '40'
        hoofdstuk: IV
        paragraaf: II
  - number: 47.2e
    text: een manometer;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel47
  - number: 47.3e
    text: een thermometer, indien het Districtshoofd dit nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel47
  - number: '48.1'
    text: |-
      Ketels, welke zodanig zijn ingericht en in werking worden gebracht, dat damp noch vloeistof buiten de ketel wordt
      gevoerd of slechts in die zin, dat damp in een gesloten omloop wordt gevoerd en tot vloeistof verdicht, waarna de
      vloeistof weer vrij naar de ketel terugvloeit, moeten zijn voorzien van:
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel48
  - number: 48.1.1e
    text: |-
      een of meer veiligheidskleppen, overeenkomstig het bepaalde in [artikel 40, lid 1 en 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel40
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '40'
        hoofdstuk: IV
        paragraaf: II
  - number: 48.1.2e
    text: een manometer;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel48
  - number: 48.1.3e
    text: een thermometer, indien het Districtshoofd dit nodig oordeelt;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel48
  - number: 48.1.4e
    text: |-
      een peilglas, tenzij de ketel ten behoeve van het gebruik regelmatig moet worden geopend en daarbij het
      vloeistofpeil voldoende kan worden waargenomen;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel48
  - number: 48.1.5e
    text: |-
      een toestel als bedoeld in [artikel 35, lid 1][ref1], indien het verwarmd oppervlak groter is dan 5 m²;


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel35
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '35'
        hoofdstuk: IV
        paragraaf: I
  - number: 48.1.6e
    text: een voedingtoestel, indien het verwarmd oppervlak groter is dan 5 m².
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel48
  - number: '48.2'
    text: |-
      Het bepaalde in het voorgaande lid is ook van toepassing op stoomketels, welke ten aanzien van de inrichting en
      werking slechts in zoverre van de in dat lid bedoelde stoomketels afwijken, dat de stoom tevens wordt gebruikt voor
      het doen ontstaan van een vacuum in een ruimte, welke naar het oordeel van het Districtshoofd van voldoend beperkte
      grootte is.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel48
  - number: '49'
    text: 'Ketels, welke worden verhit door electrische stroom door de vloeistof te voeren, moeten zijn voorzien van:'
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel49
  - number: 49.1e
    text: |-
      een of meer veiligheidskleppen, overeenkomstig het bepaalde in [artikel 40, lid 1 en 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel40
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '40'
        hoofdstuk: IV
        paragraaf: II
  - number: 49.2e
    text: een manometer;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel49
  - number: 49.3e
    text: een thermometer, indien het Districtshoofd dit nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel49
  - number: '50'
    text: 'Een vat moet op de ruimte, waarin damp of gas wordt verhit, zijn voorzien van:'
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel50
  - number: 50.1e
    text: een veiligheidsklep;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel50
  - number: 50.2e
    text: een manometer;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel50
  - number: 50.3e
    text: een thermometer en een aftapinrichting op de plaatsen waar het Districtshoofd dit nodig acht.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel50
  - number: '51.1'
    text: 'Een vat, moet op de ruimte waarin door verhitting damp kan worden voortgebracht, zijn voorzien van:'
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel51
  - number: 51.1.1e
    text: tenminste één veiligheidsklep;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel51
  - number: 51.1.2e
    text: een manometer;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel51
  - number: 51.1.3e
    text: een thermometer, indien het Districtshoofd dit nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel51
  - number: '51.2'
    text: |-
      Het bepaalde in het voorgaande lid is niet van toepassing, wanneer de dampdruk bij de bedrijfstemperatuur van het
      vat niet hoger is dan de toegestane werkdruk van de verdampingsruimte.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel51
  - number: '51.3'
    text: |-
      De klepopening van veiligheidskleppen in verbinding staande met ruimten van vaten, welke door stoom worden verhit
      en waarin stoom wordt voortgebracht die buiten deze ruimten wordt gevoerd, wordt voldoende geacht, wanneer het
      getal, aangevende de middellijn van die opening in millimeters, een waarde heeft, welke niet kleiner is dan die van
      de vorm: , indien geen grotere waarde heeft dan 10; , indien een grotere waarde heeft dan 10. In deze vormen is: F
      het verwarmd oppervlak van het vat; p2 de druk van de voor de verhitting dienende stoom; p3 de toegestane werkdruk
      van de verdampingsruimte van het vat.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel51
  - number: '52.1'
    text: |-
      Een vat moet op de ruimte, waarin damp of gas wordt aangevoerd, en waarvan de toegestane werkdruk p2 lager is dan
      de druk p1, waaronder die damp of dat gas kan worden aangevoerd, zijn voorzien van:
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel52
  - number: 52.1.1e
    text: een veiligheidsklep;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel52
  - number: 52.1.2e
    text: een manometer;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel52
  - number: 52.1.3e
    text: een aftapinrichting op de plaatsen waar het Districtshoofd dit nodig acht.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel52
  - number: '52.2'
    text: |-
      Indien de leiding is voorzien van een veiligheidsklep, belast overeenkomstig een druk p2, wordt geacht, dat in
      de leiding achter die klep geen hogere dan deze druk kan heersen, mits ten aanzien van de klepopening is voldaan
      aan het bepaalde in het eerste lid, waarbij voor het bepalen van de daarin genoemde factor in de plaats van de
      druk p2 wordt beschouwd de druk p2. Indien in de leiding vóór de in de voorgaande volzin bedoelde veiligheidsklep
      een betrouwbaar drukverminderingstoestel is aangebracht, dat vóór overschrijding van de druk p2 verdere damp-
      of gasaanvoer verhindert, behoeft de in die volzin bedoelde veiligheidsklep geen grotere middellijn dan 50 mm te
      hebben.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel52
  - number: '53.1'
    text: |-
      Een vat moet op de ruimte, waarin vloeistof wordt aangevoerd en waarvan de toegestane werkdruk lager is dan de
      druk, waaronder die vloeistof kan worden aangevoerd, zijn voorzien van:
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel53
  - number: 53.1.1e
    text: een veiligheidsklep;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel53
  - number: 53.1.2e
    text: een manometer.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel53
  - number: '53.2'
    text: |-
      Een vat moet op de ruimte, waarin een vloeistof, die deze ruimte geheel vult, wordt verhit zonder dat damp kan
      worden voortgebracht, zijn voorzien van:
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel53
  - number: 53.2.1e
    text: een veiligheidsklep;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel53
  - number: 53.2.2e
    text: een manometer.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel53
  - number: '54.1'
    text: |-
      Indien zich in een ruimte, als bedoeld in [artikel 51, lid 1][ref1], een vloeistof bevindt, waarvan de damp
      schadelijk of gevaarlijk is voor de omgeving, wordt geacht, dat aan het bepaalde omtrent veiligheidskleppen is
      voldaan, wanneer het vat op deze ruimte is voorzien van tenminste twee veiligheidsplaatjes, welke breken bij een
      druk, die niet hoger is dan het gemiddelde van de toegestane werkdruk en de persdruk voor een eerste beproeving,
      als bedoeld in [artikel 13, lid 1 en 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0002123#Artikel13
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '51'
        hoofdstuk: IV
        paragraaf: IV
      - id: ref2
        bwb_id: BWBR0002123
        artikel: '13'
        hoofdstuk: II
  - number: '54.2'
    text: |-
      De veiligheidsplaatjes moeten elk afzonderlijk van het vat kunnen worden afgesloten en moeten uitneembaar zijn. Zij
      moeten op zodanige wijze zijn aangebracht, dat de ontwijkende stoffen door een doelmatige afvoerpijp op een veilige
      wijze worden afgevoerd.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel54
  - number: '55.1'
    text: |-
      Ketels, met uitzondering van die, waarbij de in [artikel 10, lid 1, onder ][ref1] bedoelde grens niet wordt
      overschreden, moeten zijn voorzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel10
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '10'
        hoofdstuk: I
  - number: 55.1.1e
    text: |-
      een veiligheidsklep of een veiligheidsbuis, indien het verwarmd oppervlak niet groter is dan 2 m² of in de
      ketel geen dampontwikkeling plaats vindt; in andere gevallen van tenminste twee veiligheidskleppen of een
      veiligheidsbuis;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel55
  - number: 55.1.2e
    text: een manometer;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel55
  - number: 55.1.3e
    text: |-
      een peilglas, tenzij de inrichting van de stoomketel overeenkomt met die, omschreven in de
      [artikelen 46, lid 1][ref1], [47][ref2] of [49][ref3], dan wel in [artikel 48][ref4], voor zover ook daarbij geen
      peilglas is vereist;


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0002123#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0002123#Artikel49
      [ref4]: https://wetten.overheid.nl/BWBR0002123#Artikel48
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '46'
        hoofdstuk: IV
        paragraaf: III
      - id: ref2
        bwb_id: BWBR0002123
        artikel: '47'
        hoofdstuk: IV
        paragraaf: III
      - id: ref3
        bwb_id: BWBR0002123
        artikel: '49'
        hoofdstuk: IV
        paragraaf: III
      - id: ref4
        bwb_id: BWBR0002123
        artikel: '48'
        hoofdstuk: IV
        paragraaf: III
  - number: 55.1.4e
    text: 'een plaat, waarop duidelijk en duurzaam staat vermeld:'
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel55
  - number: 55.1.4e.1°
    text: de hoogste druk in elk afzonderlijk gedeelte, waarbij het toestel geen gevaar oplevert;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel55
  - number: 55.1.4e.2°
    text: de uitgestrektheid van het verwarmd oppervlak;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel55
  - number: 55.1.4e.3°
    text: |-
      de grootte van de inhoud in liters van elk afzonderlijk gedeelte van het toestel, voor zover de werkdruk van het
      betreffende gedeelte hoger is dan 0,5 bar;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel55
  - number: 55.1.4e.4°
    text: een aanduiding van de soort damp of vloeistof, andere dan stoom of water, welke zich in het toestel bevindt.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel55
  - number: '55.2'
    text: |-
      De klepopening van de in het voorgaande lid bedoelde veiligheidskleppen mag - behoudens in het geval, bedoeld in
      de tweede volzin van [artikel 57, lid 1][ref1] - geen kleinere middellijn hebben dan 10 mm indien het verwarmd
      oppervlak niet groter is dan 0,2 m², dan 25 mm indien het verwarmd oppervlak niet groter is dan 1 m² doch groter
      dan 0,2 m², en dan 50 mm in andere gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel57
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '57'
        hoofdstuk: V
  - number: '55.3'
    text: |-
      De in het eerste lid bedoelde veiligheidsbuizen mogen geen kleinere inwendige middellijn hebben dan 25 mm, indien
      het verwarmd oppervlak niet groter is dan 2 m², en dan 50 mm in andere gevallen. Zij moeten zijn gevuld met
      dezelfde soort vloeistof als die in de ketel aanwezig en vorstvrij zijn opgesteld.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel55
  - number: '56.1'
    text: |-
      Vaten of de afzonderlijke gedeelten, waaruit deze toestellen bestaan, moeten zijn voorzien van een veiligheidsklep,
      tenzij de druk daarin op generlei wijze kan stijgen boven de werkdruk, als bedoeld in [artikel 57, lid 1][ref1].
      Het gebruik maken van een inrichting, als bedoeld in [artikel 10, lid 6][ref2], maakt echter het aanbrengen van
      veiligheidskleppen niet overbodig.


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0002123#Artikel10
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '57'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002123
        artikel: '10'
        hoofdstuk: I
  - number: '56.2'
    text: |-
      Ten aanzien van de grootte en het aantal van deze veiligheidskleppen vindt - behoudens in het geval, bedoeld
      in de tweede volzin van [artikel 57, lid 1][ref1] - het bepaalde in de [artikelen 28, lid 1][ref2], [50][ref3],
      [51][ref4], [52][ref5] en [53][ref6] overeenkomstige toepassing, met dien verstande, dat de middellijn van de
      klepopening nimmer groter behoeft te zijn dan 50 mm.


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0002123#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0002123#Artikel50
      [ref4]: https://wetten.overheid.nl/BWBR0002123#Artikel51
      [ref5]: https://wetten.overheid.nl/BWBR0002123#Artikel52
      [ref6]: https://wetten.overheid.nl/BWBR0002123#Artikel53
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '57'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002123
        artikel: '28'
        hoofdstuk: IV
        paragraaf: I
      - id: ref3
        bwb_id: BWBR0002123
        artikel: '50'
        hoofdstuk: IV
        paragraaf: IV
      - id: ref4
        bwb_id: BWBR0002123
        artikel: '51'
        hoofdstuk: IV
        paragraaf: IV
      - id: ref5
        bwb_id: BWBR0002123
        artikel: '52'
        hoofdstuk: IV
        paragraaf: IV
      - id: ref6
        bwb_id: BWBR0002123
        artikel: '53'
        hoofdstuk: IV
        paragraaf: IV
  - number: '56.3'
    text: |-
      Een vat, geen pijpleiding zijnde, moet, indien dit toestel is verbonden met een stoomketel of
      dampketel, voor het gebruik waarvan vergunning is vereist, zijn voorzien van een plaat, als bedoeld in
      [artikel 55, lid 1, onder 4e][ref1], met dien verstande, dat de vermelding van het verwarmd oppervlak daarbij kan
      vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel55
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '55'
        hoofdstuk: V
  - number: '56.4'
    text: Een vat moet op de ruimte, waarin damp of gas wordt verhit, bovendien zijn voorzien van een thermometer.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel56
  - number: '56.5'
    text: |-
      Indien een vat of een afzonderlijk gedeelte daarvan, op grond van het bepaalde in het eerste lid, moet zijn
      voorzien van een veiligheidsklep, moet het op de ruimte, waarmede deze veiligheidsklep in verbinding staat, tevens
      zijn voorzien van een manometer.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel56
  - number: '57.1'
    text: |-
      Stoomtoestellen en damptoestellen mogen slechts worden gebruikt onder een werkdruk, waarbij het toestel geen gevaar
      oplevert; zijn zij voorzien van veiligheidskleppen of veiligheidsbuizen, dan mogen de veiligheidskleppen niet
      zwaarder zijn belast en de veiligheidsbuizen niet hoger zijn, dan overeenkomt met die werkdruk. In afwijking van
      het bepaalde omtrent de grootte van veiligheidskleppen en veiligheidsbuizen in de [artikelen 55, lid 2 en 3][ref1],
      en [56, lid 2][ref2], mogen deze een kleinere middellijn hebben dan de vastgestelde kleinste middellijn, indien het
      Hoofd van de Dienst schriftelijk heeft verklaard, dat hij deze kleinere middellijn voldoende acht.


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0002123#Artikel56
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '55'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002123
        artikel: '56'
        hoofdstuk: V
  - number: '57.2'
    text: |-
      Veiligheidskleppen en veiligheidsbuizen moeten voldoen aan het bepaalde in
      [artikel 28, lid 1, eerste volzin][ref1]. Gewichtsbelasting is verplicht voor veiligheidskleppen van vaste
      toestellen, waarvan de middellijn van de klepopening niet kleiner is dan 50 mm.


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel28
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '28'
        hoofdstuk: IV
        paragraaf: I
  - number: '57.3'
    text: |-
      Indien de veiligheidskleppen, als in dit artikel bedoeld, zijn voorzien van veerbelasting, moet - behoudens in het
      geval bedoeld in [artikel 32, lid 2][ref1] - op de ruimte, waarmede deze veiligheidskleppen in verbinding staan,
      tevens een contrôle-aansluiting zijn aangebracht, als bedoeld in [artikel 14, lid 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0002123#Artikel14
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '32'
        hoofdstuk: IV
        paragraaf: I
      - id: ref2
        bwb_id: BWBR0002123
        artikel: '14'
        hoofdstuk: II
  - number: '57.4'
    text: |-
      Indien een stoomtoestel of damptoestel is voorzien van een peilglas, moet dit zijn ingericht, als omschreven in
      [artikel 34, lid 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel34
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '34'
        hoofdstuk: IV
        paragraaf: I
  - number: '58.1'
    text: 'De gebruiker van een stoomtoestel of damptoestel is verplicht zorg te dragen:'
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel58
  - number: 58.1.1e
    text: |-
      dat het toestel en het toebehoren daarvan in behoorlijke staat van onderhoud verkeren en voldoende worden
      gereinigd;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel58
  - number: 58.1.2e
    text: dat manometers, thermometers en peiltoestellen voldoende zijn verlicht;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel58
  - number: 58.1.3e
    text: |-
      dat onderdelen van het toebehoren, welke tijdens de werking van het toestel onbruikbaar kunnen worden en
      verwisselbaar zijn, in voldoende mate ter beschikking zijn van hem, die het toestel bedient;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel58
  - number: 58.1.4e
    text: |-
      dat het vergunningbewijs tot het in werking brengen van het toestel in goede staat wordt gehouden en steeds bij het
      toestel aan de betrokken ambtenaar van de Dienst kan worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel58
  - number: '58.2'
    text: 'De gebruiker van het stoomtoestel of damptoestel en hij, die het bedient, zijn verplicht zorg te dragen:'
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel58
  - number: 58.2.1e
    text: |-
      dat veiligheidskleppen en andere bewegende onderdelen van het toebehoren gemakkelijk gangbaar blijven en de
      veiligheidskleppen niet zwaarder worden belast dan overeenkomt met de toegestane werkdruk;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel58
  - number: 58.2.2e
    text: |-
      dat het bepaalde in [artikel 38, lid 3][ref1], wordt nageleefd, de verzegeling, bedoeld in
      [artikel 40, lid 4][ref2], niet wordt beschadigd of verbroken, het toestel, bedoeld in [artikel 43, lid 1][ref3],
      niet wordt belet te werken en een van de veiligheidsplaatjes, als bedoeld in [artikel 54][ref4], in open verbinding
      met het toestel blijft;


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0002123#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0002123#Artikel43
      [ref4]: https://wetten.overheid.nl/BWBR0002123#Artikel54
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '38'
        hoofdstuk: IV
        paragraaf: I
      - id: ref2
        bwb_id: BWBR0002123
        artikel: '40'
        hoofdstuk: IV
        paragraaf: II
      - id: ref3
        bwb_id: BWBR0002123
        artikel: '43'
        hoofdstuk: IV
        paragraaf: II
      - id: ref4
        bwb_id: BWBR0002123
        artikel: '54'
        hoofdstuk: IV
        paragraaf: IV
  - number: 58.2.3e
    text: |-
      dat het toestel, na buiten gebruik te zijn geweest, niet in werking wordt gebracht dan nadat is gebleken, dat
      flensverbindingen, pakkingbussen en deksels doelmatig zijn verpakt.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel58
  - number: '58.3'
    text: 'Hij, die het stoomtoestel of damptoestel bedient, is verplicht zorg te dragen:'
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel58
  - number: 58.3.1e
    text: |-
      dat hij zich vergewist van bij inwendige reiniging of tijdens het gebruik van het toestel redelijkerwijze waar te
      nemen gebreken of sporen van lekkage en van zijn bevindingen kennis geeft aan de gebruiker;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel58
  - number: 58.3.2e
    text: |-
      dat tijdens het gebruik van een ketel het vloeistofpeil in de ketel niet beneden het toegestane laagste
      vloeistofpeil daalt.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel58
  - number: '59'
    text: |-
      De gebruiker van een stoomtoestel of damptoestel, voor het in werking brengen waarvan vergunning is vereist, is
      verplicht aan het Districtshoofd kennis te geven van:
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel59
  - number: 59.a
    text: het tijdelijk of blijvend ten gebruike aan anderen afstaan van het toestel;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel59
  - number: 59.b
    text: |-
      de aard van elk gebrek, dat aan het toestel of aan het toebehoren is ontstaan, en van elke herstelling, die hij
      voornemens is dit te doen ondergaan;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel59
  - number: 59.c
    text: |-
      elke wijziging, die hij voornemens is te brengen in de opstelling van het toestel, in het toestel zelf of in het
      toebehoren daarvan;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel59
  - number: 59.d
    text: |-
      het tijdstip, waarop het toestel van de bekleding zal worden ontdaan, waarop het gelicht of gekanteld zal worden of
      waarop pijpen of delen van het binnenwerk zullen zijn uitgenomen;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel59
  - number: 59.e
    text: elk voorval, dat van invloed is of kan zijn op de toestand, waarin het toestel verkeert.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel59
  - number: '60.1'
    text: |-
      Een stoomtoestel of damptoestel wordt telkens na verloop van een termijn, als in het volgende lid bepaald, aan een
      keuring onderworpen.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel60
  - number: '60.2'
    text: 'De termijn bedraagt:'
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel60
  - number: 60.2.a
    text: één jaar voor vaartuigketels met een verwarmd oppervlak groter dan 5 m²;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel60
  - number: 60.2.b
    text: twee jaar voor andere stoomketels, alsmede voor dampketels;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel60
  - number: 60.2.c
    text: vier jaar voor vaten.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel60
  - number: '60.3'
    text: |-
      Het Hoofd van de Dienst kan, indien hij in verband met de aard van de in het toestel aanwezige stoffen zulks
      noodzakelijk acht, een kortere termijn dan die genoemd in het voorgaande lid vaststellen. Het Hoofd van de Dienst
      kan, indien zulks om bijzondere redenen nodig is, toestaan, dat een termijn wordt overschreden. Het Districtshoofd
      kan, indien zulks in het belang van de uitoefening van de dienst wenselijk is, de eerste keuring na het uitreiken
      van het contrôleboek doen geschieden binnen de in lid 2 bedoelde termijn.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel60
  - number: '60.4'
    text: 'De in het eerste lid bedoelde keuring omvat:'
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel60
  - number: 60.4.a
    text: |-
      bij stoomtoestellen en damptoestellen, welke inwendig kunnen worden onderzocht, een inwendig onderzoek en op
      het tijdstip, waarop het Districtshoofd zulks nodig acht, tevens een uitwendig onderzoek, een beproeving of een
      onderzoek van het materiaal;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel60
  - number: 60.4.b
    text: |-
      bij stoomtoestellen en damptoestellen, welke niet inwendig kunnen worden onderzocht, uitgezonderd die bedoeld onder
      *c,* een beproeving en op het tijdstip, waarop het Districtshoofd zulks nodig acht, tevens een uitwendig onderzoek
      of een onderzoek van het materiaal;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel60
  - number: 60.4.c
    text: |-
      bij vaten, pijpleidingen zijnde, een onderzoek van de daarvoor in aanmerking komende flens-, las-,
      schroefverbindingen en dergelijke en op het tijdstip, waarop het Districtshoofd zuks nodig acht, tevens een
      uitwendig onderzoek, een beproeving en een onderzoek van het materiaal.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel60
  - number: '60.5'
    text: |-
      Het Districtshoofd kan, wanneer hij daartoe termen aanwezig acht, eisen, dat een onderzoek wordt ingesteld met
      betrekking tot de aard en de samenstelling van de in de stoomtoestellen en damptoestellen aanwezige stoffen.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel60
  - number: '61.1'
    text: 'Ten behoeve van een keuring is de gebruiker verplicht zorg te dragen:'
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel61
  - number: 61.1.1e
    text: |-
      dat het stoomtoestel of damptoestel op de aangegeven plaats en gedurende de daarvoor bepaalde dag toegankelijk en
      daartoe gereed is;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel61
  - number: 61.1.2e
    text: dat het toestel op afdoende wijze is gezuiverd van gevaarlijke of schadelijke stoffen;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel61
  - number: 61.1.3e
    text: dat een schoon en doelmatig ketelpak aanwezig is;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel61
  - number: 61.1.4e
    text: dat de betrokken ambtenaar van de Dienst behoorlijk gelegenheid wordt verschaft tot verkleden en reinigen.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel61
  - number: '61.2'
    text: 'Ten behoeve van een inwendig onderzoek is de gebruiker bovendien verplicht zorg te dragen:'
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel61
  - number: 61.2.1e
    text: |-
      dat vuurramen, roosters, vuurbruggen en andere onderdelen, die het onderzoek zouden kunnen belemmeren, alsmede
      obstakels nabij het stoomtoestel of damptoestel, zijn verwijderd;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel61
  - number: 61.2.2e
    text: |-
      dat alle delen van het stoomtoestel of damptoestel en de bijbehorende vuurhaarden en rookkanalen goed zijn
      gereinigd en voldoende zijn afgekoeld;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel61
  - number: 61.2.3e
    text: |-
      dat alle verbindingsleidingen met andere, in werking zijnde, stoomtoestellen en damptoestellen, op betrouwbare
      wijze zijn afgesloten;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel61
  - number: 61.2.4e
    text: |-
      dat de veiligheidskleppen, voor zover niet is voorgeschreven, dat deze moeten zijn verzegeld, uit elkaar zijn
      genomen;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel61
  - number: 61.2.5e
    text: dat smeltbare proppen uit hun vattingen zijn genomen.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel61
  - number: '61.3'
    text: |-
      Gelijke verplichtingen als die, bedoeld in het voorgaande lid onder 1e en 2e, rusten eveneens op de gebruiker ten
      behoeve van een beproeving en een uitwendig onderzoek.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel61
  - number: '62.1'
    text: |-
      Ten behoeve van een onderzoek of een beproeving is het Districtshoofd bevoegd voor te schrijven, dat het
      stoomtoestel of damptoestel wordt gelicht, gekanteld of ontdaan van de bekleding.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel62
  - number: '62.2'
    text: |-
      Hebben zich aan een stoomtoestel of damptoestel ernstige gebreken geopenbaard, dan is het Districtshoofd bevoegd
      een herstelling en daarna een beproeving van het toestel voor te schrijven.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel62
  - number: '63.1'
    text: |-
      Aan de gebruiker wordt tenminste drie weken vóór het tijdstip van een keuring, als bedoeld in [artikel 60][ref1],
      schriftelijk kennis gegeven van de dag, waarop en de plaats, waar deze keuring zal geschieden. In deze kennisgeving
      wordt tevens vermeld, hetgeen op grond van het bepaalde in [artikel 62, lid 1][ref2], wordt voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0002123#Artikel62
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '60'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0002123
        artikel: '62'
        hoofdstuk: VII
  - number: '63.2'
    text: |-
      Indien het Districtshoofd daartoe termen aanwezig acht, kan in plaats van de dag worden aangegeven de maand, waarin
      de keuring zal geschieden. De kennisgeving geschiedt in dit geval tenminste drie weken vóór de aanvang van die
      maand.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel63
  - number: '63.3'
    text: |-
      Bestaat bij de gebruiker bezwaar tegen de dag, waarop, de maand, waarin, of de plaats, waar de keuring zal
      geschieden, dan moet deze zijn bezwaar schriftelijk zo spoedig mogelijk en uiterlijk twee weken vóór de aangewezen
      dag of de aanvang van de aangewezen maand ter kennis brengen van het Districtshoofd, die daarmede zo mogelijk
      rekening houdt.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel63
  - number: '64'
    text: |-
      Indien een stoomtoestel of damptoestel zich buiten het Rijk zal bevinden op het tijdstip waarop dit volgens
      een kennisgeving, als bedoeld in [artikel 63, lid 1 en 2][ref1], aan een keuring moet worden onderworpen, is de
      gebruiker verplicht, dit onverwijld aan het Districtshoofd mede te delen. Bevindt het stoomtoestel of damptoestel
      zich bij ontvangst van genoemde kennisgeving reeds buiten het Rijk, dan is hij tevens verplicht, zodra het hier te
      lande is teruggekeerd, daarvan aan het Districtshoofd mededeling te doen.


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel63
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '63'
        hoofdstuk: VII
  - number: '65'
    text: |-
      Indien het Districtshoofd na een onderzoek van een stoomtoestel of damptoestel van oordeel is, dat om de
      bijzondere inrichting of bestemming van het toestel, of dat om andere gegronde redenen gehele, gedeeltelijke of
      voorwaardelijke ontheffing van een of meer van de in dit besluit, krachtens [artikel 2 van de Stoomwet][ref1],
      vastgestelde bepalingen wenselijk is, kan deze door of namens Onze Minister worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002108#Artikel2
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0002108
        artikel: '2'
  - number: '66.1'
    text: 'Een vergunning kan worden ingetrokken, indien is gebleken:'
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel66
  - number: 66.1.a
    text: dat de gebruiker een voorgeschreven herstelling niet doet plaats vinden;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel66
  - number: 66.1.b
    text: |-
      dat de gebruiker nalatig is om te voldoen aan de voorschriften, bij of krachtens de [Stoomwet][ref1] gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0002108
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002108
  - number: 66.1.c
    text: dat het stoomtoestel of damptoestel buiten dienst is gesteld;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel66
  - number: 66.1.d
    text: |-
      dat het stoomtoestel of damptoestel op zodanige wijze wordt gebruikt, dat voor het in werking brengen daarvan geen
      vergunning meer is vereist;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel66
  - number: 66.1.e
    text: |-
      dat het stoomtoestel of damptoestel uit het Rijk is weggevoerd en hier te lande kennelijk niet meer in werking zal
      worden gebracht;
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel66
  - number: 66.1.f
    text: dat het stoomtoestel of damptoestel meer dan drie jaar onafgebroken buiten het Rijk is geweest.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel66
  - number: '66.2'
    text: |-
      In de gevallen, bedoeld in het eerste lid, is de houder van het vergunningsbewijs verplicht, dit ter beschikking
      van het Districtshoofd te stellen.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel66
  - number: '67.1'
    text: |-
      Gebruikers van stoomtoestellen, voor het in werking brengen waarvan vergunningen zijn verleend ingevolge een
      vroeger Koninklijk besluit en zij, die gebruikers van deze stoomtoestellen worden, zijn, zolang de stoomtoestellen
      aan een ononderbroken toezicht van Regeringswege onderworpen zijn gebleven, bevoegd om deze stoomtoestellen met het
      toebehoren, ingericht overeenkomstig de bepalingen van dat besluit, te blijven gebruiken.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel67
  - number: '67.2'
    text: |-
      Zij, die op het tijdstip van het in werking treden van dit besluit stoomtoestellen in gebruik hebben, voor het in
      werking brengen waarvan ingevolge een vroeger Koninklijk besluit geen vergunning was vereist, zijn bevoegd om deze
      stoomtoestellen met het toebehoren, ingericht overeenkomstig de bepalingen van dat vroegere besluit, te blijven
      gebruiken, indien zij van dit gebruik vóór 1 April 1954 aan het Districtshoofd schriftelijk kennis geven. Zij, die
      op het tijdstip van het in werking treden van dit besluit damptoestellen in gebruik hebben, welke krachtens het
      bepaalde in [artikel 4, lid 1, van de Stoomwet][ref1] aan keuring door de Dienst moeten worden onderworpen, zijn
      bevoegd deze damptoestellen onder de bestaande omstandigheden uiterlijk tot 1 Juli 1954 te blijven gebruiken, mits
      zij van dit gebruik vóór 1 April 1954 aan het Districtshoofd schriftelijk kennis geven en deze van oordeel is dat
      het toestel geen gevaar oplevert.


      [ref1]: https://wetten.overheid.nl/BWBR0002108#Artikel4
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002108
        artikel: '4'
  - number: '67.3'
    text: |-
      Gebruikers van stoomtoestellen, voor het in werking brengen waarvan volgens de bepalingen van dit besluit geen
      vergunning is en volgens die van een vroeger Koninklijk besluit geen vergunning was vereist, en waarvan is aan
      te tonen, dat deze stoomtoestellen door hen in gebruik zijn genomen op het tijdstip, dat een vroeger besluit van
      kracht was, zijn bevoegd om deze stoomtoestellen met het toebehoren, ingericht overeenkomstig de bepalingen van dat
      besluit, te blijven gebruiken. Zij, die op het tijdstip van het in werking treden van dit besluit damptoestellen
      in gebruik hebben, welke, op grond van het bepaalde in de [artikelen 8][ref1] en [10][ref2], niet aan keuring door
      de Dienst moeten worden onderworpen, zijn bevoegd deze damptoestellen onder de bestaande omstandigheden te blijven
      gebruiken, mits zij van dit gebruik vóór 1 April 1954 aan het Districtshoofd schriftelijk kennis geven en deze van
      oordeel is, dat het toestel geen gevaar oplevert.


      [ref1]: https://wetten.overheid.nl/BWBR0002123#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002123#Artikel10
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002123
        artikel: '8'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002123
        artikel: '10'
        hoofdstuk: I
  - number: '67.4'
    text: |-
      De in dit artikel bedoelde bevoegdheden gelden niet ten aanzien van onderdelen van het stoomtoestel of damptoestel
      of van het toebehoren van een zodanig toestel, welke na het in werking treden van dit besluit worden aangebracht,
      al of niet ter vervanging van bestaande onderdelen.
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel67
  - number: '68'
    text: |-
      Dit besluit kan worden aangehaald onder de titel "Stoombesluit" en treedt in werking met ingang van dezelfde datum
      als die van het in werking treden van de [Stoomwet][ref1] (*Stb.* 1953, No. 179).


      [ref1]: https://wetten.overheid.nl/BWBR0002108
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0002108
  - number: '69'
    text: |-
      Bij het in werking treden van dit besluit wordt ingetrokken Ons besluit van 17 September 1949 (*Stb.* J 431),
      laatstelijk gewijzigd bij Ons besluit van 11 September 1951 (*Stb.* 418).
    url: https://wetten.overheid.nl/BWBR0002123/2005-08-01#Artikel69
