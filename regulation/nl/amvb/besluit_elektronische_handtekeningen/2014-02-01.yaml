---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_elektronische_handtekeningen
regulatory_layer: AMVB
publication_date: '2017-03-08'
valid_from: '2014-02-01'
bwb_id: BWBR0015047
url: https://wetten.overheid.nl/BWBR0015047/2014-02-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Economische Zaken van 13 november 2002, nr. DGTP/02/03931, Directie
    Wetgeving en Juridische Zaken;

    Gelet op richtlijn nr. 1999/93/EG van het Europees Parlement en de Raad van de Europese Unie van 13 december
    1999 betreffende een gemeenschappelijk kader voor elektronische handtekeningen (PbEG 2000, L 13), alsmede op de
    artikelen 16.1, 18.15, eerste en tweede lid, en 18.17, eerste en vijfde lid, van de Telecommunicatiewet;

    De Raad van State gehoord (advies van 12 december 2002, nr. W 10.02.0509/II);

    Gezien het nader rapport van de Staatssecretaris van Economische Zaken van 7 mei 2003, nr. WJZ/03/00755;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:




                  a. wet:


                  [Telecommunicatiewet][ref1];




                  b. certificatiediensten:


                  het afgeven, beheren en intrekken van gekwalificeerde certificaten door certificatiedienstverleners,
      alsmede andere diensten die samenhangen met het gebruik van elektronische handtekeningen;




                  c. sleutelbeheerdiensten:


                  het genereren, opslaan, verstrekken of vernietigen van cryptografisch sleutelmateriaal dat gebruikt
      wordt voor het aanmaken of het verifiëren van elektronische handtekeningen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009950
  - number: '2.1'
    text: |-
      Een certificatiedienstverlener als bedoeld in [artikel 18.15, eerste lid, van de wet][ref1] voldoet aan de volgende
      eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel18
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '18'
  - number: 2.1.a
    text: |-
      hij beschikt over betrouwbare middelen en hanteert betrouwbare procedures voor het aanbieden van
      certificatiediensten aan het publiek;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.b
    text: |-
      hij past procedures en processen op het gebied van administratie en beheer toe overeenkomstig een beschreven
      kwaliteitssysteem dat in overeenstemming is met de laatste ontwikkelingen op het gebied van kwaliteitssystemen;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.c
    text: |-
      hij maakt uitsluitend gebruik van betrouwbare systemen en producten die procedureel of overeenkomstig de stand der
      techniek beveiligd zijn en die de technische en cryptografische veiligheid van de processen die zij ondersteunen
      garanderen;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.d
    text: |-
      hij neemt adequate maatregelen tegen het vervalsen van de gekwalificeerde certificaten die hij heeft uitgegeven
      en tegen het uitgeven van illegale gekwalificeerde certificaten en, indien hij gegevens voor het aanmaken van
      handtekeningen genereert, garandeert hij de vertrouwelijkheid van het proces waarmee dit gebeurt;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.e
    text: |-
      hij houdt voldoende financiële middelen ter beschikking om in overeenstemming met de eisen van de [wet][ref1] te
      kunnen functioneren;


      [ref1]: https://wetten.overheid.nl/BWBR0009950
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009950
  - number: 2.1.f
    text: |-
      hij heeft personeel in dienst dat deskundig is op het gebied van de aangeboden diensten, met name op het gebied
      van beheer, van de technologie voor elektronische handtekeningen, en van de beveiligingsprocedures die worden
      toegepast;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.g
    text: |-
      hij verifieert, alvorens een gekwalificeerd certificaat af te geven, de identiteit en eventuele specifieke
      attributen van de persoon die als ondertekenaar in dat certificaat wordt aangeduid door de geldigheid van de
      aangeboden documenten te controleren alsmede door de overeenstemming tussen de documenten en de kenmerken van
      de persoon te controleren door middel van visuele controle en zonodig met behulp van andere daartoe geschikte
      middelen;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.h
    text: |-
      hij stelt de datum en het tijdstip van afgifte en van intrekking van een gekwalificeerd certificaat vast met een
      nauwkeurigheid van één minuut of korter;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.i
    text: |-
      hij slaat tijdens de geldigheidsduur van het gekwalificeerde certificaat en gedurende een periode van ten minste
      zeven jaar na de datum waarop de geldigheid van het gekwalificeerde certificaat is verlopen alle relevante gegevens
      met betrekking tot dat gekwalificeerde certificaat op, met name de gegevens die benodigd zijn om in gerechtelijke
      procedures de certificatie te kunnen bewijzen, waaronder ten minste:
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.i.1°
    text: het gekwalificeerde certificaat;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.i.2°
    text: alle gegevens waarmee de verificatie van de identiteit en van de attributen van de aanvrager bewezen kan worden, en
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.i.3°
    text: alle historische gegevens over de afgifte en intrekking van het gekwalificeerde certificaat;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.j
    text: |-
      hij slaat ten behoeve van eigen gebruik en beheer certificaten zodanig op, in verifieerbare vorm en met
      gebruikmaking van betrouwbare systemen, dat:
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.j.1°
    text: alleen bevoegde personen gegevens kunnen invoeren en wijzigen;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.j.2°
    text: de authenticiteit van de informatie kan worden gecontroleerd;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.j.3°
    text: |-
      de certificaten uitsluitend publiekelijk beschikbaar zijn in de gevallen waarvoor de ondertekenaar toestemming
      heeft gegeven, en
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.j.4°
    text: |-
      elke technische wijziging die de genoemde beveiligingsvoorschriften in gevaar kan brengen, voor de gebruiker
      duidelijk is;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.k
    text: |-
      hij zorgt, met inachtneming van de door hem bekendgemaakte tijdsduur tussen verzoek tot intrekking en publicatie
      van die intrekking, voor een veilige en prompte intrekking van de door hem beheerde gekwalificeerde certificaten
      na ontvangst van een daartoe strekkend verzoek van de ondertekenaar of van een door hem aangewezen persoon
      of instantie, welk verzoek voldoet aan de door de certificatiedienstverlener bekendgemaakte procedure voor de
      intrekking van een gekwalificeerd certificaat;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.l
    text: |-
      hij publiceert, gedurende de geldigheid van het afgegeven gekwalificeerde certificaat, en tot ten minste zes
      maanden na het tijdstip waarop de geldigheid van het gekwalificeerde certificaat is verlopen of, indien dat
      tijdstip eerder valt, na het tijdstip waarop de geldigheid is beëindigd door intrekking, langs elektronische weg en
      zodanig dat die publicatie door alle gebruikers van de desbetreffende certificatiedienst alsmede door alle partijen
      die vertrouwen op de uitgegeven gekwalificeerde certificaten geraadpleegd kan worden:
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.l.1°
    text: actuele en betrouwbare informatie over de status van de afgegeven gekwalificeerde certificaten, en
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.l.2°
    text: afgegeven gekwalificeerde certificaten voor zover de ondertekenaar daarvoor toestemming heeft gegeven;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.m
    text: |-
      hij slaat de gegevens voor het aanmaken van elektronische handtekeningen van de personen aan wie hij
      sleutelbeheerdiensten heeft verleend niet op, en hij kopieert deze gegevens evenmin;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.n
    text: hij beschikt over beschreven klachtenafhandeling- en geschillenbeslechtingprocedures, en hanteert deze;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.o
    text: |-
      hij treft maatregelen om bij beëindiging van de dienstverlening de gegevens voor het aanmaken van de elektronische
      handtekening, waarmee de desbetreffende certificatiedienstverlener de uitgegeven gekwalificeerde certificaten
      tekent, te vernietigen op het vroegst mogelijke moment dat de publicatieverplichting, bedoeld in onderdeel l, dit
      mogelijk maakt;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.p
    text: 'hij treft zodanige voorzieningen dat bij beëindiging van de dienstverlening:'
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.p.1°
    text: |-
      de door hem afgegeven gekwalificeerde certificaten door een andere geregistreerde certificatiedienstverlener worden
      overgenomen en dat te dien aanzien voldaan wordt aan dit artikel, tenzij dit redelijkerwijze niet mogelijk is,
      alsmede de ondertekenaars daarvan in kennis worden gesteld;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.p.2°
    text: |-
      indien overneming als bedoeld in onderdeel 1° redelijkerwijze niet mogelijk is, de gekwalificeerde certificaten
      uiterlijk op het tijdstip waarop de dienstverlening wordt beëindigd worden ingetrokken, de ondertekenaars daarvan
      in kennis worden gesteld en voor het overige ten aanzien van de ingetrokken gekwalificeerde certificaten door een
      geregistreerde certificatiedienstverlener voldaan wordt aan de onderdelen i, j en q;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.q
    text: |-
      hij treft, ongeacht de reden en omstandigheden van beëindiging van de dienstverlening en voor zover de
      gekwalificeerde certificaten niet worden overgenomen door een andere certificatiedienstverlener, in ieder geval
      voorzieningen voor de voortzetting van de publicatie overeenkomstig onderdeel l, zulks op de tot dan gebruikelijke
      wijze en tot ten minste zes maanden na het tijdstip waarop de dienstverlening is beëindigd;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.r
    text: |-
      hij stelt schriftelijk, met behulp van een duurzaam communicatiemiddel en uit eigen beweging de persoon die
      een gekwalificeerd certificaat ter ondersteuning van zijn elektronische handtekening wenst en met wie hij een
      overeenkomst wil aangaan, en desgevraagd de derden, die op het gekwalificeerde certificaat vertrouwen, ten minste
      op de hoogte van:
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.r.1°
    text: |-
      de exacte voorwaarden voor het gebruik van het gekwalificeerde certificaat met inbegrip van eventuele beperkingen
      inzake dit gebruik, alsmede van de wijzigingen van de voorwaarden;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.r.2°
    text: het bestaan van een vrijwillige accreditatie;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.r.3°
    text: |-
      de procedure voor intrekking van het gekwalificeerde certificaat zowel op verzoek van de gebruiker als door hem
      zelf, en
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.r.4°
    text: de procedures voor klachtenbehandeling en geschillenbeslechting;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.s
    text: |-
      hij toont door middel van een verklaring van een daartoe bevoegde instantie aan dat hij, ieder van de
      bestuurders van de onderneming, en de medewerkers die binnen zijn onderneming in het kader van het verlenen van
      certificatiediensten verantwoordelijk zijn voor de verwerking van vertrouwelijke of gevoelige gegevens, niet binnen
      de laatste vier jaar wegens een misdrijf onherroepelijk zijn veroordeeld tot een onvoorwaardelijke vrijheidsstraf
      van meer dan zes maanden door een rechter in Nederland, de Nederlandse Antillen of Aruba, en
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.t
    text: |-
      hij zorgt onverwijld na iedere veiligheidsinbreuk die of ieder integriteitsverlies dat aanzienlijke
      gevolgen heeft of kan hebben voor de betrouwbaarheid van door hem aangeboden of afgegeven gekwalificeerde
      certificaten voor een melding van die inbreuk of dat verlies aan de Autoriteit Consument en Markt, bedoeld in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1], en aan Onze Minister van
      Veiligheid en Justitie, met een kennisgeving aan beiden van:


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: '2'
  - number: 2.1.t.1°
    text: de aard en omvang van de inbreuk of het verlies;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.t.2°
    text: het vermoedelijke tijdstip van de aanvang van de inbreuk of het verlies;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.t.3°
    text: de mogelijke gevolgen van de inbreuk of het verlies;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.t.4°
    text: een prognose van de tijd nodig om de inbreuk te onderzoeken;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.t.5°
    text: |-
      zo mogelijk de door de certificatiedienstverlener genomen of te nemen maatregelen om de gevolgen van de inbreuk of
      het verlies te beperken of herhaling hiervan te voorkomen;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: 2.1.t.6°
    text: |-
      de contactgegevens van de in Nederland gevestigde functionaris die verantwoordelijk is voor het doen van de
      kennisgeving.
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: '2.2'
    text: |-
      Met een veroordeling als bedoeld in het eerste lid, onderdeel s, wordt gelijkgesteld een onherroepelijke
      veroordeling tot een onvoorwaardelijke vrijheidsstraf van meer dan zes maanden door een andere rechter
      wegens een misdrijf waarvoor naar Nederlands recht een bevel tot voorlopige hechtenis ingevolge
      [artikel 67, eerste lid, van het Wetboek van Strafvordering][ref1] is toegelaten;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel67
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '67'
  - number: '2.3'
    text: |-
      Met een veroordeling tot een onvoorwaardelijke vrijheidsstraf als bedoeld in het tweede lid wordt gelijkgesteld een
      bevel tot tenuitvoerlegging van een zodanige onvoorwaardelijke vrijheidsstraf.
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel2
  - number: '3'
    text: |-
      Certificaten als bedoeld in [artikel 18.15, tweede lid, van de wet][ref1] bevatten ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel18
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '18'
  - number: 3.a
    text: de vermelding dat het certificaat als gekwalificeerd certificaat wordt afgegeven;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3
  - number: 3.b
    text: de identificatie en het land van vestiging van de afgevende certificatiedienstverlener;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3
  - number: 3.c
    text: de naam van de ondertekenaar of een als zodanig geïdentificeerd pseudoniem;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3
  - number: 3.d
    text: |-
      ruimte voor een specifiek attribuut van de ondertekenaar, dat indien nodig, afhankelijk van het doel van het
      gekwalificeerde certificaat, wordt vermeld;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3
  - number: 3.e
    text: |-
      gegevens voor het verifiëren van de handtekening die overeenstemmen met de gegevens voor het aanmaken van de
      handtekening die onder controle van de ondertekenaar staan;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3
  - number: 3.f
    text: |-
      vermelding van het tijdstippen van het begin en van het einde van de geldigheidsduur van het gekwalificeerde
      certificaat;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3
  - number: 3.g
    text: de identiteitscode van het gekwalificeerde certificaat;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3
  - number: 3.h
    text: |-
      de elektronische handtekening van de afgevende certificatiedienstverlener die voldoet aan de criteria van
      [artikel 15a, tweede lid, onderdeel a tot en met d, van Boek 3 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15a
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 15a
  - number: 3.i
    text: eventuele beperkingen betreffende het gebruik van het gekwalificeerde certificaat, en
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3
  - number: 3.j
    text: |-
      eventuele grenzen met betrekking tot de waarde van de transacties waarvoor het gekwalificeerde certificaat kan
      worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3
  - number: 3a.1
    text: |-
      Een organisatie die in aanmerking wenst te komen voor een aanwijzing als bedoeld in
      [artikel 18.16 van de wet][ref1] dient daartoe een aanvraag in en voldoet aan de volgende eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel18
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '18'
  - number: 3a.1.a
    text: |-
      de organisatie heeft voldoende gekwalificeerd personeel in dienst dat als auditor kan worden ingezet om een
      conformiteitsbeoordeling uit te voeren van een certificatiedienstverlener;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3a
  - number: 3a.1.b
    text: |-
      de reglementen van de organisatie bieden voldoende waarborgen dat een overeenkomstig deze
      reglementen door de aangewezen organisatie beoordeelde certificatiedienstverlener voldoet aan
      [artikel 18.15, eerste lid, van de wet][ref1] en dat de door een zodanige certificatiedienstverlener
      aan het publiek aangeboden of afgegeven gekwalificeerde certificaten voldoen aan
      [artikel 18.15, tweede lid, van de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel18
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '18'
  - number: 3a.1.c
    text: de organisatie hanteert voorwaarden die objectief, transparant, evenredig en niet-discriminerend zijn;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3a
  - number: 3a.1.d
    text: |-
      de organisatie is geaccrediteerd op basis van de norm NEN-EN 45011: 1998, norm NEN-EN-ISO/IEC 17065:2012 of ISO
      17021:2011 of een gelijkwaardige norm, welke accreditatie het vakgebied «gekwalificeerde certificaten» dient
      te omvatten, door de Raad voor Accreditatie of een andere accreditatie-instantie in de zin van artikel 4 van
      verordening (EG) nr. 765/2008.
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3a
  - number: 3a.2
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de wijze waarop en bij wie een aanvraag tot
      aanwijzing als organisatie als bedoeld in [artikel 18.16 van de wet][ref1] wordt ingediend, de informatie die
      daarbij wordt overgelegd, en het verlenen van medewerking terzake van een ingediende aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel18
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '18'
  - number: 3a.3
    text: |-
      Aan een aanwijzing kunnen voorschriften worden verbonden die betrekking kunnen hebben op de duur van de aanwijzing,
      de kwaliteit van de organisatie en het verstrekken van informatie.
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3a
  - number: 3a.4
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het verstrekken van
      informatie in verband met door een aangewezen organisatie afgegeven bewijzen van toetsing bedoeld in
      [artikel 18.16, eerste lid, van de wet][ref1] alsmede omtrent de medewerking die door een aangewezen organisatie
      wordt verleend met het oog op het voldoen door die organisatie aan de aan haar gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel18
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '18'
  - number: 3b.1
    text: |-
      Het personeel dat door de organisatie als auditor wordt ingezet om een conformiteitsbeoordeling uit te voeren van
      een certificatiedienstverlener:
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3b
  - number: 3b.1.a
    text: |-
      heeft een opleiding op minimaal HBO-niveau dan wel een daaraan gelijkwaardige aanmerkelijke ervaring en aanvullende
      beroepsopleiding en -training;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3b
  - number: 3b.1.b
    text: |-
      beschikt over een equivalent van ten minste vier jaar voltijds praktijkervaring met betrekking tot
      informatietechnologie, waarvan tenminste twee jaar in een functie met betrekking tot Public Key Infrastructure
      en informatiebeveiliging;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3b
  - number: 3b.1.c
    text: |-
      heeft voldoende begrip van de technische specificatie ETSI TS 319 411-2 of een daarmee gelijkwaardige technische
      specificatie;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3b
  - number: 3b.1.d
    text: heeft voldoende begrip van de concepten van managementsystemen in het algemeen;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3b
  - number: 3b.1.e
    text: |-
      heeft voldoende begrip van onderwerpen die zijn gerelateerd aan Public Key Infrastructure, management van
      informatiebeveiliging en organisatorische betrouwbaarheid;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3b
  - number: 3b.1.f
    text: heeft voldoende kennis van de principes en processen gerelateerd aan risicobeoordeling en risicomanagement;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3b
  - number: 3b.1.g
    text: |-
      heeft een training van ten minste 5 dagen afgerond over het beoordelen van managementsystemen en het management
      van beoordelingsprocessen;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3b
  - number: 3b.1.h
    text: |-
      beschikt over de volgende persoonlijke eigenschappen: integer, onbevooroordeeld, volwassen houding,
      onderscheidingsvermogen, analytisch, vasthoudend en realistisch;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3b
  - number: 3b.1.i
    text: |-
      kan complexe operaties in een breed perspectief plaatsen en de rol van individuele eenheden in grote organisaties
      begrijpen;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3b
  - number: 3b.1.j
    text: heeft kennis en eigenschappen om beoordelingsprocessen te managen;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3b
  - number: 3b.1.k
    text: |-
      zorgt ervoor dat de eigen kennis en vaardigheden op het gebied van Public Key Infrastructure, management van
      informatiebeveiliging en beoordeling van managementsystemen voortdurend op peil worden gehouden;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3b
  - number: 3b.1.l
    text: |-
      heeft voorafgaand aan zelfstandig optreden als auditor ervaring opgedaan in het hele proces van beoordeling van
      certificatiedienstverleners, welke ervaring is verkregen door onder supervisie van een ervaren auditor deel te
      nemen aan minimaal vier beoordelingen bestaande uit totaal ten minste 20 dagen, hierbij inbegrepen toetsing van
      documentatie, implementatiebeoordeling en opstelling beoordelingsrapport.
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3b
  - number: 3b.2
    text: |-
      In aanvulling op de eisen, genoemd in het eerste lid, voldoet een auditor die als leider van een auditteam
      optreedt, aan de volgende eisen:
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3b
  - number: 3b.2.a
    text: |-
      hij heeft opgetreden als een gekwalificeerd auditor in ten minste drie complete beoordelingen van
      certificatiedienstverleners;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3b
  - number: 3b.2.b
    text: hij beschikt over adequate kennis en eigenschappen om het beoordelingsproces te managen;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3b
  - number: 3b.2.c
    text: hij kan effectief communiceren, zowel mondeling als schriftelijk.
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3b
  - number: 3b.3
    text: 'Een beoordelingsteam als geheel voldoet aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3b
  - number: 3b.3.a
    text: |-
      in elk van de volgende kennisgebieden is tenminste één auditor binnen het beoordelingsteam gekwalificeerd om de
      verantwoordelijkheid te dragen voor:
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3b
  - number: 3b.3.a.1°
    text: |-
      de benodigde kennis van de regelgeving waaraan op het terrein van certificatiedienstverlening en
      informatiebeveiliging moet zijn voldaan;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3b
  - number: 3b.3.a.2°
    text: de benodigde kennis van de laatste stand van de techniek betreffende Public Key Infrastructure;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3b
  - number: 3b.3.a.3°
    text: |-
      De benodigde kennis om een aan informatiebeveiliging gerelateerde risicobeoordeling uit te voeren om kwetsbaarheden
      te ontwaren bij de certificatiedienstverlener, het begrijpen van hun betekenis voor de dienstverlening en het
      verminderen en onder controle brengen van deze kwetsbaarheden en
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3b
  - number: 3b.3.a.4°
    text: de benodigde kennis van kwesties van organisatorische betrouwbaarheid;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3b
  - number: 3b.3.b
    text: |-
      het beoordelingsteam is competent om indicaties van kwetsbaarheden in de certificatiedienstverlening terug te
      leiden naar de desbetreffende elementen van het managementsysteem van de certificatiedienstverlener opdat deze
      verbeterd kunnen worden.
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3b
  - number: 3b.4
    text: |-
      Om er voor te zorgen dat het beoordelingsteam alle noodzakelijke expertise tot zijn beschikking heeft, mogen
      technisch deskundigen met specifieke kennis over de onderwerpen, genoemd in het derde lid, onder a, 1° tot en met
      4°, worden ingeschakeld om het beoordelingsteam te assisteren, ook al voldoen zij niet aan alle criteria voor een
      individuele auditor.
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3b
  - number: 3b.5
    text: |-
      De technisch deskundigen, bedoeld in het vierde lid, zijn te allen tijde verantwoording schuldig aan de leider
      van het auditteam en functioneren niet onafhankelijk van de auditors in het team die wel gekwalificeerd zijn als
      auditor.
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel3b
  - number: '4.1'
    text: |-
      Een instelling die in aanmerking wenst te komen voor een aanwijzing als bedoeld in
      [artikel 18.17a, eerste lid, van de wet][ref1] dient daartoe een aanvraag in en voldoet aan de volgende eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel18
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '18'
  - number: 4.1.a
    text: |-
      zij hanteert een toetsingskader dat waarborgt dat de beoordeelde veilige middelen voor het aanmaken van
      elektronische handtekeningen voldoen aan de wettelijke eisen;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel4
  - number: 4.1.b
    text: |-
      zij is op basis van de norm NEN-EN 45011: 1998 of de norm ISO/IEC 17065:2012 geaccrediteerd, welke accreditatie het
      vakgebied veilige middelen voor het aanmaken van elektronische handtekeningen omvat, door de Raad voor Accreditatie
      of een andere accreditatie-instantie in de zin van artikel 4 van verordening (EG) nr. 765/2008;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel4
  - number: 4.1.c
    text: |-
      zij maakt gebruik van testlaboratoria die voldoen aan norm NEN-EN-ISO 17025 voor het testen van veilige middelen
      voor het aanmaken van elektronische handtekeningen volgens de norm ISO/IEC 15408:2005.
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel4
  - number: '4.2'
    text: |-
      De instelling die in aanmerking wenst te komen voor een aanwijzing als bedoeld in
      [artikel 18.17a, eerste lid, van de wet][ref1] voldoet, onverminderd het eerste lid, aan de volgende eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel18
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '18'
  - number: 4.2.a
    text: |-
      zij houdt zich niet bezig met activiteiten die een bedreiging kunnen vormen voor de onafhankelijkheid van haar
      oordeel en de integriteit bij de uitoefening van haar taak;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel4
  - number: 4.2.b.1°
    text: |-
      zij is onafhankelijk van organisaties die betrokken zijn bij het ontwerpen, de fabricage, de verkoop en de
      levering, de installatie, het onderhoud of het beheer van veilige middelen, alsmede van certificatiedienstverleners
      en de gebruikers voor zover zij zich bedienen van veilige middelen voor het aanmaken van elektronische
      handtekeningen;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel4
  - number: 4.2.b.2°
    text: zij is financieel onafhankelijk van de betrokken partijen;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel4
  - number: 4.2.b.3°
    text: |-
      de directeur en het personeel dat met de beoordeling van de overeenstemming is belast, zijn geen ontwerper,
      fabrikant, leverancier of installateur van veilige middelen, noch certificatiedienstverlener, noch gemachtigden van
      een van die partijen;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel4
  - number: 4.2.b.4°
    text: |-
      zij wordt niet rechtstreeks betrokken bij het ontwerp, de fabricage, de verkoop of het onderhoud van veilige
      middelen, noch treedt zij op als gemachtigde van de hierbij betrokken partijen.
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel4
  - number: 4.2.c
    text: 'zij heeft personeel in dienst dat:'
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel4
  - number: 4.2.c.1°
    text: |-
      voldoende bekwaamheid bezit om met een hoge mate van beroepsintegriteit de overeenstemming vast te stellen van
      de veilige middelen voor het aanmaken van elektronische handtekeningen met de eisen voor deze veilige middelen,
      bedoeld in [artikel 5][ref1] van dit besluit, en


      [ref1]: https://wetten.overheid.nl/BWBR0015047#Artikel5
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0015047
        artikel: '5'
  - number: 4.2.c.2°
    text: betrouwbare procedures hanteert;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel4
  - number: 4.2.d
    text: |-
      zij beoordeelt de overeenstemming op transparante wijze, stelt alle relevante informatie op schrift, zorgt ervoor
      dat alle geïnteresseerde partijen gebruik kunnen maken van haar diensten en past haar procedures zonder enige vorm
      van discriminatie toe;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel4
  - number: 4.2.e
    text: |-
      zij beschikt over voldoende personeel en de nodige voorzieningen om de technische en administratieve werkzaamheden
      die uit haar taken voortvloeien, naar behoren en snel te kunnen verrichten;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel4
  - number: 4.2.f
    text: het personeel dat belast is met de beoordeling van de overeenstemming van de veilige middelen met de eisen,
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel4
  - number: 4.2.f.1°
    text: |-
      heeft een adequate opleiding genoten, met name op het gebied van technologieën voor elektronische handtekeningen en
      de daaraan verbonden aspecten van de veiligheid van het gebruik van computers;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel4
  - number: 4.2.f.2°
    text: |-
      bezit een behoorlijke kennis van voorschriften inzake de te verrichten overeenstemmingsbeoordelingen en heeft
      voldoende ervaring met dergelijke beoordelingen;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel4
  - number: 4.2.g
    text: |-
      zij waarborgt de onpartijdigheid van het personeel, onder meer door de bezoldiging niet afhankelijk te stellen van
      het aantal uitgevoerde overeenstemmingbeoordelingen of van de resultaten van deze beoordelingen;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel4
  - number: 4.2.h
    text: |-
      zij houdt voldoende financiële middelen ter beschikking om in overeenstemming met de eisen van de [wet][ref1] te
      kunnen functioneren;


      [ref1]: https://wetten.overheid.nl/BWBR0009950
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009950
  - number: 4.2.i
    text: zij behandelt de gegevens die haar ter kennis komen vertrouwelijk, en
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel4
  - number: 4.2.j
    text: |-
      zij staat in voor de overeengekomen activiteiten van de instellingen door welke zij een deel van de
      overeenstemmingbeoordeling laat uitvoeren en kan aantonen dat deze instelling in staat is de betrokken dienst te
      verlenen.
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel4
  - number: '4.3'
    text: |-
      De instelling die deel uitmaakt van een organisatie die zich bezighoudt met andere activiteiten dan de
      beoordeling van de overeenstemming van veilige middelen voor het aanmaken van elektronische handtekeningen met
      de eisen van [artikel 5][ref1], is binnen die organisatie herkenbaar als aangewezen instelling als bedoeld in
      [artikel 18.17a, eerste lid, van de wet][ref2], en scheidt haar werkzaamheden zodanig van de andere activiteiten,
      dat daardoor de correcte beoordeling van overeenstemming van veilige middelen is gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0015047#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel18
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0015047
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '18'
  - number: '4.4'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de wijze waarop en bij wie een aanvraag tot
      aanwijzing als instelling als bedoeld in [artikel 18.17a, eerste lid, van de wet][ref1] geschiedt, de informatie
      die daarbij wordt overgelegd en het verlenen van medewerking terzake van een ingediende aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel18
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '18'
  - number: '4.5'
    text: |-
      Aan een aanwijzing kunnen voorschriften worden verbonden die betrekking hebben op de duur van de aanwijzing, de
      kwaliteit van de organisatie en het verstrekken van informatie.
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel4
  - number: '4.6'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het verstrekken van informatie in verband
      met door een aangewezen instelling afgegeven verklaringen bedoeld in [artikel 18.17a, eerste lid, van de wet][ref1]
      alsmede omtrent de medewerking die door een aangewezen instelling wordt verleend met het oog op het voldoen door
      die instelling aan de aan haar gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel18
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '18'
  - number: '5'
    text: 'Een veilig middel voor het aanmaken van elektronische handtekeningen voldoet aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel5
  - number: 5.a
    text: |-
      het waarborgt dat de gegevens voor het aanmaken van elektronische handtekeningen in de praktijk slechts eenmaal
      kunnen voorkomen en de vertrouwelijkheid daarvan redelijkerwijs gegarandeerd is;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel5
  - number: 5.b
    text: |-
      het waarborgt met redelijke zekerheid dat de gegevens voor het aanmaken van elektronische handtekeningen niet
      kunnen worden afgeleid en dat de elektronische handtekening beschermd is tegen vervalsing met de op het tijdstip
      van het afgeven van de verklaring beschikbare technieken;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel5
  - number: 5.c
    text: |-
      het waarborgt dat de gegevens voor het aanmaken van elektronische handtekeningen door de legitieme ondertekenaar op
      betrouwbare wijze kunnen worden beschermd tegen gebruik door anderen;
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel5
  - number: 5.d
    text: |-
      het laat de te ondertekenen gegevens ongewijzigd en belet niet dat die gegevens vóór de ondertekening aan de
      ondertekenaar worden voorgelegd.
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel5
  - number: '6'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de eisen genoemd in dit besluit.
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel6
  - number: '8'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop de [Wet elektronische handtekeningen][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0015046
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015046
  - number: '9'
    text: 'Dit besluit wordt aangehaald als: Besluit elektronische handtekeningen.'
    url: https://wetten.overheid.nl/BWBR0015047/2014-02-01#Artikel9
