preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Verkeer en Waterstaat en van Onze Minister van Onderwijs en Wetenschappen
    van 29 september 1982, nr. PJ/S 26140, Directoraat-Generaal Scheepvaart en Maritieme Zaken;


    Gelet op artikel 2, derde lid, van de Wet op de Zeevaartdiploma's 1935 (Stb. 456);


    De Raad van State gehoord (advies van 29 oktober 1982, nr. 2523/12/8243);


    Gezien het nader rapport van Onze voornoemde Ministers van 22 december 1982, nr. PJ/S 28367, Directoraat-Generaal
    Scheepvaart en Maritieme Zaken;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003568/1998-01-14#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De begripsbepalingen, genoemd in artikel 1, eerste lid, van de Wet op de Zeevaartdiploma's 1935 (*Stb.* 456) zijn
      van toepassing.

      2 In dit besluit wordt verstaan onder:

      "Onze Minister": Onze Minister van Verkeer en Waterstaat;

      "school": een school als bedoeld in [artikel 14, eerste lid, van de Wet op het Voortgezet Onderwijs][ref1]
      (*Stb.* 1963, 40) zoals sindsdien gewijzigd, die de opleiding verzorgt ter verkrijging van een diploma, genoemd in
      [artikel 2, eerste lid][ref2], van dit besluit;

      "diensttijd": de tijd, doorgebracht als bemanningslid aan boord van een in de vaart zijnd zeeschip.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003568#Artikel2
    url: https://wetten.overheid.nl/BWBR0003568/1998-01-14#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0003568
        artikel: '2'
  - number: '2'
    text: >-
      1 Aan degene die heeft voldaan aan de daarvoor bij of krachtens dit besluit gestelde voorwaarden, wordt op zijn
      verzoek door Onze Minister uitgereikt:


      a. het diploma als stuurman voor de kleine handelsvaart en het aanvullingsdiploma als stuurman voor de kleine
      handelsvaart;


      b. het diploma als motordrijver.


      2 Onze Minister stelt de modellen van de in het eerste lid genoemde diploma's vast.
    url: https://wetten.overheid.nl/BWBR0003568/1998-01-14#Artikel2
  - number: '3'
    text: |-
      1 Ter verkrijging van de diploma's, bedoeld in [artikel 2, eerste lid, onder a][ref1], dient de kandidaat:

      a. aan een school het eindexamen voor stuurman voor de kleine handelsvaart met goed gevolg te hebben afgelegd;

      b. daarna de in het tweede lid genoemde diensttijd te hebben behaald in de dekdienst in de kleine handelsvaart
      onder bijhouding van het desbetreffende praktijkboek, bedoeld in [artikel 5][ref2];

      c. na voldaan te hebben aan het bepaalde onder *b* en na goedkeuring van het praktijkboek door Onze Minister, een
      diensttijd te hebben behaald van ten minste een half jaar als wachtdoend stuurman in de kleine handelsvaart.

      2 De diensttijd, bedoeld in het eerste lid, onder *b*, bedraagt:

      a. ten minste een jaar, indien de kandidaat voorafgaand aan het met goed gevolg afleggen van het eindexamen minder
      dan een jaar dekdienst heeft gedaan aan boord van zeeschepen;

      b. ten minste een half jaar, indien de kandidaat voorafgaand aan het met goed gevolg afleggen van het eindexamen
      ten minste een jaar doch minder dan twee jaar dekdienst heeft gedaan aan boord van zeeschepen.

      3 Degene die voorafgaand aan het met goed gevolg afleggen van het eindexamen ten minste twee jaar dekdienst heeft
      gedaan in de kleine handelsvaart, behoeft, na het eindexamen met goed gevolg te hebben afgelegd, uitsluitend een
      half jaar diensttijd te hebben behaald, als bedoeld in het eerste lid onder *c*.

      4 Onder dekdienst, bedoeld in het tweede en derde lid, is tot ten hoogste 30 dagen begrepen dekdienst buitengaats
      als leerling aan boord van een ten behoeve van het onderwijs aan de school gebezigd opleidingsschip.


      [ref1]: https://wetten.overheid.nl/BWBR0003568#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003568#Artikel5
    url: https://wetten.overheid.nl/BWBR0003568/1998-01-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003568
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003568
        artikel: '5'
  - number: '4'
    text: |-
      1 Ter verkrijging van het diploma bedoeld in [artikel 2, eerste lid, onder b][ref1], dient de kandidaat:

      a. aan een school het eindexamen voor scheepswerktuigkundige voor de kleine handelsvaart met goed gevolg te hebben
      afgelegd;

      b. daarna diensttijd te hebben behaald in de machinekamer van een zeeschip onder bijhouding van het desbetreffende
      praktijkboek, bedoeld in [artikel 5][ref2].

      2 De diensttijd, bedoeld in het eerste lid, onder *b*, bedraagt:

      a. ten minste een jaar, indien de kandidaat voorafgaand aan het met goed gevolg afleggen van het eindexamen minder
      dan een half jaar dienst heeft gedaan in de machinekamer van zeeschepen;

      b. ten minste een half jaar, indien de kandidaat voorafgaand aan het met goed gevolg afleggen van het eindexamen
      ten minste een half jaar doch minder dan een jaar dienst heeft gedaan in een machinekamer van zeeschepen.

      3 Voor degene die voorafgaand aan het met goed gevolg afleggen van het eindexamen ten minste een jaar dienst heeft
      gedaan in de machinekamer van zeeschepen, geldt de in het eerste lid, onder *b*, genoemde voorwaarde niet.

      4 Onder dienst in de machinekamer, bedoeld in het tweede en derde lid is tot ten hoogste 30 dagen begrepen
      dienst buitengaats als leerling in de machinekamer van een ten behoeve van het onderwijs aan de school gebezigd
      opleidingsschip.


      [ref1]: https://wetten.overheid.nl/BWBR0003568#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003568#Artikel5
    url: https://wetten.overheid.nl/BWBR0003568/1998-01-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003568
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003568
        artikel: '5'
  - number: '5'
    text: |-
      1 Het praktijkboek bevat opdrachten, die de kandidaat gedurende de diensttijd, bedoeld in
      [artikel 3, eerste lid, onder b][ref1], onderscheidenlijk [artikel 4, eerste lid, onder b][ref2], overeenkomstig de
      in het desbetreffende praktijkboek gegeven richtlijnen dient uit te voeren.

      2 Onze Minister stelt de richtlijnen en de opdrachten vast en bepaalt de modellen van de praktijkboeken.

      3 Ter verkrijging van een praktijkboek wendt de kandidaat zich tot Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003568#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003568#Artikel4
    url: https://wetten.overheid.nl/BWBR0003568/1998-01-14#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003568
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003568
        artikel: '4'
  - number: '6'
    text: >-
      1 De kandidaat richt zich bij de uitvoering van de in het praktijkboek vervatte opdrachten naar de door of vanwege
      de kapitein gegeven aanwijzingen.


      2 Na uitvoering van de opdrachten dient het praktijkboek door de kapitein te worden ondertekend. De kandidaat zendt
      het ondertekende praktijkboek aan Onze Minister.


      3 Indien Onze Minister van oordeel is, dat het praktijkboek niet in alle opzichten naar behoren is bijgehouden,
      kan hij de kandidaat een of meer aanvullende opdrachten geven, die binnen een daarbij te bepalen termijn van ten
      hoogste zes maanden dienen te worden uitgevoerd. Het bepaalde in het eerste en tweede lid is van overeenkomstige
      toepassing.


      4 Zo spoedig mogelijk na ontvangst van het praktijkboek wordt de kandidaat meegedeeld of het is goedgekeurd. Indien
      het praktijkboek niet is goedgekeurd worden de kandidaat daarbij tevens de aanvullende opdrachten meegedeeld en de
      termijn waarbinnen hij deze dient uit te voeren.
    url: https://wetten.overheid.nl/BWBR0003568/1998-01-14#Artikel6
  - number: '7'
    text: >-
      De kapitein van het schip draagt er zorg voor dat degene die aan boord daarvan een praktijkboek dient bij te
      houden, de daarin vervatte opdrachten naar behoren kan verrichten.
    url: https://wetten.overheid.nl/BWBR0003568/1998-01-14#Artikel7
  - number: '8'
    text: >-
      De reder die iemand in de gelegenheid stelt op zijn schip of schepen de ingevolge dit besluit vereiste diensttijd
      onder bijhouding van een praktijkboek te behalen, draagt er zorg voor dat de belanghebbende gedurende die
      diensttijd praktisch wordt bekwaamd voor zijn toekomstige functie, en dat hij en de kapitein in de gelegenheid
      worden gesteld op de juiste wijze uitvoering te geven aan het bij of krachtens dit besluit bepaalde.
    url: https://wetten.overheid.nl/BWBR0003568/1998-01-14#Artikel8
  - number: '9'
    text: >-
      Ter zake van de afgifte van een krachtens dit besluit uit te reiken diploma is een vergoeding verschuldigd volgens
      een door Onze Minister vast te stellen tarief.
    url: https://wetten.overheid.nl/BWBR0003568/1998-01-14#Artikel9
  - number: '10'
    text: |-
      Bij zijn verzoek om uitreiking van een diploma als genoemd in [artikel 2, eerste lid][ref1], dient de kandidaat aan
      Onze Minister over te leggen:

      a. de bewijsstukken met betrekking tot opleiding, praktijkboek en, ten genoegen van Onze Minister, van de behaalde
      diensttijd;

      b. een uittreksel uit het geboorteregister of, ten genoegen van Onze Minister, een identiteitsbewijs;

      c. het bewijs van betaling van de in [artikel 9][ref2] bedoelde vergoeding;

      d. een goed gelijkende pasfoto, zwart-wit, in drievoud.


      [ref1]: https://wetten.overheid.nl/BWBR0003568#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003568#Artikel9
    url: https://wetten.overheid.nl/BWBR0003568/1998-01-14#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003568
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003568
        artikel: '9'
  - number: '11'
    text: >-
      Een duplicaat van een uitgereikt diploma wordt slechts afgegeven indien de belanghebbende aannemelijk kan maken dat
      het oorspronkelijke diploma verloren is geraakt. Tenzij het oorspronkelijke diploma verloren is geraakt ten gevolge
      van een oorlogsdaad, een scheepsramp of daarmee vergelijkbare voorvallen, is voor een duplicaat een vergoeding
      verschuldigd volgens een door Onze Minister vast te stellen tarief.
    url: https://wetten.overheid.nl/BWBR0003568/1998-01-14#Artikel11
  - number: '12'
    text: |-
      Onze Minister kan, indien daartoe naar zijn oordeel aanleiding bestaat, ontheffing of vrijstelling verlenen van
      het bepaalde in [artikel 3, eerste en tweede lid][ref1], en [artikel 4, eerste en tweede lid, onder][ref2] zo nodig
      door hem te stellen voorwaarden en beperkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003568#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003568#Artikel4
    url: https://wetten.overheid.nl/BWBR0003568/1998-01-14#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003568
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003568
        artikel: '4'
  - number: '13'
    text: Dit besluit kan worden aangehaald als "Besluit bijzondere verkrijging diploma's kleine handelsvaart".
    url: https://wetten.overheid.nl/BWBR0003568/1998-01-14#Artikel13
  - number: '14'
    text: >-
      Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin het
      wordt geplaatst en werkt terug tot 1 mei 1979.
    url: https://wetten.overheid.nl/BWBR0003568/1998-01-14#Artikel14
