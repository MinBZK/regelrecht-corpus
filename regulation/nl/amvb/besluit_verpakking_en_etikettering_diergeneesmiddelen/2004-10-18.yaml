---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_verpakking_en_etikettering_diergeneesmiddelen
regulatory_layer: AMVB
publication_date: '2006-01-12'
valid_from: '2004-10-18'
bwb_id: BWBR0004022
url: https://wetten.overheid.nl/BWBR0004022/2004-10-18
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Landbouw en Visserij, van 18 december 1985, no. J 7942, Directie
    Juridische en Bedrijfsorganisatorische Zaken, gedaan in overeenstemming met de Staatssecretaris van Welzijn,
    Volksgezondheid en Cultuur na overleg met de Staatssecretaris van Sociale Zaken en Werkgelegenheid;

    Gelet op artikel 42, eerste lid, onderdeel a en onderdeel b, van de Diergeneesmiddelenwet (Stb. 1985, 410);

    Gehoord de Dibevo, de Vereniging van Fabrikanten en Groothandelaren in Veterinaire Produkten (Fagrovet), de
    Vereniging van Fabrikanten en Importeurs van Diergeneesmiddelen in Nederland (Fidin), de Koninklijke Nederlandse
    Maatschappij voor Diergeneeskunde, de Vereniging van Fabrikanten en Importeurs van Toevoegingsmiddelen (Nefato), de
    Nederlandse Associatie van Homeopathische/Farmaceutische Ondernemingen (Nehoma) en het Produktschap voor Veevoeder;

    De Raad van State gehoord (advies van 5 maart 1986, nr. W11.85.0679/18.6.08.);

    Gezien het nader rapport van Onze Minister van Landbouw en Visserij van 15 augustus 1986, no. J. 2911, Directie
    Juridische en Bedrijfsorganisatorische Zaken, uitgebracht in overeenstemming met de Staatssecretaris van Welzijn,
    Volksgezondheid en Cultuur na overleg met de Staatssecretaris van Sociale Zaken en Werkgelegenheid;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: "wet": [Diergeneesmiddelenwet][ref1]
      (*Stb.* 1985, 410); [richtlijn nr. 2001/82/EG](32001L0082): [richtlijn nr. 2001/82/EG](32001L0082) van het Europees
      Parlement en de Raad van de Europese Unie van 6 november 2001 tot vaststelling van een communautair wetboek
      betreffende geneesmiddelen voor diergeneeskundig gebruik (PbEG L 311); homeopatisch diergeneesmiddel:


      [ref1]: https://wetten.overheid.nl/BWBR0003818
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003818
  - number: 1.1.a
    text: een diergeneesmiddel dat is vermeld op de Lijst van homeopatische diergeneesmiddelen 1993, of
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel1
  - number: 1.1.b
    text: |-
      een diergeneesmiddel dat, overeenkomstig een homeopatisch fabricageprocédé, zoals beschreven in de Europese
      Farmacopee dan wel in een andere op 22 september 1992 door de Lid-Staten van de Europese Gemeenschappen officieel
      gebruikte farmacopee, is verkregen uit produkten, substanties of mengsels die homeopatische grondstoffen worden
      genoemd;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van het bepaalde bij of krachtens dit besluit worden omhulsels, waarin diergeneesmiddelen aan
      een dier worden toegediend, alsmede poederpapier geacht deel uit te maken van het diergeneesmiddel.
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel1
  - number: '1.3'
    text: |-
      Dit besluit is niet van toepassing op halffabrikaten voor de bereiding van gemedicineerd voeder die ingevolge
      [artikel 5, eerste lid, onderdeel d, van het Besluit uitzonderingen registratieregime diergeneesmiddelen][ref1]
      zijn uitgezonderd van de registratieplicht.


      [ref1]: https://wetten.overheid.nl/BWBR0003929#Artikel5
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003929
        artikel: '5'
  - number: '2.1'
    text: |-
      Het is verboden diergeneesmiddelen onverpakt af te leveren aan anderen dan houders van vergunningen, bedoeld in de
      artikelen 21 en 33 van de wet.
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel2
  - number: '2.2'
    text: 'Het is slechts toegestaan een diergeneesmiddel af te leveren:'
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel2
  - number: 2.2.a
    text: |-
      indien het is verpakt, indien de verpakking voldoet aan het bepaalde in [artikel 3][ref1] en het is geëtiketteerd
      met inachtneming van het bepaalde in dit besluit;


      [ref1]: https://wetten.overheid.nl/BWBR0004022#Artikel3
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004022
        artikel: '3'
  - number: 2.2.b
    text: |-
      indien het niet is verpakt, indien het vergezeld is van een begeleidend document dat: - indien het een
      geregistreerd diergeneesmiddel betreft de gegevens bevat waarvan ingevolge de [artikelen 4][ref1] en [5][ref2]
      vermelding op de recipiënt is voorgeschreven;
        - indien het een niet-geregistreerd diergeneesmiddel betreft de gegevens bevat waarvan ingevolge [artikel 6][ref3]
      vermelding op de recipiënt is voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0004022#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004022#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0004022#Artikel6
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004022
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0004022
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0004022
        artikel: '6'
  - number: '3.1'
    text: |-
      De verpakking van een diergeneesmiddel moet van een zodanige aard en constructie zijn dat zij tegen elke normale
      behandeling bestand is, dat niets van de inhoud kan ontsnappen en dat samenstelling en zuiverheid van het daarin
      verpakte diergeneesmiddel gedurende de aangegeven maximale houdbaarheidstermijn onder de voorgeschreven of
      aanbevolen bewaaromstandigheden gewaarborgd blijven.
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel3
  - number: '3.2'
    text: |-
      De sluiting van de recipiënt en, in voorkomend geval, van de buitenverpakking dient van een zodanige constructie te
      zijn, dat deze niet zonder zichtbare en onherstelbare beschadiging kan worden geopend.
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel3
  - number: '4.1'
    text: |-
      Op de recipiënt en, in voorkomend geval, op de buitenverpakking van een geregistreerd diergeneesmiddel dienen,
      overeenkomstig de bij de registratie gegeven voorschriften, te worden vermeld:
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel4
  - number: 4.1.a
    text: |-
      de naam van het diergeneesmiddel, onmiddellijk gevolgd door de kwalitatieve en kwantitatieve samenstelling naar
      werkzame bestanddelen, afhankelijk van de farmaceutische vorm aangegeven per dosis of in procenten overeenkomstig
      de algemene internationale benaming, zoals die wordt aanbevolen door de Wereldgezondheidsorganisatie danwel bij het
      ontbreken van een zodanige benaming een anderszins algemeen gangbare benaming met dien verstande dat in het geval
      het diergeneesmiddel slechts één werkzaam bestanddeel bevat en voor dat diergeneesmiddel een fantasienaam wordt
      gebruikt, die fantasienaam duidelijk leesbaar vergezeld dient te gaan van de naam van het werkzame bestanddeel;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel4
  - number: 4.1.b
    text: het nummer waaronder de registratie werd verleend, voorafgegaan door de letters "Reg. NL";
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel4
  - number: 4.1.c
    text: |-
      de naam of handelsnaam en het adres van de registratiehouder alsmede, indien deze niet tevens registratiehouder is,
      de naam, handelsnaam of het merk van de fabrikant;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel4
  - number: 4.1.d
    text: de aanduiding van de partij waarvan het diergeneesmiddel deel uitmaakt;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel4
  - number: 4.1.e
    text: |-
      het woord "diergeneesmiddel" dan wel in voorkomend geval de woorden "homeopatisch diergeneesmiddel" alsmede de
      diersoort of diersoorten waarvoor de dosering of doseringen waarin en de wijze of wijzen waarop het betrokken
      diergeneesmiddel uitsluitend mag worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel4
  - number: 4.1.f
    text: de wachttermijn of termijnen, ook indien de duur van een zodanige termijn op nul is gesteld;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel4
  - number: 4.1.g
    text: |-
      de uiterste gebruiksdatum, indien de maximale houdbaarheidsduur minder dan 3 jaar bedraagt. Indien deze maximale
      houdbaarheidsduur méér dan 3 jaar bedraagt mag zulks op de verpakking worden vermeld;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel4
  - number: 4.1.h
    text: |-
      de aanbevelingen omtrent de wijze van bewaring en zo nodig aanwijzingen omtrent de te nemen voorzorgsmaatregelen
      bij het zich ontdoen van niet gebruikte diergeneesmiddelen en daarvan afkomstige afvalprodukten;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel4
  - number: 4.1.i
    text: de veiligheidsmaatregelen voor de gebruiker;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel4
  - number: 4.1.j
    text: de overige bij de registratie voorgeschreven aanduidingen;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel4
  - number: 4.1.k
    text: de farmaceutische vorm, de inhoud naar gewicht, het volume of aantal doses.
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel4
  - number: '4.2'
    text: |-
      Op de recipiënt en, in voorkomend geval, op de buitenverpakking van sera, entstoffen en biologische diagnostica
      dienen onverminderd het bepaalde in het eerste lid en de krachtens artikel 14 van de wet voorgeschreven
      aanduidingen te worden vermeld:
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel4
  - number: 4.2.a
    text: de types en gehalten van de organismen waarmee of waaruit het produkt is bereid;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel4
  - number: 4.2.b
    text: de toegepaste antimicrobiële toevoegingen;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel4
  - number: 4.2.c
    text: |-
      in voorkomend geval de naam of samenstelling van het verdunnings- of suspensiemedium en de termijn waarbinnen het
      verdunde of geconstitueerde dan wel gereconstitueerde produkt dient te worden toegepast.
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel4
  - number: 4a.1
    text: |-
      In afwijking van [artikel 4][ref1], worden op de recipiënt en in voorkomend geval op de buitenverpakking van
      een homeopatisch diergeneesmiddel dat is geregistreerd overeenkomstig de procedure, bedoeld in artikel 17 van
      [richtlijn nr. 2001/82/EG](32001L0082), overeenkomstig de bij de registratie gegeven voorschriften uitsluitend
      vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0004022#Artikel4
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0004022
        artikel: '4'
  - number: 4a.1.a
    text: de woorden "homeopatisch diergeneesmiddel zonder goedgekeurde therapeutische indicatie";
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel4a
  - number: 4a.1.b
    text: |-
      de naam van het diergeneesmiddel en de wetenschappelijke benaming van de homeopatische grondstof of grondstoffen,
      gevolgd door de verdunningsgraad, waarvoor gebruik wordt gemaakt van de symbolen van de Europese Farmacopee of een
      andere op 22 september 1992 binnen de Europese Gemeenschappen officieel geldende farmacopee;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel4a
  - number: 4a.1.c
    text: het nummer waaronder de registratie is verleend, voorafgegaan door de letters "Reg. NL H";
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel4a
  - number: 4a.1.d
    text: |-
      de naam of handelsnaam en het adres van de registratiehouder alsmede, indien deze niet tevens registratiehouder is,
      de naam, de handelsnaam of het merk van de fabrikant;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel4a
  - number: 4a.1.e
    text: de aanduiding van de partij waarvan het betrokken homeopatisch diergeneesmiddel deel uitmaakt;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel4a
  - number: 4a.1.f
    text: de diersoort of diersoorten waarvoor, de wijze van gebruik en, indien noodzakelijk, de wijze van toediening;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel4a
  - number: 4a.1.g
    text: de uiterste gebruiksdatum uitgedrukt in maand en jaar;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel4a
  - number: 4a.1.h
    text: de farmaceutische vorm;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel4a
  - number: 4a.1.i
    text: de inhoud van de recipiënt naar gewicht, volume of aantal doses;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel4a
  - number: 4a.1.j
    text: de aanbevelingen omtrent de wijze van bewaring, en
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel4a
  - number: 4a.1.k
    text: zonodig de veiligheidsmaatregelen en bijzondere waarschuwingen voor de gebruiker.
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel4a
  - number: 4a.2
    text: |-
      Een wijziging van de in het eerste lid bedoelde richtlijn treedt voor de toepassing van dit artikel in werking met
      ingang van de dag waarop aan de betrokken wijziging uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel4a
  - number: 4a.3
    text: Onze Minister doet mededeling in de *Staatscourant* van een wijziging als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel4a
  - number: '5'
    text: |-
      Op de recipiënt en, in voorkomend geval, op de buitenverpakking van diergeneesmiddelen waarop hoofdstuk IV van de
      wet van toepassing is, dient onverminderd het bepaalde in [artikel 4][ref1] of 6 te worden vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0004022#Artikel4
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004022
        artikel: '4'
  - number: 5.a
    text: |-
      wanneer het diergeneesmiddel niet krachtens artikel 30, vierde lid, van de wet is aangewezen: "uitsluitend
      aflevering door de dierenarts of op recept van de dierenarts door de apotheker", danwel: "U.D.A.";
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel5
  - number: 5.b
    text: |-
      wanneer het diergeneesmiddel krachtens artikel 30, vierde lid, van de wet is aangewezen: "uitsluitend aflevering en
      toepassing door de dierenarts", dan wel: "U.D.D.".
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel5
  - number: '6.1'
    text: |-
      Op de recipiënt en, in voorkomend geval, op de buitenverpakking van een niet-geregistreerd diergeneesmiddel
      dat krachtens het [Besluit uitzonderingen registratieregime diergeneesmiddelen][ref1] (*Stb.* 1986, 228) van
      registratieplicht is vrijgesteld, dienen te worden vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0003929
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003929
  - number: 6.1.a
    text: |-
      de naam van het diergeneesmiddel, onmiddellijk gevolgd door de kwalitatieve en kwantitatieve samenstelling naar
      werkzame bestanddelen, afhankelijk van de farmaceutische vorm aangegeven per dosis of in procenten;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel6
  - number: 6.1.b
    text: |-
      de naam of handelsnaam en het adres van degene die voor het in de handel brengen van het diergeneesmiddel in
      Nederland verantwoordelijk is;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel6
  - number: 6.1.c
    text: de aanduiding van de partij waarvan het diergeneesmiddel deel uitmaakt;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel6
  - number: 6.1.d
    text: |-
      het woord "diergeneesmiddel" en de diersoort of diersoorten waarvoor het diergeneesmiddel is bestemd en de dosering
      of doseringen waarin het dient te worden toegepast;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel6
  - number: 6.1.e
    text: de uiterste gebruiksdatum, indien de maximale houdbaarheidsduur minder dan 3 jaar bedraagt;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel6
  - number: 6.1.f
    text: de aanbevelingen omtrent de wijze van bewaring;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel6
  - number: 6.1.g
    text: de veiligheidsmaatregelen voor de gebruiker;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel6
  - number: 6.1.h
    text: de farmaceutische vorm en de inhoud naar gewicht, het volume of het aantal doses.
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel6
  - number: '6.2'
    text: |-
      Op de recipiënt, en in voorkomend geval, op de buitenverpakking van een homeopathisch diergeneesmiddel, als bedoeld
      in [artikel 2, eerste lid, van het Besluit uitzonderingen registratieregime diergeneesmiddelen][ref1] (*Stb.* 1986,
      228), dient in afwijking van het bepaalde in het eerste lid onder *d*, in plaats van het woord "diergeneesmiddel"
      te worden vermeld: "homeopathisch diergeneesmiddel vrijgesteld van registratieplicht" en zonder goedgekeurde
      therapeutische indicatie.


      [ref1]: https://wetten.overheid.nl/BWBR0003929#Artikel2
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003929
        artikel: '2'
  - number: '7'
    text: |-
      Op de recipiënt en, in voorkomend geval, op de buitenverpakking van een door een dierenarts of apotheker ingevolge
      het bepaalde in artikel 2, tweede lid, onderdeel *a*, van de wet bereid diergeneesmiddel dienen, in afwijking van
      het bepaalde in [artikel 6][ref1], te worden vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0004022#Artikel6
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004022
        artikel: '6'
  - number: 7.a
    text: de naam van de bereider;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel7
  - number: 7.b
    text: |-
      de naam van het diergeneesmiddel, onmiddellijk gevolgd door de kwalitatieve en kwantitatieve samenstelling van
      werkzame bestanddelen, afhankelijk van de farmaceutische vorm aangegeven per dosis of in procenten;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel7
  - number: 7.c
    text: de naam van de houder van het dier of de dieren waarvoor het middel is bereid;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel7
  - number: 7.d
    text: de dosering waarin het diergeneesmiddel moet worden toegepast en wijze van toediening;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel7
  - number: 7.e
    text: de bij aflevering van het dier of produkten van het dier in acht te nemen wachttermijn;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel7
  - number: 7.f
    text: de datum van bereiding;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel7
  - number: 7.g
    text: aanbevelingen omtrent het gebruik en de bewaring van het diergeneesmiddel;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel7
  - number: 7.h
    text: de eventuele veiligheidsmaatregelen voor de gebruiker;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel7
  - number: 7.i
    text: de uiterste gebruiksdatum, indien de maximale houdbaarheidstermijn minder dan drie jaar bedraagt.
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel7
  - number: '8.1'
    text: |-
      In afwijking van het bepaalde in de [artikelen 4][ref1], [4][ref2], [6][ref3] en [7][ref4] is het toegestaan
      niet alle in die artikelen bedoelde gegevens op de recipiënt en in voorkomend geval op de buitenverpakking te
      vermelden, doch uitsluitend in het geval dat een buitenverpakking aanwezig is én zich in deze buitenverpakking een
      bijsluiter bevindt, met dien verstande dat de gegevens genoemd in het tweede lid te allen tijde op de recipiënt en
      in voorkomend geval op de buitenverpakking moeten voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004022#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004022#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0004022#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0004022#Artikel7
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004022
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0004022
        artikel: 4a
      - id: ref3
        bwb_id: BWBR0004022
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0004022
        artikel: '7'
  - number: '8.2'
    text: 'De in het eerste lid bedoelde gegevens zijn:'
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel8
  - number: 8.2.a
    text: het woord "diergeneesmiddel" en de naam van het diergeneesmiddel;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel8
  - number: 8.2.b
    text: de kwalitatieve en kwantitatieve samenstelling aan werkzame bestanddelen;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel8
  - number: 8.2.c
    text: de wijze van toediening;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel8
  - number: 8.2.d
    text: |-
      indien het een geregistreerd diergeneesmiddel betreft het nummer waaronder de registratie is verleend voorafgegaan
      door de letters: Reg. NL en in voorkomend geval Reg. NL H;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel8
  - number: 8.2.e
    text: de aanduiding van de partij;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel8
  - number: 8.2.f
    text: de uiterste gebruiksdatum.
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel8
  - number: '9.1'
    text: |-
      In alle gevallen dat een bijsluiter aanwezig is, dient deze bijsluiter uitsluitend betrekking te hebben op het
      betrokken diergeneesmiddel en dient voorts aan de in het tweede en derde lid gestelde eisen te zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel9
  - number: '9.2'
    text: |-
      De bijsluiter dient tenminste de in de [artikelen 4][ref1], [4][ref2], [6][ref3] of [7][ref4] bedoelde gegevens
      te bevatten met uitzondering van de aanduiding van de partij, de uiterste gebruiksdatum, de produktiedatum, de
      farmaceutische vorm en inhoud, terwijl voorts, voor zover deze ook bij de registratiebeslissing zijn vermeld,
      dienen te worden aangegeven de belangrijkste therapeutische indicaties, contraïndicaties en bijwerkingen voor zover
      deze gegevens noodzakelijk zijn voor het gebruik van het desbetreffende diergeneesmiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0004022#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004022#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0004022#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0004022#Artikel7
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004022
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0004022
        artikel: 4a
      - id: ref3
        bwb_id: BWBR0004022
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0004022
        artikel: '7'
  - number: '9.3'
    text: |-
      Andere vermeldingen betreffende het diergeneesmiddel dienen duidelijk van vorenbedoelde gegevens gescheiden te
      zijn.
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel9
  - number: '10.1'
    text: |-
      Alle ingevolge dit besluit voorgeschreven vermeldingen dienen te zijn gesteld in de Nederlandse taal in goed
      leesbaar en onuitwisbaar schrift.
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel10
  - number: '10.2'
    text: |-
      Andere dan de ingevolge de [artikelen 4][ref1] en [5][ref2] tot en met [9][ref3] voorgeschreven vermeldingen
      mogen op, aan of bij de verpakking of op het begeleidend document slechts voorkomen voor zover zij niet met
      de voorgeschreven vermeldingen in strijd zijn en voor zover zij niet misleidend zijn ten aanzien van aard,
      samenstelling, eigenschappen en toepassingswijze van het diergeneesmiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0004022#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004022#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0004022#Artikel9
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004022
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0004022
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0004022
        artikel: '9'
  - number: '11'
    text: |-
      Op de omdoos moet, onverminderd het bepaalde bij of krachtens de [Wet vervoer gevaarlijke stoffen][ref1], worden
      vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0007606
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007606
  - number: 11.a
    text: |-
      de naam van het diergeneesmiddel en het nummer waaronder het is geregistreerd, danwel indien het een niet-
      geregistreerd diergeneesmiddel betreft de ingevolge [artikel 6][ref1] van dit besluit voorgeschreven naam;


      [ref1]: https://wetten.overheid.nl/BWBR0004022#Artikel6
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004022
        artikel: '6'
  - number: 11.b
    text: de naam en het adres van de registratiehouder;
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel11
  - number: 11.c
    text: het nummer van de partij.
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel11
  - number: '12.1'
    text: |-
      Op de recipiënt en, in voorkomend geval, op de buitenverpakking van diergeneesmiddelen, bestemd voor uitvoer zijn
      de verpakkingsvoorschriften van [artikel 3][ref1] en de etiketteringsvoorschriften van de [artikelen 4][ref2],
      [4][ref3], [6][ref4], [8][ref5] en [10, tweede lid][ref6], van toepassing, met dien verstande dat alle
      aanduidingen op de verpakking gesteld moeten zijn in de taal of één der talen van het land van bestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0004022#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004022#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0004022#Artikel4a
      [ref4]: https://wetten.overheid.nl/BWBR0004022#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0004022#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0004022#Artikel10
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004022
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0004022
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0004022
        artikel: 4a
      - id: ref4
        bwb_id: BWBR0004022
        artikel: '6'
      - id: ref5
        bwb_id: BWBR0004022
        artikel: '8'
      - id: ref6
        bwb_id: BWBR0004022
        artikel: '10'
  - number: '12.2'
    text: |-
      Het bepaalde in het eerste lid is niet van toepassing voor zover degene die het diergeneesmiddel uitvoert aantoont,
      dat verpakking en etikettering in overeenstemming zijn, of zijn gebracht met de eisen van het land van bestemming.
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel12
  - number: '12.3'
    text: |-
      Onze Minister kan nadere regelen stellen omtrent de verpakking en de etikettering van diergeneesmiddelen bestemd
      voor uitvoer.
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel12
  - number: '13.1'
    text: |-
      Dit besluit treedt, behoudens het bepaalde in het tweede lid, in werking op de eerste dag van de zesde maand na de
      datum van uitgifte van het *Staatsblad* waarin het is geplaatst.
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel13
  - number: 13.2.a
    text: |-
      Ten aanzien van diergeneesmiddelen waarop het
      "[Besluit uitzonderingen registratieregime diergeneesmiddelen][ref1]"(*Stb.* 1986, 228) van toepassing is, treden
      [artikel 2][ref2] en de [artikelen 4][ref3] tot en met [12][ref4] van dit besluit in werking twee jaar na de
      inwerkingtreding van artikel 2 van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003929
      [ref2]: https://wetten.overheid.nl/BWBR0004022#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004022#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0004022#Artikel12
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003929
      - id: ref2
        bwb_id: BWBR0004022
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0004022
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0004022
        artikel: '12'
  - number: 13.2.b
    text: |-
      Indien op een aanvraag tot registratie van een diergeneesmiddel, waarop artikel 58, tweede lid, van de wet
      van toepassing is, een registratiebeslissing is genomen die vóór 1 november 1992 onherroepelijk is geworden,
      blijft het voor dat tijdstip geldende recht terzake de voorschriften omtrent verpakking en etikettering, op dat
      diergeneesmiddel van toepassing met dien verstande dat, indien het een aanvraag betreft waar na 1 januari 1992
      nog een schorsing op van toepassing was, [artikel 2][ref1] en de [artikelen 4][ref2] tot en met [12][ref3] ten
      aanzien van dat diergeneesmiddel in werking treden één jaar nà het tijdstip waarop de beslissing tot registratie
      onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0004022#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004022#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0004022#Artikel12
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004022
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004022
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0004022
        artikel: '12'
  - number: 13.2.c
    text: |-
      Indien op een aanvraag tot registratie van een diergeneesmiddel, waarop artikel 58, tweede lid, van de wet van
      toepassing is, een registratiebeslissing is genomen die binnen drie maanden ná 31 oktober 1992 onherroepelijk
      is geworden, treden [artikel 2][ref1] en de [artikelen 4][ref2] tot en met [12][ref3] ten aanzien van dat
      diergeneesmiddel in werking met ingang van 1 maart 1993.


      [ref1]: https://wetten.overheid.nl/BWBR0004022#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004022#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0004022#Artikel12
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004022
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004022
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0004022
        artikel: '12'
  - number: '13.3'
    text: |-
      Voor zolang, ingevolge het bepaalde bij het tweede lid, onderdeel *b*, ten aanzien van een daarbedoeld
      diergeneesmiddel de [artikelen 2][ref1] alsmede 4 tot en met 12 van dit besluit geen toepassing vinden, is
      het slechts toegestaan een diergeneesmiddel af te leveren indien, wanneer het verpakt is op de verpakking, en
      wanneer het niet verpakt is op een begeleidend document tenminste als gegevens zijn vermeld: - de naam van het
      diergeneesmiddel;
        - de naam of handelsnaam en het adres van degene die voor het in de handel brengen van het diergeneesmiddel in
      Nederland verantwoordelijk is;
        - de naam van de werkzame stof of stoffen;
        - één der navolgende vermeldingen: diergeneesmiddel, voor diergeneeskundig gebruik, ad usum veterinarum of ad.
      us. vet.


      [ref1]: https://wetten.overheid.nl/BWBR0004022#Artikel2
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004022
        artikel: '2'
  - number: '13.4'
    text: 'Dit besluit kan worden aangehaald als: "Besluit verpakking en etikettering diergeneesmiddelen".'
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel13
  - number: '13.4'
    text: |-
      Het derde lid is van overeenkomstige toepassing op diergeneesmiddelen waarop artikel 58, tweede lid, van de wet
      van toepassing is, gedurende de periode waarop op de in dat artikel bedoelde aanvraag tot registratie nog niet
      onherroepelijk is beslist.
    url: https://wetten.overheid.nl/BWBR0004022/2004-10-18#Artikel13
