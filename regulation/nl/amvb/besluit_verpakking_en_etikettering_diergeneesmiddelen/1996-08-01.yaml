  - number: '9'
    text: |-
      1 In alle gevallen dat een bijsluiter aanwezig is, dient deze bijsluiter uitsluitend betrekking te hebben op het
      betrokken diergeneesmiddel en dient voorts aan de in het tweede en derde lid gestelde eisen te zijn voldaan.

      2 De bijsluiter dient tenminste de in de [artikelen 4][ref1], [4][ref2], [6][ref3] of [7][ref4] bedoelde
      gegevens te bevatten met uitzondering van de aanduiding van de partij, de uiterste gebruiksdatum, de
      produktiedatum, de farmaceutische vorm en inhoud, terwijl voorts, voor zover deze ook bij de registratiebeslissing
      zijn vermeld, dienen te worden aangegeven de belangrijkste therapeutische indicaties, contraïndicaties en
      bijwerkingen voor zover deze gegevens noodzakelijk zijn voor het gebruik van het desbetreffende diergeneesmiddel.

      3 Andere vermeldingen betreffende het diergeneesmiddel dienen duidelijk van vorenbedoelde gegevens gescheiden te
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004022#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004022#Artikel4a
