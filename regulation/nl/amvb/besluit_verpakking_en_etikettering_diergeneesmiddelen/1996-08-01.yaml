  - number: '11'
    text: |-
      Op de omdoos moet, onverminderd het bepaalde bij of krachtens de [Wet vervoer gevaarlijke stoffen][ref1], worden
      vermeld:

      a. de naam van het diergeneesmiddel en het nummer waaronder het is geregistreerd, danwel indien het een niet-
      geregistreerd diergeneesmiddel betreft de ingevolge [artikel 6][ref2] van dit besluit voorgeschreven naam;

      b. de naam en het adres van de registratiehouder;

      c. het nummer van de partij.


      [ref1]: https://wetten.overheid.nl/BWBR0007606
      [ref2]: https://wetten.overheid.nl/BWBR0004022#Artikel6
