  - number: '13'
    text: |-
      1 Dit besluit treedt, behoudens het bepaalde in het tweede lid, in werking op de eerste dag van de zesde maand na
      de datum van uitgifte van het *Staatsblad* waarin het is geplaatst.

      2 a. Ten aanzien van diergeneesmiddelen waarop het
      "[Besluit uitzonderingen registratieregime diergeneesmiddelen][ref1]"(*Stb.* 1986, 228) van toepassing is, treden
      [artikel 2][ref2] en de [artikelen 4][ref3] tot en met [12][ref4] van dit besluit in werking twee jaar na de
      inwerkingtreding van artikel 2 van de wet.

      b. Indien op een aanvraag tot registratie van een diergeneesmiddel, waarop artikel 58, tweede lid, van de wet
      van toepassing is, een registratiebeslissing is genomen die vóór 1 november 1992 onherroepelijk is geworden,
      blijft het voor dat tijdstip geldende recht terzake de voorschriften omtrent verpakking en etikettering, op dat
      diergeneesmiddel van toepassing met dien verstande dat, indien het een aanvraag betreft waar na 1 januari 1992
      nog een schorsing op van toepassing was, [artikel 2][ref5] en de [artikelen 4][ref6] tot en met [12][ref7] ten
      aanzien van dat diergeneesmiddel in werking treden één jaar nà het tijdstip waarop de beslissing tot registratie
      onherroepelijk is geworden.

      c. Indien op een aanvraag tot registratie van een diergeneesmiddel, waarop artikel 58, tweede lid, van de wet
      van toepassing is, een registratiebeslissing is genomen die binnen drie maanden ná 31 oktober 1992 onherroepelijk
      is geworden, treden [artikel 2][ref8] en de [artikelen 4][ref9] tot en met [12][ref10] ten aanzien van dat
      diergeneesmiddel in werking met ingang van 1 maart 1993.

      3 Voor zolang, ingevolge het bepaalde bij het tweede lid, onderdeel *b*, ten aanzien van een daarbedoeld
      diergeneesmiddel de [artikelen 2][ref11] alsmede 4 tot en met 12 van dit besluit geen toepassing vinden, is het
      slechts toegestaan een diergeneesmiddel af te leveren indien, wanneer het verpakt is op de verpakking, en wanneer
      het niet verpakt is op een begeleidend document tenminste als gegevens zijn vermeld:

      - de naam van het diergeneesmiddel;
      - de naam of handelsnaam en het adres van degene die voor het in de handel brengen van het diergeneesmiddel in
      Nederland verantwoordelijk is;
      - de naam van de werkzame stof of stoffen;
      - één der navolgende vermeldingen: diergeneesmiddel, voor diergeneeskundig gebruik, ad usum veterinarum of ad.
      us. vet.

      4 Dit besluit kan worden aangehaald als: "Besluit verpakking en etikettering diergeneesmiddelen".

      4 Het derde lid is van overeenkomstige toepassing op diergeneesmiddelen waarop artikel 58, tweede lid, van de wet
      van toepassing is, gedurende de periode waarop op de in dat artikel bedoelde aanvraag tot registratie nog niet
      onherroepelijk is beslist.


