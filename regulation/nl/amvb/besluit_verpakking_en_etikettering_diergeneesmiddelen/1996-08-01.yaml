        bwb_id: BWBR0004022
        artikel: '6'
  - number: '3'
    text: >-
      1 De verpakking van een diergeneesmiddel moet van een zodanige aard en constructie zijn dat zij tegen elke
      normale behandeling bestand is, dat niets van de inhoud kan ontsnappen en dat samenstelling en zuiverheid van het
      daarin verpakte diergeneesmiddel gedurende de aangegeven maximale houdbaarheidstermijn onder de voorgeschreven of
      aanbevolen bewaaromstandigheden gewaarborgd blijven.


      2 De sluiting van de recipiënt en, in voorkomend geval, van de buitenverpakking dient van een zodanige constructie
      te zijn, dat deze niet zonder zichtbare en onherstelbare beschadiging kan worden geopend.
    url: https://wetten.overheid.nl/BWBR0004022/1996-08-01#Artikel3
  - number: '4'
    text: >-
      1 Op de recipiënt en, in voorkomend geval, op de buitenverpakking van een geregistreerd diergeneesmiddel dienen,
      overeenkomstig de bij de registratie gegeven voorschriften, te worden vermeld:


      a. de naam van het diergeneesmiddel, onmiddellijk gevolgd door de kwalitatieve en kwantitatieve samenstelling naar
      werkzame bestanddelen, afhankelijk van de farmaceutische vorm aangegeven per dosis of in procenten overeenkomstig
      de algemene internationale benaming, zoals die wordt aanbevolen door de Wereldgezondheidsorganisatie danwel bij het
      ontbreken van een zodanige benaming een anderszins algemeen gangbare benaming met dien verstande dat in het geval
      het diergeneesmiddel slechts één werkzaam bestanddeel bevat en voor dat diergeneesmiddel een fantasienaam wordt
      gebruikt, die fantasienaam duidelijk leesbaar vergezeld dient te gaan van de naam van het werkzame bestanddeel;


      b. het nummer waaronder de registratie werd verleend, voorafgegaan door de letters "Reg. NL";


      c. de naam of handelsnaam en het adres van de registratiehouder alsmede, indien deze niet tevens registratiehouder
      is, de naam, handelsnaam of het merk van de fabrikant;


      d. de aanduiding van de partij waarvan het diergeneesmiddel deel uitmaakt;


      e. het woord "diergeneesmiddel" dan wel in voorkomend geval de woorden "homeopatisch diergeneesmiddel" alsmede
      de diersoort of diersoorten waarvoor de dosering of doseringen waarin en de wijze of wijzen waarop het betrokken
      diergeneesmiddel uitsluitend mag worden gebruikt;


      f. de wachttermijn of termijnen, ook indien de duur van een zodanige termijn op nul is gesteld;


      g. de uiterste gebruiksdatum, indien de maximale houdbaarheidsduur minder dan 3 jaar bedraagt. Indien deze maximale
      houdbaarheidsduur méér dan 3 jaar bedraagt mag zulks op de verpakking worden vermeld;


      h. de aanbevelingen omtrent de wijze van bewaring en zo nodig aanwijzingen omtrent de te nemen voorzorgsmaatregelen
      bij het zich ontdoen van niet gebruikte diergeneesmiddelen en daarvan afkomstige afvalprodukten;


      i. de veiligheidsmaatregelen voor de gebruiker;


      j. de overige bij de registratie voorgeschreven aanduidingen;


      k. de farmaceutische vorm, de inhoud naar gewicht, het volume of aantal doses.


      2 Op de recipiënt en, in voorkomend geval, op de buitenverpakking van sera, entstoffen en biologische diagnostica
      dienen onverminderd het bepaalde in het eerste lid en de krachtens artikel 14 van de wet voorgeschreven
      aanduidingen te worden vermeld:


      a. de types en gehalten van de organismen waarmee of waaruit het produkt is bereid;


      b. de toegepaste antimicrobiële toevoegingen;


      c. in voorkomend geval de naam of samenstelling van het verdunnings- of suspensiemedium en de termijn waarbinnen
      het verdunde of geconstitueerde dan wel gereconstitueerde produkt dient te worden toegepast.
    url: https://wetten.overheid.nl/BWBR0004022/1996-08-01#Artikel4
  - number: 4a
    text: |-
      1 In afwijking van [artikel 4][ref1], worden op de recipiënt en in voorkomend geval op de buitenverpakking van een
      homeopatisch diergeneesmiddel dat is geregistreerd overeenkomstig artikel 7 van [richtlijn 92/74/EEG](31992L0074),
      overeenkomstig de bij de registratie gegeven voorschriften uitsluitend vermeld:

      a. de woorden "homeopatisch diergeneesmiddel zonder goedgekeurde therapeutische indicatie";

      b. de naam van het diergeneesmiddel en de wetenschappelijke benaming van de homeopatische grondstof of
      grondstoffen, gevolgd door de verdunningsgraad, waarvoor gebruik wordt gemaakt van de symbolen van de Europese
      Farmacopee of een andere op 22 september 1992 binnen de Europese Gemeenschappen officieel geldende farmacopee;

      c. het nummer waaronder de registratie is verleend, voorafgegaan door de letters "Reg. NL H";

      d. de naam of handelsnaam en het adres van de registratiehouder alsmede, indien deze niet tevens registratiehouder
      is, de naam, de handelsnaam of het merk van de fabrikant;

      e. de aanduiding van de partij waarvan het betrokken homeopatisch diergeneesmiddel deel uitmaakt;

      f. de diersoort of diersoorten waarvoor, de wijze van gebruik en, indien noodzakelijk, de wijze van toediening;

      g. de uiterste gebruiksdatum uitgedrukt in maand en jaar;

      h. de farmaceutische vorm;

      i. de inhoud van de recipiënt naar gewicht, volume of aantal doses;

      j. de aanbevelingen omtrent de wijze van bewaring, en

      k. zonodig de veiligheidsmaatregelen en bijzondere waarschuwingen voor de gebruiker.

      2 Een wijziging van de in het eerste lid bedoelde richtlijn treedt voor de toepassing van dit artikel in werking
      met ingang van de dag waarop aan de betrokken wijziging uitvoering moet zijn gegeven.

      3 Onze Minister doet mededeling in de *Staatscourant* van een wijziging als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004022#Artikel4
    url: https://wetten.overheid.nl/BWBR0004022/1996-08-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0004022
        artikel: '4'
  - number: '5'
    text: |-
      Op de recipiënt en, in voorkomend geval, op de buitenverpakking van diergeneesmiddelen waarop hoofdstuk IV van de
      wet van toepassing is, dient onverminderd het bepaalde in [artikel 4][ref1] of 6 te worden vermeld:

      a. wanneer het diergeneesmiddel niet krachtens artikel 30, vierde lid, van de wet is aangewezen: "uitsluitend
      aflevering door de dierenarts of op recept van de dierenarts door de apotheker", danwel: "U.D.A.";

      b. wanneer het diergeneesmiddel krachtens artikel 30, vierde lid, van de wet is aangewezen: "uitsluitend aflevering
      en toepassing door de dierenarts", dan wel: "U.D.D.".


      [ref1]: https://wetten.overheid.nl/BWBR0004022#Artikel4
    url: https://wetten.overheid.nl/BWBR0004022/1996-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004022
        artikel: '4'
  - number: '6'
    text: |-
      1 Op de recipiënt en, in voorkomend geval, op de buitenverpakking van een niet-geregistreerd diergeneesmiddel
      dat krachtens het [Besluit uitzonderingen registratieregime diergeneesmiddelen][ref1] (*Stb.* 1986, 228) van
      registratieplicht is vrijgesteld, dienen te worden vermeld:

      a. de naam van het diergeneesmiddel, onmiddellijk gevolgd door de kwalitatieve en kwantitatieve samenstelling naar
      werkzame bestanddelen, afhankelijk van de farmaceutische vorm aangegeven per dosis of in procenten;

      b. de naam of handelsnaam en het adres van degene die voor het in de handel brengen van het diergeneesmiddel in
      Nederland verantwoordelijk is;

      c. de aanduiding van de partij waarvan het diergeneesmiddel deel uitmaakt;

      d. het woord "diergeneesmiddel" en de diersoort of diersoorten waarvoor het diergeneesmiddel is bestemd en de
      dosering of doseringen waarin het dient te worden toegepast;

      e. de uiterste gebruiksdatum, indien de maximale houdbaarheidsduur minder dan 3 jaar bedraagt;

      f. de aanbevelingen omtrent de wijze van bewaring;

      g. de veiligheidsmaatregelen voor de gebruiker;

      h. de farmaceutische vorm en de inhoud naar gewicht, het volume of het aantal doses.

      2 Op de recipiënt, en in voorkomend geval, op de buitenverpakking van een homeopathisch diergeneesmiddel, als
      bedoeld in [artikel 2, eerste lid, van het Besluit uitzonderingen registratieregime diergeneesmiddelen][ref2]
      (*Stb.* 1986, 228), dient in afwijking van het bepaalde in het eerste lid onder *d*, in plaats van het woord
      "diergeneesmiddel" te worden vermeld: "homeopathisch diergeneesmiddel vrijgesteld van registratieplicht" en zonder
      goedgekeurde therapeutische indicatie.


      [ref1]: https://wetten.overheid.nl/BWBR0003929
      [ref2]: https://wetten.overheid.nl/BWBR0003929#Artikel2
    url: https://wetten.overheid.nl/BWBR0004022/1996-08-01#Artikel6
    references:
      - id: ref1
