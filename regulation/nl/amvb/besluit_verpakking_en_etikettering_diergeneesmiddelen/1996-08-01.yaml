        artikel: '6'
  - number: '12'
    text: |-
      1 Op de recipiënt en, in voorkomend geval, op de buitenverpakking van diergeneesmiddelen, bestemd voor uitvoer
      zijn de verpakkingsvoorschriften van [artikel 3][ref1] en de etiketteringsvoorschriften van de [artikelen 4][ref2],
      [4][ref3], [6][ref4], [8][ref5] en [10, tweede lid][ref6], van toepassing, met dien verstande dat alle
      aanduidingen op de verpakking gesteld moeten zijn in de taal of één der talen van het land van bestemming.

      2 Het bepaalde in het eerste lid is niet van toepassing voor zover degene die het diergeneesmiddel uitvoert
      aantoont, dat verpakking en etikettering in overeenstemming zijn, of zijn gebracht met de eisen van het land van
      bestemming.

      3 Onze Minister kan nadere regelen stellen omtrent de verpakking en de etikettering van diergeneesmiddelen bestemd
      voor uitvoer.


