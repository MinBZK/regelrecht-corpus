preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van de Staatssecretaris van Landbouw en Visserij, van 18 december 1985, no. J 7942, Directie
    Juridische en Bedrijfsorganisatorische Zaken, gedaan in overeenstemming met de Staatssecretaris van Welzijn,
    Volksgezondheid en Cultuur na overleg met de Staatssecretaris van Sociale Zaken en Werkgelegenheid;


    Gelet op artikel 42, eerste lid, onderdeel a en onderdeel b, van de Diergeneesmiddelenwet (Stb. 1985, 410);


    Gehoord de Dibevo, de Vereniging van Fabrikanten en Groothandelaren in Veterinaire Produkten (Fagrovet), de
    Vereniging van Fabrikanten en Importeurs van Diergeneesmiddelen in Nederland (Fidin), de Koninklijke Nederlandse
    Maatschappij voor Diergeneeskunde, de Vereniging van Fabrikanten en Importeurs van Toevoegingsmiddelen (Nefato), de
    Nederlandse Associatie van Homeopathische/Farmaceutische Ondernemingen (Nehoma) en het Produktschap voor Veevoeder;


    De Raad van State gehoord (advies van 5 maart 1986, nr. W11.85.0679/18.6.08.);


    Gezien het nader rapport van Onze Minister van Landbouw en Visserij van 15 augustus 1986, no. J. 2911, Directie
    Juridische en Bedrijfsorganisatorische Zaken, uitgebracht in overeenstemming met de Staatssecretaris van Welzijn,
    Volksgezondheid en Cultuur na overleg met de Staatssecretaris van Sociale Zaken en Werkgelegenheid;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004022/1996-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      "wet": [Diergeneesmiddelenwet][ref1] (*Stb.* 1985, 410);

      [richtlijn 92/74/EEG](31992L0074): [richtlijn 92/74/EEG](31992L0074) van de Raad van de Europese Gemeenschappen van
      22 september 1992 tot uitbreiding van het toepassingsgebied van [richtlijn nr. 81/851/EEG](31981L0851) betreffende
      de aanpassing van de wettelijke en bestuursrechtelijke bepalingen inzake geneesmiddelen en tot vaststelling van
      aanvullende bepalingen voor homeopatische geneesmiddelen voor diergeneeskundig gebruik (*PbEG* L 297);

      homeopatisch diergeneesmiddel:

      a. een diergeneesmiddel dat is vermeld op de Lijst van homeopatische diergeneesmiddelen 1993, of

      b. een diergeneesmiddel dat, overeenkomstig een homeopatisch fabricageprocédé, zoals beschreven in de Europese
      Farmacopee dan wel in een andere op 22 september 1992 door de Lid-Staten van de Europese Gemeenschappen officieel
      gebruikte farmacopee, is verkregen uit produkten, substanties of mengsels die homeopatische grondstoffen worden
      genoemd;

      "verpakking": recipiënt, buitenverpakking of omdoos;

      "recipiënt": verpakking die met het diergeneesmiddel in aanraking komt;

      "buitenverpakking": verpakking waarin één of meer recipiënten die elk hetzelfde diergeneesmiddel bevatten zijn
      verpakt;

      "omdoos": verpakking waarin een aantal buitenverpakkingen van hetzelfde diergeneesmiddel zijn verpakt.

      2 Voor de toepassing van het bepaalde bij of krachtens dit besluit worden omhulsels, waarin diergeneesmiddelen aan
      een dier worden toegediend, alsmede poederpapier geacht deel uit te maken van het diergeneesmiddel.

      3 Dit besluit is niet van toepassing op:

      a. diergeneesmiddelen die overeenkomstig de [richtlijn 70/524/EEG](31970L0524) van de Raad van de Europese
      Gemeenschappen van 23 november 1970, betreffende toevoegingsmiddelen in diervoeding (*PbEG* L 270) zoals deze is of
      zal worden gewijzigd, als toevoegingsmiddel in diervoeder worden verwerkt;

      b. halffabrikaten voor de bereiding van gemedicineerd voeder die ingevolge
      [artikel 5, eerste lid, onderdeel ][ref2] (*Stb.* 1986, 228) zijn uitgezonderd van de registratieplicht.


      [ref1]: https://wetten.overheid.nl/BWBR0003818
      [ref2]: https://wetten.overheid.nl/BWBR0003929#Artikel5
    url: https://wetten.overheid.nl/BWBR0004022/1996-08-01#Artikel1
