      - id: ref2
        bwb_id: BWBR0003929
        artikel: '2'
  - number: '7'
    text: |-
      Op de recipiënt en, in voorkomend geval, op de buitenverpakking van een door een dierenarts of apotheker ingevolge
      het bepaalde in artikel 2, tweede lid, onderdeel *a*, van de wet bereid diergeneesmiddel dienen, in afwijking van
      het bepaalde in [artikel 6][ref1], te worden vermeld:

      a. de naam van de bereider;

      b. de naam van het diergeneesmiddel, onmiddellijk gevolgd door de kwalitatieve en kwantitatieve samenstelling van
      werkzame bestanddelen, afhankelijk van de farmaceutische vorm aangegeven per dosis of in procenten;

      c. de naam van de houder van het dier of de dieren waarvoor het middel is bereid;

      d. de dosering waarin het diergeneesmiddel moet worden toegepast en wijze van toediening;

      e. de bij aflevering van het dier of produkten van het dier in acht te nemen wachttermijn;

      f. de datum van bereiding;

      g. aanbevelingen omtrent het gebruik en de bewaring van het diergeneesmiddel;

      h. de eventuele veiligheidsmaatregelen voor de gebruiker;

      i. de uiterste gebruiksdatum, indien de maximale houdbaarheidstermijn minder dan drie jaar bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0004022#Artikel6
    url: https://wetten.overheid.nl/BWBR0004022/1996-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004022
        artikel: '6'
  - number: '8'
    text: |-
      1 In afwijking van het bepaalde in de [artikelen 4][ref1], [4][ref2], [6][ref3] en [7][ref4] is het toegestaan
      niet alle in die artikelen bedoelde gegevens op de recipiënt en in voorkomend geval op de buitenverpakking te
      vermelden, doch uitsluitend in het geval dat een buitenverpakking aanwezig is én zich in deze buitenverpakking een
      bijsluiter bevindt, met dien verstande dat de gegevens genoemd in het tweede lid te allen tijde op de recipiënt en
      in voorkomend geval op de buitenverpakking moeten voorkomen.

      2 De in het eerste lid bedoelde gegevens zijn:

      a. het woord "diergeneesmiddel" en de naam van het diergeneesmiddel;

      b. de kwalitatieve en kwantitatieve samenstelling aan werkzame bestanddelen;

      c. de wijze van toediening;

      d. indien het een geregistreerd diergeneesmiddel betreft het nummer waaronder de registratie is verleend
      voorafgegaan door de letters:

      Reg. NL en in voorkomend geval Reg. NL H;

      e. de aanduiding van de partij;

      f. de uiterste gebruiksdatum.


      [ref1]: https://wetten.overheid.nl/BWBR0004022#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004022#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0004022#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0004022#Artikel7
