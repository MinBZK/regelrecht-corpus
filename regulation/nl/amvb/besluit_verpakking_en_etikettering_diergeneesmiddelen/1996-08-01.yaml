  - number: '2'
    text: |-
      1 Het is verboden diergeneesmiddelen onverpakt af te leveren aan anderen dan houders van vergunningen, bedoeld in
      de artikelen 21 en 33 van de wet.

      2 Het is slechts toegestaan een diergeneesmiddel af te leveren:

      a. indien het is verpakt, indien de verpakking voldoet aan het bepaalde in [artikel 3][ref1] en het is
      geëtiketteerd met inachtneming van het bepaalde in dit besluit;

      b. indien het niet is verpakt, indien het vergezeld is van een begeleidend document dat:

      - indien het een geregistreerd diergeneesmiddel betreft de gegevens bevat waarvan ingevolge de [artikelen 4][ref2]
      en [5][ref3] vermelding op de recipiënt is voorgeschreven;
      - indien het een niet-geregistreerd diergeneesmiddel betreft de gegevens bevat waarvan ingevolge [artikel 6][ref4]
      vermelding op de recipiënt is voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0004022#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004022#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0004022#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0004022#Artikel6
    url: https://wetten.overheid.nl/BWBR0004022/1996-08-01#Artikel2
