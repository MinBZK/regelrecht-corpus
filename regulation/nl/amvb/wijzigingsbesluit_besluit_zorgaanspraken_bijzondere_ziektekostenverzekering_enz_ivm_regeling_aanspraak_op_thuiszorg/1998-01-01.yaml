        bwb_id: BWBR0008253
        artikel: 16d
      - id: ref2
        bwb_id: BWBR0005283
        artikel: '15'
  - number: XII
    text: |-
      1 Tot 1 januari 1998 wordt voor de toepassing van de wet een instelling die op 31 december 1996 als
      kruisorganisatie ingevolge [artikel 8, eerste lid, van de Algemene Wet Bijzondere Ziektekosten][ref1] was
      toegelaten, als toegelaten aangemerkt.

      2 Tot 1 januari 1998 wordt voor de toepassing van de wet een instelling die op 31 december 1996 als instelling voor
      gezinsverzorging op grond van [artikel 39, derde lid, onder][ref2] subsidie ontving, als toegelaten aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004538#Artikel39
    url: https://wetten.overheid.nl/BWBR0008334/1998-01-01#ArtikelXII
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0004538
        artikel: '39'
  - number: XIII
    text: |-
      1 Een indicatieorgaan als bedoeld in [artikel 9][ref1] kan, voor zover het orgaan niet in staat is aanvragen zelf
      te behandelen, uiterlijk tot 1 januari 1998, aan ingevolge die wet toegelaten instellingen die zorg verlenen als
      bedoeld in [artikel 15 van het Besluit zorgaanspraken bijzondere ziektekostenverzekering][ref2], mandaat verlenen
      met betrekking tot het vaststellen van indicatiebeoordelingen.

      2 Het indicatieorgaan en de gemandateerde kunnen tot uiterlijk 1 januari 1998 afwijken van hetgeen in de artikelen
      2, zesde lid, en 8, eerste lid, van het Besluit indicatiebeoordeling verpleging en verzorging is bepaald ten
      aanzien van de werkwijze.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel9a
      [ref2]: https://wetten.overheid.nl/BWBR0005283#Artikel15
    url: https://wetten.overheid.nl/BWBR0008334/1998-01-01#ArtikelXIII
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 9a
      - id: ref2
        bwb_id: BWBR0005283
        artikel: '15'
  - number: XIV
    text: |-
      1 Het Besluit indicatiebeoordeling verpleging en verzorging is niet van toepassing ten aanzien van
      degenen aan wie op het tijdstip van inwerkingtreding van dit besluit zorg wordt verleend als bedoeld in
      [artikel 15, eerste lid, onder ][ref1] en aan wie onmiddellijk voorafgaand aan dat tijdstip ingevolge
      [artikel 15 van het Besluit zorgaanspraken bijzondere ziektekostenverzekering][ref2], zoals dat artikel luidde voor
      de inwerkingtreding van dit besluit, zorg werd verleend, bestaande uit verpleging of verzorging door of vanwege een
      kruisorganisatie dan wel gefinancierd op grond van de Regeling Ziekenfondsraad subsidiëring gezinsverzorging 1996
      of de Regeling Ziekenfondsraad subsidiëring intensieve thuiszorg 1996 hulp.

      2 Bij ministeriële regeling kan een tijdstip worden vastgesteld, met ingang waarvan het Besluit
      indicatiebeoordeling verpleging en verzorging van toepassing is op personen als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005283#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005283#Artikel15
    url: https://wetten.overheid.nl/BWBR0008334/1998-01-01#ArtikelXIV
    references:
      - id: ref1
        bwb_id: BWBR0005283
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0005283
        artikel: '15'
  - number: XV
    text: |-
      Voor kraamcentra die onmiddellijk voor het tijdstip van inwerkingtreding van dit besluit ingevolge
      [artikel 8][ref1] zijn toegelaten, blijft artikel 2 van het koninklijk besluit van 1 februari 1985, houdende
      toepassing van [artikel 8][ref2] (*Stb*. 84) gedurende een jaar na dat tijdstip buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel8a
    url: https://wetten.overheid.nl/BWBR0008334/1998-01-01#ArtikelXV
    references:
