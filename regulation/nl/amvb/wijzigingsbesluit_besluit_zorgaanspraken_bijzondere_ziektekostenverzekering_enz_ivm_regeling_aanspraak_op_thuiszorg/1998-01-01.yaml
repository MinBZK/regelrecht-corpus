        artikel: 8a
      - id: ref2
        bwb_id: BWBR0002460
        artikel: 8a
  - number: XVI
    text: |-
      In afwijking van [artikel 16][ref1] kan tot 1 juli 1997 voor de zorg, bedoeld in
      [artikel 2, eerste lid, onder ][ref2], de bijdrage worden gesteld op een bij ministeriële regeling vast te stellen
      bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel16g
      [ref2]: https://wetten.overheid.nl/BWBR0008252#Artikel2
    url: https://wetten.overheid.nl/BWBR0008334/1998-01-01#ArtikelXVI
    references:
