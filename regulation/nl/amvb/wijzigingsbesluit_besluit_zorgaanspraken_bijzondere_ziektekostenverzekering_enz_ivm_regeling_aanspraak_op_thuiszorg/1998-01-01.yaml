      - id: ref2
        bwb_id: BWBR0008252
        artikel: '2'
  - number: XVII
    text: |-
      Na de inwerkingtreding van dit besluit berust de Bijdrageregeling zorg tevens op [artikel 16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel16
    url: https://wetten.overheid.nl/BWBR0008334/1998-01-01#ArtikelXVII
    references:
      - id: ref1
        bwb_id: BWBR0008253
        artikel: '16'
  - number: XVIII
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008334/1998-01-01#ArtikelXVIII
