preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport en de Staatssecretaris van
    Volksgezondheid, Welzijn en Sport van 2 oktober 1996, VPZ/VU-962342, gedaan mede namens Onze Minister van
    Justitie en Onze Minister van Economische Zaken en in overeenstemming met de Staatssecretaris van Sociale Zaken
    en Werkgelegenheid;

    Gelet op de artikelen 6, eerste en derde lid, 8, tweede lid, 9a, 9b, 16 en 45, vierde lid, van de Algemene Wet
    Bijzondere Ziektekosten, de artikelen 8, tweede lid, 8a, tweede lid, 47, tweede lid, van de Ziekenfondswet,
    artikel 2, tweede lid, van de Wet op de toegang tot ziektekostenverzekeringen, artikel 15 van de Overgangswet
    verzorgingshuizen, de artikelen 1, tweede tot en met vijfde lid, en 17a van de Wet tarieven gezondheidszorg en
    artikel 6a van de Wet persoonsregistraties;

    De Raad van State gehoord (advies van 31 oktober 1996, no.W.13.96 0462);

    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport en de Staatssecretaris van
    Volksgezondheid, Welzijn en Sport van 15 november 1996, VPZ/VU-962879, uitgebracht mede namens Onze Minister van
    Justitie en Onze Minister van Economische Zaken en in overeenstemming met de Staatssecretaris van Sociale Zaken
    en Werkgelegenheid;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008334/1998-01-01#ArtikelAanhef
articles:
  - number: X
    text: |-
      [Artikel 16][ref1] is tot 24 maart 1997 niet van toepassing op de zorg, bedoeld in
      [artikel 15, eerste lid, onder ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel16d
      [ref2]: https://wetten.overheid.nl/BWBR0005283#Artikel15
    url: https://wetten.overheid.nl/BWBR0008334/1998-01-01#ArtikelX
    references:
