preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Justitie van 27 augustus 2001, nr. 5116667/01/6;

    Gelet op artikel 226l van het Wetboek van Strafvordering;

    De Raad van State gehoord (advies van 29 oktober 2001, no. W03.01.0454/1);

    Gezien het nader rapport van Onze Minister van Justitie van 14 december 2005, nr. 5390597/05/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0019359/2018-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019359/2018-08-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Veiligheid en Justitie;'
    url: https://wetten.overheid.nl/BWBR0019359/2018-08-01#Artikel1
  - number: 1.b
    text: 'College: het College van procureurs-generaal;'
    url: https://wetten.overheid.nl/BWBR0019359/2018-08-01#Artikel1
  - number: 1.c
    text: |-
      hoofdofficier van justitie: de hoofdofficier van justitie die verantwoordelijk is voor het opsporingsonderzoek of
      de vervolging in het kader waarvan een verzoek tot het treffen van beschermingsmaatregelen is gedaan;
    url: https://wetten.overheid.nl/BWBR0019359/2018-08-01#Artikel1
  - number: 1.d
    text: 'officier van justitie: de officier van justitie bij het landelijk parket, belast met getuigenbescherming;'
    url: https://wetten.overheid.nl/BWBR0019359/2018-08-01#Artikel1
  - number: 1.e
    text: |-
      onderdeel getuigenbescherming: het onderdeel bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019359#Artikel2
    url: https://wetten.overheid.nl/BWBR0019359/2018-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019359
        artikel: '2'
  - number: '2.1'
    text: |-
      Er is een onderdeel belast met getuigenbescherming bij een landelijke eenheid als bedoeld in
      [artikel 25, eerste lid, onderdeel b, van de Politiewet 2012][ref1], belast met:


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel25
    url: https://wetten.overheid.nl/BWBR0019359/2018-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '25'
  - number: 2.1.a
    text: het opstellen van dreigingsanalyses;
    url: https://wetten.overheid.nl/BWBR0019359/2018-08-01#Artikel2
  - number: 2.1.b
    text: |-
      het adviseren van het bevoegde gezag omtrent de bescherming van personen als bedoeld in [artikel 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019359#Artikel3
    url: https://wetten.overheid.nl/BWBR0019359/2018-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0019359
        artikel: '3'
  - number: 2.1.c
    text: de uitvoering van beschermingsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0019359/2018-08-01#Artikel2
  - number: '2.2'
    text: Dit onderdeel getuigenbescherming staat onder gezag van de officier van justitie.
    url: https://wetten.overheid.nl/BWBR0019359/2018-08-01#Artikel2
  - number: '3'
    text: |-
      Beschermingsmaatregelen kunnen worden getroffen ten aanzien van een getuige als bedoeld in [artikel 226a][ref1],
      [226g][ref2], [226k][ref3] of [226m van het Wetboek van Strafvordering][ref4] of van een andere persoon die
      medewerking heeft verleend aan de met de opsporing en vervolging van strafbare feiten belaste autoriteiten,
      voor zover daartoe een dringende noodzaak is ontstaan als gevolg van die medewerking en daarmee verband houdend
      overheidsoptreden.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel226a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel226g
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel226k
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel226m
    url: https://wetten.overheid.nl/BWBR0019359/2018-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 226a
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 226g
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 226k
      - id: ref4
        bwb_id: BWBR0001903
        artikel: 226m
  - number: '4.1'
    text: |-
      Het College kan het onderdeel getuigenbescherming opdragen ten aanzien van een persoon als bedoeld in
      [artikel 3][ref1] een dreigingsanalyse op te stellen en advies uit te brengen omtrent de te treffen
      beschermingsmaatregelen en de uitvoerbaarheid daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0019359#Artikel3
    url: https://wetten.overheid.nl/BWBR0019359/2018-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0019359
        artikel: '3'
  - number: '4.2'
    text: |-
      De opdracht, bedoeld in het eerste lid, geschiedt schriftelijk en kan zonodig mede betrekking hebben op de
      echtgenoot of levensgezel van de bedreigde persoon, diens kinderen, naaste familieleden of andere personen, voor
      zover zij een nauwe betrekking onderhouden met de bedreigde persoon.
    url: https://wetten.overheid.nl/BWBR0019359/2018-08-01#Artikel4
  - number: '5.1'
    text: |-
      Indien uit de dreigingsanalyse een dringende noodzaak tot het treffen van beschermingsmaatregelen blijkt en het
      onderdeel getuigenbescherming over de uitvoerbaarheid van de maatregelen advies heeft uitgebracht, kan het College
      het onderdeel getuigenbescherming opdragen maatregelen te treffen ter bescherming van de bedreigde persoon. In
      de bij besluit van Onze Minister aangewezen gevallen stelt het College Onze Minister terstond in kennis van het
      voornemen tot het verstrekken van een opdracht tot het treffen van beschermingsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0019359/2018-08-01#Artikel5
  - number: '5.2'
    text: |-
      De opdracht tot het treffen van beschermingsmaatregelen geschiedt schriftelijk en vermeldt haar geldigheidsduur. De
      opdracht kan zonodig mede betrekking hebben op de personen, bedoeld in [artikel 4, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019359#Artikel4
    url: https://wetten.overheid.nl/BWBR0019359/2018-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019359
        artikel: '4'
  - number: '6'
    text: |-
      In afwijking van de [artikelen 4][ref1] en [5][ref2], kan in spoedeisende gevallen Onze Minister, het College of
      een lid daarvan het onderdeel getuigenbescherming mondeling opdracht verstrekken tot het treffen van tijdelijke
      noodmaatregelen. Zo spoedig mogelijk na de mondelinge opdracht wordt deze op schrift gesteld en wordt een opdracht
      als bedoeld in[ artikel 4, eerste lid][ref3], verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0019359#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0019359#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0019359#Artikel4
    url: https://wetten.overheid.nl/BWBR0019359/2018-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019359
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0019359
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0019359
        artikel: '4'
  - number: '7.1'
    text: |-
      Indien een opdracht tot het treffen van beschermingsmaatregelen is verstrekt, sluit de officier van justitie met
      de te beschermen persoon een schriftelijke overeenkomst waarin in ieder geval bepalingen zijn opgenomen omtrent de
      verplichtingen van de te beschermen persoon en van het onderdeel getuigenbescherming alsmede de gevolgen van niet-
      nakoming daarvan.
    url: https://wetten.overheid.nl/BWBR0019359/2018-08-01#Artikel7
  - number: '7.2'
    text: |-
      Behoudens spoedeisende gevallen als bedoeld in [artikel 6][ref1], vangt de uitvoering van de
      beschermingsmaatregelen niet aan alvorens een overeenkomst als bedoeld in het eerste lid is gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0019359#Artikel6
    url: https://wetten.overheid.nl/BWBR0019359/2018-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019359
        artikel: '6'
  - number: '8.1'
    text: |-
      Uiterlijk een maand voordat de geldigheidsduur van de opdracht tot het treffen van beschermingsmaatregelen
      zal verstrijken rapporteert het onderdeel getuigenbescherming aan het College omtrent de uitvoering van de
      beschermingsmaatregelen. Van deze rapportage maken een geactualiseerde dreigingsanalyse en een advies omtrent de
      verlenging, wijziging of beëindiging van de opdracht deel uit. Het College beslist terzake.
    url: https://wetten.overheid.nl/BWBR0019359/2018-08-01#Artikel8
  - number: '8.2'
    text: |-
      Onverminderd het eerste lid, rapporteert het onderdeel getuigenbescherming aan het College, op zijn verzoek of uit
      eigen beweging, zodra daartoe aanleiding bestaat.
    url: https://wetten.overheid.nl/BWBR0019359/2018-08-01#Artikel8
  - number: '9.1'
    text: |-
      Op verzoek van een internationaal gerecht tot bescherming van een getuige kan Onze Minister, na advies
      van de officier van justitie, het onderdeel getuigenbescherming opdracht geven tot het uitvoeren van
      beschermingsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0019359/2018-08-01#Artikel9
  - number: '9.2'
    text: |-
      Op verzoek van een bevoegde autoriteit van een vreemde staat kan de officier van justitie het onderdeel
      getuigenbescherming opdragen beschermingsmaatregelen te treffen of voort te zetten ten aanzien van een daartoe door
      die autoriteit aangewezen persoon.
    url: https://wetten.overheid.nl/BWBR0019359/2018-08-01#Artikel9
  - number: '9.3'
    text: |-
      De opdracht, bedoeld in het eerste en tweede lid, geschiedt schriftelijk en vermeldt haar geldigheidsduur.
      Uiterlijk een maand voordat de geldigheidsduur zal verstrijken, rapporteert het onderdeel getuigenbescherming
      aan de officier van justitie omtrent de uitvoering van de beschermingsmaatregelen. Onze Minister beslist over de
      verlenging, wijziging of beëindiging van de opdracht in de gevallen bedoeld in het eerste lid; de officier van
      justitie beslist in de gevallen bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0019359/2018-08-01#Artikel9
  - number: '10'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0019359/2018-08-01#Artikel10
  - number: '11'
    text: 'Dit besluit wordt aangehaald als: Besluit getuigenbescherming.'
    url: https://wetten.overheid.nl/BWBR0019359/2018-08-01#Artikel11
