  - number: '2'
    text: |-
      De houder van een salpeterzuurfabriek draagt ervoor zorg, dat, behoudens bij opstarten en stilleggen, geen afgas
      wordt uitgeworpen, dat meer NOx, uitgedrukt als NO2, bevat dan 220 ppm gemiddeld per uur.
    url: https://wetten.overheid.nl/BWBR0004174/1998-03-27#Artikel2
  - number: '3'
    text: |-
      1 [Artikel 2][ref1] is niet van toepassing op een bestaande salpeterzuurfabriek.

      2 De houder van een bestaande salpeterzuurfabriek draagt ervoor zorg, dat, behoudens bij opstarten en stilleggen,
      met ingang van het vijfde jaar na de datum van inwerkingtreding van dit besluit geen afgas wordt uitgeworpen, dat
      meer NOx, uitgedrukt als NO2, bevat dan 600 ppm gemiddeld per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0004174#Artikel2
    url: https://wetten.overheid.nl/BWBR0004174/1998-03-27#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004174
        artikel: '2'
        paragraaf: '2'
  - number: '4'
    text: |-
      1 De houder van een salpeterzuurfabriek is verplicht de NOx-concentratie, uitgedrukt in tientallen ppm NO2, in het
      afgas te meten en te registreren.

      2 De meetinstallatie moet omvatten een monsternemingssysteem, een meetapparaat dat ieder moment de NOx-concentratie
      bepaalt, en een apparaat dat bij voortduring de NOx-concentratie vastlegt. Iedere dag moeten ten minste éénmaal de
      uurgemiddelde concentraties over die dag vastgesteld worden.

      3 Het in het tweede lid bedoelde meetapparaat moet alle NOx-concentraties in de afgassen tussen 0 en 1000 ppm
      kunnen meten.

      4 Het aansluitingspunt van het monsternemingssysteem moet zich bevinden in de afgasleiding en wel zo ver van een
      eventueel stroomafwaarts gelegen injectiepunt van lucht in het afgas, dat de gassamenstelling op het meetpunt geen
      invloed ondervindt van de luchtinjectie.

      5 De meetinstallatie moet zijn opgesteld in een deugdelijke, afsluitbare instrumentenkast. De instrumentenkast moet
      onder normale omstandigheden zijn afgesloten.

      6 Het monsternemingssysteem moet een zodanige constructie hebben, dat:

      a. de samenstelling van het gasvormige gedeelte van het monster hetzelfde is als die van het afgas of verdund is
      met lucht in een bekende en constante verhouding;

      b. er geen stof in het monster aanwezig is, dat het monsternemingssysteem zou kunnen verstoppen en het functioneren
      van het meetapparaat nadelig zou kunnen beïnvloeden;

      c. geen condensatie van water of zuur kan optreden;

      d. ijkgassen en gassen voor de nulpuntafstelling door de meetinstallatie kunnen worden gestuurd voor de controle en
      afstelling onder bedrijfscondities van het meetapparaat.

      7 Bij in bedrijf zijn van een salpeterzuurfabriek moet éénmaal per week een nulpuntafstelling plaatsvinden en het
      meetsysteem worden gecalibreerd met ijkgassen waarin NOx aanwezig moet zijn in een concentratie van 220 ppm. In
      afwijking van de eerste volzin moet bij bestaande salpeterzuurfabrieken NOx in de ijkgassen aanwezig zijn in een
      concentratie van 600 ppm dan wel in een concentratie die overeenkomt met de volgens de vergunning voor de bestaande
      salpeterzuurfabriek maximaal toegestane concentratie van NOx in het afgas. Indien meting plaatsvindt met een
      systeem waarbij het gasmonster wordt verdund, moeten de ijkgassen door de verdunningsapparatuur gestuurd worden.

      8 Onze Minister kan nadere regels stellen met betrekking tot het monsternemingssysteem, het meetapparaat en de
      calibratie.
    url: https://wetten.overheid.nl/BWBR0004174/1998-03-27#Artikel4
  - number: '5'
    text: |-
      Het resultaat van de in [artikel 4][ref1] voorgeschreven metingen, alsmede de andere gegevens die noodzakelijk
      zijn om te kunnen beoordelen of in overeenstemming met dit besluit wordt gehandeld, worden door de houder van een
      salpeterzuurfabriek gedurende ten minste een jaar ter beschikking gehouden van het bevoegd gezag en de inspecteur
      ten behoeve van het toezicht op de naleving van de betrokken voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0004174#Artikel4
    url: https://wetten.overheid.nl/BWBR0004174/1998-03-27#Artikel5
    references:
