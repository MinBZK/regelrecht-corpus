articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      wet: de [Wet milieubeheer][ref1];

      inrichting: een inrichting die behoort tot een krachtens [artikel 1.1, derde lid][ref2], van de wet aangewezen
      categorie;

      salpeterzuurfabriek: iedere produktie-eenheid, die een inrichting of een onderdeel van een inrichting is, voor
      de bereiding van salpeterzuur met een produktie-capaciteit van de inrichting ten aanzien van salpeterzuur van ten
      minste 5 000 ton per jaar;

      bestaande salpeterzuurfabriek: een salpeterzuurfabriek waarvoor voor de datum van inwerkingtreding van dit besluit
      een vergunning krachtens de wet is verleend of ingevolge [artikel 98, vierde lid][ref3], van de wet geacht wordt
      verleend te zijn;

      afgas: het gas dat in een salpeterzuurfabriek ontstaat als gevolg van de fabricage van salpeterzuur en dat,
      eventueel samen met andere gassen, naar de buitenlucht wordt afgevoerd;

      ppm: volumedelen per miljoen volumedelen;

      bevoegd gezag: het bestuursorgaan dat bevoegd is een vergunning krachtens
      [artikel 8.1 van de Wet milieubeheer][ref4] voor de betrokken inrichting te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
