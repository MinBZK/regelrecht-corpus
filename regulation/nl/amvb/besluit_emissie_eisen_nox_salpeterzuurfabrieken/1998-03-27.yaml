        artikel: '4'
        paragraaf: '3'
  - number: '6'
    text: |-
      1 Het bevoegd gezag kan in besluiten ten aanzien van een vergunning met betrekking tot een salpeterzuurfabriek ter
      zake van de uitworp van NOx slechts afwijken van het [in § 2 bepaalde][ref1], voor zover dat ingevolge het tweede
      of derde lid is toegestaan.

      2 Het bevoegd gezag kan in een vergunning met betrekking tot een bestaande salpeterzuurfabriek een strengere eis
      stellen dan de in [artikel 3, tweede lid][ref2], met betrekking tot de uitworp van NOx gestelde, met dien verstande
      dat de eis niet lager wordt dan 220 ppm.

      3 Het bevoegd gezag kan in een vergunning met betrekking tot een salpeterzuurfabriek een strengere eis stellen
      dan een krachtens [artikel 2][ref3] of [artikel 3, tweede lid][ref4], geldende eis of dan met toepassing van het
      tweede lid mogelijk is, indien de aanvrager of houder van een vergunning bereid en in staat is om aan die strengere
      eis te voldoen en het bevoegd gezag dientengevolge niet tot weigering of intrekking van de vergunning behoeft over
      te gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004174#Paragraaf2
