  - number: '7'
    text: |-
      De aan een vergunning verbonden voorschriften blijven, met betrekking tot onderwerpen waarin dit besluit voorziet,
      van kracht voor zover deze niet in strijd zijn met het bij of krachtens dit besluit bepaalde.
    url: https://wetten.overheid.nl/BWBR0004174/1998-03-27#Artikel7
  - number: '8'
    text: |-
      1 Dit besluit treedt in werking met ingang van de tweede kalendermaand na de datum van uitgifte van het
      *Staatsblad* waarin het wordt geplaatst.

      2 Het kan worden aangehaald als Besluit emissie-eisen NOx salpeterzuurfabrieken.
