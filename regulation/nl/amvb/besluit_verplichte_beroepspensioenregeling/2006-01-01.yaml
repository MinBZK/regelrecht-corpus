  - number: '3'
    text: |-
      1 De afkoopsom, bedoeld in [artikel 40, vijfde lid, van de wet][ref1], wordt door de pensioenuitvoerder vastgesteld
      door middel van een afkoopvoet.

      2 Er wordt voor een door de pensioenuitvoerder vast te stellen periode voor alle deelnemers en gewezen deelnemers
      dezelfde afkoopvoet vastgesteld.

      3 De afkoopvoet wordt zodanig vastgesteld dat er sprake is van collectieve actuariële gelijkwaardigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel40
    url: https://wetten.overheid.nl/BWBR0019290/2006-01-01#Artikel3
