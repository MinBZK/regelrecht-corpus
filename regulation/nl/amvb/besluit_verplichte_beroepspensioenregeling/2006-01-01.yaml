  - number: '21'
    text: |-
      De beschrijvingen die de actuariële en bedrijfstechnische nota bevat op grond van de
      [artikelen 16 tot en met 20][ref1] zijn zodanig dat De Nederlandsche Bank N.V. op basis van die beschrijvingen
      tot een oordeel kan komen over de wijze waarop voldaan wordt aan de [artikelen 32][ref2], [59][ref3] en
      [60 van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0019290#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel59
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel60
    url: https://wetten.overheid.nl/BWBR0019290/2006-01-01#Artikel21
