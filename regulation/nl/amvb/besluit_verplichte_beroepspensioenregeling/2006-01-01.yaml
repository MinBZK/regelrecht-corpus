  - number: '2'
    text: |-
      1 Per geboden keuzemogelijkheid als bedoeld in [artikel 37][ref1] of [38 van de wet][ref2], wordt door de
      pensioenuitvoerder voor een door hem te bepalen periode voor alle deelnemers en gewezen deelnemers dezelfde
      ruilvoet of opbouwkeuzevoet vastgesteld.

      2 De ruilvoet en opbouwkeuzevoet worden zodanig vastgesteld dat sprake is van collectieve actuariële
      gelijkwaardigheid als bedoeld in de [artikelen 37, derde lid][ref3], en [38, eerste lid, van de wet][ref4].

      3 In afwijking van het eerste lid kan aan een gewezen deelnemer de ruilvoet worden toegekend, die geldt op de dag
      van beëindiging van de deelneming.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel38
