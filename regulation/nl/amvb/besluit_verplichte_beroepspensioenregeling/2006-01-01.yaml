        artikel: '40'
  - number: '4'
    text: |-
      De pensioenuitvoerder informeert de rechthebbende bij beëindiging en bij aanvang van de deelname
      aan de beroepspensioenregeling terstond over zijn recht op waardeoverdracht als bedoeld in
      [artikel 41 van de wet][ref1].******


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel41
    url: https://wetten.overheid.nl/BWBR0019290/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '41'
  - number: '5'
    text: |-
      1 De rechthebbende die overweegt gebruik te maken van zijn recht op waardeoverdracht, verzoekt de overnemende
      pensioenuitvoerder een opgave als bedoeld in [artikel 6][ref1] te verstrekken:

      a. binnen zes maanden na de aanvangsdatum van de deelname aan een beroepspensioenregeling;

      b. binnen zes maanden na de datum van beëindiging van een van de deelnames in geval van gelijktijdige deelneming
      aan meerdere pensioenregelingen als bedoeld in [artikel 1, tweede lid][ref2].

      2 De rechthebbende kan voor het einde van de termijn genoemd in [artikel 9, eerste lid][ref3], verzoeken om een
      aanvullende opgave voor het geval de waarde van het nabestaandenpensioen niet wordt overgedragen. De termijnen
      genoemd in de [artikelen 6, eerste lid][ref4], [7][ref5], [8][ref6] en [9, eerste lid][ref7], zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019290#Artikel6
