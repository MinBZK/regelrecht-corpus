  - number: '25'
    text: |-
      De Nederlandsche Bank N.V. kan een beroepspensioenfonds ontheffing verlenen van de verplichting om bepaalde staten
      of gedeelten daarvan in te dienen. [Artikel 23, tweede lid, tweede en derde zin][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019290#Artikel23
    url: https://wetten.overheid.nl/BWBR0019290/2006-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0019290
        artikel: '23'
        paragraaf: '6'
  - number: '26'
    text: |-
      Ieder beroepspensioenfonds dat voor eigen rekening en risico belegt, dient binnen zes weken na afloop van ieder
      kwartaal bij De Nederlandsche Bank N.V. gegevens in omtrent zijn beleggingen.
    url: https://wetten.overheid.nl/BWBR0019290/2006-01-01#Artikel26
  - number: '27'
    text: |-
      Onze Minister en de Sociaal Economische Raad kunnen kosteloos uit de door De Nederlandsche Bank N.V. op grond
      van [artikel 70, eerste lid, van de wet][ref1] verzamelde gegevens beschikken over gegevens uit de statuten en
      reglementen van beroepspensioenfondsen, alsmede over gegevens uit beslissingen die op grond van de statuten en
      reglementen worden genomen, die geen vertrouwelijk karakter hebben en die niet zijn persoongegevens als bedoeld in
      [artikel 1 van de Wet bescherming persoonsgegevens][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0019290/2006-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '70'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '1'
  - number: '31'
    text: Dit besluit treedt in werking met ingang van 1 januari 2006.
    url: https://wetten.overheid.nl/BWBR0019290/2006-01-01#Artikel31
  - number: '32'
    text: 'Dit besluit wordt aangehaald als: Besluit verplichte beroepspensioenregeling.'
    url: https://wetten.overheid.nl/BWBR0019290/2006-01-01#Artikel32
