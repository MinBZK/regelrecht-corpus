preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 14 oktober 2005, nr. AV/PB/05/80703;

    Gelet op de artikelen 37, vijfde lid, 38, tweede lid, 40, zesde lid, 41, vierde lid, 62, 63, vijfde lid en 70,
    derde lid, van de Wet verplichte beroepspensioenregeling;

    De Raad van State gehoord (advies van 21 november 2005, no. W.12.05.0465/IV);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid van 9 december 2005, nr. AV/
    PB/2005/95808;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0019290/2006-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. wet: [Wet verplichte beroepspensioenregeling][ref1];

      b. ruilvoet: verhouding tussen het in te ruilen pensioen en het daarvoor in te kopen pensioen;

      c. opbouwkeuzevoet: verhouding tussen het pensioen waarvan kan worden afgezien en het pensioen dat daarvoor in de
      plaats kan worden opgebouwd;

      d. afkoopvoet: verhouding tussen het af te kopen pensioen en de daarvoor in de plaats uit te keren afkoopsom;

      e. afkoopsom: afkoopsom van de aanspraken op pensioen zoals berekend op grond van [artikel 12][ref2];

      f. waardeoverdracht: overdracht van de afkoopsom ter verwerving van met de waarde van die afkoopsom overeenkomende
      aanspraken in de regeling van de overnemende pensioenuitvoerder;

      g. rechthebbende: degene die in aanmerking komt voor waardeoverdracht op grond van artikel 41 van de wet;

      h. reguliere beroepspensioenregeling: beroepspensioenregeling waarbij de pensioenaanspraken in de zin van de
      [artikelen 29][ref3] en [30 van de wet][ref4] worden uitgedrukt in euro pensioen dan wel in euro pensioenkapitaal;

      i. niet-reguliere beroepspensioenregeling: beroepspensioenregeling waarbij de pensioenaanspraken in de zin van de
      [artikelen 29][ref5] en [30 van de wet][ref6] worden uitgedrukt in beleggingseenheden;

      j. overdrachtsdatum: aanvangsdatum van de deelname aan de pensioenregeling van de overnemende pensioenuitvoerder;

      k. staten: de jaarlijks door ieder beroepspensioenfonds bij De Nederlandsche Bank N.V. in te dienen gegevens met de
      daarbij behorende omslag.

      2 Indien een rechthebbende gelijktijdig aan meerdere pensioenregelingen deelneemt en de deelneming aan één van deze
      regelingen is geëindigd, en vervolgens waardeoverdracht plaatsvindt van de pensioenregeling waaraan de deelneming
      is geëindigd naar een van de andere regelingen, is de overdrachtsdatum, in afwijking van het eerste lid, onderdeel
      j, de datum waarop de deelneming aan de pensioenregeling is geëindigd.


