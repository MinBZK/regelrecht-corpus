        artikel: '60'
  - number: '22'
    text: |-
      1 Ieder beroepspensioenfonds vult de staten in. De daartoe vereiste gegevens worden naar waarheid verstrekt en
      door het bestuur ondertekend. Bestaat het bestuur uit meer dan twee personen, dan worden de staten door twee
      bestuursleden ondertekend.

      2 Staten die niet van toepassing zijn op een beroepspensioenfonds behoeven niet te worden ingediend. Bij verschil
      van mening hierover beslist De Nederlandsche Bank N.V.

      3 De staten worden ingevuld volgens het model opgenomen in [bijlage A bij het Besluit staten pensioenfondsen][ref1].
      Er worden geen andere posten of rubrieken toegevoegd.

      4 Op de omslag wordt de statutaire naam van het beroepspensioenfonds ingevuld.

      5 De Nederlandsche Bank N.V. kan met betrekking tot het invullen van de staten beleidsregels vaststellen die worden
      gepubliceerd in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0009874
    url: https://wetten.overheid.nl/BWBR0019290/2006-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009874
  - number: '23'
    text: |-
      1 De indiening van de staten over een kalenderjaar vindt vóór 1 juli van het daarop volgende kalenderjaar plaats.

      2 De Nederlandsche Bank N.V. kan in bijzondere gevallen ontheffing verlenen van de verplichting om de staten vóór
      de datum, genoemd in het eerste lid, in te dienen, onder gelijktijdige vermelding van een latere datum waarvoor de
      indiening plaatsvindt. Een ontheffing kan onder beperkingen worden verleend en daaraan kunnen voorschriften worden
      verbonden. De ontheffing kan worden gewijzigd en ingetrokken.

      3 Een aanvraag voor ontheffing wordt vóór 1 mei van het betreffende kalenderjaar bij De Nederlandsche Bank N.V.
      ingediend.
    url: https://wetten.overheid.nl/BWBR0019290/2006-01-01#Artikel23
  - number: '24'
    text: |-
      1 De staten worden in enkelvoud ingediend bij De Nederlandsche Bank N.V. Indien bij het invullen van de staten
      gebruik wordt gemaakt van de in het tweede lid bedoelde informatiedragers of informatiemedia, worden deze
      meegezonden.

      2 Indien de staten worden ingevuld met gebruikmaking van elektronische informatiedragers of informatiemedia, wordt
      voor de samenstelling en aanlevering van de daarop aanwezige gegevens gebruik gemaakt van de door De Nederlandsche
      Bank N.V. voor dat doel ter beschikking gestelde programmatuur, overeenkomstig de daarbij gegeven instructies
      omtrent de volledigheid van de in te dienen gegevens en de uit te voeren consistentiecontrole.

      3 Staat 3.400 (Actuarieel verslag), zoals opgenomen in [bijlage A van het Besluit staten pensioenfondsen][ref1],
      wordt voorzien van een verklaring van een actuaris tegen wie De Nederlandsche Bank N.V. geen bedenkingen naar voren
      heeft gebracht. Met deze verklaring bevestigt de actuaris dat hij zich ervan heeft overtuigd dat:

      a. de technische voorzieningen met inachtneming van de op de staat 3.400, zoals opgenomen in
      [bijlage A van het Besluit staten pensioenfondsen][ref2], voorkomende gegevens als geheel op voldoende voorzichtige
      grondslagen zijn berekend;

      b. voldaan is aan [artikel 59 van de wet][ref3]; en

      c. de sterftevergelijking juist is weergegeven, waarvan hij als bewijs de staten 3.410 en 3.530, zoals opgenomen in
      [bijlage A van het Besluit staten pensioenfondsen][ref4], waarmerkt.

      De actuaris kan zijn verklaring nader toelichten of op onderdelen een voorbehoud maken.

      4 Een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref5] waarmerkt de
      staten en voorziet deze van een accountantsverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0009874
      [ref2]: https://wetten.overheid.nl/BWBR0009874
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel59
      [ref4]: https://wetten.overheid.nl/BWBR0009874
      [ref5]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0019290/2006-01-01#Artikel24
