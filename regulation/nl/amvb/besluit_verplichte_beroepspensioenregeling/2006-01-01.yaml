  - number: '6'
    text: |-
      1 De overnemende pensioenuitvoerder vraagt binnen één maand na ontvangst van het verzoek, bedoeld in
      [artikel 5, eerste lid][ref1], aan de overdragende pensioenuitvoerder een opgave per de overdrachtsdatum van de
      afkoopsom en de daaraan ten grondslag liggende gegevens, waaronder:

      a. de nominale pensioenaanspraken waarop de afkoopsom is gebaseerd;

      b. de wijze waarop deze aanspraken in de pensioenregeling, ondergebracht bij de overdragende pensioenuitvoerder,
      worden aangepast;

      c. geslacht, geboortedatum en pensioendatum;

      d. alle overige informatie die van belang is voor de uitvoering van [artikel 41 van de wet][ref2].

      2 Indien de overdragende pensioenuitvoerder een niet-reguliere pensioenregeling uitvoert, geldt de opgave als een
      voorlopige opgave en is het eerste lid, onderdelen a en b, niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019290#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel41
    url: https://wetten.overheid.nl/BWBR0019290/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019290
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '41'
  - number: '7'
    text: |-
      De overdragende pensioenuitvoerder verstrekt de opgave of de voorlopige opgave, bedoeld in [artikel 6][ref1],
      binnen twee maanden na ontvangst van het daartoe strekkende verzoek aan de overnemende pensioenuitvoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0019290#Artikel6
    url: https://wetten.overheid.nl/BWBR0019290/2006-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019290
        artikel: '6'
        paragraaf: '3'
  - number: '8'
    text: |-
      De overnemende pensioenuitvoerder verstrekt de opgave of voorlopige opgave, bedoeld in [artikel 6][ref1], binnen
      twee maanden na ontvangst aan de rechthebbende onder vermelding van de aanspraken die zullen voortvloeien uit de
      waardeoverdracht en de wijze waarop de aanspraken in de beroepspensioenregeling, ondergebracht bij de overnemende
      pensioenuitvoerder, zullen worden behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0019290#Artikel6
    url: https://wetten.overheid.nl/BWBR0019290/2006-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019290
        artikel: '6'
        paragraaf: '3'
  - number: '9'
    text: |-
      1 Indien de rechthebbende gebruik wil maken van zijn recht op waardeoverdracht, dient hij binnen twee maanden
      na ontvangst van de opgave of voorlopige opgave, bedoeld in [artikel 6][ref1], en, indien van toepassing,
      [artikel 5, tweede lid][ref2], een verzoek tot waardeoverdracht in bij de overnemende pensioenuitvoerder.

      2 Indien de rechthebbende gehuwd is, moet de echtgenoot verklaren in te stemmen met het verzoek tot
      waardeoverdracht met betrekking tot het nabestaandenpensioen.

      3 Indien de echtgenoot niet instemt met het verzoek tot waardeoverdracht met betrekking tot het
      nabestaandenpensioen, is [artikel 45 van de wet][ref3] hierop van overeenkomstige toepassing


      [ref1]: https://wetten.overheid.nl/BWBR0019290#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0019290#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel45
    url: https://wetten.overheid.nl/BWBR0019290/2006-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0019290
        artikel: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0019290
        artikel: '5'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '45'
  - number: '10'
    text: |-
      1 De overnemende pensioenuitvoerder stelt de overdragende pensioenuitvoerder terstond in kennis van de ontvangst
      van het verzoek tot waardeoverdracht.

      2 Het risico dat betrekking heeft op de over te dragen aanspraken, komt met ingang van de datum van het verzoek van
      de rechthebbende, bedoeld in [artikel 9, eerste lid][ref1], voor rekening van de overnemende pensioenuitvoerder.

      3 De afkoopsom wordt binnen tien werkdagen na ontvangst van het verzoek tot waardeoverdracht door de overdragende
      pensioenuitvoerder aan de overnemende pensioenuitvoerder betaald.

      4 De overdragende pensioenuitvoerder is rente verschuldigd aan de overnemende pensioenuitvoerder over de
      afkoopsom over de periode tussen de overdrachtsdatum en de datum waarop de afkoopsom wordt betaald, tenzij het de
      waardeoverdracht van een niet-reguliere regeling naar een andere niet-reguliere regeling betreft. Bij overdracht
      van een niet-reguliere naar een reguliere regeling wordt de rente geacht in de afkoopsom begrepen te zijn. Onze
      Minister stelt regels over de berekening van de rente.


      [ref1]: https://wetten.overheid.nl/BWBR0019290#Artikel9
    url: https://wetten.overheid.nl/BWBR0019290/2006-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0019290
        artikel: '9'
        paragraaf: '3'
  - number: '11'
    text: |-
      Overschrijding van de in deze paragraaf gestelde termijnen door de overdragende of overnemende pensioenuitvoerder
      wordt de rechthebbende niet tegengeworpen**.**
    url: https://wetten.overheid.nl/BWBR0019290/2006-01-01#Artikel11
  - number: '12'
    text: |-
      1 Voor pensioenaanspraken die voortvloeien uit een reguliere beroepspensioenregeling is de afkoopsom gelijk aan de
      contante waarde van de over te dragen nominale aanspraken op de overdrachtsdatum en wordt deze afkoopsom berekend
      op basis van het standaardtarief. Onze Minister stelt regels inzake het standaardtarief.

      2 Indien de afkoopsom niet op basis van het standaardtarief berekend kan worden, worden de aanspraken met behoud
      van de actuariële gelijkwaardigheid eerst omgezet in pensioenaanspraken waarop het standaardtarief wel toegepast
      kan worden.

      3 Bij de berekening van de afkoopsom blijven buiten beschouwing:

      a. toekomstige voorwaardelijke aanpassingen van de aanspraken;

      b. nabestaandenpensioen dat is verzekerd op risicobasis, wezenpensioen en invaliditeitspensioen; en

      c. aanspraken op nabestaandenpensioen die achterblijven bij de overdragende pensioenuitvoerder.

      4 Indien de pensioenaanspraken voortvloeien uit een niet-reguliere beroepspensioenregeling, is de afkoopsom gelijk
      aan de waarde van de beleggingseenheden op de datum waarop de beleggingen contant worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0019290/2006-01-01#Artikel12
  - number: '13'
    text: |-
      Indien de afkoopsom niet gelijk is aan de waarde van het gefinancierde deel van de aanspraken, komt het verschil
      ten gunste, respectievelijk ten laste, van de overdragende pensioenuitvoerder.
    url: https://wetten.overheid.nl/BWBR0019290/2006-01-01#Artikel13
  - number: '14'
    text: |-
      1 De door de overdragende pensioenuitvoerder opgegeven afkoopsom wordt aangewend voor ouderdomspensioen,
      nabestaandenpensioen en overige pensioenvormen op basis van de beroepspensioenregeling, ondergebracht bij de
      overnemende pensioenuitvoerder.

      2 Onze Minister stelt regels inzake de berekening van pensioenaanspraken op grond van de afkoopsom in de
      pensioenregeling van de overnemende pensioenuitvoerder, voor de situatie waarin waardeoverdracht naar een reguliere
      beroepspensioenregeling plaatsvindt.

      3 In geval van waardeoverdracht naar een niet-reguliere beroepspensioenregeling wordt de afkoopsom binnen een week
      aangewend voor beleggingseenheden.
    url: https://wetten.overheid.nl/BWBR0019290/2006-01-01#Artikel14
  - number: '15'
    text: |-
      1 De na waardeoverdracht verkregen aanspraken worden in de beroepspensioenregeling, ondergebracht bij de
      overnemende pensioenuitvoerder, behandeld alsof zij in de regeling zelf zijn opgebouwd.

      2 Indien in de beroepspensioenregeling, ondergebracht bij de overnemende pensioenuitvoerder, pensioenopbouw
      plaatsvindt op basis van dienstjaren, wordt de afkoopsom omgezet in voor de pensioenopbouw meetellende dienstjaren.

      3 In een beroepspensioenregeling die voor de pensioenopbouw rekent met een maximaal te bereiken aantal dienstjaren,
      geldt dat, indien toepassing van het tweede lid leidt tot meer dan het maximale aantal dienstjaren, het meerdere
      wordt behandeld als een bij ontslag verkregen pensioenaanspraak in die regeling.
    url: https://wetten.overheid.nl/BWBR0019290/2006-01-01#Artikel15
  - number: '16'
    text: |-
      De actuariële en bedrijfstechnische nota, bedoeld in [artikel 61, eerste lid, van de wet][ref1] bevat in ieder
      geval een beschrijving van:

      a. de hoofdlijnen van het interne beheersingssysteem en van de opzet van de administratieve organisatie en interne
      controle;

      b. voorzover van toepassing procedures en criteria voor het deelnemerschap;

      c. de aanspraken die voor de deelnemers, gewezen deelnemers of hun nabestaanden voortvloeien uit de
      beroepspensioenregeling;

      d. de uit de aangegane verplichtingen voortspruitende risico’s die in eigen beheer zijn gehouden dan wel zijn
      herverzekerd of overgedragen;

      e. de financiële opzet; en

      f. de financiële sturingsmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel61
    url: https://wetten.overheid.nl/BWBR0019290/2006-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '61'
  - number: '17'
    text: |-
      De beschrijving van de financiële opzet, bedoeld in [artikel 16, onderdeel e][ref1], bevat in ieder geval een
      beschrijving van:

      a. de reservering;

      b. het premiebeleid;

      c. het beleggingsbeleid; en

      d. de wijze waarop bij de reservering, het premiebeleid en het beleggingsbeleid rekening is gehouden met eventuele
      voorwaardelijke indexering.


      [ref1]: https://wetten.overheid.nl/BWBR0019290#Artikel16
    url: https://wetten.overheid.nl/BWBR0019290/2006-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0019290
        artikel: '16'
        paragraaf: '5'
  - number: '18'
    text: |-
      De beschrijving van de financiële sturingsmiddelen, bedoeld in [artikel 16, onderdeel f][ref1], bevat in ieder
      geval een beschrijving van de sturingsmogelijkheden van het beroepspensioenfonds ten aanzien van het premiebeleid,
      het beleggingsbeleid alsmede van het beleid met betrekking tot de aanpassingen van de aanspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0019290#Artikel16
    url: https://wetten.overheid.nl/BWBR0019290/2006-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0019290
        artikel: '16'
        paragraaf: '5'
  - number: '19'
    text: |-
      De beschrijving van het beleggingsbeleid, bedoeld in [artikel 17, onderdeel c][ref1], bevat in ieder geval een
      beschrijving van:

      a. het strategisch beleggingsbeleid, waarin opgenomen een beschrijving van de beleggingsdoelstelling, de
      samenstelling van de beoogde beleggingsportefeuille alsmede de mate waarin van de beoogde beleggingsportefeuille
      mag worden afgeweken;

      b. de beoogde omvang van het weerstandsvermogen gegeven het beleggingsbeleid;

      c. de opzet van de uitvoering van de vermogensbeheersactiviteiten;

      d. de wijze van risicometing en –beheersing, met name van marktrisico’s en kredietrisico’s;

      e. de opzet van de resultaatsevaluatie met betrekking tot de onderwerpen genoemd in de onderdelen a, b, c en d; en

      f. de waarderingsgrondslag van de beleggingen op de balans.


      [ref1]: https://wetten.overheid.nl/BWBR0019290#Artikel17
    url: https://wetten.overheid.nl/BWBR0019290/2006-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0019290
        artikel: '17'
        paragraaf: '5'
  - number: '20'
    text: |-
      Voorzover risico’s zijn overgedragen of herverzekerd overeenkomstig [artikel 57 van de wet][ref1] kan de
      beschrijving, bedoeld in de [artikelen 17][ref2], [18][ref3] en [19][ref4], beperkt blijven tot een verwijzing naar
      wat daarover in de betreffende overeenkomsten is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0019290#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0019290#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0019290#Artikel19
    url: https://wetten.overheid.nl/BWBR0019290/2006-01-01#Artikel20
