preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Ministers van Landbouw en Visserij a.i. en van Economische Zaken van 21 augustus 1973
    (Directie Juridische en Bedrijfsorganisatorische Zaken, no. J 1509), gehoord het Bosschap en de Algemene Vereniging
    Inlands Hout;

    Overwegende, dat regelen moeten worden gesteld ter uitvoering van de Richtlijn nr. 68/89/EEG, van de Raad van de
    Europese Gemeenschappen van 23 januari 1968 betreffende de aanpassing van de wetgevingen der lid-staten ten aanzien
    van de indeling van onbewerkt hout (Pb. E.G. 1968, nr. L 32);

    Gelet op de artikelen 2 en 3 van de Landbouwkwaliteitswet (Stb. 1971, 371);

    De Raad van State gehoord (advies van 12 september 1973, nr. 22);

    Gezien het nader rapport van Onze voornoemde Ministers van 14 september 1973 (Directie Juridische en
    Bedrijfsorganisatorische Zaken, no. J 1687);

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002902/1998-03-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      "onbewerkt hout": geveld, getopt en uitgesnoeid hout, ook wanneer het geschild, gekort of gekloofd is;

      "verhandelen": te koop aanbieden, verkopen of afleveren;

      "Richtlijn": de [Richtlijn nr. 68/89/EEG](31968L0089), van de Raad der Europese Gemeenschappen van 23 januari 1968,
      betreffende de aanpassing van de wetgevingen der lid-staten ten aanzien van de indeling van onbewerkt hout (*Pb.
      E.G.* 1968, nr. L 32), zoals die luidt of zal komen te luiden.
    url: https://wetten.overheid.nl/BWBR0002902/1998-03-20#Artikel1
  - number: '2'
    text: |-
      1 Het is verboden voor onbewerkt hout, bij het verhandelen ervan, de aanduiding "volgens EEG-normen ingedeeld",
      of de daarmee overeenkomende, in een der andere officiële talen der Europese Unie gestelde aanduiding te bezigen,
      indien dat hout niet:

      a. voorzien is van de voor de betrokken houtsoort gebruikelijke aanduiding, in een der officiële talen der Europese
      Unie gesteld;

      b. naar afmeting en kwaliteit is ingedeeld overeenkomstig de voorschriften van de bijlage van de Richtlijn, zoals
      nader omschreven in het tweede lid, en

      c. voor zover het langhout betreft van de kwaliteitsklasse A/EEG of C/EEG, als bedoeld in punt 2.3.2. van die
      bijlage, tevens onuitwisbaar gemerkt is met de aanduiding van die klasse, in een der officiële talen der Europese
      Unie gesteld.

      2 Aan de voorschriften van de indeling van onbewerkt hout naar afmeting en kwaliteit, bedoeld in het eerste lid,
      onder *b*, is voldaan, indien voor het hout aanduidingen van de afmetingsklasse en van de kwaliteitsklasse als in
      de punten 2.2.2.-2.2.6. en 2.3.2. van de bijlage van de Richtlijn omschreven dan wel daarmee overeenkomende, in een
      der andere officiële talen der Europese Unie gestelde aanduidingen zijn gebezigd, een en ander indien de betrokken
      aanduiding in overeenstemming is met de categorie van afmeting, onderscheidenlijk kwaliteit waartoe het hout,
      volgens de indelingsnormen in die bijlage omschreven, behoort.

      3 Het is verboden voor onbewerkt hout, bij het verhandelen ervan, een van de in het tweede lid bedoelde
      klasseaanduidingen van afmeting of kwaliteit te bezigen, indien ten aanzien van dat hout niet tevens:

      a. aan de andere in het eerste lid, onder *b*, bedoelde voorschriften voor de indeling en, in die gevallen waarin
      het in dat lid, onder *c*, gestelde toepassing vindt, mede aan het vereiste van merking van hout voldaan is en

      b. de voor de betrokken houtsoort gebruikelijke aanduiding in een der officiële talen der Europese Unie gesteld,
      is gebezigd.

      4 Met de in het tweede lid bedoelde aanduidingen wordt gelijkgesteld iedere andere aanduiding die bij het publiek
      redelijkerwijs de indruk wekt te gelden voor onbewerkt hout, dat overeenkomstig de voorschriften van de bijlage van
      de Richtlijn ingedeeld of ingedeeld en gemerkt is.
    url: https://wetten.overheid.nl/BWBR0002902/1998-03-20#Artikel2
  - number: '3'
    text: |-
      1 Bij het meten of wegen van onbewerkt hout dat daarna wordt verhandeld als hout dat overeenkomstig de
      voorschriften van de bijlage van de Richtlijn is ingedeeld dan wel, in die gevallen, waarin tevens punt 2.3.2. van
      die bijlage toepassing vindt, als hout dat is ingedeeld en gemerkt, dienen de ter zake geldende voorschriften van
      die bijlage in acht te worden genomen.

      2 Voor het meten of wegen dan wel voor het aanduiden van het volume of de massa van onbewerkt hout, als in het
      eerste lid bedoeld, mag van geen andere meeteenheid worden gebruik gemaakt dan de kubieke meter, onderscheidenlijk
      het kilogram.

      3 Het is verboden bij het meten, wegen of indelen van onbewerkt hout dat daarna wordt verhandeld als hout, in het
      eerste lid bedoeld, gebruik te maken van andere maten, gewichten, meet- en weegwerktuigen dan die, welke de in de
      [IJkwet][ref1] 1937 (*Stb.* 627) bedoelde keuring of herkeuring hebben ondergaan en daarbij zijn goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0009082
    url: https://wetten.overheid.nl/BWBR0002902/1998-03-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009082
  - number: '4'
    text: |-
      1 Onze Minister kan nadere regelen stellen met het oog op een juiste uitvoering van de Richtlijn. Indien zodanige
      regelen betrekking hebben op het bepaalde in [artikel 3, tweede of derde lid][ref1], worden zij niet vastgesteld
      dan in overeenstemming met Onze Minister van Economische Zaken.

      2 Onze Minister kan van het bij of krachtens dit besluit bepaalde vrijstelling en, op aanvrage,
      ontheffing verlenen. Indien de vrijstelling of de ontheffing betrekking heeft op het bij of krachtens
      [artikel 3, tweede of derde lid][ref2], bepaalde wordt zij niet verleend dan in overeenstemming met Onze Minister
      van Economische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0002902#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002902#Artikel3
