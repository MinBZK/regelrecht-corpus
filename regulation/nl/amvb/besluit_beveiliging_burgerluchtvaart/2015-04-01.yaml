---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_beveiliging_burgerluchtvaart
regulatory_layer: AMVB
publication_date: '2020-12-14'
valid_from: '2015-04-01'
bwb_id: BWBR0014397
url: https://wetten.overheid.nl/BWBR0014397/2015-04-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Justitie van 28 juni 2001, nr. 5105759/01/6;

    Gelet op de artikelen 37ac, eerste lid, en 37e, tweede lid, onder d, van de Luchtvaartwet;

    De Raad van State gehoord (advies van 3 augustus 2001, No. W03.01.0298/I);

    Gezien het nader rapport van Onze Minister van Justitie van 3 december 2002, nr. 5115795/01/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel1
  - number: 1.a
    text: |-
      beveiligingsmedewerker: een lid van het beveiligingspersoneel als bedoeld in
      [artikel 37a, eerste lid, onderdeel b, onder 1° van de Luchtvaartwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37a
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37a
  - number: 1.b
    text: |-
      fouillering: onderzoek aan kleding als bedoeld in [artikel 37b, zesde lid][ref1], en
      [artikel 37h van de Luchtvaartwet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37b
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel37h
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37b
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 37h
  - number: 1.c
    text: |-
      air marshals: ambtenaren van de Koninklijke marechaussee die in het kader van de
      uitoefening van de taak ten behoeve van de beveiliging van de burgerluchtvaart, bedoeld in
      [artikel 4, eerste lid, onder c, van de Politiewet 2012][ref1], aan boord van een luchtvaartuig worden ingezet;


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel4
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '4'
  - number: 1.d
    text: 'Onze Minister: Onze Minister van Veiligheid en Justitie.'
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel1
  - number: '2'
    text: |-
      De exploitant van een luchtvaartterrein zorgt dat de beveiligingsmedewerker zijn taak uitvoert met inachtneming van
      de [paragrafen 2 tot en met 4 van dit besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014397#Paragraaf1
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014397
        paragraaf: '1'
  - number: '3'
    text: |-
      Het plan met betrekking tot de beveiliging, bedoeld in [artikel 37e van de Luchtvaartwet][ref1], bevat een opgave
      van de wijze waarop de exploitant van een luchtvaartterrein uitvoering geeft aan [artikel 2][ref2]. De opgave bevat
      daartoe in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37e
      [ref2]: https://wetten.overheid.nl/BWBR0014397#Artikel2
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37e
      - id: ref2
        bwb_id: BWBR0014397
        artikel: '2'
        paragraaf: '1'
  - number: 3.a
    text: de wijze waarop de exploitant voorziet in controle op de taakuitoefening door de beveiligingsmedewerkers,
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel3
  - number: 3.b
    text: |-
      de maatregelen die de exploitant jegens de beveiligingsorganisatie treft bij taakuitoefening in strijd met dit
      besluit en
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel3
  - number: 3.c
    text: |-
      een weergave van de contractuele bepalingen die ter uitvoering van [artikel 2][ref1] gelden of zullen gelden tussen
      de exploitant en de beveiligingsorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0014397#Artikel2
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014397
        artikel: '2'
        paragraaf: '1'
  - number: '4'
    text: |-
      Het plan met betrekking tot de beveiliging, bedoeld in [artikel 37e van de Luchtvaartwet][ref1], bevat:


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37e
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37e
  - number: 4.a
    text: |-
      een opgave van het vereiste opleidingsniveau van de beveiligingsmedewerkers en van de wijze waarop voorzien wordt
      in behoud van kennis en vaardigheden en
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel4
  - number: 4.b
    text: |-
      een opgave van de wijze waarop voorzien wordt in voldoende beveiligingsbewustzijn bij medewerkers van andere op het
      luchtvaartterrein werkzame bedrijven en instellingen.
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel4
  - number: '5.1'
    text: |-
      De beveiligingsmedewerker controleert de passagiers met inachtneming van de in het maatschappelijk verkeer algemeen
      aanvaarde omgangsvormen.
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel5
  - number: '5.2'
    text: |-
      De beveiligingsmedewerker controleert de handbagage zo voorzichtig en zorgvuldig als mogelijk is met het oog op
      doeltreffende controle.
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel5
  - number: '5.3'
    text: |-
      De beveiligingsmedewerker voert ter uitvoering van de controle uitsluitend handelingen uit die voor doeltreffende
      controle redelijkerwijs noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel5
  - number: '5.4'
    text: |-
      De beveiligingsmedewerker voert de controle zodanig uit dat passagiers niet meer worden belast dan voor
      doeltreffende controle noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel5
  - number: '6.1'
    text: |-
      Fouillering geschiedt door het aftasten van de kleding of het onderzoeken van afzonderlijke kledingstukken voor
      zover dat noodzakelijk is voor doeltreffende controle.
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel6
  - number: '6.2'
    text: |-
      Fouillering wordt uitgevoerd door één of meer beveiligingsmedewerkers van hetzelfde geslacht als de passagier,
      tenzij de passagier uitdrukkelijk heeft ingestemd met fouillering door een beveiligingsmedewerker van het andere
      geslacht.
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel6
  - number: '6.3'
    text: |-
      Fouillering vindt plaats in een afgezonderde ruimte indien de passagier of de betrokken beveiligingsmedewerker de
      voorkeur daarvoor kenbaar heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel6
  - number: '6.4'
    text: |-
      Fouillering vindt plaats in het bijzijn van een tweede beveiligingsmedewerker indien de passagier of de betrokken
      beveiligingsmedewerker de voorkeur daarvoor kenbaar heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel6
  - number: '6.5'
    text: |-
      Indien fouillering niet goed mogelijk blijkt of onvoldoende is om de aanwezigheid van voor bedreiging geschikte
      voorwerpen vast te stellen, wordt daarvan onverwijld mededeling gedaan aan de Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel6
  - number: '7.1'
    text: Nader onderzoek van handbagage geschiedt door handmatig onderzoek en zintuiglijke waarneming.
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel7
  - number: '7.2'
    text: |-
      De beveiligingsmedewerker voert het nader onderzoek van de handbagage uit in aanwezigheid van de betrokken
      passagier.
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel7
  - number: '7.3'
    text: |-
      De beveiligingsmedewerker opent bagage, pakt bagage uit en haalt of laat zaken uit de verpakking voor zover dit
      noodzakelijk is voor doeltreffende controle.
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel7
  - number: '7.4'
    text: |-
      De beveiligingsmedewerker beproeft of de werkelijke functie van de bagage of van zaken daaruit overeenkomt met
      de functie die de uiterlijke verschijningsvorm doet vermoeden voor zover dit noodzakelijk is voor doeltreffende
      controle.
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel7
  - number: '7.5'
    text: |-
      Het nader onderzoek vindt plaats in een afgezonderde ruimte indien de passagier of de betrokken
      beveiligingsmedewerker de voorkeur daarvoor kenbaar heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel7
  - number: '8'
    text: |-
      De beveiligingsmedewerker verschaft een passagier op diens verzoek informatie met betrekking tot de controle,
      tenzij het belang van doeltreffende controle zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel8
  - number: '9.1'
    text: |-
      Een beveiligingsmedewerker doet onverwijld mededeling aan de Koninklijke marechaussee van een onregelmatigheid bij
      de uitvoering van de controle.
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel9
  - number: '9.2'
    text: 'Van een onregelmatigheid is in ieder geval sprake indien:'
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel9
  - number: 9.2.a
    text: een passagier weigert zichzelf of zijn bagage aan controle te onderwerpen,
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel9
  - number: 9.2.b
    text: de veiligheid van personen of goederen wordt bedreigd,
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel9
  - number: 9.2.c
    text: verstoring van de openbare orde dreigt,
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel9
  - number: 9.2.d
    text: |-
      middelen als bedoeld in [artikel 2][ref1] of [3 van de Opiumwet][ref2] worden aangetroffen of


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '3'
  - number: 9.2.e
    text: |-
      er aanwijzingen zijn dat door een te controleren of gecontroleerde passagier een strafbaar feit is, wordt of zal
      worden gepleegd.
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel9
  - number: '10.1'
    text: |-
      Indien de controle een bevraging als bedoeld in [artikel 37h, eerste lid, onder d][ref1] omvat, bevraagt de
      beveiligingsmedewerker passagiers met inachtneming van de in het maatschappelijk verkeer algemeen aanvaarde
      omgangsvormen.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37h
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37h
  - number: '10.2'
    text: |-
      De beveiligingsmedewerker beperkt de bevraging tot onderwerpen die kunnen dienen tot het opleveren van aanwijzingen
      met betrekking tot de betrouwbaarheid van de passagier.
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel10
  - number: '11'
    text: 'Paragraaf 2 is van overeenkomstige toepassing op:'
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel11
  - number: 11.a
    text: |-
      controle van personen en voorwerpen als bedoeld in [artikel 37b, zesde lid, van de Luchtvaartwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37b
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37b
  - number: 11.b
    text: |-
      verdergaande controle als bedoeld in [artikel 37hd van de Luchtvaartwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37hd
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37hd
  - number: 11.c
    text: |-
      controle van de identiteit van personen en de rechtmatigheid van hun aanwezigheid op het luchtvaartterrein als
      bedoeld in [artikel 37f, tweede lid, onder b][ref1], en [37h, derde lid, van de Luchtvaartwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37f
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel37h
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37f
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 37h
  - number: 11a.1
    text: |-
      Personen die werkzaam zijn op een luchtvaartterrein en die toegang hebben tot de om beveiligingsredenen beperkt
      toegankelijke zones van de in [artikel 37b, eerste lid, onder b en c, van de Luchtvaartwet][ref1] bedoelde delen
      van dat luchtvaartterrein, beschikken over een door een exploitant van een luchtvaartterrein verstrekt of erkend
      toegangsbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37b
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37b
  - number: 11a.2
    text: |-
      Alvorens het toegangsbewijs als bedoeld in het eerste lid, wordt verstrekt, wordt een
      achtergrondonderzoek ingesteld. Ten aanzien van de personen bedoeld in het eerste lid,
      betreft dit onderzoek de afgifte van een verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1], die is gekoppeld aan continue controle
      op nieuwe gegevens in de justitiële documentatie van de houder van de verklaring. Ten aanzien van personen die een
      functie vervullen of willen vervullen die is aangewezen als vertrouwensfunctie, betreft dit onderzoek de afgifte
      van een verklaring als bedoeld in [artikel 1, onder b, van de Wet veiligheidsonderzoeken][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0008277#Artikel1
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0008277
        artikel: '1'
  - number: 11a.3
    text: |-
      De exploitant van een luchtvaartterrein registreert de voor- en achternaam van de persoon aan wie een
      toegangsbewijs als bedoeld in het eerste lid, wordt verstrekt, alsmede andere identificerende gegevens die
      noodzakelijk zijn voor de uitvoering van de continue controle, bedoeld in het tweede lid. Met het oog op de
      toepassing van het vierde lid verstrekt de exploitant deze gegevens periodiek aan Onze Minister van Veiligheid
      en Justitie.
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel11a
  - number: 11a.4
    text: |-
      Indien de exploitant van een luchtvaartterrein vermoedt dat degene die bij de aanvraag van het toegangsbewijs een
      verklaring omtrent het gedrag, als bedoeld in het tweede lid, heeft overgelegd, niet meer voldoet aan de eisen voor
      de afgifte daarvan, verlangt de exploitant dat die persoon binnen een door de exploitant vast te stellen termijn
      opnieuw verzoekt om afgifte van een verklaring omtrent het gedrag. Het toegangsbewijs van de desbetreffende persoon
      wordt door de exploitant onmiddellijk geblokkeerd.
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel11a
  - number: 11a.5
    text: |-
      Het toegangsbewijs van de persoon bedoeld in het vierde lid die niet binnen een redelijke termijn een verklaring
      omtrent het gedrag overlegt, wordt ingenomen.
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel11a
  - number: '12.1'
    text: |-
      [Artikel 5, tweede en derde lid][ref1] en de [artikelen 7 tot en met 9][ref2] zijn van overeenkomstige toepassing
      op de controle van ruimbagage.


      [ref1]: https://wetten.overheid.nl/BWBR0014397#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0014397#Artikel7
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0014397
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0014397
        artikel: '7'
        paragraaf: '2'
  - number: '12.2'
    text: |-
      In afwijking van het eerste lid is [artikel 7, tweede lid][ref1], niet van toepassing indien de passagier zich voor
      zover redelijkerwijs valt na te gaan kennelijk niet op het luchtvaartterrein bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0014397#Artikel7
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0014397
        artikel: '7'
        paragraaf: '2'
  - number: '13.1'
    text: |-
      Voorafgaand aan het nader onderzoek naar de inhoud van ruimbagage, bedoeld in
      [artikel 37h, tweede lid, onder b, van de Luchtvaartwet][ref1] vraagt de beveiligingsmedewerker de passagier te
      bevestigen dat de desbetreffende ruimbagage hem toebehoort en verzoekt hem deze zelf te openen.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37h
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37h
  - number: '13.2'
    text: |-
      Het eerste lid is niet van toepassing indien de passagier zich voor zover redelijkerwijs valt na te gaan kennelijk
      niet op het luchtvaartterrein bevindt.
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel13
  - number: '14.1'
    text: |-
      De luchtvaartmaatschappij of de geregistreerde, bedoeld in [artikel 37p van de Luchtvaartwet][ref1], doet
      onverwijld mededeling aan de Koninklijke marechaussee van een onregelmatigheid bij de uitvoering van de controle
      van vracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37p
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37p
  - number: '14.2'
    text: |-
      Indien de vracht zich bij controle niet bevindt op een terrein waar de Koninklijke marechaussee is belast met de
      uitvoering van de politietaak, wordt in afwijking van het eerste lid van een onregelmatigheid onverwijld mededeling
      gedaan aan de politie.
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel14
  - number: '14.3'
    text: 'Van een onregelmatigheid is slechts sprake indien:'
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel14
  - number: 14.3.a
    text: |-
      gevaarlijke goederen in of bij de vracht worden aangetroffen die niet als zodanig zijn aangeboden in
      overeenstemming met [artikel 37k, vierde lid, van de Luchtvaartwet][ref1], of een krachtens dat artikel
      vastgestelde regeling of aanwijzing; of


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37k
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37k
  - number: 14.3.b
    text: |-
      blijkt dat de vracht de veiligheid van de burgerluchtvaart kan bedreigen als deze wordt vervoerd zoals kennelijk
      wordt beoogd.
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel14
  - number: 14a.1
    text: |-
      De aanwijzing, bedoeld in [artikel 37ada, eerste lid, van de Luchtvaartwet][ref1] omvat het vluchtnummer, de
      bestemming en het tijdstip van vertrek.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37ada
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37ada
  - number: 14a.2
    text: |-
      Naast de gegevens, bedoeld in het eerste lid, kan de aanwijzing een aanduiding omvatten van de stoelen in het
      luchtvaartuig die bestemd zijn voor de air marshals.
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel14a
  - number: 14a.3
    text: De luchtvaartmaatschappij wordt binnen een redelijke termijn schriftelijk in kennis gesteld van de aanwijzing.
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel14a
  - number: 14a.4
    text: Onze Minister kan de aanwijzing te allen tijde intrekken.
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel14a
  - number: 14b.1
    text: |-
      De luchtvaartmaatschappij die in het kader van de toepassing van [artikel 37ada van de Luchtvaartwet][ref1] de
      beschikking krijgt over gegevens of inlichtingen waarvan zij het vertrouwelijke karakter kent of redelijkerwijs
      moet vermoeden, draagt ervoor zorg dat die gegevens en inlichtingen zijn beveiligd tegen kennisneming door
      onbevoegden.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37ada
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37ada
  - number: 14b.2
    text: Onze Minister kan nadere regels stellen ten aanzien van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel14b
  - number: 14c
    text: |-
      Voor aanvang van de vlucht informeert de Koninklijke marechaussee de luchtvaartmaatschappij nader over de inzet van
      air marshals.
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel14c
  - number: 14d.1
    text: |-
      Ten aanzien van het vervoer van air marshals ingevolge [artikel 37ada van de Luchtvaartwet][ref1] gelden tussen
      Onze Minister en de luchtvaartmaatschappij de voor het vervoer rechtens geldende dan wel gebruikelijke tarieven en
      voorwaarden. Bij gebreke van zowel rechtens geldende als gebruikelijke tarieven en voorwaarden, gelden de door Onze
      Minister vastgestelde tarieven en voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37ada
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel14d
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37ada
  - number: 14d.2
    text: Onze Minister kan regels stellen ter aanvulling van de rechtens geldende of gebruikelijke tarieven en voorwaarden.
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel14d
  - number: '15'
    text: Dit besluit treedt in werking op 1 april 2003.
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel15
  - number: '16'
    text: 'Dit besluit wordt aangehaald als: Besluit beveiliging burgerluchtvaart.'
    url: https://wetten.overheid.nl/BWBR0014397/2015-04-01#Artikel16
