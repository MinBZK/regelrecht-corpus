  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Justitie van 28 juni 2001, nr. 5105759/01/6;

    Gelet op de artikelen 37ac, eerste lid, en 37e, tweede lid, onder d, van de Luchtvaartwet;

    De Raad van State gehoord (advies van 3 augustus 2001, No. W03.01.0298/I);

    Gezien het nader rapport van Onze Minister van Justitie van 3 december 2002, nr. 5115795/01/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *achtergrondcontrole:* de controle,
      bedoeld in [artikel 37rf van de wet][ref1];
        - *air marshals:* ambtenaren van de Koninklijke marechaussee die in het kader van de
      uitoefening van de taak ten behoeve van de beveiliging van de burgerluchtvaart, bedoeld in
      [artikel 4, eerste lid, onder c, van de Politiewet 2012][ref2], aan boord van een luchtvaartuig worden ingezet;
        - *beveiligingsmedewerker:* een lid van het beveiligingspersoneel als bedoeld in
      [artikel 37a, tweede lid, onderdeel h, onder 1° van de wet][ref3];
        - *beveiligingsopleiding:* de opleiding, bedoeld in punt 11.1 en 11.2 van bijlage I bij EG-[verordening 300/2008]
      (32008R0300);
        - *certificerings- of goedkeuringsdossier:* het dossier, bedoeld in punt 11.3.5 van de bijlage bij EU-[verordening
      2015/1998](31998R2015);
        - *eindtermen:* de vaardigheden en bekwaamheden waarin een beveiligingsopleiding op grond van EG-[verordening
      300/2008](32008R0300) dient te resulteren;
        - *fouillering:* onderzoek aan kleding als bedoeld in [artikel 37b, vijfde lid][ref4], en
      [artikel 37h van de wet][ref5];
        - *indienstnamegegevens:* de gegevens, bedoeld in punt 11.1.8 van de bijlage bij EU-[verordening 2015/1998]
      (31998R2015);Onze Minister: Onze Minister van Justitie en Veiligheid;
        - *opleidingsinstelling:* een opleidingsinstelling als bedoeld in
      [artikel 37a, tweede lid, onderdeel r, van de wet][ref6], die in Nederland is gevestigd of in Nederland
      beveiligingsopleidingen aanbiedt;
        - *opleidingsprogramma:* het opleidingsprogramma, bedoeld in [artikel 37rc van de wet][ref7];
        - *röntgen- en EDS-apparatuur:* de apparatuur, bedoeld in punt 12.3 en 12.4 van de bijlage bij EU-[verordening
      2015/1998](31998R2015);
        - *wet:* de [Luchtvaartwet][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37rf
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel4
