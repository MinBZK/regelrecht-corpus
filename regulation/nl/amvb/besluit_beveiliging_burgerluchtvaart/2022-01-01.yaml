  - number: '2'
    text: |-
      De exploitant van een luchtvaartterrein zorgt dat de beveiligingsmedewerker zijn taak uitvoert met inachtneming van
      de [paragrafen 2 tot en met 4 van dit besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014397#Paragraaf1
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014397
        paragraaf: '1'
  - number: 2a
    text: |-
      De instemming, bedoeld in [artikel 37acb, eerste lid, van de wet][ref1], geldt voor een periode van twaalf maanden,
      gerekend vanaf de dag volgend op de dag waarop de instemming is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37acb
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37acb
  - number: 2b
    text: |-
      De verklaring, bedoeld in [artikel 37rf, eerste lid, van de wet][ref1] geldt voor een periode van drie jaar,
      gerekend vanaf de dag volgend op de dag waarop de verklaring is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37rf
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37rf
  - number: '5.1'
    text: |-
      De beveiligingsmedewerker controleert de passagiers met inachtneming van de in het maatschappelijk verkeer algemeen
      aanvaarde omgangsvormen.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel5
  - number: '5.2'
    text: |-
      De beveiligingsmedewerker controleert de handbagage zo voorzichtig en zorgvuldig als mogelijk is met het oog op
      doeltreffende controle.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel5
  - number: '5.3'
    text: |-
      De beveiligingsmedewerker voert ter uitvoering van het beveiligingsonderzoek uitsluitend handelingen uit die voor
      doeltreffende controle redelijkerwijs noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel5
  - number: '5.4'
    text: |-
      De beveiligingsmedewerker voert het beveiligingsonderzoek zodanig uit dat passagiers niet meer worden belast dan
      voor doeltreffende controle noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel5
  - number: '6.1'
    text: |-
      Fouillering geschiedt door het aftasten van de kleding of het onderzoeken van afzonderlijke kledingstukken voor
      zover dat noodzakelijk is voor doeltreffende controle.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel6
  - number: '6.2'
    text: |-
      Fouillering wordt uitgevoerd door één of meer beveiligingsmedewerkers van hetzelfde geslacht als de passagier,
      tenzij de passagier uitdrukkelijk heeft ingestemd met fouillering door een beveiligingsmedewerker van het andere
      geslacht.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel6
  - number: '6.3'
    text: |-
      Fouillering vindt plaats in een afgezonderde ruimte indien de passagier of de betrokken beveiligingsmedewerker de
      voorkeur daarvoor kenbaar heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel6
  - number: '6.4'
    text: |-
      Fouillering vindt plaats in het bijzijn van een tweede beveiligingsmedewerker indien de passagier of de betrokken
      beveiligingsmedewerker de voorkeur daarvoor kenbaar heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel6
  - number: '6.5'
    text: |-
      Indien fouillering niet goed mogelijk blijkt of onvoldoende is om de aanwezigheid van verboden voorwerpen vast te
      stellen, wordt daarvan onverwijld mededeling gedaan aan de Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel6
  - number: '7.1'
    text: Nader onderzoek van handbagage geschiedt door handmatig onderzoek en zintuiglijke waarneming.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel7
  - number: '7.2'
    text: |-
      De beveiligingsmedewerker voert het nader onderzoek van de handbagage uit in aanwezigheid van de betrokken
      passagier.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel7
  - number: '7.3'
    text: |-
      De beveiligingsmedewerker opent bagage, pakt bagage uit en haalt of laat zaken uit de verpakking voor zover dit
      noodzakelijk is voor doeltreffende controle.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel7
  - number: '7.4'
    text: |-
      De beveiligingsmedewerker beproeft of de werkelijke functie van de bagage of van zaken daaruit overeenkomt met
      de functie die de uiterlijke verschijningsvorm doet vermoeden voor zover dit noodzakelijk is voor doeltreffende
      controle.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel7
  - number: '7.5'
    text: |-
      Het nader onderzoek vindt plaats in een afgezonderde ruimte indien de passagier of de betrokken
      beveiligingsmedewerker de voorkeur daarvoor kenbaar heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel7
  - number: '8'
    text: |-
      De beveiligingsmedewerker verschaft een passagier op diens verzoek informatie met betrekking tot het
      beveiligingsonderzoek, tenzij het belang van doeltreffende controle zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel8
  - number: '9.1'
    text: |-
      Een beveiligingsmedewerker doet onverwijld mededeling aan de Koninklijke marechaussee van een onregelmatigheid bij
      de uitvoering van het beveiligingsonderzoek.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel9
  - number: '9.2'
    text: 'Van een onregelmatigheid is in ieder geval sprake indien:'
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel9
  - number: 9.2.a
    text: een passagier weigert zichzelf of zijn bagage aan controle te onderwerpen,
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel9
  - number: 9.2.b
    text: de veiligheid van personen of goederen wordt bedreigd,
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel9
  - number: 9.2.c
    text: verstoring van de openbare orde dreigt,
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel9
  - number: 9.2.d
    text: |-
      middelen als bedoeld in [artikel 2][ref1] of [3 van de Opiumwet][ref2] worden aangetroffen of


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '3'
  - number: 9.2.e
    text: |-
      er aanwijzingen zijn dat door een te controleren of gecontroleerde passagier een strafbaar feit is, wordt of zal
      worden gepleegd.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel9
  - number: '10.1'
    text: |-
      Indien het beveiligingsonderzoek een bevraging als bedoeld in [artikel 37h, eerste lid, onder d][ref1] omvat,
      bevraagt de beveiligingsmedewerker passagiers met inachtneming van de in het maatschappelijk verkeer algemeen
      aanvaarde omgangsvormen.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37h
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37h
  - number: '10.2'
    text: |-
      De beveiligingsmedewerker beperkt de bevraging tot onderwerpen die kunnen dienen tot het opleveren van aanwijzingen
      met betrekking tot de betrouwbaarheid van de passagier.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel10
  - number: '11'
    text: |-
      [Paragraaf 2][ref1] is van overeenkomstige toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0014397#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0014397
        paragraaf: '2'
  - number: 11.a
    text: |-
      controle van personen en voorwerpen als bedoeld in [artikel 37b, vijfde lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37b
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37b
  - number: 11.b
    text: |-
      verdergaande controle als bedoeld in [artikel 37hd van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37hd
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37hd
  - number: 11.c
    text: |-
      controle van de identiteit van personen en de rechtmatigheid van hun aanwezigheid op het luchtvaartterrein als
      bedoeld in [artikel 37f, tweede lid][ref1], en [37h, derde lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37f
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel37h
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37f
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 37h
  - number: 11b.1
    text: |-
      De erkenning als erkend leverancier van vluchtbenodigdheden, genoemd in
      [artikel 37o, eerste lid, onderdeel c, van de wet][ref1], geldt voor een periode van vijf jaar, gerekend vanaf de
      dag volgend op de dag waarop de erkenning is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37o
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37o
  - number: 11b.2
    text: De erkenning kan onder voorwaarden of beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel11b
  - number: '12.1'
    text: |-
      [Artikel 5, tweede en derde lid][ref1] en de [artikelen 7 tot en met 9][ref2] zijn van overeenkomstige toepassing
      op het beveiligingsonderzoek van ruimbagage.


      [ref1]: https://wetten.overheid.nl/BWBR0014397#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0014397#Artikel7
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0014397
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0014397
        artikel: '7'
        paragraaf: '2'
  - number: '12.2'
    text: |-
      In afwijking van het eerste lid is [artikel 7, tweede lid][ref1], niet van toepassing indien de passagier zich voor
      zover redelijkerwijs valt na te gaan kennelijk niet op het luchtvaartterrein bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0014397#Artikel7
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0014397
        artikel: '7'
        paragraaf: '2'
  - number: '13.1'
    text: |-
      Voorafgaand aan het nader onderzoek naar de inhoud van ruimbagage, bedoeld in
      [artikel 37h, tweede lid, onder b, van de wet][ref1] vraagt de beveiligingsmedewerker de passagier te bevestigen
      dat de desbetreffende ruimbagage hem toebehoort en verzoekt hem deze zelf te openen.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37h
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37h
  - number: '13.2'
    text: |-
      Het eerste lid is niet van toepassing indien de passagier zich voor zover redelijkerwijs valt na te gaan kennelijk
      niet op het luchtvaartterrein bevindt.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel13
  - number: 13a.1
    text: |-
      De erkend agent, bekende afzender en vaste afzender doen onverwijld mededeling aan de commandant van de Koninklijke
      marechaussee van een onregelmatigheid bij de uitvoering van de beveiligingscontrole of het beveiligingsonderzoek
      van vracht of post.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel13a
  - number: 13a.2
    text: |-
      Indien de vracht of post zich bij de beveiligingscontrole of het beveiligingsonderzoek niet bevindt op een terrein
      waar de Koninklijke marechaussee is belast met de uitvoering van de politietaak, wordt in afwijking van het eerste
      lid van een onregelmatigheid onverwijld mededeling gedaan aan de politie.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel13a
  - number: 13a.3
    text: 'Van een onregelmatigheid is slechts sprake indien:'
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel13a
  - number: 13a.3.a
    text: |-
      verboden voorwerpen in of bij de vracht of post worden aangetroffen die niet overeenkomstig door Onze Minister vast
      te stellen regels of te geven aanwijzingen zijn verpakt, of
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel13a
  - number: 13a.3.b
    text: |-
      blijkt dat de vracht of post de veiligheid van de burgerluchtvaart kan bedreigen als deze wordt vervoerd zoals
      kennelijk wordt beoogd.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel13a
  - number: 13b.1
    text: |-
      De erkenning als erkend agent, genoemd in [artikel 37o, eerste lid, onderdeel a, van de wet][ref1], geldt voor een
      periode van vijf jaar, gerekend vanaf de dag volgend op de dag waarop de erkenning is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37o
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37o
  - number: 13b.2
    text: |-
      De erkenning als bekende afzender, genoemd in [artikel 37o, eerste lid, onderdeel b, van de wet][ref1], geldt voor
      een periode van vijf jaar, gerekend vanaf de dag volgend op de dag waarop de erkenning is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37o
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37o
  - number: 13c
    text: |-
      De erkenning als ACC3-luchtvaartmaatschappij, genoemd in [artikel 37o, tweede lid, van de wet][ref1], geldt voor
      een periode van vijf jaar, gerekend vanaf de dag volgend op de dag waarop de erkenning is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37o
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel13c
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37o
  - number: 13d.1
    text: |-
      De erkenning als erkend agent derde land (RA3), als bedoeld in
      [artikel 37o, eerste lid, onderdeel e, van de wet][ref1], geldt voor een periode van drie jaar, gerekend vanaf de
      dag volgend op de dag waarop de erkenning is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37o
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel13d
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37o
  - number: 13d.2
    text: |-
      De erkenning als bekende afzender derde land (KC3), als bedoeld in
      [artikel 37o, eerste lid, onderdeel e, van de wet][ref1], geldt voor een periode van drie jaar, gerekend vanaf de
      dag volgend op de dag waarop de erkenning is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37o
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel13d
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37o
  - number: 13e
    text: |-
      De erkenning als EU-luchtvaartbeveiligingsvalidateur, genoemd in
      [artikel 37o, eerste lid, onderdeel d, van de wet][ref1], geldt voor een periode van vijf jaar, gerekend vanaf de
      dag volgend op de dag waarop de erkenning is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37o
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel13e
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37o
  - number: 13f
    text: |-
      De erkenningen, genoemd in de [artikelen 13b tot en met 13e][ref1], kunnen onder voorwaarden of beperkingen worden
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0014397#Artikel13b
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel13f
    references:
      - id: ref1
        bwb_id: BWBR0014397
        artikel: 13b
        paragraaf: '5'
  - number: 14a.1
    text: |-
      De aanwijzing, bedoeld in [artikel 37ada, eerste lid, van de wet][ref1] omvat het vluchtnummer, de bestemming en
      het tijdstip van vertrek.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37ada
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37ada
  - number: 14a.2
    text: |-
      Naast de gegevens, bedoeld in het eerste lid, kan de aanwijzing een aanduiding omvatten van de stoelen in het
      luchtvaartuig die bestemd zijn voor de air marshals.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel14a
  - number: 14a.3
    text: De luchtvaartmaatschappij wordt binnen een redelijke termijn schriftelijk in kennis gesteld van de aanwijzing.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel14a
  - number: 14a.4
    text: Onze Minister kan de aanwijzing te allen tijde intrekken.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel14a
  - number: 14b.1
    text: |-
      De luchtvaartmaatschappij die in het kader van de toepassing van [artikel 37ada van de wet][ref1] de beschikking
      krijgt over gegevens of inlichtingen waarvan zij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden,
      draagt ervoor zorg dat die gegevens en inlichtingen zijn beveiligd tegen kennisneming door onbevoegden.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37ada
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37ada
  - number: 14b.2
    text: Onze Minister kan nadere regels stellen ten aanzien van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel14b
  - number: 14c
    text: |-
      Voor aanvang van de vlucht informeert de Koninklijke marechaussee de luchtvaartmaatschappij nader over de inzet van
      air marshals.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel14c
  - number: 14d.1
    text: |-
      Ten aanzien van het vervoer van air marshals ingevolge [artikel 37ada van de wet][ref1] gelden tussen Onze Minister
      en de luchtvaartmaatschappij de voor het vervoer rechtens geldende dan wel gebruikelijke tarieven en voorwaarden.
      Bij gebreke van zowel rechtens geldende als gebruikelijke tarieven en voorwaarden, gelden de door Onze Minister
      vastgestelde tarieven en voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37ada
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel14d
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37ada
  - number: 14d.2
    text: Onze Minister kan regels stellen ter aanvulling van de rechtens geldende of gebruikelijke tarieven en voorwaarden.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel14d
  - number: '15.1'
    text: |-
      Het opleidingsprogramma van een opleidingsinstelling is zodanig opgesteld dat op redelijke gronden mag
      worden verwacht dat een cursist na het met goed gevolg doorlopen van dit programma aan de eindtermen van de
      beveiligingsopleiding voldoet.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel15
  - number: '15.2'
    text: 'Het opleidingsprogramma bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel15
  - number: 15.2.a
    text: de naam van de beveiligingsopleiding;
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel15
  - number: 15.2.b
    text: de eindtermen van de beveiligingsopleiding;
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel15
  - number: 15.2.c
    text: een inhoudelijke uitwerking van de eindtermen van de beveiligingsopleiding per lesonderdeel;
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel15
  - number: 15.2.d
    text: de geschatte tijdsduur van de beveiligingsopleiding;
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel15
  - number: 15.2.e
    text: |-
      een examenreglement met een beschrijving van de voorgestelde toetsing en examinering van selectie, kennis en
      vaardigheden, alsmede eventuele schriftelijke toetsen en antwoorden;
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel15
  - number: 15.2.f
    text: de gehanteerde didactische methoden of opleidingsvormen;
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel15
  - number: 15.2.g
    text: een beschrijving van de beoogde doelgroepen voor de beveiligingsopleiding;
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel15
  - number: 15.2.h
    text: |-
      een voorbeeld van het certificaat of diploma dat de cursist bij het met goed gevolg afronden van de
      beveiligingsopleiding zal worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel15
  - number: '15.3'
    text: |-
      Bij regeling van Onze Minister kunnen, met het oog op de goede uitvoering van EG-[verordening 300/2008]
      (32008R0300), nadere regels worden gesteld omtrent de inhoud van het opleidingsprogramma.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel15
  - number: '16.1'
    text: |-
      De opleidingsinstelling biedt, al dan niet in samenwerking met een andere opleidingsinstelling die beschikt over
      een door Onze Minister overeenkomstig [artikel 37rc van de wet][ref1] goedgekeurd opleidingsprogramma, ten minste
      eens in het halfjaar een beveiligingsopleiding aan.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37rc
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37rc
  - number: '16.2'
    text: |-
      De opleidingsinstelling voert tenminste eens in de vijf jaar een evaluatie uit van de door haar gegeven
      beveiligingsopleidingen en doet de commandant van de Koninklijke marechaussee een schriftelijk verslag van deze
      evaluatie toekomen.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel16
  - number: '17.1'
    text: |-
      De opleidingsinstelling houdt een uitgebreid programma ten aanzien van de interne kwaliteitscontrole van de
      opleidingsinstelling en haar instructeurs in stand.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel17
  - number: '17.2'
    text: |-
      De opleidingsinstelling beschikt over een actuele lijst van overeenkomstig [artikel 22][ref1] erkende instructeurs
      die in dienst van of in opdracht van de opleidingsinstelling beveiligingsopleidingen verzorgen.


      [ref1]: https://wetten.overheid.nl/BWBR0014397#Artikel22
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0014397
        artikel: '22'
        paragraaf: 5b
  - number: '17.3'
    text: |-
      Bij regeling van Onze Minister kunnen eisen worden gesteld aan de interne kwaliteitscontrole van de
      opleidingsinstelling en haar instructeurs.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel17
  - number: '18'
    text: 'De opleidingsinstelling maakt gebruik van een opleidingslocatie en overige onderwijsfaciliteiten die:'
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel18
  - number: 18.a
    text: passend zijn met het oog op de desbetreffende beveiligingsopleiding, en
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel18
  - number: 18.b
    text: de kennisoverdracht op generlei wijze belemmeren, bemoeilijken of anderszins verstoren.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel18
  - number: '19.1'
    text: |-
      Indien een beveiligingsopleiding informatie verschaft die met het oog op de beveiliging van de burgerluchtvaart
      niet publiek toegankelijk is, laat de opleidingsinstelling slechts personen tot deze beveiligingsopleiding toe die
      gerechtigd zijn om van deze informatie kennis te nemen.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel19
  - number: '19.2'
    text: 'Gerechtigd om kennis te nemen van informatie, als bedoeld in het eerste lid, is degene die:'
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel19
  - number: 19.2.a
    text: met goed gevolg een achtergrondcontrole heeft ondergaan, en
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel19
  - number: 19.2.b
    text: |-
      de betreffende beveiligingsopleiding nodig heeft met het oog op het kunnen of kunnen blijven uitvoeren van een
      functie in de beveiliging van de burgerluchtvaart, of een ander legitiem belang heeft bij het volgen van de
      opleiding.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel19
  - number: '19.3'
    text: |-
      De opleidingsinstelling neemt passende maatregelen om te voorkomen dat personen die niet daartoe gerechtigd zijn,
      kennis kunnen nemen van de informatie, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel19
  - number: '20.1'
    text: |-
      De opleidingsinstelling doet onverwijld mededeling aan de commandant van de Koninklijke marechaussee van
      onregelmatigheden bij het uitvoeren van het opleidingsprogramma van een beveiligingsopleiding.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel20
  - number: '20.2'
    text: |-
      Van een onregelmatigheid is slechts sprake indien bij de uitvoering van het opleidingsprogramma van een
      beveiligingsopleiding zich een uitzonderlijke situatie voordoet of heeft voorgedaan, die een potentieel of actueel
      risico voor de beveiliging van de burgerluchtvaart vormt of heeft gevormd, of op het bestaan van een zodanig risico
      duidt.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel20
  - number: '20.3'
    text: 'Van een onregelmatigheid is in ieder geval sprake, indien:'
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel20
  - number: 20.3.a
    text: |-
      informatie die met het oog op de beveiliging van de burgerluchtvaart niet publiek toegankelijk is, bekend is
      gemaakt aan of toegankelijk geworden is voor personen die niet gerechtigd zijn van deze informatie kennis te nemen;
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel20
  - number: 20.3.b
    text: valselijk opgemaakte of vervalste certificaten of diploma’s zijn vervaardigd;
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel20
  - number: 20.3.c
    text: |-
      een cursist, gelet op diens gedragingen of uitingen tijdens de beveiligingsopleiding, mentaal of fysiek kennelijk
      niet in staat kan worden geacht een functie in de beveiliging van de burgerluchtvaart te kunnen vervullen.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel20
  - number: '21.1'
    text: |-
      Een beveiligingsopleiding die op grond van EG-[verordening 300/2008](32008R0300) slechts mag worden verzorgd door
      een gecertificeerde instructeur, wordt gegeven door een persoon die beschikt over een door Onze Minister verleende
      erkenning.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel21
  - number: '21.2'
    text: |-
      Op aanvraag van de betrokkene of van de organisatie waarvoor deze de beveiligingsopleiding zal verzorgen verleent
      Onze Minister de erkenning, indien hij ten aanzien van de betrokkene heeft vastgesteld dat deze overeenkomstig punt
      11.5.1 van de bijlage bij EU-[verordening 2015/1998](31998R2015) minstens:
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel21
  - number: 21.2.a
    text: met goed gevolg een achtergrondcontrole heeft doorstaan;
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel21
  - number: 21.2.b
    text: over vaardigheden op het gebied van instructietechnieken beschikt;
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel21
  - number: 21.2.c
    text: vertrouwd is met de werkomgeving op het relevante terrein van luchtvaartbeveiliging;
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel21
  - number: 21.2.d
    text: over vaardigheden beschikt op het gebied van de te onderwijzen beveiligingselementen.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel21
  - number: '21.3'
    text: |-
      De erkenning geldt voor een periode van vijf jaar, gerekend vanaf de dag volgend op de dag waarop de erkenning
      is verleend.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel21
  - number: '21.4'
    text: |-
      Bij regeling van Onze Minister kunnen, met het oog op de goede uitvoering van EG-[verordening 300/2008]
      (32008R0300), nadere regels worden gesteld over de bekwaamheid en betrouwbaarheid die noodzakelijk is voor het
      geven van beveiligingsopleidingen en de wijze waarop deze bekwaamheid en betrouwbaarheid wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel21
  - number: '22.1'
    text: |-
      Beveiligingstaken die op grond van EG-[verordening 300/2008](32008R0300) slechts mogen worden uitgevoerd door
      gecertificeerd personeel, worden uitgevoerd door personen die beschikken over een door Onze Minister verleende
      erkenning.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel22
  - number: '22.2'
    text: |-
      Op aanvraag van de betrokkene of van de organisatie waarvoor deze beveiligingstaken zal verrichten verleent Onze
      Minister de erkenning, indien hij heeft vastgesteld dat:
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel22
  - number: 22.2.a
    text: de betrokkene met succes de relevante opleiding heeft gevolgd, en
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel22
  - number: 22.2.b
    text: |-
      ook uit de over hem beschikbare en relevante indienstnamegegevens en andere gegevens blijkt dat de betrokkene
      mentaal en fysiek geschikt is voor zijn functie en over de nodige vaardigheden beschikt om de hem toegewezen taken
      op een aanvaardbaar niveau uit te voeren.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel22
  - number: '22.3'
    text: |-
      De erkenning geldt voor de volgende termijn, gerekend vanaf de dag volgend op de dag waarop de erkenning is
      verleend:
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel22
  - number: 22.3.a
    text: drie jaar, voor personeel dat röntgen- of EDS-apparatuur bedient;
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel22
  - number: 22.3.b
    text: vijf jaar, voor het overige personeel.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel22
  - number: '22.4'
    text: |-
      Op aanvraag van de betrokkene of van de organisatie, bedoeld in het tweede lid, verlengt Onze Minister de
      erkenning, indien hij heeft vastgesteld dat:
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel22
  - number: 22.4.a
    text: |-
      de betrokkene met goed gevolg het examen heeft afgelegd van de voor de uitoefening van de hem toegewezen taken
      relevante opleiding, en
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel22
  - number: 22.4.b
    text: |-
      ook uit het over hem aangelegde certificerings- of goedkeuringsdossier blijkt dat de betrokkene mentaal en
      fysiek geschikt is voor zijn functie en over de nodige vaardigheden beschikt om de hem toegewezen taken op een
      aanvaardbaar niveau uit te voeren.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel22
  - number: '22.5'
    text: |-
      Onze Minister weigert de erkenning te verlenen of verlengen, indien ten aanzien van de betrokkene geen geldige
      verklaring als bedoeld in [artikel 37rf, eerste of derde lid, van de wet][ref1] kan worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37rf
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37rf
  - number: '22.6'
    text: |-
      Bij regeling van Onze Minister kunnen, met het oog op de goede uitvoering van EG-[verordening 300/2008]
      (32008R0300), nadere regels worden gesteld omtrent de bekwaamheid die noodzakelijk is voor de uitoefening van de in
      het eerste lid bedoelde beveiligingstaken en de wijze waarop deze bekwaamheid wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel22
  - number: '23'
    text: |-
      Met de erkenning, genoemd in de [artikelen 21, eerste lid][ref1], en [22, eerste lid][ref2], wordt gelijkgesteld
      een afgegeven erkenning als bedoeld in [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0014397#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0014397#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0023066#Artikel5
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0014397
        artikel: '21'
        paragraaf: 5b
      - id: ref2
        bwb_id: BWBR0014397
        artikel: '22'
        paragraaf: 5b
      - id: ref3
        bwb_id: BWBR0023066
        artikel: '5'
  - number: '24'
    text: |-
      Dit besluit berust mede op de [artikelen 37acb, derde lid][ref1], [37o, derde lid][ref2],
      [37rb][ref3], [37rc, eerste lid][ref4], [37rd, tweede en vierde lid][ref5], [37re, derde lid][ref6] en
      [76, eerste lid, onderdeel a, van de wet][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37acb
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel37o
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel37rb
      [ref4]: https://wetten.overheid.nl/BWBR0002267#Artikel37rc
      [ref5]: https://wetten.overheid.nl/BWBR0002267#Artikel37rd
      [ref6]: https://wetten.overheid.nl/BWBR0002267#Artikel37re
      [ref7]: https://wetten.overheid.nl/BWBR0002267#Artikel76
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37acb
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 37o
      - id: ref3
        bwb_id: BWBR0002267
        artikel: 37rb
      - id: ref4
        bwb_id: BWBR0002267
        artikel: 37rc
      - id: ref5
        bwb_id: BWBR0002267
        artikel: 37rd
      - id: ref6
        bwb_id: BWBR0002267
        artikel: 37re
      - id: ref7
        bwb_id: BWBR0002267
        artikel: '76'
  - number: '25'
    text: Dit besluit treedt in werking op 1 april 2003.
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel25
  - number: '26'
    text: 'Dit besluit wordt aangehaald als: Besluit beveiliging burgerluchtvaart.'
    url: https://wetten.overheid.nl/BWBR0014397/2022-01-01#Artikel26
