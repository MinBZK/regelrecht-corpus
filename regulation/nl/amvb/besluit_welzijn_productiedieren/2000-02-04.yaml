preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuurbeheer en Visserij van 1 juli 1999, no. TRCJZ/1999/6785,
    Directie Juridische Zaken;

    Gelet op richtlijn nr. 98/58/EG van de Raad van de Europese Unie van 20 juli 1998 inzake de bescherming van
    voor landbouwdoeleinden gehouden dieren (PbEG L 221) en op de artikelen 35, 38, 45 en 111 van de Gezondheids- en
    welzijnswet voor dieren;

    De Raad van State gehoord (advies van 4 oktober 1999, no. W11.99 0329);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuurbeheer en Visserij van 14 december 1999, no.
    TRCJZ/1999/11 274, Directie Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0010986/2000-02-04#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Voor de toepassing van dit besluit worden als soorten en categorieën van dieren
      als bedoeld in de [artikelen 35, eerste lid][ref1], [38, eerste lid][ref2], en
      [45, eerste lid, van de Gezondheids- en welzijnswet voor dieren][ref3] aangewezen dieren die voor
      landbouwdoeleinden worden gefokt of gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0005662#Artikel45
    url: https://wetten.overheid.nl/BWBR0010986/2000-02-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0005662
        artikel: '38'
      - id: ref3
        bwb_id: BWBR0005662
        artikel: '45'
  - number: '1.2'
    text: Dit besluit is niet van toepassing op vissen, reptielen, amfibieën en ongewervelde dieren.
    url: https://wetten.overheid.nl/BWBR0010986/2000-02-04#Artikel1
  - number: '2.1'
    text: |-
      Het houden van varkens, kalveren en legkippen geschiedt overeenkomstig [artikel 3, derde lid][ref1]. Het houden van
      andere dieren geschiedt overeenkomstig [artikel 3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010986#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010986#Artikel3
    url: https://wetten.overheid.nl/BWBR0010986/2000-02-04#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010986
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0010986
        artikel: '3'
  - number: '2.2'
    text: |-
      Het verzorgen van varkens en kalveren geschiedt overeenkomstig [artikel 4, eerste en vijfde lid][ref1]. Het
      verzorgen van legkippen geschiedt overeenkomstig [artikel 4, eerste lid, onderdeel c][ref2]. Het verzorgen van
      andere dieren geschiedt overeenkomstig [artikel 4][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0010986#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0010986#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0010986#Artikel4
    url: https://wetten.overheid.nl/BWBR0010986/2000-02-04#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010986
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0010986
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0010986
        artikel: '4'
  - number: '2.3'
    text: |-
      Het huisvesten van varkens en kalveren geschiedt overeenkomstig [artikel 5, vierde lid][ref1]. Het huisvesten
      van legkippen geschiedt overeenkomstig [artikel 5, tweede, vierde en zevende lid][ref2], laatste volzin, alsmede
      overeenkomstig het negende lid van dat artikel. Het huisvesten van andere dieren geschiedt overeenkomstig
      [artikel 5][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0010986#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0010986#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0010986#Artikel5
    url: https://wetten.overheid.nl/BWBR0010986/2000-02-04#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010986
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0010986
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0010986
        artikel: '5'
  - number: '3.1'
    text: |-
      De bewegingsvrijheid van het dier wordt niet op zodanige wijze beperkt dat het dier daardoor onnodig lijden of
      letsel wordt toegebracht.
    url: https://wetten.overheid.nl/BWBR0010986/2000-02-04#Artikel3
  - number: '3.2'
    text: |-
      Wanneer een dier permanent of geregeld wordt aangebonden, vastgeketend of geïmmobiliseerd, wordt het voldoende
      ruimte gelaten voor zijn fysiologische en ethologische behoeften.
    url: https://wetten.overheid.nl/BWBR0010986/2000-02-04#Artikel3
  - number: '3.3'
    text: |-
      Een dier wordt, indien het niet in een gebouw wordt gehouden, beschermd tegen slechte weersomstandigheden,
      roofdieren en gezondheidsrisico's.
    url: https://wetten.overheid.nl/BWBR0010986/2000-02-04#Artikel3
  - number: '4.1'
    text: 'Een dier wordt verzorgd door een voldoende aantal personen, dat:'
    url: https://wetten.overheid.nl/BWBR0010986/2000-02-04#Artikel4
  - number: 4.1.a
    text: beschikt over de nodige kennis;
    url: https://wetten.overheid.nl/BWBR0010986/2000-02-04#Artikel4
  - number: 4.1.b
    text: beschikt over de nodige vaardigheden, en
    url: https://wetten.overheid.nl/BWBR0010986/2000-02-04#Artikel4
  - number: 4.1.c
    text: vakbekwaam is.
    url: https://wetten.overheid.nl/BWBR0010986/2000-02-04#Artikel4
  - number: '4.2'
    text: |-
      Een dier dat wordt gehouden in een veehouderijsysteem waar zijn welzijn afhangt van frequente verzorging door de
      mens, wordt ten minste eenmaal per dag gecontroleerd. Een dier dat in een ander systeem wordt gehouden, wordt zo
      vaak gecontroleerd dat lijden wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0010986/2000-02-04#Artikel4
  - number: '4.3'
    text: |-
      Een dier dat ziek of gewond lijkt, wordt onmiddellijk op passende wijze verzorgd. Wanneer die zorg geen verbetering
      in de toestand van het dier brengt, wordt zo spoedig mogelijk een dierenarts geraadpleegd.
    url: https://wetten.overheid.nl/BWBR0010986/2000-02-04#Artikel4
  - number: '4.4'
    text: |-
      Een dier krijgt een toereikende hoeveelheid gezond en voor de soort en de leeftijd geschikt voeder zodat het in
      goede gezondheid blijft en aan zijn voedingsbehoeften wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0010986/2000-02-04#Artikel4
  - number: '4.5'
    text: |-
      Het toegediende voeder en drinken alsmede de wijze van toediening brengen het dier geen onnodig lijden of letsel
      toe.
    url: https://wetten.overheid.nl/BWBR0010986/2000-02-04#Artikel4
  - number: '4.6'
    text: Een dier krijgt voeder met tussenpozen die bij zijn fysiologische behoeften passen.
    url: https://wetten.overheid.nl/BWBR0010986/2000-02-04#Artikel4
  - number: '5.1'
    text: Er is voldoende verlichting voor een grondige controle van het dier op elk willekeurig tijdstip.
    url: https://wetten.overheid.nl/BWBR0010986/2000-02-04#Artikel5
  - number: '5.2'
    text: |-
      Een ziek of gewond dier wordt zo nodig afgezonderd in een passend onderkomen. Het onderkomen bestaat zo nodig uit
      droog strooisel.
    url: https://wetten.overheid.nl/BWBR0010986/2000-02-04#Artikel5
  - number: '5.3'
    text: |-
      Het materiaal dat wordt gebruikt voor de behuizing is niet schadelijk voor het dier en kan grondig gereinigd en
      ontsmet worden.
    url: https://wetten.overheid.nl/BWBR0010986/2000-02-04#Artikel5
  - number: '5.4'
    text: |-
      Behuizing en inrichtingen voor de beschutting van een dier zijn zodanig geconstrueerd en verkeren in een zodanige
      staat van onderhoud dat er geen scherpe randen of uitsteeksels zijn die het dier kunnen verwonden.
    url: https://wetten.overheid.nl/BWBR0010986/2000-02-04#Artikel5
  - number: '5.5'
    text: |-
      De luchtcirculatie, het stofgehalte van de lucht, de temperatuur, de relatieve luchtvochtigheid en de
      gasconcentraties in de omgeving van het dier zijn niet schadelijk voor het dier.
    url: https://wetten.overheid.nl/BWBR0010986/2000-02-04#Artikel5
  - number: '5.6'
    text: |-
      Een in een gebouw gehouden dier wordt niet permanent in het duister of in kunstlicht gehouden. Indien het
      beschikbare natuurlijke licht niet voldoende is voor de ethologische en fysiologische behoeften van het dier, is
      geschikt kunstlicht aanwezig.
    url: https://wetten.overheid.nl/BWBR0010986/2000-02-04#Artikel5
  - number: '5.7'
    text: |-
      Indien de gezondheid en welzijn van een dier afhankelijk is van een kunstmatig ventilatiesysteem, is dat voorzien
      van een passend noodsysteem waarmee voldoende verse lucht kan worden aangevoerd om de gezondheid en het welzijn
      van het dier te waarborgen als het hoofdsysteem uitvalt. Indien het hoofdsysteem uitvalt treedt een alarmsysteem in
      werking. Het alarmsysteem wordt regelmatig getest.
    url: https://wetten.overheid.nl/BWBR0010986/2000-02-04#Artikel5
  - number: '5.8'
    text: |-
      Een dier heeft toegang tot een toereikende hoeveelheid schoon water of kan op een andere wijze aan zijn behoefte
      aan water voldoen.
    url: https://wetten.overheid.nl/BWBR0010986/2000-02-04#Artikel5
  - number: '5.9'
    text: |-
      Een voeder- of drinkinstallatie is zo ontworpen, gebouwd en geplaatst dat het gevaar voor verontreiniging van
      voeder en water, alsmede mogelijke schadelijke gevolgen van rivaliteit tussen de dieren tot een minimum worden
      beperkt.
    url: https://wetten.overheid.nl/BWBR0010986/2000-02-04#Artikel5
  - number: '5.10'
    text: |-
      Automatische of mechanische apparatuur die noodzakelijk is voor de gezondheid en het welzijn van een dier wordt
      ten minste eenmaal per dag gecontroleerd. Defecten worden onmiddellijk hersteld. Indien herstel niet mogelijk is,
      worden de nodige maatregelen getroffen om de gezondheid en het welzijn van het dier veilig te stellen.
    url: https://wetten.overheid.nl/BWBR0010986/2000-02-04#Artikel5
  - number: '6.1'
    text: |-
      Onverminderd het bepaalde bij of krachtens de [Diergeneesmiddelenwet][ref1] wordt door de eigenaar of houder van
      een dier een register bijgehouden van de verstrekte medische zorg en het bij iedere controle geconstateerde aantal
      sterfgevallen. Dit register wordt ten minste drie jaar bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0003818
    url: https://wetten.overheid.nl/BWBR0010986/2000-02-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003818
  - number: '6.2'
    text: |-
      Onverminderd het bepaalde bij of krachtens de [Diergeneesmiddelenwet][ref1] worden geen stoffen aan een dier
      toegediend, behalve stoffen voor therapeutische of profylactische doeleinden, dan wel zoötechnische behandeling
      zoals bedoeld in artikel 1, tweede lid, onderdeel c, van [richtlijn 96/22/EG](31996L0022) van de Raad van 29
      april 1996 betreffende het verbod op gebruik, in de veehouderij, van bepaalde stoffen met hormonale werking en van
      bepaalde stoffen met thyreostatische werking alsmede van ß-agonisten en tot intrekking van de [richtlijnen 81/602/
      EEG](31981L0602), [88/146/EEG](31988L0146) (PbEG L 125), tenzij uit wetenschappelijke studies naar het welzijn
      van dieren of uit de ervaring is gebleken dat de stof niet schadelijk is voor de gezondheid of het welzijn van
      het dier.


      [ref1]: https://wetten.overheid.nl/BWBR0003818
    url: https://wetten.overheid.nl/BWBR0010986/2000-02-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003818
  - number: '7'
    text: |-
      Dit besluit treedt in werking met ingang van een bij koninklijk besluit te bepalen tijdstip. Laatstbedoeld
      besluit wordt niet genomen voordat 30 dagen zijn verstreken nadat het onderhavige besluit is overgelegd aan
      beide kamers der Staten-Generaal, en evenmin indien binnen die termijn door of namens een der kamers of door ten
      minste een vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen wordt gegeven dat de
      inwerkingtreding van dit besluit bij wet wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0010986/2000-02-04#Artikel7
  - number: '8'
    text: 'Dit besluit wordt aangehaald als: Besluit welzijn productiedieren.'
    url: https://wetten.overheid.nl/BWBR0010986/2000-02-04#Artikel8
