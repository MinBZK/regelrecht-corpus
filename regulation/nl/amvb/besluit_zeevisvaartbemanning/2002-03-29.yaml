      gedurende een periode van ten minste drie maanden, en heeft gedurende ten minste drie maanden dienstgedaan in de
      machinekamer.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel41
  - number: '42.1'
    text: |-
      Voor het verkrijgen van het kennisbewijs stuurman zeevisvaart S IV-v is de betrokkene in het
      bezit van het kennisbewijs stuurman-werktuigkundige voor de zeevisvaart SW V en heeft hij met goed
      gevolg examen afgelegd ter verkrijging van de verklaring voor de zeevisvaart S IV-v als bedoeld in
      [artikel 2, onderdeel d, van het Examenreglement zeevisvaart][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003996#Artikel2
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003996
        artikel: '2'
  - number: '42.2'
    text: |-
      Voor het verkrijgen van het kennisbewijs werktuigkundige zeevisvaart W IV-v is de betrokkene in het bezit van
      het kennisbewijs stuurman-werktuigkundige voor de zeevisvaart SW V en heeft hij met goed gevolg examen afgelegd
      ter afsluiting van een opleiding die ten minste voldoet aan de eisen ter verkrijging van de verklaring voor de
      zeevisvaart W IV-v» als bedoeld in [artikel 2, onderdeel e, van het Examenreglement zeevisvaart][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003996#Artikel2
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003996
        artikel: '2'
  - number: '43.1'
    text: |-
      Voor de afgifte van het certificaat radarnavigator heeft de aanvrager met goed gevolg examen afgelegd ter
      afsluiting van een door Onze Minister erkende opleiding en training die voldoet aan: - sectie A-II/3 van de STCW-
      Code, en
        - sectie B-1/12, de paragrafen 18 tot en met 35 van de STCW-Code.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel43
  - number: '43.2'
    text: |-
      Voor de afgifte van het certificaat radarwaarnemer heeft de aanvrager met goed gevolg examen afgelegd ter
      afsluiting van een door Onze Minister erkende opleiding en training die voldoet aan:
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel43
  - number: 43.2.sectie
    text: A-II/3 van de STCW-Code, en
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel43
  - number: 43.2.sectie
    text: B-1/12, de paragrafen 2 tot en met 17 van de STCW-Code.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel43
  - number: '44'
    text: |-
      Voor het verkrijgen van het certificaat basis veiligheidstraining vissersvaartuigen is met goed gevolg een door
      Onze Minister erkende opleiding afgerond die ten minste de volgende onderdelen omvat:
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel44
  - number: '44.1'
    text: persoonlijke overlevingstechnieken inclusief het gebruik van reddingsgordels en overlevingspakken;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel44
  - number: '44.2'
    text: brandbescherming en brandbestrijding;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel44
  - number: '44.3'
    text: noodprocedures;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel44
  - number: '44.4'
    text: de beginselen van eerste hulp bij ongevallen;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel44
  - number: '44.5'
    text: voorkoming van verontreiniging op zee; en
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel44
  - number: '44.6'
    text: voorkoming van ongevallen aan boord.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel44
  - number: '45'
    text: |-
      Voor het verkrijgen van het certificaat sloepsgast is met goed gevolg een door Onze Minister erkende opleiding en
      training afgerond die voldoet aan: - voorschrift VI/2, paragraaf 1, van de bijlage bij het STCW Verdrag, en
        - sectie A-VI/2, paragraaf 1 tot en met 4 van de STCW-Code.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel45
  - number: '46'
    text: |-
      Voor de afgifte van het certificaat brandbestrijding voor gevorderden heeft de aanvrager met goed gevolg een door
      Onze Minister erkende opleiding en training afgerond die voldoet aan: - voorschrift VI/3, van de bijlage bij het
      STCW Verdrag, en
        - sectie A-VI/3 van de STCW-Code.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel46
  - number: '47.1'
    text: |-
      Voor de afgifte van het certificaat scheepsgezondheidszorg B (Beperkt), heeft de aanvrager met goed gevolg een
      door Onze Minister erkende training en opleiding afgerond die voldoet aan [Richtlijn nr. 92/29/EEG](31992L0029) van
      de Raad van de Europese Gemeenschappen van 31 maart 1992 betreffende de minimumvoorschriften inzake veiligheid en
      gezondheid ter bevordering van een betere medische hulpverlening aan boord van schepen (Pb EG L 113; deze opleiding
      omvat in elk geval:
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel47
  - number: 47.1.a
    text: kennis van de beginselen van de fysiologie, van de ziekteverschijnselen en van de therapie;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel47
  - number: 47.1.b
    text: elementaire kennis op het gebied van de preventieve gezondheidszorg, waaronder begrepen de hygiëne;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel47
  - number: 47.1.c
    text: elementaire kennis van profylactische maatregelen;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel47
  - number: 47.1.d
    text: praktische kennis van elementaire medische handelingen;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel47
  - number: 47.1.e
    text: kennis van de wijze van evacuatie van patiënten;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel47
  - number: 47.1.f
    text: kennis van de wijze waarop de middelen voor medische consultatie op afstand moeten worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel47
  - number: '47.2'
    text: |-
      Voor de afgifte van een certificaat scheepsgezondheidszorg O voldoet de aanvrager aan het bepaalde in het eerste
      lid en heeft ter verwerving van praktische kennis van elementaire medische handelingen als bedoeld in het eerste
      lid, onderdeel d, een praktijk stage vervuld op een afdeling voor spoedeisende hulp in een algemeen ziekenhuis
      van een bij regeling van Onze Minister vast te stellen duur, dan wel met goed gevolg een vergelijkbare training
      voltooid die voldoet aan bij regeling van Onze Minister vast te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel47
  - number: '47.3'
    text: |-
      Voor de afgifte van een verlenging van de geldigheidsduur van het certificaat scheepsgezondheidszorg B heeft de
      aanvrager met goed gevolg een door Onze Minister erkende bijscholingscursus gevolgd die tenminste de in het eerste
      lid genoemde onderdelen a tot en met f omvat.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel47
  - number: '47.4'
    text: |-
      Voor de afgifte van een verlenging van de geldigheidsduur van het certificaat scheepsgezondheidszorg O voldoet de
      aanvrager aan het bepaalde in het derde lid en heeft een herhalingsstage vervuld op een afdeling voor spoedeisende
      hulp in een algemeen ziekenhuis van een bij regeling van Onze Minister vast te stellen duur, dan wel met goed
      gevolg een vergelijkbare training voltooid die voldoet aan bij regeling van Onze Minister te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel47
  - number: '48'
    text: 'Voor het verkrijgen van het diploma als scheepskok heeft de aanvrager:'
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel48
  - number: '48.1'
    text: |-
      met goed gevolg een door Onze Minister erkende opleiding en training afgerond die tenminste de volgende aspecten
      bevat:
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel48
  - number: 48.1.a
    text: het bereiden van maaltijden;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel48
  - number: 48.1.b
    text: het bakken van brood;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel48
  - number: 48.1.c
    text: het behandelen van vlees
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel48
  - number: 48.1.d
    text: de kennis van de voedingswaarden van voedingsmiddelen;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel48
  - number: 48.1.e
    text: het opstellen van goed samengestelde en gevarieerde menu's;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel48
  - number: 48.1.f
    text: behandelen en opbergen van levensmiddelen;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel48
  - number: 48.1.g
    text: kennis van hygiëne met betrekking tot de kombuis;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel48
  - number: 48.1.h
    text: kennis van proviand administratie;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel48
  - number: 48.1.i
    text: kennis van buitenlandse maten en gewichten; en
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel48
  - number: '48.2'
    text: |-
      een diensttijd behaald van ten minste 6 maanden in de kombuis van een zeeschip, waar de kok bij diens werkzaamheden
      werd bijgestaan.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel48
  - number: '48.3'
    text: |-
      in afwijking van het eerste en tweede lid kan het Hoofd van de Scheepvaart-inspectie een diploma als scheepskok
      afgeven aan een aanvrager die aantoont dat hij op 1 augustus 1986 als scheepskok voer of als zodanig bij een
      rederij in dienst was en gedurende de daaraan voorafgaande periode een dienstverband van tenminste drie jaren als
      scheepskok heeft gehad met een Nederlandse zeewerkgever, en op die datum 23 jaar of ouder was.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel48
  - number: '49.1'
    text: Bij regeling van Onze Minister wordt het model van de monsterrol vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel49
  - number: '49.2'
    text: |-
      Op de monsterrol worden naast de gegevens, genoemd in [artikel 33 van de wet][ref1], voor ieder bemanningslid
      aangetekend:


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel33
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '33'
  - number: 49.2.a
    text: de plaats en de dag van aanmonstering en de plaats en de dag van afmonstering;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel49
  - number: 49.2.b
    text: de geboortedatum;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel49
  - number: 49.2.c
    text: het nummer van het monsterboekje;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel49
  - number: 49.2.d
    text: de naam en roepletters van het vissersvaartuig
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel49
  - number: '49.3'
    text: Bij regeling van Onze Minister kan worden bepaald dat andere gegevens in de monsterrol worden vermeld.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel49
  - number: '50.1'
    text: |-
      Alvorens een schip voor de eerste maal naar zee vertrekt en vervolgens met tussenpozen van niet meer dan twaalf
      maanden wordt een monsterrol opgemaakt.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel50
  - number: '50.2'
    text: Van elke wijziging in de bemanningssamenstelling wordt een wijziging in de monsterrol opgemaakt.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel50
  - number: '50.3'
    text: |-
      Ter uitvoering van het gestelde in [artikel 34, eerste lid, onderdeel d, van de wet][ref1] zendt de schipper binnen
      een week dan wel in de eerstvolgende haven de opgemaakte monsterrol dan wel de wijzigingen in de monsterrol aan
      de scheepsbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel34
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '34'
  - number: '50.4'
    text: |-
      De scheepsbeheerder houdt aantekening van de datum van ontvangst van ontvangen monsterrollen of ontvangen
      wijzigingen in de monsterrollen.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel50
  - number: '51.1'
    text: |-
      De scheepsbeheerder stelt het hoofd van de Scheepvaartinspectie telkenmale schriftelijk in kennis van het feit dat
      hij een opgemaakte monsterrol dan wel een wijziging in enige monsterrol van de schipper heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel51
  - number: '51.2'
    text: |-
      Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot het, door de scheepsbeheerder,
      in kennis stellen van het hoofd van de Scheepvaartinspectie van opgemaakte monsterrollen en wijzigingen in de
      monsterrol voor het houden van toezicht op:
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel51
  - number: 51.2.a
    text: de naleving van de wettelijke bepalingen inzake de bevoegdheden van de bemanningsleden;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel51
  - number: 51.2.b
    text: de bemanningssamenstelling;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel51
  - number: 51.2.c
    text: de verleende ontheffingen;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel51
  - number: 51.2.d
    text: de toepassing van andere wet- en regelgeving waarbij de samenstelling van de bemanning van belang is.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel51
  - number: '51.3'
    text: |-
      De opgemaakte monsterrollen en de wijzigingen in de monsterrollen worden ten kantore van de scheepsbeheerder in
      Nederland bewaard en ter beschikking gehouden van het hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel51
  - number: '52'
    text: |-
      De scheepsbeheerder bewaart een monsterrol, nadat zij is vervangen of nadat de geldigheidsduur is verstreken,
      gedurende drie jaren na de vervangingsdatum of geldigheidsdatum.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel52
  - number: '53.1'
    text: |-
      Het hoofd van de Scheepvaartinspectie geeft een monsterboekje af aan degene die bij de aanvraag voldoet aan het
      bepaalde in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel53
  - number: '53.2'
    text: 'Voor de afgifte van een monsterboekje komt uitsluitend in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel53
  - number: 53.2.a
    text: |-
      degene die aantoont dat met een scheepsbeheerder of zeewerkgever een arbeidsovereenkomst voor de vaart ter zee is
      aangegaan of zal worden aangegaan dan wel degene die een schriftelijke maatschapsovereenkomst in het kader van de
      zeevisserij heeft aangegaan of zal aangaan;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel53
  - number: 53.2.b
    text: degene die aantoont een opleiding te volgen voor een beroep waarvoor een vaarbevoegdheidsbewijs vereist is;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel53
  - number: 53.2.c
    text: degene die behoort tot een andere, door Onze Minister aan te wijzen categorie personen, of
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel53
  - number: 53.2.d
    text: |-
      degene die het monsterboekje naar het oordeel van het hoofd van de Scheepvaartinspectie ten behoeve van zijn
      beroepsuitoefening nodig heeft.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel53
  - number: '54.1'
    text: 'Bij het verzoek om afgifte van een monsterboekje worden de volgende bescheiden overgelegd:'
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel54
  - number: 54.1.a
    text: een geldig paspoort of ander geldig nationaliteitsbewijs van de houder;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel54
  - number: 54.1.b
    text: |-
      twee identieke, recente, goedgelijkende pasfoto's van de aanvrager, zo mogelijk zonder hoofddeksel, van ongeveer 4
      cm hoogte en 3 cm breedte, zodanig dat de afbeelding voor ongeveer drievierde de ene gelaatshelft en voor ongeveer
      éénvierde de andere weergeeft; de pasfoto's vertonen geen beschadigingen en zijn aan de achterzijde voorzien van de
      naam van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel54
  - number: 54.1.c
    text: |-
      een niet langer dan 6 maanden voor de aanvraag afgegeven, de aanvrager betreffend gewaarmerkt afschrift van de
      benodigde gegevens uit de basisadministratie persoonsgegevens van de gemeente waar de aanvrager is ingeschreven;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel54
  - number: 54.1.d
    text: |-
      de bewijsstukken, waardoor wordt aangetoond dat de aanvrager aan [artikel 53][ref1] voldoet;


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel53
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0012790
        artikel: '53'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 54.1.e
    text: |-
      zo nodig aanvullende informatie, die nodig is om de gegevens, bedoeld in [artikel 55, eerste lid][ref1], in het
      monsterboekje te kunnen opnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel55
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0012790
        artikel: '55'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '54.2'
    text: |-
      De aanvraag wordt niet in behandeling genomen dan nadat de kosten voor de afgifte van het monsterboekje zijn
      voldaan.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel54
  - number: '54.3'
    text: |-
      In plaats van de in het eerste lid, onderdeel a, genoemde documenten kunnen daarvan kopieën worden overgelegd, die
      door de ambtenaar van de afdeling bevolking van de gemeente waar de aanvrager is ingeschreven zijn gewaarmerkt of
      door een andere door het hoofd van de Scheepvaartinspectie geaccepteerde autoriteit.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel54
  - number: '54.4'
    text: |-
      In plaats van het in het eerste lid, onderdeel c, genoemde afschrift kan, indien de aanvrager zijn hoofdverblijf
      niet in Nederland heeft, worden volstaan met documenten die in het land van herkomst gebruikelijk zijn.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel54
  - number: '54.5'
    text: Het hoofd van de Scheepvaartinspectie bepaalt de wijze van afgifte van het monsterboekje.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel54
  - number: '55.1'
    text: |-
      Alvorens het monsterboekje af te geven tekent het hoofd van de Scheepvaartinspectie in elk geval de volgende
      gegevens erin aan:
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel55
  - number: 55.1.a
    text: 'van de houder:'
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel55
  - number: 55.1.a.1°
    text: naam en voornamen;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel55
  - number: 55.1.a.2°
    text: plaats en datum van geboorte;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel55
  - number: 55.1.a.3°
    text: nationaliteit, en
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel55
  - number: 55.1.a.4°
    text: het waladres of het adres in noodgevallen;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel55
  - number: 55.1.b
    text: de plaats en datum van afgifte;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel55
  - number: 55.1.c
    text: de datum, waarop de geldigheid vervalt.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel55
  - number: '55.2'
    text: 'Voorts bevat het monsterboekje:'
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel55
  - number: 55.2.a
    text: |-
      een pasfoto als bedoeld in [artikel 54, eerste lid, onderdeel b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel54
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0012790
        artikel: '54'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 55.2.b
    text: de handtekening van de houder.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel55
  - number: '55.3'
    text: |-
      De gegevens, genoemd in het eerste en het tweede lid, met uitzondering van de gegevens, genoemd in het eerste lid,
      onderdeel a ten 4°, worden niet gewijzigd.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel55
  - number: '55.4'
    text: Een monsterboekje is slechts geldig indien het de handtekening van de houder bevat.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel55
  - number: '56.1'
    text: |-
      Bij de aanvraag van een monsterboekje wegens verlies van het reeds afgegeven monsterboekje legt de aanvrager
      behalve de in [artikel 54, eerste lid, onderdelen a en b][ref1] genoemde bescheiden, een verklaring over waaruit
      blijkt dat de aanvrager van de vermissing van het monsterboekje aangifte heeft gedaan dan wel andere bewijsstukken
      met betrekking tot het verlies.


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel54
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0012790
        artikel: '54'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '56.2'
    text: |-
      Bij de aanvraag van een monsterboekje ter vernieuwing van het monsterboekje, respectievelijk het
      verlopen van de geldigheidsduur of het onbruikbaar worden van het monsterboekje legt de aanvrager het
      oude, respectievelijk onbruikbaar geworden monsterboekje over, alsmede twee pasfoto's als bedoeld in
      [artikel 54, eerste lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel54
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0012790
        artikel: '54'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '57.1'
    text: |-
      Onverminderd [artikel 53, tweede lid][ref1], kan in de volgende gevallen een voorlopig monsterboekje worden
      afgegeven:


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel53
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0012790
        artikel: '53'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 57.1.a
    text: indien de aanvrager niet tijdig in Nederland een monsterboekje kan aanvragen;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel57
  - number: 57.1.b
    text: |-
      op verzoek van de zeevarende die aantoont het monsterboekje niet langer dan drie maanden nodig te hebben voor zijn
      werkzaamheden aan boord; of
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel57
  - number: 57.1.c
    text: |-
      indien naar het oordeel van het hoofd van de Scheepvaartinspectie niet zeker is dat de aanvrager een
      arbeidsovereenkomst met de scheepsbeheerder of de zeewerkgever zal kunnen sluiten dan wel een schriftelijke
      maatschapsovereenkomst in het kader van de zeevisserij zal aangaan.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel57
  - number: '57.2'
    text: |-
      In het geval, genoemd in het eerste lid, onderdeel a, wordt het monsterboekje ingevuld en afgegeven door de
      schipper.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel57
  - number: '57.3'
    text: |-
      In de gevallen, genoemd in het eerste lid, onderdelen b en c, wordt het monsterboekje ingevuld en afgegeven door
      het hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel57
  - number: '58'
    text: |-
      De [artikelen 53, tweede lid][ref1], [54][ref2] en [55][ref3] zijn van overeenkomstige toepassing bij de afgifte
      van een vervangend monsterboekje of een voorlopig monsterboekje.


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0012790#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0012790#Artikel55
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0012790
        artikel: '53'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012790
        artikel: '54'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0012790
        artikel: '55'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '59.1'
    text: |-
      Bij regeling van Onze Minister wordt bepaald welke personen naast het hoofd van de Scheepvaartinspectie en de
      schipper bevoegd zijn tot het maken van de daarbij genoemde aanvullende aantekeningen of van wijzigingen in een
      monsterboekje of een voorlopig monsterboekje.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel59
  - number: '59.2'
    text: |-
      Een monsterboekje of een voorlopig monsterboekje, waarin een ander dan een van de in het eerste lid bedoelde
      personen de daarbij genoemde aantekeningen of wijzigingen heeft aangebracht, is ongeldig.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel59
  - number: '59.3'
    text: |-
      Degene, die onbevoegd aantekeningen of wijzigingen heeft aangebracht in een monsterboekje, draagt de kosten van de
      vervanging van dat monsterboekje.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel59
  - number: '60.1'
    text: |-
      Alle bemanningsleden aan boord van Nederlandse vissersvaartuigen zijn voorzien van een geldige geneeskundige
      verklaring van algemene lichamelijke geschiktheid voor de zeevaart.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel60
  - number: '60.2'
    text: |-
      De bemanningsleden aan wie het houden van uitkijk dan wel de wacht op de brug of in de ruimte voor de machines
      kan worden opgedragen, zijn in het bezit van geldige geneeskundige verklaringen betreffende het gezichtsorgaan en
      het gehoororgaan.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel60
  - number: '60.3'
    text: Bij regeling van Onze Minister worden de modellen van de geneeskundige verklaringen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel60
  - number: '61.1'
    text: |-
      Ten behoeve van de afgifte van een in [artikel 60, eerste of tweede lid][ref1], genoemde geneeskundige verklaring
      worden de bemanningsleden aan een daarop gericht medisch onderzoek onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel60
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0012790
        artikel: '60'
        hoofdstuk: '7'
  - number: '61.2'
    text: een geneeskundige verklaring
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel61
  - number: 61.2.a
    text: van algemene lichamelijke geschiktheid voor de zeevaart wordt afgegeven door een aangewezen geneeskundige;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel61
  - number: 61.2.b
    text: |-
      betreffende het gezichtsorgaan wordt afgegeven door een aangewezen medisch specialist op het gebied van de
      oogheelkunde;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel61
  - number: 61.2.c
    text: |-
      betreffende het gehoororgaan wordt afgegeven door een aangewezen medisch specialist op het gebeid van de keel-,
      neus- en oorheelkunde, die heeft vastgesteld dat de onderzochte voldoet aan de voor die verklaring van toepassing
      zijnde medische eisen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel61
  - number: '61.3'
    text: |-
      Indien de gekeurde gebruik wenst te maken van zijn recht om opnieuw te worden onderzocht, wordt hij onderzocht
      door een ingevolge [artikel 42, eerste lid, van de wet][ref1] als scheidsrechter aangewezen geneeskundige dan wel
      medisch specialist op het gebied van de oogheelkunde, onderscheidenlijk van de keel-, neusen oorheelkunde.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel42
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '42'
  - number: '61.4'
    text: |-
      De in dit besluit bedoelde onderzoeken worden verricht door geneeskundigen of medisch specialisten die niet de
      behandelend arts of specialist van de onderzochte zijn.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel61
  - number: '62.1'
    text: |-
      Bij regeling van Onze Minister worden de medische eisen vastgesteld waaraan de aanvrager moet voldoen om in
      aanmerking te komen voor elk van de geneeskundige verklaringen, genoemd in [artikel 61][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel61
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0012790
        artikel: '61'
        hoofdstuk: '7'
  - number: '62.2'
    text: |-
      Bij regeling van Onze Minister worden de procedures en andere voorschriften vastgesteld die in acht worden genomen
      bij elk van de onderzoeken, bedoeld in [artikel 61][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel61
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0012790
        artikel: '61'
        hoofdstuk: '7'
  - number: '62.3'
    text: |-
      Bij de vaststelling van medische eisen wordt bepaald ten aanzien van welke nieuwe medische eisen een ontheffing als
      bedoeld in [artikel 44, tweede lid, van de wet][ref1] kan worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel44
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '44'
  - number: '62.4'
    text: |-
      In afwijking van het bepaalde in [artikel 61, tweede lid][ref1], wordt de desbetreffende geneeskundige verklaring,
      indien ontheffing wordt gegeven van een bepaalde medische eis, afgegeven door de medisch adviseur van het hoofd van
      de Scheepvaartinspectie.


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel61
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0012790
        artikel: '61'
        hoofdstuk: '7'
  - number: '63.1'
    text: |-
      Een medisch onderzoek naar de algemene lichamelijke geschiktheid wordt voorafgegaan door een onderzoek op
      tuberculose door middel van een Mantoux-onderzoek of een röntgenologisch onderzoek van de borstorganen. Dit
      onderzoek wordt verricht door een daartoe bevoegde geneeskundige.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel63
  - number: '63.2'
    text: |-
      Indien de uitslag van het Mantoux-onderzoek of het röntgenologisch onderzoek gunstig is, plaatst de geneeskundige
      een voor dat doel bestemd stempel op de daarvoor bestemde bladzijde van het monsterboekje van de gekeurde, dan wel
      op diens bewijs van inschrijving aan een erkende opleiding voor zeevarenden.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel63
  - number: '63.3'
    text: |-
      Indien de uitslag van het Mantoux-onderzoek of het röntgenologisch onderzoek niet gunstig is, wordt geen
      stempelafdruk geplaatst. De geneeskundige geeft in dat geval een verklaring aan de gekeurde mee ten behoeve van
      degeneeskundige die de algemene lichamelijke keuring verricht, waarin de gevonden afwijking wordt aangegeven.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel63
  - number: '63.4'
    text: |-
      Indien sinds het onderzoek op tuberculose, bedoeld in het eerste lid, meer dan een jaar is verstreken, wordt dat
      onderzoek opnieuw verricht.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel63
  - number: '64.1'
    text: |-
      De geldigheid van de onderscheiden geneeskundige verklaringen van geschiktheid voor de zeevaart vervalt na verloop
      van de volgende termijnen na de datum van afgifte ervan:
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel64
  - number: 64.1.a
    text: 'de geneeskundige verklaring van algemene lichamelijke geschiktheid voor de zeevaart: één jaar;'
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel64
  - number: 64.1.b
    text: |-
      de geneeskundige verklaring van geschiktheid betreffende het gezichtsorgaan: zes jaar, waarbij de geldigheid elke
      twee jaar wordt bevestigd;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel64
  - number: 64.1.c
    text: |-
      de geneeskundige verklaring van geschiktheid betreffende het gehoororgaan: zes jaar, waarbij de geldigheid elke
      twee jaar wordt bevestigd.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel64
  - number: '64.2'
    text: |-
      Ten behoeve van de bevestiging, bedoeld in het eerste lid, onderdelen b en c, worden het gezichtsorgaan en het
      gehoororgaan elke twee jaar onderzocht als onderdeel van het onderzoek naar de algemene lichamelijke geschiktheid.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel64
  - number: '64.3'
    text: |-
      In afwijking van het in het eerste lid bepaalde blijft een geneeskundige verklaring bij overschrijding van de
      genoemde termijnen aan boord in elk geval geldig zolang de zeevarende aan boord van het zeeschip blijft, en zich
      nog geen gelegenheid tot keuring door een aangewezen geneeskundige of medisch specialist heeft voorgedaan.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel64
  - number: '64.4'
    text: |-
      Op medische gronden kan de geneeskundige een geneeskundige verklaring van geschiktheid voor de zeevaart als bedoeld
      in artikel 104, eerste lid, onderscheidenlijk het tweede lid, afgeven voor een kortere duur dan die, genoemd in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel64
  - number: '65.1'
    text: De geneeskundige kan de gekeurde tijdelijk, voorlopig of blijvend ongeschikt voor de zeevaart verklaren.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel65
  - number: '65.2'
    text: De gekeurde is
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel65
  - number: 65.2.a
    text: |-
      tijdelijk ongeschikt, indien op medische gronden wordt verwacht dat hij niet langer dan 42 dagen voor de zeevaart
      ongeschikt zal zijn;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel65
  - number: 65.2.b
    text: |-
      voorlopig ongeschikt, indien op medische gronden wordt verwacht dat hij langer dan 42 dagen en niet langer dan 3
      jaar voor de zeevaart ongeschikt zal zijn;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel65
  - number: 65.2.c
    text: |-
      blijvend ongeschikt, indien op medische gronden wordt verwacht dat hij langer dan 3 jaar voor de zeevaart
      ongeschikt zal zijn.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel65
  - number: '66'
    text: |-
      De geneeskundige, medisch specialist of als scheidsrechter aangewezen geneeskundige of medisch specialist
      die het onderzoek uitvoert, neemt de in [artikel 60, eerste lid][ref1], bedoelde medische eisen, de in
      [artikel 60, tweede lid][ref2], bedoelde procedures en, voor zover van toepassing, de [artikelen 61][ref3] en
      [62][ref4] in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0012790#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0012790#Artikel61
      [ref4]: https://wetten.overheid.nl/BWBR0012790#Artikel62
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0012790
        artikel: '60'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0012790
        artikel: '60'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0012790
        artikel: '61'
        hoofdstuk: '7'
      - id: ref4
        bwb_id: BWBR0012790
        artikel: '62'
        hoofdstuk: '7'
  - number: '67'
    text: |-
      Onze Minister zendt aan de geneeskundige of medisch specialist die is aangewezen om de onderzoeken als bedoeld in
      [artikel 62][ref1] te verrichten als keurend arts of als scheidsrechter de geldende medische eisen en procedures,
      bedoeld in [artikel 63][ref2], alsmede de wijzigingen van die medische eisen en procedures.


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0012790#Artikel63
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0012790
        artikel: '62'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0012790
        artikel: '63'
        hoofdstuk: '7'
  - number: '68.1'
    text: |-
      Een geneeskundige of medisch specialist kan Onze Minister verzoeken hem aan te wijzen als keurend arts of als
      scheidsrechter.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel68
  - number: '68.2'
    text: |-
      Bij het verzoek worden documenten en andere bewijsstukken van de volgende gegevens, dan wel gewaarmerkte
      afschriften ervan, overgelegd:
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel68
  - number: 68.2.a
    text: naam en voornaam;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel68
  - number: 68.2.b
    text: geboortedatum;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel68
  - number: 68.2.c
    text: praktijkadres; en
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel68
  - number: 68.2.d
    text: |-
      een geldig bewijs van registratie als arts als bedoeld in de
      [Wet op de beroepen in de individuele gezondheidszorg][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0006251
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0006251
  - number: 68.2.e
    text: een geldig bewijs van registratie als medisch specialist.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel68
  - number: '68.3'
    text: |-
      Indien het verzoek is ingediend door een geneeskundige of medisch specialist die in het buitenland zijn praktijk
      houdt, kan in plaats van de bewijsstukken, genoemd in het tweede lid, onderdelen d en e, volstaan worden met een
      ander document, waaruit de bevoegdheid blijkt tot uitoefening van de geneeskunst en waaruit de datum blijkt van het
      behalen ervan.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel68
  - number: '68.4'
    text: |-
      Bij het besluit van Onze Minister over de aanwijzing kunnen in aanmerking worden genomen het aantal reeds
      aangewezen geneeskundigen of medisch specialisten, hun specialisme en de spreiding van de aangewezen geneeskundigen
      en medische specialisten over het land in relatie tot de regionale of plaatselijke behoefte.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel68
  - number: '68.5'
    text: |-
      Onze Minister gaat niet over tot aanwijzing van een geneeskundige, medisch specialist of scheidsrechter indien
      diens onafhankelijkheid ten opzichte van werkgevers, werknemers of hun organisaties niet gewaarborgd is.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel68
  - number: '69'
    text: 'Onze Minister trekt een aanwijzing in indien is gebleken dat de aangewezen geneeskundige of medisch specialist:'
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel69
  - number: 69.a
    text: de algemeen geldende medische of ethische normen niet in acht neemt;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel69
  - number: 69.b
    text: zich bij herhaling niet aan de procedures, bedoeld in artikel 62, tweede lid, houdt;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel69
  - number: 69.c
    text: valse of vervalste verklaringen heeft afgegeven;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel69
  - number: 69.d
    text: niet meer in het betrokken register vermeld is als arts of als medisch specialist;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel69
  - number: 69.e
    text: onder curatele is gesteld wegens geestelijke stoornis;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel69
  - number: 69.f
    text: anderszins niet meer gerechtigd is de geneeskunst uit te oefenen;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel69
  - number: 69.g
    text: een daartoe strekkend verzoek heeft ingediend;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel69
  - number: 69.h
    text: diens onafhankelijkheid ten opzichte van werkgevers, werknemers of hun organisaties niet langer gewaarborgd is; of
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel69
  - number: 69.i
    text: |-
      niet meer werkzaam is in de patiëntenzorg en een te gering aantal keuringen heeft verricht om door praktische
      ervaring zijn bekwaamheid als keuringsarts op peil te houden.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel69
  - number: '70.1'
    text: |-
      De medisch adviseur van het hoofd van de Scheepvaartinspectie kan geneeskundige verklaringen, afgegeven op grond
      van medische eisen die naar zijn oordeel ten minste gelijkwaardig zijn aan het geheel van de medische eisen, die
      krachtens dit besluit worden gesteld, gelijkstellen met een of meer krachtens dit besluit afgegeven geneeskundige
      verklaringen van geschiktheid voor de zeevaart.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel70
  - number: '70.2'
    text: |-
      Een in het eerste lid bedoelde geneeskundige verklaring mag niet langer dan 1 jaar voor de beoordeling zijn
      afgegeven.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel70
  - number: '71.1'
    text: |-
      De kosten van een geneeskundig of specialistisch onderzoek of heronderzoek als bedoeld in de [artikelen 40][ref1]
      en [42 van de wet][ref2] komen voor rekening van de scheepsbeheerder of werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel42
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '40'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '42'
  - number: '71.2'
    text: |-
      Voor zover er geen scheepsbeheerder of werkgever is aan te wijzen worden de kosten, bedoeld in het eerste lid,
      gedragen door degene die opdracht heeft gegeven voor het onderzoek.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel71
  - number: '71.3'
    text: |-
      De kosten van een geneeskundig of specialistisch onderzoek als bedoeld in
      [artikel 23, tweede lid, van de wet][ref1] worden door het Rijk gedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel23
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '23'
  - number: '71.4'
    text: |-
      De kosten van een heronderzoek of een aanvullend specialistisch onderzoek, bedoeld in de [artikelen 40 ][ref1]en
      [42 van de wet][ref2] kunnen worden gedragen door her Rijk, voor zover zij naar het oordeel van het hoofd van de
      Scheepvaartinspectie redelijkerwijs niet voor rekening van de gekeurde behoren te komen.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel42
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '40'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '42'
  - number: '72.1'
    text: |-
      Bemanningsleden aan wie in de alarmrol van het vissersvaartuig een veiligheidstaak wordt opgedragen dan wel een
      taak ten aanzien van het voorkomen van verontreiniging van de zee hebben, zijn in het bezit van een certificaat
      waaruit blijkt dat zij met goed gevolg een door Onze Minister erkende training en opleiding «basis veiligheid» als
      bedoeld in [artikel 44][ref1] hebben gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel44
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0012790
        artikel: '44'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '72.2'
    text: |-
      Voor bemanningsleden met de functie van ten minste stuurman zeevisvaart, werktuigkundige zeevisvaart of stuurman-
      werktuigkundige, geldt het geldige vaarbevoegdheidsbewijs als het certificaat, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel72
  - number: '72.3'
    text: |-
      Overige bemanningsleden, die niet vallen onder het eerste of tweede lid, krijgen voordat zij hun taken aan boord
      beginnen voldoende informatie en instructie ten einde:
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel72
  - number: 72.3.a
    text: |-
      met de overige opvarenden over elementaire veiligheidszaken te kunnen spreken, begrip te hebben van de
      veiligheidssymbolen en de alarmseinen te kennen;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel72
  - number: 72.3.b
    text: |-
      te weten wat te doen indien: – iemand over boord valt; vuur of rook wordt ontdekt; het sein «brandalarm» of «schip
      verlaten» wordt gegeven;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel72
  - number: 72.3.c
    text: te weten waar de reddingsgordels zich bevinden en hoe deze om te doen;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel72
  - number: 72.3.d
    text: alarm te slaan en bekend te zijn met het gebruik van handbrandblussers;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel72
  - number: 72.3.e
    text: te weten wat te doen bij een ongeluk voordat hulp wordt ingeroepen;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel72
  - number: 72.3.f
    text: |-
      de brand- en waterdichte deuren, met uitzondering van die ter afsluiting van openingen in de romp, te kunnen
      sluiten en openen.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel72
  - number: '73.1'
    text: |-
      De schipper en het bemanningslid aan wie, onder de verantwoordelijkheid van de schipper, de zorg voor het
      gebruik en het beheer van de medische uitrusting is overgedragen zijn in het bezit van het certificaat
      scheepsgezondheidszorg O (Onbeperkt), bedoeld in [artikel 47, tweede lid][ref1], of , wanneer aan het
      vissersvaartuig een certificaat van deugdelijkheid is afgegeven voor een beperkt vaargebied dat zich niet
      verder uitstrekt dan vaargebied II, van het certificaat scheepsgezondheidszorg B (Beperkt), bedoeld in
      [artikel 47, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0012790#Artikel47
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0012790
        artikel: '47'
        hoofdstuk: '5'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0012790
        artikel: '47'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: '73.2'
    text: |-
      Voor de toepassing van het eerste lid worden bezitters van het kennisbewijs SW 4, SW 5 en het diploma SIV-v geacht
      in het bezit te zijn van het certificaat scheepsgezondheidszorg B.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel73
  - number: '73.3'
    text: |-
      De in het eerste lid bedoelde personen volgen ten minste eenmaal in de vijf jaar een bijscholingscursus als
      bedoeld in [artikel 47, derde lid][ref1], die voor personen aan boord van vissersvaartuigen waarvoor een
      certificaat van deugdelijkheid is afgegeven voor onbeperkt vaargebied mede een herhalingsstage als bedoeld in
      [artikel 47, vierde lid][ref2], omvat.


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0012790#Artikel47
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0012790
        artikel: '47'
        hoofdstuk: '5'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0012790
        artikel: '47'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: '73.4'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel73
  - number: '74.1'
    text: |-
      Op een vissersvaartuig dat op een internationaal traject van meer dan drie dagen vaart, met een bemanning en overig
      personeel van honderd personen of meer die, in welke hoedanigheid ook, aan boord ten behoeve van het schip in
      dienst of tewerkgesteld zijn, inclusief stagiairs en leerlingen alsmede personen die werkzaam zijn als loods, is
      een arts aanwezig.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel74
  - number: '74.2'
    text: |-
      Indien aan het bepaalde in het eerste lid is voldaan, kan in afwijking van het bepaalde in
      [artikel 73, eerste lid][ref1], voor de schipper en het bemanningslid aan wie, onder verantwoordelijkheid van de
      schipper het beheer van de medische uitrusting is overgedragen, op vissersvaartuigen in onbeperkt vaargebied worden
      volstaan met het bezit van het certificaat scheepsgezondheidszorg B, bedoeld in [artikel 47, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0012790#Artikel47
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0012790
        artikel: '73'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0012790
        artikel: '47'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: '74.3'
    text: |-
      Bij regeling van Onze Minister kunnen nadere eisen worden gesteld ten aanzien van de bekwaamheid van de in het
      eerste lid genoemde arts.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel74
  - number: '75.1'
    text: |-
      Aan boord van een vissersvaartuig waarvan de voorgeschreven bemanning uit meer dan 9 personen bestaat, moet
      daarboven een gediplomeerde scheepskok belast zijn met de bereiding van de voeding.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel75
  - number: '75.2'
    text: |-
      Onder een gediplomeerde scheepskok wordt verstaan een persoon van 18 jaar of ouder in het bezit van een door de
      Minister erkend diploma als scheepskok als bedoeld in [artikel 48][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel48
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0012790
        artikel: '48'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: '75.3'
    text: |-
      Onze Minister kan diploma's, door bevoegde autoriteiten in andere landen afgegeven op grond van het Verdrag
      betreffende het diploma van bekwaamheid als scheepskok, 1946 als gelijkwaardig aan Nederlandse diploma's erkennen.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel75
  - number: '75.4'
    text: |-
      Het hoofd van de Scheepvaartinspectie kan op een daartoe strekkend verzoek van de scheepsbeheerder voor een
      bepaalde tijd ontheffing van het in het eerste lid bepaalde met betrekking tot het gediplomeerd zijn van de
      scheepskok, indien er naar zijn redelijk oordeel een onvoldoend aantal gediplomeerde scheepskoks ter beschikking
      staat.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel75
  - number: '75.5'
    text: |-
      Aan een in het vijfde lid bedoelde ontheffing kunnen voorschriften worden verbonden. Indien de voorschriften niet
      worden nageleefd kan het hoofd van de Scheepvaartinspectie een verleende ontheffing tussentijds intrekken.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel75
  - number: '76.1'
    text: |-
      Aan boord van een vissersvaartuig is op elke zeewacht naast de chef van de wacht tenminste een gezel aan dek op
      wacht die de leeftijd van 18 jaar heeft bereikt en tenminste zes maanden diensttijd aan boord van schepen heeft
      behaald. Gedurende de tijd dat de automatische stuurinrichting in bedrijf is kan worden volstaan met uitsluitend de
      chef van de wacht.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel76
  - number: '76.2'
    text: |-
      De eerste lid bedoelde chef van de wacht is in het bezit van een vaarbevoegdheidsbewijs als schipper zeevisvaart,
      plaatsvervangend schipper zeevisvaart, stuurman-werktuigkundige zeevisvaart dan wel stuurman zeevisvaart.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel76
  - number: '77.1'
    text: |-
      Aan boord van een vissersvaartuig dat reizen onderneemt buiten het zeegebied A1, zoals omschreven in [artikel 2 van
      bijlage V van het Schepenbesluit 1965](onbekend), is ten minste één persoon die als chef van de wacht op de brug
      kan optreden, in het bezit van een algemeen certificaat maritieme radiocommunicatie, afgegeven in overeenstemming
      met het bepaalde bij of krachtens het Besluit radio-elektrische inrichtingen; deze persoon is door de schipper
      aangewezen als de verantwoordelijke persoon voor de afhandeling van radioberichtgeving tijdens noodgevallen.
      Alle andere personen die als chef van de wacht op de brug kunnen optreden zijn in het bezit zijn van het beperkt
      certificaat maritieme radiocommunicatie.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel77
  - number: '77.2'
    text: |-
      Aan boord van een vissersvaartuig dat uitsluitend reizen onderneemt in zeegebied A1, is ten minste één der
      personen die als chef van de wacht op de brug kunnen optreden in het bezit van het beperkt certificaat maritieme
      radiocommunicatie, afgegeven in overeenstemming met het bepaalde bij of krachtens het Besluit radio-elektrische
      inrichtingen.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel77
  - number: '78'
    text: |-
      Bij regeling van Onze Minister kunnen, ter uitvoering van Verdragen of van besluiten van volkenrechtelijke
      organisaties, nadere regels worden gesteld met betrekking tot de in dit besluit geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel78
  - number: '79'
    text: |-
      De op het tijdstip van inwerkingtreding van de wet ten behoeve van de medische of scheidsrechterlijke keuring van
      zeevarenden aangewezen artsen en medisch specialisten blijven aangewezen tot het tijdstip dat de aanwijzing met
      inachtneming van dit besluit wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel79
  - number: '80'
    text: |-
      Tot vijf jaar na inwerkingtreding van dit besluit behoeven houders van diploma's afgegeven ingevolge de Wet op de
      Zeevischvaartdiploma's, Stb. 1935, 455, niet in het bezit te zijn een vaarbevoegdheidsbewijs indien overigens wordt
      voldaan aan de verplichtingen genoemd in [paragraaf 3 van hoofdstuk 4][ref1] van dit besluit, en de betreffende
      bemanningsleden bevoegd zijn voor de functie waarin wordt dienstgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0012790
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '81'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel81
  - number: '82'
    text: 'Dit besluit wordt aangehaald als: Besluit zeevisvaartbemanning.'
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel82
