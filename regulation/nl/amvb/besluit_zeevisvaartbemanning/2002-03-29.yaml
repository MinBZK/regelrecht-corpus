        hoofdstuk: '7'
  - number: 1.m
    text: |-
      wet: [Zeevaartbemanningswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009124
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009124
  - number: '2'
    text: Dit besluit is van toepassing aan boord van vissersvaartuigen.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel2
  - number: '3.1'
    text: |-
      Op verzoek van de scheepsbeheerder kan het hoofd van de Scheepvaartinspectie ontheffing verlenen van de
      verplichting om het vissersvaartuig te bemannen in overeenstemming met [hoofdstuk 3][ref1], zoals vermeld op het
      bemanningscertificaat, indien blijkt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012790
        hoofdstuk: '3'
  - number: 3.1.a
    text: |-
      korte tijd voor het vertrek van het vissersvaartuig uit de haven een of meer leden van de bemanning niet
      beschikbaar zijn;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel3
  - number: 3.1.b
    text: dringende omstandigheden ertoe nopen het vertrek niet langer uit te stellen, en
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel3
  - number: 3.1.c
    text: |-
      met de aan boord aanwezige bemanning, gelet op de bijzonderheden van de reis, het vissersvaartuig zonder gevaar
      voor het vaartuig of andere zaken, voor personen, het milieu of de scheepvaart deze reis kan ondernemen.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel3
  - number: '3.2'
    text: |-
      Op verzoek van de scheepsbeheerder kan het hoofd van de Scheepvaartinspectie een ontheffing als bedoeld in
      [artikel 25 van de wet][ref1] verlenen, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel25
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '25'
  - number: 3.2.a
    text: er onvoldoende bemanningsleden voorhanden zijn in het bezit van de vereiste kwalificaties,
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel3
  - number: 3.2.b
    text: |-
      de ontheffing verleend wordt aan een bemanningslid dat in het bezit is van het vaarbevoegdheidsbewijs dat vereist
      is voor de relevante lagere functie, en
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel3
  - number: 3.2.c
    text: |-
      met de aan boord aanwezige bemanning, gelet op de bijzonderheden van de reis, het vissersvaartuig zonder gevaar
      voor het vaartuig of andere zaken, voor personen, het milieu of de scheepvaart deze reis kan ondernemen.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel3
  - number: '3.3'
    text: |-
      Een ontheffing als bedoeld in [artikel 25 van de wet][ref1] wordt voor de functie van schipper of
      hoofdwerktuigkundige slechts gegeven in zeer bijzondere omstandigheden die niet het gevolg zijn van het handelen
      of het nalaten van handelen van de zijde van de scheepsbeheerder en indien de vervulling gedurende korte tijd van
      die functie door een bemanningslid met een lagere bevoegdheid noodzakelijk is voor de voortzetting van de reis, en
      de veiligheid van het vissersvaartuig en de opvarenden, de veilige vaart ter zee en de bescherming van het mariene
      milieu gewaarborgd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel25
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '25'
  - number: '4.1'
    text: |-
      Bij regeling van Onze Minister kan voor bepaalde categorieën vissersvaartuigen met een lengte van minder dan 45
      meter, waarvoor een certificaat van deugdelijkheid is afgegeven voor vaargebied I, vrijstelling worden verleend van
      het bepaalde in [hoofdstuk 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012790
        hoofdstuk: '3'
  - number: '4.2'
    text: Bij het verlenen van een vrijstelling, bedoeld in het eerste lid, kunnen beperkingen worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel4
  - number: '5'
    text: |-
      De in [artikel 4, tweede lid][ref1], genoemde beperkingen zijn de weersomstandigheden waaronder mag worden gevaren,
      het te bevaren vaargebied, de categorie vissersvaartuigen en de maximale tijd die op zee mag worden doorgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel4
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012790
        artikel: '4'
        hoofdstuk: '2'
