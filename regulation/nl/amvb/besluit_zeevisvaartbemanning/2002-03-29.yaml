      zeevarenden inzake opleiding, diplomering en wachtdienst, 1978 (Trb. 1981, 144);
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel1
  - number: 1.k
    text: |-
      STCW-Code de Code inzake opleiding, diplomering en wachtdienst van zeevarenden, behorend bij het STCW-Verdrag (Trb.
      1996, 249);
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel1
  - number: 1.l
    text: |-
      geneeskundige verklaring: een verklaring als bedoeld in [artikel 60][ref1];


