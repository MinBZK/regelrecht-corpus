  - number: '39.1'
    text: 'Een kennisbewijs wordt afgegeven door:'
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel39
  - number: 39.1.a
    text: |-
      een instelling als bedoeld in de [Wet educatie en beroepsonderwijs (Web)][ref1] die beroepsopleidingen voor de
      visserij op zee verzorgt waarvoor door de Minister van Onderwijs, Cultuur en Wetenschappen, in overeenstemming met
      Onze Minister, eindtermen zijn vastgesteld zoals bedoeld in [artikel 7.2.4, eerste lid, van die wet][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0007625
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 39.1.b
    text: een door Onze Minister erkende opleiding of exameninstelling.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel39
  - number: '39.2'
    text: |-
      Een certificaat wordt afgegeven door het bevoegd gezag van een door Onze Minister erkende opleiding, training,
      exameninstelling of een certificerende instelling op het gebied van persoonscertificatie
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel39
  - number: '40'
    text: 'Voor het verkrijgen van het kennisbewijs stuurman-werktuigkundige voor de zeevisvaart SW4 of SW5 heeft betrokkene:'
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel40
  - number: '40.1'
    text: |-
      met goed gevolg examen afgelegd ter afsluiting van een opleiding die ten minste voldoet aan de syllabus opgenomen
      in [Bijlage I][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012790
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0012790
  - number: '40.2'
    text: deelgenomen aan een goedgekeurde cursus brandbestrijding voor gevorderden; en
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel40
  - number: '40.3'
    text: |-
      een goedgekeurde stage aan boord van vissersvaartuigen van ten minste één jaar als onderdeel van vorenbedoelde
      opleiding vervuld, onder het bijhouden van een goedgekeurd stageboek, of anders een goedgekeurde diensttijd van
      ten minste twee jaar aan boord van vissersvaartuigen, en heeft gedurende deze stage of diensttijd buitengaats
      wachtdienst op de brug gelopen onder toezicht van de schipper of van een daartoe bevoegd bemanningslid, gedurende
      een periode van ten minste zes maanden, en heeft gedurende ten minste zes maanden dienstgedaan in de machinekamer.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel40
  - number: '41'
    text: 'Voor het verkrijgen van het kennisbewijs stuurmanwerktuigkundige voor de zeevisvaart SW6 heeft betrokkene:'
