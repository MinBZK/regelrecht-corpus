preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 10 januari 2001, kenmerk DGG/ J-01/005603,
    Directoraat-Generaal Goederenvervoer, Stafafdeling Wetgeving, Bestuurlijke en Juridische Zaken;

    Gelet op de artikelen 16, 17, eerste lid, 18, derde, vierde, vijfde en zesde lid, 19, eerste lid, 25, eerste lid,
    34, eerste lid, 36, 44, eerste lid, 64 en 71, eerste lid, van de Zeevaartbemanningswet; op Richtlijn nr. 92/29/EEG
    van de Raad van de Europese Gemeenschappen van 31 maart 1992 betreffende de minimumvoorschriften inzake veiligheid
    en gezondheid ter bevordering van een betere medische hulpverlening aan boord van schepen (Pb EG L 113), op het
    op 27 juni 1946 te Seattle tot stand gekomen Verdrag No. 69 van de Internationale Arbeidsconferentie inzake het
    diploma van bekwaamheid als scheepskok, 1946 (Stb. I 328), het op 27 juni 1946 te Seattle tot stand gekomen Verdrag
    No. 73 van de Internationale Arbeidsconferentie inzake het geneeskundig onderzoek van zeelieden, 1946 (Stb. I
    326) en het op 19 juni 1959 te Genève tot stand gekomen Verdrag No. 113 van de Internationale Arbeidsorganisatie
    betreffende het geneeskundig onderzoek van vissers (Trb. 1964, 44);

    De Raad van State gehoord (advies van 23 februari 2001, nr. W09.01.0025/V);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 21 augustus 2001, kenmerk DGG/J-01/003057,
    Directoraat-Generaal Goederenvervoer, Stafafdeling Wetgeving, Bestuurlijke en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel1
  - number: 1.a
    text: |-
      lengte: de lengte van een vissersvaartuig die gelijk is aan 96 procent van de lengte van de lastlijn op 85 procent
      van de kleinste holte naar de mal gemeten vanaf de bovenzijde van de kielplaat, dan wel gelijk aan de lengte van
      de voorzijde van de voorsteven tot aan de hartlijn van de roerkoning gemeten op deze lastlijn, indien deze laatste
      lengte groter is. Bij vissersvaartuigen die met een stuurlast zijn ontworpen moet de lastlijn waarop deze lengte
      gemeten wordt, evenwijdig aan de constructiewaterlijn worden genomen.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel1
  - number: 1.b
    text: |-
      voortstuwingsvermogen: het maximale vermogen, uitgedrukt in kiloWatt (kW), dat door de voortstuwingsmachines
      zonder overbelasting gedurende onbeperkte tijdsduur kan worden geleverd, zoals dat vermeld staat op het
      bemanningscertificaat.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel1
  - number: 1.c
    text: |-
      vaargebied Ia: het gebied omvattende alle wateren tot 15 zeemijlen uit de Franse, Belgische, Nederlandse en Duitse
      kust, in het zuiden begrensd door de lijn Calais-Dover, in het oosten door de meridiaan van 8° Oosterlengte;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel1
  - number: 1.d
    text: |-
      vaargebied I: het gebied omvattende alle wateren tot 30 zeemijlen uit de Franse, Belgische, Nederlandse, Duitse
      en Deense westkust, in het zuiden begrensd door de lijn Calais-Dover, in het noorden door de parallel van 57°
      Noorderbreedte;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel1
  - number: 1.e
    text: |-
      vaargebied II: het gebied omvattende de Noordzee tot de 62e Noorderbreedtegraad tot de lijn die het punt, op 62°
      Noorderbreedte en 1° Westerlengte verbindt met Strathie Point (noordkust Schotland), het Kanaal, het Kanaal van
      Bristol, het St. George Kanaal en de Ierse Zee in het zuiden tot de lijn die Kaap St. Mathieu verbindt met Old
      Head of Kinsale (zuidkust Ierland) en in het noorden tot de lijn van Inishowen Head naar Islay (Ardmore Point),
      van Islay (Rhuda Mail) langs de oostkust van Colonsay naar Mull (Loch Buie) en van Mull (Java Point) naar Schotland
      (Barony Point), en de Oostzee;
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel1
  - number: 1.f
    text: 'schipper: een persoon met de vaarbevoegdheid als schipper zeevisvaart;'
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel1
  - number: 1.g
    text: 'plaatsvervangend schipper: een persoon met de vaarbevoegdheid als plaatsvervangend schipper zeevisvaart;'
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel1
  - number: 1.h
    text: 'stuurman-werktuigkundige: een persoon met de vaarbevoegdheid als stuurman-werktuigkundige zeevisvaart;'
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel1
  - number: 1.i
    text: |-
      kennisbewijs: het diploma of certificaat afgegeven door een instelling als bedoeld in de
      [Wet educatie en beroepsonderwijs (Web)][ref1] dan wel een getuigschrift of verklaring afgegeven door een
      instelling als bedoeld in de [Wet Hoger onderwijs en wetenschappelijk onderzoek (WHW)][ref2] of een certificaat
      afgeven door een door de Minister erkende opleiding waaruit blijkt dat een erkende opleiding met goed gevolg is
      afgesloten;


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007625
      - id: ref2
        bwb_id: BWBR0005682
  - number: 1.j
    text: |-
