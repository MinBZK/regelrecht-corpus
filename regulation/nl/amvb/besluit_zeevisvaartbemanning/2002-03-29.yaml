  - number: '16'
    text: |-
      Bij regeling van Onze Minister kan aanvulling van het aantal bemanningsleden worden voorgeschreven indien de
      inrichting, de uitrusting, de lengte, het voortstuwingsvermogen, de wijze van voortstuwing of de bestemming van het
      vissersvaartuig hem daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel16
  - number: '17.1'
    text: |-
      Aan boord van elk vissersvaartuig is een voldoende aantal geoefende bemanningsleden om de groepsreddingmiddelen en
      de tewaterlatingsvoorzieningen, die vereist zijn om alle opvarenden in geval van nood te ontschepen, te bedienen.
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel17
  - number: '17.2'
    text: |-
      Over elke te gebruiken reddingboot heeft een sloepsgast, in het bezit van het certificaat, bedoeld in
      [artikel 44][ref1] de leiding; tevens is een plaatsvervanger, in het bezit van dit certificaat, aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel44
    url: https://wetten.overheid.nl/BWBR0012790/2002-03-29#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0012790
        artikel: '44'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '25'
