      het te bevaren vaargebied, de categorie vissersvaartuigen en de maximale tijd die op zee mag worden doorgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel4
    url: https://wetten.overheid.nl/BWBR0012790/2014-05-03#Artikel5
