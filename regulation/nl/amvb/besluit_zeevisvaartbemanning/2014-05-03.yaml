      en [74, tweede lid][ref4], genoemde certificaat medische eerste hulp aan boord en het in artikel 73, eerste lid,
      genoemde certificaat medische zorg aan boord.

      2 Certificaten scheepsgezondheidszorg O die zijn afgegeven op grond van [artikel 47, tweede lid][ref5], van dit
