  - number: '76'
    text: >-
      1 Aan boord van een vissersvaartuig is op elke zeewacht naast de chef van de wacht tenminste een gezel aan dek op
      wacht die de leeftijd van 18 jaar heeft bereikt en tenminste zes maanden diensttijd aan boord van schepen heeft
      behaald. Gedurende de tijd dat de automatische stuurinrichting in bedrijf is kan worden volstaan met uitsluitend de
      chef van de wacht.


      2 De eerste lid bedoelde chef van de wacht is in het bezit van een vaarbevoegdheidsbewijs als schipper zeevisvaart,
      plaatsvervangend schipper zeevisvaart, stuurman-werktuigkundige zeevisvaart dan wel stuurman zeevisvaart.
    url: https://wetten.overheid.nl/BWBR0012790/2014-05-03#Artikel76
  - number: '77'
    text: |-
      1 Aan boord van een vissersvaartuig dat reizen onderneemt buiten het zeegebied A1, zoals omschreven in Hoofdstuk
      IV van het SOLAS-verdrag, is ten minste één persoon die als chef van de wacht op de brug kan optreden, in het bezit
      van een algemeen certificaat maritieme radiocommunicatie, afgegeven in overeenstemming met het bepaalde bij of
      krachtens het [Frequentiebesluit 2013][ref1]; deze persoon is door de schipper aangewezen als de verantwoordelijke
      persoon voor de afhandeling van radioberichtgeving tijdens noodgevallen. Alle andere personen die als chef van de
      wacht op de brug kunnen optreden zijn in het bezit zijn van het beperkt certificaat maritieme radiocommunicatie.

      2 Aan boord van een vissersvaartuig dat uitsluitend reizen onderneemt in zeegebied A1, is ten minste
      één der personen die als chef van de wacht op de brug kunnen optreden in het bezit van het beperkt
      certificaat maritieme radiocommunicatie, afgegeven in overeenstemming met het bepaalde bij of krachtens het
      [Frequentiebesluit 2013][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032895
      [ref2]: https://wetten.overheid.nl/BWBR0032895
