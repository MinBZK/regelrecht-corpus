    text: |-
      1 Bij regeling van Onze Minister kan voor bepaalde categorieën vissersvaartuigen met een lengte van minder dan
      45 meter, waarvoor een bemanningscertificaat is afgegeven voor een vaargebied dat zich niet verder uitstrekt dan
      vaargebied I, vrijstelling worden verleend van het bepaalde in [hoofdstuk 3][ref1].

      2 Bij het verlenen van een vrijstelling, bedoeld in het eerste lid, kunnen beperkingen worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0012790/2014-05-03#Artikel4
