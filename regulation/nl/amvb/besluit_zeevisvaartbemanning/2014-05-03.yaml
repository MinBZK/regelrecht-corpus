  - number: '56'
    text: |-
      1 Bij de aanvraag van een monsterboekje wegens verlies van het reeds afgegeven monsterboekje legt de aanvrager
      behalve de in [artikel 54, eerste lid, onderdelen a en b][ref1] genoemde bescheiden, een verklaring over waaruit
      blijkt dat de aanvrager van de vermissing van het monsterboekje aangifte heeft gedaan dan wel andere bewijsstukken
      met betrekking tot het verlies.

      2 Bij de aanvraag van een monsterboekje ter vernieuwing van het monsterboekje, respectievelijk het
      verlopen van de geldigheidsduur of het onbruikbaar worden van het monsterboekje legt de aanvrager het
      oude, respectievelijk onbruikbaar geworden monsterboekje over, alsmede twee pasfoto's als bedoeld in
      [artikel 54, eerste lid, onderdeel b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0012790#Artikel54
