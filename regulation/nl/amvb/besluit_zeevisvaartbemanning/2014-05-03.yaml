  - number: '57'
    text: |-
      1 Onverminderd [artikel 53, tweede lid][ref1], kan in de volgende gevallen een voorlopig monsterboekje worden
      afgegeven:

      a. indien de aanvrager niet tijdig in Nederland een monsterboekje kan aanvragen;

      b. op verzoek van de zeevarende die aantoont het monsterboekje niet langer dan drie maanden nodig te hebben voor
      zijn werkzaamheden aan boord; of

      c. indien naar het oordeel van Onze Minister niet zeker is dat de aanvrager een arbeidsovereenkomst met de
      scheepsbeheerder of de zeewerkgever zal kunnen sluiten dan wel een schriftelijke maatschapsovereenkomst in het
      kader van de zeevisserij zal aangaan.

      2 In het geval, genoemd in het eerste lid, onderdeel a, wordt het monsterboekje ingevuld en afgegeven door de
      schipper.

      3 In de gevallen, genoemd in het eerste lid, onderdelen b en c, wordt het monsterboekje ingevuld en afgegeven door
      Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel53
