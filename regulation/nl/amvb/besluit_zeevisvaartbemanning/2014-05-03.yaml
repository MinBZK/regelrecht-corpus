  - number: '66'
    text: |-
      1 Een geneeskundige kan Onze Minister verzoeken hem aan te wijzen als keuringsarts. Bij het verzoek wordt een
      geldig bewijs van registratie als arts, bedoeld in de [Wet op de beroepen in de individuele gezondheidszorg][ref1],
      overgelegd.

      2 Indien het verzoek is ingediend door een geneeskundige die in het buitenland zijn praktijk houdt, vergewist de
      Medisch Adviseur Scheepvaart zich van diens vakbekwaamheid.

      3 Onze Minister gaat niet over tot aanwijzing van een geneeskundige indien diens onafhankelijkheid ten opzichte
      van werkgevers, werknemers of hun organisaties niet gewaarborgd is, of ingeval diens professionele kundigheden,
      praktijkervaring of beroepsuitrusting naar het oordeel van de Medisch Adviseur Scheepvaart, ressorterend onder Onze
      Minister, ontoereikend zijn.

      4 Bij het besluit van Onze Minister over de aanwijzing worden het aantal reeds aangewezen geneeskundigen en de
      spreiding over het land in relatie tot de regionale of plaatselijke behoefte in aanmerking genomen.

      5 De aanwijzing als keurend arts wordt afgegeven voor een periode van ten hoogste vijf jaren. Na afloop van deze
      periode kan een hernieuwd verzoek om aanwijzing als keurend arts worden ingediend; bij dit hernieuwde verzoek wordt
      het bewijsstuk vermeld in het eerste lid overgelegd, tenzij het tweede lid van toepassing is.

      6 De aangewezen geneeskundige is verplicht de door Onze Minister, op aanbeveling van de Medisch Adviseur
      Scheepvaart, aangewezen nascholingscursussen te volgen. De kosten van deelname komen voor rekening van de betrokken
      geneeskundige.


      [ref1]: https://wetten.overheid.nl/BWBR0006251
    url: https://wetten.overheid.nl/BWBR0012790/2014-05-03#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0006251
  - number: '67'
    text: |-
      Onze Minister trekt, op advies van de Medisch Adviseur Scheepvaart, een aanwijzing in indien is gebleken dat de
      keuringsarts of scheidsrechter:

      a. de algemeen geldende medische of ethische normen niet in acht neemt;

      b. zich bij herhaling niet houdt aan het gestelde in de [artikelen 61 tot en met 65][ref1], of zijn
      beroepsuitrusting niet toereikend is voor zijn taak als keuringsarts ;

      c. valse of vervalste verklaringen heeft afgegeven;

      d. niet meer in het betrokken register vermeld is als arts;

      e. onder curatele is gesteld wegens geestelijke stoornis;

      f. anderszins niet meer gerechtigd is de geneeskunst uit te oefenen;

      g. een daartoe strekkend verzoek heeft ingediend;

      h. diens onafhankelijkheid ten opzichte van werkgevers, werknemers of hun organisaties niet langer gewaarborgd is;

      i. een te gering aantal keuringen heeft verricht om door praktische ervaring zijn bekwaamheid als keuringsarts op
      peil te houden, of

      j. heeft verzuimd een voor hem aangewezen nascholingscursus te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel61
    url: https://wetten.overheid.nl/BWBR0012790/2014-05-03#Artikel67
