  - number: '73'
    text: >-
      1 De schipper en de zeevarende die is aangewezen om medische hulp aan boord van het vissersvaartuig te verlenen,
      zijn in het bezit van het certificaat medische eerste hulp aan boord en van het certificaat medische zorg aan
      boord.


      2 Wanneer aan het vissersvaartuig een bemanningscertificaat is afgegeven voor een beperkt vaargebied dat zich
      niet verder uitstrekt dan vaargebied II, zijn, in afwijking van het eerste lid, de schipper en de zeevarende die
      is aangewezen om medische hulp aan boord van het vissersvaartuig te verlenen, in het bezit van het certificaat
      medische eerste hulp aan boord.


      3 Een zeevarende als bedoeld in het eerste of tweede lid toont door middel van een certificaat met tussenpozen van
      niet meer dan 5 jaar aan een passende herhalingstraining te hebben gevolgd.
    url: https://wetten.overheid.nl/BWBR0012790/2014-05-03#Artikel73
  - number: '74'
    text: |-
      1 Op een vissersvaartuig dat op een internationaal traject van meer dan drie dagen vaart, met een bemanning en
      overig personeel van honderd personen of meer die, in welke hoedanigheid ook, aan boord ten behoeve van het schip
      in dienst of tewerkgesteld zijn, inclusief stagiairs en leerlingen alsmede personen die werkzaam zijn als loods, is
      een arts aanwezig.

      2 Indien aan het bepaalde in het eerste lid is voldaan, kan in afwijking van het bepaalde in
      [artikel 73, eerste lid][ref1], voor de schipper en het bemanningslid aan wie, onder verantwoordelijkheid van de
      schipper het beheer van de medische uitrusting is overgedragen, op vissersvaartuigen in onbeperkt vaargebied worden
      volstaan met het bezit van het certificaat medische eerste hulp aan boord, genoemd in [artikel 47][ref2].

      3 Bij regeling van Onze Minister kunnen nadere eisen worden gesteld ten aanzien van de bekwaamheid van de in het
      eerste lid genoemde arts.


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0012790#Artikel47
