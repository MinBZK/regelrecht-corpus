  - number: '68'
    text: |-
      1 De kosten van een geneeskundig onderzoek, heronderzoek of specialistisch deelonderzoek als bedoeld in de
      [artikelen 40][ref1] en [42 van de wet][ref2] komen voor rekening van de scheepsbeheerder of werkgever.

      2 Voor zover er geen scheepsbeheerder of werkgever is aan te wijzen worden de kosten, bedoeld in het eerste lid,
      gedragen door degene die opdracht heeft gegeven voor het onderzoek.

      3 De kosten van een geneeskundig onderzoek of specialistisch deelonderzoek als bedoeld in
      [artikel 23, tweede lid, van de wet][ref3] worden door het Rijk gedragen.

      4 De kosten van een heronderzoek of een aanvullend specialistisch deelonderzoek, bedoeld in de [artikelen 40][ref4]
      en [42 van de wet][ref5] worden gedragen door het Rijk, voor zover zij naar het oordeel van Onze Minister
      redelijkerwijs niet voor rekening van de gekeurde behoren te komen.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel40
