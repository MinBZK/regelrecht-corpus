  - number: '78'
    text: >-
      Bij regeling van Onze Minister kunnen, ter uitvoering van Verdragen of van besluiten van volkenrechtelijke
      organisaties, nadere regels worden gesteld met betrekking tot de in dit besluit geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0012790/2014-05-03#Artikel78
  - number: '79'
    text: |-
      Certificaten sloepsgast die zijn afgegeven op grond van [artikel 45][ref1] van dit besluit, zoals dat luidde voor
      het tijdstip waarop artikel II, onderdeel D, van het besluit van 31 maart 2014, houdende wijziging van algemene
      maatregelen van bestuur op het terrein van de scheepvaart in verband met de implementatie van de wijziging van de
      bijlage bij het STCW-Verdrag en de STCW-Code en van richtlijn 2012/35/EU en enige andere onderwerpen op het terrein
      van de zeevaartbemanning (Stb. 150), in werking treedt, behouden hun geldigheid en worden voor de toepassing van
      dit besluit gelijkgesteld aan het in de [artikelen 25, onderdeel c][ref2], [30, onderdeel c][ref3], en 45, genoemde
      certificaat reddingmiddelen.


