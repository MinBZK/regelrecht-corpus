        artikel: '2'
  - number: '43'
    text: |-
      1 Voor de afgifte van het certificaat radarnavigator heeft de aanvrager met goed gevolg examen afgelegd ter
      afsluiting van een door Onze Minister erkende opleiding en training die voldoet aan:

      - sectie A-II/2 van de STCW-Code, en
      - sectie B-1/12, de paragrafen 18 tot en met 35 van de STCW-Code.

      2 Voor de afgifte van het certificaat radarwaarnemer heeft de aanvrager met goed gevolg examen afgelegd ter
      afsluiting van een door Onze Minister erkende opleiding en training die voldoet aan:

      sectie A-II/1 van de STCW-Code, en

      sectie B-1/12, de paragrafen 2 tot en met 17 van de STCW-Code.
    url: https://wetten.overheid.nl/BWBR0012790/2014-05-03#Artikel43
  - number: '44'
    text: >-
      Voor het verkrijgen van het certificaat basis veiligheidstraining vissersvaartuigen is met goed gevolg een door
      Onze Minister erkende opleiding afgerond die ten minste de volgende onderdelen omvat:


      1. persoonlijke overlevingstechnieken inclusief het gebruik van reddingsgordels en overlevingspakken;


      2. brandbescherming en brandbestrijding;


      3. noodprocedures;


      4. de beginselen van eerste hulp bij ongevallen;


      5. voorkoming van verontreiniging op zee; en


      6. voorkoming van ongevallen aan boord.
    url: https://wetten.overheid.nl/BWBR0012790/2014-05-03#Artikel44
  - number: '45'
    text: |-
      Voor het verkrijgen van het certificaat reddingmiddelen is met goed gevolg een door Onze Minister erkende opleiding
      en training afgerond die voldoet aan:

      - voorschrift VI/2, paragraaf 1, van de bijlage bij het STCW Verdrag, en
      - sectie A-VI/2, paragraaf 1 tot en met 4 van de STCW-Code.
    url: https://wetten.overheid.nl/BWBR0012790/2014-05-03#Artikel45
  - number: '47'
    text: >-
      Bij regeling van Onze Minister worden de beroepsvereisten vastgesteld voor de verkrijging van het certificaat
      medische eerste hulp aan boord en van het certificaat medische zorg aan boord.
    url: https://wetten.overheid.nl/BWBR0012790/2014-05-03#Artikel47
  - number: '48'
    text: >-
      Voor het verkrijgen van het diploma als scheepskok heeft de aanvrager:


      1. met goed gevolg een door Onze Minister erkende opleiding en training afgerond die tenminste de volgende aspecten
      bevat:


      a. het bereiden van maaltijden;


      b. het bakken van brood;


      c. het behandelen van vlees


      d. de kennis van de voedingswaarden van voedingsmiddelen;


      e. het opstellen van goed samengestelde en gevarieerde menu's;


      f. behandelen en opbergen van levensmiddelen;


      g. kennis van hygiëne met betrekking tot de kombuis;


      h. kennis van proviand administratie;


      i kennis van buitenlandse maten en gewichten; en


      2. een diensttijd behaald van ten minste 6 maanden in de kombuis van een zeeschip, waar de kok bij diens
      werkzaamheden werd bijgestaan.


      3. in afwijking van het eerste en tweede lid kan het Hoofd van de Scheepvaart-inspectie een diploma als scheepskok
      afgeven aan een aanvrager die aantoont dat hij op 1 augustus 1986 als scheepskok voer of als zodanig bij een
      rederij in dienst was en gedurende de daaraan voorafgaande periode een dienstverband van tenminste drie jaren als
      scheepskok heeft gehad met een Nederlandse zeewerkgever, en op die datum 23 jaar of ouder was.
    url: https://wetten.overheid.nl/BWBR0012790/2014-05-03#Artikel48
  - number: '49'
    text: |-
      1 Bij regeling van Onze Minister wordt het model van de monsterrol vastgesteld.

      2 Op de monsterrol worden naast de gegevens, genoemd in [artikel 33 van de wet][ref1], voor ieder bemanningslid
      aangetekend:

      a. de plaats en de dag van aanmonstering en de plaats en de dag van afmonstering;

      b. de geboortedatum;

      c. het nummer van het monsterboekje;

      d. de naam en roepletters van het vissersvaartuig

      3 Bij regeling van Onze Minister kan worden bepaald dat andere gegevens in de monsterrol worden vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel33
    url: https://wetten.overheid.nl/BWBR0012790/2014-05-03#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '33'
  - number: '50'
    text: |-
      1 Alvorens een schip voor de eerste maal naar zee vertrekt en vervolgens met tussenpozen van niet meer dan twaalf
      maanden wordt een monsterrol opgemaakt.

      2 Bij elke wijziging in de bemanningssamenstelling wordt een monsterrol opgemaakt.

      3 Ter uitvoering van het gestelde in [artikel 34, eerste lid, onderdeel d, van de wet][ref1] zendt de kapitein
      binnen een week na het opmaken, dan wel in de eerstvolgende haven de monsterrol aan de scheepsbeheerder.

      4 De scheepsbeheerder houdt aantekening van de datum van ontvangst van monsterrollen.

      5 De opgemaakte monsterrollen worden ten kantore van de scheepsbeheerder in Nederland bewaard en ter beschikking
      gehouden ten behoeve van het houden van toezicht door de bij besluit van Onze Minister aangewezen ambtenaren van de
      Inspectie Verkeer en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel34
    url: https://wetten.overheid.nl/BWBR0012790/2014-05-03#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '34'
  - number: '51'
    text: >-
      De scheepsbeheerder stelt Onze Minister telkenmale schriftelijk in kennis van het feit dat hij van de kapitein een
      opgemaakte monsterrol heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0012790/2014-05-03#Artikel51
  - number: '52'
    text: >-
      De scheepsbeheerder bewaart een monsterrol, nadat zij is vervangen of nadat de geldigheidsduur is verstreken,
      gedurende drie jaren na de vervangingsdatum of geldigheidsdatum.
    url: https://wetten.overheid.nl/BWBR0012790/2014-05-03#Artikel52
  - number: '53'
    text: >-
      1 Onze Minister geeft een monsterboekje af aan degene die bij de aanvraag voldoet aan het bepaalde in het tweede
      lid.


      2 Voor de afgifte van een monsterboekje komt uitsluitend in aanmerking:


      a. degene die aantoont dat met een scheepsbeheerder of zeewerkgever een arbeidsovereenkomst voor de vaart ter zee
      is aangegaan of zal worden aangegaan dan wel degene die een schriftelijke maatschapsovereenkomst in het kader van
      de zeevisserij heeft aangegaan of zal aangaan;


      b. degene die aantoont een opleiding te volgen voor een beroep waarvoor een vaarbevoegdheidsbewijs vereist is;


      c. degene die behoort tot een andere, door Onze Minister aan te wijzen categorie personen, of


      d. degene die het monsterboekje naar het oordeel van Onze Minister ten behoeve van zijn beroepsuitoefening nodig
      heeft.
    url: https://wetten.overheid.nl/BWBR0012790/2014-05-03#Artikel53
  - number: '54'
    text: |-
      1 Bij het verzoek om afgifte van een monsterboekje worden de volgende bescheiden overgelegd:

      a. een geldig paspoort of ander geldig nationaliteitsbewijs van de houder;

      b. twee identieke, recente, goedgelijkende pasfoto's van de aanvrager, zo mogelijk zonder hoofddeksel, van
      ongeveer 4 cm hoogte en 3 cm breedte, zodanig dat de afbeelding voor ongeveer drievierde de ene gelaatshelft en
      voor ongeveer éénvierde de andere weergeeft; de pasfoto's vertonen geen beschadigingen en zijn aan de achterzijde
      voorzien van de naam van de aanvrager;

      c. een niet langer dan 6 maanden voor de aanvraag afgegeven, de aanvrager betreffend gewaarmerkt afschrift van de
      benodigde gegevens uit de basisregistratie personen;

      d. de bewijsstukken, waardoor wordt aangetoond dat de aanvrager aan [artikel 53][ref1] voldoet;

      e. zo nodig aanvullende informatie, die nodig is om de gegevens, bedoeld in [artikel 55, eerste lid][ref2], in het
      monsterboekje te kunnen opnemen.

      2 De aanvraag wordt niet in behandeling genomen dan nadat de kosten voor de afgifte van het monsterboekje zijn
      voldaan.

      3 In plaats van de in het eerste lid, onderdeel a, genoemde documenten kunnen daarvan kopieën worden overgelegd,
      die door de ambtenaar van de afdeling bevolking van de gemeente waar de aanvrager is ingeschreven zijn gewaarmerkt
      of door een andere door Onze Minister geaccepteerde autoriteit.

      4 In plaats van het in het eerste lid, onderdeel c, genoemde afschrift kan, indien de aanvrager zijn hoofdverblijf
      niet in Nederland heeft, worden volstaan met documenten die in het land van herkomst gebruikelijk zijn.

      5 Bij ministeriële regeling wordt de wijze van afgifte van het monsterboekje bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0012790#Artikel55
    url: https://wetten.overheid.nl/BWBR0012790/2014-05-03#Artikel54
