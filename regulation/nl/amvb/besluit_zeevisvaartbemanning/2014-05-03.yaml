      1 Certificaten scheepsgezondheidszorg B die zijn afgegeven op grond van [artikel 47, eerste lid][ref1], van
      dit besluit, zoals dat luidde voor het tijdstip waarop artikel II, onderdeel K, van het in [artikel 79][ref2]
