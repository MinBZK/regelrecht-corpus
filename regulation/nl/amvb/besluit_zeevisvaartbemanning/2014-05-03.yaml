  - number: '2'
    text: Dit besluit is van toepassing aan boord van vissersvaartuigen.
    url: https://wetten.overheid.nl/BWBR0012790/2014-05-03#Artikel2
  - number: '3'
    text: |-
      1 Op verzoek van de scheepsbeheerder kan Onze Minister ontheffing verlenen van de verplichting om het
      vissersvaartuig te bemannen in overeenstemming met [hoofdstuk 3][ref1], zoals vermeld op het bemanningscertificaat,
      indien blijkt dat:

      a. korte tijd voor het vertrek van het vissersvaartuig uit de haven een of meer leden van de bemanning niet
      beschikbaar zijn;

      b. dringende omstandigheden ertoe nopen het vertrek niet langer uit te stellen, en

      c. met de aan boord aanwezige bemanning, gelet op de bijzonderheden van de reis, het vissersvaartuig zonder gevaar
      voor het vaartuig of andere zaken, voor personen, het milieu of de scheepvaart deze reis kan ondernemen.

      2 Op verzoek van de scheepsbeheerder kan Onze Minister een ontheffing als bedoeld in [artikel 25 van de wet][ref2]
      verlenen, indien:

      a. er onvoldoende bemanningsleden voorhanden zijn in het bezit van de vereiste kwalificaties,

      b. de ontheffing verleend wordt aan een bemanningslid dat in het bezit is van het vaarbevoegdheidsbewijs dat
      vereist is voor de relevante lagere functie, en

      c. met de aan boord aanwezige bemanning, gelet op de bijzonderheden van de reis, het vissersvaartuig zonder gevaar
      voor het vaartuig of andere zaken, voor personen, het milieu of de scheepvaart deze reis kan ondernemen.

      3 Een ontheffing als bedoeld in [artikel 25 van de wet][ref3] wordt voor de functie van schipper of
      hoofdwerktuigkundige slechts gegeven in zeer bijzondere omstandigheden die niet het gevolg zijn van het handelen
      of het nalaten van handelen van de zijde van de scheepsbeheerder en indien de vervulling gedurende korte tijd van
      die functie door een bemanningslid met een lagere bevoegdheid noodzakelijk is voor de voortzetting van de reis, en
      de veiligheid van het vissersvaartuig en de opvarenden, de veilige vaart ter zee en de bescherming van het mariene
      milieu gewaarborgd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0009124#Artikel25
