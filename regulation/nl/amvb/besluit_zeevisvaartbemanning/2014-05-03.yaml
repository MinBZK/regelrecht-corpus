  - number: '60'
    text: |-
      1 Alle bemanningsleden aan boord van Nederlandse schepen zijn voorzien van een geldige geneeskundige verklaring
      zeevaart.

      2 Een bemanningslid dat aan boord met een wachtfunctie is belast, is bovendien voorzien van een verklaring
      dat dit lid voldoet aan de medische eisen betreffende het gezichtsorgaan en het gehoor, bedoeld in
      [artikel 62, eerste lid, tweede volzin][ref1].

      3 Het model voor de verklaringen, bedoeld in het eerste en tweede lid, wordt door Onze Minister vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel62
    url: https://wetten.overheid.nl/BWBR0012790/2014-05-03#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0012790
        artikel: '62'
        hoofdstuk: '7'
  - number: '61'
    text: |-
      1 Ten behoeve van de afgifte van een in [artikel 60][ref1] genoemde geneeskundige verklaring worden de
      bemanningsleden aan een daarop gericht medisch onderzoek onderworpen door een door Onze Minister daartoe als
      keuringsarts aangewezen geneeskundige.

      2 Indien de keuringsarts twijfels heeft omtrent de medische geschiktheid dan wel wanneer in de medische eisen,
      bedoeld in [artikel 62, eerste lid][ref2], een specialistisch rapport is vereist, verwijst deze arts de keurling
      voor deelonderzoek door naar een specialist.

      3 Een geneeskundige verklaring zeevaart wordt afgegeven door een keuringsarts die heeft vastgesteld dat de keurling
      voldoet aan de voor die verklaring van toepassing zijnde medische eisen, bedoeld in [artikel 62, eerste lid][ref3].

      4 Indien de gekeurde gebruik wenst te maken van zijn recht om opnieuw te worden onderzocht, wordt hij onderzocht
      door een ingevolge [artikel 42, eerste lid, van de wet][ref4] als scheidsrechter aangewezen geneeskundige.

      5 De in dit besluit bedoelde onderzoeken worden verricht door geneeskundigen die niet de behandelend arts of
      specialist van de keurling zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0012790#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0012790#Artikel62
      [ref4]: https://wetten.overheid.nl/BWBR0009124#Artikel42
