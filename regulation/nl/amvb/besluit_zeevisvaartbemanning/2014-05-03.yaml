        artikel: '45'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '18'
    text: >-
      Bij regeling van Onze Minister kunnen de volgende, nader te omschrijven aanvullingen, beperkingen of
      vaargebieden op vaarbevoegdheidsbewijzen voor de zeevisvaart worden aangebracht: de beperking in vaargebied,
      voortstuwingsvermogen, lengte, al dan niet in combinatie met een bepaald soort vissersvaartuigen.
    url: https://wetten.overheid.nl/BWBR0012790/2014-05-03#Artikel18
  - number: '19'
    text: >-
      1 Tenzij uitdrukkelijk anders is bepaald wordt de ervaring of diensttijd behaald aan boord van vissersvaartuigen,
      na de verkrijging van de bevoegdheid om tenminste als stuurman-werktuigkundige aan boord van een vissersvaartuig
      dienst te doen.


      2 Bij regeling van Onze Minister wordt bepaald welke ervaring, niet opgedaan aan boord van vissersvaartuigen, in
      aanmerking wordt genomen.
    url: https://wetten.overheid.nl/BWBR0012790/2014-05-03#Artikel19
  - number: '20'
    text: Een vaarbevoegdheidsbewijs voor de zeevisvaart is geldig tot ten hoogste vijf jaar na de datum van afgifte.
    url: https://wetten.overheid.nl/BWBR0012790/2014-05-03#Artikel20
  - number: '21'
    text: >-
      1 Een vaarbevoegdheidsbewijs wordt afgegeven indien de aanvrager aantoont te voldoen aan de ingevolge dit besluit
      vereiste beroepsvereisten, ervaring en medische geschiktheid.


      2 Een vaarbevoegdheidsbewijs kan vernieuwd worden, indien de houder in de periode van vijf jaar voorafgaand aan
      de datum van de aanvraag tot vernieuwing ten minste 12 maanden heeft dienstgedaan in een naar het oordeel van Onze
      Minister relevante functie waarvoor een vaarbevoegdheid is vereist en die door de houder op grond van de aan hem
      toegekende vaarbevoegdheden mocht worden vervuld, dan wel in een andere, naar het oordeel van Onze Minister daarmee
      vergelijkbare functie.


      3 In het geval, genoemd in het tweede lid, wordt het vaarbevoegdheidsbewijs dat is vernieuwd ingenomen of zonodig
      ongeldig gemaakt.


      4 Een vaarbevoegdheidsbewijs, dat door verloop van de geldigheidsduur ongeldig is geworden, en dat niet op grond
      van het tweede lid kan worden vernieuwd, wordt op verzoek vernieuwd indien de aanvrager direct voorafgaande aan
      de aanvraag:


      a. een daartoe door Onze Minister erkende opleiding heeft gevolgd en met succes heeft afgesloten;


      b. gedurende drie maanden in een naar het oordeel van Onze Minister relevante functie boven de sterkte heeft
      gevaren, of


      c. op grond van een ontheffing, gedurende ten minste drie maanden in een naar het oordeel van Onze Minister
      relevante, maar lagere functie heeft gevaren dan waarvoor zijn ongeldig geworden vaarbevoegdheidsbewijs gold.


      5 Een vaarbevoegdheidsbewijs dat verloren is gegaan kan worden vervangen door een duplicaat vaarbevoegdheidsbewijs,
      waarvan de einddatum overeenkomt met de einddatum van het originele document.


      6 Indien de aanvrager van een duplicaat aanspraak kan maken op vernieuwing van het vaarbevoegdheidsbewijs, wordt
      hem desgevraagd met inachtneming van het tweede lid een nieuw vaarbevoegdheidsbewijs afgegeven.


      7 Het vierde lid is van overeenkomstige toepassing indien de eerste aanvraag van een vaarbevoegdheidsbewijs niet is
      ingediend binnen vier jaar na de datum waarop het kennisbewijs van de opleiding is afgegeven.


      8 De kosten van de afgifte van een vaarbevoegdheidsbewijs of een duplicaat vaarbevoegdheidsbewijs worden bij de
      aanvraag voldaan.


      9 Onze Minister kan nadere regels stellen omtrent de eerste afgifte van vaarbevoegdheidsbewijzen voor de
      zeevisvaart.
    url: https://wetten.overheid.nl/BWBR0012790/2014-05-03#Artikel21
  - number: '22'
    text: >-
      1 Onze Minister kan een vaarbevoegdheidsbewijs, diploma of certificaat dat is afgegeven door een bevoegde
      autoriteit van een staat, niet zijnde een Lidstaat van de Europese Unie, een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland erkennen, indien de beroepsvereisten, de
      wijze van opleiding en examinering en de opgedane ervaring tenminste gelijkwaardig zijn aan die in Nederland.


      2 Indien een vaarbevoegdheidsbewijs, diploma of certificaat wordt erkend als gelijkwaardig aan een Nederlands
      vaarbevoegdheidsbewijs, wordt aan de aanvrager het overeenkomstige Nederlandse vaarbevoegdheidsbewijs afgegeven.


      3 Voor de afgifte van een vaarbevoegdheidsbewijs als schipper zeevisvaart of plaatsvervangend schipper zeevisvaart,
      legt de aanvrager het bewijs over dat hij de door Onze Minister erkende opleidingsmodule wetgeving met gunstig
      gevolg heeft afgesloten.
    url: https://wetten.overheid.nl/BWBR0012790/2014-05-03#Artikel22
  - number: '24'
    text: >-
      1 De kennisbewijzen voor de afgifte van een vaarbevoegdheidsbewijs om daarmee dienst te doen aan boord van
      vissersvaartuigen in de functie van schipper, plaatsvervangend schipper, stuurman-werktuigkundige, stuurman
      zeevisvaart of werktuigkundige zeevisvaart zijn in neerdalende lijn:


      a. stuurman-werktuigkundige voor de zeevisvaart SW 4;


      b. stuurman voor de zeevisvaart S 4 of S IV-v, respectievelijk werktuigkundige voor de zeevisvaart W 4 of W IV-v;


      c. stuurman-werktuigkundige voor de zeevisvaart SW 5;


      d. stuurman-werktuigkundige voor de zeevisvaart SW 6.


      2 De diploma's als bedoeld in de Wet op de zeevischvaartdiploma's, Stb. 1935, 455 voor de afgifte van een
      vaarbevoegdheidsbewijs om daarmee dienst te doen aan boord van vissersvaartuigen in de functie van schipper,
      plaatsvervangend schipper, stuurman-werktuigkundige, stuurman zeevisvaart of werktuigkundige zeevisvaart zijn in
      neerdalende lijn:


      a. het diploma voor de zeevisvaart S IV-v;


      b. het diploma voor de zeevisvaart W IV-v;


      c. het diploma voor de zeevisvaart SW V;


      d. het diploma voor de zeevisvaart SW VI.


      3 Met het diploma voor de zeevisvaart S IV-v wordt in deze paragraaf gelijkgesteld: het diploma als stuurman voor
      de zeevisvaart tezamen met het aanvullingsdiploma voor de zeevisvaart;


      4 Met het diploma voor de zeevisvaart SW V wordt in deze paragraaf gelijkgesteld het diploma als stuurman voor
      de zeevisvaart;


      5 Met het diploma voor de zeevisvaart W IV-v worden, in deze paragraaf, uitsluitend voor een functie als
      werktuigkundige aan boord van vissersvaartuigen, gelijkgesteld het diploma als motordrijver voor de zeevisvaart
      alsmede het diploma als motordrijver, of een diploma van een hogere rangorde, uitgereikt krachtens de Wet op de
      zeevaartdiploma's.
    url: https://wetten.overheid.nl/BWBR0012790/2014-05-03#Artikel24
  - number: '25'
    text: >-
      Voor de afgifte van een vaarbevoegdheidsbewijs als schipper zeevisvaart aan boord van vissersvaartuigen op reizen
      in onbeperkt vaargebied, is ten minste vereist:


      a. het kennisbewijs stuurman-werktuigkundige zeevisvaart SW4, het kennisbewijs stuurman voor de zeevisvaart S 4 dan
      wel het diploma voor de zeevisvaart S IV-v;


      b. het algemeen certificaat maritieme radiocommunicatie,


      c. het certificaat reddingmiddelen;


      d. het certificaat radarnavigator, en


      e. een diensttijd van 36 maanden aan boord van vissersvaartuigen met een lengte van 24 meter of meer, waarvan
      tenminste 12 maanden als plaatsvervangend schipper.
