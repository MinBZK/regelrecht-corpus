  - number: '55'
    text: |-
      1 Alvorens het monsterboekje af te geven tekent Onze Minister in elk geval de volgende gegevens erin aan:

      a. van de houder:

      1°. naam en voornamen;

      2°. plaats en datum van geboorte;

      3°. nationaliteit, en

      4°. het waladres of het adres in noodgevallen;

      b. de plaats en datum van afgifte;

      c. de datum, waarop de geldigheid vervalt.

      2 Voorts bevat het monsterboekje:

      a. een pasfoto als bedoeld in [artikel 54, eerste lid, onderdeel b][ref1];

      b. de handtekening van de houder.

      3 De gegevens, genoemd in het eerste en het tweede lid, met uitzondering van de gegevens, genoemd in het eerste
      lid, onderdeel a ten 4°, worden niet gewijzigd.

      4 Een monsterboekje is slechts geldig indien het de handtekening van de houder bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel54
    url: https://wetten.overheid.nl/BWBR0012790/2014-05-03#Artikel55
