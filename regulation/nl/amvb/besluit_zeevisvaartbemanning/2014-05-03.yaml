  - number: '75'
    text: |-
      1 Aan boord van een vissersvaartuig waarvan de voorgeschreven bemanning uit meer dan 9 personen bestaat, moet
      daarboven een gediplomeerde scheepskok belast zijn met de bereiding van de voeding.

      2 Onder een gediplomeerde scheepskok wordt verstaan een persoon van 18 jaar of ouder in het bezit van een door de
      Minister erkend diploma als scheepskok als bedoeld in [artikel 48][ref1].

      3 Onze Minister kan diploma's, door bevoegde autoriteiten in andere landen afgegeven op grond van het Verdrag
      betreffende het diploma van bekwaamheid als scheepskok, 1946 als gelijkwaardig aan Nederlandse diploma's erkennen.

      4 Onze Minister kan op een daartoe strekkend verzoek van de scheepsbeheerder voor een bepaalde tijd ontheffing
      van het in het eerste lid bepaalde met betrekking tot het gediplomeerd zijn van de scheepskok, indien er naar zijn
      redelijk oordeel een onvoldoend aantal gediplomeerde scheepskoks ter beschikking staat.

      5 Aan een in het vijfde lid bedoelde ontheffing kunnen voorschriften worden verbonden. Indien de voorschriften niet
      worden nageleefd kan Onze Minister een verleende ontheffing tussentijds intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel48
