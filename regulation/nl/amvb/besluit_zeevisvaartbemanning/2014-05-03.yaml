  - number: '62'
    text: |-
      1 Bij regeling van Onze Minister worden de medische eisen vastgesteld waaraan de keurling moet voldoen om in
      aanmerking te komen voor de geneeskundige verklaring, bedoeld in [artikel 60][ref1]. Daarbij worden tevens de
      medische eisen betreffende het gezichtsorgaan en het gehoor vastgesteld voor bemanningsleden die aan boord een
      wachtfunctie vervullen.

      2 Bij regeling van Onze Minister worden de procedures en andere voorschriften vastgesteld die in acht worden
      genomen bij elk van de onderzoeken, bedoeld in [artikel 61][ref2].

      3 Bij de vaststelling van medische eisen wordt bepaald ten aanzien van welke nieuwe medische eisen een ontheffing
      als bedoeld in [artikel 44, derde lid, van de wet][ref3] kan worden verleend.

      4 In afwijking van het vereiste in het eerste lid kan de Medisch Adviseur Scheepvaart aan een keurling ontheffing
      verlenen van een van de medische eisen indien naar zijn mening het niet voldoen aan die medische eis de veiligheid
      niet nadelig beïnvloedt.


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0012790#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0009124#Artikel44
