        bwb_id: BWBR0007625
  - number: '40'
    text: |-
      Voor het verkrijgen van het kennisbewijs stuurman-werktuigkundige voor de zeevisvaart SW 5 heeft betrokkene:

      1. met goed gevolg examen afgelegd ter afsluiting van een opleiding die ten minste voldoet aan de syllabus
      opgenomen in [Bijlage I][ref1];

      2. deelgenomen aan een goedgekeurde cursus basis veiligheidstraining vissersvaartuigen; en

      3. een goedgekeurde stage aan boord van vissersvaartuigen van ten minste één jaar als onderdeel van vorenbedoelde
      opleiding vervuld, onder het bijhouden van een goedgekeurd stageboek, of anders een goedgekeurde diensttijd van
      ten minste 24 maanden aan boord van vissersvaartuigen, en heeft gedurende deze stage of diensttijd buitengaats
      wachtdienst op de brug gelopen onder toezicht van de schipper of van een daartoe bevoegd bemanningslid, gedurende
      een periode van ten minste zes maanden, en heeft gedurende ten minste zes maanden dienstgedaan in de machinekamer.


      [ref1]: https://wetten.overheid.nl/BWBR0012790
    url: https://wetten.overheid.nl/BWBR0012790/2014-05-03#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0012790
  - number: '41'
    text: |-
      Voor het verkrijgen van het kennisbewijs stuurmanwerktuigkundige voor de zeevisvaart SW6 heeft betrokkene:

      1. met goed gevolg examen afgelegd ter afsluiting van een opleiding die ten minste voldoet aan de syllabus
      opgenomen in [Bijlage II][ref1];

      2. deelgenomen aan een goedgekeurde cursus basis veiligheidstraining vissersvaartuigen, en

      3. een goedgekeurde stage aan boord van vissersvaartuigen van ten minste zes maanden als onderdeel van
      vorenbedoelde opleiding vervuld, onder bijhouding van een goedgekeurd stageboek, of anders een goedgekeurde
      diensttijd van ten minste 24 maanden aan boord van zeevisservaartuigen, en heeft gedurende deze stage of diensttijd
      buitengaats wachtdienst op de brug gelopen onder toezicht van de schipper of van een daartoe bevoegd bemanningslid,
      gedurende een periode van ten minste drie maanden, en heeft gedurende ten minste drie maanden dienstgedaan in de
      machinekamer.


      [ref1]: https://wetten.overheid.nl/BWBR0012790
    url: https://wetten.overheid.nl/BWBR0012790/2014-05-03#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0012790
  - number: '42'
    text: |-
      1 Voor het verkrijgen van het kennisbewijs stuurman zeevisvaart S IV-v is de betrokkene in het
      bezit van het kennisbewijs stuurman-werktuigkundige voor de zeevisvaart SW V en heeft hij met goed
      gevolg examen afgelegd ter verkrijging van de verklaring voor de zeevisvaart S IV-v als bedoeld in
      [artikel 2, onderdeel d, van het Examenreglement zeevisvaart][ref1].

      2 Voor het verkrijgen van het kennisbewijs werktuigkundige zeevisvaart W IV-v is de betrokkene in het bezit van
      het kennisbewijs stuurman-werktuigkundige voor de zeevisvaart SW V en heeft hij met goed gevolg examen afgelegd
      ter afsluiting van een opleiding die ten minste voldoet aan de eisen ter verkrijging van de verklaring voor de
      zeevisvaart W IV-v» als bedoeld in [artikel 2, onderdeel e, van het Examenreglement zeevisvaart][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003996#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003996#Artikel2
