    text: |-
      Voor het verkrijgen van de kennisbewijzen stuurman-werktuigkundige voor de zeevisvaart SW 4, respectievelijk
      stuurman voor de zeevisvaart S 4 of werktuigkundige voor de zeevisvaart W 4 is betrokkene opgeleid overeenkomstig
      een kwalificatiedossier als bedoeld in de [Wet educatie en beroepsonderwijs][ref1] dat voor de beroepsopleiding
      Visserij officier is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
