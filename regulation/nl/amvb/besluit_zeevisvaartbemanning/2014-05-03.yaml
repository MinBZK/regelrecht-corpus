  - number: '64'
    text: >-
      1 De keuringsarts kan de gekeurde tijdelijk of blijvend ongeschikt voor de zeevaart verklaren.


      2 De gekeurde is:


      a. tijdelijk ongeschikt, indien op medische gronden wordt verwacht dat hij niet langer dan drie jaren voor de
      zeevaart ongeschikt zal zijn;


      b. blijvend ongeschikt, indien op medische gronden wordt verwacht dat hij langer dan drie jaren voor de zeevaart
      ongeschikt zal zijn.
    url: https://wetten.overheid.nl/BWBR0012790/2014-05-03#Artikel64
  - number: '65'
    text: |-
      De keuringsarts die het onderzoek uitvoert, neemt de in [artikel 62, eerste lid][ref1], bedoelde medische eisen, de
      in [artikel 62, tweede lid][ref2], bedoelde procedures en andere voorschriften, alsook voorzover van toepassing, de
      [artikelen 63][ref3] en [64][ref4] in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel62
