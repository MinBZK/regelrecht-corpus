  - number: '16'
    text: >-
      Bij regeling van Onze Minister kan aanvulling van het aantal bemanningsleden worden voorgeschreven indien de
      inrichting, de uitrusting, de lengte, het voortstuwingsvermogen, de wijze van voortstuwing of de bestemming van het
      vissersvaartuig hem daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0012790/2014-05-03#Artikel16
  - number: '17'
    text: |-
      1 Aan boord van elk vissersvaartuig is een voldoende aantal geoefende bemanningsleden om de groepsreddingmiddelen
      en de tewaterlatingsvoorzieningen, die vereist zijn om alle opvarenden in geval van nood te ontschepen, te
      bedienen.

      2 Over elke te gebruiken reddingboot heeft een zeevarende, in het bezit van het certificaat, bedoeld in
      [artikel 45][ref1] de leiding; tevens is een plaatsvervanger, in het bezit van dit certificaat, aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel45
    url: https://wetten.overheid.nl/BWBR0012790/2014-05-03#Artikel17
    references:
