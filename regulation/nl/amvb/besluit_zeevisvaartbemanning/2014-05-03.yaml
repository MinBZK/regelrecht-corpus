      van bekendheid met de bepalingen ter voorkoming van aanvaringen op zee, dan wel aan de houder van het Bewijs van
      bekendheid met de Bepalingen ter Voorkoming van Aanvaringen op Zee S VII.
    url: https://wetten.overheid.nl/BWBR0012790/2014-05-03#Artikel38
