  - number: '72'
    text: |-
      1 Bemanningsleden aan wie in de alarmrol van het vissersvaartuig een veiligheidstaak wordt opgedragen dan wel een
      taak ten aanzien van het voorkomen van verontreiniging van de zee hebben, zijn in het bezit van een certificaat
      waaruit blijkt dat zij met goed gevolg een door Onze Minister erkende training en opleiding «basis veiligheid» als
      bedoeld in [artikel 44][ref1] hebben gevolgd.

      2 Voor bemanningsleden met de functie van ten minste stuurman zeevisvaart, werktuigkundige zeevisvaart of stuurman-
      werktuigkundige, geldt het geldige vaarbevoegdheidsbewijs als het certificaat, bedoeld in het eerste lid.

      3 Overige bemanningsleden, die niet vallen onder het eerste of tweede lid, krijgen voordat zij hun taken aan boord
      beginnen voldoende informatie en instructie ten einde:

      a. met de overige opvarenden over elementaire veiligheidszaken te kunnen spreken, begrip te hebben van de
      veiligheidssymbolen en de alarmseinen te kennen;

      b. te weten wat te doen indien: – iemand over boord valt; vuur of rook wordt ontdekt; het sein «brandalarm» of
      «schip verlaten» wordt gegeven;

      c. te weten waar de reddingsgordels zich bevinden en hoe deze om te doen;

      d. alarm te slaan en bekend te zijn met het gebruik van handbrandblussers;

      e. te weten wat te doen bij een ongeluk voordat hulp wordt ingeroepen;

      f. de brand- en waterdichte deuren, met uitzondering van die ter afsluiting van openingen in de romp, te kunnen
      sluiten en openen.


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel44
