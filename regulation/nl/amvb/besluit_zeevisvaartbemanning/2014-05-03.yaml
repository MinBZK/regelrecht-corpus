articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. lengte: de lengte van een vissersvaartuig die gelijk is aan 96 procent van de lengte van de lastlijn op 85
      procent van de kleinste holte naar de mal gemeten vanaf de bovenzijde van de kielplaat, dan wel gelijk aan de
      lengte van de voorzijde van de voorsteven tot aan de hartlijn van de roerkoning gemeten op deze lastlijn, indien
      deze laatste lengte groter is. Bij vissersvaartuigen die met een stuurlast zijn ontworpen moet de lastlijn waarop
      deze lengte gemeten wordt, evenwijdig aan de constructiewaterlijn worden genomen.

      b. voortstuwingsvermogen: het maximale vermogen, uitgedrukt in kiloWatt (kW), dat door de voortstuwingsmachines
      zonder overbelasting gedurende onbeperkte tijdsduur kan worden geleverd, zoals dat vermeld staat op het
      bemanningscertificaat.

      c. vaargebied Ia: het gebied omvattende alle wateren tot 15 zeemijlen uit de Franse, Belgische, Nederlandse en
      Duitse kust, in het zuiden begrensd door de lijn Calais-Dover, in het oosten door de meridiaan van 8° Oosterlengte;

      d. vaargebied I: het gebied omvattende alle wateren tot 30 zeemijlen uit de Franse, Belgische, Nederlandse, Duitse
      en Deense westkust, in het zuiden begrensd door de lijn Calais-Dover, in het noorden door de parallel van 57°
      Noorderbreedte;

      e. vaargebied II: het gebied omvattende de Noordzee tot de 62e Noorderbreedtegraad tot de lijn die het punt, op
      62° Noorderbreedte en 1° Westerlengte verbindt met Strathie Point (noordkust Schotland), het Kanaal, het Kanaal
      van Bristol, het St. George Kanaal en de Ierse Zee in het zuiden tot de lijn die Kaap St. Mathieu verbindt met Old
      Head of Kinsale (zuidkust Ierland) en in het noorden tot de lijn van Inishowen Head naar Islay (Ardmore Point),
      van Islay (Rhuda Mail) langs de oostkust van Colonsay naar Mull (Loch Buie) en van Mull (Java Point) naar Schotland
      (Barony Point), en de Oostzee;

      f. schipper: een persoon met de vaarbevoegdheid als schipper zeevisvaart;

      g. plaatsvervangend schipper: een persoon met de vaarbevoegdheid als plaatsvervangend schipper zeevisvaart;

      h. stuurman-werktuigkundige: een persoon met de vaarbevoegdheid als stuurman-werktuigkundige zeevisvaart;

      i. kennisbewijs: het diploma of certificaat afgegeven door een instelling als bedoeld in de
      [Wet educatie en beroepsonderwijs (Web)][ref1] dan wel een getuigschrift of verklaring afgegeven door een
      instelling als bedoeld in de [Wet Hoger onderwijs en wetenschappelijk onderzoek (WHW)][ref2] of een certificaat
      afgeven door een door de Minister erkende opleiding waaruit blijkt dat een erkende opleiding met goed gevolg is
      afgesloten;

      j. STCW-Verdrag: het op 7 juli 1978 te Londen tot stand gekomen Internationaal Verdrag betreffende de normen voor
      zeevarenden inzake opleiding, diplomering en wachtdienst, 1978 (Trb. 1981, 144);

      k. STCW-Code de Code inzake opleiding, diplomering en wachtdienst van zeevarenden, behorend bij het STCW-Verdrag
      (Trb. 1996, 249);

      l. geneeskundige verklaring: een verklaring als bedoeld in [artikel 60][ref3];

      m. wet: [Wet zeevarenden][ref4].


