  - number: '63'
    text: |-
      1 De geldigheid van een geneeskundige verklaring van geschiktheid voor de zeevaart als bedoeld in
      [artikel 60][ref1] vervalt na verloop van ten hoogste twee jaar na de datum van afgifte ervan.

      2 Op medische gronden kan de keuringsarts een geneeskundige verklaring van geschiktheid voor de zeevaart als
      genoemd in [artikel 60][ref2] afgeven voor een kortere duur dan die, genoemd in het eerste lid.

      3 De keuringsarts kan voorts een geneeskundige verklaring van geschiktheid voor de zeevaart als bedoeld in
      [artikel 60][ref3] afgeven voor een beperkt vaargebied.


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0012790#Artikel60
