  - number: '2'
    text: |-
      Het is verboden te handelen in strijd met de artikelen 3, eerste lid, 4, eerste, tweede en derde lid, 5, eerste,
      tweede lid en derde lid, 7, 10, eerste lid, 11, eerste en negende lid, en 27, eerste, derde en vierde lid, van de
      Verordening producten voor tweeërlei gebruik, voor zover het goederen betreft.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel2
  - number: '3.1'
    text: |-
      Onze Minister is de bevoegde autoriteit, bedoeld in de artikelen 4, eerste en tweede lid, 5, eerste en tweede lid,
      7, 10, eerste lid, 11, eerste en tweede lid, 12, tweede tot en met vijfde lid, zesde lid, onderdeel c, en zevende
      lid, 14, eerste lid, 16, eerste, tweede, derde en vijfde lid, en 21, derde en vierde lid, van de Verordening
      producten voor tweeërlei gebruik.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel3
  - number: '3.2'
    text: |-
      Indien Onze Minister bij beschikking, bedoeld in artikel 4, eerste en tweede lid, van de Verordening producten
      voor tweeërlei gebruik, heeft bepaald dat de uitvoer of de wederuitvoer van de daarbij aangewezen goederen zonder
      vergunning is verboden, is de adressaat van deze beschikking, zodra voor hem aannemelijk is dat de desbetreffende
      goederen een andere bestemming zullen krijgen dan in de beschikking is vermeld, verplicht onder opgave van redenen
      van deze gewijzigde bestemming mededeling te doen aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel3
  - number: '4'
    text: |-
      Bij ministeriële regeling kan Onze Minister om redenen van openbare veiligheid, waaronder het voorkomen van
      terreurdaden, of uit mensenrechtenoverwegingen een verbod instellen op, of een vergunning verplicht stellen voor
      de uitvoer van goederen voor tweeërlei gebruik die niet zijn genoemd in bijlage I van de Verordening producten voor
      tweeërlei gebruik.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel4
  - number: 4a.1
    text: |-
      Onze Minister kan de doorvoer van niet-communautaire goederen voor tweeërlei gebruik verbieden, als deze goederen
      bestemd zijn voor één van de doeleinden, bedoeld in artikel 4, eerste lid, onderdeel a, van de Verordening
      producten voor tweeërlei gebruik. Voordat Onze Minister de doorvoer verbiedt, kan hij een vergunningplicht
      opleggen.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel4a
  - number: 4a.2
    text: |-
      Onze Minister kan besluiten dat een vergunning is vereist voor de overbrenging van producten voor tweeërlei gebruik
      vanuit Nederland naar een andere lidstaat van de Europese Unie indien op het tijdstip van de overbrenging voldaan
      wordt aan de eisen, bedoeld in artikel 11, tweede lid, van de Verordening producten voor tweeërlei gebruik.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel4a
  - number: 4b.1
    text: |-
      Onze Minister verleent een vergunning als bedoeld in artikel 12, eerste lid, onderdelen a, b en c, en tweede lid,
      van de Verordening producten voor tweeërlei gebruik.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel4b
  - number: 4b.2
    text: |-
      Onze Minister kan een vergunning als bedoeld in het eerste lid onder beperkingen verlenen en kan aan een vergunning
      voorschriften en voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel4b
  - number: 4b.3
    text: 'Bij ministeriële regeling worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel4b
  - number: 4b.3.a
    text: de wijze waarop en door wie een vergunning wordt aangevraagd;
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel4b
  - number: 4b.3.b
    text: de aard van de vergunning.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel4b
  - number: 4b.4
    text: |-
      Bij ministeriële regeling kunnen rapportageverplichtingen en registratievoorschriften worden gesteld voor een
      vergunning als bedoeld in artikel 12, eerste lid, onderdeel d, van de Verordening producten voor tweeërlei gebruik.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel4b
  - number: 4b.5
    text: |-
      Het is verboden te handelen in strijd met de voorschriften en voorwaarden die zijn verbonden aan een vergunning,
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel4b
  - number: 4c
    text: |-
      Onze Minister kan een door hem afgegeven vergunning als bedoeld in artikel 12, eerste lid, onderdelen a, b en c, en
      tweede lid, van de Verordening producten voor tweeërlei gebruik, in ieder geval intrekken indien:
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel4c
  - number: 4c.a
    text: de vergunning is verstrekt op grond van onjuiste of onvolledige gegevens of
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel4c
  - number: 4c.b
    text: de voorschriften en voorwaarden van de vergunning niet in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel4c
  - number: '5.1'
    text: |-
      Het is verboden om militaire goederen door te voeren door Nederland zonder individuele of algemene
      doorvoervergunning.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel5
  - number: '5.2'
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel5
  - number: 5.2.a
    text: |-
      de doorvoer door Nederland van militaire goederen die uitsluitend worden vervoerd door de territoriale wateren of
      door het luchtruim;
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel5
  - number: 5.2.b
    text: |-
      de doorvoer door Nederland van militaire goederen die afkomstig zijn uit, of als eindbestemming hebben
      Australië, Japan, Nieuw-Zeeland, Zwitserland, een lidstaat of een van de lidstaten van de Noord-Atlantische
      verdragsorganisatie en die Nederland verlaten met hetzelfde vervoermiddel als waarmee ze zijn binnengekomen zonder
      overlading in Nederland;
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel5
  - number: 5.2.c
    text: |-
      de doorvoer door Nederland van militaire goederen die afkomstig zijn uit, en als eindbestemming hebben een
      lidstaat.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel5
  - number: '5.3'
    text: |-
      Onze Minister kan besluiten dat voor de doorvoer door Nederland van militaire goederen in situaties als bedoeld in
      het tweede lid een vergunning is vereist:
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel5
  - number: 5.3.a
    text: |-
      indien het belang van de internationale rechtsorde of een daarop betrekking hebbende internationale afspraak dat
      vereist of
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel5
  - number: 5.3.b
    text: |-
      indien Onze Minister dit noodzakelijk acht voor de bescherming van de wezenlijke belangen van de nationale
      veiligheid.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel5
  - number: '5.4'
    text: Een vergunning wordt in ieder geval niet verleend voor zover dit voortvloeit uit internationale verplichtingen.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel5
  - number: '6.1'
    text: |-
      Bij ministeriële regeling kan vrijstelling worden verleend van [artikel 5, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024139#Artikel5
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0024139
        artikel: '5'
        paragraaf: '3'
  - number: '6.2'
    text: |-
      Onze Minister kan op aanvraag ontheffing verlenen van [artikel 5, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024139#Artikel5
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0024139
        artikel: '5'
        paragraaf: '3'
  - number: '6.3'
    text: |-
      Vrijstellingen en ontheffingen kunnen onder beperkingen worden verleend en er kunnen voorschriften en voorwaarden
      aan worden verbonden.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel6
  - number: 6a.1
    text: Een algemene doorvoervergunning wordt bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel6a
  - number: 6a.2
    text: |-
      Een algemene doorvoervergunning kan onder beperkingen worden vastgesteld en er kunnen voorschriften en voorwaarden
      aan verbonden worden.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel6a
  - number: 6a.3
    text: |-
      Onze Minister kan een beschikkingsbevoegde uitsluiten van het gebruik van een algemene doorvoervergunning ter
      bescherming van wezenlijke veiligheidsbelangen, openbare orde of openbare veiligheid.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel6a
  - number: 6b.1
    text: |-
      Voorafgaand aan het eerste gebruik van een algemene doorvoervergunning vinden gelijktijdig een verzoek tot
      registratie en een melding plaats.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel6b
  - number: 6b.2
    text: 'Bij ministeriële regeling worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel6b
  - number: 6b.2.a
    text: de wijze waarop en door wie een verzoek tot registratie en een melding moet worden gedaan;
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel6b
  - number: 6b.2.b
    text: het tijdstip van een verzoek tot registratie en een melding;
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel6b
  - number: 6b.2.c
    text: de inhoud van een verzoek tot registratie en een melding;
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel6b
  - number: 6b.2.d
    text: de registratievoorwaarden voor eerste gebruikmaking van een algemene overdrachtsvergunning.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel6b
  - number: '7.1'
    text: Onze Minister verleent op aanvraag een individuele doorvoervergunning.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel7
  - number: '7.2'
    text: |-
      Onze Minister kan een vergunning als bedoeld in het eerste lid onder beperkingen verlenen en kan aan een vergunning
      voorschriften en voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel7
  - number: '7.3'
    text: Bij ministeriële regeling worden regels gesteld over de wijze waarop en door wie een vergunning wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel7
  - number: '8'
    text: 'Onze Minister kan een individuele doorvoervergunning in ieder geval intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel8
  - number: 8.a
    text: de vergunning is verstrekt op grond van onjuiste of onvolledige gegevens of
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel8
  - number: 8.b
    text: de voorschriften en voorwaarden van de vergunning niet in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel8
  - number: '9'
    text: |-
      Het is verboden om de goederen, bedoeld in lijst 2 van onderdeel B van de Bijlage inzake stoffen bij het op
      3 september 1992 tot stand gekomen Verdrag tot verbod van de ontwikkeling, de productie, de aanleg van voorraden
      en het gebruik van chemische wapens en inzake de vernietiging van deze wapens (Trb. 2006, 26) in te voeren in
      Nederland uit landen, die geen partij zijn bij dit verdrag.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel9
  - number: '10.1'
    text: Indien geen vergunning is vereist voor de doorvoer van militaire goederen, vindt een melding plaats.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel10
  - number: '10.2'
    text: 'Bij ministeriële regeling worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel10
  - number: 10.2.a
    text: bij wie, de wijze waarop en door wie een melding wordt gedaan;
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel10
  - number: 10.2.b
    text: het tijdstip van een melding;
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel10
  - number: 10.2.c
    text: de inhoud van een melding.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel10
  - number: '10.3'
    text: Bij ministeriële regeling kan vrijstelling worden verleend van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel10
  - number: '10.4'
    text: |-
      Een vrijstelling kan onder beperkingen worden verleend en er kunnen voorschriften en voorwaarden aan worden
      verbonden.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel10
  - number: '10.5'
    text: Onze Minister kan op aanvraag ontheffing verlenen van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel10
  - number: '10.6'
    text: |-
      Een ontheffing kan onder beperkingen worden verleend en er kunnen voorschriften en voorwaarden aan worden
      verbonden.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel10
  - number: '11.1'
    text: |-
      Het is verboden om militaire goederen uit te voeren uit Nederland zonder individuele, globale of algemene
      uitvoervergunning.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel11
  - number: '11.2'
    text: |-
      Het eerste lid is niet van toepassing op de uitvoer uit Nederland van militaire goederen als bedoeld in
      [artikel 3, eerste lid, van de Uitvoeringswet verdrag chemische wapens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007434#Artikel3
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007434
        artikel: '3'
  - number: '11.3'
    text: Een vergunning wordt in ieder geval niet verleend voor zover dit voortvloeit uit internationale verplichtingen.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel11
  - number: '12.1'
    text: |-
      Bij ministeriële regeling kan vrijstelling worden verleend van [artikel 11, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024139#Artikel11
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0024139
        artikel: '11'
        paragraaf: '4'
  - number: '12.2'
    text: |-
