  - number: '12.3'
    text: |-
      Vrijstellingen en ontheffingen kunnen onder beperkingen worden verleend en er kunnen voorschriften en voorwaarden
      aan worden verbonden.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel12
  - number: '13.1'
    text: Een algemene uitvoervergunning wordt bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel13
  - number: '13.2'
    text: |-
      Een algemene uitvoervergunning kan onder beperkingen worden vastgesteld en er kunnen voorschriften en voorwaarden
      aan verbonden worden.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel13
  - number: '13.3'
    text: |-
      Onze Minister kan een beschikkingsbevoegde uitsluiten van het gebruik van een algemene uitvoervergunning ter
      bescherming van wezenlijke veiligheidsbelangen, openbare orde of openbare veiligheid.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel13
  - number: '14.1'
    text: Onze Minister verleent op aanvraag een individuele uitvoervergunning of een globale uitvoervergunning.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel14
  - number: '14.2'
    text: |-
      Onze Minister kan een vergunning als bedoeld in het eerste lid onder beperkingen verlenen en kan aan een vergunning
      voorschriften en voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel14
  - number: '14.3'
    text: Bij ministeriële regeling worden regels gesteld over de wijze waarop en door wie een vergunning wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel14
  - number: '15'
    text: |-
      Onze Minister kan een individuele uitvoervergunning of een globale uitvoervergunning in ieder geval intrekken
      indien:
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel15
  - number: 15.a
    text: de vergunning is verstrekt op grond van onjuiste of onvolledige gegevens of
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel15
  - number: 15.b
    text: de voorschriften en voorwaarden van de vergunning niet in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel15
  - number: '17.1'
    text: |-
      Voorafgaand aan het eerste gebruik van een algemene uitvoervergunning vinden gelijktijdig een verzoek tot
      registratie en een melding plaats.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel17
  - number: '17.2'
    text: 'Bij ministeriële regeling worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel17
  - number: 17.2.a
    text: de wijze waarop en door wie een verzoek tot registratie en een melding moet worden gedaan;
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel17
  - number: 17.2.b
    text: het tijdstip van een verzoek tot registratie of een melding;
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel17
  - number: 17.2.c
    text: de inhoud van een verzoek tot registratie of een melding;
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel17
  - number: 17.2.d
    text: de registratievoorwaarden.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel17
  - number: '18.1'
    text: Het is verboden om militaire goederen over te dragen uit Nederland zonder overdrachtsvergunning.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel18
  - number: '18.2'
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel18
  - number: 18.2.a
    text: |-
      de overdracht uit Nederland van militaire goederen, bedoeld in
      [artikel 3, eerste lid, van de Uitvoeringswet verdrag chemische wapens][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007434#Artikel3
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007434
        artikel: '3'
  - number: 18.2.b
    text: de overdracht uit Nederland van militaire goederen naar België en Luxemburg.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel18
  - number: '18.3'
    text: |-
      Onze Minister kan besluiten dat voor de overdracht van militaire goederen in situaties als bedoeld in het tweede
      lid, onder b, een vergunning is vereist:
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel18
  - number: 18.3.a
    text: |-
      indien het belang van de internationale rechtsorde of een daarop betrekking hebbende internationale afspraak dat
      vereist;
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel18
  - number: 18.3.b
    text: indien dit noodzakelijk is voor de bescherming van de wezenlijke belangen van de nationale veiligheid.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel18
  - number: '18.4'
    text: Een vergunning wordt in ieder geval niet verleend voor zover dit voortvloeit uit internationale verplichtingen.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel18
  - number: '19.1'
    text: |-
      Bij ministeriële regeling kan vrijstelling worden verleend van [artikel 18, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024139#Artikel18
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0024139
        artikel: '18'
        paragraaf: '5'
  - number: '19.2'
    text: |-
      Onze Minister kan op aanvraag ontheffing verlenen van [artikel 18, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024139#Artikel18
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0024139
        artikel: '18'
        paragraaf: '5'
  - number: '19.3'
    text: |-
      Vrijstellingen en ontheffingen kunnen onder beperkingen worden verleend en er kunnen voorschriften en voorwaarden
      aan worden verbonden.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel19
  - number: '20.1'
    text: Een algemene overdrachtsvergunning wordt bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel20
  - number: '20.2'
    text: |-
      Een algemene overdrachtsvergunning kan onder beperkingen worden vastgesteld en er kunnen voorschriften en
      voorwaarden aan verbonden worden.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel20
  - number: '20.3'
    text: |-
      Onze Minister kan een beschikkingsbevoegde uitsluiten van het gebruik van een algemene overdrachtsvergunning ter
      bescherming van wezenlijke veiligheidsbelangen, openbare orde of openbare veiligheid.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel20
  - number: '21.1'
    text: Onze Minister verleent op aanvraag een individuele overdrachtsvergunning of een globale overdrachtsvergunning.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel21
  - number: '21.2'
    text: Een globale overdrachtsvergunning wordt voor drie jaar verleend en kan worden verlengd.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel21
  - number: '21.3'
    text: |-
      Onze Minister kan een vergunning als bedoeld in het eerste lid onder beperkingen verlenen en aan een vergunning
      voorschriften en voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel21
  - number: '21.4'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over de wijze waarop en door wie een vergunning wordt
      aangevraagd.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel21
  - number: '22.1'
    text: 'Een individuele overdrachtsvergunning kan in ieder geval worden geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel22
  - number: 22.1.a
    text: de aanvraag voor een overdrachtsvergunning niet beperkt is tot één overdracht;
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel22
  - number: 22.1.b
    text: gebruik kan worden gemaakt van een algemene overdrachtsvergunning of een globale overdrachtsvergunning.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel22
  - number: '22.2'
    text: 'Een globale overdrachtsvergunning kan in ieder geval worden geweigerd:'
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel22
  - number: 22.2.a
    text: ter bescherming van wezenlijke veiligheidsbelangen of om redenen van openbare orde;
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel22
  - number: 22.2.b
    text: in verband met internationale verplichtingen en verbintenissen met andere lidstaten;
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel22
  - number: 22.2.c
    text: |-
      indien gegronde redenen bestaan om aan te nemen dat de beschikkingsbevoegde niet zal kunnen voldoen aan alle
      voorwaarden die nodig zijn om een globale overdrachtsvergunning te kunnen verkrijgen.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel22
  - number: '23'
    text: 'Onze Minister kan een individuele of globale overdrachtsvergunning in ieder geval intrekken indien:'
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel23
  - number: 23.a
    text: de vergunning werd verstrekt op grond van onjuiste of onvolledige gegevens of
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel23
  - number: 23.b
    text: de voorschriften en voorwaarden van de vergunning niet in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel23
  - number: '25.1'
    text: |-
      Een beschikkingsbevoegde stelt de ontvanger van militaire goederen in kennis van de beperkingen, voorschriften
      en voorwaarden van de individuele, globale of algemene overdrachtsvergunning op basis waarvan de overdracht heeft
      plaats gevonden.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel25
  - number: '25.2'
    text: |-
      Een beschikkingsbevoegde rapporteert na afloop van een bij ministeriële regeling vast te stellen termijn over het
      gebruik van een individuele, globale of algemene overdrachtsvergunning door middel van een overzicht, waarin bij
      ministeriële regeling vast te stellen informatie is vermeld.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel25
  - number: '25.3'
    text: |-
      De beschikkingsbevoegde is verplicht de administratie en alle op de overdracht betrekking hebbende documenten bij
      te houden overeenkomstig [artikel 10 van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel10
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '10'
  - number: '26.1'
    text: |-
      Voorafgaand aan het eerste gebruik van de algemene overdrachtsvergunning vinden gelijktijdig een verzoek tot
      registratie en een melding plaats.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel26
  - number: '26.2'
    text: 'Bij ministeriële regeling worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel26
  - number: 26.2.a
    text: de wijze waarop en door wie een verzoek tot registratie en een melding moet worden gedaan;
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel26
  - number: 26.2.b
    text: het tijdstip van een verzoek tot registratie en een melding;
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel26
  - number: 26.2.c
    text: de inhoud van een verzoek tot registratie en een melding;
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel26
  - number: 26.2.d
    text: de registratievoorwaarden vóór eerste gebruikmaking van een algemene overdrachtsvergunning
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel26
  - number: '27.1'
    text: |-
      Onze Minister kan op verzoek van een ontvanger van militaire goederen, deze ontvanger erkennen als bedoeld in
      artikel 9, eerste lid, van richtlijn 2009/43/EG.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel27
  - number: '27.2'
    text: Een erkenning kan onder beperkingen worden verleend en er kunnen voorschriften en voorwaarden aan worden verbonden.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel27
  - number: '27.3'
    text: 'Bij ministeriële regeling worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel27
  - number: 27.3.a
    text: de wijze waarop en door wie een erkenning wordt aangevraagd;
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel27
  - number: 27.3.b
    text: de gronden om een erkenning te verlenen.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel27
  - number: '27.4'
    text: De erkenning geschiedt voor een periode van 5 jaar.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel27
  - number: '27.5'
    text: Onze Minister beslist binnen 16 weken op een verzoek tot erkenning.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel27
  - number: '27.6'
    text: |-
      Op verzoek van ontvanger of indien een ontvanger niet meer voldoet aan de voorschriften en voorwaarden, bedoeld in
      het tweede lid, kan Onze Minister de erkenning intrekken.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel27
  - number: '27.7'
    text: |-
      Het besluit tot erkenning, bedoeld in het vijfde lid, en het besluit tot intrekking, bedoeld in het zesde lid,
      worden gepubliceerd in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel27
  - number: '27.8'
    text: |-
      Een certificaat als bedoeld in artikel 9, tweede lid, van richtlijn 2009/43/EG, afgegeven in een andere EU-
      lidstaat, Noorwegen, IJsland of Liechtenstein, wordt gelijkgesteld met een erkenning als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel27
  - number: '28.1'
    text: |-
      Een vergunning als bedoeld in de [artikelen 4b, eerste lid][ref1], [4c][ref2], [7, eerste lid][ref3],
      [8][ref4], [14, eerste lid][ref5], [15][ref6], [21, eerste lid][ref7], en [23][ref8], kan
      worden geweigerd, respectievelijk ingetrokken, in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0024139#Artikel4b
      [ref2]: https://wetten.overheid.nl/BWBR0024139#Artikel4c
      [ref3]: https://wetten.overheid.nl/BWBR0024139#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0024139#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0024139#Artikel14
      [ref6]: https://wetten.overheid.nl/BWBR0024139#Artikel15
      [ref7]: https://wetten.overheid.nl/BWBR0024139#Artikel21
      [ref8]: https://wetten.overheid.nl/BWBR0024139#Artikel23
      [ref9]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0024139
        artikel: 4b
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0024139
        artikel: 4c
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0024139
        artikel: '7'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0024139
        artikel: '8'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0024139
        artikel: '14'
        paragraaf: '4'
      - id: ref6
        bwb_id: BWBR0024139
        artikel: '15'
        paragraaf: '4'
      - id: ref7
        bwb_id: BWBR0024139
        artikel: '21'
        paragraaf: '5'
      - id: ref8
        bwb_id: BWBR0024139
        artikel: '23'
        paragraaf: '5'
      - id: ref9
        bwb_id: BWBR0013798
        artikel: '3'
  - number: '28.2'
    text: |-
      Een ontheffing als bedoeld in de [artikelen 6, tweede lid][ref1], [12, tweede lid][ref2], en
      [19, tweede lid][ref3], kan mede worden geweigerd in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0024139#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0024139#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0024139#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0024139
        artikel: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0024139
        artikel: '12'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0024139
        artikel: '19'
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0013798
        artikel: '3'
  - number: '28.3'
    text: |-
      Voordat toepassing wordt gegeven aan het eerste of tweede lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: '29'
    text: |-
      Vergunningen en ontheffingen die verleend zijn op grond van het [In- en uitvoerbesluit strategische goederen][ref1]
      worden geacht te zijn verleend op grond van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0002408
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002408
  - number: '30'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop de [wet][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0023746
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0023746
  - number: '31'
    text: 'Dit besluit wordt aangehaald als: Besluit strategische goederen.'
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel31
