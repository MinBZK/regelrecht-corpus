preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Economische Zaken van 30 oktober 2007, nr. WJZ 7122174, gedaan na
    overleg met de Staatssecretaris van Financiën;

    Gelet op verordening (EG) nr. 1334/2000 van de Raad van de Europese Unie van 22 juni 2000 tot instelling van
    een communautaire regeling voor controle op de uitvoer van producten en technologie voor tweeërlei gebruik en de
    artikelen 1:4, eerste en tweede lid, en 3:1 van de Algemene douanewet;

    De Raad van State gehoord (advies van 10 april 2008, nr. W10.07.0401/III);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 23 juni 2008, nr. WJZ 8056339;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *algemene doorvoervergunning:* een bij
      ministeriële regeling verleende toestemming aan in Nederland gevestigde beschikkingsbevoegden voor de doorvoer van
      militaire goederen door Nederland;
        - *algemene overdrachtsvergunning:* een bij ministeriële regeling verleende toestemming aan in Nederland gevestigde
      beschikkingsbevoegden voor de overdracht van militaire goederen aan in een andere lidstaat gevestigde ontvanger;
        - *algemene uitvoervergunning:* een bij ministeriële regeling verleende toestemming aan in Nederland gevestigde
      beschikkingsbevoegden voor de uitvoer van militaire goederen uit Nederland naar een derde land;
        - *beschikkingsbevoegde:* een natuurlijke persoon of rechtspersoon die bevoegd is over militaire goederen te
      beschikken;
        - *derde land:* een land niet zijnde een lidstaat;
        - *doorvoer door Nederland:* het vervoer van militaire goederen die uitsluitend het Nederlands grondgebied worden
      binnengebracht om via dat gebied te worden vervoerd naar een bestemming buiten het Nederlands grondgebied;
        - *globale overdrachtsvergunning:* een op aanvraag aan een beschikkingsbevoegde verleende vergunning voor de
      overdracht van militaire goederen aan ontvangers of categorieën van ontvangers in één of meer andere lidstaten;
        - *globale uitvoervergunning:* een op aanvraag aan een beschikkingsbevoegde verleende vergunning voor de uitvoer
      van militaire goederen aan ontvangers of categorieën van ontvangers in één of meer derde landen;
        - *individuele doorvoervergunning:* een op aanvraag aan een in Nederland gevestigde beschikkingsbevoegde verleende
      vergunning voor de doorvoer van militaire goederen door Nederland;
        - *individuele overdrachtsvergunning:* een op aanvraag aan een beschikkingsbevoegde verleende vergunning voor de
      overdracht van militaire goederen aan een individuele ontvanger in een andere lidstaat;
        - *individuele uitvoervergunning:* een op aanvraag aan een beschikkingsbevoegde verleende vergunning voor de
      uitvoer van militaire goederen aan een individuele ontvanger in een derde land;
        - *invoer in Nederland:* het binnenbrengen van militaire goederen in Nederlands grondgebied, anders dan voor
      doorvoer door Nederland;
        - *lidstaat:* een lidstaat van de Europese Unie, Noorwegen, IJsland en Liechtenstein;
        - *militaire goederen:* de militaire goederen, bedoeld in een door Onze Minister na overleg met Onze Minister wie
      het mede aangaat vast te stellen ministeriële regeling;
        - *Nederlands grondgebied:* het grondgebied van het Koninkrijk der Nederlanden in Europa;
        - *Onze Minister:* Onze Minister van Buitenlandse Zaken;
        - *overdracht uit Nederland:* elke overbrenging of verplaatsing van een militair goed van het Nederlands
      grondgebied naar een bestemming in een andere lidstaat;
        - *uitvoer uit Nederland:* het doen verlaten van goederen van Nederlands grondgebied naar een derde land, anders
      dan voor doorvoer door Nederland;
        - *richtlijn 2009/43/EG:* richtlijn 2009/43/EG van het Europees Parlement en de Raad van de Europese Unie van 6 mei
      2009 betreffende de vereenvoudiging van de voorwaarden voor de overdracht van defensiegerelateerde producten binnen
      de Gemeenschap (PbEU 2009, L 146);
        - *Verordening producten voor tweeërlei gebruik:* Verordening van het Europees Parlement en de Raad tot instelling
      van een EU-regeling voor controle op de uitvoer, de overbrenging, de tussenhandel, de technische bijstand en de
      doorvoer van producten voor tweeërlei gebruik (herschikking) (PbEU 2021, L 206);
        - *wet:* de [Algemene douanewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023746
    url: https://wetten.overheid.nl/BWBR0024139/2025-02-05#Artikel1
