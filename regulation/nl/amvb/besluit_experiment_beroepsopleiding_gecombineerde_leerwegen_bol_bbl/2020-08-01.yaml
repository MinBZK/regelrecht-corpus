  - number: '2'
    text: 'Het doel van het experiment is te onderzoeken of met de beroepsopleiding bol-bbl:'
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel2
  - number: 2.a
    text: |-
      de kwaliteit en toegankelijkheid van het beroepsonderwijs verbetert door een andere balans tussen de theoretische
      en praktische voorbereiding op de uitoefening van beroepen; en
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel2
  - number: 2.b
    text: |-
      de doelmatigheid van het beroepsonderwijs verbetert doordat een betere aansluiting van het onderwijs op de
      arbeidsmarkt wordt bereikt.
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel2
  - number: '3.1'
    text: |-
      Het experiment behelst het aanbieden van een beroepsopleiding bol-bbl, met tenminste het eerste studiejaar een
      studiejaar bol en, afhankelijk van de inrichting van het onderwijsprogramma en de duur van de opleiding, in het
      tweede, derde of vierde studiejaar een overgang naar één of meerdere studiejaren bbl.
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel3
  - number: '3.2'
    text: |-
      Het experiment staat open voor de beroepsopleidingen, genoemd in
      [artikel 7.2.2, eerste lid, onderdelen b tot en met d, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '3.3'
    text: Het experiment duurt van 1 augustus 2015 tot en met 31 juli 2021.
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel3
  - number: '4.1'
    text: 'Een instelling kan slechts deelnemen aan het experiment met een beroepsopleiding:'
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel4
  - number: 4.1.a
    text: |-
      waarvoor niet een besluit is genomen als bedoeld in de [artikelen 6.1.4][ref1] en [6.1.5b, eerste lid][ref2],
      respectievelijk de [artikelen 6.2.2][ref3] en [6.2.3.b, eerste lid, van de wet][ref4]; en die


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '6'
  - number: 4.1.b
    text: |-
      niet onder de werking van het [Besluit experimenten doorlopende leerlijnen vmbo-mbo 2014–2022][ref1] valt.


      [ref1]: https://wetten.overheid.nl/BWBR0033984
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0033984
  - number: '4.2'
    text: |-
      Het bevoegd gezag van een instelling, die wil deelnemen aan het experiment, heeft een samenwerkingsovereenkomst
      met één of meer opleidingsbedrijven of één of meer leerbedrijven waarin voor iedere student is opgenomen de
      garantie van een beschikbare praktijkplaats als bedoeld in [artikel 7.2.9, tweede lid, van de wet][ref1], tegen een
      marktconforme beloning voor zover het een praktijkplaats in een studiejaar bbl betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '4.3'
    text: Een instelling neemt met maximaal 10 beroepsopleidingen deel aan het experiment.
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel4
  - number: '5.1'
    text: |-
      In afwijking van de [artikelen 7.2.2, tweede lid][ref1], en [7.2.7, derde, vierde en achtste lid, van de wet][ref2],
      voldoet het onderwijsprogramma voor de beroepsopleiding bol-bbl aan de eisen met betrekking tot voldoende begeleide
      onderwijsuren en uren beroepspraktijkvorming, bedoeld in artikel 7.2.7, eerste lid, van de wet, indien het bevoegd
      gezag voor de student een onderwijsprogramma verzorgt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 5.1.a
    text: |-
      voor een tweejarige basisberoepsopleiding of vakopleiding één studiejaar bol en één studiejaar bbl kent
      en ten minste 1.850 klokuren omvat waarvan ten minste 900 begeleide onderwijsuren en ten minste 860 uren
      beroepspraktijkvorming, met dien verstande dat in het eerste studiejaar ten minste 700 begeleide onderwijsuren
      worden verzorgd;
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel5
  - number: 5.1.b
    text: 'voor een driejarige vakopleiding of middenkaderopleiding:'
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel5
  - number: 5.1.b.1°
    text: |-
      één studiejaar bol en twee studiejaren bbl kent en ten minste 2.700 klokuren omvat waarvan ten minste 1.100
      begeleide onderwijsuren en ten minste 1.470 uren beroepspraktijkvorming, met dien verstande dat in het eerste
      studiejaar ten minste 700 begeleide onderwijsuren worden verzorgd; of
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel5
  - number: 5.1.b.2°
    text: |-
      twee studiejaren bol en één studiejaar bbl kent en ten minste 2.850 klokuren omvat waarvan ten minste 1.450
      begeleide onderwijsuren en ten minste 1.060 uren beroepspraktijkvorming, met dien verstande dat in het eerste
