      Voor de voldoening van lesgeld wordt in afwijking van [artikel 1, onderdeel e, van de Les- en cursusgeldwet][ref1]
      onder dagschool mede verstaan: een instelling als bedoeld in
      [1.1.1, onderdeel b, van de Wet educatie en beroepsonderwijs][ref2], voor zover het betreft een studiejaar bol.


      [ref1]: https://wetten.overheid.nl/BWBR0004188#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel6
    references:
