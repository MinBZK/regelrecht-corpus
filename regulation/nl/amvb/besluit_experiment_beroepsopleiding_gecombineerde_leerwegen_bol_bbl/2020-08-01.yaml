      [artikel 1.1 van de Wet studiefinanciering 2000][ref1] onder beroepsonderwijs mede verstaan: een studiejaar bol.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel1
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '1'
  - number: '7.1'
    text: Instellingen kunnen uitsluitend met toestemming van Onze Minister deelnemen aan het experiment.
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel7
  - number: '7.2'
    text: Toestemming tot deelname wordt op aanvraag verleend.
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel7
  - number: '7.3'
    text: 'Bij de aanvraag overlegt het bevoegd gezag met betrekking tot de beroepsopleiding een projectplan, bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel7
  - number: 7.3.a
    text: |-
      de onderwijs- en examenregeling, bedoeld in [artikel 7.4.8 van de wet][ref1], waarbij inzicht wordt gegeven in:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 7.3.a.1°
    text: de kwalificatie waarop de opleiding betrekking heeft; en
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel7
  - number: 7.3.a.2°
    text: |-
      de vermelding van de begeleide onderwijsuren en de uren beroepspraktijkvorming per programmaonderdeel per
      studiejaar, waarbij tevens is aangegeven welke studiejaren bol en welke studiejaren bbl zijn;
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel7
  - number: 7.3.b
    text: |-
      de samenwerkingsovereenkomst, bedoeld in [artikel 4, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0036631#Artikel4
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0036631
        artikel: '4'
        hoofdstuk: '1'
  - number: 7.3.c
    text: |-
      een opgave van het aantal studenten dat de instelling per cohort beoogt in te schrijven voor de beroepsopleiding
      bol-bbl, en
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel7
  - number: 7.3.d
    text: |-
      een verklaring van instemming van de studentenraad indien het onderwijsprogramma minder uren omvat als bedoeld in
      [artikel 5, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036631#Artikel5
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0036631
        artikel: '5'
        hoofdstuk: '1'
  - number: '7.4'
    text: |-
      Een aanvraag wordt ingediend in de periode van 1 december tot en met 15 januari van het studiejaar voorafgaand
      aan het studiejaar waarin de instelling de beroepsopleiding bol-bbl beoogt te starten, met dien verstande dat
      uiterlijk:
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel7
  - number: 7.4.a
    text: |-
      in de aanvraagperiode van 1 december 2015 tot en met 15 januari 2016 een aanvraag wordt ingediend voor het
      aanbieden van een vierjarige middenkaderopleiding;
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel7
  - number: 7.4.b
    text: |-
      in de aanvraagperiode van 1 december 2016 tot en met 15 januari 2017 een aanvraag wordt ingediend voor het
      aanbieden van een driejarige vak- of middenkaderopleiding; en
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel7
  - number: 7.4.c
    text: |-
      in de aanvraagperiode van 1 december 2017 tot en met 15 januari 2018 een aanvraag wordt ingediend voor het
      aanbieden van een tweejarige basisberoeps- of vakopleiding.
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel7
  - number: '7.5'
    text: |-
      In afwijking van het vorige lid worden aanvragen van instellingen die in het studiejaar 2015–2016 een
      beroepsopleiding bol-bbl willen starten uiterlijk 1 juni 2015 ingediend.
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel7
  - number: '7.6'
    text: |-
      Onverminderd [artikel 4, derde lid][ref1], kan Onze Minister vanaf het aanvraagjaar 2016 besluiten het aantal
      nieuw aan te bieden beroepsopleidingen bol-bbl te beperken. Dat aantal en de voorschriften over de wijze waarop de
      aanvragen worden beoordeeld en gewogen om het aantal toe te laten beroepsopleidingen bol-bbl niet te overschrijden
      worden bij ministeriële regeling bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0036631#Artikel4
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0036631
        artikel: '4'
        hoofdstuk: '1'
  - number: '7.7'
    text: |-
      Onze Minister verleent een instelling toestemming tot deelname aan het experiment wanneer wordt voldaan aan de
      voorwaarden, genoemd in [artikel 4][ref1] en wanneer het onderwijsprogramma van de beroepsopleiding bol-bbl voldoet
      aan de voorwaarden genoemd in [artikel 5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0036631#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0036631#Artikel5
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0036631
        artikel: '4'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0036631
        artikel: '5'
        hoofdstuk: '1'
  - number: '7.8'
    text: |-
      De toestemming voor deelname aan het experiment met een drie-, respectievelijk, vierjarige opleiding heeft
      slechts betrekking op één van de in [artikel 5, onderdeel b, respectievelijk, c][ref1], genoemde varianten van
      het onderwijsprogramma.


      [ref1]: https://wetten.overheid.nl/BWBR0036631#Artikel5
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0036631
        artikel: '5'
        hoofdstuk: '1'
  - number: '7.9'
    text: |-
      Bij de beschikking waarbij toestemming wordt verleend stelt Onze Minister, met het oog op de duur van het
      experiment, het laatste studiejaar vast dat studenten kunnen worden ingeschreven voor een beroepsopleiding bol-bbl
      bij de instelling.
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel7
  - number: '7.10'
    text: Onze Minister geeft een beschikking binnen drie maanden na ontvangst van een aanvraag.
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel7
  - number: '7.11'
    text: |-
      In afwijking van het vorige lid geeft Onze Minister op een aanvraag als bedoeld in het vijfde lid, voor 15 augustus
      2015 een beschikking.
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel7
  - number: '8.1'
    text: |-
      Het bevoegd gezag van een deelnemende instelling is verplicht zodanige informatie te verstrekken aan aanstaande
      studenten over een beroepsopleiding bol-bbl dat het hen in staat stelt zich voorafgaand aan de inschrijving een
      goed oordeel te kunnen vormen over de gevolgen daarvan, waaronder in ieder geval:
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel8
  - number: 8.1.a
    text: |-
      informatie over verplichtingen samenhangend met het ontstaan en het vervallen van de aanspraak op
      studiefinanciering en informatie over verplichtingen met betrekking tot het betalen van lesgeld onderscheidenlijk
      cursusgeld.
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel8
  - number: 8.1.b
    text: |-
      informatie over de mogelijkheid voor een student tot beëindiging van de inschrijving van de beroepsopleiding bol-
      bbl en inschrijving in een beroepsopleiding in de beroepsopleidende dan wel beroepsbegeleidende leerweg.
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel8
  - number: '8.2'
    text: 'Het bevoegd gezag draagt er zorg voor dat:'
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel8
  - number: 8.2.a
    text: |-
      de student tijdig in elk studiejaar geïnformeerd wordt over de verplichtingen die verbonden zijn aan de aanspraak
      dan wel het vervallen van de aanspraak op studiefinanciering en de verplichtingen met betrekking tot het
      verschuldigd zijn van lesgeld onderscheidenlijk cursusgeld;
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel8
  - number: 8.2.b
    text: |-
      gedurende de studiejaren bbl sprake is van ten minste drie contactmomenten per studiejaar tussen de instelling, de
      student en het leerbedrijf;
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel8
  - number: '8.3'
    text: |-
      de student die de inschrijving van de beroepsopleiding bol-bbl wil beëindigen, begeleid wordt bij het desgewenst
      inschrijven voor een andere beroepsopleiding al dan niet bij een andere instelling, passend bij het reeds bereikte
      onderwijsniveau.
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel8
  - number: '9.1'
    text: 'Aan de toestemming zijn voor een deelnemende instelling voorts de volgende verplichtingen verbonden:'
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel9
  - number: 9.1.a
    text: |-
      het uitbrengen van een verslag aan Onze Minister uiterlijk op 31 juli van het studiejaar waarin een student voor
      het eerst de beroepsopleiding bol-bbl kan afronden;
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel9
  - number: 9.1.b
    text: |-
      het uitbrengen van een eindverslag aan Onze Minister uiterlijk op 31 juli van het studiejaar 2019–2020, in welke
      verslag de waardering van de studenten, docenten, leerwerkbedrijven, opleidingsbedrijven en werkgevers over het
      experiment is opgenomen;
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel9
  - number: 9.1.c
    text: |-
      het onverwijld melden aan Onze Minister van feiten en omstandigheden die van belang kunnen zijn voor het
      experiment;
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel9
  - number: 9.1.d
    text: het desgevraagd verstrekken aan Onze Minister van nadere informatie; en
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel9
  - number: 9.1.e
    text: het verlenen van medewerking aan Onze Minister aan de monitoring en evaluatie van het experiment.
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel9
  - number: '9.2'
    text: Aan een toestemming kunnen aanvullende, op de individuele instelling afgestemde, voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel9
  - number: '9.3'
    text: |-
      Indien de bevindingen van het verslag daartoe aanleiding geven kan Onze Minister de beschikking van een deelnemende
      instelling al dan niet op diens verzoek, wijzigen.
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel9
  - number: '10.1'
    text: |-
      Onze Minister evalueert medio 2020 de effecten van het experiment met het oog op het verslag, bedoeld in
      [artikel 11a.1, vijfde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel11a
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 11a
  - number: '10.2'
    text: |-
      Bij de evaluatie betrekt Onze Minister de verslagen, bedoeld in [artikel 9, eerste lid, onder a en b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036631#Artikel9
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0036631
        artikel: '9'
        hoofdstuk: '1'
  - number: '10.3'
    text: 'Onze Minister onderzoekt bij de evaluatie in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel10
  - number: 10.3.a
    text: de studieresultaten van de studenten;
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel10
  - number: 10.3.b
    text: |-
      de aansluiting van het onderwijs op de arbeidsmarkt, waaronder in ieder geval de kansen op het vinden van een baan
      op het niveau van de gevolgde opleiding;
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel10
  - number: 10.3.c
    text: |-
      de mate waarin de beroepsopleiding bol-bbl van invloed is geweest op de studieresultaten en de aansluiting van het
      onderwijs op de arbeidsmarkt.
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel10
  - number: 10.3.d
    text: |-
      de waarderingen van studenten, docenten, leerwerkbedrijven en opleidingsbedrijven en werkgevers van de
      beroepsopleiding bol-bbl;
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel10
  - number: 10.3.e
    text: de waardering en effecten van de samenwerkingsovereenkomsten en de marktconforme beloning van de studenten;
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel10
  - number: 10.3.f
    text: |-
      de effecten van aanbieden van de beroepsopleiding bol-bbl op de inschrijvingen voor beroepsopleidingen in de
      beroepsopleidende leerweg en beroepsopleidingen in de beroepsbegeleidende leerweg; en
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel10
  - number: 10.3.g
    text: |-
      in hoeverre er in de bovengenoemde effecten een verschil is tussen de experimentele basisberoepsopleidingen,
      vakopleidingen of middenkaderopleidingen.
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel10
  - number: '11.1'
    text: |-
      Onze Minister kan besluiten dat het experiment geheel of gedeeltelijk bij een deelnemende instelling wordt
      beëindigd indien een instelling niet langer voldoet aan de voorwaarden voor deelname aan het experiment, genoemd in
      [artikel 4][ref1] of de voorschriften van dit besluit of de beschikking niet naar behoren naleeft.


      [ref1]: https://wetten.overheid.nl/BWBR0036631#Artikel4
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0036631
        artikel: '4'
        hoofdstuk: '1'
  - number: '11.2'
    text: |-
      Onze Minister kan besluiten dat het experiment geheel of gedeeltelijk wordt beëindigd indien het experiment
      ernstige nadelige effecten op het onderwijs, de onderwijsvoorzieningen of de positie van de studenten bij een of
      meerdere instellingen tot gevolg heeft.
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel11
  - number: '12'
    text: 'Dit besluit wordt aangehaald als: Besluit experiment beroepsopleiding gecombineerde leerwegen bol-bbl.'
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel12
  - number: '13'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst en vervalt met ingang van 1 augustus 2021.
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel13
