    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel5
  - number: 5.1.c
    text: 'voor een vierjarige middenkaderopleiding:'
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel5
  - number: 5.1.c.1°
    text: |-
      één studiejaar bol en drie studiejaren bbl kent en ten minste 3.550 klokuren omvat waarvan ten minste 1.300
      begeleide onderwijsuren en ten minste 2.080 uren beroepspraktijkvorming, met dien verstande dat in het eerste
      studiejaar ten minste 700 begeleide onderwijsuren worden verzorgd; of
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel5
  - number: 5.1.c.2°
    text: |-
      twee studiejaren bol en twee studiejaren bbl kent en ten minste 3.700 klokuren omvat waarvan ten minste 1.650
      begeleide onderwijsuren en ten minste 1.670 uren beroepspraktijkvorming, met dien verstande dat in het eerste
      studiejaar ten minste 700 begeleide onderwijsuren worden verzorgd; of
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel5
  - number: 5.1.c.3°
    text: |-
      drie studiejaren bol en één studiejaar bbl kent en ten minste 3.850 klokuren omvat waarvan ten minste 2.000
      begeleide onderwijsuren en ten minste 1.510 uren beroepspraktijkvorming, met dien verstande dat in het eerste
      studiejaar ten minste 700 begeleide onderwijsuren worden verzorgd.
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel5
  - number: '5.2'
    text: |-
      Het bevoegd gezag kan een onderwijsprogramma verzorgen dat minder uren omvat dan de onder a tot en met c
      genoemde aantallen mits de opleiding aantoonbaar van voldoende kwaliteit is. In het geval het onderwijsprogramma
      minder uren omvat, legt het bevoegd gezag hierover verantwoording af in het jaarverslag, bedoeld in
      [artikel 2.5.4, van de wet][ref1], dan wel in het verslag, bedoeld in [artikel 1.4.1, derde lid, van de wet][ref2],
      en is [artikel 8a.2.2, derde lid, onderdeel m, van de wet][ref3], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel5
