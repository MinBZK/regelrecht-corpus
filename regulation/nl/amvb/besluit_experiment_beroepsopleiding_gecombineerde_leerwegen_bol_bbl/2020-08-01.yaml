    text: |-
      Voor de voldoening van cursusgeld wordt in afwijking van [artikel 1, onderdeel f][ref1], onder cursus mede
      verstaan: een studiejaar bbl.


      [ref1]: https://wetten.overheid.nl/BWBR0004188#Artikel1
    url: https://wetten.overheid.nl/BWBR0036631/2020-08-01#Artikel6
    references:
