        artikel: 420quater
  - number: '45.2'
    text: |-
      Een aanbestedende dienst kan om dwingende redenen van algemeen belang afwijken van de verplichting, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel45
  - number: '45.3'
    text: 'Een aanbestedende dienst kan van deelneming aan een overheidsopdracht uitsluiten iedere ondernemer:'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel45
  - number: 45.3.a
    text: |-
      die in staat van faillissement of van liquidatie verkeert, wiens werkzaamheden zijn gestaakt, jegens wie een
      surseance van betaling of een akkoord geldt of die in een andere vergelijkbare toestand verkeert ingevolge een
      soortgelijke procedure die voorkomt in de op hem van toepassing zijnde wet- of regelgeving van een lidstaat van de
      Europese Unie;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel45
  - number: 45.3.b
    text: |-
      wiens faillissement of liquidatie is aangevraagd of tegen wie een procedure van surseance van betaling of akkoord
      dan wel een andere soortgelijke procedure die voorkomt in de op hem van toepassing zijnde wet- of regelgeving van
      een lidstaat van de Europese Unie, aanhangig is gemaakt;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel45
  - number: 45.3.c
    text: |-
      jegens wie een rechterlijke uitspraak met kracht van gewijsde volgens de op hem van toepassing zijnde wet- of
      regelgeving van een lidstaat van de Europese Unie is gedaan, waarbij een delict is vastgesteld dat in strijd is met
      zijn beroepsgedragsregels;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel45
  - number: 45.3.d
    text: |-
      die in de uitoefening van zijn beroep een ernstige fout heeft begaan, vastgesteld op een grond die de aanbestedende
      dienst aannemelijk kan maken;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel45
  - number: 45.3.e
    text: |-
      die niet aan zijn verplichtingen heeft voldaan ten aanzien van de betaling van de sociale zekerheidsbijdragen
      overeenkomstig de wettelijke bepalingen van het land waar hij is gevestigd of van Nederland;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel45
  - number: 45.3.f
    text: |-
      die niet aan zijn verplichtingen heeft voldaan ten aanzien van de betaling van zijn belastingen overeenkomstig de
      wettelijke bepalingen van het land waar hij is gevestigd of van Nederland;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel45
  - number: 45.3.g
    text: |-
      die zich in ernstige mate schuldig heeft gemaakt aan valse verklaringen bij het verstrekken van de inlichtingen die
      ingevolge de [artikelen 45 tot en met 53][ref1] kunnen worden verlangd, of die inlichtingen niet heeft verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel45
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '45'
        paragraaf: '12'
  - number: '45.4'
    text: |-
      Een aanbestedende dienst kan in verband met de toepassing van het eerste of derde lid de gegadigde of inschrijver
      verzoeken om bewijsstukken of verklaringen als bedoeld in [artikel 46][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel46
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '46'
        paragraaf: '12'
  - number: '46.1'
    text: |-
      Als instantie die bevoegd is tot het afgeven van een bewijsstuk waaruit blijkt dat een gegadigde
      of inschrijver voor een overheidsopdracht niet verkeert in een van de omstandigheden, bedoeld in
      [artikel 45, derde lid, onderdelen a en b][ref1], geldt de griffier van de rechtbank die op grond van
      [artikel 2 van de Faillissementswet][ref2] bevoegd is tot het uitspreken van de faillietverklaring van de gegadigde
      of tot het op die gegadigde of inschrijver van toepassing verklaren van de schuldsaneringsregeling natuurlijke
      personen.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel2
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '45'
        paragraaf: '12'
      - id: ref2
        bwb_id: BWBR0001860
        artikel: '2'
  - number: '46.2'
    text: |-
      Als instantie die bevoegd is tot het afgeven van een verklaring waaruit blijkt dat een gegadigde of inschrijver niet
      verkeert in de omstandigheden, bedoeld in [artikel 45, eerste of derde lid, onderdeel c][ref1], geldt Onze Minister
      van Veiligheid en Justitie die op grond van [artikel 35 van de Wet justitiële en strafvorderlijke gegevens][ref2]
      bevoegd is een verklaring omtrent gedrag af te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel35
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '45'
        paragraaf: '12'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '35'
  - number: '46.3'
    text: |-
      Als instantie die bevoegd is tot het afgeven van een verklaring waaruit blijkt dat een gegadigde
      of inschrijver voor een overheidsopdracht niet verkeert in de omstandigheid, bedoeld in
      [artikel 45, derde lid, onderdeel e][ref1], geldt voor zowel de bijdragen ten behoeve van werknemersverzekeringen,
      als voor de bijdragen ten behoeve van de volksverzekeringen, de ontvanger onder wie de gegadigde ressorteert voor
      de inning van belastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel45
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '45'
        paragraaf: '12'
  - number: '46.4'
    text: |-
      Als instantie die bevoegd is tot het afgeven van een bewijsstuk waaruit blijkt dat een gegadigde
      of inschrijver voor een overheidsopdracht niet verkeert in de omstandigheid, bedoeld in
      [artikel 45, derde lid, onderdeel f][ref1], geldt de ontvanger onder wie de gegadigde ressorteert voor de inning
      van belastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel45
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '45'
        paragraaf: '12'
  - number: '46.5'
    text: |-
      Wanneer in het land waarin de gegadigde of inschrijver gevestigd is niet een bewijsstuk of verklaring als bedoeld
      in het eerste tot en met het vierde lid, wordt afgegeven, kan de gegadigde of inschrijver volstaan met een
      verklaring onder ede of een plechtige verklaring die door betrokkene ten overstaan van een bevoegde rechterlijke
      of administratieve instantie, een notaris of een bevoegde beroepsorganisatie van het land van oorsprong of herkomst
      wordt afgelegd.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel46
  - number: '47.1'
    text: |-
      Een ondernemer die aan een overheidsopdracht wenst deel te nemen, kan door een aanbestedende dienst
      worden verzocht aan te tonen dat hij volgens de voorschriften van de lidstaat waar hij is gevestigd, in
      het beroepsregister of in het handelsregister is ingeschreven, of een verklaring onder ede of een attest
      te verstrekken als bedoeld in [bijlage 5, onderdeel A][ref1], voor overheidsopdrachten voor werken, als
      bedoeld in [bijlage 5, onderdeel B][ref2], voor overheidsopdrachten voor leveringen en als bedoeld in
      [bijlage 5, onderdeel C][ref3], voor overheidsopdrachten voor diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0018607
      [ref2]: https://wetten.overheid.nl/BWBR0018607
      [ref3]: https://wetten.overheid.nl/BWBR0018607
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0018607
      - id: ref2
        bwb_id: BWBR0018607
      - id: ref3
        bwb_id: BWBR0018607
  - number: '47.2'
    text: |-
      Bij procedures voor het gunnen van overheidsopdrachten voor diensten kan een aanbestedende dienst, indien de
      gegadigden of de inschrijvers over een bijzondere vergunning dienen te beschikken of indien zij lid van een
      bepaalde organisatie dienen te zijn om in hun land van herkomst de betrokken dienst te kunnen verlenen, verlangen
      dat zij aantonen dat zij over deze vergunning beschikken, of lid van de bedoelde organisatie zijn.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel47
  - number: '48.1'
    text: 'Een ondernemer kan zijn financiële en economische draagkracht aantonen door middel van:'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel48
  - number: 48.1.a
    text: passende bankverklaringen of het bewijs van een verzekering tegen beroepsrisico’s,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel48
  - number: 48.1.b
    text: |-
      overlegging van balansen of van balansuittreksels, indien de wetgeving van het land waar de ondernemer is
      gevestigd, de bekendmaking van balansen voorschrijft, of
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel48
  - number: 48.1.c
    text: |-
      een verklaring betreffende de totale omzet en de omzet van de bedrijfsactiviteit die het voorwerp van de
      overheidsopdracht is, over ten hoogste de laatste drie beschikbare boekjaren, afhankelijk van de oprichtingsdatum
      of van de datum waarop de ondernemer met zijn bedrijvigheid is begonnen, voor zover de betrokken omzetcijfers
      beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel48
  - number: '48.2'
    text: |-
      Een ondernemer kan zich voor een bepaalde overheidsopdracht beroepen op de draagkracht van andere natuurlijke
      personen of rechtspersonen, ongeacht de juridische aard van zijn banden met die natuurlijke personen of
      rechtspersonen. Een ondernemer toont in dat geval bij de aanbestedende dienst aan dat hij werkelijk kan beschikken
      over de voor de uitvoering van de overheidsopdracht noodzakelijke middelen van die natuurlijke personen of
      rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel48
  - number: '48.3'
    text: |-
      Onder dezelfde voorwaarden als bedoeld in het tweede lid, kan een samenwerkingsverband van ondernemers als bedoeld
      in [artikel 4][ref1] zich beroepen op de draagkracht van de deelnemers aan het samenwerkingsverband of van andere
      natuurlijke personen of rechtspersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel4
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '4'
        paragraaf: '2'
  - number: '48.4'
    text: |-
      Een aanbestedende dienst geeft in de aankondiging van de overheidsopdracht of in de uitnodiging tot inschrijving
      aan welke referenties, genoemd in het eerste lid, en andere bewijsstukken overgelegd dienen te worden.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel48
  - number: '48.5'
    text: |-
      Wanneer de ondernemer om gegronde redenen niet in staat is de door de aanbestedende dienst gevraagde referenties
      over te leggen, kan hij zijn economische en financiële draagkracht aantonen met andere bescheiden die de
      aanbestedende dienst geschikt acht.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel48
  - number: '49.1'
    text: |-
      Een aanbestedende dienst beoordeelt en controleert de technische bekwaamheid of beroepsbekwaamheid van de
      ondernemers op basis van het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel49
  - number: '49.2'
    text: |-
      Ondernemers kunnen hun technische bekwaamheid op een of meer van de volgende manieren, afhankelijk van de aard, de
      hoeveelheid of omvang en het doel van de werken, leveringen of diensten, aantonen:
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel49
  - number: 49.2.a
    text: |-
      aan de hand van een lijst van de werken die de afgelopen vijf jaar zijn verricht, welke lijst vergezeld gaat van
      certificaten die bewijzen dat de belangrijkste werken naar behoren zijn uitgevoerd en waarin het bedrag van de
      werken, de plaats en het tijdstip waarop ze zijn uitgevoerd vermeld wordt, en waarin wordt aangegeven of de werken
      volgens de regels der kunst zijn uitgevoerd en tot een goed einde zijn gebracht en die door de bevoegde instantie
      rechtstreeks aan de aanbestedende dienst worden toegezonden,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel49
  - number: 49.2.b
    text: |-
      aan de hand van een lijst van de voornaamste leveringen of diensten die gedurende de afgelopen drie jaar werden
      verricht, met vermelding van het bedrag en de datum en van de publiek- of privaatrechtelijke instanties waarvoor
      zij bestemd waren. De leveringen en diensten worden aangetoond in het geval van leveringen of diensten voor
      een aanbestedende dienst, door certificaten die de bevoegde autoriteit heeft afgegeven of medeondertekend of
      in het geval van leveringen of diensten voor een particuliere afnemer, door certificaten van de afnemer of, bij
      ontstentenis daarvan, eenvoudigweg door een verklaring van de ondernemer,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel49
  - number: 49.2.c
    text: |-
      aan de hand van een opgave van de al dan niet tot de onderneming van de ondernemer behorende technici of
      technische organen, in het bijzonder van die welke belast zijn met de kwaliteitscontrole en, in het geval van
      overheidsopdrachten voor werken, van die welke de aannemer ter beschikking zullen staan om de werken uit te voeren,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel49
  - number: 49.2.d
    text: |-
      aan de hand van een beschrijving van de technische uitrusting van de leverancier of de dienstverlener, van de
      maatregelen die hij treft om de kwaliteit te waarborgen en de mogelijkheden die hij biedt ten aanzien van ontwerpen
      en onderzoek,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel49
  - number: 49.2.e
    text: |-
      in het geval van complexe producten of diensten of wanneer deze aan een bijzonder doel dienen te beantwoorden,
      aan de hand van een controle door de aanbestedende dienst of, in diens naam, door een bevoegd officieel orgaan van
      het land waar de leverancier of de dienstverlener gevestigd is, onder voorbehoud van instemming door dit orgaan;
      deze controle heeft betrekking op de productiecapaciteit van de leverancier of op de technische capaciteit van de
      dienstverlener en, zo nodig, op diens mogelijkheden inzake ontwerpen en onderzoek en de maatregelen die hij treft
      om de kwaliteit te waarborgen,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel49
  - number: 49.2.f
    text: |-
      aan de hand van de studie- en beroepsdiploma’s van de dienstverlener of de aannemer of het kaderpersoneel van de
      onderneming en in het bijzonder van degenen die met de dienstverlening of de leiding van de werken zijn belast,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel49
  - number: 49.2.g
    text: |-
      voor overheidsopdrachten voor werken of overheidsopdrachten voor diensten, aan de hand van de vermelding
      van de maatregelen inzake milieubeheer die de ondernemer kan toepassen in het kader van de uitvoering van de
      overheidsopdracht,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel49
  - number: 49.2.h
    text: |-
      aan de hand van een verklaring betreffende de gemiddelde jaarlijkse personeelsbezetting van de onderneming van de
      dienstverlener of de aannemer, en de omvang van het kaderpersoneel gedurende de laatste drie jaar,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel49
  - number: 49.2.i
    text: |-
      aan de hand van een verklaring welke de outillage, het materieel en de technische uitrusting vermeldt waarover de
      dienstverlener of de aannemer voor het verlenen van de overheidsopdracht beschikt,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel49
  - number: 49.2.j
    text: |-
      aan de hand van de omschrijving van het gedeelte van de overheidsopdracht dat de dienstverlener eventueel in
      onderaanneming wil geven, of
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel49
  - number: 49.2.k
    text: |-
      wat de te leveren producten betreft aan de hand van monsters, beschrijvingen of foto’s, waarvan op verzoek van
      de aanbestedende dienst de echtheid kan worden aangetoond of aan de hand van certificaten die door een erkende
      organisatie zijn opgesteld, waarin wordt verklaard dat duidelijk door referenties geïdentificeerde producten aan
      bepaalde specificaties of normen beantwoorden.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel49
  - number: '49.3'
    text: |-
      Een ondernemer kan zich voor bepaalde overheidsopdrachten beroepen op de bekwaamheid van andere natuurlijke
      personen of rechtspersonen, ongeacht de juridische aard van zijn banden met die natuurlijke personen of
      rechtspersonen. In dat geval toont hij de aanbestedende dienst aan dat hij kan beschikken over de voor de
      uitvoering van de overheidsopdracht noodzakelijke middelen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel49
  - number: '49.4'
    text: |-
      Onder de voorwaarden, genoemd in het derde lid, kan een samenwerkingsverband van ondernemers zich beroepen op de
      bekwaamheid van de deelnemers aan het samenwerkingsverband of van andere natuurlijke personen of rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel49
  - number: '49.5'
    text: |-
      Bij procedures voor het gunnen van overheidsopdrachten voor leveringen, waarvoor plaatsings- of
      installatiewerkzaamheden nodig zijn, overheidsopdrachten voor diensten of overheidsopdrachten voor werken, kan de
      geschiktheid van ondernemers om die diensten te verlenen of die installatiewerkzaamheden of werken uit te voeren,
      worden beoordeeld aan de hand van met name hun praktische vaardigheden, technische kennis, efficiëntie, ervaring
      en betrouwbaarheid.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel49
  - number: '49.6'
    text: |-
      De aanbestedende dienst geeft in de aankondiging of in de uitnodiging tot indiening van een inschrijving aan, welke
      van de in het tweede lid genoemde referenties hij verlangt.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel49
  - number: '50.1'
    text: |-
      Indien een aanbestedende dienst de overlegging verlangt van door onafhankelijke instanties opgestelde verklaringen
      dat de ondernemer aan bepaalde kwaliteitsnormen voldoet, verwijst hij naar kwaliteitsbewakingsregelingen die op de
      Europese normenreeksen op dit terrein zijn gebaseerd en die zijn gecertificeerd door instanties die voldoen aan de
      Europese normenreeks voor certificering.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel50
  - number: '50.2'
    text: |-
      Een aanbestedende dienst erkent gelijkwaardige certificaten van in andere lidstaten van de Europese Unie gevestigde
      instanties. Een aanbestedende dienst aanvaardt eveneens andere bewijzen inzake gelijkwaardige maatregelen op het
      gebied van de kwaliteitsbewaking van ondernemers.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel50
  - number: '51.1'
    text: |-
      Indien een aanbestedende dienst in de gevallen, bedoeld in [artikel 49, tweede lid, onderdeel g][ref1], de
      overlegging verlangt van een door onafhankelijke instanties opgestelde verklaring dat de ondernemer aan bepaalde
      normen inzake milieubeheer voldoet, verwijst hij naar het communautair milieubeheer- en milieuauditsysteem of
      naar normen inzake milieubeheer die gebaseerd zijn op de desbetreffende Europese of internationale normen die
      gecertificeerd zijn door erkende organisaties of organisaties die beantwoorden of aan de relevante Europese of
      internationale normen voor certificatie.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel49
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '49'
        paragraaf: '12'
  - number: '51.2'
    text: |-
      Een aanbestedende dienst erkent gelijkwaardige certificaten van in andere lidstaten gevestigde instanties.
      Hij aanvaardt tevens andere bewijzen inzake gelijkwaardige maatregelen op het gebied van milieubeheer die de
      ondernemers overleggen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel51
  - number: '52'
    text: |-
      Een aanbestedende dienst kan verlangen dat de ondernemers de uit hoofde van de [artikelen 45 tot en met 51][ref1]
      overgelegde verklaringen en bescheiden aanvullen of nader toelichten.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel45
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '45'
        paragraaf: '12'
  - number: '53.1'
    text: |-
      Een aanbestedende dienst mag de opneming op een lijst of certificering als bedoeld in artikel 52 van [richtlijn nr.
      2004/18/EG](32004L0018) niet aan ondernemers uit andere lidstaten voorschrijven als voorwaarde voor deelneming aan
      een overheidsopdracht.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel53
  - number: '53.2'
    text: |-
      De ondernemers die op een officiële lijst zijn opgenomen of in het bezit zijn van een certificaat, kunnen bij
      een overheidsopdracht een door de bevoegde autoriteit afgegeven bewijs van inschrijving of het door de bevoegde
      certificeringsinstelling afgegeven certificaat aan de aanbestedende dienst overleggen. Op dit bewijs of dit
      certificaat worden de referenties vermeld op grond waarvan de inschrijving op de lijst of de certificering mogelijk
      was, en de classificatie op deze lijst.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel53
  - number: '53.3'
    text: |-
      De door de bevoegde autoriteit in een andere lidstaat van de Europese Unie waarin de ondernemer is
      gevestigd, bevestigde opneming op een officiële lijst of het door de certificeringsinstelling afgegeven
      certificaat vormt voor een aanbestedende dienst een vermoeden van geschiktheid met betrekking tot de eisen
      genoemd in de [artikelen 45, eerste lid en derde lid, onderdelen a tot en met d en g][ref1], [47][ref2],
      [48, eerste lid, onderdelen b en c][ref3], [49, tweede lid, onderdelen a tot en met f en h tot en met k][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0018607#Artikel48
      [ref4]: https://wetten.overheid.nl/BWBR0018607#Artikel49
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '45'
        paragraaf: '12'
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '47'
        paragraaf: '12'
      - id: ref3
        bwb_id: BWBR0018607
        artikel: '48'
        paragraaf: '12'
      - id: ref4
        bwb_id: BWBR0018607
        artikel: '49'
        paragraaf: '12'
  - number: '53.4'
    text: |-
      Een aanbestedende dienst kan de gegevens die uit de opneming op een officiële lijst of de certificering, bedoeld
      in het derde lid, kunnen worden afgeleid, alleen gemotiveerd ter discussie stellen, met dien verstande dat
      met betrekking tot de betaling van socialezekerheidsbijdragen en belastingen en heffingen van een ingeschreven
      ondernemer bij een overheidsopdracht een aanvullende verklaring kan worden verlangd.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel53
  - number: '54.1'
    text: 'Een aanbestedende diensten gunt een overheidsopdracht op grond van:'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel54
  - number: 54.1.a
    text: |-
      criteria die verband houden met het voorwerp van de overheidsopdracht, indien de gunning aan de inschrijver met de
      vanuit het oogpunt van de aanbestedende dienst economisch meest voordelige inschrijving plaatsvindt, of
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel54
  - number: 54.1.b
    text: het criterium de laagste prijs.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel54
  - number: '54.2'
    text: |-
      Een aanbestedende dienst specificeert in het geval, bedoeld in het eerste lid, onderdeel a, in de aankondiging
      van de overheidsopdracht of in het beschrijvend document, het relatieve gewicht van elk van de door hem gekozen
      criteria voor de bepaling van de economisch meest voordelige inschrijving. Dit gewicht kan worden uitgedrukt door
      middel van een marge met een passend verschil tussen minimum en maximum.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel54
  - number: '54.3'
    text: |-
      Wanneer volgens de aanbestedende dienst om aantoonbare redenen geen weging mogelijk is, vermeldt de aanbestedende
      dienst in de aankondiging van de overheidsopdracht of in het beschrijvend document of, bij de concurrentiegerichte
      dialoog, in het beschrijvend document, de criteria in afnemende volgorde van belangrijkheid.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel54
  - number: '55'
    text: |-
      De mededeling van een aanbestedende dienst van een gunningsbeslissing houdt geen aanvaarding in, als bedoeld in
      [artikel 6:217, eerste lid, van het Burgerlijk Wetboek][ref1], van een aanbod van een ondernemer.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel217
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '217'
  - number: '56.1'
    text: |-
      Wanneer voor een bepaalde overheidsopdracht inschrijvingen worden gedaan die in verhouding tot de te verrichten
      werken, leveringen of diensten abnormaal laag lijken, verzoekt de aanbestedende dienst, voordat hij deze
      inschrijvingen kan afwijzen, schriftelijk om de door hem nodig geachte verduidelijkingen over de samenstelling van
      de desbetreffende inschrijving.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel56
  - number: '56.2'
    text: 'De verduidelijkingen, bedoeld in het eerste lid, kunnen in ieder geval verband houden met:'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel56
  - number: 56.2.a
    text: de doelmatigheid van het bouwproces, van het productieproces van de producten of van de dienstverlening,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel56
  - number: 56.2.b
    text: |-
      de gekozen technische oplossingen of uitzonderlijk gunstige omstandigheden waarvan de inschrijver bij de uitvoering
      van de werken, de levering van de producten of het verlenen van de diensten kan profiteren,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel56
  - number: 56.2.c
    text: de originaliteit van het ontwerp van de inschrijver,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel56
  - number: 56.2.d
    text: |-
      de naleving van de bepalingen inzake arbeidsvoorwaarden en arbeidsomstandigheden die gelden op de plaats waar de
      overheidsopdracht wordt uitgevoerd, of
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel56
  - number: 56.2.e
    text: de eventuele ontvangst van staatssteun door de inschrijver.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel56
  - number: '56.3'
    text: |-
      De aanbestedende dienst onderzoekt in overleg met de inschrijver de samenstelling van de desbetreffende
      inschrijving aan de hand van de ontvangen toelichtingen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel56
  - number: '56.4'
    text: |-
      Wanneer een aanbestedende dienst constateert dat een inschrijving abnormaal laag is omdat de inschrijver
      overheidssteun heeft gekregen, kan de inschrijving op die grond worden afgewezen, wanneer de inschrijver
      desgevraagd niet binnen een door de aanbestedende dienst bepaalde voldoende lange termijn kan aantonen dat de
      betrokken steun niet in strijd met de artikelen 87 en 88 van het Verdrag tot oprichting van de Europese Gemeenschap
      is toegekend.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel56
  - number: '56.5'
    text: |-
      Wanneer de aanbestedende dienst in een situatie als bedoeld in het vierde lid een inschrijving afwijst, stelt hij
      de Commissie daarvan in kennis.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel56
  - number: '57.1'
    text: |-
      In het kader van de openbare procedure, de niet-openbare procedure, de procedure van gunning door onderhandelingen,
      in het geval, bedoeld in [artikel 30, eerste lid, onderdeel a][ref1], en in het kader van een dynamisch
      aankoopsysteem kan een aanbestedende dienst de gunning van de overheidsopdracht vooraf laten gaan door een
      elektronische veiling, indien de nauwkeurige specificaties voor de overheidsopdracht kunnen worden opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel30
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '30'
        paragraaf: '8'
  - number: '57.2'
    text: |-
      In het kader van een raamovereenkomst die met meerdere ondernemers is gesloten als bedoeld in
      [artikel 32, tiende lid, onderdeel b][ref1], kan een aanbestedende dienst de gunning van de overheidsopdracht
      vooraf laten gaan door een elektronische veiling, indien de nauwkeurige specificaties voor de overheidsopdracht
      kunnen worden opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel32
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '32'
        paragraaf: '8'
  - number: '57.3'
    text: |-
      [Artikel 54, eerste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel54
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '54'
        paragraaf: '12'
  - number: '57.4'
    text: |-
      Een aanbestedende dienst die gebruik maakt van de elektronische veiling, meldt dit in de aankondiging van de
      overheidsopdracht.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel57
  - number: '57.5'
    text: 'Het beschrijvend document bevat ten minste de volgende informatie:'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel57
  - number: 57.5.a
    text: |-
      de elementen waarvan de waarden vallen onder de elektronische veiling, voor zover deze elementen kwantificeerbaar
      zijn zodat ze kunnen worden uitgedrukt in cijfers of procenten,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel57
  - number: 57.5.b
    text: |-
      de eventuele limieten van de waarden die kunnen worden ingediend, zoals zij voortvloeien uit de specificaties van
      het voorwerp van de overheidsopdracht,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel57
  - number: 57.5.c
    text: |-
      de informatie die tijdens de elektronische veiling ter beschikking van de inschrijvers zal worden gesteld en het
      tijdstip waarop die informatie ter beschikking zal worden gesteld,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel57
  - number: 57.5.d
    text: relevante informatie betreffende het verloop van de elektronische veiling,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel57
  - number: 57.5.e
    text: |-
      de voorwaarden waaronder de inschrijvers een bod kunnen doen en met name de vereiste minimumverschillen die voor de
      biedingen vereist zijn, of
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel57
  - number: 57.5.f
    text: |-
      relevante informatie betreffende het gebruikte elektronische systeem en de nadere technische bepalingen en
      specificaties voor de verbinding.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel57
  - number: '57.6'
    text: |-
      Alvorens over te gaan tot de elektronische veiling, verricht een aanbestedende dienst een eerste, volledige
      beoordeling van de inschrijvingen aan de hand van de gunningscriteria en de weging daarvan, zoals die zijn
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel57
  - number: '57.7'
    text: |-
      Een aanbestedende dienst waarborgt dat alle inschrijvers die een aan de eisen beantwoordende inschrijving hebben
      gedaan, tegelijkertijd langs elektronische weg worden uitgenodigd om nieuwe prijzen of nieuwe waarden in te dienen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel57
  - number: '57.8'
    text: |-
      Een aanbestedende dienst waarborgt dat het verzoek, bedoeld in het zevende lid, alle relevante informatie bevat
      voor de individuele verbinding met het gebruikte elektronische systeem en het tijdstip en het aanvangsuur van de
      elektronische veiling preciseert.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel57
  - number: '57.9'
    text: Een aanbestedende dienst kan de elektronische veiling in verschillende fasen laten verlopen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel57
  - number: '57.10'
    text: |-
      Een aanbestedende dienst verstuurt de uitnodigingen voor een elektronische veiling uiterlijk twee werkdagen voor de
      aanvang van de veiling.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel57
  - number: '57.11'
    text: |-
      Wanneer een aanbestedende dienst voor de gunning het criterium van de economisch meest voordelige inschrijving
      hanteert, voegt hij bij de uitnodiging:
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel57
  - number: 57.11.a
    text: het resultaat van de volledige beoordeling van de inschrijving van de betrokken inschrijver, en
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel57
  - number: 57.11.b
    text: |-
      de wiskundige formule die tijdens de elektronische veiling de automatische herklasseringen naar gelang van de
      ingediende nieuwe prijzen of nieuwe waarden zal bepalen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel57
  - number: '57.12'
    text: |-
      In de formule, bedoeld in het elfde lid, onderdeel b, verwerkt de aanbestedende dienst het gewicht dat aan alle
      vastgestelde criteria wordt toegekend om de economisch meest voordelige inschrijving te bepalen. Eventuele marges
      worden daartoe door de aanbestedende dienst vooraf in een bepaalde waarde uitgedrukt.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel57
  - number: '57.13'
    text: |-
      Wanneer een aanbestedende dienst varianten toestaat, verstrekt de aanbestedende dienst voor een variant de
      afzonderlijke formule.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel57
  - number: '57.14'
    text: |-
      Tijdens alle fases van de elektronische veiling deelt de aanbestedende dienst onverwijld aan alle inschrijvers
      ten minste de informatie mee die de inschrijvers de mogelijkheid biedt op elk moment hun respectieve klassering
      te kennen. Indien dat in het beschrijvend document vermeld is, kan de aanbestedende dienst ook andere informatie
      betreffende andere ingediende prijzen of waarden meedelen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel57
  - number: '57.15'
    text: |-
      Een aanbestedende dienst kan tevens op ieder ogenblik meedelen hoeveel inschrijvers aan de fase van de veiling
      deelnemen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel57
  - number: '57.16'
    text: |-
      Een aanbestedende dienst deelt tijdens het verloop van de fasen van de elektronische veiling in geen geval de
      identiteit van de inschrijvers mee.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel57
  - number: '57.17'
    text: 'Een aanbestedende dienst kan de elektronische veiling afsluiten door:'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel57
  - number: 57.17.a
    text: |-
      in de uitnodiging om deel te nemen aan de veiling een vooraf vastgestelde datum en een vooraf vastgesteld tijdstip
      voor de sluiting aan te geven,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel57
  - number: 57.17.b
    text: |-
      de veiling af te sluiten wanneer hij geen nieuwe prijzen meer ontvangt die beantwoorden aan de vereisten
      betreffende de minimumverschillen, waarbij hij in de uitnodiging om deel te nemen aan de veiling de termijn die hij
      na ontvangst van de laatste aanbieding in acht zal nemen alvorens de veiling te sluiten preciseert, of
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel57
  - number: 57.17.c
    text: |-
      de veiling af te sluiten wanneer alle fasen van de veiling die in de uitnodiging om deel te nemen aan de veiling
      zijn vermeld, afgehandeld zijn.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel57
  - number: '57.18'
    text: |-
      Wanneer een aanbestedende dienst besloten heeft om de elektronische veiling overeenkomstig het zeventiende lid,
      onderdeel c, af te sluiten in combinatie met de regelingen, bedoeld in het zeventiende lid, onderdeel b, vermeldt
      hij in de uitnodiging om deel te nemen aan de veiling het tijdschema voor elk van de fasen van de veiling.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel57
  - number: '57.19'
    text: |-
      Na de sluiting van de elektronische veiling gunt een aanbestedende dienst de overheidsopdracht overeenkomstig
      [artikel 54][ref1] op basis van de resultaten van de elektronische veiling.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel54
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '54'
        paragraaf: '12'
  - number: '57.20'
    text: |-
      Een aanbestedende dienst maakt geen misbruik van de methode van de elektronische veiling, noch gebruikt hij de
      methode om concurrentie te beletten, te beperken of te vervalsen of om wijzigingen aan te brengen in het voorwerp
      van de overheidsopdracht zoals omschreven in de aankondiging van de overheidsopdracht en vastgelegd in het
      beschrijvend document.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel57
  - number: '58.1'
    text: |-
      De [artikelen 55][ref1], [58, tweede lid tot en met 63][ref2] zijn van overeenkomstige toepassing op alle door
      aanbestedende diensten gesloten concessieovereenkomsten voor openbare werken, waarvan de waarde, exclusief
      omzetbelasting het bedrag genoemd in artikel 56 van [richtlijn nr. 2004/18/EG](32004L0018) of meer bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel58
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '55'
        paragraaf: '12'
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '58'
        paragraaf: '14'
  - number: '58.2'
    text: |-
      De waarde, bedoeld in het eerste lid, wordt berekend volgens de voorschriften voor overheidsopdrachten voor werken,
      bedoeld in [artikel 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel9
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '9'
        paragraaf: '3'
  - number: '59.1'
    text: Dit besluit is niet van toepassing op concessieovereenkomsten voor openbare werken die
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel59
  - number: 59.1.a
    text: |-
      gesloten zijn onder dezelfde voorwaarden als de overheidsopdrachten voor diensten, bedoeld in de
      [artikelen 12][ref1], [13][ref2] en [14][ref3], of


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0018607#Artikel14
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '12'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '13'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0018607
        artikel: '14'
        paragraaf: '4'
  - number: 59.1.b
    text: |-
      gesloten zijn door een aanbestedende dienst die een of meer activiteiten als bedoeld in
      [artikelen 3 tot en met 7 van het Besluit aanbestedingen speciale sectoren][ref1] uitoefent, indien deze
      concessieovereenkomsten met het oog op de uitoefening van deze activiteiten zijn gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel3
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '3'
  - number: '59.2'
    text: |-
      [Artikel 11][ref1] is van overeenkomstige toepassing op concessieovereenkomsten voor openbare werken.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel11
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '11'
        paragraaf: '4'
  - number: '60.1'
    text: |-
      Een aanbestedende dienst, die gebruik wil maken van een concessieovereenkomst voor openbare werken, geeft zijn
      voornemen hiertoe in een aankondiging te kennen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel60
  - number: '60.2'
    text: |-
      Een aankondiging betreffende concessieovereenkomsten voor openbare werken bevat de inlichtingen, genoemd in
      [bijlage 4, onderdeel C][ref1], en alle door de aanbestedende dienst nuttig geachte inlichtingen in het formulier
      volgens het model dat door de Commissie overeenkomstig de in artikel 77, tweede lid, van [richtlijn 2004/18/EG]
      (32004L0018) bedoelde procedure is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018607
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0018607
  - number: '60.3'
    text: |-
      [Artikel 36, tweede tot en met negende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel36
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '36'
        paragraaf: '9'
  - number: '61.1'
    text: |-
      Een aanbestedende dienst, die gebruik wil maken van een concessieovereenkomst voor openbare werken, stelt voor
      de indiening van de inschrijvingen op de concessie een termijn vast van ten minste 52 dagen, te rekenen vanaf de
      verzenddatum van de aankondiging. [Artikel 38, zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel38
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '38'
        paragraaf: '10'
  - number: '61.2'
    text: |-
      [Artikel 38, tiende lid][ref1], is van overeenkomstige toepassing op de termijn voor de ontvangst van de
      inschrijvingen, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel38
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '38'
        paragraaf: '10'
  - number: '62.1'
    text: 'Een aanbestedende dienst:'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel62
  - number: 62.1.a
    text: |-
      verplicht de houder van een concessie voor openbare werken overheidsopdrachten van ten minste 30 procent
      van de totale waarde van de werken waarvoor een concessie wordt verleend, aan derden uit te besteden. Dit
      minimumpercentage dient in de concessieovereenkomst voor openbare werken te worden vermeld, of
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel62
  - number: 62.1.b
    text: |-
      verzoekt de gegadigden of inschrijvers voor de concessie zelf in hun inschrijvingen aan te geven welk percentage
      van de totale waarde van de werken waarvoor de concessie wordt verleend, zij aan derden denken uit te besteden.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel62
  - number: '62.2'
    text: |-
      Een aanbestedende dienst waarborgt dat de houder van een door hem verleende concessie voor openbare werken die zelf
      geen aanbestedende dienst is, de [artikelen 64 tot en met 66][ref1] in acht neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel64
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '64'
        paragraaf: '14'
  - number: '63.1'
    text: |-
      Dit besluit is niet van toepassing op aanvullende werken die noch in het aanvankelijk overwogen ontwerp van de
      concessie noch in het oorspronkelijke contract waren opgenomen en die als gevolg van onvoorziene omstandigheden
      voor de uitvoering van het werk zoals dat daarin is beschreven en dat door de aanbestedende dienst aan de
      concessiehouder wordt opgedragen, noodzakelijk zijn geworden, mits:
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel63
  - number: 63.1.a
    text: |-
      zij worden gegund aan de ondernemer die dit werk uitvoert wanneer deze aanvullende werken uit technisch
      of economisch oogpunt niet los van de oorspronkelijke overheidsopdracht kunnen worden uitgevoerd zonder de
      aanbestedende diensten grote ongemakken te bezorgen, of
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel63
  - number: 63.1.b
    text: |-
      wanneer deze werken, hoewel zij van de uitvoering van de oorspronkelijke overheidsopdracht kunnen worden
      gescheiden, voor de vervolmaking ervan strikt noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel63
  - number: '63.2'
    text: |-
      Het totale bedrag van de voor de aanvullende diensten of werken gegunde overheidsopdrachten, bedoeld in het eerste
      lid, mag niet hoger zijn dan 50 procent van het bedrag van het hoofdwerk waarvoor de concessie is verleend.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel63
  - number: '64.1'
    text: |-
      Een houder van een concessie voor openbare werken, die zelf geen aanbestedende dienst is, past bij de gunning van
      overheidsopdrachten voor werken bij derden de voorschriften voor de mededeling, bedoeld in [artikel 65][ref1],
      toe wanneer de waarde van deze overheidsopdrachten, exclusief omzetbelasting, het bedrag genoemd in artikel 63,
      eerste lid, van [richtlijn nr. 2004/18/EG](32004L0018) of meer bedraagt. Mededeling is niet vereist wanneer een
      overheidsopdracht voor werken aan de voorwaarden, genoemd in [artikel 31][ref2], voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel31
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '65'
        paragraaf: '14'
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '31'
        paragraaf: '8'
  - number: '64.2'
    text: |-
      Een houder van een concessie, bedoeld in het eerste lid, berekent de waarde van de overheidsopdrachten volgens
      [artikel 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel9
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '9'
        paragraaf: '3'
  - number: '64.3'
    text: |-
      Een samenwerkingsverband van ondernemingen dat gevormd is om de concessie te verwerven, of met dit
      samenwerkingsverband verbonden ondernemingen, worden niet als derden als bedoeld in het eerste lid beschouwd.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel64
  - number: '64.4'
    text: |-
      Een onderneming die zich inschrijft voor een concessie, voegt bij de inschrijving een limitatieve lijst van
      verbonden ondernemingen en deelt de aanbestedende dienst de wijzigingen in deze lijst van verbonden ondernemingen
      steeds onverwijld mee.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel64
  - number: '65.1'
    text: |-
      Een houder van een concessie voor openbare werken die zelf geen aanbestedende dienst is en die een
      overheidsopdracht voor werken aan een derde wenst te gunnen, geeft zijn voornemen hiertoe in een aankondiging te
      kennen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel65
  - number: '65.2'
    text: |-
      De aankondiging, bedoeld in het eerste lid, bevat de inlichtingen, genoemd in [bijlage 4, onderdeel C][ref1], en
      alle door de houder van de concessie voor openbare werken nuttig geachte inlichtingen in het formulier volgens het
      model dat door de Commissie overeenkomstig de in artikel 77, tweede lid, van [richtlijn 2004/18/EG](32004L0018)
      bedoelde procedure is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018607
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0018607
  - number: '65.3'
    text: |-
      Een aanbestedende dienst deelt de aankondiging, bedoeld in het tweede lid, overeenkomstig
      [artikel 36, tweede tot en met negende lid][ref1], mee.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel36
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '36'
        paragraaf: '9'
  - number: '66'
    text: |-
      Bij overheidsopdrachten voor werken die worden gegund door een houder van een concessie voor openbare werken die
      zelf geen aanbestedende dienst is, bedraagt de door de concessiehouder vast te stellen termijn voor de ontvangst
      van de aanvragen tot deelneming ten minste 37 dagen, te rekenen vanaf de verzenddatum van de aankondiging van
      de overheidsopdracht, en de termijn voor de ontvangst van de inschrijvingen ten minste 40 dagen, te rekenen
      vanaf de verzenddatum van de aankondiging van de overheidsopdracht of van de uitnodiging tot inschrijving.
      [Artikel 38, zevende tot en met tiende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel38
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '38'
        paragraaf: '10'
  - number: '67'
    text: |-
      Een aanbestedende dienst stelt de voorschriften voor het uitschrijven van een prijsvraag vast overeenkomstig de
      [artikelen 68 tot en met 75][ref1] en stelt deze voorschriften ter beschikking aan belangstellende ondernemers.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel68
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '68'
        paragraaf: '15'
  - number: '68.1'
    text: |-
      De [artikelen 68 tot en met 75][ref1] zijn van toepassing op een prijsvraag door een aanbestedende dienst, bedoeld
      in [artikel 7, onderdelen a, onder 1°, en b, onder 1° en 3°][ref2] voor het gunnen van een overheidsopdracht
      voor diensten, of waarin prijzengeld of een vergoeding wordt betaald, wanneer de geraamde waarde van de
      overheidsopdracht voor diensten, van het prijzengeld of van de vergoeding ten minste gelijk is aan het bedrag dat
      ingevolge [artikel 7, onderdelen a, onder 1°, en b, onder 1° en 3°][ref3] op de betrokken aanbestedende dienst
      en de betrokken diensten van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0018607#Artikel7
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '68'
        paragraaf: '15'
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '7'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0018607
        artikel: '7'
        paragraaf: '3'
  - number: '68.2'
    text: |-
      [Artikel 9, tweede lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel9
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '9'
        paragraaf: '3'
  - number: '68.3'
    text: |-
      Indien een aanbestedende dienst in de voorschriften van de prijsvraag niet uitsluit dat gunning van de
      overheidsopdracht geschiedt volgens de procedure, bedoeld in [artikel 31, derde lid][ref1], wordt bij de bepaling
      van het totale bedrag van het prijzengeld of de vergoeding aan de deelnemers, bedoeld in het eerste lid, onderdeel
      b, de waarde meegerekend van de overheidsopdracht, exclusief omzetbelasting, die later kan worden gegund.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel31
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '31'
        paragraaf: '8'
  - number: '69'
    text: |-
      De [artikelen 11 tot en met 14][ref1] zijn van overeenkomstige toepassing op prijsvragen als bedoeld in
      [artikel 68, eerste lid, onderdeel b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel68
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '11'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '68'
        paragraaf: '15'
  - number: '70.1'
    text: |-
      Een aanbestedende dienst die een prijsvraag wil uitschrijven, publiceert hiertoe een aankondiging van een
      prijsvraag.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel70
  - number: '70.2'
    text: |-
      Een aanbestedende dienst die een prijsvraag heeft uitgeschreven stelt een aankondiging betreffende de resultaten
      van de prijsvraag op.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel70
  - number: '70.3'
    text: |-
      Indien openbaarmaking van de gegevens over de uitslag van de prijsvraag de toepassing van de wet in de weg zou
      staan, met het openbaar belang in strijd zou zijn, de rechtmatige commerciële belangen van een publiekrechtelijke
      of privaatrechtelijke onderneming zou kunnen schaden of afbreuk aan de eerlijke mededinging tussen dienstverleners
      zou kunnen doen, behoeft de aanbestedende dienst deze gegevens niet mee te delen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel70
  - number: '71.1'
    text: |-
      De aankondiging, bedoeld in [artikel 70, eerste en tweede lid][ref1], bevat de inlichtingen, genoemd in
      [bijlage 4, onderdeel D][ref2], en wordt opgesteld in de vorm van het formulier volgens het model dat door de
      Commissie overeenkomstig de in artikel 77, tweede lid, van [richtlijn 2004/18/EG](32004L0018) bedoelde procedure is
      vastgesteld en gezonden aan de Commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0018607
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '70'
        paragraaf: '15'
      - id: ref2
        bwb_id: BWBR0018607
  - number: '71.2'
    text: |-
      Op de aankondiging, bedoeld in het eerste lid, is [artikel 36, tweede tot en met achtste lid][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel36
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '36'
        paragraaf: '9'
  - number: '72.1'
    text: |-
      [Artikel 42, eerste tot en met derde, en vijfde lid][ref1], is van overeenkomstige toepasssing op mededelingen
      betreffende een prijsvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel42
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '42'
        paragraaf: '11'
  - number: '72.2'
    text: |-
      De jury neemt na afloop van de voor de indiening van plannen en ontwerpen gestelde termijn kennis van de inhoud
      daarvan.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel72
  - number: '72.3'
    text: |-
      [Artikel 42, zesde tot en met elfde lid][ref1], zijn van overeenkomstige toepassing op de middelen voor
      elektronische ontvangst van plannen en ontwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel42
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '42'
        paragraaf: '11'
  - number: '73.1'
    text: |-
      Bij een prijsvraag met een beperkt aantal deelnemers stelt een aanbestedende dienst duidelijke en niet-
      discriminerende selectiecriteria vast.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel73
  - number: '73.2'
    text: |-
      Een aanbestedende dienst waarborgt dat in alle gevallen met het aantal kandidaten dat wordt uitgenodigd om aan de
      prijsvraag deel te nemen een daadwerkelijke mededinging wordt gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel73
  - number: '74.1'
    text: |-
      Een aanbestedende dienst waarborgt dat de jury bestaat uit natuurlijke personen die onafhankelijk van de deelnemers
      aan de prijsvraag zijn.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel74
  - number: '74.2'
    text: |-
      Wanneer een aanbestedende dienst van de deelnemers aan een prijsvraag een bijzondere beroepskwalificatie eist,
      waarborgt hij dat ten minste een derde van de juryleden dezelfde kwalificatie of een gelijkwaardige kwalificatie
      heeft.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel74
  - number: '75.1'
    text: De jury is onafhankelijk.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel75
  - number: '75.2'
    text: |-
      De jury onderzoekt de projecten op basis van door de gegadigden anoniem voorgelegde ontwerpen en op grond van de
      criteria die in de aankondiging van de prijsvraag zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel75
  - number: '75.3'
    text: |-
      De jury stelt een door haar leden ondertekend verslag op met de door haar op basis van de merites van elk project
      vastgestelde rangorde van de projecten, vergezeld van haar opmerkingen en eventuele punten die verduidelijking
      behoeven.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel75
  - number: '75.4'
    text: De jury eerbiedigt de anonimiteit van gegadigden totdat het oordeel van de jury bekend is gemaakt.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel75
  - number: '75.5'
    text: |-
      De jury kan gegadigden zo nodig uitnodigen om door de jury in haar notulen vermelde vragen te beantwoorden teneinde
      duidelijkheid te verschaffen omtrent bepaalde aspecten van de projecten.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel75
  - number: '75.6'
    text: |-
      Een aanbestedende dienst waarborgt dat van de dialoog tussen de leden van de jury en de gegadigden volledige
      notulen worden opgesteld.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel75
  - number: '76.1'
    text: |-
      Indien de Commissie toepassing geeft aan de procedures, bedoeld in artikel 3 van [richtlijn nr. 89/665/
      EEG](31989L0665), verleent de betrokken aanbestedende dienst, de subsidie-ontvanger, bedoeld in
      [artikel 8, tweede lid][ref1], of de concessiehouder, bedoeld in [artikel 64, eerste lid][ref2], zijn medewerking
      daaraan overeenkomstig het tweede tot en met het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel64
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '8'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '64'
        paragraaf: '14'
  - number: '76.2'
    text: |-
      Binnen 21 dagen na ontvangst van de kennisgeving van de Commissie van de redenen waarom zij meent dat er een
      duidelijke en kennelijke schending heeft plaatsgevonden, deelt de aanbestedende dienst, de subsidie-ontvanger,
      bedoeld in [artikel 8, tweede lid][ref1], of de concessiehouder, bedoeld in [artikel 64, eerste lid][ref2], de
      Commissie mee:


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel64
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '8'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '64'
        paragraaf: '14'
  - number: 76.2.a
    text: de bevestiging dat de schending ongedaan is gemaakt,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel76
  - number: 76.2.b
    text: een met redenen omklede conclusie waarin toegelicht wordt waarom geen corrigerende actie is ondernomen, of
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel76
  - number: 76.2.c
    text: |-
      een kennisgeving waarin wordt meegedeeld dat de aanbestedingsprocedure hetzij op initiatief van de aanbestedende
      dienst, de subsidie-ontvanger, bedoeld in [artikel 8, tweede lid][ref1], of de concessiehouder, bedoeld in
      [artikel 64, eerste lid][ref2], hetzij in het kader van de uitoefening van de bevoegdheden, genoemd in artikel 2,
      eerste lid, onderdeel a, van [richtlijn nr. 89/665/EEG](31989L0665) is opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel64
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '8'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '64'
        paragraaf: '14'
  - number: '76.3'
    text: |-
      Een met redenen omklede conclusie als bedoeld in het tweede lid, onderdeel b, kan met name worden gebaseerd op het
      feit dat tegen de beweerde schending beroep bij een rechter of beroep als bedoeld in artikel 2, achtste lid, van
      [richtlijn nr. 89/665/EEG](31989L0665) is ingesteld. In dat geval deelt de aanbestedende dienst de Commissie het
      resultaat van deze procedures mee, zodra dit bekend is.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel76
  - number: '76.4'
    text: |-
      In geval van kennisgeving waarbij wordt meegedeeld dat een aanbestedingsprocedure is opgeschort
      overeenkomstig het tweede lid, onderdeel c, stelt de aanbestedende dienst, de subsidie-ontvanger, bedoeld in
      [artikel 8, tweede lid][ref1], of de concessiehouder, bedoeld in [artikel 64, eerste lid][ref2], de Commissie
      ervan in kennis dat de opschorting is ingetrokken of dat een andere aanbestedingsprocedure is ingeleid die geheel
      of gedeeltelijk verband houdt met de voorgaande procedure. Deze nieuwe kennisgeving bevestigt dat de beweerde
      schending ongedaan is gemaakt, of bevat een met redenen omklede conclusie waarin toegelicht wordt waarom geen
      corrigerende actie heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel64
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '8'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '64'
        paragraaf: '14'
  - number: '77.1'
    text: |-
      Onze Minister zendt ieder jaar uiterlijk op 31 oktober aan de Commissie een statistisch overzicht van de in het
      voorgaande jaar door de aanbestedende diensten gegunde overheidsopdrachten, uitgesplitst naar overheidsopdrachten
      voor leveringen, overheidsopdrachten voor diensten en overheidsopdrachten voor werken.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel77
  - number: '77.2'
    text: |-
      Onze Minister vermeldt voor centrale overheidsinstanties als bedoeld in bijlage IV van [richtlijn nr. 2004/18/EG]
      (32004L0018) in het statistische overzicht ten minste:
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel77
  - number: 77.2.a
    text: het aantal en de waarde van de gegunde overheidsopdrachten die onder dit besluit vallen;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel77
  - number: 77.2.b
    text: |-
      het aantal en de totale waarde van de overheidsopdrachten gegund op grond van de afwijkingen van de Overeenkomst
      inzake overheidsopdrachten.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel77
  - number: '77.3'
    text: 'Voorzover mogelijk splitst Onze Minister de in het tweede lid, onderdeel a, genoemde gegevens als volgt uit:'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel77
  - number: 77.3.a
    text: naar de toegepaste procedure voor het gunnen van de overheidsopdrachten;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel77
  - number: 77.3.b
    text: |-
      binnen iedere procedure, de werken overeenkomstig [bijlage 1][ref1], de producten en diensten overeenkomstig
      [bijlage 2][ref2], aangeduid met de categorie van CPV-nomenclatuur.


      [ref1]: https://wetten.overheid.nl/BWBR0018607
      [ref2]: https://wetten.overheid.nl/BWBR0018607
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0018607
      - id: ref2
        bwb_id: BWBR0018607
  - number: 77.3.c
    text: naar de nationaliteit van de ondernemer waaraan de overheidsopdracht is gegund.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel77
  - number: '77.4'
    text: |-
      Voor overheidsopdrachten die zijn gegund door middel van een procedure van gunning door onderhandelingen, splitst
      Onze Minister de gegevens, bedoeld in het tweede lid, onderdeel a, bovendien uit naar de in de [artikelen 29][ref1]
      en [31][ref2] genoemde omstandigheden en worden het aantal en de waarde van de overheidsopdrachten opgegeven die
      zijn gegund per lidstaat en per derde land van vestiging van degenen aan wie de overheidsopdrachten zijn gegund.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel31
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '29'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '31'
        paragraaf: '8'
  - number: '77.5'
    text: |-
      Voor iedere categorie aanbestedende diensten die niet in bijlage IV van [richtlijn nr. 2004/18/EG](32004L0018) is
      opgenomen, vermeldt Onze Minister in het statistische overzicht ten minste:
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel77
  - number: 77.5.a
    text: |-
      het aantal en de waarde van de gegunde overheidsopdrachten, uitgesplitst overeenkomstig het tweede lid, onderdeel
      a,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel77
  - number: 77.5.b
    text: de totale waarde van de gegunde overheidsopdrachten op grond van de afwijkingen van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel77
  - number: '77.6'
    text: |-
      In het statistische overzicht vermeldt Onze Minister ook de andere statistische gegevens die op grond van de
      overeenkomst worden verlangd.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel77
  - number: '77.7'
    text: |-
      Aanbestedende diensten verstrekken Onze Minister de gegevens die deze nodig heeft voor de
      informatieverstrekking aan de Commissie, bedoeld in het eerste tot en met het zesde lid.
      Aanbestedende diensten nemen daarbij, voor zover van toepassing, de nadere voorschriften, bedoeld in
      [artikel 3, tweede lid, van de Raamwet EEG-voorschriften aanbestedingen][ref1], in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0005937#Artikel3
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0005937
        artikel: '3'
  - number: '78.1'
    text: |-
      Onze Minister stelt de Commissie regelmatig in kennis van wijzigingen in de lijst van centrale overheidsinstanties,
      bedoeld in bijlage IV van [richtlijn nr. 2004/18/EG](32004L0018).
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel78
  - number: '78.2'
    text: |-
      Onze Minister stelt de Commissie regelmatig in kennis van wijzigingen in de lijst van publiekrechtelijke
      instellingen, bedoeld in bijlage III van [richtlijn nr. 2004/18/EG](32004L0018).
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel78
  - number: '79'
    text: |-
      In afwijking van [artikel 46, derde lid][ref1], geldt tot 1 januari 2006 als instantie die bevoegd is tot het
      afgeven van een verklaring waaruit blijkt dat een gegadigde of inschrijver voor een overheidsopdracht niet verkeert
      in de omstandigheid, bedoeld in [artikel 45, derde lid, onderdeel e][ref2], voor zover het betreft bijdragen ten
      behoeve van werknemersverzekeringen, het Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel45
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '46'
        paragraaf: '12'
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '45'
        paragraaf: '12'
  - number: '80.1'
    text: |-
      Een wijziging van de bedragen, genoemd in artikel 7 van [richtlijn nr. 2004/18/EG](32004L0018) treedt voor
      de toepassing van [artikel 7 van dit besluit][ref1] in werking met ingang van de dag waarop aan de betrokken
      wijzigingsrichtlijn uitvoering moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel7
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '7'
        paragraaf: '3'
  - number: '80.2'
    text: |-
      Een wijziging van de standaardformulieren uit [richtlijn nr. 2001/78/EG](32001L0078) treedt voor de toepassing
      van de [artikelen 35][ref1] en [36][ref2] van dit besluit in werking met ingang van de dag waarop aan de betrokken
      wijzigingsverordening uitvoering moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel36
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '35'
        paragraaf: '9'
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '36'
        paragraaf: '9'
  - number: '81'
    text: |-
      Het [Besluit overheidsaanbestedingen][ref1] wordt ingetrokken, met dien verstande dat het
      [Besluit overheidsaanbestedingen][ref2] tot uiterlijk 31 januari 2006 van toepassing blijft op de gunning van
      opdrachten waarvoor een aanbestedende dienst heeft verklaard dat het [Besluit overheidsaanbestedingen][ref3] tot
      uiterlijk die datum van toepassing blijft, in:


      [ref1]: https://wetten.overheid.nl/BWBR0006009
      [ref2]: https://wetten.overheid.nl/BWBR0006009
      [ref3]: https://wetten.overheid.nl/BWBR0006009
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0006009
      - id: ref2
        bwb_id: BWBR0006009
      - id: ref3
        bwb_id: BWBR0006009
  - number: 81.a
    text: |-
      een aankondiging als bedoeld in artikel 11, tweede lid, van [richtlijn nr. 93/37/EEG](31993L0037), 9, tweede lid,
      van [richtlijn nr. 93/36/EEG](31993L0036), of 15, tweede lid, van [richtlijn nr. 92/50/EEG](31992L0050), of
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel81
  - number: 81.b
    text: 'een verzoek om inschrijving als bedoeld in:'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel81
  - number: 81.b.1°
    text: artikel 13, tweede lid, van [richtlijn nr. 93/37/EEG](31993L0037),
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel81
  - number: 81.b.2°
    text: artikel 11, tweede lid, van [richtlijn nr. 93/36/EEG](31993L0036), of
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel81
  - number: 81.b.3°
    text: artikel 19, tweede lid, van [richtlijn nr. 92/50/EEG](31992L0050).
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel81
  - number: '82'
    text: |-
      Dit besluit treedt in werking met ingang van de eerste dag van de derde maand na de datum van uitgifte van het
      Staatsblad waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel82
  - number: '83'
    text: 'Dit besluit wordt aangehaald als: Besluit aanbestedingsregels voor overheidsopdrachten.'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel83
