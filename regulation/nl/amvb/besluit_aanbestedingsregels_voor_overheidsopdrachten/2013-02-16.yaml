      - id: ref5
        bwb_id: BWBR0018607
        artikel: '39'
        paragraaf: '10'
      - id: ref6
        bwb_id: BWBR0018607
        artikel: '41'
        paragraaf: '11'
      - id: ref7
        bwb_id: BWBR0018607
