---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_aanbestedingsregels_voor_overheidsopdrachten
regulatory_layer: AMVB
publication_date: '2012-11-08'
valid_from: '2013-02-16'
bwb_id: BWBR0018607
url: https://wetten.overheid.nl/BWBR0018607/2013-02-16
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 22 december 2004, nr. WJZ 4082228;

    Gelet op richtlijn nr. 2004/18/EG van het Europees Parlement en de Raad van de Europese Unie van 31 maart 2004
    betreffende de coördinatie van de procedures voor het plaatsen van overheidsopdrachten voor werken, leveringen en
    diensten (PbEG L 134) en de artikelen 2 en 3 van de Raamwet EEG-voorschriften aanbestedingen;

    De Raad van State gehoord (advies van 4 april 2005, nr. W10.04.0637/II);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 11 juli 2005, nr. WJZ 5033370;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.b
    text: 'Commissie: de Europese Commissie;'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.c
    text: |-
      Overeenkomst inzake overheidsopdrachten: de op 15 april 1995 te Marrakech tot stand gekomen Overeenkomst inzake
      overheidsopdrachten (Trb. 1994, 235);
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.d
    text: 'aannemer: een ieder die de uitvoering van werken op de markt aanbiedt;'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.e
    text: 'leverancier: een ieder die producten op de markt aanbiedt;'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.f
    text: 'dienstverlener: een ieder die diensten op de markt aanbiedt;'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.g
    text: |-
      werk: het product van een geheel van bouwkundige of civieltechnische werken dat ertoe bestemd is als zodanig een
      economische of technische functie te vervullen;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.h
    text: |-
      overheidsopdracht voor werken: een schriftelijke overeenkomst onder bezwarende titel die tussen een of meer
      aannemers en een of meer aanbestedende diensten is gesloten en betrekking heeft op:
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.h.1°
    text: |-
      de uitvoering of het ontwerp en de uitvoering: - van werken in het kader van een van de werkzaamheden, genoemd in
      [bijlage 1][ref1], of
        - van een werk, of


      [ref1]: https://wetten.overheid.nl/BWBR0018607
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018607
  - number: 1.h.2°
    text: |-
      het laten uitvoeren met welke middelen dan ook van een werk dat aan de door de aanbestedende dienst vastgestelde
      eisen voldoet;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.i
    text: |-
      overheidsopdracht voor leveringen: een schriftelijke overeenkomst onder bezwarende titel die tussen een of meer
      leveranciers en een of meer aanbestedende diensten is gesloten en betrekking heeft op:
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.i.1°
    text: de aankoop, leasing, huur of huurkoop, met of zonder koopoptie, van producten, of
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.i.2°
    text: |-
      de levering van producten en zijdelings betrekking heeft op werkzaamheden voor het aanbrengen en installeren van
      die levering;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.j
    text: |-
      overheidsopdracht voor diensten: een schriftelijke overeenkomst onder bezwarende titel die tussen een of meer
      dienstverleners en een of meer aanbestedende diensten is gesloten en betrekking heeft op:
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.j.1°
    text: |-
      het verrichten van de diensten, bedoeld in [bijlage 2][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0018607
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018607
  - number: 1.j.2°
    text: |-
      het leveren van producten en het verrichten van de diensten, bedoeld in [bijlage 2][ref1], waarvan de waarde van de
      desbetreffende diensten hoger is dan die van de in de overheidsopdracht opgenomen producten, of


      [ref1]: https://wetten.overheid.nl/BWBR0018607
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018607
  - number: 1.j.3°
    text: |-
      het verrichten van de diensten, bedoeld in [bijlage 2][ref1], en van werkzaamheden, genoemd in [bijlage 1][ref2],
      waarbij de werkzaamheden bijkomstig zijn ten opzichte van het verrichten van de diensten;


      [ref1]: https://wetten.overheid.nl/BWBR0018607
      [ref2]: https://wetten.overheid.nl/BWBR0018607
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018607
      - id: ref2
        bwb_id: BWBR0018607
  - number: 1.k
    text: |-
      overheidsopdracht: een overheidsopdracht voor werken, een overheidsopdracht voor leveringen of een
      overheidsopdracht voor diensten;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.l
    text: |-
      concessieovereenkomst voor openbare werken: een overeenkomst met dezelfde kenmerken als een overheidsopdracht voor
      werken, waarbij de tegenprestatie voor de uit te voeren werken in ieder geval bestaat uit het recht het werk te
      exploiteren, al dan niet gecombineerd met een prijs;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.m
    text: |-
      concessieovereenkomst voor diensten: een overeenkomst met dezelfde kenmerken als een overheidsopdracht voor
      diensten met uitzondering van het feit dat de tegenprestatie voor de te verrichten diensten bestaat uit het recht
      de dienst te exploiteren, al dan niet gecombineerd met een prijs;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.n
    text: |-
      raamovereenkomst: een overeenkomst tussen een of meer aanbestedende diensten en een of meer ondernemers met het
      doel gedurende een bepaalde periode de voorwaarden inzake te gunnen overheidsopdrachten vast te leggen;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.o
    text: |-
      dynamisch aankoopsysteem: een elektronisch proces voor het doen van gangbare aankopen, met algemeen op de markt
      beschikbare kenmerken, beperkt in de tijd en gedurende de gehele looptijd open voor een ondernemer die voldoet aan
      de selectiecriteria en die overeenkomstig de eisen van het beschrijvend document een indicatieve inschrijving heeft
      ingediend;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.p
    text: |-
      elektronische veiling: een zich herhalend elektronisch proces voor de presentatie van nieuwe, verlaagde prijzen
      of van nieuwe waarden voor bepaalde elementen van de inschrijvingen, dat plaatsvindt na de eerste volledige
      beoordeling van de inschrijvingen en dat klassering op basis van elektronische verwerking mogelijk maakt;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.q
    text: |-
      publiekrechtelijke instelling: een instelling die is opgericht met het specifieke doel te voorzien in behoeften van
      algemeen belang, niet zijnde van industriële of commerciële aard, die rechtspersoonlijkheid bezit en waarvan:
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.q.1°
    text: |-
      de activiteiten in hoofdzaak door de staat, een provincie, een gemeente, een waterschap of een andere
      publiekrechtelijke instelling worden gefinancierd,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.q.2°
    text: |-
      het beheer onderworpen is aan toezicht door de staat, een provincie, een gemeente, een waterschap of een andere
      publiekrechtelijke instelling, of
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.q.3°
    text: |-
      de leden van het bestuur, het leidinggevend of het toezichthoudend orgaan voor meer dan de helft door de staat, een
      provincie, een gemeente, een waterschap of andere publiekrechtelijke instellingen zijn aangewezen;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.r
    text: |-
      aanbestedende dienst: de staat, een provincie, een gemeente, een waterschap, een publiekrechtelijke instelling of
      een samenwerkingsverband van deze overheden of publiekrechtelijke instellingen;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.s
    text: |-
      aankoopcentrale: een aanbestedende dienst die voor aanbestedende diensten bestemde leveringen of diensten verwerft,
      overheidsopdrachten gunt of raamovereenkomsten sluit met betrekking tot voor aanbestedende diensten bestemde
      werken, leveringen of diensten;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.t
    text: 'openbare procedure: een procedure waarbij ondernemers mogen inschrijven;'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.u
    text: |-
      niet-openbare procedure: een procedure waaraan ondernemers mogen verzoeken deel te nemen, maar waarbij alleen de
      door de aanbestedende dienst aangezochte ondernemers mogen inschrijven;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.v
    text: |-
      concurrentiegerichte dialoog: een procedure waaraan alle ondernemers mogen verzoeken deel te nemen en waarbij
      de aanbestedende dienst een dialoog voert met de tot de procedure toegelaten ondernemers, ten einde een of
      meer oplossingen te zoeken die aan de behoeften van de aanbestedende dienst beantwoorden en op grond waarvan de
      geselecteerde ondernemers zullen worden uitgenodigd om in te schrijven;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.w
    text: |-
      bijzonder complexe overheidsopdracht: een overheidsopdracht waarbij de aanbestedende dienst objectief gezien niet
      in staat is de technische middelen overeenkomstig [artikel 23, derde lid, onderdelen b, c of d][ref1], te bepalen
      of niet in staat is de juridische of financiële voorwaarden van een project te specificeren;


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel23
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '23'
        paragraaf: '7'
  - number: 1.x
    text: |-
      procedure van gunning door onderhandelingen: een procedure waarbij de aanbestedende dienst met door hem gekozen
      ondernemers overleg pleegt en door onderhandelingen met een of meer van hen de voorwaarden van de overheidsopdracht
      vaststelt;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.y
    text: |-
      prijsvraag: een procedure die tot doel heeft de aanbestedende dienst een plan of ontwerp te verschaffen dat na een
      oproep tot mededinging door een jury wordt geselecteerd, al dan niet met toekenning van prijzen;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.z
    text: 'inschrijver: een ondernemer die een inschrijving heeft ingediend;'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.aa
    text: |-
      gegadigde: een ondernemer die heeft verzocht om een uitnodiging tot deelneming aan een niet-openbare procedure, aan
      een procedure van gunning door onderhandelingen of aan een concurrentiegerichte dialoog;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.bb
    text: |-
      elektronisch middel: een middel waarbij gebruik wordt gemaakt van elektronische apparatuur voor gegevensverwerking,
      met inbegrip van digitale compressie en gegevensopslag, en van verspreiding, overbrenging en ontvangst door middel
      van draden, straalverbindingen, optische middelen of andere elektromagnetische middelen;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.cc
    text: |-
      CPC: de nomenclatuur van de centrale productclassificatie (gemeenschappelijke indeling van de produkten) van de
      Verenigde Naties;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.dd
    text: |-
      CPV: de Gemeenschappelijke Woordenlijst Overheidsopdrachten, vastgesteld bij [verordening (EG) nr. 2195/2002]
      (32002R2195) van het Europees Parlement en de Raad van de Europese Unie van 5 november 2002 betreffende de
      gemeenschappelijke woordenlijst overheidsopdrachten (CPV) (PbEG L 340);
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.ee
    text: |-
      NACE: de statistische nomenclatuur van economische activiteiten in de Europese Gemeenschappen, vastgesteld
      bij [verordening (EEG) nr. 3037/90](31990R3037) van de Raad van de Europese gemeenschappen van 9 oktober 1990
      betreffende de statistische nomenclatuur van de economische activiteiten in de Europese Gemeenschap (PbEG L 293);
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.ff
    text: |-
      openbaar telecommunicatienet: de openbare telecommunicatie-infrastructuur waarmee signalen tussen bepaalde
      eindstations van het net kunnen worden overgebracht door middel van draden, straalverbindingen, optische middelen
      of andere elektromagnetische middelen;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.gg
    text: |-
      eindstation van het net: het geheel van materiële verbindingen en van technische toegangsspecificaties die deel
      uitmaken van het openbare telecommunicatienet en die nodig zijn om toegang tot dit openbare net te krijgen en met
      behulp daarvan doeltreffend te communiceren;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.hh
    text: |-
      openbare telecommunicatiedienst: een telecommunicatiedienst waarvan het aanbod aan een of meer
      telecommunicatieorganisaties specifiek is opgedragen;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.ii
    text: |-
      telecommunicatiedienst: de dienst die geheel of gedeeltelijk bestaat in het overbrengen en doorgeven van signalen
      op het openbare telecommunicatienet door middel van telecommunicatieprocédés, met uitzondering van radio-omroep
      en televisie;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.jj
    text: |-
      erkende organisatie: een testlaboratorium, een ijklaboratorium of inspectie- of certificatieorganisatie die voldoet
      aan de toepasselijke Europese normen;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.kk
    text: 'verbonden onderneming: een onderneming:'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.kk.1°
    text: waarop een concessiehouder direct of indirect een overheersende invloed kan uitoefenen, of
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.kk.2°
    text: die een overheersende invloed kan uitoefenen op de concessiehouder, of
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.kk.3°
    text: |-
      die, tezamen met de concessiehouder, onderworpen is aan de overheersende invloed van een andere onderneming uit
      hoofde van eigendom, financiële deelneming of op haar van toepassing zijnde voorschriften;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.ll
    text: 'technische specificatie: in geval van'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.ll.1°
    text: |-
      overheidsopdrachten voor werken: een technische voorschrift dat een omschrijving geeft van de vereiste kenmerken
      van een werk, een materiaal, een product of een levering en aan de hand waarvan op objectieve wijze een werk, een
      materiaal, een product of een levering zodanig kan worden omschreven dat dit beantwoordt aan het gebruik waarvoor
      het door de aanbestedende dienst is bestemd;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.ll.2°
    text: |-
      overheidsopdrachten voor leveringen of overheidsopdrachten voor diensten: een specificatie die voorkomt in een
      document ter omschrijving van de vereiste kenmerken van een product of dienst;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.mm
    text: |-
      norm: een technische specificatie die door een erkende normalisatie-instelling voor herhaalde of voortdurende
      toepassing is goedgekeurd, waarvan de inachtneming niet verplicht is en die tot een van de normen, bedoeld in
      onderdelen nn tot en met rr, behoort;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.nn
    text: |-
      internationale norm: een norm die door een internationale normalisatie-instelling wordt aangenomen en ter
      beschikking van het publiek wordt gesteld;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.oo
    text: |-
      Europese norm: een norm die door een Europese normalisatie-instelling wordt aangenomen en ter beschikking van het
      publiek wordt gesteld;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.pp
    text: |-
      nationale norm: een norm die door een nationale normalisatie-instelling wordt aangenomen en ter beschikking van het
      publiek wordt gesteld;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.qq
    text: |-
      Europese technische goedkeuring: een op de bevinding dat aan de essentiële eisen wordt voldaan gebaseerde,
      gunstig uitgevallen technische beoordeling waarbij een product, gezien zijn intrinsieke eigenschappen en de
      voor de toepassing en het gebruik ervan vastgestelde voorwaarden, geschikt wordt verklaard voor het gebruik voor
      bouwdoeleinden door een erkende organisatie;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.rr
    text: |-
      gemeenschappelijke technische specificatie: een technische specificatie die is opgesteld volgens een door
      de lidstaten van de Europese Unie erkende procedure die in het Publicatieblad van de Europese Unie wordt
      bekendgemaakt;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.ss
    text: |-
      technisch referentiekader: een ander product dan de officiële normen, dat door de Europese normalisatie-
      instellingen is opgesteld volgens procedures die aan de ontwikkeling van de marktbehoeften zijn aangepast;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.tt
    text: |-
      [richtlijn nr. 89/665/EEG](31989L0665): [richtlijn nr. 89/665/EEG](31989L0665) van de Raad van de Europese
      Gemeenschappen van 21 december 1989 houdende de coördinatie van de wettelijke en bestuursrechtelijke bepalingen
      betreffende de toepassing van de beroepsprocedures inzake het plaatsen van overheidsopdrachten voor leveringen en
      voor de uitvoering van werken (PbEG L 395);
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.uu
    text: |-
      [richtlijn nr. 92/50/EEG](31992L0050): [richtlijn nr. 92/50/EEG](31992L0050) van de Raad van de Europese
      Gemeenschappen van 18 juni 1992 betreffende de coördinatie van de procedures voor het plaatsen van
      overheidsopdrachten voor dienstverlening (PbEG L 209), naar de tekst zoals deze gold op de dag voor intrekking van
      deze richtlijn;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.vv
    text: |-
      [richtlijn nr. 93/36/EEG](31993L0036): [richtlijn nr. 93/36/EEG](31993L0036) van de Raad van de Europese
      Gemeenschappen van 14 juni 1993 betreffende de coördinatie van de procedures voor het plaatsen van
      overheidsopdrachten voor leveringen (PbEG L 199), naar de tekst zoals deze gold op de dag voor intrekking van deze
      richtlijn;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.ww
    text: |-
      [richtlijn nr. 93/37/EEG](31993L0037): [richtlijn nr. 93/37/EEG](31993L0037) van de Raad van de Europese
      Gemeenschappen van 14 juni 1993 betreffende de coördinatie van de procedures voor het plaatsen van
      overheidsopdrachten voor de uitvoering van werken (PbEG L 199), naar de tekst zoals deze gold op de dag voor
      intrekking van deze richtlijn;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.yy
    text: |-
      [richtlijn nr. 2004/18/EG](32004L0018): [richtlijn nr. 2004/18/EG](32004L0018) van het Europees Parlement en de
      Raad van de Europese Unie van 31 maart 2004 betreffende de coördinatie van de procedures voor het plaatsen van
      overheidsopdrachten voor werken, leveringen en diensten (PbEG L 134);
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.zz
    text: |-
      elektronische handtekening: een handtekening als bedoeld in
      [artikel 15a, vierde lid, van Boek 3 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15a
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 15a
  - number: 1.aaa
    text: |-
      geavanceerde elektronische handtekening: een handtekening die voldoet aan de eisen van
      [artikel 15a, tweede lid, onderdelen a tot en met f, van Boek 3 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15a
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 15a
  - number: 1.bbb
    text: |-
      uitsluitend recht: een recht dat bij wettelijk voorschrift of bij besluit van een bestuursorgaan aan een
      onderneming wordt verleend, waarbij voor die onderneming het recht wordt voorbehouden om binnen een bepaald
      geografisch gebied een dienst te verrichten of een activiteit uit te oefenen;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.ccc
    text: |-
      bijzonder recht: een recht dat bij wettelijk voorschrift of bij besluit van een bestuursorgaan aan een beperkt
      aantal ondernemingen wordt verleend en waarbij binnen een bepaald geografisch gebied:
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.ccc.1°
    text: |-
      het aantal van deze ondernemingen die een dienst mogen verrichten of een activiteit mogen uitoefenen op een andere
      wijze dan volgens objectieve, evenredige en niet-discriminerende criteria tot twee of meer wordt beperkt,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.ccc.2°
    text: |-
      verscheidene concurrerende ondernemingen die een dienst mogen verrichten of een activiteit mogen uitoefenen op een
      andere wijze dan volgens deze criteria worden aangewezen, of
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.ccc.3°
    text: |-
      aan een of meer ondernemingen die een dienst mogen verrichten of een activiteit mogen uitoefenen op een andere
      wijze dan volgens deze criteria voordelen worden toegekend waardoor enige andere onderneming aanzienlijk wordt
      belemmerd in de mogelijkheid om dezelfde activiteiten binnen hetzelfde geografische gebied onder in wezen
      gelijkwaardige voorwaarden uit te oefenen;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.ddd
    text: 'kopersprofiel: een beschrijving van de aanbestedende dienst en zijn inkoopbeleid;'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.eee
    text: |-
      beschrijvend document: een document waarin de overheidsopdracht, de aanbestedende dienst, de te volgen
      aanbestedingsprocedure, en de selectie- en gunningscriteria worden beschreven en toegelicht;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.fff
    text: |-
      gunningsbeslissing: de keuze van de aanbestedende dienst voor de ondernemer met wie hij een raamovereenkomst wil
      sluiten of aan wie hij een overheidsopdracht wil gunnen;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.ggg
    text: 'ondernemer: aannemer, leverancier of dienstverlener;'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.hhh
    text: |-
      schriftelijk: elk uit woorden of cijfers bestaand geheel dat kan worden gelezen, gereproduceerd, en vervolgens
      medegedeeld, dat met elektronische middelen overgebrachte of opgeslagen informatie kan bevatten;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: 1.iii
    text: 'aanbestedingsstukken: alle documenten in een aanbestedingsprocedure.'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel1
  - number: '2'
    text: Een aanbestedende dienst behandelt ondernemers op gelijke en niet-discriminerende wijze en handelt transparant.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel2
  - number: '3'
    text: |-
      Wanneer een aanbestedende dienst aan een natuurlijke persoon of rechtspersoon die zelf geen aanbestedende dienst
      is, een bijzonder recht of een uitsluitend recht verleent om openbare diensten te verlenen, wordt bij de verlening
      van die rechten, bepaald dat deze natuurlijke persoon of rechtspersoon, bij de overheidsopdrachten voor leveringen
      die het in het kader van deze activiteit aan derden gunt, het beginsel van niet-discriminatie op grond van de
      nationaliteit naleeft.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel3
  - number: '4.1'
    text: |-
      Een aanbestedende dienst wijst gegadigden of inschrijvers die gerechtigd zijn de desbetreffende verrichting uit
      te voeren, niet af louter op grond van het feit dat zij een natuurlijke persoon of een rechtspersoon zouden moeten
      zijn.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel4
  - number: '4.2'
    text: |-
      Voor overheidsopdrachten voor diensten, overheidsopdrachten voor werken en overheidsopdrachten voor leveringen
      die bijkomende diensten of werkzaamheden voor aanbrengen en installeren inhouden, kan een aanbestedende dienst
      van een rechtspersoon verlangen dat deze in de inschrijving of in het verzoek tot deelneming de namen en de
      beroepskwalificaties vermeldt van de personen die met de uitvoering worden belast.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel4
  - number: '4.3'
    text: Een samenwerkingsverband van ondernemers kan zich inschrijven of zich als gegadigde opgeven.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel4
  - number: '4.4'
    text: |-
      Een aanbestedende dienst verlangt voor de indiening van een inschrijving of een verzoek tot deelneming van een
      samenwerkingsverband van ondernemers niet dat het samenwerkingsverband van ondernemers een bepaalde rechtsvorm
      heeft.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel4
  - number: '4.5'
    text: |-
      Een aanbestedende dienst kan van een samenwerkingsverband waaraan de overheidsopdracht wordt gegund, eisen dat het
      een bepaalde rechtsvorm aanneemt, mits dit voor de goede uitvoering van de overheidsopdracht nodig is.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel4
  - number: '5.1'
    text: |-
      Een aanbestedende dienst wendt zich zonder discriminatie en onder dezelfde voorwaarden als die welke hij voor
      gegadigden of inschrijvers in Nederland stelt, tot ondernemers in andere lidstaten van de Europese Unie en in
      overige staten die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte, die voldoen aan de
      vereisten gesteld krachtens [richtlijn nr. 2004/18/EG](32004L0018), en handelt hierbij transparant.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel5
  - number: '5.2'
    text: |-
      Een aanbestedende dienst past bij het gunnen van overheidsopdrachten op ondernemers uit de andere lidstaten van de
      Europese Unie even gunstige voorwaarden toe als die welke hij bij de tenuitvoerlegging van de in het kader van de
      Overeenkomst inzake overheidsopdrachten, op ondernemers van derde landen toepast.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel5
  - number: '6'
    text: |-
      Onverminderd de [artikelen 29][ref1], [35][ref2], [36][ref3] en [41][ref4] en met inachtneming van de
      [Wet openbaarheid van bestuur][ref5] maakt een aanbestedende dienst de vertrouwelijke informatie die hem door een
      ondernemer is verstrekt niet openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0018607#Artikel36
      [ref4]: https://wetten.overheid.nl/BWBR0018607#Artikel41
      [ref5]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '29'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '35'
        paragraaf: '9'
      - id: ref3
        bwb_id: BWBR0018607
        artikel: '36'
        paragraaf: '9'
      - id: ref4
        bwb_id: BWBR0018607
        artikel: '41'
        paragraaf: '11'
      - id: ref5
        bwb_id: BWBR0005252
  - number: '7'
    text: |-
      Dit besluit is van toepassing op overheidsopdrachten waarvan de geraamde waarde exclusief omzetbelasting gelijk is
      aan of groter dan:
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel7
  - number: 7.a
    text: 'het bedrag, genoemd in artikel 7, onderdeel a, van [richtlijn nr. 2004/18/EG](32004L0018):'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel7
  - number: 7.a.1°
    text: |-
      voor andere dan de overheidsopdrachten voor leveringen en overheidsopdrachten voor diensten, bedoeld in onderdeel
      b, onder 3°, gegund door of vanwege de Staat, of
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel7
  - number: 7.a.2°
    text: |-
      voor overheidsopdrachten voor leveringen gegund door onderdelen van de Staat, die op het gebied van de defensie
      werkzaam zijn indien deze overheidsopdrachten betrekking hebben op producten die onder [bijlage 3][ref1] vallen;


      [ref1]: https://wetten.overheid.nl/BWBR0018607
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0018607
  - number: 7.b
    text: 'het bedrag, genoemd in artikel 7, onderdeel b van [richtlijn nr. 2004/18/EG](32004L0018):'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel7
  - number: 7.b.1°
    text: |-
      voor overheidsopdrachten voor leveringen en overheidsopdrachten voor diensten gegund door andere aanbestedende
      diensten dan de Staat, of
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel7
  - number: 7.b.2°
    text: |-
      voor overheidsopdrachten voor leveringen gegund door onderdelen van de Staat, die op het gebied van de defensie
      werkzaam zijn indien deze overheidsopdrachten betrekking hebben op producten die niet onder [bijlage 3][ref1]
      vallen, of


      [ref1]: https://wetten.overheid.nl/BWBR0018607
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0018607
  - number: 7.b.3°
    text: |-
      voor overheidsopdrachten voor diensten gegund door een aanbestedende dienst met het oog op: - diensten als bedoeld
      in [bijlage 2, onderdeel A, categorie 8][ref1],
        - telecommunicatiediensten als bedoeld in [bijlage 2, onderdeel A, categorie 5][ref2] waarvan CPV-posten
      overeenkomen met de CPC-indelingen 7524, 7525 en 7526, of
        - diensten als bedoeld in [bijlage 2, onderdeel B][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018607
      [ref2]: https://wetten.overheid.nl/BWBR0018607
      [ref3]: https://wetten.overheid.nl/BWBR0018607
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0018607
      - id: ref2
        bwb_id: BWBR0018607
      - id: ref3
        bwb_id: BWBR0018607
  - number: 7.c
    text: |-
      het bedrag, genoemd in artikel 7, onderdeel c, van [richtlijn nr. 2004/18/EG](32004L0018) voor overheidsopdrachten
      voor werken.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel7
  - number: '8.1'
    text: 'Dit besluit is van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel8
  - number: 8.1.a
    text: |-
      de gunning van overheidsopdrachten voor werken die voor meer dan 50 procent rechtstreeks door aanbestedende
      diensten worden gesubsidieerd en waarvan de geraamde waarde, exclusief omzetbelasting, ten minste gelijk is aan
      het bedrag genoemd in artikel 8, onderdeel a, van [richtlijn nr. 2004/18/EG](32004L0018), wanneer deze opdrachten
      betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel8
  - number: 8.1.a.1°
    text: |-
      civieltechnische werkzaamheden als bedoeld in [bijlage 1][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0018607
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018607
  - number: 8.1.a.2°
    text: |-
      bouwwerken voor ziekenhuizen, inrichtingen voor sportbeoefening, recreatie en vrijetijdsbesteding, school- en
      universiteitsgebouwen en gebouwen met een administratieve bestemming;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel8
  - number: 8.1.b
    text: |-
      de gunning van overheidsopdrachten voor diensten die voor meer dan 50 procent rechtstreeks door aanbestedende
      diensten worden gesubsidieerd en waarvan de geraamde waarde, exclusief omzetbelasting, ten minste gelijk is aan het
      bedrag genoemd in artikel 8, onderdeel b, van [richtlijn 2004/18/EG](32004L0018), wanneer deze overheidsopdrachten
      verband houden met een opdracht voor werken als bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel8
  - number: '8.2'
    text: |-
      Een subsidie-ontvanger als bedoeld in het eerste lid verstrekt een overheidsopdracht als bedoeld in het eerste lid
      overeenkomstig dit besluit.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel8
  - number: '9.1'
    text: |-
      Een aanbestedende dienst baseert de berekening van de geraamde waarde van een overheidsopdracht op het totale
      bedrag, exclusief omzetbelasting. Bij deze berekening wordt rekening gehouden met het geraamde totaalbedrag, met
      inbegrip van de eventuele opties en eventuele verlengingen van het contract.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel9
  - number: '9.2'
    text: |-
      Wanneer de aanbestedende dienst voorziet in prijzengeld of betalingen aan gegadigden of inschrijvers, berekent hij
      deze door in de geraamde waarde van de overheidsopdracht.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel9
  - number: '9.3'
    text: |-
      De raming, bedoeld in het eerste lid, geldt op het tijdstip van verzending van de aankondiging van de
      overheidsopdracht overeenkomstig [artikel 35, negende lid][ref1], of, wanneer deze aankondiging niet vereist is,
      op het tijdstip waarop de procedure voor de gunning van de overheidsopdracht door de aanbestedende dienst wordt
      ingeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel35
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '35'
        paragraaf: '9'
  - number: '9.4'
    text: |-
      Een aanbestedende dienst onttrekt zich niet aan dit besluit door voorgenomen werken of voorgenomen aankopen ter
      verkrijging van bepaalde hoeveelheden leveringen of diensten te splitsen of bijzondere regels te gebruiken voor de
      berekening van de geraamde waarde van de overheidsopdrachten.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel9
  - number: '9.5'
    text: |-
      Bij de berekening van de geraamde waarde van overheidsopdrachten voor werken houdt de aanbestedende dienst rekening
      met de waarde van de werken, en met de geraamde totale waarde van de voor de uitvoering van het werk noodzakelijke
      goederen die door de aanbestedende dienst ter beschikking van de aannemer zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel9
  - number: '9.6'
    text: |-
      Wanneer een voorgenomen werk of een voorgenomen aankoop van diensten leidt tot overheidsopdrachten die gelijktijdig
      in afzonderlijke percelen worden gegund, neemt de aanbestedende dienst de geraamde totale waarde van deze percelen
      als grondslag.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel9
  - number: '9.7'
    text: |-
      Wanneer de samengetelde waarde van de percelen, bedoeld in het zesde lid, gelijk is aan of groter is dan het in
      [artikel 7][ref1] bepaalde drempelbedrag, is dit besluit van toepassing op de gunning van elk perceel.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel7
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '7'
        paragraaf: '3'
  - number: '9.8'
    text: |-
      Dit besluit is niet van toepassing op percelen als bedoeld in het zesde lid waarvan de geraamde totale waarde,
      exclusief omzetbelasting:
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel9
  - number: 9.8.a
    text: minder dan € 80.000 bedraagt voor overheidsopdrachten voor diensten of
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel9
  - number: 9.8.b
    text: minder dan € 1.000.000 voor overheidsopdrachten voor werken,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel9
  - number: '9.9'
    text: |-
      Wanneer een voorgenomen verkrijging van homogene leveringen aanleiding kan geven tot overheidsopdrachten die
      gelijktijdig in afzonderlijke percelen worden gegund, neemt de aanbestedende dienst de geraamde totale waarde van
      deze percelen als grondslag voor de toepassing van [artikel 7, eerste lid, onderdelen a en b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel7
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '7'
        paragraaf: '3'
  - number: '9.10'
    text: |-
      Wanneer de samengetelde waarde van de percelen, bedoeld in het negende lid, gelijk is aan of groter is dan het
      drempelbedrag, genoemd in [artikel 7][ref1], is dit besluit van toepassing op de gunning van elk perceel.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel7
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '7'
        paragraaf: '3'
  - number: '9.11'
    text: |-
      Dit besluit is niet van toepassing op percelen als bedoeld in het negende lid, waarvan de geraamde waarde,
      exclusief omzetbelasting, minder dan € 80.000 bedraagt, mits het samengestelde bedrag van de percelen niet meer dan
      20 procent van de totale waarde van alle percelen omvat.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel9
  - number: '9.12'
    text: |-
      In het geval van overheidsopdrachten voor leveringen die betrekking hebben op leasing, huur of huurkoop van
      producten wordt de waarde van de overheidsopdracht op de volgende grondslag geraamd:
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel9
  - number: 9.12.a
    text: |-
      bij overheidsopdrachten voor leveringen met een vaste looptijd: de totale geraamde waarde voor de gehele looptijd
      wanneer die ten hoogste twaalf maanden bedraagt, dan wel de totale waarde wanneer de looptijd meer dan twaalf
      maanden bedraagt, met inbegrip van de geraamde restwaarde;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel9
  - number: 9.12.b
    text: |-
      bij overheidsopdrachten voor leveringen voor onbepaalde duur of waarvan de looptijd niet kan worden bepaald: het
      maandelijks te betalen bedrag vermenigvuldigd met 48.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel9
  - number: '9.13'
    text: |-
      In het geval van overheidsopdrachten voor leveringen of overheidsopdrachten voor diensten die met een zekere
      regelmaat worden verleend of die bestemd zijn om gedurende een bepaalde periode te worden hernieuwd, neemt de
      aanbestedende dienst voor de berekening van de geraamde waarde van de overheidsopdracht als grondslag:
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel9
  - number: 9.13.a
    text: |-
      de totale reële waarde van de tijdens het voorafgaande boekjaar of tijdens de voorafgaande twaalf maanden gegunde
      soortgelijke opeenvolgende overheidsopdrachten voor leveringen of overheidsopdrachten voor diensten, indien
      mogelijk gecorrigeerd voor verwachte wijzigingen in hoeveelheid of waarde gedurende de twaalf maanden volgende op
      de eerste opdracht, of
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel9
  - number: 9.13.b
    text: |-
      de geraamde totale waarde van de opeenvolgende overheidsopdrachten voor leveringen of overheidsopdrachten voor
      diensten over de twaalf maanden volgende op de eerste levering of over het boekjaar, indien dit zich over meer dan
      twaalf maanden uitstrekt.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel9
  - number: '9.14'
    text: |-
      Een aanbestedende dienst maakt de keuze van de methode van berekening van de geraamde waarde van een
      overheidsopdracht niet met de intentie om de overheidsopdracht aan dit besluit te onttrekken.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel9
  - number: '9.15'
    text: 'Een aanbestedende dienst raamt de waarde van overheidsopdrachten voor diensten:'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel9
  - number: 9.15.a
    text: 'wanneer het verzekeringsdiensten betreft: de te betalen premie en andere vormen van schadeloosstelling,'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel9
  - number: 9.15.b
    text: |-
      wanneer het bankdiensten en andere financiële diensten betreft: honoraria, provisies en rente, en andere vormen
      van beloning,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel9
  - number: 9.15.c
    text: |-
      wanneer het overheidsopdrachten betreffende een ontwerp betreft: de te betalen honoraria, provisies en andere
      wijzen van bezoldiging,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel9
  - number: 9.15.d
    text: |-
      wanneer het overheidsopdrachten betreft waarin geen totale prijs is vermeld en die een vaste looptijd hebben die
      gelijk is aan of korter is dan 48 maanden: de totale geraamde waarde voor de gehele looptijd, of
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel9
  - number: 9.15.e
    text: |-
      wanneer het overheidsopdrachten betreft waarin geen totale prijs is vermeld en die voor onbepaalde duur zijn of een
      looptijd hebben die langer is dan 48 maanden: het maandelijks te betalen bedrag vermenigvuldigd met 48.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel9
  - number: '9.16'
    text: |-
      Bij de berekening van de waarde van een raamovereenkomst of een dynamisch aankoopsysteemgaat de aanbestedende
      dienst uit van de geraamde maximale waarde, exclusief omzetbelasting, van alle voor de totale duur van de
      raamovereenkomst of van het dynamisch aankoopsysteem voorgenomen overheidsopdrachten.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel9
  - number: '10'
    text: |-
      Dit besluit is niet van toepassing op overheidsopdrachten die door aanbestedende diensten op het gebied van
      defensie worden gegund en die vallen onder de reikwijdte van artikel 296 van het Verdrag tot oprichting van de
      Europese Gemeenschap.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel10
  - number: 10a.1
    text: 'Dit besluit is niet van toepassing op overheidsopdrachten:'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel10a
  - number: 10a.1.a
    text: |-
      waarop de [Aanbestedingswet op defensie- en veiligheidsgebied][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0032898
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0032898
  - number: 10a.1.b
    text: |-
      waarop de [Aanbestedingswet op defensie- en veiligheidsgebied][ref1] niet van toepassing is ingevolge de
      [artikelen 2.3][ref2], [2.16][ref3] en [2.17 van die wet][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0032898
      [ref2]: https://wetten.overheid.nl/BWBR0032898#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032898#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0032898#Artikel2
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0032898
      - id: ref2
        bwb_id: BWBR0032898
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0032898
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0032898
        artikel: '2'
  - number: 10a.1.c
    text: |-
      voor civiele aankopen die worden geplaatst in een derde land, indien strijdkrachten zijn ingezet buiten het
      grondgebied van de Europese Unie en de operationele omstandigheden vereisen dat de overheidsopdracht wordt gegund
      aan ondernemers die in het operatiegebied gevestigd zijn;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel10a
  - number: 10a.2
    text: 'Voor de toepassing van het eerste lid, onder c, wordt onder civiele aankopen verstaan opdrachten die:'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel10a
  - number: 10a.2.a
    text: |-
      niet onder het toepassingsgebied van [artikel 2.1 van de Aanbestedingswet op defensie- en veiligheidsgebied][ref1]
      vallen,


      [ref1]: https://wetten.overheid.nl/BWBR0032898#Artikel2
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0032898
        artikel: '2'
  - number: 10a.2.b
    text: betrekking hebben op niet-militaire producten, werken of diensten voor logistieke doeleinden en
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel10a
  - number: 10a.2.c
    text: |-
      worden aanbesteed overeenkomstig een procedure als bedoeld in de
      [hoofdstukken 2.3 tot en met 3.2 van de Aanbestedingswet op defensie- en veiligheidsgebied][ref1] zonder dat
      daartoe een verplichting bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0032898#Hoofdstuk2.3
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0032898
        hoofdstuk: '2.3'
  - number: '11.1'
    text: 'Dit besluit is niet van toepassing op: overheidsopdrachten die'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel11
  - number: 11.1.a
    text: |-
      in het kader van het [Besluit aanbestedingen speciale sectoren][ref1] worden gegund door
      aanbestedende diensten die een of meer van de in de [artikelen 3 tot en met 5][ref2] en
      [artikel 7 van het Besluit aanbestedingen speciale sectoren][ref3] genoemde activiteiten uitoefenen en die voor
      deze activiteiten worden gegund,


      [ref1]: https://wetten.overheid.nl/BWBR0018608
      [ref2]: https://wetten.overheid.nl/BWBR0018608#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0018608#Artikel7
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0018608
      - id: ref2
        bwb_id: BWBR0018608
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0018608
        artikel: '7'
  - number: 11.1.b
    text: |-
      op grond van de [artikelen 5, tweede lid][ref1], [19][ref2], [26][ref3] en
      [30 van het Besluit aanbestedingen speciale sectoren][ref4] van het toepassingsgebied zijn uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0018608#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0018608#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0018608#Artikel30
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0018608
        artikel: '19'
      - id: ref3
        bwb_id: BWBR0018608
        artikel: '26'
      - id: ref4
        bwb_id: BWBR0018608
        artikel: '30'
  - number: '11.2'
    text: |-
      Dit besluit is tot 31 december 2008 van toepassing op overheidsopdrachten die worden gegund door aanbestedende
      diensten die de activiteiten, bedoeld in [artikel 6 van het Besluit aanbestedingen speciale sectoren][ref1],
      uitoefenen en die voor deze activiteiten worden gegund.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel6
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '6'
  - number: '12'
    text: |-
      Dit besluit is niet van toepassing op overheidsopdrachten die in hoofdzaak tot doel hebben de aanbestedende
      diensten in staat te stellen openbare telecommunicatienetten beschikbaar te stellen of te exploiteren of aan het
      publiek een of meer telecommunicatiediensten te verlenen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel12
  - number: '13'
    text: |-
      Dit besluit is niet van toepassing op overheidsopdrachten die geheim zijn verklaard of waarvan de uitvoering
      overeenkomstig de geldende wettelijke en bestuursrechtelijke bepalingen met bijzondere veiligheidsmaatregelen
      gepaard moet gaan of wanneer de bescherming van de wezenlijke belangen van het land zulks vereist.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel13
  - number: '14.1'
    text: |-
      Dit besluit is niet van toepassing op overheidsopdrachten waarvoor andere procedurevoorschriften gelden en die
      worden gegund:
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel14
  - number: 14.1.a
    text: |-
      krachtens een tussen het Koninkrijk der Nederlanden en een of meer derde landen overeenkomstig het Verdrag tot
      oprichting van de Europese Gemeenschap gesloten internationale overeenkomst betreffende leveringen of werken die
      bestemd zijn voor de gemeenschappelijke verwezenlijking of exploitatie van een werk door de ondertekenende staten,
      of betreffende diensten die bestemd zijn voor de gemeenschappelijke verwezenlijking of exploitatie van een project
      door de ondertekenende staten, of
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel14
  - number: 14.1.b
    text: |-
      krachtens een in verband met de legering van strijdkrachten gesloten internationale overeenkomst betreffende
      ondernemingen in Nederland of in een derde land, of
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel14
  - number: 14.1.c
    text: volgens de specifieke procedure van een internationale organisatie.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel14
  - number: '14.2'
    text: |-
      Een aanbestedende dienst brengt een internationale overeenkomst als bedoeld in het eerste lid, onderdeel a, ter
      kennis van de Commissie.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel14
  - number: '15'
    text: 'Dit besluit is niet van toepassing op overheidsopdrachten voor diensten:'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel15
  - number: 15.a
    text: |-
      betreffende de verwerving of huur, ongeacht de financiële modaliteiten ervan, van grond, bestaande gebouwen of
      andere onroerende zaken of betreffende de rechten hierop, met uitzondering van de overeenkomsten betreffende
      financiële diensten die voorafgaand aan, gelijktijdig met of als vervolg op het koop- of huurcontract worden
      gesloten,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel15
  - number: 15.b
    text: |-
      betreffende de aankoop, de ontwikkeling, de productie of de coproductie van programmamateriaal bestemd voor
      uitzendingen door radio-omroeporganisaties en overeenkomsten betreffende zendtijd,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel15
  - number: 15.c
    text: betreffende diensten van arbitrage en bemiddeling,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel15
  - number: 15.d
    text: |-
      op financieel gebied betreffende de uitgifte, de aankoop, de verkoop en de overdracht van effecten of andere
      financiële instrumenten en door de centrale banken verleende diensten,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel15
  - number: 15.e
    text: inzake arbeidsovereenkomsten, of
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel15
  - number: 15.f
    text: |-
      betreffende diensten voor onderzoek en ontwikkeling, met uitzondering van die waarvan de resultaten in hun geheel
      aan de aanbestedende dienst toekomen voor gebruik ervan in de uitoefening van zijn eigen werkzaamheden, mits de
      dienstverlening volledig door de aanbestedende dienst wordt beloond.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel15
  - number: '16'
    text: Dit besluit is niet van toepassing op concessieovereenkomsten voor diensten.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel16
  - number: '17'
    text: |-
      Dit besluit is niet van toepassing op overheidsopdrachten voor diensten die door een aanbestedende dienst worden
      gegund aan een andere aanbestedende dienst of aan een samenwerkingsverband van aanbestedende diensten, op basis
      van een uitsluitend recht dat deze aanbestedende dienst geniet, mits dit uitsluitend recht met het Verdrag tot
      oprichting van de Europese Gemeenschap verenigbaar is.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel17
  - number: '18.1'
    text: Een aanbestedende dienst kan via een aankoopcentrale overheidsopdrachten gunnen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel18
  - number: '18.2'
    text: |-
      De aanbestedende dienst, die via een aankoopcentrale gunt, wordt geacht dit besluit te hebben nageleefd, indien de
      aankoopcentrale, bedoeld in het eerste lid, dit besluit heeft nageleefd.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel18
  - number: '19.1'
    text: |-
      Een aanbestedende dienst kan de deelneming aan procedures voor de gunning van
      overheidsopdrachten voorbehouden aan sociale werkvoorzieningen als bedoeld in
      [artikel 1, onderdeel e, van het Besluit uitvoering sociale werkvoorziening en begeleid werken][ref1], indien de
      meerderheid van de bij de uitvoering van de betreffende overheidsopdracht betrokken werknemers personen met een
      handicap zijn die wegens de aard of de ernst van hun handicaps geen beroepsactiviteit in normale omstandigheden
      kunnen uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0017240#Artikel1
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0017240
        artikel: '1'
  - number: '19.2'
    text: |-
      Een aanbestedende dienst vermeldt in de aankondiging dat de overheidsopdracht is voorbehouden aan sociale
      werkvoorzieningen als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel19
  - number: '20'
    text: |-
      Een aanbestedende dienst past bij het gunnen van een overheidsopdracht voor diensten die betrekking heeft op
      diensten als bedoeld in [bijlage 2, onderdeel A][ref1] de [artikelen 23 tot en met 57][ref2] toe.


      [ref1]: https://wetten.overheid.nl/BWBR0018607
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel23
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0018607
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '23'
        paragraaf: '7'
  - number: '21'
    text: |-
      Een aanbestedende dienst past bij het gunnen van een overheidsopdracht voor diensten die betrekking
      heeft op diensten als bedoeld in [bijlage 2, onderdeel B][ref1] de [artikelen 23][ref2] en
      [35, twaalfde tot en met zestiende lid][ref3], toe.


      [ref1]: https://wetten.overheid.nl/BWBR0018607
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0018607#Artikel35
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0018607
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '23'
        paragraaf: '7'
      - id: ref3
        bwb_id: BWBR0018607
        artikel: '35'
        paragraaf: '9'
  - number: '22'
    text: |-
      Een aanbestedende dienst past bij het gunnen van een overheidsopdracht voor diensten die zowel
      betrekking heeft op diensten als bedoeld in [bijlage 2, onderdeel A][ref1] als op diensten als bedoeld in
      [bijlage 2, onderdeel B][ref2] toe:


      [ref1]: https://wetten.overheid.nl/BWBR0018607
      [ref2]: https://wetten.overheid.nl/BWBR0018607
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0018607
      - id: ref2
        bwb_id: BWBR0018607
  - number: 22.a
    text: |-
      de [artikelen 23 tot en met 57][ref1], indien de waarde van de diensten als bedoeld in
      [bijlage 2, onderdeel A][ref2] hoger is dan die van de diensten als bedoeld in [bijlage 2, onderdeel B][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0018607
      [ref3]: https://wetten.overheid.nl/BWBR0018607
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '23'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0018607
      - id: ref3
        bwb_id: BWBR0018607
  - number: 22.b
    text: |-
      de [artikelen 23][ref1] en [35, twaalfde tot en met zestiende lid][ref2], indien de waarde van de diensten
      als bedoeld in [bijlage 2, onderdeel A][ref3] niet hoger is dan die van de diensten als bedoeld in
      [bijlage 2, onderdeel B][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0018607
      [ref4]: https://wetten.overheid.nl/BWBR0018607
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '23'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '35'
        paragraaf: '9'
      - id: ref3
        bwb_id: BWBR0018607
      - id: ref4
        bwb_id: BWBR0018607
  - number: '23.1'
    text: Een aanbestedende dienst neemt de technische specificaties op in de aanbestedingsstukken.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel23
  - number: '23.2'
    text: |-
      De technische specificaties bieden de inschrijvers gelijke toegang en leiden niet tot ongerechtvaardigde
      belemmeringen in de mededinging voor de openstelling van overheidsopdrachten.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel23
  - number: '23.3'
    text: 'Een aanbestedende dienst formuleert de technische specificaties:'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel23
  - number: 23.3.a
    text: |-
      door verwijzing naar technische specificaties en naar nationale normen waarin Europese normen zijn omgezet, de
      Europese technische goedkeuringen, de gemeenschappelijke technische specificaties, internationale normen, andere
      door de Europese normalisatie-instellingen opgestelde technische referentiesystemen, of, bij ontstentenis daarvan,
      de nationale normen, de nationale technische goedkeuringen dan wel de nationale technische specificaties inzake het
      ontwerpen, het berekenen en het uitvoeren van werken en het gebruik van producten,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel23
  - number: 23.3.b
    text: |-
      in termen van prestatie-eisen en functionele eisen, waaronder milieukenmerken, die zodanig nauwkeurig zijn
      bepaald dat de inschrijvers het voorwerp van de overheidsopdracht kunnen bepalen en de aanbestedende dienst de
      overheidsopdracht kan gunnen,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel23
  - number: 23.3.c
    text: |-
      in termen van prestatie-eisen en functionele eisen als bedoeld in onderdeel b, waarbij onder vermoeden van
      overeenstemming met deze prestatie-eisen en functionele eisen wordt verwezen naar de specificaties, bedoeld in
      onderdeel a, of
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel23
  - number: 23.3.d
    text: |-
      door verwijzing naar de specificaties, bedoeld in onderdeel a, voor bepaalde kenmerken, en verwijzing naar de
      prestatie-eisen en functionele eisen, bedoeld in onderdeel b, voor andere kenmerken.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel23
  - number: '23.4'
    text: |-
      Een aanbestedende dienst vergezelt een verwijzing als bedoeld in het derde lid, onderdeel a van de woorden «of
      gelijkwaardig».
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel23
  - number: '23.5'
    text: |-
      Wanneer een aanbestedende dienst verwijst naar de specificaties, bedoeld in het derde lid, onderdeel a, kan
      hij een inschrijving niet afwijzen met de reden dat de aangeboden producten en diensten niet beantwoorden aan
      de specificaties waarnaar hij heeft verwezen, indien de inschrijver in zijn inschrijving tot voldoening van de
      aanbestedende dienst aantoont dat de door hem voorgestelde oplossingen op gelijkwaardige wijze voldoen aan de eisen
      die in de technische specificaties zijn bepaald.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel23
  - number: '23.6'
    text: |-
      Een aanbestedende dienst wijst, wanneer hij gebruik maakt van de in het derde lid, onderdeel b en c, geboden
      mogelijkheid prestatie-eisen of functionele eisen te stellen, een aanbod van werken, producten of diensten niet
      af indien die beantwoordt aan een nationale norm waarin een Europese norm is omgezet, aan een Europese technische
      goedkeuring, aan een gemeenschappelijke technische specificatie, aan een internationale norm of aan een door een
      Europese normalisatie-instelling opgestelde technisch referentiesysteem, wanneer deze specificaties betrekking
      hebben op de prestaties of functionele eisen die hij heeft voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel23
  - number: '23.7'
    text: |-
      Een inschrijver toont in zijn inschrijving aan dat het product, de dienst of het werk in overeenstemming is met de
      norm en voldoet aan de functionele en prestatie-eisen van de aanbestedende dienst.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel23
  - number: '23.8'
    text: |-
      Een aanbestedende dienst die milieukenmerken voorschrijft door verwijzing naar prestatie-eisen of functionele eisen
      als bedoeld in het derde lid, onderdeel b, kan gebruik maken van de gedetailleerde specificaties of van gedeelten
      daarvan, zoals vastgesteld in milieukeuren, voorzover:
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel23
  - number: 23.8.a
    text: |-
      die geschikt zijn voor de omschrijving van de kenmerken van de leveringen of diensten waarop de overheidsopdracht
      betrekking heeft,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel23
  - number: 23.8.b
    text: de vereisten voor de keur zijn ontwikkeld op grond van wetenschappelijke gegevens,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel23
  - number: 23.8.c
    text: |-
      de milieukeuren zijn aangenomen via een proces waaraan alle betrokkenen, zoals regeringsinstanties, consumenten,
      fabrikanten, kleinhandel en milieuorganisaties kunnen deelnemen, en
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel23
  - number: 23.8.d
    text: de keuren toegankelijk zijn voor alle betrokken partijen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel23
  - number: '23.9'
    text: |-
      Een aanbestedende dienst kan aangeven dat de van een milieukeur voorziene producten of diensten worden geacht te
      voldoen aan de technische specificaties van het beschrijvend document. De aanbestedende dienst aanvaardt hierbij
      elk ander passend bewijsmiddel, zoals een technisch dossier van de fabrikant of een testverslag van een erkende
      organisatie.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel23
  - number: '23.10'
    text: |-
      Een aanbestedende dienst aanvaardt certificaten van in andere lidstaten van de Europese Unie gevestigde erkende
      organisaties.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel23
  - number: '23.11'
    text: |-
      Een aanbestedende dienst maakt in de technische specificaties geen melding van een bepaald fabrikaat, een bepaalde
      herkomst of een bijzondere werkwijze, noch van een verwijzing naar een merk, een octrooi of een type, een bepaalde
      oorsprong of een bepaalde productie, waardoor bepaalde ondernemingen of bepaalde producten worden bevoordeeld of
      geëlimineerd, tenzij dit door het voorwerp van de overheidsopdracht gerechtvaardigd wordt.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel23
  - number: '23.12'
    text: |-
      Een aanbestedende dienst mag de melding of verwijzing, bedoeld in het elfde lid, opnemen in de technische
      specificatie wanneer:
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel23
  - number: 23.12.a
    text: |-
      een voldoende nauwkeurige en begrijpelijke beschrijving van het voorwerp van de overheidsopdracht niet mogelijk is
      door toepassing van het derde en vijfde lid, en
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel23
  - number: 23.12.b
    text: deze melding of verwijzing vergezeld gaat van de woorden «of gelijkwaardig».
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel23
  - number: '24.1'
    text: |-
      Een aanbestedende dienst kan de inschrijvers toestaan varianten voor te stellen, wanneer voor de gunning het
      criterium van de economisch meest voordelige inschrijving wordt gehanteerd.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel24
  - number: '24.2'
    text: |-
      Een aanbestedende dienst vermeldt in de aankondiging van de overheidsopdracht of hij varianten toestaat. Een
      aanbestedende dienst staat alleen varianten toe wanneer hij in de aankondiging heeft vermeld dat deze zijn
      toegestaan.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel24
  - number: '24.3'
    text: |-
      Een aanbestedende dienst die varianten toestaat, vermeldt in het beschrijvend document aan welke minimumeisen deze
      varianten ten minste voldoen, en hoe zij worden ingediend.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel24
  - number: '24.4'
    text: Een aanbestedende dienst houdt alleen rekening met de varianten die aan de gestelde minimumeisen voldoen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel24
  - number: '24.5'
    text: |-
      Bij procedures voor het gunnen van overheidsopdrachten voor leveringen of overheidsopdrachten voor diensten wijst
      een aanbestedende dienst die varianten heeft toegestaan, een variant niet af uitsluitend omdat deze, indien deze
      werd gekozen, veeleer tot een overheidsopdracht voor diensten dan tot een overheidsopdracht voor leveringen, dan
      wel veeleer tot een overheidsopdracht voor leveringen dan tot een overheidsopdracht voor diensten zou leiden.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel24
  - number: '25'
    text: |-
      In het beschrijvend document kan een aanbestedende dienst een inschrijver verzoeken om in zijn inschrijving aan
      te geven welk gedeelte van de overheidsopdracht hij voornemens is aan derden in onderaanneming te geven en welke
      onderaannemers hij voorstelt.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel25
  - number: '26'
    text: |-
      Een aanbestedende dienst kan bijzondere voorwaarden verbinden aan de uitvoering van een overheidsopdracht,
      mits dergelijke voorwaarden met het Verdrag tot oprichting van de Europese Gemeenschap verenigbaar zijn en in
      de aankondiging of het beschrijvend document vermeld zijn. De voorwaarden waaronder de overheidsopdracht wordt
      uitgevoerd, kunnen verband houden met sociale of milieuoverwegingen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel26
  - number: '27.1'
    text: |-
      In het beschrijvend document geeft een aanbestedende dienst aan bij welk orgaan de gegadigden of inschrijvers
      informatie kunnen verkrijgen over verplichtingen ten aanzien van de bepalingen inzake belastingen,
      milieubescherming, arbeidsbescherming en arbeidsvoorwaarden die gelden in Nederland of, indien de verrichtingen
      buiten Nederland worden uitgevoerd, die gelden in het gebied of de plaats waar de verrichtingen worden uitgevoerd
      en die gedurende de uitvoering van de overheidsopdracht op die verrichtingen van toepassing zullen zijn.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel27
  - number: '27.2'
    text: |-
      Een aanbestedende dienst verzoekt de inschrijvers of de gegadigden aan te geven dat zij bij het opstellen
      van hun inschrijving rekening hebben gehouden met de verplichtingen uit hoofde van de bepalingen inzake de
      arbeidsbescherming en de arbeidsvoorwaarden die gelden op de plaats waar de verrichting wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel27
  - number: '28.1'
    text: |-
      Een aanbestedende dienst maakt voor het gunnen van overheidsopdrachten gebruik van de openbare procedure of de
      niet-openbare procedure.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel28
  - number: '28.2'
    text: |-
      In de gevallen en de omstandigheden die in [artikel 29][ref1] zijn vermeld, kan een aanbestedende dienst zijn
      overheidsopdrachten door middel van de concurrentiegerichte dialoog gunnen.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel29
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '29'
        paragraaf: '8'
  - number: '28.3'
    text: |-
      In de gevallen en omstandigheden zoals bepaald in de [artikelen 30][ref1] en [31][ref2], kan een aanbestedende
      dienst gebruik maken van een procedure van gunning door onderhandelingen, met of zonder mededeling van de
      aankondiging van de overheidsopdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel31
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '30'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '31'
        paragraaf: '8'
  - number: '29.1'
    text: |-
      Voor bijzonder complexe overheidsopdrachten kan een aanbestedende dienst, voor zover hij van oordeel is dat de
      toepassing van openbare procedures of niet-openbare procedures het niet mogelijk maakt de overheidsopdracht te
      gunnen, gebruik maken van de concurrentiegerichte dialoog overeenkomstig dit artikel.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel29
  - number: '29.2'
    text: |-
      De gunning van de overheidsopdracht geschiedt op basis van het criterium van de economisch meest voordelige
      inschrijving.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel29
  - number: '29.3'
    text: |-
      Een aanbestedende dienst maakt een aankondiging van een overheidsopdracht bekend waarin hij zijn behoeften en eisen
      vermeldt, die door hem in die aankondiging of in een beschrijvend document worden omschreven.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel29
  - number: '29.4'
    text: |-
      Een aanbestedende dienst opent met de overeenkomstig de [artikelen 44 tot en met 53][ref1] geselecteerde gegadigden
      een dialoog met het doel te bepalen welke middelen geschikt zijn om zo goed mogelijk aan de behoeften van de
      aanbestedende dienst te voldoen. Tijdens deze dialoog kan de aanbestedende dienst met de geselecteerde gegadigden
      alle aspecten van de overheidsopdracht bespreken.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel44
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '44'
        paragraaf: '12'
  - number: '29.5'
    text: |-
      Tijdens de dialoog waarborgt de aanbestedende dienst de gelijke behandeling van alle inschrijvers en verstrekt hij
      geen informatie die sommige inschrijvers kan bevoordelen boven andere.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel29
  - number: '29.6'
    text: |-
      Een aanbestedende dienst deelt de voorgestelde oplossingen of andere door een deelnemer aan de dialoog verstrekte
      vertrouwelijke inlichtingen niet aan de andere deelnemers mee zonder de instemming van eerstgenoemde deelnemer.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel29
  - number: '29.7'
    text: |-
      Een aanbestedende dienst kan bepalen dat de procedure in opeenvolgende fasen verloopt, zodat het aantal in de
      dialoogfase te bespreken oplossingen kan worden beperkt aan de hand van de gunningscriteria die in de aankondiging
      van de overheidsopdracht of in het beschrijvend document zijn vermeld. Een aanbestedende dienst vermeldt deze
      mogelijkheid in de aankondiging van de overheidsopdracht of in het beschrijvend document.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel29
  - number: '29.8'
    text: |-
      Een aanbestedende dienst zet de dialoog voort totdat hij, zo nodig na vergelijking, kan aangeven welke oplossingen
      aan zijn behoeften kunnen voldoen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel29
  - number: '29.9'
    text: |-
      Nadat een aanbestedende dienst de dialoog heeft beëindigd en de deelnemers daarvan op de hoogte heeft gesteld,
      verzoekt hij de deelnemers om hun definitieve inschrijvingen in te dienen op basis van de tijdens de dialoog
      voorgelegde en gespecificeerde oplossingen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel29
  - number: '29.10'
    text: |-
      De inschrijver voorziet er in dat de inschrijving, bedoeld in het negende lid, alle vereiste en noodzakelijke
      elementen voor de uitvoering van het project bevat.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel29
  - number: '29.11'
    text: |-
      Een aanbestedende dienst kan de inschrijver verzoeken om de inschrijving toe te lichten of nauwkeuriger te
      omschrijven.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel29
  - number: '29.12'
    text: |-
      Wanneer een verzoek als bedoeld in het elfde lid wordt gedaan wijzigt de inschrijver de basiselementen van de
      inschrijving of de aanbesteding niet wezenlijk.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel29
  - number: '29.13'
    text: |-
      Een aanbestedende dienst beoordeelt de ontvangen inschrijvingen op basis van de in de aankondiging van de
      overheidsopdracht of in het beschrijvend document bepaalde gunningscriteria en kiest de economisch voordeligste
      inschrijving overeenkomstig [artikel 54][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel54
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '54'
        paragraaf: '12'
  - number: '29.14'
    text: |-
      Op verzoek van een aanbestedende dienst kan de inschrijver waarvan de inschrijving is aangewezen als de economisch
      voordeligste inschrijving, verzocht worden aspecten van zijn inschrijving te verduidelijken of in de inschrijving
      opgenomen verbintenissen te bevestigen, op voorwaarde dat dit de inhoudelijke aspecten van de inschrijving of van
      de aankondiging ongewijzigd laat en niet leidt of dreigt te leiden tot concurrentievervalsing of discriminatie.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel29
  - number: '29.15'
    text: Een aanbestedende dienst kan voorzien in prijzen of betalingen aan de deelnemers aan de dialoog.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel29
  - number: '30.1'
    text: |-
      Een aanbestedende dienst kan voor het gunnen van zijn overheidsopdrachten gebruik maken van een procedure van
      gunning door onderhandelingen na voorafgaande mededeling van een aankondiging van een overheidsopdracht:
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel30
  - number: 30.1.a
    text: |-
      indien in het kader van een openbare procedure of niet-openbare procedure of een concurrentiegerichte dialoog
      inschrijvingen zijn gedaan die onregelmatig zijn, of indien inschrijvingen zijn gedaan die onaanvaardbaar zijn op
      grond van de [artikelen 4][ref1], [24][ref2], [25][ref3], [27][ref4], [44 tot en met 54][ref5] en [57][ref6], mits
      de oorspronkelijke voorwaarden van de overheidsopdracht niet wezenlijk worden gewijzigd,


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0018607#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0018607#Artikel27
      [ref5]: https://wetten.overheid.nl/BWBR0018607#Artikel44
      [ref6]: https://wetten.overheid.nl/BWBR0018607#Artikel57
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '24'
        paragraaf: '7'
      - id: ref3
        bwb_id: BWBR0018607
        artikel: '25'
        paragraaf: '7'
      - id: ref4
        bwb_id: BWBR0018607
        artikel: '27'
        paragraaf: '7'
      - id: ref5
        bwb_id: BWBR0018607
        artikel: '44'
        paragraaf: '12'
      - id: ref6
        bwb_id: BWBR0018607
        artikel: '57'
        paragraaf: '13'
  - number: 30.1.b
    text: |-
      in buitengewone gevallen, wanneer het werken, leveringen of diensten betreft waarvan de aard en de onzekere
      omstandigheden een vaststelling vooraf van de totale prijs niet mogelijk maken,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel30
  - number: 30.1.c
    text: |-
      wanneer, in het geval van overheidsopdrachten voor diensten als bedoeld in
      [categorie 6 van bijlage 2, onderdeel A][ref1], en intellectuele diensten, vanwege de aard van de te verlenen
      diensten de specificaties voor de overheidsopdracht niet voldoende nauwkeurig kunnen worden vastgesteld om de
      opdracht overeenkomstig de voorschriften inzake de openbare procedure of de niet-openbare procedure door de keuze
      van de beste inschrijving te gunnen, of


      [ref1]: https://wetten.overheid.nl/BWBR0018607
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0018607
  - number: 30.1.d
    text: |-
      in het geval van overheidsopdrachten voor werken, wanneer het werken betreft die worden uitgevoerd ten behoeve
      van onderzoek, proefneming of ontwikkeling, en zonder het doel winst te maken of de kosten van onderzoek en
      ontwikkeling te dekken.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel30
  - number: '30.2'
    text: |-
      Een aanbestedende dienst kan, wanneer de omstandigheden, bedoeld in het eerste lid, aanhef en onderdeel a,
      zich voordoen, van de mededeling van een aankondiging van een overheidsopdracht afzien, indien hij bij de
      procedure van gunning door onderhandelingen alleen de inschrijvers betrekt die voldoen aan de criteria van de
      [artikelen 45 tot en met 53][ref1] en die gedurende de voorafgaande openbare procedure of niet-openbare procedure
      of concurrentiegerichte dialoog inschrijvingen hebben ingediend die aan de formele eisen van de procedure voor het
      gunnen van overheidsopdrachten voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel45
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '45'
        paragraaf: '12'
  - number: '30.3'
    text: |-
      In de gevallen, bedoeld in het eerste en tweede lid, onderhandelt de aanbestedende dienst met de inschrijvers
      over de door de inschrijvers ingediende inschrijvingen, teneinde deze aan te passen aan de eisen die hij in de
      aankondiging van de overheidsopdracht, het beschrijvend document en de eventuele aanvullende documenten heeft
      gesteld en teneinde het beste bod, bedoeld in [artikel 54, eerste lid][ref1], te zoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel54
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '54'
        paragraaf: '12'
  - number: '30.4'
    text: |-
      Tijdens de onderhandelingen waarborgt de aanbestedende dienst de gelijke behandeling van alle inschrijvers, en
      verstrekt geen informatie, waardoor bepaalde inschrijvers boven andere inschrijvers bevoordeeld kunnen worden.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel30
  - number: '30.5'
    text: |-
      Een aanbestedende dienst kan bepalen dat de procedure van gunning door onderhandelingen in opeenvolgende fasen
      verloopt, zodat het aantal inschrijvingen waarover onderhandeld wordt, door toepassing van de gunningscriteria die
      in de aankondiging van de overheidsopdracht of in het beschrijvend document zijn vermeld, verminderd wordt. Een
      aanbestedende dienst vermeldt in de aankondiging van de overheidsopdracht of in het beschrijvend document dat van
      deze mogelijkheid gebruik kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel30
  - number: '31.1'
    text: |-
      Een aanbestedende dienst kan voor het gunnen van zijn overheidsopdrachten gebruik maken van een procedure van
      gunning door onderhandelingen zonder voorafgaande mededeling van een aankondiging van een overheidsopdracht:
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel31
  - number: 31.1.a
    text: |-
      wanneer, in het kader van een openbare procedure of een niet-openbare procedure, geen of geen geschikte
      inschrijvingen of geen verzoeken om een uitnodiging tot deelneming zijn ingediend, mits de oorspronkelijke
      voorwaarden van de overheidsopdracht niet wezenlijk worden gewijzigd en de Commissie op haar verzoek een verslag
      wordt overgelegd,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel31
  - number: 31.1.b
    text: |-
      wanneer de overheidsopdracht om technische of artistieke redenen of om redenen van bescherming van uitsluitende
      rechten slechts aan een bepaalde ondernemer kan worden toevertrouwd, of
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel31
  - number: 31.1.c
    text: |-
      voor zover zulks strikt noodzakelijk is, ingeval de termijnen voor de openbare procedure of de niet-openbare
      procedure dan wel voor de procedure van gunning door onderhandelingen met mededeling van een aankondiging van een
      overheidsopdracht als bedoeld in [artikel 30][ref1] wegens dwingende spoed, als gevolg van gebeurtenissen die door
      de aanbestedende dienst niet kon worden voorzien en niet aan de aanbestedende dienst te wijten is, niet in acht
      kunnen worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel30
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '30'
        paragraaf: '8'
  - number: '31.2'
    text: |-
      Een aanbestedende dienst kan overheidsopdrachten voor leveringen gunnen na een procedure van gunning door
      onderhandelingen zonder voorafgaande mededeling van een aankondiging van een overheidsopdracht in de volgende
      gevallen:
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel31
  - number: 31.2.a
    text: |-
      wanneer het producten betreft die voor onderzoek, proefneming, studie of ontwikkeling worden vervaardigd en welke
      niet voor de productie in grote hoeveelheden zijn bedoeld om de commerciële haalbaarheid van het product vast te
      stellen of de kosten van onderzoek en ontwikkeling te delgen,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel31
  - number: 31.2.b
    text: |-
      voor door de oorspronkelijke leverancier verrichte aanvullende leveringen die: - bestemd zijn voor gedeeltelijke
      vernieuwing van leveringen of installaties voor courant gebruik, of
        - voor de uitbreiding van bestaande leveringen of installaties, wanneer verandering van leverancier de
      aanbestedende dienst ertoe zou verplichten apparatuur aan te schaffen met andere technische eigenschappen, zodat
      onverenigbaarheid ontstaat of zich bij gebruik en onderhoud onevenredige technische moeilijkheden voordoen, mits de
      looptijd van deze overheidsopdrachten voor leveringen en nabestellingen niet langer is dan drie jaar,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel31
  - number: 31.2.c
    text: voor op een grondstoffenmarkt genoteerde en aangekochte leveringen, of
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel31
  - number: 31.2.d
    text: |-
      voor de aankoop van leveringen tegen bijzonder gunstige voorwaarden bij een leverancier die definitief zijn
      handelsactiviteit stopzet, bij curatoren of vereffenaars van een faillissement of een vonnis of bij de toepassing
      van de schuldsaneringsregeling natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel31
  - number: '31.3'
    text: |-
      Een aanbestedende dienst kan een overheidsopdracht voor diensten gunnen na een procedure van gunning door
      onderhandelingen zonder voorafgaande mededeling van een aankondiging, wanneer die opdracht voortvloeit uit een
      prijsvraag en volgens de toepasselijke voorschriften aan de winnaar of aan een van de winnaars van die prijsvraag
      dient te worden gegund. In dit laatste geval nodigt de aanbestedende dienst alle winnaars van de prijsvraag tot de
      onderhandelingen uit.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel31
  - number: '31.4'
    text: |-
      Een aanbestedende dienst kan een overheidsopdracht voor werken of een overheidsopdracht voor diensten gunnen na een
      procedure van gunning door onderhandelingen zonder voorafgaande aankondiging in de volgende gevallen:
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel31
  - number: 31.4.a
    text: |-
      voor aanvullende werken of diensten die noch in het oorspronkelijk gegunde ontwerp, noch in de oorspronkelijk
      gegunde overheidsopdracht voor werken of overheidsopdracht voor diensten waren opgenomen, onder de volgende
      voorwaarden:
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel31
  - number: 31.4.a.1°
    text: |-
      de aanvullende werken of diensten zijn ten gevolge van een onvoorziene omstandigheid voor de uitvoering van deze
      overheidsopdracht noodzakelijk geworden;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel31
  - number: 31.4.a.2°
    text: |-
      de gunning geschiedt aan de aannemer of dienstverlener die de oorspronkelijke overheidsopdracht voor werken of
      overheidsopdracht voor diensten uitvoert, en
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel31
  - number: 31.4.a.3°
    text: |-
      het totale bedrag van de voor de aanvullende werken of diensten gegunde overheidsopdracht voor werken
      of overheidsopdracht voor diensten niet hoger is dan 50 procent van het bedrag van de oorspronkelijke
      overheidsopdracht, en de aanvullende werken of diensten voorts - technisch of economisch niet los van de
      oorspronkelijke opdracht kunnen worden uitgevoerd zonder overwegende bezwaren voor de aanbestedende diensten, of
        - wel kunnen worden gescheiden, maar strikt noodzakelijk zijn om de oorspronkelijke opdracht te vervolmaken;
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel31
  - number: 31.4.b
    text: |-
      in geval van nieuwe werken of diensten, bestaande uit de herhaling van soortgelijke werken of diensten die door
      dezelfde aanbestedende diensten worden toevertrouwd aan de ondernemer waaraan een oorspronkelijke overheidsopdracht
      werd gegund, mits deze werken of deze diensten overeenstemmen met een basisproject dat het voorwerp vormde van de
      oorspronkelijke overheidsopdracht die overeenkomstig de openbare procedure of de niet-openbare procedures is gegund
      en mits:
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel31
  - number: 31.4.b.1°
    text: |-
      de aanbestedende diensten reeds in de aankondiging van de aanbesteding van het basisproject vermelden dat een
      procedure zonder aankondiging kan worden toegepast, en
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel31
  - number: 31.4.b.2°
    text: |-
      de aanbestedende diensten hierbij het totale voor de volgende werken geraamde bedrag in aanmerking nemen voor de
      toepassing van de [artikel 7][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel7
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '7'
        paragraaf: '3'
  - number: '32.1'
    text: Een aanbestedende dienst kan een raamovereenkomst sluiten.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel32
  - number: '32.2'
    text: |-
      Een aanbestedende dienst die een raamovereenkomst sluit overeenkomstig de [artikelen 2 tot en met 6][ref1],
      [18 tot en met 31][ref2] of [33 tot en met 57][ref3], kan op basis van die raamovereenkomst overheidsopdrachten
      gunnen overeenkomstig de procedures, bedoeld in het zevende tot en met het tiende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0018607#Artikel33
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '18'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0018607
        artikel: '33'
        paragraaf: '8'
  - number: '32.3'
    text: |-
      De procedures, bedoeld in het zevende tot en met het tiende lid, zijn slechts van toepassing tussen een
      aanbestedende dienst en de ondernemers die oorspronkelijk bij de raamovereenkomst partij waren.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel32
  - number: '32.4'
    text: |-
      Bij de gunning van overheidsopdrachten die op een raamovereenkomst zijn gebaseerd, mogen de partijen geen
      substantiële wijzigingen aanbrengen in de in de raamovereenkomst gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel32
  - number: '32.5'
    text: |-
      De looptijd van een raamovereenkomst is niet langer dan vier jaar, behalve in uitzonderingsgevallen die deugdelijk
      gemotiveerd zijn.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel32
  - number: '32.6'
    text: |-
      Een aanbestedende dienst gebruikt een raamovereenkomst niet om de mededinging te hinderen, te beperken of te
      vervalsen en maakt geen oneigenlijk gebruik van een raamovereenkomst.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel32
  - number: '32.7'
    text: |-
      Als een raamovereenkomst is gesloten met een enkele ondernemer worden de op die raamovereenkomst gebaseerde
      overheidsopdrachten gegund volgens de in de raamovereenkomst gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel32
  - number: '32.8'
    text: |-
      Overheidsopdrachten op basis van raamovereenkomsten met een enkele ondernemer kunnen worden gegund door die
      ondernemer schriftelijk te raadplegen en hem indien nodig te verzoeken zijn inschrijvingen aan te vullen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel32
  - number: '32.9'
    text: |-
      Als een raamovereenkomst wordt gesloten met meerdere ondernemers, wordt deze raamovereenkomst met minimaal
      drie ondernemers gesloten, voorzover het aantal ondernemers dat aan de selectiecriteria voldoet, of het aantal
      inschrijvingen dat aan de gunningscriteria voldoet, voldoende groot is.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel32
  - number: '32.10'
    text: 'Overheidsopdrachten op basis van raamovereenkomsten met meerdere ondernemers kunnen worden gegund:'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel32
  - number: 32.10.a
    text: |-
      door toepassing van de in de raamovereenkomst bepaalde voorwaarden, zonder de partijen opnieuw tot mededinging op
      te roepen, of
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel32
  - number: 32.10.b
    text: |-
      wanneer niet alle voorwaarden in de raamovereenkomst zijn bepaald, door de partijen opnieuw tot mededinging
      op te roepen onder de in de raamovereenkomst of in het beschrijvend document van de raamovereenkomst bepaalde
      voorwaarden, volgens de onderstaande procedure:
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel32
  - number: 32.10.b.1°
    text: |-
      voor een te gunnen overheidsopdracht raadplegen de aanbestedende diensten schriftelijk de ondernemers die in staat
      zijn de overheidsopdracht uit te voeren,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel32
  - number: 32.10.b.2°
    text: |-
      een aanbestedende dienst stelt een voldoende lange termijn vast voor de indiening van inschrijvingen voor een
      specifieke overheidsopdracht, waarbij hij rekening houdt met elementen zoals de complexiteit van het voorwerp van
      de overheidsopdracht en de benodigde tijd voor de toezending van de inschrijvingen,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel32
  - number: 32.10.b.3°
    text: |-
      de inschrijvingen worden schriftelijk ingediend en de inhoud ervan blijft vertrouwelijk totdat de vastgestelde
      indieningstermijn is verstreken,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel32
  - number: 32.10.b.4°
    text: |-
      een aanbestedende dienst gunt een overheidsopdracht aan de inschrijver die op grond van de in het beschrijvend
      document van de raamovereenkomst vastgestelde gunningscriteria de beste inschrijving heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel32
  - number: '33.1'
    text: Een aanbestedende dienst kan gebruik maken van een dynamisch aankoopsysteem.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel33
  - number: '33.2'
    text: |-
      Voor de instelling van een dynamisch aankoopsysteem volgt een aanbestedende dienst de voorschriften van alle
      fasen van de openbare procedure tot aan de gunning van de overheidsopdrachten die in het kader van dit dynamische
      aankoopsysteem worden gegund.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel33
  - number: '33.3'
    text: |-
      Een aanbestedende dienst laat alle inschrijvers die aan de selectiecriteria voldoen en overeenkomstig het
      beschrijvend document en de eventuele aanvullende documenten een indicatieve inschrijving hebben ingediend, tot het
      dynamische aankoopsysteem toe.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel33
  - number: '33.4'
    text: |-
      Een aanbestedende dienst staat toe dat indicatieve inschrijvingen te allen tijde kunnen worden verbeterd, op
      voorwaarde dat zij niet afwijken van het beschrijvend document.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel33
  - number: '33.5'
    text: |-
      Voor het opzetten van een dynamisch aankoopsysteem en voor de gunning van de overheidsopdrachten
      in het kader hiervan gebruikt een aanbestedende dienst elektronische middelen overeenkomstig
      [artikel 42, tweede tot en met het elfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel42
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '42'
        paragraaf: '11'
  - number: '33.6'
    text: 'Bij de instelling van een dynamisch aankoopsysteem:'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel33
  - number: 33.6.a
    text: |-
      publiceert de aanbestedende dienst een aankondiging van de overheidsopdracht en geeft daarbij aan dat het om een
      dynamisch aankoopsysteem gaat,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel33
  - number: 33.6.b
    text: |-
      verstrekt de aanbestedende dienst in het beschrijvend document nadere gegevens over onder andere de aard van
      de overwogen aankopen waarop dit dynamische aankoopsysteem betrekking heeft, alle nodige informatie omtrent het
      aankoopsysteem, de gebruikte elektronische apparatuur en de nadere technische bepalingen en specificaties voor de
      verbinding, en
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel33
  - number: 33.6.c
    text: |-
      biedt de aanbestedende dienst tegelijk met de publicatie van de overheidsopdracht en tot aan het vervallen van
      het dynamische aankoopsysteem langs elektronische weg een vrije, rechtstreekse en volledige toegang tot het
      beschrijvend document en alle aanvullende documenten en geeft de aanbestedende dienst in de aankondiging het
      internetadres aan waar deze documenten kunnen worden geraadpleegd.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel33
  - number: '33.7'
    text: |-
      Een ondernemer kan een indicatieve inschrijving indienen om toegelaten te worden tot het dynamische aankoopsysteem
      onder de voorwaarden, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel33
  - number: '33.8'
    text: Een aanbestedende dienst beoordeelt de indicatieve inschrijving binnen 15 dagen na indiening.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel33
  - number: '33.9'
    text: |-
      Een aanbestedende dienst kan de termijn, bedoeld in het achtste lid, verlengen, op voorwaarde dat er tussentijds
      geen aankondiging van de overheidsopdracht wordt uitgeschreven.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel33
  - number: '33.10'
    text: |-
      Een aanbestedende dienst deelt de ondernemer, bedoeld in de het zevende lid, zo snel mogelijk mee dat hij is
      toegelaten tot het dynamische aankoopsysteem of dat zijn indicatieve inschrijving is afgewezen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel33
  - number: '33.11'
    text: Een aanbestedende dienst publiceert voor een specifieke overheidsopdracht een aankondiging.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel33
  - number: '33.12'
    text: |-
      Alvorens een aankondiging als bedoeld in het elfde lid te plaatsen, publiceert de aanbestedende dienst een
      vereenvoudigde aankondiging waarin alle belangstellende ondernemers worden uitgenodigd om overeenkomstig het vierde
      lid een indicatieve inschrijving in te dienen, binnen een termijn van ten minste 15 dagen, te rekenen vanaf de
      verzenddatum van de vereenvoudigde aankondiging.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel33
  - number: '33.13'
    text: |-
      Een aanbestedende dienst schrijft een aankondiging uit nadat de beoordeling is afgerond van alle indicatieve
      inschrijvingen, die binnen de termijn, bedoeld in het twaalfde lid, zijn ingediend.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel33
  - number: '33.14'
    text: |-
      Een aanbestedende dienst nodigt alle tot het dynamische aankoopsysteem toegelaten ondernemers uit om voor een
      specifieke overheidsopdracht die binnen dat dynamische aankoopsysteem wordt gegund een inschrijving in te dienen.
      Daartoe stelt de aanbestedende dienst een voldoende lange termijn vast voor de indiening van de inschrijvingen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel33
  - number: '33.15'
    text: |-
      Een aanbestedende dienst gunt de overheidsopdracht aan de inschrijver die de beste inschrijving heeft ingediend op
      grond van de gunningscriteria die zijn vermeld in de aankondiging van de overheidsopdracht waarbij het dynamische
      aankoopsysteem wordt ingesteld. Deze criteria kunnen gepreciseerd worden in de uitnodiging, bedoeld in het
      veertiende lid.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel33
  - number: '33.16'
    text: |-
      Een dynamisch aankoopsysteem duurt niet langer dan vier jaar. Een aanbestedende dienst kan in uitzonderlijke
      gevallen van deze termijn afwijken, waarbij hij deze uitzondering deugdelijk motiveert.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel33
  - number: '33.17'
    text: |-
      Een aanbestedende dienst maakt geen gebruik van een dynamisch aankoopsysteem om de mededinging te hinderen, te
      beperken of te vervalsen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel33
  - number: '33.18'
    text: |-
      Een aanbestedende dienst, die gebruik maakt van een dynamisch aankoopsysteem, brengt aan de betrokken ondernemers
      geen administratiekosten in rekening.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel33
  - number: '34.1'
    text: |-
      Een aanbestedende dienst kan teneinde die aannemer te kiezen die het meest geschikt is om mee samen te werken,
      een bijzondere procedure voor de gunning toepassen bij overheidsopdrachten betreffende het ontwerpen en bouwen
      van een complex sociale woningen, waarvoor, wegens de omvang, de complexiteit en de vermoedelijke duur van de
      desbetreffende werken, het plan van meet af aan wordt opgesteld op grond van een nauwe samenwerking tussen de
      afgevaardigden van de aanbestedende diensten, deskundigen en de aannemer die met de uitvoering van de werken wordt
      belast.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel34
  - number: '34.2'
    text: |-
      Een aanbestedende dienst geeft in de aankondiging van de overheidsopdracht een zo nauwkeurig mogelijke beschrijving
      van de werken, bedoeld in het eerste lid, opdat de belangstellende aannemers zich een duidelijk beeld van het uit
      te voeren project kunnen vormen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel34
  - number: '34.3'
    text: |-
      Een aanbestedende dienst vermeldt in deze aankondiging, overeenkomstig de kwalitatieve selectiecriteria, bedoeld in
      de [artikelen 45 tot en met 53][ref1], aan welke persoonlijke, technische, economische en financiële voorwaarden de
      gegadigden dienen te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel45
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '45'
        paragraaf: '12'
  - number: '34.4'
    text: |-
      Wanneer een aanbestedende dienst van de procedure, bedoeld in het eerste lid, gebruik maakt, past hij de
      [artikelen 2][ref1], [35][ref2], [36][ref3], [38][ref4], [39][ref5], [41][ref6], [42][ref7], [43][ref8] en de
      [artikelen 45 tot en met 53][ref9] toe.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0018607#Artikel36
      [ref4]: https://wetten.overheid.nl/BWBR0018607#Artikel38
      [ref5]: https://wetten.overheid.nl/BWBR0018607#Artikel39
      [ref6]: https://wetten.overheid.nl/BWBR0018607#Artikel41
      [ref7]: https://wetten.overheid.nl/BWBR0018607#Artikel42
      [ref8]: https://wetten.overheid.nl/BWBR0018607#Artikel43
      [ref9]: https://wetten.overheid.nl/BWBR0018607#Artikel45
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel34
