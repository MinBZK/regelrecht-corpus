        artikel: '45'
        paragraaf: '12'
  - number: '35.1'
    text: |-
      Een aanbestedende dienst kan in een vooraankondiging die door de Commissie of door de aanbestedende dienst zelf via
      hun kopersprofiel wordt verspreid, mededelen:
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel35
  - number: 35.1.a
    text: |-
      het geraamde totale bedrag van de overheidsopdrachten voor leveringen of de raamovereenkomsten voor leveringen per
      productgroep die hij voornemens is in de loop van de komende twaalf maanden te gunnen of te sluiten, wanneer het
      geraamde totale bedrag, met inachtneming van [artikel 9][ref1], € 750.000 of meer bedraagt;


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel9
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '9'
        paragraaf: '3'
  - number: 35.1.b
    text: |-
      het geraamde totale bedrag van de overheidsopdrachten voor diensten of de raamovereenkomst voor diensten voor
      elk van de dienstencategorieën als bedoeld in [bijlage 2, onderdeel A][ref1] die hij voornemens is in de loop
      van de komende twaalf maanden te gunnen of te sluiten, wanneer het geraamde totale bedrag, met inachtneming van
      [artikel 9][ref2], € 750.000 of meer bedraagt;


      [ref1]: https://wetten.overheid.nl/BWBR0018607
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel9
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0018607
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '9'
        paragraaf: '3'
  - number: 35.1.c
    text: |-
      de hoofdkenmerken van de overheidsopdrachten voor werken of de raamovereenkomsten voor werken die hij voornemens is
      te gunnen of te sluiten, wanneer het geraamde bedrag, met inachtneming van [artikel 9][ref1], gelijk is aan of meer
      bedraagt dan de drempel, genoemd in [artikel 7, onderdeel c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel7
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '9'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '7'
        paragraaf: '3'
  - number: '35.2'
    text: |-
      De vooraankondiging, bedoeld in het eerste lid, bevat de gegevens, genoemd in [bijlage 4, onderdeel A][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018607
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0018607
  - number: '35.3'
    text: |-
      Een aanbestedende dienst gebruikt voor de vooraankondiging die via een kopersprofiel meegedeeld kan worden, bedoeld
      in het eerste lid, en in de aankondiging, het formulier volgens het model dat door de Commissie overeenkomstig de
      in artikel 77, tweede lid, van [richtlijn 2004/18/EG](32004L0018) bedoelde procedure is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel35
  - number: '35.4'
    text: |-
      Het kopersprofiel, bedoeld in het eerste lid, kan voor aankondigingen informatie bevatten over lopende
      aanbestedingsprocedures, voorgenomen aankopen, gegunde overheidsopdrachten, geannuleerde procedures, en alle
      nuttige algemene informatie, zoals het contactpunt, een telefoon- en faxnummer, een postadres en een e-mailadres.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel35
  - number: '35.5'
    text: |-
      Een aanbestedende dienst zendt de aankondiging, bedoeld in het eerste lid, onderdelen a en b, zo spoedig mogelijk
      na het begin van het begrotingsjaar toe aan de Commissie of deelt deze aankondigingen mede via het kopersprofiel.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel35
  - number: '35.6'
    text: |-
      Een aanbestedende dienst zendt de aankondiging, bedoeld in het eerste lid, onderdeel c, zo spoedig mogelijk
      nadat de beslissing is genomen tot goedkeuring van het programma voor de overheidsopdrachten voor werken of de
      raamovereenkomsten die de aanbestedende dienst voornemens is te gunnen of te sluiten, toe aan de Commissie of deelt
      deze aankondigingen mede via het kopersprofiel.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel35
  - number: '35.7'
    text: |-
      Een aanbestedende dienst kan de informatie in het kopersprofiel, bedoeld in het vierde lid, via het internet
      publiceren.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel35
  - number: '35.8'
    text: |-
      Een aanbestedende dienst die de vooraankondiging via zijn kopersprofiel mee deelt, zendt de Commissie langs
      elektronische weg overeenkomstig het model in het derde punt van bijlage VIII van [richtlijn nr. 2004/18/EG]
      (32004L0018) een kennisgeving toe waarin de mededeling van de vooraankondiging via het kopersprofiel wordt gemeld.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel35
  - number: '35.9'
    text: |-
      Een aanbestedende dienst die een overheidsopdracht wenst te gunnen of een raamovereenkomst wenst te sluiten
      volgens een openbare procedure of een niet-openbare procedure dan wel volgens een procedure van gunning door
      onderhandelingen met mededeling van een aankondiging van een overheidsopdracht als bedoeld in [artikel 30][ref1]
      of een concurrentiegerichte dialoog als bedoeld in [artikel 29][ref2], geeft zijn voornemen hiertoe in een
      aankondiging van een overheidsopdracht te kennen.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel29
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '30'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '29'
        paragraaf: '8'
  - number: '35.10'
    text: |-
      Een aanbestedende dienst die een dynamisch aankoopsysteem wil instellen, maakt zijn voornemen kenbaar via een
      aankondiging van een overheidsopdracht.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel35
  - number: '35.11'
    text: |-
      Een aanbestedende dienst die een overheidsopdracht wenst te gunnen op basis van een dynamisch aankoopsysteem maakt
      zijn voornemen via een vereenvoudigde aankondiging van een overheidsopdracht kenbaar.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel35
  - number: '35.12'
    text: |-
      Een aanbestedende dienst die een overheidsopdracht heeft gegund of een raamovereenkomst heeft gesloten, zendt de
      Commissie uiterlijk 48 dagen na de gunning van de overheidsopdracht of de sluiting van de raamovereenkomst een
      aankondiging betreffende de resultaten van de procedure toe.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel35
  - number: '35.13'
    text: |-
      Een aanbestedende dienst is in het geval van overeenkomstig [artikel 32][ref1] gesloten raamovereenkomsten
      niet verplicht een aankondiging betreffende de resultaten van de gunning van een op de overeenkomst gebaseerde
      overheidsopdracht aan de Commissie te zenden.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel32
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '32'
        paragraaf: '8'
  - number: '35.14'
    text: |-
      Een aanbestedende dienst zendt de Commissie binnen 48 dagen na de gunning van een afzonderlijke overheidsopdracht
      op basis van een dynamisch aankoopsysteem een mededeling toe van het resultaat van de procedure.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel35
  - number: '35.15'
    text: |-
      Een aanbestedende dienst kan de resultaten, bedoeld in het veertiende lid, per kwartaal bundelen. Indien de
      aanbestedende dienst daarvoor kiest zendt hij de gebundelde resultaten binnen twee maanden na het einde van elk
      kwartaal toe.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel35
  - number: '35.16'
    text: |-
      Met betrekking tot overheidsopdrachten voor diensten als bedoeld in [bijlage 2, onderdeel B][ref1] vermeldt een
      aanbestedende dienst in de aankondiging of hij met de mededeling ervan instemt.


      [ref1]: https://wetten.overheid.nl/BWBR0018607
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0018607
  - number: '35.17'
    text: |-
      Een aanbestedende dienst kan bepaalde gegevens betreffende de gunning van de overheidsopdracht of de sluiting van
      de raamovereenkomst niet meedelen indien openbaarmaking van die gegevens de toepassing van het recht in de weg zou
      staan, met het openbaar belang in strijd zou zijn, de rechtmatige commerciële belangen van ondernemers zou kunnen
      schaden, of afbreuk aan de eerlijke mededinging tussen hen zou kunnen doen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel35
  - number: '36.1'
    text: |-
      De aankondigingen, bedoeld in [artikel 35][ref1], bevatten de desbetreffende inlichtingen, genoemd in
      [bijlage 4][ref2], en alle door de aanbestedende dienst nuttig geachte inlichtingen in de vorm van het formulier
      volgens het model dat door de Commissie overeenkomstig de in artikel 77, tweede lid, van [richtlijn 2004/18/EG]
      (32004L0018) bedoelde procedure is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0018607
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '35'
        paragraaf: '9'
      - id: ref2
        bwb_id: BWBR0018607
  - number: '36.2'
    text: |-
      Een aanbestedende dienst zendt de aankondiging, bedoeld in het eerste lid, langs elektronische weg overeenkomstig
      het model in het derde punt van bijlage VIII van [richtlijn nr. 2004/18/EG](32004L0018), of langs andere weg aan
      de Commissie.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel36
  - number: '36.3'
    text: |-
      In het geval van de in [artikel 38, elfde lid][ref1], beschreven versnelde procedure wordt de aankondiging door de
      aanbestedende dienst aan de Commissie hetzij per fax, hetzij langs elektronische weg overeenkomstig het model in
      het derde punt van bijlage VIII van [richtlijn nr. 2004/18/EG](32004L0018) verzonden.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel38
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '38'
        paragraaf: '10'
  - number: '36.4'
    text: |-
      Een aanbestedende dienst maakt de aankondiging en de inhoud ervan niet openbaar vóór de datum waarop zij aan de
      Commissie wordt toegezonden.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel36
  - number: '36.5'
    text: |-
      Een aanbestedende dienst waarborgt dat de aankondiging die in Nederland wordt meegedeeld, geen andere informatie
      bevat dan de informatie in de aankondiging die overeenkomstig [artikel 35, eerste tot en met vierde lid][ref1],
      aan de Commissie wordt toegezonden of via een kopersprofiel wordt meegedeeld, en dat de datum van toezending aan de
      Commissie of van de mededeling via het kopersprofiel wordt vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel35
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '35'
        paragraaf: '9'
  - number: '36.6'
    text: |-
      Een aanbestedende dienst kan een vooraankondiging slechts via het kopersprofiel mededelen nadat de kennisgeving van
      de mededeling via het kopersprofiel aan de Commissie is verzonden, en indien de aanbestedende dienst de datum van
      deze verzending vermeldt.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel36
  - number: '36.7'
    text: |-
      Een aanbestedende dienst waarborgt dat de inhoud van een aankondiging die niet langs elektronische weg
      overeenkomstig het model in het derde punt van bijlage VIII van [richtlijn nr. 2004/18/EG](32004L0018) wordt
      verzonden, in beginsel beperkt blijft tot 650 woorden.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel36
  - number: '36.8'
    text: Een aanbestedende dienst waarborgt dat hij de verzenddatum van de aankondiging kan aantonen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel36
  - number: '36.9'
    text: |-
      De bevestiging van de mededeling van de aankondiging, welke verstrekt wordt door de Commissie, vormt het bewijs van
      bekendmaking van de verzonden informatie.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel36
  - number: '37.1'
    text: |-
      Een aanbestedende dienst stelt bij het opstellen van een aankondiging de categorieën van producten vast volgens
      de CPV.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel37
  - number: '37.2'
    text: |-
      In geval van discrepanties tussen de CPV en de NACE, of tussen de CPV en de CPC, zijn respectievelijk de NACE of de
      CPC van toepassing.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel37
  - number: '38.1'
    text: |-
      Een aanbestedende dienst houdt bij de vaststelling van de termijnen voor de ontvangst van inschrijvingen en
      verzoeken tot deelneming rekening met de complexiteit van de overheidsopdracht, de voor de voorbereiding van de
      inschrijvingen benodigde tijd en de in dit artikel vastgestelde minimumtermijnen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel38
  - number: '38.2'
    text: |-
      Voor openbare procedures bedraagt de termijn voor de ontvangst van de inschrijvingen minimaal 52 dagen, te rekenen
      vanaf de verzenddatum van de uitnodiging.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel38
  - number: '38.3'
    text: |-
      Voor niet-openbare procedures en procedures van gunning door onderhandelingen met mededeling van een aankondiging
      van een overheidsopdracht en de concurrentiegerichte dialoog bedraagt de termijn voor de ontvangst van de verzoeken
      tot deelneming minimaal 37 dagen, te rekenen vanaf de verzenddatum van de aankondiging van de overheidsopdracht.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel38
  - number: '38.4'
    text: |-
      Voor niet-openbare procedures bedraagt de termijn voor de ontvangst van de inschrijvingen minimaal 40 dagen, te
      rekenen vanaf de verzenddatum van de uitnodiging.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel38
  - number: '38.5'
    text: |-
      Een aanbestedende dienst kan in de gevallen waarin hij een vooraankondiging als bedoeld in
      [artikel 35, eerste lid][ref1], heeft meegedeeld, de termijn voor de ontvangst van de inschrijvingen, bedoeld in
      het tweede en vierde lid, inkorten tot 36 dagen, maar in geen geval tot minder dan 22 dagen. Deze termijn loopt
      bij openbare procedures vanaf de verzenddatum van de aankondiging van de overheidsopdracht en bij niet-openbare
      procedures vanaf de verzenddatum van de uitnodiging tot indiening van een inschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel35
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '35'
        paragraaf: '9'
  - number: '38.6'
    text: |-
      De termijn, bedoeld in het vijfde lid, is toegestaan, mits de vooraankondiging alle informatie bevat die in de
      aankondiging van de overheidsopdracht, bedoeld in [bijlage 4, onderdeel A][ref1], wordt verlangd, voor zover
      deze informatie beschikbaar is op het tijdstip dat de aankondiging wordt meegedeeld en mits deze vooraankondiging
      minimaal 52 dagen en maximaal 12 maanden voor de verzenddatum van de aankondiging van de overheidsopdracht ter
      mededeling is verzonden.


      [ref1]: https://wetten.overheid.nl/BWBR0018607
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0018607
  - number: '38.7'
    text: |-
      Een aanbestedende dienst kan wanneer de aankondiging langs elektronische weg overeenkomstig het model in het derde
      punt van bijlage VIII van [richtlijn nr. 2004/18/EG](32004L0018) wordt opgesteld en verzonden, de termijn voor de
      ontvangst van de inschrijvingen bij openbare procedures, genoemd in het tweede en vijfde lid, en de termijn voor
      de ontvangst van de verzoeken bij niet-openbare procedures, procedures van gunning door onderhandelingen en de
      concurrentiegerichte dialoog, genoemd in het derde lid, met zeven dagen verkorten.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel38
  - number: '38.8'
    text: |-
      Een aanbestedende dienst kan de termijnen voor de ontvangst van inschrijvingen, bedoeld in het tweede en vierde
      lid, met vijf dagen verkorten indien hij met elektronische middelen en vanaf de mededeling van de aankondiging
      vrije, rechtstreekse en volledige toegang biedt tot het beschrijvend document en alle aanvullende stukken, met
      inachtneming van [artikel 36][ref1], en in de aankondiging het internetadres dat toegang biedt tot deze documenten
      vermeldt.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel36
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '36'
        paragraaf: '9'
  - number: '38.9'
    text: |-
      Een aanbestedende dienst kan de verkorting van de termijn voor ontvangst van de inschrijvingen, bedoeld in het
      zevende en achtste lid, optellen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel38
  - number: '38.10'
    text: |-
      Wanneer het beschrijvend document en de aanvullende stukken of nadere inlichtingen tijdig zijn aangevraagd, maar
      om enigerlei reden niet binnen de in de [artikelen 39][ref1] en [40][ref2] gestelde termijnen zijn verstrekt,
      of wanneer de inschrijvingen slechts na een bezichtiging ter plaatse, of na inzage ter plaatse van de bij het
      beschrijvend document behorende stukken kunnen worden gedaan, verlengt de aanbestedende dienst de termijn voor
      de ontvangst van de inschrijvingen zodanig dat alle betrokken ondernemers van alle nodige informatie voor de
      opstelling van de inschrijvingen kennis kunnen nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel40
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '39'
        paragraaf: '10'
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '40'
        paragraaf: '11'
  - number: '38.11'
    text: |-
      Wanneer het om dringende redenen niet haalbaar is de in dit artikel bepaalde minimumtermijnen in acht te nemen,
      kan een aanbestedende dienst bij niet-openbare procedures en de procedures van gunning door onderhandelingen met
      mededeling van een aankondiging van een overheidsopdracht, bedoeld in [artikel 30][ref1], de volgende termijnen
      vaststellen:


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel30
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '30'
        paragraaf: '8'
  - number: 38.11.a
    text: |-
      een termijn voor de ontvangst van de verzoeken tot deelneming van minimaal 15 dagen, te rekenen vanaf de
      verzenddatum van de aankondiging van de overheidsopdracht, of tien dagen indien de aankondiging elektronisch is
      verzonden overeenkomstig het model in het derde punt van bijlage VIII van [richtlijn nr. 2004/18/EG](32004L0018),
      en
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel38
  - number: 38.11.b
    text: |-
      in het geval van niet-openbare procedures, een termijn voor de ontvangst van de inschrijvingen van minimaal tien
      dagen, te rekenen vanaf de verzenddatum van de uitnodiging tot indiening van een inschrijving.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel38
  - number: '39.1'
    text: |-
      Wanneer een aanbestedende dienst bij openbare procedures niet langs elektronische weg vrije, rechtstreekse
      en volledige toegang biedt tot het beschrijvend document en alle aanvullende stukken, zendt de aanbestedende
      dienst het beschrijvend document en de aanvullende stukken binnen zes dagen na ontvangst van de aanvraag aan
      de ondernemers toe, mits deze aanvraag tijdig voor de uiterste datum voor de indiening van de inschrijvingen is
      gedaan.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel39
  - number: '39.2'
    text: |-
      Een aanbestedende dienst verstrekt nadere inlichtingen over het beschrijvend document en de aanvullende stukken
      uiterlijk zes dagen voor de uiterste datum voor de ontvangst van de inschrijvingen, mits deze aanvraag tijdig voor
      de uiterste datum voor de indiening van de inschrijvingen is gedaan.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel39
  - number: '40.1'
    text: |-
      Bij niet-openbare procedures, de concurrentiegerichte dialoog en procedures van gunning door onderhandelingen met
      mededeling van een aankondiging van een overheidsopdracht als bedoeld in [artikel 30][ref1] nodigt de aanbestedende
      dienst de uitgekozen gegadigden gelijktijdig en schriftelijk uit tot inschrijving, tot onderhandelingen of, in de
      concurrentiegerichte dialoog, tot deelneming aan de dialoog.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel30
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '30'
        paragraaf: '8'
  - number: '40.2'
    text: 'De uitnodiging aan de gegadigden bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel40
  - number: 40.2.a
    text: een exemplaar van het beschrijvend document en van alle aanvullende stukken, of
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel40
  - number: 40.2.b
    text: |-
      de vermelding van de toegang tot het beschrijvend document en tot de andere hiervoor vermelde stukken, wanneer deze
      rechtstreeks langs elektronische weg toegankelijk zijn.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel40
  - number: '40.3'
    text: |-
      Wanneer het beschrijvend document of de aanvullende stukken niet bij de aanbestedende dienst die voor de
      gunningsprocedure verantwoordelijk is kunnen worden aangevraagd, vermeldt de aanbestedende dienst in de uitnodiging
      het adres van de instantie waar deze stukken wel kunnen worden aangevraagd, de uiterste datum voor deze aanvraag,
      het bedrag dat verschuldigd is en de wijze van betaling om de stukken te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel40
  - number: '40.4'
    text: |-
      Een aanbestedende dienst zendt de documentatie, bedoeld in het derde lid, onmiddellijk na ontvangst van de aanvraag
      aan de ondernemers toe.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel40
  - number: '40.5'
    text: |-
      Een aanbestedende dienst verstrekt nadere inlichtingen over het beschrijvend document of de aanvullende
      stukken uiterlijk zes dagen voor de uiterste datum voor de ontvangst van de inschrijvingen, mits het verzoek om
      inlichtingen tijdig voor de uiterste datum voor de ontvangst van de inschrijving is gedaan.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel40
  - number: '40.6'
    text: |-
      Een aanbestedende dienst verstrekt in het geval van versnelde niet-openbare procedures of van versnelde procedures
      van gunning door onderhandelingen, de nadere inlichtingen, als bedoeld in het vijfde lid, uiterlijk vier dagen
      voor de uiterste datum voor de ontvangst van de inschrijvingen, mits het verzoek om inlichtingen tijdig voor de
      uiterste datum voor de ontvangst van de inschrijving, het verzoek tot deelneming of het verzoek tot onderhandeling
      is gedaan.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel40
  - number: '40.7'
    text: |-
      In de uitnodiging tot inschrijving, tot deelneming aan de dialoog of tot deelneming aan de onderhandelingen neemt
      een aanbestedende dienst ten minste de volgende informatie op:
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel40
  - number: 40.7.a
    text: een verwijzing naar de aankondiging van de overheidsopdracht, die is meegedeeld,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel40
  - number: 40.7.b
    text: |-
      de uiterste datum voor de ontvangst van de inschrijvingen, het adres waar deze kunnen worden ingediend en de taal
      of talen waarin zij dienen te worden gesteld,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel40
  - number: 40.7.c
    text: |-
      bij de concurrentiegerichte dialoog, de aanvangsdatum en het adres van de raadpleging, alsook de daarbij gebruikte
      taal of talen,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel40
  - number: 40.7.d
    text: |-
      opgave van de stukken die eventueel worden bijgevoegd, hetzij ter staving van de door de gegadigde overeenkomstig
      [artikel 44][ref1] verstrekte controleerbare verklaringen, hetzij ter aanvulling van de inlichtingen, bedoeld in
      [artikel 44][ref2], en zulks onder dezelfde voorwaarden als gesteld in de [artikelen 48][ref3] en [49][ref4], en


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0018607#Artikel48
      [ref4]: https://wetten.overheid.nl/BWBR0018607#Artikel49
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '44'
        paragraaf: '12'
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '44'
        paragraaf: '12'
      - id: ref3
        bwb_id: BWBR0018607
        artikel: '48'
        paragraaf: '12'
      - id: ref4
        bwb_id: BWBR0018607
        artikel: '49'
        paragraaf: '12'
  - number: 40.7.e
    text: |-
      het relatieve gewicht van de gunningscriteria van de overheidsopdracht of, de afnemende volgorde van belangrijkheid
      van de criteria, indien deze niet in de aankondiging van de overheidsopdracht of het beschrijvend document is
      vermeld.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel40
  - number: '40.8'
    text: |-
      Bij een overheidsopdracht waarvoor [artikel 29][ref1] geldt neemt een aanbestedende dienst de gegevens, genoemd in
      het zevende lid, onderdeel b, niet op in de uitnodiging tot deelneming aan de dialoog, maar in de uitnodiging tot
      indiening van een inschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel29
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '29'
        paragraaf: '8'
  - number: '41.1'
    text: |-
      Een aanbestedende dienst stelt de gegadigden en inschrijvers zo spoedig mogelijk en desgevraagd schriftelijk
      in kennis van de beslissingen die zijn genomen inzake de sluiting van een raamovereenkomst, de gunning van een
      overheidsopdracht of de toelating tot een dynamisch aankoopsysteem, met inbegrip van de redenen waarom hij heeft
      besloten geen raamovereenkomst te sluiten, een overheidsopdracht waarvoor een aankondiging was gepubliceerd niet te
      gunnen en de procedure opnieuw te beginnen of geen dynamisch aankoopsysteem in te stellen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel41
  - number: '41.2'
    text: |-
      Op verzoek van een betrokken partij stelt een aanbestedende dienst iedere afgewezen gegadigde zo spoedig mogelijk,
      uiterlijk binnen 15 dagen na ontvangst van zijn schriftelijk verzoek, in kennis van de redenen voor de afwijzing.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel41
  - number: '41.3'
    text: |-
      Op verzoek van een betrokken partij stelt de aanbestedende dienst iedere afgewezen inschrijver zo spoedig mogelijk,
      uiterlijk binnen 15 dagen na ontvangst van zijn schriftelijk verzoek, in kennis van de redenen voor de afwijzing,
      inclusief voor de gevallen, bedoeld in [artikel 23, vijfde en zesde lid][ref1], de redenen voor zijn beslissing
      dat er geen gelijkwaardigheid voorhanden is of dat de werken, leveringen of diensten niet aan de functionele en
      prestatie-eisen voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel23
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '23'
        paragraaf: '7'
  - number: '41.4'
    text: |-
      Op verzoek van een betrokken partij stelt de aanbestedende dienst iedere inschrijver die een aan de eisen
      beantwoordende inschrijving heeft gedaan, zo spoedig mogelijk, uiterlijk binnen 15 dagen na ontvangst van zijn
      schriftelijk verzoek, in kennis van de kenmerken en voordelen van de uitgekozen inschrijving, en van de naam van de
      begunstigde of de partijen bij de raamovereenkomst.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel41
  - number: '41.5'
    text: |-
      Een aanbestedende dienst deelt bepaalde gegevens betreffende de gunning van de overheidsopdrachten, de sluiting
      van raamovereenkomsten of de toelating tot een dynamisch aankoopsysteem als bedoeld in het eerste lid, niet mee
      indien openbaarmaking van die gegevens de toepassing van de wet in de weg zou staan, met het openbaar belang in
      strijd zou zijn, de rechtmatige commerciële belangen van ondernemers zou kunnen schaden, of afbreuk aan de eerlijke
      mededinging tussen hen zou kunnen doen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel41
  - number: '42.1'
    text: |-
      Een aanbestedende dienst deelt de inschrijvers en gegadigden mede of de mededelingen en uitwisselingen van
      informatie als bedoeld in de [artikelen 38 tot en met 41][ref1] gedaan worden door middel van de post of de fax,
      langs elektronische weg overeenkomstig het vijfde en zesde lid, per telefoon, of door middel van een combinatie van
      deze middelen.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel38
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '38'
        paragraaf: '10'
  - number: '42.2'
    text: |-
      Een aanbestedende dienst maakt gebruik van communicatiemiddelen die algemeen beschikbaar zijn en waardoor de
      toegang van de ondernemers tot de gunningsprocedure niet wordt beperkt.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel42
  - number: '42.3'
    text: |-
      Een aanbestedende dienst waarborgt bij de mededelingen, uitwisselingen en opslag van informatie de integriteit van
      de gegevens en de vertrouwelijkheid van de inschrijvingen en van de aanvragen tot deelneming.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel42
  - number: '42.4'
    text: |-
      Een aanbestedende dienst neemt pas na het verstrijken van de uiterste termijn voor de indiening kennis van de
      inhoud van de inschrijvingen en van de aanvragen tot deelneming.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel42
  - number: '42.5'
    text: |-
      Een aanbestedende dienst gebruikt voor mededelingen langs elektronische weg middelen, waarvan de technische
      kenmerken niet-discriminerend zijn en algemeen beschikbaar en welke in combinatie met algemeen gebruikte
      informatie- en communicatietechnologieproducten kunnen functioneren.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel42
  - number: '42.6'
    text: |-
      Op de toezending en de middelen voor de elektronische ontvangst van inschrijvingen, en op de middelen voor de
      elektronische ontvangst van verzoeken tot deelneming zijn het zevende tot en met het tiende lid van toepassing.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel42
  - number: '42.7'
    text: |-
      Een aanbestedende dienst waarborgt dat de informatie betreffende de specificaties die nodig zijn voor de
      elektronische indiening van inschrijvingen en verzoeken tot deelneming, inclusief de encryptie, voor belanghebbende
      partijen beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel42
  - number: '42.8'
    text: |-
      Een aanbestedende dienst kan met inachtneming van [artikel 15a van Boek 3 van het Burgerlijk Wetboek][ref1] eisen
      dat bij elektronische inschrijvingen gebruik wordt gemaakt van een geavanceerde elektronische handtekening.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15a
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 15a
  - number: '42.9'
    text: |-
      Een inschrijver of gegadigde dient de documenten, certificaten en verklaringen, bedoeld in de
      [artikelen 45 tot en met 51][ref1] en [artikel 53][ref2], indien deze niet in elektronische vorm beschikbaar zijn,
      in vóór het verstrijken van de uiterste termijn voor de indiening van inschrijvingen of aanvragen tot deelneming.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel53
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '45'
        paragraaf: '12'
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '53'
        paragraaf: '12'
  - number: '42.10'
    text: |-
      Een aanbestedende dienst voorziet er in dat de middelen voor de elektronische ontvangst van inschrijvingen en
      verzoeken tot deelneming door passende technische voorzieningen ten minste de waarborg bieden dat:
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel42
  - number: 42.10.a
    text: |-
      met betrekking tot het gebruik van elektronische handtekeningen bij inschrijvingen en verzoeken tot deelneming
      voldaan wordt aan [artikel 15a van Boek 3 van het Burgerlijk Wetboek][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15a
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 15a
  - number: 42.10.b
    text: het tijdstip en de datum van ontvangst van inschrijvingen en verzoeken tot deelneming kunnen worden vastgesteld,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel42
  - number: 42.10.c
    text: |-
      redelijkerwijs kan worden verzekerd dat niemand vóór de opgegeven uiterste datum toegang kan hebben tot de op grond
      van onderhavige eisen verstrekte informatie,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel42
  - number: 42.10.d
    text: |-
      bij een inbreuk op dit toegangsverbod redelijkerwijs kan worden verzekerd dat de inbreuk zonder problemen kan
      worden opgespoord,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel42
  - number: 42.10.e
    text: |-
      alleen de gemachtigde personen de data voor openbaarmaking van de ontvangen informatie kunnen vaststellen of
      wijzigen,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel42
  - number: 42.10.f
    text: |-
      tijdens de verschillende fasen van de gunningsprocedure of van de prijsvraag alleen een gelijktijdig optreden van
      de gemachtigde personen toegang kan geven tot het geheel of een gedeelte van de verstrekte informatie,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel42
  - number: 42.10.g
    text: |-
      het gelijktijdig optreden van de gemachtigde personen slechts na de opgegeven datum toegang tot de verstrekte
      informatie kan geven, en
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel42
  - number: 42.10.h
    text: de ontvangen en openbaar gemaakte informatie enkel toegankelijk blijft voor de tot inzage gemachtigde personen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel42
  - number: '42.11'
    text: |-
      Een aanbestedende dienst kan vrijwillige accreditatieregelingen instellen of handhaven om te komen tot een hoger
      niveau van de certificeringsdienst van de middelen, bedoeld in het tiende lid.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel42
  - number: '42.12'
    text: Op de verzending van aanvragen tot deelneming zijn het dertiende tot en met het vijftiende lid van toepassing.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel42
  - number: '42.13'
    text: |-
      Een aanbestedende dienst waarborgt dat verzoeken tot deelneming aan een procedure voor de gunning van een
      overheidsopdracht schriftelijk of telefonisch gedaan kunnen worden.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel42
  - number: '42.14'
    text: |-
      Wanneer aanvragen tot deelneming telefonisch worden gedaan, zendt de aanbestedende dienst vóór het verstrijken van
      de ontvangsttermijn een schriftelijke bevestiging.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel42
  - number: '43.1'
    text: |-
      Een aanbestedende dienst stelt over een overheidsopdracht, een raamovereenkomst en een instelling van een dynamisch
      aankoopsysteem een proces-verbaal op, dat ten minste de volgende gegevens bevat:
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel43
  - number: 43.1.a
    text: |-
      de naam en het adres van de aanbestedende dienst, het voorwerp en de waarde van de overheidsopdracht, de
      raamovereenkomst of het dynamisch aankoopsysteem,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel43
  - number: 43.1.b
    text: de namen van de uitgekozen gegadigden of inschrijvers met motivering van die keuze,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel43
  - number: 43.1.c
    text: de namen van de uitgesloten gegadigden of inschrijvers met motivering van die uitsluiting,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel43
  - number: 43.1.d
    text: de redenen voor de afwijzing van abnormaal laag bevonden inschrijvingen,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel43
  - number: 43.1.e
    text: |-
      de naam van de begunstigde en de motivering voor de keuze van zijn inschrijving, en, indien bekend, het gedeelte
      van de overheidsopdracht of de raamovereenkomst dat de begunstigde voornemens is aan derden in onderaanneming te
      geven,
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel43
  - number: 43.1.f
    text: |-
      voor procedures van gunning door onderhandelingen de omstandigheden, bedoeld in de [artikelen 30][ref1] en
      [31][ref2], die de toepassing van deze procedures rechtvaardigen,


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel31
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '30'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '31'
        paragraaf: '8'
  - number: 43.1.g
    text: |-
      met betrekking tot de concurrentiegerichte dialoog, de omstandigheden, bedoeld in [artikel 29][ref1], die de
      toepassing van deze procedure rechtvaardigen, en


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel29
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '29'
        paragraaf: '8'
  - number: 43.1.h
    text: |-
      de redenen waarom de aanbestedende dienst besloten heeft een overheidsopdracht niet te gunnen of een
      raamovereenkomst niet te sluiten, of geen dynamisch aankoopsysteem in te stellen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel43
  - number: '43.2'
    text: Een aanbestedende dienst documenteert het verloop van de langs elektronische weg gevoerde gunningsprocedures.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel43
  - number: '43.3'
    text: |-
      Een aanbestedende dienst deelt het proces-verbaal, of de hoofdpunten ervan, bedoeld in het eerste lid, aan de
      Commissie op haar verzoek mee.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel43
  - number: '44.1'
    text: |-
      Een aanbestedende dienst gunt overheidsopdrachten op basis van de in de [artikelen 54][ref1] en [57][ref2] bepaalde
      criteria, nadat hij de geschiktheid van de niet ingevolge de [artikelen 45][ref3] en [47][ref4] uitgesloten
      ondernemers heeft gecontroleerd op grond van de criteria van economische en financiële draagkracht, technische
      bekwaamheid of beroepsbekwaamheid, genoemd in de [artikelen 48 tot en met 53][ref5], en de niet-discriminerende
      criteria, bedoeld in het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel57
      [ref3]: https://wetten.overheid.nl/BWBR0018607#Artikel45
      [ref4]: https://wetten.overheid.nl/BWBR0018607#Artikel47
      [ref5]: https://wetten.overheid.nl/BWBR0018607#Artikel48
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '54'
        paragraaf: '12'
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '57'
        paragraaf: '13'
      - id: ref3
        bwb_id: BWBR0018607
        artikel: '45'
        paragraaf: '12'
      - id: ref4
        bwb_id: BWBR0018607
        artikel: '47'
        paragraaf: '12'
      - id: ref5
        bwb_id: BWBR0018607
        artikel: '48'
        paragraaf: '12'
  - number: '44.2'
    text: |-
      Een aanbestedende dienst kan minimumeisen inzake draagkracht en bekwaamheden als bedoeld in de [artikelen 48][ref1]
      en [49][ref2] stellen waaraan de gegadigden en de inschrijvers dienen te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel49
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '48'
        paragraaf: '12'
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '49'
        paragraaf: '12'
  - number: '44.3'
    text: |-
      Wanneer een aanbestedende dienst inlichtingen vraagt of minimumeisen stelt inzake draagkracht en bekwaamheden,
      bedoeld in de [artikelen 48][ref1] en [49][ref2], houden deze verband met en staan ze in verhouding tot het
      voorwerp van de overheidsopdracht. De aanbestedende dienst vermeldt deze minimumeisen in de aankondiging van de
      overheidsopdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel49
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '48'
        paragraaf: '12'
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '49'
        paragraaf: '12'
  - number: '44.4'
    text: |-
      Bij een niet-openbare procedure, een procedure van gunning door onderhandelingen als bedoeld in [artikel 30][ref1]
      en een concurrentiegerichte dialoog kan een aanbestedende dienst het aantal geschikte gegadigden dat hij
      zal uitnodigen tot indiening van een inschrijving, onderhandelingen of dialoog, beperken op voorwaarde dat
      er een voldoende aantal geschikte kandidaten is. De aanbestedende dienst vermeldt in de aankondiging van de
      overheidsopdracht de objectieve en niet-discriminerende criteria of voorschriften die hij voornemens is te
      gebruiken, het minimumaantal en het maximumaantal gegadigden dat hij voornemens is uit te nodigen.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel30
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '30'
        paragraaf: '8'
  - number: '44.5'
    text: |-
      Bij niet-openbare procedures zijn er ten minste vijf gegadigden. Bij de concurrentiegerichte dialoog en bij
      procedures van gunning door onderhandelingen met mededeling van een aankondiging van een overheidsopdracht zijn
      er ten minste drie gegadigden. Het aantal uitgenodigde gegadigden volstaat in ieder geval om daadwerkelijke
      mededinging te waarborgen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel44
  - number: '44.6'
    text: |-
      Een aanbestedende dienst nodigt een aantal gegadigden uit dat ten minste gelijk is aan het minimumaantal
      gegadigden.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel44
  - number: '44.7'
    text: |-
      Wanneer het aantal gegadigden dat aan de selectiecriteria en de minimumeisen inzake draagkracht en bekwaamheid
      voldoet lager is dan het minimumaantal, kan de aanbestedende dienst de procedure voortzetten door de gegadigde
      of de gegadigden uit te nodigen die aan de minimumeisen voldoen. Een aanbestedende dienst neemt in dit geval geen
      ondernemers in aanmerking die niet om deelneming hebben verzocht, noch neemt hij gegadigden in aanmerking die niet
      aan de minimumeisen voldoen.
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel44
  - number: '44.8'
    text: |-
      Wanneer een aanbestedende dienst gebruik maakt van de mogelijkheid tot vermindering van het aantal oplossingen dat
      besproken dient te worden, bedoeld in [artikel 29, zevende lid][ref1], of het aantal inschrijvingen waarover dient
      te worden onderhandeld, bedoeld in [artikel 30, vijfde lid][ref2], vermindert hij dat aantal door toepassing van de
      gunningscriteria die in de aankondiging van de overheidsopdracht of in het beschrijvend document zijn vermeld. De
      aanbestedende dienst waarborgt dat, voor zover er een voldoende aantal geschikte oplossingen of gegadigden is, het
      aantal inschrijvingen in de slotfase zodanig is dat daadwerkelijke mededinging kan worden gegarandeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel30
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '29'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '30'
        paragraaf: '8'
  - number: '45.1'
    text: |-
      Een aanbestedende dienst sluit iedere gegadigde of inschrijver jegens wie bij een onherroepelijk vonnis
      of arrest een veroordeling is uitgesproken op grond van [artikel 140][ref1], [177][ref2], [177a][ref3],
      [178][ref4], [225][ref5], [226][ref6], [227][ref7],[ 227a][ref8], [227b][ref9] of[ 323a][ref10],
      [328ter, tweede lid][ref11], [416][ref12], [417][ref13], [417bis][ref14], [420bis][ref15], [420ter][ref16] of
      [420quater van het Wetboek van Strafrecht][ref17] van deelneming aan een overheidsopdracht uit.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel140
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel177
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel177a
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel420
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel225
      [ref6]: https://wetten.overheid.nl/BWBR0001854#Artikel226
      [ref7]: https://wetten.overheid.nl/BWBR0001854#Artikel227
      [ref8]: https://wetten.overheid.nl/BWBR0001854#Artikel227a
      [ref9]: https://wetten.overheid.nl/BWBR0001854#Artikel227b
      [ref10]: https://wetten.overheid.nl/BWBR0001854#Artikel323a
      [ref11]: https://wetten.overheid.nl/BWBR0001854#Artikel328ter
      [ref12]: https://wetten.overheid.nl/BWBR0001854#Artikel416
      [ref13]: https://wetten.overheid.nl/BWBR0001854#Artikel417
      [ref14]: https://wetten.overheid.nl/BWBR0001854#Artikel417bis
      [ref15]: https://wetten.overheid.nl/BWBR0001854#Artikel420bis
      [ref16]: https://wetten.overheid.nl/BWBR0001854#Artikel420ter
      [ref17]: https://wetten.overheid.nl/BWBR0001854#Artikel420quater
    url: https://wetten.overheid.nl/BWBR0018607/2013-02-16#Artikel45
