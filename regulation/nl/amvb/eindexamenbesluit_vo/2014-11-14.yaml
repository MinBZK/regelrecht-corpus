      [artikel 2, tweede lid, onderdeel c, en lid 2a, van de Wet College voor examens][ref1] is vastgesteld voor het
      eindexamen van een leerweg in het vmbo, de rekentoets heeft afgelegd zoals deze is vastgesteld voor het eindexamen
      havo of vwo, vrijgesteld van de rekentoets.


