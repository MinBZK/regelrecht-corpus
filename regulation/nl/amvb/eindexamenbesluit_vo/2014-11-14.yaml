      in het vrije deel twee nog niet in het sectordeel gekozen vakken, bedoeld onderscheidenlijk genoemd in
      [artikel 10, zevende lid, onderdelen a en b, van de wet][ref1], met dien verstande dat het sectordeel en het vrije
      deel tezamen ten minste twee vakken omvatten die geen moderne taal zijn, en


