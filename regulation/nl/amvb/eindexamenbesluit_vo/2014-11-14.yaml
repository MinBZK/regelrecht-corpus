  - number: '1.2'
    text: |-
      Waar in dit besluit wordt gesproken van «directeur en de secretaris», wordt daaronder wat instellingen voor
      educatie en beroepsonderwijs betreft verstaan, de examencommissie vavo, tenzij anders blijkt.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel1
  - number: '2.1'
    text: |-
      Het bevoegd gezag stelt de leerlingen van een school en de leerlingen van een afdeling voor havo in de gelegenheid
      ter afsluiting van de opleiding een eindexamen af te leggen.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel2
  - number: '2.2'
    text: |-
      Het bevoegd gezag stelt de leerlingen van een instelling voor educatie en beroepsonderwijs in de gelegenheid in
      plaats van een eindexamen een of meer deeleindexamens af te leggen.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel2
  - number: '2.3'
    text: Het bevoegd gezag kan tot het eindexamen toelaten kandidaten die niet als leerling van de school zijn ingeschreven.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel2
  - number: '2.4'
    text: |-
      Het bevoegd gezag van een instelling voor educatie en beroepsonderwijs kan kandidaten als bedoeld in het derde lid
      eveneens in de gelegenheid stellen een of meer deeleindexamens aan de desbetreffende school af te leggen.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel2
  - number: '2.5'
    text: |-
      Kandidaten als bedoeld in het derde lid, die worden toegelaten tot het eindexamen van een school voor voortgezet
      onderwijs, zijn behoudens het bepaalde in het zesde lid aan het bevoegd gezag een bedrag verschuldigd van € 567
      voor een volledig eindexamen.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel2
  - number: '2.6'
    text: |-
      In afwijking van het bepaalde in het vijfde lid is een toelatingsbedrag niet verschuldigd door kandidaten die
      zijn ingeschreven bij een andere uit de openbare kas bekostigde school, - al dan niet in de zin van dit besluit -,
      afdeling of onderwijsinstelling en die aldaar geen eindexamen dan wel deeleindexamen afleggen.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel2
  - number: '2.7'
    text: |-
      Het in het vijfde lid bedoelde bedrag kan bij regeling van Onze Minister worden gewijzigd voor zover de
      consumentenprijsindex daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel2
  - number: '3.1'
    text: |-
      De directeur en de examinatoren van een school voor voortgezet onderwijs nemen onder verantwoordelijkheid van het
      bevoegd gezag het eindexamen af.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel3
  - number: '3.2'
    text: |-
      De directeur van een school voor voortgezet onderwijs wijst een van de personeelsleden van de school aan tot
      secretaris van het eindexamen.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel3
  - number: '4.1'
    text: Het eindexamen kan voor ieder vak bestaan uit een schoolexamen, uit een centraal examen dan wel uit beide.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel4
  - number: '4.2'
    text: Het schoolexamen vwo, havo en vmbo kan mede een maatschappelijke stage omvatten.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel4
  - number: '4.3'
    text: |-
      Het schoolexamen vwo en havo omvat mede een profielwerkstuk. Het profielwerkstuk is een werkstuk, een presentatie
      daaronder begrepen, waarin op geïntegreerde wijze kennis, inzicht en vaardigheden aan de orde komen die van
      betekenis zijn in het desbetreffende profiel.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel4
  - number: '4.4'
    text: |-
      Het profielwerkstuk heeft betrekking op één of meer vakken van het eindexamen. Ten minste één van deze vakken heeft
      een omvang van 400 uur of meer voor vwo en 320 uur of meer voor havo.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel4
  - number: '4.5'
    text: |-
      Het schoolexamen vmbo voor zover het betreft de theoretische leerweg, genoemd in [artikel 10 van de wet][ref1],
      en de gemengde leerweg, genoemd in [artikel 10d van de wet][ref2], omvat mede een sectorwerkstuk. De tweede volzin
      van het derde lid is van overeenkomstige toepassing. Het sectorwerkstuk heeft betrekking op een thema uit de sector
      waarin de leerling het onderwijs volgt.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10d
  - number: '5.1'
    text: |-
      Indien een kandidaat zich ten aanzien van enig deel van het eindexamen dan wel ten aanzien van een aanspraak op
      ontheffing aan enige onregelmatigheid schuldig maakt of heeft gemaakt, dan wel zonder geldige reden afwezig is, kan
      de directeur maatregelen nemen.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel5
  - number: '5.2'
    text: |-
      De maatregelen, bedoeld in het eerste lid, die afhankelijk van de aard van de onregelmatigheid ook in combinatie
      met elkaar genomen kunnen worden, zijn:
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel5
  - number: 5.2.a
    text: het toekennen van het cijfer 1 voor een toets van het schoolexamen, de rekentoets of het centraal examen,
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel5
  - number: 5.2.b
    text: |-
      het ontzeggen van de deelname of de verdere deelname aan een of meer toetsen van het schoolexamen, de rekentoets of
      het centraal examen,
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel5
  - number: 5.2.c
    text: |-
      het ongeldig verklaren van een of meer toetsen van het reeds afgelegde deel van het schoolexamen, de rekentoets of
      het centraal examen,
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel5
  - number: 5.2.d
    text: |-
      het bepalen dat het diploma en de cijferlijst slechts kunnen worden uitgereikt na een hernieuwd examen in door de
      directeur aan te wijzen onderdelen.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel5
  - number: '5.3'
    text: |-
      Het besluit waarbij een in het eerste lid bedoelde maatregel wordt genomen, wordt tegelijkertijd in afschrift
      toegezonden aan de inspectie en, indien de kandidaat minderjarig is, aan de wettelijke vertegenwoordigers van de
      kandidaat.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel5
  - number: '5.4'
    text: |-
      De kandidaat kan tegen een beslissing van de directeur van een school voor voortgezet onderwijs in beroep gaan
      bij de door het bevoegd gezag van de school in te stellen commissie van beroep. Van de commissie van beroep mag de
      directeur geen deel uitmaken.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel5
  - number: '5.5'
    text: |-
      In overeenstemming met [artikel 30a van de wet][ref1] wordt het beroep binnen vijf dagen nadat de beslissing
      aan de kandidaat is bekendgemaakt, schriftelijk ingesteld bij de commissie van beroep. De commissie stelt een
      onderzoek in en beslist binnen twee weken na ontvangst van het beroepsschrift, tenzij zij deze termijn gemotiveerd
      heeft verlengd met ten hoogste twee weken. De commissie stelt bij haar beslissing zo nodig vast op welke wijze
      de kandidaat alsnog in de gelegenheid zal worden gesteld het eindexamen geheel of gedeeltelijk af te leggen
      onverminderd het bepaalde in de laatste volzin van het tweede lid. De commissie deelt haar beslissing schriftelijk
      mede aan de kandidaat, aan de ouders, voogden of verzorgers van de kandidaat indien deze minderjarig is, aan de
      directeur en aan de inspectie.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel30a
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 30a
  - number: '7.1'
    text: |-
      Onze Minister stelt, behalve voor door het bevoegd gezag vast te stellen vakken die onderdeel zijn van het
      eindexamen, voor elk van de onderwijssoorten examenprogramma’s vast, waarin zijn opgenomen:
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel7
  - number: 7.1.a
    text: een omschrijving van de examenstof voor ieder eindexamenvak, en
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel7
  - number: 7.1.b
    text: |-
      welk deel van de examenstof centraal zal worden geëxamineerd en over welke examenstof het schoolexamen zich
      uitstrekt.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel7
  - number: '7.2'
    text: Een examenprogramma wordt vastgesteld per vak of per groep van vakken.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel7
  - number: '7.3'
    text: |-
      De examenprogramma's voor zover het betreft leerwegen in het vmbo kunnen voorzien in differentiaties waaruit de
      leerling een keuze maakt.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel7
  - number: '8.1'
    text: |-
      De kandidaten kiezen, met inachtneming van dit hoofdstuk, in welke vakken zij examen willen afleggen. Voor
      leerlingen geldt deze keuze voorzover het bevoegd gezag, al dan niet in samenwerking met het bevoegd gezag van
      een of meer andere scholen, hen in de gelegenheid heeft gesteld zich op het examen in die vakken voor te bereiden.
      Indien sprake is van samenwerking tussen scholen, is [artikel 2 van het Besluit samenwerking VO-BVE][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019143#Artikel2
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019143
        artikel: '2'
  - number: '8.2'
    text: |-
      De kandidaten kunnen, voor zover het bevoegd gezag hun dat toestaat, in meer vakken examen afleggen dan in
      de vakken die ten minste tezamen een eindexamen vormen. Een examen als bedoeld in de eerste volzin heeft geen
      betrekking op vakken die overeenkomen met vakken die onderdeel zijn van dat eindexamen.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel8
  - number: '8.3'
    text: |-
      Het bevoegd gezag beslist, welke in [artikel 7, derde lid][ref1], bedoelde differentiaties worden aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel7
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '7'
        hoofdstuk: II
  - number: '8.4'
    text: Het eerste lid is van overeenkomstige toepassing op kandidaten die deeleindexamen afleggen.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel8
  - number: '9.1'
    text: |-
      Onverminderd vrijstellingen en ontheffingen als bedoeld in de [artikelen 11][ref1], [12][ref2], [13][ref3] en
      [22][ref4] is de kandidaat die het eindexamen aflegt aan een instelling voor educatie en beroepsonderwijs:


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0004593#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0004593#Artikel22
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '11'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '12'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0004593
        artikel: '13'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0004593
        artikel: '22'
        hoofdstuk: II
  - number: 9.1.a
    text: |-
      vrijgesteld van de rekentoets of van het examen in een algemeen vak van de theoretische leerweg in het vmbo op
      grond van het examen vwo, havo of vmbo, indien voor de overeenkomstige rekentoets of het overeenkomstige vak een
      eindcijfer 6 of hoger of een daarmee overeenkomende waardering is behaald in de gemengde leerweg,
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel9
  - number: 9.1.b
    text: |-
      vrijgesteld van de rekentoets of van het examen in een vak in het havo op grond van een examen vwo of havo,
      indien voor de overeenkomstige rekentoets of het overeenkomstige vak een eindcijfer 6 of hoger of een daarmee
      overeenkomende waardering is behaald;
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel9
  - number: 9.1.c
    text: |-
      vrijgesteld van de rekentoets of van het examen in een vak in het vwo op grond van een examen vwo, indien voor
      de overeenkomstige rekentoets of het overeenkomstige vak een eindcijfer 6 of hoger of een daarmee overeenkomende
      waardering is behaald;
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel9
  - number: 9.1.d
    text: |-
      vrijgesteld van het examen in een vak van het vwo of havo op grond van het overeenkomstige examen, afgelegd in
      de Nederlandse Antillen of in Aruba, indien voor het overeenkomstige vak een eindcijfer 6 of hoger of een daarmee
      overeenkomende waardering is behaald;
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel9
  - number: 9.1.e
    text: |-
      vrijgesteld van het profielwerkstuk, indien reeds eerder een profielwerkstuk is gemaakt dat betrekking heeft op een
      of meer vakken van dezelfde schoolsoort, behorende tot het profiel van de kandidaat en waarvoor een eindcijfer 6 of
      hoger is behaald,
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel9
  - number: 9.1.f
    text: |-
      vrijgesteld van het sectorwerkstuk, indien reeds eerder een sectorwerkstuk is gemaakt dat betrekking heeft op een
      thema uit die sector, en dat is beoordeeld als «voldoende» of «goed».
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel9
  - number: '9.2'
    text: |-
      Het eerste lid is uitsluitend van toepassing indien na het jaar waarin het eindcijfer of de beoordeling is
      vastgesteld, nog geen 10 jaren zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel9
  - number: '9.3'
    text: |-
      In aanvulling op het eerste lid, onder a tot en met d, is de daar bedoelde kandidaat eveneens vrijgesteld
      indien het eindcijfer 5 of 4 is behaald, mits de kandidaat voldoet aan de voorwaarden van [artikel 49][ref1] of
      [artikel 50][ref2] om te slagen voor het eindexamen.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel50
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '49'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '50'
        hoofdstuk: V
  - number: '9.4'
    text: Bij ministeriële regeling kunnen nadere voorschriften worden gegeven voor de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel9
  - number: '9.5'
    text: |-
      Bij de toepassing van dit artikel wordt ten hoogste één cijferlijst, die is uitgereikt aan een school voor
      voortgezet onderwijs, betrokken.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel9
  - number: '10.1'
    text: |-
      Onverminderd [artikel 9][ref1] kan het College voor examens op verzoek van de kandidaat die het eindexamen aflegt
      aan een instelling voor educatie en beroepsonderwijs, ontheffing verlenen voor een examenvak of de rekentoets,
      indien de kandidaat op grond van eerder gevolgd onderwijs aantoonbaar in het bezit is van voldoende kennis en
      vaardigheden ter zake van het desbetreffende vak respectievelijk de rekentoets. De ontheffing kan slechts worden
      verleend op basis van een diploma, getuigschrift, certificaat of ander bewijsstuk, al of niet behaald in Nederland,
      dat door het College voor examens wordt aanvaard als bewijs van voldoende kennis en vaardigheden. Indien het
      College voor examens dit nodig oordeelt, onderzoekt het college of de kandidaat in het bezit is van voldoende
      kennis en vaardigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel9
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '9'
        hoofdstuk: II
  - number: '10.2'
    text: |-
      Het eerste lid is uitsluitend van toepassing indien na het jaar waarin het in dat lid bedoelde diploma,
      getuigschrift, certificaat of ander bewijsstuk is vastgesteld, nog geen 10 jaren zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel10
  - number: '10.3'
    text: |-
      Tot de in het eerste lid bedoelde diploma's, getuigschriften, certificaten en andere bewijsstukken behoren in
      elk geval die betreffende het Internationaal Baccalaureaat, het Europees Baccalaureaat en die betreffende het
      overeenkomstige onderwijs in een lidstaat van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel10
  - number: '10.4'
    text: |-
      Indien het College voor examens de gevraagde ontheffing verleent, verstrekt het college de verzoeker een bewijs van
      ontheffing, en zendt het college Onze Minister een afschrift daarvan.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel10
  - number: '10.5'
    text: |-
      Het bewijs van ontheffing vermeldt de gronden van de ontheffing, het tijdstip van het verrichten van de onderwijs-
      of examenprestatie waarop de ontheffing berust, en gaat in voorkomend geval vergezeld van een verklaring
      betreffende het in het eerste lid bedoelde onderzoek naar de kennis en vaardigheden van de examenkandidaat, of naar
      de in het eerste lid bedoelde bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel10
  - number: '10.6'
    text: Onze Minister stelt het model van het bewijs van ontheffing vast.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel10
  - number: 10a
    text: |-
      Een verzoek om ontheffing als bedoeld in [artikel 10][ref1] wordt schriftelijk ingediend bij het College voor
      examens, onder overlegging van een uittreksel uit het geboorte- of persoonsregister en een gewaarmerkte fotokopie
      van het diploma, getuigschrift, certificaat of andere bewijsstuk waarop het verzoek om ontheffing berust.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel10
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '10'
        hoofdstuk: II
  - number: '11.1'
    text: 'Het eindexamen vwo (atheneum) omvat:'
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel11
  - number: 11.1.a
    text: |-
      de vakken van het gemeenschappelijk deel van elk profiel, genoemd in
      [artikel 26b, eerste lid, van het Inrichtingsbesluit WVO][ref1], daaronder tevens begrepen een profielwerkstuk,


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel26b
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: 26b
  - number: 11.1.b
    text: |-
      de vakken van het profieldeel van één van de profielen, genoemd in
      [artikel 26b, derde tot en met zesde lid, van het Inrichtingsbesluit WVO][ref1] en voor zover nodig wegens de in
      onderdeel c genoemde normatieve studielast, vakken van het vrije deel genoemd in artikel 26b, zevende lid, van het
      Inrichtingsbesluit WVO,


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel26b
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: 26b
  - number: 11.1.c
    text: |-
      tenminste één vak met een normatieve studielast van tenminste 440 uren van het vrije deel van elk profiel, genoemd
      in [artikel 26b, zevende lid, van het Inrichtingsbesluit WVO][ref1] zoals geldend voor de scholen voor vwo, met
      dien verstande dat door het bevoegd gezag vast te stellen vakken onderdeel zijn van het eindexamen uitsluitend voor
      zover Onze Minister daarvoor goedkeuring heeft verleend, en


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel26b
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: 26b
  - number: 11.1.d
    text: de rekentoets.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel11
  - number: '11.2'
    text: |-
      In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een school voor vwo, bij het
      eindexamen vrijgesteld van de vakken waarvoor vrijstelling of ontheffing is verleend van het volgen van onderwijs
      op grond van [artikel 26e, eerste tot en met vierde lid, van het Inrichtingsbesluit WVO][ref1]. Bij een ontheffing
      op grond van [artikel 26e, vierde lid, van het Inrichtingsbesluit WVO][ref2] wordt de taal vervangen door een ander
      vak als bedoeld in het vijfde lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel26e
      [ref2]: https://wetten.overheid.nl/BWBR0005946#Artikel26e
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: 26e
      - id: ref2
        bwb_id: BWBR0005946
        artikel: 26e
  - number: '11.3'
    text: |-
      In afwijking van het eerste lid is de kandidaat die in het bezit is van het diploma havo of het
      diploma van een leerweg in het vmbo en die in plaats van de rekentoets zoals deze op grond van
      [artikel 2, tweede lid, onderdeel c, en lid 2a, van de Wet College voor examens][ref1] is vastgesteld voor het
      eindexamen havo of van een leerweg in het vmbo de rekentoets heeft afgelegd zoals deze is vastgesteld voor het
      eindexamen vwo, vrijgesteld van de rekentoets.


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
  - number: '11.4'
    text: |-
      In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een instelling voor educatie en
      beroepsonderwijs, bij het eindexamen vrijgesteld van de vakken culturele en kunstzinnige vorming en lichamelijke
      opvoeding van het gemeenschappelijk deel.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel11
  - number: '11.5'
    text: |-
      In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een instelling voor educatie en
      beroepsonderwijs, en in het bezit is van het diploma havo, bij het eindexamen vrijgesteld van de volgende vakken
      van het gemeenschappelijk deel: algemene natuurwetenschappen en maatschappijleer.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel11
  - number: '11.6'
    text: |-
      In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een instelling voor educatie
      en beroepsonderwijs en in het bezit is van het diploma havo, en die in plaats van de vakken, genoemd in
      [artikel 26c van het Inrichtingsbesluit WVO][ref1] examen heeft afgelegd in een of meer overeenkomstige vakken van
      [artikel 26b van het Inrichtingsbesluit WVO][ref2], bij het eindexamen vrijgesteld van dit vak of deze vakken.


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel26c
      [ref2]: https://wetten.overheid.nl/BWBR0005946#Artikel26b
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: 26c
      - id: ref2
        bwb_id: BWBR0005946
        artikel: 26b
  - number: '11.7'
    text: |-
      In afwijking van het eerste lid kan de kandidaat die het eindexamen aflegt aan een instelling voor
      educatie en beroepsonderwijs bij het eindexamen ontheffing worden verleend van de taal, genoemd in
      [artikel 26b, eerste lid onder c, van het Inrichtingsbesluit WVO][ref1], in de volgende gevallen:


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel26b
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: 26b
  - number: 11.7.a
    text: |-
      de leerling heeft een stoornis die specifiek betrekking heeft op taal of een zintuiglijke stoornis die effect heeft
      op taal,
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel11
  - number: 11.7.b
    text: de leerling heeft een andere moedertaal dan de Nederlandse taal, of
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel11
  - number: 11.7.c
    text: |-
      de leerling volgt onderwijs in het profiel natuur en techniek of het profiel natuur en gezondheid en de taal
      verhindert naar verwachting een succesvolle afronding van de opleiding.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel11
  - number: '11.8'
    text: |-
      Bij ontheffing op grond van het zevende lid wordt de taal vervangen door een van de vakken, genoemd in
      __REF000___________________________________________________________________________________________________________
      _ met een normatieve studielast van tenminste 440 uren, naar keuze van de leerling, voor zover het bevoegd gezag
      deze als zodanig aanbiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel26b
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: 26b
  - number: '12.1'
    text: 'Het eindexamen vwo (gymnasium) omvat:'
