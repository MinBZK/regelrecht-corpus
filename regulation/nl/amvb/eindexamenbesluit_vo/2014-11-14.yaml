    text: |-
      [Artikel 22, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel22
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel25
