        artikel: '14'
  - number: '25.5'
    text: |-
      Het bevoegd gezag kan een kandidaat in de gelegenheid stellen de rekentoets af te leggen zoals deze op grond van
      [artikel 2, tweede lid, onder c, en lid 2a, van de Wet College voor examens][ref1] voor havo of vwo is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
