        artikel: '2'
  - number: '12.4'
    text: |-
      In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een instelling voor educatie en
      beroepsonderwijs, bij het eindexamen vrijgesteld van het vak lichamelijke opvoeding van het gemeenschappelijk deel.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel12
  - number: '12.5'
    text: |-
      In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een instelling voor educatie en
      beroepsonderwijs, en die in het bezit is van het diploma havo, bij het eindexamen vrijgesteld van de volgende
      vakken van het gemeenschappelijk deel: algemene natuurwetenschappen en maatschappijleer.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel12
  - number: '12.6'
    text: |-
      In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een instelling voor educatie
      en beroepsonderwijs en in het bezit is van het diploma havo, en die in plaats van de vakken, genoemd in
      [artikel 26c van het Inrichtingsbesluit WVO][ref1] examen heeft afgelegd in een of meer overeenkomstige vakken van
      [artikel 26b van het Inrichtingsbesluit WVO][ref2], bij het eindexamen vrijgesteld van dit vak of deze vakken.


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel26c
      [ref2]: https://wetten.overheid.nl/BWBR0005946#Artikel26b
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel12
