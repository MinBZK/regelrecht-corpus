      programma dat onderdeel is van het leerwerktraject. Bovendien kan de leerling eindexamen afleggen in de andere
      vakken van de basisberoepsgerichte leerweg, bedoeld in [artikel 10b van de wet][ref2], waarvan het bevoegd gezag
      op grond van [artikel 10b1, derde lid, van de wet][ref3] in voorkomend geval heeft beslist dat zij behoren tot het
      leer-werktraject van de leerling.


