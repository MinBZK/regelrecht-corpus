  - number: '25.6'
    text: |-
      In afwijking van het eerste lid, is een kandidaat die in het bezit is van het diploma
      van een leerweg in het vmbo en die in plaats van de rekentoets zoals deze op grond van
      [artikel 2, tweede lid, onderdeel c, en lid 2a, van de Wet College voor examens][ref1] is vastgesteld voor het
      eindexamen basisberoepsgerichte leerweg of kaderberoepsgerichte leerweg de rekentoets heeft afgelegd zoals deze is
      vastgesteld voor het eindexamen theoretische leerweg, havo of vwo, vrijgesteld van de rekentoets.


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
  - number: '31.1'
    text: |-
      Het bevoegd gezag van een school voor voortgezet onderwijs, respectievelijk de examencommissie vavo, stelt
      een examenreglement vast. Het examenreglement bevat in elk geval informatie over de maatregelen, bedoeld in
      [artikel 5][ref1], en de toepassing daarvan, alsmede regels met betrekking tot de organisatie van het eindexamen
      en de gang van zaken tijdens het eindexamen, de herkansingsmogelijkheden van het schoolexamen, en wat scholen voor
      voortgezet onderwijs betreft, de samenstelling en het adres van de in artikel 5 bedoelde commissie van beroep. Ten
      aanzien van de herkansing wordt in elk geval bepaald, in welke gevallen een herkansing mogelijk is. Ook kan worden
      bepaald dat tot die gevallen kunnen behoren gevallen dat de kandidaat door ziekte of ten gevolge van een bijzondere
      van zijn wil onafhankelijke omstandigheid, niet in staat is geweest, aan de desbetreffende toets deel te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel5
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '5'
        hoofdstuk: I
  - number: '31.2'
    text: |-
      Het bevoegd gezag van een school voor voortgezet onderwijs, respectievelijk de examencommissie vavo, stelt
      jaarlijks voor 1 oktober een programma van toetsing en afsluiting vast, dat in elk geval betrekking heeft op het
      desbetreffende schooljaar. Het programma vermeldt in elk geval:
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel31
  - number: 31.2.a
    text: welke onderdelen van het examenprogramma in het schoolexamen worden getoetst,
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel31
  - number: 31.2.b
    text: de inhoud van de onderdelen van het schoolexamen,
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel31
  - number: 31.2.c
    text: |-
      de wijze waarop en de tijdvakken waarbinnen de toetsen van het schoolexamen plaatsvinden, de herkansing daaronder
      mede begrepen,
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel31
  - number: 31.2.d
    text: de wijze van herkansing van het schoolexamen, alsmede
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel31
  - number: 31.2.e
    text: de regels voor de wijze waarop het cijfer voor het schoolexamen voor een kandidaat tot stand komt.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel31
  - number: '31.3'
    text: |-
      Het examenreglement en het programma van toetsing en afsluiting worden door de directeur voor 1 oktober toegezonden
      aan de inspectie en verstrekt aan de kandidaten.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel31
  - number: '32.1'
    text: Het bevoegd gezag bepaalt het tijdstip waarop het schoolexamen aanvangt.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel32
  - number: '32.2'
    text: |-
      Het schoolexamen wordt afgesloten voor de aanvang van het eerste tijdvak, bedoeld in [artikel 37][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel37
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '37'
        hoofdstuk: IV
  - number: '32.3'
    text: |-
      Het bevoegd gezag kan in afwijking van het tweede lid een kandidaat die ten gevolge van ziekte of een andere van
      zijn wil onafhankelijke omstandigheid het schoolexamen in één of meer vakken niet heeft kunnen afsluiten voor
      de aanvang van het eerste tijdvak, in de gelegenheid stellen het schoolexamen in dat vak of in die vakken af te
      sluiten vóór het centraal examen in dat vak of in die vakken, doch na de aanvang van het eerste tijdvak.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel32
  - number: '32.4'
    text: |-
      Indien het bevoegd gezag gebruikmaakt van de afwijkingsbevoegdheid in het derde lid, zendt het de resultaten die
      zijn behaald met het schoolexamen en het sectorwerkstuk zo spoedig mogelijk aan de inspectie, tenzij het bevoegd
      gezag op grond van [artikel 103b, tweede lid, van de wet][ref1] examengegevens samen met het persoonsgebonden
      nummer verstrekt aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel103b
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 103b
  - number: '33'
    text: 'Voor de aanvang van het centraal examen maakt de directeur aan de kandidaat bekend, voorzover van toepassing:'
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel33
  - number: 33.a
    text: welk cijfer of welke cijfers hij heeft behaald voor het schoolexamen,
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel33
  - number: 33.b
    text: de beoordeling van de vakken waarvoor geen cijfer wordt vastgesteld, en
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel33
  - number: 33.c
    text: de beoordeling van het sectorwerkstuk.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel33
  - number: '35.1'
    text: |-
      Het cijfer van het schoolexamen wordt uitgedrukt in een cijfer uit een schaal van cijfers lopende van 1 tot en
      met 10.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel35
  - number: '35.2'
    text: |-
      Indien in een vak tevens centraal examen wordt afgelegd, worden de in het eerste lid genoemde cijfers gebruikt met
      de daartussen liggende cijfers met 1 decimaal.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel35
  - number: '35.3'
    text: |-
      In afwijking van het eerste lid, worden het vak culturele en kunstzinnige vorming en het vak lichamelijke opvoeding
      uit het gemeenschappelijk deel van elk profiel, beoordeeld met «voldoende» of «goed». Deze beoordeling gaat uit van
      de mogelijkheden van de leerling en geschiedt op de grondslag van het genoegzaam afsluiten van de desbetreffende
      vakken, zoals blijkend uit het examendossier. De eerste en tweede volzin zijn van overeenkomstige toepassing op de
      kunstvakken en het vak lichamelijke opvoeding uit het gemeenschappelijk deel van elke leerweg.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel35
  - number: '35.4'
    text: |-
      In afwijking van het eerste lid wordt het sectorwerkstuk beoordeeld met «voldoende» of «goed». Deze beoordeling
      geschiedt op de grondslag van het genoegzaam voltooien van het sectorwerkstuk, zoals blijkend uit het
      examendossier. Het sectorwerkstuk wordt beoordeeld door ten minste twee examinatoren.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel35
  - number: 35b1.1
    text: |-
      Het bevoegd gezag kan bepalen dat de kandidaat die eindexamen of deeleindexamen aflegt, voor één of meer vakken het
      schoolexamen waarin geen centraal examen wordt afgenomen, opnieuw kan afleggen, met dien verstande dat het bevoegd
      gezag dit recht in elk geval verleent voor het vak maatschappijleer behorend tot het gemeenschappelijk deel van de
      leerwegen, indien de kandidaat voor dat vak een eindcijfer heeft behaald lager dan 6. Het herexamen omvat door het
      bevoegd gezag aangegeven onderdelen van het examenprogramma.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel35b1
  - number: 35b1.2
    text: |-
      Het bevoegd gezag stelt vast hoe het cijfer van het in het eerste lid bedoelde herexamen wordt bepaald. Het hoogste
      van de cijfers behaald bij het herexamen in een vak en bij het eerder afgelegde schoolexamen in dat vak geldt als
      het definitieve cijfer van het schoolexamen in dat vak.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel35b1
  - number: 35c
    text: |-
      Het schoolexamen bestaat uit een examendossier. Het examendossier is het geheel van de
      onderdelen van het schoolexamen zoals gedocumenteerd in een door het bevoegd gezag gekozen
      vorm. Het examendossier voor het vmbo omvat tevens de resultaten die de leerling heeft behaald
      voor de vakken, bedoeld in [artikel 26g, eerste lid, van het Inrichtingsbesluit WVO][ref1] of
      [artikel 26i, tweede lid, van dat besluit][ref2], voor zover in die vakken geen eindexamen is afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel26g
      [ref2]: https://wetten.overheid.nl/BWBR0005946#Artikel26i
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: 26g
      - id: ref2
        bwb_id: BWBR0005946
        artikel: 26i
  - number: '36.1'
    text: |-
      Onze Minister maakt een koppeling van scholen en instellingen voor educatie en beroepsonderwijs voor de uitvoering
      van de tweede correctie door gecommitteerden. Onze Minister maakt deze koppeling bekend aan het bevoegd gezag van
      elke school en instelling voor educatie en beroepsonderwijs en kan, zo nodig, zelf een gecommitteerde aanwijzen
      voor een school of instelling. Op grond van deze koppeling wijst het bevoegd gezag een of meer gecommitteerden
      aan. Het bevoegd gezag maakt deze aanwijzing bekend aan de scholen waarvoor zij de tweede correctie verrichten. De
      aanwijzing geldt tot na de afloop van de herkansing.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel36
  - number: '36.2'
    text: Het bevoegd gezag draagt er zorg voor dat de aangewezen gecommitteerde zijn verplichtingen nakomt.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel36
  - number: '36.3'
    text: |-
      In afwijking van het eerste lid, worden voor het praktisch gedeelte van het centraal examen vmbo geen
      gecommitteerden aangewezen.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel36
  - number: '36.4'
    text: |-
      De gecommitteerde voegt bij het gecorrigeerde werk een verklaring betreffende de verrichte correctie. Deze
      verklaring wordt mede ondertekend door het bevoegd gezag van de gecommitteerde.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel36
  - number: '37.1'
    text: Het centraal examen voor de scholen voor voortgezet onderwijs kent een eerste, tweede en derde tijdvak.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel37
  - number: '37.2'
    text: Het eerste en tweede tijdvak worden afgenomen in het laatste leerjaar.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel37
  - number: '37.3'
    text: Het derde tijdvak wordt aansluitend aan het laatste leerjaar afgenomen door het College voor examens.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel37
  - number: '37.4'
    text: |-
      Het College voor examens kan vakken aanwijzen waarin wegens het zeer geringe aantal kandidaten, het centraal examen
      in het tweede tijdvak wordt afgenomen door het College voor examens.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel37
  - number: '37.5'
    text: 'Bij toepassing van het derde of vierde lid, gelden de volgende regels:'
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel37
  - number: 37.5.a
    text: de directeur deelt aan Onze Minister mee welke kandidaten het centraal examen zullen afleggen en in welke vakken;
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel37
  - number: 37.5.b
    text: |-
      de kandidaten leveren de opgaven, de door hen gemaakte aantekeningen alsmede andere door hen gemaakte stukken in
      bij een van degenen die toezicht houden. Het College voor examens bepaalt, in welke gevallen wordt afgeweken van
      de eerste volzin alsmede in welke gevallen en op welk tijdstip de opgaven, de aantekeningen en de andere stukken,
      bedoeld in die volzin aan de kandidaten worden teruggegeven;
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel37
  - number: 37.5.c
    text: het College voor examens deelt het door de kandidaat behaalde cijfer voor het centraal examen aan de directeur mee.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel37
  - number: '37.6'
    text: |-
      Het College voor examens kan bepalen dat een toets wordt afgenomen op een tijdstip dat is gelegen voor de aanvang
      van het eerste tijdvak.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel37
  - number: 37a.1
    text: |-
      In afwijking van [artikel 37, tweede lid][ref1], kan het bevoegd gezag een leerling uit het voorlaatste leerjaar
      toelaten tot het centraal examen in één of meer vakken, niet zijnde alle vakken van het eindexamen.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel37
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '37'
        hoofdstuk: IV
  - number: 37a.2
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid, wordt het schoolexamen in dat vak of die vakken afgesloten voor
      aanvang van het eerste tijdvak in dat leerjaar.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel37a
  - number: 37a.3
    text: |-
      [Artikel 49, vierde lid][ref1], en [artikel 50, vijfde lid][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel50
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '49'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '50'
        hoofdstuk: V
  - number: 37a.4
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid, wordt het derde tijdvak aansluitend aan het voorlaatste
      leerjaar afgenomen door het College voor examens.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel37a
  - number: '38.1'
    text: |-
      De directeur deelt jaarlijks voor 1 november aan Onze Minister mede hoeveel kandidaten in elk vak aan het centraal
      examen in het eerste tijdvak zullen deelnemen.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel38
  - number: '38.2'
    text: |-
      De directeur zendt jaarlijks ten minste drie dagen voor de aanvang van de centrale examens in het eerste tijdvak
      aan Onze Minister een lijst waarop voor iedere kandidaat vermeld staat in welke vakken hij centraal examen zal
      afleggen en waarop is aangegeven welke cijfers de kandidaat voor het schoolexamen heeft gehaald. Voor de aanvang
      van het tweede tijdvak zendt de directeur een lijst met de kandidaten, de in het eerste tijdvak door die kandidaten
      behaalde cijfers, de voor zover van toepassing, alsnog behaalde cijfers voor het schoolexamen, alsmede een
      overzicht van het vak of de vakken waarin elke kandidaat centraal examen zal afleggen, aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel38
  - number: '38.3'
    text: |-
      Het tweede lid is niet van toepassing op een bevoegd gezag dat op grond van
      [artikel 103b, tweede lid, van de wet][ref1] examengegevens samen met het persoonsgebonden nummer verstrekt aan
      Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel103b
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 103b
  - number: '38.4'
    text: |-
      Indien een examenprogramma differentiaties kent als bedoeld in [artikel 7, derde lid][ref1], kan een kandidaat per
      tijdvak in niet meer differentiaties centraal examen afleggen dan volgens het desbetreffende programma is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel7
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '7'
        hoofdstuk: II
  - number: '40.1'
    text: |-
      Onze Minister zorgt ervoor dat de opgaven, bedoeld in
      [artikel 2, onderdeel c, van de Wet College voor examens][ref1] tijdig beschikbaar worden gesteld aan de directeur
      van de school.


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
  - number: '40.2'
    text: |-
      De directeur zorgt ervoor, dat de opgaven voor het centraal examen geheim blijven tot de aanvang van de toets
      waarbij deze opgaven aan de kandidaten worden voorgelegd. Het College voor examens kan opgaven aanwijzen waarop de
      eerste volzin niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel40
  - number: '40.3'
    text: |-
      Tijdens een toets van het centraal examen worden aan de kandidaten geen mededelingen van welke aard ook, aangaande
      de opgaven gedaan, uitgezonderd mededelingen van het College voor examens.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel40
  - number: '40.4'
    text: De directeur draagt er zorg voor dat het nodige toezicht bij het centraal examen wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel40
  - number: '40.5'
    text: |-
      Zij die toezicht hebben gehouden, maken een proces-verbaal op. Zij leveren dit in bij de directeur samen met het
      gemaakte examenwerk.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel40
  - number: '40.6'
    text: |-
      Een kandidaat die te laat komt, mag tot uiterlijk een half uur na de aanvang van de toets tot die toets worden
      toegelaten.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel40
  - number: '40.7'
    text: |-
      De aan de kandidaten voorgelegde opgaven voor een toets van het centraal examen blijven in het examenlokaal tot het
      einde van die toets.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel40
  - number: '41.1'
    text: |-
      De directeur doet het gemaakte werk van het centraal examen met een exemplaar van de opgaven, de
      beoordelingsnormen en met het proces-verbaal van het examen toekomen aan de examinator in het desbetreffende
      vak. De examinator beoordeelt het werk zo spoedig mogelijk en past daarbij de beoordelingsnormen, bedoeld
      in [artikel 2, tweede lid, onderdeel d, van de Wet College voor examens][ref1] toe. De examinator drukt zijn
      beoordeling uit in de score, bedoeld in artikel 2, tweede lid, onderdeel d, van de Wet College voor examens. De
      examinator zendt de score en het beoordeelde werk aan de directeur.


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
  - number: '41.2'
    text: |-
      De directeur doet de van de examinator ontvangen stukken met een exemplaar van de opgaven, de beoordelingsnormen,
      het proces-verbaal en de regels voor het bepalen van de score, bepaald in het eerste lid, onverwijld aan de
      directeur van de school, bedoeld in [artikel 36, tweede lid][ref1], toekomen. Deze stelt het ter hand aan de
      gecommitteerde.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel36
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '36'
        hoofdstuk: IV
  - number: '41.3'
    text: |-
      De gecommitteerde beoordeelt het werk zo spoedig mogelijk en past daarbij toe de beoordelingsnormen en de daarbij
      behorende scores, bedoeld in [artikel 2, tweede lid, onderdeel d, van de Wet College voor examens][ref1]. Daarnaast
      voegt de gecommitteerde bij het gecorrigeerde werk, de in [artikel 36, vierde lid][ref2], bedoelde verklaring mede
      ondertekend door het bevoegd gezag van de gecommitteerde.


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel36
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '36'
        hoofdstuk: IV
  - number: '41.4'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven voor de toepassing van het eerste tot en met
      derde lid.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel41
  - number: 41a.1
    text: |-
      De directeur draagt er zorg voor dat bij het maken van het cspe van een eindexamen vmbo, een examinator in het
      desbetreffende vak of programma aanwezig is. De examinator beoordeelt de prestaties tijdens het maken van de
      opgaven en legt zijn bevindingen van de verrichtingen van de kandidaat schriftelijk vast, volgens daartoe door het
      College voor examens gegeven richtlijnen. De examinator beoordeelt het werk zo spoedig mogelijk en past daarbij
      toe de beoordelingsnormen, bedoeld in [artikel 2, tweede lid, onderdeel d, van de Wet College voor examens][ref1].
      De examinator drukt zijn beoordeling uit in de score, bedoeld in artikel 2, tweede lid, onderdeel d, van de Wet
      College voor examens. De examinator zendt de score en voor zover mogelijk het beoordeelde werk aan de directeur.


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
  - number: 41a.2
    text: |-
      Voor het cspe vmbo vindt de beoordeling tevens plaats door een tweede examinator. De tweede examinator kan een
      deskundige als bedoeld in [artikel 29, tweede lid, van de wet][ref1] of een andere examinator van de school zijn.
      De tweede examinator beoordeelt het resultaat van de opgaven, alsmede de verrichtingen van de kandidaat zoals
      blijkend uit de in het eerste lid bedoelde schriftelijke vastlegging daarvan. De directeur overhandigt de tweede
      examinator daartoe een exemplaar van de opgaven, de beoordelingsnormen, het proces-verbaal, alsmede de regels
      voor het bepalen van de score, bedoeld in het eerste lid. [Artikel 41, vierde lid][ref2], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel41
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '41'
        hoofdstuk: IV
  - number: '42.1'
    text: |-
      De examinator en de gecommitteerde stellen in onderling overleg de score voor het centraal examen vast. Indien
      de examinator en de gecommitteerde daarbij niet tot overeenstemming komen, wordt het geschil voorgelegd aan het
      bevoegd gezag van de gecommitteerde. Dit bevoegd gezag kan hierover in overleg treden met het bevoegd gezag van
      de examinator. Indien het geschil niet kan worden beslecht, wordt hiervan melding gemaakt aan de inspectie. De
      inspectie kan een onafhankelijke corrector aanwijzen. De beoordeling van deze corrector komt in de plaats van de
      eerdere beoordelingen.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel42
  - number: '42.2'
    text: |-
      De directeur stelt het cijfer voor het centraal examen in een vak vast op grond van
      de score, bedoeld in het eerste lid, en met inachtneming van de regels, bedoeld in
      [artikel 2, tweede lid, onderdeel e, van de Wet College voor examens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
  - number: '43.1'
    text: |-
      Indien het centraal examen naar het oordeel van de inspectie niet op regelmatige wijze heeft plaatsgehad kan zij
      besluiten dat het geheel of gedeeltelijk voor een of meer kandidaten opnieuw wordt afgenomen.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel43
  - number: '43.2'
    text: |-
      De inspectie verzoekt het College voor examens nieuwe opgaven vast te stellen en bepaalt op welke wijze en door wie
      het examen zal worden afgenomen.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel43
  - number: '44'
    text: |-
      Indien door onvoorziene omstandigheden het centraal examen in één of meer vakken aan één of meer scholen niet op de
      voorgeschreven wijze kan worden afgenomen, beslist Onze Minister hoe alsdan moet worden gehandeld.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel44
  - number: '45.1'
    text: |-
      Indien een kandidaat om een geldige reden, ter beoordeling van de directeur, is verhinderd bij één of meer toetsen
      in het eerste tijdvak tegenwoordig te zijn, wordt hem in het tweede tijdvak de gelegenheid gegeven het centraal
      examen voor ten hoogste twee toetsen per dag alsnog te voltooien.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel45
  - number: '45.2'
    text: |-
      Indien een kandidaat in het tweede tijdvak evenzeer verhinderd is, of wanneer hij het centraal examen in het tweede
      tijdvak niet kan voltooien, wordt hij in de gelegenheid gesteld in het derde tijdvak ten overstaan van het College
      voor examens zijn eindexamen te voltooien.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel45
  - number: '45.3'
    text: |-
      De kandidaat meldt zich zo spoedig mogelijk door tussenkomst van de directeur aan bij het College voor examens.
      In dat geval deelt de directeur aan het College voor examens mede, wanneer dat zich voordoet, dat ten behoeve
      van de kandidaat toepassing is gegeven aan [artikel 55, eerste, tweede dan wel derde lid][ref1], en waaruit deze
      toepassing bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel55
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '55'
        hoofdstuk: VI
  - number: '45.4'
    text: Na afloop van het derde tijdvak deelt het College voor examens het resultaat mede aan de directeur.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel45
  - number: '46.1'
    text: |-
      Het College voor examens stelt regels voor de uitvoering van de rekentoets. Het College voor examens stelt in ieder
      geval een regeling vast voor de uitvoering van de correctie voor zover de rekentoets bestaat uit open vragen.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel46
  - number: '46.2'
    text: |-
      De regeling, bedoeld in het eerste lid, treedt slechts in werking na goedkeuring door Onze Minister. Onze Minister
      kan zijn goedkeuring onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel46
  - number: '46.3'
    text: |-
      Met inachtneming van de [artikelen 23, zevende lid][ref1], [24, zevende lid][ref2], en [25, vijfde lid][ref3],
      worden de beoordelingsnormen, bedoeld in [artikel 2, tweede lid, onderdeel d, van de Wet College voor examens][ref4]
      bij de beoordeling van de rekentoets toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0004593#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '23'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '24'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0004593
        artikel: '25'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0025364
        artikel: '2'
  - number: '46.4'
    text: De rekentoets wordt afgenomen in het laatste leerjaar.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel46
  - number: '46.5'
    text: |-
      In afwijking van het vierde lid kan het bevoegd gezag een leerling uit het voorlaatste leerjaar toelaten tot de
      rekentoets.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel46
  - number: '46.6'
    text: |-
      Het College voor examens kan bij regeling bepalen dat de rekentoets niet onder toezicht van een of meer
      gecommitteerden staat.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel46
  - number: '46.7'
    text: |-
      [Artikel 43][ref1] en [artikel 44][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel44
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '43'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '44'
        hoofdstuk: IV
  - number: '47.1'
    text: |-
      Het eindcijfer voor de rekentoets en alle vakken van het eindexamen wordt uitgedrukt in een geheel cijfer uit de
      reeks 1 tot en met 10.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel47
  - number: '47.2'
    text: |-
      De directeur bepaalt het eindcijfer op het rekenkundig gemiddelde van het cijfer voor het schoolexamen en het
      cijfer voor het centraal examen. Indien de uitkomst van de berekening niet een geheel getal is, wordt dat getal
      indien het eerste cijfer achter de komma een 4 of lager is, naar beneden afgerond en indien dat cijfer een 5 of
      hoger is, naar boven afgerond.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel47
  - number: '47.3'
    text: Indien in een vak alleen een schoolexamen is gehouden is het cijfer voor het schoolexamen tevens het eindcijfer.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel47
  - number: '47.4'
    text: Het cijfer voor de rekentoets is tevens het eindcijfer.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel47
  - number: '48.1'
    text: |-
      De directeur en de secretaris van het eindexamen stellen in geval van een eindexamen de uitslag vast met
      inachtneming van [artikel 49][ref1] of [artikel 50][ref2], en voor zover van toepassing [artikel 52a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0004593#Artikel52a
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '49'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '50'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0004593
        artikel: 52a
        hoofdstuk: V
  - number: '48.2'
    text: De uitslag luidt «geslaagd» of «afgewezen».
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel48
  - number: '48.3'
    text: |-
      Indien dat nodig is om de kandidaat te laten slagen betrekken de directeur en de secretaris van het eindexamen een
      of meer eindcijfers van de vakken niet bij de bepaling van de definitieve uitslag. De overgebleven vakken dienen
      een eindexamen te vormen.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel48
  - number: '48.4'
    text: |-
      Met het afleggen van het eindexamen in enig jaar aan een instelling voor educatie en beroepsonderwijs wordt
      gelijkgesteld het in dat jaar afleggen van de rekentoets of examen in een of meer vakken, aan die instelling
      met het oogmerk, in dat jaar het diploma te behalen door de combinatie met het overleggen door de desbetreffende
      kandidaat aan de examencommissie vavo van:
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel48
  - number: 48.4.a
    text: |-
      één in [artikel 52, eerste lid][ref1], of [artikel 52a][ref2], bedoelde cijferlijst van een school die is
      uitgereikt in een eerder jaar;


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel52a
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '52'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004593
        artikel: 52a
        hoofdstuk: V
  - number: 48.4.b
    text: |-
      één in [artikel 52, eerste lid][ref1], bedoelde cijferlijst, of een in [artikel 53, tweede lid][ref2], bedoeld
      certificaat, afgegeven door een andere instelling voor educatie en beroepsonderwijs;


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel53
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '52'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '53'
        hoofdstuk: V
  - number: 48.4.c
    text: |-
      één cijferlijst als bedoeld in [artikel 30, eerste of tweede lid][ref1], of
      [artikel 31, eerste lid, van het Staatsexamenbesluit VO][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel31
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0011538
        artikel: '31'
  - number: 48.4.d
    text: |-
      een of meer bewijzen van ontheffing als bedoeld in [artikel 10, vierde lid][ref1], van dit besluit, of als bedoeld
      in [artikel 11, vierde lid, van het Staatsexamenbesluit VO][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel11
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '10'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0011538
        artikel: '11'
  - number: '48.5'
    text: |-
      Cijferlijsten worden uitsluitend bij de vaststelling van de uitslag betrokken, indien na het jaar waarin zij zijn
      vastgesteld, nog geen 10 jaren zijn verstreken. Bewijzen van ontheffing worden uitsluitend bij de vaststelling
      van de uitslag betrokken indien na het jaar waarin het onderliggende diploma, getuigschrift of ander bewijsstuk is
      vastgesteld, nog geen 10 jaren zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel48
  - number: '48.6'
    text: |-
      De kandidaat toont in voorkomend geval ten genoegen van de directeur aan dat hij recht heeft op een
      vrijstelling of ontheffing ingevolge [de artikelen 11][ref1], [12][ref2], [13][ref3], [22][ref4],
      [23][ref5], [24][ref6] of [25][ref7], of ingevolge [artikel 9][ref8], van dit besluit, dan wel als bedoeld in
      [artikel 10 van het Staatsexamenbesluit VO][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0004593#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0004593#Artikel22
      [ref5]: https://wetten.overheid.nl/BWBR0004593#Artikel23
      [ref6]: https://wetten.overheid.nl/BWBR0004593#Artikel24
      [ref7]: https://wetten.overheid.nl/BWBR0004593#Artikel25
      [ref8]: https://wetten.overheid.nl/BWBR0004593#Artikel9
      [ref9]: https://wetten.overheid.nl/BWBR0011538#Artikel10
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '11'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '12'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0004593
        artikel: '13'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0004593
        artikel: '22'
        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0004593
        artikel: '23'
        hoofdstuk: II
      - id: ref6
        bwb_id: BWBR0004593
        artikel: '24'
        hoofdstuk: II
      - id: ref7
        bwb_id: BWBR0004593
        artikel: '25'
        hoofdstuk: II
      - id: ref8
        bwb_id: BWBR0004593
        artikel: '9'
        hoofdstuk: II
      - id: ref9
        bwb_id: BWBR0011538
        artikel: '10'
  - number: '48.7'
    text: |-
      De directeur vergewist zich ervan dat het eindexamen de in de [artikelen 11][ref1], [12][ref2],[13][ref3],
      [22][ref4], [23][ref5], [24][ref6] of [25][ref7] voorgeschreven vakken en rekentoets omvat.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0004593#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0004593#Artikel22
      [ref5]: https://wetten.overheid.nl/BWBR0004593#Artikel23
      [ref6]: https://wetten.overheid.nl/BWBR0004593#Artikel24
      [ref7]: https://wetten.overheid.nl/BWBR0004593#Artikel25
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '11'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '12'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0004593
        artikel: '13'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0004593
        artikel: '22'
        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0004593
        artikel: '23'
        hoofdstuk: II
      - id: ref6
        bwb_id: BWBR0004593
        artikel: '24'
        hoofdstuk: II
      - id: ref7
        bwb_id: BWBR0004593
        artikel: '25'
        hoofdstuk: II
  - number: '48.8'
    text: |-
      Indien de kandidaat eindexamen heeft afgelegd en in datzelfde jaar deelstaatsexamen heeft afgelegd of
      deeleindexamen aan een instelling voor educatie en beroepsonderwijs, worden de met het deelstaatsexamen
      respectievelijk deeleindexamen behaalde cijfers, indien de kandidaat daarom tijdig en schriftelijk heeft verzocht,
      betrokken bij de uitslagbepaling.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel48
  - number: '49.1'
    text: 'De kandidaat die het eindexamen van een leerweg in het vmbo heeft afgelegd, is geslaagd indien:'
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel49
  - number: 49.1.a
    text: het rekenkundig gemiddelde van zijn bij het centraal examen behaalde cijfers ten minste 5,5 is;
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel49
  - number: 49.1.b
    text: 'hij voor:'
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel49
  - number: 49.1.b.1°
    text: |-
      de rekentoets als eindcijfer 5 of meer heeft behaald en voor het vak Nederlandse taal als eindcijfer 6 of meer
      heeft behaald; of voor
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel49
  - number: 49.1.b.2°
    text: |-
      de rekentoets als eindcijfer 6 of meer heeft behaald en voor het vak Nederlandse taal als eindcijfer 5 of meer
      heeft behaald;
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel49
  - number: 49.1.c
    text: 'hij onverminderd onderdeel b:'
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel49
  - number: 49.1.c.1°
    text: |-
      voor één van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 of meer en voor de overige vakken
      waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer heeft behaald;
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel49
  - number: 49.1.c.2°
    text: |-
      voor één van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 4 en voor de overige vakken
      waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer waarvan ten minste één 7 of meer heeft behaald; of
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel49
  - number: 49.1.c.3°
    text: |-
      voor twee van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 heeft behaald en voor de overige
      vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer waarvan ten minste één 7 of meer heeft
      behaald;
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel49
  - number: 49.1.d
    text: |-
      hij voor de vakken lichamelijke opvoeding en het kunstvak uit het gemeenschappelijk deel de kwalificatie
      «voldoende» of «goed» heeft behaald; en
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel49
  - number: 49.1.e
    text: |-
      als het een eindexamen gemengde of theoretische leerweg betreft: hij voor het sectorwerkstuk de kwalificatie
      «voldoende» of «goed» heeft behaald.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel49
  - number: '49.2'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel c, wordt het eindcijfer van het afdelingsvak of het intrasectorale
      of intersectorale programma in de basisberoepsgerichte en de kaderberoepsgerichte leerweg meegerekend als twee
      eindcijfers.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel49
  - number: '49.3'
    text: |-
      In afwijking van het eerste lid, is de kandidaat die eindexamen van een leerweg in het vmbo heeft afgelegd ter
      afsluiting van een leerwerktraject als bedoeld in [artikel 10b1 van de wet][ref1] geslaagd indien hij voor het
      beroepsgerichte programma ten minste het eindcijfer 6 en voor de rekentoets en voor het vak Nederlandse taal ten
      minste het eindcijfer 5 en het eindcijfer 6 heeft behaald. Indien de vakken waarin examen is afgelegd, tezamen een
      eindexamen vormen van de basisberoepsgerichte leerweg, bedoeld in [artikel 10b van de wet][ref2], zijn het eerste
      en tweede lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b1
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b1
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b
  - number: '49.4'
    text: |-
      Zodra de eindcijfers en indien mogelijk de uitslag zijn vastgesteld, maakt de directeur deze schriftelijk aan de
      kandidaat bekend, onder mededeling van het in [artikel 51][ref1] bepaalde. De uitslag is de definitieve uitslag
      indien artikel 51, eerste lid, geen toepassing vindt.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel51
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '51'
        hoofdstuk: V
  - number: '50.1'
    text: 'De kandidaat die eindexamen vwo of havo heeft afgelegd, is geslaagd indien:'
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel50
  - number: 50.1.a
    text: het rekenkundig gemiddelde van zijn bij het centraal examen behaalde cijfers ten minste 5,5 is;
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel50
  - number: 50.1.b
    text: 'hij voor:'
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel50
  - number: 50.1.b.1°
    text: |-
      één van de vakken Nederlandse taal en literatuur, Engelse taal en literatuur en voor zover van toepassing wiskunde
      A, wiskunde B of wiskunde C als eindcijfer 5 of meer heeft behaald en hij voor de rekentoets en het andere vak dan
      wel vakken, genoemd in dit subonderdeel als eindcijfer 6 of meer heeft behaald; of voor
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel50
  - number: 50.1.b.2°
    text: |-
      de rekentoets als eindcijfer 5 heeft behaald en voor de vakken Nederlandse taal en literatuur, Engelse taal
      en literatuur en voor zover van toepassing wiskunde A, wiskunde B of wiskunde C als eindcijfer 6 of meer heeft
      behaald;
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel50
  - number: 50.1.c
    text: 'hij onverminderd onderdeel b:'
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel50
  - number: 50.1.c.1°
    text: |-
      voor één van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 of meer en voor de overige vakken
      waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer heeft behaald;
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel50
  - number: 50.1.c.2°
    text: |-
      voor één van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 4 en voor de overige vakken
      waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer heeft behaald, en het gemiddelde van de
      eindcijfers ten minste 6,0 bedraagt;
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel50
  - number: 50.1.c.3°
    text: |-
      voor twee van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 heeft behaald en voor de overige
      vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer heeft behaald, en het gemiddelde van de
      eindcijfers ten minste 6,0 bedraagt; of
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel50
  - number: 50.1.c.4°
    text: |-
      voor één van de vakken waarvoor een eindcijfer is vastgesteld als eindcijfer 4 en voor één van deze vakken als
      eindcijfer 5 heeft behaald en voor de overige vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of
      meer heeft behaald, en het gemiddelde van de eindcijfers ten minste 6,0 bedraagt;
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel50
  - number: 50.1.d
    text: hij voor geen van de onderdelen, genoemd in het tweede lid, lager dan het eindcijfer 4 heeft behaald; en
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel50
  - number: 50.1.e
    text: |-
      hij voor de vakken culturele en kunstzinnige vorming en lichamelijke opvoeding van het gemeenschappelijk deel van
      elk profiel, de kwalificatie «voldoende» of «goed» heeft behaald.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel50
  - number: '50.2'
    text: |-
      Bij de uitslagbepaling volgens het eerste lid, wordt het gemiddelde van de eindcijfers van ten minste de volgende
      onderdelen aangemerkt als het eindcijfer van één vak, voor zover voor deze onderdelen een eindcijfer is bepaald:
      maatschappijleer en het profielwerkstuk. Het bevoegd gezag kan daaraan toevoegen:
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel50
  - number: 50.2.a
    text: |-
      literatuur, als onderdeel van alle afzonderlijke moderne talen, met dien verstande dat indien het bevoegd gezag
      daartoe niet besluit, literatuur voor de bepaling van de eindcijfers een onderdeel is van het schoolexamen van de
      desbetreffende taal en literatuur;
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel50
  - number: 50.2.b
    text: algemene natuurwetenschappen in het havo;
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel50
  - number: 50.2.c
    text: |-
      bij bijzondere scholen: godsdienst of levensbeschouwelijk vormingsonderwijs, met dien verstande dat
      indien het bevoegd gezag daartoe niet besluit, godsdienst of levensbeschouwelijk vormingsonderwijs
      geen onderdeel is van het eindexamen, tenzij Onze Minister daarvoor goedkeuring heeft verleend met
      toepassing van [artikel 11, eerste lid, onder c][ref1], [artikel 12, eerste lid, onder c][ref2], of
      [artikel 13, eerste lid, onder c][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0004593#Artikel13
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '11'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '12'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0004593
        artikel: '13'
        hoofdstuk: II
  - number: '50.3'
    text: |-
      Indien het bevoegd gezag toepassing geeft aan de tweede volzin van het tweede lid, wordt in het examenreglement,
      bedoeld in [artikel 31][ref1], vermeld welk onderdeel of welke onderdelen worden toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel31
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '31'
        hoofdstuk: III
        afdeling: '1'
  - number: '50.4'
    text: |-
      De directeur bepaalt het eindcijfer, bedoeld in het tweede lid, als het rekenkundig gemiddelde van de eindcijfers
      van de samenstellende onderdelen. Indien de uitkomst van deze berekening niet een geheel getal is, wordt dat getal
      indien het eerste cijfer achter de komma een 4 of lager is, naar beneden afgerond en indien dat cijfer een 5 of
      hoger is, naar boven afgerond.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel50
  - number: '50.5'
    text: |-
      Zodra de eindcijfers en indien mogelijk de uitslag zijn vastgesteld, maakt de directeur deze schriftelijk aan de
      kandidaat bekend, onder mededeling van het in [artikel 51][ref1] bepaalde. De uitslag is de definitieve uitslag
      indien artikel 51, eerste lid, geen toepassing vindt.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel51
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '51'
        hoofdstuk: V
  - number: '51.1'
    text: |-
      De kandidaat heeft voor één vak van het eindexamen waarin hij reeds centraal examen heeft afgelegd, nadat ingevolge
      [artikel 49, vierde lid][ref1], of [artikel 50, vijfde lid][ref2], de eindcijfers zijn bekendgemaakt, het recht om
      in het tweede tijdvak of, indien [artikel 45, eerste lid][ref3], van toepassing is, in het derde tijdvak, opnieuw
      deel te nemen aan het centraal examen of aan het cspe, met dien verstande dat indien het betreft het eindexamen van
      de basis- of kaderberoepsgerichte leerweg in het vmbo, dit recht eveneens bestaat voor het cspe af te nemen door
      het bevoegd gezag aansluitend aan het eerste tijdvak of in het tweede tijdvak. De herkansing van het cspe bestaat
      uit het opnieuw afleggen van deze toets of van één of meer onderdelen daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0004593#Artikel45
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '49'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '50'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0004593
        artikel: '45'
        hoofdstuk: IV
  - number: '51.2'
    text: |-
      De kandidaat stelt de directeur voor een door deze laatste te bepalen dag en tijdstip schriftelijk in kennis van
      gebruikmaking van het in het eerste lid bedoelde recht.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel51
  - number: '51.3'
    text: |-
      Het hoogste van de cijfers behaald bij de herkansing en bij het eerder afgelegde centraal examen geldt als
      definitief cijfer voor het centraal examen.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel51
  - number: '51.4'
    text: |-
      Na afloop van de herkansing in het laatste leerjaar wordt de uitslag definitief vastgesteld met overeenkomstige
      toepassing van [artikel 48][ref1] en wordt deze schriftelijk aan de kandidaat bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel48
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '48'
        hoofdstuk: V
  - number: '51.5'
    text: |-
      Na afloop van een herkansing in het voorlaatste leerjaar wordt het eindcijfer schriftelijk aan de kandidaat
      bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel51
  - number: '51.6'
    text: |-
      Het eerste tot en met vierde lid zijn van overeenkomstige toepassing op de vakken waarin in een examenjaar
      deeleindexamen is afgelegd. De kandidaat die in een examenjaar zowel eindexamen als een of meer deeleindexamens
      aflegt, oefent het in het eerste lid bedoelde recht per examenjaar ten hoogste eenmaal uit.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel51
  - number: 51a.1
    text: |-
      De kandidaat heeft recht op één herkansing in de rekentoets binnen de periode waarin de rekentoets wordt afgenomen,
      bedoeld in [artikel 46, vierde en vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel46
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel51a
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '46'
        hoofdstuk: IV
  - number: 51a.2
    text: |-
      [Artikel 51, tweede tot en met vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel51
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel51a
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '51'
        hoofdstuk: V
  - number: '52.1'
    text: |-
      De directeur reikt op grond van de definitieve uitslag aan elke kandidaat die eindexamen heeft afgelegd, een
      cijferlijst uit waarop voor zover van toepassing zijn vermeld:
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52
  - number: 52.1.a
    text: de cijfers voor het schoolexamen en de cijfers voor het centraal examen,
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52
  - number: 52.1.b
    text: voor vwo en havo het vak of de vakken en het onderwerp of de titel van het profielwerkstuk,
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52
  - number: 52.1.c
    text: voor vmbo het thema van het sectorwerkstuk, alsmede de beoordeling van het sectorwerkstuk,
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52
  - number: 52.1.d
    text: de beoordeling van de vakken culturele en kunstzinnige vorming en lichamelijke opvoeding in vwo en havo,
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52
  - number: 52.1.e
    text: |-
      de beoordeling van het kunstvak en het vak lichamelijke opvoeding uit het gemeenschappelijk deel van de leerweg in
      mavo en vbo,
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52
  - number: 52.1.f
    text: 'de beoordeling van de maatschappelijke stage, indien:'
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52
  - number: 52.1.f.1°
    text: de maatschappelijke stage is beoordeeld met «voldoende» of «goed»;
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52
  - number: 52.1.f.2°
    text: deze tenminste de duur heeft gehad van 30 uren,
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52
  - number: 52.1.g
    text: |-
      volgens welke differentiatie, bedoeld in [artikel 7, derde lid][ref1], is geëxamineerd,


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel7
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '7'
        hoofdstuk: II
  - number: 52.1.h
    text: |-
      de eindcijfers voor de rekentoets en de examenvakken met inbegrip van het cijfer bepaald op grond van
      [artikel 50, tweede lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel50
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '50'
        hoofdstuk: V
  - number: 52.1.i
    text: de uitslag van het eindexamen.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52
  - number: '52.2'
    text: |-
      De directeur reikt op grond van de definitieve uitslag aan elke voor het eindexamen geslaagde kandidaat, daaronder
      mede begrepen de kandidaat die zijn eindexamen met gunstig gevolg heeft voltooid ten overstaan van het College voor
      examens, een diploma uit, waarop het profiel of de profielen zijn vermeld die bij de uitslag zijn betrokken. Op het
      dipoma vmbo is in elk geval de leerweg vermeld die bij de uitslag is betrokken.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52
  - number: '52.3'
    text: |-
      Indien een kandidaat in meer vakken examen heeft afgelegd dan in de vakken die ten minste samen een eindexamen
      vormen, worden de vakken die niet bij de bepaling van de uitslag zijn betrokken, op de cijferlijst vermeld, tenzij
      de kandidaat daartegen bedenkingen heeft geuit.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52
  - number: '52.4'
    text: Onze Minister stelt het model van de cijferlijst vast.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52
  - number: '52.5'
    text: |-
      Voor de vermelding op de cijferlijst van vakken waarvoor de kandidaat vrijstelling of ontheffing is verleend bij
      het eindexamen geldt het volgende:
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52
  - number: 52.5.a
    text: 'indien het betreft het eindexamen vwo of het eindexamen havo:'
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52
  - number: 52.5.a.1°
    text: |-
      de vakken culturele en kunstzinnige vorming en lichamelijke opvoeding van het gemeenschappelijk deel worden
      niet vermeld op de cijferlijst indien de kandidaat het eindexamen aflegt aan een instelling voor educatie en
      beroepsonderwijs;
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52
  - number: 52.5.a.2°
    text: |-
      de vakken algemene natuurwetenschappen en maatschappijleer waarvoor de kandidaat bij het eindexamen vwo is
      vrijgesteld op grond van het bezit van een diploma havo, worden niet vermeld op de cijferlijst;
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52
  - number: 52.5.a.3°
    text: |-
      vakken waarvoor de kandidaat is vrijgesteld op grond van [artikel 9][ref1] van dit besluit of
      [artikel 10 van het Staatsexamenbesluit VO][ref2], worden vermeld op de cijferlijst, met vermelding van het eerder
      behaalde cijfer;


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel10
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '9'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0011538
        artikel: '10'
  - number: 52.5.a.4°
    text: |-
      vakken waarvoor de kandidaat bij het eindexamen vwo is vrijgesteld op grond van een eerder afgelegd eindexamen havo
      of eindexamen vmbo waarvan deze vwo-vakken deel uitmaakten, worden vermeld op de cijferlijst, met vermelding van
      het eerder behaalde cijfer;
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52
  - number: 52.5.a.5°
    text: |-
      vakken waarvoor de kandidaat bij het eindexamen havo is vrijgesteld op grond van een eerder afgelegd eindexamen
      vmbo waarvan deze vakken dan wel de overeenkomstige vakken, bedoeld in [artikel 14, achtste lid, van de wet][ref1],
      deel uitmaakten, worden vermeld op de cijferlijst, met vermelding van het eerder behaalde cijfer;


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel14
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '14'
  - number: 52.5.a.6°
    text: |-
      andere vakken waarvoor de kandidaat vrijstelling of ontheffing is verleend, worden vermeld op de cijferlijst,
      zonder vermelding van een cijfer;
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52
  - number: 52.5.b
    text: 'indien het betreft het eindexamen vmbo:'
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52
  - number: 52.5.b.1°
    text: |-
      de vakken behorende tot de beeldende vorming, muziek, dans, drama en lichamelijke opvoeding van het
      gemeenschappelijk deel worden niet vermeld op de cijferlijst indien de kandidaat het eindexamen aflegt aan een
      instelling voor educatie en beroepsonderwijs;
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52
  - number: 52.5.b.2°
    text: |-
      vakken waarvoor de kandidaat is vrijgesteld op grond van [artikel 9][ref1] van dit besluit of
      [artikel 10 van het Staatsexamenbesluit VO][ref2], worden vermeld op de cijferlijst, met vermelding van het eerder
      behaalde cijfer;


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel10
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '9'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0011538
        artikel: '10'
  - number: 52.5.b.3°
    text: |-
      vakken waarvoor de kandidaat bij het eindexamen vmbo voor zover het betreft de theoretische leerweg, is
      vrijgesteld op grond van een eerder afgelegd eindexamen vmbo voor zover het betreft de kaderberoepsgerichte
      leerweg of de basisberoepsgerichte leerweg waarvan deze vakken dan wel de overeenkomstige vakken, bedoeld in
      [artikel 10, negende lid, van de wet][ref1], deel uitmaakten, worden vermeld op de cijferlijst, met vermelding van
      het eerder behaalde cijfer;


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
  - number: 52.5.b.4°
    text: |-
      andere vakken waarvoor de kandidaat vrijstelling of ontheffing is verleend, worden vermeld op de cijferlijst,
      zonder vermelding van een cijfer.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52
  - number: '52.6'
    text: |-
      Op de cijferlijst wordt de rekentoets waarvoor de kandidaat vrijstelling of ontheffing is verleend
      bij het eindexamen op grond van de [artikelen 9 tot en met 13][ref1] of [22][ref2] van dit besluit of
      [artikel 10 van het Staatsexamenbesluit VO][ref3] vermeld op de cijferlijst, met vermelding van het eerder behaalde
      cijfer.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0011538#Artikel10
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '9'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '22'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0011538
        artikel: '10'
  - number: '52.7'
    text: De directeur en de secretaris van het eindexamen tekenen de diploma's en de cijferlijsten.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52
  - number: '52.8'
    text: |-
      Indien de kandidaat in een bepaald jaar is geslaagd voor het eindexamen, draagt de directeur er op verzoek
      van de kandidaat zorg voor dat de behaalde cijfers voor de vakken waarin in datzelfde jaar deeleindexamen of
      deelstaatsexamen is afgelegd, worden vermeld op de cijferlijst.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52
  - number: '52.9'
    text: |-
      De directeur van een scholengemeenschap die in elk geval een school voor mavo omvat, reikt op verzoek van de
      kandidaat die met goed gevolg het examen vmbo in de gemengde leerweg aan die school heeft afgelegd en bovendien
      examen heeft afgelegd in een extra algemeen vak en met het meetellen van dat vak voldoet aan [artikel 49][ref1]
      voor zover het betreft de uitslag van het eindexamen vmbo in de theoretische leerweg, het diploma vmbo van de
      theoretische leerweg uit.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel49
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '49'
        hoofdstuk: V
  - number: 52a
    text: |-
      De directeur van een scholengemeenschap of school voor vwo die gymnasium verzorgt, kan in plaats van een diploma
      gymnasium een diploma atheneum uitreiken aan een kandidaat indien:
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52a
  - number: 52a.a
    text: de scholengemeenschap of school voor vwo atheneum onderwijs verzorgt;
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52a
  - number: 52a.b
    text: |-
      de scholengemeenschap of school voor vwo overeenkomstig [artikel 21 van de wet][ref1] kenbaar heeft gemaakt dat het
      behalen van een diploma atheneum en het volgen van atheneumonderwijs mogelijk is; en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel21
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '21'
  - number: 52a.c
    text: de kandidaat staat ingeschreven voor atheneum onderwijs.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52a
  - number: 52b.1
    text: |-
      Indien de kandidaat de rekentoets, een centraal examen of een afsluitend schoolexamen in één of meer vakken heeft
      afgelegd in het voorlaatste leerjaar en vervolgens de school verlaat zonder het eindexamen te voltooien, verstrekt
      de directeur hem een voorlopige cijferlijst.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52b
  - number: 52b.2
    text: |-
      Op de voorlopige cijferlijst worden de rekentoets, het vak of de vakken waarin de kandidaat centraal examen heeft
      afgelegd vermeld, alsmede het cijfer van het schoolexamen, het cijfer van het centraal examen en het eindcijfer,
      met de aantekening of gebruik is gemaakt van de herkansingsmogelijkheid.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52b
  - number: 52b.3
    text: |-
      Indien de kandidaat een afsluitend schoolexamen heeft afgelegd wordt de beoordeling of het cijfer daarvan vermeld
      op de voorlopige cijferlijst.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52b
  - number: 52b.4
    text: Onze Minister stelt het model van de voorlopige cijferlijst vast.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel52b
  - number: '53.1'
    text: |-
      De examencommissie vavo reikt aan de kandidaat die deeleindexamen heeft afgelegd aan een instelling voor educatie
      en beroepsonderwijs, een cijferlijst uit waarop zijn vermeld, voor zover van toepassing:
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel53
  - number: 53.1.a
    text: de cijfers voor het schoolexamen en het centraal examen,
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel53
  - number: 53.1.b
    text: voor het vwo en havo het vak of de vakken en het onderwerp of de titel van het profielwerkstuk,
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel53
  - number: 53.1.c
    text: voor het vmbo het thema alsmede de beoordeling van het sectorwerkstuk, en
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel53
  - number: 53.1.d
    text: |-
      de eindcijfers voor de rekentoets en de examenvakken met inbegrip van het cijfer, bepaald op grond van
      [artikel 49, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel49
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '49'
        hoofdstuk: V
  - number: '53.2'
    text: |-
      De examencommissie vavo reikt aan de in het eerste lid bedoelde kandidaat, alsmede aan de kandidaat aan wie op
      grond van de definitieve uitslag niet op grond van [52, tweede lid][ref1], een diploma kan worden uitgereikt, een
      certificaat uit, waarop zijn vermeld, voor zover van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel52
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '52'
        hoofdstuk: V
  - number: 53.2.a
    text: het vak of de vakken waarvoor de kandidaat een eindcijfer 6 of meer heeft behaald,
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel53
  - number: 53.2.b
    text: de rekentoets, indien de kandidaat een eindcijfer 6 of meer heeft behaald,
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel53
  - number: 53.2.c
    text: voor het vwo en havo het vak of de vakken en het onderwerp of de titel van het profielwerkstuk, en
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel53
  - number: 53.2.d
    text: voor het vmbo het thema van het sectorwerkstuk, voor zover beoordeeld met «goed» of «voldoende».
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel53
  - number: '53.3'
    text: |-
      De directeur reikt aan de definitief voor het eindexamen vmbo afgewezen kandidaat die de school verlaat en die voor
      een of meer vakken of de rekentoets van dat eindexamen een eindcijfer 6 of meer heeft behaald, een certificaat uit,
      waarop zijn vermeld, voor zover van toepassing:
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel53
  - number: 53.3.a
    text: het vak of de vakken waarvoor de kandidaat een eindcijfer 6 of meer heeft behaald,
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel53
  - number: 53.3.b
    text: de rekentoets, indien de kandidaat een eindcijfer 6 of meer heeft behaald, en
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel53
  - number: 53.3.c
    text: het thema van het sectorwerkstuk, voor zover beoordeeld met «goed» of «voldoende».
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel53
  - number: '53.4'
    text: Onze Minister stelt het model van het certificaat en de cijferlijst vast.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel53
  - number: '54.1'
    text: Duplicaten van afgegeven diploma's, certificaten, bewijzen van ontheffing en cijferlijsten worden niet verstrekt.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel54
  - number: '54.2'
    text: |-
      Een schriftelijke verklaring dat een in het eerste lid bedoeld document is afgegeven, welke verklaring dezelfde
      waarde heeft als dat document zelf, kan uitsluitend door Onze Minister worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel54
  - number: '54.3'
    text: |-
      Een document ter vervanging van een diploma, certificaat of cijferlijst kan uitsluitend door Onze Minister
      worden verstrekt indien op grond van [artikel 4, vierde lid][ref1], [artikel 7, eerste lid][ref2], of
      [artikel 28b, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref3] de voornaam onderscheidenlijk de
      geslachtsnaam van de kandidaat is gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel28b
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: 28b
  - number: '55.1'
    text: |-
      De directeur kan toestaan dat een gehandicapte kandidaat het examen geheel of gedeeltelijk aflegt op een wijze
      die is aangepast aan de mogelijkheden van die kandidaat. In dat geval bepaalt de directeur de wijze waarop het
      examen zal worden afgelegd, met dien verstande dat aan de overige bepalingen in dit besluit wordt voldaan. Hij doet
      hiervan zo spoedig mogelijk mededeling aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel55
  - number: '55.2'
    text: |-
      Tenzij sprake is van een objectief waarneembare lichamelijke handicap, geldt ten aanzien van de in het eerste lid
      bedoelde aangepaste wijze van examineren dat:
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel55
  - number: 55.2.a
    text: er een deskundigenverklaring is die door een ter zake deskundige psycholoog of orthopedagoog is opgesteld,
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel55
  - number: 55.2.b
    text: |-
      de aanpassing voor zover betrekking hebbend op het centraal examen of de rekentoets in ieder geval kan bestaan uit
      een verlenging van de duur van de desbetreffende toets van het centraal examen met ten hoogste 30 minuten, en
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel55
  - number: 55.2.c
    text: |-
      een andere aanpassing slechts kan worden toegestaan voor zover daartoe in de onder a genoemde deskundigenverklaring
      ten aanzien van betrokkene een voorstel wordt gedaan dan wel indien de aanpassing aantoonbaar aansluit bij de
      begeleidingsadviezen, vermeld in die deskundigenverklaring.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel55
  - number: '55.3'
    text: |-
      Het bevoegd gezag kan in verband met onvoldoende beheersing van de Nederlandse taal afwijken van de voorschriften
      gegeven bij of krachtens dit besluit, ten aanzien van een kandidaat die met inbegrip van het schooljaar waarin hij
      eindexamen aflegt, ten hoogste zes jaren onderwijs in Nederland heeft gevolgd en voor wie het Nederlands niet de
      moedertaal is. De in de eerste volzin bedoelde afwijking kan betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel55
  - number: 55.3.a
    text: het vak Nederlandse taal en literatuur;
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel55
  - number: 55.3.b
    text: het vak Nederlandse taal;
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel55
  - number: 55.3.c
    text: enig ander vak waarbij het gebruik van de Nederlandse taal van overwegende betekenis is.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel55
  - number: '55.4'
    text: |-
      De in het derde lid bedoelde afwijking bestaat voor zover betrekking hebbend op het centraal examen slechts uit
      een verlenging van de duur van de desbetreffende toets van het centraal examen met ten hoogste 30 minuten en het
      verlenen van toestemming tot het gebruik van een verklarend woordenboek der Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel55
  - number: '55.5'
    text: Van elke afwijking op grond van het derde lid wordt mededeling gedaan aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel55
  - number: '56.1'
    text: |-
      Zo spoedig mogelijk na de vaststelling van de eindcijfers in het voorlaatste leerjaar, voor zover van toepassing,
      en na de vaststelling van de definitieve uitslag stuurt het bevoegd gezag aan Onze Minister en aan de inspectie een
      opgave waarop voor de kandidaten voor zover van toepassing zijn vermeld:
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel56
  - number: 56.1.a
    text: het profiel of de profielen danwel de leerweg waarop het examen betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel56
  - number: 56.1.b
    text: de vakken waarin examen is afgelegd;
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel56
  - number: 56.1.c
    text: |-
      de cijfers van het schoolexamen alsmede in voorkomend geval, het vak of de vakken waarop het profielwerkstuk
      betrekking heeft en de beoordeling en het thema van het sectorwerkstuk;
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel56
  - number: 56.1.d
    text: de cijfers van het centraal examen;
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel56
  - number: 56.1.e
    text: de rekentoets;
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel56
  - number: 56.1.f
    text: de eindcijfers;
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel56
  - number: 56.1.g
    text: de uitslag van het eindexamen.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel56
  - number: '56.2'
    text: |-
      Het eerste lid is niet van toepassing op een bevoegd gezag dat op
      grond van [artikel 103b, tweede lid, van de wet][ref1] of op grond van
      [artikel 2.3.6a, tweede lid, van de Wet educatie en beroepsonderwijs][ref2] examengegevens samen met het
      persoonsgebonden nummer verstrekt aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel103b
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 103b
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
  - number: '57.1'
    text: |-
      Het werk van het centraal examen en de rekentoets der kandidaten wordt gedurende ten minste zes maanden na de
      vaststelling van de uitslag bewaard door de directeur, ter inzage voor belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel57
  - number: '57.2'
    text: |-
      Een door de directeur en de secretaris van het eindexamen ondertekend exemplaar van de opgave, bedoeld in
      [artikel 56][ref1] wordt gedurende ten minste zes maanden na de vaststelling van de uitslag in het archief van de
      school bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel56
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '56'
        hoofdstuk: VI
  - number: '57.3'
    text: |-
      De directeur draagt er zorg voor dat een volledig stel van de bij de centrale examens gebruikte opgaven gedurende
      ten minste zes maanden na de vaststelling van de uitslag bewaard blijft in het archief van de school.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel57
  - number: '57.4'
    text: |-
      Een kandidaat die voor een vak ten overstaan van het College voor examens centraal examen aflegt met geheime
      opgaven, kan omtrent zijn werk gedurende genoemde periode van zes maanden inlichtingen inwinnen bij het College
      voor examens.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel57
  - number: '58'
    text: |-
      Ten behoeve van experimenten met een andere inrichting van het eindexamen kan Onze Minister toestaan dat van dit
      besluit wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel58
  - number: '59.1'
    text: |-
      Het bevoegd gezag kan, de inspectie gehoord, toestaan dat een kandidaat die in het laatste leerjaar langdurig ziek
      is, en een kandidaat die lange tijd ten gevolge van een bijzondere, van de wil van de kandidaat onafhankelijke
      omstandigheid niet in staat is geweest het onderwijs in alle betrokken eindexamenvakken gedurende het laatste
      leerjaar te volgen, het centraal examen en in voorkomend geval het schoolexamen, voor een deel van de vakken in het
      ene schooljaar en voor het andere deel in het daarop volgende schooljaar aflegt. In dat geval wordt het eindexamen
      in een vak in het eerste of in het tweede van deze schooljaren afgesloten.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel59
  - number: '59.2'
    text: |-
      Het eerste lid is van toepassing op de rekentoets, met dien verstande dat de rekentoets in het ene schooljaar of in
      het daarop volgende schooljaar kan worden afgelegd.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel59
  - number: '59.3'
    text: |-
      Het bevoegd gezag geeft zijn in het eerste lid bedoelde toestemming uiterlijk voor de aanvang van het eerste
      tijdvak van het centraal examen. In bijzondere gevallen kan het bevoegd gezag afwijken van de eerste volzin ten
      behoeve van een kandidaat die nog niet in alle betrokken eindexamenvakken centraal examen heeft afgelegd.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel59
  - number: '59.4'
    text: |-
      [Artikel 51, eerste tot en met vierde lid][ref1], is ten aanzien van de kandidaat van toepassing in het eerste en
      in het tweede schooljaar van het gespreid centraal examen, met dien verstande dat het in dat artikel bedoelde recht
      in het eerste schooljaar ontstaat nadat de eindcijfers van de vakken waarvoor in het eerste schooljaar het centraal
      examen is afgesloten, voor de eerste maal zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel51
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '51'
        hoofdstuk: V
  - number: '59.5'
    text: |-
      Zo spoedig mogelijk na de vaststelling van de eindcijfers, behaald tot en met het eerste schooljaar van het
      gespreid centraal examen, zendt het bevoegd gezag aan de Onze Minister een opgave waarop voor die kandidaat zijn
      vermeld de gegevens, genoemd in [artikel 56, onderdelen a tot en met g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel56
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '56'
        hoofdstuk: VI
  - number: '59.6'
    text: |-
      De directeur en de secretaris stellen op verzoek van de kandidaat de uitslag van het eindexamen reeds vast aan het
      einde van het eerste schooljaar van het gespreid centraal examen of het gespreid schoolexamen, met overeenkomstige
      toepassing van [artikel 49][ref1] of [artikel 50][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel50
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '49'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '50'
        hoofdstuk: V
  - number: '66'
    text: |-
      De op het tijdstip van inwerkingtreding van dit besluit door Onze Minister gegeven regelingen en beschikkingen
      ter uitvoering van het Eindexamenbesluit dagscholen v.w.o.-h.a.v.o.-m.a.v.o., het Eindexamenbesluit avondscholen
      v.w.o.-h.a.v.o.-m.a.v.o. en het Eindexamenbesluit l.b.o. berusten vanaf dat tijdstip op dit besluit.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel66
  - number: '67.1'
    text: Dit besluit treedt in werking met ingang van 1 augustus 1990.
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel67
  - number: '67.2'
    text: |-
      In afwijking van het bepaalde in het eerste lid treden de [artikelen 53][ref1], [54][ref2], [60][ref3], [62][ref4]
      en [65, de onderdelen C, D, E, F en G][ref5], in werking met ingang van de dag na de datum van uitgifte van het
      *Staatsblad* waarin dit besluit wordt geplaatst en werken terug tot en met 1 augustus 1988.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0004593#Artikel60
      [ref4]: https://wetten.overheid.nl/BWBR0004593#Artikel62
      [ref5]: https://wetten.overheid.nl/BWBR0004593#Artikel65
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '53'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '54'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0004593
        artikel: '60'
        hoofdstuk: VI
      - id: ref4
        bwb_id: BWBR0004593
        artikel: '62'
        hoofdstuk: VII
      - id: ref5
        bwb_id: BWBR0004593
        artikel: '65'
        hoofdstuk: VII
  - number: '68'
    text: 'Dit besluit wordt aangehaald als: Eindexamenbesluit VO.'
    url: https://wetten.overheid.nl/BWBR0004593/2014-11-14#Artikel68
