  - number: 52a
    text: |-
      De directeur van een scholengemeenschap of school voor vwo die gymnasium verzorgt, kan in plaats van een diploma
      gymnasium een diploma atheneum uitreiken aan een kandidaat indien:

      a. de scholengemeenschap of school voor vwo atheneum onderwijs verzorgt;

      b. de scholengemeenschap of school voor vwo overeenkomstig [artikel 21 van de wet][ref1] kenbaar heeft gemaakt dat
      het behalen van een diploma atheneum en het volgen van atheneumonderwijs mogelijk is; en

      c. de kandidaat staat ingeschreven voor atheneum onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel21
    url: https://wetten.overheid.nl/BWBR0004593/2011-11-05#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '21'
  - number: 52b
    text: |-
      1 Indien de kandidaat een centraal examen of een afsluitend schoolexamen in één of meer vakken heeft afgelegd in
      het voorlaatste leerjaar en vervolgens de school verlaat zonder het eindexamen te voltooien, verstrekt de directeur
      hem een voorlopige cijferlijst.

      2 Op de voorlopige cijferlijst worden het vak of de vakken waarin de kandidaat centraal examen heeft afgelegd
      vermeld, alsmede het cijfer van het schoolexamen, het cijfer van het centraal examen en het eindcijfer, met de
      aantekening of gebruik is gemaakt van de herkansingsmogelijkheid.

      3 Indien de kandidaat een afsluitend schoolexamen heeft afgelegd wordt de beoordeling of het cijfer daarvan vermeld
      op de voorlopige cijferlijst.

      4 Onze Minister stelt het model van de voorlopige cijferlijst vast.
    url: https://wetten.overheid.nl/BWBR0004593/2011-11-05#Artikel52b
  - number: '53'
    text: |-
      1 De examencommissie vavo reikt aan de kandidaat die deeleindexamen heeft afgelegd aan een instelling voor educatie
      en beroepsonderwijs, een cijferlijst uit waarop zijn vermeld, voor zover van toepassing:

      a. de cijfers voor het schoolexamen en het centraal examen,

      b. voor het vwo en havo het vak of de vakken en het onderwerp of de titel van het profielwerkstuk,

      c. voor het vmbo het thema alsmede de beoordeling van het sectorwerkstuk, en

      d. de eindcijfers voor de examenvakken met inbegrip van het cijfer, bepaald op grond van
      [artikel 49, vierde lid][ref1].

      2 De examencommissie vavo reikt aan de in het eerste lid bedoelde kandidaat, alsmede aan de kandidaat aan wie op
      grond van de definitieve uitslag niet op grond van [52, tweede lid][ref2], een diploma kan worden uitgereikt, een
      certificaat uit, waarop zijn vermeld, voor zover van toepassing:

      a. het vak of de vakken waarvoor de kandidaat een eindcijfer 6 of meer heeft behaald,

      b. voor het vwo en havo het vak of de vakken en het onderwerp of de titel van het profielwerkstuk, en

      c. voor het vmbo het thema van het sectorwerkstuk, voor zover beoordeeld met «goed» of «voldoende».

      3 De directeur reikt aan de definitief voor het eindexamen vmbo afgewezen kandidaat die de school verlaat en die
      voor een of meer vakken van dat eindexamen een eindcijfer 6 of meer heeft behaald, een certificaat uit, waarop zijn
      vermeld, voor zover van toepassing:

      a. het vak of de vakken waarvoor de kandidaat een eindcijfer 6 of meer heeft behaald, en

      b. het thema van het sectorwerkstuk, voor zover beoordeeld met «goed» of «voldoende».

      4 Onze Minister stelt het model van het certificaat en de cijferlijst vast.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel52
