  - number: '42'
    text: |-
      1 De examinator en de gecommitteerde stellen in onderling overleg de score voor het centraal examen vast. Indien
      de examinator en de gecommitteerde daarbij niet tot overeenstemming komen, wordt het geschil voorgelegd aan het
      bevoegd gezag van de gecommitteerde. Dit bevoegd gezag kan hierover in overleg treden met het bevoegd gezag van
      de examinator. Indien het geschil niet kan worden beslecht, wordt hiervan melding gemaakt aan de inspectie. De
      inspectie kan een onafhankelijke corrector aanwijzen. De beoordeling van deze corrector komt in de plaats van de
      eerdere beoordelingen.

      2 De directeur stelt het cijfer voor het centraal examen in een vak vast op grond van
      de score, bedoeld in het eerste lid, en met inachtneming van de regels, bedoeld in
      [artikel 2, tweede lid, onderdeel e, van de Wet College voor examens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0004593/2011-11-05#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
  - number: '43'
    text: |-
      1 Indien het centraal examen naar het oordeel van de inspectie niet op regelmatige wijze heeft plaatsgehad kan zij
      besluiten dat het geheel of gedeeltelijk voor een of meer kandidaten opnieuw wordt afgenomen.

      2 De inspectie verzoekt het College voor examens nieuwe opgaven vast te stellen en bepaalt op welke wijze en door
      wie het examen zal worden afgenomen.
    url: https://wetten.overheid.nl/BWBR0004593/2011-11-05#Artikel43
  - number: '44'
    text: |-
      Indien door onvoorziene omstandigheden het centraal examen in één of meer vakken aan één of meer scholen niet op de
      voorgeschreven wijze kan worden afgenomen, beslist Onze Minister hoe alsdan moet worden gehandeld.
    url: https://wetten.overheid.nl/BWBR0004593/2011-11-05#Artikel44
  - number: '45'
    text: |-
      1 Indien een kandidaat om een geldige reden, ter beoordeling van de directeur, is verhinderd bij één of meer
      toetsen in het eerste tijdvak tegenwoordig te zijn, wordt hem in het tweede tijdvak de gelegenheid gegeven het
      centraal examen voor ten hoogste twee toetsen per dag alsnog te voltooien.

      2 Indien een kandidaat in het tweede tijdvak evenzeer verhinderd is, of wanneer hij het centraal examen in het
      tweede tijdvak niet kan voltooien, wordt hij in de gelegenheid gesteld in het derde tijdvak ten overstaan van het
      College voor examens zijn eindexamen te voltooien.

      3 De kandidaat meldt zich zo spoedig mogelijk door tussenkomst van de directeur aan bij het College voor examens.
      In dat geval deelt de directeur aan het College voor examens mede, wanneer dat zich voordoet, dat ten behoeve
      van de kandidaat toepassing is gegeven aan [artikel 55, eerste, tweede dan wel derde lid][ref1], en waaruit deze
      toepassing bestaat.

      4 Na afloop van het derde tijdvak deelt het College voor examens het resultaat mede aan de directeur.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel55
    url: https://wetten.overheid.nl/BWBR0004593/2011-11-05#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '55'
        hoofdstuk: VI
  - number: '47'
    text: |-
      1 Het eindcijfer voor alle vakken van het eindexamen wordt uitgedrukt in een geheel cijfer uit de reeks 1 tot en
      met 10.

      2 De directeur bepaalt het eindcijfer op het rekenkundig gemiddelde van het cijfer voor het schoolexamen en het
      cijfer voor het centraal examen. Indien de uitkomst van de berekening niet een geheel getal is, wordt dat getal
      indien het eerste cijfer achter de komma een 4 of lager is, naar beneden afgerond en indien dat cijfer een 5 of
      hoger is, naar boven afgerond.

      3 Indien in een vak alleen een schoolexamen is gehouden is het cijfer voor het schoolexamen tevens het eindcijfer.
    url: https://wetten.overheid.nl/BWBR0004593/2011-11-05#Artikel47
  - number: '48'
    text: |-
      1 De directeur en de secretaris van het eindexamen stellen in geval van een eindexamen de uitslag vast met
      inachtneming van [artikel 49][ref1], en voor zover van toepassing [artikel 52a][ref2].

      2 De uitslag luidt «geslaagd» of «afgewezen».

      3 Indien dat nodig is om de kandidaat te laten slagen betrekken de directeur en de secretaris van het eindexamen
      een of meer eindcijfers van de vakken niet bij de bepaling van de definitieve uitslag. De overgebleven vakken
      dienen een eindexamen te vormen.

      4 Met het afleggen van het eindexamen in enig jaar aan een instelling voor educatie en beroepsonderwijs wordt
      gelijkgesteld het in dat jaar afleggen van examen in een of meer vakken aan die instelling met het oogmerk, in
      dat jaar het diploma te behalen door de combinatie met het overleggen door de desbetreffende kandidaat aan de
      examencommissie vavo van:

      a. één in [artikel 52, eerste lid][ref3], of [artikel 52a][ref4], bedoelde cijferlijst van een school die is
      uitgereikt in een eerder jaar;

      b. één in [artikel 52, eerste lid][ref5], bedoelde cijferlijst, of een in [artikel 53, tweede lid][ref6], bedoeld
      certificaat, afgegeven door een andere instelling voor educatie en beroepsonderwijs;

      c. één cijferlijst als bedoeld in [artikel 30, eerste of tweede lid][ref7], of
      [artikel 31, eerste lid, van het Staatsexamenbesluit VO][ref8];

      d. een of meer bewijzen van ontheffing als bedoeld in [artikel 10, vierde lid][ref9], van dit besluit, of als
      bedoeld in [artikel 11, vierde lid, van het Staatsexamenbesluit VO][ref10].

      5 Cijferlijsten worden uitsluitend bij de vaststelling van de uitslag betrokken, indien na het jaar waarin zij
      zijn vastgesteld, nog geen 10 jaren zijn verstreken. Bewijzen van ontheffing worden uitsluitend bij de vaststelling
      van de uitslag betrokken indien na het jaar waarin het onderliggende diploma, getuigschrift of ander bewijsstuk is
      vastgesteld, nog geen 10 jaren zijn verstreken.

      6 De kandidaat toont in voorkomend geval ten genoegen van de directeur aan dat hij recht heeft op een
      vrijstelling of ontheffing ingevolge [de artikelen 11][ref11], [12][ref12], [13][ref13], [22][ref14],
      [23][ref15], [24][ref16] of [25][ref17], of ingevolge [artikel 9][ref18], van dit besluit, dan wel als bedoeld in
      [artikel 10 van het Staatsexamenbesluit VO][ref19].

      7 De directeur vergewist zich ervan dat het eindexamen de in de [artikelen 11][ref20], [12][ref21],[13][ref22],
      [22][ref23], [23][ref24], [24][ref25] of [25][ref26] voorgeschreven vakken omvat.

      8 Indien de kandidaat eindexamen heeft afgelegd en in datzelfde jaar deelstaatsexamen heeft afgelegd of
      deeleindexamen aan een instelling voor educatie en beroepsonderwijs, worden de met het deelstaatsexamen
      respectievelijk deeleindexamen behaalde cijfers, indien de kandidaat daarom tijdig en schriftelijk heeft verzocht,
      betrokken bij de uitslagbepaling.


