        bwb_id: BWBR0002399
        artikel: 103b
  - number: '33'
    text: |-
      Voor de aanvang van het centraal examen maakt de directeur aan de kandidaat bekend, voorzover van toepassing:

      a. welk cijfer of welke cijfers hij heeft behaald voor het schoolexamen,

      b. de beoordeling van de vakken waarvoor geen cijfer wordt vastgesteld,

      c. de beoordeling van het sectorwerkstuk, en

      d. de beoordeling van de maatschappelijke stage.
    url: https://wetten.overheid.nl/BWBR0004593/2011-11-05#Artikel33
  - number: '35'
    text: |-
      1 Het cijfer van het schoolexamen wordt uitgedrukt in een cijfer uit een schaal van cijfers lopende van 1 tot en
      met 10.

      2 Indien in een vak tevens centraal examen wordt afgelegd, worden de in het eerste lid genoemde cijfers gebruikt
      met de daartussen liggende cijfers met 1 decimaal.

      3 In afwijking van het eerste lid, worden het vak culturele en kunstzinnige vorming en het vak lichamelijke
      opvoeding uit het gemeenschappelijk deel van elk profiel en de maatschappelijke stage, beoordeeld met «voldoende»
      of «goed». Deze beoordeling gaat uit van de mogelijkheden van de leerling en geschiedt op de grondslag van het
      genoegzaam afsluiten van de desbetreffende vakken, zoals blijkend uit het examendossier. De eerste en tweede volzin
      zijn van overeenkomstige toepassing op de kunstvakken en het vak lichamelijke opvoeding uit het gemeenschappelijk
      deel van elke leerweg.

      4 In afwijking van het eerste lid wordt het sectorwerkstuk beoordeeld met «voldoende» of «goed». Deze
      beoordeling geschiedt op de grondslag van het genoegzaam voltooien van het sectorwerkstuk, zoals blijkend uit het
      examendossier. Het sectorwerkstuk wordt beoordeeld door ten minste twee examinatoren.
    url: https://wetten.overheid.nl/BWBR0004593/2011-11-05#Artikel35
  - number: 35b1
    text: |-
      1 Het bevoegd gezag kan bepalen dat de kandidaat die eindexamen of deeleindexamen aflegt, voor één of meer vakken
      het schoolexamen waarin geen centraal examen wordt afgenomen, opnieuw kan afleggen, met dien verstande dat het
      bevoegd gezag dit recht in elk geval verleent voor het vak maatschappijleer behorend tot het gemeenschappelijk deel
      van de leerwegen, indien de kandidaat voor dat vak een eindcijfer heeft behaald lager dan 6. Het herexamen omvat
      door het bevoegd gezag aangegeven onderdelen van het examenprogramma.

      2 Het bevoegd gezag stelt vast hoe het cijfer van het in het eerste lid bedoelde herexamen wordt bepaald. Het
      hoogste van de cijfers behaald bij het herexamen in een vak en bij het eerder afgelegde schoolexamen in dat vak
      geldt als het definitieve cijfer van het schoolexamen in dat vak.
    url: https://wetten.overheid.nl/BWBR0004593/2011-11-05#Artikel35b1
  - number: 35c
    text: |-
      Het schoolexamen bestaat uit een examendossier. Het examendossier is het geheel van de onderdelen
      van het schoolexamen zoals gedocumenteerd in een door het bevoegd gezag gekozen vorm. Het
      examendossier voor het vmbo omvat tevens de resultaten die de leerling heeft behaald voor
      de vakken, bedoeld in [artikel 26g, eerste lid, van het Inrichtingsbesluit W.V.O.][ref1] of
      [artikel 26i, tweede lid, van dat besluit][ref2], voor zover in die vakken geen eindexamen is afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel26g
      [ref2]: https://wetten.overheid.nl/BWBR0005946#Artikel26i
    url: https://wetten.overheid.nl/BWBR0004593/2011-11-05#Artikel35c
