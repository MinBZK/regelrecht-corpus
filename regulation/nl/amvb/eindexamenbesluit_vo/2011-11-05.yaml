  - number: '49'
    text: |-
      1 De kandidaat die eindexamen vmbo heeft afgelegd, is geslaagd indien het rekenkundig gemiddelde van zijn bij het
      centraal examen behaalde cijfers ten minste 5,5 is, en hij tevens:

      a. voor ten hoogste één van zijn examenvakken het eindcijfer 5 heeft behaald en voor zijn overige examenvakken een
      6 of hoger, of

      b. voor ten hoogste één van zijn examenvakken het eindcijfer 4 heeft behaald en voor zijn overige examenvakken een
      6 of hoger waarvan ten minste één 7 of hoger, of

      c. voor twee van zijn examenvakken het eindcijfer 5 heeft behaald en voor zijn overige examenvakken een 6 of hoger
      waarvan ten minste één 7 of hoger.

      2 Voor de toepassing van het eerste lid, onderdelen a, b en c, wordt het eindcijfer van het afdelingsvak of
      het intrasectorale of intersectorale programma in de basisberoepsgerichte en de kaderberoepsgerichte leerweg
      meegerekend als twee eindcijfers.

      3 In aanvulling op het eerste lid geldt tevens dat voor de vakken lichamelijke opvoeding en het kunstvak uit
      het gemeenschappelijk deel, voor de maatschappelijke stage en in de gemengde en de theoretische leerweg voor het
      sectorwerkstuk de kwalificatie «voldoende» of «goed» is behaald.

      4 In afwijking van het eerste en derde lid, is de kandidaat die eindexamen vmbo heeft afgelegd ter afsluiting
      van een leerwerktraject als bedoeld in [artikel 10b1 van de wet][ref1], geslaagd indien hij zowel voor het vak
      Nederlandse taal als voor het beroepsgerichte programma het eindcijfer 6 of hoger en voor de maatschappelijke
      stage de kwalificatie «voldoende» of «goed» heeft behaald. Indien de vakken waarin examen is afgelegd, tezamen een
      eindexamen vormen van de basisberoepsgerichte leerweg, bedoeld in [artikel 10b van de wet][ref2], zijn het eerste
      tot en met derde lid van overeenkomstige toepassing.

      5 De kandidaat die eindexamen vwo of havo heeft afgelegd, is geslaagd:

      a. indien het rekenkundig gemiddelde van zijn bij het centraal examen behaalde cijfers ten minste 5,5 is,

      b. indien hij:

      1°. voor al zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer heeft behaald,

      2°. voor één van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 en voor de overige vakken
      waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer heeft behaald,

      3°. voor één van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 4 en voor de overige
      vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer heeft behaald, en het gemiddelde van de
      eindcijfers tenminste 6,0 bedraagt, dan wel

      4°. voor twee van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 heeft behaald dan wel
      voor één van de vakken waarvoor een eindcijfer is vastgesteld als eindcijfer 4 en voor één van deze vakken als
      eindcijfer 5 heeft behaald, en voor de overige vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of
      meer heeft behaald, en het gemiddelde van de eindcijfers tenminste 6,0 bedraagt,

      c. indien geen van de eindcijfers van onderdelen, genoemd in het zesde lid, lager is dan 4, en

      d. indien de vakken culturele en kunstzinnige vorming en lichamelijke opvoeding van het gemeenschappelijk deel van
      elk profiel alsmede de maatschappelijke stage, zijn beoordeeld als «voldoende» of «goed».

      6 Bij de uitslagbepaling volgens het vijfde lid wordt het gemiddelde van de eindcijfers van ten minste de volgende
      onderdelen aangemerkt als het eindcijfer van één vak, voor zover voor deze onderdelen een eindcijfer is bepaald:
      maatschappijleer en het profielwerkstuk en voor vwo ook algemene natuurwetenschappen. Het bevoegd gezag kan daaraan
      toevoegen:

      a. literatuur, als onderdeel van alle afzonderlijke moderne talen, met dien verstande dat indien het bevoegd gezag
      daartoe niet besluit, literatuur voor de bepaling van de eindcijfers een onderdeel is van het schoolexamen van de
      desbetreffende taal en literatuur,

      b. klassieke culturele vorming, met dien verstande dat indien het bevoegd gezag daartoe niet besluit, klassieke
      culturele vorming voor de bepaling van de eindcijfers een onderdeel is van het schoolexamen van Latijnse taal en
      literatuur en Griekse taal en literatuur,

      c. algemene natuurwetenschappen in het havo,

      d. bij bijzondere scholen: godsdienst of levensbeschouwelijk vormingsonderwijs, met dien verstande
      dat indien het bevoegd gezag daartoe niet besluit, godsdienst of levensbeschouwelijk vormingsonderwijs
      geen onderdeel is van het eindexamen, tenzij Onze Minister daarvoor goedkeuring heeft verleend met
      toepassing van [artikel 11, eerste lid, onder c][ref3], [artikel 12, eerste lid, onder c][ref4], of
      [artikel 13, eerste lid, onder c][ref5].

      7 Indien het bevoegd gezag toepassing geeft aan de tweede volzin van het zesde lid, wordt in het examenreglement,
      bedoeld in [artikel 31][ref6], vermeld welk onderdeel of welke onderdelen worden toegevoegd.

      8 De directeur bepaalt het eindcijfer, bedoeld in het zesde lid, als het rekenkundig gemiddelde van de eindcijfers
      van de samenstellende onderdelen. Indien de uitkomst van deze berekening niet een geheel getal is, wordt dat getal
      indien het eerste cijfer achter de komma een 4 of lager is, naar beneden afgerond en indien dat cijfer een 5 of
      hoger is, naar boven afgerond.

      9 Zodra de eindcijfers en indien mogelijk de uitslag is vastgesteld, maakt de directeur deze schriftelijk aan
      iedere kandidaat bekend, onder mededeling van het in [artikel 51][ref7] bepaalde. De uitslag is de definitieve
      uitslag indien [artikel 51, eerste lid][ref8], geen toepassing vindt.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b1
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
