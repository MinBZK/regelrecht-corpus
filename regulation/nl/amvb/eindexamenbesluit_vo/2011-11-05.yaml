  - number: '51'
    text: |-
      1 De kandidaat heeft voor één vak van het eindexamen waarin hij reeds centraal examen heeft afgelegd, nadat
      ingevolge [artikel 49, negende lid][ref1], de eindcijfers zijn bekendgemaakt, het recht om in het tweede tijdvak
      of, indien [artikel 45, eerste lid][ref2], van toepassing is, in het derde tijdvak, opnieuw deel te nemen aan
      het centraal examen of aan het cspe, met dien verstande dat indien het betreft het eindexamen van de basis- of
      kaderberoepsgerichte leerweg in het vmbo, dit recht eveneens bestaat voor het cspe af te nemen door het bevoegd
      gezag aansluitend aan het eerste tijdvak of in het tweede tijdvak. De herkansing van het cspe bestaat uit het
      opnieuw afleggen van deze toets of van één of meer onderdelen daarvan.

      2 De kandidaat stelt de directeur voor een door deze laatste te bepalen dag en tijdstip schriftelijk in kennis van
      gebruikmaking van het in het eerste lid bedoelde recht.

      3 Het hoogste van de cijfers behaald bij de herkansing en bij het eerder afgelegde centraal examen geldt als
      definitief cijfer voor het centraal examen.

      4 Na afloop van de herkansing in het laatste leerjaar wordt de uitslag definitief vastgesteld met overeenkomstige
      toepassing van [artikel 48][ref3] en wordt deze schriftelijk aan de kandidaat bekendgemaakt.

      5 Na afloop van een herkansing in het voorlaatste leerjaar wordt het eindcijfer schriftelijk aan de kandidaat
      bekendgemaakt.

      6 Het eerste tot en met vierde lid zijn van overeenkomstige toepassing op de vakken waarin in een examenjaar
      deeleindexamen is afgelegd. De kandidaat die in een examenjaar zowel eindexamen als een of meer deeleindexamens
      aflegt, oefent het in het eerste lid bedoelde recht per examenjaar ten hoogste eenmaal uit.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0004593#Artikel48
    url: https://wetten.overheid.nl/BWBR0004593/2011-11-05#Artikel51
