  - number: '5'
    text: |-
      1 Indien een kandidaat zich ten aanzien van enig deel van het eindexamen dan wel ten aanzien van een aanspraak op
      ontheffing aan enige onregelmatigheid schuldig maakt of heeft gemaakt, dan wel zonder geldige reden afwezig is, kan
      de directeur maatregelen nemen.

      2 De maatregelen, bedoeld in het eerste lid, die afhankelijk van de aard van de onregelmatigheid ook in combinatie
      met elkaar genomen kunnen worden, zijn:

      a. het toekennen van het cijfer 1 voor een toets van het schoolexamen of het centraal examen,

      b. het ontzeggen van de deelname of de verdere deelname aan een of meer toetsen van het schoolexamen of het
      centraal examen,

      c. het ongeldig verklaren van een of meer toetsen van het reeds afgelegde deel van het schoolexamen of het centraal
      examen,

      d. het bepalen dat het diploma en de cijferlijst slechts kunnen worden uitgereikt na een hernieuwd examen in door
      de directeur aan te wijzen onderdelen.

      Indien het hernieuwd examen bedoeld in de vorige volzin betrekking heeft op een of meer onderdelen van het centraal
      examen legt de kandidaat dat examen af in een volgend tijdvak van het centraal examen.

      3 Het besluit waarbij een in het eerste lid bedoelde maatregel wordt genomen, wordt tegelijkertijd in afschrift
      toegezonden aan de inspectie en, indien de kandidaat minderjarig is, aan de wettelijke vertegenwoordigers van de
      kandidaat.

      4 De kandidaat kan tegen een beslissing van de directeur van een school voor voortgezet onderwijs in beroep gaan
      bij de door het bevoegd gezag van de school in te stellen commissie van beroep. Van de commissie van beroep mag de
      directeur geen deel uitmaken.

      5 In overeenstemming met [artikel 30a van de wet][ref1] wordt het beroep binnen vijf dagen nadat de beslissing
      aan de kandidaat is bekendgemaakt, schriftelijk ingesteld bij de commissie van beroep. De commissie stelt een
      onderzoek in en beslist binnen twee weken na ontvangst van het beroepsschrift, tenzij zij deze termijn gemotiveerd
      heeft verlengd met ten hoogste twee weken. De commissie stelt bij haar beslissing zo nodig vast op welke wijze
      de kandidaat alsnog in de gelegenheid zal worden gesteld het eindexamen geheel of gedeeltelijk af te leggen
      onverminderd het bepaalde in de laatste volzin van het tweede lid. De commissie deelt haar beslissing schriftelijk
      mede aan de kandidaat, aan de ouders, voogden of verzorgers van de kandidaat indien deze minderjarig is, aan de
      directeur en aan de inspectie.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel30a
    url: https://wetten.overheid.nl/BWBR0004593/2011-11-05#Artikel5
