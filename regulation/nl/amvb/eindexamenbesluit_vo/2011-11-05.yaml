  - number: '2'
    text: |-
      1 Het bevoegd gezag stelt de leerlingen van een school en de leerlingen van een afdeling voor havo in de
      gelegenheid ter afsluiting van de opleiding een eindexamen af te leggen.

      2 Het bevoegd gezag stelt de leerlingen van een instelling voor educatie en beroepsonderwijs in de gelegenheid in
      plaats van een eindexamen een of meer deeleindexamens af te leggen.

      3 Het bevoegd gezag kan tot het eindexamen toelaten kandidaten die niet als leerling van de school zijn
      ingeschreven.

      4 Het bevoegd gezag van een instelling voor educatie en beroepsonderwijs kan kandidaten als bedoeld in het derde
      lid eveneens in de gelegenheid stellen een of meer deeleindexamens aan de desbetreffende school af te leggen.

      5 Kandidaten als bedoeld in het derde lid, die worden toegelaten tot het eindexamen van een school voor voortgezet
      onderwijs, zijn behoudens het bepaalde in het zesde lid aan het bevoegd gezag een bedrag verschuldigd van € 567
      voor een volledig eindexamen.

      6 In afwijking van het bepaalde in het vijfde lid is een toelatingsbedrag niet verschuldigd door kandidaten die
      zijn ingeschreven bij een andere uit de openbare kas bekostigde school, - al dan niet in de zin van dit besluit -,
      afdeling of onderwijsinstelling en die aldaar geen eindexamen dan wel deeleindexamen afleggen.

      7 Het in het vijfde lid bedoelde bedrag kan bij regeling van Onze Minister worden gewijzigd voor zover de
      consumentenprijsindex daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0004593/2011-11-05#Artikel2
  - number: '3'
    text: |-
      1 De directeur en de examinatoren van een school voor voortgezet onderwijs nemen onder verantwoordelijkheid van het
      bevoegd gezag het eindexamen af.

      2 De directeur van een school voor voortgezet onderwijs wijst een van de personeelsleden van de school aan tot
      secretaris van het eindexamen.
    url: https://wetten.overheid.nl/BWBR0004593/2011-11-05#Artikel3
  - number: '4'
    text: |-
      1 Het eindexamen kan voor ieder vak bestaan uit een schoolexamen, uit een centraal examen dan wel uit beide.

      2 Het schoolexamen vwo, havo en vmbo omvat mede een maatschappelijke stage.

      3 Het schoolexamen vwo en havo omvat mede een profielwerkstuk. Het profielwerkstuk is een werkstuk, een presentatie
      daaronder begrepen, waarin op geïntegreerde wijze kennis, inzicht en vaardigheden aan de orde komen die van
      betekenis zijn in het desbetreffende profiel.

      4 Het profielwerkstuk heeft betrekking op één of meer vakken van het eindexamen. Ten minste één van deze vakken
      heeft een omvang van 400 uur of meer voor vwo en 320 uur of meer voor havo.

      5 Het schoolexamen vmbo voor zover het betreft de theoretische leerweg, genoemd in [artikel 10 van de wet][ref1],
      en de gemengde leerweg, genoemd in [artikel 10d van de wet][ref2], omvat mede een sectorwerkstuk. De tweede volzin
      van het tweede lid is van overeenkomstige toepassing. Het sectorwerkstuk heeft betrekking op een thema uit de
      sector waarin de leerling het onderwijs volgt.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
    url: https://wetten.overheid.nl/BWBR0004593/2011-11-05#Artikel4
