      1 Het eindexamen vmbo voor zover het betreft de basisberoepsgerichte leerweg, genoemd in
      [artikel 10b van de wet][ref1], omvat in elk geval:

      a. de vakken die het gemeenschappelijk deel ingevolge in [artikel 10b, vijfde lid, van de wet][ref2], omvat,

      b. de twee vakken die het sectordeel ingevolge [artikel 10b, zesde lid, van de wet][ref3], omvat,

      c. in het vrije deel een tot de sector behorend afdelingsvak, genoemd in
      [artikel 26h, eerste lid, van het Inrichtingsbesluit W.V.O][ref4] of een intrasectoraal
      of intersectoraal programma als bedoeld in [artikel 26j, eerste lid][ref5], of
      [artikel 26k, eerste lid, van het Inrichtingsbesluit W.V.O.][ref6], en

      d. de maatschappelijke stage.

      2 In afwijking van het eerste lid is de kandidaat in de sector economie ten aanzien van wie toepassing is gegeven
      aan [artikel 26n, tweede en derde lid, van het Inrichtingsbesluit W.V.O.][ref7], bij het eindexamen vrijgesteld
      van het vak Franse taal of het vak Duitse taal. In plaats hiervan omvat het eindexamen één van de vakken gekozen op
      grond van [artikel 26n, derde lid, van het Inrichtingsbesluit W.V.O.][ref8]

      3 Voor zover het betreft een leer-werktraject als bedoeld in [artikel 10b1 van de wet][ref9], omvat het eindexamen
      voor de leerling die dat traject heeft gevolgd, het vak Nederlandse taal, de maatschappelijke stage en het
      beroepsgerichte programma dat onderdeel is van het leerwerktraject. Bovendien kan de leerling eindexamen afleggen
      in de andere vakken van de basisberoepsgerichte leerweg, bedoeld in [artikel 10b van de wet][ref10], waarvan het
      bevoegd gezag op grond van [artikel 10b1, derde lid, van de wet][ref11] in voorkomend geval heeft beslist dat zij
      behoren tot het leer-werktraject van de leerling.

      4 In geval van toepassing van [artikel 10b, negende lid, onderdelen a en c, van de wet][ref12],
      dan wel [artikel 10b, negende lid, onderdeel d, van de wet][ref13] juncto
      [artikel 26h, tweede lid, van het Inrichtingsbesluit W.V.O.][ref14], zijn het eerste tot en met het derde lid van
      toepassing, met dien verstande dat het vervangen vak niet als extra vak als bedoeld in het vijfde lid, kan dienen.

      5 In aanvulling op de voorgeschreven vakken, bedoeld in het eerste lid, kan het eindexamen omvatten, voor zover nog
      niet gekozen:

      a. een vak als bedoeld in [artikel 10b, zesde lid, van de wet][ref15],

      b. het vak Friese taal en cultuur, genoemd in [artikel 26h, tweede lid, van het Inrichtingsbesluit W.V.O.][ref16],

      c. een vak dat op grond van het tweede lid onderdeel kan zijn van de basisberoepsgerichte leerweg,

      d. een algemeen vak dat behoort tot het eindexamen van de theoretische leerweg, de kaderberoepsgerichte leerweg of
      de gemengde leerweg, genoemd in respectievelijk de [artikelen 10][ref17], [10b][ref18] of [10d van de wet][ref19],
      of

      e. een vak als bedoeld in [artikel 13][ref20] of [14 van de wet][ref21].

      6 [Artikel 22, tweede lid][ref22], is van overeenkomstige toepassing.


