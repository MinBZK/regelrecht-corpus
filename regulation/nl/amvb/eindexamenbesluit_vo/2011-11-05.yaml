      1 Het eindexamen havo omvat:

      a. de vakken van het gemeenschappelijk deel van elk profiel, genoemd in
      [artikel 26c, eerste lid, van het Inrichtingsbesluit W.V.O.][ref1], daaronder tevens begrepen een profielwerkstuk,

      b. de vakken van het profieldeel, genoemd in
      [artikel 26c, tweede tot en met vijfde lid, van het Inrichtingsbesluit W.V.O.][ref2] en voor zover
      nodig wegens de in onderdeel c genoemde normatieve studielast, vakken van het vrije deel genoemd in
      [artikel 26b, zevende lid, van het Inrichtingsbesluit W.V.O.][ref3],

      c. ten minste één vak met een normatieve studielast van tenminste 320 uur van het vrije deel van elk profiel,
      genoemd in [artikel 26c, zesde lid, van het Inrichtingsbesluit W.V.O.][ref4], met dien verstande dat door het
      bevoegd gezag vast te stellen vakken onderdeel zijn van het eindexamen uitsluitend voor zover Onze Minister
      daarvoor goedkeuring heeft verleend, en

      d. de maatschappelijke stage.

      2 Ingeval van toepassing van [artikel 14, achtste lid, van de wet][ref5] is het eerste lid van overeenkomstige
      toepassing.

      3 In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een school voor havo bij het
      eindexamen vrijgesteld van de vakken waarvoor ontheffing of vrijstelling is verleend van het volgen van onderwijs op
      grond van [artikel 26e, eerste lid, respectievelijk zesde of zevende lid, van het Inrichtingsbesluit W.V.O][ref6].

      4 In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een instelling voor educatie en
      beroepsonderwijs, bij het eindexamen vrijgesteld van de vakken culturele en kunstzinnige vorming en lichamelijke
      opvoeding van het gemeenschappelijk deel en van de maatschappelijke stage.


