  - number: '54'
    text: |-
      1 Duplicaten van afgegeven diploma's, certificaten, bewijzen van ontheffing en cijferlijsten worden niet verstrekt.

      2 Een schriftelijke verklaring dat een in het eerste lid bedoeld document is afgegeven, welke verklaring dezelfde
      waarde heeft als dat document zelf, kan uitsluitend door Onze Minister worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0004593/2011-11-05#Artikel54
  - number: '55'
    text: |-
      1 De directeur kan toestaan dat een gehandicapte kandidaat het examen geheel of gedeeltelijk aflegt op een wijze
      die is aangepast aan de mogelijkheden van die kandidaat. In dat geval bepaalt de directeur de wijze waarop het
      examen zal worden afgelegd, met dien verstande dat aan de overige bepalingen in dit besluit wordt voldaan. Hij doet
      hiervan zo spoedig mogelijk mededeling aan de inspectie.

      2 Tenzij sprake is van een objectief waarneembare lichamelijke handicap, geldt ten aanzien van de in het eerste lid
      bedoelde aangepaste wijze van examineren dat:

      a. er een deskundigenverklaring is die door een ter zake deskundige psycholoog of orthopedagoog is opgesteld,

      b. de aanpassing voor zover betrekking hebbend op het centraal examen in ieder geval kan bestaan uit een verlenging
      van de duur van de desbetreffende toets van het centraal examen met ten hoogste 30 minuten, en

      c. een andere aanpassing slechts kan worden toegestaan voor zover daartoe in de onder a genoemde
      deskundigenverklaring ten aanzien van betrokkene een voorstel wordt gedaan dan wel indien de aanpassing aantoonbaar
      aansluit bij de begeleidingsadviezen, vermeld in die deskundigenverklaring.

      3 Het bevoegd gezag kan in verband met onvoldoende beheersing van de Nederlandse taal afwijken van de voorschriften
      gegeven bij of krachtens dit besluit, ten aanzien van een kandidaat die met inbegrip van het schooljaar waarin hij
      eindexamen aflegt, ten hoogste zes jaren onderwijs in Nederland heeft gevolgd en voor wie het Nederlands niet de
      moedertaal is. De in de eerste volzin bedoelde afwijking kan betrekking hebben op:

      a. het vak Nederlandse taal en literatuur;

      b. het vak Nederlandse taal;

      c. enig ander vak waarbij het gebruik van de Nederlandse taal van overwegende betekenis is.

      4 De in het derde lid bedoelde afwijking bestaat voor zover betrekking hebbend op het centraal examen slechts uit
      een verlenging van de duur van de desbetreffende toets van het centraal examen met ten hoogste 30 minuten en het
      verlenen van toestemming tot het gebruik van een verklarend woordenboek der Nederlandse taal.

      5 Van elke afwijking op grond van het derde lid wordt mededeling gedaan aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0004593/2011-11-05#Artikel55
  - number: '56'
    text: |-
      1 Zo spoedig mogelijk na de vaststelling van de eindcijfers in het voorlaatste leerjaar, voor zover van toepassing,
      en na de vaststelling van de definitieve uitslag stuurt het bevoegd gezag aan Onze Minister en aan de inspectie een
      opgave waarop voor de kandidaten voor zover van toepassing zijn vermeld:

      a. het profiel of de profielen danwel de leerweg waarop het examen betrekking heeft;

      b. de vakken waarin examen is afgelegd;

      c. de cijfers van het schoolexamen alsmede in voorkomend geval, het vak of de vakken waarop het profielwerkstuk
      betrekking heeft en de beoordeling en het thema van het sectorwerkstuk;

      d. de cijfers van het centraal examen;

      e. de eindcijfers;

      f. de uitslag van het eindexamen.

      2 Het eerste lid is niet van toepassing op een bevoegd gezag dat op
      grond van [artikel 103b, tweede lid, van de wet][ref1] of op grond van
      [artikel 2.3.6a, tweede lid, van de Wet educatie en beroepsonderwijs][ref2] examengegevens samen met het
      persoonsgebonden nummer verstrekt aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel103b
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2.3.6a
