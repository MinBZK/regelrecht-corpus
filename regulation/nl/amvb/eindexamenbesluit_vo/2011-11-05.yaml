preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs en Wetenschappen, mede namens Onze Minister van Landbouw en
    Visserij, van 16 januari 1989, nr. 88040519/3188, centrale directie Wetgeving en Juridische Zaken;

    Gelet op de artikelen 29, 30 en 60 van de Wet op het voortgezet onderwijs;

    Gehoord de Onderwijsraad (advies van 28 oktober 1988, nr. OR/1325 S);

    De Raad van State gehoord (advies van 4 april 1989, nr. W05.89 0025);

    Gezien het nader rapport van de Staatssecretaris van Onderwijs en Wetenschappen, mede namens Onze Minister van
    Landbouw en Visserij, van 16 juni 1989, nr. 89011 016/3188, centrale directie Wetgeving en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004593/2011-11-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

        - *algemene vakken:* vakken niet zijnde afdelingsvakken genoemd in [artikel 26h, eerste lid][ref1],
      respectievelijk bedoeld in [artikel 26i, eerste lid, van het Inrichtingsbesluit W.V.O.][ref2], en niet
      zijnde intrasectorale of intersectorale programma's als bedoeld in [artikel 26j, eerste lid][ref3], of
      [artikel 26k, eerste lid, van dat besluit][ref4];
        - *bevoegd gezag:* het bevoegd gezag, bedoeld in [artikel 1 van de wet][ref5], indien
      het een school voor voortgezet onderwijs betreft, en het bevoegd gezag, bedoeld in
      [artikel 1.1.1, onderdeel w, onder 1 en 2, van de Wet educatie en beroepsonderwijs][ref6], indien het een
      instelling voor educatie en beroepsonderwijs betreft;
        - *College voor examens:* College voor examens, genoemd in
      [artikel 2, eerste lid, van de Wet College voor examens][ref7];
        - *cspe:* centraal schriftelijk en praktisch examen in een beroepsgericht programma;
        - *deeleindexamen:* een examen in één of meer van de voor het eindexamen voorgeschreven
      vakken aan een opleiding voortgezet algemeen volwassenenonderwijs als bedoeld in
      [artikel 7.3.1, eerste lid, onder a, van de Wet educatie en beroepsonderwijs][ref8];
        - *directeur:* de rector of directeur van een school voor voortgezet onderwijs;
        - *eindexamen:* een examen ten minste in het geheel van de voorgeschreven vakken;
        - *eindexamen vmbo:* een eindexamen dat leidt tot een diploma vmbo voor zover het betreft de theoretische leerweg,
      de basisberoepsgerichte leerweg, de kaderberoepsgerichte leerweg of de gemengde leerweg;
        - *examencommissie vavo:* de in [artikel 7.4.11, tweede lid][ref9], juncto
      [artikel 7.4.5 van de Wet educatie en beroepsonderwijs][ref10] bedoelde examencommissie voor een opleiding vavo;
        - *examenstof:* de aan de kandidaat te stellen eisen;
        - *examinator:* degene die is belast met het afnemen van het examen in een vak;
        - *gecommitteerde:* een gecommitteerde als bedoeld in [artikel 29, tweede lid, van de wet][ref11] en
      [artikel 36][ref12] van dit besluit;
        - *havo:* hoger algemeen voortgezet onderwijs als bedoeld in [artikel 8 van de we][ref13]t;
        - *herkansing:* het opnieuw deelnemen aan een toets van het centraal examen of het schoolexamen;
        - *inspectie:* de inspectie, bedoeld in [artikel 1 van de Wet op het onderwijstoezicht][ref14];
        - *instelling voor educatie en beroepsonderwijs:* een instelling als bedoeld in
      [artikel 1.1.1, onderdeel b, van de Wet educatie en beroepsonderwijs][ref15], voor zover het betreft door die
      instelling verzorgde opleidingen vavo;
        - *kandidaat:* ieder die door het bevoegd gezag tot het eindexamen of deeleindexamen wordt toegelaten;
        - *kunstvakken:* de vakken behorende tot de beeldende vorming, alsmede muziek, dans en drama;
        - *leerling:* een leerling aan een school voor voortgezet onderwijs of een deelnemer aan een opleiding vavo;
        - *leerweg:* de basisberoepsgerichte leerweg, bedoeld in artikel 10b van de wet, de kaderberoepsgerichte leerweg,
      bedoeld in [artikel 10b van de wet][ref16], de gemengde leerweg, bedoeld in [artikel 10d van de wet][ref17] en de
      theoretische leerweg, bedoeld in [artikel 10 van de wet][ref18];
        - *maatschappelijke stage:* stage als bedoeld in [artikel 6f van de wet][ref19];
        - *mavo:* middelbaar algemeen voortgezet onderwijs als bedoeld in [artikel 9 van de wet][ref20];
        - *Onze Minister:* Onze Minister van Onderwijs, Cultuur en Wetenschap, en voor wat het landbouwonderwijs betreft,
      Onze Minister van Economische Zaken, Landbouw en Innovatie;
        - *opleiding vavo:* een opleiding voortgezet algemeen volwassenenonderwijs als bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel a, van de Wet educatie en beroepsonderwijs][ref21];
        - *profielwerkstuk:* het in [artikel 4][ref22] bedoelde profielwerkstuk;
        - *sector:* een in [artikel 10, derde lid][ref23], [artikel 10b, derde lid][ref24], of
      [artikel 10d, derde lid, van de wet][ref25] bedoelde sector;
        - *school:* een school voor vwo, een school voor havo, een school voor mavo, een school voor vbo of een instelling
      voor educatie en beroepsonderwijs, tenzij anders blijkt;
        - *schooljaar:* het tijdvak dat aanvangt op 1 augustus en eindigt op 31 juli
      van het daaropvolgende jaar, daaronder mede begrepen het studiejaar, bedoeld in
      [artikel 1.1.1, onderdeel r, van de Wet educatie en beroepsonderwijs][ref26];
        - *school voor voortgezet onderwijs:* een school voor vwo, een school voor havo, een school voor mavo, een school
      voor vbo;
        - *sectorwerkstuk:* het in [artikel 4][ref27] bedoelde sectorwerkstuk;
        - *toets:* een toets met schriftelijke of mondelinge vragen en opdrachten, of een praktische opdracht;
        - *vakken:* vakken, intrasectorale programma’s, intersectorale programma’s en andere programma-onderdelen;
        - *vakken behorende tot de beeldende vorming:* tekenen, handvaardigheid, textiele vormgeving, fotografie, film,
      audio-visuele vorming;
        - *vbo:* voorbereidend beroepsonderwijs als bedoeld in [artikel 10a van de wet][ref28];
        - *vmbo:* voorbereidend middelbaar beroepsonderwijs als bedoeld in [artikel 21 van de wet][ref29];
        - *vwo:* voorbereidend wetenschappelijk onderwijs als bedoeld in [artikel 7 van de wet][ref30];
        - *wet:* [Wet op het voortgezet onderwijs][ref31].

      2 Waar in dit besluit wordt gesproken van «directeur en de secretaris», wordt daaronder wat instellingen voor
      educatie en beroepsonderwijs betreft verstaan, de examencommissie vavo, tenzij anders blijkt.


