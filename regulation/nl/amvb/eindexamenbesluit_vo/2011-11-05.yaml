    text: |-
      1 Het eindexamen vmbo voor zover het betreft de gemengde leerweg, genoemd in [artikel 10d van de wet][ref1], omvat
      in elk geval:

      a. de vakken die het gemeenschappelijk deel ingevolge [artikel 10d, vijfde lid, van de wet][ref2], omvat,

      b. de twee vakken die het sectordeel ingevolge [artikel 10d, zesde lid, van de wet][ref3], omvat waaronder tevens
      begrepen een sectorwerkstuk,

      c. in het vrije deel een nog niet in het sectordeel gekozen algemeen vak, bedoeld onderscheidenlijk genoemd in
      [artikel 10d, zevende lid, onderdelen a en c, van de wet][ref4],

      d. een tot de sector behorend afdelingsvak, genoemd in
      [artikel 26h, eerste lid, van het Inrichtingsbesluit W.V.O][ref5] of een intrasectoraal
      of intersectoraal programma als bedoeld in [artikel 26j, eerste lid][ref6], of
      [artikel 26k, eerste lid, van het Inrichtingsbesluit W.V.O.][ref7], en

      e. de maatschappelijke stage.

      2 [Artikel 22, tweede lid][ref8], is van overeenkomstige toepassing.

      3 In geval van toepassing van [artikel 10d, negende lid, van de wet][ref9], zijn het eerste en tweede lid van
      toepassing, met dien verstande dat het vervangen vak niet als extra vak als bedoeld in het vierde lid, kan dienen.

      4 In aanvulling op de voorgeschreven vakken, bedoeld in het eerste lid, kan het eindexamen omvatten, voor zover nog
      niet gekozen, een vak als bedoeld in [artikel 10d, zevende lid, onderdelen a, b en c, van de wet][ref10], of als
      bedoeld in [artikel 13][ref11] of [14 van de wet][ref12].

      5 In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een school voor vmbo, voor
      zover het betreft de gemengde leerweg, bij het eindexamen vrijgesteld van de maatschappelijke stage op grond van
      [artikel 26n, vijfde lid, van het Inrichtingsbesluit WVO][ref13].


