  - number: '24'
    text: |-
      1 Het eindexamen vmbo voor zover het betreft de kaderberoepsgerichte leerweg, genoemd in
      [artikel 10b van de wet][ref1], omvat in elk geval:

      a. de vakken die het gemeenschappelijk deel ingevolge in [artikel 10b, vijfde lid, van de wet][ref2], omvat,

      b. de twee vakken die het sectordeel ingevolge [artikel 10b, zesde lid, van de wet][ref3], omvat,

      c. in het vrije deel een tot de sector behorend afdelingsvak, genoemd in
      [artikel 26h, eerste lid, van het Inrichtingsbesluit W.V.O][ref4] of een intrasectoraal
      of intersectoraal programma als bedoeld in [artikel 26j, eerste lid][ref5], of
      [artikel 26k, eerste lid, van het Inrichtingsbesluit W.V.O.][ref6], en

      d. de maatschappelijke stage.

      2 [Artikel 22, tweede lid][ref7], is van overeenkomstige toepassing.

      3 In geval van toepassing van [artikel 10b, negende lid, onderdeel b, van de wet][ref8]
      dan wel [artikel 10b, negende lid, onderdeel d, van de wet][ref9] juncto
      [artikel 26h, tweede lid, van het Inrichtingsbesluit W.V.O.][ref10], zijn het eerste en tweede lid van toepassing,
      met dien verstande dat het vervangen vak niet als extra vak als bedoeld in het vierde lid, kan dienen.

      4 In aanvulling op de voorgeschreven vakken, bedoeld in het eerste lid, kan het eindexamen omvatten, voor zover nog
      niet gekozen:

      a. een vak als bedoeld in [artikel 10b, zesde lid, van de wet][ref11],

      b. het vak Friese taal en cultuur, genoemd in [artikel 26h, tweede lid, van het Inrichtingsbesluit W.V.O.][ref12],

      c. een vak dat op grond van het tweede lid onderdeel kan zijn van de kaderberoepsgerichte leerweg,

      d. een algemeen vak dat behoort tot het eindexamen van de theoretische leerweg of de gemengde leerweg, genoemd in
      respectievelijk [artikel 10][ref13] of [artikel 10d van de wet][ref14], of

      e. een vak als bedoeld in [artikel 13][ref15] of [14 van de wet][ref16].

      5 In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een school voor vmbo, voor zover
      het betreft de kaderberoepsgerichte leerweg, bij het eindexamen vrijgesteld van de maatschappelijke stage op grond
      van [artikel 26n, vijfde lid, van het Inrichtingsbesluit WVO][ref17].


