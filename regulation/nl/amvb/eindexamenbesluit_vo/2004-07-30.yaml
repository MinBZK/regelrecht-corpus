    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: 26e
  - number: '12.5'
    text: |-
      In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een instelling voor educatie en
      beroepsonderwijs, bij het eindexamen vrijgesteld van het deelvak lichamelijke opvoeding 1 van het gemeenschappelijk
      deel.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel12
  - number: '12.6'
    text: |-
      In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een instelling voor educatie en
      beroepsonderwijs, en die in het bezit is van het diploma h.a.v.o., bij het eindexamen vrijgesteld van de volgende
