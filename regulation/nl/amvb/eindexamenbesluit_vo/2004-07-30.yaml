        artikel: '32'
        hoofdstuk: III
        afdeling: '2'
  - number: '32.2'
    text: |-
      Het schoolexamen v.w.o. in de deelvakken Franse taal en letterkunde 1 en Duitse taal en letterkunde 1 wordt
      afgesloten in het zesde leerjaar.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel32
  - number: '33'
    text: 'Voor de aanvang van het centraal examen maakt de directeur aan de kandidaat bekend, voorzover van toepassing:'
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel33
  - number: 33.a
    text: welke cijfers hij heeft behaald voor het schoolexamen,
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel33
  - number: 33.b
    text: de beoordeling van de vakken waarvoor geen cijfer wordt vastgesteld, en
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel33
  - number: 33.c
    text: de beoordeling van het profielwerkstuk of het sectorwerkstuk.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel33
  - number: '35.1'
    text: |-
      Het cijfer van het schoolexamen wordt uitgedrukt in een cijfer uit een schaal van cijfers lopende van 1 tot en
      met 10.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel35
  - number: '35.2'
    text: |-
      Indien in een vak tevens centraal examen wordt afgelegd, worden de in het eerste lid genoemde cijfers gebruikt met
      de daartussen liggende cijfers met 1 decimaal.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel35
  - number: '35.3'
    text: |-
      In afwijking van het eerste lid, worden het deelvak culturele en kunstzinnige vorming 1 en het deelvak lichamelijke
      opvoeding 1 uit het gemeenschappelijk deel van elk profiel, beoordeeld met «voldoende» of «goed». Deze beoordeling
      gaat uit van de mogelijkheden van de leerling en geschiedt op de grondslag van het genoegzaam afsluiten
      van de desbetreffende deelvakken, zoals blijkend uit het examendossier. De eerste en tweede volzin zijn van
      overeenkomstige toepassing op de kunstvakken en het vak lichamelijke opvoeding uit het gemeenschappelijk deel van
      elke leerweg.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel35
  - number: '35.4'
    text: |-
      In afwijking van het eerste lid wordt het profielwerkstuk beoordeeld met «voldoende» of «goed». Deze
      beoordeling geschiedt op de grondslag van het genoegzaam voltooien van het profielwerkstuk, zoals blijkend
      uit het examendossier. De eerste en tweede volzin zijn van overeenkomstige toepassing op het sectorwerkstuk.
      Het sectorwerkstuk wordt beoordeeld door ten minste twee examinatoren die de kandidaat hebben begeleid bij de
      totstandkoming van het sectorwerkstuk.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel35
  - number: 35b1.1
    text: |-
      Het bevoegd gezag kan bepalen dat de kandidaat die eindexamen of deeleindexamen aflegt, voor één of meer vakken het
      schoolexamen waarin geen centraal examen wordt afgenomen, opnieuw kan afleggen, met dien verstande dat het bevoegd
      gezag dit recht in elk geval verleent voor het vak maatschappijleer behorend tot het gemeenschappelijk deel van de
      leerwegen, indien de kandidaat voor dat vak een eindcijfer heeft behaald lager dan 6. Het herexamen omvat door het
      bevoegd gezag aangegeven onderdelen van het examenprogramma.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel35b1
  - number: 35b1.2
    text: |-
      Het bevoegd gezag stelt vast hoe het cijfer van het in het eerste lid bedoelde herexamen wordt bepaald. Het hoogste
      van de cijfers behaald bij het herexamen in een vak en bij het eerder afgelegde schoolexamen in dat vak geldt als
      het definitieve cijfer van het schoolexamen in dat vak.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel35b1
  - number: 35c
    text: |-
      Het schoolexamen bestaat uit een examendossier. Het examendossier is het geheel van de onderdelen
      van het schoolexamen zoals gedocumenteerd in een door het bevoegd gezag gekozen vorm. Het
      examendossier voor het v.m.b.o. omvat tevens de resultaten die de leerling heeft behaald voor
      de vakken, bedoeld in [artikel 26g, eerste lid, van het Inrichtingsbesluit W.V.O.][ref1] of
      [artikel 26i, tweede lid, van dat besluit][ref2], voor zover in die vakken geen eindexamen is afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel26g
      [ref2]: https://wetten.overheid.nl/BWBR0005946#Artikel26i
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: 26g
      - id: ref2
        bwb_id: BWBR0005946
        artikel: 26i
  - number: '36.1'
    text: |-
      De Informatie Beheer Groep, dan wel voor zover het landbouwonderwijs betreft Onze Minister van Landbouw,
      Natuurbeheer en Visserij, wijst voor elke school en voor elke instelling voor educatie en beroepsonderwijs,
      ten behoeve van het centraal examen een of meer gecommitteerden aan. De aanwijzing geldt tot de afloop van
      de herkansing. Indien de Informatie Beheer Groep er om verzoekt, stelt het bevoegd gezag gecommitteerden ter
      aanwijzing voor. De aanwijzing geldt voor het eerste en tweede tijdvak.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel36
  - number: '36.2'
    text: |-
      De gecommitteerden ontvangen uit ’s Rijks kas een vergoeding van de door hen gemaakte kosten volgens door Onze
      Minister te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel36
  - number: '36.3'
    text: |-
      Indien de Informatie Beheer Groep krachtens dit artikel een leraar van een school heeft aangewezen als
      gecommitteerde ten behoeve van een andere school, draagt het bevoegd gezag van de eerstgenoemde school er zorg
      voor, dat de leraar de uit die aanwijzing voortvloeiende verplichtingen nakomt.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel36
  - number: '36.4'
    text: |-
      In afwijking van het eerste lid, worden voor het praktisch gedeelte van het centraal examen v.m.b.o. geen
      gecommitteerden aangewezen.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel36
  - number: '37.1'
    text: Het centraal examen voor de scholen voor voortgezet onderwijs kent een eerste, tweede en derde tijdvak.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel37
  - number: '37.2'
    text: Het eerste en tweede tijdvak worden afgenomen in het laatste leerjaar.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel37
  - number: '37.3'
    text: Het derde tijdvak wordt aansluitend aan het laatste leerjaar afgenomen door de staatsexamencommissie.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel37
  - number: '37.4'
    text: |-
      Onze Minister kan vakken aanwijzen waarin wegens het zeer geringe aantal kandidaten, het eindexamen in het tweede
      tijdvak eveneens wordt afgenomen door de staatsexamencommissie.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel37
  - number: '37.5'
    text: |-
      Bij toepassing van het derde of vierde lid, leveren de kandidaten de opgaven, de door hen gemaakte aantekeningen
      alsmede andere door hen gemaakte stukken in bij een van degenen die toezicht houden. De voorzitter van de
      staatsexamencommissie bepaalt, in welke gevallen wordt afgeweken van de eerste volzin, alsmede in welke gevallen
      en op welk tijdstip de opgaven, de aantekeningen en de andere stukken, bedoeld in die volzin, aan de kandidaten
      worden teruggegeven.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel37
  - number: '38.1'
    text: |-
      De directeur deelt jaarlijks voor 1 november aan de Informatie Beheer Groep mede hoeveel kandidaten in elk vak aan
      het centraal examen in het eerste tijdvak zullen deelnemen.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel38
  - number: '38.2'
    text: |-
      De directeur zendt jaarlijks ten minste drie dagen voor de aanvang van de centrale examens in het eerste tijdvak,
      aan de inspectie een lijst waarop voor iedere kandidaat vermeld staat in welke vakken hij centraal examen zal
      afleggen en waarop is aangegeven welke cijfers de kandidaat voor het schoolexamen heeft behaald. Voor de aanvang
      van het tweede tijdvak worden een lijst met de kandidaten, de in het eerste tijdvak door die kandidaten behaalde
      cijfers, de, voor zover van toepassing, alsnog behaalde cijfers voor het schoolexamen, alsmede een overzicht van
      het vak of de vakken waarin elke kandidaat examen zal afleggen, aan de inspectie gezonden.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel38
  - number: '38.3'
    text: |-
      Indien een examenprogramma differentiaties kent als bedoeld in [artikel 7, derde lid][ref1], kan een kandidaat per
      tijdvak in niet meer differentiaties centraal examen afleggen dan volgens het desbetreffende programma is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel7
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '7'
        hoofdstuk: II
  - number: '39.1'
    text: 'Onze Minister stelt een centrale examencommissie vaststelling opgaven in. Deze commissie heeft als taak:'
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel39
  - number: 39.1.a
    text: |-
      het vaststellen van de dagen en uren waarop de centrale examens in de verschillende tijdvakken aanvangen en waarop
      de toetsen van het centraal examen worden gehouden;
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel39
  - number: 39.1.b
    text: het tot stand brengen van de opgaven van de centrale examens;
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel39
  - number: 39.1.c
    text: het vaststellen van de opgaven van de centrale examens;
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel39
  - number: 39.1.d
    text: het tot stand brengen van de beoordelingsnormen voor de centrale examens;
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel39
  - number: 39.1.e
    text: het vaststellen van de beoordelingsnormen voor de centrale examens;
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel39
  - number: 39.1.f
    text: het geven van regels voor het bepalen van een score, voortvloeiend uit de beoordeling;
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel39
  - number: 39.1.g
    text: het geven van regels voor de omzetting van de scores in cijfers voor de centrale examens;
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel39
  - number: 39.1.h
    text: |-
      het geven van regels met betrekking tot de hulpmiddelen die gebruikt mogen worden bij het maken van de opgaven van
      de centrale examens;
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel39
  - number: 39.1.i
    text: het uitoefenen van andere door Onze Minister opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel39
  - number: '39.2'
    text: |-
      De commissie, bedoeld in het eerste lid, kan bepalen dat een toets wordt afgenomen op een tijdstip dat is gelegen
      voor de aanvang van het eerste tijdvak.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel39
  - number: '39.3'
    text: |-
      Onze Minister geeft regels voor de vergoeding van de kosten en voor de beloning van de leden van de centrale
      examencommissie vaststelling opgaven.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel39
  - number: '40.1'
    text: |-
      De Informatie Beheer Groep zorgt ervoor dat de opgaven, de beoordelingsnormen en de door de commissie gegeven
      regels, bedoeld in [artikel 39][ref1] met uitzondering van de in het eerste lid, onder *g* en *h*, bedoelde regels,
      tijdig worden gedrukt en verzonden aan de directeur van de school.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel39
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '39'
        hoofdstuk: IV
  - number: '40.2'
    text: |-
      De directeur zorgt ervoor, dat de opgaven voor het centraal examen geheim blijven tot de aanvang van de toets
      waarbij deze opgaven aan de kandidaten worden voorgelegd. De commissie, bedoeld in [artikel 39][ref1], kan opgaven
      aanwijzen waarop de eerste volzin niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel39
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '39'
        hoofdstuk: IV
  - number: '40.3'
    text: |-
      Tijdens een toets van het centraal examen worden aan de kandidaten geen mededelingen van welke aard ook, aangaande
      de opgaven gedaan, uitgezonderd mededeling van door de commissie, bedoeld in [artikel 39][ref1], vastgestelde
      errata.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel39
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '39'
        hoofdstuk: IV
  - number: '40.4'
    text: De directeur draagt er zorg voor dat het nodige toezicht bij het centraal examen wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel40
  - number: '40.5'
    text: |-
      Zij die toezicht hebben gehouden, maken een proces-verbaal op. Zij leveren dit in bij de directeur samen met het
      gemaakte examenwerk.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel40
  - number: '40.6'
    text: |-
      Een kandidaat die te laat komt, mag tot uiterlijk een half uur na de aanvang van de toets tot die toets worden
      toegelaten.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel40
  - number: '40.7'
    text: |-
      De aan de kandidaten voorgelegde opgaven voor een toets van het centraal examen blijven in het examenlokaal tot het
      einde van die toets.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel40
  - number: '40.8'
    text: |-
      Bij ministeriële regeling kan ten aanzien van een of meer zittingen worden bepaald dat de kandidaten de opgaven, de
      door hen gemaakte aantekeningen alsmede andere door hen gemaakte stukken inleveren bij een van degenen die toezicht
      houden. Bij die regeling wordt bepaald wanneer de opgaven, de aantekeningen en de andere stukken, bedoeld in de
      eerste volzin, aan de kandidaten worden teruggegeven.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel40
  - number: '41.1'
    text: |-
      De directeur doet het gemaakte werk van het centraal examen met een exemplaar van de opgaven en met het proces-
      verbaal van het examen toekomen aan de examinator in het desbetreffende vak. De examinator beoordeelt het werk zo
      spoedig mogelijk en past daarbij de in [artikel 39, eerste lid, onderdeel e][ref1], bedoelde beoordelingsnormen
      toe. De examinator drukt zijn beoordeling uit in de score, bedoeld in [artikel 39, eerste lid, onderdeel f][ref2].
      De examinator zendt de score en het beoordeelde werk aan de directeur.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel39
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '39'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '39'
        hoofdstuk: IV
  - number: '41.2'
    text: |-
      De directeur doet de van de examinator ontvangen stukken met een exemplaar van de opgaven, de beoordelingsnormen,
      het proces-verbaal en de regels voor het bepalen van de score, bedoeld in het eerste lid, onverwijld aan de
      betrokken gecommitteerde dan wel de tweede examinator, bedoeld in [artikel 41a, tweede lid][ref1] toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel41a
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: 41a
        hoofdstuk: IV
  - number: '41.3'
    text: |-
      De gecommitteerde dan wel de tweede examinator, bedoeld in [artikel 41a, tweede lid][ref1] beoordeelt het werk zo
      spoedig mogelijk en past daarbij de in [artikel 39, eerste lid, onderdeel e][ref2], bedoelde beoordelingsnormen en
      de in [artikel 39, eerste lid, onderdeel f][ref3], bedoelde regels voor het bepalen van de score toe.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel41a
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0004593#Artikel39
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: 41a
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '39'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0004593
        artikel: '39'
        hoofdstuk: IV
  - number: '41.4'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven voor de toepassing van het eerste tot en met
      derde lid.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel41
  - number: '41.5'
    text: |-
      Onze Minister kan bepalen dat in verband met de aard van de opgaven, ter vermijding van overbelasting van de
      gecommitteerden dan wel ter versnelling van de examenprocedure wordt afgeweken van het eerste tot en met vierde lid
      en van [artikel 42][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel42
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '42'
        hoofdstuk: IV
  - number: 41a.1
    text: |-
      De directeur draagt er zorg voor dat bij het maken van het praktisch gedeelte van het centraal examen van
      een eindexamen v.m.b.o., de examinator in het desbetreffende vak of programma aanwezig is. De examinator
      beoordeelt de prestaties tijdens het maken van de praktijkopgaven en legt zijn bevindingen van de
      verrichtingen van de kandidaat schriftelijk vast, volgens daartoe door de in [artikel 39][ref1] bedoelde
      commissie gegeven richtlijnen. De examinator beoordeelt het werk zo spoedig mogelijk en past daarbij de in
      [artikel 39, eerste lid, onderdeel e][ref2], bedoelde beoordelingsnormen toe. De examinator drukt zijn beoordeling
      uit in de score, bedoeld in [artikel 39, eerste lid, onderdeel f][ref3]. De examinator zendt de score en voor zover
      mogelijk het beoordeelde werk aan de directeur.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0004593#Artikel39
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '39'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '39'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0004593
        artikel: '39'
        hoofdstuk: IV
  - number: 41a.2
    text: |-
      Voor het praktisch gedeelte van het centraal examen v.m.b.o. vindt de beoordeling tevens plaats door een tweede
      examinator. De tweede examinator kan een deskundige als bedoeld in [artikel 29, tweede lid, van de wet][ref1] of
      een andere examinator van de school zijn. De tweede examinator beoordeelt het resultaat van de praktijkopgaven,
      alsmede de verrichtingen van de kandidaat zoals blijkend uit de in het eerste lid bedoelde schriftelijke
      vastlegging daarvan. De directeur overhandigt de tweede examinator daartoe een exemplaar van de opgaven, de
      beoordelingsnormen, het proces-verbaal, alsmede de regels voor het bepalen van de score, bedoeld in het eerste lid.
      [Artikel 41, vierde en vijfde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel41
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '41'
        hoofdstuk: IV
  - number: '42.1'
    text: |-
      De examinator en de gecommitteerde dan wel de tweede examinator, bedoeld in [artikel 41a, tweede lid][ref1] stellen
      in onderling overleg de score voor het centraal examen vast. Komen zij daarbij niet tot overeenstemming, dan
      stellen zij de score vast op het rekenkundig gemiddelde van de twee scores, in voorkomend geval afgerond op het
      naasthogere gehele getal.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel41a
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: 41a
        hoofdstuk: IV
  - number: '42.2'
    text: |-
      De directeur stelt het cijfer voor het centraal examen in een vak vast op grond van de in het eerste lid bedoelde
      score en met inachtneming van [artikel 39, eerste lid, onderdeel g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel39
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '39'
        hoofdstuk: IV
  - number: '43.1'
    text: |-
      Indien het centraal examen naar het oordeel van de inspectie niet op regelmatige wijze heeft plaatsgehad kan zij
      besluiten dat het geheel of gedeeltelijk voor een of meer kandidaten opnieuw wordt afgenomen.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel43
  - number: '43.2'
    text: |-
      De inspectie verzoekt de commissie, bedoeld in [artikel 39, eerste lid][ref1], nieuwe opgaven vast te stellen en
      bepaalt op welke wijze en door wie het examen zal worden afgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel39
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '39'
        hoofdstuk: IV
  - number: '44'
    text: |-
      Indien door onvoorziene omstandigheden het centraal examen in één of meer vakken aan één of meer scholen niet op de
      voorgeschreven wijze kan worden afgenomen, beslist Onze Minister hoe alsdan moet worden gehandeld.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel44
  - number: '45.1'
    text: |-
      Indien een kandidaat om een geldige reden ter beoordeling van de directeur is verhinderd bij één of meer toetsen
      in het eerste tijdvak tegenwoordig te zijn, wordt hem in het tweede tijdvak de gelegenheid gegeven het centraal
      examen op ten hoogste twee toetsen te voltooien. Indien [artikel 37, vierde lid][ref1], toepassing vindt, wordt
      gelegenheid gegeven het centraal examen op meer dan twee toetsen te voltooien, afhankelijk van de feitelijke
      mogelijkheden.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel37
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '37'
        hoofdstuk: IV
  - number: '45.2'
    text: |-
      Indien een kandidaat in het tweede tijdvak evenzeer verhinderd is, of wanneer hij het centraal examen in het
      tweede tijdvak niet kan voltooien, wordt hij in de gelegenheid gesteld in het derde tijdvak ten overstaan van de
      staatsexamencommissie zijn eindexamen te voltooien.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel45
  - number: '45.3'
    text: |-
      De kandidaat meldt zich zo spoedig mogelijk door tussenkomst van de directeur aan bij de voorzitter van de
      desbetreffende staatsexamencommissie. In dat geval deelt de directeur aan de commissie mede, wanneer dat zich
      voordoet, dat ten behoeve van de kandidaat toepassing is gegeven aan [artikel 55][ref1], eerste, tweede dan wel
      derde lid, en waaruit deze toepassing bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel55
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '55'
        hoofdstuk: VI
  - number: '45.4'
    text: Na afloop van het derde tijdvak deelt de staatsexamencommissie het resultaat mede aan de directeur.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel45
  - number: '47.1'
    text: |-
      Het eindcijfer voor alle vakken van het eindexamen wordt uitgedrukt in een geheel cijfer uit de reeks 1 tot en
      met 10.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel47
  - number: '47.2'
    text: |-
      De directeur bepaalt het eindcijfer op het rekenkundig gemiddelde van het cijfer voor het schoolexamen en het
      cijfer voor het centraal examen. Voor de in [artikel 10b van de wet][ref1] genoemde basisberoepsgerichte leerweg
      geldt in afwijking van de eerste volzin dat voor de bepaling van het eindcijfer het cijfer voor het schoolexamen
      tweemaal wordt meegerekend, en het cijfer voor het centraal examen éénmaal. Indien de uitkomst van de berekening,
      bedoeld in de eerste of tweede volzin, niet een geheel getal is, wordt dat getal indien het eerste cijfer achter de
      komma een 4 of lager is, naar beneden afgerond en indien dat cijfer een 5 of hoger is, naar boven afgerond.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
  - number: '47.3'
    text: Indien in een vak alleen een schoolexamen is gehouden is het cijfer voor het schoolexamen tevens het eindcijfer.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel47
  - number: '48.1'
    text: |-
      De directeur en de secretaris van het eindexamen stellen in geval van een eindexamen de uitslag vast met
      inachtneming van [artikel 49][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel49
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '49'
        hoofdstuk: V
  - number: '48.2'
    text: De uitslag luidt «geslaagd voor het eindexamen» of «afgewezen voor het eindexamen».
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel48
  - number: '48.3'
    text: |-
      Indien dat nodig is om de kandidaat te laten slagen betrekken de directeur en de secretaris van het eindexamen een
      of meer eindcijfers van de vakken niet bij de bepaling van de definitieve uitslag. De overgebleven vakken dienen
      een eindexamen te vormen.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel48
  - number: '48.4'
    text: |-
      Met het afleggen van het eindexamen in enig jaar aan een instelling voor educatie en beroepsonderwijs wordt
      gelijkgesteld het in dat jaar afleggen van examen in een of meer vakken aan die instelling met het oogmerk, in
      dat jaar het diploma te behalen door de combinatie met het overleggen door de desbetreffende kandidaat aan de
      examencommissie v.a.v.o. van:
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel48
  - number: 48.4.a
    text: een in artikel 52, eerste lid, bedoelde cijferlijst van een school die is uitgereikt in een eerder jaar;
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel48
  - number: 48.4.b
    text: |-
      een in artikel 52, eerste lid, bedoelde cijferlijst, of een in [artikel 53, tweede lid][ref1], bedoeld certificaat,
      afgegeven door een andere instelling voor educatie en beroepsonderwijs;


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel53
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '53'
        hoofdstuk: V
  - number: 48.4.c
    text: |-
      een cijferlijst als bedoeld in [artikel 30, eerste of tweede lid][ref1], of
      [artikel 31, eerste lid, van het Besluit staatsexamens vwo-havo-mavo 2000][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel31
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0011538
        artikel: '31'
  - number: 48.4.d
    text: |-
      een of meer bewijzen van vrijstelling als bedoeld in [artikel 10, vierde lid][ref1], van dit besluit, of als
      bedoeld in [artikel 11, vierde lid, van het Besluit staatsexamens vwo-havo-mavo 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel11
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '10'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0011538
        artikel: '11'
  - number: '48.5'
    text: |-
      Cijferlijsten worden uitsluitend bij de vaststelling van de uitslag betrokken, indien na het jaar waarin zij zijn
      vastgesteld, nog geen 10 jaren zijn verstreken. Vrijstellingsbewijzen worden uitsluitend bij de vaststelling van
      de uitslag betrokken indien na het jaar waarin het onderliggende diploma, getuigschrift of ander bewijsstuk is
      vastgesteld, nog geen 10 jaren zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel48
  - number: '48.6'
    text: |-
      De kandidaat toont in voorkomend geval ten genoegen van de directeur aan dat hij recht heeft op
      een vrijstelling ingevolge [de artikelen 11][ref1], [12][ref2], [13][ref3], [22][ref4], [23][ref5],
      [24][ref6] of 25, of ingevolge [artikel 9][ref7], van dit besluit, dan wel als bedoeld in
      [artikel 10 van het Besluit staatsexamens vwo-havo-mavo 2000][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0004593#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0004593#Artikel22
      [ref5]: https://wetten.overheid.nl/BWBR0004593#Artikel23
      [ref6]: https://wetten.overheid.nl/BWBR0004593#Artikel24
      [ref7]: https://wetten.overheid.nl/BWBR0004593#Artikel9
      [ref8]: https://wetten.overheid.nl/BWBR0011538#Artikel10
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '11'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '12'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0004593
        artikel: '13'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0004593
        artikel: '22'
        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0004593
        artikel: '23'
        hoofdstuk: II
      - id: ref6
        bwb_id: BWBR0004593
        artikel: '24'
        hoofdstuk: II
      - id: ref7
        bwb_id: BWBR0004593
        artikel: '9'
        hoofdstuk: II
      - id: ref8
        bwb_id: BWBR0011538
        artikel: '10'
  - number: '48.7'
    text: |-
      De directeur vergewist zich ervan dat het eindexamen de in de [artikelen 11][ref1], [12][ref2],[13][ref3],
      [22][ref4], [23][ref5], [24][ref6] of 25 voorgeschreven vakken omvat.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0004593#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0004593#Artikel22
      [ref5]: https://wetten.overheid.nl/BWBR0004593#Artikel23
      [ref6]: https://wetten.overheid.nl/BWBR0004593#Artikel24
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '11'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '12'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0004593
        artikel: '13'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0004593
        artikel: '22'
        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0004593
        artikel: '23'
        hoofdstuk: II
      - id: ref6
        bwb_id: BWBR0004593
        artikel: '24'
        hoofdstuk: II
  - number: '48.8'
    text: |-
      Indien de kandidaat eindexamen heeft afgelegd en in datzelfde jaar deelstaatsexamen heeft afgelegd of
      deeleindexamen aan een instelling voor educatie en beroepsonderwijs, worden de met het deelstaatsexamen
      respectievelijk deeleindexamen behaalde cijfers, indien de kandidaat daarom tijdig en schriftelijk heeft verzocht,
      betrokken bij de uitslagbepaling.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel48
  - number: '49.1'
    text: 'De kandidaat die eindexamen v.m.b.o. heeft afgelegd, is geslaagd indien hij:'
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel49
  - number: 49.1.a
    text: |-
      voor ten hoogste één van zijn examenvakken het eindcijfer 5 heeft behaald en voor zijn overige examenvakken een 6
      of hoger, of
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel49
  - number: 49.1.b
    text: |-
      voor ten hoogste één van zijn examenvakken het eindcijfer 4 heeft behaald en voor zijn overige examenvakken een 6
      of hoger waarvan ten minste één 7 of hoger, of
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel49
  - number: 49.1.c
    text: |-
      voor twee van zijn examenvakken het eindcijfer 5 heeft behaald en voor zijn overige examenvakken een 6 of hoger
      waarvan ten minste één 7 of hoger.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel49
  - number: 49.1a
    text: |-
      Voor de toepassing van het eerste lid, onderdelen a, b en c, wordt het eindcijfer van het afdelingsvak of
      intrasectorale programma in de basisberoepsgerichte en de kaderberoepsgerichte leerweg meegerekend als twee
      eindcijfers.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel49
  - number: '49.2'
    text: |-
      In aanvulling op het eerste lid geldt tevens dat voor de vakken lichamelijke opvoeding en het kunstvak uit het
      gemeenschappelijk deel en in de gemengde en de theoretische leerweg voor het sectorwerkstuk de kwalificatie
      «voldoende» of «goed» is behaald.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel49
  - number: 49.2a
    text: |-
      In afwijking van het eerste en tweede lid, is de kandidaat die eindexamen v.m.b.o. heeft gelegd ter afsluiting
      van een leerwerktraject als bedoeld in [artikel 10b1 van de wet][ref1], geslaagd indien hij zowel voor het
      vak Nederlandse taal als voor het beroepsgerichte programma het eindcijfer 6 of hoger heeft behaald. Indien de
      vakken waarin examen is afgelegd, tezamen een eindexamen vormen van de basisberoepsgerichte leerweg, bedoeld in
      [artikel 10b van de wet][ref2], zijn het eerste lid, lid 1a en het tweede lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b1
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b1
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b
  - number: '49.3'
    text: 'De kandidaat die eindexamen v.w.o. of h.a.v.o. heeft afgelegd, is geslaagd indien hij:'
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel49
  - number: 49.3.a
    text: voor al zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer heeft behaald,
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel49
  - number: 49.3.b
    text: |-
      voor één van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 4 of 5 en voor de overige vakken
      waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer heeft behaald, dan wel
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel49
  - number: 49.3.c
    text: |-
      voor twee van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 heeft behaald dan wel voor één
      van de vakken waarvoor een eindcijfer is vastgesteld als eindcijfer 4 en voor één van deze vakken als eindcijfer
      5 heeft behaald, en voor de overige vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer heeft
      behaald, met dien verstande dat van deze vakken waarvoor als eindcijfer 4 of 5 is behaald, niet meer dan één vak
      het profieldeel betreft.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel49
  - number: '49.4'
    text: |-
      In aanvulling op het derde lid geldt dat het profielwerkstuk, en bij scholen voor v.w.o. en h.a.v.o. bovendien de
      deelvakken culturele en kunstzinnige vorming 1 en lichamelijke opvoeding 1 van het gemeenschappelijk deel van elk
      profiel, moeten zijn beoordeeld als «voldoende» of «goed».
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel49
  - number: '49.5'
    text: |-
      Zodra de eindcijfers en indien mogelijk de uitslag is vastgesteld, maakt de directeur deze schriftelijk aan iedere
      kandidaat bekend, onder mededeling van het in [artikel 51][ref1] bepaalde. De uitslag is de definitieve uitslag
      indien [artikel 51, eerste lid][ref2], geen toepassing vindt.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel51
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '51'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '51'
        hoofdstuk: V
  - number: '51.1'
    text: |-
      De kandidaat heeft voor één vak waarin hij reeds examen heeft afgelegd, nadat ingevolge
      [artikel 49, vijfde lid][ref1], de eindcijfers zijn bekendgemaakt, het recht om in het tweede tijdvak of, indien
      [artikel 45, eerste lid][ref2], van toepassing is, in het derde tijdvak, opnieuw deel te nemen aan het centraal
      examen of aan het schriftelijk gedeelte van het centraal examen in een beroepsgericht programma, met dien verstande
      dat indien het betreft het eindexamen van de basis- of kaderberoepsgerichte leerweg in het v.m.b.o., dit recht
      eveneens bestaat voor het praktisch gedeelte van het centraal examen in een beroepsgericht programma, af te nemen
      door het bevoegd gezag aansluitend aan het eerste tijdvak of in het tweede tijdvak. De herkansing van het praktisch
      gedeelte van het centraal examen bestaat uit het opnieuw afleggen van deze toets of van een of meer onderdelen
      daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel45
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '49'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '45'
        hoofdstuk: IV
  - number: '51.2'
    text: |-
      De kandidaat stelt de directeur voor een door deze laatste te bepalen dag en tijdstip schriftelijk in kennis van
      gebruikmaking van het in het eerste lid bedoelde recht.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel51
  - number: '51.3'
    text: |-
      Het hoogste van de cijfers behaald bij de herkansing en bij het eerder afgelegde centraal examen geldt als
      definitief cijfer voor het centraal examen.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel51
  - number: '51.4'
    text: |-
      Na afloop van de herkansing wordt de uitslag definitief vastgesteld met overeenkomstige toepassing van
      [artikel 48][ref1] en wordt deze schriftelijk aan de kandidaat bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel48
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '48'
        hoofdstuk: V
  - number: '51.5'
    text: |-
      Het eerste tot en met vierde lid zijn van overeenkomstige toepassing op de vakken waarin in een examenjaar
      deeleindexamen is afgelegd. De kandidaat die in een examenjaar zowel eindexamen als een of meer deeleindexamens
      aflegt, oefent het in het eerste lid bedoelde recht per examenjaar ten hoogste eenmaal uit.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel51
  - number: '52.1'
    text: |-
      De directeur reikt op grond van de definitieve uitslag aan elke kandidaat die eindexamen heeft afgelegd, een
      cijferlijst uit waarop voor zover van toepassing zijn vermeld:
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel52
  - number: 52.1.a
    text: de cijfers voor het schoolexamen en de cijfers voor het centraal examen,
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel52
  - number: 52.1.b
    text: de vakken en het onderwerp of de titel van het profielwerkstuk, alsmede de beoordeling van het profielwerkstuk,
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel52
  - number: 52.1.c
    text: het thema van het sectorwerkstuk, alsmede de beoordeling van het sectorwerkstuk,
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel52
  - number: 52.1.d
    text: |-
      de beoordeling van de deelvakken culturele en kunstzinnige vorming 1 en lichamelijke opvoeding 1 in v.w.o. en
      h.a.v.o.,
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel52
  - number: 52.1.e
    text: |-
      de beoordeling van het kunstvak en het vak lichamelijke opvoeding uit het gemeenschappelijk deel van de leerweg in
      m.a.v.o. en v.b.o.,
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel52
  - number: 52.1.f
    text: |-
      volgens welke differentiatie als bedoeld in [artikel 7, derde lid][ref1], is geëxamineerd,


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel7
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '7'
        hoofdstuk: II
  - number: 52.1.g
    text: de eindcijfers voor de examenvakken, alsmede
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel52
  - number: 52.1.h
    text: de uitslag van het eindexamen.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel52
  - number: '52.2'
    text: |-
      De directeur reikt op grond van de definitieve uitslag aan elke voor het eindexamen geslaagde kandidaat,
      daaronder mede begrepen de kandidaat die zijn eindexamen met gunstig gevolg heeft voltooid ten overstaan van de
      staatsexamencommissie, een diploma uit, waarop het profiel of de profielen zijn vermeld die bij de uitslag zijn
      betrokken. Op het dipoma v.m.b.o. is de leerweg vermeld die bij de uitslag is betrokken.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel52
  - number: '52.3'
    text: |-
      Indien een kandidaat in meer vakken examen heeft afgelegd dan in de vakken die ten minste samen een eindexamen
      vormen, worden de vakken die niet bij de bepaling van de uitslag zijn betrokken, op de cijferlijst vermeld, tenzij
      de kandidaat daartegen bedenkingen heeft geuit.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel52
  - number: '52.4'
    text: Onze Minister stelt het model van de cijferlijst vast.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel52
  - number: '52.5'
    text: |-
      De deelvakken culturele en kunstzinnige vorming 1, lichamelijke opvoeding 1, het vak lichamelijke opvoeding
      en de vakken behorende tot de beeldende vorming, muziek, dans of drama van het gemeenschappelijk deel,
      waarvoor de kandidaat die het eindexamen aflegt aan een instelling voor educatie en beroepsonderwijs,
      ingevolge [artikel 11, vierde lid][ref1], [artikel 12, vijfde lid][ref2], [artikel 13, vierde lid][ref3],
      of [artikel 22, vierde lid][ref4], is vrijgesteld, worden niet vermeld op de cijferlijst. Andere vakken
      waarvoor de kandidaat is vrijgesteld bij het examen, worden zonder vermelding van een cijfer vermeld op
      de cijferlijst, behalve in geval van vrijstellingen als bedoeld in [artikel 9][ref5] van dit besluit en
      [10 van het Besluit staatsexamens vwo-havo-mavo 2000][ref6], die wel leiden tot vermelding van een cijfer.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0004593#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0004593#Artikel22
      [ref5]: https://wetten.overheid.nl/BWBR0004593#Artikel9
      [ref6]: https://wetten.overheid.nl/BWBR0011538#Artikel10
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '11'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '12'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0004593
        artikel: '13'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0004593
        artikel: '22'
        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0004593
        artikel: '9'
        hoofdstuk: II
      - id: ref6
        bwb_id: BWBR0011538
        artikel: '10'
  - number: '52.6'
    text: De directeur en de secretaris van het eindexamen tekenen de diploma's en de cijferlijsten.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel52
  - number: '52.7'
    text: |-
      Indien de kandidaat in een bepaald jaar is geslaagd voor het eindexamen, draagt de directeur er op verzoek
      van de kandidaat zorg voor dat de behaalde cijfers voor de vakken waarin in datzelfde jaar deeleindexamen of
      deelstaatsexamen is afgelegd, worden vermeld op de cijferlijst.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel52
  - number: '52.8'
    text: |-
      De directeur reikt aan de kandidaat van een school voor m.a.v.o. of een scholengemeenschap die in elk geval een
      school voor m.a.v.o. omvat, die met goed gevolg het examen v.m.b.o. in de gemengde leerweg heeft afgelegd en
      bovendien examen heeft afgelegd in het algemeen vak en met het meetellen van dat vak voldoet aan [artikel 49][ref1]
      voor zover het betreft de theoretische leerweg, op diens verzoek het diploma v.m.b.o. in de theoretische leerweg
      uit.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel49
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '49'
        hoofdstuk: V
  - number: '53.1'
    text: |-
      De examencommissie v.a.v.o. reikt aan de kandidaat die deeleindexamen heeft afgelegd aan een instelling voor
      educatie en beroepsonderwijs, een cijferlijst uit waarop zijn vermeld, voor zover van toepassing:
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel53
  - number: 53.1.a
    text: de cijfers voor het schoolexamen en het centraal examen,
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel53
  - number: 53.1.b
    text: de vakken en het onderwerp of de titel van het profielwerkstuk, alsmede de beoordeling van het profielwerkstuk,
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel53
  - number: 53.1.c
    text: het thema alsmede de beoordeling van het sectorwerkstuk, en
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel53
  - number: 53.1.d
    text: de eindcijfers voor de examenvakken.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel53
  - number: '53.2'
    text: |-
      De examencommissie v.a.v.o. reikt aan de in het eerste lid bedoelde kandidaat, alsmede aan de kandidaat aan wie
      op grond van de definitieve uitslag niet op grond van 52, tweede lid, een diploma kan worden uitgereikt, een
      certificaat uit, waarop zijn vermeld, voor zover van toepassing:
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel53
  - number: 53.2.a
    text: het vak of de vakken waarvoor de kandidaat een eindcijfer 6 of meer heeft behaald,
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel53
  - number: 53.2.b
    text: de vakken en het onderwerp of de titel van het profielwerkstuk, voor zover beoordeeld met «goed» of «voldoende», en
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel53
  - number: 53.2.c
    text: het thema van het sectorwerkstuk, voor zover beoordeeld met «goed» of «voldoende».
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel53
  - number: '53.3'
    text: |-
      De directeur reikt aan de definitief voor het eindexamen v.m.b.o. afgewezen kandidaat die de school verlaat en die
      voor een of meer vakken van dat eindexamen een eindcijfer 6 of meer heeft behaald, een certificaat uit, waarop zijn
      vermeld, voor zover van toepassing:
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel53
  - number: 53.3.a
    text: het vak of de vakken waarvoor de kandidaat een eindcijfer 6 of meer heeft behaald, en
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel53
  - number: 53.3.b
    text: het thema van het sectorwerkstuk, voor zover beoordeeld met «goed» of «voldoende».
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel53
  - number: '53.4'
    text: Onze Minister stelt het model van het certificaat en de cijferlijst vast.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel53
  - number: '54.1'
    text: Duplicaten van afgegeven diploma's, certificaten, vrijstellingsbewijzen en cijferlijsten worden niet verstrekt.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel54
  - number: '54.2'
    text: |-
      Een schriftelijke verklaring dat een in het eerste lid bedoeld document is afgegeven, welke verklaring dezelfde
      waarde heeft als dat document zelf, kan uitsluitend door de Informatie Beheer Groep worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel54
  - number: '55.1'
    text: |-
      De directeur kan toestaan dat een gehandicapte kandidaat het examen geheel of gedeeltelijk aflegt op een wijze die
      is aangepast aan de mogelijkheden van die kandidaat. In dat geval bepaalt de directeur de wijze waarop het examen
      zal worden afgelegd. Hij doet hiervan zo spoedig mogelijk mededeling aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel55
  - number: '55.2'
    text: |-
      Tenzij sprake is van een objectief waarneembare lichamelijke handicap, geldt ten aanzien van de in het eerste lid
      bedoelde aangepaste wijze van examineren dat:
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel55
  - number: 55.2.a
    text: er een deskundigenverklaring is die door een ter zake deskundige psycholoog of orthopedagoog is opgesteld,
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel55
  - number: 55.2.b
    text: |-
      de aanpassing voor zover betrekking hebbend op het centraal examen in ieder geval kan bestaan uit een verlenging
      van de duur van de desbetreffende toets van het centraal examen met ten hoogste 30 minuten, en
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel55
  - number: 55.2.c
    text: |-
      een andere aanpassing slechts kan worden toegestaan voor zover daartoe in [de onder a][ref1] genoemde
      deskundigenverklaring ten aanzien van betrokkene een voorstel wordt gedaan dan wel indien de aanpassing aantoonbaar
      aansluit bij de begeleidingsadviezen, vermeld in die deskundigenverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel55
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '55'
        hoofdstuk: VI
  - number: '55.3'
    text: |-
      Het bevoegd gezag kan in verband met onvoldoende beheersing van de Nederlandse taal afwijken van de voorschriften
      gegeven bij of krachtens dit besluit, ten aanzien van een kandidaat die met inbegrip van het schooljaar waarin hij
      eindexamen aflegt, ten hoogste zes jaren onderwijs in Nederland heeft gevolgd en voor wie het Nederlands niet de
      moedertaal is. De in de eerste volzin bedoelde afwijking kan betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel55
  - number: 55.3.a
    text: het vak Nederlandse taal en letterkunde;
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel55
  - number: 55.3.b
    text: het vak Nederlandse taal;
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel55
  - number: 55.3.c
    text: enig ander vak waarbij het gebruik van de Nederlandse taal van overwegende betekenis is.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel55
  - number: '55.4'
    text: |-
      De in het derde lid bedoelde afwijking bestaat voor zover betrekking hebbend op het centraal examen slechts uit
      een verlenging van de duur van de desbetreffende toets van het centraal examen met ten hoogste 30 minuten en het
      verlenen van toestemming tot het gebruik van een verklarend woordenboek der Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel55
  - number: '55.5'
    text: Van elke afwijking op grond van het derde lid wordt mededeling gedaan aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel55
  - number: '56'
    text: |-
      Zo spoedig mogelijk na de vaststelling van de definitieve uitslag stuurt het bevoegd gezag aan de Informatie Beheer
      Groep en aan de inspectie een lijst waarop voor alle kandidaten zijn vermeld:
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel56
  - number: 56.a
    text: het profiel of de profielen danwel de leerweg waarop het examen betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel56
  - number: 56.b
    text: de vakken waarin examen is afgelegd;
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel56
  - number: 56.c
    text: |-
      de cijfers van het schoolexamenalsmede in voorkomend geval, de beoordeling van het profielwerkstuk of
      sectorwerkstuk, en de vakken waarop het profielwerkstuk betrekking heeft respectievelijk het thema van het
      sectorwerkstuk;;
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel56
  - number: 56.d
    text: de cijfers van het centraal examen;
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel56
  - number: 56.e
    text: de eindcijfers;
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel56
  - number: 56.f
    text: de uitslag van het eindexamen.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel56
  - number: '57.1'
    text: |-
      Het werk van het centraal examen der kandidaten en de lijst, bedoeld in [artikel 56][ref1], worden gedurende ten
      minste zes maanden na de vaststelling van de uitslag bewaard door de directeur, ter inzage voor belanghebbenden.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel56
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '56'
        hoofdstuk: VI
  - number: '57.2'
    text: |-
      Een door de directeur en de secretaris van het eindexamen ondertekend exemplaar van de lijst, bedoeld in
      [artikel 56][ref1] wordt gedurende ten minste zes maanden na de vaststelling van de uitslag in het archief van de
      school bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel56
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '56'
        hoofdstuk: VI
  - number: '57.3'
    text: |-
      De directeur draagt er zorg voor dat een volledig stel van de bij de centrale examens gebruikte opgaven gedurende
      ten minste zes maanden na de vaststelling van de uitslag bewaard blijft in het archief van de school.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel57
  - number: '57.4'
    text: |-
      Een kandidaat die voor een vak ten overstaan van de staatsexamencommissie centraal examen aflegt met geheime
      opgaven, kan omtrent zijn werk gedurende genoemde periode van zes maanden inlichtingen inwinnen bij de voorzitter
      van die commissie.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel57
  - number: '58'
    text: |-
      Ten behoeve van experimenten met een andere inrichting van het eindexamen kan Onze Minister toestaan dat van dit
      besluit wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel58
  - number: '59.1'
    text: |-
      Het bevoegd gezag kan, de inspectie gehoord, toestaan dat ten aanzien van een kandidaat die in het laatste leerjaar
      langdurig ziek is, en ten aanzien van een kandidaat die lange tijd ten gevolge van een bijzondere, van de wil van
      de kandidaat onafhankelijke omstandigheid niet in staat is geweest het onderwijs in alle betrokken eindexamenvakken
      gedurende het laatste leerjaar te volgen, het centraal examen en in voorkomend geval het schoolexamen, voor een
      deel van de vakken in het ene schooljaar en voor het andere deel in het daarop volgende schooljaar wordt afgelegd.
      In dat geval wordt het eindexamen in een vak in het eerste of in het tweede van deze schooljaren afgesloten.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel59
  - number: '59.2'
    text: |-
      Het bevoegd gezag geeft zijn in het eerste lid bedoelde toestemming uiterlijk voor de aanvang van het eerste
      tijdvak van het centraal examen. In bijzondere gevallen kan het bevoegd gezag afwijken van de eerste volzin ten
      behoeve van een kandidaat die nog niet in alle betrokken eindexamenvakken centraal examen heeft afgelegd.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel59
  - number: '59.3'
    text: |-
      [Artikel 51, eerste tot en met vierde lid][ref1], is ten aanzien van de kandidaat van toepassing in het eerste en
      in het tweede schooljaar van het gespreid centraal examen, met dien verstande dat het in dat artikel bedoelde recht
      in het eerste schooljaar ontstaat nadat de eindcijfers van de vakken waarvoor in het eerste schooljaar het centraal
      examen is afgesloten, voor de eerste maal zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel51
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '51'
        hoofdstuk: V
  - number: '59.4'
    text: |-
      Zo spoedig mogelijk na de vaststelling van de eindcijfers, behaald tot en met het eerste schooljaar van het
      gespreid centraal examen, zendt het bevoegd gezag aan de inspectie een lijst waarop voor die kandidaat zijn vermeld
      de gegevens, genoemd in [artikel 56, onderdelen a tot en met e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel56
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '56'
        hoofdstuk: VI
  - number: '59.5'
    text: |-
      De directeur en de secretaris stellen op verzoek van de kandidaat de uitslag van het eindexamen reeds vast aan het
      einde van het eerste schooljaar van het gespreid centraal examen of het gespreid schoolexamen, met overeenkomstige
      toepassing van [artikel 49][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel49
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '49'
        hoofdstuk: V
  - number: '66'
    text: |-
      De op het tijdstip van inwerkingtreding van dit besluit door Onze Minister gegeven regelingen en beschikkingen
      ter uitvoering van het Eindexamenbesluit dagscholen v.w.o.-h.a.v.o.-m.a.v.o., het Eindexamenbesluit avondscholen
      v.w.o.-h.a.v.o.-m.a.v.o. en het Eindexamenbesluit l.b.o. berusten vanaf dat tijdstip op dit besluit.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel66
  - number: '67.1'
    text: Dit besluit treedt in werking met ingang van 1 augustus 1990.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel67
  - number: '67.2'
    text: |-
      In afwijking van het bepaalde in het eerste lid treden de [artikelen 53][ref1], [54][ref2], [60][ref3], [62][ref4]
      en [65, de onderdelen C, D, E, F en G][ref5], in werking met ingang van de dag na de datum van uitgifte van het
      *Staatsblad* waarin dit besluit wordt geplaatst en werken terug tot en met 1 augustus 1988.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0004593#Artikel60
      [ref4]: https://wetten.overheid.nl/BWBR0004593#Artikel62
      [ref5]: https://wetten.overheid.nl/BWBR0004593#Artikel65
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '53'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '54'
        hoofdstuk: V
      - id: ref3
