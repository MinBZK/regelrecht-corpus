        bwb_id: BWBR0005946
        artikel: 26e
      - id: ref4
        bwb_id: BWBR0005946
        artikel: 26e
  - number: 12.7.b
    text: |-
      de kandidaat heeft voordien buiten Nederland onderwijs gevolgd en daarbij geen of te weinig onderwijs in het
      overeenkomstige vak gevolgd.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel12
  - number: '12.8'
    text: |-
      De inspectie kan in bijzondere gevallen goedkeuren dat de in het zevende lid bedoelde vrijstelling wordt verleend
      aan een kandidaat die niet voldoet aan de in dat lid onder *a* of *b* genoemde voorwaarde.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel12
  - number: '13.1'
    text: 'Het eindexamen h.a.v.o. omvat:'
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel13
  - number: 13.1.a
    text: |-
      de vakken en deelvakken van het gemeenschappelijk deel van elk profiel, genoemd in [artikel 26][ref1], met dien
      verstande dat voor de bepaling van de eindcijfers de onderdelen letterkunde van alle afzonderlijke moderne talen in
      het profiel tezamen als vak van het gemeenschappelijk deel worden aangemerkt,


