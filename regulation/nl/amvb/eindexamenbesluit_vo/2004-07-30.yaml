      eerste lid, onderdeel *c*, genoemde getal van 200 uren met het meerdere verlaagd.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel13
  - number: '13.3'
    text: |-
      In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een school voor h.a.v.o., bij het
      eindexamen vrijgesteld van de vakken en deelvakken van het gemeenschappelijk deel voor welke hij werd vrijgesteld
