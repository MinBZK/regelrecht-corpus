        artikel: '60'
  - number: '1.2'
    text: |-
      Waar in dit besluit wordt gesproken van «directeur» en van «directeur en de secretaris», wordt daaronder wat
      instellingen voor educatie en beroepsonderwijs betreft verstaan, de examencommissie v.a.v.o., tenzij anders blijkt.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel1
  - number: '2.1'
    text: |-
      Het bevoegd gezag stelt de leerlingen van een school en de leerlingen van een afdeling voor h.a.v.o. in de
      gelegenheid ter afsluiting van de opleiding een eindexamen af te leggen.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel2
  - number: '2.2'
    text: |-
      Het bevoegd gezag stelt de leerlingen van een instelling voor educatie en beroepsonderwijs in de gelegenheid in
      plaats van een eindexamen een of meer deeleindexamens af te leggen.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel2
  - number: '2.3'
    text: Het bevoegd gezag kan tot het eindexamen toelaten kandidaten die niet als leerling van de school zijn ingeschreven.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel2
  - number: '2.4'
    text: |-
      Het bevoegd gezag van een instelling voor educatie en beroepsonderwijs kan kandidaten als bedoeld in het derde lid
      eveneens in de gelegenheid stellen een of meer deeleindexamens aan de desbetreffende school af te leggen.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel2
  - number: '2.5'
    text: |-
      Kandidaten als bedoeld in het derde lid, die worden toegelaten tot het eindexamen van een school voor voortgezet
      onderwijs, zijn behoudens het bepaalde in het zesde lid aan het bevoegd gezag een bedrag verschuldigd van € 567
      voor een volledig eindexamen.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel2
  - number: '2.6'
    text: |-
      In afwijking van het bepaalde in het vijfde lid is een toelatingsbedrag niet verschuldigd door kandidaten die
      zijn ingeschreven bij een andere uit de openbare kas bekostigde school, - al dan niet in de zin van dit besluit -,
      afdeling of onderwijsinstelling en die aldaar geen eindexamen dan wel deeleindexamen afleggen.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel2
  - number: '3.1'
    text: |-
      De directeur en de examinatoren van een school voor voortgezet onderwijs nemen onder verantwoordelijkheid van het
      bevoegd gezag het eindexamen af, onverminderd [artikel 37][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel37
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '37'
        hoofdstuk: IV
  - number: '3.2'
    text: |-
      De directeur van een school voor voortgezet onderwijs wijst een van de personeelsleden van de school aan tot
      secretaris van het eindexamen.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel3
  - number: '4.1'
    text: Het eindexamen kan voor ieder vak bestaan uit een schoolexamen, uit een centraal examen dan wel uit beide.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel4
  - number: '4.2'
    text: |-
      Het schoolexamen v.w.o. en h.a.v.o. omvat mede een profielwerkstuk. Het profielwerkstuk is een werkstuk, een
      presentatie daaronder begrepen, waarin op geïntegreerde wijze kennis, inzicht en vaardigheden aan de orde komen die
      van betekenis zijn in het desbetreffende profiel.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel4
  - number: '4.3'
    text: |-
      Het profielwerkstuk heeft betrekking op ten minste twee vakken, twee deelvakken of een vak en een deelvak.
      Deze vakken en deelvakken behoren tot het desbetreffende profieldeel, met dien verstande dat indien het betreft
      het profiel cultuur en maatschappij, tot deze vakken en deelvakken tevens worden gerekend Nederlandse taal en
      letterkunde en Engelse taal en letterkunde uit het gemeenschappelijk deel.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel4
  - number: '4.4'
    text: |-
      Het schoolexamen v.m.b.o. voor zover het betreft de theoretische leerweg, genoemd in [artikel 10 van de wet][ref1],
      en de gemengde leerweg, genoemd in [artikel 10d van de wet][ref2], omvat mede een sectorwerkstuk. De tweede volzin
      van het tweede lid is van overeenkomstige toepassing. Het sectorwerkstuk heeft betrekking op een thema uit de
      sector waarin de leerling het onderwijs volgt.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10d
  - number: '5.1'
    text: |-
      Indien een kandidaat zich ten aanzien van enig deel van het eindexamen dan wel ten aanzien van een aanspraak op
      vrijstelling aan enige onregelmatigheid schuldig maakt of heeft gemaakt, dan wel zonder geldige reden afwezig is,
      kan de directeur maatregelen nemen.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel5
  - number: '5.2'
    text: |-
      De maatregelen, bedoeld in het eerste lid, die afhankelijk van de aard van de onregelmatigheid ook in combinatie
      met elkaar genomen kunnen worden, zijn:
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel5
  - number: 5.2.a
    text: het toekennen van het cijfer 1 voor een toets van het schoolexamen of het centraal examen,
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel5
  - number: 5.2.b
    text: |-
      het ontzeggen van de deelname of de verdere deelname aan een of meer toetsen van het schoolexamen of het centraal
      examen,
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel5
  - number: 5.2.c
    text: |-
      het ongeldig verklaren van een of meer toetsen van het reeds afgelegde deel van het schoolexamen of het centraal
      examen,
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel5
  - number: 5.2.d
    text: |-
      het bepalen dat het diploma en de cijferlijst slechts kunnen worden uitgereikt na een hernieuwd examen in door de
      directeur aan te wijzen onderdelen.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel5
  - number: '5.3'
    text: |-
      Het besluit waarbij een in het eerste lid bedoelde maatregel wordt genomen, wordt tegelijkertijd in afschrift
      toegezonden aan de inspectie en, indien de kandidaat minderjarig is, aan de wettelijke vertegenwoordigers van de
      kandidaat.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel5
  - number: '5.4'
    text: |-
      De kandidaat kan tegen een beslissing van de directeur van een school voor voortgezet onderwijs in beroep gaan
      bij de door het bevoegd gezag van de school in te stellen commissie van beroep. Van de commissie van beroep mag de
      directeur geen deel uitmaken. In overeenstemming met [artikel 30a van de wet][ref1] wordt het beroep binnen drie
      dagen nadat de beslissing aan de kandidaat is bekendgemaakt, schriftelijk ingesteld bij de commissie van beroep.
      De commissie stelt een onderzoek in en beslist binnen twee weken na ontvangst van het beroepsschrift, tenzij zij
      deze termijn gemotiveerd heeft verlengd met ten hoogste twee weken. De commissie stelt bij haar beslissing zo nodig
      vast op welke wijze de kandidaat alsnog in de gelegenheid zal worden gesteld het eindexamen geheel of gedeeltelijk
      af te leggen onverminderd het bepaalde in de laatste volzin van het tweede lid. De commissie deelt haar beslissing
      schriftelijk mede aan de kandidaat, aan de ouders, voogden of verzorgers van de kandidaat indien deze minderjarig
      is, aan de directeur en aan de inspectie.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel30a
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 30a
  - number: '7.1'
    text: |-
      Onze Minister stelt, behalve voor door het bevoegd gezag vast te stellen vakken die onderdeel zijn van het
      eindexamen, voor elk van de onderwijssoorten examenprogramma’s vast, waarin zijn opgenomen:
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel7
  - number: 7.1.a
    text: een omschrijving van de examenstof voor ieder eindexamenvak,
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel7
  - number: 7.1.b
    text: |-
      welk deel van de examenstof centraal zal worden geëxamineerd en over welke examenstof het schoolexamen zich
      uitstrekt, en
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel7
  - number: 7.1.c
    text: het aantal en de tijdsduur van de toetsen van het centraal examen.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel7
  - number: '7.2'
    text: Een examenprogramma wordt vastgesteld per vak of per groep van vakken.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel7
  - number: '7.3'
    text: |-
      De examenprogramma's voor zover het betreft leerwegen in het v.m.b.o. kunnen voorzien in differentiaties waaruit de
      leerling een keuze maakt.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel7
  - number: '8.1'
    text: |-
      De kandidaten kiezen, met inachtneming van dit hoofdstuk, in welke vakken zij examen willen afleggen. Voor
      leerlingen geldt deze keuze voorzover het bevoegd gezag, al dan niet in samenwerking met het bevoegd gezag van een
      of meer andere scholen, hen in de gelegenheid heeft gesteld zich op het examen in die vakken voor te bereiden. Voor
      wie niet als leerling is ingeschreven geldt deze keuze voorzover het bevoegd gezag hen tot het examen in die vakken
      toelaat en in voorkomend geval nadat toepassing is gegeven aan[artikel 27 van het Inrichtingsbesluit W.V.O.][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel27
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: '27'
  - number: '8.2'
    text: |-
      De kandidaten kunnen voor zover het bevoegd gezag hun dat toestaat, in meer vakken of niet-verplichte delen van de
      examenstof examen afleggen dan in de vakken en examenstof die ten minste tezamen een eindexamen vormen.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel8
  - number: '8.3'
    text: |-
      Het bevoegd gezag beslist, welke in [artikel 7, derde lid][ref1], bedoelde differentiaties worden aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel7
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '7'
        hoofdstuk: II
  - number: '8.4'
    text: Het eerste lid is van overeenkomstige toepassing op kandidaten die deeleindexamen afleggen.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel8
  - number: '9.1'
    text: |-
      Onverminderd vrijstellingen als bedoeld in de [artikelen 11][ref1], [12][ref2], [13][ref3] en [22][ref4] is de
      kandidaat die het eindexamen aflegt aan een instelling voor educatie en beroepsonderwijs:


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0004593#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0004593#Artikel22
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '11'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '12'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0004593
        artikel: '13'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0004593
        artikel: '22'
        hoofdstuk: II
  - number: 9.1.a
    text: |-
      vrijgesteld van het examen in een algemeen vak van de theoretische leerweg in het v.m.b.o. op grond van het
      examen v.w.o., h.a.v.o. of v.m.b.o., indien voor het overeenkomstige vak een eindcijfer 6 of hoger of een daarmee
      overeenkomende waardering is behaald,
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel9
  - number: 9.1.b
    text: |-
      vrijgesteld van het examen in een vak in het h.a.v.o. op grond van een examen v.w.o. of h.a.v.o., indien voor het
      overeenkomstige vak een eindcijfer 6 of hoger of een daarmee overeenkomende waardering is behaald;
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel9
  - number: 9.1.c
    text: |-
      vrijgesteld van het examen in een vak in het v.w.o. op grond van een examen v.w.o., indien voor het overeenkomstige
      vak een eindcijfer 6 of hoger of een daarmee overeenkomende waardering is behaald;
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel9
  - number: 9.1.d
    text: |-
      vrijgesteld van het examen in een vak van het v.w.o. of h.a.v.o. op grond van het overeenkomstige examen, afgelegd
      in de Nederlandse Antillen of in Aruba, indien voor het overeenkomstige vak een eindcijfer 6 of hoger of een
      daarmee overeenkomende waardering is behaald;
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel9
  - number: 9.1.e
    text: |-
      vrijgesteld van het profielwerkstuk of sectorwerkstuk, indien reeds eerder een profielwerkstuk respectievelijk
      sectorwerkstuk is gemaakt dat betrekking heeft op twee vakken uit het desbetreffende profieldeel respectievelijk op
      een thema uit de desbetreffende sector, en dat is beoordeeld als «voldoende» of «goed».
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel9
  - number: '9.2'
    text: |-
      Het eerste lid is uitsluitend van toepassing indien na het jaar waarin het eindcijfer of de beoordeling is
      vastgesteld, nog geen 10 jaren zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel9
  - number: '9.3'
    text: |-
      In aanvulling op het eerste lid, onder a tot en met c, is de kandidaat die het eindexamen v.w.o. of h.a.v.o.
      aflegt, vrijgesteld van het onderdeel letterkunde van elke moderne taal, indien de kandidaat bij een eerder
      afgelegd examen, voor letterkunde een eindcijfer 6 of hoger heeft behaald.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel9
  - number: '9.4'
    text: |-
      In aanvulling op het eerste lid, onder a tot en met e, en derde lid, is de daar bedoelde kandidaat eveneens
      vrijgesteld indien het eindcijfer 5 of 4 is behaald, mits de kandidaat voldoet aan de voorwaarden van
      [artikel 49][ref1] om te slagen voor het eindexamen.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel49
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '49'
        hoofdstuk: V
  - number: '9.5'
    text: Bij ministeriële regeling worden nadere voorschriften gegeven voor de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel9
  - number: '10.1'
    text: |-
      Onverminderd [artikel 9][ref1] kan de staatsexamencommissie op verzoek van de kandidaat die het eindexamen aflegt
      aan een instelling voor educatie en beroepsonderwijs, vrijstelling verlenen voor een examenvak, indien de kandidaat
      op grond van eerder gevolgd onderwijs aantoonbaar in het bezit is van voldoende kennis en vaardigheden ter zake
      van het desbetreffende vak. De vrijstelling kan slechts worden verleend op basis van een diploma, getuigschrift
      of ander bewijsstuk, al of niet behaald in Nederland, dat door de staatsexamencommissie wordt aanvaard als bewijs
      van voldoende kennis en vaardigheden. Indien de staatsexamencommissie dit nodig oordeelt, onderzoekt zij of de
      kandidaat in het bezit is van voldoende kennis en vaardigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel9
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '9'
        hoofdstuk: II
  - number: '10.2'
    text: |-
      Het eerste lid is uitsluitend van toepassing indien na het jaar waarin het in dat lid bedoelde diploma,
      getuigschrift of ander bewijsstuk is vastgesteld, nog geen 10 jaren zijn verstreken
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel10
  - number: '10.3'
    text: |-
      Tot de in het eerste lid bedoelde diploma's, getuigschriften en andere bewijsstukken behoren in elk geval die
      betreffende het Internationaal Baccalaureaat, het Europees Baccalaureaat en die betreffende het overeenkomstige
      onderwijs in een lid-staat van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel10
  - number: '10.4'
    text: |-
      Indien de staatsexamencommissie de gevraagde vrijstelling verleent, verstrekt zij de verzoeker een bewijs van
      vrijstelling, en zendt zij aan de inspectie alsmede de Informatie Beheer Groep een afschrift daarvan.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel10
  - number: '10.5'
    text: |-
      Het bewijs van vrijstelling vermeldt de gronden van de vrijstelling, het tijdstip van het verrichten van
      de onderwijs- of examenprestatie waarop de vrijstelling berust, en gaat in voorkomend geval vergezeld van
      een verklaring betreffende het in het eerste lid bedoelde onderzoek naar de kennis en vaardigheden van de
      examenkandidaat, of naar de in het eerste lid bedoelde bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel10
  - number: '10.6'
    text: Onze Minister stelt het model van het bewijs van vrijstelling vast.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel10
  - number: 10a
    text: |-
      Een verzoek om vrijstelling als bedoeld in [artikel 10][ref1] wordt schriftelijk ingediend bij de
      staatsexamencommissie, onder overlegging van een uittreksel uit het geboorte- of persoonsregister en een
      gewaarmerkte fotokopie van het diploma, getuigschrift of andere bewijsstuk waarop het verzoek om vrijstelling
      berust.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel10
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '10'
        hoofdstuk: II
  - number: '11.1'
    text: 'Het eindexamen v.w.o. (atheneum) omvat:'
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel11
  - number: 11.1.a
    text: |-
      de vakken en deelvakken van het gemeenschappelijk deel van elk profiel, genoemd in [artikel 26][ref1], met dien
      verstande dat voor de bepaling van de eindcijfers de onderdelen letterkunde van alle afzonderlijke moderne talen in
      het profiel tezamen als vak van het gemeenschappelijk deel worden aangemerkt,


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel26b
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: 26b
  - number: 11.1.b
    text: |-
      de vakken en deelvakken van het profieldeel van een van de profielen, genoemd in [artikel 26][ref1], waaronder
      tevens begrepen een profielwerkstuk, en


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel26b
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: 26b
  - number: 11.1.c
    text: |-
      vakken, deelvakken en andere programma-onderdelen van het vrije deel van elk profiel, genoemd in
      [artikel 26][ref1], die tezamen overeenkomen met een normatieve studielast van ten minste 280 uren zoals geldend
      voor de scholen voor v.w.o., met dien verstande dat door het bevoegd gezag vast te stellen vakken en andere
      programma-onderdelen onderdeel zijn van het eindexamen uitsluitend voorzover Onze Minister daarvoor goedkeuring
      heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel26b
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: 26b
  - number: '11.2'
    text: |-
      Indien voor de kandidaat het profieldeel een normatieve studielast heeft van meer dan 1840 uren, wordt het in het
      eerste lid, onderdeel *c*, genoemde getal van 280 uren met het meerdere verlaagd.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel11
  - number: '11.3'
    text: |-
      In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een school voor v.w.o., bij het
      eindexamen vrijgesteld van de vakken en deelvakken van het gemeenschappelijk deel voor welke hij werd vrijgesteld
      van het volgen van onderwijs op grond van [artikel 26][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel26e
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: 26e
  - number: '11.4'
    text: |-
      In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een instelling voor educatie
      en beroepsonderwijs, bij het eindexamen vrijgesteld van de deelvakken culturele en kunstzinnige vorming 1 en
      lichamelijke opvoeding 1 van het gemeenschappelijk deel.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel11
  - number: '11.5'
    text: |-
      In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een instelling voor educatie en
      beroepsonderwijs, en in het bezit is van het diploma h.a.v.o., bij het eindexamen vrijgesteld van de volgende
      vakken van het gemeenschappelijk deel: algemene natuurwetenschappen, geschiedenis en maatschappijleer.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel11
  - number: '11.6'
    text: |-
      In afwijking van het eerste lid kan de kandidaat die het eindexamen aflegt aan een instelling voor educatie
      en beroepsonderwijs, op zijn verzoek bij het eindexamen worden vrijgesteld van de deelvakken Franse taal en
      letterkunde 1 of Duitse taal en letterkunde 1 van het gemeenschappelijk deel of van beide, in de volgende gevallen:
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel11
  - number: 11.6.a
    text: |-
      de kandidaat heeft eerder in Nederland onderwijs op een school voor voortgezet onderwijs gevolgd en werd daarbij
      vrijgesteld van het volgen van onderwijs in een tweede moderne taal op grond van [artikel 11][ref1], of van
      het volgen van onderwijs in Franse taal en letterkunde of Duitse taal en letterkunde of beide, op grond van
      [artikel 21, tweede lid, van het Inrichtingsbesluit W.V.O.][ref2] of [artikel 26][ref3], of van het volgen van
      onderwijs in moderne taal en letterkunde 1 op grond van [artikel 26][ref4], of


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11e
      [ref2]: https://wetten.overheid.nl/BWBR0005946#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0005946#Artikel26e
      [ref4]: https://wetten.overheid.nl/BWBR0005946#Artikel26e
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 11e
      - id: ref2
        bwb_id: BWBR0005946
        artikel: '21'
      - id: ref3
        bwb_id: BWBR0005946
        artikel: 26e
      - id: ref4
        bwb_id: BWBR0005946
        artikel: 26e
  - number: 11.6.b
    text: |-
      de kandidaat heeft voordien buiten Nederland onderwijs gevolgd en daarbij geen of te weinig onderwijs in het
      overeenkomstige vak gevolgd.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel11
  - number: '11.7'
    text: |-
      De inspectie kan in bijzondere gevallen goedkeuren dat de in het zesde lid bedoelde vrijstelling wordt verleend aan
      een kandidaat die niet voldoet aan de in dat lid onder *a* of *b* genoemde voorwaarde.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel11
  - number: '12.1'
    text: 'Het eindexamen v.w.o. (gymnasium) omvat:'
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel12
  - number: 12.1.a
    text: |-
      de vakken en deelvakken van het gemeenschappelijk deel van elk profiel, genoemd in [artikel 26][ref1], met
      inachtneming van artikel 26, en met dien verstande dat voor de bepaling van de eindcijfers de onderdelen
      letterkunde van alle afzonderlijke moderne talen in het profiel tezamen als vak van het gemeenschappelijk deel
      worden aangemerkt,


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel26b
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: 26b
  - number: 12.1.b
    text: |-
      de vakken en deelvakken van het profieldeel van een van de profielen, genoemd in [artikel 26][ref1], waaronder
      tevens begrepen een profielwerkstuk, en


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel26b
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: 26b
  - number: 12.1.c
    text: |-
      vakken, deelvakken en andere programma-onderdelen van het vrije deel van elk profiel, genoemd in
      [artikel 26][ref1], die tezamen overeenkomen met een normatieve studielast van ten minste 760 uren zoals geldend
      voor de scholen voor v.w.o., met dien verstande dat door het bevoegd gezag vast te stellen vakken en andere
      programma-onderdelen onderdeel zijn van het eindexamen uitsluitend voorzover Onze Minister daarvoor goedkeuring
      heeft verleend. Het eindexamen kan in het vrije deel ook omvatten, culturele en kunstzinnige vorming 1.


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel26b
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: 26b
  - number: '12.2'
    text: |-
      Het eindexamen v.w.o. (gymnasium) omvat in elk geval het vak Latijnse taal en letterkunde of het vak Griekse taal
      en letterkunde. Het kan beide vakken omvatten.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel12
