  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs en Wetenschappen, mede namens Onze Minister van Landbouw en
    Visserij, van 16 januari 1989, nr. 88040519/3188, centrale directie Wetgeving en Juridische Zaken;

    Gelet op de artikelen 29, 30 en 60 van de Wet op het voortgezet onderwijs;

    Gehoord de Onderwijsraad (advies van 28 oktober 1988, nr. OR/1325 S);

    De Raad van State gehoord (advies van 4 april 1989, nr. W05.89 0025);

    Gezien het nader rapport van de Staatssecretaris van Onderwijs en Wetenschappen, mede namens Onze Minister van
    Landbouw en Visserij, van 16 juni 1989, nr. 89011 016/3188, centrale directie Wetgeving en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit wordt verstaan onder: «de wet»: de [Wet op het voortgezet onderwijs][ref1]; Onze
      Minister: Onze Minister van Onderwijs, Cultuur en Wetenschappen, en wat het landbouwonderwijs
      betreft, Onze Minister van Landbouw, Natuurbeheer en Visserij; Informatie Beheer Groep: de
      Informatie Beheer Groep, genoemd in de [Wet verzelfstandiging Informatiseringsbank][ref2];
      inspectie: de inspectie, bedoeld in [artikel 1 van de Wet op het onderwijstoezicht][ref3]; bevoegd
      gezag: het bevoegd gezag, bedoeld in [artikel 1 van de Wet op het voortgezet onderwijs][ref4],
      indien het een school voor voortgezet onderwijs betreft, en het bevoegd gezag, bedoeld in
      [artikel 1.1.1, onderdeel w.1 en w.2, van de Wet educatie en beroepsonderwijs][ref5], indien het een
      instelling voor educatie en beroepsonderwijs betreft; kandidaat: ieder die door het bevoegd gezag tot
      het eindexamen of deeleindexamen wordt toegelaten; gecommitteerde: een gecommitteerde als bedoeld in
      [artikel 36][ref6] van dit besluit; v.w.o.: voorbereidend wetenschappelijk onderwijs als bedoeld in
      [artikel 7 van de Wet op het voortgezet onderwijs][ref7]; h.a.v.o.: hoger algemeen voortgezet onderwijs als
      bedoeld in [artikel 8 van de Wet op het voortgezet onderwijs][ref8]; m.a.v.o.: middelbaar algemeen voortgezet
      onderwijs als bedoeld in [artikel 9 van de Wet op het voortgezet onderwijs][ref9]; v.b.o.: voorbereidend
      beroepsonderwijs als bedoeld in [artikel 10a van de Wet op het voortgezet onderwijs][ref10]; v.m.b.o.:
      voorbereidend middelbaar beroepsonderwijs als bedoeld in [artikel 21 van de wet][ref11]; opleiding v.a.v.o.: een
      opleiding voortgezet algemeen volwassenenonderwijs als bedoeld in [artikel 7.3.1, eerste lid, onderdeel ][ref12];
      school: een school voor v.w.o., een school voor h.a.v.o., een school voor m.a.v.o., een school
      voor v.b.o. of een instelling voor educatie en beroepsonderwijs, tenzij anders blijkt; school voor
      voortgezet onderwijs: een school voor v.w.o., een school voor h.a.v.o., een school voor m.a.v.o. of
      een school voor v.b.o.; instelling voor educatie en beroepsonderwijs: een instelling als bedoeld in
      [artikel 1.1.1, onderdeel b, van de Wet educatie en beroepsonderwijs][ref13], voor zover het betreft door die
      instelling verzorgde opleidingen v.a.v.o.; directeur: de rector of directeur van een school voor voortgezet
      onderwijs; leerling: een leerling aan een school voor voortgezet onderwijs of een deelnemer aan een opleiding
      v.a.v.o.; schooljaar: het tijdvak dat aanvangt op 1 augustus en eindigt op 31 juli van het daaropvolgende jaar,
      daaronder mede begrepen het studiejaar, bedoeld in [artikel 1.1.1, onderdeel ][ref14]; examinator: degene die
      is belast met het afnemen van het examen in een vak; examencommissie v.a.v.o.: de in [artikel 7.4.11][ref15],
      tweede lid, juncto [artikel 7.4.5 van de Wet educatie en beroepsonderwijs][ref16] bedoelde examencommissie voor
      een opleiding v.a.v.o.; vakken: vakken, deelvakken, intrasectorale programma's en andere programma-onderdelen;
      de vakken behorende tot de beeldende vorming: tekenen, handvaardigheid (handenarbeid), handvaardigheid (textiele
      werkvormen), fotografie, film, audio-visuele vorming; kunstvakken: de vakken behorende tot de beeldende vorming,
      alsmede muziek, dans en drama; algemene vakken: vakken niet zijnde afdelingsvakken genoemd in [artikel 26h][ref17],
      respectievelijk bedoeld in [artikel 26i, eerste lid, van het Inrichtingsbesluit W.V.O.][ref18], en
      niet zijnde intrasectorale programma's, genoemd in [artikel 26j van dat besluit][ref19]; sector: een in
      [artikel 10, derde lid][ref20], [artikel 10b, derde lid][ref21], of [artikel 10d, derde lid, van de wet][ref22]
      bedoelde sector; profielwerkstuk: het in [artikel 4][ref23] bedoelde profielwerkstuk; sectorwerkstuk: het
      in [artikel 4][ref24] bedoelde sectorwerkstuk; toets: een toets met schriftelijke of mondelinge vragen en
      opdrachten, of een praktische opdracht;. eindexamen: een examen in het geheel van de voor het desbetreffende
      eindexamen voorgeschreven vakken; eindexamen v.m.b.o.: een eindexamen dat leidt tot een diploma v.m.b.o. voor
      zover het betreft de theoretische leerweg, genoemd in [artikel 10 van de wet][ref25], de basisberoepsgerichte
      leerweg, genoemd in [artikel 10b van de wet][ref26], de kaderberoepsgerichte leerweg, genoemd in
      [artikel 10b van de wet][ref27] of de gemengde leerweg, genoemd in [artikel 10d van de wet][ref28]; deeleindexamen:
      een examen in één of meer van de voor het eindexamen voorgeschreven vakken; staatsexamencommissie: een commissie
      als bedoeld in [artikel 60 van de Wet op het voortgezet onderwijs][ref29]; herkansing: het opnieuw deelnemen aan
      een toets van het centraal examen of het schoolexamen; examenstof: de aan de kandidaat te stellen eisen.


