  - number: '31.1'
    text: |-
      Het bevoegd gezag van een school voor voortgezet onderwijs, respectievelijk de examencommissie v.a.v.o., stelt
      een examenreglement vast. Het examenreglement bevat in elk geval informatie over de maatregelen, bedoeld in
      [artikel 5][ref1], en de toepassing daarvan, alsmede regels met betrekking tot de organisatie van het eindexamen,
      de gang van zaken tijdens het eindexamen, de herkansing van het schoolexamen, en wat scholen voor voortgezet
      onderwijs betreft, de samenstelling en het adres van de in [artikel 5][ref2] bedoelde commissie van beroep. Ten
      aanzien van de herkansing wordt in elk geval bepaald, in welke gevallen een herkansing mogelijk is. Ook kan worden
      bepaald dat tot die gevallen kunnen behoren gevallen dat de kandidaat door ziekte of ten gevolge van een bijzondere
      van zijn wil onafhankelijke omstandigheid, niet in staat is geweest, aan de desbetreffende toets deel te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel5
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '5'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '5'
        hoofdstuk: I
  - number: '31.2'
    text: |-
      Het bevoegd gezag van een school voor voortgezet onderwijs, respectievelijk de examencommissie v.a.v.o., stelt
      jaarlijks voor 1 oktober een programma van toetsing en afsluiting vast, dat in elk geval betrekking heeft op het
      desbetreffende schooljaar. In het programma wordt in elk geval aangegeven welke onderdelen van het examenprogramma
      in het schoolexamen worden getoetst, de inhoud van de onderdelen van het schoolexamen, de wijze waarop het
      schoolexamen plaatsvindt, de tijdvakken waarbinnen de toetsen van het schoolexamen aanvangen, de herkansing
      daaronder mede begrepen, de wijze van herkansing van het schoolexamen, alsmede de regels voor de wijze waarop het
      cijfer voor het schoolexamen voor een kandidaat tot stand komt.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel31
  - number: '31.3'
    text: |-
      Het examenreglement en het programma van toetsing en afsluiting worden door de directeur voor 1 oktober toegezonden
      aan de inspectie en verstrekt aan de kandidaten.
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel31
  - number: '32.1'
    text: |-
      Het bevoegd gezag bepaalt het tijdstip waarop het schoolexamen aanvangt. Het schoolexamen wordt afgesloten
      voor de aanvang van het eerste tijdvak, bedoeld in [artikel 37][ref1]. Het bevoegd gezag kan in afwijking van
      [de tweede volzin][ref2] een kandidaat die ten gevolge van ziekte of een andere van zijn wil onafhankelijke
      omstandigheid het schoolexamen niet heeft kunnen afsluiten voor de aanvang van het eerste tijdvak, in de
      gelegenheid stellen het schoolexamen in dat vak af te sluiten vóór het centraal examen in dat vak, doch na
      de aanvang van het eerste tijdvak. In afwijking van [de tweede volzin][ref3] geldt voor het v.m.b.o. dat het
      schoolexamen voor de vakken waarin geen centraal examen wordt afgelegd en, voor zover van toepassing, het
      sectorwerkstuk uiterlijk moeten zijn afgesloten op een datum gelegen na de aanvang van het eerste tijdvak van
      het centraal examen, doch uiterlijk een week voordat de uitslag wordt vastgesteld. Het bevoegd gezag dat afwijkt
      van [de tweede volzin][ref4], zendt de met het schoolexamen en het sectorwerkstuk behaalde resultaten zo spoedig
      mogelijk aan de inspectie.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0004593#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0004593#Artikel32
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '37'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '32'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0004593
        artikel: '32'
