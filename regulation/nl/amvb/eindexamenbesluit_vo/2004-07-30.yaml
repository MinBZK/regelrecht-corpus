      [ref2]: https://wetten.overheid.nl/BWBR0005946#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0005946#Artikel26e
      [ref4]: https://wetten.overheid.nl/BWBR0005946#Artikel26e
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel12
    references:
