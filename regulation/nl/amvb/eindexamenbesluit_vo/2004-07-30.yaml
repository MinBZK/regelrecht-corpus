      letterkunde 1 of Duitse taal en letterkunde 1 van het gemeenschappelijk deel, of van beide, in de volgende
      gevallen:
    url: https://wetten.overheid.nl/BWBR0004593/2004-07-30#Artikel12
  - number: 12.7.a
    text: |-
      de kandidaat heeft eerder in Nederland onderwijs op een school voor voortgezet onderwijs gevolgd en werd daarbij
      vrijgesteld van het volgen van onderwijs in een tweede moderne taal op grond van [artikel 11][ref1], of van
