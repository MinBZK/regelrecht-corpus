  - number: '13.2'
    text: |-
      Ingeval van toepassing van [artikel 14, achtste lid, van de wet][ref1] is het eerste lid van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel14
    url: https://wetten.overheid.nl/BWBR0004593/2009-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '14'
  - number: '13.3'
    text: |-
      In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een school voor h.a.v.o. bij het
      eindexamen vrijgesteld van de vakken waarvoor ontheffing of vrijstelling is verleend van het volgen van onderwijs
      op grond van [artikel 26e, eerste lid, respectievelijk zesde lid, van het Inrichtingsbesluit W.V.O][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel26e
    url: https://wetten.overheid.nl/BWBR0004593/2009-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: 26e
  - number: '13.4'
    text: |-
      In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een instelling voor educatie en
      beroepsonderwijs, bij het eindexamen vrijgesteld van de vakken culturele en kunstzinnige vorming en lichamelijke
      opvoeding van het gemeenschappelijk deel.
    url: https://wetten.overheid.nl/BWBR0004593/2009-10-01#Artikel13
  - number: '22.1'
    text: |-
      Het eindexamen v.m.b.o. voor zover het betreft de theoretische leerweg, genoemd in [artikel 10 van de wet][ref1],
      omvat in elk geval:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
    url: https://wetten.overheid.nl/BWBR0004593/2009-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
  - number: 22.1.a
    text: |-
      de vakken die het gemeenschappelijk deel ingevolge [artikel 10, vijfde lid, van de wet][ref1], omvat,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
    url: https://wetten.overheid.nl/BWBR0004593/2009-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
  - number: 22.1.b
    text: |-
      de twee vakken die het sectordeel ingevolge [artikel 10, zesde lid, van de wet][ref1] omvat, waaronder tevens
      begrepen een sectorwerkstuk, en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
    url: https://wetten.overheid.nl/BWBR0004593/2009-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
  - number: 22.1.c
    text: |-
      in het vrije deel twee nog niet in het sectordeel gekozen vakken, bedoeld onderscheidenlijk genoemd in
      [artikel 10, zevende lid, onderdelen a en b, van de wet][ref1], met dien verstande dat het sectordeel en het vrije
      deel tezamen ten minste twee vakken omvatten die geen moderne taal zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
    url: https://wetten.overheid.nl/BWBR0004593/2009-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
  - number: '22.2'
    text: |-
      In afwijking van het eerste lid is de kandidaat in de sector economie of leerwegondersteunend onderwijs ten aanzien
      van wie toepassing is gegeven aan [artikel 26n, tweede lid, van het Inrichtingsbesluit W.V.O.][ref1], bij het
      eindexamen vrijgesteld van het vak Franse taal of het vak Duitse taal, genoemd [artikel 26n, tweede lid][ref2].
      In plaats van het vak waarvoor vrijstelling is verleend, doet de kandidaat eindexamen in het vak Arabisch,
      het vak Turks, het vak Spaans, het vak maatschappijleer II, het vak aardrijkskunde of het vak geschiedenis en
      staatsinrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel26n
      [ref2]: https://wetten.overheid.nl/BWBR0005946#Artikel26n
    url: https://wetten.overheid.nl/BWBR0004593/2009-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: 26n
      - id: ref2
        bwb_id: BWBR0005946
        artikel: 26n
  - number: '22.3'
    text: |-
      Indien de kandidaat in het vrije deel twee kunstvakken kiest, wordt één kunstvak gekozen uit de vakken behorende
      tot de beeldende vorming en één kunstvak uit de vakken muziek, dans en drama.
    url: https://wetten.overheid.nl/BWBR0004593/2009-10-01#Artikel22
  - number: '22.4'
    text: |-
      In geval van toepassing van [artikel 10, negende lid, van de wet][ref1], zijn het eerste tot en met het derde lid
      van toepassing, met dien verstande dat het vervangen vak niet als extra vak als bedoeld in het zevende lid, gekozen
      kan worden.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
    url: https://wetten.overheid.nl/BWBR0004593/2009-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
  - number: '22.5'
    text: |-
      In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een instelling voor educatie en
      beroepsonderwijs vrijgesteld van de vakken lichamelijke opvoeding en de vakken behorende tot de beeldende vorming,
      muziek, dans of drama van het gemeenschappelijk deel.
    url: https://wetten.overheid.nl/BWBR0004593/2009-10-01#Artikel22
  - number: '22.6'
    text: |-
      In afwijking van het eerste lid kan de kandidaat die het eindexamen aflegt aan een instelling voor educatie en
      beroepsonderwijs, op zijn verzoek bij het eindexamen ontheffing worden verleend van de vakken Franse taal of Duitse
      taal van het sectordeel of van beide. [Artikel 11, zesde en zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel11
    url: https://wetten.overheid.nl/BWBR0004593/2009-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '11'
        hoofdstuk: II
  - number: '22.7'
    text: |-
      In aanvulling op de voorgeschreven vakken, bedoeld in het eerste lid, kan het eindexamen omvatten, voor zover nog
      niet gekozen:
    url: https://wetten.overheid.nl/BWBR0004593/2009-10-01#Artikel22
  - number: 22.7.a
    text: |-
      een vak als bedoeld in [artikel 10, zevende lid, onderdelen a en b, van de wet][ref1],


