    url: https://wetten.overheid.nl/BWBR0004593/2009-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
  - number: 22.7.b
    text: |-
      een vak dat behoort tot het eindexamen van de gemengde leerweg als bedoeld in [artikel 10d van de wet][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
    url: https://wetten.overheid.nl/BWBR0004593/2009-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10d
  - number: 22.7.c
    text: |-
      een vak genoemd in, dan wel aangewezen op grond van, [artikel 13][ref1] of [14 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel14
    url: https://wetten.overheid.nl/BWBR0004593/2009-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '14'
  - number: '22.8'
    text: |-
