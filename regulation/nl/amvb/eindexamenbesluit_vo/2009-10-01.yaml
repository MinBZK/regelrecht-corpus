        artikel: 26n
  - number: '23.3'
    text: |-
      Voor zover het betreft een leer-werktraject als bedoeld in [artikel 10b1 van de wet][ref1], omvat het eindexamen
      voor de leerling die dat traject heeft gevolgd, het vak Nederlandse taal en het beroepsgerichte programma dat
      onderdeel is van het leerwerktraject. Bovendien kan de leerling eindexamen afleggen in de andere vakken van
      de basisberoepsgerichte leerweg, bedoeld in [artikel 10b van de wet][ref2], waarvan het bevoegd gezag op grond
      van [artikel 10b1, derde lid, van de wet][ref3] in voorkomend geval heeft beslist dat zij behoren tot het leer-
      werktraject van de leerling.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b1
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10b1
