        afdeling: '1'
  - number: 60c
    text: |-
      1 De kandidaat kan de toetsen van het centraal examen in het eerste en in het tweede tijdvak voor het eerst
      afleggen.

      2 De kandidaat stelt de directeur uiterlijk 23 april op een door de directeur te bepalen wijze in kennis van de
      toetsen van het centraal examen die hij in het eerste of tweede tijdvak voor het eerst wil afleggen.

      3 Indien de kandidaat de directeur niet overeenkomstig het tweede lid in kennis stelt, laat de directeur uiterlijk
      30 april aan de kandidaat weten welke toetsen van het centraal examen de kandidaat in het eerste en het tweede
      tijdvak voor het eerst aflegt.

      4 In aanvulling op [artikel 45, eerste en tweede lid][ref1], geeft de directeur een kandidaat die door te voldoen
      aan de richtlijnen van het Rijksinstituut voor Volksgezondheid en Milieu zoals beschreven in het generiek kader
      voortgezet onderwijs en voortgezet speciaal onderwijs, niet in staat is om één of meerdere toetsen van het centraal
      examen af te leggen de gelegenheid die toetsen in het eerstvolgende tijdvak af te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel45
    url: https://wetten.overheid.nl/BWBR0004593/2021-08-01#Artikel60c
