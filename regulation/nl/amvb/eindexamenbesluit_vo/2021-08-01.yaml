  - number: 60g
    text: |-
      1 Indien dat nodig is om de kandidaat te laten slagen, laten de directeur en de secretaris van het eindexamen
      bij de bepaling van de definitieve uitslag op grond van [artikel 48, eerste lid][ref1], het eindcijfer of de
      kwalificatie van één vak buiten beschouwing.

      2 Het vak bedoeld in het eerste lid kan niet zijn:

      a. het vak Nederlandse taal, bedoeld in [artikel 49, eerste lid, onderdeel b][ref2], voor het eindexamen van een
      leerweg in het vmbo;

      b. het vak Nederlandse taal en literatuur, het vak Engelse taal en literatuur en voor zover van toepassing het vak
      wiskunde A, B of C, bedoeld in [artikel 50, eerste lid, onderdeel b][ref3], voor het eindexamen vwo en havo.

      3 Het eindcijfer bedoeld in het eerste lid kan niet zijn:

      a. het eindcijfer bedoeld in [artikel 49, derde en vierde lid][ref4], voor het eindexamen van een leerweg in het
      vmbo;

      b. het eindcijfer bedoeld in [artikel 50, tweede lid][ref5], voor het eindexamen vwo en havo.

      4 Het eerste lid kan alleen worden toegepast als de kandidaat met inbegrip van het vak dat buiten beschouwing wordt
      gelaten een eindexamen heeft afgerond.

      5 Het cijfer of de kwalificatie, bedoeld in het eerste lid, wordt:

      a. opgenomen op de cijferlijst als bedoeld in [artikel 52, eerste lid][ref6];

      b. betrokken bij de toepassing van [artikel 52a][ref7].

      6 Bij de berekening, bedoeld in [artikel 49, vierde lid][ref8], wordt het gewicht van het profielvak bepaald
      voorafgaand aan toepassing van het eerste lid.


