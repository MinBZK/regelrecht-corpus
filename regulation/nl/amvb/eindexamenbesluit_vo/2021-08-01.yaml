  - number: 61a
    text: |-
      1 Voor de kandidaat die het eindexamen of deeleindexamen voor 1 oktober 2021 afsluit aan een instelling voor
      educatie en beroepsonderwijs, gelden de bij of krachtens het Eindexamenbesluit VO gegeven voorschriften zoals deze
      luidden op 31 juli 2021.

      2 De kandidaat bedoeld in het eerste lid die het eindexamen vmbo aflegt is vrijgesteld van het schoolexamen
      rekenen, indien hij reeds eerder een schoolexamen rekenen vmbo of een schoolexamen rekenen havo heeft afgelegd. De
      vorige volzin is van overeenkomstige toepassing op de kandidaat die het eindexamen havo aflegt en reeds eerder een
      schoolexamen rekenen havo heeft afgelegd.

      3 Dit artikel vervalt op bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0004593/2021-08-01#Artikel61a
  - number: '62'
    text: |-
      1 Het cijfer van het schoolexamen van het profielvak, bedoeld in [artikel 60e, derde lid][ref1], zoals dat
      artikel luidde op 1 mei 2021, wordt betrokken bij de berekening van het rekenkundig gemiddelde, bedoeld in
      [artikel 49, eerste lid, onderdeel a][ref2].

      2 De kandidaat, bedoeld in [artikel 37a][ref3] en [artikel 59][ref4], die in het schooljaar 2020–2021 het
      eindexamen in het profielvak heeft afgerond behoudt het recht, bedoeld in [artikel 51, eerste lid][ref5].

      3 Deze bepaling vervalt op 1 januari 2032.


