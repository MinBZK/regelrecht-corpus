  - number: '31'
    text: |-
      1 Het bevoegd gezag van een school voor voortgezet onderwijs respectievelijk de examencommissie vavo stelt een
      examenreglement vast, dat in elk geval bevat:

      a. regels over de organisatie van het eindexamen en de gang van zaken tijdens het eindexamen;

      b. informatie over de toepassing van de maatregelen bedoeld in [artikel 5][ref1];

      c. inhaal- en herkansingsmogelijkheden van het schoolexamen, waarbij in ieder geval wordt voorzien in een
      inhaalmogelijkheid voor de kandidaat die door ziekte of ten gevolge van een bijzondere van zijn wil onafhankelijke
      omstandigheid niet in staat is geweest aan een of meer toetsen van het schoolexamen deel te nemen; en

      d. in het geval van een school voor voortgezet onderwijs, de samenstelling en het adres van de in
      [artikel 5, vierde en vijfde lid][ref2], bedoelde commissie van beroep.

      2 Het bevoegd gezag van een school voor voortgezet onderwijs wijkt bij de vaststelling van het examenreglement
      slechts af van het voorstel, bedoeld in [artikel 35e, eerste lid, onderdeel a][ref3], nadat het bevoegd gezag:

      a. overleg heeft gepleegd met de examencommissie; en

      b. de afwijking schriftelijk heeft gemotiveerd.

      3 Het bevoegd gezag van een school voor voortgezet onderwijs zendt de schriftelijke motivering, bedoeld in het
      tweede lid, zo spoedig mogelijk aan de examencommissie en de medezeggenschapsraad.

      4 Het bevoegd gezag van een school voor voortgezet onderwijs behoeft voor het vaststellen van het
      examenreglement de instemming van de medezeggenschapsraad van de school voor voortgezet onderwijs bedoeld in
      [artikel 10, eerste lid, onder b, van de Wet medezeggenschap op scholen][ref4].

      5 De examencommissie vavo behoeft voor het vaststellen van het examenreglement de instemming van de studentenraad
      van de instelling voor educatie en beroepsonderwijs, bedoeld in artikel 8a.2.2, derde lid, onder e, van de Wet op
      het beroepsonderwijs.

      6 Het bevoegd gezag van een school voor voortgezet onderwijs respectievelijk de examencommissie vavo zendt
      jaarlijks voor 1 oktober het vastgestelde examenreglement aan de kandidaten en de inspectie.

      7 Dit artikel is van overeenkomstige toepassing op deeleindexamens.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0004593#Artikel35e
      [ref4]: https://wetten.overheid.nl/BWBR0020685#Artikel10
