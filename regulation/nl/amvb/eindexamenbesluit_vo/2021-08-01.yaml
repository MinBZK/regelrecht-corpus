  - number: 60d
    text: |-
      1 Het derde tijdvak wordt onder verantwoordelijkheid van het bevoegd gezag in het laatste leerjaar afgenomen.

      2 [Artikel 37, vierde lid][ref1], is van overeenkomstige toepassing op het derde tijdvak.

      3 [Artikel 37, vijfde lid][ref2], is alleen van toepassing op artikel 37, vierde lid.

      4 In [artikel 45, tweede lid][ref3], wordt in plaats van «ten overstaan van het College voor toetsen en examens»
      gelezen «onder verantwoordelijkheid van het bevoegd gezag».

      5 [Artikel 37, derde lid][ref4], [artikel 37a, vierde lid][ref5], en [artikel 45, derde en vierde lid][ref6],
      blijven buiten toepassing.


