  - number: '38'
    text: |-
      De directeur deelt jaarlijks voor 1 november aan Onze Minister mede hoeveel kandidaten in elk vak aan het centraal
      examen in het eerste tijdvak zullen deelnemen.
    url: https://wetten.overheid.nl/BWBR0004593/2021-08-01#Artikel38
  - number: '40'
    text: |-
      1 Onze Minister zorgt ervoor dat de opgaven, bedoeld in
      [artikel 2, onderdeel c, van de Wet College voor toetsen en examens][ref1] tijdig beschikbaar worden gesteld aan de
      directeur van de school.

      2 De directeur zorgt ervoor, dat de opgaven voor het centraal examen geheim blijven tot de aanvang van de toets
      waarbij deze opgaven aan de kandidaten worden voorgelegd. Het College voor toetsen en examens kan opgaven aanwijzen
      waarop de eerste volzin niet van toepassing is.

      3 Tijdens een toets van het centraal examen worden aan de kandidaten geen mededelingen van welke aard ook,
      aangaande de opgaven gedaan, uitgezonderd mededelingen van het College voor toetsen en examens.

      4 De directeur draagt er zorg voor dat het nodige toezicht bij het centraal examen wordt uitgeoefend.

      5 Zij die toezicht hebben gehouden, maken een proces-verbaal op. Zij leveren dit in bij de directeur samen met het
      gemaakte examenwerk.

      6 Een kandidaat die te laat komt, mag tot uiterlijk een half uur na de aanvang van de toets tot die toets worden
      toegelaten.

      7 De aan de kandidaten voorgelegde opgaven voor een toets van het centraal examen blijven in het examenlokaal tot
      het einde van die toets.


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0004593/2021-08-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
  - number: '41'
    text: |-
      1 De directeur doet het gemaakte werk van het centraal examen met een exemplaar van de opgaven, de
      beoordelingsnormen en met het proces-verbaal van het examen toekomen aan de examinator in het desbetreffende
      vak. De examinator beoordeelt het werk zo spoedig mogelijk en past daarbij de beoordelingsnormen, bedoeld in
      [artikel 2, tweede lid, onderdeel d, van de Wet College voor toetsen en examens][ref1] toe. De examinator drukt
      zijn beoordeling uit in de score, bedoeld in artikel 2, tweede lid, onderdeel d, van de Wet College voor toetsen en
      examens. De examinator zendt de score en het beoordeelde werk aan de directeur.

      2 De directeur doet de van de examinator ontvangen stukken met een exemplaar van de opgaven, de beoordelingsnormen,
      het proces-verbaal en de regels voor het bepalen van de score, bepaald in het eerste lid, onverwijld aan de
      directeur van de school, bedoeld in [artikel 36, tweede lid][ref2], toekomen. De directeur stelt deze documenten
      ter hand aan de gecommitteerde.

      3 De gecommitteerde beoordeelt het werk zo spoedig mogelijk en past daarbij toe de beoordelingsnormen en de daarbij
      behorende scores, bedoeld in [artikel 2, tweede lid, onderdeel d, van de Wet College voor toetsen en examens][ref3].
      De gecommitteerde voegt bij het gecorrigeerde werk een verklaring betreffende de verrichtte correctie. Deze
      verklaring is medeondertekend door het bevoegd gezag van de school waarbij de gecommitteerde werkzaam is.

      4 Bij digitale examinering worden de handelingen, bedoeld in het eerste en tweede lid, digitaal verricht,
      uitgezonderd de handelingen die betrekking hebben op het proces-verbaal.

      5 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven voor de toepassing van het eerste tot en met
      vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0025364#Artikel2
