  - number: '7'
    text: |-
      1 Onze Minister stelt, behalve voor door het bevoegd gezag vast te stellen vakken die onderdeel zijn van het
      eindexamen, voor elk van de schoolsoorten en leerwegen examenprogramma’s vast, waarin zijn opgenomen:

      a. een omschrijving van de examenstof voor ieder eindexamenvak, en

      b. welk deel van de examenstof centraal zal worden geëxamineerd en over welke examenstof het schoolexamen zich
      uitstrekt.

      2 Een examenprogramma wordt vastgesteld per vak of per groep van vakken.
    url: https://wetten.overheid.nl/BWBR0004593/2021-08-01#Artikel7
  - number: '8'
    text: |-
      1 De kandidaten kiezen, met inachtneming van dit hoofdstuk, in welke vakken zij examen willen afleggen. Voor
      leerlingen geldt deze keuze voorzover het bevoegd gezag, al dan niet in samenwerking met het bevoegd gezag van
      een of meer andere scholen, hen in de gelegenheid heeft gesteld zich op het examen in die vakken voor te bereiden.
      Indien sprake is van samenwerking tussen scholen, is [artikel 2 van het Besluit samenwerking VO-BVE][ref1] van
      toepassing.

      2 De kandidaten kunnen, voor zover het bevoegd gezag hun dat toestaat, in extra vakken examen afleggen. Een examen
      als bedoeld in de eerste volzin heeft geen betrekking op vakken die overeenkomen met vakken die onderdeel zijn van
      het eindexamen waarop deze extra vakken een aanvulling zijn.


