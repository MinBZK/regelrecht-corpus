  - number: '36'
    text: |-
      1 Onze Minister maakt een koppeling van scholen en instellingen voor educatie en beroepsonderwijs voor de
      uitvoering van de tweede correctie door gecommitteerden. Onze Minister maakt deze koppeling bekend aan het bevoegd
      gezag van elke school en instelling voor educatie en beroepsonderwijs en kan, zo nodig, zelf een gecommitteerde
      aanwijzen voor een school of instelling. Op grond van deze koppeling wijst het bevoegd gezag een of meer
      gecommitteerden aan. Het bevoegd gezag maakt deze aanwijzing bekend aan de scholen waarvoor zij de tweede correctie
      verrichten. De aanwijzing geldt tot na de afloop van de herkansing.

      2 Het bevoegd gezag draagt er zorg voor dat de aangewezen gecommitteerde zijn verplichtingen nakomt.

      3 In afwijking van het eerste lid, worden voor het praktisch gedeelte van het centraal examen vmbo geen
      gecommitteerden aangewezen.
    url: https://wetten.overheid.nl/BWBR0004593/2021-08-01#Artikel36
  - number: '37'
    text: |-
      1 Het centraal examen voor de scholen voor voortgezet onderwijs kent een eerste, tweede en derde tijdvak.

      2 Het eerste en tweede tijdvak worden afgenomen in het laatste leerjaar.

      3 Het derde tijdvak wordt aansluitend aan het laatste leerjaar afgenomen door het College voor toetsen en examens.

      4 Het College voor toetsen en examens kan vakken aanwijzen waarin wegens het zeer geringe aantal kandidaten, het
      centraal examen in het tweede tijdvak wordt afgenomen door het College voor toetsen en examens.

      5 Bij toepassing van het derde of vierde lid, gelden de volgende regels:

      a. de directeur deelt aan Onze Minister mee welke kandidaten het centraal examen zullen afleggen en in welke
      vakken;

      b. de kandidaten leveren de opgaven, de door hen gemaakte aantekeningen alsmede andere door hen gemaakte stukken
      in bij een van degenen die toezicht houden. Het College voor toetsen en examens bepaalt, in welke gevallen wordt
      afgeweken van de eerste volzin alsmede in welke gevallen en op welk tijdstip de opgaven, de aantekeningen en de
      andere stukken, bedoeld in die volzin aan de kandidaten worden teruggegeven;

      c. het College voor toetsen en examens deelt het door de kandidaat behaalde cijfer voor het centraal examen aan de
      directeur mee.

      6 Het College voor toetsen en examens kan bepalen dat een toets wordt afgenomen op een tijdstip dat is gelegen voor
      de aanvang van het eerste tijdvak.

      7 Het College voor toetsen en examens kan voor een toets een afnameperiode instellen waarbinnen het bevoegd gezag
      zelf de afnametijdstippen bepaalt. Deze afnameperiode vangt niet eerder aan dan op 1 april van het desbetreffende
      examenjaar en omvat het eerste en tweede tijdvak van dat examenjaar.

      8 Het College voor toetsen en examens kan regels stellen voor de uitvoering van een toets van het centraal examen.
    url: https://wetten.overheid.nl/BWBR0004593/2021-08-01#Artikel37
  - number: 37a
    text: |-
      1 In afwijking van [artikel 37, tweede lid][ref1], kan het bevoegd gezag een leerling uit het voorlaatste of direct
      daaraan voorafgaande leerjaar toelaten tot het centraal examen in één of meer vakken, niet zijnde alle vakken van
      het eindexamen.

      2 Bij toepassing van het eerste lid wordt het schoolexamen in dat vak of die vakken afgesloten voordat in dat
      leerjaar het centraal examen in dat vak of die vakken aanvangt.

      3 [Artikel 49, zevende lid][ref2], en [artikel 50, vijfde lid][ref3], zijn van overeenkomstige toepassing.

      4 Indien toepassing wordt gegeven aan het eerste lid, wordt het derde tijdvak aansluitend aan het voorlaatste of
      direct daaraan voorafgaande leerjaar afgenomen door het College voor toetsen en examens.

      5 Indien de leerling in één of meer vakken centraal examen heeft afgelegd in het voorlaatste of direct daaraan
      voorafgaande leerjaar, en niet is bevorderd tot het volgende leerjaar, vervallen de met dit centraal examen of deze
      centrale examens behaalde resultaten.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0004593#Artikel50
    url: https://wetten.overheid.nl/BWBR0004593/2021-08-01#Artikel37a
