  - number: '3'
    text: |-
      De directeur en de examinatoren van een school voor voortgezet onderwijs nemen onder verantwoordelijkheid van het
      bevoegd gezag het eindexamen of deeleindexamen af.
    url: https://wetten.overheid.nl/BWBR0004593/2021-08-01#Artikel3
  - number: 3a
    text: |-
      1 De directeur van een school voor voortgezet onderwijs wijst een of meer van de personeelsleden van de school aan
      tot examensecretaris van het eindexamen. Een examensecretaris is tevens examensecretaris van de deeleindexamens.

      2 De directeur en de examensecretaris van een school voor voortgezet onderwijs verrichten gezamenlijk de taken
      bedoeld in de [artikelen 33, tweede lid][ref1], [48, eerste en derde lid][ref2], [52, zesde lid][ref3], en
      [59, vierde lid][ref4].

      3 De examensecretaris heeft de taak om de directeur te ondersteunen bij:

      a. het organiseren en afnemen van het eindexamen of het deeleindexamen bedoeld in het eerste lid;

      b. de uitvoering van het examenreglement bedoeld in [artikel 31, eerste lid][ref5];

      c. de uitvoering van het programma van toetsing en afsluiting bedoeld in [artikel 31a, eerste lid][ref6]; en

      d. de verstrekking van een overzicht van de onderdelen en beoordeling van de schoolexamens bedoeld in
      [artikel 33][ref7].

      4 De directeur stelt een taakomschrijving voor de examensecretaris vast waarin in ieder geval de taken bedoeld in
      het tweede en derde lid worden opgenomen.

      5 De directeur verstrekt de taakomschrijving aan het bevoegd gezag, aan de examensecretaris en aan de
      examencommissie.

      6 De directeur draagt er zorg voor dat het deskundig functioneren van de examensecretaris is gewaarborgd.


