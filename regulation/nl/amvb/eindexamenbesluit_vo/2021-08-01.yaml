  - number: 60e
    text: |-
      1 Het schoolexamen van het profielvak en het schoolexamen van het beroepsgericht keuzevak worden uiterlijk 23 juli
      afgesloten.

      2 Het cspe wordt niet afgenomen.

      3 Het eindexamen van het profielvak wordt afgesloten met een schoolexamen dat de examenstof van het examenprogramma
      van het profielvak beslaat.

      4 Het bevoegd gezag biedt de kandidaat een gelegenheid tot herkansing van ten minste een significant onderdeel van
      het schoolexamen in het profielvak.

      5 In afwijking van [artikel 35, eerste lid][ref1], wordt het cijfer van het schoolexamen, bedoeld in het derde lid,
      uitgedrukt in een cijfer met 1 decimaal.

      6 [Artikel 47, tweede lid][ref2], laatste volzin is van overeenkomstige toepassing op de afronding van het
      eindcijfer van het eindexamen in het profielvak.

      7 Het cijfer, bedoeld in het vijfde lid, wordt betrokken bij de berekening van het rekenkundig gemiddelde, bedoeld
      in [artikel 49, eerste lid, onderdeel a][ref3].

      8 [Artikel 41a][ref4] en [artikel 51, eerste lid][ref5], blijven buiten toepassing voor zover deze bepalingen
      betrekking hebben op het cspe.


