  - number: 41a
    text: |-
      1 De directeur draagt er zorg voor dat bij het maken van het cspe van een eindexamen vmbo, een
      examinator in het desbetreffende vak of programma aanwezig is. De examinator beoordeelt de prestaties
      tijdens het maken van de opgaven en legt zijn bevindingen van de verrichtingen van de kandidaat
      schriftelijk vast, volgens daartoe door het College voor toetsen en examens gegeven richtlijnen. De
      examinator beoordeelt het werk zo spoedig mogelijk en past daarbij toe de beoordelingsnormen, bedoeld in
      [artikel 2, tweede lid, onderdeel d, van de Wet College voor toetsen en examens][ref1]. De examinator drukt zijn
      beoordeling uit in de score, bedoeld in artikel 2, tweede lid, onderdeel d, van de Wet College voor toetsen en
      examens. De examinator zendt de score en voor zover mogelijk het beoordeelde werk aan de directeur.

      2 Voor het cspe vmbo vindt de beoordeling tevens plaats door een tweede examinator. De tweede examinator kan een
      deskundige als bedoeld in [artikel 29, tweede lid, van de wet][ref2] of een andere examinator van de school zijn.
      De tweede examinator beoordeelt het resultaat van de opgaven, alsmede de verrichtingen van de kandidaat zoals
      blijkend uit de in het eerste lid bedoelde schriftelijke vastlegging daarvan. De directeur overhandigt de tweede
      examinator daartoe een exemplaar van de opgaven, de beoordelingsnormen, het proces-verbaal, alsmede de regels
      voor het bepalen van de score, bedoeld in het eerste lid. [Artikel 41, vierde lid][ref3], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0004593#Artikel41
