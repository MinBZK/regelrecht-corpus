    text: |-
      1 Het eindexamen vmbo voor zover het betreft de basisberoepsgerichte leerweg, genoemd in
      [artikel 10b van de wet][ref1], omvat in elk geval:

      a. de vakken die het gemeenschappelijk deel ingevolge in [artikel 10b, vijfde lid, van de wet][ref2], omvat,

      b. de twee algemene vakken die het profieldeel ingevolge [artikel 10b, zesde lid, van de wet][ref3], omvat, en

      c. een beroepsgericht programma, bestaande uit:

      1°. het profielvak dat het profieldeel ingevolge [artikel 10b, zesde lid, van de wet][ref4], omvat, en

      2°. in het vrije deel vier beroepsgerichte keuzevakken, als bedoeld in
      [artikel 10b, zevende lid, onderdeel a, van de wet][ref5].

      2 In afwijking van het eerste lid is de kandidaat met het profiel economie en ondernemen, het profiel horeca,
      bakkerij en recreatie, of met leerwegondersteunend onderwijs, ten aanzien van wie toepassing is gegeven aan
      [artikel 26n, tweede of derde lid, van het Inrichtingsbesluit WVO][ref6], bij het eindexamen vrijgesteld van het
      vak Franse taal of het vak Duitse taal. In plaats hiervan omvat het eindexamen één van de vakken gekozen op grond
      van [artikel 22, derde lid, van het Inrichtingsbesluit WVO][ref7].

      3 Voor zover het betreft een leer-werktraject als bedoeld in [artikel 10b1 van de wet][ref8], omvat het eindexamen
      voor de leerling die dat traject heeft gevolgd, het vak Nederlandse taal en het beroepsgerichte programma dat
      onderdeel is van het leerwerktraject. Bovendien kan de leerling eindexamen afleggen in de andere vakken van de
      basisberoepsgerichte leerweg, bedoeld in [artikel 10b van de wet][ref9], waarvan het bevoegd gezag op grond van
      [artikel 10b1, derde lid, van de wet][ref10] in voorkomend geval heeft beslist dat zij behoren tot het leer-
      werktraject van de leerling.

      4 In geval van toepassing van [artikel 10b, negende lid, onderdelen a en c, van de wet][ref11],
      dan wel [artikel 10b, negende lid, onderdeel d, van de wet][ref12] juncto
      [artikel 26h, tweede lid, van het Inrichtingsbesluit WVO][ref13], zijn het eerste tot en met het derde lid van
      toepassing, met dien verstande dat het vervangen vak niet als extra vak als bedoeld in het vijfde lid, kan dienen.

      5 In aanvulling op de voorgeschreven vakken, bedoeld in het eerste lid, kan het eindexamen omvatten, voor zover nog
      niet gekozen:

      a. een vak, genoemd in [artikel 10b, zesde lid, van de wet][ref14], of een vak als bedoeld in artikel 10b, zevende
      lid, onderdeel a, van de wet,

      b. het vak Friese taal en cultuur, genoemd in [artikel 26h, tweede lid, van het Inrichtingsbesluit WVO][ref15],

      c. een vak dat op grond van het tweede lid onderdeel kan zijn van de basisberoepsgerichte leerweg,

      d. een algemeen vak dat behoort tot het eindexamen van de theoretische leerweg, de kaderberoepsgerichte leerweg of
      de gemengde leerweg, genoemd in respectievelijk de [artikelen 10][ref16], [10b][ref17] of [10d van de wet][ref18],
      of

      e. een vak als bedoeld in [artikel 13][ref19] of [14 van de wet][ref20].

      6 In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een school voor vmbo, voor zover
      het betreft de basisberoepsgerichte leerweg, bij het eindexamen vrijgesteld van het vak lichamelijke opvoeding
      waarvoor vrijstelling is verleend op grond van [artikel 26n, eerste lid, van het Inrichtingsbesluit WVO][ref21].


