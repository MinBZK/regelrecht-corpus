        artikel: 35c
        hoofdstuk: III
        afdeling: '2'
  - number: '35'
    text: |-
      1 Het cijfer van het schoolexamen wordt uitgedrukt in een cijfer uit een schaal van cijfers lopende van 1 tot en
      met 10.

      2 Indien in een vak tevens centraal examen wordt afgelegd, worden de in het eerste lid genoemde cijfers gebruikt
      met de daartussen liggende cijfers met 1 decimaal.

      3 In afwijking van het eerste lid, worden de kunstvakken en het vak lichamelijke opvoeding uit het
      gemeenschappelijk deel van elk profiel, beoordeeld met «voldoende» of «goed». Deze beoordeling gaat uit van de
      mogelijkheden van de leerling en geschiedt op de grondslag van het genoegzaam afsluiten van de desbetreffende
      vakken, zoals blijkend uit het examendossier.

      4 In afwijking van het eerste lid wordt het profielwerkstuk in het vmbo beoordeeld met «voldoende» of «goed». Deze
      beoordeling geschiedt op de grondslag van het genoegzaam voltooien van het profielwerkstuk, zoals blijkend uit het
      examendossier. Het profielwerkstuk in het vmbo wordt beoordeeld door ten minste twee examinatoren.
    url: https://wetten.overheid.nl/BWBR0004593/2021-08-01#Artikel35
  - number: 35b1
    text: |-
      1 Het bevoegd gezag kan bepalen dat de kandidaat die eindexamen of deeleindexamen aflegt, voor één of meer vakken
      het schoolexamen waarin geen centraal examen wordt afgenomen, opnieuw kan afleggen, met dien verstande dat het
      bevoegd gezag dit recht in elk geval verleent voor het vak maatschappijleer behorend tot het gemeenschappelijk deel
      van de leerwegen, indien de kandidaat voor dat vak een eindcijfer heeft behaald lager dan 6. Het herexamen omvat
      door het bevoegd gezag aangegeven onderdelen van het examenprogramma.

      2 Het bevoegd gezag stelt vast hoe het cijfer van het in het eerste lid bedoelde herexamen wordt bepaald. Het
      hoogste van de cijfers behaald bij het herexamen in een vak en bij het eerder afgelegde schoolexamen in dat vak
      geldt als het definitieve cijfer van het schoolexamen in dat vak.
    url: https://wetten.overheid.nl/BWBR0004593/2021-08-01#Artikel35b1
  - number: 35c
    text: |-
      Het schoolexamen bestaat uit een examendossier. Het examendossier is het geheel van de
      onderdelen van het schoolexamen zoals gedocumenteerd in een door het bevoegd gezag gekozen
      vorm. Het examendossier voor het vmbo omvat tevens de resultaten die de leerling heeft behaald
      voor de vakken, bedoeld in [artikel 26g, eerste lid, van het Inrichtingsbesluit WVO][ref1] of
      [artikel 26i, tweede lid, van dat besluit][ref2], voor zover in die vakken geen eindexamen is afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel26g
      [ref2]: https://wetten.overheid.nl/BWBR0005946#Artikel26i
    url: https://wetten.overheid.nl/BWBR0004593/2021-08-01#Artikel35c
