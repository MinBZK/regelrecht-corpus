  - number: 10a
    text: |-
      Een verzoek om ontheffing als bedoeld in [artikel 10][ref1] wordt schriftelijk ingediend bij het College voor
      toetsen en examens, onder overlegging van een uittreksel uit het geboorte- of persoonsregister en een gewaarmerkte
      fotokopie van het diploma, getuigschrift, certificaat of andere bewijsstuk waarop het verzoek om ontheffing berust.


