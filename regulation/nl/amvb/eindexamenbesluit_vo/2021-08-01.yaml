  - number: '32'
    text: |-
      1 Het bevoegd gezag bepaalt het tijdstip waarop het schoolexamen aanvangt.

      2 Het schoolexamen wordt afgesloten voor de aanvang van het eerste tijdvak, bedoeld in [artikel 37][ref1]. Bij
      toepassing van artikel 37, zevende lid, wordt het schoolexamen in het vak waarop de toets betrekking heeft,
      afgesloten tien werkdagen voor de afname van die toets.

      3 Het bevoegd gezag kan in afwijking van het tweede lid een kandidaat die ten gevolge van ziekte of een andere
      van zijn wil onafhankelijke omstandigheid het schoolexamen in één of meer vakken niet heeft kunnen afsluiten voor
      de aanvang van het eerste tijdvak, in de gelegenheid stellen het schoolexamen in dat vak of in die vakken af te
      sluiten vóór het centraal examen in dat vak of in die vakken, doch na de aanvang van het eerste tijdvak.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel37
    url: https://wetten.overheid.nl/BWBR0004593/2021-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '37'
        hoofdstuk: IV
  - number: '33'
    text: |-
      1 Voor de aanvang van het eerste tijdvak van het centraal examen verstrekt de directeur respectievelijk de
      examencommissie vavo aan de kandidaat, voor zover van toepassing, het volgende:

      a. een overzicht van behaalde resultaten van alle onderdelen in het examendossier bedoeld in [artikel 35c][ref1];

      b. een overzicht van de cijfers die de kandidaat heeft behaald voor het schoolexamen;

      c. de beoordeling voor de vakken waarvoor geen cijfer wordt vastgesteld; en

      d. de beoordeling van het profielwerkstuk in het vmbo.

      2 De directeur, de examensecretaris dan wel de examencommissie vavo tekenen voor verstrekking van de in het eerste
      lid genoemde overzichten en beoordelingen aan de kandidaat.

      3 De kandidaat tekent voor ontvangst van de in het eerste lid genoemde overzichten en beoordelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel35c
    url: https://wetten.overheid.nl/BWBR0004593/2021-08-01#Artikel33
