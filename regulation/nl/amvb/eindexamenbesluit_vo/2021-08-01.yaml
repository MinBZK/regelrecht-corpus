      a. de vakken die het gemeenschappelijk deel ingevolge [artikel 10d, vijfde lid, van de wet][ref2], omvat,

      b. de twee algemene vakken die het profieldeel ingevolge [artikel 10d, zesde lid, van de wet][ref3], omvat
      waaronder tevens begrepen een profielwerkstuk,

      c. in het vrije deel een nog niet in het profieldeel gekozen algemeen vak, bedoeld onderscheidenlijk genoemd in
      [artikel 10d, zevende lid, onderdelen a en c, van de wet][ref4], en

      d. een beroepsgericht programma, bestaande uit:

      1°. het profielvak dat het profieldeel ingevolge [artikel 10d, zesde lid, van de wet][ref5] omvat, en

      2°. in het vrije deel twee beroepsgerichte keuzevakken als bedoeld in
      [artikel 10d, zevende lid, onderdeel b, van de wet][ref6].

      2 [Artikel 23, tweede lid][ref7], is van overeenkomstige toepassing.

      3 In geval van toepassing van [artikel 10d, negende lid, van de wet][ref8], zijn het eerste en tweede lid van
      toepassing, met dien verstande dat het vervangen vak niet als extra vak als bedoeld in het vierde lid, kan dienen.

      4 In aanvulling op de voorgeschreven vakken, bedoeld in het eerste lid, kan het eindexamen omvatten, voor zover
      nog niet gekozen, een vak als bedoeld in [artikel 10d, zevende lid, onderdelen a, b en c, van de wet][ref9], of als
      bedoeld in [artikel 13][ref10] of [14 van de wet][ref11].

      5 In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een school voor vmbo, voor zover
      het betreft de gemengde leerweg, bij het eindexamen vrijgesteld van het vak lichamelijke opvoeding waarvoor
      vrijstelling is verleend op grond van [artikel 26n, eerste lid, van het Inrichtingsbesluit WVO][ref12].


