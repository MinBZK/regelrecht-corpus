  - number: '26'
    text: |-
      In afwijking van [artikel 22, eerste lid][ref1], [23, eerste lid][ref2],
      [24, eerste lid][ref3], of [25, eerste lid][ref4], is de kandidaat die op grond van
      [artikel 26n, vierde, vijfde, zesde of zevende lid, van het Inrichtingsbesluit WVO][ref5] voor een vak als daar
      bedoeld is vrijgesteld van het volgen van onderwijs, eveneens vrijgesteld van het afleggen van eindexamen in dat
      vak.


