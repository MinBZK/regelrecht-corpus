  - number: 8a
    text: |-
      Indien het eindexamen één of meer vakken omvat van een andere schoolsoort of leerweg dan die waarvoor de kandidaat
      is ingeschreven, behoort ten minste één vak tot de voorgeschreven eindexamenvakken van de schoolsoort of leerweg
      van inschrijving.
    url: https://wetten.overheid.nl/BWBR0004593/2021-08-01#Artikel8a
  - number: '9'
    text: |-
      1 Onverminderd vrijstellingen en ontheffingen als bedoeld in de [artikelen 11][ref1], [12][ref2], [13][ref3] en
      [22][ref4] is de kandidaat die het eindexamen aflegt aan een instelling voor educatie en beroepsonderwijs:

      a. vrijgesteld van het examen in een vak van de theoretische leerweg in het vmbo op grond van een examen vwo, havo,
      theoretische leerweg of gemengde leerweg vmbo, indien voor het overeenkomstige vak een eindcijfer 6 of hoger of een
      daarmee overeenkomende waardering is behaald;

      b. vrijgesteld van het examen in een vak in het havo op grond van een examen vwo of havo, indien voor het
      overeenkomstige vak een eindcijfer 6 of hoger of een daarmee overeenkomende waardering is behaald;

      c. vrijgesteld van het examen in een vak in het vwo op grond van een examen vwo, indien voor het overeenkomstige
      vak een eindcijfer 6 of hoger of een daarmee overeenkomende waardering is behaald;

      d. vrijgesteld van het examen in een vak van het vwo, havo of vmbo op grond van het overeenkomstige examen,
      afgelegd in Curaçao, Sint Maarten, Aruba, Bonaire, Saba of Sint Eustatius, indien voor het overeenkomstige vak een
      eindcijfer 6 of hoger of een daarmee overeenkomende waardering is behaald;

      e. vrijgesteld van het profielwerkstuk vwo of havo, indien reeds eerder een profielwerkstuk is gemaakt dat
      betrekking heeft op een of meer vakken van dezelfde schoolsoort, behorende tot het profiel van de kandidaat en
      waarvoor een eindcijfer 6 of hoger is behaald;

      f. vrijgesteld van het profielwerkstuk vmbo, indien reeds eerder een profielwerkstuk vmbo is gemaakt dat betrekking
      heeft op een thema uit het profiel van de kandidaat, en dat is beoordeeld als «voldoende» of «goed».

      2 Het eerste lid is uitsluitend van toepassing indien na het jaar waarin het eindcijfer of de beoordeling is
      vastgesteld, nog geen 10 jaren zijn verstreken. Het eerste lid, onderdeel f, is daarbij van overeenkomstige
      toepassing op een reeds eerder gemaakt sectorwerkstuk dat is beoordeeld als «voldoende» of «goed».

      3 In aanvulling op het eerste lid, onder a tot en met d, is de daar bedoelde kandidaat eveneens vrijgesteld
      indien het eindcijfer 5 of 4 is behaald, mits de kandidaat voldoet aan de voorwaarden van [artikel 49][ref5] of
      [artikel 50][ref6] om te slagen voor het eindexamen.

      4 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven voor de toepassing van het eerste lid.


