  - number: '60'
    text: |-
      Onze Minister kan bij of krachtens dit besluit vastgestelde voorschriften buiten toepassing laten of daarvan
      afwijken voor zover onverkorte toepassing zal leiden tot onbillijkheden van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0004593/2021-08-01#Artikel60
  - number: 60a
    text: |-
      De bepalingen in dit hoofdstuk zijn van toepassing op de eindexamens die worden afgenomen in het schooljaar 2020–
      2021.
    url: https://wetten.overheid.nl/BWBR0004593/2021-08-01#Artikel60a
  - number: 60b
    text: |-
      1 Het bevoegd gezag respectievelijk de examencommissie vavo wijzigt het examenreglement en het programma van
      toetsing en afsluiting, bedoeld in [artikel 31][ref1], in het geval:

      a. onderdelen van het examenreglement of het programma van toetsing en afsluiting als gevolg van de covid-19
      epidemie praktisch onuitvoerbaar zijn; of

      b. dat ter uitvoering van dit hoofdstuk noodzakelijk is.

      2 Een wijziging, als bedoeld in het eerste lid, wordt schriftelijk gemotiveerd en na vaststelling onverwijld door
      de directeur toegezonden aan de inspectie en verstrekt aan de kandidaten.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel31
    url: https://wetten.overheid.nl/BWBR0004593/2021-08-01#Artikel60b
