  - number: 31c
    text: |-
      1 Het bevoegd gezag van een school voor voortgezet onderwijs respectievelijk de examencommissie vavo kan het
      programma van toetsing en afsluiting na 1 oktober slechts wijzigen:

      a. in het geval van een bijzonder onvoorziene omstandigheid die leidt tot praktische onuitvoerbaarheid van het
      programma van toetsing en afsluiting; of

      b. ter verbetering van een kennelijke onjuistheid of kennelijke onvolledigheid in het programma van toetsing en
      afsluiting.

      2 De examencommissie van de school voor voortgezet onderwijs wordt vooraf in de gelegenheid gesteld om te adviseren
      over een wijziging als bedoeld in het eerste lid.

      3 Het bevoegd gezag van een school voor voortgezet onderwijs wijkt bij de vaststelling van een wijziging van het
      programma van toetsing en afsluiting slechts af van het advies van de examencommissie nadat het bevoegd gezag:

      a. overleg heeft gepleegd met de examencommissie; en

      b. de afwijking schriftelijk heeft gemotiveerd.

      4 Het [derde, vierde en vijfde lid van artikel 31b][ref1] zijn van overeenkomstige toepassing op de vaststelling
      van de wijziging van het programma van toetsing en afsluiting na 1 oktober.

      5 Dit artikel is van overeenkomstige toepassing op deeleindexamens.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel31b
