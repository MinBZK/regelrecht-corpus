  - number: '55'
    text: |-
      1 De directeur kan toestaan dat een gehandicapte kandidaat het examen geheel of gedeeltelijk aflegt op een wijze
      die is aangepast aan de mogelijkheden van die kandidaat. In dat geval bepaalt de directeur de wijze waarop het
      examen zal worden afgelegd, met dien verstande dat aan de overige bepalingen in dit besluit wordt voldaan. Hij doet
      hiervan zo spoedig mogelijk mededeling aan de inspectie.

      2 Tenzij sprake is van een objectief waarneembare lichamelijke handicap, geldt ten aanzien van de in het eerste lid
      bedoelde aangepaste wijze van examineren dat:

      a. er een deskundigenverklaring is die door een ter zake kundige psycholoog, orthopedagoog, neuroloog of psychiater
      is opgesteld,

      b. de aanpassing voor zover betrekking hebbend op het centraal examen in ieder geval kan bestaan uit een verlenging
      van de duur van de desbetreffende toets van het centraal examen met ten hoogste 30 minuten, en

      c. een andere aanpassing slechts kan worden toegestaan voor zover daartoe in de onder a genoemde
      deskundigenverklaring ten aanzien van betrokkene een voorstel wordt gedaan dan wel indien de aanpassing aantoonbaar
      aansluit bij de begeleidingsadviezen, vermeld in die deskundigenverklaring.

      3 Het bevoegd gezag kan in verband met onvoldoende beheersing van de Nederlandse taal afwijken van de voorschriften
      gegeven bij of krachtens dit besluit, ten aanzien van een kandidaat die met inbegrip van het schooljaar waarin hij
      eindexamen aflegt, ten hoogste zes jaren onderwijs in Nederland heeft gevolgd en voor wie het Nederlands niet de
      moedertaal is. De in de eerste volzin bedoelde afwijking kan betrekking hebben op:

      a. het vak Nederlandse taal en literatuur;

      b. het vak Nederlandse taal;

      c. enig ander vak waarbij het gebruik van de Nederlandse taal van overwegende betekenis is.

      4 De in het derde lid bedoelde afwijking bestaat voor zover betrekking hebbend op het centraal examen slechts uit
      een verlenging van de duur van de desbetreffende toets van het centraal examen met ten hoogste 30 minuten en het
      verlenen van toestemming tot het gebruik van een verklarend woordenboek der Nederlandse taal.

      5 Van elke afwijking op grond van het derde lid wordt mededeling gedaan aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0004593/2021-08-01#Artikel55
  - number: '57'
    text: |-
      1 Het werk van het centraal examen der kandidaten wordt gedurende ten minste zes maanden na de vaststelling van de
      uitslag bewaard door de directeur, ter inzage voor belanghebbenden.

      2 De directeur draagt er zorg voor dat een volledig stel van de bij de centrale examens gebruikte opgaven gedurende
      ten minste zes maanden na de vaststelling van de uitslag bewaard blijft in het archief van de school.

      3 Een kandidaat die voor een vak ten overstaan van het College voor toetsen en examens centraal examen aflegt met
      geheime opgaven, kan omtrent zijn werk gedurende genoemde periode van zes maanden inlichtingen inwinnen bij het
      College voor toetsen en examens.
    url: https://wetten.overheid.nl/BWBR0004593/2021-08-01#Artikel57
  - number: '58'
    text: |-
      Ten behoeve van experimenten met een andere inrichting van het eindexamen kan Onze Minister toestaan dat van dit
      besluit wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0004593/2021-08-01#Artikel58
  - number: '59'
    text: |-
      1 Het bevoegd gezag kan, de inspectie gehoord, toestaan dat een kandidaat die in het laatste leerjaar langdurig
      ziek is, en een kandidaat die lange tijd ten gevolge van een bijzondere, van de wil van de kandidaat onafhankelijke
      omstandigheid niet in staat is geweest het onderwijs in alle betrokken eindexamenvakken gedurende het laatste
      leerjaar te volgen, het centraal examen en in voorkomend geval het schoolexamen, voor een deel van de vakken in het
      ene schooljaar en voor het andere deel in het daarop volgende schooljaar aflegt. In dat geval wordt het eindexamen
      in een vak in het eerste of in het tweede van deze schooljaren afgesloten.

      2 Het bevoegd gezag geeft zijn in het eerste lid bedoelde toestemming uiterlijk voor de aanvang van het eerste
      tijdvak van het centraal examen. In bijzondere gevallen kan het bevoegd gezag afwijken van de eerste volzin ten
      behoeve van een kandidaat die nog niet in alle betrokken eindexamenvakken centraal examen heeft afgelegd.

      3 [Artikel 51, eerste tot en met vierde lid][ref1], is ten aanzien van de kandidaat van toepassing in het eerste en
      in het tweede schooljaar van het gespreid centraal examen, met dien verstande dat het in dat artikel bedoelde recht
      in het eerste schooljaar ontstaat nadat de eindcijfers van de vakken waarvoor in het eerste schooljaar het centraal
      examen is afgesloten, voor de eerste maal zijn vastgesteld.

      4 De directeur en de examensecretaris stellen op verzoek van de kandidaat de uitslag van het eindexamen reeds
      vast aan het einde van het eerste schooljaar van het gespreid centraal examen of het gespreid schoolexamen, met
      overeenkomstige toepassing van [artikel 49][ref2] of [artikel 50][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0004593#Artikel50
