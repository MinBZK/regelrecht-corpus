        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020685
        artikel: '4'
  - number: 35e
    text: |-
      1 De examencommissie heeft voor de borging van de kwaliteit van de schoolexaminering de volgende taken en
      bevoegdheden:

      a. het opstellen van een voorstel voor een examenreglement als bedoeld in [artikel 31][ref1] voor het bevoegd
      gezag;

      b. het jaarlijks opstellen van een voorstel voor een programma van toetsing en afsluiting als bedoeld in
      [artikel 31a][ref2] voor het bevoegd gezag;

      c. het borgen van het afsluitend karakter en de kwaliteit van het schoolexamen;

      d. het vaststellen van richtlijnen en aanwijzingen om te komen tot een beoordeling van het schoolexamen; en

      e. overige door het bevoegd gezag aan de commissie opgedragen taken en bevoegdheden.

      2 De examencommissie stelt regels vast over haar werkwijze.

      3 De examencommissie stelt jaarlijks een verslag op van haar werkzaamheden.

      4 De examencommissie evalueert jaarlijks de kwaliteit van de schoolexaminering en stelt een advies op aan het
      bevoegd gezag en de directeur over noodzakelijke en wenselijke verbeteringen.

      5 De examencommissie verstrekt de regels over haar werkwijze, het verslag, de evaluatie en het advies bedoeld in
      het tweede tot en met het vierde lid, aan het bevoegd gezag, aan de directeur en aan de examensecretaris van een
      school voor voortgezet onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel31a
