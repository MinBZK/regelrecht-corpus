  - number: 52b
    text: |-
      De directeur van een scholengemeenschap of school voor vwo die gymnasium verzorgt, kan in plaats van een diploma
      gymnasium een diploma atheneum uitreiken aan een kandidaat indien:

      a. de scholengemeenschap of school voor vwo atheneum onderwijs verzorgt;

      b. de scholengemeenschap of school voor vwo overeenkomstig [artikel 21 van de wet][ref1] kenbaar heeft gemaakt dat
      het behalen van een diploma atheneum en het volgen van atheneumonderwijs mogelijk is; en

      c. de kandidaat staat ingeschreven voor atheneum onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel21
