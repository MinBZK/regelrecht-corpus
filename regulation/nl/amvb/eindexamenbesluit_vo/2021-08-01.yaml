  - number: '61'
    text: |-
      1 Het eindexamen vmbo en havo omvat voor leerlingen die geen eindexamen afleggen in het vak wiskunde een
      schoolexamen rekenen als bedoeld in [artikel 118jj van de wet][ref1].

      2 In afwijking van het eerste lid is een kandidaat die in het bezit is van het diploma van
      een leerweg in het vmbo en die het schoolexamen rekenen heeft afgelegd zoals dit op grond van
      [artikel 2, tweede lid, aanhef en onderdeel c, van de Wet referentieniveaus Nederlandse taal en rekenen][ref2]
      is vastgesteld voor het eindexamen vmbo, bij het afleggen van het eindexamen in een andere leerweg van het vmbo,
      vrijgesteld van het schoolexamen rekenen.

      2a In afwijking van het eerste lid is de kandidaat die het eindexamen vmbo aflegt aan een instelling voor educatie
      en beroepsonderwijs vrijgesteld van het schoolexamen rekenen, indien hij reeds eerder een schoolexamen rekenen
      vmbo of een schoolexamen rekenen havo heeft gemaakt. De vorige volzin is van overeenkomstige toepassing op de
      kandidaat die het eindexamen havo aflegt aan een instelling voor educatie en beroepsonderwijs en reeds eerder een
      schoolexamen rekenen havo heeft gemaakt.

      3 Het cijfer voor het schoolexamen rekenen weegt niet mee in de uitslagbepaling voor het eindexamen vmbo en havo,
      bedoeld in de [artikelen 49][ref3] en [50][ref4].

      4 In afwijking van de [artikelen 52, eerste lid, onderdeel a][ref5], [52c, tweede lid][ref6], en
      [53, eerste lid, onderdeel a, en vierde lid, onderdeel b][ref7], wordt het cijfer voor het schoolexamen rekenen
      vermeld op een bijlage bij de cijferlijst.

      5 Indien de kandidaat is vrijgesteld van het schoolexamen rekenen op grond van het tweede lid of lid 2a, wordt het
      schoolexamen rekenen vermeld op een bijlage bij de cijferlijst, zonder vermelding van een cijfer.

      6 Het vierde lid is van overeenkomstige toepassing op het eindcijfer van het vak wiskunde, indien de kandidaat het
      eindexamen wiskunde heeft afgelegd, het eindcijfer voor wiskunde niet is betrokken in de uitslagbepaling, bedoeld
      in [artikel 49][ref8] of [artikel 50][ref9], en de kandidaat bedenkingen heeft geuit tegen het opnemen van het
      eindcijfer van het vak wiskunde op de cijferlijst op grond van [artikel 52, derde lid][ref10].

      7 Dit artikel is van overeenkomstige toepassing op de kandidaat die het eindexamen vmbo in de basisberoepsgerichte
      leerweg aflegt ter afsluiting van een leerwerktraject als bedoeld in [artikel 10b1 van de wet][ref11].

      8 Dit artikel vervalt op een bij koninklijk besluit te bepalen tijdstip.


