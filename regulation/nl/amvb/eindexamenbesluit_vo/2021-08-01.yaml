  - number: '47'
    text: |-
      1 Het eindcijfer voor alle vakken van het eindexamen wordt uitgedrukt in een geheel cijfer uit de reeks 1 tot en
      met 10.

      2 De directeur bepaalt het eindcijfer op het rekenkundig gemiddelde van het cijfer voor het schoolexamen en het
      cijfer voor het centraal examen. Indien de uitkomst van de berekening niet een geheel getal is, wordt dat getal
      indien het eerste cijfer achter de komma een 4 of lager is, naar beneden afgerond en indien dat cijfer een 5 of
      hoger is, naar boven afgerond.

      3 Indien in een vak alleen een schoolexamen is afgenomen en niet tevens een centraal examen, is het cijfer voor het
      schoolexamen tevens het eindcijfer.
    url: https://wetten.overheid.nl/BWBR0004593/2021-08-01#Artikel47
  - number: '48'
    text: |-
      1 De directeur en de examensecretaris van het eindexamen stellen in geval van een eindexamen de uitslag vast met
      inachtneming van [artikel 49][ref1] of [artikel 50][ref2], en voor zover van toepassing [artikel 52c][ref3].

      2 De uitslag luidt «geslaagd» of «afgewezen».

      3 Indien dat nodig is om de kandidaat te laten slagen betrekken de directeur en de examensecretaris van het
      eindexamen een of meer eindcijfers van de vakken niet bij de bepaling van de definitieve uitslag. De overgebleven
      vakken dienen een eindexamen te vormen.

      4 Indien de kandidaat aan een instelling voor educatie en beroepsonderwijs examen aflegt in één vak of in een
      aantal vakken die samen geen eindexamen vormen, kan de kandidaat daaraan voorafgaand aan de examencommissie vavo
      kenbaar maken, het volledig eindexamen te willen afleggen door voor de ontbrekende vakken in aanvulling op de
      cijferlijst voor die vakken aan deze examencommissie één of meer van de volgende bewijsstukken te overleggen:

      a. een of meer in [artikel 52, eerste lid][ref4], of [artikel 52c][ref5], bedoelde cijferlijsten van een school
      voor voortgezet onderwijs, uitgereikt in een eerder jaar;

      b. een of meer door een andere instelling voor educatie en beroepsonderwijs afgegeven cijferlijsten als bedoeld in
      [artikel 52, eerste lid][ref6], of [53, eerste lid][ref7], van dit besluit of op grond van een resultatenlijst als
      bedoeld in [artikel 7.4.6, derde lid, van de Wet educatie en beroepsonderwijs][ref8];

      c. een of meer cijferlijsten als bedoeld in [artikel 30, eerste of tweede lid][ref9], of
      [artikel 31, eerste lid, van het Staatsexamenbesluit VO][ref10];

      d. een of meer bewijzen van ontheffing als bedoeld in [artikel 10, vierde lid][ref11], van dit besluit, of als
      bedoeld in [artikel 11, vierde lid, van het Staatsexamenbesluit VO][ref12].

      5 Cijferlijsten worden uitsluitend bij de vaststelling van de uitslag betrokken, indien na het jaar waarin zij
      zijn vastgesteld, nog geen 10 jaren zijn verstreken. Bewijzen van ontheffing worden uitsluitend bij de vaststelling
      van de uitslag betrokken indien na het jaar waarin het onderliggende diploma, getuigschrift of ander bewijsstuk is
      vastgesteld, nog geen 10 jaren zijn verstreken.

      6 De kandidaat toont in voorkomend geval ten genoegen van de directeur aan dat hij recht heeft op een vrijstelling
      of ontheffing ingevolge [de artikelen 11][ref13], [12][ref14], [13][ref15], [22][ref16], [23][ref17], [24][ref18]
      of [25][ref19], onverminderd de [artikelen 14][ref20] en [26][ref21], of ingevolge [artikel 9][ref22], van dit
      besluit, dan wel als bedoeld in [artikel 10 van het Staatsexamenbesluit VO][ref23].

      7 De directeur vergewist zich ervan dat het eindexamen de in de [artikelen 11][ref24], [12][ref25],[13][ref26],
      [22][ref27], [23][ref28], [24][ref29] of [25][ref30] voorgeschreven vakken omvat.

      8 Indien de kandidaat eindexamen heeft afgelegd en in datzelfde jaar deelstaatsexamen heeft afgelegd of
      deeleindexamen aan een instelling voor educatie en beroepsonderwijs, worden de met het deelstaatsexamen
      respectievelijk deeleindexamen behaalde cijfers, indien de kandidaat daarom tijdig en schriftelijk heeft verzocht,
      betrokken bij de uitslagbepaling.


