preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs en Wetenschappen, mede namens Onze Minister van Landbouw en
    Visserij, van 16 januari 1989, nr. 88040519/3188, centrale directie Wetgeving en Juridische Zaken;

    Gelet op de artikelen 29, 30 en 60 van de Wet op het voortgezet onderwijs;

    Gehoord de Onderwijsraad (advies van 28 oktober 1988, nr. OR/1325 S);

    De Raad van State gehoord (advies van 4 april 1989, nr. W05.89 0025);

    Gezien het nader rapport van de Staatssecretaris van Onderwijs en Wetenschappen, mede namens Onze Minister van
    Landbouw en Visserij, van 16 juni 1989, nr. 89011 016/3188, centrale directie Wetgeving en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004593/2021-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

        - *algemene vakken:* vakken niet zijnde profielvakken, genoemd in [artikel 26h, eerste lid][ref1], respectievelijk
      bedoeld in [artikel 26i, eerste lid, van het Inrichtingsbesluit WVO][ref2], en niet zijnde beroepsgerichte
      keuzevakken als bedoeld in [artikel 26j van dat besluit][ref3];
        - *beroepsgericht keuzevak:* beroepsgericht keuzevak als bedoeld in [artikel 10b, zevende lid, onderdeel a][ref4],
      of [artikel 10d, zevende lid, onderdeel b, van de wet][ref5];
        - *beroepsgericht programma:* beroepsgericht programma als bedoeld in [artikel 23, eerste lid, onderdeel c][ref6],
      [24, eerste lid, onderdeel c][ref7], of [25 eerste lid, onderdeel d][ref8];
        - *bevoegd gezag:* het bevoegd gezag, bedoeld in [artikel 1 van de wet][ref9], indien
      het een school voor voortgezet onderwijs betreft, en het bevoegd gezag, bedoeld in
      [artikel 1.1.1, onderdeel w, onder 1 en 2, van de Wet educatie en beroepsonderwijs][ref10], indien het een
      instelling voor educatie en beroepsonderwijs betreft;
        - *College voor toetsen en examens:* College voor toetsen en examens, genoemd in
      [artikel 2, eerste lid, van de Wet College voor toetsen en examens][ref11];
        - *cspe:* centraal schriftelijk en praktisch examen in een profielvak;
        - *deeleindexamen:* een examen in één of meer van de voor het eindexamen voorgeschreven vakken;
        - *digitale examinering:* het voorbereiden, afnemen en afwikkelen van het centraal examen in één of meer vakken met
      gebruikmaking van de daartoe door het College voor toetsen en examens beschikbaar gestelde programmatuur;
        - *directeur:* de rector of directeur van een school voor voortgezet onderwijs;
        - *eindexamen:* een examen ten minste in het geheel van de voorgeschreven vakken;
        - *eindexamen vmbo:* een eindexamen dat leidt tot een diploma vmbo voor zover het betreft de theoretische leerweg,
      de basisberoepsgerichte leerweg, de kaderberoepsgerichte leerweg of de gemengde leerweg;
        - *examencommissie:* de examencommissie bedoeld in [artikel 35d][ref12];
        - *examencommissie vavo:* de in [artikel 7.4.11, tweede lid][ref13], juncto
      [artikel 7.4.5 van de Wet educatie en beroepsonderwijs][ref14] bedoelde examencommissie voor een opleiding vavo;
        - *examenprogramma:* het examenprogramma bedoeld in [artikel 7][ref15];
        - *examenregeling;* het examenreglement en het programma van toetsing en afsluiting gezamenlijk;
        - *examensecretaris:* de examensecretaris bedoeld in [artikel 3a][ref16];
        - *examenstof:* de aan de kandidaat te stellen eisen;
        - *examinator:* degene die is belast met het afnemen van het examen in een vak;
        - *extra vak:* een vak in aanvulling op de vakken die voor een bepaalde kandidaat ten minste samen een eindexamen
      vormen, welk vak wordt afgesloten met een examen;
        - *gecommitteerde:* een gecommitteerde als bedoeld in [artikel 29, tweede lid, van de wet][ref17] en
      [artikel 36][ref18] van dit besluit;
        - *havo:* hoger algemeen voortgezet onderwijs als bedoeld in [artikel 8 van de wet][ref19];
        - *herkansing:* het opnieuw deelnemen aan een toets van het centraal examen of het schoolexamen;
        - *inspectie:* de inspectie, bedoeld in [artikel 1 van de Wet op het onderwijstoezicht][ref20];
        - *instelling voor educatie en beroepsonderwijs:* een instelling als bedoeld in
      [artikel 1.1.1, onderdeel b, van de Wet educatie en beroepsonderwijs][ref21], voor zover het betreft door die
      instelling verzorgde opleidingen vavo;
        - *kandidaat:* ieder die door het bevoegd gezag tot het eindexamen of deeleindexamen wordt toegelaten;
        - *kunstvakken:* de vakken behorende tot de beeldende vorming, alsmede muziek, dans en drama;
        - *leerling:* een leerling aan een school voor voortgezet onderwijs of een vavo-student;
        - *leerweg:* de basisberoepsgerichte leerweg, bedoeld in artikel 10b van de wet, de kaderberoepsgerichte leerweg,
      bedoeld in [artikel 10b van de wet][ref22], de gemengde leerweg, bedoeld in [artikel 10d van de wet][ref23] en de
      theoretische leerweg, bedoeld in [artikel 10 van de wet][ref24];
        - *maatschappelijke stage:* stage als bedoeld in [artikel 6f van de wet][ref25];
        - *mavo:* middelbaar algemeen voortgezet onderwijs als bedoeld in [artikel 9 van de wet][ref26];
        - *Onze Minister:* Onze Minister van Onderwijs, Cultuur en Wetenschap;
        - *opleiding vavo:* een opleiding voortgezet algemeen volwassenenonderwijs als bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel a, van de Wet educatie en beroepsonderwijs][ref27];
        - *profiel:* een in [artikel 10, derde lid][ref28], [10b, derde lid][ref29], [10d, derde lid][ref30], of
      [12, derde lid, van de wet][ref31] bedoeld profiel;
        - *profielvak:* profielvak, genoemd in [artikel 26h, eerste lid][ref32], respectievelijk bedoeld in
      [artikel 26i, eerste lid, van het Inrichtingsbesluit WVO][ref33];
        - *profielwerkstuk:* het in [artikel 4][ref34] bedoelde profielwerkstuk;
        - *school:* een school voor vwo, een school voor havo, een school voor mavo, een school voor vbo of een instelling
      voor educatie en beroepsonderwijs, tenzij anders blijkt;
        - *schooljaar:* het tijdvak dat aanvangt op 1 augustus en eindigt op 31 juli
      van het daaropvolgende jaar, daaronder mede begrepen het studiejaar, bedoeld in
      [artikel 1.1.1, onderdeel r, van de Wet educatie en beroepsonderwijs][ref35];
        - *school voor voortgezet onderwijs:* een school voor vwo, een school voor havo, een school voor mavo, een school
      voor vbo;
        - *toets:* een toets met schriftelijke of mondelinge vragen en opdrachten, of een praktische opdracht, tenzij
      anders blijkt;
        - *vakken:* algemene vakken, profielvakken, beroepsgerichte keuzevakken en andere programmaonderdelen;
        - *vakken behorende tot de beeldende vorming:* tekenen, handvaardigheid, textiele vormgeving, fotografie, film,
      audio-visuele vorming;
        - *vbo:* voorbereidend beroepsonderwijs als bedoeld in [artikel 10a van de wet][ref36];
        - *vmbo:* voorbereidend middelbaar beroepsonderwijs als bedoeld in [artikel 21 van de wet][ref37];
        - *vwo:* voorbereidend wetenschappelijk onderwijs als bedoeld in [artikel 7 van de wet][ref38];
        - *wet:* [Wet op het voortgezet onderwijs][ref39].

      2 Waar in dit besluit wordt gesproken van «directeur en de examensecretaris», wordt daaronder wat instellingen voor
      educatie en beroepsonderwijs betreft verstaan, de examencommissie vavo, tenzij anders blijkt.


