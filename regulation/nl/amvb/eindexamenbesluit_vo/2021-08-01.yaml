  - number: 31a
    text: |-
      1 Het bevoegd gezag van een school voor voortgezet onderwijs respectievelijk de examencommissie vavo stelt
      jaarlijks voor 1 oktober een programma van toetsing en afsluiting vast voor het desbetreffende schooljaar.

      2 Het programma van toetsing en afsluiting vermeldt in ieder geval:

      a. welke examenstof van het examenprogramma in het schoolexamen wordt getoetst;

      b. welke door het bevoegd gezag vast te stellen examenstof in het schoolexamen wordt getoetst;

      c. de inhoud van de toetsen die onderdeel uitmaken van het schoolexamen;

      d. de wijze waarop en tijdvakken waarbinnen de toetsen en herkansingen van het schoolexamen plaatsvinden;

      e. de regels voor de wijze waarop het cijfer voor het schoolexamen voor een kandidaat tot stand komt.

      3 Het bevoegd gezag van een school voor voortgezet onderwijs respectievelijk de examencommissie vavo draagt er
      zorg voor dat ten aanzien van de toetsen die deel uitmaken van het schoolexamen, in het programma van toetsing en
      afsluiting duidelijk en herleidbaar wordt aangegeven welke toetsen bijdragen aan de afsluiting van:

      a. de verplichte examenstof van het examenprogramma die behoort bij het schoolexamen;

      b. de examenstof van het examenprogramma die behoort tot de verplichte examenstof van het centraal examen, maar die
      ook in het schoolexamen zal worden getoetst; en

      c. examenstof die is gekozen door het bevoegd gezag.

      4 Dit artikel is van overeenkomstige toepassing op deeleindexamens.
    url: https://wetten.overheid.nl/BWBR0004593/2021-08-01#Artikel31a
  - number: 31b
    text: |-
      1 Het bevoegd gezag van een school voor voortgezet onderwijs wijkt bij de vaststelling van het programma van
      toetsing en afsluiting als bedoeld in [artikel 31a, eerste lid][ref1], slechts af van het voorstel van de
      examencommissie, bedoeld in [artikel 35e, eerste lid, onderdeel b][ref2], nadat het bevoegd gezag:

      a. overleg heeft gepleegd met de examencommissie; en

      b. de afwijking schriftelijk heeft gemotiveerd.

      2 Het bevoegd gezag van een school voor voortgezet onderwijs zendt de schriftelijke motivering bedoeld in het
      tweede lid, zo spoedig mogelijk aan de examencommissie en de medezeggenschapsraad.

      3 Het bevoegd gezag van een school voor voortgezet onderwijs behoeft voor het vaststellen van het
      programma van toetsing en afsluiting de instemming van de medezeggenschapsraad van de school, bedoeld in
      [artikel 10, eerste lid, onder b, van de Wet medezeggenschap op scholen][ref3].

      4 De examencommissie vavo behoeft voor het vaststellen van het programma van toetsing en afsluiting de instemming
      van de studentenraad van de instelling voor educatie en beroepsonderwijs bedoeld in artikel 8a.2.2, derde lid,
      onder e, van de Wet op het beroepsonderwijs.

      5 Het bevoegd gezag van een school voor voortgezet onderwijs respectievelijk de examencommissie vavo zendt
      jaarlijks voor 1 oktober het vastgestelde programma van toetsing en afsluiting voor het desbetreffende schooljaar
      aan de kandidaten en de inspectie.

      6 Dit artikel is van overeenkomstige toepassing op deeleindexamens.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel31a
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel35e
      [ref3]: https://wetten.overheid.nl/BWBR0020685#Artikel10
