  - number: '2'
    text: |-
      1 Het bevoegd gezag stelt de leerlingen van een school en de leerlingen van een afdeling voor havo in de
      gelegenheid ter afsluiting van de opleiding een eindexamen af te leggen.

      2 Het bevoegd gezag stelt de leerlingen van een instelling voor educatie en beroepsonderwijs in de gelegenheid in
      plaats van een eindexamen een of meer deeleindexamens af te leggen.

      3 Het bevoegd gezag kan tot het eindexamen toelaten kandidaten die niet als leerling van de school zijn
      ingeschreven.

      4 Het bevoegd gezag van een instelling voor educatie en beroepsonderwijs kan kandidaten als bedoeld in het derde
      lid eveneens in de gelegenheid stellen een of meer deeleindexamens aan deze instelling af te leggen. Het bevoegd
      gezag van een school voor vmbo kan een kandidaat als bedoeld in het derde lid eveneens in de gelegenheid stellen
      deeleindexamen af te leggen in een of meer profielvakken of beroepsgerichte keuzevakken van de basisberoepsgerichte
      leerweg, de kaderberoepsgerichte leerweg of de gemengde leerweg die de school verzorgt, indien de kandidaat
      voor een van deze leerwegen is ingeschreven aan een school voor voortgezet speciaal onderwijs of een school voor
      speciaal en voortgezet speciaal onderwijs als bedoeld in [artikel 1 van de Wet op de expertisecentra][ref1].

      5 Voor toelating tot het afleggen van het eindexamen door kandidaten die niet als leerling van de school voor
      voortgezet onderwijs zijn ingeschreven, is verschuldigd een bedrag van:

      a. € 595 wat het examenjaar 2019 betreft,

      b. € 625 wat het examenjaar 2020 betreft,

      c. € 655 wat het examenjaar 2021 betreft,

      d. € 685 wat het examenjaar 2022 betreft, en

      e. € 720 wat het examenjaar 2023 betreft.

      6 Met ingang van het examenjaar 2024 kan het bedrag, genoemd in het vijfde lid, onderdeel e, bij ministeriële
      regeling worden gewijzigd voor zover de consumentenprijsindex daartoe aanleiding geeft.

      7 In afwijking van het vijfde lid is een toelatingsbedrag niet verschuldigd door kandidaten die zijn ingeschreven
      bij een andere uit de openbare kas bekostigde school, - al dan niet in de zin van dit besluit -, afdeling of
      onderwijsinstelling en die aldaar geen eindexamen dan wel deeleindexamen afleggen.


