  - number: '11'
    text: |-
      1 Het eindexamen vwo (atheneum) omvat in elk geval:

      a. de vakken van het gemeenschappelijk deel van elk profiel, genoemd in
      [artikel 26b, eerste lid, van het Inrichtingsbesluit WVO][ref1], daaronder tevens begrepen een profielwerkstuk,

      b. de vakken van het profieldeel van één van de profielen, genoemd in
      [artikel 26b, derde tot en met zesde lid, van het Inrichtingsbesluit WVO][ref2], en

      c. tenminste één vak met een normatieve studielast van tenminste 440 uren van het vrije deel van elk profiel,
      genoemd in [artikel 26b, zevende lid, van het Inrichtingsbesluit WVO][ref3] zoals geldend voor de scholen voor vwo,
      met dien verstande dat door het bevoegd gezag vast te stellen vakken onderdeel zijn van het eindexamen uitsluitend
      voor zover Onze Minister daarvoor goedkeuring heeft verleend.

      2 In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een school voor vwo, bij het
      eindexamen vrijgesteld van de vakken waarvoor vrijstelling of ontheffing is verleend van het volgen van onderwijs
      op grond van [artikel 26e, eerste, tweede of vierde lid, van het Inrichtingsbesluit WVO][ref4]. Bij een ontheffing
      op grond van [artikel 26e, vierde lid, van het Inrichtingsbesluit WVO][ref5] wordt de taal vervangen door een ander
      vak als bedoeld in het vijfde lid van dat artikel.

      3 In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een instelling voor educatie en
      beroepsonderwijs, bij het eindexamen vrijgesteld van de vakken culturele en kunstzinnige vorming en lichamelijke
      opvoeding van het gemeenschappelijk deel.

      4 In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een instelling voor educatie
      en beroepsonderwijs, en in het bezit is van het diploma havo, bij het eindexamen vrijgesteld van het vak
      maatschappijleer van het gemeenschappelijk deel.

      5 In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een instelling voor educatie
      en beroepsonderwijs en in het bezit is van het diploma havo, en die in plaats van de vakken, genoemd in
      [artikel 26c van het Inrichtingsbesluit WVO][ref6] examen heeft afgelegd in een of meer overeenkomstige vakken van
      [artikel 26b van het Inrichtingsbesluit WVO][ref7], bij het eindexamen vrijgesteld van dit vak of deze vakken.

      6 In afwijking van het eerste lid kan de kandidaat die het eindexamen aflegt aan een instelling voor
      educatie en beroepsonderwijs bij het eindexamen ontheffing worden verleend van de taal, genoemd in
      [artikel 26b, eerste lid onder c, van het Inrichtingsbesluit WVO][ref8], in de volgende gevallen:

      a. de leerling heeft een stoornis die specifiek betrekking heeft op taal of een zintuiglijke stoornis die effect
      heeft op taal,

      b. de leerling heeft een andere moedertaal dan de Nederlandse taal, of

      c. de leerling volgt onderwijs in het profiel natuur en techniek of het profiel natuur en gezondheid en de taal
      verhindert naar verwachting een succesvolle afronding van de opleiding.

      7 Bij ontheffing op grond van het zevende lid wordt de taal vervangen door een van de vakken, genoemd in
      __REF000___________________________________________________________________________________________________________
      _ met een normatieve studielast van tenminste 440 uren, naar keuze van de leerling, voor zover het bevoegd gezag
      deze als zodanig aanbiedt.

      8 In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een instelling voor educatie en
      beroepsonderwijs en die op grond van [artikel 12 van de Beleidsregel verstrekking LOOT-licentie VO][ref10] dan wel
      [artikel 13 van de Beleidsregel verstrekking DAMU-licentie VO][ref11] ontheffing heeft verkregen voor een of meer
      van de in die artikelen genoemde vakken, bij het eindexamen vrijgesteld van dat vak of die vakken.


