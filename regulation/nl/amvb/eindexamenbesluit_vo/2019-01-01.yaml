  - number: '49'
    text: |-
      1 De kandidaat die het eindexamen van een leerweg in het vmbo heeft afgelegd, is geslaagd indien:

      a. het rekenkundig gemiddelde van zijn bij het centraal examen behaalde cijfers ten minste 5,5 is;

      b. hij voor het vak Nederlandse taal als eindcijfer 5 of meer heeft behaald en de rekentoets heeft afgelegd;

      c. hij onverminderd onderdeel b:

      1°. voor één van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 of meer en voor de overige
      vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer heeft behaald;

      2°. voor één van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 4 en voor de overige vakken
      waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer waarvan ten minste één 7 of meer heeft behaald; of

      3°. voor twee van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 heeft behaald en voor de
      overige vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer waarvan ten minste één 7 of meer
      heeft behaald;

      d. hij voor geen van de onderdelen, genoemd in het derde of vierde lid, lager dan het eindcijfer 4 heeft behaald;

      e. hij voor de vakken lichamelijke opvoeding en het kunstvak uit het gemeenschappelijk deel de kwalificatie
      «voldoende» of «goed» heeft behaald; en

      f. als het een eindexamen gemengde of theoretische leerweg betreft: hij voor het profielwerkstuk de kwalificatie
      «voldoende» of «goed» heeft behaald.

      2 Bij de uitslagbepaling volgens het eerste lid, onderdeel c, wordt in de theoretische leerweg het eindcijfer
      van een profielvak of beroepsgericht keuzevak behorende tot het eindexamen van de gemengde leerweg als bedoeld
      in [artikel 25][ref1] niet betrokken, tenzij deze vakken samen tenminste een volledig beroepsgericht programma
      als bedoeld in artikel 25, eerste lid, onderdeel d, vormen. In dat geval is het vierde lid van overeenkomstige
      toepassing.

      3 Bij de uitslagbepaling volgens het eerste lid, onderdeel c, wordt in de basisberoepsgerichte leerweg en de
      kaderberoepsgerichte leerweg het gemiddelde van de eindcijfers van alle beroepsgerichte keuzevakken aangemerkt als
      het eindcijfer van één vak.

      4 Bij de uitslagbepaling volgens het eerste lid, onderdeel c, wordt in de gemengde leerweg het gemiddelde van de
      eindcijfers van het profielvak en alle beroepsgerichte keuzevakken aangemerkt als het eindcijfer van één vak, met
      dien verstande dat het eindcijfer voor het profielvak daarbij net zo vaak meetelt als het aantal eindcijfers van
      beroepsgerichte keuzevakken dat in de berekening wordt betrokken.

      5 De directeur bepaalt het eindcijfer, bedoeld in het derde en vierde lid, als het rekenkundig gemiddelde van de
      eindcijfers van de samenstellende onderdelen. Indien de uitkomst van deze berekening niet een geheel getal is,
      wordt dat getal indien het eerste cijfer achter de komma een 4 of lager is, naar beneden afgerond en indien dat
      cijfer een 5 of hoger is, naar boven afgerond.

      6 In afwijking van het eerste lid, is de kandidaat die het eindexamen vmbo in de basisberoepsgerichte leerweg heeft
      afgelegd ter afsluiting van een leerwerktraject als bedoeld in [artikel 10b1 van de wet][ref2] geslaagd indien:

      a. hij voor het vak Nederlandse taal als eindcijfer 6 of meer heeft behaald en de rekentoets heeft afgelegd;

      b. hij voor het profielvak als eindcijfer 6 of meer heeft behaald; en

      c. hij als eindcijfer, bedoeld in het derde lid, 6 of meer heeft behaald.

      Indien de vakken waarin examen is afgelegd, tezamen een eindexamen vormen van de basisberoepsgerichte leerweg,
      bedoeld in artikel 10b van de wet, zijn het eerste en derde lid van overeenkomstige toepassing.

      7 Zodra de eindcijfers en indien mogelijk de uitslag zijn vastgesteld, maakt de directeur deze schriftelijk aan
      de kandidaat bekend, onder mededeling van het in [artikel 51][ref3] bepaalde. De uitslag is de definitieve uitslag
      indien artikel 51, eerste lid, geen toepassing vindt.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b1
      [ref3]: https://wetten.overheid.nl/BWBR0004593#Artikel51
