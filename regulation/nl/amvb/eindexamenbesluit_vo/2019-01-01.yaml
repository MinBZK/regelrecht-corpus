  - number: '22'
    text: |-
      1 Het eindexamen vmbo voor zover het betreft de theoretische leerweg, genoemd in [artikel 10 van de wet][ref1],
      omvat in elk geval:

      a. de vakken die het gemeenschappelijk deel ingevolge [artikel 10, vijfde lid, van de wet][ref2], omvat,

      b. de twee vakken die het profieldeel ingevolge [artikel 10, zesde lid, van de wet][ref3] omvat, waaronder tevens
      begrepen een profielwerkstuk,

      c. in het vrije deel twee nog niet in het profieldeel gekozen vakken, bedoeld onderscheidenlijk genoemd in
      [artikel 10, zevende lid, onderdelen a en b, van de wet][ref4], met dien verstande dat het profieldeel en het vrije
      deel tezamen ten minste twee vakken omvatten die geen moderne taal zijn, en

      d. de rekentoets.

      2 Het bevoegd gezag kan een kandidaat in de gelegenheid stellen de rekentoets af te leggen zoals deze op grond
      van [artikel 2, tweede lid, onder c, en lid 2a, van de Wet College voor toetsen en examens][ref5] voor havo of vwo
      is vastgesteld.

      3 In afwijking van het eerste lid is de kandidaat met het profiel economie of
      met leerwegondersteunend onderwijs, ten aanzien van wie toepassing is gegeven aan
      [artikel 26n, tweede of derde lid, van het Inrichtingsbesluit WVO][ref6], bij het eindexamen vrijgesteld van het
      vak Franse taal of het vak Duitse taal. In plaats van het vak waarvoor vrijstelling is verleend, doet de kandidaat
      eindexamen in één van de vakken Arabische taal, Turkse taal, Spaanse taal, maatschappijkunde, geschiedenis en
      staatsinrichting, of aardrijkskunde.

      4 Indien de kandidaat in het vrije deel twee kunstvakken kiest, wordt één kunstvak gekozen uit de vakken behorende
      tot de beeldende vorming en één kunstvak uit de vakken muziek, dans en drama.

      5 In geval van toepassing van [artikel 10, negende lid, van de wet][ref7], zijn het eerste tot en met het derde lid
      van toepassing, met dien verstande dat het vervangen vak niet als extra vak als bedoeld in het achtste lid, gekozen
      kan worden.

      6 In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een instelling voor educatie en
      beroepsonderwijs vrijgesteld van de vakken lichamelijke opvoeding en de vakken behorende tot de beeldende vorming,
      muziek, dans of drama van het gemeenschappelijk deel.

      7 In afwijking van het eerste lid kan de kandidaat die het eindexamen aflegt aan een instelling voor educatie en
      beroepsonderwijs, op zijn verzoek bij het eindexamen ontheffing worden verleend van de vakken Franse taal of Duitse
      taal van het sectordeel of van beide. [Artikel 11, zesde en zevende lid][ref8], is van overeenkomstige toepassing.

      8 In aanvulling op de voorgeschreven vakken, bedoeld in het eerste lid, kan het eindexamen omvatten, voor zover nog
      niet gekozen:

      a. een vak als bedoeld in [artikel 10, zevende lid, onderdelen a en b, van de wet][ref9],

      b. een vak dat behoort tot het eindexamen van de gemengde leerweg als bedoeld in [artikel 10d van de wet][ref10],
      of

      c. een vak genoemd in, dan wel aangewezen op grond van, [artikel 13][ref11] of [14 van de wet][ref12].

      9 In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een school voor vmbo, voor zover
      het betreft de theoretische leerweg, bij het eindexamen vrijgesteld van het vak lichamelijke opvoeding waarvoor
      vrijstelling is verleend op grond van [artikel 26n, eerste lid, van het Inrichtingsbesluit WVO][ref13].

      10 In afwijking van het eerste lid is een kandidaat die in het bezit is van het diploma
      van een leerweg in het vmbo en die de rekentoets heeft afgelegd zoals deze op grond van
      [artikel 2, tweede lid, onderdeel c, en lid 2a, van de Wet College voor toetsen en examens][ref14] is vastgesteld
      voor het eindexamen theoretische leerweg, havo of vwo, vrijgesteld van de rekentoets.

      11 In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een instelling voor educatie en
      beroepsonderwijs en die op grond van [artikel 11 van de Beleidsregel verstrekking LOOT-licentie][ref15] dan wel
      [artikel 11 van de Beleidsregel verstrekking DAMU-licentie VO][ref16] ontheffing heeft verkregen voor een of meer
      van de in die artikelen genoemde vakken, bij het eindexamen vrijgesteld van dat vak of die vakken.


