        artikel: '2'
  - number: '43'
    text: |-
      1 Indien het centraal examen naar het oordeel van de inspectie niet op regelmatige wijze heeft plaatsgehad kan zij
      besluiten dat het geheel of gedeeltelijk voor een of meer kandidaten opnieuw wordt afgenomen.

      2 De inspectie verzoekt het College voor toetsen en examens nieuwe opgaven vast te stellen en bepaalt op welke
      wijze en door wie het examen zal worden afgenomen.
    url: https://wetten.overheid.nl/BWBR0004593/2019-01-01#Artikel43
  - number: '44'
    text: |-
      Indien door onvoorziene omstandigheden het centraal examen in één of meer vakken aan één of meer scholen niet op de
      voorgeschreven wijze kan worden afgenomen, beslist Onze Minister hoe alsdan moet worden gehandeld.
    url: https://wetten.overheid.nl/BWBR0004593/2019-01-01#Artikel44
  - number: '45'
    text: |-
      1 Indien een kandidaat om een geldige reden, ter beoordeling van de directeur, is verhinderd bij één of meer
      toetsen in het eerste tijdvak tegenwoordig te zijn, wordt hem in het tweede tijdvak de gelegenheid gegeven het
      centraal examen voor ten hoogste twee toetsen per dag alsnog te voltooien.

      2 Indien een kandidaat in het tweede tijdvak evenzeer verhinderd is, of wanneer hij het centraal examen in het
      tweede tijdvak niet kan voltooien, wordt hij in de gelegenheid gesteld in het derde tijdvak ten overstaan van het
      College voor toetsen en examens zijn eindexamen te voltooien.

      3 De kandidaat meldt zich zo spoedig mogelijk door tussenkomst van de directeur aan bij het College voor toetsen en
      examens. In dat geval deelt de directeur aan het College voor toetsen en examens mede, wanneer dat zich voordoet,
      dat ten behoeve van de kandidaat toepassing is gegeven aan [artikel 55, eerste, tweede dan wel derde lid][ref1], en
      waaruit deze toepassing bestaat.

      4 Na afloop van het derde tijdvak deelt het College voor toetsen en examens het resultaat mede aan de directeur.

      5 Indien het bevoegd gezag op grond van [artikel 37, zevende lid][ref2], zelf de afnametijdstippen bepaalt, kan
      de directeur een kandidaat de gelegenheid geven om binnen de afnameperiode die het College voor toetsen en examens
      daarvoor heeft ingesteld, alsnog de toetsen te voltooien waarvoor hij eerder was verhinderd.

      6 Onder een toets als bedoeld in dit artikel wordt ook de rekentoets begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel37
