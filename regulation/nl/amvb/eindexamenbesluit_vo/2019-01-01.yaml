  - number: '50'
    text: |-
      1 De kandidaat die eindexamen vwo of havo heeft afgelegd, is geslaagd indien:

      a. het rekenkundig gemiddelde van zijn bij het centraal examen behaalde cijfers ten minste 5,5 is;

      b. hij:

      1°. voor een van de vakken Nederlandse taal en literatuur, Engelse taal en literatuur en voor zover van toepassing
      wiskunde A, B of C als eindcijfer 5 of meer heeft behaald en hij voor het andere vak dan wel andere hier genoemde
      vakken als eindcijfer 6 of meer heeft behaald, en

      2°. de rekentoets heeft afgelegd;

      c. hij onverminderd onderdeel b:

      1°. voor één van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 of meer en voor de overige
      vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer heeft behaald;

      2°. voor één van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 4 en voor de overige
      vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer heeft behaald, en het gemiddelde van de
      eindcijfers ten minste 6,0 bedraagt;

      3°. voor twee van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 heeft behaald en voor de
      overige vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer heeft behaald, en het gemiddelde
      van de eindcijfers ten minste 6,0 bedraagt; of

      4°. voor één van de vakken waarvoor een eindcijfer is vastgesteld als eindcijfer 4 en voor één van deze vakken als
      eindcijfer 5 heeft behaald en voor de overige vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of
      meer heeft behaald, en het gemiddelde van de eindcijfers ten minste 6,0 bedraagt;

      d. hij voor geen van de onderdelen, genoemd in het tweede lid, lager dan het eindcijfer 4 heeft behaald; en

      e. hij voor het vak lichamelijke opvoeding van het gemeenschappelijk deel van elk profiel, de kwalificatie
      «voldoende» of «goed» heeft behaald.

      2 Bij de uitslagbepaling volgens het eerste lid, wordt het gemiddelde van de eindcijfers van ten minste de
      volgende onderdelen aangemerkt als het eindcijfer van één vak, voor zover voor deze onderdelen een eindcijfer is
      bepaald: maatschappijleer, culturele en kunstzinnige vorming en het profielwerkstuk. Het bevoegd gezag kan daaraan
      toevoegen:

      a. literatuur, als onderdeel van alle afzonderlijke moderne talen, met dien verstande dat indien het bevoegd gezag
      daartoe niet besluit, literatuur voor de bepaling van de eindcijfers een onderdeel is van het schoolexamen van de
      desbetreffende taal en literatuur;

      b. algemene natuurwetenschappen in het havo en vwo;

      c. bij bijzondere scholen: godsdienst of levensbeschouwelijk vormingsonderwijs, met dien verstande
      dat indien het bevoegd gezag daartoe niet besluit, godsdienst of levensbeschouwelijk vormingsonderwijs
      geen onderdeel is van het eindexamen, tenzij Onze Minister daarvoor goedkeuring heeft verleend met
      toepassing van [artikel 11, eerste lid, onder c][ref1], [artikel 12, eerste lid, onder c][ref2], of
      [artikel 13, eerste lid, onder c][ref3].

      3 Indien het bevoegd gezag toepassing geeft aan de tweede volzin van het tweede lid, wordt in het examenreglement,
      bedoeld in [artikel 31][ref4], vermeld welk onderdeel of welke onderdelen worden toegevoegd.

      4 De directeur bepaalt het eindcijfer, bedoeld in het tweede lid, als het rekenkundig gemiddelde van de eindcijfers
      van de samenstellende onderdelen. Indien de uitkomst van deze berekening niet een geheel getal is, wordt dat getal
      indien het eerste cijfer achter de komma een 4 of lager is, naar beneden afgerond en indien dat cijfer een 5 of
      hoger is, naar boven afgerond.

      5 Zodra de eindcijfers en indien mogelijk de uitslag zijn vastgesteld, maakt de directeur deze schriftelijk aan
      de kandidaat bekend, onder mededeling van het in [artikel 51][ref5] bepaalde. De uitslag is de definitieve uitslag
      indien artikel 51, eerste lid, geen toepassing vindt.


