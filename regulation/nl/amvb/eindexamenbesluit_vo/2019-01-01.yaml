  - number: '53'
    text: |-
      1 De examencommissie vavo reikt aan de kandidaat die deeleindexamen heeft afgelegd aan een instelling voor educatie
      en beroepsonderwijs, een cijferlijst uit waarop zijn vermeld, voor zover van toepassing:

      a. de cijfers voor het schoolexamen en het centraal examen,

      b. voor het vwo en havo het vak of de vakken en het onderwerp of de titel van het profielwerkstuk,

      c. voor het vmbo het thema alsmede de beoordeling van het profielwerkstuk, en

      d. de eindcijfers voor de rekentoets en de examenvakken met inbegrip van het cijfer bepaald op grond van
      [artikel 50, tweede lid][ref1].

      2 De examencommissie vavo reikt aan de in het eerste lid bedoelde kandidaat, alsmede aan de kandidaat aan wie
      op grond van de definitieve uitslag niet op grond van [artikel 52, tweede lid][ref2], een diploma kan worden
      uitgereikt, een certificaat uit, waarop zijn vermeld, voor zover van toepassing:

      a. het vak of de vakken waarvoor de kandidaat een eindcijfer 6 of meer heeft behaald,

      b. de rekentoets, indien de kandidaat een eindcijfer 6 of meer heeft behaald,

      c. voor het vwo en havo het vak of de vakken en het onderwerp of de titel van het profielwerkstuk, en

      d. voor het vmbo het thema van het profielwerkstuk, voor zover beoordeeld met «goed» of «voldoende».

      3 De directeur reikt aan de definitief voor het eindexamen vmbo afgewezen kandidaat die de school verlaat en die
      voor een of meer vakken of de rekentoets van dat eindexamen een eindcijfer 6 of meer heeft behaald, een certificaat
      uit, waarop zijn vermeld, voor zover van toepassing:

      a. het vak of de vakken waarvoor de kandidaat een eindcijfer 6 of meer heeft behaald,

      b. de rekentoets, indien de kandidaat een eindcijfer 6 of meer heeft behaald, en

      c. het thema van het profielwerkstuk, voor zover beoordeeld met «goed» of «voldoende».

      4 De directeur reikt aan de kandidaat, bedoeld in [artikel 2, vierde lid, tweede volzin][ref3], die deeleindexamen
      vmbo aan een school voor voortgezet onderwijs heeft afgelegd, een cijferlijst uit waarop zijn vermeld, voor zover
      van toepassing:

      a. de leerweg,

      b. de cijfers voor het schoolexamen en het centraal examen,

      c. het thema en de beoordeling van het profielwerkstuk, en

      d. de eindcijfers voor de examenvakken, met inbegrip van het cijfer dat is bepaald op grond van
      [artikel 49, derde of vierde lid][ref4].

      5 Onze Minister stelt het model van het certificaat en de cijferlijst vast.

      6 Indien de rekentoets waarvoor het eindcijfer is vastgesteld een rekentoets ER betreft, wordt op de cijferlijst of
      het certificaat bij vermelding van de rekentoets de toevoeging «ER» geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel50
