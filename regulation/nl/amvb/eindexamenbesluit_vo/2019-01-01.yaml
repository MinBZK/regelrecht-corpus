  - number: '31'
    text: |-
      1 Het bevoegd gezag van een school voor voortgezet onderwijs, respectievelijk de examencommissie vavo, stelt
      een examenreglement vast. Het examenreglement bevat in elk geval informatie over de maatregelen, bedoeld in
      [artikel 5][ref1], en de toepassing daarvan, alsmede regels met betrekking tot de organisatie van het eindexamen
      en de gang van zaken tijdens het eindexamen, de herkansingsmogelijkheden van het schoolexamen, en wat scholen voor
      voortgezet onderwijs betreft, de samenstelling en het adres van de in artikel 5 bedoelde commissie van beroep. Ten
      aanzien van de herkansing wordt in elk geval bepaald, in welke gevallen een herkansing mogelijk is. Ook kan worden
      bepaald dat tot die gevallen kunnen behoren gevallen dat de kandidaat door ziekte of ten gevolge van een bijzondere
      van zijn wil onafhankelijke omstandigheid, niet in staat is geweest, aan de desbetreffende toets deel te nemen.

      2 Het bevoegd gezag van een school voor voortgezet onderwijs, respectievelijk de examencommissie vavo, stelt
      jaarlijks voor 1 oktober een programma van toetsing en afsluiting vast, dat in elk geval betrekking heeft op het
      desbetreffende schooljaar. Het programma vermeldt in elk geval:

      a. welke onderdelen van het examenprogramma in het schoolexamen worden getoetst,

      b. de inhoud van de onderdelen van het schoolexamen,

      c. de wijze waarop en de tijdvakken waarbinnen de toetsen van het schoolexamen plaatsvinden, de herkansing
      daaronder mede begrepen,

      d. de wijze van herkansing van het schoolexamen, alsmede

      e. de regels voor de wijze waarop het cijfer voor het schoolexamen voor een kandidaat tot stand komt.

      3 Het examenreglement en het programma van toetsing en afsluiting worden door de directeur voor 1 oktober
      toegezonden aan de inspectie en verstrekt aan de kandidaten.

      4 Het eerste en tweede lid zijn van overeenkomstige toepassing op deeleindexamens.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel5
    url: https://wetten.overheid.nl/BWBR0004593/2019-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '5'
        hoofdstuk: I
  - number: '32'
    text: |-
      1 Het bevoegd gezag bepaalt het tijdstip waarop het schoolexamen aanvangt.

      2 Het schoolexamen wordt afgesloten voor de aanvang van het eerste tijdvak, bedoeld in [artikel 37][ref1]. Bij
      toepassing van artikel 37, zevende lid, wordt het schoolexamen in het vak waarop de toets betrekking heeft,
      afgesloten tien werkdagen voor de afname van die toets.

      3 Het bevoegd gezag kan in afwijking van het tweede lid een kandidaat die ten gevolge van ziekte of een andere
      van zijn wil onafhankelijke omstandigheid het schoolexamen in één of meer vakken niet heeft kunnen afsluiten voor
      de aanvang van het eerste tijdvak, in de gelegenheid stellen het schoolexamen in dat vak of in die vakken af te
      sluiten vóór het centraal examen in dat vak of in die vakken, doch na de aanvang van het eerste tijdvak.

      4 Indien het bevoegd gezag gebruikmaakt van de afwijkingsbevoegdheid in het derde lid, zendt het de resultaten
      die zijn behaald met het schoolexamen en het profielwerkstuk in het vmbo zo spoedig mogelijk aan de inspectie,
      tenzij het bevoegd gezag op grond van [artikel 103b, tweede lid, van de wet][ref2] examengegevens samen met het
      persoonsgebonden nummer verstrekt aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel103b
    url: https://wetten.overheid.nl/BWBR0004593/2019-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '37'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 103b
  - number: '33'
    text: |-
      Voor de aanvang van het centraal examen maakt de directeur aan de kandidaat bekend, voorzover van toepassing:

      a. welk cijfer of welke cijfers hij heeft behaald voor het schoolexamen,

      b. de beoordeling van de vakken waarvoor geen cijfer wordt vastgesteld, en

      c. de beoordeling van het profielwerkstuk in het vmbo.
    url: https://wetten.overheid.nl/BWBR0004593/2019-01-01#Artikel33
  - number: '35'
    text: |-
      1 Het cijfer van het schoolexamen wordt uitgedrukt in een cijfer uit een schaal van cijfers lopende van 1 tot en
      met 10.

      2 Indien in een vak tevens centraal examen wordt afgelegd, worden de in het eerste lid genoemde cijfers gebruikt
      met de daartussen liggende cijfers met 1 decimaal.

      3 In afwijking van het eerste lid, worden de kunstvakken en het vak lichamelijke opvoeding uit het
      gemeenschappelijk deel van elk profiel, beoordeeld met «voldoende» of «goed». Deze beoordeling gaat uit van de
      mogelijkheden van de leerling en geschiedt op de grondslag van het genoegzaam afsluiten van de desbetreffende
      vakken, zoals blijkend uit het examendossier.

      4 In afwijking van het eerste lid wordt het profielwerkstuk in het vmbo beoordeeld met «voldoende» of «goed». Deze
      beoordeling geschiedt op de grondslag van het genoegzaam voltooien van het profielwerkstuk, zoals blijkend uit het
      examendossier. Het profielwerkstuk in het vmbo wordt beoordeeld door ten minste twee examinatoren.
    url: https://wetten.overheid.nl/BWBR0004593/2019-01-01#Artikel35
  - number: 35b1
    text: |-
      1 Het bevoegd gezag kan bepalen dat de kandidaat die eindexamen of deeleindexamen aflegt, voor één of meer vakken
      het schoolexamen waarin geen centraal examen wordt afgenomen, opnieuw kan afleggen, met dien verstande dat het
      bevoegd gezag dit recht in elk geval verleent voor het vak maatschappijleer behorend tot het gemeenschappelijk deel
      van de leerwegen, indien de kandidaat voor dat vak een eindcijfer heeft behaald lager dan 6. Het herexamen omvat
      door het bevoegd gezag aangegeven onderdelen van het examenprogramma.

      2 Het bevoegd gezag stelt vast hoe het cijfer van het in het eerste lid bedoelde herexamen wordt bepaald. Het
      hoogste van de cijfers behaald bij het herexamen in een vak en bij het eerder afgelegde schoolexamen in dat vak
      geldt als het definitieve cijfer van het schoolexamen in dat vak.
    url: https://wetten.overheid.nl/BWBR0004593/2019-01-01#Artikel35b1
  - number: 35c
    text: |-
      Het schoolexamen bestaat uit een examendossier. Het examendossier is het geheel van de
      onderdelen van het schoolexamen zoals gedocumenteerd in een door het bevoegd gezag gekozen
      vorm. Het examendossier voor het vmbo omvat tevens de resultaten die de leerling heeft behaald
      voor de vakken, bedoeld in [artikel 26g, eerste lid, van het Inrichtingsbesluit WVO][ref1] of
      [artikel 26i, tweede lid, van dat besluit][ref2], voor zover in die vakken geen eindexamen is afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel26g
      [ref2]: https://wetten.overheid.nl/BWBR0005946#Artikel26i
    url: https://wetten.overheid.nl/BWBR0004593/2019-01-01#Artikel35c
    references:
