      Indien een kandidaat gebruik heeft gemaakt van de mogelijkheid tot het afleggen van eindexamen in een vak op
      hoger niveau dan het niveau van de schoolsoort of leerweg van inschrijving, stelt de directeur de kandidaat in de
      gelegenheid in dat vak alsnog het eindexamen af te leggen van die schoolsoort of leerweg.
    url: https://wetten.overheid.nl/BWBR0004593/2019-01-01#Artikel51a
  - number: 51a1
    text: |-
      1 De kandidaat wordt binnen de periode waarin de rekentoets wordt afgenomen, bedoeld in
      [artikel 46, vierde lid][ref1], viermaal in de gelegenheid gesteld de rekentoets af te leggen, met dien verstande
      dat de eerste mogelijkheid in het voorlaatste leerjaar wordt geboden.

      2 Indien de kandidaat in één leerjaar examen doet, wordt in afwijking van het eerste lid een kandidaat driemaal in
      de gelegenheid gesteld de rekentoets af te leggen.

      3 De kandidaat stelt het bevoegd gezag voor een door het bevoegd gezag te bepalen dag en tijdstip er schriftelijk
      van in kennis dat hij gebruik maakt van de tweede, derde dan wel vierde gelegenheid, bedoeld in het eerste en
      tweede lid.

      4 Het bevoegd gezag kan bij de tweede, derde of vierde gelegenheid een kandidaat alsnog in de gelegenheid
      stellen, gebruik te maken van de rekentoets ER of van de mogelijkheid tot het afleggen van de rekentoets op
      een hoger niveau, bedoeld in [artikelen 13, tweede lid][ref2], [22, tweede lid][ref3], [23, zesde lid][ref4],
      [24, vijfde lid][ref5], of [25, vijfde lid][ref6].

      5 Indien een kandidaat gebruik heeft gemaakt van de rekentoets ER of van de mogelijkheid tot het afleggen van
      de rekentoets op een hoger niveau, bedoeld in de [artikelen 13, tweede lid][ref7], [22, tweede lid][ref8],
      [23, zesde lid][ref9], [24, vijfde lid][ref10], of [25, vijfde lid][ref11], stelt de directeur de kandidaat in
      de gelegenheid bij de tweede, derde of vierde gelegenheid, de rekentoets af te leggen zoals deze op grond van
      [artikel 2, tweede lid, onder c, en lid 2a, van de Wet College voor toetsen en examens][ref12] is vastgesteld voor
      de schoolsoort of leerweg waarin hij eindexamen doet.

      6 Na afloop van een rekentoets wordt het cijfer van de toets schriftelijk aan de kandidaat bekendgemaakt, in
      voorkomend geval onder vermelding van het aantal nog resterende gelegenheden om de toets af te leggen.


