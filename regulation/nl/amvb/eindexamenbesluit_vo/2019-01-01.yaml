  - number: '51'
    text: |-
      1 De kandidaat heeft het recht om voor één vak van het eindexamen waarin hij al centraal examen heeft afgelegd,
      in het tweede of, indien [artikel 45, eerste lid][ref1], van toepassing is, derde tijdvak, opnieuw deel te nemen
      aan het centraal examen of aan het cspe. Bij het eindexamen van de basis- of kaderberoepsgerichte leerweg heeft
      de kandidaat het recht, bedoeld in de eerste volzin, ook voor het cspe dat door het bevoegd gezag aansluitend
      aan het eerste tijdvak of in het tweede tijdvak wordt afgenomen. De herkansing van het cspe bestaat uit het
      opnieuw afleggen van deze toets of van één of meer onderdelen daarvan. De kandidaat heeft het recht, bedoeld in
      de eerste volzin, alleen indien op grond van [artikel 49, vierde lid][ref2], of [artikel 50, vijfde lid][ref3], de
      eindcijfers zijn bekendgemaakt.

      2 De kandidaat stelt de directeur voor een door deze laatste te bepalen dag en tijdstip schriftelijk in kennis van
      gebruikmaking van het in het eerste lid bedoelde recht.

      3 Het hoogste van de cijfers behaald bij de herkansing en bij het eerder afgelegde centraal examen geldt als
      definitief cijfer voor het centraal examen.

      4 Na afloop van de herkansing in het laatste leerjaar wordt de uitslag definitief vastgesteld met overeenkomstige
      toepassing van [artikel 48][ref4] en wordt deze schriftelijk aan de kandidaat bekendgemaakt.

      5 Na afloop van een herkansing in het voorlaatste of direct daaraan voorafgaande leerjaar wordt het eindcijfer
      schriftelijk aan de kandidaat bekendgemaakt.

      6 Het eerste tot en met vierde lid zijn van overeenkomstige toepassing op de vakken waarin in een examenjaar
      deeleindexamen is afgelegd. De kandidaat die in een examenjaar zowel eindexamen als een of meer deeleindexamens
      aflegt, oefent het in het eerste lid bedoelde recht per examenjaar ten hoogste eenmaal uit.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel49
