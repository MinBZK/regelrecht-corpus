    text: |-
      1 Het eindexamen havo omvat in elk geval:

      a. de vakken van het gemeenschappelijk deel van elk profiel, genoemd in
      [artikel 26c, eerste lid, van het Inrichtingsbesluit WVO][ref1], daaronder tevens begrepen een profielwerkstuk,

      b. de vakken van het profieldeel, genoemd in
      [artikel 26c, tweede tot en met vijfde lid, van het Inrichtingsbesluit WVO][ref2],

      c. ten minste één vak met een normatieve studielast van tenminste 320 uur van het vrije deel van elk profiel,
      genoemd in [artikel 26c, zesde lid, van het Inrichtingsbesluit WVO][ref3], met dien verstande dat door het bevoegd
      gezag vast te stellen vakken onderdeel zijn van het eindexamen uitsluitend voor zover Onze Minister daarvoor
      goedkeuring heeft verleend, en

      d. de rekentoets.

      2 Het bevoegd gezag kan een kandidaat in de gelegenheid stellen de rekentoets af te leggen zoals deze op grond
      van [artikel 2, tweede lid, onder c, en lid 2a, van de Wet College voor toetsen en examens][ref4] voor het vwo
      is vastgesteld.

      3 In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een school voor havo bij het
      eindexamen vrijgesteld van de vakken waarvoor ontheffing of vrijstelling is verleend van het volgen van onderwijs
      op grond van [artikel 26e, eerste lid, van het Inrichtingsbesluit WVO][ref5].

      4 In afwijking van het eerste lid, is de kandidaat die in het bezit is van het diploma
      van een leerweg in het vmbo en die in plaats van de rekentoets zoals deze op grond van
      [artikel 2, tweede lid, onderdeel c, en lid 2a, van de Wet College voor toetsen en examens][ref6] is vastgesteld
      voor het eindexamen van een leerweg in het vmbo, de rekentoets heeft afgelegd zoals deze is vastgesteld voor het
      eindexamen havo of vwo, vrijgesteld van de rekentoets.

      5 In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een instelling voor educatie en
      beroepsonderwijs, bij het eindexamen vrijgesteld van de vakken culturele en kunstzinnige vorming en lichamelijke
      opvoeding van het gemeenschappelijk deel.

      6 In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een instelling voor educatie en
      beroepsonderwijs en die op grond van [artikel 13 van de Beleidsregel verstrekking LOOT-licentie VO][ref7] dan wel
      [artikel 12 van de Beleidsregel verstrekking DAMU-licentie VO][ref8] ontheffing heeft verkregen voor een of meer
      van de in die artikelen genoemde vakken, bij het eindexamen vrijgesteld van dat vak of die vakken.


