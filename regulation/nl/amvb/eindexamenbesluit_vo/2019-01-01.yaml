  - number: '46'
    text: |-
      1 Het College voor toetsen en examens stelt regels voor de uitvoering van de rekentoets. Het College voor toetsen
      en examens stelt in ieder geval een regeling vast voor de uitvoering van de correctie voor zover de rekentoets
      bestaat uit open vragen.

      2 De regeling, bedoeld in het eerste lid, treedt slechts in werking na goedkeuring door Onze Minister. Onze
      Minister kan zijn goedkeuring onthouden wegens strijd met het recht of het algemeen belang.

      3 Met inachtneming van de [artikelen 23, zevende lid][ref1], [24, zevende lid][ref2],
      en [25, vijfde lid][ref3], worden de beoordelingsnormen, bedoeld in
      [artikel 2, tweede lid, onderdeel d, van de Wet College voor toetsen en examens][ref4] bij de beoordeling van de
      rekentoets toegepast.

      4 De rekentoets wordt afgenomen in het voorlaatste en laatste leerjaar.

      5 Het College voor toetsen en examens kan bij regeling bepalen dat de rekentoets niet onder toezicht van een of
      meer gecommitteerden staat.

      6 [Artikel 43][ref5] en [artikel 44][ref6] zijn van overeenkomstige toepassing.

      7 Indien de leerling de rekentoets heeft afgelegd in het voorlaatste leerjaar en niet is bevorderd tot het
      laatste leerjaar, vervallen de met de rekentoets behaalde resultaten. In afwijking hiervan kan de leerling die
      na het voorlaatste leerjaar van het vwo deelneemt aan het laatste leerjaar van het havo en de leerling die na het
      voorlaatste leerjaar van het havo deelneemt aan het laatste leerjaar van één van de leerwegen van het vmbo, het
      op het vwo respectievelijk havo behaalde cijfer voor de rekentoets behouden. In afwijking van de eerste volzin kan
      de leerling die na het voorlaatste leerjaar van een leerweg in het vmbo deelneemt aan het laatste leerjaar van een
      andere leerweg in het vmbo, het cijfer behouden dat in de eerstbedoelde leerweg is behaald voor de rekentoets.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0004593#Artikel25
