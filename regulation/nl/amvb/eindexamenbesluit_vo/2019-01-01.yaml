  - number: 52c
    text: |-
      1 Indien de kandidaat de rekentoets, een centraal examen of een afsluitend schoolexamen in één of meer vakken
      heeft afgelegd in het voorlaatste of direct daaraan voorafgaande leerjaar en vervolgens de school verlaat zonder
      het eindexamen te voltooien, verstrekt de directeur hem een voorlopige cijferlijst met de behaalde eindcijfers,
      voor zover deze niet op grond van [artikel 37a, vijfde lid][ref1], zijn vervallen. De eerste volzin is van
      overeenkomstige toepassing op de kandidaat die het gespreid centraal examen, bedoeld in [artikel 59][ref2], aflegt.

      2 Op de voorlopige cijferlijst worden de rekentoets, het vak of de vakken waarin de kandidaat centraal examen heeft
      afgelegd vermeld, alsmede het cijfer van het schoolexamen, het cijfer van het centraal examen en het eindcijfer,
      met de aantekening of het eindcijfer voor de rekentoets gebaseerd is op een rekentoets ER en of gebruik is gemaakt
      van de herkansingsmogelijkheid als bedoeld in [artikel 51][ref3].

      3 Indien de kandidaat een afsluitend schoolexamen heeft afgelegd wordt de beoordeling of het cijfer daarvan vermeld
      op de voorlopige cijferlijst.

      4 Onze Minister stelt het model van de voorlopige cijferlijst vast.

      5 Aan de voorlopige cijferlijst kunnen geen rechten meer worden ontleend met ingang van het moment waarop aan de
      kandidaat tevens een cijferlijst als bedoeld in [artikel 52, eerste lid][ref4], is uitgereikt die ten minste de
      eindcijfers van de voorlopige cijferlijst omvat.


