    text: |-
      1 Het eindexamen vmbo voor zover het betreft de kaderberoepsgerichte leerweg, genoemd in
      [artikel 10b van de wet][ref1], omvat in elk geval:

      a. de vakken die het gemeenschappelijk deel ingevolge in [artikel 10b, vijfde lid, van de wet][ref2], omvat,

      b. de twee algemene vakken die het profieldeel ingevolge [artikel 10b, zesde lid, van de wet][ref3], omvat,

      c. een beroepsgericht programma, bestaande uit:

      1°. het profielvak dat het profieldeel ingevolge [artikel 10b, zesde lid, van de wet][ref4], omvat, en

      2°. in het vrije deel vier beroepsgerichte keuzevakken, als bedoeld in
      [artikel 10b, zevende lid, onderdeel a, van de wet][ref5], en

      d. de rekentoets.

      2 [Artikel 23, tweede lid][ref6], is van toepassing.

      3 In geval van toepassing van [artikel 10b, negende lid, onderdeel b, van de wet][ref7]
      dan wel [artikel 10b, negende lid, onderdeel d, van de wet][ref8] juncto
      [artikel 26h, tweede lid, van het Inrichtingsbesluit WVO][ref9], zijn het eerste en tweede lid van toepassing, met
      dien verstande dat het vervangen vak niet als extra vak als bedoeld in het vierde lid, kan dienen.

      4 In aanvulling op de voorgeschreven vakken, bedoeld in het eerste lid, kan het eindexamen omvatten, voor zover nog
      niet gekozen:

      a. een vak, genoemd in [artikel 10b, zesde lid, van de wet][ref10], of een vak als bedoeld in artikel 10b, zevende
      lid, onderdeel a, van de wet,

      b. het vak Friese taal en cultuur, genoemd in [artikel 26h, tweede lid, van het Inrichtingsbesluit WVO][ref11],

      c. een vak dat op grond van het tweede lid onderdeel kan zijn van de kaderberoepsgerichte leerweg,

      d. een algemeen vak dat behoort tot het eindexamen van de theoretische leerweg of de gemengde leerweg, genoemd in
      respectievelijk [artikel 10][ref12] of [artikel 10d van de wet][ref13], of

      e. een vak als bedoeld in [artikel 13][ref14] of [14 van de wet][ref15].

      5 Het bevoegd gezag kan een kandidaat in de gelegenheid stellen de rekentoets af te leggen zoals deze op grond van
      [artikel 2, tweede lid, onder c, en lid 2a, van de Wet College voor toetsen en examens][ref16] voor theoretische
      leerweg, havo of vwo is vastgesteld.

      6 In afwijking van het eerste lid is een kandidaat die in het bezit is van het diploma
      van een leerweg in het vmbo en die de rekentoets heeft afgelegd zoals deze op grond van
      [artikel 2, tweede lid, onderdeel c, en lid 2a, van de Wet College voor toetsen en examens][ref17] is vastgesteld
      voor het eindexamen kaderberoepsgerichte of theoretische leerweg, havo of vwo, vrijgesteld van de rekentoets.

      7 In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een school voor vmbo, voor zover
      het betreft de kaderberoepsgerichte leerweg, bij het eindexamen vrijgesteld van het vak lichamelijke opvoeding
      waarvoor vrijstelling is verleend op grond van [artikel 26n, eerste lid, van het Inrichtingsbesluit WVO][ref18].


