        artikel: 103b
      - id: ref2
        bwb_id: BWBR0007625
        artikel: 2.3.6a
  - number: '57'
    text: |-
      1 Het werk van het centraal examen en de rekentoets der kandidaten wordt gedurende ten minste zes maanden na de
      vaststelling van de uitslag bewaard door de directeur, ter inzage voor belanghebbenden.

      2 Een door de directeur en de secretaris van het eindexamen ondertekend exemplaar van de opgave, bedoeld in
      [artikel 56][ref1] wordt gedurende ten minste zes maanden na de vaststelling van de uitslag in het archief van de
      school bewaard.

      3 De directeur draagt er zorg voor dat een volledig stel van de bij de centrale examens gebruikte opgaven gedurende
      ten minste zes maanden na de vaststelling van de uitslag bewaard blijft in het archief van de school.

      4 Een kandidaat die voor een vak ten overstaan van het College voor toetsen en examens centraal examen aflegt met
      geheime opgaven, kan omtrent zijn werk gedurende genoemde periode van zes maanden inlichtingen inwinnen bij het
      College voor toetsen en examens.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel56
    url: https://wetten.overheid.nl/BWBR0004593/2019-01-01#Artikel57
    references:
