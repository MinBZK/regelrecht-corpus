  - number: '3'
    text: |-
      1 De directeur en de examinatoren van een school voor voortgezet onderwijs nemen onder verantwoordelijkheid van het
      bevoegd gezag het eindexamen of deeleindexamen af.

      2 De directeur van een school voor voortgezet onderwijs wijst een van de personeelsleden van de school aan tot
      secretaris van het eindexamen. De secretaris van het eindexamen is tevens secretaris van de deeleindexamens.
    url: https://wetten.overheid.nl/BWBR0004593/2019-01-01#Artikel3
  - number: '4'
    text: |-
      1 Het eindexamen of deeleindexamen kan voor ieder vak bestaan uit een schoolexamen, uit een centraal examen dan wel
      uit beide.

      2 Het schoolexamen vwo, havo en vmbo kan mede een maatschappelijke stage omvatten.

      3 Het schoolexamen vwo, havo en vmbo, voor zover het betreft de theoretische leerweg, bedoeld in
      [artikel 10 van de wet][ref1], of de gemengde leerweg, bedoeld in [artikel 10d van de wet][ref2], omvat mede een
      profielwerkstuk. Het profielwerkstuk is een werkstuk, een presentatie daaronder begrepen, waarin op geïntegreerde
      wijze kennis, inzicht en vaardigheden aan de orde komen die van betekenis zijn in het desbetreffende profiel.

      4 Het profielwerkstuk in het vwo en havo heeft betrekking op één of meer vakken van het eindexamen. Ten minste één
      van deze vakken heeft een omvang van 400 uur of meer voor vwo en 320 uur of meer voor havo.

      5 Het profielwerkstuk in het vmbo heeft betrekking op een thema uit het profiel waarin de leerling onderwijs volgt.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
