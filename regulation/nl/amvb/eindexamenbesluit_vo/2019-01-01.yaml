  - number: '52'
    text: |-
      1 De directeur reikt op grond van de definitieve uitslag aan elke kandidaat die eindexamen heeft afgelegd, een
      cijferlijst uit waarop voor zover van toepassing zijn vermeld:

      a. de cijfers voor het schoolexamen en de cijfers voor het centraal examen,

      b. voor vwo en havo het vak of de vakken en het onderwerp of de titel van het profielwerkstuk,

      c. voor vmbo het thema en de beoordeling van het profielwerkstuk,

      d. de beoordeling van het vak lichamelijke opvoeding in vwo en havo,

      e. de beoordeling van het kunstvak en het vak lichamelijke opvoeding uit het gemeenschappelijk deel van de leerweg
      in mavo en vbo,

      f. de beoordeling van de maatschappelijke stage, indien:

      1°. de maatschappelijke stage is beoordeeld met «voldoende» of «goed»;

      2°. deze tenminste de duur heeft gehad van 30 uren,

      g. de eindcijfers voor de rekentoets en de examenvakken met inbegrip van het cijfer bepaald op grond van
      [artikel 49, derde of vierde lid][ref1], of [artikel 50, tweede lid][ref2], en

      h. de uitslag van het eindexamen.

      2 De directeur reikt op grond van de definitieve uitslag aan elke voor het eindexamen geslaagde kandidaat,
      daaronder mede begrepen de kandidaat die zijn eindexamen met gunstig gevolg heeft voltooid ten overstaan van
      het College voor toetsen en examens, een diploma uit, waarop het profiel of de profielen zijn vermeld die bij de
      uitslag zijn betrokken. Op het diploma vmbo is in elk geval de leerweg vermeld die bij de uitslag is betrokken.

      3 Indien een kandidaat in meer vakken examen heeft afgelegd dan in de vakken die ten minste samen een eindexamen
      vormen, worden de vakken die niet bij de bepaling van de uitslag zijn betrokken, op de cijferlijst vermeld, tenzij
      de kandidaat daartegen bedenkingen heeft geuit.

      4 Onze Minister stelt het model van de cijferlijst vast.

      5 Voor de vermelding op de cijferlijst van vakken waarvoor de kandidaat vrijstelling of ontheffing is verleend bij
      het eindexamen geldt het volgende:

      a. indien het betreft het eindexamen vwo of het eindexamen havo:

      1°. de vakken culturele en kunstzinnige vorming en lichamelijke opvoeding van het gemeenschappelijk deel worden
      niet vermeld op de cijferlijst indien de kandidaat het eindexamen aflegt aan een instelling voor educatie en
      beroepsonderwijs;

      2°. de vakken maatschappijleer en culturele en kunstzinnige vorming waarvoor de kandidaat bij het eindexamen vwo is
      vrijgesteld op grond van het bezit van een diploma havo, worden niet vermeld op de cijferlijst;

      3°. vakken waarvoor de kandidaat is vrijgesteld op grond van [artikel 9][ref3] van dit besluit of
      [artikel 10 van het Staatsexamenbesluit VO][ref4], worden vermeld op de cijferlijst, met vermelding van het eerder
      behaalde cijfer;

      4°. vakken waarvoor de kandidaat bij het eindexamen vwo is vrijgesteld op grond van een eerder afgelegd eindexamen
      havo of eindexamen vmbo waarvan deze vwo-vakken deel uitmaakten, worden vermeld op de cijferlijst, met vermelding
      van het eerder behaalde cijfer;

      5°. vakken waarvoor de kandidaat bij het eindexamen havo is vrijgesteld op grond van een eerder afgelegd eindexamen
      vmbo waarvan deze vakken dan wel de overeenkomstige vakken, bedoeld in [artikel 14, achtste lid, van de wet][ref5],
      deel uitmaakten, worden vermeld op de cijferlijst, met vermelding van het eerder behaalde cijfer;

      6°. andere vakken waarvoor de kandidaat vrijstelling of ontheffing is verleend, worden vermeld op de cijferlijst,
      zonder vermelding van een cijfer;

      b. indien het betreft het eindexamen vmbo:

      1°. de vakken behorende tot de beeldende vorming, muziek, dans, drama en lichamelijke opvoeding van het
      gemeenschappelijk deel worden niet vermeld op de cijferlijst indien de kandidaat het eindexamen aflegt aan een
      instelling voor educatie en beroepsonderwijs;

      2°. vakken waarvoor de kandidaat is vrijgesteld op grond van [artikel 9][ref6] van dit besluit of
      [artikel 10 van het Staatsexamenbesluit VO][ref7], worden vermeld op de cijferlijst, met vermelding van het eerder
      behaalde cijfer;

      3°. vakken waarvoor de kandidaat bij het eindexamen vmbo voor zover het betreft de theoretische leerweg, is
      vrijgesteld op grond van een eerder afgelegd eindexamen vmbo voor zover het betreft de kaderberoepsgerichte
      leerweg of de basisberoepsgerichte leerweg waarvan deze vakken dan wel de overeenkomstige vakken, bedoeld in
      [artikel 10, negende lid, van de wet][ref8], deel uitmaakten, worden vermeld op de cijferlijst, met vermelding van
      het eerder behaalde cijfer;

      4°. vakken waarvoor de kandidaat op grond van [artikel 23, achtste lid][ref9], [artikel 24, zevende lid][ref10], of
      [artikel 25, zevende lid][ref11], bij het eindexamen vmbo zijn vrijgesteld, worden vermeld op de cijferlijst, met
      vermelding van het eerder behaalde cijfer;

      5°. vakken die op grond van [artikel 22, achtste lid][ref12], zijn gekozen in aanvulling op de daar bedoelde
      voorgeschreven vakken, worden vermeld op de cijferlijst, met vermelding van het daarvoor behaalde cijfer;

      6°. andere vakken waarvoor de kandidaat vrijstelling of ontheffing is verleend, worden vermeld op de cijferlijst,
      zonder vermelding van een cijfer.

      6 Indien de rekentoets waarvoor het eindcijfer is vastgesteld een rekentoets ER betreft, wordt op de cijferlijst
      bij vermelding van de rekentoets de toevoeging «ER» geplaatst.

      7 Op de cijferlijst wordt de rekentoets waarvoor de kandidaat vrijstelling of ontheffing is verleend bij het
      eindexamen op grond van de [artikelen 9 tot en met 13][ref13], [22][ref14], [24][ref15] of [25][ref16] vermeld op
      de cijferlijst, met vermelding van het eerder behaalde cijfer.

      8 De directeur en de secretaris van het eindexamen tekenen de diploma's en de cijferlijsten.

      9 Indien de kandidaat in een bepaald jaar is geslaagd voor het eindexamen, draagt de directeur er op verzoek
      van de kandidaat zorg voor dat de behaalde cijfers voor de vakken waarin in datzelfde jaar deeleindexamen of
      deelstaatsexamen is afgelegd, worden vermeld op de cijferlijst.

      10 De directeur van een scholengemeenschap die in elk geval een school voor mavo omvat, reikt op verzoek van de
      kandidaat die met goed gevolg het examen vmbo in de gemengde leerweg aan die school heeft afgelegd en bovendien
      examen heeft afgelegd in een extra algemeen vak en met het meetellen van dat vak voldoet aan [artikel 49][ref17]
      voor zover het betreft de uitslag van het eindexamen vmbo in de theoretische leerweg, het diploma vmbo van de
      theoretische leerweg uit.


