  - number: 52a
    text: |-
      1 Een kandidaat is geslaagd voor het eindexamen vwo met toekenning van het judicium cum laude indien zijn examen
      voldoet aan de volgende voorschriften:

      a. ten minste het gemiddelde eindcijfer 8,0, berekend op basis van de eindcijfers voor:

      1°. de vakken in het gemeenschappelijke deel van het profiel, het eindcijfer berekend op grond van
      [artikel 50, tweede lid][ref1], en de vakken van het profieldeel, en

      2°. het vak uit het vrije deel waarvoor het hoogste eindcijfer is vastgesteld, en

      b. ten minste het eindcijfer 7 of ten minste de kwalificatie «voldoende» voor alle vakken die meetellen bij de
      uitslagbepaling op grond van [artikel 50][ref2].

      2 Een kandidaat is geslaagd voor het eindexamen havo met toekenning van het judicium cum laude indien zijn examen
      voldoet aan de volgende voorschriften:

      a. ten minste het gemiddelde eindcijfer 8,0, berekend op basis van de eindcijfers voor:

      1°. de vakken in het gemeenschappelijke deel van het profiel, het eindcijfer berekend op grond van
      [artikel 50, tweede lid][ref3], en de vakken van het profieldeel, en

      2°. het vak uit het vrije deel waarvoor het hoogste eindcijfer is vastgesteld, en

      b. ten minste het eindcijfer 6 of ten minste de kwalificatie «voldoende» voor alle vakken die meetellen bij de
      uitslagbepaling op grond van [artikel 50][ref4].

      3 Een kandidaat is geslaagd voor het eindexamen vmbo theoretische leerweg met toekenning van het judicium cum laude
      indien zijn examen voldoet aan de volgende voorschriften:

      a. ten minste het gemiddelde eindcijfer 8,0, berekend op basis van de eindcijfers voor:

      1°. de vakken Nederlandse taal, Engelse taal en maatschappijleer, en de algemene vakken van het profieldeel, en

      2°. het vak uit het vrije deel waarvoor het hoogste eindcijfer is vastgesteld, en

      b. ten minste het eindcijfer 6 of ten minste de kwalificatie «voldoende» voor het profielwerkstuk en alle vakken
      die meetellen bij de uitslagbepaling op grond van [artikel 49][ref5].

      4 Een kandidaat is geslaagd voor het eindexamen vmbo basisberoepsgerichte leerweg of kaderberoepsgerichte leerweg
      met toekenning van het judicium cum laude indien zijn examen voldoet aan de volgende voorschriften:

      a. ten minste het gemiddelde eindcijfer 8,0, berekend op basis van:

      1°. de eindcijfers voor het profielvak en de twee algemene vakken van het profieldeel, en

      2°. het eindcijfer berekend op grond van [artikel 49, derde lid][ref6], en

      b. ten minste het eindcijfer 6 of ten minste de kwalificatie «voldoende» voor alle vakken die meetellen bij de
      uitslagbepaling op grond van [artikel 49][ref7].

      5 Een kandidaat is geslaagd voor het eindexamen vmbo gemengde leerweg met toekenning van het judicium cum laude
      indien zijn examen voldoet aan de volgende voorschriften:

      a. ten minste het gemiddelde eindcijfer 8,0, berekend op basis van de eindcijfers voor:

      1°. de vakken Nederlandse taal, Engelse taal en maatschappijleer, en de algemene vakken van het profieldeel, en

      2°. het algemene vak uit het vrije deel of het eindcijfer berekend op grond van [artikel 49, vierde lid][ref8], en

      b. ten minste het eindcijfer 6 of ten minste de kwalificatie «voldoende» voor het profielwerkstuk en alle vakken
      die meetellen bij de uitslagbepaling op grond van [artikel 49][ref9].


