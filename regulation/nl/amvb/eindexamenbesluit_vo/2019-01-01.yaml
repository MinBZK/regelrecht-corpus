      1 Het eindexamen vwo (gymnasium) omvat in elk geval:

      a. de vakken van het gemeenschappelijk deel van elk profiel, genoemd in
      [artikel 26b, tweede lid, van het Inrichtingsbesluit WVO][ref1], daaronder tevens begrepen een profielwerkstuk,

      b. de vakken van het profieldeel, genoemd in
      [artikel 26b, derde tot en met zesde lid, van het Inrichtingsbesluit WVO][ref2],

      c. ten minste één vak met een normatieve studielast van tenminste 440 uur van het vrije deel van elk profiel,
      genoemd in [artikel 26b, zevende lid, van het Inrichtingsbesluit WVO][ref3] zoals geldend voor de scholen voor vwo,
      met dien verstande dat door het bevoegd gezag vast te stellen vakken onderdeel zijn van het eindexamen uitsluitend
      voor zover Onze Minister daarvoor goedkeuring heeft verleend, en

      d. de rekentoets.

      2 In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een school voor vwo, bij het
      eindexamen vrijgesteld van de vakken waarvoor vrijstelling of ontheffing is verleend van het volgen van onderwijs
      op grond van [artikel 26e, eerste onderscheidenlijk tweede lid, van het Inrichtingsbesluit WVO][ref4].

      3 In afwijking van het eerste lid is de kandidaat die in het bezit is van het diploma havo of het
      diploma van een leerweg in het vmbo en die in plaats van de rekentoets zoals deze op grond van
      [artikel 2, tweede lid, onderdeel c, en lid 2a, van de Wet College voor toetsen en examens][ref5] is vastgesteld
      voor het eindexamen havo of van een leerweg in het vmbo de rekentoets heeft afgelegd zoals deze is vastgesteld voor
      het eindexamen vwo, vrijgesteld van de rekentoets.

      4 In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een instelling voor educatie en
      beroepsonderwijs, bij het eindexamen vrijgesteld van het vak lichamelijke opvoeding van het gemeenschappelijk deel.

      5 In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een instelling voor educatie
      en beroepsonderwijs, en die in het bezit is van het diploma havo, bij het eindexamen vrijgesteld van het vak
      maatschappijleer van het gemeenschappelijk deel.

      6 In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een instelling voor educatie
      en beroepsonderwijs en in het bezit is van het diploma havo, en die in plaats van de vakken, genoemd in
      [artikel 26c van het Inrichtingsbesluit WVO][ref6] examen heeft afgelegd in een of meer overeenkomstige vakken van
      [artikel 26b van het Inrichtingsbesluit WVO][ref7], bij het eindexamen vrijgesteld van dit vak of deze vakken.

      7 In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een instelling voor educatie en
      beroepsonderwijs en die op grond van [artikel 12 van de Beleidsregel verstrekking LOOT-licentie VO][ref8] dan wel
      [artikel 13 van de Beleidsregel verstrekking DAMU-licentie VO][ref9] ontheffing heeft verkregen voor een of meer
      van de in die artikelen genoemde vakken, bij het eindexamen vrijgesteld van dat vak of die vakken.


