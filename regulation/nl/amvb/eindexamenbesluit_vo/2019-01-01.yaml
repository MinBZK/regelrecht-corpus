  - number: '60'
    text: |-
      Onze Minister kan bij of krachtens dit besluit vastgestelde voorschriften buiten toepassing laten of daarvan
      afwijken voor zover onverkorte toepassing zal leiden tot onbillijkheden van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0004593/2019-01-01#Artikel60
  - number: '61'
    text: |-
      Indien aan een kandidaat het judicium cum laude zou zijn toegekend op grond van [artikel 52a, eerste lid][ref1],
      zoals dat luidde op de dag voorafgaande aan de inwerkingtreding van het Besluit van 9 maart 2018 tot wijziging van
      het Eindexamenbesluit VO en het Staatsexamenbesluit VO in verband met het niet meer meetellen van het eindcijfer
      van de rekentoets voor de uitslagbepaling vwo en een technische wijziging in de regelgeving voor Caribisch
      Nederland, wordt dit judicium toegekend aan de kandidaat die eindexamen vwo heeft afgelegd in het schooljaar 2017–
      2018.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel52a
    url: https://wetten.overheid.nl/BWBR0004593/2019-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: 52a
        hoofdstuk: V
  - number: '66'
    text: |-
      De op het tijdstip van inwerkingtreding van dit besluit door Onze Minister gegeven regelingen en beschikkingen
      ter uitvoering van het Eindexamenbesluit dagscholen v.w.o.-h.a.v.o.-m.a.v.o., het Eindexamenbesluit avondscholen
      v.w.o.-h.a.v.o.-m.a.v.o. en het Eindexamenbesluit l.b.o. berusten vanaf dat tijdstip op dit besluit.
    url: https://wetten.overheid.nl/BWBR0004593/2019-01-01#Artikel66
