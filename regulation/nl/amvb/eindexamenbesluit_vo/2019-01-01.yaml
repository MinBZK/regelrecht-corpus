  - number: '10'
    text: |-
      1 Onverminderd [artikel 9][ref1] kan het College voor toetsen en examens op verzoek van de kandidaat die het
      eindexamen aflegt aan een instelling voor educatie en beroepsonderwijs, ontheffing verlenen voor een examenvak of
      de rekentoets, indien de kandidaat op grond van eerder gevolgd onderwijs aantoonbaar in het bezit is van voldoende
      kennis en vaardigheden ter zake van het desbetreffende vak respectievelijk de rekentoets. De ontheffing kan slechts
      worden verleend op basis van een diploma, getuigschrift, certificaat of ander bewijsstuk, al of niet behaald
      in Nederland, dat door het College voor toetsen en examens wordt aanvaard als bewijs van voldoende kennis en
      vaardigheden. Indien het College voor toetsen en examens dit nodig oordeelt, onderzoekt het college of de kandidaat
      in het bezit is van voldoende kennis en vaardigheden.

      2 Het eerste lid is uitsluitend van toepassing indien na het jaar waarin het in dat lid bedoelde diploma,
      getuigschrift, certificaat of ander bewijsstuk is vastgesteld, nog geen 10 jaren zijn verstreken.

      3 Tot de in het eerste lid bedoelde diploma's, getuigschriften, certificaten en andere bewijsstukken behoren in
      elk geval die betreffende het Internationaal Baccalaureaat, het Europees Baccalaureaat en die betreffende het
      overeenkomstige onderwijs in een lidstaat van de Europese Unie.

      4 Indien het College voor toetsen en examens de gevraagde ontheffing verleent, verstrekt het college de verzoeker
      een bewijs van ontheffing, en zendt het college Onze Minister een afschrift daarvan.

      5 Het bewijs van ontheffing vermeldt de gronden van de ontheffing, het tijdstip van het verrichten van de
      onderwijs- of examenprestatie waarop de ontheffing berust, en gaat in voorkomend geval vergezeld van een verklaring
      betreffende het in het eerste lid bedoelde onderzoek naar de kennis en vaardigheden van de examenkandidaat, of naar
      de in het eerste lid bedoelde bewijsstukken.

      6 Onze Minister stelt het model van het bewijs van ontheffing vast.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel9
    url: https://wetten.overheid.nl/BWBR0004593/2019-01-01#Artikel10
