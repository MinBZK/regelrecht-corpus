---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_leges_wet_beheer_rijkswaterstaatswerken
regulatory_layer: AMVB
publication_date: '2020-06-17'
valid_from: '2005-07-01'
bwb_id: BWBR0012927
url: https://wetten.overheid.nl/BWBR0012927/2005-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Verkeer en Waterstaat van 18 juli 2000, nr. CDJZ/WVW/2000/364,
    Centrale Directie Juridische Zaken;

    Gelet op artikel 4 van de Wet beheer rijkswaterstaatswerken;

    De Raad van State gehoord (advies van 8 september 2000, nr. W09.00.0316/V);

    Gezien het nader rapport van de Staatssecretaris van Verkeer en Waterstaat van 17 oktober 2001, nr. CDJZ/
    WVW/2001/1265, Centrale Directie Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0012927/2005-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012927/2005-07-01#Artikel1
  - number: 1.a
    text: |-
      vergunning: een vergunning als bedoeld in [artikel 2 van de Wet beheer rijkswaterstaatswerken][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008331#Artikel2
    url: https://wetten.overheid.nl/BWBR0012927/2005-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008331
        artikel: '2'
  - number: 1.b
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0012927/2005-07-01#Artikel1
  - number: 1.c
    text: |-
      kostprijs: de aannemingssom als bedoeld in artikel 1, eerste lid, van de Uniforme Administratieve Voorwaarden voor
      de uitvoering van werken «UAV 89» van het werk of voor zover deze ontbreekt een raming van de kostprijs van het
      werk als bedoeld in het normblad NEN 2631, van het Nederlands Normalisatie-Instituut;
    url: https://wetten.overheid.nl/BWBR0012927/2005-07-01#Artikel1
  - number: 1.d
    text: |-
      de hoofdingenieur-directeur: de hoofdingenieur-directeur van de Rijkswaterstaat onder wie het waterstaatswerk
      ressorteert.
    url: https://wetten.overheid.nl/BWBR0012927/2005-07-01#Artikel1
  - number: '2.1'
    text: |-
      De aanvrager is voor het in behandeling nemen van een aanvraag tot verlening of wijziging van een vergunning een
      recht van € 200 verschuldigd.
    url: https://wetten.overheid.nl/BWBR0012927/2005-07-01#Artikel2
  - number: '2.2'
    text: |-
      Indien Onze Minister heeft besloten de aanvraag te behandelen met toepassing van
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] wordt het in het eerste lid bedoelde recht verhoogd met
      € 720.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0012927/2005-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '2.3'
    text: |-
      Het in het eerste lid bedoelde recht kan door Onze Minister worden verhoogd met het bedrag van de voorafgaand
      aan het in behandeling nemen van de aanvraag aan de aanvrager medegedeelde externe advieskosten, blijkend uit een
      begroting die terzake door Onze Minister is opgesteld.
    url: https://wetten.overheid.nl/BWBR0012927/2005-07-01#Artikel2
  - number: '2.4'
    text: |-
      De aanvraag wordt niet eerder in behandeling genomen dan op het tijdstip waarop de aanvrager het verschuldigde
      recht heeft betaald.
    url: https://wetten.overheid.nl/BWBR0012927/2005-07-01#Artikel2
  - number: '2.5'
    text: 'Er is geen recht verschuldigd voor het in behandeling nemen van een aanvraag:'
    url: https://wetten.overheid.nl/BWBR0012927/2005-07-01#Artikel2
  - number: 2.5.a
    text: van Onze Minister;
    url: https://wetten.overheid.nl/BWBR0012927/2005-07-01#Artikel2
  - number: 2.5.b
    text: |-
      ter zake van een werk met betrekking tot welke de aanvrager aantoont dat de kostprijs niet meer dan € 2400
      bedraagt.
    url: https://wetten.overheid.nl/BWBR0012927/2005-07-01#Artikel2
  - number: '3.1'
    text: 'De aanvrager betaalt het verschuldigde recht aan Onze Minister:'
    url: https://wetten.overheid.nl/BWBR0012927/2005-07-01#Artikel3
  - number: 3.1.a
    text: binnen drie weken na de indiening van de aanvraag;
    url: https://wetten.overheid.nl/BWBR0012927/2005-07-01#Artikel3
  - number: 3.1.b
    text: |-
      in het in [artikel 2, tweede lid][ref1], bedoelde geval binnen drie weken na de bekendmaking van het in dat artikel
      bedoelde besluit;


      [ref1]: https://wetten.overheid.nl/BWBR0012927#Artikel2
    url: https://wetten.overheid.nl/BWBR0012927/2005-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012927
        artikel: '2'
  - number: 3.1.c
    text: |-
      in het in [artikel 2, derde lid][ref1], bedoelde geval, binnen drie weken na de bekendmaking van het besluit inzake
      het in dat artikel bedoelde bedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0012927#Artikel2
    url: https://wetten.overheid.nl/BWBR0012927/2005-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012927
        artikel: '2'
  - number: 3.1.d
    text: |-
      in het in [artikel 2, tweede en derde lid][ref1] bedoelde geval, binnen drie weken na het laatste van de onder b en
      onder c bedoelde tijdstippen.


      [ref1]: https://wetten.overheid.nl/BWBR0012927#Artikel2
    url: https://wetten.overheid.nl/BWBR0012927/2005-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012927
        artikel: '2'
  - number: '3.2'
    text: |-
      Indien de betaling van het verschuldigde recht door de aanvrager geschiedt door de bijschrijving op een rekening
      voor girale betaling ten name van de Staat vindt de betaling plaats op de dag waarop bijschrijving op die rekening
      heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0012927/2005-07-01#Artikel3
  - number: '4'
    text: |-
      Aan de aanvrager wordt door Onze Minister een teruggaaf verleend van het ingevolge [artikel 2][ref1] betaalde recht
      van:


      [ref1]: https://wetten.overheid.nl/BWBR0012927#Artikel2
    url: https://wetten.overheid.nl/BWBR0012927/2005-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012927
        artikel: '2'
  - number: 4.a
    text: 100 percent, indien Onze Minister besluit de aanvraag niet te behandelen;
    url: https://wetten.overheid.nl/BWBR0012927/2005-07-01#Artikel4
  - number: 4.b
    text: |-
      50 percent, indien Onze Minister besluit de aanvraag te behandelen met toepassing van
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] en de aanvraag wordt ingetrokken voor het tijdstip van de in
      [artikel 3:12 van die wet][ref2] bedoelde kennisgeving;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0012927/2005-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 4.c
    text: |-
      10 percent, indien de aanvraag wordt ingetrokken voor het tijdstip van de bekendmaking van het besluit op de
      aanvraag.
    url: https://wetten.overheid.nl/BWBR0012927/2005-07-01#Artikel4
  - number: '5'
    text: Dit besluit treedt in werking met ingang van 1 januari 2002.
    url: https://wetten.overheid.nl/BWBR0012927/2005-07-01#Artikel5
  - number: '6'
    text: 'Dit besluit wordt aangehaald als: Besluit leges Wet beheer rijkswaterstaatswerken.'
    url: https://wetten.overheid.nl/BWBR0012927/2005-07-01#Artikel6
