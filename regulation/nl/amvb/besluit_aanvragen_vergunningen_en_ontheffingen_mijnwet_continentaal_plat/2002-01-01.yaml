$id: besluit_aanvragen_vergunningen_en_ontheffingen_mijnwet_continentaal_plat
regulatory_layer: AMVB
publication_date: '2002-11-14'
valid_from: '2002-01-01'
bwb_id: BWBR0002555
url: https://wetten.overheid.nl/BWBR0002555/2002-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Minister van Economische Zaken van 3 oktober 1966, no. 666/713 W.J.A./E.M.C.;

    Gelet op artikel 14 van de Mijnwet continentaal plat (Stb. 1965, 428);

    De Raad van State gehoord (advies van 26 oktober 1966, no. 47);

    Gezien het nader rapport van Onze voornoemde Minister van 6 februari 1967, no. 367/5582 W.J.A./E.M.C.;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002555/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van dit besluit wordt verstaan onder: *vergunning:* een vergunning als bedoeld in
      [artikel 2, eerste lid, van de Mijnwet continentaal plat][ref1] (*Stb.* 1965, 428); *ontheffing:* een ontheffing
      als bedoeld in [artikel 2, tweede of derde lid, van de Mijnwet continentaal plat][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002504#Artikel2
    url: https://wetten.overheid.nl/BWBR0002555/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002504
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002504
        artikel: '2'
  - number: '2.1'
    text: |-
      De aanvrage om een vergunning of een ontheffing moet in tweevoud worden ingediend bij Onze Minister van Economische
      Zaken.
    url: https://wetten.overheid.nl/BWBR0002555/2002-01-01#Artikel2
  - number: '2.2'
    text: |-
      Van de aanvrage om een ontheffing als bedoeld in [artikel 2, tweede lid, van de Mijnwet continentaal plat][ref1]
      moet tegelijkertijd een afschrift met een kaart als bedoeld in [artikel 4, tweede lid][ref2], worden gezonden aan
      Onze Minister van Onderwijs en Wetenschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002555#Artikel4
    url: https://wetten.overheid.nl/BWBR0002555/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002504
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002555
        artikel: '4'
  - number: '3.1'
    text: |-
      In de aanvrage om een vergunning of een ontheffing moet worden vermeld, voor welk tijdvak de vergunning of
      ontheffing wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0002555/2002-01-01#Artikel3
  - number: '3.2'
    text: |-
      In de aanvrage om een opsporings- of winningsvergunning moet worden vermeld, voor welke delfstoffen de vergunning
      wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0002555/2002-01-01#Artikel3
  - number: '3.3'
    text: |-
      In de aanvrage om een verkenningsvergunning of een ontheffing moeten de aard en het doel van het in te stellen
      onderzoek, de daarbij te volgen werkwijze en de te gebruiken hulpmiddelen worden aangegeven.
    url: https://wetten.overheid.nl/BWBR0002555/2002-01-01#Artikel3
  - number: '4.1'
    text: |-
      In de aanvrage om een vergunning of een ontheffing moet, tenzij het betreft een opsporingsvergunning voor
      koolwaterstoffen, worden opgegeven de ligging van het gebied, waarvoor de vergunning of ontheffing wordt gevraagd,
      onder vermelding van de ligging van de hoekpunten daarvan, uitgedrukt in geografische coördinaten, berekend volgens
      het stelsel van de Europese vereffening, alsmede de oppervlakte van dat gebied, uitgedrukt in km2.
    url: https://wetten.overheid.nl/BWBR0002555/2002-01-01#Artikel4
  - number: '4.2'
    text: |-
      Bij een aanvrage als bedoeld in het eerste lid moet in zesvoud een kaart worden overgelegd overeenkomend met en op
      dezelfde schaal als de kaart, welke door Onze Minister van Economische Zaken wordt vastgesteld, waarop de naam van
      de aanvrager is vermeld en waarop het gebied is aangegeven, waarvoor de vergunning of ontheffing wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0002555/2002-01-01#Artikel4
  - number: '4.3'
    text: |-
      Bij de hoekpunten van het gebied, waarvoor de vergunning of ontheffing wordt gevraagd, moeten op de kaart letters
      worden geplaatst. De ligging van de hoekpunten moet op de kaart worden aangegeven in geografische coördinaten,
      berekend volgens het stelsel van de Europese vereffening.
    url: https://wetten.overheid.nl/BWBR0002555/2002-01-01#Artikel4
  - number: '5.1'
    text: |-
      Een opsporingsvergunning voor koolwaterstoffen kan slechts worden aangevraagd voor een gebied, bestaande uit een of
      meer blokken als aangegeven op de in [artikel 4, tweede lid][ref1], bedoelde kaart.


      [ref1]: https://wetten.overheid.nl/BWBR0002555#Artikel4
    url: https://wetten.overheid.nl/BWBR0002555/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002555
        artikel: '4'
  - number: '5.2'
    text: |-
      Indien voor een deel van een blok een opsporings- of winningsvergunning voor koolwaterstoffen geldt kan een
      aanvrage om een opsporingsvergunning als in het eerste lid bedoeld betrekking of mede betrekking hebben op dat deel
      van een zodanig blok, waarvoor geen zodanige opsporings- of winningsvergunning geldt.
    url: https://wetten.overheid.nl/BWBR0002555/2002-01-01#Artikel5
  - number: '5.3'
    text: |-
      In een aanvrage om een vergunning als bedoeld in het eerste lid moet worden opgegeven, voor welk gebied de
      vergunning wordt gevraagd, onder vermelding van de desbetreffende op de in [artikel 4, tweede lid][ref1], bedoelde
      kaart aangegeven bloknummers; indien de aanvrage betrekking of mede betrekking heeft op een deel van een blok als
      in het tweede lid bedoeld moet bovendien de ligging van de hoekpunten van zodanig deel, uitgedrukt in geografische
      coördinaten, berekend volgens het stelsel van de Europese vereffening, worden opgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002555#Artikel4
    url: https://wetten.overheid.nl/BWBR0002555/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002555
        artikel: '4'
  - number: '5.4'
    text: |-
      Indien een aanvrage meer dan één geheel of gedeeltelijk blok betreft, moet de aanvrager in een bij de aanvrage
      gevoegde, ondertekende verklaring, onder vermelding van de desbetreffende bloknummers, aangeven welke volgorde van
      voorkeur hij toekent aan de blokken of gedeelten van blokken, waarvoor vergunning wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0002555/2002-01-01#Artikel5
  - number: 5a.1
    text: |-
      Bij de aanvrage om een opsporingsvergunning moet een programma worden overgelegd, waaruit blijkt welke
      werkzaamheden in elk der blokken of gedeelten van blokken, waarvoor vergunning wordt gevraagd, de aanvrager bij
      inwilliging van de aanvrage voornemens is, met gebruikmaking daarvan, uit te voeren.
    url: https://wetten.overheid.nl/BWBR0002555/2002-01-01#Artikel5a
  - number: 5a.2
    text: Het in het eerste lid bedoelde programma moet worden vermeld in een bij de aanvrage in tweevoud te voegen bijlage.
    url: https://wetten.overheid.nl/BWBR0002555/2002-01-01#Artikel5a
  - number: '6.1'
    text: |-
      Bij de aanvrage om een opsporings- of winningsvergunning moeten worden overgelegd de gegevens, bedoeld in de bij
      dit besluit behorende [bijlage I][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002555
    url: https://wetten.overheid.nl/BWBR0002555/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002555
  - number: '6.2'
    text: |-
      Bij de aanvrage om een opsporings- of winningsvergunning voor koolwaterstoffen moeten tevens worden overgelegd de
      gegevens, bedoeld in de bij dit besluit behorende [bijlage II][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002555
    url: https://wetten.overheid.nl/BWBR0002555/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002555
  - number: '6.3'
    text: |-
      Indien de in het eerste en tweede lid bedoelde gegevens door de aanvrager zijn overgelegd bij een eerder ingediende
      aanvrage, kan naar die eerder overgelegde gegevens worden verwezen, voor zover zij geen wijziging hebben ondergaan.
    url: https://wetten.overheid.nl/BWBR0002555/2002-01-01#Artikel6
  - number: '6.4'
    text: |-
      Indien de aanvrage wordt ingediend door meerdere aanvragers gezamenlijk, moeten de in het eerste en tweede lid
      bedoelde gegevens worden overgelegd ten aanzien van elke aanvrager afzonderlijk of, voor zover de aard van de
      gegevens zulks meebrengt, ten aanzien van hen gezamenlijk. Tevens moet nauwkeurig worden aangegeven, onder welke
      voorwaarden de samenwerking bij het beoogde opsporingsonderzoek of de eventuele winning zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0002555/2002-01-01#Artikel6
  - number: '6.5'
    text: |-
      De in het eerste en tweede lid bedoelde gegevens moeten worden vermeld in bij de aanvrage in tweevoud te voegen
      bijlagen.
    url: https://wetten.overheid.nl/BWBR0002555/2002-01-01#Artikel6
  - number: 6a
    text: |-
      Bij de aanvrage om een winningsvergunning moet met betrekking tot het gebied, waarvoor de vergunning wordt
      gevraagd, in drievoud worden overgelegd:
    url: https://wetten.overheid.nl/BWBR0002555/2002-01-01#Artikel6a
  - number: 6a.a
    text: |-
      een opgave van de ramingen van zowel de aanwezige als de winbaar geachte hoeveelheid van de delfstof, waarvoor
      vergunning wordt gevraagd;
    url: https://wetten.overheid.nl/BWBR0002555/2002-01-01#Artikel6a
  - number: 6a.b
    text: |-
      structuurkaarten van de bovenzijde van elk der reservoirlagen, waarin de aanwezigheid van aardolie of aardgas
      is aangetoond of wordt vermoed, dan wel kaarten ten genoegen van Onze Minister van Economische Zaken, indien
      vergunning voor een andere delfstof dan koolwaterstoffen wordt gevraagd;
    url: https://wetten.overheid.nl/BWBR0002555/2002-01-01#Artikel6a
  - number: 6a.c
    text: een opgave van de overige gegevens waarop de onder *a* bedoelde ramingen zijn gebaseerd;
    url: https://wetten.overheid.nl/BWBR0002555/2002-01-01#Artikel6a
  - number: 6a.d
    text: |-
      een plan van winning, daaronder begrepen de in het kader van die winning noodzakelijke behandeling van de gewonnen
      delfstof en het vervoer daarvan tot het punt waar die delfstof aan een ander wordt overgedragen; het plan dient
      mede te omvatten een op de vermoedelijke periode van winning betrekking hebbende opgave van de ramingen van:
    url: https://wetten.overheid.nl/BWBR0002555/2002-01-01#Artikel6a
  - number: 6a.d.1°
    text: de jaarlijkse produktie;
    url: https://wetten.overheid.nl/BWBR0002555/2002-01-01#Artikel6a
  - number: 6a.d.2°
    text: de investeringen per jaar;
    url: https://wetten.overheid.nl/BWBR0002555/2002-01-01#Artikel6a
  - number: 6a.d.3°
    text: de lopende kosten per jaar.
    url: https://wetten.overheid.nl/BWBR0002555/2002-01-01#Artikel6a
  - number: '7'
    text: 'Dit besluit kan worden aangehaald als: Besluit aanvragen vergunningen en ontheffingen Mijnwet continentaal plat.'
    url: https://wetten.overheid.nl/BWBR0002555/2002-01-01#Artikel7
  - number: '8'
    text: |-
      Dit besluit treedt in werking op het tijdstip, waarop de [Mijnwet continentaal plat][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0002504
    url: https://wetten.overheid.nl/BWBR0002555/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002504
