preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken van 23 december 1988, nr. AW88/U1046, directoraat-
    generaal Management en Personeelsbeleid, directie Arbeidsvoorwaarden, hoofdafdeling Pensioenen en Wachtgelden;

    Gelet op artikel 125, eerste lid, en artikel 134, eerste lid, van de Ambtenarenwet 1929;

    De Raad van State gehoord (advies van 11 april 1989, nr. WO4.89.0015);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken van 28 juni 1989, nr. AW89/39/U7, directoraat-
    generaal Management en Personeelsbeleid, directie Arbeidsvoorwaarden, hoofdafdeling Pensioenen en Wachtgelden;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#ArtikelAanhef
articles:
  - number: '1'
    text: 'Dit besluit verstaat onder:'
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel1
  - number: 1.b
    text: |-
      privatiseringsoperatie: een operatie die ten doel heeft werkzaamheden van de rijksoverheid uit te besteden of over
      te dragen aan een bestaande of voor dat doel opgerichte privaatrechtelijke organisatie;
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel1
  - number: 1.c
    text: |-
      privaatrechtelijke organisatie: de privaatrechtelijke organisatie die de werkzaamheden uitvoert die in het kader
      van een privatiseringsoperatie door de rijksoverheid zijn uitbesteed of overgedragen;
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel1
  - number: 1.d
    text: 'privatiseringsontslag: het ontslag uit een overheidsbetrekking in het kader van een privatiseringsoperatie;'
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel1
  - number: 1.e
    text: 'ontslag als werknemer: het ontslag uit de betrekking bij de privaatrechtelijke organisatie;'
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel1
  - number: 1.f
    text: 'betrokkene:'
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel1
  - number: 1.f.1
    text: |-
      de betrokkene in de zin van het [Rijkswachtgeldbesluit 1959][ref1] aan wie een privatiseringsontslag is verleend en
      die onmiddellijk aansluitend aan dat ontslag in dienst is getreden van de privaatrechtelijke organisatie;


      [ref1]: https://wetten.overheid.nl/BWBR0002326
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002326
  - number: 1.f.2
    text: |-
      de betrokkene in de zin van de [Uitkeringsregeling 1966][ref1] aan wie een privatiseringsontslag is verleend en die
      onmiddellijk aansluitend aan dat ontslag in dienst is getreden van de privaatrechtelijke organisatie;


      [ref1]: https://wetten.overheid.nl/BWBR0002537
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002537
  - number: 1.f.3
    text: degene die recht heeft op een uitkering ingevolge de Tijdelijke regeling WWV-vervangende uitkering;
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel1
  - number: 1.g
    text: |-
      wachtgeld: wachtgeld ingevolge het [Rijkswachtgeldbesluit 1959][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002326
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002326
  - number: 1.h
    text: |-
      uitkering: uitkering ingevolge de [Uitkeringsregeling 1966][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002537
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002537
  - number: 1.i
    text: |-
      Stichting Pensioenfonds ABP: de Stichting Pensioenfonds ABP, bedoeld in
      [artikel 6 van de Wet privatisering ABP][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel6
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '6'
  - number: 1.j
    text: 'pensioenreglement: het pensioenreglement Stichting Pensioenfonds ABP.'
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel1
  - number: '2.1'
    text: |-
      In afwijking van [artikel 5, eerste lid, van het Rijkswachtgeldbesluit 1959][ref1], heeft de betrokkene geen recht
      op wachtgeld uit hoofde van het privatiseringsontslag.


      [ref1]: https://wetten.overheid.nl/BWBR0002326#Artikel5
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002326
        artikel: '5'
  - number: '2.2'
    text: |-
      In afwijking van [artikel 7, eerste lid, van de Uitkeringsregeling 1966][ref1], heeft de betrokkene geen recht op
      uitkering uit hoofde van het privatiseringsontslag.


      [ref1]: https://wetten.overheid.nl/BWBR0002537#Artikel7
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002537
        artikel: '7'
  - number: '3.1'
    text: |-
      Indien binnen twee jaar na het privatiseringsontslag blijkt dat de betrekking die de betrokkene bij de
      privaatrechtelijke organisatie vervult niet passend is en hij in verband daarmee al dan niet op eigen verzoek is
      ontslagen, heeft de betrokkene recht op wachtgeld of uitkering uit hoofde van zijn ontslag als werknemer met ingang
      van de dag van dat ontslag.
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel3
  - number: '3.2'
    text: |-
      Indien de betrokkene binnen twee jaar na het privatiseringsontslag als werknemer is ontslagen ten gevolge van
      opheffing van zijn betrekking bij de privaatrechtelijke organisatie of ten gevolge van overtolligheid van personeel
      door verandering of inkrimping van die organisatie, heeft hij recht op wachtgeld of uitkering uit hoofde van zijn
      ontslag als werknemer met ingang van de dag van dat ontslag.
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel3
  - number: 3a.1
    text: |-
      De duur van het wachtgeld ingevolge deze regeling wordt uitsluitend vastgesteld met toepassing van
      [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002326#Artikel6a
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002326
        artikel: 6a
  - number: 3a.2
    text: |-
      De duur van de uitkering ingevolge deze regeling wordt uitsluitend vastgesteld met toepassing van
      [artikel 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002537#Artikel8a
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002537
        artikel: 8a
  - number: '4.1'
    text: |-
      De betrokkene die als werknemer is ontslagen en op wie artikel 3 niet van toepassing is, heeft uit hoofde van zijn
      ontslag als werknemer recht op wachtgeld of uitkering, met dien verstande dat dat recht ingaat op de dag van het
      privatiseringsontslag.
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel4
  - number: '4.2'
    text: |-
      Het recht op het in het eerste lid bedoelde wachtgeld vervalt wanneer het ontslag als werknemer niet binnen een
      termijn van 7 jaar na het privatiseringsontslag heeft plaatsgehad en de aanvraag om toekenning van het wachtgeld
      niet binnen een maand na afloop van die termijn bij Onze Minister is ingekomen.
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel4
  - number: '4.3'
    text: |-
      Het recht op de in het eerste lid bedoelde uitkering vervalt wanneer het ontslag als werknemer niet binnen een
      termijn van 3 jaar na het privatiseringsontslag heeft plaatsgehad en de aanvraag om toekenning van de uitkering
      niet binnen een maand na afloop van die termijn bij Onze Minister is ingekomen.
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel4
  - number: '4.4'
    text: |-
      In afwijking van het tweede lid vervalt het recht op wachtgeld ten aanzien van de betrokkene die als werknemer
      bij de naamloze vennootschap Nederlands Meetinstituut NV is ontslagen, wanneer de daartoe strekkende aanvraag niet
      binnen een termijn van 5 jaar na dat ontslag bij Onze Minister is ingekomen.
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel4
  - number: '4.5'
    text: |-
      In afwijking van het derde lid vervalt het recht op uitkering ten aanzien van de betrokkene die als werknemer bij
      de naamloze vennootschap Nederlands Meetinstituut NV is ontslagen, wanneer de daartoe strekkende aanvraag niet
      binnen een termijn van 2 jaar na dat ontslag bij Onze Minister is ingekomen.
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel4
  - number: '5'
    text: |-
      In afwijking in zoverre van het [Rijkswachtgeldbesluit 1959][ref1] en de [Uitkeringsregeling 1966][ref2] wordt voor
      de toepassing van de bepalingen in die regelingen die betrekking hebben op de inschrijving als werkzoekende bij de
      Arbeidsvoorzieningsorganisatie, ten aanzien van de betrokkene onder ontslag verstaan, het ontslag als werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0002326
      [ref2]: https://wetten.overheid.nl/BWBR0002537
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002326
      - id: ref2
        bwb_id: BWBR0002537
  - number: '6.1'
    text: |-
      Voor zover nodig in afwijking van het [Rijkswachtgeldbesluit 1959][ref1] en de [Uitkeringsregeling 1966][ref2]
      gelden voor de betrokkene op wie [artikel 3][ref3] van toepassing is de bepalingen in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002326
      [ref2]: https://wetten.overheid.nl/BWBR0002537
      [ref3]: https://wetten.overheid.nl/BWBR0004583#Artikel3
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002326
      - id: ref2
        bwb_id: BWBR0002537
      - id: ref3
        bwb_id: BWBR0004583
        artikel: '3'
  - number: '6.2'
    text: |-
      Onder ontslag, bedoeld in [artikel 8 van het Rijkswachtgeldbesluit 1959][ref1] en
      [artikel 9 van de Uitkeringsregeling 1966][ref2] wordt verstaan het ontslag als werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0002326#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002537#Artikel9
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002326
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002537
        artikel: '9'
  - number: '6.3'
    text: |-
      Van de inkomsten waarop de betrokkene in verband met het ontslag als werknemer of in verband met ziekte of
      arbeidsongeschiktheid uit anderen hoofde aanspraak heeft, wordt een bedrag ten hoogste gelijk aan 70% van de
      bezoldiging op het bedrag van het wachtgeld of de uitkering in mindering gebracht, met dien verstande dat de
      inkomsten in verband met arbeidsongeschiktheid en het wachtgeld, de uitkering of de WWV-vervangende uitkering,
      tezamen niet minder zullen bedragen dan 70% van de bezoldiging. Onder bezoldiging wordt verstaan de ten aanzien van
      de betrokkene vastgestelde bezoldiging in de zin van de in het eerste lid genoemde ontslaguitkeringsregelingen.
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel6
  - number: '6.4'
    text: |-
      Onder aanspraak op doorbetaling van de laatstelijk genoten bezoldiging uit hoofde van
      ziekte, bedoeld in [artikel 16, eerste lid, van het Rijkswachtgeldbesluit 1959][ref1] en
      [artikel 16, eerste lid, van de Uitkeringsregeling 1966][ref2] wordt mede verstaan de uitkering ingevolge
      de [Ziektewet][ref3] en de uitkering ingevolge de [Wet op de Arbeidsongeschiktheidsverzekering][ref4] of de
      [Wet werk en inkomen naar arbeidsvermogen][ref5], waarop de betrokkene uit hoofde van zijn betrekking bij de
      geprivatiseerde organisatie aanspraak heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002326#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002537#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0001888
      [ref4]: https://wetten.overheid.nl/BWBR0002524
      [ref5]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002326
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0002537
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0001888
      - id: ref4
        bwb_id: BWBR0002524
      - id: ref5
        bwb_id: BWBR0019057
  - number: '6.5'
    text: |-
      Het vierde lid is niet van toepassing indien de uitkeringen als in dat lid bedoeld minder bedragen dan 70% van
      de desbetreffende uitkeringsgrondslag. Alsdan is de wijze van vermindering als bedoeld in het derde lid van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel6
  - number: 6a
    text: |-
      [Artikel 6][ref1] is eveneens van toepassing op de betrokkene, genoemd in [artikel 4][ref2], indien
      deze een uitkering geniet ingevolge de [Wet op de arbeidsongeschiktheidsverzekering][ref3] of de
      [Wet werk en inkomen naar arbeidsvermogen][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004583#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004583#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0004583
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0004583
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0002524
      - id: ref4
        bwb_id: BWBR0019057
  - number: '7'
    text: |-
      Uitsluitend voor de toepassing artikel 2.4, eerste lid, onderdeel *b*, onder 2°, van het pensioenreglement, wordt
      een ontslag als werknemer in de zin van dit besluit, aangemerkt als een privatiseringsontslag in de zin van dit
      besluit.
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel7
  - number: '8'
    text: Onze Minister is belast met de uitvoering van dit besluit.
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel8
  - number: '9'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin het
      besluit wordt geplaatst en werkt terug tot en met 31 december 1988.
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel9
  - number: '10'
    text: 'Dit besluit kan worden aangehaald als: Regeling wachtgeld en uitkering bij privatisering.'
    url: https://wetten.overheid.nl/BWBR0004583/2010-01-13#Artikel10
