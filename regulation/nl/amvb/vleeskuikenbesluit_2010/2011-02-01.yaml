        artikel: '114'
  - number: '7'
    text: >-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het verzamelen en verstrekken van
      gegevens die noodzakelijk zijn voor het bepalen van de bezettingsdichtheid.
    url: https://wetten.overheid.nl/BWBR0027822/2011-02-01#Artikel7
  - number: '8'
    text: |-
      1 De houder van vleeskuikens, voor zover deze een natuurlijke persoon is, is in het bezit van een door Onze
      Minister erkend certificaat waaruit blijkt dat hij passende cursussen heeft voltooid of gelijkwaardige ervaring
      heeft opgedaan.

      2 Van gelijkwaardige ervaring als bedoeld in het eerste lid is in elk geval sprake wanneer de ervaring is opgedaan
      voor de inwerkingtreding van dit besluit.

      3 De cursussen, bedoeld in het eerste lid, zijn toegespitst op welzijnsaspecten en hebben in ieder geval betrekking
      op:

      a. de voorschriften van bijlage I van [richtlijn nr. 2007/43/EG](32007L0043) en de [artikelen 10][ref1] en
      [11][ref2] van dit besluit;

      b. de fysiologie, met name de drink- en voederbehoeften, het diergedrag en het begrip stress;

      c. de praktische aspecten van de zorgzame omgang met vleeskuikens en van het vangen, laden en transporteren van
      vleeskuikens;

      d. eerste hulp voor vleeskuikens, het noodslachten en het doden van vleeskuikens, en

      e. preventieve maatregelen op het gebied van bioveiligheid.

      4 De eigenaar of houder verstrekt instructies en advies over de relevante voorschriften inzake dierenwelzijn,
      inclusief die met betrekking tot de dodingsmethoden die op de pluimveebedrijven worden toegepast, aan de personen
      die hij in dienst heeft of die voor hem diensten verrichten en die voor vleeskuikens zorgen of vleeskuikens vangen
      en laden.

      5 Bij ministeriële regeling worden nadere regels gesteld ter uitvoering van het eerste en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0027822#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0027822#Artikel11
    url: https://wetten.overheid.nl/BWBR0027822/2011-02-01#Artikel8
