  - number: '2'
    text: >-
      Dit besluit is niet van toepassing op:


      a. pluimveebedrijven met minder dan 500 vleeskuikens;


      b. pluimveebedrijven met alleen vermeerderingsdieren;


      c. broederijen;


      d. vleeskuikens in extensieve scharrel- en vrije-uitloophouderijen als bedoeld in bijlage V onder b, c, d en e,
      bij [verordening (EG) nr. 543/2008](32008R0543) van de Commissie van de Europese Gemeenschappen van 16 juni 2008
      houdende uitvoeringsbepalingen voor [Verordening (EG) nr. 1234/2007](32007R1234) van de Raad van de Europese Unie
      wat betreft de handelsnormen voor vlees van pluimvee (PbEU L 157);


      e. vleeskuikens gehouden overeenkomstig regels vastgesteld op grond van artikel 11, derde lid, van de verordening,
      genoemd in onderdeel d, en


      f. vleeskuikens gehouden overeenkomstig [verordening (EG) nr. 834/2007](32007R0834) van de Raad van de Europese
      Unie van 28 juni 2007 inzake de biologische productie en de etikettering van biologische producten en tot
      intrekking van [Verordening (EEG) nr. 2092/91](31991R2092) (PbEU L 198).
    url: https://wetten.overheid.nl/BWBR0027822/2011-02-01#Artikel2
  - number: '3'
    text: |-
      1 Het is verboden vleeskuikens te houden.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing indien:

      a. de bezettingsdichtheid niet hoger is dan 33 kg/m2, en

      b. er wordt voldaan aan de [artikelen 4][ref1], [5][ref2], [6][ref3] en [8][ref4].

      3 In afwijking van het eerste lid en het tweede lid, onderdeel a, is het toegestaan vleeskuikens te houden met een
      hogere bezettingsdichtheid dan 33 kg/m2, indien:

      a. de bezettingsdichtheid niet hoger is dan 39 kg/m2, en

      b. er wordt voldaan aan [paragraaf 2][ref5].

      4 In afwijking van het eerste lid, het tweede lid, onderdeel a en het derde lid, aanhef en onderdeel a, is het
      toegestaan vleeskuikens te houden met een hogere bezettingsdichtheid dan 39 kg/m2, indien:

      a. de bezettingsdichtheid niet hoger is dan 42 kg/m2, en

      b. er wordt voldaan aan de [paragrafen 2][ref6] en [3][ref7].

      5 Het vierde lid, onderdeel a, is van toepassing met ingang van de inwerkingtreding van dit besluit.


