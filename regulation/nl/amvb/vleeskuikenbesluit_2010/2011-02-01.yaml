  - number: '4'
    text: >-
      Vleeskuikens worden gehouden, gehuisvest en verzorgd overeenkomstig de punten 1 tot en met 10 van bijlage I van
      richtlijn nr. 2007/43/EG.
    url: https://wetten.overheid.nl/BWBR0027822/2011-02-01#Artikel4
  - number: '5'
    text: >-
      1 De eigenaar of houder registreert voor elke stal de volgende gegevens:


      a. het aantal binnengebrachte vleeskuikens;


      b. de bruikbare oppervlakte;


      c. de kruising of het ras van de vleeskuikens, indien bekend;


      d. voor iedere controle, het aantal dood aangetroffen vleeskuikens met een indicatie van de oorzaken, indien
      bekend, alsmede het aantal gedode vleeskuikens, met de reden, en


      e. het resterende aantal vleeskuikens in het koppel nadat er vleeskuikens uit zijn verwijderd voor verkoop of
      slacht.


      2 De gegevens, bedoeld in het eerste lid, worden drie jaren bewaard en worden bij een inspectie of op verzoek aan
      Onze Minister ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0027822/2011-02-01#Artikel5
  - number: '6'
    text: |-
      1 Wanneer een officiële dierenarts aan de houder en een ambtenaar als bedoeld in
      [artikel 114, eerste lid, van de wet][ref1], gegevens heeft verstrekt met betrekking tot de dagelijkse mortaliteit,
      de gecumuleerde dagelijkse mortaliteit of de resultaten van de post mortem keuring die wijzen op slechte
      dierenwelzijnsomstandigheden, nemen de eigenaar of houder van de desbetreffende dieren passende maatregelen ter
      verbetering van het dierenwelzijn.

      2 Onze Minister treft, ingeval een officiële dierenarts informatie verstrekt als bedoeld in het eerste lid,
      maatregelen ter verbetering van het dierenwelzijn. Deze maatregelen kunnen inhouden:

      a. een verplichting voor de eigenaar of houder tot het opstellen van een plan van aanpak;

      b. een verbod voor de eigenaar of houder op het houden van vleeskuikens, tenzij de bezettingsdichtheid niet hoger
      is dan een bij die maatregel vast te stellen gewicht per vierkante meter, gedurende een bij die maatregel bepaalde
      periode.

      3 Het plan van aanpak, bedoeld in het tweede lid, onderdeel a, wordt ter goedkeuring aan Onze Minister voorgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel114
    url: https://wetten.overheid.nl/BWBR0027822/2011-02-01#Artikel6
