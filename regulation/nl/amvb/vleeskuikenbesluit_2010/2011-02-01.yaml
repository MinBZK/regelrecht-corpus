  - number: '19'
    text: >-
      1 De eigenaar of houder die voornemens is een zodanig aantal vleeskuikens te gaan houden dat de bezettingsdichtheid
      niet langer hoger zal zijn dan 33 of 39 kg/m2, stelt Onze Minister ten minste 15 dagen voordat het desbetreffende
      koppel in de stal wordt geplaatst, in kennis van zijn voornemen.


      2 Bij ministeriële regeling worden nadere regels gesteld over de wijze waarop de kennisgeving, bedoeld in het
      eerste lid, plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0027822/2011-02-01#Artikel19
  - number: '20'
    text: |-
      1 Een wijziging van bijlage I van [richtlijn nr. 2007/43/EG](32007L0043) gaat voor de toepassing van
      [artikelen 4][ref1] en [8, derde lid, onderdeel a][ref2], gelden met ingang van de dag waarop aan de betrokken
      wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt
      bekendgemaakt, een ander tijdstip wordt vastgesteld.

      2 Onze Minister doet mededeling in de Staatscourant van een wijziging als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0027822#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0027822#Artikel8
    url: https://wetten.overheid.nl/BWBR0027822/2011-02-01#Artikel20
