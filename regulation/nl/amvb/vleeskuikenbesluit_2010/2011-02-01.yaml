preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Landbouw, Natuur en Voedselkwaliteit van 19 maart 2010, nr. 121480, Directie
    Juridische Zaken;


    Gelet op richtlijn nr. 2007/43/EG van de Raad van de Europese Unie van 28 juni 2007 tot vaststelling van
    minimumvoorschriften voor de bescherming van vleeskuikens (PbEU L 182) en de artikelen 3, 35, 38, 40, tweede lid,
    onderdeel c, 45 en 111 van de Gezondheids- en welzijnswet voor dieren;


    De Raad van State gehoord (advies van 29 april 2010, no. W11.10.0094/IV);


    Gezien het nader rapport van Onze Minister van Landbouw, Natuur en Voedselkwaliteit van 27 mei 2010, nr. 130824,
    Directie Juridische Zaken;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0027822/2011-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. *bezettingsdichtheid:* totale levende gewicht van vleeskuikens die tegelijkertijd in de stal per vierkante meter
      bruikbare oppervlakte aanwezig zijn;

      b. *bruikbare oppervlakte:* van strooisel voorziene oppervlakte die te allen tijde voor vleeskuikens toegankelijk
      is;

      c. *dagelijkse mortaliteit:* aantal vleeskuikens dat op dezelfde dag in een stal gestorven is, met inbegrip van
      de vleeskuikens die zijn gedood, gedeeld door het aantal vleeskuikens dat op die dag in de stal aanwezig was,
      vermenigvuldigd met 100;

      d. *eigenaar:* elke natuurlijke persoon of rechtspersoon die het pluimveebedrijf waar de vleeskuikens worden
      gehouden, in eigendom heeft;

      e. *gecumuleerde dagelijkse mortaliteit:* som van de dagelijkse mortaliteitscijfers;

      f. *houder:* elke natuurlijke persoon of rechtspersoon die permanent of tijdelijk verantwoordelijk is voor of
      belast is met de zorg voor vleeskuikens;

      g. *koppel:* groep vleeskuikens die in een stal zijn ondergebracht en gelijktijdig in die stal aanwezig zijn;

      h. *officiële dierenarts:* dierenarts die is verbonden aan de Voedsel en Waren Autoriteit;

      i. *pluimveebedrijf:* productieplaats waar vleeskuikens worden gehouden;

      j. *richtlijn nr. 2007/43/EG:* [richtlijn nr. 2007/43](32007L0043)//EG van de Raad van de Europese Unie van 28 juni
      2007 tot vaststelling van minimumvoorschriften voor de bescherming van vleeskuikens (PbEU L 182);

      k. *stal:* gebouw op een pluimveebedrijf waar een koppel vleeskuikens wordt gehouden;

      l. *vleeskuiken:* dier van de soort Gallus gallus dat gehouden wordt voor de productie van vlees;

      m. *wet:* [Gezondheids- en welzijnswet voor dieren][ref1].

      2


      [ref1]: https://wetten.overheid.nl/BWBR0005662
