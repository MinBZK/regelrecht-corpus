  - number: '14'
    text: |-
      1 In de twee jaren, voorafgaand aan de kennisgeving, bedoeld in [artikel 13, eerste lid][ref1], zijn door
      ambtenaren als bedoeld in [artikel 114, eerste lid, van de wet][ref2], op het pluimveebedrijf geen tekortkomingen
      in de naleving van dit besluit waargenomen.

      2 Ingeval er op het pluimveebedrijf in de twee jaren, bedoeld in het eerste lid, geen toezicht op de naleving van
      dit besluit heeft plaatsgevonden, geldt in afwijking van het eerste lid, dat er alsnog toezicht plaatsvindt, en
      hierbij geen tekortkomingen in de naleving van dit besluit worden waargenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0027822#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel114
