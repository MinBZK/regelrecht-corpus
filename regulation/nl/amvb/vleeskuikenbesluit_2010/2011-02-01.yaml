  - number: '15'
    text: >-
      De eigenaar of houder maakt bij de bedrijfsvoering gebruik van gidsen voor goede praktijken, die aanbevelingen
      bevatten voor de naleving van dit besluit.
    url: https://wetten.overheid.nl/BWBR0027822/2011-02-01#Artikel15
  - number: '16'
    text: |-
      1 De gecumuleerde dagelijkse mortaliteit van ten minste zeven opeenvolgende gecontroleerde koppels van een stal
      bedraagt voorafgaand aan de kennisgeving, bedoeld in [artikel 13, eerste lid][ref1], minder dan de som van:

      a. 1% en

      b. 0,06%, vermenigvuldigd met de slachtleeftijd van de dieren, uitgedrukt in dagen.

      2 Ingeval de gecumuleerde dagelijkse mortaliteit meer bedraagt dan de som, bedoeld in het eerste lid, kan Onze
      Minister besluiten het eerste lid buiten toepassing te laten, indien de eigenaar of houder naar het oordeel
      van Onze Minister een toereikende verklaring voor de buitengewone aard van de hogere gecumuleerde dagelijkse
      mortaliteit heeft verstrekt, en heeft aangetoond dat er sprake is van overmacht.


      [ref1]: https://wetten.overheid.nl/BWBR0027822#Artikel13
    url: https://wetten.overheid.nl/BWBR0027822/2011-02-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0027822
        artikel: '13'
        paragraaf: '3'
  - number: '17'
    text: >-
      1 Met ingang van 1 januari 2011 voldoet de eigenaar of houder aan de normen die bij ministeriële regeling worden
      vastgesteld met betrekking tot het voorkomen van de aandoening hakdermatitis bij vleeskuikens.


      2 Met ingang van 1 juli 2012 voldoet de eigenaar of houder aan de normen die bij ministeriële regeling worden
      vastgesteld met betrekking tot het voorkomen van de aandoening voetzoollaesies bij vleeskuikens.


      3 In het geval waarin de houder niet kan voldoen aan de normen in het eerste respectievelijk het tweede lid,
      kan Onze Minister besluiten het eerste onderscheidenlijk het tweede lid buiten toepassing te laten, indien de
      eigenaar of houder naar het oordeel van Onze Minister een toereikende verklaring voor de buitengewone aard van de
      overschrijding van de norm heeft verstrekt, en heeft aangetoond dat er sprake is van overmacht.
    url: https://wetten.overheid.nl/BWBR0027822/2011-02-01#Artikel17
  - number: '18'
    text: |-
      1 Voor de toepassing van dit artikel wordt verstaan onder een nieuw pluimveebedrijf: een pluimveebedrijf waar
      vleeskuikens worden gehouden dat van start gaat na de inwerkingtreding van dit besluit.

      2 De [artikelen 14][ref1], [15][ref2] en [16][ref3] zijn op een pluimveebedrijf waar voorafgaand aan de
      inwerkingtreding van dit besluit vleeskuikens worden gehouden niet van toepassing tot het moment waarop door een
      ambtenaar als bedoeld in [artikel 114, eerste lid, van de wet][ref4] toezicht is uitgeoefend op de naleving van
      dit besluit.

      3 De eigenaar of houder van een pluimveebedrijf als bedoeld in het tweede lid stelt binnen 15 dagen na
      inwerkingtreding van dit besluit op een door Onze Minister aangegeven wijze Onze Minister op de hoogte van zijn
      voornemen om een zodanig aantal vleeskuikens te houden dat de bezettingsdichtheid na de inwerkingtreding van dit
      besluit hoger zal zijn dan 39 kg/m2.

      4 Het tweede lid is van overeenkomstige toepassing op:

      a. een nieuw pluimveebedrijf;

      b. een pluimveebedrijf waar voorheen vleeskuikens werden gehouden op een wijze als bedoeld in [artikel 2][ref5] en
      dat overstapt op het houden van vleeskuikens op een wijze waarop dit besluit van toepassing is.


