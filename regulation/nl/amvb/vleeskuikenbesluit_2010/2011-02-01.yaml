        artikel: '11'
        paragraaf: '2'
  - number: '9'
    text: |-
      1 De eigenaar of houder die voornemens is een zodanig aantal vleeskuikens te gaan houden dat de bezettingsdichtheid
      hoger zal worden dan 33 kg/m2, stelt Onze Minister ten minste 15 dagen voordat het desbetreffende koppel in de stal
      wordt geplaatst, in kennis van zijn voornemen en geeft daarbij aan hoe hoog de bezettingsdichtheid zal zijn.

      2 Indien Onze Minister daarom verzoekt, stuurt de eigenaar of houder een samenvatting van de informatie, bedoeld in
      [artikel 10, tweede lid][ref1], toe.

      3 Bij ministeriële regeling worden nadere regels gesteld over de wijze waarop de kennisgeving, bedoeld in het
      eerste lid, plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0027822#Artikel10
    url: https://wetten.overheid.nl/BWBR0027822/2011-02-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0027822
        artikel: '10'
        paragraaf: '2'
  - number: '10'
    text: >-
      1 De eigenaar of houder legt per stal een verzameling van documenten aan waarin de productiesystemen in detail
      zijn beschreven.


      2 De verzameling documenten, bedoeld in het eerste lid, bevat in ieder geval informatie over technische details van
      de stal en de uitrusting van de stal, waaronder:


      a. een plattegrond van de stal met inbegrip van de afmetingen van de door de vleeskuikens ingenomen oppervlakten;


      b. het ventilatiesysteem en het koel- of verwarmingssysteem en de locatie van deze systemen;


      c. het ventilatieschema met de beoogde parameters over luchtkwaliteit, zoals luchtstroming, luchtsnelheid en
      temperatuur;


      d. de voeder- en watervoorziening en de locatie ervan;


      e. de alarm- en reservesystemen die in werking treden in geval van een storing van de automatische of mechanische
      apparatuur die noodzakelijk is voor de gezondheid en het welzijn van de dieren;


      f. het vloertype, en


      g. het normaliter gebruikte strooisel.


      3 De verzameling documenten, bedoeld in het eerste lid, wordt op verzoek aan Onze Minister ter beschikking gesteld.


      4 De eigenaar of houder brengt Onze Minister onverwijld op de hoogte van eventuele wijzigingen in de beschreven
      stal, uitrusting of procedures die van invloed kunnen zijn op het welzijn van de dieren.
    url: https://wetten.overheid.nl/BWBR0027822/2011-02-01#Artikel10
  - number: '11'
    text: >-
      De eigenaar of houder rust elke stal van zijn pluimveebedrijf uit met een ventilatiesysteem en met koel- of
      verwarmingssystemen, die zo zijn ontworpen en gebouwd en die zo functioneren dat:


      a. de concentratie van ammoniak niet hoger is dan 20 ppm en de concentratie van kooldioxide niet hoger is dan
      3000 ppm, gemeten ter hoogte van de kop van de vleeskuikens;


      b. de binnentemperatuur de buitentemperatuur met niet meer dan 3°C overschrijdt wanneer het buiten in de schaduw
      warmer is dan 30°C, en


      c. de gemiddelde relatieve vochtigheidsgraad in de stal over een periode van 48 uur niet hoger is dan 70% bij een
      buitentemperatuur van minder dan 10°C.
    url: https://wetten.overheid.nl/BWBR0027822/2011-02-01#Artikel11
  - number: '12'
    text: >-
      1 De eigenaar of houder draagt er zorg voor dat de documentatie bij een koppel dat ter slachting wordt aangeboden
      gegevens bevat over:


      a. de dagelijkse mortaliteit en de gecumuleerde dagelijkse mortaliteit, door de eigenaar of houder berekend, en


      b. de kruising of het ras van de vleeskuikens.


      2 De gegevens, bedoeld in het eerste lid, alsmede het aantal vleeskuikens dat dood aankomt, worden onder
      toezicht van de officiële dierenarts door de exploitant van het slachthuis geregistreerd met vermelding van het
      pluimveebedrijf en de stal van het pluimveebedrijf. De aannemelijkheid van de gegevens en van de gecumuleerde
      dagelijkse mortaliteit wordt door de exploitant van het slachthuis geverifieerd, rekening houdend met het aantal
      geslachte vleeskuikens en met het aantal vleeskuikens dat dood aankomt bij het slachthuis.
    url: https://wetten.overheid.nl/BWBR0027822/2011-02-01#Artikel12
  - number: '13'
    text: |-
      1 De eigenaar of houder die voornemens is een zodanig aantal vleeskuikens te gaan houden dat de bezettingsdichtheid
      hoger zal worden dan 39 kg/m2, stelt Onze Minister ten minste 15 dagen voordat het desbetreffende koppel in de stal
      wordt geplaatst, in kennis van zijn voornemen en geeft daarbij aan hoe hoog de bezettingsdichtheid zal zijn.

      2 [Artikel 9, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0027822#Artikel9
    url: https://wetten.overheid.nl/BWBR0027822/2011-02-01#Artikel13
