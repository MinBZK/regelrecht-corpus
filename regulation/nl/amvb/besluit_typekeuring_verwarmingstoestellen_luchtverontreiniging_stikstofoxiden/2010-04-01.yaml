articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. cv-ketel: het geheel van een ketellichaam en een brander van een uitsluitend met vloeibare of gasvormige
      brandstoffen gestookte en voor indirecte verwarming van één of meer ruimten bestemde installatie, dat de
      verbrandingswarmte op water overbrengt, met een nominale belasting van ten hoogste 900 kW;

      b. luchtverwarmer: toestel al dan niet bestemd voor aansluiting op een kanalensysteem, waarin uit vloeibare
      brandstof of gas in een verbrandingskamer ontwikkelde warmte via een scheidingswand zonder stromend tussenmedium
      wordt overgedragen op mechanisch getransporteerde lucht, welke lucht bestemd is voor de verwarming van één of meer
      ruimten in een gebouw, met een nominale belasting van ten hoogste 900 kW;

      c. voorzetbrander: brander die als aparte eenheid wordt gemaakt en verhandeld en die voor of in een cv-ketel of
      luchtverwarmer kan worden geplaatst, met een nominale belasting van ten hoogste 900 kW;

      d. volledig voorgemengde brander: brander waarbij het verbrandingsproces begint nadat alle voor de verbranding
      benodigde lucht met het gas is gemengd;

      e. atmosferische brander: volledig of gedeeltelijk voorgemengde brander waarbij de verbranding plaatsvindt in een
      laminaire vlam en die wordt toegepast als integraal onderdeel van de cv-ketel of luchtverwarmer;

      f. ventilatorbrander: volledig of gedeeltelijk voorgemengde brander waarbij de verbranding plaatsvindt in één
      vlamfront en die als produkt zelfstandig toepasbaar is voor verscheidene typen cv-ketels of luchtverwarmers;

      g. nominale belasting: belasting, uitgedrukt in kW, op de onderste verbrandingswaarde van de te gebruiken
      brandstof, waarvoor het toestel volgens opgave van de fabrikant of importeur bestemd is;

      h. fabrikant: degene die in de uitoefening van een bedrijf cv-ketels, luchtverwarmers of voorzetbranders in
      Nederland vervaardigt;

      i. importeur: degene die in de uitoefening van een bedrijf cv-ketels, luchtverwarmers of voorzetbranders in
      Nederland invoert;

      j. Onze Ministers: Onze Minister en Onze Minister van Economische Zaken te zamen.
    url: https://wetten.overheid.nl/BWBR0007465/2010-04-01#Artikel1
  - number: '4'
    text: |-
      1 Een type brander overschrijdt niet de in het tweede lid genoemde waarden, die worden berekend op basis van NO-
      uitworpnormen in mg/m3 bij 3% zuurstof.

      2 De in het eerste lid bedoelde waarden bedragen:

      a. voor atmosferische branders en luchtverwarmers 157 als gemiddelde waarde en 210 als ten hoogste toegelaten
      waarde;

      b. voor ventilatorbranders 105 als gemiddelde waarde en 140 als ten hoogste toegelaten waarde;

      c. voor volledig voorgemengde atmosferische branders en ventilatorbranders, in afwijking van de onderdelen *a* en
      *b*, 70 als gemiddelde waarde en 90 als ten hoogste toegelaten waarde.
    url: https://wetten.overheid.nl/BWBR0007465/2010-04-01#Artikel4
  - number: '5'
    text: |-
