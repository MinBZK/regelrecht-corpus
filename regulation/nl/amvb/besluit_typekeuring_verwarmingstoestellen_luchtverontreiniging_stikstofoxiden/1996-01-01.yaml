  - number: '2'
    text: |-
      1 Het is de fabrikant of de importeur verboden de door hem vervaardigde onderscheidenlijk ingevoerde cv-ketels,
      luchtverwarmers of voorzetbranders ten verkoop in voorraad te hebben, ten verkoop aan te bieden, te verkopen, te
      vervoeren of af te leveren indien die toestellen:

      a. niet behoren tot een type waarvoor door een keuringsinstantie overeenkomstig [artikel 3][ref1] een
      typegoedkeuring is verleend, of

      b. behoren tot een type waarvoor door een keuringsinstantie overeenkomstig [artikel 3][ref2] een typegoedkeuring is
      verleend, doch niet op duidelijk zichtbare en duurzame wijze overeenkomstig door Onze Ministers vastgestelde regels
      door de fabrikant of de importeur zijn voorzien van een symbool van typegoedkeuring.

      2 De in het eerste lid gestelde verboden gelden niet indien de in de aanhef van dat lid genoemde handelingen
      geschieden met het oog op het buiten Nederland in de handel brengen van de cv-ketels, luchtverwarmers of
      voorzetbranders.

      3 Het is de fabrikant of de importeur verboden een cv-ketel, luchtverwarmer of voorzetbrander te voorzien van een
      symbool als bedoeld in het eerste lid, onder *b*, of een symbool dat de indruk kan wekken een zodanig symbool te
      zijn, indien het betrokken toestel niet behoort tot het goedgekeurde type waarop dat symbool betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0007465#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007465#Artikel3
    url: https://wetten.overheid.nl/BWBR0007465/1996-01-01#Artikel2
