    Gelet op de artikelen 13, eerste lid en tweede lid, onder d, en 17 van de Wet inzake de luchtverontreiniging en
    artikel 15.31 van de Wet milieubeheer;

    De Raad van State gehoord (advies van 12 augustus 1994, nr. W08.94 0066);

