        artikel: '3'
  - number: '5'
    text: |-
      1 Bij regeling van Onze Ministers worden regels gesteld met betrekking tot:

      a. de meetmethode die bij de keuring van een toestel wordt gehanteerd;

      b. de uiterste waarden van de meetomstandigheden waaronder een toestel wordt gekeurd;

      c. de wijze waarop de meetresultaten worden getoetst aan de in [artikel 4, tweede lid][ref1], genoemde waarden, en

      d. de wijze waarop de keuringsinstantie controleert of de toestellen overeenkomstig het goedgekeurde type worden
      geproduceerd.

      2 Indien met betrekking tot de in het eerste lid genoemde onderwerpen een Europese norm wordt vastgesteld,
      verwijzen Onze Ministers in de krachtens het eerste lid vastgestelde regels naar die norm.

      3 Onze Ministers stellen, gehoord de keuringsinstanties, het tarief vast voor de vergoeding die door de aanvrager
      is verschuldigd ter zake van het in behandeling nemen van de aanvraag om een typegoedkeuring als bedoeld in
      [artikel 3][ref2]. Het tarief heeft geen betrekking op de keuring als bedoeld in [artikel 3, onderdeel a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007465#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007465#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007465#Artikel3
