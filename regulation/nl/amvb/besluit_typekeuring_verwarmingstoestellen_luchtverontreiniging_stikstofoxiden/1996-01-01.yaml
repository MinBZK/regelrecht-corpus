      - id: ref2
        bwb_id: BWBR0007465
        artikel: '3'
  - number: '3'
    text: |-
      Een keuringsinstantie verleent voor een type een typegoedkeuring indien:

      a. zij bij een keuring, verricht volgens de krachtens [artikel 5, eerste lid][ref1], gestelde regels,
      heeft vastgesteld dat het betrokken type cv-ketel, luchtverwarmer of voorzetbrander voldoet aan
      [artikel 4, eerste lid][ref2], of

      b. de aanvrager bij de aanvraag een of meer bewijsstukken overlegt:

      1°. die afgegeven zijn door een instelling, gevestigd in een andere lid-staat van de Europese Unie, in een andere
      staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of in een andere staat waarmee
      de Europese Unie een wederzijdse erkenningsovereenkomst heeft afgesloten die op cv-ketels, luchtverbranders
      of voorzetbranders van toepassing is, welke instelling in staat is tot het op onafhankelijke, betrouwbare en
      deskundige wijze verrichten van keuringen van cv-ketels, luchtverwarmers en voorzetbranders, en

      2°. waaruit blijkt dat die instelling, bij een keuring, verricht volgens de krachtens
      [artikel 5, eerste lid][ref3], gestelde regels of volgens regels die ten minste gelijkwaardig zijn,
      heeft vastgesteld dat het betrokken type cv-ketel, luchtverwarmer of voorzetbrander voldoet aan de in
      [artikel 4, tweede lid][ref4], genoemde waarden of aan waarden die ten minste gelijkwaardig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007465#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007465#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0007465#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0007465#Artikel4
