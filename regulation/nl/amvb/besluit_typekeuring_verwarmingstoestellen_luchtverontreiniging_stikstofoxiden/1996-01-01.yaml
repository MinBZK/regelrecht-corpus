        artikel: '5'
  - number: '8'
    text: |-
      1 De keuringsinstantie trekt een op grond van [artikel 3][ref1] door haar verleende typegoedkeuring van een type
      in indien in het kader van een controle als bedoeld in [artikel 7][ref2] wordt vastgesteld dat niet wordt voldaan
      aan de krachtens [artikel 5, eerste lid][ref3], gestelde regels met betrekking tot de controle of de toestellen
      overeenkomstig het goedgekeurde type worden geproduceerd.

      2 Tegelijkertijd met de bekendmaking van de beslissing tot intrekking van een typegoedkeuring zendt de
      keuringsinstantie een afschrift van deze beslissing aan Onze Ministers.


      [ref1]: https://wetten.overheid.nl/BWBR0007465#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007465#Artikel7
