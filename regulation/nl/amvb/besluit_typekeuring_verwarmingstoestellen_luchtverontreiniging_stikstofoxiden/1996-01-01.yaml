  - number: '4'
    text: |-
      1 Bij een keuring als bedoeld in [artikel 3, onderdeel a][ref1], wordt goedkeuring verleend wanneer voor een type
      brander de in het tweede lid genoemde waarden, die worden berekend op basis van NOx-uitworpnormen in mg/m3 bij 3%
      zuurstof, niet worden overschreden.

      2 De in het eerste lid bedoelde waarden bedragen:

      a. voor atmosferische branders en luchtverwarmers 157 als gemiddelde waarde en 210 als ten hoogste toegelaten
      waarde;

      b. voor ventilatorbranders 105 als gemiddelde waarde en 140 als ten hoogste toegelaten waarde;

      c. voor volledig voorgemengde atmosferische branders en ventilatorbranders, in afwijking van de onderdelen *a* en
      *b*, 70 als gemiddelde waarde en 90 als ten hoogste toegelaten waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0007465#Artikel3
    url: https://wetten.overheid.nl/BWBR0007465/1996-01-01#Artikel4
