  - number: '9'
    text: |-
      Ten aanzien van cv-ketels, luchtverwarmers en voorzetbranders die op het tijdstip waarop dit besluit ten aanzien
      van hen in werking treedt, reeds vervaardigd en hier te lande aanwezig zijn, wordt dit besluit eerst drie maanden
      na dat tijdstip van toepassing.
    url: https://wetten.overheid.nl/BWBR0007465/1996-01-01#Artikel9
  - number: '10'
    text: |-
      1 Dit besluit treedt ten aanzien van toestellen met gas als brandstof op 1 januari 1996 in werking.

      2 Voor de overige toestellen treedt dit besluit in werking op een bij koninklijk besluit te bepalen tijdstip, dat
      voor verschillende categorieën toestellen verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007465/1996-01-01#Artikel10
