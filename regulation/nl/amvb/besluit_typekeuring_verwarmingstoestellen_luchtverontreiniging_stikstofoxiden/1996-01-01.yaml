  - number: '6'
    text: |-
      Tegelijkertijd met de bekendmaking van de beslissing op de aanvraag om typegoedkeuring zendt een keuringsinstantie
      een afschrift van de door haar genomen beslissing aan Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0007465/1996-01-01#Artikel6
  - number: '7'
    text: |-
      1 De fabrikant of de importeur van een cv-ketel, een luchtverwarmer of voorzetbrander die behoort tot een
      goedgekeurd type, is gehouden de keuringsinstantie die de typegoedkeuring heeft verleend, in de gelegenheid te
      stellen te controleren of tot het desbetreffende type behorende toestellen beantwoorden aan de in [artikel 4][ref1]
      bedoelde waarden.

      2 Bij een controle als bedoeld in het eerste lid wordt eerst één exemplaar van de tot het desbetreffende type
      behorende toestellen gekeurd aan de hand van de krachtens [artikel 5, eerste lid][ref2], vastgestelde regels.

      3 Indien bij de keuring, bedoeld in het tweede lid, wordt vastgesteld dat het betrokken exemplaar niet beantwoordt
      aan de in [artikel 4][ref3] bedoelde waarden, worden drie andere exemplaren van de tot het desbetreffende type
      behorende toestellen gekeurd aan de hand van de krachtens [artikel 5, eerste lid][ref4], vastgestelde regels.

      4 De te keuren exemplaren worden door de keuringsinstantie willekeurig uit de bij de fabrikant of de importeur
      aanwezige toestellen van hetzelfde type gekozen.


      [ref1]: https://wetten.overheid.nl/BWBR0007465#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007465#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0007465#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0007465#Artikel5
    url: https://wetten.overheid.nl/BWBR0007465/1996-01-01#Artikel7
