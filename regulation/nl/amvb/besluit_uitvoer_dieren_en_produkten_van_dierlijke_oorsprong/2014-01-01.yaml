preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 18 oktober 1993, No. J.
    9315932, Directie Juridische en Bedrijfsorganisatorische Zaken;

    Gelet op Richtlijn nr. 80/215/EEG van de Raad van de Europese Gemeenschappen van 22 januari 1980 inzake
    veterinairrechtelijke vraagstukken op het gebied van het intracommunautaire handelsverkeer in vleesprodukten
    (PbEG L 47), op Richtlijn nr. 88/407/EEG van de Raad van de Europese Gemeenschappen van 14 juni 1988 tot
    vaststelling van de veterinairrechtelijke voorschriften van toepassing op het intracommunautaire handelsverkeer
    in diepgevroren sperma van runderen en de invoer daarvan (PbEG L 194), op Richtlijn nr. 88/657/EEG van de Raad
    van de Europese Gemeenschappen van 14 december 1988 tot vaststelling van de eisen voor de produktie van en het
    handelsverkeer in gehakt, vlees in stukken van minder dan 100 gram en vleesbereidingen en tot wijziging van
    de Richtlijnen 64/433/EEG, 71/118/EEG en 72/462/EEG (PbEG L 382), op Richtlijn nr. 90/429/EEG van de Raad van
    de Europese Gemeenschappen van 26 juni 1990 tot vaststelling van de veterinairrechtelijke voorschriften van
    toepassing op het intracommunautaire handelsverkeer in sperma van varkens en de invoer daarvan (PbEG L 224),
    op Richtlijn nr. 90/539/EEG van de Raad van de Europese Gemeenschappen van 15 oktober 1990 tot vaststelling van
    veterinairrechtelijke voorschriften voor het intracommunautaire handelsverkeer en de invoer uit derde landen
    van pluimvee en broedeieren (PbEG L 303), op Richtlijn nr. 90/667/EEG van de Raad van de Europese Gemeenschappen
    van 27 november 1990 tot vaststelling van gezondheidsvoorschriften voor de verwijdering van dierlijke afvallen,
    voor het in de handel brengen van dierlijke afvallen en ter voorkoming van de aanwezigheid van ziekteverwekkers
    in diervoeders van dierlijke oorsprong (vissen daaronder begrepen) en tot wijziging van Richtlijn 90/425/EEG
    (PbEG L 363), op Richtlijn nr. 91/67/EEG van de Raad van de Europese Gemeenschappen van 28 januari 1991 inzake
    veterinairrechtelijke voorschriften voor het in de handel brengen van aquicultuurdieren en aquicultuurprodukten
    ( PbEG L 46), op Richtlijn nr. 91/494/EEG van de Raad van de Europese Gemeenschappen van 26 juni 1991 tot
    vaststelling van veterinairrechtelijke voorschriften voor het intracommunautaire handelsverkeer en de invoer uit
    derde landen van vers vlees van pluimvee (PbEG L 268), op Richtlijn nr. 91/495/EEG van de Raad van de Europese
    Gemeenschappen van 27 november 1991 inzake gezondheidsvoorschriften en veterinairrechtelijke voorschriften voor
    de produktie en het in de handel brengen van konijnevlees en vlees van gekweekt wild ( PbEG L 268), op Richtlijn
    nr. 92/45/EEG van de Raad van de Europese Gemeenschappen van 16 juni 1992 betreffende de gezondheidsvoorschriften
    en veterinairrechtelijke voorschriften voor het doden van vrij wild en het in de handel brengen van vlees van
    vrij wild (PbEG L 268), op Richtlijn nr. 92/65/EEG van de Raad van de Europese Gemeenschappen van 13 juli 1992
    tot vaststelling van de veterinairrechtelijke voorschriften voor het handelsverkeer en de invoer in de Gemeenschap
    van dieren, sperma, eicellen en embryo's waarvoor ten aanzien van de veterinairrechtelijke voorschriften geen
    specifieke communautaire regelgeving als bedoeld in bijlage A, onder I, van Richtlijn 90/425/EEG geldt (PbEG L 268)
    en op Richtlijn nr. 92/118/EEG van de Raad van de Europese Gemeenschappen van 17 december 1992 tot vaststelling van
    de veterinairrechtelijke en de gezondheidsvoorschriften voor het handelsverkeer en de invoer in de Gemeenschap van
    produkten waarvoor ten aanzien van deze voorschriften geen specifieke communautaire regelgeving geldt als bedoeld
    in bijlage A, hoofdstuk I, van Richtlijn 89/662/EEG, en wat ziekteverwekkers betreft, van Richtlijn 90/425/EEG
    (PbEG L 62);

    Gelet op de artikelen 78 en 111 van de Gezondheids- en welzijnswet voor dieren;

    Gezien het advies van de Raad voor dierenaangelegenheden, het Landbouwschap, het Produktschap voor Pluimvee en
    Eieren, het Produktschap voor Vis en Visprodukten en het Bedrijfschap voor de Pluimveehandel en -industrie;

    De Raad van State gehoord (advies van 30 november 1993, No. W11.93.0693);

    Gezien het nader rapport van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 17 januari 1994, No. J.
    9319649, Directie Juridische en Bedrijfsorganisatorische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006427/2014-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. richtlijn nr. 2009/158/EG: richtlijn nr. 2009/158/EG van de Raad van de Europese Unie van 30 november 2009 tot
      vaststelling van veterinairrechtelijke voorschriften voor het intracommunautaire handelsverkeer en de invoer uit
      derde landen van pluimvee en broedeieren (PbEU L 343);

      b. richtlijn nr. 2006/88/EG: richtlijn nr. 2006/88/EG van de Raad van de Europese Gemeenschappen van 24 oktober
      2006 betreffende veterinairrechtelijke voorschriften voor aquacultuurdieren en de producten daarvan en betreffende
      de preventie en bestrijding van bepaalde ziekten bij waterdieren (PbEG L 328);

      c. [richtlijn 92/65/EEG](31992L0065): [Richtlijn nr. 92/65/EEG](31992L0065) van de Raad van de Europese
      Gemeenschappen van 13 juli 1992 tot vaststelling van de veterinairrechtelijke voorschriften voor het
      handelsverkeer en de invoer in de Gemeenschap van dieren, sperma, eicellen en embryo's waarvoor ten aanzien van de
      veterinairrechtelijke voorschriften geen specifieke communautaire regelgeving als bedoeld in bijlage A, onder I,
      van [Richtlijn 90/425/EEG](31990L0425) geldt (*PbEG* L 268);

      d. wet: [Gezondheids- en welzijnswet voor dieren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005662
    url: https://wetten.overheid.nl/BWBR0006427/2014-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005662
  - number: '2'
    text: |-
      Onze Minister kan het anders dan in doorvoer buiten Nederland brengen van:

      a. dieren van soorten en categorieën behorende tot:

      1°. de onderstam gewervelde of ongewervelde dieren, bedoeld in artikel 2, eerste lid, onderdeel b, van richtlijn
      nr. 92/65/EEG, niet zijnde vee, genoemd in [artikel 1, eerste lid, van de wet][ref1];

      2°. de klasse vogels, genoemd in artikel 2, eerste lid, van richtlijn nr. 2009/158/EG, niet zijnde pluimvee,
      genoemd in [artikel 1, eerste lid, van de wet][ref2];

      b. aquacultuurdieren, bedoeld in artikel 3, eerste lid, onderdeel b, van richtlijn nr. 2006/88/EG, met uitzondering
      van de dieren genoemd in artikel 2, eerste lid, van deze richtlijn, of

      c. producten van dierlijke oorsprong alsmede producten van niet gehouden dieren, genoemd of bedoeld in de artikelen
      van de verordeningen en richtlijnen, opgenomen in de bijlage bij dit besluit,

      verbieden, tenzij de zending overeenkomstig daartoe door Onze Minister gestelde regels voorzien is van een of meer
      merken en vergezeld gaat van een of meer bewijsstukken aangebracht onderscheidenlijk afgegeven op grond van een van
      Rijkswege ingesteld onderzoek, ten bewijze dat voldaan is aan door Onze Minister met het oog op de uitvoer gestelde
      eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel1
    url: https://wetten.overheid.nl/BWBR0006427/2014-01-01#Artikel2
