  - number: '3'
    text: |-
      1 Een wijziging van een of meer onderdelen van de richtlijnen, genoemd in
      [artikel 2, onderdelen a tot en met c][ref1], treedt voor de toepassing van dat artikelonderdeel, waarin wordt
      verwezen naar de richtlijn die is of de richtlijnen die zijn gewijzigd, in werking met ingang van de dag waarop aan
      de betrokken wijzigingsrichtlijn uiterlijk uitvoering moet zijn gegeven.

      2 Onze Minister doet mededeling in de *Staatscourant* van een wijziging als bedoeld in het eerste lid.


