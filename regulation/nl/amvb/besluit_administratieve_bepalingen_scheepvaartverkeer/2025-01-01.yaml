  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 11 januari 1993, nr. RVR 138115, Hoofddirectie van
    de Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken;

    Gelet op de artikelen 2, eerste lid, 4, eerste lid, onderdelen b en c, 6, eerste en derde lid, 7, vierde lid, en 8
    van de Scheepvaartverkeerswet;

    De Raad van State gehoord (advies van 30 maart 1993, nr. W09.93.0015);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 2 december 1993, nr. RVR 164104,
    Hoofddirectie van de Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel1
  - number: 1.1.a
    text: |-
      wet: de [Scheepvaartverkeerswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004364
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004364
  - number: 1.1.b
    text: 'verkeersbesluit:'
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel1
  - number: 1.1.b.1°
    text: |-
      een besluit tot het aanbrengen of verwijderen van een verkeersteken dat een gebod of verbod dan wel de opheffing
      van een gebod of verbod aangeeft;
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel1
  - number: 1.1.b.2°
    text: een bekendmaking met dezelfde strekking als een verkeersteken als bedoeld onder 1°.
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel1
  - number: '1.2'
    text: |-
      In dit besluit wordt onder bevoegd gezag mede verstaan degene die de desbetreffende bevoegdheid uitoefent vanwege
      dat gezag.
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel1
  - number: '2'
    text: 'Het bevoegd gezag brengt slechts verkeerstekens aan opgenomen in:'
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel2
  - number: 2.a
    text: |-
      voor wat betreft het [Binnenvaartpolitiereglement](onbekend) met uitzondering van de Waddenzee, de bij dat besluit
      behorende [bijlagen 7][ref1] en [8][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003628
      [ref2]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003628
      - id: ref2
        bwb_id: BWBR0003628
  - number: 2.b
    text: |-
      voor wat betreft het [Binnenvaartpolitiereglement](onbekend) op de Waddenzee, de bij dat besluit behorende
      [bijlage 7][ref1] en het IALA betonningssysteem Regio A;


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 2.c
    text: voor wat betreft het Rijnvaartpolitiereglement 1995, de bij dat besluit behorende bijlagen 7 en 8;
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel2
  - number: 2.d
    text: |-
      voor wat betreft het [Scheepvaartreglement Eemsmonding][ref1], de bij dat besluit behorende [bijlage 1, hoofdstuk
      I](onbekend);


      [ref1]: https://wetten.overheid.nl/BWBR0004552
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004552
  - number: 2.e
    text: |-
      voor wat betreft het [Scheepvaartreglement voor het Kanaal van Gent naar Terneuzen][ref1], de bij dat besluit
      behorende [bijlagen 5][ref2] en [6][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0005315
      [ref2]: https://wetten.overheid.nl/BWBR0005315
      [ref3]: https://wetten.overheid.nl/BWBR0005315
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005315
      - id: ref2
        bwb_id: BWBR0005315
      - id: ref3
        bwb_id: BWBR0005315
  - number: 2.f
    text: |-
      voor wat betreft het [Scheepvaartreglement Westerschelde 1990][ref1], het IALA betonningssysteem Regio A;


      [ref1]: https://wetten.overheid.nl/BWBR0005393
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005393
  - number: 2.g
    text: |-
      voor wat betreft het [Besluit Scheepvaartreglement Gemeenschappelijke Maas][ref1], de bij dat besluit behorende
      [bijlagen II][ref2] en [III][ref3]; en


      [ref1]: https://wetten.overheid.nl/BWBR0006618
      [ref2]: https://wetten.overheid.nl/BWBR0006618
      [ref3]: https://wetten.overheid.nl/BWBR0006618
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006618
      - id: ref2
        bwb_id: BWBR0006618
      - id: ref3
        bwb_id: BWBR0006618
  - number: 2.h
    text: |-
      voor wat betreft het [Scheepvaartreglement territoriale zee][ref1], de bij dat besluit behorende [bijlage 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007914
      [ref2]: https://wetten.overheid.nl/BWBR0007914
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007914
      - id: ref2
        bwb_id: BWBR0007914
  - number: '3'
    text: |-
      Indien bij verkeerstekens bijkomende tekens worden aangebracht die de werking van het verkeersteken wijzigen, wordt
      zulks in het betrokken verkeersbesluit tot uitdrukking gebracht.
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel3
  - number: '4'
    text: 'Geen verkeersbesluit behoeft te worden genomen indien:'
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel4
  - number: 4.a
    text: |-
      het betrokken verkeersteken wordt aangebracht of verwijderd ter nadere aanduiding dat een regel met betrekking tot
      het deelnemen aan het scheepvaartverkeer van toepassing is, dan wel
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel4
  - number: 4.b
    text: een ander verkeersteken, dat een gebod of een verbod inhoudt, is aangebracht.
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel4
  - number: '5'
    text: |-
      De motivering van een verkeersbesluit vermeldt in ieder geval welke doelstelling of doelstellingen met het besluit
      worden beoogd. Daarbij wordt aangegeven welke van de in [artikel 3][ref1] van de wet genoemde belangen aan het
      besluit ten grondslag liggen.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel3
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '3'
  - number: '6'
    text: |-
      Bij de voorbereiding van een verkeersbesluit voert het bevoegd gezag overleg met de bij dat besluit belanghebbende
      openbare lichamen en instellingen.
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel6
  - number: '7'
    text: |-
      Onverminderd [artikel 14, eerste lid][ref1], van de wet, geschieden het aanbrengen, het onderhoud en de
      verwijdering van verkeerstekens door de zorg en op kosten van het bevoegd gezag dat tot het aanbrengen of de
      verwijdering heeft besloten.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel14
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '14'
  - number: '8'
    text: |-
      De uitvoering van een bekendmaking met dezelfde strekking als een verkeersteken geschiedt door de zorg en op kosten
      van het bevoegd gezag dat de bekendmaking heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel8
  - number: '9'
    text: |-
      Onverminderd [artikel 14, eerste lid][ref1], van de wet, zijn de kosten verbonden aan het tijdelijk aanbrengen van
      verkeerstekens ten laste van degene die dit verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel14
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '14'
  - number: '10'
    text: |-
      Zonder verkeersbesluit kunnen door het bevoegd gezag in de hierna genoemde omstandigheden en voor de duur van
      die omstandigheden verkeerstekens die een gebod of een verbod dan wel de opheffing van een gebod of een verbod
      aangeven, worden aangebracht ingeval van:
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel10
  - number: 10.a
    text: uitvoering van werken,
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel10
  - number: 10.b
    text: dreigend gevaar, of
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel10
  - number: 10.c
    text: een andere dringende omstandigheid van voorbijgaande aard.
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel10
  - number: '11'
    text: |-
      Degene die de bevoegdheid uitoefent vanwege het bevoegd gezag geeft van het voornemen tot tijdelijk aanbrengen van
      verkeerstekens of, indien hiertoe reeds is overgegaan, van dat feit, zo spoedig mogelijk kennis aan het bevoegd
      gezag, dat de tijdelijke aanbrenging kan voorkomen of ongedaan kan maken. De kennisgeving kan achterwege blijven
      voor zover dit gezag dit heeft bepaald.
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel11
  - number: '12'
    text: |-
      In afwijking van [artikel 10][ref1] geschiedt de tijdelijke aanbrenging krachtens een verkeersbesluit indien
      de omstandigheden die tot de tijdelijke aanbrenging leiden van langere duur zijn dan dertien weken dan wel zich
      regelmatig voordoen. [Paragraaf 4][ref2] is alsdan van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006309#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0006309#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006309
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0006309
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '13.1'
    text: |-
      Voor scheepvaartwegen waar verkeerstekens die een gebod of een verbod dan wel een aanbeveling of een inlichting
      bevatten niet doelmatig zijn, kunnen verkeerstekens worden vervangen door bekendmakingen met dezelfde strekking als
      een verkeersteken.
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel13
  - number: '13.2'
    text: |-
      In de Nederlandse territoriale zee kan in verband met militaire oefeningen, door middel van een bekendmaking met
      dezelfde strekking als een verkeersteken een verbod worden uitgevaardigd met betrekking tot het zich bevinden in
      een bepaald gedeelte daarvan.
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel13
  - number: '13.3'
    text: |-
      In een aanloopgebied als bedoeld in het [Scheepvaartreglement territoriale zee][ref1], kan door middel van een
      bekendmaking met dezelfde strekking als een verkeersteken een verbod worden uitgevaardigd met betrekking tot: - het
      zich bevinden in een bepaald gedeelte van het aanloopgebied,
        - voorbijlopen,
        - ontmoeten,
        - voor anker gaan,
        - het laten slepen van ankers, kabels en kettingen,
        - koers kruisen,
        - het veroorzaken van hinderlijke waterbeweging,
        - het sluiten van een deel van het aanloopgebied voor:
        - kleine schepen,
        - waterskiërs,
        - zeilschepen,
        - door spierkracht voortbewogen schepen,
        - zeilplanken,
        - snelle motorboten,
        - waterscooters.


      [ref1]: https://wetten.overheid.nl/BWBR0007914
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007914
  - number: '13.4'
    text: |-
      In een aanloopgebied als bedoeld in het [Scheepvaartreglement territoriale zee][ref1], kan door middel van een
      bekendmaking met dezelfde strekking als een verkeersteken een gebod worden uitgevaardigd met betrekking tot: - het
      marifoonkanaal waarop een melding door de scheepvaart dient plaats te vinden;
        - punten bij het passeren waarvan een melding door de scheepvaart dient plaats te vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0007914
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007914
  - number: '13.5'
    text: |-
      Met betrekking tot het derde lid is
      [artikel 1.01, onderdeel A, 15° tot en met 18°, van het Binnenvaartpolitiereglement][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel1
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '1'
  - number: '13.6'
    text: |-
      De[ artikelen 4 tot en met 6][ref1] en [10 tot en met 12][ref2] zijn van overeenkomstige toepassing op
      bekendmakingen met dezelfde strekking als een verkeersteken.


      [ref1]: https://wetten.overheid.nl/BWBR0006309#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006309#Artikel10
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006309
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006309
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '14'
    text: |-
      Bij de voorbereiding van een besluit tot vrijstelling voert het bevoegd gezag overleg met de bij dat besluit
      belanghebbende openbare lichamen en instellingen.
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel14
  - number: '18.1'
    text: |-
      Verkeerstekens, aangebracht voor de datum van inwerkingtreding van dit besluit, worden geacht te zijn aangebracht
      overeenkomstig de bepalingen van dit besluit.
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel18
  - number: '18.2'
    text: |-
      Bekendmakingen met dezelfde strekking als een verkeersteken, gedaan voor de inwerkingtreding van dit besluit,
      worden geacht te zijn gedaan overeenkomstig de bepalingen van dit besluit.
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel18
  - number: '19'
    text: Dit besluit treedt in werking met ingang van een bij koninklijk besluit te bepalen datum.
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel19
  - number: '20'
    text: 'Dit besluit wordt aangehaald als: Besluit administratieve bepalingen scheepvaartverkeer.'
    url: https://wetten.overheid.nl/BWBR0006309/2025-01-01#Artikel20
