        artikel: '4'
  - number: '8'
    text: |-
      Vissersvaartuigen en netwerk worden zolang deze goederen toebehoren of hebben toebehoord aan de echtgenote van een
      belanghebbende of van een zoon van een belanghebbende als bedoeld in [het eerste lid van artikel 4][ref1] van dit
      besluit, gelijkgesteld met eigendommen van die belanghebbende of van die zoon van een belanghebbende.


      [ref1]: https://wetten.overheid.nl/BWBR0002420#Artikel4
    url: https://wetten.overheid.nl/BWBR0002420/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002420
        artikel: '4'
  - number: '9'
    text: |-
      Voor vaartuigen en voor netwerk, in onverdeelde eigendom mede toebehorende aan hem die op de vergoeding van
      waardevermindering aanspraak kan maken, wordt die vergoeding voor het geheel van die goederen toegekend.
    url: https://wetten.overheid.nl/BWBR0002420/2002-01-01#Artikel9
  - number: '10'
    text: |-
      De vergoeding wordt, behoudens het bepaalde in de [artikelen 13][ref1] en [14][ref2] van dit besluit, vastgesteld
      op het verschil tussen de werkelijke waarde van schepen en van netwerk en de basiswaarde daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0002420#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002420#Artikel14
    url: https://wetten.overheid.nl/BWBR0002420/2002-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002420
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0002420
        artikel: '14'
  - number: '11'
    text: |-
      1 Als werkelijke waarde van vissersvaartuigen en van netwerk wordt beschouwd de opbrengst ervan bij openbare
      verkoop, geschied onder gewone omstandigheden op een geschikte tijd en op een geschikte plaats, na verkregen
      toestemming van Onze Minister, dan wel een bedrag dat Onze Minister in overeenstemming met de aanvrager van de
      vergoeding heeft bepaald.

      2 Indien verkoop heeft plaats gevonden zonder toestemming van Onze Minister, stelt hij de werkelijke waarde vast.

      Hetzelfde geldt voor het geval van verkoop op grond van artikel 1223 van het Burgerlijk wetboek en voor het geval
      van executoriale verkoop.

      3 Indien binnen zes maanden nadat de vastgestelde basiswaarde overeenkomstig het bepaalde in het
      [tweede lid van artikel 12][ref1] van dit besluit ter kennis van de aanvrager van de vergoeding is gebracht, de
      werkelijke waarde niet in overeenstemming met die aanvrager is kunnen worden bepaald, of ingeval die aanvrager geen
      toestemming tot openbare verkoop aan Onze Minister heeft gevraagd, is de Minister bevoegd, de werkelijke waarde
      vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002420#Artikel12
    url: https://wetten.overheid.nl/BWBR0002420/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002420
        artikel: '12'
  - number: '12'
    text: |-
      1 De basiswaarde is de waarde die vissersvaartuigen en netwerk op het tijdstip van de buitengebruikstelling
      van deze goederen, die is voorafgegaan aan of heeft plaatsgevonden tegelijkertijd met het inleveren van de
      visvergunning, zouden hebben gehad, respectievelijk zouden hebben indien de inpolderingen in het IJsselmeer in 1950
      niet waren hervat.

      2 De basiswaarde wordt, indien de uitvoering van dit besluit daartoe aanleiding geeft, door de in
      [artikel 15][ref1] van dit besluit bedoelde deskundigen vastgesteld. De vastgestelde basiswaarde wordt zo spoedig
      mogelijk medegedeeld aan Onze Minister, die haar onverwijld schriftelijk ter kennis brengt van de aanvrager van
      de vergoeding.

      3 De basiswaarde van de daarvoor in aanmerking komende goederen kan op verzoek van een belanghebbende of van een
      zoon van een belanghebbende, die in de mogelijkheid verkeert aanspraken te verkrijgen op een vergoeding, worden
      vastgesteld. Deze vaststelling zal aan de latere berekening van de vergoeding ten grondslag strekken. Voor deze
      vaststelling wordt aan de verzoeker een door Onze Minister te bepalen bedrag in rekening gebracht, dat bij latere
      inlevering van de visvergunning wordt terugbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002420#Artikel15
    url: https://wetten.overheid.nl/BWBR0002420/2002-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002420
        artikel: '15'
  - number: '13'
    text: |-
      1 Ten aanzien van houten vissersvaartuigen, die zijn gebouwd vóór 1932, bedraagt de vergoeding









                    a.


                    voor een Volendammer kwak


                    € 453,78




                    b.


                    voor een zuidwalbotter, groot model of voor een aak


                    € 363,02




                    c.


                    voor een zuidwalbotter, klein model, voor een grote pluut of voor een bons


                    € 272,27




                    d.


                    voor een kleine pluut of voor een schouw


                    € 90,76






      2 Met uitzondering van motorbotters, dienende voor de aalkuilvisserij met gebruikmaking van mechanische kracht,
      worden andere vóór 1932 gebouwde houten vissersvaartuigen dan de in het vorige lid genoemde, geacht geen
      waardevermindering te hebben ondergaan in de zin van dit besluit.

      3 Evenmin worden stalen vissersvaartuigen, gebouwd tussen 1 januari 1932 en 1 mei 1940, geacht waardevermindering
      te hebben ondergaan in de zin van dit besluit.
    url: https://wetten.overheid.nl/BWBR0002420/2002-01-01#Artikel13
  - number: '14'
    text: |-
      1 De vergoeding voor netten, gebezigd voor de aalkuilvisserij, bedraagt ten hoogste een derde van de kostprijs van
      dergelijke netten ten tijde van de buitengebruikstelling en wordt ten hoogste over vier van die netten toegekend.

      2 Voor niet in het vorige lid bedoelde netten van katoen of van linnen en voor katoenen fuiken, die vóór 1 januari
      1958 na beëindiging van het visserijbedrijf buiten gebruik zijn gesteld, wordt ten hoogste een derde van de
      kostprijs ten tijde van de buitengebruikstelling vergoed.

      3 Geen vergoeding wordt gegeven voor: niet in het eerste lid van dit artikel bedoelde netten van katoen of van
      linnen en voor katoenen fuiken, die na 31 december 1957 buiten gebruik zijn gesteld; voor hoekwant en voor netten
      en fuiken van kunstvezels.
    url: https://wetten.overheid.nl/BWBR0002420/2002-01-01#Artikel14
  - number: '15'
    text: |-
      1 Onze Minister benoemt, de Generale Commissie gehoord, deskundigen die beslissen omtrent

      a. de basiswaarde van vissersvaartuigen;

      b. de indeling van een vissersvaartuig in een van de categorieën, genoemd in het [eerste lid van artikel 13][ref1]
      van dit besluit, indien er over die indeling twijfel bestaat;

      c. het aantal netten en fuiken, als bedoeld in het tweede lid van het vorige artikel, nodig voor de uitoefening van
      het bedrijf in de omvang, waarin die uitoefening in 1950, 1951 of 1952 geschiedde;

      d. de kostprijs en omtrent het te vergoeden bedrag, ingeval omtrent de kostprijs van de in het eerste en tweede
      lid van het vorige artikel bedoelde netten tussen Onze Minister en de aanvrager geen overeenstemming bestaat
      zomede ingeval Onze Minister van oordeel is, dat de vergoeding op minder dan een derde van de kostprijs moet worden
      bepaald en die vergoeding niet is kunnen worden vastgesteld in overeenstemming met de aanvrager ervan.

      2 De deskundigen worden vanwege Onze Minister beëdigd. Onze Minister stelt de af te leggen eed vast.

      3 Onze Minister stelt regelen welke de deskundigen hebben in acht te nemen. Beslissingen van de deskundigen waarbij
      deze regelen niet in acht zijn genomen, kunnen door Onze Minister worden vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002420#Artikel13
    url: https://wetten.overheid.nl/BWBR0002420/2002-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002420
        artikel: '13'
  - number: '16'
    text: |-
      1 Aanvragen om vergoeding van waardevermindering moeten, voor zover de belanghebbende of de zoon van een
      belanghebbende als bedoeld in het [eerste lid van artikel 4][ref1] van dit besluit, zijn visvergunning bij het
      in werking treden van dit besluit reeds heeft ingeleverd, uiterlijk een jaar na de dagtekening van dit besluit en
      overigens uiterlijk een jaar nadat de visvergunning is ingeleverd of blijvend is ingetrokken, worden ingediend bij
      Onze Minister.

      2 Bij overschrijding van de in het vorige lid genoemde termijnen vervallen de aanspraken die aan het bepaalde in
      deze titel zouden kunnen worden ontleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002420#Artikel4
    url: https://wetten.overheid.nl/BWBR0002420/2002-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002420
        artikel: '4'
  - number: '17'
    text: |-
      1 De vergoeding, berekend overeenkomstig het bepaalde in deze titel, wordt vastgesteld bij een beschikking van
      Onze Minister.

      2 Zij wordt uitbetaald aan de aanvrager nadat hij een verklaring heeft ondertekend en afgegeven, inhoudende dat
      hij het bedrag van de vastgestelde vergoeding als juist erkent, en dat hij dientengevolge noch op grond van de
      [Zuiderzeesteunwet][ref1], noch op grond van dit besluit enig verder recht op vergoeding van waardevermindering
      doet gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0001925
    url: https://wetten.overheid.nl/BWBR0002420/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001925
  - number: '18'
    text: |-
      1 Indien de aanvrager ten tijde van de vaststelling van de vergoeding schulden heeft wegens een crediet of enige
      credieten, verleend hetzij ingevolge de [Zuiderzeesteunwet][ref1], hetzij door de Credietvereniging voor de
      Zuiderzee, of schulden heeft wegens een crediet of enige credieten, verstrekt ingevolge een door Onze Minister van
      Financiën vastgestelde garantieregeling, strekt de toegekende vergoeding in de eerste plaats tot delging van deze
      schulden.

      2 Schulden als in het vorige lid bedoeld, die op grond van dezelfde oorzaak, mede ten laste zijn van andere
      personen dan de aanvrager van de vergoeding, of die ten laste zijn van zijn echtgenote, worden voor de toepassing
      van dit artikel geacht schulden te zijn van de aanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0001925
    url: https://wetten.overheid.nl/BWBR0002420/2002-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001925
  - number: '19'
    text: |-
      Indien uit enig feit blijkt, dat de vergoeding op grond van onjuiste gegevens, door of vanwege de aanvrager
      verstrekt, is vastgesteld op een te hoog bedrag, wordt zij herzien zolang niet sedert de eerste vaststelling drie
      jaren zijn verstreken. Het te veel uitgekeerde wordt verhaald op de aanvrager of op hem die in zijn rechten is
      getreden.
    url: https://wetten.overheid.nl/BWBR0002420/2002-01-01#Artikel19
  - number: '34'
    text: |-
      De aanvraag om vergoeding of een tegemoetkoming, toe te kennen volgens het bepaalde in de [titels II][ref1] en III
      van dit besluit, wordt bij Onze Minister ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0002420
    url: https://wetten.overheid.nl/BWBR0002420/2002-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002420
  - number: '36'
    text: |-
      1 Tegen beschikkingen, gegrond op de [Zuiderzeesteunwet][ref1], het Zuiderzeesteunbesluit 1963 en de op die wet
      en/of dat besluit gebaseerde regelingen, kan hij te wiens aanzien de beslissing is genomen, bij Onze Minister een
      bezwaarschrift indienen behalve voorzoveel het gaat om beslissingen bedoeld in [artikel 15][ref2] van dit besluit.

      2 Onze Minister hoort, alvorens op het bezwaarschrift te beschikken, de subcommissie voor de bezwaarschriften,
      bedoeld in [artikel 8, derde lid, van het Koninklijk besluit van 18 december 1925][ref3] (*Stb.* 475), zoals dit
      laatstelijk is gewijzigd bij het Koninklijk besluit van 2 december 1938 (*Stb.* 579K.


      [ref1]: https://wetten.overheid.nl/BWBR0001925
