preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 11 januari 1963, No. 70801, Directie van de
    Waterstaat, afdeling P;

    Overwegende, dat het aantal houders van een visvergunning als bedoeld in artikel 17 van de Visscherijwet (Stb.
    1931, 410) voor het vissen in het IJsselmeer nog niet zodanig is afgenomen, dat voor de toekomst een economisch
    verantwoorde exploitatie van het voor de IJsselmeervisserij beschikbaar blijvende viswater mag worden verwacht;

    dat het nodig is, maatregelen te treffen teneinde vermindering van dat aantal te bevorderen, en teneinde in verband
    met de mede daarvoor bij de wet van 3 mei 1962 (Stb. 167) aangebrachte wijzigingen in de Zuiderzeesteunwet de op
    deze wet gegronde regelingen betreffende tegemoetkomingen aan belanghebbenden te herzien;

    dat het aanbeveling verdient, die regelingen voorzover zij tot nu toe zijn vervat in het Zuiderzeesteunbesluit
    (Stb. 1927, 365) en in het Koninklijk besluit van 19 mei 1932, nr. 20, zoals die besluiten sedert die datum zijn
    gewijzigd, in één besluit op te nemen;

    Gelet op de artikelen 6, 6a, 8, 12 en 13 juncto artikel 14 van de Zuiderzeesteunwet (Stb. 1925, 290);

    De Raad van State gehoord (advies van 13 februari 1963, nr. 54);

    Gezien het nader rapport van Onze voornoemde Minister van 25 juni 1963, No. 32813, Directie van de Waterstaat,
    afdeling P;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002420/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bij of krachtens dit besluit bepaalde wordt verstaan onder

      a. de [Zuiderzeesteunwet][ref1]: de [Zuiderzeesteunwet][ref2] (*Stb.* 1925, 290);

      b. Onze Minister: Onze Minister, belast met de uitvoering van de [Zuiderzeesteunwet][ref3];

      c. de Generale Commissie: de Generale Commissie, bedoeld in [artikel 3 van de Zuiderzeesteunwet][ref4];

      d.

      e.

      f. een belanghebbende: een belanghebbende als bedoeld in [artikel 1 van de Zuiderzeesteunwet][ref5], alsmede een op
      grond van dat artikel en van [artikel 1][ref6] met een belanghebbende gelijkgestelde;

      g. een visvergunning: een vergunning, bedoeld in [artikel 21 van de Visserijwet 1963][ref7] (*Stb.* 312) voor het
      vissen in het IJsselmeer;

      h. het inleveren van een vergunning: het afstand doen van de rechten, voortvloeiende uit een geldende
      visvergunning, waaronder wordt begrepen het niet-weder-in-aanmerking-komen voor een visvergunning bij de aanvang
      van een nieuw vergunningsjaar, tenzij dit een gevolg is van laakbare gedragingen;

      i. een grootbedrijf: een scheepswerf of een door Onze Minister daarmede gelijkgesteld bedrijf, voor zover die
      scheepswerf of dat bedrijf vóór 31 mei 1932 in hoofdzaak gegrond was op de Zuiderzeevisserij;


