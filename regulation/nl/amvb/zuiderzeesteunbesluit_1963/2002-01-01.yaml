  - number: '3'
    text: |-
      In deze titel wordt onder vergoeding verstaan:

      vergoeding van waardevermindering van vissersvaartuigen en van netwerk als bedoeld in [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001925#Artikel6a
    url: https://wetten.overheid.nl/BWBR0002420/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001925
        artikel: 6a
  - number: '4'
    text: |-
      1 Met inachtneming van hetgeen overigens in deze titel is bepaald wordt de vergoeding toegekend aan de
      belanghebbende alsmede aan de zoon van een belanghebbende, voor zover deze

      a. in 1950, 1951 of 1952 houder waren van een visvergunning en

      b. hun bedrijf bij inlevering van de visvergunning zonder in die vergunning te zijn opgevolgd, hebben opgeheven
      vóór 1 juni 1976.

      2 Bij overlijden van de belanghebbende of van de zoon van een belanghebbende als bedoeld in het vorige lid, treedt,
      voor zover er geen opvolging in de vergunning heeft plaatsgehad, met uitsluiting van alle anderen de weduwe in
      diens plaats of, indien hij geen weduwe achterlaat, zijn erfgenamen in de eerste en bij gebreke van dezen zijn
      erfgenamen in de tweede graad van bloedverwantschap in rechte nederdalende lijn.
    url: https://wetten.overheid.nl/BWBR0002420/2002-01-01#Artikel4
  - number: '5'
    text: |-
      De belanghebbende en de zoon van een belanghebbende, die na 1952 en vóór 1 juni 1976 een houder van een
      visvergunning als bedoeld in het eerste lid onder *a* van het vorige artikel, in die vergunning zijn opgevolgd,
      worden voor de toepassing van deze titel geacht, in 1950, 1951 of 1952 houder van een visvergunning te zijn
      geweest.
    url: https://wetten.overheid.nl/BWBR0002420/2002-01-01#Artikel5
  - number: '6'
    text: |-
      Behoudens de in deze titel gestelde beperkingen betreft de vergoeding vissersvaartuigen en netwerk, die voor de
      belanghebbende of voor de zoon van een belanghebbende als bedoeld in [het eerste lid van artikel 4][ref1] van dit
      besluit, overbodig zijn geworden bij de opheffing van zijn bedrijf, voor zover deze goederen in 1950, 1951 of 1952
      zijn eigendom waren en werden gebezigd voor de uitoefening van het IJsselmeervisserijbedrijf, waarvoor hem een
      visvergunning was verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002420#Artikel4
    url: https://wetten.overheid.nl/BWBR0002420/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002420
        artikel: '4'
  - number: '7'
    text: |-
      Met de in het vorige artikel bedoelde goederen worden voor de toepassing van deze titel gelijkgesteld

      a. vissersvaartuigen en netwerk, door de belanghebbende of door een zoon van een belanghebbende als
      bedoeld in [het eerste lid van artikel 4][ref1] van dit besluit, gebezigd voor de uitoefening van het
      IJsselmeervisserijbedrijf, waarvoor hem een visvergunning was verleend, mits deze goederen in 1950, 1951 of 1952 in
      eigendom toebehoorden aan degeen in wiens visvergunning hij is opgevolgd;

      b. vissersvaartuigen en netwerk, na 1952 eigendom geworden van de belanghebbende of van de zoon van een
      belanghebbende als bedoeld in [het eerste lid van artikel 4][ref2] van dit besluit, nadat hij reeds in 1950, 1951
      of 1952 houder of bezitter te goeder trouw ervan is geweest, voor zover deze goederen althans in één van die jaren
      werden gebezigd voor de uitoefening van het IJsselmeervisserijbedrijf, waarvoor hem een visvergunning was verleend
      mits zij tot de opheffing van zijn bedrijf zijn eigendom zijn gebleven;

      c. vissersvaartuigen en netwerk, na 1952 eigendom geworden van de belanghebbende of van de zoon van een
      belanghebbende als bedoeld in [het eerste lid van artikel 4][ref3] van dit besluit, of van hem, in wiens rechten
      deze als opvolger in de IJsselmeervisserij is getreden, mits zij hebben gestrekt om zijn IJsselmeervisserijbedrijf
      uiterlijk tot de opheffing daarvan te kunnen uitoefenen in de omvang waarin en de wijze waarop dit in 1950, 1951 of
      1952 geschiedde.


      [ref1]: https://wetten.overheid.nl/BWBR0002420#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002420#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002420#Artikel4
    url: https://wetten.overheid.nl/BWBR0002420/2002-01-01#Artikel7
    references:
