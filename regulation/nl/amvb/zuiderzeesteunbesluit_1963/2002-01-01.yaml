  - number: '37'
    text: |-
      Het einde van de termijnen van 3 en 5 jaar, bedoeld in [het tweede lid van artikel 13 van de Zuiderzeesteunwet]
      (onbekend), blijft vastgesteld voor belanghebbenden benoorden de Afsluitdijk op respectievelijk 30 april 1941 en 30
      april 1943 en voor de overige belanghebbenden op 31 december 1934 respectievelijk 31 december 1936.
    url: https://wetten.overheid.nl/BWBR0002420/2002-01-01#Artikel37
  - number: '38'
    text: |-
      Met het in werking treden van dit besluit vervallen:

      a. het Zuiderzeesteunbesluit van 28 november 1927 (*Stb.* 365), zoals dit besluit sedert die datum is gewijzigd;

      b. het Koninklijk besluit van 19 mei 1932, zoals dit besluit sedert die datum is gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002420/2002-01-01#Artikel38
  - number: '39'
    text: Dit besluit kan worden aangehaald als Zuiderzeesteunbesluit 1963.
    url: https://wetten.overheid.nl/BWBR0002420/2002-01-01#Artikel39
  - number: '40'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin het
      wordt geplaatst en werkt terug tot en met 1 januari 1960.
    url: https://wetten.overheid.nl/BWBR0002420/2002-01-01#Artikel40
