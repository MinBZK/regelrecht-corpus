  - number: '2'
    text: |-
      1 De tegemoetkoming in geld, bedoeld in het tweede lid van [artikel 6 van de Zuiderzeesteunwet][ref1], bedraagt in
      geen geval meer dan € 453,78.

      2 De belanghebbende die een vergoeding van waardevermindering als bedoeld in [artikel 6][ref2] heeft gekregen,
      kan op grond van het [tweede lid van artikel 6 van de Zuiderzeesteunwet][ref3] slechts worden tegemoetgekomen
      in zoverre de na 31 december 1959 genoten vergoeding van waardevermindering, alle andere omstandigheden mede in
      aanmerking genomen, geen oplossing biedt voor de moeilijkheden die de liquidatie van zijn bedrijf ondervindt.


      [ref1]: https://wetten.overheid.nl/BWBR0001925#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001925#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0001925#Artikel6
