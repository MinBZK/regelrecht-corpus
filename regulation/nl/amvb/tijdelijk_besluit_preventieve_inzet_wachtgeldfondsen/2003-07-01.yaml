---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: tijdelijk_besluit_preventieve_inzet_wachtgeldfondsen
regulatory_layer: AMVB
publication_date: '2000-05-11'
valid_from: '2003-07-01'
bwb_id: BWBR0011324
url: https://wetten.overheid.nl/BWBR0011324/2003-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid, J.F. Hoogervorst, van 25 februari
    2000, Nr. SV/WV/00/10225a;

    Gelet op artikel 130c van de Werkloosheidswet;

    De Raad van State gehoord (advies van 10 maart 2000, no. W12.00.0082/IV);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid, J.F. Hoogervorst, van 20
    april 2000, Directie Sociale Verzekeringen, Nr. SV/WV/00/17519;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0011324/2003-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011324/2003-07-01#Artikel1
  - number: 1.a
    text: |-
      UVW: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk eninkomen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0011324/2003-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: 1.b
    text: |-
      betrokkene: werknemer op wie dit besluit op grond van [artikel 3][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0011324#Artikel3
    url: https://wetten.overheid.nl/BWBR0011324/2003-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011324
        artikel: '3'
  - number: 1.c
    text: |-
      WW-uitkering: uitkering op grond van de [Werkloosheidswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0011324/2003-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '2'
    text: |-
      Het met dit besluit beoogde resultaat is het verschaffen van inzicht in het effect van de preventieve inzet van
      middelen uit de wachtgeldfondsen en het Uitvoeringsfonds voor de overheid om het ontstaan van recht op WW-uitkering
      te voorkomen.
    url: https://wetten.overheid.nl/BWBR0011324/2003-07-01#Artikel2
  - number: '3.1'
    text: 'Dit besluit is van toepassing op de werknemer:'
    url: https://wetten.overheid.nl/BWBR0011324/2003-07-01#Artikel3
  - number: 3.1.a
    text: |-
      waarvan redelijkerwijs valt aan te nemen dat zijn dienstbetrekking binnen vier maanden zal eindigen ter uitvoering
      van een voornemen als bedoeld in [artikel 3, eerste lid, van de Wet melding collectief ontslag][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0003026#Artikel3
    url: https://wetten.overheid.nl/BWBR0011324/2003-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003026
        artikel: '3'
  - number: 3.1.b
    text: |-
      waarvan redelijkerwijs vaststaat dat hij, indien toepassing van dit besluit achterwege blijft, als gevolg van de
      eindiging van de dienst-betrekking, bedoeld in onderdeel a, recht op WW-uitkering zal krijgen.
    url: https://wetten.overheid.nl/BWBR0011324/2003-07-01#Artikel3
  - number: '3.2'
    text: 'Dit besluit is eveneens van toepassing op de werknemer:'
    url: https://wetten.overheid.nl/BWBR0011324/2003-07-01#Artikel3
  - number: 3.2.a
    text: waarvan redelijkerwijs valt aan te nemen dat zijn dienstbetrekking binnen vier maanden zal eindigen; en
    url: https://wetten.overheid.nl/BWBR0011324/2003-07-01#Artikel3
  - number: 3.2.b
    text: |-
      waarvan redelijkerwijs valt aan te nemen dat hij, indien toepassing van dit besluit achterwege blijft, de
      eerstvolgende jaren per kalenderjaar meermaals recht op WW-uitkering zal krijgen.
    url: https://wetten.overheid.nl/BWBR0011324/2003-07-01#Artikel3
  - number: '4.1'
    text: |-
      Het UWV stelt voor de betrokkene, op diens aanvraag, een traject vast gericht op het ingeschakeld blijven in het
      arbeidsproces.
    url: https://wetten.overheid.nl/BWBR0011324/2003-07-01#Artikel4
  - number: '4.2'
    text: |-
      Het UWV draagt ter uitvoering van het eerste lid werkzaamheden op aan de Arbeidsvoorzieningsorganisatie of aan
      derden, niet zijnde uitvoeringsinstellingen, waardoor de betrokkene in staat wordt gesteld deel te nemen aan
      activiteiten die bijdragen tot het ingeschakeld blijven in het arbeidsproces.
    url: https://wetten.overheid.nl/BWBR0011324/2003-07-01#Artikel4
  - number: '4.3'
    text: |-
      De activiteiten, bedoeld in het tweede lid, mogen niet gericht zijn op het behouden van de dienstbetrekking,
      bedoeld in [artikel 3][ref1], of het opnieuw ontstaan van een dienstbetrekking tussen betrokkene en zijn werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0011324#Artikel3
    url: https://wetten.overheid.nl/BWBR0011324/2003-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011324
        artikel: '3'
  - number: '4.4'
    text: |-
      Het UWV heeft de taak, bedoeld in het eerste lid, met betrekking tot de werknemer, bedoeld in
      [artikel 3, eerste lid][ref1], niet meer na afloop van het kwartaal, volgend op het kwartaal waarin het aantal
      werknemers, bedoeld in dat lid, waarvoor een traject is vastgesteld, de duizend heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0011324#Artikel3
    url: https://wetten.overheid.nl/BWBR0011324/2003-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011324
        artikel: '3'
  - number: '4.5'
    text: |-
      Het UWV heeft de taak, bedoeld in het eerste lid, met betrekking tot de werknemer, bedoeld in
      [artikel 3, tweede lid][ref1], niet meer na afloop van het kwartaal, volgend op het kwartaal waarin het aantal
      werknemers, bedoeld in dat lid, waarvoor een traject is vastgesteld, de duizend heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0011324#Artikel3
    url: https://wetten.overheid.nl/BWBR0011324/2003-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011324
        artikel: '3'
  - number: '5.1'
    text: |-
      Het UWV is bevoegd om nadere regels te stellen met betrekking tot de aanvraag, bedoeld in
      [artikel 4, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011324#Artikel4
    url: https://wetten.overheid.nl/BWBR0011324/2003-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011324
        artikel: '4'
  - number: '5.2'
    text: De aanvragen worden behandeld in volgorde van binnenkomst.
    url: https://wetten.overheid.nl/BWBR0011324/2003-07-01#Artikel5
  - number: '6'
    text: |-
      Dit besluit treedt in werking met ingang van de dag gelegen drie maanden na de datum van uitgifte van het
      Staatsblad waarin het wordt geplaatst en vervalt vier jaar na die dag.
    url: https://wetten.overheid.nl/BWBR0011324/2003-07-01#Artikel6
  - number: '7'
    text: 'Dit besluit wordt aangehaald als: Tijdelijk besluit preventieve inzet wachtgeldfondsen.'
    url: https://wetten.overheid.nl/BWBR0011324/2003-07-01#Artikel7
