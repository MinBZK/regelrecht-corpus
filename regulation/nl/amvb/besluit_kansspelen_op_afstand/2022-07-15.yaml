  - number: '5.1'
    text: |-
      1 De vergunninghouder rapporteert aan de raad van bestuur periodiek over de uitvoering van:

      a. het integriteitsbeleid, bedoeld in [hoofdstuk 4, afdeling 2][ref1];

      b. de voorschriften met betrekking tot de inschrijving van spelers, bedoeld in [hoofdstuk 4, afdeling 3][ref2];

      c. de voorschriften met betrekking tot de betalingstransacties, bedoeld in [hoofdstuk 4, afdeling 4][ref3], en

      d. de voorschriften met betrekking tot de consumentenbescherming, bedoeld in [hoofdstuk 4, afdeling 5][ref4].

      2 De vergunninghouder informeert de raad van bestuur onverwijld over:

      a. relevante wijzigingen van de in het kader van de aanvraag tot het verlenen van de vergunning of nadien aan de
      raad van bestuur verstrekte informatie;

      b. gedragingen en gebeurtenissen die een ernstig gevaar kunnen vormen voor de verantwoorde, betrouwbare en
      controleerbare organisatie van de vergunde kansspelen of het vertrouwen in de verantwoorde, betrouwbare en
      controleerbare organisatie van de vergunde kansspelen kunnen schaden.

      3 Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot het eerste en tweede lid. Deze
      hebben in ieder geval betrekking op de aard van de te verstrekken gegevens en de frequentie van de rapportages,
      bedoeld in het eerste lid. Daarbij kunnen nadere onderwerpen worden benoemd waarover de vergunninghouder de raad
      van bestuur periodiek rapporteert.


      [ref1]: https://wetten.overheid.nl/BWBR0044773#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0044773#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0044773#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0044773#Hoofdstuk4
