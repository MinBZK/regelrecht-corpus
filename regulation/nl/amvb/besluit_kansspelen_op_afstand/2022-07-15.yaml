  - number: '7.1'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld met betrekking tot het verlenen van tijdelijke ontheffing door
      de raad van bestuur van het vereiste, bedoeld in [artikel 31h, tweede lid, onder b, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel31h
