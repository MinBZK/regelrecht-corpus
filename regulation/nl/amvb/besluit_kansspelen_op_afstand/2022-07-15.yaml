  - number: '4.45'
    text: |-
      Met de aanwijzing als keuringsinstelling wordt gelijkgesteld een aanwijzing of vergelijkbare beschikking afgegeven
      door een bevoegde autoriteit in een andere lidstaat op basis van voorwaarden die een beschermingsniveau bieden
      dat ten minste gelijkwaardig is aan het niveau dat wordt gewaarborgd met [artikel 4.44, eerste lid][ref1]. Artikel
      4.44, derde tot en met zesde lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0044773#Artikel4.44
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.45
