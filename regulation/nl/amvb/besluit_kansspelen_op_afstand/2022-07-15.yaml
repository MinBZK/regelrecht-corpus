  - number: '5.2'
    text: |-
      1 De vergunninghouder treft passende technische en organisatorische maatregelen die de elektronische en fysieke
      toegang tot de elektronische middelen en de daarin opgeslagen gegevens waarborgen van de ambtenaren en personen,
      bedoeld in [artikel 34 van de wet][ref1].

      2 Bij regeling van Onze Minister kunnen technische en operationele vereisten worden gesteld aan de maatregelen,
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel34
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '34'
  - number: '5.3'
    text: |-
      1 De vergunninghouder onderhoudt een controledatabank.

      2 De controledatabank bevat de volgende gegevens:

      a. een niet direct tot de identiteit van de speler herleidbare, unieke aanduiding van iedere speler;

      b. de datum, het tijdstip en de aard van iedere aanpassing en overschrijding van het spelersprofiel;

      c. de aanleiding voor en de datum, het tijdstip en de aard van iedere interventie als bedoeld in artikel 18 van het
      Besluit werving, reclame en verslavingspreventie kansspelen;

      d. de datum, het tijdstip, het bedrag en de aard van iedere creditering en iedere debitering van iedere
      speelrekening, alsmede, waar van toepassing, de aard van het daarbij gebruikte betaalinstrument en, waar van
      toepassing, een niet direct tot de identiteit van de speler herleidbare, unieke aanduiding van de daarbij
      gedebiteerde onderscheidenlijk gecrediteerde betaalrekening,

      e. de totale inzet en speelwinst per spelsoort en, voor zover het betreft een kansspel waarbij de vergunninghouder
      anders dan als inzet een vergoeding ontvangt voor het geven van gelegenheid tot deelneming aan dat kansspel, het
      totale bedrag van die vergoeding.

      3 De vergunninghouder treft passende technische en organisatorische maatregelen die te allen tijde de elektronische
      toegang tot de controledatabank en tot de daarin opgenomen gegevens waarborgen van:

      a. de ambtenaren en personen, bedoeld in [artikel 34 van de wet][ref1];

      b. de personen die op grond van
      [artikel 24, eerste lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref2]
      zijn belast met het toezicht op naleving door instellingen als bedoeld in
      [artikel 1a, vierde lid, onderdeel n, van die wet][ref3], en

      c. de ambtenaren van de Belastingdienst.

      4 De vergunninghouder treft passende technische en organisatorische maatregelen ter beveiliging van de in de
      controledatabank opgenomen gegevens tegen verlies en onrechtmatige verwerking en tegen herleidbaarheid van die
      gegevens tot de persoon van de speler.

      5 De vergunninghouder treft passende technische en organisatorische maatregelen om de veilige overdracht van
      de gegevens naar de controledatabank en de kwaliteit, de volledigheid, de actualiteit, de consistentie, de
      authenticiteit en de onweerlegbaarheid van de in de controledatabank opgenomen gegevens te waarborgen.

      6 Bij regeling van Onze Minister worden nadere technische en operationele vereisten gesteld met betrekking tot de
      controledatabank. Deze hebben in ieder geval betrekking op:

      a. de inrichting en plaatsing van de controledatabank;

      b. de beveiliging van de in de controledatabank opgenomen gegevens;

      c. de kwaliteit, volledigheid actualiteit, consistentie, authenticiteit en onweerlegbaarheid van de in de
      controledatabank opgenomen gegevens;

      d. de vernietiging van de in de controledatabank opgenomen gegevens;

      e. de toegang tot de controledatabank en de daarin opgenomen gegevens, bedoeld in het derde lid, en

      f. het afscheiden van de controledatabank van de andere elektronische middelen.

      7 Bij de regeling, bedoeld in het zesde lid, kunnen nadere categorieën in de controledatabank op te nemen
      gegevens worden vastgesteld en kan worden bepaald dat de vergunninghouder passende technische en organisatorische
      maatregelen treft die te allen tijde de elektronische toegang tot de controledatabank en tot de daarin opgenomen
      gegevens waarborgen van de ambtenaren of personen die op grond van [artikel 10 van de Sanctiewet 1977][ref4] zijn
      belast met het toezicht op naleving van die [wet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
      [ref4]: https://wetten.overheid.nl/BWBR0003296#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0003296
