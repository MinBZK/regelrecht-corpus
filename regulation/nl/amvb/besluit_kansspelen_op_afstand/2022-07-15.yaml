  - number: '4.4'
    text: |-
      1 De vergunninghouder voert ten aanzien van de vergunde kansspelen een afzonderlijke administratie.

      2 De vergunninghouder voert de administratie, bedoeld in het eerste lid, op zodanige wijze dat zijn rechten en
      verplichtingen en de rechten van de speler te allen tijde duidelijk blijken.

      3 De vergunninghouder voert de administratie, bedoeld in het eerste lid, op zodanige wijze dat toezicht op naleving
      van het bepaalde bij en krachtens de [wet][ref1] binnen een redelijke termijn mogelijk is. Daartoe administreert
      hij in ieder geval de gegevens, bedoeld in de [artikelen 5.1][ref2], [5.2][ref3] en [5.3][ref4].

      4 Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot de administratie. Deze hebben in
      ieder geval betrekking op de daarin op te nemen gegevens en de termijnen gedurende welke die gegevens moeten worden
      bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0002469
      [ref2]: https://wetten.overheid.nl/BWBR0044773#Artikel5.1
      [ref3]: https://wetten.overheid.nl/BWBR0044773#Artikel5.2
      [ref4]: https://wetten.overheid.nl/BWBR0044773#Artikel5.3
