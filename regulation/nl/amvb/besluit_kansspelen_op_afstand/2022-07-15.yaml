        afdeling: '7'
  - number: '4.46'
    text: |-
      1 De aangewezen keuringsinstelling heeft rechtspersoonlijkheid.

      2 De aangewezen keuringsinstelling verkeert niet in staat van faillissement of liquidatie. Aan de
      keuringsinstelling is geen surseance van betaling verleend. Er is geen beslag gelegd op een aanmerkelijk deel van
      het vermogen van de aangewezen keuringsinstelling of op een of meer van diens bedrijfsmiddelen die een aanmerkelijk
      deel van zijn vermogen vormen.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.46
  - number: '4.47'
    text: |-
      1 De aangewezen keuringsinstelling is onafhankelijk van de vergunninghouder wiens spelsysteem zij keurt.

      2 De aangewezen keuringsinstelling is in staat haar keuringswerkzaamheden te verrichten zonder enige druk of
      beïnvloeding door de vergunninghouder of derden.

      3 De aangewezen keuringsinstelling heeft in haar organisatie toereikende waarborgen voor de onafhankelijkheid,
      objectiviteit en onpartijdigheid van haar keuringen geïmplementeerd.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.47
  - number: '4.48'
    text: |-
      1 De aangewezen keuringsinstelling voert de keuringswerkzaamheden uit met de hoogste mate van beroepsintegriteit en
      met de vereiste technische bekwaamheid op het specifieke gebied.

      2 De aangewezen keuringsinstelling is te allen tijde in staat alle keuringswerkzaamheden waarvoor zij
      geaccrediteerd is, aan de spelsystemen van de vergunninghouders overeenkomstig de Nederlandse kansspelregelgeving
      te verrichten, ongeacht of deze werkzaamheden door haar zelf of namens haar en onder haar verantwoordelijkheid
      worden verricht.

      3 De aangewezen keuringsinstelling beschikt over een organisatie, werkwijzen en middelen die de beroepsintegriteit
      en technische bekwaamheid waarborgen.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.48
  - number: '4.49'
    text: |-
      1 De aangewezen keuringsinstelling verstrekt Onze Minister desgevraagd alle inlichtingen die deze voor de
      toepassing van [artikel 4.44][ref1] nodig heeft.

      2 De aangewezen keuringstelling verstrekt de raad van bestuur desgevraagd alle inlichtingen die deze voor de
      uitoefening van zijn taken nodig heeft.

      3 Bij de uitvoering van het eerste en tweede lid geeft de aangewezen keuringstelling aan welke gegevens een
      vertrouwelijk karakter dragen en de gronden waarop dit vertrouwelijke karakter berust.


      [ref1]: https://wetten.overheid.nl/BWBR0044773#Artikel4.44
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.49
