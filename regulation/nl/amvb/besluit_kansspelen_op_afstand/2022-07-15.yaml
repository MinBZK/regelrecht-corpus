  - number: '7.2'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende artikelen
      en onderdelen daarvan en voor verschillende soorten kansspelen en verschillende vergunninghouders verschillend kan
      worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel7.2
  - number: '7.3'
    text: 'Dit besluit wordt aangehaald als: Besluit kansspelen op afstand.'
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel7.3
