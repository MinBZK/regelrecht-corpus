  - number: '4.8'
    text: |-
      1 De vergunninghouder die weddenschappen organiseert, draagt voorafgaand aan de weddenschap zorg voor een
      deugdelijke identificatie, analyse en evaluatie van de risico’s voor de integriteit van de betrokken wedstrijd,
      waarbij in ieder geval worden betrokken:

      a. de mate waarin de uitkomst van de wedstrijd van belang is voor de competitie in de desbetreffende sport;

      b. de mate waarin de betrokken sporters tijdig en voldoende worden betaald;

      c. de mate van objectieve verslaglegging van de wedstrijd;

      d. de mate waarin de organisatie van de wedstrijd anderszins met waarborgen tegen manipulatie is omkleed, en

      e. interne en externe signalen die duiden op een risico voor de integriteit van de betrokken wedstrijd.

      2 De vergunninghouder informeert voorafgaande aan de weddenschap in ieder geval de betrokken wedstrijdorganisator
      en de betrokken sportorganisatie over de aard van de door hem te organiseren weddenschap.

      3 De vergunninghouder draagt tijdens en na afloop van de weddenschap zorg voor een deugdelijke identificatie,
      analyse en evaluatie van de risico’s voor de integriteit van de betrokken wedstrijd, waarbij in ieder geval worden
      betrokken:

      a. de indicator, bedoeld in het eerste lid, onder e;

      b. het aantal op die wedstrijd afgesloten weddenschappen, en

      c. de bedragen die worden ingezet bij de weddenschappen op die wedstrijd.

      4 Indien uit het onderzoek, bedoeld in het eerste en derde lid, blijkt van ongebruikelijke feiten of omstandigheden
      die duiden op een verhoogd risico van manipulatie van een wedstrijd, treft de vergunninghouder onverwijld passende
      maatregelen en informeert hij de raad van bestuur en de betrokken wedstrijdorganisator en sportorganisatie
      onverwijld over die feiten of omstandigheden en de getroffen of te treffen maatregelen.

      5 De vergunninghouder draagt er zorg voor dat hij te allen tijde verantwoording kan afleggen over de wijze waarop
      uitvoering is gegeven aan de voorgaande leden.

      6 Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot het eerste tot en met
      het vierde lid. Daarbij kunnen wedstrijden en competities worden aangewezen waarin een voorafgaande identificatie
      en analyse als bedoeld in het eerste lid achterwege kan blijven. Onze Minister stelt organisaties door wie of
      onder wier auspiciën de betrokken wedstrijden of competities worden georganiseerd voorafgaand aan de vaststelling
      of wijziging van een aanwijzing als bedoeld in de tweede volzin in de gelegenheid om schriftelijk advies uit te
      brengen over de risico’s voor de integriteit van de betrokken wedstrijden en competities. Indien Onze Minister
      afwijkt van de uitgebrachte adviezen, doet hij dat onder opgave van redenen.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.8
  - number: '4.9'
    text: |-
      1 De vergunninghouder organiseert geen weddenschappen op wedstrijden ten aanzien waarvan het onderzoek, bedoeld
      in [artikel 4.8, eerste lid][ref1], duidt op een onaanvaardbaar hoog risico op manipulatie van gebeurtenissen of
      uitkomsten.

      2 De vergunninghouder organiseert in ieder geval geen weddenschappen:

      a. op een jeugdwedstrijd;

      b. op een wedstrijd waaraan uitsluitend sporters om niet deelnemen;

      c. op een wedstrijd waarvan het verloop niet objectief wordt vastgelegd;

      d. op een negatieve of eenvoudig te manipuleren gebeurtenis tijdens een wedstrijd;

      e. op een wedstrijd waarop in het land waar die wedstrijd wordt georganiseerd, wegens risico op manipulatie geen
      weddenschappen mogen worden afgesloten.

      3 De vergunninghouder organiseert geen weddenschappen op een wedstrijd, indien:

      a. hij wezenlijke invloed uitoefent op de betrokken wedstrijdorganisator of een belanghebbende bij die wedstrijd,
      of

      b. de betrokken wedstrijdorganisator of een belanghebbende bij die wedstrijd wezenlijke invloed uitoefent op die
      weddenschap of op zijn organisatie.

      4 Bij regeling van Onze Minister kunnen wedstrijden en competities en gebeurtenissen tijdens wedstrijden en
      competities worden aangewezen, waarop geen weddenschappen mogen worden georganiseerd. Onze Minister stelt
      organisaties door wie of onder wier auspiciën de betrokken wedstrijden of competities worden georganiseerd
      voorafgaand aan de vaststelling of wijziging van een aanwijzing als bedoeld in de eerste volzin in de gelegenheid
      om schriftelijk advies uit te brengen over de risico’s voor de integriteit van de betrokken wedstrijden en
      competities. Indien Onze Minister afwijkt van de uitgebrachte adviezen, doet hij dat onder opgave van redenen.


      [ref1]: https://wetten.overheid.nl/BWBR0044773#Artikel4.8
