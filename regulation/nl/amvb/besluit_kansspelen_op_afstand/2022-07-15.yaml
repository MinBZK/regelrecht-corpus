  - number: '5.4'
    text: |-
      1 De vergunninghouder stelt ten genoegen van de raad van bestuur financiële zekerheid voor het nakomen van zijn
      financiële verplichtingen uit:

      a. de kansspelheffing, bedoeld in [artikel 33e van de wet][ref1], en

      b. bestuurlijke sancties wegens overtredingen van bij of krachtens de [wet][ref2] gestelde voorschriften.

      2 Het bedrag waarvoor financiële zekerheid wordt gesteld, is ten hoogste gelijk aan het bedrag van de geldboete van
      de zesde categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref3].

      3 Bij het vaststellen van de hoogte van het bedrag betrekt de raad van bestuur in ieder geval de duurzame
      aanwezigheid van in Nederland gelegen vermogensbestanddelen die mogelijkheid tot verhaal bieden.

      4 De financiële zekerheid kan worden gesteld in de vorm van een waarborgsom, een borgtocht of een bankgarantie, dan
      wel door het treffen van enige andere voorziening waarbij de financiële zekerheid naar het oordeel van de raad van
      bestuur gelijkwaardig is aan een van die vormen van zekerheid.

      5 De vergunninghouder houdt de financiële zekerheid in stand gedurende een door de raad van bestuur te bepalen
      termijn tot maximaal een jaar na de datum waarop de geldigheidsduur van de vergunning is verstreken.

      6 Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de financiële
      zekerheidstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33e
      [ref2]: https://wetten.overheid.nl/BWBR0002469
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel23
