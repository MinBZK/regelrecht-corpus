preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister voor Rechtsbescherming van 3 juli 2020, Directie Wetgeving en Juridische Zaken,
    nr. 2962454;

    Gelet op de artikelen 4a, vijfde lid, 21, derde en vierde lid, 25, vierde en vijfde lid, 27ja, vijfde lid, 30u,
    derde lid, 30v, vijfde lid, 31, tweede lid, 31a, vierde lid, 31b, 31c, tweede lid, 31d, derde lid, 31g, zesde lid,
    31h, tweede en vijfde lid, 31i, vijfde lid, 31j, derde lid, 31k, vijfde en zesde lid, 31l, eerste en vierde lid,
    31m, zesde lid, 33h, achtste lid, 34k, eerste en derde lid, 34l en 35d van de Wet op de kansspelen, 15, eerste
    lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme, 9, eerste lid, van de Wet justitiële en
    strafvorderlijke gegevens, en 18, eerste lid, van de Wet politiegegevens;

    De Afdeling advisering van de Raad van State gehoord advies van 9 december 2020, no. W16.20.0229/II;

    Gezien het nader rapport van de Minister voor Rechtsbescherming van 21 januari 2021, Directie Wetgeving en
    Juridische Zaken, nr. 3171173;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *aangewezen keuringsinstelling:* een door Onze Minister aangewezen, geaccrediteerde instelling als bedoeld in
      [artikel 31h, tweede lid, onder b, van de wet][ref1];
        - *aanmelding:* de aanmelding ter verkrijging van toegang tot de spelersinterface;
        - *betaalinstrument:* het gepersonaliseerd instrument of de gepersonaliseerde instrumenten of het geheel van
      procedures, overeengekomen tussen de vergunninghouder en een betaaldienstverlener, waarvan de vergunninghouder en
      de speler gebruik maken om een betaalopdracht te initiëren;
        - *betalingstransactie:* de door de vergunninghouder of speler geïnitieerde handeling waarbij geldmiddelen worden
      gedeponeerd op of overgemaakt van of naar een speelrekening, ongeacht of er onderliggende verplichtingen tussen de
      vergunninghouder en de desbetreffende speler zijn;
        - *burgerservicenummer:* het burgerservicenummer, bedoeld in
      [artikel 1, onder b, van de Wet algemene bepalingen burgerservicenummer][ref2];
        - *concern:* de economische eenheid waarin rechtspersonen, vennootschappen en natuurlijke personen organisatorisch
      zijn verbonden;
        - *elektronische middelen:* de elektronische middelen, met inbegrip van de controledatabank, bedoeld in
      [artikel 5.3][ref3], die worden gebruikt bij het organiseren van kansspelen op afstand;
        - *gekwalificeerde deelneming:* een rechtstreeks of middellijk belang van ten minste tien procent van het
      geplaatste aandelenkapitaal of een daarmee vergelijkbaar belang, of het rechtstreeks of middellijk kunnen
      uitoefenen van ten minste tien procent van de stemrechten of een daarmee vergelijkbare zeggenschap;
        - *inschrijving:* de inschrijving als speler, bedoeld in [artikel 31k van de wet][ref4];
        - *kansspel:* een gelegenheid als bedoeld in [artikel 1, eerste lid, onder a, van de wet][ref5];
        - *kansspelinterface:* het geheel van elektronische communicatie waarmee de vergunninghouder de vergunde kansspelen
      aanbiedt;
        - *lidstaat:* staat die partij is bij het Verdrag betreffende de werking van de Europese Unie of de Overeenkomst
      betreffende de Europese Economische Ruimte;
        - *niet-kritiek onderdeel van het spelsysteem:* een onderdeel van het spelsysteem dat in het systeem voor
      wijzigingsbeheer, bedoeld in [artikel 4.41][ref6], niet is aangemerkt als kritiek voor de verantwoorde, betrouwbare
      en controleerbare organisatie van de vergunde kansspelen;
        - *Onze Minister:* Onze Minister voor Rechtsbescherming;
        - *raad van bestuur:* de raad van bestuur van de kansspelautoriteit, bedoeld in [artikel 33a van de wet][ref7];
        - *register:* het register, bedoeld in [artikel 33h van de wet][ref8];
        - *Richtlijn 2013/36/EU:* [Richtlijn 2013/36](32013L0036)/EU van het Europees Parlement en de Raad van 26 juni 2013
      betreffende toegang tot het bedrijf van kredietinstellingen en het prudentieel toezicht op kredietinstellingen en
      beleggingsondernemingen, tot wijziging van [Richtlijn 2002/87/EG](32002L0087) en tot intrekking van de [Richtlijnen
      2006/48/EG](32006L0048) en [2006/49/EG](32006L0049) (PbEU 2013, L 176);
        - *Richtlijn (EU) 2015/2366:* Richtlijn (EU) 2015/2366 van het Europees Parlement en de Raad van 25 november 2015
      betreffende betalingsdiensten in de interne markt, houdende wijziging van de [Richtlijnen 2002/65/EG](32002L0065),
      [2009/110/EG](32009L0110) en [2013/36](32013L0036)/EU en Verordening (EU) [nr. 1093/2010](32993L2010) en houdende
      intrekking van [Richtlijn 2007/64/EG](32007L0064) (PbEU 2015, L 337);
        - *speelrekening:* de door de vergunninghouder in zijn spelsysteem op naam van een speler aangehouden rekening
      met het speeltegoed van die speler, die uitsluitend wordt gebruikt ten behoeve van de deelname aan de vergunde
      kansspelen en die is te herleiden tot de persoon van die speler;
        - *speelwinst:* prijzen of premies als bedoeld in [artikel 1, onder a, van de wet][ref9], behaald met deelname aan
      een vergund kansspel;
        - *speler:* degene die bij de vergunninghouder als speler is ingeschreven;
        - *spelersinterface:* het voor de speler na aanmelding toegankelijke gedeelte van de kansspelinterface;
        - *spelersprofiel:* de grenzen aan het speelgedrag, bedoeld in
      [artikel 31k, tweede lid, onder c, van de wet][ref10];
        - *spelsysteem:* de organisatie, de werkwijze en de middelen, waaronder de elektronische middelen, die voor het
      organiseren van de vergunde kansspelen worden gebruikt;
        - *sportwedstrijd:* wedstrijd, georganiseerd door of onder auspiciën van de door het NOC*NSF erkende nationale
      sportorganisaties en hun geledingen, of door vergelijkbare internationale, al dan niet overkoepelende
      sportorganisaties, dan wel een andere wedstrijd van een sport die door het NOC*NSF als sport is aangemerkt;
        - *tegenrekening:* de op naam van een speler aangehouden rekening bij een in een lidstaat gevestigde
      kredietinstelling met een vergunning als bedoeld in artikel 8 van [Richtlijn 2013/36](32013L0036)/EU, bij een
      in een lidstaat gevestigde betaaldienstverlener met een vergunning als bedoeld in artikel 11 van [Richtlijn
      (EU) 2015/2366](32015L2366) of bij een in een lidstaat gevestigde elektronisch geldinstelling als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref11] met een vergunning als bedoeld in [artikel 2:10a][ref12]
      of die voldoet aan [artikel 2:10e van die wet][ref13];
        - *uiteindelijke belanghebbende:* degene die daaronder wordt verstaan op grond van de
      [Wet ter voorkoming van witwassen en financiering van terrorisme][ref14];
        - *vergund kansspel:* een kansspel dat op grond van de vergunning op afstand wordt georganiseerd;
        - *vergunning:* een vergunning tot het organiseren van kansspelen op afstand als bedoeld in
      [artikel 31a van de wet][ref15];
        - *vergunninghouder:* de houder van een vergunning;
        - *wervings- en reclameactiviteiten:* iedere vorm van communicatie waarmee vergunninghouders, al dan niet met
      behulp van derden, direct of indirect hun diensten of goederen aanprijzen;
        - *wet:* de [Wet op de kansspelen][ref16].


