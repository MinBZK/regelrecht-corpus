  - number: '1.2'
    text: |-
      De kansspelen, bedoeld in [artikel 31, tweede lid, van de wet][ref1] zijn de kansspelen die krachtens
      een vergunning op grond van de [artikelen 3][ref2], [8][ref3], [14a][ref4], [15, vierde lid][ref5], en
      [27a, tweede en derde lid, van de wet][ref6] worden georganiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002469#Artikel14a
      [ref5]: https://wetten.overheid.nl/BWBR0002469#Artikel15
      [ref6]: https://wetten.overheid.nl/BWBR0002469#Artikel27a
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel1.2
