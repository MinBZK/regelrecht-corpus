  - number: '4.2'
    text: |-
      1 De vergunninghouder biedt spelers geen krediet aan. Hij bemiddelt niet bij kredietverlening aan spelers. Hij
      biedt geen andere diensten en goederen aan die het vertrouwen in de verantwoorde, betrouwbare en controleerbare
      organisatie van de vergunde kansspelen kunnen schaden of belemmeren.

      2 De vergunninghouder biedt op de kansspelinterface geen andere goederen of diensten dan de vergunde kansspelen
      aan. In afwijking van de eerste volzin mogen op de spelersinterface oefenspelen worden aangeboden ten behoeve van
      de door de vergunninghouder aangeboden vergunde kansspelen.

      3 De kenmerken van de oefenspelen, bedoeld in het tweede lid, met uitzondering van de mogelijkheid van
      daadwerkelijke inleg en daadwerkelijke uitbetaling, zijn identiek aan die van door de vergunninghouder aangeboden
      vergunde kansspelen.

      4 De vergunninghouder organiseert geen kansspelen waarin de speler handelingen moet verrichten die niet van invloed
      zijn op de uitkomst van het kansspel.

      5 De vergunninghouder staat op de kansspelinterface geen wervings- of reclameactiviteiten voor andere goederen en
      diensten en goederen dan de vergunde kansspelen toe.

      6 Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de voorgaande leden.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.2
  - number: '4.3'
    text: |-
      1 De vergunninghouder besteedt werkzaamheden die verband houden met de organisatie van de vergunde kansspelen niet
      uit aan een derde, tenzij:

      a. de naleving door die derde van de voorschriften gesteld bij of krachtens de [wet][ref1], de
      [Wet ter voorkoming van witwassen en financiering van terrorisme][ref2] en de [Sanctiewet 1977][ref3], te allen
      tijde voldoende is gewaarborgd, en

      b. te allen tijde voldoende is gewaarborgd dat de doelmatige en doeltreffende uitvoering van het toezicht op de
      naleving van de voorschriften, bedoeld onder a, daardoor niet wordt belemmerd.

      2 De vergunninghouder die werkzaamheden als bedoeld in het eerste lid uitbesteedt, treft in ieder geval passende
      maatregelen die waarborgen dat:

      a. de voorschriften, bedoeld in het eerste lid, onder a, worden nageleefd;

      b. de doelmatige en doeltreffende uitvoering van het toezicht op die naleving mogelijk is, en

      c. zijn herkenbaarheid als de vergunninghouder voor de speler te allen tijde is gewaarborgd.

      3 De vergunninghouder die werkzaamheden als bedoeld in het eerste lid uitbesteedt, draagt er zorg voor dat hij te
      allen tijde verantwoording kan afleggen over de uitvoering van voorgaande leden.


      [ref1]: https://wetten.overheid.nl/BWBR0002469
      [ref2]: https://wetten.overheid.nl/BWBR0024282
      [ref3]: https://wetten.overheid.nl/BWBR0003296
