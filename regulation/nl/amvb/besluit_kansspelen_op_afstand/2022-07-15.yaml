  - number: '3.2'
    text: |-
      De vergunninghouder beschikt te allen tijde over ten minste de volgende gegevens:

      a. de identiteit en de antecedenten van zijn leidinggevenden, degenen die zijn beleid bepalen of mede bepalen en
      van de personen op sleutelposities;

      b. de identiteit en de antecedenten van degenen die een gekwalificeerde deelneming houden in zijn onderneming en de
      omvang van de desbetreffende gekwalificeerde deelneming;

      c. de identiteit en de antecedenten van de uiteindelijke belanghebbende;

      d. de identiteit van de onmiddellijke vermogensverschaffers, en

      e. de formele en feitelijke organisatie-, financierings-, eigendoms- en zeggenschapsstructuur van het concern
      waartoe hij behoort.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel3.2
  - number: '3.3'
    text: |-
      1 De continuïteit van de vergunninghouder is in ieder geval niet gewaarborgd, indien:

      a. de vergunninghouder in staat van faillissement of liquidatie verkeert;

      b. aan de vergunninghouder surseance van betaling is verleend;

      c. beslag is gelegd op een aanmerkelijk deel van het vermogen van de vergunninghouder of op een of meer van zijn
      bedrijfsmiddelen die een aanmerkelijk deel van zijn vermogen vormen.

      2 Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de continuïteit van de
      vergunninghouder. Daarbij kunnen tevens eisen worden gesteld aan de solvabiliteit van de onderneming.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel3.3
  - number: '3.4'
    text: |-
      1 De raad van bestuur beoordeelt de betrouwbaarheid van de vergunninghouder, van de personen die diens beleid
      bepalen of mede bepalen, van diens uiteindelijke belanghebbenden en van diens middellijke en onmiddellijke
      vermogensverschaffers op basis van hun voornemens, handelingen en antecedenten.

      2 De raad van bestuur neemt bij de beoordeling, bedoeld in het eerste lid, in ieder geval in aanmerking:

      a. overtredingen van de bij of krachtens de [wet][ref1] en van de kansspelwetgeving van andere staten gestelde
      voorschriften;

      b. de mate waarin de vergunninghouder heeft voldaan aan zijn financiële verplichtingen uit:

      1º. bestuurlijke sancties wegens overtredingen van bij of krachtens de wet gestelde voorschriften;

      2º. de [Wet op de kansspelbelasting][ref2];

      3º. de kansspelheffing, bedoeld in [artikel 33e van de wet][ref3], en

      4º. voor zover van toepassing, de afdracht, bedoeld in [artikel 31f van de wet][ref4];

      c. de bij regeling van Onze Minister genoemde strafrechtelijke antecedenten, en

      d. toezichtantecedenten, financiële antecedenten, fiscaal bestuursrechtelijke antecedenten en overige antecedenten.


      [ref1]: https://wetten.overheid.nl/BWBR0002469
      [ref2]: https://wetten.overheid.nl/BWBR0002359
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Artikel33e
      [ref4]: https://wetten.overheid.nl/BWBR0002469#Artikel31f
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel3.4
