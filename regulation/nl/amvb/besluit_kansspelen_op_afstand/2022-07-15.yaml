        artikel: 27a
  - number: '2.1'
    text: |-
      1 De vergunning kan worden verleend voor het op afstand organiseren van:

      a. casinospelen waarbij de spelers tegen de vergunninghouder spelen;

      b. casinospelen waarbij de spelers tegen elkaar spelen;

      c. weddenschappen op gebeurtenissen tijdens een sportwedstrijd of op de uitslag van een sportwedstrijd, en

      d. weddenschappen op uitslagen van paardenrennen en harddraverijen, georganiseerd door of onder auspiciën
      van de Stichting Nederlandse Draf- en Rensport of een vergelijkbare nationale of internationale, al dan niet
      overkoepelende organisatie,

      voor zover deze naar het oordeel van de raad van bestuur op verantwoorde, betrouwbare en controleerbare wijze
      worden georganiseerd.

      2 De vergunning wordt niet verleend voor het op afstand organiseren van loterijen.

      3 Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot de kansspelen, bedoeld in het
      eerste lid, en de wijze waarop deze worden georganiseerd. Daarbij worden in ieder geval:

      a. nadere eisen gesteld waaraan de kansspelen, bedoeld in het eerste lid, en de organisatie daarvan moeten voldoen,
      en

      b. wijzen aangewezen waarop kansspelen niet mogen worden georganiseerd.

      4 Bij de regeling, bedoeld in het derde lid, kunnen nadere regels worden gesteld met betrekking tot de kansspelen,
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel2.1
  - number: '2.2'
    text: De vergunning wordt verleend met een geldigheidsduur van ten hoogste vijf jaar.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel2.2
  - number: '2.3'
    text: |-
      De vergunning kan slechts met schriftelijke toestemming van de raad van bestuur op een andere wijze dan
      door overdracht overgaan op een derde. Het bepaalde bij of krachtens [artikel 31c van de wet][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel31c
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 31c
  - number: '2.4'
    text: |-
      1 De beschikking op de aanvraag omtrent een vergunning wordt gegeven binnen zes maanden nadat de aanvraag is
      ontvangen.

      2 De raad van bestuur kan de termijn, bedoeld in het eerste lid, met ten hoogste zes maanden verlengen, indien naar
      zijn oordeel advies van of onderzoek door een derde nodig is.

      3 Indien de termijn, bedoeld in het eerste lid, wordt verlengd, stelt de raad van bestuur de aanvrager daarvan in
      kennis en geeft hij aan binnen welke termijn de beschikking op de aanvraag kan worden gegeven.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel2.4
  - number: '2.5'
    text: |-
      1 De schorsing van de vergunning eindigt op de dag na de dag waarop de beschikking omtrent de intrekking van de
      vergunning is bekendgemaakt of de dag waarop sedert de schorsing zes maanden zijn verstreken.

      2 De raad van bestuur kan de termijn, bedoeld in het eerste lid, met ten hoogste zes maanden verlengen, indien naar
      zijn oordeel advies van of onderzoek door een derde nodig is.

      3 Indien de termijn, bedoeld in het eerste lid, wordt verlengd, stelt de raad van bestuur de vergunninghouder
      daarvan in kennis.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel2.5
  - number: '3.1'
    text: |-
      1 Ontheffing als bedoeld in [artikel 31g, vijfde lid, van de wet][ref1] kan slechts worden verleend, indien
      dat naar het oordeel van de raad van bestuur noodzakelijk is in het belang van de verantwoorde, betrouwbare en
      controleerbare organisatie van kansspelen op afstand door een vergunninghouder.

      2 Onverminderd het eerste lid kan ontheffing slechts worden verleend, indien de vergunninghouder zijn statutaire
      zetel, zijn hoofdbestuur of zijn hoofdvestiging heeft in een staat, waarin op hem wettelijke voorschriften van
      toepassing zijn die naar het oordeel van de raad van bestuur gelijkwaardig zijn aan de in Nederland of een andere
      lidstaat geldende voorschriften met betrekking tot:

      a. het naleven van sanctieregelingen;

      b. het voorkomen van witwassen en van het financieren van terrorisme;

      c. het vennootschapsrecht, en

      d. de bescherming van persoonsgegevens.

      3 Onverminderd het eerste en tweede lid kan ontheffing slechts worden verleend, indien:

      a. het recht van de staat waar de vergunninghouder zijn statutaire zetel, zijn hoofdbestuur of zijn hoofdvestiging
      heeft, zich niet verzet tegen het organiseren van de vergunde kansspelen in Nederland overeenkomstig de Nederlandse
      regelgeving, en

      b. in de staat waar de vergunninghouder zijn statutaire zetel, zijn hoofdbestuur of zijn hoofdvestiging heeft,
      toezicht wordt uitgeoefend op de naleving van de voorschriften, bedoeld in het tweede lid.

      4 Onverminderd het eerste, tweede en derde lid kan ontheffing slechts worden verleend, indien de
      vergunninghouder die geen vestiging in een lidstaat heeft, de vergunde kansspelen geheel of gedeeltelijk
      organiseert vanuit een nevenvestiging in Nederland, die is ingeschreven in het handelsregister, bedoeld in
      [artikel 2 van de Handelregisterwet 2007][ref2].

      5 Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de ontheffing, bedoeld in
      [artikel 31g, vijfde lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel31g
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Artikel31g
