        bwb_id: BWBR0033412
        artikel: '9'
  - number: '4.16'
    text: |-
      1 De vergunninghouder schrijft een persoon slechts in als speler, nadat hij diens identiteit heeft geverifieerd.

      2 De verificatie, bedoeld in het eerste lid, geschiedt met een methode, die daarvoor voldoende betrouwbaar is en
      waarmee de identiteit van de speler ondubbelzinnig komt vast te staan.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.16
  - number: '4.17'
    text: |-
      De vergunninghouder beëindigt de inschrijving in ieder geval, indien de speler daarom verzoekt, of niet of niet
      langer wordt voldaan aan de voorwaarden voor inschrijving.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.17
  - number: '4.18'
    text: |-
      1 Bij iedere aanmelding van een speler identificeert de vergunninghouder die speler en raadpleegt hij het register.

      2 De vergunninghouder staat aanmelding van een speler slechts toe, nadat is vastgesteld dat die speler niet is
      ingeschreven in het register.

      3 In afwijking van de tweede lid kan de vergunninghouder de aanmelding van een speler toestaan, indien het register
      als gevolg van een technische storing van het register niet kan worden geraadpleegd. In dat geval:

      a. stelt hij de raad van bestuur onverwijld in kennis van de storing en de gevolgen daarvan;

      b. raadpleegt hij het register zo spoedig mogelijk nadat de storing is opgeheven, en

      c. beëindigt hij de aanmelding van de in het register ingeschreven en tijdens de storing aangemelde speler.

      4 De identificatie, bedoeld in het eerste lid, geschiedt met een methode, die daarvoor voldoende betrouwbaar is en
      waarmee de identiteit van de speler ondubbelzinnig komt vast te staan.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.18
  - number: '4.19'
    text: |-
      1 Tenzij uit een wettelijk voorschrift anders voortvloeit, schorst de vergunninghouder de mogelijkheid tot deelname
      aan de vergunde kansspelen in ieder geval:

      a. op verzoek van de speler;

      b. bij een redelijk vermoeden dat niet of niet langer wordt voldaan aan de voorwaarden voor inschrijving;

      c. bij een redelijk vermoeden dat de speler door onmatige deelname aan kansspelen of door kansspelverslaving
      zichzelf of zijn naasten schade kan berokkenen en de vergunninghouder ten aanzien van hem de in
      [artikel 31m, vierde lid, van de wet][ref1] bedoelde kennisgeving aan de raad van bestuur heeft gedaan.

      2 Bij de toepassing van het eerste lid, onder b en c, maakt de vergunninghouder in ieder geval gebruik van de
      analyses, bedoeld in [artikel 4.5, tweede lid, onder b][ref2], onderscheidenlijk de analyses bedoeld in artikel 15
      van het Besluit werving, reclame en verslavingspreventie kansspelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel31m
      [ref2]: https://wetten.overheid.nl/BWBR0044773#Artikel4.5
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 31m
      - id: ref2
        bwb_id: BWBR0044773
        artikel: '4.5'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '4.20'
    text: |-
      1 In gevallen als bedoeld in [artikel 4.19, eerste lid, onder b en c][ref1], onderzoekt de vergunninghouder de
      gegrondheid van het daarbedoelde vermoeden. De mogelijkheid tot deelname aan de vergunde kansspelen wordt geschorst
      voor de duur van het onderzoek.

      2 Indien de vergunninghouder de raad van bestuur overeenkomstig [artikel 31m, vierde lid, van de wet][ref2]
      in kennis stelt van een redelijk vermoeden dat de speler door onmatige deelname aan kansspelen of door
      kansspelverslaving zichzelf of zijn naasten schade kan berokkenen, wordt de mogelijkheid tot deelname geschorst
      voor de duur van het onderzoek door de raad van bestuur naar de toepassing van [artikel 33da van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0044773#Artikel4.19
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel31m
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Artikel33da
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0044773
        artikel: '4.19'
        hoofdstuk: '4'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 31m
      - id: ref3
        bwb_id: BWBR0002469
        artikel: 33da
  - number: '4.21'
    text: |-
      De schorsing van de mogelijkheid tot deelname aan de vergunde kansspelen heeft geen gevolgen voor de toegang van de
      speler tot de gegevens met betrekking tot diens speelrekening.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.21
  - number: '4.22'
    text: De vergunninghouder beëindigt de mogelijkheid tot aanmelding bij beëindiging van de inschrijving van de speler.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.22
  - number: '4.23'
    text: |-
      De vergunninghouder treft passende technische en organisatorische maatregelen ter voorkoming van doorlopende
      aanmelding en ongeautoriseerde aanmelding.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.23
  - number: '4.24'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de inschrijving, de
      aanmelding en de deelname aan de vergunde kansspelen.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.24
  - number: '4.25'
    text: |-
      1 Betalingstransacties tussen de vergunninghouder en de speler verlopen uitsluitend via de speelrekening.

      2 De vergunninghouder staat voor betalingstransacties met de speler uitsluitend het gebruik toe van
      betaalinstrumenten, die:

      a. zijn uitgegeven:

      1°. door een in een lidstaat gevestigde kredietinstelling met een vergunning als bedoeld in artikel 8 van
      [Richtlijn 2013/36](32013L0036)/EU;

      2°. door een in een lidstaat gevestigde betaaldienstverlener met een vergunning als bedoeld in artikel 11 van
      [Richtlijn (EU) 2015/2366](32015L2366), of

      3°. door een in een lidstaat gevestigde elektronisch geldinstelling als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref1] met een vergunning als bedoeld in [artikel 2:10a][ref2]
      of die voldoet aan [artikel 2:10e van die wet][ref3], en

      b. ondubbelzinnig zijn te herleiden tot de persoon van de speler.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel210a
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel210e
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.25
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 1:1
      - id: ref2
        bwb_id: BWBR0020368
        artikel: 2:10a
      - id: ref3
        bwb_id: BWBR0020368
        artikel: 2:10e
  - number: '4.26'
    text: |-
      1 De vergunninghouder houdt ten name van een speler slechts een enkele speelrekening aan. Hij houdt geen
      speelrekening aan ten name van een persoon die niet door hem als speler is ingeschreven.

      2 De vergunninghouder crediteert en debiteert de speelrekening zonder onnodige vertraging.

      3 De vergunninghouder staat een speler slechts een enkele tegenrekening toe.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.26
  - number: '4.27'
    text: |-
      1 Behoudens correcties crediteert de vergunninghouder de speelrekening van een speler uitsluitend met geldmiddelen
      die:

      a. afkomstig zijn van de tegenrekening van die speler of van een andere betaalrekening die wordt aangehouden bij
      een instelling of dienstverlener als bedoeld in [artikel 4.25, tweede lid, onder a][ref1], en die ondubbelzinnig
      tot de persoon van die speler is te herleiden;

      b. voortkomen uit speelwinst, of

      c. voortkomen uit een door hem aan die speler verstrekt gratis speeltegoed.

      2 De vergunninghouder crediteert de speelrekening van een speler niet met geldmiddelen als bedoeld in het eerste
      lid, onder a:

      a. voor zover daarmee een of meer van de door die speler met toepassing van [artikel 4.14][ref2] gestelde maxima
      wordt overschreden;

      b. indien de mogelijkheid tot deelname is geschorst.


      [ref1]: https://wetten.overheid.nl/BWBR0044773#Artikel4.25
      [ref2]: https://wetten.overheid.nl/BWBR0044773#Artikel4.14
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.27
    references:
      - id: ref1
        bwb_id: BWBR0044773
        artikel: '4.25'
        hoofdstuk: '4'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0044773
        artikel: '4.14'
        hoofdstuk: '4'
        afdeling: '3'
  - number: '4.28'
    text: |-
      1 De vergunninghouder staat geen negatief saldo op de speelrekening toe.

      2 De vergunninghouder laat een speler niet toe tot deelname aan een kansspel, indien het saldo op diens
      speelrekening daarvoor ontoereikend is.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.28
  - number: '4.29'
    text: |-
      1 De vergunninghouder debiteert de speelrekening van een speler slechts:

      a. ten gunste van de tegenrekening van de speler;

      b. ten behoeve van deelname door die speler aan de vergunde kansspelen, of

      c. ten gunste van zijn eigen betaalrekening.

      2 De vergunninghouder debiteert de speelrekening van een speler slechts ten gunste van de tegenrekening van de
      speler nadat de speelrekening met geldmiddelen afkomstig van die tegenrekening is gecrediteerd.

      3 Tenzij de betrouwbare, verantwoorde en controleerbare organisatie van de vergunde kansspelen zich daartegen
      verzet, debiteert de vergunninghouder de speelrekening ten gunste van de tegenrekening:

      a. indien de speler daarom verzoekt;

      b. voor zover het saldo op de speelrekening het door de speler in zijn spelersprofiel opgegeven maximum
      overschrijdt;

      c. indien de inschrijving van de speler overeenkomstig [artikel 4.17, onder a][ref1], op diens verzoek wordt
      beëindigd.

      4 Het derde lid is niet van toepassing, zo lang de mogelijkheid tot deelname van de speler overeenkomstig
      [artikel 4.19, eerste lid, onder b][ref2], is geschorst op grond van een redelijk vermoeden dat niet of niet langer
      wordt voldaan aan de voorwaarden voor inschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0044773#Artikel4.17
      [ref2]: https://wetten.overheid.nl/BWBR0044773#Artikel4.19
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.29
    references:
      - id: ref1
        bwb_id: BWBR0044773
        artikel: '4.17'
        hoofdstuk: '4'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0044773
        artikel: '4.19'
        hoofdstuk: '4'
        afdeling: '3'
  - number: '4.30'
    text: |-
      1 De vergunninghouder treft passende maatregelen die waarborgen dat het saldo op een speelrekening te allen tijde
      met inachtneming van de wettelijk voorschriften aan de speler kan worden uitgekeerd en dat daarvoor de gegevens,
      bedoeld in [artikel 4.32][ref1], beschikbaar zijn.

      2 De vergunninghouder die de tegoeden van een speelrekening onderbrengt op een of meer bijzondere rekeningen als
      bedoeld in [artikel 31l, derde lid, van de wet][ref2], houdt die rekeningen aan op zijn naam met vermelding van
      zijn hoedanigheid als vergunninghouder.


      [ref1]: https://wetten.overheid.nl/BWBR0044773#Artikel4.32
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel31l
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.30
    references:
      - id: ref1
        bwb_id: BWBR0044773
        artikel: '4.32'
        hoofdstuk: '4'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 31l
  - number: '4.31'
    text: |-
      1 De vergunninghouder verschaft de speler op het door een ieder toegankelijke deel van de kansspelinterface en op
      de spelersinterface toegang tot algemene informatie met betrekking tot de wijze waarop en de voorwaarden waaronder
      betalingstransacties met de speler plaatsvinden.

      2 De vergunninghouder verschaft de speler op iedere pagina of scherm van de spelersinterface toegang tot de nodige
      gegevens met betrekking tot diens speelrekening en de mutaties van de speelrekening. Deze gegevens omvatten in
      ieder geval:

      a. het huidige saldo van de speelrekening;

      b. het beginsaldo van de speelrekening bij de laatste aanmelding;

      c. de totale inzet sedert de laatste aanmelding;

      d. de totale winst en het totale verlies sedert de laatste aanmelding, en

      e. een overzicht van alle transacties op de speelrekening gedurende ten minste de laatste 90 dagen.

      3 De vergunninghouder verstrekt de gegevens, bedoeld in het eerste en tweede lid, op voor de speler passende,
      duidelijke en begrijpelijke wijze. De gegevens zijn zo volledig mogelijk.

      4 De vergunninghouder verstrekt de speler op diens verzoek een overzicht van de transacties op de speelrekening
      gedurende ten minste de laatste 12 maanden.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.31
  - number: '4.32'
    text: |-
      De vergunninghouder registreert de betalingstransacties tussen hem en de speler en de door kansspelen waaraan die
      speler heeft deelgenomen op zodanige wijze dat:

      a. het verloop van ieder spel kan worden gereconstrueerd;

      b. de tegoeden van de speler te allen tijde aan die speler kunnen worden uitgekeerd, en

      c. het toezicht op naleving van de [wet][ref1], de
      [Wet ter voorkoming van witwassen en financieren van terrorisme][ref2], de [Sanctiewet 1977][ref3] en de
      [Wet op de kansspelbelasting][ref4] doelmatig en doeltreffend kan worden uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0002469
      [ref2]: https://wetten.overheid.nl/BWBR0024282
      [ref3]: https://wetten.overheid.nl/BWBR0003296
      [ref4]: https://wetten.overheid.nl/BWBR0002359
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.32
    references:
      - id: ref1
        bwb_id: BWBR0002469
      - id: ref2
        bwb_id: BWBR0024282
      - id: ref3
        bwb_id: BWBR0003296
      - id: ref4
        bwb_id: BWBR0002359
  - number: '4.33'
    text: |-
      Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot de betalingen tussen de
      vergunninghouder en de speler. Daarbij worden in ieder geval regels gesteld met betrekking tot:

      a. de registratie van de betalingstransacties, bedoeld in [artikel 4.32][ref1], en

      b. de uitkering van prijzen in natura.


      [ref1]: https://wetten.overheid.nl/BWBR0044773#Artikel4.32
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.33
    references:
      - id: ref1
        bwb_id: BWBR0044773
        artikel: '4.32'
        hoofdstuk: '4'
        afdeling: '4'
  - number: '4.34'
    text: |-
      1 De vergunninghouder biedt op het voor een ieder toegankelijke deel van de kansspelinterface en op de
      spelersinterface toegang tot informatie met betrekking tot in ieder geval:

      a. zijn vergunning, zijn geografische adres, zijn contactgegevens en de contactgegevens van de klantendienst;

      b. zijn beleid ter voorkoming van kansspelgerelateerde criminaliteit;

      c. de door hem gehanteerde algemene voorwaarden;

      d. de door hem georganiseerde kansspelen, waaronder de spelregels, de winkansen, de wijze van kansbepaling en, voor
      zover mogelijk, het uitbetalingspercentage;

      e. de totale kosten van deelname aan het kansspel, met inbegrip van alle daarmee samenhangende vergoedingen, kosten
      en uitgaven, belastingen die via de vergunninghouder worden betaald, dan wel, voor zover die kosten niet exact
      kunnen worden aangegeven, de grondslag voor de berekening van die kosten;

      f. eventuele specifieke kosten voor het gebruik van de techniek van het kansspel op afstand, en

      g. de klachtenregeling.

      2 De vergunninghouder verstrekt de gegevens, bedoeld in het eerste lid, op voor de speler passende, begrijpelijke
      en toegankelijke wijze. De gegevens zijn zo volledig mogelijk.

      3 De vergunninghouder informeert de speler tijdig over wijzigingen van de gegevens, bedoeld in het eerste lid.

      4 De vergunninghouder biedt op het voor een ieder toegankelijke deel van de kansspelinterface en op de
      spelersinterface toegang tot de website van de kansspelautoriteit.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.34
  - number: '4.35'
    text: |-
      De vergunninghouder bedingt niet dat de tussen hem en de speler gesloten kansspelovereenkomst wordt beheerst door
      ander recht dan het Nederlandse recht, noch dat geschillen met betrekking tot die kansspelovereenkomst worden
      voorgelegd aan een andere rechter dan de Nederlandse rechter.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.35
  - number: '4.36'
    text: |-
      De vergunninghouder onderhoudt een klantendienst die elektronisch en telefonisch kosteloos bereikbaar is op de
      tijden gedurende welke aan de vergunde kansspelen kan worden deelgenomen.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.36
  - number: '4.37'
    text: |-
      1 De vergunninghouder voorziet in een transparante, eenvoudige en kosteloze procedure voor de behandeling van
      klachten van spelers.

      2 De procedure, bedoeld in het eerste lid, voorziet er in ieder geval in dat:

      a. de klager schriftelijk en gemotiveerd in kennis wordt gesteld van de bevindingen naar aanleiding van de klacht
      en van de conclusies die daaraan worden verbonden, en

      b. de klacht zo spoedig mogelijk doch uiterlijk binnen acht weken wordt afgehandeld.

      3 De vergunninghouder maakt op het voor een ieder toegankelijke deel van de kansspelinterface en op de
      spelersinterface kenbaar op welke wijze klachten over de vergunde kansspelen worden behandeld.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.37
  - number: '4.38'
    text: |-
      1 De vergunninghouder verstrekt de algemene informatie in ieder geval in de Nederlandse taal.

      2 De vergunninghouder draagt er zorg voor dat communicatie met de speler in ieder geval in de Nederlandse taal
      kan plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.38
  - number: '4.39'
    text: |-
      Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot deze afdeling. Daarbij kunnen regels
      worden gesteld met betrekking tot de door de vergunninghouder gehanteerde algemene voorwaarden.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.39
  - number: '4.40'
    text: |-
      De vergunninghouder draagt er voor zorg dat in zijn organisatie wordt ontwikkeld, toegepast en onderhouden:

      a. een kwaliteitsmanagementsysteem dat voldoet aan de bij regeling van Onze Minister gestelde vereisten;

      b. een informatiebeveiligingssysteem dat voldoet aan de bij regeling van Onze Minister gestelde vereisten, en

      c. een systeem voor het beheer van de informatietechnologie en - communicatienetwerken dat voldoet aan de bij
      regeling van Onze Minister gestelde vereisten.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.40
  - number: '4.41'
    text: |-
      1 De vergunninghouder draagt er voor zorg dat in zijn organisatie een managementsysteem voor het beheer van
      wijzigingen van het spelsysteem wordt ontwikkeld, toegepast en onderhouden.

      2 Het managementsysteem, bedoeld in het eerste lid, bevat in ieder geval passende procedures die waarborgen dat:

      a. de vergunninghouder te allen tijde beschikt over:

      1º. een volledige en actuele beschrijving van de configuratie van het spelsysteem;

      2º. een volledige en actuele beoordeling van het risiconiveau van ieder onderdeel van het spelsysteem, en

      3º. een volledige en actuele beschrijving van de procedures die worden gevolgd bij wijziging van enig onderdeel van
      het spelsysteem;

      b. wijzigingen van het spelsysteem op een beheerste, transparante en controleerbare wijze worden aangebracht;

      c. wijzigingen van het spelsysteem tijdig aan keuring door een aangewezen keuringsinstelling worden onderworpen,
      waarbij rekening wordt gehouden met het risiconiveau van het betrokken onderdeel van het spelsysteem en de aard van
      de wijziging, en

      d. een of meer ter zake deskundige functionarissen binnen de organisatie van de vergunninghouder toezien op de
      beheerste, transparante en controleerbare wijziging van het spelsysteem en de tijdige keuring daarvan door een
      aangewezen keuringsinstelling.

      3 De vergunninghouder classificeert het risiconiveau, bedoeld in het tweede lid, onder a, subonderdeel 2o,
      van ieder onderdeel van het spelsysteem aan de hand van de aard en de omvang van de effecten, die een gehele
      of gedeeltelijke uitval of disfunctioneren van dat onderdeel kan hebben op de verantwoorde, betrouwbare en
      controleerbare organisatie van de vergunde kansspelen.

      4 De vergunninghouder registreert iedere aanpassing van het spelsysteem en bewaart deze gegevens gedurende ten
      minste vijf jaar. Hij draagt er zorg voor dat hij te allen tijde verantwoording kan afleggen over de actuele status
      van het spelsysteem.

      5 De vergunninghouder stelt de raad van bestuur in kennis over de procedures bedoeld in het tweede lid. Daarbij
      meldt de vergunninghouder tevens van welke aangewezen keuringsinstelling hij diensten afneemt.

      6 Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot het wijzigingsbeheer, bedoeld in
      het eerste lid. Deze hebben in ieder geval betrekking op de beoordeling van het risiconiveau, bedoeld in het tweede
      lid, onder a, subonderdeel 2o.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.41
  - number: '4.42'
    text: |-
      1 De vergunninghouder plaatst de elektronische middelen in een lidstaat of de staat waar hij met ontheffing
      krachtens [artikel 31g, vijfde lid, van de wet][ref1] zijn statutaire zetel, zijn hoofdbestuur of zijn
      hoofdvestiging heeft.

      2 In afwijking van het eerste lid, plaatst de vergunninghouder de controledatabank, bedoeld in [artikel 5.3][ref2],
      in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel31g
      [ref2]: https://wetten.overheid.nl/BWBR0044773#Artikel5.3
