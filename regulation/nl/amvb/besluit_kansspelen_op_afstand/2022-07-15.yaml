  - number: '4.1'
    text: |-
      1 De vergunninghouder wijst een of meer vertegenwoordigers aan die in Nederland in het belang van de goede
      uitvoering van de bij of krachtens de [wet][ref1] gestelde bepalingen met betrekking tot het voorkomen van
      kansspelverslaving:

      a. in persoon beschikbaar zijn voor overleg met de raad van bestuur en andere ter zake relevante in Nederland
      werkzame organisaties, en

      b. bevoegd zijn hem buiten rechte te vertegenwoordigen.

      2 De vertegenwoordiger of vertegenwoordigers zijn deskundig op het gebied van kansspelverslaving
      en verslavingspreventie. Onverminderd [artikel 3.5][ref2] draagt de vergunninghouder er
      voor zorg dat de vertegenwoordiger of vertegenwoordigers te allen tijde volledig zijn
      geïnformeerd over zijn ter zake relevante voornemens en besluiten en over de ter zake
      relevante bevindingen en adviezen van de functionaris of functionarissen, bedoeld in de
      [artikelen 7, derde lid, van het Besluit werving, reclame en verslavingspreventie kansspelen][ref3].

      3 De vertegenwoordiger of vertegenwoordigers beheersen de Nederlandse taal of een andere voor de organisaties,
      bedoeld in het eerste lid, onder a, begrijpelijke taal in voldoende mate voor een goede uitoefening van hun
      werkzaamheden.

      4 Voor de toepassing van [artikel 4.6][ref4] wordt de vertegenwoordiger aangemerkt als een persoon op een
      sleutelpositie.

      5 De vergunninghouder maakt zijn vertegenwoordiger of vertegenwoordigers in Nederland, hun contactgegevens
      en hun volmacht bekend op zijn website. De raad van bestuur maakt deze gegevens bekend op de website van de
      kansspelautoriteit.

      6 De vergunninghouder draagt er zorg voor dat hij te allen tijde verantwoording kan afleggen over de werkzaamheden
      van zijn vertegenwoordiger of vertegenwoordigers in Nederland.

      7 Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de vertegenwoordiger in
      Nederland en diens werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0002469
      [ref2]: https://wetten.overheid.nl/BWBR0044773#Artikel3.5
      [ref3]: https://wetten.overheid.nl/BWBR0033412#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0044773#Artikel4.6
