  - number: '4.43'
    text: |-
      Bij regeling van Onze Minister kunnen nadere technische en operationele vereisten worden gesteld aan de veiligheid,
      vertrouwelijkheid, eerlijkheid, continuïteit, betrouwbaarheid, controleerbaarheid en geschiktheid van het
      spelsysteem.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.43
  - number: '4.44'
    text: |-
      1 Onze Minister kan een keuringsinstelling op aanvraag aanwijzen voor de keuring van spelsystemen van
      vergunninghouders of onderdelen daarvan, indien uit de aanvraag volgt dat die instelling is geaccrediteerd tegen
      bij regeling van Onze Minister vastgestelde normen.

      2 De aanwijzing als keuringsinstelling wordt voor onbepaalde tijd verleend.

      3 Aan de aanwijzing kunnen in het belang van de kwaliteit van de keuringen voorschriften worden verbonden.

      4 De aanwijzing als keuringsinstelling kan worden gewijzigd.

      5 De aanwijzing als keuringsinstelling kan worden ingetrokken, indien:

      a. de aangewezen keuringsinstelling niet voldoet aan de vereisten, bedoeld in het eerste lid en de
      [artikelen 4.46 tot en met 4.48][ref1];

      b. de aangewezen keuringsinstelling een aan de aanwijzing verbonden voorschrift heeft overtreden;

      c. de aangewezen keuringsinstelling haar verplichtingen, bedoeld in [artikel 4.49][ref2], niet heeft nageleefd, of

      d. de kwaliteit van de door de aangewezen keuringsinstelling uitgevoerde keuringen naar het oordeel van Onze
      Minister onvoldoende is.

      6 De aanwijzing als keuringsinstelling kan worden geschorst op grond van ernstige vermoedens dat er grond bestaat
      om de aanwijzing in te trekken.


      [ref1]: https://wetten.overheid.nl/BWBR0044773#Artikel4.46
      [ref2]: https://wetten.overheid.nl/BWBR0044773#Artikel4.49
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.44
