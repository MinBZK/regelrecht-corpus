  - number: '4.50'
    text: |-
      De vergunninghouder onderwerpt het gehele spelsysteem voor de ingebruikname daarvan aan de keuring door een
      aangewezen keuringsinstelling.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.50
  - number: '4.51'
    text: |-
      1 De vergunninghouder onderwerpt een voorgenomen wijziging van enig onderdeel van het spelsysteem voor de
      ingebruikname daarvan aan keuring door een aangewezen keuringsinstelling.

      2 Voorafgaande keuring als bedoeld in het eerste lid kan achterwege blijven, voor zover het betreft de wijziging
      van een niet-kritiek onderdeel van het spelsysteem en het spelsysteem na wijziging van dat onderdeel voldoet aan de
      daaraan gestelde vereisten. In dat geval stelt de vergunninghouder de raad van bestuur in kennis van die wijziging
      en onderwerpt hij het gewijzigde onderdeel:

      a. onverwijld aan een eigen keuring, en

      b. binnen 180 dagen aan keuring door een aangewezen keuringsinstelling.

      3 Voorafgaande keuring als bedoeld in het eerste lid kan achterwege blijven, voor zover de wijziging onverwijld
      noodzakelijk is voor de verantwoorde, betrouwbare en controleerbare organisatie van de vergunde kansspelen. In
      dat geval stelt de vergunninghouder de raad van bestuur onverwijld in kennis van die wijziging en onderwerpt hij
      het gewijzigde onderdeel zo spoedig mogelijk, maar uiterlijk binnen 30 dagen, aan keuring door een aangewezen
      keuringsinstelling

      4 Een voorgenomen wijziging is onverwijld noodzakelijk voor de verantwoorde, betrouwbare en controleerbare
      organisatie van de vergunde kansspelen, indien het achterwege laten daarvan kan leiden tot significante
      beveiligingsrisico’s of tot significante schadelijke gevolgen voor de continuïteit van het spelsysteem of voor de
      integriteit of de vertrouwelijkheid van gegevens.

      5 Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot dit artikel. Daarbij worden in
      ieder geval nadere regels gesteld met betrekking tot de keuring, bedoeld in het tweede lid, onder a.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.51
  - number: '4.52'
    text: |-
      De vergunninghouder onderwerpt ieder onderdeel van het spelsysteem aan keuring door een aangewezen
      keuringsinstelling overeenkomstig de procedures, bedoeld in [artikel 4.41, tweede lid, onder c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044773#Artikel4.41
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.52
    references:
      - id: ref1
        bwb_id: BWBR0044773
        artikel: '4.41'
        hoofdstuk: '4'
        afdeling: '6'
  - number: '4.53'
    text: |-
      1 De aangewezen keuringsinstelling keurt het spelsysteem of enig onderdeel daarvan aan de hand van:

      a. het door de raad van bestuur vastgestelde schema tot conformiteitsbeoordeling, en

      b. haar keuringsplan dat op basis van de kenmerken van het spelsysteem is opgesteld.

      2 Bij een keuring als bedoeld in het eerste lid betrekt de aangewezen keuringsinstelling zo veel mogelijk de
      resultaten van andere keuringen van het spelsysteem of van een onderdeel daarvan.

      3 De aangewezen keuringsinstelling stelt van iedere keuring een keuringsrapport op.

      4 Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot de uitvoering van de keuring.
      Daarbij worden in ieder geval nadere regels gesteld met betrekking tot het gebruik van de resultaten van andere
      keuringen als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.53
  - number: '4.54'
    text: |-
      1 Het keuringsrapport, bedoeld in [artikel 4.53, derde lid][ref1], bevat in ieder geval:

      a. een beschrijving van het keuringsplan, bedoeld in [artikel 4.53, eerste lid, onder b][ref2];

      b. een beoordeling en toepassing van de procedures, bedoeld in [artikel 4.41, tweede lid][ref3], ter beoordeling
      van het risiconiveau van de onderscheiden onderdelen van diens spelsysteem;

      c. een beschrijving van de wijze waarop de procedures, bedoeld onder b, door de vergunninghouder worden toegepast;

      d. een toereikende aanduiding van het spelsysteem of het onderdeel daarvan dat aan de keuring is onderworpen;

      e. een verantwoording van de bij de keuring gehanteerde methoden, technieken en principes;

      f. een verantwoording van de bij de keuring betrokken resultaten van eerdere keuringen als bedoeld in
      [artikel 4.53, tweede lid][ref4];

      g. de resultaten van de keuring en een toereikende onderbouwing daarvan;

      h. de classificatie van iedere geconstateerde tekortkoming in het gekeurde spelsysteem of het onderdeel daarvan
      naar het risico dat die tekortkoming vormt voor de verantwoorde, betrouwbare en controleerbare organisatie van de
      vergunde kansspelen, en

      i. overige gegevens die de raad van bestuur behoeft voor het toezicht op naleving van het bepaalde bij en krachtens
      de [wet][ref5].

      2 De raad van bestuur stelt het model van het keuringsrapport vast.


      [ref1]: https://wetten.overheid.nl/BWBR0044773#Artikel4.53
