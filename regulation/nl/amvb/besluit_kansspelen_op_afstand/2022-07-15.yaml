  - number: '3.5'
    text: |-
      De vergunninghouder draagt er zorg voor dat zijn werknemers en anderen die bij de organisatie van de vergunde
      kansspelen betrokken zijn, voor zover dat relevant is voor de uitoefening van hun taken, bekend zijn met het
      bepaalde bij en krachtens de [wet][ref1] en het door hem gevoerde beleid, en in staat zijn die voorschriften en dat
      beleid goed en volledig uit te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0002469
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0002469
  - number: '3.6'
    text: |-
      1 De vergunninghouder draagt zorg voor een stelsel van intern toezicht, uitgeoefend door een of meer
      functionarissen als bedoeld in [artikel 31h, vierde lid, van de wet][ref1], die beschikken over de nodige
      deskundigheid, kennis en bevoegdheden om hun werkzaamheden goed en volledig uit te voeren en die hun bestuur met
      raad terzijde staan.

      2 Het stelsel van intern toezicht bevat in ieder geval waarborgen voor:

      a. de scheiding in functionele of organieke zin van de functies van het bestuur en het interne toezicht, en

      b. de onafhankelijkheid van het functioneren van de functionarissen, bedoeld in het eerste lid.

      3 De vergunninghouder draagt er zorg voor dat hij te allen tijde verantwoording kan afleggen over de wijze waarop
      het interne toezicht is georganiseerd en wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel31h
