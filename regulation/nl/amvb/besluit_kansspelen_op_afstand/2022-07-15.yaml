  - number: '4.5'
    text: |-
      1 De vergunninghouder draagt er voor zorg dat in zijn organisatie een doeltreffend integriteitsbeleid wordt
      ontwikkeld, toegepast en onderhouden, gericht op het onderkennen en voorkomen van:

      a. witwassen en financiering van terrorisme;

      b. overtreding van sanctieregelingen, en

      c. fraude met en misbruik van de vergunde kansspelen.

      2 De vergunninghouder beschikt in ieder geval over:

      a. een actuele en systematische inventarisatie, analyse en evaluatie van de integriteitsrisico´s;

      b. een actuele en systematische registratie en analyse van gegevens die van belang zijn voor het onderkennen van
      integriteitsinbreuken en ongebruikelijke transacties, en

      c. passende procedures voor de behandeling en afwikkeling van mogelijke integriteitsinbreuken en ongebruikelijke
      transacties.

      3 Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot het integriteitsbeleid. Deze
      regels hebben in ieder geval betrekking op de integriteitsrisico’s en de registratie en analyse van gegevens,
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.5
  - number: '4.6'
    text: |-
      De vergunninghouder vergewist zich van de betrouwbaarheid van de leidinggevenden in zijn organisatie, van de
      personen op sleutelposities en van de personen die bij het organiseren van de vergunde kansspelen met spelers in
      aanraking komen. Hij maakt een onderbouwde beoordeling van de betrouwbaarheid van die personen en besteedt daarbij
      in ieder geval bijzondere aandacht aan wetsovertredingen, mogelijke belangenverstrengeling en andere relaties met
      derden, die het vertrouwen in de verantwoorde, betrouwbare en controleerbare organisatie van de vergunde kansspelen
      kunnen schaden.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.6
  - number: '4.7'
    text: |-
      1 Onverminderd de [artikelen 4.5][ref1] en [4.6][ref2] draagt de vergunninghouder die weddenschappen organiseert,
      er zorg voor dat in zijn organisatie een doeltreffend beleid wordt ontwikkeld, toegepast en onderhouden, dat
      gericht is op het behoud van de integriteit van de bij die weddenschappen betrokken wedstrijden.

      2 De vergunninghouder treft in ieder geval passende maatregelen gericht op samenwerking en uitwisseling van
      gegevens die in het belang zijn voor het voorkomen en onderkennen van manipulatie van wedstrijden met ter zake
      relevante organisaties die werkzaam zijn op het gebied van de integriteit van sport, waaronder in ieder geval de
      bij de wedstrijden betrokken wedstrijdorganisatoren en sportorganisaties, het Nationaal platform matchfixing, en
      een internationaal samenwerkingsverband van wedstrijdorganisatoren en kansspelaanbieders.

      3 De vergunninghouder treft voorts passende maatregelen om belangenverstrengeling en misbruik van voorkennis met
      betrekking tot wedstrijden te voorkomen. Deze maatregelen strekken in ieder geval tot het voorkomen van:

      a. misbruik van zijn financieel-economische relatie tot de betrokken sportorganisatie, sporters en de organisatoren
      van wedstrijden waarop hij weddenschappen afsluit;

      b. betrokkenheid bij de vaststelling van de noteringen van weddenschappen op een wedstrijd van personen die bij die
      wedstrijd zijn betrokken, en

      c. deelname aan een door hem georganiseerde weddenschap op een wedstrijd door personen die zijn betrokken bij die
      wedstrijd of bij de organisatie van die weddenschap.

      4 Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot het eerste tot en met het
      derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0044773#Artikel4.5
      [ref2]: https://wetten.overheid.nl/BWBR0044773#Artikel4.6
