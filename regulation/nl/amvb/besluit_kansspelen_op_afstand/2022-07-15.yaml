  - number: '4.10'
    text: De vergunninghouder schrijft uitsluitend natuurlijke personen als speler in.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.10
  - number: '4.11'
    text: |-
      1 De vergunninghouder schrijft een persoon slechts in als speler, indien hij beschikt over ten minste:

      a. diens naam, voornamen, geboortedatum, geboorteplaats en, voor zover die persoon daarover beschikt, diens
      burgerservicenummer, zoals die zijn opgenomen op het identiteitsdocument van die persoon;

      b. diens fysieke adres en contactgegevens, waaronder in ieder geval e-mail adres en telefoonnummer, en

      c. het rekeningnummer of een andere unieke aanduiding en de tenaamstelling van de tegenrekening.

      2 De vergunninghouder voert een adequate kwaliteitscontrole uit op de gegevens, bedoeld in het eerste lid.

      3 De vergunninghouder schrijft een persoon slechts in als speler, nadat is vastgesteld dat de gegevens, bedoeld
      in het eerste lid, onderling geen afwijkingen vertonen, en ten minste het opgegeven e-mail adres of telefoonnummer
      is gevalideerd.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.11
  - number: '4.12'
    text: |-
      1 De vergunninghouder schrijft een persoon slechts in na raadpleging van het register.

      2 Raadpleging van het register geschiedt aan de hand van de naam, de voornamen, de geboortedatum en
      de geboorteplaats van de betrokken persoon, alsmede, voor zover die persoon daarover beschikt, diens
      burgerservicenummer, zoals die zijn opgenomen op het identiteitsdocument van die persoon.

      3 Het resultaat van de raadpleging, bedoeld in het eerste lid, kan worden gebruikt bij de vaststelling van de
      identiteit van degene die als speler wil worden ingeschreven.

      4 De raad van bestuur verstrekt de vergunninghouder na raadpleging van het register een code die op unieke wijze
      aan de speler is verbonden. De vergunninghouder neemt deze code op in zijn administratie.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.12
  - number: '4.13'
    text: |-
      1 De vergunninghouder schrijft een persoon slechts in als speler, nadat hij heeft vastgesteld
      dat tegen diens inschrijving geen bezwaren bestaan op grond van de bij of krachtens de
      [Wet ter voorkoming van witwassen en financieren van terrorisme][ref1] en de [Sanctiewet 1977][ref2] gestelde
      regels.

      2 De vergunninghouder schrijft een persoon niet in als speler, indien hij redelijkerwijs moet vermoeden dat diens
      deelname aan de vergunde kansspelen zal worden gebruikt voor witwassen, financiering van terrorisme, overtreding
      van sanctieregelingen dan wel fraude met of misbruik van de vergunde kansspelen.


      [ref1]: https://wetten.overheid.nl/BWBR0024282
      [ref2]: https://wetten.overheid.nl/BWBR0003296
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0024282
      - id: ref2
        bwb_id: BWBR0003296
  - number: '4.14'
    text: |-
      1 De vergunninghouder schrijft een persoon slechts in als speler, nadat die persoon de grenzen van zijn speelgedrag
      heeft aangegeven.

      2 De grenzen, bedoeld in het eerste lid, hebben in ieder geval betrekking op:

      a. de maximale duur van de toegang tot de spelersinterface per dag, week of maand;

      b. de maximale stortingen op de speelrekening per dag, week of maand, en

      c. het maximale tegoed op de speelrekening.

      3 De vergunninghouder treft passende maatregelen die waarborgen dat de speler de grenzen, bedoeld in het eerste
      lid, te allen tijde kan wijzigen, met dien verstande dat:

      a. een verlaging van een of meer maxima direct in werking treedt, en

      b. een verhoging van een of meer maxima eerst na ten minste een week in werking treedt.

      4 De vergunninghouder treft passende maatregelen die waarborgen dat de maxima, bedoeld in het tweede lid, niet
      kunnen worden overschreden.
    url: https://wetten.overheid.nl/BWBR0044773/2022-07-15#Artikel4.14
  - number: '4.15'
    text: |-
      1 De vergunninghouder schrijft een persoon slechts in als speler, nadat die persoon heeft verklaard:

      a. kennis te hebben genomen van de gegevens, bedoeld in [artikel 4.34][ref1] en de [artikelen 8][ref2] en
      [9 van het Besluit werving, reclame en verslavingspreventie kansspelen][ref3];

      b. handelingsbekwaam te zijn;

      c. uitsluitend voor eigen rekening te zullen spelen;

      d. de inschrijving niet te zullen gebruiken voor witwassen of financiering van terrorisme, voor overtreding van
      sanctieregelingen, of voor fraude met of misbruik van de vergunde kansspelen, en

      e. zorgvuldig om te zullen gaan met de identificatiemiddelen voor aanmelding, alle redelijke maatregelen te nemen
      om het gebruik daarvan door derden te voorkomen, en daartoe zo nodig de nader door de vergunninghouder te stellen
      voorschriften op te volgen.

      2 De vergunninghouder schrijft een persoon niet in als speler, indien hij weet of redelijkerwijs moet vermoeden dat
      de verklaring, bedoeld in het eerste lid, onjuist is.


      [ref1]: https://wetten.overheid.nl/BWBR0044773#Artikel4.34
      [ref2]: https://wetten.overheid.nl/BWBR0033412#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0033412#Artikel9
