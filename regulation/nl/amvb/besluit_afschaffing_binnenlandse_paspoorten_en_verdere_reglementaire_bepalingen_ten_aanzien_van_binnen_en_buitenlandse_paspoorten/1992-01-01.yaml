preamble:
  text: >-
    Wij WILLEM, bij de gratie Gods, Prince van Oranje-Nassau, Souverein Vorst der Verëenigde Nederlanden, enz., enz.,
    enz.


    In aanmerking nemende de noodzakelijkheid om, in een tijdstip, dat de Nederlanden wederom, zoo als van ouds, door
    den koophandel verlevendigd en door vele vreemdelingen bezocht zullen worden, vaste bepalingen te maken omtrent het
    werk der paspoorten, en willende, bij de regeling daarvan, eensdeels in acht nemen wat de veiligheid van den staat
    en de goede orde eisschen, maar ook, aan den anderen kant, alles vermijden, wat eenigzins zweemt naar dien geest
    van kwelling en inquisitie, die de overheersching dezer laatste jaren gekenmerkt heeft;


    Hebben Wij besloten en besluiten:
  url: https://wetten.overheid.nl/BWBR0001822/1992-01-01#ArtikelAanhef
articles:
  - number: '7'
    text: >-
      Vreemdelingen, hier te lande aankomende, zullen de paspoorten, waarvan zij houders zijn, onderwerpen aan het visa
      van den secretaris van staat, en niet weder kunnen vertrekken, dan na dat op dezelfde wijze zal zijn gekonstateerd,
      werwaarts zij voornemens zijn te reizen.
    url: https://wetten.overheid.nl/BWBR0001822/1992-01-01#Artikel7
