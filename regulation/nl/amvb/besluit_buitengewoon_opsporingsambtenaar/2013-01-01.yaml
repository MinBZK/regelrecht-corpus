  - number: '2'
    text: |-
      De buitengewoon opsporingsambtenaar die beschikt over:

      a. een titel van opsporingsbevoegdheid,

      b. de bekwaamheid en betrouwbaarheid voor het uitoefenen van opsporingsbevoegdheden, en

      c. een akte van beëdiging,

      is bevoegd op het grondgebied, vermeld in die akte, de opsporingsbevoegdheden uit te oefenen ter zake
      van de feiten die in die akte zijn vermeld en daarvan ambtsedig proces-verbaal op te maken als bedoeld in
      [artikel 152 Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel152
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '152'
  - number: '3'
    text: |-
      De titel van opsporingsbevoegdheid is de rechtsgrond die de bevoegdheid tot opsporen bepaalt van
      de buitengewoon opsporingsambtenaar, bedoeld in [artikel 142, eerste lid, onder a, b of c][ref1],
      dan wel [artikel 142, derde lid, van het Wetboek van Strafvordering][ref2]. De titel, bedoeld
      in [artikel 142, eerste lid, onder a en b][ref3], en de aanvullende bevoegdheid op grond van
      [artikel 142, derde lid, van het Wetboek van Strafvordering][ref4] worden overeenkomstig dit hoofdstuk verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel142
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel142
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel142
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel142
