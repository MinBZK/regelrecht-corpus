  - number: '12'
    text: |-
      1 De werkgever dient een aanvraag tot aanwijzing van categorieën of eenheden als bedoeld in
      [artikel 142, eerste lid, onder ][ref1] in bij Onze Minister.

      2 De aanvraag bevat, naast de in [artikel 5][ref2] genoemde gegevens, de volgende gegevens:

      a. een omschrijving van de categorie of eenheid binnen de organisatie en van de functies, waarvan de
      opsporingsbevoegdheid deel moet uitmaken, en

      b. een opgave van het hoogste aantal personen dat in die functies moet kunnen worden aangesteld.

      3 Het bepaalde in [artikel 9, tweede lid][ref3], is van overeenkomstige toepassing.


