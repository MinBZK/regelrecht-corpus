  - number: '4'
    text: |-
      1 Een akte van opsporingsbevoegdheid wordt verleend, een aanwijzing wordt gedaan, dan wel een aanvullende
      opsporingsbevoegdheid wordt toegekend, indien die opsporingsbevoegdheid noodzakelijk is voor de uitoefening van de
      functie van de desbetreffende persoon of de dienst waarbij hij werkzaam is, en een beroep op de politie voor het
      uitoefenen van opsporingsbevoegdheden bezwaarlijk, niet mogelijk of niet wenselijk is.

      2 Een akte van opsporingsbevoegdheid en de aanvullende opsporingsbevoegdheid gelden voor de duur van maximaal vijf
      jaren met ingang van de dag waarop de akte van beëdiging is uitgereikt. De geldigheidsduur kan telkens met maximaal
      vijf jaren worden verlengd.

      3 De aanwijzing en de categoriaal verleende aanvullende opsporingsbevoegdheid gelden voor de duur van maximaal vijf
      jaren met ingang van de datum van inwerkingtreding van de beschikking. De geldigheidsduur kan telkens met maximaal
      vijf jaren worden verlengd.
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel4
  - number: '5'
    text: |-
      Een aanvraag tot het verlenen van een akte van opsporingsbevoegdheid, het doen van een aanwijzing, dan wel het
      toekennen van aanvullende opsporingsbevoegdheid bevat in ieder geval de volgende gegevens:

      a. een aanduiding van de feiten waarvoor opsporingsbevoegdheid wordt aangevraagd;

      b. een aanduiding van het grondgebied waarvoor de opsporingsbevoegdheid moet gelden.
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel5
  - number: '6'
    text: |-
      1 Een aanvraag tot verlenging of wijziging van een akte van opsporingsbevoegdheid, de aanwijzing en de aanvullende
      opsporingsbevoegdheid wordt uiterlijk drie maanden voor het verlopen van de geldigheidsduur ingediend.

      2 Onze Minister kan de akte van opsporingsbevoegdheid, de aanwijzing en de aanvullende opsporingsbevoegdheid
      ambtshalve wijzigen of vervangen.

      3 Indien Onze Minister bij beschikking de akte van opsporingsbevoegdheid, de aanwijzing of de aanvullende
      opsporingsbevoegdheid verlengt, wijzigt of vervangt, past hij de akten van beëdiging van de betrokken buitengewoon
      opsporingsambtenaren zo spoedig mogelijk aan. Tot het tijdstip waarop de aanpassing heeft plaatsgevonden, wordt de
      akte van beëdiging geacht te zijn gebaseerd op de nieuwe beschikking.
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel6
  - number: '7'
    text: |-
      Op elke aanvraag ingevolge dit hoofdstuk wordt zo spoedig mogelijk, in elk geval binnen drie maanden na ontvangst
      van de aanvraag, beslist.
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel7
  - number: '8'
    text: |-
      1 Een akte van opsporingsbevoegdheid, de aanwijzing en de aanvullende opsporingsbevoegdheid worden ingetrokken op
      aanvraag van de werkgever of indien de noodzaak, bedoeld in [artikel 4, eerste lid][ref1], niet meer aanwezig is.

      2 De intrekking, bedoeld in het eerste lid, geschiedt door degene die de akte van opsporingsbevoegdheid of de
      aanvullende opsporingsbevoegdheid heeft verleend, dan wel de aanwijzing heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007013#Artikel4
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007013
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '9'
    text: |-
      1 De werkgever dient een aanvraag tot het verlenen van de akte van opsporingsbevoegdheid in bij Onze Minister.

      2 Onze Minister raadpleegt in ieder geval bij de aanvraag voor een categorie of eenheid het College van procureurs-
      generaal en Onze Ministers wie het mede aangaat.

      3 De aanvraag bevat, naast de in [artikel 5][ref1] genoemde gegevens, de volgende gegevens:

      a. naam, voornamen, woonplaats alsmede geboortedatum en -plaats van de persoon, ten behoeve van wie de aanvraag tot
      buitengewoon opsporingsambtenaar wordt gedaan;

      b. een omschrijving van diens functie en standplaats.

      4 Bij de aanvraag wordt een bewijs van bekwaamheid van de desbetreffende persoon gevoegd. Indien de aanvraag
      betrekking heeft op de verlenging of wijziging van de akte van opsporingsbevoegdheid wordt een bewijs van beëdiging
      bijgevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007013#Artikel5
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007013
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '10'
    text: |-
      Onze Minister verleent de akte van opsporingsbevoegdheid, waarin staan vermeld het grondgebied en de strafbare
      feiten waarvoor de opsporingsbevoegdheid geldt.
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel10
  - number: '11'
    text: |-
      1 De hoofdofficier van justitie kan een aanvraag indienen tot het verlenen van de akte van opsporingsbevoegdheid
      aan een of meer personen, voor de duur van een onderzoek dat wordt uitgevoerd onder leiding van een officier van
      justitie die tot zijn parket behoort.

      2 Onze Minister beslist op de aanvraag en doet een afschrift van zijn beschikking toekomen aan de direct
      toezichthouder.

      3 Onze Minister kan een ontheffing als bedoeld in [artikel 16, derde lid][ref1], verlenen indien de te benoemen
      persoon over voldoende bekwaamheid beschikt.

      4 Bij het verlenen van de akte van opsporingsbevoegdheid, bedoeld in het eerste lid, kan de aanwijzing van de
      toezichthouder en de direct toezichthouder achterwege blijven. In dat geval is het gestelde in [hoofdstuk 6][ref2],
      met uitzondering van [artikel 35][ref3] niet van toepassing op de desbetreffende buitengewoon opsporingsambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0007013#Artikel16
