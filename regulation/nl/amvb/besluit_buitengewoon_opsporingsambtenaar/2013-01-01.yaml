  - number: '16'
    text: |-
      1 Een persoon beschikt over de bekwaamheid voor de uitoefening van opsporingsbevoegdheden, indien hij de daarvoor
      vastgestelde basiskennis en vaardigheden bezit. De bekwaamheid blijkt uit het met goed gevolg hebben afgelegd van
      een examen waarmee Onze Minister heeft ingestemd.

      2 Onze Minister kan ten aanzien van categorieën buitengewoon opsporingsambtenaren aanvullende bekwaamheidseisen
      stellen. Onze Minister bepaalt daarbij of het voldoen aan die eisen blijkt uit het met goed gevolg hebben afgelegd
      van een examen waarmee hij heeft ingestemd of uit het met goed gevolg hebben doorlopen van een opleidingsprogramma
      waarmee hij heeft ingestemd. Het opleidingsprogramma kan worden doorlopen na de beëdiging.

      3 Van het met goed gevolg afleggen van de in het eerste en tweede lid bedoelde examens en van het met goed gevolg
      hebben doorlopen van het in het tweede lid bedoelde programma kan ontheffing worden verleend, indien de bekwaamheid
      voor de uitoefening van opsporingsbevoegdheden op andere wijze blijkt. Bij het verlenen van een ontheffing kunnen
      aanwijzingen en voorschriften worden gegeven met het oog op het waarborgen van een adequaat niveau van bekwaamheid
      voor de uitoefening van opsporingsbevoegdheden.
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel16
  - number: '17'
    text: |-
      1 Een persoon beschikt over de betrouwbaarheid voor de uitoefening van opsporingsbevoegdheden, indien hij van
      onbesproken gedrag is.

      2 Onze Minister beslist of een persoon betrouwbaar is voor de uitoefening van de opsporingsbevoegdheden.
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel17
  - number: '18'
    text: |-
      1 Onze Minister beëdigt de persoon, bedoeld in [artikel 2][ref1], tot buitengewoon opsporingsambtenaar.

      2 De werkgever dient een aanvraag tot beëdiging van een buitengewoon opsporingsambtenaar in bij Onze Minister en
      overlegt daarbij een bewijs van de titel van opsporingsbevoegdheid en een bewijs van bekwaamheid van de te beëdigen
      persoon.

      3 De aanvraag, bedoeld in [artikel 9, eerste lid][ref2], wordt tevens geacht te zijn een aanvraag tot beëdiging.

      4 De beëdiging vindt plaats voor de opsporing van de feiten waartoe een persoon ingevolge de titel van
      opsporingsbevoegdheid bevoegd is, op het grondgebied waarvoor de opsporingsbevoegdheid geldt.

      5 Indien gebleken is dat de in het eerste lid bedoelde persoon voldoet aan de voorwaarden voor beëdiging wordt hij
      binnen 12 weken na ontvangst van de aanvraag beëdigd.


      [ref1]: https://wetten.overheid.nl/BWBR0007013#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007013#Artikel9
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel18
