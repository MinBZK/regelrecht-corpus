articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. Onze Minister: Onze Minister van Veiligheid en Justitie;

      b. titel van opsporingsbevoegdheid: de titel van opsporingsbevoegdheid, bedoeld in [artikel 3][ref1];

      c. akte van opsporingsbevoegdheid: de akte van opsporingsbevoegdheid, bedoeld in
      [artikel 142, eerste lid, onder a, van het Wetboek van Strafvordering][ref2];

      d. aanwijzing: de aanwijzing, bedoeld in
      [artikel 142, eerste lid, onder b, van het Wetboek van Strafvordering][ref3];

      e. aanvullende opsporingsbevoegdheid: de aanvullende opsporingsbevoegdheid, bedoeld in
      [artikel 142, derde lid, van het Wetboek van Strafvordering][ref4];

      f. de akte van beëdiging: de akte van beëdiging, bedoeld in [artikel 19, eerste lid][ref5];

      g. politiebevoegdheden: de bevoegdheden, bedoeld in [artikel 7, eerste en derde lid, van de Politiewet 2012][ref6];

      h. werkgever: de werkgever van de buitengewoon opsporingsambtenaar;

      i. bewijs van bekwaamheid: een bewijs van het met goed gevolg afgelegd hebben van het door Onze Minister
      goedgekeurde examen;

      j. legitimatiebewijs: een bewijs als bedoeld in [artikel 26][ref7] van dit besluit;

      k. insigne: het onderscheidingsteken, bedoeld in [artikel 26a, eerste lid][ref8].

      2 Als standplaats in de zin van dit besluit wordt aangemerkt:

      a. indien de buitengewoon opsporingsambtenaar bevoegd is zijn taak uit te oefenen in een gebied waarin meerdere
      regionale eenheden van de politie de politietaak uitvoeren, dan wel in het gehele land: de gemeente van vestiging
      van de werkgever;

      b. indien de buitengewoon opsporingsambtenaar bevoegd is zijn taak uit te oefenen in het gebied waarin één
      regionale eenheid van de politie de politietaak uitvoert:

      1°. de gemeente waar hij zijn hoofdwerkzaamheden verricht, dan wel

      2°. een gekozen gemeente uit de gemeenten, waarin hij werkzaam is.

      3 In dit besluit wordt verstaan onder het College van procureurs-generaal: het College van procureurs-generaal,
      bedoeld in [artikel 130 van de Wet op de rechterlijke organisatie][ref9].

      4 In dit besluit wordt verstaan onder:

      a. toezichthouder: de hoofdofficier van justitie, bedoeld in [artikel 36, tweede lid][ref10];

      b. direct toezichthouder: degene, die op grond van [artikel 36, derde lid][ref11], als direct toezichthouder is
      aangewezen.

      De (direct) toezichthouder is geen toezichthouder bedoeld in
      [artikel 5:11 van de Algemene wet bestuursrecht][ref12].


