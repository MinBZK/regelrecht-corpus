  - number: '19'
    text: |-
      1 Onze Minister maakt ten behoeve van de beëdiging een akte van beëdiging op. Daarbij wordt gebruik gemaakt van een
      door Onze Minister vastgesteld model.

      2 In de akte van beëdiging zijn in elk geval opgenomen de feiten tot de opsporing waarvan de desbetreffende persoon
      beëdigd is en het grondgebied waarvoor de opsporingsbevoegdheid geldt. Als grondgebied wordt bepaald het gebied
      waarop de desbetreffende persoon zijn functie uitoefent in verband waarmee hij tot buitengewoon opsporingsambtenaar
      wordt beëdigd.

      3 Indien de buitengewoon opsporingsambtenaar bevoegd is
      politiebevoegdheden uit te oefenen dan wel geweldmiddelen, als bedoeld in
      __REF000___________________________________________________________________________________________________________
      ______________, te gebruiken, wordt daarvan aantekening gemaakt op de akte.


      [ref1]: https://wetten.overheid.nl/BWBR0006589#Artikel37
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006589
        artikel: '37'
  - number: '20'
    text: |-
      1 Onze Minister neemt van de te beëdigen persoon de eed, verklaring of belofte van zuivering en een ambtseed of
      ambtsbelofte, vastgelegd in [bijlage A][ref1], af. Het proces-verbaal van de aflegging van de eden, verklaring en
      beloften wordt aan de akte van beëdiging toegevoegd en maakt vanaf dat moment daarvan deel uit.

      2 Bij de bekendmaking of de beëdiging ontvangt de buitengewoon opsporingsambtenaar, de akte van beëdiging, het
      legitimatiebewijs, de tekst van [hoofdstuk 5][ref2] en, voorzover op hem van toepassing, een afschrift van de
      [Ambtsinstructie voor de politie, de Koninklijke marechaussee en andere opsporingsambtenaren][ref3].

      3 Onze Minister zendt een afschrift van de akte van beëdiging aan de toezichthouder en de direct toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0007013
      [ref2]: https://wetten.overheid.nl/BWBR0007013#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0006589
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0007013
      - id: ref2
        bwb_id: BWBR0007013
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0006589
  - number: '21'
    text: |-
      1 Onze Minister kan van de bevoegdheid tot het afleggen van de eden, verklaringen en beloften, bedoeld in
      [artikel 20, eerste lid][ref1], mandaat verlenen aan de direct toezichthouder dan wel, indien de desbetreffende
      persoon behoort tot een dienst ressorterend onder een van Onze Ministers die het mede aangaat, aan het hoofd van
      die dienst. Onze Minister zendt in dat geval de door hem opgemaakte akte van beëdiging van te voren toe aan de
      direct toezichthouder of het hoofd van dienst.

      2 De direct toezichthouder dan wel het hoofd van dienst in wiens handen de aflegging van de eden, verklaringen en
      beloften heeft plaatsgevonden, maakt van de aflegging proces-verbaal op en voegt dat toe aan de akte van beëdiging.
      Bij de beëdiging ontvangt de buitengewoon opsporingsambtenaar de in [artikel 20, tweede lid][ref2], bedoelde
      stukken en wordt daarvan mededeling gedaan aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0007013#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0007013#Artikel20
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0007013
        artikel: '20'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0007013
        artikel: '20'
        hoofdstuk: '4'
  - number: '22'
    text: |-
      1 Bij wijziging van de titel van opsporingsbevoegdheid, de opsomming van de feiten tot welke opsporing de
      buitengewoon opsporingsambtenaar ingevolge zijn titel bevoegd is, de standplaats dan wel het grondgebied waarvoor
      de opsporing geldt, behoeven de eden, verklaringen en beloften niet opnieuw te worden afgelegd indien de akte van
      beëdiging overeenkomstig [artikel 23][ref1] is aangepast.

      2 In de gevallen, bedoeld in het eerste lid, worden de afgelegde eden, verklaringen of beloften geacht te zijn
      afgelegd voor de opsporing van de feiten op het grondgebied genoemd in de gewijzigde akte van beëdiging.


      [ref1]: https://wetten.overheid.nl/BWBR0007013#Artikel23
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007013
        artikel: '23'
        hoofdstuk: '4'
  - number: '23'
    text: |-
      1 Een aanvraag tot wijziging van de akte van beëdiging wordt ingediend bij Onze Minister. Bij deze aanvraag wordt
      de akte overgelegd.

      2 Onze Minister, past de akte van beëdiging aan indien de aanvraag betrekking heeft op een wijziging van:

      a. de titel van opsporingsbevoegdheid dan wel de opsomming van de feiten tot welke opsporing de buitengewoon
      opsporingsambtenaar ingevolge die titel bevoegd is, overeenkomstig de bij of krachtens de wet gewijzigde titel dan
      wel opsomming;

      b. de standplaats;

      c. het grondgebied waarvoor de opsporingsbevoegdheid geldt, indien hem van de noodzaak daartoe is gebleken.
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel23
  - number: '24'
    text: |-
      1 De eed vervalt zodra de opsporingsbevoegdheid is vervallen.

      2 Na het vervallen van de eed zendt de buitengewoon opsporingsambtenaar zijn akte van beëdiging en zijn
      legitimatiebewijs aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel24
  - number: '25'
    text: |-
      1 De buitengewoon opsporingsambtenaar beperkt de opsporingshandelingen waartoe hij bevoegd is, tot hetgeen nodig is
      voor een juiste vervulling van de functie in verband waarmee hij tot buitengewoon opsporingsambtenaar is beëdigd.
      Hij onthoudt zich van elk optreden waartoe hij niet bevoegd is.

      2 De buitengewoon opsporingsambtenaar gedraagt zich bij de uitoefening van zijn opsporingsbevoegdheden
      overeenkomstig de bij of krachtens de wet gegeven regels.

      3 Indien hij bevoegd is politiebevoegdheden uit te oefenen, gedraagt hij zich overeenkomstig
      [artikel 7, eerste, tweede, derde en vijfde lid, van de Politiewet 2012][ref1]
      en de op hem van toepassing zijnde bepalingen uit de
      [Ambtsinstructie voor de politie, de Koninklijke marechaussee en andere opsporingsambtenaren][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006589
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0006589
  - number: '26'
    text: |-
      1 Bij het uitoefenen van zijn taak draagt de buitengewoon opsporingsambtenaar een legitimatiebewijs bij zich,
      waarvan het model door Onze Minister is vastgesteld.

      2 Onze Minister kan personen of categorieën aanwijzen die bevoegd zijn een legitimatiebewijs te dragen dat afwijkt
      van het model, bedoeld in het eerste lid.

      3 Onverminderd [artikel 1, eerste en tweede lid, van de Algemene wet op het binnentreden][ref1] toont de
      buitengewoon opsporingsambtenaar zijn legitimatiebewijs desgevraagd aanstonds.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel1
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '1'
  - number: 26a
    text: |-
      1 Indien de buitengewoon opsporingsambtenaar een uniform of bedrijfskleding draagt, wordt dat uniform of die
      bedrijfskleding op een duidelijk zichtbare plaats voorzien van een insigne, waarvan het model door Onze Minister
      wordt vastgesteld.

      2 Het eerste lid is niet van toepassing op het uniform van een buitengewoon opsporingsambtenaar werkzaam bij de
      politie, de Koninklijke marechaussee of de Belastingdienst/Douane.
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel26a
  - number: '27'
    text: |-
      In het proces-verbaal van opsporingshandelingen of in enige andere schriftelijke verslaglegging van de uitoefening
      van bevoegdheden vermeldt de buitengewoon opsporingsambtenaar zijn standplaats en het nummer van zijn akte van
      beëdiging.
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel27
  - number: '28'
    text: |-
      De buitengewoon opsporingsambtenaar volgt bij de opsporing de door of namens het bevoegde gezag,
      bedoeld in [artikel 148 van het Wetboek van Strafvordering][ref1], gegeven aanwijzingen op, tenzij
      [artikel 80, vierde lid, van de Algemene wet inzake rijksbelastingen][ref2] of artikel 203 van de Wet inzake de
      douane van toepassing is. Hij verstrekt het bevoegd gezag de gewenste inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel148
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel80
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '148'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '80'
  - number: '29'
    text: |-
      1 De buitengewoon opsporingsambtenaar volgt bij het uitoefenen van
      de politiebevoegdheden de door of namens de meerdere, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ______________, gegeven aanwijzingen op.

      2 Hij verstrekt de meerdere, bedoeld in het eerste lid, de gewenste inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006589#Artikel37
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0006589
        artikel: '37'
  - number: '30'
    text: |-
      1 De buitengewoon opsporingsambtenaar volgt de aanwijzingen van de toezichthouder en de direct toezichthouder
      op die met het oog op een goede samenwerking met de politie zijn gegeven, tenzij bij of krachtens wet anders is
      bepaald.

      2 Hij verstrekt hen de gewenste inlichtingen en stelt hen terstond op de hoogte van een voorgenomen wijziging van
      zijn standplaats, zijn functie en zijn werkgever.
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel30
  - number: '31'
    text: |-
      1 De buitengewoon opsporingsambtenaar zorgt ervoor dat hij blijft beschikken over de bekwaamheid en de
      betrouwbaarheid voor de uitoefening van opsporingsbevoegdheden. Hij werkt mee aan de regelmatige toetsing van
      de bekwaamheid en volgt in door Onze Minister te bepalen gevallen een bijscholingsprogramma waarmee deze heeft
      ingestemd.

      2 De buitengewoon opsporingsambtenaar woont de door de direct toezichthouder aangewezen bijeenkomsten bij, waarin
      onderricht wordt gegeven in zaken welke verband houden met de uitoefening van opsporingsbevoegdheden.

      3 Indien de uitoefening van politiebevoegdheden mede het gebruik van bepaalde geweldmiddelen, als bedoeld in
      __REF000___________________________________________________________________________________________________________
      ______________, omvat, oefent de buitengewoon opsporingsambtenaar met die middelen.


      [ref1]: https://wetten.overheid.nl/BWBR0006589#Artikel37
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0006589
        artikel: '37'
  - number: '32'
    text: |-
      1 Onze Minister is belast met het toezicht op de buitengewoon opsporingsambtenaar voor wat betreft diens titel van
      opsporingsbevoegdheid en diens bekwaamheid en betrouwbaarheid voor de uitoefening van opsporingsbevoegdheden.

      2 Ten minste iedere vijf jaar dan wel ten minste op het daartoe op de akte van beëdiging vermelde tijdstip,
      stelt Onze Minister vast of de titel van opsporingsbevoegdheid en de bekwaamheid en de betrouwbaarheid voor
      de uitoefening van opsporingsbevoegdheden nog aanwezig zijn, alsmede of het dienstverband of de functie van de
      buitengewoon opsporingsambtenaar ongewijzigd is gebleven en het opsporen van strafbare feiten nog steeds onderdeel
      uitmaakt van diens functie. Onze Minister kan daartoe inlichtingen vragen aan het College van procureurs-generaal
      en andere betrokkenen.

      3 Onze Minister bepaalt of het nog aanwezig zijn van de bekwaamheid blijkt uit het met goed gevolg hebben afgelegd
      van het in [artikel 16, eerste en tweede lid][ref1], bedoelde examen of uit het met goed gevolg hebben doorlopen
      van het in artikel 16, tweede lid, of [artikel 31, eerste lid][ref2], bedoelde programma. Artikel 16, derde lid, is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007013#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0007013#Artikel31
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0007013
        artikel: '16'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0007013
        artikel: '31'
        hoofdstuk: '5'
  - number: '33'
    text: |-
      1 Ter vaststelling van de bekwaamheid voor de uitoefening van opsporingsbevoegdheden legt de werkgever binnen
      vier weken op een daartoe strekkend verzoek van Onze Minister, de bewijzen van de bekwaamheid van buitengewoon
      opsporingsambtenaar over. Onze Minister kan uitstel verlenen van de genoemde termijn.

      2 Indien binnen de gestelde termijn geen bewijzen van de bekwaamheid van de betrokkenen zijn overgelegd, wordt die
      bekwaamheid geacht niet meer aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel33
  - number: '34'
    text: |-
      1 Indien is vastgesteld dat een titel van opsporingsbevoegdheid, de betrouwbaarheid en de bekwaamheid nog steeds
      aanwezig zijn, wordt hiervan aantekening gemaakt op de akte van beëdiging. Tevens wordt een nieuwe datum voor de
      periodieke toetsing op de akte van beëdiging vermeld.

      2 De beschikking waarbij wordt vastgesteld dat een geldige titel van opsporing ontbreekt, wordt bekendgemaakt aan
      de buitengewoon opsporingsambtenaar, diens werkgever, de toezichthouder en de direct toezichthouder.
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel34
  - number: '35'
    text: |-
      1 De opsporingsbevoegdheid vervalt met ingang van de dag na de datum waarop

      a. de titel van opsporingsbevoegdheid vervalt of wijzigt, tenzij de akte van beëdiging is gewijzigd als bedoeld in
      [artikel 23, tweede lid, onder a][ref1];

      b. is vastgesteld dat de bekwaamheid of betrouwbaarheid voor de uitvoering van opsporingsbevoegdheden niet meer
      aanwezig is;

      c. is vastgesteld dat het dienstverband met de werkgever is beëindigd, dan wel dat de opsporing van strafbare
      feiten geen onderdeel meer uitmaakt van de functie van de desbetreffende persoon;

      d. door Onze Minister de opsporingsbevoegdheid van de desbetreffende persoon is beëindigd.

      2 Onze Minister kan de opsporingsbevoegdheid van een buitengewoon opsporingsambtenaar beëindigen

      a. op een daartoe strekkende aanvraag van de werkgever of van de desbetreffende buitengewoon opsporingsambtenaar;

      b. indien de buitengewoon opsporingsambtenaar misbruik maakt van zijn bevoegdheden;

      c. indien de buitengewoon opsporingsambtenaar de aanwijzingen van het bevoegd gezag, de toezichthouder en de direct
      toezichthouder niet nakomt;

      d. indien de buitengewoon opsporingsambtenaar heeft gehandeld in strijd met enige
      andere bepaling bij of krachtens dit besluit of voor zover op hem van toepassing, de
      [Ambtsinstructie voor de politie, de Koninklijke marechaussee en andere opsporingsambtenaren][ref2].

      3 Onze Minister kan de opsporingsbevoegdheid van een buitengewoon opsporingsambtenaar opschorten voor de duur van
      het onderzoek naar de in het tweede lid, onder *b* tot en met *d*, genoemde handelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007013#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0006589
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0007013
        artikel: '23'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006589
  - number: '36'
    text: |-
      1 Bij de verlening van een titel van opsporingsbevoegdheid of bij de beëdiging wijst Onze Minister een
      toezichthouder en een direct toezichthouder aan.

      2 Als toezichthouder wordt een hoofdofficier van justitie aangewezen.

      3 Als direct toezichthouder wordt aangewezen:

      a. indien het grondgebied, bedoeld in [artikel 5, onder b][ref1], is gelegen binnen het gebied waarin een regionale
      eenheid van de politie de politietaak uitvoert: de korpschef, bedoeld in [artikel 27 van de Politiewet 2012][ref2];

      b. indien het grondgebied, bedoeld in [artikel 5, onder b][ref3], groter is dan het gebied waarin een regionale
      eenheid van de politie de politietaak uitvoert: de korpschef, of het hoofd van een onder de centrale overheid
      ressorterende landelijke dienst;

      c. indien de buitengewoon opsporingsambtenaar werkzaam is bij de krijgsmacht: de commandant van de Koninklijke
      marechaussee, bedoeld in [artikel 4, derde lid, van de Politiewet 2012][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007013#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0007013#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0031788#Artikel4
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0007013
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '27'
      - id: ref3
        bwb_id: BWBR0007013
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0031788
        artikel: '4'
  - number: '38'
    text: |-
      De toezichthouder ziet er op toe dat de buitengewoon opsporingsambtenaar zijn taak bij de opsporing naar behoren
      vervult en de opsporingsbevoegdheden alsmede de politiebevoegdheden op juiste wijze uitoefent. Hij ziet eveneens
      toe op een goede samenwerking met de politie.
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel38
  - number: '39'
    text: |-
      1 De direct toezichthouder ziet toe dat de buitengewoon opsporingsambtenaar het gestelde in [hoofdstuk 5][ref1]
      naleeft. Hij oefent tevens het dagelijks toezicht uit op de juiste uitoefening van bevoegdheden en een goede
      samenwerking met de politie.

      2 De direct toezichthouder ziet toe dat de werkgever zorg draagt voor het onderricht aan de buitengewoon
      opsporingsambtenaar, tenzij in de voorschriften, bedoeld in [artikel 16, derde lid][ref2], een ander persoon
      daarvoor is aangewezen.

      3 De direct toezichthouder verstrekt de toezichthouder de gewenste inlichtingen en doet ook ongevraagd mededeling
      van hetgeen voor het uitoefenen van het toezicht van belang kan zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007013#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0007013#Artikel16
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0007013
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0007013
        artikel: '16'
        hoofdstuk: '3'
  - number: '40'
    text: |-
      1 De toezichthouder en de direct toezichthouder plegen regelmatig overleg over het functioneren van de buitengewoon
      opsporingsambtenaren. Zij kunnen daarbij de werkgever uitnodigen.

      2 Zij kunnen het bevoegd gezag, de meerdere of andere betrokkenen raadplegen over de uitoefening van bevoegdheden
      van buitengewoon opsporingsambtenaren.

      3 Zij verschaffen Onze Minister en het College van procureurs-generaal de gewenste informatie over de buitengewoon
      opsporingsambtenaren.
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel40
  - number: '41'
    text: |-
      1 De werkgever verschaft de toezichthouder en de direct toezichthouder alle door hen gewenste informatie met
      betrekking tot de in zijn dienst werkzame buitengewoon opsporingsambtenaren.

      2 Onze Minister kan bepalen dat de werkgever, aan wie hij ingevolge
      [artikel 142, eerste lid, onder b, en derde lid, van het Wetboek van Strafvordering][ref1] een categoriale
      beschikking heeft verleend, een jaarverslag dan wel op andere door hem te bepalen wijze informatie aan hem doet
      toekomen.

      3 Onze Minister kan eisen stellen aan het door de werkgever of een categorie van werkgevers te gebruiken systeem
      voor het registreren en verstrekken van de in het eerste lid bedoelde informatie en van operationele informatie die
      wordt verkregen in het kader van de taakuitvoering van de buitengewoon opsporingsambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '142'
  - number: '42'
    text: |-
      1 De werkgever zendt terstond een afschrift van een klacht over het optreden van een buitengewoon
      opsporingsambtenaar betreffende de uitoefening van diens bevoegdheden als buitengewoon opsporingsambtenaar aan de
      toezichthouder en de direct toezichthouder.

      2 Bij de afhandeling van de klacht neemt de werkgever het oordeel van de toezichthouder over de rechtmatigheid en
      behoorlijkheid van de uitoefening van die bevoegdheden in acht.
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel42
  - number: '43'
    text: |-
      1 Onze Minister houdt een registratie bij van de buitengewoon opsporingsambtenaren die door hem zijn beëdigd. Hij
      registreert de gegevens die staan vermeld op de akte van beëdiging alsmede alle wijzigingen die in de akte van
      beëdiging zijn aangebracht.

      2 Onze Minister bewaart de bescheiden die betrekking hebben op de buitengewoon opsporingsambtenaren.

      3 Onze Minister verschaft desgewenst informatie over de buitengewoon opsporingsambtenaren aan het College van
      procureurs-generaal.
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel43
  - number: '44'
    text: |-
      1 Indien voor 1 januari 2013 als toezichthouder is aangewezen de hoofdofficier van justitie van het in de
      linkerkolom bedoelde arrondissementsparket, is met ingang van 1 januari 2013 als toezichthouder aangewezen de
      hoofdofficier van justitie van het in de rechterkolom bedoelde arrondissementsparket.








