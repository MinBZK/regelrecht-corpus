  - number: '13'
    text: |-
      In de beschikking wordt het hoogste aantal personen vermeld dat op grond van de aanwijzing beëdigd kan worden als
      buitengewoon opsporingsambtenaar. Een afschrift van de beschikking wordt aan het College van procureurs-generaal
      gezonden.
    url: https://wetten.overheid.nl/BWBR0007013/2013-01-01#Artikel13
  - number: '14'
    text: |-
      1 De werkgever dient een aanvraag voor een aanvullende opsporingsbevoegdheid als bedoeld in
      [artikel 142, derde lid, van het Wetboek van Strafvordering][ref1] in bij Onze Minister.

      2 De aanvraag ten behoeve van de categorie of eenheid bevat, naast de in [artikel 5][ref2] genoemde gegevens, de
      volgende gegevens:

      a. een omschrijving van de categorie of eenheid binnen de organisatie en van de functies, waarvan de
      opsporingsbevoegdheid deel moet uitmaken, en

      b. een opgave van het hoogste aantal personen dat in die functies moet kunnen worden aangesteld.

      3 Het bepaalde in [artikel 9, tweede lid][ref3], is van overeenkomstige toepassing.


