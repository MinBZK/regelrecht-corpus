        artikel: '1'
  - number: '2'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0013047/2004-08-25#Artikel2
  - number: '3'
    text: 'Dit besluit wordt aangehaald als: Besluit zand- en lössgronden.'
