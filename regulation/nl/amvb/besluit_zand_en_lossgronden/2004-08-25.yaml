preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuurbeheer en Visserij, van 12 oktober 2001,
    no. Trcjz/2001/14 531, Directie Juridische Zaken, gedaan mede namens Onze Minister van Volkshuisvesting,
    Ruimtelijke Ordening en Milieubeheer;

    Gelet op artikel 5, vierde lid, van richtlijn nr. 91/676/EEG van de Raad van de Europese Gemeenschappen van
    12 december 1991 inzake de bescherming van water tegen verontreiniging door nitraten uit agrarische bronnen (PbEG L
    375), juncto onderdeel 2, aanhef en onder b) van Bijlage III bij die richtlijn;

    Gelet op artikel 1, eerste lid, onderdelen aa en ac, van de Meststoffenwet;

    De Raad van State gehoord (advies van 15 november 2001, no. W11.01.0533/V);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuurbeheer en Visserij, uitgebracht mede namens Onze
    Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 23 november 2001, nr. TRCJZ/2001/16 484,
    Directie Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0013047/2004-08-25#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Als de kaarten, bedoeld in [artikel 1, eerste lid, onderdelen aa en ac, van de Meststoffenwet][ref1], worden de
      kaarten vastgesteld die zijn opgenomen als bijlage bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel1
    url: https://wetten.overheid.nl/BWBR0013047/2004-08-25#Artikel1
