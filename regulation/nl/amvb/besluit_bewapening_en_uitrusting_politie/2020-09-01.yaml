  - number: '21'
    text: |-
      1 Bij ministeriële regeling worden regels gesteld omtrent het dragen, het onderhoud en het in een inbraakvrije
      ruimte bewaren van de wapens en de munitie, bedoeld in de [artikelen 2 tot en met 14][ref1] en [19][ref2], door de
      ambtenaren van politie, bedoeld in [artikel 2 van de Politiewet 2012][ref3].

      2 Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Defensie, worden regels gesteld
      omtrent het dragen, het onderhoud en het in inbraakvrije ruimte bewaren van de wapens en munitie, bedoeld in de
      [artikelen 17][ref4] en [18][ref5], door het personeel van een bijzondere bijstandseenheid.


