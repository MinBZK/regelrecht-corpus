  - number: '6'
    text: |-
      1 De bewapening van de ambtenaar van politie, bedoeld in [artikel 2, onderdeel b, van de Politiewet 2012][ref1] die
      op grond van [artikel 7, negende lid, van die wet][ref2] de bevoegdheid heeft geweld te gebruiken, bestaat, indien
      Onze Minister daarvoor toestemming heeft gegeven, tijdens de uitoefening van de dienst uit:

      a. een korte wapenstok;

      b. pepperspray;

      c. het pistool.

      2 De bewapening van de ambtenaar, bedoeld in het eerste lid, die belast is met persoonsbeveiliging, bestaat tevens
      uit de in [artikel 12][ref3] genoemde wapens.

      3 De bewapening van de ambtenaar, bedoeld in het eerste lid, die behoort tot een aanhoudings- en
      ondersteuningsteam, bestaat tevens uit de in [artikel 13, eerste lid][ref4], genoemde wapens.

      4 Het verzoek voor het bewapenen wordt gedaan door de korpschef.

      5 Aan de toestemming, bedoeld in het eerste lid, kunnen voorwaarden worden verbonden.

      6 De uitrusting van de ambtenaar, bedoeld in het eerste lid, bestaat uit:

      a. handboeien;

      b. een koppel;

      c. een veiligheidsvest;

      d. nazorgmiddelen bij het gebruik van pepperspray.

      7 De uitrusting van de ambtenaar, bedoeld in het derde lid, bestaat mede uit explosieven.

      8 Indien de korpschef dit noodzakelijk acht, kan de ambtenaar, bedoeld in het eerste lid, mede worden uitgerust met
      tie-wraps.

      9 De uitrusting van de ambtenaar, bedoeld in het eerste lid, kan mede bestaan uit:

      a. een tactisch vest;

      b. een kogelwerende helm;

      c. een gasmasker;

      d. een schild.


