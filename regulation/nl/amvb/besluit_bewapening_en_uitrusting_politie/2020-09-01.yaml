        artikel: '24'
        hoofdstuk: '2'
  - number: '24'
    text: |-
      1 De politiesurveillancehond, de AOE-hond en de politiespeurhond staan onder toezicht van:

      a. een ambtenaar van politie als bedoeld in [artikel 2, onderdeel a, van de Politiewet 2012][ref1];

      b. een ambtenaar van politie als bedoeld in [artikel 2, onderdeel b, van de Politiewet 2012][ref2], die op grond
      van [artikel 7, negende lid, van die wet][ref3] de bevoegdheid heeft geweld te gebruiken, of

      c. de ambtenaar van politie als bedoeld in [artikel 2, onderdeel c, van die wet][ref4], die is aangesteld voor de
      uitvoering van de politietaak.

      2 De ambtenaar, bedoeld in het eerste lid, beschikt over de hond uitsluitend na toestemming van de korpschef.

      3 De ambtenaar, bedoeld in het eerste lid, beschikt over een certificaat als bedoeld in het derde lid, onder a.

      4 Bij ministeriële regeling worden regels gesteld omtrent:

      a. een certificaat waaruit blijkt dat de combinatie van hond en de ambtenaar, bedoeld in het eerste lid, voldoet
      aan de bij deze regeling gestelde eisen;

      b. de keuring en de herkeuring binnen twee jaar;

      c. de instelling van commissies die zijn belast met de keuring, certificering en herkeuring;

      d. het toezicht op de kwaliteit en de objectiviteit van de keuring en herkeuring.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0031788#Artikel2
