  - number: 25a
    text: |-
      1 Bij ministeriële regeling worden regels gesteld omtrent de kleding van de directeur van de Politieacademie en
      zijn plaatsvervanger.

      2 De directeur van de Politieacademie draagt er zorg voor dat de aan de ambtenaren, bedoeld in het eerste lid,
      verstrekte kleding niet in handen van onbevoegden terecht komt.
    url: https://wetten.overheid.nl/BWBR0032136/2020-09-01#Artikel25a
  - number: '26'
    text: |-
      1 De korpschef draagt er zorg voor dat de volgende ambtenaren van politie slechts over bewapening beschikken indien
      zij voldoen aan de bij ministeriële regeling gestelde eisen van bekwaamheid:

      a. de ambtenaar van politie, bedoeld in [artikel 2, onderdelen a en c, van de Politiewet 2012][ref1], die is
      aangesteld voor de uitvoering van de politietaak;

      b. de ambtenaar van politie, bedoeld in [artikel 2, onderdeel b, van de Politiewet 2012][ref2], die op grond van
      [artikel 7, negende lid, van die wet][ref3] de bevoegdheid heeft geweld te gebruiken.

      2 Het College van procureurs-generaal draagt er zorg voor dat de ambtenaar van de rijksrecherche die is aangesteld
      voor de uitvoering van de politietaak slechts over bewapening beschikt indien hij voldoet aan de bij ministeriële
      regeling gestelde eisen van bekwaamheid.

      3 De regeling, bedoeld in het eerste en tweede lid, bevat in ieder geval regels over de jaarlijkse toetsing terzake
      van geweldsbeheersing, aanhoudings- en zelfverdedigingsvaardigheden en schietvaardigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel7
