    text: |-
      1 De bewapening van de ambtenaar en van ambtenaren van de Koninklijke marechaussee en andere delen van de
      krijgsmacht, die behoren tot een bijzondere bijstandseenheid, bestaat uit:

      a. de wapens, bedoeld in de [artikelen 2 tot en met 14][ref1];

      b. andere wapens van de categorieën I, II, III en IV en munitie van de categorieën II en III, zoals bedoeld in
      [artikel 2 van de Wet wapens en munitie][ref2].

      2 Onze Minister, in overeenstemming met Onze Minister van Defensie, bepaalt het merk en type van de wapens, bedoeld
      in het eerste lid, onderdeel b, en de daarbij behorende munitie.

      3 De uitrusting van de ambtenaar, bedoeld in het eerste lid, bestaat uit:

      a. handboeien;

      b. een koppel;

      c. een veiligheidsvest;

      d. nazorgmiddelen bij het gebruik van pepperspray.

      4 Indien de korpschef dit noodzakelijk acht, kan de ambtenaar, bedoeld in het eerste lid, mede worden uitgerust met
      tie-wraps.

      5 De uitrusting van de ambtenaar, bedoeld in het eerste lid, kan mede bestaan uit:

      a. een tactisch vest;

      b. een kogelwerende helm;

      c. een gasmasker;

      d. een schild.


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel2
    url: https://wetten.overheid.nl/BWBR0032136/2020-09-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0032136
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0008804
        artikel: '2'
  - number: '18'
    text: |-
      Onze Minister, in overeenstemming met Onze Minister van Defensie, kan toestemming geven tot beproeving van wapens
      en munitie door het personeel van een bijzondere bijstandseenheid. Aan de toestemming kunnen voorwaarden worden
      verbonden.
    url: https://wetten.overheid.nl/BWBR0032136/2020-09-01#Artikel18
  - number: '19'
    text: |-
      1 Onze Minister kan de korpschef toestemming geven tot beproeving van andere wapens en munitie, dan bedoeld in de
      [artikelen 2 tot en met 14][ref1]. Aan de toestemming kunnen voorwaarden worden verbonden.

      2 Ten behoeve van de opleiding en beroepsvaardigheidstrainingen mag de ambtenaar, naast de in dit besluit bedoelde
      bewapening en munitie, gebruik maken van trainingswapens en trainingsmunitie van een door Onze Minister aangewezen
      merk en type.


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel2
    url: https://wetten.overheid.nl/BWBR0032136/2020-09-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0032136
        artikel: '2'
        hoofdstuk: '1'
  - number: '20'
    text: |-
      1 De wapens en de munitie, bedoeld in de [artikelen 2 tot en met 19][ref1], worden door een door de korpschef
      aangewezen ondersteunende dienst van de politie aangeschaft en afgevoerd, met uitzondering van de afvoer van de
      pepperspray, de verdekte pepperspray en de munitie, voor zover deze na gebruik geen werkzame bestanddelen meer
      bevatten.

      2 Onze Minister kan ontheffing verlenen van het eerste lid. Het eerste lid is niet van toepassing op de ambtenaren
      van de krijgsmacht die behoren tot de unit interventie mariniers van de bijzondere bijstandeenheid Dienst speciale
      interventies.

      3 Onze Minister kan aanwijzingen geven over de wijze waarop de wapens en de munitie worden afgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel2
    url: https://wetten.overheid.nl/BWBR0032136/2020-09-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0032136
        artikel: '2'
        hoofdstuk: '1'
  - number: 20a
    text: |-
      Bij ministeriële regeling kan worden bepaald dat in afwijking van de [artikelen 2][ref1], [3][ref2], [4][ref3],
      [5, zesde lid][ref4], [8 tot en met 14][ref5], [17][ref6] en [24][ref7] niet bewapend zijn:

      a. een ambtenaar, aangesteld voor de uitvoering van de politietaak of een vrijwillige
      ambtenaar, aangesteld voor de uitvoering van de politietaak, die enkel een krachtens
      [artikel 2c, tweede lid, van het Besluit algemene rechtspositie politie][ref8] aangewezen politieopleiding heeft
      voltooid, in een van de door Onze Minister aangewezen functies, en

      b. een ambtenaar in opleiding of een vrijwillige ambtenaar in opleiding die na het voltooien van een
      politieopleiding als bedoeld onder a wordt geplaatst in een functie als bedoeld onder a.


