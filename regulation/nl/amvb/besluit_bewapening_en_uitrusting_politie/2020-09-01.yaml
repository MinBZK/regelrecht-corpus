  - number: '8'
    text: |-
      De bewapening van de ambtenaar en de surveillant van politie, die dienst doen met een politiesurveillancehond,
      bestaat mede uit:

      a. een elektrische wapenstok;

      b. een lange wapenstok.
    url: https://wetten.overheid.nl/BWBR0032136/2020-09-01#Artikel8
  - number: '9'
    text: |-
      De bewapening van de ambtenaar die behoort tot een bereden onderdeel, kan mede bestaan uit:

      a. een lange wapenstok;

      b. een ceremonieel ruitersabel.
    url: https://wetten.overheid.nl/BWBR0032136/2020-09-01#Artikel9
  - number: '10'
    text: |-
      De bewapening van de ambtenaar die is belast met de bewakings- en beveiligingstaak, kan mede bestaan uit het semi-
      automatisch schoudervuurwapen.
    url: https://wetten.overheid.nl/BWBR0032136/2020-09-01#Artikel10
  - number: '11'
    text: |-
      De bewapening van de ambtenaar die behoort tot de mobiele eenheid, bedoeld in
      [artikel 26 van het Besluit beheer politie][ref1], kan tijdens de uitoefening van de dienst mede bestaan uit:

      a. een lange wapenstok;

      b. de granaatwerper en CS-traangasgranaten;

      c. een waterwerper.


      [ref1]: https://wetten.overheid.nl/BWBR0036705#Artikel26
    url: https://wetten.overheid.nl/BWBR0032136/2020-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0036705
        artikel: '26'
  - number: '12'
    text: |-
      De bewapening van de ambtenaar die is belast met persoonsbeveiliging kan tijdens de uitoefening van de dienst mede
      bestaan uit:

      a. de granaatwerper en CS-traangasgranaten;

      b. rook- en lawaaigranaten;

      c. het semi-automatisch schoudervuurwapen;

      d. het automatisch schoudervuurwapen.
    url: https://wetten.overheid.nl/BWBR0032136/2020-09-01#Artikel12
  - number: '13'
    text: |-
      1 De bewapening van de ambtenaar die behoort tot een aanhoudings- en ondersteuningsteam, kan tijdens de uitoefening
      van de dienst mede bestaan uit:

      a. rook- en lawaaigranaten;

      b. een elektrische wapenstok;

      c. de granaatwerper en CS-traangasgranaten;

      d. het semi-automatisch schoudervuurwapen;

      e. het automatisch schoudervuurwapen;

      f. het repeteervuurwapen;

      g. het stroomstootwapen.

      2 De uitrusting van de ambtenaar, bedoeld in het eerste lid, bestaat mede uit explosieven.
    url: https://wetten.overheid.nl/BWBR0032136/2020-09-01#Artikel13
  - number: '14'
    text: |-
      Onverminderd de [artikelen 2 tot en met 13][ref1] kan Onze Minister aan door hem aangewezen ambtenaren andere dan
      de in dit besluit genoemde wapens en munitie toekennen.


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel2
    url: https://wetten.overheid.nl/BWBR0032136/2020-09-01#Artikel14
