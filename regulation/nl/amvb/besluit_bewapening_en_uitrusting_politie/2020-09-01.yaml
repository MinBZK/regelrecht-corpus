  - number: '27'
    text: |-
      1 De korpschef stelt de ambtenaar van politie, bedoeld in
      [artikel 2, onderdelen a tot en met c, van de Politiewet 2012][ref1], in de gelegenheid de noodzakelijke training,
      opleiding en toetsing te volgen.

      2 Het College van procureurs-generaal stelt de ambtenaar van politie, bedoeld in
      [artikel 2, onderdeel d, van de Politiewet 2012][ref2], in de gelegenheid de noodzakelijke training, opleiding en
      toetsing te volgen.


