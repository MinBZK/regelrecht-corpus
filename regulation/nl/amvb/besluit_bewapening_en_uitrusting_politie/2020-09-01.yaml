  - number: '2'
    text: |-
      1 De bewapening van de ambtenaar bestaat tijdens de uitoefening van de dienst uit:

      a. een korte wapenstok;

      b. pepperspray;

      c. het pistool.

      2 De korpschef kan bepalen dat de bewapening van de ambtenaar, bedoeld in het eerste lid, mede bestaat uit een
      lange wapenstok.

      3 De uitrusting van de ambtenaar, bedoeld in het eerste lid, bestaat uit:

      a. handboeien;

      b. een koppel;

      c. een veiligheidsvest;

      d. nazorgmiddelen bij het gebruik van pepperspray.

      4 Indien de korpschef dit noodzakelijk acht, kan de ambtenaar, bedoeld in het eerste lid, mede worden uitgerust met
      tie-wraps.

      5 De uitrusting van de ambtenaar, bedoeld in het eerste lid, kan mede bestaan uit:

      a. een tactisch vest;

      b. een kogelwerende helm;

      c. een gasmasker;

      d. een schild.
    url: https://wetten.overheid.nl/BWBR0032136/2020-09-01#Artikel2
  - number: '3'
    text: |-
      1 De bewapening van de ambtenaar van de rijksrecherche die is aangesteld voor de uitvoering van de politietaak,
      bestaat tijdens de uitoefening van de dienst uit:

      a. een korte wapenstok;

      b. pepperspray;

      c. het pistool.

      2 Het College van procureurs-generaal kan bepalen dat de bewapening van de ambtenaar, bedoeld in het eerste lid,
      mede bestaat uit een lange wapenstok.

      3 De uitrusting van de ambtenaar, bedoeld in het eerste lid, bestaat uit:

      a. handboeien;

      b. een koppel;

      c. een veiligheidsvest;

      d. nazorgmiddelen bij het gebruik van pepperspray.

      4 Indien het College van procureurs-generaal dit noodzakelijk acht, kan de ambtenaar, bedoeld in het eerste lid,
      mede worden uitgerust met tie-wraps.

      5 De uitrusting van de ambtenaar, bedoeld in het eerste lid, kan mede bestaan uit:

      a. een tactisch vest;

      b. een kogelwerende helm;

      c. een gasmasker;

      d. een schild.
    url: https://wetten.overheid.nl/BWBR0032136/2020-09-01#Artikel3
  - number: '4'
    text: |-
      1 De bewapening van de surveillant van politie bestaat tijdens de uitoefening van de dienst uit:

      a. een korte wapenstok;

      b. pepperspray.

      2 De bewapening van de ambtenaar, bedoeld in het eerste lid, bestaat mede uit het pistool:

      a. tijdens de uitoefening van de taken ten dienste van de justitie, genoemd in
      [artikel 1, eerste lid, onderdeel i, onder 3°, van de Politiewet 2012][ref1];

      b. tijdens de uitvoering van een last voor de tenuitvoerlegging van beslissingen als bedoeld in
      [artikel 6:1:5, van het Wetboek van Strafvordering][ref2];

      c. tijdens de uitoefening van zijn dienst in de beroepspraktijkvorming, bedoeld in
      [artikel 1, eerste lid, onderdeel gg, van het Besluit algemene rechtspositie politie][ref3],
      indien hij een opleiding volgt op een niveau dat overeenkomt met niveau 3 of hoger als bedoeld in
      [artikel 7.2.2, derde lid, van de Wet educatie en beroepsonderwijs][ref4] of op een niveau dat op grond van
      [artikel 7.10a][ref5] of [artikel 7.10b van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref6]
      recht geeft op het voeren van de graad Associate degree, Bachelor of Master.

      3 In andere gevallen dan bedoeld in het tweede lid, is het bewapenen van de ambtenaar, bedoeld in het eerste lid
      met het pistool alleen toegestaan indien Onze Minister daarvoor, op verzoek van de korpschef, toestemming heeft
      verleend. Aan deze toestemming kunnen voorwaarden worden verbonden.

      4 De uitrusting van de ambtenaar, bedoeld in het eerste lid, bestaat uit:

      a. handboeien;

      b. een koppel;

      c. een veiligheidsvest;

      d. nazorgmiddelen bij het gebruik van pepperspray.

      5 Indien de korpschef dit noodzakelijk acht, kan de ambtenaar, bedoeld in het eerste lid, mede worden uitgerust met
      tie-wraps.

      6 De uitrusting van de ambtenaar, bedoeld in het eerste lid, kan mede bestaan uit:

      a. een tactisch vest;

      b. een kogelwerende helm;

      c. een gasmasker;

      d. een schild.


