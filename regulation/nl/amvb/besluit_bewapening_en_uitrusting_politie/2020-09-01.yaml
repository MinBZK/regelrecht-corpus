  - number: '22'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent meetmiddelen waarvoor voor het gebruik ervan een
      verklaring van een in deze regeling aangewezen instantie vereist is, alsmede omtrent meetmiddelen die daarmee
      gelijkgesteld worden.
    url: https://wetten.overheid.nl/BWBR0032136/2020-09-01#Artikel22
  - number: '23'
    text: |-
      In dit hoofdstuk wordt verstaan onder:

      a. *politiesurveillancehond:* hond die uitsluitend wordt ingezet bij de surveillancedienst of het optreden van de
      mobiele eenheid, bedoeld in [artikel 26 van het Besluit beheer politie][ref1];

      b. *AOT-hond:* hond die uitsluitend wordt ingezet bij het optreden van een aanhoudings- en ondersteuningsteam of
      van een bijzondere bijstandseenheid;

      c. *politiespeurhond:* hond die uitsluitend wordt ingezet voor bij regeling, bedoeld in
      [artikel 24, derde lid][ref2], vastgestelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0036705#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0032136#Artikel24
    url: https://wetten.overheid.nl/BWBR0032136/2020-09-01#Artikel23
