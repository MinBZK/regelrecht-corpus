  - number: '15'
    text: |-
      1 Onze Minister bepaalt voor de wapens en de munitie, bedoeld in de [artikelen 2 tot en met 14][ref1], het merk
      en type.

      2 Onze Minister kan voor de wapens, bedoeld in de [artikelen 2 tot en met 14][ref2], het merk en type van het
      draagmiddel bepalen.

      3 Bij ministeriële regeling worden regels gesteld omtrent de technische specificaties waaraan de
      nazorgmiddelen bij het gebruik van pepperspray, bedoeld in de [artikelen 2, derde lid, onderdeel d][ref3],
      [3, derde lid, onderdeel d][ref4], [4, vierde lid, onderdeel d][ref5], [5, derde lid, onderdeel d][ref6],
      [6, zesde lid, onderdeel d][ref7], en [7, vierde lid, onderdeel d][ref8], voldoen.


