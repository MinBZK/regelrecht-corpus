articles:
  - number: '1'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

      a. *ambtenaar:* de ambtenaar van politie, bedoeld in [artikel 2, onderdeel a of c, van de Politiewet 2012][ref1],
      met een rang als bedoeld in [artikel 1, onderdelen a tot en met h, van het Besluit rangen politie][ref2];

      b. *pistool:* semi-automatisch pistool, kaliber 9 millimeter maal 19 millimeter;

      c. *semi-automatisch schoudervuurwapen:* semi-automatisch schoudervuurwapen, kaliber 9 millimeter maal
      19 millimeter;

      d. *automatisch schoudervuurwapen:* automatisch schoudervuurwapen, kaliber 9 millimeter maal 19 millimeter;

      e. *granaatwerper:* een granaatwerper, kaliber 40mm;

      f. *repeteervuurwapen:* een repeteervuurwapen, kaliber 12;

      g. *pepperspray:* spuitbus met Oleoresin Capsicum (OC);

      h. *aanhoudings- en ondersteuningsteam:* een aanhoudings- en ondersteuningsteam als bedoeld in
      [artikel 11, onder a, van het Besluit beheer politie][ref3];

      i. *aspirant:* de persoon, bedoeld in
      [artikel 1, eerste lid, onderdelen b en tt, van het Besluit algemene rechtspositie politie][ref4];

      j. *surveillant van politie:* de ambtenaar van politie, bedoeld in
      [artikel 2, onderdelen a of c, van de Politiewet 2012][ref5], aangesteld voor de uitvoering van de politietaak, met
      de rang, bedoeld in [artikel 1, eerste lid, onderdeel i, van het Besluit rangen politie][ref6].


