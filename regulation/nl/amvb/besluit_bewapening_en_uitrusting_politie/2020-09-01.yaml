  - number: '25'
    text: |-
      1 Bij ministeriële regeling worden regels gesteld omtrent de kleding van de ambtenaren van politie, bedoeld in
      [artikel 56 van het Besluit algemene rechtspositie politie][ref1].

      2 De korpschef draagt er zorg voor dat de aan de ambtenaar, bedoeld in het eerste lid, verstrekte kleding niet in
      handen van onbevoegden terecht komt.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel56
