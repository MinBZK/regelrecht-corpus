  - number: '5'
    text: |-
      1 De bewapening van de aspirant bestaat tijdens de uitoefening van de dienst in de beroepspraktijkvorming, bedoeld
      in [artikel 1, eerste lid, onderdeel gg, van het Besluit algemene rechtspositie politie][ref1] uit:

      a. een korte wapenstok;

      b. pepperspray.

      2 De bewapening van de ambtenaar, bedoeld in het eerste lid, die een opleiding
      volgt op een niveau dat overeenkomt met niveau 3 of hoger als bedoeld in
      [artikel 7.2.2, derde lid, van de Wet educatie en beroepsonderwijs][ref2] of op een niveau dat op grond van
      [artikel 7.10a][ref3] of [artikel 7.10b van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref4]
      recht geeft op het voeren van de graad Associate degree, Bachelor of Master, bestaat
      tijdens de uitoefening van de dienst in de beroepspraktijkvorming, bedoeld in
      [artikel 1, eerste lid, onderdeel gg, van het Besluit algemene rechtspositie politie][ref5] mede uit het pistool.

      3 De uitrusting van de ambtenaar, bedoeld in het eerste lid, bestaat uit:

      a. handboeien;

      b. een koppel;

      c. een veiligheidsvest;

      d. nazorgmiddelen bij het gebruik van pepperspray.

      4 Indien de korpschef dit noodzakelijk acht, kan de ambtenaar, bedoeld in het eerste lid, mede worden uitgerust met
      tie-wraps.

      5 De uitrusting van de ambtenaar, bedoeld in het eerste lid, kan mede bestaan uit:

      a. een tactisch vest;

      b. een kogelwerende helm;

      c. een gasmasker;

      d. een schild.

      6 Het eerste tot en met vijfde lid is van overeenkomstige toepassing op de ambtenaar in opleiding en de ambtenaar
      die enkel een krachtens [artikel 2c, tweede lid, van het Besluit algemene rechtspositie politie][ref6] aangewezen
      politieopleiding heeft voltooid, tijdens de uitoefening van de dienst gedurende de beroepspraktijkvorming, bedoeld
      in [artikel 1, eerste lid, onderdeel gg, van het Besluit algemene rechtspositie politie][ref7].


