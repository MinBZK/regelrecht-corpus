  - number: '28'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de goede taakuitvoering door de politie en de
      eisen die worden gesteld aan de bekwaamheid van de ambtenaren van politie en van het personeel van de bijzondere
      bijstandseenheden.
    url: https://wetten.overheid.nl/BWBR0032136/2020-09-01#Artikel28
  - number: '29'
    text: |-
      Na inwerkingtreding van dit besluit berusten de volgende besluiten onderscheidenlijk regelingen op de volgende
      artikelen van dit besluit:

      a. de krachtens [artikel 4, eerste lid, van de Regeling Dienst speciale interventies][ref1] gegeven besluiten
      inzake de goedkeuring van het merk en type wapens en munitie op [artikel 17, tweede lid][ref2];

      b. de [Regeling meetmiddelen politie][ref3] op [artikel 22][ref4];

      c. de [Regeling politiehonden][ref5] op [artikel 24, derde lid][ref6];

      d. de [Kledingregeling voor de politie][ref7] op [artikel 25, eerste lid][ref8];

      e. de [Regeling toetsing geweldsbeheersing politie][ref9] op [artikel 26, eerste en tweede lid][ref10];

      f. de [Regeling mobiele eenheid 2007][ref11] en de [Regeling infiltratieteams][ref12],
      voor zover deze berustten op [artikel 48a van de Politiewet 1993][ref13], en de
      [Regeling aanhoudings- en ondersteuningseenheid en samenwerking speciale eenheden][ref14], voor zover deze berustte
      op [artikel 60, tweede lid, van de Politiewet 1993][ref15], op [artikel 28][ref16].


