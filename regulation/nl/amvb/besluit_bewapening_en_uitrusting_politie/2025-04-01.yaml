  - number: 20a.a
    text: |-
      een ambtenaar, aangesteld voor de uitvoering van de politietaak of een vrijwillige
      ambtenaar, aangesteld voor de uitvoering van de politietaak, die enkel een krachtens
      [artikel 2c, tweede lid, van het Besluit algemene rechtspositie politie][ref1] aangewezen politieopleiding heeft
      voltooid, in een van de door Onze Minister aangewezen functies, en


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel2c
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 2c
  - number: 20a.b
    text: |-
      een ambtenaar in opleiding of een vrijwillige ambtenaar in opleiding die na het voltooien van een politieopleiding
      als bedoeld onder a wordt geplaatst in een functie als bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel20a
  - number: '21.1'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent het dragen, het onderhoud en het in een inbraakvrije
      ruimte bewaren van de wapens en de munitie, bedoeld in de [artikelen 2 tot en met 14][ref1] en [19][ref2], door de
      ambtenaren van politie, bedoeld in [artikel 2 van de Politiewet 2012][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032136#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0032136
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0032136
        artikel: '19'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0031788
        artikel: '2'
  - number: '21.2'
    text: |-
      Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Defensie, worden regels gesteld
      omtrent het dragen, het onderhoud en het in inbraakvrije ruimte bewaren van de wapens en munitie, bedoeld in de
      [artikelen 17][ref1] en [18][ref2], door het personeel van een bijzondere bijstandseenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0032136#Artikel18
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0032136
        artikel: '17'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0032136
        artikel: '18'
        hoofdstuk: '1'
  - number: '22'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent meetmiddelen waarvoor voor het gebruik ervan een
      verklaring van een in deze regeling aangewezen instantie vereist is, alsmede omtrent meetmiddelen die daarmee
      gelijkgesteld worden.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel22
  - number: '23'
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel23
  - number: 23.a
    text: |-
      *surveillancehond:* hond die uitsluitend wordt ingezet bij de surveillancedienst of het optreden van de mobiele
      eenheid, bedoeld in [artikel 26 van het Besluit beheer politie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0036705#Artikel26
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0036705
        artikel: '26'
  - number: 23.b
    text: |-
      *AOT-hond:* hond die uitsluitend wordt ingezet bij het optreden van een aanhoudings- en ondersteuningsteam of van
      een bijzondere bijstandseenheid;
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel23
  - number: 23.c
    text: |-
      *politiespeurhond:* hond die uitsluitend wordt ingezet voor bij regeling, bedoeld in [artikel 24, derde lid][ref1],
      vastgestelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel24
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0032136
        artikel: '24'
        hoofdstuk: '2'
  - number: '24.1'
    text: De surveillancehond en de AOT-hond maken onderdeel uit van de bewapening.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel24
  - number: '24.2'
    text: 'De surveillancehond, de AOT-hond en de politiespeurhond staan onder toezicht van:'
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel24
  - number: 24.2.a
    text: |-
      een ambtenaar van politie als bedoeld in [artikel 2, onderdeel a, van de Politiewet 2012][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
  - number: 24.2.b
    text: |-
      een ambtenaar van politie als bedoeld in [artikel 2, onderdeel b, van de Politiewet 2012][ref1], die op grond van
      [artikel 7, negende lid, van die wet][ref2] de bevoegdheid heeft geweld te gebruiken, of


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel7
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '7'
  - number: 24.2.c
    text: |-
      de ambtenaar van politie als bedoeld in [artikel 2, onderdeel c, van die wet][ref1], die is aangesteld voor de
      uitvoering van de politietaak.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
  - number: '24.3'
    text: De ambtenaar, bedoeld in het tweede lid, beschikt over de hond uitsluitend na toestemming van de korpschef.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel24
  - number: '24.4'
    text: De ambtenaar, bedoeld in het tweede lid, beschikt over een certificaat als bedoeld in het vijfde lid, onder a.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel24
  - number: '24.5'
    text: 'Bij ministeriële regeling worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel24
  - number: 24.5.a
    text: |-
      een certificaat waaruit blijkt dat de combinatie van hond en de ambtenaar, bedoeld in het tweede lid, voldoet aan
      de bij deze regeling gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel24
  - number: 24.5.b
    text: de keuring en de herkeuring binnen twee jaar;
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel24
  - number: 24.5.c
    text: de instelling van commissies die zijn belast met de keuring, certificering en herkeuring;
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel24
  - number: 24.5.d
    text: het toezicht op de kwaliteit en de objectiviteit van de keuring en herkeuring.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel24
  - number: '25.1'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de kleding van de ambtenaren van politie, bedoeld in
      [artikel 56 van het Besluit algemene rechtspositie politie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel56
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '56'
  - number: '25.2'
    text: |-
      De korpschef draagt er zorg voor dat de aan de ambtenaar, bedoeld in het eerste lid, verstrekte kleding niet in
      handen van onbevoegden terecht komt.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel25
  - number: 25a.1
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de kleding van de directeur van de Politieacademie en zijn
      plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel25a
  - number: 25a.2
    text: |-
      De directeur van de Politieacademie draagt er zorg voor dat de aan de ambtenaren, bedoeld in het eerste lid,
      verstrekte kleding niet in handen van onbevoegden terecht komt.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel25a
  - number: '26.1'
    text: |-
      De korpschef draagt er zorg voor dat de volgende ambtenaren van politie slechts over bewapening beschikken indien
      zij voldoen aan de bij ministeriële regeling gestelde eisen van bekwaamheid:
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel26
  - number: 26.1.a
    text: |-
      de ambtenaar van politie, bedoeld in [artikel 2, onderdelen a en c, van de Politiewet 2012][ref1], die is
      aangesteld voor de uitvoering van de politietaak;


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
  - number: 26.1.b
    text: |-
      de ambtenaar van politie, bedoeld in [artikel 2, onderdeel b, van de Politiewet 2012][ref1], die op grond van
      [artikel 7, negende lid, van die wet][ref2] de bevoegdheid heeft geweld te gebruiken.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel7
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '7'
  - number: '26.2'
    text: |-
      Het College van procureurs-generaal draagt er zorg voor dat de ambtenaar van de rijksrecherche die is aangesteld
      voor de uitvoering van de politietaak slechts over bewapening beschikt indien hij voldoet aan de bij ministeriële
      regeling gestelde eisen van bekwaamheid.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel26
  - number: '26.3'
    text: |-
      De regeling, bedoeld in het eerste en tweede lid, bevat in ieder geval regels over de jaarlijkse toetsing terzake
      van geweldsbeheersing, aanhoudings- en zelfverdedigingsvaardigheden en schietvaardigheid.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel26
  - number: '27.1'
    text: |-
      De korpschef stelt de ambtenaar van politie, bedoeld in
      [artikel 2, onderdelen a tot en met c, van de Politiewet 2012][ref1], in de gelegenheid de noodzakelijke training,
      opleiding en toetsing te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
  - number: '27.2'
    text: |-
      Het College van procureurs-generaal stelt de ambtenaar van politie, bedoeld in
      [artikel 2, onderdeel d, van de Politiewet 2012][ref1], in de gelegenheid de noodzakelijke training, opleiding en
      toetsing te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
  - number: '28'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de goede taakuitvoering door de politie en de
      eisen die worden gesteld aan de bekwaamheid van de ambtenaren van politie en van het personeel van de bijzondere
      bijstandseenheden.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel28
  - number: '29'
    text: |-
      Na inwerkingtreding van dit besluit berusten de volgende besluiten onderscheidenlijk regelingen op de volgende
      artikelen van dit besluit:
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel29
  - number: 29.a
    text: |-
      de krachtens [artikel 4, eerste lid, van de Regeling Dienst speciale interventies][ref1] gegeven besluiten inzake
      de goedkeuring van het merk en type wapens en munitie op [artikel 17, tweede lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0026381#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032136#Artikel17
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0026381
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0032136
        artikel: '17'
        hoofdstuk: '1'
  - number: 29.b
    text: |-
      de [Regeling meetmiddelen politie][ref1] op [artikel 22][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0008821
      [ref2]: https://wetten.overheid.nl/BWBR0032136#Artikel22
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0008821
      - id: ref2
        bwb_id: BWBR0032136
        artikel: '22'
        hoofdstuk: '1'
  - number: 29.c
    text: |-
      de [Regeling politiehonden][ref1] op [artikel 24, derde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0019728
      [ref2]: https://wetten.overheid.nl/BWBR0032136#Artikel24
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0019728
      - id: ref2
        bwb_id: BWBR0032136
        artikel: '24'
        hoofdstuk: '2'
  - number: 29.d
    text: |-
      de [Kledingregeling voor de politie][ref1] op [artikel 25, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006553
      [ref2]: https://wetten.overheid.nl/BWBR0032136#Artikel25
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0006553
      - id: ref2
        bwb_id: BWBR0032136
        artikel: '25'
        hoofdstuk: '3'
  - number: 29.e
    text: |-
      de [Regeling toetsing geweldsbeheersing politie][ref1] op [artikel 26, eerste en tweede lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0013200
      [ref2]: https://wetten.overheid.nl/BWBR0032136#Artikel26
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0013200
      - id: ref2
        bwb_id: BWBR0032136
        artikel: '26'
        hoofdstuk: '4'
  - number: 29.f
    text: |-
      de [Regeling mobiele eenheid 2007][ref1] en de [Regeling infiltratieteams][ref2],
      voor zover deze berustten op [artikel 48a van de Politiewet 1993][ref3], en de
      [Regeling aanhoudings- en ondersteuningseenheid en samenwerking speciale eenheden][ref4], voor zover deze berustte
      op [artikel 60, tweede lid, van de Politiewet 1993][ref5], op [artikel 28][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0021328
      [ref2]: https://wetten.overheid.nl/BWBR0011086
      [ref3]: https://wetten.overheid.nl/BWBR0006299#Artikel48a
