        artikel: '5'
        hoofdstuk: '1'
      - id: ref5
        bwb_id: BWBR0032136
        artikel: '6'
        hoofdstuk: '1'
      - id: ref6
        bwb_id: BWBR0032136
        artikel: '7'
        hoofdstuk: '1'
      - id: ref7
        bwb_id: BWBR0032136
        artikel: '17'
        hoofdstuk: '1'
  - number: '16.2'
    text: Onze Minister kan regels stellen omtrent de uitrusting, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel16
  - number: '16.3'
    text: |-
      Onverminderd het eerste lid kunnen de korpschef en het College van procureurs-generaal aan de onder hen
      ressorterende ambtenaren andere dan de in het eerste lid bedoelde uitrusting toekennen.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel16
  - number: '17.1'
    text: |-
      De bewapening van de ambtenaar en van ambtenaren van de Koninklijke marechaussee en andere delen van de
      krijgsmacht, die behoren tot een bijzondere bijstandseenheid, bestaat uit:
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel17
  - number: 17.1.a
    text: |-
      de wapens, bedoeld in de [artikelen 2 tot en met 14][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel2
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0032136
        artikel: '2'
        hoofdstuk: '1'
  - number: 17.1.b
    text: |-
      andere wapens van de categorieën I, II, III en IV en munitie van de categorieën II en III, zoals bedoeld in
      [artikel 2 van de Wet wapens en munitie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel2
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '2'
  - number: '17.2'
    text: |-
      Onze Minister, in overeenstemming met Onze Minister van Defensie, bepaalt het merk en type van de wapens, bedoeld
      in het eerste lid, onderdeel b, en de daarbij behorende munitie.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel17
  - number: '17.3'
    text: 'De uitrusting van de ambtenaar, bedoeld in het eerste lid, bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel17
  - number: 17.3.a
    text: handboeien;
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel17
  - number: 17.3.b
    text: een koppel;
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel17
  - number: 17.3.c
    text: een veiligheidsvest;
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel17
  - number: 17.3.d
    text: nazorgmiddelen bij het gebruik van pepperspray;
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel17
  - number: 17.3.e
    text: middelen om een persoon te blinddoeken.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel17
  - number: '17.4'
    text: |-
      Indien de korpschef dit noodzakelijk acht, kan de ambtenaar, bedoeld in het eerste lid, mede worden uitgerust met
      andere vrijheidsbeperkende middelen waarmee de polsen van een persoon bij elkaar kunnen worden gehouden.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel17
  - number: '17.5'
    text: 'De uitrusting van de ambtenaar, bedoeld in het eerste lid, kan mede bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel17
  - number: 17.5.a
    text: een tactisch vest;
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel17
  - number: 17.5.b
    text: een kogelwerende helm;
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel17
  - number: 17.5.c
    text: een gasmasker;
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel17
  - number: 17.5.d
    text: een schild.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel17
  - number: '18'
    text: |-
      Onze Minister, in overeenstemming met Onze Minister van Defensie, kan toestemming geven tot beproeving van wapens
      en munitie door het personeel van een bijzondere bijstandseenheid. Aan de toestemming kunnen voorwaarden worden
      verbonden.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel18
  - number: '19.1'
    text: |-
      Onze Minister kan de korpschef toestemming geven tot beproeving van andere wapens en munitie, dan bedoeld in de
      [artikelen 2 tot en met 14][ref1]. Aan de toestemming kunnen voorwaarden worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel2
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0032136
        artikel: '2'
        hoofdstuk: '1'
  - number: '19.2'
    text: |-
      Ten behoeve van de opleiding en beroepsvaardigheidstrainingen mag de ambtenaar, naast de in dit besluit bedoelde
      bewapening en munitie, gebruik maken van trainingswapens en trainingsmunitie van een door Onze Minister aangewezen
      merk en type.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel19
  - number: '20.1'
    text: |-
      De wapens en de munitie, bedoeld in de [artikelen 2 tot en met 19][ref1], worden door het Politiedienstencentrum
      aangeschaft en afgevoerd, met uitzondering van de afvoer van de pepperspray, de verdekte pepperspray en de munitie,
      voor zover deze na gebruik geen werkzame bestanddelen meer bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel2
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0032136
        artikel: '2'
        hoofdstuk: '1'
  - number: '20.2'
    text: |-
      Onze Minister kan ontheffing verlenen van het eerste lid. Het eerste lid is niet van toepassing op de ambtenaren
      van de krijgsmacht die behoren tot de unit interventie mariniers van de bijzondere bijstandeenheid Dienst speciale
      interventies.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel20
  - number: '20.3'
    text: Onze Minister kan aanwijzingen geven over de wijze waarop de wapens en de munitie worden afgevoerd.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel20
  - number: 20a
    text: |-
      Bij ministeriële regeling kan worden bepaald dat in afwijking van de [artikelen 2][ref1], [3][ref2], [4][ref3],
      [5, zesde lid][ref4], [8 tot en met 14][ref5], [17][ref6] en [24][ref7] niet bewapend zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032136#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0032136#Artikel4
