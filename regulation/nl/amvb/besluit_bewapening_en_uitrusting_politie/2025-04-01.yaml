    text: |-
      Het eerste tot en met vijfde lid is van overeenkomstige toepassing op de ambtenaar in opleiding en de ambtenaar
      die enkel een krachtens [artikel 2c, tweede lid, van het Besluit algemene rechtspositie politie][ref1] aangewezen
      politieopleiding heeft voltooid, tijdens de uitoefening van de dienst gedurende de beroepspraktijkvorming, bedoeld
      in [artikel 1, eerste lid, van het Besluit algemene rechtspositie politie][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel2c
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel1
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 2c
      - id: ref2
        bwb_id: BWBR0006516
        artikel: '1'
  - number: '6.1'
    text: |-
      De bewapening van de ambtenaar van politie, bedoeld in [artikel 2, onderdeel b, van de Politiewet 2012][ref1] die
      op grond van [artikel 7, negende lid, van die wet][ref2] de bevoegdheid heeft geweld te gebruiken, bestaat, indien
      Onze Minister daarvoor toestemming heeft gegeven, tijdens de uitoefening van de dienst uit:


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel7
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '7'
  - number: 6.1.a
    text: een korte wapenstok;
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel6
  - number: 6.1.b
    text: pepperspray;
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel6
  - number: 6.1.c
    text: het pistool.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel6
  - number: '6.2'
    text: |-
      De bewapening van de ambtenaar, bedoeld in het eerste lid, die belast is met persoonsbeveiliging, bestaat tevens
      uit de in [artikel 12][ref1] genoemde wapens.


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel12
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0032136
        artikel: '12'
        hoofdstuk: '1'
  - number: '6.3'
    text: |-
      De bewapening van de ambtenaar, bedoeld in het eerste lid, die behoort tot een aanhoudings- en ondersteuningsteam,
      bestaat tevens uit de in [artikel 13, eerste lid][ref1], genoemde wapens.


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel13
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0032136
        artikel: '13'
        hoofdstuk: '1'
  - number: '6.4'
    text: Het verzoek voor het bewapenen wordt gedaan door de korpschef.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel6
  - number: '6.5'
    text: Aan de toestemming, bedoeld in het eerste lid, kunnen voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel6
  - number: '6.6'
    text: 'De uitrusting van de ambtenaar, bedoeld in het eerste lid, bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel6
  - number: 6.6.a
    text: handboeien;
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel6
  - number: 6.6.b
    text: een koppel;
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel6
  - number: 6.6.c
    text: een veiligheidsvest;
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel6
  - number: 6.6.d
    text: nazorgmiddelen bij het gebruik van pepperspray.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel6
  - number: '6.7'
    text: |-
      Indien de korpschef dit noodzakelijk acht, kan de ambtenaar, bedoeld in het eerste lid, mede worden uitgerust met
      andere vrijheidsbeperkende middelen waarmee de polsen van een persoon bij elkaar kunnen worden gehouden.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel6
  - number: '6.8'
    text: 'De uitrusting van de ambtenaar, bedoeld in het eerste lid, kan mede bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel6
  - number: 6.8.a
    text: een tactisch vest;
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel6
  - number: 6.8.b
    text: een kogelwerende helm;
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel6
  - number: 6.8.c
    text: een gasmasker;
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel6
  - number: 6.8.d
    text: een schild.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel6
  - number: '8'
    text: |-
      De bewapening van de ambtenaar en de surveillant van politie, die dienst doen met een surveillancehond, bestaat
      mede uit:
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel8
  - number: 8.a
    text: een elektrische wapenstok;
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel8
  - number: 8.b
    text: een lange wapenstok.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel8
  - number: '9'
    text: 'De bewapening van de ambtenaar die behoort tot een bereden onderdeel, kan mede bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel9
  - number: 9.a
    text: een lange wapenstok;
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel9
  - number: 9.b
    text: een ceremonieel ruitersabel.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel9
  - number: '10'
    text: |-
      De bewapening van de ambtenaar die is belast met de bewakings- en beveiligingstaak, kan mede bestaan uit het semi-
      automatisch schoudervuurwapen.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel10
  - number: '11'
    text: |-
      De bewapening van de ambtenaar die behoort tot de mobiele eenheid, bedoeld in
      [artikel 26 van het Besluit beheer politie][ref1], kan tijdens de uitoefening van de dienst mede bestaan uit:


      [ref1]: https://wetten.overheid.nl/BWBR0036705#Artikel26
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0036705
        artikel: '26'
  - number: 11.a
    text: een lange wapenstok;
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel11
  - number: 11.b
    text: de granaatwerper en traangasgranaten;
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel11
  - number: 11.c
    text: een waterwerper.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel11
  - number: '12'
    text: |-
      De bewapening van de ambtenaar die is belast met persoonsbeveiliging kan tijdens de uitoefening van de dienst mede
      bestaan uit:
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel12
  - number: 12.a
    text: de granaatwerper en traangasgranaten;
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel12
  - number: 12.b
    text: rook- en lawaaigranaten;
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel12
  - number: 12.c
    text: het semi-automatisch schoudervuurwapen;
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel12
  - number: 12.d
    text: het automatisch schoudervuurwapen.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel12
  - number: '13.1'
    text: |-
      De bewapening van de ambtenaar die behoort tot een aanhoudings- en ondersteuningsteam, kan tijdens de uitoefening
      van de dienst mede bestaan uit:
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel13
  - number: 13.1.a
    text: rook- en lawaaigranaten;
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel13
  - number: 13.1.b
    text: een elektrische wapenstok;
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel13
  - number: 13.1.c
    text: de granaatwerper en traangasgranaten;
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel13
  - number: 13.1.d
    text: het semi-automatisch schoudervuurwapen;
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel13
  - number: 13.1.e
    text: het automatisch schoudervuurwapen;
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel13
  - number: 13.1.f
    text: het repeteervuurwapen;
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel13
  - number: 13.1.g
    text: het stroomstootwapen;
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel13
  - number: 13.1.h
    text: explosieven.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel13
  - number: '13.2'
    text: De uitrusting van de ambtenaar, bedoeld in het eerste lid, bestaat mede uit middelen om een persoon te blinddoeken.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel13
  - number: '14'
    text: |-
      Onverminderd de [artikelen 2 tot en met 13][ref1] kan Onze Minister aan door hem aangewezen ambtenaren andere dan
      de in dit besluit genoemde wapens en munitie toekennen.


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel2
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0032136
        artikel: '2'
        hoofdstuk: '1'
  - number: '15.1'
    text: |-
      Onze Minister bepaalt voor de wapens, bedoeld in de [artikelen 2 tot en met 14][ref1], en de daarbij behorende
      munitie, het merk en type.


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel2
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0032136
        artikel: '2'
        hoofdstuk: '1'
  - number: '15.2'
    text: |-
      Onze Minister kan voor de wapens, bedoeld in de [artikelen 2 tot en met 14][ref1], het merk en type van het
      draagmiddel bepalen.


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel2
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0032136
        artikel: '2'
        hoofdstuk: '1'
  - number: '15.3'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de technische specificaties waaraan de
      nazorgmiddelen bij het gebruik van pepperspray, bedoeld in de [artikelen 2, derde lid, onderdeel d][ref1],
      [3, derde lid, onderdeel d][ref2], [4, vierde lid, onderdeel d][ref3], [5, derde lid, onderdeel d][ref4],
      [6, zesde lid, onderdeel d][ref5], en [7, vierde lid, onderdeel d][ref6], voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032136#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0032136#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0032136#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0032136#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0032136#Artikel7
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0032136
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0032136
        artikel: '3'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0032136
        artikel: '4'
        hoofdstuk: '1'
      - id: ref4
        bwb_id: BWBR0032136
        artikel: '5'
        hoofdstuk: '1'
      - id: ref5
        bwb_id: BWBR0032136
        artikel: '6'
        hoofdstuk: '1'
      - id: ref6
        bwb_id: BWBR0032136
        artikel: '7'
        hoofdstuk: '1'
  - number: '16.1'
    text: |-
      Onze Minister kan het merk en type van de uitrusting, bedoeld in de
      [artikelen 2, derde, vierde en vijfde lid][ref1], [3, derde, vierde en vijfde lid][ref2],
      [4, vierde, vijfde en zesde lid][ref3], [5, derde, vierde en vijfde lid][ref4],
      [6, zesde, zevende en achtste lid][ref5], [7, vierde, vijfde en zesde lid][ref6], en
      [17, derde, vierde en vijfde lid][ref7], aanwijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032136#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0032136#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0032136#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0032136#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0032136#Artikel7
      [ref7]: https://wetten.overheid.nl/BWBR0032136#Artikel17
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0032136
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0032136
        artikel: '3'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0032136
        artikel: '4'
        hoofdstuk: '1'
      - id: ref4
