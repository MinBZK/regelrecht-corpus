  - number: '30'
    text: Dit besluit treedt in werking met ingang van 1 januari 2013.
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel30
  - number: '31'
    text: 'Dit besluit wordt aangehaald als: Besluit bewapening en uitrusting politie.'
    url: https://wetten.overheid.nl/BWBR0032136/2025-04-01#Artikel31
