    text: |-
      Dit besluit berust op de [artikelen 21][ref1], [22][ref2], [59, zesde lid][ref3], en
      [81, vijfde lid, van de Politiewet 2012][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel22
