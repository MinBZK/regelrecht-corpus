      is aangesteld voor de uitvoering van de politietaak, bestaat tijdens de uitoefening van de dienst uit:


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
  - number: 7.1.a
    text: een korte wapenstok;
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel7
  - number: 7.1.b
    text: pepperspray.
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel7
  - number: '7.2'
    text: |-
      Het bewapenen van de ambtenaar van politie, bedoeld in het eerste lid, met het pistool is toegestaan indien Onze
      Minister daarvoor toestemming heeft verleend. Aan de toestemming kunnen voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel7
  - number: '7.3'
    text: Het verzoek voor het bewapenen met het pistool wordt gedaan door de korpschef.
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel7
  - number: '7.4'
    text: 'De uitrusting van de ambtenaar, bedoeld in het eerste lid, bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel7
  - number: 7.4.a
    text: handboeien;
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel7
  - number: 7.4.b
    text: een koppel;
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel7
  - number: 7.4.c
    text: een veiligheidsvest;
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel7
  - number: 7.4.d
    text: nazorgmiddelen bij het gebruik van pepperspray.
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel7
  - number: '7.5'
    text: |-
      Indien de korpschef dit noodzakelijk acht, kan de ambtenaar, bedoeld in het eerste lid, mede worden uitgerust met
      tie-wraps.
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel7
  - number: '7.6'
    text: 'De uitrusting van de ambtenaar, bedoeld in het eerste lid, kan mede bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel7
  - number: 7.6.a
    text: een tactisch vest;
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel7
  - number: 7.6.b
    text: een kogelwerende helm;
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel7
  - number: 7.6.c
    text: een gasmasker;
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel7
  - number: 7.6.d
    text: een schild.
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel7
  - number: '8'
    text: |-
      De bewapening van de ambtenaar, met inbegrip van de surveillant van politie, die dienst doet met een
      politiesurveillancehond, bestaat mede uit:
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel8
  - number: 8.a
    text: een elektrische wapenstok;
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel8
  - number: 8.b
    text: een lange wapenstok.
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel8
  - number: '9'
    text: 'De bewapening van de ambtenaar die behoort tot een bereden onderdeel, kan mede bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel9
  - number: 9.a
    text: een lange wapenstok;
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel9
  - number: 9.b
    text: een ceremonieel ruitersabel.
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel9
  - number: '10'
    text: |-
      De bewapening van de ambtenaar die is belast met de bewakings- en beveiligingstaak, kan mede bestaan uit het semi-
      automatisch schoudervuurwapen.
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel10
  - number: '11'
    text: |-
      De bewapening van de ambtenaar die behoort tot de mobiele eenheid, bedoeld in
      [artikel 26 van het Besluit beheer politie][ref1], kan tijdens de uitoefening van de dienst mede bestaan uit:


      [ref1]: https://wetten.overheid.nl/BWBR0036705#Artikel26
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0036705
        artikel: '26'
  - number: 11.a
    text: een lange wapenstok;
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel11
  - number: 11.b
    text: de granaatwerper en CS-traangasgranaten;
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel11
  - number: 11.c
    text: een waterwerper.
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel11
  - number: '12'
    text: |-
      De bewapening van de ambtenaar die is belast met persoonsbeveiliging kan tijdens de uitoefening van de dienst mede
      bestaan uit:
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel12
  - number: 12.a
    text: de granaatwerper en CS-traangasgranaten;
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel12
  - number: 12.b
    text: rook- en lawaaigranaten;
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel12
  - number: 12.c
    text: het semi-automatisch schoudervuurwapen;
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel12
  - number: 12.d
    text: het automatisch schoudervuurwapen.
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel12
  - number: '13.1'
    text: |-
      De bewapening van de ambtenaar die behoort tot een aanhoudings- en ondersteuningsteam, kan tijdens de uitoefening
      van de dienst mede bestaan uit:
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel13
  - number: 13.1.a
    text: rook- en lawaaigranaten;
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel13
  - number: 13.1.b
    text: een elektrische wapenstok;
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel13
  - number: 13.1.c
    text: de granaatwerper en CS-traangasgranaten;
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel13
  - number: 13.1.d
    text: het semi-automatisch schoudervuurwapen;
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel13
  - number: 13.1.e
    text: het automatisch schoudervuurwapen;
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel13
  - number: 13.1.f
    text: het repeteervuurwapen;
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel13
  - number: 13.1.g
    text: het stroomstootwapen.
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel13
  - number: '13.2'
    text: De uitrusting van de ambtenaar, bedoeld in het eerste lid, bestaat mede uit explosieven.
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel13
  - number: '14'
    text: |-
      Onverminderd de [artikelen 2 tot en met 13][ref1] kan Onze Minister aan door hem aangewezen ambtenaren andere dan
      de in dit besluit genoemde wapens en munitie toekennen.


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel2
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0032136
        artikel: '2'
        hoofdstuk: '1'
  - number: '15.1'
    text: |-
      Onze Minister bepaalt voor de wapens en de munitie, bedoeld in de [artikelen 2 tot en met 14][ref1], het merk en
      type.


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel2
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0032136
        artikel: '2'
        hoofdstuk: '1'
  - number: '15.2'
    text: |-
      Onze Minister kan voor de wapens, bedoeld in de [artikelen 2 tot en met 14][ref1], het merk en type van het
      draagmiddel bepalen.


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel2
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0032136
        artikel: '2'
        hoofdstuk: '1'
  - number: '15.3'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de technische specificaties waaraan de
      nazorgmiddelen bij het gebruik van pepperspray, bedoeld in de [artikelen 2, derde lid, onderdeel d][ref1],
      [3, derde lid, onderdeel d][ref2], [4, vierde lid, onderdeel d][ref3], [5, derde lid, onderdeel d][ref4],
      [6, zesde lid, onderdeel d][ref5], en [7, vierde lid, onderdeel d][ref6], voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032136#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0032136#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0032136#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0032136#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0032136#Artikel7
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0032136
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0032136
        artikel: '3'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0032136
        artikel: '4'
        hoofdstuk: '1'
      - id: ref4
        bwb_id: BWBR0032136
        artikel: '5'
        hoofdstuk: '1'
      - id: ref5
        bwb_id: BWBR0032136
        artikel: '6'
        hoofdstuk: '1'
      - id: ref6
        bwb_id: BWBR0032136
        artikel: '7'
        hoofdstuk: '1'
  - number: '16.1'
    text: |-
      Onze Minister wijst het merk en type van de uitrusting, bedoeld in de
      [artikelen 2, derde, vierde en vijfde lid][ref1], [3, derde, vierde en vijfde lid][ref2],
      [4, vierde, vijfde en zesde lid][ref3], [5, derde, vierde en vijfde lid][ref4],
      [6, zesde, zevende, achtste en negende lid][ref5], [7, vierde, vijfde en zesde lid][ref6], en
      [17, derde, vierde en vijfde lid][ref7], aan.


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032136#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0032136#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0032136#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0032136#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0032136#Artikel7
      [ref7]: https://wetten.overheid.nl/BWBR0032136#Artikel17
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0032136
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0032136
        artikel: '3'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0032136
        artikel: '4'
        hoofdstuk: '1'
      - id: ref4
        bwb_id: BWBR0032136
        artikel: '5'
        hoofdstuk: '1'
      - id: ref5
        bwb_id: BWBR0032136
        artikel: '6'
        hoofdstuk: '1'
      - id: ref6
        bwb_id: BWBR0032136
        artikel: '7'
        hoofdstuk: '1'
      - id: ref7
        bwb_id: BWBR0032136
        artikel: '17'
        hoofdstuk: '1'
  - number: '16.2'
    text: |-
      Onverminderd het eerste lid kunnen de korpschef en het College van procureurs-generaal aan de onder hen
      ressorterende ambtenaren andere dan de in het eerste lid bedoelde uitrusting toekennen.
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel16
  - number: '17.1'
    text: |-
      De bewapening van de ambtenaar en van ambtenaren van de Koninklijke marechaussee en andere delen van de
      krijgsmacht, die behoren tot een bijzondere bijstandseenheid, bestaat uit:
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel17
  - number: 17.1.a
    text: |-
      de wapens, bedoeld in de [artikelen 2 tot en met 14][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel2
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0032136
        artikel: '2'
        hoofdstuk: '1'
  - number: 17.1.b
    text: |-
      andere wapens van de categorieën I, II, III en IV en munitie van de categorieën II en III, zoals bedoeld in
      [artikel 2 van de Wet wapens en munitie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel2
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '2'
  - number: '17.2'
    text: |-
      Onze Minister, in overeenstemming met Onze Minister van Defensie, bepaalt het merk en type van de wapens, bedoeld
      in het eerste lid, onderdeel b, en de daarbij behorende munitie.
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel17
  - number: '17.3'
    text: 'De uitrusting van de ambtenaar, bedoeld in het eerste lid, bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel17
  - number: 17.3.a
    text: handboeien;
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel17
  - number: 17.3.b
    text: een koppel;
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel17
  - number: 17.3.c
    text: een veiligheidsvest;
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel17
  - number: 17.3.d
    text: nazorgmiddelen bij het gebruik van pepperspray.
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel17
  - number: '17.4'
    text: |-
      Indien de korpschef dit noodzakelijk acht, kan de ambtenaar, bedoeld in het eerste lid, mede worden uitgerust met
      tie-wraps.
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel17
  - number: '17.5'
    text: 'De uitrusting van de ambtenaar, bedoeld in het eerste lid, kan mede bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel17
  - number: 17.5.a
    text: een tactisch vest;
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel17
  - number: 17.5.b
    text: een kogelwerende helm;
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel17
  - number: 17.5.c
    text: een gasmasker;
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel17
  - number: 17.5.d
    text: een schild.
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel17
  - number: '18'
    text: |-
      Onze Minister, in overeenstemming met Onze Minister van Defensie, kan toestemming geven tot beproeving van wapens
      en munitie door het personeel van een bijzondere bijstandseenheid. Aan de toestemming kunnen voorwaarden worden
      verbonden.
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel18
  - number: '19.1'
    text: |-
      Onze Minister kan de korpschef toestemming geven tot beproeving van andere wapens en munitie, dan bedoeld in de
      [artikelen 2 tot en met 14][ref1]. Aan de toestemming kunnen voorwaarden worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel2
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0032136
        artikel: '2'
        hoofdstuk: '1'
  - number: '19.2'
    text: |-
      Ten behoeve van de opleiding en beroepsvaardigheidstrainingen mag de ambtenaar, naast de in dit besluit bedoelde
      bewapening en munitie, gebruik maken van trainingswapens en trainingsmunitie van een door Onze Minister aangewezen
      merk en type.
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel19
  - number: '20.1'
    text: |-
      De wapens en de munitie, bedoeld in de [artikelen 2 tot en met 19][ref1], worden door een door de korpschef
      aangewezen ondersteunende dienst van de politie aangeschaft en afgevoerd, met uitzondering van de afvoer van de
      pepperspray, de verdekte pepperspray en de munitie, voor zover deze na gebruik geen werkzame bestanddelen meer
      bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel2
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0032136
        artikel: '2'
        hoofdstuk: '1'
  - number: '20.2'
    text: |-
      Onze Minister kan ontheffing verlenen van het eerste lid. Het eerste lid is niet van toepassing op de ambtenaren
      van de krijgsmacht die behoren tot de unit interventie mariniers van de bijzondere bijstandeenheid Dienst speciale
      interventies.
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel20
  - number: '20.3'
    text: Onze Minister kan aanwijzingen geven over de wijze waarop de wapens en de munitie worden afgevoerd.
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel20
  - number: '21.1'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent het dragen, het onderhoud en het in een inbraakvrije
      ruimte bewaren van de wapens en de munitie, bedoeld in de [artikelen 2 tot en met 14][ref1] en [19][ref2], door de
      ambtenaren van politie, bedoeld in [artikel 2 van de Politiewet 2012][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032136#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0032136
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0032136
        artikel: '19'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0031788
        artikel: '2'
  - number: '21.2'
    text: |-
      Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Defensie, worden regels gesteld
      omtrent het dragen, het onderhoud en het in inbraakvrije ruimte bewaren van de wapens en munitie, bedoeld in de
      [artikelen 17][ref1] en [18][ref2], door het personeel van een bijzondere bijstandseenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0032136#Artikel18
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0032136
        artikel: '17'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0032136
        artikel: '18'
        hoofdstuk: '1'
  - number: '22'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent meetmiddelen waarvoor voor het gebruik ervan een
      verklaring van een in deze regeling aangewezen instantie vereist is, alsmede omtrent meetmiddelen die daarmee
      gelijkgesteld worden.
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel22
  - number: '23'
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel23
  - number: 23.a
    text: |-
      *politiesurveillancehond:* hond die uitsluitend wordt ingezet bij de surveillancedienst of het optreden van de
      mobiele eenheid, bedoeld in [artikel 26 van het Besluit beheer politie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0036705#Artikel26
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0036705
        artikel: '26'
  - number: 23.b
    text: |-
      *AOT-hond:* hond die uitsluitend wordt ingezet bij het optreden van een aanhoudings- en ondersteuningsteam of van
      een bijzondere bijstandseenheid;
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel23
  - number: 23.c
    text: |-
      *politiespeurhond:* hond die uitsluitend wordt ingezet voor bij regeling, bedoeld in [artikel 24, derde lid][ref1],
      vastgestelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel24
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0032136
        artikel: '24'
        hoofdstuk: '2'
  - number: '24.1'
    text: 'De politiesurveillancehond, de AOE-hond en de politiespeurhond staan onder toezicht van:'
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel24
  - number: 24.1.a
    text: |-
      een ambtenaar van politie als bedoeld in [artikel 2, onderdeel a, van de Politiewet 2012][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
  - number: 24.1.b
    text: |-
      een ambtenaar van politie als bedoeld in [artikel 2, onderdeel b, van de Politiewet 2012][ref1], die op grond van
      [artikel 7, zevende lid, van die wet][ref2] de bevoegdheid heeft geweld te gebruiken, of


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel7
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '7'
  - number: 24.1.c
    text: |-
      de ambtenaar van politie als bedoeld in [artikel 2, onderdeel c, van die wet][ref1], die is aangesteld voor de
      uitvoering van de politietaak. De ambtenaar, bedoeld in de eerste volzin, beschikt uitsluitend over de hond na
      toestemming van de korpschef.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
  - number: '24.2'
    text: De ambtenaar, bedoeld in het eerste lid, beschikt over een certificaat als bedoeld in het derde lid, onder a.
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel24
  - number: '24.3'
    text: 'Bij ministeriële regeling worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel24
  - number: 24.3.a
    text: |-
      een certificaat waaruit blijkt dat de combinatie van hond en de ambtenaar, bedoeld in het eerste lid, voldoet aan
      de bij deze regeling gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel24
  - number: 24.3.b
    text: de keuring en de herkeuring binnen twee jaar;
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel24
  - number: 24.3.c
    text: de instelling van commissies die zijn belast met de keuring, certificering en herkeuring;
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel24
  - number: 24.3.d
    text: het toezicht op de kwaliteit en de objectiviteit van de keuring en herkeuring.
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel24
  - number: '25.1'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de kleding van de ambtenaren van politie, bedoeld in
      [artikel 56 van het Besluit algemene rechtspositie politie][ref1] en van de vrijwillige ambtenaar van politie,
      bedoeld in [artikel 15 van het Besluit rechtspositie vrijwillige politie][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0007321#Artikel15
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '56'
      - id: ref2
        bwb_id: BWBR0007321
        artikel: '15'
  - number: '25.2'
    text: |-
      De korpschef draagt er zorg voor dat de aan de ambtenaar, bedoeld in het eerste lid, verstrekte kleding niet in
      handen van onbevoegden terecht komt.
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel25
  - number: 25a.1
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de kleding van de directeur van de Politieacademie en zijn
      plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel25a
  - number: 25a.2
    text: |-
      De directeur van de Politieacademie draagt er zorg voor dat de aan de ambtenaren, bedoeld in het eerste lid,
      verstrekte kleding niet in handen van onbevoegden terecht komt.
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel25a
  - number: '26.1'
    text: |-
      De korpschef draagt er zorg voor dat de volgende ambtenaren van politie slechts over bewapening beschikken indien
      zij voldoen aan de bij ministeriële regeling gestelde eisen van bekwaamheid:
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel26
  - number: 26.1.a
    text: |-
      de ambtenaar van politie, bedoeld in [artikel 2, onderdelen a en c, van de Politiewet 2012][ref1], die is
      aangesteld voor de uitvoering van de politietaak;


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
  - number: 26.1.b
    text: |-
      de ambtenaar van politie, bedoeld in [artikel 2, onderdeel b, van de Politiewet 2012][ref1], die op grond van
      [artikel 7, zevende lid, van die wet][ref2] de bevoegdheid heeft geweld te gebruiken.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel7
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '7'
  - number: '26.2'
    text: |-
      Het College van procureurs-generaal draagt er zorg voor dat de ambtenaar van de rijksrecherche die is aangesteld
      voor de uitvoering van de politietaak slechts over bewapening beschikt indien hij voldoet aan de bij ministeriële
      regeling gestelde eisen van bekwaamheid.
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel26
  - number: '26.3'
    text: |-
      De regeling, bedoeld in het eerste en tweede lid, bevat in ieder geval regels over de jaarlijkse toetsing terzake
      van geweldsbeheersing, aanhoudings- en zelfverdedigingsvaardigheden en schietvaardigheid.
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel26
  - number: '27.1'
    text: |-
      De korpschef stelt de ambtenaar van politie, bedoeld in
      [artikel 2, onderdelen a tot en met c, van de Politiewet 2012][ref1], in de gelegenheid de noodzakelijke training,
      opleiding en toetsing te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
  - number: '27.2'
    text: |-
      Het College van procureurs-generaal stelt de ambtenaar van politie, bedoeld in
      [artikel 2, onderdeel d, van de Politiewet 2012][ref1], in de gelegenheid de noodzakelijke training, opleiding en
      toetsing te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
  - number: '28'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de goede taakuitvoering door de politie en de
      eisen die worden gesteld aan de bekwaamheid van de ambtenaren van politie en van het personeel van de bijzondere
      bijstandseenheden.
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel28
  - number: '29'
    text: |-
      Na inwerkingtreding van dit besluit berusten de volgende besluiten onderscheidenlijk regelingen op de volgende
      artikelen van dit besluit:
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel29
  - number: 29.a
    text: |-
      de krachtens [artikel 4, eerste lid, van de Regeling Dienst speciale interventies][ref1] gegeven besluiten inzake
      de goedkeuring van het merk en type wapens en munitie op [artikel 17, tweede lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0026381#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032136#Artikel17
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0026381
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0032136
        artikel: '17'
        hoofdstuk: '1'
  - number: 29.b
    text: |-
      de [Regeling meetmiddelen politie][ref1] op [artikel 22][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0008821
      [ref2]: https://wetten.overheid.nl/BWBR0032136#Artikel22
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0008821
      - id: ref2
        bwb_id: BWBR0032136
        artikel: '22'
        hoofdstuk: '1'
  - number: 29.c
    text: |-
      de [Regeling politiehonden][ref1] op [artikel 24, derde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0019728
      [ref2]: https://wetten.overheid.nl/BWBR0032136#Artikel24
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0019728
      - id: ref2
        bwb_id: BWBR0032136
        artikel: '24'
        hoofdstuk: '2'
  - number: 29.d
    text: |-
      de [Kledingregeling voor de politie][ref1] op [artikel 25, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006553
      [ref2]: https://wetten.overheid.nl/BWBR0032136#Artikel25
    url: https://wetten.overheid.nl/BWBR0032136/2017-06-23#Artikel29
    references:
      - id: ref1
