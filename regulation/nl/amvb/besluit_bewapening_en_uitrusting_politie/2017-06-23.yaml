      - id: ref2
        bwb_id: BWBR0032136
        artikel: '26'
        hoofdstuk: '4'
  - number: 29.f
    text: |-
      de [Regeling mobiele eenheid 2007][ref1] en de [Regeling infiltratieteams][ref2],
      voor zover deze berustten op [artikel 48a van de Politiewet 1993][ref3], en de
      [Regeling aanhoudings- en ondersteuningseenheid en samenwerking speciale eenheden][ref4], voor zover deze berustte
      op [artikel 60, tweede lid, van de Politiewet 1993][ref5], op [artikel 28][ref6].


