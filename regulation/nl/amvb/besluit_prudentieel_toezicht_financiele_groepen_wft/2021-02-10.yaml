  - number: '4'
    text: |-
      1 Een beleggingsonderneming of bank als bedoeld in [artikel 3:280, eerste lid, van de wet][ref1] dient de in het
      derde lid van dat artikel bedoelde rapportage eenmaal per jaar bij de Nederlandsche Bank of de Europese Centrale
      Bank in, tenzij de Nederlandsche Bank of de Europese Centrale Bank, indien de solvabiliteit door ontwikkelingen bij
      de beleggingsonderneming of bank in het gedrang is of zou kunnen komen, besluit dat er gerapporteerd wordt met een
      hogere frequentie.

      2 Onder significante intragroepsovereenkomsten of -posities als bedoeld in
      [artikel 3:280, derde lid, van de wet][ref2] worden verstaan overeenkomsten of posities die een door de
      Nederlandsche Bank vast te stellen drempel, gerelateerd aan de aanwezige solvabiliteit, te boven gaan. Alvorens de
      drempel vast te stellen, voert de Nederlandsche Bank overleg met de betrokken Nederlandse beleggingsonderneming of
      Nederlandse bank. De Nederlandsche Bank stelt geen kwalitatieve of andere kwantitatieve drempels vast.

      3 De Nederlandsche Bank stelt regels met betrekking tot de categorieën overeenkomsten en posities die in de
      rapportage worden betrokken en de rapportage.

      4 De in het derde lid bedoelde regels hebben uitsluitend betrekking op:

      a. het model van de staat;

      b. de reikwijdte van toepassing van de staat en de mate van detaillering van de in te vullen gegevens; deze
      omvatten geen uitbreiding of nadere rubricering van de staat;

      c. de waardering van de posten overeenkomstig de waarderingsmethoden die de financiële onderneming in haar
      jaarrekening toepast;

      d. de te hanteren valuta en rekeneenheid;

      e. de afronding; en

      f. de termijn waarbinnen de rapportage wordt verstrekt; met dien verstande dat deze
      niet korter is dan noodzakelijk voor de uitoefening van het toezicht op de naleving van
      [hoofdstuk 6 van het Deel Prudentieel toezicht financiële ondernemingen van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3280
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3280
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Hoofdstuk3.6
