  - number: '4.01'
    text: |-
      1 De gegevens, bedoeld in [artikel 3:280b, derde lid, van de wet][ref1] zijn:

      a. een opgave van de naam, het adres, het emailadres en het telefoonnummer van de holding;

      b. een opgave van de rechtsvorm, de statutaire zetel en statutaire naam van de holding en een gewaarmerkt afschrift
      van de statuten van de holding;

      c. indien de holding is ingeschreven in het handelsregister, een opgave van het nummer van inschrijving;

      d. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of wordt voldaan aan hetgeen ingevolge
      [artikel 3:273a, eerste lid, onderdeel a, van de wet][ref2] is bepaald met betrekking tot de interne regelingen en
      een verdeling van de taken binnen de groep;

      e. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of wordt voldaan aan hetgeen ingevolge
      [artikel 3:273a, eerste lid, onderdeel b, van de wet][ref3] is bepaald met betrekking tot de organisatiestructuur
      van de groep;

      f. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of wordt voldaan aan hetgeen ingevolge
      [artikel 3:273a, tweede lid, van de wet][ref4] is bepaald met betrekking tot het minimum aantal personen dat het
      dagelijks beleid van de holding bepaalt;

      g. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of wordt voldaan aan
      [artikel 3:100, eerste lid, aanhef en onderdeel a tot en met f, van de wet][ref5] indien de aanvraag een holding
      betreft die een gekwalificeerde deelneming in een bank houdt of voornemens is te houden; en

      h. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikelen 3:271][ref6] en [3:272 van de wet][ref7] is bepaald met betrekking tot de geschiktheid en
      betrouwbaarheid van de personen die het dagelijks beleid van de holding bepalen.

      2 De gegevens, bedoeld in het eerste lid, onderdeel d, zijn:

      a. een beschrijving van de organisatiestructuur en de verdeling van taken binnen de groep waarvan de holding deel
      uitmaakt waarmee de naleving van de prudentiële vereisten op geconsolideerde of gesubconsolideerde basis wordt
      geborgd, waaronder begrepen de verdeling van taken tussen de dochterinstellingen; en

      b. een beschrijving van het beleid waarmee de naleving van de prudentiële vereisten op geconsolideerde of
      gesubconsolideerde basis binnen de groep wordt geborgd en gehandhaafd en waarmee conflicten binnen de groep worden
      voorkomen of beheerst.

      3 De gegevens, bedoeld in het eerste lid, onderdeel e, zijn:

      a. een beschrijving van de organisatiestructuur van de groep waarvan de holding deel uitmaakt, waaruit de locatie
      en het type activiteiten van alle entiteiten in de groep en de positie en de rol van de holding naar voren komt; en

      b. een beschrijving van de zeggenschapsstructuur binnen de groep.

      4 De gegevens, bedoeld in het eerste lid, onderdeel g, zijn:

      a. een opgave van de omvang van de gekwalificeerde deelneming;

      b. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of de betrouwbaarheid van de aanvrager of de
      houder van een verklaring van geen bezwaar die op grond van zijn gekwalificeerde deelneming het beleid van de bank
      zou kunnen bepalen of mede bepalen of zou bepalen of medebepalen; en

      c. bescheiden waaruit de financiële positie van de aanvrager of houder van de verklaring van geen bezwaar blijken.

      5 De gegevens, bedoeld in het eerste lid, onderdeel h, zijn:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoonnummer
      en de functie;

      b. een curriculum vitae;

      c. een kopie van een geldig identiteitsbewijs;

      d. een opgave van referenten;

      e. voor de beoordeling van de geschiktheid van de personen die het dagelijks beleid van de holding bepalen, een
      opgave van de relevante diploma’s; en

      f. voor de beoordeling van de betrouwbaarheid van de personen die het dagelijks
      beleid van de holding bepalen, gegevens met betrekking tot antecedenten, bedoeld in
      [bijlage A, behorend bij artikel 6 van het Besluit prudentiële regels Wft][ref8].

      6 Het eerste lid, onderdeel g, is niet van toepassing indien de holding reeds beschikt over een of meerdere
      verklaringen van geen bezwaar voor de gekwalificeerde deelneming in de bank tenzij de Nederlandsche Bank besluit
      dat een redelijke aanleiding bestaat tot een nieuwe beoordeling van de gegevens als bedoeld in dat onderdeel.

      7 Het eerste lid, onderdeel h, met betrekking tot [artikel 3:271 van de wet][ref9] is niet van toepassing indien
      de beoordeling een persoon betreft wiens geschiktheid als persoon die het dagelijks beleid van die holding bepaald
      voor de toepassing van de [wet][ref10] door een toezichthouder reeds is vastgesteld, tenzij de Nederlandsche
      Bank besluit dat een redelijke aanleiding bestaat tot een nieuwe beoordeling van de gegevens als bedoeld in dat
      onderdeel.

      8 Het eerste lid, onderdeel h, met betrekking tot [artikel 3:272 van de wet][ref11] is niet van toepassing
      indien de beoordeling een persoon betreft wiens betrouwbaarheid voor de toepassing van de [wet][ref12] door een
      toezichthouder reeds is vastgesteld, tenzij de Nederlandsche Bank besluit dat een redelijke aanleiding bestaat tot
      een nieuwe beoordeling als bedoeld in [artikel 3:9, tweede lid van de wet][ref13].

      9 De Nederlandsche Bank kan in aanvulling op de gegevens, bedoeld in het eerste lid, andere gegevens van
      de holding, bedoeld in [artikel 3:280a van de wet][ref14], verlangen indien die gegevens nodig zijn voor de
      beoordeling van de aanvraag om goedkeuring, bedoeld in [artikel 3:280b van de wet][ref15].


