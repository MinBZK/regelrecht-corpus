  - number: '4.02'
    text: |-
      1 De gegevens, bedoeld in [artikel 3:280c, tweede lid, van de wet][ref1] zijn:

      a. een opgave van de naam, het adres, het emailadres en het telefoonnummer van de holding;

      b. een opgave van de rechtsvorm, de statutaire zetel en statutaire naam van de holding en een gewaarmerkt afschrift
      van de statuten van de holding;

      c. indien de holding is ingeschreven in het handelsregister, een opgave van het nummer van inschrijving;

      d. een beschrijving van de activiteiten van de holding;

      e. gegevens op basis waarvan de Nederlandsche Bank kan vaststellen dat de holding niet is aangewezen als een af te
      wikkelen entiteit in een van de af te wikkelen groepen van de groep waarvan de holding deel uitmaakt als bedoeld in
      [artikel 3:280c, eerste lid, onderdeel b, van de wet][ref2];

      f. gegevens op basis waarvan de Nederlandsche Bank kan vaststellen dat de holding geen bestuurs-, operationele of
      financiële beslissingen neemt die invloed hebben op de groep of op de dochterondernemingen van de groep indien dat
      banken, beleggingsondernemingen in de zin van de verordening kapitaalvereisten of financiële instellingen zijn; en

      g. een opgave van de naam, het adres, het emailadres en het telefoonnummer van de bank, als bedoeld in
      [artikel 3:280c, eerste lid, van de wet][ref3] die deel uitmaakt van dezelfde groep als de holding die
      verantwoordelijk is voor de naleving van de vereisten die gelden op geconsolideerde basis binnen de groep.

      2 De Nederlandsche Bank kan in aanvulling op de gegevens, bedoeld in het eerste lid, andere gegevens van de holding
      bedoeld in [artikel 3:280c van de wet][ref4] verlangen indien die gegevens nodig zijn voor de beoordeling van de
      aanvraag om ontheffing van goedkeuring bedoeld in dat artikel.


