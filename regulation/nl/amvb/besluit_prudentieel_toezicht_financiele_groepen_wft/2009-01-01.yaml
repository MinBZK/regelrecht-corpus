  - number: 4c
    text: |-
      1 De Nederlandsche Bank kan een ontheffing als bedoeld in [artikel 3:280b van de wet][ref1] verlenen aan een
      beleggingsonderneming die deel uitmaakt van een groep waarvan niet tevens een kredietinstelling deel uitmaakt,
      indien in de desbetreffende groep:

      a. op elke beleggingsonderneming [artikel 62a, eerste of tweede lid, van het Besluit prudentiële regels Wft][ref2]
      van toepassing is;

      b. elke beleggingsonderneming die een beleggingsonderneming als bedoeld in
      [artikel 62a, eerste lid, van het Besluit prudentiële regels Wft][ref3] is, een toetsingsvermogen aanhoudt dat ten
      minste gelijk is aan het hoogste van de volgende bedragen:

      1°. de som van de bedragen, bedoeld in
      [artikel 60, eerste lid, onderdelen a tot en met c, van het Besluit prudentiële regels Wft][ref4]; of

      2°. het bedrag, bedoeld in [artikel 60, derde lid, van het Besluit prudentiële regels Wft][ref5]; en

      c. elke beleggingsonderneming die een beleggingsonderneming als bedoeld in
      [artikel 62a, tweede lid, van het Besluit prudentiële regels Wft][ref6] is, een
      toetsingsvermogen aanhoudt dat ten minste gelijk is aan de som van de bedragen, bedoeld in
      [artikel 60, eerste lid, onderdelen a tot en met c, en derde lid, van het Besluit prudentiële regels Wft][ref7].

      2 Indien de Nederlandsche Bank een ontheffing als bedoeld in het eerste lid verleent, houdt
      een moederbeleggingsonderneming of een beleggingsonderneming die dochteronderneming is van
      een financiële holding op geconsolideerde basis een toetsingsvermogen aan op basis van de
      geconsolideerde financiële positie van die moederbeleggingsonderneming onderscheidenlijk
      financiële holding dat ten minste gelijk is aan de som van de bedragen, bedoeld in
      [artikel 60, eerste lid, onderdelen a tot en met c, en derde lid, van het Besluit prudentiële regels Wft][ref8].


