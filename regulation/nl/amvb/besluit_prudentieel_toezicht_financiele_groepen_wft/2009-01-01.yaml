  - number: '18'
    text: |-
      Bij de berekening van de aangepaste solvabiliteit van een Nederlandse herverzekeraar, levensverzekeraar of
      schadeverzekeraar die een deelnemende onderneming is in een beleggingsonderneming, financiële instelling of
      kredietinstelling, is hetgeen is bepaald ingevolge [artikel 3:57, tweede lid, van de wet][ref1] met betrekking
      tot de mogelijke aftrek van een dergelijke deelneming en de mogelijkheid om alternatieve methoden toe te staan van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel357
    url: https://wetten.overheid.nl/BWBR0020415/2009-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3:57
  - number: '19'
    text: |-
      Indien de Nederlandsche Bank niet beschikt over de voor het toezicht op de berekening overeenkomstig deze
      afdeling noodzakelijke informatie betreffende een verbonden onderneming, brengt de verzekeraar, bedoeld in
      [artikel 6][ref1], de boekwaarde van deze onderneming in mindering op de vermogensbestanddelen die in aanmerking
      komen voor de berekening van de aangepaste solvabiliteit. In dat geval worden aan deze deelneming verbonden
      meerwaarden niet als vermogensbestanddeel in deze berekening betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0020415#Artikel6
    url: https://wetten.overheid.nl/BWBR0020415/2009-01-01#Artikel19
