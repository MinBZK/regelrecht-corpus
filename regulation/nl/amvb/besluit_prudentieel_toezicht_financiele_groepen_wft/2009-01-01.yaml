  - number: '23'
    text: |-
      1 Een onderneming als bedoeld in [artikel 3:296, eerste lid, van de wet][ref1] berekent de aanvullende
      kapitaaltoereikendheid van het financieel conglomeraat in overeenstemming met de ingevolge dit hoofdstuk
      voorgeschreven regels.

      2 De onderneming past voor de berekening van de aanvullende kapitaaltoereikendheid een van de in [bijlage B][ref2]
      bij dit besluit opgenomen berekeningsmethoden toe.

      3 De aanvullende kapitaaltoereikendheid is voldoende indien de uitkomst van de berekening, bedoeld in het tweede
      lid, niet negatief is.

      4 Onverminderd het tweede lid kan de Nederlandsche Bank, indien zij coördinator is als bedoeld in
      [artikel 3:293 van de wet][ref3], na overleg met de andere relevante toezichthoudende instanties en het financieel
      conglomeraat, besluiten welke van die methoden de onderneming voor de berekening toepast.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3296
      [ref2]: https://wetten.overheid.nl/BWBR0020415
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3293
