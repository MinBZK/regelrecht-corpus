  - number: '6'
    text: |-
      1 Een verzekeraar als bedoeld in [artikel 3:285, eerste lid, van de wet][ref1] berekent de aangepaste solvabiliteit
      overeenkomstig de in deze afdeling gestelde regels.

      2 De verzekeraar neemt bij de berekening van de aangepaste solvabiliteit in aanmerking:

      a. de overeenkomstig de [wet][ref2] berekende solvabiliteit van met hem verbonden beheerders
      van instellingen voor collectieve belegging in effecten die een vergunning als bedoeld in
      [artikel 2:65, eerste lid, onderdeel a, of tweede lid][ref3], hebben;

      b. de overeenkomstig de wet berekende solvabiliteit van met hem verbonden beheerders met zetel in het buitenland
      die, indien zij in Nederland hun zetel zouden hebben, beheerder van een instelling voor collectieve belegging in
      effecten zouden zijn waaraan een vergunning ingevolge [artikel 2:65, tweede lid][ref4], zou kunnen worden verleend.

      3 Het tweede lid is niet van toepassing indien de betrokken beheerder is betrokken in het toezicht, bedoeld in
      [afdeling 3.6.2 van de wet][ref5], op een Nederlandse kredietinstelling.

      4 De verzekeraar rapporteert de aangepaste solvabiliteit eenmaal per jaar, tenzij de Nederlandsche Bank, indien de
      aangepaste solvabiliteit door ontwikkelingen bij de verzekeraar in het gedrang is of zou kunnen komen, besluit dat
      er gerapporteerd moet worden met een hogere frequentie.

      5 De Nederlandsche Bank stelt regels met betrekking tot de rapportage, bedoeld in het vierde lid.
      [Artikel 4, vierde lid][ref6], is van toepassing.


