  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Financiën van 27 juni 2006, nr. FM 2006-01503 M;


    Gelet op richtlijn nr. 2002/87/EG van het Europees Parlement en de Raad van de Europese Unie van 16 december 2002
    betreffende het aanvullende toezicht op kredietinstellingen, verzekeringsondernemingen en beleggingsondernemingen
    in een financieel conglomeraat en tot wijziging van de Richtlijnen 73/239/EEG, 79/267/EEG, 92/49/EEG, 92/96/EEG,
    93/6/EEG en 93/22/EEG van de Raad en van de Richtlijnen 98/78/EG en 2000/12/EG van het Europees Parlement en de
    Raad (PbEU 2003 L 35), richtlijn nr. 2000/12/EG van het Europees Parlement en de Raad van de Europese Unie van
    20 maart 2000 betreffende de toegang tot en de uitoefening van de werkzaamheden van kredietinstellingen (PbEG
    L 126) en Richtlijn nr. 98/78/EG van het Europees Parlement en de Raad van de Europese Unie van 27 oktober 1998
    betreffende het aanvullende toezicht op verzekeringsondernemingen in een verzekeringsgroep (PbEG L 330) en de
    artikelen 3:270, tweede lid, 3:280, vierde lid, 3:284, derde lid, 3:285, 3:286 en 3:296 tot en met 3:299 van de Wet
    op het financieel toezicht;


    De Raad van State gehoord (advies van 26 juli 2006, nr. W06.06.0260/IV);


    Gezien het nader rapport van Onze Minister van Financiën van 9 oktober 2006, nr. FM 2006-01859U;


    Hebben goedgevonden en verstaan:
