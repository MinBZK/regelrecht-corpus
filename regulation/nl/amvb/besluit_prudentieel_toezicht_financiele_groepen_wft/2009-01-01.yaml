  - number: '25'
    text: |-
      1 Ongeacht welke van de in [artikel 23, tweede lid][ref1], bedoelde methoden wordt toegepast, betrekt de
      onderneming, bedoeld in [artikel 23][ref2], het totale solvabiliteitstekort van een dochteronderneming bij de
      berekening, indien het groepslid een dochteronderneming is en zij een solvabiliteitstekort of, indien het groepslid
      een niet-gereglementeerde entiteit uit de financiële marktsector is, een theoretisch solvabiliteitstekort heeft.

      2 Indien de Nederlandsche Bank coördinator is als bedoeld in [artikel 3:293 van de wet][ref3] en zij van oordeel
      is dat de aansprakelijkheid van de moederonderneming die een gedeelte van het kapitaal van de dochteronderneming
      in eigendom heeft, strikt en ondubbelzinnig tot dat gedeelte van het kapitaal beperkt is, kan zij besluiten dat de
      onderneming het solvabiliteitstekort van die dochteronderneming proportioneel in aanmerking neemt. Indien tussen
      de groepsleden geen kapitaalbanden bestaan, bepaalt de Nederlandsche Bank, indien zij coördinator is als bedoeld
      in [artikel 3:293 van de wet][ref4], na overleg met de relevante toezichthoudende instanties, het gedeelte van
      het solvabiliteitstekort dat de onderneming bij de berekening betrekt, rekening houdend met de aansprakelijkheid
      waartoe de bestaande betrekkingen aanleiding geven.

      3 Ongeacht welke van de in [artikel 23, tweede lid][ref5], bedoelde methoden wordt toegepast:

      a. is het meerdere malen gebruiken van vermogensbestanddelen die voor de berekening van het eigen vermogen in
      aanmerking komen op het niveau van het financiële conglomeraat of de creatie van eigen vermogen binnen de groep
      niet toegestaan; met het oog daarop zijn de relevante regels van de desbetreffende sectorale voorschriften van
      overeenkomstige toepassing;

      b. betrekt de onderneming bij de berekening van de aanwezige solvabiliteit voor iedere deelsector in het
      financieel conglomeraat de eigenvermogensbestanddelen als omschreven in de voor die deelsector geldende sectorale
      voorschriften; indien er een tekort aan eigen vermogen is op het niveau van het financiële conglomeraat, betrekt
      de onderneming bij die berekening alleen de eigenvermogensbestanddelen die op grond van elk van de sectorale
      voorschriften in aanmerking komen;

      c. houdt de onderneming bij de berekening van het eigen vermogen van het financiële conglomeraat rekening met
      de beperkingen die voor de berekening van het eigen vermogen gelden op grond van de voor elk van de deelsectoren
      geldende sectorale voorschriften;

      d. betrekt de onderneming bij de berekening van het eigen vermogen van het financiële conglomeraat alleen het eigen
      vermogen voorzover dit effectief overdraagbaar en beschikbaar is tussen de verschillende groepsleden in het licht
      van de doeleinden van de kapitaaltoereikendheidsvoorschriften;

      e. berekent de onderneming het theoretische solvabiliteitsvereiste voor een niet-gereglementeerd groepslid uit de
      financiële marktsector volgens de regels waaraan dat groepslid krachtens de desbetreffende sectorale voorschriften
      zou moeten voldoen indien het een gereglementeerde entiteit van die specifieke deelsector zou zijn;

      f. berekent de onderneming het theoretische solvabiliteitsvereiste van een gemengde financiële holding in
      overeenstemming met de sectorale voorschriften van de belangrijkste deelsector in het financiële conglomeraat.


      [ref1]: https://wetten.overheid.nl/BWBR0020415#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0020415#Artikel23
