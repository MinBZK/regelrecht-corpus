  - number: '11'
    text: |-
      De totale waarde van de in de [artikelen 9][ref1] en [10][ref2] bedoelde vermogensbestanddelen overschrijdt het
      minimumbedrag aan solvabiliteitsmarge van de verbonden Nederlandse en Europese herverzekeraars, levensverzekeraars
      en schadeverzekeraars niet.


      [ref1]: https://wetten.overheid.nl/BWBR0020415#Artikel9
