  - number: '12'
    text: |-
      1 Een verzekeraar als bedoeld in [artikel 6][ref1] betrekt bij de berekening van de aangepaste solvabiliteit geen
      vermogensbestanddelen die afkomstig zijn van de wederzijdse financiering tussen hem en:

      a. met hem verbonden ondernemingen;

      b. in hem deelnemende ondernemingen; of

      c. andere ondernemingen die verbonden zijn met in hem deelnemende ondernemingen.

      2 De verzekeraar betrekt bij de berekening evenmin vermogensbestanddelen van een met hem verbonden Nederlandse of
      Europese herverzekeraar, levensverzekeraar of schadeverzekeraar die afkomstig zijn van de wederzijdse financiering
      tussen die verbonden herverzekeraar, levensverzekeraar of schadeverzekeraar en een andere daarmee verbonden
      onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0020415#Artikel6
    url: https://wetten.overheid.nl/BWBR0020415/2009-01-01#Artikel12
