  - number: '7'
    text: |-
      1 Een verzekeraar als bedoeld in [artikel 6][ref1] die met een Nederlandse of Europese herverzekeraar,
      levensverzekeraar of schadeverzekeraar is verbonden, betrekt in de berekening van de aangepaste solvabiliteit
      bij toepassing van methode 1 of 2, bedoeld in [bijlage A][ref2], het gedeelte van het geplaatste kapitaal
      dat zijn belang vertegenwoordigt, of bij toepassing van methode 3, bedoeld in genoemde [bijlage][ref3],
      de percentages die worden gebruikt voor de opstelling van zijn geconsolideerde jaarrekening, bedoeld in
      [artikel 405 van Boek 2 van het Burgerlijk Wetboek][ref4].

      2 Ongeacht de methode die wordt toegepast, neemt de verzekeraar, indien een verbonden Nederlandse of Europese
      herverzekeraar, levensverzekeraar of schadeverzekeraar een dochteronderneming is en een solvabiliteitstekort
      vertoont, het totale solvabiliteitstekort van de dochteronderneming in aanmerking.

      3 De Nederlandsche Bank kan besluiten dat de verzekeraar alleen het proportionele deel van het solvabiliteitstekort
      van de dochteronderneming, bedoeld in het tweede lid, bij de berekening behoeft te betrekken, indien zij van mening
      is dat de aansprakelijkheid van de verzekeraar strikt en ondubbelzinnig beperkt is tot zijn belang daarin.

      4 Indien er tussen de verzekeraar en de in het aanvullend toezicht betrokken onderneming geen kapitaalbanden
      bestaan, bepaalt de Nederlandsche Bank welk gedeelte van het solvabiliteitstekort in de berekening wordt betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0020415#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020415
      [ref3]: https://wetten.overheid.nl/BWBR0020415
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel405
