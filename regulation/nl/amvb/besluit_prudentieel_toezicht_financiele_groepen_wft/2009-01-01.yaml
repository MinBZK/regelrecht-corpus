  - number: '20'
    text: |-
      Een verzekeraar als bedoeld in [artikel 6][ref1] past voor de berekening van de aangepaste solvabiliteit een van de
      in [bijlage A][ref2] bij dit besluit opgenomen berekeningsmethoden toe.


      [ref1]: https://wetten.overheid.nl/BWBR0020415#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020415
