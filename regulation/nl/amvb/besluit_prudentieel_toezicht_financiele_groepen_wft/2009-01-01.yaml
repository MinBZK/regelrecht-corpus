  - number: '24'
    text: |-
      1 Een onderneming als bedoeld in [artikel 3:296, eerste lid, van de wet][ref1] verstrekt de in het
      [vierde lid van dat artikel][ref2] bedoelde berekening eenmaal per jaar. De Nederlandsche Bank kan, indien
      ontwikkelingen in de aanvullende kapitaaltoereikendheid daar aanleiding toe geven, besluiten dat die onderneming de
      berekening met een hogere frequentie verstrekt.

      2 De Nederlandsche Bank stelt, met inachtneming van het bepaalde ingevolge het
      [Deel Prudentieel toezicht financiële ondernemingen van de wet][ref3], alsmede met inachtneming van
      [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref4] en de internationale jaarrekeningstandaarden, nadere regels
      met betrekking tot de rapportage van de aanvullende kapitaaltoereikendheid. [Artikel 4, vierde lid][ref5], is van
      toepassing.

      3 De in het eerste lid bedoelde onderneming verstrekt bovendien eenmaal per jaar op een na overleg met de
      Nederlandsche Bank door de onderneming te bepalen tijdstip de informatie die aan het groepsbestuur van het
      financiële conglomeraat wordt verstrekt over de aanvullende kapitaaltoereikendheid en die is opgesteld met
      gebruikmaking van de procedures, bedoeld in [artikel 28, eerste lid, onderdeel a][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3296
