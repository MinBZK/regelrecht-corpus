  - number: '13'
    text: |-
      1 Een verzekeraar als bedoeld in [artikel 6][ref1] betrekt, ongeacht de gekozen methode, bedoeld in
      [artikel 20][ref2], bij de berekening van de aangepaste solvabiliteit iedere rechtstreeks of middellijk met hem
      verbonden Nederlandse, Europese en niet-Europese herverzekeraar, levensverzekeraar en schadeverzekeraar.

      2 De Nederlandsche Bank kan besluiten dat de verzekeraar geen aangepaste solvabiliteit behoeft te berekenen,
      indien:

      a. de verzekeraar een verbonden herverzekeraar, levensverzekeraar of schadeverzekeraar is van een andere
      Nederlandse herverzekeraar, levensverzekeraar of schadeverzekeraar en de verzekeraar in aanmerking wordt genomen
      bij de voor die andere verzekeraar uitgevoerde berekening;

      b. de verzekeraar als moederonderneming dezelfde verzekeringsholding of niet-Europese herverzekeraar,
      levensverzekeraar of schadeverzekeraar heeft als een andere Nederlandse herverzekeraar, levensverzekeraar of
      schadeverzekeraar en in aanmerking wordt genomen bij de voor die andere verzekeraar uitgevoerde berekening; of

      c. de verzekeraar als moederonderneming dezelfde verzekeringsholding of niet-Europese herverzekeraar,
      levensverzekeraar of schadeverzekeraar heeft als een niet-Europese herverzekeraar, levensverzekeraar of
      schadeverzekeraar en [artikel 3:288 van de wet][ref3] is toegepast.

      3 De Nederlandsche Bank neemt slechts een besluit als bedoeld in het tweede lid, indien de vermogensbestanddelen
      die in aanmerking komen voor de berekening van de solvabiliteitsmarge van de bij de berekening betrokken
      herverzekeraars, levensverzekeraars of schadeverzekeraars, adequaat over de in dat lid bedoelde ondernemingen
      verdeeld zijn.

      4 De Nederlandsche Bank kan besluiten dat de verzekeraar bij de berekening rekening houdt met de solvabiliteit van
      een verbonden herverzekeraar, levensverzekeraar of schadeverzekeraar die zijn zetel heeft in een andere lidstaat,
      zoals die door de toezichthoudende instantie van die andere lidstaat is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020415#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020415#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3288
