  - number: 4a
    text: |-
      1 De Nederlandsche Bank kan een ontheffing als bedoeld in [artikel 3:280b van de wet][ref1] verlenen aan een
      beleggingsonderneming die deel uitmaakt van een groep indien in de desbetreffende groep:

      a. elke Nederlandse beleggingsonderneming haar aanwezig toetsingsvermogen berekent ingevolge
      [artikel 90, tweede lid, van het Besluit prudentiële regels Wft][ref2];

      b. elke Nederlandse beleggingsonderneming een beleggingsonderneming als bedoeld in
      [artikel 62a, eerste of tweede lid, van het Besluit prudentiële regels Wft][ref3] is;

      c. elke Nederlandse beleggingsonderneming voldoet aan [artikel 62a van het Besluit prudentiële regels Wft][ref4],
      waarbij de waarde van latente verplichtingen aan beleggingsondernemingen, financiële instellingen,
      vermogensbeheerders en ondernemingen die nevendiensten verrichten, die binnen de reikwijdte van de consolidatie
      zouden vallen, in mindering worden gebracht op dit toetsingsvermogen;

      d. elke financiële moederholding van een beleggingsonderneming beschikt over een toetsingsvermogen dat
      wordt gevormd door de posten, bedoeld in de [artikelen 91, tweede lid, onderdelen a tot en met j][ref5],
      en [92, tweede en derde lid, van het Besluit prudentiële regels Wft][ref6], en dat ten minste gelijk is
      aan de som van de waarde van de aandelen, deelnemingen, achtergestelde leningen en posten als bedoeld in
      [artikel 94, tweede lid, onderdelen a tot en met e, van dat besluit][ref7] ten aanzien van beleggingsondernemingen,
      financiële instellingen, vermogensbeheerders en ondernemingen die nevendiensten verrichten, die binnen de
      reikwijdte van de consolidatie zouden vallen, en de waarde van de latente verplichtingen van de financiële
      moederholding aan deze ondernemingen;

      e. elke Nederlandse beleggingsonderneming beschikt over systemen om de bronnen van de passiva van alle tot de
      groep behorende financiële holdings, beleggingsondernemingen, financiële instellingen, vermogensbeheerders en
      ondernemingen die nevendiensten verrichten, te bewaken en te beheersen; en

      f. elke beleggingsonderneming met zetel in een andere lidstaat voldoet aan de in die lidstaat geldende regels die
      overeenkomen met de onderdelen a tot en met c en e.

      2 De Nederlandsche Bank kan, op verzoek, besluiten dat een financiële Nederlandse moederholding van een
      beleggingsonderneming, in afwijking van het eerste lid, onderdeel d, beschikt over een toetsingsvermogen
      dat wordt gevormd door de posten, bedoeld in de [artikelen 91, tweede lid, onderdelen a tot en met j][ref8],
      en [92, tweede en derde lid, van het Besluit prudentiële regels Wft][ref9] en dat ten minste gelijk is aan
      de som van de minimumomvang van het toetsingsvermogen van beleggingsondernemingen, financiële instellingen,
      vermogensbeheerders en ondernemingen die nevendiensten verrichten, die binnen de reikwijdte van de consolidatie
      zouden vallen, berekend volgens het [Besluit prudentiële regels Wft][ref10], en de waarde van de latente
      verplichtingen van de financiële moederholding aan deze ondernemingen.

      3 Indien de Nederlandsche Bank een ontheffing als bedoeld in het eerste lid verleent, kan zij verlangen dat de
      beleggingsonderneming haar in kennis stelt van de door die beleggingsonderneming te lopen relevante risico’s.
      Indien zij zulks verlangt en indien de financiële positie van de beleggingsonderneming onvoldoende beschermd is,
      neemt de beleggingsonderneming passende maatregelen ter beperking van de relevante risico’s.

      4 Indien de Nederlandsche Bank een ontheffing als bedoeld in het eerste lid verleent:

      a. neemt zij passende maatregelen voor het toezicht op de door de gehele groep, waarvan de beleggingsonderneming
      deel uitmaakt, te lopen relevante risico’s; en

      b. is het ingevolge de [artikelen 3:17][ref11] en [3:18a van de wet][ref12] bepaalde op de beleggingsonderneming
      van toepassing.


