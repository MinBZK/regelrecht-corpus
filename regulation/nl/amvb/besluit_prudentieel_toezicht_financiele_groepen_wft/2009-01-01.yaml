  - number: '8'
    text: |-
      1 Onverminderd [artikel 12][ref1] en ongeacht de gekozen methode, bedoeld in [artikel 20][ref2], gebruikt een
      verzekeraar als bedoeld in [artikel 6][ref3] de vermogensbestanddelen die in aanmerking worden genomen bij
      de berekening van de solvabiliteitsmarge niet meerdere malen voor de verschillende Nederlandse en Europese
      herverzekeraars, levensverzekeraars en schadeverzekeraars die bij die berekening betrokken zijn.

      2 Voorzover de methoden, bedoeld in [artikel 20][ref4], daarin nog niet voorzien, betrekt de verzekeraar bij de
      berekening van zijn aangepaste solvabiliteit niet:

      a. de waarde van zijn activa die dienen ter dekking van het minimumbedrag aan solvabiliteitsmarge van de met hem
      verbonden Nederlandse en Europese herverzekeraars, levensverzekeraars en schadeverzekeraars;

      b. de waarde van de activa van met hem verbonden Nederlandse en Europese herverzekeraars, levensverzekeraars
      en schadeverzekeraars die dienen ter dekking van het minimumbedrag aan solvabiliteitsmarge van andere met
      die verbonden herverzekeraars, levensverzekeraars en schadeverzekeraars verbonden Nederlandse en Europese
      herverzekeraars, levensverzekeraars en schadeverzekeraars.


      [ref1]: https://wetten.overheid.nl/BWBR0020415#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0020415#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0020415#Artikel6
