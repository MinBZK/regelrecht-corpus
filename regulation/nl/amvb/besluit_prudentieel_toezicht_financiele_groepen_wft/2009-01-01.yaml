  - number: '28'
    text: |-
      1 Een onderneming als bedoeld in [artikel 3:299, eerste lid, van de wet][ref1], beschikt over:

      a. adequate procedures met betrekking tot de kapitaaltoereikendheid om alle bestaande materiële risico’s te bepalen
      en te meten en het eigen vermogen naar behoren af te stemmen op de risico’s;

      b. gedegen rapportage- en jaarrekeningsystemen, met het oog op de bepaling, meting, bewaking en beheersing van de
      intragroepsovereenkomsten- en posities en de risicoconcentratie.

      2 De onderneming beschikt tevens met het oog op het risicobeheer, bedoeld in
      [artikel 3:299, eerste lid, onderdeel a, van de wet][ref2], over:

      a. een gedegen bestuur en beheer, waarin is voorzien in goedkeuring en periodieke evaluatie van de strategieën en
      het beleid door de passende bestuursorganen op het niveau van het financiële conglomeraat met betrekking tot alle
      risico’s die zij aangaan;

      b. een adequaat kapitaaltoereikendheidsbeleid om te anticiperen op de gevolgen van de bedrijfsstrategie van de
      gereglementeerde entiteiten in het financieel conglomeraat voor het risicoprofiel en de kapitaaltoereikendheid,
      bedoeld in [artikel 3:296 van de wet][ref3];

      c. adequate procedures om te waarborgen dat de risicobewakingssystemen van de gereglementeerde entiteiten in
      het financieel conglomeraat goed geïntegreerd zijn in hun organisatie en dat alle maatregelen zijn genomen om te
      waarborgen dat de systemen die worden toegepast in alle ondernemingen die onder het aanvullende toezicht vallen
      met elkaar in overeenstemming zijn, zodat de risico’s op het niveau van het financiële conglomeraat kunnen worden
      gemeten, bewaakt en beheerst.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3299
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3299
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3296
