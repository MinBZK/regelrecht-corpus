  - number: '16'
    text: |-
      1 Bij de berekening van de aangepaste solvabiliteit van een in een niet-Europese herverzekeraar, levensverzekeraar
      of schadeverzekeraar deelnemende Nederlandse herverzekeraar, levensverzekeraar of schadeverzekeraar, wordt de niet-
      Europese herverzekeraar, levensverzekeraar of schadeverzekeraar voor de berekening behandeld als een verbonden
      Nederlandse herverzekeraar, levensverzekeraar of schadeverzekeraar.

      2 Indien de niet-Europese herverzekeraar, levensverzekeraar of schadeverzekeraar, bedoeld in het eerste lid, in
      de staat van zijn zetel een vergunning heeft en beschikt over een solvabiliteitsmarge, die ten minste overeenkomt
      met de ingevolge de [artikelen 3:53, derde lid][ref1], en [3:57, tweede lid, van de wet][ref2] voorgeschreven
      solvabiliteit, kan de Nederlandsche Bank besluiten dat de verzekeraar, bedoeld in [artikel 6][ref3], bij de
      berekening met betrekking tot die herverzekeraar, levensverzekeraar of schadeverzekeraar rekening houdt met
      het minimumbedrag aan solvabiliteitsmarge en met de voor het nakomen van dat minimumbedrag in aanmerking
      komende vermogensbestanddelen zoals die zijn voorgeschreven door de staat waar de niet-Europese herverzekeraar,
      levensverzekeraar of schadeverzekeraar zijn zetel heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel353
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel357
      [ref3]: https://wetten.overheid.nl/BWBR0020415#Artikel6
    url: https://wetten.overheid.nl/BWBR0020415/2009-01-01#Artikel16
