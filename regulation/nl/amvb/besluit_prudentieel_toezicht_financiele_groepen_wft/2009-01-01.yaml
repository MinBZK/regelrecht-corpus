  - number: '10'
    text: |-
      Een verzekeraar als bedoeld in [artikel 6][ref1] betrekt andere dan de in [artikel 9][ref2] bedoelde, voor de
      berekening van de solvabiliteitsmarge van in [dat artikel][ref3] bedoelde verbonden Nederlandse en Europese
      herverzekeraars, levensverzekeraars en schadeverzekeraars in aanmerking komende vermogensbestanddelen die naar het
      oordeel van de Nederlandsche Bank niet beschikbaar zijn ter dekking van het minimumbedrag aan solvabiliteitsmarge
      van de verzekeraar, slechts in de berekening voorzover zij in aanmerking zijn genomen voor de dekking van het
      minimumbedrag aan solvabiliteitsmarge van die verbonden herverzekeraars, levensverzekeraars of schadeverzekeraars.


      [ref1]: https://wetten.overheid.nl/BWBR0020415#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020415#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0020415#Artikel9
