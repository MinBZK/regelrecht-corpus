  - number: '9'
    text: |-
      1 Onverminderd [artikel 8][ref1] betrekt een verzekeraar als bedoeld in [artikel 6][ref2] meerwaarden op
      grond van winstverwachtingen die gegenereerd worden in met hem verbonden Nederlandse, Europese of niet-
      Europese herverzekeraars in de activiteit levensherverzekering, of Nederlandse, Europese of niet-Europese
      levensverzekeraars, alsmede het geplaatste maar niet-gestorte aandelenkapitaal van met hem verbonden Nederlandse
      en Europese herverzekeraars, levensverzekeraars en schadeverzekeraars alleen in de berekening voorzover die in
      aanmerking zijn genomen voor de dekking van het minimumbedrag aan solvabiliteitsmarge van die verbonden Nederlandse
      en Europese herverzekeraars, levensverzekeraars en schadeverzekeraars.

      2 De verzekeraar betrekt geplaatst maar niet-gestort aandelenkapitaal dat een potentiële verplichting van zijn
      zijde vormt, niet in de berekening.

      3 De verzekeraar betrekt zijn geplaatst maar niet-gestort aandelenkapitaal dat een potentiële verplichting van
      de zijde van een met hem verbonden Nederlandse of Europese herverzekeraar, levensverzekeraar of schadeverzekeraar
      vormt, niet in de berekening.

      4 De verzekeraar betrekt geplaatst maar niet-gestort aandelenkapitaal van een verbonden Nederlandse of Europese
      herverzekeraar, levensverzekeraar of schadeverzekeraar dat een potentiële verplichting van de zijde van een andere
      met hem verbonden onderneming vormt, niet in de berekening.


      [ref1]: https://wetten.overheid.nl/BWBR0020415#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0020415#Artikel6
    url: https://wetten.overheid.nl/BWBR0020415/2009-01-01#Artikel9
