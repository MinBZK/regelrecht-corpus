articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder wet: [Wet op het financieel toezicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020415/2009-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '2'
    text: De in dit besluit bedoelde financiële ondernemingen passen de in dit besluit beschreven methoden consistent toe.
    url: https://wetten.overheid.nl/BWBR0020415/2009-01-01#Artikel2
  - number: '3'
    text: |-
      1 Een onderneming is van te verwaarlozen betekenis als bedoeld in
      [artikel 3:270, eerste lid, onderdeel b, van de wet][ref1], indien het balanstotaal van die onderneming, tezamen
      met dat van andere bij het toezicht op de betrokken beleggingsonderneming of kredietinstelling te betrekken
      ondernemingen van te verwaarlozen betekenis, lager is dan het laagste van de twee volgende bedragen:

      a. € 10.000.000; of

      b. één procent van het balanstotaal van de moederonderneming of van de onderneming die de deelneming houdt.

      2 In dit artikel wordt onder onderneming verstaan een beleggingsonderneming, een financiële instelling, een
      kredietinstelling of een onderneming die nevendiensten verricht, en die dochteronderneming is van een Nederlandse
      beleggingsonderneming of Nederlandse kredietinstelling of waarin een deelneming wordt gehouden door die Nederlandse
      beleggingsonderneming of Nederlandse kredietinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3270
    url: https://wetten.overheid.nl/BWBR0020415/2009-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3:270
  - number: '4'
    text: |-
      1 Een beleggingsonderneming of kredietinstelling als bedoeld in [artikel 3:280, eerste lid, van de wet][ref1]
      dient de in het [derde lid van dat artikel][ref2] bedoelde rapportage eenmaal per jaar bij de Nederlandsche
      Bank in, tenzij de Nederlandsche Bank, indien de solvabiliteit door ontwikkelingen bij de beleggingsonderneming
      of kredietinstelling in het gedrang is of zou kunnen komen, besluit dat er gerapporteerd wordt met een hogere
      frequentie.

      2 Onder significante intragroepsovereenkomsten of -posities als bedoeld in
      [artikel 3:280, derde lid, van de wet][ref3] worden verstaan overeenkomsten of posities die een door de
      Nederlandsche Bank vast te stellen drempel, gerelateerd aan de aanwezige solvabiliteit, te boven gaan. Alvorens de
      drempel vast te stellen, voert de Nederlandsche Bank overleg met de betrokken Nederlandse beleggingsonderneming of
      Nederlandse kredietinstelling. De Nederlandsche Bank stelt geen kwalitatieve of andere kwantitatieve drempels vast.

      3 De Nederlandsche Bank stelt regels met betrekking tot de categorieën overeenkomsten en posities die in de
      rapportage worden betrokken en de rapportage.

      4 De in het derde lid bedoelde regels hebben uitsluitend betrekking op:

      a. het model van de staat;

      b. de reikwijdte van toepassing van de staat en de mate van detaillering van de in te vullen gegevens; deze
      omvatten geen uitbreiding of nadere rubricering van de staat;

      c. de waardering van de posten overeenkomstig de waarderingsmethoden die de financiële onderneming in haar
      jaarrekening toepast;

      d. de te hanteren valuta en rekeneenheid;

      e. de afronding; en

      f. de termijn waarbinnen de rapportage wordt verstrekt; met dien verstande dat deze
      niet korter is dan noodzakelijk voor de uitoefening van het toezicht op de naleving van
      [hoofdstuk 6 van het Deel Prudentieel toezicht financiële ondernemingen van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3280
