  - number: '15'
    text: |-
      Een verzekeraar als bedoeld in [artikel 6][ref1] die door middel van een tussenliggende verzekeringsholding
      deelneemt in een Nederlandse, Europese of niet-Europese herverzekeraar, levensverzekeraar of schadeverzekeraar
      betrekt bij de berekening van de aangepaste solvabiliteit deze tussenliggende verzekeringsholding en stelt
      daarbij het minimumbedrag aan solvabiliteitsmarge van de tussenliggende verzekeringsholding gelijk aan
      nul. Daarbij is van overeenkomstige toepassing hetgeen ingevolge de [artikelen 3:53, derde lid][ref2], en
      [3:57, tweede lid, van de wet][ref3] is bepaald met betrekking tot de toegestane vermogensbestanddelen voor het
      minimumbedrag aan solvabiliteitsmarge van een Nederlandse herverzekeraar, levensverzekeraar of schadeverzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0020415#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel353
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel357
