  - number: '21'
    text: |-
      1 Een herverzekeraar, levensverzekeraar of schadeverzekeraar als bedoeld in
      [artikel 3:286, eerste lid, van de wet][ref1] berekent de aangepaste solvabiliteit overeenkomstig
      [afdeling 3.1][ref2].

      2 De [artikelen 13, tweede en derde lid][ref3], en [19][ref4] zijn van overeenkomstige toepassing.

      3 Indien sprake is van middellijke deelnemingen in de verzekeraar, kan de Nederlandsche Bank besluiten
      dat de verzekeraar slechts de uiteindelijke moederonderneming van de herverzekeraar, levensverzekeraar
      of schadeverzekeraar die als verzekeringsholding of niet-Europese herverzekeraar, levensverzekeraar of
      schadeverzekeraar is aan te merken, in de berekening betrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3286
      [ref2]: https://wetten.overheid.nl/BWBR0020415#Hoofdstuk3
