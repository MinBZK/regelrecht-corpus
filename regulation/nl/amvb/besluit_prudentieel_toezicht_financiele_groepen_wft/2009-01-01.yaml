  - number: '22'
    text: |-
      1 De verzekeraar, bedoeld in [artikel 21][ref1], past bij de berekening van de aangepaste solvabiliteit ten
      aanzien van een in hem deelnemende verzekeringsholding of niet-Europese herverzekeraar, levensverzekeraar of
      schadeverzekeraar, de [artikelen 6 tot en met 20][ref2] toe.

      2 Voor deze berekening worden de ondernemingen, bedoeld in het eerste lid, beschouwd als een herverzekeraar,
      levensverzekeraar of schadeverzekeraar waarvoor geldt:

      a. dat het minimumbedrag aan solvabiliteitsmarge gelijk aan nul is indien het een verzekeringsholding betreft; en

      b. dat het minimumbedrag aan solvabiliteitsmarge wordt berekend overeenkomstig [artikel 16][ref3] indien het een
      niet-Europese herverzekeraar, levensverzekeraar of schadeverzekeraar betreft.

      3 Ten aanzien van de ondernemingen, bedoeld in het eerste lid, is hetgeen ingevolge de
      [artikelen 3:53, derde lid][ref4], en [3:57, tweede lid, van de wet][ref5] is bepaald met betrekking tot de
      vermogensbestanddelen die in aanmerking komen voor de solvabiliteitsmarge, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020415#Artikel21
