  - number: 4a
    text: |-
      Dit hoofdstuk is uitsluitend van toepassing op verzekeraars met zetel in Nederland die onder het toepassingsgebied
      van de richtlijn solvabiliteit II vallen.
    url: https://wetten.overheid.nl/BWBR0020415/2016-01-01#Artikel4a
  - number: 4b
    text: |-
      1 Een deelnemende verzekeraar als bedoeld in [artikel 3:288a, eerste lid, van de wet][ref1] of een
      verzekeringsholding of gemengde financiële holding als bedoeld in artikel 3:288a, tweede lid, van de wet
      voert de berekening, waaruit moet blijken dat de solvabiliteit van de verzekeringsrichtlijngroep waarvan de
      verzekeraar of holding deel uitmaakt voldoet aan artikel 3:288a, eerste onderscheidenlijk tweede lid, ten
      minste eenmaal per jaar uit. De verzekeraar of holding voert de berekening onverwijld opnieuw uit indien het
      risicoprofiel van de groep duidelijk afwijkt van de aannames die ten grondslag lagen aan de laatste berekening,
      of indien de groepstoezichthouder daarom verzoekt vanwege aanwijzingen dat het risicoprofiel sinds die laatste
      berekening duidelijk is veranderd. De verzekeraar of holding meldt de uitkomst van de herberekening aan de
      groepstoezichthouder.

      2 De verzekeraar of holding maakt voor de berekening, bedoeld in het eerste lid, gebruik van methode 1
      (standaardmethode op basis van consolidatie van jaarrekeningen), bedoeld in artikel 230 van de richtlijn
      solvabiliteit II, tenzij de groepstoezichthouder het gebruik van methode 2 (alternatieve methode op basis van
      aftrek en aggregatie), bedoeld in artikel 233 van de richtlijn solvabiliteit II, of een combinatie van methode 1 en
      methode 2 voorschrijft vanwege het feit dat de uitsluitende toepassing van methode 1 ongepast zou zijn.

      3 De verzekeraar of holding kan voor de berekening van het solvabiliteitskapitaalvereiste van de
      verzekeringsrichtlijngroep slechts gebruik maken van een intern model, indien daartoe overeenkomstig artikel 231,
      eerste lid, van de richtlijn solvabiliteit II bij de groepstoezichthouder een aanvraag is ingediend, en de aanvraag
      overeenkomstig dat artikel is ingewilligd.

      4 Indien de Nederlandsche Bank groepstoezichthouder is, neemt zij een besluit over de aanvraag, bedoeld in het
      derde lid, overeenkomstig artikel 231, eerste tot en met zesde lid, van de richtlijn solvabiliteit II en met
      inachtneming van de artikelen 343 tot en met 345, 348 en 349 van de verordening solvabiliteit II.

      5 De in het eerste lid bedoelde berekening geschiedt met inachtneming van titel II, hoofdstukken I en II, van de
      verordening solvabiliteit II. Daarbij kan gebruik worden gemaakt van de optie, bedoeld in artikel 227, eerste lid,
      tweede alinea, van de richtlijn solvabiliteit II.

      6 Op de in het eerste lid bedoelde berekening zijn de overgangsmaatregelen, bedoeld in artikel 308 ter, zestiende
      lid en zeventiende lid, eerste en tweede alinea, van de richtlijn solvabiliteit II, van toepassing dan wel van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3288a
