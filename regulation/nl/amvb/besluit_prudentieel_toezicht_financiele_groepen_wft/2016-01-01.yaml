  - number: '26'
    text: |-
      1 Een onderneming als bedoeld in [artikel 3:297, eerste lid, van de wet][ref1] verstrekt de in [dat artikel][ref2]
      bedoelde rapportage met betrekking tot de significante risicoconcentraties eenmaal per jaar. De Nederlandsche Bank
      kan, indien de omstandigheden van een bepaalde onderneming daar aanleiding toe geven, besluiten dat die onderneming
      rapporteert met een hogere frequentie.

      2 Onder significante risicoconcentraties worden verstaan risicoconcentraties, welke een door de Nederlandsche Bank,
      na overleg met de andere relevante toezichthoudende instanties en het financiële conglomeraat, vast te stellen
      passende drempel, gerelateerd aan het reglementaire eigen vermogen of de technische voorzieningen, te boven gaan.

      3 De Nederlandsche Bank bepaalt, na overleg met de andere toezichthoudende instanties, welke categorieën risico’s
      van de gereglementeerde entiteiten in een bepaald financieel conglomeraat worden gerapporteerd op basis van
      [artikel 3:297, eerste lid, van de wet][ref3]. Daarbij houdt de Nederlandsche Bank rekening met de specifieke
      groeps- en risicobeheerstructuur van het financiële conglomeraat.

      4 De Nederlandsche Bank stelt, met inachtneming van het bepaalde ingevolge het
      [Deel Prudentieel toezicht financiële ondernemingen van de wet][ref4], alsmede met inachtneming van
      [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref5] en de internationale jaarrekeningstandaarden, nadere regels
      met betrekking tot de rapportage van de risicoconcentraties. [Artikel 4, vierde lid][ref6], is van toepassing.

      5 De in het eerste lid bedoelde onderneming verstrekt bovendien eenmaal per jaar op een na overleg met de
      Nederlandsche Bank door de onderneming te bepalen tijdstip de informatie die aan het groepsbestuur van het
      financiële conglomeraat wordt verstrekt over risicoconcentraties en die is opgesteld met gebruikmaking van de
      procedures, bedoeld in [artikel 28, eerste lid, onderdeel b][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3297
