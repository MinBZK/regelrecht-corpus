  - number: '7'
    text: |-
      1 Een verzekeraar als bedoeld in [artikel 6][ref1] past voor de berekening van de aangepaste solvabiliteit een van
      de in [bijlage A][ref2] bij dit besluit opgenomen berekeningsmethoden toe. Hij betrekt bij die berekening iedere
      rechtstreeks of middellijk met hem verbonden verzekeraar.

      2 De Nederlandsche Bank kan besluiten dat een verzekeraar geen aangepaste solvabiliteit behoeft te berekenen,
      indien:

      a. de verzekeraar een verbonden verzekeraar is van een andere Nederlandse verzekeraar en de verzekeraar in
      aanmerking wordt genomen bij de voor die andere verzekeraar uitgevoerde berekening; of

      b. de verzekeraar dezelfde moederonderneming heeft als een andere Nederlandse verzekeraar en in aanmerking wordt
      genomen bij de voor die andere verzekeraar uitgevoerde berekening.

      3 De Nederlandsche Bank neemt slechts een besluit als bedoeld in het tweede lid, indien de vermogensbestanddelen
      die in aanmerking komen voor de berekening van het eigen vermogen van de bij de berekening betrokken verzekeraars
      adequaat over de in dat lid bedoelde ondernemingen verdeeld zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020415#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020415
    url: https://wetten.overheid.nl/BWBR0020415/2016-01-01#Artikel7
