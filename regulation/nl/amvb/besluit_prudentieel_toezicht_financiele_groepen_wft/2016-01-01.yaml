        artikel: 3:288a
  - number: 4c
    text: |-
      1 Indien het solvabiliteitskapitaalvereiste van een Nederlandse herverzekeraar, levensverzekeraar of
      schadeverzekeraar, die onderdeel is van een verzekeringsrichtlijngroep, wordt berekend op basis van een
      overeenkomstig artikel 231 van de richtlijn solvabiliteit II op groepsniveau goedgekeurd intern model, en de
      Nederlandsche Bank van oordeel is dat de omstandigheden, bedoeld artikel 238, tweede lid, van de richtlijn
      solvabiliteit II zich voordoen, kan zij een kapitaalopslag toepassen of eisen dat de verzekeraar zijn
      solvabiliteitskapitaalvereiste berekent op basis van de standaardformule.

      2 Indien een verzekeraar zijn solvabiliteitskapitaalvereiste berekent op basis van de standaardformule en de
      Nederlandsche Bank van oordeel is dat de omstandigheden, bedoeld in artikel 238, derde lid, van de richtlijn
      solvabiliteit II zich voordoen, kan zij een onderset van parameters, genoemd in dat lid, die kenmerkend zijn voor
      die verzekeraar voorschrijven of in de in artikel 37 van de richtlijn bedoelde gevallen een kapitaalopslag op het
      solvabiliteitskapitaalvereiste toepassen.
    url: https://wetten.overheid.nl/BWBR0020415/2016-01-01#Artikel4c
  - number: 4d
    text: |-
      De Nederlandsche Bank beoordeelt of sprake is van uitzonderlijke omstandigheden die aanleiding geven tot
      het opleggen van een kapitaalopslag op het geconsolideerde solvabiliteitskapitaalvereiste als bedoeld in
      [artikel 3:288b, tweede lid][ref1], aan de hand van artikel 232 van de richtlijn solvabiliteit II, met inachtneming
      van titel I, hoofdstuk X, afdeling 1, van de verordening solvabiliteit II, en bepaalt de hoogte van de op te leggen
      kapitaalopslag aan de hand van artikel 37, tweede lid, van de richtlijn, met inachtneming van titel I, hoofdstuk X,
      afdeling 2, van de verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3288b
    url: https://wetten.overheid.nl/BWBR0020415/2016-01-01#Artikel4d
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3:288b
  - number: 4e
    text: |-
      1 De artikelen 238 en 239 van de richtlijn solvabiliteit II inzake de berekening van het
      solvabiliteitskapitaalvereiste onderscheidenlijk de niet-naleving van dat vereiste zijn van toepassing op elke
      Nederlandse herverzekeraar, levensverzekeraar of schadeverzekeraar die de dochteronderneming is van een andere
      verzekeraar indien is voldaan aan de voorwaarden, bedoeld in artikel 236, onderdelen a tot en met d, van genoemde
      richtlijn en de moederonderneming een aanvraag tot toepassing van de artikelen 238 en 239 van de richtlijn heeft
      gedaan en deze aanvraag is ingewilligd overeenkomstig de procedure van artikel 237 van die richtlijn.

      2 De moederonderneming informeert de groepstoezichthouder en de Nederlandsche Bank indien niet langer aan de
      voorwaarden, bedoeld in artikel 236, eerste lid, onderdelen b tot en met d, van de richtlijn solvabiliteit II is
      voldaan. In dat geval, of indien de groepstoezichthouder daarom verzoekt op grond van een verrichte verificatie,
      presenteert de moederonderneming een plan om binnen een passende termijn opnieuw aan al die voorwaarden te voldoen.

      3 De toepassing van de artikelen 238 en 239 van de richtlijn solvabiliteit II eindigt overeenkomstig artikel 240,
      eerste lid, van de richtlijn, indien niet langer aan alle voorwaarden is voldaan en de groepstoezichthouder heeft
      vastgesteld dat het in het tweede lid bedoelde plan ontoereikend is of niet binnen de gestelde termijn wordt
      uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0020415/2016-01-01#Artikel4e
  - number: 4f
    text: |-
      1 Een verzekeraar of holding als bedoeld in [artikel 4b][ref1] die deel uitmaakt van een verzekeringsrichtlijngroep
      waarvoor de Nederlandsche Bank als groepstoezichthouder is aangewezen, dient bij de Nederlandsche Bank binnen
      de ingevolge artikel 373, onderscheidenlijk artikel 375, tweede lid, van de verordening solvabiliteit II
      voorgeschreven termijnen toezichtrapportages in met de volgende informatie:

      a. de toezichtinformatie, bedoeld in artikel 372, eerste lid, van de verordening solvabiliteit II;

      b. de aanvullende toezichtinformatie, bedoeld in artikel 372, tweede lid, van de verordening solvabiliteit II;

      c. de toezichtinformatie, bedoeld in de artikelen 376 en 377 van de verordening solvabiliteit II;

      d. andere voor toezichtdoeleinden benodigde periodieke informatie als bedoeld in artikel 35, eerste lid, van de
      richtlijn solvabiliteit II.

      2 De Nederlandsche Bank stelt, met inachtneming van titel II, hoofdstuk VI, van de verordening solvabiliteit II,
      regels met betrekking tot de rapportages, bedoeld in het eerste lid.

      3 De Nederlandsche Bank kan, met inachtneming van artikel 35, zesde tot en met achtste lid, van de richtlijn
      solvabiliteit II, ontheffing verlenen van:

      a. de verplichting periodieke rapportagestaten vaker dan eenmaal per jaar te verstrekken;

      b. itemgewijze rapportageverplichtingen.


