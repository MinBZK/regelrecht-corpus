  - number: '8'
    text: |-
      1 Een verzekeraar als bedoeld in [artikel 6][ref1] gebruikt de vermogensbestanddelen die in aanmerking worden
      genomen bij de berekening van het eigen vermogen niet meerdere malen voor de verschillende verzekeraars die bij de
      berekening betrokken zijn.

      2 De verzekeraar betrekt bij de berekening van zijn aangepaste solvabiliteit niet de waarde van de activa die
      dienen ter dekking van het solvabiliteitskapitaalvereiste van andere rechtstreeks of middellijk met hem verbonden
      verzekeraars.

      3 De verzekeraar betrekt bij de berekening van de aangepaste solvabiliteit geen vermogensbestanddelen die
      afkomstig zijn van de wederzijdse financiering tussen hem en andere rechtstreeks of middellijk met hem verbonden
      ondernemingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020415#Artikel6
