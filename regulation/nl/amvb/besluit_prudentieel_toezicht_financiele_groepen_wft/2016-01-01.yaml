  - number: '6'
    text: |-
      1 Een verzekeraar als bedoeld in [artikel 3:281b, eerste lid, van de wet][ref1] berekent de aangepaste
      solvabiliteit overeenkomstig de in deze afdeling gestelde regels.

      2 De verzekeraar rapporteert de aangepaste solvabiliteit eenmaal per jaar, tenzij de Nederlandsche Bank, indien de
      aangepaste solvabiliteit door ontwikkelingen bij de verzekeraar in het gedrang is of zou kunnen komen, besluit dat
      er gerapporteerd moet worden met een hogere frequentie.

      3 De Nederlandsche Bank stelt regels met betrekking tot de rapportage, bedoeld in het tweede lid.
      [Artikel 4, vierde lid][ref2], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3281b
      [ref2]: https://wetten.overheid.nl/BWBR0020415#Artikel4
