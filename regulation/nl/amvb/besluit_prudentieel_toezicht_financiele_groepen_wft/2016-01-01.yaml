  - number: '5'
    text: |-
      1 Een verzekeraar als bedoeld in de aanhef van [artikel 3:281a, eerste lid, van de wet][ref1] dient de in
      het tweede lid van dat artikel bedoelde rapportage eenmaal per jaar in. De Nederlandsche Bank kan, indien de
      solvabiliteit door ontwikkelingen bij een verzekeraar in het gedrang is of zou kunnen komen, besluiten dat de
      verzekeraar rapporteert met een hogere frequentie.

      2 Onder significante intragroepsovereenkomsten of -posities als bedoeld in
      [artikel 3:281a, tweede lid, van de wet][ref2] worden verstaan overeenkomsten of posities die een door de
      Nederlandsche Bank vast te stellen drempel, gerelateerd aan de vereiste solvabiliteit, te boven gaan. Alvorens de
      drempel vast te stellen, voert de Nederlandsche Bank overleg met de betrokken verzekeraar. De Nederlandsche Bank
      stelt geen kwalitatieve of andere kwantitatieve drempels vast.

      3 De Nederlandsche Bank stelt regels met betrekking tot de categorieën overeenkomsten en posities die in de
      rapportage worden betrokken en de rapportage. [Artikel 4, vierde lid][ref3], is van toepassing.


