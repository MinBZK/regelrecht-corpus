preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Infrastructuur en Milieu van 6 oktober 2014, nr. IenM/BSK-2014/201301,
    Hoofddirectie Bestuurlijke en Juridische Zaken, gedaan mede namens Onze Minister van Defensie;

    Gelet op uitvoeringsverordening (EU) nr. 923/2012 van de Commissie van 26 september 2012 tot vaststelling van
    gemeenschappelijke luchtverkeersregels en operationele bepalingen betreffende luchtvaartnavigatiediensten en
    -procedures en tot wijziging van uitvoeringsverordening (EU) nr. 1035/2011 en verordeningen (EG) nr. 1265/2007,
    (EG) 1794/2006, (EG) nr. 730/2006, (EG) nr. 1033/2006 en (EU) nr. 255/2010 (PbEU 2012, L281);

    Gelet op de artikelen 1.2, tweede en derde lid, 1.5, 5.5, eerste en tweede lid, 5.11, eerste lid, en 5.12, tweede
    lid, van de Wet luchtvaart;

    De Afdeling advisering van de Raad van State gehoord (advies van 28 november 2014, nr. W14.14.0359/IV);

    Gezien het nader rapport van de Staatssecretaris van Infrastructuur en Milieu van 4 december 2014, nr. IenM/BSK-
    2014/266421, Hoofddirectie Bestuurlijke en Juridische Zaken, gedaan mede namens Onze Minister van Defensie;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *algemeen luchtverkeersleidingsgebied:*
      gecontroleerd luchtruim dat zich verticaal uitstrekt vanaf een gespecificeerde grens boven het aardoppervlak;
        - *daglichtperiode:* het gedeelte van het etmaal tussen vijftien minuten voor zonsopgang en vijftien minuten na
      zonsondergang zoals geldt voor de positie 52°00’ N en 05°00’ O op zeeniveau;
        - *gecontroleerde luchthaven:* luchthaven waarop luchtverkeersleidingsdiensten worden verleend aan het
      luchthavenverkeer, ongeacht of er al dan niet een plaatselijk luchtverkeersleidingsgebied bestaat;
        - *gecontroleerde vlucht:* vlucht waarvoor een luchtverkeersleidingsklaring is vereist;
        - *luchthavenverkeer:* alle verkeer op het landingsterrein van een luchthaven en alle luchtvaartuigen die in de
      nabijheid van een luchthaven vliegen, waaronder, zij het niet uitsluitend, luchtvaartuigen worden bedoeld die een
      luchtverkeerscircuit binnenvliegen of verlaten;
        - *luchtverkeersroute:* een bepaalde route, vastgesteld om de verkeersstroom te kanaliseren, waar dat nodig is voor
      het verlenen van luchtverkeersdiensten;
        - *meldingspunt:* specifieke geografische locatie met betrekking tot welke de positie van een luchtvaartuig kan
      worden gemeld;
        - *OAT:* luchtverkeer dat niet vliegt volgens de regels en procedures die door de Internationale
      Burgerluchtvaartorganisatie zijn opgesteld (Operational Air Traffic);
        - *Onze Minister:* Onze Minister van Infrastructuur en Waterstaat wat het burgerluchtverkeer en de algemene
      verkeersveiligheid in de lucht betreft en Onze Minister van Defensie wat het militaire luchtverkeer betreft;
        - *plaatselijk luchtverkeersleidingsgebied:* gecontroleerd luchtruim dat zich vanaf het aardoppervlak verticaal
      uitstrekt tot aan een vastgestelde bovengrens (Control Zone – CTR);
        - *schermzweeftoestel:* ongemotoriseerd schermvliegtuig, zijnde een zweeftoestel zonder starre hoofdstructuur dat
      kan worden gedragen en slechts kan worden gestart en geland door gebruik te maken van de benen van de bestuurder;
        - *transponder:* radarbeantwoordingssysteem met informatie over de identiteit en eventueel de hoogte van het
      luchtvaartuig;
        - *valschermsprong:* sprong met scherm dat dient om de daalsnelheid van een persoon zodanig te beperken dat deze
      veilig het aardoppervlak kan bereiken;
        - *Verdrag van Chicago:* op 7 december 1944 te Chicago gesloten Verdrag inzake de internationale burgerluchtvaart
      (Trb. 1973, 109);
        - *verordening (EU) nr. 923/2012:* uitvoeringsverordening (EU) nr. 923/2012 van de Commissie van 26 september
      2012 tot vaststelling van gemeenschappelijke luchtverkeersregels en operationele bepalingen betreffende
      luchtvaartnavigatiediensten en -procedures en tot wijziging van uitvoeringsverordening (EU) nr. 1035/2011 en
      verordeningen (EG) nr. 1265/2007, (EG) 1794/2006, (EG) nr. 730/2006, (EG) nr. 1033/2006 en (EU) nr. 255/2010 (PbEU
      2012, L 281);
        - *vlieghoogte:* hoogte van een zich in de lucht bevindend luchtvaartuig uitgedrukt in: 1°. hoogte boven het
      aardoppervlak; 2°. hoogte boven gemiddeld zeeniveau; of 3°. vliegniveau;
        - *zeilvliegtuig:* zweeftoestel met een starre hoofdstructuur, dat kan worden gedragen en slechts gestart en geland
      kan worden door gebruik te maken van de benen van de bestuurder;
        - *zichtweersomstandigheden:* meteorologische omstandigheden uitgedrukt in termen van zicht, afstand tot de wolken
      en wolkenbasis, die gelijk zijn aan of beter zijn dan de voorgeschreven minima
        - *zweefvliegtuig:* zweeftoestel met vaste vleugel, zijnde een luchtvaartuig zwaarder dan lucht, dat hoofdzakelijk
      in de lucht kan worden gehouden door aërodynamische reactiekrachten waarvan de vrije vlucht niet afhankelijk is van
      een motor.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel1
  - number: '2.1'
    text: |-
      Verordening (EU) nr. 923/2012 is van overeenkomstige toepassing op militair luchtverkeer dat wordt aangemerkt als
      OAT.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel2
  - number: '2.2'
    text: |-
      Onze Minister van Defensie kan vrijstelling of ontheffing verlenen van de bepalingen van verordening (EU)
      nr. 923/2012 voor zover het militair luchtverkeer betreft dat wordt aangemerkt als OAT. Aan de vrijstelling of
      ontheffing kunnen voorschriften worden verbonden. De vrijstelling of ontheffing kan onder beperkingen worden
      verleend.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel2
  - number: '3.1'
    text: |-
      Bij regeling van Onze Minister kan vrijstelling worden verleend van de bepalingen van verordening (EU) nr. 923/2012
      voor activiteiten van openbaar belang als bedoeld in artikel 4 van die verordening en de training die nodig is om
      deze activiteiten veilig te kunnen uitvoeren. Aan de vrijstelling kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel3
  - number: '3.2'
    text: Het is verboden in strijd te handelen met de voorschriften, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel3
  - number: '4'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld ten aanzien van de deelname aan het luchtverkeer van
      luchtvaartuigen die naar hun aard niet kunnen voldoen aan de bepalingen van verordening (EU) nr. 923/2012, met dien
      verstande dat deze in overeenstemming zijn met de voorwaarden van artikel 71 van de basisverordening.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel4
  - number: 4a
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld ten aanzien van de deelname aan het luchtverkeer van
      luchtvaartuigen die niet onder het toepassingsgebied van verordening (EU) nr. 923/2012 vallen.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel4a
  - number: '5.1'
    text: 'Bij regeling van Onze Minister worden in het vluchtinformatiegebied Amsterdam aangewezen:'
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel5
  - number: 5.1.a
    text: algemene luchtverkeersleidingsgebieden;
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel5
  - number: 5.1.b
    text: plaatselijke luchtverkeersleidingsgebieden, en
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel5
  - number: 5.1.c
    text: gecontroleerde luchthavens.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel5
  - number: '5.2'
    text: |-
      Onze Minister stelt voor elk luchtverkeersdienstverleningsgebied de luchtruimclassificatie, bedoeld in verordening
      (EU) nr. 923/2012, deel 6, vast.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel5
  - number: '5.3'
    text: 'Bij regeling van Onze Minister wordt bepaald:'
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel5
  - number: 5.3.a
    text: door welke verleners van luchtverkeersdiensten;
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel5
  - number: 5.3.b
    text: in welke gebieden binnen het vluchtinformatiegebied Amsterdam, en
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel5
  - number: 5.3.c
    text: op welke gecontroleerde luchthavens,
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel5
  - number: '6'
    text: 'Bij regeling van Onze Minister worden regels gegeven voor:'
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel6
  - number: 6.a
    text: de wijze waarop luchtverkeersdiensten worden verleend;
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel6
  - number: 6.b
    text: de wijze waarop de luchtvaarttelecommunicatie wordt verzorgd;
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel6
  - number: 6.c
    text: de wijze waarop het verstrekken van gegevens en luchtvaartinlichtingen tijdens de vlucht wordt verzorgd; en
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel6
  - number: 6.d
    text: de wijze waarop diensten voor het ontwerpen van vluchtprocedures worden verleend.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel6
  - number: '7.1'
    text: |-
      Bij regeling van Onze Minister worden in het vluchtinformatiegebied Amsterdam luchtverkeersroutes en -procedures,
      waaronder mede zijn begrepen naderings-, vertrek- en wachtprocedures, alsmede luchtverkeerspatronen voor
      luchthavenverkeer vastgesteld.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel7
  - number: '7.2'
    text: |-
      De gezagvoerder voert een vlucht uit volgens de bij regeling van Onze Minister vastgestelde luchtverkeersroutes
      en -procedures alsmede luchtverkeerspatronen voor luchthavenverkeer tenzij door een verlener van
      luchtverkeersleidingsdiensten een anders luidende opdracht is gegeven.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel7
  - number: '8.1'
    text: |-
      Bij regeling van Onze Minister kunnen delen van het luchtruim met vastgestelde afmetingen worden benoemd tot Radio
      Mandatory Zones waarbinnen het meenemen en gebruiken van radioapparatuur verplicht is. Onze Minister kan in die
      regeling informatie benoemen die in aanvulling op deel 6 van de bijlage bij verordening (EU) nr. 923/212 bij het
      binnenvliegen van een dergelijk deel van het luchtruim wordt gemeld.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel8
  - number: '8.2'
    text: |-
      Bij regeling van Onze Minister kunnen delen van het luchtruim met vastgestelde afmetingen worden benoemd tot
      Transponder Mandatory Zones waarbinnen het meenemen en gebruiken van drukhoogterapporterende transponders verplicht
      is.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel8
  - number: '8.3'
    text: |-
      Bij regeling van Onze Minister kunnen delen van het luchtruim rondom een luchthaven met vastgestelde afmetingen
      worden aangewezen als aerodrome traffic zones ter bescherming van het luchthavenluchtverkeer.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel8
  - number: '8.4'
    text: |-
      Bij regeling van Onze Minister kunnen delen van het luchtruim rondom boor- of productieplatforms met vastgestelde
      afmetingen worden aangewezen als helicopter protection zones of helicopter traffic zones ter bescherming van
      helikopters die manoeuvres uitvoeren.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel8
  - number: '9'
    text: |-
      Onze Minister kan ter bescherming van het luchtverkeer ten opzichte van bepaalde soorten luchtverkeer of van
      bijzondere luchtverkeersactiviteiten delen van het vluchtinformatiegebied Amsterdam aanwijzen waarbinnen het
      luchtverkeer tijdelijk wordt beperkt overeenkomstig door Onze Minister te stellen voorwaarden. Het is verboden in
      strijd te handelen met de voorwaarden.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel9
  - number: '10.1'
    text: Het is verboden voorwerpen of stoffen af te werpen of te sproeien tijdens de vlucht.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel10
  - number: '10.2'
    text: 'Het verbod, bedoeld in het eerste lid, is niet van toepassing op het afwerpen of sproeien van:'
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel10
  - number: 10.2.a
    text: los zand;
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel10
  - number: 10.2.b
    text: water;
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel10
  - number: 10.2.c
    text: stoffen ter bevordering of ter bescherming van het milieu, dan wel de land-, tuin- of bosbouw;
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel10
  - number: 10.2.d
    text: voorwerpen waarvan de massa niet meer is dan 200 gram per voorwerp;
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel10
  - number: 10.2.e
    text: voorwerpen en stoffen voor militaire doeleinden of uit militair luchtverkeer dat als OAT wordt aangemerkt.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel10
  - number: '10.3'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent het afwerpen of sproeien van de stoffen
      en voorwerpen, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel10
  - number: '10.4'
    text: |-
      Onverminderd het tweede lid kan Onze Minister vrijstelling of ontheffing verlenen van het verbod, bedoeld in het
      eerste lid. Aan de vrijstelling of ontheffing kunnen voorschriften worden verbonden. De vrijstelling of ontheffing
      kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel10
  - number: '10.5'
    text: Het is verboden in strijd te handelen met de voorschriften, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel10
  - number: '11.1'
    text: Het is verboden een luchtvaartuig of ander voorwerp tijdens de vlucht te slepen.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel11
  - number: '11.2'
    text: 'Het verbod, bedoeld in het eerste lid, is niet van toepassing op de vluchten waarbij:'
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel11
  - number: 11.2.a
    text: een zeilvliegtuig of zweefvliegtuig wordt gesleept;
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel11
  - number: 11.2.b
    text: een sleepnet wordt gesleept;
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel11
  - number: 11.2.c
    text: voor militaire doeleinden wordt gesleept.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel11
  - number: '11.3'
    text: Bij regeling van Onze Minister worden regels gesteld ten aanzien van de vluchten, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel11
  - number: '11.4'
    text: |-
      Onverminderd het tweede lid kan Onze Minister vrijstelling of ontheffing verlenen van het verbod, bedoeld in het
      eerste lid. Aan de vrijstelling of ontheffing kunnen voorschriften worden verbonden. De vrijstelling of ontheffing
      kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel11
  - number: '11.5'
    text: Het is verboden in strijd te handelen met de voorschriften, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel11
  - number: '12'
    text: Bij regeling van Onze Minister worden regels gesteld voor het uitvoeren van een valschermsprong.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel12
  - number: '13.1'
    text: Het is verboden kunstvluchten uit te voeren.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel13
  - number: '13.2'
    text: 'Het verbod, bedoeld in het eerste lid, is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel13
  - number: 13.2.a
    text: |-
      vluchten uitgevoerd door militair luchtverkeer dat wordt aangemerkt als OAT, indien de gezagvoerder de door Onze
      Minister van Defensie vastgestelde regels nakomt;
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel13
  - number: 13.2.b
    text: |-
      vluchten uitgevoerd onder zichtweersomstandigheden indien de gezagvoerder van het luchtvaartuig verscherpte
      waakzaamheid betracht met het doel botsingsgevaar tijdig te kunnen onderkennen en de voorgeschreven maatregelen tot
      het vermijden van botsingen tijdig te kunnen nemen en indien:
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel13
  - number: 13.2.b.1°
    text: |-
      op een zodanige horizontale of verticale afstand van gebieden met aaneengesloten bebouwing of mensenverzameling
      wordt gevlogen dat bij het uitvoeren van de vlucht, bedoeld in het eerste lid, personen of zaken op het
      aardoppervlak niet in gevaar kunnen worden gebracht, en
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel13
  - number: 13.2.b.2°
    text: |-
      het luchtvaartuig niet een voorwerp of ander luchtvaartuig in de lucht sleept of geen valschermspringers naar het
      afspringpunt brengt.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel13
  - number: '14'
    text: |-
      In aanvulling op het bepaalde in deel 3, hoofdstuk 1, van de bijlage bij verordening (EU) nr. 923/2012 zijn
      formatievluchten wanneer het gecontroleerde vluchten betreft, toegestaan indien vooraf een te volgen procedure is
      overeengekomen met de betrokken verlener van luchtverkeersleidingsdiensten.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel14
  - number: '15'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld over het tijdstip waarop lichten moeten worden gevoerd
      door luchtvaartuigen die zich op het water bevinden.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel15
  - number: '16.1'
    text: |-
      Bij regeling van Onze Minister kunnen routes en vluchten als bedoeld in deel 4 van de bijlage bij verordening (EU)
      nr. 923/2012 worden aangewezen waar het verplicht is een vliegplan in te dienen. Een regeling wordt vastgesteld ter
      ondersteuning van:
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel16
  - number: 16.1.a
    text: de vluchtinformatieverstrekking, de alarmering of de opsporing en redding; of
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel16
  - number: 16.1.b
    text: de coördinatie met betrokken militaire eenheden of met verleners van luchtverkeersdiensten in aangrenzende staten.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel16
  - number: '16.2'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot de inhoud, het sluiten en de
      naleving van het vliegplan, bedoeld in deel 4 van de bijlage bij verordening (EU) nr. 923/2012.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel16
  - number: '16.3'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot de gevallen waarin geen vliegplan is
      vereist bij grensoverschrijdende vluchten als bedoeld in deel 4 van de bijlage bij [verordening (EU) nr. 923/2012]
      (32012R0923).
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel16
  - number: '17'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld omtrent het uitvoeren van VFR-vluchten bij een lagere
      zichtwaarde dan de waarde, bedoeld in deel 5 van de bijlage bij verordening (EU) nr. 923/2012. Deze regels worden
      gesteld onder de in dat deel bedoelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel17
  - number: '18.1'
    text: Het uitvoeren van een VFR-vlucht buiten de daglichtperiode is verboden.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel18
  - number: '18.2'
    text: |-
      Onze Minister kan vrijstelling of ontheffing verlenen van het verbod, bedoeld in het eerste lid, onder de
      voorwaarden van paragraaf SERA.5005, onder c, van de bijlage bij verordening (EU) nr. 923/2012. Aan de vrijstelling
      of ontheffing kunnen voorschriften worden verbonden. De vrijstelling of ontheffing kan onder beperkingen worden
      verleend.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel18
  - number: '18.3'
    text: Het is verboden in strijd te handelen met de voorschriften, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel18
  - number: '19.1'
    text: |-
      De minimumvlieghoogtes, bedoeld in deel 3, hoofdstuk 1, en deel 5 van de bijlage bij verordening (EU) nr. 923/2012
      zijn niet van toepassing:
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel19
  - number: 19.1.a
    text: op VFR-vluchten waarbij een sleep wordt aangehaakt of afgeworpen boven een luchthaven;
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel19
  - number: 19.1.b
    text: |-
      op VFR-vluchten waarbij stoffen ter bevordering of bescherming van het milieu dan wel de land-, tuin- of bosbouw te
      bestemder plaatse worden uitgeworpen;
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel19
  - number: 19.1.c
    text: |-
      op VFR-vluchten waarbij naderingsprocedures buiten luchthavens worden beoefend boven nader door Onze Minister aan
      te wijzen gebieden;
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel19
  - number: 19.1.d
    text: |-
      op vluchten met schermzweeftoestellen, zeilvliegtuigen en zweefvliegtuigen boven nader door Onze Minister aan te
      wijzen strand- en duingebieden;
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel19
  - number: 19.1.e
    text: |-
      boven nader door Onze Minster aan te wijzen routes en gebieden, voor zover deze routes en gebieden geen
      aaneengesloten bebouwing, industrie- of havengebied dan wel mensenverzameling betreffen.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel19
  - number: '19.2'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld over de uitvoering van de vluchten, bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel19
  - number: '19.3'
    text: |-
      Onverminderd het eerste lid kan Onze Minister vrijstelling of ontheffing verlenen op de minimumvlieghoogtes
      voor het uitvoeren van vluchten. Aan de vrijstelling of ontheffing kunnen voorschriften worden verbonden. De
      vrijstelling of ontheffing kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel19
  - number: '19.4'
    text: Het is verboden in strijd te handelen met de voorschriften, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel19
  - number: '20'
    text: Bij regeling van Onze Minister kunnen maximumvlieghoogtes voor het uitvoeren van vluchten worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel20
  - number: '21'
    text: |-
      Indien ten behoeve van positiemeldingen van een vlucht geen verplichte meldingspunten zijn vastgesteld, vinden
      positiemeldingen plaats:
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel21
  - number: 21.a
    text: telkens na het verstrijken van een tijdsverloop dat bij regeling van Onze Minister is vastgesteld,
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel21
  - number: 21.b
    text: |-
      dan wel, indien het een gecontroleerde vlucht betreft als bedoeld in deel 8 van de bijlage bij verordening
      (EU) nr. 923/2012, na het verstrijken van het tijdsverloop dat is opgegeven door de betrokken verlener van
      luchtverkeersleidingsdiensten.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel21
  - number: '22'
    text: |-
      Indien de bepalingen over communicatie, bedoeld in deel 8 van de bijlage bij verordening (EU) nr. 923/2012, niet
      kunnen worden nagekomen door storing in de radioverbinding, wordt gehandeld overeenkomstig bij regeling van Onze
      Minister ter implementatie van de passende bepalingen krachtens de annexen 2 en 10 bij het Verdrag van Chicago
      gestelde regels.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel22
  - number: '23.1'
    text: |-
      In het belang van de veiligheid van het luchtverkeer worden bij regeling van Onze Minister regels gesteld over de
      navigatie- en telecommunicatie-installaties en overige boordapparatuur waarmee een luchtvaartuig voor het uitvoeren
      van een vlucht is uitgerust en de eisen waar die installaties en apparatuur aan voldoen.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel23
  - number: '23.2'
    text: |-
      Onze Minister kan ontheffing verlenen van de krachtens het eerste lid gegeven regels, waarbij voor een IFR-vlucht
      geldt dat de navigatie- en telecommunicatieuitrusting van het luchtvaartuig ten minste gelijkwaardige mogelijkheden
      biedt voor de vluchtuitvoering.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel23
  - number: '23.3'
    text: Aan een ontheffing kunnen voorschriften worden verbonden. Een ontheffing kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel23
  - number: '23.4'
    text: Het is verboden te handelen in strijd met de voorschriften, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel23
  - number: '24'
    text: Bij regeling van Onze Minister worden regels gesteld over de bediening van de boordapparatuur.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel24
  - number: '25'
    text: |-
      Bij regeling van Onze Minister kunnen overeenkomstig het Verdrag van Chicago in het belang van de veiligheid
      van het luchtverkeer regels worden gesteld over het onderscheppen van burgerluchtvaartuigen door militaire
      luchtvaartuigen of luchtvaartuigen die worden gebruikt voor politie- of douanedoeleinden.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel25
  - number: '26.1'
    text: |-
      Ten behoeve van de vluchtvoorbereiding en de vluchtuitvoering verstrekt de LVNL vóór de vlucht de volgende
      luchtvaartinlichtingen:
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel26
  - number: 26.1.a
    text: 'een geïntegreerd pakket luchtvaartinlichtingen bestaande uit de volgende publicaties:'
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel26
  - number: 26.1.a.1°
    text: een luchtvaartgids;
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel26
  - number: 26.1.a.2°
    text: wijzigingslijsten op de luchtvaartgids;
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel26
  - number: 26.1.a.3°
    text: aanvullingslijsten op de luchtvaartgids;
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel26
  - number: 26.1.a.4°
    text: berichten aan luchtvarenden;
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel26
  - number: 26.1.a.5°
    text: circulaires voor de luchtvaart;
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel26
  - number: 26.1.b
    text: luchtvaartkaarten;
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel26
  - number: 26.1.c
    text: luchtvaartmeteorologische inlichtingen.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel26
  - number: '26.2'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld met betrekking tot luchtvaartinlichtingen. Deze regels
      betreffen ten minste:
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel26
  - number: 26.2.a
    text: de gegevens die luchtvaartinlichtingen bevatten;
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel26
  - number: 26.2.b
    text: de wijze van verstrekking;
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel26
  - number: 26.2.c
    text: de plaatsen waar en de perioden gedurende welke luchtvaartinlichtingen worden verstrekt, en
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel26
  - number: 26.2.d
    text: de instanties en personen aan wie luchtvaartinlichtingen worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel26
  - number: '26.3'
    text: |-
      Abonnementen op de luchtvaartpublicaties en luchtvaartkaarten worden verstrekt tegen vergoeding van de kosten die
      jaarlijks door de LVNL worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel26
  - number: '33'
    text: |-
      Handelen in strijd met het bepaalde bij of krachtens de [artikelen 3, tweede lid][ref1], [4][ref2], [4a][ref3],
      [7, tweede lid][ref4], [9][ref5], [10, eerste en vijfde lid][ref6], [11, eerste en vijfde lid][ref7], [12][ref8],
      [13, eerste lid][ref9], [14][ref10], [15][ref11], [16][ref12], [17][ref13], [18, eerste en derde lid][ref14],
      [19, eerste en vierde lid][ref15], [20][ref16], [21][ref17], [22][ref18] en [23, vierde lid][ref19], is een
      strafbaar feit.


