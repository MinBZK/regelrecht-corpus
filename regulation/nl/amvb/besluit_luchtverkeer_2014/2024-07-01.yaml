  - number: '34.1'
    text: |-
      De bij of krachtens de [artikelen 13, derde en vierde lid][ref1], [14, derde en vierde lid][ref2],
      [27, derde lid][ref3], [31, tweede lid][ref4], [38, vierde en vijfde lid][ref5],
      [44a, tweede lid][ref6], [45, vierde en vijfde lid][ref7], [49 derde lid][ref8] en
      [51, tweede en derde lid, van het Luchtverkeersreglement][ref9] afgegeven ontheffingen en vrijstellingen die hun
      geldigheid niet hebben verloren, behouden vanaf de inwerkingtreding van dit besluit hun geldigheid voor zover
      gedurende die periode hun geldigheid overeenkomstig de voorwaarden waaronder de ontheffing en vrijstelling is
      afgegeven niet is verlopen, en voor zover aan hetgeen bij of krachtens het [Luchtverkeersreglement][ref10], zoals
      deze gold voor de inwerkingtreding van deze regeling, is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel13
