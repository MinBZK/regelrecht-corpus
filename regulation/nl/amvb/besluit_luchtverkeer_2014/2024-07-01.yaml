  - number: '34.2'
    text: |-
      De bij of krachtens [artikel 44, vierde en vijfde lid, van het Luchtverkeersreglement][ref1] afgegeven ontheffingen
      en vrijstellingen van de in artikel 44, eerste lid, onderdelen a en c, van het Luchtverkeersreglement gestelde
      verboden, behouden hun geldigheid overeenkomstig de in het eerste lid genoemde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel44
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '44'
  - number: '35'
    text: |-
      Het [Luchtverkeersreglement][ref1] wordt ingetrokken met dien verstande dat voor de toepassing van het
      [Luchthavenverkeerbesluit Schiphol][ref2][artikel 1 van het Luchtverkeersreglement][ref3], zoals dat luidt
      op de dag van inwerkingtreding van dit besluit, van toepassing blijft, tot de eerstvolgende wijziging van
      [artikel 1 van het Luchthavenverkeerbesluit Schiphol][ref4] in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0005775
      [ref2]: https://wetten.overheid.nl/BWBR0014330
      [ref3]: https://wetten.overheid.nl/BWBR0005775#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0014330#Artikel1
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005775
      - id: ref2
        bwb_id: BWBR0014330
      - id: ref3
        bwb_id: BWBR0005775
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0014330
        artikel: '1'
  - number: '36'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel36
  - number: '37'
    text: 'Dit besluit wordt aangehaald als: Besluit luchtverkeer 2014.'
    url: https://wetten.overheid.nl/BWBR0035899/2024-07-01#Artikel37
