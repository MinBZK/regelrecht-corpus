  - number: '17'
    text: |-
      In afwijking van [artikel 3, onder a][ref1], is het tot 29 juli 1976 toegestaan voor een textielartikel een
      aanduiding te bezigen welke voor de soort kenmerkende textielvezels, omschreven in bijlage 1 van dit besluit
      in rubriek III, onder nummer 23, inhoudt de benaming "rayon" of "viscose rayon", voor zover die kenmerkende
      textielvezels in dat textielartikel in de vorm van filament voorkomen, en de benaming "spun-rayon", "rayon-vezels",
      "viscose spun-rayon" of "viscose rayon-vezels", voor zover die kenmerkende textielvezels in dat textielartikel in
      de vorm van stapelvezels voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002932#Artikel3
    url: https://wetten.overheid.nl/BWBR0002932/1998-06-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002932
        artikel: '3'
  - number: 17a
    text: >-
      In Textielartikelen die bestemd zijn om in contact te komen met de huid, zoals kleding, onderkleding en linnengoed,
      mag tri-(2,3-dibroompropyl)-fosfaat in het geheel niet aanwezig zijn en mogen tris-(aziridinyl)-fosfineoxide en
      polybroom bifenylen niet aanwezig zijn voorzover zulks geen brandbeschermende kleding betreft.
    url: https://wetten.overheid.nl/BWBR0002932/1998-06-01#Artikel17a
  - number: '18'
    text: >-
      1 Voor de beoordeling of een textielartikel voldoet aan dit besluit moet worden gebruik gemaakt van de
      ter zake door Onze Ministers van Volksgezondheid en Milieuhygiëne en van Economische Zaken vastgestelde
      onderzoekingsmethoden.


      2 Onze genoemde Ministers maken de door hen vastgestelde onderzoekingsmethoden in de *Staatscourant* bekend.
    url: https://wetten.overheid.nl/BWBR0002932/1998-06-01#Artikel18
  - number: '19'
    text: >-
      1 Dit besluit kan worden aangehaald als: Textielartikelenbesluit (Warenwet).


      2 Het treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002932/1998-06-01#Artikel19
