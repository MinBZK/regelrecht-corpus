  - number: '8'
    text: |-
      In afwijking van de [artikelen 2][ref1] en [3, eerste lid][ref2], is het toegestaan voor een textielartikel,
      waarvan de soorten kenmerkende textielvezels op het ogenblik van vervaardiging moeilijk kunnen worden aangeduid, de
      gezamenlijke benaming "diverse vezels" of "textiel van onbepaalde samenstelling" te bezigen, met weglating van het
      omgerekende gewicht van de betrokken soorten kenmerkende textielvezels.


