  - number: '6'
    text: |-
      1 In afwijking van [artikel 2, onder b][ref1], is het toegestaan voor een textielartikel, samengesteld uit
      een mengsel van drie of meer soorten kenmerkende textielvezels, waarvan het omgerekende gewicht van elke soort
      afzonderlijk minder dan 85% van het textielgewicht van dat textielartikel bedraagt, een aanduiding te bezigen, die:

      a. met betrekking tot ten minste de twee soorten kenmerkende textielvezels met het ten opzichte van de overige
      soort of soorten textielvezels hoogste of een na hoogste omgerekende gewicht voldoet aan [artikel 2][ref2] en

      b. met betrekking tot de overige soort of soorten kenmerkende textielvezels slechts hun benaming inhoudt, een en
      ander in afdalende volgorde van het omgerekende gewicht.

      2 Het eerste lid geldt niet ten aanzien van een textielartikel, als in [artikel 5, tweede lid][ref3] bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002932#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002932#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002932#Artikel5
