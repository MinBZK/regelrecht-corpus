  - number: '10'
    text: |-
      In afwijking van [artikel 2][ref1] is het toegestaan voor een textielartikel, dat is samengesteld uit één soort
      kenmerkende textielvezels, een aanduiding te bezigen, die - voorafgegaan door "puur" of "zuiver" - de benaming van
      die soort kenmerkende textielvezels inhoudt.


      [ref1]: https://wetten.overheid.nl/BWBR0002932#Artikel2
