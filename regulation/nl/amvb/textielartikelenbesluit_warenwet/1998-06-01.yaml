  - number: '11'
    text: |-
      1 Voor een textielartikel, dat is samengesteld of mede is samengesteld uit soorten kenmerkende textielvezels als
      in [artikel 3, onder b][ref1], bedoeld, mag niet een aanduiding worden gebezigd, waarin die soorten zijn aangegeven
      met een der benamingen, vastgesteld bij [artikel 3, onder a][ref2], of met daarop gelijkende benamingen.

      2 Voor een textielartikel mag niet worden gebezigd een aanduiding, die met betrekking tot de speciale vorm of
      opmaak van textielvezels als filamentgaren een woordsamenstelling inhoudt, waarvan het woord "zijde" deel uitmaakt.

      3 Voor een textielartikel mogen geen aanduidingen worden gebezigd, die misleidende of onjuiste benamingen van
      textielvezels inhouden.


      [ref1]: https://wetten.overheid.nl/BWBR0002932#Artikel3
