preamble:
  text: >-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.


    Op de voordracht van de Staatssecretaris van Volksgezondheid en Milieuhygiëne van 25 maart 1974, DG Vgz/VA, no.
    33436, en van de Staatssecretaris van Economische Zaken;


    Overwegende, dat regelen moeten worden gesteld ter uitvoering van de richtlijn van de Raad van de Europese
    Gemeenschappen van 26 juli 1971 betreffende de onderlinge aanpassing van de wetgevingen der Lid-Staten inzake
    textielbenamingen, nr. 71/307/EEG (Pb.E.G. L 185), zoals deze richtlijn is aangepast bij de Akte betreffende
    de toetredingsvoorwaarden en de aanpassing der Verdragen, met Bijlagen, gevoegd bij het op 22 januari 1972 te
    Brussel tot stand gekomen Verdrag betreffende de toetreding van het Koninkrijk Denemarken, Ierland, Het Koninkrijk
    Noorwegen en het Verenigd Koninkrijk van Groot-Brittannië en Noord-Ierland tot de Europese Economische Gemeenschap
    en de Europese Gemeenschap voor Atoomenergie (laatstelijk Trb. 1973, 63);


    Gelet op de artikelen 14, 14a en 16a van de Warenwet (Stb. 1935, 793);


    Gezien het advies van de commissie, bedoeld in artikel 17, zevende lid, van de Warenwet, door de Sociaal-
    Economische Raad ingesteld op grond van artikel 43 van de Wet op de Bedrijfsorganisatie (Stb. 1950, K 22), van 10
    januari 1974, nr. J 6770;


    De Raad van State gehoord (advies van 1 mei 1974, no. 12);


    Gezien het nader rapport van de Staatssecretaris van Volksgezondheid en Milieuhygiëne van 3 juli 1974, DG Vgz/VA,
    no. 34029, en van de Staatssecretaris van Economische Zaken;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002932/1998-06-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. textielvezel:

      1°. de door zijn soepelheid, fijnheid en in verhouding tot de maximale dwarsdoorsnede grote lengte gekenmerkte
      zelfstandigheid,

      2°. de soepele strook of buis, waarvan de schijnbare breedte niet meer dan 5 millimeter bedraagt - met inbegrip van
      een uit een bredere strook of uit folie geknipte strook -, vervaardigd op basis van de materialen die dienen voor
      de fabricage van de textielvezels, bedoeld in [artikel 3, eerste lid, onder ][ref1] of genoemd in bijlage I van dit
      besluit, onder een der nummers 17 tot en met 38,

      een en ander voor zover geschikt of bestemd om al dan niet na behandeling, bewerking of verwerking te dienen als
      grondstof voor de vervaardiging van textiel;

      b. schijnbare breedte van een soepele strook of buis:

      de breedte dan wel, in geval van een niet uniforme breedte, de gemiddelde breedte van een soepele strook of buis in
      gevouwen, platgemaakte, samengedrukte of verwrongen vorm;

      c. *textielartikel:* het voor de handel bestemde of in de handel gebrachte artikel, dat is samengesteld uit door
      enigerlei bewerking met elkaar verbonden textielvezels, van welke vezels tezamen het omgerekende gewicht tenminste
      80 procent van het gewicht van dat artikel bedraagt, en dat bestemd of geschikt is om als textiel te worden
      gebruikt;

      d. *omgerekend gewicht van een soort textielvezels:* het gewicht, verkregen door het gewicht, in watervrije
      toestand, van een soort textielvezels eerst te verminderen met het gewicht van daarin of daarop aanwezige vetten,
      bindmiddelen, vulstoffen, appreteermiddelen, impregneermiddelen, hulpstoffen voor het verven en het drukken
      alsmede andere stoffen voor de behandeling van textielartikelen en vervolgens te vermeerderen met het voor die
      soort textielvezels door of vanwege de Raad van de Europese Gemeenschappen vastgestelde en door Onze Ministers van
      Volksgezondheid en Milieuhygiëne en van Economische Zaken in de *Staatscourant* bekendgemaakte reprisepercentage;

      e. kenmerkende textielvezel, van een textielartikel van een onderdeel of van een afzonderlijk deel van een
      textielartikel:

      de door enigerlei bewerking met elkaar verbonden textielvezels, waaruit een textielartikel, een onderdeel of
      een afzonderlijk deel van een textielartikel is samengesteld, met uitzondering van de textielvezels waaruit zijn
      samengesteld de volgende bestanddelen van het textielartikel, het onderdeel of het afzonderlijke deel:

      1°. voor zover het betreft alle textielartikelen, alle onderdelen of alle afzonderlijke delen: zelfkanten,
      etiketten en insignes, biezen en garneringen die geen integrerend deel van dat textielartikel, dat onderdeel of
      dat afzonderlijk deel uitmaken, met stof beklede knopen en gespen, toebehoren, versieringen, niet-elastisch band,
      elastische draad en band die op specifieke en beperkte plaatsen van dat textielartikel, dat onderdeel of dat
      afzonderlijk deel zijn toegevoegd,

      2°. voor zover het betreft uit verschillende lagen bestaande vloerbedekkingen en tapijten: andere bestanddelen dan
      de gebruikslaag,

      3°. voor zover het betreft meubelbekledingsstoffen: bindkettingen, bindinslagen, vulkettingen en vulinslagen die
      geen deel uitmaken van de gebruikslaag,

      4°. voor zover het betreft overgordijnstoffen: bindkettingen, bindinslagen, vulkettingen en vulinslagen die geen
      deel uitmaken van de rechte zijde van de stof,

      5°. voor zover het betreft andere dan de onder 2°, 3° of 4° bedoelde textielartikelen, dan wel onderdelen of
      delen van zodanige textielartikelen: steunstukken, versterkingen - waaronder worden verstaan garens of stoffen
      die op specifieke en beperkte plaatsen van een textielartikel, een onderdeel of een afzonderlijk deel van een
      textielartikel worden toegevoegd ten einde deze te versterken dan wel stijver of dikker te maken -, voorts dubbele
      voeringen, voeringen, niet zijnde hoofdvoeringen, binddoek, naai- en rijggaren, met uitzondering van gevallen
      waarin dat garen de kettingen of inslagen van het textielartikel, het onderdeel of het afzonderlijke deel vervangt,
      en vullingen met een andere dan een isolerende functie;

      f. *textielgewicht van een textielartikel, van een onderdeel of een afzonderlijk deel van een textielartikel:* het
      omgerekende gewicht van alle soorten kenmerkende textielvezels tezamen van een textielartikel, van een onderdeel of
      van een afzonderlijk deel van een textielartikel.

      2 In dit besluit en de daarop berustende bepalingen worden onder textielartikelen mede verstaan:

      a. de overtrekken van niet een textielartikel zijnde meubels, van zodanige paraplu’s en van zodanige parasols,

      b. de delen of onderdelen van niet een textielartikel zijnde matrassen en van zodanige kampeerartikelen,

      c. de koudewerende voering van niet een textielartikel zijnde schoeisel en van zodanige handschoenen,

      d. de gebruiksoppervlakken van uit verschillende lagen bestaande vloerbedekkingen en tapijten, die niet een
      textielartikel zijn,

      e. de delen of onderdelen van andere dan de onder *a-d* bedoelde goederen, die niet een textielartikel zijn, voor
      zover:

      1°. die delen of onderdelen van de onder *a-e* bedoelde goederen zijn samengesteld uit door enigerlei bewerking
      met elkaar verbonden textielvezels, van welke vezels tezamen het omgerekende gewicht tenminste 80 procent van het
      gewicht van die delen of onderdelen bedraagt, en

      2°. die goederen voor de handel bestemd of in de handel gebracht zijn en

      3°. - voor wat betreft de onder *e* bedoelde delen of onderelen - de samenstelling van die delen is aangegeven.

      3 In dit besluit en de daarop berustende bepalingen wordt onder steunstukken niet begrepen de basisstof of
      basisstoffen van een textielartikel, van een onderdeel of van een afzonderlijk deel van een textielartikel, die als
      grondlaag voor de gebruikslaag dient of dienen, zoals de basisstof of basisstoffen van dekens en van dubbelweefsels
      en het basismateriaal van fluweel of van pluche en van aanverwante textielartikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002932#Artikel3
