  - number: '14'
    text: |-
      1 Voor de toepassing van de [artikelen 2][ref1] tot en met [12a][ref2] zijn overeenkomstig de volgende leden van
      dit artikel toleranties toegestaan.

      2 Ten aanzien van een textielartikel waarvoor ingevolge een der [artikelen 2][ref3] tot en met [10][ref4]
      een aanduiding is gebezigd als hieronder omschreven, is de aanwezigheid van een of meer niet in de aanduiding
      aangegeven soorten kenmerkende textielvezels toegestaan tot ten hoogste het hieronder aangegeven percentage van het
      textielgewicht van dat textielartikel:

      een en ander voor zover de aanwezigheid van die niet in de aanduiding aangegeven soort of soorten kenmerkende
      textielvezels op technische gronden is gerechtvaardigd en niet is veroorzaakt door stelselmatige toevoeging.

      3 Ten aanzien van een textielartikel, dat is samengesteld uit twee of meer soorten kenmerkende textielvezels en
      waarvoor overeenkomstig [artikel 2][ref5], 3, 4, eerste lid, onder *b*, 5, 6, 7 of 8 een aanduiding is gebezigd,
      inhoudende de benaming van een of meer soorten vezels alsmede hun percentage of het woord "puur" of "zuiver",
      is tussen het in die aanduiding aangegeven omgerekende gewicht van elk der in die aanduiding genoemde soorten
      kenmerkende textielvezels en het werkelijke omgerekende gewicht daarvan een afwijking toegestaan van ten hoogste 3
      procent van het gewicht, omschreven in het zesde en zevende lid.

      4 Het bepaalde in het derde lid van overeenkomstige toepassing ten aanzien van een textielartikel, waarvoor een
      aanduiding is gebezigd, inhoudende de benaming van soorten kenmerkende textielvezels in afdalende volgorde van hun
      omgerekende gewicht zonder het percentage daarvan, met dien verstande dat het in het derde lid toegelaten verschil
      alsdan betreft de in de volgorde ingenomen plaats van de benaming van een soort kenmerkende textielvezels in die
      aanduiding, en de plaats die de benaming van die soort in die aanduiding op grond van het werkelijke omgerekende
      gewicht daarvan had moeten innemen.

      5 Ten aanzien van een textielartikel waarvoor een aanduiding als in [artikel 9][ref6] bedoeld is gebezigd, is
      een afwijking met betrekking tot het omgerekende gewicht van het vlas en het omgerekende gewicht van de katoen
      toegestaan met dien verstande dat het werkelijk omgerekende gewicht van het vlas minder mag zijn dan 40 procent
      en het werkelijke omgerekende gewicht van de katoen meer mag zijn dan 60 procent van het textielgewicht van
      dat textielartikel doch deze verschillen elk voor zich niet meer mogen bedragen dan 3 procent van het gewicht,
      omschreven in het zesde en zevende lid.

      6 De toleranties, bedoeld in het tweede lid, enerzijds, en de toleranties bedoeld in het derde en vierde en
      vijfde lid, anderzijds, worden afzonderlijk berekend, met dien verstande dat het percentage, dat als tolerantie
      ingevolge het derde, vierde of vijfde lid is toegestaan, wordt berekend van een totaal gewicht, verkregen door
      het textielgewicht van het textielartikel te verminderen met het omgerekende gewicht van de niet in de aanduiding
      aangegeven soort of soorten kenmerkende textielvezels die binnen de ingevolge het tweede lid toegestane tolerantie
      in het textielartikel aanwezig zijn.

      7 In afwijking van het zesde lid worden de toleranties, bedoeld in het tweede lid, samengevoegd met de
      toleranties, bedoeld in het derde, vierde of vijfde lid, en worden zij alle berekend van het textielgewicht van
      het textielartikel, indien de niet in de aanduiding aangegeven soort of soorten kenmerkende textielvezels van
      dezelfde chemische aard zijn als een of meer soorten kenmerkende textielvezels, die wèl in de aanduiding van dat
      textielartikel zijn vermeld.

      8 Het bepaalde in het tweede tot en met zevende lid is van overeenkomstige toepassing ten aanzien van:

      a. een textielartikel, waarvoor ingevolge [artikel 12, eerste lid][ref7], of
      [artikel 12a, tweede lid, onder a][ref8], een aanduiding is gebezigd met dien verstande, dat de toleranties alsdan
      gelden voor elk onderdeel of afzonderlijk deel van dat textielartikel op zichzelf en voor de berekening van de
      toleranties in plaats van het textielgewicht van het textielartikel het textielgewicht van het betrokken onderdeel
      of afzonderlijk deel als uitgangspunt dient;

      b. een textielartikel waarvoor ingevolge [artikel 12a, eerste lid][ref9], een aanduiding is gebezigd;

      c. een textielartikel, waarvoor ingevolge [artikel 12a, tweede lid, onder b][ref10], een aanduiding is gebezigd,
      met dien verstande dat alsdan voor de berekening van de toleranties in plaats van het textielgewicht van het
      textielartikel het gewicht, bedoeld in [artikel 12a, derde lid][ref11], als uitgangspunt dient.


