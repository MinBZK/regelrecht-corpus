  - number: '3'
    text: |-
      1 De in [artikel 2, onder ][ref1], bedoelde benamingen zijn:

      a. voor zover het betreft een der soorten textielvezels, omschreven in [bijlage I][ref2] van dit besluit: de naam,
      in rubriek II van die bijlage bij de in rubriek III van die bijlage gegeven omschrijving van die soort aangegeven;

      b. voor zover het betreft andere soorten textielvezels dan onder *a* bedoeld: hetzij de Nederlandse naam van
      de grondstof of grondstoffen waaruit die textielvezels zijn opgebouwd, hetzij die naam of een daarvan afgeleid
      bijvoeglijk naamwoord, gevolgd door "vezel".

      2 In afwijking van het eerste lid mag voor een mengsel van, enerzijds, de soort kenmerkende textielvezels,
      omschreven bij nummer 1 van [bijlage I][ref3] van dit besluit, en, anderzijds, een of meer soorten kenmerkende
      textielvezels, omschreven bij nummer 2 van die bijlage, de gezamenlijke benaming "wol" worden gebezigd.

      3 Indien toepassing is gegeven aan het tweede lid, worden voor de toepassing van de [artikelen 2][ref4], [5][ref5]
      tot en met [11][ref6], [12][ref7], [12][ref8] en [13][ref9] tot en met [18][ref10] de gezamenlijk met de benaming
      "wol" aangeduide soorten kenmerkende textielvezels aangemerkt als één soort kenmerkende textielvezels en wordt in
      afwijking van [artikel 1, eerste lid, onder ][ref11], als omgerekend gewicht daarvan aangemerkt het totaal van het
      omgerekend gewicht van die soorten.


