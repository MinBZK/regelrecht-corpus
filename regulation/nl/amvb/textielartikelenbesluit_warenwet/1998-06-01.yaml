  - number: '9'
    text: |-
      1 In afwijking van de [artikelen 2][ref1], [3, eerste lid, onder a][ref2], en [5][ref3], is het toegestaan voor
      een textielartikel met een ketting van zuiver katoen en een inslag van zuiver vlas, voor zover het omgerekende
      gewicht van dat vlas tenminste 40 procent van het textielgewicht van dat textielartikel bedraagt, de aanduiding:
      "halflinnen, ketting zuiver katoen", gevolg door hetzij: "inslag zuiver vlas", hetzij: "inslag zuiver linnen" te
      bezigen.

      2 In afwijking van het bepaalde in [artikel 1][ref4], worden de aldaar bedoelde percentages van 7% en 2% ten
      aanzien van een textielartikel waarvoor een aanduiding als in het eerste lid van het onderhavige artikel bedoeld is
      gebezigd, afzonderlijk berekend van het totaal van het omgerekende gewicht van de soorten kenmerkende textielvezels
      die deel uitmaken van de ketting en van het totaal van het omgerekende gewicht van de soort kenmerkende
      textielvezels die deel uitmaken van de inslag.


      [ref1]: https://wetten.overheid.nl/BWBR0002932#Artikel2
