  - number: '12'
    text: |-
      1 Voor een textielartikel, dat bestaat uit twee of meer onderdelen - niet zijnde onderdelen als in
      [artikel 1, eerste lid, onder ][ref1], bedoeld - of afzonderlijke delen, welke onderdelen of delen ten opzichte van
      elkaar voor wat betreft de kenmerkende textielvezels een verschillende vezelsamenstelling hebben, dan wel bestaat
      uit twee of meer afzonderlijke delen, waarvan tenminste één uit twee of meer onderdelen als bovenbedoeld bestaat,
      moet een aanduiding worden gebezigd, welke duidelijk met betrekking tot elk van die onderdelen, afzonderlijke delen
      of onderdelen van die afzonderlijke delen inhoudt:

      a. de bij [artikel 3, eerste lid][ref2], vastgestelde of bij [artikel 3, tweede lid][ref3], toegelaten benaming
      van elk der soorten kenmerkende textielvezels van het desbetreffende onderdeel of afzonderlijke deel, telkens
      voorafgegaan of gevolgd door:

      b. het omgerekende gewicht van die soorten kenmerkende textielvezels, uitgedrukt in een percentage van het
      textielgewicht van het betrokken onderdeel of afzonderlijke deel in de vorm van "%",

      een en ander in afdalende volgorde van het omgerekende gewicht.

      2 De aanduiding, bedoeld in het eerste lid, moet, voor zover het betreft een textielartikel, behorende tot een
      categorie, genoemd onder de nummers 1 tot en met 4 van [bijlage II][ref4] van dit besluit, tevens inhouden de
      benaming van de betrokken onderdelen zoals in die bijlage achter de betrokken categorie is aangegeven.

      3 In afwijking van het eerste lid mag in de aanduiding van een textielartikel, behorende tot een der hierna
      bedoelde categorieën, de benaming en het omgerekende gewicht van soorten kenmerkende textielvezels van de achter
      die categorie aangegeven onderdelen achterwege worden gelaten:

      4 Ten aanzien van een textielartikel als in het eerste lid bedoeld zijn de [artikelen 4][ref5]-[10][ref6],
      en [11, eerste en tweede lid][ref7], van toepassing met dien verstande dat in die artikelen in plaats van
      "textielartikel" wordt gelezen: "onderdeel, afzonderlijk deel of onderdeel van een afzonderlijk deel van een
      textielartikel".


      [ref1]: https://wetten.overheid.nl/BWBR0002932#Artikel1
