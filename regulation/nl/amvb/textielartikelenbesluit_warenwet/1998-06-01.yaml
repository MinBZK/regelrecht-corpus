  - number: '13'
    text: |-
      1 Een textielartikel, dat krachtens verkoop wordt afgeleverd of voor zodanige aflevering voorhanden wordt
      gehouden, moet zijn voorzien van de daarvoor bij dit besluit vastgestelde of toegelaten aanduiding door een daarop
      aangebracht etiket of door het weven, stempelen of op andere wijze aanbrengen van die aanduiding in, op of aan
      dat textielartikel.

      2 Indien een textielartikel zich bevindt in een verpakking, bestemd of geschikt om met de inhoud te worden
      afgeleverd, behoeft ten aanzien van dat textielartikel niet aan het eerste lid te worden voldaan, indien die
      verpakking is voorzien van de voor dat textielartikel bij dit besluit vastgestelde of toegelaten aanduiding.

      3 Een aanduiding als in het eerste of tweede lid bedoeld moet in uniforme letters en cijfers zijn aangebracht
      en voor de koper duidelijk zichtbaar en gemakkelijk leesbaar zijn; de benamingen en percentages die zodanige
      aanduiding vormen, moeten onmiddellijk achter of onder elkaar geplaatst worden op zodanige wijze, dat zij geen
      aanleiding kunnen geven tot verwarring of misvatting omtrent de samenstelling van het textielartikel.

      4 Een aanduiding als in het eerste of tweede lid bedoeld moet onderscheidenlijk in, op of aan het textielartikel of
      op de verpakking:

      a. duidelijk gescheiden zijn van andere in, op of aan dat textielartikel of op die verpakking aangebrachte
      aanduidingen, met uitzondering van handelsnamen of merken;

      b. in de onmiddellijke nabijheid zijn aangebracht van in, op of aan dat textielartikel of op die verpakking
      aangebrachte handelsnamen of merken, waarin een bij dit besluit vastgestelde of toegelaten aanduiding voorkomt, of
      handelsnamen of merken die met een zodanige aanduiding kunnen worden verward.

      5 Indien een textielartikel krachtens verkoop aan anderen dan het publiek wordt afgeleverd of voor zodanige
      aflevering voorhanden wordt gehouden, behoeft ten aanzien van dat textielartikel niet aan het eerste lid te
      worden voldaan, indien dat textielartikel vergezeld gaat van onderscheidenlijk ter plaatse aanwezig zijn op dat
      textielartikel betrekking hebbende bescheiden, waarin de voor dat textielartikel bij dit besluit vastgestelde of
      toegelaten aanduiding wordt gebezigd, en die aanduiding voldoet aan het derde lid.

      6 Voor de toepassing van het vijfde lid wordt onder een aanduiding als in dat lid bedoeld mede begrepen een in
      code gestelde aanduiding, voor zover in hetzelfde bescheid waarin laatstbedoelde aanduiding is gebezigd, tevens
      is opgenomen een duidelijke verklaring van die code en die verklaring geen aanleiding kan geven tot verwarring of
      misvatting omtrent de samenstelling van het textielartikel.

      7 Indien een textielartikel met een of meer andere textielartikelen van gelijke samenstelling een eenheid vormt,
      die in de handel gebruikelijk is, behoeft ten aanzien van dat textielartikel niet aan het eerste lid te worden
      voldaan, indien ten aanzien van een van die andere textielartikelen aan die bepaling wordt voldaan.

      8 Indien een textielartikel, als in [bijlage III][ref1] van dit besluit bedoeld, met andere textielartikelen van
      gelijke soort en samenstelling aanwezig is in een voor het publiek toegankelijke verkoopruimte, behoeft ten aanzien
      van dat textielartikel niet aan het eerste lid te worden voldaan, indien in de onmiddellijke nabijheid van die
      textielartikelen aanwezig is de daarvoor bij dit besluit vastgestelde of toegelaten aanduiding, die aan het derde
      lid voldoet.

      9 Indien een textielartikel, als in [bijlage III][ref2] van dit besluit bedoeld, in een andere dan voor het publiek
      toegankelijke verkoopruimte voor aflevering aan het publiek voorhanden wordt gehouden, is ten aanzien van dat
      textielartikel het vijfde lid van overeenkomstige toepassing.

      10 Het vijfde, zevende, achtste en negende lid gelden niet ten aanzien van een textielartikel, waarin, waarop of
      waaraan is aangebracht een aanduiding, die gegevens met betrekking tot de samenstelling van dat textielartikel uit
      textielvezels bevat, of een aanduiding, welke de indruk kan wekken zodanige gegevens te bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0002932
      [ref2]: https://wetten.overheid.nl/BWBR0002932
