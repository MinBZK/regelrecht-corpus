  - number: '15'
    text: >-
      1 Het is toegestaan naast of - in de handel met anderen dan het publiek - in plaats van de bij dit besluit
      vastgestelde of toegelaten in de Nederlandse taal gestelde aanduidingen voor textielartikelen de door of vanwege
      de Raad van de Europese Gemeenschappen vastgestelde en bekendgemaakte vertalingen daarvan te bezigen, indien de
      aanduidingen volledig in dezelfde taal of, bij gebruikmaking van meer talen, volledig in elk van die talen zijn
      gesteld.


      2 Het bij dit besluit bepaalde met betrekking tot in de Nederlandse taal gestelde aanduidingen of gedeelten van
      aanduidingen is van overeenkomstige toepassing ten aanzien van de in het eerste lid bedoelde vertalingen daarvan.
    url: https://wetten.overheid.nl/BWBR0002932/1998-06-01#Artikel15
  - number: '16'
    text: |-
      Ten aanzien van een textielartikel, als in [bijlage IV][ref1] van dit besluit bedoeld, gelden de
      [artikelen 2][ref2], [2a][ref3], [3][ref4] tot en met [10][ref5], [11, eerste en tweede lid][ref6], [12][ref7],
      [12a][ref8] en [13][ref9] tot en met [15][ref10] niet, tenzij voor dat textielartikel wordt gebezigd een aanduiding
      betreffende zijn samenstelling of een aanduiding, die met een bij dit besluit vastgestelde of toegelaten aanduiding
      of gedeelte daarvan kan worden verward.


      [ref1]: https://wetten.overheid.nl/BWBR0002932
