  - number: 12a
    text: |-
      1 In afwijking van [artikel 12, eerste lid][ref1], mag voor een textielartikel als in dat lid bedoeld, dat
      behoort tot een categorie, genoemd onder de nummers 1 tot en met 4 van [bijlage II][ref2] van dit besluit, een
      aanduiding worden gebezigd overeenkomstig het ten aanzien van een textielartikel, samengesteld uit een mengsel
      van verschillende soorten kenmerkende textielvezels, bepaalde in de [artikelen 2][ref3] tot en met [8][ref4] en
      [artikel 10][ref5].

      2 In afwijking van [artikel 12, eerste lid][ref6], mag voor een textielartikel als in dat lid bedoeld, dat behoort
      tot een categorie, genoemd onder een der nummers 5 tot en met 7 van [bijlage II][ref7] van dit besluit, een der
      volgende aanduidingen worden gebezigd:

      a. een aanduiding die duidelijk en uitsluitend betrekking heeft op elk der afzonderlijke onderdelen die in die
      bijlage achter de betrokken categorie textielmiddelen zijn genoemd, en welke, voor zover het die onderdelen
      betreft, in overeenstemming is met het bepaalde in [artikel 12, eerste lid][ref8], dan wel

      b. voor zover de onder *a* bedoelde onderdelen dezelfde vezelsamenstelling hebben, een aanduiding, die duidelijk
      uitsluitend betrekking heeft op die onderdelen gezamenlijk.

      3 Indien toepassing is gegeven aan het tweede lid, onder *b*, moet de aanduiding, voor zover de betrokken
      onderdelen gezamenlijk betreft, overeenstemmen met het ten aanzien van een textielartikel bepaalde in de
      [artikelen 2][ref9] tot en met [10][ref10], en [11, eerste en tweede lid][ref11], met dien verstande, dat
      alsdan, onverminderd het bepaalde in [artikel 1a][ref12], als textielgewicht wordt aangemerkt het totaal van het
      omgerekende gewicht van alle soorten kenmerkende textielvezels van de betrokken onderdelen te zamen.


