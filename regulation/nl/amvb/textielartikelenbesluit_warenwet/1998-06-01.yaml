  - number: '5'
    text: |-
      1 In afwijking van [artikel 2][ref1] is het toegestaan voor een textielartikel, dat is samengesteld uit een
      mengsel van twee of meer soorten kenmerkende textielvezels, waarvan het omgerekende gewicht van één soort tenminste
      85 procent van het textielgewicht van dat textielartikel bedraagt, een aanduiding te bezigen, welke slechts de
      benaming van laatstbedoelde soort kenmerkende textielvezels inhoudt, hetzij gevolgd of voorafgegaan door het in
      [artikel 2, onder b][ref2], bedoelde percentage van het omgerekende gewicht daarvan, hetzij voorafgegaan door
      hetzij: "minimum 85%" hetzij: "tenminste 85%"

      2 Het eerste lid geldt niet ten aanzien van een textielartikel, aangeduid of mede aangeduid met "scheerwol".


      [ref1]: https://wetten.overheid.nl/BWBR0002932#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002932#Artikel2
    url: https://wetten.overheid.nl/BWBR0002932/1998-06-01#Artikel5
