  - number: 1a
    text: |-
      1 Indien een textielartikel, een onderdeel of een afzonderlijk deel van een textielartikel mede is samengesteld uit
      de volgende kenmerkende textielvezels:

      a. zichtbare en isoleerbare textielvezels met een louter decoratieve functie, waarvan het omgerekende gewicht niet
      meer dan 7% van het textielgewicht van onderscheidenlijk dat textielartikel, dat onderdeel of dat afzonderlijke
      deel bedraagt of

      b. textielvezels die zijn verwerkt ter verkrijging van een anti-statisch effect, waarvan het omgerekend
      gewicht niet meer dan 2% van het textielgewicht van onderscheidenlijk dat textielartikel, dat onderdeel of dat
      afzonderlijke deel bedraagt, mogen die textielvezels bij het bezigen van een aanduiding van de samenstelling van
      onderscheidenlijk het betrokken textielartikel, onderdeel of afzonderlijke deel buiten beschouwing worden gelaten.

      2 Indien aan het eerste lid toepassing is gegeven, worden in afwijking van
      [artikel 1, eerste lid, onder e en f][ref1], de in het eerste lid bedoelde textielvezels niet langer als
      kenmerkende textielvezels aangemerkt en wordt voor zover in dit besluit niet anders is bepaald, als textielgewicht
      van het betrokken textielartikel, van het betrokken onderdeel of afzonderlijke deel van een textielartikel
      aangemerkt het gewicht, verkregen door het textielgewicht als omschreven in [artikel 1, eerste lid, onder f][ref2],
      te verminderen met het omgerekende gewicht van de in het eerste lid bedoelde textielvezels.


      [ref1]: https://wetten.overheid.nl/BWBR0002932#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002932#Artikel1
    url: https://wetten.overheid.nl/BWBR0002932/1998-06-01#Artikel1a
