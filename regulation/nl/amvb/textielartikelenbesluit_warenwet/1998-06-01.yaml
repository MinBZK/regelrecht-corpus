  - number: '2'
    text: >-
      Voor een textielartikel, dat uit één soort kenmerkende textielvezels of uit een mengsel van verschillende soorten
      kenmerkende textielvezels is samengesteld, moet een aanduiding worden gebezigd, welke inhoudt:


      a. de benaming van elk der soorten kenmerkende textielvezels, telkens voorafgegaan of gevolgd door:


      b. het omgerekende gewicht van die soorten kenmerkende textielvezels, uitgedrukt in een percentage van het
      textielgewicht van dat textielartikel in de vorm van "%",


      een en ander in afdalende volgorde van het omgerekende gewicht.
    url: https://wetten.overheid.nl/BWBR0002932/1998-06-01#Artikel2
  - number: 2a
    text: |-
      Voor een textielartikel als bedoeld in [artikel 1, eerste lid, onder c][ref1], dat behoort tot de categorie
      vloerbedekkingen of tapijt, waarvan de grondlaag en de gebruikslaag uit ten opzichte van elkaar verschillende
      textielvezels is samengesteld, en voor een textielartikel als bedoeld in [artikel 1, tweede lid, onder d][ref2],
      moet tevens de aanduiding "gebruikslaag", voorafgaande aan de in [artikel 2][ref3] bedoelde aanduiding, worden
      gebezigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002932#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002932#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002932#Artikel2
