  - number: '7'
    text: |-
      1 In afwijking van de [artikelen 2][ref1], [3, eerste lid, onder a, en 6, eerste lid, onder b][ref2], is het
      toegestaan voor een textielartikel als in [artikel 6, eerste lid][ref3], bedoeld een aanduiding te bezigen, die
      achtereenvolgens inhoudt de gezamenlijke benaming "andere vezels" voor alle soorten kenmerkende textielvezels,
      waarvan het omgerekende gewicht per soort minder dan 10% van het textielgewicht van dat textielartikel bedraagt,
      en het totale gewicht, verkregen door optelling van het omgerekende gewicht van elk van die soorten kenmerkende
      textielvezels en uitgedrukt in een percentage van het textielgewicht van het betrokken textielartikel.

      2 Het eerste lid geldt niet ten aanzien van een textielartikel als in [artikel 5, tweede lid][ref4] bedoeld.


