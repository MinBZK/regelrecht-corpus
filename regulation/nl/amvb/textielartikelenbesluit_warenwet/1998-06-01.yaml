  - number: '4'
    text: |-
      1 In afwijking van de [artikelen 2, onder ][ref1] is het toegestaan:

      a. de benaming "scheerwol" te bezigen in de aanduiding van een textielartikel, waarvan de kenmerkende textielvezels
      uitsluitend zijn hetzij de textielvezels, omschreven bij nummer 1 van [bijlage I][ref2] van dit besluit, hetzij
      de textielvezels, die te zamen een mengsel vormen als bedoeld in [artikel 3, tweede lid][ref3], voor zover de
      betrokken vezels niet eerder zijn gebruikt voor de samenstelling van een eindprodukt, geen andere dan de voor
      de vervaardiging van dat textielartikel nodige verspinnings- of verviltingsbewerkingen hebben ondergaan en niet
      zodanig behandeld of gebruikt zijn, dat zij daardoor beschadigd zijn;

      b. in de aanduiding van een textielartikel, dat is samengesteld uit een mengsel van, enerzijds, een of meer soorten
      kenmerkende textielvezels die voldoen aan het bepaalde onder *a*, en, anderzijds, een of meer andere soorten
      kenmerkende textielvezels waarvoor de benaming "wol" niet mag worden gebezigd, de benaming onderscheidenlijk de
      gezamenlijke benaming "scheerwol" te bezigen met betrekking tot eerstbedoelde soort onderscheidenlijk soorten
      kenmerkende textielvezels, indien het omgerekende gewicht van die soort onderscheidenlijk het totaal van het
      omgerekende gewicht van die soorten ten minste 25 procent van het textielgewicht van dat textielartikel uitmaakt
      en die soort of soorten vezels, in geval van fijne menging, slechts met een andere soort kenmerkende textielvezels
      zijn gemengd.

      2 Indien toepassing is gegeven aan het eerste lid, is ten aanzien van de gezamenlijk met "scheerwol" aangeduide
      soorten kenmerkende textielvezels het bepaalde in [artikel 3, derde lid][ref4], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002932#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002932
      [ref3]: https://wetten.overheid.nl/BWBR0002932#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0002932#Artikel3
