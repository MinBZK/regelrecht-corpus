preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuurbeheer en Visserij, gedaan mede namens de Staatssecretaris
    van Volksgezondheid, Welzijn en Sport, van 15 juli 1996, nr. J. 966824, Directie Juridische Zaken van het
    Ministerie van Landbouw, Natuurbeheer en Visserij;

    Gelet op richtlijn nr. 93/119/EG van de Raad van de Europese Unie van 22 december 1993 inzake de bescherming
    van dieren bij het slachten of doden (PbEG L 340) en gelet op artikel 44, negende lid, van de Gezondheids- en
    welzijnswet voor dieren;

    De Raad van State gehoord (advies van 18 september 1996, no. W11.96.0293.);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuurbeheer en Visserij, uitgebracht mede namens de
    Staatssecretaris van Volksgezondheid, Welzijn en Sport, van 18 oktober 1996, nr. J. 969678, Directie Juridische
    Zaken van het Ministerie van Landbouw, Natuurbeheer en Visserij;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008316/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

        - *Verordening (EG) nr. 1099/2009:* Verordening (EG) nr. 1099/2009 van de Raad van 24 september 2009 inzake de
      bescherming van dieren bij het doden (PbEU 2009, L 303);
        - *wet:* [Gezondheids- en welzijnswet voor dieren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005662
    url: https://wetten.overheid.nl/BWBR0008316/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005662
  - number: 1a
    text: |-
      Dit besluit berust mede op de [artikelen 44, eerste en tweede lid, van de Gezondheids-en welzijnswet][ref1] voor
      dieren.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel44
    url: https://wetten.overheid.nl/BWBR0008316/2013-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '44'
  - number: '2'
    text: |-
      Dit besluit is van toepassing op dieren die zonder voorafgaande bedwelming worden geslacht volgens de israëlitische
      of de islamitische ritus.
    url: https://wetten.overheid.nl/BWBR0008316/2013-01-01#Artikel2
  - number: '3'
    text: |-
      Het is verboden te handelen in strijd met bij ministeriële regeling aan te wijzen artikelen van Verordening (EG)
      nr. 1099/2009.
    url: https://wetten.overheid.nl/BWBR0008316/2013-01-01#Artikel3
  - number: '4'
    text: |-
      1 Bij ministeriële regeling worden regels gesteld voor een goede uitvoering van Verordening (EG) nr. 1099/2009.

      2 De regels, bedoeld in het eerste lid, kunnen betrekking hebben op:

      a. het aanwijzen van een bevoegde autoriteit;

      b. het verstrekken, schorsen en intrekken van getuigschriften van vakbekwaamheid;

      c. het goedkeuren van opleidingsprogramma’s en de inhoud en uitvoeringsbepalingen van examens;

      d. het uitvoeren van controles en inspectie die relevant zijn voor de bescherming van dieren bij het doden en met
      het doden verband houdende activiteiten;

      e. gidsen voor goede praktijken.
    url: https://wetten.overheid.nl/BWBR0008316/2013-01-01#Artikel4
  - number: '5'
    text: |-
      1 Het onbedwelmd slachten van dieren geschiedt overeenkomstig de door de op grond van
      [artikel 114, eerste lid, van de wet][ref1] aangewezen toezichthouders in het belang van de bescherming van het
      dier gegeven aanwijzingen.

      2 De in het eerste lid bedoelde aanwijzingen kunnen betrekking hebben op:

        - de gang van zaken rond het slachtproces, daaronder mede verstaan de wijze waarop en de volgorde waarin dieren
      worden aangeboden voor de slacht;
        - het aantal personen dat betrokken dient te zijn bij het fixeren, slachten en verbloeden van het dier;
        - het staken van het slachtproces indien onvoldoende is gegarandeerd dat daarbij wordt voldaan aan de eisen van
      Verordening (EG) nr. 1099/2009 en van dit besluit.

      3 Onverminderd het tweede lid mag, naast de bij de slachthandelingen betrokken personen en de personen die tijdens
      de slachthandelingen de israëlitische of islamitische ritus verrichten, ten hoogste één persoon bij het slachten
      aanwezig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel114
    url: https://wetten.overheid.nl/BWBR0008316/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '114'
  - number: '8'
    text: |-
      1 Runderen worden gefixeerd door middel van een toestel dat is voorzien van een tijd-mechanisme dat gedurende 45
      seconden na het bedienen daarvan, de opheffing van de fixatie onmogelijk maakt; dit mechanisme wordt onmiddellijk
      na het toebrengen van de halssnede in werking gesteld.

      2 Na het toebrengen van de halssnede blijven schapen en geiten gedurende tenminste dertig seconden gefixeerd in de
      positie die de dieren innamen op het moment van het toebrengen van de halssnede.
    url: https://wetten.overheid.nl/BWBR0008316/2013-01-01#Artikel8
  - number: '9'
    text: |-
      1 Het toebrengen van de halssnede gebeurt met een vlijmscherp mes door een persoon die niet tevens belast is met
      het fixeren van de dieren.

      2 Bij schapen, geiten en pluimvee worden ten minste gedurende 30 seconden en bij runderen ten minste gedurende 45
      seconden na het aanbrengen van de halssnede geen verdere slachthandelingen verricht.
    url: https://wetten.overheid.nl/BWBR0008316/2013-01-01#Artikel9
  - number: '13'
    text: |-
      Dit besluit treedt in werking met ingang van een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen van artikelen verschillend kan worden vastgesteld.

      Laatstbedoeld besluit wordt niet genomen voordat vier weken zijn verstreken nadat het onderhavige besluit is
      voorgelegd aan de beide kamers der Staten-Generaal, en evenmin indien binnen die termijn door of namens een der
      kamers of door ten minste een vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen wordt
      gegeven dat inwerkingtreding van dit besluit bij wet wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0008316/2013-01-01#Artikel13
  - number: '14'
    text: 'Dit besluit wordt aangehaald als: Besluit ritueel slachten.'
    url: https://wetten.overheid.nl/BWBR0008316/2013-01-01#Artikel14
