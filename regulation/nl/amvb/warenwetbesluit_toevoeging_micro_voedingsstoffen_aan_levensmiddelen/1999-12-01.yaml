preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op voordracht van de Staatssecretaris van Volksgezondheid, Welzijn en Sport, van 25 september 1995, nr DGVgz/
    VVP/L 952051, gedaan in overeenstemming met Onze Ministers van Economische Zaken en van Landbouw, Natuurbeheer
    en Visserij;

    Gelet op artikel 4, eerste lid, onder a en b, artikel 5, eerste lid, onder c, en artikel 8, onder a en c, van de
    Warenwet;

    Gezien het advies van de Voedingsraad van 11 november 1993, nummer 931111/01 en het advies van de Adviescommissie
    Warenwet van 27 juni 1995 met nummer 14877/(2/3)5;

    De Raad van State gehoord (advies van 22 januari 1996, nummer W13.95.0530);

    Gezien het nader rapport van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 14 mei 1996, nummer GZB/
    VVB 96543, uitgebracht in overeenstemming met Onze Ministers van Economische Zaken en van Landbouw, Natuurbeheer
    en Visserij;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008065/1999-12-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. *micro-voedingsstoffen*: voedingsstoffen die onmisbaar zijn voor het functioneren van het menselijk organisme,
      waarin dat organisme niet zelf kan voorzien en die in kleine hoeveelheden geconsumeerd moeten worden;

      b. *verrijkte eet- of drinkwaar*: een eet- of drinkwaar waaraan een of meer micro-voedingsstoffen zijn toegevoegd,
      maar die niet tot hoofddoel heeft het leveren van micro-voedingsstoffen;

      c. *substitutie-produkt*: een verrijkte eet- of drinkwaar:

        - die een bestaande waar beoogt te vervangen, en ten aanzien van uiterlijk, consistentie, smaak, kleur, geur en
      gebruiksdoel zoveel mogelijk overeenkomt met de te vervangen eet- of drinkwaar; en
        - waaraan één of meer micro-voedingsstoffen zijn toegevoegd tot ten hoogste de gehaltes waarin die stoffen van
      nature aanwezig zijn in de te vervangen eet- of drinkwaar;

      d. *gerestaureerde eet- of drinkwaar:* een verrijkte eet- of drinkwaar:

        - die bereid is volgens de richtlijnen van goede produktiepraktijken; en
        - waaraan één of meer micro-voedingsstoffen zijn toegevoegd tot de gehaltes waarin zij vóór de bereiding van nature
      aanwezig waren in het eetbare deel van de waar of in de eetbare delen van de grondstoffen voor de waar, maar die na
      of tijdens de bereiding daaruit zijn verdwenen;

      e. *aanbevolen dagelijkse hoeveelheid*: de hoeveelheid micro-voedingsstof die per dag geconsumeerd moet worden om
      een gezonde voorziening van het menselijk organisme met die stof te verzekeren;

      f. *redelijk geachte dagconsumptie*: de totale hoeveelheid van een eet- of drinkwaar die doorgaans op een dag
      geconsumeerd wordt.

      2 Dit besluit is niet van toepassing op eet- of drinkwaren waaraan uitsluitend uit technologische overwegingen één
      of meer micro-voedingsstoffen zijn toegevoegd.
    url: https://wetten.overheid.nl/BWBR0008065/1999-12-01#Artikel1
  - number: '2'
    text: |-
      1 Het is verboden verrijkte eet- of drinkwaren te bereiden of te verhandelen, die niet voldoen aan de eisen, bij
      dit besluit gesteld met betrekking tot hun samenstelling.

      2 Het is verboden een verrijkte eet- of drinkwaar te bereiden, te behandelen, te verwerken, te verpakken, te
      bewaren of te vervoeren, voordat Onze Minister op de hoogte is gesteld van de bij dit besluit aangewezen gegevens
      betreffende de samenstelling van de waar.

      3 Het is verboden verrijkte eet- of drinkwaren te verhandelen anders dan met inachtneming van de voorschriften, bij
      dit besluit gesteld met betrekking tot hun aanduiding.

      4 Het is verboden verrijkte eet- of drinkwaren te verhandelen anders dan met inachtneming van de voorschriften
      bij dit besluit gesteld met betrekking tot het bezigen van vermeldingen of voorstellingen betreffende de aard,
      samenstelling en eigenschappen van de waar, en de uitwerking die de waar bij gebruik kan hebben op de gezondheid
      van de mens.
    url: https://wetten.overheid.nl/BWBR0008065/1999-12-01#Artikel2
  - number: '3'
    text: |-
      In verrijkte eet- of drinkwaren zijn geen micro-voedingsstoffen aanwezig in hoeveelheden die schadelijk kunnen zijn
      voor de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0008065/1999-12-01#Artikel3
  - number: '4'
    text: |-
      Bij de bereiding van een verrijkte eet- of drinkwaar wordt geen gebruik gemaakt van andere dan de in
      [bijlage 1][ref1] genoemde micro-voedingsstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0008065
    url: https://wetten.overheid.nl/BWBR0008065/1999-12-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008065
  - number: '5'
    text: |-
      De micro-voedingsstoffen vitamine A in de vorm van retinoïden, vitamine D, foliumzuur, seleen, koper en zink
      worden uitsluitend toevoegd aan een verrijkte eet- of drinkwaar om van die waar een substitutie-produkt of een
      gerestaureerde eet- of drinkwaar te maken.
    url: https://wetten.overheid.nl/BWBR0008065/1999-12-01#Artikel5
  - number: 5a
    text: |-
      Aan de in de bijlage, bij [verordening (EG) nr. 2991/94](31994R2991) van de Raad van de Europese Unie van 5
      december 1994 tot vaststelling van normen voor smeerbare vetprodukten (Pb EG L 316), onder B en C, bedoelde vetten,
      aan vloeibare producten die een zelfde gebruiksdoel hebben, en aan bak- en braadproducten, is het toegestaan
      vitamine A en D toe te voegen, waarbij het gehalte aan vitamine A ten hoogste 8 µg RE, en het gehalte aan vitamine
      D ten hoogste 0,075 µg per gram bedraagt.
    url: https://wetten.overheid.nl/BWBR0008065/1999-12-01#Artikel5a
  - number: '6'
    text: |-
      1 De in [bijlage 2][ref1] genoemde vitamines en de in [bijlage 3][ref2] genoemde mineralen worden slechts in
      zodanige hoeveelheden toegevoegd aan een verrijkte eet- of drinkwaar, dat het totaal aanwezige gehalte in een
      redelijk geachte dagconsumptie van die waar ten minste 15% en ten hoogste 100% van de in die bijlage vermelde
      aanbevolen dagelijkse hoeveelheid bedraagt.

      2 De in het eerste lid bedoelde hoeveelheden zijn niet van toepassing voor zover het een substitutie-produkt of een
      gerestaureerde eet- of drinkwaar betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0008065
      [ref2]: https://wetten.overheid.nl/BWBR0008065
    url: https://wetten.overheid.nl/BWBR0008065/1999-12-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008065
      - id: ref2
        bwb_id: BWBR0008065
  - number: '7'
    text: |-
      Ten aanzien van een verrijkte eet- of drinkwaar vindt voedingswaarde-etikettering plaats zoals bedoeld in
      [artikel 3, eerste lid, van het Warenwetbesluit Voedingswaarde-informatie levensmiddelen][ref1]. Bij deze
      voedingswaarde-etikettering wordt tevens een vermelding gebezigd van het gehalte van alle toegevoegde micro-
      voedingsstoffen, voor zover het geen substitutie-produkt of een gerestaureerde eet- of drinkwaar betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0006135#Artikel3
    url: https://wetten.overheid.nl/BWBR0008065/1999-12-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006135
        artikel: '3'
  - number: '8'
    text: |-
      1 In de aanduiding van een verrijkte eet- of drinkwaar, niet zijnde een substitutie-produkt of
      een gerestaureerde eet- of drinkwaar, blijkt de verrijking uitsluitend door de opname van het
      zinsdeel «met toegevoegde voedingsstoffen (vitamines en mineralen)» dan wel van een gelijkwaardige
      zinsnede in een andere voor de consument begrijpelijke taal. Deze zinsnede wordt opgenomen indien
      ten aanzien van de waar een bewering inzake de voedingswaarde wordt gebezigd zoals bedoeld in
      [artikel 1, eerste lid, onder f, van het Warenwetbesluit Voedingswaardeinformatie levensmiddelen][ref1].

      2 In de aanduiding van een gerestaureerde eet- of drinkwaar of een substitutie-produkt blijkt de toevoeging van
      micro-voedingsstoffen uitsluitend door de opname van het zinsdeel «met toegevoegde voedingsstoffen (vitamines en
      mineralen) tot het oorspronkelijke gehalte», of voor zover het een substitutie-produkt betreft van het zinsdeel
      «met toegevoegde voedingsstoffen (vitamines en mineralen) tot het gehalte in het te vervangen produkt» dan wel van
      gelijkwaardige zinsnedes in een andere voor de consument begrijpelijke taal.

      3 Ten aanzien van een verrijkte eet- of drinkwaar wordt geen vermelding gebezigd waaruit zou kunnen worden afgeleid
      dat een evenwichtige voeding op basis van niet-verrijkte eet- of drinkwaren niet alle micro-voedingsstoffen in de
      juiste hoeveelheid kan verschaffen.


      [ref1]: https://wetten.overheid.nl/BWBR0006135#Artikel1
    url: https://wetten.overheid.nl/BWBR0008065/1999-12-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006135
        artikel: '1'
  - number: '9'
    text: |-
      Een verrijkte eet- of drinkwaar wordt niet voor de eerste keer in de handel gebracht, alvorens Onze Minister door
      de desbetreffende verhandelaar op de hoogte is gesteld van de navolgende gegevens betreffende de samenstelling van
      de waar:

      a. het totale gehalte aan de afzonderlijke micro-voedingsstoffen per 100 g, en per redelijk geachte dagconsumptie,
      in relatie tot het beoogde gebruiksdoel;

      b. wat betreft een substitutie-produkt, de gehaltes aan micro-voedingsstoffen in de te vervangen eet- of drinkwaar;
      en

      c. wat betreft een gerestaureerde eet- of drinkwaar, de gehaltes aan micro-voedingsstoffen die vóór de
      bedrijfsmatige bereiding van nature aanwezig waren in het eetbare gedeelte van de waar of de grondstoffen voor
      de waar.
    url: https://wetten.overheid.nl/BWBR0008065/1999-12-01#Artikel9
  - number: 9a
    text: |-
      In de navolgende eet- en drinkwaren mogen jodiumverbindingen aanwezig zijn, met inachtneming van de daarbij
      vermelde voorwaarden:

      a. in keukenzout (natriumchloride) en in keukenzoutvervangers, bestemd voor rechtstreekse consumptie, tot een
      gehalte van ten minste 30 en ten hoogste 40 mg jodium per kg zout;

      b. in brood, bedoeld in het [Warenwetbesluit Meel en brood][ref1], en in op basis van granen samengestelde waren
      die bedoeld zijn om brood te vervangen, uitsluitend door de toevoeging aan die waren van gejodeerd keukenzout met
      een gehalte van ten minste 70 en ten hoogste 85 mg jodium per kg zout;

      c. in vleesproducten, bedoeld in het [Warenwetbesluit Vlees, gehakt en vleesproducten][ref2], uitsluitend door
      de toevoeging aan die waren van gejodeerd nitrietpekelzout met een gehalte van ten minste 20 en ten hoogste 30 mg
      jodium in de vorm van uitsluitend jodaat per kg nitrietpekelzout.

      [Artikel 8, derde lid][ref3], is op deze waren niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009669
      [ref2]: https://wetten.overheid.nl/BWBR0009675
      [ref3]: https://wetten.overheid.nl/BWBR0008065#Artikel8
    url: https://wetten.overheid.nl/BWBR0008065/1999-12-01#Artikel9a
