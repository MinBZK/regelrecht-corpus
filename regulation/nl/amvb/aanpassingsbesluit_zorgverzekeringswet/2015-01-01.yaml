        artikel: '10'
  - number: 1.22.3
    text: |-
      De [artikelen 3.1.3. tot en met 3.1.6. van de Invoerings- en aanpassingswet Zorgverzekeringswet][ref1] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018830#Artikel3
    url: https://wetten.overheid.nl/BWBR0019289/2015-01-01#Artikel1.22
    references:
      - id: ref1
        bwb_id: BWBR0018830
        artikel: '3'
  - number: 1.23.1
    text: |-
      De zorgverzekeraar, bedoeld in [artikel 1, onderdeel b, van de Zorgverzekeringswet][ref1] verlangt van een
      verzekerde als bedoeld in [artikel 1, onderdeel f, van die wet][ref2] die op de dag voorafgaande aan de
      inwerkingtreding van de in [artikel 4.3, tweede lid, van het Besluit zorgverzekering][ref3] genoemde bepalingen
      van [dat besluit][ref4] in het bezit was van een indicatiebesluit, een door een zorgverzekeraar als bedoeld in
      [artikel 1, eerste lid, onderdeel b, van de Algemene Wet Bijzondere Ziektekosten][ref5] verleende toestemming of
      een verwijzing voor de in [dat artikel][ref6] geregelde zorg, niet dat toestemming wordt gevraagd of een verwijzing
      wordt overgelegd. Het indicatiebesluit, de toestemming of de verwijzing gelden als titel voor het verkrijgen van de
      verzekerde prestaties gedurende de periode waarvoor het indicatiebesluit, de toestemming of de verwijzing geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0018492#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0018492
      [ref5]: https://wetten.overheid.nl/BWBR0002614#Artikel1
      [ref6]: https://wetten.overheid.nl/BWBR0002614#Artikel1
    url: https://wetten.overheid.nl/BWBR0019289/2015-01-01#Artikel1.23
    references:
