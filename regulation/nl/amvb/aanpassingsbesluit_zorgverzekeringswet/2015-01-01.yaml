        artikel: '6'
  - number: 1.22.1.a
    text: de verlening van de zorg op of voor die dag is begonnen, of
    url: https://wetten.overheid.nl/BWBR0019289/2015-01-01#Artikel1.22
  - number: 1.22.1.b
    text: |-
      het zorg betreft waarop hij aansluitend aan of in plaats van de onder a bedoelde zorg in redelijkheid is
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0019289/2015-01-01#Artikel1.22
  - number: 1.22.2
    text: |-
      Het eerste lid geldt na de termijn, bedoeld in [artikel 8.3 van de Wet maatschappelijke ondersteuning 2015][ref1]
      niet voor zorg, bedoeld in [artikel 8.1 van die wet][ref2] en geldt na de termijn, bedoeld in
      [artikel 10.1, derde of vierde lid, van de Jeugdwet][ref3] niet voor zorg, bedoeld in artikel 10.1, tweede lid, van
      die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel10
    url: https://wetten.overheid.nl/BWBR0019289/2015-01-01#Artikel1.22
    references:
