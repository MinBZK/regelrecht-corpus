        artikel: '1'
      - id: ref6
        bwb_id: BWBR0002614
        artikel: '1'
  - number: 1.23.2
    text: |-
      Indien een verzekerde als bedoeld in [artikel 1, onderdeel f, van de Zorgverzekeringswet][ref1] ingevolge de
      zorgverzekering recht heeft op de levering van zorg door zijn zorgverzekeraar en op de dag voorafgaande aan de
      inwerkingtreding van de in [artikel 4.3, tweede lid, van het Besluit zorgverzekering][ref2] genoemde bepalingen
      van [dat besluit][ref3] als verzekerde ingevolge de [Algemene Wet Bijzondere Ziektekosten][ref4] in dat artikel
      geregelde zorg ontving van een zorgaanbieder met welke de zorgverzekeraar daartoe geen overeenkomst heeft
      gesloten, heeft de verzekerde desalniettemin recht op zorgverlening door die zorgaanbieder voor rekening van de
      zorgverzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0018492
      [ref4]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0019289/2015-01-01#Artikel1.23
    references:
