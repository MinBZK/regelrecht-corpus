  - number: '1.21'
    text: |-
      Ingetrokken worden:

      a. het [Besluit van 19 december 1991, houdende wijziging van het Inschrijvingsbesluit ziekenfondsverzekering][ref1]
      (Stb. 723);

      b. het
      [Besluit van 19 december 1991, houdende wijziging van het Aanwijzingsbesluit verplicht-verzekerden Ziekenfondswet][ref2]
      (Stb. 1987, 227) (Stb. 727);

      c. het Besluit van 23 december 1991, houdende wijziging van het Besluit uitbreiding en beperking van de toegang tot
      particuliere ziektekostenverzekeringen (Stb. 773);

      d. het
      [Besluit van 9 mei 1994, houdende wijziging van het Inschrijvingsbesluit ziekenfondsverzekering alsmede het Inschrijvingsbesluit bijzondere ziektekostenverzekering 1992][ref3]
      (Stb. 355);

      e. het
      [Besluit van 18 december 1995, houdende wijziging van het Aanwijzingsbesluit verplicht-verzekerden Ziekenfondswet in verband met de invoering van de Wet privatisering ABP (invoering WAO-conforme regeling)][ref4]
      (Stb. 1996, 6);

      f. het
      [Besluit van 16 augustus 1996, houdende wijziging van het Inschrijvingsbesluit ziekenfondsverzekering en het Inschrijvingsbesluit bijzondere ziektekostenverzekering 1992][ref5]
      (Stb. 437);

      g. het
      [Besluit van 24 oktober 1996 tot wijziging van het Verstrekkingenbesluit ziekenfondsverzekering en het Vergoedingenbesluit particulier verzekerden in verband met invoering van een algemeen systeem van eigen bijdragen][ref6]
      (Stb. 541);

      h. het
      [Besluit van 15 november 1996, tot wijziging van het Besluit zorgaanspraken bijzondere ziektekostenverzekering, het Bijdragebesluit zorg, het Verstrekkingenbesluit ziekenfondsverzekering, het Vergoedingenbesluit particulier verzekerden en enige andere besluiten in verband met regeling van de aanspraak op thuiszorg][ref7]
      (Stb. 595);

      i. het
      [Besluit van 27 augustus 1997 tot wijziging van het Besluit zorgaanspraken bijzondere ziektekostenverzekering, het Bijdragebesluit zorg, het Verstrekkingenbesluit ziekenfondsverzekering, het Vergoedingenbesluit particulier verzekerden, het Besluit indicatiebeoordeling verpleging en verzorging en het Administratiebesluit Bijzondere Ziektekostenverzekering in verband met aanpassing van de aanspraak op thuiszorg en de daarvoor verschuldigde bijdragen (aanpassing aanspraak thuiszorg)][ref8]
      (Stb. 388);

      j. het
      [Besluit van 7 november 1997 tot wijziging van het Besluit zorgaanspraken bijzondere ziektekostenverzekering, het Bijdragebesluit zorg, het Verstrekkingenbesluit ziekenfondsverzekering, het Vergoedingenbesluit particulier verzekerden en enige andere besluiten in verband met wijziging van de aanspraak op thuiszorg en enige andere wijzigingen (wijziging aanspraak thuiszorg)][ref9]
      (Stb. 530);

      k. het
      [Besluit van 16 december 1997, houdende wijziging van het Aanwijzingsbesluit verplicht-verzekerden Ziekenfondswet en het Besluit beperking kring verzekerden Ziekenfondswet in verband met het onder de werkingssfeer van de wettelijke werknemersverzekeringen brengen van het overheidspersoneel][ref10]
      (Stb. 715);

      l. het
      [Besluit van 16 december 1997, houdende wijziging van het Aanwijzingsbesluit verplicht-verzekerden Ziekenfondswet en enige andere besluiten in verband met aanpassing van de gronden voor ziekenfondsverzekering][ref11]
      (Stb. 716);

      m. het
      [Besluit van 17 mei 2000 tot wijziging van het Besluit zorgaanspraken bijzondere ziektekostenverzekering en enige andere besluiten in verband met het regelen van de aanspraak op zorg door een verzorgingshuis en het flexibiliseren van de aanspraak op verzorging en verpleging][ref12]
      (Stb. 221);

      n. het
      [Besluit van 23 mei 2001 tot wijziging van het Zorgindicatiebesluit in verband met de uitbreiding van de vormen van zorg waarop dat besluit van toepassing is][ref13]
      (Stb. 265);

      o. het [Besluit invoering individuele tarifering apotheekhoudenden WTG][ref14].


