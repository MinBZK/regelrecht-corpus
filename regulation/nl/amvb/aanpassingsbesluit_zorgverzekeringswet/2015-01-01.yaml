  - number: 1.22.1
    text: |-
      De persoon die op de dag voorafgaande aan de inwerkingtreding van [artikel 1.6, onderdeel A][ref1], verzekerd
      was op grond van [artikel 5 van de Algemene Wet Bijzondere Ziektekosten][ref2], en aanspraak had op een
      uitkering als bedoeld in [artikel 20, eerste lid, onder b, van het Besluit zorgaanspraken AWBZ][ref3], behoudt
      aanspraak op zodanige uitkering voor de kosten van zorg waarop op die dag aanspraak bestond op grond van
      [artikel 6 van de Algemene Wet Bijzondere Ziektekosten][ref4], voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0019289#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0014149#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0019289/2015-01-01#Artikel1.22
    references:
      - id: ref1
        bwb_id: BWBR0019289
        artikel: '1'
