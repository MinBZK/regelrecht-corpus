  - number: '1.22'
    text: |-
      1 De persoon die op de dag voorafgaande aan de inwerkingtreding van [artikel 1.6, onderdeel A][ref1], verzekerd
      was op grond van [artikel 5 van de Algemene Wet Bijzondere Ziektekosten][ref2], en aanspraak had op een
      uitkering als bedoeld in [artikel 20, eerste lid, onder b, van het Besluit zorgaanspraken AWBZ][ref3], behoudt
      aanspraak op zodanige uitkering voor de kosten van zorg waarop op die dag aanspraak bestond op grond van
      [artikel 6 van de Algemene Wet Bijzondere Ziektekosten][ref4], voor zover:

      a. de verlening van de zorg op of voor die dag is begonnen, of

      b. het zorg betreft waarop hij aansluitend aan of in plaats van de onder a bedoelde zorg in redelijkheid is
      aangewezen.

      2 Het eerste lid geldt na de termijn, bedoeld in [artikel 8.3 van de Wet maatschappelijke ondersteuning 2015][ref5]
      niet voor zorg, bedoeld in [artikel 8.1 van die wet][ref6] en geldt na de termijn, bedoeld in
      [artikel 10.1, derde of vierde lid, van de Jeugdwet][ref7] niet voor zorg, bedoeld in artikel 10.1, tweede lid, van
      die wet.

      3 De [artikelen 3.1.3. tot en met 3.1.6. van de Invoerings- en aanpassingswet Zorgverzekeringswet][ref8] zijn van
      overeenkomstige toepassing.


