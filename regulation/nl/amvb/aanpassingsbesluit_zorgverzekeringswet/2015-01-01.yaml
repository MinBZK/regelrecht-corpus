  - number: '9.1'
    text: >-
      Ten aanzien van aanspraken, rechten en verplichtingen welke voor het tijdstip van inwerkingtreding van dit besluit
      zijn ontstaan krachtens bij dit besluit ingetrokken algemene maatregelen van bestuur, dan wel na dat tijdstip
      zijn ontstaan terzake van de afwikkeling van zodanige maatregelen, blijft het recht van toepassing zoals dat gold
      voorafgaand aan dat tijdstip, behoudens voor zover in dit besluit afwijkende regels zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0019289/2015-01-01#Artikel9.1
  - number: '9.3'
    text: 'Dit besluit wordt aangehaald als: Aanpassingsbesluit Zorgverzekeringswet.'
    url: https://wetten.overheid.nl/BWBR0019289/2015-01-01#Artikel9.3
