  - number: '1.23'
    text: |-
      1 De zorgverzekeraar, bedoeld in [artikel 1, onderdeel b, van de Zorgverzekeringswet][ref1] verlangt van
      een verzekerde als bedoeld in [artikel 1, onderdeel f, van die wet][ref2] die op de dag voorafgaande aan de
      inwerkingtreding van de in [artikel 4.3, tweede lid, van het Besluit zorgverzekering][ref3] genoemde bepalingen
      van [dat besluit][ref4] in het bezit was van een indicatiebesluit, een door een zorgverzekeraar als bedoeld in
      [artikel 1, eerste lid, onderdeel b, van de Algemene Wet Bijzondere Ziektekosten][ref5] verleende toestemming of
      een verwijzing voor de in [dat artikel][ref6] geregelde zorg, niet dat toestemming wordt gevraagd of een verwijzing
      wordt overgelegd. Het indicatiebesluit, de toestemming of de verwijzing gelden als titel voor het verkrijgen van de
      verzekerde prestaties gedurende de periode waarvoor het indicatiebesluit, de toestemming of de verwijzing geldt.

      2 Indien een verzekerde als bedoeld in [artikel 1, onderdeel f, van de Zorgverzekeringswet][ref7] ingevolge de
      zorgverzekering recht heeft op de levering van zorg door zijn zorgverzekeraar en op de dag voorafgaande aan de
      inwerkingtreding van de in [artikel 4.3, tweede lid, van het Besluit zorgverzekering][ref8] genoemde bepalingen
      van [dat besluit][ref9] als verzekerde ingevolge de [Algemene Wet Bijzondere Ziektekosten][ref10] in dat artikel
      geregelde zorg ontving van een zorgaanbieder met welke de zorgverzekeraar daartoe geen overeenkomst heeft
      gesloten, heeft de verzekerde desalniettemin recht op zorgverlening door die zorgaanbieder voor rekening van de
      zorgverzekeraar.


