preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 5 juli
    2004, nr. MJZ2004065790, Directie Juridische Zaken, Afdeling Wetgeving;

    Gelet op richtlijn nr. 2001/81/EG van het Europees Parlement en de Raad van de Europese Unie van 23 oktober 2001
    inzake nationale emissieplafonds voor bepaalde luchtverontreinigende stoffen (PbEG L 309) en artikel 59, eerste
    lid, van de Wet inzake de luchtverontreiniging;

    De Raad van State gehoord (advies van 29 juli 2004, nr. W08.04.0325/V);

    Gezien het nader rapport van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 9
    november 2004, nr. MJZ2004112441, Directie Juridische Zaken, Afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0017526/2017-11-18#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder nec-richtlijn: richtlijn (EU) 2016/2284 van het Europees Parlement en de Raad
      van 14 december 2016 betreffende de vermindering van nationale emissies van bepaalde luchtverontreinigende stoffen,
      tot wijziging van [Richtlijn 2003/35/EG](32003L0035) en tot intrekking van [Richtlijn 2001/81/EG](32001L0081) (PbEU
      L344).
    url: https://wetten.overheid.nl/BWBR0017526/2017-11-18#Artikel1
  - number: '2.1'
    text: |-
      Onze Minister draagt zorg voor de uitvoering van de verplichtingen tot het opstellen en actualiseren van
      inventarissen en prognoses als bedoeld in artikel 8, eerste tot en met het vierde lid, en de monitoring, bedoeld in
      artikel 9, eerste lid, van de nec-richtlijn.
    url: https://wetten.overheid.nl/BWBR0017526/2017-11-18#Artikel2
  - number: '2.2'
    text: |-
      Het opstellen en actualiseren van de inventarissen en prognoses en de monitoring geschieden overeenkomstig bijlage
      IV respectievelijk bijlage V bij de nec-richtlijn.
    url: https://wetten.overheid.nl/BWBR0017526/2017-11-18#Artikel2
  - number: '2.3'
    text: |-
      Een wijziging van artikel 8, eerste tot en met vierde lid, en artikel 9, eerste lid, van de nec-richtlijn gaat
      voor de toepassing van het eerste lid gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn
      uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een
      ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0017526/2017-11-18#Artikel2
  - number: '2.4'
    text: |-
      Een wijziging van bijlage IV en bijlage V bij de nec-richtlijn gaat voor de toepassing van het tweede lid gelden
      met ingang van de dag waarop aan de desbetreffende wijziging uitvoering moet zijn gegeven, tenzij bij ministerieel
      besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0017526/2017-11-18#Artikel2
  - number: '3'
    text: |-
      Onze Minister draagt zorg voor de uitvoering van de verplichtingen, bedoeld in artikel 10, eerste, tweede en vierde
      lid, van de nec-richtlijn.
    url: https://wetten.overheid.nl/BWBR0017526/2017-11-18#Artikel3
  - number: '4'
    text: |-
      Indien het bij koninklijke boodschap van 7 februari 2004 ingediende voorstel van wet tot wijziging van de Wet
      inzake de luchtverontreiniging (uitvoering EG-richtlijn nationale emissieplafonds) (Kamerstukken 29 422) nadat het
      tot wet is verheven, in werking treedt, treedt dit besluit op hetzelfde tijdstip in werking.
    url: https://wetten.overheid.nl/BWBR0017526/2017-11-18#Artikel4
  - number: '5'
    text: 'Dit besluit wordt aangehaald als: Besluit uitvoering EG-richtlijn nationale emissieplafonds.'
    url: https://wetten.overheid.nl/BWBR0017526/2017-11-18#Artikel5
