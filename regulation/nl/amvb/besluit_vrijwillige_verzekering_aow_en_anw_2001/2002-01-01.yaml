preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid, J.F. Hoogervorst, van 29 januari
    2001, Directie Sociale Verzekeringen, Nr. SV/GSV/01/4340;

    Gelet op de artikelen 35, vijfde lid, en 38, tweede lid, van de Algemene Ouderdomswet, 63a, vijfde lid, van de
    Algemene nabestaandenwet, en 25, 26, tweede lid, en 27, derde lid, van de Wet financiering volksverzekeringen;

    De Raad van State gehoord (advies van 16 februari 2001, nr. W12.01.0059/IV);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid, J.F. Hoogervorst, van 1 mei
    2001, Directie Sociale Verzekeringen, Nr. SV/GSV/01/11.779;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel1
  - number: 1.a
    text: |-
      de AOW: de[ Algemene Ouderdomswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 1.b
    text: |-
      de ANW: de [Algemene nabestaandenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 1.c
    text: |-
      de WFV: de[ Wet financiering volksverzekeringen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004538
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004538
  - number: 1.d
    text: |-
      de SVB: de Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '6'
  - number: 1.e
    text: 'de AOW-premie: de premie voor de vrijwillige algemene ouderdomsverzekering;'
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel1
  - number: 1.f
    text: 'de ANW-premie: de premie voor de vrijwillige algemene nabestaandenverzekering;'
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel1
  - number: 1.g
    text: 'de premie: de AOW-premie dan wel de ANW-premie.'
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel1
  - number: '2.1'
    text: |-
      De SVB deelt de gewezen verzekerde, bedoeld in [artikel 35 van de AOW][ref1], zo spoedig mogelijk nadat hij een
      aanvraag tot gebruikmaking van de vrijwillige verzekering heeft ingediend, mee:


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel35
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '35'
  - number: 2.1.a
    text: de hoogte van de verschuldigde AOW-premie;
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel2
  - number: 2.1.b
    text: de termijn waarbinnen de AOW-premie betaald dient te worden; en
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel2
  - number: 2.1.c
    text: de wijze waarop de betaling van de AOW-premie aan de SVB dient plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel2
  - number: '2.2'
    text: |-
      De gewezen verzekerde, die is toegelaten tot de vrijwillige verzekering, betaalt de AOW-premie, per kalenderjaar,
      vooruit.
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel2
  - number: '2.3'
    text: |-
      Indien de vrijwillige verzekering, bedoeld in [artikel 35, eerste lid, van de AOW][ref1], is geëindigd op grond van
      [artikel 37, eerste lid, onderdelen a, e of f, van de AOW][ref2], dan vindt restitutie van eenmaal betaalde AOW-
      premie niet plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel37
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '37'
  - number: '3.1'
    text: |-
      Ten aanzien van de verzekerde, bedoeld in [artikel 38 van de AOW][ref1], is [artikel 2, eerste en derde lid][ref2],
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0012465#Artikel2
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0012465
        artikel: '2'
        hoofdstuk: II
  - number: '3.2'
    text: |-
      Indien binnen drie maanden na de door de SVB gestelde termijn de verschuldigde AOW-premie niet geheel is betaald,
      wordt over het zodanig gedeelte van de periode, waarop de premiebetaling betrekking heeft, geacht AOW-premie te
      zijn betaald als de betaalde AOW-premie zich verhoudt tot de totaal verschuldigde AOW-premie. Daarbij wordt geacht
      AOW-premie te zijn betaald over de periode, welke het verst verwijderd ligt van het tijdstip van de aanvang van de
      verplichte verzekering.
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel3
  - number: '4.1'
    text: |-
      Ten aanzien van de gewezen verzekerde, bedoeld in [artikel 63a van de ANW][ref1], is [artikel 2][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel63a
      [ref2]: https://wetten.overheid.nl/BWBR0012465#Artikel2
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: 63a
      - id: ref2
        bwb_id: BWBR0012465
        artikel: '2'
        hoofdstuk: II
  - number: '4.2'
    text: |-
      Indien de gewezen verzekerde, bedoeld in [artikel 63a van de ANW][ref1], een aanvraag tot gebruikmaking van de
      vrijwillige verzekering heeft ingediend en overlijdt, voordat hij de verschuldigde ANW-premie heeft kunnen betalen,
      is een ander bevoegd alsnog de verschuldigde ANW-premie over de periode van vrijwillige verzekering te betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel63a
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: 63a
  - number: '5.1'
    text: |-
      De premie wordt, voor elk in de periode van vrijwillige verzekering gelegen vol kalenderjaar, vastgesteld volgens
      de formule: P x H – K Waarbij:
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel5
  - number: 5.1.a
    text: 'P voorstelt:'
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel5
  - number: 5.1.a.1°
    text: |-
      indien er uitsluitend sprake is van vrijwillige verzekering op grond van de [AOW][ref1], het percentage dat op
      grond van [artikel 10a van de WFV][ref2] voor dat kalenderjaar wordt vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0004538#Artikel10a
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0004538
        artikel: 10a
  - number: 5.1.a.2°
    text: |-
      indien er uitsluitend sprake is van vrijwillige verzekering op grond van de [ANW][ref1], het percentage dat op
      grond van [artikel 11 van de WFV][ref2] voor dat kalenderjaar wordt vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0004538#Artikel11
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0004538
        artikel: '11'
  - number: 5.1.a.3°
    text: |-
      indien er sprake is van zowel vrijwillige verzekering op grond van de [AOW][ref1] als vrijwillige verzekering
      op grond van de [ANW][ref2], het totaal van de percentages die op grond van [artikel 10a][ref3] en
      [artikel 11 van de WFV][ref4] voor dat kalenderjaar worden vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
      [ref3]: https://wetten.overheid.nl/BWBR0004538#Artikel10a
      [ref4]: https://wetten.overheid.nl/BWBR0004538#Artikel11
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0007795
      - id: ref3
        bwb_id: BWBR0004538
        artikel: 10a
      - id: ref4
        bwb_id: BWBR0004538
        artikel: '11'
  - number: 5.1.b
    text: |-
      H voorstelt: het hoogste bedrag dat als premie-inkomen in de zin van [artikel 8 van de WFV][ref1] in
      aanmerking genomen wordt, te weten het als tweede vermelde bedrag in kolom II van de tarieftabel in
      [artikel 2.10 van de Wet inkomstenbelasting 2001][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004538#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004538
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 5.1.c
    text: 'K voorstelt:'
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel5
  - number: 5.1.c.1°
    text: |-
      indien er uitsluitend sprake is van vrijwillige verzekering op grond van de [AOW][ref1]: de algemene
      heffingskorting, bedoeld in [artikel 8.10 van de Wet inkomstenbelasting 2001][ref2], vermenigvuldigd
      met een breuk, met in de teller het percentage dat op grond van [artikel 10a van de WFV][ref3] voor dat
      kalenderjaar wordt vastgesteld en in de noemer de som van de percentages, bedoeld in de [artikelen 10a][ref4]
      en [11 van de WFV][ref5], en het percentage behorende bij de eerste belastingschijf, bedoeld in
      [artikel 2.10 van de Wet inkomstenbelasting 2001][ref6], zoals die percentages voor dat kalenderjaar worden
      vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0004538#Artikel10a
      [ref4]: https://wetten.overheid.nl/BWBR0004538#Artikel10a
      [ref5]: https://wetten.overheid.nl/BWBR0004538#Artikel11
      [ref6]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0004538
        artikel: 10a
      - id: ref4
        bwb_id: BWBR0004538
        artikel: 10a
      - id: ref5
        bwb_id: BWBR0004538
        artikel: '11'
      - id: ref6
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 5.1.c.2°
    text: |-
      indien er uitsluitend sprake is van vrijwillige verzekering op grond van de [ANW][ref1]: de algemene
      heffingskorting, bedoeld in [artikel 8.10 van de Wet inkomstenbelasting 2001][ref2], vermenigvuldigd
      met een breuk, met in de teller het percentage dat op grond van [artikel 11 van de WFV][ref3] voor dat
      kalenderjaar wordt vastgesteld en in de noemer de som van de percentages, bedoeld in de [artikelen 10a][ref4]
      en [11 van de WFV][ref5], en het percentage behorende bij de eerste belastingschijf, bedoeld in
      [artikel 2.10 van de Wet inkomstenbelasting 2001][ref6], zoals die percentages voor dat kalenderjaar worden
      vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0004538#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0004538#Artikel10a
      [ref5]: https://wetten.overheid.nl/BWBR0004538#Artikel11
      [ref6]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0004538
        artikel: '11'
      - id: ref4
        bwb_id: BWBR0004538
        artikel: 10a
      - id: ref5
        bwb_id: BWBR0004538
        artikel: '11'
      - id: ref6
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 5.1.c.3°
    text: |-
      indien er sprake is van zowel vrijwillige verzekering op grond van de [AOW][ref1] als
      vrijwillige verzekering op grond van de [ANW][ref2]: de algemene heffingskorting, bedoeld in
      [artikel 8.10 van de Wet inkomstenbelasting 2001][ref3], vermenigvuldigd met een breuk, met in de teller de
      som van de percentages die op grond van de [artikelen 10a][ref4] en [11 van de WFV][ref5] voor dat kalenderjaar
      worden vastgesteld en in de noemer de som van de percentages, bedoeld in de [artikelen 10a ][ref6]en
      [11 van de WFV][ref7], en het percentage behorende bij de eerste belastingschijf, bedoeld in
      [artikel 2.10 van de Wet inkomstenbelasting 2001][ref8], zoals die percentages voor dat kalenderjaar worden
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0004538#Artikel10a
      [ref5]: https://wetten.overheid.nl/BWBR0004538#Artikel11
      [ref6]: https://wetten.overheid.nl/BWBR0004538#Artikel10a
      [ref7]: https://wetten.overheid.nl/BWBR0004538#Artikel11
      [ref8]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0007795
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0004538
        artikel: 10a
      - id: ref5
        bwb_id: BWBR0004538
        artikel: '11'
      - id: ref6
        bwb_id: BWBR0004538
        artikel: 10a
      - id: ref7
        bwb_id: BWBR0004538
        artikel: '11'
      - id: ref8
        bwb_id: BWBR0011353
        artikel: '2'
  - number: '5.2'
    text: |-
      In afwijking van het eerste lid wordt indien ten aanzien van de SVB aannemelijk wordt gemaakt dat zulks tot
      een lagere uitkomst leidt, H voorgesteld door het feitelijke premie-inkomen voor de premieheffing in de zin van
      [artikel 8 van de WFV][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004538#Artikel8
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004538
        artikel: '8'
  - number: '5.3'
    text: |-
      De met toepassing van het tweede lid vastgestelde premie bedraagt ten minste 10% van de premie vastgesteld op grond
      van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel5
  - number: '6.1'
    text: |-
      Bij de toepassing van [artikel 5][ref1] wordt de waarde van inkomen in natura door de SVB geschat, waarbij wordt
      uitgegaan van de waarde van dat inkomen in het land, waar het wordt of werd ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0012465#Artikel5
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012465
        artikel: '5'
        hoofdstuk: III
  - number: '6.2'
    text: |-
      2. Bij de toepassing van [artikel 5][ref1] wordt niet in euro ontvangen inkomen omgerekend in euro met behulp van
      de door de Europese Centrale Bank geadviseerde wisselkoersen.


      [ref1]: https://wetten.overheid.nl/BWBR0012465#Artikel5
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012465
        artikel: '5'
        hoofdstuk: III
  - number: '7'
    text: 'De SVB kan de verschuldigde premie over een bepaald kalenderjaar voorlopig vaststellen:'
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel7
  - number: 7.a
    text: |-
      indien zij bij de vaststelling van die premie rekening dient te houden met de in dat kalenderjaar verschuldigde
      premie op grond van de verplichte verzekering; of
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel7
  - number: 7.b
    text: |-
      indien nog onduidelijk is of [artikel 5, tweede lid][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0012465#Artikel5
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012465
        artikel: '5'
        hoofdstuk: III
  - number: '8'
    text: |-
      Voorzover de premiebetaling slechts betrekking heeft op een gedeelte van een kalenderjaar ondergaat de premie een
      naar tijdsruimte evenredige vermindering.
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel8
  - number: '9.1'
    text: |-
      Indien de vrijwillige verzekering is geëindigd, wordt voorzover dit nog niet heeft plaatsgevonden, de over ieder
      kalenderjaar verschuldigde premie definitief vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel9
  - number: '9.2'
    text: |-
      Indien het eerste lid toepassing heeft gevonden, wordt de betaalde premie geacht betrekking te hebben op de
      achtereenvolgende gehele kalenderjaren of, zo de belanghebbende gedurende slechts een gedeelte van een of meer
      kalenderjaren niet verplicht verzekerd was, op alle betreffende gedeelten van de gehele kalenderjaren, die het
      dichtst liggen bij het tijdstip waarop de verplichte verzekering is geëindigd.
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel9
  - number: '9.3'
    text: |-
      Indien na toepassing van het eerste lid de over een kalenderjaar verschuldigde premie niet geheel blijkt te zijn
      voldaan, wordt over een zodanig gedeelte van dit kalenderjaar geacht premie te zijn betaald, als de nog toe te
      rekenen premie zich verhoudt tot de totaal over dit kalenderjaar verschuldigde premie.
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel9
  - number: '10'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van dit besluit.
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel10
  - number: '11'
    text: Het Besluit vrijwillige verzekering AOW en Anw wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel11
  - number: '12'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst, en werkt terug tot en met 1 januari 2001.
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel12
  - number: '13'
    text: 'Dit besluit wordt aangehaald als: Besluit vrijwillige verzekering AOW en ANW 2001.'
    url: https://wetten.overheid.nl/BWBR0012465/2002-01-01#Artikel13
