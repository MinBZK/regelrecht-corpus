  - number: '47'
    text: |-
      [Artikel 46][ref1] is van overeenkomstige toepassing ten aanzien van

      a. degene die met gunstig gevolg het eerste gedeelte van het examen heeft afgelegd volgens het reglement,
      vastgesteld bij het koninklijk besluit van 5 juli 1974 (*Stb.* 402), en het ter uitvoering daarvan vastgestelde
      programma;

      b. degene die met gunstig gevolg het examen heeft afgelegd volgens het reglement en programma van het koninklijk
      besluit van 25 augustus 1949 (*Stb.* J 407) zoals voor 1 mei 1974 gold, en tevens met gunstig gevolg het aanvullend
      examen heeft afgelegd op grond van artikel III*a* van het koninklijk besluit van 5 juli 1974 (*Stb.* 402) dan wel
      op grond van [artikel 43, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003473#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0003473#Artikel43
