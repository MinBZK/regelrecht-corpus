$id: staatsexamenbesluit_spd_bedrijfsadministratie
regulatory_layer: AMVB
publication_date: '2021-11-05'
valid_from: '1997-01-29'
bwb_id: BWBR0003473
url: https://wetten.overheid.nl/BWBR0003473/1997-01-29
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs en Wetenschappen, drs. K. de Jong Ozn., van 27 augustus
    1981, nr. 2216/3436, centrale directie Wetgeving en Juridische Zaken, gedaan mede namens de Staatssecretaris van
    Economische Zaken;

    Overwegende dat het wenselijk is de regeling van het examen ter verkrijging van het staatspraktijkdiploma voor
    bedrijfsadministratie geregeld in het Koninklijk besluit van 25 augustus 1949 (Stb. J 407) te herzien, en in te
    passen in het kader van de Wet op het voortgezet onderwijs (Stb. 1967, 387);

    Gelet op artikel 60, tweede lid, van de Wet op het voortgezet onderwijs;

    De Onderwijsraad gehoord (advies van 26 juni 1981, nr. 190 W.V.O.);

    De Raad van State gehoord (advies van 18 november 1981, nr. 811111/12);

    Gezien het nader rapport van de Staatssecretaris van Onderwijs en Wetenschappen, drs. W. J. Deetman, van 6 januari
    1982, nr. 2594/3436, centrale directie Wetgeving en Juridische Zaken, gedaan mede namens de Staatssecretaris van
    Economische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      "Onze Minister": Onze Minister van Onderwijs en Wetenschappen;

      "Informatie Beheer Groep": de Informatie Beheer Groep, genoemd in de
      [Wet verzelfstandiging Informatiseringsbank][ref1];

      "het examen": het examen ter verkrijging van het staatspraktijkdiploma voor bedrijfsadministratie;

      "het deelexamen": gedeelte van het examen waarvoor een certificaat, als bedoeld in [artikel 27][ref2], wordt
      uitgereikt;

      "het diploma": het staatspraktijkdiploma voor bedrijfsadministratie;

      "de examencommissie": de commissie belast met het afnemen van het examen;

      "de voorzitter": de voorzitter van de examencommissie;

      "de kandidaat": degene die zich bij de examencommissie heeft aangemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006320
      [ref2]: https://wetten.overheid.nl/BWBR0003473#Artikel27
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006320
      - id: ref2
        bwb_id: BWBR0003473
        artikel: '27'
        hoofdstuk: IV
  - number: '2'
    text: |-
      1 De Informatie Beheer Groep benoemt na overleg met Onze Minister van Economische Zaken de voorzitter, de
      ondervoorzitters, de secretaris, de adjunct-secretarissen, de overige leden en de plaatsvervangende leden van de
      examencommissie.

      2 Het lidmaatschap van een lid of een plaatsvervangend lid van de examencommissie eindigt

      a. door overlijden;

      b. bij het einde van het jaar waarin het lid de leeftijd van 70 jaar bereikt;

      c. door het verstrijken van de termijn waarvoor de benoeming is geschied;

      d. door ontslag al dan niet op eigen verzoek.

      3 De examencommissie stelt de opgaven vast en beoordeelt het examenwerk.

      4 De examencommissie kan zich laten bijstaan door de plaatsvervangende leden, doch uitsluitend voor het beoordelen
      van het examenwerk alsmede voor het uitoefenen van de functies van examenleider en toezichthouder.
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel2
  - number: '3'
    text: |-
      Voor elke plaats waar examen wordt afgenomen, wijst de voorzitter één van de leden of plaatsvervangende leden van
      de examencommissie aan als examenleider en stelt hij een voldoende aantal toezichthouders aan. De examenleider is
      namens de voorzitter en onder diens verantwoordelijkheid belast met de leiding van het examen op de plaats waar dit
      wordt afgenomen.
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel3
  - number: '4'
    text: |-
      1 De leden en plaatsvervangende leden van de examencommissie en de toezichthouders genieten uit 's Rijks kas
      vacatiegelden en vergoeding van reis- en verblijfkosten.

      2 Voor het beoordelen van het examenwerk wordt uit 's Rijks kas een vergoeding verstrekt volgens door Onze Minister
      vast te stellen regels.
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel4
  - number: '5'
    text: |-
      1 Er is een commissie van advies. Onze Minister van Economische Zaken benoemt de leden daarvan voor een periode van
      ten hoogste vijf jaren en voorziet in tussentijdse vacatures.

      2 De commissie van advies heeft tot taak de examencommissie bij te staan. Zij bestaat uit ten hoogste vijf leden.

      3 De leden zijn bevoegd alle vergaderingen van de examencommissie bij te wonen. Zij hebben in deze vergadering een
      adviserende stem.

      4 De commissie van advies is bevoegd van haar bevindingen afzonderlijk verslag uit te brengen aan Onze Minister van
      Economische Zaken.

      5 De leden genieten uit 's Rijks kas vacatiegeld en vergoeding van reis- en verblijfkosten.
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel5
  - number: '6'
    text: |-
      1 Ten minste éénmaal per jaar wordt gelegenheid gegeven tot het afleggen van het examen, op een door de Informatie
      Beheer Groep daarvoor aan te wijzen tijdstip en plaats.

      2 De Informatie Beheer Groep maakt bekend voor welk tijdstip, bij wie en op welke wijze zij die aan het examen
      willen deelnemen, zich moeten aanmelden.
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel6
  - number: '8'
    text: |-
      1 Het examengeld voor één of meer deelexamens is verschuldigd bij de aanmelding en bedraagt f 50,-, vermeerderd met
      een bedrag van f 40,- voor elk deelexamen waarvoor men zich aanmeldt.

      2 Het verschuldigde bedrag wordt voldaan op de wijze en vóór de datum door de voorzitter aan te geven.

      3 De kandidaat die het examengeld niet of niet tijdig heeft voldaan, wordt uitgesloten van deelname aan het examen
      waarvoor hij zich heeft aangemeld.

      4 De voorzitter stort de examengelden in 's Rijks kas na aftrek van de kosten van de examencommissie, waaronder
      begrepen worden de vergoedingen aan de toezichthouders, bedoeld in [artikel 4, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003473#Artikel4
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003473
        artikel: '4'
        hoofdstuk: I
        paragraaf: '2'
  - number: '9'
    text: Het examen bestaat uit deelexamens en wordt uitsluitend schriftelijk afgenomen.
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel9
  - number: '10'
    text: |-
      De deelexamens zijn:

      a. bedrijfseconomie I,

      b. economisch-technische verschijnselen,

      c. statistiek,

      d. bedrijfscalculatie,

      e. bedrijfsadministratie,

      f. bedrijfseconomie II, en,

      g. bedrijfsrecht.
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel10
  - number: '11'
    text: |-
      Onze Minister stelt na overleg met Onze Minister van Economische Zaken het examenprogramma vast. Dit is gericht
      op toetsing van de kennis en de vaardigheid die geëist wordt van leidende financieel-economische, administratieve
      functionarissen en houdt een omschrijving in van de examenstof voor ieder deelexamen.
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel11
  - number: '13'
    text: |-
      Zij die aan het examen deelnemen, zijn verplicht zich op verzoek van hen die het examen afnemen of daarop
      toezicht houden, te legitimeren. In de oproep voor het examen staat vermeld op welke wijze de kandidaat zich kan
      legitimeren.
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel13
  - number: '14'
    text: |-
      De voorzitter draagt er zorg voor dat de dagen, door de Informatie Beheer Groep voor het examen aangewezen,
      het rooster voor dit examen en de plaats waar dit examen wordt afgenomen, tijdig aan iedere kandidaat worden
      medegedeeld.
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel14
  - number: '15'
    text: |-
      De examenopgaven worden met de vereiste zorg voor geheimhouding op rijkskosten gedrukt en verzonden aan diegenen
      die de voorzitter daarvoor aanwijst. Op de enveloppen worden aangegeven het onderdeel waarop de inhoud betrekking
      heeft, de datum en het tijdstip waarop de opgaven aan de kandidaten moeten worden voorgelegd en de tijd die voor
      het werk beschikbaar is. De voorzitter draagt er zorg voor dat deze enveloppen met de vereiste geheimhouding in
      ongeopende staat bewaard worden tot het in [artikel 16, derde lid][ref1], bedoeld tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0003473#Artikel16
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003473
        artikel: '16'
        hoofdstuk: III
  - number: '16'
    text: |-
      1 De kandidaten maken het werk onder toezicht van ten minste twee leden van de examencommissie of door de
      voorzitter benoemde toezichthouders.

      2 De examenleider maakt een proces-verbaal op over het verloop van het examen.

      3 Nadat bij het examen in enig deelexamen de examenleider de zich op de enveloppe bevindende gegevens, bedoeld
      in [artikel 15][ref1], heeft gelezen en in orde bevonden, opent hij de enveloppe in tegenwoordigheid van de
      kandidaten. Indien niet alle kandidaten bij het examen in één lokaal van hetzelfde gebouw kunnen worden geplaatst,
      geschiedt het openen in één van de voor dit examen bestemde lokalen.

      4 Onmiddellijk nadat de enveloppe geopend is, worden de opgaven rondgedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003473#Artikel15
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003473
        artikel: '15'
        hoofdstuk: III
  - number: '17'
    text: |-
      1 Het werk wordt gemaakt op papier, verstrekt door of vanwege de voorzitter.

      2 De kandidaat plaatst aan de rechterbovenkant van het papier zijn examennummer, tenzij een andere plaats is
      aangegeven.

      3 Over de opgaven worden geen mededelingen of inlichtingen van welke aard of door wie ook aan de kandidaten
      verstrekt, tenzij door de voorzitter of diegene die daartoe uitdrukkelijk door de voorzitter is gemachtigd.

      4 Het meenemen en gebruiken van boeken en andere hulpmiddelen is de kandidaat verboden met uitzondering van die
      waarvan het gebruik door de examencommissie is toegestaan. De toegestane boeken en andere hulpmiddelen worden door
      de kandidaten meegenomen in het examenlokaal en worden voor de aanvang van het examen door hen die met het toezicht
      zijn belast, onderzocht.

      5 Gedurende het examen is het de kandidaat niet geoorloofd zich zonder toestemming van één van degenen die toezicht
      houden, uit het examenlokaal te verwijderen.

      6 De kandidaten leveren hun werk in bij een van degenen die toezicht houden.
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel17
  - number: '18'
    text: |-
      1 Indien een kandidaat zich ten aanzien van enig deel van het examen aan enige onregelmatigheid schuldig maakt,
      kan de examenleider hem de deelneming of de verdere deelneming aan het examen ontzeggen, dan wel minder vergaande
      maatregelen nemen. Indien de ontzegging betrekking heeft op een kandidaat die meer dan één deelexamen aflegt, kan
      de ontzegging het geheel aan deelexamens omvatten.

      2 Indien de onregelmatigheid eerst wordt ontdekt na afloop van het examen, kan de examencommissie de kandidaat
      het diploma, bedoeld in [artikel 28][ref1], of het certificaat, bedoeld in [artikel 27][ref2] en de cijferlijst
      onthouden of kan zij bepalen, dat de betrokken kandidaat het diploma of het certificaat en de cijferlijst slechts
      kunnen worden uitgereikt na een hernieuwd examen in de door de examencommissie aan te wijzen onderdelen en op de
      door haar te bepalen wijze.

      3 De beslissing bedoeld in het eerste of tweede lid wordt terstond in afschrift toegezonden aan de voorzitter.

      4 De kandidaat kan tegen een beslissing van de examenleider en tegen een beslissing van de examencommissie, in
      beroep gaan bij de door de Informatie Beheer Groep in te stellen commissie van beroep. Van de commissie van beroep
      mogen leden van de examencommissie geen deel uitmaken. In overeenstemming met [artikel 30][ref3] wordt het beroep
      binnen drie dagen nadat de beslissing aan de kandidaat is bekendgemaakt, schriftelijk ingesteld bij de commissie
      van beroep. De commissie stelt een onderzoek in en beslist binnen twee weken na ontvangst van het beroepsschrift,
      tenzij zij deze termijn gemotiveerd heeft verdaagd met ten hoogste twee weken. De commissie stelt bij haar
      beslissing zo nodig vast op welke wijze de kandidaat alsnog in de gelegenheid zal worden gesteld het examen geheel
      of gedeeltelijk af te leggen of opnieuw af te leggen.

      5 Bij toepassing van het eerste en vierde lid ontvangt de kandidaat geen bericht over de resultaten van reeds
      gemaakt en ingeleverd werk. Evenmin kan hij een beroep doen op [artikel 32, tweede lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003473#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0003473#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel30a
      [ref4]: https://wetten.overheid.nl/BWBR0003473#Artikel32
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003473
        artikel: '28'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003473
        artikel: '27'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 30a
      - id: ref4
        bwb_id: BWBR0003473
        artikel: '32'
        hoofdstuk: V
  - number: '19'
    text: |-
      De voorzitter draagt er zorg voor dat de kandidaten voor de aanvang van het examen uitdrukkelijk opmerkzaam worden
      gemaakt op de voorschriften van de [artikelen 17][ref1] en [18][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003473#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003473#Artikel18
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003473
        artikel: '17'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003473
        artikel: '18'
        hoofdstuk: III
  - number: '20'
    text: |-
      De voorzitter kan toestaan dat een lichamelijk gehandicapte kandidaat het examen geheel of gedeeltelijk aflegt
      op een wijze die is aangepast aan de mogelijkheden die de lichamelijke gesteldheid van de kandidaat biedt. In dat
      geval bepaalt de voorzitter de wijze waarop het examen zal worden afgelegd.
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel20
  - number: '21'
    text: |-
      De voorzitter draagt er zorg voor dat het nazien en beoordelen van het examenwerk geschiedt door ten minste twee
      leden van de examencommissie.
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel21
  - number: '22'
    text: |-
      1 De beoordeling van de kandidaat wordt voor elk deelexamen uitgedrukt met behulp van de getallen 1 tot en met 10,
      waaraan de volgende betekenis toekomt: 1 = zeer slecht

      2 = slecht

      3 = zeer onvoldoende

      4 = onvoldoende

      5 = bijna voldoende

      6 = voldoende

      7 = ruim voldoende

      8 = goed

      9 = zeer goed

      10 = uitmuntend.

      2 Voor elk deelexamen wordt één cijfer vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel22
  - number: '23'
    text: |-
      De examencommissie stelt na het examen het cijfer vast voor elk deelexamen voor iedere kandidaat en vermeldt dit
      cijfer op een cijferlijst volgens het door Onze Minister vastgestelde model, welke zo spoedig mogelijk na het
      examen aan de kandidaat wordt toegezonden.
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel23
  - number: '24'
    text: |-
      Nadat de kandidaat het deelexamen heeft afgelegd, stelt de examencommissie de uitslag vast. De kandidaat is
      geslaagd indien hij het cijfer 6 of hoger heeft behaald.
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel24
  - number: '25'
    text: |-
      1 Nadat alle deelexamens zijn afgenomen en daarvan de uitslag is vastgesteld, wordt de uitslag van het examen
      vastgesteld door de examencommissie.

      2 De examinandus is geslaagd voor het examen indien hij voor alle deelexamens is geslaagd.
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel25
  - number: '27'
    text: |-
      1 Aan de kandidaat die voor een deelexamen het cijfer 6 of hoger heeft behaald wordt een certificaat volgens het
      door Onze Minister vastgestelde model uitgereikt.

      2 Aan de kandidaat die voor de deelexamens, genoemd in [artikel 10, onderdelen ][ref1] het cijfer 6 of hoger heeft
      behaald, wordt op zijn verzoek een verklaring volgens het door Onze Minister vastgestelde model uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003473#Artikel10
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003473
        artikel: '10'
        hoofdstuk: II
  - number: '28'
    text: |-
      Aan de kandidaat die is geslaagd voor het examen wordt het diploma volgens het door Onze Minister vastgestelde
      model uitgereikt.
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel28
  - number: '29'
    text: |-
      De diploma's, certificaten, verklaringen en cijferlijsten, bedoeld in de [artikelen 23][ref1], [27][ref2] en
      [28][ref3] worden ondertekend door de voorzitter en de secretaris van de examencommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0003473#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0003473#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0003473#Artikel28
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003473
        artikel: '23'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003473
        artikel: '27'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0003473
        artikel: '28'
        hoofdstuk: IV
  - number: '30'
    text: |-
      De voorzitter en de secretaris ondertekenen de door de Informatie Beheer Groep te verstrekken verzamellijst waarop
      het examennummer, de naam, voornamen en plaats en datum van geboorte van iedere geslaagde kandidaat zijn vermeld,
      alsmede de door iedere kandidaat behaalde cijfers. De voorzitter zendt de lijst zo spoedig mogelijk na afloop van
      het examen aan de Informatie Beheer Groep.
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel30
  - number: '31'
    text: |-
      1 De examencommissie brengt na afloop van het examen aan Onze Minister en aan de Informatie Beheer Groep verslag
      uit over haar werkzaamheden.

      2 Onze Minister kan richtlijnen geven over de inrichting van het verslag.
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel31
  - number: '32'
    text: |-
      1 Het werk van de kandidaat wordt tot ten minste drie maanden na verzending van de in [artikel 23][ref1] bedoelde
      cijferlijst bewaard op een door de voorzitter te bepalen wijze.

      2 Een kandidaat kan zijn examenwerk over een of meer deelexamens inzien, mits hij binnen drie weken na de datum
      van het bekend maken van de uitslag bij aangetekende brief een verzoek daartoe richt aan de secretaris van de
      examencommissie en hij een bedrag van f 10,- aan de examencommissie heeft betaald.

      3 Onze Minister kan voorschriften geven over de wijze waarop het werk van de kandidaat na het verstrijken van de
      termijn genoemd in het eerste lid, wordt bewaard of vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003473#Artikel23
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003473
        artikel: '23'
        hoofdstuk: IV
  - number: '33'
    text: |-
      De voorzitter draagt er zorg voor dat jaarlijks een volledig stel van de opgaven aan Onze Minister wordt
      toegezonden.
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel33
  - number: '34'
    text: |-
      In gevallen waarin dit besluit niet voorziet en waaromtrent een onmiddellijke beslissing noodzakelijk is, beslist
      de voorzitter van de examencommissie. Zijn beslissing deelt hij zo spoedig mogelijk mede aan de leden van deze
      commissie en aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel34
  - number: '35'
    text: Onze Minister kan nadere voorschriften geven met betrekking tot de regeling van dit examen.
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel35
  - number: '36'
    text: De Koninklijke besluiten van 25 augustus 1949 (*Stb.* J 407) en 26 augustus 1978 (*Stb.* 500) worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel36
  - number: '37'
    text: |-
      1 Dit besluit kan worden aangehaald als "Staatsexamenbesluit SPD bedrijfsadministratie".

      2 Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin
      het wordt geplaatst en werkt terug tot 1 januari 1981.
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel37
  - number: '38'
    text: |-
      Voor het jaar 1981 wordt in [artikel 8, eerste lid][ref1],

      a. onder *a* en *c* voor "f 45,-" gelezen: f 37,50 en

      b. onder *b* voor "f 80,-" gelezen: f 65,-.


      [ref1]: https://wetten.overheid.nl/BWBR0003473#Artikel8
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003473
        artikel: '8'
        hoofdstuk: I
        paragraaf: '3'
  - number: '39'
    text: |-
      De zittingstermijn van de bij de inwerkingtreding van dit besluit zittende leden van de examencommissie eindigt op
      het bij hun benoemingsbesluit vermelde tijdstip, onverminderd [artikel 2, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003473#Artikel2
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003473
        artikel: '2'
        hoofdstuk: I
        paragraaf: '2'
  - number: '40'
    text: |-
      1 In 1981 wordt aan kandidaten gelegenheid gegeven tot het afleggen van het eerste gedeelte van het examen volgens
      de op 31 december 1980 geldende regeling.

      2 Indien een kandidaat in 1980 voor het eerste gedeelte van het examen is afgewezen en hij in 1981 of 1982 het
      examen aflegt volgens de bepalingen van dit besluit, is hij daarbij vrijgesteld van het opnieuw afleggen van het
      examen in die onderdelen waarvoor hij in 1980 een 6 of hoger heeft behaald.

      3 De kandidaat die in 1980 het eerste gedeelte van het examen heeft afgelegd en op grond daarvan niet tot het
      tweede gedeelte is toegelaten, doch die bij toepassing van de regels van [artikel 25][ref1] van dit besluit met
      de toen behaalde cijfers wel tot het tweede gedeelte zou zijn toegelaten, wordt bij aanmelding vóór 1 maart 1982
      vrijgesteld van het opnieuw afleggen van examen in de in [artikel 10, eerste lid][ref2], genoemde onderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003473#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0003473#Artikel10
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003473
        artikel: '25'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003473
        artikel: '10'
        hoofdstuk: II
  - number: '41'
    text: |-
      1 Tot het afleggen van het tweede gedeelte van het examen volgens de op 31 december 1980 geldende regeling kan
      worden toegelaten:

      a. in 1981 en 1982 de kandidaat die is toegelaten tot het tweede gedeelte van het examen op grond van examinering
      voor het eerste gedeelte volgens de op 31 december 1980 geldende regeling;

      b. in 1982 de kandidaat die is toegelaten tot het tweede gedeelte van het examen op grond van een in 1981 afgelegd
      aanvullend examen, bedoeld in [artikel 43, eerste lid][ref1];

      c. in 1982 de kandidaat die in 1979 of in 1980 het eerste gedeelte van het examen heeft afgelegd en niet is
      toegelaten tot het tweede gedeelte van het examen, doch voor het onderdeel recht I het cijfer 7 of hoger heeft
      behaald, mits hij in 1981 het eerste gedeelte van het examen aflegt volgens de bepalingen van dit besluit en op
      grond daarvan wordt toegelaten tot het tweede gedeelte van het examen.

      2 Indien een kandidaat in het jaar 1980 of 1981 is afgewezen voor het tweede gedeelte van het examen, afgelegd
      volgens de op 31 december 1980 geldende regeling, is hij gedurende de twee daarop volgende jaren vrijgesteld van
      het opnieuw afleggen van het examen in de onderdelen bedrijfsadministratie en bedrijfseconomie II voor zover hij
      daarvoor het cijfer 6 of hoger heeft behaald, tenzij hij in het eerste van die twee jaren het examen aflegt volgens
      de op 31 december 1980 geldende regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003473#Artikel43
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0003473
        artikel: '43'
        hoofdstuk: VI
        paragraaf: '2'
  - number: '42'
    text: |-
      Vrijstellingen ingevolge artikel 9, derde lid, en artikel 10, derde lid, van het bij het Koninklijk besluit van 25
      augustus 1949 (*Stb.* J 407) vastgestelde reglement blijven van kracht tot het einde van de termijn waarvoor zij
      zijn verleend.
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel42
  - number: '43'
    text: |-
      1 Hij die met gunstig gevolg het eerste gedeelte van het examen heeft afgelegd volgens het op 30 april 1974
      geldende reglement en programma en niet het tweede gedeelte van dit examen met gunstig gevolg heeft afgelegd, kan
      tot en met 1983 een aanvullend examen afleggen in de onderdelen statistiek en bedrijfscalculatie, ten einde te
      kunnen deelnemen aan het tweede gedeelte van het examen volgens de bepalingen van dit besluit.

      2 Vóór 15 februari van het jaar waarin de kandidaat aan het aanvullend examen wenst deel te nemen, meldt hij zich
      bij de voorzitter van de examencommissie.

      3 De examencommissie stelt het aanvullend examenprogramma vast en regelt dit examen.

      4 [Artikel 31][ref1] van dit besluit is van overeenkomstige toepassing.

      5 De kandidaat is voor het aanvullend examen geslaagd, indien de som van de voor de onderdelen behaalde cijfers ten
      minste 12 bedraagt en geen cijfer lager is dan 5.

      6 Aan de geslaagde kandidaat wordt een verklaring uitgereikt waarop de behaalde cijfers zijn vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003473#Artikel31
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003473
        artikel: '31'
        hoofdstuk: V
  - number: '44'
    text: |-
      Een kandidaat die zich in 1981 of 1982 aanmeldt voor deelname aan het eerste of tweede gedeelte van het examen
      volgens de bepalingen van dit besluit en zich eveneens aanmeldt voor het eerste of tweede gedeelte van het examen
      volgens de op 31 december 1980 geldende regeling, wordt niet toegelaten tot het laatstbedoelde examen. Het daarvoor
      betaalde examengeld zal niet worden terugbetaald.
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel44
  - number: '45'
    text: |-
      Het behalen van een voldoende na 1 augustus 1984 doch voor 1 augustus 1987 voor een onderdeel als bedoeld
      in [artikel 10][ref1], zoals dat luidde op 31 juli 1987 geldt als bezit van een certificaat als bedoeld in
      [artikel 27][ref2], voor het desbetreffende deelexamen.


      [ref1]: https://wetten.overheid.nl/BWBR0003473#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003473#Artikel27
    url: https://wetten.overheid.nl/BWBR0003473/1997-01-29#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0003473
        artikel: '10'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003473
        artikel: '27'
        hoofdstuk: IV
  - number: '46'
    text: |-
      Het bezit van een verklaring dat de vier onderdelen van het eerste gedeelte van het examen met goed gevolg
      zijn afgelegd, afgegeven op grond van [artikel 25][ref1], zoals dat luidde op 31 juli 1987, geldt als bezit van
      certificaten, bedoeld in [artikel 27][ref2] voor de deelexamens, bedoeld in [artikel 10, onderdelen ][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003473#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0003473#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0003473#Artikel10
