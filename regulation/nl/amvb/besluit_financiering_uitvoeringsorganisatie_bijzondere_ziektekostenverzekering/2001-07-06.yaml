        artikel: '3'
  - number: '5'
    text: |-
      1 Het College zorgverzekeringen stelt jaarlijks, in het kader van de verdeling van de voor het kalenderjaar
      krachtens [artikel 3][ref1] besteedbare middelen, de voor ieder verbindingskantoor en regionaal contactkantoor
      afzonderlijk besteedbare middelen vast ter dekking van de beheerskosten die het in de hoedanigheid van
      verbindingskantoor of regionaal contactkantoor maakt.

      2 De vaststelling van de besteedbare middelen, bedoeld in het eerste lid, geschiedt aan de hand van
      door het College zorgverzekeringen vast te stellen beleidsregels. Ten aanzien van die beleidsregels is
      [artikel 4, derde tot en met vijfde lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004783#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004783#Artikel4
    url: https://wetten.overheid.nl/BWBR0004783/2001-07-06#Artikel5
