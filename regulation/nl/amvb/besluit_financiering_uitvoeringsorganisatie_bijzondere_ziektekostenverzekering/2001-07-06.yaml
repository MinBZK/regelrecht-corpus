  - number: '2'
    text: >-
      Het College zorgverzekeringen vergoedt uit het Algemeen Fonds Bijzondere Ziektekosten jaarlijks aan de
      uitvoeringsorganen de kosten van verstrekkingen en uitkeringen.
    url: https://wetten.overheid.nl/BWBR0004783/2001-07-06#Artikel2
  - number: '3'
    text: >-
      Onze Minister van Volksgezondheid, Welzijn en Sport geeft het College zorgverzekeringen jaarlijks een aanwijzing
      ter zake van de voor alle uitvoeringsorganen, verbindingskantoren, regionale contactkantoren en het centraal
      administratiekantoor tezamen voor dat kalenderjaar ten laste van het Algemeen Fonds Bijzondere Ziektekosten
      besteedbare middelen ter dekking van de beheerskosten.
    url: https://wetten.overheid.nl/BWBR0004783/2001-07-06#Artikel3
  - number: '4'
    text: |-
      1 Het College zorgverzekeringen stelt jaarlijks, in het kader van de verdeling van de voor het kalenderjaar
      krachtens [artikel 3][ref1] besteedbare middelen, de voor ieder uitvoeringsorgaan afzonderlijk ten laste van het
      Algemeen Fonds Bijzondere Ziektekosten besteedbare middelen vast ter dekking van de beheerskosten die zij maken
      anders dan in de hoedanigheid van verbindingskantoor of regionaal contactkantoor.

      2 De vaststelling van de besteedbare middelen, bedoeld in het eerste lid, geschiedt aan de hand van de door het
      College zorgverzekeringen vast te stellen beleidsregels.

      3 De in het tweede lid bedoelde beleidsregels behoeven de goedkeuring van Onze Minister van Volksgezondheid,
      Welzijn en Sport.

      4 In geval van onthouding van goedkeuring aan een beleidsregel stelt het College zorgverzekeringen met inachtneming
      van door Onze Minister van Volksgezondheid, Welzijn en Sport te geven instructies een nieuwe beleidsregel vast.

      5 Indien Onze Minister van Volksgezondheid, Welzijn en Sport aan de in het vierde lid bedoelde beleidsregel
      eveneens goedkeuring onthoudt, stelt hij ter zake zelf de beleidsregel vast.


      [ref1]: https://wetten.overheid.nl/BWBR0004783#Artikel3
    url: https://wetten.overheid.nl/BWBR0004783/2001-07-06#Artikel4
    references:
