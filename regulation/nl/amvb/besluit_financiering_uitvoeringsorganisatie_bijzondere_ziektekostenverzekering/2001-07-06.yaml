---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_financiering_uitvoeringsorganisatie_bijzondere_ziektekostenverzekering
regulatory_layer: AMVB
publication_date: '2005-03-22'
valid_from: '2001-07-06'
bwb_id: BWBR0004783
url: https://wetten.overheid.nl/BWBR0004783/2001-07-06
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 5 januari 1990, VTA/VERZ/
    FC-411755;

    Gelet op artikel 40, eerste en tweede lid, van de Wet financiering volksverzekeringen (Stb. 1989, 129);

    De Raad van State gehoord (advies van 9 april 1990, nr. W13.90.0013);

    Gezien het nader rapport van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 23 mei 1990 VMP/FAV-
    414021;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004783/2001-07-06#ArtikelAanhef
articles:
  - number: '1'
    text: 'In het bepaalde bij of krachtens dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004783/2001-07-06#Artikel1
  - number: 1.a
    text: |-
      kosten van verstrekkingen en uitkeringen: kosten van verstrekkingen en uitkeringen ter zake van verleende zorg,
      bedoeld in [artikel 6 van de Algemene Wet Bijzondere Ziektekosten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0004783/2001-07-06#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
  - number: 1.b
    text: |-
      beheerskosten: de beheerskosten van de in de [Algemene Wet Bijzondere Ziektekosten][ref1] geregelde verzekering,
      waaronder begrepen de kosten van controle in het kader van die verzekering;


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0004783/2001-07-06#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 1.c
    text: |-
      centraal administratiekantoor: het centraal administratiekantoor, bedoeld in het
      [Administratiebesluit Bijzondere Ziektekostenverzekering][ref1] mede in zijn hoedanigheid van centraal
      betaalkantoor als bedoeld in het [Besluit regeling vergoeding Bijzondere Ziektekostenverzekering][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003585
      [ref2]: https://wetten.overheid.nl/BWBR0002777
    url: https://wetten.overheid.nl/BWBR0004783/2001-07-06#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003585
      - id: ref2
        bwb_id: BWBR0002777
  - number: 1.d
    text: |-
      regionaal contactkantoor: een regionaal contactkantoor als bedoeld in het Besluit nadere regelen vergoeding
      Bijzondere Ziektekostenverzekering;
    url: https://wetten.overheid.nl/BWBR0004783/2001-07-06#Artikel1
  - number: 1.e
    text: |-
      uitvoeringsorgaan: een orgaan als bedoeld in
      [artikel 1, onderdeel h, van de Algemene Wet Bijzondere Ziektekosten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel1
    url: https://wetten.overheid.nl/BWBR0004783/2001-07-06#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '1'
  - number: 1.f
    text: |-
      verbindingskantoor: een verbindingskantoor als bedoeld in het
      [Administratiebesluit Bijzondere Ziektekostenverzekering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003585
    url: https://wetten.overheid.nl/BWBR0004783/2001-07-06#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003585
  - number: 1.g
    text: |-
      College zorgverzekeringen: het College voor zorgverzekeringen, bedoeld in de [Ziekenfondswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0004783/2001-07-06#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002460
  - number: 1.h
    text: |-
      College toezicht: het College van toezicht op de zorgverzekeringen, bedoeld in de [Ziekenfondswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0004783/2001-07-06#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002460
  - number: '2'
    text: |-
      Het College zorgverzekeringen vergoedt uit het Algemeen Fonds Bijzondere Ziektekosten jaarlijks aan de
      uitvoeringsorganen de kosten van verstrekkingen en uitkeringen.
    url: https://wetten.overheid.nl/BWBR0004783/2001-07-06#Artikel2
  - number: '3'
    text: |-
      Onze Minister van Volksgezondheid, Welzijn en Sport geeft het College zorgverzekeringen jaarlijks een aanwijzing
      ter zake van de voor alle uitvoeringsorganen, verbindingskantoren, regionale contactkantoren en het centraal
      administratiekantoor tezamen voor dat kalenderjaar ten laste van het Algemeen Fonds Bijzondere Ziektekosten
      besteedbare middelen ter dekking van de beheerskosten.
    url: https://wetten.overheid.nl/BWBR0004783/2001-07-06#Artikel3
  - number: '4.1'
    text: |-
      Het College zorgverzekeringen stelt jaarlijks, in het kader van de verdeling van de voor het kalenderjaar krachtens
      [artikel 3][ref1] besteedbare middelen, de voor ieder uitvoeringsorgaan afzonderlijk ten laste van het Algemeen
      Fonds Bijzondere Ziektekosten besteedbare middelen vast ter dekking van de beheerskosten die zij maken anders dan
      in de hoedanigheid van verbindingskantoor of regionaal contactkantoor.


      [ref1]: https://wetten.overheid.nl/BWBR0004783#Artikel3
    url: https://wetten.overheid.nl/BWBR0004783/2001-07-06#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004783
        artikel: '3'
  - number: '4.2'
    text: |-
      De vaststelling van de besteedbare middelen, bedoeld in het eerste lid, geschiedt aan de hand van de door het
      College zorgverzekeringen vast te stellen beleidsregels.
    url: https://wetten.overheid.nl/BWBR0004783/2001-07-06#Artikel4
  - number: '4.3'
    text: |-
      De in het tweede lid bedoelde beleidsregels behoeven de goedkeuring van Onze Minister van Volksgezondheid, Welzijn
      en Sport.
    url: https://wetten.overheid.nl/BWBR0004783/2001-07-06#Artikel4
  - number: '4.4'
    text: |-
      In geval van onthouding van goedkeuring aan een beleidsregel stelt het College zorgverzekeringen met inachtneming
      van door Onze Minister van Volksgezondheid, Welzijn en Sport te geven instructies een nieuwe beleidsregel vast.
    url: https://wetten.overheid.nl/BWBR0004783/2001-07-06#Artikel4
  - number: '4.5'
    text: |-
      Indien Onze Minister van Volksgezondheid, Welzijn en Sport aan de in het vierde lid bedoelde beleidsregel eveneens
      goedkeuring onthoudt, stelt hij ter zake zelf de beleidsregel vast.
    url: https://wetten.overheid.nl/BWBR0004783/2001-07-06#Artikel4
  - number: '5.1'
    text: |-
      Het College zorgverzekeringen stelt jaarlijks, in het kader van de verdeling van de voor het kalenderjaar krachtens
      [artikel 3][ref1] besteedbare middelen, de voor ieder verbindingskantoor en regionaal contactkantoor afzonderlijk
      besteedbare middelen vast ter dekking van de beheerskosten die het in de hoedanigheid van verbindingskantoor of
      regionaal contactkantoor maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004783#Artikel3
    url: https://wetten.overheid.nl/BWBR0004783/2001-07-06#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004783
        artikel: '3'
  - number: '5.2'
    text: |-
      De vaststelling van de besteedbare middelen, bedoeld in het eerste lid, geschiedt aan de hand van
      door het College zorgverzekeringen vast te stellen beleidsregels. Ten aanzien van die beleidsregels is
      [artikel 4, derde tot en met vijfde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004783#Artikel4
    url: https://wetten.overheid.nl/BWBR0004783/2001-07-06#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004783
        artikel: '4'
  - number: '6'
    text: |-
      Het College zorgverzekeringen stelt jaarlijks, in het kader van de verdeling van de voor het kalenderjaar krachtens
      [artikel 3][ref1] besteedbare middelen, vast welke middelen voor het centraal administratiekantoor maximaal
      besteedbaar zijn ter dekking van zijn beheerskosten in dat kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004783#Artikel3
    url: https://wetten.overheid.nl/BWBR0004783/2001-07-06#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004783
        artikel: '3'
  - number: '7.1'
    text: |-
      Het College zorgverzekeringen keert jaarlijks uit het Algemeen Fonds Bijzondere Ziektekosten aan
      een uitvoeringsorgaan de voor dat uitvoeringsorgaan voor het desbetreffende kalenderjaar krachtens
      [artikel 4, eerste lid][ref1], vastgestelde besteedbare middelen uit.


      [ref1]: https://wetten.overheid.nl/BWBR0004783#Artikel4
    url: https://wetten.overheid.nl/BWBR0004783/2001-07-06#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004783
        artikel: '4'
  - number: '7.2'
    text: |-
      Indien een uitvoeringsorgaan op een naar het oordeel van het College toezicht onverantwoorde wijze op beheerskosten
      bespaart, wordt de uitkering, bedoeld in het eerste lid, voor het desbetreffende kalenderjaar door het College
      zorgverzekeringen verlaagd met het bedrag van die besparing.
    url: https://wetten.overheid.nl/BWBR0004783/2001-07-06#Artikel7
  - number: '8'
    text: |-
      Het College zorgverzekeringen keert jaarlijks uit het Algemeen Fonds Bijzondere Ziektekosten aan de
      verbindingskantoren en regionale contactkantoren, de voor hen ingevolge [artikel 5, eerste lid][ref1], vastgestelde
      besteedbare middelen uit. [Artikel 7, tweede lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004783#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004783#Artikel7
    url: https://wetten.overheid.nl/BWBR0004783/2001-07-06#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004783
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0004783
        artikel: '7'
  - number: '9'
    text: |-
      Het College zorgverzekeringen doet jaarlijks uit het Algemeen Fonds Bijzondere Ziektekosten uitkeringen aan het
      centraal administratiekantoor ter dekking van de door hem werkelijk gemaakte beheerskosten tot ten hoogste de
      voor hem voor het kalenderjaar besteedbare middelen. Ter bepaling van de door het centraal administratiekantoor
      werkelijk gemaakte beheerskosten wordt een eventueel tekort uit voorgaande jaren mede in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0004783/2001-07-06#Artikel9
  - number: 9a
    text: |-
      Het College toezicht is bevoegd opgaven en gegevens van een uitvoeringsorgaan, verbindingskantoor, regionaal
      contactkantoor en het Centraal administratiekantoor, die van invloed zijn op de omvang van de ten laste van het
      Algemeen Fonds Bijzondere Ziektekosten besteedbare middelen en op de hoogte van de vergoedingen en uitkeringen
      ingevolge dit besluit, op hun juistheid te beoordelen en te verbeteren.
    url: https://wetten.overheid.nl/BWBR0004783/2001-07-06#Artikel9a
  - number: '10'
    text: |-
      Het College zorgverzekeringen bepaalt met inachtneming van het
      [Administratiebesluit Bijzondere Ziektekostenverzekering][ref1] en het bepaalde bij en krachtens het
      [Besluit regeling vergoeding bijzondere ziektekostenverzekering][ref2], de wijze van betaalbaarstelling van de
      uitkeringen ingevolge dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003585
      [ref2]: https://wetten.overheid.nl/BWBR0002777
    url: https://wetten.overheid.nl/BWBR0004783/2001-07-06#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003585
      - id: ref2
        bwb_id: BWBR0002777
  - number: '11'
    text: |-
      Dit besluit treedt in werking op de tweede dag na die van zijn bekendmaking in het *Staatsblad* en werkt terug tot
      en met 1 januari 1990.
    url: https://wetten.overheid.nl/BWBR0004783/2001-07-06#Artikel11
  - number: '12'
    text: 'Dit besluit wordt aangehaald als: Besluit financiering uitvoeringsorganisatie Bijzondere Ziektekostenverzekering.'
    url: https://wetten.overheid.nl/BWBR0004783/2001-07-06#Artikel12
