preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 10 juni 2014, nr. 2014-
    0000080869;

    Gelet op de artikelen 10c, 10d en 10e van de Participatiewet;

    De Afdeling advisering van de Raad van State gehoord (advies van 14 augustus 2014, nr. W12.14.0183/III);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 2 oktober 2014, nr. 2014-
    0000112828;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0035631/2017-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Een persoon heeft mogelijkheden tot arbeidsparticipatie indien die persoon:'
    url: https://wetten.overheid.nl/BWBR0035631/2017-07-01#Artikel1
  - number: 1.1.a
    text: een taak kan uitvoeren in een arbeidsorganisatie;
    url: https://wetten.overheid.nl/BWBR0035631/2017-07-01#Artikel1
  - number: 1.1.b
    text: over basale werknemersvaardigheden beschikt;
    url: https://wetten.overheid.nl/BWBR0035631/2017-07-01#Artikel1
  - number: 1.1.c
    text: aaneengesloten kan werken gedurende ten minste een periode van een uur; en
    url: https://wetten.overheid.nl/BWBR0035631/2017-07-01#Artikel1
  - number: 1.1.d
    text: |-
      ten minste vier uur per dag belastbaar is of ten minste twee uur per dag belastbaar is en in staat is per uur ten
      minste een bedrag te verdienen dat gelijk is aan het minimumloon per uur.
    url: https://wetten.overheid.nl/BWBR0035631/2017-07-01#Artikel1
  - number: '1.2'
    text: |-
      Onder minimumloon per uur wordt in dit artikel verstaan het bedrag, dat op grond van
      [artikel 8, eerste en derde lid, van de Wet minimumloon en minimumvakantiebijslag][ref1] voor
      de werknemer als minimumloon geldt, verminderd tot een bedrag per uur. Bij de vermindering,
      bedoeld in de vorige zin, wordt uitgegaan van een normale arbeidsduur als bedoeld in
      [artikel 12, derde lid, van de Wet minimumloon en minimumvakantiebijslag][ref2], van 38 uur per week.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel12
    url: https://wetten.overheid.nl/BWBR0035631/2017-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '12'
  - number: '1.3'
    text: |-
      Een taak als bedoeld in het eerste lid, onderdeel a, is de kleinste eenheid van een functie en bestaat uit één of
      meerdere handelingen.
    url: https://wetten.overheid.nl/BWBR0035631/2017-07-01#Artikel1
  - number: '1.4'
    text: Bij ministeriële regeling kunnen met betrekking tot het eerste lid nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0035631/2017-07-01#Artikel1
  - number: '2.1'
    text: |-
      Het college stelt de loonwaarde schriftelijk vast op basis van de feitelijke werkzaamheden op de werkplek van een
      persoon uit de doelgroep loonkostensubsidie bij de werkgever en met inbreng van de werkgever, die voornemens is een
      dienstbetrekking aan te gaan dan wel een dienstbetrekking is aangegaan met die persoon.
    url: https://wetten.overheid.nl/BWBR0035631/2017-07-01#Artikel2
  - number: '2.2'
    text: |-
      Het college stelt de loonwaarde vast op basis van een beschreven objectieve methode en deze vaststelling vindt
      plaats door of onder verantwoordelijkheid van een deskundige. Het college draagt er zorg voor dat de deskundige
      over voldoende deskundigheid beschikt.
    url: https://wetten.overheid.nl/BWBR0035631/2017-07-01#Artikel2
  - number: '3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld aan de methode ter vaststelling van de loonwaarde.
      Deze nadere regels betreffen tenminste eisen:
    url: https://wetten.overheid.nl/BWBR0035631/2017-07-01#Artikel3
  - number: 3.a
    text: ten aanzien van de bestanddelen, die worden meegenomen bij de bepaling van de loonwaarde;
    url: https://wetten.overheid.nl/BWBR0035631/2017-07-01#Artikel3
  - number: 3.b
    text: |-
      in welke gevallen het een functie betreft, waarbij sprake is van een gemiddelde werknemer met een soortgelijke
      opleiding en ervaring, die niet tot de doelgroep loonkostensubsidie behoort; en
    url: https://wetten.overheid.nl/BWBR0035631/2017-07-01#Artikel3
  - number: 3.c
    text: ten aanzien van de wijze waarop de loonwaarde wordt berekend en de bestanddelen daarvan worden gewogen.
    url: https://wetten.overheid.nl/BWBR0035631/2017-07-01#Artikel3
  - number: '4.1'
    text: |-
      Indien de colleges in een samenwerkingsverband als bedoeld in [artikel 2.3 van het Besluit SUWI][ref1] voornemens
      zijn op grond van afspraken over eisen als bedoeld in artikel 2.3, tweede lid, onderdeel i, van het Besluit SUWI,
      een methode van loonwaardebepaling toe te passen, dan wel voornemens zijn om een methode van loonwaardebepaling te
      wijzigen, meldt het bestuur van het samenwerkingsverband namens die colleges de desbetreffende methode uiterlijk
      een maand voorafgaand aan de datum waarop de methode zal worden toegepast, dan wel zal worden gewijzigd, aan Onze
      Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel2
    url: https://wetten.overheid.nl/BWBR0035631/2017-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '2'
  - number: '4.2'
    text: |-
      Indien een methode van loonwaardebepaling is gemeld als bedoeld in het eerste lid, stelt Onze Minister vast
      of die methode voldoet aan [artikel 2][ref1]. Indien die methode voldoet aan artikel 2, zijn de op grond van
      [artikel 3][ref2] vastgestelde regels niet langer op die methode van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0035631#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035631#Artikel3
    url: https://wetten.overheid.nl/BWBR0035631/2017-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0035631
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0035631
        artikel: '3'
  - number: '4.3'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten aanzien van het eerste en het tweede lid.
    url: https://wetten.overheid.nl/BWBR0035631/2017-07-01#Artikel4
  - number: '5'
    text: 'Dit besluit wordt aangehaald als: Besluit loonkostensubsidie Participatiewet.'
    url: https://wetten.overheid.nl/BWBR0035631/2017-07-01#Artikel5
  - number: '6'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop
      [artikel I, onderdeel F, van de Invoeringswet Participatiewet][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0035333#ArtikelI
    url: https://wetten.overheid.nl/BWBR0035631/2017-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0035333
        artikel: I
