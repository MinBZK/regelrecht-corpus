articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      - *algemene preventiekosten:* andere preventiekosten dan voor de bestrijding van zoönotische salmonella, voor de
      preventie van tegen antimicrobiële diergeneesmiddelen resistente bacteriën of de monitoring van dierziekten;
      - *eendagskuiken:* kuiken, jonger dan 72 uur;
      - *grootmoederdier:* vrouwelijk dier van ten minste 20 weken oud, gehouden voor de productie van broedeieren ter
      verkrijging van moederdieren;
      - *legkip:* kip van ten minste 18 weken oud, gehouden voor de productie van andere eieren dan broedeieren;
      - *legras:* ras van pluimvee, bestemd voor de productie van eieren;
      - *moederdier:* kip of kalkoen van ten minste 20 weken respectievelijk 28 weken oud, gehouden voor de productie van
      broedeieren ter verkrijging van dieren die worden gehouden voor de productie van vlees of eieren;
      - *opslag:* bedrag waarmee de diergezondheidsheffing wordt verhoogd ter bestrijding van de kosten
      van het Diergezondheidsfonds, voor zover noodzakelijk met het oog op het weren van op grond van
      [artikel 15, eerste lid, van de wet][ref1], aangewezen besmettelijke dierziekten;
      - *vaccinbroedei:* ei van pluimvee dat zich in een broedmachine bevindt om te worden afgeleverd aan de
      farmaceutische industrie, dan wel bestemd is om voor dit doel in een broedmachine te worden ingelegd;
      - *Verordening (EG) nr. 834/2007:* Verordening (EG) nr. 834/2007 van de Raad van 28 juni 2007 inzake de biologische
      productie en de etikettering van biologische producten en tot intrekking van Verordening (EEG) nr. 2092/91 (PbEU
      2007, L 189);
      - *Verordening (EG) nr. 589/2008:* Verordening (EG) nr. 589/2008 van de Commissie van 23 juni 2008 tot vaststelling
      van bepalingen ter uitvoering van Verordening (EG) nr. 1234/2007 van de Raad, wat betreft de handelsnormen voor
      eieren (PbEU 2008, L 163);
      - *vleeskalkoen:* kalkoen, direct bestemd voor de productie van vlees;
      - *vleeskuiken:* kip, direct bestemd voor de productie van vlees;
      - *vleesras:* ras van pluimvee dat bestemd is voor de productie van vlees;
      - *wet:* [Gezondheids- en welzijnswet voor dieren][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005662
