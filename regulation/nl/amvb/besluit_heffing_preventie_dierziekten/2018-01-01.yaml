  - number: '2'
    text: |-
      De diergezondheidsheffing, bedoeld in de [artikelen 3][ref1], [10][ref2], [12][ref3] en
      [14 van het Besluit heffing bestrijding dierziekten][ref4], wordt tevens geheven ter bestrijding van de kosten van
      het Diergezondheidsfonds, voor zover noodzakelijk met het oog op het weren van:

      a. op grond van [artikel 15, eerste lid, van de wet][ref5] aangewezen besmettelijke dierziekten bij de in de
      [artikelen 3][ref6], [10][ref7], [12][ref8] en [14 van het Besluit heffing bestrijding dierziekten][ref9] genoemde
      diersoorten,

      b. andere dierziekten,

      c. ziekten die kunnen worden overgebracht op de mens en die alleen de gezondheid van de mens aantasten, waarop op
      grond van [artikel 103][ref10] bepalingen van deze wet geheel of gedeeltelijk van overeenkomstige toepassing zijn
      verklaard.


