  - number: 12a
    text: >-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ten einde te borgen dat betalingen die worden
      verricht uit het Diergezondheidsfonds in overeenstemming zijn met de artikelen 107 en 108 van het Verdrag
      betreffende de werking van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0035679/2018-01-01#Artikel12a
  - number: '13'
    text: >-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen en onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0035679/2018-01-01#Artikel13
