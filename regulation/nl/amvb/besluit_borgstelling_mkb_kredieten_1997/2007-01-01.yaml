$id: besluit_borgstelling_mkb_kredieten_1997
regulatory_layer: AMVB
publication_date: '2008-12-09'
valid_from: '2007-01-01'
bwb_id: BWBR0009052
url: https://wetten.overheid.nl/BWBR0009052/2007-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 3 februari 1997, nr. WJA/JZ 97005416;

    Gelet op artikel 3 van de Kaderwet EZ-subsidies;

    De Raad van State gehoord (advies van 16 april 1997, nr. W10.97.0056);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 19 november 1997, nr. WJA/JZ 97069196;

    Hebben goedgevonden en verstaan
  url: https://wetten.overheid.nl/BWBR0009052/2007-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009052/2007-01-01#Artikel1
  - number: 1.a
    text: |-
      bank: bank als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1] waaraan een vergunning
      is verleend op grond van [artikel 2:11][ref2] of [artikel 2:16 van die wet][ref3] of die op grond van
      [artikel 2:15 van die wet][ref4] haar bedrijf in Nederland mag uitoefenen, niet zijnde een bank die tevens
      beleggingsonderneming is;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0009052/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 1.b
    text: |-
      ondernemer: een natuurlijke persoon of rechtspersoon, niet zijnde een rechtspersoon die krachtens publiekrecht is
      ingesteld, die in Nederland een onderneming in stand houdt, niet zijnde een onderneming behorende bij een categorie
      die bij regeling van Onze Minister is uitgesloten, waarbij niet meer dan een bij regeling van Onze Minister vast te
      stellen aantal werknemers in dienst is;
    url: https://wetten.overheid.nl/BWBR0009052/2007-01-01#Artikel1
  - number: 1.c
    text: |-
      een meldingslimiet: het maximale bedrag waarvoor een kredietinstelling in een begrotingsjaar kredietovereenkomsten
      door melding onder de werking van een borgstellingsovereenkomst mag brengen.
    url: https://wetten.overheid.nl/BWBR0009052/2007-01-01#Artikel1
  - number: '2.1'
    text: |-
      Onze Minister verleent op aanvraag aan een kredietinstelling subsidie in de vorm van een borgstelling op met
      ondernemers te sluiten kredietovereenkomsten.
    url: https://wetten.overheid.nl/BWBR0009052/2007-01-01#Artikel2
  - number: '2.2'
    text: |-
      Onze Minister kan op een gezamenlijk ingediende aanvraag aan kredietinstellingen gezamenlijk subsidie in de vorm
      van een borgstelling verlenen, indien:
    url: https://wetten.overheid.nl/BWBR0009052/2007-01-01#Artikel2
  - number: 2.2.a
    text: alle aanvragers handelen onder dezelfde naam,
    url: https://wetten.overheid.nl/BWBR0009052/2007-01-01#Artikel2
  - number: 2.2.b
    text: alle kredietinstellingen die onder de onder a bedoelde naam handelen als aanvrager optreden en
    url: https://wetten.overheid.nl/BWBR0009052/2007-01-01#Artikel2
  - number: 2.2.c
    text: |-
      één en dezelfde rechtspersoon bevoegd is om namens alle aanvragers, zowel voor hen gezamenlijk als voor ieder
      apart, te voldoen aan de voor hen uit de borgstelling voortvloeiende administratieve verplichtingen jegens de
      staat.
    url: https://wetten.overheid.nl/BWBR0009052/2007-01-01#Artikel2
  - number: '3.1'
    text: |-
      Onze Minister stelt bij ministeriële regeling modellen voor de borgstellingsovereenkomsten vast, welke kunnen
      verschillen naar gelang van de aard van de kredieten waarop zij betrekking hebben. Daarin worden in ieder geval
      bepalingen opgenomen omtrent de eisen waaraan de kredietovereenkomsten, waarop de borgstellingen betrekking hebben,
      moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0009052/2007-01-01#Artikel3
  - number: '3.2'
    text: |-
      In de borgstellingsovereenkomsten worden de wijze waarop het bedrag van de subsidie wordt bepaald en de betaling
      van de subsidie geregeld.
    url: https://wetten.overheid.nl/BWBR0009052/2007-01-01#Artikel3
  - number: '3.3'
    text: |-
      De borgstellingsovereenkomsten bevatten voorts voor de subsidie-ontvanger in ieder geval verplichtingen ter zake
      van:
    url: https://wetten.overheid.nl/BWBR0009052/2007-01-01#Artikel3
  - number: 3.3.a
    text: de melding van kredietovereenkomsten waarop de borgstelling van toepassing is;
    url: https://wetten.overheid.nl/BWBR0009052/2007-01-01#Artikel3
  - number: 3.3.b
    text: |-
      de betaling van een garantieprovisie met inachtneming van een bij regeling van Onze Minister vast te stellen
      tarief;
    url: https://wetten.overheid.nl/BWBR0009052/2007-01-01#Artikel3
  - number: 3.3.c
    text: het verschaffen van inlichtingen omtrent het beheer van de kredieten;
    url: https://wetten.overheid.nl/BWBR0009052/2007-01-01#Artikel3
  - number: 3.3.d
    text: de terugvordering van de kredieten en de uitwinning van zekerheden;
    url: https://wetten.overheid.nl/BWBR0009052/2007-01-01#Artikel3
  - number: 3.3.e
    text: aanvragen tot betaling van de subsidie.
    url: https://wetten.overheid.nl/BWBR0009052/2007-01-01#Artikel3
  - number: '4.1'
    text: |-
      Onze Minister stelt jaarlijks bij ministeriële regeling een subsidieplafond vast voor het verstrekken van subsidies
      als gevolg van de borgstellingen krachtens dit besluit op in een begrotingsjaar gemelde kredietovereenkomsten.
      Daarbij kan hij afzonderlijke subsidieplafonds vaststellen voor verschillende categorieën kredietovereenkomsten,
      zoals omschreven in de ministeriële regeling, bedoeld in [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009052#Artikel3
    url: https://wetten.overheid.nl/BWBR0009052/2007-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009052
        artikel: '3'
        paragraaf: '1'
  - number: '4.2'
    text: |-
      Het beschikbare bedrag wordt verdeeld door voor iedere bank waarmee een borgstellingsovereenkomst is gesloten
      jaarlijks op aanvraag een of meer meldingslimieten vast te stellen. Voor kredietinstellingen waarmee een
      gezamenlijke borgstellingsovereenkomst is gesloten worden een of meer gezamenlijke meldingslimieten vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009052/2007-01-01#Artikel4
  - number: '4.3'
    text: |-
      Bij de vaststelling van een meldingslimiet neemt Onze Minister in aanmerking het aandeel van de betrokken bank of
      kredietinstellingen in de kredietverlening aan ondernemers.
    url: https://wetten.overheid.nl/BWBR0009052/2007-01-01#Artikel4
  - number: '5'
    text: |-
      Een aanvraag wordt ingediend vóór 1 september van het jaar, voorafgaand aan het jaar waarop de gevraagde
      meldingslimiet betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0009052/2007-01-01#Artikel5
  - number: '6'
    text: |-
      Een aanvraag wordt ingediend met gebruikmaking van het origineel van een ondertekend formulier, dat door Onze
      Minister wordt vastgesteld. Onze Minister kan bij ministeriële regeling hiervan vrijstelling verlenen.
    url: https://wetten.overheid.nl/BWBR0009052/2007-01-01#Artikel6
  - number: '7'
    text: |-
      Onze Minister geeft op de aanvraag een beschikking voor 1 januari van het jaar waarop de meldingslimiet betrekking
      heeft.
    url: https://wetten.overheid.nl/BWBR0009052/2007-01-01#Artikel7
  - number: '8'
    text: |-
      Een aanvraag als bedoeld in [artikel 2][ref1] wordt ingediend met gebruikmaking van het origineel van een
      ondertekend formulier, dat door Onze Minister wordt vastgesteld. Onze Minister kan bij ministeriële regeling
      hiervan vrijstelling verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0009052#Artikel2
    url: https://wetten.overheid.nl/BWBR0009052/2007-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009052
        artikel: '2'
        paragraaf: '1'
  - number: '9'
    text: Onze Minister geeft op de aanvraag een beschikking binnen dertien weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0009052/2007-01-01#Artikel9
  - number: '10.1'
    text: |-
      Een beschikking tot subsidieverlening houdt het aanbod in om een borgstellingsovereenkomst te sluiten
      overeenkomstig een model, dat bij de beschikking wordt gevoegd.
    url: https://wetten.overheid.nl/BWBR0009052/2007-01-01#Artikel10
  - number: '10.2'
    text: |-
      In de beschikking tot subsidieverlening wordt geen bedrag vermeld, waarop de subsidie ten hoogste kan worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009052/2007-01-01#Artikel10
  - number: '11.1'
    text: Het Besluit borgstelling MKB-kredieten wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009052/2007-01-01#Artikel11
  - number: '11.2'
    text: |-
      In afwijking van [artikel 2][ref1] doet Onze Minister aan kredietinstellingen voor welke op het tijdstip van
      inwerkingtreden van dit besluit een borgstellingsovereenkomst op grond van het Besluit borgstelling MKB-kredieten
      geldt, ook zonder dat daartoe een aanvraag is ingediend, onverwijld een aanbod tot het sluiten van een soortgelijke
      borgstellingsovereenkomst, overeenkomstig het van toepassing zijnde, bij regeling van Onze Minister vastgestelde
      model.


      [ref1]: https://wetten.overheid.nl/BWBR0009052#Artikel2
    url: https://wetten.overheid.nl/BWBR0009052/2007-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009052
        artikel: '2'
        paragraaf: '1'
  - number: '11.3'
    text: |-
      Voor zover in 1997 op grond van het Besluit borgstelling MKB-kredieten een meldingslimiet is vastgesteld voor een
      bank of voor gezamenlijke kredietinstellingen geldt deze meldingslimiet voor de meldingen die in 1998 op grond van
      dit besluit plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0009052/2007-01-01#Artikel11
  - number: '12'
    text: |-
      Dit besluit treedt in werking met ingang van het tijdstip waarop de [Kaderwet EZ-subsidies][ref1] in werking
      treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0007919
    url: https://wetten.overheid.nl/BWBR0009052/2007-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007919
  - number: '13'
    text: 'Dit besluit wordt aangehaald als: Besluit borgstelling MKB-kredieten 1997.'
    url: https://wetten.overheid.nl/BWBR0009052/2007-01-01#Artikel13
