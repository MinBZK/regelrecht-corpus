---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: warenwetbesluit_asbest
regulatory_layer: AMVB
publication_date: '2005-01-11'
valid_from: '1994-09-14'
bwb_id: BWBR0006870
url: https://wetten.overheid.nl/BWBR0006870/1994-09-14
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 1 juni 1993, DGVgz/VVP/C
    93811, gedaan in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en
    Onze Minister van Economische Zaken;

    Gelet op de Richtlijn 91/659/EEG van de Commissie van de Europese Gemeenschappen van 3 december 1991 houdende
    aanpassing aan de technische vooruitgang van bijlage I van Richtlijn 76/769/EEG van de Raad betreffende de
    onderlinge aanpassing van de wettelijke en bestuursrechtelijke bepalingen der Lid-Staten inzake de beperking van
    het op de markt brengen en van het gebruik van bepaalde gevaarlijke stoffen en preparaten (asbest) (PbEG L 363),
    alsmede op de artikelen 4, eerste lid, 8, onderdeel c, 12, 13 en 14 van de Warenwet en op artikel II, eerste lid,
    van de Wijzigingswet 1988 Warenwet;

    Gezien het advies van de Adviescommissie Warenwet (advies van 12 februari 1993, 14626/(41)5);

    De Raad van State gehoord (advies van 19 oktober 1993, No. W13.93.0329);

    Gezien het nader rapport van Onze Minister van Welzijn, Volksgezondheid en Cultuur van 21 juli 1994, DGVgz/VVP/C
    941365, uitgebracht in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer
    en Onze Minister van Economische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006870/1994-09-14#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder asbestvezels:'
    url: https://wetten.overheid.nl/BWBR0006870/1994-09-14#Artikel1
  - number: 1.a
    text: crocidoliet, CAS nr. 12001-28-4
    url: https://wetten.overheid.nl/BWBR0006870/1994-09-14#Artikel1
  - number: 1.b
    text: amosiet, CAS nr. 12172-73-5
    url: https://wetten.overheid.nl/BWBR0006870/1994-09-14#Artikel1
  - number: 1.c
    text: anthofyllietasbest, CAS nr. 77536-67-5
    url: https://wetten.overheid.nl/BWBR0006870/1994-09-14#Artikel1
  - number: 1.d
    text: actinolietasbest, CAS nr. 77536-66-4
    url: https://wetten.overheid.nl/BWBR0006870/1994-09-14#Artikel1
  - number: 1.e
    text: tremolietasbest, CAS nr. 77536-68-6
    url: https://wetten.overheid.nl/BWBR0006870/1994-09-14#Artikel1
  - number: 1.f
    text: chrysotiel, CAS nr. 12001-29-5
    url: https://wetten.overheid.nl/BWBR0006870/1994-09-14#Artikel1
  - number: '2.1'
    text: Het is verboden waren te verhandelen die niet voldoen aan de in of krachtens dit besluit gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006870/1994-09-14#Artikel2
  - number: '2.2'
    text: |-
      Het is verboden waren die asbestvezels bevatten, te verhandelen anders dan met inachtneming van de voorschriften in
      of krachtens dit besluit gesteld met betrekking tot het bezigen van vermeldingen.
    url: https://wetten.overheid.nl/BWBR0006870/1994-09-14#Artikel2
  - number: '3'
    text: |-
      Waren mogen niet de asbestvezels bevatten, die genoemd zijn in [artikel 1, onderdelen ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006870#Artikel1
    url: https://wetten.overheid.nl/BWBR0006870/1994-09-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006870
        artikel: '1'
  - number: '4.1'
    text: |-
      Waren mogen slechts asbestvezels als genoemd in [artikel 1, onderdeel ][ref1], bevatten die ieder voor zich
      blijvend hecht gebonden zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006870#Artikel1
    url: https://wetten.overheid.nl/BWBR0006870/1994-09-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006870
        artikel: '1'
  - number: '4.2'
    text: |-
      Asbestvezels worden, behoudens voor zover zij aanwezig zijn in textielartikelen als bedoeld in het
      [Textielartikelenbesluit (Warenwet)][ref1], als hechtgebonden beschouwd indien de asbestbevattende waar een
      kwaliteitsfactor heeft van 0,35 of meer, bepaald volgens de onderzoeksmethode die als [bijlage I][ref2] bij dit
      besluit is gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002932
      [ref2]: https://wetten.overheid.nl/BWBR0006870
    url: https://wetten.overheid.nl/BWBR0006870/1994-09-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002932
      - id: ref2
        bwb_id: BWBR0006870
  - number: '4.3'
    text: |-
      Onze Minister van Welzijn, Volksgezondheid en Cultuur kan in overeenstemming met Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer nadere regelen stellen met betrekking tot de
      hechtgebondenheid van asbestvezels.
    url: https://wetten.overheid.nl/BWBR0006870/1994-09-14#Artikel4
  - number: '4.4'
    text: |-
      Het eerste tot en met derde lid is niet van toepassing op asbestbevattende waren, zijnde halffabrikaten welke zijn
      bestemd om te worden verwerkt tot waren waarin de asbestvezels blijvend hecht gebonden zijn.
    url: https://wetten.overheid.nl/BWBR0006870/1994-09-14#Artikel4
  - number: '5'
    text: 'De volgende waren mogen geen chrysotiel bevatten:'
    url: https://wetten.overheid.nl/BWBR0006870/1994-09-14#Artikel5
  - number: 5.a
    text: tabakspijpen, sigare- en sigarettepijpjes;
    url: https://wetten.overheid.nl/BWBR0006870/1994-09-14#Artikel5
  - number: 5.b
    text: verf en vernis;
    url: https://wetten.overheid.nl/BWBR0006870/1994-09-14#Artikel5
  - number: 5.c
    text: |-
      katalytische zeven en isolatievoorzieningen, bestemd voor of ingebouwd in verwarmingstoestellen die op vloeibaar
      gas werken;
    url: https://wetten.overheid.nl/BWBR0006870/1994-09-14#Artikel5
  - number: 5.d
    text: deklagen van wegen tenzij het asbestvezelgehalte niet meer dan 2% bedraagt;
    url: https://wetten.overheid.nl/BWBR0006870/1994-09-14#Artikel5
  - number: 5.e
    text: |-
      mortel, oppervlaktebeschermingsmiddelen, vul- en voegmaterialen, dichtingsmaterialen, mastiek, lijm, sierpoeder
      en -deklagen;
    url: https://wetten.overheid.nl/BWBR0006870/1994-09-14#Artikel5
  - number: 5.f
    text: isolatie- of geluiddempingsmaterialen met geringe dichtheid (dichtheid minder dan 1 g/cm3);
    url: https://wetten.overheid.nl/BWBR0006870/1994-09-14#Artikel5
  - number: 5.g
    text: luchtfilters en filters voor transport, distributie en gebruik van aardgas en stadsgas;
    url: https://wetten.overheid.nl/BWBR0006870/1994-09-14#Artikel5
  - number: 5.h
    text: onderlagen en voeringen voor vloer- of wandbedekking van kunststof;
    url: https://wetten.overheid.nl/BWBR0006870/1994-09-14#Artikel5
  - number: 5.i
    text: |-
      eindprodukten van textiel in de vorm die is bestemd om aan de eindgebruiker te worden geleverd, tenzij zij zijn
      behandeld om het vrijkomen van vezels te voorkomen;
    url: https://wetten.overheid.nl/BWBR0006870/1994-09-14#Artikel5
  - number: 5.j
    text: dakvilt.
    url: https://wetten.overheid.nl/BWBR0006870/1994-09-14#Artikel5
  - number: '6'
    text: |-
      Asbestbevattende waren zijn voorzien van vermeldingen overeenkomstig [bijlage II][ref1] bij dit besluit, waaruit
      de aanwezigheid van asbest in die waren, alsmede de bij de be- of verwerking van die waren in acht te nemen
      voorzorgsmaatregelen duidelijk blijken. [Artikel 4, vierde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006870
      [ref2]: https://wetten.overheid.nl/BWBR0006870#Artikel4
    url: https://wetten.overheid.nl/BWBR0006870/1994-09-14#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006870
      - id: ref2
        bwb_id: BWBR0006870
        artikel: '4'
  - number: '7'
    text: |-
      Dit besluit is niet van toepassing op frictiematerialen waarvoor regelen zijn gesteld bij het
      [Besluit asbestvrije frictiematerialen Wet milieugevaarlijke stoffen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005207
    url: https://wetten.overheid.nl/BWBR0006870/1994-09-14#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005207
  - number: '8'
    text: Het Asbestbesluit (Warenwet) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006870/1994-09-14#Artikel8
  - number: '9'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0006870/1994-09-14#Artikel9
  - number: '10'
    text: 'Dit besluit wordt aangehaald als: Warenwetbesluit asbest.'
    url: https://wetten.overheid.nl/BWBR0006870/1994-09-14#Artikel10
