  - number: V.2
    text: |-
      Op de inburgeringsplichtige, bedoeld in [artikel 1, onderdeel, b, van de Wet inburgering][ref1], voor
      wie de termijn voor het behalen van het examen, bedoeld in [artikel 13, eerste lid, van die wet][ref2]
      op grond van [artikel 7, eerste lid][ref3], of [26 van die wet][ref4] is aangevangen, blijven de
      [artikelen 2.1 tot en met 2.3][ref5], [2.8 tot en met 2.11][ref6], [hoofdstuk 4, afdelingen 1][ref7] en [2][ref8],
      [hoofdstuk 5][ref9] en [hoofdstuk 6, afdeling 1, van het Besluit inburgering][ref10] van toepassing.


