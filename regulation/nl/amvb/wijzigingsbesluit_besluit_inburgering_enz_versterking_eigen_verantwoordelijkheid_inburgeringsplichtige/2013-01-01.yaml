    text: |-
      In het tweede tot en met zesde lid wordt verstaan onder: - *Besluit inburgering:* [Besluit inburgering][ref1] zoals
      dit luidde voor het tijdstip van inwerkingtreding van [artikel I][ref2] van dit besluit;
        - *Wet inburgering:* [Wet inburgering][ref3] zoals deze luidde voor het tijdstip van inwerkingtreding van
