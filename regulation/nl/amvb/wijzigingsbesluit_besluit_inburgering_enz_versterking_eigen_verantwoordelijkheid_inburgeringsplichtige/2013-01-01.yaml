preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister voor Immigratie, Integratie en Asiel van 22 juni 2012, nr. 2012.0000367715,
    directie Constitutionele Zaken en Wetgeving;

    Gelet op de artikelen 5, eerste lid, onderdeel c, derde en vierde lid, 6, tweede lid, 7, vierde lid, 16, eerste,
    derde tot en met vijfde lid, 47, tweede lid, onderdeel a, en derde lid, van de Wet inburgering, artikel 4 van de
    Wet wettelijke grondslag bdu siv, artikel 2, vierde en vijfde lid, van de Wet participatiebudget, en de artikelen
    16a, tweede lid, 18, tweede lid, 21, tweede lid, en 34, tweede lid, van de Vreemdelingenwet 2000;

    De Afdeling advisering van de Raad van State gehoord (advies van 18 juli 2012, nr. W04.12.0223/I);

    Gezien het nader rapport van Onze Minister voor Immigratie, Integratie en Asiel van 21 september 2012, nr. 2012-
    0000527453, directie Constitutionele Zaken en Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0032034/2013-01-01#ArtikelAanhef
