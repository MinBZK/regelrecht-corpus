  - number: V.4
    text: |-
      Onverminderd het tweede lid blijven de [artikelen 4.23][ref1], [4.24][ref2] en
      [4.27 van het Besluit inburgering][ref3] van toepassing op de geestelijke bedienaar, bedoeld in
      [artikel 1, onderdeel g, van de Wet inburgering][ref4], die geen oudkomer is als bedoeld in artikel 1, onderdeel
      c, van die wet, voor zover hij voor het tijdstip van inwerkingtreding van [artikel I][ref5] van dit besluit
      inburgeringsplichtig is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
