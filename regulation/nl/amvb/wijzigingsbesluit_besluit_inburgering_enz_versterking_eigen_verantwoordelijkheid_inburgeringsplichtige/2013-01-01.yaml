  - number: V.7
    text: |-
      Bij regeling van Onze Minister voor Immigratie, Integratie en Asiel wordt een termijn of worden termijnen
      vastgesteld, waarbinnen [hoofdstuk 3 van het Besluit inburgering][ref1] van toepassing blijft op de in het
      tweede tot en met vierde lid bedoelde personen van wie in redelijkheid niet kan worden gevergd dat zij het
      examen, bedoeld in [artikel 7, tweede lid, onderdeel a, van de Wet inburgering][ref2] als gewijzigd door de
      __REF002___________________________________________________________________________________________________________
      _________________________________________________________________________ (Stb. 2012, 430) kunnen afleggen, en
      waarbinnen deze personen het examen, bedoeld in [artikel 13, eerste lid, van de Wet inburgering][ref4] zoals dit
      luidde voor het tijdstip van inwerkingtreding van [artikel I van die wet][ref5], kunnen afleggen.


