  - number: V.3
    text: |-
      Onverminderd het tweede lid blijven de [artikelen 4.23][ref1] en [4.27 van het Besluit inburgering][ref2]
      van toepassing op de inburgeringsplichtige die houder is van een verblijfsvergunning als bedoeld in
      [artikel 28 van de Vreemdelingenwet 2000][ref3], voor zover hij voor het tijdstip van inwerkingtreding van
      [artikel I][ref4] van dit besluit inburgeringsplichtig is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel4
