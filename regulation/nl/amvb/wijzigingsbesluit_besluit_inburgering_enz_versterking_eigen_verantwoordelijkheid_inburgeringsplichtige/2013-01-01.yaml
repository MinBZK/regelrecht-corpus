  - number: V.5
    text: |-
      Op de oudkomer, bedoeld in [artikel 1, onderdeel c, van de Wet inburgering][ref1], voor wie voor het tijdstip
      van inwerkingtreding van dit besluit geen termijn op grond van [artikel 26 van de Wet inburgering][ref2] is
      aangevangen, blijft [hoofdstuk 4, afdeling 2, van het Besluit inburgering][ref3] van toepassing tot drie jaar na
      dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0020674#Afdeling2
