  - number: V.6
    text: |-
      [Hoofdstuk 6, afdeling 2, van het Besluit inburgering][ref1] blijft van toepassing op de vrijwillige
      inburgeraar, bedoeld in [artikel 1, onderdeel q, van de Wet inburgering][ref2], die met het college van
      burgemeester en wethouders van de gemeente, waar de vrijwillige inburgeraar woonplaats heeft in de zin van
      [titel 3 van Boek 1 van het Burgerlijk Wetboek][ref3], op grond van [artikel 24d van de Wet inburgering][ref4] een
      overeenkomst heeft gesloten tot het volgen van een inburgeringsvoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel1
