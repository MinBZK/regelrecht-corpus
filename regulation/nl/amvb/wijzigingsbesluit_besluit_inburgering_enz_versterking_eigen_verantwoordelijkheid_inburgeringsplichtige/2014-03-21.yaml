preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister voor Immigratie, Integratie en Asiel van 22 juni 2012, nr. 2012.0000367715,
    directie Constitutionele Zaken en Wetgeving;

    Gelet op de artikelen 5, eerste lid, onderdeel c, derde en vierde lid, 6, tweede lid, 7, vierde lid, 16, eerste,
    derde tot en met vijfde lid, 47, tweede lid, onderdeel a, en derde lid, van de Wet inburgering, artikel 4 van de
    Wet wettelijke grondslag bdu siv, artikel 2, vierde en vijfde lid, van de Wet participatiebudget, en de artikelen
    16a, tweede lid, 18, tweede lid, 21, tweede lid, en 34, tweede lid, van de Vreemdelingenwet 2000;

    De Afdeling advisering van de Raad van State gehoord (advies van 18 juli 2012, nr. W04.12.0223/I);

    Gezien het nader rapport van Onze Minister voor Immigratie, Integratie en Asiel van 21 september 2012, nr. 2012-
    0000527453, directie Constitutionele Zaken en Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0032034/2014-03-21#ArtikelAanhef
articles:
  - number: V
    text: |-
      1 In het tweede tot en met zesde lid wordt verstaan onder:

        - *Besluit inburgering:* [Besluit inburgering][ref1] zoals dit luidde voor het tijdstip van inwerkingtreding van
      [artikel I][ref2] van dit besluit;
        - *Wet inburgering:* [Wet inburgering][ref3] zoals deze luidde voor het tijdstip van inwerkingtreding van
      __REF003___________________________________________________________________________________________________________
      _________________________________________________________________________________________ (Stb. 2012, 432).

      2 Op de inburgeringsplichtige, bedoeld in [artikel 1, onderdeel, b, van de Wet inburgering][ref5], voor
      wie de termijn voor het behalen van het examen, bedoeld in [artikel 13, eerste lid, van die wet][ref6]
      op grond van [artikel 7, eerste lid][ref7], of [26 van die wet][ref8] is aangevangen, blijven de
      [artikelen 2.1 tot en met 2.3][ref9], [2.8 tot en met 2.11][ref10], [hoofdstuk 4, afdelingen 1][ref11] en
      [2][ref12], [hoofdstuk 5][ref13] en [hoofdstuk 6, afdeling 1, van het Besluit inburgering][ref14] van toepassing.

      3 Onverminderd het tweede lid blijven de [artikelen 4.23][ref15] en [4.27 van het Besluit inburgering][ref16]
      van toepassing op de inburgeringsplichtige die houder is van een verblijfsvergunning als bedoeld in
      [artikel 28 van de Vreemdelingenwet 2000][ref17], voor zover hij voor het tijdstip van inwerkingtreding van
      [artikel I][ref18] van dit besluit inburgeringsplichtig is geworden.

      4 Onverminderd het tweede lid blijven de [artikelen 4.23][ref19], [4.24][ref20] en
      [4.27 van het Besluit inburgering][ref21] van toepassing op de geestelijke bedienaar, bedoeld in
      [artikel 1, onderdeel g, van de Wet inburgering][ref22], die geen oudkomer is als bedoeld in artikel 1, onderdeel
      c, van die wet, voor zover hij voor het tijdstip van inwerkingtreding van [artikel I][ref23] van dit besluit
      inburgeringsplichtig is geworden.

      5 Op de oudkomer, bedoeld in [artikel 1, onderdeel c, van de Wet inburgering][ref24], voor wie voor het tijdstip
      van inwerkingtreding van dit besluit geen termijn op grond van [artikel 26 van de Wet inburgering][ref25] is
      aangevangen, blijft [hoofdstuk 4, afdeling 2, van het Besluit inburgering][ref26] van toepassing tot drie jaar na
      dat tijdstip. Aan [artikel 4.17, derde lid, van het Besluit inburgering][ref27] wordt tevens toepassing gegeven
      indien de inburgeringsplichtige oudkomer slaagt voor het inburgeringsexamen.

      6 [Hoofdstuk 6, afdeling 1, van het Besluit inburgering][ref28] blijft van toepassing op de vrijwillige
      inburgeraar, bedoeld in [artikel 1, onderdeel q, van de Wet inburgering][ref29], die met het college van
      burgemeester en wethouders van de gemeente, waar de vrijwillige inburgeraar woonplaats heeft in de zin van
      [titel 3 van Boek 1 van het Burgerlijk Wetboek][ref30], op grond van [artikel 24d van de Wet inburgering][ref31]
      een overeenkomst heeft gesloten tot het volgen van een inburgeringsvoorziening.

      7 Bij regeling van Onze Minister voor Immigratie, Integratie en Asiel wordt een termijn of worden termijnen
      vastgesteld, waarbinnen [hoofdstuk 3 van het Besluit inburgering][ref32] van toepassing blijft op de in het
      tweede tot en met vierde lid bedoelde personen van wie in redelijkheid niet kan worden gevergd dat zij het
      examen, bedoeld in [artikel 7, tweede lid, onderdeel a, van de Wet inburgering][ref33] als gewijzigd door de
      __REF002___________________________________________________________________________________________________________
      _________________________________________________________________________ (Stb. 2012, 430) kunnen afleggen, en
      waarbinnen deze personen het examen, bedoeld in [artikel 13, eerste lid, van de Wet inburgering][ref35] zoals dit
      luidde voor het tijdstip van inwerkingtreding van [artikel I van die wet][ref36], kunnen afleggen.


