  - number: '2'
    text: |-
      De werkgever informeert de werknemer bij beëindiging en bij aanvang van de deelneming aan de pensioenregeling
      terstond over zijn recht op waarde-overdracht.
    url: https://wetten.overheid.nl/BWBR0006867/2002-01-01#Artikel2
  - number: '3'
    text: |-
      1 De rechthebbende die overweegt gebruik te maken van zijn recht op waarde-overdracht verzoekt het overnemende
      uitvoeringsorgaan om een opgave te verstrekken van zijn aanspraken op pensioen zoals bepaald in [artikel 4][ref1]:

      a. binnen twee maanden na de aanvangsdatum van de deelneming aan een pensioenregeling;

      b. binnen twee maanden na de datum van beëindiging van een van de deelnemingen, in geval van gelijktijdige
      deelneming aan meerdere pensioenregelingen als bedoeld in [artikel 1, onderdeel ][ref2].

      2 De rechthebbende kan voor het einde van de termijn genoemd in [artikel 7, eerste lid][ref3], verzoeken om een
      aanvullende opgave voor het geval de waarde van het nabestaandenpensioen niet wordt overgedragen. De termijnen
      genoemd in de [artikelen 4 tot en met 7, eerste lid][ref4], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006867#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006867#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0006867#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0006867#Artikel4
    url: https://wetten.overheid.nl/BWBR0006867/2002-01-01#Artikel3
