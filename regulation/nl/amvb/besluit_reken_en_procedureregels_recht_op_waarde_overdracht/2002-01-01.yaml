preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 18 januari 1994, Directoraat-Generaal
    Sociale Zekerheid, Hoofdafdeling Volksverzekeringen en Pensioenen, nr. DGSZ/SV/O/94/0068;

    Gelet op artikel 32b, derde lid, van de Pensioen- en spaarfondsenwet;

    Gezien de adviezen van de Stichting van de Arbeid van 24 juni en 11 oktober 1993 en van de Verzekeringskamer van 24
    december 1993;

    De Raad van State gehoord (advies van 20 juni 1994, nr. W12.94.0025);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 10 augustus 1994,
    Directoraat-Generaal Sociale Zekerheid, nr. SZ/SV/P/94/3451;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006867/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. de wet: de [Pensioen- en spaarfondsenwet][ref1];

      b. uitvoeringsorgaan: instelling waarbij de werkgever de uitvoering van de in [artikel 2 van de wet ][ref2]bedoelde
      pensioentoezegging heeft ondergebracht, waarbij het overdragende uitvoeringsorgaan de instelling is die op grond
      van [artikel 32][ref3]de waarde overdraagt en het overnemende uitvoeringsorgaan de instelling waaraan de waarde
      wordt overgedragen;

      c. waarde-overdracht: overdracht van de afkoopsom van de aanspraken op pensioen ter verwerving van met de waarde
      van die afkoopsom overeenkomende aanspraken in de regeling van het overnemende uitvoeringsorgaan;

      d. rechthebbende: degene die in aanmerking komt voor waarde-overdracht op grond van [artikel 32][ref4];

      e. fictieve overdrachtswaarde: waarde van fictieve of achterblijvende aanspraak op nabestaandenpensioen;

      f. reguliere pensioenregeling: pensioenregeling waarbij de pensioenaanspraken in de zin van
      [artikel 8 van de wet][ref5] worden uitgedrukt in euro pensioen;

      g. niet-reguliere pensioenregelingen: alle overige pensioenregelingen;

      h. nabestaandenpensioen: weduwen-, weduwnaars- of partnerpensioen;

      i. overdrachtsdatum: aanvangsdatum van deelneming aan de pensioenregeling van het overnemende uitvoeringsorgaan; in
      geval van gelijktijdige deelneming aan meerdere pensioenregelingen en er sprake is van overdracht van de ene naar
      de andere regeling is de overdrachtsdatum de datum van beëindiging van de deelneming aan de eerstgenoemde regeling;

      j. u-rendement: het u-rendement zoals dit maandelijks wordt gepubliceerd door het Centrum Verzekeringsstatistiek
      van het Verbond van Verzekeraars.


