        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006867
        artikel: '4'
        paragraaf: '2'
  - number: '6'
    text: |-
      Het overnemende uitvoeringsorgaan verstrekt de opgave bedoeld in [artikel 5, eerste lid][ref1], binnen twee maanden
      na ontvangst aan rechthebbende onder vermelding van de aanspraken die zullen voortvloeien uit de waarde-overdracht
      en de wijze waarop de aanspraken in de pensioenregeling ondergebracht bij het overnemende uitvoeringsorgaan worden
      behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006867#Artikel5
    url: https://wetten.overheid.nl/BWBR0006867/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006867
        artikel: '5'
        paragraaf: '2'
  - number: '7'
    text: |-
      1 Indien de rechthebbende gebruik wil maken van zijn recht op waarde-overdracht dient hij binnen twee maanden na
      ontvangst van de opgave bedoeld in [artikel 6][ref1] en indien van toepassing [artikel 3, tweede lid][ref2], een
      verzoek tot waarde-overdracht in bij het overnemende uitvoeringsorgaan.

      2 Indien de rechthebbende gehuwd is, moet de echtgenoot verklaren in te stemmen met het verzoek tot overdracht van
      het nabestaandenpensioen.

      3 Indien de echtgenoot niet instemt met het verzoek tot overdracht van het nabestaandenpensioen, is
      [artikel 8, achtste lid, van de wet][ref3] hierop van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006867#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006867#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002089#Artikel8
    url: https://wetten.overheid.nl/BWBR0006867/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006867
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006867
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002089
        artikel: '8'
  - number: '8'
    text: |-
      1 Het overnemende uitvoeringsorgaan stelt het overdragende uitvoeringsorgaan terstond in kennis van de ontvangst
      van het verzoek tot waarde-overdracht.

      2 Het risico dat betrekking heeft op de over te dragen aanspraken komt met ingang van de datum van het verzoek van
      de rechthebbende tot waarde-overdracht voor rekening van het overnemende uitvoeringsorgaan.

      3 De overdrachtswaarde wordt binnen drie maanden na ontvangst van het verzoek tot waarde-overdracht door het
      overdragende uitvoeringsorgaan aan het overnemende uitvoeringsorgaan betaald.

      4 Het overdragende uitvoeringsorgaan is rente verschuldigd over de overdrachtswaarde over de periode tussen de
      overdrachtsdatum en de datum waarop de overdrachtswaarde wordt betaald. Bij ministeriële regeling wordt bepaald op
      welke wijze de rente wordt berekend.
    url: https://wetten.overheid.nl/BWBR0006867/2002-01-01#Artikel8
  - number: '9'
    text: |-
      1 De overdrachtswaarde is gelijk aan de contante waarde van de over te dragen nominale aanspraken, vermenigvuldigd
      met de kortingsfactor f geldend op de overdrachtsdatum, en wordt berekend op basis van een standaardtarief. Bij
      ministeriële regeling worden regels gesteld voor het standaardtarief.

      2 De kortingsfactor f, bedoeld in het eerste lid, wordt berekend overeenkomstig de formule f = 1 - (f1 * f2). In de
      vorenbedoelde formule is:

      a. f1 afhankelijk van het u-rendement per 1 januari van het jaar waarin de overdrachtsdatum valt, met dien
      verstande dat de volgende tabel van toepassing is:








                        u-rendement


                        f1




                        u 5


                        0




                        5 < u 6


                        0,10




                        6 < u 8


                        0,20




                        8 < u 10


                        0,30




                        10 < u 12


                        0,40




                        u > 12


                        0,50






      b. wat betreft f2 de volgende tabel van toepassing:








                        jaar waarin de overdrachtsdatum valt


                        f2




                        1994


                        1,0




                        1995


                        0,9




                        1996


                        0,8




                        1997


                        0,7




                        1998


                        0,6




                        1999


                        0,5




                        2000


                        0,4




                        2001


                        0,3




                        2002


                        0,2




                        2003


                        0,1




                        2004 en later


                        0






      3 In afwijking van het eerste lid worden de aanspraken, indien de overdrachtswaarde niet op basis van
      het standaardtarief bepaald kan worden, met behoud van de actuariële gelijkwaardigheid eerst omgezet in
      pensioenaanspraken waarop het standaardtarief wel toegepast kan worden.

      4 Voor de bepaling van de overdrachtswaarde blijven buiten beschouwing:

      a. toekomstige aanpassingen van de aanspraken, niet zijnde meeverzekerde onvoorwaardelijk toegezegde verhogingen
      waarvan de hoogte in absolute of procentuele zin vaststaat;

      b. wezenpensioen en invaliditeitspensioen;

      c. aanspraken op nabestaandenpensioen die achterblijven bij het overdragende uitvoeringsorgaan;

      d. fictieve aanspraak op nabestaandenpensioen voor een ongehuwde zonder partner die deelneemt in een
      pensioenregeling waarbij nabestaandenpensioen uitsluitend wordt toegezegd aan gehuwden ten behoeve van de huidige
      echtgenoot dan wel aan degenen die ongehuwd samenleven ten behoeve van de huidige partner.

      5 In afwijking van het eerste lid is de overdrachtswaarde bij een niet-reguliere pensioenregeling gelijk aan het
      gefinancierde deel van de aanspraken.
    url: https://wetten.overheid.nl/BWBR0006867/2002-01-01#Artikel9
  - number: '10'
    text: |-
      De waarde van achterblijvende en fictieve aanspraken op nabestaandenpensioen wordt afzonderlijk berekend als
      fictieve overdrachtswaarde overeenkomstig [artikel 9, leden 1 tot en met 4, onderdeel ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006867#Artikel9
    url: https://wetten.overheid.nl/BWBR0006867/2002-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006867
        artikel: '9'
        paragraaf: '3'
  - number: '11'
    text: |-
      Indien de overdrachtswaarde ongelijk is aan het gefinancierde deel van de aanspraken komt het verschil ten gunste
      respectievelijk ten laste van de oude werkgever of van het pensioenfonds waar deze de pensioenregeling heeft
      ondergebracht.
    url: https://wetten.overheid.nl/BWBR0006867/2002-01-01#Artikel11
  - number: '12'
    text: |-
      1 De door het overdragende uitvoeringsorgaan opgegeven overdrachtswaarde wordt aangewend voor ouderdomspensioen,
      nabestaandenpensioen en overige pensioenvormen op basis van de pensioenregeling ondergebracht bij het overnemende
      uitvoeringsorgaan. Daarbij kan rekening worden gehouden met een fictieve overdrachtswaarde.

      2 Voor gevallen van waarde-overdracht van pensioenaanspraken naar een reguliere pensioenregeling worden
      bij ministeriële regeling nadere regels gesteld voor de berekening van pensioenaanspraken op grond van de
      overdrachtswaarde in de pensioenregeling van het overnemende uitvoeringsorgaan.

      3 Bij waarde-overdracht van pensioenaanspraken naar een niet-reguliere pensioenregeling wordt de overdrachtswaarde
      aangewend als inkoopsom voor pensioenaanspraken in die pensioenregeling.
    url: https://wetten.overheid.nl/BWBR0006867/2002-01-01#Artikel12
  - number: '13'
    text: |-
      1 De na waarde-overdracht verkregen aanspraken worden in de pensioenregeling ondergebracht bij het overnemende
      uitvoeringsorgaan behandeld alsof zij in de regeling zelf zijn opgebouwd.

      2 Indien de overgedragen pensioenaanspraken leiden tot meer dan het maximale aantal jaren waarover in de
      pensioenregeling ondergebracht bij het overnemende uitvoeringsorgaan pensioen kan worden opgebouwd, wordt het
      meerdere behandeld als een bij ontslag verkregen pensioenaanspraak in die regeling.
    url: https://wetten.overheid.nl/BWBR0006867/2002-01-01#Artikel13
  - number: '14'
    text: |-
      Indien op de dag van het in werking treden van dit besluit de termijn bedoeld in [artikel 3, eerste lid][ref1],
      geheel of gedeeltelijk is verstreken, wordt deze termijn verlengd tot twee maanden na de dag van in werking treden
      van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006867#Artikel3
    url: https://wetten.overheid.nl/BWBR0006867/2002-01-01#Artikel14
    references:
