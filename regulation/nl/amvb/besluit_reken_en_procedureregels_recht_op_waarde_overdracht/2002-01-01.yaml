        artikel: '3'
        paragraaf: '2'
  - number: '15'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na datum van uitgifte van het *Staatsblad*
      waarin het wordt geplaatst en werkt terug tot en met de datum waarop de Wet tot wijziging van de
      [Pensioen- en spaarfondsenwet][ref1] en enige andere wetten (wettelijk recht op waarde-overdracht en enige andere
      maatregelen op het aanvullend pensioenterrein) in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0002089
    url: https://wetten.overheid.nl/BWBR0006867/2002-01-01#Artikel15
