  - number: '4'
    text: |-
      Het overnemende uitvoeringsorgaan vraagt binnen één maand na ontvangst van het verzoek als bedoeld in
      [artikel 3, eerste lid][ref1], aan het overdragende uitvoeringsorgaan een opgave per de overdrachtsdatum van:

      a. de overdrachtswaarde;

      b. de nominale pensioenaanspraken waarop de overdrachtswaarde is gebaseerd;

      c. de wijze waarop deze aanspraken in de pensioenregeling ondergebracht bij het overdragende uitvoeringsorgaan
      worden aangepast;

      d. fictieve overdrachtswaarde, voor zover van toepassing;

      e. de pensioendatum;

      f. alle overige informatie die van belang is voor de uitvoering van [artikel 32][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006867#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel32b
    url: https://wetten.overheid.nl/BWBR0006867/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006867
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002089
        artikel: 32b
  - number: '5'
    text: |-
      1 Het overdragende uitvoeringsorgaan verstrekt de opgave bedoeld in [artikel 4][ref1] binnen twee maanden na
      ontvangst van het daartoe strekkende verzoek aan het overnemende uitvoeringsorgaan.

      2 Indien het overdragende uitvoeringsorgaan een niet-reguliere pensioenregeling uitvoert zijn de
      [onderdelen ][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006867#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006867#Artikel4
    url: https://wetten.overheid.nl/BWBR0006867/2002-01-01#Artikel5
    references:
      - id: ref1
