  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 27 juni 2006, nr.
    DJZ2006279233, Directie Juridische Zaken, Afdeling Wetgeving;

    Gelet op artikel 82 van de Woningwet;

    De Raad van State gehoord (advies van 9 augustus 2006, no. W08.06.0238/V);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 18
    september 2006, nr. DJZ2006299045, Directie Juridische Zaken, Afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0020333/2009-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      Commissie: Commissie van de Europese Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0020333/2009-07-01#Artikel1
  - number: '2'
    text: |-
      Onze Minister kan op aanvraag subsidie verstrekken aan rechtspersonen die experimenten uitvoeren of
      kennisoverdrachtactiviteiten verrichten gericht op:

      a. het scheppen van randvoorwaarden voor een goed functionerende woningmarkt;

      b. het versterken van de positie van de woonconsument;

      c. het bevorderen van de leefbaarheid van wijken, of

      d. het waarborgen van de minimale kwaliteit van gebouwen en het verbeteren van de kwaliteit van gebouwen, met
      inbegrip van het stimuleren van innovatie.
    url: https://wetten.overheid.nl/BWBR0020333/2009-07-01#Artikel2
  - number: '3'
    text: |-
      1 De aanvraag tot subsidieverlening wordt voor aanvang van de activiteit waarvoor de subsidie wordt aangevraagd
      schriftelijk ingediend bij Onze Minister.

      2 Bij ministeriële regeling wordt bepaald welke gegevens en bescheiden bij de aanvraag worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0020333/2009-07-01#Artikel3
  - number: '4'
    text: |-
      Onze Minister beslist, behoudens het bepaalde in de [artikelen 5, tweede lid][ref1], en [6, eerste lid][ref2],
      binnen acht weken op de subsidieaanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0020333#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0020333#Artikel6
    url: https://wetten.overheid.nl/BWBR0020333/2009-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020333
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020333
        artikel: '6'
        hoofdstuk: '2'
  - number: '5'
    text: |-
      1 Indien een subsidieaanvraag onvolledig is, geeft Onze Minister de aanvrager de gelegenheid om binnen een door hem
      te stellen termijn de aanvraag aan te vullen.

      2 In het geval, bedoeld in het eerste lid, beslist Onze Minister, in afwijking van [artikel 4][ref1] binnen acht
      weken na de dag waarop de subsidieaanvraag is aangevuld.


      [ref1]: https://wetten.overheid.nl/BWBR0020333#Artikel4
    url: https://wetten.overheid.nl/BWBR0020333/2009-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020333
        artikel: '4'
        hoofdstuk: '2'
  - number: '6'
    text: |-
      1 Indien voor een subsidie goedkeuring van de Commissie is vereist op grond van artikel 88, derde lid, van het
      Verdrag tot oprichting van de Europese Gemeenschap:

      a. dient Onze Minister zo spoedig mogelijk een verzoek tot goedkeuring in bij de Commissie, en

      b. beslist Onze Minister, in afwijking van [artikel 4][ref1], binnen acht weken nadat die goedkeuring is verkregen.

      2 Onze Minister doet in de Staatscourant mededeling van het verkrijgen van de goedkeuring van de Commissie. Indien
      de Commissie voorschriften aan de goedkeuring verbindt, verbindt Onze Minister deze als verplichtingen aan de
      beschikking tot subsidieverlening, voorzover zij zich daartoe lenen.

      3 Indien wordt voldaan aan de eisen gesteld bij of krachtens de Verordening (EG) nr. 69/2001 van de Commissie van
      de Europese Gemeenschappen van 12 januari 2001 betreffende de toepassing van artikel 87 en 88 van het EG-Verdrag op
      de minimis-steun (PbEG L 10), dan wel later daarvoor in de plaats tredende Europese regelgeving legt de aanvrager
      bij de aanvraag tot subsidieverlening een verklaring omtrent de minimis-steun over.

      4 Bij ministeriële regeling wordt een model voor de verklaring, bedoeld in het derde lid, vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020333#Artikel4
    url: https://wetten.overheid.nl/BWBR0020333/2009-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020333
        artikel: '4'
        hoofdstuk: '2'
  - number: '7'
    text: |-
      1 Onze Minister weigert de subsidieverlening indien de goedkeuring, bedoeld in [artikel 6, eerste lid][ref1], door
      de Commissie is geweigerd.

      2 Onze Minister kan de subsidieverlening weigeren indien:

      a. de activiteit waarvoor de subsidie wordt aangevraagd onvoldoende bijdraagt aan de doeleinden, genoemd in
      [artikel 2][ref2];

      b. voor de activiteit waarvoor de subsidie wordt aangevraagd reeds enige vorm van subsidie is verleend, of

      c. de activiteit waarvoor de subsidie wordt aangevraagd reeds is aangevangen voor het tijdstip van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0020333#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020333#Artikel2
    url: https://wetten.overheid.nl/BWBR0020333/2009-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020333
        artikel: '6'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020333
        artikel: '2'
        hoofdstuk: '1'
  - number: '8'
    text: |-
      1 Bij ministeriële regeling kunnen voor de doeleinden, genoemd in [artikel 2][ref1], subsidieplafonds worden
      vastgesteld.

      2 Indien voor bepaalde doeleinden een subsidieplafond is vastgesteld, wordt over subsidieaanvragen die betrekking
      hebben op die doeleinden beslist in volgorde van de ontvangst van de aanvragen, met dien verstande dat wanneer de
      aanvrager de gelegenheid heeft gehad de aanvraag aan te vullen, de dag waarop de aanvulling is ontvangen voor die
      beslissing als datum van ontvangst van de aanvraag geldt.

      3 Indien een subsidieplafond als bedoeld in het eerste lid is bereikt, doet Onze Minister daarvan onverwijld
      mededeling in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0020333#Artikel2
    url: https://wetten.overheid.nl/BWBR0020333/2009-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020333
        artikel: '2'
        hoofdstuk: '1'
  - number: '9'
    text: |-
      1 Onze Minister kan bij de verlening bepalen dat het subsidiebedrag wordt vastgesteld op de werkelijke kosten van
      de activiteit waarvoor de subsidie is aangevraagd tot een door hem te bepalen maximumbedrag.

      2 Bij het vaststellen van het subsidiebedrag wordt een winstopslag ten behoeve van de subsidieontvanger buiten
      beschouwing gelaten.

      3 In het geval, bedoeld in [artikel 6, tweede lid][ref1], bepaalt Onze Minister de hoogte van het subsidiebedrag in
      overeenstemming met de in dat lid bedoelde verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0020333#Artikel6
    url: https://wetten.overheid.nl/BWBR0020333/2009-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020333
        artikel: '6'
        hoofdstuk: '2'
  - number: '10'
    text: |-
      1 Onze Minister bepaalt bij de verlening voor welke datum de activiteit moet zijn verricht.

      2 Onze Minister kan bij de verlening verplichtingen opleggen:

      a. als bedoeld in [artikel 6, derde lid, tweede volzin][ref1], en

      b. die betrekking hebben op de wijze waarop of de middelen waarmee de activiteit wordt verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0020333#Artikel6
    url: https://wetten.overheid.nl/BWBR0020333/2009-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020333
        artikel: '6'
        hoofdstuk: '2'
  - number: '11'
    text: |-
      De subsidieontvanger is verplicht:

      a. de activiteit te verrichten overeenkomstig de omschrijving van die activiteit in de beschikking tot
      subsidieverlening tenzij Onze Minister voorafgaand aan die activiteit schriftelijk heeft ingestemd met een
      afwijking van die omschrijving;

      b. te voldoen aan de verplichtingen die Onze Minister bij de verlening heeft opgelegd;

      c. een administratie te voeren die zodanig is ingericht dat daaruit te allen tijde op eenvoudige en duidelijke
      wijze de kosten van de activiteit waarvoor de subsidie is verleend kunnen worden afgelezen;

      d. onverwijld nadat een verzoek tot verlening van surséance van betaling aan of faillietverklaring van hem dan wel
      een aangifte of vordering daartoe bij de rechtbank is ingediend, daarvan schriftelijk mededeling te doen aan Onze
      Minister;

      e. op verzoek van Onze Minister medewerking te verlenen aan openbaarmaking van de gegevens en de resultaten van de
      activiteit, met uitzondering van vertrouwelijke bedrijfsgegevens, en

      f. indien de activiteit niet voor het in de beschikking tot subsidieverlening genoemde tijdstip is verricht, niet
      zal worden verricht dan wel is stopgezet, Onze Minister onverwijld daarvan in kennis te stellen.
    url: https://wetten.overheid.nl/BWBR0020333/2009-07-01#Artikel11
  - number: '12'
    text: Op de verleende subsidie verleende voorschotten bedragen maximaal 80 procent van het bedrag van die subsidie.
    url: https://wetten.overheid.nl/BWBR0020333/2009-07-01#Artikel12
  - number: '13'
    text: |-
      1 De subsidieontvanger dient binnen acht weken na de datum, bedoeld in [artikel 10, eerste lid][ref1], een aanvraag
      in tot vaststelling van de subsidie.

      2 Onze Minister beslist, behoudens het bepaalde in [artikel 15, tweede lid][ref2], binnen acht weken op de aanvraag
      om subsidievaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0020333#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0020333#Artikel15
    url: https://wetten.overheid.nl/BWBR0020333/2009-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020333
        artikel: '10'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0020333
        artikel: '15'
        hoofdstuk: '5'
  - number: '14'
    text: |-
      1 De aanvraag tot vaststelling van de subsidie gaat vergezeld van:

      a. een verslag omtrent het verloop, de uitvoering en de resultaten van de activiteit, waaruit blijkt dat de
      subsidieontvanger heeft voldaan aan de verplichtingen, bedoeld in [artikel 11][ref1], en

      b. een financieel verslag dat is opgebouwd overeenkomstig de activiteitenbegroting die bij de aanvraag tot
      subsidieverstrekking is ingediend.

      2 Indien de gemaakte kosten meer dan 10 procent afwijken van de bij de aanvraag ingediende activiteitenbegroting,
      wordt in het financieel verslag, bedoeld in het eerste lid, onderdeel b, een toelichting daarop opgenomen.

      3 Indien het verleende subsidiebedrag is vastgesteld op de werkelijke kosten van de activiteit waarvoor
      de subsidie is aangevraagd en die kosten blijkens het financieel verslag het bedrag van € 50.000 te
      boven gaan, gaat het financieel verslag vergezeld van een verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2] omtrent de in dat verslag vermelde
      bestedingen.

      4 Bij ministeriële regeling worden regels gesteld omtrent de vorm en de inhoud van de verklaring, bedoeld in het
      derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020333#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0020333/2009-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0020333
        artikel: '11'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '15'
    text: |-
      1 Indien de subsidieontvanger van Onze Minister tevens een boekjaarsubsidie waarop
      [afdeling 4.2.8 van de Algemene wet bestuursrecht][ref1] van toepassing is, ontvangt:

      a. zijn de [artikelen 13, eerste lid][ref2], en [14, eerste lid, onderdeel a][ref3], niet van toepassing, en zijn
      [artikel 14, eerste lid, onderdeel b, en tweede lid][ref4], van overeenkomstige toepassing;

      b. neemt de subsidieontvanger in het financieel verslag over het jaar waarin de subsidie op basis van dit besluit
      is verleend op in hoeverre die subsidie is besteed ten behoeve van het doel waarvoor zij is verleend, en

      c. wordt het financieel verslag, bedoeld in onderdeel b, tevens aangemerkt als aanvraag tot vaststelling van de
      subsidie als bedoeld in [artikel 13][ref5].

      2 In afwijking van [artikel 13, tweede lid][ref6], beslist Onze Minister binnen acht weken na de ontvangst van het
      financieel verslag, bedoeld in het eerste lid, onderdeel b, omtrent de vaststelling van de op grond van dit besluit
      verleende subsidie.


