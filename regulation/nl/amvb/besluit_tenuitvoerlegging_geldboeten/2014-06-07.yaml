  - number: 3b
    text: |-
      1 In geval krachtens [artikel 257ba van het Wetboek van Strafvordering][ref1] een
      strafbeschikking wordt uitgevaardigd, kan het bevoegde lichaam of de bevoegde persoon bedoeld in
      [artikel 4.1, onderdeel b, van het Besluit OM-afdoening][ref2], bepalen dat betaling van de geldboete eveneens kan
      geschieden op een daartoe door dit lichaam of deze persoon aangewezen plaats of door het ter plaatse overschrijven
      op een daartoe bestemde bankrekening. Betaling van de geldboete geschiedt binnen een dag na die waarop het
      strafbare feit is ontdekt.

      2 Als plaats van betaling, bedoeld in het eerste lid, wordt slechts aangewezen een gebouw van de organisatie van
      de bevoegde ambtenaar, bedoeld in [artikel 4.1, onderdeel e, van het Besluit OM-afdoening][ref3], dan wel een
      tijdelijke plaats van betaling, ingesteld door of vanwege een lichaam of een persoon, bedoeld in artikel 4.1,
      onderdeel b, van het Besluit OM-afdoening.

      3 Door of vanwege een lichaam of een persoon, bedoeld in
      [artikel 4.1, onderdeel b, van het Besluit OM-afdoening][ref4], worden ambtenaren aangewezen die zijn belast met de
      inning van gelden die overeenkomstig het eerste lid worden betaald.

      4 De met inning belaste ambtenaar wordt in het bezit gesteld van een lijst met feiten als bedoeld in
      [artikel 4.6, tweede lid, van het Besluit OM-afdoening][ref5] en de voor deze feiten vastgestelde tarieven.
      Desgevraagd verleent hij degene die betaalt inzage in deze lijst.


