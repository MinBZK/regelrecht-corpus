articles:
  - number: '1'
    text: |-
      1 Het Centraal Justitieel Incassobureau, bedoeld in
      [artikel 1 van het Besluit Instelling Centraal Justitieel Incassobureau][ref1], heeft tot taak Onze
      Minister van Veiligheid en Justitie en het openbaar ministerie te ondersteunen bij hun taken met betrekking
      tot de tenuitvoerlegging van geldboeten die bij vonnis of arrest dan wel in een strafbeschikking zijn
      opgelegd. Het Centraal Justitieel Incassobureau heeft voorts tot taak de bevoegde ambtenaren, bedoeld
      in [artikel 3.1 van het Besluit OM-afdoening][ref2], alsmede een lichaam of een persoon, bedoeld in
      [artikel 4.1, onderdeel b, van het Besluit OM-afdoening][ref3], te ondersteunen bij hun taken met betrekking tot de
      betaling van gelden als bedoeld in [artikel 3a][ref4].

      2 Dit besluit is niet van toepassing op geldboeten die zijn opgelegd in een strafbeschikking,
      uitgevaardigd krachtens [artikel 76 van de Algemene wet inzake rijksbelastingen][ref5] of
      [artikel 10:15 van de Algemene douanewet][ref6].


