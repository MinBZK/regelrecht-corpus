  - number: 3a
    text: |-
      1 In geval krachtens [artikel 257b van het Wetboek van Strafvordering][ref1] een strafbeschikking zal worden
      uitgevaardigd kan de betrokken korpschef, bedoeld in [artikel 3.1, tweede lid, van het Besluit OM-afdoening][ref2],
      bepalen dat betaling van de geldboete eveneens kan geschieden op een plaats die is aangewezen door de bevoegde
      ambtenaar in de zin van artikel 3.1 van het Besluit OM-afdoening of door het ter plaatse overschrijven op een
      daartoe bestemde bankrekening. Betaling geschiedt in dat geval binnen een dag na die waarop het strafbare feit
      is ontdekt.

      2 Als plaats van betaling, bedoeld in het eerste lid, wordt slechts aangewezen een
      politiebureau, een gebouw van de organisatie van de bevoegde ambtenaar, bedoeld in
      [artikel 3.1, eerste lid, onderdeel b, van het Besluit OM-afdoening][ref3], of een douanekantoor of, indien de
      bevoegde ambtenaar een militair van de Koninklijke marechaussee is, een brigadebureau of de betrokken doorlaatpost,
      dan wel een tijdelijke plaats van betaling, ingesteld door of vanwege de betrokken korpschef, bedoeld in artikel
      3.1 van het Besluit OM-afdoening.

      3 Door of vanwege de korpschef, bedoeld in [artikel 3.1 van het Besluit OM-afdoening][ref4], worden ambtenaren
      aangewezen die zijn belast met de inning van gelden die overeenkomstig het eerste lid worden betaald.

      4 De met inning belaste ambtenaar wordt in het bezit gesteld van een lijst met feiten als bedoeld in
      [artikel 3.6, tweede lid, van het Besluit OM-afdoening][ref5]. Desgevraagd verleent hij degene die betaalt inzage
      in deze lijst.


