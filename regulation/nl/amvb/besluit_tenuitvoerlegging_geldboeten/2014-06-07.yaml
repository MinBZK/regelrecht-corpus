        artikel: '1'
        paragraaf: '1'
  - number: '7'
    text: >-
      1 Het Hoofd van de Centrale Directie Financieel Economische Zaken van het Ministerie van Veiligheid en Justitie
      draagt zorg voor de opening van een of meer afzonderlijke bankrekeningen van het Centraal Justitieel Incassobureau
      welke rekeningen bestemd zijn voor de betaling van gelden voortvloeiend uit de tenuitvoerlegging van opgelegde
      geldboeten.


      2 De directeur van het Centraal Justitieel Incassobureau is belast met het beheer van de in het eerste lid bedoelde
      bankrekeningen.


      3 Onze Minister van Veiligheid en Justitie stelt nadere voorschriften vast omtrent het beheer van de in het eerste
      lid bedoelde bankrekeningen en de in verband daarmee te voeren administratie.
    url: https://wetten.overheid.nl/BWBR0006717/2014-06-07#Artikel7
  - number: '8'
    text: |-
      1 Onze Minister stelt het formulier vast van het door de in [artikel 5, eerste lid][ref1], bedoelde personen uit te
      reiken betalingsbewijs, dan wel de eisen waaraan het betalingsbewijs moet voldoen.

      2 De ontvangen gelden worden regelmatig op de door het Centraal Justitieel Incassobureau aangegeven wijze
      overgemaakt op de daartoe bestemde bankrekeningen van het Centraal Justitieel Incassobureau.

      3 Onze Minister van Veiligheid en Justitie stelt nadere voorschriften vast omtrent de verstrekking en het beheer
      van de betalingswijzen, de afrekening en de verantwoording van de ontvangen gelden alsmede de in verband daarmee te
      voeren administratie.


      [ref1]: https://wetten.overheid.nl/BWBR0006717#Artikel5
    url: https://wetten.overheid.nl/BWBR0006717/2014-06-07#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006717
        artikel: '5'
        paragraaf: '2'
  - number: '9'
    text: |-
      De korpschef doet op de door Onze Minister van Veiligheid en Justitie te bepalen wijze jaarlijks opgave van
      de uitvoering van de in [artikel 8, derde lid][ref1], bedoelde voorschriften en van de met het oog op de
      toepassing van dit besluit verrichte accountantscontrole. Voor de Koninklijke marechaussee en de buitengewoon
      opsporingsambtenaren wordt de in de eerste zin bedoelde opgave gedaan door de betrokken korpschefs, bedoeld in
      [artikel 3.1, tweede lid, van het Besluit OM-afdoening][ref2] of het betrokken lichaam of de betrokken persoon,
      bedoeld in [artikel 4.1, onderdeel b, van het Besluit OM-afdoening][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006717#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0022233#Artikel3.1
      [ref3]: https://wetten.overheid.nl/BWBR0022233#Artikel4.1
