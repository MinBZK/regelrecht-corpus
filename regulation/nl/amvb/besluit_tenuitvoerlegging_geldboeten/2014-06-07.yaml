  - number: '4'
    text: >-
      1 Degene die betaalt, maakt daarbij op een door het Centraal Justitieel Incassobureau aan te geven wijze melding
      van de zaak waar betaling van de geldboete betrekking op heeft.


      2 Ingeval geen melding is gemaakt van de zaak waar betaling van de geldboete betrekking op heeft op de wijze als
      bedoeld in het eerste lid, kan het Centraal Justitieel Incassobureau het aan hem betaalde bedrag terugstorten op de
      rekening waarvan het bedrag afkomstig is, of anderszins het bedrag terugbetalen aan de persoon die betaald heeft.
    url: https://wetten.overheid.nl/BWBR0006717/2014-06-07#Artikel4
  - number: '5'
    text: |-
      1 In het belang van een juiste taakuitoefening bij de inning van een opgelegde geldboete wordt in de gevallen als
      bedoeld in [artikel 3, eerste lid, tweede zin][ref1], [3a, eerste lid][ref2] en [3b, eerste lid][ref3], onverwijld
      een betalingsbewijs uitgereikt dat door de persoon aan wie wordt voldaan, is gedagtekend en ondertekend.

      2 In de gevallen als bedoeld in [artikel 3, eerste lid, tweede zin][ref4], [3a, eerste lid][ref5] en
      [3b, eerste lid][ref6], wordt van de inning van de geldboete aantekening gehouden op de wijze zoals door het
      Centraal Justitieel Incassobureau is aangegeven.

      3 De aantekeningen worden, uiterlijk een jaar nadat zij zijn opgemaakt, desverlangd getoond aan de personen die met
      het toezicht op de inning van geldboeten zijn belast.


