        paragraaf: '1'
  - number: '3'
    text: |-
      1 De betaling van een geldboete, geschiedt door storting of overschrijving op een daartoe bestemde bankrekening van
      het Centraal Justitieel Incassobureau. Het openbaar ministerie of het Centraal Justitieel Incassobureau kan bepalen
      dat de betaling kan geschieden op een door het openbaar ministerie of door het Centraal Justitieel Incassobureau
      aan te wijzen plaats of aan een door het openbaar ministerie of door het Centraal Justitieel Incassobureau aan te
      wijzen persoon, dan wel door het ter plaatse overschrijven op een daartoe bestemde bankrekening.

      2 De betaling, bedoeld in het eerste lid, eerste volzin, geschiedt binnen dertig dagen na de dagtekening van de
      acceptgiro die de persoon aan wie de geldboete is opgelegd van het Centraal Justitieel Incassobureau ontvangt.

      3 In het geval ingevolge [artikel 24a van het Wetboek van Strafrecht][ref1] of
      [artikel 561, derde lid, van het Wetboek van Strafvordering][ref2] een betaling in termijnen is toegestaan, worden
      de in die artikelen bedoelde termijnen bepaald vanaf de dagtekening van de acceptgiro die de persoon aan wie de
      geldboete is opgelegd van het Centraal Justitieel Incassobureau ontvangt.

      4 De betaling van het ingevolge [artikel 24b van het Wetboek van Strafrecht][ref3] verhoogde bedrag geschiedt
      binnen dertig dagen na de dagtekening van de eerstvolgende acceptgiro die de persoon aan wie de geldboete is
      opgelegd van het Centraal Justitieel Incassobureau ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel24a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel561
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel24b
    url: https://wetten.overheid.nl/BWBR0006717/2014-06-07#Artikel3
