  - number: '6'
    text: |-
      Een ieder die betrokken is bij de inning en incasso van een opgelegde geldboete verstrekt het Centraal Justitieel
      Incassobureau en het openbaar ministerie de gegevens die zij behoeven in verband met de uitoefening van hun in
      [artikel 1][ref1] bedoelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0006717#Artikel1
    url: https://wetten.overheid.nl/BWBR0006717/2014-06-07#Artikel6
