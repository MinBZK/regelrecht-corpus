  - number: 9b
    text: >-
      1 Degene aan wie een geldboete wordt opgelegd, is administratiekosten verschuldigd. De omvang van deze kosten wordt
      bepaald bij ministeriële regeling. Op de betaling van de administratiekosten zijn de artikelen van dit besluit
      betreffende de betaling van de geldboete en de verantwoording van de gelden van overeenkomstige toepassing. De
      administratiekosten worden samen met de geldboete in rekening gebracht.


      2 Gedane betalingen strekken in de eerste plaats tot voldoening van de administratiekosten, vervolgens tot
      voldoening van eventuele verhogingen en ten slotte tot voldoening van de geldboete.
    url: https://wetten.overheid.nl/BWBR0006717/2014-06-07#Artikel9b
  - number: 9c
    text: |-
      De kosten van het verhaal van een opgelegde geldboete worden op gelijke voet als de geldboete verhaald op
      degene aan wie deze geldboete is opgelegd. Onder de kosten van verhaal zijn begrepen de invorderingskosten.
      De kosten van verhaal, voor zover zij niet betreffen de invorderingskosten, worden berekend overeenkomstig de
      bij het [Besluit tarieven ambtshandelingen gerechtsdeurwaarders][ref1] vastgestelde tarieven. De omvang van de
      invorderingskosten wordt bepaald bij ministeriële regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0012638
    url: https://wetten.overheid.nl/BWBR0006717/2014-06-07#Artikel9c
    references:
      - id: ref1
