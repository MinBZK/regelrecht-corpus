  - number: 9a
    text: |-
      In het geval de bevoegdheid van [artikel 257b van het Wetboek van Strafvordering][ref1] wordt uitgeoefend
      gedurende de periode dat ingevolge [artikel 57][ref2], [58][ref3] of [59 van de Politiewet 2012][ref4] bijstand
      wordt verleend, geschiedt de betaling, bedoeld in [artikel 3a, eerste lid][ref5], op de wijze van de politie, en
      geschieden de afrekening, verantwoording en controle van de ontvangen gelden door de politie.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel257b
