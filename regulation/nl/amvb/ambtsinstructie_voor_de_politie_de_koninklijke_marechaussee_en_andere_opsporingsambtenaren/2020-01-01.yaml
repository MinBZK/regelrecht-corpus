  - number: 36a.2
    text: 'Voor de toepassing van het eerste lid wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel36a
  - number: 36a.2.a
    text: 'bevoegd gezag: de officier van justitie;'
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel36a
  - number: 36a.2.b
    text: |-
      de meerdere: de ambtenaar van een bijzondere opsporingsdienst die uit hoofde van zijn functie met de leiding is
      belast of het bevel heeft over de taakuitvoering;
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel36a
  - number: 36a.2.c
    text: |-
      geweldmiddel: de wapens en de uitrusting, waarmee geweld kan worden uitgeoefend, die krachtens
      [artikel 3a, derde lid, van de Wet wapens en munitie][ref1] zijn toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel3a
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: 3a
  - number: 36b
    text: |-
      De ambtenaar van een bijzondere opsporingsdienst maakt bij de uitoefening van zijn dienst uitsluitend gebruik van
      het door Onze Minister van Justitie voorgeschreven geweldmiddel of handboeien.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel36b
  - number: '37.1'
    text: |-
      Indien Onze Minister ingevolge [artikel 7, negende lid, van de Politiewet 2012][ref1], heeft bepaald dat een
      buitengewoon opsporingsambtenaar bevoegd is tot de uitoefening van bevoegdheden, bedoeld in het eerste, derde
      en vierde lid van dat artikel, handelt de desbetreffende buitengewoon opsporingsambtenaar overeenkomstig de
      [artikelen 5][ref2], [17][ref3], [19][ref4], [20][ref5] en [21][ref6] van dit besluit. In artikel 17, derde lid,
      wordt voor «de politiechef» gelezen: de meerdere.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006589#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0006589#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0006589#Artikel19
      [ref5]: https://wetten.overheid.nl/BWBR0006589#Artikel20
      [ref6]: https://wetten.overheid.nl/BWBR0006589#Artikel21
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel37
