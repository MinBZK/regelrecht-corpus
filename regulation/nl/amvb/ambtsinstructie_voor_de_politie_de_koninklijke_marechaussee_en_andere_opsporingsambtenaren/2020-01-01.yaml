      [artikel 59 van de Politiewet 2012][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel59
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel1
