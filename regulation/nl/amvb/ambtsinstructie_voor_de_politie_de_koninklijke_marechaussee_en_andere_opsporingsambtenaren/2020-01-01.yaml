  - number: '1.2'
    text: 'In dit besluit wordt verstaan onder meerdere:'
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel1
  - number: 1.2.a
    text: |-
      de ambtenaar die uit hoofde van zijn functie of krachtens beschikking of aanwijzing met de leiding is belast of het
      bevel heeft over de taakuitvoering;
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel1
  - number: 1.2.b
    text: |-
      indien op grond van het bepaalde onder a, geen meerdere kan worden aangewezen de ambtenaar van politie die
      een hogere rang heeft of, bij gelijkheid in rang, degene met de meeste dienstjaren, dan wel bij optreden door
      militairen van de Koninklijke marechaussee of van enig ander krijgsmachtonderdeel degene die ingevolge het bepaalde
      bij of krachtens [artikel 67 van het Wetboek van Militair Strafrecht][ref1] de meerdere is.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel67
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '67'
  - number: '1.3'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel1
  - number: 1.3.a
    text: |-
      bevoegd gezag: het gezag, bedoeld in de [artikelen 11][ref1], [12][ref2] en [14 van de Politiewet 2012][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel14
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0031788
        artikel: '14'
  - number: 1.3.b
    text: 'geweld: elke dwangmatige kracht van meer dan geringe betekenis uitgeoefend op personen of zaken;'
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel1
  - number: 1.3.c
    text: |-
      aanwenden van geweld: het gebruiken van geweld en het dreigen met geweld, waaronder wordt begrepen het ter hand
      nemen van een vuurwapen;
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel1
  - number: 1.3.d
    text: 'geweldmiddel:'
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel1
  - number: 1.3.d.1°
    text: |-
      de krachtens artikel 22 van de Politiewet 2012 toegelaten uitrusting en bewapening waarmee geweld kan worden
      uitgeoefend, en.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel1
  - number: 1.3.d.2°
    text: |-
      de door Onze Minister van Defensie ter beschikking gestelde uitrusting en bewapening waarmee geweld kan worden
      uitgeoefend in de uitvoering van de politietaken, bedoeld in de [artikelen 4][ref1], [57][ref2], [58][ref3] en
      [59 van de Politiewet 2012][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel57
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel58
      [ref4]: https://wetten.overheid.nl/BWBR0031788#Artikel59
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '57'
      - id: ref3
        bwb_id: BWBR0031788
        artikel: '58'
      - id: ref4
        bwb_id: BWBR0031788
        artikel: '59'
  - number: 1.3.e
    text: 'hulpmiddelen ten behoeve van uitzetting:'
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel1
  - number: 1.3.e.1º
    text: |-
      de krachtens [artikel 22 van de Politiewet 2012][ref1], aan de ambtenaar van politie, bij of krachtens de
      [Vreemdelingenwet 2000][ref2] belast met de grensbewaking of met het toezicht op vreemdelingen, ter beschikking
      gestelde uitrusting ten behoeve van de uitzetting van vreemdelingen, en


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0011823
  - number: 1.3.e.2º
    text: |-
      de door Onze Minister van Defensie, in overeenstemming met Onze Minister voor Immigratie, Integratie en Asiel,
      aan de ambtenaar van de Koninklijke marechaussee, bij of krachtens de [Vreemdelingenwet 2000][ref1] belast met
      de grensbewaking of met het toezicht op vreemdelingen, ter beschikking gestelde uitrusting ten behoeve van de
      uitzetting van vreemdelingen;


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 1.3.f
    text: |-
      vuurwapen waarmee automatisch vuur kan worden afgegeven: vuurwapen waarmee met één druk op het afvuurmechanisme
      meer schoten kunnen worden gelost dan wel een vuurwapen waarmee naar keus hetzij één schot, hetzij meer schoten
      kunnen worden gelost;
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel1
  - number: 1.3.g
    text: 'de arts: de dienstdoend adviserend arts;'
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel1
  - number: 1.3.h
    text: |-
      buitengewoon opsporingsambtenaar: de buitengewoon opsporingsambtenaar, bedoeld in
      [artikel 142, eerste lid, van het Wetboek van Strafvordering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '142'
  - number: 1.3.i
    text: 'het gebruik van een vuurwapen: het richten, het gericht houden en het daadwerkelijk gebruik van een vuurwapen;'
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel1
  - number: 1.3.j
    text: |-
      niet-penetrerende munitie: munitie die is ontworpen om bij het treffen van een persoon niet het lichaam binnen
      te dringen;
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel1
  - number: 1.3.k
    text: |-
      AOT-hond: hond in eigendom van de politie met als doel in politiedienst te worden ingezet bij het optreden van een
      aanhouding en ondersteuningsteam als bedoeld in [artikel 11, onder a, van het Besluit beheer politie][ref1] of een
      bijstandseenheid als bedoeld in [artikel 59 van de Politiewet 2012][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0036705#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel59
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0036705
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '59'
  - number: 1.3.l
    text: |-
      ambtenaar van een bijzondere opsporingsdienst: ambtenaar van een bijzondere opsporingsdienst die is aangewezen voor
      de uitvoering van de taken, bedoeld in [artikel 3 van de Wet op de bijzondere opsporingsdiensten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019919#Artikel3
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019919
        artikel: '3'
  - number: '1.4'
    text: |-
      In dit besluit wordt onder ingeslotene verstaan degene die rechtens van zijn vrijheid is beroofd. Onder ingeslotene
      wordt mede verstaan degene die ten behoeve van de hulpverlening aan hem op het politie- of brigadebureau is
      ondergebracht.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel1
  - number: '2'
    text: 'De ambtenaar legitimeert zich met het legitimatiebewijs dat aan hem is verstrekt:'
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel2
  - number: 2.a
    text: bij optreden in burgerkleding ongevraagd, tenzij bijzondere omstandigheden dit onmogelijk maken, en
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel2
  - number: 2.b
    text: bij optreden in uniform, op verzoek daartoe.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel2
  - number: '3'
    text: |-
      De ambtenaar die bijstand verleent ingevolge de bepalingen van [hoofdstuk 5 van de Politiewet 2012][ref1] staat
      onder bevel van het bevoegd gezag ter plaatse of een door deze aangewezen ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0031788
        hoofdstuk: '5'
  - number: '4'
    text: 'Het gebruik van een geweldmiddel is uitsluitend toegestaan aan een ambtenaar:'
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel4
  - number: 4.a
    text: |-
      aan wie dat geweldmiddel rechtens is toegekend, voor zover hij optreedt ter uitvoering van de taak met het oog
      waarop het geweldmiddel hem is toegekend, en
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel4
  - number: 4.b
    text: die in het gebruik van dat geweldmiddel is geoefend.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel4
  - number: '5.1'
    text: |-
      Indien de ambtenaar, al of niet in gesloten verband, onder leiding van een ter plaatse aanwezige meerdere optreedt,
      zal hij geen geweld aanwenden dan na uitdrukkelijke last van deze meerdere. De meerdere geeft daarbij aan van welk
      geweldmiddel gebruik wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel5
  - number: '5.2'
    text: |-
      Het eerste lid is niet van toepassing in het geval de meerdere, bedoeld in het eerste lid, vooraf anders heeft
      bepaald.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel5
  - number: '5.3'
    text: |-
      Het eerste lid is evenmin van toepassing in een geval als bedoeld in [artikel 10, eerste lid, onderdeel b][ref1],
      voor zover de last redelijkerwijs niet kan worden afgewacht.


      [ref1]: https://wetten.overheid.nl/BWBR0006589#Artikel10
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006589
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '6.1'
    text: |-
      De korpschef of de daartoe door hem aangewezen ambtenaar van politie zet een mobiele eenheid als bedoeld in
      [artikel 26 van het Besluit beheer politie][ref1] of een aanhoudings- en ondersteuningsteam als bedoeld in artikel
      11, onder a, van het Besluit beheer politie slechts in na toestemming van het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0036705#Artikel26
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0036705
        artikel: '26'
  - number: '6.2'
    text: |-
      De door het bevoegd gezag aangewezen ambtenaar zet de eenheden, bedoeld in de [artikelen 57][ref1] en
      [58 van de Politiewet 2012][ref2] slechts in na toestemming van het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel58
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '57'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '58'
  - number: '7.1'
    text: |-
      Het gebruik van een vuurwapen, niet zijnde een vuurwapen waarmee automatisch vuur of lange afstandsprecisievuur kan
      worden afgegeven, is slechts geoorloofd:
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel7
  - number: 7.1.a
    text: |-
      om een persoon aan te houden ten aanzien van wie redelijkerwijs mag worden aangenomen dat hij een voor onmiddellijk
      gebruik gereed zijnd vuurwapen bij zich heeft en dit tegen personen zal gebruiken;
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel7
  - number: 7.1.b
    text: |-
      om een persoon aan te houden die zich aan zijn aanhouding, voorgeleiding of andere rechtmatige vrijheidsbeneming
      tracht te onttrekken of heeft onttrokken, en die wordt verdacht van of is veroordeeld wegens het plegen van een
      misdrijf
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel7
  - number: 7.1.b.1°
    text: waarop naar de wettelijke omschrijving een gevangenisstraf van vier jaren of meer is gesteld, en
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel7
  - number: 7.1.b.2°
    text: dat een ernstige aantasting vormt van de lichamelijke integriteit of de persoonlijke levenssfeer, of
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel7
  - number: 7.1.b.3°
    text: dat door zijn gevolg bedreigend voor de samenleving is of kan zijn.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel7
  - number: 7.1.c
    text: |-
      tot het beteugelen van oproerige bewegingen of andere ernstige wanordelijkheden, indien er sprake is van een
      opdracht van het bevoegd gezag en een optreden in gesloten verband onder leiding van een meerdere;
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel7
  - number: 7.1.d
    text: |-
      tot het beteugelen van militaire oproerige bewegingen, andere ernstige militaire wanordelijkheden of muiterij
      indien de militair van de Koninklijke marechaussee in opdracht van de minister van Defensie dan wel de officier van
      justitie te Arnhem belast met militaire zaken in gesloten verband onder leiding van een meerdere optreedt.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel7
  - number: '7.2'
    text: |-
      Het gebruik van het vuurwapen in de gevallen, bedoeld in het eerste lid, onder *a* en *b*, is slechts geoorloofd
      tegen personen en vervoermiddelen waarin of waarop zich personen bevinden.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel7
  - number: '7.3'
    text: |-
      In de gevallen, bedoeld in het eerste lid, onder *a* en *b*, wordt van het vuurwapen geen gebruik gemaakt, indien
      de identiteit van de aan te houden persoon bekend is en redelijkerwijs mag worden aangenomen dat het uitstel van de
      aanhouding geen onaanvaardbaar te achten gevaar voor de rechtsorde met zich brengt.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel7
  - number: '7.4'
    text: |-
      Onder het plegen van een misdrijf, bedoeld in het eerste lid, onder *b*, worden mede begrepen de poging en de
      deelnemingsvormen, bedoeld in de [artikelen 47][ref1] en [48 van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel48
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '47'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '48'
  - number: '8.1'
    text: |-
      Het gebruik van een vuurwapen waarmee automatisch vuur kan worden afgegeven, is slechts geoorloofd tegen personen
      en tegen vervoermiddelen waarin of waarop zich personen bevinden, in een situatie waarin sprake is van een
      ogenblikkelijke, wederrechtelijke aanranding van eigen of eens anders lijf.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel8
  - number: '8.2'
    text: |-
      Een vuurwapen waarmee automatisch vuur kan worden afgegeven mag slechts worden meegevoerd ten behoeve van de
      opleiding dan wel voor:
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel8
  - number: 8.2.a
    text: |-
      het verrichten van een aanhouding van een persoon van wie redelijkerwijs mag worden aangenomen dat hij een voor
      onmiddellijk gebruik gereed zijnd vuurwapen bij zich heeft en dit tegen personen zal gebruiken,
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel8
  - number: 8.2.b
    text: de bewaking en beveiliging van personen en objecten.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel8
  - number: '8.3'
    text: |-
      Het meevoeren van vuurwapens waarmee automatisch vuur kan worden afgegeven in het geval, bedoeld in het tweede lid,
      onder a, is slechts toegestaan na schriftelijke toestemming van de officier van justitie. Indien wegens de vereiste
      spoed de toestemming niet schriftelijk kan worden gevraagd of verleend, kan deze ook mondeling worden gevraagd
      en verleend. De toestemming die mondeling is verleend, wordt binnen vierentwintig uur schriftelijk bevestigd.
      De officier van justitie doet van het meevoeren van vuurwapens waarmee automatisch vuur kan worden afgegeven zo
      mogelijk vooraf mededeling aan de betrokken burgemeester.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel8
  - number: '8.4'
    text: |-
      Het meevoeren van vuurwapens waarmee automatisch vuur kan worden afgegeven in het geval, bedoeld in het tweede lid,
      onder b, is slechts mogelijk na schriftelijke toestemming van het bevoegd gezag. Indien wegens de vereiste spoed de
      toestemming niet schriftelijk kan worden gevraagd of verleend, kan deze ook mondeling worden gevraagd en verleend.
      De toestemming die mondeling is verleend, wordt binnen vierentwintig uur schriftelijk bevestigd.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel8
  - number: '9.1'
    text: |-
      Het gebruik van een vuurwapen waarmee lange afstandsprecisievuur kan worden afgegeven, is slechts geoorloofd bij
      zeer ernstige misdrijven ter afwending van direct gevaar voor het leven van personen.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel9
  - number: '9.2'
    text: |-
      Het gebruik, bedoeld in het eerste lid, vindt plaats onder bevel van de commandant van een bijstandseenheid als
      bedoeld in [artikel 59 van de Politiewet 2012][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel59
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '59'
  - number: '9.3'
    text: |-
      Een vuurwapen waarmee lange afstandsprecisievuur kan worden afgegeven mag slechts worden meegevoerd ten behoeve van
      de opleiding dan wel ten behoeve van de daadwerkelijke bestrijding van zeer ernstige misdrijven waarbij sprake is
      van direct levensbedreigende omstandigheden.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel9
  - number: '9.4'
    text: |-
      Het meevoeren van een vuurwapen waarmee lange afstandsprecisievuur kan worden afgegeven ten behoeve van
      de daadwerkelijke bestrijding van zeer ernstige misdrijven waarbij sprake is van direct levensbedreigende
      omstandigheden, is slechts toegestaan na schriftelijke toestemming van het bevoegd gezag. Aan de toestemming kunnen
      voorwaarden worden verbonden. Indien wegens de vereiste spoed de toestemming niet schriftelijk kan worden gevraagd
      of verleend, kan deze ook mondeling worden gevraagd en verleend. De toestemming die mondeling is verleend, wordt
      binnen vierentwintig uur schriftelijk bevestigd.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel9
  - number: '10.1'
    text: |-
      De ambtenaar mag slechts een vuurwapen, niet zijnde een vuurwapen waarmee automatisch vuur of lange-
      afstandsprecisievuur kan worden afgegeven, ter hand nemen:
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel10
  - number: 10.1.a
    text: in gevallen waarin het gebruik van een vuurwapen is toegestaan, of
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel10
  - number: 10.1.b
    text: |-
      in verband met zijn veiligheid of die van anderen, indien redelijkerwijs mag worden aangenomen dat een situatie
      ontstaat, waarin hij bevoegd is een vuurwapen te gebruiken.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel10
  - number: '10.2'
    text: |-
      Indien een situatie als bedoeld in het eerste lid, onderdeel b, zich niet of niet meer voordoet, bergt de ambtenaar
      terstond het vuurwapen op.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel10
  - number: 10a.1
    text: |-
      De ambtenaar waarschuwt onmiddellijk voordat hij gericht met een vuurwapen, niet zijnde een vuurwapen waarmee
      lange afstandsprecisievuur kan worden afgegeven, zal schieten, met luide stem of op andere niet mis te verstane
      wijze dat geschoten zal worden, indien niet onverwijld het gegeven bevel wordt opgevolgd. Deze waarschuwing, die
      zo nodig vervangen kan worden door een waarschuwingsschot, blijft slechts achterwege, wanneer de omstandigheden de
      waarschuwing niet toelaten.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel10a
  - number: 10a.2
    text: |-
      Een waarschuwingsschot moet op zodanige wijze worden gegeven, dat gevaar voor personen of zaken zoveel mogelijk
      wordt vermeden.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel10a
  - number: '11'
    text: |-
      De [artikelen 7 tot en met 10a][ref1] zijn niet van toepassing op het gebruik en het ter hand nemen van een
      vuurwapen dat is geladen met niet-penetrerende munitie.


      [ref1]: https://wetten.overheid.nl/BWBR0006589#Artikel7
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006589
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 11a
    text: 'Het gebruik van een vuurwapen dat is geladen met niet-penetrerende munitie is slechts geoorloofd:'
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel11a
  - number: 11a.a
    text: |-
      om een persoon aan te houden ten aanzien van wie redelijkerwijs mag worden aangenomen dat hij een voor onmiddellijk
      gebruik gereed zijnd wapen bij zich heeft en dit tegen personen zal gebruiken; of
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel11a
  - number: 11a.b
    text: |-
      om een persoon aan te houden die zich aan zijn aanhouding, voorgeleiding of andere rechtmatige vrijheidsbeneming
      tracht te onttrekken of heeft onttrokken.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel11a
  - number: 11b
    text: |-
      De ambtenaar waarschuwt onmiddellijk voordat hij gericht met een vuurwapen dat is geladen met niet-penetrerende
      munitie zal schieten, met luide stem of op andere niet mis te verstane wijze dat geschoten zal worden, indien
      niet onverwijld het gegeven bevel wordt opgevolgd. Deze waarschuwing blijft slechts achterwege, wanneer de
      omstandigheden de waarschuwing niet toelaten.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel11b
  - number: 11c
    text: |-
      De [artikelen 11a][ref1] en [11b][ref2] zijn van overeenkomstige toepassing indien de niet-penetrerende munitie
      wordt afgegeven met een ander hulpmiddel dan een vuurwapen.


      [ref1]: https://wetten.overheid.nl/BWBR0006589#Artikel11a
      [ref2]: https://wetten.overheid.nl/BWBR0006589#Artikel11b
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel11c
    references:
      - id: ref1
        bwb_id: BWBR0006589
        artikel: 11a
        hoofdstuk: '2'
        paragraaf: 2a
      - id: ref2
        bwb_id: BWBR0006589
        artikel: 11b
        hoofdstuk: '2'
        paragraaf: 2a
  - number: 12a.1
    text: 'Het gebruik van pepperspray is slechts geoorloofd:'
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel12a
  - number: 12a.1.a
    text: |-
      om een persoon aan te houden ten aanzien van wie redelijkerwijs mag worden aangenomen dat hij een voor onmiddellijk
      gebruik gereed zijnd wapen bij zich heeft en dit tegen een persoon zal gebruiken;
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel12a
  - number: 12a.1.b
    text: |-
      om een persoon aan te houden die zich aan aanhouding, voorgeleiding of andere rechtmatige vrijheidsbeneming tracht
      te onttrekken of heeft onttrokken;
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel12a
  - number: 12a.1.c
    text: ter verdediging tegen of voor het onder controle brengen van agressieve dieren.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel12a
  - number: 12a.2
    text: 'Pepperspray wordt niet gebruikt tegen:'
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel12a
  - number: 12a.2.a
    text: personen die zichtbaar jonger dan 12 of ouder dan 65 jaar zijn;
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel12a
  - number: 12a.2.b
    text: vrouwen die zichtbaar zwanger zijn;
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel12a
  - number: 12a.2.c
    text: |-
      personen voor wie dit gebruik als gevolg van een voor de ambtenaar zichtbare ademhalings- of andere ernstige
      gezondheidsstoornis onevenredig schadelijk kan zijn;
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel12a
  - number: 12a.2.d
    text: groepen personen.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel12a
  - number: 12b
    text: |-
      De ambtenaar waarschuwt onmiddellijk voordat hij gericht pepperspray tegen een persoon zal gebruiken, met luide
      stem of op andere niet mis te verstane wijze dat pepperspray gebruikt zal worden, indien niet onverwijld het
      gegeven bevel wordt opgevolgd. Deze waarschuwing blijft achterwege indien de omstandigheden de waarschuwing
      redelijkerwijs niet toelaten.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel12b
  - number: 12c
    text: |-
      Pepperspray wordt tegen een persoon per geval ten hoogste twee maal voor de duur van niet langer dan ongeveer een
      seconde gebruikt en op een afstand van ten minste een meter.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel12c
  - number: '13.1'
    text: 'Het gebruik van CS-traangas is slechts geoorloofd:'
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel13
  - number: 13.1.a
    text: |-
      in gesloten ruimten ter aanhouding van een persoon indien redelijkerwijs mag worden aangenomen dat die persoon een
      voor onmiddellijk gebruik gereed zijnd vuurwapen bij zich heeft en dat tegen personen zal gebruiken dan wel ander
      levensbedreigend geweld tegen personen zal gebruiken;
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel13
  - number: 13.1.b
    text: |-
      anders dan in gesloten ruimten ter verspreiding van samenscholingen of volksmenigten die een ernstige en
      onmiddellijke bedreiging vormen voor de veiligheid van personen of voor zaken.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel13
  - number: '13.2'
    text: |-
      Het gebruik van CS-traangas is slechts geoorloofd in opdracht van de meerdere na vooraf verkregen toestemming van
      het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel13
  - number: '13.3'
    text: |-
      De meerdere die bevel geeft tot het verspreiden van CS-traangas geeft bij dit bevel aan hoeveel CS-traangasgranaten
      worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel13
  - number: '14'
    text: |-
      Het gebruik van een waterwerper is slechts geoorloofd bij optreden van een mobiele eenheid als bedoeld in
      [artikel 26 van het Besluit beheer politie][ref1] in opdracht van de meerdere en na verkregen toestemming van het
      bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0036705#Artikel26
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0036705
        artikel: '26'
  - number: '15.1'
    text: |-
      Het inzetten van een politie-surveillancehond is slechts geoorloofd onder het direct en voortdurend toezicht van
      een geleider bij:
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel15
  - number: 15.1.a
    text: de surveillancedienst, en
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel15
  - number: 15.1.b
    text: |-
      het optreden van een mobiele eenheid als bedoeld in [artikel 26 van het Besluit beheer politie][ref1] na
      toestemming van het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0036705#Artikel26
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0036705
        artikel: '26'
  - number: '15.2'
    text: |-
      Het inzetten van een AOT-hond is slechts geoorloofd onder het direct en voortdurend toezicht van een geleider
      bij het, na toestemming van het bevoegd gezag, optreden van een aanhoudings- en ondersteuningsteam als
      bedoeld in [artikel 11, onder a, van het Besluit beheer politie][ref1] of een bijstandseenheid als bedoeld in
      [artikel 59 van de Politiewet 2012][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0036705#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel59
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0036705
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '59'
  - number: '15.3'
    text: |-
      De geleider dient in het bezit te zijn van een krachtens [artikel 22 van de Politiewet 2012][ref1] vastgesteld
      certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel22
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '22'
  - number: '16'
    text: |-
      Het gebruik van een elektrische wapenstok is slechts geoorloofd als afweermiddel tegen agressieve dieren na
      toestemming van de meerdere.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel16
  - number: '17.1'
    text: |-
      De ambtenaar die geweld heeft aangewend, meldt de feiten en omstandigheden dienaangaande, alsmede de gevolgen
      hiervan, onverwijld aan zijn meerdere.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel17
  - number: '17.2'
    text: |-
      De melding, bedoeld in het eerste lid, wordt door de meerdere terstond vastgelegd op een daartoe door Onze Minister
      vastgestelde wijze.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel17
  - number: '17.3'
    text: |-
      De melding, bedoeld in het tweede lid, wordt door de politiechef binnen 48 uur ter kennis gebracht van de officier
      van justitie in het arrondissement waarin de rechtbank is gelegen waarbinnen het geweld is aangewend, dan wel door
      de commandant van de Koninklijke marechaussee van de officier van justitie te Arnhem belast met militaire zaken
      ingeval het een militair betreft, indien:
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel17
  - number: 17.3.a
    text: |-
      de gevolgen van het aanwenden van geweld daartoe naar het oordeel van de politiechef of de commandant aanleiding
      geven,
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel17
  - number: 17.3.b
    text: het aanwenden van geweld lichamelijk letsel van meer dan geringe betekenis dan wel de dood heeft veroorzaakt, of
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel17
  - number: 17.3.c
    text: gebruik is gemaakt van een vuurwapen en daarmee één of meer schoten zijn gelost.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel17
  - number: '19'
    text: |-
      De meerdere licht de ambtenaar zo spoedig mogelijk in over de afhandeling van de melding. Desgevraagd worden aan de
      ambtenaar tussentijds inlichtingen verstrekt.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel19
  - number: '20.1'
    text: |-
      Het onderzoek aan de kleding, bedoeld in [artikel 7, derde lid, van de Politiewet 2012][ref1], en het onderzoek aan
      de kleding van een te vervoeren persoon, bedoeld in het vierde lid van dat artikel, geschiedt door het oppervlakkig
      aftasten van de kleding en wordt zo veel mogelijk uitgevoerd door een ambtenaar van hetzelfde geslacht als degene
      die aan het onderzoek wordt onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel7
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '7'
  - number: '20.2'
    text: |-
      Als de ambtenaar bij het onderzoek, bedoeld in [artikel 7, derde lid, van de Politiewet 2012][ref1], of bij het
      onderzoek, bedoeld in het vierde lid van dat artikel, ten behoeve van het vervoer van een persoon, voorwerpen
      aantreft die een gevaar kunnen vormen voor de veiligheid van de betrokkene of voor anderen, neemt hij die
      voorwerpen in bewaring.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel7
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '7'
  - number: '21'
    text: |-
      De ambtenaar die een onderzoek aan kleding of voorwerpen heeft uitgevoerd als bedoeld in
      [artikel 7, derde lid, van de Politiewet 2012][ref1] meldt dit onverwijld schriftelijk aan de meerdere, onder
      vermelding van de redenen die tot dit onderzoek hebben geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel7
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '7'
  - number: '22.1'
    text: |-
      De ambtenaar kan een persoon die rechtens van zijn vrijheid is beroofd, ten behoeve van het vervoer handboeien
      aanleggen.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel22
  - number: '22.2'
    text: |-
      De maatregel, bedoeld in het eerste lid, kan slechts worden getroffen, indien de feiten of omstandigheden dit
      redelijkerwijs vereisen met het oog op gevaar voor ontvluchting, dan wel met het oog op gevaar voor de veiligheid
      of het leven van de persoon die rechtens van zijn vrijheid is beroofd, van de ambtenaar of van derden.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel22
  - number: '22.3'
    text: 'De in het tweede lid bedoelde feiten of omstandigheden kunnen slechts gelegen zijn in:'
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel22
  - number: 22.3.a
    text: de persoon die rechtens van zijn vrijheid is beroofd, of
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel22
  - number: 22.3.b
    text: |-
      de aard van het strafbare feit op grond waarvan de vrijheidsbeneming heeft plaatsgevonden, één en ander in
      samenhang met de wijze waarop en de situatie waarin het vervoer plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel22
  - number: '23'
    text: |-
      De ambtenaar die gebruik heeft gemaakt van handboeien als bedoeld in [artikel 22, eerste lid][ref1], meldt dit
      onverwijld schriftelijk aan de meerdere, onder vermelding van de redenen die tot het gebruik van handboeien hebben
      geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0006589#Artikel22
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006589
        artikel: '22'
        hoofdstuk: '4'
  - number: 23a.1
    text: |-
      De ambtenaar, bij of krachtens de [Vreemdelingenwet 2000][ref1] belast met de grensbewaking of met het toezicht
      op vreemdelingen, kan een vreemdeling bij diens uitzetting per luchtvaartuig met hulpmiddelen ten behoeve van
      uitzetting in zijn bewegingsvrijheid beperken, ten behoeve van een goed verloop van de uitzetting.


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 23a.2
    text: 'De maatregel, bedoeld in het eerste lid, kan slechts worden getroffen indien:'
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel23a
  - number: 23a.2.a
    text: |-
      de feiten of omstandigheden dit redelijkerwijs vereisen met het oog op gevaar voor ontvluchting, dan wel met het
      oog op gevaar voor de veiligheid of het leven van de vreemdeling, van de ambtenaar of van derden, dan wel met het
      oog op gevaar voor een ernstige verstoring van de openbare orde, en
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel23a
  - number: 23a.2.b
    text: de toepassing van het hulpmiddel redelijkerwijs geen gevaar kan opleveren voor de gezondheid van de vreemdeling.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel23a
  - number: 23a.3
    text: |-
      Indien de ambtenaar, bedoeld in het eerste lid, onder leiding van een ter plaatse aanwezige meerdere optreedt, zal
      hij geen gebruik maken van hulpmiddelen ten behoeve van uitzetting dan na uitdrukkelijke last van deze meerdere. De
      meerdere geeft daarbij aan van welk hulpmiddel gebruik wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel23a
  - number: 23a.4
    text: |-
      Het gebruik van een hulpmiddel ten behoeve van uitzetting is uitsluitend toegestaan aan een ambtenaar die in het
      gebruik van dat hulpmiddel is geoefend.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel23a
  - number: 23b.1
    text: |-
      De ambtenaar die ten aanzien van een vreemdeling die wordt uitgezet gebruik heeft gemaakt van een hulpmiddel ten
      behoeve van uitzetting als bedoeld in [artikel 23a, eerste lid][ref1], meldt dit onverwijld schriftelijk aan de
      meerdere, onder vermelding van de aard van het hulpmiddel, de redenen die tot het gebruik hebben geleid en de
      daaruit voortvloeiende gevolgen.


      [ref1]: https://wetten.overheid.nl/BWBR0006589#Artikel23a
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0006589
        artikel: 23a
        hoofdstuk: 4a
  - number: 23b.2
    text: De meerdere draagt zorg voor registratie van de melding, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel23b
  - number: '24.1'
    text: |-
      De ambtenaar draagt er zorg voor personen met lichte verwondingen, ziekteverschijnselen en personen ten aanzien
      van wie twijfel op dit punt bestaat, de weg te wijzen naar een huisarts of naar een E.H.B.O.-afdeling van een
      ziekenhuis. Indien dat noodzakelijk is, verleent de ambtenaar bemiddeling bij het verkrijgen van passend vervoer.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel24
  - number: '24.2'
    text: |-
      De ambtenaar draagt er zorg voor dat personen met ernstige verwondingen en bewustelozen, waar onder mede worden
      verstaan personen die niet wekbaar of niet aanspreekbaar zijn, per ambulance naar het ziekenhuis worden vervoerd.
      De gegevens omtrent aard en omstandigheden van de gebeurtenis die tot de ziektetoestand heeft geleid, alsmede de
      op de persoon aangetroffen medische gegevens en geneesmiddelen, worden door hem ter beschikking van de medische
      hulpverleners gesteld.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel24
  - number: '25.1'
    text: |-
      De ambtenaar draagt er zoveel mogelijk zorg voor dat personen die door drankgebruik, dan wel door andere oorzaken,
      onmiddellijk gevaarlijk zijn, hetzij voor de openbare orde, veiligheid, of gezondheid, hetzij voor zichzelf, op
      de meest geschikte wijze van openbare plaatsen als bedoeld in [artikel 1 van de Wet openbare manifestaties][ref1],
      worden verwijderd. Onder openbare plaatsen worden mede verstaan vervoermiddelen die zich bevinden op deze plaatsen,
      een en ander voor zover niet gebezigd als woning.


      [ref1]: https://wetten.overheid.nl/BWBR0004318#Artikel1
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004318
        artikel: '1'
  - number: '25.2'
    text: |-
      De ambtenaar draagt personen als bedoeld in het eerste lid over aan het eigen zorgkader, voor zover de
      omstandigheden zulks toelaten. Zij kunnen bij het ontbreken van opvangmogelijkheden elders, bij wijze van
      hulpverlening, op het politie- of brigadebureau worden ondergebracht, indien dit nodig is voor hun bescherming en
      dit niet tegen hun wil geschiedt.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel25
  - number: '25.3'
    text: |-
      Voor personen als bedoeld in het eerste lid, van wie bekend is dat zij geestelijk gestoord zijn of die geestelijk
      gestoord lijken, waarschuwt de ambtenaar de arts, nadat zo mogelijk getracht is contact te zoeken met de eigen
      huisarts.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel25
  - number: '26.1'
    text: 'De korpschef treft voorzieningen opdat de ingeslotene in ieder geval beschikt over:'
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel26
  - number: 26.1.a
    text: slaapgelegenheid,
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel26
  - number: 26.1.b
    text: eten en drinken in overeenstemming met medische en levensbeschouwelijke of godsdienstige eisen,
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel26
  - number: 26.1.c
    text: sanitair,
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel26
  - number: 26.1.d
    text: de noodzakelijke medische zorg en
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel26
  - number: 26.1.e
    text: informatie over de gang van zaken in het politiecellencomplex.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel26
  - number: '26.2'
    text: |-
      Tenzij het politiecellencomplex geen luchtplaats heeft, draagt de korpschef er zorg voor dat de ingeslotene
      tweemaal daags wordt gelucht.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel26
  - number: '26.3'
    text: |-
      In verband met het eerste lid, onder d, treft de korpschef een regeling met artsen ten einde van hulp verzekerd te
      zijn voor de medische zorg van ingeslotenen.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel26
  - number: '26.4'
    text: |-
      Met inachtneming van het bij of krachtens de wet bepaalde treft de korpschef een regeling met betrekking tot het
      roken, de ontspanning, het telefoneren en het ontvangen van bezoek van de ingeslotene.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel26
  - number: '26.5'
    text: Bij ministeriële regeling worden regels gesteld over de inrichting van een politiecellencomplex.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel26
  - number: '26.6'
    text: |-
      Bij ministeriële regeling worden de gegevens over ingeslotenen aangewezen die door de ambtenaar worden
      geregistreerd.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel26
  - number: '26.7'
    text: |-
      In geval van overlijden of poging tot zelfdoding van een ingeslotene draagt de korpschef er zorg voor dat het
      openbaar ministerie hiervan onverwijld in kennis wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel26
  - number: '26.8'
    text: De ambtenaar handelt jegens de ingeslotene overeenkomstig het bepaalde bij of krachtens dit artikel.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel26
  - number: '27.1'
    text: |-
      Voor zover het bij of krachtens het [Wetboek van Strafvordering][ref1] bepaalde zich hiertegen niet verzet stelt de
      ambtenaar een familielid of een huisgenoot van een ingeslotene zo spoedig mogelijk op de hoogte van de insluiting.
      In het geval de ingeslotene minderjarig is, doet hij dit uit eigen beweging, indien de ingeslotene meerderjarig is,
      doet hij dit slechts op verzoek van de ingeslotene.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '27.2'
    text: |-
      Indien de omstandigheden de uitvoering van het eerste lid niet toelaten bij een ingeslotene die geen ingezetene
      is, wordt de ambassade of het consulaat van het land waarin de ingeslotene ingezetene is, op de hoogte gesteld van
      de insluiting.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel27
  - number: '28.1'
    text: |-
      De ambtenaar onderzoekt de ingeslotene direct voorafgaand aan de insluiting, door het aftasten en doorzoeken van
      diens kleding en van de voorwerpen die de ingeslotene bij zich draagt of met zich mee voert op de aanwezigheid van
      voorwerpen die tijdens de insluiting een gevaar voor de veiligheid van de betrokkene of voor anderen kunnen vormen.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel28
  - number: '28.2'
    text: |-
      Bij het aantreffen van voorwerpen die een gevaar kunnen vormen als bedoeld in het eerste lid, neemt de ambtenaar
      deze in bewaring.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel28
  - number: '28.3'
    text: |-
      Het onderzoek, bedoeld in het eerste lid, wordt zoveel mogelijk uitgevoerd door een ambtenaar van hetzelfde
      geslacht als degene die aan het onderzoek wordt onderworpen.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel28
  - number: '28.4'
    text: |-
      De ambtenaar die het onderzoek heeft uitgevoerd, maakt hiervan onverwijld schriftelijk rapport op ten behoeve van
      de meerdere.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel28
  - number: '29.1'
    text: 'De ambtenaar kan slechts van de ingeslotene verlangen dat deze zich ontkleedt indien:'
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel29
  - number: 29.1.a
    text: |-
      met toepassing van [artikel 7, vijfde of zesde lid, van de Politiewet 2012][ref1] is bepaald dat betrokkene aan of
      in zijn lichaam wordt onderzocht,


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel7
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '7'
  - number: 29.1.b
    text: |-
      de kleding tijdens de insluiting een gevaar voor de veiligheid van betrokkene of van anderen kan vormen en een
      hulpofficier van justitie daarvoor toestemming heeft gegeven, of
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel29
  - number: 29.1.c
    text: |-
      de kleding tijdens de insluiting naar het oordeel van de arts een gevaar voor de gezondheid van betrokkene of van
      anderen kan vormen.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel29
  - number: '29.2'
    text: |-
      Bij toepassing van het eerste lid, onder b of c, neemt de ambtenaar de kleding in bewaring en draagt hij zorg voor
      vervangende kleding.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel29
  - number: 29a.1
    text: |-
      Voordat de officier van justitie met toepassing van [artikel 7, zesde lid, van de Politiewet 2012][ref1] bepaalt
      dat de ingeslotene in het lichaam wordt onderzocht, wordt de ingeslotene gehoord, zo veel mogelijk in een voor hem
      begrijpelijke taal.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel7
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '7'
  - number: 29a.2
    text: Zo nodig geschiedt het horen met bijstand van een tolk. Van het horen wordt aantekening gehouden.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel29a
  - number: 29a.3
    text: 'Toepassing van het eerste lid kan achterwege blijven indien:'
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel29a
  - number: 29a.3.a
    text: de vereiste spoed zich daartegen verzet;
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel29a
  - number: 29a.3.b
    text: de gemoedstoestand van de ingeslotene daaraan in de weg staat.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel29a
  - number: 29a.4
    text: |-
      De ingeslotene ontvangt van de beslissing tot toepassing van [artikel 7, zesde lid, van de Politiewet 2012][ref1]
      onverwijld schriftelijk en zo veel mogelijk in een voor hem begrijpelijke taal een met redenen omklede,
      gedagtekende en ondertekende mededeling.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel7
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '7'
  - number: 29a.5
    text: De mededeling vermeldt bij welke functionaris een klacht kan worden ingediend.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel29a
  - number: '30.1'
    text: |-
      De ambtenaar tekent nauwkeurig alle voorwerpen en kledingstukken die hij in bewaring heeft genomen, op. Bij
      voorwerpen van een geringe omvang en waarde kan worden volstaan met een globale aanduiding.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel30
  - number: '30.2'
    text: |-
      Een afschrift van de aantekening, bedoeld in het eerste lid, wordt door de ingeslotene en de ambtenaar ondertekend
      en aan de ingeslotene overhandigd.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel30
  - number: '31.1'
    text: |-
      De ambtenaar kan de ingeslotene na toestemming van de hulpofficier van justitie aan permanente camera-observatie
      onderwerpen.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel31
  - number: '31.2'
    text: |-
      De maatregel, bedoeld in het eerste lid, is slechts geoorloofd in die gevallen waarin sprake is van een zodanige
      dreiging van gevaar voor het leven of de veiligheid van de betrokkene dat doorlopende controle ter afwending van
      dit gevaar noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel31
  - number: '31.3'
    text: |-
      De ambtenaar doet aan de betrokkene mededeling van de permanente camera-observatie en maakt aantekening van de
      permanente camera-observatie.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel31
  - number: '32.1'
    text: |-
      In het geval er aanwijzingen zijn dat een ingeslotene medische bijstand behoeft dan wel er bij deze persoon
      medicijnen zijn aangetroffen, overlegt de ambtenaar met de arts. De ambtenaar overlegt eveneens met de arts indien
      de ingeslotene zelf om medische bijstand of medicijnen vraagt.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel32
  - number: '32.2'
    text: |-
      In het geval de ingeslotene vraagt om medische bijstand van zijn eigen arts, stelt de ambtenaar die arts daarvan op
      de hoogte.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel32
  - number: '32.3'
    text: |-
      In het geval de ingeslotene te kennen geeft geen medische hulp te willen hebben, terwijl er aanwijzingen zijn dat
      medische bijstand gewenst is, waarschuwt de ambtenaar de arts en deelt hij deze de houding van de ingeslotene mee.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel32
  - number: '33'
    text: |-
      De ambtenaar mag aan de arts bij het onderzoek en de behandeling geen beperkingen opleggen. Hij volgt de
      aanwijzingen op die de arts over de zorg voor de gezondheid van de ingeslotene geeft en registreert de door de arts
      gegeven aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel33
  - number: '34.1'
    text: 'De ambtenaar controleert de ingeslotene regelmatig met dien verstande dat:'
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel34
  - number: 34.1.a
    text: in het geval de arts is gewaarschuwd, de ingeslotene ten minste elk kwartier in de cel wordt gadegeslagen;
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel34
  - number: 34.1.b
    text: |-
      in het geval medische hulp is verstrekt, de ingeslotene zo vaak wordt geobserveerd als de arts heeft
      voorgeschreven;
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel34
  - number: 34.1.c
    text: in het geval geen medische hulp noodzakelijk wordt geacht, de ingeslotene eenmaal per twee uur wordt gadegeslagen.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel34
  - number: '34.2'
    text: |-
      In de gevallen, bedoeld in het eerste lid, onder *a* en *b*, observeert de ambtenaar in de cel en aan de persoon,
      waarbij hij vooral acht slaat op de mate waarin de ingeslotene wekbaar en aanspreekbaar is. Personen die in een
      toestand geraken waarin zij niet wekbaar of aanspreekbaar zijn, worden terstond per ambulance naar een ziekenhuis
      vervoerd.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel34
  - number: '34.3'
    text: De ambtenaar registreert de observaties, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel34
  - number: '35'
    text: |-
      Bij overplaatsing van de ingeslotene geeft de ambtenaar de geneesmiddelen, de registraties, bedoeld in
      de[ artikelen 26, tweede lid][ref1], [33][ref2] en [34, derde lid][ref3], voor zover die van belang kunnen zijn, en
      de rapportage van de arts, die bestemd is voor een arts die de behandeling zal overnemen, mee.


      [ref1]: https://wetten.overheid.nl/BWBR0006589#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0006589#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0006589#Artikel34
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006589
        artikel: '26'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006589
        artikel: '33'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0006589
        artikel: '34'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: '36'
    text: |-
      De ambtenaar zorgt ervoor dat bij de invrijheidstelling van een persoon die zichzelf niet kan verplaatsen, vervoer
      en begeleiding voor die persoon beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel36
  - number: 36a.1
    text: |-
      De ambtenaar van een bijzondere opsporingsdienst handelt overeenkomstig de [artikelen 2][ref1], [4][ref2],
      [5][ref3], [7, eerste lid, aanhef en onder a en b, tweede, derde en vierde lid][ref4], [10][ref5],
      [10a][ref6], [12a][ref7], [12b][ref8], [12c][ref9], [15, eerste lid, aanhef en onder a, en tweede lid][ref10],
      [16][ref11], [17][ref12] en [19 tot en met 23][ref13] van dit besluit. In [artikel 17, derde lid][ref14],
      wordt voor «de politiechef» gelezen: het hoofd van de bijzondere opsporingsdienst. In
      [artikel 20][ref15] wordt voor «[artikel 7, derde en vierde lid, van de Politiewet 2012][ref16]» gelezen:
      [artikel 6, derde lid, van de Wet op de bijzondere opsporingsdiensten][ref17]. In [artikel 21][ref18] wordt voor
      «onderzoek aan kleding of voorwerpen» gelezen «onderzoek aan kleding» en wordt voor «artikel 7, derde lid, van de
      Politiewet 2012» gelezen «artikel 6, derde lid, van de Wet op de bijzondere opsporingsdiensten».


      [ref1]: https://wetten.overheid.nl/BWBR0006589#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006589#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0006589#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0006589#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0006589#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0006589#Artikel10a
      [ref7]: https://wetten.overheid.nl/BWBR0006589#Artikel12a
      [ref8]: https://wetten.overheid.nl/BWBR0006589#Artikel12b
      [ref9]: https://wetten.overheid.nl/BWBR0006589#Artikel12c
      [ref10]: https://wetten.overheid.nl/BWBR0006589#Artikel15
      [ref11]: https://wetten.overheid.nl/BWBR0006589#Artikel16
      [ref12]: https://wetten.overheid.nl/BWBR0006589#Artikel17
      [ref13]: https://wetten.overheid.nl/BWBR0006589#Artikel19
      [ref14]: https://wetten.overheid.nl/BWBR0006589#Artikel17
      [ref15]: https://wetten.overheid.nl/BWBR0006589#Artikel20
      [ref16]: https://wetten.overheid.nl/BWBR0031788#Artikel7
      [ref17]: https://wetten.overheid.nl/BWBR0019919#Artikel6
      [ref18]: https://wetten.overheid.nl/BWBR0006589#Artikel21
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0006589
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006589
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
