  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Ministers van Justitie en van Binnenlandse Zaken van 8 december 1993, Stafafdeling
    Wetgeving Publiekrecht, nr. 415284/93/6 en nr. EA 93/U 3630, gedaan in overeenstemming met Onze Minister van
    Defensie, nr. CWW 85/008;

    Gelet op artikel 9 van de Politiewet 1993;

    De Raad van State gehoord (advies van 28 maart 1994, nr. W.O. 3.93.0838);

    Gezien het nader rapport van Onze Minister van Justitie gedaan mede namens Onze Minister van Binnenlandse Zaken van
    7 april 1994, Stafafdeling Wetgeving Publiekrecht, nr. 433019/94/6, nr. EA 94/U1149, uitgebracht in overeenstemming
    met Onze Minister van Defensie;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit wordt verstaan onder ambtenaar:'
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel1
  - number: 1.1.a
    text: |-
      de ambtenaar van politie, bedoeld in [artikel 2, onder a, c en d, van de Politiewet 2012][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel1
