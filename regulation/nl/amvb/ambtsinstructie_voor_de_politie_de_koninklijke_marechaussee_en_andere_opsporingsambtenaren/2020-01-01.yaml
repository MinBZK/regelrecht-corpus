  - number: '37.2'
    text: |-
      Indien de aanwijzing mede omvat het gebruik van een wapen, een surveillancehond dan wel handboeien
      handelt de desbetreffende buitengewoon opsporingsambtenaar mede overeenkomstig de [artikelen 4][ref1],
      [7, eerste lid, aanhef en onder a en b, tweede, derde en vierde lid][ref2], [8][ref3], [9][ref4], [10][ref5],
      [10a][ref6], [12a][ref7], [12b][ref8], [12c][ref9], [15, eerste lid, aanhef en onder a, en tweede lid][ref10],
      [16][ref11] respectievelijk [22][ref12] en [23][ref13] van dit besluit.


