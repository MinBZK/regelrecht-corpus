  - number: '37.3'
    text: 'Voor de toepassing van het eerste en tweede lid wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel37
  - number: 37.3.a
    text: |-
      bevoegd gezag: het gezag, bedoeld in [artikel 12 van de Politiewet 2012][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel12
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '12'
  - number: 37.3.b
    text: |-
      de meerdere: de direct toezichthouder, bedoeld in [artikel 1 van het Besluit buitengewoon opsporingsambtenaar][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007013#Artikel1
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0007013
        artikel: '1'
  - number: 37.3.c
    text: |-
      geweldmiddel: de wapens en de uitrusting, waarmee geweld kan worden uitgeoefend, die krachtens
      [artikel 3a, eerste tot en met derde lid van de Wet wapens en munitie][ref1] zijn toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel3a
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: 3a
  - number: '38'
    text: |-
      De buitengewoon opsporingsambtenaar die bevoegd is tot het gebruik van een wapen of handboeien, maakt bij
      de uitoefening van zijn dienst uitsluitend gebruik van het door Onze Minister voorgeschreven geweldmiddel of
      handboeien.
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel38
  - number: '39'
    text: |-
      De buitengewoon opsporingsambtenaar is niet eerder bevoegd tot de uitoefening van de in
      [artikel 7, eerste, derde en vierde lid, van de Politiewet 2012][ref1] bedoelde bevoegdheden dan nadat die
      bevoegdheid is aangetekend op de akte van beëdiging en is gebleken van zijn bekwaamheid in de uitoefening daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel7
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '7'
  - number: 39a
    text: |-
      Dit besluit berust op [artikel 7, negende lid][ref1], en [artikel 9 van de Politiewet 2012][ref2] en
      [artikel 6, vijfde lid, van de Wet op de bijzondere opsporingsdiensten][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0019919#Artikel6
    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '7'
      - id: ref2
