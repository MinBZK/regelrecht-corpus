      de[ artikelen 1][ref2] en [2][ref3], [hoofdstuk 5][ref4]; In [hoofdstuk 6][ref5] van dit besluit wordt onder
      ambtenaar mede verstaan de ambtenaar van politie, bedoeld in artikel 2, onder b, van de Politiewet 2012, dan wel
      een andere persoon, voor zover die ambtenaar van politie of die persoon tevens buitengewoon opsporingsambtenaar is
      en door de korpschef is belast met de verzorging van ingeslotenen.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
