    url: https://wetten.overheid.nl/BWBR0006589/2020-01-01#Artikel1
  - number: 1.1.d
    text: |-
      de militair van de Koninklijke marechaussee in de uitvoering van de politietaken, bedoeld in
      [artikel 4, eerste lid, van de Politiewet 2012][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel4
