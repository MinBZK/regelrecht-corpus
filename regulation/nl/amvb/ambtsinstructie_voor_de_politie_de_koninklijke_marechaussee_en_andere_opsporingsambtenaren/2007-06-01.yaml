  - number: 36b
    text: |-
      De ambtenaar van een bijzondere opsporingsdienst maakt bij de uitoefening van zijn dienst uitsluitend gebruik van
      het door Onze Minister van Justitie voorgeschreven geweldmiddel of handboeien.
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel36b
  - number: '37'
    text: |-
      1 Indien Onze Minister van Justitie ingevolge [artikel 8, zevende lid, van de Politiewet 1993][ref1], heeft
      bepaald dat een buitengewoon opsporingsambtenaar bevoegd is tot de uitoefening van de bevoegdheden, bedoeld
      in het [eerste en derde lid van dat artikel][ref2], handelt de desbetreffende buitengewoon opsporingsambtenaar
      overeenkomstig de [artikelen 5][ref3], [17][ref4], [19][ref5], [20, eerste lid][ref6], en [21][ref7] van dit
      besluit. In [artikel 17, derde lid][ref8], wordt voor «de korpschef» gelezen: de meerdere.

      2 Indien de aanwijzing mede omvat het gebruik van een wapen, een surveillancehond dan wel handboeien
      handelt de desbetreffende buitengewoon opsporingsambtenaar mede overeenkomstig de [artikelen 4][ref9],
      [7, eerste lid, aanhef en onder a en b, tweede, derde en vierde lid][ref10], [8][ref11], [9][ref12], [10][ref13],
      [10a][ref14], [12a][ref15], [12b][ref16], [12c][ref17], [15, eerste lid, aanhef en onder a, en tweede lid][ref18],
      [16][ref19] respectievelijk [22][ref20] en [23][ref21] van dit besluit.

      3 Voor de toepassing van het eerste en tweede lid wordt verstaan onder:

      a. bevoegd gezag: het gezag, bedoeld in [artikel 13 van de Politiewet 1993][ref22];

      b. de meerdere: de direct toezichthouder, bedoeld in
      [artikel 1 van het Besluit buitengewoon opsporingsambtenaar][ref23].

      c. geweldmiddel: de wapens en de uitrusting, waarmee geweld kan worden uitgeoefend, die krachtens
      [artikel 3a, eerste tot en met derde lid van de Wet wapens en munitie][ref24] zijn toegestaan.


