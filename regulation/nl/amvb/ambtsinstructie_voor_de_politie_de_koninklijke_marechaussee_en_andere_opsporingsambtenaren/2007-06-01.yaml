preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Ministers van Justitie en van Binnenlandse Zaken van 8 december 1993, Stafafdeling
    Wetgeving Publiekrecht, nr. 415284/93/6 en nr. EA 93/U 3630, gedaan in overeenstemming met Onze Minister van
    Defensie, nr. CWW 85/008;

    Gelet op artikel 9 van de Politiewet 1993;

    De Raad van State gehoord (advies van 28 maart 1994, nr. W.O. 3.93.0838);

    Gezien het nader rapport van Onze Minister van Justitie gedaan mede namens Onze Minister van Binnenlandse Zaken van
    7 april 1994, Stafafdeling Wetgeving Publiekrecht, nr. 433019/94/6, nr. EA 94/U1149, uitgebracht in overeenstemming
    met Onze Minister van Defensie;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder ambtenaar:

      a. de ambtenaar van politie, bedoeld in
      [artikel 3, eerste lid, onder a en c, en tweede lid, van de Politiewet 1993][ref1];

      b. de ambtenaar van politie, bedoeld in [artikel 3, eerste lid, onder b, van de Politiewet 1993][ref2]
      voor zover het betreft de[ artikelen 1][ref3] en [2][ref4], [hoofdstuk 5][ref5]; In [hoofdstuk 6][ref6]
      van dit besluit wordt onder ambtenaar mede verstaan de ambtenaar van politie, bedoeld in
      [artikel 3, eerste lid, onder b, van de Politiewet 1993][ref7], dan wel een andere persoon, voor zover die
      ambtenaar van politie of die persoon tevens buitengewoon opsporingsambtenaar is en door de korpsbeheerder is belast
      met de verzorging van ingeslotenen.

      c. degene die is benoemd tot adspirant voor de duur dat hij de praktijkstage volgt;

      d. de militair van de Koninklijke marechaussee in de uitvoering van de politietaken, bedoeld in
      [artikel 6, eerste lid, van de Politiewet 1993][ref8];

      e. de militair van de krijgsmacht, bedoeld in [artikel 59, eerste lid][ref9], en
      [artikel 60 van de Politiewet 1993][ref10].

      2 In dit besluit wordt verstaan onder meerdere:

      a. de ambtenaar die uit hoofde van zijn functie of krachtens beschikking of aanwijzing met de leiding is belast of
      het bevel heeft over de taakuitvoering;

      b. indien op grond van het bepaalde onder *a*, geen meerdere kan worden aangewezen de ambtenaar van politie die
      een hogere rang heeft of, bij gelijkheid in rang, degene met de meeste dienstjaren, dan wel bij optreden door
      militairen van de Koninklijke marechaussee of van enig ander krijgsmachtonderdeel degene die ingevolge het bepaalde
      bij of krachtens [artikel 67 van het Wetboek van Militair Strafrecht][ref11] de meerdere is.

      3 In dit besluit wordt verstaan onder:

      a. bevoegd gezag: het gezag, bedoeld in de [artikelen 12][ref12], [13][ref13] en
      [15 van de Politiewet 1993][ref14];

      b. geweld: elke dwangmatige kracht van meer dan geringe betekenis uitgeoefend op personen of zaken;

      c. aanwenden van geweld: het gebruiken van geweld en het dreigen met geweld, waaronder wordt begrepen het ter hand
      nemen van een vuurwapen;

      d. geweldmiddel:

      1o. de krachtens [artikel 49, eerste lid, van de Politiewet 1993][ref15] toegelaten uitrusting en bewapening
      waarmee geweld kan worden uitgeoefend, en

      2o. de door Onze Minister van Defensie ter beschikking gestelde uitrusting en bewapening waarmee geweld kan worden
      uitgeoefend in de uitvoering van de politietaken, bedoeld in de [artikelen 6][ref16], [58][ref17], [59][ref18] en
      [60 van de Politiewet 1993][ref19];

      e. hulpmiddelen ten behoeve van uitzetting:

      1º. de krachtens [artikel 49, eerste lid, van de Politiewet 1993][ref20], aan de ambtenaar van politie, bij of
      krachtens de [Vreemdelingenwet 2000][ref21] belast met de grensbewaking of met het toezicht op vreemdelingen, ter
      beschikking gestelde uitrusting ten behoeve van de uitzetting van vreemdelingen, en

      2º. de door Onze Minister van Defensie, in overeenstemming met Onze Minister voor Vreemdelingenzaken en Integratie,
      aan de ambtenaar van de Koninklijke marechaussee, bij of krachtens de [Vreemdelingenwet 2000][ref22] belast met
      de grensbewaking of met het toezicht op vreemdelingen, ter beschikking gestelde uitrusting ten behoeve van de
      uitzetting van vreemdelingen;

      f. vuurwapen waarmee automatisch vuur kan worden afgegeven: vuurwapen waarmee met één druk op het afvuurmechanisme
      meer schoten kunnen worden gelost dan wel een vuurwapen waarmee naar keus hetzij één schot, hetzij meer schoten
      kunnen worden gelost;

      g. mobiele eenheid: een eenheid van ambtenaren van politie als bedoeld in
      [artikel 6 van het Besluit beheer regionale politiekorpsen][ref23] en de eenheden van de Koninklijke marechaussee
      die met dezelfde taken als bedoeld in genoemd besluit zijn belast;

      h. de arts: de dienstdoend adviserend arts;

      i. buitengewoon opsporingsambtenaar: de buitengewoon opsporingsambtenaar, bedoeld in
      [artikel 142, eerste lid, van het Wetboek van Strafvordering][ref24];

      j. het gebruik van een vuurwapen: het richten, het gericht houden en het daadwerkelijk gebruik van een vuurwapen;

      k. niet-penetrerende munitie: munitie die is ontworpen om bij het treffen van een persoon niet het lichaam binnen
      te dringen;

      l. AOE: eenheid van ambtenaren van politie als bedoeld in
      [artikel 8 van het Besluit beheer regionale politiekorpsen][ref25] en de eenheid van de Koninklijke marechaussee
      die met dezelfde taken als bedoeld in genoemd besluit is belast;

      m. AOE-hond: hond in eigendom van de Staat of een regio met als doel in politiedienst te worden ingezet bij het
      optreden van een AOE of een bijstandseenheid als bedoeld in [artikel 60 van de Politiewet 1993][ref26];

      n. ambtenaar van een bijzondere opsporingsdienst: ambtenaar van een bijzondere opsporingsdienst die is aangesteld
      voor de uitvoering van de taken, bedoeld in [artikel 3 van de Wet op de bijzondere opsporingsdiensten][ref27].

      4 In dit besluit wordt onder ingeslotene verstaan degene die rechtens van zijn vrijheid is beroofd. Onder
      ingeslotene wordt mede verstaan degene die ten behoeve van de hulpverlening aan hem op het politie- of
      brigadebureau is ondergebracht.


