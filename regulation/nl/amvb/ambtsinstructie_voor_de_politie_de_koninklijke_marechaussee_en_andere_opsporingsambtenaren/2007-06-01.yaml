  - number: '40'
    text: |-
      Dit besluit treedt in werking met ingang van de dag waarop de [Politiewet 1993][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0006299
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0006299
  - number: '41'
    text: |-
      Dit besluit wordt aangehaald als: Ambtsinstructie voor de politie, de Koninklijke marechaussee en andere
      opsporingsambtenaren.
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel41
