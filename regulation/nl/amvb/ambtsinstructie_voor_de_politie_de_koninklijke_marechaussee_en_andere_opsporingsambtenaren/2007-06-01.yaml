  - number: '2'
    text: |-
      De ambtenaar legitimeert zich met het legitimatiebewijs dat aan hem is verstrekt:

      a. bij optreden in burgerkleding ongevraagd, tenzij bijzondere omstandigheden dit onmogelijk maken, en

      b. bij optreden in uniform, op verzoek daartoe.
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel2
  - number: '3'
    text: |-
      De ambtenaar die bijstand verleent ingevolge de bepalingen van [Hoofdstuk IX van de Politiewet 1993][ref1] staat
      onder bevel van het bevoegd gezag ter plaatse of een door deze aangewezen ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#HoofdstukIX
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006299
        hoofdstuk: IX
  - number: '4'
    text: |-
      Het gebruik van een geweldmiddel is uitsluitend toegestaan aan een ambtenaar:

      a. aan wie dat geweldmiddel rechtens is toegekend, voor zover hij optreedt ter uitvoering van de taak met het oog
      waarop het geweldmiddel hem is toegekend, en

      b. die in het gebruik van dat geweldmiddel is geoefend.
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel4
  - number: '5'
    text: |-
      1 Indien de ambtenaar, al of niet in gesloten verband, onder leiding van een ter plaatse aanwezige meerdere
      optreedt, zal hij geen geweld aanwenden dan na uitdrukkelijke last van deze meerdere. De meerdere geeft daarbij aan
      van welk geweldmiddel gebruik wordt gemaakt.

      2 Het eerste lid is niet van toepassing in het geval de meerdere, bedoeld in het eerste lid, vooraf anders heeft
      bepaald.

      3 Het eerste lid is evenmin van toepassing in een geval als bedoeld in [artikel 10, eerste lid, onderdeel b][ref1],
      voor zover de last redelijkerwijs niet kan worden afgewacht.


      [ref1]: https://wetten.overheid.nl/BWBR0006589#Artikel10
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006589
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '6'
    text: |-
      1 De korpschef of de daartoe door hem aangewezen ambtenaar van politie zet de eenheid, bedoeld in [artikel 6][ref1]
      of [8 van het Besluit beheer regionale politiekorpsen][ref2], slechts in na toestemming van het bevoegd gezag.

      2 De door het bevoegd gezag aangewezen ambtenaar zet de eenheden, bedoeld in de [artikelen 58][ref3] en
      [59 van de Politiewet 1993][ref4] slechts in na toestemming van het bevoegd gezag.


