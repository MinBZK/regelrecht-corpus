        bwb_id: BWBR0006589
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 11a
    text: |-
      Het gebruik van een vuurwapen dat is geladen met niet-penetrerende munitie is slechts geoorloofd:

      a. om een persoon aan te houden ten aanzien van wie redelijkerwijs mag worden aangenomen dat hij een voor
      onmiddellijk gebruik gereed zijnd wapen bij zich heeft en dit tegen personen zal gebruiken; of

      b. om een persoon aan te houden die zich aan zijn aanhouding, voorgeleiding of andere rechtmatige vrijheidsbeneming
      tracht te onttrekken of heeft onttrokken.
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel11a
  - number: 11b
    text: |-
      De ambtenaar waarschuwt onmiddellijk voordat hij gericht met een vuurwapen dat is geladen met niet-penetrerende
      munitie zal schieten, met luide stem of op andere niet mis te verstane wijze dat geschoten zal worden, indien
      niet onverwijld het gegeven bevel wordt opgevolgd. Deze waarschuwing blijft slechts achterwege, wanneer de
      omstandigheden de waarschuwing niet toelaten.
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel11b
  - number: 11c
    text: |-
      De [artikelen 11a][ref1] en [11b][ref2] zijn van overeenkomstige toepassing indien de niet-penetrerende munitie
      wordt afgegeven met een ander hulpmiddel dan een vuurwapen.


      [ref1]: https://wetten.overheid.nl/BWBR0006589#Artikel11a
      [ref2]: https://wetten.overheid.nl/BWBR0006589#Artikel11b
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel11c
    references:
      - id: ref1
        bwb_id: BWBR0006589
        artikel: 11a
        hoofdstuk: '2'
        paragraaf: 2a
      - id: ref2
        bwb_id: BWBR0006589
        artikel: 11b
        hoofdstuk: '2'
        paragraaf: 2a
  - number: 12a
    text: |-
      1 Het gebruik van pepperspray is slechts geoorloofd:

      a. om een persoon aan te houden ten aanzien van wie redelijkerwijs mag worden aangenomen dat hij een voor
      onmiddellijk gebruik gereed zijnd wapen bij zich heeft en dit tegen een persoon zal gebruiken;

      b. om een persoon aan te houden die zich aan aanhouding, voorgeleiding of andere rechtmatige vrijheidsbeneming
      tracht te onttrekken of heeft onttrokken;

      c. ter verdediging tegen of voor het onder controle brengen van agressieve dieren.

      2 Pepperspray wordt niet gebruikt tegen:

      a. personen die zichtbaar jonger dan 12 of ouder dan 65 jaar zijn;

      b. vrouwen die zichtbaar zwanger zijn;

      c. personen voor wie dit gebruik als gevolg van een voor de ambtenaar zichtbare ademhalings- of andere ernstige
      gezondheidsstoornis onevenredig schadelijk kan zijn;

      d. groepen personen.
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel12a
  - number: 12b
    text: |-
      De ambtenaar waarschuwt onmiddellijk voordat hij gericht pepperspray tegen een persoon zal gebruiken, met luide
      stem of op andere niet mis te verstane wijze dat pepperspray gebruikt zal worden, indien niet onverwijld het
      gegeven bevel wordt opgevolgd. Deze waarschuwing blijft achterwege indien de omstandigheden de waarschuwing
      redelijkerwijs niet toelaten.
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel12b
  - number: 12c
    text: |-
      Pepperspray wordt tegen een persoon per geval ten hoogste twee maal voor de duur van niet langer dan ongeveer een
      seconde gebruikt en op een afstand van ten minste een meter.
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel12c
  - number: '13'
    text: |-
      1 Het gebruik van CS-traangas is slechts geoorloofd:

      a. in gesloten ruimten ter aanhouding van een persoon indien redelijkerwijs mag worden aangenomen dat die persoon
      een voor onmiddellijk gebruik gereed zijnd vuurwapen bij zich heeft en dat tegen personen zal gebruiken dan wel
      ander levensbedreigend geweld tegen personen zal gebruiken;

      b. anders dan in gesloten ruimten ter verspreiding van samenscholingen of volksmenigten die een ernstige en
      onmiddellijke bedreiging vormen voor de veiligheid van personen of voor zaken.

      2 Het gebruik van CS-traangas is slechts geoorloofd in opdracht van de meerdere na vooraf verkregen toestemming van
      het bevoegd gezag.

      3 De meerdere die bevel geeft tot het verspreiden van CS-traangas geeft bij dit bevel aan hoeveel CS-
      traangasgranaten worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel13
  - number: '14'
    text: |-
      Het gebruik van een waterwerper is slechts geoorloofd bij optreden van de mobiele eenheid in opdracht van de
      meerdere en na verkregen toestemming van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel14
  - number: '15'
    text: |-
      1 Het inzetten van een politie-surveillancehond is slechts geoorloofd onder het direct en voortdurend toezicht van
      een geleider bij:

      a. de surveillancedienst, en

      b. het optreden van de mobiele eenheid na toestemming van het bevoegd gezag.

      2 Het inzetten van een AOE-hond is slechts geoorloofd onder het direct en voortdurend toezicht van een geleider
      bij het, na toestemming van het bevoegd gezag, optreden van een AOE of een bijstandseenheid als bedoeld in
      [artikel 60 van de Politiewet 1993][ref1].

      3 De geleider dient in het bezit te zijn van een krachtens [artikel 49, eerste lid, van de Politiewet 1993][ref2]
      vastgesteld certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel49
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '60'
      - id: ref2
        bwb_id: BWBR0006299
        artikel: '49'
  - number: '16'
    text: |-
      Het gebruik van een elektrische wapenstok is slechts geoorloofd als afweermiddel tegen agressieve dieren na
      toestemming van de meerdere.
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel16
  - number: '17'
    text: |-
      1 De ambtenaar die geweld heeft aangewend, meldt de feiten en omstandigheden dienaangaande, alsmede de gevolgen
      hiervan, onverwijld aan zijn meerdere.

      2 De melding, bedoeld in het eerste lid, wordt door de meerdere terstond vastgelegd op een daartoe door Onze
      Ministers van Justitie en van Binnenlandse Zaken en Koninkrijksrelaties bij ministeriële regeling vastgestelde
      wijze.

      3 De melding, bedoeld in het tweede lid, wordt door de korpschef binnen 48 uur ter kennis gebracht van de
      officier van justitie van het arrondissement waarbinnen het geweld is aangewend, dan wel door de commandant van de
      Koninklijke marechaussee van de officier van justitie te Arnhem belast met militaire zaken ingeval het een militair
      betreft, indien:

      a. de gevolgen van het aanwenden van geweld daartoe naar het oordeel van de korpschef of de commandant aanleiding
      geven,

      b. het aanwenden van geweld lichamelijk letsel van meer dan geringe betekenis dan wel de dood heeft veroorzaakt, of

      c. gebruik is gemaakt van een vuurwapen en daarmee één of meer schoten zijn gelost.
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel17
  - number: '19'
    text: |-
      De meerdere licht de ambtenaar zo spoedig mogelijk in over de afhandeling van de melding. Desgevraagd worden aan de
      ambtenaar tussentijds inlichtingen verstrekt.
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel19
  - number: '20'
    text: |-
      1 Het onderzoek, bedoeld in [artikel 8, derde lid, van de Politiewet 1993][ref1], geschiedt door het oppervlakkig
      aftasten van de kleding en wordt zoveel mogelijk uitgevoerd door een ambtenaar van hetzelfde geslacht als degene
      die aan het onderzoek wordt onderworpen.

      2 Het onderzoek, bedoeld in [artikel 8, vierde lid, van de Politiewet 1993][ref2], wordt uitgevoerd door een
      ambtenaar van hetzelfde geslacht als degene die aan het onderzoek wordt onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel8
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0006299
        artikel: '8'
  - number: '21'
    text: |-
      De ambtenaar die een onderzoek als bedoeld in [artikel 8, derde of vierde lid, van de Politiewet 1993][ref1]
      heeft uitgevoerd, meldt dit onverwijld schriftelijk aan de meerdere, onder vermelding van de redenen die tot dit
      onderzoek hebben geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel8
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '8'
  - number: '22'
    text: |-
      1 De ambtenaar kan een persoon die rechtens van zijn vrijheid is beroofd, ten behoeve van het vervoer handboeien
      aanleggen.

      2 De maatregel, bedoeld in het eerste lid, kan slechts worden getroffen, indien de feiten of omstandigheden dit
      redelijkerwijs vereisen met het oog op gevaar voor ontvluchting, dan wel met het oog op gevaar voor de veiligheid
      of het leven van de persoon die rechtens van zijn vrijheid is beroofd, van de ambtenaar of van derden.

      3 De in het tweede lid bedoelde feiten of omstandigheden kunnen slechts gelegen zijn in:

      a. de persoon die rechtens van zijn vrijheid is beroofd, of

      b. de aard van het strafbare feit op grond waarvan de vrijheidsbeneming heeft plaatsgevonden, één en ander in
      samenhang met de wijze waarop en de situatie waarin het vervoer plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel22
  - number: '23'
    text: |-
      De ambtenaar die gebruik heeft gemaakt van handboeien als bedoeld in [artikel 22, eerste lid][ref1], meldt dit
      onverwijld schriftelijk aan de meerdere, onder vermelding van de redenen die tot het gebruik van handboeien hebben
      geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0006589#Artikel22
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006589
        artikel: '22'
        hoofdstuk: '4'
  - number: 23a
    text: |-
      1 De ambtenaar, bij of krachtens de [Vreemdelingenwet 2000][ref1] belast met de grensbewaking of met het toezicht
      op vreemdelingen, kan een vreemdeling bij diens uitzetting per luchtvaartuig met hulpmiddelen ten behoeve van
      uitzetting in zijn bewegingsvrijheid beperken, ten behoeve van een goed verloop van de uitzetting.

      2 De maatregel, bedoeld in het eerste lid, kan slechts worden getroffen indien:

      a. de feiten of omstandigheden dit redelijkerwijs vereisen met het oog op gevaar voor ontvluchting, dan wel met het
      oog op gevaar voor de veiligheid of het leven van de vreemdeling, van de ambtenaar of van derden, dan wel met het
      oog op gevaar voor een ernstige verstoring van de openbare orde, en

      b. de toepassing van het hulpmiddel redelijkerwijs geen gevaar kan opleveren voor de gezondheid van de vreemdeling.

      3 Indien de ambtenaar, bedoeld in het eerste lid, onder leiding van een ter plaatse aanwezige meerdere optreedt,
      zal hij geen gebruik maken van hulpmiddelen ten behoeve van uitzetting dan na uitdrukkelijke last van deze
      meerdere. De meerdere geeft daarbij aan van welk hulpmiddel gebruik wordt gemaakt.

      4 Het gebruik van een hulpmiddel ten behoeve van uitzetting is uitsluitend toegestaan aan een ambtenaar die in het
      gebruik van dat hulpmiddel is geoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 23b
    text: |-
      1 De ambtenaar die ten aanzien van een vreemdeling die wordt uitgezet gebruik heeft gemaakt van een hulpmiddel
      ten behoeve van uitzetting als bedoeld in [artikel 23a, eerste lid][ref1], meldt dit onverwijld schriftelijk aan
      de meerdere, onder vermelding van de aard van het hulpmiddel, de redenen die tot het gebruik hebben geleid en de
      daaruit voortvloeiende gevolgen.

      2 De meerdere draagt zorg voor registratie van de melding, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006589#Artikel23a
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0006589
        artikel: 23a
        hoofdstuk: 4a
  - number: '24'
    text: |-
      1 De ambtenaar draagt er zorg voor personen met lichte verwondingen, ziekteverschijnselen en personen ten aanzien
      van wie twijfel op dit punt bestaat, de weg te wijzen naar een huisarts of naar een E.H.B.O.-afdeling van een
      ziekenhuis. Indien dat noodzakelijk is, verleent de ambtenaar bemiddeling bij het verkrijgen van passend vervoer.

      2 De ambtenaar draagt er zorg voor dat personen met ernstige verwondingen en bewustelozen, waar onder mede worden
      verstaan personen die niet wekbaar of niet aanspreekbaar zijn, per ambulance naar het ziekenhuis worden vervoerd.
      De gegevens omtrent aard en omstandigheden van de gebeurtenis die tot de ziektetoestand heeft geleid, alsmede de
      op de persoon aangetroffen medische gegevens en geneesmiddelen, worden door hem ter beschikking van de medische
      hulpverleners gesteld.
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel24
  - number: '25'
    text: |-
      1 De ambtenaar draagt er zoveel mogelijk zorg voor dat personen die door drankgebruik, dan wel
      door andere oorzaken, onmiddellijk gevaarlijk zijn, hetzij voor de openbare orde, veiligheid, of
      gezondheid, hetzij voor zichzelf, op de meest geschikte wijze van openbare plaatsen als bedoeld in
      [artikel 1 van de Wet openbare manifestaties][ref1], worden verwijderd. Onder openbare plaatsen worden mede
      verstaan vervoermiddelen die zich bevinden op deze plaatsen, een en ander voor zover niet gebezigd als woning.

      2 De ambtenaar draagt personen als bedoeld in het eerste lid over aan het eigen zorgkader, voor zover de
      omstandigheden zulks toelaten. Zij kunnen bij het ontbreken van opvangmogelijkheden elders, bij wijze van
      hulpverlening, op het politie- of brigadebureau worden ondergebracht, indien dit nodig is voor hun bescherming en
      dit niet tegen hun wil geschiedt.

      3 Voor personen als bedoeld in het eerste lid, van wie bekend is dat zij geestelijk gestoord zijn of die geestelijk
      gestoord lijken, waarschuwt de ambtenaar de arts, nadat zo mogelijk getracht is contact te zoeken met de eigen
      huisarts.


      [ref1]: https://wetten.overheid.nl/BWBR0004318#Artikel1
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004318
        artikel: '1'
  - number: '26'
    text: |-
      1 De ambtenaar handelt jegens de ingeslotene overeenkomstig het gestelde bij of krachtens
      [artikel 15 van het Besluit beheer regionale politiekorpsen][ref1].

      2 De ambtenaar registreert de gegevens die krachtens
      [artikel 15, zesde lid, van het Besluit beheer regionale politiekorpsen][ref2] zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0006560#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0006560#Artikel15
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0006560
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0006560
        artikel: '15'
  - number: '27'
    text: |-
      1 Voor zover het bij of krachtens het [Wetboek van Strafvordering][ref1] bepaalde zich hiertegen niet verzet
      stelt de ambtenaar een familielid of een huisgenoot van een ingeslotene zo spoedig mogelijk op de hoogte van de
      insluiting. In het geval de ingeslotene minderjarig is, doet hij dit uit eigen beweging, indien de ingeslotene
      meerderjarig is, doet hij dit slechts op verzoek van de ingeslotene.

      2 Indien de omstandigheden de uitvoering van het eerste lid niet toelaten bij een ingeslotene die geen ingezetene
      is, wordt de ambassade of het consulaat van het land waarin de ingeslotene ingezetene is, op de hoogte gesteld van
      de insluiting.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '28'
    text: |-
      1 De ambtenaar onderzoekt de ingeslotene direct voorafgaand aan de insluiting op het politie- of brigadebureau,
      door het aftasten en doorzoeken van diens kleding op de aanwezigheid van voorwerpen die tijdens de insluiting een
      gevaar voor de veiligheid van de betrokkene of voor anderen kunnen vormen.

      2 Bij het aantreffen van voorwerpen als bedoeld in het eerste lid, neemt de ambtenaar deze in bewaring.

      3 Het onderzoek, bedoeld in het eerste lid, wordt zoveel mogelijk uitgevoerd door een ambtenaar van hetzelfde
      geslacht als degene die aan het onderzoek wordt onderworpen.
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel28
  - number: '29'
    text: |-
      1 De ambtenaar kan slechts van de ingeslotene verlangen dat deze zich ontkleedt indien:

      a. de kleding tijdens de insluiting een gevaar voor de veiligheid van betrokkene of van anderen kan vormen en een
      hulpofficier van justitie daarvoor toestemming heeft gegeven;

      b. de kleding tijdens de insluiting naar het oordeel van de arts een gevaar voor de gezondheid van betrokkene of
      van anderen kan vormen.

      2 De ambtenaar neemt de kleding, bedoeld in het eerste lid, in bewaring en draagt zorg voor vervangende kleding.
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel29
  - number: '30'
    text: |-
      1 De ambtenaar die een onderzoek als bedoeld in [artikel 28, eerste lid][ref1], heeft uitgevoerd, maakt hiervan
      onverwijld schriftelijk rapport op ten behoeve van de meerdere.

      2 De ambtenaar tekent nauwkeurig alle voorwerpen en kledingstukken die hij in bewaring heeft genomen, op. Bij
      voorwerpen van een geringe omvang en waarde kan worden volstaan met een globale aanduiding.

      3 Een afschrift van de aantekening, bedoeld in het tweede lid, wordt door de ingeslotene en de ambtenaar
      ondertekend en aan de ingeslotene overhandigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006589#Artikel28
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0006589
        artikel: '28'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '31'
    text: |-
      1 De ambtenaar kan de ingeslotene na toestemming van de hulpofficier van justitie aan permanente camera-observatie
      onderwerpen.

      2 De maatregel, bedoeld in het eerste lid, is slechts geoorloofd in die gevallen waarin sprake is van een zodanige
      dreiging van gevaar voor het leven of de veiligheid van de betrokkene dat doorlopende controle ter afwending van
      dit gevaar noodzakelijk is.

      3 De ambtenaar doet aan de betrokkene mededeling van de permanente camera-observatie en maakt aantekening van de
      permanente camera-observatie.
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel31
  - number: '32'
    text: |-
      1 In het geval er aanwijzingen zijn dat een ingeslotene medische bijstand behoeft dan wel er bij deze persoon
      medicijnen zijn aangetroffen, overlegt de ambtenaar met de arts. De ambtenaar overlegt eveneens met de arts indien
      de ingeslotene zelf om medische bijstand of medicijnen vraagt.

      2 In het geval de ingeslotene vraagt om medische bijstand van zijn eigen arts, stelt de ambtenaar die arts daarvan
      op de hoogte.

      3 In het geval de ingeslotene te kennen geeft geen medische hulp te willen hebben, terwijl er aanwijzingen zijn dat
      medische bijstand gewenst is, waarschuwt de ambtenaar de arts en deelt hij deze de houding van de ingeslotene mee.
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel32
  - number: '33'
    text: |-
      De ambtenaar mag aan de arts bij het onderzoek en de behandeling geen beperkingen opleggen. Hij volgt de
      aanwijzingen op die de arts over de zorg voor de gezondheid van de ingeslotene geeft en registreert de door de arts
      gegeven aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel33
  - number: '34'
    text: |-
      1 De ambtenaar controleert de ingeslotene regelmatig met dien verstande dat:

      a. in het geval de arts is gewaarschuwd, de ingeslotene ten minste elk kwartier in de cel wordt gadegeslagen;

      b. in het geval medische hulp is verstrekt, de ingeslotene zo vaak wordt geobserveerd als de arts heeft
      voorgeschreven;

      c. in het geval geen medische hulp noodzakelijk wordt geacht, de ingeslotene eenmaal per twee uur wordt
      gadegeslagen.

      2 In de gevallen, bedoeld in het eerste lid, onder *a* en *b*, observeert de ambtenaar in de cel en aan de persoon,
      waarbij hij vooral acht slaat op de mate waarin de ingeslotene wekbaar en aanspreekbaar is. Personen die in een
      toestand geraken waarin zij niet wekbaar of aanspreekbaar zijn, worden terstond per ambulance naar een ziekenhuis
      vervoerd.

      3 De ambtenaar registreert de observaties, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel34
  - number: '35'
    text: |-
      Bij overplaatsing van de ingeslotene geeft de ambtenaar de geneesmiddelen, de registraties, bedoeld in
      de[ artikelen 26, tweede lid][ref1], [33][ref2] en [34, derde lid][ref3], voor zover die van belang kunnen zijn, en
      de rapportage van de arts, die bestemd is voor een arts die de behandeling zal overnemen, mee.


      [ref1]: https://wetten.overheid.nl/BWBR0006589#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0006589#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0006589#Artikel34
