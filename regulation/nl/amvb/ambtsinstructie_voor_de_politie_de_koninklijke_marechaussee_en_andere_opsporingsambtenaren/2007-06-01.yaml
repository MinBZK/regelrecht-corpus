        artikel: '48'
  - number: '8'
    text: |-
      1 Het gebruik van een vuurwapen waarmee automatisch vuur kan worden afgegeven, is slechts geoorloofd tegen
      personen en tegen vervoermiddelen waarin of waarop zich personen bevinden, in een situatie waarin sprake is van een
      ogenblikkelijke, wederrechtelijke aanranding van eigen of eens anders lijf.

      2 Een vuurwapen waarmee automatisch vuur kan worden afgegeven mag slechts worden meegevoerd ten behoeve van de
      opleiding dan wel voor:

      a. het verrichten van een aanhouding van een persoon van wie redelijkerwijs mag worden aangenomen dat hij een voor
      onmiddellijk gebruik gereed zijnd vuurwapen bij zich heeft en dit tegen personen zal gebruiken,

      b. de bewaking en beveiliging van personen en objecten.

      3 Het meevoeren van vuurwapens waarmee automatisch vuur kan worden afgegeven in het geval, bedoeld in het tweede
      lid, onder a, is slechts toegestaan na schriftelijke toestemming van de officier van justitie. Indien wegens de
      vereiste spoed de toestemming niet schriftelijk kan worden gevraagd of verleend, kan deze ook mondeling worden
      gevraagd en verleend. De toestemming die mondeling is verleend, wordt binnen vierentwintig uur schriftelijk
      bevestigd. De officier van justitie doet van het meevoeren van vuurwapens waarmee automatisch vuur kan worden
      afgegeven zo mogelijk vooraf mededeling aan de betrokken burgemeester.

      4 Het meevoeren van vuurwapens waarmee automatisch vuur kan worden afgegeven in het geval, bedoeld in het tweede
      lid, onder b, is slechts mogelijk na schriftelijke toestemming van het bevoegd gezag. Indien wegens de vereiste
      spoed de toestemming niet schriftelijk kan worden gevraagd of verleend, kan deze ook mondeling worden gevraagd en
      verleend. De toestemming die mondeling is verleend, wordt binnen vierentwintig uur schriftelijk bevestigd.
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel8
  - number: '9'
    text: |-
      1 Het gebruik van een vuurwapen waarmee lange afstandsprecisievuur kan worden afgegeven, is slechts geoorloofd bij
      zeer ernstige misdrijven ter afwending van direct gevaar voor het leven van personen.

      2 Het gebruik, bedoeld in het eerste lid, vindt plaats onder bevel van de commandant van een bijstandseenheid als
      bedoeld in [artikel 60 van de Politiewet 1993][ref1].

      3 Een vuurwapen waarmee lange afstandsprecisievuur kan worden afgegeven mag slechts worden meegevoerd ten behoeve
      van de opleiding dan wel ten behoeve van de daadwerkelijke bestrijding van zeer ernstige misdrijven waarbij sprake
      is van direct levensbedreigende omstandigheden.

      4 Het meevoeren van een vuurwapen waarmee lange afstandsprecisievuur kan worden afgegeven ten behoeve van
      de daadwerkelijke bestrijding van zeer ernstige misdrijven waarbij sprake is van direct levensbedreigende
      omstandigheden, is slechts toegestaan na schriftelijke toestemming van het bevoegd gezag. Aan de toestemming kunnen
      voorwaarden worden verbonden. Indien wegens de vereiste spoed de toestemming niet schriftelijk kan worden gevraagd
      of verleend, kan deze ook mondeling worden gevraagd en verleend. De toestemming die mondeling is verleend, wordt
      binnen vierentwintig uur schriftelijk bevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel60
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '60'
  - number: '10'
    text: |-
      1 De ambtenaar mag slechts een vuurwapen, niet zijnde een vuurwapen waarmee automatisch vuur of lange-
      afstandsprecisievuur kan worden afgegeven, ter hand nemen:

      a. in gevallen waarin het gebruik van een vuurwapen is toegestaan, of

      b. in verband met zijn veiligheid of die van anderen, indien redelijkerwijs mag worden aangenomen dat een situatie
      ontstaat, waarin hij bevoegd is een vuurwapen te gebruiken.

      2 Indien een situatie als bedoeld in het eerste lid, onderdeel b, zich niet of niet meer voordoet, bergt de
      ambtenaar terstond het vuurwapen op.
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel10
  - number: 10a
    text: |-
      1 De ambtenaar waarschuwt onmiddellijk voordat hij gericht met een vuurwapen, niet zijnde een vuurwapen waarmee
      lange afstandsprecisievuur kan worden afgegeven, zal schieten, met luide stem of op andere niet mis te verstane
      wijze dat geschoten zal worden, indien niet onverwijld het gegeven bevel wordt opgevolgd. Deze waarschuwing, die
      zo nodig vervangen kan worden door een waarschuwingsschot, blijft slechts achterwege, wanneer de omstandigheden de
      waarschuwing niet toelaten.

      2 Een waarschuwingsschot moet op zodanige wijze worden gegeven, dat gevaar voor personen of zaken zoveel mogelijk
      wordt vermeden.
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel10a
  - number: '11'
    text: |-
      De [artikelen 7 tot en met 10a][ref1] zijn niet van toepassing op het gebruik en het ter hand nemen van een
      vuurwapen dat is geladen met niet-penetrerende munitie.


      [ref1]: https://wetten.overheid.nl/BWBR0006589#Artikel7
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel11
    references:
