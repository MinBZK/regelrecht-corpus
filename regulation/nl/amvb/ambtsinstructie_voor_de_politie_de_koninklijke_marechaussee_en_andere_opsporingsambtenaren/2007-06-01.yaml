  - number: '36'
    text: |-
      De ambtenaar zorgt ervoor dat bij de invrijheidstelling van een persoon die zichzelf niet kan verplaatsen, vervoer
      en begeleiding voor die persoon beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel36
  - number: 36a
    text: |-
      1 De ambtenaarvan een bijzondere opsporingsdienst handelt overeenkomstig de [artikelen 2][ref1], [4][ref2],
      [5][ref3], [7, eerste lid, aanhef en onder a en b, tweede, derde en vierde lid][ref4], [10][ref5],
      [10a][ref6], [12a][ref7], [12b][ref8], [12c][ref9], [15, eerste lid, aanhef en onder a, en tweede lid][ref10],
      [16][ref11],[17][ref12], [19][ref13], [20, eerste lid][ref14], [21][ref15], [22][ref16] en
      [23][ref17] van dit besluit. In [artikel 17, derde lid][ref18], wordt voor «de korpschef»
      gelezen: het hoofd van de bijzondere opsporingsdienst. In [artikel 20, eerste lid][ref19],
      wordt voor «[artikel 8, derde lid, van de Politiewet 1993][ref20]» gelezen:
      [artikel 6, derde lid, van de Wet op de bijzondere opsporingsdiensten][ref21]. In [artikel 21][ref22]
      wordt voor «[artikel 8, derde of vierde lid, van de Politiewet 1993][ref23]» gelezen:
      [artikel 6, derde lid, van de Wet op de bijzondere opsporingsdiensten][ref24].

      2 Voor de toepassing van het eerste lid wordt verstaan onder:

      a. bevoegd gezag: de officier van justitie;

      b. de meerdere: de ambtenaar van een bijzondere opsporingsdienst die uit hoofde van zijn functie met de leiding is
      belast of het bevel heeft over de taakuitvoering;

      c. geweldmiddel: de wapens en de uitrusting, waarmee geweld kan worden uitgeoefend, die krachtens
      [artikel 3a, derde lid, van de Wet wapens en munitie][ref25] zijn toegestaan.


