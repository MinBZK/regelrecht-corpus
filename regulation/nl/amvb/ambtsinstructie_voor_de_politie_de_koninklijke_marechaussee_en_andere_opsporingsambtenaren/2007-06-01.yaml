  - number: '38'
    text: |-
      De buitengewoon opsporingsambtenaar die bevoegd is tot het gebruik van een wapen of handboeien, maakt bij de
      uitoefening van zijn dienst uitsluitend gebruik van het door Onze Minister van Justitie voorgeschreven geweldmiddel
      of handboeien.
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel38
  - number: '39'
    text: |-
      De buitengewoon opsporingsambtenaar is niet eerder bevoegd tot de uitoefening van de in
      [artikel 8, eerste en derde lid, van de Politiewet 1993][ref1] bedoelde bevoegdheden dan nadat die bevoegdheid is
      aangetekend op de akte van beëdiging en is gebleken van zijn bekwaamheid in de uitoefening daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel8
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '8'
  - number: 39a
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties zendt in overeenstemming met Onze Minister van Justitie
      binnen drie jaar na de inwerkingtreding van het besluit van 25 augustus 2006 tot wijziging van de Ambtsinstructie
      voor de politie, de Koninklijke marechaussee en de buitengewoon opsporingsambtenaar in verband met de invoering
      van niet-penetrerende munitie (Stb. 2006, 407) aan de Staten-Generaal een verslag over de doeltreffendheid en de
      effecten van de [artikelen 11 tot en met 11c][ref1] in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0006589#Artikel11
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0006589
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: 2a
  - number: 39b
    text: |-
      Dit besluit berust op [artikel 8, zevende lid][ref1], en [artikel 9 van de Politiewet 1993][ref2] en
      [artikel 6, vijfde lid, van de Wet op de bijzondere opsporingsdiensten][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0019919#Artikel6
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel39b
