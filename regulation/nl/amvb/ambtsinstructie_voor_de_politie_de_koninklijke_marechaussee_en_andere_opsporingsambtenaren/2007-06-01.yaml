  - number: '7'
    text: |-
      1 Het gebruik van een vuurwapen, niet zijnde een vuurwapen waarmee automatisch vuur of lange afstandsprecisievuur
      kan worden afgegeven, is slechts geoorloofd:

      a. om een persoon aan te houden ten aanzien van wie redelijkerwijs mag worden aangenomen dat hij een voor
      onmiddellijk gebruik gereed zijnd vuurwapen bij zich heeft en dit tegen personen zal gebruiken;

      b. om een persoon aan te houden die zich aan zijn aanhouding, voorgeleiding of andere rechtmatige vrijheidsbeneming
      tracht te onttrekken of heeft onttrokken, en die wordt verdacht van of is veroordeeld wegens het plegen van een
      misdrijf

      1°. waarop naar de wettelijke omschrijving een gevangenisstraf van vier jaren of meer is gesteld, en

      2°. dat een ernstige aantasting vormt van de lichamelijke integriteit of de persoonlijke levenssfeer, of

      3°. dat door zijn gevolg bedreigend voor de samenleving is of kan zijn.

      c. tot het beteugelen van oproerige bewegingen of andere ernstige wanordelijkheden, indien er sprake is van een
      opdracht van het bevoegd gezag en een optreden in gesloten verband onder leiding van een meerdere;

      d. tot het beteugelen van militaire oproerige bewegingen, andere ernstige militaire wanordelijkheden of muiterij
      indien de militair van de Koninklijke marechaussee in opdracht van de minister van Defensie dan wel de officier van
      justitie te Arnhem belast met militaire zaken in gesloten verband onder leiding van een meerdere optreedt.

      2 Het gebruik van het vuurwapen in de gevallen, bedoeld in het eerste lid, onder *a* en *b*, is slechts geoorloofd
      tegen personen en vervoermiddelen waarin of waarop zich personen bevinden.

      3 In de gevallen, bedoeld in het eerste lid, onder *a* en *b*, wordt van het vuurwapen geen gebruik gemaakt, indien
      de identiteit van de aan te houden persoon bekend is en redelijkerwijs mag worden aangenomen dat het uitstel van de
      aanhouding geen onaanvaardbaar te achten gevaar voor de rechtsorde met zich brengt.

      4 Onder het plegen van een misdrijf, bedoeld in het eerste lid, onder *b*, worden mede begrepen de poging en de
      deelnemingsvormen, bedoeld in de [artikelen 47][ref1] en [48 van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel48
    url: https://wetten.overheid.nl/BWBR0006589/2007-06-01#Artikel7
