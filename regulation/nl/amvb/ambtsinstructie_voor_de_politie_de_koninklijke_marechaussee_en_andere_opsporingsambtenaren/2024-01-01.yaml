  - number: '7'
    text: |-
      1 Het gebruik van een vuurwapen, niet zijnde het gebruik, bedoeld in de [artikelen 8][ref1] en [9][ref2], is
      slechts geoorloofd:

      a. om een persoon aan te houden ten aanzien van wie redelijkerwijs mag worden aangenomen dat deze:

      1°. een voor onmiddellijk gebruik gereed zijnd vuurwapen bij zich heeft en dat tegen personen zal gebruiken, of

      2°. aanstonds ander levensbedreigend geweld tegen personen zal gebruiken;

      b. om een persoon aan te houden die zich aan zijn aanhouding, voorgeleiding of andere rechtmatige vrijheidsbeneming
      tracht te onttrekken of heeft onttrokken, en die wordt verdacht van of is veroordeeld wegens het plegen van een
      misdrijf waarop naar de wettelijke omschrijving een gevangenisstraf van vier jaren of meer is gesteld en:

      1°. dat een ernstige aantasting vormt van de lichamelijke integriteit,

      2°. betrekking heeft op het zich wederrechtelijk bevinden in een woning of op het daarbij behorende besloten erf
      met gebruik van geweld of bedreiging met geweld tegen personen, of

      3°. dat door zijn gevolg bedreigend voor de samenleving is of kan zijn.

      c. tot het beteugelen van oproerige bewegingen of andere ernstige wanordelijkheden, indien er sprake is van een
      opdracht van het bevoegd gezag en een optreden in gesloten verband onder leiding van een meerdere;

      d. tot het beteugelen van militaire oproerige bewegingen, andere ernstige militaire wanordelijkheden of muiterij
      indien de militair van de Koninklijke marechaussee in opdracht van Onze Minister van Defensie dan wel de officier
      van justitie te Arnhem belast met militaire zaken in gesloten verband onder leiding van een meerdere optreedt;

      e. om een ernstig gewond dier te doden;

      f. om direct gevaar voor het leven van personen of voor het ontstaan van zwaar lichamelijk letsel af te wenden.

      2 In de gevallen, bedoeld in het eerste lid, onder a en b, wordt van het vuurwapen geen gebruik gemaakt indien de
      identiteit van de aan te houden persoon bekend is en redelijkerwijs mag worden aangenomen dat het uitstel van de
      aanhouding geen onaanvaardbaar te achten gevaar voor de rechtsorde met zich brengt.

      3 Onder het plegen van een misdrijf, bedoeld in het eerste lid, onder b, worden mede begrepen de poging en de
      deelnemingsvormen, bedoeld in de [artikelen 47][ref3] en [48 van het Wetboek van Strafrecht][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006589#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006589#Artikel9
