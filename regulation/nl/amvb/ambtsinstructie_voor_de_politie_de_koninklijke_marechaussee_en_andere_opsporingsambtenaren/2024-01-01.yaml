  - number: '23'
    text: |-
      De ambtenaar die gebruik heeft gemaakt van een vrijheidsbeperkend middel als bedoeld in [artikel 22][ref1],
      [artikel 22a][ref2] of [artikel 22b][ref3], meldt dit onverwijld schriftelijk aan de hulpofficier van justitie,
      onder vermelding van de redenen die tot het gebruik van het middel hebben geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0006589#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0006589#Artikel22a
      [ref3]: https://wetten.overheid.nl/BWBR0006589#Artikel22b
