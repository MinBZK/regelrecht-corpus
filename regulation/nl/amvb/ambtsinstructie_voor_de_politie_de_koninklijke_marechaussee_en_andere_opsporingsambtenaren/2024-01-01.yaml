        artikel: '26'
  - number: '15'
    text: |-
      1 Het inzetten van een surveillancehond als geweldmiddel is slechts geoorloofd onder het direct en voortdurend
      toezicht van een geleider bij:

      a. de surveillancedienst, en

      b. het optreden van een mobiele eenheid als bedoeld in [artikel 26 van het Besluit beheer politie][ref1] na
      toestemming van het bevoegd gezag;

      c. het bewaken en beveiligen van personen, objecten en diensten.

      2 Het inzetten van een AOT-hond is slechts geoorloofd onder het direct en voortdurend toezicht van een
      geleider bij het, na toestemming van het bevoegd gezag, optreden van een aanhoudings- en ondersteuningsteam als
      bedoeld in [artikel 12, onder a, van het Besluit beheer politie][ref2] of een bijstandseenheid als bedoeld in
      [artikel 59 van de Politiewet 2012][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0036705#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0036705#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel59
