  - number: 15a
    text: |-
      1 Het inzetten van een surveillancehond of AOT-hond als geweldmiddel is slechts geoorloofd:

      a. om een persoon aan te houden ten aanzien van wie redelijkerwijs mag worden aangenomen dat hij een voor
      onmiddellijk gebruik gereed zijnd vuurwapen bij zich heeft en dat tegen personen zal gebruiken dan wel aanstonds
      ander geweld tegen personen zal gebruiken;

      b. om een persoon aan te houden die zich aan zijn aanhouding, voorgeleiding of andere rechtmatige vrijheidsbeneming
      tracht te onttrekken of heeft onttrokken, en die wordt verdacht van of is veroordeeld wegens het plegen van een
      misdrijf waarop naar de wettelijke omschrijving een gevangenisstraf van vier jaren of meer is gesteld;

      c. om direct gevaar voor het leven van personen of voor het ontstaan van zwaar lichamelijk letsel af te wenden.

      2 De inzet van de surveillancehond of AOT-hond als geweldmiddel is voorts geoorloofd ter verspreiding van
      samenscholingen of volksmenigten die een ernstige en onmiddellijke bedreiging vormen voor de veiligheid van
      personen of voor zaken. Deze inzet geschiedt aangelijnd.

      3 Onder het plegen van een misdrijf, bedoeld in het eerste lid, onder b, worden mede begrepen de poging en de
      deelnemingsvormen, bedoeld in de [artikelen 47][ref1] en [48 van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel48
