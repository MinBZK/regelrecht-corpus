  - number: 18a
    text: |-
      1 De geweldsregistratie wordt zo spoedig mogelijk behandeld door de functionaris die op grond van
      [artikel 17, vierde lid][ref1], van de geweldsregistratie heeft kennisgenomen.

      2 De functionaris beoordeelt of de ambtenaar, alsmede, indien van toepassing, de
      meerdere die de last tot het aanwenden van geweld heeft gegeven, heeft gehandeld volgens
      [artikel 7, eerste en zevende lid, van de Politiewet 2012][ref2] en dit besluit.

      3 De functionaris licht de ambtenaar, alsmede, indien van toepassing, de meerdere die de last tot het aanwenden van
      geweld heeft gegeven, in over de voortgang van de behandeling van de geweldsregistratie.

      4 De functionaris geeft de ambtenaar die geweld heeft aangewend, alsmede, indien van toepassing, de meerdere die
      de last tot het aanwenden van geweld heeft gegeven, schriftelijk en gemotiveerd kennis van zijn oordeel over de
      geweldsaanwending.


      [ref1]: https://wetten.overheid.nl/BWBR0006589#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel7
