  - number: '18'
    text: |-
      1 Van de geweldsregistratie wordt in de gevallen, bedoeld in het tweede lid:

      a. door Onze Minister kennis gegeven aan het College van procureurs-generaal indien het geweld is aangewend door de
      korpschef of een krachtens [artikel 28, derde lid, van de Politiewet 2012][ref1] aangewezen lid van de leiding van
      de politie;

      b. door de korpschef kennis gegeven aan de officier van justitie in het arrondissement waarbinnen het geweld
      is aangewend, indien het geweld is aangewend door een andere ambtenaar van politie die is aangesteld voor de
      uitvoering van de politietaak;

      c. door de commandant van de Koninklijke marechaussee kennis gegeven aan de officier van justitie te Arnhem
      belast met militaire zaken indien het geweld is aangewend door een militair bij de uitvoering van zijn in de
      [Politiewet 2012][ref2] omschreven taak;

      d. door de directeur van de rijksrecherche kennis gegeven aan de hoofdofficier van justitie in het arrondissement
      waarbinnen het geweld is aangewend, indien het geweld is aangewend door een ambtenaar van de rijksrecherche die is
      aangesteld voor de uitvoering van de politietaak.

      2 De kennisgeving geschiedt:

      a. terstond, indien:

      1°. het aanwenden van geweld de dood dan wel zwaar lichamelijk letsel heeft veroorzaakt of er ernstig rekening mee
      moet worden gehouden dat het aanwenden van geweld zwaar lichamelijk letsel heeft veroorzaakt;

      2°. gebruik is gemaakt van een vuurwapen met enig lichamelijk letsel tot gevolg;

      b. zo spoedig mogelijk, indien het aanwenden van geweld naar het oordeel van Onze Minister, de korpschef, de
      commandant van de Koninklijke marechaussee onderscheidenlijk de directeur van de rijksrecherche daartoe aanleiding
      geeft.

      3 De functionaris die op grond van [artikel 17, vierde lid][ref3], van de geweldsregistratie heeft kennisgenomen,
      licht de ambtenaar, alsmede, indien van toepassing, de meerdere die de last tot het aanwenden van geweld heeft
      gegeven, in over de kennisgeving, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0031788
      [ref3]: https://wetten.overheid.nl/BWBR0006589#Artikel17
