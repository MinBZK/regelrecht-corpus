        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '6'
    text: |-
      1 De korpschef of de daartoe door hem aangewezen ambtenaar van politie zet een mobiele eenheid als bedoeld
      in [artikel 26 van het Besluit beheer politie][ref1] of een aanhoudings- en ondersteuningsteam als bedoeld in
      [artikel 12, onder a, van het Besluit beheer politie][ref2] slechts in na toestemming van het bevoegd gezag.

      2 De door het bevoegd gezag aangewezen ambtenaar zet de Koninklijke marechaussee of andere onderdelen van de
      krijgsmacht, bedoeld in de [artikelen 57][ref3], [58][ref4] en [62 van de Politiewet 2012][ref5] slechts in na
      toestemming van het bevoegd gezag.


