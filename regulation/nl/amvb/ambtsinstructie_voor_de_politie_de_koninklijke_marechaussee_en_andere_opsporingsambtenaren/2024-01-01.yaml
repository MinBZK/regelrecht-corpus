  - number: '17'
    text: |-
      1 De ambtenaar die geweld heeft aangewend, meldt schriftelijk de aard, waaronder het gebruikte geweldmiddel, en de
      gevolgen daarvan en mondeling de feiten en omstandigheden, waaronder de redenen die tot het aanwenden van geweld
      hebben geleid, zo spoedig mogelijk aan de hulpofficier van justitie die krachtens aanwijzing is belast met de
      registratie van aangewend geweld.

      2 Indien de ambtenaar die geweld heeft aangewend, onder leiding van een ter plaatse aanwezige meerdere heeft
      opgetreden en geweld heeft aangewend na diens uitdrukkelijke last, geschiedt de melding, bedoeld in het eerste lid,
      door deze meerdere. De ambtenaar verstrekt de hulpofficier van justitie, bedoeld in het eerste lid, desgevraagd de
      nodige inlichtingen.

      3 De melding wordt door de hulpofficier van justitie, bedoeld in het eerste lid, zo spoedig mogelijk geregistreerd
      op een daartoe door Onze Minister vastgestelde wijze, indien:

      a. het aanwenden van geweld de dood dan wel lichamelijk letsel van meer dan geringe betekenis heeft veroorzaakt;

      b. gebruik is gemaakt van een vuurwapen, of

      c. het aanwenden van geweld naar het oordeel van de hulpofficier van justitie daartoe aanleiding geeft.

      4 Van de geweldsregistratie wordt terstond kennis gegeven aan:

      a. Onze Minister, indien het geweld is aangewend door de korpschef of een krachtens
      [artikel 28, derde lid, van de Politiewet 2012][ref1] aangewezen lid van de leiding van de politie;

      b. de korpschef, indien het geweld is aangewend door een andere ambtenaar van politie als bedoeld in
      [artikel 2, onder a of c, van de Politiewet 2012][ref2], die is aangesteld voor de uitvoering van de politietaak;

      c. de commandant van de Koninklijke marechaussee, indien het geweld is aangewend door een militair bij de
      uitvoering van diens in de [Politiewet 2012][ref3] omschreven taak;

      d. de directeur van de rijksrecherche, indien het geweld is aangewend door een ambtenaar van de rijksrecherche die
      is aangesteld voor de uitvoering van de politietaak.

      5 De hulpofficier van justitie geeft de ambtenaar die geweld heeft aangewend, alsmede, indien van toepassing,
      de meerdere die de last tot het aanwenden van geweld heeft gegeven zo spoedig mogelijk kennis van de
      geweldsregistratie.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0031788
    url: https://wetten.overheid.nl/BWBR0006589/2024-01-01#Artikel17
