  - number: '8'
    text: |-
      Het gebruik van automatisch vuur mag alleen plaatsvinden door een ambtenaar die behoort tot een aanhoudings-en
      ondersteuningsteam of tot een bijstandseenheid als bedoeld in [artikel 59 van de Politiewet 2012][ref1] dan wel
      belast is met de bewaking en beveiliging van personen en objecten en is slechts geoorloofd om direct gevaar voor
      het leven van personen of voor het ontstaan van zwaar lichamelijk letsel af te wenden.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel59
    url: https://wetten.overheid.nl/BWBR0006589/2024-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '59'
  - number: '9'
    text: |-
      Het gebruik van een vuurwapen waarmee lange afstandsprecisievuur kan worden afgegeven, mag alleen plaatsvinden
      onder bevel van de commandant van een bijstandseenheid als bedoeld in [artikel 59 van de Politiewet 2012][ref1]
      en is slechts geoorloofd om direct gevaar voor het leven van personen of voor het ontstaan van zwaar lichamelijk
      letsel af te wenden.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel59
    url: https://wetten.overheid.nl/BWBR0006589/2024-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '59'
  - number: '10'
    text: |-
      1 De ambtenaar mag slechts een vuurwapen, niet zijnde een vuurwapen waarmee automatisch vuur of lange-
      afstandsprecisievuur kan worden afgegeven, ter hand nemen:

      a. in gevallen waarin het gebruik van een vuurwapen is toegestaan, of

      b. in verband met zijn veiligheid of die van anderen, indien redelijkerwijs mag worden aangenomen dat een situatie
      ontstaat, waarin hij bevoegd is een vuurwapen te gebruiken.

      2 Indien een situatie als bedoeld in het eerste lid, onderdeel b, zich niet of niet meer voordoet, bergt de
      ambtenaar terstond het vuurwapen op.
    url: https://wetten.overheid.nl/BWBR0006589/2024-01-01#Artikel10
  - number: 10a
    text: |-
      1 De ambtenaar waarschuwt onmiddellijk voordat hij gericht met een vuurwapen, niet zijnde een vuurwapen waarmee
      lange afstandsprecisievuur kan worden afgegeven, zal schieten, met luide stem of op andere niet mis te verstane
      wijze dat geschoten zal worden, indien niet onverwijld het gegeven bevel wordt opgevolgd. Deze waarschuwing, die
      zo nodig vervangen kan worden door een waarschuwingsschot, blijft slechts achterwege, wanneer de omstandigheden de
      waarschuwing niet toelaten.

      2 Een waarschuwingsschot moet op zodanige wijze worden gegeven, dat gevaar voor personen of zaken zoveel mogelijk
      wordt vermeden.
    url: https://wetten.overheid.nl/BWBR0006589/2024-01-01#Artikel10a
  - number: '11'
    text: |-
      De [artikelen 7 tot en met 10a][ref1] zijn niet van toepassing op het gebruik en het ter hand nemen van een wapen
      dat is geladen met niet-penetrerende projectielen.


      [ref1]: https://wetten.overheid.nl/BWBR0006589#Artikel7
    url: https://wetten.overheid.nl/BWBR0006589/2024-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006589
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 11a
    text: |-
      1 Het gebruik van een wapen dat is geladen met niet-penetrerende projectielen is slechts geoorloofd:

      a. om een persoon aan te houden ten aanzien van wie redelijkerwijs mag worden aangenomen dat hij een voor
      onmiddellijk gebruik gereed zijnd wapen bij zich heeft en dit tegen personen zal gebruiken of aanstonds ander
      geweld tegen personen zal gebruiken;

      b. om een persoon aan te houden die zich aan zijn aanhouding, voorgeleiding of andere rechtmatige vrijheidsbeneming
      tracht te onttrekken of heeft onttrokken;

      c. om een persoon die de openbare orde in ernstige mate verstoort en niet direct kan worden aangehouden, tijdelijk
      weerloos te maken of te markeren, ten einde hem later aan te houden;

      d. ter verspreiding van samenscholingen of volksmenigten, die een ernstige en onmiddellijke bedreiging vormen voor
      de veiligheid van personen of zaken;

      e. ter verdediging tegen of voor het onder controle brengen van agressieve dieren;

      f. om direct gevaar voor het leven van personen of voor het ontstaan van zwaar lichamelijk letsel af te wenden.

      2 Het gebruik, bedoeld in het eerste lid, onder c en d, is slechts geoorloofd in opdracht van de meerdere na vooraf
      verkregen toestemming van het bevoegd gezag.

      3 Niet-penetrerende projectielen die bestemd zijn voor het gebruik, bedoeld in het eerste lid, onder c, worden niet
      gebruikt voor situaties, bedoeld in het eerste lid, onder d.
    url: https://wetten.overheid.nl/BWBR0006589/2024-01-01#Artikel11a
  - number: 11b
    text: |-
      De ambtenaar waarschuwt onmiddellijk voordat hij gericht een wapen dat is geladen met niet-penetrerende
      projectielen zal gebruiken, met luide stem of op andere niet mis te verstane wijze dat geschoten zal worden,
      indien niet onverwijld het gegeven bevel wordt opgevolgd. Deze waarschuwing blijft slechts achterwege, wanneer de
      omstandigheden de waarschuwing niet toelaten.
    url: https://wetten.overheid.nl/BWBR0006589/2024-01-01#Artikel11b
  - number: 12a
    text: |-
      Het gebruik van pepperspray is slechts geoorloofd:

      a. om een persoon aan te houden ten aanzien van wie redelijkerwijs mag worden aangenomen dat hij een voor
      onmiddellijk gebruik gereed zijnd wapen bij zich heeft en dit tegen een persoon zal gebruiken of aanstonds ander
      geweld tegen personen zal gebruiken;

      b. om een persoon aan te houden die zich aan aanhouding, voorgeleiding of andere rechtmatige vrijheidsbeneming
      tracht te onttrekken of heeft onttrokken;

      c. ter verdediging tegen of voor het onder controle brengen van agressieve dieren;

      d. om direct gevaar voor het leven van personen of voor het ontstaan van zwaar lichamelijk letsel af te wenden.
    url: https://wetten.overheid.nl/BWBR0006589/2024-01-01#Artikel12a
  - number: 12b
    text: |-
      De ambtenaar waarschuwt onmiddellijk voordat hij gericht pepperspray tegen een persoon zal gebruiken, met luide
      stem of op andere niet mis te verstane wijze dat pepperspray gebruikt zal worden, indien niet onverwijld het
      gegeven bevel wordt opgevolgd. Deze waarschuwing blijft achterwege indien de omstandigheden de waarschuwing
      redelijkerwijs niet toelaten.
    url: https://wetten.overheid.nl/BWBR0006589/2024-01-01#Artikel12b
  - number: 12c
    text: |-
      1 Het gebruik van een stroomstootwapen in de schietmodus is slechts geoorloofd:

      a. om een persoon aan te houden ten aanzien van wie redelijkerwijs mag worden aangenomen dat hij een voor
      onmiddellijk gebruik gereed zijnd wapen bij zich heeft en dit tegen een persoon zal gebruiken of aanstonds ander
      geweld tegen personen zal gebruiken;

      b. om een persoon aan te houden die zich aan aanhouding, voorgeleiding of andere rechtmatige vrijheidsbeneming
      tracht te onttrekken of heeft onttrokken;

      c. ter verdediging tegen of voor het onder controle brengen van agressieve dieren;

      d. om direct gevaar voor het leven van personen of voor het ontstaan van zwaar lichamelijk letsel af te wenden.

      2 Het gebruik van een stroomstootwapen in de schokmodus is slechts geoorloofd:

      a. ter verdediging tegen of voor het onder controle brengen van agressieve dieren;

      b. om direct gevaar voor het leven van personen of voor het ontstaan van zwaar lichamelijk letsel af te wenden.
    url: https://wetten.overheid.nl/BWBR0006589/2024-01-01#Artikel12c
  - number: 12d
    text: |-
      De ambtenaar waarschuwt onmiddellijk voordat hij een stroomstootwapen tegen een persoon zal gebruiken, met luide
      stem of op andere niet mis te verstane wijze dat een stroomstootwapen gebruikt zal worden, indien niet onverwijld
      het gegeven bevel wordt opgevolgd. Deze waarschuwing blijft achterwege indien de omstandigheden de waarschuwing
      redelijkerwijs niet toelaten.
    url: https://wetten.overheid.nl/BWBR0006589/2024-01-01#Artikel12d
  - number: 12e
    text: |-
      Het gebruik van de wapenstok is slechts geoorloofd:

      a. om een persoon aan te houden ten aanzien van wie redelijkerwijs mag worden aangenomen dat hij een voor
      onmiddellijk gebruik gereed zijnd wapen bij zich heeft en dit tegen een persoon zal gebruiken of aanstonds ander
      geweld tegen personen zal gebruiken;

      b. om een persoon aan te houden die zich aan aanhouding, voorgeleiding of andere rechtmatige vrijheidsbeneming
      tracht te onttrekken of heeft onttrokken;

      c. om een persoon op afstand te houden die een ambtenaar in diens taakuitoefening belemmert of die geen gehoor
      geeft aan een bevoegd gegeven bevel of vordering;

      d. ter verspreiding van samenscholingen of volksmenigten die een onmiddellijke bedreiging vormen voor de openbare
      orde;

      e. om direct gevaar voor het leven van personen of voor het ontstaan van zwaar lichamelijk letsel af te wenden.
    url: https://wetten.overheid.nl/BWBR0006589/2024-01-01#Artikel12e
  - number: 12f
    text: |-
      De ambtenaar of de meerdere onder wiens bevel de ambtenaar optreedt, waarschuwt onmiddellijk voordat hij een
      wapenstok tegen een persoon zal gebruiken, met luide stem of op andere niet mis te verstane wijze dat een wapenstok
      gebruikt zal worden, indien niet onverwijld het gegeven bevel wordt opgevolgd. Deze waarschuwing blijft achterwege
      indien de omstandigheden de waarschuwing redelijkerwijs niet toelaten.
    url: https://wetten.overheid.nl/BWBR0006589/2024-01-01#Artikel12f
  - number: '13'
    text: |-
      1 Het gebruik van traangas is slechts geoorloofd:

      a. in gesloten ruimten ter aanhouding van een persoon indien redelijkerwijs mag worden aangenomen dat die persoon
      een voor onmiddellijk gebruik gereed zijnd vuurwapen bij zich heeft en dat tegen personen zal gebruiken dan wel
      ander levensbedreigend geweld tegen personen zal gebruiken;

      b. anders dan in gesloten ruimten ter verspreiding van samenscholingen of volksmenigten die een ernstige en
      onmiddellijke bedreiging vormen voor de veiligheid van personen of voor zaken.

      2 Het gebruik van traangas is slechts geoorloofd in opdracht van de meerdere na vooraf verkregen toestemming van
      het bevoegd gezag.

      3 De meerdere die bevel geeft tot het verspreiden van traangas geeft bij dit bevel aan hoeveel traangasgranaten
      worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0006589/2024-01-01#Artikel13
  - number: '14'
    text: |-
      Het gebruik van een waterwerper is slechts geoorloofd bij optreden van een mobiele eenheid als bedoeld in
      [artikel 26 van het Besluit beheer politie][ref1] in opdracht van de meerdere en na verkregen toestemming van het
      bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0036705#Artikel26
