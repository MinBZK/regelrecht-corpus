  - number: '36'
    text: |-
      De ambtenaar zorgt ervoor dat bij de invrijheidstelling van een persoon die zichzelf niet kan verplaatsen, vervoer
      en begeleiding voor die persoon beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0006589/2024-01-01#Artikel36
  - number: 36a
    text: |-
      1 Op de ambtenaar van een bijzondere opsporingsdienst zijn de [artikelen 1, derde tot en met zesde lid][ref1],
      [2][ref2], [4][ref3], [5][ref4], [7, eerste lid, aanhef en onder a, b, e en f, tweede en derde lid][ref5],
      [10][ref6], [10a][ref7], [12a][ref8], [12b][ref9], [12e][ref10], [12f][ref11],
      [17, eerste tot en met derde lid, vierde lid, onder b, en vijfde lid][ref12],
      [18, eerste lid, aanhef en onder b, tweede lid][ref13], [18a][ref14], [19 tot en met 22a][ref15] en [23][ref16] van
      dit besluit van toepassing.

      2 Voor de toepassing van:

      a. [artikel 1, derde lid][ref17], wordt voor «meerdere» gelezen: de ambtenaar van een bijzondere opsporingsdienst
      die uit hoofde van zijn functie met de leiding is belast of het bevel heeft over de taakuitvoering;

      b. [artikel 1, vierde lid, onder a][ref18], wordt voor «bevoegd gezag» gelezen: de officier van justitie;

      c. [artikel 1, vierde lid, onder d][ref19], wordt voor «geweldmiddel» gelezen: de wapens
      en de uitrusting waarmee geweld kan worden uitgeoefend, ten aanzien waarvan krachtens
      [artikel 3a, derde lid, van de Wet wapens en munitie][ref20] is bepaald dat de in dat lid genoemde artikelen niet
      van toepassing zijn op ambtenaren van bijzondere opsporingsdiensten;

      d. de [artikelen 17, vierde lid, onder b][ref21], en [18, eerste lid, aanhef en onder b][ref22], wordt voor «de
      korpschef» telkens gelezen «het hoofd van de bijzondere opsporingsdienst» en voor «een andere ambtenaar van politie
      als bedoeld in [artikel 2, onder a of c, van de Politiewet 2012][ref23], die is aangesteld voor de uitvoering van
      de politietaak» telkens gelezen: de ambtenaar van een bijzondere opsporingsdienst;

      e. [artikel 18, tweede lid, aanhef en onder b][ref24], wordt voor «de korpschef» gelezen: het hoofd van de
      bijzondere opsporingsdienst;

      f. [artikel 18a, tweede lid][ref25], wordt voor «[artikel 7, eerste en zevende lid, van de Politiewet 2012][ref26]»
      gelezen: [artikel 6, eerste, tweede en vierde lid, van de Wet op de bijzondere opsporingsdiensten][ref27];

      g. [artikel 20][ref28] wordt voor «[artikel 7, derde en vierde lid, van de Politiewet 2012][ref29]» gelezen:
      [artikel 6, derde lid, van de Wet op de bijzondere opsporingsdiensten][ref30];

      h. [artikel 21][ref31] wordt voor «onderzoek aan kleding of voorwerpen» gelezen «onderzoek
      aan kleding» en wordt voor «[artikel 7, derde lid, van de Politiewet 2012][ref32]» gelezen:
      [artikel 6, derde lid, van de Wet op de bijzondere opsporingsdiensten][ref33].


