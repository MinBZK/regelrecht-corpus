  - number: '22'
    text: |-
      Ten behoeve van het vervoer of een verplaatsing kan de ambtenaar een persoon die rechtens van zijn vrijheid is
      beroofd, handboeien aanleggen indien op grond van de feiten of omstandigheden redelijkerwijs gevaar valt te vrezen
      voor:

      a. ontvluchting, of

      b. de veiligheid van de persoon die rechtens van zijn vrijheid is beroofd, van de ambtenaar of van derden.
    url: https://wetten.overheid.nl/BWBR0006589/2024-01-01#Artikel22
  - number: 22a
    text: |-
      1 De ambtenaar kan bij een persoon die rechtens van zijn vrijheid is beroofd, ten behoeve van het vervoer of een
      verplaatsing mondafscherming aanbrengen.

      2 De maatregel, bedoeld in het eerste lid, wordt slechts getroffen indien de feiten of omstandigheden dit
      redelijkerwijs vereisen met het oog op de veiligheid van de ambtenaar of van derden.
    url: https://wetten.overheid.nl/BWBR0006589/2024-01-01#Artikel22a
  - number: 22b
    text: |-
      De [artikelen 22, aanhef en onder b][ref1], en [22a][ref2] zijn van overeenkomstige toepassing op een persoon die
      ten behoeve van de hulpverlening aan hem op het politie- of brigadebureau wordt of is ondergebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006589#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0006589#Artikel22a
