    text: |-
      1 Het onderzoek aan de kleding, bedoeld in [artikel 7, derde lid, van de Politiewet 2012][ref1], en het onderzoek
      aan de kleding van een te vervoeren persoon, bedoeld in het vierde lid van dat artikel, geschiedt door het
      oppervlakkig aftasten van de kleding en wordt zo veel mogelijk uitgevoerd door een ambtenaar van hetzelfde geslacht
      als degene die aan het onderzoek wordt onderworpen.

      2 Als de ambtenaar bij het onderzoek, bedoeld in [artikel 7, derde lid, van de Politiewet 2012][ref2], of bij
      het onderzoek, bedoeld in het vierde lid van dat artikel, ten behoeve van het vervoer van een persoon, voorwerpen
      aantreft die een gevaar kunnen vormen voor de veiligheid van de betrokkene of voor anderen, neemt hij die
      voorwerpen in bewaring.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel7
