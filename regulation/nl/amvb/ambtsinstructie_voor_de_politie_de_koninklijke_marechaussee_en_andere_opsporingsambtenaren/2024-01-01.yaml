        artikel: 23a
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 23c
    text: |-
      1 Ten behoeve van een aanhouding en het vervoer kan de ambtenaar die behoort tot een aanhoudings- en
      ondersteuningsteam of tot een bijstandseenheid als bedoeld in [artikel 59 van de Politiewet 2012][ref1] een persoon
      die rechtens van zijn vrijheid is beroofd en aan wie op grond van [artikel 22][ref2] handboeien zijn aangelegd,
      blinddoeken indien op grond van de feiten of omstandigheden redelijkerwijs gevaar valt te vrezen voor:

      a. ontvluchting, of

      b. de veiligheid van de persoon die rechtens van zijn vrijheid is beroofd, van de ambtenaar of van derden.

      2 Indien op grond van de feiten of omstandigheden van het geval redelijkerwijs gevaar voor ontvluchting van de
      persoon die rechtens van zijn vrijheid is beroofd of gevaar voor de veiligheid van de persoon, van de ambtenaar of
      van derden, valt te vrezen, kan de ambtenaar, bedoeld in het eerste lid, een andere dan de aan te houden persoon
      handboeien aanleggen.

      3 [Artikel 23][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0006589#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0006589#Artikel23
