        artikel: '34'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: 35a
    text: |-
      1 De ambtenaar kan de ingeslotene, na toestemming van de hulpofficier van justitie, voor een periode van ten
      hoogste vierentwintig uren in diens cel of ten behoeve van het vervoer of verplaatsing met hulpmiddelen jegens
      ingeslotenen als bedoeld in [artikel 2, vijfde lid, van het Besluit bewapening en uitrusting politie][ref1], in
      diens bewegingsvrijheid beperken.

      2 Indien onverwijlde tenuitvoerlegging van de maatregel, bedoeld in het eerste lid, geboden is, kan een ambtenaar,
      vooruitlopend op toestemming van de hulpofficier van justitie, hiertoe beslissen en deze voor een periode van ten
      hoogste drie uren tenuitvoerleggen. De ambtenaar stelt de hulpofficier van justitie hiervan onverwijld in kennis,
      waarna deze onverwijld beslist over de voortzetting van de maatregel.

      3 De ambtenaar stelt de arts onverwijld op de hoogte van de toepassing van de maatregel, bedoeld in het eerste of
      tweede lid. De [artikelen 33][ref2] en [34][ref3] zijn van overeenkomstige toepassing.

      4 De ingeslotene waarop een maatregel, als bedoeld in het eerste of tweede lid, in diens cel wordt toegepast,
      wordt afgezonderd en aan permanente camera-observatie onderworpen. Tijdens het vervoer of verplaatsing wordt
      de ingeslotene afgezonderd en aan permanente camera-observatie onderworpen of permanent geobserveerd door de
      ambtenaar. [Artikel 31, derde lid][ref4], is van overeenkomstige toepassing.

      5 De maatregelen, bedoeld in het eerste en tweede lid, kunnen slechts worden getroffen, indien de feiten of
      omstandigheden dit redelijkerwijs vereisen met het oog op gevaar voor een ernstige verstoring van de orde en
      veiligheid in de cel of het cellencomplex, of met het oog op de veiligheid van de ingeslotene, van de ambtenaar of
      van derden.

      6 De ambtenaar kan de termijn, bedoeld in het eerste lid, na toestemming van de hulpofficier van justitie telkens
      met ten hoogste vierentwintig uren verlengen. De beslissing tot verlenging wordt genomen na overleg met de arts.


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel2
