  - number: 36b
    text: |-
      De ambtenaar van een bijzondere opsporingsdienst maakt bij de uitoefening van zijn dienst uitsluitend gebruik van
      het door Onze Minister voorgeschreven geweldmiddel of handboeien.
    url: https://wetten.overheid.nl/BWBR0006589/2024-01-01#Artikel36b
  - number: '37'
    text: |-
      1 Indien Onze Minister ingevolge [artikel 7, negende lid, van de Politiewet 2012][ref1] heeft bepaald dat
      een buitengewoon opsporingsambtenaar bevoegd is tot de uitoefening van bevoegdheden als bedoeld in het
      eerste, derde en vierde lid van dat artikel, zijn de [artikelen 1, derde, vierde en vijfde lid][ref2],
      [5][ref3], [17, eerste tot en met derde, vierde lid, onder b en vijfde lid][ref4],
      [18, eerste lid, aanhef en onder b, tweede lid][ref5], [18a][ref6], [19 tot en met 21][ref7] van dit besluit van
      toepassing op de desbetreffende buitengewoon opsporingsambtenaar.

      2 Indien de aanwijzing mede omvat het gebruik van een wapen, een surveillancehond,
      een AOT-hond dan wel handboeien of mondafscherming zijn de [artikelen 4][ref8],
      [7, eerste lid, aanhef en onder a, b en c, tweede, derde en vierde lid][ref9], [8][ref10], [9][ref11],
      [10][ref12], [10a][ref13], [12a][ref14], [12b][ref15], [12c][ref16], [12d][ref17], [12e][ref18], [12f][ref19],
      [15, eerste lid, aanhef en onder a, en tweede lid][ref20], [15a][ref21], [15b][ref22], [16][ref23] respectievelijk
      [22][ref24], [22a][ref25] en [23][ref26] van dit besluit van toepassing op de desbetreffende buitengewoon
      opsporingsambtenaar.

      3 Voor de toepassing van:

      a. [artikel 1, derde lid][ref27], wordt voor «meerdere» gelezen: de direct toezichthouder, bedoeld in
      [artikel 1 van het Besluit buitengewoon opsporingsambtenaar][ref28];

      b. [artikel 1, vierde lid, onder a][ref29], wordt voor «het gezag, bedoeld in de [artikelen 11][ref30], [12][ref31]
      en [14 van de Politiewet 2012][ref32]» gelezen: het gezag, bedoeld in artikel 12 van de Politiewet 2012;

      c. [artikel 1, vierde lid, onder d][ref33], wordt voor «geweldmiddel» gelezen: de wapens
      en de uitrusting waarmee geweld kan worden uitgeoefend, ten aanzien waarvan krachtens
      [artikel 3a, derde lid, van de Wet wapens en munitie][ref34] is bepaald dat de in dat lid genoemde artikelen niet
      van toepassing zijn op buitengewoon opsporingsambtenaren;

      d. de [artikelen 17, vierde lid, onder b][ref35] en, [18, eerste lid, aanhef en onder b][ref36],
      wordt voor «de korpschef» gelezen «de direct toezichthouder, bedoeld in artikel 1 van het Besluit
      buitengewoon opsporingsambtenaar» en voor «een andere ambtenaar van politie als bedoeld in
      [artikel 2, onder a of c, van de Politiewet 2012][ref37], die is aangesteld voor de uitvoering van de politietaak»
      gelezen: de buitengewoon opsporingsambtenaar;

      e. [artikel 18, tweede lid, aanhef en onder b][ref38], wordt voor «de korpschef» gelezen: de direct toezichthouder,
      bedoeld in [artikel 1, van het Besluit buitengewoon opsporingsambtenaar][ref39];

      f. [artikel 18, vierde lid][ref40], wordt voor «de ambtenaar» gelezen: de buitengewoon opsporingsambtenaar.


