preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Ministers van Justitie en van Binnenlandse Zaken van 8 december 1993, Stafafdeling
    Wetgeving Publiekrecht, nr. 415284/93/6 en nr. EA 93/U 3630, gedaan in overeenstemming met Onze Minister van
    Defensie, nr. CWW 85/008;

    Gelet op artikel 9 van de Politiewet 1993;

    De Raad van State gehoord (advies van 28 maart 1994, nr. W.O. 3.93.0838);

    Gezien het nader rapport van Onze Minister van Justitie gedaan mede namens Onze Minister van Binnenlandse Zaken van
    7 april 1994, Stafafdeling Wetgeving Publiekrecht, nr. 433019/94/6, nr. EA 94/U1149, uitgebracht in overeenstemming
    met Onze Minister van Defensie;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006589/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder ambtenaar:

      a. de ambtenaar van politie, bedoeld in [artikel 2, onder a, van de Politiewet 2012][ref1], en de ambtenaar van
      politie, bedoeld in artikel 2, onder c of d, van die wet, die is aangesteld voor de uitvoering van de politietaak;

      b. de ambtenaar van politie, bedoeld in [artikel 2, onder b, van de Politiewet 2012][ref2], en de ambtenaar van
      politie, bedoeld in artikel 2, onder c en d, van die wet, die is aangesteld voor de uitvoering van technische,
      administratieve en andere taken ten dienste van de politie dan wel de rijksrecherche, voor zover het betreft de
      [artikelen 1][ref3] en 2 en [hoofdstuk 5][ref4];

      c. degene die is benoemd tot aspirant voor de duur dat hij de praktijkstage volgt;

      d. de militair van de Koninklijke marechaussee in de uitvoering van de politietaken, bedoeld in
      [artikel 4, eerste lid, van de Politiewet 2012][ref5];

      e. de militair van de krijgsmacht, bedoeld in de [artikelen 58][ref6], [59][ref7] en
      [62 van de Politiewet 2012][ref8].

      2 In hoofdstuk 6 van dit besluit wordt onder ambtenaar mede verstaan de ambtenaar van politie, bedoeld in
      [artikel 2, onder b, van de Politiewet 2012][ref9], dan wel een andere persoon, voor zover die ambtenaar van
      politie of die persoon tevens buitengewoon opsporingsambtenaar is en door de korpschef is belast met de verzorging
      van ingeslotenen.

      3 In dit besluit wordt verstaan onder meerdere:

      a. de ambtenaar die uit hoofde van zijn functie of krachtens beschikking of aanwijzing met de leiding is belast of
      het bevel heeft over de taakuitvoering;

      b. indien op grond van het bepaalde onder a, geen meerdere kan worden aangewezen de ambtenaar van politie die
      een hogere rang heeft of, bij gelijkheid in rang, degene met de meeste dienstjaren, dan wel bij optreden door
      militairen van de Koninklijke marechaussee of van enig ander krijgsmachtonderdeel degene die ingevolge het bepaalde
      bij of krachtens [artikel 67 van het Wetboek van Militair Strafrecht][ref10] de meerdere is.

      4 In dit besluit wordt verstaan onder:

      a. bevoegd gezag: het gezag, bedoeld in de [artikelen 11][ref11], [12][ref12] en
      [14 van de Politiewet 2012][ref13];

      b. geweld: elke dwangmatige kracht van meer dan geringe betekenis uitgeoefend op personen of zaken;

      c. aanwenden van geweld: het gebruiken van geweld, waaronder mede wordt verstaan het gebruik van een geweldmiddel.
      In verband met de melding op grond van [artikel 17][ref14] valt het ter hand nemen van het vuurwapen eveneens onder
      het aanwenden van geweld tenzij het vuurwapen standaard in de hand of over de schouder wordt gedragen;

      d. geweldmiddel:

      1°. de krachtens [artikel 22 van de Politiewet 2012][ref15] toegelaten bewapening, en

      2°. de door Onze Minister van Defensie ter beschikking gestelde bewapening ten behoeve van de uitvoering
      van de politietaken, bedoeld in de [artikelen 4][ref16], [57][ref17], [58][ref18], [59][ref19] en
      [62 van de Politiewet 2012][ref20];

      e. hulpmiddelen ten behoeve van uitzetting:

      1º. de krachtens [artikel 22 van de Politiewet 2012][ref21], aan de ambtenaar van politie, bij of krachtens de
      [Vreemdelingenwet 2000][ref22] belast met de grensbewaking of met het toezicht op vreemdelingen, ter beschikking
      gestelde uitrusting ten behoeve van de uitzetting van vreemdelingen, en

      2º. de door Onze Minister van Defensie, in overeenstemming met Onze Minister, aan de ambtenaar van de Koninklijke
      marechaussee, bij of krachtens de [Vreemdelingenwet 2000][ref23] belast met de grensbewaking of met het toezicht op
      vreemdelingen, ter beschikking gestelde uitrusting ten behoeve van de uitzetting van vreemdelingen;

      f. vrijheidsbeperkende middelen, waaronder hulpmiddelen jegens ingeslotenen:

      1°. de krachtens [artikel 22 van de Politiewet 2012][ref24] toegelaten vrijheidsbeperkende middelen, en

      2°. de door Onze Minister van Defensie ter beschikking gestelde vrijheidsbeperkende middelen;

      g. automatisch vuur: het lossen van meerdere schoten als gevolg van het eenmalig overhalen van de trekker van een
      vuurwapen;

      h. de arts: de dienstdoend adviserend arts;

      i. buitengewoon opsporingsambtenaar: de buitengewoon opsporingsambtenaar, bedoeld in
      [artikel 142, eerste lid, van het Wetboek van Strafvordering][ref25];

      j. het gebruik van een vuurwapen: het richten, het gericht houden of het schieten met een vuurwapen;

      k. niet-penetrerend projectiel: projectiel dat is ontworpen om personen te treffen en daarbij niet het lichaam
      binnen te dringen;

      l. AOT-hond: hond bedoeld om te worden ingezet bij het optreden van een aanhoudings- en ondersteuningsteam of een
      bijstandseenheid als bedoeld in [artikel 59 van de Politiewet 2012][ref26];

      m. ambtenaar van een bijzondere opsporingsdienst: ambtenaar van een bijzondere opsporingsdienst als bedoeld in
      [artikel 2 van de Wet op de bijzondere opsporingsdiensten][ref27] die is aangewezen voor de uitvoering van de
      taken, bedoeld in [artikel 3 van die wet][ref28];

      n. geweldsregistratie: de registratie van het aangewende geweld, bedoeld in [artikel 17, derde lid][ref29];

      o. surveillancehond: hond bedoeld om te worden ingezet bij de surveillancedienst, het optreden van de mobiele
      eenheid of het bewaken en beveiligen van personen, objecten en diensten;

      p. cel: een afsluitbare ruimte geschikt voor het dag- en nachtverblijf van een persoon;

      q. verplaatsing: het overbrengen van een persoon binnen eenzelfde locatie, zonder dat daarbij een vervoermiddel
      wordt gebruikt;

      r. dienstpistool: het rechtens aan de ambtenaar toegekende pistool.

      5 In dit besluit wordt onder ingeslotene verstaan degene die rechtens van zijn vrijheid is beroofd. Onder
      ingeslotene wordt mede verstaan degene die ten behoeve van de hulpverlening aan hem op het politie- of
      brigadebureau is ondergebracht.

      6 In dit besluit wordt onder wapenstok zowel de korte als de lange wapenstok verstaan.


