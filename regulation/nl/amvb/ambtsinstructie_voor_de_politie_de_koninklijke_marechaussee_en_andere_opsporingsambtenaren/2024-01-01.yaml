    text: |-
      De ambtenaar die een onderzoek aan kleding of voorwerpen heeft uitgevoerd als bedoeld in
      [artikel 7, derde lid, van de Politiewet 2012][ref1] meldt dit onverwijld schriftelijk aan de hulpofficier van
      justitie, onder vermelding van de redenen die tot dit onderzoek hebben geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel7
