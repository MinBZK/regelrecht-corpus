  - number: 4a
    text: |-
      1 [Artikel 4, derde tot en met vijfde lid][ref1], is niet van toepassing op de eigenaar, voor zover leidingwater
      dat aan de tappunten ter beschikking komt niet voldoet aan [artikel 4, eerste lid][ref2], of aan de tabellen I
      en II, opgenomen in [bijlage A][ref3], en de oorzaak daarvan is gelegen in een op zijn leidingnet aangesloten
      woninginstallatie, collectief leidingnet of collectieve watervoorziening.

      2 In het in het eerste lid bedoelde geval neemt de eigenaar de in het belang van de volksgezondheid noodzakelijke
      en passende maatregelen, voor zover deze in zijn vermogen liggen.

      3 Tot de maatregelen, bedoeld in het tweede lid, behoren in elk geval:

      a. het terstond informeren van de toezichthouder en van de eigenaar van de op zijn leidingnet aangesloten
      woninginstallatie, collectief leidingnet of collectieve watervoorziening, over de normoverschrijding en
      de mogelijke nadelige gevolgen voor de volksgezondheid alsmede het adviseren van deze eigenaars omtrent
      herstelmaatregelen die zij kunnen nemen;

      b. het informeren en adviseren van de verbruikers omtrent aanvullende herstelmaatregelen die zij kunnen nemen.

      Tot de bedoelde maatregelen kan behoren het toepassen van behandelingstechnieken.


      [ref1]: https://wetten.overheid.nl/BWBR0002339#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002339#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002339
