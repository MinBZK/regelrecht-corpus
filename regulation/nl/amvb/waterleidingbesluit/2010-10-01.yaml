  - number: 17i
    text: |-
      1 Dit hoofdstuk is van toepassing op de eigenaar van een collectieve watervoorziening of een collectief leidingnet
      waarop direct of indirect tappunten als bedoeld in het vierde lid, zijn aangesloten, voor zover die tappunten
      aanwezig zijn:

      a. in instellingen:

      1. als bedoeld in [artikel 1.2, onderdeel 1, van het Uitvoeringsbesluit WTZi][ref1];

      2. als bedoeld in [artikel 5.2, onderdeel b, van het Uitvoeringsbesluit WTZi][ref2];

      3. die een of meer vormen van zorg verlenen als bedoeld in
      [artikel 1.2, nummers 17 tot en met 21, van het Uitvoeringsbesluit WTZi][ref3], niet in combinatie met verblijf,
      binnen een op grond van de [Algemene Wet Bijzondere Ziektekosten][ref4] bekostigd gebouw;

      b. in een gebouw, een gedeelte van een gebouw of een samenhangend geheel van gebouwen of gedeelten daarvan met
      een logiesfunctie als bedoeld in [artikel 1.1, derde lid, van het Bouwbesluit 2003][ref5], met uitzondering van
      zomerhuisjes, huisjes op volkstuincomplexen en gebouwen waar uitsluitend wordt overnacht door personen die ter
      plaatse werkzaam zijn;

      c. in een opvangcentrum als bedoeld in [artikel 1 van de Wet Centraal Orgaan opvang asielzoekers][ref6],

      d. in een gebouw, een gedeelte van een gebouw of een samenhangend geheel van gebouwen of gedeelten daarvan met een
      celfunctie als bedoeld in [artikel 1.1, derde lid, van het Bouwbesluit 2003][ref7],

      e. in een badinrichting als bedoeld in
      [artikel 1 van de Wet hygiëne en veiligheid badinrichtingen en zwemgelegenheden][ref8],

      f. op een terrein of plaats, geheel of gedeeltelijk ingericht, en blijkens die inrichting bestemd, om daarop
      ten behoeve van recreatief nachtverblijf gelegenheid te geven tot het plaatsen of geplaatst houden van tenten,
      tentwagens, kampeerauto’s of andere voertuigen of gewezen voertuigen of gedeelten daarvan; een en ander voor zover
      deze onderkomens of voertuigen geheel of ten dele blijvend zijn bestemd of opgericht dan wel worden of kunnen
      worden gebruikt voor recreatief nachtverblijf,

      g. in een haven met de daarbij behorende grond waar overwegend gelegenheid wordt gegeven voor het aanleggen,
      afmeren of afgemeerd houden van pleziervaartuigen.

      2 De [artikelen 17j][ref9], [17o][ref10], [17p][ref11] en [17q][ref12] zijn van overeenkomstige toepassing op
      de eigenaar van een waterleidingbedrijf, voor zover deze drinkwater aan derden ter beschikking stelt, met dien
      verstande dat voor de toepassing van [artikel 17q][ref13] geldt dat:

      a. het onderzoek naar de aanwezigheid van legionellabacteriën na de laatste zuiveringsstap tenminste halfjaarlijks
      wordt uitgevoerd,

      b. het leidingwater in het distributiegebied van het waterleidingbedrijf onderzocht wordt overeenkomstig de
      frequentie, aangemerkt als «audit», aangegeven in [tabel II van bijlage B][ref14].

      3 Dit hoofdstuk is van overeenkomstige toepassing op de eigenaar van een waterleidingbedrijf, voor zover deze
      huishoudwater aan derden ter beschikking stelt.

      4 Als tappunten, bedoeld in de aanhef van het eerste lid worden aangemerkt:

      a. tappunten met een douche of andere appendage waarmee water kan worden gesproeid of verneveld;

      b. tappunten die al dan niet tijdelijk gebruikt worden voor het aansluiten van een douche, andere appendage of
      toestel waarmee water kan worden gesproeid of verneveld;

      c. tappunten waarvan de eigenaar redelijkerwijze kan weten of vermoeden dat deze al dan niet tijdelijk gebruikt
      worden voor het aansluiten van een douche, andere appendage of toestel waarmee water kan worden gesproeid of
      verneveld;

      d. alle tappunten in een instelling als bedoeld in het eerste lid, onderdeel a, sub 1, voor zover het een
      afdeling hematologie of oncologie is, dan wel daar transplantaties worden uitgevoerd, of patiënten met chronische
      longaandoeningen of met immuunstoornissen verblijven.


