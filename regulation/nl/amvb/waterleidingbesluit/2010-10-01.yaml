  - number: 4d
    text: |-
      1 In afwijking van [artikel 4c][ref1] kan de toezichthouder op verzoek van de eigenaar ontheffing verlenen van
      waarden uit tabel II, opgenomen in [bijlage A][ref2], voor zover:

      a. overschrijding van een waarde uit tabel II naar zijn oordeel geen nadelige gevolgen voor de volksgezondheid
      heeft,

      b. de overschrijding binnen 30 dagen door het nemen van herstelmaatregelen kan worden opgeheven, en

      c. de onder a bedoelde waarde door de eigenaar in de voorafgaande twaalf maanden niet gedurende meer dan 30 dagen
      is overschreden.

      2 Bij zijn besluit stelt de toezichthouder de maximaal toegestane waarde en duur van de overschrijding van de
      waarde uit tabel II vast.


      [ref1]: https://wetten.overheid.nl/BWBR0002339#Artikel4c
      [ref2]: https://wetten.overheid.nl/BWBR0002339
