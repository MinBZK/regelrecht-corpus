  - number: '10'
    text: |-
      1 Het nemen en analyseren van monsters ter uitvoering van dit besluit geschiedt door laboratoria die een
      kwaliteitsborgingssysteem hanteren dat gebaseerd is op ISO 17025 of een gelijkwaardige norm en die daarvoor
      overeenkomstig deze norm geaccrediteerd zijn.

      2 In afwijking van het eerste lid kan het nemen en analyseren van monsters ter uitvoering van
      [hoofdstuk IIIC][ref1] geschieden door medisch microbiologische laboratoria, onder verantwoordelijkheid van een
      arts-microbioloog, die een kwaliteitsborgingssysteem hanteren dat gebaseerd is op ISO 15189 of een gelijkwaardige
      norm en die daarvoor overeenkomstig deze norm geaccrediteerd zijn.

      3 Een gelijkwaardige norm als bedoeld in het eerste of tweede lid wordt uitsluitend toegepast na daartoe verkregen
      toestemming van de inspecteur. Bij de aanvraag worden alle voor de beoordeling van de gelijkwaardigheid van de
      bedoelde norm relevante gegevens in de door de inspecteur aangegeven vorm aan hem overgelegd.

      4 Het nemen en analyseren van monsters als bedoeld in de [artikelen 6][ref2] en [6a][ref3] en
      [hoofdstuk IIIC][ref4] ten behoeve van waterleidingbedrijven geschiedt door laboratoria als bedoeld in het eerste
      lid die daartoe zijn aangewezen door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002339#HoofdstukIIIC
      [ref2]: https://wetten.overheid.nl/BWBR0002339#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0002339#Artikel6a
      [ref4]: https://wetten.overheid.nl/BWBR0002339#HoofdstukIIIC
