  - number: '6'
    text: |-
      1 Indien een waterleidingbedrijf, collectieve watervoorziening of collectief leidingnet in gebruik is, beschikt de
      eigenaar daarvan over een daarop betrekking hebbend meetprogramma dat voldoet aan de in [bijlage B][ref1] opgenomen
      tabellen Ia, Ib, Ic en II. Bij majeure wijzigingen in de feitelijke situatie past de eigenaar daaraan voorafgaand
      het meetprogramma daarop aan.

      2 Het eerste lid is niet van toepassing op de eigenaar van een collectief leidingnet of van een collectieve
      watervoorziening voor warm tapwater, uitsluitend voor zover daarmee, berekend over een kalenderjaar, per dag
      gemiddeld minder dan 100 m3 drinkwater, onderscheidenlijk minder dan 30 m3 warm tapwater, wordt gedistribueerd.

      3 Een meetprogramma als bedoeld in het eerste lid dat betrekking heeft op een waterleidingbedrijf behoeft
      goedkeuring van de toezichthouder. Het programma wordt daartoe door de eigenaar van dat bedrijf na vaststelling of
      wijziging voorgelegd aan de toezichthouder, in de door deze aangegeven vorm.

      4 Het derde lid is van overeenkomstige toepassing op de eigenaar van een collectieve watervoorziening voor zover
      deze voor de winning of behandeling van water, dat als leidingwater aan derden ter beschikking wordt gesteld,
      gebruik maakt van grondwater, oppervlaktewater, zeewater of een overeenkomstige grondstof of halffabrikaat.

      5 De eigenaar, bedoeld in het eerste lid, onderzoekt het water in de frequentie en op de plaatsen, aangegeven in
      het meetprogramma, bedoeld in dat lid.

      6 Indien en voor zolang de eigenaar niet beschikt over een meetprogramma dat in overeenstemming is met het eerste
      lid dan wel, in de gevallen, bedoeld in het derde en vierde lid, niet beschikt over een goedgekeurd meetprogramma,
      verricht hij metingen overeenkomstig de in [bijlage B][ref2] opgenomen tabellen Ia, Ib, Ic en II.

      7 Voor micro-organismen, parasieten of stoffen die niet zijn genoemd in de in [bijlage A][ref3] opgenomen tabellen
      I, II en III, verricht de eigenaar of de eigenaar van een collectief leidingnet metingen indien er redenen zijn om
      aan te nemen dat deze aanwezig zijn in aantallen per volume-eenheid of concentraties die nadelige gevolgen voor de
      volksgezondheid kunnen hebben.

      8 De toezichthouder kan bepalen dat door hem aangegeven parameters, genoemd in tabel I van [bijlage B][ref4],
      frequenter worden onderzocht dan in tabel II van [bijlage B][ref5] is aangegeven. Tevens kan hij bepalen dat andere
      dan de in tabel I van [bijlage B][ref6] genoemde, door hem aangegeven parameters, onderzocht worden in een door hem
      aangegeven frequentie, indien dat naar zijn oordeel van belang is voor het verkrijgen van voldoende inzicht in de
      kwaliteit van het water.

      9 De toezichthouder kan toestaan dat de meetfrequentie van parameters die in tabel I van [bijlage B][ref7] zijn
      aangemerkt als «bewaking» wordt verlaagd, indien:

      a. de waarden van de resultaten van de in een periode van tenminste twee opeenvolgende jaren genomen monsters
      constant zijn of significant beter dan de in [bijlage A][ref8] genoemde waarden en

      b. het aannemelijk is dat er geen factor aanwezig is waardoor de kwaliteit van het water kan verslechteren.

      Bij verlaging van de frequentie bedraagt het aantal te nemen monsters ten minste de helft van de in tabel II van
      [bijlage B][ref9] genoemde aantallen.

      10 De toezichthouder kan toestaan dat de meetfrequentie van parameters die in tabel I van [bijlage B][ref10]
      zijn aangemerkt als «audit» wordt verlaagd, indien wordt vastgesteld dat de desbetreffende parameter niet in het
      leidingwater voorkomt in aantallen per volume-eenheid of concentraties die kunnen leiden tot het risico dat de in
      [bijlage A][ref11] genoemde waarden worden overschreden.

      11 De eigenaar van een waterleidingbedrijf die drinkwater van een ander betrekt teneinde dit zonder behandeling
      aan derden ter beschikking te stellen, onderzoekt dit ter plaatse waar hij dit water betrekt overeenkomstig de
      tabellen I en II, opgenomen in [bijlage B][ref12]. Indien in dit geval drinkwater wordt betrokken van een ander
      waterleidingbedrijf kan de inspecteur toestaan dat bedoeld onderzoek op andere, door hem aan te geven wijze wordt
      uitgevoerd.

      12 In alle overige gevallen dan bedoeld in het tiende lid, worden de monsters aan de tappunten genomen, met
      uitzondering van de monsters waarvan in de kolom« monsterplaats» in tabel I van [bijlage B][ref13] is aangegeven
      voor welke parameters de monsters of een deel daarvan ter plaatse van de inname van het gebruikte grondwater of
      oppervlaktewater dan wel na behandeling mogen worden genomen.

      13 De monstername geschiedt op een zodanig tijdstip en op zodanige wijze, dat de uitkomsten van het onderzoek
      representatief zijn voor de hoedanigheid van het desbetreffende water.

      14 Een monster dat niet ter plaatse wordt geanalyseerd wordt zodanig bewaard dat daardoor de uitkomsten van het
      onderzoek niet in betekenende mate worden beïnvloed.


      [ref1]: https://wetten.overheid.nl/BWBR0002339
      [ref2]: https://wetten.overheid.nl/BWBR0002339
