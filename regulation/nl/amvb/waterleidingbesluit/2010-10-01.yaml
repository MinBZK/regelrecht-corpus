  - number: 6b
    text: |-
      1 De eigenaar houdt de in [artikelen 6][ref1] en [6a][ref2] bedoelde gegevens gedurende vijf jaar onder zich.

      2 Binnen drie maanden na afloop van elk kalenderjaar verstrekt de eigenaar of de eigenaar van een collectief
      leidingnet voor zover daarmee gemiddeld meer dan 1000 m3 leidingwater per dag of aan gemiddeld meer dan 5000
      personen per dag leidingwater wordt geleverd, aan de toezichthouder een representatieve samenvatting van de
      gegevens, bedoeld in het eerste lid, in de door de toezichthouder aangegeven vorm.


      [ref1]: https://wetten.overheid.nl/BWBR0002339#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002339#Artikel6a
