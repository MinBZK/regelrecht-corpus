    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Volksgezondheid van 7 maart 1960, no. 3103, Directie
    Volksgezondheid, Afdeling Gezondheidsbescherming;

    Gelet op de artikelen 1, eerste lid, onder e,4, tweede lid, 5, tweede lid, 9, 11, eerste lid en 27 van de
    Waterleidingwet;

    Gezien het rapport van de Raad voor de Drinkwatervoorziening van 19 oktober 1959, no. 86 en het rapport van de
    Centrale Raad van de Volksgezondheid van 14 januari 1960, no. 3394;

    De Raad van State gehoord (advies van 12 april 1960, no. 47);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Volksgezondheid van 27 mei 1960, no. 6674, Directie
    Volksgezondheid, Afdeling Gezondheidsbescherming;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002339/2010-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. de eigenaar: de eigenaar van een waterleidingbedrijf en, met uitzondering van [hoofdstuk IV][ref1] en voor zover
      niet anders aangegeven, de eigenaar van een collectieve watervoorziening;

      b. huishoudwater: leidingwater dat uitsluitend bestemd is voor toiletspoeling, gebruik in wasmachine of het
      besproeien van de tuin;

      c. huishoudwatervoorziening: een voorziening voor de winning of behandeling van water dat met behulp van een
      leiding of distributienet als huishoudwater aan derden ter beschikking wordt gesteld;

      d. ISO 17025: NEN-EN-ISO/IEC 17025:2000, algemene eisen voor de competentie van beproevings- en
      kalibratielaboratoria, uitgegeven door het Nederlandse Normalisatie Instituut;

      e. de toezichthouder: de inspecteur dan wel, voor zover het betreft het toezicht op een collectieve
      watervoorziening of een collectief leidingnet, de op grond van de [artikelen 15b][ref2], onderscheidenlijk
      [15f, van de Waterleidingwet][ref3] aangewezen ambtenaar;

      f. warm tapwater: verwarmd leidingwater;

      g. de wet: de [Waterleidingwet][ref4];

      h. aërosolen: in lucht gedispergeerde waterdeeltjes met een diameter van 1 tot 10 micrometer;

      i. legionellabacterie: bacterie behorende tot het geslacht Legionella;

      j. tappunt: plaats waar het leidingwater beschikbaar komt voor gebruik;

      k. NEN 6265: NEN 6265:1991/A1:2003, onderzoek naar de aanwezigheid en het aantal kolonievormende eenheden (KVE) van
      legionellabacteriën, uitgegeven door het Nederlands Normalisatie Instituut;

      l. bijlage: bij dit besluit behorende bijlage;

      m. ISO 15189: NEN-EN-ISO 15189: 2003, Medische laboratoria- bijzondere eisen voor kwaliteit en competentie,
      uitgegeven door het Nederlands Normalisatie Instituut.


