  - number: '7'
    text: |-
      1 Bij het uitvoeren van onderzoek als bedoeld in de [artikelen 6][ref1] en [6a][ref2] worden de specificaties,
      genoemd in [bijlage C][ref3], in acht genomen. Voor de in tabel I van [bijlage C][ref4] genoemde parameters worden
      de daar genoemde analysemethoden toegepast.

      2 In afwijking van het eerste lid, tweede zin, kan de inspecteur op verzoek van degene die de analyses uitvoert
      toestaan dat van alternatieve analysemethoden gebruik wordt gemaakt, indien deze naar zijn oordeel tenminste even
      betrouwbaar zijn als de analysemethoden, bedoeld in het eerste lid. Bij zijn verzoek verstrekt de aanvrager alle
      voor de beoordeling van de alternatieve analysemethode relevante gegevens in de door de inspecteur aangegeven vorm.
      De inspecteur meldt de toepassing van de alternatieve analysemethode aan Onze Minister.

      3 Voor de in tabel II van [bijlage C][ref5] genoemde parameters worden bij de analyse de daar vermelde
      prestatiekenmerken in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002339#Artikel6
