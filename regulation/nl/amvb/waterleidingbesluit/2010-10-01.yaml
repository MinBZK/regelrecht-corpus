  - number: '24'
    text: |-
      1 In de gevallen, waarin Onze Minister ontheffing verleent als bedoeld in de [artikelen 2][ref1], [4c][ref2]
      of [17e][ref3], wordt hiervan mededeling gedaan in de Staatscourant, in een of meer landelijke dagbladen en in een
      of meer regionale dagbladen.

      2 Indien toepassing is gegeven aan [artikel 4c][ref4] informeert de houder van de ontheffing de betrokken
      verbruikers over de ontheffingverlening en adviseert hij zo nodig specifiek gevoelige bevolkingsgroepen over door
      hen te nemen maatregelen ter bescherming van hun gezondheid.


