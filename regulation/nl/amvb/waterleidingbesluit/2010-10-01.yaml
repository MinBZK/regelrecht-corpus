  - number: 17f
    text: |-
      1 Indien Onze Minister voornemens is over te gaan tot intrekking van de ontheffing dan wel tot wijziging,
      aanvulling of intrekking van aan de ontheffing verbonden voorschriften, doet hij daarvan mededeling aan het
      openbare lichaam, belast met de zorg voor de goede hoedanigheid van het betrokken oppervlaktewater.

      2 In een mededeling als bedoeld in het eerste lid en een mededeling ingevolge
      [artikel 4:8 van de Algemene wet bestuursrecht][ref1] vermeldt Onze Minister ten minste:

      a. een korte motivering van de voorgenomen beslissing;

      b. indien het voornemen een wijziging betreft, de zakelijke inhoud van die wijziging;

      c. de termijn waarbinnen een belanghebbende zijn zienswijze met betrekking tot de voorgenomen beslissing naar voren
      kan brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel48
    url: https://wetten.overheid.nl/BWBR0002339/2010-10-01#Artikel17f
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:8
  - number: 17g
    text: |-
      1 Onverminderd de hoofdstukken II, [III][ref1] en [IIIA][ref2], draagt de eigenaar er zorg voor dat de materialen
      en chemicaliën, die gebruikt worden bij de winning, de bereiding, de behandeling, de opslag, het transport of de
      distributie van leidingwater en de wijze waarop deze worden toegepast, er niet toe leiden dat deze materialen en
      chemicaliën:

      a. in een hogere concentratie in het leidingwater achterblijven dan voor het gebruik van die materialen of
      chemicaliën noodzakelijk is, en

      b. nadelige gevolgen hebben voor de volksgezondheid.

      2 Het eerste lid is van overeenkomstige toepassing op de eigenaar van een collectief leidingnet en de in dat
      leidingnet toe te passen materialen.

      3 Het eerste en tweede lid zijn niet van toepassing voor zover bij de distributie van leidingwater te gebruiken
      materialen deel uitmaken van een gebouw als bedoeld in [artikel 1, eerste lid, onder c, van de Woningwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002339#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0002339#HoofdstukIIIA
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0002339/2010-10-01#Artikel17g
    references:
      - id: ref1
        bwb_id: BWBR0002339
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002339
        hoofdstuk: IIIA
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '1'
  - number: 17h
    text: |-
      1 Aan de in [artikel 17g, eerste lid, onder b, en tweede lid][ref1] juncto eerste lid, onder b, gestelde eis wordt
      voldaan voor zover het betreft materialen en chemicaliën:

      a. waarvoor door Onze Minister erkende, dan wel gelijkwaardige kwaliteitsverklaringen zijn afgegeven, mits deze
      materialen en chemicaliën overeenkomstig deze kwaliteitsverklaringen worden gebruikt of toegepast;

      b. waarvan anderszins ten genoegen van Onze Minister is aangetoond dat aan de in
      [artikel 17g, eerste lid, onder b, en tweede lid][ref2] juncto eerste lid, onder b, gestelde eis wordt voldaan.

      2 Er is een commissie van deskundigen, belast met de uitvoering van de regels, bedoeld in het eerste lid.


