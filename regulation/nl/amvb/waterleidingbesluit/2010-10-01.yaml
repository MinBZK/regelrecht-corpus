  - number: 6a
    text: |-
      1 De eigenaar, die gebruik maakt van grondwater, oppervlaktewater, of een daaruit vervaardigd halffabrikaat
      ten behoeve van de bereiding van leidingwater, neemt bij het opstellen van het meetprogramma, bedoeld in
      [artikel 6, eerste lid][ref1], tevens tabel III van [bijlage B][ref2] in acht.

      2 De eigenaar die gebruik maakt van oppervlaktewater ten behoeve van de bereiding van leidingwater:

      a. verricht het onderzoek of neemt de monsters daarvoor op een plaats die representatief is voor de waterkwaliteit
      op het punt waar het oppervlaktewater vóór de zuiveringsbehandeling wordt onttrokken en

      b. kiest met betrekking tot de parameters temperatuur, zuurgraad en zuurstof-opgelost, een zodanig tijdstip dat
      de uitkomsten van het onderzoek representatief zijn voor het etmaalgemiddelde over de dag waarop het onderzoek
      plaatsvindt.

      Indien en zo lang als geen gevolg is gegeven aan een op grond van [artikel 6, eerste lid][ref3], bestaande
      verplichting tot het opstellen van een meetprogramma, verricht de eigenaar, bedoeld in het eerste lid, metingen
      overeenkomstig de in [bijlage B][ref4] opgenomen tabel III, tenzij de toezichthouder anders bepaalt.

      3 De toezichthouder kan bepalen dat:

      a. door hem aangegeven parameters, genoemd in tabel III van [bijlage B][ref5], frequenter worden onderzocht dan
      aldaar is aangegeven;

      b. door hem aangegeven parameters van groep II, genoemd in tabel III van [bijlage B][ref6], minder frequent worden
      onderzocht dan aldaar is aangegeven;

      c. andere dan in tabel III van [bijlage B][ref7] genoemde, door hem aangegeven parameters, onderzocht worden indien
      dat naar zijn oordeel van belang is voor het verkrijgen van voldoende inzicht in de kwaliteit van het water.


      [ref1]: https://wetten.overheid.nl/BWBR0002339#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002339
      [ref3]: https://wetten.overheid.nl/BWBR0002339#Artikel6
