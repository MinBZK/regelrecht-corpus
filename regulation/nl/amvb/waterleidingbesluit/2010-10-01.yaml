  - number: 4b
    text: |-
      1 Indien niet wordt voldaan aan tabel III, opgenomen in [bijlage A][ref1], informeert de eigenaar terstond
      de toezichthouder, verricht hij terstond onderzoek naar de oorzaak en de mogelijke nadelige gevolgen voor de
      volksgezondheid en neemt hij de in het belang van de volksgezondheid noodzakelijke en passende maatregelen.

      2 In gevallen als bedoeld in het eerste lid informeert de eigenaar de verbruikers over de normoverschrijding en
      adviseert hij hen omtrent de maatregelen die zij kunnen nemen om nadelige gevolgen voor de gezondheid te voorkomen,
      tenzij de toezichthouder van oordeel is dat de normoverschrijding geen nadelige gevolgen heeft voor de gezondheid
      en het welzijn van de verbruikers en voor aan de verbruikers toebehorende goederen.

      3 Het tweede lid is van overeenkomstige toepassing op de eigenaar van een collectief leidingnet.


      [ref1]: https://wetten.overheid.nl/BWBR0002339
    url: https://wetten.overheid.nl/BWBR0002339/2010-10-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0002339
  - number: 4c
    text: |-
      1 Indien niet wordt voldaan aan tabel II, opgenomen in [bijlage A][ref1], kan Onze Minister, indien het belang van
      de volksgezondheid zich daartegen niet verzet en de watervoorziening in het desbetreffende gebied redelijkerwijs
      niet op een andere wijze kan worden voortgezet, op verzoek van de eigenaar ontheffing verlenen van waarden uit
      tabel II.

      2 Een ontheffing als bedoeld in het eerste lid kan onder beperkingen worden verleend en aan een ontheffing
      kunnen voorschriften worden verbonden. De beperkingen en voorschriften worden gesteld in het belang van de
      volksgezondheid. In het belang van de volksgezondheid kan de ontheffing worden ingetrokken en kunnen de aan de
      ontheffing verbonden voorschriften worden gewijzigd, aangevuld of ingetrokken.

      3 De ontheffing, bedoeld in het eerste lid, wordt verleend voor een zo kort mogelijke periode van ten hoogste drie
      jaar.

      4 De houder van de ontheffing, bedoeld in het eerste lid, stelt Onze Minister terstond op de hoogte van
      omstandigheden die er redelijkerwijs toe kunnen leiden dat aan het eind van de periode, bedoeld in het derde lid,
      niet wordt voldaan aan de in het eerste lid genoemde tabel II.

      5 In het geval, bedoeld in het vierde lid, kan Onze Minister op verzoek van de houder van de ontheffing
      besluiten tot verlenging van de periode waarvoor de ontheffing geldt. Het eerste tot en met vierde lid zijn van
      overeenkomstige toepassing. Nadien is in uitzonderlijke gevallen nog eenmaal op overeenkomstige wijze verlenging
      mogelijk.

      6 Een besluit tot verlening van een ontheffing als bedoeld in het eerste lid of tot verlenging van de periode
      waarvoor de ontheffing geldt als bedoeld in het vijfde lid omvat in ieder geval de volgende gegevens:

      a. de redenen voor de ontheffing;

      b. de parameter waarop de ontheffing betrekking heeft, de resultaten van eerdere metingen in verband met deze
      parameter en de maximaal toegestane waarde ingevolge de ontheffing;

      c. het geografisch gebied, de hoeveelheid geleverd water per dag, het aantal verbruikers en de betrokken
      bevolkingsgroep alsmede de eventuele gevolgen van de ontheffing voor de levensmiddelenindustrie;

      d. een adequaat meetschema, met verhoogde meetfrequentie indien noodzakelijk;

      e. een samenvatting van het plan voor de noodzakelijke herstelmaatregelen, waaronder een tijdschema, een
      kostenraming en voorzieningen voor onderzoek en evaluatie;

      f. de periode waarvoor de ontheffing geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0002339
    url: https://wetten.overheid.nl/BWBR0002339/2010-10-01#Artikel4c
