  - number: '22'
    text: |-
      Degene, die belast is met het geneeskundige onderzoek, is verplicht:

      a. de inspecteur onverwijld in kennis te stellen van de resultaten daarvan, indien blijkt, dat besmetting met
      bacteriën van de geslachten Salmonella of Shigella aanwezig is of anamnestische verdenking bestaat betreffende
      besmetting met de verwekker van febris typhoïdea, paratyfus B (salmonellose Schottmüller) of dysenteria amoebica;

      b. aan de inspecteur alle door deze met betrekking tot het geneeskundige onderzoek gevraagde inlichtingen te
      verstrekken.
    url: https://wetten.overheid.nl/BWBR0002339/2010-10-01#Artikel22
  - number: '23'
    text: |-
      1 De eigenaar kan tegen een beschikking, als bedoeld in de [artikelen 18, tweede lid][ref1] en
      [19, eerste lid, onder ][ref2], bij Onze Minister administratief beroep instellen. Het beroep schorst de
      verplichting tot het voldoen aan de beslissing, tenzij de inspecteur daarbij heeft bepaald, dat zij ongeacht beroep
      moet worden uitgevoerd.

      2 Voor zover maatregelen zijn genomen ingevolge een beslissing, als bedoeld in het tweede lid, laatste zinsnede,
      welke nadien door Onze Minister in beroep is vernietigd, vergoedt het Rijk de schade, door deze maatregelen aan de
      eigenaar veroorzaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002339#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002339#Artikel19
