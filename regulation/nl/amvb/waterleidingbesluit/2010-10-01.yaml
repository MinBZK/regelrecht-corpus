  - number: 17m
    text: |-
      1 In gevallen waarin op grond van artikel 17l een verplichting bestaat tot het opstellen van een beheersplan,
      draagt de eigenaar van een collectieve watervoorziening of van een collectief leidingnet er zorg voor dat
      het beheersplan voor de toezichthouder ter inzage ligt ter plaatse van de collectieve watervoorziening,
      onderscheidenlijk het collectieve leidingnet. Op verzoek van de toezichthouder wordt het beheersplan aan hem
      toegezonden in een door hem aangegeven vorm.

      2 Indien de toezichthouder van oordeel is dat het beheersplan, bedoeld in artikel 17l, eerste of derde lid, onjuist
      of onvolledig is dan wel anderszins niet voldoet aan de voorschriften, opgenomen in artikel 17l, vijfde lid, kan
      hij de eigenaar verplichten tot het wijzigen, aanvullen of opnieuw opstellen van het beheersplan binnen een daarbij
      aangegeven termijn. Het eerste lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002339/2010-10-01#Artikel17m
  - number: 17n
    text: |-
      1 De eigenaar van een collectieve watervoorziening of van een collectief leidingnet voert maatregelen en controles
      uit overeenkomstig het beheersplan.

      2 De eigenaar, bedoeld in het eerste lid, houdt in een logboek aantekening van de krachtens dit hoofdstuk
      uitgevoerde maatregelen, controles en onderzoeken, alsmede van de resultaten daarvan. Deze gegevens worden
      gedurende drie jaar bewaard.

      3 De eigenaar, bedoeld in het eerste lid, draagt er zorg voor dat het logboek voor de toezichthouder ter inzage
      ligt ter plaatse van de collectieve watervoorziening of het collectieve leidingnet of, indien de toezichthouder
      daarmee instemt, op een andere, door hem te bepalen plaats. Op verzoek van de toezichthouder wordt het logboek aan
      hem toegezonden in een door hem aangegeven vorm.
    url: https://wetten.overheid.nl/BWBR0002339/2010-10-01#Artikel17n
  - number: 17o
    text: |-
      1 In geval van omstandigheden die, naar de eigenaar van de collectieve watervoorziening of het collectief
      leidingnet redelijkerwijze kan weten of vermoeden, gevaar of beletsel kunnen vormen voor het voldoen aan artikel
      4, zevende lid, of artikel 17j, eerste lid, informeert hij terstond de toezichthouder en voert hij uit voorzorg
      de maatregelen en controles uit die met het oog op deze omstandigheden in het beheersplan zijn opgenomen of, voor
      zover daaromtrent in het beheersplan geen maatregelen zijn opgenomen dan wel geen beheersplan van toepassing is,
      de maatregelen en controles die in deze omstandigheden redelijkerwijs van hem kunnen worden gevergd, tenzij de
      toezichthouder anders voorschrijft. Tevens worden in dit geval de verbruikers terstond geïnformeerd en geadviseerd
      over de door hen te nemen maatregelen ter bescherming van hun gezondheid, tenzij de normoverschrijding naar het
      oordeel van de toezichthouder geen nadelige gevolgen heeft voor de gezondheid en het welzijn van de verbruikers.

      2 Indien de eigenaar van de collectieve watervoorziening of het collectief leidingnet vaststelt dat leidingwater
      niet voldoet aan artikel 17j, eerste lid, ten gevolge van een oorzaak die gelegen is in een op zijn leidingnet
      aangesloten woninginstallatie, collectieve watervoorziening of collectief leidingnet, informeert hij terstond
      de eigenaar hiervan en adviseert hij deze over de te nemen herstelmaatregelen. Tevens informeert hij terstond de
      toezichthouder.
    url: https://wetten.overheid.nl/BWBR0002339/2010-10-01#Artikel17o
  - number: 17p
    text: |-
      1 Het nemen en analyseren van monsters ter uitvoering van dit hoofdstuk geschiedt overeenkomstig NEN 6265 of een
      gelijkwaardige methode.

      2 Een gelijkwaardige methode als bedoeld in het eerste lid wordt uitsluitend toegepast na daartoe verkregen
      toestemming van de inspecteur. Bij de aanvraag worden alle voor de beoordeling van de gelijkwaardigheid van de
      bedoelde methode relevante gegevens in de door de inspecteur aangegeven vorm aan hem overgelegd.
    url: https://wetten.overheid.nl/BWBR0002339/2010-10-01#Artikel17p
  - number: 17q
    text: |-
      Bij de uitvoering van de risicoanalyse, bedoeld in [artikel 17k, eerste of tweede lid][ref1], en vervolgens
      tenminste halfjaarlijks, onderzoekt de eigenaar van een collectieve watervoorziening onderscheidenlijk een
      collectief leidingnet het leidingwater op de aanwezigheid van legionellabacteriën bij de tappunten, bedoeld in
      [artikel 17i, vierde lid][ref2]. Het aantal in dit onderzoek te betrekken meetpunten wordt bepaald overeenkomstig
      [bijlage G][ref3]. De toezichthouder kan bepalen dat de meetfrequentie of het aantal in het onderzoek te betrekken
      meetpunten verlaagd of verhoogd wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0002339#Artikel17k
      [ref2]: https://wetten.overheid.nl/BWBR0002339#Artikel17i
      [ref3]: https://wetten.overheid.nl/BWBR0002339
    url: https://wetten.overheid.nl/BWBR0002339/2010-10-01#Artikel17q
    references:
      - id: ref1
        bwb_id: BWBR0002339
