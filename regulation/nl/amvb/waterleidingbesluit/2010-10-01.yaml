  - number: '16'
    text: |-
      De eigenaar draagt zorg, dat het personeel wordt voorgelicht aangaande de hygiënische voorschriften, welke in het
      bedrijf in acht moeten worden genomen.
    url: https://wetten.overheid.nl/BWBR0002339/2010-10-01#Artikel16
  - number: 17a
    text: |-
      1 Oppervlaktewater, bestemd om te worden gebruikt voor de bereiding van leidingwater, wordt ingedeeld in de
      kwaliteitsklassen I, II en III, op grond van de waarden van de parameters, genoemd in de bij dit besluit behorende
      [bijlage D][ref1]. Oppervlaktewater valt in een der kwaliteitsklassen indien geen der waarden van de parameters,
      genoemd in kolom B van de desbetreffende klasse, wordt overschreden.

      2 Van overschrijding van de waarde van een parameter, genoemd in [bijlage D][ref2], is sprake indien:

      a. na metingen welke éénmaal per 4 weken dienen te worden verricht, wordt vastgesteld dat:

        - de waarde meer dan éénmaal per jaar is overschreden; of
        - de waarde meer bedraagt dan 150% van de in [bijlage D][ref3] genoemde waarde met uitzondering van de waarde
      betreffende de parameters temperatuur, zuurgraad, zuurstof opgelost, alsmede de microbiologische parameters;

      b. na metingen welke eenmaal per 3 maanden dienen te worden verricht, wordt vastgesteld dat de in [bijlage D][ref4]
      genoemde waarde is overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0002339
      [ref2]: https://wetten.overheid.nl/BWBR0002339
      [ref3]: https://wetten.overheid.nl/BWBR0002339
      [ref4]: https://wetten.overheid.nl/BWBR0002339
    url: https://wetten.overheid.nl/BWBR0002339/2010-10-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002339
      - id: ref2
        bwb_id: BWBR0002339
      - id: ref3
        bwb_id: BWBR0002339
      - id: ref4
        bwb_id: BWBR0002339
  - number: 17b
    text: |-
      Indien de eigenaar vaststelt dat in het door hem voor de bereiding van leidingwater ingenomen oppervlaktewater
      overschrijding van waarden van in [bijlage D][ref1] genoemde parameters, behorend bij de kwaliteitsklasse, waarin
      het door hem gebruikte oppervlaktewater valt, optreedt, stelt hij daarvan in kennis:

        - de inspecteur,
        - het openbare lichaam, belast met de zorg voor de goede hoedanigheid van het betrokken oppervlaktewater,
        - in de gevallen, bedoeld in [artikel 17][ref2], Onze Minister,
        - indien ten behoeve van de bereiding van leidingwater door de eigenaar water uit oppervlaktewater is ingenomen
      door een ander bedrijf, de eigenaar van dat bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0002339
      [ref2]: https://wetten.overheid.nl/BWBR0002339#Artikel17d
    url: https://wetten.overheid.nl/BWBR0002339/2010-10-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0002339
      - id: ref2
        bwb_id: BWBR0002339
        artikel: 17d
        hoofdstuk: IIIA
  - number: 17c
    text: |-
      1 Het is de eigenaar verboden leidingwater te bereiden uit oppervlaktewater dat niet voldoet aan de ten aanzien van
      kwaliteitsklasse III, onder B in [Bijlage D][ref1] gestelde eisen.

      2 Het is de eigenaar voorts verboden leidingwater te bereiden uit oppervlaktewater, vallende in een der
      in [artikel 17][ref2], bedoelde kwaliteitsklassen, tenzij het water tevoren is behandeld op een bij de
      kwaliteitsklasse passende wijze, aangegeven in de bij dit besluit behorende [bijlage E][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002339
      [ref2]: https://wetten.overheid.nl/BWBR0002339#Artikel17a
      [ref3]: https://wetten.overheid.nl/BWBR0002339
    url: https://wetten.overheid.nl/BWBR0002339/2010-10-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0002339
      - id: ref2
        bwb_id: BWBR0002339
        artikel: 17a
        hoofdstuk: IIIA
      - id: ref3
        bwb_id: BWBR0002339
  - number: 17d
    text: |-
      De in [artikel 17][ref1] gestelde verboden gelden niet:

      a. indien overschrijding van de in [bijlage D][ref2] genoemde waarden het gevolg is van overstromingen of
      natuurrampen;

      b. in de in [bijlage D][ref3] aangegeven gevallen: indien overschrijding van de waarden het gevolg is van
      uitzonderlijke weersomstandigheden.

      c. in de periode die ligt tussen het indienen van een aanvraag om ontheffing als bedoeld in [artikel 17][ref4] en
      de vierde dag na het tijdstip waarop Onze Minister zijn besluit met betrekking tot een ontheffing aan de aanvrager
      heeft toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002339#Artikel17c
      [ref2]: https://wetten.overheid.nl/BWBR0002339
      [ref3]: https://wetten.overheid.nl/BWBR0002339
      [ref4]: https://wetten.overheid.nl/BWBR0002339#Artikel17e
    url: https://wetten.overheid.nl/BWBR0002339/2010-10-01#Artikel17d
    references:
      - id: ref1
        bwb_id: BWBR0002339
        artikel: 17c
        hoofdstuk: IIIA
      - id: ref2
        bwb_id: BWBR0002339
      - id: ref3
        bwb_id: BWBR0002339
      - id: ref4
        bwb_id: BWBR0002339
        artikel: 17e
        hoofdstuk: IIIA
  - number: 17e
    text: |-
      1 Onze Minister kan ontheffing verlenen van het in [artikel 17][ref1], gestelde verbod indien:

      a. de eigenaar een zodanige behandeling - met inbegrip van menging - van het water kan toepassen dat het bereide
      leidingwater voldoet aan de in dit besluit ten aanzien van leidingwater gestelde eisen;

      b. de eigenaar is aangewezen op oppervlaktewater dat niet voldoet aan kwaliteitsklasse III, en het gebruik van dat
      water geen onaanvaardbaar risico voor de volksgezondheid meebrengt.

      2 Onze Minister kan voorts, indien het belang van de volksgezondheid zich daartegen niet verzet, ontheffing
      verlenen van de in [artikel 17][ref2] gestelde verboden:

      a. indien overschrijding van de in [bijlage D][ref3] genoemde waarden het gevolg is van de natuurlijke gesteldheid
      van de bodem en de invloed daarvan op het water.

      b. in de in [bijlage D][ref4] aangegeven gevallen:

        - indien overschrijding van de waarden plaatsvindt bij oppervlaktewater uit meren met een diepte van ten hoogste
      20 meter, waarin de vervanging van het water meer dan een jaar in beslag neemt en waarin geen afvalwater wordt
      geloosd;
        - indien de overschrijding van de waarden het gevolg is van uitzonderlijke geografische omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0002339#Artikel17c
      [ref2]: https://wetten.overheid.nl/BWBR0002339#Artikel17c
      [ref3]: https://wetten.overheid.nl/BWBR0002339
      [ref4]: https://wetten.overheid.nl/BWBR0002339
    url: https://wetten.overheid.nl/BWBR0002339/2010-10-01#Artikel17e
