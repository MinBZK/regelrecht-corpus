  - number: '11'
    text: |-
      1 De eigenaar draagt zorg, dat:

      a. de door het pompstation afgeleverde hoeveelheden water voortdurend, of ten minste elk uur, worden geregistreerd;

      b. op een aantal door de inspecteur aan te wijzen plaatsen in het distributiegebied de druk van het water
      voortdurend wordt geregistreerd.

      2 De eigenaar draagt zorg de in het voorgaande lid bedoelde gegevens gedurende ten minste vijf jaar beschikbaar
      te hebben.

      3 Het eerste en tweede lid gelden niet voor de eigenaar van een collectieve watervoorziening of van een collectief
      leidingnet.
    url: https://wetten.overheid.nl/BWBR0002339/2010-10-01#Artikel11
  - number: '14'
    text: |-
      Onverminderd de voorgaande artikelen draagt degene, aan wie middellijk of onmiddellijk op het leidingnet van een
      waterleidingbedrijf, van een collectieve watervoorziening of van een collectief leidingnet aangesloten leidingen
      en toestellen behoren, zorg dat deze redelijkerwijs geen gevaar voor verontreiniging van dat leidingnet en van het
      door middel van deze leidingen en toestellen aan derden ter beschikking gestelde leidingwater kunnen opleveren.
    url: https://wetten.overheid.nl/BWBR0002339/2010-10-01#Artikel14
  - number: '15'
    text: |-
      1 De eigenaar van een waterleidingbedrijf controleert de middellijk of onmiddellijk op het leidingnet van zijn
      bedrijf aangesloten woninginstallaties, collectieve watervoorzieningen, collectieve leidingnetten en overige
      leidingwaterinstallaties op gevaar voor verontreiniging van het leidingnet van zijn bedrijf.

      2 De eigenaar van een waterleidingbedrijf controleert tevens de middellijk of onmiddellijk op het leidingnet van
      zijn bedrijf aangesloten collectieve watervoorzieningen en collectieve leidingnetten op gevaar voor verontreiniging
      van het aan derden ter beschikking gestelde leidingwater.

      3 Indien bij een controle als bedoeld in het tweede lid blijkt dat niet wordt voldaan aan de
      [artikelen 4, eerste of tweede lid][ref1], of [17j, eerste lid][ref2], of dat daarvoor gevaar bestaat, informeert
      de eigenaar van het waterleidingbedrijf terstond de toezichthouder en de desbetreffende eigenaar van de op zijn
      leidingnet aangesloten collectieve watervoorziening of collectief leidingnet.

      4 Degene, aan wie de in het eerste en tweede lid bedoelde collectieve watervoorzieningen, collectieve leidingnetten
      en overige leidingwaterinstallaties toebehoren, is verplicht medewerking te verlenen aan de controle, bedoeld in
      het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002339#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002339#Artikel17j
    url: https://wetten.overheid.nl/BWBR0002339/2010-10-01#Artikel15
