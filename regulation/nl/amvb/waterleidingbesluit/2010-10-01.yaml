  - number: '5'
    text: |-
      1 De eigenaar draagt zorg, op de wijze en in de mate, welke redelijkerwijs van hem kunnen worden gevergd, dat:

      1°. de middelen tot winning, behandeling, opslag, transport en distributie van water zo zijn ingericht, worden
      gebruikt en onderhouden, dat geen verontreiniging van het water plaatsvindt;

      2°. het distributienet zo is ingericht, dat gebreken geredelijk kunnen worden opgeheven onder zo gering mogelijke
      belemmering van de distributie;

      3°. het leidingnet van een collectieve watervoorziening, voor zover dat geen deel uitmaakt van een gebouw als
      bedoeld in [artikel 1, eerste lid, onder c, van de Woningwet][ref1], voldoet aan NEN 1006, bedoeld in de Regeling
      [Bouwbesluit 2003][ref2];

      4°. van de middelen tot winning, behandeling, opslag, transport en distributie van water tekeningen beschikbaar
      zijn, waarop de ligging en inrichting daarvan zijn aangegeven;

      5°. de werkzaamheden in het bedrijf zo worden verricht, dat geen verontreiniging van het water plaatsvindt;

      6e. de middelen tot opslag, transport en distributie van leidingwater na het verrichten van werkzaamheden daaraan
      zo worden ontsmet of gereinigd dat daarbij opgetreden verontreinigingen geheel onschadelijk gemaakt of verwijderd
      worden.

      2 Het eerste lid, onder 2°, geldt niet voor de eigenaar van een collectieve watervoorziening.

      3 Het eerste lid, aanhef en onder 3°, is van overeenkomstige toepassing op de eigenaar van
      een collectief leidingnet, voor zover dat geen deel uitmaakt van een gebouw als bedoeld in
      [artikel 1, eerste lid, onder c, van de Woningwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0012727
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel1
