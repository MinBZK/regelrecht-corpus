        artikel: '4'
  - number: '4'
    text: |-
      1 Leidingwater dat de eigenaar aan derden ter beschikking stelt, bevat geen micro-organismen, parasieten of stoffen
      in aantallen per volume-eenheid of concentraties die nadelige gevolgen voor de volksgezondheid kunnen hebben.

      2 Leidingwater voldoet op het punt waar het binnen een gebouw of perceel aan de tappunten ter beschikking komt, aan
      de tabellen I, II en III, opgenomen in [bijlage A][ref1].

      3 Indien leidingwater niet voldoet aan het eerste lid of aan de in het tweede lid genoemde tabellen I en II is de
      eigenaar verplicht:

      a. terstond onderzoek te doen naar de oorzaak en de mogelijke nadelige gevolgen daarvan voor de volksgezondheid,

      b. zo spoedig mogelijk herstelmaatregelen in het belang van de volksgezondheid te nemen waardoor het leidingwater
      voldoet aan het eerste lid en de genoemde tabellen I en II en

      c. terstond de toezichthouder te informeren over het niet voldoen aan het eerste lid of aan de in het tweede lid
      genoemde tabellen I en II en over de wijze waarop uitvoering wordt gegeven aan het bepaalde onder a en b.

      4 Indien een ander dan de eigenaar constateert dat leidingwater niet voldoet aan het eerste lid of aan de in het
      tweede lid genoemde tabellen I en II, brengt hij de eigenaar terstond op de hoogte.

      5 In gevallen als bedoeld in het derde lid informeert de eigenaar terstond de verbruikers over de
      normoverschrijding en adviseert hij henomtrent de maatregelen die zij kunnen nemen om nadelige gevolgen voor de
      gezondheid te voorkomen.

      6 Het vijfde lid is van overeenkomstige toepassing op de eigenaar van een collectief leidingnet.

      7 De eigenaar van een collectieve watervoorziening draagt er zorg voor dat voor de bereiding van warm tapwater
      uitsluitend water wordt gebruikt dat voldoet aan de tabellen I, II en III, opgenomen in [bijlage A][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002339
      [ref2]: https://wetten.overheid.nl/BWBR0002339
