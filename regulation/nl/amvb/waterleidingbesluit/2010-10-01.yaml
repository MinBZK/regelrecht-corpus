  - number: 17j
    text: |-
      1 Leidingwater dat op een zodanige wijze aan de tappunten ter beschikking komt of wordt gebruikt, dat daarbij
      aërosolen alsmede daardoor, al dan niet samen met andere micro-organismen, meegevoerde legionellabacteriën kunnen
      vrijkomen in hoeveelheden die, in geval van inademing, nadelige gevolgen voor de volksgezondheid kunnen hebben,
      bevat minder dan 100 kolonie vormende eenheden legionellabacteriën per liter.

      2 De eigenaar van een collectieve watervoorziening of een collectief leidingnet draagt er zorg voor dat het door
      hem aan derden ter beschikking gestelde leidingwater op het punt van aflevering voldoet aan het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002339/2010-10-01#Artikel17j
  - number: 17k
    text: |-
      1 De eigenaar van een collectieve watervoorziening voert een risicoanalyse uit met betrekking tot het risico,
      dat niet wordt voldaan aan [artikel 4, zevende lid][ref1], of [artikel 17j, eerste lid][ref2], overeenkomstig de
      daarvoor in [bijlage F][ref3] opgenomen voorschriften.

      2 De eigenaar van een collectief leidingnet voert een risicoanalyse uit met betrekking tot het risico,
      dat niet wordt voldaan aan [artikel 17j, eerste lid][ref4], ten gevolge van een omstandigheid als bedoeld
      in [artikel 15e, eerste lid, van de wet][ref5], overeenkomstig de daarvoor in [bijlage F][ref6] opgenomen
      voorschriften.

      3 De risicoanalyse, bedoeld in het eerste of tweede lid, wordt voorafgaand aan de ingebruikneming van de
      collectieve watervoorziening, onderscheidenlijk het collectieve leidingnet, uitgevoerd.

      4 Binnen drie maanden na iedere voor het in het eerste of tweede lid bedoelde risico relevante wijziging van de
      collectieve watervoorziening, onderscheidenlijk het collectieve leidingnet, of het gebruik daarvan, dan wel van
      een wijziging van factoren die invloed kunnen hebben op dat risico, wordt de risicoanalyse, bedoeld in het eerste,
      onderscheidenlijk tweede lid, opnieuw uitgevoerd. De eerste volzin heeft geen betrekking op wijzigingen die zijn
      toegepast op grond van [artikel 17n, eerste lid][ref7], of [artikel 17o, eerste lid][ref8].

      5 De eigenaar van de collectieve watervoorziening of het collectieve leidingnet draagt er zorg voor dat de
      uitkomsten van de op grond van het eerste, tweede of vierde lid uitgevoerde risicoanalyse, met een overzicht van
      de daarbij gebruikte gegevens en de genomen maatregelen, voor de toezichthouder ter inzage liggen ter plaatse van
      de collectieve watervoorziening, onderscheidenlijk het collectieve leidingnet, en aan de toezichthouder op zijn
      verzoek worden toegezonden in een door hem aangegeven vorm.

      6 Indien de toezichthouder van oordeel is dat de risicoanalyse, bedoeld in het eerste, tweede of vierde
      lid, onjuist of onvolledig is uitgevoerd dan wel anderszins niet voldoet aan de voorschriften, opgenomen in
      [bijlage F][ref9], kan hij de eigenaar, bedoeld in het eerste of tweede lid, verplichten tot het wijzigen,
      aanvullen of opnieuw uitvoeren van de risicoanalyse binnen een daarbij aangegeven termijn. Het vijfde lid is van
      overeenkomstige toepassing.


