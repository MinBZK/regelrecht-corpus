  - number: '20'
    text: |-
      De ziekten, bedoeld in [artikel 11, eerste lid, der Waterleidingwet][ref1], zijn:

      febris typhoïdea,

      paratyfus B (salmonellose Schotmüller),

      andere salmonellosen,

      dysenteria amoebica,

      dysenteria bacillaris,

      hepatitis infectiosa,

      poliomyelitis anterior acuta.


      [ref1]: https://wetten.overheid.nl/BWBR0002246#Artikel11
    url: https://wetten.overheid.nl/BWBR0002339/2010-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002246
        artikel: '11'
  - number: '21'
    text: |-
      1 De eigenaar houdt een register, waarin de namen, geboortedata, woonplaatsen, adressen en functies zijn
      vermeld van de leden van het personeel van zijn bedrijf, tot wier taak behoort werkzaamheden, als bedoeld in
      [artikel 18, eerste lid][ref1], te verrichten.

      2 De eigenaar zendt onverwijld afschriften van dit register en van alle daarin aangebrachte aanvullingen en
      wijzigingen aan degene, die is belast met het geneeskundige onderzoek en aan de inspecteur, voor zover deze zulks
      verlangen.

      3 De eigenaar stelt de inspecteur in kennis van de naam, de woonplaats en het adres van degene, die zich ingevolge
      [artikel 18, eerste lid][ref2], met het geneeskundige onderzoek heeft belast.

      4 De eigenaar stelt degene, die is belast met het geneeskundige onderzoek en de inspecteur, voor
      zover deze zulks verlangt, in kennis van alle aangiften, welke hem ingevolge het bepaalde in
      [artikel 11, tweede lid, der Waterleidingwet][ref3] door de leden van het personeel van zijn bedrijf worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002339#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002339#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0002246#Artikel11
