  - number: 17l
    text: |-
      1 Indien uit de risicoanalyse, bedoeld in [artikel 17k, eerste, tweede of vierde lid][ref1], blijkt dat er een
      risico is dat niet wordt voldaan aan [artikel 4, zevende lid][ref2], of [artikel 17j, eerste lid][ref3], stelt
      de eigenaar van de collectieve watervoorziening, onderscheidenlijk het collectieve leidingnet, op basis van de
      risicoanalyse een beheersplan op met betrekking tot de inrichting en het beheer van de collectieve watervoorziening
      of het collectieve leidingnet, dan wel herziet hij een daarop betrekking hebbend bestaand beheersplan. Het
      beheersplan strekt ertoe dat voldaan wordt aan [artikel 4, zevende lid][ref4], of [artikel 17j, eerste lid][ref5].

      2 Het beheersplan, bedoeld in het eerste lid, wordt voorafgaand aan de ingebruikneming van de collectieve
      watervoorziening of het collectieve leidingnet opgesteld.

      3 In het in [artikel 17k, vierde lid][ref6], bedoelde geval wordt het beheersplan binnen drie maanden na het
      tijdstip van gereedkomen van de in dat lid bedoelde risicoanalyse opgesteld, dan wel wordt een bestaand beheersplan
      binnen drie maanden na dat tijdstip herzien, indien de risicoanalyse daartoe aanleiding geeft.

      4 Het eerste tot en met derde lid zijn niet van toepassing voor zover de eigenaar, bedoeld in het eerste lid, het
      in dat lid bedoelde risico binnen drie maanden na het tijdstip van gereedkomen van de risicoanalyse opheft door
      zodanige wijzigingen in de collectieve watervoorziening of het collectieve leidingnet dat daardoor niet langer
      periodieke beheersmaatregelen zijn vereist.

      5 Het beheersplan omvat ten minste de volgende onderdelen:

      a. tekeningen of beschrijvingen waaruit de ligging en inrichting van de collectieve watervoorziening of het
      collectieve leidingnet blijkt;

      b. gegevens over de in de collectieve watervoorziening of het collectieve leidingnet opgenomen toestellen waarmee
      warm tapwater wordt bereid, leidingen en overige toestellen;

      c. gegevens over de herkomst, aard en kwaliteit van het water dat wordt gebruikt voor de bereiding van
      leidingwater, met inbegrip van warm tapwater;

      d. de uitkomsten van de uitgevoerde risicoanalyse;

      e. de maatregelen die zijn of worden genomen, de werkinstructies voor het uitvoeren van de maatregelen en de
      voorschriften die worden toegepast voor bediening, onderhoud en controle van de collectieve watervoorziening of het
      collectieve leidingnet, voor zover deze betrekking hebben op de beheersing van de bij de risicoanalyse aangetroffen
      risico’s, waarbij tevens wordt aangegeven wie door de eigenaar belast is met de uitvoering van de maatregelen,
      welke bevoegdheden daarvoor bestaan en op welke wijze en in welke frequentie de uitvoering plaatsvindt;

      f. de tappunten waarop en de frequentie waarin het leidingwater wordt onderzocht op de aanwezigheid van
      legionellabacteriën overeenkomstig [artikel 17q][ref7];

      g. in geval van een collectieve watervoorziening of een collectief leidingnet in een inrichting als bedoeld in
      [artikel 17i, eerste lid, onder a of b][ref8]: een omschrijving van de getroffen voorzieningen om het risico van
      verbranding bij personen, die vanwege hun lichamelijke of geestelijke gesteldheid niet of onvoldoende in staat zijn
      de temperatuur van het bij de lichaamsverzorging of anderszins gebruikte leidingwater op een veilig niveau in te
      stellen, te voorkomen;

      h. de maatregelen die worden genomen indien er aanwijzingen zijn dat niet wordt voldaan aan
      [artikel 4, zevende lid][ref9], of [artikel 17j, eerste lid][ref10].


