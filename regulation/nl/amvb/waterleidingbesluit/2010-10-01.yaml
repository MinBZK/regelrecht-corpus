  - number: '18'
    text: |-
      1 De eigenaar draagt zorg, dat een arts zich belast met het geneeskundige onderzoek van die leden van het personeel
      bij zijn bedrijf, die geregeld werkzaamheden verrichten bij aanleg, herstel, onderhoud of controle van middelen tot
      winning van grondwater of van middelen tot behandeling, opslag, vervoer of distributie van water, voor zover zij
      bij het verrichten van deze werkzaamheden middellijk of onmiddellijk het water kunnen besmetten.

      2 Bij verschil van inzicht tussen de eigenaar en de inspecteur omtrent de beantwoording van de vraag, of een lid
      van het personeel ingevolge het bepaalde in het eerste lid aan geneeskundig onderzoek moet worden onderworpen,
      beslist de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002339/2010-10-01#Artikel18
  - number: '19'
    text: |-
      1 Het geneeskundige onderzoek, bedoeld in [artikel 18, eerste lid][ref1], dat wordt verricht in verband
      met de indiensttreding of eerste tewerkstelling van personeelsleden voor werkzaamheden, als bedoeld in
      [artikel 18, eerste lid][ref2], omvat:

      a. voor de indiensttreding of eerste tewerkstelling het opnemen van de anamnese;

      b. voor de indiensttreding of eerste tewerkstelling ten minste één onderzoek van faeces en urine op de aanwezigheid
      van bacteriën van de geslachten Salmonella en Shigella;

      c. voor of terstond na de indiensttreding of eerste tewerkstelling een nader onderzoek, als bedoeld onder *b,* met
      dien verstande, dat dit onderzoek wordt verricht na verloop van tenminste één week na het eerste onderzoek;

      d. andere of nadere onderzoekingen op verlangen van de inspecteur.

      2 Ten aanzien van personeelsleden, die ingevolge [artikel 12, onder ][ref3] geen werkzaamheden verrichten, wordt
      een geneeskundig onderzoek, als bedoeld in [artikel 18][ref4], ingesteld, alvorens zij weder te werk worden
      gesteld.

      Dit onderzoek omvat:

      a. indien de inspecteur zulks verlangt, een of meer onderzoekingen, als bedoeld in het eerste lid, onder *b*;

      b. andere of nadere onderzoekingen op verlangen van de inspecteur.

      3 Het geneeskundige onderzoek, bedoeld in [artikel 18][ref5], dat wordt verricht met betrekking tot
      personeelsleden, anders dan in de gevallen, als bedoeld in het eerste en tweede lid, omvat zodanige onderzoekingen,
      als de inspecteur nodig oordeelt. De inspecteur kan bepalen, dat deze onderzoekingen meermalen of periodiek worden
      verricht.

      4 Voor zover laboratoriumonderzoek dient te worden verricht ten behoeve van de in dit artikel bedoelde
      onderzoekingen, maakt de daarmede belaste arts gebruik van de diensten van het Rijks Instituut voor de
      Volksgezondheid of van door Onze Minister of de inspecteur aan te wijzen laboratoria.


      [ref1]: https://wetten.overheid.nl/BWBR0002339#Artikel18
