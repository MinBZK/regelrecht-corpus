      [Hoofdstuk II][ref1], met uitzondering van de [artikelen 4, eerste lid][ref2], [4b tot en met 8][ref3], van
      de wet, [hoofdstuk IIA][ref4], met uitzondering van de [artikelen 15a, eerste en tweede lid][ref5], juncto
      [15b][ref6], van de wet, [hoofdstuk IIB][ref7], met uitzondering van [artikel 15e, tweede lid][ref8], alsmede de
      [hoofdstukken III][ref9] en [IV][ref10] van de wet, zijn niet van toepassing op huishoudwater, indien de kwaliteit
      van dit huishoudwater niet van invloed is op de gezondheid van de betrokken verbruikers.


