  - number: '3'
    text: |-
      De eigenaar wordt, voor zover hij de voorschriften van dit hoofdstuk naleeft, geacht te voldoen aan het bepaalde in
      [artikel 4, eerste lid der Waterleidingwet][ref1], doch alleen voor wat betreft de punten, welke bij het bepaalde
      in dit hoofdstuk uitdrukkelijk zijn geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002246#Artikel4
    url: https://wetten.overheid.nl/BWBR0002339/2010-10-01#Artikel3
