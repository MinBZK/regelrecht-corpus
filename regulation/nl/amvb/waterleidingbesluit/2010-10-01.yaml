  - number: '25'
    text: |-
      1 Gegevens als bedoeld in de [artikelen 6][ref1], [6a][ref2], [11][ref3] en [17a][ref4] zijn uiterlijk vier
      weken nadat deze bij de eigenaar of de eigenaar van een collectief leidingnet bekend zijn geworden voor een ieder
      toegankelijk.

      2 De eigenaar of de eigenaar van een collectief leidingnet, die op grond van [artikel 6][ref5] verplicht is tot het
      opstellen van een meetprogramma, stelt jaarlijks voor 1 april een overzicht op van de kwaliteit van het door hem
      geleverde leidingwater in het voorgaande kalenderjaar. Dit overzicht is openbaar en ligt ter inzage op een voor een
      ieder toegankelijke plaats. Het eerste overzicht stelt hij op voor 1 april 2003.


