  - number: '13'
    text: >-
      1 Het ontwerp, de bouw, de uitrusting en de bedrijfsvoering van een schip dat schadelijke vloeistoffen van de
      categorieën A, B of C in bulk vervoert, dienen zodanig te zijn dat het in zee geraken van deze vloeistoffen bij
      scheepsongevallen redelijkerwijs zoveel mogelijk wordt beperkt.


      2 Een chemicaliëntankschip gebouwd op of na 1 juli 1986 dient te voldoen aan de bij ministeriële regeling gestelde
      regels ter uitvoering van de Internationale Bulk Chemicaliën Code.


      3 Een chemicaliëntankschip gebouwd voor 1 juli 1986 dient te voldoen aan de bij ministeriële regeling gestelde
      regels ter uitvoering van de Bulk Chemicaliën Code.
    url: https://wetten.overheid.nl/BWBR0004306/2004-10-15#Artikel13
  - number: '14'
    text: |-
      1 Niettegenstaande het bepaalde in dit besluit mogen schadelijke vloeistoffen van de categorieën C of D, die
      door Onze Minister worden aangemerkt als olie-achtige stoffen, worden vervoerd en geloosd overeenkomstig de
      voorschriften van het [Besluit voorkoming olieverontreiniging door schepen][ref1], mits wordt voldaan aan alle
      onderstaande voorwaarden:

      a. het schip voldoet aan de van toepassing zijnde bepalingen voor een produktentankschip zoals vereist in genoemd
      besluit;

      b. het schip is voorzien van een Internationaal certificaat van voorkoming van verontreiniging door olie en het
      aanhangsel B en op dit certificaat is aangetekend welke olie-achtige stoffen het schip mag vervoeren; en

      c. het bewaking- en regelsysteem voor olielozingen is goedgekeurd voor het bewaken van de lozing van de te
      vervoeren olie-achtige stoffen.

      2 Voor een schip dat een vloeistof van categorie C vervoert is het bepaalde in het eerste lid alleen van
      toepassing, indien tevens wordt voldaan aan:

      a. de stabiliteitscriteria voor een type III schip zoals genoemd in de Internationale Bulk Chemicaliën Code, indien
      het schip is gebouwd op of na 1 juli 1986; of

      b. de stabiliteitscriteria voor een type III schip zoals genoemd in de Bulk Chemicaliën Code, indien het schip is
      gebouwd voor 1 juli 1986.


      [ref1]: https://wetten.overheid.nl/BWBR0003936
    url: https://wetten.overheid.nl/BWBR0004306/2004-10-15#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003936
  - number: 14A
    text: >-
      1 Elk schip met een tonnage van 150 of meer waarvoor een Internationaal certificaat van voorkoming van
      verontreiniging voor het vervoer van schadelijke vloeistoffen in bulk is afgegeven, heeft een door het Hoofd van
      de Scheepvaartinspectie goedgekeurd scheepsnoodplan voor verontreiniging van de zee door schadelijke vloeistoffen
      aan boord.


      2 Een scheepsnoodplan voor verontreiniging van de zee door schadelijke vloeistoffen bevat ten minste:


      a. de procedure die de kapitein of een ander bemanningslid dat de leiding van het schip heeft, moet volgen voor het
      melden van een voorval van verontreiniging door schadelijke vloeistoffen;


      b. een lijst van autoriteiten of personen aan wie een voorval van verontreiniging door schadelijke vloeistoffen
      moet worden gemeld;


      c. een gedetailleerde beschrijving van de maatregelen welke de bemanning onmiddellijk moet nemen om de uitstroom
      van schadelijke vloeistoffen ten gevolge van een voorval zoveel mogelijk te beperken;


      d. de procedure en contactpersoon aan boord van het schip voor het coördineren van de maatregelen aan boord met
      nationale en plaatselijke autoriteiten bij het bestrijden van een verontreiniging door schadelijke vloeistoffen.


      3 Een schip waarop [artikel 26 van het Besluit voorkoming olieverontreiniging](onbekend) door schepen naast dit
      artikel van toepassing is, mag het scheepsnoodplan voor verontreiniging van de zee door schadelijke vloeistoffen
      combineren met het scheepsnoodplan voor olieverontreiniging, bedoeld in [dat artikel](onbekend). In dat geval is de
      titel van het plan: scheepsnoodplan voor verontreiniging van de zee.
    url: https://wetten.overheid.nl/BWBR0004306/2004-10-15#Artikel14A
  - number: '15'
    text: >-
      Ter uitvoering van internationale afspraken en besluiten van volkenrechtelijke organisaties over voorkoming van
      verontreiniging door met schepen in bulk vervoerde schadelijke vloeistoffen kunnen bij ministeriële regeling nadere
      regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004306/2004-10-15#Artikel15
  - number: '16'
    text: |-
      1 Het Hoofd van de Scheepvaartinspectie kan, indien bijzondere omstandigheden daartoe nopen, geheel of
      gedeeltelijke ontheffing verlenen van de bij of krachtens dit besluit gestelde regelen met betrekking tot de bouw,
      inrichting of uitrusting van een schip.

      2 Indien een ontheffing als bedoeld in het eerste lid wordt verleend aan een schip dat een certificaat behoeft als
      bedoeld in [artikel 11][ref1], dient daarvan aantekening te worden gemaakt op het certificaat.


