  - number: '2'
    text: |-
      1 Tenzij uitdrukkelijk anders bepaald, zijn de bepalingen van dit besluit van toepassing op alle schepen die
      schadelijke vloeistoffen in bulk vervoeren.

      2 Indien een lading waarop de bepalingen van het [Besluit voorkoming olieverontreiniging door schepen][ref1]
      (*Stb.* 1986, 160) van toepassing zijn, in de ladingtanks van een chemicaliëntankschip wordt vervoerd, dient
      eveneens te worden voldaan aan de desbetreffende voorschriften van dat besluit.

      3 Het bepaalde in [artikel 13][ref2] is alleen van toepassing op schepen waarin vloeistoffen worden vervoerd die
      zijn ingedeeld in de categorieën A, B of C, bedoeld in [artikel 3][ref3].

      4 Elk schip, gebouwd voor 1 juli 1986, dient met ingang van 1 januari 1988 te voldoen aan de bepalingen
      voor het lozen onder de waterlijn en voor de maximale concentratie in het kielzog van het schip, bedoeld in
      [artikel 5][ref4].

      5 Het Hoofd van de Scheepvaartinspectie kan het aanbrengen van andere onderdelen, materialen, voorzieningen of
      apparatuur, dan die welke in dit besluit worden voorgeschreven, in een schip toestaan, mits deze ten minste even
      doelmatig zijn als die welke in dit besluit worden vereist. In geen geval zullen vormen van ontwerp en constructie
      ter regeling van het lozen van schadelijke vloeistoffen, zoals deze in dit besluit zijn voorgeschreven, kunnen
      worden vervangen door operationele methoden.


