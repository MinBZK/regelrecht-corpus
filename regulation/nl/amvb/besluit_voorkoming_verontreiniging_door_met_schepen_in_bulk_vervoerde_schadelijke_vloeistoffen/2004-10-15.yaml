  - number: '9'
    text: |-
      1 Elk schip waarop dit besluit van toepassing is, moet zijn voorzien van een ladingjournaal ingericht
      overeenkomstig het model als aangegeven in Aanhangsel IV van Bijlage II van het Verdrag.

      2 Het ladingjournaal dient, voor elke tank afzonderlijk, te worden ingevuld telkens wanneer een van de volgende
      handelingen aan boord plaatsvindt:

      a. het innemen van lading;

      b. het overbrengen van lading van de ene tank naar een andere tank;

      c. het lossen van lading;

      d. het schoonmaken van ladingtanks;

      e. het ballasten van ladingtanks;

      f. het ontballasten van ladingtanks;

      g. het afgeven van restanten aan havenontvangstvoorzieningen; en

      h. het lozen in zee, of het ventileren van tanks, overeenkomstig het bepaalde in [artikel 5][ref1].

      3 Indien schadelijke vloeistoffen of mengsels die dergelijke vloeistoffen bevatten worden geloosd overeenkomstig
      het bepaalde in [artikel 6][ref2], hetzij opzettelijk hetzij per ongeluk, dient melding in het ladingjournaal te
      worden gemaakt van de omstandigheden waaronder en de redenen waarom de lozing geschiedde.

      4 a. Elke handeling als bedoeld in het tweede en derde lid dient onverwijld en volledig te worden vermeld in het
      ladingjournaal en wel zodanig dat alle rubrieken die betrekking hebben op de handeling, worden ingevuld. Deze
      vermelding dient in de Nederlandse en in de Engelse taal te worden gesteld.

      b. Elke aantekening in het ladingjournaal moet door een officier of de officieren, belast met het toezicht op de
      betreffende handelingen, worden ondertekend. Elk ingevulde bladzijde van het ladingjournaal moet worden ondertekend
      door de kapitein.

      5 Het ladingjournaal moet, behalve in geval van een onbemand gesleept schip, op een zodanige plaats aan boord
      worden bewaard dat het op elk redelijk tijdstip beschikbaar is voor onderzoek door de daartoe bevoegde autoriteit.
      Het ladingjournaal moet gedurende een periode van drie jaren na dagtekening van de laatste aantekening worden
      bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004306#Artikel6
