  - number: '12'
    text: |-
      1 Het Internationaal certificaat van voorkoming van verontreiniging voor het vervoer van schadelijke vloeistoffen
      in bulk wordt door het Hoofd van de Scheepvaartinspectie afgegeven voor een periode van ten hoogste vijf jaar.

      2 In afwijking van het eerste lid is, indien het hernieuwde onderzoek binnen drie maanden voor de vervaldatum
      van het bestaande certificaat wordt voltooid, het nieuwe certificaat geldig vanaf de datum van voltooiing van dit
      onderzoek tot een datum niet later dan vijf jaar na de vervaldatum van het bestaande certificaat.

      3 Onverminderd het eerste lid is, indien het hernieuwde onderzoek binnen drie maanden na de vervaldatum van het
      bestaande certificaat wordt voltooid, het nieuwe certificaat geldig vanaf de datum van voltooiing van dit onderzoek
      tot een datum niet later dan vijf jaar na de vervaldatum van het bestaande certificaat.

      4 Indien een certificaat wordt afgegeven voor een periode korter dan vijf jaar, kan het Hoofd van de
      Scheepvaartinspectie na de voltooiing van een tussentijds of jaarlijks onderzoek de geldigheidsduur van het
      certificaat verlengen tot een periode van vijf jaar.

      5 Indien een hernieuwd onderzoek wordt voltooid en indien geen nieuw certificaat ten behoeve van het schip kan
      worden afgegeven voor de vervaldatum van het bestaande certificaat, kan daarvan een aantekening op het bestaande
      certificaat worden geplaatst. In afwijking van het eerste lid wordt in dat geval de geldigheidsduur van het
      certificaat verlengd voor een periode van niet langer dan vijf maanden na de vervaldatum.

      6 In afwijking van het eerste lid kan, indien een schip zich op het tijdstip waarop het certificaat zijn
      geldigheid verliest niet in een haven bevindt waar het hernieuwde onderzoek kan plaatsvinden, het Hoofd van
      de Scheepvaartinspectie de geldigheidsduur van het certificaat verlengen voor een periode van ten hoogste drie
      maanden na de vervaldatum, uitsluitend om het schip in staat te stellen de reis naar de haven waar het moet worden
      onderzocht te voltooien. Na de voltooiing van het hernieuwde onderzoek in die haven is het nieuwe certificaat
      geldig tot een datum niet later dan vijf jaar na de oorspronkelijke vervaldatum van het bestaande certificaat.

      7 In afwijking van het eerste lid kan, indien een certificaat is afgegeven ten behoeve van een schip dat korte
      reizen maakt en de geldigheidsduur van het certificaat niet is verlengd ingevolge een van de andere leden, het
      Hoofd van de Scheepvaartinspectie de geldigheidsduur van het certificaat verlengen voor een periode van ten hoogste
      een maand na de vervaldatum. Na de voltooiing van het hernieuwde onderzoek is het nieuwe certificaat geldig tot een
      datum niet later dan vijf jaar na de oorspronkelijke vervaldatum van het bestaande certificaat.

      8 In bijzondere omstandigheden behoeft een nieuw certificaat niet te worden gedateerd vanaf de vervaldatum van
      het bestaande certificaat. Na de voltooiing van het hernieuwde onderzoek in deze bijzondere omstandigheden is het
      nieuwe certificaat geldig tot een datum niet later dan vijf jaar na de datum van voltooiing van het hernieuwde
      onderzoek.

      9 Indien een tussentijds of jaarlijks onderzoek wordt voltooid voor de aanvang van de periode waarin het dient
      plaats te vinden, worden er, voorzover van toepassing, een of meer aanvullende tussentijdse of jaarlijkse
      onderzoeken verricht, zodat de maximale tussenpozen tussen de onderzoeken, bedoeld in [artikel 10][ref1], niet
      worden overschreden.

      10 a. Het certificaat verliest zijn geldigheid wanneer:

      1°. de op het certificaat aangegeven periode van geldigheid is verstreken;

      2°. het tussentijds of jaarlijks onderzoek niet is uitgevoerd binnen de gestelde periode danwel indien daarvan geen
      aantekening is gemaakt op het certificaat;

      3°. het schip ophoudt te behoren tot de categorie van schepen, waarop dit besluit van toepassing is;

      4°. de bouw, uitrusting, systemen, onderdelen, voorzieningen en materialen van het schip op ingrijpende wijze
      worden gewijzigd zonder de toestemming van het Hoofd van de Scheepvaartinspectie tenzij het de onmiddellijke
      vervanging van dergelijke uitrusting en onderdelen betreft;

      5°. de naam van het schip wordt veranderd of het schip een andere roepnaam krijgt. In dat geval wordt op aanvraag
      een nieuw certificaat afgegeven voor het nog niet verstreken gedeelte van het tijdvak, waarvoor het vervallen
      certificaat zou hebben gegolden; en

      6°. het schip niet meer gerechtigd is de Nederlandse vlag te voeren.

      b. Een vervallen certificaat moet door de eigenaar van het schip zo spoedig mogelijk aan het Hoofd van de
      Scheepvaartinspectie worden ingezonden door tussenkomst van de ambtenaren van de Scheepvaartinspectie, de
      ambtenaren met de in- of uitklaring belast, dan wel de Nederlandse diplomatieke of consulaire ambtenaren.

      c. Voor een ingezonden certificaat wordt desverlangd een bewijs van ontvangst afgegeven.

      11 a. Een certificaat kan door de bevoegde ambtenaar van de Scheepvaartinspectie worden ingetrokken:

      1°. wanneer het schip schade van betekenis heeft opgelopen en de herstelling daarvan niet naar behoren is geschied;
      of

      2°. wanneer uit een onderzoek is gebleken dat het schip niet zonder gevaar voor verontreiniging van het mariene
      milieu de haven kan verlaten.

      b. Indien een certificaat wordt ingetrokken, wordt de eigenaar van het schip zo spoedig mogelijk bericht gezonden,
      onder vermelding van de redenen, welke tot de intrekking hebben geleid.

      12 In afwijking van het tiende lid, onder *a*, 2°, kan het Hoofd van de Scheepvaartinspectie, indien het
      certificaat zijn geldigheid heeft verloren omdat een tussentijds of jaarlijks onderzoek niet binnen de gestelde
      periode is verricht, in bijzondere omstandigheden de geldigheid van het certificaat herstellen, nadat door middel
      van een inspectie is vastgesteld dat het schip voldoet aan de regels bij of krachtens dit besluit gesteld. De
      omvang van deze inspectie is ter beoordeling van het Hoofd van de Scheepvaartinspectie.


