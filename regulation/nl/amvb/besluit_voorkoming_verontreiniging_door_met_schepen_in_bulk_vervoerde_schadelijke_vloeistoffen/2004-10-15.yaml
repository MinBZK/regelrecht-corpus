  - number: '6'
    text: |-
      Het lozingsverbod, bedoeld in [artikel 5][ref1] is niet van toepassing op het lozen in zee van schadelijke
      vloeistoffen of mengsels die dergelijke vloeistoffen bevatten:

      a. indien dit noodzakelijk is om de veiligheid van het schip zeker te stellen of mensenlevens op zee te redden; of

      b. in geval van schade aan het schip of aan de uitrusting daarvan mits na het ontstaan van de schade of na het
      ontdekken van de lozing alle redelijke voorzorgen zijn getroffen om de lozing te voorkomen of tot een minimum te
      beperken, uitgezonderd in geval de kapitein of de eigenaar handelde met de bedoeling om schade te veroorzaken,
      ofwel roekeloos handelde en in de wetenschap dat er waarschijnlijk schade zou ontstaan;

      of

      c. met toestemming van Onze Minister, indien dit geschiedt met het doel bepaalde verontreinigingsvoorvallen te
      bestrijden teneinde de schade door verontreiniging tot een minimum te beperken.


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel5
    url: https://wetten.overheid.nl/BWBR0004306/2004-10-15#Artikel6
