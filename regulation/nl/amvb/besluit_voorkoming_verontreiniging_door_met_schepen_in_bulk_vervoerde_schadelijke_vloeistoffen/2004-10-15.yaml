  - number: '8'
    text: |-
      1 a. De kapitein van een schip, dat schadelijke vloeistoffen in bulk vervoert dient zorg te dragen dat gehandeld
      wordt in overeenstemming met het bepaalde in [artikel 5][ref1] en dit artikel. Hij dient het ladingjournaal
      volledig te doen bijhouden, indien handelingen als bedoeld in [artikel 9][ref2] plaatsvinden.

      b. Onze Minister kan bepalen dat de kapitein zorg draagt dat het schip alvorens het naar zee vertrekt voorzien is
      van een schriftelijk bewijs, afgegeven door een door Onze Minister erkende instantie, waaruit blijkt dat is voldaan
      aan het bepaalde onder *a*.

      c. Een ontheffing als bedoeld in het tweede lid, onder *b*, het vijfde lid, onder *b*, het zesde lid, onder *c* of
      het zevende lid, onder *c*, kan alleen worden verleend door de daartoe ter plaatse bevoegde autoriteit alwaar het
      schip een lading lost. Van een dergelijke ontheffing dient aantekening te worden gemaakt in het ladingjournaal.
      Deze aantekening dient door de daartoe ter plaatse bevoegde autoriteit te worden gewaarmerkt.

      2 Bepalingen voor categorie A vloeistoffen, zowel binnen als buiten een bijzonder gebied

      Met betrekking tot een vloeistof van categorie A zijn de navolgende bepalingen van toepassing:

      a. behoudens het bepaalde onder *b* dient een tank, waaruit de lading is gelost, te worden gewassen overeenkomstig
      het bepaalde in het derde en vierde lid voordat het schip uit de loshaven vertrekt;

      b. de kapitein van een schip kan de bevoegde autoriteit van de plaats waar het schip de lading lost, verzoeken te
      worden ontheven van het bepaalde onder *a*, indien wordt voldaan aan het navolgende:

      1°. de tank, die is leeg gelost, wordt opnieuw geladen met dezelfde vloeistof of met een vloeistof die verenigbaar
      is met de vorige en de uitgeloste tank wordt niet gewassen of geballast alvorens deze opnieuw wordt beladen; of

      2°. de tank, die is leeg gelost, wordt op zee niet gewassen of geballast en aan de voorschriften van het derde
      en het vierde lid wordt voldaan in een volgende haven, voor welke haven schriftelijk is bevestigd dat voldoende
      havenontvangstvoorzieningen voor dat doel aanwezig zijn; of

      3°. de ladingrestanten in een tank worden verwijderd door middel van een methode van ventilatie als bedoeld in
      de Standards.

      3 Indien een tank wordt gewassen overeenkomstig het bepaalde in het tweede lid, onder *a*, dient het aldus ontstane
      waswater te worden afgegeven aan een havenontvangstvoorziening totdat de concentratie van de vloeistof in het af
      te geven mengsel is gedaald tot of onder de waarde zoals wordt aangegeven door Onze Minister en vervolgens totdat
      de tank is leeg gemaakt. De concentratie dient te worden gemeten aan de hand van een monster dat genomen wordt
      door de daartoe ter plaatse bevoegde autoriteit nabij de losaansluiting van het schip. Van deze handelingen dient
      aantekening te worden gehouden in het ladingjournaal, bedoeld in [artikel 9][ref3] en deze aantekening moet worden
      gewaarmerkt door de daartoe ter plaatse bevoegde autoriteit.

      4 Indien de daartoe ter plaatse bevoegde autoriteit er van overtuigd is dat het niet redelijk en uitvoerbaar is om
      de concentratie in een af te geven mengsel te meten zonder daarbij onnodig oponthoud voor het schip te veroorzaken,
      kan een andere methode worden aanvaard als gelijkwaardig aan het bepaalde in het derde lid mits:

      a. een voorwas van de tank plaatsvindt volgens een methode als bedoeld in de Standards; en

      b. de daartoe bevoegde autoriteit bevestigt in het ladingjournaal:

      1°. dat de tank en de daarbij behorende pompen en pijpleidingen zijn leeggemaakt; en

      2°. dat de voorwas van de tank, bedoeld onder *a*, is uitgevoerd; en

      3°. dat het aldus ontstane waswater is afgegeven aan een havenontvangstvoorziening totdat de tank leeg is.

      5 Bepalingen voor categorie B en C vloeistoffen, buiten een bijzonder gebied

      Buiten een bijzonder gebied zijn met betrekking tot een vloeistof van categorie B of C de navolgende bepalingen
      van toepassing:

      a. behoudens het bepaalde onder *b*, dient een tank waaruit de lading is gelost te worden voorgewassen volgens
      een methode als bedoeld in de Standards voordat het schip uit de loshaven vertrekt en het waswater dient te worden
      afgegeven aan een havenontvangstvoorziening in de loshaven, wanneer:

      1°. de geloste vloeistof zodanige eigenschappen heeft dat de hoeveelheid van het in de tank achterblijvende restant
      na het lossen van de tank overeenkomstig de Standards, groter is dan 1 m3 of 1/3000ste van de tankinhoud, welke van
      de twee de grootste is, indien het een vloeistof van categorie B betreft, of groter is dan 3 m3 of 1/1000ste van de
      tankinhoud, welke van de twee de grootste is, indien het een vloeistof van categorie C betreft; of

      2°. het lossen niet is uitgevoerd overeenkomstig de Standards tenzij zodanige maatregelen zijn genomen, dat, ten
      genoegen van de ter plaatse bevoegde autoriteit, de restanten zodanig worden verwijderd dat de achterblijvende
      hoeveelheid niet groter is dan die, bedoeld in [artikel 5A, eerste, tweede, derde of vierde lid][ref4], al naar
      gelang van toepassing;

      b. de kapitein van een schip kan de bevoegde autoriteit van de plaats waar het schip de lading lost, verzoeken te
      worden ontheven van het bepaalde onder *a*, indien wordt voldaan aan het navolgende:

      1°. de tank, die is leeg gelost, wordt opnieuw geladen met dezelfde vloeistof of met een vloeistof die verenigbaar
      met de vorige en de uitgeloste tank wordt niet gewassen of geballast alvorens deze opnieuw wordt beladen; of

      2°. de tank, die is leeg gelost, wordt op zee niet gewassen of geballast en de tank wordt voorgewassen volgens een
      methode als bedoeld in de Standards en het waswater wordt afgegeven aan een havenontvangstvoorziening in een andere
      haven, voor welke haven schriftelijk is bevestigd dat voldoende havenontvangstvoorzieningen voor dat doel aanwezig
      zijn; of

      3°. de ladingrestanten in een tank worden verwijderd door middel van een methode voor ventilatie als bedoeld in
      de Standards.

      6 Bepalingen voor categorie B vloeistoffen, binnen een bijzonder gebied

      Binnen een bijzonder gebied zijn met betrekking tot een vloeistof van categorie B de navolgende bepalingen van
      toepassing:

      a. behoudens het bepaalde onder *b* en *c*, dient een tank waaruit de lading is gelost te worden voorgewassen
      volgens een methode als bedoeld in de Standards voordat het schip uit de loshaven vertrekt en het waswater dient te
      worden afgegeven aan een havenontvangstvoorziening in de loshaven;

      b. het bepaalde onder *a* is niet van toepassing indien wordt voldaan aan alle onderstaande voorwaarden:

      1°. de geloste vloeistof heeft zodanige eigenschappen dat de hoeveelheid van het in de tank achterblijvende restant
      na het lossen van de tank overeenkomstig de Standards, niet groter is dan 1 m3 of 1/3000ste van de tankinhoud,
      welke van de twee de grootste is en het restant wordt aan boord gehouden voor lozing in zee buiten een bijzonder
      gebied overeenkomstig het bepaalde van [artikel 5, derde lid][ref5]; en

      2°. het lossen is uitgevoerd overeenkomstig de Standards, tenzij zodanige maatregelen zijn genomen dat, ten
      genoegen van de ter plaatse bevoegde autoriteit, de restanten zodanig worden verwijderd dat de achterblijvende
      hoeveelheid niet groter is dan die, bedoeld in [artikel 5A, eerste of tweede lid][ref6], al naar gelang van
      toepassing;

      c. de kapitein van een schip kan de bevoegde autoriteit van de plaats waar het schip de lading lost, verzoeken te
      worden ontheven van het bepaalde onder *a*, indien wordt voldaan aan het navolgende:

      1°. de tank, die is leeg gelost, wordt opnieuw geladen met dezelfde vloeistof of met een vloeistof die verenigbaar
      is met de vorige en de uitgeloste tank wordt niet gewassen of geballast alvorens deze opnieuw wordt beladen; of

      2°. de tank, die is leeg gelost, wordt op zee niet gewassen of geballast en de tank wordt voorgewassen volgens een
      methode als bedoeld in de Standards en het waswater wordt afgegeven aan een havenontvangstvoorziening in een andere
      haven, voor welke haven schriftelijk is bevestigd dat voldoende havenontvangstvoorzieningen voor dat doel aanwezig
      zijn; of

      3°. de ladingrestanten in een tank worden verwijderd door middel van een methode van ventilatie als bedoeld in
      de Standards.

      7 Bepalingen voor categorie C vloeistoffen, binnen een bijzonder gebied

      Binnen een bijzonder gebied zijn met betrekking tot een vloeistof van categorie C de navolgende bepalingen van
      toepassing:

      a. behoudens het bepaalde onder *b* en *c*, dient een tank waaruit de lading is gelost te worden voorgewassen
      volgens een methode als bedoeld in de Standards voordat het schip de loshaven verlaat en het waswater dient te
      worden afgegeven aan een havenontvangstvoorziening in de loshaven, wanneer:

      1°. de geloste vloeistof zodanige eigenschappen heeft dat de hoeveelheid van het in de tank achterblijvende restant
      na het lossen van de tank overeenkomstig de Standards, groter is dan 1 m3 of 1/3000ste van de tankinhoud, welke van
      de twee de grootste is; of

      2°. het lossen niet is uitgevoerd overeenkomstig de Standards tenzij zodanige maatregelen zijn genomen dat, ten
      genoegen van de ter plaatse bevoegde autoriteit, de restanten zodanig worden verwijderd dat de achterblijvende
      hoeveelheid niet groter is dan die, bedoeld in [artikel 5A, derde of vierde lid][ref7], al naar gelang van
      toepassing;

      b. het bepaalde onder *a* is niet van toepassing indien wordt voldaan aan alle onderstaande voorwaarden:

      1°. de geloste vloeistof heeft zodanige eigenschappen dat de hoeveelheid van het in de tank achterblijvende restant
      na het lossen van de tank overeenkomstig de Standards, niet groter is dan 3 m3 of 1/1000ste van de tankinhoud,
      welke van de twee de grootste is en het restant wordt aan boord gehouden voor lozing in zee buiten een bijzonder
      gebied overeenkomstig het bepaalde in [artikel 5, vierde lid][ref8]; en

      2°. het lossen is uitgevoerd overeenkomstig de Standards, tenzij zodanige maatregelen zijn genomen dat, ten
      genoegen van de ter plaatse bevoegde autoriteit, de restanten zodanig worden verwijderd dat de achterblijvende
      hoeveelheid niet groter is dan die, bedoeld in [artikel 5A, derde of vierde lid][ref9], al naar gelang van
      toepassing;

      c. de kapitein van een schip kan de bevoegde autoriteit van de plaats waar het schip de lading lost, verzoeken te
      worden ontheven van het bepaalde onder *a*, indien wordt voldaan aan het navolgende:

      1°. de tank, die is leeg gelost, wordt opnieuw geladen met dezelfde vloeistof of met een vloeistof die verenigbaar
      is met de vorige en de uitgeloste tank wordt niet gewassen of geballast alvorens deze opnieuw wordt beladen; of

      2°. de tank, die is leeg gelost, wordt op zee niet gewassen of geballast en de tank wordt voorgewassen volgens een
      methode als bedoeld in de Standards en het waswater wordt afgegeven aan een havenontvangstvoorziening in een andere
      haven, voor welke haven schriftelijk is bevestigd dat voldoende havenontvangstvoorzieningen voor dat doel aanwezig
      zijn; of

      3°. de ladingrestanten in een tank worden verwijderd door middel van een methode van ventilatie als bedoeld in
      de Standards.

      8 Bepalingen voor categorie D vloeistoffen, zowel binnen als buiten een bijzonder gebied

      De ladingrestanten van een tank die een vloeistof van categorie D heeft bevat en die achterblijven
      nadat de tank is leeg gelost, dienen te worden verdund en in zee geloosd overeenkomstig het bepaalde in
      [artikel 5, vijfde lid][ref10], of door middel van het wassen van een tank te worden verwijderd en afgegeven aan
      een havenontvangstvoorziening.

      9 Ladingrestanten in sloptanks

      Alle ladingrestanten die aan boord worden gehouden in een sloptank, inbegrepen de restanten van de vullings van de
      ladingpompkamer, dienen te worden afgegeven aan een havenontvangstvoorziening:

      a. overeenkomstig het bepaalde in [artikel 5, tweede lid][ref11], indien de restanten een vloeistof van categorie A
      bevatten; of

      b. binnen een bijzonder gebied overeenkomstig het bepaalde in [artikel 5, zesde of zevende lid][ref12], al naar
      gelang van toepassing indien de restanten een vloeistof van categorie A of B bevatten.


