  - number: '11'
    text: |-
      1 Het Internationaal certificaat van voorkoming van verontreiniging voor het vervoer van schadelijke vloeistoffen
      in bulk wordt door het Hoofd van de Scheepvaartinspectie afgegeven na de voltooiing van een eerste of een hernieuwd
      onderzoek als bedoeld in [artikel 10, eerste lid, onder ][ref1], ten behoeve van elk schip dat schadelijke
      vloeistoffen in bulk vervoert.

      2 a. Het Hoofd van de Scheepvaartinspectie kan een daartoe bevoegde regering verzoeken de onderzoeken, bedoeld
      in [artikel 10][ref2] uit te voeren en het certificaat af te geven, of, voorzover van toepassing, een aantekening
      te plaatsen.

      b. 1°. Op verzoek van een daartoe bevoegde regering kan namens het Hoofd van de Scheepvaartinspectie een schip
      dat niet gerechtigd is de Nederlandse vlag te voeren, aan de in [artikel 10][ref3] genoemde onderzoeken worden
      onderworpen en kan ten behoeve van dat schip een certificaat worden afgegeven, of, voorzover van toepassing, een
      aantekening worden geplaatst.

      2°. Een afschrift van het certificaat en een afschrift van het rapport van onderzoek worden zo spoedig mogelijk
      toegezonden aan de regering die het verzoek heeft gedaan.

      3°. Een krachtens het bepaalde onder 1° afgegeven certificaat zal een verklaring bevatten, inhoudende dat het is
      afgegeven op verzoek van de betrokken regering.

      3 Een certificaat wordt afgegeven tegen betaling van de kosten verbonden aan het onderzoek ter verkrijging van
      het certificaat alsmede de afgifte daarvan. Onze Minister stelt de tarieven vast voor de vergoeding van de kosten,
      verbonden aan een onderzoek als bedoeld in [artikel 10, eerste lid, onder ][ref4], voorzover dit door een ambtenaar
      van de Scheepvaartinspectie is verricht, en voor de vergoeding van de kosten, verbonden aan de afgifte van het
      certificaat.

      4 Er wordt geen certificaat afgegeven aan een schip dat gerechtigd is de vlag te voeren van een staat die geen
      partij is bij het Verdrag.

      5 Bij ministeriële regeling kunnen nadere regels worden gesteld betreffende de aanvraag tot het verkrijgen van een
      certificaat en de daarbij te overleggen bescheiden.

      6 Het Hoofd van de Scheepvaartinspectie kan nadere voorschriften geven betreffende de aanvraag tot het verkrijgen
      van een certificaat en de daarbij te overleggen bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0004306#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0004306#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0004306#Artikel10
