  - number: 5A
    text: |-
      1 Een schip gebouwd op of na 1 juli 1986 dient te zijn uitgerust met pompen en pijpleidingen waarmee zeker gesteld
      kan worden dat een tank bestemd voor het vervoer van vloeistoffen van categorie B, na het ledigen, geen groter
      restant bevat nabij de zuigopening en in de met deze tank verbonden pijpleidingen dan 0,1 m3.

      2 Een schip gebouwd voor 1 juli 1986 is uitgerust met pompen en pijpleidingen waarmee zeker gesteld kan worden
      dat een tank, bestemd voor het vervoer van vloeistoffen van categorie B, na het ledigen, geen groter restant bevat
      nabij de zuigopening en in de met deze tank verbonden pijpleidingen dan 0,3 m3.

      3 Een schip gebouwd op of na 1 juli 1986 dient te zijn uitgerust met pompen en pijpleidingen waarmee zeker gesteld
      kan worden dat een tank bestemd voor het vervoer van vloeistoffen van categorie C, na het ledigen, geen groter
      restant bevat nabij de zuigopening en in de met deze tank verbonden pijpleidingen dan 0,3 m3.

      4 Een schip gebouwd voor 1 juli 1986 is uitgerust met pompen en pijpleidingen waarmee zeker gesteld kan worden
      dat een tank, bestemd voor het vervoer van vloeistoffen van categorie C, na het ledigen, geen groter restant bevat
      nabij de zuigopening en in de met deze tank verbonden pijpleidingen dan 0,9 m3.

      5 a. Het vaststellen dat pompen en pijpleidingen voldoen aan het bepaalde in het eerste, tweede, derde of vierde
      lid, dient te geschieden door beproeving waarbij water als medium wordt gebruikt.

      b. De beproevingen en het vaststellen van de restanthoeveelheden geschieden overeenkomstig de Standards.

      6 De bepalingen van het tweede en vierde lid zijn niet van toepassing op een schip gebouwd voor 1 juli 1986 en dat
      reizen maakt in een beperkt vaargebied tussen havens van staten die partij zijn bij het Verdrag, mits wordt voldaan
      aan alle onderstaande voorwaarden:

      a. een tank waarin zich vloeistoffen van categorie B of C of mengsels daarvan bevinden en welke dient te worden
      gewassen of geballast, moet worden voorgewassen overeenkomstig de Standards. Het waswater van deze voorwas moet aan
      een havenontvangstvoorziening worden afgegeven;

      b. overig waswater of ballastwater uit een tank als bedoeld onder *a* dient aan een havenontvangstvoorziening te
      worden afgegeven of in zee te worden geloosd overeenkomstig het bepaalde in [artikel 5][ref1];

      c. binnen het beperkte vaargebied dienen de havenontvangstvoorzieningen naar het oordeel van het Hoofd van de
      Scheepvaartinspectie toereikend te zijn; en

      d. het beperkte vaargebied dient te zijn aangetekend op het certificaat als bedoeld in [artikel 11][ref2].

      7 Voor een schip waarvan de bouw en de bedrijfsvoering zodanig zijn dat de ladingtanks niet worden gebruikt voor
      ballast en slechts dan worden gewassen indien dit nodig is voor reparatie of voor het droogzetten, kan het Hoofd
      van de Scheepvaartinspectie ontheffing verlenen van het bepaalde in het eerste, tweede, derde en vierde lid indien
      wordt voldaan aan alle onderstaande voorwaarden:

      a. het ontwerp, de bouw en de uitrusting zijn goedgekeurd, waarbij rekening is gehouden met de reizen welke het
      schip zal gaan maken;

      b. het waswater van een tank die wordt gewassen alvorens een reparatie wordt uitgevoerd of alvorens het schip wordt
      drooggezet, aan een havenontvangstvoorziening wordt afgegeven;

      c. op het certificaat, bedoeld in [artikel 11][ref3] is aangetekend:

      1°. dat in elke ladingtank alleen een met name genoemde vloeistof mag worden vervoerd; en

      2°. de nadere bijzonderheden waaronder de ontheffing wordt verleend;

      en

      d. het schip is voorzien van een handboek als bedoeld in de Standards.


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004306#Artikel11
