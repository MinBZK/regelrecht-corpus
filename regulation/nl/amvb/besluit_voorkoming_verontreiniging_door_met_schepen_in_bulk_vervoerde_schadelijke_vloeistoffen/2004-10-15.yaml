  - number: '5'
    text: |-
      1 Behoudens het bepaalde in [artikel 6][ref1] is elke lozing in zee van vloeistoffen van de categorieën A, B, C
      of D, bedoeld in [artikel 3, eerste lid][ref2], of van vloeistoffen die ingevolge [artikel 3, derde lid][ref3],
      als zodanig zijn ingedeeld, of van ballastwater, waswater van tanks of andere restanten of mengsels die deze
      vloeistoffen bevatten, verboden tenzij wordt voldaan:

      a. aan het tweede, derde of vierde lid met betrekking tot vloeistoffen van categorie A, B of C, indien de lozing
      buiten een bijzonder gebied plaatsvindt;

      b. aan het vijfde lid met betrekking tot een vloeistof van categorie D, indien de lozing buiten of binnen een
      bijzonder gebied plaatsvindt; of

      c. aan het zesde, zevende of achtste lid met betrekking tot vloeistoffen van categorie A, B of C, indien de lozing
      binnen een bijzonder gebied plaatsvindt.

      2 Lozen van vloeistofrestanten van categorie A, B of C buiten een bijzonder gebied

      Indien tanks, die vloeistoffen van categorie A of mengsels daarvan bevatten, moeten worden gewassen, dienen de
      restanten aan een havenontvangstvoorziening te worden afgegeven totdat de concentratie van de vloeistof in het af
      te geven mengsel is gedaald tot of onder de waarde zoals nader wordt aangegeven door Onze Minister en vervolgens
      totdat de tank is leeggemaakt.

      Indien na afgifte van de restanten water in de tank wordt toegelaten, mag dit water in zee worden geloosd mits
      wordt voldaan aan alle onderstaande voorwaarden:

      a. het schip vervolgt zijn vaarroute met een snelheid van ten minste 7 zeemijl per uur indien het schip eigen
      voortstuwing heeft, of met een snelheid van ten minste 4 zeemijl per uur, indien het schip geen eigen voortstuwing
      heeft;

      b. het lozen geschiedt onder de waterlijn, waarbij rekening dient te worden gehouden met de plaats van de
      buitenboordinlaten; en

      c. het lozen geschiedt op een afstand van ten minste 12 zeemijl van het dichtstbijzijnde land en in water met een
      diepte van ten minste 25 m.

      3 Indien ballastwater, waswater van tanks, restanten of mengsels die een vloeistof van categorie B bevatten in zee
      worden geloosd, moet worden voldaan aan alle onderstaande voorwaarden:

      a. het schip vervolgt zijn vaarroute met een snelheid van ten minste 7 zeemijl per uur, indien het schip eigen
      voortstuwing heeft, of een snelheid van ten minste 4 zeemijl per uur, indien het schip geen eigen voortstuwing
      heeft;

      b. de methode en de voorzieningen voor het lozen voldoen aan de Standards;

      c. de maximum hoeveelheid geloosde lading van elke tank en de daarmee verbonden pijpleidingen bedraagt niet meer
      dan 1 m3 of 1/3000ste van de tankinhoud, welke van de twee de grootste is;

      d. het lozen geschiedt onder de waterlijn, waarbij rekening dient te worden gehouden met de plaats van de
      buitenboordinlaten; en

      e. het lozen geschiedt op een afstand van ten minste 12 zeemijl van het dichtstbijzijnde land en in water met een
      diepte van ten minste 25 m.

      4 Indien ballastwater, waswater van tanks, restanten of mengsels die een vloeistof van categorie C bevatten in zee
      worden geloosd, moet worden voldaan aan alle onderstaande voorwaarden:

      a. het schip vervolgt zijn vaarroute met een snelheid van ten minste 7 zeemijl per uur, indien het schip eigen
      voortstuwing heeft, of een snelheid van ten minste 4 zeemijl per uur, indien het schip geen eigen voortstuwing
      heeft;

      b. de methode en de voorzieningen voor het lozen voldoen aan de Standards;

      c. de maximum hoeveelheid geloosde lading van elke tank en de daarmee verbonden pijpleidingen bedraagt niet meer
      dan 3 m3 of 1/1000ste van de tankinhoud, welke van de twee de grootste is;

      d. het lozen geschiedt onder de waterlijn, waarbij rekening dient te worden gehouden met de plaats van de
      buitenboordinlaten; en

      e. het lozen geschiedt op een afstand van ten minste 12 zeemijl van het dichtstbijzijnde land en in water met een
      diepte van ten minste 25 m.

      5 Lozen van vloeistofrestanten van categorie D binnen en buiten een bijzonder gebied

      Indien ballastwater, waswater van tanks, restanten of mengsels die een vloeistof van categorie D bevatten, in zee
      worden geloosd, moet worden voldaan aan alle onderstaande voorwaarden:

      a. het schip vervolgt zijn vaarroute met een snelheid van ten minste 7 zeemijl per uur, indien het schip eigen
      voortstuwing heeft, of een snelheid van ten minste 4 zeemijl per uur, indien het schip geen eigen voortstuwing
      heeft;

      b. de concentratie in het te lozen mengsel is niet groter dan één deel vloeistof van categorie D op tien delen
      water; en

      c. het lozen geschiedt op een afstand van ten minste 12 zeemijl van het dichtstbijzijnde land.

      6 Lozen van vloeistofrestanten van categorie A, B of C binnen een bijzonder gebied

      Indien tanks die vloeistoffen van categorie A of mengsels daarvan bevatten, moeten worden gewassen, dienen de
      restanten aan een havenontvangstvoorziening te worden afgegeven totdat de concentratie van de vloeistof in het af
      te geven mengsel is gedaald tot of onder de waarde zoals nader wordt aangegeven door Onze Minister en vervolgens
      totdat de tank is leeg gemaakt. Indien na afgifte van de restanten water in de tank wordt toegelaten, mag dit water
      in zee worden geloosd mits wordt voldaan aan alle onderstaande voorwaarden:

      a. het schip vervolgt zijn vaarroute met een snelheid van ten minste 7 zeemijl per uur indien het schip eigen
      voortstuwing heeft, of een snelheid van ten minste 4 zeemijl per uur indien het schip geen eigen voortstuwing
      heeft;

      b. het lozen geschiedt onder de waterlijn, waarbij rekening dient te worden gehouden met de plaats van de
      buitenboordinlaten; en

      c. het lozen geschiedt op een afstand van ten minste 12 zeemijl van het dichtstbijzijnde land en in water met een
      diepte van ten minste 25 m.

      7 Indien ballastwater, waswater van tanks, restanten of mengsels die een vloeistof van categorie B bevatten in zee
      worden geloosd, moet worden voldaan aan alle onderstaande voorwaarden:

      a. een voorwas van de tank heeft plaatsgevonden na het lossen volgens een methode als bedoeld in de Standards en
      dit waswater is afgegeven aan een havenontvangstvoorziening;

      b. het schip vervolgt zijn vaarroute met een snelheid van ten minste 7 zeemijl per uur indien het schip eigen
      voortstuwing heeft, of een snelheid van ten minste 4 zeemijl per uur indien het schip geen eigen voortstuwing
      heeft;

      c. de methode en de voorzieningen voor het lozen voldoen aan de Standards;

      d. het lozen geschiedt onder de waterlijn, waarbij rekening dient te worden gehouden met de plaats van de
      buitenboordinlaten; en

      e. het lozen geschiedt op een afstand van ten minste 12 zeemijl van het dichtstbijzijnde land en in water met een
      diepte van ten minste 25 m.

      8 Indien ballastwater, waswater van tanks, restanten of mengsels die een vloeistof van categorie C bevatten in zee
      worden geloosd, moet worden voldaan aan alle onderstaande voorwaarden:

      a. het schip vervolgt zijn vaarroute met een snelheid van ten minste 7 zeemijl per uur indien het schip eigen
      voortstuwing heeft, of een snelheid van ten minste 4 zeemijl per uur indien het schip geen eigen voortstuwing
      heeft;

      b. de methode en de voorzieningen voor het lozen voldoen aan de Standards;

      c. de maximum hoeveelheid geloosde lading van elke tank en de daarmee verbonden pijpleidingen bedraagt niet meer
      dan 1 m3 of 1/3000ste van de tankinhoud, welke van de twee de grootste is;

      d. het lozen geschiedt onder de waterlijn, waarbij rekening dient te worden gehouden met de plaats van de
      buitenboordinlaten; en

      e. het lozen geschiedt op een afstand van ten minste 12 zeemijl van het dichtstbijzijnde land en in water met een
      diepte van ten minste 25 m.

      9 Aanvullende voorschriften

      Ladingrestanten mogen uit een tank worden verwijderd door het toepassen van een methode voor ventilatie als bedoeld
      in de Standards. Water toegelaten in een tank waaruit de ladingrestanten op deze wijze zijn verwijderd, wordt als
      schoon aangemerkt. De bepalingen van dit artikel zijn niet van toepassing op het lozen van dergelijk water.

      10 Het is verboden om vloeistoffen en ballastwater, waswater van tanks, andere restanten of mengsels die
      dergelijke vloeistoffen bevatten, in zee te lozen, indien deze vloeistoffen niet zijn aangewezen krachtens
      [artikel 3, tweede lid][ref4], of [artikel 4, eerste lid][ref5], danwel indien hiervoor geen nadere voorschriften
      zijn vastgesteld als bedoeld in [artikel 3, derde lid][ref6].

      11 Onverminderd het bepaalde in het zevende en achtste lid mogen restanten van vloeistoffen van categorie B of C
      binnen een bijzonder gebied aan boord worden gehouden teneinde deze in zee te lozen buiten een bijzonder gebied
      overeenkomstig het bepaalde in het derde of vierde lid.

      12 Tot een nader door Onze Minister vast te stellen tijdstip mogen schepen in het gebied van de Zwarte Zee lozen
      volgens het bepaalde in het tweede, derde en vierde lid in plaats van het bepaalde in het zesde, zevende en achtste
      lid.

      13 In afwijking van het vijfde tot en met het elfde lid, is in het Antarctisch gebied elke lozing van schadelijke
      vloeistoffen of van mengsels die zulke vloeistoffen bevatten, verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel6
