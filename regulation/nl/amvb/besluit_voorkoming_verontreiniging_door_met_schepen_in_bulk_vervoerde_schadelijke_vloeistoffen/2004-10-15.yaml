articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. chemicaliëntankschip: een schip dat is gebouwd voor of aangepast aan voornamelijk het vervoer
      van schadelijke vloeistoffen in bulk. Hieronder wordt mede verstaan een olietankschip als bedoeld in
      [artikel 1, eerste lid, onder ][ref1] (*Stb.* 1986, 160), indien dit schip een gehele of gedeeltelijke lading
      schadelijke vloeistoffen in bulk vervoert;

      b. schone ballast: ballastwater in een tank die, nadat er voor de laatste maal een vloeistof van categorie A, B,
      C of D in werd vervoerd, grondig is gereinigd en waaruit de overgebleven restanten zijn verwijderd en die is leeg
      gemaakt overeenkomstig de voorschriften van dit besluit;

      c. gescheiden ballast: ballastwater dat wordt ingenomen in een tank, die volledig is gescheiden van het lading- en
      brandstofoliesysteem en die blijvend is bestemd voor het vervoer van ballastwater of voor het vervoer van ballast
      of ladingen andere dan schadelijke vloeistoffen en olie;

      d. van het dichtstbijzijnde land: van de basislijn van waaruit de territoriale zee van het betrokken gebied
      wordt bepaald overeenkomstig het internationale recht, behoudens dat voor de toepassing van dit besluit "van
      het dichtstbijzijnde land" onder de noordoostkust van Australië betekent: van een lijn getrokken van een punt
      op de kust van Australië gelegen op 11°00" zuiderbreedte en 142°08" oosterlengte, naar een punt op 10°35"
      zuiderbreedte en 141°55" oosterlengte, vandaar naar een punt op 10°00" zuiderbreedte en 142°00" oosterlengte,
      vandaar naar een punt op 9°10" zuiderbreedte en 143°52" oosterlengte, vandaar naar een punt op 9°00" zuiderbreedte
      en 144°30" oosterlengte, vandaar naar een punt op 13°00" zuiderbreedte en 144°00" oosterlengte, vandaar naar een
      punt op 15°00" zuiderbreedte en 146°00" oosterlengte, vandaar naar een punt op 18°00" zuiderbreedte en 147°00"
      oosterlengte, vandaar naar een punt op 21°00" zuiderbreedte en 153°00" oosterlengte, vandaar naar een punt op de
      kust van Australië op 24°42" zuiderbreedte en 153°15" oosterlengte;

      e. vloeistof: vloeistof die een dampspanning heeft van niet meer dan 2,8 kgf/cm2 bij een temperatuur van 37,8° C;

      f. schadelijke vloeistof: elke vloeistof aangewezen door Onze Minister die met inachtneming van [artikel 3][ref2]
      is ingedeeld in categorie A, B, C of D;

      g. bijzonder gebied: een zeegebied waarbinnen het volgen van bijzondere in dit besluit voorgeschreven methoden ter
      voorkoming van verontreiniging van de zee door schadelijke vloeistoffen is vereist. Deze gebieden zijn het gebied
      van de Oostzee en van de Zwarte Zee en het Antarctisch gebied, die als volgt worden omschreven:

      1°. onder het gebied van de Oostzee wordt verstaan de Oostzee zelf met inbegrip van de Botnische Golf, de
      Finse Golf en de toegang tot de Oostzee, begrensd door de parallel van Kaap Skagen in het Skagerak op 57°44,8"
      noorderbreedte;

      2°. onder het gebied van de Zwarte Zee wordt verstaan de Zwarte Zee zelf, waarbij de grens tussen de Middellandse
      Zee en de Zwarte Zee wordt gevormd door de parallel van 41° noorderbreedte;

      3°. onder het Antarctisch gebied wordt verstaan het zeegebied ten zuiden van 60° zuiderbreedte.

      h. schip gebouwd: een schip waarvan de kiel is gelegd of waarvan de bouw zich in een soortgelijk stadium
      van aanbouw bevindt. Onafhankelijk van de datum waarop het schip is gebouwd, zal een schip verbouwd tot
      chemicaliëntankschip vanaf de datum van de aanvang van de verbouwing als chemicaliëntankschip worden aangemerkt.
      Deze bepaling is niet van toepassing op de verbouwing van een schip indien wordt voldaan aan onderstaande
      voorwaarden:

      1°. het schip is gebouwd voor 1 juli 1986; en

      2°. het schip vervoert producten waarop de Bulk Chemicaliën Code van toepassing is en die in de Code zijn opgenomen
      vanwege hun schadelijkheid voor het mariene milieu;

      i. soortgelijk stadium van aanbouw: het stadium waarop de bouw, herkenbaar als behorend tot een bepaald schip, is
      aangevangen en is begonnen met de samenbouw die ten minste 50 000 kg moet omvatten of één percent van de geschatte
      massa van al het bouwmateriaal, welke van deze twee waarden de laagste is;

      j. lengte (L): 96 percent van de lengte van de lastlijn op 85 percent van de kleinste holte naar de mal gemeten
      vanaf de bovenzijde van de kielplaat, dan wel de lengte van de voorzijde van de voorsteven tot aan de hartlijn van
      de roerkoning op deze lastlijn gemeten, indien deze laatste lengte groter is, gemeten in meters;

      k. Internationale Bulk Chemicaliën Code: de code voor de bouw en uitrusting van schepen die gevaarlijke chemicaliën
      in bulk vervoeren, (Resolutie MEPC 19(22) van de Mariene Milieu Commissie van de Internationale Maritieme
      Organisatie);

      l. Bulk Chemicaliën Code: de code voor de bouw en uitrusting van schepen die gevaarlijke chemicaliën in bulk
      vervoeren, (Resolutie MEPC 20(22) van de Mariene Milieu Commissie van de Internationale Maritieme Organisatie);

      m. de Standards: de bij ministeriële regeling vastgestelde voorschriften voor het lozen, zoals neergelegd in
      Resolutie MEPC.18(22) van de Mariene Milieu Commissie van de Internationale Maritieme Organisatie;

      n. verjaardatum: de datum van afgifte van het eerste certificaat, bedoeld in [artikel 11][ref3], in elk
      kalenderjaar, volgend op het jaar waarin dit certificaat is afgegeven.


