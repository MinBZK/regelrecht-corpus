  - number: '10'
    text: |-
      1 Elk schip dat schadelijke vloeistoffen in bulk vervoert is onderworpen aan:

      a. een eerste onderzoek dat wordt verricht voordat het schip in dienst wordt gesteld of voordat het certificaat,
      bedoeld in [artikel 11][ref1], voor de eerste maal wordt afgegeven, en dat een volledig onderzoek van de bouw,
      uitrusting, systemen, onderdelen, voorzieningen en materialen van het schip omvat teneinde na te gaan of wordt
      voldaan aan de regels bij of krachtens dit besluit gesteld;

      b. een hernieuwd onderzoek dat wordt verricht met door het Hoofd van de Scheepvaartinspectie vast te stellen
      tussenpozen die, behoudens indien [artikel 12, tweede, vijfde, zesde of zevende lid][ref2], van toepassing is, niet
      langer dan vijf jaar zijn, en dat de bouw, uitrusting, systemen, onderdelen, voorzieningen en materialen van het
      schip omvat teneinde na te gaan of wordt voldaan aan de regels bij of krachtens dit besluit gesteld;

      c. een tussentijds onderzoek dat wordt verricht binnen drie maanden voor of na de tweede of de derde verjaardatum
      en dat in de plaats komt van een van de jaarlijkse onderzoeken als bedoeld onder *d*, en dat de uitrusting en
      de daarbij behorende pompen en pijpleidingen van het schip omvat teneinde na te gaan of wordt voldaan aan de
      regels bij of krachtens dit besluit gesteld. Van dit tussentijds onderzoek wordt een aantekening geplaatst op het
      certificaat;

      d. een jaarlijks onderzoek dat wordt verricht binnen drie maanden voor of na elke verjaardatum en dat de bouw,
      uitrusting, systemen, onderdelen, voorzieningen en materialen van het schip omvat teneinde na te gaan of zij zijn
      onderhouden overeenkomstig het tweede lid, onder *a*, en zich in goede staat bevinden. Van dit jaarlijks onderzoek
      wordt een aantekening geplaatst op het certificaat;

      e. een aanvullend onderzoek dat afhankelijk van de omstandigheden hetzij geheel, hetzij gedeeltelijk wordt
      verricht, indien herstellingen of vernieuwingen zijn uitgevoerd, of indien zich een ongeval heeft voorgedaan,
      waarbij wordt nagegaan of de noodzakelijke reparaties of vernieuwingen deugdelijk zijn doorgevoerd en of wordt
      voldaan aan de regels bij of krachtens dit besluit gesteld.

      2 a. De toestand van het schip en van de uitrusting dient te worden gehandhaafd in overeenstemming met de
      bepalingen vastgesteld bij of krachtens dit besluit om zeker te stellen dat het schip in alle opzichten geschikt
      blijft tot het verlaten van een haven zonder dat het een gevaar vormt voor verontreiniging van het mariene milieu.

      b. Nadat een onderzoek als bedoeld in het eerste lid is voltooid, mag zonder toestemming van het Hoofd van
      de Scheepvaartinspectie geen verandering worden aangebracht in de bouw, uitrusting, systemen, onderdelen,
      voorzieningen en materialen die aan het onderzoek zijn onderworpen, tenzij het de onmiddellijke vervanging van
      dergelijke uitrusting of onderdelen betreft.

      c. Indien een schip een ongeval overkomt, of indien gebreken worden geconstateerd die de hechtheid van het
      schip, de doelmatigheid of de volledigheid van de uitrusting, vallende onder de bepalingen van dit besluit in
      belangrijke mate beïnvloeden, dient de kapitein of de eigenaar van het schip het betreffende districtshoofd van
      de Scheepvaartinspectie zo spoedig mogelijk in te lichten. Indien het schip zich in een haven buiten Nederland
      bevindt, dient de kapitein of de eigenaar tevens onmiddellijk de ter plaatse bevoegde autoriteit in te lichten.


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004306#Artikel12
