---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_voorkoming_verontreiniging_door_met_schepen_in_bulk_vervoerde_schadelijke_vloeistoffen
regulatory_layer: AMVB
publication_date: '2004-10-07'
valid_from: '2005-05-18'
bwb_id: BWBR0004306
url: https://wetten.overheid.nl/BWBR0004306/2005-05-18
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat, mede namens Onze Minister van Volkshuisvesting,
    Ruimtelijke Ordening en Milieubeheer van 17 juli 1987, nr. S/J-31 187/87, Directoraat-Generaal Scheepvaart en
    Maritieme Zaken;

    Overwegende dat het noodzakelijk is uitvoering te geven aan de bepalingen van Bijlage II van het Internationaal
    Verdrag ter voorkoming van verontreiniging door schepen met Protocollen en Bijlagen met Aanhangsels (Trb. 1975, 147
    en 1978, 187), zoals gewijzigd en aangevuld bij het op 17 februari 1978 te Londen tot stand gekomen Protocol bij
    dat Verdrag met Bijlage en Aanhangsels (Trb. 1978, 188 en 1986, 121);

    Gelet op de artikelen 1, onder e, 4, 5, 6, 7, 8, 10, 11, 35, 38 en 39 van de Wet voorkoming verontreiniging door
    schepen (Stb. 1983, 683);

    De Raad van State gehoord (advies van 29 december 1987, no. W09.87.0328);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat, mede namens Onze Minister van
    Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 26 februari 1988, nr. S/J-30.225/88 Directoraat-Generaal
    Scheepvaart en Maritieme Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel1
  - number: 1.a
    text: |-
      chemicaliëntankschip: een schip dat is gebouwd voor of aangepast aan voornamelijk het vervoer van
      schadelijke vloeistoffen in bulk. Hieronder wordt mede verstaan een olietankschip als bedoeld in
      [artikel 1, eerste lid, onder ][ref1] (*Stb.* 1986, 160), indien dit schip een gehele of gedeeltelijke lading
      schadelijke vloeistoffen in bulk vervoert;


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel1
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '1'
  - number: 1.b
    text: |-
      schone ballast: ballastwater in een tank die, nadat er voor de laatste maal een vloeistof van categorie A, B, C
      of D in werd vervoerd, grondig is gereinigd en waaruit de overgebleven restanten zijn verwijderd en die is leeg
      gemaakt overeenkomstig de voorschriften van dit besluit;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel1
  - number: 1.c
    text: |-
      gescheiden ballast: ballastwater dat wordt ingenomen in een tank, die volledig is gescheiden van het lading- en
      brandstofoliesysteem en die blijvend is bestemd voor het vervoer van ballastwater of voor het vervoer van ballast
      of ladingen andere dan schadelijke vloeistoffen en olie;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel1
  - number: 1.d
    text: |-
      van het dichtstbijzijnde land: van de basislijn van waaruit de territoriale zee van het betrokken gebied wordt
      bepaald overeenkomstig het internationale recht, behoudens dat voor de toepassing van dit besluit "van het
      dichtstbijzijnde land" onder de noordoostkust van Australië betekent: van een lijn getrokken van een punt op de
      kust van Australië gelegen op 11°00" zuiderbreedte en 142°08" oosterlengte, naar een punt op 10°35" zuiderbreedte
      en 141°55" oosterlengte, vandaar naar een punt op 10°00" zuiderbreedte en 142°00" oosterlengte, vandaar naar
      een punt op 9°10" zuiderbreedte en 143°52" oosterlengte, vandaar naar een punt op 9°00" zuiderbreedte en
      144°30" oosterlengte, vandaar naar een punt op 13°00" zuiderbreedte en 144°00" oosterlengte, vandaar naar een
      punt op 15°00" zuiderbreedte en 146°00" oosterlengte, vandaar naar een punt op 18°00" zuiderbreedte en 147°00"
      oosterlengte, vandaar naar een punt op 21°00" zuiderbreedte en 153°00" oosterlengte, vandaar naar een punt op de
      kust van Australië op 24°42" zuiderbreedte en 153°15" oosterlengte;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel1
  - number: 1.e
    text: 'vloeistof: vloeistof die een dampspanning heeft van niet meer dan 2,8 kgf/cm2 bij een temperatuur van 37,8° C;'
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel1
  - number: 1.f
    text: |-
      schadelijke vloeistof: elke vloeistof aangewezen door Onze Minister die met inachtneming van [artikel 3][ref1] is
      ingedeeld in categorie A, B, C of D;


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel3
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004306
        artikel: '3'
  - number: 1.g
    text: |-
      bijzonder gebied: een zeegebied waarbinnen het volgen van bijzondere in dit besluit voorgeschreven methoden ter
      voorkoming van verontreiniging van de zee door schadelijke vloeistoffen is vereist. Deze gebieden zijn het gebied
      van de Oostzee en van de Zwarte Zee en het Antarctisch gebied, die als volgt worden omschreven:
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel1
  - number: 1.g.1°
    text: |-
      onder het gebied van de Oostzee wordt verstaan de Oostzee zelf met inbegrip van de Botnische Golf, de Finse Golf en
      de toegang tot de Oostzee, begrensd door de parallel van Kaap Skagen in het Skagerak op 57°44,8" noorderbreedte;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel1
  - number: 1.g.2°
    text: |-
      onder het gebied van de Zwarte Zee wordt verstaan de Zwarte Zee zelf, waarbij de grens tussen de Middellandse Zee
      en de Zwarte Zee wordt gevormd door de parallel van 41° noorderbreedte;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel1
  - number: 1.g.3°
    text: onder het Antarctisch gebied wordt verstaan het zeegebied ten zuiden van 60° zuiderbreedte.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel1
  - number: 1.h
    text: |-
      schip gebouwd: een schip waarvan de kiel is gelegd of waarvan de bouw zich in een soortgelijk stadium van aanbouw
      bevindt. Onafhankelijk van de datum waarop het schip is gebouwd, zal een schip verbouwd tot chemicaliëntankschip
      vanaf de datum van de aanvang van de verbouwing als chemicaliëntankschip worden aangemerkt. Deze bepaling is niet
      van toepassing op de verbouwing van een schip indien wordt voldaan aan onderstaande voorwaarden:
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel1
  - number: 1.h.1°
    text: het schip is gebouwd voor 1 juli 1986; en
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel1
  - number: 1.h.2°
    text: |-
      het schip vervoert producten waarop de Bulk Chemicaliën Code van toepassing is en die in de Code zijn opgenomen
      vanwege hun schadelijkheid voor het mariene milieu;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel1
  - number: 1.i
    text: |-
      soortgelijk stadium van aanbouw: het stadium waarop de bouw, herkenbaar als behorend tot een bepaald schip, is
      aangevangen en is begonnen met de samenbouw die ten minste 50 000 kg moet omvatten of één percent van de geschatte
      massa van al het bouwmateriaal, welke van deze twee waarden de laagste is;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel1
  - number: 1.j
    text: |-
      lengte (L): 96 percent van de lengte van de lastlijn op 85 percent van de kleinste holte naar de mal gemeten vanaf
      de bovenzijde van de kielplaat, dan wel de lengte van de voorzijde van de voorsteven tot aan de hartlijn van de
      roerkoning op deze lastlijn gemeten, indien deze laatste lengte groter is, gemeten in meters;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel1
  - number: 1.k
    text: |-
      Internationale Bulk Chemicaliën Code: de code voor de bouw en uitrusting van schepen die gevaarlijke chemicaliën
      in bulk vervoeren, (Resolutie MEPC 19(22) van de Mariene Milieu Commissie van de Internationale Maritieme
      Organisatie);
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel1
  - number: 1.l
    text: |-
      Bulk Chemicaliën Code: de code voor de bouw en uitrusting van schepen die gevaarlijke chemicaliën in bulk
      vervoeren, (Resolutie MEPC 20(22) van de Mariene Milieu Commissie van de Internationale Maritieme Organisatie);
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel1
  - number: 1.m
    text: |-
      de Standards: de bij ministeriële regeling vastgestelde voorschriften voor het lozen, zoals neergelegd in Resolutie
      MEPC.18(22) van de Mariene Milieu Commissie van de Internationale Maritieme Organisatie;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel1
  - number: 1.n
    text: |-
      verjaardatum: de datum van afgifte van het eerste certificaat, bedoeld in [artikel 11][ref1], in elk kalenderjaar,
      volgend op het jaar waarin dit certificaat is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel11
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004306
        artikel: '11'
  - number: '2.1'
    text: |-
      Tenzij uitdrukkelijk anders bepaald, zijn de bepalingen van dit besluit van toepassing op alle schepen die
      schadelijke vloeistoffen in bulk vervoeren.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel2
  - number: '2.2'
    text: |-
      Indien een lading waarop de bepalingen van het [Besluit voorkoming olieverontreiniging door schepen][ref1] (*Stb.*
      1986, 160) van toepassing zijn, in de ladingtanks van een chemicaliëntankschip wordt vervoerd, dient eveneens te
      worden voldaan aan de desbetreffende voorschriften van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003936
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003936
  - number: '2.3'
    text: |-
      Het bepaalde in [artikel 13][ref1] is alleen van toepassing op schepen waarin vloeistoffen worden vervoerd die zijn
      ingedeeld in de categorieën A, B of C, bedoeld in [artikel 3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0004306#Artikel3
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004306
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0004306
        artikel: '3'
  - number: '2.4'
    text: |-
      Elk schip, gebouwd voor 1 juli 1986, dient met ingang van 1 januari 1988 te voldoen aan de bepalingen voor
      het lozen onder de waterlijn en voor de maximale concentratie in het kielzog van het schip, bedoeld in
      [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel5
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004306
        artikel: '5'
  - number: '2.5'
    text: |-
      De inspecteur-generaal kan het aanbrengen van andere onderdelen, materialen, voorzieningen of apparatuur, dan die
      welke in dit besluit worden voorgeschreven, in een schip toestaan, mits deze ten minste even doelmatig zijn als
      die welke in dit besluit worden vereist. In geen geval zullen vormen van ontwerp en constructie ter regeling van
      het lozen van schadelijke vloeistoffen, zoals deze in dit besluit zijn voorgeschreven, kunnen worden vervangen door
      operationele methoden.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel2
  - number: '3.1'
    text: 'Voor dit besluit worden schadelijke vloeistoffen ingedeeld in de volgende vier categorieën:'
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel3
  - number: 3.1.a
    text: |-
      categorie A: schadelijke vloeistoffen die, wanneer deze bij het schoonmaken van tanks of bij het ontballasten
      in zee worden geloosd, een groot gevaar opleveren voor de gezondheid van de mens of het mariene milieu, of die
      ernstige schade toebrengen aan de recreatiemogelijkheden of ander rechtmatig gebruik van de zee en derhalve strikte
      maatregelen ter voorkoming van verontreiniging rechtvaardigen;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel3
  - number: 3.1.b
    text: |-
      categorie B: schadelijke vloeistoffen die, wanneer deze bij het schoonmaken van tanks of bij het ontballasten in
      zee worden geloosd, gevaar opleveren voor de gezondheid van de mens of het mariene milieu, of die schade toebrengen
      aan de recreatiemogelijkheden of ander rechtmatig gebruik van de zee en derhalve bijzondere maatregelen ter
      voorkoming van verontreiniging rechtvaardigen;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel3
  - number: 3.1.c
    text: |-
      categorie C: schadelijke vloeistoffen die, wanneer deze bij het schoonmaken van tanks of bij het ontballasten
      in zee worden geloosd, een beperkt gevaar opleveren voor de gezondheid van de mens of het mariene milieu, of
      die beperkte schade toebrengen aan de recreatiemogelijkheden of ander rechtmatig gebruik van de zee en derhalve
      maatregelen ter voorkoming van verontreiniging vereisen;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel3
  - number: 3.1.d
    text: |-
      categorie D: schadelijke vloeistoffen die, wanneer deze bij het schoonmaken van tanks of bij het ontballasten
      in zee worden geloosd, een gering gevaar opleveren voor de gezondheid van de mens of het mariene milieu, of die
      geringe schade toebrengen aan de recreatiemogelijkheden of ander rechtmatig gebruik van de zee en derhalve enige
      maatregelen ter voorkoming van verontreiniging vereisen.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel3
  - number: '3.2'
    text: |-
      Onze Minister wijst de schadelijke vloeistoffen aan, ingedeeld in categorieën als bedoeld in het eerste lid. Deze
      indeling geschiedt met inachtneming van de richtlijnen in aanhangsel 1 bij Bijlage II van het Verdrag.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel3
  - number: '3.3'
    text: |-
      Voor een vloeistof die wordt aangeboden voor vervoer en niet is aangewezen krachtens het tweede lid van dit artikel
      of artikel 4, eerste lid, bepaalt de inspecteur-generaal de voorlopige indeling van deze vloeistof.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel3
  - number: '4.1'
    text: |-
      Behoudens het bepaalde in [artikel 3, tweede lid][ref1], wijst Onze Minister tevens overige vloeistoffen
      aan die, na te zijn beoordeeld, niet vallen onder de categorieën A, B, C of D, zoals omschreven in
      [artikel 3, eerste lid][ref2], aangezien deze vloeistoffen op het ogenblik worden geacht geen gevaar op te leveren
      voor de gezondheid van de mens of het mariene milieu, of schade toebrengen aan de recreatiemogelijkheden of
      ander rechtmatig gebruik van de zee, indien zij in zee worden geloosd bij het schoonmaken van tanks of bij het
      ontballasten.


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004306#Artikel3
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004306
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0004306
        artikel: '3'
  - number: '4.2'
    text: |-
      De bepalingen van dit besluit zijn niet van toepassing op het lozen van restanten van vloeistoffen als bedoeld in
      het eerste lid, of van lens- of ballastwater of andere mengsels die alleen deze vloeistoffen bevatten.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel4
  - number: '4.3'
    text: De bepalingen van dit besluit zijn niet van toepassing op het lozen in zee van schone of gescheiden ballast.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel4
  - number: '5.1'
    text: |-
      Behoudens het bepaalde in [artikel 6][ref1] is elke lozing in zee van vloeistoffen van de categorieën A, B, C
      of D, bedoeld in [artikel 3, eerste lid][ref2], of van vloeistoffen die ingevolge [artikel 3, derde lid][ref3],
      als zodanig zijn ingedeeld, of van ballastwater, waswater van tanks of andere restanten of mengsels die deze
      vloeistoffen bevatten, verboden tenzij wordt voldaan:


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004306#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0004306#Artikel3
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004306
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0004306
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0004306
        artikel: '3'
  - number: 5.1.a
    text: |-
      aan het tweede, derde of vierde lid met betrekking tot vloeistoffen van categorie A, B of C, indien de lozing
      buiten een bijzonder gebied plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: 5.1.b
    text: |-
      aan het vijfde lid met betrekking tot een vloeistof van categorie D, indien de lozing buiten of binnen een
      bijzonder gebied plaatsvindt; of
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: 5.1.c
    text: |-
      aan het zesde, zevende of achtste lid met betrekking tot vloeistoffen van categorie A, B of C, indien de lozing
      binnen een bijzonder gebied plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: '5.2'
    text: |-
      Lozen van vloeistofrestanten van categorie A, B of C buiten een bijzonder gebied Indien tanks, die
      vloeistoffen van categorie A of mengsels daarvan bevatten, moeten worden gewassen, dienen de restanten aan een
      havenontvangstvoorziening te worden afgegeven totdat de concentratie van de vloeistof in het af te geven mengsel
      is gedaald tot of onder de waarde zoals nader wordt aangegeven door Onze Minister en vervolgens totdat de tank
      is leeggemaakt. Indien na afgifte van de restanten water in de tank wordt toegelaten, mag dit water in zee worden
      geloosd mits wordt voldaan aan alle onderstaande voorwaarden:
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: 5.2.a
    text: |-
      het schip vervolgt zijn vaarroute met een snelheid van ten minste 7 zeemijl per uur indien het schip eigen
      voortstuwing heeft, of met een snelheid van ten minste 4 zeemijl per uur, indien het schip geen eigen voortstuwing
      heeft;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: 5.2.b
    text: |-
      het lozen geschiedt onder de waterlijn, waarbij rekening dient te worden gehouden met de plaats van de
      buitenboordinlaten; en
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: 5.2.c
    text: |-
      het lozen geschiedt op een afstand van ten minste 12 zeemijl van het dichtstbijzijnde land en in water met een
      diepte van ten minste 25 m.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: '5.3'
    text: |-
      Indien ballastwater, waswater van tanks, restanten of mengsels die een vloeistof van categorie B bevatten in zee
      worden geloosd, moet worden voldaan aan alle onderstaande voorwaarden:
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: 5.3.a
    text: |-
      het schip vervolgt zijn vaarroute met een snelheid van ten minste 7 zeemijl per uur, indien het schip eigen
      voortstuwing heeft, of een snelheid van ten minste 4 zeemijl per uur, indien het schip geen eigen voortstuwing
      heeft;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: 5.3.b
    text: de methode en de voorzieningen voor het lozen voldoen aan de Standards;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: 5.3.c
    text: |-
      de maximum hoeveelheid geloosde lading van elke tank en de daarmee verbonden pijpleidingen bedraagt niet meer dan 1
      m3 of 1/3000ste van de tankinhoud, welke van de twee de grootste is;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: 5.3.d
    text: |-
      het lozen geschiedt onder de waterlijn, waarbij rekening dient te worden gehouden met de plaats van de
      buitenboordinlaten; en
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: 5.3.e
    text: |-
      het lozen geschiedt op een afstand van ten minste 12 zeemijl van het dichtstbijzijnde land en in water met een
      diepte van ten minste 25 m.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: '5.4'
    text: |-
      Indien ballastwater, waswater van tanks, restanten of mengsels die een vloeistof van categorie C bevatten in zee
      worden geloosd, moet worden voldaan aan alle onderstaande voorwaarden:
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: 5.4.a
    text: |-
      het schip vervolgt zijn vaarroute met een snelheid van ten minste 7 zeemijl per uur, indien het schip eigen
      voortstuwing heeft, of een snelheid van ten minste 4 zeemijl per uur, indien het schip geen eigen voortstuwing
      heeft;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: 5.4.b
    text: de methode en de voorzieningen voor het lozen voldoen aan de Standards;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: 5.4.c
    text: |-
      de maximum hoeveelheid geloosde lading van elke tank en de daarmee verbonden pijpleidingen bedraagt niet meer dan 3
      m3 of 1/1000ste van de tankinhoud, welke van de twee de grootste is;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: 5.4.d
    text: |-
      het lozen geschiedt onder de waterlijn, waarbij rekening dient te worden gehouden met de plaats van de
      buitenboordinlaten; en
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: 5.4.e
    text: |-
      het lozen geschiedt op een afstand van ten minste 12 zeemijl van het dichtstbijzijnde land en in water met een
      diepte van ten minste 25 m.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: '5.5'
    text: |-
      Lozen van vloeistofrestanten van categorie D binnen en buiten een bijzonder gebied Indien ballastwater, waswater
      van tanks, restanten of mengsels die een vloeistof van categorie D bevatten, in zee worden geloosd, moet worden
      voldaan aan alle onderstaande voorwaarden:
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: 5.5.a
    text: |-
      het schip vervolgt zijn vaarroute met een snelheid van ten minste 7 zeemijl per uur, indien het schip eigen
      voortstuwing heeft, of een snelheid van ten minste 4 zeemijl per uur, indien het schip geen eigen voortstuwing
      heeft;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: 5.5.b
    text: |-
      de concentratie in het te lozen mengsel is niet groter dan één deel vloeistof van categorie D op tien delen water;
      en
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: 5.5.c
    text: het lozen geschiedt op een afstand van ten minste 12 zeemijl van het dichtstbijzijnde land.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: '5.6'
    text: |-
      Lozen van vloeistofrestanten van categorie A, B of C binnen een bijzonder gebied Indien tanks die
      vloeistoffen van categorie A of mengsels daarvan bevatten, moeten worden gewassen, dienen de restanten aan een
      havenontvangstvoorziening te worden afgegeven totdat de concentratie van de vloeistof in het af te geven mengsel is
      gedaald tot of onder de waarde zoals nader wordt aangegeven door Onze Minister en vervolgens totdat de tank is leeg
      gemaakt. Indien na afgifte van de restanten water in de tank wordt toegelaten, mag dit water in zee worden geloosd
      mits wordt voldaan aan alle onderstaande voorwaarden:
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: 5.6.a
    text: |-
      het schip vervolgt zijn vaarroute met een snelheid van ten minste 7 zeemijl per uur indien het schip eigen
      voortstuwing heeft, of een snelheid van ten minste 4 zeemijl per uur indien het schip geen eigen voortstuwing
      heeft;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: 5.6.b
    text: |-
      het lozen geschiedt onder de waterlijn, waarbij rekening dient te worden gehouden met de plaats van de
      buitenboordinlaten; en
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: 5.6.c
    text: |-
      het lozen geschiedt op een afstand van ten minste 12 zeemijl van het dichtstbijzijnde land en in water met een
      diepte van ten minste 25 m.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: '5.7'
    text: |-
      Indien ballastwater, waswater van tanks, restanten of mengsels die een vloeistof van categorie B bevatten in zee
      worden geloosd, moet worden voldaan aan alle onderstaande voorwaarden:
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: 5.7.a
    text: |-
      een voorwas van de tank heeft plaatsgevonden na het lossen volgens een methode als bedoeld in de Standards en dit
      waswater is afgegeven aan een havenontvangstvoorziening;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: 5.7.b
    text: |-
      het schip vervolgt zijn vaarroute met een snelheid van ten minste 7 zeemijl per uur indien het schip eigen
      voortstuwing heeft, of een snelheid van ten minste 4 zeemijl per uur indien het schip geen eigen voortstuwing
      heeft;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: 5.7.c
    text: de methode en de voorzieningen voor het lozen voldoen aan de Standards;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: 5.7.d
    text: |-
      het lozen geschiedt onder de waterlijn, waarbij rekening dient te worden gehouden met de plaats van de
      buitenboordinlaten; en
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: 5.7.e
    text: |-
      het lozen geschiedt op een afstand van ten minste 12 zeemijl van het dichtstbijzijnde land en in water met een
      diepte van ten minste 25 m.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: '5.8'
    text: |-
      Indien ballastwater, waswater van tanks, restanten of mengsels die een vloeistof van categorie C bevatten in zee
      worden geloosd, moet worden voldaan aan alle onderstaande voorwaarden:
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: 5.8.a
    text: |-
      het schip vervolgt zijn vaarroute met een snelheid van ten minste 7 zeemijl per uur indien het schip eigen
      voortstuwing heeft, of een snelheid van ten minste 4 zeemijl per uur indien het schip geen eigen voortstuwing
      heeft;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: 5.8.b
    text: de methode en de voorzieningen voor het lozen voldoen aan de Standards;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: 5.8.c
    text: |-
      de maximum hoeveelheid geloosde lading van elke tank en de daarmee verbonden pijpleidingen bedraagt niet meer dan 1
      m3 of 1/3000ste van de tankinhoud, welke van de twee de grootste is;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: 5.8.d
    text: |-
      het lozen geschiedt onder de waterlijn, waarbij rekening dient te worden gehouden met de plaats van de
      buitenboordinlaten; en
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: 5.8.e
    text: |-
      het lozen geschiedt op een afstand van ten minste 12 zeemijl van het dichtstbijzijnde land en in water met een
      diepte van ten minste 25 m.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: '5.9'
    text: |-
      Aanvullende voorschriften Ladingrestanten mogen uit een tank worden verwijderd door het toepassen van een methode
      voor ventilatie als bedoeld in de Standards. Water toegelaten in een tank waaruit de ladingrestanten op deze wijze
      zijn verwijderd, wordt als schoon aangemerkt. De bepalingen van dit artikel zijn niet van toepassing op het lozen
      van dergelijk water.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: '5.10'
    text: |-
      Het is verboden om vloeistoffen en ballastwater, waswater van tanks, andere restanten of mengsels die
      dergelijke vloeistoffen bevatten, in zee te lozen, indien deze vloeistoffen niet zijn aangewezen krachtens
      [artikel 3, tweede lid][ref1], of [artikel 4, eerste lid][ref2], danwel indien hiervoor geen nadere voorschriften
      zijn vastgesteld als bedoeld in [artikel 3, derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004306#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0004306#Artikel3
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004306
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0004306
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0004306
        artikel: '3'
  - number: '5.11'
    text: |-
      Onverminderd het bepaalde in het zevende en achtste lid mogen restanten van vloeistoffen van categorie B of C
      binnen een bijzonder gebied aan boord worden gehouden teneinde deze in zee te lozen buiten een bijzonder gebied
      overeenkomstig het bepaalde in het derde of vierde lid.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: '5.12'
    text: |-
      Tot een nader door Onze Minister vast te stellen tijdstip mogen schepen in het gebied van de Zwarte Zee lozen
      volgens het bepaalde in het tweede, derde en vierde lid in plaats van het bepaalde in het zesde, zevende en achtste
      lid.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: '5.13'
    text: |-
      In afwijking van het vijfde tot en met het elfde lid, is in het Antarctisch gebied elke lozing van schadelijke
      vloeistoffen of van mengsels die zulke vloeistoffen bevatten, verboden.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5
  - number: 5A.1
    text: |-
      Een schip gebouwd op of na 1 juli 1986 dient te zijn uitgerust met pompen en pijpleidingen waarmee zeker gesteld
      kan worden dat een tank bestemd voor het vervoer van vloeistoffen van categorie B, na het ledigen, geen groter
      restant bevat nabij de zuigopening en in de met deze tank verbonden pijpleidingen dan 0,1 m3.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5A
  - number: 5A.2
    text: |-
      Een schip gebouwd voor 1 juli 1986 is uitgerust met pompen en pijpleidingen waarmee zeker gesteld kan worden dat
      een tank, bestemd voor het vervoer van vloeistoffen van categorie B, na het ledigen, geen groter restant bevat
      nabij de zuigopening en in de met deze tank verbonden pijpleidingen dan 0,3 m3.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5A
  - number: 5A.3
    text: |-
      Een schip gebouwd op of na 1 juli 1986 dient te zijn uitgerust met pompen en pijpleidingen waarmee zeker gesteld
      kan worden dat een tank bestemd voor het vervoer van vloeistoffen van categorie C, na het ledigen, geen groter
      restant bevat nabij de zuigopening en in de met deze tank verbonden pijpleidingen dan 0,3 m3.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5A
  - number: 5A.4
    text: |-
      Een schip gebouwd voor 1 juli 1986 is uitgerust met pompen en pijpleidingen waarmee zeker gesteld kan worden dat
      een tank, bestemd voor het vervoer van vloeistoffen van categorie C, na het ledigen, geen groter restant bevat
      nabij de zuigopening en in de met deze tank verbonden pijpleidingen dan 0,9 m3.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5A
  - number: 5A.5.a
    text: |-
      Het vaststellen dat pompen en pijpleidingen voldoen aan het bepaalde in het eerste, tweede, derde of vierde lid,
      dient te geschieden door beproeving waarbij water als medium wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5A
  - number: 5A.5.b
    text: De beproevingen en het vaststellen van de restanthoeveelheden geschieden overeenkomstig de Standards.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5A
  - number: 5A.6
    text: |-
      De bepalingen van het tweede en vierde lid zijn niet van toepassing op een schip gebouwd voor 1 juli 1986 en dat
      reizen maakt in een beperkt vaargebied tussen havens van staten die partij zijn bij het Verdrag, mits wordt voldaan
      aan alle onderstaande voorwaarden:
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5A
  - number: 5A.6.a
    text: |-
      een tank waarin zich vloeistoffen van categorie B of C of mengsels daarvan bevinden en welke dient te worden
      gewassen of geballast, moet worden voorgewassen overeenkomstig de Standards. Het waswater van deze voorwas moet aan
      een havenontvangstvoorziening worden afgegeven;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5A
  - number: 5A.6.b
    text: |-
      overig waswater of ballastwater uit een tank als bedoeld onder *a* dient aan een havenontvangstvoorziening te
      worden afgegeven of in zee te worden geloosd overeenkomstig het bepaalde in [artikel 5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel5
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5A
    references:
      - id: ref1
        bwb_id: BWBR0004306
        artikel: '5'
  - number: 5A.6.c
    text: |-
      binnen het beperkte vaargebied dienen de havenontvangstvoorzieningen naar het oordeel van de inspecteur-generaal
      toereikend te zijn; en
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5A
  - number: 5A.6.d
    text: |-
      het beperkte vaargebied dient te zijn aangetekend op het certificaat als bedoeld in [artikel 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel11
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5A
    references:
      - id: ref1
        bwb_id: BWBR0004306
        artikel: '11'
  - number: 5A.7
    text: |-
      Voor een schip waarvan de bouw en de bedrijfsvoering zodanig zijn dat de ladingtanks niet worden gebruikt
      voor ballast en slechts dan worden gewassen indien dit nodig is voor reparatie of voor het droogzetten, kan de
      inspecteur-generaal ontheffing verlenen van het bepaalde in het eerste, tweede, derde en vierde lid indien wordt
      voldaan aan alle onderstaande voorwaarden:
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5A
  - number: 5A.7.a
    text: |-
      het ontwerp, de bouw en de uitrusting zijn goedgekeurd, waarbij rekening is gehouden met de reizen welke het schip
      zal gaan maken;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5A
  - number: 5A.7.b
    text: |-
      het waswater van een tank die wordt gewassen alvorens een reparatie wordt uitgevoerd of alvorens het schip wordt
      drooggezet, aan een havenontvangstvoorziening wordt afgegeven;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5A
  - number: 5A.7.c
    text: |-
      op het certificaat, bedoeld in [artikel 11][ref1] is aangetekend:


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel11
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5A
    references:
      - id: ref1
        bwb_id: BWBR0004306
        artikel: '11'
  - number: 5A.7.c.1°
    text: dat in elke ladingtank alleen een met name genoemde vloeistof mag worden vervoerd; en
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5A
  - number: 5A.7.c.2°
    text: de nadere bijzonderheden waaronder de ontheffing wordt verleend;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5A
  - number: 5A.7.d
    text: het schip is voorzien van een handboek als bedoeld in de Standards.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel5A
  - number: '6'
    text: |-
      Het lozingsverbod, bedoeld in [artikel 5][ref1] is niet van toepassing op het lozen in zee van schadelijke
      vloeistoffen of mengsels die dergelijke vloeistoffen bevatten:


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel5
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004306
        artikel: '5'
  - number: 6.a
    text: indien dit noodzakelijk is om de veiligheid van het schip zeker te stellen of mensenlevens op zee te redden; of
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel6
  - number: 6.b
    text: |-
      in geval van schade aan het schip of aan de uitrusting daarvan mits na het ontstaan van de schade of na het
      ontdekken van de lozing alle redelijke voorzorgen zijn getroffen om de lozing te voorkomen of tot een minimum te
      beperken, uitgezonderd in geval de kapitein of de eigenaar handelde met de bedoeling om schade te veroorzaken,
      ofwel roekeloos handelde en in de wetenschap dat er waarschijnlijk schade zou ontstaan; of
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel6
  - number: 6.c
    text: |-
      met toestemming van Onze Minister, indien dit geschiedt met het doel bepaalde verontreinigingsvoorvallen te
      bestrijden teneinde de schade door verontreiniging tot een minimum te beperken.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel6
  - number: 7A.1
    text: |-
      De beheerders van losplaatsen gelegen in havens, die krachtens
      [artikel 6 van de Wet voorkoming verontreiniging door schepen][ref1] zijn aangewezen, waar schepen schadelijke
      vloeistoffen lossen, treffen zodanige voorzieningen dat dergelijke schepen hun ladingtanks geheel kunnen leeglossen
      met inachtneming van het bepaalde bij of krachtens de [artikelen 5A][ref2] en [8][ref3] alsmede de Standards.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004306#Artikel5A
      [ref3]: https://wetten.overheid.nl/BWBR0004306#Artikel8
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel7A
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0004306
        artikel: 5A
      - id: ref3
        bwb_id: BWBR0004306
        artikel: '8'
  - number: 7A.2
    text: |-
      Bij losplaatsen als bedoeld in het eerste lid worden voorzieningen getroffen om te voorkomen dat de inhoud van
      slangen of leidingen van de walinstallatie, welke gebruikt zijn voor het lossen van schadelijke vloeistoffen,
      terugstroomt in het schip.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel7A
  - number: 7A.3
    text: |-
      Indien naar het oordeel van de kapitein van een schip als bedoeld in het eerste lid, of zijn vertegenwoordiger,
      bij losplaatsen de voorzieningen als bedoeld in dit artikel, ontoereikend zijn, kan hij zulks melden aan de
      havenbeheerder. [Artikel 8, tweede tot en met vierde lid, van het Besluit havenontvangstvoorzieningen][ref1] is van
      overeenkomstige toepassing op de afwikkeling van de melding.


      [ref1]: https://wetten.overheid.nl/BWBR0017136#Artikel8
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel7A
    references:
      - id: ref1
        bwb_id: BWBR0017136
        artikel: '8'
  - number: 8.1.a
    text: |-
      De kapitein van een schip, dat schadelijke vloeistoffen in bulk vervoert dient zorg te dragen dat gehandeld wordt
      in overeenstemming met het bepaalde in [artikel 5][ref1] en dit artikel. Hij dient het ladingjournaal volledig te
      doen bijhouden, indien handelingen als bedoeld in [artikel 9][ref2] plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004306#Artikel9
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004306
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0004306
        artikel: '9'
  - number: 8.1.b
    text: |-
      Onze Minister kan bepalen dat de kapitein zorg draagt dat het schip alvorens het naar zee vertrekt voorzien is van
      een schriftelijk bewijs, afgegeven door een door Onze Minister erkende instantie, waaruit blijkt dat is voldaan aan
      het bepaalde onder *a*.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: 8.1.c
    text: |-
      Een ontheffing als bedoeld in het tweede lid, onder *b*, het vijfde lid, onder *b*, het zesde lid, onder *c* of het
      zevende lid, onder *c*, kan alleen worden verleend door de daartoe ter plaatse bevoegde autoriteit alwaar het schip
      een lading lost. Van een dergelijke ontheffing dient aantekening te worden gemaakt in het ladingjournaal. Deze
      aantekening dient door de daartoe ter plaatse bevoegde autoriteit te worden gewaarmerkt.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: '8.2'
    text: |-
      Bepalingen voor categorie A vloeistoffen, zowel binnen als buiten een bijzonder gebied Met betrekking tot een
      vloeistof van categorie A zijn de navolgende bepalingen van toepassing:
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: 8.2.a
    text: |-
      behoudens het bepaalde onder *b* dient een tank, waaruit de lading is gelost, te worden gewassen overeenkomstig het
      bepaalde in het derde en vierde lid voordat het schip uit de loshaven vertrekt;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: 8.2.b
    text: |-
      de kapitein van een schip kan de bevoegde autoriteit van de plaats waar het schip de lading lost, verzoeken te
      worden ontheven van het bepaalde onder *a*, indien wordt voldaan aan het navolgende:
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: 8.2.b.1°
    text: |-
      de tank, die is leeg gelost, wordt opnieuw geladen met dezelfde vloeistof of met een vloeistof die verenigbaar is
      met de vorige en de uitgeloste tank wordt niet gewassen of geballast alvorens deze opnieuw wordt beladen; of
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: 8.2.b.2°
    text: |-
      de tank, die is leeg gelost, wordt op zee niet gewassen of geballast en aan de voorschriften van het derde en
      het vierde lid wordt voldaan in een volgende haven, voor welke haven schriftelijk is bevestigd dat voldoende
      havenontvangstvoorzieningen voor dat doel aanwezig zijn; of
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: 8.2.b.3°
    text: |-
      de ladingrestanten in een tank worden verwijderd door middel van een methode van ventilatie als bedoeld in de
      Standards.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: '8.3'
    text: |-
      Indien een tank wordt gewassen overeenkomstig het bepaalde in het tweede lid, onder *a*, dient het aldus ontstane
      waswater te worden afgegeven aan een havenontvangstvoorziening totdat de concentratie van de vloeistof in het af
      te geven mengsel is gedaald tot of onder de waarde zoals wordt aangegeven door Onze Minister en vervolgens totdat
      de tank is leeg gemaakt. De concentratie dient te worden gemeten aan de hand van een monster dat genomen wordt
      door de daartoe ter plaatse bevoegde autoriteit nabij de losaansluiting van het schip. Van deze handelingen dient
      aantekening te worden gehouden in het ladingjournaal, bedoeld in [artikel 9][ref1] en deze aantekening moet worden
      gewaarmerkt door de daartoe ter plaatse bevoegde autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel9
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004306
        artikel: '9'
  - number: '8.4'
    text: |-
      Indien de daartoe ter plaatse bevoegde autoriteit er van overtuigd is dat het niet redelijk en uitvoerbaar is om
      de concentratie in een af te geven mengsel te meten zonder daarbij onnodig oponthoud voor het schip te veroorzaken,
      kan een andere methode worden aanvaard als gelijkwaardig aan het bepaalde in het derde lid mits:
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: 8.4.a
    text: een voorwas van de tank plaatsvindt volgens een methode als bedoeld in de Standards; en
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: 8.4.b
    text: 'de daartoe bevoegde autoriteit bevestigt in het ladingjournaal:'
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: 8.4.b.1°
    text: dat de tank en de daarbij behorende pompen en pijpleidingen zijn leeggemaakt; en
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: 8.4.b.2°
    text: dat de voorwas van de tank, bedoeld onder *a*, is uitgevoerd; en
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: 8.4.b.3°
    text: dat het aldus ontstane waswater is afgegeven aan een havenontvangstvoorziening totdat de tank leeg is.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: '8.5'
    text: |-
      Bepalingen voor categorie B en C vloeistoffen, buiten een bijzonder gebied Buiten een bijzonder gebied zijn met
      betrekking tot een vloeistof van categorie B of C de navolgende bepalingen van toepassing:
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: 8.5.a
    text: |-
      behoudens het bepaalde onder *b*, dient een tank waaruit de lading is gelost te worden voorgewassen volgens een
      methode als bedoeld in de Standards voordat het schip uit de loshaven vertrekt en het waswater dient te worden
      afgegeven aan een havenontvangstvoorziening in de loshaven, wanneer:
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: 8.5.a.1°
    text: |-
      de geloste vloeistof zodanige eigenschappen heeft dat de hoeveelheid van het in de tank achterblijvende restant na
      het lossen van de tank overeenkomstig de Standards, groter is dan 1 m3 of 1/3000ste van de tankinhoud, welke van
      de twee de grootste is, indien het een vloeistof van categorie B betreft, of groter is dan 3 m3 of 1/1000ste van de
      tankinhoud, welke van de twee de grootste is, indien het een vloeistof van categorie C betreft; of
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: 8.5.a.2°
    text: |-
      het lossen niet is uitgevoerd overeenkomstig de Standards tenzij zodanige maatregelen zijn genomen, dat, ten
      genoegen van de ter plaatse bevoegde autoriteit, de restanten zodanig worden verwijderd dat de achterblijvende
      hoeveelheid niet groter is dan die, bedoeld in [artikel 5A, eerste, tweede, derde of vierde lid][ref1], al naar
      gelang van toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel5A
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004306
        artikel: 5A
  - number: 8.5.b
    text: |-
      de kapitein van een schip kan de bevoegde autoriteit van de plaats waar het schip de lading lost, verzoeken te
      worden ontheven van het bepaalde onder *a*, indien wordt voldaan aan het navolgende:
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: 8.5.b.1°
    text: |-
      de tank, die is leeg gelost, wordt opnieuw geladen met dezelfde vloeistof of met een vloeistof die verenigbaar met
      de vorige en de uitgeloste tank wordt niet gewassen of geballast alvorens deze opnieuw wordt beladen; of
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: 8.5.b.2°
    text: |-
      de tank, die is leeg gelost, wordt op zee niet gewassen of geballast en de tank wordt voorgewassen volgens een
      methode als bedoeld in de Standards en het waswater wordt afgegeven aan een havenontvangstvoorziening in een andere
      haven, voor welke haven schriftelijk is bevestigd dat voldoende havenontvangstvoorzieningen voor dat doel aanwezig
      zijn; of
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: 8.5.b.3°
    text: |-
      de ladingrestanten in een tank worden verwijderd door middel van een methode voor ventilatie als bedoeld in de
      Standards.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: '8.6'
    text: |-
      Bepalingen voor categorie B vloeistoffen, binnen een bijzonder gebied Binnen een bijzonder gebied zijn met
      betrekking tot een vloeistof van categorie B de navolgende bepalingen van toepassing:
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: 8.6.a
    text: |-
      behoudens het bepaalde onder *b* en *c*, dient een tank waaruit de lading is gelost te worden voorgewassen volgens
      een methode als bedoeld in de Standards voordat het schip uit de loshaven vertrekt en het waswater dient te worden
      afgegeven aan een havenontvangstvoorziening in de loshaven;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: 8.6.b
    text: 'het bepaalde onder *a* is niet van toepassing indien wordt voldaan aan alle onderstaande voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: 8.6.b.1°
    text: |-
      de geloste vloeistof heeft zodanige eigenschappen dat de hoeveelheid van het in de tank achterblijvende restant na
      het lossen van de tank overeenkomstig de Standards, niet groter is dan 1 m3 of 1/3000ste van de tankinhoud, welke
      van de twee de grootste is en het restant wordt aan boord gehouden voor lozing in zee buiten een bijzonder gebied
      overeenkomstig het bepaalde van [artikel 5, derde lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel5
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004306
        artikel: '5'
  - number: 8.6.b.2°
    text: |-
      het lossen is uitgevoerd overeenkomstig de Standards, tenzij zodanige maatregelen zijn genomen dat, ten genoegen
      van de ter plaatse bevoegde autoriteit, de restanten zodanig worden verwijderd dat de achterblijvende hoeveelheid
      niet groter is dan die, bedoeld in [artikel 5A, eerste of tweede lid][ref1], al naar gelang van toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel5A
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004306
        artikel: 5A
  - number: 8.6.c
    text: |-
      de kapitein van een schip kan de bevoegde autoriteit van de plaats waar het schip de lading lost, verzoeken te
      worden ontheven van het bepaalde onder *a*, indien wordt voldaan aan het navolgende:
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: 8.6.c.1°
    text: |-
      de tank, die is leeg gelost, wordt opnieuw geladen met dezelfde vloeistof of met een vloeistof die verenigbaar is
      met de vorige en de uitgeloste tank wordt niet gewassen of geballast alvorens deze opnieuw wordt beladen; of
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: 8.6.c.2°
    text: |-
      de tank, die is leeg gelost, wordt op zee niet gewassen of geballast en de tank wordt voorgewassen volgens een
      methode als bedoeld in de Standards en het waswater wordt afgegeven aan een havenontvangstvoorziening in een andere
      haven, voor welke haven schriftelijk is bevestigd dat voldoende havenontvangstvoorzieningen voor dat doel aanwezig
      zijn; of
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: 8.6.c.3°
    text: |-
      de ladingrestanten in een tank worden verwijderd door middel van een methode van ventilatie als bedoeld in de
      Standards.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: '8.7'
    text: |-
      Bepalingen voor categorie C vloeistoffen, binnen een bijzonder gebied Binnen een bijzonder gebied zijn met
      betrekking tot een vloeistof van categorie C de navolgende bepalingen van toepassing:
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: 8.7.a
    text: |-
      behoudens het bepaalde onder *b* en *c*, dient een tank waaruit de lading is gelost te worden voorgewassen volgens
      een methode als bedoeld in de Standards voordat het schip de loshaven verlaat en het waswater dient te worden
      afgegeven aan een havenontvangstvoorziening in de loshaven, wanneer:
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: 8.7.a.1°
    text: |-
      de geloste vloeistof zodanige eigenschappen heeft dat de hoeveelheid van het in de tank achterblijvende restant na
      het lossen van de tank overeenkomstig de Standards, groter is dan 1 m3 of 1/3000ste van de tankinhoud, welke van de
      twee de grootste is; of
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: 8.7.a.2°
    text: |-
      het lossen niet is uitgevoerd overeenkomstig de Standards tenzij zodanige maatregelen zijn genomen dat, ten
      genoegen van de ter plaatse bevoegde autoriteit, de restanten zodanig worden verwijderd dat de achterblijvende
      hoeveelheid niet groter is dan die, bedoeld in [artikel 5A, derde of vierde lid][ref1], al naar gelang van
      toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel5A
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004306
        artikel: 5A
  - number: 8.7.b
    text: 'het bepaalde onder *a* is niet van toepassing indien wordt voldaan aan alle onderstaande voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: 8.7.b.1°
    text: |-
      de geloste vloeistof heeft zodanige eigenschappen dat de hoeveelheid van het in de tank achterblijvende restant na
      het lossen van de tank overeenkomstig de Standards, niet groter is dan 3 m3 of 1/1000ste van de tankinhoud, welke
      van de twee de grootste is en het restant wordt aan boord gehouden voor lozing in zee buiten een bijzonder gebied
      overeenkomstig het bepaalde in [artikel 5, vierde lid][ref1]; en


