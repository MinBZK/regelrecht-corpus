        artikel: 5A
  - number: 8.7.c
    text: |-
      de kapitein van een schip kan de bevoegde autoriteit van de plaats waar het schip de lading lost, verzoeken te
      worden ontheven van het bepaalde onder *a*, indien wordt voldaan aan het navolgende:
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: 8.7.c.1°
    text: |-
      de tank, die is leeg gelost, wordt opnieuw geladen met dezelfde vloeistof of met een vloeistof die verenigbaar is
      met de vorige en de uitgeloste tank wordt niet gewassen of geballast alvorens deze opnieuw wordt beladen; of
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: 8.7.c.2°
    text: |-
      de tank, die is leeg gelost, wordt op zee niet gewassen of geballast en de tank wordt voorgewassen volgens een
      methode als bedoeld in de Standards en het waswater wordt afgegeven aan een havenontvangstvoorziening in een andere
      haven, voor welke haven schriftelijk is bevestigd dat voldoende havenontvangstvoorzieningen voor dat doel aanwezig
      zijn; of
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: 8.7.c.3°
    text: |-
      de ladingrestanten in een tank worden verwijderd door middel van een methode van ventilatie als bedoeld in de
      Standards.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: '8.8'
    text: |-
      Bepalingen voor categorie D vloeistoffen, zowel binnen als buiten een bijzonder gebied De ladingrestanten van een
      tank die een vloeistof van categorie D heeft bevat en die achterblijven nadat de tank is leeg gelost, dienen te
      worden verdund en in zee geloosd overeenkomstig het bepaalde in [artikel 5, vijfde lid][ref1], of door middel van
      het wassen van een tank te worden verwijderd en afgegeven aan een havenontvangstvoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel5
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004306
        artikel: '5'
  - number: '8.9'
    text: |-
      Ladingrestanten in sloptanks Alle ladingrestanten die aan boord worden gehouden in een sloptank, inbegrepen de
      restanten van de vullings van de ladingpompkamer, dienen te worden afgegeven aan een havenontvangstvoorziening:
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
  - number: 8.9.a
    text: |-
      overeenkomstig het bepaalde in [artikel 5, tweede lid][ref1], indien de restanten een vloeistof van categorie A
      bevatten; of


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel5
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004306
        artikel: '5'
  - number: 8.9.b
    text: |-
      binnen een bijzonder gebied overeenkomstig het bepaalde in [artikel 5, zesde of zevende lid][ref1], al naar gelang
      van toepassing indien de restanten een vloeistof van categorie A of B bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel5
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004306
        artikel: '5'
  - number: '9.1'
    text: |-
      Elk schip waarop dit besluit van toepassing is, moet zijn voorzien van een ladingjournaal ingericht overeenkomstig
      het model als aangegeven in Aanhangsel IV van Bijlage II van het Verdrag.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel9
  - number: '9.2'
    text: |-
      Het ladingjournaal dient, voor elke tank afzonderlijk, te worden ingevuld telkens wanneer een van de volgende
      handelingen aan boord plaatsvindt:
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel9
  - number: 9.2.a
    text: het innemen van lading;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel9
  - number: 9.2.b
    text: het overbrengen van lading van de ene tank naar een andere tank;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel9
  - number: 9.2.c
    text: het lossen van lading;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel9
  - number: 9.2.d
    text: het schoonmaken van ladingtanks;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel9
  - number: 9.2.e
    text: het ballasten van ladingtanks;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel9
  - number: 9.2.f
    text: het ontballasten van ladingtanks;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel9
  - number: 9.2.g
    text: het afgeven van restanten aan havenontvangstvoorzieningen; en
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel9
  - number: 9.2.h
    text: |-
      het lozen in zee, of het ventileren van tanks, overeenkomstig het bepaalde in [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel5
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004306
        artikel: '5'
  - number: '9.3'
    text: |-
      Indien schadelijke vloeistoffen of mengsels die dergelijke vloeistoffen bevatten worden geloosd overeenkomstig het
      bepaalde in [artikel 6][ref1], hetzij opzettelijk hetzij per ongeluk, dient melding in het ladingjournaal te worden
      gemaakt van de omstandigheden waaronder en de redenen waarom de lozing geschiedde.


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel6
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004306
        artikel: '6'
  - number: 9.4.a
    text: |-
      Elke handeling als bedoeld in het tweede en derde lid dient onverwijld en volledig te worden vermeld in het
      ladingjournaal en wel zodanig dat alle rubrieken die betrekking hebben op de handeling, worden ingevuld. Deze
      vermelding dient in de Nederlandse en in de Engelse taal te worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel9
  - number: 9.4.b
    text: |-
      Elke aantekening in het ladingjournaal moet door een officier of de officieren, belast met het toezicht op de
      betreffende handelingen, worden ondertekend. Elk ingevulde bladzijde van het ladingjournaal moet worden ondertekend
      door de kapitein.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel9
  - number: '9.5'
    text: |-
      Het ladingjournaal moet, behalve in geval van een onbemand gesleept schip, op een zodanige plaats aan boord worden
      bewaard dat het op elk redelijk tijdstip beschikbaar is voor onderzoek door de daartoe bevoegde autoriteit. Het
      ladingjournaal moet gedurende een periode van drie jaren na dagtekening van de laatste aantekening worden bewaard.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel9
  - number: '10.1'
    text: 'Elk schip dat schadelijke vloeistoffen in bulk vervoert is onderworpen aan:'
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel10
  - number: 10.1.a
    text: |-
      een eerste onderzoek dat wordt verricht voordat het schip in dienst wordt gesteld of voordat het certificaat,
      bedoeld in [artikel 11][ref1], voor de eerste maal wordt afgegeven, en dat een volledig onderzoek van de bouw,
      uitrusting, systemen, onderdelen, voorzieningen en materialen van het schip omvat teneinde na te gaan of wordt
      voldaan aan de regels bij of krachtens dit besluit gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel11
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004306
        artikel: '11'
  - number: 10.1.b
    text: |-
      een hernieuwd onderzoek dat wordt verricht met door de inspecteur-generaal vast te stellen tussenpozen die,
      behoudens indien [artikel 12, tweede, vijfde, zesde of zevende lid][ref1], van toepassing is, niet langer dan
      vijf jaar zijn, en dat de bouw, uitrusting, systemen, onderdelen, voorzieningen en materialen van het schip omvat
      teneinde na te gaan of wordt voldaan aan de regels bij of krachtens dit besluit gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel12
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004306
        artikel: '12'
  - number: 10.1.c
    text: |-
      een tussentijds onderzoek dat wordt verricht binnen drie maanden voor of na de tweede of de derde verjaardatum
      en dat in de plaats komt van een van de jaarlijkse onderzoeken als bedoeld onder *d*, en dat de uitrusting en
      de daarbij behorende pompen en pijpleidingen van het schip omvat teneinde na te gaan of wordt voldaan aan de
      regels bij of krachtens dit besluit gesteld. Van dit tussentijds onderzoek wordt een aantekening geplaatst op het
      certificaat;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel10
  - number: 10.1.d
    text: |-
      een jaarlijks onderzoek dat wordt verricht binnen drie maanden voor of na elke verjaardatum en dat de bouw,
      uitrusting, systemen, onderdelen, voorzieningen en materialen van het schip omvat teneinde na te gaan of zij zijn
      onderhouden overeenkomstig het tweede lid, onder *a*, en zich in goede staat bevinden. Van dit jaarlijks onderzoek
      wordt een aantekening geplaatst op het certificaat;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel10
  - number: 10.1.e
    text: |-
      een aanvullend onderzoek dat afhankelijk van de omstandigheden hetzij geheel, hetzij gedeeltelijk wordt verricht,
      indien herstellingen of vernieuwingen zijn uitgevoerd, of indien zich een ongeval heeft voorgedaan, waarbij wordt
      nagegaan of de noodzakelijke reparaties of vernieuwingen deugdelijk zijn doorgevoerd en of wordt voldaan aan de
      regels bij of krachtens dit besluit gesteld.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel10
  - number: 10.2.a
    text: |-
      De toestand van het schip en van de uitrusting dient te worden gehandhaafd in overeenstemming met de bepalingen
      vastgesteld bij of krachtens dit besluit om zeker te stellen dat het schip in alle opzichten geschikt blijft tot
      het verlaten van een haven zonder dat het een gevaar vormt voor verontreiniging van het mariene milieu.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel10
  - number: 10.2.b
    text: |-
      Nadat een onderzoek als bedoeld in het eerste lid is voltooid, mag zonder toestemming van de inspecteur-generaal
      geen verandering worden aangebracht in de bouw, uitrusting, systemen, onderdelen, voorzieningen en materialen die
      aan het onderzoek zijn onderworpen, tenzij het de onmiddellijke vervanging van dergelijke uitrusting of onderdelen
      betreft.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel10
  - number: 10.2.c
    text: |-
      Indien een schip een ongeval overkomt, of indien gebreken worden geconstateerd die de hechtheid van het schip, de
      doelmatigheid of de volledigheid van de uitrusting, vallende onder de bepalingen van dit besluit in belangrijke
      mate beïnvloeden, dient de kapitein of de eigenaar van het schip de inspecteur-generaal zo spoedig mogelijk in
      te lichten. Indien het schip zich in een haven buiten Nederland bevindt, dient de kapitein of de eigenaar tevens
      onmiddellijk de ter plaatse bevoegde autoriteit in te lichten.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel10
  - number: '11.1'
    text: |-
      Het Internationaal certificaat van voorkoming van verontreiniging voor het vervoer van schadelijke vloeistoffen
      in bulk wordt door de inspecteur-generaal afgegeven na de voltooiing van een eerste of een hernieuwd onderzoek als
      bedoeld in [artikel 10, eerste lid, onder ][ref1], ten behoeve van elk schip dat schadelijke vloeistoffen in bulk
      vervoert.


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel10
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004306
        artikel: '10'
  - number: 11.2.a
    text: |-
      De inspecteur-generaal kan een daartoe bevoegde regering verzoeken de onderzoeken, bedoeld in [artikel 10][ref1]
      uit te voeren en het certificaat af te geven, of, voorzover van toepassing, een aantekening te plaatsen.


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel10
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004306
        artikel: '10'
  - number: 11.2.b.1°
    text: |-
      Op verzoek van een daartoe bevoegde regering kan namens de inspecteur-generaal een schip dat niet gerechtigd is de
      Nederlandse vlag te voeren, aan de in [artikel 10][ref1] genoemde onderzoeken worden onderworpen en kan ten behoeve
      van dat schip een certificaat worden afgegeven, of, voorzover van toepassing, een aantekening worden geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel10
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004306
        artikel: '10'
  - number: 11.2.b.2°
    text: |-
      Een afschrift van het certificaat en een afschrift van het rapport van onderzoek worden zo spoedig mogelijk
      toegezonden aan de regering die het verzoek heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel11
  - number: 11.2.b.3°
    text: |-
      Een krachtens het bepaalde onder 1° afgegeven certificaat zal een verklaring bevatten, inhoudende dat het is
      afgegeven op verzoek van de betrokken regering.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel11
  - number: '11.3'
    text: |-
      Er wordt geen certificaat afgegeven aan een schip dat gerechtigd is de vlag te voeren van een staat die geen partij
      is bij het Verdrag.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel11
  - number: '11.4'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld betreffende de aanvraag tot het verkrijgen van een
      certificaat en de daarbij te overleggen bescheiden.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel11
  - number: '11.5'
    text: |-
      De inspecteur-generaal kan nadere voorschriften geven betreffende de aanvraag tot het verkrijgen van een
      certificaat en de daarbij te overleggen bescheiden.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel11
  - number: '12.1'
    text: |-
      Het Internationaal certificaat van voorkoming van verontreiniging voor het vervoer van schadelijke vloeistoffen in
      bulk wordt door de inspecteur-generaal afgegeven voor een periode van ten hoogste vijf jaar.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel12
  - number: '12.2'
    text: |-
      In afwijking van het eerste lid is, indien het hernieuwde onderzoek binnen drie maanden voor de vervaldatum van het
      bestaande certificaat wordt voltooid, het nieuwe certificaat geldig vanaf de datum van voltooiing van dit onderzoek
      tot een datum niet later dan vijf jaar na de vervaldatum van het bestaande certificaat.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel12
  - number: '12.3'
    text: |-
      Onverminderd het eerste lid is, indien het hernieuwde onderzoek binnen drie maanden na de vervaldatum van het
      bestaande certificaat wordt voltooid, het nieuwe certificaat geldig vanaf de datum van voltooiing van dit onderzoek
      tot een datum niet later dan vijf jaar na de vervaldatum van het bestaande certificaat.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel12
  - number: '12.4'
    text: |-
      Indien een certificaat wordt afgegeven voor een periode korter dan vijf jaar, kan de inspecteur-generaal na de
      voltooiing van een tussentijds of jaarlijks onderzoek de geldigheidsduur van het certificaat verlengen tot een
      periode van vijf jaar.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel12
  - number: '12.5'
    text: |-
      Indien een hernieuwd onderzoek wordt voltooid en indien geen nieuw certificaat ten behoeve van het schip kan
      worden afgegeven voor de vervaldatum van het bestaande certificaat, kan daarvan een aantekening op het bestaande
      certificaat worden geplaatst. In afwijking van het eerste lid wordt in dat geval de geldigheidsduur van het
      certificaat verlengd voor een periode van niet langer dan vijf maanden na de vervaldatum.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel12
  - number: '12.6'
    text: |-
      In afwijking van het eerste lid kan, indien een schip zich op het tijdstip waarop het certificaat zijn geldigheid
      verliest niet in een haven bevindt waar het hernieuwde onderzoek kan plaatsvinden, de inspecteur-generaal de
      geldigheidsduur van het certificaat verlengen voor een periode van ten hoogste drie maanden na de vervaldatum,
      uitsluitend om het schip in staat te stellen de reis naar de haven waar het moet worden onderzocht te voltooien. Na
      de voltooiing van het hernieuwde onderzoek in die haven is het nieuwe certificaat geldig tot een datum niet later
      dan vijf jaar na de oorspronkelijke vervaldatum van het bestaande certificaat.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel12
  - number: '12.7'
    text: |-
      In afwijking van het eerste lid kan, indien een certificaat is afgegeven ten behoeve van een schip dat korte
      reizen maakt en de geldigheidsduur van het certificaat niet is verlengd ingevolge een van de andere leden, de
      inspecteur-generaal de geldigheidsduur van het certificaat verlengen voor een periode van ten hoogste een maand na
      de vervaldatum. Na de voltooiing van het hernieuwde onderzoek is het nieuwe certificaat geldig tot een datum niet
      later dan vijf jaar na de oorspronkelijke vervaldatum van het bestaande certificaat.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel12
  - number: '12.8'
    text: |-
      In bijzondere omstandigheden behoeft een nieuw certificaat niet te worden gedateerd vanaf de vervaldatum van het
      bestaande certificaat. Na de voltooiing van het hernieuwde onderzoek in deze bijzondere omstandigheden is het
      nieuwe certificaat geldig tot een datum niet later dan vijf jaar na de datum van voltooiing van het hernieuwde
      onderzoek.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel12
  - number: '12.9'
    text: |-
      Indien een tussentijds of jaarlijks onderzoek wordt voltooid voor de aanvang van de periode waarin het dient plaats
      te vinden, worden er, voorzover van toepassing, een of meer aanvullende tussentijdse of jaarlijkse onderzoeken
      verricht, zodat de maximale tussenpozen tussen de onderzoeken, bedoeld in [artikel 10][ref1], niet worden
      overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel10
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004306
        artikel: '10'
  - number: 12.10.a
    text: 'Het certificaat verliest zijn geldigheid wanneer:'
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel12
  - number: 12.10.a.1°
    text: de op het certificaat aangegeven periode van geldigheid is verstreken;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel12
  - number: 12.10.a.2°
    text: |-
      het tussentijds of jaarlijks onderzoek niet is uitgevoerd binnen de gestelde periode danwel indien daarvan geen
      aantekening is gemaakt op het certificaat;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel12
  - number: 12.10.a.3°
    text: het schip ophoudt te behoren tot de categorie van schepen, waarop dit besluit van toepassing is;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel12
  - number: 12.10.a.4°
    text: |-
      de bouw, uitrusting, systemen, onderdelen, voorzieningen en materialen van het schip op ingrijpende wijze worden
      gewijzigd zonder de toestemming van de inspecteur-generaal tenzij het de onmiddellijke vervanging van dergelijke
      uitrusting en onderdelen betreft;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel12
  - number: 12.10.a.5°
    text: |-
      de naam van het schip wordt veranderd of het schip een andere roepnaam krijgt. In dat geval wordt op aanvraag
      een nieuw certificaat afgegeven voor het nog niet verstreken gedeelte van het tijdvak, waarvoor het vervallen
      certificaat zou hebben gegolden; en
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel12
  - number: 12.10.a.6°
    text: het schip niet meer gerechtigd is de Nederlandse vlag te voeren.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel12
  - number: 12.10.b
    text: |-
      Een vervallen certificaat moet door de eigenaar van het schip zo spoedig mogelijk aan de inspecteur-generaal worden
      ingezonden door tussenkomst van de ambtenaren van de divisie Scheepvaart, de ambtenaren met de in- of uitklaring
      belast, dan wel de Nederlandse diplomatieke of consulaire ambtenaren.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel12
  - number: 12.10.c
    text: Voor een ingezonden certificaat wordt desverlangd een bewijs van ontvangst afgegeven.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel12
  - number: 12.11.a
    text: 'Een certificaat kan door de inspecteur-generaal worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel12
  - number: 12.11.a.1°
    text: wanneer het schip schade van betekenis heeft opgelopen en de herstelling daarvan niet naar behoren is geschied; of
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel12
  - number: 12.11.a.2°
    text: |-
      wanneer uit een onderzoek is gebleken dat het schip niet zonder gevaar voor verontreiniging van het mariene milieu
      de haven kan verlaten.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel12
  - number: 12.11.b
    text: |-
      Indien een certificaat wordt ingetrokken, wordt de eigenaar van het schip zo spoedig mogelijk bericht gezonden,
      onder vermelding van de redenen, welke tot de intrekking hebben geleid.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel12
  - number: '12.12'
    text: |-
      In afwijking van het tiende lid, onder *a*, 2°, kan de inspecteur-generaal, indien het certificaat zijn geldigheid
      heeft verloren omdat een tussentijds of jaarlijks onderzoek niet binnen de gestelde periode is verricht, in
      bijzondere omstandigheden de geldigheid van het certificaat herstellen, nadat door middel van een inspectie is
      vastgesteld dat het schip voldoet aan de regels bij of krachtens dit besluit gesteld. De omvang van deze inspectie
      is ter beoordeling van de inspecteur-generaal.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel12
  - number: 12A
    text: |-
      Een chemicaliëntankschip voldoet aan het bepaalde in de [artikelen 10][ref1], [11][ref2] en [12][ref3], indien
      voor dit schip een Certificaat van geschiktheid voor het vervoer van gevaarlijke chemicaliën in bulk is uitgereikt
      overeenkomstig het bepaalde in de Internationale Bulk Chemicaliën Code of Bulk Chemicaliën Code zoals van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0004306#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0004306#Artikel12
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel12A
    references:
      - id: ref1
        bwb_id: BWBR0004306
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0004306
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0004306
        artikel: '12'
  - number: '13.1'
    text: |-
      Het ontwerp, de bouw, de uitrusting en de bedrijfsvoering van een schip dat schadelijke vloeistoffen van de
      categorieën A, B of C in bulk vervoert, dienen zodanig te zijn dat het in zee geraken van deze vloeistoffen bij
      scheepsongevallen redelijkerwijs zoveel mogelijk wordt beperkt.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel13
  - number: '13.2'
    text: |-
      Een chemicaliëntankschip gebouwd op of na 1 juli 1986 dient te voldoen aan de bij ministeriële regeling gestelde
      regels ter uitvoering van de Internationale Bulk Chemicaliën Code.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel13
  - number: '13.3'
    text: |-
      Een chemicaliëntankschip gebouwd voor 1 juli 1986 dient te voldoen aan de bij ministeriële regeling gestelde regels
      ter uitvoering van de Bulk Chemicaliën Code.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel13
  - number: '14.1'
    text: |-
      Niettegenstaande het bepaalde in dit besluit mogen schadelijke vloeistoffen van de categorieën C of D, die
      door Onze Minister worden aangemerkt als olie-achtige stoffen, worden vervoerd en geloosd overeenkomstig de
      voorschriften van het [Besluit voorkoming olieverontreiniging door schepen][ref1], mits wordt voldaan aan alle
      onderstaande voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0003936
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003936
  - number: 14.1.a
    text: |-
      het schip voldoet aan de van toepassing zijnde bepalingen voor een produktentankschip zoals vereist in genoemd
      besluit;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel14
  - number: 14.1.b
    text: |-
      het schip is voorzien van een Internationaal certificaat van voorkoming van verontreiniging door olie en het
      aanhangsel B en op dit certificaat is aangetekend welke olie-achtige stoffen het schip mag vervoeren; en
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel14
  - number: 14.1.c
    text: |-
      het bewaking- en regelsysteem voor olielozingen geschikt is voor het bewaken van
      de lozing van de te vervoeren olie-achtige stoffen en die uitrusting voldoet aan
      [artikel 2a, eerste of tweede lid, van het Besluit voorkoming olieverontreiniging door schepen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel2a
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: 2a
  - number: '14.2'
    text: |-
      Voor een schip dat een vloeistof van categorie C vervoert is het bepaalde in het eerste lid alleen van toepassing,
      indien tevens wordt voldaan aan:
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel14
  - number: 14.2.a
    text: |-
      de stabiliteitscriteria voor een type III schip zoals genoemd in de Internationale Bulk Chemicaliën Code, indien
      het schip is gebouwd op of na 1 juli 1986; of
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel14
  - number: 14.2.b
    text: |-
      de stabiliteitscriteria voor een type III schip zoals genoemd in de Bulk Chemicaliën Code, indien het schip is
      gebouwd voor 1 juli 1986.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel14
  - number: 14A.1
    text: |-
      Elk schip met een tonnage van 150 of meer waarvoor een Internationaal certificaat van voorkoming van
      verontreiniging voor het vervoer van schadelijke vloeistoffen in bulk is afgegeven, heeft een door de inspecteur-
      generaal goedgekeurd scheepsnoodplan voor verontreiniging van de zee door schadelijke vloeistoffen aan boord.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel14A
  - number: 14A.2
    text: 'Een scheepsnoodplan voor verontreiniging van de zee door schadelijke vloeistoffen bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel14A
  - number: 14A.2.a
    text: |-
      de procedure die de kapitein of een ander bemanningslid dat de leiding van het schip heeft, moet volgen voor het
      melden van een voorval van verontreiniging door schadelijke vloeistoffen;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel14A
  - number: 14A.2.b
    text: |-
      een lijst van autoriteiten of personen aan wie een voorval van verontreiniging door schadelijke vloeistoffen moet
      worden gemeld;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel14A
  - number: 14A.2.c
    text: |-
      een gedetailleerde beschrijving van de maatregelen welke de bemanning onmiddellijk moet nemen om de uitstroom van
      schadelijke vloeistoffen ten gevolge van een voorval zoveel mogelijk te beperken;
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel14A
  - number: 14A.2.d
    text: |-
      de procedure en contactpersoon aan boord van het schip voor het coördineren van de maatregelen aan boord met
      nationale en plaatselijke autoriteiten bij het bestrijden van een verontreiniging door schadelijke vloeistoffen.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel14A
  - number: 14A.3
    text: |-
      Een schip waarop [artikel 26 van het Besluit voorkoming olieverontreiniging][ref1] door schepen naast dit artikel
      van toepassing is, mag het scheepsnoodplan voor verontreiniging van de zee door schadelijke vloeistoffen combineren
      met het scheepsnoodplan voor olieverontreiniging, bedoeld in [dat artikel][ref2]. In dat geval is de titel van het
      plan: scheepsnoodplan voor verontreiniging van de zee.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0003936#Artikel26
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel14A
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0003936
        artikel: '26'
  - number: '15'
    text: |-
      Ter uitvoering van internationale afspraken en besluiten van volkenrechtelijke organisaties over voorkoming van
      verontreiniging door met schepen in bulk vervoerde schadelijke vloeistoffen kunnen bij ministeriële regeling nadere
      regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel15
  - number: '16.1'
    text: |-
      De inspecteur-generaal kan, indien bijzondere omstandigheden daartoe nopen, geheel of gedeeltelijke
      ontheffing verlenen van de bij of krachtens dit besluit gestelde regelen met betrekking tot de
      bouw, inrichting of uitrusting van een schip, met dien verstande dat uitrusting als bedoeld in
      [artikel 14, eerste lid, onderdeel c][ref1], moet zijn voorzien van het merk van overeenstemming, bedoeld in
      [artikel 2a van het Besluit voorkoming olieverontreiniging door schepen][ref2], of zijn vergezeld van een in
      [dat artikel][ref3] bedoeld certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003936#Artikel2a
      [ref3]: https://wetten.overheid.nl/BWBR0003936#Artikel2a
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004306
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0003936
        artikel: 2a
      - id: ref3
        bwb_id: BWBR0003936
        artikel: 2a
  - number: '16.2'
    text: |-
      Indien een ontheffing als bedoeld in het eerste lid wordt verleend aan een schip dat een certificaat behoeft als
      bedoeld in [artikel 11][ref1], dient daarvan aantekening te worden gemaakt op het certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel11
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004306
        artikel: '11'
  - number: '17'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin het
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel17
  - number: '18'
    text: |-
      Dit besluit kan worden aangehaald als "Besluit voorkoming verontreiniging door met schepen in bulk vervoerde
      schadelijke vloeistoffen".
    url: https://wetten.overheid.nl/BWBR0004306/2005-05-18#Artikel18
