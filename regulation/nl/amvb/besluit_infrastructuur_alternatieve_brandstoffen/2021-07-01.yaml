  - number: '4'
    text: |-
      Een publiek toegankelijk oplaadpunt biedt gebruikers van elektrische voertuigen een ad-hoc oplaaddienst, waarbij
      geen contract hoeft te worden gesloten met een elektriciteitsleverancier of exploitant van het oplaadpunt.
    url: https://wetten.overheid.nl/BWBR0039567/2021-07-01#Artikel4
  - number: '5'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot:

      a. een oplaadpunt als bedoeld in bijlage II, onderdelen 1.1, 1.2, 1.3, 1.5 en 1.6, van [richtlijn 2014/94]
      (32014L0094)/EU;

      b. een accuwissel als bedoeld in bijlage II, onderdeel 1.4, van [richtlijn 2014/94](32014L0094)/EU;

      c. een walstroomvoorziening als bedoeld in bijlage II, onderdelen 1.7 en 1.8, van [richtlijn 2014/94](32014L0094)/
      EU;

      d. een waterstoftankpunt als bedoeld in bijlage II, onderdelen 2.1 en 2.3, van [richtlijn 2014/94](32014L0094)/EU;

      e. de zuiverheid van de waterstof, bedoeld in bijlage II, onderdeel 2.2, van [richtlijn 2014/94](32014L0094)/EU;

      f. connectoren voor motorvoertuigen voor het tanken van gasvormige waterstof als bedoeld in bijlage II, onderdeel
      2.4, van [richtlijn 2014/94](32014L0094)/EU;

      g. een tankpunt voor vloeibaar aardgas voor binnen- of zeeschepen als bedoeld in bijlage II, onderdeel 3.1, van
      [richtlijn 2014/94](32014L0094)/EU;

      h. een tankpunt voor vloeibaar aardgas voor motorvoertuigen als bedoeld in bijlage II, onderdeel 3.2, van
      [richtlijn 2014/94](32014L0094)/EU;

      i. een connector of aansluitpunt voor gecomprimeerd aardgas als bedoeld in bijlage II, onderdeel 3.3, van
      [richtlijn 2014/94](32014L0094)/EU; en

      j. een tankpunt voor gecomprimeerd aardgas voor motorvoertuigen als bedoeld in bijlage II, onderdeel 3.4, van
      [richtlijn 2014/94](32014L0094)/EU.
    url: https://wetten.overheid.nl/BWBR0039567/2021-07-01#Artikel5
  - number: '6'
    text: |-
      1 Bij ministeriële regeling kunnen regels worden gesteld over informatie met betrekking tot na 18 november 2016 op
      de markt gebrachte motorvoertuigen die wordt aangeboden:

      a. door fabrikanten van motorvoertuigen, op het motorvoertuig en in motorvoertuighandleidingen;

      b. door de houders van tank- of oplaadpunten, bij tank- en oplaadpunten;

      c. door verkopers van motorvoertuigen, bij verkooppunten van motorvoertuigen.

      2 Bij ministeriële regeling kunnen regels worden gesteld over het ter beschikking stellen van gegevens over publiek
      toegankelijke tankpunten en oplaadpunten voor alternatieve brandstoffen.
    url: https://wetten.overheid.nl/BWBR0039567/2021-07-01#Artikel6
  - number: '7'
    text: |-
      Het bevoegd gezag, bedoeld in [artikel 1.1, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref1],
      heeft tot taak zorg te dragen voor de bestuursrechtelijke handhaving van hetgeen bepaald bij of krachtens
      [artikel 5, onderdelen d, f, g, voor zover het vaste tankpunten betreft, en h tot en met j][ref2].


