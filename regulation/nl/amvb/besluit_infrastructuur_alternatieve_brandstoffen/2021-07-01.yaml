  - number: '2'
    text: |-
      1 Het is verboden oplaad- of tankpunten, tankpunten voor vloeibaar aardgas, accuwissels, walstroomvoorzieningen,
      waterstof, connectoren voor motorvoertuigen voor het tanken van gasvormige waterstof, connectoren of aansluitpunten
      voor gecomprimeerd aardgas en motorvoertuigen te vervaardigen, in de handel te brengen of op de markt aan te bieden
      anders dan met inachtneming van de bij dit besluit gestelde voorschriften.

      2 Het is verboden oplaad- of tankpunten, tankpunten voor vloeibaar aardgas, accuwissels, walstroomvoorzieningen,
      waterstof, connectoren voor motorvoertuigen voor het tanken van gasvormige waterstof, connectoren of aansluitpunten
      voor gecomprimeerd aardgas en motorvoertuigen in de handel te brengen of op de markt aan te bieden anders dan met
      inachtneming van de voorschriften bij of krachtens dit besluit gesteld met betrekking tot technische specificaties
      voor die oplaad- of tankpunten en informatie over die motorvoertuigen.

      3 Het is verboden oplaad- of tankpunten, tankpunten voor vloeibaar aardgas, accuwissels, walstroomvoorzieningen,
      waterstof, connectoren voor motorvoertuigen voor het tanken van gasvormige waterstof, connectoren of aansluitpunten
      voor gecomprimeerd aardgas en motorvoertuigen binnen Nederlands grondgebied te brengen anders dan met inachtneming
      van de bij of krachtens dit besluit gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0039567/2021-07-01#Artikel2
  - number: '3'
    text: |-
      1 Een publiek toegankelijk oplaadpunt voor elektrische voertuigen is, voor zover dit technisch haalbaar en
      financieel gezien redelijk is, voorzien van een meetinrichting die zodanig is beveiligd dat een passende
      bescherming van het dataverkeer en de privacy van eindafnemers wordt geboden, in overeenstemming met de
      Uniewetgeving inzake de bescherming van persoonsgegevens en van de persoonlijke levenssfeer. Deze meetinrichting is
      daarnaast geschikt, om:

      a. het actuele vermogen in Watt te registreren en weer te geven;

      b. de actuele meterstand in KWH voor de van het net afgenomen en verbruikte elektriciteit en voor de op het net
      ingevoede elektriciteit voor de verschillende tariefperioden te registeren en weer te geven;

      c. ten minste elk kwartier de gegevens, bedoeld in onderdeel b, te registreren en
      deze gegevens ten minste dagelijks op afstand met een netbeheerder als bedoeld in
      [artikel 1, eerste lid, onderdeel k, van de Elektriciteitswet 1998][ref1] uit te wisselen op zodanige wijze dat de
      netbeheerder de uitgewisselde gegevens kan lezen en gebruiken; en

      d. informatie over de werkelijke tijd van het verbruik te verschaffen.

      2 In geval van een meetinrichting als bedoeld in het eerste lid, verstrekt een leverancier als bedoeld in
      [artikel 1, eerste lid, onderdeel f, van de Elektriciteitswet 1998][ref2] op verzoek van de eigenaar of exploitant
      van een publiek toegankelijk oplaadpunt of van een derde partij die namens deze eigenaar of exploitant optreedt,
      meetgegevens inzake de input en output van elektriciteit, in een gemakkelijk te begrijpen vorm die vergelijking van
      aanbiedingen op basis van gelijke criteria mogelijk maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel1
