articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *alternatieve brandstoffen:* brandstoffen of energiebronnen die, althans gedeeltelijk, dienen als vervanging van
      fossiele oliebronnen in de energievoorziening voor vervoer en die ertoe kunnen bijdragen dat de energievoorziening
      koolstofvrij wordt en de milieuprestaties van de vervoerssector beter worden. Het betreft hier onder meer: –
      elektriciteit; – waterstof; – biobrandstoffen, zoals gedefinieerd in artikel 2, punt i), van [Richtlijn 2009/28/
      EG](32009L0028) van het Europees Parlement en de Raad van 23 april 2009 ter bevordering van het gebruik van energie
      uit hernieuwbare bronnen en houdende wijziging en intrekking van [Richtlijn 2001/77/EG](32001L0077) en [Richtlijn
      2003/30/EG](32003L0030); – synthetische en paraffinehoudende brandstoffen; – aardgas, met inbegrip van biomethaan,
      in gasvorm en in vloeibare vorm; en – vloeibaar petroleumgas.
        - *elektrisch voertuig:* een motorvoertuig, uitgerust met een aandrijving die bestaat uit ten minste één niet-
      perifere elektromotor als energieomzetter met een elektrisch oplaadbaar energieopslagsysteem, dat extern kan worden
      opgeladen;
        - *oplaadpunt:* een aansluiting voor het opladen van een elektrisch voertuig of wisselen van een batterij van een
      elektrisch voertuig;
        - *motorvoertuigen:* motorrijtuigen als bedoeld in [artikel 1, onderdeel c, van de Wegenverkeerswet 1994][ref1];
        - *publiek toegankelijk oplaad- of tankpunt:* oplaad- of tankpunt dat op niet-discriminerende basis toegang
      verleent aan gebruikers in de gehele Unie;
        - *richtlijn 2014/94/EU:* [richtlijn 2014/94](32014L0094)/EU van het Europees Parlement en de Raad van 22 oktober
      2014 betreffende de uitrol van infrastructuur voor alternatieve brandstoffen (PbEU 2014, L 307);
        - *tankpunt:* een tankvoorziening voor bevoorrading van gelijk welke brandstof, met uitzondering van vloeibaar
      aardgas, via een vaste of mobiele installatie;
        - *tankpunt voor vloeibaar aardgas:* tankvoorziening voor bevoorrading met vloeibaar aardgas, bestaande uit een
      vaste of mobiele installatie of een offshorefaciliteit of een ander systeem;
        - *walstroomvoorziening:* voorziening van elektrische stroom aan de wal voor zeeschepen of binnenvaartschepen die
      aan de kade liggen, door middel van een gestandaardiseerde aansluiting.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0039567/2021-07-01#Artikel1
