  - number: '10'
    text: |-
      1 Het wezenpensioen en het tijdelijk wezenpensioen bedragen van het in [artikel 9, eerste lid][ref1], bedoelde
      invaliditeitspensioen:

      a. indien aan hetzelfde overlijden door de verzorger van de wees recht op een partnerpensioen of tijdelijk
      partnerpensioen, dan wel recht op een bijzonder partnerpensioen ingevolge dit besluit of het pensioenreglement
      wordt ontleend, een zevende gedeelte en,

      b. in alle andere gevallen, twee zevende gedeelten.

      2 Het gezamenlijk bedrag van de wezenpensioenen of tijdelijke wezenpensioenen gaat een bedrag, gelijk aan vijf
      zevende gedeelten van het pensioen waarvan zij zijn afgeleid niet te boven.

      3 Indien wegens toepassing van het vorige lid de wezenpensioenen of tijdelijke wezenpensioenen een vermindering
      moeten ondergaan, geschiedt deze in evenredigheid naar de omvang van de onverminderde bedragen daarvan.

      4 Op de krachtens de voorgaande leden toe te kennen wezenpensioenen of tijdelijke wezenpensioenen wordt zoveel
      procent van de Anw-uitkering van de rechthebbende in mindering gebracht als de te hanteren mate van invaliditeit
      met dienstverband beloopt.

      5 De rechthebbende op een wezenpensioen of tijdelijk wezenpensioen heeft vanaf de eerste dag van de maand
      waarin hij de leeftijd van 15 jaar bereikt recht op een toeslag ten bedrage van 15 procent van zijn krachtens de
      voorgaande leden vastgesteld pensioen. Deze toeslag bedraagt niet meer dan 15 procent van € 32 812,76 en behoort
      voor de verdere toepassing van dit besluit tot het wezenpensioen.

      6 Het wezenpensioen en het tijdelijk wezenpensioen worden uitbetaald voor zolang en voor zover met die pensioenen
      het krachtens het pensioenreglement aan dezelfde militaire dienstverhouding te ontlenen wezenpensioen, inclusief de
      daarop verleende toeslagen, wordt overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0012222#Artikel9
