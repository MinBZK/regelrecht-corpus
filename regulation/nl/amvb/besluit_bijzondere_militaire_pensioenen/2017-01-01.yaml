  - number: '19'
    text: |-
      In afwijking van [artikel 2, eerste lid][ref1], wordt het invaliditeitspensioen dat wordt ontleend aan een periode
      van werkelijke dienst die voor 1 januari 1966 met een ontslag is beëindigd berekend naar de mate van invaliditeit
      met dienstverband die voor de betrokkene laatstelijk is vastgesteld. Op aanvraag van de belanghebbende vindt
      herkeuring plaats naar de in het [Besluit AO/IV][ref2] daaromtrent gegeven regels. De uitslag van die herkeuring
      leidt niet tot een lager invaliditeitspercentage dan het percentage waarnaar het pensioen op het moment van
      indienen van het verzoek wordt berekend. De invaliditeitspercentages worden daarbij naar boven afgerond op
      veelvouden van 10. Het invaliditeitspensioen en de bijzondere invaliditeitsverhoging worden met ingang van de dag
      waarop de aanvraag om herkeuring is ontvangen zo nodig aangepast aan de nieuwe situatie.


      [ref1]: https://wetten.overheid.nl/BWBR0012222#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012223
    url: https://wetten.overheid.nl/BWBR0012222/2017-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0012222
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012223
  - number: '20'
    text: |-
      Indien een lopend invaliditeits- of nabestaandenpensioen krachtens een vroegere regeling is omgezet naar een
      vergelijkbaar pensioen ingevolge dit besluit, en dat pensioen, verhoogd met het pensioen waarop in verband met
      dezelfde dienstverhouding ingevolge het pensioenreglement recht bestaat, een lager bruto totaalbedrag oplevert
      dan dat waarop voor die omzetting recht bestond, heeft de belanghebbende recht op een toeslag ten bedrage van
      het verschil. De betreffende toeslag behoort voor de toepassing van de [artikelen 5][ref1] en [12][ref2] tot het
      pensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0012222#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0012222#Artikel12
    url: https://wetten.overheid.nl/BWBR0012222/2017-01-01#Artikel20
    references:
