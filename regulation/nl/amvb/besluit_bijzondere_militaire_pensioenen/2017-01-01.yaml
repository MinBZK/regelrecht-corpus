  - number: '4'
    text: |-
      1 Het invaliditeitspensioen voor de ter zake van ziekten of gebreken ontslagen dienstplichtige of reservist die
      als zodanig een diensttijd van vijf of meer jaren kan aanwijzen die, waren zij als beroepsmilitair doorgebracht
      of als gewezen beroepsmilitair in verband met arbeidsongeschiktheid opgebouwd, zouden zijn vergolden met een
      ouderdomspensioen in de zin van het pensioenreglement, bedraagt niet minder dan dat ouderdomspensioen, vastgesteld
      met gebruikmaking van de berekeningsgrondslag voor dat invaliditeitspensioen en overigens naar de normen en
      voorwaarden van dat reglement.

      2 Voor de toepassing van het eerste lid wordt onder diensttijd verstaan:

      a. het totaal van de werkelijke militaire dienst en

      b. de diensttijd die voor de beroepsmilitair aan het genot van de in [artikel 10 van het besluit AO/IV][ref1]
      bedoelde arbeidsongeschiktheidsverhoging zou zijn verbonden.

      3 Bij de berekening van het in het eerste lid bedoelde garantiepensioen wordt van de daar bedoelde tijd het deel
      dat kan worden vergolden met een ander pensioen buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0012223#Artikel10
