  - number: '22'
    text: |-
      Onze Minister is bevoegd om in bijzondere gevallen, waarin de toepassing van dit besluit tot een naar zijn oordeel
      onredelijke uitkomst leidt, ten gunste van de belanghebbende een beslissing te nemen die met de strekking van dit
      besluit overeenkomt.
    url: https://wetten.overheid.nl/BWBR0012222/2017-01-01#Artikel22
  - number: '23'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0012222/2017-01-01#Artikel23
  - number: '24'
    text: 'Dit besluit wordt aangehaald als: Besluit bijzondere militaire pensioenen.'
    url: https://wetten.overheid.nl/BWBR0012222/2017-01-01#Artikel24
