  - number: '18'
    text: |-
      1 Op de op de dag voor de inwerkingtreding van dit besluit ten laste van Onze Minister komende wettelijke
      nabestaandenpensioenen die niet direct zijn afgeleid van een pensioen- of berekeningsgrondslag, van een naar
      invaliditeit met dienstverband of naar diensttijd berekend pensioen, dan wel van een pensioen, als bedoeld in
      [artikel 17, onder 10e][ref1], blijven voor de verdere looptijd daarvan de bepalingen van toepassing die dat
      pensioen op die datum beheersten.

      2 Een bijzonder partnerpensioen dat op grond van artikel 22, vierde lid, van het Besluit bijzondere voorzieningen
      militair nabestaandenpensioen ten laste van Onze Minister komt, wordt, zodra dat artikel is ingetrokken, voor de
      toepassing van dit besluit gelijkgesteld met een bijzonder partnerpensioen in de zin van het pensioenreglement.
      Het betreffende pensioen wordt voor de verdere looptijd daarvan geacht te zijn toegekend op grond van dit besluit.
      De inhoud van artikel H 3 van de Algemene militaire pensioenwet, zoals dat op 31 december 1995 luidde, blijft op
      dat bijzondere nabestaandenpensioen van toepassing. De in [artikel 9, tweede lid][ref2], bedoelde korting wordt
      vervangen door de krachtens dat vierde lid vast te stellen korting.

      3 Een weduwenpensioen, toegekend krachtens een vroegere militaire pensioenwet, zoals genoemd in artikel A 1,
      onder j, van de Algemene militaire pensioenwet, zoals die wet voor intrekking luidde, waarvan het recht op
      uitbetaling is vervallen in verband met een volgend huwelijk en dat bij toepassing van de voormalige artikelen
      Y 14a van de Algemene militaire pensioenwet of 22, zesde lid van het Besluit bijzondere voorzieningen militair
      nabestaandenpensioen ten laste van Onze Minister zou zijn gekomen en bij de vaststelling waarvan invaliditeit met
      dienstverband een rol speelt, kan op aanvraag van de weduwe opnieuw worden toegekend naar de bepalingen van dit
      besluit. [Artikel 8, vierde lid][ref3], is op dat pensioen van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012222#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0012222#Artikel9
