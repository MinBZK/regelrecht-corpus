articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. Besluit AO/IV: het [Besluit aanvullende arbeidsongeschiktheids- en invaliditeitsvoorzieningen militairen][ref1];

      b. militair, berekeningsgrondslag: hetgeen in het [Besluit AO/IV][ref2] onder die begrippen wordt verstaan;

      c. pensioenreglement: het pensioenreglement van de Stichting Pensioenfonds ABP;

      d. nabestaande, partner, wees: hetgeen in het pensioenreglement onder die begrippen wordt verstaan;

      e. invaliditeit met dienstverband: invaliditeit als bedoeld in [artikel 2, derde lid, van het Besluit AO/IV][ref3];

      f. AOW: de [Algemene Ouderdomswet][ref4];

      g. Anw: de [Algemene nabestaandenwet][ref5];

      h. AOW-pensioen: het tot een jaarbedrag herleid en met de vakantie-uitkering verhoogd pensioen ingevolge
      de [AOW][ref6] dat de rechthebbende naast zijn pensioen ingevolge dit besluit geniet, in relatie tot het
      invaliditeitspensioen inclusief het AOW-pensioen van zijn partner en in relatie tot het partnerpensioen tot ten
      hoogste het AOW-pensioen voor een ongehuwde;

      i. Anw-uitkering: de tot een jaarbedrag herleide en met de vakantie-uitkering verhoogde uitkering ingevolge de
      [Anw][ref7] die een rechthebbende naast zijn pensioen ingevolge dit besluit geniet.


