  - number: '9'
    text: |-
      1 Het partnerpensioen en het tijdelijk partnerpensioen bedragen vijf zevende gedeelten van het
      invaliditeitspensioen, zoals dat ingevolge de[artikelen 6][ref1], [7][ref2] en [8][ref3] kan worden vastgesteld.

      2 Op het partnerpensioen en het tijdelijk partnerpensioen wordt zoveel procent van de Anw-uitkering of het AOW-
      pensioen van de rechthebbende in mindering gebracht als de te hanteren mate van invalidteit met dienstverband
      beloopt.

      3 Het partnerpensioen en de korting, bedoeld in het eerste en tweede lid, worden bij een volgend huwelijk van
      de rechthebbende of een volgende aanmerking als partner in de zin van het pensioenreglement, te rekenen van de
      eerste dag van de maand, volgend op die waarin dat huwelijk of die aanmerking heeft plaatsgevonden, blijvend nader
      vastgesteld. Die nadere vaststelling vindt plaats door vermenigvuldiging van het pensioenbedrag met een breuk
      waarvan de teller, tot een minimum van 20, bestaat uit de voor pensioen geldige diensttijd die de militair op
      grond van de betrekking waarin zijn invaliditeit met dienstverband is ontstaan op het moment van zijn overlijden
      krachtens het pensioenreglement kon aanwijzen, en de noemer gelijk is aan 40. Het tijdelijk partnerpensioen vervalt
      op de bedoelde dag.

      4 Tenzij zijn pensioen met toepassing van het vorige lid nader is vastgesteld, heeft de rechthebbende op een
      partnerpensioen of een tijdelijk partnerpensioen tot de dag waarop hij de leeftijd van 65 jaar bereikt recht op een
      toeslag ten bedrage van 15 procent van het ingevolge het eerste, tweede en derde lid gevonden pensioenbedrag. Deze
      toeslag bedraagt niet meer dan 15 procent van € 32 812,76 en behoort voor de verdere toepassing van dit besluit tot
      het partnerpensioen of het tijdelijk partnerpensioen.

      5 Het partnerpensioen en het tijdelijk partnerpensioen worden uitbetaald voor zolang en voor zover met die
      pensioenen de som van de krachtens het pensioenreglement aan dezelfde militaire dienstverhouding te ontlenen
      partner- en bijzondere partnerpensioenen, inclusief de daarop verleende toeslagen, wordt overschreden.


