      - id: ref1
        bwb_id: BWBR0012222
        artikel: '8'
        paragraaf: '3'
  - number: '17'
    text: |-
      In afwijking van dit besluit wordt:

      1e invaliditeit met dienstverband vastgesteld naar de inhoud van artikel E 11 van de Algemene militaire
      pensioenwet, zoals die voor 1 januari 1998 gold, indien de verwonding, ziekten of gebreken waaraan een recht op
      invaliditeitspensioen of een recht op nabestaandenpensioen kan worden ontleend voor 1 januari 1998 zijn ontstaan;

      2e Indien het recht op invaliditeitspensioen wordt ontleend aan een met een voor 1 januari 1986 liggend ontslag
      afgesloten periode van militaire dienst, de in artikel III, onderdeel B, van de Wet invoering franchisesysteem
      militaire pensioenen bedoelde rechten daaronder begrepen, de in [artikel 2, tweede lid][ref1], bedoelde korting
      vastgesteld op zoveel maal 0,8 procent als de mate van invaliditeit met dienstverband beloopt, of, indien
      tevens recht bestaat op een aan dezelfde militaire dienstverhouding te ontlenen ouderdomspensioen ingevolge het
      pensioenreglement en dat in totaliteit tot een hoger percentage leidt, voor elk vol jaar van de voor de berekening
      van dat ouderdomspensioen in aanmerking te nemen diensttijd 2 procent en voor elke resterende maand daarvan 1/6
      procent;

      3e op aanvraag van de rechthebbende bij de vaststelling van de onder 2e bedoelde korting dat deel van het AOW-
      pensioen buiten beschouwing gelaten waarop recht is verkregen door vrijwillige premiebetaling in de zin van die
      wet;

      4e op aanvraag van de rechthebbende bij de vaststelling van de onder 2e bedoelde korting eveneens dat deel van het
      AOW-pensioen buiten beschouwing gelaten dat in mindering wordt gebracht of geacht kan worden in mindering te worden
      gebracht op een ander pensioen, niet zijnde het onder 2e bedoelde ouderdomspensioen;

      5e indien het recht op een bijzondere invaliditeitsverhoging wordt ontleend aan een met een voor 1 januari 1998
      liggend ontslag afgesloten periode van militaire dienst, dat recht uitsluitend getoets aan de inhoud van de
      artikelen E 8, E 9, F 8 en F 9 van de Algemene militaire pensioenwet of de daarmee vergelijkbare artikelen in
      een vroegere militaire pensioenwet, bedoeld in [artikel A 1, onder j, van die wet](onbekend), zoals die artikelen
      laatstelijk voor intrekking hebben geluid;

      6e indien het recht op partner- of wezenpensioen wordt ontleend aan invaliditeit die is ontstaan in een voor 1
      januari 1986 met ontslag beëindigd dienstverband, of aan een overlijden in actieve dienst voor die datum, de in
      [artikel 9, tweede lid][ref2], en [10, vierde lid][ref3], omschreven kortingen vastgesteld zoals hiervoor onder 2e,
      3e en 4e bedoeld, met dien verstande dat daar waar het recht op pensioen wordt ontleend aan een overlijden tussen
      31 december 1965 en 1 januari 1996 het aan invaliditeit met dienstverband te relateren kortingspercentage, voor de
      onder 2e bedoelde afweging, tot een maximum van 80 wordt vastgesteld op tien zevende gedeelten daarvan;

      7e het recht op tijdelijk nabestaandenpensioen uitsluitend verleend indien de militair na 31 december 1997 is
      overleden;

      8e de toepassing van de [artikelen 4][ref4] en [11][ref5] uitsluitend gereserveerd voor situaties waarin de
      invaliditeit met dienstverband waaraan het recht op pensioen kan worden ontleend na 31 december 1997 is ontstaan,
      tenzij op die datum recht bestond op een pensioen als bedoeld in artikel E 3, eerste lid, onder c, van de Algemene
      militaire pensioenwet, zoals dat artikel op dat moment luidde, dan wel een naar diensttijd berekend pensioen ter
      zake van ziekten of gebreken krachtens een vroegere militaire pensioenwet in de zin van [artikel A 1, onder j, van
      die wet](onbekend);

      9e indien de [artikelen 4][ref6] en [11][ref7] worden toegepast op grond van de onder 8e bedoelde uitzondering,
      gerekend met de diensttijd die voor de vaststelling van het daar bedoelde recht in aanmerking werd genomen;

      10e indien de belanghebbende op de dag waarop hij de leeftijd van 65 jaar bereikt uitsluitend recht heeft
      op het pensioen, bedoeld in [artikel 19, onder 5e, van het Besluit AO/IV][ref8], dat pensioen tot hetzelfde
      bedrag toegekend, waarbij het voor de korting, bedoeld in [artikel 2, tweede lid][ref9], alsmede de toepassing
      van het onder 2e, 3e en 4e gestelde, geacht wordt te zijn berekend naar 4 voor 1 januari 1986 liggende
      dienstjaren en het in verband met de toepassing van [artikel 12][ref10] geacht wordt te zijn berekend naar de in
      [artikel 2, vierde lid][ref11], bedoelde minimumpensioengrondslag;

      11e bij overlijden van een onder 10e bedoelde pensioengerechtigde zijn pensioen beschouwd als het
      invaliditeitspensioen, bedoeld in [artikel 9, eerste lid][ref12], en [artikel 10, eerste lid][ref13], waarbij voor
      de vaststelling van de korting, bedoeld in [artikel 9, tweede lid][ref14], en [artikel 10, vierde lid][ref15],
      wordt gehandeld overeenkomstig het onder 2e, 3e en 4e gestelde.


