        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012222
        artikel: '12'
        paragraaf: '4'
  - number: '21'
    text: |-
      In aanvulling op de bij of krachtens de [Wet maatschappelijke ondersteuning 2015][ref1] en de
      [Wet langdurige zorg][ref2] gestelde regels, kan Onze Minister ten behoeve van de krachtens
      dit besluit gepensioneerde militair, die lijdt aan een ziekte of gebrek waarvoor in de zin van
      [artikel 2, derde lid, van het Besluit AO/IV][ref3], verband met de uitoefening van de militaire dienst is
      aangenomen, nadere en zonodig afwijkende regels stellen op grond waarvan genoemde gepensioneerde militairen
      in aanmerking kunnen worden gebracht voor, naar het oordeel van Onze Minister, noodzakelijke voorzieningen ter
      verbetering van de levensomstandigheden en geneeskundige verstrekkingen. De door Onze Minister krachtens dit
      artikel te stellen regels mogen niet afwijken ten nadele van de belanghebbenden.


      [ref1]: https://wetten.overheid.nl/BWBR0035362
      [ref2]: https://wetten.overheid.nl/BWBR0035917
      [ref3]: https://wetten.overheid.nl/BWBR0012223#Artikel2
    url: https://wetten.overheid.nl/BWBR0012222/2017-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0035362
      - id: ref2
        bwb_id: BWBR0035917
      - id: ref3
        bwb_id: BWBR0012223
        artikel: '2'
  - number: 21a
    text: |-
      1 De gewezen militair die voor 1 juli 2007 is ontslagen en bij wie als gevolg van inzet tijdens
      oorlogsomstandigheden of een crisisbeheersingsoperatie op een daartoe voor 1 juni 2012 gedane eerste aanvraag,
      invaliditeit met dienstverband is vastgesteld heeft aanspraak op een eenmalige bijzondere uitkering.

      2 Het bedrag van de bijzondere uitkering is gelijk aan een percentage van de grondslag overeenkomend met de mate
      van invaliditeit met dienstverband.

      3 Een mate van invaliditeit van minder dan 10% wordt voor de toekenning van de bijzondere uitkering afgerond op 5%.

      4 Op aanvraag van de rechthebbende wordt in afwijking van het tweede en derde lid het bedrag van de bijzondere
      uitkering vastgesteld op een percentage van de grondslag overeenkomend met de mate van arbeidsongeschiktheid met
      dienstverband zoals dat voor de rechthebbende voordat hij 65 jaar werd laatstelijk heeft gegolden, indien deze mate
      van arbeidsongeschiktheid hoger is dan de mate van invaliditeit met dienstverband.

      5 Voor de vaststelling van de bijzondere uitkering wordt de definitieve mate van invaliditeit of
      arbeidsongeschiktheid met dienstverband gehanteerd die op de peildatum, 1 juni 2012, na het bereiken van een
      medische eindtoestand is vastgesteld.

      6 De bijzondere uitkering wordt eenmalig vastgesteld. In afwijking van [artikel 19][ref1] leidt een latere
      wijziging in de mate van invaliditeit niet tot aanpassing van een toegekende bijzondere uitkering.

      7 In voorkomend geval wordt de mate van arbeidsongeschiktheid met dienstverband bepaald
      op het hoogste percentage van de toepasselijke arbeidsongeschiktheidsklasse als bedoeld in
      [artikel 21 tweede lid van de Wet op de arbeidsongeschiktheidsverzekering][ref2].

      8 De grondslag van de bijzondere uitkering is € 125.000,–.

      9 In afwijking van [artikel 15][ref3] wordt de bijzondere uitkering in een keer uitbetaald.

      10 In het geval dat de gewezen militair een schadevergoeding heeft ontvangen voor zijn invaliditeit met
      dienstverband als bedoeld in het eerste lid bedraagt de bijzondere uitkering slechts het meerdere boven het totaal
      van de reeds ontvangen materiële schadevergoeding.

      11 De over de bijzondere uitkering verschuldigde belasting ingevolge de [Wet inkomstenbelasting 2001][ref4],
      de [Wet op de loonbelasting 1964][ref5] en premie voor de volksverzekeringen ingevolge de
      [Wet financiering sociale verzekeringen][ref6] komen ten laste van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0012222#Artikel19
