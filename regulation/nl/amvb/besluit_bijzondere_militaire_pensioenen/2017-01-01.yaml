  - number: '12'
    text: |-
      1 De berekeningsgrondslagen worden overeenkomstig hoofdstuk 12 van het pensioenreglement aangepast aan de algemene
      bezoldigingswijzigingen van het overheidspersoneel. De invaliditeitspensioenen, bijzondere invaliditeitsverhogingen
      en de van de invaliditeitspensioenen af te leiden nabestaandenpensioenen worden aan de hand van die aangepaste
      berekeningsgrondslagen nader vastgesteld.

      2 Het eerste lid is van overeenkomstige toepassing op de bedragen, bedoeld in [artikel 2, vierde lid][ref1],
      [artikel 9, vierde lid][ref2], en [artikel 10, vijfde lid][ref3].

      3 Indien de bedragen aan AOW-pensioen of Anw-uitkering worden gewijzigd als gevolg van een wijziging van het netto-
      minimumloon, zoals voorzien in [artikel 9 van de AOW][ref4] en de artikelen [17][ref5], [25][ref6], [29][ref7] en
      [31 van de Anw][ref8], worden de kortingen die van dat pensioen of die uitkering afhankelijk zijn aan de gewijzigde
      bedragen aangepast.


