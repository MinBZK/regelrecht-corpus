  - number: '7'
    text: |-
      1 De nabestaanden van de militair die is overleden tengevolge van verwonding, ziekten of gebreken als bedoeld
      in [artikel 2, eerste lid, van het Besluit AO/IV][ref1], de nabestaanden van een rechthebbende op verhoogd
      arbeidsongeschiktheidspensioen ingevolge [artikel 3, vijfde lid, van dat besluit][ref2] of van een militair of
      gewezen militair die, ware hij niet overleden, recht op een zodanig pensioen zou hebben kunnen doen gelden, hebben,
      indien diens overlijden in overwegende mate zijn oorzaak vindt in de aard van de hem opgedragen werkzaamheden
      of in de bijzondere omstandigheden waaronder deze moesten worden verricht, te rekenen van de dag volgende op dat
      overlijden recht op tijdelijk partner- of wezenpensioen.

      2 De in het eerste lid bedoelde tijdelijke pensioenen worden afgeleid van een invaliditeitspensioen zoals
      dat, zonder toepassing van de in [het tweede en derde lid van artikel 2][ref3] bedoelde kortingen en zonder de
      bijzondere invaliditeitsverhoging, bedoeld in [artikel 3][ref4], naar een mate van invaliditeit met dienstverband
      van 90,02 procent ingevolge dit besluit kan worden vastgesteld.

      3 Het recht op pensioen ingevolge dit artikel vervalt:

      a. indien de belanghebbende uit hoofde van dezelfde dienstverhouding ingevolge [artikel 6][ref5] recht heeft op een
      hoger pensioen en

      b. met ingang van de dag waarop de militair aan wiens overlijden het wordt ontleend de leeftijd van 65 jaar zou
      hebben bereikt.


