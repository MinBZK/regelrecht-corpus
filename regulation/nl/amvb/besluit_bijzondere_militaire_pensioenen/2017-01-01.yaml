  - number: '2'
    text: |-
      1 De militair bij wie een bepaalde mate van invaliditeit met dienstverband is vastgesteld heeft uit hoofde van de
      dienstverhouding waarin die invaliditeit is ontstaan vanaf de dag waarop hij de leeftijd van 65 jaar bereikt recht
      op een invaliditeitspensioen.

      2 Het bedrag van het in het eerste lid bedoelde invaliditeitspensioen is gelijk aan zoveel procent van de bij de
      betreffende dienstverhouding behorende berekeningsgrondslag als de mate van invaliditeit met dienstverband op het
      in dat lid bedoelde moment bedraagt, verminderd met hetzelfde percentage van het AOW-pensioen van de rechthebbende.

      3 Het in het eerste en tweede lid bedoelde invaliditeitspensioen wordt uitbetaald voor zolang en voor zover
      het bedrag daarvan de som van het krachtens het pensioenreglement bij dezelfde dienstverhouding behorende
      ouderdomspensioen, de daar eventueel van af te leiden bijzondere ouderdomspensioenen en de op die pensioenen te
      verlenen toeslagen overschrijdt.

      4 De berekeningsgrondslag voor het invaliditeitspensioen bedraagt niet minder dan € 17 034,25.
    url: https://wetten.overheid.nl/BWBR0012222/2017-01-01#Artikel2
  - number: '3'
    text: |-
      1 De militair met een recht op invaliditeitspensioen wiens ontslag heeft plaatsgevonden vóór 1 juli 2007 heeft
      recht op een bijzondere invaliditeitsverhoging van:

      a. 40 procent van de in [artikel 2][ref1] bedoelde berekeningsgrondslag indien de mate van invaliditeit waaraan dat
      recht op pensioen wordt ontleend 100 procent bedraagt,

      b. 30 procent van die berekeningsgrondslag indien die mate van invaliditeit ten minste 80 maar minder dan 100
      procent bedraagt,

      c. 20 procent van die berekeningsgrondslag indien die mate van invaliditeit ten minste 60 maar minder dan 80
      procent bedraagt,

      d. 10 procent van die berekeningsgrondslag indien die mate van invaliditeit ten minste 40 maar minder dan 60
      procent bedraagt,

      e. 5 procent van die berekeningsgrondslag indien die mate van invaliditeit ten minste 20 maar minder dan 40 procent
      bedraagt;

      De militair met een recht op een invaliditeitspensioen wiens ontslag heeft plaatsgevonden op of na 1 juli 2007
      heeft recht op een bijzondere invaliditeitsverhoging van:

      a. 40 procent van de in [artikel 2][ref2] bedoelde berekeningsgrondslag indien de mate van invaliditeit met
      dienstverband waaraan dat recht op pensioen wordt ontleend 100 procent bedraagt,

      b. 35 procent van die berekeningsgrondslag indien de mate van invaliditeit ten minste 90 maar minder dan 100
      procent bedraagt,

      c. 30 procent van die berekeningsgrondslag indien de mate van invaliditeit ten minste 80 maar minder dan 90 procent
      bedraagt,

      d. 25 procent van die berekeningsgrondslag indien de mate van invaliditeit ten minste 70 maar minder dan 80 procent
      bedraagt,

      e. 20 procent van die berekeningsgrondslag indien de mate van invaliditeit ten minste 60 maar minder dan 70 procent
      bedraagt,

      f. 15 procent van die berekeningsgrondslag indien de mate van invaliditeit ten minste 50 maar minder dan 60 procent
      bedraagt,

      g. 10 procent van die berekeningsgrondslag indien de mate van invaliditeit ten minste 40 maar minder dan 50 procent
      bedraagt,

      h. 7,5 procent van die berekeningsgrondslag indien de mate van invaliditeit ten minste 30 maar minder dan 40
      procent bedraagt,

      i. 5 procent van die berekeningsgrondslag indien de mate van invaliditeit ten minste 20 maar minder dan 30 procent
      bedraagt,

      j. 2,5 procent van die berekeningsgrondslag indien de mate van invaliditeit ten minste 10 maar minder dan 20
      procent bedraagt.

      2 Indien de invaliditeit met dienstverband waaraan het recht op invaliditeitspensioen wordt ontleend bestaat of
      mede bestaat uit:

      a. het verlies van een van de ledematen,

      b. een belangrijke misvorming van het gelaat, welke door hulpmiddelen niet voldoende is te verbergen, zodat de
      rechthebbende de omgang met zijn medemensen ernstig wordt bemoeilijkt,

      c. onbruikbaarheid van een van de ledematen dan wel uit een toestand, welke met een zodanige onbruikbaarheid is
      gelijk te stellen,

      d. een zodanige vermindering van de beweeglijkheid of bruikbaarheid van twee of meer ledematen, dat de toestand van
      de rechthebbende is gelijk te stellen met die, bedoeld onder c, of

      e. een zodanige beperking van het gezichtsvermogen, dat het vermogen om zich zelfstandig te bewegen er ernstig door
      wordt getroffen,

      bedraagt de in het eerste lid bedoelde bijzondere invaliditeitsverhoging niet minder dan 30 procent van de daar
      bedoelde berekeningsgrondslag.

      3 Indien de invaliditeit met dienstverband waaraan het recht op invaliditeitspensioen wordt ontleend bestaat of
      mede bestaat uit:

      a. het verlies van twee of meer ledematen,

      b. het totale verlies van het gezichtsvermogen in beide ogen dan wel uit een toestand, welke met blindheid is
      gelijk te stellen, of

      c. onbruikbaarheid van twee of meer ledematen dan wel uit een toestand, welke met een zodanige onbruikbaarheid is
      gelijk te stellen,

      bedraagt de in het eerste lid bedoelde bijzondere invaliditeitsverhoging niet minder dan 40 procent van de daar
      bedoelde berekeningsgrondslag.

      4 Voor de toepassing van het tweede en derde lid worden handen en voeten onder ledematen begrepen.

      5 Indien de invaliditeit met dienstverband bestaat uit meerdere van de in het tweede en derde lid omschreven
      omstandigheden, bedraagt de in het eerste lid bedoelde bijzondere invaliditeitsverhoging 40 procent van de daar
      bedoelde berekeningsgrondslag.


