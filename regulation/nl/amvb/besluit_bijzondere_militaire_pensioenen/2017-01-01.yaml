  - number: '8'
    text: |-
      1 De vraag of er verband bestaat tussen het overlijden en de verwonding, ziekten of gebreken als bedoeld in
      [artikel 2, derde lid, van het Besluit AO/IV][ref1] en de vraag of het overlijden in overwegende mate zijn oorzaak
      vindt in de ziekten of gebreken, bedoeld in [artikel 2, eerste lid, van dat besluit][ref2], worden beantwoord met
      inachtneming van de resultaten van een geneeskundig onderzoek naar het ontstaan, tot uiting komen of verergeren,
      de aard en de gevolgen van die verwonding, ziekten of gebreken. Onze Minister regelt de voor dat onderzoek geldende
      procedure.

      2 Indien ter zake van hetzelfde overlijden voor dezelfde nabestaande recht bestaat op meerdere militaire
      pensioenen, kunnen de in het eerste lid bedoelde vragen uitsluitend positief worden beantwoord voor dat pensioen
      dat is gekoppeld aan de periode van werkelijke dienst waarin de daar bedoelde verwonding, ziekten of gebreken zijn
      ontstaan.

      3 Indien er op het moment van overlijden een invaliditeit met dienstverband bestond van ten minste 60 procent,
      wordt die invaliditeit, tenzij het tegendeel kan worden aangetoond, beschouwd als oorzaak van het overlijden.

      4 Een nog bij leven van de militair aangevangen onderzoek naar de mate van zijn invaliditeit met dienstverband
      leidt niet tot een lager percentage dan het laatstelijk voor hem vastgestelde.

      5 Indien er naar het oordeel van de nabestaanden op het moment van overlijden sprake was van een op een te laag
      niveau vastgestelde mate van invaliditeit met dienstverband, richt het in het eerste lid bedoelde onderzoek zich
      mede op de aannemelijkheid van die stellingname. Het vierde lid is op de uitkomst van dat deel van het onderzoek
      van overeenkomstige toepassing.

      6 De nabestaanden van de militair, bij wie op het moment van overlijden geen invaliditeit met dienstverband was
      vastgesteld, kunnen, tenzij een eerder verzoek van de desbetreffende militair om tot een dergelijke vaststelling te
      komen is afgewezen, alsnog om de vaststelling daarvan verzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0012223#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012223#Artikel2
