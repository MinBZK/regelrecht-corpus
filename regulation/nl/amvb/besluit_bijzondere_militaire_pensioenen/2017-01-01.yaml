  - number: '13'
    text: |-
      1 De pensioenen, tijdelijke pensioenen, verhogingen en toeslagen worden toegekend op aanvraag van de belanghebbende
      en worden op een jaarbedrag vastgesteld.

      2 De pensioenen, tijdelijke pensioenen, verhogingen en toeslagen gaan in op de dag waarop het recht daarop
      ontstaat.

      3 In afwijking van het tweede lid gaat een pensioen, een verhoging of een toeslag waarvoor de aanvraag niet tijdig
      bij Onze Minister is binnengekomen niet eerder in dan een jaar voor de dag van binnenkomst van die aanvraag.

      4 In afwijking van het tweede lid bepaalt Onze Minister de ingangsdatum van een nabestaandenpensioen bij
      vermissing.

      5 Bij de toepassing van dit artikel wordt uitgegaan van bedragen die overeenkomstig [artikel 12][ref1] en de
      daaraan voorafgaande vergelijkbare regels zijn gebracht op het niveau van het moment van toekenning.


      [ref1]: https://wetten.overheid.nl/BWBR0012222#Artikel12
    url: https://wetten.overheid.nl/BWBR0012222/2017-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012222
        artikel: '12'
        paragraaf: '4'
  - number: '14'
    text: |-
      1 De pensioenen en pensioenverhogingen eindigen met het einde van de maand waarin de rechthebbende is overleden.

      2 In afwijking van het eerste lid eindigen het invaliditeitspensioen en de bijzondere invaliditeitsverhoging bij
      vermissing op een door Onze Minister te bepalen dag.

      3 Indien degene aan wiens vermissing het wordt ontleend in leven blijkt te zijn, eindigt het op grond daarvan
      toegekende nabestaandenpensioen met ingang van een door Onze Minister te bepalen dag. Op grond van het tweede lid
      vervallen pensioenen of verhogingen worden met ingang van die dag opnieuw toegekend.

      4 Het wezenpensioen eindigt voorts met het einde van de maand waarin:

      a. de rechthebbende de leeftijd van 21 jaren heeft bereikt of, voorafgaand aan het bereiken van die leeftijd
      in het huwelijk is getreden dan wel partij is geworden bij de aanmerking van een partner dan wel als partner is
      geregistreerd in de zin van het pensioenreglement;

      b. de rechthebbende wettig kind is geworden van een ander dan de partner die aan hetzelfde overlijden recht
      op partnerpensioen in de zin van dit besluit of bijzonder partnerpensioen in de zin van het pensioenreglement
      ontleent.

      5 Het recht op een toeslag vervalt vanaf het moment dat niet meer aan de voorwaarden voor de toekenning daarvan
      wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0012222/2017-01-01#Artikel14
  - number: '15'
    text: De betaling van de pensioenen, tijdelijke pensioenen, verhogingen en toeslagen geschiedt in maandelijkse termijnen.
    url: https://wetten.overheid.nl/BWBR0012222/2017-01-01#Artikel15
  - number: '16'
    text: |-
      1 Dit besluit is niet van toepassing op de gewezen militair en diens nabestaanden voor zolang recht op een
      vergelijkbaar pensioen kan worden ontleend aan de Algemene militaire pensioenwet of een vroegere militaire
      pensioenwet, genoemd in artikel A 1, onder j, van die wet, het Nabestaandenreglement militairen of het Besluit
      bijzondere voorzieningen militair nabestaandenpensioen.

      2 Vanaf de dag waarop het in het eerste lid bedoelde recht in verband met de intrekking van de desbetreffende
      bepalingen vervalt, wordt aan de gewezen militair of diens nabestaanden een pensioen krachtens dit besluit
      toegekend. Daarbij wordt:

      1e gebruik gemaakt van de mate van invaliditeit met dienstverband zoals die laatstelijk onder de werking van de in
      het eerste lid bedoelde wetten en regelingen is of had kunnen worden vastgesteld;

      2e als berekeningsgrondslag aangemerkt de pensioen- of berekeningsgrondslag die onder de werking van de in het
      eerste lid bedoelde wetten en regelingen laatstelijk is of zou zijn gehanteerd voor de vaststelling van een
      invaliditeitsverhoging of invaliditeitspensioen, dan wel partner- of wezenpensioen;

      3e [artikel 8][ref1] van dit besluit toegepast met gebruikmaking van de beslissingen die krachtens vergelijkbare
      voorschriften uit de in het eerste lid bedoelde wetten en regelingen zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0012222#Artikel8
    url: https://wetten.overheid.nl/BWBR0012222/2017-01-01#Artikel16
