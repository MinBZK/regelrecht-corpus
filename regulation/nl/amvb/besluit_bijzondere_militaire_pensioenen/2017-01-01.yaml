  - number: '11'
    text: |-
      Voor de nabestaanden van de dienstplichtige of reservist bedragen de in de [artikelen 9][ref1] en [10][ref2]
      bedoelde pensioenen niet minder dat het nabestaandenpensioen dat zou kunnen worden vastgesteld indien dat met
      gebruikmaking van de geldende berekeningsbreuk rechtstreeks werd afgeleid van het in [artikel 4][ref3] bedoelde
      garantiepensioen.


