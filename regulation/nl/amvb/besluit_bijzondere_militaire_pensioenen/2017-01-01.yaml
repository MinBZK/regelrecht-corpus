  - number: '6'
    text: |-
      1 De nabestaanden van de militair die is overleden tengevolge van verwonding, ziekten of gebreken als bedoeld
      in artikel 2, derde lid, van het besluit AO/IP, de nabestaanden van een rechthebbende op invaliditeitspensioen
      krachtens dit besluit of krachtens de artikelen [7][ref1] of [11 van het besluit AO/IV][ref2] of van een militair
      of gewezen militair die, ware hij niet overleden, recht op een zodanig pensioen zou hebben kunnen doen gelden,
      hebben te rekenen van de dag volgende op diens overlijden recht op partner- of wezenpensioen.

      2 De in het eerste lid bedoelde pensioenen worden afgeleid van een invaliditeitspensioen zoals dat, zonder
      toepassing van de in [het tweede en derde lid van artikel 2][ref3] bedoelde kortingen en zonder de bijzondere
      invaliditeitsverhoging, bedoeld in [artikel 3][ref4], ingevolge dit besluit kan worden vastgesteld,

      a. naar een mate van invaliditeit met dienstverband van 100 procent indien er verband bestaat tussen het overlijden
      en de verwonding, ziekten of gebreken die tot het recht op invaliditeitspensioen hebben of zouden hebben geleid, of

      b. naar de mate van invaliditeit met dienstverband die op het overlijdensmoment bestond indien het onder a bedoelde
      verband niet aannemelijk moet worden geacht.

      3 Voor de toepassing van dit artikel wordt, voor zolang niets anders vaststaat, vermissing in de uitoefening van
      de militaire dienst of tengevolge van bijzondere omstandigheden die zich bij de uitoefening van die dienst hebben
      voorgedaan, gelijkgesteld met een overlijden als bedoeld in het tweede lid, onder a, en vermissing onder andere
      omstandigheden gelijkgesteld met een overlijden als bedoeld in het tweede lid, onder b.

      4 Het recht op pensioen ingevolge dit artikel wordt tot het in [artikel 7, derde lid, onder b][ref5], bedoelde
      moment opgeschort indien de belanghebbende uit hoofde van dezelfde dienstverhouding ingevolge dat artikel recht
      heeft op een hoger pensioen.


