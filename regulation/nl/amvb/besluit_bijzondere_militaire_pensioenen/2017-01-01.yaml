  - number: '5'
    text: |-
      1 Zo spoedig mogelijk na het overlijden van de rechthebbende op invaliditeitspensioen wordt aan de partner van wie
      hij niet duurzaam gescheiden leefde een uitkering toegekend ten bedrage van het pensioen, zoals dat na toepassing
      van [artikel 3][ref1] en met voorbijgaan aan [artikel 2, derde lid][ref2], over een tijdvak van twee maanden op
      het overlijdensmoment kan worden vastgesteld. De uitkering bij overlijden op het in [artikel 2, derde lid][ref3],
      bedoelde ouderdomspensioen en de daarop te verlenen toeslagen wordt op het gevonden bedrag in mindering gebracht.

      2 Bij ontstentenis van een partner als bedoeld in het eerste lid komt de overlijdensuitkering toe aan de wezen die
      ingevolge dit besluit aan het overlijden recht op wezenpensioen kunnen ontlenen.

      3 Bij ontstentenis van zowel een partner als bedoeld in het eerste lid, als van wezen, bedoeld in het tweede lid,
      geschiedt de overlijdensuitkering ten behoeve van de ouders, meerderjarige kinderen, broers of zusters, indien de
      overledene kostwinner was van de genoemde betrekkingen.

      4 Indien de overledene geen betrekkingen nalaat als bedoeld in de voorgaande leden, kan het bedrag van de
      overlijdensuitkering geheel of gedeeltelijk worden uitgekeerd voor de betaling van de kosten van de laatste ziekte
      en van de lijkbezorging, indien de nalatenschap van de overledene voor de betaling van die kosten ontoereikend is.

      5 Het eerste tot en met derde lid zijn van overeenkomstige toepassing in geval van vermissing van een
      gepensioneerde.


