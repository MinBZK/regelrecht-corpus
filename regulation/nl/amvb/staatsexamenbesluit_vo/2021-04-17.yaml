  - number: '2.1'
    text: 'Voor toelating tot het afleggen van het staatsexamen is verschuldigd een bedrag van:'
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel2
  - number: 2.1.a
    text: € 595 wat het examenjaar 2019 betreft,
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel2
  - number: 2.1.b
    text: € 625 wat het examenjaar 2020 betreft,
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel2
  - number: 2.1.c
    text: € 655 wat het examenjaar 2021 betreft,
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel2
  - number: 2.1.d
    text: € 685 wat het examenjaar 2022 betreft, en
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel2
  - number: 2.1.e
    text: € 720 wat het examenjaar 2023 betreft.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel2
  - number: '2.2'
    text: |-
      Voor toelating tot deelstaatsexamens voor vakken waarin zowel het college-examen als het centraal examen wordt
      afgelegd, is verschuldigd een bedrag van:
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel2
  - number: 2.2.a
    text: € 119 wat het examenjaar 2019 betreft,
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel2
  - number: 2.2.b
    text: € 125 wat het examenjaar 2020 betreft,
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel2
  - number: 2.2.c
    text: € 131 wat het examenjaar 2021 betreft,
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel2
  - number: 2.2.d
    text: € 137 wat het examenjaar 2022 betreft, en
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel2
  - number: 2.2.e
    text: € 144 wat het examenjaar 2023 betreft.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel2
  - number: 2.2a
    text: |-
      Voor toelating tot deelstaatsexamens voor vakken waarin alleen het centraal examen of alleen het college-examen
      wordt afgelegd is verschuldigd een bedrag van:
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel2
  - number: 2.2a.a
    text: € 59 wat het examenjaar 2019 betreft,
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel2
  - number: 2.2a.b
    text: € 62 wat het examenjaar 2020 betreft,
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel2
  - number: 2.2a.c
    text: € 65 wat het examenjaar 2021 betreft,
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel2
  - number: 2.2a.d
    text: € 68 wat het examenjaar 2022 betreft, en
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel2
  - number: 2.2a.e
    text: € 71 wat het examenjaar 2023 betreft.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel2
  - number: 2.2b
    text: |-
      Met ingang van het examenjaar 2024 kunnen de bedragen, genoemd in het eerste lid, onderdeel e, tweede lid,
      onderdeel e, en lid 2a, onderdeel e, bij ministeriële regeling worden gewijzigd voor zover de consumentenprijsindex
      daartoe aanleiding geeft. Bij deze ministeriële regeling wordt bovendien het bedrag vastgesteld dat per
      kalenderjaar ten hoogste is verschuldigd voor het afleggen van deelstaatsexamen.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel2
  - number: '2.3'
    text: |-
      Het verschuldigde bedrag wordt voldaan op de wijze en voor de datum, bepaald door het College voor toetsen en
      examens.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel2
  - number: '2.4'
    text: |-
      Het eerste en tweede lid en lid 2a zijn niet van toepassing op kandidaten die afkomstig zijn van een school voor
      speciaal voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel2
  - number: '2.5'
    text: |-
      Ten aanzien van kandidaten afkomstig van een school ten aanzien waarvan toepassing is gegeven aan
      [artikel 29, lid 1a, van de wet][ref1], of een instelling voor educatie en beroepsonderwijs ten aanzien waarvan
      toepassing is gegeven aan [artikel 6a.2.1 van de Wet educatie en beroepsonderwijs][ref2], is het bedrag, bedoeld in
      het eerste en tweede lid en lid 2a, verschuldigd door het bevoegd gezag van die school of instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6a
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: 6a
  - number: '2.6'
    text: |-
      Zij die aan een staatsexamen of deelstaatsexamen deelnemen, zijn verplicht zich te legitimeren op verzoek van hen
      die deze examens afnemen of daarop toezicht houden.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel2
  - number: 2a.1
    text: |-
      Tot het staatsexamen vmbo in de basisberoepsgerichte leerweg, de kaderberoepsgerichte leerweg of de gemengde
      leerweg, wordt uitsluitend toegelaten:
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel2a
  - number: 2a.1.a
    text: |-
      de kandidaat die ten tijde van de aanmelding voor het staatsexamen is ingeschreven als student als bedoeld in de
      [Wet educatie en beroepsonderwijs][ref1], eerder is afgewezen voor het eindexamen vmbo in een in de aanhef genoemde
      leerweg, en een cijferlijst overlegt waaruit blijkt dat voor elk van de vakken van het beroepsgerichte programma
      waarin eindexamen is afgelegd, het eindcijfer 6 of meer is behaald;


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: 2a.1.b
    text: |-
      de kandidaat die is ingeschreven aan een school voor voortgezet speciaal onderwijs of een school voor speciaal
      en voortgezet speciaal onderwijs als bedoeld in [artikel 1 van de Wet op de expertisecentra][ref1] en die met
      toepassing van [artikel 30 van de Wet op het voortgezet onderwijs][ref2] het eindexamen vmbo in een in de aanhef
      genoemde leerweg heeft afgelegd, indien de leerling daarvoor is afgewezen en een cijferlijst overlegt waaruit
      blijkt dat voor elk van de vakken van het beroepsgerichte programma waarin eindexamen is afgelegd, het eindcijfer 6
      of meer is behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel30
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '30'
  - number: 2a.2
    text: |-
      In afwijking van het eerste lid, worden tot het deelstaatsexamen vmbo voor een of meer algemene vakken in de
      basisberoepsgerichte leerweg, kaderberoepsgerichte of gemengde leerweg eveneens toegelaten kandidaten die zijn
      ingeschreven aan een in dat lid bedoelde school voor voortgezet speciaal onderwijs of school voor speciaal en
      voortgezet speciaal onderwijs.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel2a
  - number: '3.1'
    text: |-
      Het College voor toetsen en examens stelt de aanmeldingsprocedure vast. Onze Minister maakt de aanmeldingsprocedure
      tijdig bekend, voert die uit en bevestigt schriftelijk de aanmelding aan de kandidaat. Indien de kandidaat
      minderjarig is, wordt de aanmelding medeondertekend door diens wettelijke vertegenwoordigers.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel3
  - number: '3.2'
    text: 'De aanmelding kan strekken tot:'
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel3
  - number: 3.2.a
    text: |-
      het verkrijgen van toelating tot het afleggen van het examen ten overstaan van het College voor toetsen en examens,
      of
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel3
  - number: 3.2.b
    text: |-
      het overleggen aan het College voor toetsen en examens van de in [artikel 25, derde lid][ref1], bedoelde
      bewijsstukken ter verkrijging van het staatsexamendiploma, al dan niet in combinatie met het afleggen van het
      examen in een of meer vakken ten overstaan van het College voor toetsen en examens.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel25
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '25'
        hoofdstuk: IV
  - number: '3.3'
    text: |-
      Uit de aanmelding voor het staatsexamen blijkt tevens of sprake is van een of meer vrijstellingen of ontheffingen
      als bedoeld in de artikelen [10][ref1] en [11][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel11
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '10'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0011538
        artikel: '11'
        hoofdstuk: II
  - number: '4.1'
    text: |-
      Het staatsexamen en het deelstaatsexamen kan voor ieder vak bestaan uit een college-examen, uit een centraal examen
      of uit beide.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel4
  - number: '4.2'
    text: |-
      Het college-examen vwo, havo en vmbo, voor zover het betreft de theoretische leerweg, bedoeld in
      [artikel 10 van de wet][ref1], of de gemengde leerweg, bedoeld in [artikel 10d van de wet][ref2], omvat mede een
      profielwerkstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10d
  - number: '4.3'
    text: |-
      Het profielwerkstuk vwo en havo heeft betrekking op één of meer vakken van het staatsexamen. Ten minste één van
      deze vakken heeft een omvang van 400 uur of meer voor vwo en 320 uur voor havo.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel4
  - number: '4.4'
    text: Het profielwerkstuk vmbo heeft betrekking op een thema uit het profiel waarin de leerling onderwijs volgt.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel4
  - number: '4.5'
    text: |-
      Het centraal examen kent in elk kalenderjaar een eerste, tweede en derde tijdvak of een nader, door het College
      voor toetsen en examens, te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel4
  - number: '4.6'
    text: |-
      Voor de aanvang van het derde tijdvak zendt Onze Minister aan de inspectie een opgave met de kandidaten, de in het
      eerste of tweede tijdvak door die kandidaten behaalde cijfers, voor zover van toepassing de alsnog behaalde cijfers
      voor het college-examen, en een overzicht van het vak of de vakken waarin elke kandidaat zal worden geëxamineerd.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel4
  - number: '6.1'
    text: |-
      Indien een kandidaat zich ten aanzien van enig onderdeel van het staatsexamen of deelstaatsexamen dan wel ten
      aanzien van een aanspraak op ontheffing aan enige onregelmatigheid schuldig maakt of heeft gemaakt, kan het College
      voor toetsen en examens maatregelen nemen.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel6
  - number: '6.2'
    text: |-
      De maatregelen, bedoeld in het eerste lid, die afhankelijk van de aard van de onregelmatigheid ook in combinatie
      met elkaar genomen kunnen worden, zijn:
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel6
  - number: 6.2.a
    text: het toekennen van het cijfer 1 voor een toets van het college-examen of het centraal examen;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel6
  - number: 6.2.b
    text: |-
      het ontzeggen van de deelname of de verdere deelname aan een of meer toetsen van het college-examen of het centraal
      examen van het desbetreffende vak;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel6
  - number: 6.2.c
    text: |-
      het ongeldig verklaren van een of meer toetsen van het reeds afgelegde deel van het college-examen of het centraal
      examen;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel6
  - number: 6.2.d
    text: minder vergaande maatregelen dan die, bedoeld onder a tot en met c.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel6
  - number: '6.3'
    text: |-
      Indien de ontzegging, bedoeld in het tweede lid, onderdeel b, betrekking heeft op een kandidaat die één of meer
      vakken dan wel in meer dan één vak examen aflegt, kan de ontzegging betrekking hebben op alle toetsen.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel6
  - number: '6.4'
    text: |-
      Indien de onregelmatigheid pas wordt ontdekt na afloop van het examen, kan het College voor toetsen en examens de
      kandidaat het diploma, bedoeld in [artikel 30, derde lid][ref1], of het certificaat, bedoeld in [artikel 31][ref2],
      en de cijferlijst onthouden, of kan deze bepalen dat aan de betrokken kandidaat dat diploma of certificaat, en
      die cijferlijst, slechts kunnen worden uitgereikt na een hernieuwd examen in de door het College voor toetsen en
      examens aan te wijzen onderdelen en op de door deze te bepalen wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel31
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '30'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0011538
        artikel: '31'
        hoofdstuk: IV
  - number: '6.5'
    text: |-
      Het besluit waarbij een in het eerste lid bedoelde maatregel wordt genomen, wordt tegelijkertijd in afschrift
      toegezonden aan de inspectie en, indien de kandidaat minderjarig is, aan de wettelijke vertegenwoordigers van de
      kandidaat.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel6
  - number: '6.6'
    text: |-
      De kandidaat kan tegen een besluit waarbij een in het eerste lid bedoelde maatregel wordt genomen bezwaar maken
      bij het College voor toetsen en examens. De termijn voor het indienen van een bezwaarschrift bedraagt vijf dagen
      nadat het besluit aan de kandidaat is bekendgemaakt op de voorgeschreven wijze. Het College voor toetsen en examens
      beslist binnen twee weken na ontvangst van het bezwaarschrift, tenzij het college deze termijn heeft verlengd met
      ten hoogste twee weken. Het College voor toetsen en examens stelt bij zijn beslissing zo nodig vast op welke wijze
      de kandidaat alsnog in de gelegenheid zal worden gesteld het examen geheel of gedeeltelijk af te leggen of opnieuw
      af te leggen. Het College voor toetsen en examens deelt zijn beslissing op het bezwaar mee aan de wettelijke
      vertegenwoordigers van de kandidaat die minderjarig is en aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel6
  - number: '6.7'
    text: |-
      De kandidaat die onaangekondigd afwezig is bij het centraal examen in een vak, dan wel met aankondiging maar zonder
      een door het College voor toetsen en examens aanvaarde reden, afwezig is bij enig onderdeel van het staatsexamen of
      deelstaatsexamen, is uitgesloten van verdere deelname aan het centraal examen in dat vak alsmede van deelname aan
      het college-examen in het desbetreffende vak.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel6
  - number: '7.1'
    text: |-
      Het staatsexamen wordt afgenomen overeenkomstig het desbetreffende examenprogramma, vastgesteld op grond van
      [artikel 7 van het Eindexamenbesluit VO][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel7
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '7'
  - number: '7.2'
    text: 'Ten aanzien van het college-examen geldt dat:'
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel7
  - number: 7.2.a
    text: |-
      keuzen die ingevolge het in het eerste lid bedoelde examenprogramma moeten of kunnen worden gemaakt door de school,
      worden gemaakt door het College voor toetsen en examens, en
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel7
  - number: 7.2.b
    text: |-
      het College voor toetsen en examens kan afwijken van voorschriften met betrekking tot het schoolexamen die om
      praktische redenen in het college-examen niet uitvoerbaar zijn, met dien verstande dat het college-examen zoveel
      mogelijk gelijkwaardig blijft aan het schoolexamen.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel7
  - number: '8.1'
    text: |-
      De [artikelen 11][ref1], [12][ref2], [13][ref3], [14][ref4], [22][ref5], [23][ref6], [24][ref7], [25][ref8] en
      [26 van het Eindexamenbesluit VO][ref9] voor zover zij betrekking hebben op het eindexamen vwo van opleidingen
      vavo, het eindexamen havo van opleidingen vavo, het eindexamen vmbo theoretische leerweg van opleidingen vavo en
      het eindexamen in de algemene vakken van de overige leerwegen van het vmbo, zijn van overeenkomstige toepassing op
      respectievelijk het staatsexamen vwo, het staatsexamen havo en het staatsexamen vmbo.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0004593#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0004593#Artikel14
      [ref5]: https://wetten.overheid.nl/BWBR0004593#Artikel22
      [ref6]: https://wetten.overheid.nl/BWBR0004593#Artikel23
      [ref7]: https://wetten.overheid.nl/BWBR0004593#Artikel24
      [ref8]: https://wetten.overheid.nl/BWBR0004593#Artikel25
      [ref9]: https://wetten.overheid.nl/BWBR0004593#Artikel26
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0004593
        artikel: '13'
      - id: ref4
        bwb_id: BWBR0004593
        artikel: '14'
      - id: ref5
        bwb_id: BWBR0004593
        artikel: '22'
      - id: ref6
        bwb_id: BWBR0004593
        artikel: '23'
      - id: ref7
        bwb_id: BWBR0004593
        artikel: '24'
      - id: ref8
        bwb_id: BWBR0004593
        artikel: '25'
      - id: ref9
        bwb_id: BWBR0004593
        artikel: '26'
  - number: '8.2'
    text: |-
      In afwijking van het eerste lid kan het College voor toetsen en examens, al dan niet voor een bepaalde groep van
      kandidaten, besluiten dat geen gelegenheid wordt gegeven tot het afleggen van examen in een vak dat uitsluitend
      behoort tot het vrije deel van de profielen of tot het vrije deel van een leerweg van het vmbo. De eerste volzin is
      van overeenkomstige toepassing ten aanzien van de vakken kunst (drama) en kunst (dans).
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel8
  - number: '9'
    text: |-
      De kandidaat kiest, met inachtneming van dit hoofdstuk, in welke vakken hij het staatsexamen of deelstaatsexamen
      aflegt.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel9
  - number: '10.1'
    text: |-
      Onverminderd vrijstellingen en ontheffingen op grond van de [artikelen 11][ref1],
      [12][ref2], [13][ref3], [14][ref4], [22][ref5] en, voor zover het betreft de algemene vakken,
      [23 tot en met 26 van het Eindexamenbesluit VO][ref6], is de kandidaat die staatsexamen aflegt:


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0004593#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0004593#Artikel14
      [ref5]: https://wetten.overheid.nl/BWBR0004593#Artikel22
      [ref6]: https://wetten.overheid.nl/BWBR0004593#Artikel23
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0004593
        artikel: '13'
      - id: ref4
        bwb_id: BWBR0004593
        artikel: '14'
      - id: ref5
        bwb_id: BWBR0004593
        artikel: '22'
      - id: ref6
        bwb_id: BWBR0004593
        artikel: '23'
  - number: 10.1.a
    text: |-
      vrijgesteld van het examen in een vak in het vwo op grond van een examen vwo, indien voor het overeenkomstige vak
      een eindcijfer 6 of hoger is behaald;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel10
  - number: 10.1.b
    text: |-
      vrijgesteld van het examen in een vak in het havo op grond van een examen vwo of havo, indien voor het
      overeenkomstige vak een eindcijfer 6 of hoger is behaald;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel10
  - number: 10.1.c
    text: |-
      vrijgesteld van het examen in een vak in de theoretische of gemengde leerweg van het vmbo op grond van een examen
      vwo, havo, vmbo theoretische leerweg of vmbo gemengde leerweg, indien voor het overeenkomstige vak een eindcijfer 6
      of hoger is behaald;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel10
  - number: 10.1.d
    text: |-
      vrijgesteld van het examen in een vak in de basisberoepsgerichte of kaderberoepsgerichte leerweg van het vmbo op
      grond van een examen vwo, havo of vmbo, indien voor het overeenkomstige vak een eindcijfer 6 of hoger is behaald;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel10
  - number: 10.1.e
    text: |-
      vrijgesteld van het examen in een vak van het vwo, havo of vmbo op grond van het overeenkomstige examen, afgelegd
      in Curaçao, Sint Maarten, Aruba, Bonaire, Saba of Sint Eustatius, indien voor het overeenkomstige vak een
      eindcijfer 6 of hoger is behaald;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel10
  - number: 10.1.f
    text: |-
      vrijgesteld van het profielwerkstuk vwo of havo, indien reeds eerder een profielwerkstuk is gemaakt dat betrekking
      heeft op een of meer vakken van dezelfde schoolsoort, behorende tot het profiel van de kandidaat en waarvoor een
      eindcijfer 6 of hoger is behaald;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel10
  - number: 10.1.g
    text: |-
      vrijgesteld van het profielwerkstuk vmbo, indien reeds eerder een profielwerkstuk vmbo is gemaakt dat betrekking
      heeft op een thema uit dat profiel, en dat is beoordeeld als «voldoende» of «goed».
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel10
  - number: '10.2'
    text: |-
      Het eerste lid is uitsluitend van toepassing indien na het jaar waarin het eindcijfer of de beoordeling is
      vastgesteld, nog geen 10 jaren zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel10
  - number: '10.3'
    text: |-
      In aanvulling op het eerste lid, onder a tot en met d, is de kandidaat vrijgesteld van het onderdeel literatuur
      van elke moderne taal, indien de kandidaat bij het eerder afgelegde examen, voor literatuur een cijfer 6 of hoger
      heeft behaald.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel10
  - number: '10.4'
    text: |-
      In aanvulling op het eerste lid, onder a tot en met f, en derde lid, is de daar bedoelde kandidaat eveneens
      vrijgesteld indien het eindcijfer 5 of 4 is behaald, mits de kandidaat voldoet aan de voorwaarden van
      [artikel 26][ref1] of [artikel 26a][ref2] om te slagen voor het staatsexamen.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel26a
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '26'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0011538
        artikel: 26a
        hoofdstuk: IV
  - number: '10.5'
    text: Bij ministeriële regeling worden nadere voorschriften gegeven voor de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel10
  - number: '10.6'
    text: |-
      [Artikel 52, zevende lid, van het Eindexamenbesluit VO][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel52
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '52'
  - number: '11.1'
    text: |-
      Onverminderd [artikel 10][ref1] kan het College voor toetsen en examens op verzoek van de kandidaat die een diploma
      wil verwerven, ontheffing verlenen voor een examenvak, indien de kandidaat op grond van eerder gevolgd onderwijs
      aantoonbaar in het bezit is van voldoende kennis en vaardigheden ter zake van het desbetreffende vak. De ontheffing
      kan slechts worden verleend op basis van een diploma, getuigschrift, certificaat of ander bewijsstuk, al of niet
      behaald in Nederland, dat door het College voor toetsen en examens wordt aanvaard als bewijs van voldoende kennis
      en vaardigheden. Indien het College voor toetsen en examens dit nodig oordeelt, onderzoekt het college of de
      kandidaat in het bezit is van voldoende kennis en vaardigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel10
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '10'
        hoofdstuk: II
  - number: '11.2'
    text: |-
      Het eerste lid is uitsluitend van toepassing indien na het jaar waarin het in dat lid bedoelde diploma,
      getuigschrift, certificaat of ander bewijsstuk is vastgesteld, nog geen 10 jaren zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel11
  - number: '11.3'
    text: |-
      Tot de in het eerste lid bedoelde diploma's, getuigschriften, certificaten en andere bewijsstukken behoren in
      elk geval die betreffende het Internationaal Baccalaureaat, het Europees Baccalaureaat en die betreffende het
      overeenkomstige onderwijs in een lidstaat van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel11
  - number: '11.4'
    text: |-
      Indien het College voor toetsen en examens de gevraagde ontheffing verleent, verstrekt Onze Minister op verzoek van
      het college de verzoeker een bewijs van ontheffing, en zendt het college aan de inspectie een afschrift daarvan.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel11
  - number: '11.5'
    text: |-
      Het bewijs van ontheffing vermeldt de gronden van de ontheffing alsmede het tijdstip van het verrichten van de
      onderwijs- of examenprestatie waarop de ontheffing berust, en gaat in voorkomend geval vergezeld van een verklaring
      betreffende het in het eerste lid bedoelde onderzoek naar de kennis en vaardigheden van de examenkandidaat, of naar
      de in het eerste lid bedoelde bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel11
  - number: '11.6'
    text: Onze Minister stelt het model van het bewijs van ontheffing vast.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel11
  - number: '12'
    text: |-
      Een verzoek om ontheffing als bedoeld in [artikel 11][ref1] wordt schriftelijk ingediend bij het College voor
      toetsen en examens, onder overlegging van een uittreksel uit het geboorte- of persoonsregister en een gewaarmerkte
      fotokopie van het diploma, getuigschrift, certificaat of ander bewijsstuk waarop het verzoek om ontheffing berust.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel11
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '11'
        hoofdstuk: II
  - number: '13.1'
    text: |-
      Het examenreglement bevat in elk geval informatie over de maatregelen, bedoeld in [artikel 6][ref1], en de
      toepassing daarvan, regels met betrekking tot de organisatie van het staatsexamen en deelstaatsexamen en de gang
      van zaken tijdens het staatsexamen en deelstaatsexamen, de herkansingsmogelijkheden van het centraal examen en het
      college-examen.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel6
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '6'
        hoofdstuk: I
  - number: '13.2'
    text: |-
      Het College voor toetsen en examens stelt jaarlijks voor 1 oktober een programma van toetsing en afsluiting vast
      ten behoeve van het daaropvolgende kalenderjaar. Het programma vermeldt per vak in elk geval:
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel13
  - number: 13.2.a
    text: welke onderdelen van het examenprogramma worden getoetst,
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel13
  - number: 13.2.b
    text: de inhoud van de verschillende onderdelen,
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel13
  - number: 13.2.c
    text: |-
      de wijze en de tijdstippen waarop het centraal examen en de toetsen van het college-examen aanvangen, alsmede de
      duur van de toetsen,
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel13
  - number: 13.2.d
    text: regels omtrent verhindering voor het college-examen, alsmede
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel13
  - number: 13.2.e
    text: de regels voor de wijze waarop het cijfer voor het college-examen voor een kandidaat tot stand komt.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel13
  - number: '13.3'
    text: |-
      Het College voor toetsen en examens zendt het examenreglement en het programma van toetsing en afsluiting voor
      1 januari aan de inspectie. Deze documenten worden tegelijk met de bevestiging van de aanmelding, bedoeld in
      [artikel 3, eerste lid][ref1], door de bevestigende instantie aan de kandidaten ter beschikking gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel3
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '3'
        hoofdstuk: I
  - number: '14'
    text: |-
      Het college-examen bestaat uit een examendossier. Het examendossier is het geheel van de onderdelen van het
      college-examen zoals gedocumenteerd in een door het College voor toetsen en examens gekozen vorm.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel14
  - number: '15.1'
    text: Het college-examen wordt beoordeeld met een cijfer uit de reeks van 1 tot en met 10.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel15
  - number: '15.2'
    text: |-
      Indien in een vak tevens centraal examen wordt afgelegd, worden de in het eerste lid genoemde cijfers gebruikt met
      de daartussenliggende cijfers met 1 decimaal.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel15
  - number: '15.3'
    text: In afwijking van het eerste lid wordt het profielwerkstuk vmbo beoordeeld met «voldoende» of «goed».
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel15
  - number: '16'
    text: |-
      Indien bij het College voor toetsen en examens, al dan niet naar aanleiding van mededelingen van de kandidaat,
      twijfel is gerezen over de juistheid van de beoordeling van het college-examen in enig vak of onderdeel van een
      vak, kan het College voor toetsen en examens die beoordeling ongeldig verklaren en een nieuw examen in dat vak of
      onderdeel opleggen.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel16
  - number: '18.1'
    text: |-
      Onze Minister zorgt voor het tijdig beschikbaar stellen van de opgaven, bedoeld in
      [artikel 2, tweede lid, onderdeel c, van de Wet College voor toetsen en examens][ref1] aan het College voor toetsen
      en examens.


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
  - number: '18.2'
    text: |-
      Het College voor toetsen en examens zorgt ervoor dat de opgaven en correctievoorschriften voor het centraal examen
      geheim blijven tot de aanvang van de toets waarbij deze opgaven aan de kandidaten worden voorgelegd.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel18
  - number: '18.3'
    text: |-
      Tijdens een schriftelijke toets van het centraal examen worden aan de kandidaten geen mededelingen van welke aard
      ook aangaande de opgaven gedaan, uitgezonderd mededeling van door het College voor toetsen en examens vastgestelde
      errata.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel18
  - number: '18.4'
    text: |-
      Het College voor toetsen en examens draagt er zorg voor dat het nodige toezicht bij het centraal examen wordt
      uitgeoefend. Zij die toezicht hebben gehouden, maken daarvan een proces-verbaal op en leveren dit samen met het
      gemaakte examenwerk in bij het College voor toetsen en examens.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel18
  - number: '18.5'
    text: Een kandidaat die te laat komt, mag nog tot uiterlijk een half uur na de aanvang van een toets worden toegelaten.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel18
  - number: '18.6'
    text: |-
      De aan de kandidaten voorgelegde opgaven voor een schriftelijke toets van het centraal examen blijven in het
      examenlokaal tot het einde van die toets.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel18
  - number: '18.7'
    text: |-
      De kandidaten leveren de opgaven, de door hen gemaakte aantekeningen alsmede andere door hen gemaakte stukken in
      bij een van degenen die toezicht houden. Het College voor toetsen en examens bepaalt, in welke gevallen kan worden
      afgeweken van de eerste volzin, alsmede in welke gevallen en op welk tijdstip de opgaven, de aantekeningen en de
      andere stukken, bedoeld in die volzin, aan de kandidaten worden teruggegeven.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel18
  - number: '19.1'
    text: |-
      Het College voor toetsen en examens draagt er zorg voor dat het gemaakte werk voor het centraal examen door twee
      door het College voor toetsen en examens aan te wijzen correctoren wordt beoordeeld.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel19
  - number: '19.2'
    text: |-
      De correctoren kijken het werk onafhankelijk van elkaar na en zenden het met hun beoordeling aan het
      College voor toetsen en examens. De correctoren passen bij hun beoordeling toe de beoordelingsnormen,
      bedoeld in [artikel 2, tweede lid, onderdeel d, van de Wet College voor toetsen en examens][ref1].
      De correctoren drukken hun beoordeling uit in een score overeenkomstig de regels, bedoeld in
      [artikel 2, tweede lid, onderdeel e, van de Wet College voor toetsen en examens][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0025364
        artikel: '2'
  - number: '19.3'
    text: |-
      Indien dit het College voor toetsen en examens noodzakelijk voorkomt, wordt het oordeel van een derde corrector
      ingeroepen. Het tweede lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel19
  - number: '19.4'
    text: Het College voor toetsen en examens stelt op grond van de beoordelingen door de correctoren de eindscore vast.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel19
  - number: '20'
    text: |-
      Het College voor toetsen en examens stelt op grond van de eindscore, bedoeld in [artikel 19, vierde lid][ref1], het
      cijfer vast voor het centraal examen. Het College voor toetsen en examens neemt daarbij in acht de regels, bedoeld
      in [artikel 2, tweede lid, onderdeel e, van de Wet College voor toetsen en examens][ref2] en gebruikt daarbij één
      van de cijfers uit de schaal lopend van 1 tot en met 10, met de tussenliggende cijfers met 1 decimaal.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '19'
        hoofdstuk: III
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0025364
        artikel: '2'
  - number: '21.1'
    text: |-
      Indien het centraal examen naar het oordeel van de inspectie niet op regelmatige wijze heeft plaatsgevonden, kan
      zij besluiten dat het geheel of gedeeltelijk voor een of meer kandidaten opnieuw wordt afgenomen.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel21
  - number: '21.2'
    text: |-
      Indien het eerste lid toepassing vindt, stelt het College voor toetsen en examens op verzoek van de inspectie
      nieuwe opgaven vast en bepaalt op welke wijze en door wie het examen zal worden afgenomen.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel21
  - number: '22'
    text: |-
      Indien door onvoorziene omstandigheden het centraal examen in één of meer vakken niet op de voorgeschreven wijze
      kan worden afgenomen, beslist het College voor toetsen en examens hoe dan moet worden gehandeld.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel22
  - number: '23.1'
    text: 'Indien een kandidaat om een geldige reden, ter beoordeling van het College voor toetsen en examens:'
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel23
  - number: 23.1.a
    text: |-
      is verhinderd bij één of meer toetsen van het centraal examen in het eerste tijdvak tegenwoordig te zijn, wordt hem
      in het tweede tijdvak de gelegenheid gegeven het centraal examen op ten hoogste twee toetsen te voltooien;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel23
  - number: 23.1.b
    text: |-
      ook in het tweede tijdvak verhinderd is, of wanneer hij het centraal examen in het tweede tijdvak niet kan
      voltooien, wordt hij in de gelegenheid gesteld in het derde tijdvak het centraal examen te voltooien;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel23
  - number: 23.1.c
    text: |-
      ook in het derde tijdvak verhinderd is, of wanneer hij het centraal examen in het derde tijdvak niet kan voltooien,
      wordt hij in de gelegenheid gesteld in het vierde tijdvak het centraal examen te voltooien.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel23
  - number: '23.2'
    text: |-
      Toepassing van het eerste lid geschiedt onverminderd [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel6
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '6'
        hoofdstuk: I
  - number: '24.1'
    text: |-
      Het eindcijfer voor alle vakken van het staatsexamen en deelstaatsexamen wordt uitgedrukt in een geheel cijfer uit
      de reeks van 1 tot en met 10.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel24
  - number: '24.2'
    text: |-
      Het College voor toetsen en examens bepaalt het eindcijfer voor een vak op het rekenkundig gemiddelde van het
      cijfer voor het college-examen en het cijfer voor het centraal examen. Indien de uitkomst van deze berekening
      niet een geheel getal is, wordt dat getal indien het eerste cijfer achter de komma een 4 of lager is, naar beneden
      afgerond en indien dat cijfer een 5 of hoger is, naar boven afgerond.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel24
  - number: '24.3'
    text: |-
      Indien in een vak alleen een college-examen wordt afgenomen, is het cijfer voor het college-examen tevens het
      eindcijfer.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel24
  - number: '24.4'
    text: |-
      Indien voor een vak alleen een centraal examen wordt afgenomen, vormt het cijfer voor het centraal examen, afgerond
      overeenkomstig het tweede lid, het eindcijfer.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel24
  - number: '25.1'
    text: |-
      Het College voor toetsen en examens stelt vast of de kandidaat het examen heeft afgelegd in de voor het
      staatsexamen voorgeschreven vakken.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel25
  - number: '25.2'
    text: |-
      Het College voor toetsen en examens stelt de uitslag van het staatsexamen vast, met inachtneming van de
      [artikelen 24][ref1] en [26][ref2] dan wel [26a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0011538#Artikel26a
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '24'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0011538
        artikel: '26'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0011538
        artikel: 26a
        hoofdstuk: IV
  - number: '25.3'
    text: |-
      De uitslag van het staatsexamen wordt, onverminderd de leden 3a tot en met 3c, vastgesteld op grond van de
      eindcijfers die zijn behaald voor een volledig staatsexamen dat in dat jaar is afgelegd.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel25
  - number: 25.3a
    text: |-
      In afwijking van het derde lid kan de kandidaat het staatsexamen afleggen door voor de desbetreffende vakken
      bewijsstukken te overleggen als bedoeld in lid 3c. De kandidaat maakt zijn voornemen daartoe bekend aan het College
      voor toetsen en examens
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel25
  - number: 25.3b
    text: |-
      Indien de kandidaat deelstaatsexamen aflegt, kan de kandidaat daaraan voorafgaand aan het College kenbaar maken,
      het volledig staatsexamen te willen afleggen door voor de ontbrekende vakken, in aanvulling op de cijferlijst voor
      het deelstaatsexamen, aan het College bewijsstukken te overleggen als bedoeld in lid 3c.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel25
  - number: 25.3c
    text: 'De bewijsstukken zijn:'
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel25
  - number: 25.3c.a
    text: eindcijfers van deelstaatsexamens die in dat jaar zijn afgelegd;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel25
  - number: 25.3c.b
    text: |-
      cijferlijsten als bedoeld in [artikel 30][ref1] en [artikel 31, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel31
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '30'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0011538
        artikel: '31'
        hoofdstuk: IV
  - number: 25.3c.c
    text: cijferlijsten van een school voor voortgezet onderwijs;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel25
  - number: 25.3c.d
    text: resultatenlijsten of cijferlijsten van instellingen voor educatie en beroepsonderwijs;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel25
  - number: 25.3c.e
    text: |-
      bewijzen van ontheffing als bedoeld in [artikel 11, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel11
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '11'
        hoofdstuk: II
  - number: 25.3c.f
    text: |-
      bewijzen van ontheffing als bedoeld in [artikel 10, vierde lid, van het Eindexamenbesluit VO][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel10
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '10'
  - number: '25.4'
    text: |-
      Cijferlijsten worden uitsluitend bij de vaststelling van de uitslag betrokken, indien na het jaar waarin zij zijn
      vastgesteld, nog geen 10 jaren zijn verstreken. Bewijzen van ontheffing worden uitsluitend bij de vaststelling
      van de uitslag betrokken indien na het jaar waarin het onderliggende diploma, getuigschrift of ander bewijsstuk is
      vastgesteld, nog geen 10 jaren zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel25
  - number: '25.5'
    text: De uitslag luidt «geslaagd» of «afgewezen».
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel25
  - number: '25.6'
    text: |-
      Indien dat nodig is om de kandidaat te laten slagen voor het staatsexamen, betrekt het College voor toetsen en
      examens een of meer eindcijfers van de vakken niet bij de bepaling van de definitieve uitslag. De overgebleven
      vakken dienen een staatsexamen te vormen.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel25
  - number: '26.1'
    text: 'De kandidaat die het staatsexamen van een leerweg in het vmbo heeft afgelegd, is geslaagd indien:'
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel26
  - number: 26.1.a
    text: het rekenkundig gemiddelde van zijn bij het centraal examen behaalde cijfers ten minste 5,5 is;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel26
  - number: 26.1.b
    text: hij voor het vak Nederlandse taal als eindcijfer 5 of meer heeft behaald;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel26
  - number: 26.1.c
    text: 'hij onverminderd onderdeel b:'
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel26
  - number: 26.1.c.1°
    text: |-
      voor één van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 of meer en voor de overige vakken
      waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer heeft behaald;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel26
  - number: 26.1.c.2°
    text: |-
      voor één van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 4 en voor de overige vakken
      waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer waarvan ten minste één 7 of meer heeft behaald; of
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel26
  - number: 26.1.c.3°
    text: |-
      voor twee van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 heeft behaald en voor de overige
      vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer waarvan ten minste één 7 of meer heeft
      behaald; en
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel26
  - number: 26.1.d
    text: hij voor geen van de onderdelen, genoemd in het derde of vierde lid, lager dan het eindcijfer 4 heeft behaald;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel26
  - number: 26.1.e
    text: |-
      als het een staatsexamen gemengde of theoretische leerweg betreft: hij voor het profielwerkstuk de kwalificatie
      «voldoende» of «goed» heeft behaald.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel26
  - number: '26.2'
    text: |-
      Bij de uitslagbepaling volgens het eerste lid, onderdeel c, wordt in de theoretische leerweg het eindcijfer van
      een profielvak of beroepsgericht keuzevak behorende tot het eindexamen van de gemengde leerweg als bedoeld in
      [artikel 25 van het Eindexamenbesluit VO][ref1] niet betrokken, tenzij deze vakken samen tenminste een volledig
      beroepsgericht programma als bedoeld in artikel 25, eerste lid, onderdeel d, van dat besluit vormen. In dat geval
      is het vierde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel25
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '25'
  - number: '26.3'
    text: |-
      Bij de uitslagbepaling volgens het eerste lid, onderdeel c, wordt in de basisberoepsgerichte leerweg en de
      kaderberoepsgerichte leerweg het gemiddelde van de eindcijfers van alle beroepsgerichte keuzevakken aangemerkt als
      het eindcijfer van één vak.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel26
  - number: '26.4'
    text: |-
      Bij de uitslagbepaling volgens het eerste lid, onderdeel c, wordt in de gemengde leerweg het gemiddelde van de
      eindcijfers van het profielvak en alle beroepsgerichte keuzevakken aangemerkt als het eindcijfer van één vak, met
      dien verstande dat het eindcijfer voor het profielvak daarbij net zo vaak meetelt als het aantal eindcijfers van
      beroepsgerichte keuzevakken dat in de berekening wordt betrokken.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel26
  - number: '26.5'
    text: |-
      Het eindcijfer, bedoeld in het derde en vierde lid, wordt bepaald als het rekenkundig gemiddelde van de eindcijfers
      van de samenstellende onderdelen. Indien de uitkomst van deze berekening niet een geheel getal is, wordt dat getal
      indien het eerste cijfer achter de komma een 4 of lager is, naar beneden afgerond en indien dat cijfer een 5 of
      hoger is, naar boven afgerond.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel26
  - number: '26.6'
    text: De kandidaat die niet voldoet aan de voorwaarden, genoemd in het eerste lid, is afgewezen voor het staatsexamen.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel26
  - number: '26.7'
    text: |-
      Zodra de uitslag ingevolge het eerste en tweede lid, is vastgesteld, maakt het College voor toetsen en examens
      deze samen met de eindcijfers schriftelijk aan de kandidaat bekend. Indien de kandidaat is afgewezen voor het
      staatsexamen, wordt bij de bekendmaking mededeling gedaan van het in [artikel 27][ref1] bepaalde. De in de eerste
      volzin bedoelde uitslag is de definitieve uitslag indien artikel 27 geen toepassing vindt.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel27
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '27'
        hoofdstuk: IV
  - number: 26a.1
    text: 'De kandidaat die staatsexamen vwo of havo heeft afgelegd, is geslaagd indien:'
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel26a
  - number: 26a.1.a
    text: het rekenkundig gemiddelde van zijn bij het centraal examen behaalde cijfers ten minste 5,5 is;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel26a
  - number: 26a.1.b
    text: |-
      hij voor een van de vakken Nederlandse taal en literatuur, Engelse taal en literatuur en voor zover van toepassing
      wiskunde A, B of C als eindcijfer 5 of meer heeft behaald en hij voor het andere vak dan wel andere hier genoemde
      vakken als eindcijfer 6 of meer heeft behaald;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel26a
  - number: 26a.1.c
    text: 'hij onverminderd onderdeel b:'
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel26a
  - number: 26a.1.c.1°
    text: |-
      voor één van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 of meer en voor de overige vakken
      waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer heeft behaald;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel26a
  - number: 26a.1.c.2°
    text: |-
      voor één van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 4 en voor de overige vakken
      waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer heeft behaald, en het gemiddelde van de
      eindcijfers ten minste 6,0 bedraagt;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel26a
  - number: 26a.1.c.3°
    text: |-
      voor twee van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 heeft behaald en voor de overige
      vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer heeft behaald, en het gemiddelde van de
      eindcijfers ten minste 6,0 bedraagt; of
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel26a
  - number: 26a.1.c.4
    text: |-
      voor één van de vakken waarvoor een eindcijfer is vastgesteld als eindcijfer 4 en voor één van deze vakken als
      eindcijfer 5 heeft behaald en voor de overige vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of
      meer heeft behaald, en het gemiddelde van de eindcijfers ten minste 6,0 bedraagt; en
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel26a
  - number: 26a.1.d
    text: hij voor geen van de onderdelen, genoemd in het tweede lid, lager dan het eindcijfer 4 heeft behaald.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel26a
  - number: 26a.2
    text: |-
      Bij de uitslagbepaling volgens het eerste lid, wordt het gemiddelde van de eindcijfers van ten minste de volgende
      onderdelen aangemerkt als het eindcijfer van één vak, voor zover voor deze onderdelen een eindcijfer is bepaald:
      maatschappijleer en het profielwerkstuk. Het College voor toetsen en examens kan daaraan toevoegen:
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel26a
  - number: 26a.2.a
    text: |-
      literatuur, als onderdeel van alle afzonderlijke moderne talen, met dien verstande dat indien het College voor
      toetsen en examens daartoe niet besluit, literatuur voor de bepaling van de eindcijfers een onderdeel is van het
      college-examen van de desbetreffende taal en literatuur;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel26a
  - number: 26a.2.b
    text: algemene natuurwetenschappen in het havo en vwo.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel26a
  - number: 26a.3
    text: |-
      Het eindcijfer, bedoeld in het tweede lid, wordt bepaald als het rekenkundig gemiddelde van de eindcijfers van de
      samenstellende onderdelen. Indien de uitkomst van deze berekening niet een geheel getal is, wordt dat getal indien
      het eerste cijfer achter de komma een 4 of lager is, naar beneden afgerond en indien dat cijfer een 5 of hoger is,
      naar boven afgerond.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel26a
  - number: 26a.4
    text: |-
      De kandidaat die niet voldoet aan de voorwaarden, genoemd in het eerste en tweede lid, is afgewezen voor het
      staatsexamen.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel26a
  - number: 26a.5
    text: |-
      Zodra de uitslag ingevolge het eerste, tweede en vierde lid, is vastgesteld, maakt het College voor toetsen en
      examens deze samen met de eindcijfers schriftelijk aan de kandidaat bekend. Indien de kandidaat is afgewezen voor
      het staatsexamen, wordt bij de bekendmaking mededeling gedaan van het in [artikel 27][ref1] bepaalde. De in de
      eerste volzin bedoelde uitslag is de definitieve uitslag indien artikel 27 geen toepassing vindt.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel27
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '27'
        hoofdstuk: IV
  - number: '27.1'
    text: |-
      Onverminderd de [artikelen 6][ref1] en [23][ref2] heeft de kandidaat die in enig jaar met toepassing van de
      [artikelen 26][ref3] en [26a][ref4] is afgewezen voor het staatsexamen, recht op herkansing in het derde tijdvak
      van dat jaar. Indien de kandidaat op grond van artikel 23, eerste lid onderdeel b, in de gelegenheid wordt gesteld
      in het derde tijdvak het centraal examen te voltooien, wordt het recht op herkansing uitgeoefend, overeenkomstig
      artikel 23, eerste lid, onderdeel c, op een door het College voor toetsen en examens te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0011538#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0011538#Artikel26a
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '6'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0011538
        artikel: '23'
        hoofdstuk: III
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0011538
        artikel: '26'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0011538
        artikel: 26a
        hoofdstuk: IV
  - number: '27.2'
    text: 'Herkansing houdt in:'
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel27
  - number: 27.2.a
    text: |-
      het recht om voor één door de kandidaat te kiezen vak waarin hij in dat jaar door het College voor toetsen en
      examens is geëxamineerd, opnieuw deel te nemen aan het college-examen, in door het College voor toetsen en examens
      vast te stellen onderdelen van het examenprogramma, en
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel27
  - number: 27.2.b
    text: |-
      het recht om voor één door de kandidaat te kiezen vak waarin hij in dat jaar door het College voor toetsen en
      examens is geëxamineerd, opnieuw deel te nemen aan het centraal examen.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel27
  - number: '27.3'
    text: Voorwaarde voor toepassing van het eerste lid is dat de kandidaat daardoor alsnog kan slagen voor het staatsexamen.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel27
  - number: '28'
    text: |-
      De kandidaat die recht heeft op de in [artikel 27][ref1] bedoelde herkansing, is alsnog afgewezen indien hij
      niet binnen acht dagen na de in [artikel 26, vierde lid][ref2], of [artikel 26a, vijfde lid][ref3], bedoelde
      bekendmaking het College voor toetsen en examens ervan in kennis stelt dat hij zich aan de herkansing wenst te
      onderwerpen en daarbij schriftelijk opgeeft in welk vak hij opnieuw wil deelnemen aan het college-examen en in welk
      vak hij opnieuw wil deelnemen aan het centraal examen. Het College voor toetsen en examens bevestigt zo spoedig
      mogelijk aan de kandidaat schriftelijk de ontvangst van deze kennisgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0011538#Artikel26a
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '27'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0011538
        artikel: '26'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0011538
        artikel: 26a
        hoofdstuk: IV
  - number: '29.1'
    text: |-
      Het College voor toetsen en examens stelt vast op welke wijze het cijfer van de in [artikel 27][ref1] bedoelde
      herkansing voor het college-examen wordt bepaald. In zijn overwegingen betrekt het college de cijfers voor
      die toetsen van het eerder afgelegde college-examen die betrekking hebben op niet tot de herkansing behorende
      onderdelen van het examenprogramma.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel27
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '27'
        hoofdstuk: IV
  - number: '29.2'
    text: |-
      Het hoogste cijfer van de cijfers behaald bij de herkansing en bij het eerder afgelegde college-examen of centraal
      examen geldt als definitief cijfer voor het college-examen respectievelijk het centraal examen.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel29
  - number: '29.3'
    text: |-
      Na afloop van de herkansing wordt de uitslag definitief vastgesteld met overeenkomstige toepassing van de
      [artikelen 24 tot en met 26a][ref1] en wordt de uitslag schriftelijk aan de kandidaat bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel24
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '24'
        hoofdstuk: IV
  - number: '30.1'
    text: |-
      Het College voor toetsen en examens reikt aan elke kandidaat die is afgewezen voor het staatsexamen, een
      cijferlijst uit waarop ten aanzien van de vakken waarin hij in dat jaar door het College voor toetsen en examens is
      geëxamineerd, zijn vermeld, voor zover van toepassing:
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30
  - number: 30.1.a
    text: de cijfers voor het college-examen en het centraal examen,
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30
  - number: 30.1.b
    text: het vak of de vakken en het onderwerp of de titel van het profielwerkstuk vwo of havo,
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30
  - number: 30.1.c
    text: het thema en de beoordeling van het profielwerkstuk vmbo,
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30
  - number: 30.1.d
    text: de eindcijfers voor de examenvakken, alsmede
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30
  - number: 30.1.e
    text: de uitslag van het staatsexamen.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30
  - number: '30.2'
    text: |-
      Het College voor toetsen en examens reikt op grond van de definitieve uitslag aan elke kandidaat die is geslaagd
      voor het staatsexamen, een cijferlijst uit waarop ten aanzien van elk examenvak dat bij de bepaling van de uitslag
      is betrokken, zijn vermeld, voor zover van toepassing:
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30
  - number: 30.2.a
    text: de cijfers voor het college-examen, het centraal examen, en in voorkomend geval het schoolexamen,
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30
  - number: 30.2.b
    text: het vak of de vakken en het onderwerp of de titel van het profielwerkstuk vwo of havo,
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30
  - number: 30.2.c
    text: het thema en de beoordeling van het profielwerkstuk vmbo,
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30
  - number: 30.2.d
    text: |-
      de vakken waarvoor de kandidaat vrijstelling of ontheffing is verleend, met voor zover van toepassing de cijfers
      voor de desbetreffende vakken,
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30
  - number: 30.2.e
    text: de eindcijfers voor de examenvakken, alsmede
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30
  - number: 30.2.f
    text: de uitslag van het staatsexamen.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30
  - number: '30.3'
    text: |-
      Het College voor toetsen en examens draagt er zorg voor dat op grond van de definitieve uitslag aan elke voor het
      staatsexamen geslaagde kandidaat een diploma wordt uitgereikt waarop het profiel of de profielen zijn vermeld die
      bij de bepaling van de uitslag zijn betrokken.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30
  - number: '30.4'
    text: |-
      Indien een kandidaat in meer vakken examen heeft afgelegd dan in de vakken die ten minste nodig zijn voor het
      behalen van het staatsexamen, worden de vakken die niet bij de bepaling van de uitslag zijn betrokken, op de
      cijferlijst vermeld, tenzij de kandidaat daartegen bezwaar heeft.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30
  - number: '30.5'
    text: Onze Minister stelt de modellen van de diploma's en cijferlijsten vast.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30
  - number: '30.6'
    text: |-
      Voor de vermelding op de cijferlijst van vakken waarvoor de kandidaat vrijstelling of ontheffing is verleend bij
      het staatsexamen geldt het volgende:
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30
  - number: 30.6.a
    text: 'indien het betreft het staatsexamen vwo of het staatsexamen havo:'
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30
  - number: 30.6.a.1°
    text: |-
      de vakken culturele en kunstzinnige vorming en lichamelijke opvoeding van het gemeenschappelijk deel worden niet
      vermeld op de cijferlijst;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30
  - number: 30.6.a.2°
    text: |-
      het vak maatschappijleer waarvoor de kandidaat bij het staatsexamen vwo is vrijgesteld op grond van het bezit van
      een diploma havo, wordt niet vermeld op de cijferlijst;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30
  - number: 30.6.a.3°
    text: |-
      vakken waarvoor de kandidaat is vrijgesteld op grond van [artikel 9 van het Eindexamenbesluit VO][ref1] of
      [artikel 10][ref2] van dit besluit, worden vermeld op de cijferlijst, met vermelding van het eerder behaalde
      cijfer;


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel10
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0011538
        artikel: '10'
        hoofdstuk: II
  - number: 30.6.a.4°
    text: |-
      vakken waarvoor de kandidaat bij het staatsexamen vwo is vrijgesteld op grond van een eerder afgelegd eindexamen of
      staatsexamen havo of vmbo waarvan deze vwo-vakken deel uitmaakten, worden vermeld op de cijferlijst, met vermelding
      van het eerder behaalde cijfer;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30
  - number: 30.6.a.5°
    text: |-
      vakken waarvoor de kandidaat bij het staatsexamen havo is vrijgesteld op grond van een eerder afgelegd
      eindexamen of staatsexamen vmbo waarvan deze vakken dan wel de overeenkomstige vakken, bedoeld in
      [artikel 14, achtste lid, van de wet][ref1], deel uitmaakten, worden vermeld op de cijferlijst, met vermelding van
      het eerder behaalde cijfer;


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel14
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '14'
  - number: 30.6.a.6°
    text: |-
      andere vakken waarvoor de kandidaat vrijstelling of ontheffing is verleend, worden vermeld op de cijferlijst,
      zonder vermelding van een cijfer;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30
  - number: 30.6.b
    text: 'indien het betreft het staatsexamen vmbo:'
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30
  - number: 30.6.b.1°
    text: |-
      de vakken behorende tot de beeldende vorming, muziek, dans, drama en lichamelijke opvoeding van het
      gemeenschappelijk deel worden niet vermeld op de cijferlijst;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30
  - number: 30.6.b.2°
    text: |-
      vakken waarvoor de kandidaat is vrijgesteld op grond van [artikel 9 van het Eindexamenbesluit VO][ref1] of
      [artikel 10][ref2] van dit besluit, worden vermeld op de cijferlijst, met vermelding van het eerder behaalde
      cijfer;


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel10
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0011538
        artikel: '10'
        hoofdstuk: II
  - number: 30.6.b.3°
    text: |-
      vakken waarvoor de kandidaat bij het staatsexamen vmbo voor zover het betreft de theoretische leerweg
      of de gemengde leerweg is vrijgesteld op grond van een eerder afgelegd eindexamen of staatsexamen
      vmbo voor zover het betreft de kaderberoepsgerichte leerweg of de basisberoepsgerichte leerweg
      waarvan deze vakken dan wel de overeenkomstige vakken, bedoeld in [artikel 10, negende lid][ref1], of
      [artikel 10d, negende lid, van de wet][ref2], deel uitmaakten, worden vermeld op de cijferlijst, met vermelding van
      het eerder behaalde cijfer;


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10d
  - number: 30.6.b.4°
    text: |-
      andere vakken waarvoor de kandidaat vrijstelling of ontheffing is verleend, worden vermeld op de cijferlijst,
      zonder vermelding van een cijfer.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30
  - number: '30.7'
    text: Het College voor toetsen en examens tekent de diploma's en cijferlijsten.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30
  - number: 30a.1
    text: |-
      Een kandidaat is geslaagd voor het staatsexamen vwo met toekenning van het judicium cum laude indien zijn examen
      voldoet aan de volgende voorschriften:
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30a
  - number: 30a.1.a
    text: 'ten minste het gemiddelde eindcijfer 8,0, berekend op basis van de eindcijfers voor:'
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30a
  - number: 30a.1.a.1°
    text: |-
      de vakken in het gemeenschappelijke deel van het profiel, het eindcijfer berekend op grond van
      [artikel 26a, tweede lid][ref1], en de vakken van het profieldeel, en


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel26a
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: 26a
        hoofdstuk: IV
  - number: 30a.1.a.2°
    text: het vak uit het vrije deel waarvoor het hoogste eindcijfer is vastgesteld,
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30a
  - number: 30a.1.b
    text: |-
      ten minste het eindcijfer 7 of ten minste de kwalificatie «voldoende» voor alle vakken die meetellen bij de
      uitslagbepaling op grond van [artikel 26a][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel26a
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: 26a
        hoofdstuk: IV
  - number: 30a.1.c
    text: alle centrale examens zijn afgelegd binnen de periode van een jaar voorafgaand aan de diplomering.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30a
  - number: 30a.2
    text: |-
      Een kandidaat is geslaagd voor het staatsexamen havo met toekenning van het judicium cum laude indien zijn examen
      voldoet aan de volgende voorschriften:
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30a
  - number: 30a.2.a
    text: 'ten minste het gemiddelde eindcijfer 8,0, berekend op basis van de eindcijfers voor:'
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30a
  - number: 30a.2.a.1°
    text: |-
      de vakken in het gemeenschappelijke deel van het profiel, het eindcijfer berekend op grond van
      [artikel 26a, tweede lid][ref1], en de vakken van het profieldeel, en


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel26a
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: 26a
        hoofdstuk: IV
  - number: 30a.2.a.2°
    text: het vak uit het vrije deel waarvoor het hoogste eindcijfer is vastgesteld,
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30a
  - number: 30a.2.b
    text: |-
      ten minste het eindcijfer 6 of ten minste de kwalificatie «voldoende» voor alle vakken die meetellen bij de
      uitslagbepaling op grond van [artikel 26a][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel26a
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: 26a
        hoofdstuk: IV
  - number: 30a.2.c
    text: alle centrale examens zijn afgelegd binnen de periode van een jaar voorafgaand aan de diplomering.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30a
  - number: 30a.3
    text: |-
      Een kandidaat is geslaagd voor het staatsexamen vmbo theoretische leerweg met toekenning van het judicium cum laude
      indien zijn examen voldoet aan de volgende voorschriften:
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30a
  - number: 30a.3.a
    text: 'ten minste het gemiddelde eindcijfer 8,0, berekend op basis van de eindcijfers voor:'
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30a
  - number: 30a.3.a.1°
    text: de vakken Nederlandse taal, Engelse taal en maatschappijleer, en de algemene vakken van het profieldeel, en
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30a
  - number: 30a.3.a.2°
    text: het vak uit het vrije deel waarvoor het hoogste eindcijfer is vastgesteld,
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30a
  - number: 30a.3.b
    text: |-
      ten minste het eindcijfer 6 of ten minste de kwalificatie «voldoende» voor het profielwerkstuk en alle vakken die
      meetellen bij de uitslagbepaling op grond van [artikel 26][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel26
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '26'
        hoofdstuk: IV
  - number: 30a.3.c
    text: alle centrale examens zijn afgelegd binnen de periode van een jaar voorafgaand aan de diplomering.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30a
  - number: 30a.4
    text: |-
      Een kandidaat is geslaagd voor het staatsexamen vmbo basisberoepsgerichte leerweg of kaderberoepsgerichte leerweg
      met toekenning van het judicium cum laude indien zijn examen voldoet aan de volgende voorschriften:
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30a
  - number: 30a.4.a
    text: 'ten minste het gemiddelde eindcijfer 8,0, berekend op basis van:'
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30a
  - number: 30a.4.a.1°
    text: de eindcijfers voor het profielvak en de twee algemene vakken van het profieldeel, en
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30a
  - number: 30a.4.a.2°
    text: |-
      het eindcijfer berekend op grond van [artikel 26, derde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel26
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '26'
        hoofdstuk: IV
  - number: 30a.4.b
    text: |-
      ten minste het eindcijfer 6 of ten minste de kwalificatie «voldoende» voor alle vakken die meetellen bij de
      uitslagbepaling op grond van [artikel 26][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel26
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '26'
        hoofdstuk: IV
  - number: 30a.4.c
    text: alle centrale examens zijn afgelegd binnen de periode van een jaar voorafgaand aan de diplomering.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30a
  - number: 30a.5
    text: |-
      Een kandidaat is geslaagd voor het staatsexamen vmbo gemengde leerweg met toekenning van het judicium cum laude
      indien zijn examen voldoet aan de volgende voorschriften:
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30a
  - number: 30a.5.a
    text: 'ten minste het gemiddelde eindcijfer 8,0, berekend op basis van de eindcijfers voor:'
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30a
  - number: 30a.5.a.1°
    text: de vakken Nederlandse taal, Engelse taal en maatschappijleer, en de algemene vakken van het profieldeel, en
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30a
  - number: 30a.5.a.2°
    text: |-
      het algemene vak uit het vrije deel of het eindcijfer berekend op grond van [artikel 26, vierde lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel26
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '26'
        hoofdstuk: IV
  - number: 30a.5.b
    text: |-
      ten minste het eindcijfer 6 of ten minste de kwalificatie «voldoende» voor het profielwerkstuk en alle vakken die
      meetellen bij de uitslagbepaling op grond van [artikel 26][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel26
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '26'
        hoofdstuk: IV
  - number: '31.1'
    text: |-
      Het College voor toetsen en examens reikt aan de kandidaat die deelstaatsexamen heeft afgelegd, een cijferlijst uit
      waarop zijn vermeld, voor zover van toepassing:
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel31
  - number: 31.1.a
    text: de cijfers voor het college-examen en het centraal examen,
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel31
  - number: 31.1.b
    text: het vak of de vakken en het onderwerp of de titel van het profielwerkstuk vwo of havo,
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel31
  - number: 31.1.c
    text: het thema en de beoordeling van het profielwerkstuk vmbo, en
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel31
  - number: 31.1.d
    text: de eindcijfers voor de examenvakken.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel31
  - number: '31.2'
    text: |-
      Het College voor toetsen en examens reikt aan de in het eerste lid bedoelde kandidaat, alsmede aan de kandidaat
      aan wie op grond van de definitieve uitslag niet op grond van [artikel 30, derde lid][ref1], een diploma kan worden
      uitgereikt, een certificaat uit, waarop zijn vermeld, voor zover van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel30
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '30'
        hoofdstuk: IV
  - number: 31.2.a
    text: het vak of de vakken waarvoor de kandidaat een eindcijfer 6 of meer heeft behaald,
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel31
  - number: 31.2.b
    text: het vak of de vakken en het onderwerp of de titel van het profielwerkstuk vwo of havo, en
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel31
  - number: 31.2.c
    text: het thema en de beoordeling van het profielwerkstuk vmbo, voor zover beoordeeld met «goed» of «voldoende».
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel31
  - number: '31.3'
    text: Onze Minister stelt het model van het certificaat en de cijferlijst voor het deelstaatsexamen vast.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel31
  - number: '31.4'
    text: Het College voor toetsen en examens tekent de certificaten en de cijferlijsten voor het deelstaatsexamen.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel31
  - number: '32.1'
    text: Duplicaten van afgegeven diploma's, certificaten, bewijzen van ontheffing en cijferlijsten worden niet verstrekt.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel32
  - number: '32.2'
    text: |-
      Een schriftelijke verklaring dat een in het eerste lid bedoeld document is afgegeven, welke verklaring dezelfde
      waarde heeft als dat document zelf, kan uitsluitend door of vanwege Onze Minister worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel32
  - number: '32.3'
    text: |-
      Een document ter vervanging van een diploma, certificaat of cijferlijst kan uitsluitend door Onze Minister
      worden verstrekt indien op grond van [artikel 4, vierde lid][ref1], [artikel 7, eerste lid][ref2], of
      [artikel 28b, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref3] of ten gevolge van het verkrijgen van het
      Nederlanderschap op grond van [artikel 7, eerste lid, van de Rijkswet op het Nederlanderschap][ref4], de voornaam
      onderscheidenlijk de geslachtsnaam van de kandidaat is gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel28b
      [ref4]: https://wetten.overheid.nl/BWBR0003738#Artikel7
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: 28b
      - id: ref4
        bwb_id: BWBR0003738
        artikel: '7'
  - number: '33.1'
    text: |-
      Het College voor toetsen en examens kan toestaan dat een gehandicapte kandidaat het examen geheel of gedeeltelijk
      aflegt op een wijze die is aangepast aan de mogelijkheden van die kandidaat. In dat geval bepaalt het College voor
      toetsen en examens de wijze waarop het examen zal worden afgelegd, met dien verstande dat aan de overige bepalingen
      in dit besluit wordt voldaan. Het College voor toetsen en examens doet hiervan zo spoedig mogelijk mededeling aan
      de inspectie.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel33
  - number: '33.2'
    text: |-
      Tenzij sprake is van een objectief waarneembare lichamelijke handicap, geldt ten aanzien van de in het eerste lid
      bedoelde aangepaste wijze van examineren dat:
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel33
  - number: 33.2.a
    text: |-
      een deskundigenverklaring voorligt die door een ter zake kundige psycholoog, orthopedagoog, neuroloog of psychiater
      is opgesteld,
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel33
  - number: 33.2.b
    text: |-
      de aanpassing voor zover betrekking hebbend op het centraal examen in ieder geval kan bestaan uit een verlenging
      van de duur van de desbetreffende toets van het centraal examen met ten hoogste 30 minuten, en
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel33
  - number: 33.2.c
    text: |-
      een andere aanpassing slechts kan worden toegestaan voor zover daartoe in de onder a genoemde deskundigenverklaring
      ten aanzien van betrokkene een voorstel wordt gedaan dan wel indien de aanpassing aantoonbaar aansluit bij de
      begeleidingsadviezen, vermeld in die deskundigenverklaring.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel33
  - number: '33.3'
    text: |-
      Het College voor toetsen en examens kan ten aanzien van een kandidaat die de Nederlandse taal onvoldoende beheerst,
      afwijken van de bij of krachtens dit besluit vastgestelde voorschriften, indien de kandidaat met inbegrip van het
      jaar waarin hij staatsexamen of deelstaatsexamen aflegt, ten hoogste zes jaren onderwijs in Nederland heeft gevolgd
      en niet het Nederlands als moedertaal heeft. De in de eerste volzin bedoelde afwijking kan betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel33
  - number: 33.3.a
    text: het vak Nederlandse taal en literatuur;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel33
  - number: 33.3.b
    text: enig ander vak waarbij het gebruik van de Nederlandse taal van overwegende betekenis is.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel33
  - number: '33.4'
    text: |-
      De in het derde lid bedoelde afwijking bestaat ten aanzien van het centraal examen uitsluitend uit een verlenging
      van de duur van de desbetreffende toets met ten hoogste 30 minuten, en het verlenen van toestemming tot het gebruik
      van een verklarend woordenboek der Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel33
  - number: '33.5'
    text: Van elke afwijking op grond van het eerste en derde lid wordt mededeling gedaan aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel33
  - number: '34.1'
    text: |-
      Zo spoedig mogelijk na de vaststelling van de definitieve uitslag zendt het College voor toetsen en examens aan
      Onze Minister en aan de inspectie een lijst die voor iedere kandidaat die niet is geslaagd voor het staatsexamen,
      vermeldt, voor zover van toepassing:
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel34
  - number: 34.1.a
    text: de vakken waarin examen is afgelegd;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel34
  - number: 34.1.b
    text: de cijfers van het college-examen;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel34
  - number: 34.1.c
    text: het vak of de vakken waarop het profielwerkstuk vwo of havo betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel34
  - number: 34.1.d
    text: de beoordeling en het thema van het profielwerkstuk vmbo;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel34
  - number: 34.1.e
    text: de cijfers van het centraal examen;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel34
  - number: 34.1.f
    text: de eindcijfers;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel34
  - number: 34.1.g
    text: de uitslag van het staatsexamen.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel34
  - number: '34.2'
    text: |-
      Zo spoedig mogelijk na de vaststelling van de definitieve uitslag zendt het College voor toetsen en examens aan
      Onze Minister en aan de inspectie een lijst die voor iedere kandidaat die is geslaagd voor het staatsexamen,
      vermeldt, voor zover van toepassing:
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel34
  - number: 34.2.a
    text: het profiel of de profielen waarop het examen betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel34
  - number: 34.2.b
    text: de vakken die zijn vermeld op de cijferlijst;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel34
  - number: 34.2.c
    text: de cijfers van het college-examen of in voorkomend geval van het schoolexamen;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel34
  - number: 34.2.d
    text: het vak of de vakken waarop het profielwerkstuk vwo of havo betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel34
  - number: 34.2.e
    text: de beoordeling en het thema van het profielwerkstuk vmbo;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel34
  - number: 34.2.f
    text: de cijfers van het centraal examen;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel34
  - number: 34.2.g
    text: de eindcijfers;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel34
  - number: 34.2.h
    text: |-
      de vakken waarvoor de kandidaat vrijstelling of ontheffing is verleend, met voor zover van toepassing de cijfers
      voor de desbetreffende vakken;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel34
  - number: 34.2.i
    text: de uitslag van het staatsexamen.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel34
  - number: '34.3'
    text: |-
      Zo spoedig mogelijk na de vaststelling van de eindcijfers van de kandidaten die deelstaatsexamen hebben afgelegd,
      stuurt het College voor toetsen en examens aan Onze Minister en aan de inspectie een lijst die voor iedere
      kandidaat vermeldt, voor zover van toepassing:
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel34
  - number: 34.3.a
    text: de vakken die zijn vermeld op de cijferlijst;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel34
  - number: 34.3.b
    text: de cijfers van het college-examen;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel34
  - number: 34.3.c
    text: het vak of de vakken waarop het profielwerkstuk vwo of havo betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel34
  - number: 34.3.d
    text: de beoordeling en het thema van het profielwerkstuk vmbo;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel34
  - number: 34.3.e
    text: de cijfers van het centraal examen;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel34
  - number: 34.3.f
    text: de eindcijfers.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel34
  - number: '35.1'
    text: |-
      Het schriftelijke werk van de kandidaten wordt gedurende ten minste zes maanden na afloop van het examen bewaard
      op een door het College voor toetsen en examens te bepalen wijze. Een kandidaat die voor een vak centraal examen
      aflegt met geheime opgaven kan omtrent zijn werk gedurende genoemde periode van zes maanden inlichtingen inwinnen
      bij het College voor toetsen en examens. Elk der overige kandidaten kan gedurende die periode zijn schriftelijk
      werk inzien.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel35
  - number: '35.2'
    text: |-
      Een door het College voor toetsen en examens ondertekend exemplaar van de lijst, bedoeld in
      [artikel 34, eerste, tweede en derde lid][ref1], en de door de kandidaat overgelegde documenten, worden gedurende
      ten minste zes maanden na de vaststelling van de uitslag in het archief van het College voor toetsen en examens
      bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel34
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '34'
        hoofdstuk: V
  - number: '35.3'
    text: |-
      Het College voor toetsen en examens draagt er zorg voor dat een volledig stel van de bij de centrale examens
      gebruikte opgaven gedurende ten minste zes maanden na de vaststelling van de uitslag bewaard blijft in het archief
      van het College voor toetsen en examens.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel35
  - number: '36'
    text: |-
      Het College voor toetsen en examens kan bij of krachtens dit besluit vastgestelde voorschriften buiten toepassing
      laten of daarvan afwijken voor zover toepassing gelet op de bijzondere functie van het staatsexamen mede voor
      kandidaten die in bijzondere omstandigheden verkeren, zal leiden tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel36
  - number: '37'
    text: De bepalingen in dit hoofdstuk zijn van toepassing op de staatsexamens die worden afgenomen in het examenjaar 2021.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel37
  - number: '38.1'
    text: |-
      Het College voor toetsen en examens wijzigt het examenreglement en het programma van toetsing en afsluiting,
      bedoeld in [artikel 13][ref1], in het geval:


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel13
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '13'
        hoofdstuk: III
        afdeling: '1'
  - number: 38.1.a
    text: |-
      onderdelen van het examenreglement of het programma van toetsing en afsluiting als gevolg van de covid-19 epidemie
      praktisch onuitvoerbaar zijn; of
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel38
  - number: 38.1.b
    text: dat ter uitvoering van dit hoofdstuk noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel38
  - number: '38.2'
    text: |-
      Een wijziging, als bedoeld in het eerste lid, wordt schriftelijk gemotiveerd en na vaststelling onverwijld door het
      College voor toetsen en examens toegezonden aan de inspectie en verstrekt aan de kandidaten.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel38
  - number: '39.1'
    text: De kandidaat kan de toetsen van het centraal examen in het eerste en in het tweede tijdvak voor het eerst afleggen.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel39
  - number: '39.2'
    text: |-
      De kandidaat stelt het College voor toetsen en examens uiterlijk 23 april op een door het College voor toetsen en
      examens te bepalen wijze in kennis van de toetsen van het centraal examen die hij in het eerste of tweede tijdvak
      voor het eerst wil afleggen.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel39
  - number: '39.3'
    text: |-
      Indien de kandidaat het College voor toetsen en examens niet overeenkomstig het tweede lid in kennis stelt, laat
      het College voor toetsen en examens uiterlijk 30 april aan de kandidaat weten welke toetsen van het centraal examen
      de kandidaat in het eerste of tweede tijdvak voor het eerst aflegt.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel39
  - number: '39.4'
    text: |-
      In aanvulling op [artikel 23, eerste lid][ref1], geeft het College voor toetsen en examens een kandidaat die
      door te voldoen aan de richtlijnen van het Rijksinstituut voor Volksgezondheid en Milieu zoals beschreven in het
      generiek kader voortgezet onderwijs en voortgezet speciaal onderwijs, niet in staat is om één of meerdere toetsen
      van het centraal examen af te leggen de gelegenheid die toetsen in het eerstvolgende tijdvak af te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel23
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '23'
        hoofdstuk: III
        afdeling: '3'
  - number: '40.1'
    text: |-
      De kandidaat die in 2021 door het College van toetsen en examens is geëxamineerd heeft in afwijking van
      [artikel 27, tweede lid][ref1], het recht om:


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel27
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '27'
        hoofdstuk: IV
  - number: 40.1.a
    text: voor twee door de kandidaat te kiezen vakken opnieuw deel te nemen aan het college-examen of onderdelen daarvan; en
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel40
  - number: 40.1.b
    text: voor de onder a bedoelde vakken opnieuw deel te nemen aan het centraal examen.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel40
  - number: '40.2'
    text: |-
      Bij de toepassing van [artikel 27, derde lid][ref1], wordt [artikel 41][ref2] buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel41
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '27'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0011538
        artikel: '41'
        hoofdstuk: Va
  - number: '41.1'
    text: |-
      Indien dat nodig is om de kandidaat te laten slagen, laat het College voor toetsen en examens bij de bepaling van
      de definitieve uitslag op grond van [artikel 25, tweede lid][ref1], het eindcijfer of de kwalificatie van één vak,
      of het profielwerkstuk buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel25
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '25'
        hoofdstuk: IV
  - number: '41.2'
    text: 'Het vak bedoeld in het eerste lid kan niet een van de volgende vakken zijn:'
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel41
  - number: 41.2.a
    text: |-
      het vak Nederlandse taal, bedoeld in [artikel 26, eerste lid, onderdeel b][ref1], voor het staatsexamen van een
      leerweg in het vmbo;


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel26
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '26'
        hoofdstuk: IV
  - number: 41.2.b
    text: |-
      het vak Nederlandse taal en literatuur, het vak Engelse taal en literatuur en voor zover van toepassing het vak
      wiskunde A, B of C, bedoeld in [artikel 26a, eerste lid, onderdeel b][ref1], voor het staatsexamen vwo en havo.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel26a
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: 26a
        hoofdstuk: IV
  - number: '41.3'
    text: 'Het eindcijfer bedoeld in het eerste lid kan niet zijn:'
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel41
  - number: 41.3.a
    text: |-
      het eindcijfer bedoeld in [artikel 26, derde en vierde lid][ref1], voor het staatsexamen van een leerweg in het
      vmbo;


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel26
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '26'
        hoofdstuk: IV
  - number: 41.3.b
    text: |-
      het eindcijfer bedoeld in [artikel 26a, tweede lid][ref1], voor het staatsexamen vwo en havo.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel26a
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: 26a
        hoofdstuk: IV
  - number: '41.4'
    text: 'Het eerste lid is alleen van toepassing op een kandidaat die:'
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel41
  - number: 41.4.a
    text: in het examenjaar 2021 één of meerdere vakken van het staatsexamen afrondt;
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel41
  - number: 41.4.b
    text: met inbegrip van het vak dat buiten beschouwing wordt gelaten een staatsexamen heeft afgerond.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel41
  - number: '41.5'
    text: 'Het cijfer of de kwalificatie, bedoeld in het eerste lid, wordt:'
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel41
  - number: 41.5.a
    text: |-
      opgenomen op de cijferlijst als bedoeld in [artikel 30, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel30
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '30'
        hoofdstuk: IV
  - number: 41.5.b
    text: |-
      betrokken bij de toepassing van [artikel 30a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel30a
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: 30a
        hoofdstuk: IV
  - number: '41.6'
    text: |-
      Bij de berekening, bedoeld in [artikel 26, vierde lid][ref1], wordt het gewicht van het profielvak bepaald
      voorafgaand aan toepassing van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel26
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '26'
        hoofdstuk: IV
  - number: 43a.1
    text: |-
      Het staatsexamen vmbo en havo omvat voor kandidaten die geen schoolexamen rekenen, bedoeld in
      [artikel 118jj van de wet][ref1], of eindexamen in het vak wiskunde hebben afgelegd, of voor kandidaten die
      geen staatsexamen afleggen of hebben afgelegd in het vak wiskunde, een college-examen rekenen als bedoeld in
      [artikel 118kk van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel118jj
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel118kk
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 118jj
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 118kk
  - number: 43a.2
    text: |-
      In afwijking van het eerste lid is een kandidaat die in het bezit is van het diploma van een leerweg
      in het vmbo en die een schoolexamen rekenen als bedoeld in [artikel 118jj van de wet][ref1], of
      een college-examen rekenen als bedoeld in het eerste lid, heeft afgelegd zoals dit op grond van
      [artikel 2, tweede lid, aanhef en onderdeel c, van de Wet referentieniveaus Nederlandse taal en rekenen][ref2] is
      vastgesteld voor het eindexamen vmbo, bij het afleggen van het staatsexamen in een andere leerweg van het vmbo,
      vrijgesteld van het college-examen rekenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel118jj
      [ref2]: https://wetten.overheid.nl/BWBR0027679#Artikel2
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 118jj
      - id: ref2
        bwb_id: BWBR0027679
        artikel: '2'
  - number: 43a.3
    text: |-
      In afwijking van het eerste lid is de kandidaat die de rekentoets, bedoeld in
      [artikel 60, zesde lid, van de wet][ref1], zoals dat artikel luidde op de dag voor inwerkingtreding van artikel
      I, onderdeel C, van de Wet tot wijziging van onder andere de Wet op het voortgezet onderwijs in verband met de
      afschaffing van de rekentoets in het voortgezet onderwijs (Stb 2020, 233), heeft afgelegd, vrijgesteld van het
      college-examen rekenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel60
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '60'
  - number: 43a.4
    text: |-
      Het cijfer voor het college-examen rekenen weegt niet mee in de uitslagbepaling voor het staatsexamen vmbo en havo,
      bedoeld in de [artikelen 26][ref1] en [26a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel26a
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '26'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0011538
        artikel: 26a
        hoofdstuk: IV
  - number: 43a.5
    text: |-
      In afwijking van de [artikelen 30, eerste lid, onderdeel a, tweede lid, onderdeel a][ref1], en
      [31, eerste lid, onderdeel a][ref2], wordt het cijfer voor het college-examen rekenen vermeld op een bijlage bij
      de cijferlijst.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel31
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '30'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0011538
        artikel: '31'
        hoofdstuk: IV
  - number: 43a.6
    text: |-
      Indien de kandidaat is vrijgesteld van het college-examen rekenen op grond van het tweede of het derde lid, wordt
      het college-examen rekenen vermeld op een bijlage bij de cijferlijst, zonder vermelding van een cijfer.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel43a
  - number: 43a.7
    text: |-
      Het vijfde lid is van overeenkomstige toepassing op het eindcijfer van het vak wiskunde, indien de kandidaat het
      eindexamen of staatsexamen in het vak wiskunde heeft afgelegd, het eindcijfer voor wiskunde niet is betrokken in
      de uitslagbepaling, bedoeld in [artikel 26][ref1] of [artikel 26a][ref2], en de kandidaat bezwaar heeft tegen het
      opnemen van het eindcijfer van het vak wiskunde op de cijferlijst op grond van [artikel 30, vierde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel26a
      [ref3]: https://wetten.overheid.nl/BWBR0011538#Artikel30
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '26'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0011538
        artikel: 26a
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0011538
        artikel: '30'
        hoofdstuk: IV
  - number: 43a.8
    text: |-
      Dit artikel is van overeenkomstige toepassing op de kandidaat die het staatsexamen vmbo in de basisberoepsgerichte
      leerweg aflegt ter afsluiting van een leerwerktraject als bedoeld in [artikel 10b1 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b1
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b1
  - number: 43a.9
    text: Dit artikel vervalt op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel43a
  - number: 43b.1
    text: |-
      Het cijfer van het schoolexamen van het profielvak, bedoeld in [artikel 60e, derde lid, Eindexamenbesluit VO][ref1],
      zoals dat artikel luidde op 1 mei 2021, wordt betrokken bij de berekening van het rekenkundig gemiddelde, bedoeld
      in [artikel 26, eerste lid, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel60e
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel26
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel43b
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: 60e
      - id: ref2
        bwb_id: BWBR0011538
        artikel: '26'
        hoofdstuk: IV
  - number: 43b.2
    text: Deze bepaling vervalt op 1 januari 2032.
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel43b
  - number: '44.1'
    text: |-
      Dit besluit treedt met uitzondering van de [artikelen 37](onbekend), [39](onbekend), [40](onbekend) wat het
      [Eindexamenbesluit VO][ref1] betreft, en [41, tweede lid][ref2], in werking met ingang van de dag na de datum van
      uitgifte van het Staatsblad waarin het besluit wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0004593
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel41
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0004593
      - id: ref2
        bwb_id: BWBR0011538
        artikel: '41'
        hoofdstuk: Va
  - number: '44.2'
    text: |-
      De [artikelen 37](onbekend), [39](onbekend), [40](onbekend) wat het [Eindexamenbesluit VO][ref1] betreft,
      en [41, tweede lid][ref2], treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende onderdelen verschillend kan worden vastgesteld, met dien verstande dat [artikel 39][ref3] terugwerkt
      tot en met 1 augustus 1998. Laatstbedoeld besluit wordt niet genomen voordat vier weken zijn verstreken nadat het
      onderhavige besluit is overgelegd aan beide kamers der Staten-Generaal en gedurende die termijn niet door of namens
      een van beide kamers de wens wordt te kennen gegeven dat het in die artikelen geregelde onderwerp bij de wet wordt
      geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004593
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0011538#Artikel39
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0004593
      - id: ref2
        bwb_id: BWBR0011538
        artikel: '41'
        hoofdstuk: Va
      - id: ref3
        bwb_id: BWBR0011538
        artikel: '39'
        hoofdstuk: Va
  - number: '45'
    text: 'Dit besluit wordt aangehaald als: Staatsexamenbesluit VO.'
    url: https://wetten.overheid.nl/BWBR0011538/2021-04-17#Artikel45
