  - number: 30a
    text: |-
      1 Een kandidaat is geslaagd voor het staatsexamen vwo met toekenning van het judicium cum laude indien zijn examen
      voldoet aan de volgende voorschriften:

      a. ten minste het gemiddelde eindcijfer 8,0, berekend op basis van de eindcijfers voor:

      1°. de rekentoets, de vakken in het gemeenschappelijke deel van het profiel, het eindcijfer berekend op grond van
      [artikel 26a, tweede lid][ref1], en de vakken van het profieldeel, en

      2°. het vak uit het vrije deel waarvoor het hoogste eindcijfer is vastgesteld,

      b. ten minste het eindcijfer 7 of ten minste de kwalificatie «voldoende» voor de rekentoets en alle vakken die
      meetellen bij de uitslagbepaling op grond van [artikel 26a][ref2], en

      c. alle centrale examens zijn afgelegd binnen de periode van een jaar voorafgaand aan de diplomering.

      2 Een kandidaat is geslaagd voor het staatsexamen havo met toekenning van het judicium cum laude indien zijn examen
      voldoet aan de volgende voorschriften:

      a. ten minste het gemiddelde eindcijfer 8,0, berekend op basis van de eindcijfers voor:

      1°. de rekentoets, de vakken in het gemeenschappelijke deel van het profiel, het eindcijfer berekend op grond van
      [artikel 26a, tweede lid][ref3], en de vakken van het profieldeel, en

      2°. het vak uit het vrije deel waarvoor het hoogste eindcijfer is vastgesteld,

      b. ten minste het eindcijfer 6 of ten minste de kwalificatie «voldoende» voor de rekentoets en alle vakken die
      meetellen bij de uitslagbepaling op grond van [artikel 26a][ref4], en

      c. alle centrale examens zijn afgelegd binnen de periode van een jaar voorafgaand aan de diplomering.

      3 Een kandidaat is geslaagd voor het staatsexamen vmbo theoretische leerweg met toekenning van het judicium cum
      laude indien zijn examen voldoet aan de volgende voorschriften:

      a. ten minste het gemiddelde eindcijfer 8,0, berekend op basis van de eindcijfers voor:

      1°. de rekentoets, de vakken Nederlandse taal, Engelse taal en maatschappijleer, en de algemene vakken van het
      profieldeel, en

      2°. het vak uit het vrije deel waarvoor het hoogste eindcijfer is vastgesteld,

      b. ten minste het eindcijfer 6 of ten minste de kwalificatie «voldoende» voor de rekentoets, het profielwerkstuk en
      alle vakken die meetellen bij de uitslagbepaling op grond van [artikel 26][ref5], en

      c. alle centrale examens zijn afgelegd binnen de periode van een jaar voorafgaand aan de diplomering.

      4 Een kandidaat is geslaagd voor het staatsexamen vmbo basisberoepsgerichte leerweg of kaderberoepsgerichte leerweg
      met toekenning van het judicium cum laude indien zijn examen voldoet aan de volgende voorschriften:

      a. ten minste het gemiddelde eindcijfer 8,0, berekend op basis van:

      1°. de eindcijfers voor het profielvak en de twee algemene vakken van het profieldeel, en

      2°. het eindcijfer berekend op grond van [artikel 26, derde lid][ref6],

      b. ten minste het eindcijfer 6 of ten minste de kwalificatie «voldoende» voor de rekentoets, en alle vakken die
      meetellen bij de uitslagbepaling op grond van [artikel 26][ref7], en

      c. alle centrale examens zijn afgelegd binnen de periode van een jaar voorafgaand aan de diplomering.

      5 Een kandidaat is geslaagd voor het staatsexamen vmbo gemengde leerweg met toekenning van het judicium cum laude
      indien zijn examen voldoet aan de volgende voorschriften:

      a. ten minste het gemiddelde eindcijfer 8,0, berekend op basis van de eindcijfers voor:

      1°. de rekentoets, de vakken Nederlandse taal, Engelse taal en maatschappijleer, en de algemene vakken van het
      profieldeel, en

      2°. het algemene vak uit het vrije deel of het eindcijfer berekend op grond van artikel 26, vierde lid, en

      b. ten minste het eindcijfer 6 of ten minste de kwalificatie «voldoende» voor de rekentoets, het profielwerkstuk en
      alle vakken die meetellen bij de uitslagbepaling op grond van [artikel 26][ref8].


