        artikel: '10'
        hoofdstuk: II
  - number: '12'
    text: |-
      Een verzoek om ontheffing als bedoeld in [artikel 11][ref1] wordt schriftelijk ingediend bij het College voor
      toetsen en examens, onder overlegging van een uittreksel uit het geboorte- of persoonsregister en een gewaarmerkte
      fotokopie van het diploma, getuigschrift, certificaat of ander bewijsstuk waarop het verzoek om ontheffing berust.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel11
    url: https://wetten.overheid.nl/BWBR0011538/2018-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '11'
        hoofdstuk: II
  - number: '13'
    text: |-
      1 Het examenreglement bevat in elk geval informatie over de maatregelen, bedoeld in [artikel 6][ref1], en de
      toepassing daarvan, regels met betrekking tot de organisatie van het staatsexamen en deelstaatsexamen en de gang
      van zaken tijdens het staatsexamen en deelstaatsexamen, de herkansingsmogelijkheden van het centraal examen en het
      college-examen.

      2 Het College voor toetsen en examens stelt jaarlijks voor 1 oktober een programma van toetsing en afsluiting vast
      ten behoeve van het daaropvolgende kalenderjaar. Het programma vermeldt per vak in elk geval:

      a. welke onderdelen van het examenprogramma worden getoetst,

      b. de inhoud van de verschillende onderdelen,

      c. de wijze en de tijdstippen waarop het centraal examen en de toetsen van het college-examen aanvangen, alsmede de
      duur van de toetsen,

      d. regels omtrent verhindering voor het college-examen, alsmede

      e. de regels voor de wijze waarop het cijfer voor het college-examen voor een kandidaat tot stand komt.

      3 Het College voor toetsen en examens zendt het examenreglement en het programma van toetsing en afsluiting voor
      1 januari aan de inspectie. Deze documenten worden tegelijk met de bevestiging van de aanmelding, bedoeld in
      [artikel 3, eerste lid][ref2], door de bevestigende instantie aan de kandidaten ter beschikking gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel3
    url: https://wetten.overheid.nl/BWBR0011538/2018-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '6'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0011538
        artikel: '3'
        hoofdstuk: I
  - number: '14'
    text: |-
      Het college-examen bestaat uit een examendossier. Het examendossier is het geheel van de onderdelen van het
      college-examen zoals gedocumenteerd in een door het College voor toetsen en examens gekozen vorm.
    url: https://wetten.overheid.nl/BWBR0011538/2018-01-01#Artikel14
  - number: '15'
    text: |-
      1 Het college-examen wordt beoordeeld met een cijfer uit de reeks van 1 tot en met 10.

      2 Indien in een vak tevens centraal examen wordt afgelegd, worden de in het eerste lid genoemde cijfers gebruikt
      met de daartussenliggende cijfers met 1 decimaal.

      3 In afwijking van het eerste lid wordt het profielwerkstuk vmbo beoordeeld met «voldoende» of «goed».
    url: https://wetten.overheid.nl/BWBR0011538/2018-01-01#Artikel15
  - number: '16'
    text: |-
      Indien bij het College voor toetsen en examens, al dan niet naar aanleiding van mededelingen van de kandidaat,
      twijfel is gerezen over de juistheid van de beoordeling van het college-examen in enig vak of onderdeel van een
      vak, kan het College voor toetsen en examens die beoordeling ongeldig verklaren en een nieuw examen in dat vak of
      onderdeel opleggen.
    url: https://wetten.overheid.nl/BWBR0011538/2018-01-01#Artikel16
  - number: '18'
    text: |-
      1 Onze Minister zorgt voor het tijdig beschikbaar stellen van de opgaven, bedoeld in
      [artikel 2, tweede lid, onderdeel c, van de Wet College voor toetsen en examens][ref1] aan het College voor toetsen
      en examens.

      2 Het College voor toetsen en examens zorgt ervoor dat de opgaven en correctievoorschriften voor het centraal
      examen geheim blijven tot de aanvang van de toets waarbij deze opgaven aan de kandidaten worden voorgelegd.

      3 Tijdens een schriftelijke toets van het centraal examen worden aan de kandidaten geen mededelingen van welke aard
      ook aangaande de opgaven gedaan, uitgezonderd mededeling van door het College voor toetsen en examens vastgestelde
      errata.

      4 Het College voor toetsen en examens draagt er zorg voor dat het nodige toezicht bij het centraal examen wordt
      uitgeoefend. Zij die toezicht hebben gehouden, maken daarvan een proces-verbaal op en leveren dit samen met het
      gemaakte examenwerk in bij het College voor toetsen en examens.

      5 Een kandidaat die te laat komt, mag nog tot uiterlijk een half uur na de aanvang van een toets worden toegelaten.

      6 De aan de kandidaten voorgelegde opgaven voor een schriftelijke toets van het centraal examen blijven in het
      examenlokaal tot het einde van die toets.

      7 De kandidaten leveren de opgaven, de door hen gemaakte aantekeningen alsmede andere door hen gemaakte stukken in
      bij een van degenen die toezicht houden. Het College voor toetsen en examens bepaalt, in welke gevallen kan worden
      afgeweken van de eerste volzin, alsmede in welke gevallen en op welk tijdstip de opgaven, de aantekeningen en de
      andere stukken, bedoeld in die volzin, aan de kandidaten worden teruggegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0011538/2018-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
  - number: '19'
    text: |-
      1 Het College voor toetsen en examens draagt er zorg voor dat het gemaakte werk voor het centraal examen door twee
      door het College voor toetsen en examens aan te wijzen correctoren wordt beoordeeld.

      2 De correctoren kijken het werk onafhankelijk van elkaar na en zenden het met hun beoordeling aan het
      College voor toetsen en examens. De correctoren passen bij hun beoordeling toe de beoordelingsnormen,
      bedoeld in [artikel 2, tweede lid, onderdeel d, van de Wet College voor toetsen en examens][ref1].
      De correctoren drukken hun beoordeling uit in een score overeenkomstig de regels, bedoeld in
      [artikel 2, tweede lid, onderdeel e, van de Wet College voor toetsen en examens][ref2].

      3 Indien dit het College voor toetsen en examens noodzakelijk voorkomt, wordt het oordeel van een derde corrector
      ingeroepen. Het tweede lid is van overeenkomstige toepassing.

      4 Het College voor toetsen en examens stelt op grond van de beoordelingen door de correctoren de eindscore vast.


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0011538/2018-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0025364
        artikel: '2'
  - number: '20'
    text: |-
      Het College voor toetsen en examens stelt op grond van de eindscore, bedoeld in [artikel 19, vierde lid][ref1], het
      cijfer vast voor het centraal examen. Het College voor toetsen en examens neemt daarbij in acht de regels, bedoeld
      in [artikel 2, tweede lid, onderdeel e, van de Wet College voor toetsen en examens][ref2] en gebruikt daarbij één
      van de cijfers uit de schaal lopend van 1 tot en met 10, met de tussenliggende cijfers met 1 decimaal.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0011538/2018-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '19'
        hoofdstuk: III
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0025364
        artikel: '2'
  - number: '21'
    text: |-
      1 Indien het centraal examen naar het oordeel van de inspectie niet op regelmatige wijze heeft plaatsgevonden, kan
      zij besluiten dat het geheel of gedeeltelijk voor een of meer kandidaten opnieuw wordt afgenomen.

      2 Indien het eerste lid toepassing vindt, stelt het College voor toetsen en examens op verzoek van de inspectie
      nieuwe opgaven vast en bepaalt op welke wijze en door wie het examen zal worden afgenomen.
    url: https://wetten.overheid.nl/BWBR0011538/2018-01-01#Artikel21
  - number: '22'
    text: |-
      Indien door onvoorziene omstandigheden het centraal examen in één of meer vakken niet op de voorgeschreven wijze
      kan worden afgenomen, beslist het College voor toetsen en examens hoe dan moet worden gehandeld.
    url: https://wetten.overheid.nl/BWBR0011538/2018-01-01#Artikel22
  - number: '23'
    text: |-
      1 Indien een kandidaat om een geldige reden, ter beoordeling van het College voor toetsen en examens:

      a. is verhinderd bij één of meer toetsen van het centraal examen in het eerste tijdvak tegenwoordig te zijn, wordt
      hem in het tweede tijdvak de gelegenheid gegeven het centraal examen op ten hoogste twee toetsen te voltooien;

      b. ook in het tweede tijdvak verhinderd is, of wanneer hij het centraal examen in het tweede tijdvak niet kan
      voltooien, wordt hij in de gelegenheid gesteld in het derde tijdvak het centraal examen te voltooien;

      c. ook in het derde tijdvak verhinderd is, of wanneer hij het centraal examen in het derde tijdvak niet kan
      voltooien, wordt hij in de gelegenheid gesteld in het vierde tijdvak het centraal examen te voltooien.

      2 Toepassing van het eerste lid geschiedt onverminderd [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel6
    url: https://wetten.overheid.nl/BWBR0011538/2018-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '6'
        hoofdstuk: I
  - number: 23a
    text: |-
      1 De bepalingen uit deze afdeling, met uitzondering van [artikel 19][ref1], zijn van overeenkomstige toepassing op
      de rekentoets.

      2 Het College voor toetsen en examens stelt nadere regels voor de uitvoering van de rekentoets. Het College
      voor toetsen en examens stelt in ieder geval een regeling vast voor de uitvoering van de correctie voor zover de
      rekentoets bestaat uit open vragen.

      3 De regelingen, bedoeld in het eerste lid, treden slechts in werking na goedkeuring door Onze Minister. Onze
      Minister kan zijn goedkeuring onthouden wegens strijd met het recht of het algemeen belang.

      4 Het College voor toetsen en examens kan bij regeling bepalen dat het examen in de rekentoets niet onder toezicht
      van een of meer gecommitteerden staat.

      5 Met inachtneming van de [artikelen 23, zevende lid][ref2], [24, zesde lid][ref3], en
      [25, zesde lid, van het Eindexamenbesluit VO][ref4] worden de beoordelingsnormen, bedoeld in
      [artikel 2, tweede lid, onderdeel d, en lid 2a, van de Wet College voor toetsen en examens][ref5] bij de
      beoordeling van de rekentoets toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0004593#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0004593#Artikel25
      [ref5]: https://wetten.overheid.nl/BWBR0025364#Artikel2
