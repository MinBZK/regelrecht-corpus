  - number: 27a
    text: |-
      1 De kandidaat wordt binnen een kalenderjaar waarin hij deelstaatsexamen in de rekentoets doet eenmaal in de
      gelegenheid gesteld de rekentoets af te leggen.

      2 In afwijking van het eerste lid wordt een kandidaat die opgaat voor het volledig staatsexamen van een school of
      leerweg binnen een kalenderjaar driemaal in de gelegenheid gesteld de rekentoets af te leggen.

      3 Indien de kandidaat die opgaat voor het volledig staatsexamen in twee opeenvolgende kalenderjaren staatsexamen
      in de rekentoets doet, kan hij binnen deze periode viermaal gebruik maken van een gelegenheid om de rekentoets af
      te leggen.

      4 De kandidaat stelt het College voor toetsen en examens voor een door het college te bepalen dag en tijdstip er
      schriftelijk van in kennis dat hij gebruik wil maken van een gelegenheid, bedoeld in het eerste lid.

      5 Het College voor toetsen en examens kan ook bij de tweede of derde gelegenheid een kandidaat in de
      gelegenheid stellen gebruik te maken van de rekentoets ER of van de mogelijkheid tot het afleggen van de
      toets op een hoger niveau, bedoeld in [artikel 8, eerste lid][ref1], van de Staatsexamenbesluit VO en de
      [artikelen 13, tweede lid][ref2], [22, tweede lid][ref3], [23, zevende lid][ref4], [24, vijfde lid][ref5], of
      [25, vijfde lid, van het Eindexamenbesluit VO][ref6].

      6 Indien een kandidaat gebruik heeft gemaakt van de rekentoets ER of van de mogelijkheid tot het afleggen van
      de toets op een hoger niveau, bedoeld in [artikel 8, eerste lid][ref7], van de Staatsexamenbesluit VO en de
      [artikelen 13, tweede lid][ref8], [22, tweede lid][ref9], [23, zevende lid][ref10], [24, vijfde lid][ref11],
      of [25, vijfde lid, van het Eindexamenbesluit VO][ref12] stelt het College voor toetsen en examens de kandidaat
      in de gelegenheid bij de tweede of derde gelegenheid de rekentoets af te leggen zoals deze op grond van
      [artikel 2, vierde lid, onder b, en lid 2a, van de Wet College voor toetsen en examens][ref13] is vastgesteld voor
      de schoolsoort of leerweg waarin hij staatsexamen doet.


