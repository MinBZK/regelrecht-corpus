  - number: '29'
    text: |-
      1 Het College voor toetsen en examens stelt vast op welke wijze het cijfer van de in [artikel 27][ref1] bedoelde
      herkansing voor het college-examen wordt bepaald. In zijn overwegingen betrekt het college de cijfers voor
      die toetsen van het eerder afgelegde college-examen die betrekking hebben op niet tot de herkansing behorende
      onderdelen van het examenprogramma.

      2 Het hoogste cijfer van de cijfers behaald bij de herkansing en bij het eerder afgelegde college-examen, centraal
      examen of de eerder afgelegde rekentoets geldt als definitief cijfer voor het college-examen, de rekentoets
      respectievelijk het centraal examen.

      3 Na afloop van de herkansing wordt de uitslag definitief vastgesteld met overeenkomstige toepassing van de
      [artikelen 24 tot en met 26a][ref2] en wordt de uitslag schriftelijk aan de kandidaat bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel24
