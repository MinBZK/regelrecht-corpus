  - number: '2'
    text: |-
      1 Voor toelating tot het afleggen van het staatsexamen is verschuldigd een bedrag van:

      a. € 595 wat het examenjaar 2019 betreft,

      b. € 625 wat het examenjaar 2020 betreft,

      c. € 655 wat het examenjaar 2021 betreft,

      d. € 685 wat het examenjaar 2022 betreft, en

      e. € 720 wat het examenjaar 2023 betreft.

      2 Voor toelating tot deelstaatsexamens voor vakken waarin zowel het college-examen als het centraal examen wordt
      afgelegd, is verschuldigd een bedrag van:

      a. € 119 wat het examenjaar 2019 betreft,

      b. € 125 wat het examenjaar 2020 betreft,

      c. € 131 wat het examenjaar 2021 betreft,

      d. € 137 wat het examenjaar 2022 betreft, en

      e. € 144 wat het examenjaar 2023 betreft.

      2a Voor toelating tot deelstaatsexamens voor vakken waarin alleen het centraal examen of alleen het college-examen
      wordt afgelegd, of tot deelstaatsexamens die de rekentoets omvatten, is verschuldigd een bedrag van:

      a. € 59 wat het examenjaar 2019 betreft,

      b. € 62 wat het examenjaar 2020 betreft,

      c. € 65 wat het examenjaar 2021 betreft,

      d. € 68 wat het examenjaar 2022 betreft, en

      e. € 71 wat het examenjaar 2023 betreft.

      2b Met ingang van het examenjaar 2024 kunnen de bedragen, genoemd in het eerste lid, onderdeel e, tweede lid,
      onderdeel e, en lid 2a, onderdeel e, bij ministeriële regeling worden gewijzigd voor zover de consumentenprijsindex
      daartoe aanleiding geeft. Bij deze ministeriële regeling wordt bovendien het bedrag vastgesteld dat per
      kalenderjaar ten hoogste is verschuldigd voor het afleggen van deelstaatsexamen.

      3 Het verschuldigde bedrag wordt voldaan op de wijze en voor de datum, bepaald door het College voor toetsen en
      examens.

      4 Het eerste en tweede lid en lid 2a zijn niet van toepassing op kandidaten die afkomstig zijn van een school voor
      speciaal voortgezet onderwijs.

      5 Ten aanzien van kandidaten afkomstig van een school ten aanzien waarvan toepassing is gegeven aan
      [artikel 29, lid 1a, van de wet][ref1], of een instelling voor educatie en beroepsonderwijs ten aanzien waarvan
      toepassing is gegeven aan [artikel 6a.2.1 van de Wet educatie en beroepsonderwijs][ref2], is het bedrag, bedoeld in
      het eerste en tweede lid en lid 2a, verschuldigd door het bevoegd gezag van die school of instelling.

      6 Zij die aan een staatsexamen of deelstaatsexamen deelnemen, zijn verplicht zich te legitimeren op verzoek van hen
      die deze examens afnemen of daarop toezicht houden.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6a.2.1
