  - number: '32'
    text: |-
      1 Duplicaten van afgegeven diploma's, certificaten, bewijzen van ontheffing en cijferlijsten worden niet verstrekt.

      2 Een schriftelijke verklaring dat een in het eerste lid bedoeld document is afgegeven, welke verklaring dezelfde
      waarde heeft als dat document zelf, kan uitsluitend door of vanwege Onze Minister worden verstrekt.

      3 Een document ter vervanging van een diploma, certificaat of cijferlijst kan uitsluitend door Onze Minister
      worden verstrekt indien op grond van [artikel 4, vierde lid][ref1], [artikel 7, eerste lid][ref2], of
      [artikel 28b, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref3] of ten gevolge van het verkrijgen van het
      Nederlanderschap op grond van [artikel 7, eerste lid, van de Rijkswet op het Nederlanderschap][ref4], de voornaam
      onderscheidenlijk de geslachtsnaam van de kandidaat is gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel4
