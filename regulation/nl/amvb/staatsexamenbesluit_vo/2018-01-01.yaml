  - number: '9'
    text: |-
      De kandidaat kiest, met inachtneming van dit hoofdstuk, in welke vakken hij het staatsexamen of deelstaatsexamen
      aflegt.
    url: https://wetten.overheid.nl/BWBR0011538/2018-01-01#Artikel9
  - number: '10'
    text: |-
      1 Onverminderd vrijstellingen en ontheffingen op grond van de [artikelen 11][ref1],
      [12][ref2], [13][ref3], [14][ref4], [22][ref5] en, voor zover het betreft de algemene vakken,
      [23 tot en met 26 van het Eindexamenbesluit VO][ref6], is de kandidaat die staatsexamen aflegt:

      a. vrijgesteld van de rekentoets of van het examen in een vak in het vwo op grond van een examen vwo, indien voor
      de rekentoets of het overeenkomstige vak een eindcijfer 6 of hoger is behaald;

      b. vrijgesteld van de rekentoets of van het examen in een vak in het havo op grond van een examen vwo of havo,
      indien voor de overeenkomstige rekentoets of het overeenkomstige vak een eindcijfer 6 of hoger is behaald;

      c. vrijgesteld van de rekentoets of van het examen in een vak in de theoretische of gemengde leerweg van het vmbo
      op grond van een examen vwo, havo, vmbo theoretische leerweg of vmbo gemengde leerweg, indien voor de rekentoets of
      het overeenkomstige vak een eindcijfer 6 of hoger is behaald;

      d. vrijgesteld van de rekentoets of van het examen in een vak in de basisberoepsgerichte of kaderberoepsgerichte
      leerweg van het vmbo op grond van een examen vwo, havo of vmbo, indien voor de overeenkomstige rekentoets of het
      overeenkomstige vak een eindcijfer 6 of hoger is behaald;

      e. vrijgesteld van het examen in een vak van het vwo, havo of vmbo op grond van het overeenkomstige examen,
      afgelegd in Curaçao, Sint Maarten, Aruba, Bonaire, Saba of Sint Eustatius, indien voor het overeenkomstige vak een
      eindcijfer 6 of hoger is behaald;

      f. vrijgesteld van het profielwerkstuk vwo of havo, indien reeds eerder een profielwerkstuk is gemaakt dat
      betrekking heeft op een of meer vakken van dezelfde schoolsoort, behorende tot het profiel van de kandidaat en
      waarvoor een eindcijfer 6 of hoger is behaald;

      g. vrijgesteld van het profielwerkstuk vmbo, indien reeds eerder een profielwerkstuk vmbo is gemaakt dat betrekking
      heeft op een thema uit dat profiel, en dat is beoordeeld als «voldoende» of «goed».

      2 Het eerste lid is uitsluitend van toepassing indien na het jaar waarin het eindcijfer of de beoordeling is
      vastgesteld, nog geen 10 jaren zijn verstreken.

      3 In aanvulling op het eerste lid, onder a tot en met d, is de kandidaat vrijgesteld van het onderdeel literatuur
      van elke moderne taal, indien de kandidaat bij het eerder afgelegde examen, voor literatuur een cijfer 6 of hoger
      heeft behaald.

      4 In aanvulling op het eerste lid, onder a tot en met f, en derde lid, is de daar bedoelde kandidaat eveneens
      vrijgesteld indien het eindcijfer 5 of 4 is behaald, mits de kandidaat voldoet aan de voorwaarden van
      [artikel 26][ref7] of [artikel 26a][ref8] om te slagen voor het staatsexamen.

      5 Een kandidaat is vrijgesteld van de rekentoets indien:

      a. hij het examen in het onderdeel rekenen, bedoeld in
      [artikel 1 van het Examen- en kwalificatiebesluit beroepsopleidingen WEB][ref9] heeft afgelegd, ten minste gelijk
      aan het referentieniveau van de rekentoets van de school of leerweg waarin hij staatsexamen doet;

      b. hij voor dit onderdeel rekenen ten minste een cijfer 6 heeft behaald; en

      c. er na het studiejaar waarin hij dit onderdeel rekenen heeft afgelegd nog geen twee schooljaren zijn verstreken.

      6 Bij ministeriële regeling worden nadere voorschriften gegeven voor de toepassing van het eerste lid.

      7 [Artikel 52, negende lid, van het Eindexamenbesluit VO][ref10] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel11
