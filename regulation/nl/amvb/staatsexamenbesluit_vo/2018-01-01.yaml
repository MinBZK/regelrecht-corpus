  - number: '3'
    text: |-
      1 Het College voor toetsen en examens stelt de aanmeldingsprocedure vast. Onze Minister maakt de
      aanmeldingsprocedure tijdig bekend, voert die uit en bevestigt schriftelijk de aanmelding aan de kandidaat. Indien
      de kandidaat minderjarig is, wordt de aanmelding medeondertekend door diens wettelijke vertegenwoordigers.

      2 De aanmelding kan strekken tot:

      a. het verkrijgen van toelating tot het afleggen van het examen ten overstaan van het College voor toetsen en
      examens, of

      b. het overleggen aan het College voor toetsen en examens van de in [artikel 25, derde lid][ref1], bedoelde
      bewijsstukken ter verkrijging van het staatsexamendiploma, al dan niet in combinatie met het afleggen van het
      examen in een of meer vakken of rekentoets ten overstaan van het College voor toetsen en examens.

      3 Uit de aanmelding voor het staatsexamen blijkt tevens of sprake is van een of meer vrijstellingen of ontheffingen
      als bedoeld in de artikelen [10][ref2] en [11][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0011538#Artikel11
