  - number: 26a
    text: |-
      1 De kandidaat die staatsexamen vwo of havo heeft afgelegd, is geslaagd indien:

      a. het rekenkundig gemiddelde van zijn bij het centraal examen behaalde cijfers ten minste 5,5 is;

      b. hij voor:

      1°. één van de vakken Nederlandse taal en literatuur, Engelse taal en literatuur en voor zover van toepassing
      wiskunde A, wiskunde B of wiskunde C als eindcijfer 5 of meer heeft behaald en hij voor de rekentoets en het andere
      vak dan wel vakken, genoemd in dit onderdeel als eindcijfer 6 of meer heeft behaald; of voor

      2°. de rekentoets als eindcijfer 5 heeft behaald en voor de vakken Nederlandse taal en literatuur, Engelse taal en
      literatuur en in voorkomende gevallen wiskunde A, wiskunde B of wiskunde C als eindcijfer 6 of meer heeft behaald;

      c. hij onverminderd onderdeel b:

      1°. voor één van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 of meer en voor de overige
      vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer heeft behaald;

      2°. voor één van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 4 en voor de overige
      vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer heeft behaald, en het gemiddelde van de
      eindcijfers ten minste 6,0 bedraagt;

      3°. voor twee van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 heeft behaald en voor de
      overige vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer heeft behaald, en het gemiddelde
      van de eindcijfers ten minste 6,0 bedraagt; of

      4° voor één van de vakken waarvoor een eindcijfer is vastgesteld als eindcijfer 4 en voor één van deze vakken als
      eindcijfer 5 heeft behaald en voor de overige vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of
      meer heeft behaald, en het gemiddelde van de eindcijfers ten minste 6,0 bedraagt; en

      d. hij voor geen van de onderdelen, genoemd in het tweede lid, lager dan het eindcijfer 4 heeft behaald.

      2 Bij de uitslagbepaling volgens het eerste lid, wordt het gemiddelde van de eindcijfers van ten minste de volgende
      onderdelen aangemerkt als het eindcijfer van één vak, voor zover voor deze onderdelen een eindcijfer is bepaald:
      maatschappijleer en het profielwerkstuk. Het College voor toetsen en examens kan daaraan toevoegen:

      a. literatuur, als onderdeel van alle afzonderlijke moderne talen, met dien verstande dat indien het College voor
      toetsen en examens daartoe niet besluit, literatuur voor de bepaling van de eindcijfers een onderdeel is van het
      college-examen van de desbetreffende taal en literatuur;

      b. algemene natuurwetenschappen in het havo en vwo.

      3 Het eindcijfer, bedoeld in het tweede lid, wordt bepaald als het rekenkundig gemiddelde van de eindcijfers van de
      samenstellende onderdelen. Indien de uitkomst van deze berekening niet een geheel getal is, wordt dat getal indien
      het eerste cijfer achter de komma een 4 of lager is, naar beneden afgerond en indien dat cijfer een 5 of hoger is,
      naar boven afgerond.

      4 De kandidaat die niet voldoet aan de voorwaarden, genoemd in het eerste en tweede lid, is afgewezen voor het
      staatsexamen.

      5 Zodra de uitslag ingevolge het eerste, tweede en vierde lid, is vastgesteld, maakt het College voor toetsen en
      examens deze samen met de eindcijfers schriftelijk aan de kandidaat bekend. Indien de kandidaat is afgewezen voor
      het staatsexamen, wordt bij de bekendmaking mededeling gedaan van het in [artikel 27][ref1] bepaalde. De in de
      eerste volzin bedoelde uitslag is de definitieve uitslag indien artikel 27 geen toepassing vindt.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel27
