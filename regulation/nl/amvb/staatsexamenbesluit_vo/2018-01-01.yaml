  - number: '30'
    text: |-
      1 Het College voor toetsen en examens reikt aan elke kandidaat die is afgewezen voor het staatsexamen, een
      cijferlijst uit waarop ten aanzien van de vakken waarin hij in dat jaar door het College voor toetsen en examens is
      geëxamineerd, zijn vermeld, voor zover van toepassing:

      a. de cijfers voor het college-examen en het centraal examen,

      b. de rekentoets, het vak of de vakken en het onderwerp of de titel van het profielwerkstuk vwo of havo,

      c. het thema en de beoordeling van het profielwerkstuk vmbo,

      d. de eindcijfers voor de examenvakken en de rekentoets, alsmede

      e. de uitslag van het staatsexamen.

      2 Het College voor toetsen en examens reikt op grond van de definitieve uitslag aan elke kandidaat die is geslaagd
      voor het staatsexamen, een cijferlijst uit waarop ten aanzien van elk examenvak dat bij de bepaling van de uitslag
      is betrokken, zijn vermeld, voor zover van toepassing:

      a. de cijfers voor het college-examen, het centraal examen, en in voorkomend geval het schoolexamen,

      b. de rekentoets, het vak of de vakken en het onderwerp of de titel van het profielwerkstuk vwo of havo,

      c. het thema en de beoordeling van het profielwerkstuk vmbo,

      d. de rekentoets en de vakken waarvoor de kandidaat vrijstelling of ontheffing is verleend, met voor zover van
      toepassing de cijfers voor de rekentoets en de desbetreffende vakken,

      e. de eindcijfers voor de examenvakken en de rekentoets, alsmede

      f. de uitslag van het staatsexamen.

      3 Het College voor toetsen en examens draagt er zorg voor dat op grond van de definitieve uitslag aan elke voor het
      staatsexamen geslaagde kandidaat een diploma wordt uitgereikt waarop het profiel of de profielen zijn vermeld die
      bij de bepaling van de uitslag zijn betrokken.

      4 Indien een kandidaat in meer vakken examen heeft afgelegd dan in de vakken die ten minste nodig zijn voor het
      behalen van het staatsexamen, worden de vakken die niet bij de bepaling van de uitslag zijn betrokken, op de
      cijferlijst vermeld, tenzij de kandidaat daartegen bezwaar heeft.

      5 Onze Minister stelt de modellen van de diploma's en cijferlijsten vast.

      6 Voor de vermelding op de cijferlijst van vakken waarvoor de kandidaat vrijstelling of ontheffing is verleend bij
      het staatsexamen geldt het volgende:

      a. indien het betreft het staatsexamen vwo of het staatsexamen havo:

      1°. de vakken culturele en kunstzinnige vorming en lichamelijke opvoeding van het gemeenschappelijk deel worden
      niet vermeld op de cijferlijst;

      2°. het vak maatschappijleer waarvoor de kandidaat bij het staatsexamen vwo is vrijgesteld op grond van het bezit
      van een diploma havo, wordt niet vermeld op de cijferlijst;

      3°. vakken of de rekentoets waarvoor de kandidaat is vrijgesteld op grond van
      [artikel 9 van het Eindexamenbesluit VO][ref1] of [artikel 10][ref2] van dit besluit, worden vermeld op de
      cijferlijst, met vermelding van het eerder behaalde cijfer;

      4°. vakken of de rekentoets waarvoor de kandidaat bij het staatsexamen vwo is vrijgesteld op grond van een eerder
      afgelegd eindexamen of staatsexamen havo of vmbo waarvan deze vwo-vakken deel uitmaakten, worden vermeld op de
      cijferlijst, met vermelding van het eerder behaalde cijfer;

      5°. vakken of de rekentoets waarvoor de kandidaat bij het staatsexamen havo is vrijgesteld op grond van een eerder
      afgelegd eindexamen of staatsexamen vmbo waarvan de rekentoets deze vakken dan wel de overeenkomstige vakken,
      bedoeld in [artikel 14, achtste lid, van de wet][ref3], of de overeenkomstige rekentoets deel uitmaakten, worden
      vermeld op de cijferlijst, met vermelding van het eerder behaalde cijfer;

      6°. andere vakken waarvoor de kandidaat vrijstelling of ontheffing is verleend, worden vermeld op de cijferlijst,
      zonder vermelding van een cijfer;

      b. indien het betreft het staatsexamen vmbo:

      1°. de vakken behorende tot de beeldende vorming, muziek, dans, drama en lichamelijke opvoeding van het
      gemeenschappelijk deel worden niet vermeld op de cijferlijst;

      2°. vakken of de rekentoets waarvoor de kandidaat is vrijgesteld op grond van
      [artikel 9 van het Eindexamenbesluit VO][ref4] of [artikel 10][ref5] van dit besluit, worden vermeld op de
      cijferlijst, met vermelding van het eerder behaalde cijfer;

      3°. vakken of de rekentoets waarvoor de kandidaat bij het staatsexamen vmbo voor zover het betreft de theoretische
      leerweg of de gemengde leerweg is vrijgesteld op grond van een eerder afgelegd eindexamen of staatsexamen
      vmbo voor zover het betreft de kaderberoepsgerichte leerweg of de basisberoepsgerichte leerweg waarvan de
      rekentoets, deze vakken dan wel de overeenkomstige vakken, bedoeld in [artikel 10, negende lid][ref6], of
      [artikel 10d, negende lid, van de wet][ref7], deel uitmaakten, worden vermeld op de cijferlijst, met vermelding van
      het eerder behaalde cijfer;

      4°. andere vakken waarvoor de kandidaat vrijstelling of ontheffing is verleend, worden vermeld op de cijferlijst,
      zonder vermelding van een cijfer.

      7 Indien de rekentoets waarvoor het eindcijfer is vastgesteld een rekentoets ER betreft, wordt op de cijferlijst
      bij vermelding van de rekentoets de toevoeging «ER» geplaatst.

      8 Het College voor toetsen en examens tekent de diploma's en cijferlijsten.


