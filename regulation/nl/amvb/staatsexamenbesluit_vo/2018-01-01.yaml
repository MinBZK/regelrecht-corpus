  - number: '25'
    text: |-
      1 Het College voor toetsen en examens stelt vast of de kandidaat het examen heeft afgelegd in de rekentoets en in
      de voor het staatsexamen voorgeschreven vakken.

      2 Het College voor toetsen en examens stelt de uitslag van het staatsexamen vast, met inachtneming van de
      [artikelen 24][ref1] en [26][ref2] dan wel [26a][ref3].

      3 De uitslag van het staatsexamen wordt, onverminderd de leden 3a tot en met 3c, vastgesteld op grond van de
      eindcijfers die zijn behaald voor een volledig staatsexamen dat in dat jaar is afgelegd.

      3a In afwijking van het derde lid kan de kandidaat het staatsexamen afleggen door voor de desbetreffende vakken
      en voor de rekentoets bewijsstukken te overleggen als bedoeld in lid 3c. De kandidaat maakt zijn voornemen daartoe
      bekend aan het College voor toetsen en examens

      3b Indien de kandidaat deelstaatsexamen aflegt, kan de kandidaat daaraan voorafgaand aan het College kenbaar maken,
      het volledig staatsexamen te willen afleggen door voor de ontbrekende vakken of voor de ontbrekende rekentoets, in
      aanvulling op de cijferlijst voor het deelstaatsexamen, aan het College bewijsstukken te overleggen als bedoeld in
      lid 3c.

      3c De bewijsstukken zijn:

      a. eindcijfers van deelstaatsexamens die in dat jaar zijn afgelegd;

      b. cijferlijsten als bedoeld in [artikel 30][ref4] en [artikel 31, eerste lid][ref5];

      c. cijferlijsten van een school voor voortgezet onderwijs;

      d. resultatenlijsten of cijferlijsten van instellingen voor educatie en beroepsonderwijs;

      e. bewijzen van ontheffing als bedoeld in [artikel 11, vierde lid][ref6];

      f. bewijzen van ontheffing als bedoeld in [artikel 10, vierde lid, van het Eindexamenbesluit VO][ref7].

      4 Cijferlijsten worden uitsluitend bij de vaststelling van de uitslag betrokken, indien na het jaar waarin zij
      zijn vastgesteld, nog geen 10 jaren zijn verstreken. Bewijzen van ontheffing worden uitsluitend bij de vaststelling
      van de uitslag betrokken indien na het jaar waarin het onderliggende diploma, getuigschrift of ander bewijsstuk is
      vastgesteld, nog geen 10 jaren zijn verstreken.

      5 De uitslag luidt «geslaagd» of «afgewezen».

      6 Indien dat nodig is om de kandidaat te laten slagen voor het staatsexamen, betrekt het College voor toetsen en
      examens een of meer eindcijfers van de vakken niet bij de bepaling van de definitieve uitslag. De overgebleven
      vakken dienen een staatsexamen te vormen.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel24
