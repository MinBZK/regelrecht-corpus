  - number: 43g
    text: |-
      De artikelen in dit hoofdstuk vervallen op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen en onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011538/2018-01-01#Artikel43g
  - number: '44'
    text: |-
      1 Dit besluit treedt met uitzondering van de [artikelen 37](onbekend), [39](onbekend), [40](onbekend) wat het
      [Eindexamenbesluit VO][ref1] betreft, en [41, tweede lid][ref2], in werking met ingang van de dag na de datum van
      uitgifte van het Staatsblad waarin het besluit wordt geplaatst.

      2 De [artikelen 37](onbekend), [39](onbekend), [40](onbekend) wat het [Eindexamenbesluit VO][ref3] betreft,
      en [41, tweede lid][ref4], treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende onderdelen verschillend kan worden vastgesteld, met dien verstande dat [artikel 39][ref5] terugwerkt
      tot en met 1 augustus 1998. Laatstbedoeld besluit wordt niet genomen voordat vier weken zijn verstreken nadat het
      onderhavige besluit is overgelegd aan beide kamers der Staten-Generaal en gedurende die termijn niet door of namens
      een van beide kamers de wens wordt te kennen gegeven dat het in die artikelen geregelde onderwerp bij de wet wordt
      geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004593
