preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Onderwijs, Cultuur en Wetenschappen, mede namens de Staatssecretaris van
    Onderwijs, Cultuur en Wetenschappen, K.Y.I.J.Adelmund, van 14 maart 2000, nr. WJZ/2000/7644 (3714), directie
    Wetgeving en Juridische Zaken;

    Gelet op de artikelen 29, 30 en 60 van de Wet op het voortgezet onderwijs, enartikel 7.4.11, derde en vijfde lid,
    tweede volzin, van de Wet educatie en beroepsonderwijs;

    Gezien het advies van de Onderwijsraad van 14 december 1999, kenmerk 990679/486;

    De Raad van State gehoord (advies van 4 mei 2000, nr. W05.00.0109/III);

    Gezien het nader rapport van Onze Minister van Onderwijs, Cultuur en Wetenschappen, mede namens de Staatssecretaris
    van Onderwijs, Cultuur en Wetenschappen, K.Y.I.J.Adelmund, van 20 juli 2000, nr. WJZ/2000/19926(3714), directie
    Wetgeving en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0011538/2018-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

        - *basisberoepsgerichte leerweg:* de basisberoepsgerichte leerweg, bedoeld in [artikel 10b van de wet][ref1];
        - *centraal examen:* het centraal examen, bedoeld in [artikel 4, derde lid][ref2];
        - *college-examen:* het college-examen, bedoeld in [artikel 4, tweede lid][ref3];
        - *College voor toetsen en examens:* College voor toetsen en examens, genoemd in
      [artikel 2, eerste lid, van de Wet College voor toetsen en examens][ref4];
        - *deeleindexamen:* het deeleindexamen, bedoeld in [artikel 1, eerste lid, van het Eindexamenbesluit VO][ref5];
        - *deelstaatsexamen:* het examen in één of meer van de voor het staatsexamen voorgeschreven vakken;
        - *digitale examinering:* het voorbereiden, afnemen en afwikkelen van het centraal examen in één of meer vakken
      of de rekentoets met gebruikmaking van de daartoe door het College voor toetsen en examens beschikbaar gestelde
      programmatuur;
        - *ER:* ernstige rekenproblemen als bedoeld in [artikel 23b, eerste lid][ref6];
        - *gemengde leerweg:* de gemengde leerweg, bedoeld in [artikel 10d van de wet][ref7];
        - *havo:* hoger algemeen voortgezet onderwijs als bedoeld in [artikel 8 van de wet][ref8];
        - *herkansing:* het opnieuw deelnemen aan een toets van het centraal examen of het college-examen, daaronder niet
      begrepen de gelegenheid om de rekentoets opnieuw af te leggen;
        - *inspectie:* de inspectie, bedoeld in [artikel 1 van de Wet op het onderwijstoezicht][ref9];
        - *instelling voor educatie en beroepsonderwijs:* een instelling als bedoeld in
      [artikel 1.1.1, onderdeel b, van de Wet educatie en beroepsonderwijs][ref10], voor zover het betreft door die
      instelling verzorgde opleidingen vavo;
        - *kaderberoepsgerichte leerweg:* de kaderberoepsgerichte leerweg, bedoeld in [artikel 10b van de wet][ref11];
        - *kandidaat:* degene die zich op grond van [artikel 3][ref12] heeft aangemeld voor toelating tot het afleggen van
      het staatsexamen of deelstaatsexamen;
        - *maatschappelijke stage:* maatschappelijke stage als bedoeld in
      [artikel 6f van de Wet op het voortgezet onderwijs][ref13];
        - *mavo:* middelbaar algemeen voortgezet onderwijs, als bedoeld in [artikel 9 van de wet][ref14];
        - *Onze Minister:* Onze Minister van Onderwijs, Cultuur en Wetenschap;
        - *opleiding vavo:* een opleiding voortgezet algemeen volwassenenonderwijs als bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel a, van de Wet educatie en beroepsonderwijs][ref15], voor zover leidend tot
      het diploma vwo, het diploma havo of het diploma vmbo theoretische leerweg;
        - *profiel:* een in [artikel 10][ref16], [10b][ref17], [10d][ref18] of [12 van de wet][ref19] genoemd profiel;
        - *profielwerkstuk:* het in [artikel 4, derde lid, van het Eindexamenbesluit VO][ref20] bedoelde profielwerkstuk;
        - *rekentoets:* rekentoets als bedoeld in [artikel 60, zesde lid, van de wet][ref21];
        - *school:* een school voor vwo, een school voor havo of een school voor vmbo, tenzij anders blijkt;
        - *staatsexamen:* het staatsexamen ter verkrijging van het diploma vwo, het diploma havo of het vmbo, met dien
      verstande dat het staatsexamen vmbo voor zover het betreft de basisberoepsgerichte leerweg, de kaderberoepsgerichte
      leerweg of de gemengde leerweg enkel in de algemene vakken wordt afgenomen;
        - *theoretische leerweg:* de theoretische leerweg, bedoeld in [artikel 10 van de wet][ref22];
        - *toets:* een toets met schriftelijke of mondelinge vragen en opdrachten, of een praktische opdracht;
        - *vmbo:* voorbereidend middelbaar beroepsonderwijs als bedoeld in [artikel 21 van de wet][ref23];
        - *vwo:* voorbereidend wetenschappelijk onderwijs als bedoeld in [artikel 7 van de wet][ref24];
        - *wet:* [Wet op het voortgezet onderwijs][ref25].


