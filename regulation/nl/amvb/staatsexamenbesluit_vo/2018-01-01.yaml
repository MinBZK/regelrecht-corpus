  - number: 2a
    text: |-
      1 Tot het staatsexamen vmbo in de basisberoepsgerichte leerweg, de kaderberoepsgerichte leerweg of de gemengde
      leerweg, wordt uitsluitend toegelaten:

      a. de kandidaat die ten tijde van de aanmelding voor het staatsexamen is ingeschreven als deelnemer aan een
      beroepsopleiding als bedoeld in de [Wet educatie en beroepsonderwijs][ref1], eerder is afgewezen voor het
      eindexamen vmbo in een in de aanhef genoemde leerweg, en een cijferlijst overlegt waaruit blijkt dat voor elk van
      de vakken van het beroepsgerichte programma waarin eindexamen is afgelegd, het eindcijfer 6 of meer is behaald;

      b. de kandidaat die is ingeschreven aan een school voor voortgezet speciaal onderwijs of een school voor speciaal
      en voortgezet speciaal onderwijs als bedoeld in [artikel 1 van de Wet op de expertisecentra][ref2] en die met
      toepassing van [artikel 30 van de Wet op het voortgezet onderwijs][ref3] het eindexamen vmbo in een in de aanhef
      genoemde leerweg heeft afgelegd, indien de leerling daarvoor is afgewezen en een cijferlijst overlegt waaruit
      blijkt dat voor elk van de vakken van het beroepsgerichte programma waarin eindexamen is afgelegd, het eindcijfer 6
      of meer is behaald.

      2 In afwijking van het eerste lid, worden tot het deelstaatsexamen vmbo voor een of meer algemene vakken in de
      basisberoepsgerichte leerweg, kaderberoepsgerichte of gemengde leerweg eveneens toegelaten kandidaten die zijn
      ingeschreven aan een in dat lid bedoelde school voor voortgezet speciaal onderwijs of school voor speciaal en
      voortgezet speciaal onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel30
