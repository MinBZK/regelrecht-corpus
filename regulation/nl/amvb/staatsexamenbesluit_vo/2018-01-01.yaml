  - number: '8'
    text: |-
      1 De [artikelen 11][ref1], [12][ref2], [13][ref3], [14][ref4], [22][ref5], [23][ref6], [24][ref7], [25][ref8] en
      [26 van het Eindexamenbesluit VO][ref9] voor zover zij betrekking hebben op het eindexamen vwo van opleidingen
      vavo, het eindexamen havo van opleidingen vavo, het eindexamen vmbo theoretische leerweg van opleidingen vavo en
      het eindexamen in de algemene vakken van de overige leerwegen van het vmbo, zijn van overeenkomstige toepassing op
      respectievelijk het staatsexamen vwo, het staatsexamen havo en het staatsexamen vmbo.

      2 In afwijking van het eerste lid kan het College voor toetsen en examens, al dan niet voor een bepaalde groep van
      kandidaten, besluiten dat geen gelegenheid wordt gegeven tot het afleggen van examen in een vak dat uitsluitend
      behoort tot het vrije deel van de profielen of tot het vrije deel van een leerweg van het vmbo. De eerste volzin is
      van overeenkomstige toepassing ten aanzien van de vakken kunst (drama) en kunst (dans).


