  - number: 23b
    text: |-
      1 Er is een rekentoets ER waarbij de opgaven zijn aangepast voor kandidaten met ernstige rekenproblemen.

      2 Het College voor toetsen en examens informeert de kandidaat tijdig voor de eerste gelegenheid om de rekentoets
      af te leggen over de mogelijkheid van het afleggen van de rekentoets ER alsmede over de mogelijke gevolgen voor
      doorstroom naar het vervolgonderwijs of voor de arbeidsmarkt.

      3 Op verzoek van een kandidaat verleent het College voor toetsen en examens toestemming voor het afleggen van
      de rekentoets ER, indien de kandidaat aantoonbaar ernstige problemen heeft met de beheersing van de vereiste
      rekenvaardigheden.

      4 Er is in ieder geval sprake van aantoonbare ernstige rekenproblemen indien de kandidaat:

      a. zich heeft ingespannen de vereiste rekenvaardigheden te leren, en

      b. hij desondanks aanhoudend onvoldoende resultaten laat zien.
    url: https://wetten.overheid.nl/BWBR0011538/2018-01-01#Artikel23b
  - number: '24'
    text: |-
      1 Het eindcijfer voor alle vakken en rekentoets van het staatsexamen en deelstaatsexamen wordt uitgedrukt in een
      geheel cijfer uit de reeks van 1 tot en met 10.

      2 Het College voor toetsen en examens bepaalt het eindcijfer voor een vak op het rekenkundig gemiddelde van het
      cijfer voor het college-examen en het cijfer voor het centraal examen. Indien de uitkomst van deze berekening
      niet een geheel getal is, wordt dat getal indien het eerste cijfer achter de komma een 4 of lager is, naar beneden
      afgerond en indien dat cijfer een 5 of hoger is, naar boven afgerond.

      3 Indien in een vak alleen een college-examen wordt afgenomen, is het cijfer voor het college-examen tevens het
      eindcijfer.

      4 Indien voor een vak alleen een centraal examen wordt afgenomen, vormt het cijfer voor het centraal examen,
      afgerond overeenkomstig het tweede lid, het eindcijfer.

      5 Van de cijfers die zijn behaald bij de gelegenheden om de rekentoets af te leggen, bedoeld in
      [artikel 27a][ref1], geldt het hoogst behaalde cijfer, afgerond overeenkomstig het tweede lid, als eindcijfer voor
      de rekentoets.

      6 In afwijking van het vijfde lid, bepaalt het College voor toetsen en examens in overleg met de kandidaat die
      gebruik heeft gemaakt van meerdere gelegenheden om de rekentoets af te leggen en gebruik heeft gemaakt van de
      rekentoets ER of van de mogelijkheid, bedoeld in [artikel 27a, vijfde of zesde lid][ref2], welk cijfer voor de
      rekentoets, afgerond overeenkomstig het tweede lid, geldt als eindcijfer.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel27a
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel27a
