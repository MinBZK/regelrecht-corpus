  - number: 1.s
    text: 'toets: een toets met schriftelijke of mondelinge vragen en opdrachten, of een praktische opdracht;'
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel1
  - number: 1.t
    text: |-
      kandidaat: degene die zich op grond van [artikel 3][ref1] heeft aangemeld voor toelating tot het afleggen van het
      staatsexamen of deelstaatsexamen.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel3
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '3'
        hoofdstuk: I
  - number: '2.1'
    text: Voor toelating tot het afleggen van het staatsexamen is een bedrag van € 567 verschuldigd.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel2
  - number: '2.2'
    text: |-
      Voor toelating tot het afleggen van deelstaatsexamens is € 56 verschuldigd voor een vak ten aanzien waarvan alleen
      het college-examen wordt afgelegd, en € 113 voor een vak ten aanzien waarvan zowel het college-examen als het
      centraal examen wordt afgelegd, met dien verstande dat per kalenderjaar in totaal niet meer is verschuldigd dan
      € 567.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel2
  - number: '2.3'
    text: Het verschuldigde bedrag wordt voldaan op de wijze en voor de datum, bepaald door het College voor examens.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel2
  - number: '2.4'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op kandidaten die afkomstig zijn van een school voor speciaal
      voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel2
  - number: '2.5'
    text: |-
      Zij die aan een staatsexamen of deelstaatsexamen deelnemen, zijn verplicht zich te legitimeren op verzoek van hen
      die deze examens afnemen of daarop toezicht houden.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel2
  - number: '2.6'
    text: |-
      De in dit artikel bedoelde bedragen kunnen bij regeling van Onze Minister worden gewijzigd voor zover de
      consumentenprijsindex daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel2
  - number: '3.1'
    text: |-
      Het College voor examens stelt de aanmeldingsprocedure vast. De Informatie Beheer Groep maakt de
      aanmeldingsprocedure tijdig bekend, voert die uit en bevestigt schriftelijk de aanmelding aan de kandidaat. Indien
      de kandidaat minderjarig is, wordt de aanmelding medeondertekend door diens wettelijke vertegenwoordigers.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel3
  - number: '3.2'
    text: 'De aanmelding kan strekken tot:'
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel3
  - number: 3.2.a
    text: het verkrijgen van toelating tot het afleggen van het examen ten overstaan van het College voor examens, of
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel3
  - number: 3.2.b
    text: |-
      het overleggen aan het College voor examens van de in [artikel 25, derde lid][ref1], bedoelde bewijsstukken ter
      verkrijging van het staatsexamendiploma, al dan niet in combinatie met het afleggen van het examen in een of meer
      vakken ten overstaan van het College voor examens.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel25
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '25'
        hoofdstuk: IV
  - number: '3.3'
    text: |-
      Uit de aanmelding voor het staatsexamen blijkt tevens of sprake is van een of meer vrijstellingen of ontheffingen
      als bedoeld in de [artikelen 8][ref1] en [10][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel10
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '8'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0011538
        artikel: '10'
        hoofdstuk: II
  - number: '4.1'
    text: |-
      Het staatsexamen en het deelstaatsexamen bestaan voor ieder vak uit een college-examen of uit een college-examen en
      een centraal examen.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel4
  - number: '4.2'
    text: Het college-examen omvat mede een profielwerkstuk of een sectorwerkstuk.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel4
  - number: '4.3'
    text: Het centraal examen kent in elk kalenderjaar een eerste, tweede, derde en vierde tijdvak.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel4
  - number: '4.4'
    text: |-
      Voor de aanvang van het derde tijdvak zendt de Informatie Beheer Groep aan de inspectie een lijst met de
      kandidaten, de in het eerste of tweede tijdvak door die kandidaten behaalde cijfers, voor zover van toepassing de
      alsnog behaalde cijfers voor het college-examen, en een overzicht van het vak of de vakken waarin elke kandidaat
      zal worden geëxamineerd.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel4
  - number: '6.1'
    text: |-
      Indien een kandidaat zich ten aanzien van enig onderdeel van het staatsexamen of deelstaatsexamen dan wel ten
      aanzien van een aanspraak op ontheffing aan enige onregelmatigheid schuldig maakt of heeft gemaakt, kan het College
      voor examens maatregelen nemen.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel6
  - number: '6.2'
    text: |-
      De maatregelen, bedoeld in het eerste lid, die afhankelijk van de aard van de onregelmatigheid ook in combinatie
      met elkaar genomen kunnen worden, zijn:
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel6
  - number: 6.2.a
    text: het toekennen van het cijfer 1 voor een toets van het college-examen of het centraal examen;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel6
  - number: 6.2.b
    text: |-
      het ontzeggen van de deelname of de verdere deelname aan een of meer toetsen van het college-examen of het centraal
      examen van het desbetreffende vak;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel6
  - number: 6.2.c
    text: |-
      het ongeldig verklaren van een of meer toetsen van het reeds afgelegde deel van het college-examen of het centraal
      examen;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel6
  - number: 6.2.d
    text: minder vergaande maatregelen dan die, bedoeld onder a tot en met c.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel6
  - number: '6.3'
    text: |-
      Indien de ontzegging, bedoeld in het tweede lid, onderdeel b, betrekking heeft op een kandidaat die in meer dan één
      vak examen aflegt, kan de ontzegging betrekking hebben op alle toetsen.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel6
  - number: '6.4'
    text: |-
      Indien de onregelmatigheid pas wordt ontdekt na afloop van het examen, kan het College voor examens de kandidaat
      het diploma, bedoeld in [artikel 30, derde lid][ref1], of het certificaat, bedoeld in [artikel 31][ref2], en
      de cijferlijst onthouden, of kan deze bepalen dat aan de betrokken kandidaat dat diploma of certificaat, en die
      cijferlijst, slechts kunnen worden uitgereikt na een hernieuwd examen in de door het College voor examens aan te
      wijzen onderdelen en op de door deze te bepalen wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel31
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '30'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0011538
        artikel: '31'
        hoofdstuk: IV
  - number: '6.5'
    text: |-
      Het besluit waarbij een in het eerste lid bedoelde maatregel wordt genomen, wordt tegelijkertijd in afschrift
      toegezonden aan de inspectie en, indien de kandidaat minderjarig is, aan de wettelijke vertegenwoordigers van de
      kandidaat.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel6
  - number: '6.6'
    text: |-
      De kandidaat kan tegen een besluit waarbij een in het eerste lid bedoelde maatregel wordt genomen bezwaar maken bij
      het College voor examens. De termijn voor het indienen van een bezwaarschrift bedraagt vijf dagen nadat het besluit
      aan de kandidaat is bekendgemaakt op de voorgeschreven wijze. Het College voor examens beslist binnen twee weken
      na ontvangst van het bezwaarschrift, tenzij het college deze termijn heeft verlengd met ten hoogste twee weken. Het
      College voor examens stelt bij zijn beslissing zo nodig vast op welke wijze de kandidaat alsnog in de gelegenheid
      zal worden gesteld het examen geheel of gedeeltelijk af te leggen of opnieuw af te leggen. Het College voor examens
      deelt zijn beslissing op het bezwaar mee aan de wettelijke vertegenwoordigers van de kandidaat die minderjarig is
      en aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel6
  - number: '6.7'
    text: |-
      De kandidaat die onaangekondigd afwezig is bij het centraal examen in een vak, dan wel met aankondiging maar
      zonder een door het College voor examens aanvaarde reden, afwezig is bij enig onderdeel van het staatsexamen of
      deelstaatsexamen, is uitgesloten van verdere deelname aan het centraal examen in dat vak alsmede van deelname aan
      het college-examen in het desbetreffende vak.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel6
  - number: '7.1'
    text: |-
      Het staatsexamen wordt afgenomen overeenkomstig het desbetreffende examenprogramma, vastgesteld op grond van
      [artikel 7 van het Eindexamenbesluit v.w.o.-h.a.v.o.-m.a.v.o.-v.b.o.][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel7
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '7'
  - number: '7.2'
    text: 'Ten aanzien van het college-examen geldt dat:'
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel7
  - number: 7.2.a
    text: |-
      keuzen die ingevolge het in het eerste lid bedoelde examenprogramma moeten of kunnen worden gemaakt door de school,
      worden gemaakt door het College voor examens, en
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel7
  - number: 7.2.b
    text: |-
      het College voor examens kan afwijken van voorschriften met betrekking tot het schoolexamen die om praktische
      redenen in het college-examen niet uitvoerbaar zijn, met dien verstande dat het college-examen zoveel mogelijk
      gelijkwaardig blijft aan het schoolexamen.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel7
  - number: '8.1'
    text: |-
      De [artikelen 11][ref1], [12][ref2], [13][ref3] en
      [22 van het Eindexamenbesluit v.w.o.-h.a.v.o.-m.a.v.o.-v.b.o.][ref4] voor zover zij betrekking hebben op het
      eindexamen vwo van opleidingen vavo, het eindexamen havo van opleidingen vavo en het eindexamen voorbereidend
      middelbaar beroepsonderwijs theoretische leerweg van opleidingen vavo, zijn van overeenkomstige toepassing
      op respectievelijk het staatsexamen vwo, het staatsexamen havo en het staatsexamen voorbereidend middelbaar
      beroepsonderwijs van de theoretische leerweg.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0004593#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0004593#Artikel22
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0004593
        artikel: '13'
      - id: ref4
        bwb_id: BWBR0004593
        artikel: '22'
  - number: '8.2'
    text: |-
      In afwijking van het eerste lid kan het College voor examens, al dan niet voor een bepaalde groep van kandidaten,
      besluiten dat geen gelegenheid wordt gegeven tot het afleggen van examen in een vak dat uitsluitend behoort
      tot het vrije deel van de profielen of tot het vrije deel van de theoretische leerweg. De eerste volzin is van
      overeenkomstige toepassing ten aanzien van de vakken kunst (drama) en kunst (dans).
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel8
  - number: '9.1'
    text: |-
      De kandidaat kiest, met inachtneming van dit hoofdstuk, in welke vakken hij het staatsexamen of deelstaatsexamen
      aflegt.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel9
  - number: '9.2'
    text: |-
      De kandidaat kan in meer vakken staatsexamen afleggen dan in de vakken die ten minste nodig zijn om een
      staatsexamendiploma te verwerven.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel9
  - number: '10.1'
    text: |-
      Onverminderd vrijstellingen en ontheffingen op grond van de [artikelen 11][ref1], [12][ref2], [13][ref3] en
      [22 van het Eindexamenbesluit v.w.o.-h.a.v.o.-m.a.v.o.-v.b.o.][ref4] en met inachtneming van de beperking in
      [artikel 25, derde lid, aanhef en onderdeel d][ref5], dat van een school voor voortgezet onderwijs slechts één
      cijferlijst in beschouwing kan worden genomen, is de kandidaat die staatsexamen aflegt,


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0004593#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0004593#Artikel22
      [ref5]: https://wetten.overheid.nl/BWBR0011538#Artikel25
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0004593
        artikel: '13'
      - id: ref4
        bwb_id: BWBR0004593
        artikel: '22'
      - id: ref5
        bwb_id: BWBR0011538
        artikel: '25'
        hoofdstuk: IV
  - number: 10.1.a
    text: |-
      vrijgesteld van het examen in een vak in het vwo op grond van een examen vwo, indien voor het overeenkomstige vak
      een eindcijfer 6 of hoger of een daarmee overeenkomende waardering is behaald;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel10
  - number: 10.1.b
    text: |-
      vrijgesteld van het examen in een vak in het havo op grond van een examen vwo of havo, indien voor het
      overeenkomstige vak een eindcijfer 6 of hoger of een daarmee overeenkomende waardering is behaald, en vrijgesteld
      van het examen in een vak in het mavo op grond van een examen vwo, havo of mavo, indien voor het overeenkomstige
      vak een eindcijfer 6 of hoger of een daarmee overeenkomende waardering is behaald;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel10
  - number: 10.1.c
    text: |-
      vrijgesteld van het examen in een vak van het vwo, havo of mavo op grond van het overeenkomstige examen, afgelegd
      in de Nederlandse Antillen of in Aruba, indien voor het overeenkomstige vak een eindcijfer 6 of hoger of een
      daarmee overeenkomende waardering is behaald;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel10
  - number: 10.1.d
    text: |-
      vrijgesteld van het profielwerkstuk, indien reeds eerder een profielwerkstuk is gemaakt dat betrekking heeft op een
      of meer vakken van dezelfde schoolsoort, behorende tot het profiel van de kandidaat en waarvoor een eindcijfer 6 of
      hoger of een daarmee overeenkomende waardering is behaald;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel10
  - number: 10.1.e
    text: |-
      vrijgesteld van het sectorwerkstuk, indien reeds eerder een sectorwerkstuk is gemaakt dat betrekking heeft op een
      thema uit die sector, en dat is beoordeeld als «voldoende« of «goed».
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel10
  - number: '10.2'
    text: |-
      Het eerste lid is uitsluitend van toepassing indien na het jaar waarin het eindcijfer of de beoordeling is
      vastgesteld, nog geen 10 jaren zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel10
  - number: '10.3'
    text: |-
      In aanvulling op het eerste lid, onder a en b, is de kandidaat vrijgesteld van het onderdeel literatuur van elke
      moderne taal, indien de kandidaat bij het eerder afgelegde examen, voor literatuur een cijfer 6 of hoger heeft
      behaald.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel10
  - number: '10.4'
    text: |-
      In aanvulling op het eerste lid, onder a tot en met d, en derde lid, is de daar bedoelde kandidaat eveneens
      vrijgesteld indien het eindcijfer 5 of 4 is behaald, mits de kandidaat voldoet aan de voorwaarden van
      [artikel 26][ref1] om te slagen voor het staatsexamen.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel26
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '26'
        hoofdstuk: IV
  - number: '10.5'
    text: Bij ministeriële regeling worden nadere voorschriften gegeven voor de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel10
  - number: '11.1'
    text: |-
      Onverminderd [artikel 10][ref1] kan het College voor examens op verzoek van de kandidaat die een diploma wil
      verwerven, ontheffing verlenen voor een examenvak, indien de kandidaat op grond van eerder gevolgd onderwijs
      aantoonbaar in het bezit is van voldoende kennis en vaardigheden ter zake van het desbetreffende vak. De ontheffing
      kan slechts worden verleend op basis van een diploma, getuigschrift, certificaat of ander bewijsstuk, al of
      niet behaald in Nederland, dat door het College voor examens wordt aanvaard als bewijs van voldoende kennis en
      vaardigheden. Indien het College voor examens dit nodig oordeelt, onderzoekt het college of de kandidaat in het
      bezit is van voldoende kennis en vaardigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel10
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '10'
        hoofdstuk: II
  - number: '11.2'
    text: |-
      Het eerste lid is uitsluitend van toepassing indien na het jaar waarin het in dat lid bedoelde diploma,
      getuigschrift, certificaat of ander bewijsstuk is vastgesteld, nog geen 10 jaren zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel11
  - number: '11.3'
    text: |-
      Tot de in het eerste lid bedoelde diploma's, getuigschriften, certificaten en andere bewijsstukken behoren in
      elk geval die betreffende het Internationaal Baccalaureaat, het Europees Baccalaureaat en die betreffende het
      overeenkomstige onderwijs in een lidstaat van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel11
  - number: '11.4'
    text: |-
      Indien het College voor examens de gevraagde ontheffing verleent, verstrekt de Informatie Beheer Groep op verzoek
      van het college de verzoeker een bewijs van ontheffing, en zendt het college aan de inspectie een afschrift
      daarvan.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel11
  - number: '11.5'
    text: |-
      Het bewijs van ontheffing vermeldt de gronden van de ontheffing alsmede het tijdstip van het verrichten van de
      onderwijs- of examenprestatie waarop de ontheffing berust, en gaat in voorkomend geval vergezeld van een verklaring
      betreffende het in het eerste lid bedoelde onderzoek naar de kennis en vaardigheden van de examenkandidaat, of naar
      de in het eerste lid bedoelde bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel11
  - number: '11.6'
    text: Onze Minister stelt het model van het bewijs van ontheffing vast.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel11
  - number: '12'
    text: |-
      Een verzoek om ontheffing als bedoeld in [artikel 11][ref1] wordt schriftelijk ingediend bij het College voor
      examens, onder overlegging van een uittreksel uit het geboorte- of persoonsregister en een gewaarmerkte fotokopie
      van het diploma, getuigschrift, certificaat of ander bewijsstuk waarop het verzoek om ontheffing berust.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel11
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '11'
        hoofdstuk: II
  - number: '13.1'
    text: |-
      Het examenreglement bevat in elk geval informatie over de maatregelen, bedoeld in [artikel 6][ref1], en de
      toepassing daarvan, regels met betrekking tot de organisatie van het staatsexamen en deelstaatsexamen en de gang
      van zaken tijdens het staatsexamen en deelstaatsexamen, de herkansingsmogelijkheden van het college-examen.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel6
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '6'
        hoofdstuk: I
  - number: '13.2'
    text: |-
      Het College voor examens stelt jaarlijks voor 1 oktober een programma van toetsing en afsluiting vast ten behoeve
      van het daaropvolgende kalenderjaar. Het programma vermeldt in elk geval:
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel13
  - number: 13.2.a
    text: welke onderdelen van het examenprogramma in het college-examen worden getoetst,
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel13
  - number: 13.2.b
    text: de inhoud van de verschillende onderdelen van het college-examen,
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel13
  - number: 13.2.c
    text: de wijze en de tijdstippen waarop het college-examen plaatsvindt, alsmede de duur van de toetsen,
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel13
  - number: 13.2.d
    text: regels omtrent verhindering voor het college-examen,
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel13
  - number: 13.2.e
    text: |-
      de tijdstippen waarop de toetsen van het college-examen aanvangen, de wijze van herkansing van het college-examen,
      alsmede
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel13
  - number: 13.2.f
    text: de regels voor de wijze waarop het cijfer voor het college-examen voor een kandidaat tot stand komt.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel13
  - number: '13.3'
    text: |-
      Het College voor examens zendt het examenreglement en het programma van toetsing en afsluiting voor 1
      januari aan de inspectie. Deze documenten worden tegelijk met de bevestiging van de aanmelding, bedoeld in
      [artikel 3, eerste lid][ref1], door de bevestigende instantie aan de kandidaten verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel3
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '3'
        hoofdstuk: I
  - number: '14'
    text: |-
      Het college-examen bestaat uit een examendossier. Het examendossier is het geheel van de onderdelen van het
      college-examen zoals gedocumenteerd in een door het College voor examens gekozen vorm.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel14
  - number: '15.1'
    text: Het college-examen wordt beoordeeld met een cijfer uit de reeks van 1 tot en met 10.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel15
  - number: '15.2'
    text: |-
      Indien in een vak tevens centraal examen wordt afgelegd, worden de in het eerste lid genoemde cijfers gebruikt met
      de daartussenliggende cijfers met 1 decimaal.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel15
  - number: '15.3'
    text: In afwijking van het eerste lid wordt het sectorwerkstuk beoordeeld met «voldoende» of «goed».
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel15
  - number: '16'
    text: |-
      Indien bij het College voor examens, al dan niet naar aanleiding van mededelingen van de kandidaat, twijfel is
      gerezen over de juistheid van de beoordeling van het college-examen in enig vak of onderdeel van een vak, kan het
      College voor examens die beoordeling ongeldig verklaren en een nieuw examen in dat vak of onderdeel opleggen.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel16
  - number: '18.1'
    text: |-
      De Informatie Beheer Groep zorgt voor het tijdig drukken en verzenden van de opgaven, bedoeld in
      [artikel 2, tweede lid, onderdeel c, van de Wet College voor examens][ref1] aan het College voor examens.


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
  - number: '18.2'
    text: |-
      Het College voor examens zorgt ervoor dat de opgaven en correctievoorschriften voor het centraal examen geheim
      blijven tot de aanvang van de toets waarbij deze opgaven aan de kandidaten worden voorgelegd.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel18
  - number: '18.3'
    text: |-
      Tijdens een schriftelijke toets van het centraal examen worden aan de kandidaten geen mededelingen van welke aard
      ook aangaande de opgaven gedaan, uitgezonderd mededeling van door het College voor examens vastgestelde errata.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel18
  - number: '18.4'
    text: |-
      Het College voor examens draagt er zorg voor dat het nodige toezicht bij het centraal examen wordt uitgeoefend. Zij
      die toezicht hebben gehouden, maken daarvan een proces-verbaal op en leveren dit samen met het gemaakte examenwerk
      in bij het College voor examens.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel18
  - number: '18.5'
    text: |-
      Een kandidaat die te laat komt voor een schriftelijke toets, mag nog tot uiterlijk een half uur na de aanvang van
      die toets worden toegelaten.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel18
  - number: '18.6'
    text: |-
      De aan de kandidaten voorgelegde opgaven voor een schriftelijke toets van het centraal examen blijven in het
      examenlokaal tot het einde van die toets.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel18
  - number: '18.7'
    text: |-
      De kandidaten leveren de opgaven, de door hen gemaakte aantekeningen alsmede andere door hen gemaakte stukken in
      bij een van degenen die toezicht houden. Het College voor examens bepaalt, in welke gevallen kan worden afgeweken
      van de eerste volzin, alsmede in welke gevallen en op welk tijdstip de opgaven, de aantekeningen en de andere
      stukken, bedoeld in die volzin, aan de kandidaten worden teruggegeven.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel18
  - number: '19.1'
    text: |-
      Het College voor examens draagt er zorg voor dat het gemaakte werk voor het centraal examen door twee door het
      College voor examens aan te wijzen correctoren wordt beoordeeld.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel19
  - number: '19.2'
    text: |-
      De correctoren kijken het werk onafhankelijk van elkaar na en zenden het met hun beoordeling aan
      het College voor examens. De correctoren passen bij hun beoordeling toe de beoordelingsnormen,
      bedoeld in [artikel 2, tweede lid, onderdeel c, van de Wet College voor examens][ref1]. De
      correctoren drukken hun beoordeling uit in een score overeenkomstig de regels, bedoeld in
      [artikel 2, tweede lid, onderdeel d, van de Wet College voor examens][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0025364
        artikel: '2'
  - number: '19.3'
    text: |-
      Indien dit het College voor examens noodzakelijk voorkomt, wordt het oordeel van een derde corrector ingeroepen.
      Het tweede lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel19
  - number: '19.4'
    text: Het College voor examens stelt op grond van de beoordelingen door de correctoren de eindscore vast.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel19
  - number: '20'
    text: |-
      Het College voor examens stelt op grond van de eindscore, bedoeld in [artikel 19, vierde lid][ref1], het
      cijfer vast voor het centraal examen. Het College voor examens neemt daarbij in acht de regels, bedoeld in
      [artikel 2, tweede lid, onderdeel d, van de Wet College voor examens][ref2] en gebruikt daarbij één van de cijfers
      uit de schaal lopend van 1 tot en met 10, met de tussenliggende cijfers met 1 decimaal.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '19'
        hoofdstuk: III
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0025364
        artikel: '2'
  - number: '21.1'
    text: |-
      Indien het centraal examen naar het oordeel van de inspectie niet op regelmatige wijze heeft plaatsgevonden, kan
      zij besluiten dat het geheel of gedeeltelijk voor een of meer kandidaten opnieuw wordt afgenomen.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel21
  - number: '21.2'
    text: |-
      Indien het eerste lid toepassing vindt, stelt het College voor examens nieuwe opgaven vast en bepaalt het College
      voor examens op welke wijze en door wie het examen zal worden afgenomen.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel21
  - number: '22'
    text: |-
      Indien door onvoorziene omstandigheden het centraal examen in één of meer vakken niet op de voorgeschreven wijze
      kan worden afgenomen, beslist het College voor examens hoe dan moet worden gehandeld.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel22
  - number: '23.1'
    text: 'Indien een kandidaat om een geldige reden, ter beoordeling van het College voor examens:'
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel23
  - number: 23.1.a
    text: |-
      is verhinderd bij één of meer toetsen van het centraal examen in het eerste tijdvak tegenwoordig te zijn, wordt hem
      in het tweede tijdvak de gelegenheid gegeven het centraal examen op ten hoogste twee toetsen te voltooien;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel23
  - number: 23.1.b
    text: |-
      ook in het tweede tijdvak verhinderd is, of wanneer hij het centraal examen in het tweede tijdvak niet kan
      voltooien, wordt hij in de gelegenheid gesteld in het derde tijdvak het centraal examen te voltooien;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel23
  - number: 23.1.c
    text: |-
      ook in het derde tijdvak verhinderd is, of wanneer hij het centraal examen in het derde tijdvak niet kan voltooien,
      wordt hij in de gelegenheid gesteld in het vierde tijdvak het centraal examen te voltooien.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel23
  - number: '23.2'
    text: |-
      Toepassing van het eerste lid geschiedt onverminderd [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel6
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '6'
        hoofdstuk: I
  - number: '24.1'
    text: |-
      Het eindcijfer voor alle vakken van het staatsexamen en deelstaatsexamen wordt uitgedrukt in een geheel cijfer uit
      de reeks van 1 tot en met 10.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel24
  - number: '24.2'
    text: |-
      Het College voor examens bepaalt het eindcijfer voor een vak op het rekenkundig gemiddelde van het cijfer voor
      het college-examen en het cijfer voor het centraal examen. Is dit gemiddelde niet een geheel getal, dan wordt het,
      indien de cijfers achter de komma 45 of lager zijn, naar beneden afgerond en indien deze 46 of hoger zijn, naar
      boven afgerond.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel24
  - number: '24.3'
    text: |-
      Indien in een vak alleen een college-examen wordt afgenomen, is het cijfer voor het college-examen tevens het
      eindcijfer.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel24
  - number: '25.1'
    text: |-
      Het College voor examens stelt vast of de kandidaat het examen heeft afgelegd in de voor het staatsexamen
      voorgeschreven vakken.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel25
  - number: '25.2'
    text: |-
      Het College voor examens stelt de uitslag van het staatsexamen vast, met inachtneming van de [artikelen 24][ref1]
      en [26][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel26
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '24'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0011538
        artikel: '26'
        hoofdstuk: IV
  - number: '25.3'
    text: |-
      De uitslag ter verkrijging van het staatsexamendiploma wordt vastgesteld op grond van de volgende eindcijfers,
      cijferlijsten of bewijzen van ontheffing, al dan niet in combinatie:
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel25
  - number: 25.3.a
    text: de eindcijfers van een in dat jaar afgelegd volledig staatsexamen;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel25
  - number: 25.3.b
    text: de eindcijfers van in dat jaar afgelegde deelstaatsexamens;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel25
  - number: 25.3.c
    text: |-
      een of meer cijferlijsten als bedoeld in de [artikelen 30][ref1] en [31, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel31
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '30'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0011538
        artikel: '31'
        hoofdstuk: IV
  - number: 25.3.d
    text: één cijferlijst van een school voor voortgezet onderwijs;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel25
  - number: 25.3.e
    text: een of meer cijferlijsten van instellingen voor educatie en beroepsonderwijs;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel25
  - number: 25.3.f
    text: |-
      bewijzen van ontheffing als bedoeld in [artikel 11, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel11
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '11'
        hoofdstuk: II
  - number: 25.3.g
    text: |-
      bewijzen van ontheffing als bedoeld in
      [artikel 10, vierde lid, van het Eindexamenbesluit v.w.o.-h.a.v.o.-m.a.v.o.-v.b.o.][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel10
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '10'
  - number: '25.4'
    text: |-
      Cijferlijsten worden uitsluitend bij de vaststelling van de uitslag betrokken, indien na het jaar waarin zij zijn
      vastgesteld, nog geen 10 jaren zijn verstreken. Bewijzen van ontheffing worden uitsluitend bij de vaststelling
      van de uitslag betrokken indien na het jaar waarin het onderliggende diploma, getuigschrift of ander bewijsstuk is
      vastgesteld, nog geen 10 jaren zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel25
  - number: '25.5'
    text: De uitslag luidt «geslaagd voor het staatsexamen» of «afgewezen voor het staatsexamen».
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel25
  - number: '25.6'
    text: |-
      Indien dat nodig is om de kandidaat te laten slagen voor het staatsexamen, betrekt het College voor examens een of
      meer eindcijfers van de vakken niet bij de bepaling van de definitieve uitslag. De overgebleven vakken dienen een
      staatsexamen te vormen.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel25
  - number: '26.1'
    text: |-
      De kandidaat die het staatsexamen voorbereidend middelbaar beroepsonderwijs van de theoretische leerweg, genoemd in
      [artikel 10 van de Wet op het voortgezet onderwijs][ref1], heeft afgelegd, is geslaagd indien hij:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
  - number: 26.1.a
    text: |-
      voor ten hoogste één van zijn examenvakken het eindcijfer 5 heeft behaald en voor zijn overige examenvakken een 6
      of hoger,
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel26
  - number: 26.1.b
    text: |-
      voor ten hoogste één van zijn examenvakken het eindcijfer 4 heeft behaald en voor zijn overige examenvakken een 6
      of hoger waarvan ten minste één 7 of hoger, dan wel
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel26
  - number: 26.1.c
    text: |-
      voor twee van zijn examenvakken het eindcijfer 5 heeft behaald en voor zijn overige examenvakken een 6 of hoger
      waarvan ten minste één 7 of hoger.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel26
  - number: '26.2'
    text: 'De kandidaat die staatsexamen havo of vwo heeft afgelegd, is geslaagd:'
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel26
  - number: 26.2.a
    text: 'indien hij:'
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel26
  - number: 26.2.a.1°
    text: voor al zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer heeft behaald,
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel26
  - number: 26.2.a.2°
    text: |-
      voor één van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 en voor de overige vakken
      waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer heeft behaald,
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel26
  - number: 26.2.a.3°
    text: |-
      voor één van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 4 en voor de overige vakken
      waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer heeft behaald, en het gemiddelde van de
      eindcijfers tenminste 6,0 bedraagt, dan wel
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel26
  - number: 26.2.a.4°
    text: |-
      voor twee van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 heeft behaald dan wel voor één
      van de vakken waarvoor een eindcijfer is vastgesteld als eindcijfer 4 en voor één van deze vakken als eindcijfer
      5 heeft behaald, en voor de overige vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer heeft
      behaald, en het gemiddelde van de eindcijfers tenminste 6,0 bedraagt, en
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel26
  - number: 26.2.b
    text: indien geen van de eindcijfers van onderdelen, genoemd in het derde lid, lager is dan 4.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel26
  - number: '26.3'
    text: |-
      Bij de uitslagbepaling volgens het tweede lid wordt het gemiddelde van de eindcijfers van ten minste de volgende
      onderdelen aangemerkt als het eindcijfer van één vak, voor zover voor deze onderdelen een eindcijfer is bepaald:
      maatschappijleer en het profielwerkstuk en voor v.w.o. ook algemene natuurwetenschappen. Het College voor examens
      kan aan die onderdelen toevoegen:
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel26
  - number: 26.3.a
    text: |-
      literatuur, als onderdeel van alle afzonderlijke moderne talen, met dien verstande dat indien het College voor
      examens daartoe niet besluit, literatuur voor de bepaling van de eindcijfers een onderdeel is van het college-
      examen van de desbetreffende taal en literatuur;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel26
  - number: 26.3.b
    text: |-
      klassieke culturele vorming, met dien verstande dat indien het College voor examens daartoe niet besluit, klassieke
      culturele vorming voor de bepaling van de eindcijfers een onderdeel is van het college-examen van Latijnse taal en
      literatuur en Griekse taal en literatuur;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel26
  - number: 26.3.c
    text: algemene natuurwetenschappen in het h.a.v.o..
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel26
  - number: '26.4'
    text: |-
      In aanvulling op het eerste lid geldt tevens als voorwaarde dat het sectorwerkstuk moet zijn beoordeeld als
      «voldoende» of «goed».
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel26
  - number: '26.5'
    text: |-
      Het eindcijfer, bedoeld in het derde lid, wordt bepaald als het rekenkundig gemiddelde van de eindcijfers van de
      samenstellende onderdelen. Indien de uitkomst van deze berekening niet een geheel getal is, wordt dat getal indien
      het eerste cijfer achter de komma een 4 of lager is, naar beneden afgerond en indien dat cijfer een 5 of hoger is,
      naar boven afgerond.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel26
  - number: '26.6'
    text: |-
      De kandidaat die niet voldoet aan de voorwaarden, genoemd in het eerste en vierde of het tweede en derde lid, is
      afgewezen voor het staatsexamen.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel26
  - number: '26.7'
    text: |-
      Zodra de uitslag ingevolge het eerste, vierde en zesde lid of het tweede, derde en zesde lid is vastgesteld, maakt
      het College voor examens deze samen met de eindcijfers schriftelijk aan de kandidaat bekend. Indien de kandidaat
      is afgewezen voor het staatsexamen, wordt bij de bekendmaking mededeling gedaan van het in [artikel 27][ref1]
      bepaalde. De in de eerste volzin bedoelde uitslag is de definitieve uitslag indien [artikel 27][ref2] geen
      toepassing vindt.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel27
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '27'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0011538
        artikel: '27'
        hoofdstuk: IV
  - number: '27.1'
    text: |-
      Onverminderd de [artikelen 6][ref1] en [23][ref2] heeft de kandidaat die in enig jaar met toepassing van
      [artikel 26][ref3] is afgewezen voor het staatsexamen, recht op herkansing in het derde tijdvak van dat jaar.
      Indien de kandidaat op grond van [artikel 23, eerste lid onderdeel b][ref4], in de gelegenheid wordt gesteld in het
      derde tijdvak het centraal examen te voltooien, wordt het recht op herkansing uitgeoefend in het vierde tijdvak.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0011538#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0011538#Artikel23
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '6'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0011538
        artikel: '23'
        hoofdstuk: III
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0011538
        artikel: '26'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0011538
        artikel: '23'
        hoofdstuk: III
        afdeling: '3'
  - number: '27.2'
    text: 'Herkansing houdt in:'
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel27
  - number: 27.2.a
    text: |-
      het recht om voor één door de kandidaat te kiezen vak waarin hij in dat jaar door het College voor examens is
      geëxamineerd, opnieuw deel te nemen aan het college-examen, in door het College voor examens vast te stellen
      onderdelen van het examenprogramma, en
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel27
  - number: 27.2.b
    text: |-
      het recht om voor één door de kandidaat te kiezen vak waarin hij in dat jaar door het College voor examens is
      geëxamineerd, opnieuw deel te nemen aan het centraal examen.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel27
  - number: '27.3'
    text: Voorwaarde voor toepassing van het eerste lid is dat de kandidaat daardoor alsnog kan slagen voor het staatsexamen.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel27
  - number: '28'
    text: |-
      De kandidaat die recht heeft op de in [artikel 27][ref1] bedoelde herkansing, is alsnog afgewezen indien hij
      niet binnen acht dagen na de in [artikel 26, zevende lid][ref2], bedoelde bekendmaking het College voor examens
      ervan in kennis stelt dat hij zich aan de herkansing wenst te onderwerpen en daarbij schriftelijk opgeeft in welk
      vak hij opnieuw wil deelnemen aan het college-examen en in welk vak hij opnieuw wil deelnemen aan het centraal
      examen. Het College voor examens bevestigt zo spoedig mogelijk aan de kandidaat schriftelijk de ontvangst van deze
      kennisgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel26
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '27'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0011538
        artikel: '26'
        hoofdstuk: IV
  - number: '29.1'
    text: |-
      Het College voor examens stelt vast op welke wijze het cijfer van de in [artikel 27][ref1] bedoelde herkansing
      voor het college-examen wordt bepaald. In zijn overwegingen betrekt het college de cijfers voor die toetsen van
      het eerder afgelegde college-examen die betrekking hebben op niet tot de herkansing behorende onderdelen van het
      examenprogramma.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel27
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '27'
        hoofdstuk: IV
  - number: '29.2'
    text: |-
      Het hoogste cijfer van de cijfers behaald bij de herkansing en bij het eerder afgelegde college-examen of centraal
      examen geldt als definitief cijfer voor het college-examen respectievelijk centraal examen.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel29
  - number: '29.3'
    text: |-
      Na afloop van de herkansing wordt de uitslag definitief vastgesteld met overeenkomstige toepassing van de
      [artikelen 24 tot en met 26][ref1] en wordt de uitslag schriftelijk aan de kandidaat bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel24
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '24'
        hoofdstuk: IV
  - number: '30.1'
    text: |-
      Het College voor examens reikt aan elke kandidaat die is afgewezen voor het staatsexamen, een cijferlijst uit
      waarop ten aanzien van de vakken waarin hij in dat jaar door het College voor examens is geëxamineerd, zijn
      vermeld, voor zover van toepassing:
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel30
  - number: 30.1.a
    text: de cijfers voor het college-examen en het centraal examen,
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel30
  - number: 30.1.b
    text: het vak of de vakken en het onderwerp of de titel van het profielwerkstuk,
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel30
  - number: 30.1.c
    text: het thema van het sectorwerkstuk, alsmede de beoordeling van het sectorwerkstuk,
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel30
  - number: 30.1.d
    text: de eindcijfers voor de examenvakken, alsmede
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel30
  - number: 30.1.e
    text: de uitslag van het staatsexamen.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel30
  - number: '30.2'
    text: |-
      Het College voor examens reikt op grond van de definitieve uitslag aan elke kandidaat die is geslaagd voor het
      staatsexamen, een cijferlijst uit waarop ten aanzien van elk examenvak dat bij de bepaling van de uitslag is
      betrokken, zijn vermeld, voor zover van toepassing:
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel30
  - number: 30.2.a
    text: de cijfers voor het college-examen, het centraal examen, en in voorkomend geval het schoolexamen,
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel30
  - number: 30.2.b
    text: het vak of de vakken en het onderwerp of de titel van het profielwerkstuk,
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel30
  - number: 30.2.c
    text: het thema van het sectorwerkstuk, alsmede de beoordeling van het sectorwerkstuk,
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel30
  - number: 30.2.d
    text: |-
      de vakken waarvoor de kandidaat vrijstelling of ontheffing is verleend, met voor zover van toepassing de cijfers
      voor de desbetreffende vakken,
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel30
  - number: 30.2.e
    text: de eindcijfers voor de examenvakken, alsmede
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel30
  - number: 30.2.f
    text: de uitslag van het staatsexamen.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel30
  - number: '30.3'
    text: |-
      Het College voor examens draagt er zorg voor dat op grond van de definitieve uitslag aan elke voor het staatsexamen
      geslaagde kandidaat een diploma wordt uitgereikt waarop het profiel of de profielen zijn vermeld die bij de
      bepaling van de uitslag zijn betrokken.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel30
  - number: '30.4'
    text: |-
      Indien een kandidaat in meer vakken examen heeft afgelegd dan in de vakken die ten minste nodig zijn voor het
      behalen van het staatsexamen, worden de vakken die niet bij de bepaling van de uitslag zijn betrokken, op de
      cijferlijst vermeld, tenzij de kandidaat daartegen bezwaar heeft.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel30
  - number: '30.5'
    text: Onze Minister stelt de modellen van de diploma's en cijferlijsten vast.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel30
  - number: '30.6'
    text: |-
      Voor de vermelding op de cijferlijst van vakken waarvoor de kandidaat vrijstelling of ontheffing is verleend bij
      het staatsexamen geldt het volgende:
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel30
  - number: 30.6.a
    text: 'indien het betreft het staatsexamen v.w.o. of het staatsexamen h.a.v.o.:'
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel30
  - number: 30.6.a.1°
    text: |-
      de vakken culturele en kunstzinnige vorming en lichamelijke opvoeding van het gemeenschappelijk deel worden niet
      vermeld op de cijferlijst;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel30
  - number: 30.6.a.2°
    text: |-
      de vakken algemene natuurwetenschappen en maatschappijleer waarvoor de kandidaat bij het staatsexamen v.w.o. is
      vrijgesteld op grond van het bezit van een diploma h.a.v.o., worden niet vermeld op de cijferlijst;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel30
  - number: 30.6.a.3°
    text: |-
      vakken waarvoor de kandidaat is vrijgesteld op grond van
      [artikel 9 van het Eindexamenbesluit v.w.o.-h.a.v.o.-m.a.v.o.-v.b.o.][ref1] of [artikel 10][ref2] van dit besluit,
      worden vermeld op de cijferlijst, met vermelding van het eerder behaalde cijfer;


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel10
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0011538
        artikel: '10'
        hoofdstuk: II
  - number: 30.6.a.4°
    text: |-
      vakken waarvoor de kandidaat bij het staatsexamen v.w.o. is vrijgesteld op grond van een eerder afgelegd eindexamen
      of staatsexamen h.a.v.o. of v.m.b.o. voor zover het betreft de theoretische leerweg, waarvan deze v.w.o.-vakken
      deel uitmaakten, worden vermeld op de cijferlijst, met vermelding van het eerder behaalde cijfer;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel30
  - number: 30.6.a.5°
    text: |-
      vakken waarvoor de kandidaat bij het staatsexamen h.a.v.o. is vrijgesteld op grond van een eerder afgelegd
      eindexamen of staatsexamen v.m.b.o., voor zover het betreft de theoretische leerweg waarvan deze vakken dan wel de
      overeenkomstige vakken, bedoeld in [artikel 14, achtste lid, van de wet][ref1], deel uitmaakten, worden vermeld op
      de cijferlijst, met vermelding van het eerder behaalde cijfer;


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel14
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '14'
  - number: 30.6.a.6°
    text: |-
      andere vakken waarvoor de kandidaat vrijstelling of ontheffing is verleend, worden vermeld op de cijferlijst,
      zonder vermelding van een cijfer;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel30
  - number: 30.6.b
    text: 'indien het betreft het staatsexamen v.m.b.o. theoretische leerweg:'
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel30
  - number: 30.6.b.1°
    text: |-
      de vakken behorende tot de beeldende vorming, muziek, dans, drama en lichamelijke opvoeding van het
      gemeenschappelijk deel worden niet vermeld op de cijferlijst;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel30
  - number: 30.6.b.2°
    text: |-
      vakken waarvoor de kandidaat is vrijgesteld op grond van
      [artikel 9 van het Eindexamenbesluit v.w.o.-h.a.v.o.-m.a.v.o.-v.b.o.][ref1] of [artikel 10][ref2] van dit besluit,
      worden vermeld op de cijferlijst, met vermelding van het eerder behaalde cijfer;


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel10
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0011538
        artikel: '10'
        hoofdstuk: II
  - number: 30.6.b.3°
    text: |-
      vakken waarvoor de kandidaat bij het staatsexamen v.m.b.o. voor zover het betreft de theoretische leerweg, is
      vrijgesteld op grond van een eerder afgelegd eindexamen v.m.b.o. voor zover het betreft de kaderberoepsgerichte
      leerweg of de basisberoepsgerichte leerweg waarvan deze vakken dan wel de overeenkomstige vakken, bedoeld
      [artikel 10, negende lid, van de wet][ref1], deel uitmaakten, worden vermeld op de cijferlijst, met vermelding van
      het eerder behaalde cijfer;


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
  - number: 30.6.b.4°
    text: |-
      andere vakken waarvoor de kandidaat vrijstelling of ontheffing is verleend, worden vermeld op de cijferlijst,
      zonder vermelding van een cijfer.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel30
  - number: '30.7'
    text: Het College voor examens tekent de diploma's en cijferlijsten.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel30
  - number: '31.1'
    text: |-
      Het College voor examens reikt aan de kandidaat die deelstaatsexamen heeft afgelegd, een cijferlijst uit waarop
      zijn vermeld, voor zover van toepassing:
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel31
  - number: 31.1.a
    text: de cijfers voor het college-examen en het centraal examen,
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel31
  - number: 31.1.b
    text: het vak of de vakken en het onderwerp of de titel van het profielwerkstuk,
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel31
  - number: 31.1.c
    text: het thema van het sectorwerkstuk, alsmede de beoordeling van het sectorwerkstuk, en
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel31
  - number: 31.1.d
    text: de eindcijfers voor de examenvakken
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel31
  - number: '31.2'
    text: |-
      Het College voor examens reikt aan de in het eerste lid bedoelde kandidaat, alsmede aan de kandidaat aan wie
      op grond van de definitieve uitslag niet op grond van [artikel 30, derde lid][ref1], een diploma kan worden
      uitgereikt, een certificaat uit, waarop zijn vermeld, voor zover van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel30
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '30'
        hoofdstuk: IV
  - number: 31.2.a
    text: het vak of de vakken waarvoor de kandidaat een eindcijfer 6 of meer heeft behaald, en
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel31
  - number: 31.2.b
    text: |-
      het vak of de vakken, het onderwerp of de titel van het profielwerkstuk of het thema van het sectorwerkstuk,
      alsmede de beoordeling van het sectorwerkstuk, voor zover beoordeeld met «goed» of «voldoende».
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel31
  - number: '31.3'
    text: Onze Minister stelt het model van het certificaat en de cijferlijst vast.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel31
  - number: '31.4'
    text: Het College voor examens tekent de certificaten.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel31
  - number: '32.1'
    text: Duplicaten van afgegeven diploma's, certificaten, bewijzen van ontheffing en cijferlijsten worden niet verstrekt.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel32
  - number: '32.2'
    text: |-
      Een schriftelijke verklaring dat een in het eerste lid bedoeld document is afgegeven, welke verklaring dezelfde
      waarde heeft als dat document zelf, kan uitsluitend door of vanwege Onze Minister worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel32
  - number: '33.1'
    text: |-
      Het College voor examens kan toestaan dat een gehandicapte kandidaat het examen geheel of gedeeltelijk aflegt op
      een wijze die is aangepast aan de mogelijkheden van die kandidaat. In dat geval bepaalt het College voor examens de
      wijze waarop het examen zal worden afgelegd.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel33
  - number: '33.2'
    text: |-
      Tenzij sprake is van een objectief waarneembare lichamelijke handicap, geldt ten aanzien van de in het eerste lid
      bedoelde aangepaste wijze van examineren dat:
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel33
  - number: 33.2.a
    text: een deskundigenverklaring voorligt die door een ter zake deskundige psycholoog of orthopedagoog is opgesteld,
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel33
  - number: 33.2.b
    text: |-
      de aanpassing voor zover betrekking hebbend op het centraal examen in ieder geval kan bestaan uit een verlenging
      van de duur van de desbetreffende toets van het centraal examen met een door het College voor examens noodzakelijk
      geoordeelde periode, en
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel33
  - number: 33.2.c
    text: |-
      een andere aanpassing slechts kan worden toegestaan voor zover daartoe in de onder a genoemde deskundigenverklaring
      ten aanzien van betrokkene een voorstel wordt gedaan dan wel indien de aanpassing aantoonbaar aansluit bij de
      begeleidingsadviezen, vermeld in die deskundigenverklaring.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel33
  - number: '33.3'
    text: |-
      Het College voor examens kan ten aanzien van een kandidaat die de Nederlandse taal onvoldoende beheerst, afwijken
      van de bij of krachtens dit besluit vastgestelde voorschriften, indien de kandidaat met inbegrip van het jaar
      waarin hij staatsexamen of deelstaatsexamen aflegt, ten hoogste zes jaren onderwijs in Nederland heeft gevolgd en
      niet het Nederlands als moedertaal heeft. De in de eerste volzin bedoelde afwijking kan betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel33
  - number: 33.3.a
    text: het vak Nederlandse taal en literatuur;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel33
  - number: 33.3.b
    text: enig ander vak waarbij het gebruik van de Nederlandse taal van overwegende betekenis is.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel33
  - number: '33.4'
    text: |-
      De in het derde lid bedoelde afwijking bestaat ten aanzien van het centraal examen uitsluitend uit een verlenging
      van de duur van de desbetreffende toets met een door het College voor examens noodzakelijk geoordeelde periode, en
      het verlenen van toestemming tot het gebruik van een verklarend woordenboek der Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel33
  - number: '33.5'
    text: |-
      Van elke afwijking op grond van het eerste en derde lid wordt mededeling gedaan aan de inspectie, in de vorm van
      een totaaloverzicht van afwijkingen per tijdvak.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel33
  - number: '34.1'
    text: |-
      Zo spoedig mogelijk na de vaststelling van de definitieve uitslag zendt het College voor examens aan de Informatie
      Beheer Groep en aan de inspectie een lijst die voor iedere kandidaat die niet is geslaagd voor het staatsexamen,
      vermeldt, voor zover van toepassing:
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel34
  - number: 34.1.a
    text: de vakken waarin examen is afgelegd;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel34
  - number: 34.1.b
    text: de cijfers van het college-examen;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel34
  - number: 34.1.c
    text: het vak of de vakken waarop het profielwerkstuk betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel34
  - number: 34.1.d
    text: de beoordeling van het sectorwerkstuk, alsmede het thema van het sectorwerkstuk;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel34
  - number: 34.1.e
    text: de cijfers van het centraal examen;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel34
  - number: 34.1.f
    text: de eindcijfers;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel34
  - number: 34.1.g
    text: de uitslag van het staatsexamen.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel34
  - number: '34.2'
    text: |-
      Zo spoedig mogelijk na de vaststelling van de definitieve uitslag zendt het College voor examens aan de Informatie
      Beheer Groep en aan de inspectie een lijst die voor iedere kandidaat die is geslaagd voor het staatsexamen,
      vermeldt, voor zover van toepassing:
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel34
  - number: 34.2.a
    text: het profiel of de profielen waarop het examen betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel34
  - number: 34.2.b
    text: de vakken die zijn vermeld op de cijferlijst;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel34
  - number: 34.2.c
    text: de cijfers van het college-examen of in voorkomend geval van het schoolexamen;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel34
  - number: 34.2.d
    text: het vak of de vakken waarop het profielwerkstuk betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel34
  - number: 34.2.e
    text: de beoordeling van het sectorwerkstuk, en het thema van het sectorwerkstuk;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel34
  - number: 34.2.f
    text: de cijfers van het centraal examen;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel34
  - number: 34.2.g
    text: de eindcijfers;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel34
  - number: 34.2.h
    text: |-
      de vakken waarvoor de kandidaat vrijstelling of ontheffing is verleend, met voor zover van toepassing de cijfers
      voor de desbetreffende vakken;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel34
  - number: 34.2.i
    text: de uitslag van het staatsexamen.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel34
  - number: '34.3'
    text: |-
      Zo spoedig mogelijk na de vaststelling van de eindcijfers van de kandidaten die deelstaatsexamen hebben afgelegd,
      stuurt het College voor examens aan de Informatie Beheer Groep en aan de inspectie een lijst die voor iedere
      kandidaat vermeldt, voor zover van toepassing:
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel34
  - number: 34.3.a
    text: de vakken die zijn vermeld op de cijferlijst;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel34
  - number: 34.3.b
    text: de cijfers van het college-examen;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel34
  - number: 34.3.c
    text: het vak of de vakken waarop het profielwerkstuk betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel34
  - number: 34.3.d
    text: de beoordeling van het sectorwerkstuk, en het thema van het sectorwerkstuk;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel34
  - number: 34.3.e
    text: de cijfers van het centraal examen;
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel34
  - number: 34.3.f
    text: de eindcijfers.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel34
  - number: '35.1'
    text: |-
      Het schriftelijke werk van de kandidaten wordt gedurende ten minste zes maanden na afloop van het examen bewaard
      op een door het College voor examens te bepalen wijze. Een kandidaat die voor een vak centraal examen aflegt met
      geheime opgaven kan omtrent zijn werk gedurende genoemde periode van zes maanden inlichtingen inwinnen bij het
      College voor examens. Elk der overige kandidaten kan gedurende die periode zijn schriftelijk werk inzien.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel35
  - number: '35.2'
    text: |-
      Een door het College voor examens ondertekend exemplaar van de lijst, bedoeld in
      [artikel 34, eerste, tweede en derde lid][ref1], en de door de kandidaat overgelegde documenten, worden gedurende
      ten minste zes maanden na de vaststelling van de uitslag in het archief van het College voor examens bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0011538#Artikel34
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0011538
        artikel: '34'
        hoofdstuk: V
  - number: '35.3'
    text: |-
      Het College voor examens draagt er zorg voor dat een volledig stel van de bij de centrale examens gebruikte opgaven
      gedurende ten minste zes maanden na de vaststelling van de uitslag bewaard blijft in het archief van het College
      voor examens.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel35
  - number: '36'
    text: |-
      Het College voor examens kan bij of krachtens dit besluit vastgestelde voorschriften buiten toepassing laten of
      daarvan afwijken voor zover toepassing gelet op de bijzondere functie van het staatsexamen mede voor kandidaten die
      in bijzondere omstandigheden verkeren, zal leiden tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel36
  - number: '44.1'
    text: |-
      Dit besluit treedt met uitzondering van de [artikelen 37](onbekend), [39](onbekend), [40](onbekend) wat het
      [Eindexamenbesluit v.w.o.-h.a.v.o.-m.a.v.o.-v.b.o.][ref1] betreft, en [41, tweede lid][ref2], in werking met ingang
      van de dag na de datum van uitgifte van het Staatsblad waarin het besluit wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0004593
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel41
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0004593
      - id: ref2
        bwb_id: BWBR0011538
        artikel: '41'
        hoofdstuk: VI
  - number: '44.2'
    text: |-
      De [artikelen 37](onbekend), [39](onbekend), [40](onbekend) wat het
      [Eindexamenbesluit v.w.o.-h.a.v.o.-m.a.v.o.-v.b.o.][ref1] betreft, en [41, tweede lid][ref2], treden in werking
      op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende onderdelen verschillend kan worden
      vastgesteld, met dien verstande dat [artikel 39][ref3] terugwerkt tot en met 1 augustus 1998. Laatstbedoeld besluit
      wordt niet genomen voordat vier weken zijn verstreken nadat het onderhavige besluit is overgelegd aan beide kamers
      der Staten-Generaal en gedurende die termijn niet door of namens een van beide kamers de wens wordt te kennen
      gegeven dat het in die artikelen geregelde onderwerp bij de wet wordt geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004593
      [ref2]: https://wetten.overheid.nl/BWBR0011538#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0011538#Artikel39
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0004593
      - id: ref2
        bwb_id: BWBR0011538
        artikel: '41'
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0011538
        artikel: '39'
        hoofdstuk: VI
  - number: '45'
    text: 'Dit besluit wordt aangehaald als: Besluit staatsexamens vwo-havo-mavo 2000.'
    url: https://wetten.overheid.nl/BWBR0011538/2009-10-01#Artikel45
