  - number: A2
    text: |-
      Het bepaalde in de overige artikelen van dit besluit is niet van toepassing ten aanzien van de belanghebbende
      wiens betrekking op zijn verzoek op 31 juli 1985 wordt beëindigd en die aansluitend wordt belast met een
      functie waarbij een maximumschaal behoort die lager is dan het maximumsalaris dat behoort bij de functie
      die hem op grond van het bepaalde in [artikel B1][ref1] zou kunnen worden toebedeeld. De belanghebbende
      wordt in dat geval voor de toepassing van het bepaalde in de [hoofdstukken I-P][ref2], [I-Q][ref3] of
      [I-R van het Rechtspositiebesluit onderwijspersoneel][ref4] aangemerkt als een belanghebbende die met ingang van 1
      augustus 1985 in dienst treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0003808#ArtikelB1
