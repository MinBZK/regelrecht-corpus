  - number: B6
    text: |-
      Voor de belanghebbende die op 31 juli 1985 belast is met de waarneming van een wegens ziekte of anderszins afwezige
      hoofd of onderwijzer en op 1 augustus 1985 belast is met de waarneming van een wegens ziekte of anderszins afwezige
      directeur of leraar en wiens ambtelijk inkomen op 31 juli 1985 anders dan uitsluitend door wijziging van zijn
      taakomvang hoger is dan het ambtelijk inkomen zonder de waarneming, wordt tevens een inpassing toegepast als
      bedoeld in [artikel B3][ref1] met inbegrip van de hem op 31 juli 1985 toegekende toelage, bedoeld in artikel I-Q35
      van het Rechtspositiebesluit KO/LO.


      [ref1]: https://wetten.overheid.nl/BWBR0003808#ArtikelB3
    url: https://wetten.overheid.nl/BWBR0003808/1985-08-01#ArtikelB6
