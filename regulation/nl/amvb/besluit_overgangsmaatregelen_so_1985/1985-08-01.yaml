        artikel: B3
        hoofdstuk: B
  - number: C1
    text: |-
      1 Met inachtneming van het bepaalde in [artikel C3][ref1] en de [artikelen V-P1][ref2], [ V-Q301][ref3],
      [V-Q302][ref4] en [V-R301 van het Rechtspositiebesluit onderwijspersoneel][ref5] wordt voor de belanghebbende
      een uitzicht op salarisvaststelling na 31 juli 1985 vastgesteld volgens het schaalsalaris dat voor hem op 1
      augustus 2000 zou hebben gegolden in de functie die hij op 31 juli 1985 vervulde volgens de bepalingen van het
      Rechtspositiebesluit KO/LO, voor zover dat schaalsalaris hoger zou zijn dan het hoogste bedrag in schaal 10.

      2 Met de belanghebbende bedoeld in het eerste lid wordt, voor zover het bepaalde in [artikel C5][ref6] zulks
      aangeeft, gelijkgesteld degene die op 31 juli 1985 een ontslaguitkering genoot.

      3 Indien de belanghebbende op 31 juli 1985 aanspraak had op:

      a. een verhoging van het salaris als bedoeld in de artikelen I-Q6a, I-Q10, I-Q11, I-Q14, I-Q15, tweede lid, en I-
      Q16 van het Rechtspositiebesluit KO/LO:

      b. een toelage als bedoeld in de artikelen I-Q19 en I-Q20 van het Rechtspositiebesluit KO/LO,

      wordt het volgens het eerste lid vastgestelde schaalsalaris verhoogd met evenbedoelde toelage of verhogingen.

      4 Indien het hoofd van de b.u.o.-school op 31 juli 1985 in het genot was van een toelage als bedoeld in artikel I-
      Q18 van het Rechtspositiebesluit KO/LO en hij op die datum:

      a. 47 jaar of ouder is wordt het volgens het eerste lid vastgestelde schaalsalaris eventueel verhoogd ingevolge het
      bepaalde in het derde lid, verhoogd met het bedrag van evenbedoelde toelage;

      b. 46 jaar is wordt het volgens het eerste lid vastgestelde schaalsalaris eventueel verhoogd ingevolge het bepaalde
      in het derde lid, verhoogd met de helft van het bedrag van evenbedoelde toelage.

      5 Indien de belanghebbende op 31 juli 1985 aanspraak had op een verhoging van het salaris als bedoeld in artikel
      I-Q12 dan wel artikel I-Q17 van het Rechtspositiebesluit KO/LO wordt het volgens het eerste lid vastgestelde
      schaalsalaris eventueel verhoogd ingevolge het bepaalde in het derde en vierde lid, verhoogd met evenbedoelde
      verhoging van het salaris.

      6 Het in het eerste lid bedoelde uitzicht wordt uitgedrukt in het nummer van de schaal en het salarisnummer binnen
      die schaal waarbij het bedrag, waarop uitzicht wordt gegeven, is vermeld.

      7 Het in het zesde lid bedoelde bedrag is een schaalsalaris, dat zo dicht mogelijk ligt bij het ingevolge dit
      hoofdstuk vast te stellen bedrag bij een normbetrekking per 31 juli 1985, in de laagste schaal waarvan het maximum
      gelijk is aan of hoger dan het bedrag waarop uitzicht wordt gegeven; indien het laatstbedoelde bedrag op gelijke
      afstand ligt tot twee bedragen in de laagste schaal, wordt het schaalsalaris vastgesteld op het naasthogere bedrag.


