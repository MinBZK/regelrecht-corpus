preamble:
  text: |-
    Wij Beatrix, bij de gratie gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Onderwijs en Wetenschappen van 6 februari 1985, nr. 149.398, Directie
    Arbeidsvoorwaardenbeleid, gedaan mede namens Onze Minister van Binnenlandse Zaken;

    Gelet op artikel 28, tweede lid, van de Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs
    (Stb. 1982, 730);

    De Raad van State gehoord, advies van 21 maart 1985, nr. W05.85.0085/12.5.11;

    Gezien het nader rapport van Onze Minister van Onderwijs en Wetenschappen van 5 juni 1985, nr. 149.732, Directie
    Arbeidsvoorwaardenbeleid, uitgebracht mede namens Onze Minister van Binnenlandse Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003808/1985-08-01#ArtikelAanhef
articles:
  - number: A1
    text: |-
      1 In dit besluit zijn de begripsbepalingen van het [Rechtspositiebesluit onderwijspersoneel][ref1] (*Stb.* 1985,
      110) van toepassing.

      2 In dit besluit wordt verstaan onder:

      a. Wet: de [Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs][ref2] (*Stb.* 1982, 730);

      b. school: een school als bedoeld in de Wet, welke voor 1 augustus 1985 een b.u.o.-school was;

      c. Rechtspositiebesluit KO/LO: het Rechtspositiebesluit KO/LO (*Stb.* 1978, 228) zoals dat luidde op 31 juli 1985;

      d. Besluit: het Besluit buitengewoon onderwijs 1967 (*Stb.* 1978, 582) zoals dat luidde op 31 juli 1985;

      e. b.u.o.-school: een school als bedoeld in artikel 2, eerste en derde lid van het Besluit;

      f. belanghebbende: degene die op 31 juli 1985 in dienst was als hoofd, onderwijzer of vakonderwijzer van een
      b.u.o.-school en op 1 augustus 1985 in dienst is van een school;

      g. schaalsalaris: een bedrag in een schaal dat behoort bij een normbetrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0003771
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0003808/1985-08-01#ArtikelA1
