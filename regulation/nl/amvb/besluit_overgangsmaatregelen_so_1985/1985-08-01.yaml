  - number: C4
    text: |-
      1 De belanghebbende ontvangt binnen twee jaar na 1 augustus 1985, doch uiterlijk op de datum waarop hij wordt
      ontslagen, een door het bevoegd gezag opgestelde en door Onze minister gewaarmerkte verklaring waarin het volgens
      dit hoofdstuk vastgestelde uitzicht gedetailleerd is aangegeven. De hier bedoelde verklaring wordt slechts eenmaal
      verstrekt.

      2 Aan de belanghebbende die op 31 juli 1985 in dienst was als:

      a. onderwijzer;

      b. adjunct-hoofd;

      c. onderwijzer, belast met de leiding van de afdeling voor voortgezet buitengewoon onderwijs;

      d. vakonderwijzer:

      wordt een verklaring als bedoeld in het eerste lid verstrekt waarin is vastgelegd het uitzicht op grond van het
      bepaalde in [artikel C1, eerste en derde lid, onderdeel a][ref1].

      3 Aan de in het tweede lid onder *b* of *c* bedoelde belanghebbende wordt tevens een verklaring verstrekt waarin is
      vastgesteld het uitzicht op grond van het bepaalde in [artikel C1, eerste en derde lid, onderdeel a en b][ref2].

      4 Aan de in het tweede lid onder *a, b* of *c* bedoelde belanghebbende wordt tevens een verklaring verstrekt waarin
      is vastgelegd het uitzicht op grond van het bepaalde in [artikel C1, vijfde lid][ref3].

      5 Aan de belanghebbende die op 31 juli 1985 hoofd was van de b.u.o.-school en op 1 augustus 1985 directeur is van
      de school wordt een verklaring verstrekt waarin is vastgelegd het uitzicht op grond van het bepaalde in artikel C1,
      eerste lid, derde lid onderdeel a en vierde lid.

      6 Aan de in het vijfde lid bedoelde belanghebbende wordt tevens een verklaring verstrekt waarin is vastgelegd het
      uitzicht op grond van het bepaalde in artikel C1, vijfde lid.

      7 De belanghebbende die op 1 augustus 1985 in dienst is van een ander bevoegd gezag dan op 31 juli 1985, ontvangt
      de in het eerste lid bedoelde verklaring van het bevoegd gezag waarbij hij op 31 juli 1985 in dienst was.


