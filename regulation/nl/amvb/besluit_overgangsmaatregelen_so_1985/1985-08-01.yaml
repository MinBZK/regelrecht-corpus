  - number: B5
    text: |-
      1 Voor de belanghebbende voor wie op 31 juli 1985 bij één b.u.o.-school een salaris wordt vastgesteld dat is
      berekend aan de hand van verschillende schalen of verschillende verhoogde schaalsalarissen bij een normbetrekking
      als bedoeld in [artikel B3, tweede lid][ref1], wordt een weektaakomvang per 1 augustus 1985 vastgesteld
      overeenkomstig het bepaalde in [artikel B2][ref2] voor het totaal van het aantal uren waarnaar zijn salaris op 31
      juli 1985 werd berekend.

      2 Voor de vaststelling van het salaris bij een normbetrekking, bedoeld in [artikel B3, tweede lid][ref3],
      wordt voor de in het eerste lid bedoelde belanghebbende het totaal van het salaris op 31 juli 1985 omgerekend
      naar een bedrag bij een normbetrekking door vermenigvuldiging met 26 en deling door het totaal van het aantal
      uren dat op 31 juli 1985 voor de berekening van zijn salaris in aanmerking werd genomen; het bepaalde in
      [artikel B3, eerste, derde en vierde lid][ref4], is van overeenkomstige toepassing.


