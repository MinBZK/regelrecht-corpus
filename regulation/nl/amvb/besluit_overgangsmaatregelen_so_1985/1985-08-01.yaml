  - number: A3
    text: |-
      De aan de hand van dit besluit uit te voeren berekeningen geschieden op basis van het loonpeil dat geldt op 31
      juli 1985.
    url: https://wetten.overheid.nl/BWBR0003808/1985-08-01#ArtikelA3
  - number: A4
    text: |-
      Indien de belanghebbende op 31 juli 1985 verlof genoot volgens het bepaalde in een of meer van de hoofdstukken I-
      C, I-D of I-E dan wel een taakvermindering als bedoeld in hoofdstuk I-U van het Rechtspositiebesluit KO/LO wordt
      uitsluitend voor de toepassing van dit besluit dit verlof of deze taakvermindering alsmede de daarmee eventueel
      samenhangende vermindering van de bezoldiging buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0003808/1985-08-01#ArtikelA4
  - number: A5
    text: |-
      Ten aanzien van de belanghebbende op wiens bezoldiging op 31 juli 1985 in verband met andere door hem genoten
      inkomsten een anticumulatie als bedoeld in het Rechtspositiebesluit KO/LO werd toegepast, wordt die anticumulatie
      voor de toepassing van het bepaalde in dit besluit buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0003808/1985-08-01#ArtikelA5
  - number: B1
    text: |-
      1 Aan de belanghebbende die op 31 juli 1985 in dienst is van een b.u.o.-school en vanaf 1 augustus 1985 in dienst
      blijft van de school wordt met ingang van 1 augustus 1985 een functie toegekend volgens de bepalingen in de
      volgende leden.

      2 Als directeur wordt benoemd degene die op 31 juli 1985 hoofd was van de b.u.o.-school.

      3 Als adjunct-directeur wordt benoemd de leraar die:

      a. op 31 juli 1985 adjunct-hoofd was van de b.u.o.-school en in het genot was van de toelage bedoeld in artikel I-
      Q19 van het Rechtspositiebesluit KO/LO;

      b. op 31 juli 1985 belast was met de leiding van de afdeling voor voortgezet buitengewoon onderwijs en in het genot
      was van de toelage bedoeld in artikel I-Q20 van het Rechtspositiebesluit KO/LO.

      4 Als leraar wordt benoemd de belanghebbende voor wie het bepaalde in het tweede lid en in het derde lid niet van
      toepassing is en die op 31 juli 1985 onderwijzer of vakonderwijzer was aan de b.u.o.-school.

      5 Dit artikel is niet van toepassing op de belanghebbende voor zover hij op 31 juli 1985 is belast met de
      waarneming, bedoeld in artikel I-Q35 van het Rechtspositiebesluit KO/LO, van een afwezige belanghebbende.
    url: https://wetten.overheid.nl/BWBR0003808/1985-08-01#ArtikelB1
  - number: B2
    text: |-
      1 De weektaakomvang met ingang van 1 augustus 1985 bedraagt 40 uur voor de belanghebbende die op 31 juli 1985 een
      salaris ontving dat werd berekend naar een normbetrekking.

      2 De weektaakomvang met ingang van 1 augustus 1985 van de belanghebbende die op 31 juli 1985 niet in een
      normbetrekking als bedoeld in het Rechtspositiebesluit KO/LO was aangesteld wordt vastgesteld als volgt:

      a. indien de aanstelling vóór 1 augustus 1985 was uitgedrukt in een aantal uren: het getal voor de letter x in de
      breuk genoemd in artikel I-Q30 van het Rechtspositiebesluit KO/LO;

      b. indien de aanstelling vóór 1 augustus 1985 was uitgedrukt in een aantal schooltijden: het totaal van het
      aantal uren gedurende welke leerlingen in de school aanwezig zijn voor onderwijs gedurende de schooltijden
      waarin de belanghebbende dienst verricht als getal voor de letter x in de breuk genoemd in artikel I-Q30 van het
      Rechtspositiebesluit KO/LO;

      een en ander vermenigvuldigd met 40/26. De uitkomst van de berekening wordt rekenkundig afgerond op veelvouden van
      een kwartier.

      3 Het bepaalde in het eerste en het tweede lid is niet van toepassing indien voor de belanghebbende:

      a. op grond van de formatie-regeling zoals die op 31 juli 1985 luidde met ingang van 1 augustus 1985 een
      weektaakomvang zou moeten worden vastgesteld die kleiner is dan op 31 juli 1985 voor hem gold, in welk geval de
      nieuwe weektaakomvang overeenkomstig het bepaalde in het tweede lid wordt omgerekend naar een weektaakomvang per 1
      augustus 1985;

      b. Op grond van de formatie-regeling zoals die op 1 augustus 1985 luidt een grotere weektaakomvang kan worden
      toegekend dan na toepassing van het bepaalde in de tweede lid voor hem is berekend, in welk geval de weektaakomvang
      met ingang van 1 augustus 1985 wordt bepaald op die welke voor hem beschikbaar is.

      Onder formatie-regeling, bedoeld onder *a*, worden mede begrepen de regelingen ten behoeve van taakrealisatie
      schoolleiding, onderwijsstimulering en culturele minderheden.
    url: https://wetten.overheid.nl/BWBR0003808/1985-08-01#ArtikelB2
  - number: B3
    text: |-
      1 Voor de belanghebbende wordt op 1 augustus 1985 een schaalsalaris vastgesteld in het carrièrepatroon
      van de functie waarin hij wordt benoemd volgens het bepaalde in [hoofdstuk I-Q][ref1] dan wel
      [hoofdstuk I-R van het Rechtspositiebesluit onderwijspersoneel][ref2], dat zo dicht mogelijk ligt bij en ten minste
      gelijk is aan het salaris bij een normbetrekking dat voor hem op 31 juli 1985 gold.

      2 Het salaris bij een normbetrekking, bedoeld in het eerste lid, wordt berekend aan de hand van:

      a. het feitelijke salaris volgens de schaal die voor de belanghebbende op 31 juli 1985 voor de salarisberekening in
      aanmerking werd genomen, in voorkomend geval verhoogd met:

      b. de salarisverhoging bedoeld in de artikelen I-Q6*a*, I-Q10, I-Q11, I-Q12, I-Q14, I-Q15, tweede lid, I-Q16 en I-
      Q17 van het Rechtspositiebesluit KO/LO;

      c. de toelage bedoeld in de artikelen I-Q18, I-Q19 en I-Q20 van het Rechtspositiebesluit KO/LO.

      Het bedrag van het feitelijke salaris bedoeld onder *a* eventueel verhoogd met de salarisverhogingen bedoeld
      onder *b* en de toelagen bedoeld onder *c* wordt zonodig omgerekend naar een bedrag bij een normbetrekking door
      vermenigvuldiging met 26/x, waarbij x is het voor de belanghebbende op 31 juli 1985 geldende getal voor de letter
      x in de breuk genoemd in artikel I-Q30 van het Rechtspositiebesluit KO/LO, waarna de aldus verkregen uitkomst nog
      wordt verhoogd met de toelage bedoeld in artikel I-U7 van het Rechtspositiebesluit KO/LO indien de belanghebbende
      op 31 juli 1985 daarop aanspraak had.

      3 Indien het salaris van een belanghebbende bij een normbetrekking op 31 juli 1985, berekend volgens het bepaalde
      in het tweede lid, hoger is dan het maximum van de bij zijn functie behorende maximumschaal per 1 augustus 1985,
      geschiedt de inpassing op een schaalsalaris dat zo dicht mogelijk ligt bij en ten minste gelijk is aan zijn salaris
      bij een normbetrekking op 31 juli 1985 en wel in de laagste schaal waarvan het maximum gelijk is aan of hoger is
      dan dat salaris bij een normbetrekking.

      4 Voor de toepassing van het bepaalde in
      [artikel I-R106, tweede lid van het Rechtspositiebesluit onderwijspersoneel][ref3] wordt de belanghebbende,
      wiens schaalsalaris aan de hand van dit hoofdstuk wordt vastgesteld in de laagste bij zijn functie behorende
      aanloopschaal, geacht op 1 augustus 1985 in dienst te zijn getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0003771#HoofdstukI-Q
      [ref2]: https://wetten.overheid.nl/BWBR0003771#HoofdstukI-R
      [ref3]: https://wetten.overheid.nl/BWBR0003771#ArtikelI-R106
