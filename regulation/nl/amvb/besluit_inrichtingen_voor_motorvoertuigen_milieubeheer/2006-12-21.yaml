preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 18 augustus 1999,
    nr. MJZ99202487, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Gelet op richtlijn nr. 91/689/EEG van de Raad van de Europese Gemeenschappen van 12 december 1991 betreffende
    gevaarlijke afvalstoffen (PbEG L 377), richtlijn nr. 91/271/EEG van de Raad van de Europese Gemeenschappen van 21
    mei 1991 betreffende stedelijk afvalwater (PbEG L 135) en de artikelen 8.40, 8.41 en 8.42 van de Wet milieubeheer;

    De Raad van State gehoord (advies van 24 januari 2000, nr. W08.99.0447/V);

    Gezien het nader rapport van de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 6 juni
    2000, nr. MJZ2000057599, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel1
  - number: 1.a
    text: |-
      bevoegd gezag: het bestuursorgaan dat bevoegd zou zijn vergunning te verlenen voor een inrichting als bedoeld in
      [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011409#Artikel2
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011409
        artikel: '2'
  - number: 1.b
    text: |-
      vergunning: vergunning krachtens [artikel 8.1 van de Wet milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 1.c
    text: 'bijlage: de bij dit besluit behorende bijlage;'
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel1
  - number: 1.d
    text: |-
      stankgevoelig object: woning, school, ziekenhuis, bejaardencentrum, hotel, restaurant of recreatie-inrichting,
      voedings- en genotmiddelenindustrie, detailhandel in voedings- en genotmiddelen, kantoorgebouw met meer dan 50
      werknemers of opslag van voedings- en genotmiddelen;
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel1
  - number: 1.e
    text: |-
      motorvoertuigen: alle gemotoriseerde voertuigen, behalve bromfietsen en invalidevoertuigen, bestemd om anders dan
      over spoor te worden voortbewogen;
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel1
  - number: 1.f
    text: |-
      woning: gebouw of gedeelte van een gebouw dat voor bewoning wordt gebruikt of daartoe is bestemd, met uitzondering
      van een dienst- of bedrijfswoning:
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel1
  - number: 1.f.1°
    text: |-
      behorende bij een inrichting als bedoeld in [artikel 2][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0011409#Artikel2
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011409
        artikel: '2'
  - number: 1.f.2°
    text: |-
      die op een bedrijventerrein is gelegen met een gemiddelde dichtheid aan dienst- of bedrijfswoningen van ten hoogste
      één per hectare;
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel1
  - number: 1.g
    text: |-
      vuurwerk: vuurwerk in de zin van het [Vuurwerkbesluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013360
  - number: 1.h
    text: |-
      langtijdgemiddeld beoordelingsniveau (LAr, LT): het gemiddelde van de afwisselende niveaus van het ter plaatse
      optredende geluid, gemeten in de loop van een bepaalde periode en vastgesteld en beoordeeld overeenkomstig de
      «Handleiding meten en rekenen industrielawaai», uitgave 1999;
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel1
  - number: 1.i
    text: |-
      geluidgevoelige bestemmingen: gebouwen of objecten, aangewezen krachtens de [artikelen 49][ref1] en
      [68 van de Wet geluidhinder][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel68
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '49'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '68'
  - number: 1.j
    text: |-
      geluidniveau: het niveau van het ter plaatse optredende geluid, uitgedrukt in dB(A), overeenkomstig de door de
      Internationale Electrotechnische Commissie (IEC) opgestelde regels, zoals neergelegd in de IEC-publicatie nr. 651,
      uitgave 1979;
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel1
  - number: 1.k
    text: 'piekniveau (LAmax): maximaal geluidniveau gemeten in de meterstand« F» of «fast»;'
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel1
  - number: 1.l
    text: |-
      autowrak: motorvoertuig op meer dan twee wielen dat een afvalstof is in de zin van
      [artikel 1.1, eerste lid, van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: '2.1'
    text: |-
      Dit besluit is van toepassing op inrichtingen die uitsluitend of in hoofdzaak bestemd zijn voor het onderhouden,
      repareren, behandelen van de oppervlakte, keuren, reinigen van carrosserie en bekleding, verhandelen, verhuren,
      stallen of proefdraaien van motorvoertuigen, caravans, landbouwwerktuigen, aanhangwagens of opleggers.
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel2
  - number: '2.2'
    text: |-
      Indien een gedeelte van een inrichting als bedoeld in het eerste lid is ingericht als tankstation voor het
      wegverkeer type B als bedoeld in het [Besluit tankstations milieubeheer][ref1], met uitzondering van toepassing
      van [artikel 1, onder c, onderdeel 1°, van het Besluit tankstations milieubeheer][ref2], geldt voor dat gedeelte
      uitsluitend het [Besluit tankstations milieubeheer][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006423
      [ref2]: https://wetten.overheid.nl/BWBR0006423#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0006423
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006423
      - id: ref2
        bwb_id: BWBR0006423
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0006423
  - number: '3'
    text: |-
      Dit besluit is niet van toepassing op een inrichting als bedoeld in [artikel 2][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011409#Artikel2
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011409
        artikel: '2'
  - number: 3.a
    text: |-
      in de inrichting of een onderdeel daarvan één of meer stooktoestellen voor verwarming of warmtekrachtopwekking
      aanwezig zijn met een thermisch vermogen per toestel van 7 500 kW of meer;
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel3
  - number: 3.b
    text: |-
      in de inrichting of een onderdeel daarvan één of meer installaties of voorzieningen, met uitzondering van een
      smidse, aanwezig zijn, die kunnen worden gebruikt voor het verstoken of verbranden van andere brandstoffen dan
      aardgas, propaangas, butaangas of gasolie;
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel3
  - number: 3.c
    text: |-
      het emissiepunt van een verfspuit- of antiroestbehandelingscabine is gelegen op minder dan 50 meter van een
      stankgevoelig object, met uitzondering van die situaties waarvoor onmiddellijk voorafgaand aan 1 oktober 2000
      een vergunning nog in werking en onherroepelijk was, of die situaties waarvoor onmiddellijk voorafgaand aan 1
      april 1990 een vergunning nog in werking en onherroepelijk was en waarvoor de voornoemde afstand van 50 meter is
      vervangen door een afstand van 30 meter;
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel3
  - number: 3.d
    text: de inrichting of een onderdeel daarvan is ingericht voor carrosseriebouw;
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel3
  - number: 3.e
    text: de inrichting in hoofdzaak is ingericht voor het reviseren van motoren;
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel3
  - number: 3.f
    text: de inrichting of een onderdeel daarvan is ingericht voor het afleveren van LPG of aardgas voor tractie;
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel3
  - number: 3.g
    text: |-
      de inrichting in hoofdzaak is ingericht voor het onderhouden, repareren, behandelen van de oppervlakte, keuren,
      reinigen van carrosserie en bekleding, stallen of proefdraaien van militair materieel;
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel3
  - number: 3.h
    text: de inrichting of een onderdeel daarvan is ingericht voor de opslag van vuurwerk;
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel3
  - number: 3.i
    text: |-
      de inrichting of een onderdeel daarvan is ingericht voor het opslaan van vloeibare gevaarlijke stoffen, vloeibare
      gevaarlijke afvalstoffen of brandbare vloeistoffen in tanks, tenzij sprake is van het opslaan in ondergrondse
      tanks, waarop het [Besluit opslaan in ondergrondse tanks 1998][ref1] van toepassing is, dan wel sprake is van
      opslaan van brandbare vloeistoffen in bovengrondse tanks;


      [ref1]: https://wetten.overheid.nl/BWBR0009747
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009747
  - number: 3.j
    text: de inrichting of een onderdeel daarvan is ingericht voor het inwendig reinigen van tanks en tankwagens;
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel3
  - number: 3.k
    text: |-
      de inrichting of een onderdeel daarvan is ingericht voor het opslaan van gassen of gasmengsels in tanks, tenzij
      sprake is van opslag waarop het [Besluit voorzieningen en installaties milieubeheer][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0012897
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012897
  - number: 3.l
    text: |-
      de inrichting of een onderdeel daarvan is ingericht voor het opslaan van bestrijdingsmiddelen in de zin van de
      [Bestrijdingsmiddelenwet][ref1] met een capaciteit van 400 kg of meer;


      [ref1]: https://wetten.overheid.nl/BWBR0002380
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002380
  - number: 3.m
    text: de inrichting of een onderdeel daarvan is ingericht als brandweerkazerne;
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel3
  - number: 3.n
    text: |-
      de inrichting een gemechaniseerd loonbedrijf is waarop het [Besluit landbouw milieubeheer][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0020112
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020112
  - number: '4.1'
    text: |-
      De voorschriften die zijn opgenomen in de bijlage, gelden voor een ieder die de inrichting drijft. Deze draagt er
      zorg voor dat de voorschriften worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel4
  - number: '4.2'
    text: |-
      Indien een voorschrift dat is opgenomen in de bijlage, hoofdstukken 1 tot en met 3, inhoudt dat daarbij aangegeven
      middelen ter bescherming van het milieu moeten worden toegepast, meldt degene die de inrichting drijft en die
      voornemens is andere middelen toe te passen, dit voornemen ten minste vier weken voordat hij die andere middelen
      wil toepassen aan het bevoegd gezag, onder overlegging van de in [artikel 6, twaalfde lid][ref1], bedoelde
      gegevens. Het bevoegd gezag beslist over de juistheid van een gekozen middel.


      [ref1]: https://wetten.overheid.nl/BWBR0011409#Artikel6
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011409
        artikel: '6'
  - number: '5.1'
    text: 'Het bevoegd gezag kan nadere eisen stellen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel5
  - number: 5.1.a
    text: |-
      de in de bijlage opgenomen voorschriften ten aanzien van geluid, trilling, energie, afvalstoffen, afvalwater,
      waterbesparing, lucht, verlichting en bodembescherming voorzover dat in hoofdstuk 4 van die bijlage is aangegeven,
      of
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel5
  - number: 5.1.b
    text: |-
      de aanwezigheid van brandbestrijdingsmiddelen, de veiligheid van toestellen en installaties voor gas of
      elektriciteit, de veiligheid van de opslag van stoffen, het verbruik van grondstoffen, de gevolgen van het verkeer
      van personen of goederen van en naar de inrichting, en de nadelige gevolgen voor het milieu die de inrichting kan
      veroorzaken, waarop voorschrift 1.9.1 van de bijlage betrekking heeft, indien dat bijzonder is aangewezen in het
      belang van de bescherming van het milieu.
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel5
  - number: '5.2'
    text: |-
      De nadere eisen gelden voor een ieder die de inrichting drijft. Deze draagt er zorg voor dat de nadere eisen worden
      nageleefd.
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel5
  - number: '5.3'
    text: |-
      Het bevoegd gezag kan nadere eisen wijzigen of aanvullen in het belang van de bescherming van het milieu, of
      wijzigen of intrekken indien het belang van de bescherming van het milieu zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel5
  - number: '6.1'
    text: Degene die een inrichting opricht, meldt dit ten minste vier weken voor de oprichting aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel6
  - number: '6.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot het veranderen van een inrichting en het
      veranderen van de werking daarvan. Deze melding is niet vereist, indien eerder een melding overeenkomstig het
      bepaalde in dit artikel is gedaan en door dit veranderen geen afwijking ontstaat van de bij die melding verstrekte
      gegevens.
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel6
  - number: '6.3'
    text: 'Bij de melding wordt vermeld:'
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel6
  - number: 6.3.a
    text: het adres van de inrichting,
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel6
  - number: 6.3.b
    text: |-
      de naam en het adres van degene die de inrichting opricht dan wel verandert of de werking daarvan verandert, en,
      indien dit iemand anders is, van degene die de inrichting drijft of zal drijven,
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel6
  - number: 6.3.c
    text: de aard en omvang van de activiteiten of processen in de inrichting,
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel6
  - number: 6.3.d
    text: de indeling en de uitvoering van de inrichting, en
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel6
  - number: 6.3.e
    text: |-
      het tijdstip waarop de inrichting of de verandering daarvan in werking zal worden gebracht, dan wel de verandering
      van de werking daarvan verwezenlijkt zal zijn.
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel6
  - number: '6.4'
    text: |-
      Bij de melding wordt tevens een rapport van een akoestisch onderzoek gevoegd, indien een inrichting, bestemd
      voor het onderhouden, repareren, behandelen van de oppervlakte, keuren, reinigen van carrosserie en bekleding,
      verhandelen, verhuren, stallen of proefdraaien van motorvoertuigen waarvan de massa van het ledig voertuig,
      vermeerderd met het laadvermogen, meer is dan 3 500 kg, op een afstand van minder dan 50 meter van een woning is
      gelegen.
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel6
  - number: '6.5'
    text: |-
      Uit het rapport van een akoestisch onderzoek dient op grond van verrichte geluidmetingen of geluidberekeningen
      te blijken of aan het gestelde in voorschrift 1.1.1 of 1.1.3 van de bijlage kan worden voldaan, en in het rapport
      wordt aangegeven welke de hiertoe te treffen voorzieningen zijn.
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel6
  - number: '6.6'
    text: |-
      Voorzover het een melding betreft als bedoeld in het tweede lid, is het overleggen van een rapport van een
      akoestisch onderzoek alleen vereist, indien een beoogde uitbreiding of een verandering van de inrichting of het
      veranderen van de werking daarvan naar verwachting van nadelige invloed zal zijn op de geluidbelasting die door de
      inrichting wordt veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel6
  - number: '6.7'
    text: |-
      Indien bij de melding geen rapport van een akoestisch onderzoek is gevoegd, kan het bevoegd gezag besluiten dat het
      overleggen van een zodanig rapport niet is vereist, indien aannemelijk is dat het geluidniveau en de piekniveaus,
      veroorzaakt door de inrichting, niet meer bedragen dan de waarden, bedoeld in voorschrift 1.1.1 of 1.1.3 van de
      bijlage.
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel6
  - number: '6.8'
    text: |-
      Bij de melding wordt een rapport van een onderzoek naar de nulsituatie van de bodem gevoegd. Het onderzoek naar
      de nulsituatie richt zich uitsluitend op de stoffen die door de werkzaamheden ter plaatste een bedreiging voor de
      bodemkwaliteit vormen en op de plaatsen waar bodembedreigende handelingen plaatsvinden dan wel zullen plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel6
  - number: '6.9'
    text: |-
      Indien bij de melding geen rapport van een onderzoek naar de nulsituatie van de bodem is gevoegd, kan het bevoegd
      gezag besluiten dat een zodanig onderzoek niet is vereist, indien aannemelijk is dat de kans op toekomstige
      bodemverontreiniging afwezig is.
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel6
  - number: '6.10'
    text: |-
      De in het derde tot en met het vijfde lid en in het achtste lid vermelde gegevens behoeven niet te worden verstrekt
      indien degene die de inrichting drijft, deze gegevens reeds aan het bevoegd gezag heeft verschaft en het bevoegd
      gezag over die gegevens beschikt.
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel6
  - number: '6.11'
    text: |-
      Degene die de melding doet, geeft bij de melding aan welke van de ingevolge dit artikel over te leggen gegevens hij
      reeds aan het bevoegd gezag heeft verschaft.
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel6
  - number: '6.12'
    text: |-
      Bij de melding overeenkomstig [artikel 4, tweede lid][ref1], worden aan het bevoegd gezag gegevens verstrekt
      waaruit blijkt dat met de volgens die melding toe te passen andere middel en een ten minste gelijkwaardige
      bescherming voor het milieu wordt bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0011409#Artikel4
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011409
        artikel: '4'
  - number: '7.1'
    text: |-
      Voor een inrichting die op het tijdstip van inwerkingtreding van dit besluit reeds was opgericht en waarvoor
      onmiddellijk daaraan voorafgaand een vergunning in werking en onherroepelijk was, blijven de voorschriften van
      die vergunning in verbinding met de gegevens die behoren bij de aanvraag, alsmede de aanvraag voorzover die deel
      uitmaakt van de vergunning en gegevens bevat die zich lenen voor opname of omzetting in voorschriften, gelden
      als nadere eis, bedoeld in [artikel 5][ref1], behoudens eerdere wijziging of intrekking van die voorschriften,
      gedurende drie jaar na het tijdstip van van toepassing worden van dit besluit op die inrichting, mits het
      voorschrift betrekking heeft op een onderwerp dat is genoemd in [artikel 5, eerste lid, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011409#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011409#Artikel5
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011409
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0011409
        artikel: '5'
  - number: '7.2'
    text: |-
      De nadere eisen die onmiddellijk voorafgaande aan de inwerkingtreding van dit besluit golden krachtens de
      vergunning dan wel krachtens het Besluit herstelinrichtingen voor motorvoertuigen milieubeheer, blijven gelden
      als nadere eis, bedoeld in [artikel 5][ref1], na het tijdstip van de inwerkingtreding van dit besluit, mits het
      voorschrift betrekking heeft op een onderwerp dat is genoemd in [artikel 5, eerste lid, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011409#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011409#Artikel5
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011409
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0011409
        artikel: '5'
  - number: '8.1'
    text: |-
      Indien op het tijdstip waarop dit besluit in werking treedt, een inrichting reeds is opgericht en voor die
      inrichting onmiddellijk voor dat tijdstip geen vergunning in werking en onherroepelijk was of geen melding was
      gedaan krachtens het Besluit herstelinrichtingen voor motorvoertuigen milieubeheer, meldt degene die de inrichting
      drijft, aan het bevoegd gezag dat hij de inrichting in werking heeft.
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel8
  - number: '8.2'
    text: |-
      De melding geschiedt ten hoogste twaalf weken na het tijdstip waarop dit besluit in werking treedt.
      [Artikel 6, derde tot en met elfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011409#Artikel6
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011409
        artikel: '6'
  - number: '8.3'
    text: |-
      Indien op het tijdstip waarop dit besluit in werking treedt, een aanvraag om een vergunning voor het oprichten van
      de inrichting door het bevoegd gezag in behandeling is genomen en dit besluit op de inrichting van toepassing is
      of zal zijn, zijn het eerste en tweede lid niet van toepassing. De aanvraag wordt in dat geval aangemerkt als een
      melding overeenkomstig [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011409#Artikel6
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011409
        artikel: '6'
  - number: '9.1'
    text: Het Besluit herstelinrichtingen voor motorvoertuigen milieubeheer wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel9
  - number: '9.2'
    text: |-
      Na de inwerkingtreding van dit besluit berust de Regeling slibvangputten en vet- of olie-afscheiders mede op het in
      de bijlage opgenomen voorschrift 1.3.8, onder b en c.
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel9
  - number: '10'
    text: Dit besluit treedt in werking met ingang van 1 oktober 2000.
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel10
  - number: '11'
    text: 'Dit besluit wordt aangehaald als: Besluit inrichtingen voor motorvoertuigen milieubeheer.'
    url: https://wetten.overheid.nl/BWBR0011409/2006-12-21#Artikel11
