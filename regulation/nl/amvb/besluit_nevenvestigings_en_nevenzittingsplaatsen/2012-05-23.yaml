preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Justitie van 13 november 2001, nr. 5132150/01/6;

    Gelet op de artikelen 41 en 59 van de Wet op de rechterlijke organisatie;

    De Raad van State gehoord (advies van 28 november 2001, nr. W03.01.0599/I);

    Gelet op het nader rapport van de Minister van Justitie van 5 december 2001, nr. 5137099/01/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel1
  - number: 1.a
    text: 'kantonzaken: zaken die ingevolge de wet door de kantonrechter worden behandeld;'
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel1
  - number: 1.b
    text: |-
      zittingscapaciteit: de beschikbare zittingsruimte, de beschikbare capaciteit aan rechterlijke ambtenaren met
      rechtspraak belast en de beschikbare capaciteit aan gerechtsambtenaren benodigd voor de behandeling van zaken;
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel1
  - number: 1.c
    text: |-
      gespecialiseerde zittingscapaciteit: de beschikbare zittingsruimte en de beschikbare capaciteit aan rechterlijke
      ambtenaren met rechtspraak belast en aan gerechtsambtenaren die voldoen aan de specifieke kennis, deskundigheid of
      andere vereisten die nodig zijn voor de behandeling van bepaalde zaken of bepaalde categorieën van zaken.
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel1
  - number: '2'
    text: 'De nevenzittingsplaatsen van de gerechtshoven zijn:'
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel2
  - number: 2.a
    text: 'gerechtshof Amsterdam: Alkmaar, Amersfoort, Den Helder, Haarlem, Hilversum, Hoorn, Utrecht, Zaanstad;'
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel2
  - number: 2.b
    text: |-
      gerechtshof Arnhem: Almelo, Almere, Apeldoorn, Deventer, Enschede, Harderwijk, Lelystad, Nijmegen, Tiel, Zutphen,
      Zwolle;
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel2
  - number: 2.c
    text: 'gerechtshof ''s-Gravenhage: Dordrecht, Middelburg, Rotterdam;'
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel2
  - number: 2.d
    text: 'gerechtshof ''s-Hertogenbosch: Bergen op Zoom, Breda, Eindhoven, Heerlen, Maastricht, Roermond, Tilburg, Venlo;'
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel2
  - number: 2.e
    text: 'gerechtshof Leeuwarden: Assen, Groningen.'
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel2
  - number: '3'
    text: 'De nevenzittingsplaatsen van de rechtbanken zijn:'
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel3
  - number: 3.a
    text: 'rechtbank Alkmaar: Den Helder;'
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel3
  - number: 3.b
    text: 'rechtbank Arnhem: Wageningen;'
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel3
  - number: 3.c
    text: 'rechtbank Dordrecht: Gorinchem;'
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel3
  - number: 3.d
    text: 'rechtbank Groningen: Oldambt;'
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel3
  - number: 3.e
    text: 'rechtbank Leeuwarden: Súdwest Fryslân;'
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel3
  - number: 3.f
    text: 'rechtbank Roermond: Venray;'
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel3
  - number: 3.g
    text: 'rechtbank Rotterdam: Middelharnis;'
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel3
  - number: 3.h
    text: 'rechtbank Zutphen: Doetinchem, Harderwijk, Oost Gelre, Oude IJsselstreek;'
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel3
  - number: 3.i
    text: 'rechtbank Zwolle-Lelystad: Almere, Steenwijkerland.'
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel3
  - number: '4.1'
    text: |-
      De nevenzittingsplaatsen van de rechtbank te 's-Gravenhage voor beroepen, ingesteld tegen besluiten die zijn
      gegeven op grond van de [Vreemdelingenwet 2000][ref1], zijn de hoofdplaatsen van de andere arrondissementen alsmede
      Haarlemmermeer.


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: '4.2'
    text: |-
      De rechtbank te ’s-Gravenhage kan buiten de hoofdplaats van het arrondissement onderscheidenlijk buiten het
      arrondissement vreemdelingenzaken als bedoeld in [Hoofdstuk 5 van de Vreemdelingenwet 2000][ref1] behandelen in de
      nevenvestigingsplaats Alphen aan den Rijn en in de nevenzittingsplaatsen Loenen en Tilburg.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011823
        hoofdstuk: '5'
  - number: '5.1'
    text: |-
      De gerechtshoven kunnen, voor zover het betreft de meervoudige kamers of raadkamers voor strafzaken, buiten het
      ressort terechtzittingen houden in de nevenzittingsplaatsen Amsterdam, Rotterdam en Soest.
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel5
  - number: '5.2'
    text: |-
      De rechtbanken kunnen, voor zover het betreft de meervoudige kamers of raadkamers voor strafzaken, buiten het
      arrondissement terechtzittingen houden in de nevenzittingsplaatsen Amsterdam, Rotterdam en Soest.
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel5
  - number: '6.1'
    text: |-
      Zaken waarbij het personeel van het gerechtshof of het ressortsparket betrokken is, kunnen in een
      nevenzittingsplaats buiten het ressort worden behandeld. Een nevenzittingsplaats buiten het ressort is de
      hoofdplaats van een aangrenzend ressort.
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel6
  - number: '6.2'
    text: |-
      Zaken waarbij personeel van de rechtbank of het arrondissementsparket betrokken is, kunnen in een
      nevenzittingsplaats buiten het arrondissement worden behandeld. Een nevenzittingsplaats buiten het arrondissement
      is de hoofdplaats of een nevenvestigingsplaats van een aangrenzend arrondissement.
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel6
  - number: '7.1'
    text: |-
      Bij gebrek aan voldoende zittingscapaciteit of aan gespecialiseerde zittingscapaciteit in de hoofdplaats of een
      nevenzittingsplaats binnen het ressort, kan het bestuur van een gerechtshof, de Raad voor de rechtspraak verzoeken
      tijdelijk een of meer nevenzittingsplaatsen buiten het ressort aan te wijzen voor de behandeling van een zaak of
      categorieën van zaken met het oog op een snellere behandeling van die zaken.
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel7
  - number: '7.2'
    text: |-
      De tijdelijke aanwijzing van een of meer nevenzittingsplaatsen buiten het ressort als bedoeld in het eerste lid
      geldt voor ten hoogste drie jaren en kan een maal worden verlengd.
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel7
  - number: '7.3'
    text: |-
      De nevenzittingsplaatsen buiten het ressort, die op grond van het eerste lid kunnen worden aangewezen, zijn de
      hoofdplaatsen van de andere ressorten.
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel7
  - number: '7.4'
    text: De Raad wijst zo veel als mogelijk een of meer nevenzittingsplaatsen aan in een of meer aangrenzende ressorten.
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel7
  - number: '7.5'
    text: |-
      Zaken waarvoor, vanwege hun aard dan wel de feiten of omstandigheden die met die zaken samenhangen, behandeling
      binnen het rechtsgebied waarin zij zijn aangebracht is aangewezen, worden zo veel als mogelijk binnen het
      rechtsgebied behandeld.
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel7
  - number: '7.6'
    text: |-
      Indien de aanwijzing betrekking heeft op strafzaken vindt de aanwijzing niet plaats, dan nadat de Raad daarover het
      College van procureurs-generaal heeft gehoord.
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel7
  - number: '7.7'
    text: |-
      Bij het aanwijzen van een of meer nevenzittingsplaatsen buiten het ressort voor de behandeling van categorieën van
      zaken geeft de Raad aan voor welke periode de aanwijzing geldt.
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel7
  - number: '7.8'
    text: De aanwijzing wordt gepubliceerd in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel7
  - number: '7.9'
    text: |-
      Het zesde tot en met het achtste lid zijn van overeenkomstige toepassing op de verlenging van de aanwijzing als
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel7
  - number: 7a
    text: |-
      Voor de behandeling in hoger beroep van strafzaken afkomstig van de rechtbank te Utrecht is de hoofdplaats van het
      gerechtshof te Arnhem nevenzittingsplaats van het gerechtshof te Amsterdam.
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel7a
  - number: '8.1'
    text: |-
      Bij gebrek aan voldoende zittingscapaciteit of aan gespecialiseerde zittingscapaciteit in de hoofdplaats, een
      nevenvestigingsplaats of een nevenzittingsplaats binnen het arrondissement kan het bestuur van een rechtbank, de
      Raad voor de rechtspraak verzoeken tijdelijk een of meer nevenzittingsplaatsen buiten het arrondissement aan te
      wijzen voor de behandeling van een zaak of categorieën van zaken met het oog op een snellere behandeling van zaken.
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel8
  - number: '8.2'
    text: |-
      De tijdelijke aanwijzing van een of meer nevenzittingsplaatsen buiten het arrondissement als bedoeld in het eerste
      lid geldt voor ten hoogste drie jaren en kan een maal worden verlengd.
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel8
  - number: '8.3'
    text: |-
      De nevenzittingsplaatsen buiten het arrondissement, die op grond van het eerste lid kunnen worden aangewezen, zijn
      de hoofdplaatsen en nevenvestigingsplaatsen van de andere arrondissementen.
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel8
  - number: '8.4'
    text: |-
      De Raad wijst zo veel als mogelijk een of meer nevenzittingsplaatsen aan in een of meer aangrenzende
      arrondissementen.
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel8
  - number: '8.5'
    text: |-
      Zaken waarvoor, vanwege hun aard dan wel de feiten of omstandigheden die met die zaken samenhangen, behandeling
      binnen het rechtsgebied waarin zij zijn aangebracht is aangewezen, worden zo veel als mogelijk binnen het
      rechtsgebied behandeld.
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel8
  - number: '8.6'
    text: |-
      Indien de aanwijzing betrekking heeft op strafzaken vindt de aanwijzing niet plaats, dan nadat de Raad daarover het
      College van procureurs-generaal heeft gehoord.
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel8
  - number: '8.7'
    text: |-
      Bij het aanwijzen van een of meer nevenzittingsplaatsen buiten het arrondissement voor de behandeling van
      categorieën van zaken geeft de Raad aan voor welke periode de aanwijzing geldt.
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel8
  - number: '8.8'
    text: De aanwijzing wordt gepubliceerd in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel8
  - number: '8.9'
    text: |-
      Het zesde tot en met het achtste lid zijn van overeenkomstige toepassing op de verlenging van de aanwijzing als
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel8
  - number: '9.1'
    text: |-
      Bij gebrek aan voldoende gespecialiseerde zittingscapaciteit voor de werkzaamheden van de rechter-commissaris
      in strafzaken, waarin het onderzoek plaatsvindt door een niet regionaal opsporingsteam onder leiding van een
      officier van justitie van het landelijk parket, het functioneel parket, of een officier van justitie van een
      arrondissementsparket zijn Rotterdam, Amsterdam, Den Bosch, Haarlem, Den Haag, Zwolle, Arnhem of Groningen
      nevenzittingsplaats van alle rechtbanken. De nevenzittingsplaats is in die gevallen de plaats waar het onderzoek
      onder leiding van de officier van justitie wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel9
  - number: '9.2'
    text: |-
      In de nevenzittingsplaats, bedoeld in het eerste lid, kan ook het hoger beroep worden behandeld tegen de
      beschikking van de rechter-commissaris in de gevallen bij wet bepaald en kunnen ook andere beslissingen die in het
      voorbereidend onderzoek aan de rechtbank zijn opgedragen, worden genomen.
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel9
  - number: 9a.1
    text: |-
      Bij gebrek aan een volledig operationeel geïntegreerd bedrijfsprocessysteem binnen een arrondissement kan het
      bestuur van een rechtbank de Raad voor de rechtspraak verzoeken tijdelijk een of meer nevenzittingsplaatsen
      buiten het arrondissement aan te wijzen voor de behandeling van strafzaken die met een eerder uitgevaardigde
      strafbeschikking in verband staan.
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel9a
  - number: 9a.2
    text: |-
      De tijdelijke aanwijzing van een of meer nevenzittingsplaatsen buiten het arrondissement als bedoeld in het eerste
      lid geldt voor ten hoogste drie jaren en kan eenmaal worden verlengd met ten hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel9a
  - number: 9a.3
    text: |-
      De [artikelen 8, vierde, zesde tot en met negende lid][ref1], en [11][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013129#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013129#Artikel11
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0013129
        artikel: '8'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013129
        artikel: '11'
        paragraaf: '3'
  - number: '10'
    text: |-
      Zaken kunnen pas in een nevenzittingsplaats buiten het ressort onderscheidenlijk buiten het arrondissement worden
      behandeld, nadat het griffierecht is voldaan.
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel10
  - number: '11.1'
    text: |-
      De Raad voor de rechtspraak overlegt jaarlijks met het College van procureurs-generaal en met de Nederlandse Orde
      van Advocaten over de uitvoering van de [artikelen 7 tot en met 9][ref1] in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0013129#Artikel7
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013129
        artikel: '7'
        paragraaf: '3'
  - number: '11.2'
    text: |-
      De Raad voor de rechtspraak doet jaarlijks verslag van het resultaat en de wijze waarop de
      [artikelen 7 tot en met 9][ref1] zijn uitgevoerd door de Raad voor de rechtspraak en de gerechten. Daarbij besteedt
      de Raad voor de rechtspraak aandacht aan:


      [ref1]: https://wetten.overheid.nl/BWBR0013129#Artikel7
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013129
        artikel: '7'
        paragraaf: '3'
  - number: 11.2.a
    text: |-
      de op grond van [artikel 7][ref1] en [8][ref2] gegeven aanwijzingen, de redenen daarvoor, de geldingsduur,
      de verleende verlengingen, de redenen daarvoor, alsmede een oordeel over de mogelijke aard van het gebrek aan
      zittingscapaciteit of gespecialiseerde zittingscapaciteit;


      [ref1]: https://wetten.overheid.nl/BWBR0013129#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0013129#Artikel8
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013129
        artikel: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013129
        artikel: '8'
        paragraaf: '3'
  - number: 11.2.b
    text: |-
      de mate waarin bij de aanwijzing van een of meer nevenzittingsplaatsen geen uitvoering kon worden gegeven aan
      [artikelen 7, vierde en vijfde lid][ref1], en [8, vierde en vijfde lid][ref2], en de redenen daarvoor;


      [ref1]: https://wetten.overheid.nl/BWBR0013129#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0013129#Artikel8
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013129
        artikel: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013129
        artikel: '8'
        paragraaf: '3'
  - number: 11.2.c
    text: |-
      het overleg met het College van procureurs-generaal als bedoeld in [artikelen 7][ref1] en [8][ref2] en de
      resultaten daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0013129#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0013129#Artikel8
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013129
        artikel: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013129
        artikel: '8'
        paragraaf: '3'
  - number: 11.2.d
    text: |-
      het aantal en de categorieën van zaken die daadwerkelijk in een nevenzittingsplaats buiten het ressort
      onderscheidenlijk buiten het arrondissement zijn behandeld op grond van [artikelen 7 tot en met 9][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013129#Artikel7
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013129
        artikel: '7'
        paragraaf: '3'
  - number: 11.2.e
    text: |-
      de effecten van de behandeling in een nevenzittingsplaats buiten het ressort onderscheidenlijk buiten het
      arrondissement op de werkvoorraden, op de doelmatige inzet van de zittingscapaciteit en op de positie van de
      justitiabelen;
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel11
  - number: 11.2.f
    text: |-
      klachten in verband met het behandelen van zaken in een nevenzittingsplaats buiten het ressort of arrondissement en
      de wijze waarop deze zijn afgehandeld;
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel11
  - number: 11.2.g
    text: |-
      eventuele knelpunten bij de uitvoering van [artikelen 7 tot en met 10][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013129#Artikel7
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013129
        artikel: '7'
        paragraaf: '3'
  - number: 11.2.h
    text: de resultaten van het overleg bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel11
  - number: '12.1'
    text: |-
      Bij het bepalen van de plaats in een arrondissement waar een kantonzaak wordt behandeld, geldt de in de bijlage
      bij dit besluit opgenomen gebiedsindeling en zijn de regels voor de relatieve competentie van de rechtbanken van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel12
  - number: '12.2'
    text: |-
      Indien een kantonzaak in meer dan een plaats kan worden behandeld, wordt de zaak behandeld in de plaats die de
      eiser of de verzoeker in de dagvaarding onderscheidenlijk het verzoekschrift vermeldt. Indien het verzoekschrift
      niet de plaats vermeldt waar de zaak wordt behandeld, bepaalt het gerechtsbestuur in welke plaats binnen het
      arrondissement de zaak wordt behandeld.
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel12
  - number: '12.3'
    text: |-
      Behalve in een geval als bedoeld in [artikel 6, tweede lid][ref1], worden kantonzaken niet in een
      nevenzittingsplaats buiten het arrondissement behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0013129#Artikel6
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0013129
        artikel: '6'
        paragraaf: '3'
  - number: 12a.1
    text: |-
      In afwijking van [artikel 12][ref1] kan, bij gebrek aan een volledig operationeel geïntegreerd
      bedrijfsprocessensysteem binnen een arrondissement, het bestuur van een rechtbank de Raad voor de rechtspraak
      verzoeken tijdelijk een of meer nevenzittingsplaatsen buiten het arrondissement aan te wijzen voor de behandeling
      van een kantonzaak die met een eerder uitgevaardigde strafbeschikking in verband staat.


      [ref1]: https://wetten.overheid.nl/BWBR0013129#Artikel12
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0013129
        artikel: '12'
        paragraaf: '4'
  - number: 12a.2
    text: |-
      De tijdelijke aanwijzing van een of meer nevenzittingsplaatsen buiten het arrondissement als bedoeld in het eerste
      lid geldt voor ten hoogste drie jaren en kan eenmaal worden verlengd met ten hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel12a
  - number: 12a.3
    text: |-
      De [artikelen 8, vierde, zesde tot en met negende lid][ref1], en [11][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013129#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013129#Artikel11
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0013129
        artikel: '8'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013129
        artikel: '11'
        paragraaf: '3'
  - number: '13'
    text: |-
      Kantonzaken die ingevolge [artikel 12][ref1] in de na te noemen plaatsen worden behandeld, kunnen worden behandeld
      in de volgende nevenzittingsplaatsen:


      [ref1]: https://wetten.overheid.nl/BWBR0013129#Artikel12
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013129
        artikel: '12'
        paragraaf: '4'
  - number: 13.a
    text: 'Oude IJsselstreek: Doetinchem;'
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel13
  - number: 13.b
    text: 'Zwolle: Steenwijkerland;'
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel13
  - number: 13.c
    text: 'Lelystad: Almere.'
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel13
  - number: '14'
    text: Het Besluit nevenzittingsplaatsen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel14
  - number: '15'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel15
  - number: '16'
    text: 'Dit besluit wordt aangehaald als: Besluit nevenvestigings- en nevenzittingsplaatsen.'
    url: https://wetten.overheid.nl/BWBR0013129/2012-05-23#Artikel16
