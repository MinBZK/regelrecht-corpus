        hoofdstuk: '5'
  - number: '5'
    text: |-
      1 De gerechtshoven kunnen, voor zover het betreft de meervoudige kamers of raadkamers voor strafzaken, buiten het
      ressort terechtzittingen houden in de nevenzittingsplaatsen Amsterdam en Rotterdam.

      2 De rechtbanken kunnen, voor zover het betreft de meervoudige kamers of raadkamers voor strafzaken, buiten het
      arrondissement terechtzittingen houden in de nevenzittingsplaatsen Amsterdam en Rotterdam.
    url: https://wetten.overheid.nl/BWBR0013129/2004-09-01#Artikel5
  - number: '6'
    text: |-
      1 Zaken waarbij het personeel van het gerechtshof betrokken is, kunnen in een nevenzittingsplaats buiten het
      ressort worden behandeld. Een nevenzittingsplaats buiten het ressort is de hoofdplaats van een aangrenzend ressort.

      2 Zaken waarbij personeel van de rechtbank betrokken is, kunnen in een nevenzittingsplaats buiten het
      arrondissement worden behandeld. Een nevenzittingsplaats buiten het arrondissement is de hoofdplaats of een
      nevenvestigingsplaats van een aangrenzend arrondissement.
    url: https://wetten.overheid.nl/BWBR0013129/2004-09-01#Artikel6
  - number: '7'
    text: |-
      1 Bij gebrek aan voldoende zittingscapaciteit of aan gespecialiseerde zittingscapaciteit in de hoofdplaats of een
      nevenzittingsplaats binnen het ressort, kan het bestuur van een gerechtshof, de Raad voor de rechtspraak verzoeken
      tijdelijk een of meer nevenzittingsplaatsen buiten het ressort aan te wijzen voor de behandeling van een zaak of
      categorieën van zaken met het oog op een snellere behandeling van die zaken.

      2 De tijdelijke aanwijzing van een of meer nevenzittingsplaatsen buiten het ressort als bedoeld in het eerste lid
      geldt voor ten hoogste drie jaren en kan een maal worden verlengd.

      3 De nevenzittingsplaatsen buiten het ressort, die op grond van het eerste lid kunnen worden aangewezen, zijn de
      hoofdplaatsen van de andere ressorten.

      4 De Raad wijst zo veel als mogelijk een of meer nevenzittingsplaatsen aan in een of meer aangrenzende ressorten.

      5 Zaken waarvoor, vanwege hun aard dan wel de feiten of omstandigheden die met die zaken samenhangen, behandeling
      binnen het rechtsgebied waarin zij zijn aangebracht is aangewezen, worden zo veel als mogelijk binnen het
      rechtsgebied behandeld.

      6 Indien de aanwijzing betrekking heeft op strafzaken vindt de aanwijzing niet plaats, dan nadat de Raad daarover
      het College van procureurs-generaal heeft gehoord.

      7 Bij het aanwijzen van een of meer nevenzittingsplaatsen buiten het ressort voor de behandeling van categorieën
      van zaken geeft de Raad aan voor welke periode de aanwijzing geldt.

      8 De aanwijzing wordt gepubliceerd in de Staatscourant.

      9 Het zesde tot en met het achtste lid zijn van overeenkomstige toepassing op de verlenging van de aanwijzing als
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0013129/2004-09-01#Artikel7
  - number: '8'
    text: |-
      1 Bij gebrek aan voldoende zittingscapaciteit of aan gespecialiseerde zittingscapaciteit in de hoofdplaats, een
      nevenvestigingsplaats of een nevenzittingsplaats binnen het arrondissement kan het bestuur van een rechtbank, de
      Raad voor de rechtspraak verzoeken tijdelijk een of meer nevenzittingsplaatsen buiten het arrondissement aan te
      wijzen voor de behandeling van een zaak of categorieën van zaken met het oog op een snellere behandeling van zaken.

      2 De tijdelijke aanwijzing van een of meer nevenzittingsplaatsen buiten het arrondissement als bedoeld in het
      eerste lid geldt voor ten hoogste drie jaren en kan een maal worden verlengd.

      3 De nevenzittingsplaatsen buiten het arrondissement, die op grond van het eerste lid kunnen worden aangewezen,
      zijn de hoofdplaatsen en nevenvestigingsplaatsen van de andere arrondissementen.

      4 De Raad wijst zo veel als mogelijk een of meer nevenzittingsplaatsen aan in een of meer aangrenzende
      arrondissementen.

      5 Zaken waarvoor, vanwege hun aard dan wel de feiten of omstandigheden die met die zaken samenhangen, behandeling
      binnen het rechtsgebied waarin zij zijn aangebracht is aangewezen, worden zo veel als mogelijk binnen het
      rechtsgebied behandeld.

      6 Indien de aanwijzing betrekking heeft op strafzaken vindt de aanwijzing niet plaats, dan nadat de Raad daarover
      het College van procureurs-generaal heeft gehoord.

      7 Bij het aanwijzen van een of meer nevenzittingsplaatsen buiten het arrondissement voor de behandeling van
      categorieën van zaken geeft de Raad aan voor welke periode de aanwijzing geldt.

      8 De aanwijzing wordt gepubliceerd in de Staatscourant.

      9 Het zesde tot en met het achtste lid zijn van overeenkomstige toepassing op de verlenging van de aanwijzing als
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0013129/2004-09-01#Artikel8
  - number: '9'
    text: |-
      1 Bij gebrek aan voldoende gespecialiseerde zittingscapaciteit voor de werkzaamheden van de rechter-commissaris
      in strafzaken, waarin het onderzoek plaatsvindt door een niet regionaal opsporingsteam onder leiding van een
      officier van justitie van het landelijk parket, het functioneel parket, of een officier van justitie van een
      arrondissementsparket zijn Rotterdam, Amsterdam, Den Bosch, Haarlem, Den Haag, Zwolle, Arnhem of Groningen
      nevenzittingsplaats van alle rechtbanken. De nevenzittingsplaats is in die gevallen de plaats waar het onderzoek
      onder leiding van de officier van justitie wordt uitgevoerd.

      2 In de nevenzittingsplaats, bedoeld in het eerste lid, kan ook het hoger beroep worden behandeld tegen de
      beschikking van de rechter-commissaris in de gevallen bij wet bepaald en kunnen ook andere beslissingen die in het
      voorbereidend onderzoek aan de rechtbank zijn opgedragen, worden genomen.
    url: https://wetten.overheid.nl/BWBR0013129/2004-09-01#Artikel9
  - number: '10'
    text: |-
      Zaken kunnen pas in een nevenzittingsplaats buiten het ressort onderscheidenlijk buiten het arrondissement worden
      behandeld, nadat het griffierecht is voldaan.
    url: https://wetten.overheid.nl/BWBR0013129/2004-09-01#Artikel10
  - number: '11'
    text: |-
      1 De Raad voor de rechtspraak overlegt jaarlijks met het College van procureurs-generaal en met de Nederlandse Orde
      van Advocaten over de uitvoering van de [artikelen 7 tot en met 9][ref1] in de praktijk.

      2 De Raad voor de rechtspraak doet jaarlijks verslag van het resultaat en de wijze waarop de
      [artikelen 7 tot en met 9][ref2] zijn uitgevoerd door de Raad voor de rechtspraak en de gerechten. Daarbij besteedt
      de Raad voor de rechtspraak aandacht aan:

      a. de op grond van [artikel 7][ref3] en [8][ref4] gegeven aanwijzingen, de redenen daarvoor, de geldingsduur,
      de verleende verlengingen, de redenen daarvoor, alsmede een oordeel over de mogelijke aard van het gebrek aan
      zittingscapaciteit of gespecialiseerde zittingscapaciteit;

      b. de mate waarin bij de aanwijzing van een of meer nevenzittingsplaatsen geen uitvoering kon worden gegeven aan
      [artikelen 7, vierde en vijfde lid][ref5], en [8, vierde en vijfde lid][ref6], en de redenen daarvoor;

      c. het overleg met het College van procureurs-generaal als bedoeld in [artikelen 7][ref7] en [8][ref8] en de
      resultaten daarvan;

      d. het aantal en de categorieën van zaken die daadwerkelijk in een nevenzittingsplaats buiten het ressort
      onderscheidenlijk buiten het arrondissement zijn behandeld op grond van [artikelen 7 tot en met 9][ref9];

      e. de effecten van de behandeling in een nevenzittingsplaats buiten het ressort onderscheidenlijk buiten het
      arrondissement op de werkvoorraden, op de doelmatige inzet van de zittingscapaciteit en op de positie van de
      justitiabelen;

      f. klachten in verband met het behandelen van zaken in een nevenzittingsplaats buiten het ressort of arrondissement
      en de wijze waarop deze zijn afgehandeld;

      g. eventuele knelpunten bij de uitvoering van [artikelen 7 tot en met 10][ref10];

      h. de resultaten van het overleg bedoeld in het eerste lid.


