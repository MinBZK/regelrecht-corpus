preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Justitie van 13 november 2001, nr. 5132150/01/6;

    Gelet op de artikelen 41 en 59 van de Wet op de rechterlijke organisatie;

    De Raad van State gehoord (advies van 28 november 2001, nr. W03.01.0599/I);

    Gelet op het nader rapport van de Minister van Justitie van 5 december 2001, nr. 5137099/01/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0013129/2004-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. kantonzaken: zaken die ingevolge de wet door de kantonrechter worden behandeld;

      b. zittingscapaciteit: de beschikbare zittingsruimte, de beschikbare capaciteit aan rechterlijke ambtenaren met
      rechtspraak belast en de beschikbare capaciteit aan gerechtsambtenaren benodigd voor de behandeling van zaken;

      c. gespecialiseerde zittingscapaciteit: de beschikbare zittingsruimte en de beschikbare capaciteit aan rechterlijke
      ambtenaren met rechtspraak belast en aan gerechtsambtenaren die voldoen aan de specifieke kennis, deskundigheid of
      andere vereisten die nodig zijn voor de behandeling van bepaalde zaken of bepaalde categorieën van zaken.
    url: https://wetten.overheid.nl/BWBR0013129/2004-09-01#Artikel1
  - number: '2'
    text: |-
      De nevenzittingsplaatsen van de gerechtshoven zijn:

      a. gerechtshof Amsterdam: Alkmaar, Amersfoort, Den Helder, Haarlem, Hilversum, Hoorn, Utrecht, Zaanstad;

      b. gerechtshof Arnhem: Almelo, Almere, Apeldoorn, Deventer, Enschede, Harderwijk, Lelystad, Nijmegen, Tiel,
      Zutphen, Zwolle;

      c. gerechtshof 's-Gravenhage: Dordrecht, Middelburg, Rotterdam;

      d. gerechtshof 's-Hertogenbosch: Bergen op Zoom, Breda, Eindhoven, Heerlen, Maastricht, Roermond, Tilburg, Venlo;

      e. gerechtshof Leeuwarden: Assen, Groningen.
    url: https://wetten.overheid.nl/BWBR0013129/2004-09-01#Artikel2
  - number: '3'
    text: |-
      De nevenzittingsplaatsen van de rechtbanken zijn:

      a. rechtbank Alkmaar: Den Helder;

      b. rechtbank Assen: Meppel;

      c. rechtbank Dordrecht: Oud-Beijerland;

      d. rechtbank Haarlem: Haarlemmermeer;

      e. rechtbank Leeuwarden: Opsterland, Sneek;

      f. rechtbank Middelburg: Schouwen-Duiveland, Tholen;

      g. rechtbank Roermond: Venray;

      h. rechtbank Rotterdam: Middelharnis;

      i. rechtbank Zutphen: Doetinchem, Harderwijk;

      j. rechtbank Zwolle-Lelystad: Almere, Steenwijkerland.
    url: https://wetten.overheid.nl/BWBR0013129/2004-09-01#Artikel3
  - number: '4'
    text: |-
      1 De nevenzittingsplaatsen van de rechtbank te 's-Gravenhage voor beroepen, ingesteld tegen besluiten die zijn
      gegeven op grond van de [Vreemdelingenwet 2000][ref1], zijn de hoofdplaatsen van de andere arrondissementen alsmede
      Haarlemmermeer.

      2 De rechtbank te ’s-Gravenhage kan buiten de hoofdplaats van het arrondissement onderscheidenlijk buiten het
      arrondissement vreemdelingenzaken als bedoeld in [Hoofdstuk 5 van de Vreemdelingenwet 2000][ref2] behandelen in de
      nevenvestigingsplaats Alphen aan den Rijn en in de nevenzittingsplaatsen Loenen en Tilburg.


      [ref1]: https://wetten.overheid.nl/BWBR0011823
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0013129/2004-09-01#Artikel4
    references:
      - id: ref1
