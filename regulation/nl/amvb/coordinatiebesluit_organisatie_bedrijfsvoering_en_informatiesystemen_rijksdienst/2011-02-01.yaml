preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 14 januari 2011, BZK-
    2010-0000843567, Directie Constitutionele Zaken en Wetgeving, gedaan in overeenstemming met het gevoelen van de
    ministerraad;

    Gelet op artikel 44, eerste lid, van de Grondwet;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0029514/2011-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder Onze Minister: een minister als bedoeld in
      [artikel 44, eerste lid, van de Grondwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel44
    url: https://wetten.overheid.nl/BWBR0029514/2011-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '44'
  - number: '2'
    text: |-
      1 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan na overleg met Onze Ministers kaders vaststellen
      ter bevordering van de eenheid, de kwaliteit of de efficiëntie van de bedrijfsvoering door de ministeries. Daarbij
      kan hij werkzaamheden aanwijzen die ten behoeve van alle of een daarbij aangegeven deel van de ministeries zullen
      worden uitgevoerd door een daarbij aangegeven organisatieonderdeel van een der ministeries.

      2 Onze Ministers nemen de in het eerste lid vermelde kaders in acht.
    url: https://wetten.overheid.nl/BWBR0029514/2011-02-01#Artikel2
  - number: '3'
    text: |-
      1 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt na overleg met Onze Ministers een kader vast
      voor de vaststelling van de organisatie en formatie van de ministeries.

      2 Onze Ministers stellen de organisatie en formatie van hun ministerie vast met inachtneming van het in het eerste
      lid bedoelde kader.

      3 De vaststelling geschiedt in overeenstemming met Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties voor zover het betreft de functies in de salarisschalen 16 en hoger, bedoeld in het
      [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0029514/2011-02-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: '4'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties publiceert jaarlijks van ieder
      ministerie de organisatie en de formatie, voor zover vastgesteld op salarisschaal 16 of hoger van het
      [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0029514/2011-02-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: '5'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties publiceert jaarlijks een verslag over de organisatie en
      de bedrijfsvoering van de ministeries.
    url: https://wetten.overheid.nl/BWBR0029514/2011-02-01#Artikel5
  - number: '6'
    text: |-
      Onze Ministers verstrekken de Minister van Binnenlandse Zaken en Koninkrijksrelaties de door hem gevraagde gegevens
      over de organisatie en de bedrijfsvoering van de ministeries.
    url: https://wetten.overheid.nl/BWBR0029514/2011-02-01#Artikel6
  - number: '7'
    text: |-
      1 Het [Coördinatiebesluit organisatie en formatie rijksdienst 2007][ref1] wordt ingetrokken.

      2 Na de inwerkingtreding van dit besluit berusten de besluiten die zijn gebaseerd op
      [artikel 2, eerste lid van het Coördinatiebesluit organisatie en formatie rijksdienst 2007][ref2], op
      [artikel 3, tweede lid][ref3], van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0023020
      [ref2]: https://wetten.overheid.nl/BWBR0023020#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0029514#Artikel3
    url: https://wetten.overheid.nl/BWBR0029514/2011-02-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0023020
      - id: ref2
        bwb_id: BWBR0023020
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0029514
        artikel: '3'
  - number: '8'
    text: 'Dit besluit wordt aangehaald als: Coördinatiebesluit organisatie en bedrijfsvoering rijksdienst 2011.'
    url: https://wetten.overheid.nl/BWBR0029514/2011-02-01#Artikel8
