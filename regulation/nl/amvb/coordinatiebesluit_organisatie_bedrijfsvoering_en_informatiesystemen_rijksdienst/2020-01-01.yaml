$id: coordinatiebesluit_organisatie_bedrijfsvoering_en_informatiesystemen_rijksdienst
regulatory_layer: AMVB
publication_date: '2019-12-11'
valid_from: '2020-01-01'
bwb_id: BWBR0029514
url: https://wetten.overheid.nl/BWBR0029514/2020-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 14 januari 2011, BZK-
    2010-0000843567, Directie Constitutionele Zaken en Wetgeving, gedaan in overeenstemming met het gevoelen van de
    ministerraad;

    Gelet op artikel 44, eerste lid, van de Grondwet;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0029514/2020-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0029514/2020-01-01#Artikel1
  - number: 1.a
    text: |-
      *Onze Minister die het mede aangaat:* een minister als bedoeld in [artikel 44, eerste lid, van de Grondwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel44
    url: https://wetten.overheid.nl/BWBR0029514/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '44'
  - number: 1.b
    text: |-
      *informatiesysteem:* een samenhangend geheel van gegevensverzamelingen, procedures, processen en programmatuur
      alsmede de voor het informatiesysteem getroffen voorzieningen voor opslag, verwerking en communicatie.
    url: https://wetten.overheid.nl/BWBR0029514/2020-01-01#Artikel1
  - number: '2.1'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan na overleg met Onze Ministers die het mede aangaat
      kaders vaststellen ter bevordering van de eenheid, de kwaliteit of de efficiëntie van de bedrijfsvoering en de
      informatiesystemen van de ministeries. Daarbij kan hij:
    url: https://wetten.overheid.nl/BWBR0029514/2020-01-01#Artikel2
  - number: 2.1.a
    text: |-
      werkzaamheden aanwijzen die ten behoeve van alle of een daarbij aangegeven deel van de ministeries zullen worden
      uitgevoerd door een daarbij aangegeven organisatieonderdeel van een der ministeries;
    url: https://wetten.overheid.nl/BWBR0029514/2020-01-01#Artikel2
  - number: 2.1.b
    text: |-
      voorzieningen aanwijzen die in verband met de noodzakelijke interoperabiliteit of beveiliging voor bepaalde
      informatiesystemen van alle of een daarbij aangegeven deel van de ministeries zullen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0029514/2020-01-01#Artikel2
  - number: '2.2'
    text: Onze Ministers nemen de in het eerste lid vermelde kaders in acht.
    url: https://wetten.overheid.nl/BWBR0029514/2020-01-01#Artikel2
  - number: '3.1'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt na overleg met Onze Ministers een kader vast voor
      de vaststelling van de organisatie en formatie van de ministeries.
    url: https://wetten.overheid.nl/BWBR0029514/2020-01-01#Artikel3
  - number: '3.2'
    text: |-
      Onze Ministers stellen de organisatie en formatie van hun ministerie vast met inachtneming van het in het eerste
      lid bedoelde kader.
    url: https://wetten.overheid.nl/BWBR0029514/2020-01-01#Artikel3
  - number: '3.3'
    text: |-
      De vaststelling geschiedt in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties voor
      zover het betreft de functies in de salarisschalen 16 en hoger zoals overeengekomen in de laatstelijk afgesloten
      collectieve arbeidsovereenkomst voor ambtenaren die krachtens een arbeidsovereenkomst met de Staat werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0029514/2020-01-01#Artikel3
  - number: 3a
    text: |-
      Het namens de Staat aangaan, wijzigen en beëindigen van de arbeidsovereenkomst met de Chief Information Officer van
      een ministerie geschiedt na overleg met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0029514/2020-01-01#Artikel3a
  - number: '4'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties publiceert jaarlijks van ieder ministerie de
      organisatie en de formatie, voor zover vastgesteld op salarisschaal 16 of hoger zoals overeengekomen in de
      laatstelijk afgesloten collectieve arbeidsovereenkomst voor ambtenaren die krachtens een arbeidsovereenkomst met de
      Staat werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0029514/2020-01-01#Artikel4
  - number: '5'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties publiceert jaarlijks een verslag over de organisatie en
      de bedrijfsvoering van de ministeries.
    url: https://wetten.overheid.nl/BWBR0029514/2020-01-01#Artikel5
  - number: '6.1'
    text: |-
      Onze Ministers verstrekken de Minister van Binnenlandse Zaken en Koninkrijksrelaties de door hem gevraagde gegevens
      over de organisatie, de bedrijfsvoering en de informatiesystemen van de ministeries.
    url: https://wetten.overheid.nl/BWBR0029514/2020-01-01#Artikel6
  - number: '6.2'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan na overleg met Onze Ministers die het mede aangaat
      kaders vaststellen voor de wijze waarop de gegevens over de informatiesystemen worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0029514/2020-01-01#Artikel6
  - number: '7.1'
    text: |-
      Het [Coördinatiebesluit organisatie en formatie rijksdienst 2007][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0023020
    url: https://wetten.overheid.nl/BWBR0029514/2020-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0023020
  - number: '7.2'
    text: |-
      Na de inwerkingtreding van dit besluit berusten de besluiten die zijn gebaseerd op
      [artikel 2, eerste lid van het Coördinatiebesluit organisatie en formatie rijksdienst 2007][ref1], op
      [artikel 3, tweede lid][ref2], van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0023020#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0029514#Artikel3
    url: https://wetten.overheid.nl/BWBR0029514/2020-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0023020
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0029514
        artikel: '3'
  - number: '8'
    text: |-
      Dit besluit wordt aangehaald als: Coördinatiebesluit organisatie, bedrijfsvoering en informatiesystemen
      rijksdienst.
    url: https://wetten.overheid.nl/BWBR0029514/2020-01-01#Artikel8
  - number: '9'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0029514/2020-01-01#Artikel9
