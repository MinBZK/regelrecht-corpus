articles:
  - number: '1'
    text: |-
      Het minimum bedrag van de solvabiliteitsmarge, bedoeld in
      [artikel 40, eerste lid, van de Wet toezicht natura-uitvaartverzekeringsbedrijf][ref1] bedraagt de som van de
      volgende berekeningen:

      a. voor verzekeringen waarbij door de verzekeraar beleggingsrisico wordt gelopen: vier procent van de bruto
      technische voorzieningen, vermenigvuldigd met de verhouding tussen de technische voorzieningen onder aftrek van
      de overdrachten uit hoofde van herverzekering en de bruto technische voorzieningen aan het eind van het afgelopen
      boekjaar: dit verhoudingsgetal bedraagt ten minste vijfentachtig procent;

      b. voor verzekeringen waarbij door de verzekeraar geen beleggingsrisico wordt gelopen en waarbij de beheerslasten
      voor een periode van meer dan vijf jaar zijn vastgelegd: een procent van de technische voorzieningen aan het einde
      van het boekjaar;

      c. voor uitstaande depots ten behoeve van uitvaarten: één procent van het depotbedrag;

      d. voor alle verzekeringen: 0,3 procent van het risicokapitaal bij overlijden; de uitkomst wordt vermenigvuldigd
      met de verhouding tussen het risicokapitaal onder aftrek van de overdrachten uit hoofde van herverzekering en het
      risicokapitaal in het afgelopen boekjaar: dit verhoudingsgetal is tenminste vijftig procent;

      e. voor de aanvullende verzekeringen: achttien procent van de in het afgelopen boekjaar geboekte premies en van de
      in rekening gebrachte poliskosten, indien en voorzover deze premies en kosten niet meer bedragen dan tien miljoen
      euro, vermeerderd met zestien procent van deze premies en kosten, indien en voorzover deze meer bedragen dan tien
      miljoen euro. De uitkomst van deze berekening wordt vermenigvuldigd met de verhouding tussen de uitkeringen die
      voor eigen rekening komen van de verzekeraar na overdracht uit hoofde van herverzekering en de bruto uitkeringen in
      het laatste boekjaar; dit verhoudingsgetal is ten minste vijftig procent.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel40
    url: https://wetten.overheid.nl/BWBR0007650/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '40'
  - number: '2'
    text: |-
      1 De solvabiliteitsmarge wordt met name gevormd door de volgende vermogensbestanddelen:

      a. het gestorte aandelenkapitaal of waarborgkapitaal vermeerderd met de ledenrekeningen;

      b. de helft van het obligo van het geplaatste kapitaal of van het in aandelen verdeeld waarborgkapitaal;

      c. de reserves;

      d. de onverdeelde winst;

      e. de suppletiebijdragen die onderlinge waarborgmaatschappijen uit hoofde van het boekjaar krachtens de statuten
      van hun leden kunnen eisen;

      f. de meerwaarden in verband met de onderwaardering van activa dan wel op grond van winstverwachtingen;

      g. het cumulatief preferent aandelenkapitaal;

      h. de achtergestelde leningen;

      i. de effecten met onbepaalde looptijd en andere vermogensinstrumenten.

      2 Ten aanzien van de vermogensbestanddelen, bedoeld in het eerste lid, worden de volgende voorwaarden in acht
      genomen:

      a. de ledenrekeningen hebben statutair een achtergesteld karakter; de statuten bepalen dat:

        - vanaf deze rekeningen alleen betalingen aan de leden plaatsvinden als daardoor de solvabiliteitsmarge niet daalt
      beneden het vereiste niveau, dan wel bij liquidatie van de verzekeraar als alle andere schulden zijn voldaan;
        - elke betaling vanaf deze ledenrekeningen voor andere doeleinden dan voor de individuele opzegging van het
      lidmaatschap niet eerder plaatsvindt dan dertig dagen na melding ervan aan de Pensioen-& Verzekeringskamer:
      de Pensioen-& Verzekeringskamer kan tegen deze voorgenomen betaling bedenkingen naar voren brengen aan welke
      bedenkingen de verzekeraar dient tegemoet te komen;

      b. wijzigingen van de statutaire bepalingen met betrekking tot de ledenrekeningen bedoeld in onderdeel a, moeten
      zijn toegestaan door de Pensioen-& Verzekeringskamer;

      c. de helft van het obligo van het geplaatste kapitaal of van het in aandelen verdeeld waarborgkapitaal kan alleen
      worden meegeteld indien van het geplaatste kapitaal minimaal vijfentwintig procent is gestort;

      d. de suppletiebijdragen kunnen worden meegeteld tot maximaal vijftig procent van het verschil tussen de
      maximumbijdragen en de werkelijk gevorderde bedragen en tot een maximum van vijftig procent van het totaal van de
      vereiste solvabiliteitsmarge;

      e. de meerwaarden worden slechts meegeteld na toestemming van de Pensioen-& Verzekeringskamer;

      f. het cumulatief preferent aandelenkapitaal en de achtergestelde leningen kunnen worden meegeteld tot maximaal
      vijftig procent van de vereiste solvabiliteitsmarge, met dien verstande dat cumulatief preferent aandelenkapitaal
      en achtergestelde leningen met vaste looptijd kunnen worden meegeteld tot maximaal vijfentwintig procent van deze
      solvabiliteitsmarge, voorzover aan de volgende voorwaarden is voldaan:

        - vorderingen uit hoofde van achtergestelde leningen worden achtergesteld bij de vorderingen van alle andere
      crediteuren;
        - van de achtergestelde leningen worden alleen de gestorte bedragen in aanmerking genomen;
        - een achtergestelde lening met een vaste looptijd heeft een oorspronkelijke looptijd van ten minste vijf jaar; ten
      minste een jaar voor de contractuele vervaldag legt de verzekeraar een plan ter toestemming voor aan de Pensioen-&
      Verzekeringskamer waarin wordt uiteengezet op welke wijze de solvabiliteitsmarge zal worden gehandhaafd of op de
      vervaldag op het vereiste niveau zal worden gebracht;
        - de achtergestelde lening zonder vaste looptijd kan slechts worden afgelost met een opzeggingstermijn van vijf
      jaar, tenzij de lening niet langer als bestanddeel van de solvabiliteitsmarge wordt aangemerkt of de Pensioen-&
      Verzekeringskamer de aflossing heeft toegestaan; het verzoek om die toestemming wordt ten minste zes maanden voor
      de beoogde aflossingsdatum bij de Pensioen-& Verzekeringskamer ingediend;
        - de leningsovereenkomst bevat geen bepaling op grond waarvan de achtergestelde lening voor het einde van de
      looptijd, anders dan bij liquidatie van de onderneming, moet worden afgelost;
        - wijzigingen in de leningsovereenkomst worden pas aangebracht na toestemming van de Pensioen-& Verzekeringskamer;

      g. effecten met onbepaalde looptijd en andere vermogensinstrumenten worden voor het totaal van deze effecten en van
      de achtergestelde leningen, bedoeld in het eerste lid, onderdeel h, meegeteld tot een maximum van vijftig procent
      van de solvabiliteitsmarge voorzover aan de volgende voorwaarden is voldaan:

        - de aflossing op deze effecten en andere vermogensinstrumenten vindt alleen plaats na toestemming van de
      Pensioen-& Verzekeringskamer;
        - in de emissie-overeenkomst is vastgelegd dat de verzekeraar de rentebetaling kan uitstellen;
        - de vorderingen op de verzekeraar uit hoofde van genoemde effecten zijn achtergesteld ten opzichte van overige
      vorderingen;
        - in de emissie-overeenkomst is vastgelegd dat verliezen kunnen worden gecompenseerd met het bedrag van de lening
      en de nog te betalen rente;
        - alleen de gestorte bedragen worden in aanmerking genomen.
