  - number: '3'
    text: |-
      Tot dekking van het in [artikel 22, eerste lid, onderdeel ][ref1] bedoelde minimum bedrag van het garantiefonds
      kunnen slechts de volgende, door de verzekeraar voor eigen rekening aangehouden waarden dienen:

      a. schatkistpapier ten laste van de Staat der Nederlanden;

      b. aandelen, schuldbrieven, winst-, oprichtings- en optiebewijzen, warrants en soortgelijke waardepapieren;

      c. bewijzen van rechten van deelgenootschap;

      d. certificaten van waarden, bedoeld in de onderdelen *b* en *c*;

      e. recepissen van waarden, bedoeld in de onderdelen *a* tot en met *c*;

      f. schuldbekentenissen jegens de verzekeraar, niet zijnde schatkistpapier of schuldbrieven, ten laste van of
      rechtstreeks en onvoorwaardelijk voor rente en aflossing gewaarborgd door de Staat of andere Nederlandse openbare
      lichamen;

      g. schuldbekentenissen jegens de verzekeraar, niet zijnde schuldbrieven, ten laste van in Nederland gevestigde
      naamloze vennootschappen of ten laste van een ingevolge [artikel 52, tweede lid, onderdelen ][ref2] geregistreerde
      kredietinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel52
