  - number: '7'
    text: |-
      De in [artikel 3][ref1] bedoelde waarden worden overeenkomstig de [artikelen 5][ref2] en [6][ref3] in bewaring
      gegeven en wel, op straffe van schorsing van de behandeling van de aanvraag van de vergunning, bedoeld in
      [artikel 11 van de Wet toezicht natura-uitvaartverzekeringsbedrijf][ref4], binnen vier weken nadat de Pensioen-&
      Verzekeringskamer de aanvraag heeft ontvangen.


