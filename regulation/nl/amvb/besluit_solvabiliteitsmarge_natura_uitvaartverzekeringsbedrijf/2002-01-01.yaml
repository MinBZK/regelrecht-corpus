  - number: 7a
    text: |-
      1 Het bedrag van de boete, bedoeld in
      [artikel 93d, vijfde lid, eerste volzin, van de Wet toezicht natura-uitvaartverzekeringsbedrijf][ref1] wordt
      bepaald op de wijze, voorzien in de bijlage bij dit besluit.

      2 De Pensioen-& Verzekeringskamer kan het bedrag van de boete lager stellen dan in de bijlage is bepaald, indien
      het bedrag van de boete in een bepaald geval op grond van bijzondere omstandigheden onevenredig hoog is.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel93d
