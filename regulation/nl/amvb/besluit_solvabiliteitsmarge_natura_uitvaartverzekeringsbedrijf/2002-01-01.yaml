        artikel: '3'
  - number: '6'
    text: |-
      1 De in [artikel 3][ref1] bedoelde waarden worden in open bewaring gegeven bij De Nederlandsche Bank N.V. of bij
      een ingevolge [artikel 52, tweede lid, onderdelen ][ref2] geregistreerde kredietinstelling.

      2 De verzekeraar kan met de in het eerste lid bedoelde bewaarneemster overeenkomen dat deze bij haar in bewaring
      gegeven waarden op naam van de verzekeraar mag overdragen aan een effectenbewaarinstelling die rechtspersoon is,
      mits:

      a. de nakoming van de verplichtingen van de effectenbewaarinstelling door haar is gewaarborgd, en

      b. de effectenbewaarinstelling zich heeft verplicht om hetzij die waarden hetzij een gelijke hoeveelheid waarden
      van dezelfde soort op naam van de verzekeraar in haar voorraad aanwezig te houden en na beëindiging van de
      overeenkomst tussen de verzekeraar en de bewaarneemster af te geven aan de verzekeraar.

      3 De waarden worden in Nederland bewaard. De bewaarneemster of effectenbewaarinstelling draagt zelfstandig zorg
      voor verkrijging van nieuwe coupon- en dividendbladen en voor bewaargeving tot het bijwonen van vergaderingen door
      de verzekeraar.

      4 Zonder toestemming van de Pensioen-& Verzekeringskamer worden de waarden niet aan de verzekeraar afgegeven en
      zullen ten aanzien daarvan geen rechtshandelingen worden verricht. De bewaarneemster of effectenbewaarinstelling
      mag evenwel coupons en dividendbewijzen, mits niet vroeger dan veertien dagen voor de dag der betaalbaarstelling,
      zonder toestemming van de Pensioen-& Verzekeringskamer aan de verzekeraar afgeven, tenzij de Pensioen-&
      Verzekeringskamer haar dit heeft verboden. De Pensioen-& Verzekeringskamer maakt dit verbod onmiddellijk aan de
      verzekeraar bekend.

      5 De waarden worden op verzoek van de Pensioen-& Verzekeringskamer aan haar ter bewaring afgegeven, indien:

      a. de registratie van de kredietinstelling is doorgehaald, of

      b. de bewaarneemster de overeenkomst met de verzekeraar beëindigt dan wel de nakoming van de verplichtingen van de
      effectenbewaarinstelling niet langer waarborgt.

      6 Vanaf de dertigste dag na de afgifte, bedoeld in het vijfde lid, kan de Pensioen-& Verzekeringskamer de waarden
      overeenkomstig dit artikel in bewaring geven op kosten van de verzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0007650#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel52
