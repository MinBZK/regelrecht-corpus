  - number: '4'
    text: |-
      De waardering en de spreiding van de waarden, bedoeld in [artikel 3][ref1], moeten zijn toegestaan door de
      Pensioen-& Verzekeringskamer.


      [ref1]: https://wetten.overheid.nl/BWBR0007650#Artikel3
    url: https://wetten.overheid.nl/BWBR0007650/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007650
        artikel: '3'
  - number: '5'
    text: |-
      Met betrekking tot de schuldbekentenissen, bedoeld in [artikel 3, onderdelen ][ref1], geldt dat uit deze
      schuldbekentenissen dan wel uit een afzonderlijke schriftelijke overeenkomst moet blijken:

      a. dat ten aanzien van de schuldvordering waarvan uit de schuldbekentenis blijkt, geen overeenkomst wordt gesloten
      noch enige andere rechtshandeling wordt verricht zonder toestemming van de Pensioen-& Verzekeringskamer;

      b. dat overeengekomen aflossingen en rentebetaling niet zonder toestemming van de Pensioen-& Verzekeringskamer
      geschieden, wanneer de Verzekeringskamer dat aan de schuldenaar heeft verboden;

      c. dat extra aflossingen en vervroegde rentebetalingen niet geschieden zonder toestemming van de Pensioen-&
      Verzekeringskamer;

      d. dat aflossingen en rentebetalingen, verricht in strijd met de onderdelen *b* en *c*, niet in mindering komen op
      de schuldvordering;

      e. dat de schuldenaar zich niet op verrekening zal beroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0007650#Artikel3
    url: https://wetten.overheid.nl/BWBR0007650/2002-01-01#Artikel5
    references:
