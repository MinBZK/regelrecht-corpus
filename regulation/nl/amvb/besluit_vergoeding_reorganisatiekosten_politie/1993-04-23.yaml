---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_vergoeding_reorganisatiekosten_politie
regulatory_layer: AMVB
publication_date: '1993-04-23'
valid_from: '1993-04-23'
bwb_id: BWBR0005911
url: https://wetten.overheid.nl/BWBR0005911/1993-04-23
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Ministers van Binnenlandse Zaken en van Justitie van 24 september 1992, directoraat-
    generaal voor Openbare Orde en Veiligheid, nr. PRP 92/U710, en directoraat-generaal Wetgeving, nr. W.311163/93/6;

    Gelet op artikel 11 van de Wet tijdelijke voorzieningen reorganisatie politiebestel (Stb. 1991, nr. 674) en artikel
    237b van de gemeentewet (Stb. 1931, 89);

    Gezien het advies van de Raad voor de gemeentefinanciën (advies van 30 september 1991, nr. 108910 Rgf 27/80);

    Gehoord de Commissie voor de gemeentelijke comptabiliteitsvoorschriften (advies van 17 februari 1992, nr. GCV/
    YA/92/4);

    De Raad van State gehoord (advies van 22 december 1992, nr. W04.92.0457);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken van 1 maart 1993, nr. E93/U480, uitgebracht mede
    namens Onze Minister van Justitie;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Binnenlandse Zaken;'
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel1
  - number: 1.b
    text: |-
      de burgemeester: de burgemeester, bedoeld in artikel 2 van de Wet tijdelijke voorzieningen reorganisatie
      politiebestel;
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel1
  - number: 1.c
    text: |-
      de hoofdofficier: de hoofdofficier van justitie, bedoeld in artikel 1, onder *b*, van de Wet tijdelijke
      voorzieningen reorganisatie politiebestel;
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel1
  - number: 1.d
    text: |-
      de politieregio: de politieregio, bedoeld in artikel 2 van de Wet tijdelijke voorzieningen reorganisatie
      politiebestel;
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel1
  - number: 1.e
    text: |-
      de gemeente: de gemeente waarvan de burgemeester is belast met de taak, bedoeld in artikel 4 van de Wet tijdelijke
      voorzieningen reorganisatie politiebestel;
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel1
  - number: 1.f
    text: |-
      het regionaal overlegorgaan: het regionaal overlegorgaan bedoeld in artikel 12 van de Wet tijdelijke voorzieningen
      reorganisatie politiebestel;
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel1
  - number: 1.g
    text: |-
      de rijksbijdrage: de bijdrage, bedoeld in artikel 11 van de Wet tijdelijke voorzieningen reorganisatie
      politiebestel;
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel1
  - number: 1.h
    text: |-
      de feitelijke integratie: de feitelijke integratie van de binnen de politieregio aanwezige korpsen van
      gemeentepolitie en districten van het Korps Rijkspolitie of onderdelen daarvan;
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel1
  - number: 1.i
    text: 'het regionaal projectplan: het regionaal projectplan, bedoeld in artikel 3.'
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel1
  - number: '2.1'
    text: |-
      De rijksbijdrage is bestemd voor de bestrijding van de kosten die in de periode 1991 tot en met 1996 in de
      politieregio worden gemaakt ter bevordering van de feitelijke integratie van de politie op de wijze zoals
      aangegeven in het regionale projectplan.
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel2
  - number: '2.2'
    text: |-
      De rijksbijdrage bestaat uit het totaal van de jaarlijkse uitkeringen die ingevolge dit besluit in de periode 1991
      tot en met 1996 uit 's Rijks kas aan de gemeente worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel2
  - number: '2.3'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Justitie, de periode, bedoeld in het eerste en tweede
      lid, met ten hoogste twee jaar verlengen, indien de voortgang van de reorganisatie van het politiebestel daartoe
      noopt.
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel2
  - number: '3.1'
    text: |-
      Het regionaal overlegorgaan stelt een regionaal projectplan vast ten behoeve van de feitelijke integratie van de
      politie.
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel3
  - number: '3.2'
    text: Het regionaal projectplan bevat in elk geval een duidelijke beschrijving van
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel3
  - number: 3.2.a
    text: de projectorganisatie,
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel3
  - number: 3.2.b
    text: |-
      de activiteiten die met het oog op de feitelijke integratie van de politie in de regio worden of zullen worden
      ondernomen,
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel3
  - number: 3.2.c
    text: het beoogde eindresultaat van de feitelijke integratie van de politie, alsmede
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel3
  - number: 3.2.d
    text: |-
      een meerjarenraming van alle op het moment van vaststelling voorzienbare kosten in verband met de hiervoor genoemde
      onderwerpen.
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel3
  - number: '3.3'
    text: |-
      De burgemeester legt het regionaal projectplan ter goedkeuring voor aan Onze Minister en Onze Minister van
      Justitie. Indien Onze Minister en Onze Minister van Justitie het regionaal projectplan goedkeuren, deelt Onze
      Minister dit het regionaal overlegorgaan door tussenkomst van de burgemeester zo spoedig mogelijk, doch in elk
      geval binnen drie maanden na ontvangst van het regionaal projectplan, mede.
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel3
  - number: '3.4'
    text: Onze Minister en Onze Minister van Justitie onthouden hun goedkeuring, indien naar hun oordeel
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel3
  - number: 3.4.a
    text: niet is voldaan aan het tweede lid,
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel3
  - number: 3.4.b
    text: |-
      er geen evenwicht bestaat tussen de meerjarenraming van de kosten, bedoeld in het tweede lid onder *d*, en de
      raming van de rijksbijdrage, bedoeld in [artikel 4, eerste lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0005911#Artikel4
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005911
        artikel: '4'
        paragraaf: '2'
  - number: 3.4.c
    text: |-
      het beoogde resultaat, bedoeld in het tweede lid, onder *c*, niet in overeenstemming is met de in
      [artikel 2, eerste lid][ref1] bedoelde bestemming van de rijksbijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0005911#Artikel2
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005911
        artikel: '2'
        paragraaf: '1'
  - number: '3.5'
    text: |-
      Indien Onze Minister en Onze Minister van Justitie hun goedkeuring onthouden, deelt Onze Minister het regionaal
      overlegorgaan door tussenkomst van de burgemeester zo spoedig mogelijk, doch in elk geval binnen drie maanden na
      ontvangst van het regionale projectplan, de, grond van onthouding mede.
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel3
  - number: '3.6'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Justitie, regels stellen over de indieningstermijn van
      het regionale projectplan en nadere regels stellen over de inrichting van het regionale projectplan.
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel3
  - number: '4.1'
    text: De rijksbijdrage wordt geraamd op het bedrag als vermeld in de bijlage bij dit besluit.
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel4
  - number: '4.2'
    text: Onze Minister kan de raming van de rijksbijdrage bijstellen
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel4
  - number: 4.2.a
    text: |-
      in verband met loon- en prijsmutaties die tot wijzigingen in de desbetreffende post uit Hoofdstuk VII van de
      rijksbegroting en de daarbij behorende meerjarenraming hebben geleid;
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel4
  - number: 4.2.b
    text: |-
      in verband met overige wijzigingen in de desbetreffende post uit Hoofdstuk VII van de rijksbegroting en de daarbij
      behorende meerjarenraming.
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel4
  - number: '4.3'
    text: |-
      Een bijstelling als bedoeld in het tweede lid, onder *b*, vindt plaats in overeenstemming met Onze Minister van
      Justitie.
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel4
  - number: '4.4'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Justitie, de raming van de rijksbijdrage bijstellen
      indien naar zijn oordeel uit het regionale projectplan, dan wel uit het financieel verantwoordingsverslag of de
      voortgangsrapportage, bedoeld in [artikel 10, eerste onderscheidenlijk tweede lid][ref1], blijkt dat


      [ref1]: https://wetten.overheid.nl/BWBR0005911#Artikel10
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005911
        artikel: '10'
        paragraaf: '3'
  - number: 4.4.a
    text: |-
      in de regio kosten worden gemaakt die in andere regio's niet of nauwelijks worden gemaakt, voorzover desbetreffende
      kosten naar het oordeel van Onze Minister en Onze Minister van Justitie noodzakelijk zijn voor de feitelijke
      integratie van de politie, of
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel4
  - number: 4.4.b
    text: |-
      de in het regionale projectplan omschreven activiteiten of het beoogde eindresultaat niet of onvoldoende worden
      gerealiseerd, dan wel eerder worden gerealiseerd dan in het regionale projectplan is aangegeven.
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel4
  - number: '5.1'
    text: |-
      Zo spoedig mogelijk na de inwerkingtreding van dit besluit stelt Onze Minister in overeenstemming met Onze Minister
      van Justitie voor de jaren 1991 tot en met 1996 een meerjarenraming vast van de uitkeringen aan de gemeente, waarin
      per kalenderjaar wordt aangegeven het deel van de geraamde rijksbijdrage dat in het desbetreffende kalenderjaar aan
      de gemeente zal worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel5
  - number: '5.2'
    text: |-
      Bij het vaststellen van de meerjarenraming van de uitkeringen aan de gemeente wordt zoveel mogelijk rekening
      gehouden met de meerjarenraming van de kosten in het goedgekeurde regionale projectplan.
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel5
  - number: '5.3'
    text: |-
      Onze Minister kan, na overleg met Onze Minister van Justitie, de meerjarenraming van de uitkeringen aan de gemeente
      binnen de grenzen van de raming van de rijksbijdrage bijstellen, indien naar het oordeel van Onze Minister uit
      het financieel verantwoordingsverslag, bedoeld in [artikel 10, eerste lid][ref1], of de voortgangsrapportage,
      bedoeld in [artikel 10, tweede lid][ref2], dan wel uit een verzoek van de burgemeester tot bijstelling van de
      meerjarenraming, blijkt dat zich bij de kosten voor de feitelijke integratie van de politie ontwikkelingen voordoen
      die daartoe aanleiding geven.


      [ref1]: https://wetten.overheid.nl/BWBR0005911#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005911#Artikel10
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005911
        artikel: '10'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005911
        artikel: '10'
        paragraaf: '3'
  - number: '5.4'
    text: |-
      Onze Minister stelt, na overleg met Onze Minister van Justitie, de meerjarenraming bij voor zover bijstelling op
      grond van [artikel 4][ref1] daartoe aanleiding geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005911#Artikel4
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005911
        artikel: '4'
        paragraaf: '2'
  - number: '6'
    text: |-
      Onze Minister stelt de burgemeester zo spoedig mogelijk op de hoogte van een besluit tot bijstelling als bedoeld
      in [artikel 4, tweede en vierde lid][ref1], en [artikel 5, derde of vierde lid][ref2]. Daarbij geeft Onze Minister
      aan welke wijzigingen als gevolg van het besluit tot bijstelling zijn aangebracht in de meerjarenraming van de
      uitkeringen aan de gemeente, bedoeld in [artikel 5, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005911#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005911#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005911#Artikel5
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005911
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005911
        artikel: '5'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005911
        artikel: '5'
        paragraaf: '2'
  - number: '7.1'
    text: |-
      Onder voorbehoud van goedkeuring van de desbetreffende post van Hoofdstuk VII van de rijksbegroting door de Staten-
      Generaal, stelt Onze Minister voor 1 oktober de jaarlijkse uitkering per regio die aan een gemeente in het volgend
      kalenderjaar wordt verstrekt, voorlopig vast.
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel7
  - number: '7.2'
    text: |-
      De hoogte van de jaarlijkse uitkering, bedoeld in het eerste lid, wordt bepaald door het deel van de geraamde
      rijksbijdrage dat ingevolge de meerjarenraming van de uitkeringen aan de gemeente, zonodig bijgesteld door
      toepassing van artikel 5, derde of vierde lid, in het desbetreffende kalenderjaar wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel7
  - number: '7.3'
    text: |-
      Onze Minister wijzigt de voorlopig vastgestelde jaarlijkse uitkering indien na de voorlopige vaststelling, bedoeld
      in het eerste lid, een bijstelling als bedoeld in [artikel 5, derde of vierde lid][ref1], plaatsvindt, een en ander
      voor zover deze bijstelling betrekking heeft op het lopende kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005911#Artikel5
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005911
        artikel: '5'
        paragraaf: '2'
  - number: '7.4'
    text: |-
      Onze Minister stelt de jaarlijkse uitkering over het voorafgaande kalenderjaar definitief vast na ontvangst van het
      financieel verantwoordingsverslag, bedoeld in [artikel 10, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005911#Artikel10
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005911
        artikel: '10'
        paragraaf: '3'
  - number: '8.1'
    text: |-
      De jaarlijkse uitkering wordt in vier termijnen betaalbaar gesteld op onderscheidenlijk 1 februari, 1 mei, 1
      augustus en 1 november.
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel8
  - number: '8.2'
    text: |-
      Onze Minister kan de betaling van een of meer termijnen geheel of gedeeltelijk opschorten, indien niet is voldaan
      aan [artikel 10, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005911#Artikel10
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005911
        artikel: '10'
        paragraaf: '3'
  - number: '8.3'
    text: |-
      Verrekeningen met de jaarlijkse uitkering in verband met wijzigingen, bedoeld in [artikel 7, derde lid][ref1],
      vinden voor het gehele jaar waarvoor de jaarlijkse uitkering wordt toegekend, voor zover mogelijk plaats met de
      termijnbetaling van 1 november.


      [ref1]: https://wetten.overheid.nl/BWBR0005911#Artikel7
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005911
        artikel: '7'
        paragraaf: '3'
  - number: '9'
    text: |-
      De burgemeester beschikt over de jaarlijkse bijdrage voor de uitvoering van zijn taak, bedoeld in [artikel 4][ref1]
      van de Wet tijdelijke voorzieningen reorganisatie politiebestel, met inachtneming van het regionale projectplan.


      [ref1]: https://wetten.overheid.nl/BWBR0005911#Artikel4
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005911
        artikel: '4'
        paragraaf: '2'
  - number: '10.1'
    text: |-
      Vóór 1 april zendt de burgemeester aan Onze Minister een financieel verantwoordingsverslag over de besteding van
      de jaarlijkse uitkering over het voorafgaande kalenderjaar, voorzien van een door een registeraccountant afgegeven
      verklaring.
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel10
  - number: '10.2'
    text: |-
      De burgemeester verstrekt Onze Minister informatie over de voortgang van de feitelijke integratie van de politie en
      de realisatie van de activiteiten, bedoeld in [artikel 3, tweede lid, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005911#Artikel3
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005911
        artikel: '3'
        paragraaf: '1'
  - number: '10.3'
    text: |-
      De burgemeester verstrekt de in het tweede lid bedoelde informatie vóór 1 april over het tweede halfjaar van het
      voorafgaande kalenderjaar en vóór 1 oktober over het eerste halfjaar van het lopende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel10
  - number: '10.4'
    text: |-
      Onze Minister kan regels stellen over de inrichting van de informatie en de verantwoording, bedoeld in het
      eerste onderscheidenlijk tweede lid. Regels over de informatie, bedoeld in het tweede lid, stelt Onze Minister in
      overeenstemming met Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel10
  - number: '10.5'
    text: |-
      Aan ambtenaren van de accountantsdienst van het Ministerie van Binnenlandse Zaken wordt op verzoek alle informatie
      verstrekt die zij noodzakelijk achten. Deze ambtenaren kunnen op eigen initiatief informatie inwinnen bij de
      registeraccountant die met de controle is belast.
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel10
  - number: '11'
    text: |-
      De gemeente plaatst de inkomsten en de uitgaven die betrekking hebben op de rijksbijdrage op een aparte post van de
      begroting van de inkomsten en de begroting van de uitgaven.
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel11
  - number: '12'
    text: |-
      Indien een deel van de jaarlijkse uitkering niet tot besteding is gekomen, wordt dit deel door de gemeente
      gereserveerd.
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel12
  - number: '13'
    text: |-
      Uitkeringen die op grond van [artikel 237](onbekend) voor de inwerkingtreding van dit besluit aan de gemeente zijn
      verstrekt met het oog op de feitelijke integratie van de politie, maken deel uit van de rijksbijdrage.
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel13
  - number: '14.1'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het is
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel14
  - number: '14.2'
    text: Dit besluit vervalt op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel14
  - number: '15'
    text: Dit besluit kan worden aangehaald als Besluit vergoeding reorganisatiekosten politie.
    url: https://wetten.overheid.nl/BWBR0005911/1993-04-23#Artikel15
