articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. de wet: de [Wet sociale werkvoorziening][ref1];

      b. herindicatiebeschikking: de beschikking, bedoeld in [artikel 11, eerste lid, van de wet][ref2];

      c. sociale werkvoorziening: de arbeidsomgeving waar gewerkt wordt in een dienstbetrekking als bedoeld in
      [artikel 2, eerste lid, van de wet][ref3];

      d. begeleid werken: de arbeid, bedoeld in [hoofdstuk 3 van de wet][ref4];

      e. beperkingen van lichamelijke, verstandelijke of psychische aard: alle beperkingen die samenhangen met
      stoornissen van functies of anatomische eigenschappen zoals gekwalificeerd in de Nederlandse vertaling van de
      International Classification of Functioning, Disability and Health (ICF) van de Wereld Gezondheidsorganisatie en
      gespecificeerd in de hoofdstukken 1 tot en met 8 van de classificaties van Functies en Anatomische eigenschappen
      van de ICF, zoals deze luiden op 1 januari 2008;

      f. aanpassingen: aanpassingen met behulp waarvan door de geïndiceerde arbeid kan worden verricht, die betrekking
      hebben op:

      1°. technische aanpassingen in de werkplek en werkomgeving;

      2°. organisatorische aanpassingen in het werk;

      3°. speciale begeleiding bij het werk;

      4°. aanpassing van de werktijd;

      5°. aanpassing van het werktempo;

      g. begeleidingsorganisatie: een organisatie die de arbeidsinpassing van de geïndiceerde, met inbegrip van de
      begeleiding op zijn werkplek gedurende het begeleid werken, verzorgt.


      [ref1]: https://wetten.overheid.nl/BWBR0008903
