  - number: '19'
    text: |-
      1 Het college verstrekt gegevens uit de administratie aangelegd voor uitvoering van de
      [Wet banenafspraak en quotum arbeidsbeperkten][ref1] aan het Uitvoeringsinstituut werknemersverzekeringen, voor
      zover deze noodzakelijk zijn voor de uitvoering van de Wet banenafspraak en quotum arbeidsbeperkten.

      2 Bij ministeriële regeling worden de gegevens, bedoeld in het eerste lid, nader bepaald en kan een daartoe
      aangewezen verwerker worden gemachtigd deze gegevens aan het Uitvoeringsinstituut werknemersverzekeringen te
      verstrekken.


