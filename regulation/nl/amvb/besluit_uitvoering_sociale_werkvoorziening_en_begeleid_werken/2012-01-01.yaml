  - number: '28'
    text: |-
      1 In afwijking van [artikel 9, tweede lid][ref1], wordt een persoon die op
      31 december 1997 werkzaam was met toepassing van de [artikelen 11][ref2] en
      [12 van de Regeling samenloop arbeidsongeschikheidsuitkering met inkomsten uit arbeid][ref3] en de Regeling
      vergoeding persoonlijke ondersteuning gehandicapte werknemers, zoals deze regelingen luidde tot die datum en die
      na die datum deze arbeidsovereenkomst in het kader van de [wet][ref4] heeft voortgezet, op zijn verzoek, door het
      college op de wachtlijst geplaatst op de volgorde van de datum waarop hij tot genoemde regelingen was toegelaten en
      krijgt hij bij voorrang begeleid werken aangeboden, indien hij onvrijwillig werkloos wordt.

      2 In afwijking van [artikel 9, eerste lid][ref5], wordt een persoon die op 31 december 1997 een dienstbetrekking
      heeft krachtens de Wet Sociale Werkvoorziening (Stb. 1967, 687) zoals die luidde tot die datum en die na die
      datum deze dienstbetrekking heeft voortgezet, op zijn verzoek, door het college wederom op de wachtlijst geplaatst
      op de volgorde van de datum waarop hij tot de personenkring van de Wet Sociale Werkvoorziening (Stb. 1967,
      687) was toegelaten en krijgt hij bij voorrang een dienstbetrekking aangeboden, indien hij in aansluiting op
      zijn dienstbetrekking arbeid gaat verrichten buiten het kader van de [wet][ref6] en vervolgens binnen drie jaar
      onvrijwillig werkloos wordt. Daarbij wordt zijn nieuwe dienstbetrekking aangemerkt als een voortzetting van zijn
      eerdere dienstbetrekking in de zin van de [wet][ref7].


