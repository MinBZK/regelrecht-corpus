    text: |-
      1 De uitkering aan het college, bedoeld in [artikel 8 van de wet][ref1], wordt voor het jaar T als volgt
      vastgesteld:

      (E/F) x (G – H)

      waarbij:

      E staat voor het op grond van [artikel 16][ref2] berekende minimumaantal arbeidsjaren voor de gemeente voor het
      jaar T;

      F staat voor het na toepassing van [artikel 16][ref3] vastgestelde minimumaantal arbeidsjaren voor alle gemeenten
      samen voor het jaar T;

      G staat voor het voor het jaar T bij wet vast te stellen totale bedrag dat beschikbaar is voor de uitkeringen,
      bedoeld in [artikel 8, eerste lid van de wet][ref4];

      H staat voor de voor het jaar T bij wet vast te stellen middelen voor de Stimuleringsuitkering begeleid werken.

      2 De uitkering wordt in hele euro’s vastgesteld waarbij een halve euro of meer naar boven wordt afgerond.


