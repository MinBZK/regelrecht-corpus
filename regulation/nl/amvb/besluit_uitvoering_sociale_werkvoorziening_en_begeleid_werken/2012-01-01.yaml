  - number: '4'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen deelt de geïndiceerde in de arbeidshandicapcategorie matig of
      ernstig in, op grond van de noodzakelijke aanpassingen en van het prestatieniveau volgens de bijlage behorend bij
      dit besluit.

      2 Het Uitvoeringsinstituut werknemersverzekeringen stelt van de geïndiceerde de geldigheidsduur van de indicatie
      vast. Deze bedraagt minimaal een en maximaal 50 jaar.

      3 De indicatiebeschikking bevat bij een geïndiceerde tevens:

      a. een advies over de eventuele aanpassingen die in eerste aanleg noodzakelijk worden bevonden bij het verrichten
      van arbeid,

      b. een advies of hij in staat is tot begeleid werken.

      4 Indien de aanvrager niet wordt geïndiceerd, omdat hij ook onder normale omstandigheden tot
      regelmatige arbeid in staat wordt geacht, bevat de indicatie tevens het advies, bedoeld in
      [artikel 30d, eerste lid, onderdeel c, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].

      5 Indien de aanvrager niet wordt geïndiceerd, omdat hij ook onder aangepaste omstandigheden niet tot regelmatige
      arbeid is staat wordt geacht, bevat de indicatie tevens een gericht advies betreffende de doorgeleiding
      naar een indicatie voor een voorziening voor ondersteunende en activerende begeleiding in het kader van de
      [Algemene Wet Bijzondere Ziektekosten][ref2].

      6 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de geldigheidsduur van de
      indicatie.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30d
      [ref2]: https://wetten.overheid.nl/BWBR0002614
