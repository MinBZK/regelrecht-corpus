  - number: '5'
    text: |-
      1 De indicatiebeschikking wordt door het Uitvoeringsinstituut werknemersverzekeringen zo spoedig mogelijk na
      vaststelling toegezonden aan de geïndiceerde, of, indien namens hem een aanvraag is ingediend, degene die namens
      hem de aanvraag heeft ingediend, aan het college van de gemeente waar de geïndiceerde woonachtig is en, voor zover
      van toepassing, aan de in[ artikel 2, tweede lid, van de wet][ref1] bedoelde rechtspersoon.

      2 Indien de aanvrager niet wordt geïndiceerd wordt dat besluit door het Uitvoeringsinstituut
      werknemersverzekeringen zo spoedig mogelijk na vaststelling toegezonden aan hem, het college van de gemeente waar
      de aanvrager woonachtig is.

      3 Indien de indicatiebeschikking of herindicatiebeschikking is ingetrokken of vervallen op grond van
      [artikel 12, derde lid, of vierde lid, onderdeel a of b, van de wet][ref2] bericht het college van de gemeente waar
      de voormalig geïndiceerde woont in afschrift het Uitvoeringsinstituut werknemersverzekeringen.

      4 Bij de toepassing van het derde lid wordt de werknemer die buiten Nederland woont als inwoner aangemerkt van de
      gemeente waarin hij laatstelijk in Nederland woonde.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Artikel12
