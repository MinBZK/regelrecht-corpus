  - number: '29'
    text: |-
      1 Personen die op 31 december 1997 al in de sociale werkvoorziening werkzaam waren, worden, zolang die
      dienstbetrekking voortduurt, ingedeeld in de arbeidshandicapcategorie matig.

      2 Personen met beperkingen ten gevolge van stoornissen, zoals gekwalificeerd in de internationale classificatie van
      stoornissen, beperkingen en handicaps onder punt 50.0 tot en met 50.5, 51 en 52 en die op de dag voorafgaand aan
      de inwerkingtreding van de [wet][ref1] werkzaam zijn bij de blindenwerkplaats Blizo, behorend tot de bestuurlijke
      eenheid WSD te Boxtel, en de Blindenwerkplaats Proson, behorende tot de bestuurlijke eenheid DSW, te Nunspeet,
      worden, zolang die dienstbetrekking voortduurt, ingedeeld in de arbeidshandicapcategorie ernstig.


