  - number: '9'
    text: |-
      1 Een geïndiceerde die arbeid gaat verrichten buiten het kader van de wet en vervolgens binnen drie jaar
      onvrijwillig werkloos wordt, wordt op zijn verzoek en indien hij blijkens een nieuwe indicatiebeschikking tot
      de doelgroep behoort, door het college op de oorspronkelijke datum van de indicatiebeschikking op de wachtlijst
      geplaatst.

      2 Een werknemer die werkloos wordt, wordt indien hij nog geïndiceerd is op zijn verzoek door het college op de
      oorspronkelijke datum van de indicatiebeschikking op de wachtlijst geplaatst.
    url: https://wetten.overheid.nl/BWBR0017240/2012-01-01#Artikel9
  - number: '11'
    text: |-
      1 Bij het tot stand doen brengen van begeleid werken, draagt het college zorg voor de arbeidsinpassing met inbegrip
      van de begeleiding van de geïndiceerde op zijn werkplek.

      2 Het college kan bij de taak op grond van het eerste lid een begeleidingsorganisatie inschakelen en deelt dit,
      indien hij daartoe wil overgaan, mee aan de geïndiceerde. Het college biedt daarbij de geïndiceerde de keuze uit
      ten minste twee begeleidingsorganisaties.

      3 Indien het college niet binnen zes maanden na de mededeling, bedoeld in het tweede lid, voor de
      geïndiceerde begeleid werken tot stand heeft gebracht, kan de geïndiceerde verzoeken een door hem aangewezen
      begeleidingsorganisatie in te schakelen ten behoeve van de totstandkoming van een dienstbetrekking. Het college
      willigt het verzoek van de geïndiceerde in, tenzij het verzoek kennelijk onredelijk is.
    url: https://wetten.overheid.nl/BWBR0017240/2012-01-01#Artikel11
  - number: '14'
    text: |-
      1 Indien de geïndiceerde begeleid werkt kan hij het college gemotiveerd verzoeken een andere
      begeleidingsorganisatie in te schakelen voor begeleiding op zijn werkplek, dan wel het college gemotiveerd
      verzoeken voor arbeidsinpassing ten behoeve van ander begeleid werk en begeleiding op zijn werkplek zorg te dragen.
      Het college willigt het verzoek van de geïndiceerde in, tenzij het verzoek kennelijk onredelijk is.

      2 Indien de geïndiceerde begeleid werkt kan het college met instemming van de geïndiceerde een andere
      begeleidingsorganisatie inschakelen voor begeleiding op zijn werkplek. De instemming van de geïndiceerde kan
      achterwege blijven indien de wijziging van begeleidingsorganisatie noodzakelijk is voor een adequate begeleiding
      op de werkplek of zonder de wijziging de kosten van de begeleiding niet in een redelijke verhouding staan tot het
      resultaat.
    url: https://wetten.overheid.nl/BWBR0017240/2012-01-01#Artikel14
  - number: '15'
    text: |-
      Bij de bepaling van het aantal gerealiseerde arbeidsjaren, bedoeld in de [artikelen 9][ref1] en
      [10 van de wet][ref2] en [artikel 18][ref3], wordt:

      a. onder het vervullen van een dienstbetrekking niet verstaan de situatie dat de werknemer niet werkt tenzij hij
      loon geniet op grond van [artikel 628][ref4], [629][ref5] of [639 van Boek 7 van het Burgerlijk Wetboek][ref6];

      b. onder geïndiceerde mede verstaan de persoon die op 31 december 1997 een dienstbetrekking heeft op grond van de
      Wet Sociale Werkvoorziening zolang de dienstbetrekking voortduurt alsmede de niet langer geïndiceerde persoon wiens
      indicatiebeschikking of herindicatiebeschikking tijdens de duur van de dienstbetrekking is ingetrokken of vervallen
      of van wie de geldigheidsduur van de indicatie tijdens de duur van de dienstbetrekking is verlopen;

      c. een gerealiseerd arbeidsjaar met 1,25 vermenigvuldigd voor een geïndiceerde ingezetene ingedeeld in de
      arbeidshandicapcategorie ernstig alsmede voor degene, bedoeld in onderdeel b, die laatstelijk was ingedeeld in
      die arbeidshandicapcategorie;

      d. het totaal van de door het college gerealiseerde arbeidsjaren berekend op honderdsten nauwkeurig waarbij
      vijfduizendste of meer naar boven wordt afgerond op een honderdste.


