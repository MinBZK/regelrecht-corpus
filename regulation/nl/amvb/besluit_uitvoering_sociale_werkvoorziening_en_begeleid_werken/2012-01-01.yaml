  - number: '16'
    text: |-
      1 Het op grond van [artikel 8, tweede lid, van de wet][ref1] vastgestelde aantal bij de uitkering, bedoeld in
      [artikel 8, eerste lid, van de wet][ref2] behorende minimumaantal arbeidsjaren wordt voor het jaar T als volgt
      vastgesteld:

      (A/B) x (C – D)

      waarbij:

      A staat voor het aantal geïndiceerde inwoners van de gemeente dat een dienstbetrekking heeft of op de wachtlijst
      staat op 31 december van het jaar T-2 volgens de bijlage, bedoeld in [artikel 13, vierde lid, van de wet][ref3], en
      volgens de verantwoordingsinformatie, bedoeld in [artikel 1, tweede lid, onderdeel a, van de wet][ref4], zoals die
      bijlage en verantwoordingsinformatie luiden op 15 augustus van het jaar T-1;

      B staat voor het aantal geïndiceerde inwoners van alle gemeenten samen dat een dienstbetrekking
      heeft of op de wachtlijst staat op 31 december van het jaar T-2 volgens het totaal van de bijlagen,
      bedoeld in [artikel 13, vierde lid, van de wet][ref5] en van de verantwoordingsinformatie, bedoeld in
      [artikel 1, tweede lid, onderdeel a, van de wet][ref6], zoals die bijlagen en verantwoordingsinformatie luiden op
      15 augustus van het jaar T-1;

      C staat voor het bij wet vast te stellen minimumaantal arbeidsjaren voor alle gemeenten samen voor het jaar T;

      D staat voor het bij ministeriële regeling vastgestelde totaal aantal arbeidsjaren nodig voor de toepassing van het
      zesde lid.

      2 Bij de berekening van de factoren A en B in het eerste lid wordt het aantal geïndiceerden dat is ingedeeld in de
      arbeidshandicapcategorie ernstig, vermenigvuldigd met 1,25.

      3 Bij de berekening van de factoren A en B wordt de werknemer die buiten Nederland woont als inwoner aangemerkt
      van de gemeente waarin hij laatstelijk in Nederland woonde, zolang de dienstbetrekking als bedoeld in
      [artikel 1, derde lid, van de wet][ref7] voortduurt.

      4 Bij de berekening van de factoren A en B wordt de persoon die op 31 december 1997 een dienstbetrekking heeft op
      grond van de Wet Sociale Werkvoorziening als geïndiceerde aangemerkt zolang de dienstbetrekking voortduurt, tenzij
      bij herindicatie is vastgesteld dat hij niet tot de doelgroep behoort.

      5 Indien de bijlage, bedoeld in [artikel 13, vierde lid, van de wet][ref8] niet is ontvangen voor 15 augustus van
      het jaar T-1 wordt, bij de berekening van de factoren A en B in het eerste lid, het aantal geïndiceerde inwoners
      van de desbetreffende gemeente dat een dienstbetrekking heeft of op de wachtlijst staat op 31 december van het jaar
      T-2 op nihil gesteld.

      6 Het minimumaantal arbeidsjaren voor het jaar T wordt vastgesteld op honderdsten nauwkeurig waarbij vijfduizendste
      of meer naar boven wordt afgerond op een honderdste en bedraagt een bij ministeriële regeling bepaald percentage
      van het voor de desbetreffende gemeente vastgestelde minimumaantal arbeidsjaren voor het jaar T-1.

      7 Onze Minister kan, op een gezamenlijk schriftelijk verzoek van twee colleges ingediend voor 1 september van
      het jaar T, het voor dat jaar op grond van het eerste tot en met zesde lid voor het ene college vastgesteld
      minimumaantal arbeidsjaren verlagen en het op grond van die leden voor het andere college vastgesteld minimumaantal
      arbeidsjaren met een gelijk aantal arbeidsjaren verhogen.

      8 Indien in het jaar T-1 een herindelingsregeling als bedoeld in
      [artikel 1 onderdeel f, van de Wet algemene regels herindeling][ref9] in werking is getreden en ten gevolge van
      deze regeling twee of meer gemeenten worden samengevoegd tot één gemeente op 1 januari volgend op de dag van
      inwerkingtreding van de regeling, wordt het minimumaantal arbeidsjaren voor laatstbedoelde gemeente vastgesteld
      op het totaal van de op grond van het eerste tot en met zesde lid vastgesteld minimumaantal arbeidsjaren voor de
      samengevoegde gemeenten.

      9 Indien in het jaar T-1 een herindelingsregeling als bedoeld in
      [artikel 1 onderdeel f, van de Wet algemene regels herindeling][ref10] in werking is getreden en ten gevolge van
      deze regeling een gemeente is opgeheven waardoor het inwonertal van ten minste twee gemeenten toeneemt op 1 januari
      volgend op de dag van inwerkingtreding van de regeling, kan Onze Minister, op een gezamenlijk schriftelijk verzoek
      van de betrokken colleges ingediend voor 1 december van het jaar T-1, het voor het jaar T op grond van het eerste
      tot en met zesde lid voor de gemeente die wordt opgeheven vastgesteld minimumaantal arbeidsjaren verlagen en het op
      grond van die leden voor de andere gemeenten vastgesteld minimumaantal arbeidsjaren met een in totaal gelijk aantal
      arbeidsjaren verhogen.


