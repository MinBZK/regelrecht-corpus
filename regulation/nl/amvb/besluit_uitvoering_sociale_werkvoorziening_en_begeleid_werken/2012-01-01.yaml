    text: |-
      Voor de toepassing van [artikel 16, eerste lid][ref1], voor het jaar 2009 staat bij de berekening van de factoren A
      en B:

      A voor het aantal geïndiceerde inwoners van de gemeente dat een dienstbetrekking dan wel een
      arbeidsovereenkomst heeft of op de wachtlijst staat en beschikbaar is om een dienstbetrekking als bedoeld in
      [artikel 2, eerste lid][ref2], of [artikel 7 van de wet][ref3] te aanvaarden op 31 december 2007 volgens de
      bijlage, bedoeld in [artikel 13, vierde lid, van de wet][ref4] zoals die bijlage luidt op 1 september 2008;

      B voor het aantal geïndiceerde inwoners van alle gemeenten samen dat een dienstbetrekking dan wel een
      arbeidsovereenkomst heeft of op de wachtlijst staat en beschikbaar is om een dienstbetrekking als bedoeld in
      [artikel 2, eerste lid][ref5], of [artikel 7 van de wet][ref6] te aanvaarden op 31 december 2007 volgens het totaal
      van de bijlagen, bedoeld in [artikel 13, vierde lid, van de wet][ref7] zoals die bijlagen luiden op 1 september
      2008.


