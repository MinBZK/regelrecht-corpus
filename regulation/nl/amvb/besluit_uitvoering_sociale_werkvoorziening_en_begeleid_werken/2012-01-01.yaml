      1 Het [Besluit indicatie sociale werkvoorziening][ref1], het
      [Besluit arbeidsinpassing en begeleiding sociale werkvoorziening][ref2],
      het [Besluit financieel verdeelmodel sociale werkvoorziening][ref3] en het
      [Besluit vaststelling subsidie Wet sociale werkvoorziening][ref4] worden ingetrokken.

      2 De in het eerste lid genoemde besluiten, zoals deze luidden op 31 december 2004, blijven van toepassing
      op de subsidievaststelling over perioden die gelegen zijn vóór 1 januari 2005, met dien verstande dat
      [artikel 11 van het Besluit vaststelling subsidie Wet sociale werkvoorziening][ref5] bij de subsidievaststelling
      over de subsidiejaren 2003 en 2004 niet wordt toegepast.


