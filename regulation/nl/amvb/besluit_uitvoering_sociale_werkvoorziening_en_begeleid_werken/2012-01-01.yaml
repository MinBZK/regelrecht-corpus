  - number: '6'
    text: |-
      1 Telkens uiterlijk 16 weken voor het verstrijken van de geldigheidsduur van een indicatie vraagt het college van
      de gemeente waar de geïndiceerde woont namens de geïndiceerde een herindicatie aan bij het Uitvoeringsinstituut
      werknemersverzekeringen.

      2 Bij de aanvraag voor een herindicatie verstrekt het college aan het Uitvoeringsinstituut werknemersverzekeringen
      in ieder geval recente gegevens betreffende:

      a. de wijze van functioneren van de geïndiceerde in de sociale werkvoorziening of het begeleid werken, en

      b. de uitvoering van de door het Uitvoeringsinstituut werknemersverzekeringen afgegeven adviezen.

      3 Bij de aanvraag voor een herindicatie op grond van [artikel 11, derde lid, van de wet][ref1]
      verstrekt het college in ieder geval tevens een re-integratieverslag als bedoeld in
      [artikel 25, derde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref2].

      4 Onverminderd het eerste lid vraagt het college van de gemeente waar de geïndiceerde woont op verzoek van of
      namens de geïndiceerde een herindicatie aan bij het Uitvoeringsinstituut werknemersverzekeringen op een eerder
      tijdstip dan bedoeld in het eerste lid. Het tweede lid is van toepassing.

      5 De [artikelen 2, tweede lid][ref3], [3][ref4], [4][ref5] en[ 5, eerste, tweede en vierde lid][ref6], zijn op
      een aanvraag tot herindicatie van overeenkomstige toepassing.

      6 Het Uitvoeringsinstituut werknemersverzekeringen betrekt bij een besluit over de herindicatie de op grond van het
      tweede lid van het college verkregen gegevens.


