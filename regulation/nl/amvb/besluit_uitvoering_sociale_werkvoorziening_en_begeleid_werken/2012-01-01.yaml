  - number: '2'
    text: |-
      1 Een aanvraag tot indicatie wordt ingediend door of namens de aanvrager bij het Uitvoeringsinstituut
      werknemersverzekeringen. Ondertekent de aanvrager de aanvraag tot indicatie niet zelf, dan wordt de reden daarvan
      vermeld.

      2 In de aanvraag wordt aangegeven of de aanvrager toestemming geeft tot het zo nodig raadplegen van behandelend
      artsen of psychologen en het gebruik maken van bij dezen aanwezige medische of psychologische gegevens.

      3 Na ontvangst van de aanvraag toetst het Uitvoeringsinstituut werknemersverzekeringen de woonplaats van de
      aanvrager en draagt er zonodig zorg voor dat de aanvrager als werkzoekende ingeschreven staat bij haar organisatie.

      4 Het Uitvoeringsinstituut werknemersverzekeringen tekent onverwijld de datum van ontvangst van de aanvraag aan,
      en zendt de aanvrager, of, indien namens hem een aanvraag is ingediend, degene die namens hem de aanvraag heeft
      ingediend, een bewijs van ontvangst.
    url: https://wetten.overheid.nl/BWBR0017240/2012-01-01#Artikel2
  - number: '3'
    text: |-
      1 In het kader van de aanvraag tot indicatie verricht het Uitvoeringsinstituut werknemersverzekeringen, met
      inachtneming van de bijlage behorend bij dit besluit, onderzoek naar:

      a. de beperkingen van de aanvrager van lichamelijke, verstandelijke en psychische aard;

      b. de mogelijkheid, dat de aanvrager in staat is passende arbeid te verrichten onder normale omstandigheden, zonder
      dat er sprake is van aanpassingen;

      c. de aanpassingen die voor de aanvrager noodzakelijk zijn en de vraag of deze binnen redelijke grenzen in een
      normale arbeidsomgeving kunnen worden gerealiseerd;

      d. de mogelijkheid, dat de aanvrager met de aanpassingen in staat is regelmatig arbeid in de sociale
      werkvoorziening of begeleid werken te verrichten;

      e. de indeling in een arbeidshandicapcategorie als bedoeld in [artikel 4, eerste lid][ref1];

      f. de mogelijkheid, dat de aanvrager een advies voor begeleid werken kan worden gegeven.

      2 Het onderzoek wordt op adequate wijze verricht door personen die over voldoende deskundigheid beschikken.

      3 Bij ministeriële regeling wordt bepaald wanneer bij het onderzoek een arbeidsdeskundige, een arts en een
      psycholoog wordt betrokken. Daarbij worden ook regels gesteld met betrekking tot de onverenigbaarheid van andere
      functies met die van deskundige als bedoeld in dit lid.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld over de wijze waarop het Uitvoeringsinstituut
      werknemersverzekeringen het onderzoek uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0017240#Artikel4
    url: https://wetten.overheid.nl/BWBR0017240/2012-01-01#Artikel3
