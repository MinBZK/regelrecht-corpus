  - number: 30a
    text: |-
      1 Voor de toepassing van [artikel 16, eerste lid][ref1], voor het jaar 2008 staat bij de berekening van de factoren
      A en B:

      A voor het aantal geïndiceerde inwoners van de gemeente dat een dienstbetrekking dan wel een arbeidsovereenkomst
      heeft of op de wachtlijst staat op 31 december 2006 volgens de op verzoek van Onze Minister verstrekte inlichtingen
      dienaangaande zoals deze luiden op 10 december 2007;

      B voor het aantal geïndiceerde inwoners van alle gemeenten samen dat een dienstbetrekking dan wel een
      arbeidsovereenkomst heeft of op de wachtlijst staat op 31 december 2006 volgens het totaal van de op verzoek van
      Onze Minister verstrekte inlichtingen dienaangaande zoals deze luiden op 10 december 2007.

      2 Indien de inlichtingen, bedoeld in het eerste lid, niet uiterlijk op 10 december 2007 in het bezit zijn gesteld
      van Onze Minister of niet zijn voorzien van een goedkeurende verklaring van de accountant, wordt bij de toepassing
      van het eerste lid voor de desbetreffende gemeente voor «31 december 2006» gelezen: 31 december 2005.

      3 Voor de toepassing van [artikel 16, zesde lid][ref2], voor het jaar 2008 wordt voor «een bij ministeriële
      regeling bepaald percentage van het voor de desbetreffende gemeente vastgestelde minimumaantal arbeidsjaren
      voor het jaar T-1» gelezen: 97,5 procent van het aantal voor de inwoners van de desbetreffende gemeente op 30
      juni 2007 gerealiseerde dienstbetrekkingen en arbeidsovereenkomsten als bedoeld in de [hoofdstukken 2][ref3] en
      [3 van de wet][ref4], zoals die luidde op die datum, uitgedrukt in standaardeenheden, volgens de op verzoek van
      Onze Minister verstrekte inlichtingen dienaangaande, zoals deze luiden op 10 december 2007.

      4 Indien de inlichtingen, bedoeld in het derde lid, niet uiterlijk op 10 december 2007 in het bezit zijn gesteld
      van Onze Minister of niet zijn voorzien van een goedkeurende verklaring van de accountant, zijn het derde lid en
      [artikel 16, zesde lid][ref5], voor de desbetreffende gemeente niet van toepassing.

      5 Indien het op grond van [artikel 16][ref6] in samenhang met de eerste vier leden van dit artikel vastgestelde
      minimumaantal arbeidsjaren voor een gemeente voor het jaar 2008 minder bedraagt dan hetgeen het geval zou
      zijn indien factor D, bedoeld in [artikel 16, zesde lid][ref7], nihil zou bedragen en het derde lid en
      [artikel 16, zesde lid][ref8], niet van toepassing zouden zijn, wordt het minimumaantal arbeidsjaren van de
      desbetreffende gemeente opgehoogd met:

      (K-L) / M x 986,71

      waarbij:

      K staat voor het voor de desbetreffende gemeente voor het jaar 2008 vast te stellen aantal arbeidsjaren indien
      factor D, bedoeld in het eerste lid, nihil zou bedragen en het derde lid en [artikel 16, zesde lid][ref9], niet van
      toepassing zouden zijn;

      L staat voor het op grond van [artikel 16][ref10] in samenhang met de eerste vier leden van dit artikel
      vastgestelde minimumaantal arbeidsjaren voor de desbetreffende gemeente voor het jaar 2008;

      M staat voor (K-L) voor alle desbetreffende gemeenten samen.

      6 Indien het vijfde lid van toepassing is wordt de uitkering aan het college, bedoeld in
      [artikel 17, eerste lid][ref11], verhoogd met:

      (K-L) / M x € 25 miljoen.


