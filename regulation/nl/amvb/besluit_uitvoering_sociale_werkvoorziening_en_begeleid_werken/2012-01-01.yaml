  - number: '18'
    text: |-
      1 De Stimuleringsuitkering begeleid werken aan het college wordt voor het jaar T als volgt vastgesteld:

      I x H/J

      waarbij:

      I staat voor het aantal gerealiseerde arbeidsjaren in begeleid werken van geïndiceerde inwoners van de gemeente in
      het jaar T;

      H staat voor de voor het jaar T bij wet vast te stellen middelen voor de Stimuleringsuitkering begeleid werken;

      J staat voor het aantal gerealiseerde arbeidsjaren in begeleid werken van geïndiceerde inwoners van alle gemeenten
      samen in het jaar T;

      H/J niet meer bedraagt dan € 3000.

      2 Onder begeleid werken als bedoeld in het eerste lid wordt verstaan een dienstbetrekking als bedoeld in
      [artikel 7 van de wet][ref1]:

      a. waarop niet de collectieve arbeidsovereenkomst voor de sociale werkvoorziening van toepassing is;

      b. waarbij de werkgever niet een rechtspersoon is als bedoeld in [artikel 2, tweede lid, van de wet][ref2] noch een
      dergelijke rechtspersoon houder is van aandelen die ten minste de helft van de stemmen in de algemene vergadering
      van de werkgever vertegenwoordigen dan wel anderszins op directe of indirecte wijze de bestuurlijke zeggenschap
      heeft binnen de werkgever; en

      c. die voldoet aan nader bij ministeriële regeling te stellen voorwaarden.

      3 De Stimuleringsuitkering begeleid werken wordt in hele euro’s vastgesteld waarbij een halve euro of meer naar
      boven wordt afgerond.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel7
