    text: |-
      Bij zijn advies, bedoeld in [artikel 6, derde lid, van de wet][ref1], betrekt het Uitvoeringsinstituut
      werknemersverzekeringen de krachtens [artikel 6 van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref2]
      gestelde regels met betrekking tot de toestemming.


