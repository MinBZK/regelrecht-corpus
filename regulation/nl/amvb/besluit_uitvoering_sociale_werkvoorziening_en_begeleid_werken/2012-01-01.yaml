  - number: '8'
    text: |-
      1 Plaatsing op de wachtlijst geschiedt op volgorde van de datum van de indicatiebeschikking.

      2 De plaatsing op de wachtlijst wordt beëindigd met ingang van de dag dat betrokkene:

      a. een dienstbetrekking als bedoeld in [artikel 2, eerste lid][ref1], of [artikel 7 van de wet][ref2] aanvaardt;

      b. zich blijvend in een andere gemeente vestigt;

      c. na een herindicatie als bedoeld [artikel 11 van de wet][ref3] niet langer tot de doelgroep behoort;

      d. met toepassing van [artikel 12 van de wet][ref4] zijn indicatiebeschikking of herindicatiebeschikking verliest;
      of

      e. niet beschikbaar is om een dienstbetrekking als bedoeld in [artikel 2, eerste lid][ref5], of
      [artikel 7 van de wet][ref6] te aanvaarden.

      De in de aanhef bedoelde dag wordt onverwijld geregistreerd.

      3 Met betrekking tot degenen die op 31 december 2007 op de wachtlijst staan geldt voor de toepassing van het eerste
      lid de datum van aanvraag tot indicatie als datum van de indicatiebeschikking.

      4 Indien de geïndiceerde zich blijvend in een andere gemeente vestigt, worden zijn gegevens door de gemeente waar
      hij gevestigd was overgedragen aan de gemeente waar hij zich gevestigd heeft. De gemeente waar de geïndiceerde zich
      gevestigd heeft plaatst hem op de wachtlijst overeenkomstig het eerste en derde lid.

      5 Het college verleent aan de geïndiceerde die op de wachtlijst is geplaatst op diens verzoek zodanige inzage in de
      geregistreerde gegevens, dat deze kan controleren of ten aanzien van hem de volgorde van plaatsing, bedoeld in het
      eerste juncto derde en vierde lid, is toegepast.

      6 Bij ministeriële regeling worden regels gesteld wanneer geïndiceerden beschikbaar zijn om een dienstbetrekking
      als bedoeld in [artikel 2, eerste lid][ref7], of [artikel 7 van de wet][ref8] te aanvaarden.


