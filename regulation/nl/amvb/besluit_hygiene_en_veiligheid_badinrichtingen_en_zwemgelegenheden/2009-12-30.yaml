  - number: '1.2'
    text: |-
      Het bevoegd bestuursorgaan stelt met ingang van 24 maart 2010 overeenkomstig bijlage II van de zwemwaterrichtlijn
      procedures voor de voorspelling en de aanpak bij een kortstondige verontreiniging vast. Bij ministeriële regeling
      kunnen nadere regels worden gesteld met betrekking tot die procedures.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel1
  - number: 1a
    text: |-
      Als categorieën van personen als bedoeld in [artikel 1 van de wet][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0002660#Artikel1
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0002660
        artikel: '1'
  - number: 1a.a
    text: |-
      personen die in een specifieke hoedanigheid anders dan bedoeld in onderdeel b, toegang hebben tot een
      badinrichting, niet zijnde een voor het publiek toegankelijke badinrichting of een privébadinrichting;
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel1a
  - number: 1a.b
    text: |-
      personen die zorg ontvangen in een instelling als bedoeld in
      [artikel 1, eerste lid, onderdeel f, van de Wet toelating zorginstellingen][ref1] of een inrichting waarin het
      beroep van fysiotherapeut klinisch of poliklinisch wordt uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel1
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '1'
  - number: '2.1'
    text: |-
      Ten aanzien van badinrichtingen, ingericht voor het zwemmen of baden anders dan in oppervlaktewater en waarvan
      tenminste één bassin een wateroppervlakte van 2 m2 of meer heeft en dieper is dan 0,50 meter, gelden de in dit
      hoofdstuk gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2
  - number: '2.2'
    text: |-
      De artikelen 4, eerste lid, en 5 tot en met 8, eerste lid, zijn niet van toepassing op bassins met eenmalig gebruik
      van water en doorstroomde bassins.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2
  - number: '2.3'
    text: |-
      De artikelen 4, eerste lid, 5, 6, eerste lid, 7, en 8, eerste lid, zijn niet van toepassing op bassins met een
      wateroppervlakte kleiner dan 15 m2 in badinrichtingen, die uitsluitend of in hoofdzaak toegankelijk zijn voor de in
      artikel 1a, onder b, bedoelde personen.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2
  - number: '2.4'
    text: |-
      Artikel 16 is niet van toepassing op badinrichtingen die uitsluitend of in hoofdzaak toegankelijk zijn voor de in
      artikel 1a bedoelde personen.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2
  - number: '2.5'
    text: |-
      De artikelen 13 en 20 zijn niet van toepassing op badinrichtingen die uitsluitend of in hoofdzaak toegankelijk zijn
      voor de in artikel 1a, onder b, bedoelde personen.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2
  - number: 2a.1
    text: |-
      Zwem- of badwater dat op zodanige wijze ter beschikking komt of wordt gebruikt dat daarbij aërosolen alsmede
      daardoor, al dan niet samen met andere micro-organismen, meegevoerde legionellabacteriën kunnen vrijkomen in
      hoeveelheden die, in geval van inademing, nadelige gevolgen kunnen hebben voor de volksgezondheid, bevat minder dan
      100 kolonievormende eenheden legionellabacteriën per liter.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2a
  - number: 2a.2
    text: |-
      De houder draagt er zorg voor dat voorafgaand aan de ingebruikneming van de badinrichting een analyse wordt
      uitgevoerd met betrekking tot het risico dat niet wordt voldaan aan het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2a
  - number: 2a.3
    text: |-
      Een risicoanalyse wordt bovendien uitgevoerd binnen drie maanden na iedere met het oog op het in het tweede lid
      bedoelde risico relevante wijziging van het zwem- of badwatersysteem.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2a
  - number: 2a.4
    text: 'De risicoanalyse omvat de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2a
  - number: 2a.4.a
    text: het inventariseren van de locaties binnen de badinrichting waar zich aërosolvorming kan voordoen;
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2a
  - number: 2a.4.b
    text: |-
      het verzamelen van gegevens betreffende het zwem- of badwatersysteem waarvan de onder a bedoelde locaties onderdeel
      uitmaken, waaronder in elk geval wordt begrepen:
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2a
  - number: 2a.4.b.1°
    text: een of meer tekeningen waarop het zwem- of badwatersysteem is aangegeven;
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2a
  - number: 2a.4.b.2°
    text: gegevens over de herkomst, aard en kwaliteit van het water;
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2a
  - number: 2a.4.b.3°
    text: gegevens over de gebruikte desinfectiemiddelen;
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2a
  - number: 2a.4.b.4°
    text: gegevens over de bedrijfsvoering van de installaties en de apparatuur;
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2a
  - number: 2a.4.b.5°
    text: gebruiksgegevens met betrekking tot de installaties en de apparatuur;
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2a
  - number: 2a.4.b.6°
    text: bezoekersaantallen;
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2a
  - number: 2a.4.c
    text: |-
      het beoordelen van het risico per onderdeel van het zwem- of badwatersysteem waarvan de onder a bedoelde locaties
      onderdeel uitmaken;
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2a
  - number: 2a.4.d
    text: |-
      vastlegging van de uitkomsten van de risicoanalyse, waarbij wordt aangegeven op welke punten in het zwem- en
      badwatersysteem het in het tweede lid bedoelde risico zich voor kan doen.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2a
  - number: 2a.5
    text: Onze Minister kan nadere regels stellen met betrekking tot de uitvoering van de risicoanalyse.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2a
  - number: 2a.6
    text: |-
      De houder draagt er zorg voor dat de uitkomsten van de risicoanalyse, met een overzicht van de daarbij gehanteerde
      gegevens en de eventueel genomen maatregelen, voor gedeputeerde staten ter inzage liggen in de badinrichting en aan
      hen op hun verzoek worden toegezonden in een door hen aangegeven vorm.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2a
  - number: 2a.7
    text: |-
      Indien gedeputeerde staten van oordeel zijn dat de risicoanalyse onjuist of onvolledig is uitgevoerd, dan wel
      indien zij zulks in verband met aan het zwem- of badwatersysteem aangebrachte wijzigingen noodzakelijk achten,
      kunnen zij de houder verplichten tot het wijzigen, aanvullen of opnieuw uitvoeren van de risicoanalyse binnen een
      daarbij aangegeven termijn.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2a
  - number: 2b.1
    text: |-
      Indien uit een analyse, als bedoeld in [artikel 2a][ref1], blijkt dat er sprake is van het in
      [artikel 2a, tweede lid][ref2], bedoelde risico, stelt de houder binnen drie maanden na het gereedkomen van
      de risicoanalyse een beheersplan op voor het zwem- of badwatersysteem van de badinrichting, dan wel herziet
      hij binnen drie maanden een bestaand beheersplan, indien de risicoanalyse daartoe aanleiding geeft. Het
      beheersplan heeft betrekking op de inrichting en het beheer van het zwem- of badwatersysteem en strekt ertoe
      dat op de in [artikel 2a, vierde lid, onder d][ref3], bedoelde risicopunten van het zwem- of badwatersyteem geen
      legionellabacteriëen voorkomen in concentraties van 100 of meer kolonievormende eenheden per liter.


      [ref1]: https://wetten.overheid.nl/BWBR0003716#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0003716#Artikel2a
      [ref3]: https://wetten.overheid.nl/BWBR0003716#Artikel2a
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0003716
        artikel: 2a
        hoofdstuk: II
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0003716
        artikel: 2a
        hoofdstuk: II
        paragraaf: 1a
      - id: ref3
        bwb_id: BWBR0003716
        artikel: 2a
        hoofdstuk: II
        paragraaf: 1a
  - number: 2b.2
    text: |-
      Indien uit de risicoanalyse, bedoeld in [artikel 2a, tweede lid][ref1], blijkt dat er sprake is van een risico
      als bedoeld in dat lid, stelt de houder in afwijking van het eerste lid, het beheersplan op voorafgaand aan de
      ingebruikneming van de badinrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0003716#Artikel2a
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0003716
        artikel: 2a
        hoofdstuk: II
        paragraaf: 1a
  - number: 2b.3
    text: |-
      Het eerste en tweede lid zijn niet van toepassing voor zover de houder het in [artikel 2a, tweede lid][ref1],
      bedoelde risico binnen drie maanden na het gereedkomen van de risicoanalyse opheft door zodanige wijzigingen in
      het zwem- of badwatersysteem, dat daardoor niet langer periodieke beheersmaatregelen zijn vereist, en hij deze
      wijzigingen meldt aan gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0003716#Artikel2a
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0003716
        artikel: 2a
        hoofdstuk: II
        paragraaf: 1a
  - number: 2b.4
    text: 'Het beheersplan omvat in elk geval de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2b
  - number: 2b.4.a
    text: |-
      de uitkomsten van de uitgevoerde risico-analyse, waaronder in ieder geval een inventarisatie van de in
      [artikel 2a, vierde lid, onder d][ref1], bedoelde risicopunten;


      [ref1]: https://wetten.overheid.nl/BWBR0003716#Artikel2a
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0003716
        artikel: 2a
        hoofdstuk: II
        paragraaf: 1a
  - number: 2b.4.b
    text: |-
      de controles en maatregelen die per risicopunt worden uitgevoerd ter voorkoming van legionellabesmetting, alsmede
      de frequentie daarvan;
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2b
  - number: 2b.4.c
    text: |-
      de maatregelen die worden genomen indien er aanwijzingen zijn dat op de in [artikel 2a, vierde lid, onder d][ref1],
      bedoelde risicopunten legionellabacteriën voorkomen in concentraties van 100 of meer kolonievormende eenheden per
      liter.


      [ref1]: https://wetten.overheid.nl/BWBR0003716#Artikel2a
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0003716
        artikel: 2a
        hoofdstuk: II
        paragraaf: 1a
  - number: 2b.5
    text: Onze Minister kan nadere regels stellen met betrekking tot de technische uitwerking van het beheersplan.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2b
  - number: 2b.6
    text: |-
      De houder draagt er zorg voor dat het beheersplan voor gedeputeerde staten ter inzage ligt in de badinrichting en
      aan hen op hun verzoek wordt toegezonden in een door hen aangegeven vorm.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2b
  - number: 2b.7
    text: |-
      Indien gedeputeerde staten van oordeel zijn dat met een beheersplan onvoldoende is gewaarborgd dat op de in de
      risicoanalyse geïdentificeerde risicopunten in het zwem- of badwatersysteem geen legionellabacteriën voorkomen in
      concentraties van 100 of meer kolonievormende eenheden per liter, kunnen zij de houder verplichten tot het binnen
      een daarvoor door hen gestelde termijn nemen van maatregelen die zij nodig achten om daarin te voorzien.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2b
  - number: 2c.1
    text: |-
      De houder laat de in het beheersplan vermelde risicopunten ten minste halfjaarlijks door een laboratorium als
      bedoeld in artikel 10 op de aanwezigheid van Legionella onderzoeken.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2c
  - number: 2c.2
    text: Hij voert de in het beheersplan opgenomen controles en maatregelen uit.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2c
  - number: 2c.3
    text: |-
      Hij houdt in een apart logboek aantekening van de op grond van het beheersplan uitgevoerde controles en maatregelen
      alsmede van de resultaten daarvan en draagt er zorg voor dat het logboek voor gedeputeerde staten ter inzage ligt
      in de badinrichting en aan hen op hun verzoek wordt toegezonden in een door hen aangegeven vorm.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2c
  - number: 2c.4
    text: |-
      Hij bewaart de risicoanalyse, het beheersplan alsmede het logboek ten minste vijf jaar voor inzage door
      gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2c
  - number: 2d.1
    text: |-
      De houder stelt bij vaststelling van een concentratie van legionellabacteriën van 100 of meer kolonievormende
      eenheden per liter op de in [artikel 2a, vierde lid, onder d][ref1], bedoelde risicopunten, gedeputeerde staten
      hiervan onmiddellijk in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0003716#Artikel2a
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2d
    references:
      - id: ref1
        bwb_id: BWBR0003716
        artikel: 2a
        hoofdstuk: II
        paragraaf: 1a
  - number: 2d.2
    text: |-
      De houder treft in overleg met gedeputeerde staten de maatregelen die met het oog op de in het eerste lid bedoelde
      omstandigheid in het beheersplan zijn opgenomen of, voor zover daaromtrent in het beheersplan geen maatregelen zijn
      opgenomen dan wel geen beheersplan van toepassing is, de maatregelen die in deze omstandigheden redelijkerwijs van
      hem kunnen worden gevergd, tenzij gedeputeerde staten anders voorschrijven.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel2d
  - number: '3.1'
    text: Het zwem- en badwater voldoet aan de normen die in de bij dit besluit behorende bijlage I zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel3
  - number: '3.2'
    text: Het water waarmee de bassins worden gevuld, is van drinkwaterkwaliteit.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel3
  - number: '4.1'
    text: |-
      De pompen waarmee het zwem- en badwater wordt rondgepompt, hebben een capaciteit als aangegeven in de bij dit
      besluit behorende bijlage III.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel4
  - number: '4.2'
    text: |-
      Er is een voorziening waardoor de pompen die dienen voor het toevoegen aan het zwem- en badwater van
      desinfectiemiddelen en van middelen voor correctie van de zuurgraad niet werken, wanneer er onvoldoende
      doorstroming is in de leiding waarin die middelen worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel4
  - number: '5'
    text: |-
      Van het water dat uit het bassin wordt afgevoerd naar de waterzuiveringsinstallatie wordt tenminste 30 procent
      afgevoerd door middel van overloopvoorzieningen die ter hoogte van het wateroppervlak zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel5
  - number: '6.1'
    text: |-
      In de toevoer naar of afvoer van de filters, die deel uitmaken van de waterzuiveringsinstallatie, is een
      voorziening waarmee de hoeveelheid water kan worden bepaald, die in een bepaalde tijdseenheid wordt toegevoerd,
      onderscheidenlijk afgevoerd. De nauwkeurigheid waarmee deze voorziening de hoeveelheid water bepaalt, wijkt ten
      hoogste 10 procent af van de werkelijke waarde.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel6
  - number: '6.2'
    text: De filters worden zo vaak als nodig is gereinigd.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel6
  - number: '7.1'
    text: |-
      Zandfilters worden gereinigd hetzij door middel van een terugspoelproces waarbij het filtermateriaal in fluïdisatie
      geraakt hetzij door middel van een hieraan tenminste gelijkwaardig proces.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel7
  - number: '7.2'
    text: |-
      Bij gesloten zandfilters waarbij het filtermateriaal in fluïdisatie geraakt is een voorziening waardoor dit in
      fluïdisatie geraken waargenomen kan worden.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel7
  - number: '7.3'
    text: Filters met filterpoeder worden gereinigd door middel van vervanging van het filterpoeder.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel7
  - number: '8.1'
    text: |-
      Wekelijks wordt een hoeveelheid water aan het zwem- en badwater toegevoegd, waarvan het aantal liters tenminste
      overeenkomt met het geschatte aantal zwemmers en baders in de betrokken week vermenigvuldigd met dertig. Indien
      gedurende ten minste drie maanden het gebonden beschikbaar chloorgehalte niet hoger is geweest dan 0,3 mg. per
      liter en geen overschrijding van andere normen, aangegeven in de bij dit besluit behorende bijlage I, heeft
      plaatsgevonden, kan de in de eerste volzin genoemde vermenigvuldigingsfactor worden verminderd tot vijftien.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel8
  - number: '8.2'
    text: Het toe te voegen water is van drinkwaterkwaliteit.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel8
  - number: '8.3'
    text: |-
      Het toe te voegen water wordt, voordat het in het bassin wordt gebracht, in de waterzuiveringsinstallatie
      behandeld.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel8
  - number: '9.1'
    text: |-
      De houder onderzoekt de parameters die zijn aangegeven in de bij dit besluit behorende bijlage I, ten minste zo
      vaak als in die bijlage is aangegeven.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel9
  - number: '9.2'
    text: Hij noteert de gegevens die het resultaat zijn van ieder onderzoek.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel9
  - number: '9.3'
    text: 'Hij noteert daarbij tevens:'
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel9
  - number: 9.3.a
    text: het tijdstip waarop het onderzoek is verricht, waaruit de gegevens zijn verkregen;
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel9
  - number: 9.3.b
    text: het geschatte aantal zwemmers en baders op de betrokken dag;
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel9
  - number: 9.3.c
    text: of, en zo ja, welke filters op de betrokken dag zijn gereinigd, en het tijdstip waarop dit is geschied;
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel9
  - number: 9.3.d
    text: of, en zo ja, van welke bassins op de betrokken dag de bodem is gereinigd;
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel9
  - number: 9.3.e
    text: |-
      de aard en hoeveelheid van de op de betrokken dag voor de zuivering van het zwem- of badwater gebruikte en aan het
      zwem- of badwater toegevoegde chemicaliën;
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel9
  - number: 9.3.f
    text: de hoeveelheid water die gedurende de betrokken dag aan het zwem- of badwater is toegevoegd;
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel9
  - number: 9.3.h
    text: andere bijzonderheden die van belang zijn uit het oogpunt van hygiëne.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel9
  - number: '9.4'
    text: Hij bewaart de in het tweede en derde lid bedoelde gegevens ten minste twee jaar.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel9
  - number: '10.1'
    text: |-
      De houder laat door een laboratorium dat een kwaliteitsborgingssysteem hanteert dat gebaseerd is op de norm NEN-
      EN-ISO/IEC 17 025, zoals deze luidde in april 2000, dan wel op een andere daaraan gelijkwaardige norm die terzake
      geldt in een andere lidstaat van de Europese Unie dan wel in een staat die partij is bij de overeenkomst inzake
      de Europese Economische Ruimte de parameters die zijn aangegeven in de bij dit besluit behorende bijlage I,
      onderzoeken, ten minste zo vaak als in die bijlage is aangegeven, op de in de bij dit besluit behorende bijlage IV
      aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel10
  - number: '10.2'
    text: Hij laat de gegevens die het resultaat zijn van ieder onderzoek, in een aan hem uit te brengen rapport noteren.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel10
  - number: '10.3'
    text: 'Hij laat in het rapport tevens noteren:'
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel10
  - number: 10.3.a
    text: het geschatte aantal zwemmers en baders op de dag vóór het ingevolge het eerste lid verrichte onderzoek;
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel10
  - number: 10.3.b
    text: het tijdstip waarop het onderzoek is verricht waaruit de gegevens zijn verkregen;
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel10
  - number: 10.3.c
    text: het geschatte aantal zwemmers en baders op de betrokken dag tot dat tijdstip.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel10
  - number: '11'
    text: |-
      Er zijn voldoende voorzieningen om de ingevolge de artikelen 9 en 10 te verrichten metingen en monsternemingen
      mogelijk te maken.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel11
  - number: '12.1'
    text: 'Gedeputeerde staten kunnen in bijzondere gevallen bepalen dat:'
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel12
  - number: 12.1.a
    text: |-
      ten aanzien van andere parameters dan die welke in de bij dit besluit behorende bijlage I zijn aangegeven,
      onderzoek wordt verricht;
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel12
  - number: 12.1.b
    text: vaker onderzoek naar de in bijlage I aangegeven parameters wordt verricht dan in die bijlage is aangegeven.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel12
  - number: '12.2'
    text: De houder is verplicht te voldoen aan een beschikking als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel12
  - number: '13.1'
    text: Er zijn voldoende douches en toiletten.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel13
  - number: '13.2'
    text: |-
      In overdekte baden bevinden de douches zich langs de voor de bezoekers gebruikelijke wegen tussen de kleedruimten
      en de bassins; in openlucht-baden nabij de bassins.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel13
  - number: '13.3'
    text: |-
      Toiletten bevinden zich in ieder geval in of nabij de wachtruimten en langs de voor de bezoekers gebruikelijke
      wegen tussen de kleedruimten en de doucheruimten, op dezelfde verdieping als de bassins.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel13
  - number: '14'
    text: De deuren en de wanden van de doucheruimten zijn voorzien van vlak afgewerkt, waterdicht materiaal.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel14
  - number: '15.1'
    text: 'Vloeren die bestemd zijn om met blote voeten te worden betreden, zijn:'
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel15
  - number: 15.1.a
    text: zo vervaardigd dat zij voldoende weerstand bieden tegen uitglijden;
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel15
  - number: 15.1.b
    text: van een zodanig afschot voorzien dat zich geen plassen kunnen vormen;
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel15
  - number: 15.1.c
    text: zodanig aangelegd dat het afvloeien van schrobwater of regenwater in het bassin niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel15
  - number: '15.2'
    text: |-
      In overdekte ruimten zijn vloeren, als bedoeld in het eerste lid, vervaardigd van vlak afgewerkt, waterdicht
      materiaal.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel15
  - number: '16.1'
    text: Er zijn voldoende kleed- en garderoberuimten.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel16
  - number: '16.2'
    text: |-
      Waar kleding met de wanden van deze ruimten in aanraking kan komen, zijn deze voorzien van vlak afgewerkt,
      waterdicht materiaal.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel16
  - number: '17.1'
    text: |-
      In toiletten, douche-, kleed-, garderobe- en wachtruimten wordt gedurende de openingsuren de lucht in voldoende
      mate ververst.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel17
  - number: '17.2'
    text: |-
      De ruimten, bedoeld in het eerste lid, alsook de in artikel 15 bedoelde vloeren, worden tevens regelmatig gereinigd
      en gedesinfecteerd.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel17
  - number: '18.1'
    text: De bodem en de wanden van de bassins zijn vervaardigd van vlak afgewerkt, waterdicht materiaal.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel18
  - number: '18.2'
    text: |-
      De bodem en wanden van het bassin worden regelmatig gereinigd. Bodem en wanden van bassins met eenmalig gebruik van
      water worden tevens in voldoende mate gedesinfecteerd.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel18
  - number: '19'
    text: |-
      Voorwerpen die met de zwemmers of baders of het zwem- of badwater in aanraking kunnen komen, zijn van zodanig
      materiaal vervaardigd dat zij gemakkelijk gereinigd kunnen worden.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel19
  - number: '20.1'
    text: |-
      Indien de diepte van het zwem- of badwater gelijk is aan of minder is dan 1,10 meter, heeft de bodem geen steilere
      helling dan 0,06 meter per strekkende meter en biedt de bodem voldoende weerstand tegen uitglijden.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel20
  - number: '20.2'
    text: |-
      Indien de diepte van het zwem- of badwater meer is dan 1,10 meter, maar gelijk is aan of minder is dan 1,40 meter,
      en de bodem een steilere helling heeft dan 0,06 meter per strekkende meter, is 0,50 meter voor het begin van deze
      steilere helling een drijflijn aanwezig.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel20
  - number: '20.3'
    text: |-
      Indien de diepte van het zwem- of badwater meer is dan 1,40 meter, is langs de lange wanden van het bassin op een
      diepte van ten minste 1,00 meter en ten hoogste 1,20 meter beneden de waterspiegel een voorziening aangebracht
      waarop zwemmers en baders kunnen staan. Tevens is langs de lange wanden, ten hoogste 0,35 meter boven de
      waterspiegel, een voorziening aangebracht waaraan zwemmers en baders zich vast kunnen houden.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel20
  - number: '21'
    text: |-
      De diepte van het zwem- en badwater is voor de zwemmers en baders duidelijk zichtbaar aangegeven op alle punten
      waar dit met het oog op hun veiligheid van belang is.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel21
  - number: '22'
    text: |-
      Openingen beneden de waterspiegel zijn zodanig uitgevoerd dat zwemmers en baders niet kunnen worden vastgezogen of
      bekneld kunnen raken.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel22
  - number: '23'
    text: In overdekte baden is een voorziening voor noodverlichting aanwezig.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel23
  - number: '24.1'
    text: |-
      Indien de diepte van het zwem- of badwater gelijk is aan of minder is dan 1,40 meter, zijn er geen
      springvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel24
  - number: '24.2'
    text: |-
      Indien de diepte van het zwem- of badwater meer is dan 1,40 meter, maar gelijk is aan of minder is dan 2,00 meter,
      zijn er geen andere springvoorzieningen dan startblokken.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel24
  - number: '24.3'
    text: Het loopvlak van de springvoorzieningen biedt voldoende weerstand tegen uitglijden.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel24
  - number: '24.4'
    text: |-
      Indien het loopvlak van een springvoorziening zich op een hoogte van meer dan 1,00 meter boven de waterspiegel of
      het perron bevindt, is de springvoorziening aan de zijkanten zodanig van leuningen voorzien dat deze lopen van het
      begin van de springvoorziening tot ten minste 0,50 meter voorbij het punt dat zich loodrecht boven de rand van het
      bassin bevindt.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel24
  - number: '25.1'
    text: In de badinrichting wordt gedurende de openstelling in voldoende mate toezicht uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel25
  - number: '25.2'
    text: |-
      Het eerste lid is ten aanzien van badinrichtingen, die uitsluitend of in hoofdzaak toegankelijk zijn voor de in
      artikel 1*a* bedoelde personen, buiten de uren dat die badinrichtingen voor het publiek zijn opengesteld slechts
      van toepassing, voor zover de diepte van het zwem- of badwater meer is dan 1,40 meter.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel25
  - number: '26'
    text: |-
      Ten aanzien van badinrichtingen, ingericht voor het zwemmen of baden anders dan in oppervlaktewater en waarvan
      tenminste één bassin een wateroppervlakte van 2 m2 of meer heeft en geen van de bassins dieper is dan 0,50 meter,
      gelden de in dit hoofdstuk gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel26
  - number: '27'
    text: Het water waarmee de bassins worden gevuld is van drinkwaterkwaliteit.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel27
  - number: '28'
    text: |-
      Indien de oppervlakte van de tot de inrichting behorende bassins 250 m2 of meer is, zijn in de badinrichting
      voldoende toiletten aanwezig.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel28
  - number: '29'
    text: De artikelen 15, 18 en 19 zijn van toepassing.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel29
  - number: '30'
    text: Ook overigens worden voldoende voorzieningen getroffen ten behoeve van de reinheid.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel30
  - number: '31'
    text: Er zijn geen springvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel31
  - number: '32'
    text: |-
      Artikel 20, eerste lid, is van overeenkomstige toepassing tenzij het een inrichting betreft die uitsluitend
      toegankelijk is voor personen, bedoeld in artikel 1a, onder b.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel32
  - number: '33'
    text: Ook overigens worden voldoende voorzieningen getroffen ten behoeve van de veiligheid.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel33
  - number: '34'
    text: |-
      Ten aanzien van badinrichtingen, ingericht voor het zwemmen of baden in oppervlaktewater, gelden de in dit
      hoofdstuk gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel34
  - number: '36.1'
    text: |-
      De houder onderzoekt de parameters die zijn aangegeven in de bij dit besluit behorende bijlage II, ten minste zo
      vaak als in die bijlage is aangegeven.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel36
  - number: '36.2'
    text: Hij noteert de gegevens die het resultaat zijn van ieder onderzoek.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel36
  - number: '36.3'
    text: Hij noteert daarbij tevens bijzonderheden die van belang zijn uit het oogpunt van hygiëne.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel36
  - number: '36.4'
    text: Hij bewaart de in het tweede en derde lid bedoelde gegevens ten minste twee jaar.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel36
  - number: '37.1'
    text: |-
      Gedeputeerde staten kunnen bepalen dat de houder door een laboratorium als bedoeld in artikel 10, eerste lid,
      onderzoek laat verrichten naar de bacteriën Intestinale Enterokokken en Escherichia coli, alsmede andere door
      gedeputeerde staten daartoe aangewezen parameters.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel37
  - number: '37.2'
    text: De houder is verplicht te voldoen aan een beschikking als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel37
  - number: '37.3'
    text: De gegevens, die het resultaat zijn van ieder onderzoek, worden in een rapport genoteerd.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel37
  - number: '37.4'
    text: |-
      De in het derde lid bedoelde gegevens worden zo spoedig mogelijk gezonden aan het bevoegd bestuursorgaan en aan
      gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel37
  - number: '38.1'
    text: |-
      Een onderzoek, als bedoeld in artikel 37, wordt voor zover het betrekking heeft op parameters die in de bij dit
      besluit behorende bijlage II zijn aangegeven, verricht op de in de bij dit besluit behorend bijlage IV aangegeven
      wijze.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel38
  - number: '38.2'
    text: |-
      Indien de beschikking van gedeputeerde staten betrekking heeft op onderzoek naar andere parameters, wordt het
      onderzoek verricht op de in de beschikking aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel38
  - number: '39'
    text: Er zijn voldoende toiletten.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel39
  - number: '40.1'
    text: |-
      De grenzen van het voor het zwemmen of baden bestemde gedeelte van het water dat tot de badinrichting behoort, zijn
      op voor de bezoekers duidelijke wijze aangegeven.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel40
  - number: '40.2'
    text: |-
      Indien de diepte van het zwem- of badwater minder is dan 1,40 meter, heeft de bodem geen steilere helling dan 0,06
      meter per strekkende meter.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel40
  - number: '40.3'
    text: De voor zwemmers of baders gevaarlijke plaatsen in de gedeelten waarin wordt gezwommen of gebaad worden aangeduid.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel40
  - number: '41'
    text: Artikel 24 is van toepassing.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel41
  - number: '42'
    text: De houder neemt maatregelen ter voorkoming van gladheid.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel42
  - number: '43'
    text: Artikel 25 is van toepassing.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel43
  - number: '44'
    text: Dit hoofdstuk is van toepassing op aangewezen locaties.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44
  - number: 44a.1
    text: Het bevoegd bestuursorgaan verzamelt voor elke aangewezen locatie een reeks zwemwaterkwaliteitsgegevens.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44a
  - number: 44a.2
    text: |-
      Het bevoegd bestuursorgaan voert na afloop van elk badseizoen met ingang van het badseizoen van 2012 voor elke
      aangewezen locatie de zwemwaterkwaliteitsbeoordeling uit:
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44a
  - number: 44a.2.a
    text: overeenkomstig de criteria van bijlage II van de zwemwaterrichtlijn, en
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44a
  - number: 44a.2.b
    text: |-
      aan de hand van de reeks zwemwaterkwaliteitsgegevens die verzameld zijn over een periode bestaande uit dat
      badseizoen en de drie voorgaande badseizoenen.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44a
  - number: 44a.3
    text: |-
      De beoordelingsperiode kan eenmaal in de vijf jaar worden gewijzigd in een periode bestaande uit de drie voorgaande
      badseizoenen, dan wel een periode bedoeld in het tweede lid, onder b.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44a
  - number: 44a.4
    text: |-
      Een zwemwaterkwaliteitsbeoordeling kan worden uitgevoerd aan de hand van zwemwaterkwaliteitsgegevens die betrekking
      hebben op minder dan vier badseizoenen, indien:
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44a
  - number: 44a.4.a
    text: de locatie minder dan vier badseizoenen geleden is aangewezen;
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44a
  - number: 44a.4.b
    text: |-
      wijzigingen zijn opgetreden die de indeling, bedoeld in [artikel 44b][ref1], van de aangewezen locatie zullen
      of redelijkerwijs zullen beïnvloeden, in welk geval de beoordeling wordt uitgevoerd aan de hand van een reeks
      zwemwaterkwaliteitsgegevens die alleen bestaan uit de resultaten voor monsters die genomen zijn nadat de
      wijzigingen zijn opgetreden.


      [ref1]: https://wetten.overheid.nl/BWBR0003716#Artikel44b
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0003716
        artikel: 44b
        hoofdstuk: V
        paragraaf: '2'
  - number: 44a.5
    text: |-
      Een reeks zwemwaterkwaliteitsgegevens die wordt gebruikt voor zwemwaterkwaliteitsbeoordeling is gebaseerd op een
      bij ministeriële regeling te bepalen aantal monsters.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44a
  - number: 44a.6
    text: Aangewezen locaties mogen ten behoeve van de zwemwaterkwaliteitsbeoordeling worden onderverdeeld of gegroepeerd.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44a
  - number: 44a.7
    text: 'Aangewezen locaties worden alleen gegroepeerd indien zij:'
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44a
  - number: 44a.7.a
    text: aangrenzend zijn,
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44a
  - number: 44a.7.b
    text: tijdens de vier voorgaande jaren op dezelfde wijze beoordeeld zijn op grond van het tweede, derde en vierde lid, en
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44a
  - number: 44a.7.c
    text: een zwemwaterprofiel vertonen met gemeenschappelijke risicofactoren, dan wel zonder risicofactoren.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44a
  - number: 44b.1
    text: |-
      Het bevoegd bestuursorgaan deelt met ingang van het badseizoen van 2012 een aangewezen locatie overeenkomstig de
      criteria uit bijlage II van de zwemwaterrichtlijn in de volgende klassen in:
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44b
  - number: 44b.1.a
    text: slecht;
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44b
  - number: 44b.1.b
    text: aanvaardbaar;
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44b
  - number: 44b.1.c
    text: goed, of
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44b
  - number: 44b.1.d
    text: uitstekend.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44b
  - number: 44b.2
    text: |-
      De indeling vindt jaarlijks na afloop van het badseizoen plaats op grond van de zwemwaterkwaliteitsbeoordeling,
      bedoeld in [artikel 44a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003716#Artikel44a
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44b
    references:
      - id: ref1
        bwb_id: BWBR0003716
        artikel: 44a
        hoofdstuk: V
        paragraaf: '2'
  - number: 44b.3
    text: Het bevoegd bestuursorgaan deelt de indeling jaarlijks mee aan gedeputeerde staten zodra zij bekend is.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44b
  - number: 44b.4
    text: |-
      Het bevoegd bestuursorgaan neemt de nodige maatregelen opdat het zwemwater aan het einde van het badseizoen van
      2015 ten minste voldoet aan de klasse aanvaardbaar.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44b
  - number: 44b.5
    text: |-
      Het bevoegd bestuursorgaan neemt de naar zijn oordeel realistische en evenredige maatregelen om het aantal als
      uitstekend of goed ingedeelde locaties te doen toenemen.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44b
  - number: 44b.6
    text: |-
      In afwijking van de termijn, genoemd in het vierde lid, kan het bevoegd bestuursorgaan een locatie in de klasse
      slecht indelen, indien met ingang van het badseizoen volgend op dat van de indeling:
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44b
  - number: 44b.6.a
    text: |-
      gedeputeerde staten passende beheersmaatregelen nemen, waaronder toepassing geven aan
      [artikel 11, eerste lid, van de wet][ref1] door onderscheidenlijk sluiting van de betrokken badinrichting te
      gelasten, een zwemverbod in te stellen of een negatief zwemadvies uit te brengen teneinde de blootstelling van
      zwemmers aan verontreiniging te voorkomen,


      [ref1]: https://wetten.overheid.nl/BWBR0002660#Artikel11
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44b
    references:
      - id: ref1
        bwb_id: BWBR0002660
        artikel: '11'
  - number: 44b.6.b
    text: |-
      het bevoegd bestuursorgaan de oorzaken waarom de klasse aanvaardbaar niet is bereikt identificeert en passende
      maatregelen neemt om de oorzaken van verontreiniging te voorkomen, te verkleinen of weg te nemen, en
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44b
  - number: 44b.6.c
    text: |-
      gedeputeerde staten het publiek overeenkomstig [artikel 44g][ref1] voorlichten.


      [ref1]: https://wetten.overheid.nl/BWBR0003716#Artikel44g
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44b
    references:
      - id: ref1
        bwb_id: BWBR0003716
        artikel: 44g
        hoofdstuk: V
        paragraaf: '5'
  - number: 44c.1
    text: |-
      Het bevoegd bestuursorgaan stelt met ingang van 24 maart 2011 voor een aangewezen locatie een zwemwaterprofiel op
      overeenkomstig bijlage III van de zwemwaterrichtlijn.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44c
  - number: 44c.2
    text: |-
      Een zwemwaterprofiel mag betrekking hebben op één aangewezen locatie of op meerdere aangrenzende aangewezen
      locaties.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44c
  - number: 44d.1
    text: Het bevoegd bestuursorgaan onderzoekt de in bijlage I, kolom A, van de zwemwaterrichtlijn genoemde parameters.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44d
  - number: 44d.2
    text: |-
      Het bevoegd bestuursorgaan voert het onderzoek uit overeenkomstig bijlage IV en V van de zwemwaterrichtlijn met een
      bij ministeriële regeling bepaalde frequentie.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44d
  - number: 44d.3
    text: |-
      Voor de aanvang van elk badseizoen stelt het bevoegd bestuursorgaan voor elke aangewezen locatie een tijdschema
      voor het onderzoek vast.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44d
  - number: 44d.4
    text: Het onderzoek wordt uitgevoerd binnen vier dagen na de in het tijdschema bepaalde datum.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44d
  - number: 44d.5
    text: |-
      Tijdens een kortstondige verontreiniging genomen monsters mogen buiten beschouwing worden gelaten. Zij worden
      vervangen door overeenkomstig bijlage IV van de zwemwaterrichtlijn genomen monsters.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44d
  - number: 44d.6
    text: |-
      In een abnormale situatie kan het tijdschema, bedoeld in het derde lid, worden geschorst. De uitvoering wordt,
      zodra de abnormale situatie een einde heeft genomen, hervat waarna zo spoedig mogelijk nieuwe monsters worden
      genomen ter compensatie van het monstervrije interval.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44d
  - number: 44d.7
    text: 'Het controlepunt is de locatie in het zwemwater waar:'
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44d
  - number: 44d.7.a
    text: de meeste zwemmers worden verwacht, of
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44d
  - number: 44d.7.b
    text: volgens het zwemwaterprofiel het grootste risico van verontreiniging wordt verwacht.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44d
  - number: 44d.8
    text: |-
      Het bevoegd bestuursorgaan voert de zwemwateranalyse uit in overeenstemming met een bij ministeriële regeling
      bepaalde referentiemethode.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44d
  - number: 44e.1
    text: |-
      Wanneer het zwemwaterprofiel, bedoeld in [artikel 44c][ref1], wijst op een mogelijke proliferatie van
      cyanobacteriën of een neiging tot proliferatie van macroalgen of marien fytoplankton, voert het bevoegd
      bestuursorgaan met ingang van 2012 een passend onderzoek uit ten einde gezondheidsrisico’s te kunnen vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0003716#Artikel44c
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44e
    references:
      - id: ref1
        bwb_id: BWBR0003716
        artikel: 44c
        hoofdstuk: V
        paragraaf: '3'
  - number: 44e.2
    text: |-
      Gedeputeerde staten beoordelen op grond van de resultaten van het onderzoek, genoemd in het eerste lid, de
      gezondheidsrisico’s.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44e
  - number: 44e.3
    text: |-
      Indien zich een proliferatie van cyanobacteriën voordoet en gedeputeerde staten een gezondheidsrisico vaststellen
      of vermoeden, nemen gedeputeerde staten en het bevoegd bestuursorgaan onmiddellijk passende beheersmaatregelen ter
      voorkoming van blootstelling. In ieder geval lichten gedeputeerde staten het publiek voor.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44e
  - number: 44e.4
    text: |-
      Indien zich een proliferatie van macroalgen of marien fytoplankton voordoet en gedeputeerde staten een
      gezondheidsrisico vaststellen of vermoeden, nemen gedeputeerde staten en het bevoegd bestuursorgaan passende
      beheersmaatregelen. In ieder geval lichten gedeputeerde staten het publiek voor.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44e
  - number: 44e.5
    text: |-
      De wijze waarop en de frequentie waarmee het onderzoek wordt uitgevoerd, kan bij ministeriële regeling nader worden
      geregeld.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44e
  - number: 44f.1
    text: |-
      Het bevoegd bestuursorgaan inspecteert met ingang van het badseizoen van 2012 het zwemwater op aangewezen locaties
      visueel op verontreiniging door teerachtige residuen, glas, plastic, rubber of ander afval.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44f
  - number: 44f.2
    text: |-
      Indien het bevoegd bestuursorgaan een verontreiniging als bedoeld in het eerste lid vaststelt, nemen het bevoegd
      bestuursorgaan en gedeputeerde staten passende beheersmaatregelen. Indien zij oordelen dat dit nodig is, lichten
      gedeputeerde staten het publiek voor.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44f
  - number: 44g
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de voorlichting van het publiek die gedeputeerde
      staten met ingang van het badseizoen van 2012 op een passende wijze in de nabijheid van een aangewezen locatie en
      via passende media en technologie verstrekken omtrent zwemwater.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel44g
  - number: '45'
    text: |-
      Het bevoegd bestuursorgaan neemt tijdig passende beheersmaatregelen wanneer het op de hoogte is van onverwachte
      situaties die een negatief effect hebben of redelijkerwijs kunnen hebben op de zwemwaterkwaliteit en op de
      gezondheid van zwemmers. In ieder geval lichten gedeputeerde staten het publiek voor en gelasten, zo nodig,
      sluiting van een badinrichting, dan wel stellen een zwemverbod in.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel45
  - number: 45a
    text: |-
      Gedeputeerde staten zijn bevoegd om een locatie die op grond van [artikel 10b, eerste lid, van de wet][ref1]
      is aangemerkt niet aan te wijzen indien voor die locatie toepassing is gegeven aan
      [artikel 11, tweede lid, van de wet][ref2] door onderscheidenlijk sluiting van de betrokken inrichting te gelasten,
      een zwemverbod in te stellen of een negatief zwemadvies uit te brengen indien de maatregelen teneinde ten minste te
      voldoen aan de klasse aanvaardbaar niet uitvoerbaar of onevenredig kostbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002660#Artikel10b
      [ref2]: https://wetten.overheid.nl/BWBR0002660#Artikel11
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0002660
        artikel: 10b
      - id: ref2
        bwb_id: BWBR0002660
        artikel: '11'
  - number: '46'
    text: |-
      De perrons en de vloeren en wanden van bassins en andere in de badinrichting aanwezige ruimten, alsmede de in of op
      die perrons, bassins en andere ruimten aanwezige voorzieningen zijn zo afgewerkt dat de bezoekers zich niet kunnen
      bezeren aan scherpe randen of uitsteeksels.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel46
  - number: '47'
    text: |-
      De in een badinrichting aanwezige voorzieningen, als in dit besluit voorgeschreven, functioneren deugdelijk;
      badinrichtingen verkeren in voldoende staat van onderhoud en reinheid.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel47
  - number: '48.1'
    text: |-
      De [hoofdstukken II][ref1], [III][ref2], [IV][ref3], [V][ref4] voor zover het een badinrichting betreft en
      [VI][ref5] van dit besluit gelden slechts gedurende het gedeelte van het jaar, waarin de badinrichting is
      opengesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003716#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0003716#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0003716#HoofdstukIV
      [ref4]: https://wetten.overheid.nl/BWBR0003716#HoofdstukV
      [ref5]: https://wetten.overheid.nl/BWBR0003716#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0003716
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003716
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0003716
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0003716
        hoofdstuk: V
      - id: ref5
        bwb_id: BWBR0003716
        hoofdstuk: IV
  - number: '48.2'
    text: |-
      [Hoofdstuk V][ref1] en, voor zover het geen badinrichtingen betreft, [hoofdstuk VI][ref2], gelden slechts voor de
      krachtens [artikel 1, tweede lid, van de wet][ref3] bepaalde duur van het badseizoen.


      [ref1]: https://wetten.overheid.nl/BWBR0003716#HoofdstukV
      [ref2]: https://wetten.overheid.nl/BWBR0003716#HoofdstukVI
      [ref3]: https://wetten.overheid.nl/BWBR0002660#Artikel1
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0003716
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0003716
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0002660
        artikel: '1'
  - number: '49.1'
    text: 'Het bevoegd bestuursorgaan verstrekt aan Onze Minister en Onze Minister van Verkeer en Waterstaat:'
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel49
  - number: 49.1.a
    text: |-
      de uitkomsten van de zwemwaterkwaliteitsbeoordeling, bedoeld in [artikel 44a, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003716#Artikel44a
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0003716
        artikel: 44a
        hoofdstuk: V
        paragraaf: '2'
  - number: 49.1.b
    text: |-
      de uitkomsten van het onderzoek, bedoeld in [artikel 44d, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003716#Artikel44d
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0003716
        artikel: 44d
        hoofdstuk: V
        paragraaf: '4'
  - number: 49.1.c
    text: |-
      iedere schorsing van het tijdschema, bedoeld in [artikel 44d, derde lid][ref1], en de reden hiervoor, en


      [ref1]: https://wetten.overheid.nl/BWBR0003716#Artikel44d
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0003716
        artikel: 44d
        hoofdstuk: V
        paragraaf: '4'
  - number: 49.1.d
    text: een beschrijving van de uitgevoerde beheersmaatregelen met betrekking tot aangewezen locaties.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel49
  - number: '49.2'
    text: |-
      Gedeputeerde staten verstrekken aan de in het eerste lid genoemde ministers informatie over iedere toepassing van
      [artikel 11 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002660#Artikel11
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002660
        artikel: '11'
  - number: '49.3'
    text: |-
      Bij ministeriële regeling kan worden bepaald op welke wijze de gegevens, bedoeld in het eerste en tweede lid,
      worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel49
  - number: '50'
    text: 'Dit besluit wordt aangehaald als: Besluit hygiëne en veiligheid badinrichtingen en zwemgelegenheden.'
    url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#Artikel50
