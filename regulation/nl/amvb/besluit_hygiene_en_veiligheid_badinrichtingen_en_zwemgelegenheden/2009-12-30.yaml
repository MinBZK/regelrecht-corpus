preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 28 maart 1984,
    nr. MJZ 2834011, Centrale Directie Juridische Zaken;

    Gelet op de artikelen 3, 4, 10a, derde en vierde lid jo eerste lid, 11 en 28 van de Wet hygiëne en veiligheid
    zwemgelegenheden (Stb. 1982, 494) en op artikel III van de Wet van 2 juni 1982, houdende wijziging van de Wet
    hygiëne en veiligheid zweminrichtingen (Stb. 1982, 493);

    De Raad van State gehoord (advies van 28 augustus 1984, no. W08.84.0163/12.4.34);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 5 oktober
    1984, Centrale Directie Juridische Zaken, nr. MJZ-0504033;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003716/2009-12-30#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - aangewezen locatie: plaats in
      oppervlaktewater die is aangewezen op grond van [artikel 10b, tweede lid, van de wet][ref1];
        - abnormale situatie: gebeurtenis of combinatie van gebeurtenissen die de zwemwaterkwaliteit op de betrokken
      locatie beïnvloedt en die zich naar verwachting gemiddeld niet meer dan eens in de vier jaar zal voordoen;
        - aërosolen: in lucht gedispergeerde waterdeeltjes met een diameter van 1 tot 10 micrometer;
        - bassin met eenmalig gebruik van water: bassin waarvan het water geheel wordt ververst, na elk gebruik door één
      persoon;
        - beheersmaatregelen: maatregelen als bedoeld in artikel 2, zevende lid, van de zwemwaterrichtlijn die met
      betrekking tot aangewezen locaties worden genomen;
        - doorstroomd bassin: bassin waarvan het water voortdurend wordt afgevoerd, waarbij het afgevoerde water niet in
      het bassin wordt teruggebracht;
        - houder: houder van een badinrichting;
        - kortstondige verontreiniging: microbiologische besmetting als bedoeld in bijlage I, kolom A, van de
      zwemwaterrichtlijn met duidelijk aantoonbare oorzaken waarvan normaliter niet wordt verwacht dat zij de
      zwemwaterkwaliteit langer zal aantasten dan 72 uur vanaf het begin van de aantasting en waarvoor het bevoegd
      bestuursorgaan overeenkomstig bijlage II van de zwemwaterrichtlijn procedures voor de voorspelling en de aanpak
      heeft vastgesteld;
        - proliferatie van cyanobacteriën: ophoping van cyanobacteriën in de vorm van bloei, tapijt of drijflaag;
        - reeks zwemwaterkwaliteitsgegevens: gegevens die zijn verzameld overeenkomstig [artikel 44d][ref2];
        - verontreiniging: aanwezigheid van microbiologische besmetting of van andere organismen of afval die
      de zwemwaterkwaliteit aantast en een risico voor de gezondheid van de zwemmers inhoudt als bedoeld in de
      [artikelen 44e][ref3] en [44f][ref4] en in bijlage I, kolom A, van de zwemwaterrichtlijn;
        - water van drinkwaterkwaliteit: water dat voldoet aan de eisen van het [Waterleidingbesluit][ref5];
        - wet: [Wet hygiëne en veiligheid badinrichtingen en zwemgelegenheden][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0002660#Artikel10b
      [ref2]: https://wetten.overheid.nl/BWBR0003716#Artikel44d
      [ref3]: https://wetten.overheid.nl/BWBR0003716#Artikel44e
