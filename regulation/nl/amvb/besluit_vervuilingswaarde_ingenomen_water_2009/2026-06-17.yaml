  - number: '4'
    text: |-
      De vervuilingswaarde per m3 ingenomen water voor een bedrijfsruimte of het betrokken onderdeel van de
      bedrijfsruimte wordt, in afwijking van de [artikelen 2][ref1] en [3][ref2], gesteld op 0,001 indien uitsluitend
      water wordt geloosd of afgevoerd dat gebruikt wordt om een proces te koelen. Dit water is voorafgaand, tijdens of
      na het koelen niet in aanraking gekomen met af te koelen stoffen of met andere verontreinigde stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0025073#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025073#Artikel3
