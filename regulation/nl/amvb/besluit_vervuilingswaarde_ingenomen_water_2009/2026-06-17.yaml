  - number: '5'
    text: |-
      1 De vervuilingswaarde per m3 ingenomen water kan door de heffingplichtige op zijn kosten op aanvraag,
      dan wel ambtshalve door de inspecteur op kosten van de betrokken beheerder, in afwijking van de
      [artikelen 2 tot en met 4][ref1], worden bepaald aan de hand van monsterneming en analyse overeenkomstig het tweede
      lid, onderscheidenlijk aan de hand van meting, bemonstering en analyse overeenkomstig het derde of vierde lid.

      2 Bij een geschatte vervuilingswaarde van minder dan 100 vervuilingseenheden:

      a. wordt over een aantal voor het heffingsjaar representatieve etmalen afzonderlijk een etmaalverzamelmonster van
      het geloosde of afgevoerde afvalwater samengesteld dat bestaat uit ten minste 8 deelmonsters die op verschillende
      voor het etmaal representatieve tijdstippen zijn genomen;

      b. bedraagt het aantal van de onder a bedoelde etmalen bij een geschatte vervuilingswaarde van:

      1°. 50 of minder vervuilingseenheden: 2;

      2°. meer dan 50 tot 75 vervuilingseenheden: 4;

      3°. 75 tot 100 vervuilingseenheden: 6;

      c. vindt analyse van het onder a bedoelde etmaalverzamelmonster plaats en wordt het resultaat van die analyse
      uitgedrukt in grammen per m3;

      d. wordt de som van de onder c bedoelde resultaten van de analyses over de onder a bedoelde etmalen gedeeld door
      het aantal van die etmalen;

      e. wordt de uitkomst van de toepassing van het onder d bepaalde gecorrigeerd voor het deel van het ingenomen
      water dat niet wordt geloosd of afgevoerd, indien de heffingplichtige aannemelijk maakt dat dat deel 25% of meer
      bedraagt;

      f. bedraagt de vervuilingswaarde per m3 ingenomen water de overeenkomstig de onder d en e gevonden waarde gedeeld
      door 54,8 kilogrammen.

      3 In afwijking van het tweede lid kan bij een geschatte vervuilingswaarde van minder dan 100 vervuilingseenheden
      gedurende één voor het heffingsjaar representatieve week meting, bemonstering en analyse over de daarin gelegen
      etmalen plaatsvinden. Het vierde lid, onderdelen c en d, zijn van overeenkomstige toepassing.

      4 Bij een geschatte vervuilingswaarde van 100 vervuilingseenheden of meer:

      a. vindt in een aantal voor het heffingsjaar representatieve weken meting, bemonstering en analyse over de daarin
      gelegen etmalen plaats;

      b. bedraagt het aantal van de onder a bedoelde weken bij een geschatte vervuilingswaarde van:

      1°. 100 tot 250 vervuilingseenheden: 1

      2°. 250 tot 500 vervuilingseenheden: 2

      3°. 500 tot 750 vervuilingseenheden: 3

      4°. 750 tot 1000 vervuilingseenheden: 4

      5°. 1000 en meer vervuilingseenheden: het door de inspecteur te bepalen aantal dat ten hoogste 12 kan bedragen;

      c. wordt het zuurstofverbruik in de onder a bedoelde etmalen geloosde of afgevoerde stoffen gedeeld door de
      hoeveelheid in die etmalen ingenomen water;

      d. bedraagt de vervuilingswaarde per m3 ingenomen water de uitkomst van de toepassing van onderdeel c, gedeeld door
      54,8 kilogrammen.

      5 Meting, bemonstering en analyse, alsmede de behandeling van het in het tweede lid,
      onder a, bedoelde verzamelmonster geschieden overeenkomstig de nadere regels, bedoeld in
      [artikel 7.5, eerste lid, van de Waterwet][ref2] en [artikel 122g, eerste lid, van de Waterschapswet][ref3].

      6 De inspecteur beslist op een in het eerste lid bedoelde aanvraag bij voor bezwaar vatbare beschikking en geeft
      daarin in ieder geval voorschriften met betrekking tot:

      a. de tijdstippen en de etmalen waarop monsterneming en analyse moeten plaatsvinden, onderscheidenlijk de meetweek
      dan wel meetweken gedurende welke meting, bemonstering en analyse moeten plaatsvinden;

      b. de bepaling van de hoeveelheid ingenomen water;

      c. de correctie bedoeld in het tweede lid, onder e;

      d. de melding van verandering of te verwachten veranderingen die van invloed kunnen zijn op de vervuilingswaarde
      per m3 ingenomen water van de betrokken bedrijfsruimte of het betrokken onderdeel van de bedrijfsruimte.

      7 Een op basis van dit artikel bepaalde vervuilingswaarde per m3 ingenomen water geldt voor de betrokken
      bedrijfsruimte of het betrokken onderdeel van de bedrijfsruimte tot het heffingsjaar waarin dit artikel hetzij door
      de heffingplichtige hetzij door de inspecteur opnieuw wordt toegepast.


