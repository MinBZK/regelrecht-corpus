  - number: 1b
    text: >-
      De bepaling van het zuurstofverbruik van de stoffen welke in een kalenderjaar worden geloosd of afgevoerd,
      geschiedt op basis van de som van het chemisch zuurstofverbruik door omzetting van de hoeveelheid totaal organisch
      koolstof in de stoffen en het zuurstofverbruik door omzetting van de hoeveelheid totaal stikstof verminderd met de
      som van nitriet-stikstof en nitraat-stikstof in de stoffen. Hierbij wordt het chemisch zuurstofverbruik gesteld op
      driemaal het gehalte totaal organisch koolstof in de geloosde of afgevoerde stoffen.
    url: https://wetten.overheid.nl/BWBR0025073/2026-06-17#Artikel1b
  - number: '2'
    text: |-
      1 De vervuilingswaarde per m3 ingenomen water kan door de heffingplichtige op zijn kosten op aanvraag, dan wel
      ambtshalve door de inspecteur op kosten van de betrokken beheerder, worden bepaald aan de hand van één of meerdere
      methoden als bedoeld in het derde lid, indien:

      a. de geschatte vervuilingswaarde 50 of minder vervuilingseenheden bedraagt;

      b. van de heffingplichtige meettechnische voorzieningen, benodigd voor de toepassing van [artikel 5][ref1],
      redelijkerwijs niet verlangd kunnen worden; of

      c. [artikel 5][ref2] redelijkerwijs niet kan worden toegepast.

      2 De heffingplichtige verstrekt desgevraagd aan de inspecteur in ieder geval:

      a. gegevens over de bedrijfsactiviteiten- en omstandigheden die van invloed kunnen zijn op de vervuilingswaarde van
      het geloosde of afgevoerde afvalwater;

      b. de gemeten of geschatte hoeveelheid ingenomen water, geloosd of afgevoerd afvalwater en de doeleinden waarvoor
      dit water wordt gebruikt;

      c. historische gegevens over de vervuilingswaarde en gegevens over de aard van de geloosde of afgevoerde stoffen
      voor zover die beschikbaar zijn.

      3 De vervuilingswaarde per m3 ingenomen water wordt bepaald aan de hand van:

      a. de gegevens die op grond van het tweede lid, [artikel 122k, eerste lid, van de Waterschapswet][ref3] of
      [artikel 7.5, zesde lid, van de Waterwet][ref4] in samenhang met artikel 122k van de Waterschapswet aan de
      inspecteur zijn verstrekt;

      b. een over ten minste 2 voor het heffingsjaar representatieve etmalen afzonderlijk samengesteld
      etmaalverzamelmonster van het geloosde of afgevoerde afvalwater dat bestaat uit ten minste 8 deelmonsters die op
      verschillende voor het etmaal representatieve tijdstippen zijn genomen;

      c. een vergelijking met soortgelijke bedrijfsomstandigheden bij een bedrijfsruimte of onderdeel daarvan waar de
      vervuilingswaarde per m3 ingenomen water aan de hand van de [artikelen 3][ref5] of [5][ref6] is bepaald; of

      d. het zuurstofverbruik van de geloosde of afgevoerde stoffen.

      4 De behandeling van het in het derde lid, onderdeel b, bedoelde verzamelmonster geschiedt
      overeenkomstig de nadere regels, bedoeld in [artikel 7.5, eerste lid, van de Waterwet][ref7] en
      [artikel 122g, eerste lid, van de Waterschapswet][ref8].

      5 De inspecteur beslist op een in het eerste lid bedoelde aanvraag bij voor bezwaar vatbare beschikking en geeft
      daarin in ieder geval aan welke methode of methoden bedoeld in het derde lid worden gehanteerd. Voorts kunnen aan
      de beschikking nadere voorschriften worden verbonden.

      6 Een op basis van dit artikel bepaalde vervuilingswaarde per m3 ingenomen water geldt voor de betrokken
      bedrijfsruimte of het betrokken onderdeel van de bedrijfsruimte tot het heffingsjaar waarin dit artikel hetzij door
      de heffingplichtige hetzij door de inspecteur opnieuw wordt toegepast.

      7 Onder geschatte vervuilingswaarde wordt verstaan: aan de hand van de geschatte hoeveelheid in het kalenderjaar in
      te nemen water en het geschatte zuurstofverbruik per m3 ingenomen water bepaalde vervuilingswaarde.


