  - number: 6a
    text: |-
      In afwijking van [artikel 2, zevende lid][ref1], wordt voor de heffingplichtige op wie
      [artikel 166 van de Waterschapswet][ref2] van toepassing is onder geschatte vervuilingswaarde verstaan hetgeen
      artikel 4, tweede lid, van het Besluit vervuilingswaarde ingenomen water 2009, daaronder verstaat zoals dat luidde
      voor inwerkingtreding van het Besluit van 22 april 2025, houdende wijziging van het Besluit vervuilingswaarde
      ingenomen water 2009 en enkele andere besluiten in verband met het opnemen van een praktische regeling voor de
      bepaling van de vervuilingswaarde per m3 ingenomen water en enkele technische wijzigingen (Stb. 2025, 130).


