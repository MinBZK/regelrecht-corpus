articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      - *geschatte vervuilingswaarde:* geschatte vervuilingswaarde als bedoeld in [artikel 2, zevende lid][ref1];
      - *inspecteur:* ambtenaar, bedoeld in [artikel 123, derde lid, onderdeel b, van de Waterschapswet][ref2]
      onderscheidenlijk ambtenaar, bedoeld in artikel 7.10, vierde lid, van de Waterwet die voor de toepassing van de
      Algemene wet inzake rijksbelastingen in de plaats treedt van de inspecteur;
      - *vervuilingswaarde per m3 ingenomen water:* vervuilingswaarde als bedoeld in
      [artikel 7.3, eerste lid, van de Waterwet][ref3] en [artikel 122k, tweede lid, van de Waterschapswet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0025073#Artikel2
