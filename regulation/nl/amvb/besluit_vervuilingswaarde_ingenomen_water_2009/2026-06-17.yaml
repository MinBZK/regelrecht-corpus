  - number: '3'
    text: |-
      Indien in het heffingsjaar voorafgaande aan de toepassing van [artikel 122k van de Waterschapswet][ref1]
      of [artikel 7.5, zesde lid, van de Waterwet][ref2] in samenhang met artikel 122k van de Waterschapswet het
      zuurstofverbruik, voor de betrokken bedrijfsruimte of voor het betrokken onderdeel daarvan, is bepaald met behulp
      van door meting, bemonstering en analyse verkregen gegevens, wordt in afwijking van artikel 2 de vervuilingswaarde
      per m3 ingenomen water bepaald aan de hand van de formule:

      C / (D x 54,8)

      waarbij:

      C = het aantal kilogrammen zuurstofverbruik van de geloosde of afgevoerde stoffen over de etmalen van het
      voorafgaande heffingsjaar waarover meting, bemonstering en analyse hebben plaatsgevonden; en

      D = het aantal m3 ingenomen water over de etmalen van het voorafgaande heffingsjaar waarover meting, bemonstering
      en analyse hebben plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel122k
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel7.5
    url: https://wetten.overheid.nl/BWBR0025073/2026-06-17#Artikel3
