    Parlement en de Raad en tot intrekking van Richtlijn 79/373/EEG van de Raad, Richtlijn 80/511/EEG van de Commissie,
    Richtlijnen 82/471/EEG, 83/228/EEG, 93/74/EEG, 93/113/EG en 96/25/EG van de Raad en Beschikking 2004/217/EG van de
    Commissie (PbEU 2009, L 229);


    Verordening (EG) nr. 1069/2009 van het Europees Parlement en de Raad van 21 oktober 2009 tot vaststelling van
    gezondheidsvoorschriften inzake niet voor menselijke consumptie bestemde dierlijke bijproducten en afgeleide
    producten en tot intrekking van Verordening (EG) nr. 1774/2002 (PbEU 2009, L 300), en


    de artikelen 2.17, eerste lid, 2.18, 6.2, eerste lid, 6.3, eerste lid, en 10.2 van de Wet dieren;


    De Afdeling advisering van de Raad van State gehoord (advies van 7 september 2012, No. W15.12.0295/IV);


    Gezien het nader rapport van de Staatssecretaris van Economische Zaken, Landbouw en Innovatie van 2 november
    2012, nr. 12339397, Directie Wetgeving en Juridische Zaken, uitgebracht in overeenstemming met Onze Minister van
    Volksgezondheid, Welzijn en Sport, en na overleg met de Staatssecretaris van Sociale Zaken en Werkgelegenheid;


    Hebben goedgevonden en verstaan:
