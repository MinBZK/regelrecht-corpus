  - number: '2.6'
    text: |-
      Op de uitvoering van het toezicht en de keuring, bedoeld in [artikel 2.4][ref1] door de Stichting Skal, zijn van
      overeenkomstige toepassing:

      a. de [artikelen 8 tot en met 10][ref2], [11, eerste en vierde tot en met zevende lid][ref3], [12][ref4] en
      [13 van de Landbouwkwaliteitswet][ref5];

      b. het [Tuchtrechtbesluit Landbouwkwaliteitswet][ref6].


