  - number: '2.3'
    text: >-
      Bij ministeriële regeling worden regels gesteld ter uitvoering van bindende onderdelen van EU-rechtshandelingen met
      betrekking tot de productie van biologische diervoeders.
    url: https://wetten.overheid.nl/BWBR0032346/2022-01-01#Artikel2.3
  - number: '2.4'
    text: >-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de productie van biologische diervoeders voor
      gezelschapsdieren voor de uitvoering van krachtens artikel 40 van Verordening (EG) nr. 834/2007 gestelde regels.
    url: https://wetten.overheid.nl/BWBR0032346/2022-01-01#Artikel2.4
  - number: '2.5'
    text: |-
      De Stichting Skal is:

      a. belast met het toezicht op de naleving van het bij of krachtens dit besluit gestelde over de biologische
      productie van diervoeders en de keuring daarvan, of met het toezicht op die keuring;

      b. bevoegd tot het uitreiken van bewijsstukken ten aanzien van de kwaliteit van volgens de biologische productie
      geproduceerde diervoeders, indien daarover in de ministeriële regeling, bedoeld in [artikel 2.1][ref1], regels
      zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0032346#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0032346/2022-01-01#Artikel2.5
