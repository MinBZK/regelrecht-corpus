preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van de Staatssecretaris van Economische Zaken, Landbouw en Innovatie van 12 juli 2012, nr. 283165,
    Directie Wetgeving en Juridische Zaken, gedaan in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en
    Sport, en na overleg met de Staatssecretaris van Sociale Zaken en Werkgelegenheid;


    Gelet op


    Verordening (EG) nr. 999/2001 van het Europees Parlement en de Raad van 22 mei 2001 houdende vaststelling van
    voorschriften inzake preventie, bestrijding en uitroeiing van bepaalde overdraagbare spongiforme encefalopathieën
    (PbEG 2001, L 147);


    Richtlijn 2002/32/EG van het Europees Parlement en de Raad van 7 mei 2002 inzake ongewenste stoffen in diervoeding
    (PbEG 2002, L 140);


    Verordening (EG) nr. 178/2002 van het Europees Parlement en de Raad van 28 januari 2002 tot vaststelling van de
    algemene beginselen en voorschriften van de levensmiddelenwetgeving, tot oprichting van een Europese Autoriteit
    voor voedselveiligheid en tot vaststelling van procedures voor voedselveiligheidsaangelegenheden (PbEG 2002, L 31);


    Verordening (EG) nr. 1829/2003 van het Europees Parlement en de Raad van 22 september 2003 inzake genetisch
    gemodificeerde levensmiddelen en diervoeders (PbEU 2003, L 268);


    Verordening (EG) nr. 1830/2003 van het Europees Parlement en de Raad van 22 september 2003 betreffende de
    traceerbaarheid en etikettering van genetisch gemodificeerde organismen en de traceerbaarheid van met genetisch
    gemodificeerde organismen geproduceerde levenmiddelen en diervoeders en tot wijziging van Richtlijn 2001/18/EG
    (PbEU 2003, L 268);


    Verordening (EG) nr. 1831/2003 van het Europees Parlement en de Raad van 22 september 2003 betreffende
    toevoegingsmiddelen voor diervoeding (PbEU 2003, L 268);


    Verordening (EG) nr. 2160/2003 van het Europees Parlement en de Raad van 17 november 2003 inzake de bestrijding van
    salmonella en andere specifieke door voedsel overgedragen zoönoseverwekkers (PbEU 2003, L 325);


    Verordening (EG) nr. 882/2004 van Europees Parlement en de Raad van 29 april 2004 inzake officiële controles op
    de naleving van de wetgeving inzake diervoeders en levensmiddelen en de voorschriften inzake diergezondheid en
    dierenwelzijn (PbEU 2004, L 191);


    Verordening (EG) nr. 183/2005 van het Europees Parlement en de Raad van 12 januari 2005 tot vaststelling van
    voorschriften voor diervoederhygiëne (PbEU 2005, L 35);


    Verordening (EG) nr. 396/2005 van het Europees Parlement en de Raad van de Europese Unie van 23 februari 2005
    tot vaststelling van maximumgehalten aan bestrijdingsmiddelenresiduen in of op levensmiddelen en diervoeders van
    plantaardige en dierlijke oorspong en houdende wijziging van Richtlijn 91/414/EG van de Raad (PbEg 2005, L 70);


    Verordening (EG) nr. 834/2007 van de Raad van 28 juni 2007 inzake de biologische productie en de etikettering van
    biologische producten en tot intrekking van Verordening (EEG) nr. 2092/91 (PbEU 2007, L 189);


    Verordening (EG) nr. 470/2009 van het Europees Parlement en de Raad van 6 mei 2009 tot vaststelling van
    communautaire procedures voor het vaststellen van grenswaarden voor residuen van farmacologisch werkzame stoffen
    in levensmiddelen van dierlijke oorsprong, tot intrekking van Verordening (EEG) nr. 2377/90 van de Raad en tot
    wijziging van Richtlijn 2001/82/EG van het Europees Parlement en de Raad en van Verordening (EG) nr. 726/2004 van
    het Europees Parlement en de Raad (PbEU 2009, L 152/11);


    Verordening (EG) nr. 767/2009 van het Europees Parlement en de Raad van 13 juli 2009 betreffende het in de
