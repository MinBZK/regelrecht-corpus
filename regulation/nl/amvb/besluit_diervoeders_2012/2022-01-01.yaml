articles:
  - number: '1.1'
    text: |-
      In dit besluit en daarop berustende bepalingen wordt verstaan onder:

      - *ongewenste stoffen:* alle stoffen en producten, met uitzondering van ziekteverwekkers, die aanwezig zijn in
      of op een product dat bedoeld is voor het voederen van dieren en die een potentieel gevaar opleveren voor de
      gezondheid van mens of dier, of voor het milieu, of die de dierlijke productie ongunstig kunnen beïnvloeden;
      - *Verordening (EG) nr. 999/2001:* Verordening (EG) nr. 999/2001 van het Europees Parlement en de Raad van 22 mei
      2001 houdende vaststelling van voorschriften inzake preventie, bestrijding en uitroeiing van bepaalde overdraagbare
      spongiforme encefalopathieën (PbEG 2001, L 147);
      - *Richtlijn 2002/32/EG:* [Richtlijn 2002/32/EG](32002L0032) van het Europees Parlement en de Raad van 7 mei 2002
      inzake ongewenste stoffen in diervoeding (PbEG 2002, L 140);
      - *Verordening (EG) nr. 178/2002:* Verordening (EG) nr. 178/2002 van het Europees Parlement en de Raad van
      28 januari 2002 tot vaststelling van de algemene beginselen en voorschriften van de levensmiddelenwetgeving,
      tot oprichting van een Europese Autoriteit voor voedselveiligheid en tot vaststelling van procedures voor
      voedselveiligheidsaangelegenheden (PbEG 2002, L 31);
      - *Verordening (EG) nr. 1829/2003:* Verordening (EG) nr. 1829/2003 van het Europees Parlement en de Raad van
      22 september 2003 inzake genetisch gemodificeerde levensmiddelen en diervoeders (PbEU 2003, L 268);
      - *Verordening (EG) nr. 1830/2003:* Verordening (EG) nr. 1830/2003 van het Europees Parlement en de Raad van
      22 september 2003 betreffende de traceerbaarheid en etikettering van genetisch gemodificeerde organismen en de
      traceerbaarheid van met genetisch gemodificeerde organismen geproduceerde levenmiddelen en diervoeders en tot
      wijziging van [Richtlijn 2001/18/EG](32001L0018) (PbEU 2003, L 268);
      - *Verordening (EG) nr. 1831/2003:* Verordening (EG) nr. 1831/2003 van het Europees Parlement en de Raad van
      22 september 2003 betreffende toevoegingsmiddelen voor diervoeding (PbEU 2003, L 268);
      - *Verordening (EG) nr. 2160/2003:* Verordening (EG) nr. 2160/2003 van het Europees Parlement en de Raad
      van 17 november 2003 inzake de bestrijding van salmonella en andere specifieke door voedsel overgedragen
      zoönoseverwekkers (PbEU 2003, L 325);
      - *Verordening (EG) nr. 183/2005:* Verordening (EG) nr. 183/2005 van het Europees Parlement en de Raad van
      12 januari 2005 tot vaststelling van voorschriften voor diervoederhygiëne (PbEU 2005, 35);
      - *Verordening (EG) nr. 396/2005:* Verordening (EG) nr. 396/2005 van het Europees Parlement en de Raad van de
      Europese Unie van 23 februari 2005 tot vaststelling van maximumgehalten aan bestrijdingsmiddelenresiduen in of op
      levensmiddelen en diervoeders van plantaardige en dierlijke oorspong en houdende wijziging van [Richtlijn 91/414/
      EG](31991L0414) van de Raad (PbEg 2005, L 70);
      - *Verordening (EG) nr. 834/2007:* Verordening (EG) nr. 834/2007 van de Raad van 28 juni 2007 inzake de biologische
      productie en de etikettering van biologische producten en tot intrekking van Verordening (EEG) nr. 2092/91 (PbEU
      2007, L 189);
      - *Verordening (EG) nr. 470/2009:* Verordening (EG) nr. 470/2009 van het Europees Parlement en de Raad van
      6 mei 2009 tot vaststelling van communautaire procedures voor het vaststellen van grenswaarden voor residuen van
      farmacologisch werkzame stoffen in levensmiddelen van dierlijke oorsprong, tot intrekking van Verordening (EEG)
      nr. 2377/90 van de Raad en tot wijziging van [Richtlijn 2001/82/EG](32001L0082) van het Europees Parlement en de
      Raad en van Verordening (EG) nr. 726/2004 van het Europees Parlement en de Raad (PbEU 2009, L 152/11);
      - *Verordening (EG) nr. 767/2009:* Verordening (EG) nr. 767/2009 van het Europees Parlement en de Raad van 13 juli
      2009 betreffende het in de handel brengen en het gebruik van diervoeders, tot wijziging van Verordening (EG)
      nr. 1831/2003 van het Europees Parlement en de Raad en tot intrekking van [Richtlijn 79/373/EEG](31979L0373) van
      de Raad, [Richtlijn 80/511/EEG](31980L0511) van de Commissie, [Richtlijnen 82/471/EEG](31982L0471), [83/228/EEG]
      (31983L0228), [93/74/EEG](31993L0074), [93/113/EG](31993L0113) en [96/25/EG](31996L0025) van de Raad en Beschikking
      [2004/217/EG](32004L0217) van de Commissie (PbEU 2009, L 229);
      - *Verordening (EG) nr. 1069/2009:* Verordening (EG) nr. 1069/2009 van het Europees Parlement en de Raad van
      21 oktober 2009 tot vaststelling van gezondheidsvoorschriften inzake niet voor menselijke consumptie bestemde
      dierlijke bijproducten en afgeleide producten en tot intrekking van Verordening (EG) nr. 1774/2002 (PbEU 2009,
      L 300);
      - *Stichting Skal:* Stichting Skal te Zwolle;
      - *wet:* [Wet dieren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030250
