  - number: '3.1'
    text: |-
      In dit hoofdstuk en daarop berustende bepalingen wordt verstaan onder:

      - *aanvullende diervoeders:* mengsels van diervoeders die een hoog gehalte aan bepaalde stoffen bevatten en door
      hun samenstelling slechts samen met andere diervoeders een totaal dagrantsoen vormen;
      - *dagrantsoen:* totale hoeveelheid diervoeders, omgerekend op een vochtgehalte van 12%, die een dier van een
      bepaalde soort, gegeven zijn leeftijdsklasse en prestatievermogen, gemiddeld dagelijks nodig heeft om volledig in
      zijn voederbehoefte te voorzien;
      - *mengvoeders:* mengsels van voedermiddelen, al dan niet met toevoegingsmiddelen en bestemd voor vervoedering in
      de vorm van volledige diervoeders of aanvullende diervoeders;
      - *producten die bedoeld zijn voor het voederen van dieren:* voedermiddelen, toevoegingsmiddelen, voormengsels,
      mengvoeders, aanvullende diervoeders, volledige diervoeders en alle andere producten die bedoeld zijn om te worden
      gebruikt of gebruikt worden voor het voederen van dieren;
      - *toevoegingsmiddelen:* toevoegingsmiddel als bedoeld in artikel 2, tweede lid, onderdeel a, van Verordening (EG)
      nr. 1831/2003;
      - *voedermiddelen:* de verschillende producten van plantaardige of dierlijke oorsprong in natuurlijke staat, vers
      of verduurzaamd, en de afgeleide producten van de industriële verwerking ervan, alsmede organische of anorganische
      stoffen, met of zonder toevoegingsmiddelen, en bestemd voor vervoedering, hetzij als zodanig, hetzij na verwerking,
      voor de bereiding van mengvoeders of als drager bij voormengsels;
      - *voormengsels:* mengsels van toevoegingsmiddelen of mengsels van een of meer toevoegingsmiddelen met stoffen die
      dragers vormen, die bestemd zijn voor de bereiding van diervoeders;
      - *volledige diervoeders:* mengsels van diervoeders die door hun samenstelling op zichzelf een totaal dagrantsoen
      vormen.
    url: https://wetten.overheid.nl/BWBR0032346/2022-01-01#Artikel3.1
  - number: '3.2'
    text: |-
      Een ieder die met een diervoeder een handeling als bedoeld in [artikel 2.17, eerste lid, van de wet][ref1]
      verricht, verricht die handeling slechts met een product dat bedoeld is voor het voederen van dieren dat het in
      bijlage I bij Richtlijn nr. 2002/32/EG vastgestelde gehalte aan ongewenste stoffen niet overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2.17
    url: https://wetten.overheid.nl/BWBR0032346/2022-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2.17'
  - number: '3.3'
    text: |-
      1 Wanneer in producten die bedoeld zijn voor het voederen van dieren, maximumgehalten als bedoeld in
      [artikel 3.2][ref1] zijn overschreden, verricht Onze Minister onderzoek om de bronnen van ongewenste stoffen te
      identificeren, daarbij rekening houdend met de achtergrondniveaus.

      2 Onze Minister betrekt zo mogelijk marktdeelnemers bij het onderzoek, bedoeld in het eerste lid.

      3 In afwijking van [artikel 3.2][ref2] kunnen bij ministeriële regeling regels worden gesteld voor proefnemingen
      bij dieren met producten die bedoeld zijn voor het voederen van dieren om de bronnen van ongewenste stoffen te
      identificeren in verband met de overschrijding van een maximumgehalte.


      [ref1]: https://wetten.overheid.nl/BWBR0032346#Artikel3.2
      [ref2]: https://wetten.overheid.nl/BWBR0032346#Artikel3.2
    url: https://wetten.overheid.nl/BWBR0032346/2022-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0032346
        artikel: '3.2'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0032346
        artikel: '3.2'
        hoofdstuk: '3'
  - number: '3.4'
    text: |-
      1 Wanneer in producten die bedoeld zijn voor het voederen van dieren, verhoogde gehalten van ongewenste stoffen
      zijn geconstateerd, verricht Onze Minister onderzoek om de bronnen van ongewenste stoffen te identificeren, daarbij
      rekening houdend met de achtergrondniveaus.

      2 Het onderzoek wordt ingesteld bij overschrijding van een actiedrempel, die bij bijlage II van [Richtlijn 2002/32/
      EG](32002L0032) is ingesteld.

      3 Onze Minister betrekt zo mogelijk marktdeelnemers bij het onderzoek, bedoeld in het eerste lid.

      4 In afwijking van [artikel 3.2][ref1] kunnen bij ministeriële regeling regels worden gesteld voor proefnemingen
      bij dieren met producten die bedoeld zijn voor het voederen van dieren om maatregelen te kunnen nemen om een
      verhoogd gehalte aan ongewenste stoffen te beperken of deze weg te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0032346#Artikel3.2
    url: https://wetten.overheid.nl/BWBR0032346/2022-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0032346
        artikel: '3.2'
        hoofdstuk: '3'
  - number: '3.5'
    text: |-
      Onze Minister zendt jaarlijks informatie over de resultaten van het onderzoek, bedoeld in de [artikelen 3.3][ref1]
      en [3.4][ref2], alsmede andere nuttige informatie en bevindingen, waaronder informatie over de bron en de
      maatregelen die zijn genomen om het gehalte aan ongewenste stoffen te beperken of weg te nemen, aan de Commissie
      van de Europese Unie en de andere lidstaten van de Europese Unie. De toezending is onverwijld, indien deze
      onmiddellijk van belang is voor de andere lidstaten van de Europese Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0032346#Artikel3.3
      [ref2]: https://wetten.overheid.nl/BWBR0032346#Artikel3.4
    url: https://wetten.overheid.nl/BWBR0032346/2022-01-01#Artikel3.5
    references:
