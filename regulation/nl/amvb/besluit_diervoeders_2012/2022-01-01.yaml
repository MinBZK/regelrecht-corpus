  - number: '2.1'
    text: |-
      1 Bij ministeriële regeling worden ter uitvoering van EU-verordeningen over diervoeders en krachtens die
      EU-verordeningen vastgestelde EU-rechtshandelingen regels gesteld over diervoeders met betrekking tot de
      onderwerpen, bedoeld in [artikel 2.18, tweede lid, onderdelen a tot en met l, van de wet][ref1] voor zover die EU-
      rechtshandelingen verplichten tot invulling van een onderdeel van die rechtshandelingen.

      2 Bij ministeriële regeling kunnen ter uitvoering van EU-verordeningen over diervoeders en krachtens die EU-
      verordeningen vastgestelde EU-rechtshandelingen regels worden gesteld over diervoeders met betrekking tot de
      onderwerpen, bedoeld in [artikel 2.18, tweede lid, onderdelen a tot en met l, van de wet][ref2] voor zover die EU-
      rechtshandelingen de ruimte bieden om een bepaalde handeling of toestand toe te staan of te verbieden.


