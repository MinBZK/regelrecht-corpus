        bwb_id: BWBR0032346
        artikel: '3.3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0032346
        artikel: '3.4'
        hoofdstuk: '3'
  - number: '3.6'
    text: >-
      Producten die bedoeld zijn voor het voederen van dieren, met een gehalte aan een ongewenste stof dat het in kolom
      3 van de tabel in bijlage I van [Richtlijn 2002/32/EG](32002L0032) vastgestelde maximumgehalte overschrijdt, mogen
      niet met het oog op verdunning worden vermengd met hetzelfde product of met andere producten die bedoeld zijn voor
      het voederen van dieren.
    url: https://wetten.overheid.nl/BWBR0032346/2022-01-01#Artikel3.6
  - number: '3.7'
    text: >-
      In aanvullende diervoeders mag het gehalte aan de in bijlage I van [Richtlijn 2002/32/EG](32002L0032) genoemde
      ongewenste stoffen niet hoger zijn dan het voor volledige diervoeders vastgestelde gehalte, rekening houdend met
      het voor het gebruik ervan voorgeschreven aandeel in een dagrantsoen.
    url: https://wetten.overheid.nl/BWBR0032346/2022-01-01#Artikel3.7
  - number: '3.8'
    text: |-
      1 Bij ministeriële regeling kan, wegens gevaar voor de gezondheid van mens of dier of voor het milieu, indien
      nieuwe gegevens beschikbaar zijn gekomen of een nieuwe beoordeling van bestaande gegevens is uitgevoerd:

      a. tijdelijk een lager maximumgehalte worden vastgesteld dan het maximumgehalte, bedoeld in [artikel 3.2][ref1],

      b. een maximumgehalte worden vastgesteld voor een ongewenste stof die niet is genoemd in bijlage I bij [Richtlijn
      2002/32/EG](32002L0032), of

      c. de aanwezigheid van een ongewenste stof in producten die bedoeld zijn voor het voederen van dieren worden
      verboden.

      2 Onze Minister stelt de overige lidstaten van de Europese Unie en de Commissie van de Europese Unie onmiddellijk
      op de hoogte van een regeling als bedoeld in het eerste lid, onderdelen a tot en met c, met opgave van de redenen
      voor zijn besluit.

      3 In afwijking van [artikel 3.2][ref2] kan Onze Minister regels stellen voor proefnemingen bij dieren met producten
      die bedoeld zijn voor het voederen van dieren en die in verband met nieuwe gegevens of een nieuwe beoordeling van
      bestaande gegevens over stoffen in diervoeders mogelijk een gevaar opleveren als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0032346#Artikel3.2
      [ref2]: https://wetten.overheid.nl/BWBR0032346#Artikel3.2
    url: https://wetten.overheid.nl/BWBR0032346/2022-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0032346
        artikel: '3.2'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0032346
        artikel: '3.2'
        hoofdstuk: '3'
  - number: '3.9'
    text: >-
      Bij ministeriële regeling kunnen regels worden gesteld voor het doen treffen van de nodige maatregelen om te
      garanderen dat door de Europese Commissie vastgestelde criteria voor de aanvaardbaarheid van zuiveringsprocedés
      correct worden toegepast en gezuiverde producten die bedoeld zijn voor het voederen van dieren voldoen aan de
      bepalingen van bijlage I bij [Richtlijn 2002/32/EG](32002L0032).
    url: https://wetten.overheid.nl/BWBR0032346/2022-01-01#Artikel3.9
  - number: '4.1'
    text: |-
      Na de inwerkingtreding van dit besluit berust de Regeling diervoeders 2012 op de [artikelen 2.1][ref1], [2.3][ref2]
      en [2.4][ref3] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0032346#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0032346#Artikel2.3
      [ref3]: https://wetten.overheid.nl/BWBR0032346#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0032346/2022-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0032346
        artikel: '2.1'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032346
        artikel: '2.3'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0032346
        artikel: '2.4'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '4.2'
    text: >-
      Een krachtens dit besluit vast te stellen ministeriële regeling wordt vastgesteld door Onze Minister in
      overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0032346/2022-01-01#Artikel4.2
  - number: '4.3'
    text: >-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0032346/2022-01-01#Artikel4.3
  - number: '4.4'
    text: 'Dit besluit wordt aangehaald als: Besluit diervoeders 2012.'
    url: https://wetten.overheid.nl/BWBR0032346/2022-01-01#Artikel4.4
