preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 10 april 2020, nr. 2020-
    0000051085;

    Gelet op artikel 78f van de Participatiewet en artikel 63 van de Wet structuur uitvoeringsorganisatie werk en
    inkomen;

    De Afdeling advisering van de Raad van State gehoord 14 april 2020, No.W12.20.0110/III;

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 17 april 2020, nr. 2020-
    0000052742;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *algemene de-minimisverordening:*
      verordening (EU) nr. 1407/2013 van de Commissie van 18 december 2013 betreffende de toepassing van de artikelen 107
      en 108 van het Verdrag betreffende de werking van de Europese Unie op de-minimissteun (PbEU 2013, L 352);
        - *verklaring:* verklaring als bedoeld in [artikel 2][ref1];
        - *wet:* [Participatiewet][ref2];
        - *zelfstandige:* de rechthebbende, bedoeld in [artikel 11, van de wet][ref3] die achttien jaar of ouder is maar
      de pensioengerechtigde leeftijd nog niet heeft bereikt en die voor de voorziening in het bestaan is aangewezen op
      arbeid in eigen bedrijf of zelfstandig beroep hier te lande en die; a. voldoet aan de wettelijke vereisten voor de
      uitoefening daarvan; b. ten minste 1.225 uur per jaar besteedt aan werkzaamheden voor het bedrijf of zelfstandig
      beroep; en c. alleen of samen met degene met wie hij het bedrijf of zelfstandig beroep uitoefent de volledige
      zeggenschap in dat bedrijf of zelfstandig beroep heeft en de financiële risico’s daarvan draagt.


      [ref1]: https://wetten.overheid.nl/BWBR0043402#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0015703
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel11
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0043402
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015703
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '11'
  - number: '2.1'
    text: |-
      De aanvrager van algemene bijstand of bijstand ter voorziening in de behoefte aan bedrijfskapitaal op grond van dit
      besluit verklaart schriftelijk dat hij aan [artikel 1, onderdeel b][ref1], voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0043402#Artikel1
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0043402
        artikel: '1'
        hoofdstuk: '1'
  - number: '2.2'
    text: |-
      Algemene bijstand of bijstand ter voorziening in de behoefte aan bedrijfskapitaal op grond van dit besluit kan
      worden verleend aan de zelfstandige die op 17 maart 2020 stond ingeschreven in het handelsregister, bedoeld in
      [artikel 2, van de Handelsregisterwet 2007][ref1] en schriftelijk verklaart dat diens bedrijf of zelfstandig beroep
      financieel is geraakt als gevolg van de crisis in verband met COVID-19.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel2
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '2'
  - number: '2.3'
    text: |-
      Algemene bijstand op grond van dit besluit wordt niet verleend aan de zelfstandige die algemene bijstand ontvangt
      op grond van het [Besluit bijstandverlening zelfstandigen 2004][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015711
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015711
  - number: '3.1'
    text: |-
      In afwijking van [artikel 41 van de wet][ref1] wordt de aanvraag ingediend bij het college.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel41
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '41'
  - number: '3.2'
    text: |-
      Voor de toepassing van [artikel 44, eerste lid, derde zinsdeel van de wet][ref1] wordt de aanvraag die is
      ingediend:


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel44
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '44'
  - number: 3.2.a
    text: voor 1 juni 2020 geacht te zijn ingediend op 1 maart 2020;
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel3
  - number: 3.2.b
    text: op of na 1 juni 2020 en voor 1 oktober 2020 geacht te zijn ingediend op 1 juni 2020;
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel3
  - number: 3.2.c
    text: op of na 1 oktober 2020 en voor 1 december 2020 geacht te zijn ingediend op 1 oktober 2020;
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel3
  - number: 3.2.d
    text: |-
      op of na 1 december 2020 en voor 1 februari 2021 geacht te zijn ingediend op de eerste dag van de kalendermaand
      waarin de aanvraag is ingediend;
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel3
  - number: 3.2.e
    text: |-
      op of na 1 februari 2021 en voor 1 april 2021 geacht te zijn ingediend op de eerste dag van de kalendermaand
      voorafgaand aan de maand waarin de aanvraag is ingediend;
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel3
  - number: 3.2.f
    text: |-
      op of na 1 april 2021 en voor 1 mei 2021 geacht te zijn ingediend op de eerste dag van de kalendermaand waarin de
      aanvraag is ingediend;
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel3
  - number: 3.2.g
    text: |-
      op of na 1 mei 2021 en voor 1 juli 2021 geacht te zijn ingediend op de eerste dag van de kalendermaand voorafgaand
      aan de maand waarin de aanvraag is ingediend;
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel3
  - number: 3.2.h
    text: |-
      op of na 1 juli 2021 en voor 1 augustus 2021 geacht te zijn ingediend op de eerste dag van de kalendermaand waarin
      de aanvraag is ingediend;
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel3
  - number: 3.2.i
    text: |-
      op of na 1 augustus 2021 geacht te zijn ingediend op de eerste dag van de kalendermaand voorafgaand aan de maand
      waarin de aanvraag is ingediend.
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel3
  - number: '3.3'
    text: |-
      Voor de ondernemer in de binnenvaart, bedoeld in
      [artikel 1, onderdeel k, van het Besluit bijstandverlening zelfstandigen 2004][ref1], die geen woonplaats heeft
      als bedoeld in [artikel 40, eerste lid, van de wet][ref2], bestaat het recht op bijstand jegens het college van de
      gemeente waar de ondernemer in de binnenvaart op het moment van de aanvraag zijn feitelijke ligplaats heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel40
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0015711
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '40'
  - number: '4.1'
    text: |-
      De aanvraag kan worden ingediend door middel van een door Onze Minister beschikbaar gesteld formulier. De hiervoor
      benodigde gegevens worden niet verkregen van de zelfstandige voor zover zij door Onze Minister verkregen kunnen
      worden uit het handelsregister, bedoeld in [artikel 2 van de Handelsregisterwet 2007][ref1], alsmede van Onze
      Minister van Onderwijs, Cultuur en Wetenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel2
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '2'
  - number: '4.2'
    text: |-
      De voor de aanvraag benodigde gegevens worden door Onze Minister niet verkregen van de zelfstandige voor zover zij
      door het college verkregen kunnen worden uit de basisregistratie personen.
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel4
  - number: '4.3'
    text: |-
      In afwijking van [artikel 5.24, eerste lid, van het Besluit SUWI][ref1] is het Inlichtingenbureau verwerker voor
      Onze Minister voor het verwerken van de gegevens die door tussenkomst van het Inlichtingenbureau door Onze Minister
      worden verkregen ten behoeve van de taak, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel5
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '5'
  - number: '5.1'
    text: |-
      In de verklaring wordt door de aanvrager van algemene bijstand het volgende verklaard en de volgende informatie
      verstrekt:
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel5
  - number: 5.1.a
    text: dat hij voldoet aan artikel 1, onderdeel b;
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel5
  - number: 5.1.b
    text: |-
      dat diens bedrijf of zelfstandig beroep financieel is geraakt als gevolg van de crisis in verband met COVID-19,
      voorzien van een toelichting;
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel5
  - number: 5.1.c
    text: |-
      dat hij voor de kalendermaanden waarover algemene bijstand wordt aangevraagd, verwacht een in aanmerking te nemen
      inkomen te hebben dat lager is dan de bijstandsnorm;
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel5
  - number: 5.1.d
    text: |-
      voor de kalendermaanden waarover algemene bijstand wordt aangevraagd een opgave van het inkomen dat hij heeft
      verworven of verwacht te gaan verwerven.
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel5
  - number: '5.2'
    text: |-
      De gehuwde zelfstandige betrekt bij de verklaring, bedoeld in het eerste lid, onderdelen c en d, het inkomen van
      beide echtgenoten.
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel5
  - number: '6.1'
    text: |-
      In afwijking van [artikel 32, eerste lid, onderdeel a, van de wet][ref1] wordt niet als inkomen in aanmerking
      genomen een teruggave inkomstenbelasting en premies volksverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel32
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '32'
  - number: '6.2'
    text: |-
      De verschuldigde inkomstenbelasting en premies volksverzekeringen over inkomen waarover geen loonbelasting is
      geheven wordt gesteld op 18 procent van dat inkomen.
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel6
  - number: '6.3'
    text: |-
      Ten aanzien van de zelfstandige die het bedrijf of zelfstandig beroep uitoefent in de vorm van een besloten
      vennootschap of een coöperatieve vereniging met wettelijke aansprakelijkheid wordt onder inkomen mede verstaan de
      naar evenredigheid van het aantal zelfstandigen omgerekende nettowinst van deze rechtspersoon verminderd met de
      hierover verschuldigde vennootschapsbelasting.
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel6
  - number: '7'
    text: |-
      In afwijking van [artikel 34 van de wet][ref1] wordt vermogen niet in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel34
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '34'
  - number: '8'
    text: Algemene bijstand wordt naar de regels van dit besluit verleend in de vorm van een bedrag om niet.
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel8
  - number: '9'
    text: |-
      De algemene bijstand wordt naar de regels van dit besluit verleend voor ten hoogste negentien kalendermaanden en
      ziet uitsluitend op de kalendermaanden maart 2020 tot en met september 2021.
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel9
  - number: 9a
    text: |-
      Onverminderd de [artikelen 9][ref1], [9a][ref2], [10][ref3] en [17 van de wet][ref4] verstrekt de zelfstandige
      op verzoek van het college bij de aanvraag van algemene bijstand op grond van dit besluit of tijdens de bijstand
      de door het college gevraagde informatie gericht op voortzetting, wijziging of beëindiging van zijn beroeps- of
      bedrijfsactiviteiten of gericht op zijn arbeidsinschakeling.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel9a
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0015703#Artikel17
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: 9a
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0015703
        artikel: '17'
  - number: '10.1'
    text: |-
      Bijstand ter voorziening in de behoefte aan bedrijfskapitaal kan worden verleend aan de zelfstandige die
      schriftelijk verklaart en aannemelijk maakt dat hij als gevolg van de crisis in verband met COVID-19 over
      onvoldoende direct beschikbare geldmiddelen beschikt om aan de financiële verplichtingen verbonden aan diens
      bedrijf of zelfstandig beroep te kunnen voldoen.
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel10
  - number: '10.2'
    text: 'Bijstand ter voorziening in de behoefte aan bedrijfskapitaal wordt niet verleend:'
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel10
  - number: 10.2.a
    text: |-
      voor zover dat leidt tot een overschrijding van het de-minimisplafond, bedoeld in artikel 3, tweede lid, van de
      algemene de-minimisverordening;
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel10
  - number: 10.2.b
    text: |-
      ingeval een verzoek is ingediend tot verlening van surseance van betaling of om faillietverklaring
      van de zelfstandige, van één van de vennoten of leden waarmee het bedrijf of zelfstandig beroep in een
      samenwerkingsverband wordt uitgeoefend, of van de rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel10
  - number: '11.1'
    text: |-
      Bijstand ter voorziening in de behoefte aan bedrijfskapitaal aan de zelfstandige die het bedrijf of zelfstandig
      beroep uitoefent in de vorm van een maatschap, een vennootschap onder firma, een commanditaire vennootschap, een
      besloten vennootschap of een coöperatieve vereniging met wettelijke aansprakelijkheid, wordt slechts verleend
      indien hoofdelijke aansprakelijkheid voor de uit de bijstandsverlening voortvloeiende verplichtingen wordt aanvaard
      door:
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel11
  - number: 11.1.a
    text: alle vennoten of leden waarmee het bedrijf of zelfstandig beroep wordt uitgeoefend;
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel11
  - number: 11.1.b
    text: de besloten vennootschap en de coöperatieve vereniging met wettelijke aansprakelijkheid.
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel11
  - number: '11.2'
    text: |-
      De eis van aanvaarding van hoofdelijke aansprakelijkheid geldt niet voor de commanditaire vennoot wiens inbreng
      uitsluitend uit kapitaal bestaat.
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel11
  - number: '11.3'
    text: |-
      Bijstand ter voorziening in de behoefte aan bedrijfskapitaal wordt niet verleend aan de vennoot in een maatschap
      die daar alleen arbeid inbrengt. Deze vennoot behoeft geen hoofdelijke aansprakelijkheid te aanvaarden voor de aan
      de andere vennoten verleende bijstand ter voorziening in de behoefte aan bedrijfskapitaal.
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel11
  - number: '12'
    text: |-
      In de verklaring wordt door de aanvrager van bijstand ter voorziening in de behoefte aan bedrijfskapitaal het
      volgende verklaard en de volgende informatie verstrekt:
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel12
  - number: 12.a
    text: |-
      dat hij voldoet aan [artikel 1, onderdeel b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0043402#Artikel1
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0043402
        artikel: '1'
        hoofdstuk: '1'
  - number: 12.b
    text: |-
      dat diens bedrijf of zelfstandig beroep financieel is geraakt als gevolg van de crisis in verband met COVID-19,
      voorzien van een toelichting;
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel12
  - number: 12.c
    text: |-
      dat hij als gevolg van de crisis in verband met COVID-19 over onvoldoende direct beschikbare geldmiddelen beschikt
      om aan de financiële verplichtingen verbonden aan diens bedrijf of zelfstandig beroep te kunnen voldoen, voorzien
      van een toelichting;
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel12
  - number: 12.d
    text: |-
      dat de omvang van de aangevraagde bijstand niet zal leiden tot een overschrijding van het de-minimisplafond,
      bedoeld in artikel 3, tweede lid, van de algemene de- minimisverordening; en
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel12
  - number: 12.e
    text: |-
      dat geen sprake is van een situatie als bedoeld in [artikel 10, tweede lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043402#Artikel10
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0043402
        artikel: '10'
        hoofdstuk: '3'
  - number: '13.1'
    text: |-
      Bijstand ter voorziening in de behoefte aan bedrijfskapitaal wordt naar de regels van dit besluit verleend in de
      vorm van een rentedragende lening.
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel13
  - number: '13.2'
    text: |-
      Een voorschot als bedoeld in [artikel 52 van de wet][ref1] kan geen betrekking hebben op bijstand ter voorziening
      in de behoefte aan bedrijfskapitaal.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel52
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '52'
  - number: '14'
    text: 'Bijstand ter voorziening in de behoefte aan bedrijfskapitaal wordt verleend met inachtneming van het volgende:'
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel14
  - number: 14.a
    text: de rente van de lening bedraagt 2 procent per jaar gedurende de gehele looptijd van de lening;
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel14
  - number: 14.b
    text: de looptijd van de lening is ten hoogste vijf jaar;
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel14
  - number: 14.c
    text: de lening slechts wordt verleend indien de aanvraag is ingediend voor 1 oktober 2021.
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel14
  - number: '15.1'
    text: |-
      De bijstand ter voorziening in de behoefte aan bedrijfskapitaal bedraagt ten hoogste € 10.157,00. Dit bedrag geldt
      per bedrijf of zelfstandig beroep.
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel15
  - number: '15.2'
    text: |-
      Als de bijstand ter voorziening in de behoefte aan bedrijfskapitaal wordt gevraagd door gehuwden die beide
      zelfstandige zijn, kan per echtgenoot voor diens bedrijf of zelfstandig beroep een lening worden verleend van ten
      hoogste € 10.157,00.
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel15
  - number: '16.1'
    text: |-
      Onverminderd [artikel 4:86 van de Algemene wet bestuursrecht][ref1] legt het college in de beschikking waarmee de
      bijstand ter voorziening in de behoefte aan bedrijfskapitaal wordt toegekend in ieder geval vast:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 16.1.a
    text: de verplichting tot betaling van rente en aflossing alsmede de betalingstermijnen;
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel16
  - number: 16.1.b
    text: 'dat het bedrag van de lening terstond kan worden opgeëist:'
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel16
  - number: 16.1.b.1°
    text: indien de zelfstandige de betalingsverplichting niet nakomt;
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel16
  - number: 16.1.b.2°
    text: op het moment dat de zelfstandige het bedrijf of zelfstandig beroep overdraagt of beëindigt;
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel16
  - number: 16.1.b.3°
    text: |-
      ingeval van surseance van betaling of faillissement van de zelfstandige, van één van de vennoten of leden waarmee
      het bedrijf of zelfstandig beroep in een samenwerkingsverband wordt uitgeoefend, of van de rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel16
  - number: '16.2'
    text: |-
      De verplichting tot betaling van rente en aflossing vangt aan op 1 januari 2022. In het tijdvak van 1 januari 2021
      tot en met 31 december 2021 wordt geen rente opgebouwd.
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel16
  - number: '16.3'
    text: |-
      Het college kan aan het verlenen van de bijstand ter voorziening in de behoefte aan bedrijfskapitaal verplichtingen
      verbinden die zijn gericht op het verkrijgen van meerdere zekerheid voor de nakoming van de aan deze bijstand
      verbonden rente- en aflossingsverplichtingen.
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel16
  - number: '17'
    text: |-
      Bij ministeriële regeling kunnen personen worden aangewezen aan wie mede algemene bijstand of bijstand ter
      voorziening in de behoefte aan bedrijfskapitaal op grond van dit besluit kan worden verleend. Daarbij kan worden
      afgeweken van het begrip zelfstandige en kunnen van dit besluit afwijkende regels worden gesteld als dat nodig is
      voor een goede uitvoering.
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel17
  - number: '18'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het recht op bijstand waarbij ten gunste
      van de zelfstandige kan worden afgeweken van dit besluit.
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel18
  - number: 18a.1
    text: |-
      Bij ministeriële regeling kan de duur en periode, bedoeld in [artikel 9][ref1], worden uitgebreid en kan de
      datum, bedoeld in [artikel 14, onderdeel c][ref2], later worden vastgesteld voor zover dat nodig is in verband
      met de gevolgen van de crisis in verband met COVID-19 en de bijstandverlening aan zelfstandigen. De uitbreiding
      of vaststelling, bedoeld in de eerste zin, kan slechts betrekking hebben op het tijdvak 1 oktober 2021 tot en met
      31 maart 2022.


      [ref1]: https://wetten.overheid.nl/BWBR0043402#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0043402#Artikel14
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0043402
        artikel: '9'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0043402
        artikel: '14'
        hoofdstuk: '3'
  - number: 18a.2
    text: |-
      In de ministeriële regeling, bedoeld in het eerste lid, kunnen nadere regels en zo nodig afwijkende
      regels van dit besluit en het [Besluit bijstandverlening zelfstandigen 2004][ref1] worden gesteld voor
      regeling van de samenloop van een aanvraag op grond van dit besluit en een aanvraag als bedoeld in
      [artikel 54 van het Besluit bijstandverlening zelfstandigen 2004][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015711
      [ref2]: https://wetten.overheid.nl/BWBR0015711#Artikel54
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0015711
      - id: ref2
        bwb_id: BWBR0015711
        artikel: '54'
  - number: '19.1'
    text: 'Onze Minister vergoedt ten laste van ’s Rijks kas aan het college:'
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel19
  - number: 19.1.a
    text: |-
      100% van de kosten van algemene bijstand en bijstand ter voorziening in de behoefte aan bedrijfskapitaal, voor
      zover de algemene bijstand niet bij wijze van voorschot op grond van [artikel 52 van de wet][ref1] is verleend; en


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel52
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '52'
  - number: 19.1.b
    text: |-
      een bij ministeriële regeling te bepalen bedrag per besluit op een aanvraag om algemene bijstand en bijstand ter
      voorziening in de behoefte aan bedrijfskapitaal.
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel19
  - number: '19.2'
    text: |-
      Onder kosten als bedoeld in het eerste lid, onderdeel a, wordt verstaan de lasten in een kalenderjaar verminderd
      met de baten in dat jaar in verband met de door het college verleende algemene bijstand en bijstand ter voorziening
      in de behoefte aan bedrijfskapitaal.
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel19
  - number: 19a.1
    text: |-
      Onze Minister vergoedt ten laste van ’s Rijks kas aan het college 30% van het totaalbedrag van de vorderingen als
      gevolg van onverschuldigd verleende voorschotten op aanvragen tot bijstand voor levensonderhoud als bedoeld in
      [hoofdstuk 2][ref1], welke feitelijk zijn ingediend vóór 22 april 2020.


      [ref1]: https://wetten.overheid.nl/BWBR0043402#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0043402
        hoofdstuk: '2'
  - number: 19a.2
    text: |-
      Van een onverschuldigd verleend voorschot als bedoeld in het eerste lid is sprake indien het als gevolg van de
      beslissing op de aanvraag geheel of gedeeltelijk niet verrekend kan worden omdat:
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel19a
  - number: 19a.2.a
    text: de belanghebbende over de periode 1 maart 2020 tot 1 juni 2020 geen recht heeft op de gevraagde bijstand; of
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel19a
  - number: 19a.2.b
    text: |-
      het voor de belanghebbende vastgestelde recht op bijstand over de periode 1 maart 2020 tot 1 juni 2020 minder
      bedraagt dan de over die periode verleende voorschotten.
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel19a
  - number: '20.1'
    text: |-
      Onze Minister verleent voorschotten op de vergoeding, bedoeld in [artikel 19][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043402#Artikel19
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0043402
        artikel: '19'
        hoofdstuk: '5'
  - number: '20.2'
    text: |-
      De voorschotten worden afgestemd op de landelijk te verwachte kosten, waarbij deze worden verdeeld over gemeenten
      op basis van het aantal zelfstandigen per gemeente.
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel20
  - number: '20.3'
    text: |-
      Op basis van het beeld van de uitvoering, bedoeld in [artikel 77, tweede lid, van de wet][ref1] vindt een
      voorlopige verrekening plaats met de verleende voorschotten, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel77
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '77'
  - number: '21.1'
    text: |-
      Onze Minister stelt de vergoedingen, bedoeld in de [artikelen 19][ref1] en [19a][ref2], vast binnen een jaar
      na ontvangst door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van de verantwoordingsinformatie,
      bedoeld in [artikel 17a, eerste lid, van de Financiële-verhoudingswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0043402#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0043402#Artikel19a
      [ref3]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0043402
        artikel: '19'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0043402
        artikel: 19a
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0008290
        artikel: 17a
  - number: '21.2'
    text: |-
      De kosten van algemene bijstand en bijstand ter voorziening in de behoefte aan bedrijfskapitaal worden bij
      de vaststelling buiten aanmerking gelaten indien deze kosten blijkens het verslag van bevindingen, bedoeld
      in [artikel 213, vierde lid, van de Gemeentewet][ref1], dat deel uit maakt van de informatie, bedoeld in
      [artikel 17a, eerste lid, van de Financiële-verhoudingswet][ref2], als fout of onzeker worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel213
      [ref2]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '213'
      - id: ref2
        bwb_id: BWBR0008290
        artikel: 17a
  - number: '21.3'
    text: |-
      Indien de toepassing van het tweede lid naar het oordeel van Onze Minister leidt tot een onbillijkheid van
      overwegende aard kan hij de kosten die als fout of onzeker worden aangemerkt, in afwijking van het tweede lid,
      geheel of gedeeltelijk in aanmerking nemen bij de vaststelling.
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel21
  - number: '21.4'
    text: |-
      Indien de verantwoordingsinformatie, bedoeld in het eerste lid, niet binnen achttien maanden na het kalenderjaar
      waarop het betrekking heeft is ontvangen door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties wordt de
      vergoeding, bedoeld in [artikel 19][ref1], ambtshalve door Onze Minister vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0043402#Artikel19
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0043402
        artikel: '19'
        hoofdstuk: '5'
  - number: '21.5'
    text: |-
      Bij de toepassing van dit artikel wordt uitgegaan van de gegevens waarvan Onze Minister kennis heeft op
      30 september van het jaar volgend op het verantwoordingsjaar, met dien verstande dat gegevens die het college op
      verzoek van Onze Minister op een latere datum verstrekt mede in aanmerking worden genomen.
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel21
  - number: '21.6'
    text: |-
      Indien [artikel 8c van de wet][ref1] van toepassing is, kan voor de vaststelling de informatie in aanmerking
      worden genomen die het openbaar lichaam heeft verantwoord over het jaar waarop de vaststelling betrekking
      heeft. De eerste zin is slechts van toepassing indien de bedoelde informatie is vastgesteld overeenkomstig
      [artikel 34a van de Wet gemeenschappelijke regelingen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel8c
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel34a
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: 8c
      - id: ref2
        bwb_id: BWBR0003740
        artikel: 34a
  - number: 21a.1
    text: |-
      Het in of krachtens dit besluit, zoals dit luidde op 30 september 2020, gestelde blijft van toepassing op tot
      1 oktober 2020 aangevraagde bijstand.
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel21a
  - number: 21a.2
    text: |-
      In afwijking van de [artikelen 1, onderdeel b][ref1], [artikel 2, eerste lid][ref2],
      [5, eerste lid, onderdeel a][ref3], en [12, onderdeel a][ref4], kan het college bij de aanvraag voor bijstand
      op grond van dit besluit ingediend tussen 1 oktober 2020 en de dag voorafgaande aan de inwerkingtreding van het
      Besluit van 15 maart 2021 tot wijziging van de Tijdelijke overbruggingsregeling zelfstandig ondernemers in verband
      met het niet invoeren van de beperkte vermogenstoets, de financiële relatie tussen het Rijk en de gemeenten en
      enkele andere wijzigingen (Stb. 2021, 137) op andere wijze dan door middel van de verklaring vaststellen of de
      aanvrager per jaar 1.225 uur aan zijn bedrijf of zelfstandig beroep besteedt.


      [ref1]: https://wetten.overheid.nl/BWBR0043402#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0043402#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0043402#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0043402#Artikel12
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0043402
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0043402
        artikel: '2'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0043402
        artikel: '5'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0043402
        artikel: '12'
        hoofdstuk: '3'
  - number: '22.1'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst en werkt terug tot en met 1 maart 2020.
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel22
  - number: '22.2'
    text: |-
      Dit besluit vervalt op 1 juli 2027 met dien verstande dat het besluit zoals dat luidde op 30 juni 2027 van
      toepassing blijft op de zelfstandige die op grond van dit besluit bijstand ontvangt of heeft ontvangen en op de
      financiële afwikkeling van het besluit.
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel22
  - number: '23'
    text: 'Dit besluit wordt aangehaald als: Tijdelijke overbruggingsregeling zelfstandig ondernemers.'
    url: https://wetten.overheid.nl/BWBR0043402/2021-10-01#Artikel23
