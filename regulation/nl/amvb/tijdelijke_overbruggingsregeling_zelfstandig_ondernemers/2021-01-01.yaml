  - number: '3'
    text: |-
      1 In afwijking van [artikel 41 van de wet][ref1] wordt de aanvraag ingediend bij het college.

      2 Voor de toepassing van [artikel 44, eerste lid, derde zinsdeel van de wet][ref2] wordt de aanvraag die is
      ingediend:

      a. voor 1 juni 2020 geacht te zijn ingediend op 1 maart 2020;

      b. op of na 1 juni 2020 en voor 1 oktober 2020 geacht te zijn ingediend op 1 juni 2020;

      c. op of na 1 oktober 2020 en voor 1 december 2020 geacht te zijn ingediend op 1 oktober 2020;

      d. op of na 1 december 2020 geacht te zijn ingediend op de eerste van de kalendermaand waarin de aanvraag is
      ingediend.

      3 Voor de ondernemer in de binnenvaart, bedoeld in
      [artikel 1, onderdeel k, van het Besluit bijstandverlening zelfstandigen 2004][ref3], die geen woonplaats heeft
      als bedoeld in [artikel 40, eerste lid, van de wet][ref4], bestaat het recht op bijstand jegens het college van de
      gemeente waar de ondernemer in de binnenvaart op het moment van de aanvraag zijn feitelijke ligplaats heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0015711#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0015703#Artikel40
