    text: |-
      1 Algemene bijstand of bijstand ter voorziening in de behoefte aan bedrijfskapitaal op grond van dit besluit kan
      worden verleend aan de zelfstandige die op 17 maart 2020 stond ingeschreven in het handelsregister, bedoeld in
      [artikel 2, van de Handelsregisterwet 2007][ref1] en schriftelijk verklaart dat diens bedrijf of zelfstandig beroep
      financieel is geraakt als gevolg van de crisis in verband met COVID-19.

      2 Algemene bijstand op grond van dit besluit wordt niet verleend aan de zelfstandige die algemene bijstand ontvangt
      op grond van het [Besluit bijstandverlening zelfstandigen 2004][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0015711
