  - number: '8'
    text: Algemene bijstand wordt naar de regels van dit besluit verleend in de vorm van een bedrag om niet.
    url: https://wetten.overheid.nl/BWBR0043402/2021-01-01#Artikel8
  - number: '9'
    text: |-
      De algemene bijstand wordt naar de regels van dit besluit verleend voor ten hoogste zestien kalendermaanden en ziet
      uitsluitend op de kalendermaanden maart 2020 tot en met juni 2021.
    url: https://wetten.overheid.nl/BWBR0043402/2021-01-01#Artikel9
  - number: '10'
    text: |-
      1 Bijstand ter voorziening in de behoefte aan bedrijfskapitaal kan worden verleend aan de zelfstandige die
      schriftelijk verklaart en aannemelijk maakt dat hij als gevolg van de crisis in verband met COVID-19 over
      onvoldoende direct beschikbare geldmiddelen beschikt om aan de financiële verplichtingen verbonden aan diens
      bedrijf of zelfstandig beroep te kunnen voldoen.

      2 Bijstand ter voorziening in de behoefte aan bedrijfskapitaal wordt niet verleend:

      a. voor zover dat leidt tot een overschrijding van het de-minimisplafond, bedoeld in artikel 3, tweede lid, van de
      algemene de-minimisverordening;

      b. ingeval een verzoek is ingediend tot verlening van surseance van betaling of om faillietverklaring
      van de zelfstandige, van één van de vennoten of leden waarmee het bedrijf of zelfstandig beroep in een
      samenwerkingsverband wordt uitgeoefend, of van de rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0043402/2021-01-01#Artikel10
  - number: '11'
    text: |-
      1 Bijstand ter voorziening in de behoefte aan bedrijfskapitaal aan de zelfstandige die het bedrijf of zelfstandig
      beroep uitoefent in de vorm van een maatschap, een vennootschap onder firma, een commanditaire vennootschap, een
      besloten vennootschap of een coöperatieve vereniging met wettelijke aansprakelijkheid, wordt slechts verleend
      indien hoofdelijke aansprakelijkheid voor de uit de bijstandsverlening voortvloeiende verplichtingen wordt aanvaard
      door:

      a. alle vennoten of leden waarmee het bedrijf of zelfstandig beroep wordt uitgeoefend;

      b. de besloten vennootschap en de coöperatieve vereniging met wettelijke aansprakelijkheid.

      2 De eis van aanvaarding van hoofdelijke aansprakelijkheid geldt niet voor de commanditaire vennoot wiens inbreng
      uitsluitend uit kapitaal bestaat.

      3 Bijstand ter voorziening in de behoefte aan bedrijfskapitaal wordt niet verleend aan de vennoot in een maatschap
      die daar alleen arbeid inbrengt. Deze vennoot behoeft geen hoofdelijke aansprakelijkheid te aanvaarden voor de aan
      de andere vennoten verleende bijstand ter voorziening in de behoefte aan bedrijfskapitaal.
    url: https://wetten.overheid.nl/BWBR0043402/2021-01-01#Artikel11
  - number: '12'
    text: |-
      In de verklaring wordt door de aanvrager van bijstand ter voorziening in de behoefte aan bedrijfskapitaal het
      volgende verklaard en de volgende informatie verstrekt:

      a. dat diens bedrijf of zelfstandig beroep financieel is geraakt als gevolg van de crisis in verband met COVID-19,
      voorzien van een toelichting;

      b. dat hij als gevolg van de crisis in verband met COVID-19 over onvoldoende direct beschikbare geldmiddelen
      beschikt om aan de financiële verplichtingen verbonden aan diens bedrijf of zelfstandig beroep te kunnen voldoen,
      voorzien van een toelichting;

      c. dat de omvang van de aangevraagde bijstand niet zal leiden tot een overschrijding van het de-minimisplafond,
      bedoeld in artikel 3, tweede lid, van de algemene de- minimisverordening; en

      d. dat geen sprake is van een situatie als bedoeld in [artikel 10, tweede lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043402#Artikel10
    url: https://wetten.overheid.nl/BWBR0043402/2021-01-01#Artikel12
    references:
