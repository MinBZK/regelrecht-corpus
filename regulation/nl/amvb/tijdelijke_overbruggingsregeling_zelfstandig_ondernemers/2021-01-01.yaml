  - number: '5'
    text: |-
      1 In de verklaring wordt door de aanvrager van algemene bijstand het volgende verklaard en de volgende informatie
      verstrekt:

      a. dat diens bedrijf of zelfstandig beroep financieel is geraakt als gevolg van de crisis in verband met COVID-19,
      voorzien van een toelichting;

      b. dat hij voor de kalendermaanden waarover algemene bijstand wordt aangevraagd, verwacht een in aanmerking te
      nemen inkomen te hebben dat lager is dan de bijstandsnorm;

      c. voor de kalendermaanden waarover algemene bijstand wordt aangevraagd een opgave van het inkomen dat hij heeft
      verworven of verwacht te gaan verwerven; en

      c. dat hij of, indien van toepassing, zijn gezin over geen in aanmerking te nemen vermogen, bedoeld in
      [artikel 7][ref1], beschikt of redelijkerwijs kan beschikken.

      2 De gehuwde zelfstandige betrekt bij de verklaring, bedoeld in het eerste lid, onderdelen b en c, het inkomen van
      beide echtgenoten.


      [ref1]: https://wetten.overheid.nl/BWBR0043402#Artikel7
    url: https://wetten.overheid.nl/BWBR0043402/2021-01-01#Artikel5
    references:
