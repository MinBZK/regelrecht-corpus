articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *algemene de-minimisverordening:* verordening (EU) nr. 1407/2013 van de Commissie van 18 december 2013
      betreffende de toepassing van de artikelen 107 en 108 van het Verdrag betreffende de werking van de Europese Unie
      op de-minimissteun (PbEU 2013, L 352);
        - *verklaring:* verklaring als bedoeld in [artikel 2, eerste lid][ref1];
        - *wet:* [Participatiewet][ref2];
        - *zelfstandige:* de rechthebbende, bedoeld in [artikel 11, van de wet][ref3] die achttien jaar of ouder is maar
      de pensioengerechtigde leeftijd nog niet heeft bereikt en die voor de voorziening in het bestaan is aangewezen op
      arbeid in eigen bedrijf of zelfstandig beroep hier te lande en die; a. voldoet aan de wettelijke vereisten voor de
      uitoefening daarvan; b. ten minste 1.225 uur per jaar besteedt aan werkzaamheden voor het bedrijf of zelfstandig
      beroep; en c. alleen of samen met degene met wie hij het bedrijf of zelfstandig beroep uitoefent de volledige
      zeggenschap in dat bedrijf of zelfstandig beroep heeft en de financiële risico’s daarvan draagt.


      [ref1]: https://wetten.overheid.nl/BWBR0043402#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0015703
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel11
