        artikel: '10'
        hoofdstuk: '3'
  - number: '13'
    text: |-
      1 Bijstand ter voorziening in de behoefte aan bedrijfskapitaal wordt naar de regels van dit besluit verleend in de
      vorm van een rentedragende lening.

      2 Een voorschot als bedoeld in [artikel 52 van de wet][ref1] kan geen betrekking hebben op bijstand ter voorziening
      in de behoefte aan bedrijfskapitaal.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel52
    url: https://wetten.overheid.nl/BWBR0043402/2021-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '52'
  - number: '14'
    text: |-
      Bijstand ter voorziening in de behoefte aan bedrijfskapitaal wordt verleend met inachtneming van het volgende:

      a. de rente van de lening bedraagt 2 procent per jaar gedurende de gehele looptijd van de lening;

      b. de looptijd van de lening is ten hoogste drie jaar.
    url: https://wetten.overheid.nl/BWBR0043402/2021-01-01#Artikel14
  - number: '15'
    text: |-
      1 De bijstand ter voorziening in de behoefte aan bedrijfskapitaal bedraagt ten hoogste € 10.157,00. Dit bedrag
      geldt per bedrijf of zelfstandig beroep.

      2 Als de bijstand ter voorziening in de behoefte aan bedrijfskapitaal wordt gevraagd door gehuwden die beide
      zelfstandige zijn, kan per echtgenoot voor diens bedrijf of zelfstandig beroep een lening worden verleend van ten
      hoogste € 10.157,00.
    url: https://wetten.overheid.nl/BWBR0043402/2021-01-01#Artikel15
  - number: '16'
    text: |-
      1 Onverminderd [artikel 4:86 van de Algemene wet bestuursrecht][ref1] legt het college in de beschikking waarmee de
      bijstand ter voorziening in de behoefte aan bedrijfskapitaal wordt toegekend in ieder geval vast:

      a. de verplichting tot betaling van rente en aflossing alsmede de betalingstermijnen;

      b. dat het bedrag van de lening terstond kan worden opgeëist:

      1°. indien de zelfstandige de betalingsverplichting niet nakomt;

      2°. op het moment dat de zelfstandige het bedrijf of zelfstandig beroep overdraagt of beëindigt;

      3°. ingeval van surseance van betaling of faillissement van de zelfstandige, van één van de vennoten of leden
      waarmee het bedrijf of zelfstandig beroep in een samenwerkingsverband wordt uitgeoefend, of van de rechtspersoon.

      2 De verplichting tot betaling van rente en aflossing vangt aan op 1 januari 2021. Voor leningen verstrekt op of na
      1 januari 2021 vangt de verplichting tot betaling van rente en aflossing direct aan na het moment waarop de lening
      is verstrekt.

      3 Het college kan aan het verlenen van de bijstand ter voorziening in de behoefte aan bedrijfskapitaal
      verplichtingen verbinden die zijn gericht op het verkrijgen van meerdere zekerheid voor de nakoming van de aan deze
      bijstand verbonden rente- en aflossingsverplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel486
    url: https://wetten.overheid.nl/BWBR0043402/2021-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:86
  - number: '17'
    text: |-
      Bij ministeriële regeling kunnen personen worden aangewezen aan wie mede algemene bijstand of bijstand ter
      voorziening in de behoefte aan bedrijfskapitaal op grond van dit besluit kan worden verleend. Daarbij kan worden
      afgeweken van het begrip zelfstandige en kunnen van dit besluit afwijkende regels worden gesteld als dat nodig is
      voor een goede uitvoering.
    url: https://wetten.overheid.nl/BWBR0043402/2021-01-01#Artikel17
  - number: '18'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het recht op bijstand waarbij ten gunste
      van de zelfstandige kan worden afgeweken van dit besluit.
    url: https://wetten.overheid.nl/BWBR0043402/2021-01-01#Artikel18
  - number: '19'
    text: |-
      1 Onze Minister vergoedt ten laste van ’s Rijks kas aan het college:

      a. 100% van de kosten van algemene bijstand en bijstand ter voorziening in de behoefte aan bedrijfskapitaal, voor
      zover de algemene bijstand niet bij wijze van voorschot op grond van [artikel 52 van de wet][ref1] is verleend; en

      b. een bij ministeriële regeling te bepalen bedrag per besluit op een aanvraag om algemene bijstand en bijstand ter
      voorziening in de behoefte aan bedrijfskapitaal.

      2 Onder kosten als bedoeld in het eerste lid, onderdeel a, wordt verstaan de lasten in een kalenderjaar verminderd
      met de baten in dat jaar in verband met de door het college verleende algemene bijstand en bijstand ter voorziening
      in de behoefte aan bedrijfskapitaal.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel52
    url: https://wetten.overheid.nl/BWBR0043402/2021-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '52'
  - number: '20'
    text: |-
      1 Onze Minister verleent voorschotten op de vergoeding, bedoeld in [artikel 19][ref1].

      2 De voorschotten worden afgestemd op de landelijk te verwachte kosten, waarbij deze worden verdeeld over gemeenten
      op basis van het aantal zelfstandigen per gemeente.

      3 Op basis van het beeld van de uitvoering, bedoeld in [artikel 77, tweede lid, van de wet][ref2] vindt een
      voorlopige verrekening plaats met de verleende voorschotten, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0043402#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel77
    url: https://wetten.overheid.nl/BWBR0043402/2021-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0043402
        artikel: '19'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '77'
  - number: '21'
    text: |-
      1 Onze Minister stelt de vergoeding, bedoeld in [artikel 19][ref1], vast binnen een jaar na ontvangst door
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van de verantwoordingsinformatie, bedoeld in
      [artikel 17a, eerste lid, van de Financiële-verhoudingswet][ref2].

      2 De kosten van algemene bijstand en bijstand ter voorziening in de behoefte aan bedrijfskapitaal worden bij
      de vaststelling buiten aanmerking gelaten indien deze kosten blijkens het verslag van bevindingen, bedoeld
      in [artikel 213, vierde lid, van de Gemeentewet][ref3], dat deel uit maakt van de informatie, bedoeld in
      [artikel 17a, eerste lid, van de Financiële-verhoudingswet][ref4], als fout of onzeker worden aangemerkt.

      3 Indien de toepassing van het tweede lid naar het oordeel van Onze Minister leidt tot een onbillijkheid van
      overwegende aard kan hij de kosten die als fout of onzeker worden aangemerkt, in afwijking van het tweede lid,
      geheel of gedeeltelijk in aanmerking nemen bij de vaststelling.

      4 Indien de verantwoordingsinformatie, bedoeld in het eerste lid, niet binnen achttien maanden na het kalenderjaar
      waarop het betrekking heeft is ontvangen door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties wordt de
      vergoeding, bedoeld in [artikel 19][ref5], ambtshalve door Onze Minister vastgesteld.


