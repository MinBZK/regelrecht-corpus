  - number: '4'
    text: |-
      1 De aanvraag kan worden ingediend door middel van een door Onze Minister beschikbaar gesteld formulier. De
      hiervoor benodigde gegevens worden niet verkregen van de zelfstandige voor zover zij door Onze Minister verkregen
      kunnen worden uit het handelsregister, bedoeld in [artikel 2 van de Handelsregisterwet 2007][ref1], alsmede van
      Onze Minister van Onderwijs, Cultuur en Wetenschap.

      2 De voor de aanvraag benodigde gegevens worden door Onze Minister niet verkregen van de zelfstandige voor zover
      zij door het college verkregen kunnen worden uit de basisregistratie personen.

      3 In afwijking van [artikel 5.24, eerste lid, van het Besluit SUWI][ref2] is het Inlichtingenbureau verwerker voor
      Onze Minister voor het verwerken van de gegevens die door tussenkomst van het Inlichtingenbureau door Onze Minister
      worden verkregen ten behoeve van de taak, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013267#Artikel5.24
