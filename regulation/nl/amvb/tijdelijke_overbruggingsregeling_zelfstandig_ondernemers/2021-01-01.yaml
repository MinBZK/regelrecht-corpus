        artikel: '7'
        hoofdstuk: '2'
  - number: '6'
    text: |-
      1 In afwijking van [artikel 32, eerste lid, onderdeel a, van de wet][ref1] wordt niet als inkomen in aanmerking
      genomen een teruggave inkomstenbelasting en premies volksverzekeringen.

      2 De verschuldigde inkomstenbelasting en premies volksverzekeringen over inkomen waarover geen loonbelasting is
      geheven wordt gesteld op 18 procent van dat inkomen.

      3 Ten aanzien van de zelfstandige die het bedrijf of zelfstandig beroep uitoefent in de vorm van een besloten
      vennootschap of een coöperatieve vereniging met wettelijke aansprakelijkheid wordt onder inkomen mede verstaan de
      naar evenredigheid van het aantal zelfstandigen omgerekende nettowinst van deze rechtspersoon verminderd met de
      hierover verschuldigde vennootschapsbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel32
    url: https://wetten.overheid.nl/BWBR0043402/2021-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '32'
  - number: '7'
    text: |-
      1 In afwijking van [artikel 34 van de wet][ref1] wordt onder vermogen verstaan de financiële middelen, bedoeld
      in het tweede lid, waarover de alleenstaande of het gezin bij aanvang van de algemene bijstand beschikt of
      redelijkerwijs kan beschikken.

      2 Onder financiële middelen wordt uitsluitend verstaan:

      a. contant geld;

      b. tegoeden op bankrekeningen;

      c. geld in de vorm van cryptovaluta; en

      d. beleggingen op een effectenrekening of in een effectendepot, met uitzondering van aandelen in het eigen bedrijf
      en overige aandelen op naam.

      3 Niet als vermogen wordt in aanmerking genomen:

      a. vergoedingen voor immateriële schade als bedoeld in [artikel 31, tweede lid, onderdeel l, van de wet][ref2];

      b. subsidies of voorschotten daarop voor zover deze in de drie kalendermaanden voorafgaand aan de aanvang van de
      algemene bijstand zijn ontvangen en die zijn verstrekt door:

      1°. Onze Minister van Sociale Zaken en Werkgelegenheid op grond van de [Kaderwet SZW-subsidies][ref3] met als doel
      het tegemoetkomen in de loonkosten in verband met buitengewone economische omstandigheden teneinde werkgelegenheid
      te behouden;

      2°. Onze Minister van Economische Zaken en Klimaat op grond van de [Kaderwet EZK- en LNV-subsidies][ref4] met als
      doel getroffen MKB-ondernemingen in staat te stellen hun vaste lasten te betalen in verband met de maatregelen ter
      bestrijding van de verdere verspreiding van COVID-19;

      c. een lijfrenterekening of een lijfrentebeleggingsrecht als bedoeld in
      [artikel 3.126a van de Wet inkomstenbelasting 2001][ref5] die voorziet in een oudedagslijfrente,
      of een spaarrekening eigen woning of een beleggingsrecht eigen woning als bedoeld in
      [artikel 10bis.2 van de Wet inkomstenbelasting 2001][ref6];

      d. financiële middelen voor zover de waarde daarvan in totaal niet meer bedraagt dan € 46.520,00.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel34
