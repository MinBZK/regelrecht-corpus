        artikel: '141'
  - number: '2'
    text: |-
      Onze Minister van Veiligheid en Justitie stelt uit de door hem ingevolge [artikel 1][ref1] aan te wijzen ambtenaren
      van politie hoofden van politieke recherche aan, die elk in hun ambtsgebied belast zijn met de leiding van de
      opsporing der in [artikel 1][ref2] bedoelde feiten en gedragingen, alsmede met de hun bij of krachtens dit besluit
      opgedragen werkzaamheden. Het [tweede lid van artikel 1][ref3] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002015#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002015#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002015#Artikel1
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002015
        artikel: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002015
        artikel: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002015
        artikel: '1'
        afdeling: I
  - number: '3'
    text: |-
      Onze Minister van Veiligheid en Justitie benoemt op voordracht van den procureur-fiscaal officieren-fiscaal, die
      vanwege den procureur-fiscaal de hun door dezen verleende bevoegdheden uitoefenen.
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel3
  - number: '4'
    text: |-
      1 Tot officier-fiscaal zijn benoembaar Nederlanders en Nederlandsche onderdanen, tevens ingezetenen van het
      Koninkrijk, die tenminste den leeftijd van vijf en twintig jaren hebben bereikt.

      2 De officieren-fiscaal genieten een bezoldiging overeenkomstig door Onze Minister van Veiligheid en Justitie vast
      te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel4
  - number: '5'
    text: |-
      Alvorens in bediening te treden leggen de officieren-fiscaal naar de wijze hunner godsdienstige gezindheid ten
      overstaan van de president van het Bijzondere Gerechtshof, binnen welks ressort hun ambtsgebied is gelegen, den eed
      of de belofte af, dat zij hun taak naar plicht en geweten, nauwgezet, onpartijdig en als goede vaderlanders zullen
      vervullen.
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel5
  - number: '6'
    text: |-
      De in [artikel 1][ref1] bedoelde opsporingsambtenaren oefenen behalve de bevoegdheden, in het
      [Wetboek van Strafvordering][ref2] aan opsporingsambtenaren toegekend, de hun in dit besluit toegekende
      bevoegdheden uit.


      [ref1]: https://wetten.overheid.nl/BWBR0002015#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002015
        artikel: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0001903
  - number: 6a
    text: |-
      1 De in [artikel 1][ref1] bedoelde opsporingsambtenaren zijn bevoegd om personen, verdacht van een der in
      [artikel 1][ref2] bedoelde feiten of gedragingen, aan te houden en hen naar een plaats van verhoor te geleiden.

      2 Zij mogen voor het verhoor niet langer dan vierentwintig uren worden opgehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0002015#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002015#Artikel1
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0002015
        artikel: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002015
        artikel: '1'
        afdeling: I
  - number: '7'
    text: |-
      De in [artikel 1][ref1] bedoelde opsporingsambtenaren zijn te allen tijde bevoegd om in beslag te nemen, zoomede
      ter inbeslagneming de uitlevering te vorderen van alle roerende goederen, welke tot ontdekking der waarheid kunnen
      dienen.


      [ref1]: https://wetten.overheid.nl/BWBR0002015#Artikel1
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002015
        artikel: '1'
        afdeling: I
  - number: '8'
    text: |-
      1 De in [artikel 1][ref1] bedoelde opsporingsambtenaren hebben te allen tijde toegang tot alle plaatsen, voorzoover
      zij betreding daarvan voor een goede vervulling van hun taak redelijkerwijze noodzakelijk oordeelen.

      2 In woningen treden zij tegen den wil van den bewoner niet binnen tenzij voorzien van een algemeenen of
      bijzonderen schriftelijken last, door den procureur-fiscaal of met zijn machtiging door den officier-fiscaal
      gegeven. Van dit binnentreden wordt binnen twee maal vier en twintig uren proces-verbaal opgemaakt. Daarin wordt
      mede van het tijdstip van het binnentreden en van het daarmede beoogde doel melding gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002015#Artikel1
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002015
        artikel: '1'
        afdeling: I
  - number: '9'
    text: |-
      1 Zij zijn bevoegd op iedere plaats, die zij betreden, huiszoeking of onderzoek te doen.

      2 Het bepaalde in [artikel 8, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002015#Artikel8
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002015
        artikel: '8'
        afdeling: III
  - number: '10'
    text: |-
      1 De procureur-fiscaal kan ter inbeslagneming de uitlevering tegen ontvangstbewijs bevelen van de pakketten,
      brieven, stukken en andere berichten, welke aan de post, de telegrafie of andere instelling van vervoer zijn
      toevertrouwd; een en ander voorzoover zij klaarblijkelijk voor een van een der in [artikel 1][ref1] bedoelde feiten
      of gedragingen verdachten persoon bestemd of van hem afkomstig zijn.

      2 Ieder, die ten behoeve van dat vervoer zoodanige zaken onder zich heeft of krijgt, geeft dienaangaande den
      procureur-fiscaal op diens vordering de door hem gewenschte inlichtingen.

      3 De procureur-fiscaal geeft pakketten, brieven, stukken en andere berichten, waarvan de inbeslagneming niet wordt
      gehandhaafd, onverwijld aan den vervoerder ter verzending terug.


      [ref1]: https://wetten.overheid.nl/BWBR0002015#Artikel1
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002015
        artikel: '1'
        afdeling: I
  - number: '11'
    text: |-
      1 De procureur-fiscaal kan van de in [artikel 10][ref1] bedoelde pakketten, brieven, stukken en andere berichten
      kennis nemen, ook voorzoover deze gesloten zijn. Indien de inhoud niet voor het onderzoek van belang is, verzendt
      de procureur-fiscaal deze onverwijld naar hun bestemming.

      2 Van de inbeslagneming, de teruggave, de opening en de verzending wordt door den procureur-fiscaal proces-verbaal
      opgemaakt, dat bij de processtukken wordt gevoegd.

      3 Ieder, die werkzaam is bij een instelling van telefonie, geeft terzake van alle verkeer, hetwelk door
      tusschenkomst van die instelling is geschied, aan den procureur-fiscaal op diens vordering de door dezen gewenschte
      inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002015#Artikel10
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002015
        artikel: '10'
        afdeling: III
  - number: '12'
    text: |-
      1 Personen, verdacht van een der in [artikel 1][ref1] bedoelde feiten of gedragingen, kunnen door of vanwege den
      procureur-fiscaal in bewaring worden gesteld.

      2 Het bevel tot bewaring wordt niet gegeven dan nadat de betrokkene is gehoord. Van het verhoor wordt proces-
      verbaal opgemaakt.

      3 Het bevel is van kracht gedurende ten hoogste veertien dagen en kan telkens voor een termijn van ten hoogste drie
      maanden worden verlengd.

      4 Het bevel kan schriftelijk of mondeling worden gegeven; een mondeling bevel moet binnen vier en twintig uren
      schriftelijk worden bevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002015#Artikel1
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002015
        artikel: '1'
        afdeling: I
  - number: '13'
    text: |-
      De in bewaring gestelde personen worden aan geen andere beperkingen onderworpen dan die voor het doel hunner
      opsluiting in het belang der orde of ter handhaving van het moreel volstrekt noodzakelijk zijn.

      Zij zullen te werk gesteld kunnen worden.
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel13
  - number: 13a
    text: |-
      Ten aanzien van de bevoegdheden van den raadsman betreffende het verkeer met den verdachte, die in bewaring
      is gesteld, is [artikel 50 van het Wetboek van Strafvordering][ref1] van overeenkomstige toepassing, met dien
      verstande, dat hetgeen daar ten aanzien van den rechter-commissaris, den officier van justitie en de rechtbank
      is bepaald, ten deze geldt voor den raadsheer-commissaris in het Bijzondere Gerechtshof, den procureur-fiscaal
      bij dat Hof en den raadsheer of raadsheer-plaatsvervanger, bedoeld in [artikel 16, tweede lid][ref2], en met
      dien verstande, dat in het geval, bedoeld in [artikel 31 van het Tribunaalbesluit][ref3], uitsluitend dat artikel
      toepassing vindt.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0002015#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0002009#Artikel31
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '50'
      - id: ref2
        bwb_id: BWBR0002015
        artikel: '16'
        afdeling: V
      - id: ref3
        bwb_id: BWBR0002009
        artikel: '31'
  - number: 13b
    text: |-
      1 De procureur-fiscaal bij het Bijzondere Gerechtshof staat aan den raadsman van den verdachte, die in bewaring is
      gesteld, op diens verzoek toe van het dossier kennis te nemen.

      2 Niettemin kan de procureur-fiscaal, indien het belang van het onderzoek dit vordert, den raadsman de kennisneming
      van bepaalde stukken onthouden. In dit geval wordt den raadsman schriftelijk medegedeeld, dat de hem ter inzage
      gegeven stukken niet volledig zijn.

      3 Aan den raadsman mag niet worden onthouden de kennisneming van het schriftelijk gegeven of bevestigd bevel tot
      bewaring en van de processen-verbaal van de verhooren van den verdachte.

      4 Indien den raadsman de kennisneming van stukken wordt onthouden, kan hij daartegen binnen drie dagen na de
      mededeeling, vermeld in het tweede lid, een bezwaarschrift indienen bij den raadsheer of raadsheer-plaatsvervanger,
      bedoeld in [artikel 16, tweede lid][ref1], die binnen vijf dagen beslist.

      5 In de gevallen, bedoeld in [artikel 33 van het Wetboek van Strafvordering][ref2] en
      [artikel 33 van het Tribunaalbesluit][ref3], vinden uitsluitend die artikelen toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002015#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0002009#Artikel33
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0002015
        artikel: '16'
        afdeling: V
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '33'
      - id: ref3
        bwb_id: BWBR0002009
        artikel: '33'
  - number: '14'
    text: |-
      1 Een bewaarde wordt in vrijheid gesteld:

      1°. indien blijkt, dat de gerezen verdenking hetzij ongegrond is, hetzij onvoldoende gegrond om voortzetting der
      bewaring te rechtvaardigen;

      2°. indien niet blijkt, dat de schuld van den betrokkene van zoodanigen aard is, dat oplegging van een straf of
      maatregel ingevolge het [Besluit Buitengewoon Strafrecht][ref1] of het [Tribunaalbesluit][ref2] gerechtvaardigd is
      te achten;

      3°. indien redelijkerwijze moet worden aangenomen, dat de bewaarde bij oplegging van een straf of maatregel
      ingevolge het [Besluit Buitengewoon Strafrecht][ref3] of het [Tribunaalbesluit][ref4] niet langer van zijn vrijheid
      zal worden beroofd dan voor den tijd gedurende welken hij in bewaring is geweest;

      4°. indien voortzetting van de bewaring, gezien den geestelijken of lichamelijken toestand van den bewaarde of
      de belangen van zijn gezin in verband met den ernst van de feiten en gedragingen, waarvan hij verdacht wordt,
      redelijkerwijze niet is gerechtvaardigd.

      2 Een bewaarde kan in vrijheid worden gesteld, indien te zijnen aanzien niet is gebleken, dat hij de belangen
      van den Staat in feite heeft geschaad dan wel het leven, de vrijheid of het goed van medeburgers in feite heeft
      in gevaar gebracht, terwijl geen gewichtige omstandigheden den ernst van de feiten en gedragingen, waarvan hij
      verdacht wordt, verzwaren.

      3 Indien de bewaarde, die krachtens een der beide voorgaande leden voor invrijheidstelling in aanmerking komt,
      een vreemdeling is, wordt het dossier in handen gesteld van de korpschef en indien hij geen bekende woon- of
      verblijfplaats in Nederland heeft gehad, in handen van het hoofd van de Immigratie- en Naturalisatiedienst. Na
      ontvangst van het dossier wordt zoo spoedig mogelijk beslist of de vreemdeling al dan niet ten fine van uitleiding
      in bewaring zal blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0002006
      [ref2]: https://wetten.overheid.nl/BWBR0002009
      [ref3]: https://wetten.overheid.nl/BWBR0002006
      [ref4]: https://wetten.overheid.nl/BWBR0002009
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002006
      - id: ref2
        bwb_id: BWBR0002009
      - id: ref3
        bwb_id: BWBR0002006
      - id: ref4
        bwb_id: BWBR0002009
  - number: '15'
    text: |-
      1 Behoudens het bepaalde in het volgende artikel wordt last tot invrijheidstelling gegeven door of vanwege den
      procureur-fiscaal bij het Bijzondere Gerechtshof, die de zaak, waarin een bevel tot bewaring is gegeven, in
      behandeling heeft, of daarin een fiat-behandeling voor een Tribunaal heeft verleend.

      2 Van den last wordt een acte opgemaakt, waarvan een afschrift aan den in vrijheid gestelde wordt uitgereikt.
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel15
  - number: '16'
    text: |-
      1 Een bewaarde, die zich langer dan veertien dagen in bewaring bevindt, of zijn raadsman, kan een schriftelijk
      verzoek tot invrijheidstelling indienen bij het Bijzondere Gerechtshof of bij het Tribunaal.

      2 Op het verzoek wordt beslist door een raadsheer of raadsheer-plaatsvervanger in het Bijzondere Gerechtshof,
      daartoe voor den tijd van een jaar door Onze Minister van Veiligheid en Justitie op voordracht van den president
      aangewezen, of, indien een fiat-behandeling voor een Tribunaal is verleend, door het Tribunaal.

      3 Een verkeerd gericht verzoek wordt zoo mogelijk aan het bevoegd college doorgezonden en anders teruggestuurd.

      4 Tijdens of na de behandeling ter zitting wordt het bevel tot invrijheidstelling uitsluitend gegeven door het
      college, voor hetwelk de zaak dient of het laatst gediend heeft, ambtshalve, op vordering van den procureur-fiscaal
      of op verzoek van den bewaarde of diens raadsman. [Artikel 15, tweede lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002015#Artikel15
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002015
        artikel: '15'
        afdeling: V
  - number: '17'
    text: |-
      Het verzoek kan buiten behandeling blijven:

      1°. indien reeds een dag voor de behandeling van de zaak ter zitting van het Bijzondere Gerechtshof of het
      Tribunaal is bepaald;

      2°. indien een vroeger verzoek is afgewezen.
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel17
  - number: 17a
    text: |-
      1 De raadsheer of het Tribunaal geeft zoo spoedig mogelijk een schriftelijke beslissing, na desgeraden den
      bewaarde, diens raadsman en, voor zoover den raadsheer betreft, bovendien den procureur-fiscaal in de gelegenheid
      te hebben gesteld te worden gehoord.

      2 Verzoeken tot invrijheidstelling van hen, die na de inwerkingtreding van deze wet in bewaring zijn gesteld,
      worden behandeld bij voorrang boven alle andere verzoeken.

      3 Indien het verzoek wordt afgewezen, kan bij de beschikking een termijn worden vastgesteld, na afloop waarvan
      een herhaald verzoek niet buiten behandeling zal worden gelaten. De afloop van dezen termijn, die tenminste drie
      maanden na dagteekening der beschikking bedraagt, wordt zooveel doenlijk niet later gesteld dan het tijdstip,
      waarop naar het aanvankelijk oordeel van den raadsheer of het Tribunaal de bewaarde, ware hij reeds berecht, na het
      verstrijken van den duur van de straf of maatregel in vrijheid zou zijn gesteld.

      4 Na afloop van den termijn wordt een herhaald verzoek bij voorrang behandeld, mits dit verzoek wordt gedaan met
      gebruikmaking van een formulier van een daartoe door Onze Minister van Veiligheid en Justitie vastgesteld model.
      Een exemplaar van dit formulier wordt daartoe den bewaarde tegelijk met het afschrift der beslissing uitgereikt.

      5 Ook van de overige afwijzende en van de toewijzende beslissingen wordt den bewaarde onverwijld een afschrift
      uitgereikt.
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel17a
  - number: '18'
    text: |-
      1 Bewaarden, die in vrijheid worden gesteld, en andere personen, die verdacht worden van feiten en gedragingen,
      vallende onder het [Besluit Buitengewoon Strafrecht][ref1] en het [Tribunaalbesluit][ref2], kunnen door of vanwege
      den procureur-fiscaal bij het Bijzondere Gerechtshof, die de zaak in behandeling heeft, al dan niet voorwaardelijk
      buiten vervolging worden gesteld.

      2 Buitenvervolgingstelling heeft mede als rechtsgevolg, dat de gedragingen van den betrokkene niet meer kunnen
      worden onderworpen aan het oordeel van het Tribunaal.


      [ref1]: https://wetten.overheid.nl/BWBR0002006
      [ref2]: https://wetten.overheid.nl/BWBR0002009
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002006
      - id: ref2
        bwb_id: BWBR0002009
  - number: '19'
    text: |-
      De buitenvervolgingstelling geschiedt onvoorwaardelijk:

      1e. indien de gerezen verdenking ongegrond is gebleken;

      2e. indien niet blijkt, dat de schuld van den betrokkene van zoodanigen aard is, dat oplegging van een straf of
      maatregel ingevolge het [Besluit Buitengewoon Strafrecht][ref1] of het [Tribunaalbesluit][ref2] gerechtvaardigd is
      te achten.


      [ref1]: https://wetten.overheid.nl/BWBR0002006
      [ref2]: https://wetten.overheid.nl/BWBR0002009
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002006
      - id: ref2
        bwb_id: BWBR0002009
  - number: '20'
    text: |-
      1 In alle overige gevallen geschiedt de buitenvervolgingstelling voorwaardelijk en wel met inachtneming van het
      bepaalde in de navolgende leden.

      2 Steeds wordt de algemeene voorwaarde gesteld, dat de buiten vervolging gestelde zich als een goed Nederlander
      zal gedragen.

      3 Daarnaast worden één of meer van de navolgende bijzondere voorwaarden gesteld:

      a. ondertoezichtstelling van den buiten vervolging gestelde;

      b. verplichting zich te gedragen naar de aanwijzingen van aangewezen instellingen of personen;

      c. verbod om te gaan met bepaalde personen;

      d. verbod tot bepaalde vereenigingen toe te treden of bepaalde vergaderingen bij te wonen;

      e. verplichting tot het verrichten van arbeid;

      f. verplichting tot het verrichten van bepaalden arbeid;

      g. aanwijzing van een bepaalde verblijfplaats;

      h. verplichting zich op bepaalde tijdstippen te melden;

      i. handhaving van de onderbeheerstelling van het vermogen van den buiten vervolging gestelde met opdracht van het
      bewind over het vermogen aan het Beheersinstituut, bedoeld in artikel 33 van het Besluit Vijandelijk Vermogen;

      j. verplichting tot storting van een waarborgsom tot een onbeperkt bedrag ter waarborging van de naleving van
      andere bijzondere voorwaarden;

      k. verplichting binnen te bepalen termijn van bepaalde goederen afstand te doen;

      l. verplichting binnen te bepalen termijn een bepaald bedrag te betalen.

      4 De voorwaarden, behalve die genoemd in het voorgaande lid onder *k* en *l*, gelden voor een proeftijd van
      ten hoogste drie jaren. De proeftijd kan tweemaal worden verlengd, telkens voor de helft van den duur van den
      oorspronkelijk opgelegden proeftijd. Voor den duur van den proeftijd telt niet mede, dat den buiten vervolging
      gestelde rechtens zijn vrijheid is ontnomen.

      5 Het toezicht op de naleving der voorwaarden geschiedt door of vanwege den procureur-fiscaal.
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel20
  - number: '21'
    text: |-
      1 In geval van voorwaardelijke buitenvervolgingstelling is de buiten vervolging gestelde van rechtswege voor tien
      jaren ontzet van het recht tot:

      1°. Het bekleeden van ambten, het verrichten van werkzaamheden krachtens indienstneming op arbeidsovereenkomst naar
      burgerlijk recht door of vanwege het Rijk of eenig openbaar lichaam daaronder niet begrepen.

      2e. het dienen bij de gewapende macht;

      3e. het kiezen en de verkiesbaarheid bij krachtens wettelijk voorschrift uitgeschreven verkiezingen;

      4e. het zijn van raadsman of gerechtelijk bewindvoerder, tenzij door of vanwege den procureur-fiscaal anders wordt
      bepaald.

      2 [Artikel 5, tweede lid, van het Tribunaalbesluit][ref1] is van overeenkomstige toepassing.

      3 Hij, die een recht uitoefent, wetende dat hij daarvan ingevolge het voorgaande lid is ontzet, wordt gestraft
      met gevangenisstraf van ten hoogste zes maanden of geldboete van ten hoogste tien duizend gulden. Het feit wordt
      beschouwd als een misdrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0002009#Artikel5
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002009
        artikel: '5'
  - number: '22'
    text: |-
      1 De buitenvervolgingstelling geschiedt bij schriftelijke beslissing, welke den betrokkene tegen ontvangstbewijs
      wordt uitgereikt of bij aangeteekenden brief met ontvangstbewijs wordt toegezonden.

      2 Geschiedt de buitenvervolgingstelling voorwaardelijk, zoo vangt de proeftijd aan op het oogenblik van uitreiking
      of ontvangst van de beslissing.
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel22
  - number: '23'
    text: |-
      1 Indien nieuwe gronden van verdenking rijzen, omstandigheden bekend worden, welke een nieuw licht werpen op oude
      gronden of de gezindheid van den betrokkene, of voorwaarden, gesteld bij een buitenvervolgingstelling, niet worden
      nageleefd of nader niet wenschelijk blijken, kan door of vanwege den procureur-fiscaal:

      1e. wijziging worden gebracht in de bijzondere voorwaarden, bij een buitenvervolgingstelling gesteld;

      2e. een buitenvervolgingstelling worden ingetrokken;

      3e. een bevel worden gegeven tot aanhouding en bewaring van den betrokkene;

      4e. alleen bij niet-naleving van bijzondere voorwaarden: een gestelde waarborgsom geheel of gedeeltelijk worden
      verbeurdverklaard.

      2 Voor zoover in het verleden voldaan is aan voorwaarden, welke ingevolge een beslissing, genomen krachtens het
      eerste lid, wegvallen, wordt deze voldoening niet ongedaan gemaakt, tenzij door of vanwege den procureur-fiscaal
      anders wordt beslist.

      3 De beslissingen, in dit artikel genoemd, met uitzondering van die tot wijziging van voorwaarden, vermeld in
      [artikel 20, derde lid onder ][ref1], worden niet genomen, dan na verhoor of oproeping van den betrokkene. Deze kan
      zich bij zijn verhoor door een advocaat, binnen het rijk de praktijk uitoefenende, doen bijstaan. Van het verhoor
      wordt een proces-verbaal opgemaakt.

      4 De beslissingen, in dit artikel genoemd, worden schriftelijk genomen en den betrokkene tegen ontvangstbewijs
      uitgereikt of bij aangeteekenden brief met ontvangstbewijs toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002015#Artikel20
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002015
        artikel: '20'
        afdeling: VI
  - number: '24'
    text: |-
      Afgezien van het geval, genoemd in het voorgaande artikel en van dat, bedoeld in
      [artikel 37 van het Tribunaalbesluit][ref1], kan een in vrijheid gestelde niet opnieuw worden aangehouden of in
      bewaring gesteld op verdenking van een der in [artikel 1][ref2] bedoelde feiten of gedragingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002009#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0002015#Artikel1
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002009
        artikel: '37'
      - id: ref2
        bwb_id: BWBR0002015
        artikel: '1'
        afdeling: I
  - number: '25'
    text: |-
      1 Tegen een beslissing van voorwaardelijke buitenvervolgingstelling kan de betrokkene verzet doen uiterlijk binnen
      den tijd van veertien dagen na dien van aanvang van den proeftijd.

      2 Het verzet kan worden beperkt tot de ontzetting uit de in [artikel 21][ref1] genoemde rechten.

      3 Verzet kan ook worden gedaan tegen een beslissing tot wijziging van de bijzondere voorwaarden,
      bij een buitenvervolgingstelling gesteld, voor zoover die beslissing betreft voorwaarden, genoemd in
      [artikel 20, derde lid onder ][ref2]. Het verzet kan worden gedaan uiterlijk binnen veertien dagen na dien, waarop
      de betrokkene van de beslissing kennis heeft gekregen.


      [ref1]: https://wetten.overheid.nl/BWBR0002015#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002015#Artikel20
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002015
        artikel: '21'
        afdeling: VI
      - id: ref2
        bwb_id: BWBR0002015
        artikel: '20'
        afdeling: VI
  - number: '26'
    text: |-
      1 Het verzet geschiedt door het afleggen van een verklaring ten parkette van den procureur-fiscaal, door of vanwege
      wien de beslissing is genomen, of ter griffie van de rechtbank, van het arrondissement waarin de buitenvervolging
      gestelde zijn woon- of verblijfplaats heeft.

      2 De verklaring wordt afgelegd door den buiten vervolging gestelde, zijn raadsman, indien deze verklaart
      bepaaldelijk daartoe te zijn gevolmachtigd, of wel door een daartoe bij bijzondere volmacht schriftelijk
      gemachtigde. Wordt de verklaring afgelegd ter griffie van een rechtbank, dan stelt de griffier terstond bij
      aangeteekenden brief den procureur-fiscaal, bedoeld in het voorgaande lid, hiervan in kennis onder mededeeling, zoo
      noodig, dat de verklaring is afgelegd door den raadsman, of, indien de verklaring is afgelegd door een schriftelijk
      gemachtigde, met medezending van de volmacht.

      3 Van het afleggen van de verklaring doet de procureur-fiscaal zoo spoedig mogelijk aanteekening in een daartoe
      bestemd, ten parkette berustend register.

      4 Een op ambtseed opgemaakt afschrift van de in het voorgaande lid bedoelde aanteekening voegt de procureur-fiscaal
      bij de processtukken.
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel26
  - number: '27'
    text: |-
      1 Uiterlijk tot den aanvang der behandeling van het verzet kan dit worden ingetrokken. Het voorgaande artikel is
      van overeenkomstige toepassing.

      2 Intrekking van het verzet brengt mede afstand van de bevoegdheid om opnieuw in verzet te komen.
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel27
  - number: '28'
    text: |-
      Het verzet schorst noch de verplichting tot naleving van de voorwaarden noch de ontzetting uit de in
      [artikel 21][ref1] genoemde rechten, zoolang daarop niet bij onherroepelijke uitspraak is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0002015#Artikel21
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002015
        artikel: '21'
        afdeling: VI
  - number: '29'
    text: |-
      Het verzet brengt van rechtswege mede behandeling van de zaak, al naar gelang van haar aard, overeenkomstig het
      [Besluit Buitengewoon Strafrecht][ref1] en het [Besluit Buitengewone Rechtspleging][ref2], indien het Bijzondere
      Gerechtshof, en overeenkomstig het [Tribunaalbesluit][ref3], indien het Tribunaal ervan kennis neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0002006
      [ref2]: https://wetten.overheid.nl/BWBR0002008
      [ref3]: https://wetten.overheid.nl/BWBR0002009
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002006
      - id: ref2
        bwb_id: BWBR0002008
      - id: ref3
        bwb_id: BWBR0002009
  - number: '30'
    text: |-
      1 Indien degene, die in verzet is gekomen, niet ten dienende dage in rechten verschijnt, wordt het verzet vervallen
      verklaard. Geen hoogere voorziening staat hiertegen open.

      2 Evenwel kan bij niet-verschijniing eens of meer malen schorsing van het onderzoek worden bevolen, ten einde
      dengene, die in verzet is gekomen, zoo hij verhinderd was het onderzoek bij te wonen, daartoe alsnog in de
      gelegenheid te stellen; indien hij ook dan niet verschijnt, is het voorgaande lid van toepassing.
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel30
  - number: '31'
    text: |-
      Indien degene, die in verzet is gekomen tegen een beslissing van voorwaardelijke buitenvervolgingstelling, ten
      dienende dage in rechten verschijnt, wordt de zaak behandeld, als ware een voorwaardelijke buitenvervolgingstelling
      niet voorafgegaan.
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel31
  - number: '32'
    text: |-
      1 Indien het verzet is beperkt tot de ontzetting uit de in [artikel 21][ref1] genoemde rechten of is gedaan tegen
      een beslissing tot wijziging van de bijzondere voorwaarden, geschiedt, in afwijking in zooverre van het bepaalde
      in [artikel 29][ref2], de behandeling steeds door den president van het Bijzondere Gerechtshof of een door dezen
      daartoe aangewezen rechtsgeleerden raadsheer, die zich bij de behandeling bepaalt tot een summiere kennisneming van
      de processtukken.

      2 Indien in de in het voorgaande lid omschreven gevallen degene, die in verzet is gekomen, ten dienende dage
      verschijnt, wordt de beslissing van den procureur-fiscaal bekrachtigd en wel met geheele of gedeeltelijke
      vernietiging daarvan een nieuwe beslissing genomen. Geen hoogere voorziening staat hiertegen open.


      [ref1]: https://wetten.overheid.nl/BWBR0002015#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002015#Artikel29
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002015
        artikel: '21'
        afdeling: VI
      - id: ref2
        bwb_id: BWBR0002015
        artikel: '29'
        afdeling: VIII
  - number: '33'
    text: |-
      Een bewaring, van kracht op het tijdstip van inwerkingtreding van dit besluit, wordt geacht door of vanwege den
      procureur-fiscaal met ingang van dit tijdstip voor een termijn van drie maanden te zijn verlengd.
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel33
  - number: '34'
    text: |-
      Met ingang van het tijdstip van inwerkingtreding van dit besluit kan een Tribunaal slechts zaken in behandeling
      nemen, ten aanzien waarvan de procureur-fiscaal een fiatbehandeling heeft verleend.
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel34
  - number: '35'
    text: Onze Minister van Veiligheid en Justitie stelt regelen vast ter uitvoering van dit besluit.
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel35
  - number: '40'
    text: |-
      1 Dit besluit, ten aanzien waarvan de bevoegdheid, bedoeld in artikel 9, tweede lid, van het Besluit op den
      bijzonderen staat van beleg, niet kan worden uitgeoefend, treedt in werking op den tweeden dag na dien zijner
      afkondiging.

      2 Het kan worden aangehaald als "Besluit politieke delinquenten 1945".
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel40
