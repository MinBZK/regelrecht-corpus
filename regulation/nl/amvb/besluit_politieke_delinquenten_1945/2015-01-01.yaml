preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onzen Minister van Justitie van 4 October 1945, no. 1120;

    Overwegende, dat het wenschelijk is eenige regelen vast te stellen met betrekking tot politieke delinquenten;

    Den Raad van State gehoord (advies van 16 October 1945, no. 18);

    Gezien het nader rapport van Onzen voornoemden Minister van 22 October 1945, 6e Afdeeling, no. 1101;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Met de opsporing van de strafbare feiten, waarop het [Besluit Buitengewoon Strafrecht][ref1] van toepassing is
      en van de gedragingen, genoemd in [artikel 1 van het Tribunaalbesluit][ref2], zijn belast de ambtenaren, bedoeld
      in [artikel 141 van het Wetboek van Strafvordering][ref3], alsmede de daartoe door Onze Minister van Veiligheid en
      Justitie aan te wijzen ambtenaren van politie.

      2 Zij richten zich bij de uitvoering van hun taak naar de bevelen, hun bij uitsluiting gegeven door of vanwege den
      procureur-fiscaal bij het Bijzonder Gerechtshof, binnen welks ressort zij standplaats hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0002006
      [ref2]: https://wetten.overheid.nl/BWBR0002009#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0002015/2015-01-01#Artikel1
