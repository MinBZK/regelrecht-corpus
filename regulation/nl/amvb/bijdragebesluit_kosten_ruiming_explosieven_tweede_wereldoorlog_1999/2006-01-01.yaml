  - number: '13'
    text: |-
      1 Om in aanmerking te kunnen komen voor een bijdrage dient het college de declaratie vóór 1 oktober van het jaar
      volgend op de beëindiging van de opsporings- of ruimingswerkzaamheden in bij Onze Minister.

      2 Bij opsporingswerkzaamheden met een doorlooptijd langer dan 12 maanden wordt per kalenderjaar een declaratie
      ingediend.

      3 Het college dient bij de declaratie een kopie van de passage uit de gemeenterekening van het desbetreffende
      jaar en de toelichting daarop tezamen met het verslag en de verklaring van de accountant, bedoeld in
      [artikel 393, eerste lid van Boek 2 van het Burgerlijk Wetboek][ref1], die met het onderzoek van de rekening is
      belast, voor zover deze betrekking hebben op de inkomsten en uitgaven ter zake van de bijdragen te overleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0010700/2006-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '14'
    text: |-
      Een declaratie voor een opsporing heeft als inhoud:

      a. de feitelijke aard van het aangetroffen explosief of de explosieven;

      b. de feitelijke straal van de schervengevarenzone;

      c. de feitelijke ligging van het explosief of de explosieven ten opzichte van de bebouwde kom of een kwetsbare
      infrastructuur, uitgaande van de situatie op 1 januari 1994;

      d. de werkzaamheden die zijn verricht als gevolg van de opsporing en de ruiming van het aangetroffen explosief of
      de explosieven;

      e. de maatregelen die zijn getroffen ter voorkoming van schade;

      f. de datum waarop de opsporingswerkzaamheden zijn beëindigd;

      g. een gespecificeerde opgave van de gemaakte kosten en eventuele stelposten;

      h. een kopie van de betreffende passage uit de gemeenterekening van het desbetreffende jaar en de toelichting
      daarop, tezamen met het verslag van de accountant, bedoeld in [artikel 13, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010700#Artikel13
    url: https://wetten.overheid.nl/BWBR0010700/2006-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0010700
        artikel: '13'
        paragraaf: '7'
  - number: '15'
    text: |-
      Een declaratie voor een ruiming heeft als inhoud:

      a. de aard van het aangetroffen explosief;

      b. de straal van de schervengevarenzone;

      c. een situatietekening en een plattegrond van de gemeente;

      d. de risico's voor de bevolking;

      e. de werkzaamheden die verricht zijn als gevolg van de ruiming van de aangetroffen explosieven;

      f. de maatregelen die getroffen zijn ter voorkoming van schade;

      g. een gespecificeerde opgave van de kosten;

      h. het tijdstip waarop de ruimingswerkzaamheden zijn beëindigd;

      i. een kopie van de betreffende passage uit de gemeenterekening van het desbetreffende jaar en de toelichting
      daarop tezamen met het verslag en de verklaring van de accountant, zoals bedoeld in [artikel 13, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010700#Artikel13
    url: https://wetten.overheid.nl/BWBR0010700/2006-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0010700
        artikel: '13'
        paragraaf: '7'
  - number: '16'
    text: |-
      1 De verplichtingenruimte, bedoeld in [artikel 3, eerste lid][ref1], wordt door Onze Minister onderverdeeld naar
      opsporingen en ruimingen.

      2 Indien de verplichtingenruimte voor opsporingen niet toereikend is worden de bijdragen voor opsporingen toegekend
      naar rato van het beschikbare bedrag.

      3 Indien de verplichtingenruimte voor ruimingen niet toereikend is worden de bijdragen voor ruimingen in een
      volgend jaar toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0010700#Artikel3
    url: https://wetten.overheid.nl/BWBR0010700/2006-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0010700
        artikel: '3'
        paragraaf: '2'
  - number: '17'
    text: |-
      1 De bijdrage wordt niet eerder vastgesteld dan nadat de door de gemeente gemaakte kosten ten genoegen van Onze
      Minister zijn aangetoond.

      2 Alvorens tot vaststelling van de bijdrage wordt overgegaan kan Onze Minister een nader onderzoek instellen naar
      de noodzakelijkheid, de rechtmatigheid en de doelmatigheid van de gedeclareerde kosten.
    url: https://wetten.overheid.nl/BWBR0010700/2006-01-01#Artikel17
  - number: '18'
    text: |-
      De kasruimte voor de ruimingen wordt gelijk gesteld aan de op grond van [artikel 16, eerste lid][ref1],
      vastgestelde verplichtingenruimte voor de ruimingen. Onbesteed gebleven bedragen worden op 1 oktober van het
      begrotingsjaar toegevoegd aan de kasruimte voor de opsporingen.


      [ref1]: https://wetten.overheid.nl/BWBR0010700#Artikel16
    url: https://wetten.overheid.nl/BWBR0010700/2006-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0010700
        artikel: '16'
        paragraaf: '8'
  - number: '19'
    text: |-
      1 De bijdragen in de kosten van een opsporing worden betaalbaar gesteld in de volgorde van het tijdstip waarop de
      opsporingswerkzaamheden in uitvoering zijn genomen.

      2 De bijdragen in de kosten van een ruiming worden betaalbaar gesteld in de volgorde van het tijdstip waarop de
      declaratie door Onze Minister is ontvangen.
    url: https://wetten.overheid.nl/BWBR0010700/2006-01-01#Artikel19
  - number: '20'
    text: |-
      1 Op vertoon van bewijsstukken kan een voorlopige bijdrage betaalbaar worden gesteld.

      2 Aan de toekenning van een voorlopige bijdrage kunnen geen rechten worden ontleend.
    url: https://wetten.overheid.nl/BWBR0010700/2006-01-01#Artikel20
  - number: '21'
    text: |-
      Bij een overschrijding van de bij begrotingswet toegestane ruimte voor het doen van uitgaven, worden de bijdragen,
      met inachtneming van de [artikelen 16][ref1] en [19][ref2], op een nader door Onze Minister te bepalen tijdstip
      uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0010700#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0010700#Artikel19
    url: https://wetten.overheid.nl/BWBR0010700/2006-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0010700
        artikel: '16'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0010700
        artikel: '19'
        paragraaf: '9'
  - number: '22'
    text: |-
      1 Dit besluit is van overeenkomstige toepassing op opsporingen en ruimingen waarvoor aan de gemeente een bijdrage
      is toegekend op grond van het [Bijdragebesluit kosten ruiming explosieven Tweede Wereldoorlog 1994][ref1] en
      waarvoor de bijdrage in de door de gemeente gemaakte kosten op 1 januari 1999 nog niet definitief is vastgesteld
      dan wel nog niet volledig tot uitbetaling is gekomen.

      2 In afwijking van het eerste lid, is de gemeente geen bijdrage verschuldigd in de kosten van
      opsporingswerkzaamheden die vóór 1 augustus 1998 uitsluitend door personeel van het ministerie van Defensie werden
      verricht, mits de opsporing vóór 1 januari 1999 in uitvoering is genomen. De verplichtingenruimte voor opsporingen
      als bedoeld in [artikel 16, eerste lid][ref2], wordt verminderd met de verplichtingen voor deze kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0006236
      [ref2]: https://wetten.overheid.nl/BWBR0010700#Artikel16
    url: https://wetten.overheid.nl/BWBR0010700/2006-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006236
      - id: ref2
        bwb_id: BWBR0010700
        artikel: '16'
        paragraaf: '8'
  - number: '23'
    text: |-
      Bij de toepassing van [artikel 12][ref1] worden opsporingen en ruimingen dan wel, naar het oordeel van Onze
      Minister, op zich zelf staande onderdelen daarvan, die vóór 1 januari 1999 in uitvoering zijn genomen, mede bij de
      beoordeling betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0010700#Artikel12
    url: https://wetten.overheid.nl/BWBR0010700/2006-01-01#Artikel23
    references:
