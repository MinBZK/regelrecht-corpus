        bwb_id: BWBR0010700
        artikel: '12'
        paragraaf: '6'
  - number: '25'
    text: 'Dit besluit wordt aangehaald als: Bijdragebesluit kosten ruiming explosieven Tweede Wereldoorlog 1999.'
    url: https://wetten.overheid.nl/BWBR0010700/2006-01-01#Artikel25
