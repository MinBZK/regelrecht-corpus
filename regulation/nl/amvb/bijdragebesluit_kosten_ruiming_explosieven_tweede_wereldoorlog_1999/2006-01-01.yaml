articles:
  - number: '1'
    text: |-
      Dit besluit verstaat onder:

      a. explosieven: bommen en gevechtsladingen; geleide en ballistische projectielen; munitie voor artillerie,
      mortieren en klein-kaliberwapens; alle mijnen, torpedo's en dieptebommen; vernielingsladingen; al dan niet
      pyrotechnische vuurwerken; bundelrekken, moederbommen en dispensers; inrichtingen in werking gesteld door patronen
      en stuwstoffen; electrische ontstekingsrichtingen;

      b. opsporing: onderzoeken van een bepaald gebied in verband met de vermoede aanwezigheid van explosieven afkomstig
      uit de Tweede Wereldoorlog;

      c. opsporingswerkzaamheden: detecteren (vaststellen van de aanwezigheid van een voorwerp op of onder het
      maaiveld) en lokaliseren (vaststellen van de exacte ligplaats van een voorwerp, dat op of onder het maaiveld is
      gedetecteerd);

      d. ruiming: benaderen, veiligstellen, afvoeren of vernietigen van een explosief, afkomstig uit de Tweede
      Wereldoorlog, dat in een bepaald gebied is aangetroffen;

      e. ruimingswerkzaamheden: werkzaamheden die verband houden met de ruiming van een aangetroffen explosief dan wel
      van een voorwerp waarvan de exacte ligplaats bij opsporingswerkzaamheden op of onder het maaiveld is gedetecteerd;

      f. college: het college van burgemeester en wethouders van een gemeente;

      g. Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      h. deskundigen: personen die voldoen aan de bij ministeriële regeling te stellen eisen van vakbekwaamheid op het
      niveau van opruimer explosieven;

      i. opsporingsbedrijven: bedrijven die voldoen aan de bij ministeriële regeling te stellen eisen;

      j. bebouwde kom: de bebouwde kom van de gemeente zoals deze op basis van luchtfoto's uit 1992 is bepaald door de
      Topografische Dienst Nederland van het ministerie van Defensie voor de vaststelling van de bebouwingsgegevens voor
      de berekening van de algemene uitkering uit het Gemeentefonds;

      k. schervengevarenzone: de zone waarbinnen een explosief, waarvan de ligging bekend is dan wel wordt vermoed,
      volgens de richtlijnen van het ministerie van Defensie, schade kan aanrichten bij een detonatie;

      l. infrastructuur: het geheel van auto-, spoor-, straat-, waterwegen, havens, vliegvelden, elektrische installaties
      en dergelijke;

      m. kwetsbare infrastructuur: dat deel van de infrastructuur waaraan als gevolg van detonatie van een vermoedelijk
      aanwezig dan wel aanwezig explosief zodanige schade kan worden aangericht dat er grote risico's ontstaan voor de
      bevolking;

      n. begroting: de begroting van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0010700/2006-01-01#Artikel1
  - number: 1a
    text: |-
      Dit besluit is niet van toepassing op de kosten van opsporing en ruiming van explosieven die het gevolg zijn van
      door het Rijk geïnitieerde grote infrastructurele projecten.
    url: https://wetten.overheid.nl/BWBR0010700/2006-01-01#Artikel1a
  - number: '2'
    text: |-
      1 Alle beslissingen om al dan niet tot opsporen en ruimen van explosieven over te gaan worden genomen door het
      college.

      2 Het college beslist over de wijze waarop opsporingswerkzaamheden worden uitgevoerd.

      3 De kosten van werkzaamheden die verband houden met de opsporing of ruiming van explosieven zijn voor rekening van
      de gemeente, met dien verstande dat voor een aantal soorten kosten van rijkswege in bepaalde gevallen een bijdrage
      kan worden toegekend.

      4 De kosten van de werkzaamheden die verband houden met de ruiming van explosieven die na een opsporing zijn
      aangetroffen worden gerekend tot de kosten van de opsporing.

      5 Een bijdrage, bedoeld in het derde lid, wordt verminderd dan wel niet toegekend indien:

      a. de gemeente op andere wijze voor de kosten vergoeding heeft verkregen dan wel had kunnen verkrijgen;

      b. de kosten door schuld of nalatigheid van de gemeente zijn veroorzaakt of vergroot;

      c. de opsporingswerkzaamheden zijn uitgevoerd door personeel dat en bedrijven die niet voldoen aan de eisen en
      voorwaarden als bedoeld in [artikel 1, onder h en i][ref1];

      d. de ruiming niet is uitgevoerd door de onder het ministerie van Defensie ressorterende competente diensten;

      e. de kosten het gevolg zijn van door het Rijk geïnitieerde grote infrastructurele projecten binnen de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0010700#Artikel1
    url: https://wetten.overheid.nl/BWBR0010700/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010700
        artikel: '1'
        paragraaf: '1'
  - number: '3'
    text: |-
      1 Onze Minister stelt jaarlijks het bedrag vast tot welke ten hoogste verplichtingen kunnen worden aangegaan voor
      de opsporing en ruiming van explosieven.

      2 De gemeenten worden vóór 1 oktober van het jaar voorafgaand aan het begrotingsjaar in kennis gesteld van het
      bedrag als bedoeld in het eerste lid.

      3 Voor een bijdrage in de kosten komen uitsluitend die opsporingen of ruimingen in aanmerking waarbij de vermoede
      aanwezigheid dan wel aanwezigheid van explosieven grote risico's voor de bevolking met zich brengt en de kosten
      redelijkerwijs niet geheel voor rekening van de gemeente kunnen blijven.

      4 De wijze waarop aan de opsporingswerkzaamheden uitvoering wordt gegeven dient noodzakelijk te zijn in verband met
      het toekomstige gebruik van de grond.

      5 De bijdrage wordt toegekend voorzover de op de begroting toegestane ruimte voor het aangaan van verplichtingen
      niet wordt overschreden.

      6 Bij het vaststellen van de bijdrage wordt rekening gehouden met een eigen bijdrage van de gemeente.
    url: https://wetten.overheid.nl/BWBR0010700/2006-01-01#Artikel3
  - number: 3a
    text: |-
      1 Een bijdrage wordt alleen toegekend indien het college de opsporings- en ruimingswerkzaamheden vóór de aanvang
      van de werkzaamheden bij Onze Minister heeft aangemeld.

      2 In de aanmelding wordt opgenomen:

        - de reden van de opsporing;
        - de uitkomsten van het vooronderzoek en het op basis daarvan uitgebrachte advies aan het college, een plan van
      aanpak, een werkplan en een Veiligheids-, Milieu- en Gezondheidsplan;
        - de vermoedelijke aard van het explosief of de explosieven;
        - de vermoedelijke straal van de schervengevarenzone;
        - een situatietekening en een plattegrond van de gemeente;
        - het gebied waarbinnen bepaalde (grond)werkzaamheden tot detonatie kunnen leiden;
        - de vermoedelijke ligging van het explosief of de explosieven ten opzichte van de bebouwde kom of een kwetsbare
      infrastructuur, uitgaande van de situatie op 1 januari 1994;
        - de voorziene risico's voor de bevolking, waaronder eventuele milieu-aspecten;
        - de mogelijkheden om al dan niet beschermende maatregelen te treffen;
        - de werkzaamheden die moeten worden verricht voor de opsporing van het explosief of de explosieven;
        - de te hanteren opsporingsmethode in relatie tot het (toekomstige) gebruik van de grond;
        - de maatregelen die worden getroffen ter voorkoming van schade;
        - een gespecificeerde kostenraming;
        - het tijdstip waarop de werkzaamheden een aanvang zullen nemen en naar verwachting zullen worden beëindigd.

      3 Het eerste lid is niet van toepassing, indien naar aanleiding van een vondst van een explosief wegens acuut
      levensbedreigend gevaar voor de bevolking direct met opsporings- en ruimingswerkzaamheden wordt begonnen, dan
      wel dat na een ruiming nadere opsporingswerkzaamheden met spoed noodzakelijk zijn. De aanmelding geschiedt dan zo
      spoedig mogelijk.
    url: https://wetten.overheid.nl/BWBR0010700/2006-01-01#Artikel3a
  - number: '4'
    text: |-
      Bij een opsporing kunnen de volgende soorten kosten voor een bijdrage in aanmerking komen:

      a. kosten van vooronderzoek;

      b. kosten van opsporingswerkzaamheden;

      c. kosten van grondwerkzaamheden;

      d. kosten van preventieve maatregelen ter voorkoming van schade;

      e. kosten die gemaakt zijn in verband met het treffen van noodzakelijke spoedvoorzieningen;

      f. kosten van ruimingswerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0010700/2006-01-01#Artikel4
  - number: '5'
    text: |-
      Bij een ruiming kunnen de in [artikel 4 onder c. tot en met f.][ref1] genoemde soorten kosten voor een bijdrage in
      aanmerking komen.


      [ref1]: https://wetten.overheid.nl/BWBR0010700#Artikel4
    url: https://wetten.overheid.nl/BWBR0010700/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010700
        artikel: '4'
        paragraaf: '3'
  - number: '6'
    text: |-
      De kosten van de verzekering van het bovenmatig risico dat verbonden is aan het opsporen of ruimen van explosieven
      en dat niet gedekt wordt door de gebruikelijke verzekeringen kunnen voor een bijdrage in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0010700/2006-01-01#Artikel6
  - number: '7'
    text: |-
      In geval van een calamiteit kunnen, op verzoek van het college, ook andere dan de in dit besluit vermelde
      kostensoorten voor een bijdrage in aanmerking komen, indien deze, naar het oordeel van Onze Minister,
      redelijkerwijs niet of slechts gedeeltelijk voor rekening van de gemeente kunnen blijven.
    url: https://wetten.overheid.nl/BWBR0010700/2006-01-01#Artikel7
  - number: '8'
    text: |-
      Van grote risico's voor de bevolking als bedoeld in [artikel 3, derde lid][ref1], is sprake indien:

      in geval van opsporing:

      a. het explosief zich vermoedelijk bevindt binnen de grens van de bebouwde kom van de gemeente gerekend naar
      de situatie op 1 januari 1994 dan wel de afstand van de vermoede inslagplaats van het explosief tot de grens
      van die bebouwde kom door de deskundigen kleiner wordt geacht dan de straal van de schervengevarenzone van het
      desbetreffende explosief en zich binnen de schervengevarenzone, gerekend naar de situatie per 1 januari 1994
      bebouwing bevindt dan wel een kwetsbare infrastructuur, en bovendien binnen een door deskundigen vastgestelde
      straal van de vermoede vindplaats van het explosief zodanige (grond) werkzaamheden worden verricht dat detonatie
      een reëel risico wordt geacht;

      b. zich in een gebied dat vrij toegankelijk is voor personen en waar reeds op 1 januari 1994 aantoonbaar sprake
      was van een intensief (recreatief) gebruik, op geringe diepte explosieven bevinden, terwijl het redelijkerwijs niet
      mogelijk is om beschermende maatregelen te treffen zoals het plaatsen van hekken en verbodsborden;

      c. er aantoonbaar sprake is van een ernstige verontreiniging van het grond- of oppervlaktewater als gevolg van
      de vermoede aanwezigheid van explosieven, terwijl het redelijkerwijs niet mogelijk is beschermende maatregelen te
      treffen zoals isolatie van het desbetreffende gebied;

      in geval van ruiming:

      d. het explosief aangetroffen is binnen de grens van de bebouwde kom van de gemeente dan wel de afstand tot de
      grens van die bebouwde kom kleiner is dan de straal van de schervengevarenzone van het desbetreffende explosief
      terwijl zich binnen de schervengevarenzone bebouwing bevindt;

      e. het explosief aangetroffen is in een gebied dat vrij toegankelijk is voor personen en waar aantoonbaar sprake
      is van een intensief (recreatief) gebruik, tenzij het redelijkerwijs mogelijk is om beschermende maatregelen te
      treffen zoals het plaatsen van hekken en verbodsborden;

      f. binnen de straal van de schervengevarenzone van het aangetroffen explosief sprake is van een kwetsbare
      infrastructuur.


      [ref1]: https://wetten.overheid.nl/BWBR0010700#Artikel3
    url: https://wetten.overheid.nl/BWBR0010700/2006-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0010700
        artikel: '3'
        paragraaf: '2'
  - number: '9'
    text: |-
      Aan [artikel 3, vierde lid][ref1], wordt voldaan als het college in voldoende mate kan aantonen dat:

      a. opsporingswerkzaamheden met behulp van dieptedetectie-apparatuur noodzakelijk zijn omdat binnen een vastgestelde
      straal van de vermoede vindplaats van het explosief, zodanige (grond) werkzaamheden worden verricht dat detonatie
      door deskundigen niet ondenkbaar wordt geacht;

      b. opsporingswerkzaamheden met behulp van oppervlaktedetectie-apparatuur noodzakelijk zijn omdat binnen een gebied
      waar de aanwezigheid van explosieven wordt vermoed eenvoudige verhardingen worden aangelegd of niet diepliggende
      leidingenstelsels en rioleringen.


      [ref1]: https://wetten.overheid.nl/BWBR0010700#Artikel3
    url: https://wetten.overheid.nl/BWBR0010700/2006-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0010700
        artikel: '3'
        paragraaf: '2'
  - number: '10'
    text: |-
      Van [artikel 9][ref1] kan worden afgeweken indien in een gebied sprake is van een zodanig ernstige verontreiniging
      van het grond- of oppervlaktewater als gevolg van de vermoede aanwezigheid van explosieven dat er grote risico's
      voor de bevolking ontstaan, terwijl het niet mogelijk is afdoende beheersingsmaatregelen te treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0010700#Artikel9
    url: https://wetten.overheid.nl/BWBR0010700/2006-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0010700
        artikel: '9'
        paragraaf: '5'
  - number: '11'
    text: |-
      1 De ingevolge dit besluit voor een bijdrage in aanmerking komende kosten worden, onverminderd paragraaf 2, vergoed
      tot ten hoogste 80%, voorzover de op grond van paragraaf 3 in aanmerking komende kosten van een opsporing of
      ruiming uitgaan boven de ten laste van de gemeente blijvende drempelbijdrage.

      2 De in het eerste lid bedoelde drempelbijdrage wordt per opsporing of ruiming bepaald door het aantal inwoners
      per 1 januari van het jaar voorafgaand aan het jaar waarin de werkzaamheden in uitvoering zijn genomen te
      vermenigvuldigen met € 2,50.

      3 Indien het grondgebied van de gemeente op 1 januari van het jaar waarin de werkzaamheden in uitvoering zijn
      genomen gewijzigd is, wordt het in het tweede lid bedoelde aantal inwoners gesteld op het aantal inwoners op 1
      januari van dat jaar.
    url: https://wetten.overheid.nl/BWBR0010700/2006-01-01#Artikel11
  - number: 11a
    text: |-
      In afwijking van artikel 11, worden de ingevolge dit besluit voor een bijdrage in aanmerking komende kosten
      volledig vergoed, indien:

      a. op een terrein dat in eigendom is van de Staat door natuurlijke processen een situatie van acuut
      levensbedreigend gevaar voor de bevolking is ontstaan, waardoor onmiddellijke opsporing en ruiming van explosieven
      noodzakelijk is, en

      b. de explosieven zich bevinden op of in de directe omgeving van een plaats waar tijdens dan wel kort na de Tweede
      Wereldoorlog grote hoeveelheden explosieven ter vernietiging bijeen zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0010700/2006-01-01#Artikel11a
  - number: '12'
    text: |-
      1 Indien de gemeente verkeert in omstandigheden als bedoeld in [artikel 12 van de Financiële-verhoudingswet][ref1]
      of door de toepassing van [artikel 11][ref2] zou komen te verkeren, kan Onze Minister, indien de (dreigende)
      [artikel 12][ref3] omstandigheden zich gedurende een aaneengesloten periode van 5 jaar voordoen, op verzoek
      van burgemeester en wethouders het aandeel van de gemeente in de voor een bijdrage in aanmerking komende kosten
      verlagen tot minimaal € 1,82 per inwoner per jaar over een aaneengesloten periode van 5 jaar.

      2 Bij de beoordeling van een verzoek als bedoeld in het eerste lid wordt mede rekening gehouden met de ten laste
      van de gemeente gebleven kosten van bodemsanering.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0010700#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0008290#Artikel12
