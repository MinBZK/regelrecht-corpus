articles:
  - number: '1'
    text: >-
      Dit besluit verstaat onder:


      a. explosieven: bommen en gevechtsladingen; geleide en ballistische projectielen; munitie voor artillerie,
      mortieren en klein-kaliberwapens; alle mijnen, torpedo's en dieptebommen; vernielingsladingen; al dan niet
      pyrotechnische vuurwerken; bundelrekken, moederbommen en dispensers; inrichtingen in werking gesteld door patronen
      en stuwstoffen; electrische ontstekingsrichtingen;


      b. opsporing: onderzoeken van een bepaald gebied in verband met de vermoede aanwezigheid van explosieven afkomstig
      uit de Tweede Wereldoorlog;


      c. opsporingswerkzaamheden: detecteren (vaststellen van de aanwezigheid van een voorwerp op of onder het
      maaiveld) en lokaliseren (vaststellen van de exacte ligplaats van een voorwerp, dat op of onder het maaiveld is
      gedetecteerd);


      d. ruiming: benaderen, veiligstellen, afvoeren of vernietigen van een explosief, afkomstig uit de Tweede
      Wereldoorlog, dat in een bepaald gebied is aangetroffen;


      e. ruimingswerkzaamheden: werkzaamheden die verband houden met de ruiming van een aangetroffen explosief dan wel
      van een voorwerp waarvan de exacte ligplaats bij opsporingswerkzaamheden op of onder het maaiveld is gedetecteerd;


      f. bestuursorgaan: het gemeentebestuur, en bij opsporingen of ruimingen in gebieden die niet gemeentelijk zijn
      ingedeeld, de bevoegde burgerlijke autoriteit ter plaatse;


      g. Onze Minister: Onze Minister van Financiën;


      h. deskundigen: personen die voldoen aan de, in de bijlage bij de circulaire van 31 juli 1998, kenmerk fip
      98/624 M, van het ministerie van Financiën:« Voorlopige eisen en voorwaarden inzake opsporingswerkzaamheden naar
      conventionele explosieven door gemeentelijke en civiele explosieven opsporingsbedrijven», gestelde eisen van
      vakbekwaamheid op het niveau van opruimer explosieven;


      i. opsporingsbedrijven: bedrijven die voldoen aan de, in de bijlage bij de circulaire van 31 juli 1998, kenmerk fip
      98/624 M, van het ministerie van Financiën: «Voorlopige eisen en voorwaarden inzake opsporingswerkzaamheden naar
      conventionele explosieven door gemeentelijke en civiele explosieven opsporingsbedrijven», gestelde eisen;


      j. bebouwde kom: de bebouwde kom van de gemeente zoals deze op basis van luchtfoto's uit 1992 is bepaald door de
      Topografische Dienst Nederland van het ministerie van Defensie voor de vaststelling van de bebouwingsgegevens voor
      de berekening van de algemene uitkering uit het Gemeentefonds;


      k. schervengevarenzone: de zone waarbinnen een explosief, waarvan de ligging bekend is dan wel wordt vermoed,
      volgens de richtlijnen van het ministerie van Defensie, schade kan aanrichten bij een detonatie;


      l. infrastructuur: het geheel van auto-, spoor-, straat-, waterwegen, havens, vliegvelden, elektrische installaties
      en dergelijke;


      m. kwetsbare infrastructuur: dat deel van de infrastructuur waaraan als gevolg van detonatie van een vermoedelijk
      aanwezig dan wel aanwezig explosief zodanige schade kan worden aangericht dat er grote risico's ontstaan voor de
      bevolking;


      n. begroting: de begroting van Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0010700/2002-01-01#Artikel1
  - number: '2'
    text: |-
      1 Alle beslissingen om al dan niet tot opsporen en ruimen van explosieven over te gaan worden genomen door het
      bestuursorgaan.

      2 Het bestuursorgaan beslist over de wijze waarop opsporingswerkzaamheden worden uitgevoerd.

      3 De kosten van werkzaamheden die verband houden met de opsporing of ruiming van explosieven zijn voor rekening van
      het bestuursorgaan, met dien verstande dat voor een aantal soorten kosten van rijkswege in bepaalde gevallen een
      bijdrage kan worden toegekend.

      4 De kosten van de werkzaamheden die verband houden met de ruiming van explosieven die na een opsporing zijn
      aangetroffen worden gerekend tot de kosten van de opsporing.

      5 Een bijdrage, bedoeld in het derde lid, wordt verminderd dan wel niet toegekend indien:

      a. het bestuursorgaan op andere wijze voor de kosten vergoeding heeft verkregen;

      b. de kosten door schuld of nalatigheid van het bestuursorgaan zijn veroorzaakt of vergroot;

      c. de opsporingswerkzaamheden zijn uitgevoerd door personeel dat en bedrijven die niet voldoen aan de eisen en
      voorwaarden als bedoeld in [artikel 1, onder h en i][ref1];

      d. de ruiming niet is uitgevoerd door de onder het ministerie van Defensie ressorterende competente diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0010700#Artikel1
    url: https://wetten.overheid.nl/BWBR0010700/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010700
        artikel: '1'
        paragraaf: '1'
  - number: '3'
    text: >-
      1 Onze Minister stelt jaarlijks het bedrag vast tot welke ten hoogste verplichtingen kunnen worden aangegaan voor
      de opsporing en ruiming van explosieven.


      2 De bestuursorganen worden vóór 1 oktober van het jaar voorafgaand aan het begrotingsjaar in kennis gesteld van
      het bedrag als bedoeld in het eerste lid.


      3 Voor een bijdrage in de kosten komen uitsluitend die opsporingen of ruimingen in aanmerking waarbij de vermoede
      aanwezigheid dan wel aanwezigheid van explosieven en grote risico's voor de bevolking met zich brengt en de kosten
      redelijkerwijs niet geheel voor rekening van het bestuursorgaan kunnen blijven.


      4 De wijze waarop aan de opsporingswerkzaamheden uitvoering wordt gegeven dient noodzakelijk te zijn in verband met
      het toekomstige gebruik van de grond.


      5 De bijdrage wordt toegekend voorzover de op de begroting toegestane ruimte voor het aangaan van verplichtingen
      niet wordt overschreden.


      6 Bij het vaststellen van de bijdrage wordt rekening gehouden met een eigen bijdrage van het bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0010700/2002-01-01#Artikel3
  - number: '4'
    text: >-
      Bij een opsporing kunnen de volgende soorten kosten voor een bijdrage in aanmerking komen:


      a. kosten van vooronderzoek;


      b. kosten van opsporingswerkzaamheden;


      c. kosten van grondwerkzaamheden;


      d. kosten van preventieve maatregelen ter voorkoming van schade;


      e. kosten die gemaakt zijn in verband met het treffen van noodzakelijke spoedvoorzieningen;


      f. kosten van ruimingswerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0010700/2002-01-01#Artikel4
  - number: '5'
    text: |-
      Bij een ruiming kunnen de in [artikel 4 onder c. tot en met f.][ref1] genoemde soorten kosten voor een bijdrage in
      aanmerking komen.


      [ref1]: https://wetten.overheid.nl/BWBR0010700#Artikel4
    url: https://wetten.overheid.nl/BWBR0010700/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010700
        artikel: '4'
        paragraaf: '3'
  - number: '6'
    text: >-
      De kosten van de verzekering van het bovenmatig risico dat verbonden is aan het opsporen of ruimen van explosieven
      en dat niet gedekt wordt door de gebruikelijke verzekeringen kunnen voor een bijdrage in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0010700/2002-01-01#Artikel6
  - number: '7'
    text: >-
      In geval van een calamiteit kunnen, op verzoek van het bestuursorgaan, ook andere dan de in dit besluit
      vermelde kostensoorten voor een bijdrage in aanmerking komen, indien deze, naar het oordeel van Onze Minister,
      redelijkerwijs niet of slechts gedeeltelijk voor rekening van het bestuursorgaan kunnen blijven.
    url: https://wetten.overheid.nl/BWBR0010700/2002-01-01#Artikel7
  - number: '8'
    text: |-
      Van grote risico's voor de bevolking als bedoeld in [artikel 3, derde lid][ref1], is sprake indien:

      in geval van opsporing:

      a. het explosief zich vermoedelijk bevindt binnen de grens van de bebouwde kom van de gemeente gerekend naar
      de situatie op 1 januari 1994 dan wel de afstand van de vermoede inslagplaats van het explosief tot de grens
      van die bebouwde kom door de deskundigen kleiner wordt geacht dan de straal van de schervengevarenzone van het
      desbetreffende explosief en zich binnen de schervengevarenzone, gerekend naar de situatie per 1 januari 1994
      bebouwing bevindt dan wel een kwetsbare infrastructuur, en bovendien binnen een door deskundigen vastgestelde
      straal van de vermoede vindplaats van het explosief zodanige (grond) werkzaamheden worden verricht dat detonatie
      een reëel risico wordt geacht;

      b. zich in een gebied dat vrij toegankelijk is voor personen en waar reeds op 1 januari 1994 aantoonbaar sprake
      was van een intensief (recreatief) gebruik, op geringe diepte explosieven bevinden, terwijl het redelijkerwijs niet
      mogelijk is om beschermende maatregelen te treffen zoals het plaatsen van hekken en verbodsborden;

      c. er aantoonbaar sprake is van een ernstige verontreiniging van het grond- of oppervlaktewater als gevolg van
      de vermoede aanwezigheid van explosieven, terwijl het redelijkerwijs niet mogelijk is beschermende maatregelen te
      treffen zoals isolatie van het desbetreffende gebied;

      in geval van ruiming:

      d. het explosief aangetroffen is binnen de grens van de bebouwde kom van de gemeente dan wel de afstand tot de
      grens van die bebouwde kom kleiner is dan de straal van de schervengevarenzone van het desbetreffende explosief
      terwijl zich binnen de schervengevarenzone bebouwing bevindt;

      e. het explosief aangetroffen is in een gebied dat vrij toegankelijk is voor personen en waar aantoonbaar sprake
      is van een intensief (recreatief) gebruik, tenzij het redelijkerwijs mogelijk is om beschermende maatregelen te
      treffen zoals het plaatsen van hekken en verbodsborden;

      f. binnen de straal van de schervengevarenzone van het aangetroffen explosief sprake is van een kwetsbare
      infrastructuur.


      [ref1]: https://wetten.overheid.nl/BWBR0010700#Artikel3
    url: https://wetten.overheid.nl/BWBR0010700/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0010700
        artikel: '3'
        paragraaf: '2'
  - number: '9'
    text: |-
      Aan [artikel 3, vierde lid][ref1], wordt voldaan als het bestuursorgaan in voldoende mate kan aantonen dat:

      a. opsporingswerkzaamheden met behulp van dieptedetectie-apparatuur noodzakelijk zijn omdat binnen een vastgestelde
      straal van de vermoede vindplaats van het explosief, zodanige (grond) werkzaamheden worden verricht dat detonatie
      door deskundigen niet ondenkbaar wordt geacht;

      b. opsporingswerkzaamheden met behulp van oppervlaktedetectie-apparatuur noodzakelijk zijn omdat binnen een gebied
      waar de aanwezigheid van explosieven wordt vermoed eenvoudige verhardingen worden aangelegd of niet diepliggende
      leidingenstelsels en rioleringen.


      [ref1]: https://wetten.overheid.nl/BWBR0010700#Artikel3
    url: https://wetten.overheid.nl/BWBR0010700/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0010700
        artikel: '3'
        paragraaf: '2'
  - number: '10'
    text: |-
      Van [artikel 9][ref1] kan worden afgeweken indien in een gebied sprake is van een zodanig ernstige verontreiniging
      van het grond- of oppervlaktewater als gevolg van de vermoede aanwezigheid van explosieven dat er grote risico's
      voor de bevolking ontstaan, terwijl het niet mogelijk is afdoende beheersingsmaatregelen te treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0010700#Artikel9
    url: https://wetten.overheid.nl/BWBR0010700/2002-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0010700
        artikel: '9'
        paragraaf: '5'
  - number: '11'
    text: |-
      1 De ingevolge dit besluit voor een bijdrage in aanmerking komende kosten worden, onverminderd
      [paragraaf 2][ref1], vergoed tot ten hoogste 90%, voorzover de op grond van [paragraaf 3][ref2] in aanmerking
      komende kosten van een opsporing of ruiming uitgaan boven de ten laste van het bestuursorgaan blijvende
      drempelbijdrage.

      2 De in het eerste lid bedoelde drempelbijdrage wordt per opsporing of ruiming bepaald door het aantal inwoners
      per 1 januari van het jaar voorafgaand aan het jaar waarin de werkzaamheden in uitvoering zijn genomen te
      vermenigvuldigen met € 2,27 tot een maximum van € 45 378,02.

      3 Indien het grondgebied van het bestuursorgaan op 1 januari van het jaar waarin de werkzaamheden in uitvoering
      zijn genomen gewijzigd is, wordt het in het tweede lid bedoelde aantal inwoners gesteld op het aantal inwoners op 1
      januari van dat jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0010700#Paragraaf2
      [ref2]: https://wetten.overheid.nl/BWBR0010700#Paragraaf3
    url: https://wetten.overheid.nl/BWBR0010700/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0010700
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0010700
        paragraaf: '3'
  - number: '12'
    text: |-
      1 Indien het bestuursorgaan verkeert in omstandigheden als bedoeld in
      [artikel 12 van de Financiële-verhoudingswet][ref1] of door de toepassing van [artikel 11][ref2] zou komen
      te verkeren, kan Onze Minister, indien de (dreigende) [artikel 12][ref3] omstandigheden zich gedurende een
      aaneengesloten periode van 5 jaar voordoen, op verzoek van burgemeester en wethouders het aandeel van het
      bestuursorgaan in de voor een bijdrage in aanmerking komende kosten verlagen tot minimaal € 1,82 per inwoner per
      jaar over een aaneengesloten periode van 5 jaar.

      2 Bij de beoordeling van een verzoek als bedoeld in het eerste lid wordt mede rekening gehouden met de ten laste
      van de gemeente gebleven kosten van bodemsanering.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0010700#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0008290#Artikel12
    url: https://wetten.overheid.nl/BWBR0010700/2002-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0010700
        artikel: '11'
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0008290
        artikel: '12'
  - number: '13'
    text: |-
      1 Om in aanmerking te kunnen komen voor een bijdrage dient het bestuursorgaan de declaratie vóór 1 oktober van het
      jaar volgend op de beëindiging van de opsporings- of ruimingswerkzaamheden in bij Onze Minister.

      2 Bij opsporingswerkzaamheden met een doorlooptijd langer dan 12 maanden wordt per kalenderjaar een declaratie
      ingediend.

      3 Het bestuursorgaan dient bij de declaratie een kopie van de passage uit de gemeenterekening van het
      desbetreffende jaar en de toelichting daarop tezamen met het verslag en de verklaring van de accountant, bedoeld
      in [artikel 393, eerste lid van Boek 2 van het Burgerlijk Wetboek][ref1], die met het onderzoek van de rekening is
      belast, voor zover deze betrekking hebben op de inkomsten en uitgaven ter zake van de bijdragen te overleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0010700/2002-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '14'
    text: |-
      Een declaratie voor een opsporing heeft als inhoud:

      a. de reden van de opsporing;

      b. de uitkomsten van het vooronderzoek;

      c. de vermoede en de feitelijke aard van het explosief;

      d. de straal van de schervengevarenzone;

      e. een situatietekening en een plattegrond van de gemeente;

      f. het gebied waarbinnen bepaalde (grond) werkzaamheden tot detonatie hadden kunnen leiden;

      g. de vermoede en de feitelijke ligging van het explosief ten opzichte van de bebouwde kom en ten opzichte van de
      bebouwing of een kwetsbare infrastructuur in die bebouwde kom, uitgaande van de situatie op 1 januari 1994;

      h. de risico's die voorzien waren voor de bevolking waaronder eventuele milieu-aspecten;

      i. de mogelijkheden om al dan niet beschermende maatregelen te treffen;

      j. de werkzaamheden die verricht zijn als gevolg van de opsporing en de ruiming van de aangetroffen explosieven;

      k. de gehanteerde opsporingsmethode in relatie tot het (toekomstig) gebruik van de grond;

      l. de maatregelen die getroffen zijn ter voorkoming van schade;

      m. een gespecificeerde opgave van de kosten en eventuele stelposten;

      n. het tijdstip waarop de opsporingswerkzaamheden zijn beëindigd;

      o. een kopie van de betreffende passage uit de gemeenterekening van het desbetreffende jaar en de toelichting
      daarop tezamen met het verslag en de verklaring van de accountant, zoals bedoeld in [artikel 13, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010700#Artikel13
    url: https://wetten.overheid.nl/BWBR0010700/2002-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0010700
        artikel: '13'
        paragraaf: '7'
  - number: '15'
    text: |-
      Een declaratie voor een ruiming heeft als inhoud:

      a. de aard van het aangetroffen explosief;

      b. de straal van de schervengevarenzone;

      c. een situatietekening en een plattegrond van de gemeente;

      d. de risico's voor de bevolking;

      e. de werkzaamheden die verricht zijn als gevolg van de ruiming van de aangetroffen explosieven;

      f. de maatregelen die getroffen zijn ter voorkoming van schade;

      g. een gespecificeerde opgave van de kosten;

      h. het tijdstip waarop de ruimingswerkzaamheden zijn beëindigd;

      i. een kopie van de betreffende passage uit de gemeenterekening van het desbetreffende jaar en de toelichting
      daarop tezamen met het verslag en de verklaring van de accountant, zoals bedoeld in [artikel 13, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010700#Artikel13
    url: https://wetten.overheid.nl/BWBR0010700/2002-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0010700
        artikel: '13'
        paragraaf: '7'
  - number: '16'
    text: |-
      1 De verplichtingenruimte, bedoeld in [artikel 3, eerste lid][ref1], wordt door Onze Minister onderverdeeld naar
      opsporingen en ruimingen.

      2 Indien de verplichtingenruimte voor opsporingen niet toereikend is worden de bijdragen voor opsporingen toegekend
      naar rato van het beschikbare bedrag.

      3 Indien de verplichtingenruimte voor ruimingen niet toereikend is worden de bijdragen voor ruimingen in een
      volgend jaar toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0010700#Artikel3
    url: https://wetten.overheid.nl/BWBR0010700/2002-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0010700
        artikel: '3'
        paragraaf: '2'
  - number: '17'
    text: >-
      1 De bijdrage wordt niet eerder vastgesteld dan nadat de door het bestuursorgaan gemaakte kosten ten genoegen van
      Onze Minister zijn aangetoond.


      2 Alvorens tot vaststelling van de bijdrage wordt overgegaan kan Onze Minister een nader onderzoek instellen naar
      de noodzakelijkheid, de rechtmatigheid en de doelmatigheid van de gedeclareerde kosten.
    url: https://wetten.overheid.nl/BWBR0010700/2002-01-01#Artikel17
  - number: '18'
    text: |-
      De kasruimte voor de ruimingen wordt gelijk gesteld aan de op grond van [artikel 16, eerste lid][ref1],
      vastgestelde verplichtingenruimte voor de ruimingen. Onbesteed gebleven bedragen worden op 1 oktober van het
      begrotingsjaar toegevoegd aan de kasruimte voor de opsporingen.


      [ref1]: https://wetten.overheid.nl/BWBR0010700#Artikel16
    url: https://wetten.overheid.nl/BWBR0010700/2002-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0010700
        artikel: '16'
        paragraaf: '8'
  - number: '19'
    text: >-
      1 De bijdragen in de kosten van een opsporing worden betaalbaar gesteld in de volgorde van het tijdstip waarop de
      opsporingswerkzaamheden in uitvoering zijn genomen.


      2 De bijdragen in de kosten van een ruiming worden betaalbaar gesteld in de volgorde van het tijdstip waarop de
      declaratie door Onze Minister is ontvangen.
    url: https://wetten.overheid.nl/BWBR0010700/2002-01-01#Artikel19
  - number: '20'
    text: >-
      1 Op vertoon van bewijsstukken kan een voorlopige bijdrage betaalbaar worden gesteld.


      2 Aan de toekenning van een voorlopige bijdrage kunnen geen rechten worden ontleend.
    url: https://wetten.overheid.nl/BWBR0010700/2002-01-01#Artikel20
  - number: '21'
    text: |-
      Bij een overschrijding van de bij begrotingswet toegestane ruimte voor het doen van uitgaven, worden de bijdragen,
      met inachtneming van de [artikelen 16][ref1] en [19][ref2], op een nader door Onze Minister te bepalen tijdstip
      uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0010700#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0010700#Artikel19
    url: https://wetten.overheid.nl/BWBR0010700/2002-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0010700
        artikel: '16'
        paragraaf: '8'
      - id: ref2
