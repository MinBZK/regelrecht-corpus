        artikel: '19'
        paragraaf: '9'
  - number: '22'
    text: |-
      1 Dit besluit is van overeenkomstige toepassing op opsporingen en ruimingen waarvoor aan het bestuursorgaan een
      bijdrage is toegekend op grond van het [Bijdragebesluit kosten ruiming explosieven Tweede Wereldoorlog 1994][ref1]
      en waarvoor de bijdrage in de door het bestuursorgaan gemaakte kosten op 1 januari 1999 nog niet definitief is
      vastgesteld dan wel nog niet volledig tot uitbetaling is gekomen.

      2 In afwijking van het eerste lid, is het bestuursorgaan geen bijdrage verschuldigd in de kosten van
      opsporingswerkzaamheden die vóór 1 augustus 1998 uitsluitend door personeel van het ministerie van Defensie werden
      verricht, mits de opsporing vóór 1 januari 1999 in uitvoering is genomen. De verplichtingenruimte voor opsporingen
      als bedoeld in [artikel 16, eerste lid][ref2], wordt verminderd met de verplichtingen voor deze kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0006236
      [ref2]: https://wetten.overheid.nl/BWBR0010700#Artikel16
    url: https://wetten.overheid.nl/BWBR0010700/2002-01-01#Artikel22
    references:
