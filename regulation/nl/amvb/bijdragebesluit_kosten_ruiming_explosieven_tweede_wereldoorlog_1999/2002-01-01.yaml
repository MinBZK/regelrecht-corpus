        artikel: '16'
        paragraaf: '8'
  - number: '23'
    text: |-
      Bij de toepassing van [artikel 12][ref1] worden opsporingen en ruimingen dan wel, naar het oordeel van Onze
      Minister, op zich zelf staande onderdelen daarvan, die vóór 1 januari 1999 in uitvoering zijn genomen, mede bij de
      beoordeling betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0010700#Artikel12
    url: https://wetten.overheid.nl/BWBR0010700/2002-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0010700
        artikel: '12'
        paragraaf: '6'
  - number: '24'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het
      wordt geplaatst en werkt terug tot en met 1 januari 1999, met dien verstande dat [artikel 22, tweede lid][ref1],
      terugwerkt tot en met 1 augustus 1998. Dit besluit is onverlet [artikel 22, eerste lid][ref2], van toepassing op
      opsporingen en ruimingen die in 1999 in uitvoering zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0010700#Artikel22
