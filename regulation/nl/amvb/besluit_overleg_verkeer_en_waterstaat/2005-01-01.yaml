articles:
  - number: '2'
    text: |-
      Er zijn de volgende organen voor het geïnstitutionaliseerd overleg over onderdelen van het beleid inzake verkeer
      en waterstaat:

      a. het Permanent overlegorgaan waterbeheer en Noordzee-aangelegenheden, waarin overleg wordt gevoerd over
      het beleid ten aanzien van het kwantitatieve en het kwalitatieve waterbeheer, met inbegrip van het beheer van
      drooggevallen gronden, alsmede over het beleid ten aanzien van de Noordzee in al zijn aspecten;

      b. het Permanent overlegorgaan verkeersinfrastructuur, waarin overleg wordt gevoerd over het infrastructuurbeleid
      ten aanzien van land-, scheepvaart- en spoorwegen, luchtvaartterreinen en havens alsmede over het hiermee verband
      houdende beleid ten aanzien van de verkeersafwikkeling, met inbegrip van alle daaraan verbonden aspecten voor zover
      deze niet de veiligheid op de weg betreffen;

      c. het Permanent overlegorgaan personenvervoer, waarin overleg wordt gevoerd over het beleid ten aanzien van het
      bedrijfsmatig vervoer van personen;

      d. het Permanent overlegorgaan goederenvervoer, waarin overleg wordt gevoerd over het beleid ten aanzien van het
      vervoer van goederen met inbegrip van het vervoer van gevaarlijke stoffen;

      e. het Permanent overlegorgaan oppervlaktedelfstoffen, waarin overleg wordt gevoerd over het beleid ten aanzien van
      de voorziening in oppervlaktedelfstoffen;

      f. het Permanent overlegorgaan post en telecommunicatie, waarin overleg wordt gevoerd over het beleid ten aanzien
      van post- en telecommunicatie;

      g. het Permanent overlegorgaan verkeersveiligheid, waarin overleg wordt gevoerd over het beleid ten aanzien van de
      veiligheid op de weg.
    url: https://wetten.overheid.nl/BWBR0005652/2005-01-01#Artikel2
  - number: '8'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005652/2005-01-01#Artikel8
  - number: '9'
    text: 'Dit besluit wordt aangehaald als: Besluit overleg verkeer en waterstaat.'
    url: https://wetten.overheid.nl/BWBR0005652/2005-01-01#Artikel9
