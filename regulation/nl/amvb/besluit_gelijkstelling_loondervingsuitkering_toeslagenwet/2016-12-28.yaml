$id: besluit_gelijkstelling_loondervingsuitkering_toeslagenwet
regulatory_layer: AMVB
publication_date: '2016-12-27'
valid_from: '2016-12-28'
bwb_id: BWBR0004092
url: https://wetten.overheid.nl/BWBR0004092/2016-12-28
preamble:
  text: |-
    Wij Beatrix, bij de Gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 6 november 1986, Directoraat-
    Generaal Sociale Zekerheid, nr. SZ/SV/VV/SVV/86/09223;

    Gelet op artikel 6, tweede lid, van de Toeslagenwet (Stb. 1986, 562);

    De Raad van State gehoord (advies van 15 december 1986, nr. W12.86.0590);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 22 december 1986,
    Directoraat-Generaal Sociale Zekerheid, nr. SZ/SV/VV/SVV/86/10863;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004092/2016-12-28#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Dit besluit is uitsluitend van toepassing op de persoon wiens dagloon of grondslag, vermeerderd met het
      inkomen uit arbeid of overig inkomen anders dan de loondervingsuitkering op grond waarvan aanspraak op
      toeslag wordt gemaakt, minder bedraagt dan het voor hem van toepassing zijnde norminkomen, bedoeld in
      [artikel 2 van de Toeslagenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel2
    url: https://wetten.overheid.nl/BWBR0004092/2016-12-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '2'
  - number: '1.2'
    text: |-
      Het inkomen, bedoeld in het eerste lid, wordt vastgesteld zonder toepassing van
      [artikel 7 van de Toeslagenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel7
    url: https://wetten.overheid.nl/BWBR0004092/2016-12-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '7'
  - number: '1.3'
    text: |-
      [Artikel 8a, tweede lid, van de Toeslagenwet][ref1] is van overeenkomstige toepassing ten aanzien van het dagloon,
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel8a
    url: https://wetten.overheid.nl/BWBR0004092/2016-12-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: 8a
  - number: 1a
    text: |-
      Dit besluit berust mede op [artikel 8a, derde lid, van de Toeslagenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel8a
    url: https://wetten.overheid.nl/BWBR0004092/2016-12-28#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: 8a
  - number: '2'
    text: |-
      Voor de toepassing van [artikel 8a, eerste lid, van de Toeslagenwet][ref1] wordt met de loondervingsuitkering
      gelijkgesteld een aanvulling op de loondervingsuitkering op grond waarvan aanspraak op toeslag wordt gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel8a
    url: https://wetten.overheid.nl/BWBR0004092/2016-12-28#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: 8a
  - number: '3.1'
    text: |-
      Voor de toepassing van [artikel 8a, eerste lid, van de Toeslagenwet][ref1] wordt met de loondervingsuitkering
      gelijkgesteld al het inkomen uit arbeid of overig inkomen van de persoon die aanspraak maakt op toeslag, indien
      die persoon:


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel8a
    url: https://wetten.overheid.nl/BWBR0004092/2016-12-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: 8a
  - number: 3.1.a
    text: |-
      recht heeft op een uitkering op grond van de [Werkloosheidswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004092/2016-12-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 3.1.b
    text: |-
      recht heeft op een uitkering op grond van de [Ziektewet][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0004092/2016-12-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 3.1.c
    text: |-
      recht heeft op een uitkering in verband met arbeidsongeschiktheid gebaseerd op een mate van arbeidsongeschiktheid
      van minder dan 80%.
    url: https://wetten.overheid.nl/BWBR0004092/2016-12-28#Artikel3
  - number: '3.2'
    text: |-
      Indien de toepassing van het eerste lid er toe leidt dat de toeslag minder bedraagt dan het verschil tussen
      100/70 maal de loondervingsuitkering en de som van de loondervingsuitkering en een aanvulling daarop, wordt de
      gelijkstelling, bedoeld in het eerste lid zodanig beperkt, dat de toeslag gelijk is aan het verschil tussen 100/70
      maal de loondervingsuitkering en de som van de loondervingsuitkering en een aanvulling daarop.
    url: https://wetten.overheid.nl/BWBR0004092/2016-12-28#Artikel3
  - number: '4'
    text: |-
      Voor de toepassing van [artikel 8a, eerste lid, van de Toeslagenwet][ref1] wordt voor de persoon die loon of
      bezoldiging ontvangt op grond van [artikel 629, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref2] of
      [artikel 76a, eerste lid, van de Ziektewet][ref3], dat loon of die bezoldiging gelijkgesteld met de op het dagloon
      of de grondslag in mindering te brengen loondervingsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel76a
    url: https://wetten.overheid.nl/BWBR0004092/2016-12-28#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: 8a
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: 76a
  - number: 4a
    text: |-
      [Artikel 3][ref1], zoals dat luidde voor de inwerkingtreding van het besluit van 18 juni 2015, houdende
      wijziging van enige algemene maatregelen van bestuur in verband met de Wet werk en zekerheid, het invoeren van
      een ontheffing in verband met de zorg voor een pasgeboren kind bij overlijden van de moeder, een wijziging van
      het Remigratiebesluit in verband met de berekenwijze van de jaarlijkse indexatie van de remigratie-uitkeringen,
      het vrijlaten van de afkoopsom klein pensioen voor verschillende uitkeringen in het Algemeen inkomensbesluit
      socialezekerheidswetten alsmede enige technische wijzigingen in enkele besluiten (Stb. 242), blijft van toepassing
      als de loondervingsuitkering een uitkering op grond van de [Werkloosheidswet][ref2] betreft en het recht op die
      uitkering is ontstaan voor 1 juli 2015.


      [ref1]: https://wetten.overheid.nl/BWBR0004092#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004092/2016-12-28#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0004092
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0004045
  - number: '5'
    text: 'Dit besluit wordt aangehaald als: Besluit gelijkstelling loondervingsuitkering Toeslagenwet.'
    url: https://wetten.overheid.nl/BWBR0004092/2016-12-28#Artikel5
