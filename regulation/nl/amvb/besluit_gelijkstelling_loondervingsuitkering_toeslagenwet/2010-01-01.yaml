  - number: '4'
    text: |-
      1 Onder opbrengst van arbeid als bedoeld in [artikel 2, onderdeel ][ref1], worden, voor zover
      bedoelde arbeid in dienstbetrekking wordt verricht doch niet door een werknemer in de zin van de
      [Wet financiering sociale verzekeringen][ref2] verstaan de gelden en alle andere voordelen welke als beloning voor
      die arbeid worden genoten.

      2 Ten aanzien van de gelden en alle andere voordelen uit de dienstbetrekking, bedoeld in het eerste lid, is het
      bepaalde bij of krachtens [artikel 16 van de Wet financiering sociale verzekeringen][ref3] van overeenkomstige
      toepassing.

      3 In afwijking van het bepaalde in het tweede lid wordt niet als opbrengst van arbeid beschouwd:

      a. een uitkering, die naar aard en strekking overeenkomt met een loondervingsuitkering in de zin van de wet;

      b. vakantie-uitkering;

      c. een uitkering, die naar aard en strekking overeenkomt met een uitkering in de zin van
      [hoofdstuk 3, afdeling 2, van de Wet arbeid en zorg][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004092#Artikel2
