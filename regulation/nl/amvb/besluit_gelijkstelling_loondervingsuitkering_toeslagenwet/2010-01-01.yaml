  - number: 8a
    text: |-
      1 1. De bij de toepassing van de voorgaande artikelen noodzakelijke omrekening in euro van een niet in euro
      uitgedrukte uitkering uit of in verband met arbeid in de Nederlandse munteenheid geschiedt met behulp van de door
      de Europese Centrale Bank geadviseerde wisselkoersen.

      2 Een wijziging van de in het eerste lid bedoelde koers beïnvloedt het op grond van [artikel 8][ref1] vastgestelde
      inkomen niet, met dien verstande dat:

      1°. bij wijziging van het inkomen uit of in verband met arbeid van de toeslaggerechtigde en zijn echtgenoot, anders
      dan ten gevolge van koersmutaties, een omrekening plaatsvindt; en

      2°. ten minste eens per half jaar een omrekening plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0004092#Artikel8
