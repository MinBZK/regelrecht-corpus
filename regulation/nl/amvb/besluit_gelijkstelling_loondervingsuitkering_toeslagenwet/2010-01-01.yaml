  - number: 8b
    text: |-
      1 Voor de toepassing van [artikel 6, eerste lid][ref1], van de wet wordt de overhevelingstoeslag op grond van
      artikel 1 van de Wet overhevelingstoeslag opslagpremies (*Stb.* 1989, 128), alsmede het bedrag, waarmee ingevolge
      artikel 81, derde lid, van de Wet aanpassing uitkeringsregelingen overheveling opslagpremies (*Stb.* 1989, 127)
      een uitkering ingevolge de [Algemene Ouderdomswet][ref2] en een pensioenuitkering ingevolge de Algemene Weduwen- en
      Wezenwet is verhoogd, buiten beschouwing gelaten.

      2 Voor de toepassing van [artikel 6, eerste lid][ref3], van de wet wordt gedurende het jaar 1991 het bedrag
      waarmee ingevolge artikel 81, vierde lid, van de Wet aanpassing uitkeringsregelingen overheveling opslagpremies een
      uitkering ingevolge de [Algemene Ouderdomswet][ref4] is verhoogd, buiten beschouwing gelaten.


