articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. de wet: de [Toeslagenwet][ref1];

      b. een stamrecht: een recht op periodieke uitkeringen ter vervanging van gederfd of te derven loon.


      [ref1]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0004092/2010-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004043
  - number: '2'
    text: |-
      Voor de toepassing van [artikel 6, eerste lid][ref1], van de wet wordt onder inkomen uit arbeid in het bedrijfs- en
      beroepsleven verstaan:

      a. opbrengst van arbeid;

      b. winst uit bedrijf en zelfstandig uitgeoefend beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0004092#Artikel6
    url: https://wetten.overheid.nl/BWBR0004092/2010-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004092
        artikel: '6'
        paragraaf: '2'
  - number: '3'
    text: |-
      1 Onder opbrengst van arbeid als bedoeld in [artikel 2, onderdeel a][ref1], wordt, voorzover bedoelde arbeid door
      een werknemer in de zin van de [Wet financiering sociale verzekeringen][ref2] wordt verricht, verstaan het loon in
      de zin van die wet.

      2 In afwijking van het eerste lid wordt niet als opbrengst van arbeid beschouwd:

      a. een aanspraak om na verloop van tijd of onder een voorwaarde een of meer uitkeringen of verstrekkingen te
      ontvangen, voor zover deze niet wordt gedekt door stortingen van de werknemer;

      b. een loondervingsuitkering in de zin van de wet en een uitkering op grond van
      [hoofdstuk 3, afdeling 2, van de Wet arbeid en zorg][ref3] aan de werknemer of gelijkgestelde, bedoeld in
      [artikel 3:6, eerste lid, van die wet][ref4] of aan de zelfstandige of beroepsbeoefenaar op arbeidsovereenkomst,
      bedoeld in [artikel 3:17 van die wet][ref5], al dan niet vermeerderd met een toeslag op grond van de wet;

      c. een aanvulling op een loondervingsuitkering;

      d. vakantie-uitkering;

      e. loon als bedoeld in [artikel 629, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref6] dan wel de bezoldiging
      of hetgeen daarmee overeenkomt, bedoeld in [artikel XV, tweede lid, van de Wet terugdringing ziekteverzuim][ref7],
      van degene die aanspraak maakt op een toeslag.

      3 Indien op grond van [artikel 7, eerste lid][ref8], van de wet van inkomen uit arbeid een gedeelte is
      vrijgelaten, worden, in afwijking van het bepaalde in het tweede lid, onderdelen *b* en *c*, de op dat inkomen
      betrekking hebbende uitkeringen op grond van de verplichte verzekering van de [Ziektewet][ref9], op grond van
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref10] aan de werknemer of gelijkgestelde,
      bedoeld in [artikel 3:6, eerste lid, van die wet][ref11] en op grond van de verplichte verzekering van de
      [Werkloosheidswet][ref12], voor zolang de dienstbetrekking voortduurt, alsmede aanvullingen op die uitkeringen als
      opbrengst van arbeid beschouwd.


