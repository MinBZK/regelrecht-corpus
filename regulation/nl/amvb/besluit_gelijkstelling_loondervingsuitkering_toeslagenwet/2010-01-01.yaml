  - number: '7'
    text: |-
      1 Voor de toepassing van [artikel 6, eerste lid, van de wet][ref1] wordt onder inkomen in verband met arbeid in het
      bedrijfs- of beroepsleven verstaan:

      a. een loondervingsuitkering in de zin van [de wet][ref2] of een uitkering in de zin van
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref3] aan de werknemer of gelijkgestelde,
      bedoeld in [artikel 3:6, eerste lid, van die wet][ref4], alsmede een uitkering die naar aard en strekking daarmede
      overeenkomt, met uitzondering van de uitkeringen die op grond van [artikel 3, derde lid][ref5], als opbrengst van
      arbeid worden beschouwd;

      b. een uitkering op grond van een particuliere verzekering wegens derving van inkomen, welke ten behoeve van de
      werknemer in het kader van een individuele of collectieve arbeidsovereenkomst is afgesloten;

      c. een uitkering op grond van een pensioenregeling, voorzover niet begrepen onder a;

      d. een uitkering op grond van een buitenlandse wettelijke sociale verzekeringsregeling, voorzover niet
      begrepen onder a, met uitzondering van een uitkering, die naar aard en strekking overeenkomt met een
      uitkering op grond van de [Algemene Kinderbijslagwet][ref6] of met zorg waarop aanspraak bestaat ingevolge
      een zorgverzekering als bedoeld in [artikel 1, onderdeel d, van de Zorgverzekeringswet][ref7] of op grond van
      [artikel 6 van de Algemene Wet Bijzondere Ziektekosten][ref8];

      e. een uitkering op grond van een regeling voor vervroegde uittreding of een regeling, die naar aard en strekking
      daarmede overeenkomt;

      f. een uitkering op grond van een regeling voor functioneel leeftijdsontslag;

      g. loon dat uit vroegere dienstbetrekking wordt genoten, voorzover niet begrepen onder a, b, c, d, e of f;

      h. een toeslag op grond van [de wet][ref9];

      i. een uitkering ingevolge de [Algemene nabestaandenwet][ref10];

      j. een uitkering op grond van de [Algemene Ouderdomswet][ref11] (Stb. 1985, 181);

      k. een basisbeurs en een aanvullende beurs op grond van de [Wet studiefinanciering 2000][ref12], alsmede een beurs,
      die naar aard en strekking daarmee overeenkomt;

      l. een bedrijfsbeëindigingsvergoeding van de door Onze Minister van Economische Zaken opgerichte Stichting
      ontwikkeling en sanering midden- en kleinbedrijf;

      m. een maandelijkse bedrijfsbeëindigingsvergoeding van de door Onze Minister van Landbouw en Visserij opgerichte
      Stichting ontwikkelings- en saneringsfonds voor de landbouw; en

      n. loon als bedoeld in [artikel 629, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref13]
      dan wel de bezoldiging of hetgeen daarmee overeenkomt, bedoeld in
      [artikel XV, tweede lid, van de Wet terugdringing ziekteverzuim][ref14], van degene die aanspraak maakt op een
      toeslag.

      2 In afwijking van het eerste lid, wordt niet als inkomen in verband met arbeid beschouwd:

      a. een aanspraak om na verloop van tijd of onder een voorwaarde een of meer uitkeringen of verstrekkingen te
      ontvangen, voor zover deze niet worden gedekt door stortingen van degene die het desbetreffende inkomen geniet;

      b. een eenmalige uitkering welke na beëindiging van de dienstbetrekking aan een werknemer in verband met die
      beëindiging wordt betaald;

      c. 81% van het bedrag waarmee de arbeidsongeschiktheidsuitkering is verhoogd met toepassing van artikel 13 van
      de Algemene Arbeidsongeschiktheidswet, [artikel 22 van de Wet op de arbeidsongeschiktheidsverzekering][ref15]
      of [artikel 53][ref16] of [63 van de Werk en inkomen naar arbeidsvermogen][ref17] of een combinatie van deze
      artikelen;

      d.

      e. vakantie-uitkering, over de in dat lid genoemde inkomensbestanddelen;

      f. een vakantiebon, verstrekt naast een loondervingsuitkering, voor zover niet begrepen onder *e*;

      g. een uitkering die naar aard en strekking overeenkomt met een loondervingsuitkering, toegekend aan
      een directeur-grootaandeelhouder, wiens arbeidsverhouding niet als dienstbetrekking als bedoeld in
      [artikel 3a, eerste lid, van de Coördinatiewet Sociale Verzekering][ref18], wordt beschouwd;

      h. periodieke uitkeringen uit hoofde van een stamrecht, dat is verkregen uit een eenmalige uitkering welke na
      beëindiging van de dienstbetrekking aan de werknemer in verband met die beëindiging is toegekend, mits de werknemer
      aantoont dat de eenmalige uitkering door de werkgever betaalbaar is gesteld om naar eigen inzicht van de werknemer
      te besteden.

      3 Voor de toepassing van het eerste lid, onderdeel c, wordt onder pensioenregeling verstaan hetgeen daaronder wordt
      verstaan voor de toepassing van de [Wet op de loonbelasting 1964][ref19].

      4 Voor zover over een inkomen, genoemd in het eerste lid, geen aanspraak op vakantie-uitkering bestaat, wordt dit
      inkomen slechts voor een deel in aanmerking genomen. [Artikel 5, derde lid, laatste volzin][ref20], is voor het
      vaststellen van dit deel van overeenkomstige toepassing.

      5 Het vierde lid is niet van toepassing op uitkeringen op grond van de [Ziektewet][ref21] (Stb. 1987, 88) en
      op grond van [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref22] aan de werknemer of
      gelijkgestelde, bedoeld in [artikel 3:6, eerste lid, van die wet][ref23], tenzij de dienstbetrekking van de
      werknemer tijdens het genot van de uitkering eindigt en tengevolge hiervan het dagloon met een evenredig deel van
      de vakantietoeslag wordt verhoogd.


