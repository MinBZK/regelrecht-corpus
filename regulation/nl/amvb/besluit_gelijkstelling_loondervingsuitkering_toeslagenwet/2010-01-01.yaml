  - number: 8d
    text: |-
      1 De artikelen van deze paragraaf zijn uitsluitend van toepassing op de persoon wiens dagloon of grondslag,
      vermeerderd met het inkomen uit of in verband met arbeid in het bedrijfs- en beroepsleven anders dan de
      loondervingsuitkering op grond waarvan aanspraak op toeslag wordt gemaakt, minder bedraagt dan het voor hem van
      toepassing zijnde norminkomen, bedoeld in [artikel 2 van de wet][ref1].

      2 Het inkomen, bedoeld in het eerste lid, wordt vastgesteld zonder toepassing van [artikel 7 van de wet][ref2].

      3 [Artikel 8a, tweede lid, van de wet][ref3] is van overeenkomstige toepassing ten aanzien van het dagloon, bedoeld
      in het eerste lid.


