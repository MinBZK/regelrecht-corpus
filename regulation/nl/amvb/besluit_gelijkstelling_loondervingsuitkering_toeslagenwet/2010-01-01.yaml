    text: |-
      In afwijking van het bepaalde in [artikel 3, eerste lid][ref1], en [artikel 7, eerste lid][ref2], wordt de
      eenmalige uitkering op grond van artikel XV van de Wet premieheffing over uitkeringen (*Stb.* 1986, 639) niet als
      opbrengst van arbeid onderscheidenlijk als inkomen in verband met arbeid beschouwd.


