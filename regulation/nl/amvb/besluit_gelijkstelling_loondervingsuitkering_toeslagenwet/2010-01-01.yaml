  - number: '8'
    text: |-
      1 Het inkomen uit of in verband met arbeid wordt vastgesteld op het tot een bedrag per dag herleide inkomen,
      bedoeld in [de artikelen 3 tot en met 7][ref1], dat degene, die aanspraak maakt op een toeslag, en zijn echtgenoot
      verwerven in het betalingstijdvak, waarover de loondervingsuitkering wordt uitbetaald.

      2 Indien degene, die aanspraak maakt op een toeslag of zijn echtgenoot in het betalingstijdvak waarover
      de loondervingsuitkering wordt betaald, bestendig inkomen gaat verwerven, dan wel indien zij ophouden
      bestendig inkomen te verwerven, wordt het inkomen uit of in verband met arbeid gedurende het resterende
      gedeelte van dat betalingstijdvak vastgesteld op het tot een bedrag per dag herleide inkomen, bedoeld in
      [de artikelen 3 tot en met 7][ref2], dat zij gedurende dat gedeelte hebben verworven.

      3 Voor de herleiding van het inkomen uit of in verband met arbeid tot een bedrag per dag, bedoeld in het eerste en
      tweede lid, wordt voor inkomensbestanddelen die niet reeds op een bedrag per dag zijn vastgesteld, de week gesteld
      op 5 dagen en de maand op 21,75 dagen.

      4 Onder betalingstijdvak, bedoeld in het eerste en tweede lid, wordt verstaan, de periode die door het
      Uitvoeringsinstituut werknemersverzekeringen wordt gehanteerd bij de uitbetaling van de loondervingsuitkering.

      5 Indien aannemelijk is, dat een inkomensbestanddeel geen juiste maatstaf biedt voor de bepaling van het in het
      eerste lid bedoelde inkomen, dat met ingang van de dag, waarop aanspraak op toeslag wordt gemaakt, wordt verworven,
      wordt dat inkomensbestanddeel per dag vastgesteld op 1/65,25 onderscheidenlijk 1/261 van het bedrag, dat over 3
      maanden onderscheidenlijk een jaar als dat inkomensbestanddeel is verworven.

      6 Indien op een dag, dat aanspraak wordt gemaakt op de toeslag, winst als bedoeld in [artikel 6][ref3] wordt
      genoten, wordt het daaruit voortvloeiende inkomensbestanddeel per dag vastgesteld op 1/261 van de winst over het
      kalenderjaar of het niet met het kalenderjaar samenvallend boekjaar waarin die dag valt.

      7 Indien de toepassing van de leden 1 tot en met 6, gelet op het tijdstip van verwerving van een
      inkomensbestanddeel, tot een kennelijk onredelijk resultaat leidt, bepaalt het Uitvoeringsinstituut
      werknemersverzekeringen op welke periode dat inkomensbestanddeel geacht moet worden betrekking te hebben en hoe dit
      bestanddeel geacht moet worden over deze periode te zijn verdeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004092#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004092#Artikel3
