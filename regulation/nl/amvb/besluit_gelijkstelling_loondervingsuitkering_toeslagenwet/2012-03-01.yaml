  - number: '2'
    text: |-
      Voor de toepassing van [artikel 8a, eerste lid, van de Toeslagenwet][ref1] wordt met de loondervingsuitkering
      gelijkgesteld een aanvulling op de loondervingsuitkering op grond waarvan aanspraak op toeslag wordt gemaakt


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel8a
    url: https://wetten.overheid.nl/BWBR0004092/2012-03-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: 8a
  - number: '3'
    text: |-
      1 Voor de toepassing van [artikel 8a, eerste lid, van de Toeslagenwet][ref1] wordt met de loondervingsuitkering
      gelijkgesteld al het inkomen uit arbeid of overig inkomen van de persoon die aanspraak maakt op toeslag, indien
      die persoon:

      a. niet volledig werkloos is en zijn dagloon niet verlaagd is naar evenredigheid van de verloren arbeidsuren;

      b. recht heeft op een uitkering op grond van de [Ziektewet][ref2] met toepassing van [artikel 30][ref3] of
      [31 van die wet][ref4]; of

      c. recht heeft op een uitkering in verband met arbeidsongeschiktheid gebaseerd op een mate van
      arbeidsongeschiktheid van minder dan 80%.

      2 Indien de toepassing van het eerste lid er toe leidt dat de toeslag minder bedraagt dan het verschil tussen
      100/70 maal de loondervingsuitkering en de som van de loondervingsuitkering en een aanvulling daarop, wordt de
      gelijkstelling, bedoeld in het eerste lid zodanig beperkt, dat de toeslag gelijk is aan het verschil tussen 100/70
      maal de loondervingsuitkering en de som van de loondervingsuitkering en een aanvulling daarop.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel30
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel31
