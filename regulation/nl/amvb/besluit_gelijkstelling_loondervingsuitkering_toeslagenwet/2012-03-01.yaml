  - number: '4'
    text: |-
      Voor de toepassing van [artikel 8a, eerste lid, van de Toeslagenwet][ref1] wordt voor de persoon die loon of
      bezoldiging ontvangt op grond van [artikel 629, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref2] of
      [artikel 76a, eerste lid, van de Ziektewet][ref3], dat loon of die bezoldiging gelijkgesteld met de op het dagloon
      of de grondslag in mindering te brengen loondervingsuitkering


