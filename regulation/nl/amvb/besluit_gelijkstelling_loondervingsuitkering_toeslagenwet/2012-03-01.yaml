articles:
  - number: '1'
    text: |-
      1 Dit besluit is uitsluitend van toepassing op de persoon wiens dagloon of grondslag, vermeerderd met
      het inkomen uit arbeid of overig inkomen anders dan de loondervingsuitkering op grond waarvan aanspraak
      op toeslag wordt gemaakt, minder bedraagt dan het voor hem van toepassing zijnde norminkomen, bedoeld in
      [artikel 2 van de Toeslagenwet][ref1].

      2 Het inkomen, bedoeld in het eerste lid, wordt vastgesteld zonder toepassing van
      [artikel 7 van de Toeslagenwet][ref2].

      3 [Artikel 8a, tweede lid, van de Toeslagenwet][ref3] is van overeenkomstige toepassing ten aanzien van het
      dagloon, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004043#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0004043#Artikel8a
