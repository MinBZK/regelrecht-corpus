$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_gelijkstelling_loondervingsuitkering_toeslagenwet
regulatory_layer: AMVB
publication_date: '2016-12-27'
valid_from: '2008-04-01'
bwb_id: BWBR0004092
url: https://wetten.overheid.nl/BWBR0004092/2008-04-01
preamble:
  text: |-
    Wij Beatrix, bij de Gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 6 november 1986, Directoraat-
    Generaal Sociale Zekerheid, nr. SZ/SV/VV/SVV/86/09223;

    Gelet op artikel 6, tweede lid, van de Toeslagenwet (Stb. 1986, 562);

    De Raad van State gehoord (advies van 15 december 1986, nr. W12.86.0590);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 22 december 1986,
    Directoraat-Generaal Sociale Zekerheid, nr. SZ/SV/VV/SVV/86/10863;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel1
  - number: 1.a
    text: |-
      de wet: de [Toeslagenwet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004043
  - number: 1.b
    text: 'een stamrecht: een recht op periodieke uitkeringen ter vervanging van gederfd of te derven loon.'
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel1
  - number: '2'
    text: |-
      Voor de toepassing van [artikel 6, eerste lid][ref1], van de wet wordt onder inkomen uit arbeid in het bedrijfs- en
      beroepsleven verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0004092#Artikel6
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004092
        artikel: '6'
        paragraaf: '2'
  - number: 2.a
    text: opbrengst van arbeid;
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel2
  - number: 2.b
    text: winst uit bedrijf en zelfstandig uitgeoefend beroep.
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel2
  - number: '3.1'
    text: |-
      Onder opbrengst van arbeid als bedoeld in [artikel 2, onderdeel a][ref1], wordt, voorzover bedoelde arbeid door een
      werknemer in de zin van de [Wet financiering sociale verzekeringen][ref2] wordt verricht, verstaan het loon in de
      zin van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004092#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004092
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017745
  - number: '3.2'
    text: 'In afwijking van het eerste lid wordt niet als opbrengst van arbeid beschouwd:'
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel3
  - number: 3.2.a
    text: |-
      een aanspraak om na verloop van tijd of onder een voorwaarde een of meer uitkeringen of verstrekkingen te
      ontvangen, voor zover deze niet wordt gedekt door stortingen van de werknemer;
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel3
  - number: 3.2.b
    text: |-
      een loondervingsuitkering in de zin van de wet en een uitkering op grond van
      [hoofdstuk 3, afdeling 2, van de Wet arbeid en zorg][ref1] aan de werknemer of gelijkgestelde, bedoeld in
      [artikel 3:6, eerste lid, van die wet][ref2] of aan de zelfstandige of beroepsbeoefenaar op arbeidsovereenkomst,
      bedoeld in [artikel 3:17 van die wet][ref3], al dan niet vermeerderd met een toeslag op grond van de wet;


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013008
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
  - number: 3.2.c
    text: een aanvulling op een loondervingsuitkering;
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel3
  - number: 3.2.d
    text: vakantie-uitkering;
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel3
  - number: 3.2.e
    text: |-
      loon als bedoeld in [artikel 629, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1] dan wel de bezoldiging
      of hetgeen daarmee overeenkomt, bedoeld in [artikel XV, tweede lid, van de Wet terugdringing ziekteverzuim][ref2],
      van degene die aanspraak maakt op een toeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref2]: https://wetten.overheid.nl/BWBR0006355#ArtikelXV
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref2
        bwb_id: BWBR0006355
        artikel: XV
  - number: '3.3'
    text: |-
      Indien op grond van [artikel 7, eerste lid][ref1], van de wet van inkomen uit arbeid een gedeelte is
      vrijgelaten, worden, in afwijking van het bepaalde in het tweede lid, onderdelen *b* en *c*, de op dat inkomen
      betrekking hebbende uitkeringen op grond van de verplichte verzekering van de [Ziektewet][ref2], op grond van
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref3] aan de werknemer of gelijkgestelde,
      bedoeld in [artikel 3:6, eerste lid, van die wet][ref4] en op grond van de verplichte verzekering van de
      [Werkloosheidswet][ref5], voor zolang de dienstbetrekking voortduurt, alsmede aanvullingen op die uitkeringen als
      opbrengst van arbeid beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0004092#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Afdeling2
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004092
        artikel: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0013008
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0004045
  - number: '4.1'
    text: |-
      Onder opbrengst van arbeid als bedoeld in [artikel 2, onderdeel ][ref1], worden, voor zover
      bedoelde arbeid in dienstbetrekking wordt verricht doch niet door een werknemer in de zin van de
      [Wet financiering sociale verzekeringen][ref2] verstaan de gelden en alle andere voordelen welke als beloning voor
      die arbeid worden genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0004092#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004092
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017745
  - number: '4.2'
    text: |-
      Ten aanzien van de gelden en alle andere voordelen uit de dienstbetrekking, bedoeld in het eerste lid, is het
      bepaalde bij of krachtens [artikel 16 van de Wet financiering sociale verzekeringen][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel16
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '16'
  - number: '4.3'
    text: 'In afwijking van het bepaalde in het tweede lid wordt niet als opbrengst van arbeid beschouwd:'
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel4
  - number: 4.3.a
    text: een uitkering, die naar aard en strekking overeenkomt met een loondervingsuitkering in de zin van de wet;
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel4
  - number: 4.3.b
    text: vakantie-uitkering;
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel4
  - number: 4.3.c
    text: |-
      een uitkering, die naar aard en strekking overeenkomt met een uitkering in de zin van
      [hoofdstuk 3, afdeling 2, van de Wet arbeid en zorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Afdeling2
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013008
        afdeling: '2'
  - number: '5.1'
    text: |-
      Onder opbrengst van arbeid als bedoeld in [artikel 2, onderdeel a][ref1], wordt, voorzover bedoelde arbeid niet in
      dienstbetrekking wordt verricht, verstaan het belastbaar loon uit tegenwoordige arbeid of belastbaar resultaat uit
      overige werkzaamheden, bedoeld in [hoofdstuk 3][ref2] en [7 van de Wet inkomstenbelasting 2001][ref3], behoudens
      voorzover het een werkzaamheid betreft als bedoeld in de [artikelen 3.91, eerste lid, onderdelen a en b][ref4],
      en [3.92 van die wet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0004092#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk7
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004092
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011353
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0011353
        hoofdstuk: '7'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '5.2'
    text: |-
      Het bepaalde bij of krachtens [artikel 13 van de Wet op de loonbelasting 1964][ref1] is met betrekking tot het
      bepaalde in het eerste lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel13
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '13'
  - number: '5.3'
    text: |-
      Voor zover over de opbrengst van arbeid, zoals vastgesteld op grond van het eerste en tweede lid, geen
      aanspraak op vakantie-uitkering bestaat, wordt van dit inkomen slechts een deel in aanmerking genomen. Dit
      deel is gelijk aan het quotiënt van 100 en de som van 100 en het percentage van de vakantiebijslag, bedoeld in
      [artikel 15, eerste lid, van de Wet Minimumloon en minimumvakantiebijslag][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '15'
  - number: 5a
    text: |-
      Onder opbrengst van arbeid wordt tevens verstaan een financiële tegemoetkoming op grond van
      [hoofdstuk 7 van de Wet arbeid en zorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '7'
  - number: '6.1'
    text: |-
      Onder winst als bedoeld in [artikel 2, onderdeel b][ref1], wordt verstaan de belastbare winst uit onderneming,
      bedoeld in paragraaf 3.2.1. van de [Wet inkomstenbelasting 2001][ref2], vermeerderd met de ondernemersaftrek,
      bedoeld in paragraaf 3.2.4 van die wet, met dien verstande dat de bestanddelen van de winst, bedoeld in
      [artikel 3.78, derde lid, onderdelen a, b en c, van die wet][ref3], niet geacht worden te behoren tot die winst.


      [ref1]: https://wetten.overheid.nl/BWBR0004092#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011353
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004092
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011353
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '6.2'
    text: |-
      [Artikel 5, eerste lid][ref1], laatste volzin, is voor het inkomen, bedoeld in dit artikel, van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004092#Artikel5
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004092
        artikel: '5'
        paragraaf: '2'
  - number: '6.3'
    text: |-
      Indien de berekening van de in het eerste lid bedoelde winst leidt tot een negatief bedrag, wordt die winst op
      nihil gesteld.
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel6
  - number: '6.4'
    text: |-
      Van de winst uit bedrijf en zelfstandig uitgeoefend beroep, zoals vastgesteld op grond van het eerste en tweede
      lid, wordt slechts een deel in aanmerking genomen. Artikel 5, derde lid, laatste volzin, is voor het vaststellen
      van dit deel van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel6
  - number: '7.1'
    text: |-
      Voor de toepassing van [artikel 6, eerste lid, van de wet][ref1] wordt onder inkomen in verband met arbeid in het
      bedrijfs- of beroepsleven verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel6
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '6'
  - number: 7.1.a
    text: |-
      een loondervingsuitkering in de zin van [de wet][ref1] of een uitkering in de zin van
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref2] aan de werknemer of gelijkgestelde,
      bedoeld in [artikel 3:6, eerste lid, van die wet][ref3], alsmede een uitkering die naar aard en strekking daarmede
      overeenkomt, met uitzondering van de uitkeringen die op grond van [artikel 3, derde lid][ref4], als opbrengst van
      arbeid worden beschouwd;


      [ref1]: https://wetten.overheid.nl/BWBR0004043
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0004092#Artikel3
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004043
      - id: ref2
        bwb_id: BWBR0013008
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0004092
        artikel: '3'
        paragraaf: '2'
  - number: 7.1.b
    text: |-
      een uitkering op grond van een particuliere verzekering wegens derving van inkomen, welke ten behoeve van de
      werknemer in het kader van een individuele of collectieve arbeidsovereenkomst is afgesloten;
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel7
  - number: 7.1.c
    text: een uitkering op grond van een pensioenregeling, voorzover niet begrepen onder a;
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel7
  - number: 7.1.d
    text: |-
      een uitkering op grond van een buitenlandse wettelijke sociale verzekeringsregeling, voorzover niet begrepen
      onder a, met uitzondering van een uitkering, die naar aard en strekking overeenkomt met een uitkering
      op grond van de [Algemene Kinderbijslagwet][ref1] of met zorg waarop aanspraak bestaat ingevolge een
      zorgverzekering als bedoeld in [artikel 1, onderdeel d, van de Zorgverzekeringswet][ref2] of op grond van
      [artikel 6 van de Algemene Wet Bijzondere Ziektekosten][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002368
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002368
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0002614
        artikel: '6'
  - number: 7.1.e
    text: |-
      een uitkering op grond van een regeling voor vervroegde uittreding of een regeling, die naar aard en strekking
      daarmede overeenkomt;
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel7
  - number: 7.1.f
    text: een uitkering op grond van een regeling voor functioneel leeftijdsontslag;
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel7
  - number: 7.1.g
    text: loon dat uit vroegere dienstbetrekking wordt genoten, voorzover niet begrepen onder a, b, c, d, e of f;
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel7
  - number: 7.1.h
    text: |-
      een toeslag op grond van [de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004043
  - number: 7.1.i
    text: |-
      een uitkering ingevolge de [Algemene nabestaandenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 7.1.j
    text: |-
      een uitkering op grond van de [Algemene Ouderdomswet][ref1] (Stb. 1985, 181);


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 7.1.k
    text: |-
      een pensioen op grond van de [Wet buitengewoon pensioen 1940-1945][ref1] (Stb. 1977, 493);


      [ref1]: https://wetten.overheid.nl/BWBR0002032
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002032
  - number: 7.1.l
    text: |-
      een uitkering op grond van de [Wet uitkeringen vervolgingsslachtoffers 1940-1945][ref1] (Stb. 1986, 386);


      [ref1]: https://wetten.overheid.nl/BWBR0002844
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002844
  - number: 7.1.m
    text: |-
      een pensioen op grond van de [Wet buitengewoon pensioen zeelieden-oorlogsslachtoffers][ref1] (Stb. 1977, 495);


      [ref1]: https://wetten.overheid.nl/BWBR0002035
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002035
  - number: 7.1.n
    text: |-
      een uitkering op grond van de [Wet uitkeringen burger-oorlogsslachtoffers 1940-1945][ref1] (Stb. 1984, 94);


      [ref1]: https://wetten.overheid.nl/BWBR0003664
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003664
  - number: 7.1.o
    text: |-
      een pensioen op grond van de [Wet buitengewoon pensioen Indisch Verzet][ref1] (Stb. 1986, 360);


      [ref1]: https://wetten.overheid.nl/BWBR0003968
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003968
  - number: 7.1.p
    text: |-
      een basisbeurs en een aanvullende beurs op grond van de [Wet studiefinanciering 2000][ref1], alsmede een beurs, die
      naar aard en strekking daarmee overeenkomt;


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: 7.1.q
    text: |-
      een bedrijfsbeëindigingsvergoeding van de door Onze Minister van Economische Zaken opgerichte Stichting
      ontwikkeling en sanering midden- en kleinbedrijf;
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel7
  - number: 7.1.r
    text: |-
      een maandelijkse bedrijfsbeëindigingsvergoeding van de door Onze Minister van Landbouw en Visserij opgerichte
      Stichting ontwikkelings- en saneringsfonds voor de landbouw; en
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel7
  - number: 7.1.s
    text: |-
      loon als bedoeld in [artikel 629, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1] dan wel de bezoldiging
      of hetgeen daarmee overeenkomt, bedoeld in [artikel XV, tweede lid, van de Wet terugdringing ziekteverzuim][ref2],
      van degene die aanspraak maakt op een toeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref2]: https://wetten.overheid.nl/BWBR0006355#ArtikelXV
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref2
        bwb_id: BWBR0006355
        artikel: XV
  - number: '7.2'
    text: 'In afwijking van het eerste lid, wordt niet als inkomen in verband met arbeid beschouwd:'
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel7
  - number: 7.2.a
    text: |-
      een aanspraak om na verloop van tijd of onder een voorwaarde een of meer uitkeringen of verstrekkingen te
      ontvangen, voor zover deze niet worden gedekt door stortingen van degene die het desbetreffende inkomen geniet;
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel7
  - number: 7.2.b
    text: |-
      een eenmalige uitkering welke na beëindiging van de dienstbetrekking aan een werknemer in verband met die
      beëindiging wordt betaald;
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel7
  - number: 7.2.c
    text: |-
      81% van het bedrag waarmee de arbeidsongeschiktheidsuitkering is verhoogd met toepassing van artikel 13 van de
      Algemene Arbeidsongeschiktheidswet, [artikel 22 van de Wet op de arbeidsongeschiktheidsverzekering][ref1] of
      [artikel 53][ref2] of [63 van de Werk en inkomen naar arbeidsvermogen][ref3] of een combinatie van deze artikelen;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel63
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '53'
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '63'
  - number: 7.2.e
    text: vakantie-uitkering, over de in dat lid genoemde inkomensbestanddelen;
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel7
  - number: 7.2.f
    text: een vakantiebon, verstrekt naast een loondervingsuitkering, voor zover niet begrepen onder e;
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel7
  - number: 7.2.g
    text: |-
      een uitkering die naar aard en strekking overeenkomt met een loondervingsuitkering, toegekend aan
      een directeur-grootaandeelhouder, wiens arbeidsverhouding niet als dienstbetrekking als bedoeld in
      [artikel 3a, eerste lid, van de Coördinatiewet Sociale Verzekering][ref1], wordt beschouwd;


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel3a
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002126
        artikel: 3a
  - number: 7.2.h
    text: afkoopsommen als bedoeld in de artikelen 32c, 32d en 32p van de Liquidatiewet invaliditeitswetten (Stb. 1967, 307);
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel7
  - number: 7.2.i
    text: een uitkering op grond van artikel 15 van de Algemene Weduwen- en Wezenwet;
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel7
  - number: 7.2.j
    text: een vergoeding ingevolge het Reglement eenmalige silicosevergoeding oud-mijnwerkers;
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel7
  - number: 7.2.k
    text: |-
      periodieke uitkeringen uit hoofde van een stamrecht, dat is verkregen uit een eenmalige uitkering welke na
      beëindiging van de dienstbetrekking aan de werknemer in verband met die beëindiging is toegekend, mits de werknemer
      aantoont dat de eenmalige uitkering door de werkgever betaalbaar is gesteld om naar eigen inzicht van de werknemer
      te besteden.
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel7
  - number: '7.3'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel c, wordt onder pensioenregeling verstaan hetgeen daaronder wordt
      verstaan voor de toepassing van de [Wet op de loonbelasting 1964][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: '7.4'
    text: |-
      Voor zover over een inkomen, genoemd in het eerste lid, geen aanspraak op vakantie-uitkering bestaat, wordt dit
      inkomen slechts voor een deel in aanmerking genomen. [Artikel 5, derde lid, laatste volzin][ref1], is voor het
      vaststellen van dit deel van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004092#Artikel5
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004092
        artikel: '5'
        paragraaf: '2'
  - number: '7.5'
    text: |-
      Het vierde lid is niet van toepassing op uitkeringen op grond van de [Ziektewet][ref1] (Stb. 1987, 88) en op grond
      van [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref2] aan de werknemer of gelijkgestelde,
      bedoeld in [artikel 3:6, eerste lid, van die wet][ref3], tenzij de dienstbetrekking van de werknemer tijdens het
      genot van de uitkering eindigt en tengevolge hiervan het dagloon met een evenredig deel van de vakantietoeslag
      wordt verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0013008
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '8.1'
    text: |-
      Het inkomen uit of in verband met arbeid wordt vastgesteld op het tot een bedrag per dag herleide inkomen,
      bedoeld in [de artikelen 3 tot en met 7][ref1], dat degene, die aanspraak maakt op een toeslag, en zijn echtgenoot
      verwerven in het betalingstijdvak, waarover de loondervingsuitkering wordt uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004092#Artikel3
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004092
        artikel: '3'
        paragraaf: '2'
  - number: '8.2'
    text: |-
      Indien degene, die aanspraak maakt op een toeslag of zijn echtgenoot in het betalingstijdvak waarover
      de loondervingsuitkering wordt betaald, bestendig inkomen gaat verwerven, dan wel indien zij ophouden
      bestendig inkomen te verwerven, wordt het inkomen uit of in verband met arbeid gedurende het resterende
      gedeelte van dat betalingstijdvak vastgesteld op het tot een bedrag per dag herleide inkomen, bedoeld in
      [de artikelen 3 tot en met 7][ref1], dat zij gedurende dat gedeelte hebben verworven.


      [ref1]: https://wetten.overheid.nl/BWBR0004092#Artikel3
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004092
        artikel: '3'
        paragraaf: '2'
  - number: '8.3'
    text: |-
      Voor de herleiding van het inkomen uit of in verband met arbeid tot een bedrag per dag, bedoeld in het eerste en
      tweede lid, wordt voor inkomensbestanddelen die niet reeds op een bedrag per dag zijn vastgesteld, de week gesteld
      op 5 dagen en de maand op 21,75 dagen.
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel8
  - number: '8.4'
    text: |-
      Onder betalingstijdvak, bedoeld in het eerste en tweede lid, wordt verstaan, de periode die door het
      Uitvoeringsinstituut werknemersverzekeringen wordt gehanteerd bij de uitbetaling van de loondervingsuitkering.
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel8
  - number: '8.5'
    text: |-
      Indien aannemelijk is, dat een inkomensbestanddeel geen juiste maatstaf biedt voor de bepaling van het in het
      eerste lid bedoelde inkomen, dat met ingang van de dag, waarop aanspraak op toeslag wordt gemaakt, wordt verworven,
      wordt dat inkomensbestanddeel per dag vastgesteld op 1/65,25 onderscheidenlijk 1/261 van het bedrag, dat over 3
      maanden onderscheidenlijk een jaar als dat inkomensbestanddeel is verworven.
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel8
  - number: '8.6'
    text: |-
      Indien op een dag, dat aanspraak wordt gemaakt op de toeslag, winst als bedoeld in [artikel 6][ref1] wordt
      genoten, wordt het daaruit voortvloeiende inkomensbestanddeel per dag vastgesteld op 1/261 van de winst over het
      kalenderjaar of het niet met het kalenderjaar samenvallend boekjaar waarin die dag valt.


      [ref1]: https://wetten.overheid.nl/BWBR0004092#Artikel6
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004092
        artikel: '6'
        paragraaf: '2'
  - number: '8.7'
    text: |-
      Indien de toepassing van de leden 1 tot en met 6, gelet op het tijdstip van verwerving van een inkomensbestanddeel,
      tot een kennelijk onredelijk resultaat leidt, bepaalt het Uitvoeringsinstituut werknemersverzekeringen op welke
      periode dat inkomensbestanddeel geacht moet worden betrekking te hebben en hoe dit bestanddeel geacht moet worden
      over deze periode te zijn verdeeld.
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel8
  - number: 8a.1
    text: |-
      1. De bij de toepassing van de voorgaande artikelen noodzakelijke omrekening in euro van een niet in euro
      uitgedrukte uitkering uit of in verband met arbeid in de Nederlandse munteenheid geschiedt met behulp van de door
      de Europese Centrale Bank geadviseerde wisselkoersen.
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel8a
  - number: 8a.2
    text: |-
      Een wijziging van de in het eerste lid bedoelde koers beïnvloedt het op grond van [artikel 8][ref1] vastgestelde
      inkomen niet, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0004092#Artikel8
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0004092
        artikel: '8'
        paragraaf: '3'
  - number: 8a.2.1°
    text: |-
      bij wijziging van het inkomen uit of in verband met arbeid van de toeslaggerechtigde en zijn echtgenoot, anders dan
      ten gevolge van koersmutaties, een omrekening plaatsvindt; en
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel8a
  - number: 8a.2.2°
    text: ten minste eens per half jaar een omrekening plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel8a
  - number: 8b.1
    text: |-
      Voor de toepassing van [artikel 6, eerste lid][ref1], van de wet wordt de overhevelingstoeslag op grond van
      artikel 1 van de Wet overhevelingstoeslag opslagpremies (*Stb.* 1989, 128), alsmede het bedrag, waarmee ingevolge
      artikel 81, derde lid, van de Wet aanpassing uitkeringsregelingen overheveling opslagpremies (*Stb.* 1989, 127)
      een uitkering ingevolge de [Algemene Ouderdomswet][ref2] en een pensioenuitkering ingevolge de Algemene Weduwen- en
      Wezenwet is verhoogd, buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0004092#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0004092
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002221
  - number: 8b.2
    text: |-
      Voor de toepassing van [artikel 6, eerste lid][ref1], van de wet wordt gedurende het jaar 1991 het bedrag waarmee
      ingevolge artikel 81, vierde lid, van de Wet aanpassing uitkeringsregelingen overheveling opslagpremies een
      uitkering ingevolge de [Algemene Ouderdomswet][ref2] is verhoogd, buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0004092#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0004092
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002221
  - number: 8c
    text: |-
      Voor de toepassing van [artikel 5, eerste lid, tweede volzin][ref1], en [artikel 6, tweede lid][ref2], van dit
      besluit wordt op het inkomen een bedrag in mindering gebracht, gelijk aan de overhevelingstoeslag, berekend
      overeenkomstig de bij en krachtens [artikel 2 van de Wet brutering overhevelingstoeslag lonen][ref3] gestelde
      regels.


      [ref1]: https://wetten.overheid.nl/BWBR0004092#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004092#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0006353#Artikel2
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel8c
    references:
      - id: ref1
        bwb_id: BWBR0004092
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004092
        artikel: '6'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006353
        artikel: '2'
  - number: 8d.1
    text: |-
      De artikelen van deze paragraaf zijn uitsluitend van toepassing op de persoon wiens dagloon of grondslag,
      vermeerderd met het inkomen uit of in verband met arbeid in het bedrijfs- en beroepsleven anders dan de
      loondervingsuitkering op grond waarvan aanspraak op toeslag wordt gemaakt, minder bedraagt dan het voor hem van
      toepassing zijnde norminkomen, bedoeld in [artikel 2 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel2
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel8d
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '2'
  - number: 8d.2
    text: |-
      Het inkomen, bedoeld in het eerste lid, wordt vastgesteld zonder toepassing van [artikel 7 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel7
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel8d
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '7'
  - number: 8d.3
    text: |-
      [Artikel 8a, tweede lid, van de wet][ref1] is van overeenkomstige toepassing ten aanzien van het dagloon, bedoeld
      in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel8a
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel8d
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: 8a
  - number: 8e
    text: |-
      Voor de toepassing van [artikel 8a, eerste lid, van de wet][ref1] wordt met de loondervingsuitkering gelijkgesteld
      een aanvulling op de loondervingsuitkering op grond waarvan aanspraak op toeslag wordt gemaakt


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel8a
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel8e
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: 8a
  - number: 8f.1
    text: |-
      Voor de toepassing van [artikel 8a, eerste lid, van de wet][ref1] wordt met de loondervingsuitkering gelijkgesteld
      al het inkomen uit of in verband met arbeid in het bedrijfs- en beroepsleven van de persoon die aanspraak maakt op
      toeslag, indien die persoon:


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel8a
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel8f
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: 8a
  - number: 8f.1.a
    text: niet volledig werkloos is en zijn dagloon niet verlaagd is naar evenredigheid van de verloren arbeidsuren;
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel8f
  - number: 8f.1.b
    text: |-
      recht heeft op een uitkering op grond van de [Ziektewet][ref1] met toepassing van [artikel 30][ref2] of
      [31 van die wet][ref3]; of


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel31
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel8f
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '30'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: '31'
  - number: 8f.1.c
    text: |-
      recht heeft op een uitkering in verband met arbeidsongeschiktheid gebaseerd op een mate van arbeidsongeschiktheid
      van minder dan 80%.
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel8f
  - number: 8f.2
    text: |-
      Indien de toepassing van het eerste lid er toe leidt dat de toeslag minder bedraagt dan het verschil tussen
      100/70 maal de loondervingsuitkering en de som van de loondervingsuitkering en een aanvulling daarop, wordt de
      gelijkstelling, bedoeld in het eerste lid zodanig beperkt, dat de toeslag gelijk is aan het verschil tussen 100/70
      maal de loondervingsuitkering en de som van de loondervingsuitkering en een aanvulling daarop.
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel8f
  - number: 8g
    text: |-
      Voor de toepassing van [artikel 8a, eerste lid, van de wet][ref1] wordt voor de persoon die loon of
      bezoldiging ontvangt op grond van [artikel 629, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref2] of
      [artikel 76a, eerste lid, van de Ziektewet][ref3], dat loon of die bezoldiging gelijkgesteld met de op het dagloon
      of de grondslag in mindering te brengen loondervingsuitkering


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel76a
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel8g
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: 8a
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: 76a
  - number: '9'
    text: |-
      In afwijking van het bepaalde in [artikel 3, eerste lid][ref1], en [artikel 7, eerste lid][ref2], wordt de
      eenmalige uitkering op grond van artikel XV van de Wet premieheffing over uitkeringen (*Stb.* 1986, 639) niet als
      opbrengst van arbeid onderscheidenlijk als inkomen in verband met arbeid beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0004092#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004092#Artikel7
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004092
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004092
        artikel: '7'
        paragraaf: '2'
  - number: 9a
    text: |-
      Dit besluit berust mede op [artikel 8a, derde lid, van de Toeslagenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel8a
    url: https://wetten.overheid.nl/BWBR0004092/2008-04-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: 8a
  - number: '10'
    text: Dit besluit treedt in werking met ingang van 1 januari 1987.
