        artikel: 2:3.0b
  - number: 3.0c
    text: |-
      1 De gegevens, bedoeld in de [artikelen 2:3.0d, derde lid][ref1], [2:3.0i, derde lid][ref2], en
      [2:3.0m, derde lid, van de wet][ref3] zijn:

      a. een opgave van de naam, het adres en het telefoon- en faxnummer en het emailadres van de afwikkelonderneming;

      b. een opgave van de rechtsvorm van de afwikkelonderneming;

      c. een opgave van de statutaire zetel, de statutaire naam en de handelsnaam of handelsnamen;

      d. een opgave van het nummer van inschrijving in het handelsregister;

      e. een gewaarmerkt afschrift van de statuten;

      f. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of wordt voldaan aan hetgeen ingevolge
      [artikel 3:8 van de wet][ref4] is bepaald met betrekking tot de geschiktheid van de in dat artikel bedoelde
      personen;

      g. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of wordt voldaan aan hetgeen ingevolge
      [artikel 3:9 van de wet][ref5] is bepaald met betrekking tot de betrouwbaarheid van de in dat artikel bedoelde
      personen;

      h. een beschrijving van het voorgenomen beleid met betrekking tot de integere bedrijfsuitoefening, bedoeld in
      [artikel 3:10, eerste lid, van de wet][ref6];

      i. een beschrijving van de zeggenschapsstructuur aan de hand waarvan de Nederlandsche Bank kan beoordelen of
      voldaan wordt aan [artikel 3:16, eerste en tweede lid, van de wet][ref7];

      j. een beschrijving van de inrichting van de bedrijfsvoering met betrekking tot de beheerste en integere
      bedrijfsuitoefening, bedoeld in [artikel 3:17, eerste en tweede lid, van de wet][ref8];

      k. een beschrijving van de criteria, bedoeld in [artikel 4:76a, eerste lid, van de wet][ref9], op basis waarvan de
      afwikkelonderneming eerlijke en vrije toegang biedt tot haar diensten en systemen;

      l. een beschrijving van de mechanismen waarmee periodiek het kostenniveau, prijsniveau en serviceniveau en de
      efficiëntie, bedoeld in [artikel 4:76b, tweede lid, van de wet][ref10] wordt beoordeeld;

      m. een beschrijving van de communcatieprocedures en standaarden als bedoeld in
      [artikel 4:76c, eerste lid, van de wet][ref11] waarvan de afwikkelonderneming voornemens is gebruik te maken; en

      n. een beschrijving van de wijze waarop de afwikkelonderneming inzicht als bedoeld in
      [artikel 4:76d, eerste lid, van de wet][ref12] in de financiële risico’s en de kosten die zijn verbonden aan de
      afwikkeldiensten biedt aan betaaldienstverleners.

      2 De gegevens, bedoeld in het eerste lid, onderdeel f, zijn:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer, het emailadres en de functie;

      b. een curriculum vitae;

      c. een opgave van de relevante diploma’s;

      d. een kopie van een geldig identiteitsbewijs; en

      e. een opgave van referenten.

      3 De gegevens, bedoeld in het eerste lid, onderdeel g, zijn:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer, het emailadres en de functie;

      b. een kopie van een geldig identiteitsbewijs;

      c. gegevens met betrekking tot de antecedenten, bedoeld in de bijlage bij dit besluit; en

      d. een opgave van referenten.

      4 Het eerste lid, onderdeel g, is niet van toepassing ten aanzien van personen wier betrouwbaarheid voor de
      toepassing van de wet door een toezichthouder reeds is vastgesteld.


