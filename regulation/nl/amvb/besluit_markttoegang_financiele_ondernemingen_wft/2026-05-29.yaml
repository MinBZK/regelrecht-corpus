  - number: '13'
    text: |-
      Het programma van werkzaamheden, bedoeld in [artikel 12, eerste lid, onderdeel f][ref1], dat wordt overgelegd door
      degene die een vergunning aanvraagt voor het uitoefenen van het bedrijf van levensverzekeraar, bevat het volgende:

      a. een opgave van de aard van de overeenkomsten die de levensverzekeraar voornemens is te sluiten;

      b. een uiteenzetting omtrent de leidende beginselen op het gebied van de herverzekering en retrocessie;

      c. de kernvermogensbestanddelen die de absolute ondergrens van het minimumkapitaalvereiste vormen;

      d. een raming van de kosten voor de inrichting van de administratie en van het productienet en bewijsstukken
      waaruit blijkt dat de verzekeraar beschikt over de financiële middelen tot dekking daarvan;

      e. voor de eerste drie boekjaren een raming van de te verwachten balanspositie;

      f. voor de eerste drie boekjaren een raming van het toekomstige solvabiliteitskapitaalvereiste, op basis van de in
      onderdeel e bedoelde te verwachten balanspositie, evenals de voor deze ramingen gehanteerde berekeningsmethode;

      g. voor de eerste drie boekjaren een raming van het toekomstige minimumkapitaalvereiste, op basis van de in
      onderdeel e bedoelde te verwachten balanspositie, evenals de voor deze ramingen gehanteerde berekeningsmethode;

      h. voor de eerste drie boekjaren een raming van de financiële middelen tot dekking van de verplichtingen en tot
      dekking van het minimumkapitaalvereiste en het solvabiliteitskapitaalvereiste; en

      i. voor de eerste drie boekjaren een raming van de vermoedelijke ontvangsten en uitgaven, zowel wat de directe
      verzekering en de geaccepteerde herverzekeringen als de cessies uit hoofde van herverzekering betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0020413#Artikel12
