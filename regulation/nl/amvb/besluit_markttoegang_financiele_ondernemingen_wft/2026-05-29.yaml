  - number: '34'
    text: |-
      1 Onze Minister kan, ter uitvoering van [artikel 2:66, eerste lid, van de wet][ref1], een staat aanwijzen als staat
      waar het toezicht in voldoende mate waarborgen biedt ten aanzien van de belangen die de wet beoogt te beschermen
      indien:

      a. de in die staat geldende regels voor het aanbieden van rechten van deelneming in een beleggingsinstelling en het
      toezicht op de naleving daarvan gelijkwaardig zijn aan het ingevolge de wet bepaalde met betrekking tot:

      1°. geschiktheid en betrouwbaarheid;

      2°. financiële waarborgen;

      3°. bedrijfsvoering;

      4°. aan de deelnemers in de beleggingsinstelling en de toezichthouder te verstrekken informatie; en

      5°. waarborgen voor een adequaat toezicht op de naleving van de in die staat gestelde regels;

      b. de staat waar de beheerder zijn zetel heeft of de niet-Europese beleggingsinstelling is gevestigd niet is
      geïdentificeerd als een staat met een hoog risico overeenkomstig artikel 9, tweede lid, van de vierde anti-
      witwasrichtlijn;

      c. de staat waar de beheerder zijn zetel heeft of de niet-Europese beleggingsinstelling is gevestigd met Nederland
      en met de lidstaten waar rechten van deelneming in de niet-Europese beleggingsinstelling zullen worden aangeboden
      een overeenkomst heeft gesloten die informatie-uitwisseling waarborgt overeenkomstig de normen van artikel 26 van
      het OESO-Modelverdrag inzake dubbele belasting naar het inkomen en naar het vermogen en de desbetreffende staat
      niet wordt genoemd in bijlage I bij de conclusies van de Raad over de herziene EU-lijst van jurisdicties die niet-
      coöperatief zijn op belastinggebied;

      d. de samenwerking tussen de toezichthouder en het bevoegde gezag in die staat is gewaarborgd door middel van een
      samenwerkingsovereenkomst die ten minste een efficiënte informatie-uitwisseling waarborgt en die de toezichthouder
      in staat stelt haar toezichthoudende taken op grond van de wet uit te voeren; en

      e. voor het bevoegde gezag in die staat regels gelden die gelijkwaardig zijn aan de bepalingen van
      [hoofdstuk 1.4 van de wet][ref2].

      2 De samenwerkingsovereenkomst tussen de toezichthouder en het bevoegde gezag, bedoeld in het eerste lid, onderdeel
      d, voldoet aan de ingevolge artikel 36 van de richtlijn beheerders van alternatieve beleggingsinstellingen gestelde
      eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel266
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Hoofdstuk1.4
