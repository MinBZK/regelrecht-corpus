      Het programma van werkzaamheden, bedoeld in [artikel 26, eerste lid, onderdeel f][ref1], bevat het volgende:

      a. een opgave van de aard van de overeenkomsten die de verzekeraar voornemens is te sluiten;

      b. een uiteenzetting omtrent de leidende beginselen op het gebied van de herverzekering;

      c. een raming van de kosten voor de inrichting van de administratie en van het produktienet, alsmede bewijsstukken
      waaruit blijkt dat de verzekeraar beschikt over de financiële middelen tot dekking daarvan;

      d. een raming voor de eerste drie boekjaren van de liquiditeitspositie;

      e. een gedetailleerde raming voor de eerste drie boekjaren van de vermoedelijke inkomsten en uitgaven, zowel wat
      de directe verrichtingen en de geaccepteerde herverzekeringen als wat de overdrachten uit hoofde van herverzekering
      betreft;

      f. een raming voor de eerste drie boekjaren van de financiële middelen tot dekking van de verplichtingen en tot
      dekking van het solvabiliteitskapitaalvereiste, bedoeld in [artikel 3:57, derde lid, van de wet][ref2]; en

      g. de mededeling of de verzekeraar, indien hij een natura-uitvaartverzekeraar is, ten behoeve van zijn verzekerden
      al dan niet tevens het uitvaartbedrijf uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0020413#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel357
