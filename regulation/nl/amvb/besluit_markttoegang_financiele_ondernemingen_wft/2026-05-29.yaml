      b. een opgave van de financiële diensten die de beheerder voornemens is te verlenen;

      c. een beschrijving van de procedures met betrekking tot het beheer van risico’s, bedoeld in
      [artikel 3:17, tweede lid, aanhef en onderdeel c, van de wet][ref2]; en

      d. een beschrijving van de interne klachtenprocedure, bedoeld in [artikel 4:17, van de wet][ref3].


