  - number: '3'
    text: |-
      1 De gegevens, bedoeld in dit besluit, worden in een zodanige vorm verstrekt dat een goede beoordeling door de
      toezichthouder mogelijk is.

      2 De opstellers van verklaringen en rapportages ondertekenen of waarmerken deze.
    url: https://wetten.overheid.nl/BWBR0020413/2026-05-29#Artikel3
  - number: 3.0a
    text: |-
      De gegevens, bedoeld in de [artikelen 2:3.0a, tweede lid][ref1], [2:3.0f, tweede lid][ref2], en
      [2:3.0k, tweede lid, van de wet][ref3] zijn:

      a. een opgave van de naam, het adres en het telefoon- en faxnummer en het emailadres van de afwikkelonderneming;

      b. een opgave van de rechtsvorm van de afwikkelonderneming;

      c. een opgave van de statutaire zetel, de statutaire naam en de handelsnaam of handelsnamen;

      d. een opgave van het nummer van inschrijving in het handelsregister;

      e. een gewaarmerkt afschrift van de statuten; en

      f. een opgave van de activiteiten die de afwikkelonderneming voornemens is te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel23.0a
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel23.0f
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel23.0k
    url: https://wetten.overheid.nl/BWBR0020413/2026-05-29#Artikel3.0a
