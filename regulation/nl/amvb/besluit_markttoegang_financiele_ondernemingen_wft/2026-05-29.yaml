  - number: '25'
    text: |-
      De gegevens, bedoeld in [artikel 2:46, derde lid, van de wet][ref1] zijn:

      a. het adres van de zetel van de verzekeraar en dat van de vestiging van waaruit hij voornemens is het
      herverzekeringsbedrijf door middel van het verrichten van diensten naar Nederland uit te oefenen;

      b. een verklaring, afgegeven door de toezichthoudende instantie van de lidstaat van de vestiging van waaruit de
      verzekeraar voornemens is het herverzekeringsbedrijf door middel van het verrichten van diensten naar Nederland
      uit te oefenen, waaruit blijkt in welke activiteit of activiteiten hij bevoegd is zijn herverzekeringsbedrijf uit
      te oefenen;

      c. een opgave van de aard van de risico’s die de verzekeraar voornemens is in herverzekering te dekken; en

      d. gegevens waaruit de te verwachten solvabiliteit met betrekking tot het gehele door de verzekeraar uitgeoefende
      bedrijf blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel246
