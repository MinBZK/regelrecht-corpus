    text: |-
      1 De gegevens, bedoeld in [artikel 2:49, tweede lid, van de wet][ref1] zijn:

      a. een opgave van de naam, het adres en het telefoon- en faxnummer van de verzekeraar;

      b. een opgave van de rechtsvorm van de verzekeraar;

      c. indien de verzekeraar een rechtspersoon is, een opgave van de statutaire zetel, de statutaire naam en de
      handelsnaam of handelsnamen;

      d. indien de verzekeraar is ingeschreven in het handelsregister, een opgave van het nummer van inschrijving;

      e. een gewaarmerkt afschrift van de statuten;

      f. een programma van werkzaamheden die de verzekeraar voornemens is te verrichten;

      g. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikel 3:8 van de wet][ref2] is bepaald met betrekking tot de geschiktheid van de in dat artikel bedoelde
      personen;

      h. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikel 3:9 van de wet][ref3] is bepaald met betrekking tot de betrouwbaarheid van de in dat artikel bedoelde
      personen;

      i. een beschrijving van het voorgenomen beleid met betrekking tot de integere bedrijfsuitoefening, bedoeld in
      [artikel 3:10, eerste lid, van de wet][ref4];

      j. een beschrijving van de zeggenschapsstructuur aan de hand waarvan de Nederlandsche Bank kan beoordelen of
      voldaan wordt aan [artikel 3:16 van de wet][ref5];

      k. een beschrijving van de inrichting van de bedrijfsvoering met betrekking tot de beheerste en integere
      bedrijfsuitoefening als bedoeld in [artikel 3:17, eerste lid, van de wet][ref6];

      l. gegevens waaruit het eigen vermogen, bedoeld in [artikel 3:53, eerste lid][ref7], en de te verwachten
      solvabiliteit, bedoeld in [artikel 3:57, eerste lid, van de wet][ref8] blijken; en

      m. indien van toepassing:

      1°. een opgave van de omvang van een gekwalificeerde deelneming als bedoeld in [artikel 3:95 van de wet][ref9];

      2°. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of wordt voldaan aan hetgeen ingevolge
      [artikel 3:99 van de wet][ref10] is bepaald met betrekking tot de betrouwbaarheid van de aanvrager of houder
      van een verklaring van geen bezwaar die op grond van zijn gekwalificeerde deelneming het beleid van de betrokken
      onderneming zou kunnen bepalen of mede bepalen of zou bepalen of mede bepalen; en

      3°. bescheiden waaruit de financiële positie en de juridische groepsstructuur van de aanvrager of houder van een
      verklaring van geen bezwaar blijken.

      2 De gegevens, bedoeld in het eerste lid, onderdeel g, zijn:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;

      b. een curriculum vitae;

      c. een opgave van de relevante diploma’s;

      d. een kopie van een geldig identiteitsbewijs; en

      e. een opgave van referenten.

      3 De gegevens, bedoeld in het eerste lid, onderdeel h, zijn:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;

      b. een kopie van een geldig identiteitsbewijs;

      c. gegevens met betrekking tot de antecedenten, bedoeld in de bijlage bij dit besluit; en

      d. een opgave van referenten.

      4 Het eerste lid, onderdelen h en m, onder 2°, is niet van toepassing ten aanzien van personen wier betrouwbaarheid
      voor de toepassing van de [wet][ref11] door een toezichthouder reeds is vastgesteld.


