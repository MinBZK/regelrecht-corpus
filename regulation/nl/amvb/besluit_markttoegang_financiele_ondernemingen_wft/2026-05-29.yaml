      1 De gegevens, bedoeld in [artikel 2:115, tweede lid, van de wet][ref1] zijn:

      a. de opgave van de lidstaat waar de verzekeraar voornemens is vanuit een bijkantoor haar bedrijf uit te oefenen;

      b. de opgave van het adres van het bijkantoor;

      c. een programma van werkzaamheden;

      d. gegevens op basis waarvan de Nederlandsche Bank redelijkerwijs kan beoordelen of wordt voldaan aan de ingevolge
      [artikel 3:8 van de wet][ref2] gestelde eisen met betrekking tot geschiktheid van de personen die het dagelijks
      beleid van de verzekeraar bepalen;

      e. de opgave van de naam en het adres van de vertegenwoordiger, bedoeld in
      [artikel 3:37, eerste lid, van de wet][ref3], en, zo de vertegenwoordiger rechtspersoon is, de statuten van deze
      rechtspersoon, een opgave van het nummer van inschrijving in het handelsregister en de naam en het privé-adres van
      de natuurlijke persoon, bedoeld in [artikel 3:37, derde lid, van de wet][ref4];

      f. gegevens op basis waarvan de Nederlandsche Bank redelijkerwijs kan beoordelen of wordt voldaan aan
      hetgeen ingevolge [artikel 3:8 van de wet][ref5] is bepaald met betrekking tot geschiktheid van de
      vertegenwoordiger, bedoeld in [artikel 3:37, eerste lid, van de wet][ref6], of de natuurlijke persoon, bedoeld in
      [artikel 3:37, derde lid, van de wet][ref7];

      g. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of voldaan wordt aan hetgeen
      ingevolge [artikel 3:9 van de wet][ref8] is bepaald met betrekking tot de betrouwbaarheid van de
      vertegenwoordiger, bedoeld in [artikel 3:37, eerste lid][ref9], of de natuurlijke persoon, bedoeld in
      [artikel 3:37, derde lid, van de wet][ref10]; en

      h. een beschrijving van de inrichting van de bedrijfsvoering met betrekking tot de beheerste en integere
      bedrijfsuitoefening, bedoeld in [artikel 3:17, eerste lid, van de wet][ref11].

      2 Indien de schadeverzekeraar voornemens is risico’s behorende tot de branche Aansprakelijkheid
      motorrijtuigen te dekken, zijn de gegevens, bedoeld in [artikel 3:115, tweede lid][ref12], voorts een
      schriftelijk bewijs waaruit blijkt dat de schadeverzekeraar is toegetreden tot het nationale bureau
      en het nationale waarborgfonds van de betrokken lidstaat die overeenkomen met het bureau, bedoeld in
      [artikel 2, zesde lid, van de Wet aansprakelijkheid motorrijtuigen][ref13] onderscheidenlijk het Waarborgfonds
      motorverkeer, bedoeld in [artikel 23, eerste lid, van die wet][ref14].

      3 De gegevens, bedoeld in het eerste lid, onderdelen d en f, zijn:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;

      b. een curriculum vitae;

      c. een opgave van de relevante diploma’s;

      d. een kopie van een geldig identiteitsbewijs; en

      e. een opgave van referenten.

      4 De gegevens, bedoeld in het eerste lid, onderdeel g, zijn:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;

      b. een kopie van een geldig identiteitsbewijs;

      c. gegevens met betrekking tot de antecedenten, bedoeld in de bijlage bij dit besluit; en

      d. een opgave van referenten.

      5 Het eerste lid, onderdeel g, is niet van toepassing indien het een persoon betreft wiens betrouwbaarheid voor de
      toepassing van de [wet][ref15] door een toezichthouder reeds is vastgesteld.

      6 De gegevens, bedoeld in het eerste en tweede lid, gaan vergezeld van een vertaling voorzover de Nederlandsche
      Bank zulks verlangt. De Nederlandsche Bank kan slechts dan een vertaling verlangen indien de toezichthoudende
      autoriteit van de lidstaat waar de verzekeraar voornemens is vanuit een bijkantoor haar bedrijf uit te oefenen, een
      vertaling verlangt.


