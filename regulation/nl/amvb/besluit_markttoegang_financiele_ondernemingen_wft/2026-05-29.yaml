  - number: 42b
    text: |-
      De gegevens bedoeld in [artikel 2:107a, derde lid, van de wet][ref1] zijn:

      a. Indien de elektronischgeldinstelling met zetel in Nederland voornemens is door middel van het verrichten van
      diensten haar bedrijf naar een andere lidstaat uit te oefenen:

      1°. de naam, het adres, het telefoon- en faxnummer, het e-mailadres en, voor zover van toepassing, het
      vergunningsnummer van de elektronischgeldinstelling;

      2°. een beschrijving van de organisatiestructuur van de elektronischgeldinstelling;

      3°. de lidstaat of lidstaten waarin zij voornemens is haar werkzaamheden uit te oefenen; en

      4°. een beschrijving van de aard van de diensten die de elektronischgeldinstelling voornemens is te verlenen in de
      andere lidstaat;

      b. Indien de elektronischgeldinstelling voornemens is in een andere lidstaat haar bedrijf uit te oefenen vanuit een
      in die lidstaat gelegen bijkantoor:

      1°. de naam, het adres, het telefoon- en faxnummer en het emailadres van het bijkantoor;

      2°. een beschrijving van de organisatiestructuur van de elektronischgeldinstelling;

      3°. een beschrijving van de aard van de diensten die de elektronischgeldinstelling voornemens is te verlenen in de
      andere lidstaat;

      4°. de identiteit van de personen die het dagelijks beleid van het bijkantoor zullen bepalen;

      5°. een bedrijfsplan met een budgetprognose voor de eerste drie boekjaren waarmee wordt aangetoond dat de aanvrager
      in staat is gebruik te maken van passende en evenredige systemen, middelen en procedures om op een gezonde basis
      ter opereren; en

      6°. een beschrijving van de regelingen op het gebied van bestuur en de mechanismen voor interne controle die
      de aanvrager heeft ingesteld, waaronder de administratieve en boekhoudkundige procedures van de procedures voor
      risicobeheersing, waaruit blijkt dat die bestuursregelingen, controlemechanismen en procedures evenredig, passend,
      degelijk en adequaat zijn;

      c. Indien de elektronischgeldinstelling voornemens is betaaldiensten te verlenen in een andere lidstaat door
      tussenkomst van een in die lidstaat gevestigde betaaldienstagent:

      1°. de naam, het adres, het telefoon- en faxnummer en het emailadres van de betaaldienstagent;

      2°. een beschrijving van de interne controlemechanismen die door de betaaldienstagent zullen worden gebruikt om
      de in de [Wet ter voorkoming van witwassen en financieren van terrorisme][ref2] neergelegde verplichtingen na te
      komen; en

      3°. de identiteit van de personen die het dagelijks beleid van de betaaldienstagent bepalen of mede bepalen,
      alsmede gegevens waaruit blijkt dat zij betrouwbaar en geschikt zijn;

      4°. de betaaldiensten waartoe de betaaldienstagent door de elektronischgeldinstelling wordt gemachtigd; en

      5°. voor zover van toepassing, de unieke identificatiecode of het unieke identificatienummer van de
      betaaldienstagent.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2107a
      [ref2]: https://wetten.overheid.nl/BWBR0024282
