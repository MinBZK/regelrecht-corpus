  - number: '6'
    text: |-
      1 De gegevens, bedoeld in [artikel 2:7, tweede lid, van de wet][ref1] zijn:

      a. een opgave van de naam, het adres en het telefoon- en faxnummer van de clearinginstelling;

      b. een opgave van de rechtsvorm van de clearinginstelling;

      c. indien de clearinginstelling een rechtspersoon is, een opgave van de statutaire zetel, de statutaire naam en de
      handelsnaam of handelsnamen;

      d. indien de clearinginstelling is ingeschreven in het handelsregister, een opgave van het nummer van inschrijving;

      e. het adres van het bijkantoor;

      f. indien aanwezig, een gewaarmerkt afschrift van de statuten;

      g. een opgave van activiteiten die de clearinginstelling voornemens is te verrichten vanuit het bijkantoor;

      h. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikel 3:8 van de wet][ref2] is bepaald met betrekking tot de geschiktheid van de in dat artikel bedoelde
      personen;

      i. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikel 3:9 van de wet][ref3] is bepaald met betrekking tot de betrouwbaarheid van de in dat artikel bedoelde
      personen;

      j. een beschrijving van het voorgenomen beleid met betrekking tot de integere bedrijfsuitoefening, bedoeld in
      [artikel 3:10, eerste lid, van de wet][ref4], vanuit het bijkantoor;

      k. een beschrijving van de inrichting van de bedrijfsvoering met betrekking tot de beheerste en integere
      bedrijfsuitoefening, bedoeld in [artikel 3:17, eerste lid, van de wet][ref5] vanuit het bijkantoor; en

      l. gegevens waaruit het eigen vermogen, bedoeld in [artikel 3:53, eerste lid][ref6], en de te verwachten
      solvabiliteit, bedoeld in [artikel 3:57, eerste lid, van de wet][ref7] en liquiditeit, bedoeld in
      [artikel 3:63, eerste lid, van de wet][ref8] blijken.

      2 De gegevens, bedoeld in het eerste lid, onderdeel h, zijn:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;

      b. een curriculum vitae;

      c. een opgave van de relevante diploma’s;

      d. een kopie van een geldig identiteitsbewijs; en

      e. een opgave van referenten.

      3 De gegevens, bedoeld in het eerste lid, onderdeel i, zijn:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;

      b. een kopie van een geldig identiteitsbewijs;

      c. gegevens met betrekking tot de antecedenten, bedoeld in de bijlage bij dit besluit; en

      d. een opgave van referenten.

      4 Het eerste lid, onderdeel i, is niet van toepassing ten aanzien van personen wier betrouwbaarheid voor de
      toepassing van de [wet][ref9] door een toezichthouder reeds is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel27
