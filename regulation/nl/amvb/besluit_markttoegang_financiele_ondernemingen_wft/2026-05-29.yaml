  - number: 11d
    text: |-
      1 Het programma van werkzaamheden, bedoeld in [artikel 11c, eerste lid, onderdeel g][ref1], dat wordt overgelegd
      door degene die een vergunning aanvraagt voor het uitoefenen van het bedrijf van herverzekeraar, bevat voor het
      bijkantoor het volgende:

      a. een opgave van de aard van de risico’s die de herverzekeraar voornemens is te dekken of van de aard van de
      overeenkomsten die de herverzekeraar voornemens is te sluiten;

      b. een uiteenzetting omtrent de leidende beginselen op het gebied van het sluiten van overeenkomsten waarbij de
      herverzekeraar een gedeelte van het door hem herverzekerde risico, tegen betaling van premie, op zijn beurt aan een
      andere verzekeraar overdraagt;

      c. een raming van het toekomstige solvabiliteitskapitaalvereiste, op basis van de te verwachten balanspositie,
      evenals de voor deze ramingen gehanteerde berekeningsmethode;

      d. een raming van het toekomstige minimumkapitaalvereiste, op basis van de te verwachten balanspositie, evenals de
      voor deze ramingen gehanteerde berekeningsmethode;

      e. bewijsstukken waaruit blijkt dat het bijkantoor voldoet aan de absolute ondergrens van
      het minimumkapitaalvereiste dat ingevolge [artikel 3:55a, eerste lid][ref2], in samenhang met
      [artikel 3:53, eerste en vierde lid, van de wet][ref3] voor de betrokken activiteit of activiteiten
      geldt, dan wel aan het solvabiliteitskapitaalvereiste dat ingevolge [artikel 3:62, eerste lid][ref4], in
      samenhang met [artikel 3:57, eerste tot en met derde lid, van de wet][ref5] van toepassing is indien dit
      solvabiliteitskapitaalvereiste hoger is dan de absolute ondergrens van het minimumkapitaalvereiste;

      f. een raming van de kosten voor de inrichting van de administratie en van het productienet en bewijsstukken
      waaruit blijkt dat de herverzekeraar beschikt over de financiële middelen tot dekking daarvan;

      g. een uiteenzetting over de structuur van het governancesysteem;

      h. een raming voor de eerste drie boekjaren van de andere dan de in onderdeel b bedoelde kosten van beheer, in het
      bijzonder van de algemene kosten en provisies;

      i. een raming voor de eerste drie boekjaren van de premies en van de schaden;

      j. een raming voor de eerste drie boekjaren van de liquiditeitspositie;

      k. voor de eerste drie boekjaren een raming van de te verwachten balanspositie; en

      l. voor de eerste drie boekjaren een raming van de financiële middelen tot dekking van de verplichtingen en tot
      dekking van het minimumkapitaalvereiste en het solvabiliteitskapitaalvereiste.

      2 De aanvrager voegt bij het programma van werkzaamheden de jaarrekening van elk van de laatste drie boekjaren.
      Indien sedert de oprichting van de onderneming van de aanvrager nog geen drie boekjaren zijn verstreken, behoeven
      deze jaarrekeningen slechts voor de afgesloten boekjaren te worden overgelegd.

      3 Het programma van werkzaamheden bevat tevens bewijsstukken waaruit blijkt dat de solvabiliteit van de
      herverzekeraar voldoet aan [artikel 3:57, eerste en tweede lid, van de wet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0020413#Artikel11c
