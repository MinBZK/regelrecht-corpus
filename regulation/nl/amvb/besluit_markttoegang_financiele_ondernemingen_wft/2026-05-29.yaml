  - number: 31f
    text: |-
      1 De gegevens, bedoeld in [artikel 2:54h, derde lid, van de wet][ref1] zijn:

      a. een opgave van de naam, het adres en het telefoon- en faxnummer, het e-mailadres en de internetpagina van de
      premiepensioeninstelling;

      b. een opgave van de rechtsvorm van de premiepensioeninstelling;

      c. een opgave van de statutaire zetel, de statutaire naam en de handelsnaam of handelsnamen;

      d. een opgave van het nummer van inschrijving in het handelsregister;

      e. een gewaarmerkt afschrift van de statuten;

      f. een programma van werkzaamheden die de premiepensioeninstelling voornemens is te verrichten;

      g. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikel 3:8 van de wet][ref2] is bepaald met betrekking tot de geschiktheid van de in dat artikel bedoelde
      personen;

      h. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikel 3:9 van de wet][ref3] is bepaald met betrekking tot de betrouwbaarheid van de in dat artikel bedoelde
      personen;

      i. een beschrijving van het voorgenomen beleid met betrekking tot de integere bedrijfsuitoefening, bedoeld in
      [artikel 3:10, eerste lid, van de wet][ref4];

      j. een beschrijving van de zeggenschapsstructuur aan de hand waarvan de Nederlandsche Bank kan beoordelen of
      voldaan wordt aan [artikel 3:16 van de wet][ref5];

      k. een beschrijving van de inrichting van de bedrijfsvoering met betrekking tot de beheerste en integere
      bedrijfsuitoefening, bedoeld in [artikel 3:17, eerste lid, van de wet][ref6];

      l. bescheiden waaruit het eigen vermogen, bedoeld in [artikel 3:53, eerste lid, van de wet][ref7] en de te
      verwachten solvabiliteit, bedoeld in [artikel 3:57, eerste lid, van de wet][ref8] blijken; en

      m. indien de aanvrager zetel heeft in Nederland en voornemens is tevens als adviseur, bemiddelaar, gevolmachtigde
      agent of ondergevolmachtigde agent in verzekeringen in Nederland op te treden:

      1°. gegevens op basis waarvan de Autoriteit Financiële Markten kan beoordelen of voldaan wordt aan hetgeen
      ingevolge [artikel 4:9, eerste lid, van de wet][ref9] is bepaald met betrekking tot de geschiktheid van de in dat
      lid bedoelde personen en hetgeen ingevolge het tweede lid van dat artikel van de wet is bepaald met betrekking tot
      de vakbekwaamheid van de in dat lid bedoelde personen;

      2°. gegevens op basis waarvan de Autoriteit Financiële Markten kan beoordelen of voldaan wordt
      aan hetgeen ingevolge de wet is bepaald met betrekking tot de bedrijfsvoering, bedoeld in
      [artikel 4:15, tweede lid, onderdeel b, aanhef en onder 1° en 2°, van de wet][ref10]; en

      3°. indien het bemiddelen in verzekeringen betreft: een afschrift van de polis en polisvoorwaarden van de
      beroepsaansprakelijkheidsverzekering of gegevens met betrekking tot de daarmee vergelijkbare voorziening, bedoeld
      in [artikel 4:75 van de wet][ref11].

      2 De gegevens, bedoeld in het eerste lid, onderdelen g en m, onder 1°, zijn:

      a. met betrekking tot de geschiktheid van de in [artikel 4:9, eerste lid, van de wet][ref12] bedoelde personen:

      1°. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer, het e-mailadres en de functie;

      2°. een curriculum vitae;

      3°. een opgave van de relevante diploma’s;

      4°. een kopie van een geldig identiteitsbewijs; en

      5°. een opgave van referenten;

      b. met betrekking tot de vakbekwaamheid van de in [artikel 4:9, tweede lid, van de wet][ref13] bedoelde personen:
      een beschrijving van de wijze waarop deze vakbekwaamheid wordt gewaarborgd.

      3 De gegevens, bedoeld in het eerste lid, onderdeel h, zijn:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer, het e-mailadres en de functie;

      b. een kopie van een geldig identiteitsbewijs;

      c. gegevens met betrekking tot de antecedenten, bedoeld in de bijlage bij dit besluit; en

      d. een opgave van referenten.

      4 De gegevens, bedoeld in het eerste lid, onderdeel m, onder 2°, zijn:

      a. een beschrijving van de bedrijfsvoering die de premiepensioeninstelling in staat stelt te voldoen aan de
      bewaarplicht in verband met advisering; of

      b. indien de premiepensioeninstelling afwijkt van de bewaarplicht: het protocol van het adviesproces.

      5 Het eerste lid, onderdeel h, is niet van toepassing ten aanzien van personen wier betrouwbaarheid voor de
      toepassing van de [wet][ref14], de [Pensioenwet][ref15] of de [Wet verplichte beroepspensioenregeling][ref16] door
      een toezichthouder reeds is vastgesteld.


