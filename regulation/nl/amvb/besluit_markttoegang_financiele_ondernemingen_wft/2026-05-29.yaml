      1 De gegevens, bedoeld in [artikel 2:12, vierde lid, van de wet][ref1] zijn:

      a. een opgave van de naam, het adres en het telefoon- en faxnummer van de bank;

      b. een opgave van de rechtsvorm van de bank;

      c. indien de bank een rechtspersoon is, een opgave van de statutaire zetel, de statutaire naam en de handelsnaam
      of handelsnamen;

      d. indien de bank is ingeschreven in het handelsregister, een opgave van het nummer van inschrijving;

      e. indien aanwezig, een gewaarmerkt afschrift van de statuten;

      f. een opgave van activiteiten die de bank voornemens is te verrichten;

      g. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikel 3:8 van de wet][ref2] is bepaald met betrekking tot de geschiktheid van de in dat artikel bedoelde
      personen;

      h. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikel 3:9 van de wet][ref3] is bepaald met betrekking tot de betrouwbaarheid van de in dat artikel bedoelde
      personen;

      i. een beschrijving van het voorgenomen beleid met betrekking tot de integere bedrijfsuitoefening, bedoeld in
      [artikel 3:10, eerste lid, van de wet][ref4];

      j. een beschrijving van de zeggenschapsstructuur aan de hand waarvan de Nederlandsche Bank kan beoordelen of
      voldaan wordt aan [artikel 3:16 van de wet][ref5];

      k. een beschrijving van de inrichting van de bedrijfsvoering met betrekking tot de beheerste en integere
      bedrijfsuitoefening , bedoeld in [artikel 3:17, eerste lid, van de wet][ref6];

      l. indien van toepassing, een beschrijving van het geconsolideerde toezicht, bedoeld in
      [artikel 3:31 van de wet][ref7];

      m. bescheiden waaruit het eigen vermogen, bedoeld in [artikel 3:53, eerste lid van de wet][ref8] en de te
      verwachten solvabiliteit, bedoeld in [artikel 3:57, eerste lid, van de wet][ref9] en liquiditeit, bedoeld in
      [artikel 3:63, eerste lid, van de wet][ref10] blijken;

      n. indien van toepassing:

      1°. een opgave van de identiteit van de houders van een gekwalificeerde deelneming als bedoeld in
      [artikel 3:95 van de wet][ref11] en de omvang van die deelnemingen of, bij gebreke van gekwalificeerde
      deelnemingen, van de twintig grootste aandeelhouders of vennoten;

      2°. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikel 3:99 van de wet][ref12] is bepaald met betrekking tot de betrouwbaarheid van de aanvrager of houder
      van een verklaring van geen bezwaar die op grond van zijn gekwalificeerde deelneming het beleid van de betrokken
      onderneming zou kunnen bepalen of mede bepalen of zou bepalen of mede bepalen; en

      3°. bescheiden waaruit de financiële positie en de juridische groepsstructuur van de aanvrager of houder van een
      verklaring van geen bezwaar blijken; en

      o. indien de bank een dochtermaatschappij is van een bank met zetel in een andere staat: een verklaring van de
      toezichthoudende instantie van de staat waar die bank haar zetel heeft of de Europese Centrale Bank, waaruit blijkt
      dat deze toezichthoudende instantie of de Europese Centrale Bank goedgekeurd heeft dat laatstbedoelde bank een
      dochtermaatschappij heeft die voornemens is in Nederland het bedrijf van bank uit te oefenen.

      2 De gegevens, bedoeld in het eerste lid, onderdeel g, zijn:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;

      b. een curriculum vitae;

      c. een opgave van de relevante diploma’s;

      d. een kopie van een geldig identiteitsbewijs; en

      e. een opgave van referenten.

      3 De gegevens, bedoeld in het eerste lid, onderdeel h, zijn:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;

      b. een kopie van een geldig identiteitsbewijs;

      c. gegevens met betrekking tot de antecedenten, bedoeld in de bijlage bij dit besluit; en

      d. een opgave van referenten.

      4 Het eerste lid, onderdelen h en n, onder 2°, is niet van toepassing ten aanzien van personen wier betrouwbaarheid
      voor de toepassing van de [wet][ref13] door een toezichthouder reeds is vastgesteld.


