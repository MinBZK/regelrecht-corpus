      1 De gegevens, bedoeld in [artikel 2:117, derde lid van de wet][ref1] zijn:

      a. de opgave van de lidstaat waarnaar de verzekeraar voornemens is diensten te verrichten; en

      b. indien het levensverzekeraar betreft, een beschrijving van de aard van de overeenkomsten die hij voornemens is
      te sluiten; en

      c. indien het een schadeverzekeraar betreft, een beschrijving van de aard van de risico’s die hij voornemens is
      te dekken.

      2 Indien de verzekeraar voornemens is het bedrijf van verzekeraar in de branche Aansprakelijkheidsverzekering
      motorrijtuigen uit te oefenen door middel van diensten naar een andere lidstaat Nederland zijn de gegevens tevens:

      a. de opgave van de naam en het adres van de schade-afhandelaar in de betrokken lidstaat die belast wordt met het
      namens de verzekeraar afwikkelen van vorderingen van benadeelden die voortvloeien uit risico’s behorende tot de
      branche Aansprakelijkheid motorrijtuigen; en

      b. een schriftelijk bewijs waaruit blijkt dat de verzekeraar is toegetreden tot het nationale bureau
      van het nationale waarborgfonds van de betrokken lidstaat die overeenkomen met het bureau, bedoeld in
      [artikel 2, zesde lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref2] onderscheidenlijk het
      Waarborgfonds Motorverkeer, bedoeld in [artikel 23, eerste lid, van die wet][ref3].

      3 De gegevens, bedoeld in het eerste en tweede lid, bevatten tevens een vertaling voorzover de Nederlandsche Bank
      zulks verlangt. De Nederlandsche Bank kan slechts dan een vertaling verlangen indien de toezichthoudende autoriteit
      van de lidstaat waar de verzekeraar voornemens is vanuit een bijkantoor haar bedrijf uit te oefenen, een vertaling
      verlangt.


