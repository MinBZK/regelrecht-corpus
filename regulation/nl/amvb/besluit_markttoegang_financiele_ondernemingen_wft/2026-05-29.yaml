  - number: '7'
    text: |-
      De gegevens, bedoeld in [artikel 2:9, eerste lid, van de wet][ref1] zijn:

      a. het adres van zijn zetel en dat van de vestiging van waaruit de clearinginstelling voornemens is de diensten
      te verrichten;

      b. een gewaarmerkt afschrift van de statuten;

      c. de vermelding van de bevoegdheid om in de staat van de zetel het bedrijf van clearinginstelling uit te oefenen;

      d. de vermelding of sprake is van de daadwerkelijke uitoefening van het bedrijf van clearinginstelling vanuit de
      staat van de zetel;

      e. gegevens waaruit het eigen vermogen, bedoeld in [artikel 3:53, eerste lid van de wet][ref2], van de
      clearinginstelling en de te verwachten solvabiliteit als bedoeld in [artikel 3:57, eerste lid, van de wet][ref3],
      van de clearinginstelling blijken;

      f. de naam en het privé-adres van de personen die het dagelijks beleid van het bijkantoor van de clearinginstelling
      bepalen; en

      g. de naam en het privé-adres van de personen die het beleid van het bijkantoor van de clearinginstelling bepalen
      of mede bepalen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel353
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel357
