      1 Indien de aanvrager van een vergunning voor het uitoefenen van het bedrijf van schadeverzekeraar voornemens
      is dat bedrijf uitsluitend in de branche Rechtsbijstand uit te oefenen, zijn de gegevens, bedoeld in
      [artikel 2:33, tweede lid, van de wet][ref1], afhankelijk van de keuze die de aanvrager heeft gemaakt met
      betrekking tot het voldoen aan [artikel 4:65, eerste lid, onderdeel a, b of c van de wet][ref2]:

      a. een beschrijving van de inrichting van de bedrijfsvoering waaruit blijkt dat de personeelsleden die zich
      bezighouden met de rechtsbijstandschaderegeling of met het geven van juridische adviezen met betrekking tot
      deze schaderegeling, niet tegelijkertijd dezelfde of soortgelijke werkzaamheden verrichten ten behoeve van een
      andere verzekeraar waarmee hij financiële, commerciële of administratieve banden heeft en die een andere branche
      uitoefent;

      b. een opgave van het schaderegelingskantoor, bedoeld in [artikel 4:65, eerste lid, onderdeel b van de wet][ref3];
      onderscheidenlijk

      c. een opgave van de bepaling, bedoeld in [artikel 4:65, eerste lid, onderdeel c, van de wet][ref4].

      2 Indien de aanvrager van een vergunning voor de uitoefening van het bedrijf van schadeverzekeraar voornemens
      is dat bedrijf naast de branche Rechtsbijstand in een andere branche uit te oefenen, zijn de gegevens, bedoeld
      in [artikel 2:33, tweede lid, van de wet][ref5], afhankelijk van de keuze die de aanvrager heeft gemaakt met
      betrekking tot het voldoen aan [artikel 4:65, tweede lid, onderdeel a of b, van de wet][ref6]:

      a. een opgave van het schaderegelingskantoor, bedoeld in [artikel 4:65, tweede lid, onderdeel a, van de wet][ref7];
      onderscheidenlijk

      b. een opgave van de bepaling, bedoeld in [artikel 4:65, tweede lid, onderdeel b, van de wet][ref8].

      3 Gegevens met betrekking tot het schaderegelingskantoor bevatten tevens een beschrijving van de inrichting
      van de bedrijfsvoering waaruit blijkt dat de personeelsleden en de leden van het leidinggevende orgaan die zich
      bezighouden met de rechtsbijstandschaderegeling of met het geven van juridische adviezen met betrekking tot deze
      schaderegeling, niet tezelfdertijd dezelfde of soortgelijke werkzaamheden verrichten ten behoeve van een andere
      branche van een verzekeraar waarmee het schaderegelingskantoor financiële, commerciële of administratieve banden
      heeft.


