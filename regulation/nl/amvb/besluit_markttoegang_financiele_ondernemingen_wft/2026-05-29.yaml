  - number: '55'
    text: |-
      1 De gegevens, bedoeld in [artikel 2:121, tweede lid, van de wet][ref1] zijn:

      a. de opgave van de staat waar de verzekeraar met beperkte risico-omvang voornemens is vanuit een bijkantoor zijn
      bedrijf uit te oefenen;

      b. de opgave van het adres van het bijkantoor;

      c. een programma van werkzaamheden;

      d. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of wordt voldaan aan hetgeen ingevolge
      [artikel 3:8 van de wet][ref2] is bepaald met betrekking tot de geschiktheid van de personen die het dagelijks
      beleid van de verzekeraar bepalen;

      e. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of wordt voldaan aan hetgeen ingevolge
      [artikel 3:8 van de wet][ref3] is bepaald met betrekking tot de geschiktheid van de vertegenwoordiger,
      bedoeld in [artikel 3:37, eerste lid, van de wet][ref4], of de natuurlijke persoon, bedoeld in
      [artikel 3:37, derde lid, van de wet][ref5];

      f. indien de vertegenwoordiger, bedoeld in [artikel 3:37, eerste lid, van de wet][ref6], rechtspersoon is, de
      opgave van de naam, het adres, de statuten , en een opgave van het nummer van inschrijving in het handelsregister;
      en

      g. de gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of wordt voldaan aan hetgeen ingevolge
      [artikel 3:9 van de wet][ref7] is bepaald met betrekking tot betrouwbaarheid van de vertegenwoordiger, bedoeld
      in [artikel 3:37, eerste lid][ref8], indien deze een natuurlijke persoon is, of met betrekking tot de natuurlijke
      persoon, bedoeld in [artikel 3:37, derde lid, van de wet][ref9].

      2 De gegevens, bedoeld in het eerste lid, onderdelen d en e, zijn:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;

      b. een curriculum vitae;

      c. een opgave van de geldige diploma’s;

      d. een kopie van een geldig identiteitsbewijs; en

      e. een opgave van referenten.

      3 De gegevens, bedoeld in het eerste lid, onderdeel g, zijn:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;

      b. een kopie van een geldig identiteitsbewijs;

      c. gegevens met betrekking tot de antecedenten, bedoeld in de bijlage bij dit besluit; en

      d. een opgave van referenten.

      4 Het eerste lid, onderdeel g, is niet van toepassing indien het een persoon betreft wiens betrouwbaarheid voor de
      toepassing van de [wet][ref10] door een toezichthouder reeds is vastgesteld.


