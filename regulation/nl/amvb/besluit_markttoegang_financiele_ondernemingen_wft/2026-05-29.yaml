      De gegevens, bedoeld in [artikel 2:106.0a, tweede lid, van de wet][ref1] zijn:

      a. de staat waar de afwikkelonderneming voornemens is vanuit een bijkantoor haar bedrijf uit te oefenen;

      b. de naam, het adres, het telefoon- en faxnummer en het emailadres van de betaalinstelling;

      c. een opgave van de werkzaamheden, genoemd in de definitie van «afwikkeldiensten» in
      [artikel 1:1 van de wet][ref2], die de afwikkelonderneming voornemens is vanuit het bijkantoor te verrichten;

      d. een beschrijving van het voorgenomen beleid met betrekking tot de integere bedrijfsuitoefening, bedoeld in
      [artikel 3:10, eerste en tweede lid, van de wet][ref3];

      f. een beschrijving van de inrichting van de voorgenomen bedrijfsvoering met betrekking tot de beheerste en
      integere bedrijfsuitoefening, bedoeld in [artikel 3:17, eerste lid, van de wet][ref4]; en

      g. gegevens op grond waarvan de Nederlandsche Bank kan beoordelen of de financiële positie toereikend is.


