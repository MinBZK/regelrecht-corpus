  - number: '48'
    text: |-
      Het programma van werkzaamheden, bedoeld in [artikel 47, eerste lid, onderdeel c][ref1], dat wordt overgelegd
      door een levensverzekeraar met zetel in Nederland ten behoeve van een bijkantoor in een andere lidstaat bevat het
      volgende:

      a. een opgave van de aard van de overeenkomsten die de levensverzekeraar voornemens is te sluiten;

      b. een beschrijving van de inrichting van de bedrijfsvoering met betrekking tot de beheerste en integere
      bedrijfsuitoefening, bedoeld in [artikel 3:17, eerste lid][ref2], van het bijkantoor;

      c. een raming van de kosten voor de inrichting van de administratie en van het produktienet, alsmede bewijsstukken
      waaruit blijkt dat de verzekeraar beschikt over de financiële middelen tot dekking daarvan; en

      d. voor het eerste boekjaar, een gedetailleerde raming van de vermoedelijke inkomsten en uitgaven, zowel wat de
      directe verrichtingen en de geaccepteerde herverzekeringen als de overdachten uit hoofde van de herverzekering
      betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0020413#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel317
