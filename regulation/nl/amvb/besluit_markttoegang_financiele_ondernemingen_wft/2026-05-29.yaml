  - number: 11e
    text: |-
      De gegevens, bedoeld in [artikel 2:26f, tweede lid, van de wet][ref1] zijn:

      a. een opgave van de naam, het adres en het telefoon- en faxnummer van de herverzekeraar;

      b. een opgave van de rechtsvorm van de herverzekeraar;

      c. een opgave van de statutaire zetel, de statutaire naam en de handelsnaam of handelsnamen;

      d. indien de herverzekeraar is ingeschreven in het handelsregister, een opgave van het nummer van inschrijving;

      e. een gewaarmerkt afschrift van de statuten;

      f. de opgave van het adres van zijn zetel en dat van de vestiging van waaruit de herverzekeraar voornemens is de
      diensten te verrichten;

      g. de vermelding van de bevoegdheid om in de staat van de zetel het bedrijf van verzekeraar uit te oefenen en in
      welke activiteit of activiteiten de herverzekeraar bevoegd is zijn bedrijf uit te oefenen;

      h. de vermelding van de daadwerkelijke uitoefening van het bedrijf van herverzekeraar vanuit de staat van de zetel;

      i. gegevens waaruit de te verwachte solvabiliteit, bedoeld in [artikel 3:57, eerste lid, van de wet][ref2] met
      betrekking tot het gehele door de herverzekeraar uitgeoefende bedrijf blijkt; en

      j. een opgave van de aard van de risico’s die de herverzekeraar voornemens is te dekken.


