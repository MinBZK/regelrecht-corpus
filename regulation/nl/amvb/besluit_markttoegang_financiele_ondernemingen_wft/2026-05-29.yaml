      1 De gegevens, bedoeld in [artikel 2:69d, vierde lid, van de wet][ref1], zijn:

      a. het registratiedocument, bedoeld in [artikel 4:48 van de wet][ref2];

      b. de statuten van de beheerder van de icbe;

      c. gegevens op basis waarvan de Autoriteit Financiële Markten kan beoordelen of voldaan wordt aan hetgeen ingevolge
