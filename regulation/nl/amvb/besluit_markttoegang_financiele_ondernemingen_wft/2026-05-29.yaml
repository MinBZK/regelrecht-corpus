  - number: 57b
    text: |-
      1 De gegevens, bedoeld in [artikel 2:123, tweede lid, van de wet][ref1] zijn:

      a. het fondsreglement of de statuten van de instelling voor collectieve belegging in effecten;

      b. het prospectus van de instelling voor collectieve belegging in effecten;

      c. de essentiële beleggersinformatie, bedoeld in
      [artikel 1 van het Besluit Gedragstoezicht financiële ondernemingen Wft][ref2];

      d. de wijze van in- en verkoop van rechten van deelneming in de andere lidstaat;

      e. in voorkomend geval, de laatste jaarrekening en halfjaarcijfers van de instelling voor collectieve belegging
      in effecten;

      f. het factuuradres; en

      g. informatie over de getroffen voorzieningen om de taken, bedoeld in artikel 92, eerste lid, van de richtlijn
      instellingen voor collectieve belegging in effecten, te kunnen vervullen.

      2 De kennisgeving, [bedoeld in artikel 2:123, tweede lid, van de wet][ref3] wordt opgesteld op de wijze, bedoeld in
      artikel 1 van uitvoeringsverordening (EU) nr. 584/2010 van de Europese Commissie van 1 juli 2010 tot uitvoering van
      Richtlijn 2009/65/EG van het Europees Parlement en de Raad van de Europese Unie wat betreft de vorm en inhoud van
      de gestandaardiseerde kennisgeving en icbe-verklaring, het gebruik van elektronische communicatie tussen bevoegde
      autoriteiten voor kennisgevingsdoeleinden, alsook procedures voor onderzoeken en verificaties ter plaatse en de
      uitwisseling van informatie tussen bevoegde autoriteiten (PbEU L 176).


