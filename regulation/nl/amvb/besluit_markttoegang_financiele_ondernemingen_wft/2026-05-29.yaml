  - number: 31i
    text: |-
      1 De gegevens, bedoeld in [artikel 2:54j, tweede lid, van de wet][ref1] zijn:

      a. een opgave van de naam, het adres, het telefoon- en faxnummer en het emailadres van de wisselinstelling en,
      indien van toepassing, het adres en de vestigingsplaats van diens bijkantoren;

      b. een opgave van de rechtsvorm van de wisselinstelling;

      c. een opgave van de statutaire zetel, de statutaire naam en de handelsnaam of handelsnamen;

      d. een opgave van het nummer van inschrijving in het handelsregister;

      e. een gewaarmerkt afschrift van de statuten;

      f. een opgave van de activiteiten die de wisselinstelling voornemens is te verrichten;

      g. een bedrijfsplan met inbegrip van een budgetprognose voor de eerste drie boekjaren waarmee wordt aangetoond dat
      de wisselinstelling in staat is gebruik te maken van passende en evenredige systemen, middelen en procedures om op
      een gezonde basis te opereren;

      h. een beschrijving van de organisatiestructuur, met inbegrip van, voor zover van toepassing, een beschrijving van
      het voorgenomen gebruik van bijkantoren en van de regelingen voor uitbesteding;

      i. een opgave van de identiteit van personen die een gekwalificeerde deelneming als bedoeld in
      [artikel 1:1 van de wet][ref2] in de wisselinstelling bezitten, alsmede de omvang van hun deelneming;

      j. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of wordt voldaan aan hetgeen ingevolge
      [artikel 3:9 van de wet][ref3] is bepaald met betrekking tot de betrouwbaarheid van de in dat artikel bedoelde
      personen;

      k. een beschrijving van het voorgenomen beleid met betrekking tot de integere bedrijfsuitoefening, bedoeld in
      [artikel 3:10, eerste lid, van de wet][ref4]; en

      l. een beschrijving van de inrichting van de bedrijfsvoering met betrekking tot de beheerste en integere
      bedrijfsuitoefening, bedoeld in [artikel 3:17, eerste en tweede lid, van de wet][ref5].

      2 Bij de toepassing van het eerste lid, aanhef en onderdelen h, k en l, geeft de wisselinstelling een beschrijving
      van de organisatorische regelingen die zij heeft getroffen voor het nemen van alle redelijke maatregelen om de
      belangen van degenen voor wie zij wisseltransacties verricht te beschermen en om de continuïteit en betrouwbaarheid
      bij het uitvoeren van wisseltransacties te garanderen.

      3 De gegevens, bedoeld in het eerste lid, onderdeel j, zijn:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer, het emailadres en de functie;

      b. een kopie van een geldig identiteitsbewijs;

      c. gegevens met betrekking tot de antecedenten, bedoeld in de bijlage bij dit besluit; en

      d. een opgave van referenten.

      4 Het eerste lid, onderdeel j, is niet van toepassing ten aanzien van personen wier betrouwbaarheid voor de
      toepassing van de wet door een toezichthouder reeds is vastgesteld.


