      Indien een vergunning als bedoeld in [artikel 2:105, eerste lid, van de wet][ref1], wordt aangevraagd, worden,
      onverminderd de in dat lid genoemde artikelen, de volgende gegevens overgelegd:

      a. gegevens waaruit de aansluiting bij de rechtspersoon, bedoeld in [artikel 2:105, eerste lid, van de wet][ref2]
      blijkt;

      b. gegevens waaruit blijkt dat de rechtspersoon beschikt over voldoende bevoegdheden jegens de aangesloten
      ondernemingen om een handelen van een zodanige instelling in strijd met het ingevolge de [wet][ref3] bepaalde tegen
      te gaan en door de toezichthouder gegeven aanwijzing op te laten volgen;

      c. gegevens waaruit blijkt dat de rechtspersoon beschikt over voldoende mogelijkheden tot deskundige ondersteuning
      van de aangesloten ondernemingen; en

      d. gegevens waaruit blijkt dat de rechtspersoon gemachtigd is de aangesloten ondernemingen bij de aanvraag en
      ook overigens voor de toepassing van de in [artikel 2:105, lid 3, van de wet][ref4] genoemde afdelingen van de
      [wet][ref5] te vertegenwoordigen.


