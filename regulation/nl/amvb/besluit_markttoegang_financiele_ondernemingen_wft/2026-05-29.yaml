  - number: 11c
    text: |-
      1 De gegevens, bedoeld in [artikel 2:26e, tweede lid, van de wet][ref1] zijn:

      a. een opgave van de naam, het adres en het telefoon- en faxnummer van de herverzekeraar;

      b. een opgave van de rechtsvorm van de herverzekeraar;

      c. een opgave van de statutaire zetel, de statutaire naam en de handelsnaam of handelsnamen;

      d. indien de herverzekeraar is ingeschreven in het handelsregister, een opgave van het nummer van inschrijving;

      e. het adres van het bijkantoor;

      f. een gewaarmerkt afschrift van de statuten;

      g. een programma van werkzaamheden die de herverzekeraar voornemens is te verrichten vanuit het bijkantoor;

      h. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikel 3:8 van de wet][ref2] is bepaald met betrekking tot de geschiktheid van de in dat artikel bedoelde
      personen;

      i. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikel 3:9 van de wet][ref3] is bepaald met betrekking tot de betrouwbaarheid van de in dat artikel bedoelde
      personen;

      j. een beschrijving van het voorgenomen beleid met betrekking tot de integere bedrijfsuitoefening, bedoeld in
      [artikel 3:10, eerste lid, van de wet][ref4], vanuit het bijkantoor;

      k. een beschrijving van de zeggenschapsstructuur aan de hand waarvan de Nederlandsche Bank kan beoordelen of
      voldaan wordt aan [artikel 3:16 van de wet][ref5];

      l. een beschrijving van de inrichting van de bedrijfsvoering met betrekking tot de beheerste en integere
      bedrijfsuitoefening, bedoeld in [artikel 3:17, eerste lid, van de wet][ref6] vanuit het bijkantoor;

      m. de vermelding van de bevoegdheid tot uitoefening van het bedrijf van herverzekeraar;

      n. bescheiden waaruit het eigen vermogen, bedoeld in [artikel 3:53, eerste lid, van de wet][ref7] van het
      bijkantoor van de herverzekeraar, blijkt en op basis waarvan de Nederlandsche Bank kan beoordelen of voldaan
      wordt aan hetgeen ingevolge dat artikel is bepaald, en waaruit de te verwachten solvabiliteit, bedoeld in
      [artikel 3:57, eerste lid, van de wet][ref8] van het bijkantoor van de herverzekeraar blijkt.

      2 De gegevens, bedoeld in het eerste lid, onderdeel h, zijn:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;

      b. een curriculum vitae;

      c. een opgave van de relevante diploma’s;

      d. een kopie van een geldig identiteitsbewijs; en

      e. een opgave van referenten.

      3 De gegevens, bedoeld in het eerste lid, onderdeel i, zijn:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;

      b. een kopie van een geldig identiteitsbewijs;

      c. gegevens met betrekking tot antecedenten, bedoeld in de bijlage bij dit besluit; en

      d. een opgave van referenten.

      4 Het eerste lid, onderdeel i, is niet van toepassing ten aanzien van personen wier betrouwbaarheid voor de
      toepassing van de [wet][ref9] door een toezichthouder reeds is vastgesteld.


