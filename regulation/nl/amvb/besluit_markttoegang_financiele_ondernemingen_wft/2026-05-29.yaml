      1 De gegevens, bedoeld in [artikel 2:97, negende lid, van de wet][ref1], zijn:

      a. een opgave van de naam en het adres van de verbonden agent;

      b. een opgave van de rechtsvorm van de verbonden agent;

      c. indien de verbonden agent een rechtspersoon is: een opgave van de statutaire zetel, de statutaire naam en de
      handelsnaam of handelsnamen;

      d. indien de verbonden agent is ingeschreven in het handelsregister: een opgave van het nummer van inschrijving;

      e. gegevens op basis waarvan de Autoriteit Financiële Markten kan beoordelen of met betrekking tot de verbonden
      agent voldaan wordt aan hetgeen ingevolge [artikel 4:9 van de wet][ref2] is bepaald met betrekking tot de
      geschiktheid van de in dat artikel bedoelde personen;

      f. gegevens op basis waarvan de Autoriteit Financiële Markten kan beoordelen of met betrekking tot de verbonden
      agent voldaan wordt aan hetgeen ingevolge [artikel 4:10 van de wet][ref3] is bepaald met betrekking tot de
      betrouwbaarheid van de in dat artikel bedoelde personen;

      g. een opgave van de financiële dienst waarvoor de beleggingsonderneming als verbonden agent optreedt; en

      h. gegevens op basis waarvan de Autoriteit Financiële Markten kan beoordelen of de beleggingsonderneming volledig
      verantwoordelijk is voor de verbonden agent als bedoeld in [artikel 2:97, vijfde lid, van de wet][ref4].

      2 De gegevens, bedoeld in het eerste lid, onderdeel e, zijn:

      1°. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;

      2°. een curriculum vitae;

      3°. een opgave van de relevante diploma’s;

      4°. een kopie van een geldig identiteitsbewijs; en

      5°. een opgave van referenten.

      3 De gegevens, bedoeld in het eerste lid, onderdeel f, zijn:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;

      b. een kopie van een geldig identiteitsbewijs;

      c. gegevens met betrekking tot de antecedenten, bedoeld in de bijlage bij dit besluit; en

      d. een opgave van referenten.

      4 Het eerste lid, onderdeel f, is niet van toepassing ten aanzien van personen wier betrouwbaarheid voor de
      toepassing van de wet door een toezichthouder reeds is vastgesteld.


