  - number: '28'
    text: |-
      Onze Minister kan, ter uitvoering van [artikel 2:50, tweede lid][ref1], van de wet, een staat aanwijzen als staat
      waar het toezicht in voldoende mate waarborgen biedt ten aanzien van de belangen die de wet beoogt te beschermen
      indien:

      a. de in die staat geldende regels voor het uitoefenen van het bedrijf van levensverzekeraar, natura-
      uitvaartverzekeraar of schadeverzekeraar met beperkte risico-omvang en het toezicht op de naleving daarvan
      gelijkwaardig zijn aan het ingevolge de [wet][ref2] bepaalde met betrekking tot:

      1°. geschiktheid en betrouwbaarheid;

      2°. financiële waarborgen;

      3°. bedrijfsvoering, waaronder maatregelen gericht op het bevorderen en handhaven van een integere bedrijfsvoering;
      en

      4°. waarborgen voor een adequaat toezicht op de naleving van de in die staat gestelde regels;

      b. de samenwerking tussen de toezichthouder en het bevoegde gezag in die staat is gewaarborgd; en

      c. voor het bevoegde gezag in die staat regels gelden die gelijkwaardig zijn aan die in
      [Hoofdstuk 1.4 van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel250
      [ref2]: https://wetten.overheid.nl/BWBR0020368
