    text: |-
      1 De gegevens, bedoeld in [artikel 2:78, tweede lid, van de wet][ref1], zijn:

      a. een opgave van de naam en het adres van de adviseur;

      b. een opgave van de rechtsvorm van de adviseur;

      c. indien de adviseur een rechtspersoon is: een opgave van de statutaire zetel, de statutaire naam en de
      handelsnaam of handelsnamen;

      d. indien de adviseur is ingeschreven in het handelsregister: een opgave van het nummer van inschrijving;

      e. indien toepassing is gegeven aan [artikel 2:105 van de wet][ref2]: ten aanzien van iedere bij de adviseur
      aangesloten onderneming waarvoor de vergunning mede geldt de gegevens, bedoeld onder a tot en met d;

      f. indien van toepassing: een opgave van de aansluiting bij een stelsel van zelftoezicht waarmee de Autoriteit
      Financiële Markten een convenant heeft gesloten;

      g. een opgave van de financiële dienst waarvoor de vergunning wordt aangevraagd en het financiële product waarop
      deze dienst betrekking heeft;

      h. gegevens op basis waarvan de Autoriteit Financiële Markten kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikel 4:9, eerste lid, van de wet][ref3] is bepaald met betrekking tot de geschiktheid van de in dat lid
      bedoelde personen en hetgeen ingevolge het tweede lid van dat artikel van de wet is bepaald met betrekking tot de
      vakbekwaamheid van de in dat lid bedoelde personen;

      i. gegevens op basis waarvan de Autoriteit Financiële Markten kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikel 4:10 van de wet][ref4] is bepaald met betrekking tot de betrouwbaarheid van de in dat artikel bedoelde
      personen;

      j. een beschrijving van het voorgenomen beleid met betrekking tot de integere bedrijfsuitoefening, bedoeld in
      [artikel 4:11, tweede en derde lid, van de wet][ref5];

      k. een beschrijving van de zeggenschapsstructuur, aan de hand waarvan de Autoriteit Financiële Markten kan
      beoordelen of voldaan wordt aan [artikel 4:13 van de wet][ref6]; en

      l. gegevens op basis waarvan de Autoriteit Financiële Markten kan beoordelen of voldaan wordt
      aan hetgeen ingevolge de [wet][ref7] is bepaald met betrekking tot de bedrijfsvoering, bedoeld in
      [artikel 4:15, eerste en tweede lid, van de wet][ref8].

      2 De gegevens, bedoeld in het eerste lid, onderdeel h, zijn:

      a. met betrekking tot de geschiktheid van de in [artikel 4:9, eerste lid, van de wet][ref9] bedoelde personen:

      1°. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;

      2°. een curriculum vitae;

      3°. een opgave van de relevante diploma’s;

      4°. een kopie van een geldig identiteitsbewijs; en

      5°. een opgave van referenten;

      b. met betrekking tot de vakbekwaamheid van de in [artikel 4:9, tweede lid, van de wet][ref10] bedoelde personen:
      een beschrijving van de wijze waarop deze vakbekwaamheid wordt gewaarborgd.

      3 De gegevens, bedoeld in het eerste lid, onderdeel i, zijn:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;

      b. een kopie van een geldig identiteitsbewijs;

      c. gegevens met betrekking tot de antecedenten, bedoeld in de bijlage bij dit besluit; en

      d. een opgave van referenten.

      4 Het eerste lid, onderdeel i, is niet van toepassing ten aanzien van personen wier betrouwbaarheid voor de
      toepassing van de [wet][ref11] door een toezichthouder reeds is vastgesteld.

      5 De gegevens, bedoeld in het eerste lid, onderdeel j, zijn:

      a. een beschrijving van de wijze waarop de betrouwbaarheid van de werknemers en andere natuurlijke personen
      die zich onder de verantwoordelijkheid van de adviseur rechtstreeks bezighouden met het verlenen van financiële
      diensten wordt gewaarborgd; en

      b. een beschrijving van de procedures en maatregelen met betrekking tot de omgang met en vastlegging van
      incidenten.

      6 Indien de vergunning wordt aangevraagd voor het adviseren over verzekeringen zijn de gegevens, bedoeld in het
      eerste lid, onderdeel k:

      a. de identiteit van de personen die een gekwalificeerde deelneming houden in de adviseur en een opgave van de
      omvang van de gekwalificeerde deelneming;

      b. de identiteit van personen die nauwe banden met de bemiddelaar hebben;

      c. informatie waaruit blijkt dat de gekwalificeerde deelneming of de nauwe banden geen belemmering vormen voor de
      uitoefening van het toezicht door de Autoriteit Financiële Markten.

      7 De gegevens, bedoeld in het eerste lid, onderdeel l, zijn:

      a. een beschrijving van de bedrijfsvoering die de adviseur in staat stelt te voldoen aan de bewaarplicht in verband
      met advisering; of

      b. indien hij afwijkt van de bewaarplicht: het protocol van het adviesproces.


