  - number: 3c
    text: |-
      1 De gegevens, bedoeld in [artikel 2:3i, tweede lid, van de wet][ref1] zijn:

      a. een opgave van de naam en het adres van de bewaarder;

      b. een opgave van de rechtsvorm van de bewaarder;

      c. een opgave van de statutaire zetel, statutaire naam en de handelsnaam of handelsnamen;

      d. een opgave van het nummer van inschrijving in het handelsregister;

      e. een gewaarmerkt afschrift van de statuten;

      f. een opgave van de voorgenomen bewaartaken, met name of het bewaren van de activa betrekking heeft op
      beleggingsinstellingen of icbe’s. Indien de aanvraag betrekking heeft op het bewaren van de activa voor
      beleggingsinstellingen: een opgave van het type beleggingsinstelling en de vermogenscategorieën en de regio’s
      waarin door de beleggingsinstelling wordt belegd;

      g. gegevens op basis waarvan de Autoriteit Financiële Markten kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikel 4:9 van de wet][ref2] is bepaald met betrekking tot de geschiktheid van de in dat artikel bedoelde
      personen;

      h. gegevens op basis waarvan de Autoriteit Financiële Markten kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikel 4:10 van de wet][ref3] is bepaald met betrekking tot de betrouwbaarheid van de in dat artikel bedoelde
      personen;

      i. een beschrijving van het voorgenomen beleid met betrekking tot de integere bedrijfsvoering, bedoeld in
      [artikel 4:11 van de wet][ref4];

      j. een beschrijving van de zeggenschapsstructuur, aan de hand waarvan de Autoriteit Financiële Markten kan
      beoordelen of voldaan wordt aan [artikel 4:13 van de wet][ref5];

      k. een beschrijving van de bedrijfsvoering bedoeld in het bepaalde ingevolge [artikel 4:14 van de wet][ref6]; en

      l. bescheiden waaruit blijkt dat aan het bepaalde ingevolge [artikel 3:53, eerste lid, van de wet][ref7] met
      betrekking tot het minimum eigen vermogen is voldaan.

      2 De gegevens, bedoeld in het eerste lid, onderdeel g, zijn:

      a. een opgave van de naam, geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer, emailadres en de functie;

      b. een curriculum vitae;

      c. een opgave van de relevante diploma’s;

      d. een kopie van een geldig identiteitsbewijs; en

      e. een opgave van referenten.

      3 De gegevens, bedoeld in het eerste lid, onderdeel h, zijn:

      a. een opgave van de naam, geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer, emailadres en de functie;

      b. een kopie van een geldig identiteitsbewijs; en

      c. gegevens met betrekking tot antecedenten, bedoeld in de bijlage bij dit besluit; en

      d. een opgave van referenten.

      4 Het eerste lid, onderdeel h, is niet van toepassing ten aanzien van personen wier betrouwbaarheid voor de
      toepassing van de [wet][ref8] door een toezichthouder reeds is vastgesteld.


