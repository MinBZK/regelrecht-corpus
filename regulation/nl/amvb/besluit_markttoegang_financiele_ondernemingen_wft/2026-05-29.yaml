  - number: 31e
    text: |-
      De gegevens, bedoeld in [artikel 2:54f, tweede lid, van de wet][ref1] zijn:

      a. een opgave van de naam, het adres en het telefoon- en faxnummer van de entiteit voor risico-acceptatie;

      b. een opgave van de rechtsvorm van de entiteit voor risico-acceptatie;

      c. een opgave van de statutaire zetel, de statutaire naam en de handelsnaam of handelsnamen;

      d. indien de entiteit voor risico-acceptatie is ingeschreven in het handelsregister, een opgave van het nummer
      van inschrijving;

      e. een gewaarmerkt afschrift van de statuten;

      f. de opgave van het adres van zijn zetel en dat van de vestiging van waaruit de entiteit voor risico-acceptatie
      voornemens is de diensten te verrichten;

      g. de vermelding van de bevoegdheid om in de staat van de zetel het bedrijf van entiteit voor risico-acceptatie uit
      te oefenen en in welke activiteit of activiteiten de entiteit voor risico-acceptatie bevoegd is zijn bedrijf uit
      te oefenen;

      h. de vermelding van de daadwerkelijke uitoefening van het bedrijf van entiteit voor risico-acceptatie vanuit de
      staat van de zetel;

      i. een opgave van de aard van de risico’s die de entiteit voor risico-acceptatie voornemens is te dekken.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel254f
