    text: |-
      1 Het programma van werkzaamheden, bedoeld in [artikel 18, onderdeel g][ref1], dat wordt overgelegd door degene die
      een vergunning als bedoeld in [artikel 2:36, eerste lid][ref2], of [artikel 2:40 van de wet][ref3] aanvraagt voor
      het uitoefenen van het bedrijf van levensverzekeraar, bevat voor het bijkantoor het volgende:

      a. een opgave van de aard van de overeenkomsten die de levensverzekeraar voornemens is vanuit het bijkantoor te
      sluiten;

      b. een uiteenzetting omtrent de leidende beginselen op het gebied van de herverzekering en retrocessie;

      c. een raming van het toekomstige solvabiliteitskapitaalvereiste, op basis van de te verwachten balanspositie,
      evenals de voor deze ramingen gehanteerde berekeningsmethode;

      d. een raming van het toekomstige minimumkapitaalvereiste, op basis van de te verwachten balanspositie, evenals de
      voor deze ramingen gehanteerde berekeningsmethode;

      e. bewijsstukken waaruit blijkt dat het bijkantoor voldoet aan de absolute ondergrens van het
      minimumkapitaalvereiste dat ingevolge [artikel 3:54, eerste en tweede lid][ref4], in samenhang met
      [artikel 3:53, eerste en tweede lid, van de wet][ref5] voor de betrokken branche of branches geldt,
      dan wel aan het solvabiliteitskapitaalvereiste dat ingevolge [artikel 3:59, eerste lid][ref6], in
      samenhang met [artikel 3:57, eerste tot en met derde lid, van de wet][ref7] van toepassing is indien dit
      solvabiliteitskapitaalvereiste hoger is dan de absolute ondergrens van het minimumkapitaalvereiste;

      f. een raming van de kosten voor de inrichting van de administratie en van het productienet en bewijsstukken
      waaruit blijkt dat de verzekeraar beschikt over de financiële middelen tot dekking daarvan;

      g. een uiteenzetting over de structuur van het governancesysteem;

      h. voor de eerste drie boekjaren een raming van de te verwachten balanspositie;

      i. voor de eerste drie boekjaren een raming van de financiële middelen tot dekking van de verplichtingen en tot
      dekking van het minimumkapitaalvereiste en het solvabiliteitskapitaalvereiste; en

      j. voor de eerste drie boekjaren een raming van de vermoedelijke ontvangsten en uitgaven, zowel wat de directe
      verzekering en de geaccepteerde herverzekeringen als de cessies uit hoofde van herverzekering betreft.

      2 De aanvrager voegt bij het programma van werkzaamheden de jaarrekening van elk van de laatste drie boekjaren.
      Indien sedert de oprichting van de onderneming van de aanvrager nog geen drie boekjaren zijn verstreken, behoeven
      deze jaarrekeningen slechts voor de afgesloten boekjaren te worden overgelegd.

      3 Het programma van werkzaamheden bevat tevens bewijsstukken waaruit blijkt dat de solvabiliteit van de
      levensverzekeraar voldoet aan [artikel 3:57, eerste en tweede lid, van de wet][ref8].


