      De gegevens, bedoeld in [artikel 2:36, derde lid, van de wet][ref1] zijn:

      a. het adres van de zetel van de verzekeraar en dat van de vestiging van waaruit hij voornemens is de diensten
      te verrichten;

      b. een opgave van de aard van:

      1°. indien het een levensverzekeraar betreft, de overeenkomsten die hij voornemens is te sluiten;

      2°. indien het een schadeverzekeraar betreft, de in Nederland gelegen risico’s die hij voornemens is te dekken; en

      c. gegevens waaruit de te verwachten solvabiliteit met betrekking tot het gehele door de verzekeraar uitgeoefende
      bedrijf blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel236
