  - number: '58'
    text: |-
      1 De gegevens, bedoeld in de [artikelen 2:127, tweede lid][ref1], en [2:128a, tweede lid, van de wet][ref2] zijn:

      a. naam, adres, telefoon- en faxnummer en emailadres van de beleggingsonderneming of de bank en de naam van de
      contactpersoon;

      b. een opgave van de lidstaat waar de beleggingsonderneming of de bank, bedoeld in
      [artikel 2:128a, eerste lid, van de wet][ref3], voornemens is het bijkantoor te openen of voornemens is diensten te
      verlenen door middel van een verbonden agent;

      c. een programma van werkzaamheden waarin de voorgenomen beleggingsdiensten, beleggingsactiviteiten of
      nevendiensten zijn opgenomen;

      d. een opgave van de organisatiestructuur van het bijkantoor waarbij wordt aangegeven of het bijkantoor voornemens
      is diensten te verlenen door middel van een verbonden agent en de identiteit van deze verbonden agent;

      e. indien de beleggingsonderneming of de bank het voornemen heeft diensten te verlenen door middel van een
      verbonden agent en de beleggingsonderneming in die lidstaat geen bijkantoor heeft gevestigd een beschrijving van
      het beoogde gebruik van de verbonden agent en een organisatiestructuur, met opgave van de rapportagelijnen, waarbij
      wordt aangegeven hoe de verbonden agent in de bedrijfsstructuur van de beleggingsonderneming past;

      f. een opgave van het adres in de lidstaat van ontvangst waar documenten kunnen worden opgevraagd;

      h. een opgave van de identiteit van personen die het dagelijks beleid van het bijkantoor bepalen; en

      i. een opgave van de informatie genoemd in artikel 6 van Verordening (EU) nr. 2017/2018 van de Commissie van
      29 juni 2016 ter aanvulling van [richtlijn 2014/65](32014L0065)/EU van het Europees Parlement en de Raad, houdende
      technische reguleringsnormen ter specificatie van informatie die door beleggingsondernemingen, marktexploitanten en
      kredietinstellingen moet worden verstrekt (PbEU 2017, L 155).

      2 Een beleggingsonderneming of een bank als bedoeld in [artikel 2:128a, eerste lid, van de wet][ref4] meldt
      wijzigingen met betrekking tot de onderwerpen, bedoeld in het eerste lid, met inachtneming van artikel 7
      van Verordening (EU) nr. 2017/2018 van de Commissie van 29 juni 2016 ter aanvulling van [richtlijn 2014/65]
      (32014L0065)/EU van het Europees Parlement en de Raad, houdende technische reguleringsnormen ter specificatie van
      informatie die door beleggingsondernemingen, marktexploitanten en kredietinstellingen moet worden verstrekt (PbEU
      2017, L 155).


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2127
