  - number: 56b
    text: |-
      1 Om als gelijkwaardig te worden aangemerkt, voldoet het recht, bedoeld in
      [artikel 2:67b, vierde lid, onderdeel b][ref1], aan de eisen ingevolge artikel 37, drieëntwintigste lid, van de
      richtlijn beheerders van alternatieve beleggingsinstellingen.

      2 De in [artikel 34, eerste lid, onderdeel b][ref2], bedoelde informatie mag worden beperkt tot de
      beleggingsinstellingen die de buitenlandse beheerder van een beleggingsinstelling met zetel in een staat die geen
      lidstaat is, wil beheren en tot de door deze beheerder beheerde beleggingsinstellingen die hij wil verhandelen in
      de Europese Unie.


