  - number: 57c
    text: |-
      De gegevens, bedoeld in [artikel 2:124b, tweede lid, van de wet][ref1] zijn:

      a. een opgave van de lidstaat waar de bemiddelaar in hypothecair krediet voornemens is het bijkantoor te openen;

      b. een opgave van de financiële diensten die de bemiddelaar in hypothecair krediet voornemens is te verlenen in de
      andere lidstaat;

      c. indien van toepassing, een opgave van het adres van het bijkantoor.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2124b
    url: https://wetten.overheid.nl/BWBR0020413/2026-05-29#Artikel57c
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 2:124b
  - number: 57d
    text: |-
      De gegevens, bedoeld in [artikel 2:125, tweede lid, van de wet][ref1] zijn:

      a. een opgave van de naam, het adres en het nummer van inschrijving in het openbaar register, bedoeld in
      [artikel 1:107 van de wet][ref2], van de bemiddelaar in verzekeringen;

      b. een opgave van lidstaat waar de bemiddelaar in verzekeringen voornemens is het bijkantoor te openen;

      c. de categorie waartoe de bemiddelaar in verzekeringen behoort en, in voorkomend geval de naam van elke
      verzekeraar die hij vertegenwoordigt;

      d. indien van toepassing, de relevante verzekeringsbranches;

      e. een opgave van het adres in de lidstaat van ontvangst waar documenten kunnen worden opgevraagd; en

      f. een opgave van de identiteit van de personen die het dagelijks beleid van het bijkantoor bepalen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2125
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1107
