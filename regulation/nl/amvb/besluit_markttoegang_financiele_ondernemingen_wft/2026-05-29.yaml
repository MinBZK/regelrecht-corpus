      De gegevens, bedoeld in [artikel 2:53, eerste lid, van de wet][ref1] zijn:

      a. het adres van zijn zetel en dat van de vestiging van waaruit de verzekeraar voornemens is de diensten te
      verrichten;

      b. een gewaarmerkt afschrift van de statuten;

      c. de vermelding van de bevoegdheid om in de staat van de zetel het directe bedrijf van verzekeraar uit te oefenen;

      d. de vermelding van de daadwerkelijke uitoefening van het directe bedrijf van verzekeraar vanuit de lidstaat van
      de zetel;

      e. gegevens waaruit het eigen vermogen, bedoeld in [artikel 3:53, eerste lid][ref2], en de te verwachten
      solvabiliteit als bedoeld in [artikel 3:57, eerste lid, van de wet][ref3] blijken;

      f. de naam en het privé-adres van de personen die het dagelijks beleid van de verzekeraar bepalen; en

      g. de naam en het privé-adres van de personen die het beleid van de verzekeraar bepalen of mede bepalen.


