  - number: 3a
    text: |-
      1 De gegevens, bedoeld in [artikel 2:3b, zesde lid][ref1], en [artikel 2:10b, derde lid, van de wet][ref2] zijn:

      a. een opgave van de naam, het adres en het telefoon- en faxnummer en het emailadres van de betaaldienstverlener
      of elektronischgeldinstelling;

      b. een opgave van de rechtsvorm van de betaaldienstverlener of elektronischgeldinstelling;

      c. een opgave van de statutaire zetel, de statutaire naam en de handelsnaam of handelsnamen;

      d. een opgave van het nummer van inschrijving in het handelsregister;

      e. een gewaarmerkt afschrift van de statuten;

      f. een opgave van de activiteiten die de betaaldienstverlener of elektronischgeldinstelling voornemens is te
      verrichten;

      g. een bedrijfsplan met inbegrip van een budgetprognose voor de eerste drie boekjaren waarmee wordt aangetoond
      dat de betaaldienstverlener of elektronischgeldinstelling in staat is gebruik te maken van passende en evenredige
      systemen, middelen en procedures om op een gezonde basis te opereren;

      h. een beschrijving van de interne controlemechanismen die de betaaldienstverlener of elektronischgeldinstelling
      heeft opgezet om de in de [Wet ter voorkoming van witwassen en financieren van terrorisme][ref3] en de in
      Verordening (EU) 2015/847 van het Europees Parlement en de Raad van 20 mei 2015 betreffende bij geldovermakingen
      te voegen informatie en tot intrekking van verordening (EG) nr. 1781/2006 (PbEU 2015, L 141), neergelegde
      verplichtingen in verband met het witwassen van geld en terrorismefinanciering na te komen;

      i. een beschrijving van de organisatiestructuur, met inbegrip van, voor zover van toepassing, een beschrijving
      van het voorgenomen gebruik van agenten en bijkantoren, van de minimaal jaarlijkse controles van deze agenten
      en bijkantoren, van de uitbestedingregelingen, alsmede van de deelname van de aanvrager aan een nationaal of
      internationaal betaalsysteem;

      j. een opgave van de identiteit van personen die een gekwalificeerde deelneming als bedoeld in
      [artikel 1:1 van de wet][ref4] in de betaaldienstverlener of elektronischgeldinstelling bezitten, alsmede de omvang
      van hun deelneming en het bewijs van hun geschiktheid, gelet op de noodzaak de gezonde en prudente bedrijfsvoering
      van de betaalinstelling of de elektronischgeldinstelling te garanderen;

      k. een opgave van de accountantsorganisatie of, indien van toepassing, het auditkantoor, als bedoeld in
      [artikel 1, eerste lid, onderdelen a onderscheidenlijk c, van de Wet toezicht accountantsorganisaties][ref5],
      belast met de wettelijke controle als bedoeld in artikel 2 van die richtlijn van de jaarrekening van de
      betaaldienstverlener of elektronischgeldinstelling;

      l. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of wordt voldaan aan hetgeen ingevolge
      [artikel 3:8 van de wet][ref6] is bepaald met betrekking tot de geschiktheid van de in dat artikel bedoelde
      personen;

      m. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of wordt voldaan aan hetgeen ingevolge
      [artikel 3:9 van de wet][ref7] is bepaald met betrekking tot de betrouwbaarheid van de in dat artikel bedoelde
      personen;

      n. een beschrijving van het voorgenomen beleid met betrekking tot de integere bedrijfsuitoefening, bedoeld in
      [artikel 3:10, eerste lid, van de wet][ref8];

      o. een beschrijving van de zeggenschapsstructuur aan de hand waarvan de Nederlandsche Bank kan beoordelen of
      voldaan wordt aan [artikel 3:16, eerste en tweede lid, van de wet][ref9];

      p. een beschrijving van de inrichting van de bedrijfsvoering met betrekking tot de beheerste en integere
      bedrijfsuitoefening, bedoeld in [artikel 3:17, eerste en tweede lid, van de wet][ref10];

      q. bescheiden waaruit blijkt op welke wijze wordt voldaan aan het ingevolge [artikel 3:29a, eerste lid][ref11]
      bepaalde met betrekking tot de geldmiddelen die worden of zijn ontvangen van betaaldienstgebruikers of andere
      betaaldienstverleners;

      r. bescheiden waaruit het eigen vermogen, bedoeld in [artikel 3:53, eerste lid, van de wet][ref12] en de te
      verwachten solvabiliteit, bedoeld in [artikel 3:57, eerste lid, van de wet][ref13] blijken;

      s. bescheiden waaruit blijkt op welke wijze wordt voldaan aan het ingevolge [artikel 3:29a, tweede lid][ref14],
      bepaalde met betrekking tot de geldmiddelen die worden of zijn ontvangen in ruil voor elektronisch geld dat is
      uitgegeven;

      t. een beschrijving van de procedures voor het registreren en afhandelen van veiligheidsincidenten en
      veiligheidsgerelateerde klachten van cliënten en de nabehandeling ervan, met inbegrip van een mechanisme voor
      het melden van incidenten dat rekening houdt met de kennisgevingsverplichtingen voor betaalinstellingen die zijn
      vastgelegd in hoofdstuk III van [Verordening (EU) 2022/2554](32022R2554) van het Europees Parlement en de Raad van
      14 december 2022 betreffende digitale operationele weerbaarheid voor de financiële sector en tot wijziging van de
      [Verordeningen (EG) nr. 1060/2009](32009R1060), [(EU) nr. 648/2012](32012R0648), [(EU) nr. 600/2014](32014R0600),
      [(EU) nr. 909/2014](32014R0909) en [(EU) 2016/1011](32016R1011) (PbEU 2022, L 333);

      u. een beschrijving van de procedures voor het opslaan, monitoren, traceren en beperken van de toegang tot
      gevoelige betaalgegevens;

      v. een beschrijving van de procedures ter waarborging van de bedrijfscontinuïteit, waaronder de
      bedrijfscontinuïteit op het gebied van de informatie- en communicatievoorziening, waarin de kritieke
      bedrijfsactiviteiten zijn opgenomen, met inbegrip van respons- en herstelplannen voor de informatie- en
      communicatievoorziening en een procedure om de toereikendheid en efficiëntie van deze procedures en plannen
      periodiek te toetsen en te herzien met inachtneming van [Verordening (EU) 2022/2554](32022R2554) van het Europees
      Parlement en de Raad van 14 december 2022 betreffende digitale operationele weerbaarheid voor de financiële sector
      en tot wijziging van de [Verordeningen (EG) nr. 1060/2009](32009R1060), [(EU) nr. 648/2012](32012R0648), [(EU)
      nr. 600/2014](32014R0600), [(EU) nr. 909/2014](32014R0909) en [(EU) 2016/1011](32016R1011) (PbEU 2022, L 333);

      w. een beschrijving van de uitgangspunten en standaarden die worden toegepast bij het verzamelen van statistische
      gegevens over prestaties, transacties en fraude;

      x. een beschrijving van het beveiligingsbeleid, met inbegrip van een gedetailleerde risicoanalyse met betrekking
      tot de aangeboden betaaldiensten, onder meer in relatie tot digitale operationele weerbaarheid als bedoeld in
      [Verordening (EU) 2022/2554](32022R2554) van het Europees Parlement en de Raad van 14 december 2022 betreffende
      digitale operationele weerbaarheid voor de financiële sector en tot wijziging van de [Verordeningen (EG)
      nr. 1060/2009](32009R1060), [(EU) nr. 648/2012](32012R0648), [(EU) nr. 600/2014](32014R0600), [(EU) nr. 909/2014]
      (32014R0909) en [(EU) 2016/1011](32016R1011) (PbEU 2022, L 333);

      y. een beschrijving van de maatregelen op het gebied van beveiliging en risicobeperking die worden genomen om de
      gebruikers van de betaaldiensten tegen de vastgestelde beveiligingsrisico’s, waaronder fraude en illegaal gebruik
      van gevoelige betaalgegevens en persoonsgegevens, te beschermen; en

      z. voor zover van toepassing, gegevens omtrent de aansprakelijkheid van een betaaldienstverlener als bedoeld in
      [artikel 24, tweede en derde lid, Besluit prudentiële regels Wft][ref15].

      2 Bij de toepassing van het eerste lid, aanhef en onderdelen i, p, q en s, geeft de betaaldienstverlener of
      elektronischgeldinstelling een beschrijving van de regelingen voor accountantscontrole en de organisatorische
      regelingen die zij heeft getroffen voor het nemen van alle redelijke maatregelen om de belangen van
      betaaldienstgebruikers of houders van elektronisch geld te beschermen en om de continuïteit en betrouwbaarheid bij
      het uitvoeren van betaaldiensten dan wel de uitgifte van elektronisch geld te garanderen.

      3 De gegevens, bedoeld in het eerste lid, onderdeel l, zijn:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer, het emailadres en de functie;

      b. een curriculum vitae;

      c. een opgave van de relevante diploma’s;

      d. een kopie van een geldig identiteitsbewijs; en

      e. een opgave van referenten.

      4 De gegevens, bedoeld in het eerste lid, onderdeel m, zijn:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer, het emailadres en de functie;

      b. een kopie van een geldig identiteitsbewijs;

      c. gegevens met betrekking tot de antecedenten, bedoeld in de bijlage bij dit besluit; en

      d. een opgave van referenten.

      5 Het eerste lid, onderdeel m, is niet van toepassing ten aanzien van personen wier betrouwbaarheid voor de
      toepassing van de wet door een toezichthouder reeds is vastgesteld.

      6 Indien de betaaldienstverlener uitsluitend betaaldiensten verleent als bedoeld onder 8 van de bijlage bij de
      richtlijn betaaldiensten, is het eerste lid, onderdelen h, j, k, q, r, s en w, niet van toepassing.


