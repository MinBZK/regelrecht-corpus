      De gegevens, bedoeld in [artikel 2:45, derde lid, van de wet][ref1] zijn:

      a. een opgave van de naam, het adres en het telefoon- en faxnummer van de verzekeraar;

      b. een opgave van de rechtsvorm van de verzekeraar;

      c. een opgave van de statutaire zetel, de statutaire naam en de handelsnaam of handelsnamen;

      d. indien de verzekeraar is ingeschreven in het handelsregister, een opgave van het nummer van inschrijving;

      e. een gewaarmerkt afschrift van de statuten;

      f. de opgave van het adres van zijn zetel en dat van de vestiging van waaruit de verzekeraar voornemens is het
      herverzekeringsbedrijf door middel van het verrichten van diensten naar Nederland uit te oefenen;

      g. de vermelding van de bevoegdheid om in de staat van de zetel het directe bedrijf en het herverzekeringsbedrijf
      uit te oefenen en in welke branches de verzekeraar bevoegd is zijn directe bedrijf uit te oefenen en in welke
      activiteit of activiteiten hij bevoegd is zijn herverzekeringsbedrijf uit te oefenen;

      h. de vermelding van de daadwerkelijke uitoefening van het directe bedrijf en het herverzekeringsbedrijf vanuit de
      staat van de zetel;

      i. gegevens waaruit de te verwachten solvabiliteit, bedoeld in [artikel 3:57, eerste lid, van de wet][ref2] met
      betrekking tot het gehele door de verzekeraar uitgeoefende bedrijf blijkt; en

      j. een opgave van de aard van de risico’s die de verzekeraar voornemens is in herverzekering te dekken.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel245
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel357
