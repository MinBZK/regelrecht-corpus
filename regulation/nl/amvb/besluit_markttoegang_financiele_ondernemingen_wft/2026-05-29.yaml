  - number: 31g
    text: |-
      Het programma van werkzaamheden, bedoeld in [artikel 31f, eerste lid, onderdeel f][ref1], dat wordt overgelegd
      door degene die een vergunning aanvraagt voor het uitoefenen van het bedrijf van premiepensioeninstelling, bevat
      het volgende:

      a. een opgave van de aard van de overeenkomsten die de premiepensioeninstelling voornemens is te sluiten;

      b. een raming van de kosten voor de inrichting van de administratie en van het productienet en bewijsstukken
      waaruit blijkt dat de premiepensioeninstelling beschikt over de financiële middelen ter dekking daarvan;

      c. een raming voor de eerste drie boekjaren van de andere dan de in onderdeel b bedoelde kosten van beheer, in het
      bijzonder van de algemene kosten en de provisies; en

      d. een raming voor de eerste drie boekjaren van de premies.


      [ref1]: https://wetten.overheid.nl/BWBR0020413#Artikel31f
