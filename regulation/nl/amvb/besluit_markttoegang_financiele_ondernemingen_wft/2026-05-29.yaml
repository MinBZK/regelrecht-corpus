  - number: 3.0b
    text: |-
      Het aantal verrichte girale betalingstransacties waarboven een vergunning als bedoeld in
      [artikel 2:3.0b, eerste lid, van de wet][ref1] is vereist, is 120 miljoen per kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel23.0b
    url: https://wetten.overheid.nl/BWBR0020413/2026-05-29#Artikel3.0b
