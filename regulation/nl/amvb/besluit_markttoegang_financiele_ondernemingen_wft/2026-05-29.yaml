      1 Het programma van werkzaamheden, bedoeld in [artikel 47, eerste lid, onderdeel c][ref1], dat wordt overgelegd
      door een schadeverzekeraar met zetel in Nederland ten behoeve van een bijkantoor in een andere lidstaat bevat het
      volgende:

      a. een opgave van de van de risico’s die de schadeverzekeraar voornemens is te dekken;

      b. een beschrijving van de inrichting van de bedrijfsvoering met betrekking tot de beheerste en integere
      bedrijfsuitoefening, bedoeld in [artikel 3:17, eerste lid][ref2], van het bijkantoor;

      c. een raming van de kosten voor de inrichting van de administratie en van het produktienet, alsmede bewijsstukken
      waaruit blijkt dat de verzekeraar beschikt over de financiële middelen tot dekking daarvan;

      d. voor het eerste boekjaar, een raming van de andere dan de in onderdeel c bedoelde kosten van beheer, in het
      bijzonder van de algemene kosten en de provisies; en

      e. voor het eerste boekjaar, een raming van de premies en van de schaden.

      2 Indien de schadeverzekeraar voornemens is risico’s behorende tot de branche Hulpverlening te dekken, bevat het
      programma van werkzaamheden voorts een opgave van de ter beschikking van de levensverzekeraar ter beschikking
      staande middelen voor het verstrekken van de overeengekomen hulp.


      [ref1]: https://wetten.overheid.nl/BWBR0020413#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel317
