      De gegevens, bedoeld in [artikel 2:32, tweede lid, van de wet][ref1] zijn:

      a. een schriftelijk bewijs waaruit blijkt dat de aanvrager is aangesloten bij het bureau, bedoeld in
      [artikel 2, zesde lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref2];

      b. een schriftelijk bewijs waaruit blijkt dat de aanvrager zich heeft gemeld bij het
      Waarborgfonds Motorverkeer teneinde te voldoen aan zijn verplichtingen jegens dat
      fonds uit hoofde van de [artikelen 24, eerste lid][ref3], [24a, eerste lid][ref4], en
      [24b, eerste, derde en achtste lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref5]; en

      c. een opgave van de naam en het adres van de schaderegelaars, bedoeld in
      [artikel 4:70, tweede lid, van de wet][ref6].


