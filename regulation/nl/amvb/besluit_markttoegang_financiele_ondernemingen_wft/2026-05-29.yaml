  - number: 3b
    text: |-
      De gegevens, bedoeld in [artikel 2:3c, eerste lid, van de wet][ref1] zijn:

      a. een opgave van de naam, het adres, het telefoon- en faxnummer en het emailadres van de betaaldienstagent;

      b. een beschrijving van de interne controlemechanismen die door de betaaldienstagent zullen worden gebruikt om de
      in de [Wet ter voorkoming van witwassen en financieren van terrorisme][ref2] geregelde verplichtingen na te komen;
      en

      c. de identiteit van de personen die het beleid van de betaaldienstagent bepalen of mede bepalen, alsmede gegevens
      waaruit blijkt dat zij betrouwbaar en geschikt zijn;

      d. de betaaldiensten die de betaaldienstagent namens de betaalinstelling verleent; en

      e. voor zover van toepassing, de unieke identificatiecode of het unieke identificatienummer van de
      betaaldienstagent.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel23c
