  - number: '43'
    text: |-
      De gegevens, bedoeld in [artikel 2:107, tweede lid, van de wet][ref1] zijn, indien het betreft een
      clearinginstelling die voornemens is haar bedrijf uit te oefenen vanuit een in een andere staat gelegen bijkantoor:

      a. een opgave van de staat waar de clearinginstelling voornemens is vanuit een bijkantoor haar bedrijf uit te
      oefenen;

      b. een opgave van het adres van het bijkantoor;

      c. een opgave van activiteiten die de clearinginstelling voornemens is vanuit het bijkantoor te verrichten;

      d. een opgave van de naam en het privé-adres van de personen die het dagelijks beleid van het bijkantoor zullen
      bepalen;

      e. een beschrijving van het voorgenomen beleid met betrekking tot de integere bedrijfsuitoefening, bedoeld in
      [artikel 3:10, eerste en tweede lid, van de wet][ref2]; en

      f. een beschrijving van de inrichting van de voorgenomen bedrijfsvoering met betrekking tot de beheerste en
      integere bedrijfsuitoefening, bedoeld in [artikel 3:17, eerste lid, van de wet][ref3].


