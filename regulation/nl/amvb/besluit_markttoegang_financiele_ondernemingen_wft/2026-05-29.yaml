      g. een beschrijving van de bedrijfsvoering van de beheerder van de icbe en, indien van toepassing, de bewaarders
      van de icbe's, bedoeld in [artikel 4:14 van de wet][ref7];

      h. een opgave van de personen die het dagelijks beleid bepalen, bedoeld in [artikel 4:39 van de wet][ref8] en de
      plaats waar zij hun werkzaamheden verrichten, bedoeld in [artikel 4:40 van de wet][ref9];

      i. de gegevens, bedoeld in artikel 7, eerste lid, onderdelen c en e, van de richtlijn instellingen voor collectieve
      belegging in effecten;

      j. indien van toepassing: de overeenkomst, bedoeld in [artikel 4:62m, tweede lid van de wet][ref10];

      k. indien van toepassing: de rechtsvorm en statutaire doelomschrijving van de bewaarders van de icbe’s, bedoeld in
      [artikel 4:44 van de wet][ref11]; en

      l. indien van toepassing:

      1°. een opgave van de omvang van een gekwalificeerde deelneming als bedoeld in [artikel 3:95 van de wet][ref12];

      2°. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of wordt voldaan aan hetgeen ingevolge
      [artikel 3:99 van de wet][ref13] is bepaald met betrekking tot de betrouwbaarheid van de aanvrager of houder
      van een verklaring van geen bezwaar die op grond van zijn gekwalificeerde deelneming het beleid van de betrokken
      onderneming zou kunnen bepalen of mede bepalen of zou bepalen of mede bepalen; en

      3°. bescheiden waaruit de financiële positie en de juridische groepsstructuur van de aanvrager of houder van een
      verklaring van geen bezwaar blijken.

      2 De gegevens, bedoeld in het eerste lid, onderdeel c, zijn:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;

      b. een curriculum vitae;

      c. een opgave van de relevante diploma’s;

      d. een kopie van een geldig identiteitsbewijs; en

      e. een opgave van referenten;

      3 De gegevens, bedoeld in het eerste lid, onderdelen d en l onder 2°, zijn:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;

      b. een kopie van een geldig identiteitsbewijs;

      c. gegevens met betrekking tot de antecedenten, bedoeld in de bijlage bij dit besluit; en

      d. een opgave van referenten.

      4 Het eerste lid, onderdelen d en l onder 2°, zijn niet van toepassing ten aanzien van personen wier
      betrouwbaarheid voor de toepassing van de [wet][ref14] door een toezichthouder reeds is vastgesteld.


