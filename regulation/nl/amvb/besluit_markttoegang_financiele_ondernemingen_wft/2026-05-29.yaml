    text: |-
      1 Het programma van werkzaamheden, bedoeld in [artikel 29, eerste lid, onderdeel f][ref1], bevat het volgende:

      a. een opgave van de aard van de overeenkomsten die de verzekeraar voornemens is te sluiten;

      b. een uiteenzetting omtrent de leidende beginselen op het gebied van de herverzekering;

      c. bewijsstukken waaruit blijkt dat het bijkantoor voldoet aan de absolute ondergrens van
      het minimumkapitaalvereiste dat ingevolge [artikel 3:55, eerste lid][ref2], in samenhang met
      [artikel 3:53, eerste en tweede lid, van de wet][ref3] voor de betrokken branche of branches geldt,
      dan wel aan het solvabiliteitskapitaalvereiste dat ingevolge [artikel 3:62, eerste lid][ref4], in
      samenhang met [artikel 3:57, eerste tot en met derde lid, van de wet][ref5] van toepassing is indien dit
      solvabiliteitskapitaalvereiste hoger is dan de absolute ondergrens van het minimumkapitaalvereiste;

      d. een raming van de kosten voor de inrichting van de administratie en van het produktienet en bewijsstukken
      waaruit blijkt dat de verzekeraar beschikt over de financiële middelen tot dekking daarvan;

      e. een raming voor de eerste drie boekjaren van de liquiditeitspositie;

      f. een gedetailleerde raming voor de eerste drie boekjaren van de vermoedelijke inkomsten en uitgaven, zowel wat
      de directe verrichtingen en de geaccepteerde herverzekeringen als de overdrachten uit hoofde van herverzekering
      betreft;

      g. een raming voor de eerste drie boekjaren van de financiële middelen tot dekking van de verplichtingen en tot
      dekking van het solvabiliteitskapitaalvereiste, bedoeld in [artikel 3:57, derde lid, van de wet][ref6]; en

      h. een mededeling waaruit blijkt of de verzekeraar ten behoeve van zijn verzekerden al dan niet tevens het
      uitvaartbedrijf uitoefent.

      2 De verzekeraar voegt bij het programma van werkzaamheden de jaarrekening van elk van de laatste drie boekjaren.
      Indien sedert de oprichting van de onderneming van de verzekeraar nog geen drie boekjaren zijn verstreken, behoeven
      deze jaarrekeningen slechts voor de afgesloten boekjaren te worden overgelegd.

      3 Het programma van werkzaamheden bevat tevens bewijsstukken waaruit blijkt dat de solvabiliteit van de verzekeraar
      met beperkte risico-omvang voldoet aan [artikel 3:57, eerste en tweede lid, van de wet][ref7].


