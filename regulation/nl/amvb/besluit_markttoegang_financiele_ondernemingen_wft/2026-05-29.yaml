  - number: 56a
    text: |-
      Samenwerkingsovereenkomsten tussen toezichthoudende instanties voldoen aan de navolgende eisen:

      a. indien het samenwerkingsovereenkomsten tussen toezichthoudende instanties als bedoeld in
      [artikel 1:13b, eerste lid, onderdeel c][ref1], betreft: de ingevolge artikel 42 van de richtlijn beheerders van
      alternatieve beleggingsinstellingen gestelde eisen;

      b. indien het samenwerkingsovereenkomsten tussen toezichthoudende instanties als bedoeld in
      [artikel 2:67b, eerste lid, onderdeel d][ref2], betreft: de ingevolge artikel 37, vijftiende lid, van de richtlijn
      beheerders van alternatieve beleggingsinstellingen vastgestelde eisen;

      c. indien het samenwerkingsovereenkomsten tussen toezichthoudende instanties als bedoeld in [artikel 2:121e][ref3],
      betreft: de ingevolge artikel 34 van de richtlijn beheerders van alternatieve beleggingsinstellingen gestelde
      eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel113b
