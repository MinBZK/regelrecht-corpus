  - number: '14'
    text: |-
      1 Het programma van werkzaamheden, bedoeld in [artikel 12, eerste lid, onderdeel f][ref1], dat wordt overgelegd
      door degene die een vergunning aanvraagt voor het uitoefenen van het bedrijf van schadeverzekeraar, bevat het
      volgende:

      a. een opgave van de aard van de risico's die de schadeverzekeraar voornemens is te dekken;

      b. een uiteenzetting omtrent de leidende beginselen op het gebied van de herverzekering en retrocessie;

      c. de kernvermogensbestanddelen die de absolute ondergrens van het minimumkapitaalvereiste vormen;

      d. een raming van de kosten voor de inrichting van de administratie en van het productienet, bewijsstukken waaruit
      blijkt dat de verzekeraar beschikt over de financiële middelen tot dekking daarvan alsmede, indien een van de te
      dekken risico’s behoort tot de branche hulpverlening, bedoeld in de Bijlage branches bij de wet, een opgave van de
      ter beschikking van de schadeverzekeraar staande middelen voor het verstrekken van de overeengekomen hulp;

      e. voor de eerste drie boekjaren een raming van de te verwachten balanspositie;

      f. voor de eerste drie boekjaren een raming van het toekomstige solvabiliteitskapitaalvereiste, op basis van de in
      onderdeel e bedoelde te verwachten balanspositie, evenals de voor deze ramingen gehanteerde berekeningsmethode;

      g. voor de eerste drie boekjaren een raming van het toekomstige minimumkapitaalvereiste, op basis van de in
      onderdeel e bedoelde te verwachten balanspositie, evenals de voor deze ramingen gehanteerde berekeningsmethode;

      h. voor de eerste drie boekjaren een raming van de financiële middelen tot dekking van de verplichtingen en tot
      dekking van het minimumkapitaalvereiste en het solvabiliteitskapitaalvereiste;

      i. voor de eerste drie boekjaren een raming van de andere dan de in onderdeel d bedoelde kosten van beheer, in het
      bijzonder van de algemene kosten en de provisies; en

      j. voor de eerste drie boekjaren een raming van de premies en van de schaden.

      2 Indien de schadeverzekeraar voornemens is risico’s behorende tot de branche Hulpverlening te dekken, bevat het
      programma van werkzaamheden voorts een opgave van de ter beschikking van de verzekeraar staande middelen voor het
      verstrekken van de overeengekomen hulp.


      [ref1]: https://wetten.overheid.nl/BWBR0020413#Artikel12
