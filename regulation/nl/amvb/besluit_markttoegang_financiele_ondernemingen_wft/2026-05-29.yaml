      [artikel 3:8 van de wet][ref2] is bepaald met betrekking tot geschiktheid van de personen die het dagelijks beleid
      van de verzekeraar bepalen;

      e. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of wordt voldaan aan hetgeen ingevolge
      [artikel 3:9 van de wet][ref3] is bepaald met betrekking tot betrouwbaarheid van de personen die het beleid van het
      bijkantoor bepalen of mede bepalen;

      f. de opgave van de naam en het adres van de vertegenwoordiger, bedoeld in
      [artikel 3:37, eerste lid, van de wet][ref4], en, zo de vertegenwoordiger rechtspersoon is, de statuten van deze
      rechtspersoon, een opgave van het nummer van inschrijving in het handelsregister en de naam en het privé-adres van
      de natuurlijke persoon, bedoeld in [artikel 3:37, derde lid, van de wet][ref5];

      g. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of wordt voldaan aan hetgeen ingevolge
      [artikel 3:8 van de wet][ref6] is bepaald met betrekking tot geschiktheid van de vertegenwoordiger,
      bedoeld in [artikel 3:37, eerste lid, van de wet][ref7], of de natuurlijke persoon, bedoeld in
      [artikel 3:37, derde lid, van de wet][ref8];

      h. de gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of wordt voldaan aan hetgeen ingevolge
      [artikel 3:9 van de wet][ref9] is bepaald met betrekking tot de betrouwbaarheid van de vertegenwoordiger,
      bedoeld in [artikel 3:37, eerste lid, van de wet][ref10] of de natuurlijke persoon, bedoeld in
      [artikel 3:37, derde lid, van de wet][ref11]; en

      i. een beschrijving van het voorgenomen beleid met betrekking tot de beheerste en integere uitoefening van het
      bedrijf als bedoeld in [artikel 3:17, eerste lid, van de wet][ref12].

      2 Indien de schadeverzekeraar voornemens is risico’s behorende tot de branche Aansprakelijkheid
      motorrijtuigen te dekken, zijn de gegevens, bedoeld in [artikel 2:115, tweede lid][ref13], voorts een
      schriftelijk bewijs waaruit blijkt dat de schadeverzekeraar is toegetreden tot het nationale bureau
      en het nationale waarborgfonds van de betrokken lidstaat die overeenkomen met het bureau, bedoeld in
      [artikel 2, zesde lid, van de Wet aansprakelijkheid motorrijtuigen][ref14] onderscheidenlijk het Waarborgfonds
      motorverkeer, bedoeld in [artikel 23, eerste lid, van die wet][ref15].

      3 De gegevens, bedoeld in het eerste lid, onderdelen d en g, zijn:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;

      b. een curriculum vitae;

      c. een opgave van de relevante diploma’s;

      d. een kopie van een geldig identiteitsbewijs; en

      e. een opgave van referenten.

      4 De gegevens bedoeld in het eerste lid, onderdelen e en h, zijn:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;

      b. een kopie van een geldig identiteitsbewijs;

      c. gegevens met betrekking tot de antecedenten, bedoeld in de bijlage bij dit besluit; en

      d. een opgave van referenten.

      5 De gegevens, bedoeld in het eerste en tweede lid, bevatten tevens een vertaling voorzover de Nederlandsche Bank
      zulks verlangt.


