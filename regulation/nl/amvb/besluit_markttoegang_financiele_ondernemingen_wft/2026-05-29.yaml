  - number: 3.0d
    text: |-
      Onze Minister kan op grond van [artikel 2:3.0g, vierde lid, van de wet][ref1] een staat aanwijzen als staat waar
      het toezicht in voldoende mate waarborgen biedt ten aanzien van de belangen die de wet beoogt te beschermen,
      indien:

      a. de in die staat geldende regels voor het uitoefenen van het bedrijf van afwikkelonderneming en het toezicht op
      de naleving daarvan gelijkwaardig zijn aan het ingevolge de wet bepaalde met betrekking tot:

      1°. geschiktheid en betrouwbaarheid;

      2°. financiële waarborgen;

      3°. bedrijfsvoering, waaronder maatregelen gericht op het bevorderen en handhaven van een integere bedrijfsvoering;
      en

      4°. waarborgen voor een adequaat toezicht op de naleving van de in die staat gestelde regels;

      b. de samenwerking tussen de Nederlandsche Bank en de Autoriteit Financiële Markten enerzijds en het bevoegde gezag
      in die staat anderzijds is gewaarborgd;

      c. voor het bevoegde gezag in die staat regels gelden die gelijkwaardig zijn aan die in
      [Hoofdstuk 1.4 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel23.0g
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Hoofdstuk1.4
