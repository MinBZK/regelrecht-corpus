    text: |-
      De gegevens, bedoeld in [artikel 2:81, vierde lid, van de wet][ref1], zijn:

      a. een opgave van de naam en het adres van de verbonden bemiddelaar;

      b. een opgave van de rechtsvorm van de verbonden bemiddelaar;

      c. indien de verbonden bemiddelaar een rechtspersoon is: een opgave van de statutaire zetel, de statutaire naam en
      de handelsnaam of handelsnamen;

      d. indien de verbonden bemiddelaar is ingeschreven in het handelsregister: een opgave van het nummer van
      inschrijving;

      e. indien van toepassing: een opgave van de aansluiting bij een stelsel van zelftoezicht waarmee de Autoriteit
      Financiële Markten een convenant heeft gesloten;

      f. een opgave van de financiële dienst en het financiële product waarop deze dienst betrekking heeft;waarvoor
      bemiddelaar als verbonden bemiddelaar optreedt; en

      g. gegevens op basis waarvan de Autoriteit Financiële Markten kan beoordelen of de aanbieder volledig
      verantwoordelijk is voor de bemiddelaar als bedoeld in [artikel 2:81, tweede lid, onderdeel a, van de wet][ref2].


