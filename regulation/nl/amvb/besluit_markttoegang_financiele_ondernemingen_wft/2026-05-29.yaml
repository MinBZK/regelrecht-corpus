  - number: 57e
    text: |-
      De gegevens, bedoeld in [artikel 2:125a, tweede lid, van de wet][ref1] zijn:

      a. een opgave van de naam, het adres en het nummer van inschrijving in het openbaar register, bedoeld in
      [artikel 1:107 van de wet][ref2], van de bemiddelaar in verzekeringen;

      b. een opgave van de lidstaat waar de bemiddelaar in verzekeringen voornemens is door middel van het verrichten van
      diensten te bemiddelen in verzekeringen;

      c. de categorie waartoe de bemiddelaar in verzekeringen behoort en, in voorkomend geval de naam van elke
      verzekeraar die hij vertegenwoordigt;

      d. indien van toepassing, de relevante verzekeringsbranches.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2125a
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1107
