  - number: 11b
    text: |-
      Het programma van werkzaamheden, bedoeld in [artikel 11a, eerste lid, onderdeel f][ref1], dat wordt overgelegd door
      degene die een vergunning aanvraagt voor het uitoefenen van het bedrijf van herverzekeraar, bevat het volgende:

      a. een opgave van de aard van de risico’s die de herverzekeraar voornemens is te dekken of van de aard van de
      overeenkomsten die de herverzekeraar voornemens is te sluiten;

      b. de aard van de herverzekeringsregelingen die de herverzekeraar voornemens is met de cederende verzekeraars te
      treffen;

      c. een uiteenzetting omtrent de leidende beginselen op het gebied van het sluiten van overeenkomsten waarbij de
      herverzekeraar een gedeelte van het door hem herverzekerde risico, tegen betaling van premie, op zijn beurt aan een
      andere verzekeraar overdraagt;

      d. de kernvermogensbestanddelen die de absolute ondergrens vormen van het minimumkapitaalvereiste dat ingevolge
      [artikel 3:53, eerste en vierde lid, van de wet][ref2] voor de betrokken activiteit of activiteiten geldt;

      e. een raming van de kosten voor de inrichting van de administratie en van het productienet en bewijsstukken
      waaruit blijkt dat de herverzekeraar beschikt over de financiële middelen tot dekking daarvan;

      f. voor de eerste drie boekjaren een raming van de te verwachten balanspositie;

      g. voor de eerste drie boekjaren een raming van het toekomstige solvabiliteitskapitaalvereiste, op basis van de in
      onderdeel f bedoelde te verwachten balanspositie, evenals de voor deze ramingen gehanteerde berekeningsmethode;

      h. voor de eerste drie boekjaren een raming van het toekomstige minimumkapitaalvereiste, op basis van de in
      onderdeel f bedoelde te verwachten balanspositie, evenals de voor deze ramingen gehanteerde berekeningsmethode;

      i. voor de eerste drie boekjaren een raming van de financiële middelen tot dekking van de verplichtingen en tot
      dekking van het minimumkapitaalvereiste en het solvabiliteitskapitaalvereiste;

      j. voor de eerste drie boekjaren een raming van de andere dan de in onderdeel e bedoelde inrichtingskosten, in het
      bijzonder van de algemene kosten en de provisies; en

      k. voor de eerste drie boekjaren een raming van de premies en de schaden.


      [ref1]: https://wetten.overheid.nl/BWBR0020413#Artikel11a
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel353
