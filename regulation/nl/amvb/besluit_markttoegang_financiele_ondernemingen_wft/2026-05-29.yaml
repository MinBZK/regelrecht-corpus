articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop rustende bepalingen wordt verstaan onder:

        - *nauwe banden:* situatie waarin twee of meer natuurlijke of rechtspersonen verbonden zijn door: 1°. een
      deelneming, dat wil zeggen het rechtstreeks of door middel van een zeggenschapsband houden van ten minste
      20 procent van de stemrechten of het kapitaal van een rechtspersoon; 2°. een zeggenschapsband, dat wil zeggen de
      band die bestaat tussen een moederonderneming en een dochteronderneming in alle gevallen zoals bedoeld in artikel
      1, eerste en tweede lid, van de richtlijn geconsolideerde jaarrekening, of een band van dezelfde aard tussen een
      natuurlijke of rechtspersoon en een andere rechtspersoon: een dochteronderneming van een dochteronderneming wordt
      ook beschouwd als een dochteronderneming van de moederonderneming die aan het hoofd van de onderneming staat;
        - *wet:* [Wet op het financieel toezicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020413/2026-05-29#Artikel1
