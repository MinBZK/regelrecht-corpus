  - number: 33a
    text: |-
      1 De gegevens, bedoeld in [artikel 2:64c, tweede lid](onbekend), zijn:

      a. een opgave van de naam, het adres, het telefoon- en faxnummer en het e-mailadres van de kredietservicer;

      b. een opgave van de rechtsvorm van de kredietservicer;

      c. een opgave van de statutaire zetel;

      d. een gewaarmerkt afschrift van de oprichtingsakte en statuten van de kredietservicer;

      e. een opgave van de identiteit van personen die het dagelijks beleid bepalen en van de personen die een
      gekwalificeerde deelneming in de kredietservicer hebben;

      f. gegevens op basis waarvan de Autoriteit Financiële Markten kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikel 4:9 van de wet][ref1] is bepaald met betrekking tot de geschiktheid van de in dat artikel bedoelde
      personen;

      g. gegevens op basis waarvan de Autoriteit Financiële Markten kan beoordelen of voldaan wordt aan hetgeen ingevolge
      de [artikelen 4:10][ref2] en [4:81b van de wet](onbekend) is bepaald met betrekking tot de betrouwbaarheid van de
      in die artikelen bedoelde personen;

      h. gegevens op basis waarvan de Autoriteit Financiële Markten kan beoordelen of voldaan wordt aan hetgeen ingevolge
      de wet is bepaald met betrekking tot de bedrijfsvoering, bedoeld in [artikel 4:14 van de wet][ref3];

      i. een beschrijving van de zeggenschapstructuur en interne controlemechanismen als bedoeld in
      [artikel 29.0a van het Besluit Gedragstoezicht financiële ondernemingen Wft][ref4];

      j. een beschrijving van het passend beleid ter waarborging van de naleving van de regels inzake de bescherming
      en de eerlijke en zorgvuldige behandeling van kredietnemers, bedoeld in [artikel 29.0b, van het Besluit
      Gedragstoezicht financiële ondernemingen Wft](onbekend);

      k. een beschrijving van de procedures ter waarborging van de registratie en afhandeling van klachten van
      kredietnemers;

      l. in voorkomend geval, een bewijs dat de kredietservicer een afzonderlijke rekening als bedoeld in [artikel 4:81f
      van de wet](onbekend) aanhoudt bij een bank in Nederland;

      m. indien van toepassing, een afschrift van een schriftelijke uitbestedingsovereenkomst als bedoeld in artikel 12,
      eerste lid, onderdeel a, van de richtlijn kredietservicers en kredietkopers.

      2 Indien een kredietservicer in het kader van zijn bedrijfsmodel niet voornemens is gelden van kredietnemers
      te ontvangen en aan te houden op een rekening als bedoeld in [artikel 4:81f, eerste lid, van de wet](onbekend),
      vermeldt hij dit in zijn vergunningaanvraag.


