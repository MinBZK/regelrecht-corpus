  - number: '18'
    text: |-
      1 De gegevens, bedoeld in [artikel 2:37, tweede lid][ref1], en [2:41, tweede lid, van de wet][ref2] zijn:

      a. een opgave van de naam, het adres en het telefoon- en faxnummer van de verzekeraar;

      b. een opgave van de rechtsvorm van de verzekeraar;

      c. een opgave van de statutaire zetel, de statutaire naam en de handelsnaam of handelsnamen;

      d. indien de verzekeraar is ingeschreven in het handelsregister, een opgave van het nummer van inschrijving;

      e. het adres van het bijkantoor;

      f. een gewaarmerkt afschrift van de statuten;

      g. een programma van werkzaamheden die de verzekeraar voornemens is te verrichten vanuit het bijkantoor;

      h. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikel 3:8 van de wet][ref3] is bepaald met betrekking tot de geschiktheid van de in dat artikel bedoelde
      personen;

      i. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikel 3:9 van de wet][ref4] is bepaald met betrekking tot de betrouwbaarheid van de in dat artikel bedoelde
      personen;

      j. een beschrijving van het voorgenomen beleid met betrekking tot de integere bedrijfsuitoefening, bedoeld in
      [artikel 3:10, eerste lid, van de wet][ref5] vanuit het bijkantoor;

      k. een beschrijving van de zeggenschapsstructuur aan de hand waarvan de Nederlandsche Bank kan beoordelen of
      voldaan wordt aan [artikel 3:16 van de wet][ref6];

      l. een beschrijving van de inrichting van de bedrijfsvoering met betrekking tot de beheerste en integere
      bedrijfsuitoefening, bedoeld in [artikel 3:17, eerste lid, van de wet][ref7] vanuit het bijkantoor;

      m. de vermelding van de bevoegdheid tot uitoefening van het bedrijf van verzekeraar;

      n. een opgave van de vertegenwoordiger van de verzekeraar, bedoeld in [artikel 3:47, eerste lid van de wet][ref8],
      alsook, indien de vertegenwoordiger rechtspersoon is, de statuten van deze rechtspersoon, een opgave van het nummer
      van inschrijving in het handelsregister en het bewijs van aanstelling van de natuurlijke persoon, bedoeld in het
      vijfde lid van voornoemd artikel;

      o. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of voldaan wordt aan hetgeen
      ingevolge [artikel 3:47, achtste lid, van de wet][ref9] is bepaald met betrekking tot de
      geschiktheid van de vertegenwoordiger van de verzekeraar of de natuurlijke persoon, bedoeld in
      [artikel 3:47, vijfde lid, van de wet][ref10];

      p. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of voldaan wordt aan hetgeen
      ingevolge [artikel 3:47, achtste lid, van de wet][ref11] is bepaald met betrekking tot de
      betrouwbaarheid van de vertegenwoordiger van de verzekeraar of de natuurlijke persoon, bedoeld in
      [artikel 3:47, vijfde lid, van de wet][ref12]; en

      p. bescheiden waaruit het eigen vermogen, bedoeld in [artikel 3:53, eerste lid van de wet][ref13] van het
      bijkantoor van de verzekeraar, blijkt en op basis waarvan de Nederlandsche Bank kan beoordelen of voldaan wordt
      aan hetgeen ingevolge [dat artikel][ref14] is bepaald, en waaruit de te verwachten solvabiliteit, bedoeld in
      [artikel 3:57, eerste lid, van de wet][ref15] van het bijkantoor van de verzekeraar blijkt.

      2 De gegevens, bedoeld in het eerste lid, onderdelen h en n, zijn:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;

      b. een curriculum vitae;

      c. een opgave van de relevante diploma’s;

      d. een kopie van een geldig identiteitsbewijs; en

      e. een opgave van referenten.

      3 De gegevens, bedoeld in het eerste lid, onderdelen i en o, zijn:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;

      b. een kopie van een geldig identiteitsbewijs;

      c. gegevens met betrekking tot de antecedenten, bedoeld in de bijlage bij dit besluit; en

      d. een opgave van referenten.

      4 Het eerste lid, onderdeel i en o, is niet van toepassing ten aanzien van personen wier betrouwbaarheid voor de
      toepassing van de [wet][ref16] door een toezichthouder reeds is vastgesteld.


