  - number: 31b
    text: |-
      Het programma van werkzaamheden, bedoeld in [artikel 31a, eerste lid, onderdeel e][ref1], dat wordt overgelegd door
      degene die een vergunning aanvraagt voor het uitoefenen van het bedrijf van entiteit voor risico-acceptatie, bevat
      het volgende:

      a. een opgave van de aard van de risico’s die de entiteit voor risico-acceptatie voornemens is te dekken;

      b. een uiteenzetting omtrent de leidende beginselen op het gebied van het sluiten van overeenkomsten waarbij de
      entiteit voor risico-acceptatie een gedeelte van het door hem herverzekerde risico, tegen betaling van premie, op
      zijn beurt aan een verzekeraar of andere entiteit voor risico-acceptatie overdraagt;

      c. een raming van de kosten voor de inrichting van de administratie en van het produktienet en bewijsstukken
      waaruit blijkt dat de entiteit voor risico-acceptatie beschikt over de financiële middelen ter dekking daarvan;

      d. een raming voor de eerste drie boekjaren van de andere dan de in onderdeel c bedoelde kosten van beheer, in het
      bijzonder van de algemene kosten en provisies;

      e. een raming voor de eerste drie boekjaren van de premies en van de schaden;

      f. een raming voor de eerste drie boekjaren van de liquiditeitspositie; en

      g. een raming voor de eerste drie boekjaren van de financiële middelen tot dekking van de verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020413#Artikel31a
