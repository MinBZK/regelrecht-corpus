  - number: 31h
    text: |-
      De aanvraag van instemming, bedoeld in [artikel 2:121a, tweede lid][ref1], gaat vergezeld van een opgave van:

      a. de staat waarvan de voor bedrijfspensioenvoorziening geldende sociale- en arbeidswetgeving van toepassing is op
      de rechtsverhouding tussen de bijdragende onderneming en de werknemers of op degene die een vrij beroep uitoefent;

      b. de zetel, statutaire naam en handelsnaam of handelsnamen van de bijdragende onderneming; en

      c. de voornaamste kenmerken van de pensioenregeling die voor de bijdragende onderneming zal worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2121a
