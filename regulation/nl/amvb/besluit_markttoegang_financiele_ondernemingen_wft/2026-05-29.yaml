  - number: '53'
    text: |-
      Het programma van werkzaamheden, bedoeld in [artikel 52, eerste lid, onderdeel c][ref1], dat wordt overgelegd door
      een levensverzekeraar met zetel in Nederland ten behoeve van een bijkantoor in een staat die geen lidstaat is bevat
      het volgende:

      a. de aard van de overeenkomsten van levensverzekering die door het bijkantoor zullen worden gesloten; en

      b. een beschrijving van de inrichting van de bedrijfsvoering met betrekking tot de beheerste en integere
      bedrijfsuitoefening, bedoeld in [artikel 3:17, eerste lid][ref2], van het bijkantoor.


      [ref1]: https://wetten.overheid.nl/BWBR0020413#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel317
