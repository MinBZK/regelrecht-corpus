    text: 'De gegevens, bedoeld in het eerste lid, onderdeel j, zijn:'
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel38
  - number: 38.5.a
    text: |-
      een beschrijving van de wijze waarop de betrouwbaarheid van de werknemers en andere natuurlijke personen die zich
      onder de verantwoordelijkheid van de bemiddelaar rechtstreeks bezighouden met het verlenen van financiële diensten
      wordt gewaarborgd; en
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel38
  - number: 38.5.b
    text: een beschrijving van de procedures en maatregelen met betrekking tot de omgang met en vastlegging van incidenten.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel38
  - number: '38.6'
    text: |-
      Indien de vergunning wordt aangevraagd voor het bemiddelen in verzekeringen zijn de gegevens, bedoeld in het eerste
      lid, onderdeel k:
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel38
  - number: 38.6.a
    text: |-
      de identiteit van de personen die een gekwalificeerde deelneming houden in de bemiddelaar en een opgave van de
      omvang van de gekwalificeerde deelneming;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel38
  - number: 38.6.b
    text: de identiteit van personen die nauwe banden met de bemiddelaar hebben;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel38
  - number: 38.6.c
    text: |-
      informatie waaruit blijkt dat de gekwalificeerde deelneming of de nauwe banden geen belemmering vormen voor de
      uitoefening van het toezicht door de Autoriteit Financiële Markten.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel38
  - number: '38.7'
    text: 'De gegevens, bedoeld in het eerste lid, onderdeel l, zijn:'
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel38
  - number: 38.7.a
    text: |-
      een beschrijving van de bedrijfsvoering die de bemiddelaar in staat stelt te voldoen aan de bewaarplicht in verband
      met advisering; of
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel38
  - number: 38.7.b
    text: 'indien hij afwijkt van de bewaarplicht: het protocol van het adviesproces.'
