    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel31i
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 31i.2
    text: |-
      Bij de toepassing van het eerste lid, aanhef en onderdelen h, k en l, geeft de wisselinstelling een beschrijving
      van de organisatorische regelingen die zij heeft getroffen voor het nemen van alle redelijke maatregelen om de
      belangen van degenen voor wie zij wisseltransacties verricht te beschermen en om de continuïteit en betrouwbaarheid
      bij het uitvoeren van wisseltransacties te garanderen.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel31i
  - number: 31i.3
    text: 'De gegevens, bedoeld in het eerste lid, onderdeel j, zijn:'
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel31i
  - number: 31i.3.a
    text: |-
