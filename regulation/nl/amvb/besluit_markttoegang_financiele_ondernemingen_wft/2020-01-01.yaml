  - number: 11c.4
    text: |-
      Het eerste lid, onderdeel i, is niet van toepassing ten aanzien van personen wier betrouwbaarheid voor de
      toepassing van de [wet][ref1] door een toezichthouder reeds is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel11c
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 11d.1
    text: |-
      Het programma van werkzaamheden, bedoeld in [artikel 11c, eerste lid, onderdeel g][ref1], dat wordt overgelegd
      door degene die een vergunning aanvraagt voor het uitoefenen van het bedrijf van herverzekeraar, bevat voor het
      bijkantoor het volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0020413#Artikel11c
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel11d
    references:
      - id: ref1
        bwb_id: BWBR0020413
        artikel: 11c
        hoofdstuk: '2'
        paragraaf: 2.2a
  - number: 11d.1.a
    text: |-
      een opgave van de aard van de risico’s die de herverzekeraar voornemens is te dekken of van de aard van de
      overeenkomsten die de herverzekeraar voornemens is te sluiten;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel11d
  - number: 11d.1.b
    text: |-
      een uiteenzetting omtrent de leidende beginselen op het gebied van het sluiten van overeenkomsten waarbij de
      herverzekeraar een gedeelte van het door hem herverzekerde risico, tegen betaling van premie, op zijn beurt aan een
      andere verzekeraar overdraagt;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel11d
  - number: 11d.1.c
    text: |-
      een raming van het toekomstige solvabiliteitskapitaalvereiste, op basis van de te verwachten balanspositie, evenals
      de voor deze ramingen gehanteerde berekeningsmethode;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel11d
  - number: 11d.1.d
    text: |-
      een raming van het toekomstige minimumkapitaalvereiste, op basis van de te verwachten balanspositie, evenals de
      voor deze ramingen gehanteerde berekeningsmethode;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel11d
  - number: 11d.1.e
    text: |-
      bewijsstukken waaruit blijkt dat het bijkantoor voldoet aan de absolute ondergrens van het
      minimumkapitaalvereiste dat ingevolge [artikel 3:55a, eerste lid][ref1], in samenhang met
      [artikel 3:53, eerste en vierde lid, van de wet][ref2] voor de betrokken activiteit of activiteiten
      geldt, dan wel aan het solvabiliteitskapitaalvereiste dat ingevolge [artikel 3:62, eerste lid][ref3], in
      samenhang met [artikel 3:57, eerste tot en met derde lid, van de wet][ref4] van toepassing is indien dit
      solvabiliteitskapitaalvereiste hoger is dan de absolute ondergrens van het minimumkapitaalvereiste;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel11d
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 11d.1.f
    text: |-
      een raming van de kosten voor de inrichting van de administratie en van het productienet en bewijsstukken waaruit
      blijkt dat de herverzekeraar beschikt over de financiële middelen tot dekking daarvan;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel11d
  - number: 11d.1.g
    text: een uiteenzetting over de structuur van het governancesysteem;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel11d
  - number: 11d.1.h
    text: |-
      een raming voor de eerste drie boekjaren van de andere dan de in onderdeel b bedoelde kosten van beheer, in het
      bijzonder van de algemene kosten en provisies;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel11d
  - number: 11d.1.i
    text: een raming voor de eerste drie boekjaren van de premies en van de schaden;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel11d
  - number: 11d.1.j
    text: een raming voor de eerste drie boekjaren van de liquiditeitspositie;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel11d
  - number: 11d.1.k
    text: voor de eerste drie boekjaren een raming van de te verwachten balanspositie; en
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel11d
  - number: 11d.1.l
