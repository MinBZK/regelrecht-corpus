      [artikel 4:9 van de wet][ref1] is bepaald met betrekking tot de geschiktheid van de personen die het dagelijks
      beleid bepalen en met betrekking tot de vakbekwaamheid van de werknemers en andere personen die zich onder de
      verantwoordelijkheid van de aanbieder rechtstreeks bezighouden met financiële dienstverlening;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel33
    references:
