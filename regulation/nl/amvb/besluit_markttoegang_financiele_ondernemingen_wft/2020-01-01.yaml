    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel40
  - number: '40.2'
    text: 'De gegevens, bedoeld in het eerste lid, onderdeel h, zijn:'
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel40
  - number: 40.2.a
    text: 'ten aanzien van de personen die het dagelijks beleid bepalen:'
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel40
  - number: 40.2.a.1°
    text: |-
      een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel40
  - number: 40.2.a.2°
    text: een curriculum vitae;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel40
  - number: 40.2.a.3°
    text: een opgave van de relevante diploma’s;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel40
  - number: 40.2.a.4°
    text: een kopie van een geldig identiteitsbewijs; en
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel40
  - number: 40.2.a.5°
    text: een opgave van referenten;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel40
  - number: 40.2.b
    text: |-
      ten aanzien van de werknemers en andere personen die zich onder de verantwoordelijkheid van de gevolmachtigde agent
      of ondergevolmachtigde agent rechtstreeks bezighouden met het verlenen van de financiële dienst: een beschrijving
      van de wijze waarop de vakbekwaamheid van deze personen wordt gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel40
  - number: '40.3'
    text: 'De gegevens, bedoeld in het eerste lid, onderdeel i, zijn:'
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel40
  - number: 40.3.a
    text: |-
      een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel40
  - number: 40.3.b
    text: een kopie van een geldig identiteitsbewijs;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel40
  - number: 40.3.c
    text: gegevens met betrekking tot de antecedenten, bedoeld in de bijlage bij dit besluit; en
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel40
  - number: 40.3.d
    text: een opgave van referenten.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel40
  - number: '40.4'
    text: |-
      Het eerste lid, onderdeel i, is niet van toepassing ten aanzien van personen wier betrouwbaarheid voor de
      toepassing van de [wet][ref1] door een toezichthouder reeds is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '40.5'
    text: 'De gegevens, bedoeld in het eerste lid, onderdeel j, zijn:'
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel40
  - number: 40.5.a
    text: |-
      een beschrijving van de wijze waarop de betrouwbaarheid van de werknemers en andere natuurlijke personen die zich
      onder de verantwoordelijkheid van de gevolmachtigde of ondergevolmachtigde agent rechtstreeks bezighouden met het
      verlenen van financiële diensten wordt gewaarborgd; en
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel40
  - number: 40.5.b
    text: een beschrijving van de procedures en maatregelen met betrekking tot de omgang met en vastlegging van incidenten.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel40
  - number: '40.6'
    text: 'De gegevens, bedoeld in het eerste lid, onderdeel k, zijn:'
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel40
  - number: 40.6.a
    text: |-
      de identiteit van de personen die een gekwalificeerde deelneming houden in de gevolmachtigde agent of
      ondergevolmachtigde agent en een opgave van de omvang van de gekwalificeerde deelneming;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel40
  - number: 40.6.b
    text: de identiteit van personen die nauwe banden met de gevolmachtigde agent of ondergevolmachtigde agent hebben;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel40
  - number: 40.6.c
    text: |-
      informatie waaruit blijkt dat de gekwalificeerde deelneming of de nauwe banden geen belemmering vormen voor de
      uitoefening van het toezicht door de Autoriteit Financiële Markten.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel40
  - number: '40.7'
    text: 'De gegevens, bedoeld in het eerste lid, onderdeel l, zijn:'
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel40
  - number: 40.7.a
    text: |-
      een beschrijving van de bedrijfsvoering die de gevolmachtigde agent of ondergevolmachtigde agent in staat stelt te
      voldoen aan de bewaarplicht in verband met advisering; of
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel40
  - number: 40.7.b
    text: 'indien hij afwijkt van de bewaarplicht: het protocol van het adviesproces.'
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel40
  - number: '41'
    text: |-
      De aanvraag van een vergunning als bedoeld in [artikel 2:96 van de wet][ref1], bevat de informatie, genoemd in de
      artikelen 1 tot en met 7 van Verordening (EU) nr. 2017/1943 van de Commissie van 14 juli 2016 ter aanvulling van
      [richtlijn 2014/65](32014L0065)/EU van het Europees Parlement en de Raad, houdende technische reguleringsnormen
      inzake informatie en vereisten voor de verlening van vergunningen aan beleggingsondernemingen (PbEU 2017, L 276).


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 41.0a
    text: |-
      De gegevens, bedoeld in [artikel 2:99a, derde lid, van de wet](onbekend), bevatten de informatie, genoemd in de
      artikelen 1, 2, 4 en 6 van Verordening (EU) nr. 2017/1943 van de Commissie van 14 juli 2016 ter aanvulling van
      [richtlijn 2014/65](32014L0065)/EU van het Europees Parlement en de Raad, houdende technische reguleringsnormen
      inzake informatie en vereisten voor de verlening van vergunningen aan beleggingsondernemingen (PbEU 2017, L 276),
      met dien verstande dat de informatie betrekking heeft op het in Nederland gelegen bijkantoor.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel41.0a
  - number: 41a.1
    text: |-
      De gegevens, bedoeld in [artikel 2:97, negende lid, van de wet][ref1], zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 41a.1.a
    text: een opgave van de naam en het adres van de verbonden agent;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel41a
  - number: 41a.1.b
    text: een opgave van de rechtsvorm van de verbonden agent;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel41a
  - number: 41a.1.c
    text: |-
      indien de verbonden agent een rechtspersoon is: een opgave van de statutaire zetel, de statutaire naam en de
      handelsnaam of handelsnamen;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel41a
  - number: 41a.1.d
    text: 'indien de verbonden agent is ingeschreven in het handelsregister: een opgave van het nummer van inschrijving;'
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel41a
  - number: 41a.1.e
    text: |-
      gegevens op basis waarvan de Autoriteit Financiële Markten kan beoordelen of met betrekking tot de verbonden agent
      voldaan wordt aan hetgeen ingevolge [artikel 4:9 van de wet][ref1] is bepaald met betrekking tot de geschiktheid
      van de personen die het dagelijks beleid bepalen;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 41a.1.f
    text: |-
      gegevens op basis waarvan de Autoriteit Financiële Markten kan beoordelen of met betrekking tot de verbonden
      agent voldaan wordt aan hetgeen ingevolge [artikel 4:10 van de wet][ref1] is bepaald met betrekking tot de
      betrouwbaarheid van de personen die het beleid bepalen of mede bepalen of onderdeel zijn van een orgaan dat belast
      is met toezicht op het beleid en de algemene gang van zaken;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 41a.1.g
    text: een opgave van de financiële dienst waarvoor de beleggingsonderneming als verbonden agent optreedt; en
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel41a
  - number: 41a.1.h
    text: |-
      gegevens op basis waarvan de Autoriteit Financiële Markten kan beoordelen of de beleggingsonderneming volledig
      verantwoordelijk is voor de verbonden agent als bedoeld in [artikel 2:97, vijfde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 41a.2
    text: |-
      De gegevens, bedoeld in het eerste lid, onderdeel e, zijn: ten aanzien van de personen die het dagelijks beleid
      bepalen:
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel41a
  - number: 41a.2.1°
    text: |-
      een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel41a
  - number: 41a.2.2°
    text: een curriculum vitae;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel41a
  - number: 41a.2.3°
    text: een opgave van de relevante diploma’s;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel41a
  - number: 41a.2.4°
    text: een kopie van een geldig identiteitsbewijs; en
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel41a
  - number: 41a.2.5°
    text: een opgave van referenten.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel41a
  - number: 41a.3
    text: 'De gegevens, bedoeld in het eerste lid, onderdeel f, zijn:'
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel41a
  - number: 41a.3.a
    text: |-
      een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel41a
  - number: 41a.3.b
    text: een kopie van een geldig identiteitsbewijs;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel41a
  - number: 41a.3.c
    text: gegevens met betrekking tot de antecedenten, bedoeld in de bijlage bij dit besluit; en
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel41a
  - number: 41a.3.d
    text: een opgave van referenten.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel41a
  - number: 41a.4
    text: |-
      Het eerste lid, onderdeel f, is niet van toepassing ten aanzien van personen wier betrouwbaarheid voor de
      toepassing van de wet door een toezichthouder reeds is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel41a
  - number: 41b
    text: |-
      De gegevens, bedoeld in [artikel 2:103d, tweede lid, van de wet](onbekend), bevatten de informatie, genoemd in
      de artikelen 2, 3 en 4 van Verordening (EU) nr. 2017/571 van de Commissie van 2 juni 2016 van [richtlijn 2014/65]
      (32014L0065)/EU van het Europees Parlement en de Raad, houdende technische reguleringsnormen inzake de verlening
      van vergunningen, organisatorische eisen en de publicatie van transacties voor datarapporteringsdienstverleners
      (PbEU 2017, L 126), en de informatie met betrekking tot de organisatorische eisen, genoemd in de hoofdstukken II en
      III van die verordening.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel41b
  - number: '42'
    text: |-
      Indien een vergunning als bedoeld in [artikel 2:105, eerste lid, van de wet][ref1], wordt aangevraagd, worden,
      onverminderd de in dat lid genoemde artikelen, de volgende gegevens overgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 42.a
    text: |-
      gegevens waaruit de aansluiting bij de rechtspersoon, bedoeld in [artikel 2:105, eerste lid, van de wet][ref1]
      blijkt;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 42.b
    text: |-
      gegevens waaruit blijkt dat de rechtspersoon beschikt over voldoende bevoegdheden jegens de aangesloten
      ondernemingen om een handelen van een zodanige instelling in strijd met het ingevolge de [wet][ref1] bepaalde tegen
      te gaan en door de toezichthouder gegeven aanwijzing op te laten volgen;


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 42.c
    text: |-
      gegevens waaruit blijkt dat de rechtspersoon beschikt over voldoende mogelijkheden tot deskundige ondersteuning van
      de aangesloten ondernemingen; en
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42
  - number: 42.d
    text: |-
      gegevens waaruit blijkt dat de rechtspersoon gemachtigd is de aangesloten ondernemingen bij de aanvraag en
      ook overigens voor de toepassing van de in [artikel 2:105, lid 3, van de wet][ref1] genoemde afdelingen van de
      [wet][ref2] te vertegenwoordigen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020368
  - number: 42.0a
    text: |-
      De gegevens, bedoeld in [artikel 2:106.0a, tweede lid, van de wet][ref1] zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42.0a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 42.0a.a
    text: de staat waar de afwikkelonderneming voornemens is vanuit een bijkantoor haar bedrijf uit te oefenen;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42.0a
  - number: 42.0a.b
    text: de naam, het adres, het telefoon- en faxnummer en het emailadres van de betaalinstelling;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42.0a
  - number: 42.0a.c
    text: |-
      een opgave van de werkzaamheden, genoemd in de definitie van «afwikkeldiensten» in [artikel 1:1 van de wet][ref1],
      die de afwikkelonderneming voornemens is vanuit het bijkantoor te verrichten;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42.0a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 42.0a.d
    text: |-
      een beschrijving van het voorgenomen beleid met betrekking tot de integere bedrijfsuitoefening, bedoeld in
      [artikel 3:10, eerste en tweede lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42.0a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 42.0a.f
    text: |-
      een beschrijving van de inrichting van de voorgenomen bedrijfsvoering met betrekking tot de beheerste en integere
      bedrijfsuitoefening, bedoeld in [artikel 3:17, eerste lid, van de wet][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42.0a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 42.0a.g
    text: gegevens op grond waarvan de Nederlandsche Bank kan beoordelen of de financiële positie toereikend is.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42.0a
  - number: 42a
    text: |-
      De gegevens, bedoeld in [artikel 2:106a, tweede lid, van de wet][ref1] zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 42a.a
    text: |-
      indien de betaalinstelling voornemens is door middel van het verrichten van diensten haar bedrijf naar een andere
      lidstaat uit te oefenen:
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42a
  - number: 42a.a.1°
    text: |-
      de naam, het adres, het telefoon- en faxnummer, het e-mailadres en, voor zover van toepassing, het
      vergunningsnummer van de betaalinstelling;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42a
  - number: 42a.a.2°
    text: een beschrijving van de organisatiestructuur van de betaalinstelling;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42a
  - number: 42a.a.3°
    text: de lidstaat of lidstaten waarin zij voornemens is haar werkzaamheden uit te oefenen; en
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42a
  - number: 42a.a.4°
    text: |-
      een beschrijving van de aard van de betaaldiensten die de betaalinstelling voornemens is te verlenen in de andere
      lidstaat;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42a
  - number: 42a.b
    text: |-
      indien de betaalinstelling voornemens is in een andere lidstaat betaaldiensten aan te bieden vanuit een in die
      lidstaat gelegen bijkantoor:
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42a
  - number: 42a.b.1°
    text: de naam, het adres, het telefoon- en faxnummer en het emailadres van het bijkantoor;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42a
  - number: 42a.b.2°
    text: een beschrijving van de organisatiestructuur van het bijkantoor;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42a
  - number: 42a.b.3°
    text: |-
      een beschrijving van de aard van de betaaldiensten die de betaalinstelling voornemens is te verlenen vanuit het
      bijkantoor;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42a
  - number: 42a.b.4°
    text: de identiteit van de personen die het dagelijks beleid van het bijkantoor zullen bepalen;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42a
  - number: 42a.b.5°
    text: |-
      een bedrijfsplan met een budgetprognose voor de eerste drie boekjaren waarmee wordt aangetoond dat de aanvrager in
      staat is gebruik te maken van passende en evenredige systemen, middelen en procedures om op een gezonde basis ter
      opereren; en
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42a
  - number: 42a.b.6°
    text: |-
      een beschrijving van de regelingen op het gebied van bestuur en de mechanismen voor interne controle die de
      aanvrager heeft ingesteld, waaronder de administratieve en boekhoudkundige procedures van de procedures voor
      risicobeheersing, waaruit blijkt dat die bestuursregelingen, controlemechanismen en procedures evenredig, passend,
      degelijk en adequaat zijn;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42a
  - number: 42a.c
    text: |-
      indien de betaalinstelling voornemens is betaaldiensten te verlenen in een andere lidstaat door tussenkomst van een
      in die lidstaat gevestigde betaaldienstagent:
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42a
  - number: 42a.c.1°
    text: een opgave van de naam, het adres, het telefoon- en faxnummer en het emailadres van de betaaldienstagent;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42a
  - number: 42a.c.2°
    text: |-
      een beschrijving van de interne controlemechanismen die door de betaaldienstagent zullen worden gebruikt om de in
      de [Wet ter voorkoming van witwassen en financieren van terrorisme][ref1] neergelegde verplichtingen na te komen;
      en


      [ref1]: https://wetten.overheid.nl/BWBR0024282
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0024282
  - number: 42a.c.3°
    text: |-
      de identiteit van de personen die het beleid van de betaaldienstagent bepalen of mede bepalen, alsmede gegevens
      waaruit blijkt dat zij betrouwbaar en geschikt zijn;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42a
  - number: 42a.c.4°
    text: de betaaldiensten die de betaaldienstagent namens de betaalinstelling verleent; en
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42a
  - number: 42a.c.5°
    text: voor zover van toepassing, de unieke identificatiecode of het unieke identificatienummer van de betaaldienstagent.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42a
  - number: 42b
    text: |-
      De gegevens bedoeld in [artikel 2:107a, derde lid, van de wet][ref1] zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
