    text: artikel 7, derde lid, onderdelen a en b, van de richtlijn beheerders van alternatieve beleggingsinstellingen.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel34a
  - number: 34a.2
    text: |-
