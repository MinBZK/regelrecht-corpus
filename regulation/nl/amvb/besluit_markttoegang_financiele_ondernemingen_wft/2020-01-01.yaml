    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel38
  - number: 38.3.d
    text: een opgave van referenten.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel38
  - number: '38.4'
    text: |-
      Het eerste lid, onderdeel i, is niet van toepassing ten aanzien van personen wier betrouwbaarheid voor de
      toepassing van de [wet][ref1] door een toezichthouder reeds is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0020368
