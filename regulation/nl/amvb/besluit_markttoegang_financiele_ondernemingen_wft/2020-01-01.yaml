  - number: 23.1.f
    text: |-
      een raming van de kosten voor de inrichting van de administratie en van het productienet en bewijsstukken waaruit
      blijkt dat de verzekeraar beschikt over de financiële middelen tot dekking daarvan, alsmede, indien een van de te
      dekken risico’s behoort tot de branche Hulpverlening, een opgave van de ter beschikking van de schadeverzekeraar
      staande middelen voor het verstrekken van de overeengekomen hulp;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel23
  - number: 23.1.g
    text: een uiteenzetting over de structuur van het governancesysteem;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel23
