      [ref1]: https://wetten.overheid.nl/BWBR0024282
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42b
    references:
      - id: ref1
        bwb_id: BWBR0024282
  - number: 42b.c.3°
    text: |-
      de identiteit van de personen die het dagelijks beleid van de betaaldienstagent bepalen of mede bepalen, alsmede
      gegevens waaruit blijkt dat zij betrouwbaar en geschikt zijn;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42b
