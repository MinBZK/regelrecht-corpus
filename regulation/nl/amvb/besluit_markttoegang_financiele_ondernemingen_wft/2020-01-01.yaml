  - number: 3.0c.4
    text: |-
      Het eerste lid, onderdeel g, is niet van toepassing ten aanzien van personen wier betrouwbaarheid voor de
      toepassing van de wet door een toezichthouder reeds is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel3.0c
  - number: 3.0d
    text: |-
      Onze Minister kan op grond van [artikel 2:3.0g, vierde lid, van de wet][ref1] een staat aanwijzen als staat waar
      het toezicht in voldoende mate waarborgen biedt ten aanzien van de belangen die de wet beoogt te beschermen,
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel3.0d
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 3.0d.a
    text: |-
      de in die staat geldende regels voor het uitoefenen van het bedrijf van afwikkelonderneming en het toezicht op de
      naleving daarvan gelijkwaardig zijn aan het ingevolge de wet bepaalde met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel3.0d
  - number: 3.0d.a.1°
    text: geschiktheid en betrouwbaarheid;
