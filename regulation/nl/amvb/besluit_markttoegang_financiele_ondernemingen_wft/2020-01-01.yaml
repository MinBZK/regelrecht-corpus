  - number: 12.2.e
    text: een opgave van referenten.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel12
  - number: '12.3'
    text: 'De gegevens, bedoeld in het eerste lid, onderdeel h, zijn:'
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel12
  - number: 12.3.a
    text: |-
      een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel12
  - number: 12.3.b
    text: een kopie van een geldig identiteitsbewijs;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel12
  - number: 12.3.c
    text: gegevens met betrekking tot de antecedenten, bedoeld in de bijlage bij dit besluit; en
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel12
  - number: 12.3.d
    text: een opgave van referenten.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel12
  - number: '12.4'
    text: |-
      Het eerste lid, onderdelen h en m, onder 2°, is niet van toepassing ten aanzien van personen wier betrouwbaarheid
      voor de toepassing van de [wet][ref1] door een toezichthouder reeds is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '13'
    text: |-
      Het programma van werkzaamheden, bedoeld in [artikel 12, eerste lid, onderdeel f][ref1], dat wordt overgelegd door
      degene die een vergunning aanvraagt voor het uitoefenen van het bedrijf van levensverzekeraar, bevat het volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0020413#Artikel12
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020413
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 13.a
    text: een opgave van de aard van de overeenkomsten die de levensverzekeraar voornemens is te sluiten;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel13
  - number: 13.b
    text: een uiteenzetting omtrent de leidende beginselen op het gebied van de herverzekering en retrocessie;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel13
  - number: 13.c
    text: de kernvermogensbestanddelen die de absolute ondergrens van het minimumkapitaalvereiste vormen;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel13
  - number: 13.d
    text: |-
      een raming van de kosten voor de inrichting van de administratie en van het productienet en bewijsstukken waaruit
      blijkt dat de verzekeraar beschikt over de financiële middelen tot dekking daarvan;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel13
  - number: 13.e
    text: voor de eerste drie boekjaren een raming van de te verwachten balanspositie;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel13
  - number: 13.f
    text: |-
      voor de eerste drie boekjaren een raming van het toekomstige solvabiliteitskapitaalvereiste, op basis van de in
      onderdeel e bedoelde te verwachten balanspositie, evenals de voor deze ramingen gehanteerde berekeningsmethode;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel13
  - number: 13.g
    text: |-
      voor de eerste drie boekjaren een raming van het toekomstige minimumkapitaalvereiste, op basis van de in onderdeel
      e bedoelde te verwachten balanspositie, evenals de voor deze ramingen gehanteerde berekeningsmethode;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel13
  - number: 13.h
    text: |-
      voor de eerste drie boekjaren een raming van de financiële middelen tot dekking van de verplichtingen en tot
      dekking van het minimumkapitaalvereiste en het solvabiliteitskapitaalvereiste; en
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel13
  - number: 13.i
    text: |-
      voor de eerste drie boekjaren een raming van de vermoedelijke ontvangsten en uitgaven, zowel wat de directe
      verzekering en de geaccepteerde herverzekeringen als de cessies uit hoofde van herverzekering betreft.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel13
  - number: '14.1'
    text: |-
      Het programma van werkzaamheden, bedoeld in [artikel 12, eerste lid, onderdeel f][ref1], dat wordt overgelegd door
      degene die een vergunning aanvraagt voor het uitoefenen van het bedrijf van schadeverzekeraar, bevat het volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0020413#Artikel12
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0020413
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 14.1.a
    text: een opgave van de aard van de risico's die de schadeverzekeraar voornemens is te dekken;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel14
  - number: 14.1.b
    text: een uiteenzetting omtrent de leidende beginselen op het gebied van de herverzekering en retrocessie;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel14
  - number: 14.1.c
    text: de kernvermogensbestanddelen die de absolute ondergrens van het minimumkapitaalvereiste vormen;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel14
  - number: 14.1.d
    text: |-
      een raming van de kosten voor de inrichting van de administratie en van het productienet, bewijsstukken waaruit
      blijkt dat de verzekeraar beschikt over de financiële middelen tot dekking daarvan alsmede, indien een van de te
      dekken risico’s behoort tot de branche hulpverlening, bedoeld in de Bijlage branches bij de wet, een opgave van de
      ter beschikking van de schadeverzekeraar staande middelen voor het verstrekken van de overeengekomen hulp;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel14
  - number: 14.1.e
    text: voor de eerste drie boekjaren een raming van de te verwachten balanspositie;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel14
  - number: 14.1.f
    text: |-
      voor de eerste drie boekjaren een raming van het toekomstige solvabiliteitskapitaalvereiste, op basis van de in
      onderdeel e bedoelde te verwachten balanspositie, evenals de voor deze ramingen gehanteerde berekeningsmethode;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel14
  - number: 14.1.g
    text: |-
      voor de eerste drie boekjaren een raming van het toekomstige minimumkapitaalvereiste, op basis van de in onderdeel
      e bedoelde te verwachten balanspositie, evenals de voor deze ramingen gehanteerde berekeningsmethode;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel14
  - number: 14.1.h
    text: |-
      voor de eerste drie boekjaren een raming van de financiële middelen tot dekking van de verplichtingen en tot
      dekking van het minimumkapitaalvereiste en het solvabiliteitskapitaalvereiste;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel14
  - number: 14.1.i
    text: |-
      voor de eerste drie boekjaren een raming van de andere dan de in onderdeel d bedoelde kosten van beheer, in het
      bijzonder van de algemene kosten en de provisies; en
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel14
  - number: 14.1.j
    text: voor de eerste drie boekjaren een raming van de premies en van de schaden.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel14
  - number: '14.2'
    text: |-
      Indien de schadeverzekeraar voornemens is risico’s behorende tot de branche Hulpverlening te dekken, bevat het
      programma van werkzaamheden voorts een opgave van de ter beschikking van de verzekeraar staande middelen voor het
      verstrekken van de overeengekomen hulp.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel14
  - number: '15'
    text: |-
      De gegevens, bedoeld in [artikel 2:32, tweede lid, van de wet][ref1] zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 15.a
    text: |-
      een schriftelijk bewijs waaruit blijkt dat de aanvrager is aangesloten bij het bureau, bedoeld in
      [artikel 2, zesde lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel2
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '2'
  - number: 15.b
    text: |-
      een schriftelijk bewijs waaruit blijkt dat de aanvrager zich heeft gemeld bij het Waarborgfonds Motorverkeer
      teneinde te voldoen aan zijn verplichtingen jegens dat fonds uit hoofde van de [artikelen 24, eerste lid][ref1], en
      [24a, eerste lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002415#Artikel24a
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0002415
        artikel: 24a
  - number: 15.c
    text: |-
      een opgave van de naam en het adres van de schaderegelaars, bedoeld in [artikel 4:70, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '16.1'
    text: |-
      Indien de aanvrager van een vergunning voor het uitoefenen van het bedrijf van schadeverzekeraar voornemens
      is dat bedrijf uitsluitend in de branche Rechtsbijstand uit te oefenen, zijn de gegevens, bedoeld in
      [artikel 2:33, tweede lid, van de wet][ref1], afhankelijk van de keuze die de aanvrager heeft gemaakt met
      betrekking tot het voldoen aan [artikel 4:65, eerste lid, onderdeel a, b of c van de wet][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 16.1.a
    text: |-
      een beschrijving van de inrichting van de bedrijfsvoering waaruit blijkt dat de personeelsleden die zich
      bezighouden met de rechtsbijstandschaderegeling of met het geven van juridische adviezen met betrekking tot
      deze schaderegeling, niet tegelijkertijd dezelfde of soortgelijke werkzaamheden verrichten ten behoeve van een
      andere verzekeraar waarmee hij financiële, commerciële of administratieve banden heeft en die een andere branche
      uitoefent;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel16
  - number: 16.1.b
    text: |-
      een opgave van het schaderegelingskantoor, bedoeld in [artikel 4:65, eerste lid, onderdeel b van de wet][ref1];
      onderscheidenlijk


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 16.1.c
    text: |-
      een opgave van de bepaling, bedoeld in [artikel 4:65, eerste lid, onderdeel c, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '16.2'
    text: |-
      Indien de aanvrager van een vergunning voor de uitoefening van het bedrijf van schadeverzekeraar voornemens
      is dat bedrijf naast de branche Rechtsbijstand in een andere branche uit te oefenen, zijn de gegevens, bedoeld
      in [artikel 2:33, tweede lid, van de wet][ref1], afhankelijk van de keuze die de aanvrager heeft gemaakt met
      betrekking tot het voldoen aan [artikel 4:65, tweede lid, onderdeel a of b, van de wet][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 16.2.a
    text: |-
      een opgave van het schaderegelingskantoor, bedoeld in [artikel 4:65, tweede lid, onderdeel a, van de wet][ref1];
      onderscheidenlijk


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 16.2.b
    text: |-
      een opgave van de bepaling, bedoeld in [artikel 4:65, tweede lid, onderdeel b, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '16.3'
    text: |-
      Gegevens met betrekking tot het schaderegelingskantoor bevatten tevens een beschrijving van de inrichting van
      de bedrijfsvoering waaruit blijkt dat de personeelsleden en de leden van het leidinggevende orgaan die zich
      bezighouden met de rechtsbijstandschaderegeling of met het geven van juridische adviezen met betrekking tot deze
      schaderegeling, niet tezelfdertijd dezelfde of soortgelijke werkzaamheden verrichten ten behoeve van een andere
      branche van een verzekeraar waarmee het schaderegelingskantoor financiële, commerciële of administratieve banden
      heeft.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel16
  - number: '17'
    text: |-
      De gegevens, bedoeld in [artikel 2:36, derde lid, van de wet][ref1] zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 17.a
    text: |-
      het adres van de zetel van de verzekeraar en dat van de vestiging van waaruit hij voornemens is de diensten te
      verrichten;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel17
  - number: 17.b
    text: 'een opgave van de aard van:'
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel17
  - number: 17.b.1°
    text: indien het een levensverzekeraar betreft, de overeenkomsten die hij voornemens is te sluiten;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel17
  - number: 17.b.2°
    text: indien het een schadeverzekeraar betreft, de in Nederland gelegen risico’s die hij voornemens is te dekken; en
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel17
  - number: 17.c
    text: |-
      gegevens waaruit de te verwachten solvabiliteit met betrekking tot het gehele door de verzekeraar uitgeoefende
      bedrijf blijkt.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel17
  - number: '18.1'
    text: |-
      De gegevens, bedoeld in [artikel 2:37, tweede lid][ref1], en [2:41, tweede lid, van de wet][ref2] zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 18.1.a
    text: een opgave van de naam, het adres en het telefoon- en faxnummer van de verzekeraar;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel18
  - number: 18.1.b
    text: een opgave van de rechtsvorm van de verzekeraar;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel18
  - number: 18.1.c
    text: een opgave van de statutaire zetel, de statutaire naam en de handelsnaam of handelsnamen;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel18
  - number: 18.1.d
    text: indien de verzekeraar is ingeschreven in het handelsregister, een opgave van het nummer van inschrijving;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel18
  - number: 18.1.e
    text: het adres van het bijkantoor;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel18
  - number: 18.1.f
    text: een gewaarmerkt afschrift van de statuten;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel18
  - number: 18.1.g
    text: een programma van werkzaamheden die de verzekeraar voornemens is te verrichten vanuit het bijkantoor;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel18
  - number: 18.1.h
    text: |-
      gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikel 3:8 van de wet][ref1] is bepaald met betrekking tot de geschiktheid van de personen die het dagelijks
      beleid van het bijkantoor van de verzekeraar bepalen;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 18.1.i
    text: |-
      gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikel 3:9 van de wet][ref1] is bepaald met betrekking tot de betrouwbaarheid van de personen die het beleid van
      het bijkantoor van de verzekeraar bepalen of mede bepalen;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 18.1.j
    text: |-
      een beschrijving van het voorgenomen beleid met betrekking tot de integere bedrijfsuitoefening, bedoeld in
      [artikel 3:10, eerste lid, van de wet][ref1] vanuit het bijkantoor;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 18.1.k
    text: |-
      een beschrijving van de zeggenschapsstructuur aan de hand waarvan de Nederlandsche Bank kan beoordelen of voldaan
      wordt aan [artikel 3:16 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 18.1.l
    text: |-
      een beschrijving van de inrichting van de bedrijfsvoering met betrekking tot de beheerste en integere
      bedrijfsuitoefening, bedoeld in [artikel 3:17, eerste lid, van de wet][ref1] vanuit het bijkantoor;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 18.1.m
    text: de vermelding van de bevoegdheid tot uitoefening van het bedrijf van verzekeraar;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel18
  - number: 18.1.n
    text: |-
      een opgave van de vertegenwoordiger van de verzekeraar, bedoeld in [artikel 3:47, eerste lid van de wet][ref1],
      alsook, indien de vertegenwoordiger rechtspersoon is, de statuten van deze rechtspersoon, een opgave van het nummer
      van inschrijving in het handelsregister en het bewijs van aanstelling van de natuurlijke persoon, bedoeld in het
      vijfde lid van voornoemd artikel;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 18.1.o
    text: |-
      gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikel 3:47, achtste lid, van de wet][ref1] is bepaald met betrekking tot de geschiktheid van de vertegenwoordiger
      van de verzekeraar of de natuurlijke persoon, bedoeld in [artikel 3:47, vijfde lid, van de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel18
    references:
