        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 18.1.p
    text: |-
      gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of voldaan wordt aan hetgeen
      ingevolge [artikel 3:47, achtste lid, van de wet][ref1] is bepaald met betrekking tot de
      betrouwbaarheid van de vertegenwoordiger van de verzekeraar of de natuurlijke persoon, bedoeld in
      [artikel 3:47, vijfde lid, van de wet][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 18.1.p
    text: |-
      bescheiden waaruit het eigen vermogen, bedoeld in [artikel 3:53, eerste lid van de wet][ref1] van het bijkantoor
      van de verzekeraar, blijkt en op basis waarvan de Nederlandsche Bank kan beoordelen of voldaan wordt aan
      hetgeen ingevolge [dat artikel][ref2] is bepaald, en waaruit de te verwachten solvabiliteit, bedoeld in
      [artikel 3:57, eerste lid, van de wet][ref3] van het bijkantoor van de verzekeraar blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '18.2'
    text: 'De gegevens, bedoeld in het eerste lid, onderdelen h en n, zijn:'
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel18
  - number: 18.2.a
    text: |-
      een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel18
  - number: 18.2.b
    text: een curriculum vitae;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel18
  - number: 18.2.c
    text: een opgave van de relevante diploma’s;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel18
  - number: 18.2.d
    text: een kopie van een geldig identiteitsbewijs; en
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel18
  - number: 18.2.e
    text: een opgave van referenten.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel18
  - number: '18.3'
    text: 'De gegevens, bedoeld in het eerste lid, onderdelen i en o, zijn:'
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel18
  - number: 18.3.a
    text: |-
      een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel18
  - number: 18.3.b
    text: een kopie van een geldig identiteitsbewijs;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel18
  - number: 18.3.c
    text: gegevens met betrekking tot de antecedenten, bedoeld in de bijlage bij dit besluit; en
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel18
  - number: 18.3.d
    text: een opgave van referenten.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel18
  - number: '18.4'
    text: |-
      Het eerste lid, onderdeel i en o, is niet van toepassing ten aanzien van personen wier betrouwbaarheid voor de
      toepassing van de [wet][ref1] door een toezichthouder reeds is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '19'
    text: |-
      De gegevens, bedoeld in [artikel 2:39, eerste lid, van de wet][ref1] zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 19.a
    text: 'een verklaring, afgegeven door de toezichthoudende instantie van de lidstaat van de zetel:'
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel19
  - number: 19.a.1°
    text: dat de verzekeraar beschikt over het solvabiliteitskapitaalvereiste;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel19
  - number: 19.a.2°
    text: |-
      dat de door haar aan de verzekeraar verleende vergunning hem toestaat vanuit de staat van het bijkantoor diensten
      te verrichten; en
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel19
  - number: 19.a.3°
    text: waarin de branches zijn vermeld waarvoor de verzekeraar in de lidstaat van de zetel een vergunning heeft; en
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel19
  - number: 19.b
    text: 'een opgave van de aard van:'
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel19
  - number: 19.b.1°
    text: indien het een levensverzekeraar betreft, de overeenkomsten die hij voornemens is te sluiten; en
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel19
  - number: 19.b.2°
    text: indien het een schadeverzekeraar betreft, de in Nederland gelegen risico’s die hij voornemens is te dekken.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel19
  - number: '20'
    text: |-
      De gegevens, bedoeld in [artikel 2:42, tweede lid, van de wet][ref1] zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 20.a
    text: |-
      een schriftelijk bewijs waaruit blijkt dat de aanvrager is aangesloten bij het bureau, bedoeld in
      [artikel 2, zesde lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel2
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '2'
  - number: 20.b
    text: |-
      een schriftelijk bewijs waaruit blijkt dat de aanvrager zich heeft gemeld bij het Waarborgfonds Motorverkeer
      teneinde te voldoen aan zijn verplichtingen jegens dat fonds uit hoofde van de [artikelen 24, eerste lid][ref1], en
      [24a, eerste lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002415#Artikel24a
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0002415
        artikel: 24a
  - number: 20.c
    text: |-
      een opgave van de naam en het adres van de schaderegelaars, bedoeld in [artikel 4:70, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '21.1'
    text: |-
      Indien de aanvrager van een vergunning voor het uitoefenen van het bedrijf van schadeverzekeraar voornemens
      is dat bedrijf uitsluitend in de branche Rechtsbijstand uit te oefenen, zijn de gegevens, bedoeld in
      [artikel 2:43, tweede lid, van de wet][ref1], afhankelijk van de keuze die de aanvrager heeft gemaakt met
      betrekking tot het voldoen aan [artikel 4:65, eerste lid, onderdeel a, b of c van de wet][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 21.1.a
    text: |-
      een beschrijving van de inrichting van de bedrijfsvoering waaruit blijkt dat de personeelsleden die zich
      bezighouden met de rechtsbijstandschaderegeling of met het geven van juridische adviezen met betrekking tot
      deze schaderegeling, niet tegelijkertijd dezelfde of soortgelijke werkzaamheden verrichten ten behoeve van een
      andere verzekeraar waarmee hij financiële, commerciële of administratieve banden heeft en die een andere branche
      uitoefent;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel21
  - number: 21.1.b
    text: |-
      een opgave van het schaderegelingskantoor, bedoeld in [artikel 4:65, eerste lid, onderdeel b van de wet][ref1];
      onderscheidenlijk


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 21.1.c
    text: |-
      een opgave van de bepaling als bedoeld in [artikel 4:65, eerste lid, onderdeel c, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '21.2'
    text: |-
      Indien de aanvrager van een vergunning voor het uitoefenen van het bedrijf van schadeverzekeraar voornemens is
      dat bedrijf naast de branche Rechtsbijstand in een andere branche uit te oefenen, zijn de gegevens, bedoeld in
      [artikel 2:43, tweede lid van de wet][ref1], afhankelijk van de keuze die de aanvrager heeft gemaakt met betrekking
      tot het voldoen aan [artikel 4:65, tweede lid, onderdeel a of b, van de wet][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 21.2.a
    text: |-
      de opgave van het schaderegelingskantoor, bedoeld in [artikel 4:65, tweede lid, onderdeel a, van de wet][ref1];
      onderscheidenlijk


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 21.2.b
    text: |-
      de vermelding van de bepaling, bedoeld in [artikel 4:65, tweede lid, onderdeel b, van de wet][ref1] in de
      overeenkomst met betrekking tot rechtsbijstanddekking.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '21.3'
    text: |-
      Gegevens met betrekking tot het schaderegelingskantoor bevatten tevens een beschrijving van de inrichting van
      de bedrijfsvoering waaruit blijkt dat de personeelsleden en de leden van het leidinggevende orgaan die zich
      bezighouden met de rechtsbijstandschaderegeling of met het geven van juridische adviezen met betrekking tot deze
      schaderegeling, niet tezelfdertijd dezelfde of soortgelijke werkzaamheden verrichten ten behoeve van een andere
      branche van een verzekeraar waarmee het schaderegelingskantoor financiële, commerciële of administratieve banden
      heeft.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel21
  - number: '22.1'
    text: |-
      Het programma van werkzaamheden, bedoeld in [artikel 18, onderdeel g][ref1], dat wordt overgelegd door degene die
      een vergunning als bedoeld in [artikel 2:36, eerste lid][ref2], of [artikel 2:40 van de wet][ref3] aanvraagt voor
      het uitoefenen van het bedrijf van levensverzekeraar, bevat voor het bijkantoor het volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0020413#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0020413
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 22.1.a
    text: |-
      een opgave van de aard van de overeenkomsten die de levensverzekeraar voornemens is vanuit het bijkantoor te
      sluiten;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel22
  - number: 22.1.b
    text: een uiteenzetting omtrent de leidende beginselen op het gebied van de herverzekering en retrocessie;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel22
  - number: 22.1.c
    text: |-
      een raming van het toekomstige solvabiliteitskapitaalvereiste, op basis van de te verwachten balanspositie, evenals
      de voor deze ramingen gehanteerde berekeningsmethode;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel22
  - number: 22.1.d
    text: |-
      een raming van het toekomstige minimumkapitaalvereiste, op basis van de te verwachten balanspositie, evenals de
      voor deze ramingen gehanteerde berekeningsmethode;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel22
  - number: 22.1.e
    text: |-
      bewijsstukken waaruit blijkt dat het bijkantoor voldoet aan de absolute ondergrens van het
      minimumkapitaalvereiste dat ingevolge [artikel 3:54, eerste en tweede lid][ref1], in samenhang met
      [artikel 3:53, eerste en tweede lid, van de wet][ref2] voor de betrokken branche of branches geldt,
      dan wel aan het solvabiliteitskapitaalvereiste dat ingevolge [artikel 3:59, eerste lid][ref3], in
      samenhang met [artikel 3:57, eerste tot en met derde lid, van de wet][ref4] van toepassing is indien dit
      solvabiliteitskapitaalvereiste hoger is dan de absolute ondergrens van het minimumkapitaalvereiste;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 22.1.f
    text: |-
      een raming van de kosten voor de inrichting van de administratie en van het productienet en bewijsstukken waaruit
      blijkt dat de verzekeraar beschikt over de financiële middelen tot dekking daarvan;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel22
  - number: 22.1.g
    text: een uiteenzetting over de structuur van het governancesysteem;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel22
  - number: 22.1.h
    text: voor de eerste drie boekjaren een raming van de te verwachten balanspositie;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel22
  - number: 22.1.i
    text: |-
      voor de eerste drie boekjaren een raming van de financiële middelen tot dekking van de verplichtingen en tot
      dekking van het minimumkapitaalvereiste en het solvabiliteitskapitaalvereiste; en
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel22
  - number: 22.1.j
    text: |-
      voor de eerste drie boekjaren een raming van de vermoedelijke ontvangsten en uitgaven, zowel wat de directe
      verzekering en de geaccepteerde herverzekeringen als de cessies uit hoofde van herverzekering betreft.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel22
  - number: '22.2'
    text: |-
      De aanvrager voegt bij het programma van werkzaamheden de jaarrekening van elk van de laatste drie boekjaren.
      Indien sedert de oprichting van de onderneming van de aanvrager nog geen drie boekjaren zijn verstreken, behoeven
      deze jaarrekeningen slechts voor de afgesloten boekjaren te worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel22
  - number: '22.3'
    text: |-
      Het programma van werkzaamheden bevat tevens bewijsstukken waaruit blijkt dat de solvabiliteit van de
      levensverzekeraar voldoet aan [artikel 3:57, eerste en tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '23.1'
    text: |-
      Het programma van werkzaamheden, bedoeld in [artikel 18, onderdeel g][ref1], dat wordt overgelegd door degene die
      een vergunning als bedoeld in [artikel 2:36, eerste lid][ref2], of [artikel 2:40, eerste lid, van de wet][ref3]
      aanvraagt voor het uitoefenen van het bedrijf van schadeverzekeraar, bevat voor het bijkantoor het volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0020413#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel23
    references:
