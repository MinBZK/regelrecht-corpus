  - number: '33.2'
    text: 'De gegevens, bedoeld in het eerste lid, onderdeel h, zijn:'
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel33
  - number: 33.2.a
    text: 'ten aanzien van de personen die het dagelijks beleid bepalen:'
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel33
  - number: 33.2.a.1°
    text: |-
      een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel33
  - number: 33.2.a.2°
    text: een curriculum vitae;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel33
  - number: 33.2.a.3°
    text: een opgave van de relevante diploma’s;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel33
  - number: 33.2.a.4°
    text: een kopie van een geldig identiteitsbewijs; en
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel33
  - number: 33.2.a.5°
    text: een opgave van referenten.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel33
  - number: 33.2.b
    text: |-
      ten aanzien van de werknemers en andere personen die zich onder de verantwoordelijkheid van de aanbieder
      rechtstreeks bezighouden met het verlenen van de financiële dienst: een beschrijving van de wijze waarop de
      vakbekwaamheid van deze personen wordt gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel33
  - number: '33.3'
    text: 'De gegevens, bedoeld in het eerste lid, onderdeel i, zijn:'
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel33
  - number: 33.3.a
    text: |-
      een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel33
  - number: 33.3.b
    text: een kopie van een geldig identiteitsbewijs;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel33
  - number: 33.3.c
    text: gegevens met betrekking tot de antecedenten, bedoeld in de bijlage bij dit besluit; en
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel33
  - number: 33.3.d
    text: een opgave van referenten.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel33
  - number: '33.4'
    text: |-
      Het eerste lid, onderdeel i, is niet van toepassing ten aanzien van personen wier betrouwbaarheid voor de
      toepassing van de [wet][ref1] door een toezichthouder reeds is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '33.5'
    text: 'De gegevens, bedoeld in het eerste lid, onderdeel j, zijn:'
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel33
  - number: 33.5.a
    text: |-
      een beschrijving van de wijze waarop de betrouwbaarheid van de werknemers en andere natuurlijke personen die zich
      onder de verantwoordelijkheid van de aanbieder rechtstreeks bezighouden met het verlenen van financiële diensten
      wordt gewaarborgd; en
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel33
  - number: 33.5.b
    text: een beschrijving van de procedures en maatregelen met betrekking tot de omgang met en vastlegging van incidenten.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel33
  - number: '33.6'
    text: 'De gegevens, bedoeld in het eerste lid, onderdeel l, zijn:'
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel33
  - number: 33.6.a
    text: |-
      een beschrijving van de bedrijfsvoering die de aanbieder in staat stelt te voldoen aan de bewaarplicht in verband
      met advisering; of
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel33
  - number: 33.6.b
    text: 'indien hij afwijkt van de bewaarplicht: het protocol van het adviesproces.'
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel33
  - number: '34.1'
    text: |-
      Onze Minister kan, ter uitvoering van [artikel 2:66, eerste lid, van de wet][ref1], een staat aanwijzen als staat
      waar het toezicht in voldoende mate waarborgen biedt ten aanzien van de belangen die de wet beoogt te beschermen
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 34.1.a
    text: |-
      de in die staat geldende regels voor het aanbieden van rechten van deelneming in een beleggingsinstelling en het
      toezicht op de naleving daarvan gelijkwaardig zijn aan het ingevolge de wet bepaalde met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel34
  - number: 34.1.a.1°
    text: geschiktheid en betrouwbaarheid;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel34
  - number: 34.1.a.2°
    text: financiële waarborgen;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel34
  - number: 34.1.a.3°
    text: bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel34
  - number: 34.1.a.4°
    text: aan de deelnemers in de beleggingsinstelling en de toezichthouder te verstrekken informatie; en
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel34
  - number: 34.1.a.5°
    text: waarborgen voor een adequaat toezicht op de naleving van de in die staat gestelde regels;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel34
  - number: 34.1.b
    text: |-
      de staat waar de beleggingsinstelling is gevestigd niet op de lijst van niet-coöperatieve landen en gebieden van de
      Financial Action Task Force of diens opvolger staat;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel34
  - number: 34.1.c
    text: |-
      de staat waar de beheerder zijn zetel heeft, met Nederland een overeenkomst heeft gesloten die informatie-
      uitwisseling waarborgt overeenkomstig de normen van artikel 26 van het OESO-Modelverdrag inzake belasting;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel34
  - number: 34.1.d
    text: |-
      de samenwerking tussen de toezichthouder en het bevoegde gezag in die staat is gewaarborgd door middel van een
      samenwerkingsovereenkomst die ten minste een efficiënte informatie-uitwisseling waarborgt en die de toezichthouder
      in staat stelt haar toezichthoudende taken op grond van de wet uit te voeren; en
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel34
  - number: 34.1.e
    text: |-
      voor het bevoegde gezag in die staat regels gelden die gelijkwaardig zijn aan de bepalingen van
      [hoofdstuk 1.4 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Hoofdstuk1.4
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0020368
        hoofdstuk: '1.4'
  - number: '34.2'
    text: |-
      De samenwerkingsovereenkomst tussen de toezichthouder en het bevoegde gezag, bedoeld in het eerste lid, onderdeel
      d, voldoet aan de ingevolge artikel 36 van de richtlijn beheerders van alternatieve beleggingsinstellingen gestelde
      eisen.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel34
  - number: 34a.1
    text: |-
      De gegevens die noodzakelijk zijn voor het doen van een volledige aanvraag als bedoeld in
      [artikel 2:67, derde lid][ref1], en [artikel 2:68, derde lid, van de wet][ref2], zijn de gegevens, bedoeld in:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
