  - number: 59.1.c
    text: een beschrijving van de maatregelen, gericht op het bevorderen en handhaven van een integere bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel59
  - number: 59.1.d
