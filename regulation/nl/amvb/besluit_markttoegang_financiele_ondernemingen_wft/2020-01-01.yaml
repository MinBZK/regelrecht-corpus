        bwb_id: BWBR0020368
        artikel: '2'
  - number: 42b.a
    text: |-
      Indien de elektronischgeldinstelling met zetel in Nederland voornemens is door middel van het verrichten van
      diensten haar bedrijf naar een andere lidstaat uit te oefenen:
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42b
  - number: 42b.a.1°
    text: |-
      de naam, het adres, het telefoon- en faxnummer, het e-mailadres en, voor zover van toepassing, het
      vergunningsnummer van de elektronischgeldinstelling;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42b
  - number: 42b.a.2°
    text: een beschrijving van de organisatiestructuur van de elektronischgeldinstelling;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42b
  - number: 42b.a.3°
    text: de lidstaat of lidstaten waarin zij voornemens is haar werkzaamheden uit te oefenen; en
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42b
  - number: 42b.a.4°
    text: |-
      een beschrijving van de aard van de diensten die de elektronischgeldinstelling voornemens is te verlenen in de
      andere lidstaat;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42b
  - number: 42b.b
    text: |-
      Indien de elektronischgeldinstelling voornemens is in een andere lidstaat haar bedrijf uit te oefenen vanuit een in
      die lidstaat gelegen bijkantoor:
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42b
  - number: 42b.b.1°
    text: de naam, het adres, het telefoon- en faxnummer en het emailadres van het bijkantoor;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42b
  - number: 42b.b.2°
    text: een beschrijving van de organisatiestructuur van de elektronischgeldinstelling;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42b
  - number: 42b.b.3°
    text: |-
      een beschrijving van de aard van de diensten die de elektronischgeldinstelling voornemens is te verlenen in de
      andere lidstaat;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42b
  - number: 42b.b.4°
    text: de identiteit van de personen die het dagelijks beleid van het bijkantoor zullen bepalen;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42b
  - number: 42b.b.5°
    text: |-
      een bedrijfsplan met een budgetprognose voor de eerste drie boekjaren waarmee wordt aangetoond dat de aanvrager in
      staat is gebruik te maken van passende en evenredige systemen, middelen en procedures om op een gezonde basis ter
      opereren; en
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42b
  - number: 42b.b.6°
    text: |-
      een beschrijving van de regelingen op het gebied van bestuur en de mechanismen voor interne controle die de
      aanvrager heeft ingesteld, waaronder de administratieve en boekhoudkundige procedures van de procedures voor
      risicobeheersing, waaruit blijkt dat die bestuursregelingen, controlemechanismen en procedures evenredig, passend,
      degelijk en adequaat zijn;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42b
  - number: 42b.c
    text: |-
