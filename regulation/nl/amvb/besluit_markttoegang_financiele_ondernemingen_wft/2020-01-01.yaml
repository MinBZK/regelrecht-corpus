    text: een opgave van de aard van de overeenkomsten die de premiepensioeninstelling voornemens is te sluiten;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel31g
  - number: 31g.b
    text: |-
      een raming van de kosten voor de inrichting van de administratie en van het productienet en bewijsstukken waaruit
      blijkt dat de premiepensioeninstelling beschikt over de financiële middelen ter dekking daarvan;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel31g
  - number: 31g.c
    text: |-
      een raming voor de eerste drie boekjaren van de andere dan de in onderdeel b bedoelde kosten van beheer, in het
      bijzonder van de algemene kosten en de provisies; en
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel31g
  - number: 31g.d
    text: een raming voor de eerste drie boekjaren van de premies.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel31g
  - number: 31h
    text: |-
      De aanvraag van instemming, bedoeld in [artikel 2:121a, tweede lid][ref1], gaat vergezeld van een opgave van:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel31h
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 31h.a
    text: |-
      de staat waarvan de voor bedrijfspensioenvoorziening geldende sociale- en arbeidswetgeving van toepassing is op de
      rechtsverhouding tussen de bijdragende onderneming en de werknemers of op degene die een vrij beroep uitoefent;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel31h
  - number: 31h.b
    text: de zetel, statutaire naam en handelsnaam of handelsnamen van de bijdragende onderneming; en
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel31h
  - number: 31h.c
    text: de voornaamste kenmerken van de pensioenregeling die voor de bijdragende onderneming zal worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel31h
