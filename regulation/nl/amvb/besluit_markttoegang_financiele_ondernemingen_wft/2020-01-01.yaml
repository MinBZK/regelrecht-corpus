      een beschrijving van de organisatiestructuur, met inbegrip van, voor zover van toepassing, een beschrijving van het
      voorgenomen gebruik van bijkantoren en van de regelingen voor uitbesteding;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel31i
