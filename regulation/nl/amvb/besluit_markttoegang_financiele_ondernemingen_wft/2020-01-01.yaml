      [artikel 2:68, derde lid ,van de wet][ref2], zijn de gegevens als bedoeld in artikel 7, tweede lid, onderdeel e, en
      derde lid, onderdeel c tot en met e, van de richtlijn beheerders van alternatieve beleggingsinstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel34a
    references:
