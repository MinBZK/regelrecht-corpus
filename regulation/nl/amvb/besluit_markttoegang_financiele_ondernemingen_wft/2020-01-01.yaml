      tussenkomst van een in die lidstaat gevestigde betaaldienstagent:
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42b
  - number: 42b.c.1°
    text: de naam, het adres, het telefoon- en faxnummer en het emailadres van de betaaldienstagent;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel42b
  - number: 42b.c.2°
    text: |-
