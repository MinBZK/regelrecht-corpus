      2016 ter aanvulling van [richtlijn 2014/65](32014L0065)/EU van het Europees Parlement en de Raad, houdende
      technische reguleringsnormen ter specificatie van informatie die door beleggingsondernemingen, marktexploitanten en
      kredietinstellingen moet worden verstrekt (PbEU 2017, L 155).
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel58
  - number: '58.2'
    text: |-
      Een beleggingsonderneming of een bank als bedoeld in [artikel 2:128a, eerste lid, van de wet][ref1] meldt
      wijzigingen met betrekking tot de onderwerpen, bedoeld in het eerste lid, met inachtneming van artikel 7
      van Verordening (EU) nr. 2017/2018 van de Commissie van 29 juni 2016 ter aanvulling van [richtlijn 2014/65]
      (32014L0065)/EU van het Europees Parlement en de Raad, houdende technische reguleringsnormen ter specificatie van
      informatie die door beleggingsondernemingen, marktexploitanten en kredietinstellingen moet worden verstrekt (PbEU
      2017, L 155).


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel58
