        bwb_id: BWBR0020368
        artikel: '2'
  - number: 34a.1.a
    text: |-
      artikel 7, tweede lid, onderdelen a tot en met d, van de richtlijn beheerders van alternatieve
      beleggingsinstellingen;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel34a
