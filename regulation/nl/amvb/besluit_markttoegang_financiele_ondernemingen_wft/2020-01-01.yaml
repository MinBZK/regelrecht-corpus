      van toepassing, het adres en de vestigingsplaats van diens bijkantoren;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel31i
  - number: 31i.1.b
    text: een opgave van de rechtsvorm van de wisselinstelling;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel31i
  - number: 31i.1.c
    text: een opgave van de statutaire zetel, de statutaire naam en de handelsnaam of handelsnamen;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel31i
  - number: 31i.1.d
    text: een opgave van het nummer van inschrijving in het handelsregister;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel31i
  - number: 31i.1.e
    text: een gewaarmerkt afschrift van de statuten;
