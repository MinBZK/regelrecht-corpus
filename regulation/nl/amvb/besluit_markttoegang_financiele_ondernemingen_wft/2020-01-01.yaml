  - number: 3.0d.a.3°
    text: bedrijfsvoering, waaronder maatregelen gericht op het bevorderen en handhaven van een integere bedrijfsvoering; en
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel3.0d
  - number: 3.0d.a.4°
    text: waarborgen voor een adequaat toezicht op de naleving van de in die staat gestelde regels;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel3.0d
  - number: 3.0d.b
    text: |-
      de samenwerking tussen de Nederlandsche Bank en de Autoriteit Financiële Markten enerzijds en het bevoegde gezag in
      die staat anderzijds is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel3.0d
