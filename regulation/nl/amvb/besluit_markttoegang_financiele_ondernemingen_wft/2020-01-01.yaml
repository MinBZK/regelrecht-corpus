      zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel58
  - number: 58.1.d
    text: |-
      een opgave van de organisatiestructuur van het bijkantoor waarbij wordt aangegeven of het bijkantoor voornemens is
      diensten te verlenen door middel van een verbonden agent en de identiteit van deze verbonden agent;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel58
  - number: 58.1.e
    text: |-
      indien de beleggingsonderneming of de bank het voornemen heeft diensten te verlenen door middel van een verbonden
      agent en de beleggingsonderneming in die lidstaat geen bijkantoor heeft gevestigd een beschrijving van het beoogde
      gebruik van de verbonden agent en een organisatiestructuur, met opgave van de rapportagelijnen, waarbij wordt
      aangegeven hoe de verbonden agent in de bedrijfsstructuur van de beleggingsonderneming past;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel58
