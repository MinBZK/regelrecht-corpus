      rechtstreeks bezighouden met het verlenen van de financiële dienst: een beschrijving van de wijze waarop de
      vakbekwaamheid van deze personen wordt gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel38
  - number: '38.3'
    text: 'De gegevens, bedoeld in het eerste lid, onderdeel i, zijn:'
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel38
  - number: 38.3.a
    text: |-
      een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel38
  - number: 38.3.b
    text: een kopie van een geldig identiteitsbewijs;
