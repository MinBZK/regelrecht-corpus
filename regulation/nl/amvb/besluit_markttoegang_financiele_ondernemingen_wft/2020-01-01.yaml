      toepassing van de wet door een toezichthouder reeds is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel31i
  - number: 31j
    text: |-
      Onze Minister kan op grond van [artikel 2:54l, tweede lid, van de wet][ref1] een staat aanwijzen als staat waar het
      toezicht in voldoende mate waarborgen biedt ten aanzien van de belangen die de wet beoogt te beschermen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel31j
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 31j.a
    text: |-
      de in die staat geldende regels voor het uitoefenen van het bedrijf van wisselinstelling en het toezicht op de
      naleving daarvan gelijkwaardig zijn aan het ingevolge de wet bepaalde met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel31j
  - number: 31j.a.1°
    text: betrouwbaarheid;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel31j
  - number: 31j.a.2°
    text: bedrijfsvoering, waaronder maatregelen gericht op het bevorderen en handhaven van een integere bedrijfsvoering; en
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel31j
  - number: 31j.a.3°
    text: waarborgen voor een adequaat toezicht op de naleving van de in die staat gestelde regels;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel31j
  - number: 31j.b
    text: de samenwerking tussen de Nederlandsche Bank en het bevoegde gezag in die staat is gewaarborgd; en
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel31j
  - number: 31j.c
    text: |-
