  - number: 31g
    text: |-
      Het programma van werkzaamheden, bedoeld in [artikel 31f, eerste lid, onderdeel f][ref1], dat wordt overgelegd
      door degene die een vergunning aanvraagt voor het uitoefenen van het bedrijf van premiepensioeninstelling, bevat
      het volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0020413#Artikel31f
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel31g
    references:
