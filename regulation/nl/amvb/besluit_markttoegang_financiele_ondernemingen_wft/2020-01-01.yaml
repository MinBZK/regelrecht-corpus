    text: voor de eerste drie boekjaren een raming van de te verwachten balanspositie;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel23
  - number: 23.1.i
    text: |-
      voor de eerste drie boekjaren een raming van de financiële middelen tot dekking van de verplichtingen en tot
      dekking van het minimumkapitaalvereiste en het solvabiliteitskapitaalvereiste;
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel23
  - number: 23.1.j
    text: |-
      voor de eerste drie boekjaren een raming van de andere dan de in onderdeel f bedoelde kosten van beheer, in het
      bijzonder van de algemene kosten en de provisies; en
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel23
  - number: 23.1.k
    text: voor de eerste drie boekjaren een raming van de premies en van de schaden.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel23
  - number: '23.2'
    text: |-
      De schadeverzekeraar voegt bij het programma van werkzaamheden de jaarrekening van elk van de laatste drie
      boekjaren. Indien sedert de oprichting van de onderneming van de schadeverzekeraar nog geen drie boekjaren zijn
      verstreken, behoeven deze jaarrekeningen slechts voor de afgesloten boekjaren te worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel23
  - number: '23.3'
    text: |-
      Het programma van werkzaamheden bevat tevens bewijsstukken waaruit blijkt dat de solvabiliteit van de
      schadeverzekeraar voldoet aan [artikel 3:57, eerste en tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel23
