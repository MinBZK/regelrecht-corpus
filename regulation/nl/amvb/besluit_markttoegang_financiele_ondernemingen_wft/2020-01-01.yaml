  - number: 31f.5
    text: |-
      Het eerste lid, onderdeel h, is niet van toepassing ten aanzien van personen wier betrouwbaarheid voor de
      toepassing van de [wet][ref1], de [Pensioenwet][ref2] of de [Wet verplichte beroepspensioenregeling][ref3] door een
      toezichthouder reeds is vastgesteld.


