  - number: 59.1.e
    text: een opgave van de identiteit van de personen die het dagelijks beleid van het bijkantoor bepalen.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel59
  - number: '59.2'
    text: |-
      De beleggingsonderneming doet de in het eerste lid bedoelde gegevens vergezeld gaan van een vertaling voorzover de
      Autoriteit Financiële Markten dat verlangt.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel59
  - number: '60'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel60
  - number: '61'
    text: 'Dit besluit wordt aangehaald als: Besluit Markttoegang financiële ondernemingen Wft.'
