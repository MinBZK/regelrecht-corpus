articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop rustende bepalingen wordt verstaan onder: - *nauwe banden:* situatie waarin twee
      of meer natuurlijke of rechtspersonen verbonden zijn door: 1°. een deelneming, dat wil zeggen het rechtstreeks
      of door middel van een zeggenschapsband houden van ten minste 20 procent van de stemrechten of het kapitaal van
      een rechtspersoon; 2°. een zeggenschapsband, dat wil zeggen de band die bestaat tussen een moederonderneming
      en een dochteronderneming in alle gevallen zoals bedoeld in artikel 1, eerste en tweede lid, van de richtlijn
      geconsolideerde jaarrekening, of een band van dezelfde aard tussen een natuurlijke of rechtspersoon en een andere
      rechtspersoon: een dochteronderneming van een dochteronderneming wordt ook beschouwd als een dochteronderneming van
      de moederonderneming die aan het hoofd van de onderneming staat;
        - *wet:* [Wet op het financieel toezicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 1a.1
    text: |-
      De dienstaanbieder die één of beide activiteiten, als bedoeld in
      [artikel 1:5a, onderdeel k, onder i en ii, van de wet][ref1] verricht, waarbij de totale waarde van de uitgevoerde
      betalingstransacties in de voorgaande twaalf maanden het bedrag van 1 miljoen euro overschrijdt, geeft daarvan
      kennis aan de Nederlandsche Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 1a.2
    text: |-
      De kennisgeving, bedoeld in het eerste lid, geschiedt onder opgave van een beschrijving van de
      aangeboden diensten, waarbij wordt gespecificeerd uit hoofde van welke uitzondering als bedoeld in
      [artikel 1:5a, onderdeel k, onder i en ii][ref1], de activiteit geacht wordt te zijn verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 1a.3
    text: |-
      De dienstaanbieder die een activiteit, als bedoeld in [artikel 1:5a, onderdeel l, van de wet][ref1] verricht, geeft
      daarvan kennis aan de Nederlandsche Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 1a.4
    text: |-
      De kennisgeving, bedoeld in het derde lid, geschiedt onder opgave van een accountantsverklaring waaruit blijkt
      dat de activiteit wordt verricht met inachtneming van de in [artikel 1:5a, onderdeel l][ref1], vastgestelde
      maximumbedragen. Deze accountantsverklaring wordt jaarlijks verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020413/2020-01-01#Artikel1a
    references:
