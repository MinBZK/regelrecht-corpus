  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Defensie van 1 februari 1993, nr. PAV2210/93002671;


    Gelet op de artikelen 125, eerste lid, en 134, eerste lid, van de Ambtenarenwet 1929;


    De Raad van State gehoord (advies van 29 maart 1993, nr. WO7.93.0062);


    Gezien het nader rapport van Onze Minister van Defensie van 16 juni 1993, nr. PAV2210/93008957;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006035/1998-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. ambtenaar

      de ambtenaar in de zin van het [Burgerlijk ambtenarenreglement defensie][ref1];

      b. bezoldigingsbesluit

      het [Bezoldigingsbesluit burgerlijke ambtenaren defensie][ref2];

      c. salaris

      salaris in de zin van het bezoldigingsbesluit of, voor de ambtenaar op wie het besluit niet van toepassing is,
      hetgeen in de op hem van toepassing zijnde bezoldigingsregeling daarmede overeenkomt;

      d. Onze Minister

      Onze Minister van Defensie;

      e. bevoegd gezag

      de bij koninklijk besluit of bij ministeriële regeling als zaodanig aangewezen autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0006040
      [ref2]: https://wetten.overheid.nl/BWBR0006038
    url: https://wetten.overheid.nl/BWBR0006035/1998-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006040
      - id: ref2
        bwb_id: BWBR0006038
  - number: '2'
    text: >-
      Aan de ambtenaar die naar het oordeel van het bevoegd gezag voor dienstdoeleinden te zijnen huize over een
      telefoonaansluiting dient te beschikken, wordt:


      a. behoudens het bepaalde onder *b*, een vergoeding toegekend van de door hem voor de privé-telefoonaansluiting
      verschuldigde aansluitings- en abonnementskosten van:


      100% van die kosten indien zijn salaris gelijk aan of lager is dan het maximumbedrag van schaal 5 van de bijlage B
      van het bezoldigingsbesluit;


      50% van die kosten indien zijn salaris hoger is dan het maximumbedrag van schaal 5, maar niet hoger dan het
      maximumbedrag van schaal 7 van voornoemde bijlage;


      b. een volledige vergoeding toegekend van de door hem voor de privé-telefoonaansluiting verschuldigde aanleg- en
      abonnementskosten van door het bevoegde gezag voor de dienst noodzakelijk geachte extra apparatuur;


      c. indien van de privé-telefoonaansluiting meer dan in incidentele gevallen gebruik wordt gemaakt voor het
      voeren van uitgaande dienstgesprekken, een vergoeding toegekend van de kosten van de met gebruikmaking van deze
      aansluiting gevoerde lokale en interlokale gesprekken ter grootte van 10%, 25% of 50% daarvan en in bijzondere
      gevallen tot een groter gedeelte, een en ander door het bevoegde gezag te bepalen aan de hand van de frequentie van
      de uitgaande dienstgesprekken;


      d. een volledige vergoeding toegekend van de kosten van de met gebruikmaking van de privé-telefoonaansluiting
      gevoerde internationale dienstgesprekken.
    url: https://wetten.overheid.nl/BWBR0006035/1998-01-01#Artikel2
  - number: '3'
    text: |-
      In de plaats van een vergoeding ingevolge het bepaalde in [artikel 2, onder ][ref1], kan aan een ambtenaar een
      volledige vergoeding worden toegekend van de kosten van de met gebruikmaking van de privé-telefoonaansluiting
      gevoerde lokale en interlokale dienstgesprekken.


      [ref1]: https://wetten.overheid.nl/BWBR0006035#Artikel2
    url: https://wetten.overheid.nl/BWBR0006035/1998-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006035
        artikel: '2'
  - number: '4'
    text: >-
      Aan de Minister en de Staatssecretaris van Defensie worden de kosten van de met gebruikmaking van de privé-
      telefoonaansluiting gevoerde lokale en interlokale gesprekken voor de helft en de internationale dienstgesprekken
      volledig vergoed.
    url: https://wetten.overheid.nl/BWBR0006035/1998-01-01#Artikel4
  - number: '5'
    text: Onze Minister is bevoegd nadere regels vast te stellen ter uitvoering van dit besluit.
    url: https://wetten.overheid.nl/BWBR0006035/1998-01-01#Artikel5
  - number: '6'
    text: >-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst en werkt terug tot en met 1 april 1993.
    url: https://wetten.overheid.nl/BWBR0006035/1998-01-01#Artikel6
  - number: '7'
    text: Dit besluit wordt aangehaald als Telefoonkostenbesluit burgerlijke ambtenaren defensie.
    url: https://wetten.overheid.nl/BWBR0006035/1998-01-01#Artikel7
