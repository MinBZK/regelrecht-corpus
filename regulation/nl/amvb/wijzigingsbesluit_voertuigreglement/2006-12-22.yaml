        artikel: 5.12.6
  - number: V
    text: |-
      1 In afwijking van [artikel 5.18.12 van het Voertuigreglement][ref1] mag in het verkeer uitsluitend binnen
      Nederland tot en met 31 december 2006, tenzij bij ministeriële regeling voor bedrijfsauto’s met in deze regeling
      nader te bepalen laadstructuren, onder daarbij vast te stellen voorwaarden een latere datum wordt vastgesteld, de
      lengte van voertuigen of samenstellen van voertuigen met inbegrip van de lading niet meer bedragen dan de lengte
      van dat voertuig of samenstel van voertuigen in onbeladen toestand, vermeerderd met 1,00 m waarbij:

      a. de lading niet meer dan 1,00 m achter het voertuig mag uitsteken;

      b. de lading niet meer dan 5,00 m achter de achterste as van het voertuig mag uitsteken;

      c. in afwijking van de [artikelen 5.3.49][ref2] en [5.12.49 van het Voertuigreglement][ref3] een stootbalk moet
      zijn aangebracht op niet meer dan 0,60 m voor de uiterste achterzijde van de uitstekende lading indien de afstand
      van de onderzijde van de lading tot het wegdek meer bedraagt dan 0,55 m;

      d. de lading niet voor het voertuig mag uitsteken;

      e. het zicht op de verlichting, de reflectoren, de richtingaanwijzers of de kentekenplaat aan de achterzijde van
      het voertuig niet mag worden belemmerd, indien deze voertuigen afzonderlijk of bij samenstellen daarvan een van
      de voertuigen voor 1 februari 1999 in Nederland in het kentekenregister zijn ingeschreven of in het verkeer zijn
      gebracht.

      2 Het eerste lid, onderdeel c, is niet van toepassing op voertuigen of samenstellen van voertuigen die in gebruik
      zijn genomen na 30 juni 1967 en voor 1 januari 1996.

      3 Het eerste lid, onderdeel e, is niet van toepassing indien aan de achterzijde van de uitstekende lading op
      gelijke wijze als op het betrokken voertuig zijn aangebracht verlichting, reflectoren, richtingaanwijzers of de
      kentekenplaat van dat voertuig.

      4 Het eerste lid is niet van toepassing op samenstellen van voertuigen, zijnde kermis- en circusvoertuigen.

      5 De in het eerste lid onder a bedoelde lengtevermeerdering van 1,00 m mag alleen worden veroorzaakt door de lading
      en door een uitschuiflade of laadklep ter ondersteuning van de lading of door een uitschuifbare stootbalk. Lading
      mag niet uitsluitend op de uitschuiflade of op de laadklep rusten.

      6 Voor de toepassing van dit artikel zijn onder lading mede begrepen gestandaardiseerde laadstructuren.


