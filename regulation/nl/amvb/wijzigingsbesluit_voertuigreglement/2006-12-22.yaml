  - number: IV
    text: |-
      [Artikel 5.12.6, vierde lid, van het Voertuigreglement][ref1] is tot en met 31 december 2006 in het verkeer
      uitsluitend binnen Nederland niet van toepassing op samenstellen van trekker en oplegger met een toegestane
      maximum massa van meer dan 3500 kg, waarvan de oplegger na 31 december 1990 en vóór 1 mei 1993 in Nederland in
      het kentekenregister is ingeschreven of in het verkeer is gebracht, indien de horizontaal gemeten afstand tussen
      het hart van de koppelingspen en enig deel aan de voorzijde van de oplegger niet meer bedraagt dan 2,05 m, met
      uitzondering van een puntvormige uitbouw waarvan het verticaal geprojecteerde oppervlak wordt begrensd door rechte
      lijnen die raken aan de uiterste voorhoeken van de oplegger en een punt op het mediaanvlak van de oplegger dat
      op maximaal 2,50 m voor het hart van de koppelingspen ligt, en indien de lengte van deze samenstellen niet meer
      bedraagt dan 15,50 m.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.12.6
    url: https://wetten.overheid.nl/BWBR0010222/2006-12-22#ArtikelIV
    references:
