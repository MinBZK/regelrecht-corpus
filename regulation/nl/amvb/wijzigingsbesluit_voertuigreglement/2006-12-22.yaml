preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 5 oktober 1998, nr. CDJZ/WJZ/345-98, Centrale
    Directie Juridische Zaken;

    Gelet op:

    – Richtlijn nr. 93/93/EEG van de Raad van de Europese Unie van 29 oktober 1993 betreffende de massa's en afmetingen
    van twee- of driewielige motorvoertuigen (PbEG L 311);

    – Richtlijn nr. 95/48/EG van de Commissie van de Europese Gemeenschappen van 20 september 1995 houdende
    aanpassing aan de technische vooruitgang van Richtlijn 92/21/EEG van de Raad betreffende massa's en afmetingen van
    motorvoertuigen van categorie M1 (PbEG L 233).

    – Richtlijn nr. 96/53/EG van de Raad van de Europese Unie van 25 juli 1996 houdende vaststelling, voor bepaalde aan
    het verkeer binnen de Gemeenschap deelnemende wegvoertuigen, van de in het nationale en het internationale verkeer
    maximaal toegestane afmetingen, en van de in het internationale verkeer maximaal toegestane gewichten (PbEG L 235);

    – de Wegenverkeerswet 1994;

    De Raad van State gehoord (advies van 4 december 1998, nr. W09.98.0460);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 11 januari 1999, nr. CDJZ/204-99, Centrale
    Directie Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0010222/2006-12-22#ArtikelAanhef
articles:
  - number: II
    text: |-
      De [artikelen 3.3.6, derde lid, onderdeel b][ref1], [3.7.6, derde lid][ref2],
      [5.3.6, eerste lid, onderdeel b][ref3], en [artikel 5.12.6, achtste lid, van het Voertuigreglement][ref4] zijn in
      het verkeer uitsluitend binnen Nederland tot en met 31 december 2006 niet van toepassing op

      a. bedrijfsauto's, niet zijnde bussen, met een toegestane maximum massa van meer dan 10 000 kg, en

      b. aanhangwagens met een toegestane maximum massa van meer dan 10 000 kg, indien deze niet breder zijn dan 2,60 m
      en indien deze voertuigen afzonderlijk of bij samenstellen daarvan een van de voertuigen voor 1 februari 1999 in
      Nederland in het kentekenregister zijn ingeschreven of in het verkeer zijn gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel3.3.6
