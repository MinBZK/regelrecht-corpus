preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 19 december 1997, nr. DGP/WJZ/V 725573,
    Directoraat-Generaal Personenvervoer;

    Gelet op:

    De Raad van State gehoord (advies van 16 maart 1998, nr. W09.97.0813);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 5 juni 1998, nr. DGP/WJZ/V 821675,
    Directoraat-Generaal Personenvervoer;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009685/1998-10-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      Het bepaalde in het [vijfde lid van artikel 3.2.35][ref1] is tot 1 oktober 2003 niet van toepassing op typen van
      de aldaar bedoelde personenauto's indien deze typen voor 1 oktober 1998 zijn goedgekeurd voor toelating tot het
      verkeer op de weg met toepassing van ten minste twee van de [richtlijnen 70/387/EEG](31970L0387) (PbEG 10 augustus
      1970, L 176), [74/483/EEG](31974L0483) (PbEG 2 oktober 1974, L 266) en [76/115/EEG](31976L0115) (PbEG 30 januari
      1976, L 24).


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel3.2.35
