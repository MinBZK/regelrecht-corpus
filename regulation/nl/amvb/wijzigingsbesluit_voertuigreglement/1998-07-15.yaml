preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 19 december 1997, nr. DGP/WJZ/V 725571,
    Directoraat-Generaal Personenvervoer;

    Gelet op:

    De Raad van State gehoord (advies van 16 maart 1998, nr. W09.97.0814);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 29 mei 1998, nr. DGP/WJZ/V 821688,
    Directoraat-Generaal Personenvervoer;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009676/1998-07-15#ArtikelAanhef
articles:
  - number: II
    text: |-
      Bussen in gebruik genomen voor 26 oktober 1999,

      a. met een toegestane maximum massa van meer dan 5000 kg,

      b. bestemd voor het vervoer van meer dan 22 passagiers, de bestuurder daaronder niet begrepen,

      c. niet bestemd voor het vervoer van staande passagiers, en

      d. niet bestemd voor vervoer binnen één gemeente, die voor wat betreft de verbrandingseigenschappen van bij de
      inwendige constructie gebruikte materialen voldoen aan het bepaalde in [richtlijn 95/28/EG](31995L0028) (PbEG 23
      november 1995, L 281), worden in afwijking van het bepaalde terzake in de Regeling vaststelling regels voor de
      keuring van bussen voor dit aspect goedgekeurd voor toelating tot het verkeer op de weg.
    url: https://wetten.overheid.nl/BWBR0009676/1998-07-15#ArtikelII
  - number: III
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0009676/1998-07-15#ArtikelIII
