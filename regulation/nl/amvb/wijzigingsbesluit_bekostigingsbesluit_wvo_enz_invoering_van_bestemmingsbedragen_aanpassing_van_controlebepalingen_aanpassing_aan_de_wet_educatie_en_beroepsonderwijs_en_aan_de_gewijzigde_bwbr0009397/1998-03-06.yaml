  - number: III
    text: |-
      1 Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.

      2 Indien het Staatsblad waarin dit besluit wordt geplaatst, wordt uitgegeven na 14 maart 1998, wordt het uiterste
      tijdstip, genoemd in [artikel 15, eerste lid, van het Bekostigingsbesluit W.V.O.][ref1] zoals luidend ingevolge
      [artikel I][ref2] van dit besluit, voor de vaststelling van de vergoedingen voor het schooljaar 1998–1999,
      vervangen door het tijdstip van inwerkingtreding van dit besluit.


