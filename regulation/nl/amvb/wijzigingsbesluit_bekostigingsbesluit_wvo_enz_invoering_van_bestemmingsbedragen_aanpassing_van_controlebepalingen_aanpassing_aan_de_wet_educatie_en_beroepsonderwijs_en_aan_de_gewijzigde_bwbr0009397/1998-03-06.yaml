articles:
  - number: II
    text: |-
      1 Het [Bekostigingsbesluit W.V.O.][ref1] zoals luidend ingevolge [artikel I][ref2] is wat de vaststelling
      van de vergoedingen en aanvullende vergoedingen betreft voor de eerste maal van toepassing op het schooljaar
      1998–1999. De vaststelling van de vergoedingen of aanvullende vergoedingen berust in afwijking van het
      [Bekostigingsbesluit W.V.O.][ref3] zoals luidend ingevolge artikel I, op de gegevens die zijn verkregen en in
      voorkomende gevallen gecorrigeerd ingevolge de krachtens de [Wet op het voortgezet onderwijs][ref4] gegeven
      voorschriften zoals geldend voor het tijdstip van inwerkingtreding van dit besluit. Voor de toepassing van het
      [Bekostigingsbesluit W.V.O.][ref5] zoals luidend ingevolge [artikel I][ref6], worden de in de tweede volzin
      bedoelde gegevens aangemerkt als te zijn verkregen en gecorrigeerd met toepassing van artikel 14 van dat besluit.

      2 Met betrekking tot vergoedingen voor de schooljaren voorafgaand aan het schooljaar 1998–1999, alsmede met
      betrekking tot geschillen daarover, blijven van toepassing de voorschriften, vastgesteld bij en krachtens het
      [Bekostigingsbesluit W.V.O.][ref7] zoals luidend zonder de wijzigingen ingevolge [artikel I][ref8], onverminderd
      het derde lid. De eerste volzin is van overeenkomstige toepassing ten aanzien van aanvullende vergoedingen.

      3 Het [Bekostigingsbesluit W.V.O.][ref9] zoals luidend ingevolge [artikel I][ref10] is wat hoofdstuk 3, titel 3,
      betreft van overeenkomstige toepassing op de kalenderjaren 1997 en 1998.

      4 Bij ministeriële regeling kunnen regels worden gegeven voor de toepassing van het eerste tot en met derde lid.


