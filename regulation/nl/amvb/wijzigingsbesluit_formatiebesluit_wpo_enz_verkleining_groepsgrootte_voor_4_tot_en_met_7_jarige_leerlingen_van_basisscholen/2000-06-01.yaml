articles:
  - number: V
    text: |-
      1 De in [artikel I][ref1] van dit besluit opgenomen wijzigingen van het [Formatiebesluit WPO][ref2] zijn voor wat
      betreft de vaststelling van de formatie voor de eerste maal van toepassing op het schooljaar 2000–2001.

      2 De in [artikel II][ref3] van dit besluit opgenomen wijzigingen van het [Bekostigingsbesluit WPO][ref4] zijn voor
      wat betreft de vaststelling van de vergoedingen voor de materiële instandhouding voor de eerste maal van toepassing
      op het kalenderjaar 2001, met uitzondering van het nieuwe artikel 35, dat van toepassing is op de periode van 1
      augustus 2000 tot en met 31 december 2000.


      [ref1]: https://wetten.overheid.nl/BWBR0011297#ArtikelI
