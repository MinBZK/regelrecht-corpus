  - number: VI
    text: |-
      De [artikelen 19a tot en met 19c van het Formatiebesluit WPO][ref1] zoals die luidden op de dag voorafgaand aan
      de inwerkingtreding van dit besluit, blijven van toepassing voor de berekening van of geschillen betreffende de
      formatie voor de schooljaren waarop die artikelen betrekking hadden.


      [ref1]: https://wetten.overheid.nl/BWBR0005441#Artikel19a
    url: https://wetten.overheid.nl/BWBR0011297/2000-06-01#ArtikelVI
    references:
