  - number: IX
    text: |-
      1 Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst, met uitzondering van de [artikelen II][ref1] en [III][ref2].

      2 De [artikelen II][ref3] en [III][ref4] van dit besluit treden in werking op een bij koninklijk besluit te bepalen
      tijdstip. Laatstbedoeld besluit wordt niet genomen voordat vier weken zijn verstreken nadat het onderhavige besluit
      is overgelegd aan de Tweede Kamer der Staten-Generaal, en evenmin indien binnen die termijn door of namens de
      Tweede Kamer de wens te kennen wordt gegeven dat het in de [artikelen II][ref5] en [III][ref6] van dit besluit
      geregelde onderwerp bij wet wordt geregeld.


