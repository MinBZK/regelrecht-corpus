        artikel: 19a
  - number: VII
    text: |-
      In [artikel 19b, vierde lid, van het Formatiebesluit WPO][ref1], zoals opgenomen in [artikel I][ref2], en
      in [artikel 35, eerste lid, onderdelen a en b, van het Bekostigingsbesluit WPO][ref3], zoals opgenomen in
      [artikel II][ref4], worden voor de plaatsing van dit besluit in het Staatsblad ingevoegd de datum waarop dit
      besluit is vastgesteld en het nummer van het Staatsblad waarin dit besluit wordt geplaatst.


