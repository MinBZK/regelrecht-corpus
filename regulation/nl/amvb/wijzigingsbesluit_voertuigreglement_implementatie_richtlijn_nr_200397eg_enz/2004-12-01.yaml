preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 31 augustus 2004, nr. HDJZ/AWW/2004-2080,
    Hoofddirectie Juridische Zaken;

    Gelet op richtlijn nr. 2003/97/EG van het Europees Parlement en de Raad van 10 november 2003 (PbEG L 25)
    betreffende de onderlinge aanpassing van de wetgevingen van de lidstaten inzake de typegoedkeuring van inrichtingen
    voor indirect zicht en van voertuigen met deze inrichtingen, tot wijziging van Richtlijn 70/156/EEG en tot
    intrekking van Richtlijn 71/127/EEG en de artikelen 21, 22, 24, 26 en 34 van de Wegenverkeerswet 1994;

    De Raad van State gehoord (advies van 18 oktober 2004, nr. W09.04.0436/V);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 25 oktober 2004, nr. HDJZ/AWW/2004-2639,
    Hoofddirectie Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0017402/2004-12-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      Op verzoek van de fabrikant wordt tot 26 januari 2006 voor personenauto’s en bedrijfsauto’s, alsmede voor
      inrichtingen voor indirect zicht voor personenauto’s en bedrijfsauto’s, een typegoedkeuring verleend als bedoeld
      in artikel 2, eerste lid, van [richtlijn nr. 2003/97/EG](32003L0097) van het Europees Parlement en de Raad van 10
      november 2003 betreffende de onderlinge aanpassing van de wetgevingen van de lidstaten inzake de typegoedkeuring
      van inrichtingen voor indirect zicht en van voertuigen met deze inrichtingen, tot wijziging van [Richtlijn 70/156/
      EEG](31970L0156) en tot intrekking van [Richtlijn 71/127/EEG](31971L0127) (PbEG L 25).
    url: https://wetten.overheid.nl/BWBR0017402/2004-12-01#ArtikelII
  - number: III
    text: Dit besluit treedt in werking met ingang van 1 december 2004.
    url: https://wetten.overheid.nl/BWBR0017402/2004-12-01#ArtikelIII
