      tijden van het schoolbezoek zijn aangegeven. Deze bepalingen zijn niet van toepassing op de lichtmatroos, bedoeld
      in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel12b
  - number: 12b.7
    text: |-
      De in de tabel in het tweede lid voorgeschreven minimumbemanning (stoomschepen voor dagtochten) in de groep 2,
      exploitatiewijze A1, standaard S1 kan voor de ononderbroken duur van ten hoogste drie maanden in een kalenderjaar
      met een lichtmatroos, die een schippersschool bezoekt, worden verminderd. Opeenvolgende periodes met een
      verminderde bemanning worden met een periode van minimaal één maand onderbroken. Het bezoek aan de schippersschool
      wordt worden aangetoond met een verklaring van de schippersschool die zich aan boord bevindt, waarin de tijden
      van het schoolbezoek zijn aangegeven. Deze bepalingen zijn niet van toepassing op de lichtmatroos, bedoeld in het
      vijfde lid.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel12b
  - number: 12b.8
    text: |-
      De in de tabel in het derde lid voorgeschreven minimumbemanning (hotelschepen) in de groep 3, exploitatiewijze A1,
      standaard S1 kan voor de ononderbroken duur van ten hoogste drie maanden in een kalenderjaar met een lichtmatroos,
      die een schippersschool bezoekt, worden verminderd. Opeenvolgende periodes met een verminderde bemanning worden
      met een periode van minimaal één maand onderbroken. Het bezoek aan de schippersschool wordt aangetoond met
      een verklaring van de schippersschool die zich aan boord bevindt, waarin de tijden van het schoolbezoek zijn
      aangegeven.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel12b
  - number: 12b.9
    text: |-
      Op schepen die zijn bedoeld om voornamelijk zeilend te varen, kan de matroos-motordrijver worden vervangen door
      een matroos.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel12b
