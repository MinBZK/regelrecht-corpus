    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel12
  - number: 12.3.b)
    text: |-
      in groep 3, exploitatiewijze A1, Standaard S1 kan voor de ononderbroken duur van ten hoogste drie maanden in een
      kalenderjaar met een lichtmatroos, die een schippersschool bezoekt, worden verminderd. Opeenvolgende periodes
      met een verminderde bemanning worden met een periode van minimaal één maand onderbroken. Het bezoek aan de
      schippersschool wordt aangetoond met een verklaring van de schippersschool die zich aan boord bevindt, waarin de
      tijden van het schoolbezoek zijn aangegeven. Deze bepalingen zijn niet van toepassing op de lichtmatroos, bedoeld
      in het tweede lid.
