  - number: 12c.2
    text: |-
      Indien zonder passagiers gevaren wordt, kan volstaan worden met een schipper, een stuurman, een 1e machinist en een
      2e machinist.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel12c
  - number: '13.1'
    text: |-
      Motorschepen, duwboten, duwstellen en passagiersschepen, die met een minimumbemanning worden geëxploiteerd,
      voldoen aan de volgende voorschriften: - Standaard S1 De voortstuwingsinstallaties zijn zodanig ingericht, dat
      de verandering van de vaarsnelheid en de omkering van de richting van de stuwkracht van de schroef vanaf de
      stuurstelling kunnen geschieden. De hulpmotoren nodig bij het varen met het schip kunnen vanaf de stuurstelling
      worden aan – en afgezet, tenzij dit automatisch geschiedt, dan wel deze motoren gedurende elke reis ononderbroken
      in bedrijf zijn. Het kritieke peil van de temperatuur van het koelwater van de hoofdmotoren, van de druk van de
      smeerolie van de hoofdmotoren en de transmissie, van de oliedruk en de luchtdruk van de omkeerinrichting van de
      hoofdmotoren, de keerkoppeling of de schroeven en van het bilgewater in de hoofdmachinekamer wordt aangegeven
      door installaties die in het stuurhuis akoestische en optische alarmsignalen in werking stellen. De akoestische
      alarmsignalen mogen in één akoestisch apparaat verenigd zijn. Zij mogen worden uitgeschakeld zodra de storing
      is vastgesteld. De optische alarmsignalen mogen pas worden uitgeschakeld, nadat de desbetreffende storingen
      zijn verholpen. De brandstoftoevoer en de koeling van de hoofdmotoren geschieden automatisch De bediening
      van de stuurinrichting kan, zelfs bij de grootste toegelaten inzinking door één persoon zonder bijzondere
      krachtsinspanning worden verricht. De door het ter plaatse geldende scheepvaartreglement voorgeschreven optische
      tekens en geluidsseinen van varende schepen kunnen vanaf de stuurstelling worden gegeven. Indien geen rechtstreeks
      contact mogelijk is tussen de stuurstelling en het voorschip, het achterschip, de verblijven en de machinekamer,
      is een spreekverbinding aangebracht. Voor contact met de machinekamer mogen in plaats van een spreekverbinding
      optische en akoestische signalen worden gebruikt. De voorgeschreven bijboot kan door één bemanningslid binnen
      een redelijke tijd te water worden gelaten. Er is een vanaf de stuurstelling te bedienen schijnwerper aan boord.
      De kracht, nodig om zwengels en soortgelijke draaibare voorzieningen van hefwerktuigen te bedienen bedraagt niet
      meer dan 160 N. De in het certificaat van onderzoek vermelde sleeplieren worden door een motor aangedreven. De
      lenspompen en de dekwaspompen worden door een motor aangedreven. De voornaamste bedieningsinrichtingen en controle-
      instrumenten zijn ergonomisch aangebracht. De inrichting nodig voor het sturen van het schip kan vanuit het
      stuurhuis worden bediend. Indien voor de goede bestuurbaarheid of het kop voor stilhouden een boegroerinstallatie
      voorgeschreven is, kan deze eveneens vanuit het stuurhuis worden bediend.
        - Standaard S2 voor alleen varende motorschepen geldt Standaard S1 en bovendien een uitrusting met een vanuit
      de stuurhut bedienbare boegschroefinstallatie; voor motorschepen, die gekoppelde vaartuigen voortbewegen, geldt
      Standaard S1 en bovendien een uitrusting met een vanuit de stuurhut bedienbare boegschroefinstallatie; voor
      motorschepen, die een duwstel, bestaande uit het motorschip en een vaartuig ervoor, voortbewegen, geldt Standaard
      S1 en bovendien een uitrusting met hydraulisch of elektrisch aangedreven koppellieren. Deze uitrusting is echter
      niet vereist, als het vaartuig aan de kop van het duwstel met een boegschroefinstallatie is uitgerust, die
      vanuit de stuurhut van het duwende motorschip te bedienen is; voor duwboten, die een duwstel voortbewegen, geldt
      Standaard S1 en bovendien een uitrusting met hydraulisch of elektrisch aangedreven koppellieren. Deze uitrusting
      is echter niet vereist, als het vaartuig aan de kop van het duwstel met een boegschroefinstallatie is uitgerust,
      die vanuit de stuurhut van het duwende duwboot te bedienen is; voor passagiersschepen geldt Standaard S1 en
      bovendien een uitrusting met een vanuit de stuurhut bedienbare boegschroefinstallatie. Deze uitrusting is echter
      niet vereist, indien de voortstuwingsinstallatie en de stuurinrichting van het passagiersschip gelijkwaardige
      manoeuvreereigenschappen waarborgen.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel13
  - number: '13.2'
    text: |-
      Het voldoen of niet voldoen aan de voorschriften bedoeld in het eerste lid wordt door het
      hoofd van de Scheepvaartinspectie in een verklaring vastgelegd. De verklaring, bedoeld in het
      [Besluit Reglement onderzoek schepen op de Rijn 1995][ref1], afgegeven door de Commissie van Deskundigen, waarin
      is vastgelegd of een schip al dan niet voldoet aan de voorschriften met betrekking tot de uitrusting van schepen,
      wordt met de in de eerste volzin bedoelde verklaring gelijkgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007857
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007857
  - number: '13.3'
    text: |-
      Indien een schip als bedoeld in het eerste lid, niet voldoet aan de voorschriften, genoemd in het eerste lid,
      Standaard S 1, wordt de minimumbemanning, bedoeld in [de artikel 12 tot en met 12c][ref1]: - bij exploitatiewijzen
      A1 en A2 versterkt met één matroos;
        - bij exploitatiewijze B versterkt met twee matrozen.


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel12
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
  - number: '13.4'
    text: |-
      Indien een schip als bedoeld in het eerste lid, niet voldoet aan het eerste lid onderdeel a, 9) of 11), wordt in
      afwijking van het derde lid, onderdeel b, de minimumbemanning in de exploitatiewijze B slechts versterkt met één
      matroos.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel13
  - number: '13.5'
    text: |-
      Onverminderd het bepaalde in het derde lid wordt, indien een schip niet voldoet aan het eerste lid, onderdeel a, 1)
      tot en met 3): - bij exploitatiewijzen A1 en A2 een matroos vervangen door een matroos-motordrijver;
        - bij exploitatiewijze B twee matrozen vervangen door twee matrozen-motordrijver.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel13
  - number: '14.1'
    text: |-
      De minimumbemanning van schepen, waarop de [artikelen 12][ref1],[12a][ref2],[12b][ref3] en [12 c][ref4] niet van
      toepassing zijn, is, rekening houdend met de afmetingen, de bouw, de inrichting en de bestemming van deze schepen,
      voldoende met het oog op de veiligheid van de vaart en van de arbeid aan boord.


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007124#Artikel12a
      [ref3]: https://wetten.overheid.nl/BWBR0007124#Artikel12b
      [ref4]: https://wetten.overheid.nl/BWBR0007124#Artikel12c
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007124
        artikel: 12a
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007124
        artikel: 12b
        hoofdstuk: III
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0007124
        artikel: 12c
        hoofdstuk: III
        paragraaf: '1'
  - number: '14.2'
    text: |-
      Het hoofd van de Scheepvaartinspectie kan met inachtneming van het eerste lid, na overleg met het bevoegde
      districtshoofd van de Arbeidsinspectie, ten aanzien van elk schip als bedoeld in het eerste lid afzonderlijk dan
      wel voor categorieën van schepen als bedoeld in het eerste lid de minimumbemanning vaststellen. Schepen als bedoeld
      in de vorige zin zijn voorzien van een verklaring, afgegeven door het hoofd van de Scheepvaartinspectie, waarin de
      minimumbemanning is vastgelegd.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel14
  - number: '14.3'
    text: |-
      Het hoofd van de Scheepvaartinspectie kan na overleg met het bevoegde districtshoofd van de Arbeidsinspectie, ten
      aanzien van bunkerschepen met een lengte van minder dan 35 meter die slechts op korte trajecten ingezet worden,
      een minimumbemanning voorschrijven die afwijkt van [artikel 12, eerste lid][ref1]. Bunkerschepen als bedoeld in
      de vorige zin, zijn voorzien van een verklaring, afgegeven door het hoofd van de Scheepvaartinspectie, waarin de
      minimumbemanning is vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel12
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
  - number: '15.1'
    text: |-
      De minimumbemanning, bedoeld in [de artikelen 12 tot en met 14][ref1], bevindt zich tijdens de vaart voortdurend
      aan boord.


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel12
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
  - number: '15.2'
    text: |-
      Indien door onvoorziene omstandigheden, zoals ziekte, ongeval of bevel van een gezagdrager, tijdens de vaart
      ten hoogste één lid van de bij of krachtens dit besluit voorgeschreven minimumbemanning uitvalt, mag een
      schip, in afwijking van het eerste lid, doorvaren tot de eerstvolgende geschikte aanlegplaats in de richting
      waarin gevaren wordt, mits de bemanning ten minste uit twee bemanningsleden bestaat, waarvan er één voldoet
      aan [artikel 18, eerste lid, onderdeel a][ref1]. Voor een passagiersschip geldt in plaats van de eerstvolgende
      geschikte aanlegplaats, het eindpunt van de reis van die dag.


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel18
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '18'
        hoofdstuk: III
        paragraaf: '2'
  - number: '16'
    text: |-
      Een vrouw, die krachtens arbeidsovereenkomst dan wel publiekrechtelijke aanstelling arbeid verricht, mag geen deel
      uitmaken van de minimumbemanning gedurende ten minste 14 weken rondom de vermoedelijke datum van haar bevalling,
      waarvan ten minste 6 weken vóór deze datum en ten minste 7 weken na de feitelijke datum van de bevalling liggen.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel16
  - number: '17'
    text: |-
      De persoon die belast is met het toezicht op en de verzorging van één of meer zich aan boord bevindende kinderen
      die de leeftijd van 6 jaar nog niet hebben bereikt, mag geen deel uitmaken van de minimumbemanning, tenzij er
      maatregelen zijn getroffen waardoor de veiligheid van het kind of de kinderen ook zonder voortdurend toezicht is
      gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel17
  - number: '18.1'
    text: 'De bemanningsleden van schepen, niet zijnde veerboten, voldoen aan onderscheidenlijk de volgende vereisten:'
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel18
  - number: 18.1.a
    text: '**een schipper** is'
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel18
  - number: 18.1.a.1°
    text: |-
      hetzij in het bezit van een groot patent als bedoeld in het Reglement Rijnpatenten 1998 of een krachtens artikel
      5.01 van het Reglement Rijnpatenten 1998 geldig Rijnschipperspatent;
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel18
  - number: 18.1.a.2°
    text: |-
      hetzij in het bezit van een vaarbewijs als bedoeld in [artikel 16 van de Binnenschepenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel16
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '16'
  - number: 18.1.a.3°
    text: |-
      hetzij in het bezit van een bewijs van bekwaamheid voor de binnenvaart als bedoeld in
      [artikel 17, eerste lid, onderdeel ][ref1], voor zover dat bewijs is erkend voor de bedrijfsmatige vaart;


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel17
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '17'
  - number: 18.1.a.4°
    text: |-
      hetzij krachtens de [Binnenschepenwet][ref1] vrijgesteld of ontheven van de verplichting in het bezit te zijn van
      een groot vaarbewijs als bedoeld in [artikel 16 van de Binnenschepenwet][ref2], mits de aan de vrijstelling of
      ontheffing verbonden voorschriften of beperkingen door hem worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0003443
      [ref2]: https://wetten.overheid.nl/BWBR0003443#Artikel16
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003443
      - id: ref2
        bwb_id: BWBR0003443
        artikel: '16'
  - number: 18.1.b
    text: |-
      **een stuurman** voldoet aan de vereisten die op grond van dit artikel worden gesteld aan een matroos en heeft ten
      minste twee jaar als zodanig in de binnenvaart gevaren;
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel18
  - number: 18.1.c
    text: '**een machinist** is'
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel18
  - number: 18.1.c.1°
    text: |-
      hetzij ten minste 18 jaar en in het bezit van een door Onze Minister van Verkeer en Waterstaat erkend getuigschrift
      waaruit blijkt, dat hij met goed gevolg een opleiding op het gebied van motoren en werktuigkunde heeft gevolgd dan
      wel in het bezit van een EG-verklaring als bedoeld in de [Algemene wet erkenning EG-beroepsopleidingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006781
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006781
  - number: 18.1.c.2°
    text: |-
      hetzij ten minste 19 jaar en voldoet aan de vereisten die op grond van dit artikel worden gesteld aan een matroos-
      motordrijver en heeft ten minste twee jaar als zodanig op een schip met mechanische voortstuwingsmiddelen gevaren;
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel18
  - number: 18.1.d
    text: |-
      **een volmatroos** voldoet aan de vereisten die op grond van dit artikel worden gesteld aan een matroos en heeft
      ten minste één jaar als zodanig in de binnenvaart gevaren;
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel18
  - number: 18.1.e
    text: '**een matroos-motordrijver** voldoet'
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel18
  - number: 18.1.e.1°
    text: |-
      hetzij aan de vereisten die op grond van dit artikel worden gesteld aan een matroos en is in het bezit van een door
      Onze Minister erkend getuigschrift waaruit blijkt, dat hij met goed gevolg een opleiding voor matroos-motordrijver
      heeft gevolgd dan wel een EG-verklaring als bedoeld in de [Algemene wet erkenning EG-beroepsopleidingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006781
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006781
  - number: 18.1.e.2°
    text: |-
      hetzij aan de vereisten die op grond van dit artikel worden gesteld aan een matroos en heeft ten minste één jaar
      als zodanig op een schip met mechanische voortstuwingsmiddelen gevaren, en bezit een aantoonbare elementaire kennis
      op het gebied van motoren;
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel18
  - number: 18.1.f
    text: '**een matroos** is'
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel18
  - number: 18.1.f.1°
    text: |-
      hetzij ten minste 17 jaar en in het bezit van een door Onze Minister erkend getuigschrift waaruit blijkt,
      dat hij met goed gevolg een opleiding voor matroos heeft gevolgd dan wel een EG-verklaring als bedoeld in de
      [Algemene wet erkenning EG-beroepsopleidingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006781
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006781
  - number: 18.1.f.2°
    text: |-
      hetzij ten minste 19 jaar en heeft ten minste drie jaar gevaren als lid van een dekbemanning, waarvan ten minste
      één jaar in de binnenvaart en twee jaar, hetzij in de binnenvaart, dan wel in de zeevaart, kustvaart of visserij;
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel18
  - number: 18.1.g
    text: |-
      een lichtmatroos is ten minste 15 jaar en in het bezit van een leerovereenkomst die voorziet in het bezoeken van
      een vakschool voor schippers, of het volgen van een schriftelijke cursus die door Onze Minister is erkend dan wel
      door een bevoegde autoriteit in het buitenland is erkend en die opleidt tot een gelijkwaardig diploma.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel18
  - number: 18.1.h
    text: een deksman is tenminste 16 jaar.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel18
  - number: '18.2'
    text: 'De bemanningsleden van veerboten voldoen aan onderscheidenlijk de volgende vereisten:'
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel18
  - number: 18.2.a
    text: |-
      **een schipper** is ten minste 21 jaar en voldoet aan de vereisten die op grond van het eerste lid, onderdeel
      a, onder 1° tot en met 3°, worden gesteld aan een schipper en is in het bezit van een getuigschrift waaruit
      blijkt dat hij met goed gevolg de korte opleiding schipper-machinist met beperkt werkgebied of een andere
      door onze Minister erkende opleiding alsmede te allen tijde de nautische Module Zoute Veren heeft gevolgd
      dan wel is in het bezit van een door onze Minister erkend buitenlands getuigschrift waaruit blijkt dat hij
      een gelijk-waardige opleiding heeft gevolgd, dan wel is in het bezit van een EG-verklaring als bedoeld in de
      [Algemene wet erkenning EG-beroepsopleidingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006781
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006781
  - number: 18.2.b
    text: |-
      **een stuurman** is ten minste 21 jaar en voldoet aan de vereisten die op grond van het eerste lid, onderdeel
      a, onder 1° tot en met 3°, worden gesteld aan een schipper en is in het bezit van een door Onze Minister erkend
      getuigschrift waaruit blijkt dat hij met goed gevolg een E.H.B.O.-opleiding heeft gevolgd, dan wel is in het bezit
      van een door Onze Minister erkend buitenlands getuigschrift waaruit blijkt dat hij een gelijkwaardige opleiding
      heeft gevolgd;
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel18
  - number: 18.2.c
    text: |-
      **een 1e machinist**is ten minste 21 jaar en is in het bezit van een getuigschrift waaruit blijkt dat hij met
      goed gevolg hetzij de opleiding MTS-Werktuigbouw alsmede de opleiding Zoute Veren, technische Module, hetzij de
      opleiding Machinist Binnenvaart B aangevuld met de opleiding Zoute Veren, technische Module, hetzij een andere
      door Onze Minister erkende opleiding heeft gevolgd, dan wel is in het bezit van een door onze Minister erkend
      buitenlands getuigschrift waaruit blijkt dat hij een gelijkwaardige opleiding heeft gevolgd dan wel een EG-
      verklaring als bedoeld in de [Algemene wet erkenning EG-beroepsopleidingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006781
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006781
  - number: 18.2.d
    text: |-
      **een 2e machinist** is ten minste 19 jaar en is in het bezit van een getuigschrift waaruit blijkt dat hij met goed
      gevolg de opleiding machinist binnenvaart B heeft gevolgd, hetzij een andere door onze Minister erkende opleiding
      heeft gevolgd dan wel is in het bezit van een door Onze Minister erkend buitenlands getuigschrift waaruit blijkt
      dat hij een gelijkwaardige opleiding heeft gevolgd dan wel is in het bezit van een EG-verklaring als bedoeld in de
      [Algemene wet erkenning EG-beroepsopleidingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006781
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006781
  - number: 18.2.e
    text: |-
      **een matroos** is ten minste 19 jaar en is in het bezit van een door Onze Minister erkend getuigschrift waaruit
      blijkt dat hij met goed gevolg een opleiding brandbestrijding heeft gevolgd, dan wel is in het bezit van een door
      onze Minister erkend buitenlands getuigschrift waaruit blijkt dat hij een gelijkwaardige opleiding heeft gevolgd;
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel18
  - number: 18.2.f
    text: |-
      **een lichtmatroos** is ten minste 18 jaar en is in het bezit van een door Onze Minister erkend getuigschrift
      waaruit blijkt dat hij met goed gevolg een opleiding brandbestrijding heeft gevolgd, dan wel is in het bezit van
      een door onze Minister erkend buitenlands getuigschrift waaruit blijkt dat hij een gelijkwaardige opleiding heeft
      gevolgd.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel18
  - number: '18.3'
    text: |-
      Bij ministeriële regeling kunnen ten aanzien van bemanningsleden van veerponten en veerboten opleidings- en
      ervaringseisen worden gesteld, welke afwijken van het eerste, onderscheidenlijk tweede lid of strekken ter
      aanvulling daarvan.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel18
  - number: '19.1'
    text: |-
      Een bemanningslid is in het bezit van een geneeskundige verklaring, afgegeven door een arts die is aangewezen door
      Onze Minister dan wel door een bevoegde autoriteit in het buitenland, waaruit blijkt dat hij voldoet aan de eisen
      betreffende de lichamelijke geschiktheid als voorgeschreven in het Reglement onderzoek schepen op de Rijn.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel19
  - number: '19.2'
    text: |-
      Indien de afgifte van een verklaring wordt geweigerd, kan, op verzoek van de betrokkene, een verklaring worden
      afgegeven door een door Onze Minister aangewezen arts, niet zijnde de arts die de verklaring heeft geweigerd,
      indien de betrokkene voldoet aan de in het eerste lid bedoelde eisen.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel19
  - number: '19.3'
    text: Bij ministeriële regeling worden nadere regels gesteld met betrekking tot het tweede lid.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel19
  - number: '20.1'
    text: |-
      Een geneeskundige verklaring, afgegeven vóór de 65-jarige leeftijd van een bemanningslid, is geldig tot drie
      maanden na de dag waarop hij de 65-jarige leeftijd bereikt.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel20
  - number: '20.2'
    text: |-
      Een geneeskundige verklaring afgegeven nadat een bemanningslid de 65-jarige leeftijd heeft bereikt, is geldig
      gedurende een tijdvak van een jaar.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel20
  - number: '21'
    text: |-
      Geen verklaring als bedoeld in [artikel 19, eerste lid][ref1], is vereist ten aanzien van de schipper, bedoeld in
      [artikel 18, eerste lid, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0007124#Artikel18
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '19'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007124
        artikel: '18'
        hoofdstuk: III
        paragraaf: '2'
  - number: '22'
    text: |-
      Een ambtenaar als bedoeld in [artikel 11, eerste lid][ref1], van de wet is bevoegd te eisen, dat binnen een door
      hem te bepalen termijn een nieuwe geneeskundige verklaring wordt afgegeven, indien hij redelijkerwijs vermoedt dat
      de houder daarvan niet meer voldoet aan de eisen, bedoeld in [artikel 19, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0007124#Artikel19
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '11'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0007124
        artikel: '19'
        hoofdstuk: III
        paragraaf: '2'
  - number: '23.1'
    text: |-
      Bij ministeriële regeling wordt de vergoeding vastgesteld die verschuldigd is voor de kosten van afgifte van een
      geneeskundige verklaring, als bedoeld in [artikel 19][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel19
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '19'
        hoofdstuk: III
        paragraaf: '2'
  - number: '23.2'
    text: |-
      Indien een geneeskundige verklaring wordt afgegeven, overeenkomstig [artikel 22][ref1], komen de kosten van afgifte
      toe aan het bemanningslid indien de twijfels gegrond zijn gebleken.


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel22
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '22'
        hoofdstuk: III
        paragraaf: '2'
  - number: '24.1'
    text: |-
      Een bemanningslid is in het bezit van een dienstboekje als omschreven in
      [artikel 23.04 van het Besluit Reglement onderzoek schepen op de Rijn 1995][ref1], waaruit blijkt dat hij voldoet
      aan de eisen, gesteld in de [artikelen 12, tweede lid][ref2], [12a, tweede lid][ref3], [12b, vijfde lid][ref4],
      en [18 tot en met 21][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0007124#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0007124#Artikel12a
      [ref4]: https://wetten.overheid.nl/BWBR0007124#Artikel12b
      [ref5]: https://wetten.overheid.nl/BWBR0007124#Artikel18
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007858
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0007124
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007124
        artikel: 12a
        hoofdstuk: III
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0007124
        artikel: 12b
        hoofdstuk: III
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0007124
        artikel: '18'
        hoofdstuk: III
        paragraaf: '2'
  - number: '24.2'
    text: |-
      Het dienstboekje, bedoeld in het eerste lid, wordt afgegeven door een door Onze Minister aangewezen instelling,
      welke verantwoordelijk is voor - de invulling van het dienstboekje overeenkomstig de daarin gestelde instructies;
        - de invulling van de gegevens betreffende de in [artikel 18][ref1] gestelde eisen aan het bemanningslid;
        - de afstempeling ter controle.


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel18
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '18'
        hoofdstuk: III
        paragraaf: '2'
  - number: '24.3'
    text: |-
      De in het tweede lid bedoelde instelling kan het overleggen van vaartijdenboeken dan wel uittreksels daarvan of van
      andere relevante bescheiden verlangen. Zij mag slechts die reizen van een afstempeling voorzien die niet ouder zijn
      dan 15 maanden.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel24
  - number: '24.4'
    text: |-
      Een bemanningslid laat het dienstboekje, bedoeld in het eerste lid, onderdeel *a*, telkens binnen een periode
      van 12 maanden, te rekenen vanaf de datum van afgifte, ten minste éénmaal afstempelen door de in het tweede lid
      bedoelde instelling. Een bemanningslid dat voldoet aan de in [artikel 18, eerste lid, onder b][ref1] gestelde eisen
      is van de verplichting tot afstempeling vrijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel18
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '18'
        hoofdstuk: III
        paragraaf: '2'
  - number: '24.5'
    text: Een bemanningslid overhandigt het dienstboekje bij de aanvang van het dienstverband aan de gezagvoerend schipper.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel24
  - number: '24.6'
    text: |-
      De gezagvoerend schipper is verantwoordelijk voor de invulling van het dienstboekje overeenkomstig de daarin
      gestelde instructies. Gegevens betreffende een eerder afgelegde reis worden vóór het begin van de volgende reis
      ingevuld.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel24
  - number: '24.7'
    text: |-
      De gezagvoerend schipper bewaart het dienstboekje van een bemanningslid tot de beëindiging van zijn dienstverband,
      arbeidscontract dan wel andere regeling, in het stuurhuis. Op verzoek van het betreffende bemanningslid geeft de
      gezagvoerend schipper het dienstboekje te allen tijde en onverwijld aan hem terug.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel24
  - number: '24.8'
    text: 'De in het eerste lid neergelegde verplichting geldt niet voor:'
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel24
  - number: 24.8.a
    text: |-
      het bemanningslid dat in het bezit is van een van de documenten, bedoeld in
      [artikel 18, eerste lid, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel18
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '18'
        hoofdstuk: III
        paragraaf: '2'
  - number: 24.8.b
    text: |-
      het bemanningslid van een veerboot en veerpont dat in het bezit is van een document waaruit blijkt dat hij voldoet
      aan de eisen, gesteld in de[ artikelen 18 tot en met 21][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel18
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '18'
        hoofdstuk: III
        paragraaf: '2'
  - number: '24.9'
    text: |-
      Ten aanzien van de kosten en de procedures voor de afgifte van dienstboekjes en vervangende exemplaren van
      dienstboekjes kunnen bij ministeriële regeling nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel24
  - number: '25'
    text: |-
      De gezagvoerend schipper is verplicht ervoor te zorgen dat aan boord van het schip de volgende documenten aanwezig
      zijn:
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel25
  - number: 25.a
    text: |-
      een vaartijdenboek als bedoeld in [artikel 23.08 van het Reglement onderzoek schepen op de Rijn][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel23
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0007858
        artikel: '23'
  - number: 25.b
    text: |-
      in geval van toepassing van [artikel 13, eerste lid, aanhef][ref1], een verklaring als bedoeld in
      [artikel 13, eerste lid][ref2], dan wel de beschikking tot weigering van afgifte van deze verklaring, of een
      afschrift daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0007124#Artikel13
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007124
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
  - number: 25.c
    text: |-
      een verklaring als bedoeld in [artikel 26, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel26
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '26'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 25.d
    text: |-
      in geval van toepassing van [artikel 7, derde lid][ref1], een verklaring als bedoeld in
      [bijlage K van het Besluit Reglement onderzoek schepen op de Rijn 1995][ref2], of een kopie van de pagina met de
      aantekeningen van de vaar- respectievelijk rusttijden uit het in onderdeel a genoemde vaartijdenboek, dat behoort
      bij het schip waarop de laatste reis van het bemanningslid heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007858
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '7'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007858
  - number: '26.1'
    text: |-
      Het vaartijdenboek is afgegeven door een instelling, aangewezen door Onze Minister dan wel door een bevoegde
      autoriteit in het buitenland.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel26
  - number: '26.2'
    text: 'Op het eerste vaartijdenboek worden de volgende gegevens vermeld:'
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel26
  - number: 26.2.a
    text: het nummer 1;
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel26
  - number: 26.2.b
    text: de naam van het schip;
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel26
  - number: 26.2.c
    text: het merk van de teboekstelling of het officiële scheepsnummer.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel26
  - number: '26.3'
    text: |-
      Bij de afgifte van het eerste vaartijdenboek wordt een verklaring uitgereikt die de naam van het schip, het merk
      van de teboekstelling of het officiële scheepsnummer, het nummer van het vaartijdenboek en de datum van afgifte
      vermeldt.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel26
  - number: '26.4'
    text: |-
      De volgende vaartijdenboeken worden bij afgifte voorzien van een volgnummer. Deze afgifte wordt aangetekend op de
      verklaring, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel26
  - number: '26.5'
    text: Een volgend vaartijdenboek wordt slechts afgegeven tegen overlegging van het voorgaande vaartijdenboek.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel26
  - number: '26.6'
    text: |-
      Het voorgaande vaartijdenboek wordt, nadat daarop de onuitwisbare aantekening "ongeldig" is aangebracht,
      teruggegeven.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel26
  - number: '26.7'
    text: |-
      In afwijking van het vijfde lid kan het overhandigen van het nieuwe vaartijdenboek geschieden op vertoon van het
      document, bedoeld in het derde lid. De exploitant van het schip draagt er in dat geval zorg voor dat het voorgaande
      vaartijdenboek binnen 30 dagen na de afgiftedatum van het nieuwe vaartijdenboek, die op het document , bedoeld
      in het vierde lid, door de bevoegde autoriteit is geregistreerd, door dezelfde bevoegde autoriteit onuitwisbaar
      ongeldig wordt verklaard. De exploitant van het schip draagt er zorg voordat daarna het vaartijdenboek weer aan
      boord wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel26
  - number: '26.8'
    text: |-
      Ten aanzien van de kosten en procedures voor de afgifte van vaartijdenboeken en vervangende exemplaren van
      vaartijdenboeken kan Onze Minister nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel26
  - number: '27.1'
    text: |-
      Het vaartijdenboek wordt door de gezagvoerend schipper bijgehouden overeenkomstig de daarin gestelde aanwijzingen.
      De aantekeningen worden naar waarheid ingevuld en zijn onuitwisbaar en duidelijk leesbaar aangebracht.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel27
  - number: '27.2'
    text: |-
      Indien op een dag twee of meer vaarten worden gemaakt en de samenstelling van de bemanning ongewijzigd blijft, kan
      worden volstaan met de vermelding van het tijdstip van aanvang van de eerste vaart in plaats van het tijdstip van
      aanvang van elke vaart op die dag en kan worden volstaan met het invullen van het tijdstip van het einde van de
      laatste vaart in plaats van het tijdstip van einde van elke vaart op die dag.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel27
  - number: '27.3'
    text: |-
      De in het vaartijdenboek vermelde bepaling, dat per reis kan worden volstaan met één schema voor het aantekenen van
      de rusttijden, is slechts van toepassing bij exploitatiewijze B. Bij de exploitatiewijzen A1 en A2 worden het begin
      en het einde van de rusttijd van elk bemanningslid iedere dag gedurende de reis aangetekend.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel27
  - number: '27.4'
    text: |-
      De na een wisseling van exploitatiewijze noodzakelijke aantekeningen worden op een nieuwe bladzijde van het
      vaartijdenboek aangebracht.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel27
  - number: '27.5'
    text: Tijdens de vaart is het vaartijdenboek in de stuurhut aanwezig.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel27
  - number: '27.6'
    text: |-
      De gezagvoerend schipper bewaart het overeenkomstig [artikel 26, zesde lid][ref1], ongeldig verklaarde
      vaartijdenboek gedurende 6 maanden nadat daarin de laatste aantekening is gesteld aan boord.


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel26
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '26'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '28.1'
    text: Het vaartijdenboek is niet vereist met betrekking tot, veerboten en veerponten.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel28
  - number: '28.2'
    text: |-
      De gezagvoerend schipper van een veerboot en een veerpont is verplicht ervoor te zorgen dat aan boord een
      scheepsjournaal aanwezig is, waarin de volgende gegevens worden vermeld:
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel28
  - number: 28.2.a
    text: de naam van het schip;
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel28
  - number: 28.2.b
    text: het begin en einde van de veerdienst van het schip;
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel28
  - number: 28.2.c
    text: het merk van de teboekstelling of het officiële scheepsnummer;
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel28
  - number: 28.2.d
    text: |-
      de leden van de bemanning bij het begin van de dagelijkse veerdienst van het schip met vermelding van naam en
      functie, en vervolgens telkens wanneer deze van samenstelling verandert.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel28
  - number: '29'
    text: |-
      Het bij of krachtens [de hoofdstukken II][ref1], [III][ref2], met uitzondering van [artikel 13][ref3], en de
      bijlage bepaalde, is niet van toepassing op zeeschepen die voldoen aan de bepalingen van Resolutie A.890 (21) van
      de Internationale Maritieme Organisatie van 25 november 1999 en het op 7 juli 1978 te Londen tot stand gekomen
      Verdrag betreffende de normen van zeevarenden inzake opleiding, diplomering en wachtdienst, met Bijlage, (*Trb.*
      1981, 144 en 1992, 109), mits: - het aantal bemanningsleden ten minste overeenkomt met de aantallen, opgenomen
      onder de exploitatiewijze B in [artikel 12][ref4];
        - er zich tijdens de vaart een persoon aan boord bevindt die voldoet aan artikel 18, eerste lid, onderdeel a, onder
      1° tot en met 3°.


      [ref1]: https://wetten.overheid.nl/BWBR0007124#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0007124#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0007124#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0007124#Artikel12
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0007124
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007124
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0007124
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0007124
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
  - number: '30'
    text: |-
      In geval van toepassing van [artikel 29][ref1] gelden de volgende voorschriften:


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel29
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '29'
        hoofdstuk: V
  - number: 30.a
    text: |-
      de bemanningsleden, bedoeld in [artikel 29, onderdeel a][ref1], zijn in het bezit van een verklaring als opgenomen
      in de bij dit besluit behorende bijlage IV, waaruit blijkt dat zij voldoen aan de eisen van vakbekwaamheid, bedoeld
      in de in [de aanhef van artikel 29][ref2] bedoelde regelingen;


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0007124#Artikel29
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '29'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0007124
        artikel: '29'
        hoofdstuk: V
  - number: 30.b
    text: |-
      de in artikel 29, onderdeel *b*, bedoelde persoon wordt na elke wacht van ten hoogste 14 uur vervangen door een
      persoon die voldoet aan [artikel 18, eerste lid, onderdeel a, onder 1° tot en met 3°][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel18
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '18'
        hoofdstuk: III
        paragraaf: '2'
  - number: 30.c
    text: |-
      de gezagvoerend schipper is verplicht ervoor te zorgen dat aan boord van het zeeschip een logboek aanwezig is
      en, voor zover het logboek daarin niet voorziet, een ander document waarin het aantal bemanningsleden wordt
      bijgehouden;
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel30
  - number: 30.d
    text: |-
      in het logboek of andere document, bedoeld in [onderdeel c][ref1], worden de volgende aantekeningen gemaakt:


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel30
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '30'
        hoofdstuk: V
  - number: 30.d.1°
    text: |-
      de namen van de personen die voldoen aan [artikel 18, eerste lid, onderdeel a, onder 1° tot en met 3°][ref1],
      alsmede het begin en het einde van hun wacht;


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel18
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '18'
        hoofdstuk: III
        paragraaf: '2'
  - number: 30.d.2°
    text: |-
      het begin, de onderbreking, de voortzetting en het einde van de vaart van het zeeschip, met telkens daarbij de
      vermelding van datum, tijdstip en plaats, alsmede, voor zover het zeeschip zich op de Rijn, de Lek of de Waal
      bevindt, van de kilometerraai.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel30
  - number: '35'
    text: |-
      Dit besluit en de [Wet vaartijden en bemanningssterkte binnenvaart][ref1] treden in werking op 1 januari 1995.


      [ref1]: https://wetten.overheid.nl/BWBR0006029
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006029
  - number: '36'
    text: 'Dit besluit kan worden aangehaald als: Besluit vaartijden en bemanningssterkte binnenvaart.'
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel36
