  - number: '12.2'
    text: |-
      De in de tabel in het eerste lid voorgeschreven matrozen mogen door lichtmatrozen worden vervangen, die een
      minimumleeftijd van 17 jaar hebben bereikt, zich ten minste in het derde leerjaar bevinden en een jaar vaartijd in
      de binnenvaart kunnen aantonen.
