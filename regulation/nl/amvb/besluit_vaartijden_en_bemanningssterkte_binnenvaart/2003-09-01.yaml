preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 8 juli 1994, Directoraat-Generaal van
    de Arbeid, Afdeling Wetgeving en Juridische Zaken, nr. DGA/AIB/WJZ/94/06022, gedaan mede namens Onze Minister van
    Verkeer en Waterstaat;

    Gelet op de artikelen 1, onderdeel d, en 5, eerste lid, van de Wet vaartijden en bemanningssterkte binnenvaart;

    Mede gelet op de Herziene Rijnvaartakte van 17 oktober 1868 (Trb. 1955, 161 en 1964, 83);

    Gezien de adviezen van de Sociaal-Economische Raad (adviezen van 28 juni 1985 en 20 januari 1989) en van de
    Emancipatieraad (advies van 21 juni 1984);

    De Raad van State gehoord (advies van 13 september 1994, no. W12.94.0452);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid van 5 december 1994, Directoraat-
    Generaal van de Arbeid, Afdeling Wetgeving en Juridische Zaken, nr. DGA/AIB/WJZ/94/09337A, uitgebracht mede namens
    Onze Minister van Verkeer en Waterstaat;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Voor de toepassing van het bij of krachtens dit besluit en de daarbij behorende bijlage bepaalde wordt verstaan
      onder:
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel1
  - number: 1.1.a
    text: |-
      wet: [Wet vaartijden en bemanningssterkte binnenvaart][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006029
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006029
  - number: 1.1.b
    text: |-
      motorschip: een schip dat is bestemd voor het vervoer van goederen en gebouwd om door middel van eigen mechanische
      voortstuwingsmiddelen zelfstandig te varen;
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel1
  - number: 1.1.c
    text: 'duwboot: een schip dat is gebouwd om te duwen en niet is bestemd voor het zelfstandig vervoeren van goederen;'
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel1
  - number: 1.1.d
    text: 'sleepschip: een schip dat is bestemd voor het vervoer van goederen, gebouwd om te worden gesleept en dat'
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel1
  - number: 1.1.d.1°
    text: niet is voorzien van eigen mechanische voortstuwingsmiddelen,
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel1
  - number: 1.1.d.2°
    text: |-
      wel is voorzien van eigen mechanische voortstuwingsmiddelen, die slechts voor verplaatsing van het schip over
      kleine afstanden geschikt zijn;
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel1
  - number: 1.1.e
    text: |-
      duwbak: een schip dat is bestemd voor het vervoer van goederen, gebouwd of geschikt gemaakt om te worden geduwd
      en dat
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel1
  - number: 1.1.e.1°
    text: niet is voorzien van eigen mechanische voortstuwingsmiddelen,
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel1
  - number: 1.1.e.2°
    text: |-
      wel is voorzien van eigen mechanische voortstuwingsmiddelen, die slechts voor verplaatsing van het schip over
      kleine afstanden geschikt zijn;
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel1
  - number: 1.1.f
    text: 'hecht samenstel: een duwstel of een gekoppeld samenstel;'
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel1
  - number: 1.1.g
    text: |-
      duwstel: een hecht samenstel van schepen, waarvan ten minste één is geplaatst voor het schip met motoraandrijving
      dat dient voor het voortbewegen van het samenstel, dan wel voor de beide schepen met motoraandrijving die dienen
      voor het voortbewegen van het samenstel. Hieronder wordt ook verstaan een duwstel dat is samengesteld uit een
      duwend en een geduwd schip waarvan de koppelingen een beheerst knikken mogelijk maken;
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel1
  - number: 1.1.h
    text: |-
      gekoppeld samenstel: een samenstelling van langszijde van elkaar vastgemaakte schepen, waarvan er geen is geplaatst
      vóór het schip met motoraandrijving dat dient voor het voortbewegen van het samenstel;
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel1
  - number: 1.1.i
    text: |-
      zeeschipbak: een duwbak die is gebouwd om aan boord van een zeeschip te worden vervoerd en om de binnenwateren
      te bevaren;
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel1
  - number: 1.1.j
    text: |-
      passagiersschip: een schip dat is gebouwd of bestemd voor het bedrijfsmatig vervoer van meer dan 12 personen buiten
      de bemanning, niet zijnde een veerboot of een veerpont;
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel1
  - number: 1.1.k
    text: 'hotelschip: een passagiersschip waarop zich hutten bevinden voor overnachting van passagiers;'
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel1
  - number: 1.1.l
    text: |-
      bunkerschip: een schip dat langszij andere schepen gaat in havens of gedurende de vaart, met als doel deze schepen
      te bevoorraden;
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel1
  - number: 1.1.m
    text: |-
      veerboot: een schip dat is gebouwd of bestemd voor het bedrijfsmatig vervoer van meer dan 12 personen buiten de
      bemanning, alsook van voertuigen op meer dan twee wielen, dat een veerdienst onderhoudt tussen plaatsen gelegen
      aan de Dollard, de Eems, de Waddenzee met inbegrip van de verbindingen met de Noordzee, of de Westerschelde en
      de zeemonding daarvan met inbegrip van de overige waterwegen tussen Zeeuwsch-Vlaanderen enerzijds en Walcheren en
      Zuid-Beveland anderzijds;
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel1
  - number: 1.1.n
    text: |-
      veerpont: een schip dat is gebouwd of bestemd voor het bedrijfsmatig vervoer van één of meer personen
      buiten de bemanning, dat een veerdienst onderhoudt tussen plaatsen gelegen aan de binnenwateren, bedoeld in
      [artikel 1, onderdeel ][ref1], van de wet, niet zijnde een veerboot;


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel1
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '1'
        hoofdstuk: I
  - number: 1.1.o
    text: 'lengte: de grootste lengte van de scheepsromp, het roer en de boegspriet niet inbegrepen;'
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel1
  - number: 1.1.p
    text: 'breedte: de grootste breedte gemeten op de buitenkant van de huidbeplating, schoepraderen niet inbegrepen;'
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel1
  - number: 1.1.q
    text: |-
      rusttijd: de tijd waarin een bemanningslid geen taak verricht noch daartoe verplicht is. De bewaking en het
      toezicht op een stilliggend schip worden niet beschouwd als taak in de zin van deze definitie;
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel1
  - number: 1.1.r
    text: |-
      exploitatiewijze A1: exploitatiewijze waarbij de vaartijd van een schip per 24 uur, blijkens de op die periode
      betrekking hebbende aantekening in het vaartijdenboek, bedoeld in [artikel 25, onderdeel a][ref1], ten hoogste 14
      uur dan wel overeenkomstig artikel 9, 16 uur bedraagt;


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel25
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '25'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 1.1.s
    text: |-
      exploitatiewijze A2: exploitatiewijze waarbij de vaartijd van een schip per 24 uur, blijkens de op die periode
      betrekking hebbende aantekening in het vaartijdenboek, bedoeld in [artikel 25, onderdeel a][ref1], ten hoogste 18
      uur bedraagt;


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel25
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '25'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 1.1.t
    text: |-
      exploitatiewijze B: exploitatiewijze waarbij de vaartijd van een schip per 24 uur, blijkens de op die periode
      betrekking hebbende aantekening in het vaartijdenboek, bedoeld in [artikel 25, onderdeel a][ref1], meer dan 18
      uur bedraagt;


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel25
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '25'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 1.1.u
    text: |-
      tachograaf: een registratie-apparaat ter controle van de naleving van bij of krachtens de wet gegeven
      voorschriften, van een door Onze Minister goedgekeurd model;
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel1
  - number: 1.1.v
    text: |-
      Scheepvaartinspectie: de Scheepvaartinspectie, bedoeld in [artikel 10 van de Schepenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel10
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: '10'
  - number: '1.2'
    text: |-
      Waar in dit besluit de aanduiding «jaar» wordt gebruikt in relatie tot vaartijd, wordt hieronder verstaan hetgeen
      als zodanig geldt op grond van artikel 23.01, vierde lid, van het Besluit Reglement onderzoek schepen op de Rijn
      1995.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel1
  - number: '2'
    text: |-
      Als lijn, bedoeld in [artikel 1, onderdeel d][ref1], van de wet, wordt aangewezen de lijn, vastgesteld bij
      koninklijk besluit van 2 juni 1982 (*Stb.* 363).


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel1
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '1'
        hoofdstuk: I
  - number: '3.1'
    text: |-
      Voor de toepassing van [dit hoofdstuk][ref1] wordt rekening gehouden met de rust- en vaartijden, vervuld gedurende
      een tijdvak van 48 uur, onmiddellijk voorafgaand aan het tijdstip waarop het schip de binnenwateren, bedoeld in
      [artikel 1, onderdeel d][ref2], van de wet is binnengevaren.


      [ref1]: https://wetten.overheid.nl/BWBR0007124#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0007124#Artikel1
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007124
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007124
        artikel: '1'
        hoofdstuk: I
  - number: '3.2'
    text: 'Een schip dat de in het eerste lid bedoelde binnenwateren binnenvaart is voorzien van:'
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel3
  - number: 3.2.a
    text: |-
      hetzij een vaartijdenboek als bedoeld in [artikel 25, onderdeel a][ref1], waaruit blijkt op welke wijze de
      rusttijden van elk der bemanningsleden alsmede de vaartijden van het schip, gedurende de in het eerste lid bedoelde
      periode zijn vervuld;


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel25
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '25'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 3.2.b
    text: |-
      hetzij een ander document waaruit de in [onderdeel a][ref1] bedoelde gegevens blijken.


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel3
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '4.1'
    text: Het is een bemanningslid verboden arbeid te verrichten in een toestand van oververmoeidheid.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel4
  - number: '4.2'
    text: Het is de gezagvoerend schipper verboden een bemanningslid in een zodanige toestand arbeid te laten verrichten.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel4
  - number: '5.1'
    text: |-
      De gezagvoerend schipper en diens werkgever organiseren de arbeid zodanig dat een bemanningslid geen arbeid
      verricht in strijd met [paragraaf 5.5 van het Arbeidstijdenbesluit vervoer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Paragraaf5.5
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009386
        paragraaf: '5.5'
  - number: '5.2'
    text: |-
      De gezagvoerend schipper en diens werkgever organiseren de arbeid van een bemanningslid aan boord van een
      havensleepboot gedurende de tijd dat dit schip dienst doet in havensleepdienst zodanig dat hij geen arbeid verricht
      in strijd met [paragraaf 6.6 van het Arbeidstijdenbesluit vervoer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Paragraaf6.6
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009386
        paragraaf: '6.6'
  - number: '7.1'
    text: |-
      Een wisseling van exploitatiewijze is slechts toegestaan met inachtneming van de volgende voorschriften: -
      van de exploitatiewijze A1 mag slechts dan naar de exploitatiewijze A2 worden gewisseld indien: de bemanning
      in zijn geheel is afgelost, of bij controle kan worden aangetoond dat de voor de exploitatiewijze A2 bestemde
      bemanningsleden onmiddellijk voor de wisseling een rusttijd van 8 uur, waarvan 6 uur buiten de vaartijd, in acht
      hebben genomen en de voor de exploitatiewijze A2 voorgeschreven minimumbemanning zich aan boord bevindt;
        - van de exploitatiewijze A2 mag slechts naar de exploitatiewijze A1 worden gewisseld indien: de bemanning
      in zijn geheel is afgelost, of bij controle kan worden aangetoond dat de voor de exploitatiewijze A1 bestemde
      bemanningsleden onmiddellijk voor de wisseling een onafgebroken rusttijd van 8 uur buiten de vaartijd in acht
      hebben genomen;
        - van de exploitatiewijze B mag slechts dan naar de exploitatiewijze A1 of A2 worden gewisseld indien: de
      bemanning in zijn geheel is afgelost, of bij controle kan worden aangetoond dat de voor de exploitatiewijze
      A1 respectievelijk A2 bestemde bemanningsleden onmiddellijk voor de wisseling een onafgebroken rusttijd van 8
      respectievelijk 6 uur in acht hebben genomen;
        - van de exploitatiewijze A1 of A2 mag slechts naar de exploitatiewijze B worden gewisseld indien: de bemanning
      in zijn geheel is afgelost, of bij controle kan worden aangetoond dat de voor de exploitatiewijze B bestemde
      bemanningsleden onmiddellijk voor de wisseling een onafgebroken rusttijd van 8 respectievelijk 6 uur buiten de
      vaartijd in acht hebben genomen, en de voor de exploitatiewijze B voorgeschreven minimumbemanning zich aan boord
      bevindt.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel7
  - number: '7.2'
    text: |-
      Een schip kan onmiddellijk in aansluiting op de exploitatiewijze A1 of A2 voor een verdere exploitatiewijze A1
      of A2 worden ingezet, indien een voltallige uitwisseling van de bemanning heeft plaatsgevonden en kan worden
      aangetoond dat de nieuwe bemanningsleden onmiddellijk voorafgaand aan de voortzetting van de exploitatiewijze A1 of
      A2 een ononderbroken rusttijd van 8, respectievelijk 6 uur buiten de vaartijd in acht genomen hebben.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel7
  - number: '7.3'
    text: |-
      Het aantonen van de rusttijd, bedoeld in het eerste en tweede lid, geschiedt door middel van hetzij een verklaring
      als bedoeld in [bijlage K van het Besluit Reglement onderzoek schepen op de Rijn 1995](onbekend), hetzij door een
      kopie van de pagina met aantekeningen van de vaar- respectievelijk rusttijden uit het vaartijdenboek van het schip,
      waarop de laatste reis van het bemanningslid heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel7
  - number: '9.1'
    text: |-
      Bij exploitatiewijze A1 mag de vaartijd van een schip ten hoogste eenmaal per kalenderweek tot ten hoogste 16
      uur worden verlengd indien: - het schip is uitgerust met een goed functionerende tachograaf die te allen tijde
      bereikbaar is voor de in de [artikelen 11, eerste lid][ref1], en [18, eerste lid, van de wet][ref2] bedoelde
      ambtenaren en in werking is gesteld vanaf het begin van de voorgaande ten minste 8 aaneengesloten uren durende
      onderbreking van de vaart; en
        - de bemanning uit ten minste een schipper en een stuurman bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0006029#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0006029#Artikel18
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006029
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0006029
        artikel: '18'
  - number: '9.2'
    text: |-
      Een sleepschip dat niet zelfstandig vaart, en een schip waarvan de voortstuwing in een hecht samenstel door een
      schip of meer andere schepen wordt verzorgd, mag worden geëxploiteerd overeenkomstig het eerste lid, aanhef, indien
      het schip of de schepen die zorgdragen voor de voortstuwing van het hecht samenstel of het sleepschip, voldoen aan
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel9
  - number: '10.1'
    text: |-
      Bij exploitatiewijze A1 onderbreekt een schip de vaart van 22.00 uur tot 6.00 uur, tenzij het schip
      is uitgerust met een goed functionerende tachograaf die te allen tijde bereikbaar is voor de in de
      [artikelen 11, eerste lid][ref1], en [18, eerste lid, van de wet][ref2] bedoelde ambtenaren en in werking is
      gesteld vanaf het begin van de voorgaande ten minste 8 aaneengesloten uren durende onderbreking van de vaart. In
      dat geval wordt de vaart onderbroken gedurende ten minste 8 aaneengesloten uren in elke periode van 24 uur, te
      rekenen vanaf het einde van iedere onderbreking van ten minste 8 uur.


      [ref1]: https://wetten.overheid.nl/BWBR0006029#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0006029#Artikel18
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006029
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0006029
        artikel: '18'
  - number: '10.2'
    text: |-
      Bij exploitatiewijze A2 onderbreekt een schip de vaart van 23.00 uur tot 5.00 uur, tenzij het schip
      is uitgerust met een goed functionerende tachograaf die te allen tijde bereikbaar is voor de in de
      [artikelen 11, eerste lid][ref1], en [18, eerste lid, van de wet][ref2] bedoelde ambtenaren en in werking is
      gesteld vanaf het begin van de voorgaande ten minste 6 aaneengesloten uren durende onderbreking van de vaart. In
      dat geval wordt de vaart onderbroken gedurende ten minste 6 aaneengesloten uren in elke periode van 24 uur, te
      rekenen vanaf het einde van iedere onderbreking van ten minste 6 uur.


      [ref1]: https://wetten.overheid.nl/BWBR0006029#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0006029#Artikel18
    url: https://wetten.overheid.nl/BWBR0007124/2003-09-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006029
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0006029
        artikel: '18'
  - number: '10.3'
    text: |-
      Het eerste en het tweede lid zijn van toepassing op een sleepschip dat niet zelfstandig vaart, of een schip
      waarvan de voortstuwing in een hecht samenstel door een schip of meer andere schepen wordt verzorgd, indien
      het schip of de schepen die zorgdragen voor de voortstuwing van het samenstel, zijn uitgerust met een goed
      functionerende tachograaf die te allen tijde bereikbaar is voor de in de [artikelen 11, eerste lid][ref1], en
      [18, eerste lid, van de wet][ref2] bedoelde ambtenaren en inwerking is gesteld vanaf het begin van de voorgaande
      ten minste 8 respectievelijk 6 aaneengesloten uren durende onderbreking van de vaart.


