preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 17 juni 1992, no. J. 928199,
    Directie Juridische en Bedrijfsorganisatorische Zaken, gedaan mede namens de Minister van Economische Zaken;

    Overwegende dat regels moeten worden gesteld ter uitvoering van de Verordening (EEG) 2092/91 van de Raad van de
    Europese Gemeenschappen van 24 juni 1991 (PbEG 1991, L198), inzake de biologische produktiemethode en aanduidingen
    dienaangaande op landbouwprodukten en levensmiddelen;

    Gelet op de artikelen 2, 3, 7, 8, 9 en 12 van de Landbouwkwaliteitswet (Stb. 1971, 371);

    Gehoord:

    -. het Landbouwschap;

    -. het Produktschap voor Groenten en Fruit;

    -. het Produktschap voor Vee en Vlees;

    -. het Produktschap voor Zuivel;

    -. het Produktschap voor Pluimvee en Eieren;

    -. het Hoofdproduktschap voor Akkerbouwprodukten;

    -. de Consumentenbond;

    -. het Konsumentenkontakt;

    -. de Stichting Skal;

    -. het Platform Biologische Landbouw en Voeding;

    -. de Vereniging voor Biologisch-Dynamische Landbouw;

    -. de Nederlandse Vereniging voor Ekologische Landbouw;

    -. het Centraal Bureau Tuinbouwveilingen;

    De Raad van State gehoord (advies van 28 juli 1992, no. W11.92.0273);

    Gezien het nader rapport van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 17 november 1992,
    No. J. 9213960, Directie Juridische en Bedrijfsorganisatorische Zaken, uitgebracht mede namens Onze Minister van
    Economische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005740/1998-03-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      wet: [Landbouwkwaliteitswet][ref1] (*Stb.* 1971, 371);

      Onze Minister: Onze Minister van Landbouw, Natuurbeheer en Visserij;

      biologische produktiemethode: voortbrenging van plantaardige en dierlijke landbouwprodukten en houden van
      dieren overeenkomstig de bij of krachtens de [Verordening (EEG) 2092/91](31991R2092) van de Raad van de Europese
      Gemeenschappen van 24 juni 1991 (*PbEG* 1991, L198), zoals deze is of zal komen te luiden, gestelde voorschriften;

      bereiding: alle handelingen van verwerking, verduurzaming en verpakking van landbouwprodukten;

      ingrediënten: stoffen, met inbegrip van additieven, welke worden gebruikt voor de bereiding van produkten bestemd
      voor menselijke voeding en die, al dan niet in gewijzigde vorm, aanwezig blijven in het eindprodukt;

      verhandelen: bedrijfsmatig in voorraad hebben, voorhanden hebben of te koop aanbieden, verkopen of afleveren;

      invoer: invoer als bedoeld in [artikel 1, eerste lid, van de In- en uitvoerwet][ref2];

      derde landen: landen die geen deel uitmaken van de Europese Unie.

      2 Het bepaalde bij of krachtens dit besluit is niet van toepassing op goederen die op regelmatige wijze zijn
      aangebracht en aangegeven of op regelmatige wijze zijn aangebracht onder geleide van een document voor communautair
      douanevervoer en die nog niet zijn vrijgegeven voor een van de douaneregelingen als bedoeld in artikel 4, onderdeel
      16, onder a, d of f, van [verordening (EEG) nr. 2913/92](31992R2913) van de Raad van de Europese Gemeenschappen van
      12 oktober 1992 tot vaststelling van het communautair douanewetboek (PbEG L 302).

      3 Het bepaalde bij of krachtens dit besluit is slechts van toepassing met betrekking tot produkten waarvoor regels
      als bedoeld in [artikel 2, eerste lid][ref3], zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002755
      [ref2]: https://wetten.overheid.nl/BWBR0002376#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005740#Artikel2
    url: https://wetten.overheid.nl/BWBR0005740/1998-03-20#Artikel1
    references:
