        bwb_id: BWBR0005740
        artikel: '7'
  - number: '11'
    text: |-
      1 Dit besluit treedt in werking met ingang van 1 januari 1993.

      2 Dit besluit kan worden aangehaald als Landbouwkwaliteitsbesluit biologische produktiemethode.
    url: https://wetten.overheid.nl/BWBR0005740/1998-03-20#Artikel11
