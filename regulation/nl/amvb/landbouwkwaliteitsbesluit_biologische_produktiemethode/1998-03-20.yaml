        artikel: '2'
  - number: '2'
    text: |-
      1 Onze Minister kan nadere regels stellen ten aanzien van het aanmerken van bepaalde methoden voor de voortbrenging
      van produkten als biologische produktiemethoden.

      2 Onze Minister stelt regels vast voor het gebruik van aanduidingen en vermeldingen welke verwijzen naar de
      biologische produktiemethoden als bedoeld in het eerste lid en in het bijzonder voor het gebruik van de term
      "biologisch".
    url: https://wetten.overheid.nl/BWBR0005740/1998-03-20#Artikel2
  - number: '3'
    text: |-
      1 Tenzij is voldaan aan het bij of krachtens dit besluit bepaalde, is het verboden bij het verhandelen van
      produkten en bij de reclame voor produkten, de term "biologisch" te bezigen, dan wel andere aanduidingen of
      vermeldingen te bezigen, welke verwijzen naar biologische produktiemethoden of die de koper van dergelijke
      produkten kunnen doen aannemen dat de betreffende produkten of ingrediënten daarvan zijn verkregen overeenkomstig
      de regels, bedoeld in [artikel 2, eerste lid][ref1].

      2 Het is verboden de krachtens [artikel 6][ref2] vastgestelde merken, tekenen of bewijsstukken te bezigen in strijd
      met het bepaalde bij of krachtens dit besluit.

      3 Het is verboden voor landbouwprodukten en levensmiddelen merken, tekenen of bewijsstukken te bezigen welke sterk
      gelijken op de in het tweede lid bedoelde merken, tekenen of bewijsstukken.


      [ref1]: https://wetten.overheid.nl/BWBR0005740#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005740#Artikel6
    url: https://wetten.overheid.nl/BWBR0005740/1998-03-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005740
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005740
        artikel: '6'
  - number: '4'
    text: |-
      1 Iedere in Nederland gevestigde natuurlijke of rechtspersoon die produkten, waarvoor aanduidingen of vermeldingen
      worden gebezigd die verwijzen naar biologische produktiemethoden of waarvan het in de bedoeling ligt om daarvoor
      dergelijke aanduidingen te bezigen, produceert, bereidt of met het oog op verhandeling in Nederland invoert, dient
      zich aan te sluiten bij de in [artikel 7][ref1] genoemde controle-instelling.

      2 De in [artikel 7][ref2] genoemde controle-instelling stelt een reglement vast omtrent de inhoud en het verloop
      van de door haar uit te oefenen controles. Onze Minister kan nadere regels vaststellen omtrent de in dit reglement
      vast te leggen voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0005740#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005740#Artikel7
    url: https://wetten.overheid.nl/BWBR0005740/1998-03-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005740
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005740
        artikel: '7'
  - number: '5'
    text: |-
      1 Onze Minister kan bepalen dat overeenkomstig de biologische produktiemethoden voortgebrachte produkten aan een
      keuring kunnen of moeten worden onderworpen.

      2 Onze Minister kan nadere regels stellen inzake de keuring.
    url: https://wetten.overheid.nl/BWBR0005740/1998-03-20#Artikel5
  - number: '6'
    text: |-
      1 Onze Minister kan voor produkten, die zijn voortgebracht overeenkomstig het bij of krachtens dit besluit
      bepaalde, merken, tekenen of bewijsstukken als bedoeld in artikel 7 van de wet vaststellen. Het aanbrengen van deze
      merken, tekenen en bewijsstukken is uitsluitend toegestaan aan aangeslotenen bij de in [artikel 7][ref1] genoemde
      controle-instelling.

      2 Onze Minister kan regelen vaststellen betreffende het vervaardigen, voorhanden en in voorraad hebben, zomede
      het afleveren en gebruiken van de in het eerste lid bedoelde merken, tekenen en bewijsstukken, en van de clichés,
      stempels en andere werktuigen tot het vervaardigen of aanbrengen van die merken, tekenen of bewijsstukken.


      [ref1]: https://wetten.overheid.nl/BWBR0005740#Artikel7
    url: https://wetten.overheid.nl/BWBR0005740/1998-03-20#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005740
        artikel: '7'
  - number: '7'
    text: |-
      De Stichting Skal te Zwolle is

      a. belast met het toezicht op de naleving door de bij haar aangeslotenen van het bij of krachtens dit besluit
      bepaalde;

      b. belast met de in [artikel 5][ref1] bedoelde keuring van overeenkomstig de biologische produktiemethode
      voortgebrachte produkten;

      c. bevoegd tot het uitreiken van de in [artikel 6][ref2] bedoelde merken, tekenen en bewijsstukken aan de bij haar
      aangeslotenen.


      [ref1]: https://wetten.overheid.nl/BWBR0005740#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005740#Artikel6
    url: https://wetten.overheid.nl/BWBR0005740/1998-03-20#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005740
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005740
        artikel: '6'
  - number: '8'
    text: |-
      Indien de controle-instelling constateert dat met betrekking tot een produkt of produktpartij,
      waarvoor aanduidingen, vermeldingen of merken, tekenen en bewijsstukken worden gebezigd als bedoeld in
      [artikel 2, tweede lid][ref1], en 6, eerste lid, het bepaalde bij of krachtens dit besluit door een bij haar
      aangeslotene niet wordt nageleefd, legt zij de betreffende aangeslotene de verplichting op om het merk dan wel de
      aanduidingen of vermeldingen van de betreffende produkten te verwijderen of te doen verwijderen.


      [ref1]: https://wetten.overheid.nl/BWBR0005740#Artikel2
    url: https://wetten.overheid.nl/BWBR0005740/1998-03-20#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005740
        artikel: '2'
  - number: '9'
    text: |-
      1 De voorzitter van de in [artikel 7][ref1] genoemde controle-instelling wordt door Onze Minister telkens voor ten
      hoogste vier jaar benoemd. Hij is terstond weder benoembaar.

      2 Het bestuur van de in [artikel 7][ref2] genoemde instelling doet aan Onze Minister een voordracht voor de
      benoeming.

      3 De voorzitter mag niet rechtstreeks betrokken zijn bij de produktie of verhandeling van produkten, welke via
      biologische produktiemethoden worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005740#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005740#Artikel7
    url: https://wetten.overheid.nl/BWBR0005740/1998-03-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005740
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005740
        artikel: '7'
  - number: '10'
    text: |-
      1 Onze Minister kan vrijstelling en, op aanvrage, ontheffing verlenen van het bepaalde bij of krachtens dit
      besluit.

      2 Een vrijstelling als bedoeld in het eerste lid wordt slechts verleend voor zover dit geen strijd oplevert met het
      bepaalde in [Verordening (EEG) 2092/91](31991R2092) van de Raad van de Europese Gemeenschappen (*PbEG* 1991, L198)
      inzake biologische produktiemethoden en aanduidingen dienaangaande op landbouwprodukten en levensmiddelen.

      3 Onze Minister kan de bevoegdheid tot het verlenen van een vrijstelling of ontheffing als bedoeld in het eerste
      lid delegeren aan de in [artikel 7][ref1] genoemde controle-instelling. Hij kan voorts bepalen dat een besluit,
      waarbij een zodanige vrijstelling wordt verleend, de goedkeuring behoeft van een door hem aangewezen autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0005740#Artikel7
    url: https://wetten.overheid.nl/BWBR0005740/1998-03-20#Artikel10
    references:
