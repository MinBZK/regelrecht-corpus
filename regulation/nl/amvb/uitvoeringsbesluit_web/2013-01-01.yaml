    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel2.1.2
  - number: 2.1.3
    text: |-
      Binnen het raam van de door de begrotingswetgever voor het desbetreffende kalenderjaar beschikbaar gestelde
      middelen, stelt Onze Minister jaarlijks de omvang vast van de landelijk beschikbare budgetten voor de
      exploitatiekosten en voor de huisvestingskosten voor zowel het beroepsonderwijs als het voorbereidend
      beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel2.1.3
  - number: 2.2.1.1
    text: |-
      Onze Minister stelt jaarlijks de omvang vast van het landelijk beschikbare budget ten behoeve van voorbereidende
      en ondersteunende activiteiten als bedoeld in [artikel 7.2.2, vierde lid, van de wet][ref1] en van het landelijke
      beschikbare budget ten behoeve van de toepassing van [artikel 2.2.4, tweede lid][ref2], dat in mindering wordt
      gebracht op het landelijk beschikbare budget voor de exploitatiekosten voor het beroepsonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0010646
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.2.1.2
    text: |-
      Het na toepassing van het eerste lid resterende deel van het landelijk beschikbare budget voor de exploitatiekosten
      voor het beroepsonderwijs voor een kalenderjaar wordt verdeeld als volgt:
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel2.2.1
  - number: 2.2.1.2.a
    text: 80% wordt toegerekend aan het landelijk deel ten behoeve van de maatstaf ingeschreven deelnemers, en
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel2.2.1
  - number: 2.2.1.2.b
    text: 20% wordt toegerekend aan het landelijk deel ten behoeve van de maatstaf diploma's beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel2.2.1
  - number: 2.2.2.1
    text: |-
      Onze Minister berekent de rijksbijdrage voor een instelling voor de exploitatiekosten voor het beroepsonderwijs
      voor een kalenderjaar door bij elkaar op te tellen:
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel2.2.2
  - number: 2.2.2.1.a
    text: het rijksbijdragedeel op grond van de maatstaf ingeschreven deelnemers,
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel2.2.2
  - number: 2.2.2.1.b
    text: |-
      het rijksbijdragedeel op grond van de maatstaf diploma’s beroepsonderwijs vermeerderd met het rijksbijdragedeel op
      grond van de diploma’s, bedoeld in [artikel 2.2.4, tweede lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.2.2.1.c
    text: het rijksbijdragedeel ten behoeve van voorbereidende en ondersteunende activiteiten,
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel2.2.2
  - number: 2.2.2.2
    text: |-
      De op grond van het eerste lid berekende rijksbijdrage wordt vermeerderd met het rijksbijdragedeel voor
      gehandicapte deelnemers, zoals dat wordt berekend op grond van [artikel 2.6a.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 6a
  - number: 2.2.2.3
    text: |-
      De op grond van het eerste en tweede lid berekende rijksbijdrage kan worden aangepast in verband met uit de
      rijksbegroting voortvloeiende maatregelen.
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel2.2.2
  - number: 2.2.3.1
    text: |-
      Onze Minister berekent het rijksbijdragedeel op grond van de maatstaf ingeschreven deelnemers volgens de formule:
      In deze formule wordt de teller van de breuk afgerond op twee decimalen en wordt verstaan onder: i: opleiding
      verzorgd aan de desbetreffende instelling, n: het aantal opleidingen verzorgd aan de desbetreffende instelling,
      DDi1: het aantal deeltijds deelnemers aan de beroepsopleidende leerweg dat op 1 oktober van het tweede kalenderjaar
      voorafgaand aan het desbetreffende jaar aan de desbetreffende instelling is ingeschreven voor een opleiding als
      bedoeld in het tweede lid, onder b, en daadwerkelijk die opleiding volgt, vermeerderd met het aantal deelnemers aan
      de beroepsbegeleidende leerweg dat op 1 oktober van het tweede kalenderjaar voorafgaand aan het desbetreffende jaar
      aan de desbetreffende instelling voor de desbetreffende opleiding is ingeschreven en daadwerkelijk die opleiding
      volgt, voor zover de laatstgenoemde deelnemers:
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel2.2.3
  - number: 2.2.3.1.a
    text: |-
      uiterlijk op 31 december van datzelfde kalenderjaar een overeenkomst als bedoeld in
      [artikel 7.2.8, tweede lid, van de wet][ref1] hebben gesloten, en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 2.2.3.1.b
    text: |-
      indien zij een opleiding volgen als bedoeld in het tweede lid, onder b, uiterlijk op 1 juni van het daaropvolgende
      kalenderjaar, dan wel in geval zij een andere opleiding volgen uiterlijk op dezelfde datum als genoemd onder a,
      daadwerkelijk de opleiding in de praktijk van het beroep, bedoeld in [artikel 7.2.8, eerste lid, van de wet][ref1],
      volgen op de grondslag van een overeenkomst als bedoeld onder a,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 2.2.3.2
    text: 'De deeltijdfactor, bedoeld in het eerste lid, onder DFi1, bedraagt:'
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel2.2.3
  - number: 2.2.3.2.a
    text: 'voor opleidingen die worden bekostigd door Onze minister van Economische Zaken, Landbouw en Innovatie: 0,5;'
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel2.2.3
  - number: 2.2.3.2.b
    text: |-
      voor opleidingen die worden bekostigd door Onze Minister van Onderwijs, Cultuur en Wetenschap, voor zover voor
      die opleidingen kwalificaties als bedoeld in [artikel 7.2.4, eerste lid, van de wet][ref1] zijn vastgesteld in
      overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport: 0,8 en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 2.2.3.2.c
    text: 'voor de overige opleidingen: 0,4.'
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel2.2.3
  - number: 2.2.3.3
    text: 'De deeltijdfactor, bedoeld in het eerste lid onder DFi2, bedraagt:'
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel2.2.3
  - number: 2.2.3.3.a
    text: 'voor de opleidingen die worden bekostigd door Onze Minister van Economische Zaken, Landbouw en Innovatie: 0,4,'
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel2.2.3
  - number: 2.2.3.3.b
    text: 'voor de opleidingen die worden bekostigd door Onze Minister van Onderwijs, Cultuur en Wetenschap: 0,3.'
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel2.2.3
  - number: 2.2.3.4
    text: |-
      Bij ministeriële regeling worden de prijsfactoren vastgesteld voor opleidingen waarvoor kwalificaties als bedoeld
      in [artikel 7.2.4, eerste lid, van de wet][ref1] zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 2.2.3.5
    text: |-
      Deelnemers aan de beroepsbegeleidende leerweg worden in de berekening, bedoeld in het eerste lid, niet geteld
      onder DDi2, voor zover zij in die berekening voor de desbetreffende instelling voor een van de drie voorafgaande
      kalenderjaren al onder DDi2 werden geteld.
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel2.2.3
  - number: 2.2.3.6
    text: |-
      De correctiefactor wordt berekend volgens de formule:





                    [(DDi1.1 x DFi1.2) + VDi] + [(DDi1.2 x DFi1.2) + VDi2]




                    ———————————————————————




                    2 x [(DDi1.1 x DFi1.2) + VDi]




           In deze formule wordt verstaan onder: - DDi1.1: het aantal deeltijds deelnemers dat op 1 oktober van het
      tweede kalenderjaar voorafgaand aan het desbetreffende jaar aan de desbetreffende instelling is ingeschreven en
      daadwerkelijk de desbetreffende opleidingen volgt,
        - VDi: het aantal voltijds deelnemers dat op 1 oktober van het tweede kalenderjaar voorafgaand aan het
      desbetreffende jaar aan de desbetreffende instelling is ingeschreven en daadwerkelijk de desbetreffende opleidingen
      volgt,
        - DDi1.2: het aantal deeltijds deelnemers dat op 1 februari van het kalenderjaar voorafgaand aan het desbetreffende
      jaar aan de desbetreffende instelling is ingeschreven en daadwerkelijk de desbetreffende opleidingen volgt,
        - VDi2: het aantal voltijds deelnemers dat op 1 februari van het kalenderjaar voorafgaand aan het desbetreffende
      jaar aan de desbetreffende instelling is ingeschreven en daadwerkelijk de desbetreffende opleidingen volgt,
        - DFi1.2: de op grond van het zevende lid toegekende deeltijdfactor.
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel2.2.3
  - number: 2.2.3.7
    text: 'De deeltijdfactor, bedoeld in het zesde lid, onder DFi1.2, bedraagt voor:'
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel2.2.3
  - number: 2.2.3.7.a
    text: |-
      een instelling die opleidingen verzorgt die worden bekostigd door Onze minister van Economische Zaken, Landbouw en
      Innovatie: 0,5;
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel2.2.3
  - number: 2.2.3.7.b
    text: |-
      een instelling die opleidingen verzorgt die worden bekostigd door Onze Minister van Onderwijs, Cultuur en
      Wetenschap: 0,35.
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel2.2.3
  - number: 2.2.4.1
    text: |-
      Onze Minister berekent het rijksbijdragedeel op grond van de maatstaf diploma's beroepsonderwijs volgens
      de formule: DI.1 + 2DI.2 + 4DI.3 ----------------------------------- x LMD LD.1 + 2LD.2 + 4LD.3 In deze
      formule wordt verstaan onder: DI.1: het aantal diploma's beroepsonderwijs dat aan die instelling is
      behaald in het tweede kalenderjaar voorafgaand aan het desbetreffende jaar bij opleidingen als bedoeld in
      [artikel 7.2.2, eerste lid, onder a, van de wet][ref1], DI.2: het aantal diploma's beroepsonderwijs dat aan die
      instelling is behaald in het tweede kalenderjaar voorafgaand aan het desbetreffende jaar bij opleidingen als
      bedoeld in [artikel 7.2.2, eerste lid, onder b, van de wet][ref2], DI.3: het aantal diploma's beroepsonderwijs dat
      aan die instelling is behaald in het tweede kalenderjaar voorafgaand aan het desbetreffende jaar bij opleidingen
      als bedoeld in [artikel 7.2.2, eerste lid, onder c tot en met e, van de wet][ref3], LD.1: het aantal diploma's
      beroepsonderwijs dat landelijk is behaald in het tweede kalenderjaar voorafgaand aan het desbetreffende jaar bij
      opleidingen als bedoeld in [artikel 7.2.2, eerste lid, onder a, van de wet][ref4], LD.2: het aantal diploma's
      beroepsonderwijs dat landelijk is behaald in het tweede kalenderjaar voorafgaand aan het desbetreffende jaar bij
      opleidingen als bedoeld in [artikel 7.2.2, eerste lid, onder b, van de wet][ref5], LD.3: het aantal diploma's
      beroepsonderwijs dat landelijk is behaald in het tweede kalenderjaar voorafgaand aan het desbetreffende jaar
      bij opleidingen als bedoeld in [artikel 7.2.2, eerste lid, onder c tot en met e, van de wet][ref6], en LMD: het
      landelijk deel ten behoeve van de maatstaf diploma's beroepsonderwijs, zoals dat voor het desbetreffende jaar is
      vastgesteld op grond van [artikel 2.2.1, tweede lid, onder b][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
