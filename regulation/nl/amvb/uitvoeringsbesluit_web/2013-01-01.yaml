  - number: 6.3.1.1
    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip wordt het rijksbijdragedeel voor het kenniscentrum voor
      zover het betreft het gedeelte van het landelijk beschikbare budget voor de taken rond de leerbedrijven en de
      beroepspraktijkvorming in afwijking van [artikel 4.2.4][ref1] berekend volgens de formule: waarbij wordt verstaan
      onder: 'KE: het aantal door het kenniscentrum erkende leerbedrijven op 1 oktober van het tweede jaar voorafgaand'
      aan het bekostigingsjaar, LE: het aantal erkende leerbedrijven van alle kenniscentra tezamen op 1 oktober van het
      tweede jaar voorafgaand aan het bekostigingsjaar, KDe: het aantal deelnemers dat op 1 oktober van het tweede jaar
      voorafgaand aan het bekostigingsjaar is ingeschreven voor een beroepsopleiding, gericht op een kwalificatie die
      op voorstel van het kenniscentrum is vastgesteld, LDe: het aantal deelnemers dat op 1 oktober van het tweede jaar
      voorafgaand aan het bekostigingsjaar is ingeschreven voor een beroepsopleiding, LBb: het deel van het landelijk
      beschikbare budget, bedoeld in [artikel 4.2.1, onder b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel4
