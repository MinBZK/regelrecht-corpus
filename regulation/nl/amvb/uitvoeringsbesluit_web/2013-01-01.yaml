  - number: 6.1.4.1
    text: |-
      Indien het verschil van de berekening, bedoeld in [artikel 2.2.2, eerste lid][ref1], met toepassing van
      [artikel 2.2.3][ref2] zoals dat met ingang van 1 oktober 2006 is komen te luiden, en de overeenkomstige berekening
      met toepassing van [artikel 2.2.3][ref3] zoals dat luidde op 30 september 2006, voor het kalenderjaar 2008 negatief
      is en meer bedraagt dan twee procent van de laatstgenoemde berekening, wordt dit meerdere in aanvulling gebracht op
      de rijksbijdrage, bedoeld in [artikel 2.2.2, eerste lid][ref4], voor dat kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
