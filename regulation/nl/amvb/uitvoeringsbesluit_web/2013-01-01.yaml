  - number: 6.1.3.2
    text: |-
      Indien de op grond van [artikel 2.4.1, eerste lid][ref1], voor een agrarisch opleidingscentrum vastgestelde
      rijksbijdrage ten behoeve van de huisvestingskosten voor een kalenderjaar van de desbetreffende instelling,
      vermeerderd met het gedeelte van de rijksbijdrage, berekend op grond van [artikel 2.4.1, derde lid][ref2], minder
      bedraagt dan het op grond van artikel 4, alsmede in voorkomende gevallen op grond van artikel 7 van de Regeling
      bekostiging huisvesting bve-sector voor het desbetreffende kalenderjaar vastgestelde bedrag voor de desbetreffende
      instelling, ontvangt de instelling voor het desbetreffende kalenderjaar een aanvulling tot dat bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel6.1.3
