      [artikel 2.2.4, eerste lid][ref2], respectievelijk [artikel 2.2.5][ref3], leidt tot een gelijke of hogere waarde
      dan vastgesteld op grond van het tweede lid, onderdelen a, b respectievelijk c, wordt de vergoeding van de
