  - number: 2.2.7.1
    text: |-
      De gegevens, bedoeld in [artikel 2.5.5a, tweede lid, onderdelen a, b, c, d, h, i, l, m en n, van de wet][ref1]
      en de verklaring, bedoeld in [artikel 2.2.4, vijfde lid, van de wet][ref2] worden uiterlijk 1 juli van het jaar
      voorafgaand aan het bekostigingsjaar ingediend bij Onze Minister. Indien Onze Minister van een instelling de
      gegevens, bedoeld in de eerste volzin, niet uiterlijk 1 juli van het jaar voorafgaand aan het bekostigingsjaar,
      voorzien van een goedkeurende accountantsverklaring, heeft ontvangen en hierdoor niet tijdig over de gegevens
      kan beschikken, kan Onze Minister de hoogte van de rijksbijdrage voor deze instelling voor het desbetreffende
      kalenderjaar vaststellen conform de voorschriften in het tweede tot en met zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel2.2.7
    references:
