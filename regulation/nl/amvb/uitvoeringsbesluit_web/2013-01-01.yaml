        artikel: '2'
  - number: 2.2.7.2
    text: |-
      Bij de toepassing van [artikel 2.2.2][ref1] wordt voor een instelling als bedoeld in het eerste lid, bij de
      berekening van de rijksbijdrage voor exploitatiekosten voor het beroepsonderwijs:


      [ref1]: https://wetten.overheid.nl/BWBR0010646
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel2.2.7
    references:
