    text: |-
      De [paragrafen 1 tot en met 3][ref1] zijn van toepassing op de kenniscentra beroepsonderwijs bedrijfsleven,
      bedoeld in [artikel 1.1.1, onderdeel b1, van de wet][ref2], met uitzondering van het kenniscentrum beroepsonderwijs
      bedrijfsleven op het gebied van landbouw, natuurlijke omgeving en voedsel voor zover niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4.1.1
    references:
      - id: ref1
        bwb_id: BWBR0010646
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 4.1.1.2
    text: |-
      [ Paragraaf 4][ref1] is van toepassing op het kenniscentrum beroepsonderwijs bedrijfsleven op het gebied van
      landbouw, natuurlijke omgeving en voedsel.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4.1.1
    references:
      - id: ref1
        bwb_id: BWBR0010646
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 4.1.2
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4.1.2
  - number: 4.1.2.a
    text: |-
      kenniscentrum: een kenniscentrum beroepsonderwijs bedrijfsleven als bedoeld in
      [artikel 1.1.1, onderdeel b1, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4.1.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 4.1.2.b
    text: |-
      leerbedrijf: een bedrijf dat of organisatie die bevoegd is de beroepspraktijkvorming te verzorgen, op
      basis van een gunstige beoordeling op grond van door het kenniscentrum vastgestelde criteria als bedoeld in
      [artikel 7.2.10 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4.1.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 4.1.2.c
    text: |-
      beroepsopleiding: een beroepsopleiding van een instelling als bedoeld in
      [artikel 1.1.1, onderdeel b1° of b2°, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4.1.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 4.1.2.d
    text: |-
      landelijke kwalificatiestructuur: de kwalificatiestructuur, bedoeld in [artikel 7.2.4 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4.1.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 4.1.4
    text: |-
      Binnen het raam van de door de begrotingswetgever voor het desbetreffende kalenderjaar beschikbaar gestelde
      middelen, stelt Onze Minister jaarlijks de omvang vast van het landelijk beschikbare budget voor de
      exploitatiekosten en voor de huisvestingskosten van de kenniscentra.
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4.1.4
  - number: 4.2.1
    text: |-
      Het landelijk beschikbare budget voor de exploitatiekosten en de huisvestingskosten van de kenniscentra wordt
      verdeeld in:
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4.2.1
  - number: 4.2.1.a
    text: |-
      een gedeelte van 20% voor de de taken rond de kwalificatiestructuur bedoeld in
      [artikel 1.5.2, eerste en tweede lid, van de wet][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 4.2.1.b
    text: |-
      een gedeelte van 80% voor de taken rond de leerbedrijven en de beroepspraktijkvorming bedoeld in
      [artikel 1.5.2, derde en vierde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 4.2.2.1
    text: |-
      Onze Minister berekent de rijksbijdrage voor de exploitatiekosten en de huisvestingskosten voor een kenniscentrum
      voor een kalenderjaar door bij elkaar op te tellen:
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4.2.2
  - number: 4.2.2.1.a
    text: het rijksbijdragedeel voor de taken rond de kwalificatiestructuur en
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4.2.2
  - number: 4.2.2.1.b
    text: het rijksbijdragedeel voor de taken rond de leerbedrijven en de beroepspraktijkvorming,
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4.2.2
  - number: 4.2.2.2
    text: De uitkomst van de berekening, bedoeld in het eerste lid, wordt rekenkundig afgerond op hele euro’s.
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4.2.2
  - number: 4.2.2.3
    text: |-
      De op grond van het eerste lid berekende rijksbijdrage kan worden aangepast in verband met uit de rijksbegroting
      voortvloeiende maatregelen.
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4.2.2
  - number: 4.2.3.1
    text: |-
      Onze Minister berekent het rijksbijdragedeel voor het kenniscentrum voor zover het betreft het gedeelte van het
      landelijk beschikbare budget voor de taken rond de kwalificatiestructuur volgens de formule: waarbij wordt verstaan
      onder: 'KDo: het gemiddelde aantal kwalificatiedossiers dat op voorstel van het kenniscentrum is vastgesteld en'
      in de vijf jaren, voorafgaand aan het bekostigingsjaar, deel uitmaakte van de landelijke kwalificatiestructuur,
      LDo: het gemiddelde aantal kwalificatiedossiers dat in de vijf jaren, voorafgaand aan het bekostigingsjaar, deel
      uitmaakte van de landelijke kwalificatiestructuur, KKw: het gemiddelde aantal kwalificaties dat op voorstel van
      het kenniscentrum is vastgesteld en in de vijf jaren, voorafgaand aan het bekostigingsjaar, deel uitmaakte van de
      landelijke kwalificatiestructuur, LKw: het gemiddelde aantal kwalificaties dat in de vijf jaren, voorafgaand aan
      het bekostigingsjaar, deel uitmaakte van de kwalificatiestructuur en LBa: het deel van het landelijk beschikbare
      budget, bedoeld in [artikel 4.2.1, onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4.2.3
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.2.3.2
    text: |-
      Indien een kwalificatiedossier op voorstel van 2 of meer kenniscentra is vastgesteld, tellen het
      kwalificatiedossier en de daarin opgenomen kwalificaties bij de berekening, bedoeld in het eerste lid voor elk
      kenniscentrum mee volgens de verdeelsleutel: één gedeeld door het aantal kenniscentra op voorstel waarvan het
      kwalificatiedossier is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4.2.3
  - number: 4.2.4.1
    text: |-
      Onze Minister berekent het rijksbijdragedeel voor het kenniscentrum voor zover het betreft het gedeelte van
      het landelijk beschikbare budget voor de taken rond de leerbedrijven en de beroepspraktijkvorming volgens de
      formule: 'waarbij wordt verstaan onder: KA: het aantal actieve door het kenniscentrum erkende leerbedrijven, waar'
      één of meer deelnemers de beroepspraktijkvorming volgen in het tweede jaar voorafgaand aan het bekostigingsjaar,
      LA: het aantal actieve erkende leerbedrijven van alle kenniscentra tezamen, waar één of meer deelnemers de
      beroepspraktijkvorming volgen in het tweede jaar voorafgaand aan het bekostigingsjaar, KE: het aantal door het
      kenniscentrum erkende leerbedrijven op 1 oktober van het tweede jaar voorafgaand aan het bekostigingsjaar, LE:
      het aantal erkende leerbedrijven van alle kenniscentra tezamen op 1 oktober van het tweede jaar voorafgaand
      aan het bekostigingsjaar, KDe: het aantal deelnemers dat op 1 oktober van het tweede jaar voorafgaand aan het
      bekostigingsjaar is ingeschreven voor een beroepsopleiding, gericht op een kwalificatie die op voorstel van het
      kenniscentrum is vastgesteld, LDe: het landelijk aantal deelnemers dat op 1 oktober van het tweede jaar voorafgaand
      aan het bekostigingsjaar is ingeschreven voor een beroepsopleiding, LBb: het deel van het landelijk beschikbare
      budget, bedoeld in [artikel 4.2.1, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4.2.4
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.2.4.2
    text: |-
      Indien het aantal door het kenniscentrum erkende leerbedrijven op 1 oktober van het tweede jaar voorafgaand aan
      het bekostigingsjaar groter is dan 125% van KA, bedoeld in het eerste lid, dan wordt KE, bedoeld in het eerste lid,
      gelijkgesteld aan 125% van KA.
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4.2.4
  - number: 4.2.4.3
    text: Bij de berekening van KDe en LDe, bedoeld in het eerste lid,
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4.2.4
  - number: 4.2.4.3.a
    text: |-
      tellen alleen deelnemers mee die meetellen voor de berekening van de rijksbijdrage van de instellingen voor het
      desbetreffende bekostigingsjaar,
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4.2.4
  - number: 4.2.4.3.b
    text: |-
      tellen deelnemers aan de beroepsopleidende leerweg van een beroepsopleiding mee met een factor 0,4 en deelnemers
      aan de beroepsbegeleidende leerweg van een beroepsopleiding met een factor 1,
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4.2.4
  - number: 4.2.4.3.c
    text: |-
      tellen deelnemers die zijn ingeschreven voor een kwalificatiedossier dat op voorstel van 2 of meer kenniscentra is
      vastgesteld, bij alle betrokken kenniscentra mee volgens de uitkomst van de breuk met dien verstande dat deelnemers
      aan een assistentopleiding die is gericht op entree op de arbeidsmarkt in de berekening buiten beschouwing worden
      gelaten;
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4.2.4
  - number: 4.2.4.3.d
    text: |-
      tellen deelnemers die zijn ingeschreven voor een opleidingsdomein als bedoeld in
      [artikel 1.1.1, onderdeel t2, van de wet][ref1] mee bij de kenniscentra waarvan een of meer kwalificaties
      zijn opgenomen in het desbetreffende opleidingsdomein, naar rato van de verdeling van de deelnemers die zijn
      ingeschreven voor een kwalificatie of een kwalificatiedossier binnen dat opleidingsdomein over de desbetreffende
      kenniscentra.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4.2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 4.2.5.1
    text: |-
      Elk kenniscentrum verstrekt jaarlijks voor 1 juli aan Onze Minister een opgave van het aantal door dat
      kenniscentrum erkende leerbedrijven op peildatum 1 oktober van het voorafgaande jaar.
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4.2.5
  - number: 4.2.5.2
    text: |-
      De in het eerste lid bedoelde opgave gaat vergezeld van een verklaring omtrent de
      getrouwheid, afgegeven door een door het bevoegd gezag aangewezen accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4.2.5
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 4.2.6.1
    text: |-
      In geval van fusie van kenniscentra betrekt Onze Minister bij de toepassing van [paragraaf 4][ref1] de gegevens van
      de kenniscentra die in het gefuseerde kenniscentrum zijn opgegaan en berekent hij de bijdrage voor het gefuseerde
      kenniscentrum op basis van die gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4.2.6
    references:
      - id: ref1
        bwb_id: BWBR0010646
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 4.2.6.2
    text: |-
      In geval van splitsing van kenniscentra gaat Onze Minister bij de toepassing van [paragraaf 4][ref1] uit van de
      voorstellen omtrent de toerekening van de gegevens aan elk van de kenniscentra die daarvoor door de betrokken
      bevoegde gezagsorganen zijn gedaan, blijkend uit een door die bevoegde gezagsorganen aan Onze Minister overgelegde
      en ondertekende verklaring dienaangaande.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4.2.6
    references:
      - id: ref1
        bwb_id: BWBR0010646
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 4.4.1.1
    text: |-
      Binnen het raam van de door de begrotingswetgever voor het desbetreffende begrotingsjaar beschikbaar gestelde
      middelen, stelt Onze Minister jaarlijks de omvang van de rijksbijdrage vast voor de exploitatiekosten en
      de huisvestingskosten van het kenniscentrum op het gebied van landbouw, natuurlijke omgeving en voedsel,
      met inachtneming van het uitgangspunt dat 20% van de bijdrage noodzakelijk is voor de taken rond de
      kwalificatiestructuur bedoeld in [artikel 1.5.2, eerste en tweede lid, van de wet][ref1] en 80% voor de taken rond
      de leerbedrijven en de beroepspraktijkvorming bedoeld in artikel 1.5.2, derde en vierde lid, van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 4.4.1.2
    text: |-
      De op grond van het eerste lid vastgestelde rijksbijdrage kan worden aangepast in verband met uit de rijksbegroting
      voortvloeiende maatregelen.
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4.4.1
  - number: 4b.1.1.1
    text: |-
      [Paragraaf 2][ref1] is van toepassing op personeel en gewezen personeel van een instelling als bedoeld in
      [artikel 1.1.1, onderdeel b, van de wet][ref2] en personeel en gewezen personeel dat betrokken is onderscheidenlijk
      was bij een beroepsopleiding aan een instituut als bedoeld in [artikel 12.3.8][ref3] of een hogeschool als bedoeld
      in [artikel 12.3.9 van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Hoofdstuk4B
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4b.1.1
    references:
      - id: ref1
        bwb_id: BWBR0010646
        hoofdstuk: 4B
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '12'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '12'
  - number: 4b.1.1.2
    text: |-
      [Paragraaf 3][ref1] is van toepassing op de gegevens van deelnemers die zijn ingeschreven of ingeschreven zijn
      geweest voor een beroepsopleiding aan een instelling als bedoeld in [artikel 1.1.1, onderdeel b][ref2], een
      instituut als bedoeld in [artikel 12.3.8][ref3] of een hogeschool als bedoeld in [artikel 12.3.9 van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Hoofdstuk4B
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4b.1.1
    references:
      - id: ref1
        bwb_id: BWBR0010646
        hoofdstuk: 4B
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0010646
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '12'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '12'
  - number: 4b.2.1
    text: |-
      Het bevoegd gezag kan gebruik maken van het burgerservicenummer van een lid van het personeel of gewezen personeel
      van de instelling bij de gegevensverstrekking, bedoeld in [bijlage 1][ref1] en [bijlage 4][ref2] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0010646
      [ref2]: https://wetten.overheid.nl/BWBR0010646
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4b.2.1
    references:
      - id: ref1
        bwb_id: BWBR0010646
      - id: ref2
        bwb_id: BWBR0010646
  - number: 4b.3.1.1
    text: |-
      Ten behoeve van de vaststelling van de bekostiging van een instelling kan Onze Minister de volgende in het
      basisregister onderwijs opgenomen gegevens van een deelnemer of voormalige deelnemer van de instelling gebruiken:
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4b.3.1
  - number: 4b.3.1.1.a
    text: het persoonsgebonden nummer;
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4b.3.1
  - number: 4b.3.1.1.b
    text: het geslacht, de geboortedatum en de postcode van de woonplaats;
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4b.3.1
  - number: 4b.3.1.1.c
    text: de datum van inschrijving of van de wijziging of beëindiging daarvan;
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4b.3.1
  - number: 4b.3.1.1.d
    text: |-
      de leerweg, alsmede de code, bedoeld in [artikel 6.4.1, tweede lid, onder a, van de wet][ref1] van het
      opleidingsdomein, het kwalificatiedossier of de kwalificatie waarvoor de deelnemer is ingeschreven en bij
      inschrijving voor een opleidingsdomein het niveau, bedoeld in [artikel 7.2.2, derde lid, van de wet][ref2] van
      de beroepsopleiding;


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4b.3.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 4b.3.1.1.e
    text: indien van toepassing, het al dan niet zijn van risicodeelnemer;
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4b.3.1
  - number: 4b.3.1.1.f
    text: het behaalde diploma;
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4b.3.1
  - number: 4b.3.1.1.g
    text: |-
      de omvang van de beroepspraktijkvorming, de datum van begin en einde daarvan, de afsluitdatum van de
      beroepspraktijkvormingsovereenkomst en het betrokken bedrijf dat of de betrokken organisatie die de
      beroepspraktijkvormingsovereenkomst verzorgt;
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4b.3.1
  - number: 4b.3.1.1.h
    text: de gegevens over de nationaliteit en het verblijfsrecht van de deelnemer;
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4b.3.1
  - number: 4b.3.1.1.i
    text: het registratienummer van de instelling;
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4b.3.1
  - number: 4b.3.1.1.j
    text: indien van toepassing het volgen van de opleiding in voltijd of deeltijd en het zijn van examendeelnemer;
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4b.3.1
  - number: 4b.3.1.1.k
    text: het al dan niet voor bekostiging in aanmerking komen van de deelnemer of het diploma; en
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4b.3.1
  - number: 4b.3.1.1.l
    text: |-
      indien van toepassing, het gebruiken van het persoonsgebonden nummer ten behoeve van de uitvoering van de
      subsidieregelingen van het Europees Sociaal Fonds in het verkeer met de instelling.
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4b.3.1
  - number: 4b.3.1.2
    text: |-
      De gegevens, bedoeld in het eerste lid, onderdelen d tot en met f, worden gespecificeerd overeenkomstig het
      bepaalde krachtens [artikel 2.5.5a, derde lid, eerste volzin, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4b.3.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
  - number: 4b.3.3.1
    text: |-
      De gegevens, bedoeld in [artikel 4b.3.1][ref1], worden uitsluitend gebruikt door de daartoe door Onze Minister
      aangewezen ambtenaren dan wel, voor zover het betreft het onderwijs op het gebied van landbouw, natuurlijke
      omgeving en voedsel, door de daartoe door Onze Minister aangewezen ambtenaren van het Ministerie van Economische
      Zaken, Landbouw en Innovatie.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4b
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4b.3.3
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: 4b
        hoofdstuk: 4B
        paragraaf: '3'
  - number: 4b.3.3.2
    text: 'Onze Minister kan uitsluitend gebruiken:'
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4b.3.3
  - number: 4b.3.3.2.a
    text: |-
      de gegevens van een deelnemer of voormalige deelnemer van wie het bevoegd gezag op grond van
      [2.5.5a, vierde lid, van de wet][ref1] het persoonsgebonden nummer aan Onze Minister heeft verstrekt ten behoeve
      van de vaststelling van de bekostiging van de instelling;


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4b.3.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
  - number: 4b.3.3.2.b
    text: |-
      de gegevens van een deelnemer of voormalige deelnemer, voorzover Onze Minister dit noodzakelijk acht ten behoeve
      van een onderzoek als bedoeld in [2.5.5b, derde lid, van de wet][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4b.3.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
  - number: 4b.3.3.2.c
    text: |-
      de gegevens van een deelnemer of voormalige deelnemer, voorzover Onze Minister het noodzakelijk acht deze
      gegevens ten behoeve van de vaststelling van de bekostiging van de instelling te gebruiken in het verkeer met die
      instelling.
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4b.3.3
  - number: 4b.3.3.3
    text: |-
      Onder gebruik ten behoeve van de vaststelling van de bekostiging van de instelling van de gegevens, bedoeld in
      [artikel 4b.3.1][ref1], wordt mede verstaan het daartoe noodzakelijke gebruik voor de motivering van beschikkingen
      en de behandeling van bezwaar- en beroepschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4b
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel4b.3.3
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: 4b
        hoofdstuk: 4B
        paragraaf: '3'
  - number: 5.1.1
    text: 'De bepalingen van dit hoofdstuk hebben betrekking op:'
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel5.1.1
  - number: 5.1.1.a
    text: |-
      instellingen als bedoeld in [artikel 1.1.1, onderdeel b, onder 1° tot en met 3°, van de wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel5.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 5.1.1.b
    text: |-
      kenniscentra beroepsonderwijs bedrijfsleven als bedoeld in [artikel 1.1.1, onderdeel b1, van de wet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel5.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 5.1.1.c
    text: |-
      instellingen als bedoeld in [artikel 2.3.4 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel5.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
  - number: 5.1.2
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel5.1.2
  - number: 5.1.2.a
    text: |-
      kenniscentrum: een kenniscentrum beroepsonderwijs bedrijfsleven als bedoeld in
      [artikel 1.1.1, onderdeel b1, van de wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel5.1.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 5.1.2.b
    text: |-
      gegevenswoordenboek: de opsomming van een door het bevoegd gezag van een instelling of het bestuur van een
      kenniscentrum te verzamelen gegevens, bedoeld in [artikel 5.2.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel5
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel5.1.2
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.2.1.1
    text: |-
      De informatieverzameling, bedoeld in de [artikelen 2.2.4][ref1], [2.3.6][ref2], [2.5.3][ref3] en
      [2.5.5 van de wet][ref4], waarover het bevoegd gezag van een instelling dient te beschikken, bevat de gegevens
      volgens de beschrijving in het gegevenswoordenboek dat is opgenomen in [bijlage 1][ref5] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0010646
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel5.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0010646
  - number: 5.2.1.2
    text: |-
      De informatieverzameling, bedoeld in [artikel 2.5.10][ref1] juncto [artikel 2.5.5 van de wet][ref2], waarover
      het bestuur van een kenniscentrum dient te beschikken, bevat de gegevens volgens de beschrijving in het
      gegevenswoordenboek dat is opgenomen in [bijlage 3 bij dit besluit][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0010646
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel5.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0010646
  - number: 5.2.1.3
    text: |-
      De gegevens, bedoeld in het eerste en tweede lid, die betrekking hebben op de bekostiging, zijn in het
      desbetreffende gegevenswoordenboek als zodanig aangeduid.
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel5.2.1
  - number: 5.2.2.1
    text: |-
      Op verzoek van Onze Minister stelt het bevoegd gezag van een instelling dan wel het bestuur van een kenniscentrum
      gegevens aan hem beschikbaar, die door de instelling of het kenniscentrum op grond van [artikel 5.2.1][ref1] zijn
      verzameld.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel5
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel5.2.2
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.2.2.2
    text: |-
      De beschikbaarstelling geschiedt voor het beroepsonderwijs en de educatie overeenkomstig [bijlage 4][ref1] bij
      dit besluit en voor de kenniscentra overeenkomstig de formulieren die zijn opgenomen in [bijlage 6][ref2] bij dit
      besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0010646
      [ref2]: https://wetten.overheid.nl/BWBR0010646
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel5.2.2
    references:
      - id: ref1
        bwb_id: BWBR0010646
      - id: ref2
        bwb_id: BWBR0010646
  - number: 5.2.2.3
    text: |-
      In voorkomende gevallen kan Onze Minister bij het verzoek om beschikbaarstelling reeds bij hem bekende gegevens
      opnemen.
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel5.2.2
  - number: 5.2.3
    text: |-
      Bij ministeriële regeling kan in bijzondere gevallen een aanvullende vragenlijst ten aanzien van bekostiging worden
      vastgesteld ter beantwoording door het bevoegd gezag van een instelling.
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel5.2.3
  - number: 5.2.4.1
    text: |-
      Het bevoegd gezag van een instelling en het bestuur van een kenniscentrum bewaren de boeken, bescheiden en
      informatie op andere informatiedragers die verband houden met de toepassing van dit hoofdstuk voor zover het
      betreft gegevens ten behoeve van het door Onze Minister te voeren beleid ten aanzien van het beroepsonderwijs, van
      de educatie en van de kenniscentra, gedurende ten minste zeven jaren.
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel5.2.4
  - number: 5.2.4.2
    text: |-
      Het bevoegd gezag van een instelling en het bestuur van een kenniscentrum bewaren de gegevens die verband houden
      met de toepassing van dit hoofdstuk op zodanige wijze dat daaruit de voor de vaststelling van de geaggregeerde
      gegevens van belang zijnde gegevens kunnen worden nagegaan.
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel5.2.4
  - number: 5.2.5.1
    text: |-
      Bij ministeriële regeling worden regels vastgesteld voor de inrichting en de uitvoering van de controle door de
      accountant van de boekhouding, de jaarrekening en de administratie van de instellingen en de kenniscentra.
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel5.2.5
  - number: 5.2.5.2
    text: |-
      De regels hebben betrekking op de controle op de rechtmatigheid van de verkrijging en de rechtmatigheid en
      doelmatigheid van de besteding van de rijksbijdrage, en de controle op de bekostigingsgegevens, bedoeld in dit
      besluit.
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel5.2.5
  - number: 5.2.5.3
    text: |-
      De administratie van de instelling en het kenniscentrum omvat in ieder geval de gegevens, bedoeld in
      [artikel 5.2.1, vierde lid][ref1], en de daaraan ten grondslag liggende bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel5
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel5.2.5
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5a.1
    text: 'De bepalingen van dit hoofdstuk hebben betrekking op:'
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel5a.1
  - number: 5a.1.1
    text: |-
      instellingen als bedoeld in de [artikelen 1.1.1, onderdeel b][ref1], [12.3.8][ref2] en [12.3.9 van de wet][ref3],
      en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel5a.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '12'
  - number: 5a.1.2
    text: |-
      kenniscentra beroepsonderwijs bedrijfsleven als bedoeld in [artikel 1.1.1, onderdeel b1, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel5a.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 5a.1a
    text: |-
      In dit hoofdstuk wordt verstaan onder kenniscentrum: een kenniscentrum beroepsonderwijs bedrijfsleven als bedoeld
      in [artikel 1.1.1, onderdeel b1, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel5a.1a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 5a.2
    text: |-
      Het personeel en het gewezen personeel van instellingen en kenniscentra zijn in elk geval belanghebbende in de zin
      van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel5a.2
  - number: 5a.3
    text: |-
      Indien een instelling of een kenniscentrum de taken beëindigt en een rechtsopvolger ontbreekt, waaronder tevens
      is begrepen het geval van een onherroepelijk vonnis tot faillietverklaring van de desbetreffende instelling of
      het desbetreffende kenniscentrum, voorzien de bevoegde gezagsorganen van de overige instellingen onderscheidenlijk
      de besturen van de overige kenniscentra er gezamenlijk in dat aan de verplichtingen jegens het personeel en het
      gewezen personeel die uit de wet- en regelgeving voortvloeien, wordt voldaan. De toepassing van de eerste volzin
      geschiedt met inachtneming van het bepaalde over vermindering van de rijksbijdrage in verband met de kosten
      van uitkeringen voor gewezen personeel van een instelling die of een kenniscentrum dat de taken beëindigt in de
      ministeriële regeling op grond van [artikel 12.3.48 van de wet][ref1] onderscheidenlijk [artikel 4.5.2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel4
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel5a.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0010646
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 6.1.1.2
    text: |-
      Bij ministeriële regeling kan worden voorgeschreven, welke gegevens Onze Minister in afwijking van
      [artikel 2.2.5][ref1] hanteert voor de bekostiging voor zover nog niet kan worden beschikt over de in dat artikel,
      onder b, voorgeschreven gegevens. De vervangende gegevens komen zoveel mogelijk overeen met de voorgeschreven
      gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel6.1.1
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 6.1.1.3
    text: 'Bij ministeriële regeling wordt vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel6.1.1
  - number: 6.1.1.3.b
    text: |-
      in afwijking van [artikel 2.2.3, eerste lid, onder Pi respectievelijk DFi][ref1]: welke prijsfactor respectievelijk
      welke deeltijdfactor:


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel6.1.1
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 6.1.1.3.b.6°
    text: tot uiterlijk 1 januari 2002 voor deeltijdse deelnemers aan 4-jarige opleidingen middelbaar beroepsonderwijs,
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel6.1.1
  - number: 6.1.1.3.c
    text: |-
      in afwijking van [artikel 2.2.3, eerste lid, onder Pi respectievelijk DFi][ref1]: welke prijsfactor respectievelijk
      welke deeltijdfactor:


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel6.1.1
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 6.1.1.3.c.6°
    text: tot uiterlijk 1 januari 2002 voor deeltijdse deelnemers aan 4-jarige opleidingen middelbaar beroepsonderwijs,
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel6.1.1
  - number: 6.1.1.3.d
    text: |-
      welk niveau wordt toegekend aan een opleiding als bedoeld onder b of c met het oog op de toepassing van
      [artikel 2.2.4][ref1], en voor zover van toepassing, welk niveau wordt toegekend aan een opleiding als bedoeld
      onder b of c, met het oog op de toepassing van [artikel 2.2.5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel6.1.1
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0010646
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 6.1.1.4
    text: |-
      Onder diploma's beroepsonderwijs als bedoeld in [artikel 2.1.2, onder d][ref1], worden mede begrepen,
      bij ministeriële regeling aangewezen diploma's en certificaten van opleidingen als bedoeld in
      [artikel 12.3.2 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel6.1.1
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '12'
  - number: 6.1.3.1
    text: |-
      Indien de op grond van [artikel 2.4.1, eerste lid][ref1], voor een instelling, niet zijnde een agrarisch
      opleidingscentrum, vastgestelde rijksbijdrage ten behoeve van de huisvestingskosten voor een kalenderjaar
      van de desbetreffende instelling, vermeerderd met het gedeelte van de rijksbijdrage, berekend op grond van
      [artikel 2.4.1, tweede lid][ref2], minder bedraagt dan het op grond van artikel 3, alsmede in voorkomende gevallen
      op grond van artikel 8 van de Regeling bekostiging huisvesting bve-sector 1999 voor het desbetreffende kalenderjaar
      vastgestelde bedrag voor de desbetreffende instelling, ontvangt de instelling voor het desbetreffende kalenderjaar
      een aanvulling tot dat bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel6.1.3
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '2'
        hoofdstuk: '2'
