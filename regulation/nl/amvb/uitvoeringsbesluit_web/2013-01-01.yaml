  - number: 2.2.4.2
    text: |-
      Bij ministeriële regeling kan worden bepaald dat voor diploma’s van in die ministeriële regeling
      aangewezen opleidingen, in de kalenderjaren 2010 en 2011 verkregen door examendeelnemers, bedoeld in
      [artikel 2.2.2, tweede lid, onderdeel b, van de wet][ref1], in afwijking van het eerste lid een vast bedrag per
      diploma wordt toegekend.


