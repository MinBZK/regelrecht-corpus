      vastgesteld op 90% van de uitkomst van dat deel van de formule van het voorgaande kalenderjaar;


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel2.2.7
    references:
