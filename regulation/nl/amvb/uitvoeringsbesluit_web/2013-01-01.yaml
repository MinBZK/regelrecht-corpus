        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.5.1
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0010646/2013-01-01#Artikel2.5.1
  - number: 2.5.1.a
    text: |-
      instelling: een instelling als bedoeld in [artikel 1.1.1, onderdeel b, van de wet][ref1], een instituut als bedoeld
      in [artikel 12.3.8 van de wet][ref2] of de hogeschool Haarlem, bedoeld in [artikel 12.3.9 van de wet][ref3], dan
