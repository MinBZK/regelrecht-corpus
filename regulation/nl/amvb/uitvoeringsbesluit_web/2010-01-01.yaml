        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0010646
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 6.1.4.2
    text: |-
      Het totaal van de aanvullingen op grond van het eerste lid wordt in mindering gebracht op de rijksbijdrage,
      bedoeld in [artikel 2.2.2, eerste lid][ref1], voor het kalenderjaar 2008, voor de instellingen waarvoor het
      verschil van de berekening, bedoeld in [artikel 2.2.2, eerste lid][ref2], met toepassing van [artikel 2.2.3][ref3]
      zoals dat met ingang van 1 oktober 2006 is komen te luiden, en de overeenkomstige berekening met toepassing van
      [artikel 2.2.3][ref4] zoals dat luidde op 30 september 2006, voor dat kalenderjaar positief is, naar rato van die
      toename van de rijksbijdrage voor de desbetreffende instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0010646#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel6.1.4
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '2'
