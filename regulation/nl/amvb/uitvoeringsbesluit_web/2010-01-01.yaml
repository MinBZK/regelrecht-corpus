  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordrachten van Onze Minister van Onderwijs, Cultuur en Wetenschappen van 8 maart 1999, nr. 1998/8716 (3704)
    en van 31 maart 1999, nr. 1999/14257 (3693), directie Wetgeving en Juridische Zaken, de eerste voordracht gedaan
    mede namens Onze Minister van Landbouw, Natuurbeheer en Visserij;

    Gelet op de artikelen 2.2.1, eerste lid en vijfde lid, 2.2.4, vierde lid, 2.2.12, tweede lid, 2.3.1, eerste en
    derde lid, 2.3.6, tweede en derde lid, 2.4.1, eerste en tweede lid, 2.4.2, vierde lid, 2.5.3, negende lid, 2.5.5,
    tweede en derde lid, 2.5.10, eerste lid, en 2.6a van de Wet educatie en beroepsonderwijs, alsmede artikel 19,
    vijfde lid, van de Wet op het voortgezet onderwijs;

    De Raad van State gehoord (adviezen van 29 april 1999, nr. W05.99.0160/II en van 6 mei 1999, nr. W05.99/0111/III);

    Gezien het nader rapport van Onze Minister van Onderwijs, Cultuur en Wetenschappen, van 22 juli 1999, nr.
    1999/30854 (3704), directie Wetgeving en Juridische Zaken, uitgebracht mede namens Onze Minister van Landbouw,
    Natuurbeheer en Visserij;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#ArtikelAanhef
