        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 6.3.1.2
    text: |-
      Tot het tijdstip van inwerkingtreding van [bijlage 3 bij dit besluit][ref1] wordt in
      [artikel 4.2.8, eerste lid, onder a][ref2], in plaats van «[bijlage 3 bij dit besluit][ref3]» gelezen: bijlage 3
      van de Regeling Informatievoorziening BVE.


      [ref1]: https://wetten.overheid.nl/BWBR0010646
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0010646
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel6.3.1
    references:
      - id: ref1
        bwb_id: BWBR0010646
