        hoofdstuk: '4'
        paragraaf: '5'
  - number: 5a.4.1
    text: |-
      Voor de uitkomsten van het functiewaarderingssysteem van een instelling als bedoeld in de
      [artikelen 1.1.1, onderdelen b en b1][ref1], en [12.3.8 van de Wet educatie en beroepsonderwijs][ref2] of van een
      kenniscentrum geldt voor de functie van voorzitter van het college van bestuur en de centrale directie dat daaraan
      ten hoogste een salarisschaal is verbonden waarvan het hoogste bedrag overeenkomt met het maximum salarisbedrag van
      schaal 18 van [bijlage 1A van het Kaderbesluit rechtspositie BVE][ref3], zoals dat luidde op 30 juni 2003.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0008190
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel5a.4
