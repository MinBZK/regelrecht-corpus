      - id: ref3
        bwb_id: BWBR0010646
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 6.3.2.2
    text: |-
      Onze Minister berekent de rijksbijdrage voor de exploitatiekosten voor het kenniscentrum tot de in het eerste lid
      bedoelde datum op de in het derde lid bepaalde wijze.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel6.3.2
  - number: 6.3.2.3
    text: |-
      Voor elk kenniscentrum wordt het aandeel in het landelijk beschikbare budget voor de exploitatiekosten van
      respectievelijk het jaar 2005 en het jaar 2006, uitgedrukt in een percentage van dat landelijk beschikbare
      budget van genoemde jaren. Vervolgens worden voor elk kenniscentrum de percentages van de jaren, bedoeld in de
      eerste volzin, bij elkaar opgeteld en de uitkomst gedeeld door twee. De uitkomst van de berekening, bedoeld in de
      vorige volzin, is bepalend voor het vaststellen van het gedeelte van het landelijk beschikbare budget waarop elk
      kenniscentrum voor de rijksbijdrage aanspraak maakt.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel6.3.2
  - number: 6.3.3
    text: |-
      Onze Minister stelt tot de datum, bedoeld [artikel 6.3.2, eerste lid][ref1], het bedrag voor huisvestingskosten,
      bedoeld in [artikel 4.3.1, eerste lid][ref2], voor elk kenniscentrum vast op basis van het percentage dat op grond
      van [artikel 6.3.2, derde lid][ref3], voor dat kenniscentrum is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0010646#Artikel6
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel6.3.3
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0010646
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0010646
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: 6.3.7
    text: |-
      Onze Minister evalueert de werking van [hoofdstuk 4][ref1] na afloop van een periode van 5 jaren na het tijdstip
      van inwerkingtreding van dat hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel6.3.7
    references:
      - id: ref1
        bwb_id: BWBR0010646
        hoofdstuk: '4'
  - number: 6.4.1.1
    text: |-
      De reguliere verstrekking van gegevens door de Informatie Beheer Groep aan Onze Minister en de inspectie, bedoeld
      in [artikel 4b.2.3, eerste lid][ref1], geschiedt voor de eerste maal op 15 november 2006 voor zover het voorlopige
      gegevens betreft en op 8 juli 2007 voor zover het de gegevens na accountantscontrole betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4b
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel6.4.1
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: 4b
        hoofdstuk: 4B
        paragraaf: '2'
  - number: 6.4.1.2
    text: |-
      In de periode tot en met 14 november 2006 verstrekt de Informatie Beheer Groep ten behoeve van een goede invoering
      van [hoofdstuk 4b][ref1] op verzoek van Onze Minister op een of meer door Onze Minister te bepalen tijdstippen
      de voorlopige gegevens en de gegevens van de instellingen na accountantscontrole. De [artikelen 4b.2.1][ref2] en
      [4b.2.2][ref3] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Hoofdstuk4B
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel4b
      [ref3]: https://wetten.overheid.nl/BWBR0010646#Artikel4b
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel6.4.1
    references:
