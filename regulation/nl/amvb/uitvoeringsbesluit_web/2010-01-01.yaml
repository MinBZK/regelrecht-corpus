  - number: 2.5.2.1
    text: |-
      Het bevoegd gezag van een instelling heeft, naast de aanspraak op een aandeel van de rijksbijdrage voor de
      exploitatiekosten voor het beroepsonderwijs, bedoeld in [artikel 2.2.2][ref1], in geval van een agrarisch
      opleidingscentrum vermeerderd met de rijksbijdrage zoals vastgesteld op grond van [artikel 2.3.2][ref2], per
      kalenderjaar aanspraak op een vergoeding voor uitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel2.5.2
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0010646
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.5.2.2
    text: |-
      De vergoeding, bedoeld in het eerste lid, is het bedrag berekend volgens de volgende formule: (PI + InbI + EduI) /
      (PL + InbL + EduL) x W In deze formule wordt verstaan onder: PI: de rijksbijdrage voor de exploitatiekosten,
      zoals omschreven in het eerste lid, van de desbetreffende instelling voor het kalenderjaar voorafgaande aan
      het desbetreffende kalenderjaar; InbI: de hoogte van het bedrag dat met de overeenkomst of de overeenkomsten
      inburgering van de desbetreffende instelling in het kalenderjaar voorafgaand aan het desbetreffende kalenderjaar is
      gemoeid, zoals blijkt uit de jaarrekening van de instelling; EduI: de hoogte van het bedrag dat met de overeenkomst
      of overeenkomsten educatie van de desbetreffende instelling in het kalenderjaar voorafgaand aan het desbetreffende
      kalenderjaar is gemoeid, zoals blijkt uit de jaarrekening van de instelling; PL: de rijksbijdrage voor de
      exploitatiekosten, zoals omschreven in het eerste lid, van de instellingen voor het kalenderjaar voorafgaande
      aan het desbetreffende kalenderjaar; InbL: de hoogte van het bedrag dat met de overeenkomsten inburgering van
      de instellingen in het kalenderjaar voorafgaand aan het desbetreffende kalenderjaar is gemoeid, zoals blijkt uit
      de jaarrekeningen van de instellingen; EduL: de hoogte van het bedrag dat met de overeenkomsten educatie van de
      instellingen in het kalenderjaar voorafgaand aan het desbetreffende kalenderjaar is gemoeid, zoals blijkt uit de
      jaarrekeningen van de instellingen; W: het wachtgeldbudget voor de instellingen zoals opgenomen in de begrotingen
      van de uitgaven van het Ministerie van Onderwijs, Cultuur en Wetenschap en het Ministerie van Landbouw, Natuur en
      Voedselkwaliteit van het desbetreffende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel2.5.2
  - number: 2.5.2.3
    text: De uitkomst van de berekening, bedoeld in het tweede lid, wordt rekenkundig afgerond op twee decimalen.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel2.5.2
  - number: 2.5.2.4
    text: |-
      Onze Minister kan voorzover het betreft educatie en inburgering, in afwachting van de indiening van de
      jaarrekeningen door de instellingen, een voorlopig bedrag toevoegen aan de rijksbijdrage.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel2.5.2
  - number: 2.6.1.1
    text: |-
      Onze Minister brengt op de rijksbijdrage voor een instelling voor een kalenderjaar een bedrag in mindering
      volgens de formule: (DDi3 x DC1) + (DDi4 x DC2), waarin is: DDi3: het aantal deeltijds deelnemers
      als bedoeld in [artikel 2.2.3, eerste lid][ref1], onder DDi1 en DDi2, voor opleidingen als bedoeld in
      [artikel 7.2.2, eerste lid, onder a en b, van de wet][ref2]; DC1: het cursusgeld per 1 januari van het
      desbetreffende kalenderjaar, bedoeld in artikel 15 van het Uitvoeringsbesluit Les- en cursusgeldwet, voor
      opleidingen als bedoeld in [artikel 7.2.2, eerste lid, onder a en b, van de wet][ref3]; DDi4: het aantal deeltijds
      deelnemers als bedoeld in [artikel 2.2.3, eerste lid][ref4], onder DDi1 en DDi2, voor opleidingen als bedoeld in
      [artikel 7.2.2, eerste lid, onder c tot en met e, van de wet][ref5]; DC2: het cursusgeld per 1 januari van het
      desbetreffende kalenderjaar, bedoeld in [artikel 15 van het Uitvoeringsbesluit Les- en cursusgeldwet][ref6], voor
      opleidingen als bedoeld in [artikel 7.2.2, eerste lid, onder c tot en met e, van de wet][ref7].


