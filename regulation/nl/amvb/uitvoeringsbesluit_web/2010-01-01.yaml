    text: |-
      voltijds deelnemer aan de beroepsopleidende leerweg: degene die op 1 oktober van het jaar voorafgaand aan het jaar
      waarin de rijksbijdrage wordt vastgesteld, als voltijds deelnemer als bedoeld in [artikel 2.1.2, onder b][ref1],
      aan een instelling als bedoeld in de [artikelen 1.1.1, onderdeel b, onder 1º, 2º en 3º][ref2], [12.3.8][ref3] en
      [12.3.9 van de wet][ref4] stond ingeschreven voor een opleiding aan de beroepsopleidende leerweg en daadwerkelijk
      die opleiding volgt;


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.1.2
