        artikel: '12'
  - number: 4.1.2.h
    text: |-
      deeltijds deelnemer aan de beroepsopleidende leerweg: degene die op 1 oktober van het jaar voorafgaand aan het jaar
      waarop de rijksbijdrage wordt vastgesteld, als deeltijds deelnemer als bedoeld in [artikel 2.1.2, onder c][ref1],
