  - number: 4.1.3
    text: 'De rijksbijdrage omvat:'
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.1.3
  - number: 4.1.3.a
    text: |-
      een bedrag voor exploitatiekosten, berekend volgens [paragraaf 2][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.1.3
    references:
      - id: ref1
        bwb_id: BWBR0010646
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.1.3.b
    text: |-
      een bedrag voor huisvestingskosten, berekend volgens [paragraaf 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.1.3
    references:
      - id: ref1
        bwb_id: BWBR0010646
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 4.1.4
    text: |-
      Binnen het raam van de door de begrotingswetgever voor het desbetreffende kalenderjaar beschikbaar gestelde
      middelen, stelt Onze Minister jaarlijks de omvang vast van de landelijk beschikbare budgetten voor de
      exploitatiekosten en voor de huisvestingskosten van de kenniscentra.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.1.4
  - number: 4.2.1
    text: 'Onze Minister berekent de rijksbijdrage voor de exploitatiekosten voor een kenniscentrum voor:'
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.1
  - number: 4.2.1.a
    text: |-
      de taken, bedoeld in [artikel 1.5.2, eerste, tweede en vijfde lid, van de wet][ref1], aan de hand van de maatstaf
      opleidingen,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 4.2.1.b
    text: |-
      de taken, bedoeld in [artikel 1.5.2, derde lid, van de wet][ref1], aan de hand van de maatstaf normatieve bpv-
      plaatsen, en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 4.2.1.c
    text: |-
      de taken, bedoeld in [artikel 1.5.2, vierde lid, van de wet][ref1], aan de hand van de maatstaf leerbedrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 4.2.2
    text: 'Het landelijk beschikbare budget voor de exploitatiekosten van de kenniscentra wordt verdeeld als volgt:'
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.2
  - number: 4.2.2.a
    text: 50% wordt toegerekend aan het landelijk deel ten behoeve van de stabilisatiecomponent,
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.2
  - number: 4.2.2.b
    text: 10% wordt toegerekend aan het landelijk deel ten behoeve van de maatstaf opleidingen,
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.2
  - number: 4.2.2.c
    text: 30% wordt toegerekend aan het landelijk deel ten behoeve van de maatstaf normatieve bpv-plaatsen, en
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.2
  - number: 4.2.2.d
    text: 10% wordt toegerekend aan het landelijk deel ten behoeve van de maatstaf leerbedrijven.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.2
  - number: 4.2.3.1
    text: |-
      Onze Minister berekent voor een kenniscentrum de rijksbijdrage voor de exploitatiekosten door bij elkaar op te
      tellen:
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.3
  - number: 4.2.3.1.a
    text: |-
      het rijksbijdragedeel op grond van de stabilisatiecomponent, zoals berekend overeenkomstig [artikel 4.2.3a][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.3
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.2.3.1.b
    text: |-
      het rijksbijdragedeel op grond van de maatstaf opleidingen, zoals berekend overeenkomstig [artikel 4.2.4][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.3
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.2.3.1.c
    text: |-
      het rijksbijdragedeel op grond van de maatstaf normatieve bpv-plaatsen, zoals berekend overeenkomstig
      [artikel 4.2.5][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.3
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.2.3.1.d
    text: |-
      het rijksbijdragedeel op grond van de maatstaf leerbedrijven, zoals berekend overeenkomstig [artikel 4.2.7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.3
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.2.3.2
    text: |-
      Het aandeel van de op grond van het eerste lid berekende rijksbijdrage voor de exploitatiekosten van het
      kenniscentrum in het desbetreffende landelijk beschikbare budget wordt uitgedrukt in een percentage van dat budget.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.3
  - number: 4.2.3.3
    text: |-
      De op grond van het eerste lid berekende rijksbijdrage kan worden aangepast in verband met uit de rijksbegroting
      voortvloeiende maatregelen.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.3
  - number: 4.2.3a.1
    text: |-
      Onze Minister berekent de rijksbijdrage voor de exploitatiekosten voor het kenniscentrum voor zover het betreft
      het gedeelte van het landelijk beschikbare budget dat is toegerekend aan de stabilisatiecomponent, op de wijze als
      bepaald in het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.3a
  - number: 4.2.3a.2
    text: |-
      Voor elk kenniscentrum wordt het aandeel in het landelijk beschikbare budget van respectievelijk het jaar waarin
      de rijksbijdrage wordt vastgesteld en het daaraan voorafgaande jaar, uitgedrukt in een percentage van het landelijk
      beschikbare budget van genoemde jaren. Vervolgens worden voor elk kenniscentrum de percentages van de jaren,
      bedoeld in de eerste volzin, bij elkaar opgeteld en de uitkomst gedeeld door twee.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.3a
  - number: 4.2.3a.3
    text: |-
      Van het in het eerste lid bedoelde gedeelte van het landelijk beschikbare budget wordt het bedrag voor het
      kenniscentrum vastgesteld overeenkomstig het in het tweede lid bedoelde percentage.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.3a
  - number: 4.2.4.1
    text: |-
      Onze Minister berekent de rijksbijdrage voor de exploitatiekosten voor het kenniscentrum voor zover het betreft het
      gedeelte van het landelijk beschikbare budget dat is toegerekend aan de maatstaf opleidingen, door:
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.4
  - number: 4.2.4.1.a
    text: |-
      voor elke opleiding waarvoor het kenniscentrum de eindtermen heeft voorgesteld, en voor zover deze eindtermen
      op 1 augustus 2001 zijn vermeld in het Centraal register, het aantal studiebelastingsuren dat is vastgesteld als
      onderdeel van de eindtermen voor die opleiding te delen door 1600, dit aantal af te ronden op een half naar boven,
      en het totaal te vermenigvuldigen met
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.4
  - number: 4.2.4.1.b
    text: |-
      het aantal in het Centraal register opgenomen deelkwalificaties van de onder a bedoelde opleidingen, met dien
      verstande dat een deelkwalificatie slechts eenmaal meetelt, en de uitkomst te delen door
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.4
  - number: 4.2.4.1.c
    text: |-
      het totaal van de in het Centraal register opgenomen deelkwalificaties van de onder a bedoelde opleidingen, zonder
      de beperking in onderdeel b.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.4
  - number: 4.2.4.2
    text: |-
      De berekening volgens het eerste lid leidt tot een aantal punten voor het kenniscentrum, rekenkundig afgerond op
      een half. Op het aantal punten, bedoeld in de eerste volzin, wordt vervolgens een correctie voor schaalvoordelen
      toegepast door dat aantal te vermenigvuldigen met een factor, zoals aangegeven in de navolgende tabel:






                    aantal punten


                    factor






                    0,5 t/m 50


                    1




                    51 t/m 60


                    0,95




                    61 t/m 70


                    0,90




                    71 t/m 80


                    0,85




                    81 t/m 90


                    0,80




                    91 t/m 100


                    0,75




                    101 t/m 110


                    0,70




                    111 en hoger


                    0,65
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.4
  - number: 4.2.4.3
    text: |-
      Elk kenniscentrum heeft aanspraak op het gedeelte van het landelijk beschikbare budget, bedoeld in het eerste
      lid, naar rato van het aantal punten van elk kenniscentrum nadat daarop de correctie, bedoeld in het tweede lid,
      is toegepast.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.4
  - number: 4.2.5.1
    text: |-
      Onze Minister berekent de rijksbijdrage voor de exploitatiekosten voor het kenniscentrum voor zover het betreft
      het gedeelte van het landelijk beschikbare budget dat is toegerekend aan de maatstaf normatieve bpv-plaatsen, op de
      wijze als bepaald in het tweede tot en met vijfde lid.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.5
  - number: 4.2.5.2
    text: |-
      Het aantal normatieve bpv-plaatsen voor elk kenniscentrum wordt bepaald door het aantal deelnemers bij opleidingen
      die behoren bij het desbetreffende kenniscentrum voorzover die opleidingen zijn vermeld in het Centraal register,
      bij elkaar op te tellen zoals hierna vermeld:
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.5
  - number: 4.2.5.2.a
    text: |-
      100% van het aantal deelnemers aan de beroepsbegeleidende leerweg op 1 oktober van het jaar voorafgaand aan het
      jaar waarin de rijksbijdrage wordt vastgesteld,
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.5
  - number: 4.2.5.2.b
    text: |-
      35% van het aantal voltijds deelnemers aan de beroepsopleidende leerweg op 1 oktober van het jaar voorafgaand aan
      het jaar waarin de rijksbijdrage wordt vastgesteld, en
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.5
  - number: 4.2.5.2.c
    text: |-
      10% van het aantal deeltijds deelnemers aan de beroepsopleidende leerweg op 1 oktober van het jaar voorafgaand aan
      het jaar waarin de rijksbijdrage wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.5
  - number: 4.2.5.3
    text: |-
      De optelling volgens het tweede lid leidt tot een aantal normatieve bpv-plaatsen voor een kenniscentrum, dat
      rekenkundig wordt afgerond op een geheel getal. Op het aantal normatieve bpv-plaatsen, bedoeld in het tweede
      lid, wordt een correctie voor schaalvoordelen toegepast door dat aantal te vermenigvuldigen met een factor, zoals
      aangegeven in de navolgende tabel:






                    Aantal normatieve bpv-plaatsen


                    Factor






                    1 t/m 10.000


                    1




                    10.001 t/m 15.000


                    0,985




                    15.001 t/m 20.000


                    0,970




                    20.001 t/m 25.000


                    0,955




                    25.001 t/m 30.000


                    0,940




                    30.001 t/m 35.000


                    0,925




                    35.001 t/m 40.000


                    0,910




                    40.001 t/m 45.000


                    0,895




                    45.001 t/m 50.000


                    0,880




                    50.001 en hoger


                    0,865
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.5
  - number: 4.2.5.4
    text: |-
      De berekening volgens het derde lid leidt tot een aantal normatieve bpv-plaatsen voor het kenniscentrum,
      rekenkundig af te ronden op een geheel getal.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.5
  - number: 4.2.5.5
    text: |-
      Van het in het eerste lid bedoelde gedeelte van het landelijk beschikbare budget wordt het bedrag voor het
      kenniscentrum vastgesteld naar rato van het aantal normatieve bpv-plaatsen van elk kenniscentrum nadat daarop de
      correctie en de afronding, bedoeld in het derde respectievelijk vierde lid, heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.5
  - number: 4.2.6.1
    text: |-
      Elk kenniscentrum verstrekt jaarlijks voor 15 november aan Onze Minister een opgave van het aantal door dat
      kenniscentrum erkende leerbedrijven op peildatum 1 oktober van dat jaar.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.6
  - number: 4.2.6.2
    text: |-
      De verklaring omtrent de getrouwheid, bedoeld in [artikel 2.5.3, vierde lid][ref1], juncto
      [artikel 2.5.10, eerste lid, van de wet][ref2] heeft mede betrekking op de opgave, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
  - number: 4.2.7.1
    text: |-
      Onze Minister berekent de rijksbijdrage voor de exploitatiekosten voor het kenniscentrum voor zover het betreft
      het gedeelte van het landelijk beschikbare budget dat is toegerekend aan de maatstaf leerbedrijven, op de wijze als
      bepaald in het tweede tot en met vijfde lid.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.7
  - number: 4.2.7.2
    text: |-
      Voor elk kenniscentrum wordt het aantal leerbedrijven vastgesteld op 1 oktober van het jaar voorafgaand aan het
      jaar waarin de rijksbijdrage wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.7
  - number: 4.2.7.3
    text: |-
      Op het aantal leerbedrijven voor elk kenniscentrum, bedoeld in het tweede lid, wordt een correctie voor
      schaalvoordelen toegepast door dat aantal te vermenigvuldigen met een factor, zoals aangegeven in de navolgende
      tabel:






                    Aantal leerbedrijven


                    Factor






                    1 t/m 7.500


                    1




                    7.501 t/m 10.000


                    0,965




                    10.001 t/m 12.500


                    0,930




                    12.501 t/m 15.000


                    0,895




                    15.001 t/m 17.500


                    0,860




                    17.501 t/m 20.000


                    0,825




                    20.001 t/m 22.500


                    0,790




                    22.501 t/m 25.000


                    0,755




                    25.001 t/m 27.500


                    0,720




                    27.501 t/m 30.000


                    0,685




                    30.001 en hoger


                    0,650
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.7
  - number: 4.2.7.4
    text: |-
      De berekening volgens het tweede en derde lid leidt tot een aantal leerbedrijven voor het kenniscentrum,
      rekenkundig af te ronden op een geheel getal.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.7
  - number: 4.2.7.5
    text: |-
      Van het in het eerste lid bedoelde gedeelte van het landelijk beschikbare budget wordt het bedrag voor het
      kenniscentrum vastgesteld naar rato van het aantal leerbedrijven van elk kenniscentrum nadat daarop de correctie en
      de afronding, bedoeld in het derde respectievelijk vierde lid, heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.7
  - number: 4.2.8
    text: |-
      Bij de berekening, bedoeld in [artikel 4.2.7][ref1], betrekt Onze Minister uitsluitend de leerbedrijven die zijn
      aangeduid met de code leerbedrijf, bedoeld in [bijlage 3][ref2] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0010646
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.2.8
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0010646
  - number: 4.3.1.1
    text: |-
      Onze Minister stelt het bedrag voor huisvestingskosten voor elk kenniscentrum vast overeenkomstig het percentage
      dat op grond van [artikel 4.2.3, tweede lid][ref1], voor dat kenniscentrum is vastgesteld, met dien verstande dat
      aanpassingen als bedoeld in het derde lid van dat artikel daarbij buiten beschouwing blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.3.1
    references:
