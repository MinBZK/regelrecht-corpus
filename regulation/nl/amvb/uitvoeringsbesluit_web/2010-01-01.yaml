    text: 'deeltijds deelnemer: een deelnemer aan een opleiding, niet zijnde een voltijds deelnemer;'
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel2.1.2
  - number: 2.1.2.d
    text: |-
      diploma beroepsonderwijs: een door een examencommissie uitgereikt bewijsstuk dat met goed gevolg is afgelegd
      het examen van een onder a bedoelde opleiding, alsmede van een opleiding die niet langer is opgenomen in het in
      [artikel 2.1.1 van de wet][ref1] bedoelde overzicht,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel2.1.2
