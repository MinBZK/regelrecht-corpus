    text: |-
      Onze Minister berekent de totale rijksbijdrage voor de exploitatiekosten van het kenniscentrum door de middelen
      bij elkaar op te tellen die voor het kenniscentrum zijn berekend op grond van de [artikelen 4.4.3][ref1] en
      [4.4.4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel4
