        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0010646
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.2.7.4
    text: |-
      De instellingen, bedoeld in het eerste lid, dienen uiterlijk 1 november
      van het jaar voorafgaand aan het bekostigingsjaar de gegevens, bedoeld in
      [artikel 2.5.5a, tweede lid, onderdelen a, b, c, d, h, i, k, l, m en n, van de wet][ref1], voorzien van een
      goedkeurende accountantsverklaring, in bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel2.2.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
  - number: 2.2.7.5
    text: |-
      Indien uit de gegevens, bedoeld in het vierde lid, blijkt dat toepassing van [artikel 2.2.3][ref1],
      [artikel 2.2.4][ref2] respectievelijk [artikel 2.2.5][ref3] leidt tot een lagere waarde dan vastgesteld op grond
      van het tweede lid, onderdelen a, b respectievelijk c, wordt de vergoeding van de instelling berekend op grond van
      die lagere waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel2.2.7
