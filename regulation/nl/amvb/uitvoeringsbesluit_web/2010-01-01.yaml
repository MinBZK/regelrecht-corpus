        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0010646
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 6.1.4.3
    text: |-
      Indien een instelling voor het kalenderjaar 2008 een aanvulling ontvangt op grond van het eerste lid, ontvangt die
      instelling voor de kalenderjaren 2009 en 2010 aanvullingen ten bedrage van tweederde respectievelijk eenderde van
      die eerste aanvulling.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel6.1.4
  - number: 6.1.4.4
    text: |-
      Indien aan een instelling voor het kalenderjaar 2008 een bedrag in mindering wordt gebracht op grond van het tweede
      lid, wordt aan die instelling voor de kalenderjaren 2009 en 2010 tweederde respectievelijk eenderde van die eerste
      vermindering in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel6.1.4
  - number: 6.1.5
    text: |-
      Voor de toepassing van [artikel 4b.2.3, eerste lid][ref1], in het studiejaar 2007–2008 wordt in onderdeel a voor
      «1 maart de voorlopige gegevens omtrent de inschrijvingen op 1 oktober van het desbetreffende studiejaar» gelezen:
      8 maart de voorlopige gegevens omtrent de inschrijvingen op 1 oktober van het desbetreffende studiejaar, en op 8
      maart de voorlopige gegevens omtrent de inschrijvingen op 1 februari van het desbetreffende studiejaar.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4b
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel6.1.5
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: 4b
        hoofdstuk: 4B
        paragraaf: '2'
  - number: 6.3.1.1
    text: |-
      Bij ministeriële regeling wordt voorgeschreven, welke gegevens Onze Minister in afwijking van de
      [artikelen 4.2.4 tot en met 4.2.8][ref1] hanteert voor zover nog niet kan worden beschikt over de in die artikelen
      voorgeschreven gegevens. De vervangende gegevens komen zoveel mogelijk overeen met de voorgeschreven gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel6.3.1
    references:
