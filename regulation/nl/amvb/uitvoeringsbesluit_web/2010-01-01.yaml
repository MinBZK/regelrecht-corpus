        bwb_id: BWBR0007625
        artikel: '7'
  - number: 4.1.2.e
    text: 'exploitatiekosten: de kosten van een kenniscentrum niet zijnde de huisvestingskosten;'
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.1.2
  - number: 4.1.2.f
    text: |-
      deelnemer aan de beroepsbegeleidende leerweg: degene die op 1 oktober van het jaar voorafgaand
      aan het jaar waarin de rijksbijdrage wordt vastgesteld, aan een instelling als bedoeld in de
      [artikelen 1.1.1, onderdeel b, onder 1º, 2º en 3º][ref1], [12.3.8][ref2] en [12.3.9 van de wet][ref3] stond
      ingeschreven voor een opleiding aan de beroepsbegeleidende leerweg en daadwerkelijk die opleiding volgt, voor zover
      deze deelnemer:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.1.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '12'
  - number: 4.1.2.f.1°
    text: |-
      uiterlijk op 31 december van eerstbedoeld jaar een overeenkomst als bedoeld in
      [artikel 7.2.8, tweede lid, van de wet][ref1] heeft afgesloten, en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.1.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 4.1.2.f.2°
    text: |-
      een opleiding volgt als bedoeld in [artikel 2.2.3, tweede lid, onder b][ref1], uiterlijk op 1 juni van
      het daaropvolgende kalenderjaar, dan wel in geval de deelnemer een andere opleiding volgt uiterlijk op
      dezelfde datum als genoemd onder 1°, daadwerkelijk de opleiding in de praktijk van het beroep, bedoeld in
      [artikel 7.2.8, eerste lid, van de wet][ref2], volgt op de grondslag van een overeenkomst als bedoeld onder 1°;


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.1.2
