      - id: ref3
        bwb_id: BWBR0010646
        artikel: 4b
        hoofdstuk: 4B
        paragraaf: '2'
  - number: 7.1.1
    text: |-
      Dit besluit treedt, met uitzondering van de [hoofdstukken 2][ref1], [3][ref2], [4][ref3], [5][ref4] voor zover
      het betreft de [artikelen 5.2.1][ref5], [5.2.2][ref6] en [5.2.4][ref7], en 6, in werking met ingang van de dag na
      de datum van uitgifte van het Staatsblad waarin dit besluit wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0010646#Hoofdstuk4
