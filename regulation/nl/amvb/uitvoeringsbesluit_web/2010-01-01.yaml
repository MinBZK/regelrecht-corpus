        bwb_id: BWBR0007625
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0008190
  - number: 5a.4.2
    text: |-
      Het in het eerste lid bedoelde maximum kan worden bijgesteld aan de hand van de algemene salarisontwikkeling die
      voor het personeel van instellingen onderscheidenlijk kenniscentra wordt overeengekomen.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel5a.4
  - number: 6.1.1.2
    text: |-
      Bij ministeriële regeling kan worden voorgeschreven, welke gegevens Onze Minister in afwijking van
      [artikel 2.2.5][ref1] hanteert voor de bekostiging voor zover nog niet kan worden beschikt over de in dat artikel,
      onder b, voorgeschreven gegevens. De vervangende gegevens komen zoveel mogelijk overeen met de voorgeschreven
      gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel6.1.1
