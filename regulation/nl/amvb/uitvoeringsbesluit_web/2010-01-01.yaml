    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.4.5
  - number: 4.4.6.1
    text: Onze Minister stelt het bedrag voor huisvestingskosten voor het kenniscentrum vast.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.4.6
  - number: 4.4.6.2
    text: |-
