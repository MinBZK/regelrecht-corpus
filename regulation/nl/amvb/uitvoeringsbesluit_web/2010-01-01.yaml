  - number: 2.7.2.2
    text: |-
      Indien een deelnemer zich inschrijft na 1 augustus van een studiejaar wordt de hoogte van het leerlinggebonden
      budget vastgesteld door het bedrag dat voor hem geldt op grond van de tabellen, opgenomen in het eerste lid, te
      delen door 12 en vervolgens te vermenigvuldigen met het aantal maanden dat het studiejaar rest.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel2.7.2
  - number: 2.7.2.3
    text: |-
      De bedragen, bedoeld in het eerste lid, kunnen bij ministeriële regeling worden aangepast aan de prijsontwikkeling,
      overeenkomstig de prijsmutatie van de netto materiële consumptie, zoals opgenomen in de Macro Economische
      Verkenning, die naar verwachting zal optreden tussen het prijsniveau in het jaar voorafgaande aan het jaar waarin
      het bedrag wordt aangepast, en het jaar waarin het bedrag wordt aangepast.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel2.7.2
  - number: 2.7.3.1
    text: |-
      Een regionaal expertisecentrum ontvangt € 173 voor elke deelnemer die in de periode van 12 maanden direct
      voorafgaand aan 1 oktober van het voorafgaande studiejaar een bevestigende beoordeling van de commissie als bedoeld
      in[ artikel 2.2.6, eerste lid, van de wet][ref1] heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel2.7.3
