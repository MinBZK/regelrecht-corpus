  - number: 4.1.2
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.1.2
  - number: 4.1.2.a
    text: |-
      kenniscentrum: een kenniscentrum beroepsonderwijs bedrijfsleven als bedoeld in
      [artikel 1.1.1, onderdeel b2, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.1.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 4.1.2.b
    text: |-
      leerbedrijf: een bedrijf dat of organisatie die bevoegd is de beroepspraktijkvorming te verzorgen, op
      basis van een gunstige beoordeling op grond van door het kenniscentrum vastgestelde criteria als bedoeld in
      [artikel 7.2.10 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.1.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 4.1.2.c
    text: |-
      normatieve bpv-plaats: een in [artikel 4.2.5][ref1] bedoelde normatieve bpv-plaats;


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.1.2
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.1.2.d
    text: |-
      opleiding: een opleiding als bedoeld in [artikel 7.2.2 van de wet][ref1] in de beroepsopleidende of
      beroepsbegeleidende leerweg, dan wel in beide leerwegen;


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.1.2
    references:
