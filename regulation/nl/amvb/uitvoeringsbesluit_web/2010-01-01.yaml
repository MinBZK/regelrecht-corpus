        bwb_id: BWBR0007625
        artikel: '2'
  - number: 2.1.2.b
    text: |-
      voltijds deelnemer: een deelnemer die blijkens een overeenkomst als bedoeld in [artikel 8.1.3 van de wet][ref1] een
      voltijdse opleiding volgt als bedoeld in [artikel 1.1.1, onderdeel i1, van de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
