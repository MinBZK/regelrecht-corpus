  - number: 2.2.5
    text: |-
      Onze Minister berekent het rijksbijdragedeel voor voorbereidende en ondersteunende activiteiten als bedoeld in
      [artikel 7.2.2, vierde lid, van de wet][ref1], voor een kalenderjaar door het landelijk beschikbare budget ten
      behoeve van voorbereidende en ondersteunende activiteiten, zoals dat voor dat kalenderjaar is vastgesteld op grond
      van [artikel 2.2.1, eerste lid][ref2], over de instellingen te verdelen naar rato van het aantal deelnemers per
      instelling, voor zover deze deelnemers voldoen aan de volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel2.2.5
    references:
