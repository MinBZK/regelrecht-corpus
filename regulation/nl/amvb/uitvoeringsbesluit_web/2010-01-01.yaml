        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.2.7.2.b
    text: |-
      in afwijking van [artikel 2.2.4][ref1] de uitkomst van het gedeelte van de formule boven de streep vastgesteld op
      90% van de uitkomst van dat deel van de formule van het voorgaande kalenderjaar;


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel2.2.7
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.2.7.2.c
    text: |-
      in afwijking van [artikel 2.2.5][ref1] het aantal deelnemers vastgesteld op 90% van het aantal deelnemers dat is
      gehanteerd bij de berekening van de rijksbijdrage van het voorgaande kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel2.2.7
    references:
