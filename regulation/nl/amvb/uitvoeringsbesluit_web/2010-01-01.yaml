        artikel: '12'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '12'
  - number: 4b.2.1.1
    text: |-
      De Informatie Beheer Groep verstrekt uit het basisregister onderwijs voor iedere
      instelling afzonderlijk aan Onze Minister en de inspectie de gegevens, bedoeld in
      [artikel 9b, eerste lid, onderdelen d, e en g, van de Wet verzelfstandiging Informatiseringsbank][ref1], met
      uitzondering van de persoonsgebonden nummers, de geslachtsnamen, de voornamen en de geboortedata van de deelnemers
      en voormalige deelnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel9b
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.2.1
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: 9b
  - number: 4b.2.1.2
    text: |-
      Bij de verstrekking, bedoeld in het eerste lid, vervangt de Informatie Beheer Groep het persoonsgebonden nummer
      voor Onze Minister en de inspectie elk afzonderlijk door een ander nummer of een code op een zodanige wijze
      dat de deelnemers en de voormalige deelnemers niet geïdentificeerd of identificeerbaar zijn, en vervangt zij de
      geboortedatum
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.2.1
  - number: 4b.2.1.2.a
    text: |-
      voor de levering aan Onze Minister door de leeftijd van de deelnemer op 1 augustus, 30 september, 1 oktober en
      31 december van het kalenderjaar waarin de peildatum valt en
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.2.1
  - number: 4b.2.1.2.b
    text: |-
      voor de levering aan de inspectie door de leeftijd van de deelnemer op de eerste dag van elk kwartaal van het
      studiejaar waarop de gegevens betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.2.1
  - number: 4b.2.2.1
    text: |-
      De Informatie Beheer Groep verstrekt de gegevens, bedoeld in [artikel 4b.2.1][ref1], langs elektronische weg.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4b
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.2.2
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: 4b
        hoofdstuk: 4B
        paragraaf: '2'
  - number: 4b.2.2.2
    text: |-
      De gegevens worden gespecificeerd overeenkomstig het bepaalde krachtens
      [artikel 2.3.6a, derde lid, eerste volzin][ref1], en [2.5.5a, derde lid, eerste volzin, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
  - number: 4b.2.3.1
    text: |-
      De Informatie Beheer Groep verstrekt de gegevens, bedoeld in [artikel 4b.2.1][ref1], aan Onze Minister en aan de
      inspectie op de volgende tijdstippen:


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4b
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.2.3
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: 4b
        hoofdstuk: 4B
        paragraaf: '2'
  - number: 4b.2.3.1.a
    text: |-
      op 15 november en 8 maart de voorlopige gegevens omtrent de inschrijvingen op 1 oktober van het desbetreffende
      studiejaar, en op 8 maart de voorlopige gegevens omtrent de inschrijvingen op 1 februari van het desbetreffende
      studiejaar,
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.2.3
  - number: 4b.2.3.1.b
    text: |-
      op 15 november de voorlopige gegevens omtrent de resultaten, examens en diploma’s in het studiejaar voorafgaand aan
      het desbetreffende studiejaar,
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.2.3
  - number: 4b.2.3.1.c
    text: |-
      op 15 november de voorlopige gegevens omtrent de in- en uitschrijvingen in het studiejaar voorafgaand aan het
      desbetreffende studiejaar,
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.2.3
  - number: 4b.2.3.1.d
    text: |-
      op 8 maart de voorlopige gegevens omtrent de examens in het kalenderjaar, voorafgaand aan het desbetreffende
      kalenderjaar,
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.2.3
  - number: 4b.2.3.1.e
    text: |-
      op 8 juli de gegevens, voor zover het beroepsonderwijs betreft na accountantscontrole, omtrent de inschrijvingen op
      1 oktober en 1 februari van het desbetreffende studiejaar,
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.2.3
  - number: 4b.2.3.1.f
    text: |-
      op 8 juli de gegevens, voor zover het beroepsonderwijs betreft na accountantscontrole, omtrent de examens in het
      kalenderjaar voorafgaand aan het desbetreffende kalenderjaar,
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.2.3
  - number: 4b.2.3.1.g
    text: |-
      op 8 juli de gegevens omtrent de in- en uitschrijvingen in het studiejaar voorafgaand aan het desbetreffende
      studiejaar.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.2.3
  - number: 4b.2.3.2
    text: |-
      Onze Minister kan de Informatie Beheer Groep toestemming verlenen de gegevens, bedoeld in het eerste lid, op een
      later, door Onze Minister vast te stellen tijdstip te verstrekken, voor zover de gegevens nog niet beschikbaar
      zijn.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.2.3
  - number: 4b.2.3.3
    text: |-
      Onverminderd het eerste lid, verstrekt de Informatie Beheer Groep de gegevens omtrent de examens aan de inspectie,
      onmiddellijk nadat de Informatie Beheer Groep deze gegevens in het basisregister onderwijs heeft opgenomen.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.2.3
  - number: 4b.2.4
    text: |-
      De [artikelen 4b.2.1][ref1] en [4b.2.3][ref2] zijn niet van toepassing op de verstrekking van
      gegevens op verzoek van de inspectie ten behoeve van een onderzoek door de inspectie als bedoeld in
      [artikel 2.5.5b, derde lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4b
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel4b
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.2.4
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: 4b
        hoofdstuk: 4B
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0010646
        artikel: 4b
        hoofdstuk: 4B
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '2'
  - number: 4b.3.1
    text: |-
      Ten behoeve van de vaststelling van de bekostiging van een instelling kan Onze Minister de volgende in het
      basisregister onderwijs opgenomen gegevens van een deelnemer of voormalige deelnemer van de instelling raadplegen:
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.3.1
  - number: 4b.3.1.a
    text: het persoonsgebonden nummer;
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.3.1
  - number: 4b.3.1.b
    text: het geslacht, de geboortedatum en de postcode van de woonplaats;
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.3.1
  - number: 4b.3.1.c
    text: de datum van in- en uitschrijving;
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.3.1
  - number: 4b.3.1.d
    text: de kwalificatie en de leerweg;
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.3.1
  - number: 4b.3.1.e
    text: indien van toepassing, het al dan niet zijn van risicodeelnemer;
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.3.1
  - number: 4b.3.1.f
    text: |-
      het behaalde diploma, dan wel, voorzover het betreft het beroepsonderwijs op het gebied van de landbouw en de
      natuurlijke omgeving, de behaalde deelkwalificaties;
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.3.1
  - number: 4b.3.1.g
    text: |-
      de omvang van de beroepspraktijkvorming, de datum van begin en einde daarvan, de afsluitdatum van de
      beroepspraktijkvormingsovereenkomst en het betrokken bedrijf dat of de betrokken organisatie die de
      beroepspraktijkvormingsovereenkomst verzorgt;
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.3.1
  - number: 4b.3.1.h
    text: de gegevens over de nationaliteit en het verblijfsrecht van de deelnemer;
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.3.1
  - number: 4b.3.1.i
    text: het registratienummer van de instelling;
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.3.1
  - number: 4b.3.1.j
    text: indien van toepassing het volgen van de opleiding in voltijd of deeltijd en het zijn van examendeelnemer;
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.3.1
  - number: 4b.3.1.k
    text: het al dan niet voor bekostiging in aanmerking komen van de deelnemer of het diploma; en
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.3.1
  - number: 4b.3.1.l
    text: |-
      indien van toepassing, het gebruiken van het persoonsgebonden nummer ten behoeve van de uitvoering van de
      subsidieregelingen van het Europees Sociaal Fonds in het verkeer met de instelling.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.3.1
  - number: 4b.3.2.1
    text: |-
      De raadpleging van gegevens, bedoeld in [artikel 4b.3.1][ref1], geschiedt langs elektronische weg.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4b
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.3.2
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: 4b
        hoofdstuk: 4B
        paragraaf: '3'
  - number: 4b.3.2.2
    text: |-
      De gegevens, bedoeld in [artikel 4b.3.1, onderdelen d tot en met f][ref1], worden gespecificeerd overeenkomstig het
      bepaalde krachtens [artikel 2.5.5a, derde lid, eerste volzin, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4b
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.3.2
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: 4b
        hoofdstuk: 4B
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
  - number: 4b.3.3.1
    text: |-
      De gegevens, bedoeld in [artikel 4b.3.1][ref1], worden uitsluitend geraadpleegd door de daartoe door Onze Minister
      aangewezen ambtenaren van het agentschap Centrale financiën instellingen dan wel, voor zover het betreft het
      onderwijs op het gebied van landbouw en natuurlijke omgeving, door de daartoe door Onze Minister aangewezen
      ambtenaren van het Ministerie van Landbouw, Natuur en Voedselkwaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4b
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.3.3
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: 4b
        hoofdstuk: 4B
        paragraaf: '3'
  - number: 4b.3.3.2
    text: 'Onze Minister kan uitsluitend raadplegen:'
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.3.3
  - number: 4b.3.3.2.a
    text: |-
      de gegevens van een deelnemer of voormalige deelnemer van wie het bevoegd gezag op grond van
      [2.5.5a, vierde lid, van de wet][ref1] het persoonsgebonden nummer aan Onze Minister heeft verstrekt ten behoeve
      van de vaststelling van de bekostiging van de instelling;


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.3.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
  - number: 4b.3.3.2.b
    text: |-
      de gegevens van een deelnemer of voormalige deelnemer, voorzover Onze Minister dit noodzakelijk
      acht naar aanleiding van een melding van de Informatie Beheer Groep of de inspectie als bedoeld in
      [2.5.5b, derde lid, van de wet][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.3.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
  - number: 4b.3.3.2.c
    text: |-
      de gegevens van een deelnemer of voormalige deelnemer, voorzover Onze Minister het noodzakelijk acht deze gegevens
      op grond van [artikel 2.5.5d, derde lid, van de wet][ref1] ten behoeve van de vaststelling van de bekostiging van
      de instelling te gebruiken in het verkeer met die instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.3.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
  - number: 4b.3.3.3
    text: |-
      De gegevens, bedoeld in [artikel 4b.3.1][ref1], worden door Onze Minister na raadpleging uitsluitend verder
      verwerkt, voor zover dit noodzakelijk is voor de vaststelling van de bekostiging van de instelling waaraan
      de desbetreffende deelnemer is ingeschreven of ingeschreven is geweest, daaronder begrepen de motivering van
      beschikkingen en de behandeling van bezwaar- en beroepschriften, en de persoonlijke levenssfeer van de betrokkene
      niet onevenredig wordt geschaad. De gegevens worden door Onze Minister vernietigd zodra zij voor de vaststelling
      van de bekostiging van de betrokken instelling niet langer noodzakelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4b
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.3.3
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: 4b
        hoofdstuk: 4B
        paragraaf: '3'
  - number: 5.1.1
    text: 'De bepalingen van dit hoofdstuk hebben betrekking op:'
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel5.1.1
  - number: 5.1.1.a
    text: |-
      instellingen als bedoeld in [artikel 1.1.1, onderdeel b, onder 1° tot en met 4°, van de wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel5.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 5.1.1.b
    text: |-
      kenniscentra beroepsonderwijs bedrijfsleven als bedoeld in [artikel 1.1.1, onderdeel b2, van de wet][ref1], met
      uitzondering van het kenniscentrum beroepsonderwijs bedrijfsleven op het gebied van de landbouw en de natuurlijke
      omgeving, en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel5.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 5.1.1.c
    text: |-
      instellingen als bedoeld in [artikel 2.3.4 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel5.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
  - number: 5.1.2
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel5.1.2
  - number: 5.1.2.a
    text: |-
      kenniscentrum: een kenniscentrum beroepsonderwijs bedrijfsleven als bedoeld in
      [artikel 1.1.1, onderdeel b2, van de wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel5.1.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 5.1.2.b
    text: |-
      gegevenswoordenboek: de opsomming van een door het bevoegd gezag van een instelling of het bestuur van een
      kenniscentrum te verzamelen gegevens, bedoeld in [artikel 5.2.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel5
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel5.1.2
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.2.1.1
    text: |-
      De informatieverzameling, bedoeld in de [artikelen 2.2.4][ref1], [2.3.6][ref2], [2.5.3][ref3] en
      [2.5.5 van de wet][ref4], waarover het bevoegd gezag van een instelling dient te beschikken, bevat de gegevens
      volgens de beschrijving in het gegevenswoordenboek dat is opgenomen in [bijlagen 1][ref5] en [1c][ref6] bij dit
      besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0010646
      [ref6]: https://wetten.overheid.nl/BWBR0010646
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel5.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0010646
      - id: ref6
        bwb_id: BWBR0010646
  - number: 5.2.1.2
    text: |-
      De informatieverzameling, bedoeld in [artikel 2.5.10][ref1] juncto [artikel 2.5.5 van de wet][ref2], waarover
      het bestuur van een kenniscentrum dient te beschikken, bevat de gegevens volgens de beschrijving in het
      gegevenswoordenboek dat is opgenomen in [bijlage 3 bij dit besluit][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0010646
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel5.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0010646
  - number: 5.2.1.3
    text: |-
      De gegevens, bedoeld in het eerste en tweede lid, die betrekking hebben op de bekostiging, zijn in het
      desbetreffende gegevenswoordenboek als zodanig aangeduid.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel5.2.1
  - number: 5.2.2.1
    text: |-
      Op verzoek van Onze Minister stelt het bevoegd gezag van een instelling dan wel het bestuur van een kenniscentrum
      gegevens aan hem beschikbaar, die door de instelling of het kenniscentrum op grond van [artikel 5.2.1][ref1] zijn
      verzameld.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel5
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel5.2.2
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.2.2.2
    text: |-
      De beschikbaarstelling geschiedt overeenkomstig de formulieren die op het beroepsonderwijs respectievelijk
      de werkzaamheden van het kenniscentrum van toepassing zijn, zoals die zijn opgenomen in [bijlage 4][ref1] en
      [bijlage 6][ref2] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0010646
      [ref2]: https://wetten.overheid.nl/BWBR0010646
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel5.2.2
    references:
      - id: ref1
        bwb_id: BWBR0010646
      - id: ref2
        bwb_id: BWBR0010646
  - number: 5.2.2.3
    text: |-
      In voorkomende gevallen kan Onze Minister bij het verzoek om beschikbaarstelling reeds bij hem bekende gegevens
      opnemen.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel5.2.2
  - number: 5.2.3
    text: |-
      Bij ministeriële regeling kan in bijzondere gevallen een aanvullende vragenlijst ten aanzien van bekostiging worden
      vastgesteld ter beantwoording door het bevoegd gezag van een instelling.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel5.2.3
  - number: 5.2.4.1
    text: |-
      Het bevoegd gezag van een instelling en het bestuur van een kenniscentrum bewaren de boeken, bescheiden en
      informatie op andere informatiedragers die verband houden met de toepassing van dit hoofdstuk voor zover het
      betreft gegevens ten behoeve van het door Onze Minister te voeren beleid ten aanzien van het beroepsonderwijs, van
      de educatie en van de kenniscentra, gedurende ten minste zeven jaren.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel5.2.4
  - number: 5.2.4.2
    text: |-
      Het bevoegd gezag van een instelling en het bestuur van een kenniscentrum bewaren de gegevens die verband houden
      met de toepassing van dit hoofdstuk op zodanige wijze dat daaruit de voor de vaststelling van de geaggregeerde
      gegevens van belang zijnde gegevens kunnen worden nagegaan.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel5.2.4
  - number: 5.2.5.1
    text: |-
      Bij ministeriële regeling worden regels vastgesteld voor de inrichting en de uitvoering van de controle door de
      accountant van de boekhouding, de jaarrekening en de administratie van de instellingen en de kenniscentra.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel5.2.5
  - number: 5.2.5.2
    text: |-
      De regels hebben betrekking op de controle op de rechtmatigheid van de verkrijging en de rechtmatigheid en
      doelmatigheid van de besteding van de rijksbijdrage, en de controle op de bekostigingsgegevens, bedoeld in dit
      besluit.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel5.2.5
  - number: 5.2.5.3
    text: |-
      De administratie van de instelling en het kenniscentrum omvat in ieder geval de gegevens, bedoeld in
      [artikel 5.2.1, vierde lid][ref1], en de daaraan ten grondslag liggende bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel5
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel5.2.5
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5a.1
    text: 'De bepalingen van dit hoofdstuk hebben betrekking op:'
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel5a.1
  - number: 5a.1.1
    text: |-
      instellingen als bedoeld in de [artikelen 1.1.1, onderdelen b en b1][ref1], [12.3.8][ref2] en
      [12.3.9 van de wet][ref3], en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel5a.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '12'
  - number: 5a.1.2
    text: |-
      kenniscentra beroepsonderwijs bedrijfsleven als bedoeld in [artikel 1.1.1, onderdeel b2, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel5a.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 5a.1a
    text: |-
      In dit hoofdstuk wordt verstaan onder kenniscentrum: een kenniscentrum beroepsonderwijs bedrijfsleven als bedoeld
      in [artikel 1.1.1, onderdeel b2, van de wet](onbekend).
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel5a.1a
  - number: 5a.2
    text: |-
      Het personeel en het gewezen personeel van instellingen en kenniscentra zijn in elk geval belanghebbende in de zin
      van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel5a.2
  - number: 5a.3
    text: |-
      Indien een instelling of een kenniscentrum de taken beëindigt en een rechtsopvolger ontbreekt, waaronder tevens
      is begrepen het geval van een onherroepelijk vonnis tot faillietverklaring van de desbetreffende instelling of
      het desbetreffende kenniscentrum, voorzien de bevoegde gezagsorganen van de overige instellingen onderscheidenlijk
      de besturen van de overige kenniscentra er gezamenlijk in dat aan de verplichtingen jegens het personeel en het
      gewezen personeel die uit de wet- en regelgeving voortvloeien, wordt voldaan. De toepassing van de eerste volzin
      geschiedt met inachtneming van het bepaalde over vermindering van de rijksbijdrage in verband met de kosten
      van uitkeringen voor gewezen personeel van een instelling die of een kenniscentrum dat de taken beëindigt in de
      ministeriële regeling op grond van [artikel 12.3.48 van de wet][ref1] onderscheidenlijk [artikel 4.5.2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel4
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel5a.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '12'
      - id: ref2
