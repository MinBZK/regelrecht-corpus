      voortvloeiende maatregelen.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.4.6
  - number: 4a.1.1
    text: |-
      Onze Minister verleent subsidie aan het Kwaliteitscentrum examinering beroepsopleidingen voor de
      taken, bedoeld in [artikel 7.4.9a van de wet][ref1], na ontvangst van de begroting, bedoeld in
      [artikel 7.4.9f, eerste lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4a.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 4a.1.2
    text: |-
      De subsidie wordt verleend per kalenderjaar. [Afdeling 4.2.8 van de Algemene wet bestuursrecht][ref1] is van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.8
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4a.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.2.8
  - number: 4a.1.3
    text: |-
      De subsidie wordt bij wijze van voorschot voor de helft voor 1 februari en voor het resterende deel voor 1 juli van
      dat jaar betaalbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4a.1
  - number: 4a.1.4
    text: |-
      Het Kwaliteitscentrum examinering beroepsopleidingen zendt de stukken, bedoeld in
      [artikel 7.4.9f, tweede lid, eerste volzin, van de wet][ref1] voor 1 juli van het jaar, volgend op het jaar waarop
      de subsidie betrekking heeft, naar Onze Minister. Onze Minister stelt de subsidie vast na ontvangst van deze
      stukken.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4a.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 4a.1.5
    text: |-
      Het Kwaliteitscentrum examinering beroepsopleidingen vormt een egalisatiereserve als bedoeld in
      [artikel 4:72 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4a.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 4b.1.1.1
    text: |-
      [Paragraaf 2][ref1] is van toepassing op de gegevens van deelnemers die zijn ingeschreven of ingeschreven
      zijn geweest voor een opleiding educatie of een beroepsopleiding aan een instelling als bedoeld in
      [artikel 1.1.1, onderdeel b][ref2], een instituut als bedoeld in [artikel 12.3.8][ref3] of een hogeschool als
      bedoeld in [artikel 12.3.9 van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Hoofdstuk4B
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4b.1.1
    references:
      - id: ref1
        bwb_id: BWBR0010646
        hoofdstuk: 4B
        paragraaf: '2'
      - id: ref2
