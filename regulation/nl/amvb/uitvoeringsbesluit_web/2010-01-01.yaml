    text: |-
      opleiding: een beroepsopleiding die is opgenomen in het Centraal register en die wordt bekostigd ingevolge een
      besluit van Onze Minister op grond van [artikel 2.1.1, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel2.1.2
    references:
