        paragraaf: '2'
  - number: 2.2.7.6
    text: |-
      Indien uit de gegevens, bedoeld in het vierde lid, blijkt dat toepassing van [artikel 2.2.3][ref1],
      [artikel 2.2.4][ref2] respectievelijk [artikel 2.2.5][ref3], leidt tot een gelijke of hogere waarde dan vastgesteld
      op grond van het tweede lid, onderdelen a, b respectievelijk c, wordt de vergoeding van de instelling berekend op
      grond van het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0010646#Artikel2
