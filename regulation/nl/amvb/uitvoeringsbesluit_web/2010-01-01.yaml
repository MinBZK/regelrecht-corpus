  - number: 2.2.7.1
    text: |-
      De gegevens, bedoeld in [artikel 2.5.5a, tweede lid, onderdelen a, b, c, d, h, i, k, l, m en n, van de wet][ref1]
      en de verklaring, bedoeld in [artikel 2.2.4, vijfde lid, van de wet][ref2] worden uiterlijk 1 juli van het jaar
      voorafgaand aan het bekostigingsjaar ingediend bij de Informatie Beheer Groep. Indien de Informatie Beheer Groep
      van een instelling de gegevens, bedoeld in de eerste volzin, niet uiterlijk 1 juli van het jaar voorafgaand
      aan het bekostigingsjaar, voorzien van een goedkeurende accountantsverklaring, heeft ontvangen en hierdoor de
      gegevens niet volgens [artikel 4b.2.3, eerste lid, onderdelen e tot en met g][ref3], kan verstrekken, stelt Onze
      Minister de hoogte van de rijksbijdrage voor deze instelling voor het desbetreffende kalenderjaar vast, conform de
      voorschriften in het tweede tot en met het vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0010646#Artikel4b
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel2.2.7
    references:
