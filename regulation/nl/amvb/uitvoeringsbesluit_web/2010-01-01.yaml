        artikel: '1'
  - number: 4.4.3.b
    text: |-
      de taken, bedoeld in [artikel 1.5.2, derde lid, van de wet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel4.4.3
    references:
