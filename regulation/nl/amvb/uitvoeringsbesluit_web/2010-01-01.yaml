        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0010646
  - number: 6.3.2.1
    text: |-
      Tot een bij koninklijk besluit te bepalen datum zijn de [artikelen 4.2.1 tot en met 4.2.5][ref1], [4.2.7][ref2] en
      [4.2.8][ref3] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0010646#Artikel4
    url: https://wetten.overheid.nl/BWBR0010646/2010-01-01#Artikel6.3.2
    references:
