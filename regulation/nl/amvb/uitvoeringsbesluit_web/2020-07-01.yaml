    text: |-
      Voor het kalenderjaar 2017 wordt de uitkering educatie die aan een college van burgemeester en wethouders van een
      contactgemeente van een regio wordt verstrekt, berekend door de uitkomst van de formule {bi : bl} x 1/3 x bm op
      te tellen bij twee derde van het bedrag volgens de formule in [artikel 3.2.1, eerste lid][ref1], waarbij wordt
      verstaan onder: bi: de som van de bedragen die de gemeenten binnen deze regio voor het jaar 2014 hebben ontvangen
      op grond van [artikel 4 van het Besluit participatiebudget][ref2] zoals dat luidde op 31 december 2014; bl:
      het landelijk budget educatie in het jaar 2014 ingevolge de [Wet participatiebudget][ref3] zoals die luidde op
      31 december 2014; bm: het totale bedrag dat door Onze Minister beschikbaar is gesteld voor uitkeringen educatie
      voor alle regio’s educatie voor het kalenderjaar 2017.


