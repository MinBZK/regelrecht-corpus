  - number: 2.1.3.1
    text: |-
      Binnen het raam van de door de begrotingswetgever voor het desbetreffende kalenderjaar beschikbaar gestelde
      middelen, stelt Onze Minister jaarlijks de omvang vast van het landelijk beschikbare budget voor de
      exploitatiekosten en de huisvestingskosten voor zowel het beroepsonderwijs als het voorbereidend beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2.1.3
  - number: 2.1.3.2
    text: |-
      Het landelijk beschikbare budget voor de exploitatiekosten en de huisvestingskosten voor het beroepsonderwijs wordt
      verdeeld in landelijk beschikbare budgetten voor:
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2.1.3
  - number: 2.1.3.2.a
    text: de entreeopleiding, en
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2.1.3
  - number: 2.1.3.2.b
    text: de basisberoepsopleiding, vakopleiding, middenkaderopleiding en specialistenopleiding.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2.1.3
  - number: 2.2.1.1
    text: |-
      Onze Minister berekent de rijksbijdrage voor een instelling voor de exploitatiekosten en de huisvestingskosten voor
      het beroepsonderwijs voor een kalenderjaar door bij elkaar op te tellen:
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2.2.1
  - number: 2.2.1.1.a
    text: het rijksbijdragedeel voor de entreeopleiding, en
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2.2.1
  - number: 2.2.1.1.b
    text: het rijksbijdragedeel voor de basisberoepsopleiding, vakopleiding, middenkaderopleiding en specialistenopleiding,
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2.2.1
  - number: 2.2.1.2
    text: |-
      De op grond van het eerste lid berekende rijksbijdrage wordt vermeerderd met het rijksbijdragedeel voor
      gehandicapte deelnemers, zoals dat wordt berekend op grond van [artikel 2.6a.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 6a
  - number: 2.2.1.3
    text: |-
      De op grond van het eerste en tweede lid berekende rijksbijdrage kan worden aangepast in verband met uit de
      rijksbegroting voortvloeiende maatregelen.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2.2.1
  - number: 2.2.2.1
    text: |-
      Onze Minister berekent het rijksbijdragedeel voor de entreeopleiding volgens de formule:







                    IDW






                    –––––


                    x


                    LB




                    LDW






           waarbij wordt verstaan onder: - *IDW:* de op grond van het tweede lid berekende deelnemerswaarde voor de
      entreeopleiding van de instelling, afgerond op twee decimalen;
        - *LDW:* de landelijke deelnemerswaarde voor de entreeopleiding, zijnde de som van de deelnemerswaarden voor de
      entreeopleiding van de instellingen;
        - *LB:* het landelijk beschikbare budget voor de entreeopleiding.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2.2.2
  - number: 2.2.2.2
    text: |-
      IDW wordt berekend volgens de formule: ∑ [(Dbbl x 0,5 x PF) + (Dbol x PF)] x Cf waarbij wordt verstaan onder:
        - *Dbbl:* elke deelnemer die a. op 1 oktober van het tweede kalenderjaar voorafgaand aan het bekostigingsjaar
      aan de desbetreffende instelling is ingeschreven voor de entreeopleiding in de beroepsbegeleidende leerweg, b.
      daadwerkelijk die opleiding volgt en c. uiterlijk op 31 december van datzelfde kalenderjaar een overeenkomst als
      bedoeld in [artikel 7.2.8, tweede lid, van de wet][ref1] heeft gesloten die geheel of gedeeltelijk betrekking heeft
      op een kwalificatie of kwalificatiedossier, behorend bij die opleiding;
        - *Dbol:* elke deelnemer die op 1 oktober van het tweede kalenderjaar voorafgaand aan het bekostigingsjaar aan de
      desbetreffende instelling is ingeschreven voor de entreeopleiding in de beroepsopleidende leerweg en daadwerkelijk
      die opleiding volgt;
        - *PF:* de op grond van het vijfde lid voor de opleiding waarin de deelnemer is ingeschreven geldende prijsfactor;
        - *Cf:* de op grond van het vierde lid berekende correctiefactor tweede teldatum voor de entreeopleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 2.2.2.4
    text: |-
      Cf wordt als volgt berekend:






                    [Dbbl1 x 0,5 + Dbol1]+ [Dbbl2 x 0,5 + Dbol2]





                    2 x[Dbbl1 x 0,5 + Dbol1]





           In deze formule wordt verstaan onder: - *Dbbl1:* het aantal bbl-deelnemers dat op 1 oktober van het tweede
      kalenderjaar voorafgaand aan het bekostigingsjaar aan de desbetreffende instelling is ingeschreven voor de
      entreeopleiding en daadwerkelijk die opleiding volgt;
        - *Dbol1:* het aantal bol-deelnemers dat op 1 oktober van het tweede kalenderjaar voorafgaand aan het
      bekostigingsjaar aan de desbetreffende instelling staat ingeschreven voor een entreeopleiding en daadwerkelijk die
      opleiding volgt;
        - *Dbbl2:* het aantal bbl-deelnemers dat op 1 februari van het kalenderjaar voorafgaand aan het bekostigingsjaar
      aan de desbetreffende instelling is ingeschreven voor de entreeopleiding en daadwerkelijk die opleiding volgt;
        - *Dbol2:* het aantal bol-deelnemers dat op 1 februari van het kalenderjaar voorafgaand aan het bekostigingsjaar
      aan de desbetreffende instelling staat ingeschreven voor een entreeopleiding en daadwerkelijk die opleiding volgt.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2.2.2
  - number: 2.2.2.5
    text: PF wordt bij ministeriële regeling vastgesteld voor elke opleiding.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2.2.2
  - number: 2.2.2.6
    text: |-
      Voor de berekening, bedoeld in dit artikel, tellen de deelnemers die op de genoemde tijdstippen voor de
      assistentopleiding, bedoeld in [artikel 7.2.2, eerste lid, onderdeel a, van de wet][ref1] zoals dat onderdeel
      luidde op 31 juli 2014, zijn ingeschreven als ingeschreven deelnemers voor de entreeopleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 2.2.3.1
    text: |-
      Onze Minister berekent het rijksbijdragedeel voor de basisberoepsopleiding, vakopleiding, middenkaderopleiding en
      specialistenopleiding volgens de formule:







                    IDW + IDiW






                    –––––––––––––


                    x


                    LB




                    LDW + LDiW






           waarbij wordt verstaan onder: - *IDW:* de op grond van het tweede lid berekende deelnemerswaarde voor de
      basisberoepsopleiding, vakopleiding, middenkaderopleiding en specialistenopleiding van de instelling, afgerond op
      twee decimalen;
        - *IDiW:* de op grond van het zesde lid berekende diplomawaarde, afgerond op twee decimalen;
        - *LDW:* de landelijke deelnemerswaarde voor de basisberoepsopleiding, vakopleiding, middenkaderopleiding en
      specialistenopleiding, zijnde de som van de deelnemerswaarden voor de basisberoepsopleiding, vakopleiding,
      middenkaderopleiding en specialistenopleiding van alle instellingen;
        - *LDiW:* de landelijke diplomawaarde, zijnde de som van de diplomawaarden van alle instellingen;
        - *LB:* het landelijk beschikbare budget voor de basisberoepsopleiding, vakopleiding, middenkaderopleiding en
      specialistenopleiding.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2.2.3
  - number: 2.2.3.2
    text: |-
      IDW wordt berekend volgens de formule: ∑ [(Dbbl x 0,4 x PF) + (Dbol x PF)] x 0,8 x Cf waarbij wordt
      verstaan onder: - *Dbbl:* elke deelnemer die a. op 1 oktober van het tweede kalenderjaar voorafgaand aan het
      bekostigingsjaar aan de desbetreffende instelling is ingeschreven voor de basisberoepsopleiding, vakopleiding,
      middenkaderopleiding of specialistenopleiding in de beroepsbegeleidende leerweg, b. daadwerkelijk die
      opleiding volgt en c. uiterlijk op 31 december van datzelfde kalenderjaar een overeenkomst als bedoeld in
      [artikel 7.2.8, tweede lid, van de wet][ref1] heeft gesloten die geheel of gedeeltelijk betrekking heeft op een
      kwalificatie of kwalificatiedossier, behorend bij die opleiding, en 1° daadwerkelijk op die datum die opleiding
      in de praktijk van het beroep volgt, dan wel 2° indien een deelnemer een opleiding volgt waarvoor kwalificaties
      als bedoeld in [artikel 7.2.4, eerste lid, van de wet][ref2] zijn vastgesteld in overeenstemming met Onze Minister
      van Volksgezondheid, Welzijn en Sport uiterlijk op 1 juni van het kalenderjaar daarop volgend de opleiding in de
      praktijk van het beroep volgt;
        - *Dbol:* elke deelnemer die op 1 oktober van het tweede kalenderjaar voorafgaand aan het bekostigingsjaar aan
      de desbetreffende instelling is ingeschreven voor de basisberoepsopleiding, vakopleiding, middenkaderopleiding of
      specialistenopleiding in de beroepsopleidende leerweg en daadwerkelijk die opleiding volgt;
        - *PF:* de op grond van het vierde lid voor de opleiding waarin de deelnemer is ingeschreven geldende prijsfactor;
        - *Cf:* de op grond van het vijfde lid berekende correctiefactor tweede teldatum voor de basisberoepsopleiding,
      vakopleiding, middenkaderopleiding of specialistenopleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 2.2.3.4
    text: PF wordt bij ministeriële regeling vastgesteld voor elke opleiding.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2.2.3
  - number: 2.2.3.5
    text: |-
      Cf wordt als volgt berekend:






                    [Dbbl1 x 0,4 + Dbol1]+ [Dbbl2 x 0,4 + Dbol2]





                    2 x[Dbbl1 x 0,4 + Dbol1]





           In deze formule wordt verstaan onder: - *Dbbl1:* het aantal bbl-deelnemers dat op 1 oktober van het tweede
      kalenderjaar voorafgaand aan het bekostigingsjaar aan de desbetreffende instelling is ingeschreven voor de
      basisberoepsopleiding, vakopleiding, middenkaderopleiding of specialistenopleiding en daadwerkelijk die opleiding
      volgt;
        - *Dbol1:* het aantal bol-deelnemers dat op 1 oktober van het tweede kalenderjaar voorafgaand aan het
      bekostigingsjaar aan de desbetreffende instelling staat ingeschreven voor de basisberoepsopleiding, vakopleiding,
      middenkaderopleiding of specialistenopleiding en daadwerkelijk die opleiding volgt;
        - *Dbbl2:* het aantal bbl-deelnemers dat op 1 februari van het kalenderjaar voorafgaand aan het bekostigingsjaar
      aan de desbetreffende instelling is ingeschreven voor de basisberoepsopleiding, vakopleiding, middenkaderopleiding
      of specialistenopleiding en daadwerkelijk die opleiding volgt;
        - *Dbol2:* het aantal bol-deelnemers dat op 1 februari van het kalenderjaar voorafgaand aan het bekostigingsjaar
      aan de desbetreffende instelling staat ingeschreven voor de basisberoepsopleiding, vakopleiding,
      middenkaderopleiding of specialistenopleiding en daadwerkelijk die opleiding volgt.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2.2.3
  - number: 2.2.3.6
    text: |-
      IDiW wordt berekend volgens de formule: IDiW = ∑ {[(D x DiW – DiE) + DS] x 0,2} waarbij wordt verstaan onder:
        - *D:* elke deelnemer die in het tweede kalenderjaar voorafgaand aan het bekostigingsjaar aan de desbetreffende
      instelling een diploma van een basisberoepsopleiding, vakopleiding of middenkaderopleiding heeft behaald;
        - *DiW:* de diplomawaarde; DiW bedraagt voor: een basisberoepsopleiding: 1 een vakopleiding: 3 een
      middenkaderopleiding: 5;
        - *DiE:* DiW van het hoogste door D eerder behaalde diploma van een basisberoepsopleiding, een vakopleiding of
      een middenkaderopleiding.
        - *DS:* de diplomawaarde voor een specialistenopleiding bedraagt 2 voor elke deelnemer die een diploma van een
      specialistenopleiding heeft behaald in het tweede kalenderjaar voorafgaand aan het bekostigingsjaar, en niet eerder
      een diploma van een specialistenopleiding heeft behaald. Onder deelnemer wordt mede begrepen de examendeelnemer,
      bedoeld in [artikel 2.2.2, tweede lid, onderdeel b, van de wet][ref1]. Indien het eerder behaalde diploma, bedoeld
      in DiE van een hoger niveau is dan het diploma bedoeld in D, dan wordt het diploma bedoeld in D buiten beschouwing
      gelaten. Indien in het tweede kalenderjaar voorafgaand aan het bekostigingsjaar meerdere diploma’s op dezelfde
      datum zijn afgegeven, telt steeds het laagste diploma als het eerder behaalde diploma. Indien een diploma is
      behaald door een deelnemer die drie aaneengesloten voorgaande kalenderjaren niet op 1 oktober was ingeschreven,
      blijven diploma’s behaald voor deze onderbreking buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2.2.3
    references:
