        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
  - number: 2a.1.2.b
    text: |-
      deelnemer vavo: een deelnemer die bij een instelling als bedoeld in
      [artikel 1.1.1, onderdeel b, onder 1°, van de wet][ref1] is ingeschreven voor een of meer opleidingen vavo;


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2a.1.2
