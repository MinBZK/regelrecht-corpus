        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0010646
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.3.2.1
    text: |-
      Onze Minister maakt aan een agrarisch opleidingscentrum jaarlijks in december bekend welke rijksbijdrage voor het
      voorbereidend beroepsonderwijs en voor het aan de instelling verbonden praktijkonderwijs voor het daarop volgende
      kalenderjaar wordt verstrekt. Hij deelt daarbij mee op welke wijze de rijksbijdrage is berekend.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2.3.2
  - number: 2.3.2.2
    text: |-
      Onze Minister berekent de rijksbijdrage voor een agrarisch opleidingscentrum voor de exploitatiekosten voor
      het voorbereidend beroepsonderwijs, dat ten behoeve van deze berekening is onderverdeeld in beroepsonderwijs en
      leerwegondersteunend onderwijs en praktijkonderwijs, volgens de formule: - {Liv x PLiv} + {Lil x PLil} + (VVi) In
      deze formule wordt verstaan onder: - Liv: het aantal leerlingen dat op 1 oktober van het kalenderjaar voorafgaand
      aan het desbetreffende jaar aan het desbetreffende agrarisch opleidingscentrum staat ingeschreven voor het
      voorbereidend beroepsonderwijs inclusief de geïndiceerde leerlingen voor praktijkonderwijs en leerwegondersteunend
      onderwijs,
        - Lil: het aantal leerlingen dat op 1 oktober van het kalenderjaar voorafgaand aan het desbetreffende jaar aan
      het desbetreffende agrarisch opleidingscentrum staat ingeschreven voor het leerwegondersteunend onderwijs of het
      praktijkonderwijs,
        - PLiv: de op grond van het derde lid voor het desbetreffende kalenderjaar vastgestelde prijs per leerling
      beroepsonderwijs,
        - PLil: het op grond van [artikel 85b1, zesde lid][ref1] en
      [artikel 89a1, vijfde lid, Wet voortgezet onderwijs][ref2] voor het desbetreffende kalenderjaar vastgestelde
      ondersteuningsbedrag per onder Lil genoemde leerling en
        - VVi: de bij ministeriële regeling vastgestelde vaste voet per instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel85b1
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel89a1
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2.3.2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 85b1
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 89a1
  - number: 2.3.2.3
    text: |-
      Jaarlijks voor 1 november van het kalenderjaar waarvoor de rijksbijdrage wordt vastgesteld, worden bij ministeriële
      regeling de prijs per leerling en de vaste voet per instelling vastgesteld. Bij de jaarlijkse vaststelling van de
      prijs per leerling wordt rekening gehouden met het beschikbare budget van het Rijk.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2.3.2
  - number: 2.3.2.4
    text: |-
      Voor de toepassing van het tweede lid worden leerlingen die vreemdeling als bedoeld in
      [artikel 1 van de Vreemdelingenwet 2000][ref1] zijn en die op 1 oktober korter dan één jaar in Nederland
      verblijven, niet meegeteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel1
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2.3.2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '1'
  - number: 2.3.2.5
    text: |-
      Onze Minister stelt vier keer per jaar de rijksbijdrage vast voor een agrarisch opleidingscentrum voor de
      exploitatiekosten voor het voorbereidend beroepsonderwijs aan leerlingen als bedoeld in het vierde lid. Daartoe
      worden de leerlingen als bedoeld in het vierde lid meegeteld die op 1 januari, 1 april, 1 juli of 1 oktober aan een
      agrarisch opleidingscentrum staan ingeschreven voor voorbereidend beroepsonderwijs. Het bedrag per leerling wordt
      bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2.3.2
  - number: 2.4.1.1
    text: |-
      De rijksbijdrage voor de huisvestingskosten van een school voor voortgezet onderwijs als bedoeld in
      [artikel 2.6, lid 1a, van de wet][ref1] wordt berekend door het aantal leerlingen dat op 1 oktober van het tweede
      kalenderjaar voorafgaand aan het desbetreffende kalenderjaar aan de school was ingeschreven te vermenigvuldigen met
      een jaarlijks bij ministeriële regeling te bepalen bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
  - number: 2.4.1.2
    text: Het eerste lid is van overeenkomstige toepassing op het voorbereidend beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2.4.1
  - number: 2.4.1.3
    text: |-
      [Artikel 2.2.4][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2.4.1
    references:
