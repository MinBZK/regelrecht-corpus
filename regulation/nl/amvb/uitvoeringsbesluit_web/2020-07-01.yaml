  - number: 6.1.5.2
    text: |-
      De instellingen, bedoeld in het eerste lid, dienen uiterlijk 1 november 2014 de gegevens bedoeld in
      [artikel 2.5.5a, tweede lid, onderdelen a, b, c, d, h, i, l, m en n, van de wet][ref1], voorzien van een
      goedkeurende accountantsverklaring, in bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel6.1.5
    references:
