  - number: 2a.1.2.c
    text: |-
      diploma vavo: diploma als bedoeld in [artikel 7.4.6][ref1] juncto [artikel 7.4.11, vijfde lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2a.1.2
