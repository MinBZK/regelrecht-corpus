  - number: 7.1.2
    text: |-
      De [hoofdstukken 2][ref1], [3][ref2], [4][ref3] en [6 van dit besluit][ref4] treden in werking op een
      bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende hoofdstukken, paragrafen en artikelen
      verschillend kan worden vastgesteld. Laatstbedoeld besluit wordt niet genomen dan nadat vier weken zijn verstreken
      nadat het onderhavige besluit is overgelegd aan de beide Kamers der Staten-Generaal en gedurende die termijn
      niet door of namens een van beide kamers de wens wordt te kennen gegeven dat het in de [hoofdstukken 2][ref5]
      en [6, paragraaf 1,][ref6] dan wel de [hoofdstukken 3][ref7] en [6, paragraaf 2][ref8], dan wel de
      [hoofdstukken 4][ref9] en [6, paragraaf 3][ref10], van dit besluit geregelde onderwerp bij de wet wordt geregeld.
      De bepalingen vinden voor het eerst toepassing ten aanzien van de rijksbijdragen voor het jaar 2000.


