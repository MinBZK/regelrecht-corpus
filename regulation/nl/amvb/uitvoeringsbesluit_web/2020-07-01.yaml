  - number: 2.6.1.2
    text: |-
      Bij de berekening van het in het eerste lid bedoelde bedrag telt het aantal bbl-deelnemers Dbbl3 en Dbbl4 dat
      op 1 augustus van het tweede kalenderjaar voorafgaand aan het bekostigingsjaar de leeftijd van 18 nog niet heeft
      bereikt, niet mee.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2.6.1
  - number: 2.6a.1.1
    text: |-
      Onze Minister stelt jaarlijks het landelijk beschikbare budget vast ten behoeve van de kosten voor gehandicapte
      deelnemers.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2.6a.1
  - number: 2.6a.1.2
    text: |-
      Onze Minister verdeelt het voor een kalenderjaar vastgestelde budget ten behoeve van de gehandicapte deelnemers
      over de instellingen naar rato van het totaal van de voor dat kalenderjaar op grond van de [artikelen 2.2.2][ref1]
      en [2.2.3][ref2] berekende rijksbijdragedelen voor die instelling. De uitkomst van de berekening wordt rekenkundig
      afgerond op hele euro’s.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2.6a.1
    references:
      - id: ref1
