  - number: 2a.1.1
    text: |-
      Dit hoofdstuk is van toepassing op instellingen als bedoeld in
      [artikel 1.1.1, onderdeel b, onder 1°, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2a.1.1
    references:
