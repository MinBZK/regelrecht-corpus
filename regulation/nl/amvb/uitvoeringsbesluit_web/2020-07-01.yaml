        artikel: '7'
  - number: 2a.2.3.4
    text: |-
      Indien toepassing van [artikel 2a.2.1][ref1], met gebruikmaking van de gegevens, bedoeld in het derde lid,
      leidt tot een lagere rijksbijdrage dan vastgesteld op grond van het tweede lid, wordt die lagere rijksbijdrage
      vastgesteld. Gebruikmaking van de gegevens, bedoeld in het derde lid, leidt in geen geval tot een hogere
      rijksbijdrage dan vastgesteld op grond van het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2a
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2a.2.3
