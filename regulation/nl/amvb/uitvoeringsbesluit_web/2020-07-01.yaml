  - number: 3.1.1
    text: |-
      Dit hoofdstuk heeft betrekking op opleidingen educatie als bedoeld in
      [artikel 7.3.1, eerste lid, onder b tot en met f, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel3.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 3.1.2
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *CBS:* Centraal bureau voor de statistiek;
        - *contactgemeente:* contactgemeente als bedoeld in [artikel 2.3.1, tweede lid, van de wet][ref1];
        - *regio educatie:* regio als bedoeld in [artikel 2.3.1, tweede lid, van de wet][ref2];
        - *uitkering educatie:* uitkering als bedoeld in [artikel 2.3.2, van de wet][ref3];
        - *volwassen inwoner:* persoon van achttien jaar of ouder die als ingezetene is ingeschreven in de basisregistratie
      personen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel3.1.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '2'
  - number: 3.2.1.1
    text: |-
      De uitkering educatie die per kalenderjaar aan een college van burgemeester en wethouders van een contactgemeente
      van een regio educatie wordt verstrekt, is de som van de bedragen die voor elk van de tot die regio educatie
      behorende gemeenten wordt berekend volgens de volgende formule: waarbij wordt verstaan onder: Og: Het door het CBS
      op verzoek van Onze Minister berekende gemiddelde percentage inwoners van de gemeente van 15 tot en met 75 jaar met
      een opleiding op ten hoogste het niveau van het diploma middelbaar algemeen voortgezet onderwijs of voorbereidend
      beroepsonderwijs in het jaar voorafgaande aan het jaar waarvoor de uitkering wordt vastgesteld, vermenigvuldigd
      met het door het CBS op verzoek van Onze Minister berekende aantal volwassen inwoners van de gemeente op 1 januari
      van het jaar voorafgaande aan het jaar waarvoor de uitkering wordt vastgesteld; On: de som van de uitkomsten
      van bovenbedoeld Og voor alle Nederlandse gemeenten tezamen; Ag: Het door het CBS op verzoek van Onze Minister
      berekende aantal volwassen inwoners van de gemeente op 1 januari van het jaar voorafgaande aan het jaar waarvoor
      de uitkering wordt vastgesteld, waarvoor geldt dat beide ouders of de volwassen inwoner zelf en één ouder geboren
      zijn in een van de landen in Afrika, Latijns-Amerika en Azië (exclusief Indonesië en Japan) of Turkije. An: de som
      van de uitkomsten van bovenbedoeld AG voor alle Nederlandse gemeenten tezamen; Bg: Het aantal WWB-uitkeringen aan
      personen die de AOW-leeftijd nog niet hebben bereikt op 1 januari van het jaar voorafgaande aan het jaar waarvoor
      de uitkering wordt vastgesteld; Bn: de som van bovenbedoeld Bg voor alle Nederlandse gemeenten tezamen; Ib: het
      totale bedrag dat door Onze Minister beschikbaar is gesteld voor uitkeringen educatie voor alle regio’s educatie
      voor het jaar waarvoor de uitkering wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel3.2.1
  - number: 3.2.1.2
    text: De uitkomst van de berekening op grond van het eerste lid wordt rekenkundig afgerond op hele euro’s.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel3.2.1
  - number: 3.2.1.3
    text: Jaarlijks wordt in januari de voor dat kalenderjaar vastgestelde uitkering educatie betaald aan de contactgemeente.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel3.2.1
  - number: 3.2.2
    text: |-
      Bij een wijziging van de gemeentelijke indeling of een grenscorrectie als bedoeld in de
      [Wet algemene regels herindeling][ref1] worden de gegevens waarmee de berekeningen op grond van
      [artikel 3.2.1][ref2] worden uitgevoerd, vastgesteld op basis van een redelijke schatting van de toestand van die
      gegevens zoals die zou zijn geweest als de wijziging op de datum waarop die gegevens betrekking hebben, reeds was
      ingegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003718
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel3
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel3.2.2
    references:
      - id: ref1
        bwb_id: BWBR0003718
      - id: ref2
        bwb_id: BWBR0010646
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.3.1.1
    text: |-
      Indien in een kalenderjaar de uitkering educatie niet volledig is besteed, kan het college van burgemeester
      en wethouders van de contactgemeente het niet bestede bedrag tot maximaal 25% van de voor dat jaar toegekende
      uitkering educatie reserveren voor opleidingen educatie in het daaropvolgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel3.3.1
  - number: 3.3.1.2
    text: |-
      Indien in een kalenderjaar meer dan de uitkering educatie is besteed aan opleidingen educatie, kan het college van
      burgemeester en wethouders van de contactgemeente het meer bestede bedrag tot maximaal 25% van de voor dat jaar
      toegekende uitkering educatie ten laste brengen van de uitkering educatie voor het daaropvolgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel3.3.1
  - number: 4b.1.1.1
    text: |-
      [Paragraaf 2][ref1] is van toepassing op personeel en gewezen personeel van een instelling als bedoeld in
      [artikel 1.1.1, onderdeel b, van de wet][ref2] en personeel en gewezen personeel dat betrokken is onderscheidenlijk
      was bij een beroepsopleiding aan een instituut als bedoeld in [artikel 12.3.8][ref3] of een hogeschool als bedoeld
      in [artikel 12.3.9 van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Hoofdstuk4B
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel4b.1.1
