  - number: 2b.1.2.1
    text: |-
      Onze Minister stelt jaarlijks het landelijk beschikbare budget vast ten behoeve van uitkeringskosten voor het
      beroepsonderwijs en het voortgezet algemeen volwassenenonderwijs.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2b.1.2
  - number: 2b.1.2.2
    text: |-
      Onze Minister verdeelt het voor een kalenderjaar vastgestelde budget ten behoeve van uitkeringskosten over de
      instellingen naar rato van de som van de voor een instelling:
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2b.1.2
  - number: 2b.1.2.2.a
    text: |-
      op grond van [artikel 2.2.1, eerste lid][ref1], berekende rijksbijdrage beroepsonderwijs, die in geval
      van een agrarisch opleidingscentrum wordt vermeerderd met de rijksbijdrage zoals berekend op grond van
      [artikel 2.3.2][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2b.1.2
