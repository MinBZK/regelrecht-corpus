  - number: 2b.1.1
    text: |-
      In deze paragraaf wordt verstaan onder: - *instelling:* een instelling als bedoeld in
      [artikel 1.1.1, onderdeel b, van de wet][ref1], een instituut als bedoeld in [artikel 12.3.8 van de wet][ref2] of
      de hogeschool Haarlem, bedoeld in [artikel 12.3.9 van de wet][ref3], dan wel diens rechtsopvolger;
        - *uitkeringskosten:* kosten van werkloosheidsuitkeringen alsmede uitkeringen wegens ziekte en
      arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref4], voortvloeiend uit een
      dienstbetrekking aan een instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel12
