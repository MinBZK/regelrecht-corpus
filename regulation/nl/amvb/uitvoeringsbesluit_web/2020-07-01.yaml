  - number: 2.2.5.4
    text: |-
      Indien toepassing van [artikel 2.2.2][ref1] en [artikel 2.2.3][ref2] met gebruikmaking van de gegevens, bedoeld
      in het derde lid, leidt tot een lagere rijksbijdrage dan vastgesteld op grond van het tweede lid, wordt die lagere
      rijksbijdrage vastgesteld. Gebruikmaking van de gegevens, bedoeld in het derde lid, leidt in geen geval tot een
      hogere rijksbijdrage dan vastgesteld op grond van het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2.2.5
    references:
