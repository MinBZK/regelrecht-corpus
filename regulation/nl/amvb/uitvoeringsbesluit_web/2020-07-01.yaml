        artikel: '2'
  - number: 6.1.5.3
    text: |-
      Indien toepassing van de [artikelen 2.2.2][ref1], [2.2.3][ref2] en [6.1.4][ref3] met gebruikmaking van de gegevens,
      bedoeld in het tweede lid, leidt tot een lagere rijksbijdrage of overgangsbekostiging dan vastgesteld op grond van
      het eerste lid, wordt die lagere rijksbijdrage of overgangsbekostiging vastgesteld. Gebruikmaking van de gegevens,
      bedoeld in het tweede lid, leidt in geen geval tot een hogere rijksbijdrage of overgangsbekostiging dan vastgesteld
      op grond van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
