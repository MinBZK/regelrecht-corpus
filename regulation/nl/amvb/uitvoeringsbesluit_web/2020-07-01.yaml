  - number: 2a.3.1.1
    text: |-
      Onze minister stelt jaarlijks het landelijk beschikbare budget vast ten behoeve van de kosten voor gehandicapte
      deelnemers.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2a.3.1
  - number: 2a.3.1.2
    text: |-
      Onze minister verdeelt het voor een kalenderjaar vastgestelde budget ten behoeve van gehandicapte deelnemers over
      de instellingen naar rato van de voor dat kalenderjaar op grond van [artikel 2a.2.1, eerste lid][ref1], berekende
      rijksbijdrage voor die instelling. De uitkomst van de berekening wordt rekenkundig afgerond op hele euro’s.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2a
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2a.3.1
