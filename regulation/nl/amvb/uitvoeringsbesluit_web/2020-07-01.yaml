  - number: 2.2.5.2
    text: |-
      Bij de toepassing van [artikel 2.2.1][ref1] wordt voor een instelling als bedoeld in het eerste lid, bij de
      berekening van de rijksbijdrage voor exploitatiekosten en huisvestingskosten voor het beroepsonderwijs in afwijking
      van [artikel 2.2.2][ref2] en [artikel 2.2.3][ref3], de uitkomst van het gedeelte van de formule boven de streep
      zoals vermeld in het eerste lid van die artikelen, vastgesteld op de uitkomst van dat deel van de formule van het
      voorgaande kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2.2.5
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0010646
        artikel: '2'
