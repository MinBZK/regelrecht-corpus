        artikel: '7'
  - number: 2a.1.3
    text: |-
      Binnen het raam van de door de begrotingswetgever voor het desbetreffende kalenderjaar beschikbaar gestelde
      middelen, stelt Onze Minister jaarlijks de omvang vast van het landelijk beschikbare budget voor de
      exploitatiekosten en huisvestingskosten voor het voortgezet algemeen volwassenenonderwijs.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2a.1.3
  - number: 2a.2.1.1
    text: |-
      Onze Minister berekent de rijksbijdrage voor exploitatie- en huisvestingskosten vavo volgens de formule:







                    (IDW x 0,4) + (IVW x 0,5) + (IDiW x 0,1)






                    –––––––––––––––––––––––––––––––––––––


                    x


                    LB




                    (LDW x 0,4) + (LVW x 0,5)+ (LDiW x 0,1)






           Waarbij wordt verstaan onder: - *IDW:* het aantal deelnemers dat op 1 oktober van het tweede kalenderjaar
      voorafgaand aan het bekostigingsjaar aan de desbetreffende instelling is ingeschreven voor een opleiding vavo en
      daadwerkelijk die opleiding volgt;
        - *IVW:* het aantal vakken van het eindexamen of deeleindexamen dat in het tweede kalenderjaar voorafgaand aan
      het bekostigingsjaar bij de desbetreffende instelling is afgesloten met een eindcijfer 6 of hoger of een daarmee
      overeenkomende waardering door bij die instelling ingeschreven deelnemers vavo;
        - *IDiW:* het aantal diploma’s vavo dat in het tweede kalenderjaar voorafgaand aan het bekostigingsjaar door de
      examencommissie van de desbetreffende instelling is afgegeven aan bij die instelling ingeschreven deelnemers vavo;
        - *LDW:* het aantal deelnemers dat op 1 oktober van het tweede kalenderjaar voorafgaand aan het bekostigingsjaar is
      ingeschreven voor een opleiding vavo bij alle instellingen tezamen
        - *LVW:* het aantal vakken van het eindexamen of deeleindexamen dat in het tweede kalenderjaar voorafgaand aan het
      bekostigingsjaar bij alle instellingen tezamen door deelnemers vavo is afgesloten met een eindcijfer 6 of hoger of
      een daarmee overeenkomende waardering;
        - *LDiW:* het aantal diploma’s vavo dat in het tweede kalenderjaar voorafgaand aan het bekostigingsjaar door de
      examencommissies van alle instellingen tezamen is afgegeven aan deelnemers vavo;
        - *LB:* het landelijk beschikbare budget voor het vavo. De uitkomst van de berekening wordt rekenkundig afgerond op
      hele euro’s.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2a.2.1
  - number: 2a.2.1.2
    text: |-
      De op grond van het eerste lid berekende rijksbijdrage wordt vermeerderd met het rijksbijdragedeel voor
      gehandicapte deelnemers, zoals dat wordt berekend op grond van [artikel 2a.3.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2a
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2a.2.1
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: 2a
        hoofdstuk: 2A
        paragraaf: '3'
  - number: 2a.2.1.3
    text: |-
      De op grond van het eerste en tweede lid berekende rijksbijdrage kan worden aangepast in verband met uit de
      rijksbegroting voortvloeiende maatregelen.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2a.2.1
  - number: 2a.2.2.1
    text: |-
      In geval van fusie van instellingen betrekt Onze Minister bij de toepassing van [paragraaf 2][ref1] de gegevens van
      de instellingen die in de gefuseerde instelling zijn opgegaan en berekent de bijdrage voor de gefuseerde instelling
      op basis van die gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Hoofdstuk2A
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2a.2.2
    references:
      - id: ref1
        bwb_id: BWBR0010646
        hoofdstuk: 2A
        paragraaf: '2'
  - number: 2a.2.2.2
    text: |-
      In geval van splitsing van instellingen betrekt Onze Minister bij de toepassing van [paragraaf 2][ref1] de
      afspraken omtrent de toerekening van de gegevens aan elk van de instellingen die daarover door de betrokken
      bevoegde gezagsorganen zijn gemaakt, blijkend uit een door die bevoegde gezagsorganen aan Onze Minister overgelegde
      en ondertekende verklaring dienaangaande.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Hoofdstuk2A
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2a.2.2
    references:
      - id: ref1
        bwb_id: BWBR0010646
        hoofdstuk: 2A
        paragraaf: '2'
  - number: 2a.2.3.1
    text: |-
      De gegevens, bedoeld in de [artikelen 4, eerste lid, onderdelen c, e en f][ref1],
      [5, eerste lid, en derde lid, onder c][ref2], [6, vierde lid, onderdelen b en c][ref3], en
      [7, vierde lid, van het Besluit register onderwijsdeelnemers][ref4], en de verklaring, bedoeld in
      [artikel 2.2a.4, vijfde lid, van de wet][ref5], worden uiterlijk 1 juli van het jaar voorafgaand aan het
      bekostigingsjaar ingediend bij Onze Minister. Indien Onze Minister van een instelling de gegevens, bedoeld in
      de eerste volzin, niet uiterlijk 1 juli van het jaar voorafgaand aan het bekostigingsjaar, voorzien van een
      goedkeurende accountantsverklaring, heeft ontvangen en hierdoor niet tijdig over de gegevens kan beschikken, kan
      Onze Minister de hoogte van de rijksbijdrage voor deze instelling voor het desbetreffende kalenderjaar vaststellen
      conform de voorschriften in het tweede tot en met vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0042639#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0042639#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0042639#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0042639#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2a.2.3
