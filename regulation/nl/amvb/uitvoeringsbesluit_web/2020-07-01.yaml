        bwb_id: BWBR0007625
        artikel: '12'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '12'
  - number: 4b.2.1
    text: |-
      Het bevoegd gezag maakt gebruik van het burgerservicenummer van een lid van het personeel of gewezen personeel van
      de instelling bij de gegevensverstrekking, bedoeld in [bijlage 1][ref1] en [bijlage 4][ref2] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0010646
      [ref2]: https://wetten.overheid.nl/BWBR0010646
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel4b.2.1
    references:
      - id: ref1
        bwb_id: BWBR0010646
      - id: ref2
        bwb_id: BWBR0010646
  - number: 5.1.1
    text: 'De bepalingen van dit hoofdstuk hebben betrekking op:'
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5.1.1
  - number: 5.1.1.a
    text: |-
      instellingen als bedoeld in [artikel 1.1.1, onderdeel b, onder 1° tot en met 3°, van de wet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 5.1.1.b
    text: |-
      instellingen als bedoeld in [artikel 2.3.4 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
  - number: 5.1.2
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *Gegevenswoordenboek:* de opsomming van een door het bevoegd gezag van een
      instelling te verzamelen gegevens, bedoeld in [artikel 5.2.1][ref1];
        - *lerarenregister:* lerarenregister als bedoeld in [artikel 4.4.1 van de wet][ref2];
        - *registervoorportaal:* registervoorportaal als bedoeld in [artikel 4.4.14 van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5.1.2
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '4'
  - number: 5.2.1.1
    text: |-
      De informatieverzameling, bedoeld in de [artikelen 2.2.4][ref1], [2.3.6][ref2], [2.5.3][ref3] en
      [2.5.5 van de wet][ref4], waarover het bevoegd gezag van een instelling dient te beschikken, bevat de gegevens
      volgens de beschrijving in het gegevenswoordenboek dat is opgenomen in [bijlage 1][ref5] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0010646
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0010646
  - number: 5.2.1.2
    text: |-
      De gegevens, bedoeld in het eerste lid, die betrekking hebben op de bekostiging, zijn in het desbetreffende
      gegevenswoordenboek als zodanig aangeduid.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5.2.1
  - number: 5.2.2.1
    text: |-
      Op verzoek van Onze Minister stelt het bevoegd gezag van een instelling gegevens aan hem beschikbaar, die door de
      instelling op grond van [artikel 5.2.1][ref1] zijn verzameld.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel5
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5.2.2
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.2.2.2
    text: |-
      De beschikbaarstelling geschiedt voor het beroepsonderwijs en het voortgezet algemeen volwassenenonderwijs
      overeenkomstig [bijlage 4][ref1] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0010646
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5.2.2
    references:
      - id: ref1
        bwb_id: BWBR0010646
  - number: 5.2.2.3
    text: |-
      In voorkomende gevallen kan Onze Minister bij het verzoek om beschikbaarstelling reeds bij hem bekende gegevens
      opnemen.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5.2.2
  - number: 5.2.3
    text: |-
      Bij ministeriële regeling kan in bijzondere gevallen een aanvullende vragenlijst ten aanzien van bekostiging worden
      vastgesteld ter beantwoording door het bevoegd gezag van een instelling.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5.2.3
  - number: 5.2.4.1
    text: |-
      Het bevoegd gezag van een instelling bewaart de boeken, bescheiden en informatie op andere informatiedragers die
      verband houden met de toepassing van dit hoofdstuk voor zover het betreft gegevens ten behoeve van het door Onze
      Minister te voeren beleid ten aanzien van het beroepsonderwijs en van het voortgezet algemeen volwassenenonderwijs,
      gedurende ten minste zeven jaren.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5.2.4
  - number: 5.2.4.2
    text: |-
      Het bevoegd gezag van een instelling bewaart de gegevens die verband houden met de toepassing van dit hoofdstuk op
      zodanige wijze dat daaruit de voor de vaststelling van de geaggregeerde gegevens van belang zijnde gegevens kunnen
      worden nagegaan.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5.2.4
  - number: 5.2.5.1
    text: |-
      Bij ministeriële regeling worden regels vastgesteld voor de inrichting en de uitvoering van de controle door de
      accountant van de boekhouding, de jaarrekening en de administratie van de instellingen.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5.2.5
  - number: 5.2.5.2
    text: |-
      De regels hebben betrekking op de controle op de rechtmatigheid van de verkrijging en de rechtmatigheid en
      doelmatigheid van de besteding van de rijksbijdrage, en de controle op de bekostigingsgegevens, bedoeld in dit
      besluit.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5.2.5
  - number: 5.2.5.3
    text: |-
      De administratie van de instelling omvat in ieder geval de gegevens, bedoeld in [artikel 5.2.1, vierde lid][ref1],
      en de daaraan ten grondslag liggende bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel5
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5.2.5
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.2.6.1
    text: |-
      De gegevens in het lerarenregister of het registervoorportaal betreffende de benoeming of
      tewerkstelling zonder benoeming als bedoeld in [artikel 4.4.6, eerste lid, onder c][ref1], en
      [artikel 4.4.16, eerste lid, van de wet][ref2] bestaan naast de ingangsdatum van de benoeming of tewerkstelling
      zonder benoeming uit:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5.2.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '4'
  - number: 5.2.6.1.a
    text: 'indien van toepassing: de einddatum van de benoeming of tewerkstelling zonder benoeming;'
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5.2.6
  - number: 5.2.6.1.b
    text: 'de begindatum en, indien van toepassing: de einddatum van de arbeidsovereenkomst;'
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5.2.6
  - number: 5.2.6.1.c
    text: de betreffende benoemingsgrondslag in de wet; en
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5.2.6
  - number: 5.2.6.1.d
    text: |-
      voor het registervoorportaal, wat betreft het gegeven betreffende het onderwijs: of de docent educatie
      verzorgt en voor welk onderwijs de betreffende docent niet voldoet aan de bekwaamheidseisen, bedoeld in de
      [artikelen 4.2.1, tweede lid, onder b][ref1], en [4.2.3, eerste lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5.2.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '4'
  - number: 5.2.6.2
    text: |-
      De gegevens, bedoeld in [artikel 4.4.6, eerste lid, onder d, van de wet][ref1], betreffende de instelling waaraan
      een docent die in het lerarenregister of het registervoorportaal zijn opgenomen, worden onderscheiden in de
      registratienummers van de instelling en indien van toepassing de registratienummers van de vestigingen van de
      instelling, en bestaan per registratienummer uit:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5.2.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
  - number: 5.2.6.2.a
    text: de naam van de instelling of de vestiging van de instelling;
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5.2.6
  - number: 5.2.6.2.b
    text: het adres, de postcode en plaats;
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5.2.6
  - number: 5.2.6.2.c
    text: het telefoonnummer en e-mailadres.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5.2.6
  - number: 5.2.6.3
    text: |-
      De gegevens betreffende het onderwijs waarvoor de docent kan opgaan voor herregistratie als bedoeld in
      [artikel 4.4.6, eerste lid, onder e, van de wet][ref1] bestaan uit het onderwijs waarvoor de betreffende
      docent voldoet aan de bekwaamheidseisen, bedoeld in de [artikelen 4.2.1, tweede lid, onder b][ref2], en
      [4.2.3, eerste lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5.2.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '4'
  - number: 5.2.8.1
    text: |-
      De gegevens betreffende de benoeming of tewerkstelling zonder benoeming die op grond van
      [artikel 4.4.14, tweede lid, onder b][ref1], of [artikel 4.4.19, tweede lid, onder b, van de wet][ref2] worden
      verstrekt, bestaan naast de ingangsdatum van de benoeming of tewerkstelling zonder benoeming uit:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5.2.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '4'
  - number: 5.2.8.1.a
    text: 'indien van toepassing: de einddatum van de benoeming of tewerkstelling zonder benoeming;'
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5.2.8
  - number: 5.2.8.1.b
    text: 'de begindatum en, indien van toepassing: de einddatum van de arbeidsovereenkomst;'
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5.2.8
  - number: 5.2.8.1.c
    text: de betreffende benoemingsgrondslag in de wet; en
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5.2.8
  - number: 5.2.8.1.d
    text: |-
      voor het registervoorportaal, wat betreft het gegeven betreffende het onderwijs: of de docent educatie
      verzorgt en voor welk onderwijs de betreffende docent niet voldoet aan de bekwaamheidseisen, bedoeld in de
      [artikelen 4.2.1, tweede lid, onder b][ref1], en [4.2.3, eerste lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5.2.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '4'
  - number: 5.2.8.2
    text: |-
      De gegevens betreffende de instelling die op grond van [artikel 4.4.14, tweede lid, onder b][ref1], of
      [artikel 4.4.19, tweede lid, onder c, van de wet][ref2] worden verstrekt op verzoek van het bevoegd gezag van een
      instelling worden onderscheiden in de registratienummers van de betreffende instelling of de vestigingen van de
      instelling, en bestaan per registratienummer uit de naam, het adres, de postcode en plaats, het telefoonnummer en
      e-mailadres.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5.2.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '4'
  - number: 5.2.9
    text: |-
      De gegevens die worden geleverd en verwerkt voor het lerarenregister en het registervoorportaal worden gedefinieerd
      en geordend volgens de voorschriften vermeld in [bijlage 1][ref1] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0010646
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5.2.9
    references:
      - id: ref1
        bwb_id: BWBR0010646
  - number: 5.2.10
    text: |-
      De levering van gegevens voor het lerarenregister en het registervoorportaal en de wijze waarop een docent die
      niet is benoemd of tewerkgesteld zonder benoeming ten behoeve van opname in het lerarenregister kan aantonen aan de
      bekwaamheidseisen te voldoen geschiedt overeenkomstig [bijlage 4][ref1] dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0010646
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5.2.10
    references:
      - id: ref1
        bwb_id: BWBR0010646
  - number: 5a.1
    text: |-
      De bepalingen van dit hoofdstuk hebben betrekking op instellingen als bedoeld in de
      [artikelen 1.1.1, onderdeel b][ref1], [12.3.8][ref2] en [12.3.9 van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5a.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '12'
  - number: 5a.2
    text: |-
      Het personeel en het gewezen personeel van instellingen zijn in elk geval belanghebbende in de zin van dit
      hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5a.2
  - number: 5a.3
    text: |-
      Indien een instelling de taken beëindigt en een rechtsopvolger ontbreekt, waaronder tevens is begrepen het geval
      van een onherroepelijk vonnis tot faillietverklaring van de desbetreffende instelling, voorzien de bevoegde
      gezagsorganen van de overige instellingen er gezamenlijk in dat aan de verplichtingen jegens het personeel en het
      gewezen personeel die uit de wet- en regelgeving voortvloeien, wordt voldaan. De toepassing van de eerste volzin
      geschiedt met inachtneming van het bepaalde over vermindering van de rijksbijdrage in verband met de kosten van
      uitkeringen voor gewezen personeel van een instelling die de taken beëindigt in de ministeriële regeling op grond
      van [artikel 12.3.48 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel5a.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '12'
  - number: 6.1.3
    text: |-
      Indien 12% van de rijksbijdrage voor exploitatiekosten en huisvestingskosten beroepsonderwijs voor een kalenderjaar
      voor een instelling, vermeerderd met het gedeelte van de rijksbijdrage, berekend op grond van [artikel 2.4.1][ref1],
      minder bedraagt dan het op grond van [artikel 3][ref2] of [artikel 4][ref3], alsmede in voorkomende gevallen op
      grond van [artikel 7][ref4] of [artikel 8, van de Regeling bekostiging huisvesting bve-sector 1999][ref5] zoals
      deze luidde op 31 december 1999, voor het desbetreffende kalenderjaar vastgestelde bedrag voor de desbetreffende
      instelling, ontvangt de instelling voor het desbetreffende kalenderjaar een aanvulling tot dat bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006130#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0006130#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0006130#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0006130#Artikel8
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel6.1.3
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0006130
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0006130
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0006130
        artikel: '7'
      - id: ref5
        bwb_id: BWBR0006130
        artikel: '8'
  - number: 6.1.4.1
    text: |-
      Voor de berekening van de overgangsbekostiging beroepsonderwijs van een instelling wordt de rijksbijdrage voor
      een instelling voor het kalenderjaar 2015, berekend op grond van [artikel 2.2.1, eerste en tweede lid][ref1],
      zoals dat artikel met ingang van 1 augustus 2014 luidt, vergeleken met de rijksbijdrage voor beroepsonderwijs
      zoals die voor het kalenderjaar 2015 zou zijn vastgesteld volgens de berekeningswijze op grond van de
      [artikelen 2.2.2, eerste lid en tweede lid][ref2], en [2.4.1, eerste lid][ref3], zoals deze luidden op 31 juli
      2014.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel6.1.4
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '2'
        hoofdstuk: '2'
