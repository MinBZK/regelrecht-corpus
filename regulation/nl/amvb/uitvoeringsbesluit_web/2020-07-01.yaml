  - number: 6.1.6.1
    text: |-
      Voor de berekening van de overgangsbekostiging beroepsonderwijs van een instelling wordt de rijksbijdrage voor
      een instelling voor het kalenderjaar 2019, berekend op grond van de [artikelen 2.2.2][ref1], [2.2.3][ref2] en
      [2.6a.1][ref3] zoals die artikelen luiden na inwerkingtreding van artikel I, onderdelen B en C, van het besluit
      van 12 juli 2018 tot wijziging van het Uitvoeringsbesluit WEB met name in verband met het afschaffen van de
      cascadebekostiging (Stb. 2018, 261), vergeleken met de rijksbijdrage voor beroepsonderwijs zoals die voor het
      kalenderjaar 2019 zou zijn vastgesteld volgens de berekeningswijze op grond van de artikelen 2.2.2, 2.2.3 en 2.6a.1
      zoals deze luidden op de dag voorafgaand aan die inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel2
