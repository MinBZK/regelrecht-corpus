  - number: 2a.2.3.3
    text: |-
      De instellingen, bedoeld in het eerste lid, dienen uiterlijk 1 november van het jaar voorafgaand aan
      het bekostigingsjaar de gegevens, bedoeld in de [artikelen 4, eerste lid, onderdelen c, e en f][ref1],
      [5, eerste lid, en derde lid, onder c][ref2], [6, vierde lid, onderdelen b en c][ref3], en
      [7, vierde lid, van het Besluit register onderwijsdeelnemers][ref4], voorzien van een goedkeurende
      accountantsverklaring, in bij Onze Minister.


