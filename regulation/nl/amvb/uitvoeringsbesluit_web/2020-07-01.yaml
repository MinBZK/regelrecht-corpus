        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0010646
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.2.5.3
    text: |-
      De instellingen, bedoeld in het eerste lid, dienen uiterlijk 1 november van het jaar voorafgaand aan
      het bekostigingsjaar de gegevens, bedoeld in de [artikelen 4, eerste lid, onderdelen c, e en f][ref1],
      [5, eerste lid, onderdelen b en c, en derde lid, onderdeel a of c][ref2],
      [6, vijfde lid][ref3], [7, vijfde lid, onderdelen a tot en met c][ref4], en
      [8, zesde lid, onderdelen a en c, van het Besluit register onderwijsdeelnemers][ref5], voorzien van een
      goedkeurende accountantsverklaring, in bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0042639#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0042639#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0042639#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0042639#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0042639#Artikel8
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2.2.5
