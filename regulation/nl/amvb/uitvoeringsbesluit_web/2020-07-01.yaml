  - number: 6.1.4.2
    text: |-
      Bij de uitvoering van de vergelijking bedoeld in het eerste lid wordt bij de berekening van de rijksbijdrage
      voor 2015 volgens de berekeningswijze op grond van de in het eerste lid genoemde artikelen zoals die luidden
      op 31 juli 2014, uitgegaan van het landelijk beschikbare budget, bedoeld in [artikel 2.1.3, eerste lid][ref1],
      voor 2015, verminderd met het voor alle instellingen vastgestelde budget, bedoeld in
      [artikel 12.4.1, tweede lid, van de wet][ref2]. De aldus berekende rijksbijdrage van een instelling wordt verhoogd
      met het bedrag dat voor die instelling op grond van artikel 12.4.1, tweede lid, van de wet is berekend. Dit bedrag
      wordt rekenkundig afgerond op hele euro’s.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel6.1.4
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '12'
  - number: 6.1.4.3
    text: |-
      Indien uit de vergelijking bedoeld in het eerste lid blijkt dat de in dat lid eerstgenoemde rijksbijdrage voor een
      instelling hoger is dan de laatstgenoemde rijksbijdrage, wordt eerstgenoemde rijksbijdrage voor 2015 verminderd
      met 80% van het verschil tussen beide berekende rijksbijdragen. De uitkomst van de berekening wordt rekenkundig
      afgerond op hele euro’s.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel6.1.4
  - number: 6.1.4.4
    text: |-
      Indien uit de vergelijking bedoeld in het eerste lid blijkt dat de in dat lid eerstgenoemde rijksbijdrage voor
      een instelling lager is dan de laatstgenoemde rijksbijdrage, wordt eerstgenoemde rijksbijdrage voor 2015 aangevuld
      met 80% van het verschil tussen beide berekende rijksbijdragen. De uitkomst van de berekening wordt rekenkundig
      afgerond op hele euro’s.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel6.1.4
  - number: 6.1.4.5
    text: |-
      Indien aan een instelling voor het kalenderjaar 2015 een bedrag in mindering wordt gebracht op grond van het
      derde lid, wordt aan die instelling voor de kalenderjaren 2016, 2017 en 2018 60%, 40% respectievelijk 20% van het
      verschil bedoeld in het derde lid in mindering gebracht. De uitkomst van de berekening wordt rekenkundig afgerond
      op hele euro’s.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel6.1.4
  - number: 6.1.4.6
    text: |-
      Indien een instelling voor het kalenderjaar 2015 een aanvulling ontvangt op grond van het vierde lid, ontvangt die
      instelling voor de kalenderjaren 2016, 2017 en 2018 aanvullingen van 60%, 40% respectievelijk 20% van het verschil
      bedoeld in het vierde lid. De uitkomst van de berekening wordt rekenkundig afgerond op hele euro’s.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel6.1.4
  - number: 6.1.4.7
    text: |-
      Indien uit de vergelijking bedoeld in het eerste lid blijkt dat de eerstgenoemde rijksbijdrage voor een instelling
      meer dan 4% lager is dan de laatstgenoemde rijksbijdrage, kan Onze Minister ter voorkoming van een zodanig
      financieel nadeel voor die instelling dat de continuïteit van de instelling in gevaar komt, aanvullende bekostiging
      verstrekken aan die instelling naast de aanvulling bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel6.1.4
  - number: 6.1.5.1
    text: |-
      Indien een instelling de gegevens en de verklaring, bedoeld in [artikel 2.2.5, eerste lid][ref1], ten behoeve van
      de bekostiging voor het kalenderjaar 2015 niet tijdig indient, kan Onze Minister, in afwijking van artikel 2.2.5,
      de rijksbijdrage voor het kalenderjaar 2015 en, in afwijking van [artikel 6.1.4][ref2], de overgangsbekostiging
      voor de kalenderjaren 2015 tot en met 2018 voor deze instelling voorlopig vaststellen met gebruik van de gegevens
      van het kalenderjaar 2012, respectievelijk het studiejaar 2012–2013.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel6
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel6.1.5
