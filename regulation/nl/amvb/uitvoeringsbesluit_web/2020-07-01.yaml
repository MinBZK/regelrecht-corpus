    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2a.1.2
  - number: 2a.1.2.a
    text: |-
      opleiding vavo: een opleiding voortgezet algemeen volwassenenonderwijs als bedoeld
      in [artikel 7.3.1., eerste lid, onderdeel a, van de wet][ref1], die op grond van
      [artikel 2.1.2, eerste lid, van de wet][ref2] voor bekostiging in aanmerking komt;


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2a.1.2
    references:
