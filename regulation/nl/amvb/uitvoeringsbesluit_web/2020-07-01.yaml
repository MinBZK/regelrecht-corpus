        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.6.1.1
    text: |-
      Onze Minister brengt op de rijksbijdrage voor een instelling voor een kalenderjaar een bedrag in
      mindering volgens de formule: (Dbbl3 x DC1) + (Dbbl4 x DC2), waarin is: Dbbl3: Dbbl, bedoeld in de
      [artikelen 2.2.2, tweede lid][ref1], en [2.2.3, tweede lid][ref2], voor de entreeopleiding en de
      basisberoepsopleiding; DC1: het cursusgeld per 1 januari van het desbetreffende kalenderjaar, bedoeld
      in [artikel 15 van het Uitvoeringsbesluit Les- en cursusgeldwet][ref3], voor de entreeopleiding en de
      basisberoepsopleiding; Dbbl4: Dbbl, bedoeld in [artikel 2.2.3, tweede lid][ref4], voor de vakopleiding, de
      middenkaderopleiding en de specialistenopleiding; DC2: het cursusgeld per 1 januari van het desbetreffende
      kalenderjaar, bedoeld in [artikel 15 van het Uitvoeringsbesluit Les- en cursusgeldwet][ref5], voor de vakopleiding,
      de middenkaderopleiding en de specialistenopleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0011400#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0010646#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0011400#Artikel15
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2.6.1
