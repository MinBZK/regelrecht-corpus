        artikel: '2'
  - number: 2a.2.3.2
    text: |-
      Bij de toepassing van [artikel 2a.2.1][ref1] wordt voor een instelling als bedoeld in het eerste lid, bij de
      berekening van de rijksbijdrage, in afwijking van artikel 2a.2.1, eerste lid, de uitkomst van het gedeelte van de
      formule boven de streep, zoals vermeld in het eerste lid van die artikelen, vastgesteld op de uitkomst van dat deel
      van de formule van het voorgaande kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2a
    url: https://wetten.overheid.nl/BWBR0010646/2020-07-01#Artikel2a.2.3
