      Voor het kalenderjaar 2016 wordt de uitkering educatie die aan een college van burgemeester en wethouders van een
      contactgemeente van een regio wordt verstrekt, berekend door de uitkomst van de formule {bi : bl} x 2/3 x bm, op te
      tellen bij een derde van het bedrag volgens de formule in [artikel 3.2.1, eerste lid,][ref1] waarbij wordt verstaan
      onder: 'bi: de som van de bedragen die de gemeenten binnen deze regio voor het jaar 2014 hebben ontvangen op grond'
      van [artikel 4 van het Besluit participatiebudget][ref2] zoals dat luidde op 31 december 2014; bl: het landelijk
      budget educatie in het jaar 2014 ingevolge de [Wet participatiebudget][ref3] zoals die luidde op 31 december 2014;
      bm: het totale bedrag dat door Onze Minister beschikbaar is gesteld voor uitkeringen educatie voor alle regio’s
      educatie voor het kalenderjaar 2016.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0025044#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0025039
