    text: 'Onze Minister berekent de rijksbijdrage voor de exploitatiekosten voor een kenniscentrum voor:'
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.1
  - number: 4.2.1.a
    text: |-
      de taken, bedoeld in [artikel 1.5.2, eerste, tweede en vijfde lid, van de wet][ref1], aan de hand van de maatstaf
      opleidingen,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 4.2.1.b
    text: |-
      de taken, bedoeld in [artikel 1.5.2, derde lid, van de wet][ref1], aan de hand van de maatstaven bpv-plaatsen in de
      beroepsbegeleidende leerweg en in de beroepsopleidende leerweg, en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
