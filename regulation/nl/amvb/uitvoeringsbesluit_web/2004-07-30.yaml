  - number: 6.2.1
    text: |-
      In deze paragraaf wordt verstaan onder: rijksbijdrage educatie: de rijksbijdrage, bedoeld in
      [artikel 2.3.1, eerste lid, van de wet][ref1]; landelijk beschikbare budget: het landelijk beschikbare budget
      voor de educatie, bedoeld in [artikel 2.3.1, eerste lid, van de wet][ref2]; oude berekening: berekening
      van de rijksbijdrage educatie voor het jaar 2000 op grond van de Tijdelijke regeling rijksbijdrage educatie
      zoals luidend op 1 september 1999, toegepast op het landelijk beschikbare budget voor het jaar 2000; nieuwe
      berekening: berekening van de rijksbijdrage educatie voor het jaar 2000 op grond van de [artikelen 3.2.2][ref3] en
      [3.2.3][ref4], toegepast op het landelijk beschikbare budget voor het jaar 2000.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0010646#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0010646#Artikel3
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel6.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0010646
        artikel: '3'
