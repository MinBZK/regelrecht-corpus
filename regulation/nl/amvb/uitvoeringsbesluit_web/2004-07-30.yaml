  - number: 2.1.3
    text: |-
      Binnen het raam van de door de begrotingswetgever voor het desbetreffende kalenderjaar beschikbaar gestelde
      middelen, stelt Onze Minister jaarlijks de omvang vast van de landelijk beschikbare budgetten voor de
      exploitatiekosten en voor de huisvestingskosten voor zowel het beroepsonderwijs als het voorbereidend
      beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.1.3
  - number: 2.2.1.1
    text: |-
      Onze Minister stelt jaarlijks de omvang vast van het landelijk beschikbare budget ten behoeve van voorbereidende
      en ondersteunende activiteiten als bedoeld in [artikel 7.2.2, vierde lid, van de wet][ref1] dat in mindering wordt
      gebracht op het landelijk beschikbare budget voor de exploitatiekosten voor het beroepsonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 2.2.1.2
    text: |-
      Het na toepassing van het eerste lid resterende deel van het landelijk beschikbare budget voor de exploitatiekosten
      voor het beroepsonderwijs voor een kalenderjaar wordt verdeeld als volgt:
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.2.1
  - number: 2.2.1.2.a
    text: 80% wordt toegerekend aan het landelijk deel ten behoeve van de maatstaf ingeschreven deelnemers, en
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.2.1
  - number: 2.2.1.2.b
    text: 20% wordt toegerekend aan het landelijk deel ten behoeve van de maatstaf diploma's beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.2.1
  - number: 2.2.2.1
    text: |-
      Onze Minister berekent de rijksbijdrage voor een instelling voor de exploitatiekosten voor het beroepsonderwijs
      voor een kalenderjaar door bij elkaar op te tellen:
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.2.2
  - number: 2.2.2.1.a
    text: het rijksbijdragedeel op grond van de maatstaf ingeschreven deelnemers,
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.2.2
  - number: 2.2.2.1.b
    text: het rijksbijdragedeel op grond van de maatstaf diploma's beroepsonderwijs, en
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.2.2
  - number: 2.2.2.1.c
    text: het rijksbijdragedeel ten behoeve van voorbereidende en ondersteunende activiteiten,
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.2.2
  - number: 2.2.2.2
    text: |-
      De op grond van het eerste lid berekende rijksbijdrage kan worden aangepast in verband met uit de rijksbegroting
      voortvloeiende maatregelen.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.2.2
  - number: 2.2.3.1
    text: |-
      Onze Minister berekent het rijksbijdragedeel op grond van de maatstaf ingeschreven deelnemers volgens de formule:
      i = n Σ {[(DDi x DFi) + VDi] x Pi} i = 1 ----------------------------------------------- x LMID LDw In deze formule
      wordt verstaan onder: i: opleiding verzorgd aan de desbetreffende instelling, n: het aantal opleidingen verzorgd
      aan de desbetreffende instelling, DDi: het aantal deeltijds deelnemers dat op 1 oktober van het tweede kalenderjaar
      voorafgaand aan het desbetreffende jaar aan de desbetreffende instelling voor de desbetreffende opleiding is
      ingeschreven en daadwerkelijk die opleiding volgt, en voor zover het deelnemers aan de beroepsbegeleidende leerweg,
      bedoeld in [artikel 7.2.2, tweede lid, onder b, van de wet][ref1] betreft, voor zover deze deelnemers:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 2.2.3.1.a
    text: |-
      uiterlijk op 31 december van datzelfde kalenderjaar een overeenkomst als bedoeld in
      [artikel 7.2.8, tweede lid, van de wet][ref1] hebben gesloten, en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 2.2.3.1.b
    text: |-
      indien zij een opleiding volgen als bedoeld in het tweede lid, onder b, uiterlijk op 1 juni van het daaropvolgende
      kalenderjaar, dan wel in geval zij een andere opleiding volgen uiterlijk op dezelfde datum als genoemd onder a,
      daadwerkelijk de opleiding in de praktijk van het beroep, bedoeld in [artikel 7.2.8, eerste lid, van de wet][ref1]
      volgen op de grondslag van een overeenkomst als bedoeld onder a,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 2.2.3.2
    text: 'De deeltijdfactor, bedoeld in het eerste lid onder DFi, bedraagt:'
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.2.3
  - number: 2.2.3.2.a
    text: |-
      voor de opleidingen die zijn opgenomen in het Centraal register en die worden bekostigd door Onze Minister van
      Landbouw, Natuurbeheer en Visserij: 0,5;
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.2.3
  - number: 2.2.3.2.b
    text: |-
      voor de opleidingen die zijn opgenomen in het Centraal register en die worden bekostigd door Onze Minister
      van Onderwijs, Cultuur en Wetenschappen, voor zover voor die opleidingen eindtermen als bedoeld in
      [artikel 7.2.4, eerste lid, van de wet][ref1] zijn vastgesteld in overeenstemming met Onze Minister van
      Volksgezondheid, Welzijn en Sport: 0,8, en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 2.2.3.2.c
    text: 'voor de overige opleidingen: 0,35.'
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.2.3
  - number: 2.2.3.3
    text: |-
      Jaarlijks voor 1 september voorafgaand aan het kalenderjaar waarvoor de rijksbijdrage wordt vastgesteld, wordt
      bij ministeriële regeling de prijsfactor, bedoeld in het eerste lid onder Pi, vastgesteld die wordt toegekend
      aan een opleiding die in dat kalenderjaar voor het eerst in het Centraal register wordt opgenomen. Wijzigingen
      van prijsfactoren van reeds in het Centraal register opgenomen opleidingen worden eveneens jaarlijks voor 1
      september voorafgaand aan het kalenderjaar waarvoor de rijksbijdrage wordt vastgesteld, bij ministeriële regeling
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.2.3
  - number: 2.2.4
    text: |-
      Onze Minister berekent het rijksbijdragedeel op grond van de maatstaf diploma's beroepsonderwijs volgens
      de formule: DI.1 + 2DI.2 + 4DI.3 ----------------------------------- x LMD LD.1 + 2LD.2 + 4LD.3 In deze
      formule wordt verstaan onder: DI.1: het aantal diploma's beroepsonderwijs dat aan die instelling is
      uitgereikt in het tweede kalenderjaar voorafgaand aan het desbetreffende jaar bij opleidingen als bedoeld in
      [artikel 7.2.2, eerste lid, onder a, van de wet][ref1], DI.2: het aantal diploma's beroepsonderwijs dat aan die
      instelling is uitgereikt in het tweede kalenderjaar voorafgaand aan het desbetreffende jaar bij opleidingen als
      bedoeld in [artikel 7.2.2, eerste lid, onder b, van de wet][ref2], DI.3: het aantal diploma's beroepsonderwijs dat
      aan die instelling is uitgereikt in het tweede kalenderjaar voorafgaand aan het desbetreffende jaar bij opleidingen
      als bedoeld in [artikel 7.2.2, eerste lid, onder c tot en met f, van de wet][ref3], LD.1: het aantal diploma's
      beroepsonderwijs dat landelijk is uitgereikt in het tweede kalenderjaar voorafgaand aan het desbetreffende jaar
      bij opleidingen als bedoeld in [artikel 7.2.2, eerste lid, onder a, van de wet][ref4], LD.2: het aantal diploma's
      beroepsonderwijs dat landelijk is uitgereikt in het tweede kalenderjaar voorafgaand aan het desbetreffende jaar
      bij opleidingen als bedoeld in [artikel 7.2.2, eerste lid, onder b, van de wet][ref5], LD.3: het aantal diploma's
      beroepsonderwijs dat landelijk is uitgereikt in het tweede kalenderjaar voorafgaand aan het desbetreffende jaar
      bij opleidingen als bedoeld in [artikel 7.2.2, eerste lid, onder c tot en met f, van de wet][ref6], en LMD: het
      landelijk deel ten behoeve van de maatstaf diploma's beroepsonderwijs, zoals dat voor het desbetreffende jaar is
      vastgesteld op grond van [artikel 2.2.1, tweede lid, onder b][ref7].


