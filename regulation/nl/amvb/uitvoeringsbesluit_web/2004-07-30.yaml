    references:
      - id: ref1
        bwb_id: BWBR0008516
        artikel: '2'
  - number: 2.5.2.2
    text: |-
      Onze Minister brengt vervolgens op de rijksbijdrage van een instelling voor het in het eerste lid bedoelde
      kalenderjaar in mindering:
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.5.2
  - number: 2.5.2.2.a
    text: |-
      de kosten van de uitkeringen in dat kalenderjaar voor gewezen personeel van de desbetreffende instelling, voor
      zover deze kosten voortvloeien uit een ontslag dat is geëffectueerd in de periode tussen 31 juli 1995 en 1 augustus
      1998 en waarvoor de rechtspersoon, bedoeld in [artikel 4.4.2 van de wet][ref1] zoals luidend op 31 juli 1998, niet
      heeft ingestemd op grond van [artikel 2.5.8, derde lid, van de wet][ref2] zoals luidend op 31 juli 1998, met het
      ten laste van bedoelde rechtspersoon brengen van de kosten van deze uitkeringen, en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.5.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
  - number: 2.5.2.2.b
    text: |-
      60% van de kosten van de uitkeringen in dat kalenderjaar voor gewezen personeel van de desbetreffende instelling,
      voor zover deze kosten voortvloeien uit een ontslag dat is geëffectueerd op of na 1 augustus 1998.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.5.2
  - number: 2.5.2.3
    text: |-
      De uitkomsten van de in het eerste en tweede lid bedoelde berekeningen worden rekenkundig afgerond op twee
      decimalen.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.5.2
  - number: 2.5.3.1
    text: |-
      Onze Minister gaat gedurende het kalenderjaar waarop de verminderingen op de rijksbijdrage, bedoeld in
      [artikel 2.5.2, eerste lid][ref1], betrekking hebben, per maand over tot een voorlopige inhouding op de
      rijksbijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.5.3
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 2.5.3.2
    text: |-
      De definitieve vaststelling van de verminderingen, bedoeld in het eerste lid, vindt plaats in maart of zoveel
      eerder als mogelijk is, volgend op het desbetreffende jaar.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.5.3
  - number: '3.1'
    text: |-
      In dit hoofdstuk wordt onder volwassen inwoner verstaan, een persoon van 18 jaren of ouder die op grond van de
      [Wet gemeentelijke basisadministratie persoonsgegevens][ref1] bij een gemeente is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0006723
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0006723
  - number: 3.2.1
    text: |-
      Binnen het raam van de door de begrotingswetgever voor het desbetreffende kalenderjaar beschikbaar gestelde
      middelen, stelt Onze Minister jaarlijks de omvang vast van het landelijk beschikbare budget voor de educatie,
      bedoeld in [artikel 2.3.1, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel3.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
  - number: 3.2.2.1
    text: |-
      De in [artikel 2.3.1, eerste lid][ref1], van de wet bedoelde rijksbijdrage educatie wordt door Onze Minister
      berekend op grond van:


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel3.2.2
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 3.2.2.1.a
    text: |-
      het door het Centraal Bureau voor de Statistiek op verzoek van Onze Minister berekende aantal volwassen inwoners
      van de gemeente op 1 januari van het jaar voorafgaande aan het jaar waarvoor de rijksbijdrage wordt vastgesteld,
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel3.2.2
  - number: 3.2.2.1.b
    text: |-
      het door het Centraal Bureau voor de Statistiek op verzoek van Onze Minister berekende gemiddelde percentage
      volwassen inwoners van de gemeente met een opleiding op ten hoogste het niveau van het diploma middelbaar algemeen
      voortgezet onderwijs of voorbereidend beroepsonderwijs over het zevende tot en met tweede jaar voorafgaande aan
      het jaar van de rijksbijdrage, vermenigvuldigd met het onder a bedoelde aantal inwoners op 1 januari van het jaar
      voorafgaande aan het jaar waarvoor de rijksbijdrage wordt vastgesteld, en
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel3.2.2
  - number: 3.2.2.1.c
    text: |-
      het door het Centraal Bureau voor de Statistiek op verzoek van Onze Minister berekende aantal volwassen inwoners
      van de gemeente op 1 januari van het jaar voorafgaande aan het jaar waarvoor de rijksbijdrage wordt vastgesteld,
      waarvoor geldt dat beide ouders of de volwassen inwoner zelf en 1 ouder geboren zijn in een land dat niet is
      opgenomen in [bijlage 1c bij dit besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010646
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel3.2.2
    references:
      - id: ref1
        bwb_id: BWBR0010646
  - number: 3.2.2.2
    text: |-
      Bij een wijziging van de gemeentelijke indeling of een grenscorrectie wordt de rijksbijdrage die op grond van het
      eerste lid is berekend voor een gemeente die geheel of gedeeltelijk opgaat in 1 of meer andere gemeenten, vanaf
      de datum van herindeling aan de gemeenten toegerekend naar rato van het aantal inwoners dat in de desbetreffende
      gemeente blijft onderscheidenlijk naar de desbetreffende gemeente overgaat.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel3.2.2
  - number: 3.2.2.3
    text: |-
      De in [artikel 2.3.1, eerste lid, van de wet][ref1] bedoelde rijksbijdrage educatie kan met inachtneming van het
      eerste en tweede lid worden aangepast in verband met uit de rijksbegroting voortvloeiende maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel3.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
  - number: 3.2.3
    text: |-
      Onze Minister berekent de in [artikel 2.3.1, eerste lid, van de wet][ref1] bedoelde rijksbijdrage educatie voor
      15% aan hand van de maatstaf, bedoeld in [artikel 3.2.2, eerste lid, onderdeel a][ref2], voor 45% aan de hand van
      de maatstaf, bedoeld in [artikel 3.2.2, eerste lid, onderdeel b][ref3], en voor 40% aan de hand van de maatstaf,
      bedoeld in [artikel 3.2.2, eerste lid, onderdeel c][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0010646#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0010646#Artikel3
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel3.2.3
    references:
      - id: ref1
