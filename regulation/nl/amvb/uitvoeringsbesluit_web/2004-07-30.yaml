        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0010646
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 6.2.2.1
    text: |-
      De berekeningsmaatstaven, bedoeld in de [artikelen 3.2.2][ref1] en [3.2.3][ref2], worden in de jaren 2000 tot
      en met 2003 toegepast op het landelijk beschikbare budget, verminderd met een bij ministeriële regeling vast te
      stellen bedrag. In de ministeriële regeling worden de bedragen van de vermindering voor de jaren 2001, 2002 en 2003
      vastgesteld op onderscheidenlijk 75%, 50% en 25% van het bedrag van de vermindering voor het jaar 2000.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel3
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel6.2.2
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0010646
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 6.2.2.2
    text: |-
      De op grond van het eerste lid berekende verminderingen van de rijksbijdrage educatie kunnen worden aangepast in
      verband met uit de rijksbegroting voortvloeiende maatregelen.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel6.2.2
  - number: 6.2.3.1
    text: |-
      Indien de rijksbijdrage educatie in het jaar 2000 bij de nieuwe berekening hoger of lager is dan bij de oude
      berekening, wordt in de jaren 2000 tot en met 2003 de op grond van [de artikelen 3.2.2][ref1], [3.2.3][ref2]
      en [6.2.2][ref3] bepaalde rijksbijdrage educatie verlaagd onderscheidenlijk verhoogd met het verschil tussen de
      uitkomsten van die beide berekeningen, vermenigvuldigd met A x B/C, waarin: A = - in het jaar 2000: 4/5,
        - in het jaar 2001: 3/5,
        - in het jaar 2002: 2/5,
        - in het jaar 2003: 1/5; B = het landelijk beschikbare budget voor het desbetreffende jaar, verminderd met het op
      grond van [artikel 6.2.2][ref4] voor het desbetreffende jaar vastgestelde bedrag en C = het landelijk beschikbare
      budget voor het desbetreffende jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0010646#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0010646#Artikel6
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel6.2.3
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0010646
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0010646
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0010646
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 6.2.3.2
    text: |-
      Bij een wijziging van de gemeentelijke indeling of een grenscorrectie worden de op grond van het eerste lid
      berekende verlagingen of verhogingen van de rijksbijdrage educatie voor een gemeente die geheel of gedeeltelijk
      opgaat in 1 of meer andere gemeenten vanaf de datum van herindeling aan de gemeenten toegerekend naar rato van
      het aantal inwoners dat in de desbetreffende gemeente blijft onderscheidenlijk naar de desbetreffende gemeente
      overgaat.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel6.2.3
  - number: 6.2.3.3
    text: |-
      De op grond van het eerste en tweede lid berekende verlagingen of verhogingen van de rijksbijdrage educatie kunnen
      worden aangepast in verband met uit de rijksbegroting voortvloeiende maatregelen.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel6.2.3
  - number: 6.2.4.1
    text: |-
      Onze Minister voegt in het jaar 2000 een bedrag toe aan de rijksbijdrage educatie voor een gemeente indien deze
      rijksbijdrage bij de nieuwe berekening ten minste f 2 000 000,– lager is dan bij de oude berekening.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel6.2.4
  - number: 6.2.4.2
    text: |-
      Onze Minister voegt in het jaar 2000 een bedrag toe aan het totaal van de rijksbijdragen educatie in een
      samenwerkingsgebied als bedoeld in [artikel 2 van de Wet gemeenschappelijke regelingen][ref1] naar de situatie op 1
      januari 1999, indien


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel6.2.4
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '2'
  - number: 6.2.4.2.a
    text: |-
      het totaal van de rijksbijdragen educatie voor de gemeenten in dat gebied bij de nieuwe berekening ten minste
      f 800 000,– lager is dan bij de oude berekening, of
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel6.2.4
  - number: 6.2.4.2.b
    text: |-
      het totaal van de rijksbijdragen educatie voor de gemeenten in dat gebied bij de nieuwe berekening, gelijk is aan
      of lager is dan 0,9 x dat totaal bij de oude berekening.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel6.2.4
  - number: 6.2.4.3
    text: |-
      De op grond van het eerste of tweede lid toe te voegen bedragen worden vastgesteld door het op grond van
      [artikel 6.2.2][ref1] voor het jaar 2000 vastgestelde bedrag te verdelen over de gemeenten, bedoeld in het eerste
      lid, en de samenwerkingsgebieden, bedoeld in het tweede lid. Deze verdeling geschiedt naar rato van de omvang van
      de verschillen tussen de uitkomsten van de oude en de nieuwe berekening bij die gemeenten onderscheidenlijk bij het
      totaal van de gemeenten in die gebieden.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel6
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel6.2.4
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 6.2.4.4
    text: |-
      De op grond van het tweede en derde lid berekende bedragen voor de samenwerkingsgebieden, bedoeld in het tweede
      lid, worden door Onze Minister verdeeld over de gemeenten in het desbetreffende gebied die bij de nieuwe berekening
      een lagere rijksbijdrage educatie zouden ontvangen dan bij de oude berekening. De verdeling vindt plaats naar rato
      van de omvang van de verschillen tussen de uitkomsten van de oude en de nieuwe berekening bij die gemeenten.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel6.2.4
  - number: 6.2.4.5
    text: |-
      Bij de berekeningen, bedoeld in het tweede en vierde lid, en bij de berekening op grond van het derde lid met
      betrekking tot de gemeenten in de samenwerkingsgebieden, bedoeld in het tweede lid, worden de gemeenten, bedoeld in
      het eerste lid, buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel6.2.4
  - number: 6.2.4.6
    text: |-
      In de jaren 2001, 2002 en 2003 voegt Onze Minister aan de rijksbijdragen van de gemeenten, bedoeld in het eerste
      lid, en de gemeenten, bedoeld in het vierde lid, onderscheidenlijk 75%, 50% en 25% van het bedrag voor het jaar
      2000 toe.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel6.2.4
  - number: 6.2.4.7
    text: |-
      Bij een wijziging van de gemeentelijke indeling of een grenscorrectie worden de op grond van het eerste tot
      en met zesde lid berekende bedragen voor een gemeente die geheel of gedeeltelijk opgaat in 1 of meer andere
      gemeenten vanaf de datum van herindeling aan de gemeenten toegerekend naar rato van het aantal inwoners dat in de
      desbetreffende gemeente blijft onderscheidenlijk naar de desbetreffende gemeente overgaat.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel6.2.4
  - number: 6.2.4.8
    text: |-
      De op grond van het eerste tot en met zesde lid berekende bedragen kunnen worden aangepast in verband met uit de
      rijksbegroting voortvloeiende maatregelen.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel6.2.4
  - number: 6.2.5
    text: |-
      De in deze paragraaf voor de jaren 2002 en 2003 berekende bedragen worden vastgesteld in euro's door de uitkomst
      van de berekeningen te delen door 2.20371.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel6.2.5
  - number: 6.3.1.1
    text: |-
      Bij ministeriële regeling wordt voorgeschreven, welke gegevens Onze Minister in afwijking van de
      [artikelen 4.2.4 tot en met 4.2.8][ref1] hanteert voor zover nog niet kan worden beschikt over de in die artikelen
      voorgeschreven gegevens. De vervangende gegevens komen zoveel mogelijk overeen met de voorgeschreven gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel6.3.1
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 6.3.1.2
    text: |-
      Tot het tijdstip van inwerkingtreding van [bijlage 3 bij dit besluit][ref1] wordt in
      [artikel 4.2.8, eerste lid, onder a][ref2], in plaats van «[bijlage 3 bij dit besluit][ref3]» gelezen: bijlage 3
      van de Regeling Informatievoorziening BVE.


      [ref1]: https://wetten.overheid.nl/BWBR0010646
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0010646
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel6.3.1
    references:
      - id: ref1
        bwb_id: BWBR0010646
      - id: ref2
        bwb_id: BWBR0010646
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0010646
  - number: 6.3.7
    text: |-
      Onze Minister evalueert de werking van [hoofdstuk 4][ref1] na afloop van een periode van 5 jaren na het tijdstip
      van inwerkingtreding van dat hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel6.3.7
    references:
      - id: ref1
        bwb_id: BWBR0010646
        hoofdstuk: '4'
  - number: 7.1.1
    text: |-
      Dit besluit treedt, met uitzondering van de [hoofdstukken 2][ref1], [3][ref2], [4][ref3], [5][ref4] voor zover
      het betreft de [artikelen 5.2.1][ref5], [5.2.2][ref6] en [5.2.4][ref7], en 6, in werking met ingang van de dag na
      de datum van uitgifte van het Staatsblad waarin dit besluit wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0010646#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0010646#Hoofdstuk5
      [ref5]: https://wetten.overheid.nl/BWBR0010646#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0010646#Artikel5
      [ref7]: https://wetten.overheid.nl/BWBR0010646#Artikel5
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel7.1
    references:
