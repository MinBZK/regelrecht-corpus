        artikel: '9'
  - number: 4.5.2.4
    text: |-
      Onze Minister brengt vervolgens op de rijksbijdrage voor het kenniscentrum voor de exploitatiekosten en de
      huisvestingskosten gezamenlijk, voor het in het eerste lid bedoelde kalenderjaar in mindering:
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.5.2
  - number: 4.5.2.4.a
    text: |-
      de kosten van de uitkeringen in dat kalenderjaar voor gewezen personeel van dat kenniscentrum, voor zover deze
      kosten voortvloeien uit een ontslag dat is geëffectueerd in de periode tussen 31 juli 1995 en 1 augustus 1998 en
      waarvoor de rechtspersoon, bedoeld in [artikel 4.4.2 van de wet][ref1] zoals luidend op 31 juli 1998, niet heeft
      ingestemd op grond van [artikel 2.5.8, derde lid, van de wet][ref2] zoals luidend op 31 juli 1998, met het ten
      laste van bedoelde rechtspersoon brengen van de kosten van deze uitkeringen, en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.5.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
  - number: 4.5.2.4.b
    text: |-
      35% van de kosten van de uitkeringen in dat kalenderjaar voor gewezen personeel van dat kenniscentrum, voor zover
      deze kosten voortvloeien uit een ontslag dat is geëffectueerd op of na 1 augustus 1998.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.5.2
  - number: 4.5.2.5
    text: |-
      De uitkomsten van de in het derde en vierde lid bedoelde berekeningen worden rekenkundig afgerond op twee
      decimalen.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.5.2
  - number: 4.5.3.1
    text: |-
      Onze Minister gaat gedurende het kalenderjaar waarop de verminderingen van de rijksbijdrage, bedoeld in
      [artikel 4.5.2, derde lid][ref1], betrekking hebben, per maand over tot een voorlopige inhouding op de
      rijksbijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.5.3
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 4.5.3.2
    text: |-
      De definitieve vaststelling van de verminderingen, bedoeld in het eerste lid, vindt plaats in maart of zoveel
      eerder als mogelijk is, volgend op het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.5.3
  - number: 4.5.3.3
    text: |-
      De definitieve vaststelling van de verminderingen betrekking hebbend op het kalenderjaar 2001 vindt plaats in
      euro's door de bedragen van de vermindering te delen door 2.20371.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.5.3
  - number: 5.1.1
    text: 'De bepalingen van dit hoofdstuk hebben betrekking op:'
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel5.1.1
  - number: 5.1.1.a
    text: |-
      instellingen als bedoeld in [artikel 1.1.1, onderdeel b, onder 1° tot en met 4°, van de wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel5.1.1
    references:
