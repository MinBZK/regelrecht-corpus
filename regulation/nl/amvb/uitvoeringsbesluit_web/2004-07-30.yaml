    text: |-
      Onze Minister brengt op de rijksbijdrage voor een instelling voor een kalenderjaar een bedrag in mindering volgens
      de volgende formule: PI ------ x (A + B + C) PL In deze formule wordt verstaan onder PI: de rijksbijdrage voor de
      desbetreffende instelling voor de exploitatiekosten zoals vastgesteld op grond van:
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.5.2
  - number: 2.5.2.1.a
    text: |-
      [artikel 2.2.2][ref1], in geval van een agrarisch opleidingscentrum vermeerderd met de rijksbijdrage zoals
      vastgesteld op grond van [artikel 2.3.2][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.5.2
