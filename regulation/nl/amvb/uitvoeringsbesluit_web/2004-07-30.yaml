  - number: 5.2.1.2
    text: |-
      De informatieverzameling, bedoeld in [artikel 2.3.6 van de wet][ref1], waarover het gemeentebestuur dient
      te beschikken, bevat de gegevens volgens de beschrijving in het gegevenswoordenboek dat is opgenomen in
      [bijlage 2 bij dit besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010646
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel5.2.1
    references:
