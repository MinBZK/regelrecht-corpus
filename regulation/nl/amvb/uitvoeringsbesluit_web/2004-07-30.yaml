  - number: 2.2.5
    text: |-
      Onze Minister berekent het rijksbijdragedeel voor voorbereidende en ondersteunende activiteiten als bedoeld in
      [artikel 7.2.2, vierde lid, van de wet][ref1], voor een kalenderjaar door het landelijk beschikbare budget ten
      behoeve van voorbereidende en ondersteunende activiteiten, zoals dat voor dat kalenderjaar is vastgesteld op grond
      van [artikel 2.2.1, eerste lid][ref2], over de instellingen te verdelen naar rato van het aantal deelnemers per
      instelling, voor zover deze deelnemers voldoen aan de volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.2.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0010646
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.2.5.a
    text: |-
      zij waren op 1 oktober van het tweede kalenderjaar voorafgaand aan het desbetreffende
      jaar ingeschreven aan de desbetreffende instelling voor een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onder a of b, van de wet][ref1], en waren tevens


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.2.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 2.2.5.b
    text: 'niet in het bezit van:'
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.2.5
  - number: 2.2.5.b.1°
    text: |-
      een diploma lager beroepsonderwijs of voorbereidend beroepsonderwijs, tenzij dat diploma is verkregen op grond van
      een eindexamen waarbij een of meer vakken op A-niveau of vier of meer vakken op B-niveau zijn geëxamineerd,
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.2.5
  - number: 2.2.5.b.2°
    text: een diploma middelbaar algemeen voortgezet onderwijs,
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.2.5
  - number: 2.2.5.b.3°
    text: |-
      een bewijs dat de eerste drie leerjaren van een school voor hoger algemeen voortgezet onderwijs of van een school
      voor voorbereidend wetenschappelijk onderwijs met gunstig gevolg zijn doorlopen, of
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.2.5
  - number: 2.2.5.b.4°
    text: |-
      een diploma beroepsonderwijs van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onder b tot en met f, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.2.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 2.2.6
    text: |-
      In geval van fusie van instellingen of indien vanwege afspraken tussen instellingen over de verzorging van
      beroepsopleidingen, bepaalde gegevens als bedoeld in de [artikelen 2.2.3, eerste lid][ref1], [2.2.4][ref2]
      of [2.2.5][ref3], anders moeten worden toegerekend, geeft Onze Minister op overeenkomstige wijze toepassing aan
      die bepalingen. Afspraken als bedoeld in de eerste volzin blijken uit een door het bevoegd gezag, in voorkomend
      geval tezamen met andere betrokken bevoegde gezagsorganen, aan Onze Minister overgelegde en ondertekende verklaring
      dienaangaande.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.2.6
    references:
