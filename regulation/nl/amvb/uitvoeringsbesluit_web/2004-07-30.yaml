    text: 20% wordt toegerekend aan het landelijk deel ten behoeve van de maatstaf opleidingen,
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.2
  - number: 4.2.2.b
    text: |-
      60% wordt toegerekend aan het landelijk deel ten behoeve van de maatstaven bpv-plaatsen in de beroepsbegeleidende
      leerweg en in de beroepsopleidende leerweg, en
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.2
  - number: 4.2.2.c
    text: |-
      20% wordt toegerekend aan het landelijk deel ten behoeve van de maatstaven leerbedrijven in de beroepsbegeleidende
      leerweg en in de beroepsopleidende leerweg.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.2
  - number: 4.2.3.1
    text: |-
      Onze Minister berekent voor een kenniscentrum de rijksbijdrage voor de exploitatiekosten door bij elkaar op te
      tellen:
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.3
  - number: 4.2.3.1.a
    text: het rijksbijdragedeel op grond van de maatstaf opleidingen,
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.3
  - number: 4.2.3.1.b
    text: |-
      het rijksbijdragedeel op grond van de maatstaven bpv-plaatsen in de beroepsbegeleidende leerweg en in de
      beroepsopleidende leerweg, en
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.3
  - number: 4.2.3.1.c
    text: |-
      het rijksbijdragedeel op grond van de maatstaven leerbedrijven in de beroepsbegeleidende leerweg en in de
      beroepsopleidende leerweg, zoals [deze delen][ref1] voor het desbetreffende kalenderjaar voor het kenniscentrum
      worden berekend op grond van respectievelijk de [artikelen 4.2.4][ref2] en [4.2.5][ref3], [4.2.6][ref4],
      [4.2.7][ref5] en [4.2.8][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0010646#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0010646#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0010646#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0010646#Artikel4
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.3
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0010646
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0010646
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0010646
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0010646
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0010646
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.2.3.2
    text: |-
      Het aandeel van de op grond van het eerste lid berekende rijksbijdrage voor de exploitatiekosten van het
      kenniscentrum in het desbetreffende landelijk beschikbare budget wordt uitgedrukt in een percentage van dat budget.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.3
  - number: 4.2.3.3
    text: |-
      De op grond van het eerste lid berekende rijksbijdrage kan worden aangepast in verband met uit de rijksbegroting
      voortvloeiende maatregelen.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.3
  - number: 4.2.4.1
    text: |-
      Onze Minister berekent de rijksbijdrage voor de exploitatiekosten voor het kenniscentrum voor zover het betreft het
      gedeelte van het landelijk beschikbare budget dat is toegerekend aan de maatstaf opleidingen, door:
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.4
  - number: 4.2.4.1.a
    text: |-
      voor elke opleiding waarvoor het kenniscentrum de eindtermen heeft voorgesteld, en voor zover deze eindtermen
      op 1 augustus 2001 zijn vermeld in het Centraal register, het aantal studiebelastingsuren dat is vastgesteld als
      onderdeel van de eindtermen voor die opleiding te delen door 1600, dit aantal af te ronden op een half naar boven,
      en het totaal te vermenigvuldigen met
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.4
  - number: 4.2.4.1.b
    text: |-
      het aantal in het Centraal register opgenomen deelkwalificaties van de onder a bedoelde opleidingen, met dien
      verstande dat een deelkwalificatie slechts eenmaal meetelt, en de uitkomst te delen door
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.4
  - number: 4.2.4.1.c
    text: |-
      het totaal van de in het Centraal register opgenomen deelkwalificaties van de onder a bedoelde opleidingen, zonder
      de beperking in onderdeel b.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.4
  - number: 4.2.4.2
    text: |-
      De berekening volgens het eerste lid leidt tot een aantal punten voor het kenniscentrum, rekenkundig afgerond op
      een half. Op het aantal punten, bedoeld in de eerste volzin, wordt vervolgens een correctie voor schaalvoordelen
      toegepast door dat aantal te vermenigvuldigen met een factor, zoals aangegeven in de navolgende tabel:






                    aantal punten


                    factor






                    0,5 t/m 50


                    1




                    51 t/m 60


                    0,95




                    61 t/m 70


                    0,90




                    71 t/m 80


                    0,85




                    81 t/m 90


                    0,80




                    91 t/m 100


                    0,75




                    101 t/m 110


                    0,70




                    111 en hoger


                    0,65
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.4
  - number: 4.2.4.3
    text: |-
      Elk kenniscentrum heeft aanspraak op het gedeelte van het landelijk beschikbare budget, bedoeld in het eerste
      lid, naar rato van het aantal punten van elk kenniscentrum nadat daarop de correctie, bedoeld in het tweede lid,
      is toegepast.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.4
  - number: 4.2.5.1
    text: |-
      Voor de toepassing van [artikel 4.2.6][ref1] wordt onder een bpv-plaats verstaan, een beroepspraktijkvormingsplaats
      waarvoor een overeenkomst als bedoeld in [artikel 7.2.8, tweede lid, van de wet][ref2], is gesloten op grond
      waarvan een leerbedrijf verplicht is in het tweede studiejaar voorafgaand aan het kalenderjaar waarop de
      rijksbijdrage betrekking heeft, beroepspraktijkvorming te verzorgen.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.5
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 4.2.5.2
    text: |-
      Voor de toepassing van [artikel 4.2.6][ref1] wordt uitgegaan van een aantal normatieve bpv-plaatsen per
      kenniscentrum per leerweg. Dat aantal wordt berekend door:


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.5
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.2.5.2.a
    text: |-
      bij elkaar op te tellen de aantallen uren beroepspraktijkvorming van alle bpv-plaatsen in die leerweg in het
      studiejaar, bedoeld in het eerste lid, voor zover het betreft opleidingen waarvoor dat kenniscentrum de eindtermen
      heeft voorgesteld, en
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.5
  - number: 4.2.5.2.b
    text: dat totale aantal te delen door 960 uren.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.5
  - number: 4.2.6.1
    text: |-
      Onze Minister berekent de rijksbijdrage voor de exploitatiekosten voor het kenniscentrum voor zover het betreft
      het gedeelte van het landelijk beschikbare budget dat is toegerekend aan de maatstaven bpv-plaatsen in de
      beroepsbegeleidende leerweg en in de beroepsopleidende leerweg, op de wijze als bepaald in het tweede tot en met
      vierde lid.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.6
  - number: 4.2.6.2
    text: |-
      Met betrekking tot het voorlaatste studiejaar dat voorafgaat aan het kalenderjaar waarop de rijksbijdrage
      betrekking heeft, worden vastgesteld:
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.6
  - number: 4.2.6.2.a
    text: het landelijk aantal normatieve bpv-plaatsen in de beroepsbegeleidende leerweg,
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.6
  - number: 4.2.6.2.b
    text: het landelijk aantal normatieve bpv-plaatsen in de beroepsopleidende leerweg,
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.6
  - number: 4.2.6.2.c
    text: voor elk kenniscentrum, het aantal normatieve bpv-plaatsen in de beroepsbegeleidende leerweg, en
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.6
  - number: 4.2.6.2.d
    text: voor elk kenniscentrum, het aantal normatieve bpv-plaatsen in de beroepsopleidende leerweg.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.6
  - number: 4.2.6.3
    text: |-
      De op grond van het tweede lid, aanhef en onder a en b, vastgestelde landelijke aantallen worden vermenigvuldigd
      met respectievelijk 0,00433 en 0,00414, de uitkomsten worden bij elkaar opgeteld en het procentuele aandeel van elk
      landelijk aantal in dat totale aantal wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.6
  - number: 4.2.6.4
    text: |-
      Van het in het eerste lid bedoelde gedeelte van het landelijk beschikbare budget wordt het bedrag vastgesteld
      voor elk landelijk aantal, overeenkomstig het in het derde lid bedoelde percentage. Dat bedrag wordt over de
      kenniscentra verdeeld naar rato van de voor elk kenniscentrum op grond van het tweede lid, aanhef en onder c en d,
      vastgestelde aantallen.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.6
  - number: 4.2.7.1
    text: |-
      Onze Minister berekent de rijksbijdrage voor de exploitatiekosten voor het kenniscentrum voor zover het betreft
      het gedeelte van het landelijk beschikbare budget dat is toegerekend aan de maatstaven leerbedrijven in de
      beroepsbegeleidende leerweg en in de beroepsopleidende leerweg, op de wijze als bepaald in het tweede tot en met
      het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.7
  - number: 4.2.7.2
    text: |-
      Ten aanzien van de drie studiejaren die voorafgaan aan het jaar waarin de rijksbijdrage wordt vastgesteld, wordt
      een derde gedeelte bepaald van:
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.7
  - number: 4.2.7.2.a
    text: |-
      het landelijk aantal leerbedrijven dat de beroepspraktijkvorming in de beroepsbegeleidende leerweg in die
      studiejaren verzorgt;
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.7
  - number: 4.2.7.2.b
    text: |-
      het landelijk aantal leerbedrijven dat de beroepspraktijkvorming in de beroepsopleidende leerweg in die studiejaren
      verzorgt;
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.7
  - number: 4.2.7.2.c
    text: |-
      voor elk kenniscentrum, het aantal leerbedrijven dat de beroepspraktijkvorming in de beroepsbegeleidende leerweg in
      die studiejaren verzorgt;
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.7
  - number: 4.2.7.2.d
    text: |-
      voor elk kenniscentrum, het aantal leerbedrijven dat de beroepspraktijkvorming in de beroepsopleidende leerweg in
      die studiejaren verzorgt.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.7
  - number: 4.2.7.3
    text: Een leerbedrijf telt slechts eenmaal mee in de aantallen, bedoeld in het tweede lid, onder c en d.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.7
  - number: 4.2.7.4
    text: |-
      De op grond van het tweede lid, onder a en b, vastgestelde landelijke aantallen worden vermenigvuldigd met
      respectievelijk 0,00314 en 0,0018, de beide uitkomsten worden bij elkaar opgeteld en het procentuele aandeel van
      elk landelijk aantal in dat totale aantal wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.7
  - number: 4.2.7.5
    text: |-
      Van het landelijk beschikbare budget voor de exploitatiekosten wordt het bedrag vastgesteld voor elk landelijke
      aantal, overeenkomstig het in het vierde lid bedoelde percentage. Dat bedrag wordt over de landelijke organen
      verdeeld naar rato van de voor elk kenniscentrum op grond van het tweede lid, aanhef en onder c en d, vastgestelde
      aantallen.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.7
  - number: 4.2.8.1
    text: |-
      Bij de vaststellingen, bedoeld in [artikel 4.2.7, tweede lid][ref1], betrekt Onze Minister uitsluitend de
      leerbedrijven:


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.8
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.2.8.1.a
    text: |-
      die zijn aangeduid met de code leerbedrijf, bedoeld in [bijlage 3 bij dit besluit][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0010646
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.8
    references:
      - id: ref1
        bwb_id: BWBR0010646
  - number: 4.2.8.1.b
    text: |-
      waar op enig moment in het studiejaar dat direct voorafgaat aan het kalenderjaar waarin de rijksbijdrage wordt
      vastgesteld, ten minste één deelnemer daadwerkelijk de opleiding in de praktijk van het beroep, bedoeld in
      [artikel 7.2.8, eerste lid, van de wet][ref1], volgt op de grondslag van een overeenkomst als bedoeld in het tweede
      lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 4.2.8.2
    text: |-
      Voor de toepassing van het eerste lid, onder a, stelt het kenniscentrum de betrokken instellingen in kennis
      van de in het eerste lid onder a bedoelde codes van de leerbedrijven, en stelt het de instellingen tijdig in
      kennis van wijzigingen daarin. De in de eerste volzin bedoelde instellingen zijn instellingen als bedoeld in
      [artikel 1.1.1, onderdeel b][ref1], of [1.4.1 van de wet][ref2], een in [artikel 12.3.8 van de wet][ref3] genoemd
      instituut of een in [artikel 12.3.9 van de wet][ref4] genoemde hogeschool.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.2.8
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '12'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '12'
  - number: 4.3.1.1
    text: |-
      Onze Minister stelt het bedrag voor huisvestingskosten voor elk kenniscentrum vast overeenkomstig het percentage
      dat op grond van [artikel 4.2.3, tweede lid][ref1], voor dat kenniscentrum is vastgesteld, met dien verstande dat
      aanpassingen als bedoeld in het derde lid van dat artikel daarbij buiten beschouwing blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.3.1
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.3.1.2
    text: |-
      De op grond van het eerste lid berekende rijksbijdrage kan worden aangepast in verband met uit de rijksbegroting
      voortvloeiende maatregelen.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.3.1
  - number: 4.4.1
    text: 'De rijksbijdrage omvat:'
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.4.1
  - number: 4.4.1.a
    text: |-
      een bedrag voor exploitatiekosten, berekend volgens deze paragraaf, daaronder mede begrepen een bedrag in verband
      met kosten van werkloosheidsuitkeringen en suppleties inzake arbeidsongeschiktheid, en
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.4.1
  - number: 4.4.1.b
    text: een bedrag voor huisvestingskosten, berekend volgens deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.4.1
  - number: 4.4.2
    text: |-
      Binnen het raam van de door de begrotingswetgever voor het desbetreffende begrotingsjaar beschikbaar gestelde
      middelen, stelt Onze Minister jaarlijks het landelijk beschikbare budget vast voor de exploitatiekosten en voor de
      huisvestingskosten van het kenniscentrum op het gebied van de landbouw en de natuurlijke omgeving.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.4.2
  - number: 4.4.3
    text: 'Onze Minister berekent de rijksbijdrage afzonderlijk voor:'
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.4.3
  - number: 4.4.3.a
    text: |-
      de taken, bedoeld in [artikel 1.5.2, eerste, tweede en vijfde lid, van de wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.4.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 4.4.3.b
    text: |-
      de taken, bedoeld in [artikel 1.5.2, derde lid, van de wet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.4.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 4.4.3.c
    text: |-
      de taken, bedoeld in [artikel 1.5.2, vierde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.4.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 4.4.4
    text: 'Van het landelijk beschikbare budget voor de exploitatiekosten van het kenniscentrum wordt:'
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.4.4
  - number: 4.4.4.a
    text: |-
      20% toegerekend aan de taken, bedoeld in [artikel 4.4.3, onder a][ref1], met dien verstande dat 10% van het
      desbetreffende deel van het landelijk beschikbare budget betrekking heeft op strategische expertise-ontwikkeling,


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.4.4
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 4.4.4.b
    text: |-
      60% toegerekend aan de taken, bedoeld in [artikel 4.4.3, onder b][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.4.4
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 4.4.4.c
    text: |-
      20% toegerekend aan de taken, bedoeld in [artikel 4.4.3, onder c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.4.4
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 4.4.5.1
    text: |-
      Onze Minister berekent de totale rijksbijdrage voor de exploitatiekosten van het kenniscentrum door de middelen
      bij elkaar op te tellen die voor het kenniscentrum zijn berekend op grond van de [artikelen 4.4.3][ref1] en
      [4.4.4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel4
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.4.5
    references:
