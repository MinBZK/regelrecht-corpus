    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.5.2
  - number: 2.5.2.1.d
    text: |-
      [artikel 2 van het Besluit bekostiging agrarische innovatie- en praktijkcentra 1997][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008516#Artikel2
