        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 4.4.5.2
    text: |-
      De op grond van het eerste lid vastgestelde rijksbijdrage kan worden aangepast in verband met uit de rijksbegroting
      voortvloeiende maatregelen.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.4.5
  - number: 4.4.6.1
    text: Onze Minister stelt het bedrag voor huisvestingskosten voor het kenniscentrum vast.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.4.6
  - number: 4.4.6.2
    text: |-
      De op grond van het eerste lid vastgestelde rijksbijdrage kan worden aangepast in verband met uit de rijksbegroting
      voortvloeiende maatregelen.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.4.6
  - number: 4.5.1
    text: |-
      In deze paragraaf wordt onder uitkering verstaan, een werkloosheidsuitkering of een suppletie inzake
      arbeidsongeschiktheid alsmede een andere uitkering wegens ziekte en arbeidsongeschiktheid van gewezen personeel,
      anders dan op grond van de [Ziektewet][ref1], voortvloeiend uit een dienstbetrekking aan een kenniscentrum.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.5.1
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 4.5.2.1
    text: |-
      Het in [artikel 2.4.1, tweede lid, van de wet][ref1] bedoelde bedrag dat Onze Minister in verband met uitkeringen
      in mindering brengt op de rijksbijdrage voor een kalenderjaar, wordt berekend volgens het tweede tot en met vijfde
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.5.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
  - number: 4.5.2.2
    text: |-
      Onze Minister van Onderwijs, Cultuur en Wetenschappen berekent voor elk kenniscentrum, daaronder mede begrepen
      het kenniscentrum op het gebied van de landbouw en de natuurlijke omgeving, ten behoeve van het in het eerste
      lid bedoelde kalenderjaar het relatieve aandeel van de rijksbijdrage voor de exploitatiekosten in het totaal van
      deze rijksbijdragen zoals berekend volgens [paragraaf 2][ref1] en [paragraaf 4][ref2] voor zover het betreft
      de exploitatiekosten.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.5.2
    references:
      - id: ref1
        bwb_id: BWBR0010646
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0010646
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 4.5.2.3
    text: |-
      Onze Minister brengt op de rijksbijdrage voor een kalenderjaar een bedrag in mindering, berekend met de
      volgende formule: RALO x (A+B+C+D) In deze formule wordt verstaan onder: RALO: het in het tweede lid bedoelde
      relatieve aandeel; A: de kosten van de uitkeringen in het in het eerste lid bedoelde kalenderjaar voor
      gewezen personeel van de in het tweede lid bedoelde kenniscentra, voor zover deze kosten voortvloeien uit
      een ontslag dat is geëffectueerd voor 1 augustus 1995; B: de kosten van de uitkeringen in dat kalenderjaar
      voor gewezen personeel van de in het tweede lid bedoelde kenniscentra, voor zover deze kosten voortvloeien
      uit een ontslag dat is geëffectueerd in de periode tussen 31 juli 1995 en 1 augustus 1998 en waarvoor de
      rechtspersoon, bedoeld in [artikel 4.4.2 van de wet][ref1] zoals luidend op 31 juli 1998, heeft ingestemd op
      grond van [artikel 2.5.8, derde lid, van de wet][ref2] zoals luidend op 31 juli 1998, met het ten laste van
      bedoelde rechtspersoon brengen van de kosten van deze uitkeringen; C: 65% van de kosten van de uitkeringen
      in dat kalenderjaar voor gewezen personeel van de in het tweede lid bedoelde kenniscentra, voor zover deze
      kosten voortvloeien uit een ontslag dat is geëffectueerd op of na 1 augustus 1998; D: 100% van de kosten van de
      uitkeringen in het desbetreffende kalenderjaar voor gewezen personeel van een kenniscentrum dat de taken beëindigt,
      anders dan op grond van een bestuursoverdracht als bedoeld in [artikel 9.2.2 van de wet][ref3], indien het bestuur
      van dit kenniscentrum niet tevens bestuur is van een ander kenniscentrum.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel4.5.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
