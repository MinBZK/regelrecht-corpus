  - number: 5.1.2.b
    text: |-
      gegevenswoordenboek: de opsomming van een door het bevoegd gezag van een instelling, een gemeentebestuur of het
      bestuur van een landelijk orgaan te verzamelen gegevens, bedoeld in [artikel 5.2.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel5
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel5.1.2
    references:
      - id: ref1
