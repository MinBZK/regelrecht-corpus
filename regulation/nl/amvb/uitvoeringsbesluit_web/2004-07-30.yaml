        artikel: '2'
      - id: ref2
        bwb_id: BWBR0010646
  - number: 5.2.1.3
    text: |-
      De informatieverzameling, bedoeld in [artikel 2.5.10][ref1] juncto [artikel 2.5.5 van de wet][ref2], waarover
      het bestuur van een kenniscentrum dient te beschikken, bevat de gegevens volgens de beschrijving in het
      gegevenswoordenboek dat is opgenomen in [bijlage 3 bij dit besluit][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0010646
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel5.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0010646
  - number: 5.2.1.4
    text: |-
      De gegevens, bedoeld in het eerste en derde lid, die betrekking hebben op de bekostiging, zijn in het
      desbetreffende gegevenswoordenboek als zodanig aangeduid.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel5.2.1
  - number: 5.2.2
    text: |-
      Op verzoek van Onze Minister stelt het bevoegd gezag van een instelling, het gemeentebestuur dan wel het
      bestuur van een kenniscentrum gegevens aan hem ter beschikking, die door de instelling, de gemeente of het
      kenniscentrum op grond van [artikel 5.2.1][ref1] zijn verzameld. De beschikbaarstelling geschiedt overeenkomstig
      de formulieren die op het beroepsonderwijs, de educatie respectievelijk de werkzaamheden van het kenniscentrum
      van toepassing zijn, zoals die zijn opgenomen in [bijlage 4][ref2], [bijlage 5][ref3], respectievelijk
      [bijlage 6 bij dit besluit][ref4]. In voorkomende gevallen kan Onze Minister bij het verzoek om beschikbaarstelling
      reeds bij hem bekende gegevens opnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0010646
      [ref3]: https://wetten.overheid.nl/BWBR0010646
      [ref4]: https://wetten.overheid.nl/BWBR0010646
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel5.2.2
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0010646
      - id: ref3
        bwb_id: BWBR0010646
      - id: ref4
        bwb_id: BWBR0010646
  - number: 5.2.3
    text: |-
      Bij ministeriële regeling kan in bijzondere gevallen een aanvullende vragenlijst ten aanzien van bekostiging worden
      vastgesteld ter beantwoording door het bevoegd gezag van een instelling.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel5.2.3
  - number: 5.2.4.1
    text: |-
      Het bevoegd gezag van een instelling, het gemeentebestuur en het bestuur van een kenniscentrum bewaren de boeken,
      bescheiden en informatie op andere informatiedragers die verband houden met de toepassing van dit hoofdstuk
      voor zover het betreft gegevens ten behoeve van het door Onze Minister te voeren beleid ten aanzien van het
      beroepsonderwijs, van de educatie en van de kenniscentra, gedurende ten minste zeven jaren.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel5.2.4
  - number: 5.2.4.2
    text: |-
      Het bevoegd gezag van een instelling, het gemeentebestuur en het bestuur van een kenniscentrum bewaren de gegevens
      die verband houden met de toepassing van dit hoofdstuk op zodanige wijze dat daaruit de voor de vaststelling van de
      geaggregeerde gegevens van belang zijnde gegevens kunnen worden nagegaan.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel5.2.4
  - number: 5a.1
    text: 'De bepalingen van dit hoofdstuk hebben betrekking op:'
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel5a.1
  - number: 5a.1.1
    text: |-
      instellingen als bedoeld in de [artikelen 1.1.1, onderdelen b en b1][ref1], [12.3.8][ref2] en
      [12.3.9 van de wet][ref3], en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel5a.1
    references:
