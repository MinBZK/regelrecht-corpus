        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.2.7.2.c
    text: |-
      in afwijking van [artikel 2.2.5][ref1] het aantal deelnemers vastgesteld op 90% van het aantal deelnemers dat is
      gehanteerd bij de berekening van de rijksbijdrage van het voorgaande kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.2.7
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.2.7.3
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid, wordt in [artikel 2.2.4][ref1] in de begripsbepalingen LD1,
      LD2 en LD3 tevens gelezen: alsmede de op grond van [artikel 2.2.7, tweede lid, onderdeel b][ref2], vastgestelde
      aantallen diploma's.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.2.7
