  - number: 2.3.2.1
    text: |-
      Onze Minister berekent de rijksbijdrage voor een agrarisch opleidingscentrum voor de exploitatiekosten voor
      het voorbereidend beroepsonderwijs dat ten behoeve van deze berekening is onderverdeeld in beroepsonderwijs en
      leerwegondersteunend onderwijs, volgens de formule: {Liv x PLiv} + {Lil x PLil} In deze formule wordt verstaan
      onder: 'Liv: het aantal leerlingen dat op 1 oktober van het kalenderjaar voorafgaand aan het desbetreffende jaar'
      aan het desbetreffende agrarisch opleidingscentrum staat ingeschreven voor het beroepsonderwijs, Lil: het aantal
      leerlingen dat op 1 oktober van het kalenderjaar voorafgaand aan het desbetreffende jaar aan het desbetreffende
      agrarisch opleidingscentrum staat ingeschreven voor het leerwegondersteunend onderwijs, PLiv: de op grond van het
      tweede lid voor het desbetreffende kalenderjaar toegekende prijs per leerling beroepsonderwijs, en PLil: de op
      grond van het tweede lid voor het desbetreffende kalenderjaar toegekende prijs per leerling leerwegondersteunend
      onderwijs.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.3.2
  - number: 2.3.2.2
    text: |-
      Jaarlijks voor 1 september voorafgaand aan het kalenderjaar waarvoor de rijksbijdrage wordt vastgesteld, worden bij
      ministeriële regeling de prijzen per leerling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.3.2
  - number: 2.4.1.1
    text: |-
      Onze Minister verdeelt het op grond van [artikel 2.1.3][ref1] voor een kalenderjaar vastgestelde landelijk
      beschikbare budget voor de huisvestingskosten voor het beroepsonderwijs over de instellingen naar rato van de voor
      dat kalenderjaar op grond van [artikel 2.2.2][ref2] berekende rijksbijdrage voor exploitatiekosten per instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.4.1
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0010646
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.4.1.2
    text: |-
      Ten aanzien van scholen voor voortgezet onderwijs in scholengemeenschappen als bedoeld in
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      _________________, wordt bij ministeriële regeling jaarlijks een bedrag vastgesteld ten behoeve van de
      huisvestingskosten per leerling die op 1 oktober van het tweede kalenderjaar voorafgaand aan het desbetreffende
      jaar was ingeschreven aan een school voor voortgezet onderwijs als hiervoor bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0008703#ArtikelIV
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.4.1
    references:
      - id: ref1
        bwb_id: BWBR0008703
        artikel: IV
  - number: 2.4.1.3
    text: Het tweede lid is van overeenkomstige toepassing op het voorbereidend beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.4.1
  - number: 2.4.1.4
    text: |-
      De op grond van het eerste lid berekende rijksbijdrage kan worden aangepast in verband met uit de rijksbegroting
      voortvloeiende maatregelen.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.4.1
  - number: 2.4.1.5
    text: |-
      [Artikel 2.2.6][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.4.1
