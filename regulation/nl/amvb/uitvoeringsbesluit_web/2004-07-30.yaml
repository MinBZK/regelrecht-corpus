  - number: 2.2.7.1
    text: |-
      Indien Onze Minister van een instelling het formulier Bekostigingstelling beroepsonderwijs van
      [bijlage 4 bij dit besluit][ref1] niet uiterlijk 1 juli van het jaar voorafgaand aan het bekostigingsjaar voorzien
      van een goedkeurende accountantsverklaring heeft ontvangen, stelt Onze Minister de hoogte van de rijksbijdrage voor
      deze instelling voor het desbetreffende kalenderjaar vast, conform de voorschriften in het tweede tot en met het
      vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010646
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.2.7
    references:
      - id: ref1
        bwb_id: BWBR0010646
  - number: 2.2.7.2
    text: |-
      Bij de toepassing van [artikel 2.2.2][ref1] wordt voor een instelling als bedoeld in het eerste lid, bij de
      berekening van de rijksbijdrage voor exploitatiekosten voor het beroepsonderwijs:


      [ref1]: https://wetten.overheid.nl/BWBR0010646
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.2.7
    references:
      - id: ref1
        bwb_id: BWBR0010646
  - number: 2.2.7.2.a
    text: |-
      in afwijking van [artikel 2.2.3, eerste lid][ref1], de uitkomst van het gedeelte van de formule boven de streep
      vastgesteld op 90% van de uitkomst van dat deel van de formule van het voorgaande kalenderjaar;


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.2.7
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.2.7.2.b
    text: |-
      in afwijking van [artikel 2.2.4][ref1] de uitkomst van het gedeelte van de formule boven de streep vastgesteld op
      90% van de uitkomst van dat deel van de formule van het voorgaande kalenderjaar;


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.2.7
    references:
