        paragraaf: '2'
  - number: 2.2.7.4
    text: |-
      De instellingen, bedoeld in het eerste lid, dienen uiterlijk 1 november van het jaar voorafgaand aan het
      bekostigingsjaar het in het eerste lid bedoelde formulier, voorzien van een goedkeurende accountantsverklaring, in
      bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.2.7
  - number: 2.2.7.5
    text: |-
      Indien uit het formulier, bedoeld in het vierde lid, blijkt dat toepassing van [artikel 2.2.3][ref1],
      [artikel 2.2.4][ref2] respectievelijk [artikel 2.2.5][ref3] leidt tot een lagere waarde dan vastgesteld op grond
      van het tweede lid, onderdelen a, b respectievelijk c, wordt de vergoeding van de instelling berekend op grond van
      die lagere waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel2.2.7
    references:
