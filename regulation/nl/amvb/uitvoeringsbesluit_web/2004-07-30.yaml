  - number: 5.1.1.c
    text: |-
      gemeentebesturen en instellingen als bedoeld in [artikel 2.3.4 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel5.1.1
    references:
