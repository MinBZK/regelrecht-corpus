  - number: 5.1.2.a
    text: |-
      kenniscentrum: een kenniscentrum beroepsonderwijs bedrijfsleven als bedoeld in
      [artikel 1.1.1, onderdeel b2, van de wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0010646/2004-07-30#Artikel5.1.2
    references:
