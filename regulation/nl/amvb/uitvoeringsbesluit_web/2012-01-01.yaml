    text: |-
      In dit hoofdstuk wordt verstaan onder:

      a. kenniscentrum: een kenniscentrum beroepsonderwijs bedrijfsleven als bedoeld in
      [artikel 1.1.1, onderdeel b1, van de wet][ref1],

      b. gegevenswoordenboek: de opsomming van een door het bevoegd gezag van een instelling of het bestuur van een
      kenniscentrum te verzamelen gegevens, bedoeld in [artikel 5.2.1][ref2].


