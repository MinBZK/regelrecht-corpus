  - number: 4.2.2
    text: |-
      Het landelijk beschikbare budget voor de exploitatiekosten van de kenniscentra wordt verdeeld als volgt:

      a. 50% wordt toegerekend aan het landelijk deel ten behoeve van de stabilisatiecomponent,

      b. 10% wordt toegerekend aan het landelijk deel ten behoeve van de maatstaf opleidingen,

      c. 30% wordt toegerekend aan het landelijk deel ten behoeve van de maatstaf normatieve bpv-plaatsen, en

      d. 10% wordt toegerekend aan het landelijk deel ten behoeve van de maatstaf leerbedrijven.
    url: https://wetten.overheid.nl/BWBR0010646/2012-01-01#Artikel4.2.2
  - number: 4.2.3
    text: |-
      1 Onze Minister berekent voor een kenniscentrum de rijksbijdrage voor de exploitatiekosten door bij elkaar op te
      tellen:

      a. het rijksbijdragedeel op grond van de stabilisatiecomponent, zoals berekend overeenkomstig
      [artikel 4.2.3a][ref1],

      b. het rijksbijdragedeel op grond van de maatstaf opleidingen, zoals berekend overeenkomstig [artikel 4.2.4][ref2],

      c. het rijksbijdragedeel op grond van de maatstaf normatieve bpv-plaatsen, zoals berekend overeenkomstig
      [artikel 4.2.5][ref3], en

      d. het rijksbijdragedeel op grond van de maatstaf leerbedrijven, zoals berekend overeenkomstig
      [artikel 4.2.7][ref4].

      2 Het aandeel van de op grond van het eerste lid berekende rijksbijdrage voor de exploitatiekosten van het
      kenniscentrum in het desbetreffende landelijk beschikbare budget wordt uitgedrukt in een percentage van dat budget.

      3 De op grond van het eerste lid berekende rijksbijdrage kan worden aangepast in verband met uit de rijksbegroting
      voortvloeiende maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4.2.3a
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel4.2.4
      [ref3]: https://wetten.overheid.nl/BWBR0010646#Artikel4.2.5
      [ref4]: https://wetten.overheid.nl/BWBR0010646#Artikel4.2.7
    url: https://wetten.overheid.nl/BWBR0010646/2012-01-01#Artikel4.2.3
