  - number: 4.1.2
    text: |-
      In dit hoofdstuk wordt verstaan onder:

      a. kenniscentrum: een kenniscentrum beroepsonderwijs bedrijfsleven als bedoeld in
      [artikel 1.1.1, onderdeel b2, van de wet][ref1];

      b. leerbedrijf: een bedrijf dat of organisatie die bevoegd is de beroepspraktijkvorming te verzorgen, op
      basis van een gunstige beoordeling op grond van door het kenniscentrum vastgestelde criteria als bedoeld in
      [artikel 7.2.10 van de wet][ref2];

      c. normatieve bpv-plaats: een in [artikel 4.2.5][ref3] bedoelde normatieve bpv-plaats;

      d. opleiding: een opleiding als bedoeld in [artikel 7.2.2 van de wet][ref4] in de beroepsopleidende of
      beroepsbegeleidende leerweg, dan wel in beide leerwegen;

      e. exploitatiekosten: de kosten van een kenniscentrum niet zijnde de huisvestingskosten;

      f. deelnemer aan de beroepsbegeleidende leerweg: degene die op 1 oktober van het jaar voorafgaand
      aan het jaar waarin de rijksbijdrage wordt vastgesteld, aan een instelling als bedoeld in de
      [artikelen 1.1.1, onderdeel b, onder 1º, 2º en 3º][ref5], [12.3.8][ref6] en [12.3.9 van de wet][ref7] stond
      ingeschreven voor een opleiding aan de beroepsbegeleidende leerweg en daadwerkelijk die opleiding volgt, voor zover
      deze deelnemer:

      1°. uiterlijk op 31 december van eerstbedoeld jaar een overeenkomst als bedoeld in
      [artikel 7.2.8, tweede lid, van de wet][ref8] heeft afgesloten, en

      2°. een opleiding volgt als bedoeld in [artikel 2.2.3, tweede lid, onder b][ref9], uiterlijk op 1 juni
      van het daaropvolgende kalenderjaar, dan wel in geval de deelnemer een andere opleiding volgt uiterlijk op
      dezelfde datum als genoemd onder 1°, daadwerkelijk de opleiding in de praktijk van het beroep, bedoeld in
      [artikel 7.2.8, eerste lid, van de wet][ref10], volgt op de grondslag van een overeenkomst als bedoeld onder 1°;

      g. voltijds deelnemer aan de beroepsopleidende leerweg: degene die op 1 oktober van het jaar
      voorafgaand aan het jaar waarin de rijksbijdrage wordt vastgesteld, als voltijds deelnemer
      als bedoeld in [artikel 2.1.2, onder b][ref11], aan een instelling als bedoeld in de
      [artikelen 1.1.1, onderdeel b, onder 1º, 2º en 3º][ref12], [12.3.8][ref13] en [12.3.9 van de wet][ref14] stond
      ingeschreven voor een opleiding aan de beroepsopleidende leerweg en daadwerkelijk die opleiding volgt;

      h. deeltijds deelnemer aan de beroepsopleidende leerweg: degene die op 1 oktober van het
      jaar voorafgaand aan het jaar waarop de rijksbijdrage wordt vastgesteld, als deeltijds
      deelnemer als bedoeld in [artikel 2.1.2, onder c][ref15], aan een instelling als bedoeld in de
      [artikelen 1.1.1, onderdeel b, onder 1º, 2º en 3º][ref16], [12.3.8][ref17] en [12.3.9 van de wet][ref18] stond
      ingeschreven voor een opleiding aan de beroepsopleidende leerweg en daadwerkelijk die opleiding volgt.


