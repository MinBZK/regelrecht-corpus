  - number: 2.6.1
    text: |-
      1 Onze Minister brengt op de rijksbijdrage voor een instelling voor een kalenderjaar een bedrag in mindering
      volgens de formule:

      (DDi3 x DC1) + (DDi4 x DC2), waarin is:

      DDi3: het aantal deeltijds deelnemers als bedoeld in [artikel 2.2.3, eerste lid][ref1], onder DDi1 en DDi2, voor
      opleidingen als bedoeld in [artikel 7.2.2, eerste lid, onder a en b, van de wet][ref2];

      DC1: het cursusgeld per 1 januari van het desbetreffende kalenderjaar, bedoeld in artikel
      15 van het Uitvoeringsbesluit Les- en cursusgeldwet, voor opleidingen als bedoeld in
      [artikel 7.2.2, eerste lid, onder a en b, van de wet][ref3];

      DDi4: het aantal deeltijds deelnemers als bedoeld in [artikel 2.2.3, eerste lid][ref4], onder DDi1 en DDi2, voor
      opleidingen als bedoeld in [artikel 7.2.2, eerste lid, onder c tot en met e, van de wet][ref5];

      DC2: het cursusgeld per 1 januari van het desbetreffende kalenderjaar, bedoeld in
      [artikel 15 van het Uitvoeringsbesluit Les- en cursusgeldwet][ref6], voor opleidingen als bedoeld in
      [artikel 7.2.2, eerste lid, onder c tot en met e, van de wet][ref7].

      2 Bij de berekening van het in het eerste lid bedoelde bedrag telt het aantal deeltijds deelnemers DDi3 en DDi4,
      dat op 1 augustus van het tweede kalenderjaar voorafgaand aan het desbetreffende jaar aan de desbetreffende
      instelling voor de desbetreffende opleiding is ingeschreven en op die datum de leeftijd van 18 jaar nog niet heeft
      bereikt, niet mee.


