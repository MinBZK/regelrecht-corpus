  - number: 4.2.1
    text: |-
      Onze Minister berekent de rijksbijdrage voor de exploitatiekosten voor een kenniscentrum voor:

      a. de taken, bedoeld in [artikel 1.5.2, eerste, tweede en vijfde lid, van de wet][ref1], aan de hand van de
      maatstaf opleidingen,

      b. de taken, bedoeld in [artikel 1.5.2, derde lid, van de wet][ref2], aan de hand van de maatstaf normatieve bpv-
      plaatsen, en

      c. de taken, bedoeld in [artikel 1.5.2, vierde lid, van de wet][ref3], aan de hand van de maatstaf leerbedrijven.


