articles:
  - number: 1.1.1
    text: |-
      In dit besluit wordt verstaan onder:

      a. wet: de [Wet educatie en beroepsonderwijs][ref1];

      b. deelnemer: een in [artikel 8.1.1, eerste lid, eerste volzin, van de wet][ref2] bedoelde deelnemer;

      c. basisregister onderwijs: basisregister onderwijs als bedoeld in
      [artikel 24b van de Wet op het onderwijstoezicht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8.1.1
