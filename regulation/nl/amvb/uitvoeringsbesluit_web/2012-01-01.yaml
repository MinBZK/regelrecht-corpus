  - number: 4b.3.3
    text: |-
      1 De gegevens, bedoeld in [artikel 4b.3.1][ref1], worden uitsluitend gebruikt door de daartoe door Onze Minister
      aangewezen ambtenaren dan wel, voor zover het betreft het onderwijs op het gebied van landbouw, natuurlijke
      omgeving en voedsel, door de daartoe door Onze Minister aangewezen ambtenaren van het Ministerie van Economische
      Zaken, Landbouw en Innovatie.

      2 Onze Minister kan uitsluitend gebruiken:

      a. de gegevens van een deelnemer of voormalige deelnemer van wie het bevoegd gezag op grond van
      [2.5.5a, vierde lid, van de wet][ref2] het persoonsgebonden nummer aan Onze Minister heeft verstrekt ten behoeve
      van de vaststelling van de bekostiging van de instelling;

      b. de gegevens van een deelnemer of voormalige deelnemer, voorzover Onze Minister dit noodzakelijk acht ten behoeve
      van een onderzoek als bedoeld in [2.5.5b, derde lid, van de wet][ref3]; en

      c. de gegevens van een deelnemer of voormalige deelnemer, voorzover Onze Minister het noodzakelijk acht deze
      gegevens ten behoeve van de vaststelling van de bekostiging van de instelling te gebruiken in het verkeer met die
      instelling.

      3 Onder gebruik ten behoeve van de vaststelling van de bekostiging van de instelling van de gegevens, bedoeld in
      [artikel 4b.3.1][ref4], wordt mede verstaan het daartoe noodzakelijke gebruik voor de motivering van beschikkingen
      en de behandeling van bezwaar- en beroepschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4b.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2.5.5a
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel2.5.5b
      [ref4]: https://wetten.overheid.nl/BWBR0010646#Artikel4b.3.1
