  - number: 2.2.7
    text: |-
      1 De gegevens, bedoeld in [artikel 2.5.5a, tweede lid, onderdelen a, b, c, d, h, i, l, m en n, van de wet][ref1]
      en de verklaring, bedoeld in [artikel 2.2.4, vijfde lid, van de wet][ref2] worden uiterlijk 1 juli van het jaar
      voorafgaand aan het bekostigingsjaar ingediend bij Onze Minister. Indien Onze Minister van een instelling de
      gegevens, bedoeld in de eerste volzin, niet uiterlijk 1 juli van het jaar voorafgaand aan het bekostigingsjaar,
      voorzien van een goedkeurende accountantsverklaring, heeft ontvangen en hierdoor niet tijdig over de gegevens
      kan beschikken, kan Onze Minister de hoogte van de rijksbijdrage voor deze instelling voor het desbetreffende
      kalenderjaar vaststellen conform de voorschriften in het tweede tot en met zesde lid.

      2 Bij de toepassing van [artikel 2.2.2][ref3] wordt voor een instelling als bedoeld in het eerste lid, bij de
      berekening van de rijksbijdrage voor exploitatiekosten voor het beroepsonderwijs:

      a. in afwijking van [artikel 2.2.3, eerste lid][ref4], de uitkomst van het gedeelte van de formule boven de streep
      vastgesteld op 90% van de uitkomst van dat deel van de formule van het voorgaande kalenderjaar;

      b. in afwijking van [artikel 2.2.4, eerste lid][ref5], de uitkomst van het gedeelte van de formule boven de streep
      vastgesteld op 90% van de uitkomst van dat deel van de formule van het voorgaande kalenderjaar;

      c. in afwijking van [artikel 2.2.5][ref6] het aantal deelnemers vastgesteld op 90% van het aantal deelnemers dat is
      gehanteerd bij de berekening van de rijksbijdrage van het voorgaande kalenderjaar.

      3 Indien toepassing wordt gegeven aan het eerste lid, wordt in [artikel 2.2.4, eerste lid][ref7],
      in de begripsbepalingen LD1, LD2 en LD3 tevens gelezen: alsmede de op grond van
      [artikel 2.2.7, tweede lid, onderdeel b][ref8], vastgestelde aantallen diploma's.

      4 De instellingen, bedoeld in het eerste lid, dienen uiterlijk 1 november
      van het jaar voorafgaand aan het bekostigingsjaar de gegevens, bedoeld in
      [artikel 2.5.5a, tweede lid, onderdelen a, b, c, d, h, i, l, m en n, van de wet][ref9], voorzien van een
      goedkeurende accountantsverklaring, in bij Onze Minister.

      5 Indien uit de gegevens, bedoeld in het vierde lid, blijkt dat toepassing van [artikel 2.2.3][ref10],
      [artikel 2.2.4, eerste lid][ref11], respectievelijk [artikel 2.2.5][ref12] leidt tot een lagere waarde dan
      vastgesteld op grond van het tweede lid, onderdelen a, b respectievelijk c, wordt de vergoeding van de instelling
      berekend op grond van die lagere waarde.

      6 Indien uit de gegevens, bedoeld in het vierde lid, blijkt dat toepassing van [artikel 2.2.3][ref13],
      [artikel 2.2.4, eerste lid][ref14], respectievelijk [artikel 2.2.5][ref15], leidt tot een gelijke of hogere
      waarde dan vastgesteld op grond van het tweede lid, onderdelen a, b respectievelijk c, wordt de vergoeding van de
      instelling berekend op grond van het tweede lid.


