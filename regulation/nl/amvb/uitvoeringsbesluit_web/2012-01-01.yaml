      4 De berekening volgens het derde lid leidt tot een aantal normatieve bpv-plaatsen voor het kenniscentrum,
      rekenkundig af te ronden op een geheel getal.

      5 Van het in het eerste lid bedoelde gedeelte van het landelijk beschikbare budget wordt het bedrag voor het
      kenniscentrum vastgesteld naar rato van het aantal normatieve bpv-plaatsen van elk kenniscentrum nadat daarop de
      correctie en de afronding, bedoeld in het derde respectievelijk vierde lid, heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0010646/2012-01-01#Artikel4.2.5
  - number: 4.2.6
    text: |-
      1 Elk kenniscentrum verstrekt jaarlijks voor 15 november aan Onze Minister een opgave van het aantal door dat
      kenniscentrum erkende leerbedrijven op peildatum 1 oktober van dat jaar.

      2 De verklaring omtrent de getrouwheid, bedoeld in [artikel 2.5.3, vierde lid][ref1], juncto
      [artikel 2.5.10, eerste lid, van de wet][ref2] heeft mede betrekking op de opgave, bedoeld in het eerste lid.


