      1 Indien de op grond van [artikel 2.4.1, eerste lid][ref1], voor een instelling, niet zijnde een agrarisch
      opleidingscentrum, vastgestelde rijksbijdrage ten behoeve van de huisvestingskosten voor een kalenderjaar
      van de desbetreffende instelling, vermeerderd met het gedeelte van de rijksbijdrage, berekend op grond van
      [artikel 2.4.1, tweede lid][ref2], minder bedraagt dan het op grond van artikel 3, alsmede in voorkomende gevallen
      op grond van artikel 8 van de Regeling bekostiging huisvesting bve-sector 1999 voor het desbetreffende kalenderjaar
      vastgestelde bedrag voor de desbetreffende instelling, ontvangt de instelling voor het desbetreffende kalenderjaar
      een aanvulling tot dat bedrag.

      2 Indien de op grond van [artikel 2.4.1, eerste lid][ref3], voor een agrarisch opleidingscentrum vastgestelde
      rijksbijdrage ten behoeve van de huisvestingskosten voor een kalenderjaar van de desbetreffende instelling,
      vermeerderd met het gedeelte van de rijksbijdrage, berekend op grond van [artikel 2.4.1, derde lid][ref4], minder
      bedraagt dan het op grond van artikel 4, alsmede in voorkomende gevallen op grond van artikel 7 van de Regeling
      bekostiging huisvesting bve-sector voor het desbetreffende kalenderjaar vastgestelde bedrag voor de desbetreffende
      instelling, ontvangt de instelling voor het desbetreffende kalenderjaar een aanvulling tot dat bedrag.


