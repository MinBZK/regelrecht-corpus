  - number: 2.5.1
    text: |-
      In deze paragraaf wordt verstaan onder:

      a. instelling: een instelling als bedoeld in [artikel 1.1.1, onderdeel b, van de wet][ref1], een
      instituut als bedoeld in [artikel 12.3.8 van de wet][ref2] of de hogeschool Haarlem, bedoeld in
      [artikel 12.3.9 van de wet][ref3], dan wel diens rechtsopvolger;

      b. uitkering: een werkloosheidsuitkering als bedoeld in de [Hoofdstukken I][ref4]
      en [II van het Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref5]
      of suppletie inzake arbeidsongeschiktheid als bedoeld in Hoofdstuk 3 van het
      [Besluit ziekte en arbeidsongeschiktheid voor onderwijspersoneel primair en voortgezet onderwijs][ref6],
      voortvloeiend uit een dienstbetrekking aan een instelling;

      c. overeenkomst educatie: een overeenkomst als bedoeld in [artikel 2.3.4, eerste lid, van de wet][ref7].


