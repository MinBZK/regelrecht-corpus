      Het [Besluit leerlinggebonden financiering][ref1], met uitzondering van de [artikelen 2][ref2] en [3][ref3], is
      van toepassing met dien verstande dat wordt verstaan onder:

      a. leerling: deelnemer als bedoeld in [artikel 2.2.5, eerste lid, onder b, van de wet][ref4];

      b. een school: een instelling als bedoeld in [artikel 1.1.1, onder b, van de wet][ref5] en een hogeschool als
      bedoeld in [artikel 12.3.9 van de wet][ref6];

      c. een leerling die toelaatbaar is tot het speciaal onderwijs of het voortgezet speciaal onderwijs: een deelnemer
      die recht heeft op leerlinggebonden financiering met ambulante begeleiding vanuit het onderwijs van het cluster
      waarvoor hij geïndiceerd is;

      d. kinderpsychiatrische voorziening of Jeugdbescherming: psychiatrische voorziening of GGZ.


