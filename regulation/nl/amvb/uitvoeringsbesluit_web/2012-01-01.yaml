  - number: 4b.3.1
    text: |-
      1 Ten behoeve van de vaststelling van de bekostiging van een instelling kan Onze Minister de volgende in het
      basisregister onderwijs opgenomen gegevens van een deelnemer of voormalige deelnemer van de instelling gebruiken:

      a. het persoonsgebonden nummer;

      b. het geslacht, de geboortedatum en de postcode van de woonplaats;

      c. de datum van inschrijving of van de wijziging of beëindiging daarvan;

      d. de leerweg, alsmede de code, bedoeld in [artikel 6.4.1, tweede lid, onder a, van de wet][ref1] van het
      opleidingsdomein, het kwalificatiedossier of de kwalificatie waarvoor de deelnemer is ingeschreven en bij
      inschrijving voor een opleidingsdomein het niveau, bedoeld in [artikel 7.2.2, derde lid, van de wet][ref2] van
      de beroepsopleiding;

      e. indien van toepassing, het al dan niet zijn van risicodeelnemer;

      f. het behaalde diploma;

      g. de omvang van de beroepspraktijkvorming, de datum van begin en einde daarvan, de afsluitdatum van
      de beroepspraktijkvormingsovereenkomst en het betrokken bedrijf dat of de betrokken organisatie die de
      beroepspraktijkvormingsovereenkomst verzorgt;

      h. de gegevens over de nationaliteit en het verblijfsrecht van de deelnemer;

      i. het registratienummer van de instelling;

      j. indien van toepassing het volgen van de opleiding in voltijd of deeltijd en het zijn van examendeelnemer;

      k. het al dan niet voor bekostiging in aanmerking komen van de deelnemer of het diploma; en

      l. indien van toepassing, het gebruiken van het persoonsgebonden nummer ten behoeve van de uitvoering van de
      subsidieregelingen van het Europees Sociaal Fonds in het verkeer met de instelling.

      2 De gegevens, bedoeld in het eerste lid, onderdelen d tot en met f, worden gespecificeerd overeenkomstig het
      bepaalde krachtens [artikel 2.5.5a, derde lid, eerste volzin, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6.4.1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel2.5.5a
