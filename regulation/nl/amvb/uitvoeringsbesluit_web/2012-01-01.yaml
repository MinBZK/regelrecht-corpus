  - number: 5.2.2
    text: |-
      1 Op verzoek van Onze Minister stelt het bevoegd gezag van een instelling dan wel het bestuur van een kenniscentrum
      gegevens aan hem beschikbaar, die door de instelling of het kenniscentrum op grond van [artikel 5.2.1][ref1] zijn
      verzameld.

      2 De beschikbaarstelling geschiedt voor het beroepsonderwijs en de educatie overeenkomstig [bijlage 4][ref2] bij
      dit besluit en voor de kenniscentra overeenkomstig de formulieren die zijn opgenomen in [bijlage 6][ref3] bij dit
      besluit.

      3 In voorkomende gevallen kan Onze Minister bij het verzoek om beschikbaarstelling reeds bij hem bekende gegevens
      opnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel5.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0010646
      [ref3]: https://wetten.overheid.nl/BWBR0010646
