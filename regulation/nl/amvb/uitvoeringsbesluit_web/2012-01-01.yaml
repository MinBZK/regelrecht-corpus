  - number: 2.2.3
    text: |-
      1 Onze Minister berekent het rijksbijdragedeel op grond van de maatstaf ingeschreven deelnemers volgens de formule:







                    i = n




                    (Σ {[(DDi1 x DFi1) + (DDi2 x DFi2) + VDi] x Pi}) x C




                    i = 1




                    ———————————————————————— x LMID




                    LDw






      In deze formule wordt de teller van de breuk afgerond op twee decimalen en wordt verstaan onder:

      i: opleiding verzorgd aan de desbetreffende instelling,

      n: het aantal opleidingen verzorgd aan de desbetreffende instelling,

      DDi1: het aantal deeltijds deelnemers aan de beroepsopleidende leerweg dat op 1 oktober van het tweede kalenderjaar
      voorafgaand aan het desbetreffende jaar aan de desbetreffende instelling is ingeschreven voor een opleiding als
      bedoeld in het tweede lid, onder b, en daadwerkelijk die opleiding volgt, vermeerderd met het aantal deelnemers aan
      de beroepsbegeleidende leerweg dat op 1 oktober van het tweede kalenderjaar voorafgaand aan het desbetreffende jaar
      aan de desbetreffende instelling voor de desbetreffende opleiding is ingeschreven en daadwerkelijk die opleiding
      volgt, voor zover de laatstgenoemde deelnemers:

      a. uiterlijk op 31 december van datzelfde kalenderjaar een overeenkomst als bedoeld in
      [artikel 7.2.8, tweede lid, van de wet][ref1] hebben gesloten, en

      b. indien zij een opleiding volgen als bedoeld in het tweede lid, onder b, uiterlijk op 1 juni van het
      daaropvolgende kalenderjaar, dan wel in geval zij een andere opleiding volgen uiterlijk op dezelfde
      datum als genoemd onder a, daadwerkelijk de opleiding in de praktijk van het beroep, bedoeld in
      [artikel 7.2.8, eerste lid, van de wet][ref2], volgen op de grondslag van een overeenkomst als bedoeld onder a,

      DDi2: het aantal deeltijds deelnemers dat op 1 oktober van het tweede kalenderjaar voorafgaand aan het
      desbetreffende jaar aan de desbetreffende instelling voor de desbetreffende opleiding is ingeschreven en
      daadwerkelijk die opleiding volgt en niet voldoet aan de definitie van DDi1.

      DFi1: de op grond van het tweede lid aan de desbetreffende opleiding toegekende deeltijdfactor,

      DFi2: de op grond van het derde lid aan de desbetreffende opleiding toegekende deeltijdfactor,

      VDi: het aantal voltijds deelnemers dat op 1 oktober van het tweede kalenderjaar voorafgaand aan het desbetreffende
      jaar aan de desbetreffende instelling voor de desbetreffende opleiding is ingeschreven en daadwerkelijk die
      opleiding volgt,

      Pi: de op grond van het vierde lid aan de desbetreffende opleiding toegekende prijsfactor,

      LDw: de landelijke deelnemerswaarde, zijnde de som van de deelnemerswaarden van de instellingen, waarbij onder
      deelnemerswaarde wordt verstaan: de teller van de in de formule gebruikte breuk, en

      LMID: het landelijk deel ten behoeve van de maatstaf ingeschreven deelnemers, zoals dat voor het desbetreffende
      jaar is vastgesteld op grond van [artikel 2.2.1, tweede lid, onder a][ref3],

      C: de correctiefactor, bedoeld in het zesde lid.

      2 De deeltijdfactor, bedoeld in het eerste lid onder DFi1, bedraagt:

      a. voor de opleidingen die zijn opgenomen in het Centraal register en die worden bekostigd door Onze Minister van
      Landbouw, Natuurbeheer en Visserij: 0,5;

      b. voor de opleidingen die zijn opgenomen in het Centraal register en die worden bekostigd door Onze
      Minister van Onderwijs, Cultuur en Wetenschappen, voor zover voor die opleidingen eindtermen als bedoeld
      in [artikel 7.2.4, eerste lid, van de wet][ref4] zijn vastgesteld in overeenstemming met Onze Minister van
      Volksgezondheid, Welzijn en Sport: 0,8, en

      c. voor de overige opleidingen: 0,4.

      3 De deeltijdfactor, bedoeld in het eerste lid onder DFi2, bedraagt:

      a. voor de opleidingen die zijn opgenomen in het Centraal register en die worden bekostigd door Onze Minister van
      Landbouw, Natuur en Voedselkwaliteit: 0,4,

      b. voor de opleidingen die zijn opgenomen in het Centraal register en die worden bekostigd door Onze Minister van
      Onderwijs, Cultuur en Wetenschap: 0,3.

      4 Jaarlijks voor 1 september voorafgaand aan het kalenderjaar waarvoor de rijksbijdrage wordt vastgesteld, wordt
      bij ministeriële regeling de prijsfactor, bedoeld in het eerste lid onder Pi, vastgesteld die wordt toegekend
      aan een opleiding die in dat kalenderjaar voor het eerst in het Centraal register wordt opgenomen. Wijzigingen
      van prijsfactoren van reeds in het Centraal register opgenomen opleidingen worden eveneens jaarlijks voor 1
      september voorafgaand aan het kalenderjaar waarvoor de rijksbijdrage wordt vastgesteld, bij ministeriële regeling
      vastgesteld.

      5 Deelnemers aan de beroepsbegeleidende leerweg worden in de berekening, bedoeld in het eerste lid, niet geteld
      onder DDi2, voor zover zij in die berekening voor de desbetreffende instelling voor een van de drie voorafgaande
      kalenderjaren al onder DDi2 werden geteld.

      6 De correctiefactor wordt berekend volgens de formule:







                    [(DDi1.1 x DFi1.2) + VDi] + [(DDi1.2 x DFi1.2) + VDi2]




                    ———————————————————————




                    2 x [(DDi1.1 x DFi1.2) + VDi]






      In deze formule wordt verstaan onder:

        - DDi1.1: het aantal deeltijds deelnemers dat op 1 oktober van het tweede kalenderjaar voorafgaand aan het
      desbetreffende jaar aan de desbetreffende instelling is ingeschreven en daadwerkelijk de desbetreffende opleidingen
      volgt,
        - VDi: het aantal voltijds deelnemers dat op 1 oktober van het tweede kalenderjaar voorafgaand aan het
      desbetreffende jaar aan de desbetreffende instelling is ingeschreven en daadwerkelijk de desbetreffende opleidingen
      volgt,
        - DDi1.2: het aantal deeltijds deelnemers dat op 1 februari van het kalenderjaar voorafgaand aan het desbetreffende
      jaar aan de desbetreffende instelling is ingeschreven en daadwerkelijk de desbetreffende opleidingen volgt,
        - VDi2: het aantal voltijds deelnemers dat op 1 februari van het kalenderjaar voorafgaand aan het desbetreffende
      jaar aan de desbetreffende instelling is ingeschreven en daadwerkelijk de desbetreffende opleidingen volgt,
        - DFi1.2: de op grond van het zevende lid toegekende deeltijdfactor.

      7 De deeltijdfactor, bedoeld in het zesde lid, onder DFi1.2, bedraagt voor:

      a. een instelling die opleidingen verzorgt die zijn opgenomen in het Centraal register en die worden bekostigd door
      Onze minister van Landbouw, Natuur en Voedselkwaliteit: 0,5;

      b. een instelling die opleidingen verzorgt die zijn opgenomen in het Centraal register en die worden bekostigd door
      Onze minister van Onderwijs, Cultuur en Wetenschap: 0,35.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.8
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.8
      [ref3]: https://wetten.overheid.nl/BWBR0010646#Artikel2.2.1
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.4
