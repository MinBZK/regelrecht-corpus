      onder b, voorgeschreven gegevens. De vervangende gegevens komen zoveel mogelijk overeen met de voorgeschreven
      gegevens.

      3 Bij ministeriële regeling wordt vastgesteld:

      a.

      b. in afwijking van [artikel 2.2.3, eerste lid, onder Pi respectievelijk DFi][ref2]: welke prijsfactor
      respectievelijk welke deeltijdfactor:

      1°.

      2°.

      3°.

      4°.

      5°.

      6°. tot uiterlijk 1 januari 2002 voor deeltijdse deelnemers aan 4-jarige opleidingen middelbaar beroepsonderwijs,

      wordt toegekend aan opleidingen waarvan de opleidingen zoals vermeld in het overzicht, bedoeld in
      [artikel 12.3.17, eerste lid, van de wet][ref3], een voortzetting vormen.

      c. in afwijking van [artikel 2.2.3, eerste lid, onder Pi respectievelijk DFi][ref4]: welke prijsfactor
      respectievelijk welke deeltijdfactor:

      1°.

      2°.

      3°.

      4°.

      5°.

      6°. tot uiterlijk 1 januari 2002 voor deeltijdse deelnemers aan 4-jarige opleidingen middelbaar beroepsonderwijs,

      wordt toegekend aan bekostigde opleidingen die niet vallen onder a of b en die in het tweede kalenderjaar
      voorafgaand aan de eerste toepassing van [artikel 2.2.3][ref5] werden verzorgd aan de instellingen, en

      d. welk niveau wordt toegekend aan een opleiding als bedoeld onder b of c met het oog op de toepassing van
      [artikel 2.2.4][ref6], en voor zover van toepassing, welk niveau wordt toegekend aan een opleiding als bedoeld
      onder b of c, met het oog op de toepassing van [artikel 2.2.5][ref7].

      4 Onder diploma's beroepsonderwijs als bedoeld in [artikel 2.1.2, onder d][ref8], worden mede
      begrepen, bij ministeriële regeling aangewezen diploma's en certificaten van opleidingen als bedoeld in
      [artikel 12.3.2 van de wet][ref9].


