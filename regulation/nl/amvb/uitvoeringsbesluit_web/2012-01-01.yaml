  - number: 2.5.2
    text: |-
      1 Het bevoegd gezag van een instelling heeft, naast de aanspraak op een aandeel van de rijksbijdrage voor de
      exploitatiekosten voor het beroepsonderwijs, bedoeld in [artikel 2.2.2, eerste lid][ref1], in geval van een
      agrarisch opleidingscentrum vermeerderd met de rijksbijdrage zoals vastgesteld op grond van [artikel 2.3.2][ref2],
      per kalenderjaar aanspraak op een vergoeding voor uitkeringen.

      2 De vergoeding, bedoeld in het eerste lid, is het bedrag berekend volgens de volgende formule:

      (PI + EduI) / (PL + EduL) x W

      In deze formule wordt verstaan onder:

      PI: de rijksbijdrage voor de exploitatiekosten, zoals omschreven in het eerste lid, van de desbetreffende
      instelling voor het kalenderjaar voorafgaande aan het desbetreffende kalenderjaar;

      EduI: de hoogte van het bedrag dat met de overeenkomst of overeenkomsten educatie van de desbetreffende instelling
      in het kalenderjaar voorafgaand aan het desbetreffende kalenderjaar is gemoeid, zoals blijkt uit de jaarrekening
      van de instelling;

      PL: de rijksbijdrage voor de exploitatiekosten, zoals omschreven in het eerste lid, van de instellingen voor het
      kalenderjaar voorafgaande aan het desbetreffende kalenderjaar;

      EduL: de hoogte van het bedrag dat met de overeenkomsten educatie van de instellingen in het kalenderjaar
      voorafgaand aan het desbetreffende kalenderjaar is gemoeid, zoals blijkt uit de jaarrekeningen van de instellingen;

      W: het totaal van de wachtgeldbudgetten voor de instellingen zoals opgenomen in de begrotingen van de uitgaven van
      het Ministerie van Onderwijs, Cultuur en Wetenschap en het Ministerie van Economische Zaken, Landbouw en Innovatie
      van het desbetreffende kalenderjaar.

      3 De uitkomst van de berekening, bedoeld in het tweede lid, wordt rekenkundig afgerond op twee decimalen.

      4 Onze Minister kan voorzover het betreft educatie, in afwachting van de indiening van de jaarrekeningen door de
      instellingen, een voorlopig bedrag toevoegen aan de rijksbijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel2.3.2
