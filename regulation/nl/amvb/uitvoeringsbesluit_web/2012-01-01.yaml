  - number: 6.1.5
    text: |-
      Voor de toepassing van [artikel 4b.2.3, eerste lid][ref1], in het studiejaar 2007–2008 wordt in onderdeel a voor
      «1 maart de voorlopige gegevens omtrent de inschrijvingen op 1 oktober van het desbetreffende studiejaar» gelezen:
      8 maart de voorlopige gegevens omtrent de inschrijvingen op 1 oktober van het desbetreffende studiejaar, en op 8
      maart de voorlopige gegevens omtrent de inschrijvingen op 1 februari van het desbetreffende studiejaar.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4b.2.3
