  - number: '7.1'
    text: |-
      1 Dit besluit treedt, met uitzondering van de [hoofdstukken 2][ref1], [3][ref2], [4][ref3], [5][ref4] voor zover
      het betreft de [artikelen 5.2.1][ref5], [5.2.2][ref6] en [5.2.4][ref7], en 6, in werking met ingang van de dag na
      de datum van uitgifte van het Staatsblad waarin dit besluit wordt geplaatst.

      2 De [hoofdstukken 2][ref8], [3][ref9], [4][ref10] en [6 van dit besluit][ref11] treden in werking op een
      bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende hoofdstukken, paragrafen en artikelen
      verschillend kan worden vastgesteld. Laatstbedoeld besluit wordt niet genomen dan nadat vier weken zijn verstreken
      nadat het onderhavige besluit is overgelegd aan de beide Kamers der Staten-Generaal en gedurende die termijn
      niet door of namens een van beide kamers de wens wordt te kennen gegeven dat het in de [hoofdstukken 2][ref12]
      en [6, paragraaf 1,][ref13] dan wel de [hoofdstukken 3][ref14] en [6, paragraaf 2][ref15], dan wel de
      [hoofdstukken 4][ref16] en [6, paragraaf 3][ref17], van dit besluit geregelde onderwerp bij de wet wordt geregeld.
      De bepalingen vinden voor het eerst toepassing ten aanzien van de rijksbijdragen voor het jaar 2000.

      2 De [artikelen 5.2.1][ref18], [5.2.2][ref19] en [5.2.4][ref20] van dit besluit treden in werking 12 maanden na de
      datum van uitgifte van het Staatsblad waarin het wordt geplaatst, met dien verstande dat de formulieren ten aanzien
      van de gegevens inzake uitgereikte diploma's niet eerder van toepassing zijn dan over het kalenderjaar 2001 en de
      overige formulieren niet eerder dan over het studiejaar 2001–2002.


