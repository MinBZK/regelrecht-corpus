      1 De [paragrafen 1 tot en met 3][ref1] zijn van toepassing op de kenniscentra beroepsonderwijs bedrijfsleven,
      bedoeld in [artikel 1.1.1, onderdeel b2, van de wet][ref2], met uitzondering van het kenniscentrum beroepsonderwijs
      bedrijfsleven op het gebied van de landbouw en de natuurlijke omgeving voor zover niet anders is bepaald.

      2 [ Paragraaf 4][ref3] is van toepassing op het kenniscentrum beroepsonderwijs bedrijfsleven op het gebied van de
      landbouw en de natuurlijke omgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1.1.1
      [ref3]: https://wetten.overheid.nl/BWBR0010646#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0010646/2012-01-01#Artikel4.1.1
