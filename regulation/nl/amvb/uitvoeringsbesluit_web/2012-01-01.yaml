  - number: 6.1.4
    text: |-
      1 Indien het verschil van de berekening, bedoeld in [artikel 2.2.2, eerste lid][ref1], met toepassing van
      [artikel 2.2.3][ref2] zoals dat met ingang van 1 oktober 2006 is komen te luiden, en de overeenkomstige berekening
      met toepassing van [artikel 2.2.3][ref3] zoals dat luidde op 30 september 2006, voor het kalenderjaar 2008 negatief
      is en meer bedraagt dan twee procent van de laatstgenoemde berekening, wordt dit meerdere in aanvulling gebracht op
      de rijksbijdrage, bedoeld in [artikel 2.2.2, eerste lid][ref4], voor dat kalenderjaar.

      2 Het totaal van de aanvullingen op grond van het eerste lid wordt in mindering gebracht op de rijksbijdrage,
      bedoeld in [artikel 2.2.2, eerste lid][ref5], voor het kalenderjaar 2008, voor de instellingen waarvoor het
      verschil van de berekening, bedoeld in [artikel 2.2.2, eerste lid][ref6], met toepassing van [artikel 2.2.3][ref7]
      zoals dat met ingang van 1 oktober 2006 is komen te luiden, en de overeenkomstige berekening met toepassing van
      [artikel 2.2.3][ref8] zoals dat luidde op 30 september 2006, voor dat kalenderjaar positief is, naar rato van die
      toename van de rijksbijdrage voor de desbetreffende instelling.

      3 Indien een instelling voor het kalenderjaar 2008 een aanvulling ontvangt op grond van het eerste lid, ontvangt
      die instelling voor de kalenderjaren 2009 en 2010 aanvullingen ten bedrage van tweederde respectievelijk eenderde
      van die eerste aanvulling.

      4 Indien aan een instelling voor het kalenderjaar 2008 een bedrag in mindering wordt gebracht op grond van het
      tweede lid, wordt aan die instelling voor de kalenderjaren 2009 en 2010 tweederde respectievelijk eenderde van die
      eerste vermindering in mindering gebracht.


