  - number: 2.1.3
    text: |-
      Binnen het raam van de door de begrotingswetgever voor het desbetreffende kalenderjaar beschikbaar gestelde
      middelen, stelt Onze Minister jaarlijks de omvang vast van de landelijk beschikbare budgetten voor de
      exploitatiekosten en voor de huisvestingskosten voor zowel het beroepsonderwijs als het voorbereidend
      beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0010646/2012-01-01#Artikel2.1.3
  - number: 2.2.1
    text: |-
      1 Onze Minister stelt jaarlijks de omvang vast van het landelijk beschikbare budget ten behoeve van voorbereidende
      en ondersteunende activiteiten als bedoeld in [artikel 7.2.2, vierde lid, van de wet][ref1] en van het landelijke
      beschikbare budget ten behoeve van de toepassing van [artikel 2.2.4, tweede lid][ref2], dat in mindering wordt
      gebracht op het landelijk beschikbare budget voor de exploitatiekosten voor het beroepsonderwijs.

      2 Het na toepassing van het eerste lid resterende deel van het landelijk beschikbare budget voor de
      exploitatiekosten voor het beroepsonderwijs voor een kalenderjaar wordt verdeeld als volgt:

      a. 80% wordt toegerekend aan het landelijk deel ten behoeve van de maatstaf ingeschreven deelnemers, en

      b. 20% wordt toegerekend aan het landelijk deel ten behoeve van de maatstaf diploma's beroepsonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel2.2.4
    url: https://wetten.overheid.nl/BWBR0010646/2012-01-01#Artikel2.2.1
