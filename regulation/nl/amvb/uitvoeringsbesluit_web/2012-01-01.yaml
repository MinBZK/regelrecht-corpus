  - number: 2.3.2
    text: |-
      1 Onze Minister berekent de rijksbijdrage voor een agrarisch opleidingscentrum voor de exploitatiekosten voor
      het voorbereidend beroepsonderwijs dat ten behoeve van deze berekening is onderverdeeld in beroepsonderwijs en
      leerwegondersteunend onderwijs, volgens de formule:

      {Liv x PLiv} + {Lil x PLil} + (VVi)

      In deze formule wordt verstaan onder:

      Liv: het aantal leerlingen dat op 1 oktober van het kalenderjaar voorafgaand aan het desbetreffende jaar aan het
      desbetreffende agrarisch opleidingscentrum staat ingeschreven voor het beroepsonderwijs,

      Lil: het aantal leerlingen dat op 1 oktober van het kalenderjaar voorafgaand aan het desbetreffende jaar aan het
      desbetreffende agrarisch opleidingscentrum staat ingeschreven voor het leerwegondersteunend onderwijs,

      PLiv: de op grond van het tweede lid voor het desbetreffende kalenderjaar toegekende prijs per leerling
      beroepsonderwijs,

      PLil: de op grond van het tweede lid voor het desbetreffende kalenderjaar toegekende prijs per leerling
      leerwegondersteunend onderwijs, en

      VVi: de bij ministeriële regeling vastgestelde vaste voet per instelling.

      2 Jaarlijks voor 1 september voorafgaand aan het kalenderjaar waarvoor de rijksbijdrage wordt vastgesteld, worden
      bij ministeriële regeling de prijzen per leerling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0010646/2012-01-01#Artikel2.3.2
  - number: 2.4.1
    text: |-
      1 Onze Minister verdeelt het op grond van [artikel 2.1.3][ref1] voor een kalenderjaar vastgestelde landelijk
      beschikbare budget voor de huisvestingskosten voor het beroepsonderwijs over de instellingen naar rato van de voor
      dat kalenderjaar op grond van [artikel 2.2.2, eerste lid][ref2], berekende rijksbijdrage voor exploitatiekosten per
      instelling. De uitkomst van de berekening wordt rekenkundig afgerond op hele euro’s

      2 De rijksbijdrage voor de huisvestingskosten van een school voor voortgezet onderwijs als bedoeld in
      [artikel 2.6, lid 1a, van de wet][ref3] wordt berekend door het aantal leerlingen dat op 1 oktober van het tweede
      kalenderjaar voorafgaand aan het desbetreffende kalenderjaar aan de school was ingeschreven te vermenigvuldigen met
      een jaarlijks bij ministeriële regeling te bepalen bedrag.

      3 Het tweede lid is van overeenkomstige toepassing op het voorbereidend beroepsonderwijs.

      4 De op grond van het eerste lid berekende rijksbijdrage kan worden aangepast in verband met uit de rijksbegroting
      voortvloeiende maatregelen.

      5 [Artikel 2.2.6][ref4] is van overeenkomstige toepassing.


