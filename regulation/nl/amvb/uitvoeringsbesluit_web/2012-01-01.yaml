  - number: 6.3.2
    text: |-
      1 Tot een bij koninklijk besluit te bepalen datum zijn de [artikelen 4.2.1 tot en met 4.2.5][ref1], [4.2.7][ref2]
      en [4.2.8][ref3] niet van toepassing.

      2 Onze Minister berekent de rijksbijdrage voor de exploitatiekosten voor het kenniscentrum tot de in het eerste lid
      bedoelde datum op de in het derde lid bepaalde wijze. De uitkomst van de berekening wordt rekenkundig afgerond op
      twee decimalen.

      3 Voor elk kenniscentrum wordt het aandeel in het landelijk beschikbare budget voor de exploitatiekosten van
      respectievelijk het jaar 2005 en het jaar 2006, uitgedrukt in een percentage van dat landelijk beschikbare
      budget van genoemde jaren. Vervolgens worden voor elk kenniscentrum de percentages van de jaren, bedoeld in de
      eerste volzin, bij elkaar opgeteld en de uitkomst gedeeld door twee. De uitkomst van de berekening, bedoeld in de
      vorige volzin, is bepalend voor het vaststellen van het gedeelte van het landelijk beschikbare budget waarop elk
      kenniscentrum voor de rijksbijdrage aanspraak maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel4.2.7
      [ref3]: https://wetten.overheid.nl/BWBR0010646#Artikel4.2.8
