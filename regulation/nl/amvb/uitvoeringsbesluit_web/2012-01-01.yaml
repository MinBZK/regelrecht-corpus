  - number: 2.2.2
    text: |-
      1 Onze Minister berekent de rijksbijdrage voor een instelling voor de exploitatiekosten voor het beroepsonderwijs
      voor een kalenderjaar door bij elkaar op te tellen:

      a. het rijksbijdragedeel op grond van de maatstaf ingeschreven deelnemers,

      b. het rijksbijdragedeel op grond van de maatstaf diploma’s beroepsonderwijs vermeerderd met het rijksbijdragedeel
      op grond van de diploma’s, bedoeld in [artikel 2.2.4, tweede lid][ref1], en

      c. het rijksbijdragedeel ten behoeve van voorbereidende en ondersteunende activiteiten,

      zoals deze delen voor het desbetreffende jaar voor de instelling worden berekend op grond van
      [artikel 2.2.3][ref2], [artikel 2.2.4][ref3] respectievelijk [artikel 2.2.5][ref4]. De uitkomst van elke berekening
      wordt rekenkundig afgerond op hele euro’s.

      2 De op grond van het eerste lid berekende rijksbijdrage wordt vermeerderd met het rijksbijdragedeel voor
      gehandicapte deelnemers, zoals dat wordt berekend op grond van [artikel 2.6a.1][ref5].

      3 De op grond van het eerste en tweede lid berekende rijksbijdrage kan worden aangepast in verband met uit de
      rijksbegroting voortvloeiende maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2.2.4
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel2.2.3
      [ref3]: https://wetten.overheid.nl/BWBR0010646#Artikel2.2.4
      [ref4]: https://wetten.overheid.nl/BWBR0010646#Artikel2.2.5
      [ref5]: https://wetten.overheid.nl/BWBR0010646#Artikel2.6a.1
