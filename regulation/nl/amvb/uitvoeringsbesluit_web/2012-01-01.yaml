  - number: 6.3.3
    text: |-
      Onze Minister stelt tot de datum, bedoeld [artikel 6.3.2, eerste lid][ref1], het bedrag voor huisvestingskosten,
      bedoeld in [artikel 4.3.1, eerste lid][ref2], voor elk kenniscentrum vast op basis van het percentage dat op grond
      van [artikel 6.3.2, derde lid][ref3], voor dat kenniscentrum is vastgesteld. De uitkomst van de berekening wordt
      rekenkundig afgerond op twee decimalen.


