  - number: 2.1.2
    text: |-
      In dit hoofdstuk wordt verstaan onder:

      a. opleiding: een beroepsopleiding die is opgenomen in het Centraal register en die wordt bekostigd ingevolge een
      besluit van Onze Minister op grond van [artikel 2.1.1, eerste lid, van de wet][ref1];

      b. voltijds deelnemer: een deelnemer die blijkens een overeenkomst als bedoeld in [artikel 8.1.3 van de wet][ref2]
      een voltijdse opleiding volgt als bedoeld in [artikel 1.1.1, onderdeel i1, van de wet][ref3];

      c. deeltijds deelnemer: een deelnemer aan een opleiding, niet zijnde een voltijds deelnemer;

      d. diploma beroepsonderwijs: een door een examencommissie uitgereikt bewijsstuk dat met goed gevolg is afgelegd
      het examen van een onder a bedoelde opleiding, alsmede van een opleiding die niet langer is opgenomen in het in
      [artikel 2.1.1 van de wet][ref4] bedoelde overzicht,

      e. agrarisch opleidingscentrum: een agrarisch opleidingscentrum als bedoeld in
      [artikel 1.1.1, onderdeel b, onder 4° van de wet][ref5];

      f. voorbereidend beroepsonderwijs: voorbereidend beroepsonderwijs dat wordt verzorgd aan een agrarisch
      opleidingscentrum;

      g. leerling: een leerling die voor het volgen van voorbereidend beroepsonderwijs is ingeschreven aan een agrarisch
      opleidingscentrum.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2.1.1
