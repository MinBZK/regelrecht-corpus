  - number: 2.1.1
    text: |-
      1 De [paragrafen 1][ref1], [2][ref2], [4][ref3], [5][ref4], [6][ref5] en [6a][ref6] zijn van toepassing op
      instellingen als bedoeld in [artikel 1.1.1, onderdeel b, onder 1° tot en met 3°, van de wet][ref7].

      2 [ Paragraaf 1][ref8], [paragraaf 2][ref9] en [paragraaf 4][ref10] zijn van overeenkomstige toepassing en
      de [paragrafen 5][ref11], [6][ref12] en [6a][ref13] zijn van toepassing ten aanzien van het beroepsonderwijs
      binnen agrarische opleidingscentra waarvoor de rijksbijdrage wordt vastgesteld door Onze Minister van Landbouw,
      Natuurbeheer en Visserij.

      3 [ Paragraaf 3][ref14] onderscheidenlijk de [paragrafen 4][ref15] en [5][ref16] heeft betrekking
      onderscheidenlijk hebben mede betrekking op het voorbereidend beroepsonderwijs dat wordt verzorgd aan agrarische
      opleidingscentra.

      4 De [paragrafen 5][ref17], [6][ref18] en [6a][ref19] hebben mede betrekking op de in
      [artikel 12.3.8 van de wet][ref20] genoemde instituten, alsmede op de in [artikel 12.3.9 van de wet][ref21]
      genoemde hogescholen.


