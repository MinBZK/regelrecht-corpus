      [artikelen 1.1.1, onderdeel b][ref1], en [12.3.8 van de wet][ref2] of van een kenniscentrum geldt voor
      de functie van voorzitter van het college van bestuur en de centrale directie dat daaraan ten hoogste een
      salarisschaal is verbonden waarvan het hoogste bedrag overeenkomt met het maximum salarisbedrag van schaal 18 van
      [bijlage 1A van het Kaderbesluit rechtspositie BVE][ref3], zoals dat luidde op 30 juni 2003.

      2 Het in het eerste lid bedoelde maximum kan worden bijgesteld aan de hand van de algemene salarisontwikkeling die
      voor het personeel van instellingen onderscheidenlijk kenniscentra wordt overeengekomen.


