  - number: 2.2.4
    text: |-
      1 Onze Minister berekent het rijksbijdragedeel op grond van de maatstaf diploma's beroepsonderwijs volgens de
      formule:

      DI.1 + 2DI.2 + 4DI.3

      ----------------------------------- x LMD

      LD.1 + 2LD.2 + 4LD.3

      In deze formule wordt verstaan onder:

      DI.1: het aantal diploma's beroepsonderwijs dat aan die instelling is behaald in het tweede kalenderjaar voorafgaand
      aan het desbetreffende jaar bij opleidingen als bedoeld in [artikel 7.2.2, eerste lid, onder a, van de wet][ref1],

      DI.2: het aantal diploma's beroepsonderwijs dat aan die instelling is behaald in het tweede kalenderjaar voorafgaand
      aan het desbetreffende jaar bij opleidingen als bedoeld in [artikel 7.2.2, eerste lid, onder b, van de wet][ref2],

      DI.3: het aantal diploma's beroepsonderwijs dat aan die instelling is behaald in het
      tweede kalenderjaar voorafgaand aan het desbetreffende jaar bij opleidingen als bedoeld in
      [artikel 7.2.2, eerste lid, onder c tot en met f, van de wet][ref3],

      LD.1: het aantal diploma's beroepsonderwijs dat landelijk is behaald in het tweede kalenderjaar voorafgaand aan het
      desbetreffende jaar bij opleidingen als bedoeld in [artikel 7.2.2, eerste lid, onder a, van de wet][ref4],

      LD.2: het aantal diploma's beroepsonderwijs dat landelijk is behaald in het tweede kalenderjaar voorafgaand aan het
      desbetreffende jaar bij opleidingen als bedoeld in [artikel 7.2.2, eerste lid, onder b, van de wet][ref5],

      LD.3: het aantal diploma's beroepsonderwijs dat landelijk is behaald in het tweede
      kalenderjaar voorafgaand aan het desbetreffende jaar bij opleidingen als bedoeld in
      [artikel 7.2.2, eerste lid, onder c tot en met f, van de wet][ref6], en

      LMD: het landelijk deel ten behoeve van de maatstaf diploma's beroepsonderwijs, zoals dat voor het desbetreffende
      jaar is vastgesteld op grond van [artikel 2.2.1, tweede lid, onder b][ref7].

      2 Bij ministeriële regeling kan worden bepaald dat voor diploma’s van in die ministeriële regeling
      aangewezen opleidingen, in de kalenderjaren 2010 en 2011 verkregen door examendeelnemers, bedoeld in
      [artikel 2.2.2, tweede lid, onderdeel b, van de wet][ref8], in afwijking van het eerste lid een vast bedrag per
      diploma wordt toegekend.


