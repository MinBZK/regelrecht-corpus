                    1




                    51 t/m 60


                    0,95




                    61 t/m 70


                    0,90




                    71 t/m 80


                    0,85




                    81 t/m 90


                    0,80




                    91 t/m 100


                    0,75




                    101 t/m 110


                    0,70




                    111 en hoger


                    0,65






      3 Elk kenniscentrum heeft aanspraak op het gedeelte van het landelijk beschikbare budget, bedoeld in het eerste
      lid, naar rato van het aantal punten van elk kenniscentrum nadat daarop de correctie, bedoeld in het tweede lid,
      is toegepast.
    url: https://wetten.overheid.nl/BWBR0010646/2012-01-01#Artikel4.2.4
  - number: 4.2.5
    text: |-
      1 Onze Minister berekent de rijksbijdrage voor de exploitatiekosten voor het kenniscentrum voor zover het betreft
      het gedeelte van het landelijk beschikbare budget dat is toegerekend aan de maatstaf normatieve bpv-plaatsen, op de
      wijze als bepaald in het tweede tot en met vijfde lid.

      2 Het aantal normatieve bpv-plaatsen voor elk kenniscentrum wordt bepaald door het aantal deelnemers bij
      opleidingen die behoren bij het desbetreffende kenniscentrum voorzover die opleidingen zijn vermeld in het Centraal
      register, bij elkaar op te tellen zoals hierna vermeld:

      a. 100% van het aantal deelnemers aan de beroepsbegeleidende leerweg op 1 oktober van het jaar voorafgaand aan het
      jaar waarin de rijksbijdrage wordt vastgesteld,

      b. 35% van het aantal voltijds deelnemers aan de beroepsopleidende leerweg op 1 oktober van het jaar voorafgaand
      aan het jaar waarin de rijksbijdrage wordt vastgesteld, en

      c. 10% van het aantal deeltijds deelnemers aan de beroepsopleidende leerweg op 1 oktober van het jaar voorafgaand
      aan het jaar waarin de rijksbijdrage wordt vastgesteld.

      3 De optelling volgens het tweede lid leidt tot een aantal normatieve bpv-plaatsen voor een kenniscentrum, dat
      rekenkundig wordt afgerond op een geheel getal. Op het aantal normatieve bpv-plaatsen, bedoeld in het tweede
      lid, wordt een correctie voor schaalvoordelen toegepast door dat aantal te vermenigvuldigen met een factor, zoals
      aangegeven in de navolgende tabel:








