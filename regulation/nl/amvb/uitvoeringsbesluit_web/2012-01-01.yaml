  - number: 2.2.5
    text: |-
      Onze Minister berekent het rijksbijdragedeel voor voorbereidende en ondersteunende activiteiten als bedoeld in
      [artikel 7.2.2, vierde lid, van de wet][ref1], voor een kalenderjaar door het landelijk beschikbare budget ten
      behoeve van voorbereidende en ondersteunende activiteiten, zoals dat voor dat kalenderjaar is vastgesteld op grond
      van [artikel 2.2.1, eerste lid][ref2], over de instellingen te verdelen naar rato van het aantal deelnemers per
      instelling, voor zover deze deelnemers voldoen aan de volgende voorwaarden:

      a. zij waren op 1 oktober van het tweede kalenderjaar voorafgaand aan het desbetreffende
      jaar ingeschreven aan de desbetreffende instelling voor een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onder a of b, van de wet][ref3], en waren tevens

      b. niet in het bezit van:

      1°. een diploma lager beroepsonderwijs of voorbereidend beroepsonderwijs, tenzij dat diploma is verkregen op grond
      van een eindexamen waarbij een of meer vakken op A-niveau of vier of meer vakken op B-niveau zijn geëxamineerd,

      2°. een diploma middelbaar algemeen voortgezet onderwijs,

      3°. een bewijs dat de eerste drie leerjaren van een school voor hoger algemeen voortgezet onderwijs of van een
      school voor voorbereidend wetenschappelijk onderwijs met gunstig gevolg zijn doorlopen, of

      4°. een diploma beroepsonderwijs van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onder b tot en met f, van de wet][ref4].


