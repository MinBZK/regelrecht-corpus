  - number: 6.3.1
    text: |-
      1 Bij ministeriële regeling wordt voorgeschreven, welke gegevens Onze Minister in afwijking van de
      [artikelen 4.2.4 tot en met 4.2.8][ref1] hanteert voor zover nog niet kan worden beschikt over de in die artikelen
      voorgeschreven gegevens. De vervangende gegevens komen zoveel mogelijk overeen met de voorgeschreven gegevens.

      2 Tot het tijdstip van inwerkingtreding van [bijlage 3 bij dit besluit][ref2] wordt in
      [artikel 4.2.8, eerste lid, onder a][ref3], in plaats van «[bijlage 3 bij dit besluit][ref4]» gelezen: bijlage 3
      van de Regeling Informatievoorziening BVE.


