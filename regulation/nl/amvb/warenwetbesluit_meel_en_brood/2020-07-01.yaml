---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: warenwetbesluit_meel_en_brood
regulatory_layer: AMVB
publication_date: '2020-01-24'
valid_from: '2020-07-01'
bwb_id: BWBR0009669
url: https://wetten.overheid.nl/BWBR0009669/2020-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 18 september 1997, nr. GZB/
    VVB/975283, gedaan in overeenstemming met Onze Ministers van Economische Zaken en van Landbouw, Natuurbeheer en
    Visserij;

    Gelet op artikel II, eerste lid, van de Wijzigingswet 1988 Warenwet, alsmede op artikel 4, eerste lid, onder a,
    artikel 8, onder b en c, artikel 12, en artikel 14, van de Warenwet;

    De Raad van State gehoord (advies van 18 november 1997, no. W13.97.0624);

    Gezien het nader rapport van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 28 mei 1998 met
    nummer GZB/VVB/981807, uitgebracht in overeenstemming met Onze Ministers van Economische Zaken en van Landbouw,
    Natuurbeheer en Visserij;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel1
  - number: 1.a
    text: |-
      *meel*: de grotendeels poedervormige waar, verkregen door verkleinen of pletten van de vruchten van graan of de
      zaden van boekweit, waaraan kiemen en delen van de schil geheel of gedeeltelijk kunnen zijn onttrokken, en waarvan,
      voor zover het gerst, haver, rijst, wilde rijst of boekweit betreft, de doppen verwijderd zijn;
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel1
  - number: 1.b
    text: '*bloem*: meel, waarin kiemen en delen van de schil niet met het blote oog waarneembaar zijn;'
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel1
  - number: 1.c
    text: |-
      *brood:* de gebakken eetwaar, met als kenmerkende bestanddelen: - water of melk;
        - rijsmiddel, met dien verstande dat dit niet verplicht is voor roggebrood;
        - al dan niet verkleinde of geplette vruchten van graan, glutenvrije graanbestanddelen of zaden van boekweit;
        - zout;
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel1
  - number: 1.d
    text: '*anti-trypsinefactor*: actief bestanddeel van een waar dat de opname van trypsine vanuit de darm verhindert;'
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel1
  - number: 1.e
    text: '*droge stof*: de materie die achterblijft na droging van de waar;'
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel1
  - number: 1.f
    text: '*%*: massaprocent;'
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel1
  - number: 1.g
    text: |-
      *decoratie:* aan de buitenkant van het brood voor het bakken aangebrachte bestanddelen, zoals sesamzaad en
      maanzaad;
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel1
  - number: 1.h
    text: |-
      *(zuur)desem:* een product dat ontstaat na fermentatie van een mengsel op basis van graan, water en van nature
      aanwezige micro-organismen, waarbij de micro-organismen in een actieve toestand aanwezig zijn of reactiveerbaar
      zijn.
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel1
  - number: '2'
    text: |-
      Het is verboden de bij of krachtens dit besluit bedoelde waren te bereiden, te verhandelen of te gebruiken voor de
      bereiding van brood anders dan met inachtneming van de bij of krachtens dit besluit gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel2
  - number: '3.1'
    text: |-
      Brood heeft een vochtgehalte van ten minste 20% en een gehalte aan zout van ten hoogste 1,8%, berekend op de droge
      stof.
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel3
  - number: '3.2'
    text: |-
      De zoutnorm, bedoeld in het eerste lid, is niet van toepassing op brood waaraan zoutbevattende ingrediënten zijn
      toegevoegd en dat de consument niet ervaart als bestemd voor dagelijks gebruik.
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel3
  - number: '4.1'
    text: |-
      Bij de bereiding van brood, en in meel, worden geen andere enzymen gebruikt dan koolhydraat- en eiwitsplitsende
      enzymen, of enzymen die ter zake door Onze Minister bij ministeriële regeling zijn toegelaten.
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel4
  - number: '4.2'
    text: |-
      Onze Minister stelt bij ministeriële regeling nadere regels vast inzake de bij of krachtens het eerste lid
      toegelaten enzymen.
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel4
  - number: '5'
    text: |-
      De anti-trypsinefactor van brood dat bereid is met gebruikmaking van soja-producten, bedraagt ten hoogste 5 mg/
      g eiwit.
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel5
  - number: '6'
    text: 'In meel, bloem, andere vormen van graan en zaden van boekweit zijn niet aanwezig:'
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel6
  - number: 6.a
    text: brandschimmelsporen (sporen van het geslacht Tilletia (Tul.));
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel6
  - number: 6.b
    text: bestanddelen van moederkoren (Claviceps purpurea (Tul.)); en
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel6
  - number: 6.c
    text: onkruidzaden.
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel6
  - number: 6a.1
    text: |-
      De hoeveelheid droge stof van brood met of zonder decoratie met een gewicht tussen 350 gram en 1.000 gram ligt
      tussen de 240 en 265 gram, tussen de 360 en 400 gram of tussen de 480 en 530 gram.
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel6a
  - number: 6a.2
    text: |-
      Het eerste lid is niet van toepassing op brood met bijzondere kenmerkende bestanddelen in de kruim, roggebrood,
      roggetarwebrood, stokbrood, brood met een zeer laag glutengehalte en glutenvrij brood.
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel6a
  - number: '7.1'
    text: De aanduiding *meel* mag uitsluitend worden gebezigd voor meel.
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel7
  - number: '7.2'
    text: De aanduiding *bloem* mag uitsluitend worden gebezigd voor bloem.
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel7
  - number: '7.3'
    text: De aanduiding brood mag uitsluitend worden gebezigd voor brood.
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel7
  - number: 7a
    text: |-
      Indien in de aanduiding de naam van één graansoort wordt gebezigd moet het meelbestanddeel voor minimaal 98%
      afkomstig zijn van de betreffende graansoort.
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel7a
  - number: 7b
    text: 'Indien in de aanduiding de naam van twee of meer graansoorten wordt gebezigd moeten deze graansoorten:'
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel7b
  - number: 7b.a
    text: gezamenlijk voor minimaal 98% aanwezig zijn in het meelbestanddeel;
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel7b
  - number: 7b.b
    text: afzonderlijk voor minimaal 5% aanwezig zijn in het meelbestanddeel; en
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel7b
  - number: 7b.c
    text: worden vermeld in de aanduiding, in afnemende volgorde van de hoeveelheid waarin zij in het brood aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel7b
  - number: 7c
    text: 'De aanduiding *meergranen* mag uitsluitend worden gebezigd voor brood:'
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel7c
  - number: 7c.a
    text: waarvan het meelbestanddeel uit minimaal 3 verschillende graansoorten bestaat;
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel7c
  - number: 7c.b
    text: |-
      waarbij de graansoort, waarvan de aanwezige hoeveelheid ervan in het brood het grootst is, maximaal 90% van het
      meelbestanddeel bedraagt; en
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel7c
  - number: 7c.c
    text: |-
      waarbij de hoeveelheid van de afzonderlijke graanbestanddelen, uitgedrukt als percentage in het brood, in de
      ingrediëntenlijst wordt vermeld.
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel7c
  - number: 7d.1
    text: 'De aanduiding *(zuur)desem* mag uitsluitend worden gebezigd indien:'
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel7d
  - number: 7d.1.a
    text: (zuur)desem als enige rijsmiddel is gebruikt; en
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel7d
  - number: 7d.1.b
    text: maximaal 0,2% droge gist of maximaal 0,5% verse gist is toegevoegd aan het meelbestanddeel.
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel7d
  - number: 7d.2
    text: |-
      Indien een brood met vruchten, noten, zaden en pitten (minimaal 30% van het totaalgewicht) wordt aangeduid met
      *(zuur)desem* mag de hoeveelheid droge gist, in afwijking van het eerste lid, onderdeel b, in totaal maximaal 0,5%
      droge gist of maximaal 1,2% verse gist van het meelbestanddeel bedragen.
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel7d
  - number: '8'
    text: |-
      De aanduiding *wit(te)brood* mag uitsluitend en moet worden gebezigd voor brood waarvan bloem het voornaamste
      meelbestanddeel is en waarin zemelen met het blote oog niet waarneembaar zijn.
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel8
  - number: '9'
    text: |-
      De aanduiding *bruinbrood* mag uitsluitend en moet worden gebezigd voor brood waarvan (volkoren)meel, al dan niet
      gemengd met gebroken graankorrels en graanvlokken, het voornaamste meelbestanddeel is en waarin zemelen met het
      blote oog waarneembaar zijn.
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel9
  - number: '10'
    text: |-
      De aanduiding *melkbrood* mag uitsluitend worden gebezigd voor brood waaraan melkbestanddelen in hun natuurlijke
      verhouding zijn toegevoegd, zodat het melkvetgehalte ten minste 1,5% van de droge stof bedraagt.
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel10
  - number: '11'
    text: Het woord krenten mag onderdeel uitmaken van de aanduiding van brood, indien dit ten minste 30% krenten bevat.
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel11
  - number: '12'
    text: Het woord rozijnen mag onderdeel uitmaken van de aanduiding van brood, indien dit ten minste 30% rozijnen bevat.
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel12
  - number: '13'
    text: |-
      Het woord krenten-rozijnen of rozijnen-krenten mag onderdeel uitmaken van de aanduiding van brood, indien dit een
      mengsel van krenten en rozijnen bevat van ten minste 30%.
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel13
  - number: '15.1'
    text: 'Het woord *heel* of het woord *half* mag onderdeel uitmaken van de aanduiding van:'
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel15
  - number: 15.1.a
    text: |-
      roggebrood, uitsluitend voor zover de hoeveelheid droge stof van de aldus aangeduide waar ligt tussen 520 en 560
      gram onderscheidenlijk tussen 260 en 285 gram;
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel15
  - number: 15.1.b
    text: |-
      ander brood dan bedoeld onder a, uitsluitend voor zover de hoeveelheid droge stof van de aldus aangeduide waar ligt
      tussen 480 en 530 gram onderscheidenlijk tussen 240 en 265 gram.
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel15
  - number: '15.2'
    text: |-
      Het woord *midden* of *middengroot* mag onderdeel uitmaken van de aanduiding van brood, anders dan bedoeld onder
      het eerste lid, uitsluitend voor zover de hoeveelheid droge stof van de aldus aangeduide waar ligt tussen de 360
      en 400 gram. Indien het brood is gebakken in een bakblik, dan is de lengtemaat (buitenmaat) van het bakblik kleiner
      dan 27 centimeter.
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel15
  - number: '16'
    text: |-
      Het woord *volkoren* mag uitsluitend en moet onderdeel uitmaken van de aanduiding van een in dit besluit
      bedoelde waar, voor zover in de aldus aangeduide waar de voorkomende zetmeelrijke kern, kiem en zemelen van de
      desbetreffende graansoort(en) in hun natuurlijke verhouding, al dan niet na een bewerking te hebben ondergaan,
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel16
  - number: '18'
    text: |-
      In afwijking van artikel 9, eerste lid, onder e, van Verordening (EU) nr. 1169/2011 van het Europees Parlement en
      de Raad van 25 oktober 2011 betreffende de verstrekking van voedselinformatie aan consumenten (PbEU 2011, L 304)
      hoeft geen vermelding van de netto-hoeveelheid te worden gebezigd bij de verhandeling van brood dat is aangeduid op
      de voet van [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009669#Artikel15
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009669
        artikel: '15'
        paragraaf: '3'
  - number: '19.1'
    text: |-
      Als methoden van onderzoek welke bij uitsluiting beslissend zijn voor de vaststelling of al dan niet is voldaan
      aan de bij dit besluit gestelde regels, worden aangewezen chromatografische en andere scheidingsmethoden,
      organoleptische bepalingsmethoden en detectiemethoden, alsmede de daartoe door een andere lidstaat van de Europese
      Unie aangewezen methoden.
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel19
  - number: '19.2'
    text: Onze Minister kan bij ministeriële regeling nadere regels vaststellen inzake het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel19
  - number: 19a
    text: |-
      Waren die voldoen aan het Warenwetbesluit Meel en brood zoals dat luidde op 30 juni 2020 mogen worden bereid,
      aangeduid, verhandeld of gebruikt voor de bereiding van brood tot 1 juli 2022.
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel19a
  - number: '20'
    text: |-
      De volgende besluiten worden ingetrokken: - het Broodbesluit (Warenwet) 1985; en
        - het Meelbesluit (Warenwet) 1985.
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel20
  - number: '21'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel21
  - number: '22'
    text: 'Dit besluit wordt aangehaald als: Warenwetbesluit Meel en brood.'
    url: https://wetten.overheid.nl/BWBR0009669/2020-07-01#Artikel22
