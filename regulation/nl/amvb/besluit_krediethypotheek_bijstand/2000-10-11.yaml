articles:
  - number: '1'
    text: |-
      Indien bijstand wordt verleend in de vorm van een geldlening onder verband van hypotheek als bedoeld in
      [artikel 20, tweede lid, van de Algemene bijstandswet][ref1] wordt daartoe mede gerekend de eventuele bijstand in
      de kosten genoemd in [artikel 2, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0007336#Artikel2
    url: https://wetten.overheid.nl/BWBR0007336/2000-10-11#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0007336
        artikel: '2'
  - number: '2'
    text: |-
      1 De geldlening, bedoeld in [artikel 1][ref1], is ten hoogste de waarde van de woning in het economisch verkeer
      bij vrije oplevering, verminderd met de daarop drukkende schulden en met het vrij te laten vermogen als bedoeld in
      [artikel 20, derde lid, van de Algemene bijstandswet][ref2].

      2 Ter vaststelling van de waarde van de woning vindt taxatie plaats door een taxateur voor onroerende zaken die
      door burgemeester en wethouders in overeenstemming met de belanghebbende wordt aangewezen of door een gemeentelijk
      taxateur.

      3 De kosten verbonden aan de taxatie, de hypotheekakte en de inschrijving van de hypotheek, alsmede de bijkomende
      kosten, komen ten laste van de belanghebbende. De bijstand voor deze kosten wordt aangemerkt als algemene bijstand,
      tenzij aan de belanghebbende uitsluitend bijzondere bijstand wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0007336#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel20
    url: https://wetten.overheid.nl/BWBR0007336/2000-10-11#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007336
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007333
        artikel: '20'
  - number: '3'
    text: |-
      1 Aan de geldlening worden in elk geval verbonden de voorwaarden genoemd in de [artikelen 4][ref1] en [5][ref2].

      2 De in het eerste lid bedoelde voorwaarden worden tezamen met de gebruikelijke bedingen opgenomen in de
      hypotheekakte.


      [ref1]: https://wetten.overheid.nl/BWBR0007336#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007336#Artikel5
    url: https://wetten.overheid.nl/BWBR0007336/2000-10-11#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007336
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0007336
        artikel: '5'
  - number: '4'
    text: |-
      1 Aflossing van de geldlening vindt plaats gedurende ten hoogste tien jaar.

      2 De aflossing vangt aan op het moment van beëindiging van de bijstandverlening en vindt maandelijks plaats.

      3 Het maandbedrag van de aflossing wordt telkens voor een periode van een jaar vastgesteld.

      4 Bij een inkomen als bedoeld in [artikel 47 van de Algemene bijstandswet][ref1] dat niet uitgaat boven
      de van toepassing zijnde bijstandsnorm, bedoeld in hoofdstuk IV, afdeling 1, van genoemde wet, wordt geen
      aflossing gevergd. Tevens wordt geen aflossing gevergd indien belanghebbende een uitkering op grond van de
      [Wet inkomensvoorziening kunstenaars][ref2] ontvangt.

      5 Indien de omstandigheden daartoe aanleiding geven stellen burgemeester en wethouders, zo nodig tussentijds, het
      maandbedrag van de aflossing op een lager dan wel hoger bedrag vast.

      6 Bij de beoordeling van de omstandigheden als bedoeld in het vijfde lid wordt rekening gehouden met noodzakelijke,
      voor eigen rekening van belanghebbende komende, bijzondere bestaanskosten. Deze worden in mindering gebracht op
      het inkomen.

      7 Indien belanghebbende tijdens de aflossingsperiode van tien jaar schuldig nalatig is in het voldoen van de
      vastgestelde aflossing, is het nog niet afgeloste deel van de geldlening terstond opeisbaar en is daarover tevens
      de wettelijke rente verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0009344
    url: https://wetten.overheid.nl/BWBR0007336/2000-10-11#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '47'
      - id: ref2
        bwb_id: BWBR0009344
  - number: '5'
    text: |-
      1 Indien door toepassing van [artikel 4, vierde tot en met zesde lid][ref1], na afloop van de aflossingsperiode van
      tien jaar een deel van de geldlening nog niet is afgelost, is vanaf dat moment maandelijks rente verschuldigd over
      het nog niet afgeloste deel van de geldlening.

      2 De rente, bedoeld in het eerste lid, is de wettelijke rente, verminderd met drie procent.

      3 Indien belanghebbende naar het oordeel van burgemeester en wethouders de rente geheel of gedeeltelijk kan
      betalen, doch niet kan aflossen, wordt een betaling eerst tot ten hoogste het bedrag van de verschuldigde
      maandrente aangemerkt als aflossing en wordt de rente die daardoor niet wordt betaald bijgeschreven bij het nog
      niet afgeloste deel van de geldlening.

      4 Indien belanghebbende naar het oordeel van burgemeester en wethouders geen rente kan betalen wordt de
      verschuldigde rente bijgeschreven bij het nog niet afgeloste deel van de geldlening.

      5 Over een bijgeschreven rentevordering is geen rente verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0007336#Artikel4
    url: https://wetten.overheid.nl/BWBR0007336/2000-10-11#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007336
        artikel: '4'
  - number: '6'
    text: |-
      1 Bij verkoop of bij vererving van de woning, en indien het een echtpaar betreft bij vererving na overlijden
      van de langstlevende echtgenoot, wordt het nog niet afgeloste deel van de geldlening, alsmede de op grond van
      [artikel 5, derde en vierde lid][ref1], bijgeschreven rente, terstond afgelost.

      2 Bij verkoop van de woning kunnen burgemeester en wethouders wegens bijzondere omstandigheden van medische of
      sociale aard van belanghebbende dan wel wegens werkaanvaarding elders door belanghebbende, na toepassing van het
      eerste lid, besluiten tot het verlenen van een nieuwe geldlening eveneens onder verband van hypotheek voor de
      aankoop van een andere woning, tot ten hoogste het bedrag van de ingevolge het eerste lid afgeloste geldlening,
      onder de voorwaarde dat belanghebbende het na aflossing vrijgekomen vermogen met inbegrip van het in het derde lid
      bedoelde bedrag volledig inzet voor de aankoop van de andere woning.

      3 Bij verkoop van de woning tegen een prijs overeenkomstig de waarde in het economisch verkeer bij vrije oplevering
      komt, voor zover de opbrengst daartoe toereikend is, aan belanghebbende in ieder geval het bedrag toe dat op grond
      van [artikel 54, eerste en tweede lid, van de Algemene bijstandswet][ref2] bij de vaststelling van de geldlening op
      de waarde van de woning in mindering is gebracht.

      4 Indien bij verkoop van de woning op basis van de waarde in het economisch verkeer bij vrije oplevering het voor
      de afrekening beschikbare bedrag lager is dan het resterende bedrag van de geldlening en van de rentevordering,
      wordt het verschil kwijtgescholden.


      [ref1]: https://wetten.overheid.nl/BWBR0007336#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel54
    url: https://wetten.overheid.nl/BWBR0007336/2000-10-11#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007336
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0007333
        artikel: '54'
  - number: '7'
    text: |-
      Indien binnen een periode van twee jaar na beëindiging van de bijstandverlening onder verband van hypotheek wederom
      recht op bijstand bestaat, wordt deze verleend met toepassing van de laatst gevestigde hypotheek.
    url: https://wetten.overheid.nl/BWBR0007336/2000-10-11#Artikel7
  - number: '8'
    text: |-
      Aan belanghebbende wordt telkens na afloop van een kalenderjaar een opgave verstrekt van de stand van de geldlening
      en van de rentevorderingen.
    url: https://wetten.overheid.nl/BWBR0007336/2000-10-11#Artikel8
  - number: '9'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop de [Algemene bijstandswet][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0007333
    url: https://wetten.overheid.nl/BWBR0007336/2000-10-11#Artikel9
    references:
