---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: inschrijvingsbesluit_ziekenfondsverzekering
regulatory_layer: AMVB
publication_date: '2003-09-11'
valid_from: '2003-09-01'
bwb_id: BWBR0002518
url: https://wetten.overheid.nl/BWBR0002518/2003-09-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Volksgezondheid van 7 december 1965, Directoraat-Generaal
    van de Volksgezondheid, Directie Gezondheidszorg I, Hoofdafdeling Gezondheidszorg I, Afdeling M.G.Z., No. 130621;

    Gelet op de artikelen 5, tweede en vierde lid, 22, tweede lid, 27, zesde lid, en 84 van de Ziekenfondswet (Stb.
    1964, 392);

    De Raad van State gehoord (advies van 15 december 1965, no. 60);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Volksgezondheid van 24 december 1965, Directoraat-
    Generaal van de Volksgezondheid, Directie Gezondheidszorg, Hoofdafdeling Gezondheidszorg I, Nr. 131.810;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      De aanmelding als verzekerde geschiedt door inlevering van een volledig ingevuld en door de verzekerde
      ondertekend aanmeldingsformulier bij een in zijn woonplaats werkend ziekenfonds. De verzekerde ingevolge
      [artikel 1, onder q, eerste lid, van het Aanwijzingsbesluit verzekerden Zfw][ref1] legt daartoe de verklaring,
      bedoeld in [artikel 1, onder q, tweede lid, van dat besluit][ref2] over.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002516#Artikel1
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002516
        artikel: '1'
  - number: '1.2'
    text: |-
      Indien bij of krachtens de laatste volzin van het eerste lid van [artikel 5 van de Ziekenfondswet][ref1] een of
      meer ziekenfondsen zijn aangewezen voor een groep van verzekerden, geschiedt in afwijking van het bepaalde in het
      vorige lid de aanmelding van een tot die groep behorende verzekerde bij dat ziekenfonds onderscheidenlijk bij een
      van deze ziekenfondsen.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel5
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '5'
  - number: '1.3'
    text: |-
      Indien het ziekenfonds zulks verzoekt dient de aanmelding van de verzekerde die verzekerd is vergezeld te gaan van
      de in [artikel 4, eerste lid][ref1], bedoelde werkgeversverklaring, dan wel, bij toepassing van artikel 12, van een
      door het College zorgverzekeringen aangegeven werkgeversverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0002518#Artikel4
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002518
        artikel: '4'
  - number: '2'
    text: |-
      Het College zorgverzekeringen kan bepalen, dat ten aanzien van medeverzekerden door het College zorgverzekeringen
      aan te geven verklaringen bij de aanmelding worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel2
  - number: '3'
    text: |-
      Het College zorgverzekeringen kan nadere en van het bepaalde in [artikel 1][ref1] afwijkende regelen vaststellen
      met betrekking tot de aanmelding van:


      [ref1]: https://wetten.overheid.nl/BWBR0002518#Artikel1
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002518
        artikel: '1'
  - number: 3.a
    text: degene, die zich aanmeldt in aansluiting aan de inschrijving bij een ander ziekenfonds;
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel3
  - number: 3.c
    text: een medeverzekerde, die niet tegelijk met de desbetreffende verzekerde is aangemeld;
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel3
  - number: 3.d
    text: |-
      degene die zich aanmeldt met de bedoeling aanspraak te maken op een vergoeding
      van kosten van geneeskundige verzorging, bedoeld in het bepaalde bij of krachtens
      [artikel 29 van het Verstrekkingenbesluit ziekenfondsverzekering][ref1] (Stb. 1966, 3), over een reeds beëindigde
      periode van verzekering ingevolge de [Ziekenfondswet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002520#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002520
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0002460
  - number: 3.e
    text: |-
      degene die behoort tot een groep van verzekerden of medeverzekerden wier inschrijving bij een ziekenfonds wordt
      bepaald of mede wordt bepaald door regelen die zijn voorzien bij of krachtens een verordening van de Raad van
      de Europese Gemeenschappen, dan wel de toepassing van zodanige verordening krachtens de Overeenkomst betreffende
      de Europese Economische Ruimte of een verdrag inzake sociale zekerheid dat Nederland met een andere staat heeft
      gesloten.
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel3
  - number: '4.1'
    text: |-
      Een werkgever verstrekt degene die verzekerd is ingevolge de arbeidsverhouding tot die werkgever onmiddellijk na
      aanvang van de verzekering een volledig ingevulde en door hem ondertekende werkgeversverklaring, waaruit blijkt dat
      en sedert wanneer betrokkene uit hoofde van die arbeidsverhouding verzekerd is.
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel4
  - number: '4.2'
    text: |-
      Een werkgever meldt onmiddellijk aan het hem door de verzekerde opgegeven ziekenfonds door middel van een volledig
      ingevulde en door hem ondertekende verklaring de aanvang onderscheidenlijk het einde van de verzekering ingevolge
      de in het eerste lid bedoelde arbeidsverhouding dan wel ingevolge een uitkering van ziekengeld krachtens de
      [Ziektewet][ref1] indien tijdens het ontvangen van het ziekengeld de arbeidsverhouding voortduurt.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '4.3'
    text: |-
      Een werkgever stelt het ziekenfonds, bedoeld in het tweede lid, in de gelegenheid de juistheid van de door hem
      verstrekte gegevens te controleren.
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel4
  - number: '4.4'
    text: |-
      Het College zorgverzekeringen kan bepalen dat de werkgever aan de verzekerde een kaart verstrekt waarmede de
      verzekerde het einde van de verzekering, bedoeld in het tweede lid, meldt aan het ziekenfonds.
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel4
  - number: '5.1'
    text: Het ziekenfonds beoordeelt na ontvangst van de aanmelding of degene die zich heeft aangemeld, verzekerd is.
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel5
  - number: '5.2'
    text: |-
      Het ziekenfonds is bevoegd, hangende de beoordeling van de aanmelding, over te gaan tot voorlopige inschrijving,
      evenwel niet langer dan voor de duur van ten hoogste drie maanden. De in de vorige volzin bedoelde termijn van drie
      maanden kan een maal met ten hoogste drie maanden worden verlengd. Het ziekenfonds stelt terstond de verzekerde van
      die verlenging in kennis.
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel5
  - number: '5.3'
    text: |-
      Het College zorgverzekeringen kan ter uitvoering van het bepaalde in de vorige leden aan de ziekenfondsen
      voorschriften geven. Daarbij kan worden bepaald, dat de voorlopige inschrijving aan voorwaarden wordt gebonden.
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel5
  - number: '6'
    text: |-
      Het ziekenfonds schrijft de verzekerde, met zijn medeverzekerden, in met ingang van de dag, waarop de verzekering
      is aangevangen.
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel6
  - number: '7.1'
    text: |-
      Een ziekenfonds schrijft een verzekerde niet in, indien die verzekerde reeds bij een ander ziekenfonds staat
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel7
  - number: '7.2'
    text: |-
      Een ziekenfonds schrijft een medeverzekerde niet in, indien degene op wiens verzekering de medeverzekering steunt,
      bij een ander ziekenfonds staat ingeschreven, onverminderd [artikel 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002518#Artikel9
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002518
        artikel: '9'
  - number: '8'
    text: |-
      Een medeverzekerde die op een ander woonadres is ingeschreven in de gemeentelijke basisadministratie
      persoonsgegevens dan degene, aan wiens verzekering hij het recht op medeverzekering ontleent, wordt door het
      ziekenfonds als verzekerde ingeschreven indien:
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel8
  - number: 8.a
    text: |-
      hij tot het huishouden van de verzekerde behoort en de afwijking in het adresgegeven hem redelijkerwijs niet kan
      worden verweten, of
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel8
  - number: 8.b
    text: hij tot het huishouden van de verzekerde behoort maar tijdelijk niet op hetzelfde adres woont.
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel8
  - number: '9'
    text: 'Het College zorgverzekeringen kan nadere regelen vaststellen met betrekking tot de inschrijving van:'
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel9
  - number: 9.a
    text: |-
      de in [artikel 3][ref1] bedoelde personen;


      [ref1]: https://wetten.overheid.nl/BWBR0002518#Artikel3
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002518
        artikel: '3'
  - number: 9.b
    text: |-
      medeverzekerden, die een andere woonplaats hebben dan degene, aan wiens verzekering zij het recht op
      medeverzekering ontlenen;
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel9
  - number: 9.c
    text: |-
      de medeverzekerden van degenen, voor wie op grond van het eerste lid, laatste volzin, van
      [artikel 5 van de Ziekenfondswet][ref1] een ziekenfonds is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel5
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '5'
  - number: '11'
    text: |-
      Voor de toepassing van dit besluit wordt een orgaan dat belast is met de uitkering van renten, wachtgelden,
      pensioenen of andere uitkeringen op grond waarvan verzekering bestaat of dat bij of krachtens het
      [Aanwijzingsbesluit verzekerden Zfw][ref1] met een werkgever is gelijkgesteld, aangemerkt als werkgever van degene
      aan wie de rente, het wachtgeld, het pensioen dan wel de andere uitkering is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002516
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002516
  - number: '12'
    text: |-
      Het College zorgverzekeringen kan voor werkgevers van door hem aan te wijzen groepen verzekerden ten aanzien van
      het bepaalde in [artikel 4, eerste en tweede lid][ref1], nadere en zonodig daarvan afwijkende regelen stellen. Deze
      regelen behoeven de goedkeuring van onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002518#Artikel4
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002518
        artikel: '4'
  - number: '14.1'
    text: |-
      De verzekerden, de medeverzekerden en de werkgevers alsmede de gewezen verzekerden, de gewezen medeverzekerden
      en de gewezen werkgevers zijn gehouden een ziekenfonds tijdig alle inlichtingen te verstrekken, desverlangd
      schriftelijk, die het ziekenfonds behoeft voor een goede uitvoering van de verzekering.
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel14
  - number: '14.2'
    text: |-
      De bij een ziekenfonds ingeschreven verzekerden zijn gehouden aan dat ziekenfonds de voor de beoordeling
      van de inschrijving benodigde inlichtingen te verstrekken en - desverlangd - de aan hen op grond van de
      [artikelen 4, eerste lid][ref1], en [12][ref2], verstrekte verklaringen zo spoedig mogelijk te doen toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002518#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002518#Artikel12
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002518
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002518
        artikel: '12'
  - number: '14.3'
    text: |-
      Degenen, die bij een ziekenfonds zijn ingeschreven, zijn verplicht dit ziekenfonds, terstond in kennis te stellen
      van feiten of omstandigheden, welke tot beëindiging van de inschrijving als verzekerde of medeverzekerde leiden.
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel14
  - number: '14.4'
    text: |-
      De kennisgevingen, bedoeld in het vorige lid, dienen uiterlijk in de week na die, waarin de bedoelde feiten of
      omstandigheden zich voordeden, aan het ziekenfonds te worden gedaan.
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel14
  - number: '14.5'
    text: |-
      Het College zorgverzekeringen kan bepalen dat het ziekenfonds een kaart afgeeft aan de verzekerde, welke de
      verzekerde ter voldoening aan de hem in het eerste en derde lid opgelegde verplichting, terstond ingevuld
      terugzendt aan het ziekenfonds.
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel14
  - number: '15'
    text: |-
      Een ziekenfonds verstrekt aan een verzekerde terstond na diens inschrijving een bewijs daarvan, dat hij,
      desgevraagd, bij het inroepen van geneeskundige verzorging overlegt.
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel15
  - number: '16'
    text: |-
      Een ziekenfonds verwerkt de aanmeldingen en andere mededelingen, die met betrekking tot de inschrijving worden
      gedaan, zo spoedig mogelijk en uiterlijk voor het einde van de administratieperiode, waarin het deze heeft
      ontvangen. Onder administratieperiode wordt verstaan de periode, gelegen tussen twee opeenvolgende tijdstippen,
      waarop een ziekenfonds, volgens door het College zorgverzekeringen aan te geven regelen, periodiek het aantal bij
      hem ingeschreven verzekerden vaststelt.
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel16
  - number: '17.1'
    text: |-
      De inschrijving bij een ziekenfonds geldt voor één kalenderjaar. Indien een inschrijving anders dan per 1 januari
      tot stand is gekomen, geldt de inschrijving tot en met 31 december van het volgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel17
  - number: '17.2'
    text: |-
      De inschrijving wordt na verloop van de in het eerste lid bedoelde termijn, alsmede telkens na verloop van de
      overeenkomstig dit lid verlengde termijn, verlengd met één kalenderjaar, tenzij vóór de dag waarop die termijn is
      verstreken, de verzekerde schriftelijk heeft meegedeeld na afloop van die termijn de inschrijving niet te willen
      verlengen.
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel17
  - number: '17.3'
    text: |-
      Het ziekenfonds kan in een reglement een termijn opnemen die de verzekerde in acht moet nemen bij het doen van een
      mededeling als bedoeld in het tweede lid. Deze termijn bedraagt ten hoogste twee maanden.
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel17
  - number: '17.4'
    text: |-
      In afwijking van het eerste en tweede lid beëindigt een ziekenfonds de inschrijving, nadat de verzekerde daarom
      schriftelijk heeft verzocht, met ingang van de eerste dag van de volgende kalendermaand, indien het verzoek is
      ingediend binnen twee maanden na de dag:
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel17
  - number: 17.4.a
    text: |-
      waarop het ziekenfonds de verzekerde mededeling heeft gedaan van een wijziging van de door hem verschuldigde
      nominale premie;
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel17
  - number: 17.4.b
    text: |-
      met ingang waarvan de verzekerde niet langer behoort tot een categorie van verzekerden voor wie ingevolge
      [artikel 5, eerste lid][ref1], laatste volzin, van de [Ziekenfondswet][ref2] een ziekenfonds is aangewezen waarbij
      hij zich dient in te schrijven of;


      [ref1]: https://wetten.overheid.nl/BWBR0002518#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002518
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0002460
  - number: 17.4.c
    text: |-
      met ingang waarvan de verzekerde in aansluiting op medeverzekering ingevolge
      [artikel 4 van de Ziekenfondswet][ref1] uit eigen hoofde verzekerd is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel4
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '4'
  - number: '17.5'
    text: |-
      In afwijking van het eerste en tweede lid beëindigt een ziekenfonds de inschrijving van een verzekerde of
      medeverzekerde met ingang van de dag waarop bij of krachtens de wet inschrijving bij dat ziekenfonds niet of niet
      langer is toegestaan.
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel17
  - number: '17.6'
    text: |-
      In afwijking van het eerste en tweede lid beëindigt een ziekenfonds de inschrijving als medeverzekerde met ingang
      van de dag waarop de inschrijving van degene op wiens verzekering zijn medeverzekering steunt, wordt beëindigd.
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel17
  - number: '21.1'
    text: |-
      Het College zorgverzekeringen stelt het model vast van de aanmeldingsformulieren en werkgeversverklaringen als
      bedoeld in de [artikelen 1][ref1], [2][ref2] en [4, eerste en tweede lid][ref3], en van de kaarten als bedoeld in
      de [artikelen 4, vierde lid][ref4], en [14, vijfde lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002518#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002518#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002518#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0002518#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0002518#Artikel14
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002518
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002518
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0002518
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0002518
        artikel: '4'
      - id: ref5
        bwb_id: BWBR0002518
        artikel: '14'
  - number: '21.2'
    text: |-
      Het College zorgverzekeringen kan voor door hem aan te geven groepen van verzekerden afzonderlijke modellen
      vaststellen.
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel21
  - number: '21.3'
    text: |-
      Het College zorgverzekeringen kan modellen vaststellen van het inschrijvingsbewijs als bedoeld in
      [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002518#Artikel15
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002518
        artikel: '15'
  - number: '21.4'
    text: |-
      Het model van de verklaringen, die op grond van dit besluit worden verstrekt door een orgaan, dat bij of krachtens
      de [Ziekenfondswet][ref1] met een werkgever is gelijkgesteld, wordt door het College zorgverzekeringen in overleg
      met dit orgaan vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002460
  - number: 21a
    text: |-
      Het College zorgverzekeringen kan regels stellen inzake de technische specificaties waaraan een inschrijvingsbewijs
      als bedoeld in [artikel 15][ref1] moet voldoen als gebruik wordt gemaakt van een magneetstripkaart of een
      chipkaart.


      [ref1]: https://wetten.overheid.nl/BWBR0002518#Artikel15
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0002518
        artikel: '15'
  - number: '22.1'
    text: |-
      Onverminderd het bepaalde in het tweede lid wordt de schade, die is geleden als gevolg van de omstandigheid dat
      degene, die niet verzekerd is dan wel anderszins niet voor inschrijving als verzekerde in aanmerking komt, zich
      niettemin als zodanig heeft doen inschrijven alsmede de schade, die is geleden als gevolg van de omstandigheid
      dat degene, die is ingeschreven in de verzekering, heeft verzuimd het ziekenfonds, waarbij hij is ingeschreven,
      overeenkomstig het bepaalde in de [leden 3 en 4 van artikel 14][ref1], in kennis te stellen van het einde van zijn
      verzekering of die van zijn medeverzekerden, gesteld op een door het College zorgverzekeringen vast te stellen
      bedrag, gebaseerd op de landelijk gemiddelde jaarlijkse kosten van een ziekenfondsverzekerde, jonger dan 65 jaar,
      berekend over de periode van hun onrechtmatige inschrijving. Het College zorgverzekeringen kan ter zake verdere
      regelen stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002518#Artikel14
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002518
        artikel: '14'
  - number: '22.2'
    text: |-
      Ten aanzien van degene, die zonder daartoe gerechtigd te zijn opzettelijk aanspraken als verzekerde bij een
      ziekenfonds doet gelden, kan dat ziekenfonds de in het vorige lid bedoelde schade vaststellen op het werkelijke
      bedrag daarvan, indien de werkelijk geleden schade hoger is dan het bedrag, waarop de schade bij toepassing van het
      eerste lid zou zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel22
  - number: '23'
    text: |-
      Als strafbaar feit als bedoeld in [artikel 84 Ziekenfondswet][ref1] wordt aangemerkt overtreding van het bepaalde
      bij of krachtens de [artikelen 4][ref2], [12][ref3] en [14, eerste en derde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0002518#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002518#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0002518#Artikel14
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '84'
      - id: ref2
        bwb_id: BWBR0002518
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0002518
        artikel: '12'
      - id: ref4
        bwb_id: BWBR0002518
        artikel: '14'
  - number: '25'
    text: 'Dit besluit wordt aangehaald als: Inschrijvingsbesluit ziekenfondsverzekering.'
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel25
  - number: '26'
    text: Dit besluit treedt in werking met ingang van 1 januari 1966.
    url: https://wetten.overheid.nl/BWBR0002518/2003-09-01#Artikel26
