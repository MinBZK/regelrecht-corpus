  - number: 2.1.d
    text: |-
      de betekening en kennisgeving van gerechtelijke mededelingen, bedoeld in
      [artikel 36b, tweede en derde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel36b
    url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 36b
  - number: '2.2'
    text: |-
      Stukken en berichten kunnen ook met behulp van een elektronische voorziening worden ingediend indien van deze
      mogelijkheid voor het desbetreffende gerecht blijkt uit een voor dat gerecht vastgesteld procesreglement.
    url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#Artikel2
  - number: '2.3'
    text: |-
      Berichten van ontvangst en kennisgevingen kunnen ook via een internet- of telefoniedienst worden verzonden aan de
      rechtstreeks belanghebbende en bevatten niet meer gegevens dan noodzakelijk.
    url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#Artikel2
  - number: '2.4'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de wijze waarop stukken worden overgedragen door
      de elektronische voorziening. Tevens kunnen eisen worden gesteld waaraan de stukken dienen te voldoen die worden
      overgedragen door de elektronische voorziening.
    url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#Artikel2
  - number: '3.1'
    text: 'De elektronische voorziening voldoet aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#Artikel3
  - number: 3.1.a
    text: de gebruiker van de voorziening wordt geïdentificeerd;
    url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#Artikel3
  - number: 3.1.b
    text: na te gaan is wie de verzender is van het stuk;
    url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#Artikel3
  - number: 3.1.c
    text: na te gaan is of het stuk is gewijzigd na het moment van verzending;
    url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#Artikel3
  - number: 3.1.d
    text: |-
      na te gaan is op welk tijdstip het stuk is ontvangen respectievelijk ter beschikking is gesteld in de elektronische
      voorziening;
    url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#Artikel3
  - number: 3.1.e
    text: na te gaan is op welk moment zich in de voorziening een storing voordoet of zich heeft voorgedaan, en
    url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#Artikel3
  - number: 3.1.f
    text: het stuk in de voorziening is uitsluitend toegankelijk voor een gebruiker die daarvoor is geautoriseerd.
    url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#Artikel3
  - number: '3.2'
    text: |-
      De inrichting van de elektronische voorziening voldoet aan de nationale en internationale
      standaarden voor informatiebeveiliging en is in staat langs elektronische weg de gegevens, bedoeld in
      [artikel 36i van de wet][ref1], vast te leggen. Bij ministeriële regeling kan nader worden bepaald aan welke
      standaarden de elektronische voorziening voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel36i
    url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 36i
  - number: '4'
    text: |-
      Indien op de laatste dag van een voor de indiener geldende termijn voor het indienen van een stuk als
      bedoeld in [artikel 2, eerste lid, onderdeel a][ref1], een niet aan de indiener toerekenbare verstoring
      plaatsvindt van de toegang tot of de werking van de elektronische voorziening, is een daardoor
      veroorzaakte overschrijding van de termijn verschoonbaar indien het stuk uiterlijk wordt ingediend op de
      eerstvolgende dag na de dag waarop de indiener ermee bekend had kunnen zijn dat de verstoring is verholpen.
      [Artikel 1, eerste lid, van de Algemene termijnenwet][ref2] is van overeenkomstige toepassing op deze eerstvolgende
      dag.


      [ref1]: https://wetten.overheid.nl/BWBR0038616#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002448#Artikel1
    url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0038616
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002448
        artikel: '1'
  - number: '5'
    text: |-
      De indiening, toezending, kennisneming, verstrekking en betekening van stukken, bedoeld in
      [artikel 2, eerste lid][ref1], alsook de elektronische handtekening, bedoeld in [artikel 6, eerste lid][ref2],
      vereisen authenticatie met een middel dat voldoet aan de volgende eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0038616#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0038616#Artikel6
    url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0038616
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0038616
        artikel: '6'
        paragraaf: '3'
  - number: 5.a
    text: het middel is uitgegeven door de overheid of een onder toezicht van de overheid staande organisatie;
    url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#Artikel5
  - number: 5.b
    text: het middel gaat uit van een tweefactorauthenticatie of hoger, en
    url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#Artikel5
  - number: 5.c
    text: het middel is aangewezen door de bevoegde instanties.
    url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#Artikel5
  - number: '6.1'
    text: |-
      De elektronische handtekening, bedoeld in [artikel 138e van de wet][ref1], met behulp van een middel als bedoeld in
      [artikel 5][ref2], voldoet aan de volgende eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel138e
      [ref2]: https://wetten.overheid.nl/BWBR0038616#Artikel5
    url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 138e
      - id: ref2
        bwb_id: BWBR0038616
        artikel: '5'
        paragraaf: '3'
  - number: 6.1.a
    text: |-
      de ondertekenaar heeft zich geauthenticeerd met behulp van een middel dat voldoet aan de eisen, gesteld in
      [artikel 5][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0038616#Artikel5
    url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0038616
        artikel: '5'
        paragraaf: '3'
  - number: 6.1.b
    text: |-
      de gegevens waaruit de elektronische handtekening bestaat zijn op zodanige wijze verbonden aan de elektronische
      gegevens waarop deze betrekking heeft, dat de identiteit van de ondertekenaar, het moment van ondertekening en elke
      wijziging na ondertekening van de gegevens kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#Artikel6
  - number: '6.2'
    text: |-
      De elektronische handtekening, bedoeld in [artikel 138e van de wet][ref1], zijnde een handgeschreven handtekening
      op een elektronische gegevensdrager, voldoet aan de volgende eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel138e
    url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 138e
  - number: 6.2.a
    text: |-
      de ondertekening heeft plaatsgevonden in aanwezigheid van of wordt gedaan door: - een rechter of griffier;
        - een ambtenaar belast met de opsporing van strafbare feiten als bedoeld in de [artikelen 141][ref1] en
      [142 van de wet][ref2];
        - een ambtenaar belast met de betekening en kennisgeving van gerechtelijke mededelingen, bedoeld in
      [artikel 36b, tweede en derde lid, van de wet][ref3], en


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel142
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel36b
    url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '142'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 36b
  - number: 6.2.b
    text: |-
      de biometrische of grafische handtekening is op zodanige wijze aan de elektronische gegevens waarop zij betrekking
      heeft verbonden, dat het moment van ondertekening en elke wijziging na ondertekening van de elektronische gegevens
      kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#Artikel6
  - number: '7'
    text: |-
      Een stuk in papieren vorm kan worden vervangen door een stuk in elektronische vorm mits is voldaan aan de eisen die
      bij of krachtens de [Archiefwet 1995][ref1] zijn gesteld aan de vervanging van archiefbescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '10'
    text: |-
      Het [Besluit elektronische aangifte][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0020864
    url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020864
  - number: '11'
    text: |-
      Het [Besluit elektronisch proces-verbaal][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0029475
    url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0029475
  - number: '12'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#Artikel12
  - number: '13'
    text: 'Dit besluit wordt aangehaald als: Besluit digitale stukken Strafvordering.'
    url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#Artikel13
