preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Veiligheid en Justitie van 6 juli 2016, nr. 780412, directie Wetgeving en
    Juridische Zaken;

    Gelet op de artikelen 12, vierde lid, 32, vijfde lid, 36a, 36f, derde lid, 51a, vierde en vijfde lid, artikel 51b,
    zesde lid, 138f, 149a, vierde lid, 163, derde lid, 257e, vierde lid, 410, eerste lid, 450, vierde lid, 552a, zesde
    lid, 552ab tweede lid, 552b, tweede lid, en artikel 153, tweede lid, van het Wetboek van Strafvordering, artikel 49
    van de Wet op de economische delicten en artikel 11 van de Wet op de rechterlijke organisatie;

    De Afdeling advisering van de Raad van State gehoord, advies van 5 september 2016, nr. W03.16.0182/II;

    Gezien het nader rapport van Onze Minister van Veiligheid en Justitie van 27 september 2016, nr. 804035, directie
    Wetgeving en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#Artikel1
  - number: 1.a
    text: |-
      *bevoegde instanties:* de gerechten, bedoeld in [artikel 2 van de Wet op de rechterlijke organisatie][ref1]
      en de parketten, bedoeld in de [artikelen 111, eerste lid][ref2], en
      [134, eerste lid, van de Wet op de rechterlijke organisatie][ref3], de instantie waar een
      opsporingsambtenaar werkzaam is die is belast met de opsporing van strafbare feiten als bedoeld in
      [artikel 141, de onderdelen b, c en d][ref4] en [artikel 142 van de wet][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel111
      [ref3]: https://wetten.overheid.nl/BWBR0001830#Artikel134
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref5]: https://wetten.overheid.nl/BWBR0001903#Artikel142
