  - number: 1.e
    text: |-
      *vervanging:* het omzetten van een stuk in papieren vorm in een reproductie in elektronische vorm waarna het
      origineel wordt vernietigd.
    url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#Artikel1
