    text: |-
      een verzoek als bedoeld in [artikel 49 van de Wet op de economische delicten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel49
    url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '49'
  - number: 2.1.b
    text: de toezending van berichten van ontvangst en kennisgevingen van de indiening van stukken, bedoeld in onderdeel a;
    url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#Artikel2
  - number: 2.1.c
    text: |-
      de kennisneming van processtukken en de verstrekking van afschriften van processtukken, bedoeld in de
      [artikelen 30 tot en met 32][ref1] en [51b van de wet][ref2], voor zover betrokkene daartoe ingevolgde
      [de wet][ref3] bevoegd is, of


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel51b
      [ref3]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#Artikel2
