  - number: 1.b
    text: |-
      *de wet:* het [Wetboek van Strafvordering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: 1.c
    text: |-
      *elektronische voorziening:* een webportaal of andere internetdienst ten behoeve van de overdracht van de stukken,
      bedoeld in [artikel 2, eerste en tweede lid][ref1], aan of door de bevoegde instanties;


      [ref1]: https://wetten.overheid.nl/BWBR0038616#Artikel2
    url: https://wetten.overheid.nl/BWBR0038616/2026-01-01#Artikel1
