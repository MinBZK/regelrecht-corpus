      [10, derde lid, van de Wet werk en inkomen kunstenaars][ref2],
      [8b, vijfde lid, van de Algemene Ouderdomswet][ref3], [2.17, derde lid, van de Wet studiefinanciering 2000][ref4]
      en [2.22a, derde lid, van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref5].


