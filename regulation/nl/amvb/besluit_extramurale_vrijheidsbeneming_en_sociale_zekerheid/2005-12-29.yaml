  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid, gedaan mede namens de Staatssecretaris
    van Sociale Zaken en Werkgelegenheid, J. F. Hoogervorst van 30 november 1999, Directie Bijstandszaken, nr. BZ/
    ACT/99/74550a;

    Gelet op de artikelen 19b, vierde lid, van de Ziektewet, 19a, vijfde lid, en 47b, vierde lid, van de Wet op de
    arbeidsongeschiktheidsverzekering, 7b, vijfde lid, en 21b, vierde lid, van de Wet arbeidsongeschiktheidsverzekering
    zelfstandigen, 6b, vijfde lid, en 20a, vierde lid, van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten,
    19, achtste lid, van de Werkloosheidswet, 32c, derde lid, van de Algemene nabestaandenwet, 9, vierde lid, van de
    Algemene bijstandswet, 6, vierde lid, van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte
    werkloze werknemers, 6, zesde lid, van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen
    zelfstandigen, en 5, derde lid, van de Wet inkomensvoorziening kunstenaars;

    De Raad van State gehoord (advies van 16 december 1999, nr. W12.99.0599/IV);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid, uitgebracht mede namens
    de Staatssecretaris van Sociale Zaken en Werkgelegenheid, J. F. Hoogervorst van 25 januari 2000, Directie
    Bijstandszaken, nr. BZ/Act/99/81529;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0011136/2005-12-29#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Als categorieën van personen, bedoeld in de [artikelen 19b, vierde lid, van de Ziektewet][ref1],
      [19a, vijfde lid][ref2], en [47b, vierde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref3],
      [44, eerste lid, onderdeel b, van de Wet werk en inkomen naar arbeidsvermogen][ref4], [7b, vijfde lid][ref5],
      en [21b, vierde lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref6], [6b, vijfde lid][ref7],
      en [20a, vierde lid, van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref8],
      [19, achtste lid, van de Werkloosheidswet][ref9], [32c, derde lid, van de Algemene nabestaandenwet][ref10],
      [13, derde lid, van de Wet werk en bijstand][ref11],
      [6, vierde lid, van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref12],
      __REF012___________________________________________________________________________________________________________
      __, en [10, derde lid, van de Wet werk en inkomen kunstenaars][ref14], worden aangewezen degenen, die:

      a. deelnemen aan een penitentiair programma als bedoeld in
      [artikel 4, eerste lid, van de Penitentiaire beginselenwet][ref15];

      b. proefverlof genieten als bedoeld in
      [artikel 51, eerste lid, van de Beginselenwet verpleging ter beschikking gestelden][ref16];

      c. deelnemen aan een scholings- en trainingsprogramma als bedoeld in
      [artikel 3, eerste lid, van de Beginselenwet justitiële jeugdinrichtingen][ref17];

      d. proefverlof genieten als bedoeld in
      [artikel 31, eerste lid, van de Beginselenwet justitiële jeugdinrichtingen][ref18];

      e. deelnemen aan een programma in de laatste fase van de maatregel tot plaatsing in een inrichting voor de opvang
      van verslaafden als bedoeld in [artikel 38m van het Wetboek van Strafrecht][ref19].


