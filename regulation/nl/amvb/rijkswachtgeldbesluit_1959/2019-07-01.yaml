    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken van 17 juli 1959, nummer A 592/U 2395, Hoofdafdeling
    Overheidspersoneelszaken, Afdeling Algemene en Juridische Zaken;

    Gelet op artikel 125, eerste lid van de Ambtenarenwet 1929;

    De Raad van State gehoord (advies van 11 augustus 1959 nummer 21);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken a.i., van 26 augustus 1959, nummer A 592/2756,
    Hoofdafdeling Overheidspersoneelszaken, Afdeling Algemene en Juridische Zaken;

