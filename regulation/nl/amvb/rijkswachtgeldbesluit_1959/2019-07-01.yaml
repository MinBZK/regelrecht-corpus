  url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel1
  - number: 1.b
    text: |-
      Stichting Pensioenfonds ABP: de Stichting Pensioenfonds ABP, bedoeld in
      [artikel 6 van de Wet privatisering ABP][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel6
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '6'
  - number: 1.c
    text: 'pensioenreglement: het pensioenreglement Stichting Pensioenfonds ABP;'
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel1
  - number: 1.d
    text: 'pensioen: een pensioen krachtens het pensioenreglement;'
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel1
  - number: 1.e
    text: |-
      arbeidsongeschiktheidspensioen: invaliditeitspensioen krachtens het pensioenreglement zoals dat luidde op 31
      december 2006 dan wel ABP ArbeidsongeschiktheidsPensioen krachtens het pensioenreglement;
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel1
  - number: 1.f
    text: |-
      arbeidsongeschiktheid: arbeidsongeschiktheid in de zin van
      [artikel 18, eerste lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1] of in de zin van
      [artikel 4, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref2] dan wel gedeeltelijke
      arbeidsgeschiktheid in de zin van [artikel 5 van laatstgenoemde wet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel5
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '5'
  - number: 1.g
    text: |-
      arbeidsongeschiktheidsuitkering: uitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1]dan
      wel arbeidsongeschiktheidsuitkering, bedoeld in [hoofdstuk 6 van de Wet werk en inkomen naar arbeidsvermogen][ref2]
      respectievelijk werkhervattingsuitkering gedeeltelijk arbeidsgeschikten, bedoeld in
      [hoofdstuk 7 van laatstgenoemde wet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0019057
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0019057
        hoofdstuk: '7'
  - number: 1.h
    text: |-
      suppletie: een suppletie krachtens de [Suppletieregeling gedeeltelijk arbeidsongeschikten sector rijk][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007758
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007758
  - number: 1.i
    text: |-
      lichamen: rechtspersonen, maat- en vennootschappen, samenwerkingsvormen zonder rechtpersoonlijkheid die met
      verenigingen maatschappelijk gelijk kunnen worden gesteld, ondernemingen van publiekrechtelijke rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel1
  - number: '2.1'
    text: |-
      Dit besluit verstaat onder betrokkene: de ambtenaar in de zin van het
      [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1] dan wel de ambtenaar in vaste dienst in de zin van
      het [Algemeen Rijksambtenarenreglement][ref2], met uitzondering van de burgemeester, aan wie eervol ontslag is
      verleend:


      [ref1]: https://wetten.overheid.nl/BWBR0003630
      [ref2]: https://wetten.overheid.nl/BWBR0001950
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003630
      - id: ref2
        bwb_id: BWBR0001950
  - number: 2.1.a
    text: |-
      in het kader van een reorganisatie indien het niet mogelijk is gebleken om hem te herplaatsen in een passende
      functie;
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel2
  - number: 2.1.b
    text: wegens verplaatsing van de dienst of het dienstvak of onderdeel daarvan, waarbij hij werkzaam is;
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel2
  - number: 2.1.c
    text: |-
      omdat hij - na een functie in een publiekrechtelijk college, waarin hij is benoemd of verkozen, te hebben aanvaard,
      en in verband daarmede van de waarneming van zijn ambt tijdelijk te zijn ontheven, na vervolgens te hebben
      opgehouden vorenbedoelde functie te bekleden - naar het oordeel van het bevoegd gezag niet in actieve dienst kon
      worden hersteld;
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel2
  - number: 2.1.d
    text: |-
      omdat hij, na afloop van verlof van lange duur, verleend met toepassing van artikel 34, uitgezonderd het derde
      en vijfde lid, van het [Algemeen Rijksambtenarenreglement][ref1] dan wel met toepassing van een overeenkomstige
      regeling, naar het oordeel van het bevoegd gezag niet in actieve dienst kon worden hersteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001950
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001950
  - number: 2.1.e
    text: omdat hij is opgehouden de functie van substituut-ombudsman te bekleden;
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel2
  - number: 2.1.f
    text: omdat hij een benoeming tot minister of staatssecretaris heeft aanvaard;
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel2
  - number: 2.1.g
    text: |-
      wegens onbekwaamheid of ongeschiktheid voor het door hem in vaste dienst beklede ambt, anders dan op grond van
      ziels- of lichaamsgebreken;
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel2
  - number: 2.1.h
    text: wegens ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte;
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel2
  - number: 2.1.i
    text: |-
      op zijn aanvraag in verband met de aanvaarding van een functie buiten de overheid voorzover de ambtenaar is
      aangewezen als herplaatsingskandidaat als bedoeld in [artikel 49][ref1] of [49][ref2] danwel als bedoeld in de
      [artikelen 84][ref3] of [84][ref4] en hij binnen twee jaar nadat hij een functie heeft aanvaard buiten de overheid,
      buiten zijn schuld of toedoen wordt ontslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49d
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel49e
      [ref3]: https://wetten.overheid.nl/BWBR0003229#Artikel84d
      [ref4]: https://wetten.overheid.nl/BWBR0003229#Artikel84e
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49d
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 49e
      - id: ref3
        bwb_id: BWBR0003229
        artikel: 84d
      - id: ref4
        bwb_id: BWBR0003229
        artikel: 84e
  - number: '2.2'
    text: 'Geen betrokkene in de zin van dit besluit is:'
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel2
  - number: 2.2.a
    text: hij te wiens aanzien de toekenning van wachtgeld bij de wet is geregeld;
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel2
  - number: 2.2.b
    text: hij die laatstelijk een betrekking bekleedde waarin hij geen deelnemer was in de zin van het pensioenreglement;
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel2
  - number: 2.2.c
    text: |-
      hij aan wie eervol ontslag is verleend in de zin van het eerste lid, onderdelen a tot en
      met i, en die deswege recht heeft op een uitkering op grond van de [Werkloosheidswet][ref1],
      het [Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Rijk][ref2]
      of een arbeidsongeschiktheidsuitkering op grond van [hoofdstuk 6][ref3] of
      [7 van de Wet werk en inkomen naar arbeidsvermogen][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0008114
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk6
      [ref4]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0008114
      - id: ref3
        bwb_id: BWBR0019057
        hoofdstuk: '6'
      - id: ref4
        bwb_id: BWBR0019057
        hoofdstuk: '7'
  - number: '3.1'
    text: |-
      Dit besluit verstaat onder diensttijd, voorzover gelegen voor 1 januari 1996: de tijd zoals die voor betrokkene
      per 31 december 1995 meetelt voor de pensioenberekening, bedoeld in de Algemene burgerlijke pensioenwet; voorzover
      gelegen op of na 1 januari 1996: de tijd gedurende welke de betrokkene overheidswerknemer is in de zin van de
      [Wet privatisering ABP][ref1]; in beide gevallen met uitzondering van de tijd:


      [ref1]: https://wetten.overheid.nl/BWBR0007791
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007791
  - number: 3.1.a
    text: |-
      die voorafgaat aan een ontslag uit een betrekking waaraan een functioneel leeftijdsontslag is verbonden, mits uit
      hoofde van dat ontslag een uitkering is toegekend;
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel3
  - number: 3.1.b
    text: |-
      die in aanmerking is genomen bij de berekening van de duur van een wachtgeld of van een uitkering ter zake van
      onvrijwillige werkloosheid ten laste van de overheid, tenzij voor de toepassing van artikel 6, tweede en derde lid,
      en van artikel 7, eerste lid;
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel3
  - number: 3.1.c
    text: |-
      die voorafgaat aan een onderbreking in de diensttijd door ontslag van langer dan een jaar, tenzij voor de
      toepassing van artikel 6*a*, derde tot en met vijfde lid, en van artikel 7, eerste lid;
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel3
  - number: 3.1.d
    text: bedoeld in artikel 5.4 van het pensioenreglement;
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel3
  - number: 3.1.e
    text: in een aangehouden betrekking.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel3
  - number: '3.2'
    text: |-
      Voor de toepassing van het eerste lid, van artikel 6*a*, derde tot en met vijfde lid, en van artikel 7, eerste lid,
      wordt in voorkomend geval diensttijd, bedoeld in artikel D 1, tweede lid, van de Algemene burgerlijke pensioenwet
      zoals deze luidde op 31 december 1995, mede in aanmerking genomen. Het verzoek als bedoeld in artikel D2 van
      genoemde wet wordt daarbij geacht te zijn gedaan.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel3
  - number: '3.3'
    text: |-
      Voor zover diensttijd die bij de berekening van het wachtgeld in aanmerking is genomen, met een overheidspensioen,
      anders dan ten laste van de Stichting Pensioenfonds ABP, wordt vergolden, worden de duur en het bedrag van het
      wachtgeld, met ingang van de dag waarop dit pensioen is ingegaan, herberekend, waarbij die diensttijd buiten
      beschouwing wordt gelaten.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel3
  - number: 3a.1
    text: |-
      Dit besluit verstaat onder dienstbetrekking iedere publiekrechtelijke of privaatrechtelijke arbeidsverhouding
      waarbij in dienst van een natuurlijke persoon of een lichaam werkzaamheden tegen bezoldiging of loon worden
      verricht.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel3a
  - number: 3a.2
    text: |-
      Het bepaalde bij of krachtens de [artikelen 4, 5 en 6 van de Werkloosheidswet][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel4
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '4'
  - number: '4.1'
    text: |-
      Dit besluit verstaat onder bezoldiging: de bezoldiging in de zin van het
      [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1] vermeerderd met de vakantie-uitkering en de
      eindejaarsuitkering, berekend over een maand, waarop de betrokkene op de dag voorafgaande aan zijn ontslag
      aanspraak had of bij waarneming van zijn functie zou hebben gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: '4.2'
    text: |-
      In afwijking van het in het eerste lid bepaalde gelden de toelagen, bedoeld in de [artikelen 14][ref1] en
      [18, eerste lid, van voornoemd besluit][ref2] en de over die toelagen berekende vakantie-uitkering niet als deel
      van de bezoldiging.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel18
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0003630
        artikel: '18'
  - number: '4.3'
    text: |-
      Indien de betrokkene geen ambtenaar is in de zin van het
      [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1] geldt als bezoldiging hetgeen overeenkomt met het
      eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: '4.4'
    text: |-
      Indien de door een betrokkene over de laatste aan het ontslag voorafgaande twaalf volle kalendermaanden genoten
      bezoldiging in de zin van het in het eerste lid genoemde besluit, dan wel hetgeen daarmee overeenkomt, alsmede
      de over die maanden genoten vakantie-uitkering dan wel verkregen aanspraak daarop geheel of gedeeltelijk uit
      wisselende inkomsten waaronder begrepen de evengenoemde aanspraken bestonden, geldt in zoverre in afwijking van het
      eerste lid als bezoldiging, met inachtneming van het tweede en derde lid, het gemiddelde van die inkomsten.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel4
  - number: '4.5'
    text: |-
      De bezoldiging, omschreven in het eerste tot en met vierde lid, wordt aangepast overeenkomstig een algemene
      wijziging van het salaris, van de vakantie-uitkering en van de eindejaarsuitkering van het burgerlijk
      rijkspersoneel, met ingang van de dag waarop die wijziging van het salaris, de vakantie-uitkering respectievelijk
      de eindejaarsuitkering van kracht wordt.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel4
  - number: '4.6'
    text: |-
      Voor betrekkingen die geleidelijk worden opgeheven, alsmede in bijzondere gevallen, kan Onze Minister van het
      hiervoren bepaalde ten gunste van de betrokkene afwijken.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel4
  - number: 4a.1
    text: |-
      Zolang de betrokkene de leeftijd van 55 jaar nog niet heeft bereikt, is hij verplicht zich bij de
      Arbeidsvoorzieningsorganisatie van zijn woonplaats als werkzoekende te doen inschrijven uiterlijk op de eerste
      werkdag, volgende op die waarop het ontslag ingaat, dan wel het recht op wachtgeld ontstaat.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel4a
  - number: 4a.2
    text: |-
      De betrokkene, die op de dag van het ontslag metterwoon verblijf houdt in het buitenland dan wel nadien
      metterwoon verblijf gaat houden in het buitenland en die de leeftijd van 55 jaar nog niet heeft bereikt, is
      verplicht zich te doen inschrijven als werkzoekende bij een aldaar gevestigde instantie van arbeidsbemiddeling
      die daartoe de mogelijkheid biedt en die naar het oordeel van Onze Minister vergelijkbaar is met de
      Arbeidsvoorzieningsorganisatie.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel4a
  - number: 4a.3
    text: |-
      Onze Minister kan bepalen dat de in het eerste en tweede lid omschreven verplichting niet geldt voor bepaalde
      betrokkenen of groepen van betrokkenen die de leeftijd van 55 jaar nog niet hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel4a
  - number: '5.1'
    text: |-
      De betrokkene, bedoeld in artikel 2, eerste lid, de onderdelen *a* tot en met *i*, heeft recht op wachtgeld met
      ingang van de dag waarop het ontslag ingaat, tenzij de betrokkene:
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel5
  - number: 5.1.a
    text: ter zake van dat ontslag recht heeft op een pensioen wegens het bereiken van de pensioengerechtigde leeftijd;
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel5
  - number: 5.1.b
    text: |-
      op dat moment recht heeft op een arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van 80%
      of meer;
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel5
  - number: 5.1.c
    text: ter zake van dat ontslag recht heeft op een suppletie.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel5
  - number: '5.2'
    text: |-
      De betrokkene, bedoeld in het eerste lid, onderdeel *b*, heeft recht op wachtgeld met ingang van de dag waarop de
      mate van arbeidsongeschiktheid op een lager percentage is vastgesteld dan 80%. De hoogte van dit wachtgeld wordt
      vastgesteld te rekenen van de datum van ontslag wegens ongeschiktheid tot het verrichten van zijn arbeid wegens
      ziekte. Ter bepaling van de duur van het wachtgeld wordt:
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel5
  - number: 5.2.a
    text: |-
      voor de toepassing van [artikel 6][ref1] als ingangsdatum uitgegaan van de datum met ingang waarvan de mate van
      arbeidsongeschiktheid op een lager percentage wordt vastgesteld, waarbij voor de toepassing van artikel 6, vierde
      lid, tevens een arbeidsongeschiktheidsuitkering, eventueel vermeerderd met een arbeidsongeschiktheidspensioen
      vastgesteld naar een mate van arbeidsongeschiktheid van 80% of meer mede in aanmerking wordt genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0002326#Artikel6
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002326
        artikel: '6'
  - number: 5.2.b
    text: |-
      voor de toepassing van artikel 6*a* als ingangsdatum uitgegaan van de datum met ingang waarvan betrokkene ontslag
      is verleend op grond van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel5
  - number: '5.3'
    text: |-
      De betrokkene, bedoeld in het eerste lid, onderdeel *c*, heeft na afloop van de suppletie recht op wachtgeld,
      indien hij bij het buiten toepassing laten van het eerste lid, onderdeel *c*, op grond van het ontslag uit de
      betrekking waarvoor hij arbeidsongeschikt is verklaard, recht zou hebben op wachtgeld waarbij de duur zou worden
      vastgesteld ingevolge artikel 6*a* van dit besluit. Het wachtgeld gaat in op de eerste dag volgende op die waarop
      de suppletie op grond van [artikel 8, onderdeel ][ref1] is geëindigd. Het wachtgeld eindigt op het tijdstip waarop
      het wachtgeld dat, te rekenen van de dag waarop het ontslag is ingegaan, zou zijn toegekend ingevolge artikel
      6*a*, bij het buiten toepassing laten van het eerste lid, onderdeel *c*, zou zijn geëindigd. Op de hoogte van dit
      wachtgeld is artikel 7 van toepassing, met dien verstande dat gerekend wordt van het tijdstip waarop het ontslag
      is ingegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007758#Artikel8
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007758
        artikel: '8'
  - number: '5.4'
    text: 'Geen recht op wachtgeld heeft de betrokkene bedoeld:'
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel5
  - number: 5.4.a
    text: |-
      in artikel 2, eerste lid, onderdeel *a*, die andere mede in verband met zijn persoonlijkheid en omstandigheden voor
      hem passende werkzaamheden heeft geweigerd te aanvaarden;
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel5
  - number: 5.4.b
    text: |-
      in artikel 2, eerste lid, onderdelen *a* tot en met *f*, aan wie schriftelijk is medegedeeld dat hem eervol
      ontslag zal worden verleend en die na die mededeling een hem aangeboden betrekking, welke mede in verband met zijn
      persoonlijkheid en omstandigheden voor hem passend is te achten, heeft geweigerd te aanvaarden;
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel5
  - number: 5.4.c
    text: |-
      in artikel 2, eerste lid, onderdeel *g*, indien Onze Minister, gehoord Onze Minister, hoofd van het daarbij
      betrokken departement van algemeen bestuur, van oordeel is dat het ontslag aan eigen schuld of toedoen is te
      wijten.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel5
  - number: '5.5'
    text: |-
      Het vierde lid is niet van toepassing indien de betrokkene op de dag van ingang van zijn ontslag de leeftijd van 60
      jaar heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel5
  - number: '5.6'
    text: Onze Minister beslist over de toekenning van wachtgeld op aanvraag door de betrokkene.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel5
  - number: '6.1'
    text: De duur van het wachtgeld is 6 maanden, met ingang van de dag waarop het ontslag ingaat.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6
  - number: '6.2'
    text: |-
      Indien de betrokkene in de periode van 5 jaar onmiddellijk voorafgaande aan het ontslag ten minste gedurende 3 jaar
      als werknemer als bedoeld in [artikel 3 van de Werkloosheidswet][ref1] en in dienstbetrekking van 8 of meer uren
      per week werkzaam is geweest, wordt de duur van het wachtgeld verlengd met:







                    3 maanden


                    bij een arbeidsverleden van ten minste


                    5 jaar;




                    0,5 jaar


                    bij een arbeidsverleden van ten minste


                    10 jaar;




                    1 jaar


                    bij een arbeidsverleden van ten minste


                    15 jaar;




                    1,5 jaar


                    bij een arbeidsverleden van ten minste


                    20 jaar;




                    2 jaar


                    bij een arbeidsverleden van ten minste


                    25 jaar;




                    2,5 jaar


                    bij een arbeidsverleden van ten minste


                    30 jaar;




                    3,5 jaar


                    bij een arbeidsverleden van ten minste


                    35 jaar, en




                    4,5 jaar


                    bij een arbeidsverleden van ten minste


                    40 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel3
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '3'
  - number: '6.3'
    text: 'Het arbeidsverleden, bedoeld in het tweede lid, wordt vastgesteld door samentelling van:'
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6
  - number: 6.3.a
    text: |-
      perioden, gelegen in de 5 jaar onmiddellijk voorafgaande aan het ontslag, waarover de betrokkene aantoont als
      werknemer als bedoeld in [artikel 3 van de Werkloosheidswet][ref1] en in dienstbetrekking van 8 of meer uren per
      week werkzaam te zijn geweest, en


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel3
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '3'
  - number: 6.3.b
    text: de periode gelegen tussen de 18e verjaardag van de betrokkene en de dag, gelegen 5 jaar voor het ontslag.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6
  - number: '6.4'
    text: 'Perioden, waarin een betrokkene:'
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6
  - number: 6.4.a
    text: |-
      recht heeft op een arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van ten minste 80%, of
      een toelage ontvangt op grond van artikel 58, eerste of derde lid, van de Algemene Arbeidsongeschiktheidswet, die
      al dan niet vermeerderd met een arbeidsongeschiktheidsuitkering 70% of meer bedraagt van het dagloon, waarnaar de
      arbeidsongeschiktheidsuitkering is of zou zijn berekend;
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6
  - number: 6.4.b
    text: |-
      ter zake van een dienstbetrekking op grond waarvan hem door het Rijk arbeidsongeschiktheidspensioen was verzekerd,
      recht heeft op een arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van ten minste 80%,
      of een toelage ontvangt die naar aard en strekking overeenkomt met een toelage als bedoeld onder a, die al dan
      niet vermeerderd met de arbeidsongeschiktheidsuitkering 73% of meer bedraagt van het dagloon in de zin van de
      [Suppletieregeling gedeeltelijk arbeidsongeschikten sector rijk][ref1], waarnaar de arbeidsongeschiktheidsuitkering
      is of zou zijn berekend;


      [ref1]: https://wetten.overheid.nl/BWBR0007758
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007758
  - number: 6.4.c
    text: |-
      een uitkering ontvangt op grond van [hoofdstuk III van de Wet arbeidsongeschiktheidsvoorziening militairen][ref1],
      berekend naar een arbeidsongeschiktheid van ten minste 80% of een toelage op grond van dat hoofdstuk, die al
      dan niet vermeerderd met de arbeidsongeschiktheidsuitkering 70% of meer bedraagt van het dagloon, waarnaar de
      arbeidsongeschiktheidsuitkering is of zou zijn berekend;


      [ref1]: https://wetten.overheid.nl/BWBR0002822#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002822
        hoofdstuk: III
  - number: 6.4.d
    text: |-
      na beëindiging van zijn dienstbetrekking een uitkering ontvangt op grond van de [Ziektewet][ref1] over de maximale
      duur bedoeld in [artikel 29, tweede lid, van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '29'
  - number: 6.4.e
    text: een uitkering ontvangt, die naar aard en strekking overeenkomt met een uitkering bedoeld onder a of d;
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6
  - number: '6.5'
    text: |-
      Voor de periode van drie jaar bedoeld in het tweede lid, en voor de perioden gelegen in de vijf jaar, onmiddellijk
      voorafgaande aan het ontslag bedoeld in het derde lid, worden perioden waarin een persoon een tot zijn huishouden
      behorend kind:
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6
  - number: 6.5.a
    text: |-
      beneden de leeftijd van 6 jaar verzorgt, zonder dat deze persoon in dienstbetrekking van 8 of meer uren per week
      werkzaam is geweest of een uitkering heeft ontvangen als bedoeld in het vierde lid, volledig, en
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6
  - number: 6.5.b
    text: |-
      vanaf de leeftijd van 6 jaar doch beneden de leeftijd van 12 jaar verzorgt, zonder dat deze persoon in
      dienstbetrekking van 8 of meer uren per week werkzaam is geweest of een uitkering heeft ontvangen als bedoeld in
      het vierde lid, voor de helft in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6
  - number: '6.6'
    text: 'Voor de toepassing van het vijfde lid worden als perioden van verzorging niet meegeteld de periode waarin:'
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6
  - number: 6.6.a
    text: |-
      de verzorgende persoon als werknemer in de zin van een wettelijke regeling inzake werkloosheid recht heeft op een
      uitkering ter zake van werkloosheid; en
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6
  - number: 6.6.b
    text: de verzorging buiten Nederland plaatsvindt anders dan tijdens vakantie.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6
  - number: '6.7'
    text: |-
      Indien er in een gezamenlijke huishouding meer verzorgende personen zijn als bedoeld in het vijfde lid, wordt voor
      de toepassing van dat lid als verzorgende persoon van het kind beschouwd, degene van deze personen die zij als
      zodanig hebben aangewezen. Ingeval geen verzorgende persoon wordt aangewezen, is Onze Minister bevoegd een van hen
      die naar zijn oordeel als verzorgende persoon moet worden beschouwd, als zodanig aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6
  - number: '6.8'
    text: 'Voor de toepassing van het vijfde en zevende lid wordt onder:'
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6
  - number: 6.8.a
    text: een kind verstaan een eigen, aangehuwd of pleegkind;
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6
  - number: 6.8.b
    text: een pleegkind verstaan een kind dat als eigen kind wordt onderhouden en opgevoed.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6
  - number: '6.9'
    text: |-
      De regels die gesteld zijn krachtens [artikel 17b, zevende lid, van de Werkloosheidswet][ref1], zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel17b
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 17b
  - number: '6.10'
    text: |-
      In bijzondere gevallen kan Onze Minister na afloop van de in het eerste en tweede lid bedoelde termijnen de duur
      van het wachtgeld verlengen.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6
  - number: 6a.1
    text: |-
      In afwijking van artikel 6, wordt, indien dit leidt tot een langere wachtgeldduur, waarin tevens voor zover
      van toepassing de bijzondere verlenging als bedoeld in het vierde lid, is begrepen, de duur van het wachtgeld
      vastgesteld overeenkomstig de volgende leden.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6a
  - number: 6a.2
    text: 'De duur van het wachtgeld wordt vastgesteld op drie maanden, vermeerderd voor de betrokkene:'
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6a
  - number: 6a.2.a
    text: |-
      die op de dag van ontslag de leeftijd van 21 jaar nog niet heeft bereikt met een duur gelijk aan 18% van de
      diensttijd;
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6a
  - number: 6a.2.b
    text: |-
      die op de dag van ontslag 21 jaar oud is met een duur van 19,5% van de diensttijd en zo vervolgens per
      leeftijdsjaar opklimmende met 1,5%;
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6a
  - number: 6a.2.c
    text: die op de dag van ontslag 60 jaar of ouder is, met een duur gelijk aan 78% van de diensttijd.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6a
  - number: 6a.3
    text: |-
      Ten aanzien van de betrokkene die bij de aanvang van de in het tweede lid bedoelde diensttijd in het genot was van
      wachtgeld, waarvan de duur is vastgesteld krachtens het eerste en tweede lid van dit artikel, of van een uitkering
      waarvan de duur is vastgesteld krachtens [artikel 8][ref1], wordt bij de berekening van de duur van het wachtgeld
      op basis van het tweede lid mede in aanmerking genomen de diensttijd, welke bij de berekening van de duur van
      het eerder toegekende wachtgeld of de eerder toegekende uitkering in aanmerking is genomen. Op de aldus berekende
      duur wordt de duur van het eerder toegekende wachtgeld of de eerder toegekende uitkering, met uitzondering van de
      verlenging bedoeld in het volgende lid, in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002537#Artikel8a
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0002537
        artikel: 8a
  - number: 6a.4
    text: |-
      In aanvulling op de duur van het wachtgeld van de betrokkene die ten tijde van het ontslag 55 jaar of ouder is en
      een diensttijd, voor zover geldig voor pensioen, van ten minste tien jaar heeft volbracht, wordt na afloop van de
      termijn waarover wachtgeld is toegekend, een bijzondere verlenging verleend. Deze bijzondere verlenging duurt tot
      de eerste dag van de kalendermaand volgende op die waarin hij de leeftijd van 65 jaar heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6a
  - number: 6a.5
    text: |-
      In bijzondere gevallen kan Onze Minister na afloop van de in het eerste en tweede lid bedoelde termijnen de duur
      van het wachtgeld verlengen.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6a
  - number: 6b.1
    text: |-
      De betrokkene, die het einde van de wachtgeldduur, bedoeld in artikel 6, tweede lid, heeft bereikt, heeft in
      aansluiting op dat wachtgeld recht op een vervolgwachtgeld.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6b
  - number: 6b.2
    text: De betrokkene die
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6b
  - number: 6b.2.a
    text: het einde van de wachtgeldduur bedoeld in artikel 6, eerste lid, heeft bereikt en
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6b
  - number: 6b.2.b
    text: |-
      voldoet aan de voorwaarde, bedoeld in artikel 6, tweede lid, onderdeel *a* of *b*, doch uitsluitend wegens zijn
      arbeidsverleden geen recht heeft op verlenging van de wachtgeldduur, heeft recht op een vervolgwachtgeld.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6b
  - number: 6b.3
    text: Behoudens het gestelde in de volgende leden is de duur van het vervolgwachtgeld een jaar.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6b
  - number: 6b.4
    text: |-
      De duur van het vervolgwachtgeld voor de betrokkene die op de dag van zijn ontslag 57,5 jaar of ouder is, bedraagt
      drie en een half jaar.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6b
  - number: 6b.5
    text: |-
      De betrokkene aan wie uitsluitend ingevolge het eerste en tweede lid van artikel 6*a* een wachtgeld is toegekend
      en die voldoet aan de voorwaarde, bedoeld in artikel 6, tweede lid, onderdeel *a* of *b*, heeft aansluitend recht
      op een vervolgwachtgeld indien het toegekende wachtgeld eindigt op een tijdstip gelegen binnen een jaar na de datum
      waarop zijn wachtgeld zou zijn beëindigd, wanneer dit zou zijn toegekend ingevolge artikel 6. Het vervolgwachtgeld
      eindigt op het tijdstip gelegen een jaar na de in de vorige volzin bedoelde datum.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6b
  - number: 6b.6
    text: |-
      De betrokkene die op de dag van zijn ontslag 57,5 jaar of ouder is, aan wie uitsluitend ingevolge het eerste en
      tweede lid van artikel 6*a* een wachtgeld is toegekend en die voldoet aan de voorwaarde, bedoeld in artikel 6,
      tweede lid, onderdeel *a* of *b*, heeft aansluitend recht op een vervolgwachtgeld indien het toegekende wachtgeld
      eindigt op een tijdstip gelegen binnen drie en een half jaar na de datum waarop zijn wachtgeld zou zijn beëindigd,
      wanneer dit zou zijn toegekend ingevolge artikel 6. Het vervolgwachtgeld eindigt op het tijdstip gelegen drie en
      een half jaar na de in de vorige volzin bedoelde datum.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6b
  - number: 6b.7
    text: |-
      Tenzij uitdrukkelijk anders is bepaald, zijn bepalingen van het wachtgeld van overeenkomstige toepassing op het
      vervolgwachtgeld.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel6b
  - number: '7.1'
    text: |-
      Het bedrag van het wachtgeld is gedurende de eerste 12 maanden gelijk aan 80% van de bezoldiging, gedurende de
      daaropvolgende zes maanden 75% van die bezoldiging en vervolgens 70% van die bezoldiging. Het bedrag van het
      wachtgeld daalt echter niet beneden het bedrag van het pensioen waarop de betrokkene recht zou hebben, indien hij
      uit de betrekking waaruit hij met recht op wachtgeld is ontslagen, op de dag van dat ontslag zou zijn gepensioneerd
      naar de diensttijd, voor zover geldig voor pensioen, en de berekeningsgrondslag, bedoeld in artikel 6.2 van het
      pensioenreglement.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel7
  - number: '7.2'
    text: |-
      Het bedrag van het wachtgeld tijdens de verlenging, bedoeld in artikel 6*a*, vierde lid, is gelijk aan 70% van
      de bezoldiging.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel7
  - number: '7.3'
    text: |-
      In afwijking van het eerste lid is het bedrag van het wachtgeld tijdens de verlenging bedoeld in artikel 6*a*,
      vijfde lid, ten hoogste 50% van de bezoldiging.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel7
  - number: 7a.1
    text: |-
      Het bedrag van het vervolgwachtgeld is gelijk aan het minimumloon, met dien verstande dat dit bedrag nooit meer kan
      bedragen dan 70% van de bezoldiging.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel7a
  - number: 7a.2
    text: |-
      Voor de toepassing van dit artikel wordt onder minimumloon verstaan het maandbedrag van het minimumloon
      bedoeld in [artikel 8, eerste lid, onder a, van de Wet minimumloon en minimumvakantiebijslag][ref1], of,
      indien het een betrokkene jonger dan 21 jaar betreft, het voor zijn leeftijd geldende minimumloon bedoeld in
      [artikel 7, derde lid][ref2], en artikel 8, derde lid, van genoemde wet, beide vermeerderd met de daarvoor
      berekende vakantiebijslag, bedoeld in [artikel 15 van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '15'
  - number: '8.1'
    text: |-
      De inkomsten die de betrokkene geniet of gaat genieten uit of in verband met arbeid of bedrijf, ter hand genomen
      met ingang van of na de dag waarop het ontslag, ter zake waarvan het wachtgeld is toegekend, hem is aangezegd of
      door hem is aangevraagd, worden met het wachtgeld verrekend over de maand waarop deze inkomsten betrekking hebben
      of geacht kunnen worden betrekking te hebben. Deze verrekening geschiedt aldus dat het wachtgeld wordt verminderd
      met het bedrag waarmede het wachtgeld, vermeerderd met die inkomsten, de bezoldiging overschrijdt. Voor de bepaling
      van het bedrag waarmede het wachtgeld vermeerderd met inkomsten zoals bedoeld in de eerste volzin de bezoldiging
      overschrijdt, wordt een vermindering van het wachtgeld ingevolge het bepaalde in [artikel 17, eerste lid][ref1],
      niet in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002326#Artikel17
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002326
        artikel: '17'
  - number: '8.2'
    text: |-
      Ten aanzien van de betrokkene aan wie een wachtgeld is toegekend en die wegens ongeschiktheid tot het verrichten
      van zijn arbeid wegens ziekte ontslag is verleend uit de betrekking die hij gedurende de met recht op wachtgeld
      doorgebrachte tijd bekleedde en waarin hij deelnemer was in de zin van het pensioenreglement, worden inkomsten,
      bedoeld in het eerste lid als volgt verrekend. De inkomsten die betrokkene geniet of gaat genieten uit of in
      verband met arbeid of bedrijf, ter hand genomen met ingang van of na de dag waarop het ontslag plaatsvond uit de
      betrekking die door betrokkene als wachtgelder werd vervuld, worden verrekend over de maand waarop zij betrekking
      hebben of geacht kunnen worden betrekking te hebben. In afwijking van het gestelde in het eerste lid, geschiedt
      deze verrekening op zodanige wijze dat het oorspronkelijk toegekende wachtgeld wordt verminderd met het bedrag
      waarmee de arbeidsongeschiktheidsuitkering, eventueel vermeerderd met een arbeidsongeschiktheidspensioen al dan
      niet aangevuld met een wachtgeld of uitkering, vermeerderd met de inkomsten uit of in verband met arbeid of bedrijf
      met inbegrip van de oorspronkelijk toegekende uitkering de oorspronkelijke bezoldiging overschrijdt. Indien na
      die vermindering een bedrag aan overschrijding van de bezoldiging resteert, wordt het aanvullende wachtgeld of de
      aanvullende uitkering verminderd met het resterende bedrag aan overschrijding.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel8
  - number: '8.3'
    text: |-
      Het in het eerste lid bepaalde vindt overeenkomstige toepassing ten aanzien van inkomsten uit of in verband met
      arbeid of bedrijf ter hand genomen gedurende non-activiteit, vakantie of verlof onmiddellijk voorafgaande aan het
      ontslag, terzake waarvan het wachtgeld is toegekend.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel8
  - number: '8.4'
    text: |-
      Wanneer de betrokkene arbeid of bedrijf ter hand heeft genomen vóór de dag van het ontslag, anders dan bedoeld in
      het eerste en derde lid, en na die dag uit die arbeid of dat bedrijf inkomsten of meer inkomsten gaat genieten,
      is het eerste lid van toepassing, tenzij de betrokkene aannemelijk maakt, dat die inkomsten of vermeerdering van
      inkomsten of een gedeelte daarvan noch het gevolg zijn van een verhoogde werkzaamheid noch verband houden met het
      ontslag, in welk geval die inkomsten, die meerdere inkomsten of dat gedeelte daarvan niet in aanmerking worden
      genomen voor de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel8
  - number: '8.5'
    text: In bijzondere gevallen kan Onze Minister van het hiervoren bepaalde ten gunste van de betrokkene afwijken.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel8
  - number: '9.1'
    text: |-
      De betrokkene is verplicht van het ter hand nemen van enige arbeid of bedrijf terstond mededeling te doen aan Onze
      Minister onder opgave, voor zover mogelijk, van de inkomsten, die hij uit die werkzaamheden zal trekken. Zijn de
      inkomsten niet vooraf op te geven, dan doet hij tijdig vóór het verschijnen van elke wachtgeldtermijn opgave van
      de inkomsten, die hij sinds het ter hand nemen van de werkzaamheden of sinds de vorige opgave heeft genoten. Onze
      Minister geeft nadere voorschriften aangaande het doen van mededelingen door de betrokkene met betrekking tot de
      inkomsten uit of in verband met arbeid of bedrijf.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel9
  - number: '9.2'
    text: |-
      Brengt de aard van de werkzaamheden of van de inkomsten mede, dat de inkomsten over een langere termijn moeten
      worden berekend, dan geschiedt de opgave dienovereenkomstig en wordt op het wachtgeld een vermindering toegepast
      van een voorlopig vastgesteld bedrag onder voorbehoud van verrekening aan het einde van de evenbedoelde termijn.
      Ten aanzien van deze verrekening is artikel 8 van toepassing, met dien verstande, dat zij geschiedt over de in de
      vorige volzin bedoelde langere termijn in plaats van over iedere maand afzonderlijk.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel9
  - number: '9.3'
    text: Onze Minister kan bij de vaststelling van het bedrag van de vermindering van de opgave van de betrokkene afwijken.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel9
  - number: '9.4'
    text: |-
      Het in de voorgaande leden bepaalde vindt overeenkomstige toepassing ten aanzien van de arbeid of bedrijf en de
      inkomsten daaruit, bedoeld in artikel 8, derde en vierde lid.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel9
  - number: '9.5'
    text: |-
      Zolang de betrokkene de leeftijd van 55 jaar niet heeft bereikt is hij verplicht zich te gedragen naar de
      voorschriften, welke hem door Onze Minister worden gegeven om tot het verkrijgen van een ambt of betrekking of
      andere bron van inkomsten te geraken.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel9
  - number: '9.6'
    text: |-
      De betrokkene aan wie wachtgeld is toegekend, wordt door het aanvaarden van het wachtgeld geacht er in toe
      te stemmen, dat allen, die daarvoor naar het oordeel van Onze Minister in aanmerking komen, omtrent zijn
      omstandigheden alle inlichtingen geven, welke voor de uitvoering van dit besluit noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel9
  - number: '10'
    text: |-
      Onze Minister kan bepalen, dat inkomsten, welke zijn genoten uit hoofde van overwerk, bij wijze van gratificatie,
      terzake van een vrijwillige verbintenis bij het Korps Nationale Reserve, als vrijwillige ambtenaar bij de politie,
      of bij andere door Onze Minister aan te wijzen reserve-organen, geheel of ten dele niet worden aangemerkt als
      inkomsten.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel10
  - number: 10a.1
    text: |-
      Indien de betrokkene ongeschikt is tot het verrichten van arbeid wegens ziekte, is hij verplicht daarvan terstond
      mededeling te doen aan Onze Minister. De betrokkene is eveneens verplicht zijn herstel terstond te melden.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel10a
  - number: 10a.2
    text: |-
      Het wachtgeld wordt niet uitbetaald voor de duur dat de betrokkene de in het eerste lid bedoelde verplichting niet
      nakomt.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel10a
  - number: '11'
    text: |-
      Indien de betrokkene ongeschikt is tot het verrichten van arbeid wegens ziekte, kan hij door Onze Minister worden
      verplicht zich geneeskundig te doen onderzoeken.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel11
  - number: '13.1'
    text: 'Het recht op wachtgeld eindigt:'
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel13
  - number: 13.1.a
    text: |-
      met ingang van de dag waarop betrokkene de leeftijd, bedoeld in
      [artikel 7, onderdeel a, van de Algemene Ouderdomswet bereikt][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '7'
  - number: 13.1.b
    text: met ingang van de dag volgende op die waarop de betrokkene is overleden;
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel13
  - number: 13.1.c
    text: indien het recht op wachtgeld geheel wordt afgekocht;
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel13
  - number: 13.1.e
    text: op aanvraag van betrokkene.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel13
  - number: '13.2'
    text: |-
      Het recht op wachtgeld eindigt met ingang van de dag waarop betrokkene recht verkrijgt op
      een arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van 80% of meer.
      [Artikel 5, tweede lid][ref1], is van overeenkomstige toepassing, met dien verstande dat van dit herleefde
      wachtgeld de duur, voor zover deze wordt bepaald aan de hand van [artikel 6a][ref2], en de hoogte worden
      vastgesteld te rekenen vanaf de datum van ontslag.


      [ref1]: https://wetten.overheid.nl/BWBR0002326#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002326#Artikel6a
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002326
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0002326
        artikel: 6a
  - number: '13.3'
    text: 'Het recht op wachtgeld kan geheel of ten dele vervallen worden verklaard indien de betrokkene:'
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel13
  - number: 13.3.a
    text: zich zodanig gedraagt, dat hij, ware hij in dienst gebleven, zou zijn ontslagen;
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel13
  - number: 13.3.b
    text: |-
      de gegevens, die noodzakelijk zijn voor de vaststelling of de vermindering van het wachtgeld niet, niet volledig,
      of onjuist verstrekt;
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel13
  - number: 13.3.c
    text: |-
      de in artikel 4*a*, eerste en tweede lid, bedoelde inschrijving teniet doet of nalaat haar op de door de
      Arbeidsvoorzieningsorganisatie dan wel de buitenlandse instantie van arbeidsbemiddeling bepaalde tijdstippen te
      doen verlengen;
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel13
  - number: 13.3.d
    text: |-
      als ingeschrevene bij de Arbeidsvoorzieningsorganisatie dan wel de buitenlandse instantie van arbeidsbemiddeling
      verzuimt gevolg te geven aan een oproeping of aanwijzing van die organisatie dan wel die instantie, die kan leiden
      tot het verkrijgen van werk, dat voor hem passend kan worden geacht dan wel weigert dergelijk werk te aanvaarden;
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel13
  - number: 13.3.e
    text: niet ernstig tracht werk te vinden.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel13
  - number: '13.4'
    text: |-
      Het recht op wachtgeld vervalt wanneer de daartoe strekkende aanvraag als bedoeld in artikel 5, zesde lid, niet
      binnen een termijn van vijf jaren na het ontstaan van dat recht bij Onze Minister is ingekomen.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel13
  - number: '14.1'
    text: 'Indien de betrokkene:'
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel14
  - number: 14.1.a
    text: |-
      een hem aangeboden ambt of betrekking, welke hem in verband met zijn persoonlijkheid en omstandigheden
      redelijkerwijs kan worden opgedragen, weigert te aanvaarden;
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel14
  - number: 14.1.b
    text: |-
      in de gelegenheid is om op een wijze, die voor hem passend kan worden geacht, inkomsten te verkrijgen, daarvan geen
      gebruik maakt;
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel14
  - number: 14.1.c
    text: |-
      inkomsten, als bedoeld in [artikel 8][ref1] zonder voldoende reden prijs geeft, dan wel door eigen schuld of
      toedoen verloren doet gaan;


      [ref1]: https://wetten.overheid.nl/BWBR0002326#Artikel8
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002326
        artikel: '8'
  - number: '14.2'
    text: 'Het wachtgeld wordt niet uitbetaald voor de duur dat de betrokkene:'
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel14
  - number: 14.2.a
    text: de hem opgelegde verplichtingen niet of niet volledig nakomt;
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel14
  - number: 14.2.b
    text: |-
      metterwoon verblijf gaat houden in het buitenland tenzij Onze Minister, op een door betrokkene daartoe gedane
      aanvraag, anders beslist;
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel14
  - number: 14.2.c
    text: |-
      geen arbeidsongeschiktheidsuitkering aanvraagt dan wel weigert mee te werken aan een onderzoek tot vaststelling van
      zijn arbeidsongeschiktheid ter verkrijging van een arbeidsongeschiktheidsuitkering;
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel14
  - number: 14.2.d
    text: |-
      niet als werkzoekende bij de Arbeidsvoorzieningsorganisatie dan wel de buitenlandse instantie van
      arbeidsbemiddeling staat ingeschreven, tenzij hij aantoont dat hij redelijkerwijs niet in staat is geweest om te
      voldoen aan de in [artikel 4a, eerste en tweede lid][ref1], gestelde verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0002326#Artikel4a
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002326
        artikel: 4a
  - number: '15'
    text: Op aanvraag van de betrokkene kan het recht op wachtgeld geheel of ten dele worden afgekocht.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel15
  - number: '16.1'
    text: |-
      Ten aanzien van de betrokkene aan wie wachtgeld is toegekend en die uit hoofde van ziekte aanspraak heeft of krijgt
      op doorbetaling van zijn bezoldiging, wordt de verdere uitvoering van dit besluit opgeschort tot het einde van het
      tijdvak waarover die aanspraak bestaat.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel16
  - number: '16.2'
    text: |-
      Het eerste lid vindt overeenkomstige toepassing in het geval doorbetaling van bezoldiging plaatsvindt op grond van
      [artikel 95, achtste lid, van het Algemeen Rijksambtenarenreglement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel95
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '95'
  - number: '16.3'
    text: |-
      Ten aanzien van de betrokkene aan wie wachtgeld is toegekend en die zich ingevolge wettelijke verplichting als
      militair of als noodwachter in werkelijke dienst bevindt of moet begeven, wordt op een daartoe strekkende aanvraag
      de verdere uitvoering van dit besluit voor de duur van die dienst opgeschort.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel16
  - number: '16.4'
    text: |-
      Het vorige lid is van overeenkomstige toepassing ingeval de betrokkene is tewerkgesteld als gewetensbezwaarde in de
      zin van [artikel 9 van de Wet Gewetensbezwaren militaire dienst][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel9
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '9'
  - number: '17.1'
    text: |-
      Indien de betrokkene ter zake van dezelfde dienstverhouding aanspraak heeft op een arbeidsongeschiktheidsuitkering,
      eventueel vermeerderd met een arbeidsongeschiktheidspensioen, berekend naar een mate van arbeidsongeschiktheid van
      minder dan 80%, wordt het geldende bedrag van het wachtgeld met het hierna genoemde percentage verminderd. Deze
      vermindering bedraagt bij een mate van arbeidsongeschiktheid van






                    65% tot 80%:


                    80%;




                    55% tot 65%:


                    60%;




                    45% tot 55%:


                    50%;




                    35% tot 45%:


                    40%;




                    25% tot 35%:


                    30%;




                    15% tot 25%:


                    20%;




                    minder dan 15%:


                    0%.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel17
  - number: '17.2'
    text: |-
      De som van de uitkering, bedoeld in het eerste lid, eventueel vermeerderd met het arbeidsongeschiktheidspensioen,
      en het verminderde wachtgeld bedraagt voorts niet meer dan het onverminderde wachtgeld dat wordt genoten
      indien er geen sprake is van samenloop. Ingeval van overschrijding van bedoeld onverminderd wachtgeld wordt het
      overschrijdende bedrag op het verminderde wachtgeld in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel17
  - number: '18'
    text: |-
      Aan de betrokkene aan wie wachtgeld is toegekend, die elders arbeid of bedrijf ter hand gaat nemen, kan ter zake
      van de kosten, die voor hem aan een daartoe nodige verhuizing zijn verbonden, een tegemoetkoming worden toegekend
      tot ten hoogste het bedrag van een vergoeding volgens de normen van het [Verplaatsingskostenbesluit 1989][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004630
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004630
  - number: '19.1'
    text: |-
      Het wachtgeld, over een maand berekend, wordt in maandelijkse termijnen betaald. Met toestemming van de betrokkene
      kan de uitbetaling in langere termijnen geschieden.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel19
  - number: '19.2'
    text: |-
      Zo spoedig mogelijk na het overlijden van de betrokkene aan wie wachtgeld is toegekend, wordt aan de weduwe of
      weduwnaar, van wie de overledene niet duurzaam gescheiden leefde, een bedrag uitgekeerd gelijk aan de bezoldiging
      over een tijdvak van drie maanden. Wordt op het wachtgeld een vermindering toegepast krachtens de artikelen 8, 9
      of 14, of wordt artikel 13, derde lid, toegepast, dan is de uitkering gelijk aan het bedrag van het wachtgeld, dat
      de betrokkene op de dag van het overlijden ontving, over een tijdvak van drie maanden. Bij overlijden in de periode
      van opschorting van het wachtgeld krachtens artikel 16, eerste lid bestaat geen aanspraak op een uitkering als in
      dit artikel bedoeld.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel19
  - number: '19.3'
    text: |-
      In dit artikel wordt onder weduwe of weduwnaar mede verstaan de achtergebleven levenspartner met wie de niet-
      gehuwde betrokkene samenwoonde en – met het oogmerk duurzaam samen te leven – een gemeenschappelijke huishouding
      voerde op basis van een notarieel verleden samenlevingscontract bevattende de wederzijdse rechten en verplichtingen
      ter zake van die samenwoning en gemeenschappelijke huishouding alsmede de achtergebleven geregistreerde partner.
      Tegelijkertijd kan slechts één persoon als weduwe of weduwnaar worden aangemerkt. Onze Minister kan verlangen
      dat een schriftelijke verklaring van een notaris wordt overgelegd waaruit blijkt dat een samenlevingscontract is
      gesloten.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel19
  - number: '19.4'
    text: |-
      Laat de overledene geen weduwe of weduwnaar na, van wie hij, onderscheidenlijk zij, niet duurzaam gescheiden
      leefde, dan geschiedt de uitkering van het in het tweede lid bedoelde bedrag ten behoeve van de minderjarige
      wettige of natuurlijke kinderen van de overledene, of minderjarige kinderen waarover de overledene ten tijde van
      het overlijden de pleegouderlijke zorg droeg. Onder pleegouderlijke zorg wordt verstaan de zorg voor het onderhoud
      en de opvoeding van het kind, als was het een eigen kind, onafhankelijk van enige verplichting daartoe of van
      het genieten van een vergoeding daarvoor. Ontbreken ook zodanige kinderen, dan geschiedt de uitkering van het in
      het tweede lid bedoelde bedrag, aan degenen die geheel of grotendeels afhankelijk waren van de inkomsten van de
      overledene.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel19
  - number: '19.5'
    text: |-
      Op de uitkering bedoeld in het tweede of derde lid, wordt in mindering gebracht het bedrag van de uitkering waarop
      de nagelaten betrekkingen van de gewezen ambtenaar ter zake van diens overlijden aanspraak kunnen maken krachtens
      [artikel 102][ref1], indien op de dag van overlijden artikel 17 van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel102a
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 102a
  - number: '19.6'
    text: |-
      Laat de overledene geen betrekkingen, als bedoeld in het tweede en derde lid na, dan kan het aldaar bedoelde bedrag
      geheel of ten dele worden uitgekeerd voor de betaling van de kosten van de laatste ziekte en van de lijkbezorging,
      indien zijn nalatenschap voor de betaling van die kosten ontoereikend is.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel19
  - number: '23'
    text: |-
      De [Algemene Termijnenwet][ref1] (*Stb.* 1964, 314) is niet van toepassing op de termijnen gesteld in artikel 6,
      eerste en tweede lid, artikel 6*a*, tweede lid, artikel 6*b*, derde tot en met zesde lid, artikel 7, eerste lid, en
      artikel 19, tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: '24.1'
    text: |-
      Dit besluit treedt in werking met ingang van de eerste dag van de maand volgend op die, waarin het in het
      *Staatsblad* is geplaatst, en kan worden aangehaald als Rijkswachtgeldbesluit 1959.
    url: https://wetten.overheid.nl/BWBR0002326/2019-07-01#Artikel24
  - number: '24.2'
    text: |-
