preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Verkeer en Waterstaat, mede namens Onze Minister van Onderwijs en
    Wetenschappen, van 10 januari 1983, nr. PJ/S 20132, Directoraat-Generaal Scheepvaart en Maritieme Zaken;


    Gelet op artikel 3, tweede lid, onder a, van de Wet op de Zeevischvaartdiploma’s 1935 (Stb. 455);


    De Raad van State gehoord (advies van 6 april 1983, nr. W09.83.0034a/25.3.13);


    Gezien het nader rapport van Onze voornoemde Minister, mede namens Onze Minister van Onderwijs en Wetenschappen van
    15 mei 1986, nr. PJ/S 30928, Directoraat-Generaal Scheepvaart en Maritieme Zaken;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003996/2004-11-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De begripsbepalingen genoemd in artikel 1, eerste lid, van de Wet op de Zeevischvaartdiploma's 1935, *Stb.* 455
      zijn van toepassing.

      2 In dit besluit wordt verstaan onder:

      "Commissie": de Commissie, genoemd in [artikel 2][ref1];

      "voorzitter": de voorzitter, genoemd in [artikel 3, eerste lid][ref2];

      "wet": de Wet op de Zeevischvaartdiploma's 1935, *Stb.* 455;

      "examenprogramma": het examenprogramma zeevisvaart, opgenomen in de bij dit besluit behorende bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0003996#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003996#Artikel3
    url: https://wetten.overheid.nl/BWBR0003996/2004-11-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003996
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003996
        artikel: '3'
        hoofdstuk: I
  - number: '2'
    text: |-
      Er is een Commissie voor de zeevisvaartexamens, die, met het oog op de afgifte van de diploma's en het bewijs,
      genoemd in [artikel 2, eerste lid][ref1], van de wet, examens afneemt ter verkrijging van:

      a. de verklaring van bekendheid met de bepalingen ter voorkoming van aanvaringen op zee S VII;

      b. de verklaring voor de zeevisvaart SW VI;

      c. de verklaring voor de zeevisvaart SW V;

      d. de verklaring voor de zeevisvaart S IV-v;

      e. de verklaring voor de zeevisvaart W IV-v;


      [ref1]: https://wetten.overheid.nl/BWBR0003996#Artikel2
    url: https://wetten.overheid.nl/BWBR0003996/2004-11-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003996
        artikel: '2'
        hoofdstuk: I
  - number: '3'
    text: >-
      1 De Commissie bestaat uit een voorzitter, leden en plaatsvervangende leden. De voorzitter is een door Onze
      Minister aan te wijzen ambtenaar van zijn ministerie. De leden en plaatsvervangende leden treden op als examinator.
      Zij worden voor de tijd van ten hoogste twee jaren benoemd door Onze Minister in overeenstemming met Onze Minister
      van Onderwijs en Wetenschappen en zijn terstond herbenoembaar. Bij de benoeming worden tevens uit de leden een
      of meer plaatsvervangende voorzitters aangewezen. Van iedere benoeming wordt schriftelijk kennis gegeven aan Onze
      Minister van Onderwijs en Wetenschappen.


      2 De leden en plaatsvervangende leden van de Commissie ontvangen uit 's Rijks kas een vergoeding van reis- en
      verblijfkosten overeenkomstig de regelen welke gelden ter zake van reizen in Nederland ten behoeve van het Rijk,
      alsmede, voor zover hun benoeming haar oorzaak niet vindt in het ambt dat zij bekleden, vacatiegelden.
    url: https://wetten.overheid.nl/BWBR0003996/2004-11-01#Artikel3
  - number: '4'
    text: >-
      1 Onze Minister voorziet in het secretariaat van de Commissie en wijst een ambtenaar van zijn ministerie aan als
      secretaris.


      2 De voorzitter wijst een of meer leden aan als plaatsvervangend secretaris van de Commissie.
    url: https://wetten.overheid.nl/BWBR0003996/2004-11-01#Artikel4
  - number: '5'
    text: |-
      De Commissie brengt zo spoedig mogelijk na afloop van een tijdvak als bedoeld in [artikel 7][ref1], aan Onze
      Minister verslag uit betreffende de gehouden examens en zendt een afschrift van dat verslag aan Onze Minister van
      Onderwijs en Wetenschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0003996#Artikel7
    url: https://wetten.overheid.nl/BWBR0003996/2004-11-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003996
        artikel: '7'
        hoofdstuk: II
  - number: '6'
    text: De voorzitter kan nadere aanwijzingen geven voor het functioneren van de Commissie.
    url: https://wetten.overheid.nl/BWBR0003996/2004-11-01#Artikel6
  - number: '7'
    text: >-
      Onze Minister bepaalt, na overleg met Onze Minister van Onderwijs en Wetenschappen, voor een tijdvak van ten
      hoogste een jaar de perioden waarin en de plaats waar de Commissie zitting houdt, alsmede de inschrijfperioden voor
      de examens.
    url: https://wetten.overheid.nl/BWBR0003996/2004-11-01#Artikel7
  - number: '8'
    text: De voorzitter stelt de roosters voor de te houden examens vast.
    url: https://wetten.overheid.nl/BWBR0003996/2004-11-01#Artikel8
  - number: '9'
    text: >-
      1 De voorzitter roept de leden en de plaatsvervangende leden van de Commissie op naarmate de aard en de omvang der
      werkzaamheden hun tegenwoordigheid vereisen.


      2 In het belang van het goed functioneren van de Commissie kan de voorzitter leden en plaatsvervangende leden
      eveneens oproepen met het doel hen in staat te stellen kennis te nemen van nieuwe ontwikkelingen op het gebied van
      navigatie en scheepswerktuigkunde.
    url: https://wetten.overheid.nl/BWBR0003996/2004-11-01#Artikel9
  - number: '10'
    text: >-
      De examens, met uitzondering van het examen ter verkrijging van de verklaring van bekendheid met de bepalingen ter
      voorkoming van aanvaringen op zee S VII, zullen naar verkiezing van de kandidaat worden afgenomen hetzij in hun
      geheel, hetzij in twee delen als aangegeven in het examenprogramma.
    url: https://wetten.overheid.nl/BWBR0003996/2004-11-01#Artikel10
  - number: '11'
    text: |-
      1 Degene die een in [artikel 2][ref1] genoemd examen of een in [artikel 10][ref2] bedoeld deel daarvan wenst af te
      leggen, dient daartoe bij de voorzitter een aanvraag in binnen de in [artikel 7][ref3] bedoelde inschrijfperiode.

      2 Voor toelating tot een examen als bedoeld in [artikel 2, onder ][ref4], dan wel een deel daarvan,
      dient de kandidaat in het bezit te zijn van het bewijs dat hij het eindexamen of examen, bedoeld in
      [artikel 3, tweede lid, onder ][ref5], van de wet, bestemd voor het naast lagere diploma, met goed gevolg heeft
      afgelegd. Indien de kandidaat een examen in twee delen aflegt, dient hij voor de toelating tot deel II van het
      examen tevens in het bezit te zijn van het bewijs dat hij deel I met goed gevolg heeft afgelegd.

      3 Terzake van de behandeling van een aanvraag als bedoeld in het eerste lid, is een vergoeding verschuldigd volgens
      een door Onze Minister vast te stellen tarief.

      4 Bij een aanvraag dient de kandidaat over te leggen:

      a. het bewijs, bedoeld in het tweede lid;

      b. een uittreksel uit het geboorteregister of, ten genoegen van de voorzitter, een identiteitsbewijs;

      c. een bewijs van betaling van de in het derde lid bedoelde vergoeding en

      d. het bewijs dat hij aan een school als bedoeld in
      [artikel 14, eerste lid, van de Wet op het voortgezet onderwijs][ref6] (*Stb.* 1967, 387) het onderwijs in het vak
      visserijkunde met goed gevolg heeft doorlopen.

      5 De kandidaat die valse of vervalste bescheiden overlegt, kan voor ten hoogste een jaar door de voorzitter van
      deelneming aan een examen worden uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0003996#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003996#Artikel10
