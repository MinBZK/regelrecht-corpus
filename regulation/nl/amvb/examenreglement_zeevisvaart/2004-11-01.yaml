  - number: '28'
    text: >-
      Het Reglement voor de stuurliedenexamens Zeevisvaart (*Stb.* 1947, H 443) en het Reglement voor de
      machinistenexamens Zeevisvaart (*Stb.* 1947, H 444) worden ingetrokken met ingang van 1 september 1984.
    url: https://wetten.overheid.nl/BWBR0003996/2004-11-01#Artikel28
  - number: '29'
    text: >-
      Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin het
      wordt geplaatst en werkt terug tot en met 1 september 1982.
    url: https://wetten.overheid.nl/BWBR0003996/2004-11-01#Artikel29
  - number: '30'
    text: Dit besluit kan worden aangehaald als "Examenreglement zeevisvaart".
    url: https://wetten.overheid.nl/BWBR0003996/2004-11-01#Artikel30
