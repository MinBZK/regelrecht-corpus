        artikel: '14'
  - number: '12'
    text: |-
      Onze Minister kan ontheffing of vrijstelling verlenen van het bepaalde in [artikel 11 onder][ref1] zonodig door hem
      te stellen voorwaarden of beperkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003996#Artikel11
    url: https://wetten.overheid.nl/BWBR0003996/2004-11-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003996
        artikel: '11'
        hoofdstuk: III
  - number: '13'
    text: |-
      1 Een in [artikel 2][ref1] genoemd examen of een deel daarvan dient binnen één zittingsperiode als bedoeld in
      [artikel 7][ref2], te worden afgelegd in alle vakken die daarvoor zijn aangegeven in het examenprogramma.

      2 De kennis die wordt gevorderd, is per vak aangegeven in het examenprogramma.

      3 Onze Minister kan, na overleg met Onze Minister van Onderwijs en Wetenschappen, aan de bezitters van door hem aan
      te wijzen diploma's vrijstelling verlenen van een of meer vakken van een examen.

      4 In het examenprogramma is per vak of gedeelte daarvan aangegeven of het examen daarin schriftelijk, mondeling of
      praktisch wordt afgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003996#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003996#Artikel7
    url: https://wetten.overheid.nl/BWBR0003996/2004-11-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003996
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003996
        artikel: '7'
        hoofdstuk: II
  - number: '14'
    text: >-
      1 De voorzitter stelt, in overleg met de betrokken examinatoren, de opgaven voor het schriftelijk gedeelte van een
      examen vast.


      2 Het schriftelijk examenwerk wordt gemaakt op vanwege de Commissie uit te reiken gewaarmerkt papier.


      3 De kandidaten mogen bij het schriftelijk gedeelte van het examen in het examenlokaal niets anders meebrengen dan
      schrijfgerei en vanwege de Commissie uitdrukkelijk toegestane andere benodigdheden.


      4 Bij het schriftelijk en praktisch examen zijn in elk lokaal waar examen wordt afgenomen, zoveel leden van de
      Commissie voor het houden van toezicht aanwezig, als door de voorzitter voldoende of noodzakelijk wordt geacht.


      5 De kandidaat levert al het gebruikte papier in bij een der toezichthoudende leden.
    url: https://wetten.overheid.nl/BWBR0003996/2004-11-01#Artikel14
  - number: '15'
    text: >-
      1 Bij elk mondeling examen is, naast de examinator, ten minste één ander lid der Commissie als bijzitter
      tegenwoordig. De bijzitter houdt aantekening van de inhoud en het verloop van het examen van iedere kandidaat.


      2 Een examen dat mondeling wordt afgenomen, is openbaar.


      3 De voorzitter kan regels en aanwijzingen geven voor het ordelijk verloop van een mondeling examen.


      4 De voorzitter kan een toehoorder die zich niet naar de in het derde lid bedoelde regels en aanwijzingen gedraagt,
      het verblijf in het examenlokaal ontzeggen.
    url: https://wetten.overheid.nl/BWBR0003996/2004-11-01#Artikel15
  - number: '16'
    text: >-
      1 Tijdens een examen mogen de kandidaten niet met elkaar spreken, noch elkaars werk bekijken, of, anders dan met
      door of vanwege de voorzitter gegeven toestemming, het examenlokaal verlaten of iets van elkaar lenen.


      2 De kandidaten dienen zich tijdens het examen te gedragen naar de door of vanwege de voorzitter gegeven
      aanwijzingen.


      3 Gedragingen van een kandidaat in strijd met het bepaalde in het eerste en tweede lid, gedragingen die storend
      werken op het verloop van het examen, bedrog of een poging daartoe kunnen, zulks ter beoordeling van de voorzitter,
      uitsluiting van verdere deelneming aan het examen tot gevolg hebben.
    url: https://wetten.overheid.nl/BWBR0003996/2004-11-01#Artikel16
  - number: '17'
    text: >-
      1 Het oordeel over het in elk vak of gedeelte daarvan afgelegde examen wordt uitgedrukt in gehele cijfers, waarvan
      het laagste cijfer 1 en het hoogste cijfer 10 is.


      2 Wanneer het examen in een vak uit meer dan een gedeelte bestaat, wordt het eindcijfer voor dat vak bepaald
      door het gemiddelde van de bij die gedeelten behaalde cijfers, waarbij breuken van een half of meer naar boven en
      breuken van minder dan een half naar beneden worden afgerond.
    url: https://wetten.overheid.nl/BWBR0003996/2004-11-01#Artikel17
  - number: '18'
    text: >-
      1 Onze Minister stelt, ter bepaling van de uitslag van de examens, normen vast.


      2 De Commissie bepaalt aan de hand van deze normen of een kandidaat is geslaagd of afgewezen, dan wel in welke
      vakken hij herexamens kan doen.
    url: https://wetten.overheid.nl/BWBR0003996/2004-11-01#Artikel18
  - number: '19'
    text: |-
      1 Een kandidaat die niet voldoet aan de normen om te slagen, kan een herexamen afleggen, indien hij daardoor alsnog
      aan die normen kan voldoen.

      2 Een herexamen kan ten hoogste het aantal vakken omvatten dat hieronder is aangegeven:

      1. Verklaring voor de zeevisvaart SW VI (geheel): 4

      2. Verklaring voor de zeevisvaart SW VI (deel I): 2

      3. Verklaring voor de zeevisvaart SW VI (deel II): 2

      4. Verklaring voor de zeevisvaart SW v (geheel): 4

      5. Verklaring voor de zeevisvaart SW v (deel I): 1

      6. Verklaring voor de zeevisvaart SW v (deel II): 3

      7. Verklaring voor de zeevisvaart S IV-v (geheel): 4

      8. Verklaring voor de zeevisvaart S IV-v (deel I): 2

      9. Verklaring voor de zeevisvaart S IV-v (deel II): 2

      10. Verklaring voor de zeevisvaart W IV-v (geheel): 3

      11. Verklaring voor de zeevisvaart W IV-v (deel I): 1

      12. Verklaring voor de zeevisvaart W IV-v ([deel II][ref1]): 2


      [ref1]: https://wetten.overheid.nl/BWBR0003996#Artikel19
    url: https://wetten.overheid.nl/BWBR0003996/2004-11-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003996
        artikel: '19'
        hoofdstuk: IV
  - number: '20'
    text: |-
      1 Een herexamen dient binnen een jaar nadat de Commissie heeft bepaald dat de kandidaat hiervoor in aanmerking
      komt, te worden afgelegd op een, na ontvangst van de aanvraag daarvoor, door de voorzitter te bepalen tijdstip. De
      aanvraag dient uiterlijk een maand voor het verstrijken van de periode van een jaar te zijn ingediend.

      2 Op de aanvraag voor het herexamen is [artikel 11][ref1] van overeenkomstige toepassing.

      3 Indien een herexamen niet tijdig is afgelegd of indien, na het afleggen daarvan, blijkt dat niet is voldaan aan
      de normen om te slagen, wordt de kandidaat afgewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003996#Artikel11
    url: https://wetten.overheid.nl/BWBR0003996/2004-11-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003996
        artikel: '11'
        hoofdstuk: III
  - number: '21'
    text: |-
      1 Wordt een kandidaat ingevolge het bepaalde in [artikel 16, derde lid][ref1], uitgesloten van verdere deelneming
      aan een examen of trekt hij zich tijdens een examen terug, dan wordt hij beschouwd te zijn afgewezen.

      2 Indien een kandidaat zich tijdens het examen terugtrekt vindt het bepaalde in het eerste lid geen toepassing als
      zulks, naar het oordeel van de voorzitter, het gevolg is van overmacht.

      3 Indien de voorzitter ingevolge het bepaalde in het tweede lid van oordeel is dat de kandidaat zich heeft
      teruggetrokken als gevolg van overmacht, bepaalt hij op welk tijdstip de kandidaat het examen alsnog kan voltooien.


      [ref1]: https://wetten.overheid.nl/BWBR0003996#Artikel16
    url: https://wetten.overheid.nl/BWBR0003996/2004-11-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003996
        artikel: '16'
        hoofdstuk: IV
  - number: '22'
    text: |-
      1 Degene die voor de eerste maal een examen of een deel daarvan aflegt in overeenstemming met
      [artikel 13, eerste lid][ref1], en wordt afgewezen, behoeft de eerstvolgende keer dat hij eenzelfde examen of
      eenzelfde deel daarvan aflegt niet nogmaals examen af te leggen in de vakken waarvoor hij reeds het eindcijfer 6 of
      hoger had behaald, mits dit examen binnen twee jaar na de afwijzing wordt afgelegd; het reeds behaalde eindcijfer
      zal dan op de nieuwe cijferlijst worden overgenomen.

      2 Op de kandidaat die ten tweede male is afgewezen voor eenzelfde examen of eenzelfde deel daarvan, afgelegd binnen
      twee jaar na de eerste afwijzing, is de eerstvolgende keer dat hij eenzelfde examen of eenzelfde deel daarvan
      aflegt, het eerste lid weer van toepassing.

      3 Op de aanvraag voor eenzelfde examen of deel daarvan als bedoeld in het eerste lid, is [artikel 11][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003996#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003996#Artikel11
    url: https://wetten.overheid.nl/BWBR0003996/2004-11-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003996
        artikel: '13'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003996
        artikel: '11'
        hoofdstuk: III
  - number: '23'
    text: Onze Minister stelt de modellen vast van de krachtens dit besluit uit te reiken verklaringen.
    url: https://wetten.overheid.nl/BWBR0003996/2004-11-01#Artikel23
  - number: '24'
    text: De voorzitter reikt aan de geslaagde kandidaat de desbetreffende verklaring uit.
    url: https://wetten.overheid.nl/BWBR0003996/2004-11-01#Artikel24
  - number: '25'
    text: >-
      Indien blijkt, dat de kandidaat tijdens het examen bedrog heeft gepleegd of zich aan een andere onregelmatigheid
      heeft schuldig gemaakt, kan de voorzitter, na overleg met de Commissie, de kandidaat de verklaring onthouden of een
      reeds uitgereikte verklaring intrekken.
    url: https://wetten.overheid.nl/BWBR0003996/2004-11-01#Artikel25
  - number: '26'
    text: >-
      Een duplicaat van een uitgereikte verklaring wordt slechts afgegeven, indien de belanghebbende aannemelijk kan
      maken, dat de oorspronkelijke verklaring verloren is geraakt. Tenzij de oorspronkelijke verklaring verloren is
      geraakt ten gevolge van een oorlogsdaad, een scheepsramp of daarmee vergelijkbare omstandigheid, is voor een
      duplicaat een vergoeding verschuldigd volgens een door Onze Minister vast te stellen tarief.
    url: https://wetten.overheid.nl/BWBR0003996/2004-11-01#Artikel26
  - number: '27'
    text: |-
      1 De voorzitter legt zijn beslissing als bedoeld in de [artikelen 11, vijfde lid][ref1], [16, derde lid][ref2],
      [21, tweede lid][ref3], en [25][ref4], binnen twee weken vast in een beschikking en geeft van deze beschikking
      kennis aan Onze Minister door toezending van een afschrift.

      2 Tegen een beschikking van de voorzitter als bedoeld in het eerste lid kan de belanghebbende beroep instellen bij
      Onze Minister.

      3 De Commissie handelt overeenkomstig de door Onze Minister genomen beslissing.


      [ref1]: https://wetten.overheid.nl/BWBR0003996#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003996#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003996#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0003996#Artikel25
    url: https://wetten.overheid.nl/BWBR0003996/2004-11-01#Artikel27
