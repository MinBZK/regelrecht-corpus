  - number: '8'
    text: |-
      Onze Minister kan een bijdragevaststelling intrekken of ten nadele van de ontvanger wijzigen:

      a. op grond van feiten of omstandigheden waarvan Onze Minister bij de bijdragevaststelling redelijkerwijs niet op
      de hoogte kon zijn en op grond waarvan de bijdrage lager zou zijn vastgesteld, of

      b. indien de bijdragevaststelling onjuist was en de ontvanger dit wist of behoorde te weten.
    url: https://wetten.overheid.nl/BWBR0013371/2006-03-08#Artikel8
  - number: '9'
    text: |-
      Het Besluit rijksbijdragen gemeenten bij rampen en zware ongevallen en het Besluit rijksbijdragen bijstandskosten
      gemeenten en regionale brandweren worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0013371/2006-03-08#Artikel9
  - number: '10'
    text: |-
      Dit besluit treedt in werking met ingang van de eerste dag van de tweede kalendermaand na de datum van uitgifte van
      het Staatsblad waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0013371/2006-03-08#Artikel10
  - number: '11'
    text: 'Dit besluit wordt aangehaald als: Besluit rijksbijdragen bijstands- en bestrijdingskosten.'
