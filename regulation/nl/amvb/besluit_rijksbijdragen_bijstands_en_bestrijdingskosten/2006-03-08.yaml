  - number: '4'
    text: |-
      1 Onze Minister verleent op aanvraag een bijdrage in de kosten die voortvloeien uit het verlenen van bijstand
      bij de bestrijding van rampen en zware ongevallen in België of Duitsland ingevolge de met deze landen gesloten
      overeenkomsten.

      2 De aanvraag kan worden ingediend door bij de bijstand betrokken gedeputeerde staten, colleges van burgemeester
      en wethouders, besturen van regionale brandweren, centrale posten ambulancevervoer, intergemeentelijke
      gezondheidsdiensten, het Nederlandse Rode Kruis, particuliere ambulancevervoeders, of ziekenhuizen die een mobiel
      medisch team ter beschikking hebben gesteld. De aanvraag wordt ingediend door tussenkomst van Onze Commissaris van
      de Koningin van de betrokken provincie.

      3 Voor een bijdrage als bedoeld in het eerste lid, komen in aanmerking:

      a. de kosten van het personeel;

      b. de kosten van vervanging van verbruiksgoederen;

      c. de kosten van vervanging van het geheel of gedeeltelijk verloren gegaan materieel;

      d. de kosten van reparatie en onderhoud;

      e. de kosten van huisvesting of verzorging van het personeel die binnen of buiten Nederland zijn gemaakt;

      f. de kosten van verzekering voor optreden in het buitenland onder rampsituaties, voor zover dekking van ook dat
      optreden niet reeds onderdeel van de gebruikelijke verzekeringsvoorwaarden is.
    url: https://wetten.overheid.nl/BWBR0013371/2006-03-08#Artikel4
  - number: '5'
    text: |-
      1 De aanvragen, bedoeld in de [artikelen 2][ref1], [3][ref2] en [4][ref3], worden uiterlijk twaalf maanden na het
      einde van de bijstandsverlening of de bestrijding van de ramp of het zware ongeval en de gevolgen daarvan ingediend
      bij Onze Minister.

      2 De aanvraag gaat vergezeld van de opgave van de kosten, welke is voorzien van bewijsstukken, alsmede een verslag
      van de gebeurtenissen.

      3 Kosten waarvan de hoogte nog niet is vast te stellen worden geraamd.


