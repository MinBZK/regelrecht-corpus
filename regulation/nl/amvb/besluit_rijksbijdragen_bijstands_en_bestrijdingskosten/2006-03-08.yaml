        artikel: '9'
  - number: '2'
    text: |-
      1 Onze Minister verleent op aanvraag van het college van burgemeester en wethouders van een gemeente of van het
      bestuur van een regionale brandweer een bijdrage in de kosten die voor de gemeente of de regionale brandweer
      voortvloeien uit de verlening van bijstand, voor zover die kosten een bedrag van € 4500,– te boven gaan.

      2 Voor een bijdrage als bedoeld in het eerste lid, komen in aanmerking:

      a. de kosten van het personeel;

      b. de kosten van vervanging van verbruiksgoederen;

      c. de kosten van vervanging van het geheel of gedeeltelijk verloren gegaan materieel;

      d. de kosten van reparatie en onderhoud.

      3 Indien bijstand is verleend in het kader van de bestrijding van een ramp of zwaar ongeval en de gevolgen daarvan,
      wordt de aanvraag, bedoeld in het eerste lid, ingediend door tussenkomst van de gemeente waaraan de bijstand is
      verleend.
    url: https://wetten.overheid.nl/BWBR0013371/2006-03-08#Artikel2
  - number: '3'
    text: |-
      1 Onze Minister verleent op aanvraag van het college van burgemeester en wethouders een bijdrage in de kosten
      die een gemeente heeft gemaakt in verband met de daadwerkelijke bestrijding van een ramp of zwaar ongeval en de
      gevolgen daarvan.

      2 De bijdrage wordt berekend op grond van de kosten die voortvloeien uit de daadwerkelijke bestrijding van de ramp
      of het zware ongeval en de gevolgen daarvan, verminderd met:

      a. de kosten waarvoor de gemeente uit andere hoofde een bijdrage heeft verkregen of kan verkrijgen;

      b. de kosten die een gemeente of een regio in rekening brengt voor de verlening van bijstand;

      c. de uitkomst van de vermenigvuldiging van het aantal inwoners van de gemeente volgens de door het Centraal Bureau
      voor de Statistiek openbaar gemaakte bevolkingscijfers per 1 januari van het jaar waarin de ramp of het zware
      ongeval heeft plaatsgevonden met € 3,-.

      3 Geen bijdrage wordt toegekend, indien de kosten, bedoeld in het tweede lid, aanhef, onder a en b, € 45 000,– of
      minder bedragen.

      4 Indien in een gemeente in een kalenderjaar meerdere rampen of zware ongevallen plaatsvinden, worden het tweede
      lid, onderdeel c, en het derde lid slechts eenmaal toegepast.

      5 Indien de gemeente verkeert of door toepassing van het tweede of derde lid zou komen te verkeren in de situatie,
      bedoeld in [artikel 12 van de Financiële-verhoudingswet][ref1], kan Onze Minister in overeenstemming met Onze
      Minister van Financiën op verzoek van het college van burgemeester en wethouders het ten laste van de gemeente
      komend aandeel in de kosten op een lager bedrag vaststellen dan wel bepalen dat door de gemeente geen aandeel in de
      kosten verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel12
    url: https://wetten.overheid.nl/BWBR0013371/2006-03-08#Artikel3
