  - number: '6'
    text: Onze Minister beslist binnen zes maanden na indiening van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0013371/2006-03-08#Artikel6
  - number: '7'
    text: |-
      1 Op verzoek van de aanvrager kan Onze Minister een voorschot verlenen op de bijdragen, bedoeld in de
      [artikelen 2][ref1], [3][ref2] en [4][ref3].

      2 Het verzoek gaat vergezeld van een voorlopige opgave van de kosten.


