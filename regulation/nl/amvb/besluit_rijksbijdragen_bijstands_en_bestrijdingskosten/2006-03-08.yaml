  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties van 27 november 2001, nr.
    EB2001/97219;

    Gelet op artikel 11, tweede lid, van de Brandweerwet 1985 en artikel 25, derde lid, van de Wet rampen en zware
    ongevallen;

    De Raad van State gehoord (advies van 8 januari 2002, nr. W04/01.0637/I);

    Gezien het nader rapport van de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties van 16 januari 2002,
    nr. EB2002/51992;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0013371/2006-03-08#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      b. bijstand: de bijstand, bedoeld in de[ artikelen 8, eerste lid][ref1], en
      [9, tweede lid, van de Brandweerwet 1985][ref2];

      c. kosten: de kosten voor bijstand of de bestrijding van een ramp of zwaar ongeval die niet in de begroting van het
      jaar waarin de ramp of het zware ongeval heeft plaatsgevonden hadden kunnen worden voorzien;

      d. overeenkomsten: de op 14 november 1984 te Den Haag tot stand gekomen Overeenkomst tussen het Koninkrijk der
      Nederlanden en het Koninkrijk België inzake wederzijdse bijstandsverlening bij het bestrijden van rampen en
      ongevallen (Trb. 1984, nr. 155) en de op 7 juni 1988 te Bonn tot stand gekomen Overeenkomst tussen het Koninkrijk
      der Nederlanden en de Bondsrepubliek Duitsland inzake wederzijdse bijstandsverlening bij het bestrijden van rampen,
      zware ongevallen daaronder begrepen (Trb. 1988, nr. 95).


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003764#Artikel9
    url: https://wetten.overheid.nl/BWBR0013371/2006-03-08#Artikel1
    references:
