---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_rijksbijdragen_bijstands_en_bestrijdingskosten
regulatory_layer: AMVB
publication_date: '2012-09-19'
valid_from: '2013-01-01'
bwb_id: BWBR0013371
url: https://wetten.overheid.nl/BWBR0013371/2013-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties van 27 november 2001, nr.
    EB2001/97219;

    Gelet op artikel 11, tweede lid, van de Brandweerwet 1985 en artikel 25, derde lid, van de Wet rampen en zware
    ongevallen;

    De Raad van State gehoord (advies van 8 januari 2002, nr. W04/01.0637/I);

    Gezien het nader rapport van de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties van 16 januari 2002,
    nr. EB2002/51992;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel1
  - number: 1.b
    text: |-
      *bijstand:* bijstand door een veiligheidsregio als bedoeld in
      [artikel 51, eerste lid, van de Wet veiligheidsregio’s][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel51
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '51'
  - number: 1.c
    text: |-
      kosten: de kosten voor bijstand of de bestrijding van een ramp die niet in de begroting van het jaar waarin de ramp
      heeft plaatsgevonden hadden kunnen worden voorzien;
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel1
  - number: 1.d
    text: |-
      overeenkomsten: de op 14 november 1984 te Den Haag tot stand gekomen Overeenkomst tussen het Koninkrijk der
      Nederlanden en het Koninkrijk België inzake wederzijdse bijstandsverlening bij het bestrijden van rampen en
      ongevallen (Trb. 1984, nr. 155) en de op 7 juni 1988 te Bonn tot stand gekomen Overeenkomst tussen het Koninkrijk
      der Nederlanden en de Bondsrepubliek Duitsland inzake wederzijdse bijstandsverlening bij het bestrijden van rampen,
      zware ongevallen daaronder begrepen (Trb. 1988, nr. 95).
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel1
  - number: '2.1'
    text: |-
      Onze Minister verleent op aanvraag van het bestuur van de veiligheidsregio een bijdrage voor de kosten die voor de
      regionale brandweer voortvloeien uit de verlening van bijstand, voor zover die kosten een bedrag van € 4500,– te
      boven gaan.
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel2
  - number: '2.2'
    text: 'Voor een bijdrage als bedoeld in het eerste lid, komen in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel2
  - number: 2.2.a
    text: de kosten van het personeel;
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel2
  - number: 2.2.b
    text: de kosten van vervanging van verbruiksgoederen;
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel2
  - number: 2.2.c
    text: de kosten van vervanging van het geheel of gedeeltelijk verloren gegaan materieel;
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel2
  - number: 2.2.d
    text: de kosten van reparatie en onderhoud.
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel2
  - number: '2.3'
    text: |-
      Indien bijstand is verleend in het kader van de bestrijding van een ramp en de gevolgen daarvan, wordt de aanvraag,
      bedoeld in het eerste lid, ingediend door tussenkomst van de gemeente waaraan de bijstand is verleend.
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel2
  - number: '3.1'
    text: |-
      Onze Minister verleent op aanvraag van het college van burgemeester en wethouders een bijdrage in de kosten die een
      gemeente heeft gemaakt in verband met de daadwerkelijke bestrijding van een ramp en de gevolgen daarvan.
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel3
  - number: '3.2'
    text: |-
      De bijdrage wordt berekend op grond van de kosten die voortvloeien uit de daadwerkelijke bestrijding van de ramp en
      de gevolgen daarvan, verminderd met:
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel3
  - number: 3.2.a
    text: de kosten waarvoor de gemeente uit andere hoofde een bijdrage heeft verkregen of kan verkrijgen;
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel3
  - number: 3.2.b
    text: de kosten die een veiligheidsregio in rekening brengt voor de verlening van bijstand;
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel3
  - number: 3.2.c
    text: |-
      de uitkomst van de vermenigvuldiging van het aantal inwoners van de gemeente volgens de door het Centraal
      Bureau voor de Statistiek openbaar gemaakte bevolkingscijfers per 1 januari van het jaar waarin de ramp heeft
      plaatsgevonden met € 3,-.
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel3
  - number: '3.3'
    text: |-
      Geen bijdrage wordt toegekend, indien de kosten, bedoeld in het tweede lid, aanhef, onder a en b, € 45 000,– of
      minder bedragen.
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel3
  - number: '3.4'
    text: |-
      Indien in een gemeente in een kalenderjaar meerdere rampen of zware ongevallen plaatsvinden, worden het tweede lid,
      onderdeel c, en het derde lid slechts eenmaal toegepast.
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel3
  - number: '3.5'
    text: |-
      Indien de gemeente verkeert of door toepassing van het tweede of derde lid zou komen te verkeren in de situatie,
      bedoeld in [artikel 12 van de Financiële-verhoudingswet][ref1], kan Onze Minister in overeenstemming met Onze
      Minister van Financiën op verzoek van het college van burgemeester en wethouders het ten laste van de gemeente
      komend aandeel in de kosten op een lager bedrag vaststellen dan wel bepalen dat door de gemeente geen aandeel in de
      kosten verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel12
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: '12'
  - number: '4.1'
    text: |-
      Onze Minister verleent op aanvraag een bijdrage in de kosten die voortvloeien uit het verlenen van bijstand bij de
      bestrijding van rampen in België of Duitsland ingevolge de met deze landen gesloten overeenkomsten.
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel4
  - number: '4.2'
    text: |-
      De aanvraag kan worden ingediend door de colleges van burgemeester en wethouders, de besturen
      van de veiligheidsregio’s, het Nederlandse Rode Kruis, alsmede de in de regio werkzame
      instellingen, zorgaanbieders, Regionale Ambulancevoorzieningen en gezondheidsdiensten, bedoeld in
      [artikel 33, eerste lid, van de Wet veiligheidsregio’s][ref1], die bij de bijstand waren betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel33
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '33'
  - number: '4.3'
    text: 'Voor een bijdrage als bedoeld in het eerste lid, komen in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel4
  - number: 4.3.a
    text: de kosten van het personeel;
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel4
  - number: 4.3.b
    text: de kosten van vervanging van verbruiksgoederen;
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel4
  - number: 4.3.c
    text: de kosten van vervanging van het geheel of gedeeltelijk verloren gegaan materieel;
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel4
  - number: 4.3.d
    text: de kosten van reparatie en onderhoud;
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel4
  - number: 4.3.e
    text: de kosten van huisvesting of verzorging van het personeel die binnen of buiten Nederland zijn gemaakt;
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel4
  - number: 4.3.f
    text: |-
      de kosten van verzekering voor optreden in het buitenland onder rampsituaties, voor zover dekking van ook dat
      optreden niet reeds onderdeel van de gebruikelijke verzekeringsvoorwaarden is.
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel4
  - number: '5.1'
    text: |-
      De aanvragen, bedoeld in de [artikelen 2][ref1], [3][ref2] en [4][ref3], worden uiterlijk twaalf maanden na het
      einde van de bijstandsverlening of de bestrijding van de ramp en de gevolgen daarvan ingediend bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0013371#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013371#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013371#Artikel4
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013371
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013371
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0013371
        artikel: '4'
        paragraaf: '3'
  - number: '5.2'
    text: |-
      De aanvraag gaat vergezeld van de opgave van de kosten, welke is voorzien van bewijsstukken, alsmede een verslag
      van de gebeurtenissen.
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel5
  - number: '5.3'
    text: Kosten waarvan de hoogte nog niet is vast te stellen worden geraamd.
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel5
  - number: '6'
    text: Onze Minister beslist binnen zes maanden na indiening van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel6
  - number: '8'
    text: 'Onze Minister kan een bijdragevaststelling intrekken of ten nadele van de ontvanger wijzigen:'
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel8
  - number: 8.a
    text: |-
      op grond van feiten of omstandigheden waarvan Onze Minister bij de bijdragevaststelling redelijkerwijs niet op de
      hoogte kon zijn en op grond waarvan de bijdrage lager zou zijn vastgesteld, of
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel8
  - number: 8.b
    text: indien de bijdragevaststelling onjuist was en de ontvanger dit wist of behoorde te weten.
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel8
  - number: '9'
    text: |-
      Het Besluit rijksbijdragen gemeenten bij rampen en zware ongevallen en het Besluit rijksbijdragen bijstandskosten
      gemeenten en regionale brandweren worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel9
  - number: 10a
    text: |-
      Dit besluit berust op [artikel 55, vijfde lid, van de Wet veiligheidsregio’s][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel55
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '55'
  - number: '10'
    text: |-
      Dit besluit treedt in werking met ingang van de eerste dag van de tweede kalendermaand na de datum van uitgifte van
      het Staatsblad waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel10
  - number: '11'
    text: 'Dit besluit wordt aangehaald als: Besluit rijksbijdragen bijstands- en bestrijdingskosten.'
    url: https://wetten.overheid.nl/BWBR0013371/2013-01-01#Artikel11
