  - number: '7'
    text: |-
      1 Personen van groep B, wier dienstverband niet tot doorlopende werkelijke dienst verplicht, worden ongeschikt
      geacht voor de dienst bij het korps, het wapen, de dienstgroep, het dienstvak - of onderdeel daarvan - of
      dergelijke, waarvoor zij zich hebben verbonden of waarbij zij zijn benoemd, indien zij zijn komen te verkeren in
      een der gevallen, bedoeld in [het eerste lid van artikel 5][ref1], tenzij herstel van de tekortkoming, welke die
      ongeschiktheid zou veroorzaken, binnen korte tijd mogelijk moet worden geacht.

      2 Zijn zij in werkelijke dienst of in werkelijke dienst geweest, dan worden zij ondanks de aanwezigheid van
      een afwijking, onderscheidenlijk ondanks het feit, dat zij niet voldoen aan de bijzondere eisen, bedoeld in
      [artikel 5, eerste lid onder ][ref2], niet ongeschikt geacht, indien moet worden verwacht, dat die afwijking,
      onderscheidenlijk het niet voldoen aan die eisen, hen niet zal verhinderen de dienst bij het korps, het wapen, de
      dienstgroep, het dienstvak - of onderdeel daarvan - of dergelijke, waarvoor zij zich hebben verbonden of waarbij
      zij zijn benoemd, naar behoren te verrichten zonder hun gezondheid of die van anderen te schaden.

      3 In het geval, bedoeld in het tweede lid, berust de beslissing bij de hoogste geneeskundige autoriteit voor de
      zee-, de land- of de luchtmacht.


      [ref1]: https://wetten.overheid.nl/BWBR0002346#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002346#Artikel5
    url: https://wetten.overheid.nl/BWBR0002346/1986-01-01#Artikel7
