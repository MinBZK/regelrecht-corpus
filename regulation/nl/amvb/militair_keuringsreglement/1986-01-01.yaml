  - number: '8'
    text: |-
      1 Personen van groep B, wier dienstverband tot doorlopende werkelijke dienst verplicht, worden, ongeacht of zij al
      of niet reeds in werkelijke dienst zijn of zijn geweest, ongeschikt geacht voor de dienst bij het korps, het wapen,
      de dienstgroep, het dienstvak - of onderdeel daarvan - of dergelijke, waarvoor zij zich hebben verbonden of waarbij
      zij zijn benoemd, indien zij een afwijking hebben, welke moet worden geoordeeld ongeneeslijk te zijn of waarvan de
      genezing vruchteloos is beproefd, onderscheidenlijk indien zij, ook na geneeskundige behandeling, niet meer voldoen
      aan de bijzondere eisen, bedoeld in [artikel 5, eerste lid onder ][ref1], tenzij moet worden verwacht, dat die
      afwijking, onderscheidenlijk het niet voldoen aan die eisen, hen niet zal verhinderen die dienst naar behoren te
      verrichten zonder hun gezondheid of die van anderen te schaden.

      2 In het geval, bedoeld in het eerste lid, berust de beslissing bij de hoogste geneeskundige autoriteit voor de
      zee-, de land- of de luchtmacht.


      [ref1]: https://wetten.overheid.nl/BWBR0002346#Artikel5
    url: https://wetten.overheid.nl/BWBR0002346/1986-01-01#Artikel8
