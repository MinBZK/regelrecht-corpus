preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze minister van defensie van 4 juni 1960, no. 659797/657959;

    Overwegende:

    dat het - onder meer in verband met de omstandigheid, dat de Koninklijke luchtmacht een afzonderlijk deel van
    de krijgsmacht is geworden - noodzakelijk is enige wijzigingen aan te brengen in het Militair keuringsreglement
    (Koninklijk besluit van 24 augustus 1949, Stb. J 404), terwijl ook de lijst, welke bij dat reglement behoort,
    herziening behoeft;

    dat het wenselijk is het gehele reglement opnieuw vast te stellen;

    Gelet op:

    de Dienstplichtwet (Stb. 1922, 43);

    de Militaire Ambtenarenwet 1931 (Stb. 1931, 519);

    de Wet bevordering en ontslag beroepsofficieren (Stb. 1954, 575);

    de Wet voor het reserve-personeel der krijgsmacht (Stb. 1954, 576);

    de Pensioenwet voor de zeemacht 1922 (Stb. 1922, 65);

    de Pensioenwet voor de landmacht 1922 (Stb. 1922, 66)

    de Pensioenwet voor het personeel der Koninklijke marinereserve 1923 (Stb. 1923, 355);

    de Pensioenwet voor het reserve-personeel der landmacht 1923 (Stb. 1923, 356);

    de Pensioenwet voor de vrijwilligers bij de landstorm (Stb. 1925, 278);

    De Raad van State gehoord (advies van 5 juli 1960, no. 42);

    Gezien het nader rapport van Onze voornoemde minister van defensie van 10 augustus 1960, no. 750710/657959;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002346/1986-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De geschiktheid of ongeschiktheid voor de militaire dienst in verband met ziekten of gebreken wordt onderzocht en
      beoordeeld naar de bepalingen van dit besluit.

      2 Zij, die bij het geneeskundige onderzoek niet ongeschikt worden bevonden, worden geacht geschikt te zijn.

      3 Zij, die de vereiste geschiktheid missen, doch te wier aanzien een heelkundige kunstbewerking uitzicht zou geven
      op het verkrijgen of herkrijgen van de geschiktheid, worden ongeschikt geacht, indien zij er niet in toestemmen die
      kunstbewerking te ondergaan.
    url: https://wetten.overheid.nl/BWBR0002346/1986-01-01#Artikel1
  - number: '2'
    text: |-
      Dit besluit verstaat onder:

      a. Onze minister: Onze minister van defensie;

      b. afwijking: een der ziekten of gebreken, vermeld in de bijlage van dit besluit.
    url: https://wetten.overheid.nl/BWBR0002346/1986-01-01#Artikel2
  - number: '3'
    text: |-
      1 Voor de toepassing van dit besluit worden de te onderzoeken personen onderscheiden in twee groepen, te weten:

      groep A: ingeschrevenen voor de dienstplicht en dienstplichtigen;

      groep B: zij, die krachtens een vrijwillige verbintenis of een benoeming bij de krijgsmacht dienen of wensen te
      dienen, daaronder begrepen zij, die een verbintenis hebben aangegaan als bedoeld in artikel 3, vierde lid, van de
      Dienstplichtwet, en zij, die een zodanige verbintenis wensen aan te gaan.

      2 Zij, die zowel tot groep A als tot groep B behoren, worden gerangschikt:

      onder groep A: indien het gaat om de geschiktheid voor de dienstplicht;

      onder groep B: indien het gaat om de geschiktheid als vrijwilliger.
    url: https://wetten.overheid.nl/BWBR0002346/1986-01-01#Artikel3
  - number: '4'
    text: |-
      1 Personen van groep A worden ongeschikt geacht, indien zij:

      a. een afwijking hebben, waarvan herstel binnen korte tijd niet mogelijk moet worden geacht; of

      b. geen afwijking hebben, doch hun lichamelijke of geestelijke gesteldheid niettemin doet verwachten, dat zij
      niet zullen voldoen aan de eisen van de dienst of niet bestand zullen zijn tegen de vermoeienissen, verbonden aan
      de dienst.

      2 Zijn zij in werkelijke dienst of in werkelijke dienst geweest, dan worden zij, ondanks de aanwezigheid van een
      afwijking als bedoeld in het eerste lid onder *a*, niet ongeschikt geacht, indien moet worden verwacht, dat de
      afwijking hen niet zal verhinderen de dienst naar behoren te verrichten zonder hun gezondheid of die van anderen
      te schaden.

      3 In het geval, bedoeld in het tweede lid, berust de beslissing bij de hoogste geneeskundige autoriteit voor de
      zee-, de land- of de luchtmacht.
    url: https://wetten.overheid.nl/BWBR0002346/1986-01-01#Artikel4
  - number: '5'
    text: |-
      1 Personen van groep B worden ongeschikt geacht voor de dienst bij het korps, het wapen, de dienstgroep, het
      dienstvak - of onderdeel daarvan - of dergelijke, waarvoor zij in aanmerking wensen te komen, indien zij:

      a. een afwijking hebben of verkeren in een toestand, die een afwijking doet vermoeden; of

      b. geen afwijking hebben, doch hun lichamelijke of geestelijke gesteldheid niettemin doet verwachten, dat zij niet
      zullen voldoen aan de eisen van de dienst of niet bestand zullen zijn tegen de vermoeienissen, verbonden aan de
      dienst; of

      c. niet voldoen aan de bijzondere eisen, welke door of vanwege Onze minister voor de dienst, bedoeld in de aanhef
      van dit artikel, mochten zijn gesteld.

      2 Zijn zij in werkelijke dienst of in werkelijke dienst geweest, dan kunnen zij, ondanks de aanwezigheid van een
      afwijking, onderscheidenlijk ondanks het feit, dat zij niet voldoen aan de bijzondere eisen, bedoeld in het eerste
      lid, onder *c*, geschikt worden geacht voor de dienst bij het korps, het wapen, de dienstgroep, het dienstvak - of
      onderdeel daarvan - of dergelijke, waarvoor zij in aanmerking wensen te komen, indien moet worden verwacht, dat die
      afwijking, onderscheidenlijk het niet voldoen aan die eisen, hen niet zal verhinderen die dienst naar behoren te
      verrichten zonder hun gezondheid of die van anderen te schaden.

      3 In het geval, bedoeld in het tweede lid, berust de beslissing bij de hoogste geneeskundige autoriteit voor de
      zee-, de land- of de luchtmacht.
    url: https://wetten.overheid.nl/BWBR0002346/1986-01-01#Artikel5
  - number: '6'
    text: |-
      1 Onze minister kan bepalen, dat een gegadigde kan volstaan met een door Onze minister aan te geven lagere graad
      van geschiktheid dan zou worden geëist volgens [artikel 5, eerste lid][ref1], mits moet worden verwacht, dat de
      beperkte geschiktheid de gegadigde niet zal verhinderen de aldaar bedoelde dienst naar behoren te verrichten zonder
      zijn gezondheid of die van anderen te schaden.

      2 De beslissing omtrent de geschiktheid of ongeschiktheid van de gegadigde berust bij de hoogste geneeskundige
      autoriteit voor de zee-, de land- of de luchtmacht.


      [ref1]: https://wetten.overheid.nl/BWBR0002346#Artikel5
    url: https://wetten.overheid.nl/BWBR0002346/1986-01-01#Artikel6
