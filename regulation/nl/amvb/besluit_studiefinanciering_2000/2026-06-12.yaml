  - number: 3a
    text: |-
      1 [Artikel 2.2, tweede lid, van de wet][ref1] is van toepassing op een persoon die:

      a. een nationaliteit heeft van een staat die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte, dan wel van Zwitserland;

      b. niet het duurzaam verblijfsrecht, bedoeld in artikel 16 van [richtlijn 2004/38/EG](32004L0038), heeft verworven;
      en

      c. geen:

      1°. werknemer;

      2°. zelfstandige;

      3°. persoon die de status van werknemer of zelfstandige heeft behouden; of

      4°. familie van een persoon als bedoeld in onderdeel 1° tot en met 3° is.

      2 [Artikel 2.2, tweede lid, van de wet][ref2] is eveneens van toepassing op een persoon die in Nederland rechtmatig
      verblijf heeft op grond van:

      a. een verblijfsvergunning als bedoeld in [artikel 3.30b van het Vreemdelingenbesluit 2000][ref3]; of

      b. een verblijfsvergunning als bedoeld in [artikel 3.33 van het Vreemdelingenbesluit 2000][ref4].

      3 [Artikel 2.2, tweede lid, van de wet][ref5] is eveneens van toepassing op familieleden van een persoon als
      bedoeld in het eerste en tweede lid.

      4 Voor mbo-studenten wordt de tegemoetkoming op grond van het eerste tot en met derde lid verstrekt in de
      vorm van een gift ter hoogte van het bedrag van de basisbeurs voor een thuiswonende mbo-student, genoemd in
      [artikel 3.18, overzicht 2, onder A, van de wet][ref6]. De tegemoetkoming wordt toegekend in één bedrag per
      studiejaar. Indien de aanspraak gedurende een studiejaar ontstaat bestaat de aanspraak uit een twaalfde van het
      bedrag per studiejaar maal het aantal resterende maanden van dat studiejaar. Indien de mbo-student in aanmerking
      komt voor het levenlanglerenkrediet wordt de tegemoetkoming toegekend in de vorm van levenlanglerenkrediet.

      5 Voor ho-studenten wordt de tegemoetkoming op grond van het eerste tot en met derde lid verstrekt in de vorm
      van een aanspraak op het collegegeldkrediet, bedoeld in [artikel 3.16a][ref7], of het levenlanglerenkrediet van
      de [wet][ref8].

      6 Op de tegemoetkoming is [artikel 3.21, derde lid, van de wet][ref9] van overeenkomstige toepassing.


