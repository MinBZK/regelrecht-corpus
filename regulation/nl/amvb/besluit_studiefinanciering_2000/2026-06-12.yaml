  - number: '12'
    text: |-
      1 Indien een student van zijn ouder alimentatie als bedoeld in [artikel 6, eerste lid, onderdeel d][ref1],
      ontvangt, komt het door de rechter vastgestelde bedrag aan alimentatie van de student in de plaats van de
      veronderstelde ouderlijk bijdrage. Als bewijs van de hoogte van de alimentatie dient in ieder geval de beschikking
      van de rechtbank of een notariële akte te worden overlegd. Het bedrag dat in het bewijsstuk wordt genoemd, wordt
      vermeerderd met de wettelijke indexering.

      2 Indien nog geen beschikking is afgegeven, wordt de door de rechter vastgestelde alimentatie van de student in de
      plaats van de veronderstelde ouderlijke bijdrage gesteld vanaf de ingangsdatum van de alimentatie zoals die datum
      door de rechter is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011545#Artikel6
    url: https://wetten.overheid.nl/BWBR0011545/2026-06-12#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011545
        artikel: '6'
        hoofdstuk: '3'
  - number: 12a
    text: |-
      In aanvulling op het begrip partner, genoemd in [artikel 1.1, eerste lid, van de wet][ref1], is in dit hoofdstuk
      slechts sprake van partner van de debiteur indien in het derde jaar volgend op het kalenderjaar van het laatste
      studiefinancieringstijdvak het partnerschap een tijdvak van meer dan 6 maanden omvat.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0011545/2026-06-12#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '1.1'
  - number: 12b
    text: >-
      Gehele kwijtschelding van de aanvullende beurs kan plaatsvinden indien het toetsingsinkomen van de debiteur zonder
      partner in het derde jaar volgend op het kalenderjaar van het laatste studiefinancieringstijdvak gelijk is aan of
      lager is dan 1,5 maal het belastbaar minimumloon.
    url: https://wetten.overheid.nl/BWBR0011545/2026-06-12#Artikel12b
  - number: 12c
    text: >-
      1 Gedeeltelijke kwijtschelding van de aanvullende beurs kan plaatsvinden indien het toetsingsinkomen van de
      debiteur zonder partner in het derde jaar volgend op het kalenderjaar van het laatste studiefinancieringstijdvak
      hoger is dan 1,5 maal het belastbaar minimumloon en lager is dan 2 maal het belastbaar minimumloon.


      2 De hoogte van de kwijtschelding tussen 1,5 en 2 maal het belastbaar minimumloon neemt in evenredigheid af tot
      nihil naarmate het toetsingsinkomen hoger is.
    url: https://wetten.overheid.nl/BWBR0011545/2026-06-12#Artikel12c
  - number: 12d
    text: >-
      Gehele kwijtschelding van de aanvullende beurs kan plaatsvinden indien het toetsingsinkomen van de debiteur en
      diens partner in het derde jaar volgend op het kalenderjaar van het laatste studiefinancieringstijdvak gelijk is
      aan of lager is dan 2 maal het belastbaar minimumloon.
    url: https://wetten.overheid.nl/BWBR0011545/2026-06-12#Artikel12d
  - number: 12e
    text: >-
      1 Gedeeltelijke kwijtschelding van de aanvullende beurs kan plaatsvinden indien het toetsingsinkomen van de
      debiteur en diens partner in het derde jaar volgend op het kalenderjaar van het laatste studiefinancieringstijdvak
      hoger is dan 2 maal het belastbaar minimumloon en lager is dan 2,5 maal het belastbaar minimumloon.


      2 De hoogte van de kwijtschelding tussen 2 en 2,5 maal het belastbaar minimumloon neemt in evenredigheid af tot
      nihil naarmate het toetsingsinkomen hoger is.
    url: https://wetten.overheid.nl/BWBR0011545/2026-06-12#Artikel12e
  - number: 12f
    text: |-
      1 Onze Minister neemt een aanvraag die wordt ingediend voor 1 november van het vierde jaar volgend op het
      kalenderjaar van het laatste studiefinancieringstijdvak, niet eerder dan op die datum in behandeling, waarbij 1
      november geldt als datum van indiening.

      2 Onze Minister besluit binnen 8 weken na de indiening van een aanvraag van een debiteur om kwijtschelding van de
      aanvullende beurs.

      3 Onze Minister neemt slechts een aanvraag in behandeling die wordt ingediend binnen de diplomatermijn, genoemd
      in de [artikelen 4.9][ref1] en [5.5 van de wet][ref2], of, indien dit daarna is, binnen 5 jaren volgend op het
      kalenderjaar van het laatste studiefinancieringstijdvak.

      4 Het kwijt te schelden bedrag wordt aan de aanvrager uitbetaald indien verrekening niet mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel4.9
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel5.5
    url: https://wetten.overheid.nl/BWBR0011545/2026-06-12#Artikel12f
