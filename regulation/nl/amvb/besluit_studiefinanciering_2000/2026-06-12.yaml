      1 Met een Nederlander wordt gelijkgesteld de vreemdeling die in Nederland rechtmatig verblijf heeft:

      a. op grond van een verblijfsvergunning als bedoeld in [artikel 8, onder b, van de Vreemdelingenwet 2000][ref1];

      b. op grond van een verblijfsvergunning asiel als bedoeld in [artikel 28 van de Vreemdelingenwet 2000][ref2];

      c. op grond van een verblijfsvergunning als bedoeld in [artikel 8, onder d, van de Vreemdelingenwet 2000][ref3];

      d. op grond van [artikel 8, onderdelen g of h, van de Vreemdelingenwet 2000][ref4], voor zover hij reeds
      studiefinancieringsgenietende is; of

      e. op grond van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 14 van de Vreemdelingenwet 2000][ref5] die is verleend onder een beperking:

      1°. verband houdend met verblijf als familie- of gezinslid van een Nederlander of van een vreemdeling als bedoeld
      in onderdeel a, b, c of dit onderdeel;

      2°. verband houdend met tijdelijke humanitaire gronden of hiermee verband houdende niet-tijdelijke humanitaire
      gronden;

      3°. als bedoeld in [artikel 3.4, vierde lid, van het Vreemdelingenbesluit 2000][ref6] of hiermee verband houdende
      niet-tijdelijke humanitaire gronden;

      4°. verband houdend met afwikkeling nalatenschap oude [Vreemdelingenwet][ref7] als bedoeld in
      [artikel 3.17a, onderdeel b, van het Voorschrift Vreemdelingen 2000][ref8] of hiermee verband houdende niet-
      tijdelijke humanitaire gronden; of

      5°. verband houdend met niet-tijdelijke humanitaire gronden die volgt op een verblijfsvergunning voor bepaalde
      tijd als bedoeld in [artikel 14 van de Vreemdelingenwet 2000][ref9] die is verleend onder de beperking medische
      behandeling;

      6°. verband houdend met niet-tijdelijke humanitaire gronden die als eerste verblijfsvergunning op grond van de
      [Vreemdelingenwet 2000][ref10] wordt toegekend.

      2 Met een Nederlander wordt eveneens gelijkgesteld de vreemdeling ten behoeve van wie of aan wie een tegemoetkoming
      is verstrekt als bedoeld in [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref11].


