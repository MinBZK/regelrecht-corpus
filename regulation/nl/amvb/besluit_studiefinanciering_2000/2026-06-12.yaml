        bwb_id: BWBR0011453
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '6.14'
  - number: 18a
    text: |-
      1 Indien de debiteur, bedoeld in [artikel 6.10, tweede lid, onder c, van de wet][ref1], naast de lening die
      is ontstaan door toekenning van het levenlanglerenkrediet ook een lening hoger onderwijs aflost en voldoende
      draagkracht heeft om de verschillende terugbetalingstermijnen volledig te voldoen, wordt de draagkracht als volgt
      verdeeld over de verschillende aflossingstermijnen:

      a. ten hoogste 12 procent van het inkomen tussen 84 procent en 99,99 procent van het wettelijk minimumloon wordt
      benut voor de aflossing van de lening die is ontstaan door toekenning van het levenlanglerenkrediet;

      b. van het bedrag aan draagkracht dat daarna nog resteert, wordt ten hoogste 12 procent van het inkomen dat
      uitstijgt boven 100 procent van het wettelijk minimumloon benut voor de aflossing van beide leningen, waarbij een
      derde deel van dat aflossingsbedrag wordt benut voor de aflossing van de lening hoger onderwijs en twee derde deel
      wordt benut voor de aflossing van de lening die is ontstaan door toekenning van het levenlanglerenkrediet.

      2 Voor de debiteur, bedoeld in [artikel 6.10, tweede lid, onder a of b, van de wet][ref2], is het eerste lid van
      overeenkomstige toepassing, met dien verstande dat:

      a. voor 84 procent wordt gelezen 120 procent;

      b. voor 99,99 procent wordt gelezen 142,99 procent;

      c. voor 100 procent wordt gelezen 143 procent.

      3 Indien voor de debiteur, bedoeld in [artikel 6.10, tweede lid, onder a][ref3], na de toepassing van het tweede
      lid nog een bedrag aan draagkracht resteert, kan die draagkracht worden benut voor de aflossing van de studielening
      van de partner.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6.10
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel6.10
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel6.10
