  - number: '18'
    text: |-
      1 Indien de debiteur naast de lening die is ontstaan door toekenning van het levenlanglerenkrediet ook op
      een andere lening aflost, wordt voor de draagkracht uitgegaan van de hoogste draagkracht die op basis van de
      terugbetalingsvoorwaarden behorende bij de verschillende soorten leningen die de debiteur heeft, kan worden
      vastgesteld.

      2 De draagkracht wordt voor elke soort lening afzonderlijk berekend, waarna de hoogste draagkracht wordt uitgedrukt
      in een bedrag per maand.

      3 Indien de partner van de debiteur ook een debiteur is op wie [hoofdstuk 6 van de wet][ref1] van toepassing is, is
      [artikel 6.14][ref2] van toepassing op de berekening van de draagkracht.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel6.14
    url: https://wetten.overheid.nl/BWBR0011545/2026-06-12#Artikel18
    references:
