  - number: '33'
    text: |-
      Op een ho-student die voor 1 september 2007 op grond van [artikel 3a][ref1] studiefinanciering ontving, blijft
      artikel 3a, zoals dat luidde op 31 augustus 2007, van toepassing zolang hij zonder onderbreking studiefinanciering
      op grond van dat artikel geniet.


