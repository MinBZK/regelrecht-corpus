  - number: '7'
    text: |-
      1 Van een ernstig en structureel conflict tussen ouder en student als bedoeld in
      [artikel 6, eerste lid, onderdeel a][ref1], is sprake, indien de ouder om ernstige redenen structureel weigert de
      veronderstelde ouderlijke bijdrage te verstrekken.

      2 Onze Minister stelt bij de ouder vast dat er sprake is van weigering. Indien die ouder geen medewerking voor die
      vaststelling verleent, kan de verklaring van een onafhankelijke derde voor de betreffende ouderverklaring in de
      plaats treden.

      3 De ernst van het conflict wordt aangetoond aan de hand van een verklaring afgegeven door een ter zake deskundige.


      [ref1]: https://wetten.overheid.nl/BWBR0011545#Artikel6
    url: https://wetten.overheid.nl/BWBR0011545/2026-06-12#Artikel7
