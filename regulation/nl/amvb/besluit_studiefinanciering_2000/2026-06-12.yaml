      1 Aanspraak op aanvullende beurs als bedoeld in [artikel 3.14, eerste lid, van de wet][ref1], voor wat betreft de
      aanvullende lening die voortvloeit uit de veronderstelde ouderlijke bijdrage van de weigerachtige of onvindbare
      ouder, bestaat in ieder geval, indien:

      a. sprake is van een ernstig en structureel conflict tussen ouder en student,

      b. het gezag van de ouder is beëindigd op grond van [artikel 266][ref2] of
      [267 van Boek 1 van het Burgerlijk Wetboek][ref3],

      c. de student geen contact met de ouder heeft,

      d. sprake is van voor de student niet inbare alimentatie als bedoeld in
      [titel 17 van Boek 1 van het Burgerlijk Wetboek][ref4], of

      e. gegevens over de verblijfplaats van de ouder niet kunnen worden achterhaald.

      2 Een aanvraag als bedoeld in [artikel 3.14, eerste lid, van de wet][ref5] wordt niet in behandeling genomen indien
      deze betrekking heeft op:

      a. een periode die meer dan twee jaar voor het moment van aanvragen ligt, of

      b. een periode waarover geen aanvullende beurs is aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3.14
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel266
