        artikel: '7.1'
  - number: '16'
    text: >-
      Het verstrekken van inlichtingen, benodigd voor de uitvoering van de wet, door organen met een publiekrechtelijke
      taak geschiedt binnen 8 weken na de dag van verzending van de aanvraag om inlichtingen, indien door het college van
      burgemeester en wethouders te verschaffen inlichtingen onderzoek buiten de basisregistratie personen noodzakelijk
      maken. In alle overige gevallen geschiedt het verstrekken van inlichtingen binnen 4 weken na de dag van verzending
      van de aanvraag om inlichtingen. Onze Minister kan bij de aanvraag om inlichtingen aangeven hoe de overdracht van
      informatie plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0011545/2026-06-12#Artikel16
  - number: '17'
    text: |-
      1 Onze Minister past de bedragen, genoemd in de [artikelen 3.9, tweede lid][ref1], en [3.9a, van de wet][ref2],
      per 1 januari van ieder kalenderjaar aan met de procentuele wijziging die het indexcijfer van de CAO-lonen in het
      tweede daaraan voorafgaande kalenderjaar heeft ondergaan.

      2 Onze Minister past de bedragen, genoemd in de [artikelen 3.18][ref3], met uitzondering van de maximale
      aanvullende beurs, [3.27, tweede lid][ref4], [4.7][ref5], [4.18][ref6], [5.2][ref7], [12.14, tweede lid][ref8],
      [12.15, derde lid][ref9], [12.16, eerste en tweede lid][ref10], [12.30, derde lid][ref11], en
      [12.31, tweede lid, van de wet][ref12], per 1 januari van ieder kalenderjaar aan met de procentuele wijziging die
      de consumentenprijsindex over het tweede daaraan voorafgaande kalenderjaar heeft ondergaan.

      3 Bij ministeriële regeling wordt bepaald wat onder de consumentenprijsindex en het indexcijfer van de CAO-lonen
      wordt verstaan.


