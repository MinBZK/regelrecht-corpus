  - number: '19'
    text: |-
      In dit hoofdstuk wordt onder tegemoetkoming verstaan: tegemoetkoming als bedoeld in
      [artikel 12.15, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel12.15
    url: https://wetten.overheid.nl/BWBR0011545/2026-06-12#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '12.15'
  - number: '20'
    text: |-
      1 De tegemoetkoming wordt uiterlijk per 1 januari van het kalenderjaar volgend op het jaar waarin Onze Minister
      over de voor vaststelling van de aanspraak benodigde gegevens beschikt, ambtshalve toegekend, met dien verstande
      dat de toekenning aan een rechthebbende waarvan Onze Minister reeds voor of op 31 december 2024 over de voor
      vaststelling van de aanspraak benodigde gegevens beschikt, geschiedt in 2025.

      2 In afwijking van het eerste lid wordt de tegemoetkoming op aanvraag toegekend aan een rechthebbende op een
      tegemoetkoming die:

      a. een hbo-bacheloropleiding of het geheel van een wo-bacheloropleiding en een wo-masteropleiding als bedoeld
      in [artikel 12.15, tweede lid, onderdeel b, van de wet][ref1] heeft afgerond aan een instelling waarop
      [artikel 7.9d van de WHW][ref2] niet van toepassing is; en

      b. die niet reeds een gewaarmerkte kopie van het aan het examen van die opleiding of opleidingen
      verbonden diploma aan Onze Minister heeft verstrekt in het kader van de omzettingsprocedure, bedoeld in
      [artikel 5.9, tweede lid, van de wet][ref3].

      3 De rechthebbende, bedoeld in het tweede lid, zendt uiterlijk binnen drie maanden na het verstrijken van de
      diplomatermijn hoger onderwijs een kopie van het diploma als bedoeld in het tweede lid aan Onze Minister en dient
      daarbij op een bij ministeriële regeling te bepalen wijze een aanvraag van de tegemoetkoming in. Op die kopie
      vermeldt de instelling de datum waarop het examen met goed gevolg is afgesloten. Onze Minister besluit uiterlijk
      per 1 januari van het kalenderjaar volgend op de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel12.15
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7.9d
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel5.9
    url: https://wetten.overheid.nl/BWBR0011545/2026-06-12#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '12.15'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 7.9d
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '5.9'
  - number: '21'
    text: >-
      1 De tegemoetkoming wordt verstrekt in de vorm van:


      a. een kwijtschelding van de openstaande studieschuld of een deel daarvan; of


      b. een bijschrijving op de bij Onze Minister voor de toekenning van studiefinanciering bekende bankrekening,
      indien:


      1° er op het moment van toekenning geen studieschuld openstaat; of


      2° er na de kwijtschelding, bedoeld in onderdeel a, nog aanspraak op een deel van de tegemoetkoming bestaat.


      2 Indien bij Onze Minister de benodigde gegevens van de rechthebbende op een tegemoetkoming over de bankrekening
      waarop de tegemoetkoming kan worden uitbetaald niet bekend zijn, wordt de rechthebbende verzocht deze gegevens
      binnen twaalf maanden te verstrekken. Indien de rechthebbende op een tegemoetkoming niet binnen deze termijn de
      gegevens aanvult, vervalt de aanspraak op de tegemoetkoming op grond van een daartoe strekkend besluit van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0011545/2026-06-12#Artikel21
  - number: 21a
    text: |-
      In dit hoofdstuk wordt onder tegemoetkoming verstaan: tegemoetkoming als bedoeld in
      [artikel 12.30, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel12.30
