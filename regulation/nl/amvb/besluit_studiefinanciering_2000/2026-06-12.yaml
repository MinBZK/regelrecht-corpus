        artikel: '5.5'
  - number: '13'
    text: |-
      1 Studiefinanciering wordt uitbetaald tussen de twintigste en dertigste dag van elke maand.

      2 Indien een herzieningsbeschikking als bedoeld in [artikel 7.1, eerste en tweede lid, van de wet][ref1] een
      beschikking op een bezwaarschrift of een uitspraak op een beroep daartoe aanleiding geeft, verrekent Onze Minister
      het bedrag aan studiefinanciering dat te weinig was toegekend met de betrokkene, of wordt dat bedrag ineens aan de
      betrokkene uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel7.1
    url: https://wetten.overheid.nl/BWBR0011545/2026-06-12#Artikel13
