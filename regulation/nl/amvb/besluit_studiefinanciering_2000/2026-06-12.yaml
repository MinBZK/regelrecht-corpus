  - number: 21b
    text: >-
      1 De tegemoetkoming wordt uiterlijk per 1 januari van het kalenderjaar volgend op het jaar waarin Onze Minister
      over de voor vaststelling van de aanspraak benodigde gegevens beschikt, ambtshalve toegekend, met dien verstande
      dat de toekenning aan een rechthebbende waarvan Onze Minister reeds voor of op 31 december 2024 over de voor
      vaststelling van de aanspraak benodigde gegevens beschikt, geschiedt in 2025.


      2 In afwijking van het eerste lid wordt de tegemoetkoming op aanvraag toegekend voor de periode waarover Onze
      Minister niet over de voor vaststelling van de aanspraak van een rechthebbende benodigde gegevens beschikt.


      3 De rechthebbende, bedoeld in het tweede lid, dient uiterlijk binnen drie maanden na het verstrijken van de
      diplomatermijn hoger onderwijs of, indien hij geen studiefinanciering heeft aangevraagd, uiterlijk binnen tien jaar
      en drie maanden nadat hij zich voor het eerst heeft ingeschreven voor het hoger onderwijs, op een bij ministeriële
      regeling te bepalen wijze een aanvraag in. Onze Minister besluit uiterlijk per 1 januari van het kalenderjaar
      volgend op de aanvraag.
    url: https://wetten.overheid.nl/BWBR0011545/2026-06-12#Artikel21b
