        artikel: '6'
        hoofdstuk: '3'
  - number: '11'
    text: |-
      [Artikel 6, eerste lid, aanhef en onderdeel e][ref1], is van toepassing indien de student de verblijfplaats van de
      ouder niet kent en die verblijfplaats niet wordt achterhaald na onderzoek van Onze Minister gedurende ten hoogste 3
      maanden onderscheidenlijk ten hoogste 6 maanden in geval van onderzoek in het buitenland.


      [ref1]: https://wetten.overheid.nl/BWBR0011545#Artikel6
