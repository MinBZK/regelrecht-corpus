      In afwijking van [artikel 1.1, eerste lid, van de wet][ref1], wordt in dit hoofdstuk onder partner verstaan: een
      echtgenoot of partner als bedoeld in artikel 2, tweede lid, onderdelen a en b, of artikel 3, tweede lid, onderdeel
      b, van [richtlijn 2004/38/EG](32004L0038).


