      1 In dit besluit wordt verstaan onder:

      **aflosfase**: aflosfase, bedoeld in [artikel 6.7 van de wet][ref1],

      **familielid**: familielid als bedoeld in richtlijn 2004/38/EG,

      **richtlijn 2004/38/EG:** richtlijn nr. 2004/38/EG van het Europees Parlement en de Raad van 29 april 2004
      betreffende het recht van vrij verkeer en verblijf op het grondgebied van de lidstaten voor de burgers van de Unie
      en hun familieleden, tot wijziging van Verordening (EEG) nr. 1612/68 en tot intrekking van de Richtlijnen 64/221/
      EEG, 68/360/EEG, 72/194/EEG, 73/148/EEG, 75/34/EEG, 75/35/EEG, 90/364/EEG, 90/365/EEG en 93/96/EEG (PbEU L 158),

      **wet**: [Wet studiefinanciering 2000][ref2].

      2 In [hoofdstuk 3a][ref3] van dit besluit wordt verstaan onder **aanvullende beurs**: toegekende en uitbetaalde
      aanvullende beurs als bedoeld in [artikel 6.2, tweede lid, van de wet][ref4].

      3 Een wijziging van richtlijn 2004/38/EG gaat voor de toepassing van dit besluit gelden met ingang van de dag
      waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.


