  - number: '9'
    text: |-
      Van geen contact met de ouder als bedoeld in [artikel 6, eerste lid, onderdeel c][ref1], is sprake, indien de
      student vanaf de maand waarin hij de leeftijd van 12 jaren heeft bereikt geen wezenlijk contact met de ouder had.
      Als bewijs dient een verklaring van een ter zake deskundige te worden overlegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011545#Artikel6
    url: https://wetten.overheid.nl/BWBR0011545/2026-06-12#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011545
        artikel: '6'
        hoofdstuk: '3'
  - number: '10'
    text: |-
      Van voor de student niet inbare alimentatie als bedoeld in [artikel 6, eerste lid, onderdeel d][ref1], is sprake,
      indien de alimentatie oninbaar is gedurende ten minste 12 maanden voorafgaande aan de maand waarin de student
      voor het eerst studiefinanciering ontvangt. Als bewijs dient een verklaring van een ter zake deskundige te worden
      overlegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011545#Artikel6
    url: https://wetten.overheid.nl/BWBR0011545/2026-06-12#Artikel10
