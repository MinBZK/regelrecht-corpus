    (1707), directie Wetgeving en Juridische Zaken;

    Gelet op de artikelen 1.1, eerste lid, 2.2, onderdeel c, 2.11, 3.3, tweede lid, 3.14, derde lid, 8.1, eerste lid,
    8.2, tweede lid, 9.6, 10.6, zevende lid, 11.1, 11.6 en 11.7 van de Wet studiefinanciering 2000;

