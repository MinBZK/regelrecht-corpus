    text: Opleiding Restauratoren, onderdeel van het Instituut Collectie Nederland te Amsterdam.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel4
  - number: '6.1'
    text: |-
      Aanspraak op aanvullende beurs als bedoeld in [artikel 3.14, eerste lid, van de wet][ref1], voor wat betreft de
      aanvullende lening die voortvloeit uit de veronderstelde ouderlijke bijdrage van de weigerachtige of onvindbare
      ouder, bestaat in ieder geval, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
  - number: 6.1.a
    text: sprake is van een ernstig en structureel conflict tussen ouder en studerende,
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel6
  - number: 6.1.b
    text: |-
      het gezag van de ouder is beëindigd op grond van [artikel 266][ref1] of
      [267 van Boek 1 van het Burgerlijk Wetboek][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel266
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel267
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '266'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '267'
  - number: 6.1.c
    text: de studerende geen contact met de ouder heeft,
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel6
  - number: 6.1.d
    text: |-
      sprake is van voor de studerende niet inbare alimentatie als bedoeld in
      [titel 17 van Boek 1 van het Burgerlijk Wetboek][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002656
  - number: 6.1.e
    text: gegevens over de verblijfplaats van de ouder niet kunnen worden achterhaald.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel6
  - number: '6.2'
    text: |-
      Een aanvraag als bedoeld in [artikel 3.14, eerste lid, van de wet][ref1] wordt niet in behandeling genomen indien
      deze betrekking heeft op:


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
  - number: 6.2.a
    text: een periode die meer dan twee jaar voor het moment van aanvragen ligt, of
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel6
  - number: 6.2.b
    text: een periode waarover geen aanvullende beurs is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel6
  - number: '7.1'
    text: |-
      Van een ernstig en structureel conflict tussen ouder en studerende als bedoeld in
      [artikel 6, eerste lid, onderdeel a][ref1], is sprake, indien de ouder om ernstige redenen structureel weigert de
      veronderstelde ouderlijke bijdrage te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0011545#Artikel6
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011545
        artikel: '6'
        hoofdstuk: '3'
  - number: '7.2'
    text: |-
      Onze Minister stelt bij de ouder vast dat er sprake is van weigering. Indien die ouder geen medewerking voor die
      vaststelling verleent, kan de verklaring van een onafhankelijke derde voor de betreffende ouderverklaring in de
      plaats treden.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel7
  - number: '7.3'
    text: De ernst van het conflict wordt aangetoond aan de hand van een verklaring afgegeven door een ter zake deskundige.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel7
  - number: '8'
    text: |-
      Als bewijs dat het gezag van de ouder is beëindigd, bedoeld in [artikel 6, eerste lid, onderdeel b][ref1], dient
      een afschrift van de beschikking van de rechtbank te worden overlegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011545#Artikel6
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011545
        artikel: '6'
        hoofdstuk: '3'
  - number: '9'
    text: |-
      Van geen contact met de ouder als bedoeld in [artikel 6, eerste lid, onderdeel c][ref1], is sprake, indien de
      studerende vanaf de maand waarin hij de leeftijd van 12 jaren heeft bereikt geen wezenlijk contact met de ouder
      had. Als bewijs dient een verklaring van een ter zake deskundige te worden overlegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011545#Artikel6
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011545
        artikel: '6'
        hoofdstuk: '3'
  - number: '10'
    text: |-
      Van voor de studerende niet inbare alimentatie als bedoeld in [artikel 6, eerste lid, onderdeel d][ref1], is
      sprake, indien de alimentatie oninbaar is gedurende ten minste 12 maanden voorafgaande aan de maand waarin de
      studerende voor het eerst studiefinanciering ontvangt. Als bewijs dient een verklaring van een ter zake deskundige
      te worden overlegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011545#Artikel6
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011545
        artikel: '6'
        hoofdstuk: '3'
  - number: '11'
    text: |-
      [Artikel 6, eerste lid, aanhef en onderdeel e][ref1], is van toepassing indien de studerende de verblijfplaats
      van de ouder niet kent en die verblijfplaats niet wordt achterhaald na onderzoek van Onze Minister gedurende ten
      hoogste 3 maanden onderscheidenlijk ten hoogste 6 maanden in geval van onderzoek in het buitenland.


      [ref1]: https://wetten.overheid.nl/BWBR0011545#Artikel6
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011545
        artikel: '6'
        hoofdstuk: '3'
  - number: '12.1'
    text: |-
      Indien een studerende van zijn ouder alimentatie als bedoeld in [artikel 6, eerste lid, onderdeel d][ref1],
      ontvangt, komt het door de rechter vastgestelde bedrag aan alimentatie van de studerende in de plaats van de
      veronderstelde ouderlijk bijdrage. Als bewijs van de hoogte van de alimentatie dient in ieder geval de beschikking
      van de rechtbank of een notariële akte te worden overlegd. Het bedrag dat in het bewijsstuk wordt genoemd, wordt
      vermeerderd met de wettelijke indexering.


      [ref1]: https://wetten.overheid.nl/BWBR0011545#Artikel6
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011545
        artikel: '6'
        hoofdstuk: '3'
  - number: '12.2'
    text: |-
      Indien nog geen beschikking is afgegeven, wordt de door de rechter vastgestelde alimentatie van de studerende in de
      plaats van de veronderstelde ouderlijke bijdrage gesteld vanaf de ingangsdatum van de alimentatie zoals die datum
      door de rechter is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel12
  - number: 12a
    text: |-
      In aanvulling op het begrip partner, genoemd in [artikel 1.1, eerste lid, van de wet][ref1], is in dit hoofdstuk
      slechts sprake van partner van de debiteur indien in het derde jaar volgend op het kalenderjaar van het laatste
      studiefinancieringstijdvak het partnerschap een tijdvak van meer dan 6 maanden omvat.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel1
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '1'
  - number: 12b
    text: |-
      Gehele kwijtschelding van de aanvullende beurs kan plaatsvinden indien het toetsingsinkomen van de debiteur zonder
      partner in het derde jaar volgend op het kalenderjaar van het laatste studiefinancieringstijdvak gelijk is aan of
      lager is dan 1,5 maal het belastbaar minimumloon.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel12b
  - number: 12c.1
    text: |-
      Gedeeltelijke kwijtschelding van de aanvullende beurs kan plaatsvinden indien het toetsingsinkomen van de debiteur
      zonder partner in het derde jaar volgend op het kalenderjaar van het laatste studiefinancieringstijdvak hoger is
      dan 1,5 maal het belastbaar minimumloon en lager is dan 2 maal het belastbaar minimumloon.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel12c
  - number: 12c.2
    text: |-
      De hoogte van de kwijtschelding tussen 1,5 en 2 maal het belastbaar minimumloon neemt in evenredigheid af tot nihil
      naarmate het toetsingsinkomen hoger is.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel12c
  - number: 12d
    text: |-
      Gehele kwijtschelding van de aanvullende beurs kan plaatsvinden indien het toetsingsinkomen van de debiteur en
      diens partner in het derde jaar volgend op het kalenderjaar van het laatste studiefinancieringstijdvak gelijk is
      aan of lager is dan 2 maal het belastbaar minimumloon.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel12d
  - number: 12e.1
    text: |-
      Gedeeltelijke kwijtschelding van de aanvullende beurs kan plaatsvinden indien het toetsingsinkomen van de debiteur
      en diens partner in het derde jaar volgend op het kalenderjaar van het laatste studiefinancieringstijdvak hoger is
      dan 2 maal het belastbaar minimumloon en lager is dan 2,5 maal het belastbaar minimumloon.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel12e
  - number: 12e.2
    text: |-
      De hoogte van de kwijtschelding tussen 2 en 2,5 maal het belastbaar minimumloon neemt in evenredigheid af tot nihil
      naarmate het toetsingsinkomen hoger is.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel12e
  - number: 12f.1
    text: |-
      Onze Minister neemt een aanvraag die wordt ingediend voor 1 november van het vierde jaar volgend op het
      kalenderjaar van het laatste studiefinancieringstijdvak, niet eerder dan op die datum in behandeling, waarbij 1
      november geldt als datum van indiening.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel12f
  - number: 12f.2
    text: |-
      Onze Minister besluit binnen 8 weken na de indiening van een aanvraag van een debiteur om kwijtschelding van de
      aanvullende beurs.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel12f
  - number: 12f.3
    text: |-
      Onze Minister neemt slechts een aanvraag in behandeling die wordt ingediend binnen de diplomatermijn, genoemd
      in de [artikelen 4.9][ref1] en [5.5 van de wet][ref2], of, indien dit daarna is, binnen 5 jaren volgend op het
      kalenderjaar van het laatste studiefinancieringstijdvak.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel5
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel12f
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '5'
  - number: 12f.4
    text: Het kwijt te schelden bedrag wordt aan de aanvrager uitbetaald indien verrekening niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel12f
  - number: '13.1'
    text: Studiefinanciering wordt uitbetaald tussen de twintigste en dertigste dag van elke maand.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel13
  - number: '13.2'
    text: |-
      Indien een herzieningsbeschikking als bedoeld in [artikel 7.1, eerste en tweede lid, van de wet][ref1] een
      beschikking op een bezwaarschrift of een uitspraak op een beroep daartoe aanleiding geeft, verrekent Onze Minister
      het bedrag aan studiefinanciering dat te weinig was toegekend met de betrokkene, of wordt dat bedrag ineens aan de
      betrokkene uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel7
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '7'
  - number: '16'
    text: |-
      Het verstrekken van inlichtingen, benodigd voor de uitvoering van de wet, door organen met een publiekrechtelijke
      taak geschiedt binnen 8 weken na de dag van verzending van de aanvraag om inlichtingen, indien door het college van
      burgemeester en wethouders te verschaffen inlichtingen onderzoek buiten de basisregistratie personen noodzakelijk
      maken. In alle overige gevallen geschiedt het verstrekken van inlichtingen binnen 4 weken na de dag van verzending
      van de aanvraag om inlichtingen. Onze Minister kan bij de aanvraag om inlichtingen aangeven hoe de overdracht van
      informatie plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel16
  - number: '17.1'
    text: |-
      Onze Minister past de bedragen, genoemd in de [artikelen 3.9, tweede lid][ref1], [3.9a][ref2] en
      [3.17, eerste lid, van de wet][ref3], per 1 januari van ieder kalenderjaar aan met de procentuele wijziging die het
      indexcijfer van de CAO-lonen in het tweede daaraan voorafgaande kalenderjaar heeft ondergaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '3'
  - number: '17.2'
    text: |-
      Onze Minister past de bedragen, genoemd in de [artikelen 3.18,][ref1] met uitzondering van de maximale
      aanvullende beurs, [4.7][ref2], [4.18][ref3], [ 5.2][ref4], [6.2a, tweede lid][ref5], [12.14, tweede lid][ref6],
      en [12.16, eerste en tweede lid, van de wet][ref7], per 1 januari van ieder kalenderjaar aan met de procentuele
      wijziging die de consumentenprijsindex over het tweede daaraan voorafgaande kalenderjaar heeft ondergaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0011453#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0011453#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0011453#Artikel12
      [ref7]: https://wetten.overheid.nl/BWBR0011453#Artikel12
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0011453
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0011453
        artikel: '6'
      - id: ref6
        bwb_id: BWBR0011453
        artikel: '12'
      - id: ref7
        bwb_id: BWBR0011453
        artikel: '12'
  - number: '17.3'
    text: |-
      Onze minister past het bedrag genoemd in [artikel 3.17, vierde lid, van de wet][ref1], per 1 januari van ieder
      kalenderjaar zodanig aan dat het gelijk is aan het in [artikel 3.18, overzicht 2, onder A, van de wet][ref2]
      genoemde bedrag van de maximale aanvullende beurs voor een thuiswonende deelnemer vermeerderd met een twaalfde deel
      van het lesgeld, bedoeld in [artikel 5, tweede lid, van de Les- en cursusgeldwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0004188#Artikel5
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0004188
        artikel: '5'
  - number: '17.4'
    text: |-
      Bij ministeriële regeling wordt bepaald wat onder de consumentenprijsindex en het indexcijfer van de CAO-lonen
      wordt verstaan.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel17
  - number: '18.1'
    text: |-
      Indien de debiteur naast de lening die is ontstaan door toekenning van het levenlanglerenkrediet ook op een
      andere lening aflost, wordt voor de draagkracht uitgegaan van de hoogste draagkracht die op basis van de
      terugbetalingsvoorwaarden behorende bij de verschillende soorten leningen die de debiteur heeft, kan worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel18
  - number: '18.2'
    text: |-
      De draagkracht wordt voor elke soort lening afzonderlijk berekend, waarna de hoogste draagkracht wordt uitgedrukt
      in een bedrag per maand.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel18
  - number: '18.3'
    text: |-
      Indien de partner van de debiteur ook een debiteur is op wie [hoofdstuk 6 van de wet][ref1] van toepassing is, is
      [artikel 6.14][ref2] van toepassing op de berekening van de draagkracht.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0011453
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '6'
  - number: 18a.1
    text: |-
      Indien de debiteur, bedoeld in [artikel 6.10, tweede lid, onder c, van de wet][ref1], naast de lening die
      is ontstaan door toekenning van het levenlanglerenkrediet ook een lening hoger onderwijs aflost en voldoende
      draagkracht heeft om de verschillende terugbetalingstermijnen volledig te voldoen, wordt de draagkracht als volgt
      verdeeld over de verschillende aflossingstermijnen:


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
  - number: 18a.1.a
    text: |-
      ten hoogste 12 procent van het inkomen tussen 84 procent en 99,99 procent van het wettelijk minimumloon wordt benut
      voor de aflossing van de lening die is ontstaan door toekenning van het levenlanglerenkrediet;
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel18a
  - number: 18a.1.b
    text: |-
      van het bedrag aan draagkracht dat daarna nog resteert, wordt ten hoogste 12 procent van het inkomen dat uitstijgt
      boven 100 procent van het wettelijk minimumloon benut voor de aflossing van beide leningen, waarbij een derde deel
      van dat aflossingsbedrag wordt benut voor de aflossing van de lening hoger onderwijs en twee derde deel wordt benut
      voor de aflossing van de lening die is ontstaan door toekenning van het levenlanglerenkrediet.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel18a
  - number: 18a.2
    text: |-
      Voor de debiteur, bedoeld in [artikel 6.10, tweede lid, onder a of b, van de wet][ref1], is het eerste lid van
      overeenkomstige toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
  - number: 18a.2.a
    text: voor 84 procent wordt gelezen 120 procent;
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel18a
  - number: 18a.2.b
    text: voor 99,99 procent wordt gelezen 142,99 procent;
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel18a
  - number: 18a.2.c
    text: voor 100 procent wordt gelezen 143 procent.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel18a
  - number: 18a.3
    text: |-
      Indien voor de debiteur, bedoeld in [artikel 6.10, tweede lid, onder a][ref1], na de toepassing van het tweede lid
      nog een bedrag aan draagkracht resteert, kan die draagkracht worden benut voor de aflossing van de studielening van
      de partner.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
  - number: 18b
    text: |-
      Indien de berekende terugbetalingstermijn hoger is dan de op grond van [artikel 18][ref1] berekende draagkracht,
      worden aflossingen eerst afgeboekt op de terugbetalingstermijn behorende bij de lening met de kortste resterende
      terugbetalingsperiode, of bij een gelijke resterende terugbetalingsperiode op de lening die is ontstaan door de
      toekenning van het levenlanglerenkrediet.


      [ref1]: https://wetten.overheid.nl/BWBR0011545#Artikel18
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0011545
        artikel: '18'
        hoofdstuk: '7'
  - number: 18c.1
    text: |-
      Indien aan de debiteur een aflossingsvrije periode, bedoeld in de [artikelen 6.7, tweede lid][ref1],
      [10a.5, eerste lid, van de wet][ref2] of [artikel 4.7, tweede lid, van de Wet studiefinanciering BES][ref3], wordt
      toegekend, wordt de draagkracht die is vastgesteld op grond van [artikel 18][ref4] opnieuw bepaald, waarbij de
      draagkrachtberekening behorende bij de opgeschorte lening niet langer wordt gehanteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0028393#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0011545#Artikel18
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel18c
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: 10a
      - id: ref3
        bwb_id: BWBR0028393
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0011545
        artikel: '18'
        hoofdstuk: '7'
  - number: 18c.2
    text: |-
      Indien het eerste lid wordt toegepast, wordt de als gevolg daarvan resterende draagkracht benut voor de
      terugbetalingstermijn behorende bij de lening die is ontstaan door toekenning van het levenlanglerenkrediet.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel18c
  - number: 18d
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met het oog op een goede uitvoering van dit
      hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel18d
  - number: '19.1'
    text: De waarde van de voucher bedraagt € 2.000 naar de maatstaf van 1 januari 2017.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel19
  - number: '19.2'
    text: De voucher wordt in één keer verzilverd.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel19
  - number: '19.3'
    text: |-
      In afwijking van het tweede lid kan een rechthebbende de voucher in meer dan één keer verzilveren als het
      vouchertegoed de kosten voor de toegang tot het onderwijs overstijgt.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel19
  - number: '19.4'
    text: |-
      Het vouchertegoed wordt overeenkomstig [artikel 17, tweede lid][ref1], aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0011545#Artikel17
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011545
        artikel: '17'
        hoofdstuk: '6'
  - number: '20.1'
    text: De aanvraag voor de voucher wordt gedaan op een bij ministeriële regeling te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel20
  - number: '20.2'
    text: |-
      Indien [artikel 19, derde lid][ref1], toepassing vindt, kan de rechthebbende een nieuwe aanvraag indienen voor de
      resterende waarde van de voucher.


      [ref1]: https://wetten.overheid.nl/BWBR0011545#Artikel19
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0011545
        artikel: '19'
        hoofdstuk: '8'
  - number: '21'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ten aanzien van de inschrijving, bedoeld in
      [artikel 12.15, tweede lid, onderdeel c, van de wet][ref1], verband houdend met de aanvraag van een voucher.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel12
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '12'
  - number: '22.1'
    text: |-
      Onze Minister kent het vouchertegoed toe, indien is voldaan aan de voorwaarden, bedoeld in
      [artikel 12.15, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel12
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '12'
  - number: '22.2'
    text: |-
      Het in te zetten vouchertegoed wordt op bij ministeriële regeling te bepalen wijze uitgekeerd aan een instelling
      voor hoger onderwijs die de opleiding aanbiedt die de student met gebruikmaking van de voucher wil volgen.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel22
  - number: '23'
    text: |-
      De instelling voor hoger onderwijs brengt het vouchertegoed in mindering op het door de student te betalen bedrag
      voor de toegang tot het onderwijs.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel23
  - number: '24.1'
    text: |-
      Indien een instelling voor hoger onderwijs na voortijdige beëindiging van de inschrijving van de student, of
      na het overlijden van de student, de kosten voor de toegang tot het onderwijs geheel of ten dele aan de student
      terugbetaalt, wordt op die terugbetaling de ingezette voucher ingehouden. Het ingehouden bedrag van de voucher
      vervalt aan de instelling.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel24
  - number: '24.2'
    text: |-
      Bij de aanvraag, bedoeld in [artikel 20][ref1], verklaart de student dat hij indien
      [artikel 7.48, vierde lid, van de WHW][ref2] van toepassing is, afstand doet van zijn aanspraak op de teruggave van
      dat deel van het wettelijk collegegeld dat is verrekend met de waarde van de voucher.


      [ref1]: https://wetten.overheid.nl/BWBR0011545#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0011545
        artikel: '20'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
  - number: '25.1'
    text: |-
      Indien de middelen verkregen door de inschrijving van een student met een voucher door de instelling voor hoger
      onderwijs ondoelmatig worden aangewend, kan het door de student ingezette vouchertegoed door Onze Minister worden
      teruggevorderd van de instelling. Van ondoelmatige aanwending is in ieder geval sprake indien de student met een
      voucher op enigerlei wijze wordt gecompenseerd.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel25
  - number: '25.2'
    text: |-
      Indien de situatie, bedoeld in het eerste lid, zich anders dan incidenteel voordoet, kan Onze Minister de
      vouchertegoeden die de instelling als gevolg van inschrijvingen door studenten met een voucher heeft ontvangen,
      terugvorderen van de instelling.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel25
  - number: '33'
    text: |-
      Op een student die voor 1 september 2007 op grond van [artikel 3a][ref1] studiefinanciering ontving, blijft artikel
      3a, zoals dat luidde op 31 augustus 2007, van toepassing zolang hij zonder onderbreking studiefinanciering op grond
      van dat artikel geniet.


      [ref1]: https://wetten.overheid.nl/BWBR0011545#Artikel3a
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0011545
        artikel: 3a
        hoofdstuk: '2'
  - number: 34a
    text: |-
      [Artikel 17, tweede lid][ref1], is niet van toepassing in de kalenderjaren 2011 en 2012.


      [ref1]: https://wetten.overheid.nl/BWBR0011545#Artikel17
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0011545
        artikel: '17'
        hoofdstuk: '6'
  - number: '53.1'
    text: Het Besluit studiefinanciering wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel53
  - number: '53.2'
    text: |-
      In afwijking van het eerste lid blijven de artikelen 16m en 16n van het Besluit studiefinanciering van kracht tot
      het tijdstip waarop de wet houdende Wet opheffing College van beroep studiefinanciering (Stb. 2000, 284) in werking
      treedt.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel53
  - number: '54'
    text: Dit besluit treedt in werking op 1 september 2000.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel54
  - number: '55'
    text: Dit besluit wordt aangehaald als «Besluit studiefinanciering 2000».
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel55
