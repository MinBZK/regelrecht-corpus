      In dit besluit wordt verstaan onder: **aflosfase**: aflosfase, bedoeld in [artikel 6.7 van de wet][ref1],
      **familielid**: familielid als bedoeld in richtlijn 2004/38/EG, **instelling voor hoger onderwijs:** instelling
      voor hoger onderwijs als bedoeld in [artikel 1.2 van de WHW][ref2], **richtlijn 2004/38/EG:** richtlijn nr.
      2004/38/EG van het Europees Parlement en de Raad van 29 april 2004 betreffende het recht van vrij verkeer en
      verblijf op het grondgebied van de lidstaten voor de burgers van de Unie en hun familieleden, tot wijziging van
      Verordening (EEG) nr. 1612/68 en tot intrekking van de Richtlijnen 64/221/EEG, 68/360/EEG, 72/194/EEG, 73/148/
      EEG, 75/34/EEG, 75/35/EEG, 90/364/EEG, 90/365/EEG en 93/96/EEG (PbEU L 158), **voucher:** voucher als bedoeld
      in [artikel 12.15, eerste lid, van de wet][ref3], **vouchertegoed:** de waarde, of de voor een rechthebbende
      resterende waarde, van de voucher, en, **wet**: [Wet studiefinanciering 2000][ref4].


