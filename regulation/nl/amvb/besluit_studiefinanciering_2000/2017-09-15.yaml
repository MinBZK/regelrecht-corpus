    text: |-
      Met een Nederlander wordt eveneens gelijkgesteld de vreemdeling ten behoeve van wie
      of aan wie een tegemoetkoming is verstrekt als bedoeld in de [hoofdstukken 3][ref1] of
      [4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0012438
        hoofdstuk: '4'
  - number: 3a.1
    text: |-
      [Artikel 2.2, tweede lid, van de wet][ref1] is van toepassing op een persoon die:


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
  - number: 3a.1.a
    text: |-
      een nationaliteit heeft van een staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte,
      dan wel van Zwitserland;
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel3a
  - number: 3a.1.b
    text: niet het duurzaam verblijfsrecht, bedoeld in artikel 16 van [richtlijn 2004/38/EG](32004L0038), heeft verworven; en
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel3a
  - number: 3a.1.c
    text: 'geen:'
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel3a
  - number: 3a.1.c.1°
    text: werknemer;
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel3a
  - number: 3a.1.c.2°
    text: zelfstandige;
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel3a
  - number: 3a.1.c.3°
    text: persoon die de status van werknemer of zelfstandige heeft behouden; of
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel3a
  - number: 3a.1.c.4°
    text: familie van een persoon als bedoeld in onderdeel 1° tot en met 3° is.
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel3a
  - number: 3a.2
    text: |-
      [Artikel 2.2, tweede lid, van de wet][ref1] is eveneens van toepassing op familieleden van een persoon als bedoeld
      in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
  - number: 3a.3
    text: |-
      Voor deelnemers wordt de tegemoetkoming op grond van het eerste en tweede lid verstrekt in de vorm
      van een gift ter hoogte van het bedrag van de basisbeurs voor een thuiswonende deelnemer, genoemd in
      [artikel 3.18, overzicht 2, onder A, van de wet][ref1]. De tegemoetkoming wordt toegekend in één bedrag per
      studiejaar. Indien de aanspraak gedurende een studiejaar ontstaat bestaat de aanspraak uit een twaalfde van het
      bedrag per studiejaar maal het aantal resterende maanden van dat studiejaar. Indien de deelnemer in aanmerking komt
      voor het levenlanglerenkrediet wordt de tegemoetkoming toegekend in de vorm van levenlanglerenkrediet.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
  - number: 3a.4
    text: |-
      Voor studenten wordt de tegemoetkoming op grond van het eerste en tweede lid verstrekt in de vorm van een aanspraak
      op het collegegeldkrediet, bedoeld in [artikel 3.16a][ref1], of het levenlanglerenkrediet van de [wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011453
  - number: 3a.5
    text: |-
      Op de tegemoetkoming is [artikel 3.21, derde lid, van de wet][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
  - number: '4'
    text: |-
      Het onderwijs, bedoeld in [artikel 2.11 van de wet][ref1], is het onderwijs aan:


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0011545/2017-09-15#Artikel4
