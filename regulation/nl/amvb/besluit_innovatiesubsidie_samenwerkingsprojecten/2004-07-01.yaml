        paragraaf: '2'
  - number: '14'
    text: |-
      1 Onze Minister beslist afwijzend op een aanvraag om een subsidie voor industrieel onderzoek of preconcurrentiële
      ontwikkeling, indien de Adviescommissie innovatiesubsidie samenwerkingsprojecten een negatief advies heeft
      uitgebracht.

      2 Onze Minister verdeelt het beschikbare bedrag in de volgorde van rangschikking van de aanvragen door de
      commissie.

      3 Onze Minister kan afwijken van het eerste en tweede lid, indien een advies van de commissie in strijd is met dit
      besluit dan wel niet op zorgvuldige wijze tot stand is gekomen.
    url: https://wetten.overheid.nl/BWBR0015925/2004-07-01#Artikel14
  - number: '15'
    text: |-
      Met betrekking tot aanvragen om een subsidie voor een project, bestaande uit een haalbaarheidsstudie, waarop
      niet afwijzend is beslist, verdeelt Onze Minister het beschikbare bedrag in de volgorde van ontvangst van de
      aanvragen, met dien verstande dat indien een aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het
      in behandeling nemen van de aanvraag en met toepassing van [artikel 4:5 van de Algemene wet bestuursrecht][ref1]
      de gelegenheid heeft gehad de aanvraag aan te vullen, de dag waarop de aanvraag voldoet aan de wettelijke
      voorschriften met betrekking tot de verdeling als datum van ontvangst geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0015925/2004-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:5
  - number: '16'
    text: |-
      1 Aan de subsidieverlening zijn, voor zover daarbij niet anders bepaald, voor alle subsidie-ontvangers de
      in de [artikelen 17 tot en met 21][ref1] opgenomen verplichtingen verbonden, met dien verstande dat de in
      [artikelen 19][ref2] of [20][ref3] opgenomen verplichtingen slechts gelden voor de subsidie-ontvanger die als
      indiener van de aanvraag om subsidie in de zin van dit besluit is opgetreden.

      2 De in de [artikelen 17 tot en met 20][ref4] opgenomen verplichtingen gelden tot de dag waarop de subsidie wordt
      vastgesteld. De in [artikel 21][ref5] opgenomen verplichtingen gelden totdat vijf jaren na die dag zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0015925#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0015925#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0015925#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0015925#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0015925#Artikel21
    url: https://wetten.overheid.nl/BWBR0015925/2004-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0015925
        artikel: '17'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0015925
        artikel: '19'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0015925
        artikel: '20'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0015925
        artikel: '17'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0015925
        artikel: '21'
        paragraaf: '3'
  - number: '17'
    text: |-
      1 De subsidie-ontvanger voert het project uit overeenkomstig het projectplan waarop de subsidieverlening betrekking
      heeft en voltooit het uiterlijk op het bij de subsidieverlening bepaalde tijdstip, behoudens voorafgaande
      schriftelijke ontheffing van Onze Minister voor het vertragen, essentieel wijzigen of stopzetten van het project.

      2 De subsidie-ontvanger voert het project in Nederland uit, behoudens voorafgaande schriftelijke ontheffing van
      Onze Minister voor gedeeltelijke uitvoering buiten Nederland.

      3 Aan een ontheffing als bedoeld in het eerste of tweede lid kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0015925/2004-07-01#Artikel17
  - number: '18'
    text: |-
      1 De subsidie-ontvanger voert een administratie die zodanig is ingericht, dat daaruit te allen tijde op
      eenvoudige en duidelijke wijze alle projectkosten kunnen worden afgelezen, gespecificeerd overeenkomstig de
      in [artikel 4, eerste lid][ref1], respectievelijk [5, eerste lid][ref2], onderscheiden kostensoorten, met
      dien verstande dat ter zake van de loonkosten een door middel van een sluitende tijdschrijving vastgestelde
      urenverantwoording per werknemer aanwezig dient te zijn.

      2 De subsidie-ontvanger doet onverwijld mededeling aan Onze Minister van de indiening bij de rechtbank van een
      verzoek tot het op hem van toepassing verklaren van de schuldsaneringsregeling natuurlijke personen, tot verlening
      van surséance van betaling aan hem of tot faillietverklaring van hem.


      [ref1]: https://wetten.overheid.nl/BWBR0015925#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0015925#Artikel5
    url: https://wetten.overheid.nl/BWBR0015925/2004-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0015925
        artikel: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015925
        artikel: '5'
        paragraaf: '1'
  - number: '19'
    text: |-
      1 De subsidie-ontvanger brengt steeds, behoudens voorafgaande schriftelijke ontheffing van Onze Minister, na afloop
      van een periode van zes maanden aan Onze Minister schriftelijk verslag uit omtrent de uitvoering van het project,
      bestaande uit industrieel onderzoek of preconcurrentiële ontwikkeling, met inbegrip van een vergelijking van die
      uitvoering met het projectplan en de bij de subsidieverlening vermelde raming van de projectkosten.

      2 De subsidie-ontvanger dient zijn aanvraag om subsidievaststelling binnen zes maanden na het tijdstip waarop het
      in het eerste lid bedoelde project ingevolge [artikel 17, eerste lid][ref1], moet zijn voltooid bij Onze Minister
      in.

      3 De aanvraag wordt ingediend met gebruikmaking van het origineel van een ondertekend formulier, dat door Onze
      Minister wordt vastgesteld.

      4 De aanvraag gaat vergezeld van een accountantsverklaring die is opgesteld op de in het formulier aangegeven wijze
      indien de projectkosten € 50 000 of meer bedragen, en een eindverslag omtrent de uitvoering en de resultaten van
      het project, overeenkomstig hetgeen in het formulier is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0015925#Artikel17
    url: https://wetten.overheid.nl/BWBR0015925/2004-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0015925
        artikel: '17'
        paragraaf: '3'
  - number: '20'
    text: |-
      1 Met betrekking tot een project, bestaande uit een haalbaarheidsstudie, dient de subsidie-ontvanger
      zijn aanvraag om subsidievaststelling binnen twee maanden na het tijdstip waarop het project ingevolge
      [artikel 17, eerste lid][ref1], moet zijn uitgevoerd bij Onze Minister in.

      2 [Artikel 19, derde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015925#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0015925#Artikel19
    url: https://wetten.overheid.nl/BWBR0015925/2004-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0015925
        artikel: '17'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0015925
        artikel: '19'
        paragraaf: '3'
  - number: '21'
    text: |-
      1 De subsidie-ontvanger draagt, behoudens voorafgaande schriftelijke ontheffing van Onze Minister, met betrekking
      tot de resultaten van het project zorg voor:

      a. de tenaamstelling op eigen naam en de verwerving van rechten van intellectuele eigendom op de resultaten die
      daarvoor in aanmerking komen;

      b. de instandhouding van de in het eerste lid bedoelde rechten;

      c. de instandhouding van andere voor de uitvoering van het project van belang zijnde en door de uitvoering van het
      project opgedane kennis.

      2 De subsidie-ontvanger stelt, behoudens voorafgaande schriftelijke ontheffing van Onze Minister, niet ter
      beschikking van derden:

      a. rechten van intellectuele eigendom op de resultaten van het project;

      b. aanspraken op een intellectueel eigendomsrecht op de resultaten van het project;

      c. rechten die voortvloeien uit een aanvraag om een intellectueel eigendomsrecht op de resultaten van het project;

      3 De subsidie-ontvanger belast, behoudens voorafgaande schriftelijke ontheffing van Onze Minister, de in het tweede
      lid bedoelde rechten en aanspraken niet met een zekerheidsrecht ten behoeve van een derde.

      4 De subsidie-ontvanger brengt desgevraagd aan Onze Minister verslag uit omtrent de toepassing van de resultaten
      van het project.

      5 De subsidie-ontvanger zal, behoudens voorafgaande schriftelijke ontheffing van Onze Minister, niet:

      a. indien hij een rechtspersoon is, de rechtspersoon ontbinden of geheel of gedeeltelijk vervreemden noch zijn
      statutaire zetel verplaatsen buiten Nederland;

      b. indien hij deelneemt in een commanditaire vennootschap, vennootschap onder firma of maatschap, meewerken aan de
      ontbinding ervan of aan het uittreden van een of meer deelnemers ervan.

      6 Aan een ontheffing als bedoeld in het eerste, tweede, derde of vijfde lid kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0015925/2004-07-01#Artikel21
  - number: '22'
    text: |-
      Onze Minister kan bij de subsidieverlening verplichtingen opleggen met betrekking tot:

      a. het geven van bekendheid aan het project en de resultaten ervan;

      b. de samenwerking met derden bij of in verband met de uitvoering van het project;

      c. het verlenen van medewerking aan een door hem over de toepassing en de effecten van dit besluit ingesteld
      evaluatie-onderzoek, voor zover hij aan die medewerking redelijkerwijs behoefte heeft;

      d. de tenaamstelling, verwerving, instandhouding, exploitatie en vervreemding van rechten van intellectuele
      eigendom en de instandhouding van andere voor de uitvoering van het project van belang zijnde en door de uitvoering
      van het project opgedane kennis.
    url: https://wetten.overheid.nl/BWBR0015925/2004-07-01#Artikel22
  - number: '23'
    text: |-
      1 Op een subsidie ter zake waarvan een beschikking tot subsidieverlening geldt kunnen op aanvraag van de subsidie-
      ontvanger door Onze Minister voorschotten worden verstrekt.

      2 Een voorschot wordt berekend naar rato van de gemaakte en betaalde projectkosten, voor zover deze nog niet eerder
      bij de verstrekking van een voorschot in aanmerking zijn genomen. In totaal zal het bedrag aan voorschotten:

      a. voor zover het betreft een project, niet zijnde een haalbaarheidsstudie, niet groter zijn dan 80 procent van het
      bij de subsidieverlening vermelde maximale subsidiebedrag, en

      b. voor een project, bestaande uit een haalbaarheidsstudie, niet meer zijn dan een bij regeling van Onze Minister
      vast te stellen maximum.

      3 In afwijking van het eerste en tweede lid wordt aan een ondernemer als bedoeld in [artikel 3, vijfde lid][ref1],
      het eerste voorschot ambtshalve verstrekt bij de subsidieverlening, met dien verstande dat dit voorschot 25 procent
      bedraagt van het bij de subsidieverlening vermelde maximale subsidiebedrag. Indien de ondernemer deelnemer is in
      een samenwerkingsverband vindt overeenkomstige toepassing plaats van de eerste volzin op de andere leden van het
      samenwerkingsverband.

      4 Bij de toepassing van het tweede lid wordt de opslag, bedoeld in [artikel 4, eerste lid, onder b][ref2], geacht
      gemaakt en betaald te zijn voor zover de kosten waarover hij wordt berekend zijn gemaakt en betaald.

      5 Een voorschot als bedoeld in het tweede lid, onder a, wordt slechtsverstrekt, indien het bedrag aan voorschot
      meer is dan een bij regeling van Onze Minister te bepalen bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0015925#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0015925#Artikel4
    url: https://wetten.overheid.nl/BWBR0015925/2004-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0015925
        artikel: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015925
        artikel: '4'
        paragraaf: '1'
  - number: '24'
    text: |-
      1 Een aanvraag om een voorschot, niet zijnde een eerste voorschot als bedoeld in [artikel 23, derde lid][ref1], met
      betrekking tot een project, bestaande uit industrieel onderzoek of preconcurrentiële ontwikkeling, wordt ingediend
      gelijktijdig met het uitbrengen van een verslag als bedoeld in [artikel 19, eerste lid][ref2].

      2 De aanvraag wordt ingediend met gebruikmaking van het origineel van een ondertekend formulier, dat door Onze
      Minister wordt vastgesteld.

      3 Indien de aanvraag een project betreft dat wordt uitgevoerd door een samenwerkingsverband, dient de deelnemer in
      het samenwerkingsverband die als indiener van de aanvraag om subsidie in de zin van dit besluit is opgetreden, de
      aanvraag mede namens de andere deelnemers in.


      [ref1]: https://wetten.overheid.nl/BWBR0015925#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0015925#Artikel19
    url: https://wetten.overheid.nl/BWBR0015925/2004-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0015925
        artikel: '23'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0015925
        artikel: '19'
        paragraaf: '3'
  - number: '25'
    text: |-
      Onze Minister kan in ieder geval afwijzend beschikken op een aanvraag om een voorschot, indien een subsidie-
      ontvanger niet heeft voldaan aan ingevolge de subsidieverlening voor hem geldende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0015925/2004-07-01#Artikel25
  - number: '26'
    text: |-
      Onze Minister geeft de beschikking tot vaststelling van het bedrag van de subsidie binnen dertien weken na
      ontvangst van de aanvraag daartoe dan wel nadat de voor het indienen ervan geldende termijn is verstreken.
    url: https://wetten.overheid.nl/BWBR0015925/2004-07-01#Artikel26
  - number: '27'
    text: |-
      Het [Besluit subsidies bedrijfsgerichte technologische samenwerkingsprojecten][ref1],
      het [Besluit subsidies economie, ecologie en technologie][ref2] alsmede het
      [Besluit subsidies technische ontwikkelingsprojecten][ref3] worden ingetrokken, met dien verstande dat deze en de
      daarop gebaseerde regelgeving van toepassing blijven op aanvragen om subsidie die voor de inwerkingtreding van dit
      besluit zijn ingediend en op subsidies die voor de inwerkingtreding van dit besluit zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0008404
      [ref2]: https://wetten.overheid.nl/BWBR0008443
      [ref3]: https://wetten.overheid.nl/BWBR0012422
