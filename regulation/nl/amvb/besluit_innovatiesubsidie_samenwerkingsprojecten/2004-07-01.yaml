  - number: '10'
    text: |-
      Onze Minister geeft op een aanvraag:

      a. om een subsidie voor industrieel onderzoek of preconcurrentiële ontwikkeling, een beschikking binnen dertien
      weken na afloop van de in [artikel 7][ref1] bedoelde periode;

      b. om een subsidie voor een haalbaarheidsstudie, een beschikking binnen acht weken na ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0015925#Artikel7
