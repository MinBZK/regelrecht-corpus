  - number: '11'
    text: |-
      1 Indien de aanvraag een project betreft dat wordt uitgevoerd door een samenwerkingsverband, waarop niet met
      toepassing van de [artikelen 12][ref1] of [14][ref2] afwijzend wordt beslist, vermeldt de beschikking tot
      subsidieverlening een raming van de projectkosten per deelnemer in het samenwerkingsverband.

      2 Elke deelnemer in het samenwerkingsverband is tot ten hoogste het naar rato van de voor hem geraamde
      projectkosten berekende bedrag aansprakelijk voor terugbetaling van de subsidie, voor zover de subsidie-ontvangers
      daartoe verplicht zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0015925#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0015925#Artikel14
