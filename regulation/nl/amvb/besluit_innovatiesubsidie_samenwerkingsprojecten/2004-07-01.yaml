preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 13 juni 2003, nr. WJZ 3020.342;

    Gelet op artikel 3 van de Kaderwet EZ-subsidies;

    De Raad van State gehoord (advies van 31 juli 2003, nr. W10.03.0221/II);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 14 november 2003, nr. WJZ3064107;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0015925/2004-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. project: een voor Nederland nieuw, planmatig geheel van activiteiten, hetzij bestaande uit industrieel onderzoek
      of preconcurrentiële ontwikkeling, of een combinatie van beide, hetzij bestaande uit een haalbaarheidsstudie;

      b. industrieel onderzoek: onderzoek dat is gericht op het opdoen van nieuwe kennis met het doel deze te gebruiken
      bij de ontwikkeling van nieuwe producten, processen of diensten of om bestaande producten, processen of diensten
      aanmerkelijk te verbeteren;

      c. preconcurrentiële ontwikkeling: het omzetten van de resultaten van industrieel onderzoek in plannen, schema's of
      ontwerpen voor nieuwe, gewijzigde of verbeterde producten, processen of diensten;

      d. haalbaarheidsstudie: het tot stand brengen van een schriftelijk rapport, inhoudende een systematisch opgezette
      en afgeronde analyse alsmede een inschatting van de technische en economische mogelijkheden van industrieel
      onderzoek of preconcurrentiële ontwikkeling;

      e. ondernemer: een natuurlijke persoon of rechtspersoon, niet zijnde een rechtspersoon die krachtens publiekrecht
      is ingesteld, die een onderneming in stand houdt;

      f. groep: een economische eenheid, waarin organisatorisch zijn verbonden:

      1º. een natuurlijke persoon of privaatrechtelijke rechtspersoon, die direct of indirect:

        - meer dan de helft van het geplaatste kapitaal verschaft aan,
        - volledig aansprakelijk vennoot is van of
        - overwegende zeggenschap heeft over een of meer rechtspersonen of vennootschappen, en

      2º. laatstbedoelde rechtspersonen of vennootschappen;

      g. samenwerkingsverband: een geen rechtspersoonlijkheid bezittend verband, bestaande uit ten minste twee, niet in
      een groep verbonden natuurlijke personen of rechtspersonen, onder wie ten minste één ondernemer;

      h. kennisinstelling:

      1º. een [onder a of b van de bijlage van de Wet op het hoger onderwijs en wetenschappelijk onderzoek](onbekend)
      genoemde instelling voor hoger onderwijs en een [onder i van de bijlage van die wet](onbekend) bedoeld academisch
      ziekenhuis;

      2º. een andere dan onder 1° bedoelde geheel of gedeeltelijk door de rijksoverheid gefinancierde
      onderzoeksinstelling die activiteiten verricht met als doel de algemene wetenschappelijke en technische kennis uit
      te breiden;

      3º. een geheel of gedeeltelijk door een andere staat gefinancierde openbare instelling voor hoger onderwijs en een
      daaraan verbonden ziekenhuis gelijkwaardig aan een instelling respectievelijk academisch ziekenhuis als bedoeld
      onder 1°, of

      4º. een geheel of gedeeltelijk door een andere staat gefinancierde onderzoeksinstelling die activiteiten verricht
      met als doel de algemene wetenschappelijke en technische kennis uit te breiden.

      2 Onze Minister kan bij ministeriële regeling activiteiten aanwijzen die niet tot een project worden gerekend.

      3 Onze Minister kan bij ministeriële regeling ondernemingen en kennisinstellingen uitsluiten van subsidiëring op
      grond van dit besluit.

      4 Onze Minister kan bij ministeriële regeling andere dan de in het eerste lid, onderdeel h, bedoelde instellingen
      als kennisinstelling aanwijzen.
    url: https://wetten.overheid.nl/BWBR0015925/2004-07-01#Artikel1
  - number: '2'
    text: |-
      1 Onze Minister verstrekt op aanvraag een subsidie aan:

      a. de in Nederland gevestigde deelnemers in een samenwerkingsverband die voor gezamenlijke rekening en risico een
      project uitvoeren, of

      b. een in Nederland gevestigde ondernemer die voor eigen rekening en risico een project, niet zijnde een
      haalbaarheidsstudie, uitvoert:

      1º. in samenhang met activiteiten die worden uitgevoerd door een of meer andere natuurlijke personen of
      rechtspersonen die niet in Nederland gevestigd zijn en die niet met hem in een groep, commanditaire vennootschap,
      vennootschap onder firma of maatschap zijn verbonden, of

      2º. waarvan een deel van de activiteiten wordt uitbesteed aan andere natuurlijke personen of rechtspersonen, die
      niet met hem in een groep, commanditaire vennootschap, vennootschap onder firma of maatschap zijn verbonden.

      2 Indien de aanvragers deelnemers in een samenwerkingsverband zijn, wordt de subsidie verstrekt aan de in Nederland
      gevestigde deelnemers gezamenlijk en betaald aan de deelnemer die als indiener van de aanvraag om subsidie in de
      zin van dit besluit is opgetreden.

      3 Geen subsidie wordt verstrekt:

      a. indien voor het project reeds door Onze Minister subsidie is verstrekt;

      b. aan een overheid of overheidsinstelling, tenzij het een kennisinstelling betreft;

      c. voor zover door verlening van de subsidie in het kalenderjaar waarin de beschikking wordt gegeven aan de
      aanvrager dan wel aan de totdezelfde groep als de aanvrager behorende ondernemers meer dan een bij regeling van
      Onze Minister vast te stellen bedrag aan subsidie op grond van dit besluit zou worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0015925/2004-07-01#Artikel2
  - number: '3'
    text: |-
      1 De subsidie bedraagt 25 procent van de projectkosten, indien deze betrekking hebben op preconcurrentiële
      ontwikkeling, maar niet meer dan een bij regeling van Onze Minister vast te stellen bedrag.

      2 De subsidie bedraagt 50 procent van de projectkosten, indien deze betrekking hebben op industrieel onderzoek,
      maar niet meer dan een bij regeling van Onze Minister vast te stellen bedrag.

      3 Indien de projectkosten betrekking hebben op zowel preconcurrentiële ontwikkeling als industrieel onderzoek,
      bedraagt de subsidie het gewogen gemiddelde van de in het eerste en tweede lid genoemde percentages van de
      desbetreffende projectkosten, maar niet meer dan een bij regeling van Onze Minister vast te stellen bedrag.

      4 De subsidie bedraagt 50 procent van de projectkosten, indien deze betrekking hebben op een haalbaarheidsstudie,
      maar niet meer dan een bij regeling van Onze Minister vast te stellen bedrag.

      5 De in het eerste tot en met derde lid genoemde percentages worden verhoogd met 10 procentpunten, indien subsidie
      verstrekt wordt aan deelnemers in een samenwerkingsverband voor zover de projectkosten worden gemaakt en betaald
      door een deelnemer die een ondernemer is die een kleine of middelgrote onderneming in stand houdt in de zin van
      [verordening (EG) nr. 70/2001](32001R0070) van de Commissie van de Europese Gemeenschappen van 12 januari 2001
      betreffende de toepassing van de artikelen 87 en 88 van het EG-Verdrag op staatssteun voor kleine en middelgrote
      ondernemingen (PbEG L 10), naar de tekst zoals deze bij die verordening is vastgesteld.

      6 Onverminderd het vijfde lid worden de in het eerste tot en met derde lid genoemde percentages verhoogd met 10
      procentpunten, indien subsidie verstrekt wordt aan deelnemers in een samenwerkingsverband, indien:

      a. ten minste één deelnemer een kennisinstelling is, of

      b. ten minste één deelnemer in het samenwerkingsverband in een andere lidstaat van de Europese Unie dan Nederland
      is gevestigd en niet behoort tot een groep van een in Nederland gevestigde deelnemer.

      7 Indien ter zake van de projectkosten of een deel daarvan reeds door een ander bestuursorgaan subsidie is
      verstrekt, wordt slechts een zodanig bedrag aan subsidie verstrekt, dat het totale bedrag aan subsidies niet
      meer bedraagt dan het desbetreffende bedrag dat bij regeling van Onze Minister is genoemd, noch, uitgedrukt in
      een percentage van de projectkosten, meer bedraagt dan het ingevolge het eerste tot en met zesde lid geldende
      percentage.

      8 Indien ter zake van de projectkosten of een deel daarvan reeds door de Commissie van de Europese Gemeenschappen
      subsidie is verstrekt, wordt slechts een zodanig bedrag aan subsidie verstrekt, dat het totale bedrag aan
      subsidie niet meer bedraagt dan het desbetreffende bedrag dat bij regeling van Onze Minister is genoemd, noch meer
      bedraagt dan 50 procent van de projectkosten voor zover het preconcurrentiële ontwikkeling en 75 procent van de
      projectkosten voor zover het industrieel onderzoek betreft.
    url: https://wetten.overheid.nl/BWBR0015925/2004-07-01#Artikel3
  - number: '4'
    text: |-
      1 Als projectkosten van een project, bestaande uit industrieel onderzoek of preconcurrentiële ontwikkeling, worden
      uitsluitend in aanmerking genomen:

      a. de volgende rechtstreeks aan de uitvoering van het project toe te rekenen, na de indiening van de aanvraag door
      de subsidie-ontvanger gemaakte en betaalde kosten:

      1º. loonkosten, met dien verstande dat wordt uitgegaan van een uurloon, berekend op basis van het jaarloon bij een
      volledige dienstbetrekking volgens de kolom «loon voor de loonbelasting» van de loonstaat van het betrokken directe
      personeel, verhoogd met de wettelijke dan wel de op grond van een individuele of collectieve arbeidsovereenkomst
      verschuldigde opslagen voor sociale lasten, en van 1650 productieve uren per jaar;

      2º. kosten van aangeschafte machines en apparatuur, met dien verstande dat wordt uitgegaan van de aan het
      project toe te rekenen afschrijvingskosten, berekend op basis van de historische aanschafprijzen en de door
      de belastingdienst geaccepteerde afschrijvingstermijnen, met uitzondering van mogelijkheden tot vervroegde
      afschrijving, of lease-termijnen, met uitzondering van financieringskosten, en gebaseerd op de bedrijfseconomische
      levensduur;

      3º. kosten van verbruikte materialen en hulpmiddelen, gebaseerd op historische aanschafprijzen;

      4º. andere aan derden verschuldigde kosten, met uitzondering van:

        - behoudens voorafgaande schriftelijke ontheffing van Onze Minister: die kosten van activiteiten van het project
      die zijn uitbesteed aan een niet in Nederland gevestigde kennisinstelling of ondernemer, indien een in Nederland
      gevestigde instelling of ondernemer over ten minste gelijkwaardige kennis en middelen beschikt om de bedoelde
      activiteiten uit te voeren;
        - binnenlandse reis- en verblijfkosten;

      b. een opslag voor algemene kosten, groot 50 procent van de onder a, onder 1°, bedoelde kosten.

      2 Kosten van machines en apparatuur die niet uitsluitend voor het project zijn aangeschaft, worden slechts als
      projectkosten op de voet van het eerste lid, onder a, onder 2°, in aanmerking genomen, indien een door middel van
      een sluitende tijdschrijving vastgestelde urenverantwoording per machine respectievelijk van de apparatuur aanwezig
      is.

      3 Indien geen loonkosten als bedoeld in het eerste lid, onder a, onder 1°, worden gemaakt, maar niettemin arbeid
      ten behoeve van het project wordt verricht, wordt voor de berekening van de projectkosten uitgegaan van een bij
      regeling van Onze Minister vast te stellen uurtarief.

      4 Bij regeling van Onze Minister kan aan de kosten, bedoeld in het eerste lid, onder a, onder 4°, een maximum
      worden verbonden en kunnen regels worden gesteld over daartoe te rekenen categorieën van kosten.

      5 De kosten worden in aanmerking genomen met inbegrip van omzetbelasting, indien de subsidie-ontvanger die de
      kosten heeft gemaakt omzetbelasting niet in aftrek kan brengen.

      6 Aan een ontheffing als bedoeld in het eerste lid, onder a, onder 4°, kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0015925/2004-07-01#Artikel4
  - number: '5'
    text: |-
      1 Als projectkosten van een project, bestaande uit een haalbaarheidsstudie, worden uitsluitend in aanmerking
      genomen de volgende rechtstreeks aan de uitvoering van het project toe te rekenen, na de indiening van de aanvraag
      door de subsidie-ontvanger gemaakte en betaalde kosten:

      a. loonkosten, met dien verstande dat wordt uitgegaan van een uurloon, berekend op basis van het jaarloon bij een
      volledige dienstbetrekking volgens de kolom «loon voor de loonbelasting» van de loonstaat van het betrokken directe
      personeel, verhoogd met de wettelijke dan wel de op grond van een individuele of collectieve arbeidsovereenkomst
      verschuldigde opslagen voor sociale lasten, en van 1650 productieve uren per jaar;

      b. aan derden verschuldigde kosten, met uitzondering van binnenlandse reis- en verblijfkosten.

      2 [Artikel 4, derde tot en met vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015925#Artikel4
    url: https://wetten.overheid.nl/BWBR0015925/2004-07-01#Artikel5
