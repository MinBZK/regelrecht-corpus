  - number: '12'
    text: |-
      Onze Minister beslist in ieder geval afwijzend op een aanvraag:

      a. indien de aanvraag niet voldoet aan dit besluit en de daarop berustende bepalingen;

      b. indien subsidieverlening in strijd zou zijn met bij regeling van Onze Minister vastgestelde regels omtrent een
      evenwichtige spreiding over grotere en kleinere ondernemingen als bedoeld in [artikel 2, eerste lid][ref1];

      c. in geval de aanvraag een project, bestaande uit industrieel onderzoek of preconcurrentiële ontwikkeling,
      betreft: indien hij het onaannemelijk acht dat het project binnen vier jaren kan worden uitgevoerd, met dien
      verstande dat hij die periode op verzoek van de subsidie-ontvanger met ten hoogste een jaar kan verlengen;

      d. in geval de aanvraag een project, bestaande uit een haalbaarheidsstudie, betreft: indien:

      1º. hij in elk geval de technische haalbaarheid van de aspecten, waarop de haalbaarheidsstudie betrekking heeft,
      onaannemelijk acht;

      2º. hij het onaannemelijk acht dat het project binnen een jaar kan worden uitgevoerd;

      e. indien gegronde vrees bestaat dat de betrokkenen het project niet kunnen financieren.


      [ref1]: https://wetten.overheid.nl/BWBR0015925#Artikel2
    url: https://wetten.overheid.nl/BWBR0015925/2004-07-01#Artikel12
