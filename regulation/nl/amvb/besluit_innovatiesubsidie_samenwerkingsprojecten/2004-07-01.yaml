  - number: '13'
    text: |-
      1 Onze Minister wint omtrent de aanvragen om een subsidie voor een project, bestaande uit industrieel onderzoek
      of preconcurrentiële ontwikkeling, waarop niet met toepassing van [artikel 12][ref1] afwijzend wordt beslist het
      advies in van de Adviescommissie innovatiesubsidie samenwerkingsprojecten.

      2 De commissie geeft aan Onze Minister in ieder geval een negatief advies:

      a. indien onvoldoende vertrouwen bestaat in de technische en economische haalbaarheid van het project;

      b. indien onvoldoende vertrouwen bestaat dat de betrokkenen de capaciteiten hebben om het project naar behoren uit
      te voeren;

      c. indien van het project onvoldoende positieve gevolgen voor de Nederlandse economie te verwachten zijn.

      3 De commissie rangschikt per groep van aanvragen waarvoor een subsidieplafond geldt de aanvragen waaromtrent zij
      positief adviseert zodanig, dat een project hoger gerangschikt wordt naar mate het meer bijdraagt aan bij regeling
      van Onze Minister vast te stellen criteria omtrent:

      a. technologische innovatie;

      b. duurzaamheid;

      c. technologische samenwerking;

      d. economisch perspectief.


      [ref1]: https://wetten.overheid.nl/BWBR0015925#Artikel12
    url: https://wetten.overheid.nl/BWBR0015925/2004-07-01#Artikel13
