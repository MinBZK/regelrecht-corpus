  - number: '6'
    text: |-
      1 Er is een Adviescommissie innovatiesubsidie samenwerkingsprojecten, die tot taak heeft Onze Minister op zijn
      verzoek te adviseren omtrent aanvragen om een subsidie voor een project, bestaande uit industrieel onderzoek of
      preconcurrentiële ontwikkeling.

      2 De adviezen van de commissie gaan vergezeld van een deugdelijke motivering.

      3 De commissie bestaat uit een voorzitter en ten minste acht en ten hoogste vijfendertig andere leden. De leden
      zijn deskundig op het terrein waarop de commissie een taak heeft en zijn geen ambtenaren, werkzaam bij het
      Ministerie van Economische Zaken.

      4 De voorzitter en de leden worden door Onze Minister voor een termijn van ten hoogste vier jaar benoemd. Ze zijn
      te allen tijde opnieuw benoembaar.

      5 Onze Minister kan deelcommissies instellen en leden van de commissie benoemen in deelcommissies.

      6 Onze Minister kan op verzoek van de commissie met het oog op de uitoefening van haar taak deskundigen opdracht
      verlenen onderzoek te verrichten naar een door haar aangewezen project.

      7 De commissie stelt haar werkwijze schriftelijk vast.

      8 Een lid van de commissie en een deskundige als bedoeld in het zesde lid nemen niet deel aan de voorbereiding en
      vaststelling van een advies, indien zij een persoonlijk belang hebben bij de beschikking op een aanvraag.

      9 Onze Minister kan waarnemers aanwijzen, die het recht hebben de vergaderingen van de commissie bij te wonen.

      10 In het secretariaat van de commissie wordt door Onze Minister voorzien.

      11 Het beheer van de bescheiden betreffende de werkzaamheden van de commissie geschiedt op overeenkomstige wijze
      als bij het Ministerie van Economische Zaken. De bescheiden worden na beëindiging van de werkzaamheden van de
      commissie bewaard in het archief van dat ministerie.

      12 De commissie verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde
      inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de
      vervulling van zijn taak redelijkerwijs nodig is.

      13 De commissie stelt jaarlijks voor 1 april een verslag op van haar werkzaamheden in het afgelopen kalenderjaar.
      Op verzoek van Onze Minister, maar ten minste elk vierde jaar, stelt de commissie tevens een evaluatieverslag op,
      waarin zij aandacht besteedt aan de doelmatigheid en doeltreffendheid van haar taakvervulling. Het jaarverslag en
      het evaluatieverslag worden aan Onze Minister toegezonden en algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0015925/2004-07-01#Artikel6
  - number: '7'
    text: |-
      1 Onze Minister stelt bij ministeriële regeling perioden vast, na afloop waarvan de aanvragen om een subsidie
      voor een project, bestaande uit industrieel onderzoek of preconcurrentiële ontwikkeling, die in die periode zijn
      ontvangen en voldoen aan de wettelijke voorschriften, worden behandeld.

      2 Onze Minister stelt voorts bij ministeriële regeling een subsidieplafond vast voor het verlenen van in het
      eerste lid bedoelde subsidies op in die periode ontvangen aanvragen. Daarbij kan hij afzonderlijke subsidieplafonds
      vaststellen voor bepaalde categorieën aanvragers en voor bepaalde categorieën projecten.
    url: https://wetten.overheid.nl/BWBR0015925/2004-07-01#Artikel7
  - number: '8'
    text: |-
      Onze Minister stelt bij ministeriële regeling een subsidieplafond vast voor het verlenen van subsidies voor een
      project, bestaande uit een haalbaarheidsstudie, op aanvragen, ingediend in een daarbij genoemd begrotingsjaar of
      deel daarvan. Daarbij kan hij afzonderlijke subsidieplafonds vaststellen voor bepaalde categorieën aanvragers en
      voor bepaalde categorieën projecten.
    url: https://wetten.overheid.nl/BWBR0015925/2004-07-01#Artikel8
  - number: '9'
    text: |-
      1 Een aanvraag om subsidie wordt ingediend met gebruikmaking van het origineel van een ondertekend formulier, dat
      door Onze Minister wordt vastgesteld.

      2 De aanvraag gaat vergezeld van een projectplan en een begroting voor het project alsmede van een overeenkomst,
      waarin de samenwerking tussen de deelnemers in het samenwerkingsverband dan wel de uitbesteding van activiteiten is
      geregeld alsmede van andere bescheiden, overeenkomstig hetgeen in het formulier is vermeld.

      3 Indien de aanvraag een project betreft dat wordt uitgevoerd door een samenwerkingsverband, dient een in het
      samenwerkingsverband deelnemende ondernemer de aanvraag mede namens de andere deelnemers in, met dien verstande dat
      een aanvraag met betrekking tot een haalbaarheidsstudie uitsluitend kan worden ingediend door een ondernemer als
      bedoeld in [artikel 3, vijfde lid][ref1].

      4 Bij regeling van Onze Minister kunnen regels worden gesteld omtrent het voorafgaand aan de aanvraag verkrijgen
      van een preadvies van de Adviescommissie innovatiesubsidie samenwerkingsprojecten over de globale opzet van het
      project, bestaande uit industrieel onderzoek of preconcurrentiële ontwikkeling.


      [ref1]: https://wetten.overheid.nl/BWBR0015925#Artikel3
    url: https://wetten.overheid.nl/BWBR0015925/2004-07-01#Artikel9
