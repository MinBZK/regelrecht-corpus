preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onzen Minister van Economische Zaken van 14 November 1946, N°. 87572, Afdeeling Mijnwezen;

    Gelet op artikel 9, tweede lid, van de Mijnwet 1903 (Staatsblad 1904, N°. 73) zooals deze is gewijzigd laatstelijk
    bij de wet van 20 Juni 1938 (Staatsblad N°. 521);

    Den Raad van State gehoord (advies van 17 December 1946, N°. 25);

    Gezien het nader rapport van Onzen voornoemden Minister van 11 Januari 1947, N°. 99034, Afdeeling Mijnwezen;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Ondergrondsche steengroeven mogen niet dan met vergunning van Onze Minister van Economische Zaken worden ontgonnen
      of voor andere doeleinden dan ontginning in gebruik worden genomen.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel1
  - number: '1.2'
    text: De vergunning wordt slechts geweigerd op gronden, verband houdende met de veiligheid.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel1
  - number: '1.3'
    text: Aan de vergunning kunnen ter verzekering van de veiligheid voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel1
  - number: '2.1'
    text: |-
      De aanvraag om vergunning wordt tot Onze Minister van Economische Zaken gericht, doch door tussenkomst van het
      bestuur der gemeente, binnen welke de grond is gelegen, waaronder de groeve zich bevindt of zal bevinden, ingediend
      bij de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel2
  - number: '2.2'
    text: |-
      Indien de groeve zich zal uitstrekken onder grond, gelegen in meer dan één gemeente, geschiedt de indiening door
      tusschenkomst van het bestuur der gemeente, binnen welke het grootste gedeelte der groeve zal zijn gelegen. Betreft
      de aanvraag een bestaande groeve, dan geschiedt de indiening door tusschenkomst van het bestuur der gemeente,
      binnen welke de ingang, of, ingeval de groeve meer dan één ingang heeft, binnen welke de hoofdingang der groeve
      zich bevindt.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel2
  - number: '3.1'
    text: 'De aanvraag om vergunning moet inhouden:'
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel3
  - number: 3.1.a
    text: naam, voornamen, woonplaats en beroep van den aanvrager;
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel3
  - number: 3.1.b
    text: een opgave van de kadastrale perceelen, waaronder de groeve zich uitstrekt of zal uitstrekken;
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel3
  - number: 3.1.c
    text: |-
      een omschrijving van de voorgenomen ontginningswijze of van het ander gebruik, dat van de groeve zal worden
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel3
  - number: '3.2'
    text: 'Bij de aanvraag om vergunning moeten worden overgelegd:'
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel3
  - number: 3.2.a
    text: |-
      een kaart in tweevoud op een schaal, ten genoegen van den Inspecteur-Generaal der Mijnen, van het terrein,
      waaronder de groeve zich uitstrekt of zal uitstrekken, met de naaste omgeving tot op een afstand van ten minste
      vijf en twintig meter in alle richtingen; op deze kaart moeten zijn aangegeven alle gebouwen, land-, spoor- en
      waterwegen, alsmede de plaats, waar met de werkzaamheden zal worden aangevangen en, indien de aanvraag op een
      bestaande groeve betrekking heeft, de ingang of ingangen en de aanwezige ondergrondsche uitgravingen; de ligging
      der op dit plan aangeduide groeve moet worden aangesloten aan het Nederlandsche Rijksdriehoeksnet;
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel3
  - number: 3.2.b
    text: |-
      een uittreksel uit de kadastrale leggers betreffende de perceelen, waaronder de groeve zich uitstrekt of zal
      uitstrekken.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel3
  - number: '3.3'
    text: |-
      Indien en voor zoover de aanvraag wordt gedaan door een ander dan den eigenaar van den grond, waaronder de groeve
      zich uitstrekt of zal uitstrekken, moet bij de aanvraag tevens worden overgelegd een verklaring van den eigenaar
      of van de eigenaren van den grond, blijkens welke zij den verzoeker voor den duur van tenminste vijftien jaren
      toestemming hebben verleend voor de ontginning of het gebruik van de in hun grond gelegen groeve, overeenkomstig
      het eerste lid, onder *c*.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel3
  - number: '4.1'
    text: |-
      De aanvraag wordt met de bijlagen door het gemeentebestuur, bij hetwelk het is ingezonden, ten spoedigste ter
      inzage gelegd op de secretarie der gemeente; het ter inzage leggen wordt gelijktijdig op de in de gemeente
      gebruikelijke wijze ter openbare kennis gebracht.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel4
  - number: '4.2'
    text: |-
      In het geval, bedoeld in het [tweede lid van artikel 2][ref1], doet het gemeentebestuur mededeeling van het ter
      inzage leggen aan de besturen van de andere gemeenten, binnen welker gebied een gedeelte van de groeve is of zal
      zijn gelegen. Deze besturen brengen deze mededeeling ten spoedigste op de in hun gemeenten gebruikelijke wijze ter
      openbare kennis en geven hiervan, met vermelding van de dagteekening, bericht aan eerstgenoemd gemeentebestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0002025#Artikel2
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002025
        artikel: '2'
  - number: '5.1'
    text: |-
      De aanvraag met de bijlagen blijft ter inzage liggen gedurende vier weken na de dagteekening van de in het vorig
      artikel bedoelde kennisgevingen.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel5
  - number: '5.2'
    text: |-
      Gedurende dien tijd kunnen bedenkingen tegen de voorgenomen ontginning of ander gebruik der groeve schriftelijk
      worden ingediend bij het bestuur der gemeente, waar de stukken ter inzage liggen.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel5
  - number: '6'
    text: |-
      Na het verstrijken van den in het vorig artikel bedoelden termijn zendt het gemeentebestuur de aanvraag
      met bijlagen en de ingebrachte bedenkingen, vergezeld van een verklaring, dat aan het bepaalde in de
      [artikelen 4][ref1] en [5][ref2] is voldaan, aan den Inspecteur-Generaal der Mijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0002025#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002025#Artikel5
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002025
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002025
        artikel: '5'
  - number: '7'
    text: |-
      Bij de bekendmaking van de beschikking op de aanvraag om vergunning zendt Onze Minister van Economische Zaken de
      aanvrager een door hem gewaarmerkt exemplaar van de in [artikel 3, tweede lid, onder ][ref1], bedoelde kaart. Aan
      Gedeputeerde Staten en aan de betrokken gemeentebesturen wordt mededeling van de beschikking gedaan door toezending
      van een afschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0002025#Artikel3
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002025
        artikel: '3'
  - number: '8.1'
    text: |-
      De vergunning is van kracht voor den vergunninghouder en zijn rechtverkrijgenden, behoudens het bepaalde in het
      derde en vierde lid.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel8
  - number: '8.2'
    text: |-
      Bij overgang of overdracht van de vergunning is de nieuwe vergunninghouder verplicht daarvan onverwijld kennis te
      geven aan Onze Minister van Economische Zaken, die de vergunning ten name van den nieuwen vergunninghouder stelt.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel8
  - number: '8.3'
    text: |-
      Evenwel kan een vergunning, welke was verleend aan den eigenaar van den grond, waaronder de groeve zich uitstrekt
      of zal uitstrekken, niet overgaan op of worden overgedragen aan een nieuwen vergunninghouder dan met den eigendom
      van dien grond, tenzij de eigenaar van den grond hem voor den tijd van tenminste vijftien jaren of voor den duur
      der vergunning, indien deze korter is, toestemming verleent voor de ontginning of het gebruik van de groeve.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel8
  - number: '8.4'
    text: |-
      Ontginning of ander gebruik van de groeve bij wijze van verpachting is slechts geoorloofd met toestemming van Onze
      Minister van Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel8
  - number: '9.1'
    text: |-
      Onverminderd hetgeen bij of krachtens dit Reglement aan anderen is voorgeschreven, is de vergunninghouder verplicht
      zorg te dragen voor de naleving van de bij of krachtens dit Reglement gegeven voorschriften, behoudens het bepaalde
      in de volgende leden van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel9
  - number: '9.2'
    text: |-
      Indien de vergunninghouder een naar het oordeel van Onze Minister van Economische Zaken voldoende deskundig
      bedrijfsleider of opzichter heeft aangewezen, die belast is met de zorg voor de naleving van de in het vorig lid
      bedoelde voorschriften en Onze Minister van Economische Zaken deze aanwijzing schriftelijk heeft aanvaard, is
      die bedrijfsleider of opzichter verplicht voor de naleving van die voorschriften zorg te dragen en vervalt de
      verplichting van den vergunninghouder.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel9
  - number: '9.3'
    text: |-
      In het geval, bedoeld in [artikel 8, vierde lid][ref1], rust de verplichting, bedoeld in het eerste lid, met
      uitsluiting van den vergunninghouder, op dengene, die de groeve met toestemming van Onze Minister van Economische
      Zaken ontgint of in gebruik heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002025#Artikel8
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002025
        artikel: '8'
  - number: '10.1'
    text: |-
      Het in [artikel 7][ref1] bedoelde gewaarmerkte exemplaar moet te allen tijde op aanvrage ter inzage worden
      verstrekt aan de ambtenaren van het Staatstoezicht op de Mijnen. Ten minste éénmaal per jaar en wel in den loop
      van het eerste kwartaal, moet dit exemplaar, evenals het bij het Staatstoezicht op de Mijnen berustende exemplaar,
      worden bijgewerkt; indien in den loop van het laatst afgeloopen kalenderjaar geen ontginningswerkzaamheden hebben
      plaats gehad, moet hiervan in den loop van het eerste kwartaal van het eerstvolgend kalenderjaar op genoemde
      exemplaren aanteekening worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0002025#Artikel7
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002025
        artikel: '7'
  - number: '10.2'
    text: |-
      Indien door Onze Minister van Economische Zaken fouten of nalatigheden in bedoelde gewaarmerkte exemplaren worden
      aangetroffen, moeten binnen een door hem te stellen termijn de voorgeschreven aanvullingen en veranderingen zijn
      aangebracht.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel10
  - number: '10.3'
    text: |-
      Het bijwerken van het bedoelde gewaarmerkte exemplaar kan desgevraagd na voorafgaande betaling der kosten, voor
      elk geval afzonderlijk door Onze Minister van Economische Zaken te bepalen, geschieden door het Staatstoezicht op
      de Mijnen.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel10
  - number: '11.1'
    text: |-
      Van iedere aanwijziging van een bedrijfsleider of opzichter en van elk ontslag van zulk een persoon moet
      onmiddellijk schriftelijk kennis worden gegeven aan den Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel11
  - number: '11.2'
    text: |-
      Bij gebleken ongeschiktheid of onbetrouwbaarheid moet de bedrijfsleider of opzichter onverwijld van de hem
      opgedragen taak worden ontheven, met onmiddellijke schriftelijke mededeeling aan den Inspecteur-Generaal der
      Mijnen.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel11
  - number: '12'
    text: |-
      De vergunninghouder is verplicht zorg te dragen, dat op een door Onze Minister van Economische Zaken goed te keuren
      plaats een groevenboek aanwezig is, waarin de ambtenaren van het Staatstoezicht op de Mijnen hun bezoeken kunnen
      aanteekenen, zoomede de opmerkingen, waartoe die bezoeken hun aanleiding hebben gegeven.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel12
  - number: '13'
    text: |-
      In de groeve mogen geen werkzaamheden worden verricht door andere personen, dan die daartoe aangewezen zijn door
      dengene, op wien ingevolge [artikel 9][ref1] de zorg voor de naleving van de bij of krachtens dit Reglement gegeven
      voorschriften rust.


      [ref1]: https://wetten.overheid.nl/BWBR0002025#Artikel9
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002025
        artikel: '9'
  - number: '14.1'
    text: |-
      Voor den 10en van iedere maand moet aan den Inspecteur-Generaal der Mijnen een opgave worden gezonden van de
      gedurende de afgeloopen maand ontgonnen hoeveelheid losse mergel en mergelbrokken in tonnen en de hoeveelheid
      mergelblokken in kubieke meters en overige grondsoorten, alsmede van het aantal gewerkte dagen, het aantal
      arbeiders en de hoeveelheden verbruikte ontplofbare stoffen.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel14
  - number: '14.2'
    text: Van het bepaalde in het vorig lid kan door Onze Minister van Economische Zaken ontheffing worden verleend.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel14
  - number: '15'
    text: |-
      Onder gebouwen, land-, spoor- en waterwegen of binnen een afstand van vijf en twintig meters daarvan mogen geen
      ontginningswerkzaamheden of andere uitgravingen plaats vinden zonder schriftelijke toestemming van Onze Minister
      van Economische Zaken. Aan deze toestemming kunnen voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel15
  - number: '16.1'
    text: |-
      Wanneer de algemene veiligheid of de veiligheid in de groeve op enige wijze wordt bedreigd, dan wel een of
      meer personen zich in onmiddellijk levensgevaar bevinden, moet hiervan onverwijld kennis worden gegeven aan de
      Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel16
  - number: '16.2'
    text: |-
      Wanneer naar het oordeel van Onze Minister van Economische Zaken hetzij voor de algemene veiligheid hetzij voor de
      veiligheid in de groeve gevaar bestaat, kan hij maatregelen ter afwending van dat gevaar voorschrijven.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel16
  - number: '16.3'
    text: |-
      Bij onmiddellijk dreigend gevaar zijn ook de ambtenaren van het Staatstoezicht op de Mijnen bevoegd maatregelen
      voor te schrijven; zodanige voorschriften moeten onverwijld door Onze Minister van Economische Zaken worden
      bevestigd, gewijzigd of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel16
  - number: '17.1'
    text: |-
      Van alle ongevallen moet op geregelde, door Onze Minister van Economische Zaken te bepalen, tijdstippen worden
      kennis gegeven aan de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel17
  - number: '17.2'
    text: |-
      Van ieder ongeval, dat den dood van een persoon, of letsel, hetwelk vermoedelijk omstreeks zes weken of langer voor
      den arbeid ongeschikt maakt, ten gevolge heeft gehad, moet onmiddellijk kennis worden gegeven aan den Inspecteur-
      Generaal der Mijnen en aan den burgemeester der betrokken gemeente. Voor zoover zonder gevaar mogelijk, moet
      alles ter plaatse in denzelfde toestand gelaten worden, totdat een ambtenaar van het Staatstoezicht op de Mijnen
      toestemming tot opruiming heeft gegeven. De getuigen moeten ter beschikking worden gesteld op het tijdstip, door
      den ambtenaar van het Staatstoezicht op de Mijnen aangegeven.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel17
  - number: '17.3'
    text: |-
      Van belangrijke instortingen en andere voorvallen, waarmede de veiligheid gemoeid kan zijn, moet onverwijld kennis
      worden gegeven aan den Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel17
  - number: '18.1'
    text: |-
      De inrichting van de groeven moet voldoen aan den eisch van veilig werk; zoodanige beveiligingen moeten worden
      aangebracht, dat gevaar bij het verkeer, het vervoer of den arbeid en gevaar voor geheele of gedeeltelijke
      instorting zooveel mogelijk is uitgesloten.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel18
  - number: '18.2'
    text: |-
      Onze Minister van Economische Zaken is bevoegd met het oog op het bepaalde in het vorig lid nadere voorschriften
      te geven.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel18
  - number: '19.1'
    text: |-
      In groeven, welke door den aard van het gebruik, dat er krachtens de in [artikel 1][ref1] bedoelde vergunning
      van wordt gemaakt, opengesteld zijn voor anderen dan de er in te werk gestelde personen, moeten op de door of
      namens Onze Minister van Economische Zaken aan te wijzen plaatsen duidelijk in het oog vallende wegwijzers zijn
      aangebracht, welke het voor niet in de groeve bekend zijnde personen mogelijk maken den uitgang te vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0002025#Artikel1
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002025
        artikel: '1'
  - number: '19.2'
    text: |-
      De ingangen van groeven, welke niet zijn opengesteld voor andere dan de er in te werk gestelde personen, moeten
      van een deugdelijke afsluiting zijn voorzien, alsmede van borden met het opschrift "Verboden toegang". Het is
      aan onbevoegden verboden, deze groeven te betreden. Van het einde van den werktijd tot het begin van den werktijd
      moeten alle uitgangen van deze groeven gesloten zijn.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel19
  - number: '19.3'
    text: |-
      Onze Minister van Economische Zaken is bevoegd te bepalen, dat door hem aangewezen gedeelten van groeven moeten
      worden afgesloten. Het is verboden deze gedeelten zonder zijn toestemming te betreden.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel19
  - number: '20.1'
    text: |-
      Het is verboden in een groeve een bewaarplaats van ontplofbare stoffen aan te leggen, in te richten of in gebruik
      te hebben zonder vergunning van Onze Minister van Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel20
  - number: '20.2'
    text: |-
      Bij de aanvraag om een vergunning als bedoeld in het eerste lid wordt een duidelijke tekening overgelegd waaruit
      de ligging en de inrichting van de bewaarplaats blijkt, en wordt opgave gedaan van de hoeveelheid en de soort van
      ontplofbare stoffen en ontstekingsmiddelen welke daarin zullen worden bewaard.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel20
  - number: '21.1'
    text: |-
      Het is verboden andere dan door Onze Minister van Economische Zaken goedgekeurde ontplofbare stoffen en
      ontstekingsmiddelen in de groeve te brengen, bij zich te hebben of te gebruiken.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel21
  - number: '21.2'
    text: |-
      Onze Minister van Economische Zaken is bevoegd omtrent den opslag, de uitgifte, het vervoer en het gebruik van
      ontplofbare stoffen en ontstekingsmiddelen nadere voorschriften te geven.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel21
  - number: '22'
    text: |-
      Zoodra een groeve gedurende een geheel jaar buiten gebruik is geweest, moet de vergunninghouder hiervan
      schriftelijk kennis geven aan Onze Minister van Economische Zaken; deze is bevoegd voor te schrijven, dat de
      toegangen tot de groeve op een door hem aan te geven wijze worden afgesloten.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel22
  - number: '23.1'
    text: |-
      Vóórdat een groeve wordt verlaten, moet zij worden opgemeten en moet het in [artikel 7, eerste lid][ref1], bedoelde
      gewaarmerkte exemplaar geheel worden bijgewerkt en aan den Inspecteur-Generaal der Mijnen worden toegezonden ter
      plaatsing in zijn archief.


      [ref1]: https://wetten.overheid.nl/BWBR0002025#Artikel7
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002025
        artikel: '7'
  - number: '23.2'
    text: Van het verlaten van een groeve moet onverwijld mededeeling worden gedaan aan den Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel23
  - number: '23.3'
    text: |-
      De toestand van de verlaten groeve wordt door een ambtenaar van het Staatstoezicht op de Mijnen gezamenlijk met een
      vertegenwoordiger van het betrokken gemeentebestuur of van de betrokken gemeentebesturen en na oproeping van den
      vergunninghouder, bij proces-verbaal geconstateerd, waarvan de Inspecteur-Generaal der Mijnen afschrift zendt aan
      het gemeentebestuur of de gemeentebesturen en aan den vergunninghouder.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel23
  - number: '23.4'
    text: |-
      De toegangen tot een verlaten groeve moeten behoorlijk, ter beoordeeling van Onze Minister van Economische Zaken,
      zijn afgesloten.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel23
  - number: '23.5'
    text: |-
      Met het verlaten van een groeve wordt voor de toepassing van dit reglement gelijkgesteld het buiten gebruik laten
      gedurende drie achtereenvolgende jaren.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel23
  - number: '24'
    text: |-
      Het is aan onbevoegden verboden een overeenkomstig [artikel 22][ref1] of [artikel 23][ref2] afgesloten groeve te
      betreden.


      [ref1]: https://wetten.overheid.nl/BWBR0002025#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0002025#Artikel23
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002025
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0002025
        artikel: '23'
  - number: '25'
    text: 'De vergunning kan worden ingetrokken, indien:'
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel25
  - number: 25.a
    text: |-
      de te harer verkrijging verstrekte gegevens zodanig onjuist of onvolledig blijken, dat de vergunning niet zou zijn
      verleend als bij de beslissing de juiste omstandigheden volledig bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel25
  - number: 25.b
    text: |-
      de omstandigheden, op grond waarvan zij werd verleend, zich zodanig hebben gewijzigd, dat de vergunning niet zou
      zijn verleend als op het tijdstip van de beslissing de gewijzigde omstandigheden aanwezig waren geweest;
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel25
  - number: 25.c
    text: zij met het oog op gevaar voor lichamelijke schade niet gehandhaafd kan blijven;
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel25
  - number: 25.d
    text: blijkt, dat aan een of meer voorwaarden, waaronder zij is verleend, niet wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel25
  - number: '26'
    text: |-
      Onverminderd het in [artikel 2, eerste lid][ref1], bepaalde, worden aanvragen om vergunning of tot het nemen van
      enige andere in dit reglement voorziene beslissing gericht tot Onze Minister van Economische Zaken, doch ingediend
      bij de Inspecteur-Generaal der Mijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0002025#Artikel2
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002025
        artikel: '2'
  - number: '28.1'
    text: |-
      Het besluit van den Secretaris-Generaal van het Departement van Waterstaat van 25 Januari 1941 (*Nederlandsche
      Staatscourant* 1941, No. 29) tot vaststelling van het Groevenreglement 1941 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel28
  - number: '28.2'
    text: |-
      Alle ingevolge het Groevenreglement 1941 getroffen voorzieningen blijven, voor zoover zij niet met de bepalingen
      van dit besluit in strijd zijn, van kracht en worden geacht op grond van dit besluit te zijn getroffen.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel28
  - number: '29.1'
    text: Dit besluit kan worden aangehaald onder den titel "Groevenreglement 1947".
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel29
  - number: '29.2'
    text: Het treedt in werking met ingang van den tweeden dag na dien zijner afkondiging.
    url: https://wetten.overheid.nl/BWBR0002025/1998-01-01#Artikel29
