  - number: 8b
    text: |-
      1 Het college schat de kwantitatieve blootstelling aan het gewasbeschermingsmiddel, bedoeld in
      uitvoeringsverordening (EU) 545/2011, bijlage, deel A, punt 7.2.1.1, zonder rekening te houden met het effect van
      persoonlijke beschermingsmaatregelen en met gebruikmaking van de volgende modellen voor blootstellingssituaties:

      a. voor het mengen en vullen van apparatuur voor de toepassing van gewasbeschermingsmiddelen met een:

      1°. niet-vast gewasbeschermingsmiddel bij tractortoepassingen: model EUROPOEM I, bedoeld in [bijlage 1][ref1] onder
      1;

      2°. niet-vast middel bij handmatige toepassing: model EUROPOEM I, bedoeld in [bijlage 1][ref2] onder 1, voor
      huidblootstelling en NL model, bedoeld in bijlage 1 onder 4, 5 en 7, voor inhalatoire blootstelling;

      3°. poedervormig middel: NL-model bedoeld in [bijlage 1][ref3] onder 4, 5 en 7;

      4°. granulaatvormig middel: NL-model, bedoeld in [bijlage 1][ref4] onder 4, 5 en 7, rekening houdend met de
      poederfractie in het middel;

      b. voor het toepassen van het gewasbeschermingsmiddel:

      1°. buiten opwaarts of neerwaarts met grote spuitapparatuur; model EUROPOEM I, bedoeld in [bijlage 1][ref5] onder
      1;

      2°. buiten neerwaarts met handapparatuur: model UK POEM, bedoeld in [bijlage 1][ref6] onder 9;

      3°. buiten opwaarts met handapparatuur: de 90-percentiel waarde volgens het Duitse blootstellingsmodel, bedoeld in
      [bijlage 1][ref7] onder 6;

      4°. binnen met handapparatuur: NL-kasmodel, bedoeld in [bijlage 1][ref8] onder 4, 5 en 7;

      5°. met spuitbussen: ConsExpo, bedoeld in [bijlage 1][ref9] onder 8;

      c. voor degenen die werkzaamheden uitvoeren in ruimten die behandeld zijn met gewasbeschermingsmiddelen of
      werkzaamheden uitvoeren met of aan gewassen die behandeld zijn met middelen: model EUROPOEM II, bedoeld in
      [bijlage 1][ref10] onder 2, voor dermale blootstelling;

      d. voor degenen die werkzaamheden uitvoeren in ruimten die behandeld zijn met middelen of in ruimten werkzaamheden
      uitvoeren met of aan gewassen die behandeld zijn met middelen: NL model voor inhalatoire blootstelling, bedoeld in
      [bijlage 1][ref11] onder 5 en 7;

      e. voor degenen (volwassenen en kinderen), die recreëren of sporten op grasvelden die behandeld zijn met
      gewasbeschermingsmiddelen: het model bedoeld in [bijlage 1][ref12], onder 10.

      2 Het college gaat bij de beoordeling van de voorgestelde beschermende kleding en apparatuur volgens de uniforme
      beginselen, bedoeld in uitvoeringsverordening (EU) 546/2011, bijlage, deel I, onderdeel B Evaluatie, punt 2.4.1.3.,
      uit van beschermingsfactoren voor deze kleding en apparatuur volgens de tabel, bedoeld in [bijlage 2][ref13].


