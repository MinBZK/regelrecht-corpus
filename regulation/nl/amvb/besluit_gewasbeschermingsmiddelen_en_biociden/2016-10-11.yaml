    text: |-
      Het college schat de kwantitatieve blootstelling aan het gewasbeschermingsmiddel voor de toepasser van een middel
      bestemd voor niet-professioneel gebruik, bedoeld in uitvoeringsverordening (EU) 545/2011, bijlage, deel A, punt
      7.2.1.1, zonder rekening te houden met het effect van persoonlijke beschermingsmaatregelen. Het college gebruikt
      voor de inschatting van de blootstelling een van de methoden, bedoeld in [artikel 8b][ref1].


