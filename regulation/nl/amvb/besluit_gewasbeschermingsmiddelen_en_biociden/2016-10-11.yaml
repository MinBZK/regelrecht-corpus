  - number: '24'
    text: |-
      1 Een ieder die bedrijfsmatig biociden distribueert, levert of aflevert houdt een administratie bij.

      2 De administratie, bedoeld in het eerste lid, bevat ten minste de volgende gegevens:

      a. de naam, zoals die op de verpakking is vermeld, en het toelatingsnummer,

      b. het aantal verpakkingseenheden per ontvangst of aflevering alsmede de op de verpakking aangegeven volume- of
      massa-eenheden,

      c. de totale hoeveelheid voorraad en de veranderingen van de voorraad,

      d. de datum van ontvangst, aflevering of verandering als bedoeld in de onderdelen b en c, en

      e. de naam, het adres en de woonplaats van de leverancier of de afnemer van de biocide.

      3 De administratie bestrijkt een periode van de laatste vijf jaar. De administratie is op een toegankelijke wijze
      opgesteld, op eenvoudige wijze beschikbaar en aanwezig op het bedrijf.

      4 Onze Minister kan categorieën van biociden uitzonderen van het gebod, bedoeld in het eerste lid.

      5 Bij regeling van Onze Minister kunnen aanvullende administratievoorschriften worden gesteld voor producenten,
      distributeurs, importeurs en gebruikers van biociden.
    url: https://wetten.overheid.nl/BWBR0022530/2016-10-11#Artikel24
  - number: '25'
    text: |-
      1 Een ieder die biociden, die niet zijn aangemerkt als geschikt voor niet-professioneel gebruik, voor gebruikers
      voorhanden heeft, ontvangt of toepast, houdt een administratie bij.

      2 De administratie, bedoeld in het eerste lid, omvat ten minste de volgende gegevens:

      a. de naam, zoals die op de verpakking is vermeld, en het toelatingsnummer,

      b. de ontvangen of toegepaste hoeveelheden biociden,

      c. de voorraad middelen op 1 januari van enig kalenderjaar,

      d. de datum van ontvangst of toepassing als bedoeld in onderdeel b, en

      e. de naam, het adres en de woonplaats van de leverancier of de gebruiker van de biocide.

      3 De administratie bestrijkt een periode van de laatste vijf jaar.

      4 Onze Minister kan categorieën van middelen uitzonderen van het gebod, bedoeld in het eerste lid.

      5 Onze Minister kan bij ministeriële regeling aanvullende administratievoorschriften stellen.
    url: https://wetten.overheid.nl/BWBR0022530/2016-10-11#Artikel25
  - number: 25a
    text: |-
      Bij regeling van Onze Minister kunnen ter uitvoering van de verplichtingen, bedoeld in artikel 67 van verordening
      (EG) 1107/2009, regels of nadere regels worden gesteld met betrekking tot de registratie van de productie, de
      invoer, de uitvoer, het op de markt brengen, de opslag of het gebruiken van gewasbeschermingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0022530/2016-10-11#Artikel25a
  - number: 25b
    text: |-
      Bij regeling van Onze Minister worden regels gesteld ter uitvoering van [artikel 73, vierde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel73
    url: https://wetten.overheid.nl/BWBR0022530/2016-10-11#Artikel25b
