  - number: '14'
    text: |-
      1 Biociden worden bij de productie en distributie van drinkwater niet toegepast.

      2 In afwijking van het eerste lid mogen biociden bij de productie en distributie worden toegepast, indien is
      voldaan aan de bij regeling van Onze Minister gestelde voorwaarden, waaronder de mogelijkheid van een melding bij
      Onze Minister van Infrastructuur en Milieu.
    url: https://wetten.overheid.nl/BWBR0022530/2016-10-11#Artikel14
  - number: '17'
    text: |-
      1 Een bewijs van vakbekwaamheid als bedoeld in [artikel 71, tweede lid, onderdeel a, van de wet][ref1], inzake
      gewasbeschermingsmiddelen kan worden verstrekt aan de persoon die:

      a) een bij regeling van Onze Minister aangewezen opleiding heeft gevolgd;

      b) een bij regeling van Onze Minister aangewezen examen heeft afgelegd, of

      c) een instructie heeft gevolgd waarvan de bij regeling van Onze Minister aangewezen instantie heeft geoordeeld dat
      hiermee voldoende kennis van de in bijlage I bij richtlijn 2009/128/EG genoemde onderwerpen wordt verkregen, gelet
      op de taken en verantwoordelijkheden van die persoon.

      2 Bij regeling van Onze Minister worden regels gesteld over het vereiste kennisniveau voor de onderwerpen, genoemd
      in bijlage I bij richtlijn 2009/128/EG, waarbij onderscheid kan worden gemaakt tussen en in voorkomend geval
      binnen de groepen van distributeurs van gewasbeschermingsmiddelen, voorlichters en professionele gebruikers van
      gewasbeschermingsmiddelen.

      3 Het bewijs van vakbekwaamheid vermeldt de volledige naam, het adres, de woonplaats en de geboortedatum van
      betrokkene en kan een opsomming bevatten van onderwerpen waarvan kennis is verworven en op welk niveau.

      4 De gelding van het bewijs van vakbekwaamheid, dat is verkregen op grond van het eerste lid, onderdeel c, geeft
      geen recht op het ontvangen of voorhanden hebben van gewasbeschermingsmiddelen, toegelaten voor professioneel
      gebruik.

      5 Bij regeling van Onze Minister kunnen nadere regels worden gesteld over de gelding van het bewijs van
      vakbekwaamheid, waarbij de gelding kan worden beperkt tot bepaalde gewasbeschermingsmiddelen, bepaalde toepassingen
      of bepaalde ruimten of terreinen.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel71
    url: https://wetten.overheid.nl/BWBR0022530/2016-10-11#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '71'
  - number: 17a
    text: |-
      1 Een bewijs van vakbekwaamheid inzake biociden als bedoeld in [artikel 71, tweede en vierde lid, van de wet][ref1]
      wordt verstrekt aan de persoon die voldoet aan bij regeling van Onze Minister te stellen voorwaarden inzake:

      a. de distributie van gasvormige en gasvormende biociden,

      b. de bestrijding van mollen en woelratten,

      c. het afweren of bestrijden van een dierplaag,

      d. het bestrijden van een houtrotverwekkende schimmel, of

      e. het toepassen van gasvormige en gasvormende biociden, met uitzondering van de bestrijding van mollen en
      woelratten als bedoeld in onderdeel b.

      2 De ondernemer van een bedrijf of hoofdverantwoordelijke voor een instelling is vrijgesteld van een bewijs van
      vakbekwaamheid voor handelingen met betrekking tot biociden:

      a. die niet zijn genoemd in het eerste lid, of

      b. die zijn genoemd in het eerste lid en die worden uitgevoerd door:

      1°. een bedrijfsvoerder die in dienst is en die beschikt over een daartoe verstrekt bewijs van vakbekwaamheid als
      bedoeld in het eerste lid, of

      2°. een bedrijf dat voor de ondernemer een biocide toepast en waarvan de persoon die de biocide distribueert aan
      klanten of toepast, beschikt over een daartoe verstrekt bewijs van vakbekwaamheid als bedoeld in het eerste lid.

      3 [Artikel 71, eerste, tweede en derde lid, van de wet][ref2], is van overeenkomstige toepassing op de in het
      eerste lid bedoelde gevallen.

      4 Het bewijs van vakbekwaamheid vermeldt de volledige naam, het adres, de woonplaats en de geboortedatum van
      betrokkene en kan een opsomming bevatten van onderwerpen waarvan kennis is verworven en op welk niveau.

      5 Bij regeling van Onze Minister kunnen regels of nadere regels worden gesteld met betrekking tot de onderwerpen,
      genoemd in de [artikelen 71, tweede lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel71
      [ref3]: https://wetten.overheid.nl/BWBR0021670#Artikel71
