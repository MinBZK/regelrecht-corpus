  - number: 32a
    text: |-
      Onze Minister kan bij ministeriële regeling regels stellen omtrent de terugwinning of verwijdering van restanten
      van gewasbeschermingsmiddelen uit de verpakkingen ervan.
    url: https://wetten.overheid.nl/BWBR0022530/2016-10-11#Artikel32a
  - number: 32b
    text: |-
      1 Apparatuur voor de toepassing van gewasbeschermingsmiddelen wordt uitsluitend gebruikt indien zij voldoet aan de
      eisen van bijlage II bij richtlijn 2009/128/EG en daarvan blijkt door middel van een officieel goedkeuringsbewijs.

      2 Onze Minister kan bij ministeriële regeling regels stellen omtrent de keuring van in gebruik zijnde apparatuur
      voor de toepassing van gewasbeschermingsmiddelen, waaronder regels omtrent de keuringsfrequentie, de keuringseisen,
      de keuringsinstanties, het in rekening te brengen tarief voor de keuring en voor de afgifte van het officiële
      keuringsbewijs, alsmede de aanwijzing van apparatuur waarop het eerste lid niet van toepassing is, dan wel een
      afwijkende keuringsfrequentie van toepassing is.
    url: https://wetten.overheid.nl/BWBR0022530/2016-10-11#Artikel32b
  - number: '33'
    text: |-
      De kosten, bedoeld in [artikel 4:120 van de Algemene wet bestuursrecht][ref1] die Onze Minister in rekening kan
      brengen voor het uitvaardigen van een dwangbevel bedragen ten hoogste een bedrag dat is berekend met toepassing van
      [artikel 3, eerste lid, van de Kostenwet invordering rijksbelastingen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4120
      [ref2]: https://wetten.overheid.nl/BWBR0002645#Artikel3
    url: https://wetten.overheid.nl/BWBR0022530/2016-10-11#Artikel33
