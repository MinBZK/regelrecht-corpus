  - number: '2'
    text: |-
      Het college is belast met:

      a. de aan Nederland opgedragen werkzaamheden, bedoeld in de artikelen 6 tot en met 9 van hoofdstuk II van
      verordening 396/2005/EG alsmede het doen van voorstellen voor het vaststellen van het maximaal toelaatbare
      residugehalte (MRL) door Onze Minister van Volksgezondheid, Welzijn en Sport en Onze Minister van Economische
      Zaken, voor zover deze niet communautair zijn vastgesteld;

      b. het vaststellen van het maximaal toelaatbaar risiconiveau van gewasbeschermingsmiddelen voor bodem of
      waterorganismen op verzoek van de houder van een toelating, bedoeld in artikel 3, onderdeel 24, van verordening
      (EG) 1107/2009 of op verzoek van Onze Minister van Infrastructuur en Milieu, indien dit risiconiveau niet reeds bij
      een toelating door het college is vastgesteld;

      c. het vaststellen of ambtshalve wijzigen van de wijze waarop op een etiket de voorschriften worden vermeld die bij
      of krachtens dit besluit zijn vastgesteld voor het gebruik van gewasbeschermingsmiddelen of biociden.
    url: https://wetten.overheid.nl/BWBR0022530/2016-10-11#Artikel2
  - number: '8'
    text: |-
      Het college verleent geen toelating voor niet-professioneel gebruik van een gewasbeschermingsmiddel dat
      overeenkomstig richtlijn 1999/45/EG is ingedeeld als giftig, zeer giftig, kankerverwekkend, mutageen of vergiftig
      voor de voortplanting.
    url: https://wetten.overheid.nl/BWBR0022530/2016-10-11#Artikel8
  - number: 8a
    text: |-
      1 Het college hanteert in het kader van de beoordeling van gewasbeschermingsmiddelen, bedoeld in artikel 36, eerste
      lid, van verordening (EG) 1107/2009, slechts de in de [artikelen 8b tot en met 8g][ref1] en de in [bijlage 1][ref2]
      bedoelde beoordelingsmethoden, voor zover een Europees richtsnoer dat is vastgesteld volgens de procedure, bedoeld
      in artikel 77 van die verordening, geen beoordelingsmethode over hetzelfde onderwerp bevat.

      2 Onze Minister van Economische Zaken doet mededeling in de Staatscourant van de vaststelling of wijziging van een
      in een Europees richtsnoer opgenomen beoordelingsmethode als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022530#Artikel8b
      [ref2]: https://wetten.overheid.nl/BWBR0022530
