    Europees Parlement en de Raad van de Europese Unie van 16 februari 1998 betreffende het op de markt brengen van
    biociden (PbEG L 123),

    bijlage V van richtlijn nr. 67/548/EEG van de Raad van de Europese Gemeenschappen van 27 juni 1967 betreffende de
    aanpassing van de wettelijke en bestuursrechtelijke bepalingen inzake de indeling, de verpakking en het kenmerken
