  - number: '75'
    text: |-
      Bij ministeriële regeling worden regels gesteld voor de gelijkstelling van vergunningen verstrekt ingevolge het
      [Besluit vakkennis- en vakbekwaamheidseisen bestrijdingsmiddelen][ref1] zoals dit besluit bij inwerkingtreding
      van de wet bestond aan bewijzen van vakbekwaamheid verstrekt op grond van de [artikelen 71, derde lid][ref2], en
      [76, derde lid, van de wet][ref3].


