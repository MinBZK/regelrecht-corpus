articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop rustende bepalingen wordt verstaan onder:

      a. wet: [Wet gewasbeschermingsmiddelen en biociden][ref1];

      b. verordening 396/2005/EG: Verordening nr. 396/2005 van het Europees Parlement en de Raad van de Europese Unie van
      23 februari 2005 tot vaststelling van maximumgehalten aan bestrijdingsmiddelenresiduen in of op levensmiddelen en
      diervoeders van plantaardige en dierlijke oorsprong en houdende wijziging van Richtlijn 91/414/EG van de Raad (PbEU
      L 70);

      c. richtlijn 67/548/EEG: richtlijn nr. 67/548/EEG van de Raad van de Europese Gemeenschappen van 27 juni 1967
      betreffende de aanpassing van de wettelijke en bestuursrechtelijke bepalingen inzake de indeling, de verpakking en
      het kenmerken van gevaarlijke stoffen (PbEG L 196);

      d. richtlijn 2000/60/EG: richtlijn nr. 2000/60/EG van het Europees Parlement en de Raad van de Europese Unie van
      23 oktober 2000 tot vaststelling van een kader voor communautaire maatregelen betreffende het waterbeleid (PbEG
      L 327);

      e. richtlijn 2004/10/EG: richtlijn nr. 2004/10/EG van het Europees Parlement en de Raad van de Europese Unie van
      11 februari 2004 betreffende de onderlinge aanpassing van de wettelijke en bestuursrechtelijke bepalingen inzake de
      toepassing van de beginselen van goede laboratoriumpraktijken en het toezicht op de toepassing ervan voor tests op
      chemische stoffen (gecodificeerde versie) (PbEU L 50);

      f. bodem: bodem als bedoeld in [artikel 1 van de Wet bodembescherming][ref2];

      g. gasvormende toestand: toestand van een gewasbeschermingsmiddel of biocide waarin het middel of de biocide na
      gasvorming zijn werking verkrijgt;

      h. maximumresidugehalte (MRL): het hoogste wettelijk toegestane concentratieniveau van een residu van
      gewasbeschermingsmiddelen of biociden in of op een levensmiddel of diervoeder op basis van goede landbouwpraktijken
      en de laagste blootstelling van consumenten die noodzakelijk is met het oog op de bescherming van kwetsbare
      consumenten;

      i. richtlijn 1999/45/EG: richtlijn nr. 1999/45/EG van het Europees Parlement en de Raad van de Europese Unie van 31
      mei 1999 betreffende de onderlinge aanpassing van de wettelijke en bestuursrechtelijke bepalingen van de lidstaten
      inzake de indeling, de verpakking en het kenmerken van gevaarlijke preparaten (PbEG 1999, L 200);

      j. uitvoeringsverordening (EU) 545/2011: Verordening (EU) nr. 545/2011 van de Commissie van 10 juni 2011 tot
      uitvoering van Verordening (EG) nr. 1107/2009 van het Europees Parlement en de Raad wat de gegevensvereisten voor
      gewasbeschermingsmiddelen betreft (PbEU 2011, L 155);

      k. uitvoeringsverordening (EU) 546/2011: Verordening (EU) nr. 546/2011 van de Commissie van 10 juni 2011 tot
      uitvoering van Verordening (EG) nr. 1107/2009 van het Europees Parlement en de Raad wat uniforme beginselen voor de
      evaluatie en de toelating van gewasbeschermingsmiddelen betreft (PbEU 2011, L 155);

      l. verhard oppervlak: oppervlak dat is verhard door bebouwing, bestrating en overige verhardingen aangebracht op de
      bodem voor verbetering van draagvlak en begaanbaarheid;

      m. onverhard oppervlak: oppervlak niet zijnde verhard oppervlak.


      [ref1]: https://wetten.overheid.nl/BWBR0021670
