        bwb_id: BWBR0021670
        artikel: '73'
  - number: 25c
    text: |-
      Een distributeur die biociden op de markt brengt draagt er in de wijze van zijn aflevering zorg voor dat biociden
      uitsluitend worden geleverd aan de in de toelating aangegeven gebruikers of hun personeel.
    url: https://wetten.overheid.nl/BWBR0022530/2016-10-11#Artikel25c
  - number: '26'
    text: |-
      1 Een ieder die met het oog op gebruik in enig jaar gewasbeschermingsmiddelen voorhanden of in voorraad heeft, of
      voornemens is gewasbeschermingsmiddelen te gebruiken of onder zijn verantwoordelijkheid dan wel in zijn opdracht
      te laten gebruiken, houdt gedurende het teeltseizoen een gewasbeschermingsmonitor bij waarin aandacht wordt besteed
      aan de aspecten genoemd in [bijlage 3][ref1]. De monitor wordt binnen twee maanden na een teelt afgerond.

      2 In de gewasbeschermingsmonitor wordt vermeld op welke wijze bij de behandeling van uitgangsmateriaal, tijdens
      het telen, bij de behandeling van geoogste planten of ander plantaardig materiaal, waaronder bij toepassing op
      verharde oppervlakken, invulling en uitvoering is gegeven aan de beginselen van goede gewasbeschermingspraktijken
      en geïntegreerde gewasbescherming, zoals opgenomen in de bijlage III bij richtlijn 2009/128/EG.

      3 Onze Minister kan op verzoek van een beroepsinstantie bij beleidsregel een gids voor goede
      gewasbeschermingspraktijken vaststellen.

      4 Een gids voor goede gewasbeschermingspraktijken als leidraad voor een juiste uitvoering van geïntegreerde
      gewasbescherming kan onder meer uitgangspunten voor de opstelling van een gewasbeschermingsmonitor en handelwijzen
      voor de teelt bevatten.

      5 Onze Minister kan bij ministeriële regeling teeltvoorschriften vaststellen die bij de opstelling van een
      gewasbeschermingsmonitor in acht genomen worden.

      6 Het eerste lid is niet van toepassing op degene die:

      a. uitsluitend een gewasbeschermingsmiddel voor niet-professioneel gebruik toepast,

      b. onder de verantwoordelijkheid dan wel in opdracht van een derde een gewasbeschermingsmiddel toepast, of

      c. uitsluitend minder dan 2 hectare maïs of gras teelt.

      7

      Bij ministeriële regeling van Onze Minister kan worden bepaald dat het eerste lid niet van toepassing is op een
      categorie van gebruikers, indien een systeem van kwaliteitszorg of andere regelgeving reeds op vergelijkbare wijze
      in de toepassing van geïntegreerde gewasbescherming voorziet.

      8 Bij regeling van Onze Minister kunnen regels of nadere regels worden gesteld over geïntegreerde gewasbescherming
      door professionele gebruikers.


      [ref1]: https://wetten.overheid.nl/BWBR0022530
    url: https://wetten.overheid.nl/BWBR0022530/2016-10-11#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0022530
  - number: '27'
    text: |-
      1 De gewasbeschermingsmonitor is op een toegankelijke wijze opgesteld, op eenvoudige wijze beschikbaar en aanwezig
      op het bedrijf van de gebruiker.

      2 Onze Minister kan voor een gewasbeschermingsmonitor als bedoeld in het eerste lid, een standaardformulier
      vaststellen.

      3 Onze Minister kan regels stellen voor het gebruik van het standaardformulier, bedoeld in het tweede lid.

      4 Onze Minister maakt het standaardformulier, bedoeld in het tweede lid, bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0022530/2016-10-11#Artikel27
  - number: 27a
    text: |-
      Een gewasbeschermingsmiddel dat een prioritaire gevaarlijke stof bevat als bedoeld in artikel 16, derde lid, van
      richtlijn 2000/60/EG wordt niet gebruikt in de nabijheid van oppervlaktewater of in gebieden die zijn aangewezen
      krachtens [artikel 1.2, tweede lid, onderdeel a, van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1.2
    url: https://wetten.overheid.nl/BWBR0022530/2016-10-11#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1.2'
  - number: 27b
    text: |-
      1 Het is een professionele gebruiker niet toegestaan om gewasbeschermingsmiddelen op een verhard oppervlak toe
      te passen.

      2 Het eerste lid is niet van toepassing in bij ministeriële regeling aan te wijzen gebieden of omstandigheden voor
      zover het een toepassing van een gewasbeschermingsmiddel betreft:

      a. die noodzakelijk is voor een veilige exploitatie van bedrijfsmatige activiteiten of inrichtingen;

      b. die noodzakelijk is voor de bescherming van de gezondheid van mens of dier of van het milieu; of

      c. op specifieke terreinen voor recreatieve doeleinden of voor het beoefenen van sport die vanwege hun aard of
      omvang redelijkerwijze niet op een andere wijze kunnen worden onderhouden.

      3 Bij ministeriële regeling kunnen voorwaarden worden gesteld aan de toepassing van gewasbeschermingsmiddelen in de
      gebieden en omstandigheden, bedoeld in het tweede lid.

      4 Het eerste lid geldt niet voor land- en tuinbouwbedrijven die gewassen telen of kweken.
    url: https://wetten.overheid.nl/BWBR0022530/2016-10-11#Artikel27b
  - number: 27d
    text: |-
      Indien een gewasbeschermingsmiddel wordt gebruikt, waarvoor in het gebruiksvoorschrift bij de toelating een
      wachttermijn voor herbetreding is bepaald, zorgt een professionele gebruiker er voor dat andere personen op het
      bedrijf weten van die wachtttermijn en voor welke arealen van het bedrijf die wachttermijn geldt.
    url: https://wetten.overheid.nl/BWBR0022530/2016-10-11#Artikel27d
  - number: '28'
    text: Onze Minister kan bij ministeriële regeling regels stellen voor een juist gebruik van biociden.
    url: https://wetten.overheid.nl/BWBR0022530/2016-10-11#Artikel28
  - number: '29'
    text: |-
      1 Het is verboden een gewasbeschermingsmiddel met behulp van een luchtvaartuig toe te passen, met dien verstande
      dat Onze Minister van dit verbod vrijstelling kan verlenen in verband met een bedreiging van de plantaardige
      productie als bedoeld in [artikel 38, eerste lid, van de wet][ref1]. Artikel 38, tweede tot en met vijfde lid, van
      de wet, is van overeenkomstige toepassing.

      2 Het is verboden een biocide met behulp van een luchtvaartuig toe te passen, met dien verstande dat Onze Minister
      van dit verbod vrijstelling kan verlenen in verband met een niet op andere wijze te bestrijden gevaar als bedoeld
      in [artikel 46, eerste lid, van de wet][ref2].

      3 Onze Minister kan bij ministeriële regeling regels stellen voor de wijze waarop en de voorwaarden waaronder een
      gewasbeschermingsmiddel of een biocide met behulp van een luchtvaartuig wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel46
    url: https://wetten.overheid.nl/BWBR0022530/2016-10-11#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '46'
  - number: '30'
    text: |-
      1 Degene die een gewasbeschermingsmiddel of biocide in een gasvormige of gasvormende toestand in een besloten
      ruimte toepast, draagt er zorg voor dat:

      a. inwerking en verspreiding van het gewasbeschermingsmiddel of de biocide buiten de ruimte of grond, waarin deze
      behandeling plaatsvindt zoveel mogelijk wordt voorkomen;

      b. alle toegangen zijn voorzien van een door Onze Minister vastgesteld waarschuwingssignaal alsmede naar een door
      Onze Minister opgesteld model vastgesteld opschrift inzake de aard en het gevaar van het gewasbeschermingsmiddel of
      de biocide;

      c. de ruimte ontoegankelijk is voor onbevoegden;

      d. na de in het gebruiksvoorschrift van het toegepaste gewasbeschermingsmiddel of biocide opgenomen
      veiligheidstermijn de aanwezigheid of de concentratie van het toegepaste gewasbeschermingsmiddel of de toegepaste
      biocide wordt gemeten met een daartoe geschikt instrument;

      e. het waarschuwingssignaal en het opschrift, bedoeld in onderdeel b, worden na de meting, bedoeld in onderdeel d,
      zo mogelijk, afhankelijk van het resultaat van de meting, verwijderd.

      2 Onze Minister kan bij ministeriële regeling voor daarbij aan te wijzen gasvormige en gasvormende
      gewasbeschermingsmiddelen of biociden nadere regels stellen en vrijstelling verlenen van verplichtingen als bedoeld
      in het eerste lid, onder de bij die vrijstelling gegeven voorwaarden en beperkingen.
    url: https://wetten.overheid.nl/BWBR0022530/2016-10-11#Artikel30
  - number: '31'
    text: |-
      1 Degene die een gewasbeschermingsmiddel of biocide in een gasvormige of gasvormende toestand anders dan voor het
      bestrijden van mollen of woelratten buiten een besloten ruimte toepast, meldt het voornemen tot toepassing bij Onze
      Minister van Infrastructuur en Milieu.

      2 Het eerste lid is niet van toepassing, indien gebruik wordt gemaakt van een speciale installatie waarvoor
      ingevolge de [Wet milieubeheer][ref1] een vergunning is afgegeven voor uitsluitend het gebruik van gasvormige en
      gasvormende gewasbeschermingsmiddelen of biociden.

      3 Degene die een gewasbeschermingsmiddel of biocide in een gasvormige of gasvormende toestand anders dan
      voor het bestrijden van mollen of woelratten buiten een besloten ruimte toepast stelt na de behandeling een
      gasvrijverklaring op voor de opdrachtgever.

      4 Onze Minister stelt bij ministeriële regeling regels inzake:

      a. de wijze waarop een melding als bedoeld in het eerste lid wordt gedaan alsmede binnen welke termijn een melding
      wordt gedaan of ingetrokken en

      b. de geldigheidsduur van de melding.

      5 Onze Minister kan bij ministeriële regeling voor daarbij aan te wijzen gasvormige en gasvormende
      gewasbeschermingsmiddelen of biociden nadere regels stellen en vrijstelling geven van verplichtingen als bedoeld in
      het eerste tot en met derde lid, onder de bij die vrijstelling gegeven voorwaarden en beperkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0022530/2016-10-11#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '32'
    text: |-
      1 Degene die een gewasbeschermingsmiddel, onderscheidenlijk biocide toepast, meldt het voornemen tot toepassing bij
      Onze Minister van Economische Zaken, onderscheidenlijk Onze Minister van Infrastructuur en Milieu, indien bij de
      toelating is bepaald dat voornoemd gewasbeschermingsmiddel, onderscheidenlijk biocide niet in twee opeenvolgende
      jaren mag worden toegepast.

      2 Onze Minister van Economische Zaken, onderscheidenlijk Onze Minister van Infrastructuur en Milieu, verstrekt een
      ontvangstbewijs van de melding aan de melder.

      3 Het voornemen tot toepassing van een gewasbeschermingsmiddel, onderscheidenlijk biocide wordt eveneens bij Onze
      Minister van Economische Zaken, onderscheidenlijk Onze Minister van Infrastructuur en Milieu, gemeld, voor zover
      voor de toepassing van een gewasbeschermingsmiddel of biocide in afwijking van de toelating, bedoeld in het eerste
      lid:

      a. een vrijstelling is verleend voor een proef of experiment als bedoeld in [artikel 37, eerste lid][ref1], of
      [artikel 64, eerste lid, van de wet][ref2],

      b. een vrijstelling is verleend op grond van [artikel 38][ref3] of [artikel 46, eerste lid, van de wet][ref4].

      4 Onze Minister stelt bij ministeriële regeling regels inzake:

      a. de wijze waarop een melding wordt gedaan of ingetrokken;

      b. de termijn voorafgaand aan de toepassing van het gewasbeschermingsmiddel of de biocide waar binnen een melding
      wordt gedaan,

      c. de geldigheidsduur van de melding, en

      d. de gegevens die bij de melding worden verstrekt.

      5 De aanvrager verstrekt het ontvangstbewijs, bedoeld in het tweede lid, aan de leverancier van het
      gewasbeschermingsmiddel bij de ontvangst van het gewasbeschermingsmiddel. De distributeur geeft een getekend
      afschrift van het ontvangstbewijs aan de melder.

      6 De melder, onderscheidenlijk de distributeur, bewaart het getekende afschrift van het ontvangstbewijs,
      onderscheidenlijk het ontvangstbewijs in zijn administratie.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel64
      [ref3]: https://wetten.overheid.nl/BWBR0021670#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0021670#Artikel46
