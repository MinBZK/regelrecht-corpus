        artikel: 4:120
      - id: ref2
        bwb_id: BWBR0002645
        artikel: '3'
  - number: 33a
    text: |-
      1 Bij ministeriële regeling stelt Onze Minister regels omtrent de indeling van boetes in de volgende categorieën:

      a. € 50 tot € 250;

      b. € 250 tot € 500;

      c. € 500 tot € 1.000;

      d. € 1.000 tot € 10.000.

      2 Bij het onderbrengen van overtredingen binnen de in het eerste lid genoemde categorieën wordt ten minste
      onderscheid gemaakt naar de functie van de overtreder.

      3 In afwijking van het eerste lid kan Onze Minister een hogere boete vaststellen, indien de omstandigheden van het
      geval of de ernst van de overtreding daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0022530/2016-10-11#Artikel33a
  - number: '74'
    text: |-
      Het [koninklijk besluit van 14 december 2004, houdende de overdracht van de zorg voor het beleid inzake biociden][ref1]
      (Stb. 2004, 696) wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0017702
    url: https://wetten.overheid.nl/BWBR0022530/2016-10-11#Artikel74
    references:
