  - number: 8f
    text: |-
      Bij de risicobeoordeling voor waterorganismen, vogels, zoogdieren, niet-doelwitarthropoden, niet-doelwitplanten
      of oppervlaktewater bestemd voor de bereiding van drinkwater, hanteert het college specifieke driftcijfers. Het
      college stelt deze cijfers vast en maakt hen bekend op zijn website.
    url: https://wetten.overheid.nl/BWBR0022530/2016-10-11#Artikel8f
  - number: 8g
    text: |-
      Het college beoordeelt bij de toepassing van het uniforme beginsel als bedoeld in uitvoeringsverordening (EU)
      546/2011, deel I, onderdeel C Besluitvorming, punt 2.5.1.3, aan de hand van de beoordelingsmethoden, bedoeld in
      [bijlage 1][ref1] onder 14 en 15.


      [ref1]: https://wetten.overheid.nl/BWBR0022530
    url: https://wetten.overheid.nl/BWBR0022530/2016-10-11#Artikel8g
    references:
      - id: ref1
        bwb_id: BWBR0022530
  - number: '9'
    text: |-
      Het college beoordeelt een aanvraag bij het ontbreken van vastgestelde beoordelingsmethoden aan de hand van de
      uniforme beginselen voor het evalueren en toelaten van gewasbeschermingsmiddelen, bedoeld in artikel 29, zesde
      lid, van verordening (EG) 1107/2009, voor zover dit naar zijn oordeel naar wetenschappelijk inzicht redelijkerwijs
      mogelijk is.
    url: https://wetten.overheid.nl/BWBR0022530/2016-10-11#Artikel9
  - number: '11'
    text: |-
      1 Het college kan bij de toelating het voorschrift opnemen dat het gewasbeschermingsmiddel slechts wordt toegepast
      na een melding bij Onze Minister van Economische Zaken.

      2 Het college houdt bij zijn beslissing omtrent voorschriften als bedoeld in
      [artikel 29, derde lid, van de wet][ref1], rekening met onder meer:

      a. de resultaten van de risicobeoordeling, met name de relatie tussen blootstelling en effect;

      b. de aard en de ernst van het effect;

      c. het risicobeheer dat kan worden toegepast;

      d. het toepassingsgebied van het gewasbeschermingsmiddel;

      e. de werkzaamheid van het gewasbeschermingsmiddel;

      f. de fysische eigenschappen van het gewasbeschermingsmiddel;

      g. de naleefbaarheid van het voorschrift;

      h. de handhaafbaarheid van het voorschrift; en

      i. de geschiktheid voor niet-professionele gebruikers.

      3 Onze Minister kan regels stellen voor de wijze waarop het college uitvoering geeft aan het eerste en tweede
      lid alsmede de wijze waarop het college bij de toelating voorschriften geeft voor de uitvoering van geïntegreerde
      gewasbescherming, goede gewasbeschermingspraktijken of het gebruik van voertuigen, werktuigen, methoden, technieken
      en materialen.

      4 Het college stelt bij iedere toelating voor niet-professioneel gebruik voorschriften als bedoeld in
      [artikel 29, eerste lid, onderdelen b en c, van de wet][ref2]. Deze voorschriften hebben betrekking op
      gebruiksklare formuleringen en stellen beperkingen aan het formaat van de verpakking.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel29
