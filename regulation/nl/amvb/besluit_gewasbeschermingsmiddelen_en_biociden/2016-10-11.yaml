    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuur en Voedselkwaliteit en de Minister van Volkshuisvesting,
    Ruimtelijke Ordening en Milieubeheer, van 16 april 2007, no. Trcjz/2007/1198, Directie Juridische Zaken, gedaan
    in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport, de Minister van Sociale Zaken en
    Werkgelegenheid en de Minister van Verkeer en Waterstaat;

    Gelet op de artikelen 3, derde lid, 4, eerste tot en met vierde lid, 10, 13, eerste en tweede lid, 16, eerste en
    derde tot en met vijfde lid van, richtlijn nr. 91/414/EEG van de Raad van de Europese Gemeenschappen van 15 juli
