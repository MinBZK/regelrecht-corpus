  - number: '18'
    text: |-
      1 Een bewijs van vakbekwaamheid wordt verstrekt voor een termijn van vijf jaar na het tijdstip waarop de opleiding
      is afgerond, het examen is afgelegd, of de instructie is verkregen, overeenkomstig [artikel 17, eerste lid][ref1],
      of aan de voorwaarden, bedoeld in [artikel 17a, eerste lid][ref2], is voldaan.

      2 De geldigheid van een bewijs van vakbekwaamheid wordt na afloop van de termijn, bedoeld in het eerste lid,
      ambtshalve verlengd onder door Onze Minister bij ministeriële regeling vast te stellen voorwaarden.

      3 De vernieuwing van een bewijs van vakbekwaamheid als bedoeld in [artikel 17, eerste lid][ref3], en
      [17a, eerste lid][ref4], wordt geweigerd indien niet is voldaan aan bij regeling door Onze Minister vast te stellen
      voorwaarden inzake scholing.

      4 Onze Minister van Economische Zaken, onderscheidenlijk Onze Minister van Infrastructuur en Milieu, kan
      een bewijs van vakbekwaamheid voor gewasbescherming, onderscheidenlijk biociden, in een geval als bedoeld in
      [artikel 85, eerste of derde lid, van de wet][ref5], tijdelijk of permanent intrekken. Bij regeling van Onze
      Minister worden regels gesteld met betrekking tot de gevallen en de mate waarin tot intrekking kan worden
      overgegaan.

      5 Onze Minister stelt bij ministeriële regeling vast wanneer en op welke wijze na intrekking opnieuw een bewijs van
      vakbekwaamheid verkregen kan worden.


