  - number: '77'
    text: |-
      1 Indien het bij koninklijke boodschap van 1 maart 2006 ingediende voorstel van wet regeling voor
      de toelating, het op de markt brengen en het gebruik van gewasbeschermingsmiddelen en biociden
      ([Wet gewasbeschermingsmiddelen en biociden][ref1]) (Kamerstukken II 2005/06, 30474, nr. 2), nadat het tot wet is
      verheven, in werking treedt, treedt dit besluit op hetzelfde tijdstip in werking met uitzondering van:

      a. [artikel 29, eerste en tweede lid][ref2], dat vijf jaar na dat tijdstip in werking treedt en

      b. [artikel 20, derde lid][ref3], dat in werking treedt op 1 september 2009.

      2 In afwijking van het eerste lid kan [artikel 29, eerste en tweede lid][ref4], op een eerder bij koninklijk
      besluit te bepalen tijdstip in werking treden indien een communautaire maatregel dit vereist.


