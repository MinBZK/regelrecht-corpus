  - number: '19'
    text: |-
      1 Onze Minister van Economische Zaken, onderscheidenlijk Onze Minister van Infrastructuur en Milieu, kan een bewijs
      van vakbekwaamheid voor gewasbescherming, onderscheidenlijk biociden, verstrekken aan een persoon, die onderdaan
      is van een betrokken staat als bedoeld in [artikel 1 van de Algemene wet erkenning EU-beroepskwalificaties][ref1]
      wanneer op grond van [artikel 6 van de Algemene wet erkenning EU-beroepskwalificaties][ref2] is aangetoond dat deze
      persoon over gelijkwaardige kwalificaties beschikt als de houder van een bewijs van vakbekwaamheid dat is verkregen
      op grond van [artikel 17, eerste lid][ref3], of [17a, eerste lid][ref4].

      2 Onze Minister van Economische Zaken, onderscheidenlijk Onze Minister van Infrastructuur en Milieu, kan een bewijs
      van vakbekwaamheid voor gewasbescherming, onderscheidenlijk biociden, verstrekken aan een persoon die beschikt over
      een getuigschrift niet ouder dan vijf jaar van een door Onze Minister erkende buitenlandse opleiding buiten een
      betrokken staat als bedoeld in het eerste lid, wanneer deze persoon door ervaring of opleiding na het verkrijgen
      van het getuigschrift nog steeds over een gelijkwaardige kwalificatie beschikt als de houder van een bewijs van
      vakbekwaamheid dat is verkregen op grond van [artikel 17, eerste lid][ref5], of [17a, eerste lid][ref6].

      3 De houder van een bewijs van vakbekwaamheid beheerst de Nederlandse taal op een zodanig niveau dat voorschriften
      op etiketten van gewasbeschermingsmiddelen en biociden en andere voor de toepassing van gewasbeschermingsmiddelen
      en biociden bij of krachtens de wet geldende voorschriften begrepen en uitgevoerd kunnen worden.


