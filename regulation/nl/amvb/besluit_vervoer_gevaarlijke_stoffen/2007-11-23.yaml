---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_vervoer_gevaarlijke_stoffen
regulatory_layer: AMVB
publication_date: '2020-10-28'
valid_from: '2007-11-23'
bwb_id: BWBR0008080
url: https://wetten.overheid.nl/BWBR0008080/2007-11-23
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 30 oktober 1995, nr. G5/V525203, Directoraat-
    Generaal voor het Vervoer;

    Gelet op de artikelen 3, 6, 12 en 61 van de Wet vervoer gevaarlijke stoffen;

    De Raad van State gehoord (advies van 15 januari 1996, nummer W09.95.0579);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 24 mei 1996, nr. WJZ/V-622587,
    Directoraat-Generaal voor het Vervoer;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel1
  - number: 1.a
    text: |-
      wet: [Wet vervoer gevaarlijke stoffen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007606
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007606
  - number: 1.b
    text: 'ADR: Accord Européen relatif au transport international des marchandises dangereuses par route;'
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel1
  - number: 1.c
    text: 'ADNR: Règlement pour le transport des matières dangereuses sur le Rhin;'
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel1
  - number: 1.d
    text: 'RID: Règlement concernant le transport international ferroviaire des marchandises dangereuses;'
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel1
  - number: 1.e
    text: |-
      ontplofbare stoffen en voorwerpen: ontplofbare stoffen en voorwerpen als bedoeld in
      [artikel 1, eerste lid, onderdeel ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel1
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '1'
  - number: '2.1'
    text: |-
      Overeenkomstig het ADR, het ADNR, het RID dan wel anderszins ter uitvoering van verdragen of bindende besluiten
      van volkenrechtelijke organisaties, worden bij ministeriële regeling gevaarlijke stoffen of categorieën
      van gevaarlijke stoffen aangewezen ten aanzien waarvan het verrichten van handelingen als bedoeld in
      [artikel 2, eerste lid, van de wet][ref1] met daarbij aangewezen vervoermiddelen:


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel2
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '2'
  - number: 2.1.a
    text: niet is toegestaan; of
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel2
  - number: 2.1.b
    text: is toegestaan mits daarbij gestelde regels in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel2
  - number: '2.2'
    text: Een regeling als bedoeld in het eerste lid kan aanvullende voorschriften bevatten.
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel2
  - number: '3'
    text: |-
      Indien bij het vervoer van gevaarlijke stoffen met een voertuig voor het kruisen van een binnenwater gebruik wordt
      gemaakt van een vaartuig, zijn ten aanzien van dit vervoer uitsluitend van toepassing de bij of krachtens dit
      besluit met betrekking tot het vervoer van gevaarlijke stoffen over land gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel3
  - number: '4.1'
    text: |-
      Het verrichten van handelingen als bedoeld in [artikel 2, eerste lid, van de wet][ref1] is toegestaan met alle
      vervoermiddelen, voor zover het betreft handelingen:


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel2
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '2'
  - number: 4.1.a
    text: |-
      door ambtenaren, bedoeld in de [artikelen 34][ref1] en [44 van de wet][ref2], voor zover verricht in de uitoefening
      van hun bij of krachtens de wet opgedragen taak met de desbetreffende gevaarlijke stoffen;


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0007606#Artikel44
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0007606
        artikel: '44'
  - number: 4.1.b
    text: |-
      met ontplofbare stoffen en voorwerpen door ambtenaren die als zodanig bevoegd zijn tot het dragen van wapens, voor
      zover die ontplofbare stoffen en voorwerpen behoren tot hun uitrusting;
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel4
  - number: 4.1.c
    text: |-
      door ambtenaren van onder Onze Minister van Defensie ressorterende opruimingsdiensten van explosieven ten behoeve
      van het ruimen van ontplofbare stoffen en voorwerpen;
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel4
  - number: 4.1.d
    text: |-
      door personen die ingevolge de [Wet wapens en munitie][ref1] bevoegd zijn munitie voorhanden te hebben, met ten
      hoogste 2 000 stuks munitie of onderdelen van munitie voor geweren, revolvers en pistolen met een kaliber van ten
      hoogste 19,1 mm, onderscheidenlijk met ten hoogste 2 000 lege hulzen voorzien van een ontstekingsmiddel en ten
      hoogste één kilogram voor vulling van deze hulzen bestemd zwart of rookzwak buskruit;


      [ref1]: https://wetten.overheid.nl/BWBR0008804
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008804
  - number: 4.1.e
    text: |-
      met munitie behorend bij toestellen voor beroepsdoeleinden die geschikt zijn om projectielen af te schieten, voor
      zover gebruikt ten behoeve van beroep of onderneming, in een hoeveelheid van ten hoogste 10 000 stuks munitie
      onderscheidenlijk drie kilogram ontplofbare stof;
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel4
  - number: 4.1.f
    text: |-
      door landbouwondernemers of hun personeel voor het vervoer van gewasbeschermingsmiddelen of biociden, voor zover
      daarover krachtens [artikel 2][ref1] voorschriften zijn gegeven, tussen hun landbouwbedrijf en daarbij behorende
      landbouwgronden via de redelijkerwijs kortste of snelste route;


      [ref1]: https://wetten.overheid.nl/BWBR0008080#Artikel2
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008080
        artikel: '2'
        paragraaf: '1'
  - number: 4.1.g
    text: |-
      anders dan ten behoeve van beroep of onderneming, met gevaarlijke stoffen die geschikt en bestemd zijn voor eigen
      huishoudelijk gebruik, in hoeveelheden die daarmee redelijkerwijs in overeenstemming zijn; of
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel4
  - number: 4.1.h
    text: |-
      met verpakt of onverpakt consumentenvuurwerk als bedoeld in het [Vuurwerkbesluit][ref1], voor eigen gebruik, in een
      hoeveelheid van ten hoogste 10 kilogram per vervoermiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013360
  - number: '4.2'
    text: |-
      Het verrichten van handelingen als bedoeld in [artikel 2, eerste lid, van de wet][ref1], is toegestaan, voor zover
      het betreft handelingen met:


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel2
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '2'
  - number: 4.2.a
    text: munitie voor noodsignaalmiddelen als bedoeld in artikel 8 van het Besluit wapens en munitie; of
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel4
  - number: 4.2.b
    text: |-
      de bij of krachtens de [Schepenwet][ref1] voorgeschreven reddingsmiddelen en voorzieningen;


      [ref1]: https://wetten.overheid.nl/BWBR0001876
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001876
  - number: '4.3'
    text: |-
      Bij ministeriële regeling kunnen gevaarlijke stoffen worden aangewezen ten aanzien waarvan handelingen als bedoeld
      in [artikel 2, eerste lid, van de wet][ref1], zijn toegestaan onder bij die regeling gegeven voorschriften en
      beperkingen, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel2
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '2'
  - number: 4.3.a
    text: de gevaarzetting van die handelingen beperkt is; en
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel4
  - number: 4.3.b
    text: 'die voorschriften en beperkingen uitsluitend betreffen:'
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel4
  - number: 4.3.b.1°
    text: |-
      aangelegenheden als bedoeld in [artikel 2, eerste lid, van de wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel2
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '2'
  - number: 4.3.b.2°
    text: het vervoermiddel,
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel4
  - number: 4.3.b.3°
    text: de vervoerde stoffen,
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel4
  - number: 4.3.b.4°
    text: de bij het vervoer betrokken personen,
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel4
  - number: 4.3.b.5°
    text: de wijze van vervoeren,
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel4
  - number: 4.3.b.6°
    text: de verpakkingen, of
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel4
  - number: 4.3.b.7°
    text: |-
      de melding voorafgaande aan het verrichten van een handeling als bedoeld in [artikel 2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008080#Artikel2
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008080
        artikel: '2'
        paragraaf: '1'
  - number: '4.4'
    text: |-
      De in het eerste, tweede en derde lid bedoelde handelingen zijn uitsluitend toegestaan, indien op een wijze die in
      overeenstemming is met de gevaarzetting van de desbetreffende gevaarlijke stof:
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel4
  - number: 4.4.a
    text: de stof deugdelijk is verpakt of bewaard, en
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel4
  - number: 4.4.b
    text: de handelingen met de vereiste behoedzaamheid geschieden.
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel4
  - number: '4.5'
    text: |-
      Voor een deugdelijke verpakking of bewaring als bedoeld in het vierde lid wordt mede in aanmerking genomen of de
      verpakking en de sluiting:
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel4
  - number: 4.5.a
    text: |-
      behoorlijk zijn afgesloten en ongewild verlies van de inhoud tegengaan, behoudens, indien nodig, de aanwezigheid
      van ontluchtingsventielen of andersoortige veiligheidsvoorzieningen;
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel4
  - number: 4.5.b
    text: |-
      geschikt zijn voor de desbetreffende stof en vervaardigd van materiaal dat niet door de stof kan worden aangetast,
      noch hiermee een gevaarlijke reactie kan aangaan of een gevaarlijke verbinding kan vormen;
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel4
  - number: 4.5.c
    text: niet kunnen losraken; en
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel4
  - number: 4.5.d
    text: voldoende sterk en bestand zijn tegen normale behandeling en normale vervoersomstandigheden.
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel4
  - number: '5.1'
    text: |-
      Bij ministeriële regeling worden gevaarlijke stoffen aangewezen als gevaarlijke stoffen, bedoeld in
      [artikel 12, eerste lid, van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel12
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '12'
  - number: 5.1.a
    text: voor zover de gevaarzetting van de desbetreffende stof daartoe aanleiding geeft;
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel5
  - number: 5.1.b
    text: in nader te bepalen hoeveelheden.
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel5
  - number: '5.2'
    text: |-
      Tot de stoffen, bedoeld in het eerste lid, worden in ieder geval gerekend de gevaarlijke stoffen, bedoeld in
      [artikel 1, eerste lid, onderdeel ][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel1
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '1'
  - number: 5.2.a
    text: onder 1°;
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel5
  - number: 5.2.b
    text: onder 2°, voor zover deze stoffen in het ADR als giftig worden aangemerkt;
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel5
  - number: 5.2.c
    text: onder 3°, 5°, 6°, 7°, 9° en 11°, voor zover deze stoffen in het ADR als zeer gevaarlijk worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel5
  - number: '5.3'
    text: |-
      Bij ministeriële regeling kunnen voor het vervoer over de binnenwateren of over de spoorwegen
      gevaarlijke stoffen, in nader te bepalen gevallen, worden aangewezen als gevaarlijke stoffen, bedoeld in
      [artikel 12, tweede lid, van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel12
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '12'
  - number: 5.3.a
    text: voor zover de gevaarzetting van de desbetreffende stof daartoe aanleiding geeft;
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel5
  - number: 5.3.b
    text: |-
      in nader te bepalen hoeveelheden.Het tweede lid is van overeenkomstige toepassing, met dien verstande dat voor ADR
      gelezen wordt: ADNR onderscheidenlijk RID.
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel5
  - number: '7.1'
    text: |-
      Na de inwerkingtreding van dit besluit berusten de ministeriële regelingen die zijn vastgesteld krachtens het
      Reglement Gevaarlijke Stoffen op dit besluit.
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel7
  - number: '7.2'
    text: |-
      Voor zover ministeriële regelingen als bedoeld in het eerste lid betrekking hebben op onderwerpen die tevens bij of
      krachtens de wet zijn geregeld, blijven deze buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel7
  - number: '10'
    text: |-
      De [Wet vervoer gevaarlijke stoffen][ref1], met uitzondering van [artikel 57 van die wet][ref2], en dit besluit
      treden in werking met ingang van de eerste dag van de tweede kalendermaand na de datum van uitgifte van het
      *Staatsblad* waarin dit besluit wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0007606
      [ref2]: https://wetten.overheid.nl/BWBR0007606#Artikel57
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007606
      - id: ref2
        bwb_id: BWBR0007606
        artikel: '57'
  - number: '11'
    text: 'Dit besluit wordt aangehaald als: Besluit vervoer gevaarlijke stoffen.'
    url: https://wetten.overheid.nl/BWBR0008080/2007-11-23#Artikel11
