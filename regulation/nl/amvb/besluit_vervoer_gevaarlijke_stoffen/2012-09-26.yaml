articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. wet: [Wet vervoer gevaarlijke stoffen][ref1];

      b. ADR: Accord Européen relatif au transport international des marchandises dangereuses par route;

      c. ADN: Accord Européen relatif au Transport International des Marchandises Dangereuses par voie de Navigation;

      d. RID: Règlement concernant le transport international ferroviaire des marchandises dangereuses;

      e. ontplofbare stoffen en voorwerpen: ontplofbare stoffen en voorwerpen als bedoeld in
      [artikel 1, eerste lid, onderdeel ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007606
      [ref2]: https://wetten.overheid.nl/BWBR0007606#Artikel1
    url: https://wetten.overheid.nl/BWBR0008080/2012-09-26#Artikel1
