        bwb_id: BWBR0007606
        artikel: '2'
  - number: '3'
    text: |-
      Indien bij het vervoer van gevaarlijke stoffen met een voertuig voor het kruisen van een binnenwater gebruik wordt
      gemaakt van een vaartuig, zijn ten aanzien van dit vervoer uitsluitend van toepassing de bij of krachtens dit
      besluit met betrekking tot het vervoer van gevaarlijke stoffen over land gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0008080/2012-09-26#Artikel3
  - number: '4'
    text: |-
      1 Het verrichten van handelingen als bedoeld in [artikel 2, eerste lid, van de wet][ref1] is toegestaan met alle
      vervoermiddelen, voor zover het betreft handelingen:

      a. door ambtenaren, bedoeld in de [artikelen 34][ref2] en [44 van de wet][ref3], voor zover verricht in de
      uitoefening van hun bij of krachtens de wet opgedragen taak met de desbetreffende gevaarlijke stoffen;

      b. met ontplofbare stoffen en voorwerpen door ambtenaren die als zodanig bevoegd zijn tot het dragen van wapens,
      voor zover die ontplofbare stoffen en voorwerpen behoren tot hun uitrusting;

      c. door ambtenaren van onder Onze Minister van Defensie ressorterende opruimingsdiensten van explosieven ten
      behoeve van het ruimen van ontplofbare stoffen en voorwerpen;

      d. door personen die ingevolge de [Wet wapens en munitie][ref4] bevoegd zijn munitie voorhanden te hebben, met
      ten hoogste 2 000 stuks munitie of onderdelen van munitie voor geweren, revolvers en pistolen met een kaliber van
      ten hoogste 19,1 mm, onderscheidenlijk met ten hoogste 2 000 lege hulzen voorzien van een ontstekingsmiddel en ten
      hoogste één kilogram voor vulling van deze hulzen bestemd zwart of rookzwak buskruit;

      e. met munitie behorend bij toestellen voor beroepsdoeleinden die geschikt zijn om projectielen af te schieten,
      voor zover gebruikt ten behoeve van beroep of onderneming, in een hoeveelheid van ten hoogste 10 000 stuks munitie
      onderscheidenlijk drie kilogram ontplofbare stof;

      f. door landbouwondernemers of hun personeel voor het vervoer van gewasbeschermingsmiddelen of biociden, voor zover
      daarover krachtens [artikel 2][ref5] voorschriften zijn gegeven, tussen hun landbouwbedrijf en daarbij behorende
      landbouwgronden via de redelijkerwijs kortste of snelste route;

      g. anders dan ten behoeve van beroep of onderneming, met gevaarlijke stoffen die geschikt en bestemd zijn voor
      eigen huishoudelijk gebruik, in hoeveelheden die daarmee redelijkerwijs in overeenstemming zijn; of

      h. met verpakt of onverpakt consumentenvuurwerk als bedoeld in het [Vuurwerkbesluit][ref6], voor eigen gebruik, in
      een hoeveelheid van ten hoogste 25 kilogram per vervoermiddel.

      2 Het verrichten van handelingen als bedoeld in [artikel 2, eerste lid, van de wet][ref7], is toegestaan, voor
      zover het betreft handelingen met:

      a. munitie voor noodsignaalmiddelen als bedoeld in artikel 8 van het Besluit wapens en munitie; of

      b. de bij of krachtens de [Schepenwet][ref8] voorgeschreven reddingsmiddelen en voorzieningen;

      aan boord van het vaartuig tot de uitrusting waarvan zij redelijkerwijs behoren.

      3 Bij ministeriële regeling kunnen gevaarlijke stoffen worden aangewezen ten aanzien waarvan handelingen als
      bedoeld in [artikel 2, eerste lid, van de wet][ref9], zijn toegestaan onder bij die regeling gegeven voorschriften
      en beperkingen, indien:

      a. de gevaarzetting van die handelingen beperkt is; en

      b. die voorschriften en beperkingen uitsluitend betreffen:

      1°. aangelegenheden als bedoeld in [artikel 2, eerste lid, van de wet][ref10],

      2°. het vervoermiddel,

      3°. de vervoerde stoffen,

      4°. de bij het vervoer betrokken personen,

      5°. de wijze van vervoeren,

      6°. de verpakkingen, of

      7°. de melding voorafgaande aan het verrichten van een handeling als bedoeld in [artikel 2, eerste lid][ref11].

      4 De in het eerste, tweede en derde lid bedoelde handelingen zijn uitsluitend toegestaan, indien op een wijze die
      in overeenstemming is met de gevaarzetting van de desbetreffende gevaarlijke stof:

      a. de stof deugdelijk is verpakt of bewaard, en

      b. de handelingen met de vereiste behoedzaamheid geschieden.

      5 Voor een deugdelijke verpakking of bewaring als bedoeld in het vierde lid wordt mede in aanmerking genomen of de
      verpakking en de sluiting:

      a. behoorlijk zijn afgesloten en ongewild verlies van de inhoud tegengaan, behoudens, indien nodig, de aanwezigheid
      van ontluchtingsventielen of andersoortige veiligheidsvoorzieningen;

      b. geschikt zijn voor de desbetreffende stof en vervaardigd van materiaal dat niet door de stof kan worden
      aangetast, noch hiermee een gevaarlijke reactie kan aangaan of een gevaarlijke verbinding kan vormen;

      c. niet kunnen losraken; en

      d. voldoende sterk en bestand zijn tegen normale behandeling en normale vervoersomstandigheden.


