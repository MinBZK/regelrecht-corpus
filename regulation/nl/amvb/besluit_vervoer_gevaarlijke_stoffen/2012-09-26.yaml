        artikel: '1'
  - number: '2'
    text: |-
      1 Overeenkomstig het ADR, het ADN, het RID dan wel anderszins ter uitvoering van verdragen of bindende
      besluiten van volkenrechtelijke organisaties, worden bij ministeriële regeling gevaarlijke stoffen of
      categorieën van gevaarlijke stoffen aangewezen ten aanzien waarvan het verrichten van handelingen als bedoeld in
      [artikel 2, eerste lid, van de wet][ref1] met daarbij aangewezen vervoermiddelen:

      a. niet is toegestaan; of

      b. is toegestaan mits daarbij gestelde regels in acht zijn genomen.

      2 Een regeling als bedoeld in het eerste lid kan aanvullende voorschriften bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel2
    url: https://wetten.overheid.nl/BWBR0008080/2012-09-26#Artikel2
    references:
