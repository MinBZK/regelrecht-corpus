  - number: '5'
    text: |-
      1 Bij ministeriële regeling worden gevaarlijke stoffen aangewezen als gevaarlijke stoffen, bedoeld in
      [artikel 12, eerste lid, van de wet][ref1]:

      a. voor zover de gevaarzetting van de desbetreffende stof daartoe aanleiding geeft;

      b. in nader te bepalen hoeveelheden.

      2 Tot de stoffen, bedoeld in het eerste lid, worden in ieder geval gerekend de gevaarlijke stoffen, bedoeld in
      [artikel 1, eerste lid, onderdeel ][ref2]:

      a. onder 1°;

      b. onder 2°, voor zover deze stoffen in het ADR als giftig worden aangemerkt;

      c. onder 3°, 5°, 6°, 7°, 9° en 11°, voor zover deze stoffen in het ADR als zeer gevaarlijk worden aangemerkt.

      3 Bij ministeriële regeling kunnen voor het vervoer over de binnenwateren of over de spoorwegen
      gevaarlijke stoffen, in nader te bepalen gevallen, worden aangewezen als gevaarlijke stoffen, bedoeld in
      [artikel 12, tweede lid, van de wet][ref3]:

      a. voor zover de gevaarzetting van de desbetreffende stof daartoe aanleiding geeft;

      b. in nader te bepalen hoeveelheden.Het tweede lid is van overeenkomstige toepassing, met dien verstande dat voor
      ADR gelezen wordt: ADN onderscheidenlijk RID.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel12
