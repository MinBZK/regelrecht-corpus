  - number: '5'
    text: |-
      1 Een aanvraag om een ontheffing als bedoeld in [artikel 27 van de wet][ref1] bevat in elk geval de volgende
      gegevens:

      a. de herkomst en bestemming van het vervoer waarvoor de ontheffing wordt aangevraagd,

      b. indien een ontheffing voor een termijn van ten hoogste twaalf maanden wordt aangevraagd, de te verwachten
      hoeveelheid van de betrokken gevaarlijke stof die vervoerd wordt binnen die termijn,

      c. indien een ontheffing voor onbepaalde tijd wordt aangevraagd of voor een termijn van meer dan twaalf maanden,
      de te verwachten hoeveelheid van de betrokken gevaarlijke stof die vervoerd wordt gedurende twaalf aaneengesloten
      maanden,

      d. het type vervoermiddel waarmee de betrokken gevaarlijke stof wordt vervoerd,

      e. een vermelding van de periode van de dag, van de maand of van het jaar waarin het vervoer zal plaatsvinden, voor
      zover deze informatie beschikbaar is, en

      f. een onderbouwing dat vervoer van de betrokken gevaarlijke stof over een andere route of door middel van een
      andere vervoersmodaliteit redelijkerwijs niet kan worden gevergd.

      2 Een aanvraag om een ontheffing als bedoeld in [artikel 27, eerste lid, onder b, van de wet][ref2] bevat tevens
      gegevens en bescheiden waaruit blijkt:

      a. of en in welke mate door de maatregel een beperking van de kans op of de effecten van een ongeval gedurende het
      vervoer is te verwachten, en

      b. of de toepassing van de maatregel gedurende het vervoer is verzekerd.

      3 Een aanvraag om een ontheffing met betrekking tot het spoorvervoer van chloor en ammoniak als bedoeld in
      [artikel 27, tweede lid, van de wet][ref3] bevat tevens een onderbouwing van het maatschappelijk belang van dat
      vervoer.

      4 Aan een ontheffing als bedoeld in [artikel 27 van de wet][ref4] kunnen beperkingen worden verbonden die
      betrekking hebben op:

      a. de hoeveelheid van de te vervoeren gevaarlijke stof;

      b. de wijze waarop het vervoer van de betrokken gevaarlijke stof plaatsvindt;

      c. de termijn waarvoor de ontheffing geldt;

      d. de periode van de dag, van de maand of van het jaar waarin het vervoer van de betrokken gevaarlijke stof is
      toegestaan;

      e. de toegestane duur van oponthoud en onderbrekingen tijdens het vervoer;

      f. indien het vervoer per trein plaatsvindt, de samenstelling of de snelheid van de trein.

      5 Aan een ontheffing ten aanzien van het spoorvervoer van chloor en ammoniak als bedoeld in
      [artikel 27, tweede lid, van de wet][ref5], wordt de beperking verbonden dat deze alleen geldt op daarbij
      aangewezen hoofdspoorwegen.

      6 Dit artikel is niet van toepassing op een ontheffing op verzoek van Onze Minister van Defensie als bedoeld in
      [artikel 27, derde en vijfde lid, van de wet][ref6].


