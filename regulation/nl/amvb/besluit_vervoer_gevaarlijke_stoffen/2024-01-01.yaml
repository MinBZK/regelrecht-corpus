  - number: '7'
    text: >-
      1 Na de inwerkingtreding van dit besluit berusten de ministeriële regelingen die zijn vastgesteld krachtens het
      Reglement Gevaarlijke Stoffen op dit besluit.


      2 Voor zover ministeriële regelingen als bedoeld in het eerste lid betrekking hebben op onderwerpen die tevens bij
      of krachtens de wet zijn geregeld, blijven deze buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0008080/2024-01-01#Artikel7
  - number: '10'
    text: |-
      De [Wet vervoer gevaarlijke stoffen][ref1], met uitzondering van [artikel 57 van die wet][ref2], en dit besluit
      treden in werking met ingang van de eerste dag van de tweede kalendermaand na de datum van uitgifte van het
      *Staatsblad* waarin dit besluit wordt geplaatst.


