preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister voor Milieu en Wonen van 3 april 2020, nr. IENW/BSK-2020/60060, Hoofddirectie
    Bestuurlijke en Juridische Zaken;

    Gelet op de richtlijn omgevingslawaai, de artikelen 2.10, vierde lid, 2.11a, 2.24, eerste en derde lid, 2.25,
    eerste lid, onder a, onder 1°, 2°, 4° en 9°, en onder b, 2.26, derde lid, 2.27, onder f, 2.28, onder d, 2.29a,
    2.43, 3.10, tweede lid, onder b, 4.3, eerste lid, 5.18, eerste lid, 5.52, tweede lid, onder b, en derde lid,
    16.1, tweede lid, 16.24a, 16.139, eerste lid, onder a, en tweede lid, onder k, 18.2, zesde lid, 20.1, derde lid,
    20.2, eerste en zesde lid, 20.6, eerste lid, 20.10, eerste lid, onder a, 20.14, derde, vierde en vijfde lid, en
    22.2, eerste lid, van de Omgevingswet, artikel 59, vierde lid, van de Spoorwegwet, artikel 18, derde lid, van de
    Wegenverkeerswet 1994, artikel 4, eerste lid, van de Kaderwet subsidies I en M en de artikelen 3.4, eerste lid,
    aanhef en onder b, en 3.7 van de Aanvullingswet geluid Omgevingswet;

    De Afdeling advisering van de Raad van State gehoord (advies van 8 juli 2020, nr. W17.20.0094/IV);

    Gezien het nader rapport van de Staatssecretaris van Infrastructuur en Waterstaat van 2 december 2020, nr. IENW/
    BSK-2020/223591, Hoofddirectie Bestuurlijke en Juridische Zaken, mede uitgebracht namens Onze Minister van
    Binnenlandse Zaken en Koninkrijksrelaties;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0044679/2024-01-01#ArtikelAanhef
