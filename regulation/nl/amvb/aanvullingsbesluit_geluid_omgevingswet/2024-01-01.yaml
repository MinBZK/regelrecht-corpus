      vastgestelde bebouwde kom of 70 dB voor een weg binnen die bebouwde kom»;


      [ref1]: https://wetten.overheid.nl/BWBR0041313#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0041313#Artikel3
    url: https://wetten.overheid.nl/BWBR0044679/2024-01-01#ArtikelXI
