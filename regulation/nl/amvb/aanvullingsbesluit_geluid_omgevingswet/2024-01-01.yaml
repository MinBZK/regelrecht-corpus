        artikel: '3'
      - id: ref2
        bwb_id: BWBR0041278
        artikel: '15'
  - number: XI.1.d
    text: een verzoek daarvoor voor 1 februari 2040 bij Onze Minister van Infrastructuur en Waterstaat is ingediend; en
    url: https://wetten.overheid.nl/BWBR0044679/2024-01-01#ArtikelXI
  - number: XI.1.e
    text: het jaarlijks door Onze Minister van Infrastructuur en Waterstaat vast te stellen subsidieplafond toereikend is.
    url: https://wetten.overheid.nl/BWBR0044679/2024-01-01#ArtikelXI
  - number: XI.2
    text: |-
      Als een op grond van de [artikelen 12.12 tot en met 12.13a van het Besluit kwaliteit leefomgeving][ref1]
      vastgestelde maatregel ook wordt getroffen met een ander oogmerk dan het terugbrengen van het geluid, bedoeld in
      die artikelen, kan Onze Minister van Infrastructuur en Waterstaat bepalen dat de subsidie voor die maatregel wordt
      verstrekt op basis van normbedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0041313#Artikel12
    url: https://wetten.overheid.nl/BWBR0044679/2024-01-01#ArtikelXI
    references:
      - id: ref1
        bwb_id: BWBR0041313
        artikel: '12'
  - number: XI.3
    text: |-
      Op de bekostiging door het Rijk van het treffen van maatregelen als bedoeld in het eerste en tweede lid, zijn de
      bij ministeriële regeling gestelde regels van toepassing.
    url: https://wetten.overheid.nl/BWBR0044679/2024-01-01#ArtikelXI
  - number: XII
    text: |-
      De saneringsprojecten, bedoeld in
      [artikel 3.4, eerste lid, aanhef en onder b, van de Aanvullingswet geluid Omgevingswet][ref1], zijn de
      projecten waarvoor op het tijdstip van inwerkingtreding van dit artikel een subsidie is verleend als bedoeld in
      [artikel 7, eerste lid, van de Subsidieregeling sanering verkeerslawaai][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0043247#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020731#Artikel7
    url: https://wetten.overheid.nl/BWBR0044679/2024-01-01#ArtikelXII
    references:
      - id: ref1
        bwb_id: BWBR0043247
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020731
        artikel: '7'
  - number: XIII
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0044679/2024-01-01#ArtikelXIII
  - number: XIV
    text: 'Dit besluit wordt aangehaald als: Aanvullingsbesluit geluid Omgevingswet.'
