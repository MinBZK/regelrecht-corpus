  - number: XI.1
    text: |-
      De kosten van het treffen van geluidbeperkende en geluidwerende maatregelen komen ten laste van het Rijk, voor
      zover:
    url: https://wetten.overheid.nl/BWBR0044679/2024-01-01#ArtikelXI
  - number: XI.1.a
    text: |-
      het betreft geluidgevoelige gebouwen, bedoeld in [artikel 15.2, tweede lid, van het Omgevingsbesluit][ref1], die
      zijn vermeld op de lijst, bedoeld in het eerste lid van dat artikel;


      [ref1]: https://wetten.overheid.nl/BWBR0041278#Artikel15
    url: https://wetten.overheid.nl/BWBR0044679/2024-01-01#ArtikelXI
    references:
      - id: ref1
        bwb_id: BWBR0041278
        artikel: '15'
  - number: XI.1.b
    text: niet op andere wijze in deze kosten wordt voorzien;
    url: https://wetten.overheid.nl/BWBR0044679/2024-01-01#ArtikelXI
  - number: XI.1.c
    text: |-
      in geval van geluidbeperkende maatregelen: de maatregelen voldoen aan
      [paragraaf 3.5.4.4 van het Besluit kwaliteit leefomgeving][ref1], waarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0041313#Paragraaf3.5.4.4
    url: https://wetten.overheid.nl/BWBR0044679/2024-01-01#ArtikelXI
    references:
      - id: ref1
        bwb_id: BWBR0041313
        paragraaf: 3.5.4.4
  - number: XI.1.c.1°
    text: |-
      voor de toepassing van de [artikelen 12.12, eerste lid][ref1], en [12.13, eerste lid, van dat besluit][ref2] in
      [artikel 3.50, eerste lid, onder b, onder 3°, van dat besluit][ref3] in plaats van «de standaardwaarde, bedoeld
      in tabel 3.34» wordt gelezen: «70 dB»;


      [ref1]: https://wetten.overheid.nl/BWBR0041313#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0041313#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0041313#Artikel3
    url: https://wetten.overheid.nl/BWBR0044679/2024-01-01#ArtikelXI
    references:
