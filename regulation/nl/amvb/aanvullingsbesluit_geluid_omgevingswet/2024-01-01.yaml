    text: |-
      voor de toepassing van [artikel 3.48 van dat besluit][ref1] onder «geluidgevoelig cluster»
      wordt verstaan: een of meer geluidgevoelige gebouwen die zijn vermeld op de lijst, bedoeld in
      [artikel 15.2 van het Omgevingsbesluit][ref2], die een significante verlaging van het geluid door een weg of
      spoorweg ondervinden door een aaneengesloten geluidbeperkende maatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0041313#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0041278#Artikel15
    url: https://wetten.overheid.nl/BWBR0044679/2024-01-01#ArtikelXI
