  - number: '5'
    text: |-
      1 Degenen die vis van een aanvoerder betrekken en zij, die hun bemiddeling verlenen bij het veilen van vis,
      zijn verplicht een administratie te voeren en aan Onze Minister periodiek opgave te doen van de hoeveelheden vis
      behorende tot door Onze Minister aan te wijzen vissoorten door hen van een aanvoerder betrokken onderscheidenlijk
      aan hen ter veiling aangeboden.

      2 Onze Minister stelt regelen ten aanzien van de eisen, waaraan de in het eerste lid bedoelde administratie dient
      te voldoen en ten aanzien van de wijze waarop de aldaar bedoelde opgave dient te geschieden.
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel5
  - number: 6a
    text: |-
      1 Het is verboden met een vissersvaartuig met een motorvermogen van meer dan 1471 kW uit te varen, de visserij uit
      te oefenen of vis aan te landen.

      2 Het in het eerste lid gestelde verbod is niet van toepassing op:

      a. een vissersvaartuig met een motorvermogen van meer dan 1471 kW dat op de dag van inwerkingtreding van de
      Tijdelijke regeling beperking capaciteit vissersvaartuigen (*Stcrt.* 1987, 184) staat geregistreerd in het centraal
      visserijregister, voor zolang nog geen 20 jaren zijn verstreken nadat het vissersvaartuig voor de eerste maal
      in het centraal visserijregister is geregistreerd en het motorvermogen sinds de dag van inwerkingtreding van de
      Tijdelijke regeling beperking capaciteit vissersvaartuigen niet is toegenomen;

      b. een vissersvaartuig met een motorvermogen van meer dan 1471 kW, waarvoor vóór 25 februari 1987 een
      investeringsverplichting is aangegaan, en waarvan:

      1°. de kiel vóór 25 september 1987 is gelegd of

      2°. de aanbouw, herkenbaar als behorend tot een bepaald vissersvaartuig vóór 25 september 1987 is aangevangen
      en voor deze datum is aangevangen met de samenbouw die ten minste 50.000 kg moet omvatten of één percent van de
      geschatte massa van al het bouwmateriaal, welke van deze twee waarden de laagste is,

      en dat vóór 25 februari 1990 in gebruik is genomen, voor zolang nog geen 20 jaren zijn verstreken nadat het
      vissersvaartuig voor de eerste maal in het centraal visserijregister is geregistreerd;

      c. een vissersvaartuig met een brutotonnage van meer dan 1.200 BT waarmee de pelagische visserij wordt uitgeoefend.

      3 Onze Minister kan nadere regelen stellen voor een goede werking van het bepaalde in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel6a
  - number: 6b
    text: |-
      1 Aan de ondernemer kan een naar billijkheid te bepalen schadevergoeding worden toegekend in het geval dat:

      a. het in de licentie vermelde motorvermogen hoger is dan 1471 kW en de licentie voor dat gedeelte niet meer geldig
      is op grond van artikel 7*a*, aanhef en onderdeel *b*, van de Beschikking visserijlicentie (*Stcrt.* 1984, 253),
      voor zover dat gedeelte vóór 25 februari 1987 door aankoop is verkregen, ten hoogste tot het aankoopbedrag daarvan;

      b. de ondernemer als rechtstreeks gevolg van het verbod van [artikel 3][ref1] een met een scheepswerf aangegane
      investeringsverplichting voor de bouw van een vissersvaartuig met een motorvermogen van meer dan 1471 kW, en
      waarvan:

      1°. de kiel op 25 september 1987 nog niet is gelegd of

      2°. de aanbouw, herkenbaar als behorend tot een bepaald vissersvaartuig op 25 september 1987 nog niet is
      aangevangen en op deze datum nog niet is aangevangen met de samenbouw die ten minste 50.000 kg omvat of één percent
      van de geschatte massa van al het bouwmateriaal, welke van deze twee waarden de laagste is,

      wijzigt en daardoor voor hem jegens die scheepswerf een rechtens afdwingbare verplichting ontstaat.

      2 Om voor een schadevergoeding in aanmerking te komen in het geval bedoeld in het eerste lid, onderdeel *a*, dient
      de ondernemer een daartoe strekkend schriftelijk verzoek bij de minister in, binnen twee maanden nadat de licentie
      op grond van artikel 7*a*, aanhef en onderdeel *b*, van de Beschikking visserijlicentie gedeeltelijk niet meer
      geldig is, onder overlegging van de aankoopbewijzen of eventuele andere bewijsstukken.

      3 Om voor een schadevergoeding in aanmerking te komen in het geval bedoeld in het eerste lid, onderdeel *b*, dient
      de ondernemer een daartoe strekkend verzoek, onder overlegging van bewijsstukken, bij de minister vóór 25 november
      1987 te hebben ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003144#Artikel3
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel6b
    references:
