  - number: '4'
    text: |-
      1 De in [artikel 3, eerste lid, aanhef en onder b][ref1], bedoelde regelen kunnen betrekking hebben op:

      a. het instellen van gesloten gebieden;

      b. het vissen in bepaalde tijdvakken;

      c. de omvang van de door de gezamenlijke Nederlandse vissers te vangen hoeveelheden vis en de verdeling daarvan
      onder de Nederlandse vissers;

      d. de lengtemaat van vis;

      e. het vissen met bepaalde vistuigen;

      f. het voorhanden hebben van bepaalde vistuigen in bepaalde wateren;

      g. de maaswijdte van visnetten en de wijze van vaststelling daarvan;

      h. het motorvermogen, de lengte en het tonnage van vissersvaartuigen;

      i. het uitzaaien of uitzetten van schelpdieren van de krachtens
      [artikel 1, tweede lid, onderdeel b, van de wet][ref2] aangewezen soorten.

      2 Indien de in [artikel 3, eerste lid, aanhef en onder b][ref3], bedoelde regelen een verbod tot het verrichten van
      bepaalde handelingen inhouden, kan worden bepaald, dat het verbod niet geldt voor degene, die voorzien is van een
      vergunning van Onze Minister.

      3 Aan een vergunning, als bedoeld in het vorige lid, kunnen voorschriften worden verbonden. Zij kan onder
      beperkingen worden verleend. Zij kan worden ingetrokken.

      4 Tenzij het algemeen belang zich naar zijn oordeel daartegen verzet, stelt Onze Minister een regeling als bedoeld
      in [artikel 3, eerste lid, aanhef en onder b][ref4], niet vast dan nadat hij met de daarbij in belangrijke mate
      betrokken produkt- en bedrijfschappen zomede de naar zijn oordeel daarvoor in aanmerking komende organisaties van
      sportvissers overleg heeft gepleegd.


