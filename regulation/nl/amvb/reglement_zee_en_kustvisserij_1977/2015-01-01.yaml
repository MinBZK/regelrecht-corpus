---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: reglement_zee_en_kustvisserij_1977
regulatory_layer: AMVB
publication_date: '2014-12-24'
valid_from: '2015-01-01'
bwb_id: BWBR0003144
url: https://wetten.overheid.nl/BWBR0003144/2015-01-01
preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Minister van Landbouw en Visserij van 28 juli 1977, No. J. 2139, Directie Juridische
    en Bedrijfsorganisatorische Zaken, na overleg met het Produktschap voor Vis en Visprodukten, het Visserijschap,
    het Bedrijfschap voor de Groothandel in Vis en Aanverwante Bedrijven en de Nederlandse Vereniging van
    Sportvissersfederaties;

    Gelet op de artikelen 2, 3a, 4 en 9 van de Visserijwet 1963 (Stb. 312);

    De Raad van State gehoord (advies van 14 september 1977, No. 19);

    Gezien het nader rapport van Onze voornoemde Minister van 22 november 1977, No. J 3192, Directie Juridische en
    Bedrijfsorganisatorische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: vissersvaartuig: vaartuig als bedoeld in
      artikel 3, onderdeel c, van Verordening (EG) nr. 2371/2002 van de Raad van de Europese Unie van 20 december 2002
      inzake de instandhouding en de duurzame exploitatie van de visbestanden in het kader van het gemeenschappelijk
      visserijbeleid (PbEG L 358) dat:
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel1
  - number: 1.1.a
    text: |-
      overeenkomstig [artikel 1, tweede lid, van de Uitvoeringswet Visserijverdrag 1967][ref1] als Nederlands geldt en


      [ref1]: https://wetten.overheid.nl/BWBR0002897#Artikel1
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002897
        artikel: '1'
  - number: 1.1.b
    text: |-
      overeenkomstig het bepaalde bij of krachtens het [Besluit registratie vissersvaartuigen 1998][ref1] staat
      geregistreerd;


      [ref1]: https://wetten.overheid.nl/BWBR0009353
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009353
  - number: '1.2'
    text: |-
      Voor de toepassing van het bepaalde in dit besluit heeft het aanlanden plaats op het tijdstip waarop het
      vissersvaartuig vaste verbinding met de wal heeft gekregen.
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel1
  - number: '2'
    text: |-
      Tenzij anders is bepaald is dit besluit van toepassing op de visserij in de wateren bedoeld in
      [artikel 1, vierde lid, onderdeel ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel1
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '1'
  - number: '3.1'
    text: 'In het belang van de visserij is Onze Minister bevoegd regelen te stellen:'
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel3
  - number: 3.1.a
    text: |-
      ter uitvoering van op grond van internationale overeenkomsten of van besluiten van volkenrechtelijke organisaties
      opgelegde verplichtingen of verleende bevoegdheden;
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel3
  - number: 3.1.b
    text: ter verzekering van de instandhouding dan wel uitbreiding van de visvoorraden.
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel3
  - number: '3.2'
    text: Bij het stellen van regelen als bedoeld in het eerste lid, onderdeel b,
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel3
  - number: 3.2.a
    text: |-
      kan, voor zover de regelen betrekking hebben op de visserij in de wateren, bedoeld in
      [artikel 1, vierde lid, onderdeel b, van de wet][ref1], mede rekening worden gehouden met de belangen van de
      natuurbescherming;


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel1
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '1'
  - number: 3.2.b
    text: |-
      wordt, voor zover de regelen betrekking hebben op de visserij in de wateren, bedoeld in
      [artikel 1, vierde lid, onderdeel c, van de wet][ref1], mede rekening gehouden met de belangen van de
      natuurbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel1
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '1'
  - number: '3.3'
    text: |-
      De in het eerste lid bedoelde regelen kunnen betrekking hebben op de visserij op alle dan wel bepaalde door Onze
      Minister aan te wijzen vissoorten.
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel3
  - number: '3.4'
    text: Onze Minister kan voorschriften geven ter naleving van de in het eerste lid bedoelde regelen.
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel3
  - number: '4.1'
    text: |-
      De in [artikel 3, eerste lid, aanhef en onder b][ref1], bedoelde regelen kunnen betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0003144#Artikel3
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003144
        artikel: '3'
  - number: 4.1.a
    text: het instellen van gesloten gebieden;
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel4
  - number: 4.1.b
    text: het vissen in bepaalde tijdvakken;
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel4
  - number: 4.1.c
    text: |-
      de omvang van de door de gezamenlijke Nederlandse vissers te vangen hoeveelheden vis en de verdeling daarvan onder
      de Nederlandse vissers;
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel4
  - number: 4.1.d
    text: de lengtemaat van vis;
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel4
  - number: 4.1.e
    text: het vissen met bepaalde vistuigen;
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel4
  - number: 4.1.f
    text: het voorhanden hebben van bepaalde vistuigen in bepaalde wateren;
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel4
  - number: 4.1.g
    text: de maaswijdte van visnetten en de wijze van vaststelling daarvan;
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel4
  - number: 4.1.h
    text: het motorvermogen, de lengte en het tonnage van vissersvaartuigen;
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel4
  - number: 4.1.i
    text: |-
      het uitzaaien of uitzetten van schelpdieren van de krachtens [artikel 1, tweede lid, onderdeel b, van de wet][ref1]
      aangewezen soorten.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel1
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '1'
  - number: '4.2'
    text: |-
      Indien de in [artikel 3, eerste lid, aanhef en onder b][ref1], bedoelde regelen een verbod tot het verrichten van
      bepaalde handelingen inhouden, kan worden bepaald, dat het verbod niet geldt voor degene, die voorzien is van een
      vergunning van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003144#Artikel3
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003144
        artikel: '3'
  - number: '4.3'
    text: |-
      Aan een vergunning, als bedoeld in het vorige lid, kunnen voorschriften worden verbonden. Zij kan onder beperkingen
      worden verleend. Zij kan worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel4
  - number: '4.4'
    text: |-
      Tenzij het algemeen belang zich naar zijn oordeel daartegen verzet, stelt Onze Minister een regeling als bedoeld
      in [artikel 3, eerste lid, aanhef en onder b][ref1], niet vast dan nadat hij met de daarbij in belangrijke mate
      betrokken produkt- en bedrijfschappen zomede de naar zijn oordeel daarvoor in aanmerking komende organisaties van
      sportvissers overleg heeft gepleegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003144#Artikel3
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003144
        artikel: '3'
  - number: '5.1'
    text: |-
      Degenen die vis van een aanvoerder betrekken en zij, die hun bemiddeling verlenen bij het veilen van vis, zijn
      verplicht een administratie te voeren en aan Onze Minister periodiek opgave te doen van de hoeveelheden vis
      behorende tot door Onze Minister aan te wijzen vissoorten door hen van een aanvoerder betrokken onderscheidenlijk
      aan hen ter veiling aangeboden.
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel5
  - number: '5.2'
    text: |-
      Onze Minister stelt regelen ten aanzien van de eisen, waaraan de in het eerste lid bedoelde administratie dient te
      voldoen en ten aanzien van de wijze waarop de aldaar bedoelde opgave dient te geschieden.
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel5
  - number: 6a.1
    text: |-
      Het is verboden met een vissersvaartuig met een motorvermogen van meer dan 1471 kW uit te varen, de visserij uit te
      oefenen of vis aan te landen.
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel6a
  - number: 6a.2
    text: 'Het in het eerste lid gestelde verbod is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel6a
  - number: 6a.2.a
    text: |-
      een vissersvaartuig met een motorvermogen van meer dan 1471 kW dat op de dag van inwerkingtreding van de
      Tijdelijke regeling beperking capaciteit vissersvaartuigen (*Stcrt.* 1987, 184) staat geregistreerd in het centraal
      visserijregister, voor zolang nog geen 20 jaren zijn verstreken nadat het vissersvaartuig voor de eerste maal
      in het centraal visserijregister is geregistreerd en het motorvermogen sinds de dag van inwerkingtreding van de
      Tijdelijke regeling beperking capaciteit vissersvaartuigen niet is toegenomen;
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel6a
  - number: 6a.2.b
    text: |-
      een vissersvaartuig met een motorvermogen van meer dan 1471 kW, waarvoor vóór 25 februari 1987 een
      investeringsverplichting is aangegaan, en waarvan:
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel6a
  - number: 6a.2.b.1°
    text: de kiel vóór 25 september 1987 is gelegd of
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel6a
  - number: 6a.2.b.2°
    text: |-
      de aanbouw, herkenbaar als behorend tot een bepaald vissersvaartuig vóór 25 september 1987 is aangevangen en voor
      deze datum is aangevangen met de samenbouw die ten minste 50.000 kg moet omvatten of één percent van de geschatte
      massa van al het bouwmateriaal, welke van deze twee waarden de laagste is,
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel6a
  - number: 6a.2.c
    text: een vissersvaartuig met een brutotonnage van meer dan 1.200 BT waarmee de pelagische visserij wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel6a
  - number: 6a.3
    text: Onze Minister kan nadere regelen stellen voor een goede werking van het bepaalde in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel6a
  - number: 6b.1
    text: 'Aan de ondernemer kan een naar billijkheid te bepalen schadevergoeding worden toegekend in het geval dat:'
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel6b
  - number: 6b.1.a
    text: |-
      het in de licentie vermelde motorvermogen hoger is dan 1471 kW en de licentie voor dat gedeelte niet meer geldig is
      op grond van artikel 7*a*, aanhef en onderdeel *b*, van de Beschikking visserijlicentie (*Stcrt.* 1984, 253), voor
      zover dat gedeelte vóór 25 februari 1987 door aankoop is verkregen, ten hoogste tot het aankoopbedrag daarvan;
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel6b
  - number: 6b.1.b
    text: |-
      de ondernemer als rechtstreeks gevolg van het verbod van [artikel 3][ref1] een met een scheepswerf aangegane
      investeringsverplichting voor de bouw van een vissersvaartuig met een motorvermogen van meer dan 1471 kW, en
      waarvan:


      [ref1]: https://wetten.overheid.nl/BWBR0003144#Artikel3
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel6b
    references:
      - id: ref1
        bwb_id: BWBR0003144
        artikel: '3'
  - number: 6b.1.b.1°
    text: de kiel op 25 september 1987 nog niet is gelegd of
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel6b
  - number: 6b.1.b.2°
    text: |-
      de aanbouw, herkenbaar als behorend tot een bepaald vissersvaartuig op 25 september 1987 nog niet is aangevangen
      en op deze datum nog niet is aangevangen met de samenbouw die ten minste 50.000 kg omvat of één percent van de
      geschatte massa van al het bouwmateriaal, welke van deze twee waarden de laagste is,
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel6b
  - number: 6b.2
    text: |-
      Om voor een schadevergoeding in aanmerking te komen in het geval bedoeld in het eerste lid, onderdeel *a*, dient de
      ondernemer een daartoe strekkend schriftelijk verzoek bij de minister in, binnen twee maanden nadat de licentie op
      grond van artikel 7*a*, aanhef en onderdeel *b*, van de Beschikking visserijlicentie gedeeltelijk niet meer geldig
      is, onder overlegging van de aankoopbewijzen of eventuele andere bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel6b
  - number: 6b.3
    text: |-
      Om voor een schadevergoeding in aanmerking te komen in het geval bedoeld in het eerste lid, onderdeel *b*, dient
      de ondernemer een daartoe strekkend verzoek, onder overlegging van bewijsstukken, bij de minister vóór 25 november
      1987 te hebben ingediend.
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel6b
  - number: 6c.1
    text: |-
      Het is verboden met enig ander vaartuig dan een vissersvaartuig de visserij met de boomkor uit te oefenen dan wel
      zodanig vistuig aan boord van enig ander vaartuig dan een vissersvaartuig aanwezig te hebben.
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel6c
  - number: 6c.2
    text: |-
      Het is verboden met een vissersvaartuig de visserij met de boomkor uit te oefenen dan wel een boomkor aan boord van
      een vissersvaartuig te hebben indien de boomkor:
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel6c
  - number: 6c.2.a
    text: gemeten tussen de uiteinden van de constructie meer dan 12 meter lang is
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel6c
  - number: 6c.2.b
    text: kan worden uitgeschoven of vergroot tot een lengte van meer dan 12 meter of
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel6c
  - number: 6c.2.c
    text: voorzien is van elektroden of ander materiaal waarmee elektrovisserij kan worden uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel6c
  - number: 6c.3
    text: 'Het is verboden met een vissersvaartuig de visserij uit te oefenen met:'
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel6c
  - number: 6c.3.a
    text: meer dan twee boomkorren of
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel6c
  - number: 6c.3.b
    text: één of twee boomkorren tezamen met enig ander vistuig.
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel6c
  - number: 6c.4
    text: Het is verboden aan boord van een vissersvaartuig meer dan twee boomkorren te hebben.
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel6c
  - number: 6d.1
    text: Onze Minister kan vrijstelling of ontheffing verlenen van het bepaalde bij of krachtens dit besluit.
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel6d
  - number: 6d.2
    text: |-
      Aan vrijstellingen en ontheffingen als bedoeld in het eerste lid kunnen voorschriften worden verbonden. Zij kunnen
      onder beperkingen worden verleend. Zij kunnen te allen tijde worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel6d
  - number: '7'
    text: |-
      Het Reglement zeevisserij 1971 (*Stb.* 284), het Reglement voor de visserijzone 1970 (*Stb.* 174) en het Reglement
      voor de kustvisserij 1970 (*Stb.* 177) worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel7
  - number: '8.1'
    text: Dit besluit treedt in werking met ingang van 1 januari 1978.
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel8
  - number: '8.2'
    text: Het kan worden aangehaald als "Reglement zee- en kustvisserij 1977".
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel8
