  - number: '2'
    text: |-
      Tenzij anders is bepaald is dit besluit van toepassing op de visserij in de wateren bedoeld in
      [artikel 1, vierde lid, onderdeel ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel1
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '1'
  - number: '3'
    text: |-
      1 In het belang van de visserij is Onze Minister bevoegd regelen te stellen:

      a. ter uitvoering van op grond van internationale overeenkomsten of van besluiten van volkenrechtelijke
      organisaties opgelegde verplichtingen of verleende bevoegdheden;

      b. ter verzekering van de instandhouding dan wel uitbreiding van de visvoorraden.

      2 Bij het stellen van regelen als bedoeld in het eerste lid, onderdeel b,

      a. kan, voor zover de regelen betrekking hebben op de visserij in de wateren, bedoeld in
      [artikel 1, vierde lid, onderdeel b, van de wet][ref1], mede rekening worden gehouden met de belangen van de
      natuurbescherming;

      b. wordt, voor zover de regelen betrekking hebben op de visserij in de wateren, bedoeld in
      [artikel 1, vierde lid, onderdeel c, van de wet][ref2], mede rekening gehouden met de belangen van de
      natuurbescherming.

      3 De in het eerste lid bedoelde regelen kunnen betrekking hebben op de visserij op alle dan wel bepaalde door Onze
      Minister aan te wijzen vissoorten.

      4 Onze Minister kan voorschriften geven ter naleving van de in het eerste lid bedoelde regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002416#Artikel1
    url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#Artikel3
