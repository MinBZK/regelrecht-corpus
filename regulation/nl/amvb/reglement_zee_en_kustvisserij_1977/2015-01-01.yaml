preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Minister van Landbouw en Visserij van 28 juli 1977, No. J. 2139, Directie Juridische
    en Bedrijfsorganisatorische Zaken, na overleg met het Produktschap voor Vis en Visprodukten, het Visserijschap,
    het Bedrijfschap voor de Groothandel in Vis en Aanverwante Bedrijven en de Nederlandse Vereniging van
    Sportvissersfederaties;

    Gelet op de artikelen 2, 3a, 4 en 9 van de Visserijwet 1963 (Stb. 312);

    De Raad van State gehoord (advies van 14 september 1977, No. 19);

    Gezien het nader rapport van Onze voornoemde Minister van 22 november 1977, No. J 3192, Directie Juridische en
    Bedrijfsorganisatorische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003144/2015-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      vissersvaartuig: vaartuig als bedoeld in artikel 3, onderdeel c, van Verordening (EG) nr. 2371/2002 van de Raad van
      de Europese Unie van 20 december 2002 inzake de instandhouding en de duurzame exploitatie van de visbestanden in
      het kader van het gemeenschappelijk visserijbeleid (PbEG L 358) dat:

      a. overeenkomstig [artikel 1, tweede lid, van de Uitvoeringswet Visserijverdrag 1967][ref1] als Nederlands geldt en

      b. overeenkomstig het bepaalde bij of krachtens het [Besluit registratie vissersvaartuigen 1998][ref2] staat
      geregistreerd;

      wet: [Visserijwet 1963][ref3];

      ondernemer: degene te wiens naam het vissersvaartuig in het visserijregister, bedoeld in het
      [Besluit registratie vissersvaartuigen 1998][ref4] is geregistreerd;

      motorvermogen: maximaal continue-vermogen zonder aftrek van door de motor aangedreven hulpmachines, uitgedrukt
      in kW, dat de hoofdmotor of hoofdmotoren zonder overbelasting kan respectievelijk, kunnen leveren, en dat
      mechanisch, elektrisch, hydraulisch of anderszins kan worden aangewend voor de voortstuwing van het vaartuig,
      zoals is vastgesteld door de Inspectie Verkeer en Waterstaat ingevolge het [Vissersvaartuigenbesluit][ref5] of
      het [Vissersvaartuigenbesluit 2002][ref6], of in voorkomend geval blijkt uit een verklaring inzake het maximaal
      continue-vermogen, opgesteld door de fabrikant of de leverancier;

      boomkor: vistuig dat bestaat uit één net dat is bevestigd aan en in horizontale richting wordt opengehouden door
      een constructie bestaande uit een boom die ten minste aan elk der uiteinden voorzien is van een slede of een slof,
      dan wel een soortgelijke constructie waarmee een net in horizontale richting wordt opengehouden;

      maaswijdte: wijdte van de maas gemeten overeenkomstig het bepaalde in verordening (EG) nr. 517/2008 van de
      Commissie van 10 juni 2008 houdende uitvoeringsbepalingen inzake de bepaling van de maaswijdte en de twijndikte van
      visnetten (PbEG L 151);

      tonnage: tonnage gemeten overeenkomstig het bepaalde bij en krachtens de [Meetbrievenwet 1981][ref7] (*Stb.* 122);

      investeringsverplichting: rechtens afdwingbare verplichting die is aangegaan voor de bouw van een vaartuig bestemd
      voor de bedrijfsmatige uitoefening van de visserij en die is vastgelegd in een schriftelijke overeenkomst.

      2 Voor de toepassing van het bepaalde in dit besluit heeft het aanlanden plaats op het tijdstip waarop het
      vissersvaartuig vaste verbinding met de wal heeft gekregen.


