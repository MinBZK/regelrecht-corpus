  - number: '2'
    text: |-
      Tenzij anders is bepaald is dit besluit van toepassing op de visserij in de wateren bedoeld in
      [artikel 1, vierde lid, onderdeel ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel1
    url: https://wetten.overheid.nl/BWBR0003144/1998-03-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '1'
  - number: '3'
    text: |-
      1 In het belang van de visserij is Onze Minister bevoegd regelen te stellen:

      a. ter uitvoering van op grond van internationale overeenkomsten of van besluiten van volkenrechtelijke
      organisaties opgelegde verplichtingen of verleende bevoegdheden;

      b. ter verzekering van de instandhouding dan wel uitbreiding van de visvoorraden.

      2 Bij het stellen van regelen als bedoeld in het eerste lid, onderdeel *b,* wordt, voor zover deze betrekking
      hebben op de visserij in de wateren bedoeld in [artikel 1, vierde lid, onderdeel ][ref1], mede rekening gehouden
      met de belangen van de natuurbescherming.

      3 De in het eerste lid bedoelde regelen kunnen betrekking hebben op de visserij op alle dan wel bepaalde door Onze
      Minister aan te wijzen vissoorten.

      4 Onze Minister kan voorschriften geven ter naleving van de in het eerste lid bedoelde regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel1
    url: https://wetten.overheid.nl/BWBR0003144/1998-03-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '1'
  - number: '4'
    text: |-
      1 De in [artikel 3, eerste lid, aanhef en onder b][ref1], bedoelde regelen kunnen betrekking hebben op:

      a. het instellen van gesloten gebieden;

      b. het vissen in bepaalde tijdvakken;

      c. de omvang van de door de gezamenlijke Nederlandse vissers te vangen hoeveelheden vis en de verdeling daarvan
      onder de Nederlandse vissers;

      d. de lengtemaat van vis;

      e. het vissen met bepaalde vistuigen;

      f. het voorhanden hebben van bepaalde vistuigen in bepaalde wateren;

      g. de maaswijdte van visnetten en de wijze van vaststelling daarvan;

      h. het motorvermogen, de lengte en het tonnage van vissersvaartuigen;

      i. het uitzaaien van oesters of mosselen.

      2 Indien de in [artikel 3, eerste lid, aanhef en onder b][ref2], bedoelde regelen een verbod tot het verrichten van
      bepaalde handelingen inhouden, kan worden bepaald, dat het verbod niet geldt voor degene, die voorzien is van een
      vergunning van Onze Minister.

      3 Aan een vergunning, als bedoeld in het vorige lid, kunnen voorschriften worden verbonden. Zij kan onder
      beperkingen worden verleend. Zij kan worden ingetrokken.

      4 Tenzij het algemeen belang zich naar zijn oordeel daartegen verzet, stelt Onze Minister een regeling als bedoeld
      in [artikel 3, eerste lid, aanhef en onder b][ref3], niet vast dan nadat hij met de daarbij in belangrijke mate
      betrokken produkt- en bedrijfschappen zomede de naar zijn oordeel daarvoor in aanmerking komende organisaties van
      sportvissers overleg heeft gepleegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003144#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003144#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003144#Artikel3
