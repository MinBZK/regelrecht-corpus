        artikel: '3'
  - number: 6c
    text: |-
      1 Het is verboden met enig ander vaartuig dan een vissersvaartuig de visserij met de boomkor uit te oefenen dan wel
      zodanig vistuig aan boord van enig ander vaartuig dan een vissersvaartuig aanwezig te hebben.

      2 Het is verboden met een vissersvaartuig de visserij met de boomkor uit te oefenen dan wel een boomkor aan boord
      van een vissersvaartuig te hebben indien de boomkor:

      a. gemeten tussen de uiteinden van de constructie meer dan 12 meter lang is

      b. kan worden uitgeschoven of vergroot tot een lengte van meer dan 12 meter of

      c. voorzien is van elektroden of ander materiaal waarmee elektrovisserij kan worden uitgeoefend.

      3 Het is verboden met een vissersvaartuig de visserij uit te oefenen met:

      a. meer dan twee boomkorren of

      b. één of twee boomkorren tezamen met enig ander vistuig.

      4 Het is verboden aan boord van een vissersvaartuig meer dan twee boomkorren te hebben.
    url: https://wetten.overheid.nl/BWBR0003144/1998-03-01#Artikel6c
  - number: 6d
    text: |-
      1 Onze Minister kan vrijstelling of ontheffing verlenen van het bepaalde bij of krachtens dit besluit.

      2 Aan vrijstellingen en ontheffingen als bedoeld in het eerste lid kunnen voorschriften worden verbonden. Zij
      kunnen onder beperkingen worden verleend. Zij kunnen te allen tijde worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003144/1998-03-01#Artikel6d
  - number: '7'
    text: |-
      Het Reglement zeevisserij 1971 (*Stb.* 284), het Reglement voor de visserijzone 1970 (*Stb.* 174) en het Reglement
      voor de kustvisserij 1970 (*Stb.* 177) worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003144/1998-03-01#Artikel7
  - number: '8'
    text: |-
      1 Dit besluit treedt in werking met ingang van 1 januari 1978.

      2 Het kan worden aangehaald als "Reglement zee- en kustvisserij 1977".
    url: https://wetten.overheid.nl/BWBR0003144/1998-03-01#Artikel8
