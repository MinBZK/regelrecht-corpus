---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: warenwetbesluit_voedingswaarde_informatie_levensmiddelen
regulatory_layer: AMVB
publication_date: '2013-04-25'
valid_from: '2012-03-21'
bwb_id: BWBR0006135
url: https://wetten.overheid.nl/BWBR0006135/2012-03-21
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 20 april 1993, nr. DVGgz/VVP/
    L 93644, gedaan in overeenstemming met Onze Minister van Economische Zaken en de Staatssecretaris van Landbouw,
    Natuurbeheer en Visserij;

    Gelet op artikel 11, eerste en tweede lid, van Richtlijn nr. 90/496/EEG van de Raad van de Europese Gemeenschappen
    van 24 september 1990 inzake de voedingswaarde-etikettering van levensmiddelen (PbEG L 276);

    Gelet op artikel 8, onder c, 12 en 14 van de Warenwet en op artikel II, eerste lid, van de Wijzigingswet 1988
    Warenwet;

    Gezien het advies van de Adviescommissie Warenwet (advies van 16 juni 1992, nr. 14511(3)5);

    De Raad van State gehoord (advies van 13 juli 1993, nr. W 13.93.0239);

    Gezien het nader rapport van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 24 augustus 1993, nr.
    DGVgz/VVP/L 931549, uitgebracht in overeenstemming met Onze Minister van Economische Zaken en de Staatssecretaris
    van Landbouw, Natuurbeheer en Visserij;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel1
  - number: 1.1.a
    text: |-
      richtlijn: de [Richtlijn nr. 90/496/EEG](31990L0496) van de Raad van de Europese Gemeenschappen van 24 september
      1990 inzake de voedingswaarde-etikettering van levensmiddelen (*PbEG* L 276), naar de tekst zoals deze bij die
      richtlijn is vastgesteld;
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel1
  - number: 1.1.b
    text: |-
      instelling: hetgeen daaronder in het [Warenwetbesluit Etikettering van levensmiddelen][ref1] wordt verstaan;


      [ref1]: https://wetten.overheid.nl/BWBR0005310
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005310
  - number: 1.1.c
    text: |-
      eet- of drinkwaren: eet- of drinkwaren die bestemd zijn als zodanig aan de eindverbruiker of een instelling te
      worden afgeleverd;
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel1
  - number: 1.1.d
    text: |-
      voedingsstoffen: eiwitten, koolhydraten, vetstoffen, voedingsvezels, natrium en in de bijlage genoemde vitaminen
      en mineralen;
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel1
  - number: 1.1.e
    text: |-
      voedingswaarde-etikettering: het op een etiket van de verpakking van een eet- of drinkwaar aanbrengen van
      informatie over die waar met betrekking tot
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel1
  - number: 1.1.e.1°
    text: de energetische waarde, en
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel1
  - number: 1.1.e.2°
    text: de gehaltes aan voedingsstoffen
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel1
  - number: 1.1.f
    text: |-
      bewering inzake de voedingswaarde: elke reclameboodschap die niet deel uitmaakt van een collectieve
      reclamecampagne, en elke vermelding, waarmee wordt gesteld, de indruk wordt gewekt of geïmpliceerd dat een eet-
      of drinkwaar wat betreft de energetische waarde of de aanwezigheid van voedingsstoffen bepaalde kwalitatieve of
      kwantitatieve voedingseigenschappen bezit, voor zover dergelijke vermeldingen niet zijn voorgeschreven bij of
      krachtens enig wettelijk voorschrift;
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel1
  - number: 1.1.g
    text: 'eiwitten: het eiwitgehalte berekend aan de hand van de volgende formule: eiwit = totaal Kjeldahl-stikstof * 6,25;'
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel1
  - number: 1.1.h
    text: 'koolhydraten: de koolhydraten die in het menselijk organisme worden gemetaboliseerd, met inbegrip van polyolen;'
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel1
  - number: 1.1.i
    text: |-
      *polyolen:* sorbitol (E 420), mannitol (E 421), xylitol (E 967), isomalt (E 953), maltitol (E 965), lactitol (E
      966), maltitolstroop (E 965), sorbitolstroop (E 420) en erytritol (E 968);
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel1
  - number: 1.1.j
    text: 'suikers: alle in voedsel aanwezige mono- en di-sacchariden, met uitzondering van polyolen;'
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel1
  - number: 1.1.k
    text: 'vet: alle lipiden, fosfolipiden inbegrepen;'
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel1
  - number: 1.1.l
    text: 'verzadigd vet: vetzuren zonder dubbele binding;'
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel1
  - number: 1.1.m
    text: 'enkelvoudig onverzadigd vet: vetzuren met één cis dubbele binding;'
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel1
  - number: 1.1.n
    text: 'meervoudig onverzadigd vet: vetzuren met cis-cis dubbele bindingen met daartussen een methyleengroep;'
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel1
  - number: 1.1.o
    text: |-
      gemiddelde waarde: de waarde waardoor de hoeveelheid van een voedingsstof in een bepaalde eet- of drinkwaar het
      best wordt weergegeven en waarin tevens rekening is gehouden met seizoenschommelingen, consumptiepatronen en andere
      factoren waardoor de reële waarde kan variëren;
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel1
  - number: 1.1.p
    text: |-
      verordening (EG) 1924/2006: verordening (EG) nr. 1924/2006 van het Europees Parlement en de Raad van de Europese
      Unie van 20 december 2006 inzake voedings- en gezondheidsclaims voor levensmiddelen (PbEU 2006, L 404, en 2007,
      L 12);
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel1
  - number: 1.1.q
    text: |-
      claim inzake ziekterisicobeperking: een claim inzake ziekterisicobeperking als bedoeld in artikel 2, zesde lid, van
      verordening (EG) 1924/2006;
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel1
  - number: 1.1.r
    text: |-
      *voedingsvezels:* koolhydraatpolymeren bestaande uit drie of meer monomere eenheden, die in de menselijke dunne
      darm niet verteerd en niet opgenomen worden en tot de volgende categorieën behoren:
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel1
  - number: 1.1.r.1
    text: eetbare koolhydraatpolymeren die van nature voorkomen in levensmiddelen zoals die worden geconsumeerd;
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel1
  - number: 1.1.r.2
    text: |-
      eetbare koolhydraatpolymeren die langs fysische, enzymatische of chemische weg uit grondstoffen voor levensmiddelen
      zijn verkregen en een gunstig fysiologisch effect hebben dat door algemeen aanvaarde wetenschappelijke gegevens
      wordt gestaafd; of
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel1
  - number: 1.1.r.3
    text: |-
      eetbare synthetische koolhydraatpolymeren met een gunstig fysiologisch effect dat door algemeen aanvaarde
      wetenschappelijke gegevens wordt gestaafd;
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel1
  - number: 1.1.s
    text: |-
      voedselkeuzelogo: een logo dat het voor consumenten eenvoudiger maakt levensmiddelen te kiezen die ten opzichte van
      vergelijkbare levensmiddelen in een productcategorie gezonder zijn wat betreft energie of de gehaltes aan verzadigd
      vet, transvet, toegevoegd suiker, voedingsvezel of zout.
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel1
  - number: '1.2'
    text: 'Ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel1
  - number: 1.2.a
    text: natuurlijk mineraalwater en ander voor menselijke consumptie bestemd water; en
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel1
  - number: 1.2.b
    text: eet- en drinkwaren welke tot hoofddoel hebben het leveren van bepaalde voedingsstoffen;
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel1
  - number: '1.3'
    text: |-
      [Artikel 11a][ref1] is niet van toepassing op het verhandelen van een levensmiddel ten aanzien waarvan een
      voedselkeuzelogo is gebezigd dat niet door toedoen van Nederland overeenkomstig verordening (EG) 1924/2006 is
      toegelaten, en dat rechtmatig is bereid of in de handel is gebracht in een andere lidstaat van de Europese Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0006135#Artikel11a
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006135
        artikel: 11a
        paragraaf: 5a
  - number: '2.1'
    text: 'Het is verboden een eet- of drinkwaar, ten aanzien waarvan:'
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel2
  - number: 2.1.a
    text: voedingswaarde-etikettering plaatsvindt; of
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel2
  - number: 2.1.b
    text: een bewering inzake de voedingswaarde wordt gebezigd;
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel2
  - number: '2.2'
    text: |-
      Het is verboden te handelen in strijd met de bij of krachtens de artikelen 3, 4, derde en vijfde lid, 5, 6, eerste
      en tweede lid, 7, 8, eerste lid, 9, 10, eerste, tweede en derde lid, 12, en 14, van verordening (EG) 1924/2006
      gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel2
  - number: '2.3'
    text: |-
      Het is verboden te handelen in strijd met bij of krachtens [artikel 11a][ref1] gestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0006135#Artikel11a
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006135
        artikel: 11a
        paragraaf: 5a
  - number: 2a.1
    text: |-
      [Artikel 19, eerste lid, onder a][ref1], en [artikel 20, tweede lid, onder a, van de Warenwet][ref2], zijn niet van
      toepassing op een claim inzake ziekterisicobeperking, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0001969#Artikel20
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0001969
        artikel: '20'
  - number: 2a.1.a
    text: |-
      de desbetreffende claim is opgenomen in de communautaire lijst, bedoeld in artikel 14, eerste lid, van verordening
      (EG) 1924/2006; en
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel2a
  - number: 2a.1.b
    text: voldaan is aan de in die lijst gestelde voorwaarden voor het gebruik van die claim.
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel2a
  - number: 2a.2
    text: |-
      De Nederlandse Voedsel- en Warenautoriteit is de bevoegde nationale autoriteit, bedoeld in verordening (EG)
      1924/2006.
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel2a
  - number: 2a.3
    text: |-
      Onze Minister stelt nadere regels vast inzake voedings- en gezondheidsclaims voor levensmiddelen, voor zover
      die noodzakelijk zijn voor de goede uitvoering van de bij of krachtens verordening (EG) 1924/2006 gestelde
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel2a
  - number: '3.1'
    text: 'Bij voedingswaarde-etikettering wordt een vermelding gebezigd, in onderstaande volgorde, van:'
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel3
  - number: 3.1.a
    text: de energetische waarde; en
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel3
  - number: 3.1.b
    text: 'het gehalte aan:'
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel3
  - number: 3.1.b.1°
    text: eiwitten, koolhydraten en vetten; of
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel3
  - number: 3.1.b.2°
    text: eiwitten, koolhydraten, suikers, vetten, verzadigde vetzuren, voedingsvezels en natrium.
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel3
  - number: '3.2'
    text: |-
      Onverminderd het eerste lid wordt bij voedingswaarde-etikettering uitsluitend een vermelding gebezigd van het
      gehalte aan één of meer van de volgende voedingsstoffen:
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel3
  - number: 3.2.a
    text: zetmeel;
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel3
  - number: 3.2.b
    text: polyolen;
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel3
  - number: 3.2.c
    text: enkelvoudig onverzadigde vetzuren;
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel3
  - number: 3.2.d
    text: meervoudig onverzadigde vetzuren;
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel3
  - number: 3.2.e
    text: cholesterol; of
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel3
  - number: 3.2.f
    text: |-
      de in de bijlage genoemde vitaminen en mineralen die in de waar aanwezig zijn in een significante hoeveelheid,
      zoals in de bijlage bedoeld.
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel3
  - number: '3.3'
    text: |-
      Indien de in het tweede lid, aanhef en onder *c, d* of *e*, bedoelde vermelding wordt gebezigd, wordt bij de
      voedingswaarde-etikettering ook een vermelding van het gehalte aan verzadigde vetzuren gebezigd.
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel3
  - number: '3.4'
    text: |-
      Indien een bewering inzake de voedingswaarde wordt gebezigd, vindt voedingswaarde-etikettering plaats, en worden
      daarbij:
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel3
  - number: 3.4.a
    text: |-
      de stoffen vermeld die behoren tot of bestanddelen zijn van een van de categorieën van de in het eerste en tweede
      lid genoemde voedingsstoffen en waarop de bewering betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel3
  - number: 3.4.b
    text: |-
      de vermeldingen, bedoeld in het eerste lid, onder *a*, en *b*, 2°, gebezigd, indien de bewering betrekking heeft op
      suikers, verzadigde vetzuren, voedingsvezel of natrium.
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel3
  - number: '4'
    text: |-
      Het gehalte aan suikers, polyolen of zetmeel van een eet- of drinkwaar wordt vermeld onmiddellijk na de vermelding
      van het gehalte aan koolhydraten, op de volgende wijze: - koolhydraten g, waarvan:
        - suikers g,
        - polyolen g,
        - zetmeel g.
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel4
  - number: '5'
    text: |-
      De soort of het gehalte aan vetzuur of het gehalte aan cholesterol van de eet- of drinkwaar wordt vermeld
      onmiddellijk na de vermelding van het totaal vetgehalte, op de volgende wijze: - vet g, waarvan:
        - verzadigd vet g,
        - enkelvoudig onverzadigd vet g,
        - meervoudig onverzadigd vet g,
        - cholesterol mg.
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel5
  - number: '6.1'
    text: |-
      De energetische waarde en de gehaltes aan voedingsstoffen of bestanddelen daarvan van een eet- of drinkwaar worden
      in cijfers vermeld en in de volgende eenheden uitgedrukt:
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel6
  - number: 6.1.a
    text: energetische waarde in kJ en kcal;
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel6
  - number: 6.1.b
    text: eiwit, koolhydraten, vet, voedingsvezels en natrium in gram;
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel6
  - number: 6.1.c
    text: cholesterol in milligram;
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel6
  - number: 6.1.d
    text: vitaminen en mineralen in de in de bijlage genoemde eenheden.
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel6
  - number: '6.2'
    text: |-
      De in het eerste lid bedoelde waarde en gehaltes worden vermeld per 100 g of 100 ml van de waar en mogen tevens
      worden vermeld:
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel6
  - number: 6.2.a
    text: per op het etiket aangegeven geserveerde hoeveelheid; of
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel6
  - number: 6.2.b
    text: per portie, onder vermelding van het aantal porties in de verpakking.
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel6
  - number: '6.3'
    text: |-
      Onverminderd het eerste en tweede lid wordt het gehalte aan vitaminen en mineralen ook vermeld in procenten van de
      in de bijlage vermelde aanbevolen dagelijkse hoeveelheid.
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel6
  - number: '6.4'
    text: |-
      Onze Minister stelt ter uitvoering van krachtens artikel 10 van de richtlijn getroffen maatregelen nadere regels
      vast inzake het in grafische vorm vermelden van de in het eerste, tweede en derde lid bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel6
  - number: '6.5'
    text: |-
      De in dit artikel bedoelde vermeldingen hebben betrekking op de eet- of drinkwaar zoals die te koop wordt
      aangeboden.
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel6
  - number: '6.6'
    text: |-
      In afwijking van het vijfde lid mogen, indien een voldoende gedetailleerde bereidingswijze is vermeld, de in dit
      artikel bedoelde vermeldingen betrekking hebben op de na bereiding voor consumptie gerede eet- of drinkwaar.
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel6
  - number: '7.1'
    text: 'Een bewering inzake de voedingswaarde heeft uitsluitend betrekking op:'
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel7
  - number: 7.1.a
    text: energetische waarde; en
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel7
  - number: 7.1.b
    text: |-
      de stoffen die behoren tot of bestanddelen zijn van een van de categorieën van de in
      [het eerste en tweede lid van artikel 3][ref1] genoemde voedingsstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0006135#Artikel3
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006135
        artikel: '3'
        paragraaf: '2'
  - number: '7.2'
    text: |-
      Onze Minister stelt ter uitvoering van krachtens de richtlijn getroffen maatregelen nadere regels vast met
      betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel7
  - number: '9.1'
    text: |-
      De vermeldingen terzake van de voedingswaarde-etikettering en de beweringen inzake de voedingswaarde worden tezamen
      op één, in het oog vallende, plaats aangebracht, voor wat betreft voedingswaarde-etikettering in tabelvorm met de
      cijfers onder elkaar of, indien daarvoor niet voldoende ruimte beschikbaar is, achter elkaar.
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel9
  - number: '9.2'
    text: |-
      De [artikelen 23][ref1], [24, eerste en tweede lid][ref2], en
      [25 tot en met 28 van het Warenwetbesluit Etikettering van levensmiddelen][ref3], zijn van overeenkomstige
      toepassing met betrekking tot de in het eerste lid bedoelde vermeldingen met dien verstande dat die vermeldingen
      daarnaast tevens in een andere taal gebezigd mogen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0005310#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0005310#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0005310#Artikel25
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005310
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0005310
        artikel: '24'
      - id: ref3
        bwb_id: BWBR0005310
        artikel: '25'
  - number: '10.1'
    text: |-
      Bij de berekening van de te vermelden energetische waarde van een eet- of drinkwaar wordt van de volgende
      omrekeningsfactoren gebruik gemaakt:
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel10
  - number: 10.1.a
    text: 'koolhydraten (met uitzondering van polyolen): 17 kJ/g - 4 kcal/g'
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel10
  - number: 10.1.b
    text: 'polyolen: 10 kJ/g - 2,4 kcal/g'
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel10
  - number: 10.1.c
    text: 'eiwit: 17 kJ/g - 4 kcal/g'
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel10
  - number: 10.1.d
    text: 'vet: 37 kJ/g - 9 kcal/g'
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel10
  - number: 10.1.e
    text: 'alcohol (ethanol): 29 kJ/g - 7 kcal/g'
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel10
  - number: 10.1.f
    text: 'organische zuren: 13 kJ/g - 3 kcal/g'
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel10
  - number: 10.1.g
    text: 'salatrims: 25 kJ/g – 6 kcal/g'
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel10
  - number: 10.1.h
    text: 'voedingsvezels: 8 kJ/g – 2 kcal/g'
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel10
  - number: 10.1.i
    text: 'erytritol: 0 kJ/g – 0 kcal/g.'
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel10
  - number: '10.2'
    text: |-
      Onze Minister stelt ter uitvoering van krachtens de richtlijn getroffen maatregelen nadere regels vast met
      betrekking tot de omrekeningsfactoren die gebruikt worden bij de berekening van de energetische waarde van eet-
      of drinkwaren.
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel10
  - number: '11.1'
    text: |-
      De in dit besluit bedoelde waarden en gehaltes zijn naar behoren vastgestelde gemiddelden, waarvoor al naar gelang
      van het geval wordt uitgegaan van:
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel11
  - number: 11.1.a
    text: de analyse van de eet- of drinkwaar door de fabrikant;
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel11
  - number: 11.1.b
    text: de berekening op basis van de bekende of effectieve gemiddelde waarde van de verwerkte ingrediënten; of
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel11
  - number: 11.1.c
    text: de berekening aan de hand van algemeen vaststaande en aanvaarde gegevens.
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel11
  - number: '11.2'
    text: |-
      Onze Minister stelt ter uitvoering van krachtens de richtlijn getroffen maatregelen nadere regels vast met
      betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel11
  - number: 11a.1
    text: |-
      Onverminderd verordening (EG) 1924/2006 mag bij de verhandeling van een levensmiddel een door representatieve
      organisaties van producenten en verhandelaren ontwikkeld voedselkeuzelogo worden gebezigd, onder de volgende
      voorwaarden:
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel11a
  - number: 11a.1.a
    text: 'het logo wordt niet gebezigd bij:'
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel11a
  - number: 11a.1.a.1
    text: alcoholhoudende dranken;
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel11a
  - number: 11a.1.a.2
    text: |-
      zuigelingenvoeding en opvolgzuigelingenvoeding als bedoeld in de [Warenwetregeling zuigelingenvoeding 2007][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021907
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0021907
  - number: 11a.1.a.3
    text: |-
      bewerkte eet- of drinkwaren op basis van granen en babyvoeding als bedoeld in de
      [Warenwetregeling Babyvoeding][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008503
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0008503
  - number: 11a.1.a.4
    text: |-
      dieetvoeding voor medisch gebruik als bedoeld in de [Warenwetregeling Dieetvoeding voor medisch gebruik][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0010600
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0010600
  - number: 11a.1.a.5
    text: |-
      voedingssupplementen als bedoeld in het [Warenwetbesluit voedingssupplementen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014814
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0014814
  - number: 11a.1.b
    text: het logo is begrijpelijk voor de consument;
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel11a
  - number: 11a.1.c
    text: 'de regels voor het gebruik van het logo zijn:'
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel11a
  - number: 11a.1.c.1
    text: in lijn met de door de Gezondheidsraad vastgestelde richtlijnen Goede Voeding;
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel11a
  - number: 11a.1.c.2
    text: tot stand gekomen met inachtneming van de laatste wetenschappelijke inzichten ter zake;
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel11a
  - number: 11a.1.c.3
    text: getoetst door een onafhankelijke wetenschappelijke commissie; en
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel11a
  - number: 11a.1.c.4
    text: in ieder geval gesteld in de Nederlandse taal en voor een ieder te raadplegen op internet; en
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel11a
  - number: 11a.1.d
    text: het voedselkeuzelogo en de regels voor het gebruik ervan zijn goedgekeurd door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel11a
  - number: 11a.2
    text: |-
      Een verzoek tot goedkeuring van een voedselkeuzelogo en van de regels voor het gebruik ervan, wordt ingediend bij
      Onze Minister. De goedkeuring wordt verleend indien voldaan is aan de in dit artikel ter zake gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel11a
  - number: 11a.3
    text: |-
      Onze Minister kan een in het tweede lid bedoelde goedkeuring intrekken indien het voedselkeuzelogo of de regels
      voor het gebruik ervan niet meer voldoen aan de in het tweede lid bedoelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel11a
  - number: 11a.4
    text: Onze Minister maakt een in het tweede en derde lid bedoeld besluit bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel11a
  - number: 11a.5
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld inzake het eerste en tweede lid. In deze nadere
      regels kan worden bepaald dat de goedkeuring voor bepaalde tijd wordt verleend.
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel11a
  - number: '12.1'
    text: |-
      Als methoden van onderzoek welke bij uitsluiting beslissend zijn voor de vaststelling of met betrekking tot een in
      dit besluit bedoelde eet- of drinkwaar al dan niet is voldaan aan de bij of krachtens dit besluit gestelde regels,
      worden aangewezen chromatografische en andere scheidingsmethoden, alsmede detectiemethoden.
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel12
  - number: '12.2'
    text: |-
      Onze Minister stelt ter uitvoering van krachtens de richtlijn getroffen maatregelen nadere regels vast met
      betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel12
  - number: '12.3'
    text: Onverminderd het tweede lid kan Onze Minister nadere regels stellen met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel12
  - number: '13'
    text: |-
      In afwijking van [artikel 3, eerste lid, onder b, 2°, en vierde lid, aanhef en onder b][ref1], mag voedingswaarde-
      etikettering van onderscheidenlijk het gehalte aan suikers, verzadigde vetzuren, voedingsvezels of natrium, tot
      1 oktober 1995 ook afzonderlijk van elkaar plaatsvinden, met dien verstande dat zulks in dat geval geschiedt in
      overeenstemming met de in [artikel 3, eerste lid, onder b, 2°][ref2], aangegeven positie in de reeks van de daar
      bedoelde vermeldingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006135#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006135#Artikel3
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006135
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006135
        artikel: '3'
        paragraaf: '2'
  - number: '14'
    text: Het Voedingswaarde-aanduidingenbesluit (Warenwet) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel14
  - number: '15'
    text: Dit besluit treedt in werking met ingang van 1 oktober 1993.
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel15
  - number: '16'
    text: 'Dit besluit wordt aangehaald als: Warenwetbesluit Voedingswaarde-informatie levensmiddelen.'
    url: https://wetten.overheid.nl/BWBR0006135/2012-03-21#Artikel16
