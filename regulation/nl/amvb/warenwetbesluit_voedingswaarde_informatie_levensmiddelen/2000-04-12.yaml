  - number: '2'
    text: |-
      Het is verboden een eet- of drinkwaar, ten aanzien waarvan:

      a. voedingswaarde-etikettering plaatsvindt; of

      b. een bewering inzake de voedingswaarde wordt gebezigd;

      te verhandelen anders dan met inachtneming van de voorschriften, bij of krachtens dit besluit gesteld met
      betrekking tot het bezigen van vermeldingen of voorstellingen.
    url: https://wetten.overheid.nl/BWBR0006135/2000-04-12#Artikel2
  - number: '3'
    text: |-
      1 Bij voedingswaarde-etikettering wordt een vermelding gebezigd, in onderstaande volgorde, van:

      a. de energetische waarde; en

      b. het gehalte aan:

      1°. eiwitten, koolhydraten en vetten; of

      2°. eiwitten, koolhydraten, suikers, vetten, verzadigde vetzuren, voedingsvezels en natrium.

      2 Onverminderd het eerste lid wordt bij voedingswaarde-etikettering uitsluitend een vermelding gebezigd van het
      gehalte aan één of meer van de volgende voedingsstoffen:

      a. zetmeel;

      b. polyolen;

      c. enkelvoudig onverzadigde vetzuren;

      d. meervoudig onverzadigde vetzuren;

      e. cholesterol; of

      f. de in de bijlage genoemde vitaminen en mineralen die in de waar aanwezig zijn in een significante hoeveelheid,
      zoals in de bijlage bedoeld.

      3 Indien de in het tweede lid, aanhef en onder *c, d* of *e*, bedoelde vermelding wordt gebezigd, wordt bij de
      voedingswaarde-etikettering ook een vermelding van het gehalte aan verzadigde vetzuren gebezigd.

      4 Indien een bewering inzake de voedingswaarde wordt gebezigd, vindt voedingswaarde-etikettering plaats, en worden
      daarbij:

      a. de stoffen vermeld die behoren tot of bestanddelen zijn van een van de categorieën van de in het eerste en
      tweede lid genoemde voedingsstoffen en waarop de bewering betrekking heeft;

      b. de vermeldingen, bedoeld in het eerste lid, onder *a*, en *b*, 2°, gebezigd, indien de bewering betrekking heeft
      op suikers, verzadigde vetzuren, voedingsvezel of natrium.
    url: https://wetten.overheid.nl/BWBR0006135/2000-04-12#Artikel3
  - number: '4'
    text: |-
      Het gehalte aan suikers, polyolen of zetmeel van een eet- of drinkwaar wordt vermeld onmiddellijk na de vermelding
      van het gehalte aan koolhydraten, op de volgende wijze:

        - koolhydraten g, waarvan:
        - suikers g,
        - polyolen g,
        - zetmeel g.
    url: https://wetten.overheid.nl/BWBR0006135/2000-04-12#Artikel4
  - number: '5'
    text: |-
      De soort of het gehalte aan vetzuur of het gehalte aan cholesterol van de eet- of drinkwaar wordt vermeld
      onmiddellijk na de vermelding van het totaal vetgehalte, op de volgende wijze:

        - vet g, waarvan:
        - verzadigd vet g,
        - enkelvoudig onverzadigd vet g,
        - meervoudig onverzadigd vet g,
        - cholesterol mg.
    url: https://wetten.overheid.nl/BWBR0006135/2000-04-12#Artikel5
  - number: '6'
    text: |-
      1 De energetische waarde en de gehaltes aan voedingsstoffen of bestanddelen daarvan van een eet- of drinkwaar
      worden in cijfers vermeld en in de volgende eenheden uitgedrukt:

      a. energetische waarde in kJ en kcal;

      b. eiwit, koolhydraten, vet, voedingsvezels en natrium in gram;

      c. cholesterol in milligram;

      d. vitaminen en mineralen in de in de bijlage genoemde eenheden.

      2 De in het eerste lid bedoelde waarde en gehaltes worden vermeld per 100 g of 100 ml van de waar en mogen tevens
      worden vermeld:

      a. per op het etiket aangegeven geserveerde hoeveelheid; of

      b. per portie, onder vermelding van het aantal porties in de verpakking.

      3 Onverminderd het eerste en tweede lid wordt het gehalte aan vitaminen en mineralen ook vermeld in procenten van
      de in de bijlage vermelde aanbevolen dagelijkse hoeveelheid.

      4 Onze Minister stelt ter uitvoering van krachtens artikel 10 van de richtlijn getroffen maatregelen nadere regels
      vast inzake het in grafische vorm vermelden van de in het eerste, tweede en derde lid bedoelde gegevens.

      5 De in dit artikel bedoelde vermeldingen hebben betrekking op de eet- of drinkwaar zoals die te koop wordt
      aangeboden.

      6 In afwijking van het vijfde lid mogen, indien een voldoende gedetailleerde bereidingswijze is vermeld, de in dit
      artikel bedoelde vermeldingen betrekking hebben op de na bereiding voor consumptie gerede eet- of drinkwaar.
    url: https://wetten.overheid.nl/BWBR0006135/2000-04-12#Artikel6
  - number: '7'
    text: |-
      1 Een bewering inzake de voedingswaarde heeft uitsluitend betrekking op:

      a. energetische waarde; en

      b. de stoffen die behoren tot of bestanddelen zijn van een van de categorieën van de in
      [het eerste en tweede lid van artikel 3][ref1] genoemde voedingsstoffen.

      2 Onze Minister stelt ter uitvoering van krachtens de richtlijn getroffen maatregelen nadere regels vast met
      betrekking tot het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006135#Artikel3
    url: https://wetten.overheid.nl/BWBR0006135/2000-04-12#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006135
        artikel: '3'
        paragraaf: '2'
  - number: '8'
    text: |-
      1 Met betrekking tot de energetische waarde en de in dit lid bedoelde voedingsstoffen worden uitsluitend de
      volgende beweringen inzake de voedingswaarde onder de daarbij gestelde voorwaarden gebezigd:

      a. de energetische waarde:

      1°. beweringen over de lage energetische waarde, indien de voor consumptie gerede waar minder dan 210 kJ (50 kcal)
      per 100 g of per 100 ml levert, met uitzondering van dranken en soepen waarvoor de bewering slechts mag worden
      gebezigd indien het voor consumptie gerede produkt minder dan 85 kJ (20 kcal) per 100 ml levert;

      2°. beweringen over de verminderde energetische waarde, indien de waar ten minste 33% minder energie levert dan
      gebruikelijk is voor soortgelijke waren;

      b. het vetgehalte:

      1°. beweringen over het lage vetgehalte, indien het vetgehalte lager is dan 5%, met dien verstande dat voor
      dranken, soepen en vloeibare melkprodukten dit gehalte berekend moet worden op de droge stof;

      2°. beweringen over een verminderd vetgehalte, indien het vetgehalte van het produkt ten minste 33% lager is dan
      het gebruikelijke gehalte in soortgelijke waren;

      c. het eiwitgehalte:

      1°. beweringen over het hoge eiwitgehalte, indien het eiwitgehalte ten minste 20% bedraagt, met dien verstande dat
      indien het soepen, dranken en vloeibare melkprodukten betreft, dit gehalte berekend moet worden op de droge stof;

      2°. beweringen over een verhoogd eiwitgehalte, indien de waar ten minste 33% meer eiwit bevat dan het gebruikelijke
      gehalte in soortgelijke waren;

      d. de vetzuursamenstelling:

      1°. beweringen over het hoge gehalte aan meervoudig onverzadigd vet, indien

        - het gehalte aan meervoudig onverzadigd vet in het aanwezige vet ten minste 60% bedraagt, en
        - het gehalte aan verzadigd vet in het aanwezige vet ten hoogste 25% bedraagt, en
        - de waar per redelijk geachte dagconsumptie ten minste 5 gram vet bevat;

      2°. beweringen over het verhoogde gehalte aan meervoudig onverzadigde vetzuren, indien

        - het gehalte aan meervoudig onverzadigd vet ten minste tweemaal zo hoog is als het gebruikelijke gehalte in
      soortgelijke waren, en
        - het gehalte aan meervoudig onverzadigd vet in het aanwezige vet ten minste 30% en ten hoogste 60% bedraagt, en
        - het gehalte aan verzadigd vet niet hoger is dan het gehalte aan meervoudig onverzadigd vet, en
        - de waar per redelijk geachte dagconsumptie ten minste 5 gram vet bevat;

      3°. beweringen over het lage gehalte aan verzadigd vet, indien

        - het gehalte aan verzadigd vet in het aanwezige vet ten hoogste 25% bedraagt, en
        - het gehalte aan meervoudig onverzadigd vet in het aanwezige vet ten minste 60% bedraagt, en
        - de waar per redelijk geachte dagconsumptie ten minste 5 gram vet bevat;

      e. het gehalte aan suikers:

      1°. de beweringen "suikervrij" en "zonder suiker", indien de waar geen suiker(s) bevat en soortgelijke waren wel
      suiker(s) kunnen bevatten;

      2°. beweringen over een verminderd gehalte aan suikers, indien de waar ten minste 33% minder suikers bevat dan het
      gebruikelijke gehalte in soortgelijke waren;

      3°. beweringen "geen suiker(s) toegevoegd", "zonder toegevoegde suiker(s)" en "ongezoet" indien aan de waar geen
      suiker(s), honing of stropen zijn toegevoegd;

      f. het gehalte aan voedingsvezel:

      1°. beweringen over een hoog gehalte aan voedingsvezel, indien het produkt op de droge stof berekend ten minste
      10% voedingsvezel bevat, met dien verstande dat indien het soepen, dranken en vloeibare melkprodukten betreft, dit
      gehalte berekend moet worden op het gerede produkt;

      2°. beweringen over een verhoogd gehalte aan voedingsvezel, indien de waar ten minste 33% meer voedingsvezel bevat
      dan het gebruikelijke gehalte in soortgelijke waren;

      g. het gehalte aan natrium:

      1°. beweringen over een laag natrium- of zoutgehalte, indien de waar minder dan 40 mg natrium per 100 gram of ml
      bevat;

      2°. beweringen over een verminderd natrium- of zoutgehalte, indien het produkt ten minste 33% minder natrium bevat
      dan het gebruikelijke gehalte in soortgelijke waren;

      3°. de bewering "geen zout toegevoegd", "ongezouten", "bereid zonder zout", "gefabriceerd zonder zout" of "zonder
      toevoeging van zout", indien bij de bereiding van de waar geen natriumzouten zijn toegevoegd;

      h. het gehalte aan vitaminen:

      beweringen over het hoge gehalte aan een bepaalde vitamine, indien de waar per redelijk geachte dagconsumptie ten
      minste 20% van de voor de desbetreffende stof aanbevolen dagelijkse hoeveelheid bevat;

      i. het gehalte aan mineralen:

      beweringen over het hoge gehalte aan een bepaald mineraal, uitgezonderd natrium, indien de waar per redelijk
      geachte dagconsumptie ten minste 20% van de voor de desbetreffende stof aanbevolen dagelijkse hoeveelheid bevat.

      2 Het eerste lid is van overeenkomstige toepassing ten aanzien van een vertaling van een in dat lid genoemde
      bewering, die in voor de Nederlandse verbruiker begrijpelijke bewoordingen is gesteld.

      3 . Onze Minister stelt, in overeenstemming met Onze Ministers van Economische Zaken en van Landbouw, Natuurbeheer
      en Visserij nadere regels met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006135/2000-04-12#Artikel8
  - number: '9'
    text: |-
      1 De vermeldingen terzake van de voedingswaarde-etikettering en de beweringen inzake de voedingswaarde worden
      tezamen op één, in het oog vallende, plaats aangebracht, voor wat betreft voedingswaarde-etikettering in tabelvorm
      met de cijfers onder elkaar of, indien daarvoor niet voldoende ruimte beschikbaar is, achter elkaar.

      2 De [artikelen 23][ref1], [24, eerste en tweede lid][ref2], en
      [25 tot en met 28 van het Warenwetbesluit Etikettering van levensmiddelen][ref3], zijn van overeenkomstige
      toepassing met betrekking tot de in het eerste lid bedoelde vermeldingen met dien verstande dat die vermeldingen
      daarnaast tevens in een andere taal gebezigd mogen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0005310#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0005310#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0005310#Artikel25
