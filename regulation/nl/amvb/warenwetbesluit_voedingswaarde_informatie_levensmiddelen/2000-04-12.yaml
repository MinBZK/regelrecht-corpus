preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 20 april 1993, nr. DVGgz/VVP/
    L 93644, gedaan in overeenstemming met Onze Minister van Economische Zaken en de Staatssecretaris van Landbouw,
    Natuurbeheer en Visserij;

    Gelet op artikel 11, eerste en tweede lid, van Richtlijn nr. 90/496/EEG van de Raad van de Europese Gemeenschappen
    van 24 september 1990 inzake de voedingswaarde-etikettering van levensmiddelen (PbEG L 276);

    Gelet op artikel 8, onder c, 12 en 14 van de Warenwet en op artikel II, eerste lid, van de Wijzigingswet 1988
    Warenwet;

    Gezien het advies van de Adviescommissie Warenwet (advies van 16 juni 1992, nr. 14511(3)5);

    De Raad van State gehoord (advies van 13 juli 1993, nr. W 13.93.0239);

    Gezien het nader rapport van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 24 augustus 1993, nr.
    DGVgz/VVP/L 931549, uitgebracht in overeenstemming met Onze Minister van Economische Zaken en de Staatssecretaris
    van Landbouw, Natuurbeheer en Visserij;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006135/2000-04-12#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. richtlijn: de [Richtlijn nr. 90/496/EEG](31990L0496) van de Raad van de Europese Gemeenschappen van 24 september
      1990 inzake de voedingswaarde-etikettering van levensmiddelen (*PbEG* L 276), naar de tekst zoals deze bij die
      richtlijn is vastgesteld;

      b. instelling: hetgeen daaronder in het [Warenwetbesluit Etikettering van levensmiddelen][ref1] wordt verstaan;

      c. eet- of drinkwaren: eet- of drinkwaren die bestemd zijn als zodanig aan de eindverbruiker of een instelling te
      worden afgeleverd;

      d. voedingsstoffen: eiwitten, koolhydraten, vetstoffen, voedingsvezels, natrium en in de bijlage genoemde vitaminen
      en mineralen;

      e. voedingswaarde-etikettering: het op een etiket van de verpakking van een eet- of drinkwaar aanbrengen van
      informatie over die waar met betrekking tot

      1°. de energetische waarde, en

      2°. de gehaltes aan voedingsstoffen

      voor zover dergelijke vermeldingen niet zijn voorgeschreven bij of krachtens enig wettelijk voorschrift;

      f. bewering inzake de voedingswaarde: elke reclameboodschap die niet deel uitmaakt van een collectieve
      reclamecampagne, en elke vermelding, waarmee wordt gesteld, de indruk wordt gewekt of geïmpliceerd dat een eet-
      of drinkwaar wat betreft de energetische waarde of de aanwezigheid van voedingsstoffen bepaalde kwalitatieve of
      kwantitatieve voedingseigenschappen bezit, voor zover dergelijke vermeldingen niet zijn voorgeschreven bij of
      krachtens enig wettelijk voorschrift;

      g. eiwitten: het eiwitgehalte berekend aan de hand van de volgende formule: eiwit = totaal Kjeldahl-stikstof
      * 6,25;

      h. koolhydraten: de koolhydraten die in het menselijk organisme worden gemetaboliseerd, met inbegrip van polyolen;

      i. polyolen: de zoetstoffen opgenomen onder B.1 van de Bijlage van het [Warenwetbesluit Zoetstoffen][ref2];

      j. suikers: alle in voedsel aanwezige mono- en di-sacchariden, met uitzondering van polyolen;

      k. vet: alle lipiden, fosfolipiden inbegrepen;

      l. verzadigd vet: vetzuren zonder dubbele binding;

      m. enkelvoudig onverzadigd vet: vetzuren met één cis dubbele binding;

      n. meervoudig onverzadigd vet: vetzuren met cis-cis dubbele bindingen met daartussen een methyleengroep;

      o. zout: het gehalte aan natrium, vermenigvuldigd met 2,5;

      p. gemiddelde waarde: de waarde waardoor de hoeveelheid van een voedingsstof in een bepaalde eet- of drinkwaar het
      best wordt weergegeven en waarin tevens rekening is gehouden met seizoenschommelingen, consumptiepatronen en andere
      factoren waardoor de reële waarde kan variëren;

      q. gehalte: de hoeveelheid van één of meer voedingsstoffen per gewichts- of volume-eenheid van de eet- of
      drinkwaar.

      2 Dit besluit is niet van toepassing op:

      a. natuurlijk mineraalwater en ander voor menselijke consumptie bestemd water;

      b. eet- en drinkwaren welke tot hoofddoel hebben het leveren van bepaalde voedingsstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0005310
      [ref2]: https://wetten.overheid.nl/BWBR0004652
    url: https://wetten.overheid.nl/BWBR0006135/2000-04-12#Artikel1
