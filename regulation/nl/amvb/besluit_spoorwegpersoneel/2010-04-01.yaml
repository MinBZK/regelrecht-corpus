---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_spoorwegpersoneel
regulatory_layer: AMVB
publication_date: '2011-05-24'
valid_from: '2010-04-01'
bwb_id: BWBR0017625
url: https://wetten.overheid.nl/BWBR0017625/2010-04-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Verkeer en Waterstaat van 6 oktober 2003, nr. HDJZ/AWW/2003-1880,
    Hoofddirectie Juridische Zaken;

    Gelet op de artikelen 1, onderdeel j, 49, 50, 51 en 52 van de Spoorwegwet;

    De Raad van State gehoord (advies van 6 januari 2004, nr. W09.03.0427/V);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 29 november 2004, nr. HDJZ/AWW/2004-2917,
    Hoofddirectie Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel1
  - number: 1.a
    text: |-
      wet: [Spoorwegwet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0015007
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0015007
  - number: 1.b
    text: 'machinist: bestuurder van een spoorvoertuig op een hoofdspoorweg;'
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel1
  - number: 1.c
    text: |-
      hoofdspoorwegverkeerssysteem: het verkeerssysteem van de krachtens [artikel 2, eerste lid, van de wet][ref1] als
      zodanig aangewezen hoofdspoorwegen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel2
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '2'
  - number: '2'
    text: |-
      Als veiligheidsfuncties binnen het hoofdspoorwegverkeerssysteem, andere dan de functie van machinist, worden
      aangewezen de functies van:
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel2
  - number: 2.a
    text: rangeerder;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel2
  - number: 2.b
    text: wagencontroleur;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel2
  - number: 2.c
    text: treindienstleider;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel2
  - number: 2.d
    text: werktreinbegeleider.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel2
  - number: '3.1'
    text: 'Binnen de veiligheidsfunctie van machinist worden de volgende gradaties onderscheiden:'
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel3
  - number: 3.1.a
    text: machinist met volledige bevoegdheid;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel3
  - number: 3.1.b
    text: machinist met beperkte bevoegdheid;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel3
  - number: 3.1.c
    text: machinist met minimale bevoegdheid;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel3
  - number: 3.1.d
    text: gereedschapsmachinist.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel3
  - number: '3.2'
    text: 'Binnen de veiligheidsfunctie van rangeerder worden de volgende gradaties onderscheiden:'
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel3
  - number: 3.2.a
    text: rangeerder met volledige bevoegdheid;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel3
  - number: 3.2.b
    text: rangeerder met minimale bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel3
  - number: '3.3'
    text: 'Binnen de veiligheidsfunctie van treindienstleider worden de volgende gradaties onderscheiden:'
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel3
  - number: 3.3.a
    text: treindienstleider met volledige bevoegdheid;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel3
  - number: 3.3.b
    text: treindienstleider met minimale bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel3
  - number: '4.1'
    text: |-
      De machinist met volledige bevoegdheid heeft als taak het besturen, rangeren en begeleiden van spoorvoertuigen
      zonder beperkingen aan snelheid en afstand.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel4
  - number: '4.2'
    text: |-
      De machinist met beperkte bevoegdheid heeft als taak het besturen, rangeren en begeleiden van spoorvoertuigen, met
      een maximumsnelheid van 40 km per uur en binnen een straal van 25 km vanaf het vertrekpunt van zijn rit.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel4
  - number: '4.3'
    text: |-
      De machinist met minimale bevoegdheid heeft als taak het besturen, rangeren en begeleiden van spoorvoertuigen,
      met een maximumsnelheid van 40 km per uur op emplacementen of gedeelten daarvan, die niet zijn voorzien van een
      technische beveiliging of waar die beveiliging voorkomt dat ander treinverkeer van en naar de betrokken sporen
      plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel4
  - number: '4.4'
    text: |-
      De gereedschapsmachinist heeft als taak het besturen van als gereedschap dienende spoorvoertuigen tijdens het
      gebruik daarvan bij werkzaamheden aan, in of nabij de spoorweginfrastructuur op sporen die buiten dienst zijn
      gesteld als bedoeld in [artikel 64 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel64
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '64'
  - number: '5.1'
    text: |-
      De rangeerder met volledige bevoegdheid heeft als taak het samenstellen van treinen en het zonder beperkingen
      begeleiden van spoorvoertuigen op emplacementen.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel5
  - number: '5.2'
    text: |-
      De rangeerder met minimale bevoegdheid heeft als taak het samenstellen van treinen en het begeleiden van
      spoorvoertuigen op emplacementen of gedeelten daarvan, die niet zijn voorzien van een technische beveiliging of
      waar die beveiliging voorkomt dat ander treinverkeer van en naar de betrokken sporen plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel5
  - number: '6'
    text: |-
      De wagencontroleur heeft als taak het controleren van goederenwagens en het controleren van de belading daarvan op
      kenbare gebreken.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel6
  - number: '7.1'
    text: 'De treindienstleider met volledige bevoegdheid heeft als taak:'
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel7
  - number: 7.1.a
    text: het ter beschikking stellen van veilige rijwegen;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel7
  - number: 7.1.b
    text: |-
      het treffen van veiligheidsmaatregelen bij storingen en bij werkzaamheden aan, in of nabij de
      spoorweginfrastructuur, waaronder tevens begrepen het geven van aanwijzingen met betrekking tot een veilig en
      ongestoord gebruik van de spoorweg.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel7
  - number: '7.2'
    text: 'De treindienstleider met minimale bevoegdheid heeft als taak:'
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel7
  - number: 7.2.a
    text: |-
      het ter beschikking stellen van veilige rijwegen op emplacementen of gedeelten daarvan, die niet zijn voorzien van
      een technische beveiliging;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel7
  - number: 7.2.b
    text: |-
      het treffen van veiligheidsmaatregelen bij storingen en bij werkzaamheden aan, in of nabij de
      spoorweginfrastructuur, waaronder tevens begrepen het geven van aanwijzingen met betrekking tot een veilig
      en ongestoord gebruik van de spoorweg, op emplacementen of gedeelten daarvan, die niet zijn voorzien van een
      technische beveiliging.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel7
  - number: '10'
    text: |-
      De werktreinbegeleider heeft als taak het begeleiden van spoorvoertuigen ten behoeve van werkzaamheden aan,
      in of nabij de spoorweginfrastructuur naar, op en van sporen die buiten dienst zijn gesteld als bedoeld in
      [artikel 64 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel64
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '64'
  - number: '11.1'
    text: |-
      Personen die bevoegd zijn tot uitoefening van de veiligheidsfunctie van machinist met volledige of beperkte
      bevoegdheid zijn tevens bevoegd tot uitoefening van de veiligheidsfunctie van rangeerder.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel11
  - number: '11.2'
    text: |-
      Personen die bevoegd zijn tot uitoefening van de veiligheidsfunctie van machinist met minimale bevoegdheid zijn
      tevens bevoegd tot uitoefening van de veiligheidsfunctie van rangeerder met minimale bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel11
  - number: '11.3'
    text: |-
      Personen aan wie na 31 december 2005 de bevoegdheid tot uitoefening van de veiligheidsfunctie van
      werktreinbegeleider wordt toegekend, zijn tevens bevoegd tot uitoefening van de veiligheidsfunctie van rangeerder.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel11
  - number: '11.4'
    text: |-
      Het eerste tot en met het derde lid geldt niet voor personen, in dienst van een in het buitenland gevestigde
      spoorwegonderneming, die hun standplaats hebben in het buitenland, indien in het land van hun standplaats niet is
      voorzien in de afleiding van bevoegdheden zoals in die leden bedoeld.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel11
  - number: '12.1'
    text: Veiligheidsfuncties worden slechts uitgeoefend door personen die de leeftijd van achttien jaar hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel12
  - number: '12.2'
    text: |-
      In afwijking van het eerste lid wordt de veiligheidsfunctie van machinist met volledige bevoegdheid slechts
      uitgeoefend door een persoon die de leeftijd van eenentwintig jaar heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel12
  - number: '13.1'
    text: |-
      Personen die een veiligheidsfunctie uitoefenen beheersen de Nederlandse taal zodanig dat zij de voor de uitoefening
      van de betrokken functie gebruikelijke procescommunicatie kunnen voeren en begrijpen.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel13
  - number: '13.2'
    text: Het eerste lid geldt niet voor personen die de veiligheidsfunctie van gereedschapsmachinist uitoefenen.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel13
  - number: '14.1'
    text: |-
      Machinisten voldoen aan door het exameninstituut bedoeld in [artikel 20, vierde lid][ref1], vastgestelde en door
      Onze Minister goedgekeurde eisen, die ten minste betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel20
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0017625
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
  - number: 14.1.a
    text: algemene kennis van de inrichting en terminologie van het spoorwegsysteem en van de spoorweginfrastructuur;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel14
  - number: 14.1.b
    text: kennis van tractievormen en voertuigtypen en de bediening daarvan;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel14
  - number: 14.1.c
    text: kennis van seinen, seinstelsels en beveiligingssystemen;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel14
  - number: 14.1.d
    text: kennis van regels en procedures voor het uitvoeren en begeleiden van bewegingen met spoorvoertuigen;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel14
  - number: 14.1.e
    text: kennis van bijzondere situaties en noodprocedures;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel14
  - number: 14.1.f
    text: |-
      bedrevenheid in de bediening van spoorvoertuigen, daaronder begrepen het rijden met spoorvoertuigen en de
      juiste toepassing van de daarbij behorende operationele controles en procedures, communicatie en regels voor het
      verkeersgedrag.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel14
  - number: '14.2'
    text: |-
      Het eerste lid geldt niet voor machinisten, in dienst van een in het buitenland gevestigde spoorwegonderneming,
      die hun standplaats hebben in het buitenland en die slechts dienst doen op het traject tussen de rijksgrens en
      een nabij die grens gelegen, door Onze Minister aangewezen, station, mits zij voldoen aan de in het land van hun
      standplaats geldende eisen betreffende de voor uitoefening van hun functie vereiste kennis en bekwaamheid.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel14
  - number: '15.1'
    text: |-
      Rangeerders en werktreinbegeleiders voldoen aan de door het exameninstituut bedoeld in
      [artikel 20, vierde lid][ref1], vastgestelde en door Onze Minister goedgekeurde eisen, die ten minste betrekking
      hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel20
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0017625
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
  - number: 15.1.a
    text: |-
      algemene kennis van de inrichting en terminologie van het spoorwegsysteem, van de spoorweginfrastructuur en van
      spoorvoertuigen;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel15
  - number: 15.1.b
    text: kennis van seinen, seinstelsels en beveiligingssystemen;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel15
  - number: 15.1.c
    text: |-
      kennis van regels en procedures voor het uitvoeren en begeleiden van bewegingen met spoorvoertuigen en het
      samenstellen van treinen, alsmede van maatregelen noodzakelijk voor de eigen veiligheid;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel15
  - number: 15.1.d
    text: kennis van bijzondere situaties en noodprocedures;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel15
  - number: 15.1.e
    text: |-
      bedrevenheid in het begeleiden van bewegingen van spoorvoertuigen, het daarbij in acht nemen van de eigen
      veiligheid en het op juiste wijze communiceren met de machinist en met de treindienstleider.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel15
  - number: '15.2'
    text: |-
      Het eerste lid geldt niet voor rangeerders en werktreinbegeleiders, in dienst van een in het buitenland gevestigde
      spoorwegonderneming, die hun standplaats hebben in het buitenland en die slechts dienst doen op het traject tussen
      de rijksgrens en een nabij die grens gelegen, door Onze Minister aangewezen, station, mits zij voldoen aan de in
      het land van hun standplaats geldende eisen betreffende de voor uitoefening van hun functie vereiste kennis en
      bekwaamheid.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel15
  - number: '16.1'
    text: |-
      Wagencontroleurs voldoen aan de door het exameninstituut bedoeld in [artikel 20, vierde lid][ref1], vastgestelde en
      door Onze Minister goedgekeurde eisen, die ten minste betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel20
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0017625
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
  - number: 16.1.a
    text: algemene kennis van de inrichting en terminologie van het spoorwegsysteem en van spoorvoertuigen;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel16
  - number: 16.1.b
    text: kennis van bij goederenwagens toegepaste bedieningssystemen alsmede kennis omtrent treinsamenstellingen;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel16
  - number: 16.1.c
    text: kennis van regels en procedures inzake de belading van goederenwagens;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel16
  - number: 16.1.d
    text: |-
      kennis van regels en procedures voor het vaststellen van gebreken bij voertuigonderdelen, bedieningssystemen en
      belading;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel16
  - number: 16.1.e
    text: |-
      bedrevenheid in het uitvoeren van wagencontroles en remproeven, het benoemen en in de juiste stand zetten van
      bedieningssystemen, het benoemen van controlepunten en het toepassen van controlecriteria bij goederenwagens en
      lading.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel16
  - number: '16.2'
    text: |-
      Het eerste lid geldt niet voor wagencontroleurs, in dienst van een in het buitenland gevestigde
      spoorwegonderneming, die hun standplaats hebben in het buitenland, mits zij voldoen aan de in het land van hun
      standplaats geldende eisen betreffende de voor uitoefening van hun functie vereiste kennis en bekwaamheid.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel16
  - number: '17'
    text: |-
      Treindienstleiders voldoen aan de door het exameninstituut bedoeld in [artikel 20, vierde lid][ref1], vastgestelde
      en door Onze Minister goedgekeurde eisen, die ten minste betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel20
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0017625
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
  - number: 17.a
    text: |-
      algemene kennis van de inrichting en terminologie van het spoorwegsysteem, van de spoorweginfrastructuur en van
      spoorvoertuigen;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel17
  - number: 17.b
    text: kennis van seinen, seinstelsels, beveiligingssystemen en andere spoorweginfrastructuursystemen;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel17
  - number: 17.c
    text: |-
      kennis van regels, documenten en procedures voor de operationele sturing van het spoorverkeer en voor werkzaamheden
      aan, in of nabij de spoorweginfrastructuur;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel17
  - number: 17.d
    text: kennis van de handelwijzen bij bijzondere situaties, storingen en calamiteiten;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel17
  - number: 17.e
    text: |-
      bedrevenheid in de operationele sturing en beheersing van het spoorverkeer, daaronder begrepen het verkeer bij
      werkzaamheden aan, in of nabij de spoorweginfrastructuur en bij bijzondere situaties, en de juiste toepassing van
      de daarvoor geldende regels, documenten, procedures en communicatie.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel17
  - number: '20.1'
    text: |-
      Personen die een veiligheidsfunctie uitoefenen tonen bij een onderzoek aan dat zij voldoen aan de bij en krachtens
      dit besluit voor de uitoefening van de betrokken veiligheidsfunctie vastgestelde eisen inzake algemene kennis en
      bekwaamheid.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel20
  - number: '20.2'
    text: Het onderzoek omvat een theoriegedeelte en een praktijkgedeelte.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel20
  - number: '20.3'
    text: |-
      In afwijking van het tweede lid omvat het onderzoek van machinisten en rangeerders, in dienst van een in
      het buitenland gevestigde spoorwegonderneming, die hun standplaats in het buitenland hebben en die dienst
      doen op een traject voorbij een station als bedoeld in [artikel 14, tweede lid][ref1], onderscheidenlijk
      [artikel 15, tweede lid][ref2], slechts een theoriegedeelte.


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0017625#Artikel15
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0017625
        artikel: '14'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017625
        artikel: '15'
        hoofdstuk: II
        paragraaf: '1'
  - number: '20.4'
    text: |-
      Het onderzoek wordt verricht door een door Onze Minister aangewezen exameninstituut dat beschikt over de voor de
      examinering van personeel met een veiligheidsfunctie vereiste onafhankelijke organisatie en expertise.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel20
  - number: '20.5'
    text: |-
      In afwijking van het vierde lid wordt het onderzoek van machinisten met minimale bevoegdheid en rangeerders met
      minimale bevoegdheid verricht door een vakinhoudelijk leidinggevende als bedoeld in [artikel 38, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel38
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0017625
        artikel: '38'
        hoofdstuk: V
  - number: '20.6'
    text: |-
      Het onderzoek vindt plaats volgens een door het exameninstituut vastgesteld en door Onze Minister goedgekeurd
      examenreglement.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel20
  - number: '21.1'
    text: |-
      Tot het praktijkgedeelte van het onderzoek van machinisten met volledige of beperkte bevoegdheid worden slechts
      toegelaten personen die beschikken over een praktijkervaring van ten minste veertig dagen, opgedaan tijdens een
      praktijkprogramma waarvan inhoud en uitvoering voldoen aan de bij ministeriële regeling vastgestelde regels.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel21
  - number: '21.2'
    text: |-
      De duur van de praktijkervaring, bedoeld in het eerste lid, mag worden verkort tot twintig dagen, indien
      wordt voldaan aan de bij ministeriële regeling vastgestelde voorwaarden met betrekking tot materieeltype,
      treinsamenstelling, traject en rijsnelheid.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel21
  - number: '21.3'
    text: |-
      Aan het praktijkprogramma, bedoeld in het eerste lid, mag slechts worden deelgenomen door personen die de in
      [artikel 12][ref1] voor de uitoefening van de betrokken veiligheidsfunctie genoemde minimumleeftijd hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel12
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0017625
        artikel: '12'
        hoofdstuk: I
  - number: '22'
    text: |-
      Een certificaat van bekwaamheid wordt door een door Onze Minister aangewezen exameninstituut afgegeven aan degene
      die bij het onderzoek, bedoeld in [artikel 20, eerste lid][ref1], blijkt te voldoen aan de bij en krachtens dit
      besluit vastgestelde eisen inzake kennis en bekwaamheid.


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel20
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0017625
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
  - number: '23'
    text: 'Het certificaat van bekwaamheid bevat ten minste de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel23
  - number: 23.a
    text: naam van het exameninstituut;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel23
  - number: 23.b
    text: datum van het examen;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel23
  - number: 23.c
    text: naam en geboortedatum van de geëxamineerde;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel23
  - number: 23.d
    text: |-
      veiligheidsfunctie en, indien van toepassing, de daarbij behorende gradatie, waarop het certificaat van bekwaamheid
      betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel23
  - number: '24.1'
    text: |-
      Onverminderd de [artikelen 14 tot en met 19][ref1] beschikken personen die een veiligheidsfunctie uitoefenen over
      de voor de betrokken functie vereiste specifieke, taakgebonden en bedrijfsgebonden kennis en bekwaamheid, bedoeld
      in [artikel 51, eerste lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel51
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0017625
        artikel: '14'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '51'
  - number: '24.2'
    text: 'De in het eerste lid bedoelde kennis en bekwaamheid betreft:'
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel24
  - number: 24.2.a
    text: |-
      voor de uitoefening van de functie van machinist: - wegbekendheid met het traject of de trajecten waarop hij als
      machinist wordt ingezet;
        - kennis van lokale voorschriften;
        - kennis van werking en bediening van de voertuigen waarop hij als machinist wordt ingezet;
        - kennis van de bedrijfsorganisatie en van het veiligheidszorgsysteem van de spoorwegonderneming;
        - kennis van de Handleiding Bestuurder, van de Materieelgids Bestuurder en van de communicatievoorschriften,
      bedoeld in paragraaf 4.1.2.1.1, onderscheidenlijk paragraaf 4.1.2.1.3, onderscheidenlijk bijlage A van de bijlage
      van Beschikking nr. 2002/734/EG van de Commissie van de Europese Gemeenschappen van 30 mei 2002 betreffende
      de technische specificatie inzake interoperabiliteit van het subsysteem exploitatie van het trans-Europees
      hogesnelheidsspoorwegsysteem overeenkomstig artikel 6, lid 1, van [richtlijn 96/48/EG](31996L0048) (PbEG L 245);
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel24
  - number: 24.2.b
    text: |-
      voor de uitoefening van de functie van rangeerder: - wegbekendheid op de locatie waarop hij als rangeerder wordt
      ingezet;
        - kennis van lokale voorschriften;
        - kennis van de voertuigen die hij begeleidt;
        - kennis van de bedrijfsorganisatie en van het veiligheidszorgsysteem van de spoorwegonderneming;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel24
  - number: 24.2.c
    text: |-
      voor de uitoefening van de functie van wagencontroleur: - kennis van wagentypen en ladingen die hij controleert;
        - kennis van de bedrijfsorganisatie en van het veiligheidszorgsysteem van de spoorwegonderneming;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel24
  - number: 24.2.d
    text: |-
      voor de uitoefening van de functie van treindienstleider: - kennis van de inrichting van de gedeelten van het
      spoorwegnet waarvoor hij als treindienstleider dienst doet;
        - kennis van lokale voorschriften;
        - kennis van de bedrijfsorganisatie;
        - kennis van bijlage A van de Bijlage van Beschikking nr. 2002/734/EG van de Commissie van de Europese
      Gemeenschappen van 30 mei 2002 betreffende de technische specificatie inzake interoperabiliteit van het subsysteem
      exploitatie van het trans-Europees hogesnelheidsspoorwegsysteem overeenkomstig artikel 6, lid 1, van [richtlijn
      96/48/EG](31996L0048) (PbEG L 245) en de daarin gespecificeerde berichten, indien het personen betreft die deze
      functie vervullen in het trans-Europees hogesnelheidsspoorwegsysteem;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel24
  - number: 24.2.e
    text: |-
      voor de uitoefening van de functie van werktreinbegeleider: - wegbekendheid op de locatie waarop hij als
      werktreinbegeleider wordt ingezet;
        - kennis van de toegepaste werkplekbeveiligingssystemen;
        - kennis van de werktreinen die hij begeleidt;
        - kennis van de bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel24
  - number: '24.3'
    text: 'In afwijking van het tweede lid, onderdeel a, kan:'
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel24
  - number: 24.3.a
    text: |-
      in de wegbekendheid en de kennis van lokale voorschriften worden voorzien door een andere machinist, een rangeerder
      of een werktreinbegeleider, die de machinist begeleidt en hem de voor zijn taak benodigde informatie verschaft;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel24
  - number: 24.3.b
    text: |-
      een voertuig worden bediend door een andere persoon die beschikt over kennis van werking en bediening
      van het betrokken voertuig, indien de machinist direct kan ingrijpen in de bediening en hij alle nodige
      bedieningsopdrachten geeft aan die andere persoon.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel24
  - number: '25'
    text: |-
      De beoordeling van de voor de uitoefening van de betrokken veiligheidsfunctie vereiste specifieke, taakgebonden
      en bedrijfsgebonden kennis en bekwaamheid geschiedt door een vakinhoudelijk leidinggevende als bedoeld in
      [artikel 38, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel38
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0017625
        artikel: '38'
        hoofdstuk: V
  - number: '26.1'
    text: |-
      Personen die een veiligheidsfunctie uitoefenen voldoen aan de bij ministeriële regeling voor de betrokken functie
      vastgestelde eisen betreffende:
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel26
  - number: 26.1.a
    text: gezichtsvermogen;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel26
  - number: 26.1.b
    text: gehoorvermogen;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel26
  - number: 26.1.c
    text: vermogen tot reageren en handelen;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel26
  - number: 26.1.d
    text: geestesvermogens, in het bijzonder het beoordelingsvermogen;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel26
  - number: 26.1.e
    text: |-
      gebruik van stoffen die het gezichtsvermogen, het vermogen tot reageren en handelen en het beoordelingsvermogen
      kunnen beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel26
  - number: '26.2'
    text: 'Het eerste lid geldt niet voor:'
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel26
  - number: 26.2.a
    text: machinisten met minimale bevoegdheid en rangeerders met minimale bevoegdheid;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel26
  - number: 26.2.b
    text: wagencontroleurs;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel26
  - number: 26.2.c
    text: |-
      machinisten en rangeerders, in dienst van een in het buitenland gevestigde spoorwegonderneming, die hun standplaats
      hebben in het buitenland, mits zij voldoen aan de in het land van hun standplaats geldende eisen betreffende de
      voor uitoefening van hun functie vereiste medische geschiktheid;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel26
  - number: 26.2.d
    text: |-
      werktreinbegeleiders, die hun functie hoofdzakelijk in het buitenland uitoefenen, wanneer zij incidenteel hun
      functie in Nederland uitoefenen en mits zij voldoen aan de in het buitenland geldende eisen betreffende de voor de
      uitoefening van hun functie vereiste medische geschiktheid.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel26
  - number: '27.1'
    text: |-
      Personen die een veiligheidsfunctie uitoefenen voldoen aan de bij ministeriële regeling voor de betrokken functie
      vastgestelde eisen betreffende:
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel27
  - number: 27.1.a
    text: algemeen verstandelijk vermogen;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel27
  - number: 27.1.b
    text: voorstellingsvermogen;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel27
  - number: 27.1.c
    text: zelfstandigheid en verantwoordelijkheid;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel27
  - number: 27.1.d
    text: reactievermogen, concentratie en aandacht;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel27
  - number: 27.1.e
    text: emotionele stabiliteit;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel27
  - number: 27.1.f
    text: specifieke, aan de werksituatie gebonden aspecten.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel27
  - number: '27.2'
    text: 'Het eerste lid geldt niet voor:'
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel27
  - number: 27.2.a
    text: machinisten met minimale bevoegdheid en rangeerders met minimale bevoegdheid;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel27
  - number: 27.2.b
    text: wagencontroleurs;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel27
  - number: 27.2.c
    text: |-
      machinisten en rangeerders, in dienst van een in het buitenland gevestigde spoorwegonderneming, die hun standplaats
      hebben in het buitenland, mits zij voldoen aan de in het land van hun standplaats geldende eisen betreffende de
      voor uitoefening van hun functie vereiste psychologische geschiktheid;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel27
  - number: 27.2.d
    text: |-
      werktreinbegeleiders, die hun functie hoofdzakelijk in het buitenland uitoefenen, wanneer zij incidenteel hun
      functie in Nederland uitoefenen en mits zij voldoen aan de in het buitenland geldende eisen betreffende de voor de
      uitoefening van hun functie vereiste psychologische geschiktheid.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel27
  - number: '28.1'
    text: |-
      Personen die een veiligheidsfunctie uitoefenen waarvoor bij of krachtens dit besluit eisen met betrekking tot
      de medische en psychologische geschiktheid zijn vastgesteld, onderwerpen zich aan een medische keuring en een
      psychologische keuring.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel28
  - number: '28.2'
    text: |-
      De keuringen worden verricht door een door Onze Minister aangewezen keuringsinstituut dat beschikt over de voor de
      keuring van personeel met een veiligheidsfunctie vereiste onafhankelijke organisatie en expertise.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel28
  - number: '28.3'
    text: |-
      De keuringen vinden plaats volgens een door het keuringsinstituut vastgesteld en door Onze Minister goedgekeurd
      keuringsreglement.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel28
  - number: '28.4'
    text: |-
      Het keuringsreglement voorziet in ieder geval in de mogelijkheid tot aanvraag van een herkeuring bij bezwaar tegen
      de uitslag van de keuring in eerste aanleg.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel28
  - number: '29.1'
    text: |-
      Een verklaring van medische geschiktheid wordt door het keuringsinstituut afgegeven aan degene die bij een keuring
      blijkt te voldoen aan de voor de betrokken functie vastgestelde eisen met betrekking tot de medische geschiktheid.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel29
  - number: '29.2'
    text: |-
      Een verklaring van psychologische geschiktheid wordt door het keuringsinstituut afgegeven aan degene die bij een
      keuring blijkt te voldoen aan de voor de betrokken functie vastgestelde eisen met betrekking tot de psychologische
      geschiktheid.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel29
  - number: '29.3'
    text: |-
      Indien het keuringsinstituut van oordeel is dat een keurling slechts onder beperkingen of voorwaarden medisch
      dan wel psychologisch geschikt kan worden geacht om de veiligheidsfunctie waarop de keuring betrekking heeft, op
      verantwoorde wijze uit te oefenen, geeft het een medische of psychologische verklaring af waarin die beperkingen of
      voorwaarden zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel29
  - number: '30'
    text: |-
      De verklaring van medische geschiktheid en de verklaring van psychologische geschiktheid bevatten ten minste de
      volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel30
  - number: 30.a
    text: naam van het keuringsinstituut;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel30
  - number: 30.b
    text: keuringsdatum;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel30
  - number: 30.c
    text: naam en geboortedatum van de keurling;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel30
  - number: 30.d
    text: |-
      veiligheidsfunctie en, indien van toepassing, de daarbij behorende gradatie, waarvoor de keuring heeft
      plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel30
  - number: 30.e
    text: termijn waarvoor de keurling geschikt is bevonden;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel30
  - number: 30.f
    text: |-
      eventuele beperkingen of voorwaarden ten aanzien van de geschiktheid, bedoeld in [artikel 29, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel29
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0017625
        artikel: '29'
        hoofdstuk: III
  - number: '31.1'
    text: |-
      Een verklaring van medische geschiktheid, afgegeven aan een machinist met volledige of beperkte bevoegdheid of aan
      een veiligheidsman, die de leeftijd van:
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel31
  - number: 31.1.a
    text: veertig jaar nog niet heeft bereikt, is geldig voor de duur van vijf jaar, gerekend vanaf de dag van afgifte;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel31
  - number: 31.1.b
    text: |-
      veertig jaar doch nog niet die van vijftig jaar heeft bereikt, is geldig voor de duur van vier jaar, gerekend vanaf
      de dag van afgifte;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel31
  - number: 31.1.c
    text: vijftig jaar heeft bereikt, is geldig voor de duur van twee jaar, gerekend vanaf de dag van afgifte.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel31
  - number: '31.2'
    text: |-
      Een verklaring van medische geschiktheid, afgegeven aan een gereedschapsmachinist of aan een persoon die een der in
      [artikel 2, onderdelen a, c, d en f,][ref1] genoemde veiligheidsfuncties uitoefent, is geldig voor de duur van vijf
      jaar, gerekend vanaf de dag van afgifte.


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel2
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0017625
        artikel: '2'
        hoofdstuk: I
  - number: '31.3'
    text: |-
      Een verklaring van medische geschiktheid verliest haar geldigheid indien bij een tussentijds medisch
      onderzoek blijkt dat de betrokkene niet of niet langer beschikt over de voor de uitoefening van de betrokken
      veiligheidsfunctie vereiste medische geschiktheid.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel31
  - number: '31.4'
    text: |-
      Een tussentijds medisch onderzoek als bedoeld in het derde lid vindt plaats indien bij de organisatie waar de
      betrokkene werkzaam is, het vermoeden bestaat dat de betrokkene niet langer beschikt over de voor uitoefening van
      de betrokken veiligheidsfunctie vereiste medische geschiktheid.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel31
  - number: '32.1'
    text: |-
      Een verklaring van psychologische geschiktheid, afgegeven aan een machinist met volledige of beperkte bevoegdheid,
      is geldig voor de duur van vijf jaar, gerekend vanaf de dag van afgifte.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel32
  - number: '32.2'
    text: |-
      Een verklaring van psychologische geschiktheid, afgegeven aan een gereedschapsmachinist of aan een persoon die
      een der in [artikel 2, onderdelen a, c, d en f][ref1], genoemde veiligheidsfuncties uitoefent, is geldig voor
      onbepaalde tijd.


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel2
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0017625
        artikel: '2'
        hoofdstuk: I
  - number: '32.3'
    text: |-
      Een verklaring van psychologische geschiktheid verliest haar geldigheid indien bij een tussentijds psychologisch
      onderzoek blijkt dat de betrokkene niet of niet langer beschikt over de voor uitoefening van de betrokken
      veiligheidsfunctie vereiste psychologische geschiktheid.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel32
  - number: '32.4'
    text: |-
      Een tussentijds psychologisch onderzoek als bedoeld in het derde lid vindt plaats indien bij de arts die een
      medische keuring verricht, het vermoeden bestaat dat betrokkene niet of niet langer beschikt over de voor
      uitoefening van de betrokken veiligheidsfunctie vereiste psychologische geschiktheid.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel32
  - number: '33'
    text: 'Het bezit van een geldige bedrijfspas is niet vereist voor:'
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel33
  - number: 33.a
    text: |-
      machinisten, rangeerders, wagencontroleurs en werktreinbegeleiders, in dienst van een in het buitenland gevestigde
      spoorwegonderneming, die hun standplaats hebben in het buitenland en die slechts dienst doen op het traject tussen
      de rijksgrens en een nabij die grens gelegen station, mits zij voldoen aan de in het land van hun standplaats
      geldende eisen betreffende de voor uitoefening van hun functie vereiste bevoegdheid;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel33
  - number: 33.b
    text: treindienstleiders met volledige bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel33
  - number: '34'
    text: 'De bedrijfspas bevat ten minste de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel34
  - number: 34.a
    text: naam en geboortedatum van de houder;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel34
  - number: 34.b
    text: |-
      aanduiding van de veiligheidsfunctie of veiligheidsfuncties en, indien van toepassing, de daarbij behorende
      gradatie waarop de bedrijfspas betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel34
  - number: 34.c
    text: datum van afgifte;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel34
  - number: 34.d
    text: geldigheidsduur;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel34
  - number: 34.e
    text: |-
      eventuele beperkingen of voorwaarden ten aanzien van de geschiktheid, bedoeld in [artikel 29, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel29
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0017625
        artikel: '29'
        hoofdstuk: III
  - number: 34.f
    text: naam van degene onder wiens gezag de veiligheidsfunctie waarvoor de bedrijfspas is afgegeven, wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel34
  - number: '35.1'
    text: Een bedrijfspas is geldig voor de duur van vijf jaar, gerekend vanaf de dag van afgifte.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel35
  - number: '35.2'
    text: 'Een bedrijfspas verliest zijn geldigheid:'
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel35
  - number: 35.2.a
    text: door het verstrijken van de geldigheidsduur;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel35
  - number: 35.2.b
    text: |-
      gedurende de tijd dat de houder niet beschikt over een geldige verklaring van medische geschiktheid en een geldige
      verklaring van psychologische geschiktheid;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel35
  - number: 35.2.c
    text: |-
      bij wijziging van de op de bedrijfspas vermelde gegevens, bedoeld in [artikel 34, onderdelen b, e en f][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel34
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0017625
        artikel: '34'
        hoofdstuk: IV
  - number: 35.2.d
    text: |-
      gedurende de tijd dat aan de houder de bevoegdheid tot het uitoefenen van zijn functie bij rechterlijke uitspraak
      is ontzegd.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel35
  - number: '36'
    text: |-
      In de gevallen, bedoeld in [artikel 35, tweede lid, onderdelen b, c en d][ref1], neemt degene die de bedrijfspas
      heeft afgegeven, de pas in.


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel35
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0017625
        artikel: '35'
        hoofdstuk: IV
  - number: '37.1'
    text: |-
      Onze Minister kan andere in verband met de uitoefening van veiligheidsfuncties afgegeven veiligheidsdocumenten
      gelijkstellen aan de bedrijfspas, mits die documenten ten minste de in [artikel 34][ref1] bedoelde gegevens
      bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel34
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0017625
        artikel: '34'
        hoofdstuk: IV
  - number: '37.2'
    text: |-
      Voor de toepassing van de [artikelen 33][ref1], [35][ref2] en [36][ref3] van dit besluit wordt onder een
      bedrijfspas mede verstaan een daaraan op grond van het eerste lid gelijkgesteld veiligheidsdocument.


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0017625#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0017625#Artikel36
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0017625
        artikel: '33'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0017625
        artikel: '35'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0017625
        artikel: '36'
        hoofdstuk: IV
  - number: '38.1'
    text: |-
      Degene onder wiens gezag een veiligheidsfunctie wordt uitgeoefend, draagt zorg voor vakinhoudelijke leiding over de
      persoon of personen door wie die functie wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel38
  - number: '38.2'
    text: |-
      Een vakinhoudelijk leidinggevende dient te beschikken over zodanige kennis van en inzicht in de uitoefening van de
      betrokken veiligheidsfunctie en zodanige kennis van de processen en de techniek binnen het spoorwegverkeerssysteem,
      dat hij personen die de betrokken veiligheidsfunctie uitoefenen kan instrueren, beoordelen en corrigeren ten
      aanzien van de goede uitoefening van die functie.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel38
  - number: '39.1'
    text: |-
      Degene onder wiens gezag een veiligheidsfunctie wordt uitgeoefend, draagt er zorg voor dat de persoon door wie die
      functie wordt uitgeoefend periodiek een herinstructie volgt ten aanzien van de juiste uitvoering van de functie.
      Onderdeel van de herinstructie is een beoordeling van de juiste uitvoering van de functie door een vakinhoudelijk
      leidinggevende.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel39
  - number: '39.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld betreffende de periodiciteit, de inhoud en de
      wijze van uitvoering van de herinstructie.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel39
  - number: '40'
    text: |-
      Degene onder wiens gezag een veiligheidsfunctie wordt uitgeoefend, niet zijnde een spoorwegonderneming
      die houder is van een veiligheidsattest, past een systeem van personeelsbeheer toe dat voldoet aan
      [artikel 33, tweede lid, onderdeel e, van de wet][ref1] en dat is goedgekeurd door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel33
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '33'
  - number: '41'
    text: |-
      Certificaten van bekwaamheid, verklaringen van medische geschiktheid en verklaringen van psychologische
      geschiktheid worden in tweevoud afgegeven. Een exemplaar is bestemd voor degene die de veiligheidsfunctie uitoefent
      of gaat uitoefenen, een exemplaar is bestemd voor degene onder wiens gezag betrokkene de veiligheidsfunctie
      uitoefent of gaat uitoefenen.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel41
  - number: '42.1'
    text: |-
      Onze Minister kan aan machinisten, rangeerders en wagencontroleurs ontheffing verlenen van het bepaalde bij en
      krachtens dit besluit:
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel42
  - number: 42.1.a
    text: |-
      in verband met het over beperkte afstand rijden over een spoorweg waarop dit besluit van toepassing is, in
      aansluiting op het rijden op een spoorweg waarop dit besluit niet van toepassing is;
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel42
  - number: 42.1.b
    text: |-
      indien zij beschikken over naar het oordeel van Onze Minister relevante ervaring die is opgedaan op een spoorweg
      waarop dit besluit niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel42
  - number: '42.2'
    text: |-
      Een ontheffing als bedoeld in het eerste lid kan onder beperkingen worden verleend. Aan een ontheffing kunnen
      voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel42
  - number: '44.1'
    text: |-
      De bevoegdheid tot het uitoefenen van een veiligheidsfunctie als bedoeld in dit besluit of van een daaraan gelijk
      te stellen veiligheidsfunctie, die voor het tijdstip van inwerkingtreding van dit besluit is toegekend door een
      spoorwegonderneming of door degene onder wiens gezag de betrokken veiligheidsfunctie wordt uitgeoefend, blijft
      onverminderd het derde lid van kracht voor de duur waarvoor zij is toegekend.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel44
  - number: '44.2'
    text: |-
      Voorzover de toekenning van een bevoegdheid als bedoeld in het eerste lid niet wordt gestaafd door de
      bevoegdhedenadministratie van degene onder wiens gezag de betrokken veiligheidsfunctie wordt uitgeoefend, neemt
      deze binnen vier maanden na de datum van inwerkingtreding van dit besluit een verklaring omtrent die bevoegdheid op
      in zijn bevoegdhedenadministratie.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel44
  - number: '44.3'
    text: |-
      Indien degene onder wiens gezag de betrokken veiligheidsfunctie wordt uitgeoefend, niet binnen vier maanden na
      inwerkingtreding van dit besluit heeft voldaan aan het tweede lid, vervalt de bevoegdheid tot het uitoefenen van de
      betrokken veiligheidsfunctie.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel44
  - number: '45'
    text: |-
      Met ingang van het tijdstip van inwerkingtreding van dit besluit worden certificaten van bekwaamheid, verklaringen
      van medische geschiktheid, verklaringen van psychologische geschiktheid en bedrijfspassen of daaraan gelijk te
      stellen documenten, die voor dat tijdstip zijn afgegeven, aangemerkt als certificaten van bekwaamheid, verklaringen
      van medische geschiktheid, verklaringen van psychologische geschiktheid en bedrijfspassen, die zijn afgegeven op
      basis van dit besluit.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel45
  - number: '46'
    text: |-
      Certificaten van bekwaamheid, verklaringen van medische geschiktheid, verklaringen van psychologische geschiktheid
      en bedrijfspassen of daaraan gelijk te stellen documenten, die voor het tijdstip van inwerkingtreding van dit
      besluit zijn afgegeven, behouden hun geldigheid voor de duur waarvoor zij zijn afgegeven.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel46
  - number: '47'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel47
  - number: '48'
    text: 'Dit besluit wordt aangehaald als: Besluit spoorwegpersoneel.'
    url: https://wetten.overheid.nl/BWBR0017625/2010-04-01#Artikel48
