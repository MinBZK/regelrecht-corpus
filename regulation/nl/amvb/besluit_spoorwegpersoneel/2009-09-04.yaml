preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van de Staatssecretaris van Verkeer en Waterstaat van 6 oktober 2003, nr. HDJZ/AWW/2003-1880,
    Hoofddirectie Juridische Zaken;


    Gelet op de artikelen 1, onderdeel j, 49, 50, 51 en 52 van de Spoorwegwet;


    De Raad van State gehoord (advies van 6 januari 2004, nr. W09.03.0427/V);


    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 29 november 2004, nr. HDJZ/AWW/2004-2917,
    Hoofddirectie Juridische Zaken;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van dit besluit wordt verstaan onder:

      a. wet: [Spoorwegwet][ref1];

      b. machinist: bestuurder van een spoorvoertuig op een hoofdspoorweg;

      c. hoofdspoorwegverkeerssysteem: het verkeerssysteem van de krachtens [artikel 2, eerste lid, van de wet][ref2] als
      zodanig aangewezen hoofdspoorwegen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel2
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0015007
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '2'
  - number: '2'
    text: >-
      Als veiligheidsfuncties binnen het hoofdspoorwegverkeerssysteem, andere dan de functie van machinist, worden
      aangewezen de functies van:


      a. rangeerder;


      b. wagencontroleur;


      c. treindienstleider;


      d. leider werkplekbeveiliging;


      e. veiligheidsman;


      f. werktreinbegeleider.
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel2
  - number: '3'
    text: >-
      1 Binnen de veiligheidsfunctie van machinist worden de volgende gradaties onderscheiden:


      a. machinist met volledige bevoegdheid;


      b. machinist met beperkte bevoegdheid;


      c. machinist met minimale bevoegdheid;


      d. gereedschapsmachinist.


      2 Binnen de veiligheidsfunctie van rangeerder worden de volgende gradaties onderscheiden:


      a. rangeerder met volledige bevoegdheid;


      b. rangeerder met minimale bevoegdheid.


      3 Binnen de veiligheidsfunctie van treindienstleider worden de volgende gradaties onderscheiden:


      a. treindienstleider met volledige bevoegdheid;


      b. treindienstleider met minimale bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel3
  - number: '4'
    text: |-
      1 De machinist met volledige bevoegdheid heeft als taak het besturen, rangeren en begeleiden van spoorvoertuigen
      zonder beperkingen aan snelheid en afstand.

      2 De machinist met beperkte bevoegdheid heeft als taak het besturen, rangeren en begeleiden van spoorvoertuigen,
      met een maximumsnelheid van 40 km per uur en binnen een straal van 25 km vanaf het vertrekpunt van zijn rit.

      3 De machinist met minimale bevoegdheid heeft als taak het besturen, rangeren en begeleiden van spoorvoertuigen,
      met een maximumsnelheid van 40 km per uur op emplacementen of gedeelten daarvan, die niet zijn voorzien van een
      technische beveiliging of waar die beveiliging voorkomt dat ander treinverkeer van en naar de betrokken sporen
      plaatsvindt.

      4 De gereedschapsmachinist heeft als taak het besturen van als gereedschap dienende spoorvoertuigen tijdens het
      gebruik daarvan bij werkzaamheden aan, in of nabij de spoorweginfrastructuur op sporen die buiten dienst zijn
      gesteld als bedoeld in [artikel 64 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel64
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '64'
  - number: '5'
    text: >-
      1 De rangeerder met volledige bevoegdheid heeft als taak het samenstellen van treinen en het zonder beperkingen
      begeleiden van spoorvoertuigen op emplacementen.


      2 De rangeerder met minimale bevoegdheid heeft als taak het samenstellen van treinen en het begeleiden van
      spoorvoertuigen op emplacementen of gedeelten daarvan, die niet zijn voorzien van een technische beveiliging of
      waar die beveiliging voorkomt dat ander treinverkeer van en naar de betrokken sporen plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel5
  - number: '6'
    text: >-
      De wagencontroleur heeft als taak het controleren van goederenwagens en het controleren van de belading daarvan op
      kenbare gebreken.
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel6
  - number: '7'
    text: >-
      1 De treindienstleider met volledige bevoegdheid heeft als taak:


      a. het ter beschikking stellen van veilige rijwegen;


      b. het treffen van veiligheidsmaatregelen bij storingen en bij werkzaamheden aan, in of nabij de
      spoorweginfrastructuur, waaronder tevens begrepen het geven van aanwijzingen met betrekking tot een veilig en
      ongestoord gebruik van de spoorweg.


      2 De treindienstleider met minimale bevoegdheid heeft als taak:


      a. het ter beschikking stellen van veilige rijwegen op emplacementen of gedeelten daarvan, die niet zijn voorzien
      van een technische beveiliging;


      b. het treffen van veiligheidsmaatregelen bij storingen en bij werkzaamheden aan, in of nabij de
      spoorweginfrastructuur, waaronder tevens begrepen het geven van aanwijzingen met betrekking tot een veilig
      en ongestoord gebruik van de spoorweg, op emplacementen of gedeelten daarvan, die niet zijn voorzien van een
      technische beveiliging.
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel7
  - number: '8'
    text: >-
      De leider werkplekbeveiliging heeft als taak:


      a. het zorgdragen, bij werkzaamheden aan, in of nabij de spoorweginfrastructuur, voor de veiligheid van de
      werkzaamheden ten opzichte van het spoorverkeer;


      b. het regelen van het rijden met spoorvoertuigen tijdens die werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel8
  - number: '9'
    text: >-
      De veiligheidsman heeft als taak:


      a. het waarschuwen, bij werkzaamheden aan, in of nabij de spoorweginfrastructuur, van de ter plaatse werkzame
      personen voor naderend spoorverkeer;


      b. het zorgdragen, bij werkzaamheden aan, in of nabij de spoorweginfrastructuur waarbij er geen verbinding behoeft
      te zijn met de treindienstleider, voor de veiligheid van de werkzaamheden ten opzichte van het spoorverkeer.
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel9
  - number: '10'
    text: |-
      De werktreinbegeleider heeft als taak het begeleiden van spoorvoertuigen ten behoeve van werkzaamheden aan,
      in of nabij de spoorweginfrastructuur naar, op en van sporen die buiten dienst zijn gesteld als bedoeld in
      [artikel 64 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel64
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '64'
  - number: '11'
    text: >-
      1 Personen die bevoegd zijn tot uitoefening van de veiligheidsfunctie van machinist met volledige of beperkte
      bevoegdheid zijn tevens bevoegd tot uitoefening van de veiligheidsfunctie van rangeerder.


      2 Personen die bevoegd zijn tot uitoefening van de veiligheidsfunctie van machinist met minimale bevoegdheid zijn
      tevens bevoegd tot uitoefening van de veiligheidsfunctie van rangeerder met minimale bevoegdheid.


      3 Personen aan wie na 31 december 2005 de bevoegdheid tot uitoefening van de veiligheidsfunctie van
      werktreinbegeleider wordt toegekend, zijn tevens bevoegd tot uitoefening van de veiligheidsfunctie van rangeerder.


      4 Het eerste tot en met het derde lid geldt niet voor personen, in dienst van een in het buitenland gevestigde
      spoorwegonderneming, die hun standplaats hebben in het buitenland, indien in het land van hun standplaats niet is
      voorzien in de afleiding van bevoegdheden zoals in die leden bedoeld.
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel11
  - number: '12'
    text: >-
      1 Veiligheidsfuncties worden slechts uitgeoefend door personen die de leeftijd van achttien jaar hebben bereikt.


      2 In afwijking van het eerste lid wordt de veiligheidsfunctie van machinist met volledige bevoegdheid slechts
      uitgeoefend door een persoon die de leeftijd van eenentwintig jaar heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel12
  - number: '13'
    text: >-
      1 Personen die een veiligheidsfunctie uitoefenen beheersen de Nederlandse taal zodanig dat zij de voor de
      uitoefening van de betrokken functie gebruikelijke procescommunicatie kunnen voeren en begrijpen.


      2 Het eerste lid geldt niet voor personen die de veiligheidsfunctie van gereedschapsmachinist en veiligheidsman
      uitoefenen.
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel13
  - number: '14'
    text: |-
      1 Machinisten voldoen aan door het exameninstituut bedoeld in [artikel 20, vierde lid][ref1], vastgestelde en door
      Onze Minister goedgekeurde eisen, die ten minste betrekking hebben op:

      a. algemene kennis van de inrichting en terminologie van het spoorwegsysteem en van de spoorweginfrastructuur;

      b. kennis van tractievormen en voertuigtypen en de bediening daarvan;

      c. kennis van seinen, seinstelsels en beveiligingssystemen;

      d. kennis van regels en procedures voor het uitvoeren en begeleiden van bewegingen met spoorvoertuigen;

      e. kennis van bijzondere situaties en noodprocedures;

      f. bedrevenheid in de bediening van spoorvoertuigen, daaronder begrepen het rijden met spoorvoertuigen en de
      juiste toepassing van de daarbij behorende operationele controles en procedures, communicatie en regels voor het
      verkeersgedrag.

      2 Het eerste lid geldt niet voor machinisten, in dienst van een in het buitenland gevestigde spoorwegonderneming,
      die hun standplaats hebben in het buitenland en die slechts dienst doen op het traject tussen de rijksgrens en
      een nabij die grens gelegen, door Onze Minister aangewezen, station, mits zij voldoen aan de in het land van hun
      standplaats geldende eisen betreffende de voor uitoefening van hun functie vereiste kennis en bekwaamheid.


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel20
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0017625
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
  - number: '15'
    text: |-
      1 Rangeerders en werktreinbegeleiders voldoen aan de door het exameninstituut bedoeld in
      [artikel 20, vierde lid][ref1], vastgestelde en door Onze Minister goedgekeurde eisen, die ten minste betrekking
      hebben op:

      a. algemene kennis van de inrichting en terminologie van het spoorwegsysteem, van de spoorweginfrastructuur en
      van spoorvoertuigen;

      b. kennis van seinen, seinstelsels en beveiligingssystemen;

      c. kennis van regels en procedures voor het uitvoeren en begeleiden van bewegingen met spoorvoertuigen en het
      samenstellen van treinen, alsmede van maatregelen noodzakelijk voor de eigen veiligheid;

      d. kennis van bijzondere situaties en noodprocedures;

      e. bedrevenheid in het begeleiden van bewegingen van spoorvoertuigen, het daarbij in acht nemen van de eigen
      veiligheid en het op juiste wijze communiceren met de machinist en met de treindienstleider.

      2 Het eerste lid geldt niet voor rangeerders en werktreinbegeleiders, in dienst van een in het buitenland
      gevestigde spoorwegonderneming, die hun standplaats hebben in het buitenland en die slechts dienst doen op het
      traject tussen de rijksgrens en een nabij die grens gelegen, door Onze Minister aangewezen, station, mits zij
      voldoen aan de in het land van hun standplaats geldende eisen betreffende de voor uitoefening van hun functie
      vereiste kennis en bekwaamheid.


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel20
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0017625
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
  - number: '16'
    text: |-
      1 Wagencontroleurs voldoen aan de door het exameninstituut bedoeld in [artikel 20, vierde lid][ref1], vastgestelde
      en door Onze Minister goedgekeurde eisen, die ten minste betrekking hebben op:

      a. algemene kennis van de inrichting en terminologie van het spoorwegsysteem en van spoorvoertuigen;

      b. kennis van bij goederenwagens toegepaste bedieningssystemen alsmede kennis omtrent treinsamenstellingen;

      c. kennis van regels en procedures inzake de belading van goederenwagens;

      d. kennis van regels en procedures voor het vaststellen van gebreken bij voertuigonderdelen, bedieningssystemen
      en belading;

      e. bedrevenheid in het uitvoeren van wagencontroles en remproeven, het benoemen en in de juiste stand zetten van
      bedieningssystemen, het benoemen van controlepunten en het toepassen van controlecriteria bij goederenwagens en
      lading.

      2 Het eerste lid geldt niet voor wagencontroleurs, in dienst van een in het buitenland gevestigde
      spoorwegonderneming, die hun standplaats hebben in het buitenland, mits zij voldoen aan de in het land van hun
      standplaats geldende eisen betreffende de voor uitoefening van hun functie vereiste kennis en bekwaamheid.


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel20
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0017625
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
  - number: '17'
    text: |-
      Treindienstleiders voldoen aan de door het exameninstituut bedoeld in [artikel 20, vierde lid][ref1], vastgestelde
      en door Onze Minister goedgekeurde eisen, die ten minste betrekking hebben op:

      a. algemene kennis van de inrichting en terminologie van het spoorwegsysteem, van de spoorweginfrastructuur en
      van spoorvoertuigen;

      b. kennis van seinen, seinstelsels, beveiligingssystemen en andere spoorweginfrastructuursystemen;

      c. kennis van regels, documenten en procedures voor de operationele sturing van het spoorverkeer en voor
      werkzaamheden aan, in of nabij de spoorweginfrastructuur;

      d. kennis van de handelwijzen bij bijzondere situaties, storingen en calamiteiten;

      e. bedrevenheid in de operationele sturing en beheersing van het spoorverkeer, daaronder begrepen het verkeer bij
      werkzaamheden aan, in of nabij de spoorweginfrastructuur en bij bijzondere situaties, en de juiste toepassing van
      de daarvoor geldende regels, documenten, procedures en communicatie.


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel20
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0017625
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
  - number: '18'
    text: |-
      Leiders werkplekbeveiliging voldoen aan de door het exameninstituut bedoeld in [artikel 20, vierde lid][ref1],
      vastgestelde en door Onze Minister goedgekeurde eisen, die ten minste betrekking hebben op:

      a. kennis van de organisatie van de voorbereiding en uitvoering van werkzaamheden aan, in of nabij de
      spoorweginfrastructuur;

      b. kennis van de regels, procedures, documenten, methoden en systemen ter verzekering van de veiligheid van
      het spoorverkeer en van ter plaatse werkzame personen bij de uitvoering van werkzaamheden aan, in of nabij de
      spoorweginfrastructuur;

      c. kennis van de eigenschappen van spoorvoertuigen en gereedschappen;

      d. kennis van spoorweginfrastructuurvoorzieningen en het omgaan daarmee bij bedoelde werkzaamheden;

      e. kennis van de regels voor het rijden met spoorvoertuigen op de plaats van die werkzaamheden;

      f. bedrevenheid in het instrueren van de ter plaatse werkzame personen over de veilige uitvoering van het werk, het
      toepassen van beveiligingsmethoden en beveiligingsmiddelen, het toepassen van procedures en communicatie voor de
      uitvoering van een werk, het beoordelen van de veiligheidssituatie tijdens een werk, het regelen van het rijden met
      spoorvoertuigen tijdens het werk en het optreden bij onveilige situaties.


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel20
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0017625
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
  - number: '19'
    text: |-
      Veiligheidslieden voldoen aan de door het exameninstituut bedoeld in [artikel 20, vierde lid][ref1], vastgestelde
      en door Onze Minister goedgekeurde eisen, die ten minste betrekking hebben op:

      a. kennis van de organisatie van de veiligheid bij de voorbereiding en uitvoering van werkzaamheden aan, in of
      nabij de spoorweginfrastructuur, waarbij ter plaatse werkzame personen moeten worden gewaarschuwd voor naderend
      spoorverkeer, alsmede van de desbetreffende voorwaarden en procedures;

      b. kennis van de organisatie van de veiligheid bij de voorbereiding en uitvoering van werkzaamheden aan, in of
      nabij de spoorweginfrastructuur, waarbij er geen verbinding behoeft te zijn met de treindienstleider en waarbij
      moet worden zorggedragen voor de veiligheid van de werkzaamheden ten opzichte van het spoorverkeer, alsmede van de
      desbetreffende voorwaarden en procedures;

      c. kennis van spoorweginfrastructuurvoorzienigen en van de wijze waarop daarmee moet worden omgegaan in de
      situaties bedoeld onder a en b;

      d. kennis van de middelen en methoden voor de waarneming van het naderen van spoorverkeer en voor het tijdig
      waarschuwen van de ter plaatse werkzame personen;

      e. bedrevenheid in het instrueren van de ter plaatse werkzame personen over de veilige uitvoering van het werk, het
      toepassen van beveiligingsmethoden en beveiligingsmiddelen, het toepassen van procedures en communicatie voor de
      uitvoering van een werk, het beoordelen van de veiligheidssituatie tijdens een werk en het optreden bij onveilige
      situaties;

      f. bedrevenheid in het beoordelen van een uitkijkplaats en een veilige wijkplaats, het beoordelen van de
      toereikendheid van de uitrusting en waarschuwingsmiddelen, het beoordelen van en reageren op naderend spoorverkeer
      en het waarschuwen van de ter plaatse werkzame personen.


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel20
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel19
    references:
      - id: ref1
