        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
  - number: '20'
    text: |-
      1 Personen die een veiligheidsfunctie uitoefenen tonen bij een onderzoek aan dat zij voldoen aan de bij en
      krachtens dit besluit voor de uitoefening van de betrokken veiligheidsfunctie vastgestelde eisen inzake algemene
      kennis en bekwaamheid.

      2 Het onderzoek omvat een theoriegedeelte en een praktijkgedeelte.

      3 In afwijking van het tweede lid omvat het onderzoek van machinisten en rangeerders, in dienst van een in
      het buitenland gevestigde spoorwegonderneming, die hun standplaats in het buitenland hebben en die dienst
      doen op een traject voorbij een station als bedoeld in [artikel 14, tweede lid][ref1], onderscheidenlijk
      [artikel 15, tweede lid][ref2], slechts een theoriegedeelte.

      4 Het onderzoek wordt verricht door een door Onze Minister aangewezen exameninstituut dat beschikt over de voor de
      examinering van personeel met een veiligheidsfunctie vereiste onafhankelijke organisatie en expertise.

      5 In afwijking van het vierde lid wordt het onderzoek van machinisten met minimale bevoegdheid en rangeerders met
      minimale bevoegdheid verricht door een vakinhoudelijk leidinggevende als bedoeld in [artikel 38, tweede lid][ref3].

      6 Het onderzoek vindt plaats volgens een door het exameninstituut vastgesteld en door Onze Minister goedgekeurd
      examenreglement.


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0017625#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0017625#Artikel38
