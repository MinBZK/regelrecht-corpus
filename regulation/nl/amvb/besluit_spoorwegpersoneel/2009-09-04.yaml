  - number: '21'
    text: |-
      1 Tot het praktijkgedeelte van het onderzoek van machinisten met volledige of beperkte bevoegdheid worden slechts
      toegelaten personen die beschikken over een praktijkervaring van ten minste veertig dagen, opgedaan tijdens een
      praktijkprogramma waarvan inhoud en uitvoering voldoen aan de bij ministeriële regeling vastgestelde regels.

      2 De duur van de praktijkervaring, bedoeld in het eerste lid, mag worden verkort tot twintig dagen, indien
      wordt voldaan aan de bij ministeriële regeling vastgestelde voorwaarden met betrekking tot materieeltype,
      treinsamenstelling, traject en rijsnelheid.

      3 Aan het praktijkprogramma, bedoeld in het eerste lid, mag slechts worden deelgenomen door personen die de in
      [artikel 12][ref1] voor de uitoefening van de betrokken veiligheidsfunctie genoemde minimumleeftijd hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel12
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0017625
        artikel: '12'
        hoofdstuk: I
  - number: '22'
    text: |-
      Een certificaat van bekwaamheid wordt door een door Onze Minister aangewezen exameninstituut afgegeven aan degene
      die bij het onderzoek, bedoeld in [artikel 20, eerste lid][ref1], blijkt te voldoen aan de bij en krachtens dit
      besluit vastgestelde eisen inzake kennis en bekwaamheid.


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel20
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0017625
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
  - number: '23'
    text: >-
      Het certificaat van bekwaamheid bevat ten minste de volgende gegevens:


      a. naam van het exameninstituut;


      b. datum van het examen;


      c. naam en geboortedatum van de geëxamineerde;


      d. veiligheidsfunctie en, indien van toepassing, de daarbij behorende gradatie, waarop het certificaat van
      bekwaamheid betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel23
  - number: '24'
    text: |-
      1 Onverminderd de [artikelen 14 tot en met 19][ref1] beschikken personen die een veiligheidsfunctie uitoefenen over
      de voor de betrokken functie vereiste specifieke, taakgebonden en bedrijfsgebonden kennis en bekwaamheid, bedoeld
      in [artikel 51, eerste lid, van de wet][ref2].

      2 De in het eerste lid bedoelde kennis en bekwaamheid betreft:

      a. voor de uitoefening van de functie van machinist:

      - wegbekendheid met het traject of de trajecten waarop hij als machinist wordt ingezet;
      - kennis van lokale voorschriften;
      - kennis van werking en bediening van de voertuigen waarop hij als machinist wordt ingezet;
      - kennis van de bedrijfsorganisatie en van het veiligheidszorgsysteem van de spoorwegonderneming;
      - kennis van de Handleiding Bestuurder, van de Materieelgids Bestuurder en van de communicatievoorschriften,
      bedoeld in paragraaf 4.1.2.1.1, onderscheidenlijk paragraaf 4.1.2.1.3, onderscheidenlijk bijlage A van de bijlage
      van Beschikking nr. 2002/734/EG van de Commissie van de Europese Gemeenschappen van 30 mei 2002 betreffende
      de technische specificatie inzake interoperabiliteit van het subsysteem exploitatie van het trans-Europees
      hogesnelheidsspoorwegsysteem overeenkomstig artikel 6, lid 1, van [richtlijn 96/48/EG](31996L0048) (PbEG L 245);

      b. voor de uitoefening van de functie van rangeerder:

      - wegbekendheid op de locatie waarop hij als rangeerder wordt ingezet;
      - kennis van lokale voorschriften;
      - kennis van de voertuigen die hij begeleidt;
      - kennis van de bedrijfsorganisatie en van het veiligheidszorgsysteem van de spoorwegonderneming;

      c. voor de uitoefening van de functie van wagencontroleur:

      - kennis van wagentypen en ladingen die hij controleert;
      - kennis van de bedrijfsorganisatie en van het veiligheidszorgsysteem van de spoorwegonderneming;

      d. voor de uitoefening van de functie van treindienstleider:

      - kennis van de inrichting van de gedeelten van het spoorwegnet waarvoor hij als treindienstleider dienst doet;
      - kennis van lokale voorschriften;
      - kennis van de bedrijfsorganisatie;
      - kennis van bijlage A van de Bijlage van Beschikking nr. 2002/734/EG van de Commissie van de Europese
      Gemeenschappen van 30 mei 2002 betreffende de technische specificatie inzake interoperabiliteit van het subsysteem
      exploitatie van het trans-Europees hogesnelheidsspoorwegsysteem overeenkomstig artikel 6, lid 1, van [richtlijn
      96/48/EG](31996L0048) (PbEG L 245) en de daarin gespecificeerde berichten, indien het personen betreft die deze
      functie vervullen in het trans-Europees hogesnelheidsspoorwegsysteem;

      e. voor de uitoefening van de functie van leider werkplekbeveiliging:

      - kennis van de toegepaste werkplekbeveiligingssystemen;
      - kennis van de bedrijfsorganisatie en van de toepassing van de voorwaarden, bedoeld in [artikel 40][ref3];

      f. voor de uitoefening van de functie van veiligheidsman:

      - kennis van de toegepaste werkplekbeveiligingssystemen;
      - kennis van de bedrijfsorganisatie;

      g. voor de uitoefening van de functie van werktreinbegeleider:

      - wegbekendheid op de locatie waarop hij als werktreinbegeleider wordt ingezet;
      - kennis van de toegepaste werkplekbeveiligingssystemen;
      - kennis van de werktreinen die hij begeleidt;
      - kennis van de bedrijfsorganisatie.

      3 In afwijking van het tweede lid, onderdeel a, kan:

      a. in de wegbekendheid en de kennis van lokale voorschriften worden voorzien door een andere machinist, een
      rangeerder of een werktreinbegeleider, die de machinist begeleidt en hem de voor zijn taak benodigde informatie
      verschaft;

      b. een voertuig worden bediend door een andere persoon die beschikt over kennis van werking en bediening
      van het betrokken voertuig, indien de machinist direct kan ingrijpen in de bediening en hij alle nodige
      bedieningsopdrachten geeft aan die andere persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0017625#Artikel40
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0017625
        artikel: '14'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '51'
      - id: ref3
        bwb_id: BWBR0017625
        artikel: '40'
        hoofdstuk: V
  - number: '25'
    text: |-
      De beoordeling van de voor de uitoefening van de betrokken veiligheidsfunctie vereiste specifieke, taakgebonden
      en bedrijfsgebonden kennis en bekwaamheid geschiedt door een vakinhoudelijk leidinggevende als bedoeld in
      [artikel 38, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel38
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0017625
        artikel: '38'
        hoofdstuk: V
  - number: '26'
    text: >-
      1 Personen die een veiligheidsfunctie uitoefenen voldoen aan de bij ministeriële regeling voor de betrokken functie
      vastgestelde eisen betreffende:


      a. gezichtsvermogen;


      b. gehoorvermogen;


      c. vermogen tot reageren en handelen;


      d. geestesvermogens, in het bijzonder het beoordelingsvermogen;


      e. gebruik van stoffen die het gezichtsvermogen, het vermogen tot reageren en handelen en het beoordelingsvermogen
      kunnen beïnvloeden.


      2 Het eerste lid geldt niet voor:


      a. machinisten met minimale bevoegdheid en rangeerders met minimale bevoegdheid;


      b. wagencontroleurs;


      c. machinisten en rangeerders, in dienst van een in het buitenland gevestigde spoorwegonderneming, die hun
      standplaats hebben in het buitenland, mits zij voldoen aan de in het land van hun standplaats geldende eisen
      betreffende de voor uitoefening van hun functie vereiste medische geschiktheid;


      d. leiders werkplekbeveiliging, veiligheidslieden en werktreinbegeleiders, die hun functie hoofdzakelijk in het
      buitenland uitoefenen, wanneer zij incidenteel hun functie in Nederland uitoefenen en mits zij voldoen aan de in
      het buitenland geldende eisen betreffende de voor de uitoefening van hun functie vereiste medische geschiktheid.
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel26
  - number: '27'
    text: >-
      1 Personen die een veiligheidsfunctie uitoefenen voldoen aan de bij ministeriële regeling voor de betrokken functie
      vastgestelde eisen betreffende:


      a. algemeen verstandelijk vermogen;


      b. voorstellingsvermogen;


      c. zelfstandigheid en verantwoordelijkheid;


      d. reactievermogen, concentratie en aandacht;


      e. emotionele stabiliteit;


      f. specifieke, aan de werksituatie gebonden aspecten.


      2 Het eerste lid geldt niet voor:


      a. machinisten met minimale bevoegdheid en rangeerders met minimale bevoegdheid;


      b. wagencontroleurs;


      c. machinisten en rangeerders, in dienst van een in het buitenland gevestigde spoorwegonderneming, die hun
      standplaats hebben in het buitenland, mits zij voldoen aan de in het land van hun standplaats geldende eisen
      betreffende de voor uitoefening van hun functie vereiste psychologische geschiktheid;


      d. leiders werkplekbeveiliging, veiligheidslieden en werktreinbegeleiders, die hun functie hoofdzakelijk in
      het buitenland uitoefenen, wanneer zij incidenteel hun functie in Nederland uitoefenen en mits zij voldoen aan
      de in het buitenland geldende eisen betreffende de voor de uitoefening van hun functie vereiste psychologische
      geschiktheid.
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel27
  - number: '28'
    text: >-
      1 Personen die een veiligheidsfunctie uitoefenen waarvoor bij of krachtens dit besluit eisen met betrekking tot
      de medische en psychologische geschiktheid zijn vastgesteld, onderwerpen zich aan een medische keuring en een
      psychologische keuring.


      2 De keuringen worden verricht door een door Onze Minister aangewezen keuringsinstituut dat beschikt over de voor
      de keuring van personeel met een veiligheidsfunctie vereiste onafhankelijke organisatie en expertise.


      3 De keuringen vinden plaats volgens een door het keuringsinstituut vastgesteld en door Onze Minister goedgekeurd
      keuringsreglement.


      4 Het keuringsreglement voorziet in ieder geval in de mogelijkheid tot aanvraag van een herkeuring bij bezwaar
      tegen de uitslag van de keuring in eerste aanleg.
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel28
  - number: '29'
    text: >-
      1 Een verklaring van medische geschiktheid wordt door het keuringsinstituut afgegeven aan degene die bij een
      keuring blijkt te voldoen aan de voor de betrokken functie vastgestelde eisen met betrekking tot de medische
      geschiktheid.


      2 Een verklaring van psychologische geschiktheid wordt door het keuringsinstituut afgegeven aan degene die bij een
      keuring blijkt te voldoen aan de voor de betrokken functie vastgestelde eisen met betrekking tot de psychologische
      geschiktheid.


      3 Indien het keuringsinstituut van oordeel is dat een keurling slechts onder beperkingen of voorwaarden medisch
      dan wel psychologisch geschikt kan worden geacht om de veiligheidsfunctie waarop de keuring betrekking heeft, op
      verantwoorde wijze uit te oefenen, geeft het een medische of psychologische verklaring af waarin die beperkingen of
      voorwaarden zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel29
  - number: '30'
    text: |-
      De verklaring van medische geschiktheid en de verklaring van psychologische geschiktheid bevatten ten minste de
      volgende gegevens:

      a. naam van het keuringsinstituut;

      b. keuringsdatum;

      c. naam en geboortedatum van de keurling;

      d. veiligheidsfunctie en, indien van toepassing, de daarbij behorende gradatie, waarvoor de keuring heeft
      plaatsgevonden;

      e. termijn waarvoor de keurling geschikt is bevonden;

      f. eventuele beperkingen of voorwaarden ten aanzien van de geschiktheid, bedoeld in [artikel 29, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel29
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0017625
        artikel: '29'
        hoofdstuk: III
  - number: '31'
    text: |-
      1 Een verklaring van medische geschiktheid, afgegeven aan een machinist met volledige of beperkte bevoegdheid of
      aan een veiligheidsman, die de leeftijd van:

      a. veertig jaar nog niet heeft bereikt, is geldig voor de duur van vijf jaar, gerekend vanaf de dag van afgifte;

      b. veertig jaar doch nog niet die van vijftig jaar heeft bereikt, is geldig voor de duur van vier jaar, gerekend
      vanaf de dag van afgifte;

      c. vijftig jaar heeft bereikt, is geldig voor de duur van twee jaar, gerekend vanaf de dag van afgifte.

      2 Een verklaring van medische geschiktheid, afgegeven aan een gereedschapsmachinist of aan een persoon die een der
      in [artikel 2, onderdelen a, c, d en f,][ref1] genoemde veiligheidsfuncties uitoefent, is geldig voor de duur van
      vijf jaar, gerekend vanaf de dag van afgifte.

      3 Een verklaring van medische geschiktheid verliest haar geldigheid indien bij een tussentijds medisch
      onderzoek blijkt dat de betrokkene niet of niet langer beschikt over de voor de uitoefening van de betrokken
      veiligheidsfunctie vereiste medische geschiktheid.

      4 Een tussentijds medisch onderzoek als bedoeld in het derde lid vindt plaats indien bij de organisatie waar de
      betrokkene werkzaam is, het vermoeden bestaat dat de betrokkene niet langer beschikt over de voor uitoefening van
      de betrokken veiligheidsfunctie vereiste medische geschiktheid.


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel2
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0017625
        artikel: '2'
        hoofdstuk: I
  - number: '32'
    text: |-
      1 Een verklaring van psychologische geschiktheid, afgegeven aan een machinist met volledige of beperkte bevoegdheid
      of aan een veiligheidsman, is geldig voor de duur van vijf jaar, gerekend vanaf de dag van afgifte.

      2 Een verklaring van psychologische geschiktheid, afgegeven aan een gereedschapsmachinist of aan een persoon die
      een der in [artikel 2, onderdelen a, c, d en f][ref1], genoemde veiligheidsfuncties uitoefent, is geldig voor
      onbepaalde tijd.

      3 Een verklaring van psychologische geschiktheid verliest haar geldigheid indien bij een tussentijds psychologisch
      onderzoek blijkt dat de betrokkene niet of niet langer beschikt over de voor uitoefening van de betrokken
      veiligheidsfunctie vereiste psychologische geschiktheid.

      4 Een tussentijds psychologisch onderzoek als bedoeld in het derde lid vindt plaats indien bij de arts die
      een medische keuring verricht, het vermoeden bestaat dat betrokkene niet of niet langer beschikt over de voor
      uitoefening van de betrokken veiligheidsfunctie vereiste psychologische geschiktheid.


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel2
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0017625
        artikel: '2'
        hoofdstuk: I
  - number: '33'
    text: >-
      Het bezit van een geldige bedrijfspas is niet vereist voor:


      a. machinisten, rangeerders, wagencontroleurs en werktreinbegeleiders, in dienst van een in het buitenland
      gevestigde spoorwegonderneming, die hun standplaats hebben in het buitenland en die slechts dienst doen op het
      traject tussen de rijksgrens en een nabij die grens gelegen station, mits zij voldoen aan de in het land van hun
      standplaats geldende eisen betreffende de voor uitoefening van hun functie vereiste bevoegdheid;


      b. treindienstleiders met volledige bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel33
  - number: '34'
    text: |-
      De bedrijfspas bevat ten minste de volgende gegevens:

      a. naam en geboortedatum van de houder;

      b. aanduiding van de veiligheidsfunctie of veiligheidsfuncties en, indien van toepassing, de daarbij behorende
      gradatie waarop de bedrijfspas betrekking heeft;

      c. datum van afgifte;

      d. geldigheidsduur;

      e. eventuele beperkingen of voorwaarden ten aanzien van de geschiktheid, bedoeld in [artikel 29, derde lid][ref1];

      f. naam van degene onder wiens gezag de veiligheidsfunctie waarvoor de bedrijfspas is afgegeven, wordt uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel29
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0017625
        artikel: '29'
        hoofdstuk: III
  - number: '35'
    text: |-
      1 Een bedrijfspas is geldig voor de duur van vijf jaar, gerekend vanaf de dag van afgifte.

      2 Een bedrijfspas verliest zijn geldigheid:

      a. door het verstrijken van de geldigheidsduur;

      b. gedurende de tijd dat de houder niet beschikt over een geldige verklaring van medische geschiktheid en een
      geldige verklaring van psychologische geschiktheid;

      c. bij wijziging van de op de bedrijfspas vermelde gegevens, bedoeld in [artikel 34, onderdelen b, e en f][ref1];

      d. gedurende de tijd dat aan de houder de bevoegdheid tot het uitoefenen van zijn functie bij rechterlijke
      uitspraak is ontzegd.


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel34
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0017625
        artikel: '34'
        hoofdstuk: IV
  - number: '36'
    text: |-
      In de gevallen, bedoeld in [artikel 35, tweede lid, onderdelen b, c en d][ref1], neemt degene die de bedrijfspas
      heeft afgegeven, de pas in.


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel35
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0017625
        artikel: '35'
        hoofdstuk: IV
  - number: '37'
    text: |-
      1 Onze Minister kan andere in verband met de uitoefening van veiligheidsfuncties afgegeven veiligheidsdocumenten
      gelijkstellen aan de bedrijfspas, mits die documenten ten minste de in [artikel 34][ref1] bedoelde gegevens
      bevatten.

      2 Voor de toepassing van de [artikelen 33][ref2], [35][ref3] en [36][ref4] van dit besluit wordt onder een
      bedrijfspas mede verstaan een daaraan op grond van het eerste lid gelijkgesteld veiligheidsdocument.


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0017625#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0017625#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0017625#Artikel36
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0017625
        artikel: '34'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0017625
        artikel: '33'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0017625
        artikel: '35'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0017625
        artikel: '36'
        hoofdstuk: IV
  - number: '38'
    text: >-
      1 Degene onder wiens gezag een veiligheidsfunctie wordt uitgeoefend, draagt zorg voor vakinhoudelijke leiding over
      de persoon of personen door wie die functie wordt uitgeoefend.


      2 Een vakinhoudelijk leidinggevende dient te beschikken over zodanige kennis van en inzicht in de
      uitoefening van de betrokken veiligheidsfunctie en zodanige kennis van de processen en de techniek binnen het
      spoorwegverkeerssysteem, dat hij personen die de betrokken veiligheidsfunctie uitoefenen kan instrueren, beoordelen
      en corrigeren ten aanzien van de goede uitoefening van die functie.
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel38
  - number: '39'
    text: >-
      1 Degene onder wiens gezag een veiligheidsfunctie wordt uitgeoefend, draagt er zorg voor dat de persoon door
      wie die functie wordt uitgeoefend periodiek een herinstructie volgt ten aanzien van de juiste uitvoering van
      de functie. Onderdeel van de herinstructie is een beoordeling van de juiste uitvoering van de functie door een
      vakinhoudelijk leidinggevende.


      2 Bij ministeriële regeling kunnen nadere regels worden vastgesteld betreffende de periodiciteit, de inhoud en de
      wijze van uitvoering van de herinstructie.
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel39
  - number: '40'
    text: |-
      Degene onder wiens gezag een veiligheidsfunctie wordt uitgeoefend, niet zijnde een spoorwegonderneming
      die houder is van een veiligheidsattest, past een systeem van personeelsbeheer toe dat voldoet aan
      [artikel 33, tweede lid, onderdeel e, van de wet][ref1] en dat is goedgekeurd door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel33
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '33'
  - number: '41'
    text: >-
      Certificaten van bekwaamheid, verklaringen van medische geschiktheid en verklaringen van psychologische
      geschiktheid worden in tweevoud afgegeven. Een exemplaar is bestemd voor degene die de veiligheidsfunctie uitoefent
      of gaat uitoefenen, een exemplaar is bestemd voor degene onder wiens gezag betrokkene de veiligheidsfunctie
      uitoefent of gaat uitoefenen.
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel41
  - number: '42'
    text: >-
      1 Onze Minister kan aan machinisten, rangeerders en wagencontroleurs ontheffing verlenen van het bepaalde bij en
      krachtens dit besluit:


      a. in verband met het over beperkte afstand rijden over een spoorweg waarop dit besluit van toepassing is, in
      aansluiting op het rijden op een spoorweg waarop dit besluit niet van toepassing is;


      b. indien zij beschikken over naar het oordeel van Onze Minister relevante ervaring die is opgedaan op een spoorweg
      waarop dit besluit niet van toepassing is.


      2 Een ontheffing als bedoeld in het eerste lid kan onder beperkingen worden verleend. Aan een ontheffing kunnen
      voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel42
  - number: '43'
    text: |-
      In afwijking van [artikel 20, tweede lid][ref1], omvat het onderzoek naar de vereiste algemene kennis en
      bekwaamheid voor de hierna te noemen veiligheidsfuncties tot 1 januari 2006 slechts een theoriegedeelte:

      a. gereedschapsmachinisten;

      b. wagencontroleurs;

      c. leiders werkplekbeveiliging;

      d. veiligheidslieden.


      [ref1]: https://wetten.overheid.nl/BWBR0017625#Artikel20
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0017625
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
  - number: '44'
    text: >-
      1 De bevoegdheid tot het uitoefenen van een veiligheidsfunctie als bedoeld in dit besluit of van een daaraan gelijk
      te stellen veiligheidsfunctie, die voor het tijdstip van inwerkingtreding van dit besluit is toegekend door een
      spoorwegonderneming of door degene onder wiens gezag de betrokken veiligheidsfunctie wordt uitgeoefend, blijft
      onverminderd het derde lid van kracht voor de duur waarvoor zij is toegekend.


      2 Voorzover de toekenning van een bevoegdheid als bedoeld in het eerste lid niet wordt gestaafd door de
      bevoegdhedenadministratie van degene onder wiens gezag de betrokken veiligheidsfunctie wordt uitgeoefend, neemt
      deze binnen vier maanden na de datum van inwerkingtreding van dit besluit een verklaring omtrent die bevoegdheid op
      in zijn bevoegdhedenadministratie.


      3 Indien degene onder wiens gezag de betrokken veiligheidsfunctie wordt uitgeoefend, niet binnen vier maanden na
      inwerkingtreding van dit besluit heeft voldaan aan het tweede lid, vervalt de bevoegdheid tot het uitoefenen van de
      betrokken veiligheidsfunctie.
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel44
  - number: '45'
    text: >-
      Met ingang van het tijdstip van inwerkingtreding van dit besluit worden certificaten van bekwaamheid, verklaringen
      van medische geschiktheid, verklaringen van psychologische geschiktheid en bedrijfspassen of daaraan gelijk te
      stellen documenten, die voor dat tijdstip zijn afgegeven, aangemerkt als certificaten van bekwaamheid, verklaringen
      van medische geschiktheid, verklaringen van psychologische geschiktheid en bedrijfspassen, die zijn afgegeven op
      basis van dit besluit.
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel45
  - number: '46'
    text: >-
      Certificaten van bekwaamheid, verklaringen van medische geschiktheid, verklaringen van psychologische geschiktheid
      en bedrijfspassen of daaraan gelijk te stellen documenten, die voor het tijdstip van inwerkingtreding van dit
      besluit zijn afgegeven, behouden hun geldigheid voor de duur waarvoor zij zijn afgegeven.
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel46
  - number: '47'
    text: >-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel47
  - number: '48'
    text: 'Dit besluit wordt aangehaald als: Besluit spoorwegpersoneel.'
    url: https://wetten.overheid.nl/BWBR0017625/2009-09-04#Artikel48
