articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder hogeschool:

      a. een in de bijlage van de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] opgenomen hogeschool;

      b. centrale directie: de centrale directie, bedoeld in [artikel 10.2 van de onder a genoemde wet][ref2];

      c. college van bestuur: het college van bestuur, bedoeld in [artikel 10.2 ][ref3]dan wel
      [artikel 10.9 van de onder a genoemde wet][ref4];

      d. bevoegd gezag: het instellingsbestuur van een hogeschool, dan wel, indien het een bijzondere hogeschool
      betreft die uitgaat van een rechtspersoon waarvan de statuten bepalen dat het college van bestuur optreedt als
      instellingsbestuur, de bestuursraad.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel10.2
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel10.2
