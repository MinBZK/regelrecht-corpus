  - number: '2'
    text: |-
      Het bevoegd gezag stelt de rechtspositie vast van de leden van de centrale directie dan wel van de leden van het
      college van bestuur met inachtneming van [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012613#Artikel3
    url: https://wetten.overheid.nl/BWBR0012613/2001-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0012613
        artikel: '3'
        hoofdstuk: '1'
  - number: '3'
    text: |-
      1 Het salaris dat aan een lid van de centrale directie onderscheidenlijk van het college van bestuur
      wordt toegekend, bedraagt niet meer dan het salaris overeenkomstig het maximum van schaal 18 van het
      [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1].

      2 Aan een lid van de centrale directie onderscheidenlijk van het college van bestuur kan naast het salaris
      een toelage worden toegekend, indien hij is benoemd of aangesteld voor een periode van ten hoogste 4 jaren.
      [Artikel 668a, eerste en tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref2] is in dat geval niet van
      toepassing.

      3 Het salaris en de toelage worden door het bevoegd gezag vastgesteld en toegekend. Zij vormen tezamen de
      bezoldiging.

      4 Indien een salaris is toegekend overeenkomstig het maximum van schaal 18 van het
      [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref3] en de toelage, bedoeld in het tweede lid, meer
      bedraagt dan 10% van dat salaris, gaat de aanspraak van betrokkene op een werkloosheidsuitkering die hij gehad zou
      hebben op grond van het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref4], zoals dat luidde op 30 juni
      2001, niet te boven, behoudens het vijfde en zesde lid.

      5 Indien het bedrag van de aanspraak die betrokkene zou hebben gehad met toepassing van
      [Hoofdstuk II van het Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref5], zoals dat luidde op 30 juni
      2001, lager is dan het bedrag dat wordt verkregen door vermenigvuldiging van het aantal gewogen dienstjaren van
      betrokkene met de ingevolge het derde lid toegekende bezoldiging, wordt laatstbedoeld bedrag gehanteerd bij het
      bepalen van de hoogte van het desbetreffende gedeelte van de in het vierde lid bedoelde aanspraak.

      6 Voor de berekening van het aantal gewogen dienstjaren van de betrokkene, bedoeld in het vijfde lid, worden de
      dienstjaren tot en met het 40e levensjaar, de dienstjaren tussen het 40e en het 50e levensjaar en de dienstjaren
      vanaf het 50e levensjaar vermenigvuldigd met respectievelijk de factor 1, 1,5 en 2.


      [ref1]: https://wetten.overheid.nl/BWBR0003630
