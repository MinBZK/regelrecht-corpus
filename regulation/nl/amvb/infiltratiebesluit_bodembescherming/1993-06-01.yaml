  - number: '4'
    text: |-
      1 Gedeputeerde staten verbinden aan de vergunning in ieder geval voorschriften ten aanzien van:

      a. de kwaliteit van het te infiltreren water;

      b. de beheersing van de hydrologische situatie;

      c. de beëindiging van het infiltreren.

      2 Ten aanzien van de kwaliteit van het te infiltreren water worden ten minste zodanige voorschriften aan de
      vergunning verbonden dat geen gevaar bestaat voor verontreiniging van het grondwater.

      3 Ten aanzien van de beheersing van de hydrologische situatie worden ten minste zodanige voorschriften aan de
      vergunning verbonden dat verspreiding van het te infiltreren water zo veel mogelijk wordt beheerst, opdat het te
      infiltreren water grotendeels weer wordt onttrokken.

      4 Ten aanzien van de beëindiging van het infiltreren worden ten minste voorschriften aan de vergunning verbonden,
      inhoudende dat een evaluatie van de gevolgen van het infiltreren voor de kwaliteit van de bodem dient plaats te
      vinden, gevolgd door een planmatige aanpak van de beëindiging waarvan het opheffen van eventuele nadelige gevolgen
      deel uitmaakt.
    url: https://wetten.overheid.nl/BWBR0005957/1993-06-01#Artikel4
