  - number: '2'
    text: Dit besluit is uitsluitend van toepassing op het infiltreren van water dat afkomstig is uit oppervlaktewater.
    url: https://wetten.overheid.nl/BWBR0005957/1993-06-01#Artikel2
  - number: '3'
    text: |-
      1 Van gevaar voor verontreiniging van het grondwater als bedoeld in
      [artikel 14a, eerste lid, van de Grondwaterwet][ref1] is sprake, indien in het te infiltreren water stoffen
      voorkomen in hogere concentraties dan in [bijlage 1][ref2] voor die stoffen is aangegeven, met dien verstande dat
      gedeputeerde staten bij de vergunningverlening voor een of meer stoffen hogere concentraties kunnen toestaan in een
      door hen aan te geven tijdvak, indien:

      a. de bodemgesteldheid of de bodemsoort zodanig is dat er geen gevaar is voor verontreiniging van het grondwater,
      indien water wordt geïnfiltreerd waarin die stoffen voorkomen in die hogere concentraties of

      b. gedeputeerde staten aan de vergunning zodanige voorschriften verbinden dat het gevaar voor verontreiniging van
      het grondwater, dat ontstaat door infiltratie van water waarin die stoffen voorkomen in die hogere concentraties,
      wordt opgeheven.

      2 Van gevaar voor verontreiniging van het grondwater is eveneens sprake, indien in het te infiltreren water stoffen
      voorkomen als bedoeld in [bijlage 2][ref3], voor zover deze stoffen niet zijn genoemd in [bijlage 1][ref4], en
      gedeputeerde staten constateren dat deze stoffen niet in zodanig geringe hoeveelheden en concentraties aanwezig
      zijn dat gevaar voor verslechtering van de kwaliteit van het grondwater is uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0003406#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0005957
      [ref3]: https://wetten.overheid.nl/BWBR0005957
      [ref4]: https://wetten.overheid.nl/BWBR0005957
