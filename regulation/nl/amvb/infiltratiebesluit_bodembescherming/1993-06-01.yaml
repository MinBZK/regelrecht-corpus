articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. infiltreren van water: infiltreren van water als bedoeld in [artikel 1, eerste lid, van de Grondwaterwet][ref1];

      b. oppervlaktewater: oppervlaktewater in de zin van de [Wet verontreiniging oppervlaktewateren][ref2];

      c. vergunning: vergunning als bedoeld in [artikel 14 van de Grondwaterwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003406#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002682
      [ref3]: https://wetten.overheid.nl/BWBR0003406#Artikel14
