publication_date: '2020-10-28'
valid_from: '2009-12-22'
bwb_id: BWBR0005957
url: https://wetten.overheid.nl/BWBR0005957/2009-12-22
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 28 oktober 1992,
    nr. MJZ 28092008, Centrale Directie Juridische Zaken, afdeling Wetgeving;

    Gelet op artikel 13a van de Wet bodembescherming;

    Gehoord de Centrale raad voor de milieuhygiëne, de Raad voor de Drinkwatervoorziening en de Technische commissie
    bodembescherming;

    De Raad van State gehoord (advies van 14 januari 1993, nr. W08.92.0517);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 14 april
    1993, nr. MJZ14493045, Centrale Directie Juridische Zaken, afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005957/2009-12-22#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005957/2009-12-22#Artikel1
  - number: 1.a
    text: |-
      *infiltreren van water:* infiltreren van water als bedoeld in [artikel 1.1 van de Waterwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel1
    url: https://wetten.overheid.nl/BWBR0005957/2009-12-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '1'
  - number: 1.b
    text: |-
      *oppervlaktewaterlichaam:* oppervlaktewaterlichaam als bedoeld in [artikel 1.1 van de Waterwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel1
    url: https://wetten.overheid.nl/BWBR0005957/2009-12-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '1'
  - number: 1.c
    text: |-
      *vergunning:* vergunning als bedoeld in [artikel 6.4][ref1] of [6.5, onderdeel b, van de Waterwet][ref2], dan wel
      een vergunning voor het infiltreren van water krachtens een verordening van een waterschap.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0005957/2009-12-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '6'
  - number: '2'
    text: |-
      Dit besluit is uitsluitend van toepassing op het infiltreren van water dat afkomstig is uit een
      oppervlaktewaterlichaam.
    url: https://wetten.overheid.nl/BWBR0005957/2009-12-22#Artikel2
  - number: '3.1'
    text: |-
      Van gevaar voor verontreiniging van het grondwater als bedoeld in [artikel 6.26, tweede lid, van de Waterwet][ref1]
      is sprake, indien in het te infiltreren water stoffen voorkomen in hogere concentraties dan in [bijlage 1][ref2]
      voor die stoffen is aangegeven, met dien verstande dat het bevoegd gezag bij de vergunningverlening voor een of
      meer stoffen hogere concentraties kan toestaan in een door hen aan te geven tijdvak, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005957
    url: https://wetten.overheid.nl/BWBR0005957/2009-12-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005957
  - number: 3.1.a
    text: |-
      de bodemgesteldheid of de bodemsoort zodanig is dat er geen gevaar is voor verontreiniging van het grondwater,
      indien water wordt geïnfiltreerd waarin die stoffen voorkomen in die hogere concentraties of
    url: https://wetten.overheid.nl/BWBR0005957/2009-12-22#Artikel3
  - number: 3.1.b
    text: |-
      gedeputeerde staten aan de vergunning zodanige voorschriften verbinden dat het gevaar voor verontreiniging van het
      grondwater, dat ontstaat door infiltratie van water waarin die stoffen voorkomen in die hogere concentraties, wordt
      opgeheven.
    url: https://wetten.overheid.nl/BWBR0005957/2009-12-22#Artikel3
  - number: '3.2'
    text: |-
      Van gevaar voor verontreiniging van het grondwater is eveneens sprake, indien in het te infiltreren water stoffen
      voorkomen als bedoeld in [bijlage 2][ref1], voor zover deze stoffen niet zijn genoemd in [bijlage 1][ref2], en
      gedeputeerde staten constateren dat deze stoffen niet in zodanig geringe hoeveelheden en concentraties aanwezig
      zijn dat gevaar voor verslechtering van de kwaliteit van het grondwater is uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0005957
      [ref2]: https://wetten.overheid.nl/BWBR0005957
    url: https://wetten.overheid.nl/BWBR0005957/2009-12-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005957
      - id: ref2
        bwb_id: BWBR0005957
  - number: '4.1'
    text: 'Gedeputeerde staten verbinden aan de vergunning in ieder geval voorschriften ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0005957/2009-12-22#Artikel4
  - number: 4.1.a
    text: de kwaliteit van het te infiltreren water;
    url: https://wetten.overheid.nl/BWBR0005957/2009-12-22#Artikel4
  - number: 4.1.b
    text: de beheersing van de hydrologische situatie;
    url: https://wetten.overheid.nl/BWBR0005957/2009-12-22#Artikel4
  - number: 4.1.c
    text: de beëindiging van het infiltreren.
    url: https://wetten.overheid.nl/BWBR0005957/2009-12-22#Artikel4
  - number: '4.2'
    text: |-
      Ten aanzien van de kwaliteit van het te infiltreren water worden ten minste zodanige voorschriften aan de
      vergunning verbonden dat geen gevaar bestaat voor verontreiniging van het grondwater.
    url: https://wetten.overheid.nl/BWBR0005957/2009-12-22#Artikel4
  - number: '4.3'
    text: |-
      Ten aanzien van de beheersing van de hydrologische situatie worden ten minste zodanige voorschriften aan de
      vergunning verbonden dat verspreiding van het te infiltreren water zo veel mogelijk wordt beheerst, opdat het te
      infiltreren water grotendeels weer wordt onttrokken.
    url: https://wetten.overheid.nl/BWBR0005957/2009-12-22#Artikel4
  - number: '4.4'
    text: |-
      Ten aanzien van de beëindiging van het infiltreren worden ten minste voorschriften aan de vergunning verbonden,
      inhoudende dat een evaluatie van de gevolgen van het infiltreren voor de kwaliteit van de bodem dient plaats te
      vinden, gevolgd door een planmatige aanpak van de beëindiging waarvan het opheffen van eventuele nadelige gevolgen
      deel uitmaakt.
    url: https://wetten.overheid.nl/BWBR0005957/2009-12-22#Artikel4
  - number: '5'
    text: |-
      Dit besluit treedt in werking met ingang van de eerste dag van de tweede kalendermaand na de datum van uitgifte van
      het Staatsblad waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0005957/2009-12-22#Artikel5
  - number: '6'
    text: 'Dit besluit kan worden aangehaald als: Infiltratiebesluit bodembescherming.'
    url: https://wetten.overheid.nl/BWBR0005957/2009-12-22#Artikel6
