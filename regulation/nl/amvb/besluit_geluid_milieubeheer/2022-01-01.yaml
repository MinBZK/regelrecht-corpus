        artikel: '11.24'
  - number: '31'
    text: |-
      1 Een geluidbeperkende maatregel is financieel doelmatig indien het aantal maatregelpunten van de geluidbeperkende
      maatregel niet hoger is dan het aantal reductiepunten behorende bij het cluster waar de maatregel voor is bedoeld.

      2 In afwijking van het eerste lid is een geluidbeperkende maatregel niet financieel doelmatig, indien naar het
      oordeel van Onze Minister uit het akoestisch onderzoek blijkt dat:

      a. toepassing van de geluidbeperkende maatregel de grootste geluidreductie oplevert voor het cluster;

      b. het aantal maatregelpunten voor deze maatregel hoger is dan het aantal maatregelpunten voor een andere
      geluidbeperkende maatregel die een gelijke of nagenoeg gelijke geluidreductie kan realiseren, en

      c. in vergelijking met de andere maatregel de extra maatregelpunten niet in redelijke verhouding staan tot de extra
      geluidreductie die door het treffen van deze maatregel bereikt kan worden.

      3 In afwijking van het eerste lid is een overdrachtsmaatregel niet financieel doelmatig indien deze maatregel een
      bestaande overdrachtsmaatregel zou vervangen, die:

      a. naar verwachting bij de start van de uitvoering niet ouder zal zijn dan tien jaar;

      b. niet ophoogbaar is, en

      c. een geluidreductie realiseert die vrijwel gelijk is aan de nieuw te treffen maatregel.

      4 Bij ministeriële regeling worden regels gesteld met betrekking tot de wijze waarop het aantal maatregelpunten van
      een geluidbeperkende maatregel wordt bepaald.

      5 Bij ministeriële regeling kunnen geluidbeperkende maatregelen worden aangewezen waarvoor de financiële
      doelmatigheid in afwijking van het eerste tot en met derde lid wordt bepaald door de werkelijke kosten van aanleg
      en onderhoud van een maatregel af te wegen tegen de geluidreductie die de maatregel kan realiseren en tegen het
      aantal geluidsgevoelige objecten in het cluster waar de maatregel voor is bedoeld.

      6 In afwijking van het eerste lid is bij de toepassing van [artikel 11.42 van de wet][ref1] een geluidbeperkende
      maatregel of een deel daarvan niet financieel doelmatig indien de maatregel of het deel daarvan uitsluitend wordt
      afgewogen in het kader van artikel 11.42, tweede lid, van de wet en het aantal maatregelpunten, behorende bij de
      maatregel of het deel daarvan, hoger is dan het aantal reductiepunten, behorende bij de saneringsobjecten waarvoor
      de maatregel of het deel daarvan wordt afgewogen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11.42
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11.42'
  - number: '32'
    text: |-
      1 Het aantal reductiepunten behorende bij een cluster wordt bepaald door het optellen van de reductiepunten per
      woning, die overeenkomstig het tweede lid worden gegenereerd door alle geluidsgevoelige objecten in het cluster.

      2 Het aantal reductiepunten per woning op basis van de hoogste toekomstige geluidsbelasting op de woning vanwege
      een weg of spoorweg in de situatie zonder maatregelen is opgenomen in tabel 1 van [bijlage 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031477
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0031477
  - number: '33'
    text: |-
      1 Bij de voorbereiding van een besluit als bedoeld in [artikel 11.29 van de wet][ref1] worden achtereenvolgens in
      overweging genomen:

      a. bronmaatregelen,

      b. andere geluidbeperkende maatregelen, al dan niet in combinatie met bronmaatregelen,

      die leiden tot de meeste geluidreductie.

      2 Overdrachtsmaatregelen, al dan niet in combinatie met bronmaatregelen, worden bij de voorbereiding van een
      besluit als bedoeld in [artikel 11.29 van de wet][ref2] uitsluitend in aanmerking genomen voor zover deze
      maatregelen leiden tot een afname van de geluidsbelasting van ten minste 5 dB op ten minste een geluidsgevoelig
      object in een cluster.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11.29
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel11.29
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11.29'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '11.29'
  - number: '34'
    text: |-
      1 De geluidreductie is het verschil tussen de toekomstige geluidsbelasting die door woningen zou worden ondervonden
      vanwege een weg of spoorweg in de situatie zonder maatregelen, en de toekomstige geluidsbelasting vanwege een weg
      of spoorweg in de situatie dat er geluidbeperkende maatregelen getroffen zijn.

      2 Ingeval de berekende toekomstige geluidsbelasting, in de situatie dat er geluidbeperkende maatregelen zijn
      getroffen, lager is dan de waarde in tabel 2 van [bijlage 1][ref1], wordt bij toepassing van het eerste lid de
      waarde uit tabel 2 van bijlage 1 die op de betreffende situatie van toepassing is, gehanteerd als toekomstige
      geluidsbelasting vanwege de weg of spoorweg.


      [ref1]: https://wetten.overheid.nl/BWBR0031477
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0031477
  - number: 34a
    text: |-
      Ten behoeve van de toepassing van [artikel 32][ref1], [artikel 34, eerste lid][ref2], en
      [tabel 1 van bijlage 1][ref3] wordt gelijkgesteld aan een woning:

      a. elke vijftien strekkende meter geluidsbelaste gevel van een geluidsgevoelig object, niet zijnde een woning,
      per bouwlaag;

      b. een standplaats als bedoeld in [artikel 1, onderdeel j, van de Wet op de huurtoeslag][ref4];

      c. een ligplaats in het water, bestemd om door een woonschip te worden ingenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0031477#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0031477#Artikel34
