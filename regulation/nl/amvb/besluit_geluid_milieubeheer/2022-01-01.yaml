  - number: '38'
    text: |-
      1 Als geluidproductieplafond als bedoeld in [artikel 11.45, tweede lid, van de wet][ref1] geldt voor zover het
      betreft in tabel 1, 2 of 3 van [bijlage 2][ref2] genoemde geprojecteerde delen van wegen en spoorwegen, of in
      tabel 1, 2 of 3 van bijlage 2 genoemde andere delen van wegen en spoorwegen, de berekende geluidproductie op
      de referentiepunten zoals bepaald op basis van de brongegevens afkomstig uit het betrokken besluit, mits dat is
      vastgesteld vóór het tijdstip van inwerkingtreding van dit besluit.

      2 Als geluidproductieplafond als bedoeld in [artikel 11.45, tweede lid, van de wet][ref3] geldt voor delen van
      wegen en spoorwegen waarvoor een saneringsprogramma wordt uitgevoerd, het geluidproductieplafond zoals bepaald
      op grond van de berekende heersende geluidproductie op de referentiepunten, bedoeld in artikel 11.45, eerste lid,
      van de wet, met inbegrip van het effect van de in het betreffende saneringsprogramma opgenomen geluidbeperkende
      maatregelen.

      3 Als geluidproductieplafond als bedoeld in [artikel 11.45, tweede lid, van de wet][ref4] geldt voor zover het
      betreft de A59 Vlijmen–Nieuwkuijk, van kilometer 119,0 tot kilometer 127,2, het geluidproductieplafond zoals
      bepaald op grond van de berekende heersende geluidproductie op de referentiepunten, bedoeld in artikel 11.45,
      eerste lid, van de wet, met inbegrip van het effect van de reeds uitgevoerde overdrachtsmaatregelen.

      4 Met betrekking tot de in de [bijlage 3][ref5] bij dit besluit aangewezen delen van wegen wordt bij het bepalen
      van de heersende geluidproducties op de referentiepunten, bedoeld in [artikel 11.45, vierde lid, van de wet][ref6],
      uitgegaan van een wegdek dat bestaat uit zeer open asfaltbeton.

      5 [Artikel 11.56, eerste lid, van de wet][ref7] is van overeenkomstige toepassing op:

      a. de in tabel 1, 2 of 3 van [bijlage 2][ref8] bij dit besluit aangewezen delen van wegen en spoorwegen, indien en
      voor zover dat is aangegeven in deze tabellen, en

      b. de A59 Vlijmen-Nieuwkuijk, van kilometer 120,8 tot kilometer 121,4 alsmede van kilometer 125,6 tot kilometer
      126,4.


