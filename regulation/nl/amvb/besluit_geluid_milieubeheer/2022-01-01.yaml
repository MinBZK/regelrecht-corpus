  - number: '25'
    text: |-
      1 Een actieplan bevat naast de in [artikel 11.11 van de wet][ref1] bedoelde gegevens een beschrijving van het
      beleid voor de eerstkomende vijf jaren en, voor zover dit redelijkerwijs is aan te geven, voor de vijf jaren
      daarna, om de geluidsbelasting vanwege de betrokken geluidsbron of geluidsbronnen te beperken.

      2 Bij de beschrijving van het beleid wordt in elk geval aandacht besteed aan de bescherming van stille gebieden als
      bedoeld in [artikel 6][ref2] en, voor zover het betreft een actieplan van gedeputeerde staten of van burgemeester
      en wethouders van een gemeente die behoort tot een krachtens [artikel 11.5][ref3] aangewezen agglomeratie, aan:

      a. de situaties waarin de ten hoogste toelaatbare geluidsbelasting ingevolge de [Wet luchtvaart][ref4] dan wel de
      [Wet geluidhinder][ref5] wordt overschreden;

      b. de situaties waarin tevens de waarde die ingevolge de [Wet geluidhinder][ref6] bij de vaststelling van een
      hogere waarde niet mag worden overschreden, wordt overschreden.


