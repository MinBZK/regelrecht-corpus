  - number: '29'
    text: |-
      1 In een verslag als bedoeld in [artikel 11.22 van de wet][ref1] zijn ten minste de volgende gegevens opgenomen:

      a. het verschil tussen de berekende geluidproducties op de referentiepunten en de geldende geluidproductieplafonds,
      met uitzondering van de referentiepunten, bedoeld in onderdeel c;

      b. de spoorwegen waarvoor een vrijstelling als bedoeld in [artikel 11.23 van de wet][ref2] geldt;

      c. de berekende geluidproducties op de referentiepunten waarvoor een vrijstelling als bedoeld in
      [artikel 11.23 van de wet][ref3] geldt;

      d. de wegen, spoorwegen en geluidproductieplafonds waarvoor een ontheffing als bedoeld in
      [artikel 11.24 van de wet][ref4] is verleend;

      e. voor zover van toepassing, de mate en de duur van de overschrijding van het geluidproductieplafond waarvoor
      ontheffing als bedoeld in [artikel 11.24 van de wet][ref5] is verleend;

      f. de locaties waarvoor een overschrijdingsbesluit als bedoeld in [artikel 11.49 van de wet][ref6] geldt;

      g. een analyse van de voor de geluidproductie relevante ontwikkelingen die zich in het kalenderjaar waar
      het verslag op ziet, hebben voorgedaan ten aanzien van de wegen en spoorwegen en de effecten hiervan op de
      geluidproductie.

      2 Indien de berekende geluidproductie op een referentiepunt, bedoeld in het eerste lid, onderdeel a, 0,5 dB of
      minder onder het geldende geluidproductieplafond ligt, is in het verslag voorts een prognose opgenomen van het jaar
      waarin, gelet op de meest recente verkeersprognose, het geluidproductieplafond volledig zal zijn benut.

      3 Indien uit de prognose, bedoeld in het tweede lid, blijkt dat het geluidproductieplafond volledig benut zal zijn
      voor de laatste dag van het vijfde kalenderjaar na het jaar van toezending van het verslag, is in het verslag dat
      de prognose bevat of in het daaropvolgende verslag opgenomen op welke wijze de beheerder voornemens is te voorkomen
      dat het geluidproductieplafond zal worden overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11.22
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel11.23
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel11.23
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel11.24
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel11.24
      [ref6]: https://wetten.overheid.nl/BWBR0003245#Artikel11.49
