  - number: '17'
    text: |-
      1 Op een geografische kaart die deel uitmaakt van een geluidsbelastingkaart wordt voorts aangegeven de luchthaven
      Schiphol, voor zover een of meer van de punten, bedoeld in het tweede lid, onderdeel c, zijn gelegen binnen de
      gemeente.

      2 Ten aanzien van de luchthaven Schiphol wordt aangegeven:

      a. de ligging van de luchthaven;

      b. de waarde of waarden van de ten hoogste toelaatbare geluidsbelasting;

      c. de punten buiten de luchthaven waar de ten hoogste toelaatbare geluidsbelasting vanwege de luchthaven is
      bepaald;

      d. de geluidsgevoelige objecten die de ten hoogste toelaatbare geluidsbelasting vanwege de luchthaven ondervinden.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel17
  - number: '18'
    text: |-
      1 Op een geografische kaart die deel uitmaakt van een geluidsbelastingkaart worden voorts aangegeven de
      industrieterreinen die zijn gezoneerd krachtens [artikel 40 van de Wet geluidhinder][ref1], voor zover de ten
      hoogste toelaatbare geluidsbelasting vanwege de gezamenlijke inrichtingen op het industrieterrein overeenkomt met
      55 dB of meer dan wel 50 dB L of meer.

      2 Ten aanzien van zodanige industrieterreinen worden aangegeven:

      a. de grenzen van het industrieterrein;

      b. de zone rond het industrieterrein, vastgesteld krachtens [artikel 40 van de Wet geluidhinder][ref2];

      c. de ten hoogste toelaatbare geluidsbelasting vanwege de gezamenlijke inrichtingen op het industrieterrein,
      aangegeven door middel van:

      1°. contouren die overeenkomen met een geluidsbelasting van 55, 60, 65, 70 en 75 dB, en

      2°. contouren die overeenkomen met een geluidsbelasting van 50, 55, 60, 65 en 70 dB L,

      voor zover deze contouren zijn gelegen buiten het industrieterrein;

      d. de geluidsgevoelige objecten die zijn gelegen binnen de contouren, bedoeld in onderdeel c.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel40
