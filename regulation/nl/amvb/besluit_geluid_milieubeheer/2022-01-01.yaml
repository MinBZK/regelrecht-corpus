  - number: 36a
    text: |-
      Bij de wijziging van een geluidproductieplafond wordt het tweede tot en met het vijfde lid van
      [artikel 11.42 van de wet][ref1] buiten toepassing gelaten indien:

      a. als gevolg van de wijziging van het geluidproductieplafond geen saneringsobjecten ontstaan;

      b. als gevolg van de wijziging van het geluidproductieplafond de geluidsbelasting op de saneringsobjecten bij
      volledige benutting van het geluidproductieplafond niet toeneemt, en

      c. een gecombineerde realisatie van in aanmerking komende geluidbeperkende maatregelen, gericht
      op het voldoen aan de waarde, bedoeld in [artikel 11.30, tweede lid][ref2], respectievelijk
      [artikel 11.42, tweede lid, van de wet][ref3], geen aanmerkelijke voordelen biedt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11.42
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel11.30
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel11.42
