  - number: '2'
    text: |-
      1 Als geluidsgevoelig object als bedoeld in [artikel 11.1 van de wet][ref1] wordt aangewezen:

      a. een woning;

      b. een onderwijsgebouw;

      c. een ziekenhuis;

      d. een verpleeghuis;

      e. een verzorgingstehuis;

      f. een psychiatrische inrichting;

      g. een kinderdagverblijf;

      h. een standplaats als bedoeld in [artikel 1, onderdeel j, van de Wet op de huurtoeslag][ref2], en

      i. een ligplaats in het water, bestemd om door een woonschip te worden ingenomen.

      2 De aanwijzing als geluidsgevoelig object in het eerste lid, onderdelen b tot en met g, geldt niet voor de delen
      van een object die een andere bestemming hebben dan genoemd in [artikel 3, onderdelen b, c of d][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11.1
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0031477#Artikel3
