  - number: '37'
    text: |-
      Ten aanzien van de geluidsgevoelige objecten als bedoeld in
      [artikel 2, eerste lid, aanhef en onderdeel a tot en met g][ref1], die voor het aanbrengen van geluidwerende
      maatregelen aan de gevel in aanmerking worden genomen, is [hoofdstuk 6 van het Besluit geluidhinder][ref2] van
      overeenkomstige toepassing, met dien verstande dat:

      a. de minister uitvoering geeft aan de [artikelen 6.4, tweede en derde lid][ref3], [6.6][ref4],
      [6.8, vierde lid][ref5], en [6.9, tweede, derde en vierde lid][ref6];

      b. in de [artikelen 6.2][ref7], [6.5][ref8], [6.8][ref9] en [6.10][ref10] in plaats van «het bevoegd gezag» telkens
      wordt gelezen «de beheerder»;

      c. in plaats van «andere geluidsgevoelige gebouwen» telkens wordt gelezen «geluidsgevoelige objecten als bedoeld in
      [artikel 2, aanhef en onderdeel b tot en met g][ref11], van het Besluit geluid milieubeheer», en

      d. in plaats van «andere geluidsgevoelige gebouw» telkens wordt gelezen «geluidsgevoelige object, bedoeld in
      [artikel 2, aanhef en onderdeel b tot en met g][ref12], van het Besluit geluid milieubeheer».


