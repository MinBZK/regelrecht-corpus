  - number: '24'
    text: |-
      1 Een actieplan bevat naast de in [artikel 11.11 van de wet][ref1] bedoelde gegevens ten minste:

      a. een beschrijving van de betrokken categorieën van geluidsbronnen;

      b. een vermelding van de bevoegde instantie;

      c. een beschrijving van het wettelijk kader met betrekking tot geluidsbelasting;

      d. een samenvatting van de gegevens die zijn vervat in de geluidsbelastingkaart of geluidsbelastingkaarten waarop
      het actieplan berust;

      e. een beschrijving van de wijze waarop aan een ieder de gelegenheid is geboden om zienswijzen over het ontwerp van
      het actieplan naar voren te brengen;

      f. een inhoudelijke reactie op de onder e bedoelde zienswijzen;

      g. een overzicht van belangrijke infrastructurele werken die zijn voorgenomen in de planperiode en andere
      belangrijke ruimtelijke ontwikkelingen die van invloed zijn op de geluidshindersituatie;

      h. een overzicht van bestaande en in voorbereiding of uitvoering zijnde bron- en overdrachtsmaatregelen met
      betrekking tot de betrokken geluidsbron of geluidsbronnen;

      i. een overzicht en een beoordeling van het aantal bewoners van woningen dat door geluid ten gevolge van de
      betrokken geluidsbron of geluidsbronnen lijdt aan ischemische hartziekten als bedoeld in bijlage III, onder 1, bij
      [richtlijn nr. 2002/49/EG](32002L0049) van het Europees Parlement en de Raad van de Europese Unie van 25 juni 2002
      inzake de evaluatie en de beheersing van omgevingslawaai (PbEG, L 189), een hoge mate van hinder of een hoge mate
      van slaapverstoring ondervindt;

      j. een schatting van het effect van de voorgenomen maatregelen op het aantal bewoners van woningen, bedoeld in
      onderdeel i;

      k. voor zover beschikbaar en openbaar, financiële informatie met betrekking tot de voorgenomen maatregelen;

      l. een evaluatie van de uitvoering en de resultaten van het vorige actieplan.

      2 Een actieplan bevat voorts een beknopte samenvatting van de in het eerste lid bedoelde aspecten.

      3 Een actieplan als bedoeld in [artikel 11.12, tweede lid, van de wet][ref2] bevat voorts:

      a. een beschrijving van de geluidsbronnen in de gemeente;

      b. een inhoudelijke reactie op de wensen en zienswijze over het ontwerp van het actieplan die door de gemeenteraad
      ter kennis van burgemeester en wethouders zijn gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11.11
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel11.12
