  - number: '5'
    text: |-
      Als inrichtingen als bedoeld in onderdeel b van de begripsomschrijving van verzameling van inrichtingen in
      [artikel 11.1, eerste lid, van de wet][ref1] worden aangewezen: inrichtingen gelegen in een concentratiegebied voor
      horeca-inrichtingen of een concentratiegebied voor detailhandel en ambachtsbedrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11.1
