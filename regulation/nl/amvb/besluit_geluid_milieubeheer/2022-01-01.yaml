  - number: '35'
    text: |-
      1 Een verzoek tot vaststelling of wijziging van een geluidproductieplafond bevat ten minste:

      a. een aanduiding van het gedeelte van de weg of spoorweg ten aanzien waarvan het verzoek wordt gedaan;

      b. een aanduiding van het referentiepunt ten aanzien waarvan het verzoek wordt gedaan;

      c. de gevraagde hoogte van het geluidproductieplafond;

      d. de te verwachten geluidproductie op het referentiepunt ten minste tien jaar na het indienen van het verzoek;

      e. de maatregelen die naar het oordeel van de beheerder op grond van [artikel 11.29, eerste lid, van de wet][ref1]
      in aanmerking moeten worden genomen;

      f. de maatregelen die naar het oordeel van de beheerder op grond van
      [artikel 11.29, tweede en derde lid, van de wet][ref2] in aanmerking kunnen worden genomen;

      g. de brongegevens behorende bij de aangevraagde geluidproductieplafonds;

      h. de resultaten van het akoestisch onderzoek, bedoeld in [artikel 11.33 van de wet][ref3];

      i. een verklaring van de beheerder in hoeverre het gedeelte van de weg of spoorweg, bedoeld in onderdeel a, voldoet
      aan de akoestische kwaliteit, bedoeld in [artikel 7][ref4];

      j. een verslag van afstemming met de beheerders van andere geluidsbronnen als bedoeld in
      [artikel 11.30, vijfde lid][ref5], over maatregelen, die naar het oordeel van deze beheerders zouden kunnen worden
      getroffen, teneinde de effecten van de samenloop van de geluidbelasting vanwege de weg of spoorweg alsmede een
      andere geluidsbron als bedoeld in artikel 11.30, vijfde lid, te voorkomen of zoveel mogelijk te beperken.

      2 Indien de beheerder een verzoek doet tot verlaging van geluidproductieplafonds als bedoeld in
      [artikel 11.63, eerste lid, van de wet][ref6], zijn de onderdelen d, e, f, h, i en j van het eerste lid niet van
      toepassing.

      3 Indien burgemeester en wethouders van een gemeente een verzoek doen tot verlaging van een geluidproductieplafond,
      zijn de onderdelen e, f en i van het eerste lid niet van toepassing.

      4 Onverminderd het derde lid, is het eerste lid, onderdeel d, niet van toepassing op een verzoek tot verlaging
      van het geluidproductieplafond als bedoeld in [artikel 11.28, vierde lid, van de wet][ref7], indien die verlaging
      niet groter zou zijn dan het effect van de in dat lid bedoelde maatregel. Het verzoek bevat tevens een weergave
      van de afspraken tussen gemeente en de beheerder, en de zienswijze van de beheerder ten aanzien van de verzochte
      verlaging.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11.29
