    text: |-
      Bij ministeriële regeling kan voor de toepassing van dit hoofdstuk worden bepaald dat het aantal bewoners van
      woningen wordt bepaald op basis van een bij die regeling vastgesteld gemiddeld aantal bewoners per woning.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel21
  - number: '22'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot:

      a. de legenda bij de geografische kaarten;

      b. de opstelling van geluidsbelastingkaarten ter uitvoering van door de Europese Commissie opgestelde richtsnoeren
      als bedoeld in bijlage IV, onderdeel 9, bij de richtlijn omgevingslawaai.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel22
  - number: '23'
    text: |-
      1 Aan een verzoek om verstrekking van inlichtingen en gegevens als bedoeld in
      [artikel 11.7, eerste of tweede lid][ref1], of [artikel 11.16, eerste lid, van de wet][ref2] wordt voldaan binnen
      drie maanden na de dag waarop het verzoek is ontvangen, dan wel, indien de inlichtingen en gegevens nog niet
      beschikbaar zijn, onverwijld nadat zij beschikbaar zijn gekomen.

      2 Bij ministeriële regeling wordt bepaald welke inlichtingen en gegevens in elk geval worden verstrekt en op welke
      wijze deze inlichtingen en gegevens worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11.7
