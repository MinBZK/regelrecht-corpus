  - number: '13'
    text: |-
      1 In de tabellen van een geluidsbelastingkaart worden per geluidsbelastingklasse ten minste aangegeven:

      a. het aantal geluidsgevoelige objecten dat is blootgesteld aan een geluidsbelasting die groter is dan, of gelijk
      is aan:

      1°. 55, 60, 65, 70 en 75 dB;

      2°. 50, 55, 60, 65 en 70 dB L;

      b. het aantal bewoners van de woningen die deel uitmaken van de geluidsgevoelige objecten, bedoeld in onderdeel a;

      c. indien beschikbaar, een opgave van het aantal woningen dat uit hoofde van de [wet][ref1], de
      [Wet geluidhinder][ref2], de [Woningwet][ref3] of de [Wet luchtvaart][ref4] is voorzien van extra geluidwering.

      2 De aantallen, bedoeld in het eerste lid, onder a en b, worden afgerond op honderdtallen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0003227
