  - number: '39'
    text: |-
      Bij een verzoek tot vaststelling van een saneringsplan worden naast de in
      [artikel 11.56, derde lid, van de wet][ref1] genoemde gegevens, de volgende gegevens overgelegd:

      a. een lijst met de adressen van de betrokken saneringsobjecten;

      b. het wegnummer en de begrenzingen van de weg, inclusief de hectometrering, en het trajectnummer en de
      begrenzingen van de spoorweg, die onderdeel zijn van het saneringsplan;

      c. een beschrijving van de maatregelen als bedoeld in [artikel 11.59 van de wet][ref2] die naar het oordeel van
      de beheerder in aanmerking komen, en van het effect van deze maatregelen op de geluidsbelasting, vanwege de weg of
      spoorweg, van de gevel dan wel aan de grens van de betrokken saneringsobjecten;

      d. een of meer kaarten die inzicht geven in het saneringsplan en die in ieder geval de plaats, aard en omvang van
      maatregelen, bedoeld in onderdeel c, bevatten;

      e. een beschrijving van de mogelijkheden om uit een oogpunt van doelmatigheid en kostenbeheersing de te treffen
      maatregelen al dan niet gezamenlijk uit te voeren met andere werken;

      f. het tijdstip waarop met de uitvoering van de maatregelen kan worden begonnen, alsmede de verwachte duur van de
      uitvoering van de maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11.56
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel11.59
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel39
