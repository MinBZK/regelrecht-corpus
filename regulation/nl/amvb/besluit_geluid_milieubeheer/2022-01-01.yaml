  - number: '19'
    text: |-
      1 Op een geografische kaart die deel uitmaakt van een geluidsbelastingkaart worden voorts aangegeven de
      concentratiegebieden voor horeca-inrichtingen onderscheidenlijk voor detailhandel en ambachtsbedrijven.

      2 Ten aanzien van zodanige concentratiegebieden worden aangegeven:

      a. de grenzen van het concentratiegebied;

      b. de ten hoogste toelaatbare geluidsbelasting vanwege de betrokken inrichtingen, uitgedrukt in L en L;

      c. de geluidsgevoelige objecten die zijn gelegen binnen het concentratiegebied.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel19
  - number: '20'
    text: |-
      1 Op een geografische kaart die deel uitmaakt van een geluidsbelastingkaart worden voorts aangegeven de
      inrichtingen waarop de [artikelen 18][ref1] en [19][ref2] geen betrekking hebben en waarvoor ingevolge de wet een
      ten hoogste toegelaten geluidsbelasting geldt die overeenkomt met 55 dB of meer dan wel 50 dB L of meer.

      2 Ten aanzien van zodanige inrichtingen worden aangegeven:

      a. de ligging van de inrichting;

      b. de waarde van de ten hoogste toelaatbare geluidsbelasting;

      c. de punten buiten de inrichting waar de ten hoogste toelaatbare geluidsbelasting vanwege de inrichting is
      bepaald;

      d. de geluidsgevoelige objecten die de ten hoogste toelaatbare geluidsbelasting vanwege de inrichting ondervinden.


      [ref1]: https://wetten.overheid.nl/BWBR0031477#Artikel8
