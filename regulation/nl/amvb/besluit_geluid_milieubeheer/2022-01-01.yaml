        artikel: '11.6'
  - number: '10'
    text: |-
      1 In de tabellen van een geluidsbelastingkaart worden per geluidsbelastingklasse en per gemeente ten minste
      aangegeven:

      a. het aantal geluidsgevoelige objecten dat is blootgesteld aan een geluidsbelasting die groter is dan, of gelijk
      is aan:

      1°. 55, 60, 65, 70 en 75 dB;

      2°. 50, 55, 60, 65 en 70 dB L;

      b. het aantal bewoners van de woningen die deel uitmaken van de geluidsgevoelige objecten, bedoeld in onderdeel a;

      c. indien beschikbaar, een opgave van het aantal woningen dat op grond van de [wet][ref1], de
      [Wet geluidhinder][ref2], de [Woningwet][ref3] of de [Wet luchtvaart][ref4] is voorzien van extra geluidwering;

      d. een opgave van de totale oppervlakte in km² die is blootgesteld aan een geluidsbelasting die hoger is dan 55,
      65, respectievelijk 75 dB.

      2 De aantallen, bedoeld in het eerste lid, onderdelen a en b, zijn exclusief de aantallen geluidsgevoelige objecten
      respectievelijk bewoners van woningen binnen agglomeraties en worden afgerond op honderdtallen.

      3 Indien het betrokken bestuursorgaan een geluidsbelastingkaart vaststelt voor twee of meer belangrijke wegen of
      voor twee of meer belangrijke spoorwegen, mogen de in het eerste lid bedoelde gegevens worden aangegeven voor de
      gezamenlijke belangrijke wegen onderscheidenlijk belangrijke spoorwegen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0003227
      [ref3]: https://wetten.overheid.nl/BWBR0005181
      [ref4]: https://wetten.overheid.nl/BWBR0005555
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003245
      - id: ref2
        bwb_id: BWBR0003227
      - id: ref3
        bwb_id: BWBR0005181
      - id: ref4
        bwb_id: BWBR0005555
  - number: '11'
    text: |-
      1 Op een geografische kaart die deel uit maakt van een geluidsbelastingkaart worden ten minste aangegeven:

      a. de ligging van de betrokken weg of spoorweg;

      b. de geluidsbelasting vanwege de betrokken weg of spoorweg, aangegeven door middel van:

      1°. contouren van 55, 60, 65, 70 en 75 dB;

      2°. contouren van 50, 55, 60, 65 en 70 dB L;

      c. de geluidsgevoelige objecten die zijn gelegen binnen de onder b bedoelde contouren;

      d. de grenzen van stille gebieden als bedoeld in [artikel 6][ref1], voor zover gelegen binnen een afstand van
      2,5 km tot de betrokken weg of spoorweg;

      e. de gemeentegrenzen binnen de onder b bedoelde contouren;

      f. de grenzen van agglomeraties binnen de onder b bedoelde contouren.

      2 De afstand, bedoeld in het eerste lid, onder d, wordt gemeten vanaf de buitenste begrenzing van de buitenste
      rijstrook onderscheidenlijk vanuit de buitenste spoorstaaf.


      [ref1]: https://wetten.overheid.nl/BWBR0031477#Artikel6
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel11
    references:
