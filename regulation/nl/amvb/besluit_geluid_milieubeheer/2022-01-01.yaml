  - number: '3'
    text: |-
      Als geluidsgevoelige ruimten van een geluidsgevoelig object als bedoeld in [artikel 11.1 van de wet][ref1] worden
      aangewezen:

      a. een ruimte binnen een woning voor zover die kennelijk als slaap-, woon-, of eetkamer wordt gebruikt of voor een
      zodanig gebruik is bestemd, alsmede een keuken van ten minste 11 m2;

      b. een leslokaal, theorielokaal of theorievaklokaal van een onderwijsgebouw;

      c. een onderzoeks- en behandelingsruimte, een ruimte voor patiëntenhuisvesting, alsmede een recreatie- en
      conversatieruimte van een ziekenhuis of een verpleeghuis, en

      d. een onderzoeks-, behandelings-, recreatie-, of conversatieruimte, alsmede woon- en slaapruimte van een
      verzorgingstehuis, een psychiatrische inrichting of een kinderdagverblijf.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11.1
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel3
