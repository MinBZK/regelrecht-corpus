        artikel: '1'
  - number: '2.1'
    text: |-
      Als geluidsgevoelig object als bedoeld in [artikel 11.1 van de wet][ref1] wordt aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 2.1.a
    text: een woning;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel2
  - number: 2.1.b
    text: een onderwijsgebouw;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel2
  - number: 2.1.c
    text: een ziekenhuis;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel2
  - number: 2.1.d
    text: een verpleeghuis;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel2
  - number: 2.1.e
    text: een verzorgingstehuis;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel2
  - number: 2.1.f
    text: een psychiatrische inrichting;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel2
  - number: 2.1.g
    text: een kinderdagverblijf;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel2
  - number: 2.1.h
    text: |-
      een standplaats als bedoeld in [artikel 1, onderdeel j, van de Wet op de huurtoeslag][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel1
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '1'
  - number: 2.1.i
    text: een ligplaats in het water, bestemd om door een woonschip te worden ingenomen.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel2
  - number: '2.2'
    text: |-
      De aanwijzing als geluidsgevoelig object in het eerste lid, onderdelen b tot en met g, geldt niet voor de delen van
      een object die een andere bestemming hebben dan genoemd in [artikel 3, onderdelen b, c of d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031477#Artikel3
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0031477
        artikel: '3'
        hoofdstuk: '1'
  - number: '3'
    text: |-
      Als geluidsgevoelige ruimten van een geluidsgevoelig object als bedoeld in [artikel 11.1 van de wet][ref1] worden
      aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 3.a
    text: |-
      een ruimte binnen een woning voor zover die kennelijk als slaap-, woon-, of eetkamer wordt gebruikt of voor een
      zodanig gebruik is bestemd, alsmede een keuken van ten minste 11 m2;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel3
  - number: 3.b
    text: een leslokaal, theorielokaal of theorievaklokaal van een onderwijsgebouw;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel3
  - number: 3.c
    text: |-
      een onderzoeks- en behandelingsruimte, een ruimte voor patiëntenhuisvesting, alsmede een recreatie- en
      conversatieruimte van een ziekenhuis of een verpleeghuis, en
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel3
  - number: 3.d
    text: |-
      een onderzoeks-, behandelings-, recreatie-, of conversatieruimte, alsmede woon- en slaapruimte van een
      verzorgingstehuis, een psychiatrische inrichting of een kinderdagverblijf.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel3
  - number: '4'
    text: |-
      Als categorieën van andere geluidgevoelige gebouwen als bedoeld in
      [artikel 8a.45, eerste lid, van de Wet luchtvaart][ref1] worden aangewezen: gebouwen als bedoeld in
      [artikel 2, aanhef en onderdelen b tot en met e][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0031477#Artikel2
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: 8a
      - id: ref2
        bwb_id: BWBR0031477
        artikel: '2'
        hoofdstuk: '1'
  - number: '5'
    text: |-
      Als inrichtingen als bedoeld in onderdeel b van de begripsomschrijving van verzameling van inrichtingen in
      [artikel 11.1, eerste lid, van de wet][ref1] worden aangewezen: inrichtingen gelegen in een concentratiegebied voor
      horeca-inrichtingen of een concentratiegebied voor detailhandel en ambachtsbedrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: '6'
    text: |-
      Als stille gebieden als bedoeld in [artikel 11.6, derde lid, onderdeel b, van de wet][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 6.a
    text: |-
      de krachtens [artikel 1.2, tweede lid, onderdeel b, van de wet][ref1] bij provinciale milieuverordening aangewezen
      gebieden;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 6.b
    text: |-
      de krachtens [artikel 4.9, derde lid, onderdeel c, van de wet][ref1] in de provinciale milieubeleidsplannen
      aangeduide gebieden waarin de kwaliteit van het milieu in verband met geluid bijzondere bescherming behoeft;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel4
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '4'
  - number: 6.c
    text: |-
      de gebieden die bij gemeentelijke verordening als zodanig zijn aangewezen door een tot een agglomeratie behorende
      gemeente.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel6
  - number: '7.1'
    text: |-
      De akoestische kwaliteit van een weg in beheer bij het Rijk is zodanig dat de geluidproductie vanwege die weg niet
      meer bedraagt dan die vanwege een weg met een wegdek dat bestaat uit zeer open asfaltbeton.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel7
  - number: '7.2'
    text: |-
      De akoestische kwaliteit van een hoofdspoorweg is zodanig dat de geluidproductie vanwege die spoorweg niet meer
      bedraagt dan die vanwege een spoorweg met een constructie die bestaat uit langgelast spoor in een ballastbed op
      betonnen dwarsliggers.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel7
  - number: '8.1'
    text: Een geluidsbelastingkaart bestaat ten minste uit tabellen en uit een of meer geografische kaarten.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel8
  - number: '8.2'
    text: 'De tabellen worden ingedeeld in de volgende geluidsbelastingklassen:'
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel8
  - number: 8.2.a
    text: 'voor geluidsbelasting: 55-59, 60–64, 65–69, 70–74, en groter dan of gelijk aan 75 dB;'
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel8
  - number: 8.2.b
    text: 'voor geluidsbelasting L: 50–54, 55–59, 60–64, 65–69, en groter dan of gelijk aan 70 dB.'
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel8
  - number: '9'
    text: |-
      Deze paragraaf is van toepassing op de geluidsbelastingkaarten die krachtens
      [artikel 11.6, eerste en tweede lid, van de wet][ref1] worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: '10.1'
    text: |-
      In de tabellen van een geluidsbelastingkaart worden per geluidsbelastingklasse en per gemeente ten minste
      aangegeven:
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel10
  - number: 10.1.a
    text: |-
      het aantal geluidsgevoelige objecten dat is blootgesteld aan een geluidsbelasting die groter is dan, of gelijk
      is aan:
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel10
  - number: 10.1.a.1°
    text: 55, 60, 65, 70 en 75 dB;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel10
  - number: 10.1.a.2°
    text: 50, 55, 60, 65 en 70 dB L;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel10
  - number: 10.1.b
    text: het aantal bewoners van de woningen die deel uitmaken van de geluidsgevoelige objecten, bedoeld in onderdeel a;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel10
  - number: 10.1.c
    text: |-
      indien beschikbaar, een opgave van het aantal woningen dat op grond van de [wet][ref1], de
      [Wet geluidhinder][ref2], de [Woningwet][ref3] of de [Wet luchtvaart][ref4] is voorzien van extra geluidwering;


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0003227
      [ref3]: https://wetten.overheid.nl/BWBR0005181
      [ref4]: https://wetten.overheid.nl/BWBR0005555
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003245
      - id: ref2
        bwb_id: BWBR0003227
      - id: ref3
        bwb_id: BWBR0005181
      - id: ref4
        bwb_id: BWBR0005555
  - number: 10.1.d
    text: |-
      een opgave van de totale oppervlakte in km² die is blootgesteld aan een geluidsbelasting die hoger is dan 55, 65,
      respectievelijk 75 dB.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel10
  - number: '10.2'
    text: |-
      De aantallen, bedoeld in het eerste lid, onderdelen a en b, zijn exclusief de aantallen geluidsgevoelige objecten
      respectievelijk bewoners van woningen binnen agglomeraties en worden afgerond op honderdtallen.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel10
  - number: '10.3'
    text: |-
      Indien het betrokken bestuursorgaan een geluidsbelastingkaart vaststelt voor twee of meer belangrijke wegen of
      voor twee of meer belangrijke spoorwegen, mogen de in het eerste lid bedoelde gegevens worden aangegeven voor de
      gezamenlijke belangrijke wegen onderscheidenlijk belangrijke spoorwegen.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel10
  - number: '11.1'
    text: 'Op een geografische kaart die deel uit maakt van een geluidsbelastingkaart worden ten minste aangegeven:'
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel11
  - number: 11.1.a
    text: de ligging van de betrokken weg of spoorweg;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel11
  - number: 11.1.b
    text: 'de geluidsbelasting vanwege de betrokken weg of spoorweg, aangegeven door middel van:'
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel11
  - number: 11.1.b.1°
    text: contouren van 55, 60, 65, 70 en 75 dB;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel11
  - number: 11.1.b.2°
    text: contouren van 50, 55, 60, 65 en 70 dB L;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel11
  - number: 11.1.c
    text: de geluidsgevoelige objecten die zijn gelegen binnen de onder b bedoelde contouren;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel11
  - number: 11.1.d
    text: |-
      de grenzen van stille gebieden als bedoeld in [artikel 6][ref1], voor zover gelegen binnen een afstand van 2,5 km
      tot de betrokken weg of spoorweg;


      [ref1]: https://wetten.overheid.nl/BWBR0031477#Artikel6
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0031477
        artikel: '6'
        hoofdstuk: '1'
  - number: 11.1.e
    text: de gemeentegrenzen binnen de onder b bedoelde contouren;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel11
  - number: 11.1.f
    text: de grenzen van agglomeraties binnen de onder b bedoelde contouren.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel11
  - number: '11.2'
    text: |-
      De afstand, bedoeld in het eerste lid, onder d, wordt gemeten vanaf de buitenste begrenzing van de buitenste
      rijstrook onderscheidenlijk vanuit de buitenste spoorstaaf.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel11
  - number: '12'
    text: |-
      Deze paragraaf is van toepassing op de geluidsbelastingkaarten die krachtens
      [artikel 11.6, vierde lid, van de wet][ref1] worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: '13.1'
    text: 'In de tabellen van een geluidsbelastingkaart worden per geluidsbelastingklasse ten minste aangegeven:'
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel13
  - number: 13.1.a
    text: |-
      het aantal geluidsgevoelige objecten dat is blootgesteld aan een geluidsbelasting die groter is dan, of gelijk
      is aan:
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel13
  - number: 13.1.a.1°
    text: 55, 60, 65, 70 en 75 dB;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel13
  - number: 13.1.a.2°
    text: 50, 55, 60, 65 en 70 dB L;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel13
  - number: 13.1.b
    text: het aantal bewoners van de woningen die deel uitmaken van de geluidsgevoelige objecten, bedoeld in onderdeel a;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel13
  - number: 13.1.c
    text: |-
      indien beschikbaar, een opgave van het aantal woningen dat uit hoofde van de [wet][ref1], de
      [Wet geluidhinder][ref2], de [Woningwet][ref3] of de [Wet luchtvaart][ref4] is voorzien van extra geluidwering.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0003227
      [ref3]: https://wetten.overheid.nl/BWBR0005181
      [ref4]: https://wetten.overheid.nl/BWBR0005555
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003245
      - id: ref2
        bwb_id: BWBR0003227
      - id: ref3
        bwb_id: BWBR0005181
      - id: ref4
        bwb_id: BWBR0005555
  - number: '13.2'
    text: De aantallen, bedoeld in het eerste lid, onder a en b, worden afgerond op honderdtallen.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel13
  - number: '14'
    text: 'Op een geografische kaart die deel uitmaakt van een geluidsbelastingkaart worden aangegeven:'
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel14
  - number: 14.a
    text: de grenzen van de gemeente;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel14
  - number: 14.b
    text: |-
      de grenzen van de stille gebieden, bedoeld in [artikel 6][ref1], binnen de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0031477#Artikel6
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0031477
        artikel: '6'
        hoofdstuk: '1'
  - number: '15.1'
    text: 'Op een geografische kaart die deel uitmaakt van een geluidsbelastingkaart worden voorts aangegeven:'
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel15
  - number: 15.1.a
    text: wegen, daaronder begrepen spoorwegen die deel uitmaken van een weg;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel15
  - number: 15.1.b
    text: spoorwegen.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel15
  - number: '15.2'
    text: 'Ten aanzien van de geluidsbronnen, bedoeld in het eerste lid, worden aangegeven:'
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel15
  - number: 15.2.a
    text: de ligging van de betrokken geluidsbronnen;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel15
  - number: 15.2.b
    text: 'de geluidsbelasting vanwege de betrokken categorie van geluidsbronnen, aangegeven door middel van:'
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel15
  - number: 15.2.b.1°
    text: contouren van 55, 60, 65, 70 en 75 dB, en
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel15
  - number: 15.2.b.2°
    text: contouren van 50, 55, 60, 65 en 70 dB L,
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel15
  - number: 15.2.c
    text: de geluidsgevoelige objecten die zijn gelegen binnen de contouren, bedoeld in onderdeel b.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel15
  - number: '16.1'
    text: |-
      Op een geografische kaart die deel uitmaakt van een geluidsbelastingkaart worden voorts aangegeven luchthavens,
      voor zover de geluidsbelasting vanwege de luchthaven binnen de gemeente overeenkomt met 55 dB of meer dan wel 50 dB
      L of meer.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel16
  - number: '16.2'
    text: 'Ten aanzien van een zodanige luchthaven worden aangegeven:'
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel16
  - number: 16.2.a
    text: de ligging van de luchthaven;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel16
  - number: 16.2.b
    text: |-
      een met het oog op de geluidsbelasting vastgesteld beperkingengebied als bedoeld in [hoofdstuk 8][ref1] of
      [artikel 10.17 van de Wet luchtvaart][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005555
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '10'
  - number: 16.2.c
    text: 'de ten hoogste toelaatbare geluidsbelasting vanwege de luchthaven, aangegeven door middel van:'
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel16
  - number: 16.2.c.1°
    text: contouren die overeenkomen met een geluidsbelasting van 55, 60, 65, 70 en 75 dB, en
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel16
  - number: 16.2.c.2°
    text: contouren die overeenkomen met een geluidsbelasting van 50, 55, 60, 65 en 70 dB L,
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel16
  - number: 16.2.d
    text: de geluidsgevoelige objecten die zijn gelegen binnen de contouren, bedoeld in onderdeel c.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel16
  - number: '17.1'
    text: |-
      Op een geografische kaart die deel uitmaakt van een geluidsbelastingkaart wordt voorts aangegeven de luchthaven
      Schiphol, voor zover een of meer van de punten, bedoeld in het tweede lid, onderdeel c, zijn gelegen binnen de
      gemeente.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel17
  - number: '17.2'
    text: 'Ten aanzien van de luchthaven Schiphol wordt aangegeven:'
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel17
  - number: 17.2.a
    text: de ligging van de luchthaven;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel17
  - number: 17.2.b
    text: de waarde of waarden van de ten hoogste toelaatbare geluidsbelasting;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel17
  - number: 17.2.c
    text: de punten buiten de luchthaven waar de ten hoogste toelaatbare geluidsbelasting vanwege de luchthaven is bepaald;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel17
  - number: 17.2.d
    text: de geluidsgevoelige objecten die de ten hoogste toelaatbare geluidsbelasting vanwege de luchthaven ondervinden.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel17
  - number: '18.1'
    text: |-
      Op een geografische kaart die deel uitmaakt van een geluidsbelastingkaart worden voorts aangegeven de
      industrieterreinen die zijn gezoneerd krachtens [artikel 40 van de Wet geluidhinder][ref1], voor zover de ten
      hoogste toelaatbare geluidsbelasting vanwege de gezamenlijke inrichtingen op het industrieterrein overeenkomt met
      55 dB of meer dan wel 50 dB L of meer.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel40
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '40'
  - number: '18.2'
    text: 'Ten aanzien van zodanige industrieterreinen worden aangegeven:'
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel18
  - number: 18.2.a
    text: de grenzen van het industrieterrein;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel18
  - number: 18.2.b
    text: |-
      de zone rond het industrieterrein, vastgesteld krachtens [artikel 40 van de Wet geluidhinder][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel40
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '40'
  - number: 18.2.c
    text: |-
      de ten hoogste toelaatbare geluidsbelasting vanwege de gezamenlijke inrichtingen op het industrieterrein,
      aangegeven door middel van:
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel18
  - number: 18.2.c.1°
    text: contouren die overeenkomen met een geluidsbelasting van 55, 60, 65, 70 en 75 dB, en
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel18
  - number: 18.2.c.2°
    text: contouren die overeenkomen met een geluidsbelasting van 50, 55, 60, 65 en 70 dB L,
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel18
  - number: 18.2.d
    text: de geluidsgevoelige objecten die zijn gelegen binnen de contouren, bedoeld in onderdeel c.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel18
  - number: '19.1'
    text: |-
      Op een geografische kaart die deel uitmaakt van een geluidsbelastingkaart worden voorts aangegeven de
      concentratiegebieden voor horeca-inrichtingen onderscheidenlijk voor detailhandel en ambachtsbedrijven.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel19
  - number: '19.2'
    text: 'Ten aanzien van zodanige concentratiegebieden worden aangegeven:'
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel19
  - number: 19.2.a
    text: de grenzen van het concentratiegebied;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel19
  - number: 19.2.b
    text: de ten hoogste toelaatbare geluidsbelasting vanwege de betrokken inrichtingen, uitgedrukt in L en L;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel19
  - number: 19.2.c
    text: de geluidsgevoelige objecten die zijn gelegen binnen het concentratiegebied.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel19
  - number: '20.1'
    text: |-
      Op een geografische kaart die deel uitmaakt van een geluidsbelastingkaart worden voorts aangegeven de inrichtingen
      waarop de [artikelen 18][ref1] en [19][ref2] geen betrekking hebben en waarvoor ingevolge de wet een ten hoogste
      toegelaten geluidsbelasting geldt die overeenkomt met 55 dB of meer dan wel 50 dB L of meer.


      [ref1]: https://wetten.overheid.nl/BWBR0031477#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0031477#Artikel19
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0031477
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0031477
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '20.2'
    text: 'Ten aanzien van zodanige inrichtingen worden aangegeven:'
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel20
  - number: 20.2.a
    text: de ligging van de inrichting;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel20
  - number: 20.2.b
    text: de waarde van de ten hoogste toelaatbare geluidsbelasting;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel20
  - number: 20.2.c
    text: de punten buiten de inrichting waar de ten hoogste toelaatbare geluidsbelasting vanwege de inrichting is bepaald;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel20
  - number: 20.2.d
    text: de geluidsgevoelige objecten die de ten hoogste toelaatbare geluidsbelasting vanwege de inrichting ondervinden.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel20
  - number: '21'
    text: |-
      Bij ministeriële regeling kan voor de toepassing van dit hoofdstuk worden bepaald dat het aantal bewoners van
      woningen wordt bepaald op basis van een bij die regeling vastgesteld gemiddeld aantal bewoners per woning.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel21
  - number: '22'
    text: 'Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel22
  - number: 22.a
    text: de legenda bij de geografische kaarten;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel22
  - number: 22.b
    text: |-
      de opstelling van geluidsbelastingkaarten ter uitvoering van door de Europese Commissie opgestelde richtsnoeren als
      bedoeld in bijlage IV, onderdeel 9, bij de richtlijn omgevingslawaai.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel22
  - number: '23.1'
    text: |-
      Aan een verzoek om verstrekking van inlichtingen en gegevens als bedoeld in
      [artikel 11.7, eerste of tweede lid][ref1], of [artikel 11.16, eerste lid, van de wet][ref2] wordt voldaan binnen
      drie maanden na de dag waarop het verzoek is ontvangen, dan wel, indien de inlichtingen en gegevens nog niet
      beschikbaar zijn, onverwijld nadat zij beschikbaar zijn gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '11'
  - number: '23.2'
    text: |-
      Bij ministeriële regeling wordt bepaald welke inlichtingen en gegevens in elk geval worden verstrekt en op welke
      wijze deze inlichtingen en gegevens worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel23
  - number: '24.1'
    text: |-
      Een actieplan bevat naast de in [artikel 11.11 van de wet][ref1] bedoelde gegevens ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 24.1.a
    text: een beschrijving van de betrokken categorieën van geluidsbronnen;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel24
  - number: 24.1.b
    text: een vermelding van de bevoegde instantie;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel24
  - number: 24.1.c
    text: een beschrijving van het wettelijk kader met betrekking tot geluidsbelasting;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel24
  - number: 24.1.d
    text: |-
      een samenvatting van de gegevens die zijn vervat in de geluidsbelastingkaart of geluidsbelastingkaarten waarop het
      actieplan berust;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel24
  - number: 24.1.e
    text: |-
      een beschrijving van de wijze waarop aan een ieder de gelegenheid is geboden om zienswijzen over het ontwerp van
      het actieplan naar voren te brengen;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel24
  - number: 24.1.f
    text: een inhoudelijke reactie op de onder e bedoelde zienswijzen;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel24
  - number: 24.1.g
    text: |-
      een overzicht van belangrijke infrastructurele werken die zijn voorgenomen in de planperiode en andere belangrijke
      ruimtelijke ontwikkelingen die van invloed zijn op de geluidshindersituatie;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel24
  - number: 24.1.h
    text: |-
      een overzicht van bestaande en in voorbereiding of uitvoering zijnde bron- en overdrachtsmaatregelen met betrekking
      tot de betrokken geluidsbron of geluidsbronnen;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel24
  - number: 24.1.i
    text: |-
      een overzicht en een beoordeling van het aantal bewoners van woningen dat door geluid ten gevolge van de betrokken
      geluidsbron of geluidsbronnen lijdt aan ischemische hartziekten als bedoeld in bijlage III, onder 1, bij [richtlijn
      nr. 2002/49/EG](32002L0049) van het Europees Parlement en de Raad van de Europese Unie van 25 juni 2002 inzake
      de evaluatie en de beheersing van omgevingslawaai (PbEG, L 189), een hoge mate van hinder of een hoge mate van
      slaapverstoring ondervindt;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel24
  - number: 24.1.j
    text: |-
      een schatting van het effect van de voorgenomen maatregelen op het aantal bewoners van woningen, bedoeld in
      onderdeel i;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel24
  - number: 24.1.k
    text: voor zover beschikbaar en openbaar, financiële informatie met betrekking tot de voorgenomen maatregelen;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel24
  - number: 24.1.l
    text: een evaluatie van de uitvoering en de resultaten van het vorige actieplan.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel24
  - number: '24.2'
    text: Een actieplan bevat voorts een beknopte samenvatting van de in het eerste lid bedoelde aspecten.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel24
  - number: '24.3'
    text: |-
      Een actieplan als bedoeld in [artikel 11.12, tweede lid, van de wet][ref1] bevat voorts:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 24.3.a
    text: een beschrijving van de geluidsbronnen in de gemeente;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel24
  - number: 24.3.b
    text: |-
      een inhoudelijke reactie op de wensen en zienswijze over het ontwerp van het actieplan die door de gemeenteraad ter
      kennis van burgemeester en wethouders zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel24
  - number: '25.1'
    text: |-
      Een actieplan bevat naast de in [artikel 11.11 van de wet][ref1] bedoelde gegevens een beschrijving van het beleid
      voor de eerstkomende vijf jaren en, voor zover dit redelijkerwijs is aan te geven, voor de vijf jaren daarna, om de
      geluidsbelasting vanwege de betrokken geluidsbron of geluidsbronnen te beperken.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: '25.2'
    text: |-
      Bij de beschrijving van het beleid wordt in elk geval aandacht besteed aan de bescherming van stille gebieden als
      bedoeld in [artikel 6][ref1] en, voor zover het betreft een actieplan van gedeputeerde staten of van burgemeester
      en wethouders van een gemeente die behoort tot een krachtens [artikel 11.5][ref2] aangewezen agglomeratie, aan:


      [ref1]: https://wetten.overheid.nl/BWBR0031477#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0031477
        artikel: '6'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 25.2.a
    text: |-
      de situaties waarin de ten hoogste toelaatbare geluidsbelasting ingevolge de [Wet luchtvaart][ref1] dan wel de
      [Wet geluidhinder][ref2] wordt overschreden;


      [ref1]: https://wetten.overheid.nl/BWBR0005555
      [ref2]: https://wetten.overheid.nl/BWBR0003227
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005555
      - id: ref2
        bwb_id: BWBR0003227
  - number: 25.2.b
    text: |-
      de situaties waarin tevens de waarde die ingevolge de [Wet geluidhinder][ref1] bij de vaststelling van een hogere
      waarde niet mag worden overschreden, wordt overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0003227
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003227
  - number: '26.1'
    text: |-
      In een actieplan wordt een plandrempel aangegeven, zijnde een daarbij aangegeven geluidsbelasting en
      geluidsbelasting L, vanwege de betrokken geluidsbron of geluidsbronnen, van geluidsgevoelige objecten.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel26
  - number: '26.2'
    text: De plandrempel kan voor verschillende categorieën van gevallen verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel26
  - number: '26.3'
    text: |-
      In het actieplan wordt in elk geval aangegeven welke maatregelen worden overwogen of in uitvoering zijn om
      overschrijdingen van de plandrempel te voorkomen of ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel26
  - number: '26.4'
    text: Het actieplan geeft tevens de planning en de te verwachten effecten van de maatregelen aan.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel26
  - number: '27'
    text: |-
      Het percentage bewoners van woningen per geluidsbelastingklasse dat door een of meer geluidsbronnen de
      gezondheidseffecten ondervindt, bedoeld in [artikel 24, eerste lid, onder i][ref1], wordt bepaald aan de hand van
      de in een ministeriële regeling opgenomen dosis-effectrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0031477#Artikel24
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0031477
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '28'
    text: |-
      Bij ministeriële regeling kunnen met betrekking tot actieplannen nadere regels worden gesteld ter uitvoering
      van door de Europese Commissie opgestelde richtsnoeren als bedoeld in bijlage V, onderdeel 4, bij de richtlijn
      omgevingslawaai.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel28
  - number: '29.1'
    text: |-
      In een verslag als bedoeld in [artikel 11.22 van de wet][ref1] zijn ten minste de volgende gegevens opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 29.1.a
    text: |-
      het verschil tussen de berekende geluidproducties op de referentiepunten en de geldende geluidproductieplafonds,
      met uitzondering van de referentiepunten, bedoeld in onderdeel c;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel29
  - number: 29.1.b
    text: |-
      de spoorwegen waarvoor een vrijstelling als bedoeld in [artikel 11.23 van de wet][ref1] geldt;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 29.1.c
    text: |-
      de berekende geluidproducties op de referentiepunten waarvoor een vrijstelling als bedoeld in
      [artikel 11.23 van de wet][ref1] geldt;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 29.1.d
    text: |-
      de wegen, spoorwegen en geluidproductieplafonds waarvoor een ontheffing als bedoeld in
      [artikel 11.24 van de wet][ref1] is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 29.1.e
    text: |-
      voor zover van toepassing, de mate en de duur van de overschrijding van het geluidproductieplafond waarvoor
      ontheffing als bedoeld in [artikel 11.24 van de wet][ref1] is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 29.1.f
    text: |-
      de locaties waarvoor een overschrijdingsbesluit als bedoeld in [artikel 11.49 van de wet][ref1] geldt;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 29.1.g
    text: |-
      een analyse van de voor de geluidproductie relevante ontwikkelingen die zich in het kalenderjaar waar het verslag
      op ziet, hebben voorgedaan ten aanzien van de wegen en spoorwegen en de effecten hiervan op de geluidproductie.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel29
  - number: '29.2'
    text: |-
      Indien de berekende geluidproductie op een referentiepunt, bedoeld in het eerste lid, onderdeel a, 0,5 dB of
      minder onder het geldende geluidproductieplafond ligt, is in het verslag voorts een prognose opgenomen van het jaar
      waarin, gelet op de meest recente verkeersprognose, het geluidproductieplafond volledig zal zijn benut.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel29
  - number: '29.3'
    text: |-
      Indien uit de prognose, bedoeld in het tweede lid, blijkt dat het geluidproductieplafond volledig benut zal zijn
      voor de laatste dag van het vijfde kalenderjaar na het jaar van toezending van het verslag, is in het verslag dat
      de prognose bevat of in het daaropvolgende verslag opgenomen op welke wijze de beheerder voornemens is te voorkomen
      dat het geluidproductieplafond zal worden overschreden.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel29
  - number: '30'
    text: |-
      Een verzoek om een ontheffing als bedoeld in [artikel 11.24 van de wet][ref1] bevat ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 30.a
    text: |-
      een aanduiding van het referentiepunt waarop het geluidproductieplafond geldt ten aanzien waarvan het verzoek wordt
      gedaan;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel30
  - number: 30.b
    text: een aanduiding van het gedeelte van de weg of spoorweg waarlangs het betrokken referentiepunt is gelegen;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel30
  - number: 30.c
    text: de verwachte mate van overschrijding van het geluidproductieplafond;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel30
  - number: 30.d
    text: de duur van de bijzondere omstandigheid in verband waarmee de ontheffing wordt verzocht, en
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel30
  - number: 30.e
    text: de kalenderjaren waarvoor een ontheffing wordt verzocht.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel30
  - number: '31.1'
    text: |-
      Een geluidbeperkende maatregel is financieel doelmatig indien het aantal maatregelpunten van de geluidbeperkende
      maatregel niet hoger is dan het aantal reductiepunten behorende bij het cluster waar de maatregel voor is bedoeld.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel31
  - number: '31.2'
    text: |-
      In afwijking van het eerste lid is een geluidbeperkende maatregel niet financieel doelmatig, indien naar het
      oordeel van Onze Minister uit het akoestisch onderzoek blijkt dat:
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel31
  - number: 31.2.a
    text: toepassing van de geluidbeperkende maatregel de grootste geluidreductie oplevert voor het cluster;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel31
  - number: 31.2.b
    text: |-
      het aantal maatregelpunten voor deze maatregel hoger is dan het aantal maatregelpunten voor een andere
      geluidbeperkende maatregel die een gelijke of nagenoeg gelijke geluidreductie kan realiseren, en
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel31
  - number: 31.2.c
    text: |-
      in vergelijking met de andere maatregel de extra maatregelpunten niet in redelijke verhouding staan tot de extra
      geluidreductie die door het treffen van deze maatregel bereikt kan worden.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel31
  - number: '31.3'
    text: |-
      In afwijking van het eerste lid is een overdrachtsmaatregel niet financieel doelmatig indien deze maatregel een
      bestaande overdrachtsmaatregel zou vervangen, die:
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel31
  - number: 31.3.a
    text: naar verwachting bij de start van de uitvoering niet ouder zal zijn dan tien jaar;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel31
  - number: 31.3.b
    text: niet ophoogbaar is, en
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel31
  - number: 31.3.c
    text: een geluidreductie realiseert die vrijwel gelijk is aan de nieuw te treffen maatregel.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel31
  - number: '31.4'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de wijze waarop het aantal maatregelpunten van
      een geluidbeperkende maatregel wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel31
  - number: '31.5'
    text: |-
      Bij ministeriële regeling kunnen geluidbeperkende maatregelen worden aangewezen waarvoor de financiële
      doelmatigheid in afwijking van het eerste tot en met derde lid wordt bepaald door de werkelijke kosten van aanleg
      en onderhoud van een maatregel af te wegen tegen de geluidreductie die de maatregel kan realiseren en tegen het
      aantal geluidsgevoelige objecten in het cluster waar de maatregel voor is bedoeld.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel31
  - number: '31.6'
    text: |-
      In afwijking van het eerste lid is bij de toepassing van [artikel 11.42 van de wet][ref1] een geluidbeperkende
      maatregel of een deel daarvan niet financieel doelmatig indien de maatregel of het deel daarvan uitsluitend wordt
      afgewogen in het kader van artikel 11.42, tweede lid, van de wet en het aantal maatregelpunten, behorende bij de
      maatregel of het deel daarvan, hoger is dan het aantal reductiepunten, behorende bij de saneringsobjecten waarvoor
      de maatregel of het deel daarvan wordt afgewogen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: '32.1'
    text: |-
      Het aantal reductiepunten behorende bij een cluster wordt bepaald door het optellen van de reductiepunten per
      woning, die overeenkomstig het tweede lid worden gegenereerd door alle geluidsgevoelige objecten in het cluster.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel32
  - number: '32.2'
    text: |-
      Het aantal reductiepunten per woning op basis van de hoogste toekomstige geluidsbelasting op de woning vanwege een
      weg of spoorweg in de situatie zonder maatregelen is opgenomen in tabel 1 van [bijlage 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031477
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0031477
  - number: '33.1'
    text: |-
      Bij de voorbereiding van een besluit als bedoeld in [artikel 11.29 van de wet][ref1] worden achtereenvolgens in
      overweging genomen:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 33.1.a
    text: bronmaatregelen,
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel33
  - number: 33.1.b
    text: andere geluidbeperkende maatregelen, al dan niet in combinatie met bronmaatregelen,
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel33
  - number: '33.2'
    text: |-
      Overdrachtsmaatregelen, al dan niet in combinatie met bronmaatregelen, worden bij de voorbereiding van een besluit
      als bedoeld in [artikel 11.29 van de wet][ref1] uitsluitend in aanmerking genomen voor zover deze maatregelen
      leiden tot een afname van de geluidsbelasting van ten minste 5 dB op ten minste een geluidsgevoelig object in een
      cluster.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: '34.1'
    text: |-
      De geluidreductie is het verschil tussen de toekomstige geluidsbelasting die door woningen zou worden ondervonden
      vanwege een weg of spoorweg in de situatie zonder maatregelen, en de toekomstige geluidsbelasting vanwege een weg
      of spoorweg in de situatie dat er geluidbeperkende maatregelen getroffen zijn.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel34
  - number: '34.2'
    text: |-
      Ingeval de berekende toekomstige geluidsbelasting, in de situatie dat er geluidbeperkende maatregelen zijn
      getroffen, lager is dan de waarde in tabel 2 van [bijlage 1][ref1], wordt bij toepassing van het eerste lid de
      waarde uit tabel 2 van bijlage 1 die op de betreffende situatie van toepassing is, gehanteerd als toekomstige
      geluidsbelasting vanwege de weg of spoorweg.


      [ref1]: https://wetten.overheid.nl/BWBR0031477
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0031477
  - number: 34a
    text: |-
      Ten behoeve van de toepassing van [artikel 32][ref1], [artikel 34, eerste lid][ref2], en
      [tabel 1 van bijlage 1][ref3] wordt gelijkgesteld aan een woning:


      [ref1]: https://wetten.overheid.nl/BWBR0031477#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0031477#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0031477
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0031477
        artikel: '32'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0031477
        artikel: '34'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0031477
  - number: 34a.a
    text: |-
      elke vijftien strekkende meter geluidsbelaste gevel van een geluidsgevoelig object, niet zijnde een woning, per
      bouwlaag;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel34a
  - number: 34a.b
    text: |-
      een standplaats als bedoeld in [artikel 1, onderdeel j, van de Wet op de huurtoeslag][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel1
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '1'
  - number: 34a.c
    text: een ligplaats in het water, bestemd om door een woonschip te worden ingenomen.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel34a
  - number: '35.1'
    text: 'Een verzoek tot vaststelling of wijziging van een geluidproductieplafond bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel35
  - number: 35.1.a
    text: een aanduiding van het gedeelte van de weg of spoorweg ten aanzien waarvan het verzoek wordt gedaan;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel35
  - number: 35.1.b
    text: een aanduiding van het referentiepunt ten aanzien waarvan het verzoek wordt gedaan;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel35
  - number: 35.1.c
    text: de gevraagde hoogte van het geluidproductieplafond;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel35
  - number: 35.1.d
    text: de te verwachten geluidproductie op het referentiepunt ten minste tien jaar na het indienen van het verzoek;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel35
  - number: 35.1.e
    text: |-
      de maatregelen die naar het oordeel van de beheerder op grond van [artikel 11.29, eerste lid, van de wet][ref1] in
      aanmerking moeten worden genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 35.1.f
    text: |-
      de maatregelen die naar het oordeel van de beheerder op grond van
      [artikel 11.29, tweede en derde lid, van de wet][ref1] in aanmerking kunnen worden genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 35.1.g
    text: de brongegevens behorende bij de aangevraagde geluidproductieplafonds;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel35
  - number: 35.1.h
    text: |-
      de resultaten van het akoestisch onderzoek, bedoeld in [artikel 11.33 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 35.1.i
    text: |-
      een verklaring van de beheerder in hoeverre het gedeelte van de weg of spoorweg, bedoeld in onderdeel a, voldoet
      aan de akoestische kwaliteit, bedoeld in [artikel 7][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031477#Artikel7
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0031477
        artikel: '7'
        hoofdstuk: '2'
  - number: 35.1.j
    text: |-
      een verslag van afstemming met de beheerders van andere geluidsbronnen als bedoeld in
      [artikel 11.30, vijfde lid][ref1], over maatregelen, die naar het oordeel van deze beheerders zouden kunnen worden
      getroffen, teneinde de effecten van de samenloop van de geluidbelasting vanwege de weg of spoorweg alsmede een
      andere geluidsbron als bedoeld in artikel 11.30, vijfde lid, te voorkomen of zoveel mogelijk te beperken.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: '35.2'
    text: |-
      Indien de beheerder een verzoek doet tot verlaging van geluidproductieplafonds als bedoeld in
      [artikel 11.63, eerste lid, van de wet][ref1], zijn de onderdelen d, e, f, h, i en j van het eerste lid niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: '35.3'
    text: |-
      Indien burgemeester en wethouders van een gemeente een verzoek doen tot verlaging van een geluidproductieplafond,
      zijn de onderdelen e, f en i van het eerste lid niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel35
  - number: '35.4'
    text: |-
      Onverminderd het derde lid, is het eerste lid, onderdeel d, niet van toepassing op een verzoek tot verlaging van
      het geluidproductieplafond als bedoeld in [artikel 11.28, vierde lid, van de wet][ref1], indien die verlaging
      niet groter zou zijn dan het effect van de in dat lid bedoelde maatregel. Het verzoek bevat tevens een weergave
      van de afspraken tussen gemeente en de beheerder, en de zienswijze van de beheerder ten aanzien van de verzochte
      verlaging.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: '36'
    text: |-
      Indien [artikel 11.42, eerste lid, van de wet][ref1] van toepassing is, bevat een verzoek tot wijziging of
      vaststelling van een geluidproductieplafond tevens de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 36.a
    text: |-
      een of meer kaarten als bedoeld in [artikel 39, onderdeel d][ref1], en een lijst met de adressen van de betrokken
      saneringsobjecten;


      [ref1]: https://wetten.overheid.nl/BWBR0031477#Artikel39
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0031477
        artikel: '39'
        hoofdstuk: '10'
  - number: 36.b
    text: |-
      de resultaten van het akoestisch onderzoek, bedoeld in [artikel 11.56, derde lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 36.c
    text: |-
      het tijdstip waarop naar verwachting met de uitvoering van de maatregelen ten behoeve van de sanering kan worden
      begonnen;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel36
  - number: 36.d
    text: de verwachte duur van de uitvoering van de maatregelen ten behoeve van de sanering.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel36
  - number: 36a
    text: |-
      Bij de wijziging van een geluidproductieplafond wordt het tweede tot en met het vijfde lid van
      [artikel 11.42 van de wet][ref1] buiten toepassing gelaten indien:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 36a.a
    text: als gevolg van de wijziging van het geluidproductieplafond geen saneringsobjecten ontstaan;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel36a
  - number: 36a.b
    text: |-
      als gevolg van de wijziging van het geluidproductieplafond de geluidsbelasting op de saneringsobjecten bij
      volledige benutting van het geluidproductieplafond niet toeneemt, en
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel36a
  - number: 36a.c
    text: |-
      een gecombineerde realisatie van in aanmerking komende geluidbeperkende maatregelen, gericht
      op het voldoen aan de waarde, bedoeld in [artikel 11.30, tweede lid][ref1], respectievelijk
      [artikel 11.42, tweede lid, van de wet][ref2], geen aanmerkelijke voordelen biedt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '11'
  - number: '37'
    text: |-
      Ten aanzien van de geluidsgevoelige objecten als bedoeld in
      [artikel 2, eerste lid, aanhef en onderdeel a tot en met g][ref1], die voor het aanbrengen van geluidwerende
      maatregelen aan de gevel in aanmerking worden genomen, is [hoofdstuk 6 van het Besluit geluidhinder][ref2] van
      overeenkomstige toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0031477#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020445#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0031477
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0020445
        hoofdstuk: '6'
  - number: 37.a
    text: |-
      de minister uitvoering geeft aan de [artikelen 6.4, tweede en derde lid][ref1], [6.6][ref2],
      [6.8, vierde lid][ref3], en [6.9, tweede, derde en vierde lid][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020445#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0020445#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0020445#Artikel6
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0020445
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0020445
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0020445
        artikel: '6'
  - number: 37.b
    text: |-
      in de [artikelen 6.2][ref1], [6.5][ref2], [6.8][ref3] en [6.10][ref4] in plaats van «het bevoegd gezag» telkens
      wordt gelezen «de beheerder»;


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020445#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0020445#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0020445#Artikel6
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0020445
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0020445
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0020445
        artikel: '6'
  - number: 37.c
    text: |-
      in plaats van «andere geluidsgevoelige gebouwen» telkens wordt gelezen «geluidsgevoelige objecten als bedoeld in
      [artikel 2, aanhef en onderdeel b tot en met g][ref1], van het Besluit geluid milieubeheer», en


      [ref1]: https://wetten.overheid.nl/BWBR0031477#Artikel2
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0031477
        artikel: '2'
        hoofdstuk: '1'
  - number: 37.d
    text: |-
      in plaats van «andere geluidsgevoelige gebouw» telkens wordt gelezen «geluidsgevoelige object, bedoeld in
      [artikel 2, aanhef en onderdeel b tot en met g][ref1], van het Besluit geluid milieubeheer».


      [ref1]: https://wetten.overheid.nl/BWBR0031477#Artikel2
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0031477
        artikel: '2'
        hoofdstuk: '1'
  - number: 37a.1
    text: |-
      Geluidsgevoelige objecten als bedoeld in [artikel 2, eerste lid, aanhef en onderdelen a tot en met g][ref1], komen
      niet voor het aanbrengen van geluidwerende maatregelen in aanmerking indien de verwachting bestaat dat zij binnen
      vijf jaar na het onherroepelijk worden van een besluit tot vaststelling of wijziging van een geluidproductieplafond
      waarin toepassing is gegeven aan [artikel 11.30, vierde of vijfde lid, van de wet][ref2] of een besluit tot
      vaststelling van een saneringsplan als bedoeld in [artikel 11.60 van de wet][ref3], zullen worden onteigend of dat
      de bewoning of het gebruik als geluidsgevoelig object om andere redenen binnen die termijn zal worden gestaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0031477#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0031477
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 37a.2
    text: |-
      Indien een geluidsgevoelig object op grond van het eerste lid niet in aanmerking komt voor het aanbrengen van
      geluidwerende maatregelen, wordt de eigenaar van het object hiervan schriftelijk op de hoogte gesteld.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel37a
  - number: '38.1'
    text: |-
      Als geluidproductieplafond als bedoeld in [artikel 11.45, tweede lid, van de wet][ref1] geldt voor zover het
      betreft in tabel 1, 2 of 3 van [bijlage 2][ref2] genoemde geprojecteerde delen van wegen en spoorwegen, of in
      tabel 1, 2 of 3 van bijlage 2 genoemde andere delen van wegen en spoorwegen, de berekende geluidproductie op
      de referentiepunten zoals bepaald op basis van de brongegevens afkomstig uit het betrokken besluit, mits dat is
      vastgesteld vóór het tijdstip van inwerkingtreding van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0031477
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0031477
  - number: '38.2'
    text: |-
      Als geluidproductieplafond als bedoeld in [artikel 11.45, tweede lid, van de wet][ref1] geldt voor delen van
      wegen en spoorwegen waarvoor een saneringsprogramma wordt uitgevoerd, het geluidproductieplafond zoals bepaald
      op grond van de berekende heersende geluidproductie op de referentiepunten, bedoeld in artikel 11.45, eerste lid,
      van de wet, met inbegrip van het effect van de in het betreffende saneringsprogramma opgenomen geluidbeperkende
      maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: '38.3'
    text: |-
      Als geluidproductieplafond als bedoeld in [artikel 11.45, tweede lid, van de wet][ref1] geldt voor zover het
      betreft de A59 Vlijmen–Nieuwkuijk, van kilometer 119,0 tot kilometer 127,2, het geluidproductieplafond zoals
      bepaald op grond van de berekende heersende geluidproductie op de referentiepunten, bedoeld in artikel 11.45,
      eerste lid, van de wet, met inbegrip van het effect van de reeds uitgevoerde overdrachtsmaatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: '38.4'
    text: |-
      Met betrekking tot de in de [bijlage 3][ref1] bij dit besluit aangewezen delen van wegen wordt bij het bepalen van
      de heersende geluidproducties op de referentiepunten, bedoeld in [artikel 11.45, vierde lid, van de wet][ref2],
      uitgegaan van een wegdek dat bestaat uit zeer open asfaltbeton.


      [ref1]: https://wetten.overheid.nl/BWBR0031477
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0031477
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '11'
  - number: '38.5'
    text: |-
      [Artikel 11.56, eerste lid, van de wet][ref1] is van overeenkomstige toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 38.5.a
    text: |-
      de in tabel 1, 2 of 3 van [bijlage 2][ref1] bij dit besluit aangewezen delen van wegen en spoorwegen, indien en
      voor zover dat is aangegeven in deze tabellen, en


      [ref1]: https://wetten.overheid.nl/BWBR0031477
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0031477
  - number: 38.5.b
    text: de A59 Vlijmen-Nieuwkuijk, van kilometer 120,8 tot kilometer 121,4 alsmede van kilometer 125,6 tot kilometer 126,4.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel38
  - number: '39'
    text: |-
      Bij een verzoek tot vaststelling van een saneringsplan worden naast de in
      [artikel 11.56, derde lid, van de wet][ref1] genoemde gegevens, de volgende gegevens overgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 39.a
    text: een lijst met de adressen van de betrokken saneringsobjecten;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel39
  - number: 39.b
    text: |-
      het wegnummer en de begrenzingen van de weg, inclusief de hectometrering, en het trajectnummer en de begrenzingen
      van de spoorweg, die onderdeel zijn van het saneringsplan;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel39
  - number: 39.c
    text: |-
      een beschrijving van de maatregelen als bedoeld in [artikel 11.59 van de wet][ref1] die naar het oordeel van de
      beheerder in aanmerking komen, en van het effect van deze maatregelen op de geluidsbelasting, vanwege de weg of
      spoorweg, van de gevel dan wel aan de grens van de betrokken saneringsobjecten;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 39.d
    text: |-
      een of meer kaarten die inzicht geven in het saneringsplan en die in ieder geval de plaats, aard en omvang van
      maatregelen, bedoeld in onderdeel c, bevatten;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel39
  - number: 39.e
    text: |-
      een beschrijving van de mogelijkheden om uit een oogpunt van doelmatigheid en kostenbeheersing de te treffen
      maatregelen al dan niet gezamenlijk uit te voeren met andere werken;
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel39
  - number: 39.f
    text: |-
      het tijdstip waarop met de uitvoering van de maatregelen kan worden begonnen, alsmede de verwachte duur van de
      uitvoering van de maatregelen.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel39
  - number: '40'
    text: |-
      De wegen en spoorwegen, bedoeld in [artikel 11.57, onderdeel c, van de wet][ref1], zijn genoemd in
      [bijlage 4][ref2] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0031477
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0031477
  - number: '41'
    text: |-
      De saneringsprojecten, bedoeld in
      [artikel XI, eerste lid, onderdeel e, van de Invoeringswet geluidproductieplafonds][ref1], zijn genoemd in
      [bijlage 5 ][ref2]bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0031679#ArtikelXI
      [ref2]: https://wetten.overheid.nl/BWBR0031477
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0031679
        artikel: XI
      - id: ref2
        bwb_id: BWBR0031477
  - number: '42'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel42
  - number: '43'
    text: 'Dit besluit wordt aangehaald als: Besluit geluid milieubeheer.'
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel43
