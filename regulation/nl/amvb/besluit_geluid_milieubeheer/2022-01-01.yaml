  - number: '7'
    text: |-
      1 De akoestische kwaliteit van een weg in beheer bij het Rijk is zodanig dat de geluidproductie vanwege die weg
      niet meer bedraagt dan die vanwege een weg met een wegdek dat bestaat uit zeer open asfaltbeton.

      2 De akoestische kwaliteit van een hoofdspoorweg is zodanig dat de geluidproductie vanwege die spoorweg niet meer
      bedraagt dan die vanwege een spoorweg met een constructie die bestaat uit langgelast spoor in een ballastbed op
      betonnen dwarsliggers.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel7
  - number: '8'
    text: |-
      1 Een geluidsbelastingkaart bestaat ten minste uit tabellen en uit een of meer geografische kaarten.

      2 De tabellen worden ingedeeld in de volgende geluidsbelastingklassen:

      a. voor geluidsbelasting: 55-59, 60–64, 65–69, 70–74, en groter dan of gelijk aan 75 dB;

      b. voor geluidsbelasting L: 50–54, 55–59, 60–64, 65–69, en groter dan of gelijk aan 70 dB.
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel8
  - number: '9'
    text: |-
      Deze paragraaf is van toepassing op de geluidsbelastingkaarten die krachtens
      [artikel 11.6, eerste en tweede lid, van de wet][ref1] worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11.6
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel9
    references:
