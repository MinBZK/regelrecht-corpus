    text: |-
      Bij ministeriële regeling kunnen met betrekking tot actieplannen nadere regels worden gesteld ter uitvoering
      van door de Europese Commissie opgestelde richtsnoeren als bedoeld in bijlage V, onderdeel 4, bij de richtlijn
      omgevingslawaai.
