preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Infrastructuur en Milieu van 12 juli 2011, nr. IenM/BSK-2011/101159,
    Hoofddirectie Bestuurlijke en Juridische Zaken;

    Gelet op richtlijn nr. 2002/49/EG van het Europees Parlement en de Raad van de Europese Unie van 25 juni 2002
    inzake de evaluatie en de beheersing van omgevingslawaai (PbEG L 189) en de artikelen 11.1, 11.3, 11.6, 11.7,
    11.11, 11.12, 11.13, 11.16, 11.22, 11.24, 11.29, 11.31, 11.39, 11.45, 11.56 en 11.57 van de Wet milieubeheer, en
    artikel 8a.45, eerste en tweede lid, van de Wet luchtvaart voor zover het betreft artikel 4;

    De Afdeling advisering van de Raad van State gehoord (advies van 23 februari 2012, nr. W14.11.0303/IV);

    Gezien het nader rapport van de Staatssecretaris van Infrastructuur en Milieu van 30 maart 2012, nr. IenM/BSK-
    2012/13195, Hoofddirectie Bestuurlijke en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *actieplan:* actieplan als bedoeld in de [artikelen 11.11][ref1] en [11.12 van de wet][ref2];
        - *agglomeratie:* krachtens [artikel 11.5 van de wet][ref3] als zodanig aangewezen gebied;
        - *belangrijke spoorweg:* hoofdspoorweg en krachtens [artikel 11.4, tweede lid, van de wet][ref4] gepubliceerd deel
      van een andere spoorweg dan een hoofdspoorweg;
        - *belangrijke weg:* weg in beheer bij het Rijk en krachtens [artikel 11.4, tweede lid, van de wet][ref5]
      gepubliceerd deel van een provinciale weg;
        - *bronmaatregel:* geluidbeperkende maatregel die de hoeveelheid geluid vanwege de geluidsbron beperkt bij de bron;
        - *cluster:* geluidsgevoelig object of verzameling bijeengelegen geluidsgevoelige objecten die een relevante
      verlaging van de geluidsbelasting vanwege een weg of spoorweg zou kunnen ondervinden van een aaneengesloten
      geluidbeperkende maatregel;
        - *concentratiegebied voor detailhandel en ambachtsbedrijven:* gebied waarvoor een gemeentelijke verordening geldt
      met zodanige geluidsnormen voor detailhandel en ambachtsbedrijven dat de geluidsbelasting 55 dB of meer of de
      geluidsbelasting L 50 dB of meer kan bedragen op omliggende woningen;
        - *concentratiegebied voor horeca-inrichtingen:* gebied waarvoor een gemeentelijke verordening geldt met zodanige
      geluidsnormen voor horeca-inrichtingen dat de geluidsbelasting 55 dB of meer of de geluidsbelasting L 50 dB of meer
      kan bedragen op omliggende woningen;
        - *dosis-effectrelatie:* relatie tussen de waarde van een geluidsbelastingsindicator en een schadelijk effect;
        - *geluidreductie:* geluidreductie als bepaald overeenkomstig [artikel 34][ref6] van dit besluit;
        - *geluidsbelastingkaart:* geluidsbelastingkaart als bedoeld in [artikel 11.6 van de wet][ref7];
        - *gevel:* bouwkundige constructie die een ruimte in een geluidsgevoelig object scheidt van de buitenlucht,
      daaronder begrepen het dak;
        - *maatregelpunt:* rekeneenheid waarin de kosten voor het treffen van een geluidbeperkende maatregel zijn
      uitgedrukt;
        - *overdrachtsmaatregel:* geluidbeperkende maatregel die de overdracht van geluid van de bron naar de ontvanger
      voorkomt of beperkt;
        - *reductiepunt:* rekeneenheid waarin het budget van een cluster voor het treffen van geluidbeperkende maatregelen
      is uitgedrukt;
        - *richtlijn omgevingslawaai:* richtlijn nr. 2002/49/EG van het Europees Parlement en de Raad van de Europese Unie
      van 25 juni 2002 inzake de evaluatie en de beheersing van omgevingslawaai (PbEG L 189);
        - *situatie zonder maatregelen:* situatie waarin a. een weg of spoorweg voldoet aan de akoestische kwaliteit,
      bedoeld in [artikel 7][ref8] van dit besluit, tenzij overwegende bezwaren van technische aard zich hiertegen
      verzetten, en b. geen geluidbeperkende maatregelen aanwezig zijn;
        - *wet:* [Wet milieubeheer][ref9];
        - *woning:* gebouw of gedeelte van een gebouw dat voor bewoning is bestemd.

      2 Indien de financiële doelmatigheid van een geluidbeperkende maatregel wordt bepaald in het kader van
      [afdeling 11.3.6 van de wet][ref10], bestaat een cluster, in afwijking van het eerste lid, uit een saneringsobject
      of een verzameling bijeengelegen saneringsobjecten die een relevante verlaging van de geluidsbelasting vanwege een
      weg of spoorweg zou kunnen ondervinden van een aaneengesloten geluidbeperkende maatregel.

      3 Indien de financiële doelmatigheid van een geluidbeperkende maatregel wordt bepaald in het kader van
      [artikel 11.47 van de wet][ref11], bestaat een cluster, in afwijking van het eerste lid, uit een of meer
      bijeengelegen geluidsgevoelige objecten als bedoeld in artikel 11.47, tweede lid, van de wet die een relevante
      verlaging van de geluidsbelasting vanwege een weg of spoorweg zouden kunnen ondervinden van een aaneengesloten
      geluidbeperkende maatregel.

      4 In afwijking van het eerste lid wordt bij de toepassing van dit besluit en de daarop berustende bepalingen onder
      gevel niet verstaan de gevel, die bij de procedures ten behoeve van de bouw van het betreffende geluidsgevoelige
      object op grond van [artikel 1b, vierde lid, van de Wet geluidhinder][ref12], niet als gevel in de zin van die wet
      is behandeld.

      5 In dit besluit en de daarop berustende bepalingen wordt onder een woning niet verstaan:

      a. een penitentiaire inrichting als bedoeld in [artikel 3, eerste lid, van de Penitentiaire inrichtingenwet][ref13];

      b. een justitiële jeugdinrichting als bedoeld in
      [artikel 3a van de Beginselenwet justitiële jeugdinrichtingen][ref14];

      c. een instelling als bedoeld in [artikel 1 van de Beginselenwet verpleging ter beschikking gestelden][ref15].


