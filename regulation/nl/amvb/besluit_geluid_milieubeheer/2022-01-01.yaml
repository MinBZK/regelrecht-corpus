  - number: '14'
    text: |-
      Op een geografische kaart die deel uitmaakt van een geluidsbelastingkaart worden aangegeven:

      a. de grenzen van de gemeente;

      b. de grenzen van de stille gebieden, bedoeld in [artikel 6][ref1], binnen de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0031477#Artikel6
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel14
    references:
