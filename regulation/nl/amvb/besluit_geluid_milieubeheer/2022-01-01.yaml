  - number: 37a
    text: |-
      1 Geluidsgevoelige objecten als bedoeld in [artikel 2, eerste lid, aanhef en onderdelen a tot en met g][ref1],
      komen niet voor het aanbrengen van geluidwerende maatregelen in aanmerking indien de verwachting bestaat
      dat zij binnen vijf jaar na het onherroepelijk worden van een besluit tot vaststelling of wijziging van een
      geluidproductieplafond waarin toepassing is gegeven aan [artikel 11.30, vierde of vijfde lid, van de wet][ref2] of
      een besluit tot vaststelling van een saneringsplan als bedoeld in [artikel 11.60 van de wet][ref3], zullen worden
      onteigend of dat de bewoning of het gebruik als geluidsgevoelig object om andere redenen binnen die termijn zal
      worden gestaakt.

      2 Indien een geluidsgevoelig object op grond van het eerste lid niet in aanmerking komt voor het aanbrengen van
      geluidwerende maatregelen, wordt de eigenaar van het object hiervan schriftelijk op de hoogte gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0031477#Artikel2
