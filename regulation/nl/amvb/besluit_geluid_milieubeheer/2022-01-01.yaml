  - number: '6'
    text: |-
      Als stille gebieden als bedoeld in [artikel 11.6, derde lid, onderdeel b, van de wet][ref1] worden aangewezen:

      a. de krachtens [artikel 1.2, tweede lid, onderdeel b, van de wet][ref2] bij provinciale milieuverordening
      aangewezen gebieden;

      b. de krachtens [artikel 4.9, derde lid, onderdeel c, van de wet][ref3] in de provinciale milieubeleidsplannen
      aangeduide gebieden waarin de kwaliteit van het milieu in verband met geluid bijzondere bescherming behoeft;

      c. de gebieden die bij gemeentelijke verordening als zodanig zijn aangewezen door een tot een agglomeratie
      behorende gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11.6
