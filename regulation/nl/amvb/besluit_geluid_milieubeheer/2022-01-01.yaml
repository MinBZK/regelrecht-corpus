        bwb_id: BWBR0003245
        afdeling: 11.3.6
  - number: '1.3'
    text: |-
      Indien de financiële doelmatigheid van een geluidbeperkende maatregel wordt bepaald in het kader van
      [artikel 11.47 van de wet][ref1], bestaat een cluster, in afwijking van het eerste lid, uit een of meer
      bijeengelegen geluidsgevoelige objecten als bedoeld in artikel 11.47, tweede lid, van de wet die een relevante
      verlaging van de geluidsbelasting vanwege een weg of spoorweg zouden kunnen ondervinden van een aaneengesloten
      geluidbeperkende maatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: '1.4'
    text: |-
      In afwijking van het eerste lid wordt bij de toepassing van dit besluit en de daarop berustende bepalingen onder
      gevel niet verstaan de gevel, die bij de procedures ten behoeve van de bouw van het betreffende geluidsgevoelige
      object op grond van [artikel 1b, vierde lid, van de Wet geluidhinder][ref1], niet als gevel in de zin van die wet
      is behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel1b
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel1
    references:
