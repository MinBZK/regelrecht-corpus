  - number: '36'
    text: |-
      Indien [artikel 11.42, eerste lid, van de wet][ref1] van toepassing is, bevat een verzoek tot wijziging of
      vaststelling van een geluidproductieplafond tevens de volgende gegevens:

      a. een of meer kaarten als bedoeld in [artikel 39, onderdeel d][ref2], en een lijst met de adressen van de
      betrokken saneringsobjecten;

      b. de resultaten van het akoestisch onderzoek, bedoeld in [artikel 11.56, derde lid, van de wet][ref3];

      c. het tijdstip waarop naar verwachting met de uitvoering van de maatregelen ten behoeve van de sanering kan worden
      begonnen;

      d. de verwachte duur van de uitvoering van de maatregelen ten behoeve van de sanering.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11.42
      [ref2]: https://wetten.overheid.nl/BWBR0031477#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel11.56
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel36
