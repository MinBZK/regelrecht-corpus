    text: 'In dit besluit en de daarop berustende bepalingen wordt onder een woning niet verstaan:'
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel1
  - number: 1.5.a
    text: |-
      een penitentiaire inrichting als bedoeld in [artikel 3, eerste lid, van de Penitentiaire inrichtingenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009709
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009709
  - number: 1.5.b
    text: |-
      een justitiële jeugdinrichting als bedoeld in [artikel 3a van de Beginselenwet justitiële jeugdinrichtingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel3a
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: 3a
  - number: 1.5.c
    text: |-
      een instelling als bedoeld in [artikel 1 van de Beginselenwet verpleging ter beschikking gestelden][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel1
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel1
    references:
