  - number: '1.2'
    text: |-
      Indien de financiële doelmatigheid van een geluidbeperkende maatregel wordt bepaald in het kader van
      [afdeling 11.3.6 van de wet][ref1], bestaat een cluster, in afwijking van het eerste lid, uit een saneringsobject
      of een verzameling bijeengelegen saneringsobjecten die een relevante verlaging van de geluidsbelasting vanwege een
      weg of spoorweg zou kunnen ondervinden van een aaneengesloten geluidbeperkende maatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Afdeling11.3.6
    url: https://wetten.overheid.nl/BWBR0031477/2022-01-01#Artikel1
    references:
