  - number: '21'
    text: |-
      Een wijziging van een van de bijlagen van de richtlijn waarnaar in dit besluit wordt verwezen, treedt voor de
      toepassing van dit besluit en de daarop gebaseerde bepalingen in werking met ingang van de dag waarop aan de
      betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0007497/2012-01-01#Artikel21
  - number: '22'
    text: |-
      1 De artikelen [4][ref1], [6][ref2], [7][ref3], [8][ref4], [9][ref5], [11][ref6] en [16][ref7] zijn niet van
      toepassing op explosieveilig elektrisch materieel, bestemd voor gebruik in explosieve atmosfeer dat is vervaardigd
      in overeenstemming met de regeling van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 19 april 1995,
      nr. 95/00856 (Stcrt.100) en voor 1 juli 2003 in de handel is gebracht en in bedrijf gesteld.

      2 De EG-certificaten van overeenstemming met de geharmoniseerde normen alsmede de controlecertificaten die zijn
      afgegeven overeenkomstig de in het eerste lid bedoelde regeling, zijn geldig tot en met 30 juni 2003, met dien
      verstande dat de EG-certificaten van overeenstemming alleen gelden voor de overeenstemming met de geharmoniseerde
      normen die in de richtlijnen waarnaar de regeling verwijst, zijn aangegeven.

      3 Het eerste en tweede lid zijn niet van toepassing op explosieveilig elektrisch materieel waarvan de certificaten
      voor 1 juli 2003 vervallen of voor zover het explosieveilig elektrisch materieel alsnog in overeenstemming met
      [artikel 4][ref8] wordt gebracht.

      4 Met betrekking tot het explosieveilig elektrisch materieel bedoeld in het eerste lid waarop dit besluit niet
      wordt toegepast en waarop ingevolge een of meer andere wettelijke regelingen de CE-markering wordt aangebracht,
      worden op de bij dat explosieveilig elektrisch materieel gevoegde documenten, handleidingen of gebruiksaanwijzingen
      de in het *Publikatieblad van de Europese Gemeenschappen* bekend gemaakte referenties van de aan die wettelijke
      regelingen ten grondslag liggende richtlijnen vermeld.


