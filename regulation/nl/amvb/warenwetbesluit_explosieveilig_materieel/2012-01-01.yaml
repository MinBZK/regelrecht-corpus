      - id: ref2
        bwb_id: BWBR0001969
        artikel: 7a
  - number: '2'
    text: |-
      Dit besluit en de daarop gebaseerde bepalingen zijn eveneens van toepassing op explosieveilig materieel indien dat
      onroerend is geworden tot aan het tijdstip van eerste ingebruikneming.
    url: https://wetten.overheid.nl/BWBR0007497/2012-01-01#Artikel2
  - number: '3'
    text: |-
      Dit besluit is niet van toepassing op:

      a. medische hulpmiddelen, bedoeld voor gebruik op medisch gebied;

      b. apparaten en beveiligingssystemen wanneer het explosiegevaar uitsluitend voortvloeit uit de aanwezigheid van
      explosieve stoffen of chemisch instabiele stoffen;

      c. apparaten, bedoeld voor gebruik in een huiselijke, niet-commerciële sfeer;

      d. persoonlijke beschermingsmiddelen die onder het [Warenwetbesluit persoonlijke beschermingsmiddelen][ref1]
      vallen;

      e. zeeschepen en mobiele offshore-installaties alsmede de uitrusting aan boord van deze schepen of installaties;

      f. voertuigen en aanhangwagens daarvan, die uitsluitend zijn bestemd voor het vervoer van personen in de lucht, via
      het wegen- of spoorwegnet of op het water en vervoermiddelen voor zover deze zijn ontworpen voor het vervoer van
      goederen in de lucht, via het openbare wegen- of spoorwegnet of op het water, behalve de voertuigen, bedoeld voor
      gebruik op plaatsen waar ontploffingsgevaar kan heersen;

      g. explosieveilig materieel, bestemd voor militaire doeleinden.


      [ref1]: https://wetten.overheid.nl/BWBR0005570
    url: https://wetten.overheid.nl/BWBR0007497/2012-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005570
  - number: 3a
    text: |-
      1 Het is verboden apparaten, beveiligingssystemen, componenten en voorzieningen te verhandelen, in bedrijf te
      stellen of te gebruiken, die niet voldoen aan de vervaardigingsvoorschriften gesteld bij of krachtens van dit
      besluit.

      2 Het is verboden apparaten, beveiligingssystemen, componenten en voorzieningen te verhandelen of te gebruiken
      anders dan met inachtneming van de voorschriften bij of krachtens dit besluit gesteld met betrekking tot de
      aanduiding en het bezigen van vermeldingen.

      3 Het is verboden apparaten, beveiligingssystemen, componenten en voorzieningen te verhandelen of te gebruiken,
      indien de bij of krachtens dit besluit voorgeschreven certificeringsprocedures niet in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0007497/2012-01-01#Artikel3a
  - number: '4'
    text: |-
      Explosieveilig materieel is zodanig ontworpen en vervaardigd, heeft zodanige eigenschappen en is van zodanige
      vermeldingen voorzien, dat het bij gebruik overeenkomstig zijn bestemming geen gevaar oplevert voor de veiligheid
      of gezondheid van de mens of voor de veiligheid van zaken, wanneer het op passende wijze is geïnstalleerd en
      onderhouden. Explosieveilig materieel voldoet aan de in bijlage II van de richtlijn opgenomen fundamentele eisen
      die daarop van toepassing zijn, rekening houdend met het bedoelde gebruik.
    url: https://wetten.overheid.nl/BWBR0007497/2012-01-01#Artikel4
  - number: '5'
    text: |-
      Explosieveilig materieel dat voldoet aan de door Onze Minister aangewezen geharmoniseerde normen wordt in zoverre
      vermoed te voldoen aan [artikel 4, tweede volzin][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007497#Artikel4
    url: https://wetten.overheid.nl/BWBR0007497/2012-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007497
        artikel: '4'
        hoofdstuk: II
  - number: '6'
    text: |-
      1 Apparaten, in voorkomend geval met inbegrip van de voorzieningen, worden al dan niet als model gekeurd en daartoe
      onderworpen aan een certificeringsprocedure overeenkomstig dit artikel, zijn voorzien van de in bijlage X van de
      richtlijn bedoelde CE-markering en gaan vergezeld van de in bijlage X van de richtlijn bedoelde EG-verklaring van
      overeenstemming.

      2 De in het eerste lid bedoelde CE-markering wordt uitsluitend aangebracht:

      a. op apparaten van de groepen I en II, categorieën M 1 respectievelijk 1, bedoeld in bijlage I van de richtlijn,
      waarvoor een certificaat van EG-typeonderzoek als bedoeld in bijlage III van de richtlijn is afgegeven en waarvoor
      tevens een van de volgende procedures is gevolgd:

      1°. de procedure van de produktiekwaliteitsborging, bedoeld in bijlage IV van de richtlijn, of

      2°. de procedure van de produktkeuring, bedoeld in bijlage V van de richtlijn;

      b. op apparaten van de groepen I en II, categorieën M 2 respectievelijk 2, bedoeld in bijlage I van de richtlijn,
      voor motoren met inwendige verbranding en elektrische apparaten van deze groepen en categorieën, waarvoor een
      certificaat van EG-typeonderzoek als bedoeld in bijlage III van de richtlijn is afgegeven en waarvoor tevens een
      van de volgende procedures is gevolgd:

      1°. de procedure van de overeenstemming met het type, bedoeld in bijlage VI van de richtlijn, of

      2°. de procedure van de produktkwaliteitsborging, bedoeld in bijlage VII van de richtlijn;

      c. op de overige apparaten van de in onderdeel *b* genoemde groepen en categorieën, bedoeld in bijlage I van de
      richtlijn, waarvoor de procedure van de interne fabricagecontrole, bedoeld in bijlage VIII van de richtlijn, is
      gevolgd en waarvoor tevens het in bijlage VIII van de richtlijn onder punt 3 bedoelde dossier is samengesteld en in
      bewaring is gesteld bij een aangewezen aangemelde instelling die de ontvangst daarvan schriftelijk heeft bevestigd;

      d. op apparaten van groep II, categorie 3, bedoeld in bijlage I van de richtlijn, waarvoor de procedure van de
      interne fabricagecontrole, bedoeld in bijlage VIII van de richtlijn, is gevolgd.

      3 In plaats van de in het tweede lid genoemde procedures kan ook de procedure van de EG-eenheidskeuring, bedoeld in
      bijlage IX van de richtlijn, worden gevolgd.
    url: https://wetten.overheid.nl/BWBR0007497/2012-01-01#Artikel6
  - number: '7'
    text: |-
      1 Beveiligingssystemen worden al dan niet als model gekeurd en daartoe onderworpen aan een certificeringsprocedure
      overeenkomstig het tweede lid, zijn voorzien van de in bijlage X van de richtlijn bedoelde CE-markering en gaan
      vergezeld van de in bijlage X van de richtlijn bedoelde EG-verklaring van overeenstemming.

      2 De in het eerste lid bedoelde CE-markering wordt uitsluitend aangebracht op beveiligingssystemen waarvoor:

      a. een certificaat van EG-typeonderzoek als bedoeld in bijlage III van de richtlijn is afgegeven en waarvoor tevens
      een van de procedures, genoemd in [artikel 6, tweede lid, onderdeel a][ref1], is gevolgd, of

      b. de procedure van de EG-eenheidskeuring, bedoeld in bijlage IX van de richtlijn, is gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0007497#Artikel6
    url: https://wetten.overheid.nl/BWBR0007497/2012-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007497
        artikel: '6'
        hoofdstuk: III
  - number: '8'
    text: |-
      Componenten worden al dan niet als model gekeurd en daartoe onderworpen aan een van de certificeringsprocedures,
      genoemd in [artikel 6, tweede of derde lid][ref1], met uitzondering van het aanbrengen van de CE-markering.
      Zij gaan vergezeld van een schriftelijke verklaring van overeenstemming waarin staat, dat deze componenten in
      overeenstemming zijn met dit besluit en waarin tevens de kenmerken van de componenten en de voorschriften voor
      het inbouwen in een apparaat of beveiligingssysteem die van belang zijn voor het voldoen aan de voor bedrijfsklare
      apparaten of beveiligingssystemen geldende fundamentele eisen, worden vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0007497#Artikel6
    url: https://wetten.overheid.nl/BWBR0007497/2012-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007497
        artikel: '6'
        hoofdstuk: III
  - number: '9'
    text: |-
      In plaats van de in de [artikelen 6][ref1] en [7][ref2] genoemde procedures kan voor de in bijlage II onder punt
      1.2.7. van de richtlijn bedoelde veiligheidsaspecten van apparaten en beveiligingssystemen, de in bijlage VIII van
      de richtlijn bedoelde procedure van interne fabricagecontrole worden gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0007497#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007497#Artikel7
    url: https://wetten.overheid.nl/BWBR0007497/2012-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007497
        artikel: '6'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0007497
        artikel: '7'
        hoofdstuk: III
  - number: '10'
    text: |-
      1 Wanneer de fabrikant, diens gemachtigde dan wel, indien zij geen van beiden in Nederland zijn gevestigd, degene
      die het explosieveilig materieel in Nederland in de handel brengt, voornemens is wijzigingen aan te brengen in
      het model van explosieveilig materieel waarvoor een certificaat van EG-typeonderzoek is afgegeven, stelt hij de
      aangewezen aangemelde instelling die dit certificaat heeft afgegeven hiervan onverwijld in kennis.

      2 De in het eerste lid bedoelde aangewezen aangemelde instelling beoordeelt de wijzigingen en deelt de in het
      eerste lid bedoelde persoon mee of het certificaat van EG-typeonderzoek voor het gewijzigde explosieveilig
      materieel geldig is dan wel aanvulling behoeft.

      3 Indien de in het eerste lid bedoelde aangewezen aangemelde instelling van oordeel is dat de wijzigingen van
      invloed kunnen zijn op de overeenstemming met de in bijlage II van de richtlijn bedoelde fundamentele eisen, wordt
      het gewijzigde model aan het in bijlage III van de richtlijn bedoelde EG-typeonderzoek onderworpen en wordt bij
      goedkeuring een aanvulling op het oorspronkelijke certificaat afgegeven.
    url: https://wetten.overheid.nl/BWBR0007497/2012-01-01#Artikel10
  - number: '11'
    text: |-
      De kosten van het EG-typeonderzoek, bedoeld in de [artikelen 6][ref1], [7][ref2] en [10, derde lid][ref3], en de
      beoordeling, bedoeld in artikel 10, tweede lid, zijn voor rekening van de fabrikant.


      [ref1]: https://wetten.overheid.nl/BWBR0007497#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007497#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0007497#Artikel10
    url: https://wetten.overheid.nl/BWBR0007497/2012-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007497
        artikel: '6'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0007497
        artikel: '7'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0007497
        artikel: '10'
        hoofdstuk: III
  - number: '12'
    text: |-
      Apparaten, beveiligingssystemen en voorzieningen die zijn voorzien van de CE-markering en vergezeld gaan van de
      EG-verklaring van overeenstemming alsmede componenten die vergezeld gaan van een schriftelijke verklaring van
      overeenstemming overeenkomstig [artikel 8][ref1], worden vermoed te voldoen aan [artikel 4, tweede volzin][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007497#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007497#Artikel4
    url: https://wetten.overheid.nl/BWBR0007497/2012-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007497
        artikel: '8'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0007497
        artikel: '4'
        hoofdstuk: II
  - number: '13'
    text: |-
      1 De CE-markering, in voorkomend geval gevolgd door het identificatienummer van de aangewezen aangemelde instelling
      alsmede het specifiek merkteken van explosiepreventie en de overige gegevens, bedoeld in bijlage II onder punt
      1.0.5. van de richtlijn, worden overeenkomstig die bijlage alsmede overeenkomstig bijlage X van de richtlijn
      duidelijk leesbaar en onuitwisbaar op de apparaten, beveiligingssystemen en voorzieningen aangebracht.

      2 Apparaten, beveiligingssystemen en voorzieningen hebben geen markeringen die derden kunnen misleiden omtrent de
      betekenis of grafische vorm van de CE-markering. Andere markeringen mogen worden aangebracht op voorwaarde dat de
      zichtbaarheid en leesbaarheid van de CE-markering niet wordt verminderd.
    url: https://wetten.overheid.nl/BWBR0007497/2012-01-01#Artikel13
  - number: '14'
    text: |-
      De aangewezen aangemelde instelling trekt een door haar afgegeven certificaat van EG-typeonderzoek in, indien
      de fundamentele eisen van bijlage II van de richtlijn zodanig zijn gewijzigd dat het model niet voldoet aan de
      gewijzigde eisen op het tijdstip waarop deze volgens de richtlijn van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0007497/2012-01-01#Artikel14
  - number: '16'
    text: |-
      [Artikel 3a][ref1] is niet van toepassing op het tentoonstellen en demonstreren op (jaar-)beurzen, exposities
      en bij demonstraties van explosieveilig materieel dat niet in overeenstemming is met dit besluit, mits op een
      zichtbaar bord duidelijk is aangegeven dat het niet in overeenstemming is met dit besluit en niet te koop is
      voordat het door de fabrikant of zijn in de Europese Economische Ruimte gevestigde gemachtigde, in overeenstemming
      is gebracht met dit besluit. Bij demonstraties worden alle nodige veiligheidsmaatregelen genomen om de bescherming
      van de mens te waarborgen.


      [ref1]: https://wetten.overheid.nl/BWBR0007497#Artikel3a
    url: https://wetten.overheid.nl/BWBR0007497/2012-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007497
        artikel: 3a
        hoofdstuk: IA
  - number: '17'
    text: |-
      1 Als aangewezen aangemelde instelling kan worden aangewezen de instelling die:

      a. rechtspersoonlijkheid heeft;

      b. onafhankelijk is;

      c. beschikt over de deskundigheid en outillage die nodig zijn om de uitvoering van de taken waarvoor zij aangewezen
      wil worden, naar behoren te kunnen vervullen;

      d. beschikt over een registratiesysteem waarin de gegevens die samenhangen met en betrekking hebben op de
      uitvoering van de taken waarvoor zij aangewezen wil worden, naar behoren vastgelegd kunnen worden. Aan de hand
      van deze gegevens zijn het gekeurde explosieveilig materieel en de onderzochte kwaliteitssystemen afdoende te
      identificeren;

      e. verzekerd is tegen wettelijke aansprakelijkheid voor de risico's die voortvloeien uit de uitoefening van de
      taken waarvoor zij aangewezen wil worden;

      f. een overeenkomst heeft gesloten met de in voorkomend geval aanwezige beheerstichting die de krachtens dit
      besluit geregelde certificatieschema’s beheert; en

      g. naar behoren functioneert.

      2 In aanvulling op het eerste lid komt voor aanwijzing als aangewezen aangemelde instelling slechts in aanmerking
      de instelling die ten minste voldoet aan de in bijlage XI bij de richtlijn neergelegde voorwaarden.

      3 Bij ministerïele regeling worden nadere regels gesteld met betrekking tot het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0007497/2012-01-01#Artikel17
  - number: 17a
    text: |-
      1 De instelling, bedoeld in [artikel 17][ref1], dient de aanvraag tot aanwijzing in bij Onze Minister.

      2 De instelling doet de aanvraag vergezellen van een beoordeling door de Stichting Raad voor Accreditatie te
      Utrecht, waaruit blijkt dat zij voldoet aan de criteria, genoemd in [artikel 17, eerste lid][ref2], en van het
      bewijs dat is voldaan aan de voorwaarden, genoemd artikel 17, tweede lid.

      3 Bij ministerïele regeling kunnen nadere regels worden gesteld met betrekking tot de indiening van de aanvraag, de
      beoordeling, het bewijs, bedoeld in het tweede lid, en de afhandeling van de aanvraag.

      4 De kosten van de beoordeling en het bewijs zijn voor rekening van de aanvragende instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0007497#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0007497#Artikel17
    url: https://wetten.overheid.nl/BWBR0007497/2012-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0007497
        artikel: '17'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0007497
        artikel: '17'
        hoofdstuk: V
  - number: 17b
    text: |-
      1 Een aanwijzing als aangewezen aangemelde instelling wordt geweigerd indien:

      a. de aanvragende instelling niet heeft voldaan aan het bepaalde bij of krachtens de [artikelen 17][ref1] of
      [17a][ref2]; of

      b. ten hoogste twaalf maanden voorafgaand aan de datum van indiening van de aanvraag tot aanwijzing, sprake was van
      een weigering om de aanvragende instelling aan te wijzen en de weigering of intrekking is geschied op grond van aan
      de aanvragende instelling toe te rekenen feiten of omstandigheden.

      2 De aanvraag wordt in het geval, genoemd in het eerste lid, onder b, eerst in behandeling genomen nadat twaalf
      maanden, te rekenen vanaf de dag na de datum van de weigering respectievelijk van de intrekking, zijn verstreken.

      3 Een aanwijzing kan worden geschorst, ten nadele van de aangemelde instelling worden gewijzigd of ingetrokken:

      a. op grond van feiten of omstandigheden waarvan Onze Minister bij de aanwijzing redelijkerwijs niet
      op de hoogte kon zijn en op grond waarvan hij de aanwijzing niet of alleen met voorschriften bedoeld in
      [artikel 7a, vierde lid, van de wet][ref3] zou hebben gegeven;

      b. op grond van door de aangewezen aangemelde instelling verstrekte onjuiste inlichtingen over feiten of
      omstandigheden, mits de onjuistheid daarvan aan deze instelling bekend was of kon zijn;

      c. indien de aangewezen aangemelde instelling niet meer voldoet aan het bepaalde bij of krachtens
      [artikel 17][ref4];

      d. indien de aangewezen aangemelde instelling gedurende een aaneengesloten periode van twee jaren geen
      werkzaamheden waarvoor zij is aangewezen, heeft uitgevoerd; of

      e. indien de aangewezen aangemelde instelling haar wettelijke verplichtingen niet meer naar behoren nakomt of de
      taken waarvoor zij is aangewezen, niet meer naar behoren uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0007497#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0007497#Artikel17a
      [ref3]: https://wetten.overheid.nl/BWBR0001969#Artikel7a
