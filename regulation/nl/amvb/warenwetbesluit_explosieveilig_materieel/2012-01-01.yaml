      Dit besluit treedt in werking met ingang van 1 maart 1996 met uitzondering van:

      a. [artikel 24, onderdeel A en onderdeel B][ref1], voorzover het betreft
      [artikel 4, onderdeel f, van het Liftenbesluit I][ref2] dat in werking treedt met ingang van de dag na de datum van
      uitgifte van het *Staatsblad* waarin dit besluit wordt geplaatst en dat terugwerkt tot en met 1 januari 1995,

      b. [artikel 24, onderdeel B][ref3], voorzover het betreft [artikel 4, onderdeel g, van het Liftenbesluit I][ref4]
      dat in werking treedt met ingang van 1 januari 1997,

      c. [artikel 24, onderdeel C][ref5], en [artikel 26][ref6] die in werking treden met ingang van de dag na de datum
      van uitgifte van het *Staatsblad* waarin dit besluit wordt geplaatst.


