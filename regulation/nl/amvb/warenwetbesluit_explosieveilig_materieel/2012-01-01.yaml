  - number: 17c
    text: |-
      1 Tijdens de looptijd van de aanwijzing stelt Onze Minister periodiek vast of deze instelling:

      a. nog voldoet aan het bepaalde bij of krachtens [artikel 17][ref1]; en

      b. haar wettelijke verplichtingen naar behoren nakomt en de taken waarvoor zij is aangewezen, naar behoren
      uitvoert.

      2 Ten behoeve van de periodieke vaststelling laat Onze Minister de Stichting Raad voor Accreditatie te Utrecht ter
      zake een beoordeling doen.

      3 Bij ministerïele regeling kunnen nadere regels worden gesteld met betrekking tot de periodieke vaststelling en
      de beoordeling.

      4 De kosten van de beoordeling zijn voor rekening van de aangewezen aangemelde instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0007497#Artikel17
    url: https://wetten.overheid.nl/BWBR0007497/2012-01-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0007497
        artikel: '17'
        hoofdstuk: V
  - number: 17d
    text: |-
      1 De aangewezen aangemelde instelling verstrekt de Stichting Raad voor Accreditatie te Utrecht desgevraagd
      kosteloos alle informatie die deze nodig heeft bij de uitvoering van het bepaalde bij of krachtens
      [artikel 17c][ref1].

      2 Bij ministeriele regeling worden nadere regels gesteld betreffende het kosteloos verstrekken van gegevens en
      inlichtingen door een aangewezen instelling aan Onze Minister of de toezichthouder respectievelijk door Onze
      Minister of de toezichthouder aan de in het eerste lid genoemde Stichting Raad voor Accreditatie of een aangewezen
      instelling, die zijn verkregen door de uitvoering of het toezicht op de naleving van het bepaalde bij of krachtens
      de [wet][ref2], welke noodzakelijk zijn voor de uitvoering van hun wettelijke taken.


      [ref1]: https://wetten.overheid.nl/BWBR0007497#Artikel17c
      [ref2]: https://wetten.overheid.nl/BWBR0001969
