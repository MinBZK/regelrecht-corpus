preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 3 februari 1995, Directie
    Wetgeving, Bestuurlijke en Juridische Aangelegenheden, Nr. WBJA/95/0003;

    Gelet op richtlijn nr. 94/9/EG van het Europees Parlement en de Raad van de Europese Unie van 23 maart 1994 inzake
    de onderlinge aanpassing van de wetgevingen van de Lid-Staten betreffende apparaten en beveiligingssystemen bedoeld
    voor gebruik op plaatsen waar ontploffingsgevaar kan heersen (PbEG L 100);

    Gelet op de artikelen 1, eerste lid, onderdelen a en b,2, 3, eerste en tweede lid,6, 12, derde lid, en 25a van de
    Wet op de gevaarlijke werktuigen;

    De Raad van State gehoord (advies van 19 april 1995, kenmerk W12.95.0059);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 13 juli 1995, Directie
    Wetgeving, Bestuurlijke en Juridische Aangelegenheden, Nr. WBJA/W2/95/0867;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007497/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop gebaseerde bepalingen wordt verstaan onder:

      a. wet: [Warenwet][ref1];

      b. apparaten: machines, materieel, vaste of mobiele inrichtingen, bedieningsorganen en instrumenten alsmede
      detectie- en preventiesystemen die, alleen of in combinatie, bestemd zijn voor produktie, transport,
      opslag, meting, regeling, energieomzetting of grondstoffenverwerking en die door hun inherente potentiële
      ontstekingsbronnen in een explosieve atmosfeer een explosie kunnen veroorzaken;

      c. apparaten van groep I: apparaten, bedoeld voor ondergrondse werkzaamheden in mijnen en in bovengrondse
      mijninstallaties, waar ten gevolge van mijngas of brandbaar stof gevaar heerst of kan heersen;

      d. apparaten van groep II: apparaten, bedoeld voor gebruik op andere plaatsen dan genoemd onder c, waar ten gevolge
      van de explosieve atmosfeer gevaar kan heersen;

      e. beveiligingssystemen: inrichtingen, niet zijnde componenten van de onder *b* tot en met *d* omschreven
      apparaten, die de functie hebben beginnende explosies onmiddellijk te stoppen of de door een explosie getroffen
      zone te beperken en die afzonderlijk in de handel worden gebracht als systemen met autonome functies;

      f. componenten: onderdelen van apparaten en beveiligingssystemen die essentieel zijn voor de veilige werking maar
      geen autonome functie hebben;

      g. voorzieningen: veiligheids-, controle- en regelvoorzieningen, bedoeld voor gebruik buiten plaatsen waar
      ontploffingsgevaar kan heersen, maar die nodig zijn voor of bijdragen tot de veilige werking van apparaten en
      beveiligingssystemen;

      h. explosieveilig materieel: apparaten, beveiligingssystemen, componenten en voorzieningen;

      i. explosieve atmosfeer: mengsel van lucht en brandbare stoffen in de vorm van gassen, dampen, nevels of stof,
      onder atmosferische omstandigheden waarin de verbranding zich na ontsteking uitbreidt tot het gehele niet-verbrande
      mengsel;

      j. plaats waar ontploffingsgevaar kan heersen: plaats waar ten gevolge van plaatselijke- en bedrijfsomstandigheden
      een explosieve atmosfeer kan ontstaan;

      k. bedoeld gebruik: gebruik van apparaten, beveiligingssystemen en voorzieningen overeenkomstig de apparatengroep
      en apparatencategorie alsmede overeenkomstig alle door de fabrikant verstrekte aanwijzingen die noodzakelijk zijn
      om de veilige werking van de apparaten, beveiligingssystemen en voorzieningen te waarborgen;

      l. Europese Economische Ruimte: het grondgebied waarop de Overeenkomst betreffende de Europese Economische Ruimte
      van toepassing is;

      m. aangewezen aangemelde instelling: een krachtens [artikel 7a van de wet][ref2] in het kader van de richtlijn
      aangewezen en bij de Commissie van de Europese Gemeenschappen aangemelde instelling, dan wel een door een andere
      staat die partij is bij de Overeenkomst inzake de Europese Economische Ruimte in het kader van de richtlijn
      aangewezen en bij de Commissie van de Europese Gemeenschappen in het kader van de richtlijn aangemelde instelling;

      n. richtlijn: [richtlijn nr. 94/9/EG](31994L0009) van het Europees Parlement en de Raad van de Europese Unie
      van 23 maart 1994 inzake de onderlinge aanpassing van de wetgevingen van de Lid-Staten betreffende apparaten en
      beveiligingssystemen bedoeld voor gebruik op plaatsen waar ontploffingsgevaar kan heersen (*PbEG* L 100).


      [ref1]: https://wetten.overheid.nl/BWBR0001969
      [ref2]: https://wetten.overheid.nl/BWBR0001969#Artikel7a
    url: https://wetten.overheid.nl/BWBR0007497/2012-01-01#Artikel1
    references:
      - id: ref1
