        hoofdstuk: III
      - id: ref7
        bwb_id: BWBR0007497
        artikel: '16'
        hoofdstuk: IV
  - number: '22.2'
    text: |-
      De EG-certificaten van overeenstemming met de geharmoniseerde normen alsmede de controlecertificaten die zijn
      afgegeven overeenkomstig de in het eerste lid bedoelde regeling, zijn geldig tot en met 30 juni 2003, met dien
      verstande dat de EG-certificaten van overeenstemming alleen gelden voor de overeenstemming met de geharmoniseerde
      normen die in de richtlijnen waarnaar de regeling verwijst, zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel22
  - number: '22.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op explosieveilig elektrisch materieel waarvan de certificaten
      voor 1 juli 2003 vervallen of voor zover het explosieveilig elektrisch materieel alsnog in overeenstemming met
      [artikel 4][ref1] wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007497#Artikel4
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007497
        artikel: '4'
        hoofdstuk: II
  - number: '22.4'
    text: |-
      Met betrekking tot het explosieveilig elektrisch materieel bedoeld in het eerste lid waarop dit besluit niet wordt
      toegepast en waarop ingevolge een of meer andere wettelijke regelingen de CE-markering wordt aangebracht, worden op
      de bij dat explosieveilig elektrisch materieel gevoegde documenten, handleidingen of gebruiksaanwijzingen de in het
      *Publikatieblad van de Europese Gemeenschappen* bekend gemaakte referenties van de aan die wettelijke regelingen
      ten grondslag liggende richtlijnen vermeld.
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel22
  - number: '23.1'
    text: |-
      Dit besluit is niet van toepassing op explosieveilig materieel dat vóór 1 maart 1996 in de Europese Economische
      Ruimte in de handel is gebracht en in gebruik is genomen behoudens indien het na dit tijdstip een ingrijpende
      wijziging heeft ondergaan.
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel23
  - number: '23.2'
    text: |-
      [Artikel 22, vierde lid][ref1], is van overeenkomstige toepassing op explosieveilig materieel bedoeld in het eerste
      lid waarop ingevolge een of meer andere wettelijke regelingen de CE-markering wordt aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007497#Artikel22
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007497
        artikel: '22'
        hoofdstuk: VII
