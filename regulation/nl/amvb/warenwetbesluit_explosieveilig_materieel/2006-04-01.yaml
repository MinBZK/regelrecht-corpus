---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: warenwetbesluit_explosieveilig_materieel
regulatory_layer: AMVB
publication_date: '2016-02-22'
valid_from: '2006-04-01'
bwb_id: BWBR0007497
url: https://wetten.overheid.nl/BWBR0007497/2006-04-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 3 februari 1995, Directie
    Wetgeving, Bestuurlijke en Juridische Aangelegenheden, Nr. WBJA/95/0003;

    Gelet op richtlijn nr. 94/9/EG van het Europees Parlement en de Raad van de Europese Unie van 23 maart 1994 inzake
    de onderlinge aanpassing van de wetgevingen van de Lid-Staten betreffende apparaten en beveiligingssystemen bedoeld
    voor gebruik op plaatsen waar ontploffingsgevaar kan heersen (PbEG L 100);

    Gelet op de artikelen 1, eerste lid, onderdelen a en b,2, 3, eerste en tweede lid,6, 12, derde lid, en 25a van de
    Wet op de gevaarlijke werktuigen;

    De Raad van State gehoord (advies van 19 april 1995, kenmerk W12.95.0059);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 13 juli 1995, Directie
    Wetgeving, Bestuurlijke en Juridische Aangelegenheden, Nr. WBJA/W2/95/0867;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop gebaseerde bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel1
  - number: 1.a
    text: |-
      wet: [Warenwet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0001969
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001969
  - number: 1.b
    text: |-
      apparaten: machines, materieel, vaste of mobiele inrichtingen, bedieningsorganen en instrumenten alsmede detectie-
      en preventiesystemen die, alleen of in combinatie, bestemd zijn voor produktie, transport, opslag, meting,
      regeling, energieomzetting of grondstoffenverwerking en die door hun inherente potentiële ontstekingsbronnen in een
      explosieve atmosfeer een explosie kunnen veroorzaken;
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel1
  - number: 1.c
    text: |-
      apparaten van groep I: apparaten, bedoeld voor ondergrondse werkzaamheden in mijnen en in bovengrondse
      mijninstallaties, waar ten gevolge van mijngas of brandbaar stof gevaar heerst of kan heersen;
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel1
  - number: 1.d
    text: |-
      apparaten van groep II: apparaten, bedoeld voor gebruik op andere plaatsen dan genoemd onder c, waar ten gevolge
      van de explosieve atmosfeer gevaar kan heersen;
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel1
  - number: 1.e
    text: |-
      beveiligingssystemen: inrichtingen, niet zijnde componenten van de onder *b* tot en met *d* omschreven apparaten,
      die de functie hebben beginnende explosies onmiddellijk te stoppen of de door een explosie getroffen zone te
      beperken en die afzonderlijk in de handel worden gebracht als systemen met autonome functies;
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel1
  - number: 1.f
    text: |-
      componenten: onderdelen van apparaten en beveiligingssystemen die essentieel zijn voor de veilige werking maar geen
      autonome functie hebben;
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel1
  - number: 1.g
    text: |-
      voorzieningen: veiligheids-, controle- en regelvoorzieningen, bedoeld voor gebruik buiten plaatsen waar
      ontploffingsgevaar kan heersen, maar die nodig zijn voor of bijdragen tot de veilige werking van apparaten en
      beveiligingssystemen;
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel1
  - number: 1.h
    text: 'explosieveilig materieel: apparaten, beveiligingssystemen, componenten en voorzieningen;'
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel1
  - number: 1.i
    text: |-
      explosieve atmosfeer: mengsel van lucht en brandbare stoffen in de vorm van gassen, dampen, nevels of stof, onder
      atmosferische omstandigheden waarin de verbranding zich na ontsteking uitbreidt tot het gehele niet-verbrande
      mengsel;
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel1
  - number: 1.j
    text: |-
      plaats waar ontploffingsgevaar kan heersen: plaats waar ten gevolge van plaatselijke- en bedrijfsomstandigheden een
      explosieve atmosfeer kan ontstaan;
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel1
  - number: 1.k
    text: |-
      bedoeld gebruik: gebruik van apparaten, beveiligingssystemen en voorzieningen overeenkomstig de apparatengroep en
      apparatencategorie alsmede overeenkomstig alle door de fabrikant verstrekte aanwijzingen die noodzakelijk zijn om
      de veilige werking van de apparaten, beveiligingssystemen en voorzieningen te waarborgen;
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel1
  - number: 1.l
    text: |-
      Europese Economische Ruimte: het grondgebied waarop de Overeenkomst betreffende de Europese Economische Ruimte van
      toepassing is;
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel1
  - number: 1.m
    text: |-
      aangewezen aangemelde instelling: een krachtens [artikel 7a van de wet][ref1] in het kader van de richtlijn
      aangewezen en bij de Commissie van de Europese Gemeenschappen aangemelde instelling, dan wel een door een andere
      staat die partij is bij de Overeenkomst inzake de Europese Economische Ruimte in het kader van de richtlijn
      aangewezen en bij de Commissie van de Europese Gemeenschappen in het kader van de richtlijn aangemelde instelling;


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel7a
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 7a
  - number: 1.n
    text: |-
      richtlijn: [richtlijn nr. 94/9/EG](31994L0009) van het Europees Parlement en de Raad van de Europese Unie van
      23 maart 1994 inzake de onderlinge aanpassing van de wetgevingen van de Lid-Staten betreffende apparaten en
      beveiligingssystemen bedoeld voor gebruik op plaatsen waar ontploffingsgevaar kan heersen (*PbEG* L 100).
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel1
  - number: '2'
    text: |-
      Dit besluit en de daarop gebaseerde bepalingen zijn eveneens van toepassing op explosieveilig materieel indien dat
      onroerend is geworden tot aan het tijdstip van eerste ingebruikneming.
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel2
  - number: '3'
    text: 'Dit besluit is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel3
  - number: 3.a
    text: medische hulpmiddelen, bedoeld voor gebruik op medisch gebied;
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel3
  - number: 3.b
    text: |-
      apparaten en beveiligingssystemen wanneer het explosiegevaar uitsluitend voortvloeit uit de aanwezigheid van
      explosieve stoffen of chemisch instabiele stoffen;
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel3
  - number: 3.c
    text: apparaten, bedoeld voor gebruik in een huiselijke, niet-commerciële sfeer;
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel3
  - number: 3.d
    text: |-
      persoonlijke beschermingsmiddelen die onder het [Warenwetbesluit persoonlijke beschermingsmiddelen][ref1] vallen;


      [ref1]: https://wetten.overheid.nl/BWBR0005570
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005570
  - number: 3.e
    text: zeeschepen en mobiele offshore-installaties alsmede de uitrusting aan boord van deze schepen of installaties;
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel3
  - number: 3.f
    text: |-
      voertuigen en aanhangwagens daarvan, die uitsluitend zijn bestemd voor het vervoer van personen in de lucht, via
      het wegen- of spoorwegnet of op het water en vervoermiddelen voor zover deze zijn ontworpen voor het vervoer van
      goederen in de lucht, via het openbare wegen- of spoorwegnet of op het water, behalve de voertuigen, bedoeld voor
      gebruik op plaatsen waar ontploffingsgevaar kan heersen;
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel3
  - number: 3.g
    text: explosieveilig materieel, bestemd voor militaire doeleinden.
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel3
  - number: 3a.1
    text: |-
      Het is verboden apparaten, beveiligingssystemen, componenten en voorzieningen te verhandelen, in bedrijf te stellen
      of te gebruiken, die niet voldoen aan de vervaardigingsvoorschriften gesteld bij of krachtens van dit besluit.
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel3a
  - number: 3a.2
    text: |-
      Het is verboden apparaten, beveiligingssystemen, componenten en voorzieningen te verhandelen of te gebruiken anders
      dan met inachtneming van de voorschriften bij of krachtens dit besluit gesteld met betrekking tot de aanduiding en
      het bezigen van vermeldingen.
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel3a
  - number: 3a.3
    text: |-
      Het is verboden apparaten, beveiligingssystemen, componenten en voorzieningen te verhandelen of te gebruiken,
      indien de bij of krachtens dit besluit voorgeschreven certificeringsprocedures niet in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel3a
  - number: '4'
    text: |-
      Explosieveilig materieel is zodanig ontworpen en vervaardigd, heeft zodanige eigenschappen en is van zodanige
      vermeldingen voorzien, dat het bij gebruik overeenkomstig zijn bestemming geen gevaar oplevert voor de veiligheid
      of gezondheid van de mens of voor de veiligheid van zaken, wanneer het op passende wijze is geïnstalleerd en
      onderhouden. Explosieveilig materieel voldoet aan de in bijlage II van de richtlijn opgenomen fundamentele eisen
      die daarop van toepassing zijn, rekening houdend met het bedoelde gebruik.
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel4
  - number: '5'
    text: |-
      Explosieveilig materieel dat voldoet aan de door Onze Minister aangewezen geharmoniseerde normen wordt in zoverre
      vermoed te voldoen aan [artikel 4, tweede volzin][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007497#Artikel4
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007497
        artikel: '4'
        hoofdstuk: II
  - number: '6.1'
    text: |-
      Apparaten, in voorkomend geval met inbegrip van de voorzieningen, worden al dan niet als model gekeurd en daartoe
      onderworpen aan een certificeringsprocedure overeenkomstig dit artikel, zijn voorzien van de in bijlage X van de
      richtlijn bedoelde CE-markering en gaan vergezeld van de in bijlage X van de richtlijn bedoelde EG-verklaring van
      overeenstemming.
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel6
  - number: '6.2'
    text: 'De in het eerste lid bedoelde CE-markering wordt uitsluitend aangebracht:'
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel6
  - number: 6.2.a
    text: |-
      op apparaten van de groepen I en II, categorieën M 1 respectievelijk 1, bedoeld in bijlage I van de richtlijn,
      waarvoor een certificaat van EG-typeonderzoek als bedoeld in bijlage III van de richtlijn is afgegeven en waarvoor
      tevens een van de volgende procedures is gevolgd:
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel6
  - number: 6.2.a.1°
    text: de procedure van de produktiekwaliteitsborging, bedoeld in bijlage IV van de richtlijn, of
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel6
  - number: 6.2.a.2°
    text: de procedure van de produktkeuring, bedoeld in bijlage V van de richtlijn;
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel6
  - number: 6.2.b
    text: |-
      op apparaten van de groepen I en II, categorieën M 2 respectievelijk 2, bedoeld in bijlage I van de richtlijn,
      voor motoren met inwendige verbranding en elektrische apparaten van deze groepen en categorieën, waarvoor een
      certificaat van EG-typeonderzoek als bedoeld in bijlage III van de richtlijn is afgegeven en waarvoor tevens een
      van de volgende procedures is gevolgd:
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel6
  - number: 6.2.b.1°
    text: de procedure van de overeenstemming met het type, bedoeld in bijlage VI van de richtlijn, of
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel6
  - number: 6.2.b.2°
    text: de procedure van de produktkwaliteitsborging, bedoeld in bijlage VII van de richtlijn;
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel6
  - number: 6.2.c
    text: |-
      op de overige apparaten van de in onderdeel *b* genoemde groepen en categorieën, bedoeld in bijlage I van de
      richtlijn, waarvoor de procedure van de interne fabricagecontrole, bedoeld in bijlage VIII van de richtlijn, is
      gevolgd en waarvoor tevens het in bijlage VIII van de richtlijn onder punt 3 bedoelde dossier is samengesteld en in
      bewaring is gesteld bij een aangewezen aangemelde instelling die de ontvangst daarvan schriftelijk heeft bevestigd;
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel6
  - number: 6.2.d
    text: |-
      op apparaten van groep II, categorie 3, bedoeld in bijlage I van de richtlijn, waarvoor de procedure van de interne
      fabricagecontrole, bedoeld in bijlage VIII van de richtlijn, is gevolgd.
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel6
  - number: '6.3'
    text: |-
      In plaats van de in het tweede lid genoemde procedures kan ook de procedure van de EG-eenheidskeuring, bedoeld in
      bijlage IX van de richtlijn, worden gevolgd.
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel6
  - number: '7.1'
    text: |-
      Beveiligingssystemen worden al dan niet als model gekeurd en daartoe onderworpen aan een certificeringsprocedure
      overeenkomstig het tweede lid, zijn voorzien van de in bijlage X van de richtlijn bedoelde CE-markering en gaan
      vergezeld van de in bijlage X van de richtlijn bedoelde EG-verklaring van overeenstemming.
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel7
  - number: '7.2'
    text: 'De in het eerste lid bedoelde CE-markering wordt uitsluitend aangebracht op beveiligingssystemen waarvoor:'
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel7
  - number: 7.2.a
    text: |-
      een certificaat van EG-typeonderzoek als bedoeld in bijlage III van de richtlijn is afgegeven en waarvoor tevens
      een van de procedures, genoemd in [artikel 6, tweede lid, onderdeel a][ref1], is gevolgd, of


      [ref1]: https://wetten.overheid.nl/BWBR0007497#Artikel6
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007497
        artikel: '6'
        hoofdstuk: III
  - number: 7.2.b
    text: de procedure van de EG-eenheidskeuring, bedoeld in bijlage IX van de richtlijn, is gevolgd.
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel7
  - number: '8'
    text: |-
      Componenten worden al dan niet als model gekeurd en daartoe onderworpen aan een van de certificeringsprocedures,
      genoemd in [artikel 6, tweede of derde lid][ref1], met uitzondering van het aanbrengen van de CE-markering.
      Zij gaan vergezeld van een schriftelijke verklaring van overeenstemming waarin staat, dat deze componenten in
      overeenstemming zijn met dit besluit en waarin tevens de kenmerken van de componenten en de voorschriften voor
      het inbouwen in een apparaat of beveiligingssysteem die van belang zijn voor het voldoen aan de voor bedrijfsklare
      apparaten of beveiligingssystemen geldende fundamentele eisen, worden vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0007497#Artikel6
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007497
        artikel: '6'
        hoofdstuk: III
  - number: '9'
    text: |-
      In plaats van de in de [artikelen 6][ref1] en [7][ref2] genoemde procedures kan voor de in bijlage II onder punt
      1.2.7. van de richtlijn bedoelde veiligheidsaspecten van apparaten en beveiligingssystemen, de in bijlage VIII van
      de richtlijn bedoelde procedure van interne fabricagecontrole worden gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0007497#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007497#Artikel7
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007497
        artikel: '6'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0007497
        artikel: '7'
        hoofdstuk: III
  - number: '10.1'
    text: |-
      Wanneer de fabrikant, diens gemachtigde dan wel, indien zij geen van beiden in Nederland zijn gevestigd, degene
      die het explosieveilig materieel in Nederland in de handel brengt, voornemens is wijzigingen aan te brengen in
      het model van explosieveilig materieel waarvoor een certificaat van EG-typeonderzoek is afgegeven, stelt hij de
      aangewezen aangemelde instelling die dit certificaat heeft afgegeven hiervan onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel10
  - number: '10.2'
    text: |-
      De in het eerste lid bedoelde aangewezen aangemelde instelling beoordeelt de wijzigingen en deelt de in het eerste
      lid bedoelde persoon mee of het certificaat van EG-typeonderzoek voor het gewijzigde explosieveilig materieel
      geldig is dan wel aanvulling behoeft.
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel10
  - number: '10.3'
    text: |-
      Indien de in het eerste lid bedoelde aangewezen aangemelde instelling van oordeel is dat de wijzigingen van
      invloed kunnen zijn op de overeenstemming met de in bijlage II van de richtlijn bedoelde fundamentele eisen, wordt
      het gewijzigde model aan het in bijlage III van de richtlijn bedoelde EG-typeonderzoek onderworpen en wordt bij
      goedkeuring een aanvulling op het oorspronkelijke certificaat afgegeven.
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel10
  - number: '12'
    text: |-
      Apparaten, beveiligingssystemen en voorzieningen die zijn voorzien van de CE-markering en vergezeld gaan van de
      EG-verklaring van overeenstemming alsmede componenten die vergezeld gaan van een schriftelijke verklaring van
      overeenstemming overeenkomstig [artikel 8][ref1], worden vermoed te voldoen aan [artikel 4, tweede volzin][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007497#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007497#Artikel4
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007497
        artikel: '8'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0007497
        artikel: '4'
        hoofdstuk: II
  - number: '13.1'
    text: |-
      De CE-markering, in voorkomend geval gevolgd door het identificatienummer van de aangewezen aangemelde instelling
      alsmede het specifiek merkteken van explosiepreventie en de overige gegevens, bedoeld in bijlage II onder punt
      1.0.5. van de richtlijn, worden overeenkomstig die bijlage alsmede overeenkomstig bijlage X van de richtlijn
      duidelijk leesbaar en onuitwisbaar op de apparaten, beveiligingssystemen en voorzieningen aangebracht.
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel13
  - number: '13.2'
    text: |-
      Apparaten, beveiligingssystemen en voorzieningen hebben geen markeringen die derden kunnen misleiden omtrent de
      betekenis of grafische vorm van de CE-markering. Andere markeringen mogen worden aangebracht op voorwaarde dat de
      zichtbaarheid en leesbaarheid van de CE-markering niet wordt verminderd.
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel13
  - number: '14'
    text: |-
      De aangewezen aangemelde instelling trekt een door haar afgegeven certificaat van EG-typeonderzoek in, indien
      de fundamentele eisen van bijlage II van de richtlijn zodanig zijn gewijzigd dat het model niet voldoet aan de
      gewijzigde eisen op het tijdstip waarop deze volgens de richtlijn van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel14
  - number: '16'
    text: |-
      [Artikel 3a][ref1] is niet van toepassing op het tentoonstellen en demonstreren op (jaar-)beurzen, exposities
      en bij demonstraties van explosieveilig materieel dat niet in overeenstemming is met dit besluit, mits op een
      zichtbaar bord duidelijk is aangegeven dat het niet in overeenstemming is met dit besluit en niet te koop is
      voordat het door de fabrikant of zijn in de Europese Economische Ruimte gevestigde gemachtigde, in overeenstemming
      is gebracht met dit besluit. Bij demonstraties worden alle nodige veiligheidsmaatregelen genomen om de bescherming
      van de mens te waarborgen.


      [ref1]: https://wetten.overheid.nl/BWBR0007497#Artikel3a
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007497
        artikel: 3a
        hoofdstuk: IA
  - number: '17.1'
    text: 'Als aangewezen aangemelde instelling kan worden aangewezen een instelling die:'
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel17
  - number: 17.1.a
    text: rechtspersoonlijkheid heeft;
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel17
  - number: 17.1.b
    text: haar zetel of een vestiging in Nederland heeft;
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel17
  - number: 17.1.c
    text: |-
      onafhankelijk is van degenen die bij het resultaat van de uitvoering van de taken waarvoor zij is aangewezen belang
      hebben;
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel17
  - number: 17.1.d
    text: beschikt over voldoende deskundigheid en outillage om de
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel17
  - number: 17.1.e
    text: uitvoering van de taken waarvoor zij is aangewezen, naar behoren te kunnen vervullen;
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel17
  - number: 17.1.f
    text: |-
      beschikt over een behoorlijke administratie waarin de gegevens die samenhangen met en betrekking hebben op de
      uitvoering van haar taken, op een systematische wijze zijn vastgelegd. Aan de hand van deze gegevens zijn het
      gekeurde explosieveilig materieel en de onderzochte kwaliteitssystemen afdoende te identificeren;
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel17
  - number: 17.1.g
    text: naar behoren functioneert.
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel17
  - number: '17.2'
    text: |-
      In aanvulling op het eerste lid komen voor een aanwijzing als aangewezen aangemelde instelling slechts in
      aanmerking instellingen die ten minste voldoen aan de in bijlage XI van de richtlijn neergelegde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel17
  - number: '17.3'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel17
  - number: 17a
    text: |-
      De instelling verstrekt jaarlijks aan Onze Minister een afschrift van de polis van de afgesloten verzekering tegen
      wettelijke aansprakelijkheid tegen alle risico's die voortvloeien uit de uitoefening van de taken waarvoor zij
      is aangewezen.
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel17a
  - number: 17b.1
    text: |-
      Indien een wijziging plaatsvindt in de gegevens op grond waarvan de instelling is aangewezen, doet de instelling
      hiervan terstond mededeling aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel17b
  - number: 17b.2
    text: |-
      Indien een instelling voornemens is een of meer van de taken waarvoor zij is aangewezen, te beëindigen, doet
      de instelling hiervan terstond mededeling aan Onze Minister en de certificaathouders. In dat geval worden door
      de instelling de gegevens, bedoeld in artikel 17, eerste lid, onder e, overgedragen aan Onze Minister dan wel,
      na toestemming van Onze Minister en de certificaathouders, een andere instelling die voor dezelfde taken is
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel17b
  - number: 17c.1
    text: |-
      Een aanvraag om aanwijzing gaat vergezeld van het bewijs dat is voldaan aan de criteria, bedoeld in artikel 17,
      eerste lid, dan wel in geval van artikel 17, tweede lid, tevens van bewijs dat is voldaan aan de voorwaarden,
      bedoeld in dat lid, dan wel van een verklaring waaruit de bereidheid blijkt om voor eigen rekening een onderzoek
      naar het voldoen aan deze criteria dan wel voorwaarden te ondergaan.
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel17c
  - number: 17c.2
    text: |-
      Een aanwijzing kan worden geweigerd, dan wel worden gewijzigd of ingetrokken, indien niet of niet volledig is
      voldaan aan de bij de wet of bij of krachtens dit besluit gestelde voorschriften. Een aanwijzing kan worden
      ingetrokken indien de instelling gedurende een aaneengesloten periode van twee jaar geen werkzaamheden, waarvoor
      zij is aangewezen, heeft uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel17c
  - number: 17c.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel17c
  - number: '21'
    text: |-
      Een wijziging van een van de bijlagen van de richtlijn waarnaar in dit besluit wordt verwezen, treedt voor de
      toepassing van dit besluit en de daarop gebaseerde bepalingen in werking met ingang van de dag waarop aan de
      betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel21
  - number: '22.1'
    text: |-
      De artikelen [4][ref1], [6][ref2], [7][ref3], [8][ref4], [9][ref5], [11][ref6] en [16][ref7] zijn niet van
      toepassing op explosieveilig elektrisch materieel, bestemd voor gebruik in explosieve atmosfeer dat is vervaardigd
      in overeenstemming met de regeling van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 19 april 1995,
      nr. 95/00856 (Stcrt.100) en voor 1 juli 2003 in de handel is gebracht en in bedrijf gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007497#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007497#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0007497#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0007497#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0007497#Artikel9
      [ref6]: https://wetten.overheid.nl/BWBR0007497#Artikel11
      [ref7]: https://wetten.overheid.nl/BWBR0007497#Artikel16
    url: https://wetten.overheid.nl/BWBR0007497/2006-04-01#Artikel22
    references:
