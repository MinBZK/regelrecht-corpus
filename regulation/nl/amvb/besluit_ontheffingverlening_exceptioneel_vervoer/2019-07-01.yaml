        bwb_id: BWBR0018680
        artikel: '3'
        paragraaf: '2'
  - number: 6a
    text: |-
      Onze Minister vraagt voor het verlenen van een vergunning op grond van
      [artikel 149aa van de Wegenverkeerswet 1994][ref1] toestemming aan de wegbeheerder voor zover het experiment
      plaatsvindt op wegen die niet vallen onder beheer van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149aa
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 149aa
  - number: 6b
    text: >-
      1 De wegbeheerder verstrekt over de wegen die onder zijn beheer staan, gegevens betreffende de infrastructuur,
      alsmede overige informatie die van belang is voor het verlenen van een vergunning. Bij ministeriële regeling kunnen
      hierover nadere regels worden gesteld.


      2 De wegbeheerder draagt zorg voor de juistheid en volledigheid van de gegevens en voor onmiddellijke doorgifte van
      wijzigingen daarin.


      3 De wegbeheerder levert de gegevens aan op een door Onze Minister vastgestelde wijze.
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel6b
  - number: '7'
    text: |-
      1 Aan het overleg, bedoeld in [artikel 149a, derde lid, van de Wegenverkeerswet 1994][ref1], over de uitvoering van
      de [artikelen 149a][ref2] en [149b van die wet][ref3] nemen deel:

      a. twee vertegenwoordigers van de Dienst Wegverkeer, van wie er een optreedt als voorzitter;

      b. twee vertegenwoordigers van het Ministerie van Infrastructuur en Milieu;

      c. één vertegenwoordiger van de politie;

      d. één vertegenwoordiger van het openbaar ministerie;

      e. ten minste vier vertegenwoordigers van door Onze Minister aangewezen wegbeheerders of representatieve
      organisaties daarvan;

      f. ten minste vier vertegenwoordigers van door Onze Minister aangewezen representatieve organisaties van de
      betrokken branches van het bedrijfsleven;

      g. ten minste één vertegenwoordiger van door Onze Minister aangewezen representatieve organisaties van
      transportbegeleiders.

      2 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot het overleg, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149a
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel149a
