  - number: '2'
    text: |-
      1 De Dienst Wegverkeer kan in verband met de uitvoering van een of meer exceptionele transporten, voor zover
      het betreft personenauto’s, bedrijfsauto’s of aanhangwagens achter personenauto’s of bedrijfsauto’s ontheffing
      verlenen van [artikel 5.1.1, eerste lid, aanhef en onderdeel c, en tweede lid][ref1], [artikel 5.1.2][ref2] en
      [artikel 5.1.3 van de Regeling voertuigen][ref3].

      2 Indien de verlening van een ontheffing als bedoeld in het eerste lid dat rechtvaardigt, kan de Dienst Wegverkeer
      eveneens ontheffing verlenen van:

      a. de overige bepalingen van [hoofdstuk 5 van de Regeling voertuigen][ref4];

      b. de [artikelen 3, eerste lid][ref5], [10][ref6], [14][ref7], [23, eerste lid][ref8], [24][ref9],
      [42][ref10], [43][ref11], [62][ref12], voor zover het betreft de verkeerstekens C1, C2, C4, C6 tot
      en met C10 en C12, C17 tot en met 21, D1, D2, D4 tot en met D7, E1, E2, E5 tot en met E9, F7, en
      de verkeerstekens genoemd in de artikelen [73][ref13], [76][ref14], [77][ref15], [78][ref16] en
      [81 van het Reglement verkeersregels en verkeerstekens 1990][ref17].


