  - number: '5'
    text: |-
      1 De Dienst Wegverkeer weigert een ontheffing indien:

      a. een wegbeheerder de in [artikel 4][ref1] bedoelde toestemming weigert;

      b. het verlenen daarvan strijd oplevert met verdragen dan wel besluiten van volkenrechtelijke organisaties of van
      één of meer instellingen van de Europese Unie, al dan niet gezamenlijk.

      2 De Dienst Wegverkeer kan een ontheffing weigeren:

      a. indien gegevens betreffende de infrastructuur en overige informatie uit het in [artikel 3, onderdeel a][ref2],
      bedoelde gegevensbestand hiertoe aanleiding geven;

      b. indien de voertuigtechnische gegevens als bedoeld in [artikel 3, onderdeel c][ref3], hiertoe aanleiding geven;

      c. indien dit gerechtvaardigd is in verband met de bescherming van de in
      [artikel 2, eerste en tweede lid, van de Wegenverkeerswet 1994][ref4] aangegeven belangen.


      [ref1]: https://wetten.overheid.nl/BWBR0018680#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0018680#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0018680#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel2
