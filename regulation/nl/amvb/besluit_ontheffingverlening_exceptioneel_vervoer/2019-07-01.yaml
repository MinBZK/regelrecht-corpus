  - number: '6'
    text: |-
      1 De wegbeheerder verstrekt ten behoeve van het gegevensbestand, bedoeld in [artikel 3, onderdeel a][ref1], over
      wegen die onder zijn beheer staan, gegevens betreffende de infrastructuur, alsmede overige informatie die van
      belang is voor de ontheffingverlening. Bij ministeriële regeling kunnen hierover nadere regels worden gesteld.

      2 De wegbeheerder draagt zorg voor de juistheid en volledigheid van de gegevens en voor onmiddellijke doorgifte van
      wijzigingen daarin.

      3 De wegbeheerder levert de gegevens aan op een door de Dienst Wegverkeer vastgestelde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0018680#Artikel3
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel6
