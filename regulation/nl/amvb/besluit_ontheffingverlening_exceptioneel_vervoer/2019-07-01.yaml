preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 22 juni 2005, nr. HDJZ/AWW/2005-1392,
    Hoofddirectie Juridische Zaken;

    Gelet op artikel 149a, tweede en derde lid, en artikel 149b, eerste en tweede lid, van de Wegenverkeerswet 1994;

    De Raad van State gehoord (advies van 14 juli 2005, nr. W09.05.0260/V);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 15 augustus 2005, nr. HDJZ/AWW/2005-1664,
    Hoofddirectie Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel1
  - number: 1.a
    text: |-
      aanhangwagen, bedrijfsauto, personenauto of voertuig: hetgeen daaronder in
      [artikel 1.1 van de Regeling voertuigen][ref1] wordt verstaan;


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Artikel1
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0025798
        artikel: '1'
  - number: 1.b
    text: |-
      aslasten: de som van de last onder de wielen van een as als bedoeld in
      [artikel 1.1 van de Regeling voertuigen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Artikel1
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0025798
        artikel: '1'
  - number: 1.c
    text: |-
      exceptioneel transport: een transport met een voertuig of een samenstel van voertuigen, met inbegrip van de daarmee
      vervoerde lading, dat niet voldoet aan in de [Regeling voertuigen][ref1] voorgeschreven eisen met betrekking tot
      breedte, hoogte, lengte, massa of aslasten.


      [ref1]: https://wetten.overheid.nl/BWBR0025798
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0025798
  - number: '2.1'
    text: |-
      De Dienst Wegverkeer kan in verband met de uitvoering van een of meer exceptionele transporten, voor zover
      het betreft personenauto’s, bedrijfsauto’s of aanhangwagens achter personenauto’s of bedrijfsauto’s ontheffing
      verlenen van [artikel 5.1.1, eerste lid, aanhef en onderdeel c, en tweede lid][ref1], [artikel 5.1.2][ref2] en
      [artikel 5.1.3 van de Regeling voertuigen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0025798#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0025798#Artikel5
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0025798
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0025798
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0025798
        artikel: '5'
  - number: '2.2'
    text: |-
      Indien de verlening van een ontheffing als bedoeld in het eerste lid dat rechtvaardigt, kan de Dienst Wegverkeer
      eveneens ontheffing verlenen van:
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel2
  - number: 2.2.a
    text: |-
      de overige bepalingen van [hoofdstuk 5 van de Regeling voertuigen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0025798
        hoofdstuk: '5'
  - number: 2.2.b
    text: |-
      de [artikelen 3, eerste lid][ref1], [10][ref2], [14][ref3], [23, eerste lid][ref4], [24][ref5],
      [42][ref6], [43][ref7], [62][ref8], voor zover het betreft de verkeerstekens C1, C2, C4, C6 tot
      en met C10 en C12, C17 tot en met 21, D1, D2, D4 tot en met D7, E1, E2, E5 tot en met E9, F7, en
      de verkeerstekens genoemd in de artikelen [73][ref9], [76][ref10], [77][ref11], [78][ref12] en
      [81 van het Reglement verkeersregels en verkeerstekens 1990][ref13].


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004825#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0004825#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0004825#Artikel23
      [ref5]: https://wetten.overheid.nl/BWBR0004825#Artikel24
      [ref6]: https://wetten.overheid.nl/BWBR0004825#Artikel42
      [ref7]: https://wetten.overheid.nl/BWBR0004825#Artikel43
      [ref8]: https://wetten.overheid.nl/BWBR0004825#Artikel62
      [ref9]: https://wetten.overheid.nl/BWBR0004825#Artikel73
      [ref10]: https://wetten.overheid.nl/BWBR0004825#Artikel76
      [ref11]: https://wetten.overheid.nl/BWBR0004825#Artikel77
      [ref12]: https://wetten.overheid.nl/BWBR0004825#Artikel78
      [ref13]: https://wetten.overheid.nl/BWBR0004825#Artikel81
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel2
