  - number: '3'
    text: |-
      De Dienst Wegverkeer kan een ontheffing uitsluitend verlenen op basis van:

      a. de gegevens betreffende de infrastructuur en overige informatie opgenomen in een door die dienst daartoe
      aangehouden gegevensbestand;

      b. in de daarvoor in aanmerking komende gevallen, een door de wegbeheerder verleende toestemming als bedoeld in
      [artikel 4][ref1];

      c. voertuigtechnische gegevens in relatie tot het verlenen van een ontheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0018680#Artikel4
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018680
        artikel: '4'
        paragraaf: '2'
  - number: '4'
    text: |-
      De Dienst Wegverkeer vraagt toestemming als bedoeld in
      [artikel 149b, tweede lid, van de Wegenverkeerswet 1994][ref1], aan de wegbeheerder:

      a. indien geen gegevens beschikbaar zijn in het gegevensbestand als bedoeld in [artikel 3, onderdeel a][ref2];

      b. indien de wegbeheerder bij het verstrekken van gegevens en informatie als bedoeld in
      [artikel 6, eerste lid][ref3], toestemming als voorwaarde heeft gesteld voor de passage van een weg of wegdeel
      waarop de af te geven ontheffing betrekking heeft of

      c. ingeval de ontheffingverlening zal plaatsvinden op grond van [artikel 2a][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149b
      [ref2]: https://wetten.overheid.nl/BWBR0018680#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0018680#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0018680#Artikel2a
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel4
