  - number: 2a
    text: |-
      1 De Dienst Wegverkeer kan voor voertuigen waarvoor op grond van [artikel 3.5][ref1] of
      [3.8 van de Regeling voertuigen][ref2] goedkeuring is vereist, ontheffing verlenen van overige bepalingen van
      [hoofdstuk 3 van de Regeling voertuigen][ref3] en van [hoofdstuk 5 van die regeling][ref4], voor zover en voor
      zolang dat nuttig is voor het testen van verder geautomatiseerde functies in voertuigen en het daarmee ervaring
      opdoen in het verkeer.

      2 De Dienst Wegverkeer kan voor wijzigingen in de constructie van voertuigen, waarvoor op
      grond van [artikel 6.1, eerste lid, van de Regeling voertuigen][ref5] goedkeuring is vereist
      voor toelating van het gewijzigde voertuig tot het verkeer op de weg, ontheffing verlenen van
      [artikel 6.4, eerste lid, onder a en b, van die regeling][ref6], voor de in het eerste lid genoemde doelen.

      3 Voor zover dat voor het gebruik van de in het eerste en tweede lid bedoelde ontheffing noodzakelijk is, kan
      de Dienst Wegverkeer bij die ontheffing tevens ontheffing verlenen van daarbij aangegeven bepalingen van het
      [Reglement verkeersregels en verkeerstekens 1990][ref7].


