  - number: 2a.1
    text: |-
      De Dienst Wegverkeer kan voor voertuigen waarvoor op grond van [artikel 3.5][ref1] of
      [3.8 van de Regeling voertuigen][ref2] goedkeuring is vereist, ontheffing verlenen van overige bepalingen van
      [hoofdstuk 3 van de Regeling voertuigen][ref3] en van [hoofdstuk 5 van die regeling][ref4], voor zover en voor
      zolang dat nuttig is voor het testen van verder geautomatiseerde functies in voertuigen en het daarmee ervaring
      opdoen in het verkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0025798#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0025798#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0025798#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0025798
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0025798
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0025798
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0025798
        hoofdstuk: '5'
  - number: 2a.2
    text: |-
      De Dienst Wegverkeer kan voor wijzigingen in de constructie van voertuigen, waarvoor op grond
      van [artikel 6.1, eerste lid, van de Regeling voertuigen][ref1] goedkeuring is vereist voor
      toelating van het gewijzigde voertuig tot het verkeer op de weg, ontheffing verlenen van
      [artikel 6.4, eerste lid, onder a en b, van die regeling][ref2], voor de in het eerste lid genoemde doelen.


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0025798#Artikel6
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0025798
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0025798
        artikel: '6'
  - number: 2a.3
    text: |-
      Voor zover dat voor het gebruik van de in het eerste en tweede lid bedoelde ontheffing noodzakelijk is, kan
      de Dienst Wegverkeer bij die ontheffing tevens ontheffing verlenen van daarbij aangegeven bepalingen van het
      [Reglement verkeersregels en verkeerstekens 1990][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004825
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0004825
  - number: '3'
    text: 'De Dienst Wegverkeer kan een ontheffing uitsluitend verlenen op basis van:'
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel3
  - number: 3.a
    text: |-
      de gegevens betreffende de infrastructuur en overige informatie opgenomen in een door die dienst daartoe
      aangehouden gegevensbestand;
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel3
  - number: 3.b
    text: |-
      in de daarvoor in aanmerking komende gevallen, een door de wegbeheerder verleende toestemming als bedoeld in
      [artikel 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018680#Artikel4
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018680
        artikel: '4'
        paragraaf: '2'
  - number: 3.c
    text: voertuigtechnische gegevens in relatie tot het verlenen van een ontheffing.
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel3
  - number: '4'
    text: |-
      De Dienst Wegverkeer vraagt toestemming als bedoeld in
      [artikel 149b, tweede lid, van de Wegenverkeerswet 1994][ref1], aan de wegbeheerder:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149b
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 149b
  - number: 4.a
    text: |-
      indien geen gegevens beschikbaar zijn in het gegevensbestand als bedoeld in [artikel 3, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018680#Artikel3
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018680
        artikel: '3'
        paragraaf: '2'
  - number: 4.b
    text: |-
      indien de wegbeheerder bij het verstrekken van gegevens en informatie als bedoeld in [artikel 6, eerste lid][ref1],
      toestemming als voorwaarde heeft gesteld voor de passage van een weg of wegdeel waarop de af te geven ontheffing
      betrekking heeft of


      [ref1]: https://wetten.overheid.nl/BWBR0018680#Artikel6
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018680
        artikel: '6'
        paragraaf: '3'
  - number: 4.c
    text: |-
      ingeval de ontheffingverlening zal plaatsvinden op grond van [artikel 2a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018680#Artikel2a
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018680
        artikel: 2a
        paragraaf: '2'
  - number: '5.1'
    text: 'De Dienst Wegverkeer weigert een ontheffing indien:'
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel5
  - number: 5.1.a
    text: |-
      een wegbeheerder de in [artikel 4][ref1] bedoelde toestemming weigert;


      [ref1]: https://wetten.overheid.nl/BWBR0018680#Artikel4
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018680
        artikel: '4'
        paragraaf: '2'
  - number: 5.1.b
    text: |-
      het verlenen daarvan strijd oplevert met verdragen dan wel besluiten van volkenrechtelijke organisaties of van één
      of meer instellingen van de Europese Unie, al dan niet gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel5
  - number: '5.2'
    text: 'De Dienst Wegverkeer kan een ontheffing weigeren:'
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel5
  - number: 5.2.a
    text: |-
      indien gegevens betreffende de infrastructuur en overige informatie uit het in [artikel 3, onderdeel a][ref1],
      bedoelde gegevensbestand hiertoe aanleiding geven;


      [ref1]: https://wetten.overheid.nl/BWBR0018680#Artikel3
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018680
        artikel: '3'
        paragraaf: '2'
  - number: 5.2.b
    text: |-
      indien de voertuigtechnische gegevens als bedoeld in [artikel 3, onderdeel c][ref1], hiertoe aanleiding geven;


      [ref1]: https://wetten.overheid.nl/BWBR0018680#Artikel3
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018680
        artikel: '3'
        paragraaf: '2'
  - number: 5.2.c
    text: |-
      indien dit gerechtvaardigd is in verband met de bescherming van de in
      [artikel 2, eerste en tweede lid, van de Wegenverkeerswet 1994][ref1] aangegeven belangen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel2
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '2'
  - number: '6.1'
    text: |-
      De wegbeheerder verstrekt ten behoeve van het gegevensbestand, bedoeld in [artikel 3, onderdeel a][ref1], over
      wegen die onder zijn beheer staan, gegevens betreffende de infrastructuur, alsmede overige informatie die van
      belang is voor de ontheffingverlening. Bij ministeriële regeling kunnen hierover nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018680#Artikel3
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018680
        artikel: '3'
        paragraaf: '2'
  - number: '6.2'
    text: |-
      De wegbeheerder draagt zorg voor de juistheid en volledigheid van de gegevens en voor onmiddellijke doorgifte van
      wijzigingen daarin.
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel6
  - number: '6.3'
    text: De wegbeheerder levert de gegevens aan op een door de Dienst Wegverkeer vastgestelde wijze.
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel6
  - number: 6a
    text: |-
      Onze Minister vraagt voor het verlenen van een vergunning op grond van
      [artikel 149aa van de Wegenverkeerswet 1994][ref1] toestemming aan de wegbeheerder voor zover het experiment
      plaatsvindt op wegen die niet vallen onder beheer van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149aa
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 149aa
  - number: 6b.1
    text: |-
      De wegbeheerder verstrekt over de wegen die onder zijn beheer staan, gegevens betreffende de infrastructuur,
      alsmede overige informatie die van belang is voor het verlenen van een vergunning. Bij ministeriële regeling kunnen
      hierover nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel6b
  - number: 6b.2
    text: |-
      De wegbeheerder draagt zorg voor de juistheid en volledigheid van de gegevens en voor onmiddellijke doorgifte van
      wijzigingen daarin.
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel6b
  - number: 6b.3
    text: De wegbeheerder levert de gegevens aan op een door Onze Minister vastgestelde wijze.
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel6b
  - number: '7.1'
    text: |-
      Aan het overleg, bedoeld in [artikel 149a, derde lid, van de Wegenverkeerswet 1994][ref1], over de uitvoering van
      de [artikelen 149a][ref2] en [149b van die wet][ref3] nemen deel:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149a
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel149a
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel149b
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 149a
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 149a
      - id: ref3
        bwb_id: BWBR0006622
        artikel: 149b
  - number: 7.1.a
    text: twee vertegenwoordigers van de Dienst Wegverkeer, van wie er een optreedt als voorzitter;
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel7
  - number: 7.1.b
    text: twee vertegenwoordigers van het Ministerie van Infrastructuur en Milieu;
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel7
  - number: 7.1.c
    text: één vertegenwoordiger van de politie;
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel7
  - number: 7.1.d
    text: één vertegenwoordiger van het openbaar ministerie;
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel7
  - number: 7.1.e
    text: |-
      ten minste vier vertegenwoordigers van door Onze Minister aangewezen wegbeheerders of representatieve organisaties
      daarvan;
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel7
  - number: 7.1.f
    text: |-
      ten minste vier vertegenwoordigers van door Onze Minister aangewezen representatieve organisaties van de betrokken
      branches van het bedrijfsleven;
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel7
  - number: 7.1.g
    text: |-
      ten minste één vertegenwoordiger van door Onze Minister aangewezen representatieve organisaties van
      transportbegeleiders.
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel7
  - number: '7.2'
    text: Bij ministeriële regeling worden nadere regels gesteld met betrekking tot het overleg, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel7
  - number: '9'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop [artikel I, onderdelen A, B, F tot en met H][ref1], en
