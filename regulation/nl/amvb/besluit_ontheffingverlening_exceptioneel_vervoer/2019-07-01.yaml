  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 22 juni 2005, nr. HDJZ/AWW/2005-1392,
    Hoofddirectie Juridische Zaken;


    Gelet op artikel 149a, tweede en derde lid, en artikel 149b, eerste en tweede lid, van de Wegenverkeerswet 1994;


    De Raad van State gehoord (advies van 14 juli 2005, nr. W09.05.0260/V);


    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 15 augustus 2005, nr. HDJZ/AWW/2005-1664,
    Hoofddirectie Juridische Zaken;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. aanhangwagen, bedrijfsauto, personenauto of voertuig: hetgeen daaronder in
      [artikel 1.1 van de Regeling voertuigen][ref1] wordt verstaan;

      b. aslasten: de som van de last onder de wielen van een as als bedoeld in
      [artikel 1.1 van de Regeling voertuigen][ref2];

      c. exceptioneel transport: een transport met een voertuig of een samenstel van voertuigen, met inbegrip van
      de daarmee vervoerde lading, dat niet voldoet aan in de [Regeling voertuigen][ref3] voorgeschreven eisen met
      betrekking tot breedte, hoogte, lengte, massa of aslasten.


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0025798#Artikel1.1
      [ref3]: https://wetten.overheid.nl/BWBR0025798
    url: https://wetten.overheid.nl/BWBR0018680/2019-07-01#Artikel1
