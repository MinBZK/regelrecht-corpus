articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. burgemeester en wethouders: burgemeester en wethouders van de gemeente waar een mobiele puinbreker in werking is
      of zal worden gebracht;

      b. bouw- en sloopafval: steenachtige bedrijfsafvalstoffen afkomstig van het bouwen of slopen van wegen, gebouwen of
      overige bouwwerken;

      c. mobiele puinbreker: mobiele installatie voor het bewerken van bouw- en sloopafval, met inbegrip van alle daarbij
      gebruikte overige installaties en toestellen.
    url: https://wetten.overheid.nl/BWBR0016292/2016-01-01#Artikel1
  - number: '2'
    text: |-
      1 Dit besluit is van toepassing op het bewerken van bouw- en sloopafval met een mobiele puinbreker:

      a. buiten een inrichting,

      b. binnen een inrichting, niet zijnde een inrichting waarbinnen het ingevolge de omgevingsvergunning voor die
      inrichting is toegestaan om met een mobiele puinbreker bouw- en sloopafval te bewerken dat van buiten de inrichting
      afkomstig is.

      2 De natuurlijke of rechtspersoon die een mobiele puinbreker in werking heeft en degene die terzake de feitelijke
      leiding heeft dragen ervoor zorg dat de voorschriften van dit besluit over het met een mobiele puinbreker bewerken
      van bouw- en sloopafval worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0016292/2016-01-01#Artikel2
  - number: '3'
    text: |-
      1 Het bewerken van bouw- en sloopafval met een mobiele puinbreker geschiedt in overeenstemming met de voorschriften
      die zijn opgenomen in de bijlage bij dit besluit.

      2 Het bewerken van bouw- en sloopafval met een mobiele puinbreker geschiedt in de directe nabijheid van de plaats
      waar dat afval vrijkomt, gedurende een aaneengesloten periode van ten hoogste drie maanden.

      3 Het is verboden om met een mobiele puinbreker bouw- en sloopafval te bewerken dat afkomstig is van buiten de
      locatie of de inrichting waar de mobiele puinbreker in werking is.
    url: https://wetten.overheid.nl/BWBR0016292/2016-01-01#Artikel3
  - number: '4'
    text: |-
      1 Degene die het voornemen heeft om met een mobiele puinbreker bouw- en sloopafval te bewerken, stelt ten minste
      vijftien werkdagen voor de aanvang van de werkzaamheden burgemeester en wethouders daarvan schriftelijk in kennis.
      Ten minste twee werkdagen voor de aanvang van de werkzaamheden stelt hij burgemeester en wethouders daarvan op
      de hoogte.

      2 De schriftelijke kennisgeving, bedoeld in het eerste lid, bevat:

      a. het adres of de plaatselijke aanduiding van de locatie of de inrichting, met de exacte positie aldaar, waar de
      mobiele puinbreker in werking zal worden gebracht;

      b. de naam en het adres van de natuurlijke of rechtspersoon die een mobiele puinbreker in werking heeft en,
      voorzover van toepassing, van degene die de inrichting drijft waar de mobiele puinbreker in werking zal worden
      gebracht;

      c. de hoeveelheid en de aard van het met de mobiele puinbreker te bewerken bouw- en sloopafval;

      d. een beschrijving van de bronsterkte (LW) in dB(A) van de mobiele puinbreker;

      e. de verwachte datum van aanvang en de duur van de periode dat met een mobiele puinbreker bouw- en sloopafval
      wordt bewerkt.

      3 Van de schriftelijke kennisgeving, bedoeld in het eerste lid, wordt door burgemeester en wethouders openbaar
      kennis gegeven in één of meer dag-, nieuws- of huis-aan-huisbladen.
    url: https://wetten.overheid.nl/BWBR0016292/2016-01-01#Artikel4
  - number: '5'
    text: |-
      1 Degene die op het tijdstip van de inwerkingtreding van dit besluit met een mobiele puinbreker bouw- en sloopafval
      bewerkt, stelt binnen vijftien werkdagen na dat tijdstip burgemeester en wethouders daarvan schriftelijk in kennis.
      [Artikel 4, tweede lid][ref1], is van overeenkomstige toepassing.

      2 In het geval, bedoeld in het eerste lid, blijft gedurende drie maanden, dan wel zoveel korter als de
      mobiele puinbreker ter plaatse in werking is, de terzake door gedeputeerde staten, op grond van de provinciale
      milieuverordening, verleende vergunning van kracht. [Artikel 3][ref2] blijft in dat geval buiten toepassing.

      3 Degene die het voornemen heeft om binnen vijftien werkdagen na het tijdstip van inwerkingtreding van dit
      besluit met een mobiele puinbreker bouw- en sloopafval te bewerken, doet de schriftelijke kennisgeving, bedoeld in
      [artikel 4, eerste lid][ref3], zo spoedig mogelijk.


