preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Economische Zaken van 28 augustus 1996, nr.WJA/JZ 96054042, gedaan in
    overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschappen;


    Gelet op artikel 2 van de Kaderwet verstrekking financiële middelen EZ;


    De Raad van State gehoord (advies van 9 oktober 1996, nr. W10.96.0412);


    Gezien het nader rapport van Onze Minister van Economische Zaken van 16 december 1996, nr. WJA/JZ9607502,
    uitgebracht in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschappen;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008443/2003-07-16#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. een E.E.T.-project: een samenhangend geheel van voor Nederland nieuwe activiteiten, bestaande uit fundamenteel
      onderzoek, industrieel onderzoek, pre-concurrentiële ontwikkeling of een combinatie van deze activiteiten, dat op
      middellange termijn een aanmerkelijke bijdrage kan leveren aan het bereiken van bij regeling van Onze Minister,
      handelend in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschappen, vastgestelde doelstellingen
      in het kader van het streven naar ecologische duurzaamheid;

      b. fundamenteel onderzoek: het uitbreiden van de algemene wetenschappelijke en technische kennis, zonder
      industriële of commerciële doelstellingen;

      c. industrieel onderzoek: het opdoen van nieuwe kennis met het doel deze te gebruiken bij de ontwikkeling
      van nieuwe producten, processen of diensten of om bestaande producten, processen of diensten aanmerkelijk te
      verbeteren;

      d. pre-concurrentiële ontwikkeling: het omzetten van de resultaten van industrieel onderzoek in plannen, schema’s
      of ontwerpen voor nieuwe, gewijzigde of verbeterde producten, processen of diensten;

      e. een ondernemer: een natuurlijke persoon of rechtspersoon, niet zijnde een rechtspersoon die krachtens
      publiekrecht is ingesteld, die een onderneming in stand houdt, niet zijnde een onderneming die bij regeling van
      Onze Minister is uitgesloten;

      f. een samenwerkingsverband: een geen rechtspersoonlijkheid bezittend verband, bestaande uit ten minste twee, niet
      in een groep verbonden natuurlijke personen of rechtspersonen, onder wie ten minste één ondernemer;

      g. een groep: een economische eenheid, waarin organisatorisch zijn verbonden:

      1°. een natuurlijke persoon of privaatrechtelijke rechtspersoon, die direkt of indirekt:

      - meer dan de helft van het geplaatste kapitaal verschaft aan,
      - volledig aansprakelijk vennoot is van of
      - overwegende zeggenschap heeft over

      een of meer rechtspersonen of vennootschappen en

      2°. laatstbedoelde rechtspersonen of vennootschappen.
    url: https://wetten.overheid.nl/BWBR0008443/2003-07-16#Artikel1
  - number: '2'
    text: >-
      1 Onze Minister verstrekt op een aanvraag een subsidie aan de deelnemers in een samenwerkingsverband die voor
      gezamenlijke rekening en risico een E.E.T.-project uitvoeren. Onze Minister kan bij ministeriële regeling regels
      vaststellen omtrent de minimale omvang van de eigen bijdrage van een deelnemer in een samenwerkingsverband aan
      diens aandeel in de projectkosten.


      2 De subsidie wordt verstrekt aan de deelnemers gezamenlijk en betaald aan de deelnemer die als indiener van de
      aanvraag in de zin van dit besluit is opgetreden.


      3 Geen subsidie wordt verstrekt, indien voor het E.E.T.-project reeds door Onze Minister subsidie is verstrekt.
    url: https://wetten.overheid.nl/BWBR0008443/2003-07-16#Artikel2
  - number: '3'
    text: >-
      1 De subsidie bedraagt:


      a. 62,5 procent van de projectkosten die betrekking hebben op fundamenteel onderzoek;


      b. 40 procent van de projectkosten die betrekking hebben op industrieel onderzoek;


      c. 25 procent van de projectkosten die betrekking hebben op pre-concurrentiële ontwikkeling,


      doch niet meer dan het gevraagde bedrag en niet meer dan een bij regeling van Onze Minister vast te stellen bedrag.


      2 Indien ter zake van de projectkosten of een deel daarvan reeds door een ander bestuursorgaan of de Commissie van
      de Europese Gemeenschappen subsidie is verstrekt, wordt slechts een zodanig bedrag aan subsidie verstrekt, dat het
      totale bedrag aan subsidie niet meer bedraagt dan het bedrag ingevolge het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008443/2003-07-16#Artikel3
  - number: '4'
    text: >-
      1 Als projectkosten worden uitsluitend in aanmerking genomen:


      a. de volgende rechtstreeks aan het project toe te rekenen, na de indiening van de aanvraag door een subsidie-
      ontvanger gemaakte en betaalde kosten:


      1°. loonkosten, met dien verstande dat wordt uitgegaan van een uurloon, berekend op basis van het jaarloon bij een
      volledige dienstbetrekking volgens de kolom «loon voor de loonbelasting» van de loonstaat van het betrokken directe
      personeel, verhoogd met de wettelijke dan wel de op grond van een individuele of collectieve arbeidsovereenkomst
      verschuldigde opslagen voor sociale lasten, en van 1600 productieve uren per jaar;


      2°. kosten van verbruikte materialen en hulpmiddelen, gebaseerd op historische aanschafprijzen, exclusief
      winstopslagen bij transacties binnen een groep;


      3°. de kosten van aangeschafte machines en apparatuur, met dien verstande dat wordt uitgegaan van de aan het
      project toe te rekenen lease-termijnen, met uitzondering van financieringskosten, of afschrijvingstermijnen,
      berekend op basis van de historische aanschafwaarde exclusief winstopslagen bij transacties binnen een groep, een
      lineaire afschrijvingsmethode en een levensduur van vijf jaar;


      4°. aan derden verschuldigde kosten ter zake van studies en onderzoekactiviteiten en ter zake van de aanschaf van
      kennis en intellectuele eigendomsrechten alsmede ter zake van de bescherming van die rechten en, tot een maximum
      van 10 procent van de projectkosten, ter zake van projectmanagement, exclusief winstopslagen bij transacties binnen
      een groep;


      5°. reis- en verblijfskosten alsmede de kosten van deelneming aan wetenschappelijke symposia, tot een maximum van
      10 procent van de onder 1° bedoelde loonkosten;


      b. een opslag voor algemene kosten, groot 25 procent van de onder *a*, aanhef en onder 1°, bedoelde kosten.


      2 Indien geen loonkosten als bedoeld in het eerste lid, onder *a*, aanhef en onder 1°, worden gemaakt, maar
      niettemin arbeid ten behoeve van het E.E.T.-project wordt verricht, kan Onze Minister daarvoor een redelijk bedrag
      vaststellen, dat als projectkosten mede in aanmerking wordt genomen.


      3 Onze Minister kan toestaan dat in afwijking van het eerste lid het uurloon en de opslag voor algemene kosten
      worden vastgesteld overeenkomstig een in de gehele organisatie van een subsidie-ontvanger gebruikelijke,
      controleerbare methodiek.


      4 De kosten worden in aanmerking genomen met inbegrip van omzetbelasting, indien de subsidie-ontvanger die de
      kosten heeft gemaakt omzetbelasting niet kan verrekenen met door hem af te dragen omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0008443/2003-07-16#Artikel4
  - number: '5'
    text: >-
      1 Er is een Adviescommissie E.E.T., die tot taak heeft Onze Minister op zijn verzoek te adviseren omtrent aanvragen
      om subsidie op grond van dit besluit.


      2 De commissie bestaat uit een voorzitter en ten minste vier en ten hoogste acht andere leden.


      3 De voorzitter en de leden worden door Onze Minister voor een termijn van ten hoogste drie jaar benoemd. Zij zijn
      te allen tijde opnieuw benoembaar.


      4 De commissie stelt haar eigen werkwijze vast.


      5 Een lid van de commissie neemt niet deel aan de voorbereiding en vaststelling van een advies, indien hij een
      persoonlijk belang heeft bij de beschikking op de aanvraag.


      6 Onze Minister kan waarnemers aanwijzen, die het recht hebben de vergaderingen van de commissie bij te wonen.


      7 In het secretariaat van de commissie wordt door Onze Minister voorzien.


      8 Het beheer van de bescheiden betreffende de werkzaamheden van de commissie geschiedt op overeenkomstige wijze als
      bij het Ministerie van Economische Zaken. De bescheiden worden na beëindiging van de werkzaamheden van de commissie
      opgeborgen in het archief van dat ministerie.
    url: https://wetten.overheid.nl/BWBR0008443/2003-07-16#Artikel5
  - number: '6'
    text: >-
      1 Onze Minister stelt bij ministeriële regeling perioden vast, na afloop waarvan de aanvragen die in die periode
      zijn ontvangen worden behandeld.


      2 Onze Minister stelt voorts bij ministeriële regeling een subsidieplafond vast voor het verlenen van subsidies
      op in een periode ontvangen aanvragen. Daarbij kan hij afzonderlijke subsidieplafonds vaststellen voor bepaalde
      categorieën aanvragers en voor bepaalde categorieën projecten.
    url: https://wetten.overheid.nl/BWBR0008443/2003-07-16#Artikel6
  - number: '7'
    text: >-
      1 Een aanvraag om subsidie wordt door één der deelnemers in het samenwerkingsverband mede namens de andere
      deelnemers ingediend.


      2 Een aanvraag wordt ingediend met gebruikmaking van het origineel van een ondertekend formulier, dat door Onze
      Minister wordt vastgesteld. Onze Minister kan bij ministeriële regeling hiervan vrijstelling verlenen.


      3 Een aanvraag gaat vergezeld van een projectplan en een overeenkomst waarin de samenwerking tussen de deelnemers
      in het samenwerkingsverband is geregeld alsmede van andere bescheiden, overeenkomstig hetgeen in het formulier
      is vermeld.


      4 Bij regeling van Onze Minister kunnen regels worden gesteld omtrent het voorafgaand aan de aanvraag verkrijgen
      van een pre-advies van de Adviescommissie E.E.T. over de globale opzet van het E.E.T.-project.
    url: https://wetten.overheid.nl/BWBR0008443/2003-07-16#Artikel7
  - number: '8'
    text: |-
      1 Onze Minister wint omtrent een aanvraag het advies in van de Adviescommissie E.E.T.

      2 De commissie geeft aan Onze Minister in ieder geval een negatief advies:

      a. indien de aanvraag niet voldoet aan dit besluit en de daarop berustende bepalingen;

      b. indien zij het onaannemelijk acht, dat het E.E.T-project binnen tien jaren kan worden uitgevoerd;

      c. indien onvoldoende vertrouwen bestaat in de technische en economische haalbaarheid van het project;

      d. indien gegronde vrees bestaat dat de aanvragers het project niet kunnen financieren;

      e. indien onvoldoende vertrouwen bestaat dat de aanvragers de capaciteiten hebben om het project naar behoren uit
      te voeren;

      f. indien van het project onvoldoende positieve gevolgen voor de Nederlandse economie te verwachten zijn.

      3 De commissie rangschikt per groep van aanvragen waarvoor een subsidieplafond geldt de aanvragen waaromtrent
      zij positief adviseert zodanig, dat een project hoger gerangschikt wordt naar mate het meer bijdraagt aan de
      doelstellingen, bedoeld in [artikel 1, onder ][ref1], en andere bij regeling van Onze Minister vast te stellen
      economische en technologische doelstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0008443#Artikel1
    url: https://wetten.overheid.nl/BWBR0008443/2003-07-16#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008443
        artikel: '1'
        paragraaf: '1'
  - number: '9'
    text: |-
      Onze Minister geeft op de aanvraag een beschikking binnen vier maanden na afloop van de in [artikel 6][ref1]
      bedoelde periode.


      [ref1]: https://wetten.overheid.nl/BWBR0008443#Artikel6
    url: https://wetten.overheid.nl/BWBR0008443/2003-07-16#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008443
        artikel: '6'
        paragraaf: '2'
  - number: '10'
    text: >-
      1 Onze Minister beslist in ieder geval afwijzend op een aanvraag:


      a. indien de Adviescommissie E.E.T. een negatief advies heeft uitgebracht;


      b. voorzover subsidieverlening in strijd zou zijn met bij regeling van Onze Minister vastgestelde regels omtrent de
      mate waarin aan aanvragers meerdere malen subsidie kan worden verleend op grond van dit besluit.


      2 Onze Minister kan, indien vooralsnog onvoldoende vertrouwen bestaat in de technische en economische haalbaarheid
      van een E.E.T.-project, de aanvraag gedeeltelijk afwijzen, met dien verstande dat subsidie wordt verleend ter zake
      van projectkosten, verbonden aan de uitvoering van een eerste fase van het project, gedurende een in de beschikking
      tot subsidieverlening te vermelden periode.
    url: https://wetten.overheid.nl/BWBR0008443/2003-07-16#Artikel10
  - number: '11'
    text: >-
      1 Onze Minister verdeelt het beschikbare bedrag in de volgorde van de rangschikking van de aanvragen door de
      Adviescommissie E.E.T.


      2 Onze Minister kan afwijken van het eerste lid en van artikel 10, eerste lid, aanhef en onder *a*, indien een
      advies van de Adviescommissie E.E.T. in strijd is met dit besluit dan wel niet op zorgvuldige wijze tot stand is
      gekomen.
    url: https://wetten.overheid.nl/BWBR0008443/2003-07-16#Artikel11
  - number: '12'
    text: |-
      1 Aan de subsidieverlening zijn voor alle subsidie-ontvangers de in de[artikelen 13][ref1], [14][ref2] en
      [15][ref3] opgenomen verplichtingen verbonden, met dien verstande dat de in [artikel 14][ref4] opgenomen
      verplichtingen slechts gelden voor de subsidie-ontvanger die als indiener van de aanvraag om subsidie in de zin van
      dit besluit is opgetreden.

      2 De in de [ artikelen 13][ref5] en [14][ref6] opgenomen verplichtingen gelden tot de dag waarop de subsidie wordt
      vastgesteld. De in artikel 15 opgenomen verplichtingen gelden totdat vijf jaren na die dag zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0008443#Artikel13
