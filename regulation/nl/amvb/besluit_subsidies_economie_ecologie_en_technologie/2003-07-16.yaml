  - number: '24'
    text: >-
      1 De Subsidieregeling economie, ecologie en technologie wordt ingetrokken, met dien verstande dat hij van
      toepassing blijft op subsidies waarvoor de aanvraag is ingediend voor de inwerkingtreding van dit besluit.


      2 Onze Minister kan op aanvragen om subsidie, die op grond van de Subsidieregeling economie, ecologie en
      technologie moeten worden afgewezen wegens overschrijding van het subsidieplafond, subsidie verlenen op grond van
      dit besluit.
    url: https://wetten.overheid.nl/BWBR0008443/2003-07-16#Artikel24
  - number: '25'
    text: >-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0008443/2003-07-16#Artikel25
  - number: '26'
    text: 'Dit besluit wordt aangehaald als: Besluit subsidies economie, ecologie en technologie.'
    url: https://wetten.overheid.nl/BWBR0008443/2003-07-16#Artikel26
