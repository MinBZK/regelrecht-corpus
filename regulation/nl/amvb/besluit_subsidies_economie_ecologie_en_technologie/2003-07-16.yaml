      [ref4]: https://wetten.overheid.nl/BWBR0007919#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.2
    url: https://wetten.overheid.nl/BWBR0008443/2003-07-16#Artikel23
