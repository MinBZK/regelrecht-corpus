  - number: '17'
    text: >-
      Onze Minister kan bij de subsidieverlening verplichtingen opleggen met betrekking tot:


      a. het geven van bekendheid aan het E.E.T.-project en de resultaten ervan;


      b. de samenwerking met derden bij of in verband met de uitvoering van het project.
    url: https://wetten.overheid.nl/BWBR0008443/2003-07-16#Artikel17
  - number: '18'
    text: |-
      1 Op een subsidie ter zake waarvan een beschikking tot subsidieverlening geldt kunnen op aanvraag van de subsidie-
      ontvangers door Onze Minister voorschotten worden verstrekt.

      2 Een voorschot wordt berekend naar rato van de gemaakte en betaalde projectkosten, voor zover deze nog niet eerder
      bij de verstrekking van een voorschot in aanmerking zijn genomen. In totaal zal het bedrag aan voorschotten niet
      groter zijn dan 80 procent van het bij de subsidieverlening vermelde maximale subsidiebedrag.

      3 Bij de toepassing van het tweede lid wordt de opslag, bedoeld in [artikel 4, eerste lid, onderdeel ][ref1],
      geacht gemaakt en betaald te zijn voor zover de kosten waarover hij wordt berekend zijn gemaakt en betaald.

      4 Een voorschot wordt slechts verstrekt, indien het bedrag aan voorschot ten minste € 45 000 bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0008443#Artikel4
    url: https://wetten.overheid.nl/BWBR0008443/2003-07-16#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008443
        artikel: '4'
        paragraaf: '1'
  - number: '19'
    text: |-
      1 Een aanvraag wordt ingediend gelijktijdig met het uitbrengen van een verslag als bedoeld in
      [artikel 14, eerste lid][ref1].

      2 Een aanvraag wordt ingediend met gebruikmaking van het origineel van een ondertekend formulier, dat door Onze
      Minister wordt vastgesteld. Onze Minister kan bij ministeriële regeling hiervan vrijstelling verlenen.

      3 Een aanvraag wordt mede namens de andere subsidie-ontvangers ingediend door de subsidie-ontvanger die als
      indiener van de aanvraag om subsidie in de zin van dit besluit is opgetreden en gaat, indien het een eerste
      voorschot betreft, vergezeld van een verklaring van de indiener van de aanvraag waarin hij zich aansprakelijk
      stelt voor terugbetaling van de subsidie, voor zover de subsidie-ontvangers daartoe verplicht zijn, overeenkomstig
      hetgeen in het formulier is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0008443#Artikel14
    url: https://wetten.overheid.nl/BWBR0008443/2003-07-16#Artikel19
