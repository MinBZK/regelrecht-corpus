  - number: '28'
    text: |-
      Vanaf 1 januari 2000 komt de zinsnede in artikel 10, eerste lid, na de woorden "met dien verstande dat deze waarde"
      te luiden: 65 dB(A) niet te boven mag gaan en wordt de waarde:

        - 60 dB(A) in de artikelen 7, eerste en derde lid, 8, tweede lid, 11, eerste en tweede lid, en 13, eerste en tweede
      lid, vervangen door 57 dB(A);
        - 73 dB(A) in de artikelen 8, eerste lid, en 9, eerste lid, vervangen door: 70 dB(A), onder invoeging in artikel
      11, derde lid, vóór «73 dB(A)» van de zinsnede: in afwijking voor zover nodig van artikel 8.
    url: https://wetten.overheid.nl/BWBR0004137/2006-03-08#Artikel28
  - number: 28a
    text: |-
      1 De verzoeker, bedoeld in artikel 14, onder *a*, *b* en *c*, houdt binnen de in artikel 15, tweede lid, bedoelde
      termijn een openbare zitting, waarbij een ieder de gelegenheid wordt gegeven opmerkingen te maken ten aanzien van
      het ontwerp van het verzoek, bedoeld in artikel 15.

      2 De verzoeker stelt een rapport op van de wijze waarop de bevolking bij de totstandkoming van het verzoek, bedoeld
      in artikel 14, is betrokken, waarin in ieder geval begrepen zijn een verslag van de openbare zitting en afschriften
      van de schriftelijk gemaakte opmerkingen over het ontwerp van het verzoek. De verzoeker zendt dit rapport
      onmiddellijk toe aan degenen die op de openbare zitting opmerkingen ten aanzien van het ontwerp van het verzoek
      hebben gemaakt.

      3 Een verzoek als bedoeld in artikel 14 gaat vergezeld van het in het tweede lid bedoelde rapport.

      4 Dit artikel blijft van toepassing zolang de betrokken gemeente met inachtneming van [artikel 151][ref1] juncto
      [artikel 297 van de Gemeentewet][ref2] geen inspraakverordening heeft vastgesteld en in werking heeft laten treden.


