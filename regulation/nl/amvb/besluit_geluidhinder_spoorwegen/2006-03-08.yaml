  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 4 augustus
    1986, Centrale Directie Juridische Zaken, nr. MJZ 0486006, DGMH/G, nr. 0486114, gedaan in overeenstemming met Onze
    Minister van Verkeer en Waterstaat;

    Gelet op de artikelen 105, 106 en 129 van de Wet geluidhinder (Stb. 1979, 99);

    De Raad van State gehoord (advies van 4 februari 1987, nr. W 08.86.0421);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 24 maart
    1987, Centrale Directie Juridische Zaken, nr. MJZ 2437005, DGMH/G, nr. 2437110, uitgebracht in overeenstemming met
    Onze Minister van Verkeer en Waterstaat;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004137/2006-03-08#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. wet: [Wet geluidhinder][ref1];

      b. 1°. verblijfsruimte: hetgeen onder dat begrip wordt verstaan in het [Bouwbesluit 2003][ref2],

      2°. gezondheidszorggebouw: hetgeen onder gezondheidszorgfunctie wordt verstaan in het [Bouwbesluit 2003][ref3];

      c. spoorweg: een spoorweg als bedoeld in [artikel 1, onderdeel b, van de Spoorwegwet][ref4] die is aangegeven op de
      bij dit besluit behorende kaart;

      d. wijziging van een spoorweg: een wijziging met betrekking tot een aanwezige spoorweg, die verandering brengt
      in de omstandigheden welke ingevolge de regels die gelden bij de vaststelling van de geluidsbelasting vanwege die
      spoorweg in acht genomen moeten worden;

      e. spoorwegexploitant: de spoorwegbeheerder of de opdrachtgever tot aanleg, wijziging of vervanging van een
      spoorweg;

      f. equivalent geluidsniveau in dB(A) met betrekking tot een spoorweg: het equivalente geluidsniveau in dB(A),
      bepaald volgens de door Onze Minister op grond van [artikel 23][ref5] vastgestelde regels;

      g. etmaalwaarde van het equivalente geluidsniveau in dB(A) met betrekking tot een spoorweg: de hoogste van de
      volgende drie waarden:

      1. de waarde van het equivalente geluidsniveau over de periode 07.00-19.00 uur (dagwaarde),

      2. de met 5 dB(A) verhoogde waarde van het equivalente geluidsniveau over de periode 19.00-23.00 uur (avondwaarde),

      3. de met 10 dB(A) verhoogde waarde van het equivalente geluidsniveau over de periode 23.00-07.00 uur
      (nachtwaarde);

      h. geluidsbelasting vanwege een spoorweg: de etmaalwaarde van het equivalente geluidsniveau in dB(A) op een
      bepaalde plaats, veroorzaakt door het gezamenlijke spoorverkeer op een bepaald spoorweggedeelte of een combinatie
      van spoorweggedeelten;

      i. woonwagenstandplaats: een standplaats als bedoeld in
      [artikel 1, eerste lid, onderdeel h, van de Woningwet][ref6];

      j. saneringsprogramma: programma van maatregelen als bedoeld in [artikel 26, eerste lid][ref7];

      k. geluidsgevoelige ruimte: een verblijfsruimte als bedoeld in het [Bouwbesluit 2003][ref8], met uitzondering van
      een keuken met een vloeroppervlak van minder dan 11 m2;

      l. categorie a-ruimte: verblijfsruimte als bedoeld in
      [artikel 10, tweede lid, onder a, van het Besluit grenswaarden binnen zones langs wegen][ref9];

      m. categorie b-ruimte: verblijfsruimte als bedoeld in
      [artikel 10, tweede lid, onder b, van het Besluit grenswaarden binnen zones langs wegen][ref10].

      2 Onder een wijziging van een spoorweg wordt in dit besluit niet verstaan de afzonderlijke omstandigheid die
      bestaat uit:

      a. een verhoging van minder dan 45% in de maatgevende intensiteit van door Onze Minister te bepalen categorieën
      spoorvoertuigen op een bepaald spoorweggedeelte of een combinatie van spoorweggedeelten in de ingevolge
      [artikel 1, eerste lid, onder f][ref11], in acht te nemen etmaalperiode;

      b. een verhoging van 20% of minder van de verkeerssnelheid van door Onze Minister te bepalen categorieën
      spoorvoertuigen op een bepaald spoorweggedeelte of een combinatie van spoorweggedeelten in de ingevolge
      [artikel 1, eerste lid, onder f][ref12], in acht te nemen etmaalperiode;

      c. een horizontale verplaatsing van de spoorstaven over een afstand kleiner dan twee meter;

      d. een verticale verplaatsing van de spoorstaven over een afstand kleiner dan één meter dan wel

      e. het ter vervanging aanbrengen van een baanconstructie, die, bepaald met inachtneming van de door Onze Minister
      op grond van [artikel 23][ref13] gestelde regels, niet meer geluid emitteert dan de te vervangen constructie.

      3 Onverminderd het bepaalde in het tweede lid wordt onder een wijziging van een spoorweg in dit besluit niet
      verstaan een wijziging die een verhoging van 2 dB(A) of minder tot gevolg heeft, en tengevolge waarvan de
      geluidsbelasting van de gevel van woningen of van andere geluidsgevoelige gebouwen niet hoger zal zijn dan 65
      dB(A).

      4 Onze Minister kan in overeenstemming met Onze Minister van Verkeer en Waterstaat na overleg met de betrokken
      spoorwegexploitant en de betrokken colleges van burgemeester en wethouders de in het eerste lid, onder c, bedoelde
      kaart wijzigen met inachtneming van de uitgangspunten die bij de vaststelling van de kaart zijn gehanteerd. Van een
      wijziging van de kaart wordt mededeling gedaan in de Staatscourant.


