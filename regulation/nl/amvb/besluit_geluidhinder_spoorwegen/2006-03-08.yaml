  - number: 26d
    text: Onze Minister stelt nadere regels vast met betrekking tot de vormgeving en inrichting van een saneringsprogramma.
    url: https://wetten.overheid.nl/BWBR0004137/2006-03-08#Artikel26d
  - number: '27'
    text: |-
      1 Burgemeester en wethouders, onderscheidenlijk de spoorwegexploitant leggen het ingevolge [artikel 26][ref1]
      vastgestelde saneringsprogramma onverwijld voor aan Onze Minister en zenden tegelijkertijd een afschrift van dit
      saneringsprogramma aan gedeputeerde staten.

      2 Onze Minister stelt na ontvangst van zodanig saneringsprogramma de ten hoogste toelaatbare waarde van de
      geluidsbelasting, vanwege de spoorweg, van de gevel van de woningen of andere geluidsgevoelige gebouwen of aan de
      grens van geluidsgevoelige terreinen vast waarop het saneringsprogramma betrekking heeft, met dien verstande dat
      deze waarde, in afwijking van de [artikelen 7 tot en met 11][ref2] en behoudens het derde en vierde lid, voor zover
      het woningen en geluidsgevoelige terreinen betreft de waarde 65 dB(A) en voor zover het andere geluidsgevoelige
      gebouwen betreft de waarde 60 dB(A), niet te boven mag gaan. Onze Minister doet van zijn besluit mededeling aan
      burgemeester en wethouders en de spoorwegexploitant.

      3 Indien overwegende bezwaren bestaan van stedenbouwkundige, verkeerskundige, landschappelijke of financiële aard
      tegen de toepassing van maatregelen gericht op het terugbrengen van de geluidsbelasting, vanwege de spoorweg, van
      de gevel van de woningen, andere geluidsgevoelige gebouwen of aan de grens van geluidsgevoelige terreinen, kan bij
      een besluit als bedoeld in het tweede lid, voor woningen en geluids-gevoelige terreinen een hogere waarde dan 65
      dB(A), onderscheidenlijk voor andere geluidsgevoelige gebouwen een hogere waarde dan 60 dB(A) worden vastgesteld,
      met dien verstande dat deze waarde 73 dB(A) voor woningen en geluidsgevoelige terreinen, onderscheidenlijk 68 dB(A)
      voor andere geluidsgevoelige gebouwen, niet te boven mag gaan.

      4 Onze Minister kan bij een besluit als bedoeld in het tweede lid voor de ten hoogste toelaatbare geluidsbelasting
      voor woningen een hogere dan de in het derde lid genoemde waarde vaststellen, in gevallen waarin:

      a. toepassing van maatregelen die strekken tot vermindering van het geluid, veroorzaakt door het verkeer op de
      spoorweg niet mogelijk is,

      b. toepassing van maatregelen die strekken tot vermindering van de geluidsoverdracht van de spoorweg naar de
      betrokken woningen niet mogelijk is of duurder zal zijn dan € 97.110,-- per woning,

      c. het onttrekken aan de bestemming van de betrokken woningen binnen het bedrag van € 97.110,-- per woning niet
      mogelijk is, en

      d. koppeling van het treffen van maatregelen aan andere activiteiten niet kan leiden tot het terugbrengen van de
      geluidsbelasting, vanwege de spoorweg, tot de in het tweede of derde lid genoemde waarde binnen het bedrag van €
      97.110,-- per woning.

      5 In afwijking van [artikel 157, eerste lid, van de wet][ref3] geeft Onze Minister toepassing
      aan het derde lid, voor zover de gecumuleerde geluidsbelastingen na de correctie op grond van
      [artikel 157, derde lid, van de wet][ref4] niet zal leiden tot een naar zijn oordeel onaanvaardbare
      geluidsbelasting.

      6 Onze Minister doet van zijn besluit mededeling aan burgemeester en wethouders, aan gedeputeerde staten, aan
      de spoorwegexploitant en aan de gebruikers van de woningen, het bevoegde gezag van scholen en de directies van
      ziekenhuizen en andere gezondheidszorggebouwen waarvoor een hogere waarde is bepaald.

      7 Indien Onze Minister toepassing heeft gegeven aan het derde lid treffen burgemeester en wethouders de in het
      achtste lid beschreven maatregelen, indien

      a. ten minste één geluidsgevoelige ruimte binnen een woning, onderscheidenlijk ten minste één categorie b-ruimte
      binnen een ander geluidsgevoelig gebouw niet zijnde een woning een geluidsbelasting ondervindt van meer dan 45
      dB(A), of

      b. ten minste één categorie a-ruimte binnen een ander geluidsgevoelig gebouw niet zijnde een woning een
      geluidsbelasting ondervindt van meer dan 40 dB(A).

      8 De maatregelen ter uitvoering van het zevende lid hebben betrekking op de geluidwering van de gevel en bevorderen
      dat de geluidsbelasting bij gesloten ramen:

      a. in het zevende lid, onder a, bedoelde geval in geluidsgevoelige ruimten binnen de woning, onderscheidenlijk
      in categorie b-ruimten binnen het andere geluidsgevoelige gebouw, 40 dB(A), dan wel een door het gemeentebestuur
      doelmatig geoordeelde hogere waarde van ten hoogste 45 dB(A), niet te boven zal gaan;

      b. in het zevende lid, onder b, bedoelde geval in categorie a-ruimten binnen het andere geluidsgevoelige gebouw 35
      dB(A), dan wel een door het gemeentebestuur doelmatig geoordeelde hogere waarde van ten hoogste 40 dB(A), niet te
      boven zal gaan.

      9 Onze Minister stelt ten aanzien van elk van de daarvoor in aanmerking komende gevallen maatregelen vast die
      strekken tot het terugbrengen van de geluidsbelasting, vanwege de spoorweg, van de gevel van de betrokken woningen,
      andere geluidsgevoelige gebouwen, of aan de grens van de geluidsgevoelige terreinen, tot het bij het besluit,
      bedoeld in het tweede lid, vastgestelde waarde. De maatregelen strekken tevens, afhankelijk van de hoogte van
      deze waarde, tot het terugbrengen van de geluidsbelasting, vanwege de spoorweg, binnen de woning of het andere
      geluidsgevoelige gebouw.


