  - number: 4a
    text: |-
      1 Bij het nemen van een besluit tot vrijstelling als bedoeld in
      [artikel 19 van de Wet op de Ruimtelijke Ordening][ref1] dat geheel of gedeeltelijk betrekking heeft op gronden
      behorende tot een zone als bedoeld in [artikel 3][ref2], worden ter zake van de geluidsbelasting, vanwege de
      spoorweg waarlangs die zone ligt, van de gevel van woningen en van andere gebouwen dan woningen of van andere
      geluidsgevoelige objecten binnen die zone de waarden in acht genomen, die ingevolge de [artikelen 7][ref3],
      [8][ref4], [9][ref5], [10][ref6] en [11, eerste, tweede, derde, vijfde en zesde lid][ref7], als de hoogste
      toelaatbare worden aangemerkt.

      2 Gedeputeerde staten nemen bij hun beslissing over het verlenen van een verklaring van geen bezwaar ten behoeve
      van het nemen van een besluit als bedoeld in het eerste lid, het bepaalde in dat lid in acht.


