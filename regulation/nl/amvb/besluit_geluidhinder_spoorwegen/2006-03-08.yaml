  - number: '9'
    text: |-
      1 Gedeputeerde staten kunnen voor de ten hoogste toelaatbare geluidsbelasting, vanwege een spoorweg, van de gevel
      van gebouwen, behorend tot de in [artikel 2, eerste lid, onder ][ref1], genoemde categorieën, op verzoek van
      degenen die in [artikel 14][ref2] aangewezen zijn, een hogere waarde dan de in [artikel 7, tweede lid][ref3],
      genoemde vaststellen, met dien verstande dat deze waarde 70 dB(A) niet te boven mag gaan.

      2 Gedeputeerde staten kunnen alleen toepassing geven aan het eerste lid in die gevallen waarin toepassing van
      maatregelen, gericht op het terugbrengen van de geluidsbelasting, vanwege de spoorweg, van de gevel van de
      betrokken gebouwen tot 55 dB(A) onvoldoende doeltreffend zal zijn, dan wel overwegende bezwaren ontmoet van
      stedebouwkundige, vervoerskundige, landschappelijke of financiële aard.


      [ref1]: https://wetten.overheid.nl/BWBR0004137#Artikel2
