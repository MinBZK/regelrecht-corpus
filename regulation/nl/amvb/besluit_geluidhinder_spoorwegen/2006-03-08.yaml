  - number: '23'
    text: |-
      1 Ten behoeve van de vaststelling van de geluidsbelasting, vanwege een spoorweg, stelt Onze Minister voor het
      bepalen van het equivalente geluidsniveau regels, inhoudende op welke wijze en met inachtneming van welke bestaande
      of te verwachten omstandigheden de afwisselende niveaus van het ter plaatse optredende geluid worden vastgesteld en
      op welke wijze uit de over een bepaalde periode verkregen uitkomsten het gemiddelde wordt afgeleid.

      2 Onze Minister stelt regels omtrent al hetgeen betrekking heeft op de wijze waarop de akoestische onderzoeken,
      bedoeld in dit besluit, worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0004137/2006-03-08#Artikel23
  - number: '24'
    text: |-
      1 Bij aanleg of vervanging van een spoorweg of een gedeelte van een spoorweg dient de spoorwegexploitant, voor
      zover het bepaalde in de hoofdstukken 3, 4 of 5 hierop niet van toepassing is, ervoor zorg te dragen dat de
      geluidsemissie vanwege de nieuwe baanconstructie niet hoger wordt dan van een overeenkomstige spoorbaan waarvan de
      constructie bestaat uit langgelast spoor op houten dwarsliggers.

      2 Op verzoek van de spoorwegexploitant kan Onze Minister in overeenstemming met Onze Minister van Verkeer en
      Waterstaat ontheffing geven van het vereiste in het eerste lid, indien toepassing van dat lid op overwegende
      bezwaren van technische of financiële aard stuit.
    url: https://wetten.overheid.nl/BWBR0004137/2006-03-08#Artikel24
  - number: '25'
    text: |-
      1 Burgemeester en wethouders melden na een ingesteld akoestisch onderzoek voor 1 januari 2007 aan Onze Minister
      de in de gemeente voorkomende gevallen, waarin op 1 juli 1987 een spoorweg aanwezig was, terwijl op dat tijdstip
      binnen de zone van die spoorweg reeds woningen, andere geluidsgevoelige gebouwen of geluidsgevoelige terreinen
      aanwezig waren en de geluidsbelasting, vanwege de spoorweg, op dat tijdstip:

      a. van de gevel van woningen hoger was dan 65 dB(A);

      b. van de gevel van andere geluidsgevoelige gebouwen hoger was dan 60 dB(A), onderscheidenlijk

      c. aan de grens van geluidsgevoelige terreinen, anders dan woonwagenstandplaatsen, hoger was dan 65 dB(A).

      2 Indien burgemeester en wethouders woningen als bedoeld in het eerste lid voor 1 januari 1997 aan Onze Minister
      hebben gemeld en bij die gelegenheid hebben verklaard dat het treffen van geluidwerende maatregelen de enige
      oplossing is die in aanmerking komt, geldt die melding als melding op grond van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004137/2006-03-08#Artikel25
  - number: '26'
    text: |-
      1 Behoudens het derde lid stellen burgemeester en wethouders met inachtneming van de
      [artikelen 26a tot en met 26d][ref1] een programma van maatregelen op, die naar hun oordeel in aanmerking komen
      om de geluidsbelasting, vanwege de spoorweg, van de gevel van de in [artikel 25][ref2] bedoelde woningen en andere
      geluidsgevoelige gebouwen en aan de grens van de in [dat artikel][ref3] bedoelde geluidsgevoelige terreinen, zoveel
      mogelijk te beperken tot 57 dB(A) en om zo nodig te voldoen aan [artikel 27, zevende en achtste lid][ref4].

      2 In een geval als bedoeld in [artikel 1a][ref5] wordt vanwege de spoorwegexploitant een akoestisch onderzoek
      ingesteld van de in [artikel 5][ref6] omschreven strekking.

      3 In een geval als bedoeld in [artikel 1a][ref7] stelt de spoorwegexploitant een saneringsprogramma op, met dien
      verstande dat dit saneringsprogramma tevens de resultaten van het in het tweede lid bedoelde akoestisch onderzoek
      bevat en mede betrekking heeft op andere binnen de zone van de spoorweg gelegen woningen, andere geluidsgevoelige
      gebouwen en geluidsgevoelige terreinen.


      [ref1]: https://wetten.overheid.nl/BWBR0004137#Artikel26a
      [ref2]: https://wetten.overheid.nl/BWBR0004137#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0004137#Artikel25
