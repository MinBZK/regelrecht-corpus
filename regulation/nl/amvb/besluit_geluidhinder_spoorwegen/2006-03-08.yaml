  - number: '2'
    text: |-
      1 In dit besluit wordt verstaan onder andere geluidsgevoelige gebouwen:

      a. basisscholen;

      b. scholen voor voortgezet onderwijs als bedoeld in de [Wet op het voortgezet onderwijs][ref1];

      c. instellingen voor hoger beroepsonderwijs;

      d. algemene, categorale en academische ziekenhuizen, alsmede verpleeghuizen;

      e. andere gezondheidszorggebouwen dan bedoeld onder *d*.

      2 Een gymnastieklokaal maakt voor de toepassing van dit besluit geen deel uit van de in het eerste lid, onder *a*,
      *b* en *c*, genoemde scholen.

      3 In dit besluit wordt verstaan onder geluidsgevoelige terreinen:

      a. terreinen die behoren bij gebouwen als bedoeld in het eerste lid, onder *e*, voor zover deze bestemd zijn of
      gebruikt worden voor de in die gebouwen gegeven zorg en

      b. woonwagenstandplaatsen.

      4 In afwijking van [artikel 1, eerste lid, onder g][ref2], is de geluidsbelasting, vanwege een spoorweg, van
      de gevel van scholen en van medische kleuterdagverblijven als bedoeld in het eerste lid de dagwaarde van het
      equivalente geluidsniveau in dB(A).


      [ref1]: https://wetten.overheid.nl/BWBR0002399
