  - number: '5'
    text: |-
      Bij het voorbereiden van de vaststelling of herziening van een bestemmingsplan als bedoeld in artikel 4 wordt
      vanwege burgemeester en wethouders een akoestisch onderzoek ingesteld naar:

      a. de geluidsbelasting die door woningen, door andere geluidsgevoelige gebouwen of geluidsgevoelige
      terreinen binnen de zone vanwege de spoorweg zou worden ondervonden, zonder de invloed van maatregelen die de
      geluidsoverdracht beperken;

      b. de doeltreffendheid van de in aanmerking komende maatregelen om te voorkomen dat de in de toekomst vanwege de
      spoorweg optredende geluidsbelasting van de onder *a* bedoelde objecten de waarden die ingevolge de artikelen 7 tot
      en met 11 als ten hoogste toelaatbaar worden aangemerkt, te boven zou gaan.
    url: https://wetten.overheid.nl/BWBR0004137/2006-03-08#Artikel5
  - number: '7'
    text: |-
      1 Behoudens het bepaalde in de [artikelen 8][ref1] en [11][ref2] is de ten hoogste toelaatbare geluidsbelasting,
      vanwege een spoorweg, van de gevel van woningen binnen de zone van die spoorweg 57 dB(A).

      2 Behoudens het bepaalde in de [artikelen 9][ref3] en [11][ref4] is de ten hoogste toelaatbare geluidsbelasting,
      vanwege een spoorweg, van de gevel van de in [artikel 2, eerste lid, onder ][ref5], genoemde categorieën van
      geluidsgevoelige gebouwen binnen de zone van die spoorweg 55 dB(A).

      3 Behoudens het bepaalde in de [artikelen 10][ref6] en [11][ref7] is de ten hoogste toelaatbare geluidsbelasting,
      vanwege een spoorweg, aan de grens van binnen de zone van die spoorweg gelegen geluidsgevoelige terreinen 57 dB(A).


