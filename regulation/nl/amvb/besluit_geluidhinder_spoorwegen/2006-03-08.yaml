  - number: 26a
    text: |-
      1 Een saneringsprogramma kan uitsluitend de volgende maatregelen bevatten:

      a. geluidreducerende maatregelen aan een spoorweg;

      b. maatregelen die de geluidsoverdracht van een spoorweg naar woningen en andere geluidsgevoelige gebouwen of
      geluidsgevoelige terreinen verminderen;

      c. geluidwerende maatregelen aan de gevel van de betrokken woningen of andere geluidsgevoelige gebouwen;

      d. onttrekking aan de bestemming van één of meer van de betrokken woningen.

      2 Maatregelen als bedoeld in het eerste lid, onder b, onder c, onderscheidenlijk onder d, komen eerst in aanmerking
      voor opneming in het saneringsprogramma, voor zover de toepassing van de in het eerste lid, onder a, genoemde
      maatregelen, onderscheidenlijk de in het eerste lid, onder a en b, dan wel onder a, b en c, genoemde maatregelen
      onvoldoende doeltreffend zal zijn, dan wel overwegende bezwaren ontmoeten van stedenbouwkundige, verkeerskundige,
      landschappelijke of financiële aard.
    url: https://wetten.overheid.nl/BWBR0004137/2006-03-08#Artikel26a
  - number: 26b
    text: |-
      Op de voorbereiding van een saneringsprogramma door burgemeester en wethouders of door de spoorwegexploitant is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0004137/2006-03-08#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 26c
    text: |-
      1 Een saneringsprogramma bevat:

      a. de resultaten van het akoestisch onderzoek, bedoeld in [artikel 25][ref1];

      b. een of meer kaarten met bijbehorende verklaring als bedoeld in het tweede lid, een lijst met adressen van de
      betrokken woningen, andere geluidsgevoelige gebouwen en geluidsgevoelige terreinen, alsmede het trajectnummer van
      het spoorweggedeelte of de combinatie van spoorweggedeelten, waarvan de geluidsbelasting wordt ondervonden;

      c. een beschrijving van de maatregelen, bedoeld in [artikel 26a, eerste lid, onder a en b][ref2], die in aanmerking
      komen, en van het effect van de maatregelen op de geluidsbelasting in het maatgevende jaar, vanwege de spoorweg,
      van de gevel van betrokken woningen en andere geluidsgevoelige gebouwen en aan de grens van geluidsgevoelige
      terreinen;

      d. voor zover toepassing van de in [artikel 26a, eerste lid, onder a en b][ref3], bedoelde – in het
      saneringsprogramma opgenomen – maatregelen niet leidt tot beperking van de geluidsbelasting, vanwege de spoorweg,
      tot 57 dB(A), een beschrijving van de bezwaren van stedenbouwkundige, verkeerskundige, landschappelijke of
      financiële aard tegen de toepassing van verdergaande maatregelen;

      e. zo nodig, een verklaring dat door middel van geluidwerende maatregelen als bedoeld in
      [artikel 26a, eerste lid, onder c][ref4], zal worden voldaan aan [artikel 27, zevende en achtste lid][ref5];

      f. voor zover van toepassing, een beschrijving van de maatregelen, bedoeld in
      [artikel 26a, eerste lid, onder d][ref6], alsmede een onderbouwing van de keuze;

      g. voor zover met toepassing van [artikel 26a, tweede lid][ref7], andere dan meer primaire maatregelen in
      aanmerking komen, een beschrijving van de redenen daarvoor;

      h. een beschrijving van de mogelijkheden om uit een oogpunt van doelmatigheid en kostenbeheersing de te treffen
      maatregelen al dan niet gezamenlijk uit te voeren met andere werken;

      i. een globale indicatie van de geluidsbelasting, vanwege andere geluidsbronnen als bedoeld in de
      [artikelen 41][ref8], [53][ref9], [74][ref10] en [108 van de wet][ref11], [artikel 25a van de Luchtvaartwet][ref12]
      en [artikel 8.1 van de Wet luchtvaart][ref13];

      j. een globale indicatie van de kosten van de te treffen maatregelen;

      k. het tijdstip waarop met de uitvoering van de maatregelen kan worden begonnen, alsmede de verwachte duur van de
      uitvoering van de maatregelen.

      2 De kaart of kaarten, bedoeld in het eerste lid, onder b, geven in elk geval aan:

      a. de zone langs de spoorweg of spoorwegen en de ligging van de betrokken woningen, andere geluidsgevoelige
      gebouwen en geluidsgevoelige terreinen;

      b. bronmaatregelen of overdrachtsmaatregelen, en

      c. voor zover hiervan sprake is, de ligging van de betrokken woningen, andere geluidsgevoelige gebouwen en
      geluidsgevoelige terreinen binnen:

      1°. een geluidszone rond een industrieterrein,

      2°. een geluidszone rond een luchtvaartterrein,

      3°. een geluidszone langs een weg, of

      4°. een andere geluidszone.

      3 [Artikel 16, eerste lid, onder a, b, c, d, f, g en h, van het Besluit op de ruimtelijke ordening 1985][ref14] is
      van overeenkomstige toepassing op de in het eerste lid, onder b, bedoelde kaart of kaarten.


