  - number: '17'
    text: |-
      De verzoeker zendt gelijktijdig met het indienen van zijn verzoek een afschrift van het verzoek en de hierbij
      behorende stukken naar:

      a. de verzoekgerechtigden, bedoeld in [artikel 14][ref1], die het verzoek niet hebben gedaan;

      b. de betrokken regionale directie van het Directoraat-Generaal Rijkswaterstaat van het Ministerie van Verkeer
      en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004137#Artikel14
    url: https://wetten.overheid.nl/BWBR0004137/2006-03-08#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004137
        artikel: '14'
        hoofdstuk: '4'
  - number: '18'
    text: |-
      1 Gedeputeerde staten tekenen de datum van ontvangst van een verzoek aan op het geschrift waarbij het verzoek is
      ingediend, en zenden de verzoeker een bewijs van ontvangst, waarin die datum is vermeld.

      2 Gedeputeerde staten beslissen op het verzoek binnen drie maanden na de in het eerste lid bedoelde datum en doen
      mededeling van hun besluit aan de in artikel 17 bedoelde personen.

      3 Indien toepassing is gegeven aan artikel 4, tweede lid, onder *b*, wordt het verzoek binnen vier weken na de
      dagtekening van het raadsbesluit tot vaststelling of herziening van het bestemmingsplan bij gedeputeerde staten
      ingediend. In afwijking van het tweede lid beslissen gedeputeerde staten op een verzoek als bedoeld in de eerste
      volzin voordat zij over de goedkeuring van het bestemmingsplan of de herziening hiervan beslissen.

      4 Een verzoek wordt geacht te zijn ingewilligd, indien gedeputeerde staten:

      a. niet binnen de in het tweede lid bedoelde termijn, of

      b. ingeval toepassing wordt gegeven aan het derde lid, tweede volzin, niet uiterlijk tegelijk met het toezenden van
      de beslissing over de goedkeuring van het bestemmingsplan of de herziening hiervan,

      een besluit met betrekking tot het verzoek aan de verzoeker hebben toegezonden.

      5 Aan een verzoek wordt geacht goedkeuring te zijn onthouden, indien het verzoek niet binnen de in het derde lid,
      eerste volzin, bedoelde termijn is ingediend en gedeputeerde staten geen beslissing hebben genomen als bedoeld in
      de tweede volzin van dat lid.
    url: https://wetten.overheid.nl/BWBR0004137/2006-03-08#Artikel18
  - number: '19'
    text: |-
      Tot aanleg of wijziging van een spoorweg, anders dan op grondslag van een overeenkomstig de artikelen 4 tot en met
      6 vastgesteld of herzien bestemmingsplan, wordt, indien binnen de aanwezige of toekomstige zone woningen, andere
      geluidsgevoelige gebouwen of geluidsgevoelige terreinen aanwezig, in aanbouw of geprojecteerd zijn, niet overgegaan
      dan in overeenstemming met een onherroepelijk geworden besluit van de gemeenteraad krachtens artikel 21, eerste
      lid, genomen naar aanleiding van een door de spoorwegexploitant aan burgemeester en wethouders gedane mededeling
      van zijn voornemen en na een overeenkomstig artikel 20 ingesteld onderzoek.
    url: https://wetten.overheid.nl/BWBR0004137/2006-03-08#Artikel19
  - number: '20'
    text: |-
      1 Vanwege de spoorwegexploitant wordt binnen de zone een akoestisch onderzoek ingesteld van de in artikel 5
      omschreven strekking.

      2 De resultaten van het ingestelde onderzoek worden door de spoorwegexploitant aan burgemeester en wethouders
      overgelegd, te zamen met een beschrijving van de maatregelen die naar zijn oordeel nodig zijn voor het in artikel
      21 omschreven doel.
    url: https://wetten.overheid.nl/BWBR0004137/2006-03-08#Artikel20
  - number: '21'
    text: |-
      1 Binnen zes maanden nadat de resultaten van het in [artikel 20][ref1] bedoelde onderzoek zijn verkregen, neemt
      de gemeenteraad, tenzij hij burgemeester en wethouders hiertoe bevoegd heeft verklaard, een besluit als bedoeld in
      [artikel 19][ref2], bepalende welke maatregelen nodig zijn om te voorkomen dat de geluidsbelasting die de spoorweg
      binnen de zone zal veroorzaken, de waarden die ingevolge de [artikelen 7 tot en met 11][ref3] als ten hoogste
      toelaatbaar worden aangemerkt, te boven zou gaan.

      2 Het besluit wordt in afschrift aan de spoorwegexploitant toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004137#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0004137#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0004137#Artikel7
    url: https://wetten.overheid.nl/BWBR0004137/2006-03-08#Artikel21
