        artikel: '19'
  - number: '16'
    text: |-
      1 Het verzoek en het ontwerp van een verzoek bevatten ten minste:

      a. de verzochte hogere waarden;

      b. de redenen die aan het verzoek ten grondslag liggen;

      c. de resultaten van het akoestisch onderzoek, bedoeld in [artikel 5][ref1] of [20][ref2];

      d. een beschrijving van de mogelijkheden om de geluidsbelasting van de gevel van de woningen of de andere
      geluidsgevoelige gebouwen of aan de grens van de geluidsgevoelige terreinen tot een lagere waarde te verminderen
      dan de onder *a* bedoelde, alsmede een schatting van de hieraan verbonden extra kosten;

      e. een verklaring dat maatregelen als bedoeld in [artikel 13][ref3], zullen worden getroffen,
      indien de geluidsbelasting binnen de woning onderscheidenlijk binnen de verblijfsruimten van de in
      [artikel 2, eerste lid, onder a tot en met e][ref4], bedoelde gebouwen, bij gesloten ramen, meer bedraagt dan de in
      [artikel 13, eerste, tweede of derde lid][ref5], bedoelde waarden;

      f. een beschrijving met een schetstekening of een verklaring omtrent de wijze waarop aan
      [artikel 8, derde lid][ref6], voldaan zal worden, dan wel, indien aan [dat artikel][ref7] niet voldaan kan worden,
      de redenen daarvan;

      g. voor zover het verzoek hier aanleiding toe geeft, een beschrijving, schetstekening en uitvoeringsplan van de
      geluidafschermende voorziening tussen spoorweg en woningen, andere geluidsgevoelige gebouwen of geluidsgevoelige
      terreinen, indien deze voorziening vereist is om de in het verzoek begrepen waarden te waarborgen.

      2 Het verzoek gaat vergezeld van een of meer kaarten met bijbehorende verklaring. Met betrekking tot deze
      kaart of kaarten is [artikel 16 van het Besluit op de ruimtelijke ordening 1985][ref8] (*Stb.* 1985, 627) van
      overeenkomstige toepassing, met dien verstande dat in plaats van "plan" telkens gelezen wordt: "verzoek". De
      kaart of kaarten geven bovendien de ligging weer van geluidszones langs wegen, rond industrieterreinen en rond
      luchtvaartterreinen als bedoeld in [artikel 25, tweede lid, van de Luchtvaartwet][ref9] (*Stb.* 1958, 47), alsmede
      de in die zones voorkomende gebieden, aangewezen overeenkomstig [artikel 1.2, tweede lid, onder ][ref10], voor
      zover de woningen, andere geluidsgevoelige gebouwen of geluidsgevoelige terreinen waarop het verzoek betrekking
      heeft, binnen zodanige zones zijn of worden gesitueerd.

      3 Gedeputeerde staten kunnen van de verzoeker nadere toelichting, tekeningen en kaarten verlangen, indien zij deze
      noodzakelijk achten voor de beoordeling van het verzoek.

      4 Indien ingevolge de mate van detaillering van het bestemmingsplan waarin de woningen, andere geluidsgevoelige
      gebouwen of geluidsgevoelige terreinen waarop het verzoek betrekking heeft, zijn opgenomen, de in het eerste lid,
      onder *f*, en het tweede lid bedoelde stukken niet beschikbaar zijn, kunnen gedeputeerde staten afwijken van het in
      die artikelonderdelen bepaalde.


