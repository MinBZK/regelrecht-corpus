  - number: '10'
    text: |-
      1 Gedeputeerde staten kunnen voor de ten hoogste toelaatbare geluidsbelasting, vanwege een spoorweg, aan de grens
      van geluidsgevoelige terreinen, op verzoek van degenen die in artikel 14 aangewezen zijn, een hogere waarde dan de
      in artikel 7, derde lid, genoemde vaststellen, met dien verstande dat deze waarde 65 dB(A) niet te boven mag gaan.

      2 Gedeputeerde staten kunnen alleen toepassing geven aan het eerste lid in gevallen waarin toepassing van
      maatregelen, gericht op het terugbrengen van de geluidsbelasting, vanwege een spoorweg, aan de grens van het
      betrokken terrein tot 60 dB(A), onvoldoende doeltreffend zal zijn, dan wel overwegende bezwaren ontmoet van
      stedebouwkundige, vervoerskundige, landschappelijke of financiële aard.
    url: https://wetten.overheid.nl/BWBR0004137/2006-03-08#Artikel10
  - number: '11'
    text: |-
      1 Ingeval met betrekking tot aanwezige of in aanbouw zijnde woningen waarvoor toepassing is gegeven aan
      het derde lid van dit artikel, [artikel 8][ref1] of [artikel 27, tweede lid, van dit besluit][ref2] of de
      [artikelen 87e][ref3], [87h][ref4], [87i][ref5], [106d tot en met 106f, van de wet][ref6], een aanvang wordt
      gemaakt met de wijziging van een spoorweg en de bestaande geluidsbelasting op het tijdstip waarop met die wijziging
      een aanvang wordt gemaakt, lager is dan de vastgestelde hogere waarde, geldt als de ten hoogste toelaatbare
      geluidsbelasting, vanege de spoorweg, van de gevel van die woningen de bestaande geluidsbelasting op dat tijdstip,
      met dien verstande, dat een vastgestelde geluidsbelasting waarvan de waarde 57 dB(A) niet te boven gaat, in elk
      geval als toelaatbaar blijft aangemerkt.

      2 Ingeval met betrekking tot aanwezige of in aanbouw zijnde woningen waarvoor geen toepassing is gegeven aan
      het derde lid van dit artikel, [artikel 8][ref7] of [artikel 27, tweede lid, van dit besluit][ref8] of de
      [artikelen 87e][ref9], [87h][ref10], [87i][ref11], [106d tot en met 106f, van de wet][ref12], een aanvang
      wordt gemaakt met de wijziging van een spoorweg, geldt als de ten hoogste toelaatbare geluidsbelasting, vanwege
      de spoorweg, van de gevel van die woningen de laagste van de volgende waarden, met dien verstande dat een
      geluidsbelasting waarvan de waarde 57 dB(A) niet te boven gaat, in elk geval als toelaatbaar blijft aangemerkt:

      a. de geluidsbelasting op het tijdstip van in werking treden van dit besluit;

      b. de geluidsbelasting op het tijdstip waarop met de wijziging een aanvang wordt gemaakt.

      3 Gedeputeerde staten kunnen voor de ten hoogste toelaatbare geluidsbelasting, vanwege een spoorweg, van de
      gevel van de op het tijdstip van de aanvang van een wijziging binnen de zone aanwezige of in aanbouw zijnde
      woningen, op verzoek van degenen die in [artikel 14][ref13] aangewezen zijn, een hogere waarde dan de voor die
      woningen alsdan geldende waarde vaststellen, met dien verstande dat deze waarde in afwijking voor zover nodig van
      [artikel 8][ref14] 73 dB(A) niet te boven mag gaan.

      4 Gedeputeerde staten kunnen alleen toepassing geven aan het derde lid in die gevallen waarin toepassing van
      maatregelen, gericht op het terugbrengen van de geluidsbelasting, vanwege de spoorweg, van de gevel van de
      betrokken woningen tot de ingevolge het eerste of tweede lid geldende ten hoogste toelaatbare geluidsbelasting
      onvoldoende doeltreffend zal zijn, dan wel overwegende bezwaren ontmoet van stedebouwkundige, vervoerskundige,
      landschappelijke of financiële aard.

      5 Het in het eerste tot en met vierde lid bepaalde is van overeenkomstige toepassing op gebouwen, behorend tot de
      in [artikel 2, eerste lid, onder ][ref15], bedoelde categorieën, met dien verstande dat in plaats van de in het
      eerste en tweede lid genoemde waarde van 60 dB(A) 55 dB(A) wordt gelezen.

      6 Het in het eerste tot en met vierde lid bepaalde is van overeenkomstige toepassing aan de grens van
      geluidsgevoelige terreinen, met dien verstande dat in plaats van de in het derde lid genoemde waarde van 73 dB(A)
      de betreffende in [artikel 10, eerste lid][ref16], genoemde waarde wordt gelezen.

      7 Bij toepassing van het derde en zesde lid wordt, indien reeds eerder een ten hoogste toelaatbare waarde is
      verleend die hoger is dan de in die leden genoemde maximale waarde, de genoemde waarde vervangen door de eerder
      verleende waarde.


