  - number: '13'
    text: |-
      1 Indien door toepassing van [artikel 8][ref1] of [11][ref2] voor de gevel van een of meer in aanbouw zijnde of
      aanwezige woningen een hogere geluidsbelasting dan 57 dB(A) als toelaatbaar is aangemerkt, treft het college van
      burgemeester en wethouders met betrekking tot de geluidwering van die gevel maatregelen om te bevorderen dat de
      geluidsbelasting, vanwege de spoorweg, binnen de woning bij gesloten ramen 37 dB(A) niet te boven zal gaan.

      2 Indien de geluidsbelasting van de gevel van een woning op 1 juli 1987 hoger was dan 65 dB(A) onderscheidenlijk
      van de gevel van een ander geluidsgevoelig gebouw hoger was dan 60 dB(A) en voor die woning of dat ander
      geluidsgevoelig gebouw eerder een hogere waarde voor de geluidsbelasting is vastgesteld op grond van dit besluit
      of de wet en met betrekking tot de woning toepassing is gegeven aan [artikel 11][ref3], treft het college van
      burgemeester en wethouders, in afwijking van het eerste lid, met betrekking tot de geluidwering van de gevels van
      de betrokken woning maatregelen om te bevorderen dat de geluidsbelasting, vanwege de spoorweg, binnen de woning
      bij gesloten ramen ten hoogste de waarde bedraagt die ten tijde van de vaststelling van de eerste hogere waarde ten
      hoogste toelaatbaar was.

      3 Het tweede lid is van overeenkomstige toepassing voor de woningen waarbij maatregelen aan de gevel zijn getroffen
      ter uitvoering van [artikel 13, zesde lid, van het Subsidiebesluit openbare lichamen milieubeheer][ref4].

      4 Indien door toepassing van de [artikelen 9][ref5] of [11][ref6] voor de gevel van een of meer in aanbouw zijnde
      of aanwezige gebouwen als bedoeld in [artikel 2, eerste lid, onder ][ref7], een hogere geluidsbelasting dan
      55 dB(A) als toelaatbaar is aangemerkt, treft de gemeenteraad met betrekking tot de geluidwering van die gevel
      maatregelen om te bevorderen dat de geluidsbelasting, vanwege de spoorweg, bij gesloten ramen

      a. binnen de verblijfsruimten, genoemd in [artikel 10, tweede lid, onder ][ref8], 30 dB(A) niet te boven zal gaan,
      en

      b. binnen de verblijfsruimten, genoemd in artikel 10, tweede lid, onder *b*, van het onder *a* genoemde besluit, 35
      dB(A) niet te boven zal gaan.


