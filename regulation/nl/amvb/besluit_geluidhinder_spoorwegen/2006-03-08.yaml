  - number: '14'
    text: |-
      Een verzoek als bedoeld in de artikelen 8 tot en met 11 kan worden gedaan door:

      a. burgemeester en wethouders van de gemeente waarin de woningen, de andere geluidsgevoelige gebouwen of de
      geluidsgevoelige terreinen, waarvoor de hogere waarde wordt verzocht, gesitueerd zijn of worden;

      b. burgemeester en wethouders van de gemeente waarin de spoorweg met betrekking waartoe de hogere waarde wordt
      verzocht, gesitueerd is of wordt;

      c. de spoorwegexploitant, indien het betreft de aanleg of wijziging van een spoorweg.
    url: https://wetten.overheid.nl/BWBR0004137/2006-03-08#Artikel14
  - number: '15'
    text: |-
      1 De verzoeker maakt zijn voornemen tot het indienen van een verzoek in ieder geval zoveel mogelijk gelijktijdig
      bekend door middel van:

      a. kennisgeving in een of meer in de in artikel 14, eerste lid, onder *a*, bedoelde gemeente verspreiding vindende
      dag-, nieuws- of huis-aan-huis-bladen en voorts op de in die gemeente gebruikelijke wijze;

      b. terinzagelegging van het ontwerp van het verzoek met de daarbij behorende stukken op het gemeentehuis van de in
      artikel 14, eerste lid, onder *a*, bedoelde gemeente;

      c. niet op naam gestelde kennisgeving aan de gebruikers van de woningen of de woonwagenstandplaatsen, het bevoegd
      gezag van scholen en de directies van de in artikel 2 bedoelde andere gebouwen waarvoor een hogere waarde wordt
      verzocht.

      2 De verzoeker stelt een ieder in de gelegenheid gedurende vier weken vanaf de dag waarop het ontwerp van het
      verzoek ter inzage is gelegd, het ontwerp met de daarbij behorende stukken in te zien en schriftelijk opmerkingen
      ten aanzien van het ontwerp te maken.

      3 Indien het voornemen tot het indienen van een verzoek verband houdt met een toepassing van [artikel 4][ref1],
      tweede lid, onder *b* of van [artikel 19 van de Wet op de Ruimtelijke Ordening][ref2], kan in afwijking van het
      tweede lid het ontwerp van het verzoek gedurende twee weken ter inzage worden gelegd.

      4 Burgemeester en wethouders van de gemeente, bedoeld in artikel 14, onder *a*, kunnen, indien zij hiertoe
      uitgenodigd zijn door een verzoeker als bedoeld in artikel 14, onder *b* of *c*, in plaats van deze toepassing
      geven aan het eerste of het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel19
    url: https://wetten.overheid.nl/BWBR0004137/2006-03-08#Artikel15
    references:
      - id: ref1
