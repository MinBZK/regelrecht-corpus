  - number: 2a
    text: |-
      Indien artikel 157 van de wet van toepassing is geven gedeputeerde staten slechts toepassing aan de artikelen 8, 9,
      10 en 11 voor zover de gecumuleerde geluidsbelastingen na de correctie op grond van artikel 157, derde lid, van de
      wet niet leidt tot een naar hun oordeel onaanvaardbare geluidsbelasting.
    url: https://wetten.overheid.nl/BWBR0004137/2006-03-08#Artikel2a
  - number: '3'
    text: |-
      1 Langs iedere spoorweg bevindt zich een zone, waarvan de breedte, gemeten vanuit de buitenste spoorstaaf, is
      aangegeven op de bij dit besluit behorende kaart.

      2 Indien gewijzigde omstandigheden zulks noodzakelijk maken, kan Onze Minister de op de kaart aangegeven breedte
      van een zone wijzigen. Artikel 1, vierde lid, is van overeenkomstige toepassing.

      3 Onze Minister kan op de kaart de breedte van een zone langs een nieuwe spoorweg aangeven. Artikel 1, vierde lid,
      is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004137/2006-03-08#Artikel3
  - number: '4'
    text: |-
      1 Bij de vaststelling of herziening van een bestemmingsplan dat geheel of gedeeltelijk betrekking heeft op gronden,
      behorende tot een zone als bedoeld in [artikel 3][ref1], worden ter zake van de geluidsbelasting, vanwege de
      spoorweg waarlangs de zone ligt, van de gevel van woningen of van andere geluidsgevoelige gebouwen of aan de grens
      van geluidsgevoelige terreinen binnen die zone, de waarden in acht genomen die ingevolge de [artikelen 7][ref2] en
      [11, eerste, tweede, vijfde en zesde lid][ref3] als ten hoogste toelaatbaar worden aangemerkt.

      2 In afwijking van het eerste lid worden bij de vaststelling of herziening van een bestemmingsplan als in dat lid
      bedoeld hogere waarden in acht genomen, voor zover:

      a. gedeputeerde staten met toepassing van [artikel 8,][ref4][9][ref5], [10][ref6] of
      [11, derde, vijfde of zesde lid][ref7], voor de vaststelling of herziening van het bestemmingsplan zodanige waarden
      hebben vastgesteld, dan wel

      b. zodanige waarden noodzakelijk zijn als gevolg van een vaststelling of herziening van het plan in afwijking
      van het ontwerp, zoals dit ter inzage heeft gelegen, welke waarden door gedeputeerde staten redelijkerwijs met
      toepassing van [artikel 8,][ref8][9][ref9], [10][ref10],[ 11, derde, vijfde of zesde lid][ref11], zullen worden
      vastgesteld.

      3 Gedeputeerde staten nemen bij hun beslissing over de goedkeuring van een bestemmingsplan of de herziening
      hiervan dat geheel of gedeeltelijk betrekking heeft op gronden, behorende tot een zone als bedoeld in
      [artikel 3][ref12], ter zake van de geluidsbelasting vanwege de spoorweg waarlangs die zone ligt, van de
      gevel van woningen en van andere gebouwen dan woningen, alsmede van andere geluidsgevoelige objecten binnen
      die zone, de waarden in acht, die ingevolge de [artikelen 7][ref13], [8,][ref14][9][ref15], [10][ref16] en
      [11, eerste, tweede, derde, vijfde en zesde lid][ref17], als de ten hoogste toelaatbare worden aangemerkt.

      4 Tenzij bij de vaststelling of herziening van een bestemmingsplan als bedoeld in het eerste lid wordt voorzien
      in de wijziging van een spoorweg, gelden het eerste, tweede en derde lid niet, indien op het tijdstip van die
      vaststelling of herziening de spoorweg reeds aanwezig of in aanleg is, met betrekking tot de daarbij in het plan
      opgenomen bebouwing en andere geluidsgevoelige objecten die op dat tijdstip reeds aanwezig of in aanbouw zijn.


