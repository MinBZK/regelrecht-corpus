  - number: '8'
    text: |-
      1 Gedeputeerde staten kunnen voor de ten hoogste toelaatbare geluidsbelasting van de gevel van woningen, vanwege
      een spoorweg, op verzoek van degenen die zijn aangewezen in [artikel 14][ref1], een hogere waarde dan de in
      [artikel 7, eerste lid][ref2], genoemde vaststellen, met dien verstande dat deze waarde 70 dB(A) niet te boven
      mag gaan.

      2 Gedeputeerde staten kunnen alleen toepassing geven aan het eerste lid in gevallen waarin toepassing van
      maatregelen, gericht op het terugbrengen van de geluidsbelasting, vanwege de spoorweg, van de gevel van de
      betrokken woningen tot 57 dB(A), onvoldoende doeltreffend zal zijn, dan wel overwegende bezwaren ontmoet van
      stedebouwkundige, vervoerskundige, landschappelijke of financiële aard.

      3 Het tweede lid vindt slechts toepassing in die gevallen waarin:

      a. nog niet geprojecteerde dan wel geprojecteerde woningen, die

      1e. in de omgeving van een station of halte gesitueerd worden,

      2e. verspreid gesitueerd worden buiten de bebouwde kom,

      3e. ter plaatse noodzakelijk zijn om redenen van grond- of bedrijfsgebondenheid,

      4e. ter plaatse gesitueerd worden ter vervanging van bestaande bebouwing,

      5e. in een stads- of dorpsvernieuwingsplan worden opgenomen,

      6e. door de gekozen situering of bouwvorm een doelmatige akoestisch afschermende functie gaan vervullen voor andere
      woningen - in aantal ten minste de helft van het aantal woningen waaraan de afschermende functie wordt toegekend -
      of voor andere geluidsgevoelige gebouwen of geluidsgevoelige terreinen, of

      7e. door de gekozen situering een open plaats tussen aanwezige bebouwing opvullen, of

      b. een nog niet geprojecteerde, geprojecteerde of te wijzigen spoorweg, voor zover deze spoorweg een noodzakelijke
      verkeers- en vervoersfunctie zal vervullen, behoudens het bepaalde in [artikel 11][ref3].

      4 Gedeputeerde staten kunnen bij de toepassing van het eerste en tweede lid ten aanzien van nog niet geprojecteerde
      woningen alleen een hogere waarde dan 60 dB(A) als de ten hoogste toelaatbare geluidsbelasting vaststellen,
      indien naar hun oordeel voldoende verzekerd wordt, dat de verblijfsruimten, alsmede de tot de woning behorende
      buitenruimten, niet aan de gevel worden gesitueerd waar de hoogste geluidsbelasting optreedt.

      5 Het vierde lid is niet van toepassing, indien naar het oordeel van gedeputeerde staten overwegingen van stedebouw
      of volkshuisvesting zich daartegen verzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0004137#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004137#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0004137#Artikel11
