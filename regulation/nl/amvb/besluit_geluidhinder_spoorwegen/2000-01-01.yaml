        artikel: '1'
  - number: '2'
    text: |-
      1 In dit besluit wordt verstaan onder andere geluidsgevoelige gebouwen:

      a. basisscholen;

      b. scholen voor voortgezet onderwijs als bedoeld in [deel I van de Wet op het voortgezet onderwijs](onbekend);

      c. instellingen voor hoger beroepsonderwijs;

      d. algemene, categorale en academische ziekenhuizen, alsmede verpleeghuizen;

      e. andere gezondheidszorggebouwen dan bedoeld onder *d*.

      2 Een gymnastieklokaal maakt voor de toepassing van dit besluit geen deel uit van de in het eerste lid, onder *a*,
      *b* en *c*, genoemde scholen.

      3 In dit besluit wordt verstaan onder geluidsgevoelige terreinen:

      a. terreinen die behoren bij gebouwen als bedoeld in het eerste lid, onder *e*, voor zover deze bestemd zijn of
      gebruikt worden voor de in die gebouwen gegeven zorg en

      b. woonwagenstandplaatsen.

      4 In afwijking van artikel 1, eerste lid, onder *g*, is de geluidsbelasting, vanwege een spoorweg, van de
      uitwendige scheidingsconstructie van scholen en van medische kleuterdagverblijven als bedoeld in het eerste lid de
      dagwaarde van het equivalente geluidsniveau in dB(A).
    url: https://wetten.overheid.nl/BWBR0004137/2000-01-01#Artikel2
  - number: 2a
    text: |-
      Indien artikel 157 van de wet van toepassing is geven gedeputeerde staten slechts toepassing aan de artikelen 8, 9,
      10 en 11 voor zover de gecumuleerde geluidsbelastingen na de correctie op grond van artikel 157, derde lid, van de
      wet niet leidt tot een naar hun oordeel onaanvaardbare geluidsbelasting.
    url: https://wetten.overheid.nl/BWBR0004137/2000-01-01#Artikel2a
  - number: '3'
    text: |-
      1 Langs iedere spoorweg bevindt zich een zone, waarvan de breedte, gemeten vanuit de buitenste spoorstaaf, is
      aangegeven op de bij dit besluit behorende kaart.

      2 Indien gewijzigde omstandigheden zulks noodzakelijk maken, kan Onze Minister de op de kaart aangegeven breedte
      van een zone wijzigen. Artikel 1, vierde lid, is van overeenkomstige toepassing.

      3 Onze Minister kan op de kaart de breedte van een zone langs een nieuwe spoorweg aangeven. Artikel 1, vierde lid,
      is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004137/2000-01-01#Artikel3
  - number: '4'
    text: |-
      1 Bij de vaststelling of herziening van een bestemmingsplan dat geheel of gedeeltelijk betrekking heeft op gronden,
      behorende tot een zone als bedoeld in artikel 3, worden ter zake van de geluidsbelasting, vanwege de spoorweg
      waarlangs de zone ligt, van de uitwendige scheidingsconstructie van woningen of van andere geluidsgevoelige
      gebouwen of aan de grens van geluidsgevoelige terreinen binnen die zone, de waarden in acht genomen die ingevolge
      de artikelen 7 en 11, eerste, tweede, vijfde en zesde lid als ten hoogste toelaatbaar worden aangemerkt.

      2 In afwijking van het eerste lid worden bij de vaststelling of herziening van een bestemmingsplan als in dat lid
      bedoeld hogere waarden in acht genomen, voor zover:

      a. gedeputeerde staten met toepassing van artikel 8, 9, 10 of 11, derde, vijfde of zesde lid, voor de vaststelling
      of herziening van het bestemmingsplan zodanige waarden hebben vastgesteld, dan wel

      b. zodanige waarden noodzakelijk zijn als gevolg van een vaststelling of herziening van het plan in afwijking
      van het ontwerp, zoals dit ter inzage heeft gelegen, welke waarden door gedeputeerde staten redelijkerwijs met
      toepassing van artikel 8, 9, 10, 11, derde, vijfde of zesde lid, zullen worden vastgesteld.

      3 Gedeputeerde staten nemen bij hun beslissing over de goedkeuring van een bestemmingsplan of de herziening hiervan
      dat geheel of gedeeltelijk betrekking heeft op gronden, behorende tot een zone als bedoeld in artikel 3, ter zake
      van de geluidsbelasting vanwege de spoorweg waarlangs die zone ligt, van de uitwendige scheidingsconstructie van
      woningen en van andere gebouwen dan woningen, alsmede van andere geluidsgevoelige objecten binnen die zone, de
      waarden in acht, die ingevolge de artikelen 7, 8, 9, 10 en 11, eerste, tweede, derde, vijfde en zesde lid, als de
      ten hoogste toelaatbare worden aangemerkt.

      4 Tenzij bij de vaststelling of herziening van een bestemmingsplan als bedoeld in het eerste lid wordt voorzien
      in de wijziging van een spoorweg, gelden het eerste, tweede en derde lid niet, indien op het tijdstip van die
      vaststelling of herziening de spoorweg reeds aanwezig of in aanleg is, met betrekking tot de daarbij in het plan
      opgenomen bebouwing en andere geluidsgevoelige objecten die op dat tijdstip reeds aanwezig of in aanbouw zijn.
    url: https://wetten.overheid.nl/BWBR0004137/2000-01-01#Artikel4
  - number: 4a
    text: |-
      1 Bij het nemen van een besluit tot vrijstelling als bedoeld in
      [artikel 19 van de Wet op de Ruimtelijke Ordening][ref1] dat geheel of gedeeltelijk betrekking heeft op gronden
      behorende tot een zone als bedoeld in artikel 3, worden ter zake van de geluidsbelasting, vanwege de spoorweg
      waarlangs die zone ligt, van de uitwendige scheidingsconstructie van woningen en van andere gebouwen dan woningen
      of van andere geluidsgevoelige objecten binnen die zone de waarden in acht genomen, die ingevolge de artikelen 7,
      8, 9, 10 en 11, eerste, tweede, derde, vijfde en zesde lid, als de hoogste toelaatbare worden aangemerkt.

      2 Gedeputeerde staten nemen bij hun beslissing over het verlenen van een verklaring van geen bezwaar ten behoeve
      van het nemen van een besluit als bedoeld in het eerste lid, het bepaalde in dat lid in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel19
    url: https://wetten.overheid.nl/BWBR0004137/2000-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '19'
  - number: '5'
    text: |-
      Bij het voorbereiden van de vaststelling of herziening van een bestemmingsplan als bedoeld in artikel 4 wordt
      vanwege burgemeester en wethouders een akoestisch onderzoek ingesteld naar:

      a. de geluidsbelasting die door woningen, door andere geluidsgevoelige gebouwen of geluidsgevoelige
      terreinen binnen de zone vanwege de spoorweg zou worden ondervonden, zonder de invloed van maatregelen die de
      geluidsoverdracht beperken;

      b. de doeltreffendheid van de in aanmerking komende maatregelen om te voorkomen dat de in de toekomst vanwege de
      spoorweg optredende geluidsbelasting van de onder *a* bedoelde objecten de waarden die ingevolge de artikelen 7 tot
      en met 11 als ten hoogste toelaatbaar worden aangemerkt, te boven zou gaan.
    url: https://wetten.overheid.nl/BWBR0004137/2000-01-01#Artikel5
  - number: '6'
    text: |-
      1 Een besluit, houdende vaststelling of herziening van een bestemmingsplan als bedoeld in artikel 4, of een besluit
      tot vrijstelling als bedoeld in artikel 4*a*, eerste lid, wordt eerst genomen nadat de inspecteur terzake advies
      heeft uitgebracht, dan wel sedert het tijdstip waarop hij door burgemeester en wethouders in de gelegenheid werd
      gesteld terzake advies uit te brengen, twee maanden zijn verlopen.

      2 Het besluit wordt zo spoedig mogelijk ter kennis van de inspecteur gebracht.
    url: https://wetten.overheid.nl/BWBR0004137/2000-01-01#Artikel6
  - number: '7'
    text: |-
      1 Behoudens het bepaalde in de artikelen 8 en 11 is de ten hoogste toelaatbare geluidsbelasting, vanwege een
      spoorweg, van de uitwendige scheidingsconstructie van woningen binnen de zone van die spoorweg 57 dB(A).

      2 Behoudens het bepaalde in de artikelen 9 en 11 is de ten hoogste toelaatbare geluidsbelasting, vanwege een
      spoorweg, van de uitwendige scheidingsconstructie van de in artikel 2, eerste lid, onder *a* tot en met *e*,
      genoemde categorieën van geluidsgevoelige gebouwen binnen de zone van die spoorweg 55 dB(A).

      3 Behoudens het bepaalde in de artikelen 10 en 11 is de ten hoogste toelaatbare geluidsbelasting, vanwege een
      spoorweg, aan de grens van binnen de zone van die spoorweg gelegen geluidsgevoelige terreinen 57 dB(A).
    url: https://wetten.overheid.nl/BWBR0004137/2000-01-01#Artikel7
  - number: '8'
    text: |-
      1 Gedeputeerde staten kunnen voor de ten hoogste toelaatbare geluidsbelasting van de uitwendige
      scheidingsconstructie van woningen, vanwege een spoorweg, op verzoek van degenen die zijn aangewezen in artikel
      14, een hogere waarde dan de in artikel 7, eerste lid, genoemde vaststellen, met dien verstande dat deze waarde 70
      dB(A) niet te boven mag gaan.

      2 Gedeputeerde staten kunnen alleen toepassing geven aan het eerste lid in gevallen waarin toepassing van
      maatregelen, gericht op het terugbrengen van de geluidsbelasting, vanwege de spoorweg, van de uitwendige
      scheidingsconstructie van de betrokken woningen tot 57 dB(A), onvoldoende doeltreffend zal zijn, dan wel
      overwegende bezwaren ontmoet van stedebouwkundige, vervoerskundige, landschappelijke of financiële aard.

      3 Het tweede lid vindt slechts toepassing in die gevallen waarin:

      a. nog niet geprojecteerde dan wel geprojecteerde woningen, die

      1e. in de omgeving van een station of halte gesitueerd worden,

      2e. verspreid gesitueerd worden buiten de bebouwde kom,

      3e. ter plaatse noodzakelijk zijn om redenen van grond- of bedrijfsgebondenheid,

      4e. ter plaatse gesitueerd worden ter vervanging van bestaande bebouwing,

      5e. in een stads- of dorpsvernieuwingsplan worden opgenomen,

      6e. door de gekozen situering of bouwvorm een doelmatige akoestisch afschermende functie gaan vervullen voor andere
      woningen - in aantal ten minste de helft van het aantal woningen waaraan de afschermende functie wordt toegekend -
      of voor andere geluidsgevoelige gebouwen of geluidsgevoelige terreinen, of

      7e. door de gekozen situering een open plaats tussen aanwezige bebouwing opvullen, of

      b. een nog niet geprojecteerde, geprojecteerde of te wijzigen spoorweg, voor zover deze spoorweg een noodzakelijke
      verkeers- en vervoersfunctie zal vervullen, behoudens het bepaalde in artikel 11.

      4 Gedeputeerde staten kunnen bij de toepassing van het eerste en tweede lid ten aanzien van nog niet geprojecteerde
      woningen alleen een hogere waarde dan 60 dB(A) als de ten hoogste toelaatbare geluidsbelasting vaststellen,
      indien naar hun oordeel voldoende verzekerd wordt, dat de verblijfsruimten, alsmede de tot de woning behorende
      buitenruimten, niet aan de uitwendige scheidingsconstructie worden gesitueerd waar de hoogste geluidsbelasting
      optreedt.

      5 Het vierde lid is niet van toepassing, indien naar het oordeel van gedeputeerde staten overwegingen van stedebouw
      of volkshuisvesting zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0004137/2000-01-01#Artikel8
  - number: '9'
    text: |-
      1 Gedeputeerde staten kunnen voor de ten hoogste toelaatbare geluidsbelasting, vanwege een spoorweg, van de
      uitwendige scheidingsconstructie van gebouwen, behorend tot de in artikel 2, eerste lid, onder *a* tot en met *e*,
      genoemde categorieën, op verzoek van degenen die in artikel 14 aangewezen zijn, een hogere waarde dan de in artikel
      7, tweede lid, genoemde vaststellen, met dien verstande dat deze waarde 70 dB(A) niet te boven mag gaan.

      2 Gedeputeerde staten kunnen alleen toepassing geven aan het eerste lid in die gevallen waarin toepassing
      van maatregelen, gericht op het terugbrengen van de geluidsbelasting, vanwege de spoorweg, van de uitwendige
      scheidingsconstructie van de betrokken gebouwen tot 55 dB(A) onvoldoende doeltreffend zal zijn, dan wel overwegende
      bezwaren ontmoet van stedebouwkundige, vervoerskundige, landschappelijke of financiële aard.
    url: https://wetten.overheid.nl/BWBR0004137/2000-01-01#Artikel9
  - number: '10'
    text: |-
      1 Gedeputeerde staten kunnen voor de ten hoogste toelaatbare geluidsbelasting, vanwege een spoorweg, aan de grens
      van geluidsgevoelige terreinen, op verzoek van degenen die in artikel 14 aangewezen zijn, een hogere waarde dan de
      in artikel 7, derde lid, genoemde vaststellen, met dien verstande dat deze waarde 65 dB(A) niet te boven mag gaan.

      2 Gedeputeerde staten kunnen alleen toepassing geven aan het eerste lid in gevallen waarin toepassing van
      maatregelen, gericht op het terugbrengen van de geluidsbelasting, vanwege een spoorweg, aan de grens van het
      betrokken terrein tot 60 dB(A), onvoldoende doeltreffend zal zijn, dan wel overwegende bezwaren ontmoet van
      stedebouwkundige, vervoerskundige, landschappelijke of financiële aard.
    url: https://wetten.overheid.nl/BWBR0004137/2000-01-01#Artikel10
  - number: '11'
    text: |-
      1 Ingeval met betrekking tot aanwezige of in aanbouw zijnde woningen waarvoor toepassing is gegeven aan artikel
      8 of het derde lid van dit artikel, een aanvang wordt gemaakt met de wijziging van een spoorweg en de bestaande
      geluidsbelasting op het tijdstip waarop met die wijziging een aanvang wordt gemaakt, lager is dan de vastgestelde
      hogere waarde, geldt als de ten hoogste toelaatbare geluidsbelasting, vanwege de spoorweg, van de uitwendige
      scheidingsconstructie van die woningen de bestaande geluidsbelasting op dat tijdstip, met dien verstande, dat een
      vastgestelde geluidsbelasting waarvan de waarde 57 dB(A) niet te boven gaat, in elk geval als toelaatbaar blijft
      aangemerkt.

      2 Ingeval met betrekking tot aanwezige of in aanbouw zijnde woningen waarvoor geen toepassing is gegeven aan
      artikel 8 of het derde lid van dit artikel, een aanvang wordt gemaakt met de wijziging van een spoorweg, geldt als
      de ten hoogste toelaatbare geluidsbelasting, vanwege de spoorweg, van de uitwendige scheidingsconstructie van die
      woningen de laagste van de volgende waarden, met dien verstande dat een geluidsbelasting waarvan de waarde 57 dB(A)
      niet te boven gaat, in elk geval als toelaatbaar blijft aangemerkt:

      a. de geluidsbelasting op het tijdstip van in werking treden van dit besluit;

      b. de geluidsbelasting op het tijdstip waarop met de wijziging een aanvang wordt gemaakt.

      3 Gedeputeerde staten kunnen voor de ten hoogste toelaatbare geluidsbelasting, vanwege een spoorweg, van de
      uitwendige scheidingsconstructie van de op het tijdstip van de aanvang van een wijziging binnen de zone aanwezige
      of in aanbouw zijnde woningen, op verzoek van degenen die in [artikel 14][ref1] aangewezen zijn, een hogere waarde
      dan de voor die woningen alsdan geldende waarde vaststellen, met dien verstande dat deze waarde in afwijking voor
      zover nodig van artikel 8 73 dB(A) niet te boven mag gaan.

      4 Gedeputeerde staten kunnen alleen toepassing geven aan het derde lid in die gevallen waarin toepassing
      van maatregelen, gericht op het terugbrengen van de geluidsbelasting, vanwege de spoorweg, van de uitwendige
      scheidingsconstructie van de betrokken woningen tot de ingevolge het eerste of tweede lid geldende ten hoogste
      toelaatbare geluidsbelasting onvoldoende doeltreffend zal zijn, dan wel overwegende bezwaren ontmoet van
      stedebouwkundige, vervoerskundige, landschappelijke of financiële aard.

      5 Het in het eerste tot en met vierde lid bepaalde is van overeenkomstige toepassing op gebouwen, behorend tot de
      in artikel 2, eerste lid, onder *a* tot en met *e*, bedoelde categorieën, met dien verstande dat in plaats van de
      in het eerste en tweede lid genoemde waarde van 60 dB(A) 55 dB(A) wordt gelezen.

      6 Het in het eerste tot en met vierde lid bepaalde is van overeenkomstige toepassing aan de grens van
      geluidsgevoelige terreinen, met dien verstande dat in plaats van de in het derde lid genoemde waarde van 73 dB(A)
      de betreffende in artikel 10, eerste lid, genoemde waarde wordt gelezen.


      [ref1]: https://wetten.overheid.nl/BWBR0004137#Artikel14
    url: https://wetten.overheid.nl/BWBR0004137/2000-01-01#Artikel11
    references:
