        artikel: '14'
        hoofdstuk: '4'
  - number: '12'
    text: |-
      1 Bij toepassing van de artikelen 8 tot en met 11 kan de gelding van een daarbij vastgestelde waarde aan
      voorwaarden worden gebonden.

      2 Een besluit, houdende de beslissing op een verzoek als bedoeld in de artikelen 8 tot en met 11, wordt eerst
      genomen nadat de inspecteur terzake advies heeft uitgebracht, dan wel sedert het tijdstip waarop hij in de
      gelegenheid werd gesteld terzake advies uit te brengen, een maand is verlopen.
    url: https://wetten.overheid.nl/BWBR0004137/2000-01-01#Artikel12
  - number: '13'
    text: |-
      1 Indien door toepassing van artikel 8 of 11 voor de uitwendige scheidingsconstructie van een of meer in aanbouw
      zijnde of aanwezige woningen een hogere geluidsbelasting dan 57 dB(A) als toelaatbaar is aangemerkt, treft
      de gemeenteraad met betrekking tot de geluidwering van die uitwendige scheidingsconstructie maatregelen om te
      bevorderen dat de geluidsbelasting, vanwege de spoorweg, binnen de woning bij gesloten ramen 37 dB(A) niet te boven
      zal gaan.

      2 In afwijking van het eerste lid treft de gemeenteraad, indien door toepassing van artikel 11 voor de
      uitwendige scheidingsconstructie van een of meer in aanbouw zijnde of aanwezige woningen binnen de zone een
      hogere geluidsbelasting dan 57 dB(A) als toelaatbaar is aangemerkt en de geluidsbelasting ten tijde van de
      inwerkingtreding van dit besluit hoger is dan 65 dB(A), met betrekking tot de geluidwering van die uitwendige
      scheidingsconstructie maatregelen om te bevorderen dat de geluidsbelasting, vanwege de spoorweg, binnen de woning
      bij gesloten ramen 40 dB(A) niet te boven zal gaan.

      3 Indien door toepassing van de artikelen 9 of 11 voor de uitwendige scheidingsconstructie van een of meer
      in aanbouw zijnde of aanwezige gebouwen als bedoeld in artikel 2, eerste lid, onder *a* tot en met *e*, een
      hogere geluidsbelasting dan 55 dB(A) als toelaatbaar is aangemerkt, treft de gemeenteraad met betrekking tot de
      geluidwering van die uitwendige scheidingsconstructie maatregelen om te bevorderen dat de geluidsbelasting, vanwege
      de spoorweg, bij gesloten ramen

      a. binnen de verblijfsruimten, genoemd in [artikel 10, tweede lid, onder ][ref1], 30 dB(A) niet te boven zal gaan,
      en

      b. binnen de verblijfsruimten, genoemd in artikel 10, tweede lid, onder *b*, van het onder *a* genoemde besluit, 35
      dB(A) niet te boven zal gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel10
    url: https://wetten.overheid.nl/BWBR0004137/2000-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '10'
  - number: '14'
    text: |-
      Een verzoek als bedoeld in de artikelen 8 tot en met 11 kan worden gedaan door:

      a. burgemeester en wethouders van de gemeente waarin de woningen, de andere geluidsgevoelige gebouwen of de
      geluidsgevoelige terreinen, waarvoor de hogere waarde wordt verzocht, gesitueerd zijn of worden;

      b. burgemeester en wethouders van de gemeente waarin de spoorweg met betrekking waartoe de hogere waarde wordt
      verzocht, gesitueerd is of wordt;

      c. de spoorwegexploitant, indien het betreft de aanleg of wijziging van een spoorweg.
    url: https://wetten.overheid.nl/BWBR0004137/2000-01-01#Artikel14
  - number: '15'
    text: |-
      1 De verzoeker maakt zijn voornemen tot het indienen van een verzoek in ieder geval zoveel mogelijk gelijktijdig
      bekend door middel van:

      a. kennisgeving in een of meer in de in artikel 14, eerste lid, onder *a*, bedoelde gemeente verspreiding vindende
      dag-, nieuws- of huis-aan-huis-bladen en voorts op de in die gemeente gebruikelijke wijze;

      b. terinzagelegging van het ontwerp van het verzoek met de daarbij behorende stukken op het gemeentehuis van de in
      artikel 14, eerste lid, onder *a*, bedoelde gemeente;

      c. niet op naam gestelde kennisgeving aan de gebruikers van de woningen of de woonwagenstandplaatsen, het bevoegd
      gezag van scholen en de directies van de in artikel 2 bedoelde andere gebouwen waarvoor een hogere waarde wordt
      verzocht.

      2 De verzoeker stelt een ieder in de gelegenheid gedurende vier weken vanaf de dag waarop het ontwerp van het
      verzoek ter inzage is gelegd, het ontwerp met de daarbij behorende stukken in te zien en schriftelijk opmerkingen
      ten aanzien van het ontwerp te maken.

      3 Indien het voornemen tot het indienen van een verzoek verband houdt met een toepassing van [artikel 4][ref1],
      tweede lid, onder *b* of van [artikel 19 van de Wet op de Ruimtelijke Ordening][ref2], kan in afwijking van het
      tweede lid het ontwerp van het verzoek gedurende twee weken ter inzage worden gelegd.

      4 Burgemeester en wethouders van de gemeente, bedoeld in artikel 14, onder *a*, kunnen, indien zij hiertoe
      uitgenodigd zijn door een verzoeker als bedoeld in artikel 14, onder *b* of *c*, in plaats van deze toepassing
      geven aan het eerste of het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel19
    url: https://wetten.overheid.nl/BWBR0004137/2000-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002375
        artikel: '19'
  - number: '16'
    text: |-
      1 Het verzoek en het ontwerp van een verzoek bevatten ten minste:

      a. de verzochte hogere waarden;

      b. de redenen die aan het verzoek ten grondslag liggen;

      c. de resultaten van het akoestisch onderzoek, bedoeld in artikel 5 of 20;

      d. een beschrijving van de mogelijkheden om de geluidsbelasting van de uitwendige scheidingsconstructie van de
      woningen of de andere geluidsgevoelige gebouwen of aan de grens van de geluidsgevoelige terreinen tot een lagere
      waarde te verminderen dan de onder *a* bedoelde, alsmede een schatting van de hieraan verbonden extra kosten;

      e. een verklaring dat maatregelen als bedoeld in artikel 13, zullen worden getroffen, indien de geluidsbelasting
      binnen de woning onderscheidenlijk binnen de verblijfsruimten van de in artikel 2, eerste lid, onder a tot en met
      e, bedoelde gebouwen, bij gesloten ramen, meer bedraagt dan de in artikel 13, eerste, tweede of derde lid, bedoelde
      waarden;

      f. een beschrijving met een schetstekening of een verklaring omtrent de wijze waarop aan artikel 8, derde lid,
      voldaan zal worden, dan wel, indien aan dat artikel niet voldaan kan worden, de redenen daarvan;

      g. voor zover het verzoek hier aanleiding toe geeft, een beschrijving, schetstekening en uitvoeringsplan van de
      geluidafschermende voorziening tussen spoorweg en woningen, andere geluidsgevoelige gebouwen of geluidsgevoelige
      terreinen, indien deze voorziening vereist is om de in het verzoek begrepen waarden te waarborgen.

      2 Het verzoek gaat vergezeld van een of meer kaarten met bijbehorende verklaring. Met betrekking tot deze
      kaart of kaarten is [artikel 16 van het Besluit op de ruimtelijke ordening 1985][ref1] (*Stb.* 1985, 627) van
      overeenkomstige toepassing, met dien verstande dat in plaats van "plan" telkens gelezen wordt: "verzoek". De
      kaart of kaarten geven bovendien de ligging weer van geluidszones langs wegen, rond industrieterreinen en rond
      luchtvaartterreinen als bedoeld in [artikel 25, tweede lid, van de Luchtvaartwet][ref2] (*Stb.* 1958, 47), alsmede
      de in die zones voorkomende gebieden, aangewezen overeenkomstig [artikel 1.2, tweede lid, onder ][ref3], voor zover
      de woningen, andere geluidsgevoelige gebouwen of geluidsgevoelige terreinen waarop het verzoek betrekking heeft,
      binnen zodanige zones zijn of worden gesitueerd.

      3 Gedeputeerde staten kunnen van de verzoeker nadere toelichting, tekeningen en kaarten verlangen, indien zij deze
      noodzakelijk achten voor de beoordeling van het verzoek.

      4 Indien ingevolge de mate van detaillering van het bestemmingsplan waarin de woningen, andere geluidsgevoelige
      gebouwen of geluidsgevoelige terreinen waarop het verzoek betrekking heeft, zijn opgenomen, de in het eerste lid,
      onder *f*, en het tweede lid bedoelde stukken niet beschikbaar zijn, kunnen gedeputeerde staten afwijken van het in
      die artikelonderdelen bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0003889#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel1.2
    url: https://wetten.overheid.nl/BWBR0004137/2000-01-01#Artikel16
