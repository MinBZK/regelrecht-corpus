        artikel: '16'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '25'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '1.2'
  - number: '17'
    text: |-
      De verzoeker zendt gelijktijdig met het indienen van zijn verzoek een afschrift van het verzoek en de hierbij
      behorende stukken naar:

      a. de inspecteur;

      b. de inspecteur van de volkshuisvesting;

      c. de verzoekgerechtigden, bedoeld in artikel 14, die het verzoek niet hebben gedaan;

      d. de betrokken regionale directie van het Directoraat-Generaal Rijkswaterstaat van het Ministerie van Verkeer
      en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0004137/2000-01-01#Artikel17
  - number: '18'
    text: |-
      1 Gedeputeerde staten tekenen de datum van ontvangst van een verzoek aan op het geschrift waarbij het verzoek is
      ingediend, en zenden de verzoeker een bewijs van ontvangst, waarin die datum is vermeld.

      2 Gedeputeerde staten beslissen op het verzoek binnen drie maanden na de in het eerste lid bedoelde datum en doen
      mededeling van hun besluit aan de in artikel 17 bedoelde personen.

      3 Indien toepassing is gegeven aan artikel 4, tweede lid, onder *b*, wordt het verzoek binnen vier weken na de
      dagtekening van het raadsbesluit tot vaststelling of herziening van het bestemmingsplan bij gedeputeerde staten
      ingediend. In afwijking van het tweede lid beslissen gedeputeerde staten op een verzoek als bedoeld in de eerste
      volzin voordat zij over de goedkeuring van het bestemmingsplan of de herziening hiervan beslissen.

      4 Een verzoek wordt geacht te zijn ingewilligd, indien gedeputeerde staten:

      a. niet binnen de in het tweede lid bedoelde termijn, of

      b. ingeval toepassing wordt gegeven aan het derde lid, tweede volzin, niet uiterlijk tegelijk met het toezenden van
      de beslissing over de goedkeuring van het bestemmingsplan of de herziening hiervan,

      een besluit met betrekking tot het verzoek aan de verzoeker hebben toegezonden.

      5 Aan een verzoek wordt geacht goedkeuring te zijn onthouden, indien het verzoek niet binnen de in het derde lid,
      eerste volzin, bedoelde termijn is ingediend en gedeputeerde staten geen beslissing hebben genomen als bedoeld in
      de tweede volzin van dat lid.
    url: https://wetten.overheid.nl/BWBR0004137/2000-01-01#Artikel18
  - number: '19'
    text: |-
      Tot aanleg of wijziging van een spoorweg, anders dan op grondslag van een overeenkomstig de artikelen 4 tot en met
      6 vastgesteld of herzien bestemmingsplan, wordt, indien binnen de aanwezige of toekomstige zone woningen, andere
      geluidsgevoelige gebouwen of geluidsgevoelige terreinen aanwezig, in aanbouw of geprojecteerd zijn, niet overgegaan
      dan in overeenstemming met een onherroepelijk geworden besluit van de gemeenteraad krachtens artikel 21, eerste
      lid, genomen naar aanleiding van een door de spoorwegexploitant aan burgemeester en wethouders gedane mededeling
      van zijn voornemen en na een overeenkomstig artikel 20 ingesteld onderzoek.
    url: https://wetten.overheid.nl/BWBR0004137/2000-01-01#Artikel19
  - number: '20'
    text: |-
      1 Vanwege de spoorwegexploitant wordt binnen de zone een akoestisch onderzoek ingesteld van de in artikel 5
      omschreven strekking.

      2 De resultaten van het ingestelde onderzoek worden door de spoorwegexploitant aan burgemeester en wethouders
      overgelegd, te zamen met een beschrijving van de maatregelen die naar zijn oordeel nodig zijn voor het in artikel
      21 omschreven doel.
    url: https://wetten.overheid.nl/BWBR0004137/2000-01-01#Artikel20
  - number: '21'
    text: |-
      1 Binnen zes maanden nadat de resultaten van het in artikel 20 bedoelde onderzoek zijn verkregen, neemt de
      gemeenteraad, tenzij hij burgemeester en wethouders hiertoe bevoegd heeft verklaard, een besluit als bedoeld in
      artikel 19, bepalende welke maatregelen nodig zijn om te voorkomen dat de geluidsbelasting die de spoorweg binnen
      de zone zal veroorzaken, de waarden die ingevolge de artikelen 7 tot en met 11 als ten hoogste toelaatbaar worden
      aangemerkt, te boven zou gaan.

      2 Het besluit wordt eerst genomen nadat de inspecteur terzake advies heeft uitgebracht, dan wel sedert het tijdstip
      waarop hij door burgemeester en wethouders in de gelegenheid werd gesteld terzake advies uit te brengen, acht weken
      zijn verlopen.

      3 Het besluit wordt in afschrift aan de spoorwegexploitant en aan de inspecteur toegezonden.
    url: https://wetten.overheid.nl/BWBR0004137/2000-01-01#Artikel21
  - number: '23'
    text: |-
      1 Ten behoeve van de vaststelling van de geluidsbelasting, vanwege een spoorweg, stelt Onze Minister voor het
      bepalen van het equivalente geluidsniveau regels, inhoudende op welke wijze en met inachtneming van welke bestaande
      of te verwachten omstandigheden de afwisselende niveaus van het ter plaatse optredende geluid worden vastgesteld en
      op welke wijze uit de over een bepaalde periode verkregen uitkomsten het gemiddelde wordt afgeleid.

      2 Onze Minister stelt regels omtrent al hetgeen betrekking heeft op de wijze waarop de akoestische onderzoeken,
      bedoeld in dit besluit, worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0004137/2000-01-01#Artikel23
  - number: '24'
    text: |-
      1 Bij aanleg of vervanging van een spoorweg of een gedeelte van een spoorweg dient de spoorwegexploitant, voor
      zover het bepaalde in de hoofdstukken 3, 4 of 5 hierop niet van toepassing is, ervoor zorg te dragen dat de
      geluidsemissie vanwege de nieuwe baanconstructie niet hoger wordt dan van een overeenkomstige spoorbaan waarvan de
      constructie bestaat uit langgelast spoor op houten dwarsliggers.

      2 Op verzoek van de spoorwegexploitant kan Onze Minister in overeenstemming met Onze Minister van Verkeer en
      Waterstaat ontheffing geven van het vereiste in het eerste lid, indien toepassing van dat lid op overwegende
      bezwaren van technische of financiële aard stuit.
    url: https://wetten.overheid.nl/BWBR0004137/2000-01-01#Artikel24
  - number: '28'
    text: |-
      Vanaf 1 januari 2000 komt de zinsnede in artikel 10, eerste lid, na de woorden "met dien verstande dat deze waarde"
      te luiden: 65 dB(A) niet te boven mag gaan en wordt de waarde:

        - 60 dB(A) in de artikelen 7, eerste en derde lid, 8, tweede lid, 11, eerste en tweede lid, en 13, eerste en tweede
      lid, vervangen door 57 dB(A);
        - 73 dB(A) in de artikelen 8, eerste lid, en 9, eerste lid, vervangen door: 70 dB(A), onder invoeging in artikel
      11, derde lid, vóór «73 dB(A)» van de zinsnede: in afwijking voor zover nodig van artikel 8.
    url: https://wetten.overheid.nl/BWBR0004137/2000-01-01#Artikel28
  - number: 28a
    text: |-
      1 De verzoeker, bedoeld in artikel 14, onder *a*, *b* en *c*, houdt binnen de in artikel 15, tweede lid, bedoelde
      termijn een openbare zitting, waarbij een ieder de gelegenheid wordt gegeven opmerkingen te maken ten aanzien van
      het ontwerp van het verzoek, bedoeld in artikel 15.

      2 De verzoeker stelt een rapport op van de wijze waarop de bevolking bij de totstandkoming van het verzoek, bedoeld
      in artikel 14, is betrokken, waarin in ieder geval begrepen zijn een verslag van de openbare zitting en afschriften
      van de schriftelijk gemaakte opmerkingen over het ontwerp van het verzoek. De verzoeker zendt dit rapport
      onmiddellijk toe aan degenen die op de openbare zitting opmerkingen ten aanzien van het ontwerp van het verzoek
      hebben gemaakt.

      3 Een verzoek als bedoeld in artikel 14 gaat vergezeld van het in het tweede lid bedoelde rapport.

      4 Dit artikel blijft van toepassing zolang de betrokken gemeente met inachtneming van [artikel 151][ref1] juncto
      [artikel 297 van de Gemeentewet][ref2] geen inspraakverordening heeft vastgesteld en in werking heeft laten treden.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel151
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel297
    url: https://wetten.overheid.nl/BWBR0004137/2000-01-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '151'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '297'
  - number: '29'
    text: |-
      Dit besluit treedt in werking met ingang van de vierde kalendermaand na de datum van uitgifte van het *Staatsblad*
      waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0004137/2000-01-01#Artikel29
  - number: '30'
    text: Dit besluit kan worden aangehaald als Besluit geluidhinder spoorwegen.
    url: https://wetten.overheid.nl/BWBR0004137/2000-01-01#Artikel30
