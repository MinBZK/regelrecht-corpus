  - number: XI
    text: |-
      Dit besluit treedt in werking met ingang van 1 januari 2026, met uitzondering van:

      a. [artikel I, onderdelen AY en AZ,][ref1] en [artikel III, onderdelen A, O en W][ref2], die in werking treden met
      ingang van de dag na de datum van uitgifte van het Staatsblad, waarin dit besluit wordt geplaatst;

      b. [artikel V][ref3], dat in werking treedt met ingang van de dag na de datum van uitgifte van het Staatsblad,
      waarin dit besluit wordt geplaatst en terugwerkt tot en met 1 januari 2024;

      c. [artikel VI][ref4] en [IX][ref5], indien het Staatsblad waarin dit besluit wordt geplaatst, wordt uitgegeven na
      3 december 2025. In dat geval treden deze artikelen in werking met ingang van vier weken na de dag na de datum van
      uitgifte van het Staatsblad waarin het wordt geplaatst.


