articles:
  - number: X
    text: |-
      1 Als voor de inwerkingtreding van [artikel III, onder E][ref1], een ontwerp van een wijziging
      van het omgevingsplan ter inzage is gelegd of een aanvraag om een omgevingsvergunning voor een
      buitenplanse omgevingsplanactiviteit of een milieubelastende activiteit is ingediend, blijft
      [artikel 5.12, derde lid van het Besluit kwaliteit leefomgeving][ref2], zoals dat luidde voor de datum van
      inwerkingtreding van artikel III, onder E, van dit besluit van toepassing tot het besluit tot wijziging van het
      omgevingsplan in werking is getreden of het besluit op de aanvraag om de omgevingsvergunning voor de buitenplanse
      omgevingsplanactiviteit of de milieubelastende activiteit onherroepelijk is.

      2 Als de wijziging van [artikel 3.5, eerste lid, van het Besluit activiteiten leefomgeving][ref3]
      voor het exploiteren van een stookinstallatie ertoe leidt dat geen verbodsbepaling als bedoeld in
      [paragraaf 5.1.1 van de Omgevingswet][ref4] meer van toepassing is, geldt een aan een onherroepelijke
      omgevingsvergunning voor die activiteit verbonden voorschrift als een maatwerkvoorschrift, voor zover het
      voorschrift gaat over een onderwerp waarvoor het bevoegd gezag maatwerkvoorschriften kan stellen als bedoeld in
      [artikel 4.5, eerste lid, van de Omgevingswet][ref5].


