    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van de Staatssecretaris van Infrastructuur en Waterstaat, gedaan in overeenstemming met de
    Minister van Justitie en Veiligheid, van 18 maart 2025, nr. IenW/BSK-2025/37846, Hoofddirectie Bestuurlijke en
    Juridische Zaken;


    Gelet op de artikelen 2.24, eerste lid, 2.28, aanhef en onder c, 2.29a, 4.3, eerste lid, 4.20, eerste lid, onder n,
    5.1, tweede lid, 5.18, eerste lid, 13.5, eerste lid, 16.24a,18.22, eerste lid, en 20.6 van de Omgevingswet, artikel
    18, derde lid, van de Wegenverkeerswet 1994, de artikelen 8.10, 9.2.2.1, eerste lid, 9.5.2 in samenhang met artikel
    9.5.6 en 10.2, tweede lid, van de Wet milieubeheer en artikel 31, vierde lid, van de Wet op de veiligheidsregio’s;


    De Afdeling advisering van de Raad van State gehoord (advies van 28 mei 2025, nr. W17.25.00064/IV);


    Gezien het nader rapport van de Staatssecretaris van Infrastructuur en Waterstaat, uitgebracht in overeenstemming
