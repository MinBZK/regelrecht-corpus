preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op voordracht van Onze Minister van Justitie van 18 augustus 2000, nr. 5045031/00/06, directoraat-generaal
    Wetgeving, Rechtspleging en Rechtsbijstand, directie Wetgeving;

    Gelet op artikel 54, tweede lid, onderdeel b, van de Wet rechtspositie rechterlijke ambtenaren;

    De Raad van State gehoord (advies van 21 september, no. W03.00 0384/I);

    Gezien het nader rapport van Onze Minister van Justitie van 14 november 2000, nr. 5061726/00/6, directoraat-
    generaal Wetgeving, Rechtspleging en Rechtsbijstand, directie Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0011826/2017-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit wordt verstaan onder - aansluitende uitkering: de aansluitende uitkering, bedoeld in
      [Hoofdstuk 3][ref1];
        - aanvullende uitkering: de aanvullende uitkering, bedoeld in [Hoofdstuk 2][ref2];
        - AOW-gerechtigde leeftijd: de leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene ouderdomswet][ref3],
      waarop recht op ouderdomspensioen ontstaat;
        - arbeidsongeschiktheidsuitkering: een ingevolge de [Wet op de arbeidsongeschiktheidsverzekering][ref4] of de
      [Wet werk en inkomen naar arbeidsvermogen][ref5] toegekende uitkering;
        - betrokkene: 1°. de niet voor het leven benoemde rechterlijk ambtenaar in vaste dienst die ten
      gevolge van een ontslag, niet zijnde een disciplinair strafontslag dan wel een ontslag wegens flexibel
      pensioen en uittreden, werkloos is geworden in de zin van de [Werkloosheidswet][ref6], 2°. de niet voor
      het leven benoemde rechterlijk ambtenaar in vaste dienst die ten gevolge van ongeschiktheid tot het
      verrichten van zijn arbeid wegens ziekte, werkloos is geworden in de zin van de [Werkloosheidswet][ref7];
      3°. de voor het leven benoemde rechterlijk ambtenaar die ten gevolge van een ontslag op grond
      van [artikel 46c, tweede en derde lid][ref8], [artikel 46l, eerste en tweede lid][ref9], danwel
      [artikel 46m van de Wet rechtspositie rechterlijke ambtenaren][ref10], werkloos is geworden in de zin van de
      [Werkloosheidswet][ref11]; 4°. de voor het leven benoemde rechterlijk ambtenaar die ten gevolge van ongeschiktheid
      tot het verrichten van arbeid wegens ziekte, werkloos is geworden in de zin van de [Werkloosheidswet][ref12].
        - bovenwettelijke uitkering: aanvullende en aansluitende uitkering;
        - dagloon: het dagloon, bedoeld in de [artikelen 1b][ref13] en
      [44 van de Werkloosheidswet][ref14], evenwel zonder toepassing van de maximum loongrens, bedoeld in
      [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref15] met betrekking tot een loontijdvak
      van een dag, verminderd met de tegemoetkoming van de werkgever strekkende tot betaling van de premie van een door
      of voor de betrokkene afgesloten particuliere ziektekostenverzekering;
        - diensttijd voor zover gelegen vóór 1 januari 1996:de tijd zoals die voor betrokkene per 31 december 1995 meetelt
      voor de pensioenberekening, bedoeld in de Algemene Burgerlijke Pensioenwet zoals deze luidde op 31 december
      1995;voor zover gelegen op of na 1 januari 1996:de tijd gedurende welke de betrokkene overheidswerknemer is in de
      zin van de [Wet privatisering ABP][ref16]; in beide gevallen met uitzondering van de tijd: 1°. die in aanmerking
      is genomen bij de berekening van de duur van een wachtgeld of van een uitkering ter zake van onvrijwillige
      werkloosheid ten laste van de overheid; 2°. die voorafgaat aan een onderbreking in de diensttijd door ontslag van
      langer dan één jaar; 3°. bedoeld in artikel 5.4 van het pensioenreglement; bij de bepaling van de diensttijd wordt
      in voorkomend geval de diensttijd, bedoeld in artikel D1, tweede lid, van de Algemene burgerlijke pensioenwet zoals
      dat luidde op 31 december 1995, mede in aanmerking genomen; het verzoek, bedoeld in artikel D2 van de Algemene
      burgerlijke pensioenwet wordt daarbij geacht te zijn gedaan; indien en voor zover diensttijd die bij de berekening
      van de bovenwettelijke uitkering in aanmerking is genomen, met een overheidspensioen, anders dan ten laste van de
      Stichting Pensioenfonds ABP, wordt vergolden, worden de duur en het bedrag van de bovenwettelijke uitkering met
      ingang van de dag waarop dit pensioen is ingegaan, herberekend, waarbij die diensttijd buiten beschouwing wordt
      gelaten;
        - minimumloon: het minimumloon, bedoeld in de [Wet minimumloon en minimumvakantiebijslag][ref17];
        - Onze Minister: Onze Minister van Veiligheid en Justitie;
        - pensioen: het pensioen in de zin van het pensioenreglement;
        - pensioenreglement: het pensioenreglement Stichting Pensioenfonds ABP.


