  - number: '2.1'
    text: |-
      De uitkeringsduur van de bovenwettelijke uitkering bedraagt drie maal de uitkeringsduur zoals vastgesteld op grond
      van [hoofdstuk 2, paragraaf 4, van de Werkloosheidswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Paragraaf4
    url: https://wetten.overheid.nl/BWBR0011826/2017-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004045
        paragraaf: '4'
  - number: '2.2'
    text: |-
      De uitkeringsduur, bedoeld in het eerste lid, wordt verlengd tot de dag waarop betrokkene de AOW-gerechtigde
      leeftijd bereikt, indien het moment van ontslag maximaal acht jaar ligt voor de op dat moment voor betrokkene van
      toepassing zijnde AOW-gerechtigde leeftijd en hij direct voorafgaand aan het ontslag een voor pensioen geldige
      diensttijd van ten minste tien jaar heeft volbracht.
    url: https://wetten.overheid.nl/BWBR0011826/2017-01-01#Artikel2
  - number: '3.1'
    text: |-
      De betrokkene heeft gedurende de periode dat recht bestaat op een uitkering krachtens de [Werkloosheidswet][ref1],
      recht op een aanvullende uitkering, met dien verstande dat het recht op een aanvullende uitkering niet eerder
      ingaat dan op de dag waarop het ontslag in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0011826/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '3.2'
    text: |-
      Op de aanvullende uitkering, bedoeld in het eerste lid, zijn [hoofdstuk II, paragrafen 1 tot en met 3][ref1],
      alsmede de [artikelen 75][ref2], [76][ref3], [76a][ref4], [77a][ref5] en [78 van de Werkloosheidswet][ref6] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Paragraaf1
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel75
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel76
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel76a
      [ref5]: https://wetten.overheid.nl/BWBR0004045#Artikel77a
      [ref6]: https://wetten.overheid.nl/BWBR0004045#Artikel78
    url: https://wetten.overheid.nl/BWBR0011826/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004045
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '75'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '76'
