  - number: '1.2'
    text: |-
      Indien op het salaris van de betrokkene op de dag voorafgaande aan het ontslag een korting wordt toegepast op
      grond van [artikel 6][ref1], [8d][ref2] of [8e van het Besluit rechtspositie rechterlijke ambtenaren][ref3], wordt
      voor het dagloon, bedoeld in het eerste lid, onderdeel f, uitgegaan van het dagloon zoals dat zou zijn vastgesteld
      indien geen sprake was geweest van bedoelde korting.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006530#Artikel8d
      [ref3]: https://wetten.overheid.nl/BWBR0006530#Artikel8e
    url: https://wetten.overheid.nl/BWBR0011826/2017-01-01#Artikel1
