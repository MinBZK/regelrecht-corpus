preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op voordracht van Onze Minister van Justitie van 18 augustus 2000, nr. 5045031/00/06, directoraat-generaal
    Wetgeving, Rechtspleging en Rechtsbijstand, directie Wetgeving;

    Gelet op artikel 54, tweede lid, onderdeel b, van de Wet rechtspositie rechterlijke ambtenaren;

    De Raad van State gehoord (advies van 21 september, no. W03.00 0384/I);

    Gezien het nader rapport van Onze Minister van Justitie van 14 november 2000, nr. 5061726/00/6, directoraat-
    generaal Wetgeving, Rechtspleging en Rechtsbijstand, directie Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: In dit besluit wordt verstaan onder
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Justitie;'
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel1
  - number: 1.1.b
    text: 'betrokkene:'
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel1
  - number: 1.1.b.1°
    text: |-
      de niet voor het leven benoemde rechterlijk ambtenaar in vaste dienst en de rechterlijk ambtenaar in opleiding in
      vaste dienst die ten gevolge van een ontslag, niet zijnde een disciplinair strafontslag dan wel een ontslag wegens
      flexibel pensioen en uittreden, werkloos is geworden in de zin van de [Werkloosheidswet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 1.1.b.2°
    text: |-
      de niet voor het leven benoemde rechterlijk ambtenaar in vaste dienst en de rechterlijk ambtenaar in opleiding
      in vaste dienst die ten gevolge van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte, werkloos is
      geworden in de zin van de [Werkloosheidswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 1.1.b.3°
    text: |-
      de voor het leven benoemde rechterlijk ambtenaar die ten gevolge van een ontslag op grond van
      [artikel 46c, tweede en derde lid][ref1], [artikel 46l, eerste en tweede lid][ref2], danwel
      [artikel 46m van de Wet rechtspositie rechterlijke ambtenaren][ref3], werkloos is geworden in de zin van de
      [Werkloosheidswet][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46l
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46m
      [ref4]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46c
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46l
      - id: ref3
        bwb_id: BWBR0008365
        artikel: 46m
      - id: ref4
        bwb_id: BWBR0004045
  - number: 1.1.b.4°
    text: |-
      de voor het leven benoemde rechterlijk ambtenaar die ten gevolge van ongeschiktheid tot het verrichten van arbeid
      wegens ziekte, werkloos is geworden in de zin van de [Werkloosheidswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 1.1.c
    text: |-
      aanvullende uitkering: de aanvullende uitkering, bedoeld in [Hoofdstuk 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011826#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011826
        hoofdstuk: '2'
  - number: 1.1.d
    text: |-
      aansluitende uitkering: de aansluitende uitkering, bedoeld in [Hoofdstuk 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011826#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011826
        hoofdstuk: '3'
  - number: 1.1.e
    text: 'bovenwettelijke uitkering: aanvullende en aansluitende uitkering;'
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel1
  - number: 1.1.f
    text: |-
      dagloon: het dagloon, bedoeld in de [artikelen 44 tot en met 46 van de Werkloosheidswet][ref1],
      evenwel zonder toepassing van de maximum loongrens, bedoeld in
      [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref2] met betrekking tot een loontijdvak
      van een dag, verminderd met de tegemoetkoming van de werkgever strekkende tot betaling van de premie van een door
      of voor de betrokkene afgesloten particuliere ziektekostenverzekering;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel17
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '17'
  - number: 1.1.g
    text: 'pensioenreglement: het pensioenreglement Stichting Pensioenfonds ABP;'
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel1
  - number: 1.1.h
    text: |-
      minimumloon: het minimumloon, bedoeld in de [Wet minimumloon en minimumvakantiebijslag][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002638
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002638
  - number: 1.1.i
    text: 'pensioen: het pensioen in de zin van het pensioenreglement;'
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel1
  - number: 1.1.j
    text: |-
      diensttijd voor zover gelegen vóór 1 januari 1996:de tijd zoals die voor betrokkene per 31 december 1995 meetelt
      voor de pensioenberekening, bedoeld in de Algemene Burgerlijke Pensioenwet zoals deze luidde op 31 december
      1995;voor zover gelegen op of na 1 januari 1996:de tijd gedurende welke de betrokkene overheidswerknemer is in de
      zin van de [Wet privatisering ABP][ref1]; in beide gevallen met uitzondering van de tijd:


      [ref1]: https://wetten.overheid.nl/BWBR0007791
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007791
  - number: 1.1.j.1°
    text: |-
      die in aanmerking is genomen bij de berekening van de duur van een wachtgeld of van een uitkering ter zake van
      onvrijwillige werkloosheid ten laste van de overheid;
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel1
  - number: 1.1.j.2°
    text: die voorafgaat aan een onderbreking in de diensttijd door ontslag van langer dan één jaar;
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel1
  - number: 1.1.j.3°
    text: bedoeld in artikel 5.4 van het pensioenreglement;
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel1
  - number: 1.1.k
    text: |-
      suppletie: een suppletie krachtens de suppletieregeling, bedoeld in
      [artikel 33 van het Besluit rechtspositie rechterlijke ambtenaren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel33
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '33'
  - number: '1.2'
    text: |-
      Indien op het salaris van de betrokkene op de dag voorafgaande aan het ontslag een
      inhouding wordt toegepast op grond van [artikel 38a][ref1] of de [artikelen 38d][ref2] en
      [38e van het Besluit rechtspositie rechterlijke ambtenaren][ref3], wordt voor het dagloon, bedoeld in het eerste
      lid, onderdeel f, uitgegaan van het dagloon zoals dat zou zijn vastgesteld indien geen sprake was geweest van
      bedoelde inhouding.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel38a
      [ref2]: https://wetten.overheid.nl/BWBR0006530#Artikel38d
      [ref3]: https://wetten.overheid.nl/BWBR0006530#Artikel38e
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: 38a
      - id: ref2
        bwb_id: BWBR0006530
        artikel: 38d
      - id: ref3
        bwb_id: BWBR0006530
        artikel: 38e
  - number: '2.1'
    text: |-
      Met ingang van de dag waarop het ontslag ingaat wordt de duur van de uitkering vastgesteld op drie maanden,
      vermeerderd voor de betrokkene:
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel2
  - number: 2.1.a
    text: |-
      die op de dag van ontslag de leeftijd van 21 jaar nog niet heeft bereikt met een periode gelijk aan 18% van de
      diensttijd;
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel2
  - number: 2.1.b
    text: |-
      die op de dag van ontslag 21 jaar oud is met een duur van 19,5% van de diensttijd en zo vervolgens per
      leeftijdsjaar opklimmend met 1,5%;
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel2
  - number: 2.1.c
    text: die op de dag van ontslag 60 jaar of ouder is, met een duur gelijk aan 78% van de diensttijd.
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel2
  - number: '2.2'
    text: |-
      Indien voor een betrokkene de duur van de uitkering, berekend op grond van het eerste lid, langer is dan de duur
      van zijn WW-uitkering, wordt dat verschil in duur met een maximum van twee jaar in mindering gebracht op de op
      grond van het eerste lid berekende duur van de uitkering.
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel2
  - number: '2.3'
    text: |-
      De duur van de uitkering van betrokkene die ten tijde van het ontslag 55 jaar of ouder is en een diensttijd, voor
      zover geldig voor pensioen, van tenminste tien jaar heeft volbracht, wordt na afloop van de termijn, welke op basis
      van het eerste en tweede lid is toegekend, verlengd tot de eerste dag van de kalendermaand volgend op die waarin
      hij de leeftijd van 65 jaar heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel2
  - number: '3.1'
    text: |-
      De betrokkene heeft gedurende de periode dat recht bestaat op een uitkering krachtens de [Werkloosheidswet][ref1],
      recht op een aanvullende uitkering, met dien verstande dat het recht op een aanvullende uitkering niet eerder
      ingaat dan op de dag waarop het ontslag in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '3.2'
    text: |-
      Op de aanvullende uitkering, bedoeld in het eerste lid, zijn de [afdelingen I van hoofdstukken IIA]
      (onbekend) en [IIB](onbekend), alsmede de [artikelen 47, tweede en derde lid][ref1], [75][ref2], [76][ref3] en
      [78 van de Werkloosheidswet][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel75
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel76
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel78
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '47'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '75'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '76'
      - id: ref4
        bwb_id: BWBR0004045
        artikel: '78'
  - number: '3.3'
    text: |-
      In afwijking van het tweede lid, is [artikel 41 van de Werkloosheidswet][ref1] niet van overeenkomstige
      toepassing op de aanvullende uitkering, bedoeld in het eerste lid, en zijn de [artikelen 34][ref2] en
      [35 van de Werkloosheidswet][ref3] slechts van overeenkomstige toepassing op de aanvullende uitkering voor zover de
      hoogte van de in mindering te brengen inkomsten de uitkering krachtens de [Werkloosheidswet][ref4] overstijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '41'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '34'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '35'
      - id: ref4
        bwb_id: BWBR0004045
  - number: '4.1'
    text: |-
      Indien de duur van de uitkering, berekend op basis van [artikel 2][ref1], ten minste gelijk is aan de duur van
      de uitkering, berekend op basis van [artikel 42][ref2] of [52g van de Werkloosheidswet][ref3], wordt de uitkering
      krachtens de [Werkloosheidswet][ref4] gedurende de eerste 12 maanden tot 80%, gedurende de daaropvolgende zes
      maanden tot 75% en gedurende de daaropvolgende periode tot 70% van het voor betrokkene geldende dagloon aangevuld.


      [ref1]: https://wetten.overheid.nl/BWBR0011826#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel52g
      [ref4]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011826
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '42'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: 52g
      - id: ref4
        bwb_id: BWBR0004045
  - number: '4.2'
    text: |-
      Indien de duur van de uitkering, berekend op basis van [artikel 2][ref1], korter is dan de duur van de uitkering,
      berekend op basis van [artikel 42][ref2] of [52g van de Werkloosheidswet][ref3], wordt de uitkering krachtens de
      [artikelen 42][ref4] en [52g van de Werkloosheidswet][ref5] gedurende de eerste twaalf maanden tot 80%, gedurende
      de daaropvolgende zes maanden tot 75% en vervolgens tot 70% aangevuld.


      [ref1]: https://wetten.overheid.nl/BWBR0011826#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel52g
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel42
      [ref5]: https://wetten.overheid.nl/BWBR0004045#Artikel52g
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011826
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '42'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: 52g
      - id: ref4
        bwb_id: BWBR0004045
        artikel: '42'
      - id: ref5
        bwb_id: BWBR0004045
        artikel: 52g
  - number: '4.3'
    text: |-
      Voor de toepassing van dit artikel wordt de uitkering krachtens de [Werkloosheidswet][ref1] steeds geacht door
      betrokkene onverminderd te zijn genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '5.1'
    text: |-
      Indien de betrokkene gedurende de periode dat hij recht heeft op een uitkering krachtens de
      [Werkloosheidswet][ref1], wegens ziekte verhinderd wordt arbeid te verrichten en deswege een uitkering geniet
      krachtens de [Ziektewet][ref2] wordt de uitkering krachtens de Ziektewet zolang een uitkering krachtens
      de Ziektewet wordt genoten, aangevuld tot de percentages van het dagloon bedoeld in [artikel 4][ref3], met
      inachtneming van de daaraan voorafgaande termijn waarover betrokkene recht op een aanvullende uitkering heeft
      gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0011826#Artikel4
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0011826
        artikel: '4'
        hoofdstuk: '2'
  - number: '5.2'
    text: |-
      Indien het recht op uitkering krachtens de [Werkloosheidswet][ref1] na afloop van de periode, waarin de
      [Ziektewet][ref2] op betrokkene van toepassing is geweest, herleeft, tellen zowel de termijn waarover
      betrokkene voorafgaand aan deze periode recht heeft gehad op een uitkering krachtens de Werkloosheidswet als
      de termijn waarin de Ziektewet op hem van toepassing is geweest met inachtneming van hetgeen hieromtrent in
      [artikel 43, tweede en derde lid, van de Werkloosheidswet][ref3] is bepaald, mee voor het vaststellen van de hoogte
      van de aanvullende uitkering, bedoeld in [artikel 4][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel43
      [ref4]: https://wetten.overheid.nl/BWBR0011826#Artikel4
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '43'
      - id: ref4
        bwb_id: BWBR0011826
        artikel: '4'
        hoofdstuk: '2'
  - number: '5.3'
    text: |-
      Voor de toepassing van dit artikel wordt de uitkering krachtens de [Ziektewet][ref1] steeds geacht onverminderd
      door de betrokkene te zijn genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 5a.1
    text: |-
      Indien de betrokkene gedurende de periode dat zij recht heeft op een uitkering krachtens de
      [Werkloosheidswet][ref1], in verband met zwangerschap en bevalling, adoptie onderscheidenlijk het opnemen van een
      pleegkind in het genot komt van een uitkering krachtens de [Wet arbeid en zorg][ref2], wordt de uitkering krachtens
      de Wet arbeid en zorg gedurende de periode waarin de betrokkene in het genot hiervan is, aangevuld tot 100% van het
      voor de betrokkene geldende dagloon.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0013008
  - number: 5a.2
    text: |-
      Indien het recht op uitkering krachtens de [Werkloosheidswet][ref1] na afloop van de periode waarin de betrokkene
      in het genot van een uitkering krachtens de [Wet arbeid en zorg][ref2] is geweest, herleeft, tellen zowel
      de termijn waarover betrokkene voorafgaand aan die periode recht heeft gehad op een uitkering krachtens de
      Werkloosheidswet als de termijn gedurende welke krachtens de Wet arbeid en zorg een uitkering is genoten, mee voor
      het vaststellen van de hoogte van de aanvullende uitkering, bedoeld in [artikel 4][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0013008
      [ref3]: https://wetten.overheid.nl/BWBR0011826#Artikel4
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0013008
      - id: ref3
        bwb_id: BWBR0011826
        artikel: '4'
        hoofdstuk: '2'
  - number: 5a.3
    text: |-
      Voor de toepassing van dit artikel wordt de uitkering krachtens de [Wet arbeid en zorg][ref1] steeds geacht
      onverminderd door de betrokkene te zijn genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0013008
  - number: '6.1'
    text: |-
      Zo spoedig mogelijk na het overlijden van betrokkene wordt de uitkering, bedoeld in
      [artikel 35 van de Ziektewet][ref1] aangevuld tot 100% van het voor betrokkene geldende dagloon.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel35
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '35'
  - number: '6.2'
    text: |-
      Voor de toepassing van het eerste lid wordt de uitkering krachtens de [Ziektewet][ref1] steeds geacht onverminderd
      door de betrokkene te zijn genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '7'
    text: |-
      Indien ten aanzien van de uitkering die betrokkene krachtens de [Werkloosheidswet][ref1] of krachtens de
      [Ziektewet][ref2] geniet een verplichting of een sanctie wordt opgelegd, wordt die verplichting eveneens opgelegd
      dan wel die sanctie op overeenkomstige wijze toegepast op de aanvullende uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0001888
  - number: '8.1'
    text: |-
      Indien op het moment van ontslag de duur van de uitkering berekend op basis van [artikel 2][ref1], langer is dan
      de duur van de uitkering berekend op basis van de [Werkloosheidswet][ref2], heeft de betrokkene, die het einde van
      de uitkeringsduur krachtens de Werkloosheidswet heeft bereikt, met ingang van dat moment recht op een aansluitende
      uitkering, met dien verstande dat de verloren arbeidsuren waarvoor hij geen betrokkene is, geen aanspraak geven op
      een uitkering krachtens dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0011826#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011826
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0004045
  - number: '8.2'
    text: |-
      Op de aansluitende uitkering zijn [afdeling I van hoofdstuk IIA](onbekend) en de [artikelen 75][ref1], [76][ref2]
      en [78 van de Werkloosheidswet][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel76
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel78
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '75'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '76'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '78'
  - number: '8.3'
    text: 'In afwijking van het tweede lid eindigt het recht op een aansluitende uitkering niet voor zover de betrokkene:'
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel8
  - number: 8.3.a
    text: |-
      recht heeft op een uitkering als bedoeld in
      [artikel 19, eerste lid, onderdeel a of b, van de Werkloosheidswet][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel19
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '19'
  - number: 8.3.b
    text: |-
      geen recht heeft op een uitkering als bedoeld in
      [artikel 19, eerste lid, onderdeel a of b van de Werkloosheidswet][ref1] vanwege het enkele feit dat zijn
      verzekering op grond van de in artikel 19 van de Werkloosheidswet genoemde wetten is geëindigd; of


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel19
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '19'
  - number: 8.3.c
    text: niet beschikbaar is om arbeid te aanvaarden in verband met een situatie als bedoeld in onderdeel a of b.
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel8
  - number: '8.4'
    text: |-
      In afwijking van het tweede lid zijn de [artikelen 19, eerste lid, onderdeel i][ref1], en
      [20, eerste lid, onderdeel e, van de Werkloosheidswet][ref2] niet van overeenkomstige toepassing op de aansluitende
      uitkering, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel20
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '20'
  - number: '8.5'
    text: |-
      Het recht op een aansluitende uitkering eindigt na ommekomst van de duur van de aansluitende uitkering, doch
      uiterlijk op de eerste dag van de kalendermaand volgend op die waarin de betrokkene de leeftijd van 65 jaar heeft
      bereikt.
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel8
  - number: '9'
    text: |-
      De duur van de aansluitende uitkering is de op het moment van ontslag berekende uitkeringsduur op basis
      van [artikel 2][ref1], verminderd met de ter zake van dat ontslag berekende uitkeringsduur krachtens de
      [Werkloosheidswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011826#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011826
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0004045
  - number: '10.1'
    text: |-
      De aansluitende uitkering bedraagt voor de betrokkene gedurende de eerste twaalf maanden 80%, gedurende de
      daaropvolgende zes maanden 75%, en vervolgens 70% van het voor hem geldende dagloon. Gedurende de verlenging,
      bedoeld in [artikel 2, derde lid][ref1], is de uitkering gelijk aan 70% van het dagloon.


      [ref1]: https://wetten.overheid.nl/BWBR0011826#Artikel2
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011826
        artikel: '2'
        hoofdstuk: '1'
  - number: '10.2'
    text: |-
      Bij de toepassing van het eerste lid wordt rekening gehouden met de termijn waarin betrokkene eerst recht heeft
      gehad op een aanvullende uitkering.
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel10
  - number: '10.3'
    text: |-
      Ten aanzien van de hoogte van de aansluitende uitkering zijn de [artikelen 45][ref1] en
      [47, tweede en derde lid, van de Werkloosheidswet][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel47
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '47'
  - number: '11.1'
    text: |-
      Zo spoedig mogelijk na het overlijden van de betrokkene wordt onder overeenkomstige toepassing van
      [artikel 35][ref1] dan wel [artikel 36 van de Ziektewet][ref2] een overlijdensuitkering toegekend, met dien
      verstande dat de uitkering 100% van het dagloon bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel36
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '36'
  - number: '11.2'
    text: |-
      Op het uit te keren bedrag, bedoeld in het eerste lid, wordt in mindering gebracht het bedrag van de uitkering
      waarop de nagelaten betrekkingen van betrokkene ter zake van diens overlijden aanspraak kunnen maken uit
      hoofde van een of meer werkloosheidsuitkeringen, arbeidsongeschiktheidsuitkeringen, uitkeringen op grond van de
      [Ziektewet][ref1] dan wel uitkeringen die naar aard en strekking overeenkomen met laatstgenoemde uitkeringen,
      waarop betrokkene recht had.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '12.1'
    text: |-
      Voor de betrokkene, die ter zake van een zelfde ontslag recht op een bovenwettelijke uitkering en recht op een
      suppletie heeft, komt gedurende de termijn dat hij recht heeft op die suppletie het recht op een bovenwettelijke
      uitkering niet tot uitbetaling.
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel12
  - number: '12.2'
    text: |-
      De betrokkene, bedoeld in het eerste lid, heeft met ingang van de eerste dag volgende op die waarop de suppletie
      is geëindigd, recht op een bovenwettelijke uitkering, voor de periode dat de duur van de bovenwettelijke uitkering,
      waarop betrokkene recht zou hebben gehad indien hij geen recht op suppletie zou hebben gehad, langer is dan de duur
      van de suppletie.
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel12
  - number: '12.3'
    text: |-
      Ter bepaling van de hoogte van de bovenwettelijke uitkering wordt uitgegaan van de datum van het ontslag, bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel12
  - number: '12.4'
    text: De bovenwettelijke uitkering eindigt na ommekomst van de duur van de bovenwettelijke uitkering.
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel12
  - number: '13.1'
    text: |-
      De betrokkene, die recht heeft op een uitkering krachtens de [Wet op de arbeidsongeschiktheidsverzekering][ref1],
      berekend naar een arbeidsongeschiktheid van 80% of meer, heeft recht op een bovenwettelijke uitkering krachtens
      dit besluit op het moment dat de mate van arbeidsongeschiktheid op een lager percentage wordt vastgesteld dan 80%
      waardoor recht ontstaat op een uitkering krachtens de [Werkloosheidswet][ref2]. Indien de uitkering krachtens de
      [Wet op de arbeidsongeschiktheidsverzekering][ref3], bedoeld in de eerste volzin, is ontstaan uit twee of meer
      dienstbetrekkingen wordt het recht op een bovenwettelijke uitkering krachtens dit besluit toegerekend aan de
      dienstbetrekking ter zake waarvan hij betrokkene is in de zin van dit besluit, naar rato van de feitelijk genoten
      inkomsten uit hoofde van de desbetreffende dienstbetrekkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0002524
  - number: '13.2'
    text: |-
      Ter bepaling van de duur van de bovenwettelijke uitkering krachtens [artikel 2][ref1] wordt uitgegaan van de datum
      van het ontslag, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011826#Artikel2
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011826
        artikel: '2'
        hoofdstuk: '1'
  - number: '13.3'
    text: |-
      De hoogte van de bovenwettelijke uitkering wordt vastgesteld te rekenen vanaf de datum van het ontslag, bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel13
  - number: '14.1'
    text: |-
      Indien het recht op een bovenwettelijke uitkering geheel of gedeeltelijk is geëindigd en betrokkene is, na het
      gaan verrichten van arbeid als werknemer, wederom werkloos is geworden in de zin van de [Werkloosheidswet][ref1],
      herleeft op zijn aanvraag het recht op een bovenwettelijke uitkering voor zover er een nieuw recht op een uitkering
      krachtens de [Werkloosheidswet][ref2] is ontstaan of het oude recht is herleefd. De duur en de hoogte van de
      bovenwettelijke uitkering zijn gelijk aan de duur en de hoogte van de uitkering waarop betrokkene op grond van dit
      besluit nog recht zou hebben gehad indien hij onafgebroken werkloos zou zijn geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
  - number: '14.2'
    text: |-
      De betrokkene aan wie een ontslag is verleend en die onmiddellijk aansluitend aan dat ontslag arbeid als werknemer
      gaat verrichten en die werkloos wordt in de zin van de [Werkloosheidswet][ref1], heeft op zijn aanvraag recht
      op een bovenwettelijke uitkering krachtens dit besluit voor zover er een recht op een uitkering krachtens de
      [Werkloosheidswet][ref2] bestaat op het moment van werkloos worden, met ingang van de eerste dag waarop recht op
      een uitkering krachtens de [Werkloosheidswet][ref3] is ontstaan. De duur en hoogte van de bovenwettelijke uitkering
      zijn gelijk aan de duur en hoogte van de bovenwettelijke uitkering, waarop betrokkene op het moment van ontslag
      recht zou hebben gehad, met dien verstande dat het recht op bovenwettelijke uitkering ingaat met ingang van de dag
      waarop het ontslag is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0004045
  - number: '14.3'
    text: |-
      Een recht op een bovenwettelijke uitkering als bedoeld in het eerste en tweede lid, kan slechts ontstaan gedurende
      de termijn welke betrokkene in het geval dat hij onafgebroken werkloos zou zijn geweest, een bovenwettelijke
      uitkering ter zake van dat ontslag zou hebben genoten.
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel14
  - number: '15.1'
    text: |-
      De betrokkene, wiens recht op uitkering geheel of gedeeltelijk is beëindigd wegens het gaan verrichten van
      arbeid als werknemer, ontvangt op zijn aanvraag, gedurende de voor hem op de datum van ontslag vastgestelde
      uitkeringsduur, voor zover deze nog niet is verstreken, een loonaanvulling, indien het dagloon in de nieuwe
      betrekking minder bedraagt dan het dagloon uit de betrekking waaruit hij werkloos werd.
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel15
  - number: '15.2'
    text: |-
      De loonaanvulling vervalt met ingang van de dag, waarop de betrokkene opnieuw volledig werkloos wordt of niet meer
      voldoet aan de voorwaarde, bedoeld in het eerste lid, of de duur van de uitkering is verstreken.
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel15
  - number: '15.3'
    text: |-
      De hoogte van de loonaanvulling is gelijk aan het verschil tussen het dagloon in zijn nieuwe betrekking en het
      dagloon van de betrekking waaruit betrokkene werkloos is geworden.
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel15
  - number: '15.4'
    text: |-
      De loonaanvulling wordt proportioneel toegekend, indien de omvang van de nieuwe betrekking minder bedraagt dan de
      betrekking waaruit de betrokkene is ontslagen. Indien de omvang van de nieuwe betrekking groter is dan de omvang
      van de betrekking waaruit de betrokkene is ontslagen, bedraagt de hoogte van de loonaanvulling het feitelijke
      verschil in dagloon tussen de oude en de nieuwe betrekking.
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel15
  - number: '15.5'
    text: |-
      De aanvraag om loonaanvulling wordt binnen drie maanden na het aanvaarden van de nieuwe betrekking ingediend. De
      loonaanvulling wordt door middel van een beschikbaar gesteld formulier aangevraagd. Bij overschrijding van deze
      termijn wordt de loonaanvulling toegekend vanaf het moment dat de aanvraag werd ingediend.
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel15
  - number: '15.6'
    text: De loonaanvulling telt niet mee voor de berekening van het pensioen.
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel15
  - number: '16'
    text: |-
      Aan de betrokkene, die buiten de rijksdienst arbeid of bedrijf ter hand gaat nemen, kan op zijn aanvraag ter zake
      van de kosten, die voor hem aan een daartoe nodige verhuizing zijn verbonden, een eenmalige tegemoetkoming worden
      toegekend van € 1 361 onder verrekening van een tegemoetkoming in verhuiskosten uit anderen hoofde.
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel16
  - number: '17'
    text: |-
      Op aanvraag van de betrokkene kan het recht op de bovenwettelijke uitkering voor 30% van de nominale waarde daarvan
      worden afgekocht indien de bestemming van het afkoopbedrag kansen biedt op een blijvende opheffing van de bestaande
      werkloosheid.
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel17
  - number: '18'
    text: |-
      In afwijking van de [artikelen 4][ref1] en [10][ref2] bedraagt het percentage 77% in
      plaats van 80%, 72% in plaats van 75%, 67% in plaats van 70% van het dagloon, zolang de
      __REF002___________________________________________________________________________________________________________
      __________________________________________________________________________________________________________ (Stb.
      657) op de betrokkene van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0011826#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011826#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003739
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0011826
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0011826
        artikel: '10'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0003739
  - number: '19.1'
    text: |-
      Indien het niveau van de uitkering krachtens de [Werkloosheidswet][ref1] een algemeen neerwaartse wijziging
      ondergaat, wordt deze neerwaartse wijziging, behoudens indien na overleg met de Sectorcommissie rechterlijke
      macht, genoemd in [artikel 50, tweede lid, van de Wet rechtspositie rechterlijke ambtenaren][ref2] anders wordt
      overeengekomen, binnen zes maanden na de datum van uitgifte van het Staatsblad waarin de maatregel is geplaatst,
      op overeenkomstige wijze doorgevoerd ten aanzien van het totaal aan wettelijke en bovenwettelijke aanspraken van
      betrokkene, vanaf de datum van inwerkingtreding van bedoelde maatregel, doch niet eerder dan zes maanden na de
      datum van uitgifte van het Staatsblad waarin de maatregel is geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel50
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0008365
        artikel: '50'
  - number: '19.2'
    text: |-
      Indien in het overleg, bedoeld in het eerste lid, een geschil ontstaat, wordt de doorvoering van de
      neerwaartse wijziging, in afwijking van het eerste lid, opgeschort met ingang van de dag waarop het geschil
      voor advies dan wel arbitrale uitspraak is voorgelegd aan de Advies- en Arbitragecommissie, genoemd in
      [artikel 53 van de Wet rechtspositie rechterlijke ambtenaren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel53
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '53'
  - number: '19.3'
    text: |-
      Indien de Advies- of Arbitragecommissie blijkens zijn advies of arbitrale uitspraak geen bedenkingen heeft tegen
      doorvoering van de neerwaartse wijziging, wordt de maatregel op overeenkomstige wijze doorgevoerd ten aanzien van
      het totaal aan wettelijke en bovenwettelijke aanspraken van betrokkene vanaf de datum van inwerkingtreding daarvan,
      doch niet eerder dan zes maanden na de datum van uitgifte van het Staatsblad waarin de maatregel is geplaatst.
      Indien de datum van inwerkingtreding van de bedoelde maatregel is gelegen op een tijdstip vóór het uitbrengen van
      het advies dan wel vóór de arbitrale uitspraak, vindt de doorvoering plaats vanaf de eerste dag na de maand waarin
      het advies is uitgebracht dan wel de arbitrale uitspraak is gedaan, doch niet eerder dan zes maanden na de datum
      van uitgifte van het Staatsblad waarin de maatregel is geplaatst.
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel19
  - number: '20'
    text: |-
      Het dagloon wordt steeds aangepast overeenkomstig een algemene wijziging van het salaris en van de vakantie-
      uitkering van rechterlijke ambtenaren, met ingang van de dag waarop de salariswijziging respectievelijk de
      wijziging van de vakantie-uitkering van kracht wordt.
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel20
  - number: '22.1'
    text: |-
      Ontslaguitkeringen die aan de betrokkene zijn toegekend krachtens
      [artikel 39, tweede lid, van het Besluit rechtspositie rechterlijke ambtenaren][ref1]
      zoals dat luidde vóór het tijdstip van aanvang van fase 2, bedoeld in
      [artikel 53 van de Wet overheidspersoneel onder de werknemersverzekeringen][ref2], blijven gehandhaafd voor de duur
      van de uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0009267#Artikel53
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '39'
      - id: ref2
        bwb_id: BWBR0009267
        artikel: '53'
  - number: '22.2'
    text: |-
      De rechterlijk ambtenaar die voor of op 31 december 1999 in tijdelijke dienst is aangesteld en die tot de datum
      van ontslag, die ligt op of na 1 januari 2001, onafgebroken in tijdelijke dienst is geweest, heeft recht op een
      aanvullende uitkering overeenkomstig de bepalingen van [hoofdstuk 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011826#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0011826
        hoofdstuk: '2'
  - number: '23'
    text: Dit besluit treedt in werking op 1 januari 2001.
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel23
  - number: '24'
    text: 'Dit besluit wordt aangehaald als: Besluit bovenwettelijke uitkeringen bij werkloosheid van rechterlijke ambtenaren.'
    url: https://wetten.overheid.nl/BWBR0011826/2007-05-01#Artikel24
