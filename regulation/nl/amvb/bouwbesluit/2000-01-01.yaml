                    0,21 m


                    0,21 m




                    minimum breedte van het tredevlak, gemeten loodrecht op de voorkant van dat vlak


                    0,05 m


                    0,17 m




                    minimum breedte van het tredevlak ter plaatse van de klimlijn, gemeten loodrecht op de voorkant van
      dat vlak


                    0,23 m


                    0,23 m




                    minimum afstand van de klimlijn tot de zijkanten van de trap


                    0,3 m


                    0,3 m
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel5
  - number: '5.2'
    text: |-
      In afwijking van het eerste lid, mag de trap die is bestemd voor het ontsluiten van woningen met een gezamenlijke
      gebruiksoppervlakte van ten hoogste 270 m2, voldoen aan kolom A van tabel II.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel5
  - number: '5.3'
    text: |-
      Onverminderd het eerste lid, mag de som van een aantrede en twee optreden, gemeten ter plaatse van de klimlijn, ten
      hoogste 0,7 m, doch niet minder dan 0,57 m zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel5
  - number: '5.4'
    text: |-
      Een trap die voldoet aan kolom A van tabel II en een trap als bedoeld in het tweede lid, moeten ter plaatse van de
      bovenste trede over de ten minste vereiste breedte aansluiten op een vrije vloeroppervlakte van ten minste 0,8 m *
      0,8 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel5
  - number: '5.5'
    text: |-
      Een trap die moet voldoen aan kolom B van tabel II, moet ter plaatse van de bovenste trede over de ten minste
      vereiste breedte aansluiten op een vrije vloeroppervlakte van ten minste 1,1 m * 1,1 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel5
  - number: '5.6'
    text: |-
      Een trap als bedoeld in het eerste lid, waarmee een hoogteverschil is overbrugd van meer dan 0,6 m, moet aan beide
      zijkanten vanaf een hoogte van 0,6 m zijn voorzien van een afscheiding met een hoogte van ten minste 0,8 m boven de
      voorkant van de tredevlakken van de trap.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel5
  - number: '5.7'
    text: |-
      Op een afscheiding als bedoeld in het zesde lid, is artikel 3, vijfde tot en met zevende lid, van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel5
  - number: '5.8'
    text: |-
      Een trap als bedoeld in het zesde lid, waarvan de klimlijn een helling heeft die groter is dan 2:3, moet aan ten
      minste één zijkant zijn voorzien van een leuning waarvan de bovenkant zich bevindt op een hoogte van ten minste 0,8
      m en ten hoogste 1 m boven de voorkant van de tredevlakken van de trap.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel5
  - number: '5.9'
    text: |-
      In afwijking in zoverre van het achtste lid, moet een trap die moet voldoen aan kolom B van tabel II, aan beide
      zijkanten zijn voorzien van een leuning als bedoeld in dat lid.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel5
  - number: '5.10'
    text: |-
      Een trap die is bestemd voor het ontsluiten van een woning of woongebouw en waarmee, gemeten vanaf het aansluitende
      terrein of een aangrenzende vloer, een hoogteverschil is overbrugd van meer dan 1,5 m, moet zijn gelegen in
      een besloten ruimte waarvan de uitwendige scheidingsconstructie, bepaald overeenkomstig NEN 2778, ten minste
      regenwerend is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel5
  - number: '6.1'
    text: |-
      Een hellingbaan als bedoeld in artikel 4, moet een breedte hebben van ten minste 1,1 m, mag geen grotere hoogte
      hebben dan 1 m en mag voorts geen grotere helling hebben dan:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel6
  - number: 6.1.a
    text: 1:12, indien het hoogteverschil niet groter is dan 0,25 m;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel6
  - number: 6.1.b
    text: 1:16, indien het hoogteverschil groter is dan 0,25 m doch niet groter dan 0,5 m, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel6
  - number: 6.1.c
    text: 1:20, indien het hoogteverschil groter is dan 0,5 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel6
  - number: '6.2'
    text: |-
      Een hellingbaan als bedoeld in het eerste lid, moet aan de bovenkant over de ten minste vereiste breedte aansluiten
      op een vrije vloeroppervlakte van ten minste 1,4 m * 1,4 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel6
  - number: '6.3'
    text: 'Een hellingbaan als bedoeld in het eerste lid, moet:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel6
  - number: 6.3.a
    text: |-
      tot een hoogte van minder dan 0,6 m aan beide zijkanten zijn voorzien van een afscheiding met een hoogte van ten
      minste 0,04 m boven de hellingbaan, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel6
  - number: 6.3.b
    text: |-
      vanaf een hoogte van 0,6 m aan beide zijkanten zijn voorzien van een afscheiding met een hoogte van ten minste 0,85
      m boven de hellingbaan.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel6
  - number: '6.4'
    text: |-
      Op een afscheiding als bedoeld in het derde lid, is artikel 3, vijfde tot en met zevende lid, van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel6
  - number: '7.1'
    text: |-
      In een woning en in een woongebouw moet, opdat op veilige wijze over energie kan worden beschikt, een voorziening
      voor elektriciteit aanwezig zijn die ten minste voldoet aan artikel 5, eerste lid, onderdeel 2, van de Model-
      aansluitvoorwaarden voor elektrische energie van de Vereniging van Exploitanten van Elektriciteitsbedrijven in
      Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel7
  - number: '7.2'
    text: |-
      Onverminderd het eerste lid, moet de voorziening voor elektriciteit in de meterruimte ten minste één
      aansluitmogelijkheid hebben voor aansluiting op het distributienet van elektriciteit.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel7
  - number: '7.3'
    text: |-
      Een voorziening voor noodstroom moet ten minste voldoen aan artikel 5, eerste lid, onderdeel 2, van de Model-
      aansluitvoorwaarden voor elektrische energie van de Vereniging van Exploitanten van Elektriciteitsbedrijven in
      Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel7
  - number: '8.1'
    text: |-
      In een besloten gemeenschappelijke verkeersruimte moet, opdat op veilige wijze van die ruimte gebruik kan
      worden gemaakt, ten minste één verlichtingsinstallatie aanwezig zijn die is aangesloten op de voorziening voor
      elektriciteit en die over de ten minste vereiste breedte van die ruimte, gemeten op de vloer van die ruimte, een
      verlichtingssterkte van ten minste 10 lux kan geven.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel8
  - number: '8.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een in een besloten gemeenschappelijke verkeersruimte gelegen
      trap of hellingbaan, alsmede op de kooi van een lift.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel8
  - number: '8.3'
    text: |-
      De verlichtingsinstallatie van de kooi van een lift is aangesloten op een voorziening voor noodstroom, die binnen
      vijftien seconden na het uitvallen van de voorziening voor elektriciteit, gedurende ten minste zestig minuten een
      verlichtingssterkte kan geven van ten minste één lux.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel8
  - number: '9.1'
    text: |-
      In een woning moet, opdat op veilige wijze over energie kan worden beschikt, een voorziening voor gas aanwezig
      zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel9
  - number: '9.2'
    text: |-
      Het eerste lid geldt niet voor een woning in een woongebouw, indien die woning kan worden aangesloten op een
      gemeenschappelijke voorziening voor de verwarming van de in dat woongebouw gelegen woningen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel9
  - number: '9.3'
    text: Indien het tweede lid van toepassing is, moet in het woongebouw een voorziening voor gas aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel9
  - number: '9.4'
    text: |-
      Een voorziening voor gas moet ten minste voldoen aan artikel 5, eerste lid, onderdeel 2, van de Model-
      aansluitvoorwaarden voor gas van de Vereniging van Exploitanten van Gasbedrijven in Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel9
  - number: '9.5'
    text: |-
      Het eerste en derde lid zijn niet van toepassing, indien de woning of het woongebouw is aangesloten op het
      distributienet van de stadsverwarming of op een andere voorziening die is bestemd voor de verwarming van meer dan
      één woning.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel9
  - number: '10.1'
    text: |-
      De voorziening voor gas, bedoeld in artikel 9, eerste lid, moet, opdat gas kan worden betrokken, in de meterruimte
      ten minste één aansluitmogelijkheid hebben voor aansluiting op het distributienet van gas.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel10
  - number: '10.2'
    text: |-
      De voorziening voor gas, bedoeld in artikel 9, eerste lid, moet, opdat op die voorziening op gas gestookte
      verbrandingstoestellen kunnen worden aangesloten, voorts onderscheidenlijk ten minste één aansluitpunt hebben ter
      plaatse van:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel10
  - number: 10.2.a
    text: de opstelplaats voor een kooktoestel, bedoeld in artikel 53;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel10
  - number: 10.2.b
    text: de opstelplaats voor een stooktoestel, bedoeld in artikel 55, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel10
  - number: 10.2.c
    text: de opstelplaats voor een warmwatertoestel, bedoeld in artikel 56.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel10
  - number: '10.3'
    text: |-
      Het tweede lid, aanhef en onderdeel *c*, is niet van toepassing, indien in de woning het stooktoestel en het
      warmwatertoestel zijn samengevoegd dan wel in het woongebouw een gemeenschappelijk warmwatertoestel aanwezig is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel10
  - number: '10.4'
    text: |-
      De voorziening voor gas, bedoeld in artikel 9, derde lid, moet, opdat gas kan worden betrokken, in de
      gemeenschappelijke meterruimte een aansluitmogelijkheid hebben voor aansluiting op het distributienet van gas.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel10
  - number: '10.5'
    text: |-
      De voorziening voor gas, bedoeld in artikel 9, derde lid, moet, opdat op die voorziening een stooktoestel kan
      worden aangesloten, ten minste één aansluitpunt hebben ter plaatse van de opstelplaats, bedoeld in artikel 64.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel10
  - number: '11.1'
    text: |-
      Een beweegbaar constructie-onderdeel dat zich in enige stand kan bevinden boven een voor motorvoertuigen
      openstaande weg of boven een strook van 0,6 m grenzend aan die weg, moet, ter voorkoming van gevaar voor gebruikers
      van die weg of strook, gemeten vanaf de onderzijde van dat onderdeel, hoger zijn gelegen dan 4,2 m boven die weg
      of strook.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel11
  - number: '11.2'
    text: |-
      Een beweegbaar constructie-onderdeel dat zich in enige stand kan bevinden boven een niet voor motorvoertuigen
      openstaande weg, moet, ter voorkoming van gevaar voor gebruikers van die weg, gemeten vanaf de onderzijde van dat
      onderdeel, hoger zijn gelegen dan 2,2 m boven die weg.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel11
  - number: '11.3'
    text: |-
      Een beweegbaar constructie-onderdeel dat zich in enige stand kan bevinden boven een vloer van een
      gemeenschappelijke verkeersruimte of boven een trap of hellingbaan die in die ruimte is gelegen, moet, ter
      voorkoming van gevaar voor gebruikers van die ruimte, gemeten vanaf de onderzijde van dat onderdeel, hoger zijn
      gelegen dan 2,2 m boven die vloer, respectievelijk die trap of hellingbaan.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel11
  - number: '11.4'
    text: |-
      Het derde lid is niet van toepassing op een deur, indien de gemeenschappelijke verkeersruimte, gemeten ter plaatse
      van die deur in een onder een hoek van 90° geopende stand, een vrije doorgang heeft van ten minste 0,85 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel11
  - number: '12.1'
    text: |-
      Materiaal, toegepast ter plaatse van of in de nabijheid van een in NEN 6061 bedoelde stookplaats moet, ter
      beperking van het ontstaan van een brandgevaarlijke situatie, onbrandbaar zijn als bedoeld in NEN 6064, voor zover:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel12
  - number: 12.1.a
    text: |-
      ter plaatse van of in de nabijheid van die stookplaats een overeenkomstig NEN 6061 bepaalde intensiteit van de
      warmtestraling kan optreden van meer dan 2 kW/m2, of
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel12
  - number: 12.1.b
    text: in dat materiaal een overeenkomstig NEN 6061 bepaalde temperatuur kan optreden van meer dan 363 K.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel12
  - number: '12.2'
    text: |-
      Materiaal, toegepast aan de binnenzijde van een schacht, koker of kanaal moet, indien die schacht, die koker of
      dat kanaal grenst aan meer dan één brandcompartiment als bedoeld in NEN 6082, en een inwendige doorsnede heeft
      die groter is dan 0,015 m2, over een dikte van 0,01 m, gemeten loodrecht op de binnenzijde, onbrandbaar zijn als
      bedoeld in NEN 6064.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel12
  - number: '12.3'
    text: |-
      Het tweede lid is niet van toepassing, indien de schacht, de koker of het kanaal is gelegen in en uitsluitend is
      bestemd voor een of meer boven elkaar gelegen toiletruimten of badruimten.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel12
  - number: '12.4'
    text: |-
      Onverminderd het tweede lid, moet een schacht, koker of kanaal, bestemd voor de afvoer van rook, brandveilig zijn
      overeenkomstig NEN 6062.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel12
  - number: '12.5'
    text: |-
      Onverminderd het tweede en vierde lid, moet materiaal waaruit de voorziening voor de afvoer van rook is
      samengesteld, alsmede materiaal dat in de nabijheid van die voorziening is toegepast, voor zover in dat materiaal
      een overeenkomstig NEN 6062 bepaalde temperatuur kan optreden van meer dan 363 K, onbrandbaar zijn als bedoeld in
      NEN 6064.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel12
  - number: '12.6'
    text: |-
      De horizontale afstand tussen de uitmonding van een voorziening voor de afvoer van rook van een op vaste brandstof
      gestookt toestel en een in NEN 6063 bedoeld brandgevaarlijk dak van een ander bouwwerk mag niet minder zijn dan
      15 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel12
  - number: '12.7'
    text: Een dak mag, bepaald overeenkomstig NEN 6063, niet brandgevaarlijk zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel12
  - number: '12.8'
    text: |-
      Het zevende lid is niet van toepassing op het dak van een woning, voor zover dat dak is gelegen op een afstand van
      ten minste 15 m van de perceelsgrens.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel12
  - number: '12.9'
    text: |-
      In afwijking van het achtste lid, mag, indien het perceel waarop de woning is gelegen, grenst aan een openbare weg,
      openbaar water of openbaar groen, de afstand zijn aangehouden tot het hart van die weg, dat water of dat groen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel12
  - number: '13.1'
    text: |-
      Een constructie-onderdeel, met uitzondering van een dak, vloer of de bovenzijde van een trap, moet, ter
      beperking van de ontwikkeling van brand, ten minste behoren tot klasse 4 van de in NEN 6065 bedoelde bijdrage tot
      brandvoortplanting, bepaald overeenkomstig NEN 6082.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel13
  - number: '13.2'
    text: |-
      Een vloer en de bovenzijde van een trap moeten ten minste behoren tot klasse T3 van de in NEN 1775 bedoelde
      bijdrage tot brandvoortplanting, bepaald overeenkomstig NEN 6082.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel13
  - number: '13.3'
    text: |-
      In afwijking in zoverre van het eerste lid, moet een constructie-onderdeel van een ruimte waardoor een vluchtweg
      voert, met uitzondering van een vloer en de bovenzijde van een trap, aan de naar de vluchtweg toegekeerde zijde ten
      minste behoren tot klasse 2 van de bijdrage tot brandvoortplanting.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel13
  - number: '13.4'
    text: |-
      In afwijking in zoverre van het tweede lid, moeten een vloer en de bovenzijde van een trap waarover een vluchtweg
      voert, behoren tot klasse T1 van de bijdrage tot brandvoortplanting.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel13
  - number: '13.5'
    text: |-
      In afwijking in zoverre van het eerste lid, moet een uitwendige scheidingsconstructie van een woongebouw waarin een
      vloer van een verblijfsgebied hoger is gelegen dan 5 m boven het aansluitende terrein, gemeten ter plaatse van de
      toegang van het gebouw, aan de naar de buitenlucht toegekeerde zijde tot een hoogte van ten minste 2,5 m boven het
      aansluitende terrein behoren tot klasse 1 van de in NEN 6065 bedoelde bijdrage tot brandvoortplanting.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel13
  - number: '13.6'
    text: |-
      Het vijfde lid is niet van toepassing op een borstwering waarvan de bovenkant niet hoger is gelegen dan 1,5 m boven
      het aansluitende terrein, en op een deur, raam, kozijn en een daarmee gelijk te stellen constructie-onderdeel.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel13
  - number: '14.1'
    text: |-
      De in NEN 6068 bedoelde weerstand tegen branddoorslag en brandoverslag tussen een besloten ruimte waardoor
      geen vluchtweg voert, anders dan een gemeenschappelijke toiletruimte of een gemeenschappelijke badruimte, en
      een besloten verkeersruimte waardoor een vluchtweg voert, is, ter beperking van uitbreiding van brand, bepaald
      overeenkomstig NEN 6068, ten minste 30 minuten. Indien die vluchtweg door een veiligheidstrappehuis voert, is die
      weerstand ten minste 60 minuten.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel14
  - number: '14.2'
    text: |-
      Onverminderd het eerste lid, moet de weerstand tegen branddoorslag en brandoverslag tussen brandcompartimenten als
      bedoeld in NEN 6082, bepaald overeenkomstig die norm, ten minste 60 minuten zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel14
  - number: '14.3'
    text: |-
      In afwijking van het tweede lid, mag de weerstand tegen branddoorslag en brandoverslag tussen in een woongebouw
      gelegen woningen waarvan de permanente vuurbelasting, bepaald overeenkomstig NEN 6090, niet groter is dan 100 MJ/
      m2, ten minste 30 minuten zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel14
  - number: '14.4'
    text: |-
      In een inwendige scheidingsconstructie tussen brandcompartimenten als bedoeld in NEN 6082, mag zich geen beweegbaar
      constructie-onderdeel bevinden, anders dan een zelfsluitende deur.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel14
  - number: '14.5'
    text: |-
      In een inwendige scheidingsconstructie tussen een stookruimte en een andere besloten ruimte mag zich geen
      beweegbaar constructie-onderdeel bevinden, anders dan een zelfsluitende deur.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel14
  - number: '14.6'
    text: |-
      De weerstand tegen branddoorslag en brandoverslag tussen een brandcompartiment als bedoeld in NEN 6082, en een
      schacht, koker of kanaal met een inwendige doorsnede groter dan 0,015 m2 is, bepaald volgens NEN 6068, ten minste
      60 minuten.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel14
  - number: '14.7'
    text: |-
      Het zesde lid is niet van toepassing ten aanzien van een schacht, koker of kanaal, bestemd voor de toevoer van
      verse lucht en de afvoer van binnenlucht en hetzij grenzend aan ten hoogste één brandcompartiment als bedoeld
      in NEN 6082, hetzij gelegen in en uitsluitend bestemd voor een of meer boven elkaar gelegen toiletruimten of
      badruimten.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel14
  - number: '14.8'
    text: |-
      De weerstand tegen branddoorslag en brandoverslag tussen een woning of woongebouw en een ander, op hetzelfde
      perceel gelegen gebouw moet, bepaald overeenkomstig NEN 6082, ten minste 60 minuten zijn. Dit voorschrift geldt
      niet tussen een woning en een gebouw met een gebruiksoppervlakte van ten hoogste 50 m2, bestaande uit een of meer
      gebouwen die:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel14
  - number: 14.8.1°
    text: |-
      uitsluitend zijn bestemd voor opslag van goederen of materialen, anders dan bij ministeriële regeling aangegeven
      brandbare, brandbevorderende of bij brand gevaar opleverende stoffen, of
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel14
  - number: 14.8.2°
    text: |-
      geen woning zijn of gebouwen zijn anders dan bedoeld in artikel 1, tweede lid, onderdeel *a* tot en met *c* en *e*
      tot en met *o*.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel14
  - number: '14.9'
    text: |-
      De weerstand tegen branddoorslag en brandoverslag tussen een woning of woongebouw en een op een ander perceel
      gelegen gebouw moet, bepaald overeenkomstig NEN 6082, ten minste 60 minuten zijn, met dien verstande dat bij
      de bepaling van die weerstand moet zijn uitgegaan van een identiek, doch spiegelsymmetrisch ten opzichte van de
      perceelsgrens gelegen gebouw.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel14
  - number: '14.10'
    text: |-
      In afwijking van het achtste en negende lid mag, indien de permanente vuurbelasting van de woning of het
      woongebouw, bepaald overeenkomstig NEN 6090, niet groter is dan 500 MJ/m2, de weerstand tegen branddoorslag en
      brandoverslag ten minste 30 minuten zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel14
  - number: '14.11'
    text: |-
      In een inwendige scheidingsconstructie, waarvoor een eis voor de weerstand tegen branddoorslag en brandoverslag
      geldt, tussen een woning of woongebouw en een ander gebouw dan wel tussen een woning of woongebouw en een ander
      gedeelte van het gebouw waarin de woning of het woongebouw is gelegen mag zich geen beweegbaar constructie-
      onderdeel bevinden, anders dan een zelfsluitende deur.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel14
  - number: '15.1'
    text: |-
      In een woning moet zich, opdat bij brand vanuit de woning op veilige wijze het aansluitende terrein kan worden
      bereikt, tussen verblijfsruimten die niet op dezelfde bouwlaag zijn gelegen een inwendige scheidingsconstructie
      bevinden waarvan de weerstand tegen branddoorslag en brandoverslag, bepaald overeenkomstig NEN 6068, ten minste 20
      minuten is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel15
  - number: '15.2'
    text: |-
      In een woning moet zich tussen een verblijfsruimte en een ruimte die is gelegen op een andere bouwlaag die niet
      grenst aan de bouwlaag waarop de verblijfsruimte is gelegen, een inwendige scheidingsconstructie bevinden waarvan
      de weerstand tegen branddoorslag en brandoverslag, bepaald overeenkomstig NEN 6068, ten minste 20 minuten is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel15
  - number: '15.3'
    text: |-
      In een woning moet zich in de uitwendige scheidingsconstructie van een verblijfsruimte van waaruit het
      aansluitende terrein niet rechtstreeks kan worden bereikt door een of meer verkeersruimten waarvan de inwendige
      scheidingsconstructie met een verblijfsruimte, badruimte of bergruimte een weerstand tegen branddoorslag en
      brandoverslag, bepaald overeenkomstig NEN 6068, heeft van ten minste 20 minuten, ten minste één beweegbaar
      constructie-onderdeel bevinden, waarvan de onderzijde niet hoger is gelegen dan 1 m boven de vloer van de
      verblijfsruimte en waarmee een opening kan worden bewerkstelligd waarvan de afmetingen in horizontale richting ten
      minste 0,5 m en in verticale richting ten minste 0,8 m zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel15
  - number: '15.4'
    text: |-
      In afwijking van het derde lid, moet de verblijfsruimte waarvan een vloer hoger is gelegen dan 7 m boven het
      aansluitende terrein, gemeten ter plaatse van de toegang van de woning of het woongebouw, wat brandveiligheid
      betreft zodanig zijn ingericht, dat vanuit die ruimte op gelijkwaardige wijze het aansluitende terrein kan worden
      bereikt als met dat lid is beoogd.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel15
  - number: '15.5'
    text: |-
      In afwijking in zoverre van het eerste tot en met derde lid, behoeft, indien zich in de inwendige
      scheidingsconstructie een deur bevindt, een onder de deur gelegen deel van die constructie met een oppervlakte van
      ten hoogste 0,018 m2, van welk deel de bovenkant niet meer dan 0,05 m boven het vloeroppervlak is gelegen, niet aan
      de in die leden gestelde eisen te voldoen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel15
  - number: '15.6'
    text: |-
      De kortste afstand tussen een in NEN 6061 bedoelde stookplaats en de verticale projectie van een trap waarmee een
      hoogteverschil is overbrugd tussen de vloer van de ruimte waarin die opstelplaats zich bevindt en de vloer van een
      hoger gelegen ruimte, mag niet minder zijn dan 1,5 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel15
  - number: '16.1'
    text: |-
      Een woning met een gebruiksoppervlakte van meer dan 500 m2 en een woongebouw moeten, opdat bij brand vanuit
      die woning of dat gebouw op veilige wijze het aansluitende terrein kan worden bereikt, zijn voorzien van
      vluchtmogelijkheden die wat aantal, situering en inrichting betreft, ten minste voldoen aan het daaromtrent
      gestelde in NEN 6082.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel16
  - number: '16.2'
    text: |-
      De in NEN 6066 bedoelde rookproduktie van een constructie-onderdeel mag aan de naar een besloten ruimte van de
      woning of het woongebouw toegekeerde zijde, bepaald overeenkomstig NEN 6082, geen grotere rookdichtheid als bedoeld
      in NEN 6066 hebben dan 10 m-1.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel16
  - number: '16.3'
    text: |-
      In afwijking in zoverre van het tweede lid moet, indien door de besloten ruimte een vluchtweg voert, de
      rookdichtheid een waarde hebben van ten minste:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel16
  - number: 16.3.a
    text: |-
      5,4 m-1, indien het constructie-onderdeel behoort tot klasse 1 van de in NEN 6065 bedoelde bijdrage tot
      brandvoortplanting, bepaald overeenkomstig NEN 6082, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel16
  - number: 16.3.b
    text: |-
      2,2 m-1, indien het constructie-onderdeel behoort tot klasse 2 van de in NEN 6065 bedoelde bijdrage tot
      brandvoortplanting, bepaald overeenkomstig NEN 6082.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel16
  - number: '16.4'
    text: Het derde lid is niet van toepassing op een vloer en de bovenzijde van een trap waarover de vluchtweg voert.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel16
  - number: '16.5'
    text: 'De in NEN 6075 bedoelde weerstand tegen rookdoorgang tussen:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel16
  - number: 16.5.a
    text: ruimten waardoor een vluchtweg voert;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel16
  - number: 16.5.b
    text: een in NEN 6082 bedoeld brandcompartiment en een in die norm bedoeld vluchttrappehuis;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel16
  - number: 16.5.c
    text: een in NEN 6082 bedoeld brandcompartiment en een liftschacht waarin een brandweerlift is gelegen;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel16
  - number: 16.5.d
    text: een schacht, koker of kanaal en een ruimte waardoor een vluchtweg voert, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel16
  - number: 16.5.e
    text: een schacht, koker of kanaal en een liftschacht waarin een brandweerlift is gelegen,
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel16
  - number: '16.6'
    text: |-
      Het vijfde lid is niet van toepassing ten aanzien van een schacht, koker of kanaal, welke is bestemd voor de
      toevoer van verse lucht en de afvoer van binnenlucht en is gelegen in en uitsluitend is bestemd voor een of meer
      boven elkaar gelegen toiletruimten of badruimten.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel16
  - number: '16.7'
    text: |-
      In de inwendige scheidingsconstructie tussen de in het vijfde lid, onderdelen *a* tot en met *c* bedoelde ruimten
      mag zich geen beweegbaar constructie-onderdeel bevinden, anders dan een deur die, tenzij het in onderdeel *b*
      bedoelde brandcompartiment een woning is, zelfsluitend moet zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel16
  - number: '17.1'
    text: |-
      In een woongebouw mag, opdat de brandweer gebruikers van dat gebouw in geval van brand kan redden en brand kan
      bestrijden, de afstand tussen een toegang van een gemeenschappelijke verkeersruimte waarin een trap is gelegen
      waarover een vluchtmogelijkheid voert, en de toegang van een op die trap aangewezen, op dezelfde bouwlaag gelegen
      woning of gemeenschappelijk verblijfsgebied, gemeten langs de kortste route, niet groter zijn dan 45 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel17
  - number: '17.2'
    text: |-
      Een woongebouw waarin een vloer van een verblijfsgebied hoger is gelegen dan 20 m boven het aansluitende terrein,
      gemeten ter plaatse van de toegang van het gebouw, moet zijn voorzien van een overeenkomstig het derde lid
      te bepalen aantal brandweerliften waarvan de inrichting ten minste voldoet aan NEN-EN 81-1 voor zover het een
      elektrisch aangedreven lift betreft, of NEN-EN 81-2 voor zover het een hydraulisch aangedreven lift betreft.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel17
  - number: '17.3'
    text: |-
      De afstand tussen de toegang van een brandweerlift en de toegang van een op die lift aangewezen, op dezelfde
      bouwlaag gelegen woning of gemeenschappelijk verblijfsgebied, mag, gemeten langs de kortste route, niet groter zijn
      dan 90 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel17
  - number: '17.4'
    text: |-
      Een woning met een gebruiksoppervlakte van meer dan 500 m2 moet, opdat gebruikers van die woning op veilige wijze
      uit die woning kunnen vluchten, zijn voorzien van vluchtwegaanduidingen die ten minste voldoen aan NEN 6088.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel17
  - number: '18.1'
    text: |-
      Een woongebouw waarin een vloer van een verblijfsgebied hoger is gelegen dan 20 m boven het aansluitende terrein,
      gemeten ter plaatse van de toegang van het gebouw, moet, met het oog op brandbestrijding, zijn voorzien van een
      overeenkomstig het tweede lid te bepalen aantal droge blusleidingen waarvan de inrichting ten minste voldoet aan
      NEN 1594.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel18
  - number: '18.2'
    text: |-
      De afstand tussen een brandslangaansluiting van een blusleiding als bedoeld in het eerste lid, en een toegang van
      een op die aansluiting aangewezen, op dezelfde bouwlaag gelegen woning of gemeenschappelijk verblijfsgebied mag,
      gemeten langs de kortste route, niet groter zijn dan 50 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel18
  - number: '18.3'
    text: |-
      Indien in een woongebouw een vloer van een verblijfsgebied hoger is gelegen dan 50 m boven het aansluitende
      terrein, gemeten ter plaatse van de toegang van het gebouw, moet een blusleiding als bedoeld in het eerste lid,
      zijn voorzien van een elektrisch aangedreven pomp.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel18
  - number: '18.4'
    text: |-
      De pomp, bedoeld in het derde lid, moet zijn aangesloten op een voorziening voor noodstroom, opdat die pomp binnen
      15 seconden na het uitvallen van de voorziening voor elektriciteit gedurende ten minste 24 uren kan functioneren en
      gedurende ten minste 6 uren in bedrijf kan blijven.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel18
  - number: '18.5'
    text: |-
      Een woning met een gebruiksoppervlakte van meer dan 500 m2 moet zijn voorzien van een overeenkomstig het zevende
      lid te bepalen aantal brandslanghaspels.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel18
  - number: '18.6'
    text: |-
      Een brandslanghaspel als bedoeld in het vijfde lid, moet zijn voorzien van een slang met een lengte van ten hoogste
      20 m, van welke slang de statische druk bij het mondstuk bij gelijktijdig gebruik van twee op dezelfde waterleiding
      aangesloten brandslanghaspels ten minste 100 kPa is en de capaciteit ten minste 1,3 m3/h is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel18
  - number: '18.7'
    text: |-
      Bij de bepaling van het aantal brandslanghaspels als bedoeld in het vijfde lid, moet, opdat elk punt van een vloer
      van de woning met bluswater kan worden bereikt, zijn uitgegaan van:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel18
  - number: 18.7.a
    text: 2/3 van de beschikbare slanglengte, voor zover die slang voert door een verblijfsgebied, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel18
  - number: 18.7.b
    text: de totale beschikbare slanglengte, voor zover die slang niet voert door een verblijfsgebied,
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel18
  - number: '19'
    text: |-
      Onverminderd de artikelen 12 tot en met 18, moet een woongebouw waarin een vloer van een verblijfsgebied hoger
      is gelegen dan 70 m boven het aansluitende terrein, gemeten ter plaatse van de toegang van het gebouw, wat
      brandveiligheid betreft zodanig zijn ingericht dat het gebouw in gelijke mate brandveilig is als is beoogd met de
      bij of krachtens die artikelen gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel19
  - number: '20.1'
    text: |-
      Een toegang van een woongebouw moet, met het oog op het tegengaan van veel voorkomende criminaliteit, zijn voorzien
      van een zelfsluitende deur die van buitenaf slechts met behulp van een sleutel kan worden geopend.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel20
  - number: '20.2'
    text: |-
      Ten minste één deur als bedoeld in het eerste lid, moet vanuit elke woning die op die deur is aangewezen,
      rechtstreeks kunnen worden geopend.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel20
  - number: '20.3'
    text: |-
      Ter plaatse van de in het tweede lid bedoelde deur moet aan de buitenkant een voorziening aanwezig zijn waarmee een
      in de woning waarneembaar signaal kan worden gegeven, alsmede een vanuit de woning bedienbare spreekinstallatie.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel20
  - number: 20a.1
    text: |-
      Deuren, ramen, kozijnen en daarmee gelijk te stellen constructie-onderdelen in een uitwendige scheidingsconstructie
      van een woning, die bepaald overeenkomstig NEN 5087, bereikbaar zijn, moeten, bepaald overeenkomstig NEN 5096, een
      weerstandsklasse voor inbraakwerendheid hebben van tenminste 2.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel20a
  - number: 20a.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een inwendige scheidingsconstructie tussen een woning en een
      niet in die woning gelegen ruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel20a
  - number: '21.1'
    text: |-
      Indien niet is voldaan aan enig voorschrift, gegeven bij of krachtens de artikelen 2 tot en met 20a, moet een
      woning of woongebouw een mate van veiligheid bieden die ten minste gelijk is aan de mate van veiligheid die is
      beoogd met het desbetreffende bij of krachtens die artikelen gegeven voorschrift.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel21
  - number: '21.2'
    text: |-
      Indien toepassing is gegeven aan het eerste lid en het desbetreffende voorschrift tevens valt te herleiden tot
      overwegingen van gezondheid, bruikbaarheid of energiezuinigheid, moeten die overwegingen daarbij in ten minste
      dezelfde mate in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel21
  - number: '22.1'
    text: |-
      De in NEN 5077 bedoelde karakteristieke geluidwering van een uitwendige scheidingsconstructie die de scheiding
      vormt tussen een verblijfsgebied en de buitenlucht moet, ter beperking van geluidhinder in het verblijfsgebied,
      bepaald overeenkomstig die norm, ten minste gelijk zijn aan het verschil tussen de geluidsbelasting van die
      scheidingsconstructie, bepaald overeenkomstig de [Wet geluidhinder][ref1] (*Stb.* 1979, 99), en 35 dB(A), met een
      minimum van 20 dB(A).


      [ref1]: https://wetten.overheid.nl/BWBR0003227
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003227
  - number: '22.2'
    text: |-
      In afwijking van het eerste lid moet, indien ingevolge de [Wet geluidhinder][ref1] in het verblijfsgebied een
      hogere geluidsbelasting dan 35 dB(A) is toegestaan, de karakteristieke geluidwering van een in dat lid bedoelde
      uitwendige scheidingsconstructie, bepaald overeenkomstig NEN 5077, ten minste gelijk zijn aan het verschil tussen
      de geluidsbelasting van die scheidingsconstructie en de toegestane geluidsbelasting in dat gebied, met een minimum
      van 20 dB(A).


      [ref1]: https://wetten.overheid.nl/BWBR0003227
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003227
  - number: '22.3'
    text: |-
      De in NEN 5077 bedoelde karakteristieke geluidwering van een uitwendige scheidingsconstructie die de scheiding
      vormt tussen een verblijfsgebied en de buitenlucht, moet, bepaald overeenkomstig NEN 5077, afhankelijk van
      de in de eerste kolom van tabel III gegeven geluidsbelasting van die constructie, bepaald overeenkomstig de
      [Luchtvaartwet][ref1] (*Stb.* 1958, 47), ten minste gelijk zijn aan de bij die geluidsbelasting in de tweede kolom
      van die tabel aangegeven waarde. Tabel III Geluidwering in geval van luchtvaartlawaai





                    Geluidsbelasting in Ke Vereiste karakteristieke geluidwering




                    in dB(A)




                    36-40 30




                    41-45 33




                    46-50 36




                    meer dan 50 39


      [ref1]: https://wetten.overheid.nl/BWBR0002267
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002267
  - number: '22.4'
    text: |-
      De karakteristieke geluidwering van de uitwendige scheidingsconstructie van een verblijfsgebied van een woning,
      bestemd voor nachtverblijf, die de scheiding vormt tussen dat gebied en de buitenlucht, bepaald volgens NEN
      5077, is ten minste gelijk aan het verschil tussen de L geluidsbelasting, veroorzaakt door structureel uitgevoerd
      nachtelijk vliegverkeer, op die constructie en L 26 dB(A); de L geluidsbelasting in dB(A) buiten een woning voor
      startend en landend vliegverkeer wordt berekend overeenkomstig de Regeling berekening nachtelijke geluidsbelasting,
      waarbij de geluidwering van de uitwendige scheidingsconstructie onderscheiden naar startend en landend vliegverkeer
      (L) gelijk wordt gesteld aan 0 dB(A).
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel22
  - number: '22.5'
    text: |-
      Indien krachtens de [Luchtvaartwet][ref1] of [artikel 108 van de Wet geluidhinder][ref2] een andere dan de in
      het derde en het vierde lid, gegeven eis ten aanzien van de geluidwering van een in dat lid bedoelde uitwendige
      scheidingsconstructie is gesteld, blijven het derde en het vierde lid buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002267
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel108
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002267
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '108'
  - number: '22.6'
    text: |-
      Indien op grond van het eerste tot en met het vijfde lid met betrekking tot een of meer soorten geluid
      tegelijkertijd verschillende eisen aan de geluidwering van een uitwendige scheidingsconstructie zijn gesteld, geldt
      de zwaarste van de ingevolge die leden gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel22
  - number: '22.7'
    text: |-
      Op een inwendige scheidingsconstructie van een verblijfsgebied, voor zover die constructie niet de scheiding vormt
      met een ander verblijfsgebied, zijn het eerste tot en met het zesde lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel22
  - number: '22.8'
    text: |-
      De in NEN 5077 bedoelde karakteristieke geluidwering van een uitwendige scheidingsconstructie van een
      verblijfsruimte, voor zover die constructie de scheiding vormt met de buitenlucht, moet, bepaald overeenkomstig die
      norm, ten minste gelijk zijn aan de waarde van de karakteristieke geluidwering, bedoeld in het eerste tot en met
      het zesde lid, verminderd met 2 dB(A).
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel22
  - number: '22.9'
    text: |-
      Op een inwendige scheidingsconstructie van een verblijfsruimte, voor zover die constructie niet de scheiding vormt
      met een andere verblijfsruimte, is het achtste lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel22
  - number: '23.1'
    text: |-
      Het in NEN 5077 bedoelde karakteristieke geluidsniveau van een in een woning gelegen toilet met waterspoeling,
      kraan of mechanisch ventilatiesysteem mag, ter beperking van geluidsoverlast, bepaald overeenkomstig die norm, in
      een niet tot die woning behorend verblijfsgebied niet hoger zijn dan 30 dB(A).
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel23
  - number: '23.2'
    text: |-
      Het in NEN 5077 bedoelde karakteristieke geluidsniveau van een in een woongebouw, doch buiten een van dat
      gebouw deel uitmakende woning gelegen toilet met waterspoeling, warmwatertoestel, installatie voor het verhogen
      van de waterdruk, kraan, mechanisch ventilatiesysteem of lift, mag, bepaald overeenkomstig die norm, in een
      verblijfsgebied van een woning of van een ander gebouw niet hoger zijn dan 30 dB(A).
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel23
  - number: '24.1'
    text: |-
      De in NEN 5077 bedoelde karakteristieke isolatie-index voor luchtgeluid en de in die norm bedoelde isolatie-index
      voor contactgeluid tussen een besloten ruimte van een woning en een niet tot die woning behorend verblijfsgebied
      alsmede tussen een besloten ruimte van een woongebouw en een in een woning gelegen verblijfsgebied moeten, ter
      beperking van geluidhinder in het verblijfsgebied, bepaald overeenkomstig die norm, ten minste gelijk zijn aan
      0 dB.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel24
  - number: '24.2'
    text: |-
      De in NEN 5077 bedoelde karakteristieke isolatie-index voor luchtgeluid en de in die norm bedoelde isolatie-
      index voor contactgeluid tussen een besloten ruimte van een woning en een tot een andere woning of een woongebouw
      behorende besloten, niet van een verblijfsgebied deel uitmakende ruimte, geen gemeenschappelijke verkeersruimte
      zijnde, moeten, bepaald overeenkomstig die norm, ten minste gelijk zijn aan -5 dB.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel24
  - number: '24.3'
    text: |-
      De in NEN 5077 bedoelde karakteristieke isolatie-index voor luchtgeluid en de in die norm bedoelde isolatie-index
      voor contactgeluid tussen in een woning gelegen verblijfsruimten moeten, bepaald overeenkomstig die norm, ten
      minste gelijk zijn aan -20 dB.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel24
  - number: '24.4'
    text: |-
      Het derde lid is niet van toepassing, indien de in dat lid bedoelde verblijfsruimten in dezelfde bouwlaag zijn
      gelegen en in open verbinding staan met elkaar dan wel zich in de inwendige scheidingsconstructie tussen die
      verblijfsruimten een beweegbaar constructie-onderdeel bevindt.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel24
  - number: '25'
    text: |-
      De getalwaarde van de in NEN 5078 bedoelde totale geluidsabsorptie van een besloten gemeenschappelijke
      verkeersruimte die is bestemd voor het ontsluiten van in een woongebouw gelegen woningen, moet, ter beperking van
      geluidhinder in aan die verkeersruimte grenzende woningen, in elk van de octaafbanden met middenfrequenties van
      250, 500, 1000 en 2000 Hz, uitgedrukt in m2 en bepaald overeenkomstig die norm, ten minste gelijk zijn aan 1/8 van
      de getalwaarde van de inhoud van die ruimte, uitgedrukt in m3.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel25
  - number: '26.1'
    text: |-
      Een uitwendige scheidingsconstructie van een verblijfsgebied, toiletruimte of badruimte moet, ter beperking van het
      kunnen binnendringen van vocht in de woning of het woongebouw, bepaald overeenkomstig NEN 2778, waterdicht zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel26
  - number: '26.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een constructie die de scheiding vormt tussen een
      verblijfsgebied, toiletruimte of badruimte en de kruipruimte, met inbegrip van de op die constructie aansluitende
      delen van andere constructies, voor zover die delen van invloed zijn op het voldoen van die constructie aan dit
      lid.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel26
  - number: '26.3'
    text: |-
      Een inwendige scheidingsconstructie van een verblijfsgebied, toiletruimte of badruimte, voorzover die constructie
      niet de scheiding vormt met een ander verblijfsgebied of met een andere toiletruimte of badruimte, moet, bepaald
      overeenkomstig NEN 2778, waterdicht zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel26
  - number: '26.4'
    text: |-
      Een constructie die de scheiding vormt tussen een verblijfsgebied, toiletruimte of badruimte en de kruipruimte,
      met inbegrip van de op die constructie aansluitende delen van andere constructies, voor zover die delen van invloed
      zijn op het voldoen van die constructie aan dit lid, mag, bepaald overeenkomstig NEN 2690, geen grotere specifieke
      luchtvolumestroom als bedoeld in die norm hebben dan 20.10-6 m3/(m2.s).
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel26
  - number: '27.1'
    text: |-
      De in NEN 2778 bedoelde factor van de temperatuur van de binnenoppervlakte van een uitwendige scheidingsconstructie
      van een verblijfsgebied, toiletruimte of badruimte mag, ter beperking van vorming van allergenen, bepaald
      overeenkomstig die norm, niet lager zijn dan 0,65.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel27
  - number: '27.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een constructie die de scheiding vormt tussen een
      verblijfsgebied, toiletruimte of badruimte en de kruipruimte, met inbegrip van de op die constructie aansluitende
      delen van andere constructies, voor zover die delen van invloed zijn op het voldoen van die constructie aan dit
      lid.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel27
  - number: '27.3'
    text: |-
      De in NEN 2778 bedoelde factor van de temperatuur van de binnenoppervlakte van een inwendige scheidingsconstructie
      van een verblijfsgebied, toiletruimte of badruimte, voor zover die constructie niet de scheiding vormt met een
      ander verblijfsgebied of met een andere toiletruimte of badruimte, mag, bepaald overeenkomstig die norm, niet lager
      zijn dan 0,65.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel27
  - number: '27.4'
    text: |-
      Het eerste en derde lid zijn niet van toepassing op in de in die leden bedoelde scheidingsconstructies aanwezige
      kozijnen, alsmede op in die constructies aanwezige deuren en ramen of daarmee gelijk te stellen constructie-
      onderdelen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel27
  - number: '27.5'
    text: |-
      Een constructie die de scheiding vormt tussen een toiletruimte en een andere besloten ruimte, de buitenlucht,
      de grond of het water, mag, ter beperking van het vanuit de toiletruimte kunnen binnendringen van vocht in die
      constructie, aan de naar de toiletruimte toegekeerde oppervlakte tot een hoogte van 1,2 m boven de vloer van die
      ruimte, bepaald overeenkomstig NEN 2778, gemiddeld geen grotere wateropname als bedoeld in die norm hebben dan 0,01
      kg/(m2.s½), met dien verstande dat op geen enkele plaats op die oppervlakte de wateropname groter mag zijn dan 0,2
      kg/(m2.s1/2).
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel27
  - number: '27.6'
    text: |-
      Het vijfde lid is van overeenkomstige toepassing op een badruimte, met dien verstande dat ter plaatse van het
      bad of de douche over een lengte van ten minste 3 m een hoogte van 2,1 m boven de vloer van die ruimte moet zijn
      aangehouden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel27
  - number: '28.1'
    text: |-
      Een woning of woongebouw moet, ter voorkoming van een voor de gezondheid onaanvaardbare situatie in en bij de
      woning of het woongebouw, een voorziening hebben voor de afvoer van afvalwater en faecaliën, die kan worden
      aangesloten op het openbaar riool.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel28
  - number: '28.2'
    text: 'De voorziening voor afvalwater en faecaliën heeft ten minste één aansluitpunt:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel28
  - number: 28.2.a
    text: bij een opstelplaats voor het aanrecht;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel28
  - number: 28.2.b
    text: in een toiletruimte;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel28
  - number: 28.2.c
    text: in een badruimte, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel28
  - number: 28.2.d
    text: bij een opstelplaats voor wasapparatuur.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel28
  - number: '28.3'
    text: |-
      De voorziening voor afvalwater en faecaliën moet een capaciteit hebben die, bepaald overeenkomstig NEN 3215, ten
      minste gelijk is aan de in die norm aangegeven belasting van die voorziening en moet, bepaald overeenkomstig die
      norm, lucht- en waterdicht zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel28
  - number: '29.1'
    text: |-
      Het dak moet, ter voorkoming van een voor de gezondheid onaanvaardbare situatie bij de woning of het woongebouw,
      een voorziening hebben voor de opvang en afvoer van hemelwater, die kan worden aangesloten op het openbaar riool.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel29
  - number: '29.2'
    text: |-
      De voorziening voor hemelwater moet voor de opvang en afvoer van hemelwater een capaciteit hebben die, bepaald
      overeenkomstig NEN 3215, ten minste gelijk is aan de overeenkomstig die norm bepaalde belasting van die
      voorziening.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel29
  - number: '29.3'
    text: |-
      De voorziening voor hemelwater, voor zover die voorziening binnen de woning of het woongebouw is gelegen,
      moet, ter voorkoming van een voor de gezondheid onaanvaardbare situatie in de woning of het woongebouw, bepaald
      overeenkomstig NEN 3215, lucht- en waterdicht zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel29
  - number: '29.4'
    text: |-
      De voorziening voor hemelwater mag zijn samengevoegd met de voorziening voor afvalwater en faecaliën, tenzij de
      voorziening voor hemelwater kan worden aangesloten op het openbaar riool dat uitsluitend is bestemd voor de afvoer
      van hemelwater.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel29
  - number: '29.5'
    text: |-
      Indien toepassing is gegeven aan het vierde lid, moet de samengevoegde voorziening een capaciteit hebben die,
      bepaald overeenkomstig NEN 3215, ten minste gelijk is aan de overeenkomstig die norm bepaalde belasting van die
      voorziening.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel29
  - number: '30.1'
    text: |-
      In een verblijfsgebied, verblijfsruimte, toiletruimte en badruimte moet, ter beperking van het ontstaan van een
      voor de gezondheid nadelige kwaliteit van de binnenlucht, een voorziening aanwezig zijn voor de toevoer van verse
      lucht en de afvoer van binnenlucht.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel30
  - number: '30.2'
    text: |-
      De inrichting van de voorziening voor de toevoer van verse lucht en de afvoer van binnenlucht moet voldoen aan NEN
      1087, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel30
  - number: 30.2.a
    text: |-
      bij de bepaling van de richting van de luchtstroming, bouwwerken en daarmee gelijk te stellen belemmeringen die
      zich niet bevinden op het perceel waarop de woning of het woongebouw is gelegen, buiten beschouwing blijven, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel30
  - number: 30.2.b
    text: |-
      bij de bepaling van de ligging van een opening van de voorziening, voorzieningen voor de afvoer van rook en
      voorzieningen voor de afvoer van binnenlucht die zich niet bevinden op het perceel waarop de woning of het
      woningbouw is gelegen, en voorzieningen ten behoeve van de ontluchting van een voorziening voor afvalwater en
      faecaliën buiten beschouwing blijven.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel30
  - number: '30.3'
    text: |-
      Een opening van de voorziening voor de toevoer van verse lucht en de afvoer van binnenlucht moet zijn gelegen op
      een afstand van ten minste 2 m van de perceelsgrens, gemeten loodrecht op de uitwendige scheidingsconstructie van
      de woning of het woongebouw.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel30
  - number: '30.4'
    text: |-
      In afwijking van het derde lid, mag, indien het perceel waarop de woning of het woongebouw is gelegen, grenst aan
      een openbare weg, openbaar water of openbaar groen, de afstand zijn aangehouden tot het hart van die weg, dat water
      of dat groen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel30
  - number: '30.5'
    text: |-
      De voorziening voor de toevoer van verse lucht naar een verblijfsgebied en voor de afvoer van binnenlucht uit
      dat gebied moet, bepaald overeenkomstig NEN 1087, een capaciteit hebben van ten minste 0,9.10-3 m3/s per m2
      vloeroppervlakte van dat gebied, met een minimum van 7.10-3 m3/s.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel30
  - number: '30.6'
    text: |-
      Onverminderd het vijfde lid, moet, indien in het verblijfsgebied een opstelplaats voor een kooktoestel is gelegen,
      de capaciteit voor de toevoer van verse lucht naar dat gebied en de afvoer van binnenlucht uit dat gebied,
      bepaald overeenkomstig NEN 1087, ten minste 21.10-3 m3/s zijn, met dien verstande dat de afvoer van die capaciteit
      rechtstreeks naar buiten moet plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel30
  - number: '30.7'
    text: |-
      De toevoer van verse lucht, bedoeld in het vijfde en zesde lid, naar een in een woning gelegen verblijfsgebied moet
      plaatsvinden vanuit een ander in die woning gelegen verblijfsgebied, een tot de woning behorende verkeersruimte of
      van buiten, met dien verstande dat ten minste 50% van de in die leden bedoelde capaciteit voor de toevoer naar de
      in de woning gelegen verblijfsgebieden rechtstreeks van buiten moet plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel30
  - number: '30.8'
    text: |-
      De toevoer van verse lucht, bedoeld in het vijfde en zesde lid, naar een gemeenschappelijk verblijfsgebied van een
      woongebouw moet rechtstreeks van buiten plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel30
  - number: '30.9'
    text: |-
      De voorziening voor de toevoer van verse lucht naar een verblijfsruimte en voor de afvoer van binnenlucht uit die
      ruimte moet, bepaald overeenkomstig NEN 1087, een capaciteit hebben van ten minste 7.10-3 m3/s.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel30
  - number: '30.10'
    text: |-
      Onverminderd het negende lid, moet, indien zich in de verblijfsruimte een opstelplaats voor een kooktoestel
      bevindt, de capaciteit voor de toevoer van verse lucht naar die ruimte en de afvoer van binnenlucht uit die ruimte
      ten minste 21.10-3 m3/s zijn, met dien verstande dat de afvoer van die capaciteit rechtstreeks naar buiten moet
      plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel30
  - number: '30.11'
    text: |-
      De voorziening voor de toevoer van verse lucht en de afvoer van binnenlucht moet, bepaald overeenkomstig NEN 1087,
      een capaciteit hebben van ten minste:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel30
  - number: 30.11.a
    text: 7.10-3 m3/s voor een toiletruimte, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel30
  - number: 30.11.b
    text: 14.10-3 m3/s voor een al of niet met een toiletruimte samengevoegde badruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel30
  - number: '30.12'
    text: De afvoer van binnenlucht, bedoeld in het elfde lid, moet rechtstreeks naar buiten plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel30
  - number: '30.13'
    text: |-
      In het totaal van de uitwendige scheidingsconstructies van een woning moeten, opdat sterk verontreinigde
      binnenlucht snel kan worden afgevoerd, beweegbare constructie-onderdelen aanwezig zijn waarmee, bepaald
      overeenkomstig NEN 1087, in een verblijfsgebied een totale capaciteit voor de toevoer van buitenlucht en de afvoer
      van binnenlucht kan worden bewerkstelligd van ten minste 6.10-3 m3/s per m2 vloeroppervlakte van dat gebied.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel30
  - number: '30.14'
    text: |-
      Onverminderd het dertiende lid, moet in een verblijfsruimte een capaciteit voor de toevoer van buitenlucht en de
      afvoer van binnenlucht kunnen worden bewerkstelligd van ten minste 3.10-3 m3/s per m2 vloeroppervlakte van die
      ruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel30
  - number: '31.1'
    text: |-
      In een ruimte als bedoeld in het vijfde lid moet, ter beperking van het ontstaan van een voor de gezondheid
      nadelige kwaliteit van de binnenlucht, een voorziening voor de toevoer van verse lucht en de afvoer van binnenlucht
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel31
  - number: '31.2'
    text: |-
      De inrichting van de voorziening voor de toevoer van verse lucht en de afvoer van binnenlucht moet, wat de richting
      van de luchtstroming betreft, voldoen aan NEN 1087, met dien verstande dat bij de bepaling van die richting
      bouwwerken en daarmee gelijk te stellen belemmeringen die zich niet bevinden op het perceel waarop de woning of
      het woongebouw is gelegen, buiten beschouwing blijven. Op de inrichting van de voorziening voor de afvoer van
      binnenlucht van een opslagruimte voor afval is voorts van toepassing de eis voor de plaats van een opening, bedoeld
      in NEN 1087; daarbij blijven buiten beschouwing bouwwerken en daarmee gelijk te stellen belemmeringen, die op een
      aangrenzend perceel liggen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel31
  - number: '31.3'
    text: |-
      Een opening de voorziening voor de toevoer van verse lucht en de afvoer van binnenlucht moet zijn gelegen op een
      afstand van ten minste 2 m van de perceelsgrens, gemeten loodrecht op de uitwendige scheidingsconstructie van de
      woning of het woongebouw.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel31
  - number: '31.4'
    text: |-
      In afwijking van het derde lid, mag, indien het perceel waarop de woning of het woongebouw is gelegen, grenst aan
      een openbare weg, openbaar water of openbaar groen, de afstand zijn aangehouden tot het hart van die weg, dat water
      of dat groen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel31
  - number: '31.5'
    text: |-
      De voorziening voor de toevoer van verse lucht en de afvoer van binnenlucht moet, bepaald overeenkomstig NEN 1087,
      een capaciteit hebben van ten minste:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel31
  - number: 31.5.a
    text: |-
      0,7.10-3 m3/s per m2 vrije vloeroppervlakte van een besloten gemeenschappelijke verkeersruimte, gemeten over de ten
      minste vereiste breedte van die ruimte;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel31
  - number: 31.5.b
    text: 6.10-3 m3/s per m2 vrije vloeroppervlakte van een liftkooi;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel31
  - number: 31.5.c
    text: 0,1 m3/s voor een besloten opslagruimte voor afval met een netto-inhoud van meer dan 3 m3, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel31
  - number: 31.5.d
    text: 2.10-3 m3/s per m3 netto-inhoud voor een meterruimte, met een minimum van 2.10-3 m3/s.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel31
  - number: '31.6'
    text: |-
      De toevoer van verse lucht naar een gemeenschappelijke verkeersruimte of een besloten opslagruimte voor afval met
      een netto-inhoud van meer dan 3 m3, moet rechtstreeks van buiten plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel31
  - number: '31.7'
    text: |-
      De afvoer van binnenlucht uit een gemeenschappelijke verkeersruimte of een besloten opslagruimte voor afval met een
      netto-inhoud van meer dan 3 m3 moet rechtstreeks naar buiten plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel31
  - number: '31.8'
    text: |-
      De toevoer van verse lucht naar de kooi van een brandweerlift en de afvoer van binnenlucht uit die kooi moeten
      plaatsvinden vanuit respectievelijk naar de liftschacht.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel31
  - number: '31.9'
    text: |-
      De toevoer van verse lucht naar de liftschacht, bedoeld in het achtste lid, en de afvoer van binnenlucht uit die
      schacht mogen niet vanuit respectievelijk naar een andere binnen de woning of het woongebouw gelegen besloten
      ruimte plaatsvinden, tenzij die ruimte een gemeenschappelijke verkeersruimte is, waarin een trap is gelegen die is
      bestemd voor het ontsluiten van in het woongebouw gelegen woningen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel31
  - number: '32.1'
    text: |-
      In een woning of woongebouw moet, ter voorkoming van een onaanvaardbare ophoping van vergiftige of hinderlijke
      gassen, ten behoeve van een opstelplaats voor een verbrandingstoestel, niet zijnde een kooktoestel met een nominale
      belasting als bedoeld in NEN 2757 van niet meer dan 15 kW, een voorziening voor de toevoer van verbrandingslucht en
      de afvoer van rook aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel32
  - number: '32.2'
    text: |-
      De voorziening voor de toevoer van verbrandingslucht en de afvoer van rook moet, wat de toevoer van
      verbrandingslucht betreft, bepaald overeenkomstig NEN 1087, en, wat de afvoer van rook betreft, bepaald
      overeenkomstig NEN 2757, een in NEN 2757 aangegeven capaciteit hebben.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel32
  - number: '32.3'
    text: |-
      Onverminderd het tweede lid, moet bij een verbrandingstoestel met een nominale belasting als bedoeld in NEN 2757
      van meer dan 130 kW, de voorziening voor de toevoer van verbrandingslucht en de afvoer van rook zodanig zijn, dat
      de toe- en afvoer met een op dat toestel afgestemde capaciteit plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel32
  - number: '32.4'
    text: 'Onverminderd het tweede of derde lid, moet, tenzij artikel 9, vijfde lid, van toepassing is, ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel32
  - number: 32.4.a
    text: |-
      de opstelplaats voor een kooktoestel, bedoeld in artikel 53 of 62, zijn uitgegaan van een op gas gestookt toestel
      met een belasting van ten minste 2 kW;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel32
  - number: 32.4.b
    text: |-
      de opstelplaats voor een stooktoestel, bedoeld in artikel 55 of 64, zijn uitgegaan van een op gas gestookt toestel
      met een belasting van ten minste 30 W per m2 gebruiksoppervlakte van de woning of van de op dat toestel aangewezen
      woningen in een woongebouw met een minimum van 6 kW per opstelplaats, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel32
  - number: 32.4.c
    text: |-
      de opstelplaats voor een warmwatertoestel, bedoeld in artikel 56 of 65, zijn uitgegaan van een op gas gestookt
      toestel met een belasting van ten minste 20 W per m2 gebruiksoppervlakte van de woning of van de op dat toestel
      aangewezen woningen in een woongebouw met een minimum van 6 kW per opstelplaats.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel32
  - number: '32.5'
    text: |-
      In afwijking in zoverre van het vierde lid, mag, indien het warmwatertoestel is samengevoegd met het stooktoestel,
      zijn uitgegaan van een belasting van dat samengevoegde toestel van ten minste 30 W per m2 gebruiksoppervlakte van
      de woning, met een minimum van 6 kW per opstelplaats.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel32
  - number: '32.6'
    text: |-
      De inrichting van een voorziening voor de toevoer van verbrandingslucht en de afvoer van rook, voor zover die
      voorziening is bestemd voor de toevoer van verbrandingslucht, moet, indien die toevoer rechtstreeks van buiten
      plaatsvindt, ten minste voldoen aan NEN 2757, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel32
  - number: 32.6.a
    text: |-
      bij de bepaling van de richting van de luchtstroming, bouwwerken en daarmee gelijk te stellen belemmeringen die
      zich niet bevinden op het perceel waarop de woning of het woongebouw is gelegen, buiten beschouwing blijven, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel32
  - number: 32.6.b
    text: |-
      bij de bepaling van de ligging van een opening van de voorziening, voorzieningen voor de afvoer van rook en
      voorzieningen voor de afvoer van binnenlucht die zich niet bevinden op het perceel waarop de woning of het
      woongebouw is gelegen, en voorzieningen ten behoeve van de ontluchting van een voorziening voor afvalwater en
      faecaliën buiten beschouwing blijven.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel32
  - number: '32.7'
    text: |-
      De opening van een voorziening voor de toevoer van verbrandingslucht en de afvoer van rook, voor zover die opening
      is bestemd voor de toevoer van verbrandingslucht, moet zijn gelegen op een afstand van ten minste 2 m van de
      perceelsgrens, gemeten loodrecht op de uitwendige scheidingsconstructie van de woning of het woongebouw.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel32
  - number: '32.8'
    text: |-
      In afwijking van het zevende lid, mag, indien het perceel waarop de woning of het woongebouw is gelegen, grenst aan
      een openbare weg, openbaar water of openbaar groen, de afstand zijn aangehouden tot het hart van die weg, dat water
      of dat groen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel32
  - number: '32.9'
    text: |-
      De inrichting van een voorziening voor de toevoer van verbrandingslucht en de afvoer van rook, voor zover die
      voorziening is bestemd voor de afvoer van rook, moet ten minste voldoen aan NEN 2757, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel32
  - number: 32.9.a
    text: |-
      bij de bepaling van de plaats van de uitmonding van die voorziening in een uitwendige scheidingsconstructie, niet
      zijnde het dak, tussen die uitmonding en de perceelsgrens, langszij gemeten, een afstand moet zijn aangehouden van
      ten minste 1 m en, gemeten loodrecht op de uitwendige scheidingsconstructie, van ten minste 2 m, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel32
  - number: 32.9.b
    text: |-
      bij de bepaling van de plaats van de uitmonding van die voorziening, bouwwerken en daarmee gelijk te stellen
      belemmeringen die zich niet bevinden op het perceel waarop de woning of het woongebouw is gelegen, buiten
      beschouwing blijven.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel32
  - number: '32.10'
    text: |-
      In afwijking van het negende lid, onderdeel *a*, mag, indien het perceel waarop de woning of het woongebouw is
      gelegen, grenst aan een openbare weg, openbaar water of openbaar groen, de afstand zijn aangehouden tot het hart
      van die weg, dat water of dat groen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel32
  - number: '32.11'
    text: |-
      Indien toepassing is gegeven aan het negende lid, aanhef en onderdeel *b*, moet de voorziening voor de toevoer van
      verbrandingslucht en de afvoer van rook, voor zover die voorziening is bestemd voor natuurlijke afvoer van rook,
      ter voorkoming van het terugstromen van die rook, zijn voorzien van een goed functionerende kap.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel32
  - number: '33'
    text: |-
      Bij ministeriële regeling kunnen, ter beperking van de aanwezigheid in of bij een woning of woongebouw van een
      voor de gezondheid onaanvaardbare mate van vergiftige of hinderlijke stoffen of van ioniserende stralen als bedoeld
      in [artikel 1, eerste lid, onderdeel ][ref1] (*Stb.* 1963, 82), voorschriften worden gegeven omtrent het in de
      constructie toepassen van materialen waaruit die stoffen kunnen vrijkomen of die stralen kunnen ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel1
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '1'
  - number: '34'
    text: |-
      Bij ministeriële regeling kunnen, ter beperking van blootstelling van gebruikers van een woning of woongebouw
      aan uit de grond afkomstige schadelijke stoffen of straling, voorschriften worden gegeven waaraan een uitwendige
      scheidingsconstructie die de scheiding vormt met de grond, alsmede een constructie die de scheiding vormt tussen
      een woning of woongebouw en de kruipruimte, met inbegrip van de op die constructie aansluitende delen van andere
      constructies, voor zover die delen van invloed zijn op het voldoen van die constructie aan dit artikel, moeten
      voldoen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel34
  - number: '35.1'
    text: |-
      In een uitwendige scheidingsconstructie mogen zich, ter beperking van het in de woning of het woongebouw kunnen
      binnendringen van ratten en muizen, geen onafsluitbare openingen bevinden die breder zijn dan 0,01 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel35
  - number: '35.2'
    text: |-
      Het eerste lid is niet van toepassing op een opening die aan de bovenkant de uitmonding vormt van een verticaal
      kanaal.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel35
  - number: '35.3'
    text: |-
      Onder een woning of woongebouw moet ter plaatse van de uitwendige scheidingsconstructie tot een diepte van ten
      minste 0,6 m, gemeten vanaf het aansluitende terrein, een scherm aanwezig zijn waarin zich geen openingen bevinden
      die breder zijn dan 0,01 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel35
  - number: '36.1'
    text: |-
      In een woning of woongebouw moet, opdat kan worden beschikt over voor de menselijke consumptie en hygiëne geschikt
      water, een voorziening voor drinkwater aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel36
  - number: '36.2'
    text: |-
      De inrichting van een voorziening voor drinkwater moet ten minste voldoen aan artikel 5, eerste lid, onderdeel
      2, van de Model-aansluitvoorwaarden voor drinkwater van de Vereniging van Exploitanten van Waterleidingbedrijven
      in Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel36
  - number: '37.1'
    text: |-
      De voorziening voor drinkwater, bedoeld in artikel 36, eerste lid, moet, opdat drinkwater kan worden betrokken,
      in de meterruimte, bedoeld in artikel 50, of, indien toepassing is gegeven aan artikel 58, 59, 62, 63 of 65,
      in de meterruimte, bedoeld in artikel 61, ten minste één aansluitmogelijkheid hebben voor aansluiting op het
      distributienet van drinkwater.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel37
  - number: '37.2'
    text: |-
      De voorziening voor drinkwater heeft, opdat op die voorziening watertoestellen kunnen worden aangesloten, voorts
      ten minste één aansluitpunt:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel37
  - number: 37.2.a
    text: bij een opstelplaats voor het aanrecht;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel37
  - number: 37.2.b
    text: in een toiletruimte;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel37
  - number: 37.2.c
    text: in een badruimte;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel37
  - number: 37.2.d
    text: bij een opstelplaats voor wasapparatuur;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel37
  - number: 37.2.e
    text: bij een opstelplaats voor een warmwatertoestel, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel37
  - number: 37.2.f
    text: bij een brandslanghaspel.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel37
  - number: '38.1'
    text: |-
      In een woning of woongebouw, moet, opdat kan worden beschikt over voor de menselijke hygiëne geschikt warm
      water, een voorziening voor warm water aanwezig zijn, waarvan de inrichting ten minste voldoet aan artikel 5,
      eerste lid, onderdeel 2, van de Model-aansluitvoorwaarden voor drinkwater van de Vereniging van Exploitanten van
      Waterleidingbedrijven in Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel38
  - number: '38.2'
    text: |-
      De warmwatervoorziening moet, opdat voor de menselijke hygiëne geschikt warm water kan worden betrokken, ter
      plaatse van de opstelplaats voor een warmwatertoestel, bedoeld in artikel 56 of 65, ten minste één aansluitpunt
      hebben voor aansluiting van dat toestel op die voorziening.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel38
  - number: '38.3'
    text: De warmwatervoorziening heeft voorts ten minste één aansluitpunt in de badruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel38
  - number: '39.1'
    text: |-
      In het totaal van de uitwendige scheidingsconstructies van een verblijfsgebied moet, met het oog op de toetreding
      van daglicht en het uitzicht naar buiten, een equivalente daglichtoppervlakte als bedoeld in NEN 2057, aanwezig
      zijn, die, bepaald overeenkomstig die norm, ten minste gelijk is aan 10% van de vloeroppervlakte van het
      verblijfsgebied.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel39
  - number: '39.2'
    text: |-
      In het totaal van de uitwendige scheidingsconstructies van een verblijfsruimte moet, bepaald overeenkomstig NEN
      2057, een equivalente daglichtoppervlakte als bedoeld in die norm, van ten minste 0,5 m2 aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel39
  - number: '39.3'
    text: |-
      Bij de bepaling van de in het eerste en tweede lid bedoelde equivalente daglichtoppervlakte blijven bouwwerken en
      daarmee gelijk te stellen belemmeringen die zich niet bevinden op het perceel waarop de woning of het woongebouw is
      gelegen, en daglichtopeningen in een uitwendige scheidingsconstructie, voor zover die openingen, gemeten loodrecht
      op die openingen, zijn gelegen op een afstand van minder dan 2 m van de perceelsgrens, buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel39
  - number: '39.4'
    text: |-
      In afwijking in zoverre van het derde lid, mag, indien het perceel waarop de woning of het woongebouw is gelegen,
      grenst aan een openbare weg, openbaar water of openbaar groen, de afstand zijn aangehouden tot het hart van die
      weg, dat water of dat groen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel39
  - number: '39.5'
    text: |-
      Bij de bepaling van de in het eerste en tweede lid bedoelde equivalente daglichtoppervlakte moet de in rekening te
      brengen belemmeringshoek , bedoeld in NEN 2057, ten minste 25° zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel39
  - number: '39.6'
    text: |-
      In afwijking in zoverre van het eerste of tweede lid, mag de equivalente daglichtoppervlakte zich bevinden in een
      inwendige scheidingsconstructie van een verblijfsgebied of verblijfsruimte, indien die inwendige constructie niet
      de scheiding vormt met een ander verblijfsgebied of met een toiletruimte, badruimte of bergruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel39
  - number: '40.1'
    text: |-
      Indien niet is voldaan aan enig voorschrift, gegeven bij of krachtens de artikelen 22 tot en met 39, moet een
      woning of woongebouw een mate van bescherming van de gezondheid bieden, die ten minste gelijk is aan de mate van
      bescherming die is beoogd met het desbetreffende bij of krachtens die artikelen gegeven voorschrift.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel40
  - number: '40.2'
    text: |-
      Indien toepassing is gegeven aan het eerste lid en het desbetreffende voorschrift tevens valt te herleiden tot
      overwegingen van veiligheid, bruikbaarheid of energiezuinigheid, moeten die overwegingen daarbij in ten minste
      dezelfde mate in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel40
  - number: '41.1'
    text: |-
      Een toegang van een woning of woongebouw, een verblijfsgebied, een verblijfs-, toilet-, en badruimte, de
      bergruimte, de gemeenschappelijke opslagruimte voor huishoudelijk afval, een gemeenschappelijk verblijfsgebied, een
      gemeenschappelijke verblijfsruimte, een gemeenschappelijke verkeersruimte en van een lift, heeft, met het oog op de
      toegankelijkheid, een vrije doorgang met een breedte van ten minste 0,85 m en een hoogte van ten minste 2,1 m boven
      die breedte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel41
  - number: '41.2'
    text: |-
      Een verkeersruimte heeft een vrije vloeroppervlakte met een breedte van ten minste 0,85 m. Voor een
      gemeenschappelijke verkeersruimte is de breedte ten minste 1,1 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel41
  - number: '41.3'
    text: |-
      In een woongebouw is ter plaatse van de toegang van dat gebouw en ter plaatse van de toegang van een lift een vrije
      vloeroppervlakte gelegen met een breedte van ten minste 1,5 m en een lengte van ten minste 1,5 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel41
  - number: '41.4'
    text: |-
      Een gemeenschappelijke verkeersruimte heeft, opdat rolstoelgebruikers kunnen keren, ten minste één vrije
      vloeroppervlakte met een breedte van ten minste 1,5 m en een lengte van 1,5 m. Deze eis geldt niet, indien een
      rolstoelgebruiker vanaf die verkeersruimte zonder te behoeven keren het aansluitende terrein kan bereiken.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel41
  - number: '42.1'
    text: |-
      Het hoogteverschil tussen ten minste één toegang van een woning en van een woongebouw en het aansluitende terrein
      of de vloer van een gemeenschappelijke verkeersruimte is, opdat die woning mede door rolstoelgebruikers kan
      worden binnengegaan en verlaten, ten hoogste 0,02 m. Het hoogteverschil tussen een vloer van een woning of van een
      woongebouw en de buitenruimte is ten hoogste 0,02 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel42
  - number: '42.2'
    text: |-
      In of bij een woongebouw waarin de toegang van een woning hoger ligt dan 3 m boven de vloer ter plaatse van
      de toegang van het woongebouw, is op elke bouwlaag van dat gebouw een opstelplaats voor een lift aanwezig. De
      oppervlakte van deze opstelplaats is afgestemd op het kunnen plaatsen van een lift met een vrije vloeroppervlakte
      van ten minste 1,05 m x 2,05 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel42
  - number: '42.3'
    text: |-
      Een hoogteverschil tussen de toegang van een woning, gelegen in een woongebouw, en ten minste één toegang van het
      gebouw is, onverminderd artikel 4, overbrugd door een lift, indien: a. de vloer van een verblijfsgebied hoger is
      gelegen dan 12,5 m boven het aansluitende terrein, gemeten ter plaatse van de toegang van het woongebouw, of b. het
      woongebouw een gebruiksoppervlakte heeft van meer dan 3.500 m2 die hoger ligt dan 1,5 m boven de vloer ter plaatse
      van de toegang van het woongebouw. In het woongebouw mag de afstand tussen de toegang van de lift en de toegang van
      een op die lift aangewezen, op dezelfde bouwlaag gelegen woning, gemeten langs de kortste route, niet groter zijn
      dan 90 m. De kooi van de lift heeft een vrije vloeroppervlakte van ten minste 1,05 m x 2,05 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel42
  - number: '42.4'
    text: |-
      In een woongebouw met een lift mag geen groter hoogteverschil dan 0,02 m aanwezig zijn tussen de vloer van een
      gemeenschappelijke verkeersruimte en de vloer van:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel42
  - number: 42.4.a
    text: een liftkooi;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel42
  - number: 42.4.b
    text: |-
      een andere gemeenschappelijke verkeersruimte, indien door die verkeersruimten vanaf de toegang van het woongebouw
      of vanaf de toegang van een woning de lift kan worden bereikt, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel42
  - number: 42.4.c
    text: een gemeenschappelijke toiletruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel42
  - number: '43.1'
    text: |-
      In een woning met een gebruiksoppervlakte van meer dan 500 m2 moet, opdat die woning mede door rolstoelgebruikers
      kan worden gebruikt, ten minste 35% van het verblijfsgebied zijn gelegen in een gedeelte van de woning dat
      rechtstreeks bereikbaar is vanaf het aansluitende terrein.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel43
  - number: '43.2'
    text: |-
      Een verkeersruimte in het in het eerste lid bedoelde gedeelte van de woning moet een vrije vloeroppervlakte hebben
      met een breedte van ten minste 1,4 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel43
  - number: '43.3'
    text: |-
      Een toegang van een ruimte, gelegen in het in het eerste lid bedoelde gedeelte van de woning, moet een vrije
      doorgang hebben met een breedte van ten minste 0,85 m en een hoogte van ten minste 2,1 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel43
  - number: '43.4'
    text: |-
      In het in het eerste lid bedoelde gedeelte van de woning moeten ten minste één toiletruimte en ten minste één
      badruimte zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel43
  - number: '43.5'
    text: |-
      Het hoogteverschil tussen ten minste één toegang van het in het eerste lid bedoelde gedeelte van de woning en het
      aansluitende terrein mag niet groter zijn dan 1 m en moet, tenzij het hoogteverschil niet groter is dan 0,02 m,
      zijn overbrugd door een hellingbaan als bedoeld in artikel 6.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel43
  - number: '43.6'
    text: |-
      Hoogteverschillen van meer dan 0,02 m tussen de vloeren van ruimten, gelegen in het in het eerste lid bedoelde
      gedeelte van de woning, moeten zijn overbrugd door een hellingbaan als bedoeld in artikel 6, of een lift, waarvan
      de vrije vloeroppervlakte ten minste 1,05 m * 1,35 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel43
  - number: '44.1'
    text: |-
      In een woning moet, opdat daarin voor het wonen kenmerkende activiteiten kunnen plaatsvinden, ten minste 55% van de
      gebruiksoppervlakte, met een minimum van 24 m2, in een of meer verblijfsgebieden zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel44
  - number: '44.2'
    text: |-
      Een verblijfsgebied moet een vloeroppervlakte hebben van ten minste 5 m2, waarvan de breedte ten minste 1,8 m en de
      hoogte boven die oppervlakte ten minste 2,4 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel44
  - number: '44.3'
    text: |-
      Een verblijfsgebied moet vanaf de toegang van de woning bereikbaar zijn zonder dat een toiletruimte, badruimte,
      bergruimte of technische ruimte behoeft te worden betreden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel44
  - number: '45.1'
    text: 'Een woning mag, opdat wordt voorkomen dat zij door indeling in afzonderlijke ruimten minder bruikbaar is:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel45
  - number: 45.1.a
    text: |-
      ten hoogste één afzonderlijke verblijfsruimte hebben, indien in de woning het verblijfsgebied een vloeroppervlakte
      heeft van minder dan 30 m2;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel45
  - number: 45.1.b
    text: |-
      ten hoogste twee afzonderlijke verblijfsruimten hebben, indien in de woning het verblijfsgebied een
      vloeroppervlakte heeft van ten minste 30 m2 doch minder dan 37 m2, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel45
  - number: 45.1.c
    text: |-
      meer dan twee afzonderlijke verblijfsruimten hebben, indien in de woning het verblijfsgebied een vloeroppervlakte
      heeft van 37 m2 of meer, met dien verstande dat bij die 37 m2 dan wel voor elke 7 m2 meer aan vloeroppervlakte, het
      aantal afzonderlijke verblijfsruimten met één mag zijn vermeerderd.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel45
  - number: '45.2'
    text: |-
      Een verblijfsruimte moet een vloeroppervlakte hebben van ten minste 5 m2, waarvan de breedte ten minste 1,8 m en de
      hoogte boven die oppervlakte ten minste 2,4 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel45
  - number: '45.3'
    text: |-
      In afwijking in zoverre van het tweede lid, moet ten minste één in de woning gelegen verblijfsruimte een
      vloeroppervlakte hebben van:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel45
  - number: 45.3.a
    text: ten minste 3,3 m * 3,3 m, indien de gebruiksoppervlakte van de woning kleiner is dan 50 m2, of
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel45
  - number: 45.3.b
    text: ten minste 3,6 m * 3,6 m, indien de gebruiksoppervlakte van de woning 50 m2 of meer is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel45
  - number: '46.1'
    text: |-
      In een woning moet, opdat daarin sanitaire handelingen kunnen worden verricht, voor elke gebruiksoppervlakte van
      125 m2 of gedeelte daarvan, ten minste één afsluitbare toiletruimte aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel46
  - number: '46.2'
    text: |-
      De toiletruimte heeft een vloeroppervlakte van ten minste 0,9 m x ten minste 1,2 m, boven welke oppervlakte de
      hoogte ten minste 2,1 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel46
  - number: '46.3'
    text: |-
      In afwijking in zoverre van het tweede lid, moet de toiletruimte, bedoeld in artikel 43, vierde lid, een
      vloeroppervlakte hebben van ten minste 2,2 m * 2,2 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel46
  - number: '47.1'
    text: In een woning moet, met het oog op het zich kunnen wassen, ten minste één afsluitbare badruimte aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel47
  - number: '47.2'
    text: |-
      In afwijking in zoverre van het eerste lid, moet in een woning met een gebruiksoppervlakte van meer dan 500 m2,
      voor elke gebruiksoppervlakte van 250 m2 of gedeelte daarvan, ten minste één badruimte aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel47
  - number: '47.3'
    text: |-
      De badruimte, bedoeld in het eerste en tweede lid, moet een vloeroppervlakte hebben van ten minste 1,6 m2, waarvan
      de breedte ten minste 0,8 m en de hoogte boven die oppervlakte ten minste 2,1 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel47
  - number: '47.4'
    text: |-
      In afwijking in zoverre van het derde lid, moet de badruimte, bedoeld in artikel 43, vierde lid, een
      vloeroppervlakte hebben van ten minste 2,2 m * 2,2 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel47
  - number: '47.5'
    text: |-
      Een badruimte, behoudens die, bedoeld in het vierde lid, mag, met het oog op een doelmatige benutting van de
      gebruiksoppervlakte van de woning, zijn samengevoegd met een toiletruimte, behoudens die, bedoeld in artikel 43,
      vierde lid, mits de vloeroppervlakte van die samengevoegde ruimte ten minste 2,6 m2 is, waarvan de breedte ten
      minste 0,8 m en de hoogte boven die oppervlakte ten minste 2,1 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel47
  - number: '48.1'
    text: |-
      Tot een woning moet, opdat voorwerpen beschermd tegen weer en wind kunnen worden opgeborgen, ten minste één, van
      buiten de woning toegankelijke, afsluitbare bergruimte behoren, waarvan de vloeroppervlakte ten minste 6,5% van de
      gebruiksoppervlakte van de woning is, met een minimum van 3,5 m2, van welke vloeroppervlakte de breedte ten minste
      1,5 m en de hoogte boven die oppervlakte ten minste 2,1 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel48
  - number: '48.2'
    text: |-
      Een uitwendige scheidingsconstructie van de bergruimte, bedoeld in het eerste lid, moet, ter beperking van het
      kunnen binnendringen van vocht in die ruimte, bepaald overeenkomstig NEN 2778, ten minste regenwerend zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel48
  - number: '49.1'
    text: |-
      Tot een woning moet, opdat in de buitenlucht voor het wonen kenmerkende activiteiten kunnen worden verricht, een
      niet-besloten, rechtstreeks vanuit de woning bereikbare ruimte (buitenruimte), niet zijnde een gemeenschappelijke
      verkeersruimte, behoren.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel49
  - number: '49.2'
    text: |-
      De buitenruimte, bedoeld in het eerste lid, moet een vrije vloeroppervlakte hebben van ten minste 5% van de
      gebruiksoppervlakte van de woning, met een minimum van 3 m2, van welke vloeroppervlakte de breedte ten minste 1,3
      m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel49
  - number: '50.1'
    text: |-
      Tot een woning moet, opdat de centrale schakel-, verdeel- en meetapparatuur voor elektriciteit, gas, water,
      telecommunicatiesignalen en, voor zover van toepassing, stadsverwarming kan worden geplaatst, een afsluitbare
      meterruimte behoren die wat afmetingen, indeling en leidingdoorvoeren betreft, ten minste voldoet aan NEN 2768.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel50
  - number: '50.2'
    text: |-
      Een uitwendige scheidingsconstructie van een meterruimte moet, ter beperking van het kunnen binnendringen van vocht
      in die ruimte, bepaald overeenkomstig NEN 2778, ten minste regenwerend zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel50
  - number: '50.3'
    text: |-
      De meterruimte, bedoeld in het eerste lid, mag, ter bescherming van de persoonlijke levenssfeer, niet rechtstreeks
      toegankelijk zijn vanuit een verblijfsruimte, toiletruimte of badruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel50
  - number: '50.4'
    text: |-
      De meterruimte, bedoeld in het eerste lid, mag, gemeten langs de kortste route, niet zijn gelegen op een grotere
      afstand dan 3 m vanaf de toegang van de woning, tenzij die ruimte vanaf een toegang van het woongebouw uitsluitend
      bereikbaar is door een of meer gemeenschappelijke verkeersruimten.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel50
  - number: '51.1'
    text: |-
      In een woning of woongebouw waarin een lift aanwezig is, moet, met het oog op het doelmatig functioneren van die
      lift, een besloten ruimte (liftschacht) aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel51
  - number: '51.2'
    text: Een uitwendige scheidingsconstructie van een liftschacht moet, bepaald overeenkomstig NEN 2778, waterdicht zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel51
  - number: '51.3'
    text: 'De vloer van een liftschacht mag niet hoger zijn gelegen dan:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel51
  - number: 51.3.a
    text: |-
      1,4 m onder de vloer ter plaatse van de laagstgelegen vloer waartoe de lift toegang geeft, indien het
      hoogteverschil tussen de laagste en hoogste vloer waartoe de lift toegang geeft niet groter is dan 50 m, of
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel51
  - number: 51.3.b
    text: |-
      1,6 m onder de vloer ter plaatse van de laagstgelegen vloer waartoe de lift toegang geeft, indien het
      hoogteverschil tussen de laagste en hoogste vloer waartoe de lift toegang geeft groter is dan 50 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel51
  - number: '51.4'
    text: 'Het plafond van een liftschacht mag niet lager zijn gelegen dan:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel51
  - number: 51.4.a
    text: |-
      3,6 m boven de vloer ter plaatse van de hoogstgelegen vloer waartoe de lift toegang geeft, indien het
      hoogteverschil tussen de hoogste en laagste vloer waartoe de lift toegang geeft niet groter is dan 50 m, of
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel51
  - number: 51.4.b
    text: |-
      3,8 m boven de vloer ter plaatse van de hoogstgelegen vloer waartoe de lift toegang geeft, indien het
      hoogteverschil tussen de hoogste en laagste vloer waartoe de lift toegang geeft groter is dan 50 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel51
  - number: '51.5'
    text: |-
      In de liftschacht mogen geen leidingen of installaties aanwezig zijn die niet voor de werking of veiligheid van de
      lift vereist zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel51
  - number: '52.1'
    text: |-
      In een woning of woongebouw waarin een lift aanwezig is, moet, opdat liftapparatuur kan worden geplaatst, een
      besloten ruimte (liftmachineruimte) aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel52
  - number: '52.2'
    text: |-
      Een uitwendige scheidingsconstructie van een liftmachineruimte moet, ter beperking van het kunnen binnendringen van
      vocht in die ruimte, bepaald overeenkomstig NEN 2778, ten minste regenwerend zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel52
  - number: '52.3'
    text: |-
      Een liftmachineruimte moet een op de omvang van de in die ruimte te plaatsen apparatuur afgestemde vloeroppervlakte
      hebben.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel52
  - number: '52.4'
    text: |-
      Een liftmachineruimte in een woongebouw mag, met het oog op het onbelemmerd kunnen bereiken van die ruimte, vanaf
      een toegang van het woongebouw uitsluitend bereikbaar zijn door een of meer gemeenschappelijke verkeersruimten.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel52
  - number: '53.1'
    text: |-
      Ten minste één verblijfsruimte van een woning heeft, opdat spijzen kunnen worden bereid, een opstelplaats voor een
      aanrecht en een opstelplaats voor een kooktoestel.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel53
  - number: '53.2'
    text: De opstelplaats voor het aanrecht heeft een vloeroppervlakte van ten minste 1,5 m x 0,6 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel53
  - number: '53.3'
    text: |-
      De opstelplaats voor een kooktoestel, bedoeld in het eerste lid, moet een vloeroppervlakte hebben van ten minste
      0,6 m * 0,6 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel53
  - number: '53.4'
    text: |-
      Indien de opstelplaats voor het aanrecht en de opstelplaats voor het kooktoestel liggen in de verblijfsruimte
      met de vloeroppervlakte van ten minste 3,3 m x 3,3 m of met de vloeroppervlakte van ten minste 3,6 m x 3,6 m, is
      de afstand tussen de opstelplaats voor het aanrecht of de opstelplaats voor het kooktoestel en de rand van die
      vloeroppervlakte, gemeten loodrecht op de voorkant van de opstelplaatsen, ten minste 0,6 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel53
  - number: '54.1'
    text: |-
      In een woning moet, opdat kleding en linnengoed kunnen worden gewassen, ten minste één opstelplaats voor
      wasapparatuur aanwezig zijn, die niet in een verblijfsgebied mag zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel54
  - number: '54.2'
    text: |-
      In afwijking van het eerste lid, mag de opstelplaats voor wasapparatuur in de bergruimte, bedoeld in artikel 48,
      zijn gelegen, mits die bergruimte rechtstreeks vanuit de woning toegankelijk is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel54
  - number: '54.3'
    text: |-
      De opstelplaats, bedoeld in het eerste of tweede lid, moet een vloeroppervlakte hebben van ten minste 1 m2, waarvan
      de breedte ten minste 0,8 m en de hoogte boven die oppervlakte ten minste 2,1 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel54
  - number: '54.4'
    text: |-
      Indien de opstelplaats, bedoeld in het eerste of tweede lid, is gelegen in de toiletruimte, badruimte of
      bergruimte, bedoeld in onderscheidenlijk de artikelen 46, 47 of 48, moet de ingevolge die artikelen vereiste
      vloeroppervlakte van die ruimte zijn vermeerderd met ten minste 1 m2.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel54
  - number: '55.1'
    text: |-
      In een woning moet, opdat verwarmingsapparatuur kan worden geplaatst, ten minste één opstelplaats voor een
      stooktoestel aanwezig zijn, die niet mag zijn gelegen in een toiletruimte of badruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel55
  - number: '55.2'
    text: |-
      In afwijking van het eerste lid, mag de opstelplaats voor een stooktoestel zijn gelegen in de bergruimte, bedoeld
      in artikel 48, mits die bergruimte rechtstreeks vanuit de woning toegankelijk is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel55
  - number: '55.3'
    text: |-
      In afwijking in zoverre van het eerste lid, moet een opstelplaats die is bestemd voor de plaatsing van een of meer
      stooktoestellen met een totale nominale belasting als bedoeld in NEN 2757 van meer dan 130 kW, zijn gelegen in een
      afzonderlijke besloten ruimte (stookruimte).
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel55
  - number: '55.4'
    text: |-
      Het eerste lid is niet van toepassing, indien de woning kan worden aangesloten op het distributienet van de
      stadsverwarming of op een andere voorziening die is bestemd voor de verwarming van meer dan één woning.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel55
  - number: '56.1'
    text: |-
      In een woning moet, opdat apparatuur voor het opwarmen van water kan worden geplaatst, ten minste één opstelplaats
      voor een warmwatertoestel zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel56
  - number: '56.2'
    text: |-
      In afwijking van het eerste lid, mag de opstelplaats voor een warmwatertoestel zijn gelegen in de bergruimte,
      bedoeld in artikel 48, mits die bergruimte rechtstreeks vanuit de woning toegankelijk is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel56
  - number: '56.3'
    text: Het eerste lid is niet van toepassing, indien het warmwatertoestel is samengevoegd met een stooktoestel.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel56
  - number: '57.1'
    text: |-
      In afwijking in zoverre van artikel 44, mag ten hoogste 35% van de vloeroppervlakte van het totaal aan
      verblijfsgebieden van de in een woongebouw gelegen woningen deel uitmaken van een of meer in dat woongebouw gelegen
      gemeenschappelijke verblijfsgebieden, mits:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel57
  - number: 57.1.a
    text: |-
      in het totaal aan verblijfsgebied van elke afzonderlijke woning ten minste 18 m2 aan vloeroppervlakte aanwezig
      is, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel57
  - number: 57.1.b
    text: |-
      het verschil tussen 24 m2 aan in het totaal aan verblijfsgebied gelegen vloeroppervlakte en de in de woning
      aanwezige, in het totaal aan verblijfsgebied gelegen vloeroppervlakte, voor zover laatstbedoelde vloeroppervlakte
      kleiner is dan 24 m2, deel uitmaakt van een in een gemeenschappelijk verblijfsgebied gelegen vloeroppervlakte van
      ten minste 18 m2.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel57
  - number: '57.2'
    text: |-
      Een gemeenschappelijk verblijfsgebied mag, opdat dat gebied onbelemmerd en beschut kan worden bereikt, vanaf
      de toegangen van de op dat gebied aangewezen woningen uitsluitend bereikbaar zijn door een of meer besloten
      gemeenschappelijke verkeersruimten.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel57
  - number: '58.1'
    text: |-
      In afwijking in zoverre van artikel 46, mag de toiletruimte van een in een woongebouw gelegen woning met een
      gebruiksoppervlakte van minder dan 50 m2, buiten de woning zijn gelegen, mits in dat woongebouw een of meer
      gemeenschappelijke toiletruimten aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel58
  - number: '58.2'
    text: |-
      Indien toepassing is gegeven aan het eerste lid, mag zijn volstaan met één gemeenschappelijke toiletruimte voor
      elke gebruiksoppervlakte van 125 m2 of gedeelte daarvan, van het totaal aan gebruiksoppervlakten van de woningen
      die op die gemeenschappelijke toiletruimte zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel58
  - number: '58.3'
    text: |-
      Indien toepassing is gegeven aan het eerste lid en in het woongebouw ingevolge artikel 42, derde lid, een lift
      aanwezig is, moet ten minste één gemeenschappelijke toiletruimte een vloeroppervlakte hebben van ten minste 2,2 m *
      2,2 m, waarboven de hoogte ten minste 2,1 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel58
  - number: '58.4'
    text: |-
      Een gemeenschappelijke toiletruimte mag, opdat die ruimte onbelemmerd en beschut kan worden bereikt, vanaf
      de toegangen van de op die ruimte aangewezen woningen uitsluitend bereikbaar zijn door een of meer besloten
      gemeenschappelijke verkeersruimten.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel58
  - number: '58.5'
    text: |-
      Tussen de vloer van een gemeenschappelijke toiletruimte anders dan de toiletruimte, bedoeld in het derde lid, en
      de vloer waarop zich de toegangen van de op die ruimte aangewezen woningen bevinden, mag, opdat die ruimte binnen
      redelijke tijd kan worden bereikt, geen groter hoogteverschil aanwezig zijn dan 3 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel58
  - number: '58.6'
    text: |-
      Tussen de toegang van een gemeenschappelijke toiletruimte anders dan de toiletruimte, bedoeld in het eerste lid,
      en de toegangen van de op die ruimte aangewezen woningen mag, gemeten langs de kortste route, geen grotere afstand
      aanwezig zijn dan 25 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel58
  - number: '59.1'
    text: |-
      In afwijking in zoverre van artikel 47, mag de badruimte van een in een woongebouw gelegen woning met een
      gebruiksoppervlakte van minder dan 50 m2, buiten de woning zijn gelegen, mits in dat woongebouw een of meer
      gemeenschappelijke badruimten aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel59
  - number: '59.2'
    text: |-
      Indien toepassing is gegeven aan het eerste lid, mag zijn volstaan met één gemeenschappelijke badruimte voor elke
      gebruiksoppervlakte van 250 m2 of gedeelte daarvan, van het totaal aan gebruiksoppervlakten van de woningen die op
      die gemeenschappelijke badruimte zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel59
  - number: '59.3'
    text: |-
      Een gemeenschappelijke badruimte mag, opdat die ruimte onbelemmerd en beschut kan worden bereikt, vanaf de
      toegangen van de op die ruimte aangewezen woningen uitsluitend bereikbaar zijn door een of meer besloten
      gemeenschappelijke verkeersruimten.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel59
  - number: '59.4'
    text: |-
      Tussen de vloer van een gemeenschappelijke badruimte en de vloer waarop zich de toegangen van de op die ruimte
      aangewezen woningen bevinden, mag, opdat die ruimte binnen redelijke tijd kan worden bereikt, geen groter
      hoogteverschil aanwezig zijn dan 3 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel59
  - number: '59.5'
    text: |-
      Tussen de toegang van een gemeenschappelijke badruimte en de toegangen van de op die ruimte aangewezen woningen
      mag, gemeten langs de kortste route, geen grotere afstand aanwezig zijn dan 25 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel59
  - number: '60'
    text: |-
      In afwijking in zoverre van artikel 49, mag de buitenruimte van een in een woongebouw gelegen woning met een
      gebruiksoppervlakte van minder dan 50 m2, deel uitmaken van een gemeenschappelijke buitenruimte, mits die
      gemeenschappelijke buitenruimte:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel60
  - number: 60.a
    text: |-
      een vrije vloeroppervlakte heeft van ten minste 5% van het totaal aan gebruiksoppervlakten van de woningen die op
      die gemeenschappelijke buitenruimte zijn aangewezen, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel60
  - number: 60.b
    text: |-
      rechtstreeks vanuit een in het woongebouw gelegen gemeenschappelijke verkeersruimte of gemeenschappelijk
      verblijfsgebied bereikbaar is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel60
  - number: '61.1'
    text: |-
      Tot een woongebouw moet, opdat de centrale schakel-, verdeel-, en meetapparatuur voor de in gemeenschappelijke
      ruimten aanwezige voorzieningen van elektriciteit, gas, water, telecommunicatiesignalen en, voor zover van
      toepassing, stadsverwarming kan worden geplaatst, een afsluitbare gemeenschappelijke meterruimte behoren.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel61
  - number: '61.2'
    text: |-
      In afwijking in zoverre van artikel 50, mag de meterruimte van een in een woongebouw gelegen woning met een
      gebruiksoppervlakte van minder dan 50 m2, deel uitmaken van de gemeenschappelijke meterruimte, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel61
  - number: '61.3'
    text: |-
      De afmetingen van een gemeenschappelijke meterruimte moeten zijn afgestemd op de omvang van de in die ruimte te
      plaatsen schakel-, verdeel- en meetapparatuur en mogen niet kleiner zijn dan de in NEN 2768 gegeven afmetingen voor
      een meterruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel61
  - number: '61.4'
    text: |-
      Op de indeling en leidingdoorvoeren van een gemeenschappelijke meterruimte is NEN 2768 van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel61
  - number: '61.5'
    text: |-
      Een uitwendige scheidingsconstructie van een gemeenschappelijke meterruimte moet, ter beperking van het kunnen
      binnendringen van vocht in die ruimte, bepaald overeenkomstig NEN 2778, ten minste regenwerend zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel61
  - number: '61.6'
    text: |-
      Een in een woongebouw gelegen gemeenschappelijke meterruimte mag, opdat die ruimte onbelemmerd kan worden
      bereikt, vanaf de toegang van het woongebouw uitsluitend bereikbaar zijn door een of meer gemeenschappelijke
      verkeersruimten.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel61
  - number: 61a.1
    text: |-
      Indien de afstand, gemeten langs de kortste route, tussen een toegang van een woning, gelegen in een woongebouw,
      en de toegang tot de bergruimte, behorende tot die woning, of het hoogteverschil tussen de toegang van een
      woning en de toegang van die bergruimte zodanig is dat die afstand of dat hoogteverschil een beletsel vormt
      voor het doeltreffend gescheiden kunnen opslaan van huishoudelijk afval, heeft het woongebouw ten minste één
      gemeenschappelijke ruimte voor het plaatsen van containers voor huishoudelijk afval.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel61a
  - number: 61a.2
    text: |-
      De opslagruimte is rechtstreeks vanuit een gemeenschappelijke verkeersruimte bereikbaar; de opslagruimte is
      afsluitbaar met een deur die van buitenaf slechts met behulp van een sleutel kan worden geopend.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel61a
  - number: 61a.3
    text: |-
      De opslagruimte heeft een vloeroppervlakte van ten minste 0,0075 m2 per m2 gebruiksoppervlakte van de in het
      woongebouw gelegen, op die opslagruimte aangewezen woningen, met een minimum van 1,6 m2; de breedte van die
      vloeroppervlakte is ten minste 0,8 m; de hoogte boven die vloeroppervlakte is ten minste 2,1 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel61a
  - number: 61a.4
    text: |-
      De afstand, gemeten langs de kortste route, tussen de toegang van de opslagruimte en de toegang van een woning,
      aangewezen op die opslagruimte is zodanig dat die afstand geen beletsel vormt voor een doeltreffend gebruik van de
      containers, geplaatst in die ruimte. Onder de afstand is tevens begrepen het te overbruggen hoogteverschil.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel61a
  - number: 61a.5
    text: |-
      Een hoogteverschil tussen de vloer van de opslagruimte en de vloer ter plaatse van een toegang van het woongebouw,
      langs welke toegang het aansluitende terrein kan worden bereikt, is zodanig overbrugd dat de containers voor
      huishoudelijk afval op normale wijze buiten het woongebouw kunnen worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel61a
  - number: '62.1'
    text: |-
      In afwijking in zoverre van artikel 53, mogen de opstelplaats voor het aanrecht en de opstelplaats voor een
      kooktoestel van een in een woongebouw gelegen woning waarvan de gebruiksoppervlakte minder is dan 50 m2, zijn
      gelegen in een gemeenschappelijk verblijfsgebied.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel62
  - number: '62.2'
    text: 'Indien toepassing is gegeven aan het eerste lid, mag zijn volstaan met:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel62
  - number: 62.2.a
    text: |-
      één opstelplaats voor een aanrecht met een oppervlakte van ten minste 2,1 m x 0,6 m, voor elke gebruiksoppervlakte
      van 500 m2 of gedeelte daarvan, van het totaal aan gebruiksoppervlakten van de woningen die daarop zijn aangewezen,
      en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel62
  - number: 62.2.b
    text: |-
      één opstelplaats voor een kooktoestel voor elke gebruiksoppervlakte van 200 m2 of gedeelte daarvan, van het totaal
      aan gebruiksoppervlakten van de woningen die daarop zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel62
  - number: '63.1'
    text: |-
      In afwijking van artikel 54, mag de opstelplaats voor wasapparatuur van een in een woongebouw gelegen woning zijn
      gelegen in een afzonderlijke gemeenschappelijke ruimte (wasruimte).
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel63
  - number: '63.2'
    text: |-
      Indien toepassing is gegeven aan het eerste lid, moet de gemeenschappelijke wasruimte voor elke gebruiksoppervlakte
      van 350 m2 of gedeelte daarvan, van het totaal aan gebruiksoppervlakten van de woningen die op die
      gemeenschappelijke wasruimte zijn aangewezen, zijn voorzien van ten minste één opstelplaats voor wasapparatuur.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel63
  - number: '63.3'
    text: |-
      De gemeenschappelijke wasruimte, bedoeld in het eerste lid, moet een vloeroppervlakte hebben die ten minste gelijk
      is aan 0,5% van het totaal aan gebruiksoppervlakten van de op die ruimte aangewezen woningen, met een minimum van 2
      m2, van welke vloeroppervlakte de breedte ten minste 0,8 m en de hoogte boven die oppervlakte ten minste 2,1 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel63
  - number: '64.1'
    text: |-
      In afwijking van artikel 55, mag, indien een in een woongebouw gelegen woning kan worden aangesloten op een
      gemeenschappelijke voorziening voor de verwarming van de in het woongebouw gelegen woningen, de opstelplaats voor
      een stooktoestel zijn gelegen in een afzonderlijke besloten gemeenschappelijke ruimte (stookruimte).
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel64
  - number: '64.2'
    text: De afmetingen van een stookruimte moeten zijn afgestemd op de daarin te plaatsen apparatuur.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel64
  - number: '65.1'
    text: |-
      In afwijking van artikel 56, mag, indien een in een woongebouw gelegen woning kan worden aangesloten op een
      gemeenschappelijke warmwatervoorziening voor de in het woongebouw gelegen woningen, de opstelplaats voor een
      warmwatertoestel zijn gelegen in een gemeenschappelijke ruimte, niet zijnde een verkeersruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel65
  - number: '65.2'
    text: |-
      De afmetingen van de opstelplaats, bedoeld in het eerste lid, moeten zijn afgestemd op de daarop te plaatsen
      apparatuur.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel65
  - number: '65.3'
    text: |-
      In afwijking van het eerste lid, behoeft, indien het warmwatertoestel is samengevoegd met een stooktoestel als
      bedoeld in artikel 64, voor dat warmwatertoestel geen afzonderlijke opstelplaats aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel65
  - number: '66.1'
    text: |-
      In een woning moet, opdat telecommunicatiesignalen kunnen worden ontvangen, een voorziening aanwezig zijn die
      voldoet aan het tweede tot en met vijfde lid.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel66
  - number: '66.2'
    text: |-
      De voorziening moet een aansluitmogelijkheid hebben voor aansluiting op het openbare telefoonnet, alsmede een
      aansluitmogelijkheid voor aansluiting op een gemeenschappelijke of centrale antenne-inrichting.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel66
  - number: '66.3'
    text: |-
      De voorziening moet in ten minste één verblijfsgebied ten minste één aansluitpunt hebben voor onderscheidenlijk een
      telefoontoestel, radiotoestel en televisietoestel.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel66
  - number: '66.4'
    text: |-
      De voorziening moet ten minste bestaan uit twee afzonderlijke, onbedrade buizen die vanaf de buitenzijde van een
      uitwendige scheidingsconstructie leiden naar de aansluitmogelijkheden, bedoeld in het tweede lid, en vanaf die
      aansluitmogelijkheden leiden naar de aansluitpunten, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel66
  - number: '66.5'
    text: |-
      De voorziening moet voorts bij de onderscheiden aansluitpunten, bedoeld in het derde lid, ten minste één inbouwdoos
      hebben.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel66
  - number: '67.1'
    text: |-
      De bovenkant van een in NEN 6740 bedoeld funderingselement mag, ter beperking van verzakking of scheefzakking van
      de woning of het woongebouw, bij momentane belastingscombinaties als bedoeld in NEN 6702, bepaald overeenkomstig
      NEN 6740, geen grotere zakking hebben dan 0,15 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel67
  - number: '67.2'
    text: |-
      Onverminderd het eerste lid, mag de som van de rotatie en de relatieve rotatie aan de bovenkant van het in het
      eerste lid bedoelde funderingselement niet groter zijn dan 3,5.10-3 rad.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel67
  - number: '68.1'
    text: |-
      Een vloer van een verblijfsgebied mag, ter beperking van doorbuiging, bij de respons die voortvloeit uit de in
      NEN 6702 bedoelde incidentele en momentane belastingscombinaties, geen grotere doorbuiging in de eindtoestand als
      bedoeld in die norm hebben dan het produkt van 4.10-3 en de in die norm bedoelde overspanning van die vloer.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel68
  - number: '68.2'
    text: |-
      De doorbuiging, bedoeld in het eerste lid, moet zijn bepaald overeenkomstig het gestelde met betrekking tot de
      bepaling van de vervorming in:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel68
  - number: 68.2.a
    text: NEN 6710 en NEN 6770, indien de vloer is vervaardigd van in die normen bedoeld metaal;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel68
  - number: 68.2.b
    text: NEN 6720, indien de vloer is vervaardigd van in die norm bedoeld beton, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel68
  - number: 68.2.c
    text: NEN 6760, indien de vloer is vervaardigd van in die norm bedoeld hout.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel68
  - number: '68.3'
    text: |-
      Indien een ander materiaal of een andere bepalingsmethode is toegepast dan in het tweede lid bedoeld, moet de
      doorbuiging, bedoeld in het eerste lid, zijn bepaald overeenkomstig NEN 6700.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel68
  - number: '69.1'
    text: |-
      Indien niet is voldaan aan enig voorschrift, gegeven bij of krachtens de artikelen 41 tot en met 68, moet een
      woning of woongebouw een mate van bruikbaarheid bieden die ten minste gelijk is aan de mate van bruikbaarheid die
      is beoogd met het desbetreffende bij of krachtens die artikelen gegeven voorschrift.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel69
  - number: '69.2'
    text: |-
      Indien toepassing is gegeven aan het eerste lid en het desbetreffende voorschrift tevens valt te herleiden tot
      overwegingen van veiligheid, gezondheid of energiezuinigheid, moeten die overwegingen daarbij in ten minste
      dezelfde mate in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel69
  - number: '70.1'
    text: |-
      Een uitwendige scheidingsconstructie van een verblijfsgebied, een toiletruimte of een badruimte heeft, ter
      beperking van warmteverlies door overdracht of geleiding, bepaald overeenkomstig NEN 1068, een warmteweerstand van
      ten minste 2,5 m2.K/W.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel70
  - number: '70.2'
    text: |-
      Het eerste lid is niet van toepassing op een deur, raam, kozijn en daarmee gelijk te stellen constructie-onderdeel,
      voorzover die deur, dat raam, dat kozijn of dat constructie-onderdeel, bepaald overeenkomstig NEN 5128, een
      warmtedoorgangscoëfficiënt heeft van ten hoogste 4,2 W/m2.K.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel70
  - number: '70.3'
    text: 'Het eerste en het tweede lid zijn van overeenkomstige toepassing op:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel70
  - number: 70.3.a
    text: |-
      een constructie die de scheiding vormt tussen een verblijfsgebied, toiletruimte of badruimte en de kruipruimte,
      met inbegrip van de op die constructie aansluitende delen van andere constructies, voor zover die delen van invloed
      zijn op het voldoen van die constructie aan het eerste of tweede lid, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel70
  - number: 70.3.b
    text: |-
      een inwendige scheidingsconstructie van een verblijfsgebied, toiletruimte of badruimte, voor zover die constructie
      niet de scheiding vormt met een ander verblijfsgebied of met een andere toiletruimte of badruimte, waarvan de
      uitwendige scheidingsconstructies, bepaald overeenkomstig NEN 1068, een warmteweerstand heeft van ten minste 2,5
      m2.K/W of waarvan, indien het een deur, raam, kozijn of daarmee gelijk te stellen constructie-onderdeel betreft,
      bepaald overeenkomstig NEN 5128, de warmtedoorgangscoëfficiënt ten hoogste 4,2 W/m2.K is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel70
  - number: '70.4'
    text: |-
      In het totaal van de uitwendige scheidingsconstructies, waaronder begrepen inwendige scheidingsconstructies
      als bedoeld in het derde lid, onderdeel *b*, mag ten hoogste 2% van de gebruiksoppervlakte van de woning of het
      woongebouw aan constructie-onderdelen aanwezig zijn, dat niet voldoet aan het eerste tot en met het derde lid.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel70
  - number: '71.1'
    text: 'Het totaal aan:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel71
  - number: 71.1.a
    text: uitwendige scheidingsconstructies van een woning;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel71
  - number: 71.1.b
    text: inwendige scheidingsconstructies tussen een woning en een niet in die woning gelegen ruimte, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel71
  - number: 71.1.c
    text: |-
      constructies die de scheiding vormen tussen een woning en een kruipruimte, met inbegrip van de op die constructies
      aansluitende delen van andere constructies,
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel71
  - number: '71.2'
    text: Het eerste lid is van overeenkomstige toepassing op een gemeenschappelijk verblijfsgebied.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel71
  - number: '71.3'
    text: |-
      Bij de bepaling van de luchtvolumestroom, bedoeld in het eerste of tweede lid, mogen ruimten, niet zijnde een
      verblijfsgebied, toilet- of badruimte, buiten beschouwing blijven.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel71
  - number: '71.4'
    text: |-
      Bij de bepaling van de luchtvolumestroom bedoeld in het eerste of tweede lid, blijft een ruimte waarin een
      niet-afsluitbare voorziening voor de toevoer van verse lucht en de afvoer van binnenlucht aanwezig is met een
      capaciteit, bepaald volgens NEN 1087, van ten minste 3.10-3m3/s per m2 gebruiksoppervlakte van die ruimte buiten
      beschouwing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel71
  - number: 71a
    text: |-
      Onverminderd de artikelen 70 en 71, heeft ter verdere besparing van energie, een woning geen deel uitmakend van een
      woongebouw, of een woongebouw, bepaald volgens NEN 5128, een energieprestatiecoëfficiënt, als bedoeld in die norm,
      van ten hoogste 1.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel71a
  - number: '72.1'
    text: |-
      Indien niet is voldaan aan enig voorschrift, gegeven bij of krachtens de artikelen 70 tot en met 71*a*, heeft een
      woning of woongebouw een mate van energiezuinigheid die ten minste gelijk is aan de mate van energiezuinigheid die
      is beoogd met het desbetreffende bij of krachtens die artikelen gegeven voorschrift.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel72
  - number: '72.2'
    text: |-
      Indien toepassing is gegeven aan het eerste lid en het desbetreffende voorschrift tevens valt te herleiden tot
      overwegingen van veiligheid, gezondheid of bruikbaarheid, moeten die overwegingen daarbij in ten minste dezelfde
      mate in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel72
  - number: '73.1'
    text: |-
      Een in NEN 6702 bedoelde uiterste grenstoestand van een bouwconstructie mag, opdat die constructie bestand is
      tegen de daarop werkende krachten, bij belastingscombinaties als aangegeven bij ministeriële regeling, niet zijn
      overschreden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel73
  - number: '73.2'
    text: |-
      Het niet-overschrijden van een uiterste grenstoestand als bedoeld in het eerste lid, moet zijn bepaald
      overeenkomstig bij ministeriële regeling gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel73
  - number: '73.3'
    text: |-
      Onverminderd het eerste lid, mag, opdat een woning of woongebouw bij brand op veilige wijze kan worden verlaten,
      een uiterste grenstoestand van de in NEN 6702 bedoelde hoofddraagconstructie van een woning of woongebouw waarin
      een vloer van een verblijfsruimte hoger is gelegen dan 5 m boven het aansluitende terrein, gemeten ter plaatse
      van de toegang van de woning of het woongebouw, dan wel een uiterste grenstoestand van een vloer of trap waarover
      een vluchtmogelijkheid als bedoeld in artikel 84, voert, bij de overeenkomstig bij ministeriële regeling gegeven
      voorschriften in geval van brand aan te houden belastingscombinaties, gedurende de in die voorschriften voor die
      hoofddraagconstructie, vloer of trap aangegeven tijdsduur van de brandwerendheid met betrekking tot bezwijken,
      bepaald overeenkomstig NEN 6069, niet zijn overschreden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel73
  - number: '74.1'
    text: |-
      Een vloer moet, ter voorkoming van het van die vloer kunnen vallen, bij de randen zijn voorzien van een afscheiding
      waarvan de hoogte, gemeten vanaf de vloer, ten minste 0,9 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel74
  - number: '74.2'
    text: |-
      In afwijking in zoverre van het eerste lid, mag, indien de afscheiding zich bevindt ter plaatse van een raam, zijn
      volstaan met een hoogte van ten minste 0,6 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel74
  - number: '74.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op een vloer ter plaatse van de bovenste trede van een trap
      of ter plaatse van de bovenkant van een hellingbaan en op een vloer die niet hoger is gelegen dan 1 m boven een
      aangrenzende vloer dan wel boven het aansluitende terrein of water.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel74
  - number: '74.4'
    text: |-
      Tussen een vloer en een afscheiding als bedoeld in het eerste en tweede lid, mag, horizontaal gemeten, geen opening
      aanwezig zijn die breder is dan 0,1 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel74
  - number: '74.5'
    text: |-
      Openingen in een afscheiding als bedoeld in het eerste en tweede lid, mogen niet breder zijn dan 0,2 m, tenzij die
      openingen zich bevinden op een hoogte van meer dan 0,6 m boven de vloer.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel74
  - number: '75'
    text: |-
      Een hoogteverschil van meer dan 0,22 m tussen vloeren van verblijfsruimten, toiletruimten, badruimten en
      gemeenschappelijke verkeersruimten dan wel tussen één van die vloeren en het aansluitende terrein moet, opdat die
      ruimten op veilige wijze kunnen worden bereikt en verlaten, zijn overbrugd door een trap of hellingbaan.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel75
  - number: '76.1'
    text: |-
      De afmetingen van een trap als bedoeld in artikel 75, moeten ten minste voldoen aan tabel IV. Tabel IV Afmetingen
      van een trap






                    0,7 m minimum vrije hoogte boven de trap


                    1,9 m




                    minimum aantrede ter plaatse van de klimlijn, gemeten loodrecht op de voorkant van de trede


                    0,13 m




                    maximum afmeting van een optrede


                    0,22 m




                    minimum afstand van de klimlijn tot de zijkanten van de trap


                    0,2 m
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel76
  - number: '76.2'
    text: |-
      Een trap als bedoeld in het eerste lid, moet ter plaatse van de bovenste trede over de ten minste vereiste breedte
      aansluiten op een vrije vloeroppervlakte van ten minste 0,7 m * 0,7 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel76
  - number: '76.3'
    text: |-
      Een trap van een woongebouw waarmee een hoogteverschil is overbrugd van meer dan 1 m, moet aan beide zijkanten
      vanaf een hoogte van 1 m zijn voorzien van een afscheiding met een hoogte van ten minste 0,6 m boven de voorkant
      van de tredevlakken van de trap.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel76
  - number: '76.4'
    text: |-
      Op een afscheiding als bedoeld in het derde lid, is artikel 74, vierde en vijfde lid, van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel76
  - number: '76.5'
    text: |-
      Een trap als bedoeld in het derde lid, waarvan de klimlijn een helling heeft die groter is dan 2:3, moet aan ten
      minste één zijkant zijn voorzien van een leuning waarvan de bovenkant zich bevindt op een hoogte van ten minste 0,6
      m en ten hoogste 1 m boven de voorkant van de tredevlakken van de trap.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel76
  - number: '77.1'
    text: |-
      Een hellingbaan als bedoeld in artikel 75, moet een breedte hebben van ten minste 0,7 m en mag geen grotere helling
      hebben dan 1:10.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel77
  - number: '77.2'
    text: |-
      Een hellingbaan als bedoeld in het eerste lid, moet aan de bovenkant over de ten minste vereiste breedte aansluiten
      op een vrije vloeroppervlakte van ten minste 0,7 m * 0,7 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel77
  - number: '77.3'
    text: |-
      Een hellingbaan van een woongebouw, voor zover met die hellingbaan een hoogteverschil is overbrugd van meer dan
      1 m, moet aan beide zijkanten vanaf een hoogte van 1 m zijn voorzien van een afscheiding met een hoogte van ten
      minste 0,6 m boven de hellingbaan.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel77
  - number: '77.4'
    text: |-
      Op een afscheiding als bedoeld in het derde lid, is artikel 74, vierde en vijfde lid, van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel77
  - number: '78.1'
    text: |-
      In een woning en in een woongebouw moet, opdat op veilige wijze over energie kan worden beschikt, een voorziening
      voor elektriciteit aanwezig zijn die is aangesloten op het distributienet van elektriciteit en die ten minste
      voldoet aan artikel 5, eerste lid, onderdeel 2, van de Model-aansluitvoorwaarden voor elektrische energie van de
      Vereniging van Exploitanten van Elektriciteitsbedrijven in Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel78
  - number: '78.2'
    text: |-
      Een voorziening voor noodstroom moet ten minste voldoen aan artikel 5, eerste lid, onderdeel 2, van de Model-
      aansluitvoorwaarden voor elektrische energie van de Vereniging van Exploitanten van Elektriciteitsbedrijven in
      Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel78
  - number: '79.1'
    text: |-
      In een besloten gemeenschappelijke verkeersruimte moet, opdat op veilige wijze van die ruimte gebruik kan
      worden gemaakt, ten minste één verlichtingsinstallatie aanwezig zijn die is aangesloten op de voorziening voor
      elektriciteit en die over een breedte van ten minste 0,5 m van die ruimte, gemeten op de vloer daarvan, een
      verlichtingssterkte van ten minste 1 lux kan geven.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel79
  - number: '79.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een in een besloten gemeenschappelijke verkeersruimte gelegen
      trap of hellingbaan, alsmede op de kooi van een lift.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel79
  - number: '80'
    text: |-
      Een voorziening voor gas moet, opdat op veilige wijze over energie kan worden beschikt, zijn aangesloten op
      het distributienet van gas en moet ten minste voldoen aan artikel 5, eerste lid, onderdeel 2, van de Model-
      aansluitvoorwaarden voor gas van de Vereniging van Exploitanten van Gasbedrijven in Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel80
  - number: '81'
    text: |-
      Een beweegbaar constructie-onderdeel dat zich in enige stand kan bevinden boven een voor motorvoertuigen
      openstaande weg, moet, ter voorkoming van gevaar voor gebruikers van die weg, gemeten vanaf de onderzijde van dat
      onderdeel, hoger zijn gelegen dan 4,2 m boven die weg.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel81
  - number: '82.1'
    text: |-
      Materiaal, toegepast ter plaatse van of in de nabijheid van een in NEN 6061 bedoelde stookplaats moet, ter
      beperking van het ontstaan van een brandgevaarlijke situatie, onbrandbaar zijn als bedoeld in NEN 6064, voor zover:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel82
  - number: 82.1.a
    text: |-
      ter plaatse van of in de nabijheid van die stookplaats een overeenkomstig NEN 6061 bepaalde intensiteit van de
      warmtestraling kan optreden van meer dan 2 kW/m2, of
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel82
  - number: 82.1.b
    text: in dat materiaal een overeenkomstig NEN 6061 bepaalde temperatuur kan optreden van meer dan 363 K.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel82
  - number: '82.2'
    text: |-
      Een voorziening voor de afvoer van rook moet luchtdicht zijn overeenkomstig bij ministeriële regeling gegeven
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel82
  - number: '82.3'
    text: |-
      Onverminderd het tweede lid, moet materiaal waaruit de voorziening voor de afvoer van rook is samengesteld, alsmede
      materiaal dat in de nabijheid van die voorziening is toegepast, voor zover in dat materiaal een overeenkomstig NEN
      6062 bepaalde temperatuur kan optreden van meer dan 363 K, onbrandbaar zijn als bedoeld in NEN 6064.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel82
  - number: '82.4'
    text: |-
      De horizontale afstand tussen de uitmonding van een voorziening voor de afvoer van rook van een op vaste brandstof
      gestookt toestel en een in NEN 6063 bedoeld brandgevaarlijk dak van een ander bouwwerk mag niet minder zijn dan
      15 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel82
  - number: '83.1'
    text: |-
      Een woning en een woongebouw, alsmede een bij ministeriële regeling aangegeven gedeelte van een woning en van een
      woongebouw zijn aan te merken als een brandcompartiment.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel83
  - number: '83.2'
    text: |-
      De in NEN 6068 bedoelde weerstand tegen branddoorslag en brandoverslag tussen een brandcompartiment als bedoeld in
      het eerste lid, en een andere besloten ruimte moet, ter beperking van uitbreiding van brand, ten minste voldoen aan
      bij ministeriële regeling gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel83
  - number: '84.1'
    text: |-
      Een woning en een woongebouw, alsmede een bij ministeriële regeling aangegeven gedeelte van een woning en van een
      woongebouw moeten, opdat bij brand op veilige wijze het aansluitende terrein kan worden bereikt, zijn voorzien van
      vluchtmogelijkheden, waarvan aantal en inrichting ten minste voldoen aan bij die regeling gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel84
  - number: '84.2'
    text: |-
      Een constructie-onderdeel moet een klasse van de in NEN 6065 of NEN 1775 bedoelde bijdrage tot brandvoortplanting
      hebben als voor dat onderdeel is aangegeven in bij ministeriële regeling gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel84
  - number: '84.3'
    text: |-
      De in NEN 6066 bedoelde rookproduktie van een naar een besloten ruimte toegekeerde zijde van een constructie-
      onderdeel mag geen grotere rookdichtheid als bedoeld in die norm hebben, dan voor dat onderdeel bij ministeriële
      regeling is aangegeven.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel84
  - number: '84.4'
    text: |-
      De in NEN 6075 bedoelde weerstand tegen rookdoorgang van een bij ministeriële regeling aangegeven inwendige
      scheidingsconstructie moet, bepaald overeenkomstig die norm, ten minste voldoen aan bij die regeling gegeven
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel84
  - number: '85.1'
    text: |-
      Een brandweerlift moet, opdat de brandweer gebruikers van een woongebouw in geval van brand kan redden en brand
      kan bestrijden, ten minste voldoen aan het gestelde ten aanzien van de brandweerschakelaar en de voeding van de
      lift in NEN-EN 81-1, voor zover het een elektrisch aangedreven lift betreft, en in NEN-EN 81-2, voor zover het een
      hydraulisch aangedreven lift betreft.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel85
  - number: '85.2'
    text: |-
      Een woning met een bij ministeriële regeling aangegeven gebruiksoppervlakte moet, opdat gebruikers van die woning
      op veilige wijze uit die woning kunnen vluchten, zijn voorzien van vluchtwegaanduidingen die ten minste voldoen aan
      bij ministeriële regeling gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel85
  - number: '86'
    text: |-
      Een woongebouw waarin een vloer van een verblijfsruimte hoger is gelegen dan 20 m boven het aansluitende terrein,
      gemeten ter plaatse van de toegang van het gebouw, moet, met het oog op brandbestrijding, zijn voorzien van een of
      meer droge blusleidingen die voldoen aan bij ministeriële regeling gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel86
  - number: '87'
    text: |-
      Indien een toegang van een woongebouw is voorzien van een deur die van buitenaf alleen met behulp van een sleutel
      kan worden geopend, moet die deur, met het oog op het tegengaan van veel voorkomende criminaliteit, zelfsluitend
      zijn en moet ter plaatse van die deur aan de buitenkant een voorziening aanwezig zijn waarmee een in de woning
      waarneembaar signaal kan worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel87
  - number: '88.1'
    text: |-
      Indien niet is voldaan aan enig voorschrift, gegeven bij of krachtens de artikelen 73 tot en met 87, moet een
      woning of woongebouw een mate van veiligheid bieden die ten minste gelijk is aan de mate van veiligheid die is
      beoogd met het desbetreffende bij of krachtens die artikelen gegeven voorschrift.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel88
  - number: '88.2'
    text: |-
      Indien toepassing is gegeven aan het eerste lid en het desbetreffende voorschrift tevens valt te herleiden tot
      overwegingen van gezondheid of bruikbaarheid, moeten die overwegingen daarbij in ten minste dezelfde mate in acht
      zijn genomen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel88
  - number: '89.1'
    text: |-
      Een uitwendige scheidingsconstructie van een verblijfsruimte, toiletruimte of badruimte moet, ter beperking van het
      kunnen binnendringen van vocht in de woning of het woongebouw, bepaald overeenkomstig NEN 2778, waterdicht zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel89
  - number: '89.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een constructie die de scheiding vormt tussen een
      verblijfsruimte, toiletruimte of badruimte en de kruipruimte, met inbegrip van de op die constructie aansluitende
      delen van andere constructies, voor zover die delen van invloed zijn op het voldoen van die constructie aan dit
      lid.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel89
  - number: '89.3'
    text: |-
      Een inwendige scheidingsconstructie van een verblijfsruimte, toiletruimte of badruimte, voor zover die constructie
      niet de scheiding vormt met een andere verblijfsruimte, toiletruimte of badruimte, moet, bepaald overeenkomstig NEN
      2778, waterdicht zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel89
  - number: '90'
    text: |-
      Een constructie die de scheiding vormt tussen een badruimte en een andere besloten ruimte, de buitenlucht, de grond
      of het water, mag, ter beperking van het vanuit de badruimte kunnen binnendringen van vocht in die constructie,
      aan de naar de badruimte toegekeerde oppervlakte tot een hoogte van 1 m boven de vloer van die ruimte, bepaald
      overeenkomstig NEN 2778, gemiddeld geen grotere wateropname als bedoeld in die norm hebben dan 0,01 kg/(m2.s½), met
      dien verstande dat op geen enkele plaats op die oppervlakte de wateropname groter mag zijn dan 0,2 kg/(m2.s½).
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel90
  - number: '91.1'
    text: |-
      Een woning of woongebouw moet, ter voorkoming van een voor de gezondheid onaanvaardbare situatie in en bij de
      woning of het woongebouw, een voorziening hebben voor de afvoer van afvalwater en faecaliën, die is aangesloten op
      het openbaar riool.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel91
  - number: '91.2'
    text: |-
      De voorziening voor afvalwater en faecaliën moet een zodanige afvoercapaciteit hebben dat elk op die voorziening
      aangesloten lozingstoestel als bedoeld in NEN 3215, binnen ten hoogste 5 minuten is geleegd, en moet, bepaald
      overeenkomstig die norm, lucht- en waterdicht zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel91
  - number: '92.1'
    text: |-
      In een verblijfsruimte, toiletruimte en badruimte moet, ter beperking van het ontstaan van een voor de gezondheid
      nadelige kwaliteit van de binnenlucht, een voorziening aanwezig zijn voor de toevoer van verse lucht en de afvoer
      van binnenlucht.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel92
  - number: '92.2'
    text: |-
      De voorziening voor de toevoer van verse lucht naar een verblijfsruimte en voor de afvoer van binnenlucht uit die
      ruimte moet, bepaald overeenkomstig bij ministeriële regeling gegeven voorschriften, een capaciteit hebben van ten
      minste 7.10-3 m3/s.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel92
  - number: '92.3'
    text: |-
      Onverminderd het tweede lid, moet, indien in de verblijfsruimte een opstelplaats voor een kooktoestel is gelegen,
      de capaciteit voor de toevoer van verse lucht naar die ruimte en de afvoer van binnenlucht uit die ruimte ten
      minste 21.10 -3 m3/s zijn, met dien verstande dat de afvoer van die capaciteit rechtstreeks naar buiten moet
      plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel92
  - number: '92.4'
    text: |-
      De voorziening voor de toevoer van verse lucht en de afvoer van binnenlucht moet, bepaald overeenkomstig bij
      ministeriële regeling gegeven voorschriften, een capaciteit hebben van ten minste:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel92
  - number: 92.4.a
    text: 7.10-3 m3/s voor een toiletruimte, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel92
  - number: 92.4.b
    text: 14.10-3 m3/s voor een al of niet met een toiletruimte samengevoegde badruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel92
  - number: '92.5'
    text: De afvoer van binnenlucht, bedoeld in het vierde lid, moet rechtstreeks naar buiten plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel92
  - number: '92.6'
    text: |-
      In het totaal van de uitwendige scheidingsconstructies van een woning moeten, opdat sterk verontreinigde
      binnenlucht snel kan worden afgevoerd, beweegbare constructie-onderdelen aanwezig zijn waarmee, bepaald
      overeenkomstig NEN 1087, in een verblijfsruimte een totale capaciteit voor de toevoer van buitenlucht en de afvoer
      van binnenlucht kan worden bewerkstelligd van ten minste 3.10-3 m3/s per m2 vloeroppervlakte van die ruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel92
  - number: '93.1'
    text: |-
      In een ruimte als bedoeld in het tweede lid, moet, ter beperking van het ontstaan van een voor de gezondheid
      nadelige kwaliteit van de binnenlucht, een voorziening voor de toevoer van verse lucht en de afvoer van binnenlucht
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel93
  - number: '93.2'
    text: |-
      De voorziening voor de toevoer van verse lucht en de afvoer van binnenlucht moet, bepaald overeenkomstig bij
      ministeriële regeling gegeven voorschriften, een capaciteit hebben van ten minste:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel93
  - number: 93.2.a
    text: 6.10-3 m3/s per m2 vrije vloeroppervlakte van een liftkooi;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel93
  - number: 93.2.b
    text: 0,1 m3/s voor een besloten opslagruimte voor afval met een netto-inhoud van meer dan 3 m3, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel93
  - number: 93.2.c
    text: 2.10-3 m3/s per m3 netto-inhoud voor een besloten ruimte waarin zich de centrale meetapparatuur voor gas bevindt.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel93
  - number: '93.3'
    text: |-
      De toevoer van verse lucht naar een besloten opslagruimte voor afval met een netto-inhoud van meer dan 3 m3 moet
      rechtstreeks van buiten plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel93
  - number: '93.4'
    text: |-
      De afvoer van binnenlucht uit een besloten opslagruimte voor afval met een netto-inhoud van meer dan 3 m3 moet
      rechtstreeks naar buiten plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel93
  - number: '94.1'
    text: |-
      In een woning of woongebouw moet, ter voorkoming van een onaanvaardbare ophoping van vergiftige of hinderlijke
      gassen, ten behoeve van een opstelplaats voor een verbrandingstoestel, niet zijnde een kooktoestel met een nominale
      belasting als bedoeld in NEN 2757 van niet meer dan 15 kW, een voorziening voor de toevoer van verbrandingslucht en
      de afvoer van rook aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel94
  - number: '94.2'
    text: |-
      De voorziening voor de toevoer van verbrandingslucht en de afvoer van rook moet, bepaald overeenkomstig bij
      ministeriële regeling gegeven voorschriften, een in die voorschriften aangegeven inrichting en capaciteit hebben.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel94
  - number: '94.3'
    text: |-
      De inrichting van de voorziening voor de toevoer van verbrandingslucht en de afvoer van rook moet, wat de
      richting van de stroming van de afvoer van rook betreft, ten minste voldoen aan bij ministeriële regeling gegeven
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel94
  - number: '95.1'
    text: |-
      In een uitwendige scheidingsconstructie mogen zich, ter beperking van het in de woning of het woongebouw kunnen
      binnendringen van ratten en muizen, geen onafsluitbare openingen bevinden die breder zijn dan 0,01 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel95
  - number: '95.2'
    text: |-
      Het eerste lid is niet van toepassing op een opening die aan de bovenkant de uitmonding vormt van een verticaal
      kanaal en op de ruimte die zich bevindt tussen de dakbedekking en het onder die bedekking gelegen deel van het dak.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel95
  - number: '96.1'
    text: |-
      In een woning of woongebouw moet, opdat kan worden beschikt over voor de menselijke consumptie en hygiëne geschikt
      water, een voorziening voor drinkwater aanwezig zijn die is aangesloten op het distributienet van drinkwater.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel96
  - number: '96.2'
    text: |-
      De inrichting van een voorziening voor drinkwater moet ten minste voldoen aan artikel 5, eerste lid, onderdeel
      2, van de Model-aansluitvoorwaarden voor drinkwater van de Vereniging van Exploitanten van Waterleidingbedrijven
      in Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel96
  - number: '97'
    text: |-
      De inrichting van een voorziening voor warm water moet, opdat kan worden beschikt over voor de menselijke hygiëne
      geschikt warm water, ten minste voldoen aan artikel 5, eerste lid, onderdeel 2, van de Model-aansluitvoorwaarden
      voor drinkwater van de Vereniging van Exploitanten van Waterleidingbedrijven in Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel97
  - number: '98.1'
    text: |-
      In het totaal van de uitwendige scheidingsconstructies van een verblijfsruimte moet, met het oog op de toetreding
      van daglicht en het uitzicht naar buiten, bepaald overeenkomstig NEN 2057, een equivalente daglichtoppervlakte als
      bedoeld in die norm, van ten minste 0,5 m2 aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel98
  - number: '98.2'
    text: |-
      Bij de bepaling van de in het eerste lid bedoelde equivalente daglichtoppervlakte blijven bouwwerken en daarmee
      gelijk te stellen belemmeringen die zich niet bevinden op het perceel waarop de woning of het woongebouw is
      gelegen, en daglichtopeningen in een uitwendige scheidingsconstructie, voor zover die openingen, gemeten loodrecht
      op die openingen, zijn gelegen op een afstand van minder dan 2 m van de perceelsgrens, buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel98
  - number: '98.3'
    text: |-
      In afwijking in zoverre van het tweede lid, mag, indien het perceel waarop de woning of het woongebouw is gelegen,
      grenst aan een openbare weg, openbaar water of openbaar groen, de afstand zijn aangehouden tot het hart van die
      weg, dat water of dat groen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel98
  - number: '98.4'
    text: |-
      Bij de bepaling van de in het eerste lid bedoelde equivalente daglichtoppervlakte moet de in rekening te brengen
      belemmeringshoek α, bedoeld in NEN 2057, ten minste 25° zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel98
  - number: '98.5'
    text: |-
      In afwijking in zoverre van het eerste lid, mag de equivalente daglichtoppervlakte zich bevinden in een inwendige
      scheidingsconstructie van een verblijfsruimte, indien die inwendige constructie niet de scheiding vormt met een
      andere verblijfsruimte of met een toiletruimte, badruimte of bergruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel98
  - number: '99.1'
    text: |-
      Indien niet is voldaan aan enig voorschrift, gegeven bij of krachtens de artikelen 89 tot en met 98, moet een
      woning of woongebouw een mate van bescherming van de gezondheid bieden, die ten minste gelijk is aan de mate van
      bescherming die is beoogd met het desbetreffende bij of krachtens die artikelen gegeven voorschrift.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel99
  - number: '99.2'
    text: |-
      Indien toepassing is gegeven aan het eerste lid en het desbetreffende voorschrift tevens valt te herleiden tot
      overwegingen van veiligheid of bruikbaarheid, moeten die overwegingen daarbij in ten minste dezelfde mate in acht
      zijn genomen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel99
  - number: '100.1'
    text: |-
      In een woning moet, opdat daarin voor het wonen kenmerkende activiteiten kunnen plaatsvinden, een totaal aan
      vloeroppervlakte aan verblijfsruimte van ten minste 14 m2 aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel100
  - number: '100.2'
    text: Boven de vloeroppervlakte van een verblijfsruimte moet een hoogte van ten minste 2,1 m aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel100
  - number: '100.3'
    text: |-
      Een verblijfsruimte moet vanaf de toegang van de woning bereikbaar zijn zonder dat een toiletruimte, badruimte of
      bergruimte behoeft te worden betreden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel100
  - number: '100.4'
    text: |-
      In een woning moet ten minste één verblijfsruimte aanwezig zijn met een vloeroppervlakte van ten minste 7,5 m2,
      waarvan de breedte ten minste 2,4 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel100
  - number: '101.1'
    text: |-
      Tot een woning moet, opdat sanitaire handelingen kunnen worden verricht, ten minste één afsluitbare toiletruimte
      behoren.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel101
  - number: '101.2'
    text: |-
      De toiletruimte, bedoeld in het eerste lid, moet een vloeroppervlakte hebben van ten minste 0,64 m2, waarvan de
      breedte ten minste 0,6 m en de hoogte boven de helft van die oppervlakte ten minste 2 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel101
  - number: '102.1'
    text: |-
      Een badruimte in een woning moet, met het oog op het zich kunnen wassen, een vloeroppervlakte hebben van ten minste
      0,36 m2, waarvan de breedte ten minste 0,6 m en de hoogte boven die oppervlakte ten minste 2 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel102
  - number: '102.2'
    text: |-
      Een badruimte als bedoeld in het eerste lid, mag, met het oog op een doelmatige benutting van de
      gebruiksoppervlakte van de woning, zijn samengevoegd met een binnen de woning bereikbare toiletruimte, mits de
      vloeroppervlakte van die samengevoegde ruimte ten minste 1 m2 is, waarvan de breedte ten minste 0,6 m en de hoogte
      boven twee derde van die oppervlakte ten minste 2 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel102
  - number: '103.1'
    text: |-
      Tot een woning behoren, opdat spijzen kunnen worden bereid, een opstelplaats voor een aanrecht en een opstelplaats
      voor een kooktoestel, gelegen in een besloten ruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel103
  - number: '103.2'
    text: |-
      De vloeroppervlakte van de opstelplaats voor het aanrecht en de opstelplaats voor het kooktoestel vallen niet samen
      met de oppervlakte van 7,5 m2, die voor ten minste één verblijfsruimte is vereist.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel103
  - number: '103.3'
    text: De opstelplaats voor het aanrecht heeft een vloeroppervlakte van ten minste 0,7 m x 0,4 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel103
  - number: '103.4'
    text: |-
      De opstelplaats voor een kooktoestel, bedoeld in het eerste lid, moet een vloeroppervlakte hebben van ten minste
      0,4 m * 0,4 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel103
  - number: '104.1'
    text: |-
      In een woning moet, opdat verwarmingsapparatuur kan worden geplaatst, ten minste één opstelplaats voor een
      stooktoestel aanwezig zijn, die niet mag zijn gelegen in een toiletruimte of badruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel104
  - number: '104.2'
    text: |-
      In afwijking van het eerste lid, mag de opstelplaats voor een stooktoestel buiten de woning in een tot de woning
      behorende besloten ruimte zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel104
  - number: '104.3'
    text: |-
      In afwijking in zoverre van het eerste lid, moet een opstelplaats die is bestemd voor de plaatsing van een of meer
      stooktoestellen met een totale nominale belasting als bedoeld in NEN 2757 van meer dan 160 kW, zijn gelegen in een
      afzonderlijke besloten ruimte (stookruimte).
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel104
  - number: '104.4'
    text: |-
      Het eerste lid is niet van toepassing, indien de woning is aangesloten op het distributienet van de stadsverwarming
      of op een andere voorziening die is bestemd voor de verwarming van meer dan één woning.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel104
  - number: '105.1'
    text: |-
      In afwijking in zoverre van artikel 100, mag een deel van de vloeroppervlakte aan verblijfsruimte van een in een
      woongebouw gelegen woning deel uitmaken van een in dat woongebouw gelegen gemeenschappelijke verblijfsruimte, mits
      in de woning ten minste 10 m2 vloeroppervlakte aan verblijfsruimte aanwezig is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel105
  - number: '105.2'
    text: |-
      Een gemeenschappelijke verblijfsruimte mag, opdat die ruimte onbelemmerd en beschut kan worden bereikt, vanaf
      de toegangen van de op die ruimte aangewezen woningen uitsluitend bereikbaar zijn door een of meer besloten
      gemeenschappelijke verkeersruimten.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel105
  - number: '106.1'
    text: |-
      In afwijking in zoverre van artikel 101, behoeft een in een woongebouw gelegen woning niet te zijn voorzien van een
      toiletruimte, mits binnen dat woongebouw een of meer gemeenschappelijke toiletruimten aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel106
  - number: '106.2'
    text: |-
      Indien toepassing is gegeven aan het eerste lid, mag zijn volstaan met één gemeenschappelijke toiletruimte voor
      elke gebruiksoppervlakte van 165 m2 of gedeelte daarvan, van het totaal aan gebruiksoppervlakten van de woningen
      die op die gemeenschappelijke toiletruimte zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel106
  - number: '106.3'
    text: |-
      Een gemeenschappelijke toiletruimte mag, opdat die ruimte onbelemmerd en beschut kan worden bereikt, vanaf
      de toegangen van de op die ruimte aangewezen woningen uitsluitend bereikbaar zijn door een of meer besloten
      gemeenschappelijke verkeersruimten.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel106
  - number: '107'
    text: |-
      Een gemeenschappelijke badruimte in een woongebouw moet, met het oog op het zich kunnen wassen, een
      vloeroppervlakte hebben van ten minste 0,36 m2, waarvan de breedte ten minste 0,6 m en de hoogte boven die
      oppervlakte ten minste 2 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel107
  - number: '108.1'
    text: |-
      In afwijking in zoverre van artikel 103, mag, voor zover het in een woongebouw gelegen woningen betreft, worden
      volstaan met één opstelplaats voor een gemeenschappelijk aanrecht en één opstelplaats voor een gemeenschappelijk
      kooktoestel buiten die woningen, mits die opstelplaatsen zich in een gemeenschappelijke verblijfsruimte bevinden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel108
  - number: '108.2'
    text: De opstelplaats voor het gemeenschappelijke aanrecht heeft een vloeroppervlakte van ten minste 1,5 m x 0,5 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel108
  - number: '108.3'
    text: |-
      De opstelplaats voor een gemeenschappelijk kooktoestel, bedoeld in het eerste lid, moet een vloeroppervlakte hebben
      van ten minste 0,5 m * 0,5 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel108
  - number: '109.1'
    text: |-
      In afwijking van artikel 104, mag, indien een in een woongebouw gelegen woning is aangesloten op een
      gemeenschappelijke voorziening voor de verwarming van de in het woongebouw gelegen woningen, de opstelplaats voor
      een stooktoestel zich bevinden in een besloten gemeenschappelijke ruimte, niet zijnde een toiletruimte, badruimte
      of verkeersruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel109
  - number: '109.2'
    text: |-
      De afmetingen van de opstelplaats, bedoeld in het eerste lid, moeten zijn afgestemd op de daarop te plaatsen
      apparatuur.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel109
  - number: '109.3'
    text: |-
      In afwijking in zoverre van het eerste lid, moet de opstelplaats die is bestemd voor de plaatsing van een of meer
      stooktoestellen met een totale nominale belasting als bedoeld in NEN 2757 van meer dan 160 kW, zijn gelegen in een
      afzonderlijke besloten gemeenschappelijke ruimte (stookruimte).
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel109
  - number: '109.4'
    text: De afmetingen van een stookruimte moeten zijn afgestemd op de in die ruimte te plaatsen apparatuur.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel109
  - number: '110.1'
    text: |-
      Indien niet is voldaan aan enig voorschrift, gegeven bij of krachtens de artikelen 100 tot en met 109, moet een
      woning of woongebouw een mate van bruikbaarheid bieden die ten minste gelijk is aan de mate van bruikbaarheid die
      is beoogd met het desbetreffende bij of krachtens die artikelen gegeven voorschrift.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel110
  - number: '110.2'
    text: |-
      Indien toepassing is gegeven aan het eerste lid en het desbetreffende voorschrift tevens valt te herleiden tot
      overwegingen van veiligheid of gezondheid, moeten die overwegingen daarbij in ten minste dezelfde mate in acht
      zijn genomen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel110
  - number: '111.1'
    text: |-
      Een in NEN 6702 bedoelde uiterste grenstoestand van een bouwconstructie van een woonwagen en van de op een
      standplaats ten behoeve van een woonwagen aanwezige fundering mag, opdat die woonwagen en fundering duurzaam
      bestand zijn tegen de daarop werkende krachten, bij de in die norm bedoelde fundamentele belastingscombinaties niet
      zijn overschreden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel111
  - number: '111.2'
    text: |-
      Onverminderd het eerste lid, moet voor de bepaling van de op de bouwconstructie van de fundering aan te brengen
      belastingscombinatie zijn uitgegaan van:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel111
  - number: 111.2.a
    text: |-
      een laststelsel, bestaande uit twee verticale, evenwijdige lijnlasten die elk een rekenwaarde hebben ter grootte
      van 6,8 kN/m en een lengte van 15 m, en die op een afstand van ten minste 2,5 m en ten hoogste 3 m van elkaar
      moeten zijn gelegen;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel111
  - number: 111.2.b
    text: |-
      een puntlast met een rekenwaarde van 50 kN, die als vrije belasting als bedoeld in NEN 6702, in rekening moet zijn
      gebracht, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel111
  - number: 111.2.c
    text: de rekenwaarde van het eigen gewicht van de fundering.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel111
  - number: '111.3'
    text: |-
      In afwijking in zoverre van het tweede lid, moet, indien de standplaats is gelegen in een onbebouwd gebied I als
      bedoeld in NEN 6702, voor de in dat lid bedoelde lijnlasten zijn uitgegaan van een rekenwaarde ter grootte van 7,3
      kN/m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel111
  - number: '111.4'
    text: |-
      Het niet-overschrijden van een uiterste grenstoestand als bedoeld in het eerste lid, moet zijn bepaald
      overeenkomstig:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel111
  - number: 111.4.a
    text: NEN 6710 en NEN 6770, indien de bouwconstructie is vervaardigd van in die normen bedoeld metaal;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel111
  - number: 111.4.b
    text: NEN 6720 en NEN 6790, indien de bouwconstructie is vervaardigd van in die normen bedoeld steenachtig materiaal;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel111
  - number: 111.4.c
    text: NEN 6760, indien de bouwconstructie is vervaardigd van in die norm bedoeld hout;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel111
  - number: 111.4.d
    text: NEN 2608, indien de bouwconstructie is vervaardigd van in die norm bedoeld glas, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel111
  - number: 111.4.e
    text: NEN 6707, indien de bouwconstructie de in die norm bedoelde bevestiging van dakbedekking is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel111
  - number: '111.5'
    text: |-
      Indien een ander materiaal of een andere bepalingsmethode is toegepast dan in het vierde lid is bedoeld, moet het
      niet-overschrijden van een uiterste grenstoestand van een bouwconstructie zijn bepaald overeenkomstig NEN 6700.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel111
  - number: '112.1'
    text: |-
      Op een standplaats moet, opdat op veilige wijze over energie kan worden beschikt, een voorziening voor
      elektriciteit aanwezig zijn die ten minste voldoet aan artikel 5, eerste lid, onderdeel 2, van de Model-
      aansluitvoorwaarden voor elektrische energie van de Vereniging van Exploitanten van Elektriciteitsbedrijven in
      Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel112
  - number: '112.2'
    text: |-
      Onverminderd het eerste lid, moet de voorziening voor elektriciteit in de meterruimte ten minste één
      aansluitmogelijkheid hebben voor aansluiting op het distributienet van elektriciteit.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel112
  - number: '112.3'
    text: |-
      In een woonwagen moet, opdat daarin op veilige wijze over energie kan worden beschikt, een voorziening voor
      elektriciteit aanwezig zijn die is aangesloten op de voorziening, bedoeld in het eerste lid, en die ten minste
      voldoet aan artikel 5, eerste lid, onderdeel 2, van de Model-aansluitvoorwaarden voor elektrische energie van de
      Vereniging van Exploitanten van Elektriciteitsbedrijven in Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel112
  - number: '113.1'
    text: |-
      Op een standplaats moet, opdat op veilige wijze over energie kan worden beschikt, een voorziening voor gas aanwezig
      zijn die ten minste voldoet aan artikel 5, eerste lid, onderdeel 2, van de Model-aansluitvoorwaarden voor gas van
      de Vereniging van Exploitanten van Gasbedrijven in Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel113
  - number: '113.2'
    text: |-
      In een woonwagen moet, opdat daarin op veilige wijze over energie kan worden beschikt, een voorziening voor gas
      aanwezig zijn die is aangesloten op de voorziening, bedoeld in het eerste lid, en die ten minste voldoet aan
      artikel 5, eerste lid, onderdeel 2, van de Model-aansluitvoorwaarden voor gas van de Vereniging van Exploitanten
      van Gasbedrijven in Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel113
  - number: '113.3'
    text: |-
      In afwijking van het eerste en tweede lid, geldt de verplichting tot het hebben van een voorziening voor gas niet,
      indien de standplaats en de woonwagen zijn aangesloten op het distributienet van de stadsverwarming of op een
      andere voorziening die is bestemd voor de verwarming van meer dan één woonwagen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel113
  - number: '114.1'
    text: |-
      De voorziening voor gas, bedoeld in artikel 113, eerste lid, moet, opdat gas kan worden betrokken, in de
      meterruimte ten minste één aansluitmogelijkheid hebben voor aansluiting op het distributienet van gas.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel114
  - number: '114.2'
    text: |-
      Indien de in de artikelen 144 en 145 bedoelde opstelplaatsen voor een stooktoestel en voor een warmwatertoestel
      zijn gelegen in het gebouw, bedoeld in artikel 140, moet de voorziening voor gas, bedoeld in artikel 113, eerste
      lid, opdat op die voorziening op gas gestookte verbrandingstoestellen kunnen worden aangesloten, voorts ten minste
      één aansluitpunt hebben ter plaatse van die opstelplaatsen, met dien verstande dat indien het stooktoestel en
      warmwatertoestel zijn samengevoegd, mag zijn volstaan met één aansluitpunt.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel114
  - number: '114.3'
    text: |-
      De voorziening voor gas, bedoeld in artikel 113, tweede lid, moet, opdat op die voorziening op gas gestookte
      verbrandingstoestellen kunnen worden aangesloten, onderscheidenlijk ten minste één aansluitpunt hebben ter plaatse
      van:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel114
  - number: 114.3.a
    text: de opstelplaats voor een kooktoestel, bedoeld in artikel 142;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel114
  - number: 114.3.b
    text: |-
      de opstelplaats voor een stooktoestel, bedoeld in artikel 144, indien die opstelplaats in de woonwagen is gelegen,
      en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel114
  - number: 114.3.c
    text: |-
      de opstelplaats voor een warmwatertoestel, bedoeld in artikel 145, indien die opstelplaats in de woonwagen is
      gelegen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel114
  - number: '114.4'
    text: |-
      Het derde lid, aanhef en onderdeel *c*, is niet van toepassing, indien in de woonwagen het stooktoestel en het
      warmwatertoestel zijn samengevoegd.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel114
  - number: '115'
    text: |-
      Een beweegbaar constructie-onderdeel van een woonwagen mag zich, ter voorkoming van gevaar voor gebruikers van een
      aangrenzend perceel of terrein of van een aangrenzende openbare weg, in geopende stand slechts bevinden boven de
      standplaats waarop de woonwagen is geplaatst.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel115
  - number: '116.1'
    text: |-
      Materiaal, toegepast ter plaatse van of in de nabijheid van een in NEN 6061 bedoelde stookplaats moet, ter
      beperking van het ontstaan van een brandgevaarlijke situatie, onbrandbaar zijn als bedoeld in NEN 6064, voor zover:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel116
  - number: 116.1.a
    text: |-
      ter plaatse van of in de nabijheid van die stookplaats een overeenkomstig NEN 6061 bepaalde intensiteit van de
      warmtestraling kan optreden van meer dan 2 kW/m2, of
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel116
  - number: 116.1.b
    text: in dat materiaal een overeenkomstig NEN 6061 bepaalde temperatuur kan optreden van meer dan 363 K.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel116
  - number: '116.2'
    text: Onverminderd het eerste lid, moet een voorziening voor de afvoer van rook brandveilig zijn overeenkomstig NEN 6062.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel116
  - number: '116.3'
    text: |-
      Onverminderd het tweede lid, moet materiaal waaruit de voorziening voor de afvoer van rook is samengesteld, alsmede
      materiaal dat in de nabijheid van die voorziening is toegepast, voor zover in dat materiaal een overeenkomstig NEN
      6062 bepaalde temperatuur kan optreden van meer dan 363 K, onbrandbaar zijn als bedoeld in NEN 6064.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel116
  - number: '116.4'
    text: Het dak van een woonwagen mag, bepaald overeenkomstig NEN 6063, niet brandgevaarlijk zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel116
  - number: '117.1'
    text: |-
      Een constructie-onderdeel van een woonwagen, met uitzondering van het dak en de vloer, moet, opdat gebruikers van
      de woonwagen direct na het uitbreken van brand op veilige wijze uit de woonwagen kunnen vluchten of daaruit kunnen
      worden gered, ten minste behoren tot klasse 4 van de in NEN 6065 bedoelde bijdrage tot brandvoortplanting, bepaald
      overeenkomstig die norm.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel117
  - number: '117.2'
    text: |-
      De vloer van een woonwagen moet ten minste behoren tot klasse T3 van de in NEN 1775 bedoelde bijdrage tot
      brandvoortplanting, bepaald overeenkomstig die norm.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel117
  - number: '117.3'
    text: |-
      De in NEN 6066 bedoelde rookproduktie van een constructie-onderdeel mag aan de naar een besloten ruimte van de
      woonwagen toegekeerde zijde, bepaald overeenkomstig die norm, geen grotere rookdichtheid als bedoeld in die norm
      hebben dan 10 m-1.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel117
  - number: '117.4'
    text: |-
      Het eerste tot en met derde lid zijn niet van toepassing op ten hoogste 5% van de totale oppervlakte van de in die
      leden bedoelde constructie-onderdelen van elke afzonderlijke ruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel117
  - number: '118.1'
    text: |-
      De in NEN 6068 bedoelde weerstand tegen branddoorslag en brandoverslag tussen een woonwagen en een besloten ruimte
      moet, ter beperking van uitbreiding van brand, bepaald overeenkomstig die norm, ten minste 30 minuten zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel118
  - number: '118.2'
    text: |-
      Bij de bepaling van de weerstand, bedoeld in het eerste lid, moet zijn uitgegaan van een identieke, doch
      spiegelsymmetrisch op een afstand van 5 m geplaatste woonwagen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel118
  - number: '119.1'
    text: |-
      Indien niet is voldaan aan enig voorschrift, gegeven bij of krachtens de artikelen 111 tot en met 118, moeten een
      woonwagen en een standplaats een mate van veiligheid bieden die ten minste gelijk is aan de mate van veiligheid die
      is beoogd met het desbetreffende bij of krachtens die artikelen gegeven voorschrift.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel119
  - number: '119.2'
    text: |-
      Indien toepassing is gegeven aan het eerste lid en het desbetreffende voorschrift tevens valt te herleiden tot
      overwegingen van gezondheid, bruikbaarheid of energiezuinigheid, moeten die overwegingen daarbij in ten minste
      dezelfde mate in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel119
  - number: '120'
    text: |-
      De in NEN 5077 bedoelde karakteristieke geluidwering van een uitwendige scheidingsconstructie van een woonwagen
      moet, ter beperking van geluidhinder in de woonwagen, bepaald overeenkomstig die norm, ten minste 20 dB(A) zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel120
  - number: '121'
    text: |-
      Een uitwendige scheidingsconstructie van een woonwagen moet, ter beperking van het kunnen binnendringen van vocht
      in de woonwagen, bepaald overeenkomstig NEN 2778, waterdicht zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel121
  - number: '122.1'
    text: |-
      De in NEN 2778 bedoelde factor van de temperatuur van de binnenoppervlakte van een uitwendige scheidingsconstructie
      van een woonwagen mag, ter beperking van vorming van allergenen, bepaald overeenkomstig die norm, niet lager zijn
      dan 0,65.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel122
  - number: '122.2'
    text: |-
      Het eerste lid is niet van toepassing op in de in dat lid bedoelde scheidingsconstructie aanwezige kozijnen,
      alsmede op in die constructie aanwezige deuren en ramen of daarmee gelijk te stellen constructie-onderdelen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel122
  - number: '122.3'
    text: |-
      Een constructie die de scheiding vormt tussen een toiletruimte en een andere besloten ruimte of de buitenlucht
      mag, ter beperking van het vanuit de toiletruimte kunnen binnendringen van vocht in die constructie, aan de naar de
      toiletruimte toegekeerde oppervlakte tot een hoogte van 1,2 m boven de vloer van die ruimte, bepaald overeenkomstig
      NEN 2778, gemiddeld geen grotere wateropname als bedoeld in die norm hebben dan 0,01 kg/(m2.s½), met dien verstande
      dat op geen enkele plaats op die oppervlakte de wateropname groter mag zijn dan 0,2 kg/(m2.s½).
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel122
  - number: '122.4'
    text: |-
      Het derde lid is van overeenkomstige toepassing op een badruimte, met dien verstande dat ter plaatse van het
      bad of de douche over een lengte van ten minste 3 m een hoogte van 2,1 m boven de vloer van die ruimte moet zijn
      aangehouden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel122
  - number: '123.1'
    text: |-
      Op een standplaats moet, ter voorkoming van een voor de gezondheid onaanvaardbare situatie op de standplaats, een
      voorziening aanwezig zijn voor de afvoer van afvalwater en faecaliën, die kan worden aangesloten op het openbaar
      riool.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel123
  - number: '123.2'
    text: |-
      Een woonwagen moet, ter voorkoming van een voor de gezondheid onaanvaardbare situatie in de woonwagen, een
      voorziening hebben voor de afvoer van afvalwater en faecaliën, die is aangesloten op de voorziening, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel123
  - number: '123.3'
    text: 'De voorziening voor afvalwater en faecaliën van een standplaats heeft ten minste één aansluitpunt:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel123
  - number: 123.3.a
    text: in een toiletruimte, gelegen in het gebouw, bedoeld in artikel 140;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel123
  - number: 123.3.b
    text: in een badruimte, gelegen in het gebouw, bedoeld in artikel 140, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel123
  - number: 123.3.c
    text: bij een opstelplaats voor wasapparatuur, gelegen in het gebouw, bedoeld in artikel 140.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel123
  - number: '123.4'
    text: 'De voorziening voor afvalwater en faecaliën van een woonwagen heeft ten minste één aansluitpunt:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel123
  - number: 123.4.a
    text: bij een opstelplaats voor het aanrecht;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel123
  - number: 123.4.b
    text: in een toiletruimte;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel123
  - number: 123.4.c
    text: in een badruimte, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel123
  - number: 123.4.d
    text: bij een opstelplaats voor wasapparatuur.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel123
  - number: '123.5'
    text: |-
      De voorzieningen voor afvalwater en faecaliën, bedoeld in het eerste en tweede lid, moeten, bepaald overeenkomstig
      NEN 3215, een capaciteit hebben die ten minste gelijk is aan de in die norm aangegeven belasting van die
      voorzieningen en moeten, bepaald overeenkomstig die norm, lucht- en waterdicht zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel123
  - number: '124.1'
    text: |-
      Op een standplaats moet, ter voorkoming van een voor de gezondheid onaanvaardbare situatie op die standplaats, een
      voorziening aanwezig zijn voor de afvoer van hemelwater, die kan worden aangesloten op het openbaar riool.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel124
  - number: '124.2'
    text: Het dak van een woonwagen moet een voorziening hebben voor de opvang en afvoer van hemelwater.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel124
  - number: '124.3'
    text: |-
      De uitmonding van de in het tweede lid bedoelde voorziening voor de afvoer van hemelwater moet, verticaal gemeten,
      zijn gelegen op een afstand van ten hoogste 0,5 m boven de standplaats waarop de woonwagen is geplaatst.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel124
  - number: '124.4'
    text: |-
      De voorzieningen, bedoeld in het eerste en tweede lid, moeten een capaciteit hebben die, bepaald overeenkomstig NEN
      3215, ten minste gelijk is aan de overeenkomstig die norm bepaalde belasting van die voorzieningen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel124
  - number: '124.5'
    text: |-
      De voorziening voor hemelwater, bedoeld in het eerste lid, mag zijn samengevoegd met de voorziening voor afvalwater
      en faecaliën, bedoeld in artikel 123, eerste lid, tenzij de voorziening voor hemelwater kan worden aangesloten op
      het openbaar riool dat uitsluitend is bestemd voor de afvoer van hemelwater.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel124
  - number: '124.6'
    text: |-
      Indien toepassing is gegeven aan het vijfde lid, moet de samengevoegde voorziening, bepaald overeenkomstig NEN
      3215, een capaciteit hebben die ten minste gelijk is aan de overeenkomstig die norm bepaalde belasting van die
      voorziening.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel124
  - number: '125.1'
    text: |-
      In een verblijfsruimte, toiletruimte en badruimte van een woonwagen moet, ter beperking van het ontstaan van een
      voor de gezondheid nadelige kwaliteit van de binnenlucht, een voorziening aanwezig zijn voor de toevoer van verse
      lucht en de afvoer van binnenlucht.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel125
  - number: '125.2'
    text: |-
      De inrichting van de voorziening voor de toevoer van verse lucht en de afvoer van binnenlucht moet voldoen aan NEN
      1087, met dien verstande dat bij de bepaling van de richting van de luchtstroming en de ligging van een opening van
      de voorziening, bouwwerken en daarmee gelijk te stellen belemmeringen buiten beschouwing blijven.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel125
  - number: '125.3'
    text: |-
      De voorziening voor de toevoer van verse lucht naar een verblijfsruimte en voor de afvoer van binnenlucht uit
      die ruimte moet, bepaald overeenkomstig NEN 1087, een capaciteit hebben van ten minste 0,8.10-3 m3/s per m2
      vloeroppervlakte van die ruimte, met een minimum van 7.10-3 m3/s.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel125
  - number: '125.4'
    text: |-
      Onverminderd het derde lid, moet, indien in de verblijfsruimte een opstelplaats voor een kooktoestel is gelegen,
      de in dat lid bedoelde capaciteit ten minste 21.10-3 m3/s zijn, met dien verstande dat de afvoer van die capaciteit
      rechtstreeks naar buiten moet plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel125
  - number: '125.5'
    text: |-
      Ten minste 50% van de capaciteit voor de toevoer van verse lucht, bedoeld in het derde en vierde lid, moet
      rechtstreeks van buiten plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel125
  - number: '125.6'
    text: |-
      De voorziening voor de toevoer van verse lucht en de afvoer van binnenlucht moet, bepaald overeenkomstig NEN 1087,
      een capaciteit hebben van ten minste:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel125
  - number: 125.6.a
    text: 7.10-3 m3/s voor een toiletruimte, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel125
  - number: 125.6.b
    text: 14.10-3 m3/s voor een al of niet met een toiletruimte samengevoegde badruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel125
  - number: '125.7'
    text: De afvoer van binnenlucht, bedoeld in het zesde lid, moet rechtstreeks naar buiten plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel125
  - number: '125.8'
    text: |-
      In het totaal van de uitwendige scheidingsconstructies van een woonwagen moeten, opdat sterk verontreinigde
      binnenlucht snel kan worden afgevoerd, beweegbare constructie-onderdelen aanwezig zijn waarmee, bepaald
      overeenkomstig NEN 1087, een totale capaciteit voor de toevoer van buitenlucht en de afvoer van binnenlucht kan
      worden bewerkstelligd van ten minste 6.10-3 m3/s per m2 gebruiksoppervlakte van de woonwagen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel125
  - number: '125.9'
    text: |-
      Onverminderd het achtste lid, moet in een verblijfsruimte een capaciteit voor de toevoer van buitenlucht en de
      afvoer van binnenlucht kunnen worden bewerkstelligd van ten minste 3.10-3 m3/s per m2 vloeroppervlakte van die
      ruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel125
  - number: '126.1'
    text: |-
      In een woonwagen of in een gebouw als bedoeld in artikel 140, moet, tenzij artikel 113, derde lid, van toepassing
      is, ter voorkoming van een onaanvaardbare ophoping van vergiftige of hinderlijke gassen, ten behoeve van een
      opstelplaats voor een verbrandingstoestel, niet zijnde een kooktoestel met een nominale belasting als bedoeld
      in NEN 2757 van niet meer dan 15 kW, een voorziening voor de toevoer van verbrandingslucht en de afvoer van rook
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel126
  - number: '126.2'
    text: |-
      De voorziening voor de toevoer van verbrandingslucht en de afvoer van rook moet, wat de toevoer van
      verbrandingslucht betreft, bepaald overeenkomstig NEN 1087, en wat de afvoer van rook betreft, bepaald
      overeenkomstig NEN 2757, een in NEN 2757 aangegeven capaciteit hebben.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel126
  - number: '126.3'
    text: 'Onverminderd het tweede lid, moet ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel126
  - number: 126.3.a
    text: |-
      de opstelplaats voor een kooktoestel, bedoeld in artikel 142, zijn uitgegaan van een op gas gestookt toestel met
      een belasting van ten minste 2 kW;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel126
  - number: 126.3.b
    text: |-
      de opstelplaats voor een stooktoestel, bedoeld in artikel 144, zijn uitgegaan van een op gas gestookt toestel met
      een belasting van ten minste 6 kW, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel126
  - number: 126.3.c
    text: |-
      de opstelplaats voor een warmwatertoestel, bedoeld in artikel 145, zijn uitgegaan van een op gas gestookt toestel
      met een belasting van ten minste 6 kW.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel126
  - number: '126.4'
    text: |-
      In afwijking in zoverre van het derde lid, mag, indien het warmwatertoestel is samengevoegd met het stooktoestel,
      zijn uitgegaan van een belasting van dat samengevoegde toestel van ten minste 6 kW.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel126
  - number: '126.5'
    text: |-
      De inrichting van een voorziening voor de toevoer van verbrandingslucht en de afvoer van rook, voor zover die
      voorziening is bestemd voor de toevoer van verbrandingslucht, moet, indien die toevoer rechtstreeks van buiten
      plaatsvindt, wat de snelheid en de richting van de luchtstroming alsmede de regelbaarheid van de voorziening
      betreft, ten minste voldoen aan NEN 2757, met dien verstande dat bij de bepaling van die richting en van de ligging
      van een opening van de voorziening, bouwwerken en daarmee gelijk te stellen belemmeringen buiten beschouwing
      blijven.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel126
  - number: '126.6'
    text: |-
      De inrichting van een voorziening voor de toevoer van verbrandingslucht en de afvoer van rook moet, voor zover
      die voorziening is bestemd voor de afvoer van rook, ten minste voldoen aan NEN 2757, met dien verstande dat bij de
      bepaling van de plaats van de uitmonding van die voorziening, bouwwerken en daarmee gelijk te stellen belemmeringen
      buiten beschouwing blijven.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel126
  - number: '127'
    text: |-
      Bij ministeriële regeling kunnen, ter beperking van de aanwezigheid in de woonwagen van een voor de
      gezondheid onaanvaardbare mate van vergiftige of hinderlijke stoffen of van ioniserende stralen als bedoeld in
      [artikel 1, eerste lid, onderdeel ][ref1], voorschriften worden gegeven omtrent het in de constructie van een
      woonwagen toepassen van materialen waaruit die stoffen kunnen vrijkomen of die stralen kunnen ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel1
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '1'
  - number: '128'
    text: |-
      Bij ministeriële regeling kunnen, ter beperking van blootstelling van gebruikers van een woonwagen aan uit de grond
      afkomstige schadelijke stoffen of straling, voorschriften worden gegeven waaraan de vloer van een woonwagen moet
      voldoen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel128
  - number: '129.1'
    text: |-
      In een uitwendige scheidingsconstructie van een woonwagen mogen zich, ter beperking van het in de woonwagen kunnen
      binnendringen van ratten en muizen, geen onafsluitbare openingen bevinden die breder zijn dan 0,01 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel129
  - number: '129.2'
    text: |-
      Het eerste lid is niet van toepassing op een opening die aan de bovenkant de uitmonding vormt van een verticaal
      kanaal.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel129
  - number: '130.1'
    text: |-
      Op een standplaats moet, opdat kan worden beschikt over voor de menselijke consumptie en hygiëne geschikt water,
      een voorziening voor drinkwater aanwezig zijn die ten minste voldoet aan artikel 5, eerste lid, onderdeel 2,
      van de Model-aansluitvoorwaarden voor drinkwater van de Vereniging van Exploitanten van Waterleidingbedrijven in
      Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel130
  - number: '130.2'
    text: |-
      In een woonwagen moet een voorziening voor drinkwater aanwezig zijn die is aangesloten op de voorziening,
      bedoeld in het eerste lid, en die ten minste voldoet aan artikel 5, eerste lid, onderdeel 2, van de Model-
      aansluitvoorwaarden voor drinkwater van de Vereniging van Exploitanten van Waterleidingbedrijven in Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel130
  - number: '131.1'
    text: |-
      De voorziening voor drinkwater, bedoeld in artikel 130, eerste lid, moet, opdat drinkwater kan worden betrokken, in
      de meterruimte een aansluitmogelijkheid hebben voor aansluiting op het distributienet van drinkwater.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel131
  - number: '131.2'
    text: |-
      De voorziening voor drinkwater van een standplaats heeft, opdat op die voorziening watertoestellen kunnen worden
      aangesloten, voorts ten minste één aansluitpunt:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel131
  - number: 131.2.a
    text: in een toiletruimte, gelegen in het gebouw, bedoeld in artikel 140;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel131
  - number: 131.2.b
    text: in een badruimte, gelegen in het gebouw, bedoeld in artikel 140;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel131
  - number: 131.2.c
    text: bij een opstelplaats voor wasapparatuur, gelegen in het gebouw, bedoeld in artikel 140, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel131
  - number: 131.2.d
    text: bij een opstelplaats voor het warmwatertoestel, gelegen in het gebouw, bedoeld in artikel 140.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel131
  - number: '131.3'
    text: 'De voorziening voor drinkwater van een woonwagen heeft ten minste één aansluitpunt:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel131
  - number: 131.3.a
    text: bij een opstelplaats voor het aanrecht;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel131
  - number: 131.3.b
    text: in een toiletruimte;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel131
  - number: 131.3.c
    text: in een badruimte;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel131
  - number: 131.3.d
    text: bij een opstelplaats voor wasapparatuur, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel131
  - number: 131.3.e
    text: een opstelplaats voor een warmwatertoestel.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel131
  - number: '132.1'
    text: |-
      Indien de badruimte, bedoeld in artikel 139, of de opstelplaats voor een warmwatertoestel, bedoeld in artikel 145,
      zich bevindt in het gebouw, bedoeld in artikel 140, moet, opdat kan worden beschikt over voor de menselijke hygiëne
      geschikt warm water, op de standplaats een voorziening aanwezig zijn voor warm water, waarvan de inrichting ten
      minste voldoet aan artikel 5, eerste lid, onderdeel 2, van de Model-aansluitvoorwaarden voor drinkwater van de
      Vereniging van Exploitanten van Waterleidingbedrijven in Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel132
  - number: '132.2'
    text: |-
      Indien de badruimte, bedoeld in artikel 139, of de opstelplaats voor een warmwatertoestel, bedoeld in artikel
      145, zich in de woonwagen bevindt, moet in de woonwagen een voorziening aanwezig zijn voor warm water, waarvan
      de inrichting ten minste voldoet aan artikel 5, eerste lid, onderdeel 2, van de Model-aansluitvoorwaarden voor
      drinkwater van de Vereniging van Exploitanten van Waterleidingbedrijven in Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel132
  - number: '132.3'
    text: |-
      De warmwatervoorziening van een standplaats heeft, opdat op die voorziening watertoestellen kunnen worden
      aangesloten, ten minste één aansluitpunt:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel132
  - number: 132.3.a
    text: in een badruimte gelegen in het gebouw, bedoeld in artikel 140, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel132
  - number: 132.3.b
    text: bij een opstelplaats voor het warmwatertoestel, gelegen in het gebouw, bedoeld in artikel 140.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel132
  - number: '132.4'
    text: 'De warmwatervoorziening van een woonwagen heeft ten minste één aansluitpunt:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel132
  - number: 132.4.a
    text: in een badruimte, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel132
  - number: 132.4.b
    text: bij een opstelplaats voor het warmwatertoestel.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel132
  - number: '133.1'
    text: |-
      In het totaal van de uitwendige scheidingsconstructies van de verblijfsruimten van een woonwagen moet, met het oog
      op de toetreding van daglicht en het uitzicht naar buiten, een equivalente daglichtoppervlakte als bedoeld in NEN
      2057 aanwezig zijn die, bepaald overeenkomstig die norm, ten minste gelijk is aan 8% van de gebruiksoppervlakte
      van de woonwagen, met dien verstande dat in elke verblijfsruimte van de woonwagen ten minste 0,5 m2 aan equivalente
      daglichtoppervlakte aanwezig moet zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel133
  - number: '133.2'
    text: |-
      Bij de bepaling van de in het eerste lid bedoelde equivalente daglichtoppervlakte blijven bouwwerken en daarmee
      gelijk te stellen belemmeringen buiten beschouwing en moet de in rekening te brengen belemmeringshoek α, bedoeld in
      NEN 2057, ten minste 25° zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel133
  - number: '134.1'
    text: |-
      Indien niet is voldaan aan enig voorschrift, gegeven bij of krachtens de artikelen 120 tot en met 133, moeten een
      woonwagen en een standplaats een mate van bescherming van de gezondheid bieden, die ten minste gelijk is aan de
      mate van bescherming die is beoogd met het desbetreffende bij of krachtens die artikelen gegeven voorschrift.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel134
  - number: '134.2'
    text: |-
      Indien toepassing is gegeven aan het eerste lid en het desbetreffende voorschrift tevens valt te herleiden tot
      overwegingen van veiligheid, bruikbaarheid of energiezuinigheid, moeten die overwegingen daarbij in ten minste
      dezelfde mate in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel134
  - number: '135.1'
    text: |-
      De oppervlakte van een standplaats moet, opdat de woonwagen met bijbehorende voorzieningen daarop kan worden
      geplaatst, ten minste 160 m2 zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel135
  - number: '135.2'
    text: |-
      Van de standplaats moet in elk geval een oppervlak deel uitmaken met een lengte van ten minste 16,5 m en een
      breedte van ten minste 7,5 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel135
  - number: '136'
    text: |-
      De toegang van een woonwagen moet, met het oog op de toegankelijkheid, een vrije doorgang hebben met een breedte
      van ten minste 0,8 m en een hoogte van ten minste 2,1 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel136
  - number: '137.1'
    text: |-
      In een woonwagen moet, opdat daarin voor het wonen kenmerkende activiteiten kunnen plaatsvinden, ten minste 60% van
      de gebruiksoppervlakte, met een minimum van 24 m2, in een of meer verblijfsruimten zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel137
  - number: '137.2'
    text: |-
      Een verblijfsruimte moet een vloeroppervlakte hebben van ten minste 4 m2, waarvan de breedte ten minste 1,6 m en de
      hoogte boven die oppervlakte ten minste 2,2 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel137
  - number: '137.3'
    text: |-
      In afwijking in zoverre van het tweede lid, moet ten minste één in de woonwagen gelegen verblijfsruimte een
      vloeroppervlakte hebben van ten minste 12 m2, waarvan de breedte ten minste 3 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel137
  - number: '137.4'
    text: |-
      Indien de in het derde lid bedoelde vloeroppervlakte nabij de toegang van de woonwagen is gelegen, mag de afstand
      tussen de toegang en die vloeroppervlakte niet minder zijn dan 0,9 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel137
  - number: '137.5'
    text: |-
      Een verblijfsruimte moet vanaf de toegang van de woonwagen bereikbaar zijn zonder dat een toiletruimte, badruimte
      of bergruimte behoeft te worden betreden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel137
  - number: '138.1'
    text: |-
      In een woonwagen moet, opdat sanitaire handelingen kunnen worden verricht, ten minste één afsluitbare toiletruimte
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel138
  - number: '138.2'
    text: |-
      In afwijking in zoverre van het eerste lid, mag de in dat lid bedoelde toiletruimte deel uitmaken van het gebouw,
      bedoeld in artikel 140.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel138
  - number: '138.3'
    text: |-
      De toiletruimte, bedoeld in het eerste of tweede lid, moet een vloeroppervlakte hebben van ten minste 1 m2, waarvan
      de breedte ten minste 0,8 m en de hoogte boven die oppervlakte ten minste 2,1 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel138
  - number: '139.1'
    text: In een woonwagen moet, met het oog op het zich kunnen wassen, ten minste één afsluitbare badruimte aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel139
  - number: '139.2'
    text: |-
      In afwijking in zoverre van het eerste lid, mag de in dat lid bedoelde badruimte deel uitmaken van het gebouw,
      bedoeld in artikel 140.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel139
  - number: '139.3'
    text: |-
      De badruimte, bedoeld in het eerste of tweede lid, moet een vloeroppervlakte hebben van ten minste 1,6 m2, waarvan
      de breedte ten minste 0,8 m en de hoogte boven die oppervlakte ten minste 2,1 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel139
  - number: '139.4'
    text: |-
      Een badruimte mag, met het oog op een doelmatige benutting van de gebruiksoppervlakte van de woonwagen of van
      het gebouw, bedoeld in artikel 140, zijn samengevoegd met een toiletruimte, mits de vloeroppervlakte van die
      samengevoegde ruimte ten minste 2,6 m2 is, waarvan de breedte ten minste 0,8 m en de hoogte boven die oppervlakte
      ten minste 2,1 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel139
  - number: '140.1'
    text: |-
      Op een standplaats moet, opdat voorwerpen beschermd tegen weer en wind kunnen worden opgeborgen, ten behoeve van
      een woonwagen een gebouw aanwezig zijn waarin zich een bergruimte bevindt met een vloeroppervlakte van ten minste 6
      m2, waarvan de breedte ten minste 1,8 m en de hoogte boven die oppervlakte ten minste 2,1 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel140
  - number: '140.2'
    text: |-
      Een uitwendige scheidingsconstructie van het gebouw, bedoeld in het eerste lid, moet, ter beperking van het kunnen
      binnendringen van vocht in dat gebouw, bepaald overeenkomstig NEN 2778, ten minste regenwerend zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel140
  - number: '141.1'
    text: |-
      Tot het gebouw, bedoeld in artikel 140, moet, opdat de centrale schakel-, verdeel- en meetapparatuur voor
      elektriciteit, gas, water, telecommunicatiesignalen en, voor zover van toepassing, stadsverwarming kan worden
      geplaatst, een afsluitbare meterruimte behoren die wat afmetingen, indeling en leidingdoorvoeren betreft, ten
      minste voldoet aan NEN 2768.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel141
  - number: '141.2'
    text: |-
      Een uitwendige scheidingsconstructie van de meterruimte moet, ter beperking van het kunnen binnendringen van vocht
      in die ruimte, bepaald overeenkomstig NEN 2778, ten minste regenwerend zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel141
  - number: '142.1'
    text: |-
      Ten minste één verblijfsruimte van een woonwagen heeft, opdat spijzen kunnen worden bereid, een opstelplaats voor
      een aanrecht en een opstelplaats voor een kooktoestel.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel142
  - number: '142.2'
    text: De opstelplaats voor het aanrecht heeft een vloeroppervlakte van ten minste 1,5 m x 0,6 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel142
  - number: '142.3'
    text: |-
      De opstelplaats voor een kooktoestel, bedoeld in het eerste lid, moet een vloeroppervlakte hebben van ten minste
      0,6 m * 0,6 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel142
  - number: '142.4'
    text: |-
      De opstelplaatsen voor het aanrecht en voor het kooktoestel liggen niet op de vloeroppervlakte van 12 m2 met een
      breedte van ten minste 3 m2.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel142
  - number: '143.1'
    text: |-
      In een woonwagen moet, opdat kleding en linnengoed kunnen worden gewassen, ten minste één opstelplaats voor
      wasapparatuur aanwezig zijn, die niet in een verblijfsruimte mag zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel143
  - number: '143.2'
    text: |-
      In afwijking van het eerste lid, mag de opstelplaats voor wasapparatuur zijn gelegen in het gebouw, bedoeld in
      artikel 140.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel143
  - number: '143.3'
    text: |-
      De opstelplaats, bedoeld in het eerste of tweede lid, moet een vloeroppervlakte hebben van ten minste 1 m2, waarvan
      de breedte ten minste 0,8 m en de hoogte boven die oppervlakte ten minste 2,1 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel143
  - number: '143.4'
    text: |-
      Indien de opstelplaats, bedoeld in het eerste of tweede lid, is gelegen in een toiletruimte of badruimte dan wel
      in de bergruimte, bedoeld in artikel 140, moet de vloeroppervlakte van die ruimten, bedoeld in onderscheidenlijk de
      artikelen 138, derde lid, 139, derde lid, en 140, eerste lid, zijn vermeerderd met ten minste 1 m2.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel143
  - number: '144.1'
    text: |-
      In een woonwagen moet, opdat verwarmingsapparatuur kan worden geplaatst, ten minste één opstelplaats voor een
      stooktoestel aanwezig zijn, die niet mag zijn gelegen in een toiletruimte of badruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel144
  - number: '144.2'
    text: |-
      In afwijking in zoverre van het eerste lid, mag de opstelplaats voor een stooktoestel zijn gelegen in het gebouw,
      bedoeld in artikel 140.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel144
  - number: '144.3'
    text: |-
      Het eerste lid is niet van toepassing, indien de woonwagen kan worden aangesloten op het distributienet van de
      stadsverwarming of op een andere voorziening die is bestemd voor het verwarmen van meer dan één woonwagen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel144
  - number: '145.1'
    text: |-
      In een woonwagen moet, opdat apparatuur voor het opwarmen van water kan worden geplaatst, ten minste één
      opstelplaats voor een warmwatertoestel zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel145
  - number: '145.2'
    text: |-
      In afwijking van het eerste lid, mag de opstelplaats voor een warmwatertoestel zijn gelegen in het gebouw, bedoeld
      in artikel 140.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel145
  - number: '145.3'
    text: |-
      Het eerste lid is niet van toepassing, indien het warmwatertoestel is samengevoegd met een stooktoestel of de
      woonwagen kan worden aangesloten op een warmwatervoorziening die is bestemd voor meer dan één woonwagen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel145
  - number: '146.1'
    text: |-
      Op een standplaats moet, opdat telecommunicatiesignalen kunnen worden ontvangen, een voorziening aanwezig zijn die
      ten minste bestaat uit twee afzonderlijke, onbedrade buizen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel146
  - number: '146.2'
    text: |-
      De voorziening, bedoeld in het eerste lid, moet in de meterruimte een aansluitmogelijkheid hebben voor aansluiting
      op het openbare telefoonnet, alsmede een aansluitmogelijkheid voor aansluiting op een gemeenschappelijke of
      centrale antenne-inrichting.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel146
  - number: '146.3'
    text: |-
      In een woonwagen moet, opdat telecommunicatiesignalen kunnen worden ontvangen, een voorziening aanwezig zijn die is
      aangesloten op de voorziening, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel146
  - number: '146.4'
    text: |-
      De voorziening, bedoeld in het derde lid, moet in ten minste één verblijfsruimte ten minste één aansluitpunt hebben
      voor onderscheidenlijk een telefoontoestel, radiotoestel en televisietoestel.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel146
  - number: '146.5'
    text: |-
      De voorziening, bedoeld in het derde lid, moet ten minste bestaan uit twee afzonderlijke, onbedrade buizen die
      vanaf de buitenzijde van een uitwendige scheidingsconstructie van de woonwagen leiden naar de aansluitpunten,
      bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel146
  - number: '146.6'
    text: |-
      De voorziening, bedoeld in het derde lid, moet voorts bij de onderscheiden aansluitpunten, bedoeld in het vierde
      lid, ten minste één inbouwdoos hebben.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel146
  - number: '147.1'
    text: |-
      De bovenkant van een element van de op een standplaats ten behoeve van een woonwagen aanwezige fundering, bedoeld
      in artikel 111, eerste lid, mag, ter beperking van verzakking of scheefzakking van de woonwagen, bij momentane
      belastingscombinaties als bedoeld in NEN 6702, bepaald overeenkomstig NEN 6740, geen grotere zakking hebben dan
      0,15 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel147
  - number: '147.2'
    text: |-
      Onverminderd het eerste lid, mag de som van de rotatie en de relatieve rotatie aan de bovenkant van het in het
      eerste lid bedoelde funderingselement niet groter zijn dan 3,5.10-3 rad.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel147
  - number: '147.3'
    text: |-
      Onverminderd het eerste en tweede lid, moet voor de bepaling van de op de bouwconstructie van de fundering aan te
      brengen belastingscombinatie zijn uitgegaan van:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel147
  - number: 147.3.a
    text: |-
      een laststelsel, bestaande uit twee verticale, evenwijdige lijnlasten die elk een rekenwaarde hebben ter grootte
      van 5,6 kN/m en een lengte van 15 m, en die op een afstand van ten minste 2,5 m en ten hoogste 3 m van elkaar
      moeten zijn gelegen;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel147
  - number: 147.3.b
    text: |-
      een puntlast met een rekenwaarde van 40 kN, die als vrije belasting als bedoeld in NEN 6702, in rekening moet zijn
      gebracht, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel147
  - number: 147.3.c
    text: de rekenwaarde van het eigen gewicht van de fundering.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel147
  - number: '147.4'
    text: |-
      In afwijking in zoverre van het derde lid, moet, indien de standplaats is gelegen in een onbebouwd gebied I als
      bedoeld in NEN 6702, voor de in dat lid bedoelde lijnlasten zijn uitgegaan van rekenwaarde ter grootte van 6 kN/m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel147
  - number: '148.1'
    text: |-
      De vloer van een woonwagen mag, ter beperking van doorbuiging, bij de respons die voortvloeit uit de in NEN 6702
      bedoelde incidentele en momentane belastingscombinaties, geen grotere doorbuiging in de eindtoestand als bedoeld in
      die norm hebben dan het produkt van 4.10-3 en de in die norm bedoelde overspanning van die vloer.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel148
  - number: '148.2'
    text: |-
      De doorbuiging, bedoeld in het eerste lid, moet zijn bepaald overeenkomstig het gestelde met betrekking tot de
      bepaling van de vervorming in:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel148
  - number: 148.2.a
    text: NEN 6710 en 6770, indien de vloer is vervaardigd van in die normen bedoeld metaal, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel148
  - number: 148.2.b
    text: NEN 6760, indien de vloer is vervaardigd van in die norm bedoeld hout.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel148
  - number: '148.3'
    text: |-
      Indien een ander materiaal of een andere bepalingsmethode is toegepast dan in het tweede lid bedoeld, moet de
      doorbuiging, bedoeld in het eerste lid, zijn bepaald overeenkomstig NEN 6700.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel148
  - number: '149.1'
    text: |-
      Indien niet is voldaan aan enig voorschrift, gegeven bij of krachtens de artikelen 135 tot en met 148, moeten
      een woonwagen en een standplaats een mate van bruikbaarheid bieden die ten minste gelijk is aan de mate van
      bruikbaarheid die is beoogd met het desbetreffende bij of krachtens die artikelen gegeven voorschrift.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel149
  - number: '149.2'
    text: |-
      Indien toepassing is gegeven aan het eerste lid en het desbetreffende voorschrift tevens valt te herleiden tot
      overwegingen van veiligheid, gezondheid of energiezuinigheid, moeten die overwegingen daarbij in ten minste
      dezelfde mate in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel149
  - number: '150.1'
    text: |-
      Een uitwendige scheidingsconstructie van een woonwagen moet, ter beperking van warmteverlies door overdracht of
      geleiding, bepaald overeenkomstig NEN 1068, een warmteweerstand hebben van ten minste 2 m2.K/W.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel150
  - number: '150.2'
    text: 'In het totaal van de uitwendige scheidingsconstructies mag:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel150
  - number: 150.2.a
    text: |-
      een oppervlakte van ten hoogste 50% van de gebruiksoppervlakte van de woonwagen aan ramen, deuren, kozijnen en
      daarmee gelijk te stellen constructie-onderdelen aanwezig zijn, welke oppervlakte niet behoeft te voldoen aan het
      eerste lid, mits die oppervlakte, bepaald overeenkomstig NEN 5128, een warmtedoorgangscoëfficiënt heeft van ten
      hoogste 4,2 W/m2.K, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel150
  - number: 150.2.b
    text: |-
      een oppervlakte van ten hoogste 4% van de gebruiksoppervlakte van de woonwagen aan niet in onderdeel *a* begrepen
      constructie-onderdelen aanwezig zijn, welke oppervlakte niet behoeft te voldoen aan het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel150
  - number: '150.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing, indien de woonwagen, bepaald overeenkomstig NEN 1068, een
      thermische isolatie-index als bedoeld in die norm heeft van ten minste 8.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel150
  - number: '151'
    text: |-
      Het totaal van de uitwendige scheidingsconstructies van een woonwagen mag, ter beperking van warmteverlies door
      tocht, bepaald overeenkomstig NEN 2686, geen grotere luchtvolumestroom als bedoeld in die norm hebben dan 0,2 m3/s.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel151
  - number: '152.1'
    text: |-
      Indien niet is voldaan aan enig voorschrift, gegeven bij of krachtens de artikelen 150 en 151, moet een woonwagen
      een mate van energiezuinigheid bieden die ten minste gelijk is aan de mate van energiezuinigheid die is beoogd met
      het desbetreffende bij of krachtens die artikelen gegeven voorschrift.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel152
  - number: '152.2'
    text: |-
      Indien toepassing is gegeven aan het eerste lid en het desbetreffende voorschrift tevens valt te herleiden tot
      overwegingen van veiligheid, gezondheid of bruikbaarheid, moeten die overwegingen daarbij in ten minste dezelfde
      mate in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel152
  - number: '153.1'
    text: |-
      Een in NEN 6702 bedoelde uiterste grenstoestand van een bouwconstructie van een woonwagen en van de op een
      standplaats ten behoeve van een woonwagen aanwezige fundering mag, opdat die woonwagen en fundering bestand zijn
      tegen de daarop werkende krachten, bij belastingscombinaties als aangegeven bij ministeriële regeling, niet zijn
      overschreden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel153
  - number: '153.2'
    text: |-
      Het niet-overschrijden van een uiterste grenstoestand als bedoeld in het eerste lid, moet zijn bepaald
      overeenkomstig bij ministeriële regeling gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel153
  - number: '154.1'
    text: |-
      Op een standplaats moet, opdat op veilige wijze over energie kan worden beschikt, een voorziening voor
      elektriciteit aanwezig zijn die is aangesloten op het distributienet van elektriciteit en die ten minste voldoet
      aan artikel 5, eerste lid, onderdeel 2, van de Model-aansluitvoorwaarden voor elektrische energie van de Vereniging
      van Exploitanten van Elektriciteitsbedrijven in Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel154
  - number: '154.2'
    text: |-
      In een woonwagen moet, opdat daarin op veilige wijze over energie kan worden beschikt, een voorziening voor
      elektriciteit aanwezig zijn die is aangesloten op de voorziening, bedoeld in het eerste lid, en die ten minste
      voldoet aan artikel 5, eerste lid, onderdeel 2, van de Model-aansluitvoorwaarden voor elektrische energie van de
      Vereniging van Exploitanten van Elektriciteitsbedrijven in Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel154
  - number: '155.1'
    text: |-
      Een op een standplaats aanwezige voorziening voor gas moet, opdat op veilige wijze over energie kan worden
      beschikt, zijn aangesloten op het distributienet van gas en moet ten minste voldoen aan artikel 5, eerste lid,
      onderdeel 2, van de Model-aansluitvoorwaarden voor gas van de Vereniging van Exploitanten van Gasbedrijven in
      Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel155
  - number: '155.2'
    text: |-
      Een in een woonwagen aanwezige voorziening voor gas moet zijn aangesloten op de voorziening, bedoeld in het eerste
      lid, en moet ten minste voldoen aan artikel 5, eerste lid, onderdeel 2, van de Model-aansluitvoorwaarden voor gas
      van de Vereniging van Exploitanten van Gasbedrijven in Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel155
  - number: '156.1'
    text: |-
      Materiaal, toegepast ter plaatse van of in de nabijheid van een in NEN 6061 bedoelde stookplaats moet, ter
      beperking van het ontstaan van een brandgevaarlijke situatie, onbrandbaar zijn als bedoeld in NEN 6064, voor zover:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel156
  - number: 156.1.a
    text: |-
      ter plaatse van of in de nabijheid van die stookplaats een overeenkomstig NEN 6061 bepaalde intensiteit van de
      warmtestraling kan optreden van meer dan 2 kW/m2, of
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel156
  - number: 156.1.b
    text: in dat materiaal een overeenkomstig NEN 6061 bepaalde temperatuur kan optreden van meer dan 363 K.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel156
  - number: '156.2'
    text: |-
      Onverminderd het eerste lid, moet een voorziening voor de afvoer van rook overeenkomstig bij ministeriële regeling
      gegeven voorschriften luchtdicht zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel156
  - number: '156.3'
    text: |-
      Onverminderd het tweede lid, moet materiaal waaruit de voorziening voor de afvoer van rook is samengesteld, alsmede
      materiaal dat in de nabijheid van die voorziening is toegepast, voor zover in dat materiaal een overeenkomstig NEN
      6062 bepaalde temperatuur kan optreden van meer dan 363 K, onbrandbaar zijn als bedoeld in NEN 6064.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel156
  - number: '157.1'
    text: |-
      Een constructie-onderdeel van een woonwagen, met uitzondering van het dak en de vloer, moet, opdat gebruikers van
      de woonwagen direct na het uitbreken van brand op veilige wijze uit de woonwagen kunnen vluchten of daaruit kunnen
      worden gered, ten minste behoren tot klasse 4 van de in NEN 6065 bedoelde bijdrage tot brandvoortplanting, bepaald
      overeenkomstig die norm.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel157
  - number: '157.2'
    text: |-
      De vloer van een woonwagen moet ten minste behoren tot klasse T3 van de in NEN 1775 bedoelde bijdrage tot
      brandvoortplanting, bepaald overeenkomstig die norm.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel157
  - number: '157.3'
    text: |-
      De in NEN 6066 bedoelde rookproduktie van een constructie-onderdeel mag aan de naar een besloten ruimte van de
      woonwagen toegekeerde zijde, bepaald overeenkomstig die norm, geen grotere rookdichtheid als bedoeld in die norm
      hebben dan 10 m-1.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel157
  - number: '157.4'
    text: |-
      Het eerste tot en met derde lid zijn niet van toepassing op ten hoogste 10% van de totale oppervlakte van de in die
      leden bedoelde constructie-onderdelen van elke afzonderlijke ruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel157
  - number: '158.1'
    text: |-
      Indien niet is voldaan aan enig voorschrift, gegeven bij of krachtens de artikelen 153 tot en met 157, moeten een
      woonwagen en een standplaats een mate van veiligheid bieden die ten minste gelijk is aan de mate van veiligheid die
      is beoogd met het desbetreffende bij of krachtens die artikelen gegeven voorschrift.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel158
  - number: '158.2'
    text: |-
      Indien toepassing is gegeven aan het eerste lid en het desbetreffende voorschrift tevens valt te herleiden tot
      overwegingen van gezondheid of bruikbaarheid, moeten die overwegingen daarbij in ten minste dezelfde mate in acht
      zijn genomen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel158
  - number: '159'
    text: |-
      Een uitwendige scheidingsconstructie van een woonwagen moet, ter beperking van het kunnen binnendringen van vocht
      in de woonwagen, bepaald overeenkomstig NEN 2778, waterdicht zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel159
  - number: '160'
    text: |-
      Een constructie die de scheiding vormt tussen een badruimte en een andere besloten ruimte of de buitenlucht
      mag, ter beperking van het vanuit de badruimte kunnen binnendringen van vocht in die constructie, aan de naar de
      badruimte toegekeerde oppervlakte tot een hoogte van 1 m boven de vloer van die ruimte, bepaald overeenkomstig NEN
      2778, gemiddeld geen grotere wateropname als bedoeld in die norm hebben dan 0,01 kg/(m2.s½), met dien verstande dat
      op geen enkele plaats op die oppervlakte de wateropname groter mag zijn dan 0,2 kg/(m2.s½).
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel160
  - number: '161.1'
    text: |-
      Op een standplaats moet, ter voorkoming van een voor de gezondheid onaanvaardbare situatie op die standplaats, een
      voorziening aanwezig zijn voor de afvoer van afvalwater en faecaliën, die is aangesloten op het openbaar riool.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel161
  - number: '161.2'
    text: |-
      Een woonwagen moet, ter voorkoming van een voor de gezondheid onaanvaardbare situatie in de woonwagen, een
      voorziening hebben voor de afvoer van afvalwater en faecaliën, die is aangesloten op de voorziening, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel161
  - number: '161.3'
    text: |-
      De voorzieningen, bedoeld in het eerste en tweede lid, moeten een zodanige afvoercapaciteit hebben dat elk op
      die voorzieningen aangesloten lozingstoestel als bedoeld in NEN 3215, binnen ten hoogste 5 minuten is geleegd, en
      moeten, bepaald overeenkomstig die norm, lucht- en waterdicht zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel161
  - number: '162.1'
    text: |-
      In een verblijfsruimte, toiletruimte en badruimte moet, ter beperking van het ontstaan van een voor de gezondheid
      nadelige kwaliteit van de binnenlucht, een voorziening aanwezig zijn voor de toevoer van verse lucht en de afvoer
      van binnenlucht.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel162
  - number: '162.2'
    text: |-
      De voorziening voor de toevoer van verse lucht naar een verblijfsruimte en voor de afvoer van binnenlucht uit die
      ruimte moet, bepaald overeenkomstig bij ministeriële regeling gegeven voorschriften, een capaciteit hebben van ten
      minste 7.10-3 m3/s.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel162
  - number: '162.3'
    text: |-
      Onverminderd het tweede lid, moet, indien in de verblijfsruimte een opstelplaats voor een kooktoestel is gelegen,
      de in dat lid bedoelde capaciteit ten minste 21.10-3 m3/s zijn, met dien verstande dat de afvoer van die capaciteit
      rechtstreeks naar buiten moet plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel162
  - number: '162.4'
    text: |-
      De voorziening voor de toevoer van verse lucht en de afvoer van binnenlucht moet, bepaald overeenkomstig bij
      ministeriële regeling gegeven voorschriften, een capaciteit hebben van ten minste:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel162
  - number: 162.4.a
    text: 7.10-3 m3/s voor een toiletruimte, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel162
  - number: 162.4.b
    text: 14.10-3 m3/s voor een al of niet met een toiletruimte samengevoegde badruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel162
  - number: '162.5'
    text: De afvoer van binnenlucht, bedoeld in het vierde lid, moet rechtstreeks naar buiten plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel162
  - number: '162.6'
    text: |-
      In het totaal van de uitwendige scheidingsconstructies van een woonwagen moeten, opdat sterk verontreinigde
      binnenlucht snel kan worden afgevoerd, beweegbare constructie-onderdelen aanwezig zijn waarmee, bepaald
      overeenkomstig NEN 1087, in een verblijfsruimte een capaciteit voor de toevoer van buitenlucht en de afvoer van
      binnenlucht kan worden bewerkstelligd van ten minste 3.10-3 m3/s per m2 vloeroppervlakte van die ruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel162
  - number: '163.1'
    text: |-
      In een woonwagen of in een op de standplaats gelegen gebouw moet, ter voorkoming van een onaanvaardbare ophoping
      van vergiftige of hinderlijke gassen, ten behoeve van een opstelplaats voor een verbrandingstoestel, niet zijnde
      een kooktoestel met een nominale belasting als bedoeld in NEN 2757 van niet meer dan 15 kW, een voorziening voor de
      toevoer van verbrandingslucht en de afvoer van rook aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel163
  - number: '163.2'
    text: |-
      De voorziening voor de toevoer van verbrandingslucht en de afvoer van rook moet, bepaald overeenkomstig bij
      ministeriële regeling gegeven voorschriften, een in die voorschriften aangegeven inrichting en capaciteit hebben.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel163
  - number: '163.3'
    text: |-
      De inrichting van de voorziening voor de toevoer van verbrandingslucht en de afvoer van rook moet, wat de
      richting van de stroming van de afvoer van rook betreft, ten minste voldoen aan bij ministeriële regeling gegeven
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel163
  - number: '164.1'
    text: |-
      In een uitwendige scheidingsconstructie van een woonwagen mogen zich, ter beperking van het in de woonwagen kunnen
      binnendringen van ratten en muizen, geen onafsluitbare openingen bevinden die breder zijn dan 0,01 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel164
  - number: '164.2'
    text: |-
      Het eerste lid is niet van toepassing op een opening die aan de bovenkant de uitmonding vormt van een verticaal
      kanaal.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel164
  - number: '165.1'
    text: |-
      Op een standplaats moet, opdat kan worden beschikt over voor de menselijke consumptie en hygiëne geschikt water,
      een voorziening voor drinkwater aanwezig zijn die is aangesloten op het distributienet voor drinkwater en die
      ten minste voldoet aan artikel 5, eerste lid, onderdeel 2 van de Model-aansluitvoorwaarden voor drinkwater van de
      Vereniging van Exploitanten van Waterleidingbedrijven in Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel165
  - number: '165.2'
    text: |-
      In een woonwagen moet een voorziening voor drinkwater aanwezig zijn die is aangesloten op de voorziening,
      bedoeld in het eerste lid, en die ten minste voldoet aan artikel 5, eerste lid, onderdeel 2, van de Model-
      aansluitvoorwaarden voor drinkwater van de Vereniging van Exploitanten van Waterleidingbedrijven in Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel165
  - number: '166.1'
    text: |-
      In het totaal van de uitwendige scheidingsconstructies van een verblijfsruimte van een woonwagen moet, met het
      oog op de toetreding van daglicht en het uitzicht naar buiten, bepaald overeenkomstig NEN 2057, een equivalente
      daglichtoppervlakte als bedoeld in die norm, van ten minste 0,5 m2 aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel166
  - number: '166.2'
    text: |-
      Bij de bepaling van de in het eerste lid bedoelde equivalente daglichtoppervlakte blijven bouwwerken en daarmee
      gelijk te stellen belemmeringen buiten toepassing en moet de in rekening te brengen belemmeringshoek α, bedoeld in
      NEN 2057, ten minste 25° zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel166
  - number: '167.1'
    text: |-
      Indien niet is voldaan aan enig voorschrift, gegeven bij of krachtens de artikelen 159 tot en met 166, moeten een
      woonwagen en een standplaats een mate van bescherming van de gezondheid bieden, die ten minste gelijk is aan de
      mate van bescherming die is beoogd met het desbetreffende bij of krachtens die artikelen gegeven voorschrift.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel167
  - number: '167.2'
    text: |-
      Indien toepassing is gegeven aan het eerste lid en het desbetreffende voorschrift tevens valt te herleiden tot
      overwegingen van veiligheid of bruikbaarheid, moeten die overwegingen daarbij in ten minste dezelfde mate in acht
      zijn genomen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel167
  - number: '168.1'
    text: |-
      In een woonwagen moet, opdat daarin voor het wonen kenmerkende activiteiten kunnen plaatsvinden, een totaal aan
      vloeroppervlakte aan verblijfsruimte van ten minste 9,4 m2 aan verblijfsruimte aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel168
  - number: '168.2'
    text: Boven de vloeroppervlakte van een verblijfsruimte moet een hoogte van ten minste 2,1 m aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel168
  - number: '168.3'
    text: |-
      Een verblijfsruimte moet vanaf de toegang van de woonwagen bereikbaar zijn zonder dat een toiletruimte, badruimte
      of bergruimte behoeft te worden betreden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel168
  - number: '169.1'
    text: |-
      In een woonwagen of in een op de standplaats gelegen gebouw moet, opdat sanitaire handelingen kunnen worden
      verricht, ten minste één afsluitbare toiletruimte aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel169
  - number: '169.2'
    text: |-
      De toiletruimte, bedoeld in het eerste lid, moet een vloeroppervlakte hebben van ten minste 0,64 m2, waarvan de
      breedte ten minste 0,6 m en de hoogte boven de helft van die oppervlakte ten minste 2 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel169
  - number: '170.1'
    text: |-
      Een in een woonwagen of in een op de standplaats gelegen gebouw aanwezige badruimte moet, met het oog op het zich
      kunnen wassen, een vloeroppervlakte hebben van ten minste 0,36 m2, waarvan de breedte ten minste 0,6 m en de hoogte
      boven die oppervlakte ten minste 2 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel170
  - number: '170.2'
    text: |-
      Een badruimte mag, met het oog op een doelmatige benutting van de gebruiksoppervlakte van de woonwagen of van het
      op de standplaats gelegen gebouw, zijn samengevoegd met een in die woonwagen of dat gebouw gelegen toiletruimte,
      mits de vloeroppervlakte van die samengevoegde ruimte ten minste 1 m2 is, waarvan de breedte ten minste 0,6 m en de
      hoogte boven twee derde van die oppervlakte ten minste 2 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel170
  - number: '171'
    text: |-
      Tot een woonwagen behoren, opdat spijzen kunnen worden bereid, een opstelplaats voor een aanrecht en een
      opstelplaats voor een kooktoestel, gelegen in een besloten ruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel171
  - number: '172.1'
    text: |-
      In een woonwagen of in een op de standplaats gelegen gebouw moet, opdat verwarmingsapparatuur kan worden geplaatst,
      ten minste één opstelplaats voor een stooktoestel aanwezig zijn, die niet mag zijn gelegen in een toiletruimte
      of badruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel172
  - number: '172.2'
    text: |-
      Het eerste lid is niet van toepassing, indien de woonwagen is aangesloten op het distributienet van de
      stadsverwarming of op een andere voorziening die is bestemd voor de verwarming van meer dan één woonwagen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel172
  - number: '173.1'
    text: |-
      Indien niet is voldaan aan enig voorschrift, gegeven bij of krachtens de artikelen 168 tot en met 172, moeten
      een woonwagen en een standplaats een mate van bruikbaarheid bieden die ten minste gelijk is aan de mate van
      bruikbaarheid die is beoogd met het desbetreffende bij of krachtens die artikelen gegeven voorschrift.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel173
  - number: '173.2'
    text: |-
      Indien toepassing is gegeven aan het eerste lid en het desbetreffende voorschrift tevens valt te herleiden tot
      overwegingen van veiligheid of gezondheid, moeten die overwegingen daarbij in ten minste dezelfde mate in acht
      zijn genomen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel173
  - number: '174.1'
    text: |-
      Een in NEN 6702 bedoelde uiterste grenstoestand van een bouwconstructie mag, opdat de constructie duurzaam bestand
      is tegen de daarop werkende krachten, bij de in die norm bedoelde fundamentele belastingscombinaties niet zijn
      overschreden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel174
  - number: '174.2'
    text: |-
      Onverminderd het eerste lid, mag een uiterste grenstoestand van een in NEN 6702 bedoelde bouwconstructie bij de in
      die norm bedoelde bijzondere belastingscombinaties niet zijn overschreden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel174
  - number: '174.3'
    text: |-
      Onverminderd het eerste lid, mag, ter voorkoming van voortschrijdende instorting, een in dat lid bedoelde
      uiterste grenstoestand van de in NEN 6702 bedoelde hoofddraagconstructie bij de in die norm bedoelde bijzondere
      belastingscombinaties, met uitzondering van de combinaties met brand, niet zijn overschreden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel174
  - number: '174.4'
    text: |-
      Onverminderd het eerste tot en met derde lid, moet voor de bepaling van de in die leden bedoelde
      belastingscombinaties, indien NEN 6702 daarin niet voorziet, zijn uitgegaan van NEN 6700.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel174
  - number: '174.5'
    text: |-
      Het niet-overschrijden van een uiterste grenstoestand als bedoeld in het eerste tot en met derde lid, moet zijn
      bepaald overeenkomstig:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel174
  - number: 174.5.a
    text: NEN 6710 en NEN 6770, indien de bouwconstructie is vervaardigd van in die normen bedoeld metaal;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel174
  - number: 174.5.b
    text: NEN 6720 en NEN 6790, indien de bouwconstructie is vervaardigd van in die normen bedoeld steenachtig materiaal;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel174
  - number: 174.5.c
    text: NEN 6760, indien de bouwconstructie is vervaardigd van in die norm bedoeld hout;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel174
  - number: 174.5.d
    text: NEN 2608, indien de bouwconstructie is vervaardigd van in die norm bedoeld glas, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel174
  - number: 174.5.e
    text: NEN 6707, indien de bouwconstructie de in die norm bedoelde bevestiging van dakbedekking is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel174
  - number: '174.6'
    text: |-
      Indien een ander materiaal of een andere bepalingsmethode is toegepast dan in het vijfde lid is bedoeld, moet het
      niet-overschrijden van een uiterste grenstoestand van een bouwconstructie zijn bepaald overeenkomstig NEN 6700.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel174
  - number: '174.7'
    text: |-
      Onverminderd het derde lid, mag, opdat een gebouw, voor zover dat een voor mensen toegankelijke, overdekte en
      geheel met wanden omsloten ruimte vormt, bij brand op veilige wijze kan worden verlaten, een uiterste grenstoestand
      van een in tabel V aangegeven bouwconstructie bij de overeenkomstig NEN 6702 in geval van brand aan te houden
      bijzondere belastingscombinaties, gedurende de in die tabel voor die bouwconstructie aangegeven tijdsduur van de
      brandwerendheid met betrekking tot bezwijken, bepaald overeenkomstig NEN 6069 dan wel, voor zover van toepassing,
      NEN 6071, NEN 6072 of NEN 6073, niet zijn overschreden. Tabel V Brandwerendheid met betrekking tot bezwijken






                    **Bouwconstructie**


                    **Brandwerendheid met betrekking tot bezwijken in minuten**






                    bouwconstructie waarvan het bezwijken leidt tot het onbruikbaar worden van een vluchtmogelijkheid


                    30








                    in NEN 6702 bedoelde hoofddraagconstructie van een gebouw mede bestemd voor overnachting, waarin geen
      vloer van een verblijfsgebied hoger is gelegen dan 5 m boven het aansluitende terrein, gemeten ter plaatse van de
      toegang van het gebouw


                    60








                    in NEN 6702 bedoelde hoofddraagconstructie van een gebouw waarin een vloer van een verblijfsgebied is
      gelegen tussen 5 m en 13 m, boven het aansluitende terrein, gemeten ter plaatse van de toegang van het gebouw


                    90








                    in NEN 6702 bedoelde hoofddraagconstructie van een gebouw waarin een vloer van een verblijfsgebied
      is gelegen op een hoogte van meer dan 13 m boven het aansluitende terrein, gemeten ter plaatse van de toegang van
      het gebouw


                    120
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel174
  - number: '174.8'
    text: |-
      Onverminderd het zevende lid, moet de brandwerendheid met betrekking tot bezwijken voor een gezondheidszorggebouw
      dat mede is bestemd voor klinische patiënten, zodanig zijn dat in de nabijheid van een ruimte bestemd voor medische
      verpleging, verzorging of behandeling dan wel voor medisch onderzoek de komst van de brandweer veilig kan worden
      afgewacht.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel174
  - number: '174.9'
    text: |-
      De in tabel V gegeven waarde van de brandwerendheid met betrekking tot bezwijken van een hoofddraagconstructie als
      bedoeld in die tabel, mag met ten hoogste 30 minuten zijn verminderd, indien de permanente vuurbelasting van het
      gebouw, bepaald overeenkomstig NEN 6090, niet groter is dan 500 MJ/m2.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel174
  - number: '175.1'
    text: |-
      Een vloer moet, ter voorkoming van het van die vloer kunnen vallen, bij de randen zijn voorzien van een afscheiding
      waarvan de hoogte, gemeten vanaf de vloer, ten minste 1 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel175
  - number: '175.2'
    text: |-
      In afwijking in zoverre van het eerste lid, moet, indien de vloer hoger is gelegen dan 13 m boven een aangrenzende
      vloer of boven het aansluitende terrein of water, de hoogte van de afscheiding ten minste 1,2 m zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel175
  - number: '175.3'
    text: |-
      In afwijking in zoverre van het eerste en tweede lid, mag, indien de afscheiding is gelegen ter plaatse van een
      raam, zijn volstaan met een hoogte van ten minste 0,85 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel175
  - number: '175.4'
    text: |-
      Het eerste tot en met derde lid zijn niet van toepassing op een vloer ter plaatse van de bovenste trede van een
      trap of ter plaatse van de bovenkant van een hellingbaan, op een laadvloer en op een vloer die niet hoger is
      gelegen dan 0,6 m boven een aangrenzende vloer of boven het aansluitende terrein of water.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel175
  - number: '175.5'
    text: |-
      Tussen een in een toegankelijkheidssector gelegen vloer en een afscheiding als bedoeld in het eerste tot en met
      derde lid, mag, horizontaal gemeten, geen opening aanwezig zijn die breder is dan 0,05 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel175
  - number: '175.6'
    text: |-
      In een afscheiding als bedoeld in het eerste tot en met derde lid, mogen geen verticale openingen aanwezig zijn die
      breder zijn dan 0,5 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel175
  - number: '175.7'
    text: |-
      In een afscheiding als bedoeld in het eerste tot en met derde lid, die is gelegen in een toegankelijkheidssector,
      mogen geen openingen aanwezig zijn die breder zijn dan 0,1 m, tenzij die openingen zich bevinden op een hoogte van
      meer dan 0,7 m boven de vloer.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel175
  - number: '175.8'
    text: |-
      In een afscheiding als bedoeld in het eerste tot en met derde lid, die is gelegen in een toegankelijkheidssector,
      mogen zich, ter voorkoming van het overklauteren, geen opstapmogelijkheden bevinden tussen 0,2 m en 0,7 m boven
      de vloer.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel175
  - number: '176'
    text: |-
      Een hoogteverschil van meer dan 0,21 m tussen vloeren van verblijfsgebieden, toiletruimten en badruimten dan wel
      tussen één van die vloeren en het aansluitende terrein, moet, opdat die vloeren op veilige wijze kunnen worden
      bereikt en verlaten, zijn overbrugd door een trap of hellingbaan.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel176
  - number: '177.1'
    text: |-
      De afmetingen van een trap als bedoeld in artikel 176, moeten ten minste voldoen aan kolom B van tabel II, of,
      indien de trap geen deel uitmaakt van een toegankelijkheidssector, aan kolom A van die tabel.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel177
  - number: '177.2'
    text: |-
      In afwijking van het eerste lid, mag de trap die is bestemd voor het ontsluiten van een gebouw met een
      gebruiksoppervlakte van minder dan 500 m2, waarin geen toegankelijkheidssector is gelegen, voldoen aan kolom A van
      tabel II.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel177
  - number: '177.3'
    text: |-
      Onverminderd het eerste lid, mag de som van een aantrede en twee optreden, gemeten ter plaatse van de klimlijn, ten
      hoogste 0,7 m, doch niet minder dan 0,57 m zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel177
  - number: '177.4'
    text: |-
      Een trap die voldoet aan kolom B van tabel II, moet ter plaatse van de bovenste trede over de ten minste vereiste
      breedte aansluiten op een vrije vloeroppervlakte van ten minste 1,1 m * 1,1 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel177
  - number: '177.5'
    text: |-
      Een trap die moet voldoen aan kolom A van tabel II, en een trap als bedoeld in het tweede lid, moeten ter plaatse
      van de bovenste trede over de ten minste vereiste breedte aansluiten op een vrije vloeroppervlakte van ten minste
      0,8 m * 0,8 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel177
  - number: '177.6'
    text: |-
      Een trap als bedoeld in het eerste lid, waarmee een hoogteverschil is overbrugd van meer dan 0,6 m, moet aan beide
      zijkanten vanaf een hoogte van 0,6 m zijn voorzien van een afscheiding met een hoogte van ten minste 0,8 m boven de
      voorkant van de tredevlakken van de trap.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel177
  - number: '177.7'
    text: |-
      Op een afscheiding als bedoeld in het zesde lid, is artikel 175, vijfde tot en met achtste lid, van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel177
  - number: '177.8'
    text: |-
      Een trap als bedoeld in het zesde lid, waarvan de klimlijn een helling heeft die groter is dan 2:3, moet aan
      beide zijkanten zijn voorzien van een leuning, met dien verstande dat, indien die trap geen deel uitmaakt van een
      toegankelijkheidssector, mag zijn volstaan met een leuning aan één zijkant.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel177
  - number: '177.9'
    text: |-
      De bovenkant van een leuning als bedoeld in het achtste lid, moet zijn gelegen op een hoogte van ten minste 0,8 m
      en ten hoogste 1 m boven de voorkant van de tredevlakken van de trap.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel177
  - number: '177.10'
    text: |-
      Een trap die is bestemd voor het ontsluiten van een verblijfsgebied, waarmee een hoogteverschil is overbrugd van
      meer dan 1,5 m, gemeten vanaf het aansluitende terrein of een aangrenzende vloer, moet zijn gelegen in een besloten
      ruimte waarvan de uitwendige scheidingsconstructie, bepaald overeenkomstig NEN 2778, ten minste regenwerend is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel177
  - number: '178.1'
    text: |-
      Een hellingbaan als bedoeld in artikel 176, moet een breedte hebben van ten minste 1,1 m, mag geen grotere hoogte
      hebben dan 1 m en mag voorts geen grotere helling hebben dan:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel178
  - number: 178.1.a
    text: 1:12, indien het hoogteverschil niet groter is dan 0,25 m;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel178
  - number: 178.1.b
    text: 1:16, indien het hoogteverschil groter is dan 0,25 m, doch niet groter dan 0,5 m, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel178
  - number: 178.1.c
    text: 1:20, indien het hoogteverschil groter is dan 0,5 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel178
  - number: '178.2'
    text: |-
      Een hellingbaan als bedoeld in het eerste lid, moet aan de bovenzijde over de ten minste vereiste breedte
      aansluiten op een vrije vloeroppervlakte van ten minste 1,4 m * 1,4 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel178
  - number: '178.3'
    text: 'Een hellingbaan als bedoeld in het eerste lid, moet:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel178
  - number: 178.3.a
    text: |-
      tot een hoogte van minder dan 0,6 m aan beide zijkanten zijn voorzien van een afscheiding met een hoogte van ten
      minste 0,04 m boven de hellingbaan, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel178
  - number: 178.3.b
    text: |-
      vanaf een hoogte van 0,6 m aan beide zijkanten zijn voorzien van een afscheiding met een hoogte van ten minste 0,85
      m boven de hellingbaan.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel178
  - number: '178.4'
    text: |-
      Ten aanzien van een afscheiding als bedoeld in het derde lid, is artikel 175, vijfde tot en met achtste lid, van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel178
  - number: '179.1'
    text: |-
      In een gebouw waarin een verblijfsgebied is gelegen, moet, opdat op veilige wijze kan worden beschikt over energie,
      een voorziening voor elektriciteit aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel179
  - number: '179.2'
    text: |-
      Een voorziening voor elektriciteit moet ten minste voldoen aan artikel 5, eerste lid, onderdeel 2, van de Model-
      aansluitvoorwaarden voor elektrische energie van de Vereniging van Exploitanten van Elektriciteitsbedrijven in
      Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel179
  - number: '179.3'
    text: |-
      Onverminderd het tweede lid, moet de voorziening voor elektriciteit in de meterruimte ten minste één
      aansluitmogelijkheid hebben voor aansluiting op het distributienet van elektriciteit.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel179
  - number: '179.4'
    text: |-
      Een voorziening voor noodstroom moet ten minste voldoen aan artikel 5, eerste lid, onderdeel 2, van de Model-
      aansluitvoorwaarden voor elektrische energie van de Vereniging van Exploitanten van Elektriciteitsbedrijven in
      Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel179
  - number: '180.1'
    text: |-
      In een besloten verkeersruimte die in een toegankelijkheidssector is gelegen en in een besloten ruimte waardoor
      een vluchtmogelijkheid voert, moet, opdat op veilige wijze gebruik kan worden gemaakt van die sector en die ruimte,
      ten minste één verlichtingsinstallatie aanwezig zijn die is aangesloten op de voorziening voor elektriciteit en die
      over de ten minste vereiste breedte van de in die sector of ruimte gelegen besloten verkeersruimten, gemeten op de
      vloer van die verkeersruimten, een verlichtingssterkte van ten minste 10 lux kan geven.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel180
  - number: '180.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een trap of hellingbaan, waarmee een hoogteverschil
      is overbrugd tussen de vloeren van verkeersruimten die zijn gelegen in de in het eerste lid bedoelde
      toegankelijkheidssector en vloeren van besloten ruimten, alsmede op de kooi van een lift.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel180
  - number: '180.3'
    text: |-
      De verlichtingsinstallatie, bedoeld in het eerste en tweede lid, moet, afhankelijk van bestemming en grootte van
      het gebouw, zijn aangesloten op een voorziening voor noodstroom die binnen 15 seconden na het uitvallen van de
      voorziening voor elektriciteit gedurende ten minste 60 minuten een verlichtingssterkte kan geven van ten minste
      1 lux.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel180
  - number: '180.4'
    text: De verlichtingsinstallatie van de kooi van een lift is aangesloten op de voorziening voor noodstroom.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel180
  - number: '181'
    text: |-
      Een voorziening voor gas moet, opdat op veilige wijze over energie kan worden beschikt, ten minste voldoen aan
      artikel 5, eerste lid, onderdeel 2, van de Model-aansluitvoorwaarden voor gas van de Vereniging van Exploitanten
      van Gasbedrijven in Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel181
  - number: '182.1'
    text: |-
      Een voorziening voor gas als bedoeld in artikel 181, moet, opdat gas kan worden betrokken, in de meterruimte ten
      minste één aansluitmogelijkheid hebben voor aansluiting op het distributienet van gas.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel182
  - number: '182.2'
    text: |-
      Een voorziening voor gas als bedoeld in artikel 181, moet, opdat op gas gestookte verbrandingstoestellen op
      die voorziening kunnen worden aangesloten, voorts ter plaatse van elke opstelplaats voor een op gas gestookt
      verbrandingstoestel ten minste één aansluitpunt hebben.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel182
  - number: '183.1'
    text: |-
      Een beweegbaar constructie-onderdeel dat zich in enige stand kan bevinden boven een voor motorvoertuigen
      openstaande weg of boven een strook van 0,6 m, grenzend aan die weg, moet, ter voorkoming van gevaar voor
      gebruikers van die weg of strook, gemeten vanaf de onderzijde van dat onderdeel, hoger zijn gelegen dan 4,2 m boven
      die weg of strook.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel183
  - number: '183.2'
    text: |-
      Een beweegbaar constructie-onderdeel dat zich in enige stand kan bevinden boven een niet voor motorvoertuigen
      openstaande weg, moet, ter voorkoming van gevaar voor gebruikers van die weg, gemeten vanaf de onderzijde van dat
      onderdeel, hoger zijn gelegen dan 2,2 m boven die weg.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel183
  - number: '183.3'
    text: |-
      Een beweegbaar constructie-onderdeel dat zich in enige stand kan bevinden boven een vloer van een in een
      toegankelijkheidssector gelegen verkeersruimte of boven een vloer waarover een vluchtweg voert, moet, ter
      voorkoming van gevaar voor gebruikers van die ruimte of die vluchtweg, gemeten vanaf de onderzijde van dat
      onderdeel, hoger zijn gelegen dan 2,2 m boven die vloer.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel183
  - number: '183.4'
    text: |-
      Het derde lid is niet van toepassing op een deur, indien de verkeersruimte, gemeten ter plaatse van die deur in een
      onder een hoek van 90° geopende stand, een vrije doorgang heeft van ten minste 0,85 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel183
  - number: '184.1'
    text: |-
      Materiaal, toegepast ter plaatse van of in de nabijheid van een in NEN 6061 bedoelde stookplaats moet, ter
      beperking van het ontstaan van een brandgevaarlijke situatie, onbrandbaar zijn als bedoeld in NEN 6064, voor zover:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel184
  - number: 184.1.a
    text: |-
      ter plaatse van of in de nabijheid van die stookplaats een overeenkomstig NEN 6061 bepaalde intensiteit van de
      warmtestraling kan optreden van meer dan 2 kW/m2, of
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel184
  - number: 184.1.b
    text: in dat materiaal een overeenkomstig NEN 6061 bepaalde temperatuur kan optreden van meer dan 363 K.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel184
  - number: '184.2'
    text: |-
      Materiaal, toegepast aan de binnenzijde van een schacht, koker of kanaal moet, indien die schacht, die koker of dat
      kanaal grenst aan meer dan één brandcompartiment als bedoeld in artikel 186, eerste lid, en een inwendige doorsnede
      heeft die groter is dan 0,015 m2, over een dikte van 0,01 m, gemeten loodrecht op de binnenzijde, onbrandbaar zijn
      als bedoeld in NEN 6064.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel184
  - number: '184.3'
    text: |-
      Het tweede lid is niet van toepassing, indien de schacht, de koker of het kanaal is gelegen in en uitsluitend is
      bestemd voor één of meer boven elkaar gelegen toiletruimten of badruimten.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel184
  - number: '184.4'
    text: |-
      Onverminderd het tweede lid, moet een schacht, koker of kanaal, bestemd voor de afvoer van rook, brandveilig zijn
      overeenkomstig NEN 6062.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel184
  - number: '184.5'
    text: |-
      Onverminderd het tweede en vierde lid, moet materiaal waaruit de voorziening voor de afvoer van rook is
      samengesteld, alsmede materiaal dat in de nabijheid van die voorziening is toegepast, voor zover in dat materiaal
      een overeenkomstig NEN 6062 bepaalde temperatuur kan optreden van meer dan 363 K, onbrandbaar zijn als bedoeld in
      NEN 6064.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel184
  - number: '184.6'
    text: |-
      De horizontale afstand tussen de uitmonding van een voorziening voor de afvoer van rook van een op vaste brandstof
      gestookt toestel en een in NEN 6063 bedoeld brandgevaarlijk dak van een ander bouwwerk mag niet minder zijn dan
      15 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel184
  - number: '184.7'
    text: Een dak mag, bepaald overeenkomstig NEN 6063, niet brandgevaarlijk zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel184
  - number: '184.8'
    text: |-
      Het zevende lid is niet van toepassing op het dak, voor zover dat dak is gelegen op een afstand van ten minste 15
      m van de perceelsgrens, mits in het gebouw geen vloer van een verblijfsgebied hoger is gelegen dan 5 m boven het
      aansluitende terrein, gemeten ter plaatse van de toegang van het gebouw.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel184
  - number: '184.9'
    text: |-
      In afwijking van het achtste lid, mag, indien het perceel waarop het gebouw is gelegen, grenst aan een openbare
      weg, openbaar water of openbaar groen, de afstand zijn aangehouden tot het hart van die weg, dat water of dat
      groen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel184
  - number: '185.1'
    text: |-
      Een constructie-onderdeel, met uitzondering van een dak, moet, ter beperking van ontwikkeling van brand, bepaald
      overeenkomstig NEN 6065 en, voor zover het een vloer of tredevlak is, NEN 1775, zodanig zijn dat de bijdrage tot
      brandvoortplanting van het constructie-onderdeel, afhankelijk van de ruimte waarvan het constructie-onderdeel deel
      uitmaakt, in voldoende mate is beperkt.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel185
  - number: '185.2'
    text: |-
      Een naar de buitenlucht toegekeerde zijde van een constructie-onderdeel moet, afhankelijk van de hoogte waarop
      een vloer van een verblijfsgebied is gelegen, tot een hoogte van ten minste 2,5 m boven het aansluitende terrein,
      bepaald overeenkomstig NEN 6065, behoren tot klasse 1 van de bijdrage tot brandvoortplanting.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel185
  - number: '185.3'
    text: |-
      Het tweede lid is niet van toepassing op een deur, raam, kozijn en op een daarmee gelijk te stellen constructie-
      onderdeel.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel185
  - number: '185.4'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op ten hoogste 5% van de totale oppervlakte van de in die leden
      bedoelde constructie-onderdelen van elke afzonderlijke ruimte van het gebouw.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel185
  - number: '186.1'
    text: |-
      Een gebouw, voor zover dat een voor mensen toegankelijke, overdekte en geheel met wanden omsloten ruimte vormt,
      moet zodanig in brandcompartimenten zijn ingericht dat een in dat gebouw begonnen brand zich niet binnen korte tijd
      kan uitbreiden naar een ander deel van het gebouw of naar een ander gebouw.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel186
  - number: '186.2'
    text: |-
      Onverminderd het eerste lid, moet, wat uitbreiding van brand naar een ander gebouw betreft, voorts zijn uitgegaan
      van een identiek, doch spiegelsymmetrisch ten opzichte van de perceelsgrens gelegen gebouw.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel186
  - number: '187.1'
    text: |-
      Een naar een besloten ruimte toegekeerde zijde van een constructie-onderdeel moet, ter beperking van rookproduktie,
      bepaald overeenkomstig NEN 6066, zodanig zijn dat de rookdichtheid van het constructie-onderdeel, afhankelijk van
      de ruimte waarvan het constructie-onderdeel deel uitmaakt, in voldoende mate is beperkt.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel187
  - number: '187.2'
    text: |-
      Het eerste lid is niet van toepassing op ten hoogste 5% van de totale oppervlakte van de in dat lid bedoelde
      constructie-onderdelen van elke afzonderlijke ruimte van het gebouw.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel187
  - number: '188'
    text: |-
      Een gebouw, voor zover dat een voor mensen toegankelijke, overdekte en geheel met wanden omsloten ruimte vormt,
      moet zodanig zijn ingericht in rookcompartimenten dat bij brand rook zich niet binnen korte tijd kan verspreiden
      naar een ander deel van het gebouw of naar een ander gebouw, de loopafstand vanaf een punt in een rookcompartiment,
      gemeten langs de kortste route, naar de toegang van het rookcompartiment beperkt is, en dat een ruimte waardoor een
      vluchtweg voert in voldoende mate gevrijwaard blijft van rook.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel188
  - number: '189'
    text: |-
      Een gebouw, voor zover dat een voor mensen toegankelijke, overdekte en geheel met wanden omsloten ruimte vormt,
      moet, afhankelijk van zijn bestemming en grootte, zodanig zijn ingericht dat daarin voldoende vluchtmogelijkheden
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel189
  - number: '190'
    text: |-
      Onverminderd artikel 174, zevende lid, moet een vluchtmogelijkheid als bedoeld in artikel 189, zodanig zijn
      ingericht dat gebruikers van het gebouw bij brand op doeltreffende en voldoende veilige wijze binnen redelijke tijd
      naar het aan het gebouw aansluitende terrein kunnen vluchten.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel190
  - number: '191'
    text: |-
      Een gebouw, voor zover dat een voor mensen toegankelijke, overdekte en geheel met wanden omsloten ruimte vormt,
      moet zodanig zijn ingericht dat in het gebouw aanwezige personen bij brand binnen redelijke tijd eigener beweging
      het gebouw kunnen verlaten dan wel binnen redelijke tijd door de brandweer kunnen worden gered.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel191
  - number: '192'
    text: |-
      In een gebouw moeten, afhankelijk van zijn bestemming en grootte, zodanige voorzieningen aanwezig zijn dat een
      brand binnen redelijke tijd kan worden geblust.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel192
  - number: '193.1'
    text: |-
      Indien niet is voldaan aan enig voorschrift, gegeven bij of krachtens de artikelen 174 tot en met 192, moet een
      gebouw een mate van veiligheid bieden die ten minste gelijk is aan de mate van veiligheid die is beoogd met het
      desbetreffende bij of krachtens die artikelen gegeven voorschrift.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel193
  - number: '193.2'
    text: |-
      Indien toepassing is gegeven aan het eerste lid en het desbetreffende voorschrift tevens valt te herleiden tot
      overwegingen van gezondheid, bruikbaarheid of energiezuinigheid, moeten die overwegingen daarbij in ten minste
      dezelfde mate in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel193
  - number: '193.3'
    text: |-
      Ten aanzien van de bij of krachtens hoofdstuk VII uit het oogpunt van veiligheid gegeven voorschriften zijn het
      eerste en tweede lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel193
  - number: '194.1'
    text: |-
      De in NEN 5077 bedoelde karakteristieke geluidwering van een uitwendige scheidingsconstructie die de scheiding
      vormt tussen een verblijfsgebied en de buitenlucht moet, ter beperking van geluidhinder in het verblijfsgebied,
      bepaald overeenkomstig die norm, ten minste gelijk zijn aan het verschil tussen de geluidsbelasting van die
      scheidingsconstructie, bepaald overeenkomstig de [Wet geluidhinder][ref1], en 35 dB(A), met een minimum van 20
      dB(A).


      [ref1]: https://wetten.overheid.nl/BWBR0003227
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel194
    references:
      - id: ref1
        bwb_id: BWBR0003227
  - number: '194.2'
    text: |-
      In afwijking van het eerste lid moet, indien ingevolge de [Wet geluidhinder][ref1] in het verblijfsgebied een
      hogere geluidsbelasting dan 35 dB(A) is toegestaan, de karakteristieke geluidwering van een in dat lid bedoelde
      uitwendige scheidingsconstructie, bepaald overeenkomstig NEN 5077, ten minste gelijk zijn aan het verschil tussen
      de geluidsbelasting van die scheidingsconstructie en de toegestane geluidsbelasting in dat gebied, met een minimum
      van 20 dB(A).


      [ref1]: https://wetten.overheid.nl/BWBR0003227
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel194
    references:
      - id: ref1
        bwb_id: BWBR0003227
  - number: '194.3'
    text: |-
      De in NEN 5077 bedoelde karakteristieke geluidwering van een uitwendige scheidingsconstructie die de scheiding
      vormt tussen een verblijfsgebied en de buitenlucht, moet, bepaald overeenkomstig NEN 5077, afhankelijk van
      de in de eerste kolom van tabel III gegeven geluidsbelasting van die constructie, bepaald overeenkomstig de
      [Luchtvaartwet][ref1], ten minste gelijk zijn aan de bij die geluidsbelasting in de tweede kolom van die tabel
      gegeven waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0002267
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel194
    references:
      - id: ref1
        bwb_id: BWBR0002267
  - number: '194.4'
    text: |-
      De karakteristieke geluidwering van de uitwendige scheidingsconstructie van een verblijfsgebied van een
      gezondheidszorggebouw of een gedeelte daarvan, mede bestemd voor nachtverblijf van patiënten die door hun
      lichamelijke of geestelijke gesteldheid permanent of tijdelijk aan bed gebonden zijn, die de scheiding vormt
      tussen dat gebied en de buitenlucht, bepaald volgens NEN 5077, is ten minste gelijk aan het verschil tussen de
      L geluidsbelasting, veroorzaakt door structureel uitgevoerd nachtelijk vliegverkeer, op die constructie en L
      26 dB(A); de L geluidsbelasting in dB(A) buiten een gezondheidszorggebouw voor startend en landend vliegverkeer
      wordt berekend overeenkomstig de Regeling berekening nachtelijke geluidsbelasting, waarbij de geluidwering van de
      uitwendige scheidingsconstructie onderscheiden naar startend en landend vliegverkeer (L) gelijk wordt gesteld aan
      0 dB(A).
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel194
  - number: '194.5'
    text: |-
      Indien krachtens de [Luchtvaartwet][ref1] of [artikel 108 van de Wet geluidhinder][ref2] een andere dan de in het
      derde en het vierde lid gegeven eis ten aanzien van de karakteristieke geluidwering van een in dat lid bedoelde
      uitwendige scheidingsconstructie is gesteld, blijven het derde en het vierde lid buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002267
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel108
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel194
    references:
      - id: ref1
        bwb_id: BWBR0002267
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '108'
  - number: '194.6'
    text: |-
      Indien op grond van het eerste tot en met het vijfde lid met betrekking tot een of meer soorten geluid
      tegelijkertijd verschillende eisen aan de geluidwering van een uitwendige scheidingsconstructie zijn gesteld, geldt
      de zwaarste van de ingevolge die leden gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel194
  - number: '194.7'
    text: |-
      Ten aanzien van een inwendige scheidingsconstructie van een verblijfsgebied, voor zover die constructie niet
      de scheiding vormt met een ander verblijfsgebied, zijn het eerste tot en met het zesde lid van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel194
  - number: '194.8'
    text: |-
      De in NEN 5077 bedoelde karakteristieke geluidwering van een uitwendige scheidingsconstructie van een
      verblijfsruimte, voor zover die constructie de scheiding vormt met de buitenlucht, moet, bepaald overeenkomstig die
      norm, ten minste gelijk zijn aan de waarde van de karakteristieke geluidwering, bedoeld in het eerste tot en met
      het zesde lid, verminderd met 2 dB(A).
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel194
  - number: '194.9'
    text: |-
      Ten aanzien van een inwendige scheidingsconstructie van een verblijfsruimte, voor zover die constructie niet de
      scheiding vormt met een andere verblijfsruimte, is het achtste lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel194
  - number: '195'
    text: |-
      Het in NEN 5077 bedoelde karakteristieke geluidsniveau van een toilet met waterspoeling, een warmwatertoestel,
      een hydrofoorinstallatie, een kraan, een mechanisch ventilatiesysteem of een lift mag, ter beperking van
      geluidsoverlast, bepaald overeenkomstig die norm, in een niet tot het gebouw behorend verblijfsgebied niet hoger
      zijn dan 30 dB(A).
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel195
  - number: '196.1'
    text: |-
      De in NEN 5077 bedoelde karakteristieke isolatie-index voor luchtgeluid en de in die norm bedoelde isolatie-index
      voor contactgeluid tussen een besloten ruimte van een gebouw en een tot een ander gebouw behorend verblijfsgebied,
      moeten, ter beperking van geluidhinder in het andere gebouw, bepaald overeenkomstig NEN 5077, ten minste gelijk
      zijn aan 0 dB.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel196
  - number: '196.2'
    text: |-
      De in NEN 5077 bedoelde karakteristieke isolatie-index voor luchtgeluid en de in die norm bedoelde isolatie-
      index voor contactgeluid tussen een besloten ruimte van een gebouw en een besloten ruimte, niet zijnde een
      verblijfsgebied, van een woning, moeten, ter beperking van geluidhinder in de woning, bepaald overeenkomstig NEN
      5077, ten minste gelijk zijn aan -5 dB.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel196
  - number: '197.1'
    text: |-
      Een uitwendige scheidingsconstructie van een verblijfsgebied, toiletruimte of badruimte moet, ter beperking van het
      kunnen binnendringen van vocht in een gebouw, bepaald overeenkomstig NEN 2778, waterdicht zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel197
  - number: '197.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een constructie die de scheiding vormt tussen een
      verblijfsgebied, toiletruimte of badruimte en de kruipruimte, met inbegrip van de op die constructie aansluitende
      delen van andere constructies, voor zover die delen van invloed zijn op het voldoen van die constructie aan dit
      lid.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel197
  - number: '197.3'
    text: |-
      Een inwendige scheidingsconstructie van een verblijfsgebied, toiletruimte of badruimte, voor zover die constructie
      niet de scheiding vormt met een ander verblijfsgebied of met een andere toiletruimte of badruimte, moet, bepaald
      overeenkomstig NEN 2778, waterdicht zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel197
  - number: '197.4'
    text: |-
      Een constructie die de scheiding vormt tussen een verblijfsgebied, toiletruimte of badruimte en de kruipruimte,
      met inbegrip van de op die constructie aansluitende delen van andere constructies, voor zover die delen van invloed
      zijn op het voldoen van die constructie aan dit lid, mag, bepaald overeenkomstig NEN 2690, geen grotere specifieke
      luchtvolumestroom hebben dan 20.10-6 m3/(m2.s).
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel197
  - number: '198.1'
    text: |-
      De in NEN 2778 bedoelde factor van de temperatuur van de binnenoppervlakte van een uitwendige scheidingsconstructie
      van een verblijfsgebied, toiletruimte of badruimte van een gebouw waarin een opstelplaats voor een stooktoestel
      aanwezig moet zijn of van een gebouw dat is aangesloten op het distributienet voor stadsverwarming, mag, ter
      beperking van vorming van allergenen, bepaald overeenkomstig die norm, niet lager zijn dan 0,5.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel198
  - number: '198.2'
    text: |-
      Het eerste lid is ten aanzien van een in dat lid bedoeld gebouw van overeenkomstige toepassing op een constructie
      die de scheiding vormt tussen een verblijfsgebied, toiletruimte of badruimte en de kruipruimte, met inbegrip van de
      op die constructie aansluitende delen van andere constructies, voor zover die delen van invloed zijn op het voldoen
      van die constructie aan dit lid.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel198
  - number: '198.3'
    text: |-
      De in NEN 2778 bedoelde factor van de temperatuur van de binnenoppervlakte van een inwendige scheidingsconstructie
      van een verblijfsgebied, toiletruimte of badruimte van een gebouw als bedoeld in het eerste lid, voor zover die
      constructie niet de scheiding vormt met een ander verblijfsgebied of met een andere toiletruimte of badruimte, mag,
      bepaald overeenkomstig die norm, niet lager zijn dan 0,5.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel198
  - number: '198.4'
    text: |-
      Het eerste en derde lid zijn niet van toepassing op in de in die leden bedoelde scheidingsconstructies aanwezige
      kozijnen, alsmede op in die constructies aanwezige deuren en ramen en daarmee gelijk te stellen constructie-
      onderdelen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel198
  - number: '198.5'
    text: |-
      Een constructie die de scheiding vormt tussen een toiletruimte en een andere besloten ruimte, de buitenlucht,
      de grond of het water, mag, ter beperking van het kunnen binnendringen van vocht vanuit de toiletruimte in die
      constructie, aan de naar de toiletruimte toegekeerde oppervlakte, tot een hoogte van 1,2 m boven de vloer van de
      toiletruimte, bepaald overeenkomstig NEN 2778, gemiddeld geen grotere wateropname als bedoeld in die norm, hebben
      dan 0,01 kg/(m2.s½), met dien verstande dat op geen enkele plaats op die oppervlakte de wateropname groter mag zijn
      dan 0,2 kg/(m2.s½).
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel198
  - number: '198.6'
    text: |-
      Het vijfde lid is van overeenkomstige toepassing op een badruimte, met dien verstande dat ter plaatse van het
      bad of de douche over een lengte van ten minste 3 m een hoogte van 2,1 m boven de vloer van die ruimte moet zijn
      aangehouden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel198
  - number: '199.1'
    text: |-
      Een gebouw moet, afhankelijk van zijn bestemming en inrichting, ter voorkoming van een voor de gezondheid
      onaanvaardbare situatie in en bij het gebouw, een voorziening hebben voor de afvoer van afvalwater en faecaliën,
      die kan worden aangesloten op het openbaar riool.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel199
  - number: '199.2'
    text: |-
      De voorziening voor afvalwater en faecaliën moet ten minste één aansluitpunt hebben ter plaatse van een
      lozingstoestel als bedoeld in NEN 3215.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel199
  - number: '199.3'
    text: |-
      De voorziening voor afvalwater en faecaliën moet een capaciteit hebben die ten minste gelijk is aan de belasting
      van die voorziening. Ten aanzien van de bepaling van de belasting en de capaciteit is NEN 3215 van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel199
  - number: '199.4'
    text: |-
      De voorziening voor afvalwater en faecaliën moet lucht- en waterdicht zijn. Ten aanzien van de bepaling van de
      lucht- en waterdichtheid is NEN 3215 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel199
  - number: '200.1'
    text: |-
      Het dak moet, indien als gevolg van van het dak afstromend hemelwater bij het gebouw een voor de gezondheid
      onaanvaardbare situatie kan optreden, ter voorkoming van die onaanvaardbare situatie, een voorziening hebben voor
      de opvang en afvoer van hemelwater, die kan worden aangesloten op het openbaar riool.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel200
  - number: '200.2'
    text: |-
      De voorziening voor hemelwater moet voor de opvang en afvoer van hemelwater een capaciteit hebben die ten minste
      gelijk is aan de belasting van die voorziening. Ten aanzien van de bepaling van de belasting en de capaciteit is
      NEN 3215 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel200
  - number: '200.3'
    text: |-
      De voorziening voor hemelwater, voor zover die voorziening binnen het gebouw is gelegen, moet, ter voorkoming
      van een voor de gezondheid onaanvaardbare situatie in het gebouw, lucht- en waterdicht zijn. Ten aanzien van de
      bepaling van de lucht- en waterdichtheid is NEN 3215 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel200
  - number: '200.4'
    text: |-
      De voorziening voor hemelwater mag zijn samengevoegd met de voorziening voor afvalwater en faecaliën, tenzij de
      voorziening voor hemelwater kan worden aangesloten op het openbaar riool dat uitsluitend is bestemd voor de afvoer
      van hemelwater.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel200
  - number: '200.5'
    text: |-
      Indien toepassing is gegeven aan het vierde lid, moet de samengevoegde voorziening een capaciteit hebben die
      ten minste gelijk is aan de belasting van die voorziening. Ten aanzien van de bepaling van de belasting en de
      capaciteit is NEN 3215 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel200
  - number: '201.1'
    text: |-
      In een verblijfsgebied, een verblijfsruimte, toiletruimte en badruimte moet, ter beperking van het ontstaan van een
      voor de gezondheid nadelige kwaliteit van de binnenlucht, een voorziening aanwezig zijn voor de toevoer van verse
      lucht en de afvoer van binnenlucht.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel201
  - number: '201.2'
    text: |-
      Ten aanzien van de inrichting van de voorziening voor de toevoer van verse lucht en de afvoer van binnenlucht is
      NEN 1087 van overeenkomstige toepassing, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel201
  - number: 201.2.a
    text: |-
      bij de bepaling van de richting van de luchtstroming, bouwwerken en daarmee gelijk te stellen belemmeringen die
      zich niet bevinden op het perceel waarop het gebouw is gelegen, buiten beschouwing blijven, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel201
  - number: 201.2.b
    text: |-
      bij de bepaling van de ligging van een opening van de voorziening, voorzieningen voor de toevoer van
      verbrandingslucht en de afvoer van rook, voor zover die bestemd zijn voor de afvoer van rook, en voorzieningen
      voor de toevoer van verse lucht en de afvoer van binnenlucht, voor zover die bestemd zijn voor de afvoer van
      binnenlucht, die zich niet bevinden op het perceel waarop het gebouw is gelegen, en voorzieningen ten behoeve van
      de ontluchting van een voorziening voor afvalwater en faecaliën buiten beschouwing blijven.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel201
  - number: '201.3'
    text: |-
      Een opening van de voorziening voor de toevoer van verse lucht en de afvoer van binnenlucht moet zijn gelegen op
      een afstand van ten minste 2 m van de perceelsgrens, gemeten loodrecht op de uitwendige scheidingsconstructie van
      het gebouw.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel201
  - number: '201.4'
    text: |-
      In afwijking van het derde lid, mag, indien het perceel waarop het gebouw is gelegen, grenst aan een openbare weg,
      openbaar water of openbaar groen, de afstand zijn aangehouden tot het hart van die weg, dat water of dat groen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel201
  - number: '201.5'
    text: |-
      De voorziening voor de toevoer van verse lucht naar een verblijfsgebied en een verblijfsruimte en voor de
      afvoer van binnenlucht uit dat gebied en die ruimte moet een capaciteit hebben die is afgestemd op de bestemming
      en inrichting van dat gebied of die ruimte. Ten aanzien van de bepaling van de capaciteit is NEN 1087 van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel201
  - number: '201.6'
    text: |-
      De voorziening voor de toevoer van verse lucht en de afvoer van binnenlucht, bedoeld in het vijfde lid, heeft voor
      een verblijfsgebied van ten minste een capaciteit als aangegeven in tabel V*a*, waarbij is uitgegaan van de in
      tabel V*b* aangegeven klassen. Tabel V*a* Ventilatiecapaciteit







