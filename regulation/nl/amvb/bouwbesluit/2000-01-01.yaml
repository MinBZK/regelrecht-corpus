$id: bouwbesluit
regulatory_layer: AMVB
publication_date: '1998-11-17'
valid_from: '2000-01-01'
bwb_id: BWBR0005321
url: https://wetten.overheid.nl/BWBR0005321/2000-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordrachten van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 23
    januari 1991, nr. MJZ20d90002, en van 16 juli 1991, nr. MJZ16791004, Centrale Directie Juridische Zaken, Afdeling
    Wetgeving;

    Overwegende, dat uit het oogpunt van veiligheid technische voorschriften moeten worden gegeven omtrent het bouwen
    van een bouwwerk en de staat van een bestaand bouwwerk die ertoe strekken dat gevaar voor gebruikers van dat
    bouwwerk of voor derden wordt voorkomen of beperkt;

    dat uit het oogpunt van gezondheid technische voorschriften moeten worden gegeven omtrent het bouwen van een
    bouwwerk en de staat van een bestaand bouwwerk die ertoe strekken dat schadelijke of hinderlijke gevolgen voor
    gebruikers van dat bouwwerk of voor derden worden voorkomen of beperkt;

    dat uit het oogpunt van bruikbaarheid technische voorschriften moeten worden gegeven omtrent het bouwen van
    een bouwwerk en de staat van een bestaand bouwwerk die ertoe strekken dat in dat bouwwerk de voor dat bouwwerk
    kenmerkende activiteiten kunnen worden verricht;

    dat uit het oogpunt van energiezuinigheid technische voorschriften moeten worden gegeven omtrent het bouwen van een
    gebouw die ertoe strekken dat dat gebouw bijdraagt tot een zuinig verbruik van energie in dat gebouw;

    dat voorschriften moeten worden gegeven ter uitvoering van de richtlijn van de Raad van de Europese Gemeenschappen
    van 21 december 1988 betreffende de onderlinge aanpassing van de wettelijke en bestuursrechtelijke bepalingen der
    Lid-Staten inzake voor de bouw bestemde produkten (89/106/EEG, PbEG L40);

    Gelet op de artikelen 2, 3, 5, 6, 88 en 120 van de Woningwet (Stb. 1991, 439);

    De Raad van State gehoord (advies van 4 september 1991, no.W08.91.0043);

    Gezien het nader rapport van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 13
    december 1991, nr. MJZ 13d91024, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Voor de toepassing van de bij of krachtens dit besluit gegeven voorschriften wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.1.a
    text: |-
      bouwconstructie: constructie van een bouwwerk of onderdeel van die constructie, welke constructie of welk onderdeel
      is bestemd om belasting te dragen;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.1.b
    text: 'gebruiksoppervlakte: gebruiksoppervlakte als bedoeld in NEN 2580;'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.1.c
    text: |-
      gemeenschappelijke ruimte: tot een gebouw behorende ruimte waarop twee of meer woningen of logiesverblijven zijn
      aangewezen;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.1.d
    text: 'klimlijn: denkbeeldige, vloeiend verlopende lijn die de voorkanten van de treden van een trap met elkaar verbindt;'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.1.e
    text: 'NEN: door de Stichting Nederlands Normalisatie-Instituut uitgegeven norm;'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.1.f
    text: 'netto-inhoud: netto-inhoud als bedoeld in NEN 2580;'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.1.g
    text: |-
      richtlijn bouwprodukten: richtlijn van de Raad van de Europese Gemeenschappen van 21 december 1988 betreffende
      de onderlinge aanpassing van de wettelijke en bestuursrechtelijke bepalingen der Lid-Staten inzake voor de bouw
      bestemde produkten (89/106/EEG, *PbEG* L 40);
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.1.h
    text: |-
      inwendige scheidingsconstructie: constructie die de scheiding vormt tussen twee voor mensen toegankelijke besloten
      ruimten van een gebouw, waaronder begrepen de op die constructie aansluitende delen van andere constructies, voor
      zover die delen van invloed zijn op het voldoen van die scheidingsconstructie aan een bij of krachtens dit besluit
      gegeven voorschrift;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.1.i
    text: |-
      uitwendige scheidingsconstructie: constructie die de scheiding vormt tussen een voor mensen toegankelijke
      besloten ruimte van een gebouw en de buitenlucht, de grond of het water, waaronder begrepen de op die constructie
      aansluitende delen van andere constructies, voor zover die delen van invloed zijn op het voldoen van die
      scheidingsconstructie aan een bij of krachtens dit besluit gegeven voorschrift;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.1.j
    text: |-
      technische ruimte: besloten ruimte, bestemd voor de plaatsing van de voor het functioneren van een gebouw
      noodzakelijke apparatuur;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.1.k
    text: |-
      toegankelijkheidssector: gedeelte van een gebouw, bestaande uit een of meer met elkaar in verbinding staande
      ruimten die mede zijn bestemd voor gebruik door bezoekers;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.1.l
    text: |-
      bijzondere toegankelijkheidssector: gedeelte van een toegankelijkheidssector dat mede is bestemd voor gebruik door
      rolstoelgebruikers;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.1.m
    text: |-
      veiligheidstrappehuis: verkeersruimte waarin een trap is gelegen waarover een vluchtweg voert, welke ruimte in de
      vluchtrichting uitsluitend kan worden bereikt vanuit een niet besloten ruimte;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.1.n
    text: |-
      verblijfsgebied: besloten ruimte, bestaande uit een of meer met elkaar in verbinding staande, op dezelfde bouwlaag
      gelegen verblijfsruimten en andere afzonderlijke ruimten, anders dan een toilet- of badruimte, technische ruimte of
      gemeenschappelijke verkeersruimte;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.1.o
    text: 'verblijfsruimte: besloten ruimte, bestemd voor het verblijven van mensen;'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.1.p
    text: |-
      verkeersruimte: ruimte van een bouwwerk, bestemd voor het bereiken van een andere, van het bouwwerk deel uitmakende
      ruimte;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.1.q
    text: |-
      vluchtmogelijkheid: van rook gevrijwaarde route, uitsluitend voerend over een of meer vloeren, trappen of
      hellingbanen, langs welke route het aansluitende terrein kan worden bereikt zonder dat deuren worden gepasseerd die
      met een sleutel moeten worden geopend;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.1.r
    text: 'vluchtweg: van brand gevrijwaarde vluchtmogelijkheid die uitsluitend door een of meer verkeersruimten voert;'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.1.s
    text: 'vrije doorgang: vrije doorgang als bedoeld in NEN 2580;'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.1.t
    text: 'vrije hoogte: vrije hoogte als bedoeld in NEN 2580;'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.1.u
    text: 'vrije vloeroppervlakte: vloeroppervlakte waarboven zich een vrije hoogte bevindt van ten minste 2,1 m.'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: '1.2'
    text: 'Voor de toepassing van de bij of krachtens dit besluit gegeven voorschriften wordt voorts verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.2.a
    text: |-
      bijeenkomstgebouw: gebouw of gedeelte van een gebouw, welk gebouw of welk gedeelte blijkens zijn constructie en
      inrichting is bestemd voor doeleinden van mondelinge communicatie of cultuur;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.2.b
    text: |-
      cel: gebouw of gedeelte van een gebouw, welk gebouw of welk gedeelte blijkens zijn constructie en inrichting is
      bestemd voor gedwongen tijdelijk verblijf van mensen die hun hoofdverblijf elders hebben;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.2.c
    text: |-
      cellengebouw: gebouw of een gedeelte van een gebouw, in welk gebouw of welk gedeelte twee of meer cellen zijn
      gelegen die zijn te bereiken door een of meer verkeersruimten;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.2.d
    text: |-
      complex: verzameling van niet in een logiesgebouw gelegen logiesverblijven die in het kader van een bedrijf of in
      enigerlei vorm van samenwerking door de rechthebbenden wordt beheerd;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.2.e
    text: |-
      gezondheidszorggebouw: gebouw of gedeelte van een gebouw, welk gebouw of welk gedeelte blijkens zijn constructie
      en inrichting is bestemd voor doeleinden van medische verpleging, verzorging of behandeling dan wel van medisch
      onderzoek;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.2.f
    text: |-
      horecagebouw: gebouw of gedeelte van een gebouw, welk gebouw of gedeelte blijkens zijn constructie en inrichting is
      bestemd voor het bedrijfsmatig verstrekken van consumpties en het gebruik daarvan ter plaatse;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.2.g
    text: |-
      industriegebouw: gebouw of gedeelte van een gebouw, welk gebouw of welk gedeelte blijkens zijn constructie en
      inrichting is bestemd voor doeleinden van bedrijfsmatige bewerking of opslag van materialen of goederen, het
      bedrijfsmatig telen of opslaan van gewassen of het bedrijfsmatig houden van dieren;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.2.h
    text: |-
      kantoorgebouw: gebouw of gedeelte van een gebouw, welk gebouw of welk gedeelte blijkens zijn constructie en
      inrichting is bestemd voor doeleinden van administratie;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.2.i
    text: |-
      logiesgebouw: gebouw of gedeelte van een gebouw, in welk gebouw of welk gedeelte twee of meer logiesverblijven zijn
      gelegen die zijn te bereiken door een of meer gemeenschappelijke verkeersruimten;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.2.j
    text: |-
      logiesverblijf: gebouw of gedeelte van een gebouw, welk gebouw of welk gedeelte blijkens zijn constructie
      en inrichting is bestemd voor het bieden van recreatief verblijf of tijdelijk onderdak aan mensen die hun
      hoofdverblijf elders hebben;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.2.k
    text: |-
      onderwijsgebouw: gebouw of gedeelte van een gebouw, welk gebouw of welk gedeelte blijkens zijn constructie en
      inrichting is bestemd voor doeleinden van onderwijs;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.2.l
    text: |-
      sportgebouw: gebouw of gedeelte van een gebouw, welk gebouw of welk gedeelte blijkens zijn constructie en
      inrichting is bestemd voor doeleinden van sport;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.2.m
    text: |-
      stationsgebouw: gebouw of gedeelte van een gebouw, welk gebouw of welk gedeelte blijkens zijn constructie
      en inrichting is bestemd voor aankomst en vertrek van openbare voorzieningen van weg-, spoorweg-, water- of
      luchtverkeer;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.2.n
    text: |-
      winkelgebouw: gebouw of gedeelte van een gebouw, welk gebouw of welk gedeelte blijkens zijn constructie en
      inrichting is bestemd voor het verhandelen van materialen, goederen of diensten, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: 1.2.o
    text: |-
      woongebouw: gebouw of gedeelte van een gebouw, in welk gebouw of welk gedeelte twee of meer woningen zijn gelegen
      die zijn te bereiken door een of meer gemeenschappelijke verkeersruimten.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel1
  - number: '2.1'
    text: |-
      Een in NEN 6702 bedoelde uiterste grenstoestand van een bouwconstructie mag, opdat die constructie duurzaam bestand
      is tegen de daarop werkende krachten, bij de in die norm bedoelde fundamentele belastingscombinaties niet zijn
      overschreden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel2
  - number: '2.2'
    text: |-
      Onverminderd het eerste lid, mag een uiterste grenstoestand van een in NEN 6702 bedoelde bouwconstructie bij de in
      die norm bedoelde bijzondere belastingscombinaties niet zijn overschreden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel2
  - number: '2.3'
    text: |-
      Onverminderd het eerste lid, mag, ter voorkoming van voortschrijdende instorting, een in dat lid bedoelde
      uiterste grenstoestand van de in NEN 6702 bedoelde hoofddraagconstructie bij de in die norm bedoelde bijzondere
      belastingscombinaties, met uitzondering van de combinaties met brand, niet zijn overschreden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel2
  - number: '2.4'
    text: |-
      Het niet-overschrijden van een uiterste grenstoestand als bedoeld in het eerste tot en met derde lid, moet zijn
      bepaald overeenkomstig:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel2
  - number: 2.4.a
    text: NEN 6710 en NEN 6770, indien de bouwconstructie is vervaardigd van in die normen bedoeld metaal;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel2
  - number: 2.4.b
    text: NEN 6720 en NEN 6790, indien de bouwconstructie is vervaardigd van in die normen bedoeld steenachtig materiaal;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel2
  - number: 2.4.c
    text: NEN 6760, indien de bouwconstructie is vervaardigd van in die norm bedoeld hout;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel2
  - number: 2.4.d
    text: NEN 2608, indien de bouwconstructie is vervaardigd van in die norm bedoeld glas, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel2
  - number: 2.4.e
    text: NEN 6707, indien de bouwconstructie de in die norm bedoelde bevestiging van dakbedekking is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel2
  - number: '2.5'
    text: |-
      Indien een ander materiaal of een andere bepalingsmethode is toegepast dan in het vierde lid is bedoeld, moet het
      niet-overschrijden van een uiterste grenstoestand van een bouwconstructie zijn bepaald overeenkomstig NEN 6700.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel2
  - number: '2.6'
    text: |-
      Onverminderd het derde lid, mag, opdat een woning of woongebouw bij brand op veilige wijze kan worden verlaten, een
      uiterste grenstoestand van een in tabel I aangegeven bouwconstructie bij de overeenkomstig NEN 6702 in geval van
      brand aan te houden bijzondere belastingscombinaties, gedurende de in die tabel voor die bouwconstructie aangegeven
      tijdsduur van de brandwerendheid met betrekking tot bezwijken, bepaald overeenkomstig NEN 6069 dan wel, voor zover
      van toepassing, NEN 6071, NEN 6072 of NEN 6073, niet zijn overschreden. Tabel I Brandwerendheid met betrekking
      tot bezwijken






                    Bouwconstructie


                    Brandwerendheid met betrekking tot bezwijken in minuten






                    bouwconstructie waarvan het bezwijken leidt tot het onbruikbaar worden van een vluchtmogelijkheid


                    30








                    in NEN 6702 bedoelde hoofddraagconstructie van een niet in een woongebouw gelegen woning


                    60








                    in NEN 6702 bedoelde hoofddraagconstructie van een woongebouw waarin geen vloer van een
      verblijfsgebied hoger is gelegen dan 13 m boven het aansluitende terrein, gemeten ter plaatse van de toegang van
      het woongebouw


                    90








                    in NEN 6702 bedoelde hoofddraagconstructie van een woongebouw waarin een vloer van een
      verblijfsgebied is gelegen op een hoogte van merer dan 13 m boven het aansluitende terrein, gemeten ter plaatse van
      de toegang van het woongebouw


                    120
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel2
  - number: '2.7'
    text: |-
      De in tabel I aangegeven waarde van de brandwerendheid met betrekking tot bezwijken van een hoofddraagconstructie
      als bedoeld in die tabel, mag met ten hoogste 30 minuten zijn verminderd, indien de permanente vuurbelasting van de
      woning of het woongebouw, bepaald overeenkomstig NEN 6090, niet groter is dan 500 MJ/m2.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel2
  - number: '3.1'
    text: |-
      Een vloer moet, ter voorkoming van het van die vloer kunnen vallen, bij de randen zijn voorzien van een afscheiding
      waarvan de hoogte, gemeten vanaf de vloer, ten minste 1 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel3
  - number: '3.2'
    text: |-
      In afwijking in zoverre van het eerste lid, moet, indien de vloer hoger is gelegen dan 13 m boven een aangrenzende
      vloer of boven het aansluitende terrein of water, de hoogte van de afscheiding ten minste 1,2 m zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel3
  - number: '3.3'
    text: |-
      In afwijking in zoverre van het eerste en tweede lid, mag, indien de afscheiding zich bevindt ter plaatse van een
      raam, zijn volstaan met een hoogte van ten minste 0,85 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel3
  - number: '3.4'
    text: |-
      Het eerste tot en met derde lid zijn niet van toepassing op een vloer ter plaatse van de bovenste trede van een
      trap of ter plaatse van de bovenkant van een hellingbaan en op een vloer die niet hoger is gelegen dan 0,6 m boven
      een aangrenzende vloer dan wel boven het aansluitende terrein of water.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel3
  - number: '3.5'
    text: |-
      Tussen een vloer en een afscheiding als bedoeld in het eerste tot en met derde lid, mag, horizontaal gemeten, geen
      opening aanwezig zijn die breder is dan 0,05 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel3
  - number: '3.6'
    text: |-
      Openingen in een afscheiding als bedoeld in het eerste tot en met derde lid, mogen niet breder zijn dan 0,1 m,
      tenzij die openingen zich bevinden op een hoogte van meer dan 0,7 m boven de vloer.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel3
  - number: '3.7'
    text: |-
      In een afscheiding als bedoeld in het eerste tot en met derde lid, mogen zich, ter voorkoming van het
      overklauteren, geen opstapmogelijkheden bevinden tussen 0,2 m en 0,7 m boven de vloer.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel3
  - number: '4'
    text: |-
      Een hoogteverschil van meer dan 0,21 m tussen vloeren van verblijfsgebieden, toiletruimten, badruimten en
      gemeenschappelijke verkeersruimten dan wel tussen één van die vloeren en het aansluitende terrein moet, opdat
      die gebieden en ruimten op veilige wijze kunnen worden bereikt en verlaten, zijn overbrugd door een trap of
      hellingbaan.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel4
  - number: '5.1'
    text: |-
      De afmetingen van een trap als bedoeld in artikel 4, moeten ten minste voldoen aan kolom A van tabel II, of, indien
      de trap is bestemd voor het ontsluiten van een woning met een gebruiksoppervlakte van meer dan 500 m2 dan wel voor
      het ontsluiten van een woongebouw of van de in dat gebouw gelegen woningen, aan kolom B van die tabel. Tabel II
