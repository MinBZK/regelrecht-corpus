    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel201
  - number: '201.7'
    text: |-
      De toevoer van verse lucht, bedoeld in het zesde lid, naar een verblijfsgebied vindt rechtstreeks van buiten
      plaats.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel201
  - number: '201.8'
    text: |-
      De voorziening voor de toevoer van verse lucht en de afvoer van binnenlucht, bedoeld in het vijfde lid, heeft voor
      een verblijfsruimte ten minste een capaciteit als aangegeven in tabel V*a*.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel201
  - number: '201.9'
    text: |-
      Onverminderd het vijfde en het zesde lid, moet, indien in het verblijfsgebied of de verblijfsruimte ten hoogste één
      opstelplaats voor een kooktoestel is gelegen, de capaciteit voor de toevoer van verse lucht naar dat gebied of die
      ruimte en de afvoer van binnenlucht uit dat gebied of die ruimte ten minste 21.10-3 m3/s zijn, met dien verstande
      dat de afvoer van die capaciteit rechtstreeks naar buiten moet plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel201
  - number: '201.10'
    text: |-
      De voorziening voor de toevoer van verse lucht en de afvoer van binnenlucht moet een capaciteit hebben van ten
      minste:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel201
  - number: 201.10.a
    text: 7.10-3 m3/s voor een toiletruimte, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel201
  - number: 201.10.b
    text: 14.10-3 m3/s voor een badruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel201
  - number: '201.11'
    text: De afvoer van binnenlucht, bedoeld in het tiende lid, moet rechtstreeks naar buiten plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel201
  - number: '202.1'
    text: |-
      In een ruimte als bedoeld in het vijfde lid, moet, ter beperking van het ontstaan van een voor de gezondheid
      nadelige kwaliteit van de binnenlucht, een voorziening voor de toevoer van verse lucht en de afvoer van binnenlucht
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel202
  - number: '202.2'
    text: |-
      Ten aanzien van de inrichting van de voorziening voor de toevoer van verse lucht en de afvoer van binnenlucht
      is, wat de richting van de luchtstroming betreft, NEN 1087 van overeenkomstige toepassing, met dien verstande dat
      bij de bepaling van die richting, bouwwerken en daarmee gelijk te stellen belemmeringen die zich niet bevinden
      op het perceel waarop het gebouw is gelegen, buiten beschouwing blijven. Op de inrichting van de voorziening
      voor de afvoer van binnenlucht van een opslagruimte voor afval is voorts van toepassing de eis voor de plaats
      van een opening, bedoeld in NEN 1087; daarbij blijven buiten beschouwing bouwwerken en daarmee gelijk te stellen
      belemmeringen die op een aangrenzend perceel liggen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel202
  - number: '202.3'
    text: |-
      Een opening van de voorziening voor de toevoer van verse lucht en de afvoer van binnenlucht moet zijn gelegen op
      een afstand van ten minste 2 m van de perceelsgrens, gemeten loodrecht op de uitwendige scheidingsconstructie van
      het gebouw.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel202
  - number: '202.4'
    text: |-
      In afwijking van het derde lid, mag, indien het perceel waarop het gebouw is gelegen, grenst aan een openbare weg,
      openbaar water of openbaar groen, de afstand zijn aangehouden tot het hart van die weg, dat water of dat groen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel202
  - number: '202.5'
    text: |-
      De voorziening voor de toevoer van verse lucht en de afvoer van binnenlucht moet een capaciteit hebben van ten
      minste:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel202
  - number: 202.5.a
    text: 6.10-3 m3/s per m2 vrije vloeroppervlakte van een liftkooi;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel202
  - number: 202.5.b
    text: 0,1 m3/s voor een besloten opslagruimte voor afval met een netto-inhoud van meer dan 3 m3;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel202
  - number: 202.5.c
    text: 3.10-3 m3/s per m2 gebruiksoppervlakte van een stallingsruimte, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel202
  - number: 202.5.d
    text: 2.10-3 m3/s per m3 netto-inhoud voor een meterruimte, met een minimum van 2.10-3 m3/s.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel202
  - number: '202.6'
    text: |-
      De toevoer van verse lucht naar een besloten opslagruimte voor afval met een netto-inhoud van meer dan 3 m3 moet
      rechtstreeks van buiten plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel202
  - number: '202.7'
    text: |-
      De afvoer van binnenlucht uit een besloten opslagruimte voor afval met een netto-inhoud van meer dan 3 m3 moet
      rechtstreeks naar buiten plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel202
  - number: '202.8'
    text: |-
      De toevoer van verse lucht naar de kooi van een brandweerlift en de afvoer van binnenlucht uit die kooi moeten
      plaatsvinden vanuit respectievelijk naar de liftschacht.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel202
  - number: '202.9'
    text: |-
      De toevoer van verse lucht naar de liftschacht, bedoeld in het achtste lid, en de afvoer van binnenlucht uit die
      schacht mogen niet vanuit respectievelijk naar een andere binnen het gebouw gelegen besloten ruimte plaatsvinden,
      tenzij die ruimte een verkeersruimte is waarin een trap is gelegen die is bestemd voor het ontsluiten van een in
      het gebouw gelegen verblijfsgebied.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel202
  - number: '203.1'
    text: |-
      In een gebouw moet, voor zover daarin een opstelplaats voor een verbrandingstoestel, niet zijnde een kooktoestel
      met een nominale belasting als bedoeld in NEN 2757, van niet meer dan 15 kW, aanwezig is, ter voorkoming van een
      onaanvaardbare ophoping van vergiftige of hinderlijke gassen, een voorziening voor de toevoer van verbrandingslucht
      en de afvoer van rook aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel203
  - number: '203.2'
    text: |-
      De voorziening voor de toevoer van verbrandingslucht en de afvoer van rook moet een in NEN 2757 aangegeven
      capaciteit hebben. Ten aanzien van de bepaling van de capaciteit van de toevoer van verbrandingslucht is NEN 1087
      van overeenkomstige toepassing en ten aanzien van de bepaling van de capaciteit van de afvoer van rook is NEN 2757
      van toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel203
  - number: '203.3'
    text: 'Onverminderd het tweede lid, is ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel203
  - number: 203.3.a
    text: |-
      een opstelplaats voor een stooktoestel uitgegaan van een op gas gestookt verbrandingstoestel met een belasting van
      ten minste 30 W per m2 van de op dat toestel aangewezen gebruiksoppervlakte van het gebouw, met een minimum van 6
      kW, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel203
  - number: 203.3.b
    text: |-
      een opstelplaats voor een warmwatertoestel uitgegaan van een op gas gestookt toestel met een belasting van ten
      minste 20 W per m2 van de op dat toestel aangewezen gebruiksoppervlakte van het gebouw, met een minimum van 6 kW.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel203
  - number: '203.4'
    text: |-
      In afwijking in zoverre van het derde lid, mag, indien het warmwatertoestel is samengevoegd met het stooktoestel,
      zijn uitgegaan van een belasting van dat samengevoegde toestel van ten minste 30 W per m2 van de op dat toestel
      aangewezen gebruiksoppervlakte van het gebouw, met een minimum van 6 kW per opstelplaats.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel203
  - number: '203.5'
    text: |-
      Onverminderd het tweede lid, moet bij een verbrandingstoestel met een belasting van meer dan 130 kW de voorziening
      voor de toevoer van verbrandingslucht en de afvoer van rook zodanig zijn dat die toe- en afvoer met een op dat
      toestel afgestemde capaciteit plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel203
  - number: '203.6'
    text: |-
      De inrichting van een voorziening voor de toevoer van verbrandingslucht en de afvoer van rook, voor zover die is
      bestemd voor de toevoer van verbrandingslucht, moet, indien die toevoer rechtstreeks van buiten plaatsvindt, ten
      minste voldoen aan NEN 2757, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel203
  - number: 203.6.a
    text: |-
      bij de bepaling van de richting van de luchtstroming, bouwwerken en daarmee gelijk te stellen belemmeringen die
      zich niet bevinden op het perceel waarop het gebouw is gelegen, buiten beschouwing blijven, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel203
  - number: 203.6.b
    text: |-
      bij de bepaling van de ligging van de opening van de voorziening, voorzieningen voor de afvoer van rook en
      voorzieningen voor de afvoer van binnenlucht, die zich niet bevinden op het perceel waarop het gebouw is gelegen,
      en ontluchtingsvoorzieningen ten behoeve van de voorziening voor afvalwater en faecaliën buiten beschouwing
      blijven.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel203
  - number: '203.7'
    text: |-
      De opening van een voorziening voor de toevoer van verbrandingslucht en de afvoer van rook, voor zover die opening
      is bestemd voor de toevoer van verbrandingslucht, moet zijn gelegen op een afstand van ten minste 2 m van de
      perceelsgrens, gemeten loodrecht op de uitwendige scheidingsconstructie van het gebouw.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel203
  - number: '203.8'
    text: |-
      In afwijking van het zevende lid, mag, indien het perceel waarop het gebouw is gelegen, grenst aan een openbare
      weg, openbaar water of openbaar groen, de afstand zijn aangehouden tot het hart van die weg, dat water of dat
      groen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel203
  - number: '203.9'
    text: |-
      De inrichting van een voorziening voor de toevoer van verbrandingslucht en de afvoer van rook, voor zover die
      voorziening is bestemd voor de afvoer van rook, moet ten minste voldoen aan NEN 2757, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel203
  - number: 203.9.a
    text: |-
      bij de bepaling van de plaats van de uitmonding van die voorziening in een uitwendige scheidingsconstructie, niet
      zijnde het dak, tussen die uitmonding en de perceelsgrens, langszij gemeten, een afstand moet zijn aangehouden van
      ten minste 1 m en, gemeten loodrecht op de uitwendige scheidingsconstructie, van ten minste 2 m, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel203
  - number: 203.9.b
    text: |-
      bij de bepaling van de plaats van de uitmonding van die voorziening, bouwwerken en andere daarmee gelijk te stellen
      belemmeringen die zich niet bevinden op het perceel waarop het gebouw is gelegen, buiten beschouwing blijven.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel203
  - number: '203.10'
    text: |-
      In afwijking van het negende lid, onderdeel *a*, mag, indien het perceel waarop het gebouw is gelegen, grenst aan
      een openbare weg, openbaar water of openbaar groen, de afstand zijn aangehouden tot het hart van die weg, dat water
      of dat groen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel203
  - number: '203.11'
    text: |-
      Indien toepassing is gegeven aan het negende lid, aanhef, en onderdeel *b*, moet de voorziening voor de toevoer van
      verbrandingslucht en de afvoer van rook, voor zover die is bestemd voor natuurlijke afvoer van rook, ter voorkoming
      van het terugstromen van die rook, zijn voorzien van een goed functionerende kap.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel203
  - number: '204'
    text: |-
      Bij ministeriële regeling kunnen, ter beperking van de aanwezigheid in of bij een gebouw van een voor de
      gezondheid onaanvaardbare mate van vergiftige of hinderlijke stoffen of van ioniserende straling als bedoeld in
      [artikel 1, eerste lid, onderdeel ][ref1], voorschriften worden gegeven omtrent het in de constructie toepassen van
      materialen waaruit die stoffen kunnen vrijkomen of die stralen kunnen ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel1
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel204
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '1'
  - number: '205'
    text: |-
      Bij ministeriële regeling kunnen, ter beperking van de blootstelling van gebruikers van een gebouw waarin een
      verblijfsgebied is gelegen, aan uit de grond afkomstige schadelijke stoffen of straling, voorschriften worden
      gegeven waaraan een uitwendige scheidingsconstructie die de scheiding vormt met de grond, alsmede een constructie
      die de scheiding vormt met de kruipruimte van het gebouw, met inbegrip van de op die constructie aansluitende delen
      van andere constructies, voor zover die delen van invloed zijn op het voldoen van die constructie aan dit artikel,
      moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel205
  - number: '206.1'
    text: |-
      In een uitwendige scheidingsconstructie van een gebouw waarin een verblijfsgebied is gelegen, mogen zich, ter
      beperking van het in het gebouw kunnen binnendringen van ratten en muizen, geen onafsluitbare openingen bevinden
      die breder zijn dan 0,01 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel206
  - number: '206.2'
    text: |-
      Het eerste lid is niet van toepassing op een opening die aan de bovenzijde de uitmonding vormt van een verticaal
      kanaal.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel206
  - number: '206.3'
    text: |-
      Onder een gebouw waarin een verblijfsgebied is gelegen, moet ter plaatse van de uitwendige scheidingsconstructie
      tot een diepte van ten minste 0,6 m, gemeten vanaf het aansluitende terrein, een scherm aanwezig zijn, waarin zich
      geen openingen bevinden die breder zijn dan 0,01 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel206
  - number: '207.1'
    text: |-
      In een gebouw moet, afhankelijk van zijn bestemming en inrichting, opdat kan worden beschikt over voor de
      menselijke consumptie en hygiëne geschikt water, een voorziening voor drinkwater aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel207
  - number: '207.2'
    text: |-
      Een voorziening voor drinkwater moet ten minste voldoen aan artikel 5, eerste lid, onderdeel 2, van de Model-
      aansluitvoorwaarden voor drinkwater van de Vereniging van Exploitanten van Waterleidingbedrijven in Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel207
  - number: '208.1'
    text: |-
      Een voorziening voor drinkwater moet, opdat drinkwater kan worden betrokken, in de meterruimte een
      aansluitmogelijkheid hebben voor aansluiting op het distributienet van drinkwater.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel208
  - number: '208.2'
    text: |-
      De voorziening voor drinkwater heeft, opdat op die voorziening watertoestellen kunnen worden aangesloten, voorts
      ten minste één aansluitpunt:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel208
  - number: 208.2.a
    text: bij een opstelplaats voor het aanrecht;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel208
  - number: 208.2.b
    text: in een toiletruimte;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel208
  - number: 208.2.c
    text: in een badruimte;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel208
  - number: 208.2.d
    text: bij een opstelplaats voor een warmwatertoestel, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel208
  - number: 208.2.e
    text: bij een brandslanghaspel.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel208
  - number: '209.1'
    text: |-
      Een voorziening voor warm water moet, opdat voor de menselijke hygiëne geschikt warm water kan worden betrokken,
      ten minste voldoen aan artikel 5, eerste lid, onderdeel 2, van de Model-aansluitvoorwaarden voor drinkwater van de
      Vereniging van Exploitanten van Waterleidingbedrijven in Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel209
  - number: '209.2'
    text: |-
      De voorziening voor warm water heeft, opdat warm water kan worden betrokken, ter plaatse van een opstelplaats voor
      een warmwatertoestel, ten minste één aansluitpunt voor het kunnen aansluiten van dat toestel op die voorziening.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel209
  - number: '209.3'
    text: De warmwatervoorziening heeft voorts ten minste één aansluitpunt in de badruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel209
  - number: '210.1'
    text: |-
      Een gebouw moet, afhankelijk van zijn bestemming en inrichting, zodanig zijn geconstrueerd dat in een
      verblijfsgebied en in een verblijfsruimte, bepaald overeenkomstig NEN 2057, een zodanige equivalente
      daglichtoppervlakte aanwezig is, dat in dat gebied en die ruimte voldoende daglicht kan toetreden en vanuit dat
      gebied en die ruimte naar buiten kan worden gekeken.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel210
  - number: '210.2'
    text: |-
      Bij de bepaling van de in het eerste lid bedoelde equivalente daglichtoppervlakte blijven bouwwerken en
      daarmee gelijk te stellen belemmeringen die zich niet bevinden op het perceel waarop het gebouw is gelegen, en
      daglichtopeningen in een uitwendige scheidingsconstructie, voor zover die openingen, gemeten loodrecht op die
      openingen, zijn gelegen op een afstand van minder dan 2 m van de perceelsgrens, buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel210
  - number: '210.3'
    text: |-
      In afwijking in zoverre van het tweede lid, mag, indien het perceel waarop het gebouw is gelegen, grenst aan een
      openbare weg, openbaar water of openbaar groen, de afstand zijn aangehouden tot het hart van die weg, dat water of
      dat groen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel210
  - number: '210.4'
    text: |-
      Bij de bepaling van de in het eerste lid bedoelde equivalente daglichtoppervlakte moet de in rekening te brengen
      belemmeringshoek α, bedoeld in NEN 2057, ten minste 25° zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel210
  - number: '210.5'
    text: |-
      In afwijking in zoverre van het eerste lid, mag de equivalente daglichtoppervlakte zich bevinden in een inwendige
      scheidingsconstructie van een verblijfsgebied of van een verblijfsruimte, indien die constructie niet de scheiding
      vormt met een ander verblijfsgebied of met een toiletruimte, badruimte of bergruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel210
  - number: '211.1'
    text: |-
      Indien niet is voldaan aan enig voorschrift, gegeven bij of krachtens de artikelen 194 tot en met 210, moet een
      gebouw een mate van bescherming van de gezondheid bieden, die ten minste gelijk is aan de mate van bescherming die
      is beoogd met het desbetreffende bij of krachtens die artikelen gegeven voorschrift.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel211
  - number: '211.2'
    text: |-
      Indien toepassing is gegeven aan het eerste lid en het desbetreffende voorschrift tevens valt te herleiden tot
      overwegingen van veiligheid, bruikbaarheid of energiezuinigheid, moeten die overwegingen daarbij in ten minste
      dezelfde mate in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel211
  - number: '211.3'
    text: |-
      Ten aanzien van de bij of krachtens hoofdstuk VII uit het oogpunt van gezondheid gegeven voorschriften zijn het
      eerste en tweede lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel211
  - number: '212.1'
    text: |-
      Een gebouw moet, afhankelijk van zijn bestemming en grootte, opdat het mede toegankelijk is voor bezoekers, zijn
      voorzien van ten minste één toegankelijkheidssector die vanaf het aansluitende terrein rechtstreeks bereikbaar is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel212
  - number: '212.2'
    text: |-
      Een gedeelte van de toegankelijkheidssector moet, afhankelijk van de grootte van het gebouw, opdat het gebouw
      mede toegankelijk is voor rolstoelgebruikers, zijn ingericht als bijzondere toegankelijkheidssector, die vanaf het
      aansluitende terrein rechtstreeks bereikbaar is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel212
  - number: '212.3'
    text: |-
      In de bijzondere toegankelijkheidssector moet ten minste één verblijfsruimte en, afhankelijk van de bestemming van
      het gebouw, ten minste één toiletruimte aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel212
  - number: '212.4'
    text: |-
      In de bijzondere toegankelijkheidssector moeten voorts ten minste één badruimte en één kleedruimte aanwezig zijn,
      indien het een gebouw dan wel een gedeelte van een gebouw betreft dat blijkens zijn constructie en inrichting is
      bestemd voor doeleinden van sport.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel212
  - number: '212.5'
    text: |-
      Een hoogteverschil tussen ten minste één toegang van de bijzondere toegankelijkheidssector en het aansluitende
      terrein mag niet groter zijn dan 1 m en moet, tenzij het hoogteverschil niet groter is dan 0,02 m, zijn overbrugd
      door een hellingbaan als bedoeld in artikel 178.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel212
  - number: '212.6'
    text: |-
      Een hoogteverschil van meer dan 0,02 m tussen vloeren van ruimten die deel uitmaken van de bijzondere
      toegankelijkheidssector, moet zijn overbrugd door een hellingbaan als bedoeld in artikel 178, of een lift.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel212
  - number: '212.7'
    text: |-
      De kooi van de lift, bedoeld in het zesde lid, moet een vrije vloeroppervlakte hebben van ten minste 1,05 m * 1,35
      m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel212
  - number: '213.1'
    text: |-
      De toegang van een ruimte die is gelegen in een toegankelijkheidssector, alsmede de toegang van een
      toegankelijkheidssector ter plaatse van het aansluitende terrein en de toegang van de bijzondere
      toegankelijkheidssector ter plaatse van het aansluitende terrein als bedoeld in artikel 212, onderscheidenlijk het
      eerste, tweede en vijfde lid, moeten, met het oog op de toegankelijkheid, een vrije doorgang hebben van ten minste
      0,85 m en een hoogte van ten minste 2,1 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel213
  - number: '213.2'
    text: |-
      Een verkeersruimte die deel uitmaakt van een toegankelijkheidssector, moet, met het oog op de begaanbaarheid, een
      vrije vloeroppervlakte hebben met een breedte van ten minste 1,1 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel213
  - number: '213.3'
    text: |-
      Een verkeersruimte die deel uitmaakt van een bijzondere toegankelijkheidssector moet een vrije vloeroppervlakte
      hebben met een breedte van ten minste 1,4 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel213
  - number: '214.1'
    text: |-
      In een gebouw moet, afhankelijk van zijn bestemming, opdat daarin voor het gebouw kenmerkende activiteiten kunnen
      plaatsvinden, ten minste 55% van de gebruiksoppervlakte in een of meer verblijfsgebieden zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel214
  - number: '214.2'
    text: |-
      Een verblijfsgebied moet een vloeroppervlakte hebben van ten minste 5 m2, waarvan de breedte ten minste 1,8 m en de
      hoogte boven die oppervlakte ten minste 2,4 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel214
  - number: '214.3'
    text: |-
      Een verblijfsgebied mag, indien het gebouw ter uitvoering van artikel 188 is verdeeld in rookcompartimenten, niet
      zijn gelegen in meer dan één rookcompartiment.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel214
  - number: '215'
    text: |-
      Een verblijfsruimte moet een vloeroppervlakte hebben van ten minste 5 m2, waarvan de breedte ten minste 1,8 m en de
      hoogte boven die oppervlakte ten minste 2,4 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel215
  - number: '216.1'
    text: |-
      In een gebouw moeten, afhankelijk van zijn bestemming en grootte, opdat sanitaire handelingen kunnen worden
      verricht, voldoende afsluitbare toiletruimten aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel216
  - number: '216.2'
    text: |-
      Een toiletruimte als bedoeld in het eerste lid, moet een vloeroppervlakte hebben van ten minste 1 m2, waarvan de
      breedte ten minste 0,8 m en de hoogte boven die oppervlakte ten minste 2,1 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel216
  - number: '216.3'
    text: |-
      In afwijking in zoverre van het tweede lid, moet de toiletruimte die deel uitmaakt van een bijzondere
      toegankelijkheidssector een vloeroppervlakte hebben van ten minste 2,2 m * 2,2 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel216
  - number: '217.1'
    text: |-
      In een gebouw moeten, afhankelijk van zijn bestemming en grootte, opdat gebruikers van het gebouw zich kunnen
      wassen, voldoende afsluitbare badruimten aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel217
  - number: '217.2'
    text: 'Het eerste lid is van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel217
  - number: 217.2.a
    text: een cellengebouw, dat is bestemd voor het gedwongen verblijf van personen gedurende meer dan twee dagen;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel217
  - number: 217.2.b
    text: |-
      een gedeelte van een gezondheidszorggebouw, welk gedeelte is bestemd voor het verblijf van patiënten die als gevolg
      van hun lichamelijke of geestelijke gesteldheid permanent of tijdelijk aan bed gebonden zijn;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel217
  - number: 217.2.c
    text: een onderwijsgebouw, waarin bouwkundig onderwijs wordt gegeven;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel217
  - number: 217.2.d
    text: een sportgebouw, dat is bestemd voor de zwemsport, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel217
  - number: 217.2.e
    text: een sportgebouw, dat tot een onderwijsgebouw behoort.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel217
  - number: '217.3'
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel217
  - number: 217.3.a
    text: een bijeenkomstgebouw;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel217
  - number: 217.3.b
    text: |-
      een gedeelte van een gezondheidszorggebouw, welk gedeelte niet is bestemd voor het verblijf van patiënten die als
      gevolg van hun lichamelijke of geestelijke gesteldheid permanent of tijdelijk aan bed gebonden zijn;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel217
  - number: 217.3.c
    text: een horecagebouw;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel217
  - number: 217.3.d
    text: een onderwijsgebouw, dat niet is bestemd voor bouwkundig onderwijs;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel217
  - number: 217.3.e
    text: een industriegebouw;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel217
  - number: 217.3.f
    text: een sportgebouw, dat niet is bestemd voor de zwemsport;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel217
  - number: 217.3.g
    text: een sportgebouw, dat niet behoort tot een onderwijsgebouw;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel217
  - number: 217.3.h
    text: een stationsgebouw;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel217
  - number: 217.3.i
    text: een winkelgebouw, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel217
  - number: 217.3.j
    text: |-
      een gebouw, niet zijnde een gebouw als bedoeld in artikel 1, tweede lid, onderdelen *a* tot en met *c* en *e* tot
      en met *o*.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel217
  - number: '217.4'
    text: |-
      Een badruimte als bedoeld in het eerste lid, moet een vloeroppervlakte hebben van ten minste 1,2 m2, waarvan de
      breedte ten minste 0,8 m en de hoogte boven die oppervlakte ten minste 2,1 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel217
  - number: '217.5'
    text: |-
      In afwijking in zoverre van het tweede lid, moet de badruimte die deel uitmaakt van een bijzondere
      toegankelijkheidssector een vloeroppervlakte hebben van ten minste 1,65 m * 1,8 m, waarboven de hoogte ten minste
      2,1 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel217
  - number: '217.6'
    text: |-
      Een badruimte mag, opdat de gebruiksoppervlakte van het gebouw doelmatig kan worden benut, zijn samengevoegd met
      een toiletruimte, mits de vloeroppervlakte van die samengevoegde ruimte ten minste 2,2 m2 is, waarvan de breedte
      ten minste 0,8 m en de hoogte boven die oppervlakte ten minste 2,1 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel217
  - number: '217.7'
    text: |-
      In afwijking in zoverre van het vijfde lid, moet de samengevoegde ruimte die in een bijzondere
      toegankelijkheidssector is gelegen, een vloeroppervlakte hebben van ten minste 7,8 m2, waarvan de breedte ten
      minste 2,2 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel217
  - number: '218.2'
    text: |-
      In een gebouw dan wel op het bij het gebouw behorende perceel, moet, opdat fietsen kunnen worden gestald, een
      ruimte aanwezig zijn met een vloeroppervlakte van ten minste 2% van de gebruiksoppervlakte van het gebouw, met een
      minimum van 5 m2.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel218
  - number: '218.3'
    text: |-
      De vloeroppervlakte, bedoeld in het tweede lid, moet een breedte hebben van ten minste 1,8 m en een hoogte boven
      die vloeroppervlakte van ten minste 2,1 m, en moet, voor zover die ruimte een besloten ruimte is, rechtstreeks
      vanaf het aansluitende terrein bereikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel218
  - number: '219.1'
    text: |-
      Tot een gebouw waarin een voorziening voor elektriciteit, gas, drinkwater of stadsverwarming aanwezig is, die op
      het distributienet kan worden aangesloten of waarin een voorziening voor telecommunicatiesignalen aanwezig is,
      moet, opdat de voor die voorzieningen benodigde centrale schakel-, verdeel- en meetapparatuur kan worden geplaatst,
      ten minste één meterruimte behoren.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel219
  - number: '219.2'
    text: |-
      Ten aanzien van de afmetingen, indeling en leidingdoorvoeren van de meterruimte, bedoeld in het eerste lid, is NEN
      2768 ten minste van overeenkomstige toepassing, met dien verstande dat de afmetingen van de meterruimte moeten zijn
      afgestemd op de in die ruimte te plaatsen apparatuur.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel219
  - number: '219.3'
    text: |-
      Een uitwendige scheidingsconstructie van een meterruimte moet, ter beperking van het kunnen binnendringen van
      vocht, bepaald overeenkomstig NEN 2778, ten minste regenwerend zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel219
  - number: '220.1'
    text: |-
      In een gebouw waarin een lift aanwezig is, moet, opdat die lift doelmatig kan functioneren, een besloten ruimte
      (liftschacht) aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel220
  - number: '220.2'
    text: Een uitwendige scheidingsconstructie van een liftschacht moet, bepaald overeenkomstig NEN 2778, waterdicht zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel220
  - number: '220.3'
    text: 'De vloer van een liftschacht mag niet hoger zijn gelegen dan:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel220
  - number: 220.3.a
    text: |-
      1,4 m onder de vloer ter plaatse van de laagstgelegen vloer waartoe de lift toegang geeft, indien het
      hoogteverschil tussen de laagste en hoogste vloer waartoe de lift toegang geeft niet groter is dan 50 m, of
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel220
  - number: 220.3.b
    text: |-
      1,6 m onder de vloer ter plaatse van de laagstgelegen vloer waartoe de lift toegang geeft, indien het
      hoogteverschil tussen de laagste en hoogste vloer waartoe de lift toegang geeft groter is dan 50 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel220
  - number: '220.4'
    text: 'Het plafond van een liftschacht mag niet lager zijn gelegen dan:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel220
  - number: 220.4.a
    text: |-
      3,6 m boven de vloer ter plaatse van de hoogstgelegen vloer waartoe de lift toegang geeft, indien het
      hoogteverschil tussen de laagste en hoogste vloer waartoe de lift toegang geeft niet groter is dan 50 m, of
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel220
  - number: 220.4.b
    text: |-
      3,8 m boven de vloer ter plaatse van de hoogstgelegen vloer waartoe de lift toegang geeft, indien het
      hoogteverschil tussen de laagste en hoogste vloer waartoe de lift toegang geeft groter is dan 50 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel220
  - number: '220.5'
    text: |-
      In de liftschacht mogen geen leidingen of installaties aanwezig zijn die niet voor de werking of veiligheid van de
      lift vereist zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel220
  - number: '221.1'
    text: |-
      In een gebouw waarin een lift aanwezig is, moet, opdat liftapparatuur kan worden geplaatst, een besloten ruimte
      (liftmachineruimte) aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel221
  - number: '221.2'
    text: |-
      Een uitwendige scheidingsconstructie van een liftmachineruimte moet, ter beperking van het kunnen binnendringen van
      vocht, bepaald overeenkomstig NEN 2778, ten minste regenwerend zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel221
  - number: '221.3'
    text: |-
      Een liftmachineruimte moet een op de omvang van de in die ruimte te plaatsen apparatuur afgestemde vloeroppervlakte
      hebben.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel221
  - number: '222.1'
    text: |-
      Tot een gebouw behoort, afhankelijk van zijn bestemming en inrichting, opdat verwarmingsapparatuur kan worden
      geplaatst, ten minste één opstelplaats voor een stooktoestel, die niet mag zijn gelegen in een toiletruimte,
      badruimte of in een andere besloten ruimte waardoor een vluchtweg voert.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel222
  - number: '222.2'
    text: 'Het eerste lid is in elk geval van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel222
  - number: 222.2.a
    text: een bijeenkomstgebouw;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel222
  - number: 222.2.b
    text: een cellengebouw;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel222
  - number: 222.2.c
    text: een gezondheidszorggebouw;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel222
  - number: 222.2.d
    text: een horecagebouw;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel222
  - number: 222.2.e
    text: een onderwijsgebouw;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel222
  - number: 222.2.f
    text: een sportgebouw, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel222
  - number: 222.2.g
    text: een winkelgebouw.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel222
  - number: '222.3'
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel222
  - number: 222.3.a
    text: een industriegebouw;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel222
  - number: 222.3.b
    text: een stationsgebouw;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel222
  - number: 222.3.c
    text: |-
      een gebouw, niet zijnde een gebouw als bedoeld in artikel 1, tweede lid, onderdelen *a* tot en met *c* en *e* tot
      en met *o*, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel222
  - number: 222.3.d
    text: een gebouw, dat is aangesloten op het distributienet voor stadsverwarming.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel222
  - number: '222.4'
    text: |-
      De afmetingen van een opstelplaats voor een stooktoestel als bedoeld in het eerste lid, moeten zijn afgestemd op de
      daarop te plaatsen apparatuur.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel222
  - number: '222.5'
    text: |-
      Een opstelplaats voor een stooktoestel die is bestemd voor één of meer stooktoestellen met een gezamenlijke
      nominale belasting als bedoeld in NEN 2757, van meer dan 130 kW, moet in een afzonderlijke stookruimte zijn
      gelegen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel222
  - number: '222.6'
    text: De afmetingen van de stookruimte, zijn afgestemd op de daarin te plaatsen verwarmingsapparatuur.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel222
  - number: '223.1'
    text: |-
      In een gebouw moet, afhankelijk van zijn bestemming en inrichting, opdat apparatuur voor het opwarmen van water kan
      worden geplaatst, een opstelplaats voor een warmwatertoestel aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel223
  - number: '223.2'
    text: 'Het eerste lid is in elk geval van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel223
  - number: 223.2.a
    text: een cellengebouw, dat is bestemd voor het gedwongen verblijf van personen gedurende meer dan twee dagen;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel223
  - number: 223.2.b
    text: |-
      een gedeelte van een gezondheidszorggebouw, welk gedeelte is bestemd voor het verblijf van patiënten die als gevolg
      van hun lichamelijke of geestelijke gesteldheid permanent of tijdelijk aan bed gebonden zijn;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel223
  - number: 223.2.c
    text: een onderwijsgebouw, dat is bestemd voor bouwkundig onderwijs;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel223
  - number: 223.2.d
    text: een sportgebouw, dat is bestemd voor de zwemsport, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel223
  - number: 223.2.e
    text: een sportgebouw, dat behoort tot een onderwijsgebouw.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel223
  - number: '223.3'
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel223
  - number: 223.3.a
    text: een bijeenkomstgebouw;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel223
  - number: 223.3.b
    text: |-
      een gedeelte van een gezondheidszorggebouw, welk gedeelte niet is bestemd voor het verblijf van patiënten die als
      gevolg van hun lichamelijke of geestelijke gesteldheid permanent of tijdelijk aan bed gebonden zijn;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel223
  - number: 223.3.c
    text: een horecagebouw;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel223
  - number: 223.3.d
    text: een onderwijsgebouw, dat niet is bestemd voor bouwkundig onderwijs;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel223
  - number: 223.3.e
    text: een industriegebouw;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel223
  - number: 223.3.f
    text: een sportgebouw, dat niet is bestemd voor de zwemsport;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel223
  - number: 223.3.g
    text: een sportgebouw, dat niet behoort tot onderwijsgebouw;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel223
  - number: 223.3.h
    text: een stationsgebouw;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel223
  - number: 223.3.i
    text: een winkelgebouw, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel223
  - number: 223.3.j
    text: |-
      een gebouw, niet zijnde een gebouw als bedoeld in artikel 1, tweede lid, onderdelen *a* tot en met *c* en *e* tot
      en met *o*.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel223
  - number: '223.4'
    text: De afmetingen van de opstelplaats, zijn afgestemd op de daarop te plaatsen apparatuur.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel223
  - number: '223.5'
    text: De opstelplaats voor een warmwatertoestel mag zijn samengevoegd met een opstelplaats voor een stooktoestel.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel223
  - number: '224.1'
    text: |-
      De bovenkant van een in NEN 6740 bedoeld funderingselement van een gebouw waarin één of meer verblijfsgebieden zijn
      gelegen, mag, ter beperking van het verzakken of scheefzakken van het gebouw, bij momentane belastingscombinaties
      als bedoeld in NEN 6702, bepaald overeenkomstig NEN 6740, geen grotere zakking hebben dan 0,15 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel224
  - number: '224.2'
    text: |-
      Onverminderd het eerste lid mag de som van de rotatie en de relatieve rotatie aan de bovenkant van een in NEN 6740
      bedoeld funderingselement van een gebouw waarin één of meer verblijfsgebieden zijn gelegen, niet groter zijn dan
      3,5.10-3 rad.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel224
  - number: '224.3'
    text: |-
      Onverminderd het eerste en tweede lid, moet voor de bepaling van de in die leden bedoelde belastingscombinaties,
      indien NEN 6702 daarin niet voorziet, zijn uitgegaan van NEN 6700.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel224
  - number: '225.1'
    text: |-
      Een vloer van een verblijfsgebied mag, ter beperking van doorbuiging, bij de respons die voortvloeit uit de in
      NEN 6702 bedoelde incidentele en momentane belastingscombinaties, geen grotere doorbuiging in de eindtoestand als
      bedoeld in die norm, hebben dan het produkt van 4.10-3 en de in die norm bedoelde overspanning van die vloer.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel225
  - number: '225.2'
    text: |-
      Onverminderd het eerste lid, moet voor de bepaling van de in dat lid bedoelde belastingscombinaties, indien NEN
      6702 daarin niet voorziet, zijn uitgegaan van NEN 6700.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel225
  - number: '225.3'
    text: |-
      De doorbuiging, bedoeld in het eerste lid, moet zijn bepaald overeenkomstig het gestelde met betrekking tot de
      bepaling van de vervorming in:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel225
  - number: 225.3.a
    text: NEN 6710 en NEN 6770, indien de vloer is vervaardigd van in die normen bedoeld metaal;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel225
  - number: 225.3.b
    text: NEN 6720, indien de vloer is vervaardigd van in die norm bedoeld beton, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel225
  - number: 225.3.c
    text: NEN 6760, indien de vloer is vervaardigd van in die norm bedoeld hout.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel225
  - number: '225.4'
    text: |-
      Indien een ander materiaal of een andere bepalingsmethode is toegepast dan in het derde lid bedoeld, moet de
      doorbuiging, bedoeld in het eerste lid, zijn bepaald overeenkomstig NEN 6700.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel225
  - number: '226.1'
    text: |-
      Indien niet is voldaan aan enig voorschrift, gegeven bij of krachtens de artikelen 212 tot en met 225, moet een
      gebouw een mate van bruikbaarheid bieden die ten minste gelijk is aan de mate van bruikbaarheid die is beoogd met
      het desbetreffende bij of krachtens die artikelen gegeven voorschrift.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel226
  - number: '226.2'
    text: |-
      Indien toepassing is gegeven aan het eerste lid en het desbetreffende voorschrift tevens valt te herleiden tot
      overwegingen van veiligheid, gezondheid of energiezuinigheid, moeten die overwegingen daarbij in ten minste
      dezelfde mate in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel226
  - number: '226.3'
    text: |-
      Ten aanzien van de bij of krachtens hoofdstuk VII uit het oogpunt van bruikbaarheid gegeven voorschriften zijn het
      eerste en tweede lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel226
  - number: '227.1'
    text: |-
      Een uitwendige scheidingsconstructie van een verblijfsgebied, een toiletruimte en een badruimte van een verwarmd
      gebouw heeft, ter beperking van warmteverlies door overdracht of geleiding, bepaald overeenkomstig NEN 1068, een
      warmteweerstand van ten minste 2,5 m2.K/W.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel227
  - number: '227.2'
    text: |-
      Het eerste lid is niet van toepassing op een deur, raam, kozijn en daarmee gelijk te stellen constructie-
      onderdeel, voor zover die deur, dat raam, kozijn of constructie-onderdeel, bepaald overeenkomstig NEN 5128, een
      warmtedoorgangscoëfficiënt heeft van ten hoogste 4,2 W/m2.K.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel227
  - number: '227.3'
    text: 'Het eerste en het tweede lid zijn van overeenkomstige toepassing op:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel227
  - number: 227.3.a
    text: |-
      een constructie die de scheiding vormt tussen een verblijfsgebied, toiletruimte of badruimte en de kruipruimte,
      met inbegrip van de op die constructie aansluitende delen van andere constructies, voor zover die delen van invloed
      zijn op het voldoen van die constructie aan het eerste of tweede lid, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel227
  - number: 227.3.b
    text: |-
      een inwendige scheidingsconstructie van een verblijfsgebied, toiletruimte of badruimte, voor zover die constructie
      niet de scheiding vormt met een ander verblijfsgebied of met een andere toiletruimte of badruimte, waarvan de
      uitwendige scheidingsconstructie, bepaald overeenkomstig NEN 1068, een warmteweerstand heeft van ten minste 2,5
      m2.K/W of waarvan, indien het een deur, raam, kozijn en daarmee gelijk te stellen constructie-onderdeel betreft,
      bepaald overeenkomstig NEN 5128, de warmtedoorgangscoëfficiënt ten hoogste 4,2 W/m2.K is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel227
  - number: '227.4'
    text: |-
      In het totaal van de uitwendige scheidingsconstructies van een in het eerste lid bedoeld gebouw, waaronder
      begrepen inwendige scheidingsconstructies als bedoeld in het derde lid, onderdeel *b*, mag ten hoogste 2% van de
      gebruiksoppervlakte van dat gebouw aan constructie-onderdelen aanwezig zijn, dat niet voldoet aan het eerste tot en
      met het derde lid.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel227
  - number: '228.1'
    text: 'Het totaal aan:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel228
  - number: 228.1.a
    text: uitwendige scheidingsconstructies van een verwarmd gebouw;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel228
  - number: 228.1.b
    text: inwendige scheidingsconstructies tussen een verwarmd gebouw en een niet in dat gebouw gelegen ruimte, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel228
  - number: 228.1.c
    text: |-
      constructies, die de scheiding vormen tussen een verwarmd gebouw en de kruipruimte, met inbegrip van de op die
      constructies aansluitende delen van andere constructies, mag, ter beperking van warmteverlies door tocht, bepaald
      overeenkomstig NEN 2686, geen grotere luchtvolumestroom als bedoeld in die norm, hebben dan 0,2 m3/s.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel228
  - number: '228.2'
    text: |-
      Bij de bepaling van de luchtvolumestroom mogen ruimten, niet zijnde een verblijfsgebied, toilet- of badruimte,
      buiten beschouwing blijven.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel228
  - number: '228.3'
    text: |-
      Bij de bepaling van de luchtvolumestroom blijft voorts buiten beschouwing een ruimte, waarin zich een niet-
      afsluitbare opening van de voorziening voor de toevoer van verse lucht en de afvoer van binnenlucht bevindt, die
      een volgens NEN 1087, bepaalde capaciteit heeft van ten minste 3.10-3 m3/s per m2 gebruiksoppervlakte van die
      ruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel228
  - number: 228a.1
    text: |-
      Onverminderd de artikelen 227 en 228, heeft een gebouw, bepaald overeenkomstig NEN 2916, een zodanige
      energieprestatiecoëfficiënt dat in verdergaande mate energie wordt bespaard.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel228a
  - number: 228a.2
    text: 'Bij de bepaling van de energieprestatiecoëfficiënt wordt aangehouden:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel228a
  - number: 228a.2.a
    text: voor de coëfficiënt voor koeling, bedoeld in NEN 2916, 4, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel228a
  - number: 228a.2.b
    text: |-
      voor de in die norm bedoelde factor waarmee compensatie voor toelaatbaar energiegebruik voor ventilatie wordt
      gerealiseerd, 135.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel228a
  - number: 228a.3
    text: 'De energieprestatiecoëfficiënt van:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel228a
  - number: 228a.3.a
    text: een bijeenkomstgebouw is ten hoogste 2,4;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel228a
  - number: 228a.3.b
    text: een cellengebouw is ten hoogste 2,2;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel228a
  - number: 228a.3.c
    text: een gezondheidszorggebouw is ten hoogste 1,8;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel228a
  - number: 228a.3.d
    text: |-
      een gezondheidszorggebouw of een gedeelte daarvan dat mede is bestemd voor het verblijf van patiënten die als
      gevolg van hun lichamelijke of geestelijke gesteldheid permanent of tijdelijk aan bed gebonden zijn is ten hoogste
      3,8;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel228a
  - number: 228a.3.e
    text: een horecagebouw is ten hoogste 1,9;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel228a
  - number: 228a.3.f
    text: een onderwijsgebouw is ten hoogste 1,5;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel228a
  - number: 228a.3.g
    text: een sportgebouw is ten hoogste 2,2;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel228a
  - number: 228a.3.h
    text: een winkelgebouw is ten hoogste 3,5.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel228a
  - number: 228a.4
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel228a
  - number: 228a.4.a
    text: een industriegebouw;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel228a
  - number: 228a.4.b
    text: een stationsgebouw, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel228a
  - number: 228a.4.c
    text: |-
      een gebouw, niet zijnde een gebouw als bedoeld in artikel 1, tweede lid, onderdelen *a* tot en met *c* en *e* tot
      en met *o*.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel228a
  - number: '229.1'
    text: |-
      Indien niet is voldaan aan enig voorschrift, gegeven bij of krachtens de artikelen 227 tot en met 228*a*, heeft een
      gebouw een mate aan energiezuinigheid, die ten minste gelijk is aan die mate, beoogd met het desbetreffende bij of
      krachtens die artikelen gegeven voorschrift.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel229
  - number: '229.2'
    text: |-
      Indien toepassing is gegeven aan het eerste lid en het desbetreffende voorschrift tevens valt te herleiden tot
      overwegingen van veiligheid, gezondheid of bruikbaarheid, moeten die overwegingen daarbij in ten minste dezelfde
      mate in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel229
  - number: '229.3'
    text: |-
      Ten aanzien van de bij of krachtens hoofdstuk VII uit het oogpunt van energiezuinigheid gegeven voorschriften zijn
      het eerste en tweede lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel229
  - number: '230'
    text: |-
      De verlichtingsinstallatie, bedoeld in artikel 180, eerste lid, van een kantoorgebouw met een gebruiksoppervlakte
      van meer dan 1000 m2, moet zijn aangesloten op een voorziening voor noodstroom als bedoeld in artikel 180, derde
      lid.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel230
  - number: '231.1'
    text: |-
      Een constructie-onderdeel, met uitzondering van een dak, moet, ter beperking van ontwikkeling van brand,
      bepaald overeenkomstig NEN 6065, ten minste behoren tot klasse 4 van de in die norm bedoelde bijdrage tot
      brandvoortplanting, met dien verstande dat de naar een vluchtweg toegekeerde zijde van een constructie-onderdeel
      ten minste moet behoren tot klasse 2.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel231
  - number: '231.2'
    text: |-
      In afwijking in zoverre van het eerste lid, moet de naar de buitenlucht toegekeerde zijde van een constructie-
      onderdeel, met uitzondering van een dak, voor zover dat constructie-onderdeel hoger is gelegen dan 13 m boven het
      aansluitende terrein, gemeten ter plaatse van de toegang van het kantoorgebouw, ten minste behoren tot klasse 2.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel231
  - number: '231.3'
    text: |-
      In afwijking van het eerste en tweede lid, moeten een vloer en een tredevlak, bepaald overeenkomstig NEN 1775, ten
      minste behoren tot klasse T3 van de in die norm bedoelde bijdrage tot brandvoortplanting, met dien verstande dat
      een vloer en een tredevlak waarover een vluchtweg voert, moeten behoren tot klasse T1.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel231
  - number: '231.4'
    text: |-
      In afwijking in zoverre van het eerste lid, moet de naar de buitenlucht toegekeerde zijde van een constructie-
      onderdeel waarin een vloer van een verblijfsgebied hoger is gelegen dan 5 m boven het aansluitende terrein, gemeten
      ter plaatse van de toegang van het kantoorgebouw, tot een hoogte van ten minste 2,5 m boven het aansluitende
      terrein behoren tot klasse 1.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel231
  - number: '231.5'
    text: |-
      Het tweede en vierde lid zijn niet van toepassing op een deur, raam, kozijn en op een daarmee gelijk te stellen
      constructie-onderdeel.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel231
  - number: '231.6'
    text: |-
      Het eerste tot en met vierde lid zijn niet van toepassing op ten hoogste 5% van de totale oppervlakte van de in die
      leden bedoelde constructie-onderdelen van elke afzonderlijke ruimte van het kantoorgebouw.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel231
  - number: '232.1'
    text: |-
      Een kantoorgebouw, alsmede een in tabel VI aangegeven gedeelte van een kantoorgebouw is aan te merken als een
      brandcompartiment.





                    één of meer met elkaar in verbinding staande afzonderlijke besloten ruimten waardoor




                    geen vluchtweg voert, met een totale gebruiksoppervlakte van niet meer dan 1000 m2




           stookruimte technische ruimte met een gebruiksoppervlakte van meer dan 50 m2 een besloten ruimte, bestemd
      of mede bestemd voor de opslag van bij ministeriële regeling aangegeven brandbare, brandbevorderende en bij brand
      gevaar opleverende stoffen
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel232
  - number: '232.2'
    text: |-
      De in NEN 6068 bedoelde weerstand tegen branddoorslag en brandoverslag tussen een brandcompartiment en een andere
      besloten ruimte, niet zijnde een toiletruimte of badruimte die is gelegen in hetzelfde gebouw als waarvan het
      brandcompartiment deel uitmaakt, moet, ter beperking van uitbreiding van brand, bepaald overeenkomstig die norm,
      ten minste 60 minuten zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel232
  - number: '232.3'
    text: |-
      In afwijking in zoverre van het tweede lid, mag, indien in het kantoorgebouw geen verblijfsgebied hoger is gelegen
      dan 5 m boven het aansluitende terrein, gemeten ter plaatse van de toegang van het gebouw, de weerstand tegen
      branddoorslag en brandoverslag tussen een in het kantoorgebouw gelegen brandcompartiment en een andere binnen het
      kantoorgebouw gelegen besloten ruimte ten minste 30 minuten zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel232
  - number: '232.4'
    text: |-
      In afwijking van het tweede lid, geldt met betrekking tot de weerstand tegen branddoorslag en brandoverslag tussen
      een brandcompartiment en een schacht, koker of kanaal, welke voert langs ten hoogste één brandcompartiment als
      bedoeld in het eerste lid, dan wel is gelegen in en uitsluitend is bestemd voor een of meer boven elkaar gelegen
      toiletruimten of badruimten, geen eis.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel232
  - number: '232.5'
    text: |-
      In afwijking in zoverre van het tweede lid, mag de weerstand tegen branddoorslag en brandoverslag tussen een
      brandcompartiment en een ander, tot het kantoorgebouw waarin het brandcompartiment is gelegen behorend gebouw
      met een gebruiksoppervlakte van ten hoogste 50 m2, in welk gebouw geen verblijfsgebied is gelegen, ten minste 30
      minuten zijn, met dien verstande dat, indien het andere gebouw een bergruimte is, geen eis met betrekking tot de
      weerstand tegen branddoorslag en brandoverslag geldt.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel232
  - number: '232.6'
    text: |-
      In een inwendige scheidingsconstructie tussen een brandcompartiment en een andere besloten ruimte, niet zijnde een
      bergruimte als bedoeld in het vijfde lid, mag zich geen beweegbaar constructie-onderdeel bevinden, anders dan een
      zelfsluitende deur.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel232
  - number: '232.7'
    text: |-
      Onverminderd het tweede lid, moet bij de bepaling van de weerstand tegen branddoorslag en brandoverslag zijn
      uitgegaan van een identiek, doch spiegelsymmetrisch ten opzichte van de perceelsgrens gelegen brandcompartiment.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel232
  - number: '233.1'
    text: |-
      De in NEN 6066 bedoelde rookproduktie van een naar een besloten ruimte toegekeerde zijde van een constructie-
      onderdeel mag, ter beperking van rookproduktie, bepaald overeenkomstig die norm, geen grotere rookdichtheid hebben
      dan 10 m -1.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel233
  - number: '233.2'
    text: |-
      Het eerste lid is niet van toepassing op ten hoogste 5% van de totale oppervlakte van de naar de besloten ruimte
      toegekeerde zijden van de constructie-onderdelen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel233
  - number: '233.3'
    text: |-
      In afwijking in zoverre van het eerste lid, mag de rookdichtheid van een constructie-onderdeel van een besloten
      ruimte waardoor een vluchtweg voert, niet groter zijn dan:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel233
  - number: 233.3.a
    text: |-
      5,4 m-1, indien het constructie-onderdeel behoort tot klasse 1 van de bijdrage tot brandvoortplanting, bepaald
      overeenkomstig NEN 6065, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel233
  - number: 233.3.b
    text: |-
      2,2 m-1, indien het constructie-onderdeel behoort tot klasse 2 van de bijdrage tot brandvoortplanting, bepaald
      overeenkomstig NEN 6065.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel233
  - number: '233.4'
    text: |-
      Het derde lid is niet van toepassing op een vloer, een tredevlak en op ten hoogste 5% van de totale oppervlakte
      van de naar de besloten ruimte toegekeerde zijden van de overige constructie-onderdelen, mits die 5% gemiddeld geen
      grotere raakdichtheid heeft dan 10 m-1.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel233
  - number: '234.1'
    text: |-
      Een brandcompartiment als bedoeld in artikel 232, eerste lid, moet zijn ingedeeld in één of meer
      rookcompartimenten.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel234
  - number: '234.2'
    text: |-
      Tussen een rookcompartiment waarin een verblijfsgebied is gelegen dat deel uitmaakt van een kantoorgebouw waarin
      een vloer van een verblijfsgebied hoger is gelegen dan 13 m boven het aansluitende terrein, gemeten ter plaatse
      van de toegang van het kantoorgebouw, en een toegang tot een besloten verkeersruimte waarin een trap is gelegen
      waarover een vluchtmogelijkheid voert, moet, opdat bij brand vanuit het kantoorgebouw op veilige wijze het
      aansluitende terrein kan worden bereikt, een verkeersruimte met een lengte van ten minste 2 m zijn gelegen die,
      indien die ruimte besloten is, als rookcompartiment is ingericht.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel234
  - number: '234.3'
    text: |-
      Het tweede lid is van overeenkomstige toepassing ten aanzien van een rookcompartiment waarin een verblijfsgebied is
      gelegen dat is aangewezen op slechts één verkeersruimte waarin een trap is, gelegen waarover een vluchtmogelijkheid
      voert.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel234
  - number: '234.4'
    text: |-
      De afstand tussen een toegang van een rookcompartiment en een punt in een in dat compartiment gelegen
      verblijfsgebied, mag, gemeten langs de kortste route, niet groter zijn dan 20 m, met dien verstande dat, indien het
      rookcompartiment slechts één toegang heeft, de gebruiksoppervlakte van dat compartiment niet groter mag zijn dan
      250 m2. Bij de bepaling van die route blijft een in een verblijfsgebied gelegen constructie-onderdeel, niet zijnde
      een bouwconstructie, buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel234
  - number: '234.5'
    text: |-
      De afstand tussen een toegang van een rookcompartiment en een punt in een in dat compartiment gelegen
      verblijfsruimte, mag, gemeten langs de kortste route, niet groter zijn dan 30 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel234
  - number: '234.6'
    text: |-
      Indien een rookcompartiment slechts één toegang heeft, mag, gemeten langs de kortste route, de afstand tussen die
      toegang en een toegang van een in dat compartiment gelegen verblijfsruimte niet groter zijn dan 15 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel234
  - number: '234.7'
    text: |-
      Tussen de vloer ter plaatse van een toegang van een rookcompartiment en een vloer van een in dat compartiment
      gelegen verblijfsgebied mag geen groter hoogteverschil aanwezig zijn dan 4 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel234
  - number: '234.8'
    text: |-
      De afstand tussen een toegang van een verblijfsruimte en een punt in die ruimte mag, gemeten langs de kortste
      route, niet groter zijn dan 20 m, met dien verstande dat, indien dit leidt tot meer dan één toegang, de afstand
      tussen de onderscheidene toegangen ten minste 5 m moet zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel234
  - number: '234.9'
    text: |-
      De in NEN 6075 bedoelde weerstand tegen rookdoorgang tussen een rookcompartiment en een andere besloten
      ruimte, niet zijnde een toiletruimte, badruimte of een tot het kantoorgebouw behorende bergruimte met een
      gebruiksoppervlakte van ten hoogste 50 m2, moet, bepaald overeenkomstig die norm, ten minste 30 minuten zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel234
  - number: '234.10'
    text: |-
      Een beweegbaar constructie-onderdeel dat zich bevindt in een constructie die de scheiding vormt tussen een
      rookcompartiment en een andere besloten ruimte, niet zijnde een bergruimte als bedoeld in het negende lid, moet
      zelfsluitend zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel234
  - number: '235.1'
    text: |-
      Een toegang van een rookcompartiment als bedoeld in artikel 234, vierde tot en met zevende lid, moet zijn gelegen
      aan het aansluitende terrein of aan een ruimte waardoor twee onafhankelijke vluchtmogelijkheden voeren.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel235
  - number: '235.2'
    text: |-
      In afwijking van het eerste lid, mag de toegang zijn gelegen aan een ruimte waardoor één vluchtmogelijkheid voert,
      indien:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel235
  - number: 235.2.a
    text: de totale gebruiksoppervlakte van de rookcompartimenten die op die ruimte zijn aangewezen, ten hoogste 250 m2 is;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel235
  - number: 235.2.b
    text: |-
      het rookcompartiment twee toegangen heeft die elk afzonderlijk leiden naar ten minste één onafhankelijke
      vluchtmogelijkheid, of
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel235
  - number: 235.2.c
    text: de vluchtmogelijkheid een vluchtweg is die uitsluitend voert door een verkeersruimte waarin een trap is gelegen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel235
  - number: '235.3'
    text: |-
      Op een vluchtweg als bedoeld in het tweede lid, onderdeel *c*, met uitzondering van een vluchtweg die voert door
      een veiligheidstrappehuis, mag ten hoogste 1000 m2 gebruiksoppervlakte aan rookcompartimenten zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel235
  - number: '235.4'
    text: |-
      In een kantoorgebouw waarin een vloer van een verblijfsgebied hoger is gelegen dan 50 m boven het aansluitende
      terrein, gemeten ter plaatse van de toegang van het kantoorgebouw, moet ten minste één vluchtmogelijkheid als
      bedoeld in het eerste lid, voeren door een verkeersruimte waarin een trap is gelegen, welke ruimte in geval van
      brand op een zodanige luchtdruk kan worden gebracht dat in die ruimte zoveel mogelijk gevrijwaard blijft van rook.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel235
  - number: '235.5'
    text: |-
      De afstand tussen een toegang van een rookcompartiment als bedoeld in het eerste lid, en een toegang van het
      kantoorgebouw mag, indien toepassing is gegeven aan het tweede lid, onderdeel *c*, gemeten langs de kortste route,
      ten hoogste 30 m zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel235
  - number: '235.6'
    text: Het vijfde lid is niet van toepassing indien de vluchtweg voert door een veiligheidstrappehuis.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel235
  - number: '235.7'
    text: |-
      De in NEN 6075 bedoelde weerstand tegen rook doorgang tussen een verkeersruimte waarin een trap is gelegen waarover
      een vluchtmogelijkheid voert en een verkeersruimte waarvan de vloer hoger is gelegen dan 2 m boven de vloer ter
      plaatse van de toegang van het kantoorgebouw, moet, bepaald overeenkomstig die norm, ten minste 30 minuten zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel235
  - number: '235.8'
    text: |-
      Een beweegbaar constructie-onderdeel dat zich bevindt in een constructie die de scheiding vormt tussen de ruimten,
      bedoeld in het zevende lid, moet zelfsluitend zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel235
  - number: '235.9'
    text: |-
      Een verkeersruimte waarin trappen zijn gelegen waarmee een hoogteverschil van ten minste 8 m is overbrugd, moet
      voldoen aan de eisen voor een vluchtweg.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel235
  - number: '235.10'
    text: |-
      Een in artikel 234, achtste lid, bedoelde toegang van een verblijfsruimte moet zijn gelegen aan een verkeersruimte
      die leidt naar een toegang als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel235
  - number: '235.11'
    text: |-
      In afwijking van het tiende lid, mag de toegang van een verblijfsruimte zijn gelegen aan een andere
      verblijfsruimte, mits die andere verblijfsruimte ten minste twee, op een afstand van ten minste 5 m van elkaar
      gelegen toegangen heeft die voldoen aan het zevende lid.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel235
  - number: '236.1'
    text: |-
      Een vluchtmogelijkheid moet, opdat snel en veilig kan worden gevlucht, een vrije doorgang hebben met een breedte
      van ten minste 0,6 m en een hoogte van ten minste 2,1 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel236
  - number: '236.2'
    text: |-
      De weerstand tegen branddoorslag en brandoverslag tussen twee onafhankelijke vluchtmogelijkheden moet, bepaald
      overeenkomstig NEN 6068, ten minste 30 minuten zijn, tenzij vanaf een toegang van een rookcompartiment als bedoeld
      in artikel 235, eerste lid, in twee richtingen kan worden gevlucht.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel236
  - number: '236.3'
    text: |-
      Onafhankelijke vluchtmogelijkheden mogen uitsluitend door middel van een zelfsluitende deur met elkaar in
      verbinding staan, tenzij vanaf een toegang van een rookcompartiment als bedoeld in artikel 235, eerste lid, in twee
      richtingen kan worden gevlucht.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel236
  - number: '236.4'
    text: |-
      In het totaal van de uitwendige scheidingsconstructies van een niet-besloten ruimte waardoor een vluchtmogelijkheid
      voert, moeten niet-afsluitbare openingen aanwezig zijn waarmee een capaciteit voor de toevoer van verse lucht en de
      afvoer van rook wordt bewerkstelligd van ten minste 6.10-3 m3/s per m3 netto-inhoud van die ruimte. Ten aanzien van
      de bepaling van de capaciteit is NEN 1087 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel236
  - number: '236.5'
    text: |-
      Een verblijfsgebied en een verblijfsruimte moeten één of meer toegangen hebben met een totale vrije doorgang van
      ten minste:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel236
  - number: 236.5.a
    text: 1 mm per 0,9 m2 van de op die toegangen aangewezen, niet in een toegankelijkheidssector gelegen vloeroppervlakte;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel236
  - number: 236.5.b
    text: 1 mm per 0,15 m2 vloeroppervlakte van een op die toegangen aangewezen toegankelijkheidssector, of
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel236
  - number: 236.5.c
    text: |-
      1 mm per 0,15 m2 vloeroppervlakte van een op die toegangen aangewezen toegankelijkheidssector, vermeerderd met 1 mm
      per 0,9 m2 van de op die toegangen aangewezen, niet in een toegankelijkheidssector gelegen vloeroppervlakte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel236
  - number: '236.6'
    text: |-
      Een rookcompartiment moet één of meer toegangen als bedoeld in artikel 235, eerste lid, hebben met een totale vrije
      doorgang die ten minste gelijk is aan de vrije doorgang, bedoeld in het vijfde lid, met dien verstande dat de vrije
      doorgang niet kleiner mag zijn dan:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel236
  - number: 236.6.a
    text: 1 mm per 1,8 m2 van de op die toegangen aangewezen, niet in een toegankelijkheidssector gelegen vloeroppervlakte;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel236
  - number: 236.6.b
    text: 1 mm per 0,27 m2 gebruiksoppervlakte van een op die toegangen aangewezen toegankelijkheidssector, of
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel236
  - number: 236.6.c
    text: |-
      1 mm per 0,27 m2 gebruiksoppervlakte van een op die toegangen aangewezen toegankelijkheidssector, vermeerderd met 1
      mm per 1,8 m2 van de op die toegangen aangewezen, niet in een toegankelijkheidssector gelegen gebruiksoppervlakte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel236
  - number: '236.7'
    text: |-
      Een ruimte waarin een trap is gelegen waarover een vluchtmogelijkheid voert, moet, overeenkomstig bij ministeriële
      regeling gegeven voorschriften, een opvangcapaciteit hebben als aangegeven in die voorschriften en moet, bepaald
      overeenkomstig die voorschriften, een bij die voorschriften aangegeven doorstroomcapaciteit hebben.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel236
  - number: '236.8'
    text: |-
      Het produkt van de permanente vuurbelasting en de netto-vloeroppervlakte van een veiligheidstrappenhuis is per
      bouwlaag ten hoogste 3.500 MJ. De vuurbelasting wordt bepaald volgens NEN 6090.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel236
  - number: '236.9'
    text: |-
      De deur van een toegang van een verblijfsgebied en van een verblijfsruimte als bedoeld in het zesde lid, mogen niet
      tegen de vluchtrichting in draaien, indien:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel236
  - number: 236.9.a
    text: |-
      het quotiënt van de op die toegang aangewezen, niet in een toegankelijkheidssector gelegen vloeroppervlakte en 10
      m2 meer is dan 25;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel236
  - number: 236.9.b
    text: |-
      het quotiënt van de vloeroppervlakte van een op die toegang aangewezen toegankelijkheidssector en 1,5 m2 meer is
      dan 25, of
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel236
  - number: 236.9.c
    text: |-
      het quotiënt van de vloeroppervlakte van een op die toegang aangewezen toegankelijkheidssector en 1,5 m2,
      vermeerderd met het quotiënt van de op die toegang aangewezen, niet in een toegankelijkheidssector gelegen
      vloeroppervlakte en 10 m2, meer is dan 25.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel236
  - number: '236.10'
    text: |-
      De deur van een toegang van een rookcompartiment als bedoeld in het vijfde lid, en van een ruimte waardoor een
      vluchtweg voert, mogen niet tegen de vluchtrichting in draaien, indien:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel236
  - number: 236.10.a
    text: |-
      het quotiënt van de op die toegang aangewezen, niet in een toegankelijkheidssector gelegen gebruiksoppervlakte en
      20 m2 meer is dan 25;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel236
  - number: 236.10.b
    text: |-
      het quotiënt van de gebruiksoppervlakte van een op die toegang aangewezen toegankelijkheidssector en 3 m2 meer is
      dan 25, of
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel236
  - number: 236.10.c
    text: |-
      het quotiënt van de gebruiksoppervlakte van een op die toegang aangewezen toegankelijkheidssector en 3 m2,
      vermeerderd met het quotiënt van de op die toegang aangewezen, niet in een toegankelijkheidssector gelegen
      gebruiksoppervlakte en 20 m2, meer is dan 25.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel236
  - number: '236.11'
    text: |-
      Indien op grond van het negende lid de deur niet tegen de vluchtrichting in mag draaien, mag de deur, bedoeld in
      het tiende lid, evenmin tegen de vluchtrichting in draaien.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel236
  - number: '237.1'
    text: |-
      De afstand tussen een toegang van een verkeersruimte waarin een trap is gelegen waarover een vluchtmogelijkheid
      voert, en een toegang van een rookcompartiment, mag, opdat de brandweer gebruikers van het kantoorgebouw kan redden
      en brand kan bestrijden, gemeten langs de kortste route, niet groter zijn dan 30 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel237
  - number: '237.2'
    text: |-
      Een kantoorgebouw waarin een vloer van een verblijfsgebied hoger is gelegen dan 20 m boven het aansluitende
      terrein, gemeten ter plaatse van de toegang van het gebouw, moet zijn voorzien van een overeenkomstig het derde
      lid te bepalen aantal brandweerliften waarvan de inrichting ten minste voldoet aan NEN-EN 81-1, voor zover het een
      elektrisch aangedreven lift betreft, of NEN-EN 81-2, voor zover het een hydraulisch aangedreven lift betreft.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel237
  - number: '237.3'
    text: |-
      De afstand tussen een toegang van de brandweerlift en een toegang van een rookcompartiment, mag, gemeten langs de
      kortste route, ten hoogste 75 m zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel237
  - number: '237.4'
    text: |-
      Een toegankelijkheidssector moet, opdat gebruikers van die sector op veilige wijze uit het kantoorgebouw kunnen
      vluchten, zijn voorzien van vluchtwegaanduidingen die ten minste voldoen aan NEN 6088.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel237
  - number: '238.1'
    text: |-
      Een kantoorgebouw waarin een vloer van een verblijfsgebied hoger is gelegen dan 20 m boven het aansluitende
      terrein, gemeten ter plaatse van de toegang van het gebouw, moet, opdat een beginnende brand kan worden bestreden,
      zijn voorzien van een overeenkomstig het tweede lid te bepalen aantal droge blusleidingen waarvan de inrichting ten
      minste voldoet aan NEN 1594.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel238
  - number: '238.2'
    text: |-
      De afstand tussen een brandslangaansluiting van een blusleiding als bedoeld in het eerste lid, en een toegang van
      een op die aansluiting aangewezen rookcompartiment mag, gemeten langs de kortste route, niet groter zijn dan 35 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel238
  - number: '238.3'
    text: |-
      In een kantoorgebouw waarin een vloer van een verblijfsgebied hoger is gelegen dan 50 m boven het aansluitende
      terrein, gemeten ter plaatse van de toegang van het gebouw, moet een blusleiding als bedoeld in het eerste lid,
      zijn voorzien van een elektrisch aangedreven pomp.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel238
  - number: '238.4'
    text: |-
      De pomp, bedoeld in het derde lid, moet zijn aangesloten op een voorziening voor noodstroom, opdat die pomp binnen
      15 seconden na het uitvallen van de voorziening voor elektriciteit, gedurende ten minste 24 uren kan functioneren
      en gedurende ten minste 6 uren in bedrijf kan blijven.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel238
  - number: '238.5'
    text: |-
      Een kantoorgebouw met een gebruiksoppervlakte van meer dan 500 m2 moet zijn voorzien van een overeenkomstig het
      zevende lid te bepalen aantal brandslanghaspels die kunnen worden aangesloten op de voorziening voor drinkwater.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel238
  - number: '238.6'
    text: |-
      Een brandslanghaspel als bedoeld in het vijfde lid, mag niet zijn gelegen in een verkeersruimte waarin een trap
      is gelegen waarover een vluchtmogelijkheid voert, en moet zijn voorzien van een slang met een lengte van ten
      hoogste 20 m waarvan de statische druk bij het mondstuk bij gelijktijdig gebruik van twee op dezelfde waterleiding
      aangesloten brandslanghaspels ten minste 100 kPa is en de capaciteit ten minste 1,3 m3/h is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel238
  - number: '238.7'
    text: |-
      Bij de bepaling van het aantal brandslanghaspels als bedoeld in het vijfde lid, moet, opdat elk punt van een vloer
      van het kantoorgebouw met bluswater kan worden bereikt, zijn uitgegaan van:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel238
  - number: 238.7.a
    text: 2/3 van de beschikbare slanglengte, voor zover die slang voert door een verblijfsgebied, of
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel238
  - number: 238.7.b
    text: de totale beschikbare slanglengte, voor zover die slang niet voert door een verblijfsgebied,
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel238
  - number: '239'
    text: |-
      Onverminderd de artikelen 231 tot en met 238, moet een kantoorgebouw waarin een vloer van een verblijfsgebied hoger
      is gelegen dan 70 m boven het aansluitende terrein, gemeten ter plaatse van de toegang van het kantoorgebouw, wat
      brandveiligheid betreft, zodanig zijn ingericht dat het gebouw ten minste in gelijke mate brandveilig is als is
      beoogd met de bij of krachtens die artikelen gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel239
  - number: '240'
    text: |-
      Indien een kantoorgebouw is gebouwd overeenkomstig de bij of krachtens deze paragraaf gegeven voorschriften, is
      voldaan aan de artikelen 185 tot en met 192.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel240
  - number: '241.1'
    text: |-
      In afwijking in zoverre van artikel 194, eerste lid, mag de karakteristieke geluidwering van een uitwendige
      scheidingsconstructie die de scheiding vormt tussen een verblijfsgebied en de buitenlucht, ten minste gelijk zijn
      aan het verschil tussen de geluidsbelasting van die scheidingsconstructie en 40 dB(A), met dien verstande dat bij
      de berekening of meting van de geluidsbelasting mag zijn uitgegaan van het geluidsniveau over de periode van 07.00
      uur tot en met 19.00 uur.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel241
  - number: '241.2'
    text: |-
      In afwijking van het eerste lid moet, indien ingevolge de [Wet geluidhinder][ref1] in een verblijfsgebied een
      hogere geluidsbelasting dan 40 dB(A) is toegestaan, de karakteristieke geluidwering van een in dat lid bedoelde
      uitwendige scheidingsconstructie, bepaald overeenkomstig NEN 5077, ten minste gelijk zijn aan het verschil tussen
      de geluidsbelasting van die scheidingsconstructie en de toegestane geluidsbelasting in dat gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0003227
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel241
    references:
      - id: ref1
        bwb_id: BWBR0003227
  - number: '241.3'
    text: |-
      De in NEN 5077 bedoelde karakteristieke geluidwering van een uitwendige scheidingsconstructie die de scheiding
      vormt tussen een verblijfsgebied en de buitenlucht, moet, bepaald overeenkomstig NEN 5077, afhankelijk van
      de in de eerste kolom van tabel VII gegeven geluidsbelasting van die constructie, bepaald overeenkomstig de
      [Luchtvaartwet][ref1], ten minste gelijk zijn aan de bij die geluidsbelasting in de tweede kolom van die tabel
      gegeven waarde. Tabel VII Geluidwering in geval van luchtvaartlawaai





                    Geluidsbelasting in Ke Vereiste karakteristieke geluidwering




                    in dB(A)




                    36-40 27




                    41-45 30




                    46-50 33




                    meer dan 50 36


      [ref1]: https://wetten.overheid.nl/BWBR0002267
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel241
    references:
      - id: ref1
        bwb_id: BWBR0002267
  - number: '241.4'
    text: |-
      Indien krachtens de [Luchtvaartwet][ref1] of [artikel 108 van de Wet geluidhinder][ref2] een andere dan de in
      het derde lid gegeven eis ten aanzien van de karakteristieke geluidwering van een in dat lid bedoelde uitwendige
      scheidingsconstructie is gesteld, blijft het derde lid buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002267
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel108
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel241
    references:
      - id: ref1
        bwb_id: BWBR0002267
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '108'
  - number: '241.5'
    text: |-
      Indien op grond van het eerste tot en met het vierde lid met betrekking tot een of meer soorten geluid
      tegelijkertijd verschillende eisen aan de geluidwering van een uitwendige scheidingsconstructie zijn gesteld, geldt
      de zwaarste van de ingevolge die leden gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel241
  - number: '241.6'
    text: |-
      Op een inwendige scheidingsconstructie van een verblijfsgebied, voor zover die constructie niet de scheiding vormt
      met een ander verblijfsgebied, zijn het eerste tot en met vijfde lid van toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel241
  - number: '241.7'
    text: |-
      De in NEN 5077 bedoelde karakteristieke geluidwering van een uitwendige scheidingsconstructie van een
      verblijfsruimte, voor zover die constructie de scheiding vormt met de buitenlucht, moet, bepaald overeenkomstig die
      norm, ten minste gelijk zijn aan de waarde van de karakteristieke geluidwering, bedoeld in het eerste tot en met
      vijfde lid, verminderd met 2 dB(A).
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel241
  - number: '241.8'
    text: |-
      Op een inwendige scheidingsconstructie van een verblijfsruimte, voor zover die constructie niet de scheiding vormt
      met een andere verblijfsruimte, is het zevende lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel241
  - number: '242'
    text: |-
      In een kantoorgebouw moet een voorziening voor afvalwater en faecaliën als bedoeld in artikel 199, eerste lid,
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel242
  - number: '243'
    text: Een kantoorgebouw moet een voorziening voor hemelwater als bedoeld in artikel 200, eerste lid, hebben.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel243
  - number: '244.1'
    text: |-
      De voorziening voor de toevoer van verse lucht en de afvoer van binnenlucht, bedoeld in artikel 201, vijfde lid,
      moet voor een verblijfsgebied een capaciteit hebben van ten minste 1,3.10-3 m3/s per m2 vloeroppervlakte van dat
      gebied.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel244
  - number: '244.2'
    text: |-
      De toevoer van verse lucht, bedoeld in het eerste lid, naar een verblijfsgebied moet rechtstreeks van buiten
      plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel244
  - number: '244.3'
    text: |-
      De voorziening voor de toevoer van verse lucht en de afvoer van binnenlucht, bedoeld in artikel 201, vijfde lid,
      moet voor een verblijfsruimte een capaciteit hebben van ten minste 1.10-3 m3/s per m2 vloeroppervlakte van die
      verblijfsruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel244
  - number: '245'
    text: |-
      Onverminderd artikel 203, derde lid, moet voor een opstelplaats voor een stooktoestel zijn uitgegaan van een op gas
      gestookt verbrandingstoestel met een belasting van ten minste 30 W per m2 gebruiksoppervlakte van het kantoorgebouw
      met een minimum van 6 kW.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel245
  - number: '246'
    text: In een kantoorgebouw moet een voorziening voor drinkwater als bedoeld in artikel 207, eerste lid, aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel246
  - number: '247.1'
    text: |-
      Een kantoorgebouw met een gebruiksoppervlakte van meer dan 1000 m2 moet ten minste één toegankelijkheidssector
      hebben als bedoeld in artikel 212, eerste lid.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel247
  - number: '247.2'
    text: |-
      Een gedeelte van de toegankelijkheidsector moet zijn ingericht als bijzondere toegankelijkheidssector als bedoeld
      in artikel 212, tweede lid.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel247
  - number: '247.3'
    text: |-
      Onverminderd artikel 212, derde lid, moet in een bijzondere toegankelijkheidssector ten minste één toiletruimte
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel247
  - number: '248.1'
    text: Een kantoorgebouw moet een vloeroppervlakte aan verblijfsgebied hebben als bedoeld in artikel 214, eerste lid.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel248
  - number: '248.2'
    text: |-
      In afwijking in zoverre van artikel 214, tweede lid, moet een verblijfsgebied een vloeroppervlakte hebben van ten
      minste 10 m2.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel248
  - number: '248.3'
    text: |-
      In een kantoorgebouw met een gebruiksoppervlakte van meer dan 1000 m2 moet ten minste 25% van de in het eerste lid
      bedoelde oppervlakte aan verblijfsgebied toegankelijk en bereikbaar zijn overeenkomstig de artikelen 212, vijfde
      tot en met zevende lid en 213, eerste en derde lid.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel248
  - number: '249'
    text: In afwijking in zoverre van artikel 215, moet een verblijfsruimte een vloeroppervlakte hebben van ten minste 10 m2.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel249
  - number: '250'
    text: |-
      Onverminderd artikel 216, eerste lid, moet in een kantoorgebouw voor elke 300 m2 gebruiksoppervlakte of gedeelte
      daarvan, ten minste één toiletruimte aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel250
  - number: '251'
    text: |-
      In een kantoorgebouw moet, voor zover artikel 222, derde lid, niet van toepassing is, ten minste één opstelplaats
      voor een stooktoestel als bedoeld in het eerste lid van dat artikel, aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel251
  - number: 251a
    text: Artikel 223, eerste lid, is niet van toepassing op een kantoorgebouw.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel251a
  - number: 251b
    text: De energieprestatiecoëfficiënt, bedoeld in artikel 228a, eerste lid, van een kantoorgebouw is ten hoogste 1,6.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel251b
  - number: '252'
    text: |-
      In afwijking van artikel 174, zevende lid, geldt geen eis ten aanzien van de brandwerendheid met betrekking tot
      bezwijken voor een niet in een logiesgebouw gelegen logiesverblijf met een gebruiksoppervlakte van niet meer dan
      100 m2.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel252
  - number: '253'
    text: |-
      Openingen tussen een vloer en een afscheiding, alsmede openingen en opstapmogelijkheden in een afscheiding moeten
      ten minste voldoen aan artikel 175, vijfde, zevende en achtste lid.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel253
  - number: '254.1'
    text: |-
      In afwijking van artikel 177, eerste lid, moeten de afmetingen van een trap ten minste voldoen aan kolom A van
      tabel II of, indien de trap is bestemd voor het ontsluiten van een logiesverblijf met een gebruiksoppervlakte van
      meer dan 500 m2 dan wel voor het ontsluiten van een logiesgebouw of van de in het gebouw gelegen logiesverblijven,
      aan kolom B van die tabel.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel254
  - number: '254.2'
    text: |-
      In afwijking van het eerste lid, mag de trap die is bestemd voor het ontsluiten van logiesverblijven met een
      gezamenlijke gebruiksoppervlakte van ten hoogste 500 m2, voldoen aan kolom A van tabel II.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel254
  - number: '255.1'
    text: |-
      Onverminderd artikel 180, eerste lid, moet in een besloten gemeenschappelijke verkeersruimte een
      verlichtingsinstallatie als bedoeld in dat lid, aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel255
  - number: '255.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een trap of hellingbaan, voor zover die trap of hellingbaan
      bestemd is voor het ontsluiten van een logiesgebouw of de in het gebouw gelegen logiesverblijven, alsmede op de
      kooi van een lift.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel255
  - number: '255.3'
    text: |-
      De verlichtingsinstallatie, bedoeld in het eerste en tweede lid, moet zijn aangesloten op een voorziening voor
      noodstroom als bedoeld in artikel 180, derde lid.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel255
  - number: '255.4'
    text: Het derde lid is niet van toepassing op de kooi van een lift.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel255
  - number: '256.1'
    text: |-
      Een constructie-onderdeel, met uitzondering van een dak, moet, ter beperking van ontwikkeling van brand,
      bepaald overeenkomstig NEN 6065, ten minste behoren tot klasse 4 van de in die norm bedoelde bijdrage tot
      brandvoortplanting, met dien verstande dat de naar een vluchtweg en naar een vluchtmogelijkheid waarop een in een
      logiesgebouw gelegen logiesverblijf is aangewezen, toegekeerde zijde van een constructie-onderdeel ten minste moet
      behoren tot klasse 2.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel256
  - number: '256.2'
    text: |-
      In afwijking in zoverre van het eerste lid, moet de naar de buitenlucht toegekeerde zijde van een constructie-
      onderdeel, met uitzondering van een dak, voor zover dat constructie-onderdeel hoger is gelegen dan 13 m boven het
      aansluitende terrein, gemeten ter plaatse van de toegang van het logiesgebouw, ten minste behoren tot klasse 2.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel256
  - number: '256.3'
    text: |-
      In afwijking van het eerste en tweede lid, moeten een vloer en een tredevlak, bepaald overeenkomstig NEN 1775, ten
      minste behoren tot klasse T3 van de in die norm bedoelde bijdrage tot brandvoortplanting, met dien verstande dat
      een vloer en een tredevlak waarover een vluchtweg voert, moeten behoren tot klasse T1.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel256
  - number: '256.4'
    text: |-
      In afwijking in zoverre van het eerste lid, moet de naar de buitenlucht toegekeerde zijde van een constructie-
      onderdeel van een logiesgebouw waarin een vloer van een verblijfsgebied hoger is gelegen dan 5 m boven het
      aansluitende terrein, gemeten ter plaatse van de toegang van het gebouw, tot een hoogte van ten minste 2,5 m boven
      het aansluitende terrein behoren tot klasse 1.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel256
  - number: '256.5'
    text: |-
      Het tweede en vierde lid zijn niet van toepassing op een deur, raam, kozijn en op een daarmee gelijk te stellen
      constructie-onderdeel.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel256
  - number: '256.6'
    text: |-
      Het eerste tot en met vierde lid zijn niet van toepassing op ten hoogste 5% van de totale oppervlakte van de in die
      leden bedoelde constructie-onderdelen van elke afzonderlijke ruimte van een logiesverblijf en een logiesgebouw.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel256
  - number: '257.1'
    text: |-
      Een niet in een logiesgebouw gelegen logiesverblijf en een logiesgebouw, alsmede een in tabel VIII aangegeven
      gedeelte van een logiesverblijf met een gebruiksoppervlakte van meer dan 500 m2 en van een logiesgebouw, zijn aan
      te merken als een brandcompartiment.





                    één of meer met elkaar in verbinding staande afzonderlijke besloten ruimten waardoor




                    geen vluchtweg voert, met een totale gebruiksoppervlakte van niet meer dan 500 m2




           stookruimte technische ruimte met een gebruiksoppervlakte van meer dan 50 m2 een besloten ruimte, bestemd
      of mede bestemd voor de opslag van bij ministeriële regeling aangegeven brandbare, brandbevorderende en bij brand
      gevaar opleverende stoffen
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel257
  - number: '257.2'
    text: |-
      Onverminderd het eerste lid, zijn voorts als brandcompartiment aan te merken een in een logiesgebouw gelegen
      logiesverblijf en een in een logiesgebouw gelegen gemeenschappelijk verblijfsgebied.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel257
  - number: '257.3'
    text: |-
      De in NEN 6068 bedoelde weerstand tegen branddoorslag en brandoverslag tussen een brandcompartiment en een
      andere besloten ruimte, niet zijnde een toiletruimte of badruimte die is gelegen in hetzelfde logiesverblijf
      of logiesgebouw als waarvan het brandcompartiment deel uitmaakt, moet, ter beperking van uitbreiding van brand,
      bepaald overeenkomstig die norm, ten minste 60 minuten zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel257
  - number: '257.4'
    text: |-
      In afwijking in zoverre van het derde lid, mag tussen een brandcompartiment als bedoeld in het tweede lid, en
      een andere besloten ruimte zijn volstaan met een weerstand tegen branddoorslag en brandoverslag van ten minste
      30 minuten.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel257
  - number: '257.5'
    text: |-
      In afwijking in zoverre van het derde lid, mag voorts, indien in het logiesverblijf of logiesgebouw geen
      verblijfsgebied hoger is gelegen dan 5 m boven het aansluitende terrein, gemeten ter plaatse van de toegang van het
      logiesverblijf of het logiesgebouw, tussen een in het logiesverblijf of het logiesgebouw gelegen brandcompartiment
      en een andere binnen dat verblijf of gebouw gelegen besloten ruimte zijn volstaan met een weerstand tegen
      branddoorslag en brandoverslag van ten minste 30 minuten.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel257
  - number: '257.6'
    text: |-
      In afwijking van het derde lid, geldt tussen een brandcompartiment en een schacht, koker of kanaal, welke
      voert langs ten hoogste één brandcompartiment als bedoeld in het eerste en tweede lid, dan wel is gelegen in en
      uitsluitend is bestemd voor een of meer boven elkaar gelegen toiletruimten of badruimten, geen eis.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel257
  - number: '257.7'
    text: |-
      In afwijking in zoverre van het derde lid, mag tussen een brandcompartiment en een ander, tot het logiesverblijf
      of het logiesgebouw, waarin het brandcompartiment is gelegen behorend gebouw met een gebruiksoppervlakte van ten
      hoogste 50 m2, in welk gebouw geen verblijfsgebied is gelegen, zijn volstaan met een weerstand tegen branddoorslag
      en brandoverslag van ten minste 30 minuten, met dien verstande dat, indien het andere gebouw een bergruimte is,
      geen eis met betrekking tot de weerstand tegen branddoorslag en brandoverslag geldt.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel257
  - number: '257.8'
    text: |-
      In een inwendige scheidingsconstructie tussen een brandcompartiment en een andere besloten ruimte, niet zijnde een
      bergruimte als bedoeld in het zevende lid, mag zich geen beweegbaar constructie-onderdeel bevinden, anders dan een
      zelfsluitende deur.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel257
  - number: '257.9'
    text: |-
      Onverminderd het derde lid, moet bij de bepaling van de weerstand tegen branddoorslag en brandoverslag zijn
      uitgegaan van een identiek, doch spiegelsymmetrisch ten opzichte van de perceelsgrens gelegen brandcompartiment.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel257
  - number: '258.1'
    text: |-
      De in NEN 6066 bedoelde rookproduktie van een naar een besloten ruimte toegekeerde zijde van een constructie-
      onderdeel mag, ter beperking van rookproduktie, bepaald overeenkomstig die norm, geen grotere rookdichtheid hebben
      dan 10 m-1.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel258
  - number: '258.2'
    text: |-
      Het eerste lid is niet van toepassing op ten hoogste 5% van de totale oppervlakte van de naar de besloten ruimte
      toegekeerde zijden van de constructie-onderdelen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel258
  - number: '258.3'
    text: |-
      In afwijking in zoverre van het eerste lid, mag de rookdichtheid van een constructie-onderdeel van een besloten
      ruimte waardoor een vluchtweg voert en van een besloten ruimte waardoor een vluchtmogelijkheid voert waarop een in
      een logiesgebouw gelegen logiesverblijf is aangewezen, niet groter zijn dan:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel258
  - number: 258.3.a
    text: |-
      5,4 m-1, indien het constructie-onderdeel behoort tot klasse 1 van de bijdrage tot brandvoortplanting, bepaald
      overeenkomstig NEN 6065, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel258
  - number: 258.3.b
    text: |-
      2,2 m-1, indien het constructie-onderdeel behoort tot klasse 2 van de bijdrage tot brandvoortplanting, bepaald
      overeenkomstig NEN 6065.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel258
  - number: '258.4'
    text: |-
      Het derde lid is niet van toepassing op een vloer, een tredevlak en op ten hoogste 5% van de totale oppervlakte
      van de naar de besloten ruimte toegekeerde zijden van de overige constructie-onderdelen, mits die 5% gemiddeld geen
      grotere rookdichtheid heeft dan 10 m-1.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel258
  - number: '259.1'
    text: |-
      Een brandcompartiment als bedoeld in artikel 257, eerste en tweede lid, moet zijn verdeeld in één of meer
      rookcompartimenten.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel259
  - number: '259.2'
    text: |-
      Tussen een rookcompartiment waarin een verblijfsgebied is gelegen dat deel uitmaakt van een logiesgebouw waarin
      een vloer van een verblijfsgebied hoger is gelegen dan 13 m boven het aansluitende terrein, gemeten ter plaatse van
      de toegang van het gebouw, en een toegang tot een besloten verkeersruimte waarin een trap is gelegen waarover een
      vluchtmogelijkheid voert, moet, opdat bij brand vanuit het logiesgebouw op veilige wijze het aansluitende terrein
      kan worden bereikt, een verkeersruimte met een lengte van ten minste 2 m zijn gelegen die, indien die ruimte
      besloten is, als rookcompartiment is ingericht.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel259
  - number: '259.3'
    text: |-
      De afstand tussen een toegang van een rookcompartiment en een punt in een in dat compartiment gelegen
      verblijfsgebied, mag, gemeten langs de kortste route, niet groter zijn dan 20 m, met dien verstande dat, indien het
      rookcompartiment slechts één toegang heeft, de gebruiksoppervlakte van dat compartiment niet groter mag zijn dan
      250 m2. Bij de bepaling van die route blijft een in een verblijfsgebied gelegen constructie-onderdeel, niet zijnde
      een bouwconstructie, buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel259
  - number: '259.4'
    text: |-
      De afstand tussen een toegang van een rookcompartiment en een punt in een in dat compartiment gelegen
      verblijfsruimte, mag, gemeten langs de kortste route, niet groter zijn dan 30 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel259
  - number: '259.5'
    text: |-
      Tussen de vloer ter plaatse van een toegang van een rookcompartiment en een vloer van een in dat compartiment
      gelegen verblijfsgebied mag geen groter hoogteverschil aanwezig zijn dan 4 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel259
  - number: '259.6'
    text: |-
      De afstand tussen een toegang van een verblijfsruimte en een punt in die ruimte mag, gemeten langs de kortste
      route, niet groter zijn dan 20 m, met dien verstande dat, indien dit leidt tot meer dan één toegang, de afstand
      tussen de onderscheidene toegangen ten minste 5 m moet zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel259
  - number: '259.7'
    text: |-
      De in NEN 6075 bedoelde weerstand tegen rookdoorgang tussen een rookcompartiment en een andere besloten ruimte,
      niet zijnde een toiletruimte, badruimte of een tot het logiesverblijf of het logiesgebouw behorende bergruimte met
      een gebruiksoppervlakte van ten hoogste 50 m2, moet, bepaald overeenkomstig die norm, ten minste 30 minuten zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel259
  - number: '259.8'
    text: |-
      Een beweegbaar constructie-onderdeel dat zich bevindt in een constructie die de scheiding vormt tussen een
      rookcompartiment en een andere besloten ruimte, niet zijnde een bergruimte als bedoeld in het zevende lid, moet
      zelfsluitend zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel259
  - number: '260.1'
    text: |-
      Een toegang van een rookcompartiment als bedoeld in artikel 259, derde tot en met vijfde lid, moet zijn gelegen aan
      het aansluitende terrein of aan een ruimte waardoor twee onafhankelijke vluchtmogelijkheden voeren.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel260
  - number: '260.2'
    text: |-
      In afwijking van het eerste lid, mag de toegang zijn gelegen aan een ruimte waardoor één vluchtmogelijkheid voert,
      indien:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel260
  - number: 260.2.b
    text: |-
      het rookcompartiment twee toegangen heeft die elk afzonderlijk leiden naar ten minste één onafhankelijke
      vluchtmogelijkheid, of
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel260
  - number: 260.2.c
    text: |-
      de vluchtmogelijkheid een vluchtweg is die uitsluitend voert door een verkeersruimte waarin een trap is gelegen en
      een vloer van een verblijfsgebied niet hoger is gelegen dan 6 m boven het aansluitende terrein, gemeten ter plaatse
      van de toegang van het logiesgebouw.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel260
  - number: '260.3'
    text: |-
      Op een vluchtweg als bedoeld in het tweede lid, onderdeel *c*, met uitzondering van een vluchtweg die voert door
      een veiligheidstrappehuis, mag ten hoogste 500 m2 gebruiksoppervlakte aan rookcompartimenten zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel260
  - number: '260.4'
    text: |-
      In een logiesgebouw waarin een vloer van een verblijfsgebied hoger is gelegen dan 6 m boven het aansluitende
      terrein, gemeten ter plaatse van de toegang van het gebouw, moet ten minste één vluchtmogelijkheid als bedoeld in
      het eerste lid, voeren door een veiligheidstrappehuis.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel260
  - number: '260.5'
    text: |-
      De afstand tussen een toegang van een rookcompartiment als bedoeld in het eerste lid, en een toegang van het
      logiesgebouw mag, indien toepassing is gegeven aan het tweede lid, onderdeel *a* of *c*, gemeten langs de kortste
      route, ten hoogste 20 m zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel260
  - number: '260.6'
    text: |-
      De in NEN 6075 bedoelde weerstand tegen rookdoorgang tussen een verkeersruimte waarin een trap is gelegen waarover
      een vluchtmogelijkheid voert en een verkeersruimte waarvan de vloer hoger is gelegen dan 2 m boven de vloer ter
      plaatse van de toegang van het logiesgebouw, moet, bepaald overeenkomstig die norm, ten minste 30 minuten zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel260
  - number: '260.7'
    text: |-
      Een beweegbaar constructie-onderdeel dat zich bevindt in een constructie die de scheiding vormt tussen de ruimten
      bedoeld in het zesde lid, moet zelfsluitend zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel260
  - number: '260.8'
    text: |-
      Een verkeersruimte waarin trappen zijn gelegen waarmee een hoogteverschil van ten minste 8 m is overbrugd, moet
      voldoen aan de eisen voor een vluchtweg.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel260
  - number: '260.9'
    text: Ten aanzien van het vluchten uit een logiesverblijf is artikel 15 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel260
  - number: '261.1'
    text: |-
      Een vluchtmogelijkheid moet, opdat snel en veilig kan worden gevlucht, een vrije doorgang hebben met een breedte
      van ten minste 0,6 m en een hoogte van ten minste 2,1 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel261
  - number: '261.2'
    text: |-
      De weerstand tegen branddoorslag en brandoverslag tussen twee onafhankelijke vluchtmogelijkheden moet, bepaald
      overeenkomstig NEN 6068, ten minste 30 minuten zijn, tenzij vanaf een toegang van een rookcompartiment als bedoeld
      in artikel 260, eerste lid, in twee richtingen kan worden gevlucht.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel261
  - number: '261.3'
    text: |-
      Onafhankelijke vluchtmogelijkheden mogen uitsluitend door middel van een zelfsluitende deur met elkaar in
      verbinding staan, tenzij vanaf een toegang van een rookcompartiment als bedoeld in artikel 260, eerste lid, in twee
      richtingen kan worden gevlucht.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel261
  - number: '261.4'
    text: |-
      In het totaal van de uitwendige scheidingsconstructies van een niet-besloten ruimte waardoor een vluchtmogelijkheid
      voert, moeten niet-afsluitbare openingen aanwezig zijn waarmee een capaciteit voor de toevoer van verse lucht en de
      afvoer van rook wordt bewerkstelligd van ten minste 6.10-3 m3/s per m3 netto-inhoud van die ruimte. Ten aanzien van
      de bepaling van de capaciteit is NEN 1087 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel261
  - number: '261.5'
    text: |-
      Een verblijfsgebied en een verblijfsruimte moeten één of meer toegangen hebben met een totale vrije doorgang van
      ten minste:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel261
  - number: 261.5.a
    text: 1 mm per 0,9 m2 van de op die toegangen aangewezen, niet in een toegankelijkheidssector gelegen vloeroppervlakte;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel261
  - number: 261.5.b
    text: 1 mm per 0,15 m2 vloeroppervlakte van een op die toegangen aangewezen toegankelijkheidssector, of
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel261
  - number: 261.5.c
    text: |-
      1 mm per 0,15 m2 vloeroppervlakte van een op die toegangen aangewezen toegankelijkheidssector, vermeerderd met 1 mm
      per 0,9 m2 van de op die toegangen aangewezen, niet in een toegankelijkheidssector gelegen vloeroppervlakte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel261
  - number: '261.6'
    text: |-
      Een rookcompartiment moet één of meer toegangen als bedoeld in artikel 260, eerste lid, hebben met een totale vrije
      doorgang die ten minste gelijk is aan de vrije doorgang, bedoeld in het vijfde lid, met dien verstande dat de vrije
      doorgang niet kleiner mag zijn dan:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel261
  - number: 261.6.a
    text: |-
      1 mm per 1,8 m2 van de op die toegangen aangewezen, niet in een toegankelijkheidssector gelegen
      gebruiksoppervlakte;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel261
  - number: 261.6.b
    text: 1 mm per 0,27 m2 gebruiksoppervlakte van een op die toegangen aangewezen toegankelijkheidssector, of
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel261
  - number: 261.6.c
    text: |-
      1 mm per 0,27 m2 gebruiksoppervlakte van een op die toegangen aangewezen toegankelijkheidssector, vermeerderd met 1
      mm per 1,8 m2 van de op die toegangen aangewezen, niet in een toegankelijkheidssector gelegen gebruiksoppervlakte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel261
  - number: '261.7'
    text: |-
      Een ruimte waarin een trap is gelegen waarover een vluchtmogelijkheid voert, moet, overeenkomstig bij ministeriële
      regeling gegeven voorschriften, een opvangcapaciteit hebben als aangegeven in die voorschriften en moet, bepaald
      overeenkomstig die voorschriften, een bij die voorschriften aangegeven doorstroomcapaciteit hebben.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel261
  - number: '261.8'
    text: |-
      Het produkt van de permanente vuurbelasting en de netto-vloeroppervlakte van een veiligheidstrappehuis is per
      bouwlaag ten hoogste 3.500 MJ. De vuurbelasting wordt bepaald volgens NEN 6090.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel261
  - number: '261.9'
    text: |-
      De deur van een toegang van een verblijfsgebied en van een verblijfsruimte als bedoeld in het zesde lid, mogen niet
      tegen de vluchtrichting in draaien, indien:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel261
  - number: 261.9.a
    text: |-
      het quotiënt van de op die toegang aangewezen, niet in een toegankelijkheidssector gelegen vloeroppervlakte en 10
      m2 meer is dan 25;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel261
  - number: 261.9.b
    text: |-
      het quotiënt van de vloeroppervlakte van een op die toegang aangewezen toegankelijkheidssector en 1,5 m2 meer is
      dan 25, of
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel261
  - number: 261.9.c
    text: |-
      het quotiënt van de vloeroppervlakte van een op die toegang aangewezen toegankelijkheidssector en 1,5 m2,
      vermeerderd met het quotiënt van de op die toegang aangewezen, niet in een toegankelijkheidssector gelegen
      vloeroppervlakte en 10 m2, meer is dan 25.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel261
  - number: '261.10'
    text: |-
      De deur van een toegang van een rookcompartiment als bedoeld in het vijfde lid, en van een ruimte waardoor een
      vluchtweg voert, mogen niet tegen de vluchtrichting in draaien, indien:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel261
  - number: 261.10.a
    text: |-
      het quotiënt van de op die toegang aangewezen, niet in een toegankelijkheidssector gelegen gebruiksoppervlakte en
      20 m2 meer is dan 25;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel261
  - number: 261.10.b
    text: |-
      het quotiënt van de gebruiksoppervlakte van een op die toegang aangewezen toegankelijkheidssector en 3 m2 meer is
      dan 25, of
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel261
  - number: 261.10.c
    text: |-
      het quotiënt van de gebruiksoppervlakte van een op die toegang aangewezen toegankelijkheidssector en 3 m2,
      vermeerderd met het quotiënt van de op die toegang aangewezen, niet in een toegankelijkheidssector gelegen
      gebruiksoppervlakte en 20 m2, meer is dan 25.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel261
  - number: '261.11'
    text: |-
      Indien op grond van het negende lid de deur niet tegen de vluchtrichting in mag draaien, mag de deur, bedoeld in
      het tiende lid, evenmin tegen de vluchtrichting indraaien.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel261
  - number: '261.12'
    text: |-
      Een vluchtmogelijkheid mag binnen één besloten ruimte, gemeten langs de kortste route, geen grotere lengte hebben
      dan 30 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel261
  - number: '262.1'
    text: |-
      De afstand tussen een toegang van een verkeersruimte waarin een trap is gelegen waarover een vluchtmogelijkheid
      voert, en een toegang van een logiesverblijf en een gemeenschappelijk verblijfsgebied, mag, opdat de brandweer
      gebruikers van het logiesverblijf of het logiesgebouw kan redden en brand kan bestrijden, gemeten langs de kortste
      route, niet groter zijn dan 45 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel262
  - number: '262.2'
    text: |-
      Een logiesgebouw waarin een vloer van een verblijfsgebied hoger is gelegen dan 20 m boven het aansluitende
      terrein, gemeten ter plaatse van de toegang van het gebouw, moet zijn voorzien van een overeenkomstig het derde
      lid te bepalen aantal brandweerliften waarvan de inrichting ten minste voldoet aan NEN-EN 81-1, voor zover het een
      elektrisch aangedreven lift betreft, of NEN-EN 81-2, voor zover het een hydraulisch aangedreven lift betreft.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel262
  - number: '262.3'
    text: |-
      De afstand tussen een toegang van de brandweerlift en een toegang van een logiesverblijf en een gemeenschappelijk
      verblijfsgebied, mag, gemeten langs de kortste route, ten hoogste 90 m zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel262
  - number: '262.4'
    text: |-
      Een logiesverblijf met een gebruiksoppervlakte van meer dan 500 m2 en een logiesgebouw moeten, opdat gebruikers
      van dat verblijf of gebouw op veilige wijze uit dat verblijf of gebouw kunnen vluchten, zijn voorzien van
      vluchtwegaanduidingen die ten minste voldoen aan NEN 6088.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel262
  - number: '263.1'
    text: |-
      Een logiesgebouw waarin een vloer van een verblijfsgebied hoger is gelegen dan 20 m boven het aansluitende terrein,
      gemeten ter plaatse van de toegang van het logiesgebouw, moet, met het oog op brandbestrijding, zijn voorzien van
      een overeenkomstig het tweede lid te bepalen aantal droge blusleidingen waarvan de inrichting ten minste voldoet
      aan NEN 1594.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel263
  - number: '263.2'
    text: |-
      De afstand tussen een brandslangaansluiting van een blusleiding als bedoeld in het eerste lid, en een toegang van
      een op die aansluiting aangewezen logiesverblijf en gemeenschappelijk verblijfsgebied mag, gemeten langs de kortste
      route, niet groter zijn dan 50 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel263
  - number: '263.3'
    text: |-
      In een logiesgebouw waarin een vloer van een verblijfsgebied hoger is gelegen dan 50 m boven het aansluitende
      terrein, gemeten ter plaatse van de toegang van het gebouw, moet een blusleiding als bedoeld in het eerste lid,
      zijn voorzien van een elektrisch aangedreven pomp.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel263
  - number: '263.4'
    text: |-
      De pomp, bedoeld in het derde lid, moet zijn aangesloten op een voorziening voor noodstroom, opdat die pomp binnen
      15 seconden na het uitvallen van de voorziening voor elektriciteit, gedurende ten minste 24 uren kan functioneren
      en gedurende ten minste 6 uren in bedrijf kan blijven.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel263
  - number: '263.5'
    text: |-
      Een logiesverblijf met een gebruiksoppervlakte van meer dan 500 m2 en een logiesgebouw moeten zijn voorzien van een
      overeenkomstig het zevende lid te bepalen aantal brandslanghaspels die kunnen worden aangesloten op de voorziening
      voor drinkwater.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel263
  - number: '263.6'
    text: |-
      Een brandslanghaspel als bedoeld in het vijfde lid, mag niet zijn gelegen in een verkeersruimte waarin een trap
      is gelegen waarover een vluchtmogelijkheid voert, en moet zijn voorzien van een slang met een lengte van ten
      hoogste 20 m waarvan de statische druk bij het mondstuk bij gelijktijdig gebruik van twee op dezelfde waterleiding
      aangesloten brandslanghaspels ten minste 100 kPa is en de capaciteit ten minste 1,3 m3/h is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel263
  - number: '263.7'
    text: |-
      Bij de bepaling van het aantal brandslanghaspels als bedoeld in het vijfde lid, moet, opdat elk punt van een vloer
      van het logiesverblijf of het logiesgebouw met bluswater kan worden bereikt, zijn uitgegaan van:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel263
  - number: 263.7.a
    text: 2/3 van de beschikbare slanglengte, voor zover die slang voert door een verblijfsgebied, of
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel263
  - number: 263.7.b
    text: de totale beschikbare slanglengte, voor zover die slang niet voert door een verblijfsgebied,
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel263
  - number: '264'
    text: |-
      Onverminderd de artikelen 256 tot en met 263, moet een logiesgebouw waarin een vloer van een verblijfsgebied
      hoger is gelegen dan 70 m boven het aansluitende terrein, gemeten ter plaatse van de toegang van het gebouw, wat
      brandveiligheid betreft, zodanig zijn ingericht dat het logiesgebouw in gelijke mate brandveilig is als is beoogd
      met de bij of krachtens die artikelen gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel264
  - number: '265'
    text: |-
      Indien een logiesverblijf of logiesgebouw is gebouwd overeenkomstig de bij of krachtens deze paragraaf gegeven
      voorschriften, is voldaan aan de artikelen 185 tot en met 192.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel265
  - number: '266.1'
    text: |-
      In afwijking in zoverre van artikel 195, mag het karakteristieke geluidsniveau tussen in een logiesgebouw gelegen
      logiesverblijven niet hoger zijn dan 35 dB(A).
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel266
  - number: '266.2'
    text: |-
      Onverminderd artikel 195, mag het in NEN 5077 bedoelde karakteristieke geluidsniveau van een in een
      logiesgebouw, doch buiten een van het gebouw deel uitmakend logiesverblijf, gelegen kraan, hydrofoorinstallatie,
      warmwatertoestel, mechanisch ventilatiesysteem, lift of toilet met waterspoeling, in een verblijfsgebied van een in
      dat logiesgebouw gelegen logiesverblijf niet hoger zijn dan 35 dB(A).
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel266
  - number: '267'
    text: |-
      In afwijking van artikel 196, eerste lid, moeten de in NEN 5077 bedoelde karakteristieke isolatie-index voor
      luchtgeluid en de in die norm bedoelde isolatie-index voor contactgeluid tussen een in een logiesgebouw gelegen
      besloten ruimte van een logiesverblijf en een niet tot dat logiesverblijf behorend verblijfsgebied dat deel
      uitmaakt van het logiesgebouw, ter beperking van geluidhinder in dat gebied, bepaald overeenkomstig NEN 5077, ten
      minste gelijk zijn aan -5 dB.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel267
  - number: '268'
    text: |-
      In afwijking in zoverre van artikel 198, eerste en derde lid, mag in een logiesgebouw de in die leden bedoelde
      factor van de temperatuur van de binnenoppervlakte niet lager zijn dan 0,65.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel268
  - number: '269'
    text: |-
      In een logiesverblijf en logiesgebouw moet een voorziening voor afvalwater en faecaliën als bedoeld in artikel 199,
      eerste lid, aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel269
  - number: '270'
    text: Een logiesgebouw moet een voorziening hebben voor hemelwater als bedoeld in artikel 200, eerste lid.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel270
  - number: '271.1'
    text: |-
      De voorziening voor de toevoer van verse lucht en de afvoer van binnenlucht, bedoeld in artikel 201, vijfde lid,
      moet voor een verblijfsgebied een capaciteit hebben van ten minste 1.10-3 m3/s per m2 vloeroppervlakte van dat
      gebied.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel271
  - number: '271.2'
    text: |-
      De toevoer van verse lucht, bedoeld in het eerste lid, naar een verblijfsgebied van een in een logiesgebouw gelegen
      logiesverblijf moet rechtstreeks van buiten plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel271
  - number: '271.3'
    text: |-
      De toevoer van verse lucht, bedoeld in het eerste lid, naar een verblijfsgebied van een niet in een logiesgebouw
      gelegen logiesverblijf moet plaatsvinden vanuit een ander in dat logiesverblijf gelegen verblijfsgebied, een tot
      dat logiesverblijf behorende verkeersruimte of van buiten, met dien verstande dat ten minste 50% van de totale
      capaciteit aan toevoer naar de in het logiesverblijf gelegen verblijfsgebieden rechtstreeks van buiten moet
      plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel271
  - number: '271.4'
    text: |-
      De voorziening voor de toevoer van verse lucht en de afvoer van binnenlucht, bedoeld in artikel 201, vijfde lid,
      moet voor een verblijfsruimte een capaciteit hebben van ten minste 0,8.10-3 m3/s per m2 vloeroppervlakte van die
      verblijfsruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel271
  - number: '272.1'
    text: |-
      Onverminderd artikel 202, moet de voorziening voor de toevoer van verse lucht en de afvoer van binnenlucht voor de
      toevoer van verse lucht naar een besloten gemeenschappelijke verkeersruimte en voor de afvoer van binnenlucht uit
      die ruimte een capaciteit hebben van ten minste 0,7.10-3 m3/s per m2 van de ten minste vereiste vloeroppervlakte
      van die ruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel272
  - number: '272.2'
    text: |-
      De toevoer van verse lucht naar een gemeenschappelijke verkeersruimte als bedoeld in het eerste lid, moet
      rechtstreeks van buiten plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel272
  - number: '272.3'
    text: |-
      De afvoer van binnenlucht uit een gemeenschappelijke verkeersruimte als bedoeld in het eerste lid, moet
      rechtstreeks naar buiten plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel272
  - number: '273.1'
    text: |-
      Onverminderd artikel 203, derde lid, moet voor de bepaling van de capaciteit van de voorziening voor de toevoer van
      verbrandingslucht en de afvoer van rook ten behoeve van:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel273
  - number: 273.1.a
    text: |-
      een opstelplaats voor een stooktoestel zijn uitgegaan van een op gas gestookt toestel met een belasting van ten
      minste 30 W per m2 gebruiksoppervlakte van het logiesgebouw met een minimum van 6 kW, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel273
  - number: 273.1.b
    text: |-
      een opstelplaats voor een warmwatertoestel zijn uitgegaan van een op gas gestookt toestel met een belasting van ten
      minste 20 W per m2 gebruiksoppervlakte van de op dat toestel aangewezen logiesverblijven in het logiesgebouw, met
      een minimum van 6 kW.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel273
  - number: '273.2'
    text: |-
      In afwijking in zoverre van het eerste lid, mag, indien het warmwatertoestel is samengevoegd met het stooktoestel,
      zijn uitgegaan van een belasting van dat samengevoegde toestel van ten minste 30 W per m2 gebruiksoppervlakte van
      het logiesgebouw, met een minimum van 6 kW per opstelplaats.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel273
  - number: '274'
    text: Ten aanzien van een niet in een logiesgebouw gelegen logiesverblijf is artikel 206, derde lid, niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel274
  - number: '275'
    text: |-
      In een logiesverblijf en logiesgebouw moet een voorziening voor drinkwater als bedoeld in artikel 207, eerste lid,
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel275
  - number: '276.1'
    text: |-
      In een logiesgebouw moet, opdat over voor de menselijke hygiëne geschikt warm water kan worden beschikt, een
      voorziening voor warm water aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel276
  - number: '276.2'
    text: |-
      De voorziening voor warm water, bedoeld in het eerste lid, moet, opdat warm water kan worden betrokken ter plaatse
      van een opstelplaats voor een warmwatertoestel, ten minste één aansluitpunt hebben voor het kunnen aansluiten van
      dat toestel op die voorziening.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel276
  - number: '276.3'
    text: De warmwatervoorziening heeft voorts ten minste één aansluitpunt in de badruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel276
  - number: '277.1'
    text: |-
      In het totaal van de uitwendige scheidingsconstructies van een verblijfsgebied moet een equivalente
      daglichtoppervlakte als bedoeld in artikel 210, eerste lid, aanwezig zijn die ten minste gelijk is aan 7% van de
      vloeroppervlakte van dat gebied.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel277
  - number: '277.2'
    text: |-
      In het totaal van de uitwendige scheidingsconstructies van een verblijfsruimte moet een equivalente
      daglichtoppervlakte als bedoeld in artikel 210, eerste lid, aanwezig zijn van ten minste 0,35 m2.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel277
  - number: '278.1'
    text: |-
      Een toegang van een logiesverblijf, logiesgebouw, gemeenschappelijke verkeersruimte, gemeenschappelijk
      verblijfsgebied, alsmede van een gemeenschappelijke toiletruimte, een gemeenschappelijke badruimte of een lift
      moet, met het oog op de toegankelijkheid, een vrije doorgang hebben met een breedte van ten minste 0,85 m en een
      hoogte van ten minste 2,1 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel278
  - number: '278.2'
    text: |-
      Een gemeenschappelijke verkeersruimte moet, met het oog op de begaanbaarheid, een vrije vloeroppervlakte hebben met
      een breedte van ten minste 1,1 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel278
  - number: '279.1'
    text: |-
      Een logiesgebouw met een gebruiksoppervlakte van meer dan 500 m2 moet ten minste één toegankelijkheidssector hebben
      als bedoeld in artikel 212, eerste lid, die rechtstreeks vanaf het aansluitende terrein toegankelijk is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel279
  - number: '279.2'
    text: |-
      Een gedeelte van de toegankelijkheidssector, bedoeld in het eerste lid, moet zijn ingericht als bijzondere
      toegankelijkheidssector als bedoeld in artikel 212, tweede lid, waarvan ten minste één logiesverblijf, één
      afsluitbare gemeenschappelijke toiletruimte en één afsluitbare gemeenschappelijke badruimte deel uitmaken.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel279
  - number: '279.3'
    text: |-
      Ten aanzien van ten minste 35% van de vloeroppervlakte aan verblijfsgebied van een logiesverblijf met een
      gebruiksoppervlakte van meer dan 500 m2 zijn de artikelen 212, vijfde tot en met zevende lid, 213, eerste en derde
      lid, 216, derde lid, en 217, derde, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel279
  - number: '279.4'
    text: |-
      Ten aanzien van ten minste één logiesverblijf dat deel uitmaakt van een complex, zijn de artikelen 212, vijfde tot
      en met zevende lid, 213, eerste en derde lid, 216, derde lid, en 217, derde, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel279
  - number: '280.1'
    text: |-
      Een logiesverblijf en een logiesgebouw moeten een vloeroppervlakte aan verblijfsgebied hebben als bedoeld in
      artikel 214, eerste lid.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel280
  - number: '280.2'
    text: |-
      Een verblijfsgebied van een logiesverblijf, niet gelegen in een logiesgebouw, heeft een vloeroppervlakte van ten
      minste 4 m2. De breedte van die vloeroppervlakte is ten minste 1,5 m. De hoogte boven die vloeroppervlakte is ten
      minste 2,1 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel280
  - number: '280.3'
    text: |-
      Een verblijfsgebied, gelegen in een bijzondere toegankelijkheidssector, heeft een vloeroppervlakte van ten minste
      14 m2; de breedte van die vloeroppervlakte is ten minste 3,2 m; de hoogte boven die vloeroppervlakte is ten minste
      2,4 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel280
  - number: '280.4'
    text: |-
      Op een logiesverblijf als bedoeld in artikel 279, derde en vierde lid, is het derde lid van overeenkomstige
      toepassing, zij het dat de hoogte boven de vloeroppervlakte ten minste 2,1 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel280
  - number: '281.1'
    text: |-
      In afwijking van artikel 215, mag een verblijfsruimte van een niet in een logiesgebouw gelegen logiesverblijf een
      vloeroppervlakte hebben van ten minste 4 m2, waarvan de breedte ten minste 1,5 m en de hoogte boven die oppervlakte
      ten minste 2,1 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel281
  - number: '281.2'
    text: |-
      In afwijking in zoverre van artikel 215, moet een verblijfsruimte die deel uitmaakt van een bijzondere
      toegankelijkheidssector als bedoeld in artikel 279, tweede lid, een vloeroppervlakte hebben van ten minste 14 m2,
      waarvan de breedte ten minste 3,2 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel281
  - number: '281.3'
    text: |-
      Ten aanzien van een logiesverblijf als bedoeld in artikel 279, derde en vierde lid, is het tweede lid van
      overeenkomstige toepassing, zij het dat de hoogte boven die vloeroppervlakte ten minste 2,1 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel281
  - number: '282'
    text: |-
      In een niet in een logiesgebouw gelegen logiesverblijf moet ten minste één toiletruimte als bedoeld in artikel
      216, eerste lid, aanwezig zijn, met dien verstande dat, indien het logiesverblijf een gebruiksoppervlakte heeft
      van meer dan 500 m2, voor elke 125 m2 gebruiksoppervlakte of gedeelte daarvan, ten minste één toiletruimte aanwezig
      moet zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel282
  - number: '283'
    text: Tot een logiesverblijf behoeft geen badruimte te behoren.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel283
  - number: '284.1'
    text: |-
      In afwijking in zoverre van artikel 282 mag de toiletruimte van een logiesverblijf dat deel uitmaakt van een
      complex buiten het logiesverblijf zijn gelegen, mits op het complex voor elke gebruiksoppervlakte van 125 m2
      of gedeelte daarvan, van het totaal aan gebruiksoppervlakten van de logiesverblijven ten minste één afsluitbare
      toiletruimte aanwezig is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel284
  - number: '284.2'
    text: |-
      In een logiesgebouw moet ten behoeve van de in het gebouw gelegen logiesverblijven voor elke gebruiksoppervlakte
      van 125 m2 of gedeelte daarvan, van het totaal aan gebruiksoppervlakten van die logiesverblijven ten minste één
      toiletruimte als bedoeld in artikel 216, eerste lid, aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel284
  - number: '285'
    text: |-
      In een logiesgebouw moet ten behoeve van de in het gebouw gelegen logiesverblijven voor elke gebruiksoppervlakte
      van 250 m2 of gedeelte daarvan, van het totaal aan gebruiksoppervlakten van die logiesverblijven ten minste één
      badruimte als bedoeld in artikel 217, eerste lid, aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel285
  - number: '286'
    text: |-
      In afwijking in zoverre van artikel 218, tweede lid, mag zijn volstaan met een stallingsruimte met een
      vloeroppervlakte van ten minste 0,5% van de gebruiksoppervlakte van het logiesgebouw.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel286
  - number: 286a
    text: Artikel 222, eerste lid, is niet van toepassing op een niet in een logiesgebouw gelegen logiesverblijf.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel286a
  - number: '287.1'
    text: |-
      In een logiesgebouw moet, voor zover artikel 222, derde lid, niet van toepassing is, ten behoeve van de in het
      logiesgebouw gelegen logiesverblijven, ten minste één opstelplaats voor een stooktoestel als bedoeld in het eerste
      lid van dat artikel, aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel287
  - number: '287.2'
    text: De opstelplaats voor een stooktoestel, bedoeld in het eerste lid, moet zijn gelegen in een afsluitbare stookruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel287
  - number: '287.3'
    text: |-
      De afmetingen van de stookruimte, bedoeld in het tweede lid, moeten zijn afgestemd op de daarin te plaatsen
      verwarmingsapparatuur.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel287
  - number: '288.1'
    text: |-
      In een logiesgebouw moet ten behoeve van de in het gebouw gelegen logiesverblijven ten minste één opstelplaats voor
      een warmwatertoestel als bedoeld in artikel 223, eerste lid, aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel288
  - number: '288.2'
    text: Artikel 223, eerste lid, is niet van toepassing op een niet in een logiesgebouw gelegen logiesverblijf.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel288
  - number: 288a.1
    text: De energieprestatiecoëfficiënt, bedoeld in artikel 228a, eerste lid, van een logiesgebouw is ten hoogste 2,1.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel288a
  - number: 288a.2
    text: |-
      De energieprestatiecoëfficiënt van een niet in een logiesgebouw gelegen verwarmd logiesverblijf, is ten hoogste
      1,4. In afwijking van artikel 228*a*, eerste lid, wordt de energieprestatiecoëfficiënt bepaald overeenkomstig NEN
      5128.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel288a
  - number: '289.1'
    text: |-
      Een in NEN 6702 bedoelde uiterste grenstoestand van een bouwconstructie mag, opdat die constructie bestand is
      tegen de daarop werkende krachten, bij belastingscombinaties als aangegeven bij ministeriële regeling niet zijn
      overschreden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel289
  - number: '289.2'
    text: |-
      Het niet-overschrijden van een uiterste grenstoestand als bedoeld in het eerste lid, moet zijn bepaald
      overeenkomstig bij ministeriële regeling gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel289
  - number: '289.3'
    text: |-
      Onverminderd het eerste lid, mag, opdat een gebouw, voorzover dat een voor mensen toegankelijke, overdekte en
      geheel met wanden omsloten ruimte vormt, bij brand op veilige wijze kan worden verlaten, een uiterste grenstoestand
      van de in NEN 6702 bedoelde hoofddraagconstructie dan wel van een vloer of trap, waarover een vluchtmogelijkheid
      als bedoeld in artikel 303, voert, bij de overeenkomstig bij ministeriële regeling gegeven voorschriften in geval
      van brand aan te houden belastingscombinaties, gedurende de in die voorschriften voor die hoofddraagconstructie,
      vloer of trap aangegeven tijdsduur van de brandwerendheid met betrekking tot bezwijken, bepaald overeenkomstig NEN
      6069, niet zijn overschreden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel289
  - number: '289.4'
    text: |-
      Onverminderd het derde lid, moet de brandwerendheid met betrekking tot bezwijken voor een gezondheidszorggebouw
      dat mede is bestemd voor klinische patiënten, zodanig zijn dat in de nabijheid van een ruimte bestemd voor medische
      verpleging, verzorging of behandeling dan wel voor medisch onderzoek de komst van de brandweer veilig kan worden
      afgewacht.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel289
  - number: '290.1'
    text: |-
      Een vloer moet, ter voorkoming van het van die vloer kunnen vallen, bij de randen zijn voorzien van een afscheiding
      waarvan de hoogte, gemeten vanaf de vloer, ten minste 0,9 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel290
  - number: '290.2'
    text: |-
      In afwijking in zoverre van het eerste lid, mag, indien de afscheiding zich bevindt ter plaatse van een raam, zijn
      volstaan met een hoogte van ten minste 0,6 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel290
  - number: '290.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op een vloer ter plaatse van de bovenste trede van een trap of
      ter plaatse van de bovenkant van een hellingbaan, een laadvloer en op een vloer die niet hoger is gelegen dan 1 m
      boven een aangrenzende vloer of boven het aansluitende terrein of water.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel290
  - number: '291'
    text: |-
      Een hoogteverschil van meer dan 0,22 m tussen vloeren van verblijfsruimten, toiletruimten en badruimten dan wel
      tussen één van die vloeren en het aansluitende terrein, moet, opdat die vloeren op veilige wijze kunnen worden
      bereikt en verlaten, zijn overbrugd door een trap of hellingbaan.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel291
  - number: '292.1'
    text: De afmetingen van een trap als bedoeld in artikel 291, moeten ten minste voldoen aan tabel IV.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel292
  - number: '292.2'
    text: |-
      Een trap als bedoeld in het eerste lid, moet ter plaatse van de bovenste trede over de ten minste vereiste breedte
      aansluiten op een vrije vloeroppervlakte van ten minste 0,7 m * 0,7 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel292
  - number: '292.3'
    text: |-
      Een trap als bedoeld in het eerste lid, waarvan de klimlijn een helling heeft die groter is dan 2:3 en waarmee
      een hoogteverschil van meer dan 1 m is overbrugd, moet aan ten minste één zijkant zijn voorzien van een leuning
      waarvan de bovenkant zich bevindt op een hoogte van ten minste 0,6 m en ten hoogste 1 m boven de voorkant van de
      tredevlakken van de trap.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel292
  - number: '293.1'
    text: |-
      Een hellingbaan als bedoeld in artikel 291, moet een breedte van ten minste 0,7 m hebben en mag geen grotere
      helling hebben dan 1:10.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel293
  - number: '293.2'
    text: |-
      Een hellingbaan als bedoeld in het eerste lid, moet aan de bovenzijde over de ten minste vereiste breedte
      aansluiten op een vrije vloeroppervlakte van ten minste 0,7 m * 0,7 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel293
  - number: '293.3'
    text: |-
      Een hellingbaan waarmee een hoogteverschil van meer dan 1 m is overbrugd, moet vanaf een hoogte van 1 m aan beide
      zijkanten zijn voorzien van een afscheiding met een hoogte van ten minste 0,6 m boven de hellingbaan.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel293
  - number: '294.1'
    text: |-
      In een gebouw waarin een verblijfsruimte aanwezig is, moet, opdat op veilige wijze kan worden beschikt
      over energie, een voorziening voor elektriciteit aanwezig zijn die is aangesloten op het distributienet van
      elektriciteit.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel294
  - number: '294.2'
    text: |-
      Een voorziening voor elektriciteit moet ten minste voldoen aan artikel 5, eerste lid, onderdeel 2, van de Model-
      aansluitvoorwaarden voor elektrische energie van de Vereniging van Exploitanten van Elektriciteitsbedrijven in
      Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel294
  - number: '294.3'
    text: |-
      Een voorziening voor noodstroom moet ten minste voldoen aan artikel 5, eerste lid, onderdeel 2, van de Model-
      aansluitvoorwaarden voor elektrische energie van de Vereniging van Exploitanten van Elektriciteitsbedrijven in
      Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel294
  - number: '295.1'
    text: |-
      In een besloten ruimte waardoor een vluchtmogelijkheid voert, en in een besloten verkeersruimte die mede is
      bestemd voor bezoekers, moet, opdat op veilige wijze gebruik kan worden gemaakt van die ruimte, ten minste één
      verlichtingsinstallatie aanwezig zijn die is aangesloten op de voorziening voor elektriciteit en over de ten minste
      vereiste breedte van die ruimte, gemeten op de vloer daarvan, een verlichtingssterkte van ten minste 1 lux kan
      geven.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel295
  - number: '295.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een trap of hellingbaan, die is gelegen in een ruimte als
      bedoeld in dat lid en op de kooi van een lift.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel295
  - number: '295.3'
    text: |-
      De verlichtingsinstallatie, bedoeld in het eerste en tweede lid, moet, afhankelijk van bestemming en grootte van
      het gebouw, zijn aangesloten op een voorziening voor noodstroom die binnen 15 seconden na het uitvallen van de
      voorziening voor elektriciteit gedurende ten minste 60 minuten een verlichtingssterkte kan geven van ten minste
      1 lux.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel295
  - number: '296'
    text: |-
      Een voorziening voor gas moet, opdat op veilige wijze over energie kan worden beschikt, zijn aangesloten op
      het distributienet van gas en moet ten minste voldoen aan artikel 5, eerste lid, onderdeel 2, van de Model-
      aansluitvoorwaarden voor gas van de Vereniging van Exploitanten van Gasbedrijven in Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel296
  - number: '297'
    text: |-
      Een beweegbaar constructie-onderdeel dat zich in enige stand kan bevinden boven een voor motorvoertuigen
      openstaande weg, moet, ter voorkoming van gevaar voor gebruikers van die weg, gemeten vanaf de onderzijde van dat
      onderdeel, hoger zijn gelegen dan 4,2 m boven die weg.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel297
  - number: '298.1'
    text: |-
      Materiaal, toegepast ter plaatse van of in de nabijheid van een in NEN 6061 bedoelde stookplaats moet, ter
      beperking van het ontstaan van een brandgevaarlijke situatie, onbrandbaar zijn als bedoeld in NEN 6064, voor zover:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel298
  - number: 298.1.a
    text: |-
      ter plaatse van of in de nabijheid van die stookplaats een overeenkomstig NEN 6061 bepaalde intensiteit van de
      warmtestraling kan optreden van meer dan 2 kW/m2, of
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel298
  - number: 298.1.b
    text: in dat materiaal een overeenkomstig NEN 6061 bepaalde temperatuur kan optreden van meer dan 363 K.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel298
  - number: '298.2'
    text: |-
      Een voorziening voor de afvoer van rook moet, bepaald overeenkomstig bij ministeriële regeling gegeven
      voorschriften, luchtdicht zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel298
  - number: '298.3'
    text: |-
      Onverminderd het tweede lid, moet materiaal waaruit de voorziening voor de afvoer van rook is samengesteld, alsmede
      materiaal dat in de nabijheid van die voorziening is toegepast, voor zover in dat materiaal een overeenkomstig NEN
      6062 bepaalde temperatuur kan optreden van meer dan 363 K, onbrandbaar zijn als bedoeld in NEN 6064.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel298
  - number: '298.4'
    text: |-
      De horizontale afstand tussen de uitmonding van een voorziening voor de afvoer van rook van een op vaste brandstof
      gestookt toestel en een in NEN 6063 bedoeld brandgevaarlijk dak van een ander bouwwerk mag niet minder zijn dan
      15 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel298
  - number: '299.1'
    text: |-
      Een constructie-onderdeel, met uitzondering van een dak, moet, ter beperking van ontwikkeling van brand, bepaald
      overeenkomstig NEN 6065 en, voor zover het een vloer of tredevlak is, NEN 1775, zodanig zijn dat de bijdrage tot
      brandvoortplanting van het constructie-onderdeel, afhankelijk van de ruimte waarvan het constructie-onderdeel deel
      uitmaakt, in voldoende mate is beperkt.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel299
  - number: '299.2'
    text: |-
      Het eerste lid is niet van toepassing op een beperkt deel van de totale oppervlakte van de in dat lid bedoelde
      constructie-onderdelen van elke afzonderlijke ruimte van het gebouw.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel299
  - number: '300'
    text: |-
      Een gebouw, voor zover dat een voor mensen toegankelijke, overdekte en geheel met wanden omsloten ruimte vormt,
      moet zodanig in brandcompartimenten zijn ingericht dat een in dat gebouw begonnen brand zich niet binnen korte tijd
      kan uitbreiden naar een ander deel van het gebouw of naar een ander gebouw.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel300
  - number: '301.1'
    text: |-
      Een naar een besloten ruimte toegekeerde zijde van een constructie-onderdeel moet, ter beperking van rookproduktie,
      bepaald overeenkomstig NEN 6066, zodanig zijn dat de rookdichtheid van het constructie-onderdeel, afhankelijk van
      de ruimte waarvan het constructie-onderdeel deel uitmaakt, in voldoende mate is beperkt.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel301
  - number: '301.2'
    text: |-
      Het eerste lid is niet van toepassing op een beperkt deel van de totale oppervlakte van de in dat lid bedoelde
      constructie-onderdelen van elke afzonderlijke ruimte van het gebouw.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel301
  - number: '302'
    text: |-
      Een gebouw, voor zover dat een voor mensen toegankelijke, overdekte en geheel met wanden omsloten ruimte vormt,
      moet, afhankelijk van zijn bestemming en grootte, zodanig in rookcompartimenten zijn ingericht dat bij brand
      rook zich niet binnen korte tijd kan verspreiden naar een ander deel van het gebouw of naar een ander gebouw, de
      loopafstand, gemeten langs de kortste route, naar de uitgang van een rookcompartiment beperkt is en dat een ruimte
      waardoor een vluchtweg voert in voldoende mate gevrijwaard blijft van rook.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel302
  - number: '303'
    text: |-
      Een gebouw, voor zover dat een voor mensen toegankelijke, overdekte en geheel met wanden omsloten ruimte vormt,
      moet, afhankelijk van zijn bestemming en grootte, zodanig zijn ingericht dat daarin voldoende vluchtmogelijkheden
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel303
  - number: '304'
    text: |-
      Onverminderd artikel 289, derde lid, moet een vluchtmogelijkheid als bedoeld in artikel 303, zodanig zijn ingericht
      dat gebruikers van het gebouw bij brand op doeltreffende en voldoende veilige wijze binnen redelijke tijd naar het
      aan het gebouw aansluitende terrein kunnen vluchten.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel304
  - number: '305'
    text: |-
      Een gebouw, voor zover dat een voor mensen toegankelijke, overdekte en geheel met wanden omsloten ruimte vormt,
      moet, afhankelijk van zijn bestemming en inrichting, zodanig zijn ingericht dat in het gebouw aanwezige personen
      bij brand binnen redelijke tijd eigener beweging het gebouw kunnen verlaten dan wel binnen redelijke tijd door de
      brandweer kunnen worden gered.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel305
  - number: '306'
    text: |-
      In een gebouw moeten, afhankelijk van zijn bestemming en grootte, zodanige voorzieningen aanwezig zijn dat een
      brand binnen redelijke tijd kan worden geblust.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel306
  - number: '307.1'
    text: |-
      Indien niet is voldaan aan enig voorschrift, gegeven bij of krachtens de artikelen 289 tot en met 306, moet een
      gebouw een mate van veiligheid bieden die ten minste gelijk is aan de mate van veiligheid die is beoogd met het
      desbetreffende bij of krachtens die artikelen gegeven voorschrift.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel307
  - number: '307.2'
    text: |-
      Indien toepassing is gegeven aan het eerste lid en het desbetreffende voorschrift tevens valt te herleiden tot
      overwegingen van gezondheid, bruikbaarheid of energiezuinigheid, moeten die overwegingen daarbij in ten minste
      dezelfde mate in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel307
  - number: '307.3'
    text: |-
      Ten aanzien van de bij of krachtens hoofdstuk IX uit het oogpunt van veiligheid gegeven voorschriften zijn het
      eerste en tweede lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel307
  - number: '308.1'
    text: |-
      Een uitwendige scheidingsconstructie van een verblijfsruimte, toiletruimte of badruimte moet, ter beperking van het
      kunnen binnendringen van vocht in een gebouw, bepaald overeenkomstig NEN 2778, waterdicht zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel308
  - number: '308.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een constructie die de scheiding vormt tussen een
      verblijfsruimte, toiletruimte of badruimte en de kruipruimte, met inbegrip van de op die constructie aansluitende
      delen van andere constructies, voor zover die delen van invloed zijn op het voldoen van die constructie aan dit
      lid.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel308
  - number: '308.3'
    text: |-
      Een inwendige scheidingsconstructie van een verblijfsruimte, toiletruimte of badruimte, voor zover die constructie
      niet de scheiding vormt met een andere verblijfsruimte, toiletruimte of badruimte, moet, bepaald overeenkomstig NEN
      2778, waterdicht zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel308
  - number: '309'
    text: |-
      Een constructie die de scheiding vormt tussen een badruimte en een andere besloten ruimte, de buitenlucht, de grond
      of het water, mag, ter beperking van het vanuit de badruimte kunnen binnendringen van vocht in die constructie,
      aan de naar de badruimte toegekeerde oppervlakte tot een hoogte van 1 m boven de vloer van de badruimte, bepaald
      overeenkomstig NEN 2778, gemiddeld geen grotere wateropname hebben dan 0,01 kg/(m2.s½), met dien verstande dat op
      geen enkele plaats op die oppervlakte de wateropname hoger mag zijn dan 0,2 kg/(m2.s½).
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel309
  - number: '310.1'
    text: |-
      In een gebouw moet, afhankelijk van zijn bestemming en inrichting, ter voorkoming van een voor de gezondheid
      onaanvaardbare situatie in en bij het gebouw, een voorziening voor de afvoer van afvalwater en faecaliën aanwezig
      zijn, die is aangesloten op het openbaar riool.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel310
  - number: '310.2'
    text: |-
      De voorziening voor afvalwater en faecaliën moet een zodanige capaciteit hebben dat elk op die voorziening
      aangesloten lozingstoestel als bedoeld in NEN 3215, binnen 5 minuten is geleegd en moet lucht- en waterdicht zijn.
      Ten aanzien van de bepaling van de lucht- en waterdichtheid is NEN 3215 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel310
  - number: '311.1'
    text: |-
      In een verblijfsruimte, toiletruimte en badruimte moet, ter beperking van het ontstaan van een voor de gezondheid
      nadelige kwaliteit van de binnenlucht, een voorziening aanwezig zijn voor de toevoer van verse lucht en de afvoer
      van binnenlucht.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel311
  - number: '311.2'
    text: |-
      De voorziening voor de toevoer van verse lucht naar een verblijfsruimte en voor de afvoer van binnenlucht uit die
      ruimte moet, bepaald overeenkomstig bij ministeriële regeling gegeven voorschriften, een capaciteit hebben die is
      afgestemd op de bestemming en inrichting van die ruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel311
  - number: '311.3'
    text: |-
      Onverminderd het tweede lid, moet, indien zich in een verblijfsruimte ten hoogste één opstelplaats voor een
      kooktoestel bevindt, de capaciteit aan toevoer van verse lucht naar die ruimte en afvoer van binnenlucht uit die
      ruimte, bepaald overeenkomstig bij ministeriële regeling gegeven voorschriften, ten minste 21.10-3 m3/s zijn, met
      dien verstande dat de afvoer van die capaciteit rechtstreeks naar buiten moet plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel311
  - number: '311.4'
    text: |-
      De voorziening voor de toevoer van verse lucht en de afvoer van binnenlucht moet, bepaald overeenkomstig bij
      ministeriële regeling gegeven voorschriften, een capaciteit hebben van ten minste:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel311
  - number: 311.4.a
    text: 7.10-3 m3/s voor een toiletruimte, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel311
  - number: 311.4.b
    text: 14.10-3 m3/s voor een badruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel311
  - number: '311.5'
    text: De afvoer van binnenlucht, bedoeld in het vierde lid, moet rechtstreeks naar buiten plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel311
  - number: '312.1'
    text: |-
      In een ruimte als bedoeld in het tweede lid, moet, ter beperking van het ontstaan van een voor de gezondheid
      nadelige kwaliteit van de binnenlucht, een voorziening voor de toevoer van verse lucht en de afvoer van binnenlucht
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel312
  - number: '312.2'
    text: |-
      De voorziening voor de toevoer van verse lucht en de afvoer van binnenlucht moet, bepaald overeenkomstig bij
      ministeriële regeling gegeven voorschriften, een capaciteit hebben van ten minste:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel312
  - number: 312.2.a
    text: 6.10-3 m3/s per m2 vrije vloeroppervlakte van een liftkooi;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel312
  - number: 312.2.b
    text: 0,1 m3/s voor een besloten opslagruimte voor afval met een netto-inhoud van meer dan 3 m3;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel312
  - number: 312.2.c
    text: 3.10-3 m3/s per m2 gebruiksoppervlakte van een stallingsruimte, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel312
  - number: 312.2.d
    text: 2.10-3 m3/s per m3 netto-inhoud voor een meterruimte, met een minimum van 2.10-3 m3/s.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel312
  - number: '312.3'
    text: |-
      De toevoer van verse lucht naar een opslagruimte voor afval als bedoeld in het tweede lid, moet rechtstreeks van
      buiten plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel312
  - number: '312.4'
    text: |-
      De afvoer van binnenlucht uit een opslagruimte voor afval als bedoeld in het tweede lid, moet rechtstreeks naar
      buiten plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel312
  - number: '313.1'
    text: |-
      In een gebouw moet, voor zover daarin een opstelplaats voor een verbrandingstoestel met een nominale belasting
      als bedoeld in NEN 2757 van niet meer dan 15 kW aanwezig is, ter voorkoming van een onaanvaardbare ophoping van
      vergiftige of hinderlijke gassen, ten behoeve van dat verbrandingstoestel een voorziening voor de toevoer van
      verbrandingslucht en de afvoer van rook aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel313
  - number: '313.2'
    text: |-
      De voorziening voor de toevoer van verbrandingslucht en de afvoer van rook moet, bepaald overeenkomstig bij
      ministeriële regeling gegeven voorschriften, een in die voorschriften aangegeven capaciteit hebben.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel313
  - number: '313.3'
    text: |-
      De inrichting van de voorziening voor de toevoer van verbrandingslucht en de afvoer van rook moet, wat de
      richting van de stroming van de afvoer van rook betreft, ten minste voldoen aan bij ministeriële regeling gegeven
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel313
  - number: '314.1'
    text: |-
      In een uitwendige scheidingsconstructie van een gebouw waarin een verblijfsruimte is gelegen, mogen zich, ter
      beperking van het in het gebouw kunnen binnendringen van ratten en muizen, geen onafsluitbare openingen bevinden
      die breder zijn dan 0,01 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel314
  - number: '314.2'
    text: |-
      Het eerste lid is niet van toepassing op een opening die aan de bovenzijde de uitmonding vormt van een verticaal
      kanaal en op de ruimte die zich bevindt tussen de dakbedekking en het onder die bedekking gelegen deel van het dak.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel314
  - number: '315.1'
    text: |-
      In een gebouw moet, afhankelijk van zijn bestemming en inrichting, opdat voor de menselijke consumptie en hygiëne
      geschikt drinkwater kan worden betrokken, een voorziening voor drinkwater aanwezig zijn die is aangesloten op het
      distributienet voor drinkwater.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel315
  - number: '315.2'
    text: |-
      Een voorziening voor drinkwater moet ten minste voldoen aan artikel 5, eerste lid, onderdeel 2, van de Model-
      aansluitvoorwaarden voor drinkwater van de Vereniging van Exploitanten van Waterleidingbedrijven in Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel315
  - number: '316'
    text: |-
      Een voorziening voor warm water moet, opdat over voor de menselijke hygiëne geschikt warm water kan worden
      beschikt, ten minste voldoen aan artikel 5, eerste lid, onderdeel 2, van de Model-aansluitvoorwaarden voor
      drinkwater van de Vereniging van Exploitanten van Waterleidingbedrijven in Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel316
  - number: '317.1'
    text: |-
      Een gebouw moet, afhankelijk van zijn bestemming en inrichting, zodanig zijn geconstrueerd dat in een
      verblijfsruimte, bepaald overeenkomstig NEN 2057, een zodanige equivalente daglichtoppervlakte aanwezig is dat in
      die ruimte voldoende daglicht kan toetreden en vanuit die ruimte naar buiten kan worden gekeken.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel317
  - number: '317.2'
    text: |-
      Bij de bepaling van de in het eerste lid bedoelde equivalente daglichtoppervlakte blijven bouwwerken en
      daarmee gelijk te stellen belemmeringen die zich niet bevinden op het perceel waarop het gebouw is gelegen, en
      daglichtopeningen in een uitwendige scheidingsconstructie, voor zover die openingen, gemeten loodrecht op die
      openingen, zijn gelegen op een afstand van minder dan 2 m van de perceelsgrens, buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel317
  - number: '317.3'
    text: |-
      In afwijking in zoverre van het tweede lid, mag, indien het perceel waarop het gebouw is gelegen, grenst aan een
      openbare weg, openbaar water of openbaar groen, de afstand zijn aangehouden tot het hart van die weg, dat water of
      dat groen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel317
  - number: '317.4'
    text: |-
      Bij de bepaling van de in het eerste lid bedoelde equivalente daglichtoppervlakte moet de in rekening te brengen
      belemmeringshoek α, bedoeld in NEN 2057, ten minste 25° zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel317
  - number: '317.5'
    text: |-
      In afwijking in zoverre van het eerste lid, mag de equivalente daglichtoppervlakte zich bevinden in een inwendige
      scheidingsconstructie van een verblijfsruimte, indien die constructie niet de scheiding vormt met een andere
      verblijfsruimte of met een toiletruimte, badruimte of bergruimte.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel317
  - number: '318.1'
    text: |-
      Indien niet is voldaan aan enig voorschrift, gegeven bij of krachtens de artikelen 308 tot en met 317, moet een
      gebouw een mate van bescherming van de gezondheid bieden, die ten minste gelijk is aan de mate van bescherming die
      is beoogd met het desbetreffende bij of krachtens die artikelen gegeven voorschrift.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel318
  - number: '318.2'
    text: |-
      Indien toepassing is gegeven aan het eerste lid en het desbetreffende voorschrift tevens valt te herleiden tot
      overwegingen van veiligheid, bruikbaarheid of energiezuinigheid, moeten die overwegingen daarbij in ten minste
      dezelfde mate in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel318
  - number: '318.3'
    text: |-
      Ten aanzien van de bij of krachtens hoofdstuk IX uit het oogpunt van gezondheid gegeven voorschriften zijn het
      eerste en tweede lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel318
  - number: '319.1'
    text: |-
      In een gebouw moet, afhankelijk van zijn bestemming, opdat daarin de voor het gebouw kenmerkende activiteiten
      kunnen plaatsvinden, ten minste 4 m2 vloeroppervlakte aan verblijfsruimte aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel319
  - number: '319.2'
    text: |-
      Een verblijfsruimte moet een vloeroppervlakte hebben van ten minste 4 m2, waarvan de breedte ten minste 1,5 m en de
      hoogte boven die vloeroppervlakte ten minste 2,1 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel319
  - number: '320.1'
    text: |-
      In een gebouw moeten, afhankelijk van zijn bestemming en grootte, opdat sanitaire handelingen kunnen worden
      verricht, voldoende afsluitbare toiletruimten aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel320
  - number: '320.2'
    text: |-
      Een toiletruimte als bedoeld in het eerste lid, moet een vloeroppervlakte hebben van ten minste 0,64 m2, waarvan de
      breedte ten minste 0,6 m en de hoogte boven ten minste de helft van die oppervlakte ten minste 2 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel320
  - number: '321.1'
    text: |-
      In een gebouw moeten, afhankelijk van zijn bestemming en grootte, opdat men zich kan wassen, voldoende afsluitbare
      badruimten aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel321
  - number: '321.2'
    text: |-
      Een badruimte als bedoeld in het eerste lid, moet een vloeroppervlakte hebben van ten minste 0,36 m2, waarvan de
      breedte ten minste 0,6 m en de hoogte boven die oppervlakte ten minste 2 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel321
  - number: '321.3'
    text: |-
      Een badruimte mag, opdat de gebruiksoppervlakte van het gebouw doelmatig kan worden benut, zijn samengevoegd met
      een toiletruimte, mits de vloeroppervlakte van die samengevoegde ruimte ten minste 1 m2 is, waarvan de breedte ten
      minste 0,6 m en de hoogte boven twee derde van die oppervlakte ten minste 2 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel321
  - number: '322.1'
    text: |-
      In een gebouw moet, afhankelijk van zijn bestemming en inrichting, opdat verwarmingsapparatuur kan worden
      geplaatst, ten minste één opstelplaats voor een stooktoestel aanwezig zijn, die niet mag zijn gelegen in een
      toiletruimte, badruimte of in een andere besloten ruimte waardoor een vluchtweg voert.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel322
  - number: '322.2'
    text: |-
      De afmetingen van een opstelplaats voor een stooktoestel als bedoeld in het eerste lid, moeten zijn afgestemd op de
      daarop te plaatsen verwarmingsapparatuur.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel322
  - number: '322.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing, indien het gebouw voor de verwarming van de in het gebouw
      gelegen verblijfsruimten is aangesloten op het distributienet voor stadsverwarming.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel322
  - number: '322.4'
    text: |-
      Een opstelplaats voor een stooktoestel, die is bestemd voor één of meer stooktoestellen met een gezamenlijke
      nominale belasting als bedoeld in NEN 2757, van meer dan 160 kW, moet in een afzonderlijke stookruimte zijn
      gelegen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel322
  - number: '322.5'
    text: |-
      De afmetingen van de stookruimte, bedoeld in het vierde lid, moeten zijn afgestemd op de daarin te plaatsen
      verwarmingsapparatuur.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel322
  - number: '323.1'
    text: |-
      Indien niet is voldaan aan enig voorschrift, gegeven bij of krachtens de artikelen 319 tot en met 322, moet een
      gebouw een mate van bruikbaarheid bieden die ten minste gelijk is aan de mate van bruikbaarheid die is beoogd met
      het desbetreffende bij of krachtens die artikelen gegeven voorschrift.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel323
  - number: '323.2'
    text: |-
      Indien toepassing is gegeven aan het eerste lid en het desbetreffende voorschrift tevens valt te herleiden tot
      overwegingen van veiligheid, gezondheid of energiezuinigheid, moeten die overwegingen daarbij in ten minste
      dezelfde mate in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel323
  - number: '323.3'
    text: |-
      Ten aanzien van de bij of krachtens hoofdstuk IX uit het oogpunt van bruikbaarheid gegeven voorschriften zijn het
      eerste en tweede lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel323
  - number: '324'
    text: |-
      De bijdrage tot brandvoortplanting van een constructie-onderdeel, met uitzondering van een dak, moet, ter beperking
      van ontwikkeling van brand, bepaald overeenkomstig NEN 6065 en, voor zover het een vloer of tredevlak is, NEN 1775,
      ten minste voldoen aan bij ministeriële regeling gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel324
  - number: '325.1'
    text: |-
      Een kantoorgebouw, alsmede een bij ministeriële regeling aangegeven gedeelte van een kantoorgebouw moeten, ter
      beperking van uitbreiding van brand, overeenkomstig bij ministeriële regeling gegeven voorschriften zijn verdeeld
      in brandcompartimenten.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel325
  - number: '325.2'
    text: |-
      De in NEN 6068 bedoelde weerstand tegen branddoorslag en brandoverslag tussen een brandcompartiment en een andere
      bij ministeriële regeling aangegeven besloten ruimte moet, bepaald overeenkomstig die norm, ten minste voldoen aan
      bij ministeriële regeling gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel325
  - number: '325.3'
    text: |-
      In een inwendige scheidingsconstructie tussen een brandcompartiment en een andere bij ministeriële regeling
      aangegeven besloten ruimte mag zich geen beweegbaar constructie-onderdeel bevinden, anders dan een zelfsluitende
      deur.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel325
  - number: '326'
    text: |-
      Een naar een besloten ruimte toegekeerde zijde van een constructie-onderdeel moet, ter beperking van rookproduktie,
      bepaald overeenkomstig NEN 6066, ten minste voldoen aan bij ministeriële regeling gegeven voorschriften met
      betrekking tot de rookdichtheid.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel326
  - number: '327.1'
    text: |-
      Een brandcompartiment als bedoeld in artikel 325, eerste lid, moet, ter beperking van verspreiding van rook,
      overeenkomstig bij ministeriële regeling gegeven voorschriften zijn verdeeld in rookcompartimenten.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel327
  - number: '327.2'
    text: |-
      De in NEN 6075 bedoelde weerstand tegen rookdoorgang tussen een brandcompartiment en een andere bij ministeriële
      regeling aangegeven besloten ruimte moet, bepaald overeenkomstig die norm, ten minste voldoen aan bij ministeriële
      regeling gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel327
  - number: '327.3'
    text: |-
      Een beweegbaar constructie-onderdeel dat zich bevindt in een constructie die de scheiding vormt tussen een
      rookcompartiment en een andere bij ministeriële regeling aangegeven besloten ruimte moet zelfsluitend zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel327
  - number: '328'
    text: |-
      In een kantoorgebouw moeten, opdat het gebouw bij brand op veilige wijze kan worden verlaten, overeenkomstig bij
      ministeriële regeling gegeven voorschriften vluchtmogelijkheden aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel328
  - number: '329'
    text: |-
      Een vluchtmogelijkheid als bedoeld in artikel 328, moet, opdat snel en veilig kan worden gevlucht, ten minste
      voldoen aan bij ministeriële regeling gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel329
  - number: '330.1'
    text: |-
      Een brandweerlift moet, opdat de brandweer bij brand optimaal gebruik kan maken van die lift, ten minste voldoen
      aan het gestelde ten aanzien van de brandweerschakelaar en de voeding van de lift in NEN-EN 81-1, voor zover het
      een elektrisch aangedreven lift betreft, of NEN-EN 81-2, voor zover het een hydraulisch aangedreven lift betreft.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel330
  - number: '330.2'
    text: |-
      In een kantoorgebouw moeten overeenkomstig bij ministeriële regeling gegeven voorschriften vluchtwegaanduidingen
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel330
  - number: '331.1'
    text: |-
      Een kantoorgebouw waarin een vloer van een verblijfsruimte hoger is gelegen dan 20 m boven het aansluitende
      terrein, gemeten ter plaatse van de toegang van het gebouw, moet, opdat een beginnende brand kan worden bestreden,
      overeenkomstig bij ministeriële regeling gegeven voorschriften zijn voorzien van droge blusleidingen waarvan de
      inrichting ten minste voldoet aan bij die regeling gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel331
  - number: '331.2'
    text: |-
      Indien in een kantoorgebouw een vloer van een verblijfsruimte hoger is gelegen dan 50 m boven het aansluitende
      terrein, gemeten ter plaatse van de toegang van het gebouw, moet een blusleiding als bedoeld in het eerste
      lid, zijn voorzien van een elektrisch aangedreven pomp. De pomp moet zijn aangesloten op een voorziening voor
      noodstroom, waarmee die pomp binnen 15 seconden na het uitvallen van de voorziening voor elektriciteit, gedurende
      ten minste 24 uren kan functioneren en gedurende ten minste 6 uren in bedrijf kan blijven.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel331
  - number: '332'
    text: |-
      Onverminderd de artikelen 324 tot en met 331, moet een kantoorgebouw waarin een vloer van een verblijfsruimte hoger
      is gelegen dan 70 m boven het aansluitende terrein, gemeten ter plaatse van de toegang van het kantoorgebouw, wat
      brandveiligheid betreft, zodanig zijn ingericht dat het gebouw in ten minste gelijke mate brandveilig is als is
      beoogd met de bij of krachtens die artikelen gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel332
  - number: '333'
    text: |-
      Indien een kantoorgebouw in overeenstemming is met de bij of krachtens deze paragraaf gegeven voorschriften, is
      voldaan aan de artikelen 299 tot en met 306.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel333
  - number: '334'
    text: |-
      In een kantoorgebouw moet een voorziening voor afvalwater en faecaliën als bedoeld in artikel 310, eerste lid,
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel334
  - number: '335'
    text: |-
      De voorziening voor de toevoer van verse lucht en de afvoer van binnenlucht als bedoeld in artikel 311, tweede
      lid, moet voor de toevoer van verse lucht naar een verblijfsruimte en de afvoer van binnenlucht uit die ruimte een
      capaciteit hebben van ten minste 10.10-3 m3/s.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel335
  - number: '336'
    text: In een kantoorgebouw moet een voorziening voor drinkwater als bedoeld in artikel 315, eerste lid, aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel336
  - number: '337.1'
    text: |-
      In afwijking in zoverre van artikel 319, eerste lid, moet in een kantoorgebouw een vloeroppervlakte van ten minste
      8 m2 aan verblijfsruimte aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel337
  - number: '337.2'
    text: |-
      In afwijking in zoverre van artikel 319, tweede lid, moet een verblijfsruimte een vloeroppervlakte hebben van ten
      minste 8 m2.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel337
  - number: '338'
    text: |-
      In een kantoorgebouw moet voor elke 450 m2 gebruiksoppervlakte of gedeelte daarvan, ten minste één toiletruimte als
      bedoeld in artikel 320, eerste lid, aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel338
  - number: '339'
    text: |-
      In een kantoorgebouw moet, voor zover artikel 322, derde lid, niet van toepassing is, ten minste één opstelplaats
      voor een stooktoestel als bedoeld in artikel 322, eerste lid, aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel339
  - number: '340'
    text: |-
      De bijdrage tot brandvoortplanting van een constructie-onderdeel, met uitzondering van een dak, moet, ter beperking
      van ontwikkeling van brand, bepaald overeenkomstig NEN 6065 en, voor zover het een vloer of tredevlak is, NEN 1775,
      ten minste voldoen aan bij ministeriële regeling gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel340
  - number: '341.1'
    text: |-
      Een logiesverblijf en een logiesgebouw, alsmede een bij ministeriële regeling aangegeven gedeelte van een
      logiesverblijf en van een logiesgebouw moeten, ter beperking van uitbreiding van brand, overeenkomstig bij
      ministeriële regeling gegeven voorschriften zijn verdeeld in brandcompartimenten.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel341
  - number: '341.2'
    text: |-
      De in NEN 6068 bedoelde weerstand tegen branddoorslag en brandoverslag tussen een brandcompartiment en een andere
      bij ministeriële regeling aangegeven besloten ruimte moet, bepaald overeenkomstig die norm, ten minste voldoen aan
      bij ministeriële regeling gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel341
  - number: '341.3'
    text: |-
      In een inwendige scheidingsconstructie tussen een brandcompartiment en een andere bij ministeriële regeling
      aangegeven besloten ruimte mag zich geen beweegbaar constructie-onderdeel bevinden, anders dan een zelfsluitende
      deur.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel341
  - number: '342'
    text: |-
      Een naar een besloten ruimte toegekeerde zijde van een constructie-onderdeel moet, ter beperking van rookproduktie,
      bepaald overeenkomstig NEN 6066, ten minste voldoen aan bij ministeriële regeling gegeven voorschriften met
      betrekking tot de rookdichtheid.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel342
  - number: '343.1'
    text: |-
      Een brandcompartiment als bedoeld in artikel 341, eerste lid, moet, ter beperking van verspreiding van rook,
      overeenkomstig bij ministeriële regeling gegeven voorschriften zijn verdeeld in rookcompartimenten.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel343
  - number: '343.2'
    text: |-
      De in NEN 6075 bedoelde weerstand tegen rookdoorgang tussen een brandcompartiment en een andere bij ministeriële
      regeling aangegeven besloten ruimte moet, bepaald overeenkomstig die norm, ten minste voldoen aan bij ministeriële
      regeling gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel343
  - number: '343.3'
    text: |-
      Een beweegbaar constructie-onderdeel dat zich bevindt in een constructie die de scheiding vormt tussen een
      rookcompartiment en een andere bij ministeriële regeling aangegeven besloten ruimte moet zelfsluitend zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel343
  - number: '344'
    text: |-
      In een bij ministeriële regeling aangegeven logiesverblijf en een logiesgebouw moeten, opdat het verblijf of
      het gebouw bij brand op veilige wijze kan worden verlaten, overeenkomstig bij ministeriële regeling gegeven
      voorschriften vluchtmogelijkheden aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel344
  - number: '345'
    text: |-
      Een vluchtmogelijkheid als bedoeld in artikel 344, moet, opdat snel en veilig kan worden gevlucht, ten minste
      voldoen aan bij ministeriële regeling gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel345
  - number: '346.1'
    text: |-
      Een brandweerlift moet, opdat de brandweer bij brand optimaal gebruik kan maken van die lift, ten minste voldoen
      aan het gestelde ten aanzien van de brandweerschakelaar en de voeding van de lift in NEN-EN 81-1, voor zover het
      een elektrisch aangedreven lift betreft, of NEN-EN 81-2, voor zover het een hydraulisch aangedreven lift betreft.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel346
  - number: '346.2'
    text: |-
      In een bij ministeriële regeling aangegeven logiesverblijf en een logiesgebouw moeten overeenkomstig bij
      ministeriële regeling gegeven voorschriften vluchtwegaanduidingen aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel346
  - number: '347.1'
    text: |-
      Een logiesgebouw waarin een vloer van een verblijfsruimte hoger is gelegen dan 20 m boven het aansluitende
      terrein, gemeten ter plaatse van de toegang van het gebouw, moet, opdat een beginnende brand kan worden bestreden,
      overeenkomstig bij ministeriële regeling gegeven voorschriften zijn voorzien van droge blusleidingen waarvan de
      inrichting ten minste voldoet aan bij die regeling gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel347
  - number: '347.2'
    text: |-
      Indien in een logiesgebouw een vloer van een verblijfsruimte hoger is gelegen dan 50 m boven het aansluitende
      terrein, gemeten ter plaatse van de toegang van het gebouw, moet een blusleiding als bedoeld in het eerste
      lid, zijn voorzien van een elektrisch aangedreven pomp. De pomp moet zijn aangesloten op een voorziening voor
      noodstroom, waarmee die pomp binnen 15 seconden na het uitvallen van de voorziening voor elektriciteit, gedurende
      ten minste 24 uren kan functioneren en gedurende ten minste 6 uren in bedrijf kan blijven.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel347
  - number: '348'
    text: |-
      Onverminderd de artikelen 340 tot en met 347, moet een logiesgebouw waarin een vloer van een verblijfsruimte hoger
      is gelegen dan 70 m boven het aansluitende terrein, gemeten ter plaatse van de toegang van het logiesgebouw, wat
      brandveiligheid betreft, zodanig zijn ingericht dat het gebouw in ten minste gelijke mate brandveilig is als met de
      bij of krachtens die artikelen gegeven voorschriften is beoogd.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel348
  - number: '349'
    text: |-
      Indien een logiesverblijf of logiesgebouw in overeenstemming is met de bij of krachtens deze paragraaf gegeven
      voorschriften, is voldaan aan de artikelen 299 tot en met 306.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel349
  - number: '350'
    text: |-
      In een logiesverblijf en een logiesgebouw moet een voorziening voor afvalwater en faecaliën als bedoeld in artikel
      310, eerste lid, aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel350
  - number: '351'
    text: |-
      De voorziening voor de toevoer van verse lucht en de afvoer van binnenlucht als bedoeld in artikel 311, tweede
      lid, moet voor de toevoer van verse lucht naar een verblijfsruimte en de afvoer van binnenlucht uit die ruimte een
      capaciteit hebben van ten minste 7.10-3 m3/s.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel351
  - number: '352'
    text: |-
      In een logiesverblijf en logiesgebouw moet een voorziening voor drinkwater als bedoeld in artikel 315, eerste lid,
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel352
  - number: '353'
    text: |-
      In het totaal van de uitwendige scheidingsconstructies van een verblijfsruimte moet een equivalente
      daglichtoppervlakte als bedoeld in artikel 317, eerste lid, aanwezig zijn van ten minste 0,35 m2.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel353
  - number: '354'
    text: |-
      In een niet in een logiesgebouw gelegen logiesverblijf moet ten minste één toiletruimte als bedoeld in artikel 320,
      eerste lid, aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel354
  - number: '355'
    text: Tot een logiesverblijf behoeft geen badruimte te behoren.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel355
  - number: '356.1'
    text: |-
      In afwijking in zoverre van artikel 354, eerste lid, mag de toiletruimte van een logiesverblijf dat deel uitmaakt
      van een complex, buiten het logiesverblijf zijn gelegen, mits op het complex voor elke gebruiksoppervlakte van 200
      m2 of gedeelte daarvan, van het totaal aan gebruiksoppervlakten van de op het complex gelegen logiesverblijven ten
      minste één afsluitbare gemeenschappelijke toiletruimte aanwezig is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel356
  - number: '356.2'
    text: |-
      In een logiesgebouw moet ten behoeve van de in het logiesgebouw gelegen logiesverblijven voor elke
      gebruiksoppervlakte van 200 m2 of gedeelte daarvan, ten minste één toiletruimte als bedoeld in artikel 354,
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel356
  - number: '357'
    text: |-
      In een logiesgebouw moet ten behoeve van de in het logiesgebouw gelegen logiesverblijven voor elke
      gebruiksoppervlakte van 400 m2 of gedeelte daarvan, van het totaal aan gebruiksoppervlakten van die
      logiesverblijven ten minste één afsluitbare badruimte als bedoeld in artikel 321, eerste lid, aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel357
  - number: '358'
    text: |-
      In een logiesgebouw moet, voor zover artikel 322, derde lid, niet van toepassing is, ten behoeve van de in het
      gebouw gelegen logiesverblijven ten minste één opstelplaats voor een stooktoestel als bedoeld in artikel 322,
      eerste lid, aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel358
  - number: '359.1'
    text: |-
      Een in NEN 6702 bedoelde uiterste grenstoestand van een bouwconstructie mag, opdat die constructie duurzaam bestand
      is tegen de daarop werkende krachten, bij de in die norm bedoelde fundamentele belastingscombinaties niet zijn
      overschreden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel359
  - number: '359.2'
    text: |-
      Onverminderd het eerste lid, mag een uiterste grenstoestand van een in NEN 6072 bedoelde bouwconstructie bij de in
      die norm bedoelde bijzondere belastingscombinaties niet zijn overschreden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel359
  - number: '359.3'
    text: |-
      Onverminderd het eerste lid, mag, ter voorkoming van voortschrijdende instorting, een in dat lid bedoelde
      uiterste grenstoestand van de in NEN 6702 bedoelde hoofddraagconstructie bij de in die norm bedoelde bijzondere
      belastingscombinaties, met uitzondering van de combinaties met brand, niet zijn overschreden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel359
  - number: '359.4'
    text: |-
      Onverminderd het eerste tot en met derde lid, moet voor de bepaling van de in die leden bedoelde
      belastingscombinaties, indien NEN 6702 daarin niet voorziet, zijn uitgegaan van NEN 6700.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel359
  - number: '359.5'
    text: |-
      De krachtsverdeling in een bouwconstructie, die voortvloeit uit de ingevolge het eerste tot en met derde lid aan te
      houden belastingscombinaties, mag niet hoger zijn dan de capaciteit aan draagvermogen van die constructie, bepaald
      overeenkomstig:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel359
  - number: 359.5.a
    text: NEN 6710 en 6770, indien de bouwconstructie is vervaardigd van in die normen bedoeld metaal;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel359
  - number: 359.5.b
    text: NEN 6720 en NEN 6790, indien de bouwconstructie is vervaardigd van in die normen bedoeld steenachtig materiaal;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel359
  - number: 359.5.c
    text: NEN 6760, indien de bouwconstructie is vervaardigd van in die norm bedoeld hout;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel359
  - number: 359.5.d
    text: NEN 2608, indien de bouwconstructie is vervaardigd van in die norm bedoeld glas, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel359
  - number: 359.5.e
    text: NEN 6707, indien de bouwconstructie de in die norm bedoelde bevestiging van dakbedekking is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel359
  - number: '359.6'
    text: |-
      Indien een ander materiaal of een andere bepalingsmethode is toegepast dan in het vijfde lid is bedoeld, moet het
      niet-overschrijden van een uiterste grenstoestand van een bouwconstructie zijn bepaald overeenkomstig NEN 6700.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel359
  - number: '359.7'
    text: |-
      Onverminderd het derde lid, moeten de hoofddraagconstructie, een vloer en een trap van een bouwwerk, geen gebouw
      zijnde, afhankelijk van de bestemming en inrichting van dat bouwwerk, zodanig zijn dat bij brand dat bouwwerk
      binnen redelijke tijd kan worden verlaten zonder dat gevaar bestaat voor instorting van de hoofddraagconstructie,
      de vloer of de trap.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel359
  - number: '360.1'
    text: |-
      Een vloer moet, ter voorkoming van het van die vloer kunnen vallen, bij de randen zijn voorzien van een afscheiding
      waarvan de hoogte, gemeten vanaf de vloer, ten minste 1 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel360
  - number: '360.2'
    text: |-
      In afwijking in zoverre van het eerste lid, moet, indien de vloer hoger is gelegen dan 13 m boven een aangrenzende
      vloer of boven het aansluitende terrein of water, de hoogte van de afscheiding ten minste 1,2 m zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel360
  - number: '360.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op een vloer ter plaatse van de bovenste trede van een trap of
      ter plaatse van de bovenkant van een hellingbaan, een laadvloer en op een vloer die niet hoger is gelegen dan 0,6 m
      boven een aangrenzende vloer of boven het aansluitende terrein of water.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel360
  - number: '360.4'
    text: |-
      In een afscheiding als bedoeld in het eerste en tweede lid, mogen geen verticale openingen aanwezig zijn die breder
      zijn dan 0,5 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel360
  - number: '361'
    text: |-
      Een hoogteverschil van meer dan 0,21 m tussen voor mensen toegankelijke vloeren dan wel tussen één van die vloeren
      en het aansluitende terrein, moet, opdat die vloeren op veilige wijze kunnen worden bereikt en verlaten, zijn
      overbrugd door een trap of hellingbaan.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel361
  - number: '362.1'
    text: De afmetingen van een trap als bedoeld in artikel 361, moeten ten minste voldoen aan kolom B van tabel II.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel362
  - number: '362.2'
    text: |-
      Onverminderd het eerste lid, mag de som van een aantrede en twee optreden, gemeten ter plaatse van de klimlijn, ten
      hoogste 0,7 m, doch niet minder dan 0,57 m zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel362
  - number: '362.3'
    text: |-
      Een trap als bedoeld in het eerste lid, moet ter plaatse van de bovenste trede over de ten minste vereiste breedte
      aansluiten op een vrije vloeroppervlakte van ten minste 1,1 m * 1,1 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel362
  - number: '362.4'
    text: |-
      Een trap als bedoeld in het eerste lid, waarvan de klimlijn een helling heeft die groter is dan 2:3, en waarmee een
      hoogteverschil van meer dan 0,6 m is overbrugd, moet aan beide zijkanten zijn voorzien van een leuning.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel362
  - number: '362.5'
    text: |-
      De bovenkant van een leuning als bedoeld in het vierde lid, moet zijn gelegen op een hoogte van ten minste 0,8 m en
      ten hoogste 1 m boven de voorkant van de tredevlakken van de trap.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel362
  - number: '363.1'
    text: |-
      Een hellingbaan als bedoeld in artikel 361, moet een breedte hebben van ten minste 1,1 m, mag geen grotere hoogte
      hebben dan 1 m en mag voorts geen grotere helling hebben dan:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel363
  - number: 363.1.a
    text: 1:12, indien het hoogteverschil niet groter is dan 0,25 m;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel363
  - number: 363.1.b
    text: 1:16, indien het hoogteverschil groter is dan 0,25 m, doch niet groter dan 0,5 m, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel363
  - number: 363.1.c
    text: 1:20, indien het hoogteverschil groter is dan 0,5 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel363
  - number: '363.2'
    text: |-
      Een hellingbaan als bedoeld in het eerste lid, moet aan de bovenzijde over de ten minste vereiste breedte
      aansluiten op een vrije vloeroppervlakte van ten minste 1,4 m * 1,4 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel363
  - number: '363.3'
    text: 'Een hellingbaan als bedoeld in het eerste lid, moet:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel363
  - number: 363.3.a
    text: |-
      tot een hoogte van minder dan 0,6 m aan beide zijkanten zijn voorzien van een afscheiding met een hoogte van ten
      minste 0,04 m boven de hellingbaan, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel363
  - number: 363.3.b
    text: |-
      vanaf een hoogte van 0,6 m aan beide zijkanten zijn voorzien van een afscheiding met een hoogte van ten minste 0,85
      m boven de hellingbaan.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel363
  - number: '363.4'
    text: |-
      Ten aanzien van een afscheiding als bedoeld in het derde lid, is artikel 360, vierde lid, van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel363
  - number: '364.1'
    text: |-
      Een voorziening voor elektriciteit moet, opdat op veilige wijze kan worden beschikt over energie, ten minste
      voldoen aan artikel 5, eerste lid, onderdeel 2, van de Model-aansluitvoorwaarden voor elektrische energie van de
      Vereniging van Exploitanten van Elektriciteitsbedrijven in Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel364
  - number: '364.2'
    text: |-
      Een voorziening voor noodstroom moet ten minste voldoen aan artikel 5, eerste lid, onderdeel 2, van de Model-
      aansluitvoorwaarden voor elektrische energie van de Vereniging van Exploitanten van Elektriciteitsbedrijven in
      Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel364
  - number: '365'
    text: |-
      Een bouwwerk, geen gebouw zijnde, moet, afhankelijk van zijn bestemming, zodanig kunstmatig kunnen worden verlicht
      dat op veilige wijze van dat bouwwerk gebruik kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel365
  - number: '366'
    text: |-
      Een voorziening voor gas moet, opdat op veilige wijze over energie kan worden beschikt, ten minste voldoen aan
      artikel 5, eerste lid, onderdeel 2, van de Model-aansluitvoorwaarden voor gas van de Vereniging van Exploitanten
      van Gasbedrijven in Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel366
  - number: '368.1'
    text: Een dak mag, bepaald overeenkomstig NEN 6063, niet brandgevaarlijk zijn.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel368
  - number: '368.2'
    text: |-
      Het eerste lid is niet van toepassing op het dak, voor zover dat dak is gelegen op een afstand van ten minste 15
      m van de perceelsgrens, mits het bouwwerk geen voor mensen toegankelijke vloer heeft die hoger is gelegen dan 5 m
      boven het aansluitende terrein, gemeten ter plaatse van de toegang van het bouwwerk.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel368
  - number: '368.3'
    text: |-
      In afwijking van het tweede lid, mag, indien het perceel waarop het bouwwerk is gelegen, grenst aan een openbare
      weg, openbaar water of openbaar groen, de afstand zijn aangehouden tot het hart van die weg, dat water of dat
      groen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel368
  - number: '369.1'
    text: |-
      Een constructie-onderdeel, met uitzondering van een dak, moet, ter beperking van ontwikkeling van brand,
      bepaald overeenkomstig NEN 6065, ten minste behoren tot klasse 4 van de in die norm bedoelde bijdrage tot
      brandvoortplanting, met dien verstande dat de naar een vluchtweg toegekeerde zijde van een constructie-onderdeel
      ten minste moet behoren tot klasse 2.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel369
  - number: '369.2'
    text: |-
      In afwijking van het eerste lid, moeten een vloer en een tredevlak, bepaald overeenkomstig NEN 1775, ten minste
      behoren tot klasse T3 van de in die norm bedoelde bijdrage tot brandvoortplanting, met dien verstande dat een vloer
      en een tredevlak waarover een vluchtweg voert, moeten behoren tot klasse T1.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel369
  - number: '369.3'
    text: |-
      In afwijking in zoverre van het eerste lid, moet de naar de buitenlucht toegekeerde zijde van een constructie-
      onderdeel van een bouwwerk dat een voor mensen toegankelijke vloer heeft, afhankelijk van de hoogte waarop die
      vloer is gelegen, tot een hoogte van ten minste 2,5 m boven het aansluitende terrein behoren tot klasse 1.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel369
  - number: '370.1'
    text: |-
      Een naar een tunnel of daarmee vergelijkbaar bouwwerk, geen gebouw zijnde, toegekeerde zijde van een constructie-
      onderdeel mag, ter beperking van rookproduktie, bepaald overeenkomstig NEN 6066, geen grotere rookdichtheid hebben
      dan 10 m-1.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel370
  - number: '370.2'
    text: |-
      In afwijking in zoverre van het eerste lid, mag, indien door een tunnel of een daarmee vergelijkbaar bouwwerk, geen
      gebouw zijnde, een vluchtweg voert, de rookdichtheid niet groter zijn dan:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel370
  - number: 370.2.a
    text: |-
      5,4 m-1, indien het constructie-onderdeel behoort tot klasse 1 van de bijdrage tot brandvoortplanting, bepaald
      overeenkomstig NEN 6065, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel370
  - number: 370.2.b
    text: |-
      2,2 m-1, indien het constructie-onderdeel behoort tot klasse 2 van de bijdrage tot brandvoortplanting, bepaald
      overeenkomstig NEN 6065.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel370
  - number: '370.3'
    text: |-
      Het tweede lid is niet van toepassing op een in dat lid bedoeld constructie-onderdeel, voor zover het een vloer of
      tredevlak van een trap is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel370
  - number: '370.4'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op ten hoogste 5% van de totale oppervlakte van de naar die
      ruimte toegekeerde zijden van de constructie-onderdelen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel370
  - number: '370.5'
    text: |-
      Het eerste tot en met derde lid zijn van overeenkomstige toepassing op de naar de weg toegekeerde zijde van een
      constructie-onderdeel van een voor het verkeer bestemd bouwwerk van enige omvang.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel370
  - number: '371'
    text: |-
      Een bouwwerk, geen gebouw zijnde, moet, afhankelijk van zijn bestemming en grootte, zodanig zijn ingericht dat
      gebruikers van het bouwwerk bij brand op doeltreffende en voldoende veilige wijze binnen redelijke tijd naar het
      aan het bouwwerk aansluitende terrein kunnen vluchten.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel371
  - number: '372'
    text: |-
      Een bouwwerk, geen gebouw zijnde, moet, afhankelijk van zijn bestemming en grootte, zodanig zijn ingericht dat
      gebruikers van dat bouwwerk bij brand binnen redelijke tijd door de brandweer kunnen worden gered.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel372
  - number: '373'
    text: |-
      Een bouwwerk, geen gebouw zijnde, moet, afhankelijk van zijn bestemming en grootte, zodanige voorzieningen hebben
      dat een brand binnen redelijke tijd kan worden geblust.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel373
  - number: '374.1'
    text: |-
      Indien niet is voldaan aan enig voorschrift, gegeven bij of krachtens de artikelen 359 tot en met 373, moet een
      bouwwerk, geen gebouw zijnde, een mate van veiligheid bieden die ten minste gelijk is aan de mate van veiligheid
      die is beoogd met het desbetreffende bij of krachtens die artikelen gegeven voorschrift.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel374
  - number: '374.2'
    text: |-
      Indien toepassing is gegeven aan het eerste lid en het desbetreffende voorschrift tevens valt te herleiden tot
      overwegingen van gezondheid, moeten die overwegingen daarbij in ten minste dezelfde mate in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel374
  - number: '377'
    text: |-
      Bij ministeriële regeling kunnen, ter beperking van de aanwezigheid in of bij een bouwwerk, geen gebouw zijnde, van
      een voor de gezondheid onaanvaardbare mate van vergiftige of hinderlijke stoffen of van ioniserende straling als
      bedoeld in [artikel 1, eerste lid, onderdeel ][ref1], voorschriften worden gegeven omtrent het in de constructie
      toepassen van materialen waaruit die stoffen kunnen vrijkomen of die straling kan ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel1
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel377
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '1'
  - number: '378'
    text: |-
      Een voorziening voor drinkwater moet, opdat over voor de menselijke consumptie en hygiëne geschikt water kan
      worden beschikt, ten minste voldoen aan artikel 5, eerste lid, onderdeel 2, van de Model-aansluitvoorwaarden voor
      drinkwater van de Vereniging van Exploitanten van Waterleidingbedrijven in Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel378
  - number: '379'
    text: |-
      Een voorziening voor warm water moet, opdat over voor de menselijke hygiëne geschikt warm water kan worden
      beschikt, ten minste voldoen aan artikel 5, eerste lid, onderdeel 2, van de Model-aansluitvoorwaarden voor
      drinkwater van de Vereniging van Exploitanten van Waterleidingbedrijven in Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel379
  - number: '380.1'
    text: |-
      Indien niet is voldaan aan enig voorschrift, gegeven bij of krachtens de artikelen 375 tot en met 379, moet een
      bouwwerk, geen gebouw zijnde, een mate van bescherming van de gezondheid bieden, die ten minste gelijk is aan de
      mate van bescherming die is beoogd met het desbetreffende bij of krachtens die artikelen gegeven voorschrift.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel380
  - number: '380.2'
    text: |-
      Indien toepassing is gegeven aan het eerste lid en het desbetreffende voorschrift tevens valt te herleiden tot
      overwegingen van veiligheid, moeten die overwegingen daarbij in ten minste dezelfde mate in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel380
  - number: '381.1'
    text: |-
      Een in NEN 6702 bedoelde uiterste grenstoestand van een bouwconstructie mag, opdat die constructie bestand is
      tegen de daarop werkende krachten, bij belastingscombinaties als aangegeven bij ministeriële regeling niet zijn
      overschreden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel381
  - number: '381.2'
    text: |-
      Het niet-overschrijden van een uiterste grenstoestand als bedoeld in het eerste lid, moet zijn bepaald
      overeenkomstig bij ministeriële regeling gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel381
  - number: '381.3'
    text: |-
      Onverminderd het eerste lid, mag, opdat een bouwwerk, geen gebouw zijnde, bij brand op veilige wijze kan worden
      verlaten, een uiterste grenstoestand van de in NEN 6702 bedoelde hoofddraagconstructie dan wel van een vloer of
      trap, waarover een vluchtmogelijkheid als bedoeld in artikel 392, voert, bij de overeenkomstig bij ministeriële
      regeling gegeven voorschriften in geval van brand aan te houden belastingscombinaties, gedurende de in die
      voorschriften voor die hoofddraagconstructie, vloer of trap aangegeven tijdsduur van de brandwerendheid met
      betrekking tot bezwijken, bepaald overeenkomstig NEN 6069, niet zijn overschreden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel381
  - number: '382.1'
    text: |-
      Een vloer moet, ter voorkoming van het van die vloer kunnen vallen, bij de randen zijn voorzien van een afscheiding
      waarvan de hoogte, gemeten vanaf de vloer, ten minste 0,9 m is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel382
  - number: '382.2'
    text: |-
      Het eerste lid is niet van toepassing op een vloer ter plaatse van de bovenste trede van een trap of ter plaatse
      van de bovenkant van een hellingbaan, op een laadvloer en op een vloer die niet hoger is gelegen dan 1 m boven een
      aangrenzende vloer of boven het aansluitende terrein of water.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel382
  - number: '383'
    text: |-
      Een hoogteverschil van meer dan 0,22 m tussen voor mensen toegankelijke vloeren dan wel tussen één van die vloeren
      en het aansluitende terrein, moet, opdat die vloeren op veilige wijze kunnen worden bereikt en verlaten, zijn
      overbrugd door een trap of hellingbaan.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel383
  - number: '384.1'
    text: De afmetingen van een trap als bedoeld in artikel 383, moeten ten minste voldoen aan tabel IV.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel384
  - number: '384.2'
    text: |-
      Een trap als bedoeld in het eerste lid, moet ter plaatse van de bovenste trede over de ten minste vereiste breedte
      aansluiten op een vrije vloeroppervlakte van ten minste 0,7 m * 0,7 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel384
  - number: '384.3'
    text: |-
      Een trap als bedoeld in het eerste lid, waarvan de klimlijn een helling heeft die groter is dan 2:3, en waarmee
      een hoogteverschil van meer dan 1 m is overbrugd, moet aan ten minste één zijkant zijn voorzien van een leuning
      waarvan de bovenkant zich bevindt op een hoogte van ten minste 0,6 m en ten hoogste 1 m boven de voorkant van de
      tredevlakken van de trap.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel384
  - number: '385.1'
    text: |-
      Een hellingbaan als bedoeld in artikel 383, moet een breedte van ten minste 0,7 m hebben en mag geen grotere
      helling hebben dan 1:10.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel385
  - number: '385.2'
    text: |-
      Een hellingbaan als bedoeld in het eerste lid, moet aan de bovenzijde over de ten minste vereiste breedte
      aansluiten op een vrije vloeroppervlakte van ten minste 0,7 m * 0,7 m.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel385
  - number: '386.1'
    text: |-
      Een voorziening voor elektriciteit moet, opdat op veilige wijze kan worden beschikt over energie, ten minste
      voldoen aan artikel 5, eerste lid, onderdeel 2, van de Model-aansluitvoorwaarden voor elektrische energie van de
      Vereniging van Exploitanten van Elektriciteitsbedrijven in Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel386
  - number: '386.2'
    text: |-
      Een voorziening voor noodstroom moet ten minste voldoen aan artikel 5, eerste lid, onderdeel 2, van de Model-
      aansluitvoorwaarden voor elektrische energie van de Vereniging van Exploitanten van Elektriciteitsbedrijven in
      Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel386
  - number: '387'
    text: |-
      Een bouwwerk, geen gebouw zijnde, moet, afhankelijk van zijn bestemming, zodanig kunstmatig kunnen worden verlicht
      dat op veilige wijze van dat bouwwerk gebruik kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel387
  - number: '388'
    text: |-
      Een voorziening voor gas moet, opdat op veilige wijze over energie kan worden beschikt, zijn aangesloten op
      het distributienet van gas en moet ten minste voldoen aan artikel 5, eerste lid, onderdeel 2, van de Model-
      aansluitvoorwaarden voor gas van de Vereniging van Exploitanten van Gasbedrijven in Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel388
  - number: '389'
    text: |-
      Een beweegbaar constructie-onderdeel dat zich in enige stand kan bevinden boven een voor motorvoertuigen
      openstaande weg moet, ter voorkoming van gevaar voor gebruikers van die weg, gemeten vanaf de onderzijde van dat
      onderdeel, hoger zijn gelegen dan 4,2 m boven die weg.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel389
  - number: '390.1'
    text: |-
      Een constructie-onderdeel, met uitzondering van een dak, moet, ter beperking van ontwikkeling van brand,
      bepaald overeenkomstig NEN 6065, ten minste behoren tot klasse 4 van de in die norm bedoelde bijdrage tot
      brandvoortplanting, met dien verstande dat de naar een vluchtweg toegekeerde zijde van een constructie-onderdeel
      ten minste moet behoren tot klasse 2.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel390
  - number: '390.2'
    text: |-
      In afwijking van het eerste lid, moeten een vloer en een tredevlak, bepaald overeenkomstig NEN 1775, ten minste
      behoren tot klasse T3 van de in die norm bedoelde bijdrage tot brandvoortplanting, met dien verstande dat een vloer
      en een tredevlak, waarover een vluchtweg voert, moeten behoren tot klasse T1.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel390
  - number: '390.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op ten hoogste 10% van de totale oppervlakte van de in die leden
      bedoelde constructie-onderdelen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel390
  - number: '391.1'
    text: |-
      Het naar de binnenzijde toegekeerde oppervlak van een constructie-onderdeel van een tunnel of daarmee vergelijkbaar
      bouwwerk, geen gebouw zijnde, mag, ter beperking van rookproduktie, bepaald overeenkomstig NEN 6066, geen grotere
      rookdichtheid hebben dan 10 m-1.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel391
  - number: '391.2'
    text: |-
      In afwijking in zoverre van het eerste lid, mag, indien door een tunnel of een daarmee vergelijkbaar bouwwerk een
      vluchtweg voert, de rookdichtheid niet groter zijn dan:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel391
  - number: 391.2.a
    text: |-
      5,4 m-1, indien het constructie-onderdeel behoort tot klasse 1 van de bijdrage tot brandvoortplanting, bepaald
      overeenkomstig NEN 6065, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel391
  - number: 391.2.b
    text: |-
      2,2 m-1, indien het constructie-onderdeel behoort tot klasse 2 van de bijdrage tot brandvoortplanting, bepaald
      overeenkomstig NEN 6065.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel391
  - number: '391.3'
    text: |-
      Het tweede lid is niet van toepassing op een in dat lid bedoeld constructie-onderdeel, voor zover het een vloer of
      tredevlak van een trap is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel391
  - number: '391.4'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op ten hoogste 10% van de totale oppervlakte van de naar die
      ruimte toegekeerde zijden van de constructie-onderdelen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel391
  - number: '391.5'
    text: |-
      Het eerste tot en met derde lid zijn van overeenkomstige toepassing op de naar de weg toegekeerde zijden van een
      constructie-onderdeel van een voor het verkeer bestemd bouwwerk van enige omvang.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel391
  - number: '392'
    text: |-
      Een bouwwerk, geen gebouw zijnde, moet, afhankelijk van zijn bestemming en grootte, zodanig zijn ingericht dat
      gebruikers van het bouwwerk bij brand op doeltreffende en voldoende veilige wijze binnen redelijke tijd naar het
      aan het bouwwerk aansluitende terrein kunnen vluchten.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel392
  - number: '393'
    text: |-
      Een bouwwerk, geen gebouw zijnde, moet, afhankelijk van zijn bestemming en grootte, zodanig zijn ingericht dat
      gebruikers van dat bouwwerk bij brand binnen redelijke tijd door de brandweer kunnen worden gered.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel393
  - number: '394'
    text: |-
      Een bouwwerk, geen gebouw zijnde, moet, afhankelijk van zijn bestemming en grootte, zodanige voorzieningen hebben
      dat een brand binnen redelijke tijd kan worden geblust.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel394
  - number: '395.1'
    text: |-
      Indien niet is voldaan aan enig voorschrift, gegeven bij of krachtens de artikelen 381 tot en met 394, moet een
      bouwwerk, geen gebouw zijnde, een mate van veiligheid bieden die ten minste gelijk is aan de mate van veiligheid
      die is beoogd met het desbetreffende bij of krachtens die artikelen gegeven voorschrift.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel395
  - number: '395.2'
    text: |-
      Indien toepassing is gegeven aan het eerste lid en het desbetreffende voorschrift tevens valt te herleiden tot
      overwegingen van gezondheid, moeten die overwegingen daarbij in ten minste dezelfde mate in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel395
  - number: '396.1'
    text: |-
      Een bouwwerk, geen gebouw zijnde, dat een lozingstoestel als bedoeld in NEN 3215, heeft, moet, ter voorkoming van
      een voor de gezondheid onaanvaardbare situatie, een voorziening hebben voor de afvoer van afvalwater en faecaliën,
      die is aangesloten op het openbaar riool.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel396
  - number: '396.2'
    text: |-
      De voorziening voor afvalwater en faecaliën moet ten minste een aansluitpunt hebben ter plaatse van een
      lozingstoestel als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel396
  - number: '396.3'
    text: |-
      De voorziening voor afvalwater en faecaliën moet een zodanige capaciteit hebben dat elk op die voorziening
      aangesloten lozingstoestel als bedoeld in het eerste lid, binnen 5 minuten is geleegd en moet lucht- en waterdicht
      zijn. Ten aanzien van de bepaling van de lucht- en waterdichtheid is NEN 3215 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel396
  - number: '397'
    text: |-
      Een tunnel of een daarmee vergelijkbaar bouwwerk, geen gebouw zijnde, moet, afhankelijk van zijn bestemming en
      grootte, zodanig zijn geventileerd dat geen gevaar ontstaat voor de gezondheid van de gebruikers van dat bouwwerk.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel397
  - number: '398'
    text: |-
      Een voorziening voor drinkwater moet, opdat over voor de menselijke consumptie en hygiëne geschikt water kan
      worden beschikt, ten minste voldoen aan artikel 5, eerste lid, onderdeel 2, van de Model-aansluitvoorwaarden voor
      drinkwater van de Vereniging van Exploitanten van Waterleidingbedrijven in Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel398
  - number: '399'
    text: |-
      Een voorziening voor warm water moet, opdat over voor de menselijke hygiëne geschikt warm water kan worden
      beschikt, ten minste voldoen aan artikel 5, eerste lid, onderdeel 2, van de Model-aansluitvoorwaarden voor
      drinkwater van de Vereniging van Exploitanten van Waterleidingbedrijven in Nederland.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel399
  - number: '400.1'
    text: |-
      Indien niet is voldaan aan enig voorschrift, gegeven bij of krachtens de artikelen 396 tot en met 399, moet een
      bouwwerk, geen gebouw zijnde, een mate van bescherming van de gezondheid bieden, die ten minste gelijk is aan de
      mate van bescherming die is beoogd met het desbetreffende bij of krachtens die artikelen gegeven voorschrift.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel400
  - number: '400.2'
    text: |-
      Indien toepassing is gegeven aan het eerste lid en het desbetreffende voorschrift tevens valt te herleiden tot
      overwegingen van veiligheid, moeten die overwegingen daarbij in ten minste dezelfde mate in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel400
  - number: '401.1'
    text: |-
      Indien een in dit besluit genoemde NEN wordt vervangen door een NEN-EN als bedoeld in artikel 4, eerste lid, van de
      richtlijn bouwprodukten, treedt die NEN-EN in de plaats van die NEN.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel401
  - number: '401.2'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de toepassing van een in het eerste lid
      bedoelde NEN-EN, waarbij, voor zover nodig, kan worden afgeweken van een bij of krachtens dit besluit gegeven
      voorschrift.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel401
  - number: '402.1'
    text: |-
      Een bouwprodukt dat zodanige eigenschappen bezit dat het bouwwerk waarin het is verwerkt, gemonteerd, toegepast of
      geïnstalleerd, kan voldoen aan de in artikel 3 van de richtlijn bouwprodukten bedoelde fundamentele voorschriften
      en dat is voorzien van een op dat produkt betrekking hebbende CE-markering als bedoeld in de richtlijn
      bouwprodukten, is een bouwprodukt waarvoor een kwaliteitsverklaring is afgegeven.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel402
  - number: '402.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een bouwprodukt als bedoeld in artikel 4, vijfde lid, van de
      richtlijn bouwprodukten.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel402
  - number: '403.1'
    text: |-
      Het is verboden een bouwprodukt in de handel te brengen dat niet zodanige eigenschappen bezit dat het bouwwerk
      waarin het is verwerkt, gemonteerd, toegepast of geïnstalleerd, kan voldoen aan de in artikel 3 van de richtlijn
      bouwprodukten bedoelde fundamentele voorschriften en dat niet tevens is voorzien van een op dat bouwprodukt
      betrekking hebbende CE-markering als bedoeld in de richtlijn bouwprodukten.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel403
  - number: '403.2'
    text: |-
      Het eerste lid is niet van toepassing op bouwprodukten als bedoeld in artikel 4, vijfde lid, van de richtlijn
      bouwprodukten en op bouwprodukten ten aanzien waarvan Onze Minister toepassing heeft gegeven aan artikel 6, tweede
      lid, van de richtlijn bouwprodukten.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel403
  - number: '403.3'
    text: |-
      Het verbod, bedoeld in het eerste lid, geldt eerst nadat voor dat produkt overeenkomstig de richtlijn bouwprodukten
      is vastgesteld dat het bouwprodukt de CE-markering moet dragen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel403
  - number: '403.4'
    text: Overtreding van het verbod, bedoeld in het eerste lid, is een strafbaar feit.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel403
  - number: '404.1'
    text: |-
      Het is verboden een bouwprodukt, een aan dat produkt bevestigd label, de verpakking van een bouwprodukt of de
      begeleidende handelsdocumenten te voorzien van een markering die gelijkenis vertoont met de CE-markering, bedoeld
      in artikel 4, zesde lid, van de richtlijn bouwprodukten, waardoor verwarring kan ontstaan.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel404
  - number: '404.2'
    text: Overtreding van het verbod, bedoeld in het eerste lid, is een strafbaar feit.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel404
  - number: '405'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent hetgeen met het oog op de implementatie van
      de richtlijn bouwprodukten overigens regeling behoeft.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel405
  - number: '406.1'
    text: |-
      Burgemeester en wethouders kunnen bij het geheel of gedeeltelijk vernieuwen of veranderen of het vergroten
      van een woning of woongebouw vrijstelling verlenen van een voorschrift van hoofdstuk II tot het niveau van het
      desbetreffende voorschrift van hoofdstuk III.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel406
  - number: '406.2'
    text: |-
      In afwijking in zoverre van het eerste lid, kunnen burgemeester en wethouders bij het gedeeltelijk vernieuwen,
      veranderen of het vergroten vrijstelling verlenen van:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel406
  - number: 406.2.a
    text: artikel 22, tot een waarde die ten hoogste 10 dB(A) lager is;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel406
  - number: 406.2.b
    text: artikel 23, tot een waarde die ten hoogste 10 dB(A) hoger is;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel406
  - number: 406.2.c
    text: artikel 24, tot een waarde die ten hoogste 10 dB lager is, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel406
  - number: 406.2.d
    text: |-
      artikel 70, eerste lid, tot ten hoogste 1,3 m2K/W. Voor ramen, deuren, kozijnen en daarmee gelijk te stellen
      constructie-onderdelen geldt geen eis.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel406
  - number: '406.3'
    text: |-
      In afwijking van het eerste lid en het tweede lid, onderdeel a, verlenen burgemeester en wethouders bij het
      gedeeltelijk vernieuwen of veranderen of het vergroten van een woning, gelegen in de Ke-geluidszone rondom een
      luchtvaartterrein, voor een verblijfsruimte vrijstelling van de karakteristieke geluidwering van de uitwendige
      scheidingsconstructie, bedoeld in artikel 22, achtste lid, tot een waarde van de geluidwering die, afhankelijk
      van de geluidsbelasting in Ke, gegeven in de eerste kolom van tabel IX, gelijk is aan de waarde, genoemd bij die
      geluidsbelasting in de tweede kolom van die tabel; **Tabel IX. Geluidwering in geval van luchtvaartgeluid**






                    Geluidsbelasting in Ke


                    Vereiste waarde van de geluidwering in dB(A)






                    40 tot en met 50


                    30 tot 35




                    meer dan 50 tot en met 55


                    35 tot 40




                    meer dan 55


                    40




           indien de geluidsbelasting ligt tussen de Ke-waarden, gegeven in de eerste kolom, wordt de te bereiken waarde
      van de geluidwering bepaald door middel van rechtevenredige interpolatie tussen de dB(A)-waarden, gegeven in de
      tweede kolom.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel406
  - number: '406.4'
    text: |-
      In afwijking van het eerste lid en het tweede lid, onderdeel a, verlenen burgemeester en wethouders bij het
      gedeeltelijk vernieuwen of veranderen of het vergroten van een woning, gelegen in de L-geluidszone voor structureel
      uitgevoerd nachtelijk vliegverkeer rondom een luchtvaartterrein, voor een verblijfsruimte vrijstelling van de
      karakteristieke geluidwering van de uitwendige scheidingsconstructie, bedoeld in artikel 22, achtste lid, tot een
      waarde van de geluidwering van L 30 dB(A).
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel406
  - number: '406.5'
    text: |-
      Onverminderd het tweede tot en met het vierde lid, kunnen burgemeester en wethouders, indien in hoofdstuk III geen
      voorschrift is gegeven, bij het geheel of gedeeltelijk vernieuwen of veranderen of het vergroten van een woning of
      woongebouw vrijstelling verlenen van een voorschrift van hoofdstuk II tot het rechtens verkregen niveau.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel406
  - number: '406.6'
    text: |-
      Het eerste en het vijfde lid zijn niet van toepassing op de artikelen 11, tweede tot en met vierde lid, 12, tweede
      tot en met vierde, en zevende tot en met negende lid, 13, vijfde lid, 14, elfde lid, 18, vijfde tot en met zevende
      lid, 32, zesde tot en met elfde lid, 33 en 34.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel406
  - number: '406.7'
    text: |-
      Burgemeester en wethouders verlenen bij het geheel vernieuwen van een woning of woongebouw geen vrijstelling van de
      artikelen 22, derde tot en met vijfde lid, 41, 42, 43 en 70 tot en met 71a.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel406
  - number: '407.1'
    text: |-
      Burgemeester en wethouders kunnen bij het geheel of gedeeltelijk vernieuwen of veranderen van een woonwagen of
      standplaats vrijstelling verlenen van een voorschrift van hoofdstuk IV tot het niveau van het desbetreffende
      voorschrift van hoofdstuk V.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel407
  - number: '407.2'
    text: 'In afwijking in zoverre van het eerste lid, kunnen burgemeester en wethouders vrijstelling verlenen van:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel407
  - number: 407.2.a
    text: artikel 120, tot ten hoogste 10 dB(A), en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel407
  - number: 407.2.b
    text: |-
      artikel 150, wat de warmteweerstand betreft, tot ten hoogste 1 m 2K/W, en, wat de thermische isolatie-index
      betreft, tot ten hoogste 4.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel407
  - number: '407.3'
    text: |-
      Onverminderd het tweede lid, kunnen burgemeester en wethouders, indien in hoofdstuk V geen voorschrift is gegeven,
      bij het geheel of gedeeltelijk vernieuwen of veranderen van een woonwagen of standplaats vrijstelling verlenen van
      een voorschrift van hoofdstuk IV tot het rechtens verkregen niveau.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel407
  - number: '407.4'
    text: |-
      Het eerste en derde lid zijn niet van toepassing op de artikelen 115, 116, tweede en vierde lid, 118, 126, vijfde
      en zesde lid, 127 en 128.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel407
  - number: '407.5'
    text: Bij het verplaatsen van een woonwagen zijn de in hoofdstuk V gegeven voorschriften ten minste in acht genomen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel407
  - number: '408.1'
    text: |-
      Burgemeester en wethouders kunnen bij het geheel of gedeeltelijk vernieuwen of veranderen of het vergroten van een
      niet tot bewoning bestemd gebouw vrijstelling verlenen van een voorschrift van hoofdstuk VI tot het niveau van het
      desbetreffende voorschrift van hoofdstuk VIII.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel408
  - number: '408.2'
    text: |-
      In afwijking in zoverre van het eerste lid, kunnen burgemeester en wethouders bij het gedeeltelijk vernieuwen,
      veranderen of het vergroten vrijstelling verlenen van:
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel408
  - number: 408.2.a
    text: artikel 194, tot een waarde die ten hoogste 10 dB(A) lager is;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel408
  - number: 408.2.b
    text: artikel 195, tot een waarde die ten hoogste 10 dB(A) hoger is;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel408
  - number: 408.2.c
    text: artikel 196, tot een waarde die ten hoogste 10 dB lager is, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel408
  - number: 408.2.d
    text: |-
      artikel 227, eerste lid, tot ten hoogste 1,3 m2•K/W. Voor ramen, deuren, kozijnen en daarmee gelijk te stellen
      constructie-onderdelen geldt geen eis.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel408
  - number: '408.3'
    text: |-
      In afwijking van het eerste lid en het tweede lid, onderdeel a, verlenen burgemeester en wethouders bij het
      gedeeltelijk vernieuwen of veranderen of het vergroten van een niet tot bewoning bestemd gebouw of een gedeelte
      daarvan, gelegen in de Ke-geluidszone rondom een luchtvaartterrein, voor een verblijfsruimte vrijstelling van de
      karakteristieke geluidwering van de uitwendige scheidingsconstructie, bedoeld in artikel 194, achtste lid, tot een
      waarde van de geluidwering die, afhankelijk van de geluidsbelasting in Ke, gegeven in de eerste kolom van tabel IX,
      gelijk is aan de waarde, genoemd bij die geluidsbelasting in de tweede kolom van die tabel.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel408
  - number: '408.4'
    text: |-
      In afwijking van het eerste lid en het tweede lid, onderdeel a, verlenen burgemeester en wethouders bij het
      gedeeltelijk vernieuwen of veranderen of het vergroten van een gezondheidszorggebouw of een gedeelte daarvan,
      mede bestemd voor nachtverblijf van patiënten die door hun lichamelijke of geestelijke gesteldheid permanent of
      tijdelijk aan bed gebonden zijn, gelegen in de L-geluidszone voor structureel uitgevoerd nachtelijk vliegverkeer
      rondom een luchtvaartterrein, voor een verblijfsruimte vrijstelling van de karakteristieke geluidwering van de
      uitwendige scheidingsconstructie, bedoeld in artikel 194, achtste lid, tot een waarde van de geluidwering van L
      30 dB(A).
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel408
  - number: '408.5'
    text: |-
      Onverminderd het tweede tot en met het vierde lid, kunnen burgemeester en wethouders, indien in hoofdstuk VIII
      geen voorschrift is gegeven, bij het geheel of gedeeltelijk vernieuwen of veranderen of het vergroten van een niet
      tot bewoning bestemd gebouw vrijstelling verlenen van een voorschrift van hoofdstuk VI tot het rechtens verkregen
      niveau.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel408
  - number: '408.6'
    text: |-
      Het eerste en het vijfde lid zijn niet van toepassing op de artikelen 180, 183, tweede tot en met vierde lid,
      184, tweede tot en met vierde, en zevende tot en met negende lid, 185, tweede en derde lid, 203, vierde tot en met
      negende lid, 204 en 205.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel408
  - number: '408.7'
    text: |-
      Burgemeester en wethouders verlenen bij het geheel vernieuwen van een niet tot bewoning bestemd gebouw geen
      vrijstelling van de artikelen 194, tweede tot en met vijfde lid, 195, 196, 227 tot en met 228a.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel408
  - number: '409.1'
    text: |-
      Burgemeester en wethouders kunnen bij het geheel of gedeeltelijk vernieuwen of veranderen of het vergroten van
      een kantoorgebouw vrijstelling verlenen van een voorschrift van hoofdstuk VII, titel I, tot het niveau van het
      desbetreffende voorschrift van hoofdstuk IX, titel I.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel409
  - number: '409.2'
    text: |-
      In afwijking in zoverre van het eerste lid, kunnen burgemeester en wethouders vrijstelling verlenen van artikel
      241, tot een waarde die ten hoogste 10 dB(A) lager is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel409
  - number: '409.3'
    text: |-
      Onverminderd het tweede lid, kunnen burgemeester en wethouders, indien in hoofdstuk IX, titel I, geen voorschrift
      is gegeven, bij het geheel of gedeeltelijk vernieuwen of veranderen of het vergroten van een kantoorgebouw
      vrijstelling verlenen van een voorschrift van hoofdstuk VII, titel I, tot het rechtens verkregen niveau.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel409
  - number: '409.4'
    text: |-
      Het eerste en derde lid zijn niet van toepassing op de artikelen 230, 231, vierde lid, 234, tiende lid en 238,
      vijfde tot en met zevende lid.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel409
  - number: '409.5'
    text: |-
      Burgemeester en wethouders verlenen geen vrijstelling van artikel 251*b* bij het geheel vernieuwen of veranderen
      van een kantoorgebouw.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel409
  - number: '410.1'
    text: |-
      Burgemeester en wethouders kunnen bij het geheel of gedeeltelijk vernieuwen of veranderen of vergroten van een
      logiesverblijf of logiesgebouw vrijstelling verlenen van een voorschrift van hoofdstuk VII, titel II, tot het
      niveau van het desbetreffende voorschrift van hoofdstuk IX, titel II.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel410
  - number: '410.2'
    text: 'In afwijking in zoverre van het eerste lid, kunnen burgemeester en wethouders vrijstelling verlenen van:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel410
  - number: 410.2.a
    text: artikel 266, tot een waarde die ten hoogste 10 dB(A) hoger is, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel410
  - number: 410.2.b
    text: artikel 267, tot een waarde die ten hoogste 10 dB lager is.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel410
  - number: '410.3'
    text: |-
      Onverminderd het tweede lid, kunnen burgemeester en wethouders, indien in hoofdstuk IX, titel II, geen voorschrift
      is gegeven, bij het geheel of gedeeltelijk vernieuwen of veranderen van een logiesverblijf of logiesgebouw
      vrijstelling verlenen van een voorschrift van hoofdstuk VII, titel II, tot het rechtens verkregen niveau.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel410
  - number: '410.4'
    text: |-
      Het eerste en derde lid zijn niet van toepassing op de artikelen 255, 256, vierde lid, 259, achtste lid en 263,
      vijfde tot en met zevende lid.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel410
  - number: '410.5'
    text: |-
      Burgemeester en wethouders verlenen geen vrijstelling van artikel 288*a* bij het geheel vernieuwen of veranderen
      van een niet in een logiesgebouw gelegen verwarmd logiesverblijf of een logiesgebouw.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel410
  - number: '411.1'
    text: |-
      Burgemeester en wethouders kunnen bij het geheel of gedeeltelijk vernieuwen of veranderen of het vergroten van
      een bouwwerk, geen gebouw zijnde, vrijstelling verlenen van een voorschrift van hoofdstuk X tot het niveau van het
      desbetreffende voorschrift van hoofdstuk XI.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel411
  - number: '411.2'
    text: |-
      Indien in hoofdstuk XI geen voorschrift is gegeven, kunnen burgemeester en wethouders bij het geheel of
      gedeeltelijk vernieuwen of veranderen of het vergroten van een bouwwerk, geen gebouw zijnde, vrijstelling verlenen
      van een voorschrift van hoofdstuk X tot het rechtens verkregen niveau.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel411
  - number: '411.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op de artikelen 365, 367, tweede tot en met vierde lid, 368,
      eerste lid, 369, derde lid en 377.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel411
  - number: '412'
    text: |-
      Indien voor het geheel of gedeeltelijk vernieuwen of veranderen of het vergroten van een monument als bedoeld
      in de [Monumentenwet 1988][ref1] (*Stb.* 638) of in een provinciale of gemeentelijke monumentenverordening,
      een vergunning ingevolge die wet of verordening is verleend, doch de bouwvergunning als bedoeld in
      [artikel 40, eerste lid, van de Woningwet][ref2], niet kan worden verleend tenzij burgemeester en wethouders
      vrijstelling verlenen van enig voorschrift van dit besluit, verlenen burgemeester en wethouders die vrijstelling
      tot het in eerstbedoelde vergunning aangegeven niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0004471
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel40
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel412
    references:
      - id: ref1
        bwb_id: BWBR0004471
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '40'
  - number: '413.1'
    text: |-
      Indien ingevolge dit besluit voor een gebouw of een gedeelte van dat gebouw een eis is gesteld en het gebouw of het
      gedeelte van dat gebouw deel uitmaakt van een ander gebouw waarvoor tegelijkertijd ingevolge dit besluit een andere
      eis is gesteld, geldt de zwaarste van de ingevolge dit besluit gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel413
  - number: '413.2'
    text: |-
      In afwijking van het eerste lid en in afwijking in zoverre van de artikelen 71*a*, 228*a*, 251*b* en 288*a*, is,
      indien ingevolge dit besluit voor een gebouw een energieprestatiecoëfficiënt geldt en dat gebouw deel uitmaakt
      van een gebouw, waarin een ander gebouw is gelegen waarvoor een afzonderlijke energieprestatiecoëfficiënt geldt,
      het quotiënt van het in NEN 2916 bedoelde karakteristieke energiegebruik en de in die norm bedoelde toelaatbare
      karakteristieke energieprestatie niet groter dan 1.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel413
  - number: '414.1'
    text: 'Bij het bouwen van een woonkeet zijn ten minste in acht genomen:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel414
  - number: 414.1.a
    text: de voorschriften van hoofdstuk III;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel414
  - number: 414.1.b
    text: |-
      de artikelen 11, tweede tot en met vierde lid, 12, tweede tot en met vijfde en zevende tot en met negende lid, 13,
      vijfde en zesde lid, 14, eerste, tweede, zesde, achtste, negende en elfde lid, zij het dat voor de weerstand tegen
      branddoorslag en brandoverslag telkens 30 minuten mag zijn aangehouden, 15, 16, tweede tot en met zevende lid, 17,
      18, 32, zesde tot en met elfde lid, 33 en 34, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel414
  - number: 414.1.c
    text: de in artikel 406, tweede lid, onderdelen *a* tot en met *d*, gegeven waarden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel414
  - number: '414.2'
    text: Op de staat van een bestaande woonkeet zijn de voorschriften van hoofdstuk III van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel414
  - number: '414.3'
    text: |-
      In afwijking van het eerste lid, kunnen burgemeester en wethouders bij het gedeeltelijk vernieuwen, veranderen
      of het vergroten van een woonkeet vrijstelling verlenen van de voorschriften van dat lid tot het niveau van de
      voorschriften van hoofdstuk III.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel414
  - number: '414.4'
    text: Bij het verplaatsen van een woonkeet zijn de voorschriften van hoofdstuk III ten minste in acht genomen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel414
  - number: 414a.1
    text: 'Bij het bouwen van een niet-permanent niet tot bewoning bestemd gebouw zijn ten minste in acht genomen:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel414a
  - number: 414a.1.a
    text: de voorschriften van hoofdstuk VIII;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel414a
  - number: 414a.1.b
    text: |-
      de artikelen 180, 183, tweede tot en met vierde lid, 184, tweede tot en met vijfde en zevende tot en met negende
      lid, 185, tweede en derde lid, 203, vierde tot en met negende lid, 204 en 205, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel414a
  - number: 414a.1.c
    text: de in artikel 408, tweede lid, onderdelen *a* tot en met *d*, gegeven waarden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel414a
  - number: 414a.2
    text: |-
      De staat van een bestaand niet-permanent niet tot bewoning bestemd gebouw voldoet ten minste aan de voorschriften
      van hoofdstuk VIII.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel414a
  - number: 414a.3
    text: |-
      In afwijking van het eerste lid, kunnen burgemeester en wethouders bij het gedeeltelijk vernieuwen, veranderen of
      het vergroten van een niet-permanent niet tot bewoning bestemd gebouw vrijstelling verlenen van de voorschriften
      van dat lid tot het niveau van de voorschriften van hoofdstuk VIII.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel414a
  - number: 414a.4
    text: |-
      Bij het verplaatsen van een niet-permanent niet tot bewoning bestemd gebouw zijn de voorschriften van hoofdstuk
      VIII ten minste in acht genomen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel414a
  - number: 414b.1
    text: 'Bij het bouwen van een niet-permanent kantoorgebouw zijn ten minste in acht genomen:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel414b
  - number: 414b.1.a
    text: de voorschriften van hoofdstuk IX, titel I;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel414b
  - number: 414b.1.b
    text: |-
      de artikelen 230, 231, vierde en vijfde lid, 232, zij het dat telkens voor de weerstand tegen branddoorslag en
      brandoverslag 30 minuten mag zijn aangehouden, 233, 234 en 235 tot en met 238, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel414b
  - number: 414b.1.c
    text: de in artikel 409, tweede lid, gegeven waarden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel414b
  - number: 414b.2
    text: |-
      De staat van een bestaand niet-permanent kantoorgebouw voldoet ten minste aan de voorschriften van hoofdstuk IX,
      titel I.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel414b
  - number: 414b.3
    text: |-
      In afwijking van het eerste lid, kunnen burgemeester en wethouders bij het gedeeltelijk vernieuwen, veranderen of
      het vergroten van een niet-permanent kantoorgebouw vrijstelling verlenen van de voorschriften van dat lid tot het
      niveau van de voorschriften van hoofdstuk IX, titel I.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel414b
  - number: 414b.4
    text: |-
      Bij het verplaatsen van een niet-permanent kantoorgebouw zijn de voorschriften van hoofdstuk IX, titel I, ten
      minste in acht genomen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel414b
  - number: 414c.1
    text: 'Bij het bouwen van een niet-permanent logiesverblijf of logiesgebouw zijn ten minste in acht genomen:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel414c
  - number: 414c.1.a
    text: de voorschriften van hoofdstuk IX, titel II;
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel414c
  - number: 414c.1.b
    text: |-
      de artikelen 255, 256, vierde en vijfde lid, 257, zij het dat telkens voor de weerstand tegen branddoorslag en
      brandoverslag 30 minuten mag zijn aangehouden, 258, 259 en 260 tot en met 263, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel414c
  - number: 414c.1.c
    text: de in artikel 410, tweede lid, onderdelen *a* en *b*, gegeven waarden.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel414c
  - number: 414c.2
    text: |-
      De staat van een bestaand niet-permanent logiesverblijf of logiesgebouw voldoet ten minste aan de voorschriften van
      hoofdstuk IX, titel II.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel414c
  - number: 414c.3
    text: |-
      In afwijking van het eerste lid, kunnen burgemeester en wethouders bij het gedeeltelijk vernieuwen, veranderen of
      het vergroten van een niet-permanent logiesverblijf of logiesgebouw vrijstelling verlenen van de voorschriften van
      dat lid tot het niveau van de voorschriften van hoofdstuk IX, titel II.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel414c
  - number: 414c.4
    text: |-
      Bij het verplaatsen van een niet-permanent logiesverblijf of logiesgebouw zijn de voorschriften van hoofdstuk IX,
      titel II, ten minste in acht genomen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel414c
  - number: 414d.1
    text: 'Bij het bouwen van een niet-permanent bouwwerk, geen gebouw zijnde, zijn ten minste in acht genomen:'
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel414d
  - number: 414d.1.a
    text: de voorschriften van hoofdstuk XI, en
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel414d
  - number: 414d.1.b
    text: de artikelen 365, 367, tweede tot en met vierde lid, 368, eerste lid, 369, derde lid, en 377.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel414d
  - number: 414d.2
    text: |-
      De staat van een bestaand niet-permanent bouwwerk, geen gebouw zijnde, voldoet ten minste aan de voorschriften van
      hoofdstuk XI.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel414d
  - number: 414d.3
    text: |-
      In afwijking van het eerste lid, kunnen burgemeester en wethouders bij het gedeeltelijk vernieuwen, veranderen of
      het vergroten van een niet-permanent bouwwerk, geen gebouw zijnde, vrijstelling verlenen van de voorschriften van
      dat lid tot het niveau van de voorschriften van hoofdstuk XI.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel414d
  - number: 414d.4
    text: |-
      Bij het verplaatsen van een niet-permanent bouwwerk, geen gebouw zijnde, zijn de voorschriften van hoofdstuk XI ten
      minste in acht genomen.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel414d
  - number: '415'
    text: |-
      Indien bij of krachtens dit besluit een eis is gesteld ten aanzien van een bouwmateriaal of bouwdeel en voor dat
      bouwmateriaal of bouwdeel een op die eis toegesneden, door Onze Minister erkende kwaliteitsverklaring is afgegeven,
      is, mits dat bouwmateriaal of bouwdeel overeenkomstig die kwaliteitsverklaring is toegepast, aan de desbetreffende
      eis voldaan.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel415
  - number: '416'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van een in dit besluit
      genoemde NEN of aansluitvoorwaarde.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel416
  - number: '418'
    text: |-
      Het Woonketenbesluit (*Stb.* 1965, 328), het Besluit schuilplaatsen bij bouw van woningen 1968 (*Stb.* 391), het
      Besluit geluidwering gebouwen (*Stb.* 1982, 755) en het Besluit geluidwering kantoorgebouwen (*Stb.* 1989, 158)
      worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel418
  - number: '419.1'
    text: |-
      De artikelen van dit besluit, met uitzondering van artikel 417, treden in werking op een bij koninklijk besluit te
      bepalen tijdstip, dat voor de verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel419
  - number: '419.2'
    text: |-
      Artikel 417 treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin dit
      besluit wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel419
  - number: '420'
    text: Dit besluit kan worden aangehaald als Bouwbesluit.
    url: https://wetten.overheid.nl/BWBR0005321/2000-01-01#Artikel420
