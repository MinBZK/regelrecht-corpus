        artikel: '27'
  - number: 1.g
    text: |-
      AIVD: de Algemene Inlichtingen- en Veiligheidsdienst, bedoeld in
      [artikel 8, eerste lid, van de Wet op de inlichtingen- en veiligheidsdiensten 2017][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel8
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '8'
  - number: '2'
    text: |-
      Hetgeen in dit besluit wordt bepaald over de korpschef is van overeenkomstige toepassing op de werkgever van de
      ambtenaren bedoeld in [artikel 141, onderdelen b, c en d, van het Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '3.1'
    text: |-
      Opsporingsambtenaren als bedoeld in de [artikelen 141, onderdelen b tot en met d][ref1], en
      [142 van het Wetboek van Strafvordering][ref2] kunnen worden belast met de plaatsing, verwijdering en inzet van een
      technisch hulpmiddel voor observatie.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '142'
  - number: '3.2'
    text: |-
      Opsporingsambtenaren als bedoeld in [artikel 141, onderdelen b, c en d, van het Wetboek van Strafvordering][ref1]
      kunnen worden belast met de plaatsing, verwijdering en inzet van een technisch hulpmiddel voor het opnemen van
      vertrouwelijke communicatie en het opnemen van telecommunicatie.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '4.1'
    text: |-
      Met technische hulpmiddelen in dit besluit worden gelijkgesteld technische hulpmiddelen die rechtmatig zijn
      vervaardigd of in de handel zijn gebracht in een andere lidstaat van de Europese Unie dan wel rechtmatig zijn
      vervaardigd in een staat, niet zijnde een lid van de Europese Unie, die partij is bij een daartoe strekkend of mede
      daartoe strekkend Verdrag dat Nederland bindt, en die voldoen aan eisen die een beschermingsniveau bieden dat ten
      minste gelijkwaardig is aan het niveau dat met de nationale eisen wordt nagestreefd.
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel4
  - number: '4.2'
    text: |-
      Met een keuringsrapport als bedoeld in dit besluit wordt gelijkgesteld een verklaring van goedkeuring, afgegeven
      door een onafhankelijke keuringsinstelling in een andere lidstaat van de Europese Unie dan wel in een staat, niet
      zijnde een lid van de Europese Unie, die partij is bij een daartoe strekkend of mede daartoe strekkend Verdrag dat
      Nederland bindt, welke verklaring is afgegeven op basis van onderzoekingen die een beschermingsniveau bieden dat
      ten minste gelijkwaardig is aan het niveau dat met de nationale onderzoekingen wordt nagestreefd.
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel4
  - number: '5.1'
    text: |-
      Door of namens de korpschef, Onze Minister van Defensie of Onze Minister van Financiën wordt een plaats aangewezen
      voor de opslag van technische hulpmiddelen en wordt ervoor zorggedragen dat deze plaats beveiligd is en uitsluitend
      toegankelijk is voor of onder begeleiding van daartoe geautoriseerd personeel.
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel5
  - number: '5.2'
    text: |-
      Door of namens de korpschef, Onze Minister van Defensie of Onze Minister van Financiën worden één of meer terzake
      deskundige ambtenaren aangewezen, die belast zijn met de opslag van technische hulpmiddelen.
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel5
  - number: '6.1'
    text: |-
      De ambtenaar, bedoeld in [artikel 5, tweede lid][ref1], verstrekt, na ontvangst van een kopie van het daarop
      betrekking hebbende bevel, het voor de uitvoering daarvan benodigde technische hulpmiddel aan de met de uitvoering
      belaste ambtenaar. Indien het bevel mondeling is gegeven wordt, in afwijking van de eerste volzin, binnen drie
      dagen een kopie van het schriftelijke bevel overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020444#Artikel5
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020444
        artikel: '5'
        hoofdstuk: '2'
  - number: '6.2'
    text: |-
      De ambtenaar, bedoeld in [artikel 5, tweede lid][ref1], verstrekt, na ontvangst van een verzoek door of namens de
      korpschef voor verstrekking van technische hulpmiddelen voor oefendoeleinden het benodigde technische hulpmiddel
      aan de met de uitvoering belaste ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020444#Artikel5
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020444
        artikel: '5'
        hoofdstuk: '2'
  - number: '6.3'
    text: |-
      De ambtenaar, bedoeld in [artikel 5, tweede lid][ref1], registreert de verstrekking van het technische hulpmiddel.
      De registratie bevat ten minste de aanduiding van het technische hulpmiddel, het tijdstip van de verstrekking en de
      verwachte duur van de inzet van het hulpmiddel en de naam van de officier van justitie die het bevel heeft gegeven
      onderscheidenlijk de korpschef die het verzoek heeft ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0020444#Artikel5
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020444
        artikel: '5'
        hoofdstuk: '2'
  - number: '6.4'
    text: |-
      Het technische hulpmiddel wordt verstrekt voor de periode die nodig is voor de uitvoering van het bevel
      onderscheidenlijk de duur van de oefening.
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel6
  - number: '7.1'
    text: |-
      De plaatsing van het technische hulpmiddel geschiedt door een daartoe door of namens de korpschef aangewezen en
      terzake deskundige opsporingsambtenaar.
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel7
  - number: '7.2'
    text: |-
      Opsporingsambtenaren belast met het plaatsen van een technisch hulpmiddel voor het opnemen van vertrouwelijke
      communicatie in een woning of andere besloten plaats zijn in het bezit van een door Onze Minister aangewezen
      document.
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel7
  - number: '7.3'
    text: |-
      Opsporingsambtenaren belast met het plaatsen van een technisch hulpmiddel voor het opnemen van telecommunicatie
      zijn in het bezit van een door Onze Minister aangewezen document.
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel7
  - number: '7.4'
    text: De opsporingsambtenaar maakt van het plaatsen van het technische hulpmiddel proces-verbaal op.
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel7
  - number: '8'
    text: |-
      Voorafgaand aan en na afloop van de daadwerkelijke inzet van een technisch hulpmiddel controleert
      de met de uitvoering belaste opsporingsambtenaar of wordt voldaan aan de eisen, gesteld in de
      [artikelen 10 tot en met 14][ref1] en legt daarvan verantwoording af in het proces-verbaal als bedoeld in
      [artikel 7, vierde lid][ref2]. Indien bij de controle een technische afwijking, defect, verwijdering of
      verandering van de oorspronkelijke beveiliging of enige andere onregelmatigheid wordt geconstateerd, maakt de
      opsporingsambtenaar daarvan proces-verbaal op dat aan de officier van justitie wordt gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0020444#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0020444#Artikel7
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020444
        artikel: '10'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0020444
        artikel: '7'
        hoofdstuk: '2'
  - number: '9.1'
    text: |-
      De verwijdering van het technische hulpmiddel geschiedt door een daartoe door of namens de korpschef aangewezen en
      terzake deskundige opsporingsambtenaar.
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel9
  - number: '9.2'
    text: |-
      Na verwijdering van het technische hulpmiddel stelt de in het eerste lid bedoelde ambtenaar het technische
      hulpmiddel weer in handen van de ambtenaar, bedoeld in het [artikel 5, tweede lid][ref1]. Deze registreert
      de ontvangst van de technische hulpmiddelen. De registratie bevat ten minste de aanduiding van het technische
      hulpmiddel, van de staat waarin het verkeert en van het tijdstip van ontvangst.


      [ref1]: https://wetten.overheid.nl/BWBR0020444#Artikel5
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020444
        artikel: '5'
        hoofdstuk: '2'
  - number: '10'
    text: |-
      Het technische hulpmiddel legt de datum en tijd waarop de signalen worden gedetecteerd, automatisch en doorlopend
      op de gegevensdrager vast.
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel10
  - number: '11'
    text: |-
      Het technische hulpmiddel voor het opnemen van telecommunicatie neemt slechts de communicatie op die plaatsvindt
      met gebruikmaking van één of meer nummers van de individuele gebruiker of gebruikers, op wie het bevel tot het
      opnemen van de communicatie is gericht.
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel11
  - number: '12'
    text: |-
      Indien de opsporingsambtenaar niet voortdurend aanwezig is gedurende de inzet van het technische hulpmiddel wordt
      het technische hulpmiddel zodanig beveiligd dat technische veranderingen achteraf zo veel mogelijk zijn vast te
      stellen.
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel12
  - number: '13'
    text: |-
      Het transport van het signaal wordt dusdanig beveiligd dat manipulatie van de signalen wordt voorkomen of achteraf
      is vast te stellen.
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel13
  - number: '14.1'
    text: De inhoud van de gedetecteerde signalen is identiek aan de op de gegevensdrager opgeslagen signalen.
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel14
  - number: '14.2'
    text: De op een gegevensdrager opgeslagen signalen worden niet bewerkt.
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel14
  - number: '14.3'
    text: |-
      Bij de opslag van signalen worden maatregelen genomen om manipulatie van de opgeslagen signalen te voorkomen en om
      achteraf te kunnen vaststellen of niettemin manipulatie heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel14
  - number: '14.4'
    text: |-
      Indien het technische hulpmiddel mede bestaat uit een component die selecteert welke signalen worden opgeslagen,
      legt de opsporingsambtenaar vast welk selectiecriterium is gehanteerd.
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel14
  - number: '15.1'
    text: |-
      Indien dat voor de waarneming van de opgeslagen signalen noodzakelijk is, kan een kopie van de opgeslagen signalen
      technisch worden bewerkt.
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel15
  - number: '15.2'
    text: |-
      De in het eerste lid bedoelde bewerking wordt uitgevoerd door een daartoe door of namens de korpschef aangewezen
      en terzake deskundige ambtenaar. De officier van justitie kan bepalen dat een technische bewerking wordt uitgevoerd
      door een deskundige, niet zijnde een ambtenaar.
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel15
  - number: '15.3'
    text: Van de bewerking wordt een schriftelijk verslag opgemaakt, waarin het proces van bewerking wordt beschreven.
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel15
  - number: '16'
    text: |-
      Bevoegd tot het gebruik van de technische hulpmiddelen, waarmee overeenkomstig
      [artikel 3.22 van de Telecommunicatiewet][ref1] een gebruik van frequentieruimte wordt gemaakt dat afwijkt van het
      bepaalde bij of krachtens [hoofdstuk 3 van de Telecommunicatiewet][ref2], is de door de korpschef, Onze Minister
      van Defensie of Onze Minister van Financiën aangewezen opsporingsambtenaar die voldoet aan de door Onze Minister
      vastgestelde eisen betreffende kennis van de juridische, operationele en technische aspecten van het gebruik van de
      technische hulpmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0009950
        hoofdstuk: '3'
  - number: '17.1'
    text: |-
      Een technisch hulpmiddel voor observatie of het opnemen van telecommunicatie, waarmee overeenkomstig
      [artikel 3.22, eerste lid, van de Telecommunicatiewet][ref1] een gebruik van frequentieruimte wordt gemaakt dat
      afwijkt van het bepaalde bij of krachtens [hoofdstuk 3 van de Telecommunicatiewet][ref2], voldoet aan de volgende
      eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0009950
        hoofdstuk: '3'
  - number: 17.1.a
    text: |-
      het technische hulpmiddel veroorzaakt niet meer dan een plaatselijke, zeer geringe verandering van de
      functionaliteiten van het desbetreffende netwerk;
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel17
  - number: 17.1.b
    text: de apparatuur is voorzien van een inrichting waarmee het uitgezonden vermogen kan worden geregeld;
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel17
  - number: 17.1.c
    text: het technische hulpmiddel is geregistreerd bij Onze Minister van Economische Zaken, Landbouw en Innovatie.
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel17
  - number: '17.2'
    text: |-
      De opsporingsambtenaar registreert de data en de tijdstippen waarop en de plaatsen waar het technische hulpmiddel
      is gebruikt en de tijdens het gebruik van het technische hulpmiddel gehanteerde instellingen en vermogens van
      het technische hulpmiddel en doet mededeling van deze gegevens aan Onze Minister van Economische Zaken, Landbouw
      en Innovatie.
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel17
  - number: '18.1'
    text: |-
      Uit een keuringsrapport van het technische hulpmiddel als zodanig of van de componenten waaruit het is samengesteld
      blijkt dat een technisch hulpmiddel voor observatie of voor het opnemen van vertrouwelijke communicatie voldoet aan
      de in [artikelen 10][ref1], [12][ref2], [13][ref3] en [14][ref4] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0020444#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0020444#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0020444#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0020444#Artikel14
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020444
        artikel: '10'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0020444
        artikel: '12'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0020444
        artikel: '13'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0020444
        artikel: '14'
        hoofdstuk: '3'
  - number: '18.2'
    text: |-
      Uit een keuringsrapport van het technische hulpmiddel als zodanig blijkt dat een technisch hulpmiddel voor het
      opnemen van telecommunicatie voldoet aan de in [artikelen 10 tot en met 14][ref1] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0020444#Artikel10
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020444
        artikel: '10'
        hoofdstuk: '3'
  - number: '19.1'
    text: |-
      Indien het onderzoeksbelang dit dringend vordert, kan de officier van justitie bepalen dat een technisch hulpmiddel
      voor observatie of voor het opnemen van vertrouwelijke communicatie wordt ingezet, hoewel niet of niet geheel wordt
      voldaan aan [artikel 18, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020444#Artikel18
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0020444
        artikel: '18'
        hoofdstuk: '4'
  - number: '19.2'
    text: |-
      Het bevel van de officier van justitie vermeldt dat toepassing is gegeven aan het eerste lid en bevat een
      omschrijving van de aard en technische mogelijkheden van het technische hulpmiddel.
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel19
  - number: '19.3'
    text: |-
      Na afloop van de inzet wordt voor het technische hulpmiddel of de componenten waarvoor geen keuringsrapport is
      vastgesteld alsnog een keuringsrapport vastgesteld, tenzij de aard van het technische hulpmiddel of de betrokken
      componenten zich daartegen naar het oordeel van de officier van justitie verzet.
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel19
  - number: '20.1'
    text: |-
      Indien het onderzoeksbelang dit dringend vordert, kan de officier van justitie bepalen dat een technisch hulpmiddel
      voor observatie of voor het opnemen van vertrouwelijke communicatie, dat bij de AIVD in gebruik is, wordt ingezet
      hoewel niet of niet geheel wordt voldaan aan [artikel 18, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020444#Artikel18
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0020444
        artikel: '18'
        hoofdstuk: '4'
  - number: '20.2'
    text: |-
      De officier van justitie doet een schriftelijk verzoek aan het hoofd van de AIVD voor de inzet van het technische
      hulpmiddel.
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel20
  - number: '20.3'
    text: Het bevel van de officier van justitie vermeldt dat toepassing is gegeven aan het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel20
  - number: '21.1'
    text: |-
      Indien het technische hulpmiddel wordt ingezet ter uitvoering van een rechtshulpverzoek of ten behoeve van een
      gemeenschappelijk onderzoeksteam als bedoeld in [artikel 552qa van het Wetboek van Strafvordering][ref1] en het
      technische hulpmiddel in het buitenland door buitenlandse autoriteiten is geplaatst en op Nederlands grondgebied
      wordt ingezet, kan de officier van justitie bepalen dat een technisch hulpmiddel wordt ingezet hoewel niet of niet
      geheel wordt voldaan aan [artikel 18, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel552qa
      [ref2]: https://wetten.overheid.nl/BWBR0020444#Artikel18
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 552qa
      - id: ref2
        bwb_id: BWBR0020444
        artikel: '18'
        hoofdstuk: '4'
  - number: '21.2'
    text: Het bevel van de officier van justitie vermeldt dat toepassing is gegeven aan het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel21
  - number: '22.1'
    text: |-
      Onze Minister wijst een onderdeel van een landelijke eenheid als bedoeld in
      [artikel 25, eerste lid, onderdeel b, van de Politiewet 2012][ref1] aan als keuringsdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel25
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '25'
  - number: '22.2'
    text: Onze Minister kan één of meer andere organisaties aanwijzen als keuringsdienst.
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel22
  - number: '22.3'
    text: Onze Minister kan regels stellen bij de aanwijzing van een keuringsdienst.
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel22
  - number: '23.1'
    text: De keuringsdienst legt de wijze van keuring vast in een keuringsprotocol.
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel23
  - number: '23.2'
    text: Het keuringsprotocol behoeft voorafgaande goedkeuring door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel23
  - number: '24.1'
    text: |-
      Door of namens de korpschef kunnen technische hulpmiddelen en componenten voor de detectie, het transport en de
      opslag van signalen ter keuring worden aangeboden aan de keuringsdienst.
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel24
  - number: '24.2'
    text: |-
      De keuringsdienst maakt van de keuring een rapport op, waaruit blijkt in hoeverre de technische hulpmiddelen
      onderscheidenlijk de componenten voldoen aan de in de [artikelen 10 tot en met 14][ref1] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0020444#Artikel10
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0020444
        artikel: '10'
        hoofdstuk: '3'
  - number: '24.3'
    text: 'Het keuringsrapport vermeldt:'
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel24
  - number: 24.3.a
    text: het keuringsnummer;
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel24
  - number: 24.3.b
    text: een categoriale aanduiding;
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel24
  - number: 24.3.c
    text: de periode waarvoor de keuring geldt;
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel24
  - number: 24.3.d
    text: relevante informatie met betrekking tot de inzet als technisch hulpmiddel.
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel24
  - number: '25'
    text: |-
      De keuringsdienst van de landelijke eenheid, bedoeld in [artikel 22, eerste lid][ref1], houdt een centrale
      registratie bij van de keuringsrapporten.


      [ref1]: https://wetten.overheid.nl/BWBR0020444#Artikel22
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020444
        artikel: '22'
        hoofdstuk: '5'
  - number: '26'
    text: |-
      Een geldige verklaring van goedkeuring verleend op grond van het
      [Besluit technische hulpmiddelen bijzondere opsporingsbevoegdheden][ref1] wordt gelijkgesteld aan een
      keuringsrapport als bedoeld in [artikel 24][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010974
      [ref2]: https://wetten.overheid.nl/BWBR0020444#Artikel24
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0010974
      - id: ref2
        bwb_id: BWBR0020444
        artikel: '24'
        hoofdstuk: '5'
  - number: '27'
    text: |-
      Het [Besluit technische hulpmiddelen bijzondere opsporingsbevoegdheden][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0010974
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0010974
  - number: '28'
    text: Dit besluit treedt in werking op 1 januari 2007.
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel28
  - number: '29'
    text: 'Dit besluit wordt aangehaald als: Besluit technische hulpmiddelen strafvordering.'
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel29
