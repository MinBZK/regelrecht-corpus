  - number: 1.a
    text: |-
      technisch hulpmiddel: een technisch hulpmiddel als bedoeld in
      [artikel 126ee, onderdeel a, van het Wetboek van Strafvordering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel126ee
