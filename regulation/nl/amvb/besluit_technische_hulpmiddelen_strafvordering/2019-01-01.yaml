  - number: 1.f
    text: |-
      de korpschef: de korpschef, bedoeld in [artikel 27 van de Politiewet 2012][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel27
    url: https://wetten.overheid.nl/BWBR0020444/2019-01-01#Artikel1
    references:
