preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op voordracht van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur, gedaan in overeenstemming met de
    Staatssecretarissen van Economische Zaken en van Justitie en Onze Minister van Defensie van 16 september 1991;

    Gelet op artikel 1, tweede, derde en vierde lid, van de Wet tarieven gezondheidszorg (Stb. 1980, 646);

    De Raad van State gehoord (advies van 29 november 1991, W13.91.0491);

    Gezien het nader rapport van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur, uitgebracht in
    overeenstemming met de Staatssecretaris van Economische Zaken en Onze Minister van Defensie van 12 december 1991,
    nr VMP/O 91.693;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005342/2005-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Als organen voor gezondheidszorg worden aangewezen:

      A. de navolgende instellingen voor gezondheidszorg

      1. ziekenhuizen,

      2. academische ziekenhuizen,

      3. sanatoria,

      4. epilepsie-inrichtingen,

      5. kraaminrichtingen,

      6. dialysecentra,

      7. audiologische centra,

      8. beademingscentra,

      9. radiotherapeutische centra,

      10. instellingen voor zover deze zijn toegelaten op grond van
      [artikel 8 van de Algemene Wet Bijzondere Ziektekosten][ref1] dan wel zijn erkend op grond van
      [artikel 17 van de Tijdelijke Verstrekkingenwet maatschappelijke dienstverlening][ref2] om zorg
      te verlenen als bedoeld in de [artikelen 3][ref3], [4][ref4], [5][ref5], [6][ref6], [7][ref7]
      of [8 van het Besluit zorgaanspraken AWBZ][ref8],

      11.

      12.

      12a.

      13.

      14.

      15.

      16.

      16a. instellingen voor zover die prenatale zorg leveren als bedoeld in
      [artikel 16 van het Besluit zorgaanspraken AWBZ][ref9]

      16b. instellingen voor dieetadvisering,

      17. entadministraties als bedoeld in de [artikelen 17][ref10] en[18 van het Besluit zorgaanspraken AWBZ][ref11],

      18. kraamcentra,

      19. trombosediensten,

      20.

      21. vervoerders voor zover zij ambulancevervoer verrichten waarop de [wet Ambulancevervoer][ref12] van toepassing
      is,

      22. gezondheidscentra,

      23.

      24. instellingen voor jeugdtandverzorging,

      25. tandheelkundige centra als bedoeld in
      [artikel 7, vierde lid, van het Verstrekkingenbesluit ziekenfondsverzekering][ref13],

      26. abortusklinieken,

      27. huisartsenlaboratoria,

      28.

      28a. instellingen voor revalidatie,

      29. centra voor erfelijkheidsonderzoek,

      29a. zelfstandige behandelcentra die als zodanig een vergunning ingevolge het bepaalde bij of krachtens de
      [Wet ziekenhuisvoorzieningen][ref14] hebben verkregen,

      29b. instellingen, niet behorende tot de onder 1 tot en met 29a bedoelde categorieën en niet behorend tot de
      instellingen, bedoeld in de [artikelen 2 tot en met 4][ref15], in het kader waarvan prestaties worden geleverd door
      meerdere beroepsbeoefenaren als bedoeld onder B, onderdeel 5, welke met zelfstandige behandelcentra als bedoeld
      in 29a gelijk zijn te stellen, en die geen medisch-specialistische zorg verlenen als waarop bij of krachtens de
      [Ziekenfondswet][ref16] aanspraak bestaat, ongeacht de wijze waarop de kosten daarvan worden vergoed,

      29c huisartsendienstenstructuren, waaronder wordt verstaan: rechtspersoonlijkheid bezittende organisatorische
      verbanden van beroepsbeoefenaren als bedoeld onder B, onderdeel 1, welke verbanden enkel zijn aangegaan ten behoeve
      van de levering gedurende avond, nacht en weekend van door die beroepsbeoefenaren te leveren huisartsenzorg als
      waarop bij of krachtens de [Ziekenfondswet][ref17] aanspraak bestaat, ongeacht de wijze waarop de kosten daarvan
      worden vergoed, waarmee door een ziekenfonds een medewerkersovereenkomst als bedoeld in de [artikelen 44][ref18]
      en [45 van de Ziekenfondswet][ref19] is gesloten voor de levering enkel gedurende avond, nacht en weekend van
      huisartsenzorg als waarop bij of krachtens die wet aanspraak bestaat, waardoor een beroepsbeoefenaar met wie dat
      ziekenfonds voor de levering van huisartsenzorg een medewerkersovereenkomst heeft gesloten gedurende avond, nacht
      en weekend van de levering van die zorg is vrijgesteld zolang eerstbedoelde medewerkersovereenkomst geldt.

      30. instellingen niet behorende tot de onder 1 tot en met 29c bedoelde categorieën, voor zover de werkzaamheden
      daarvan zijn gericht op donatie of transplantatie van weefsel of organen,

      31. instellingen, niet behorende tot de onder 1 tot en met 30 bedoelde categorieën van instellingen, voor zover de
      werkzaamheden daarvan er op zijn gericht ten behoeve van laatstbedoelde instellingen een deel van de door hen te
      leveren prestaties te verrichten,

      32. instellingen, niet behorende tot de onder 1 tot en met 31 bedoelde categorieën en niet behorend tot de
      instellingen, bedoeld in de [artikelen 2][ref20] en [3][ref21], in het kader waarvan prestaties worden geleverd
      door beroepsbeoefenaren als bedoeld onder B of personen als bedoeld in [artikel 2][ref22] en waarvan de
      werkzaamheden uitsluitend of in hoofdzaak daarop zijn gericht,

      33. instellingen, niet behorende tot de onder 1 tot en met 32 bedoelde categorieën en niet behorend tot de
      instellingen, bedoeld in de [artikelen 2][ref23] en [3][ref24], voor zover er prestaties worden geleverd door
      beroepsbeoefenaren als bedoeld onder B of personen als bedoeld in [artikel 2][ref25].

      B. de navolgende personen die een medisch of paramedisch beroep uitoefenen:

      1. huisartsen,

      2. tandartsen,

      3. tandarts-specialisten voor mondziekten en kaakchirurgie,

      4. tandarts-specialisten in de dentomaxillaire orthopaedie,

      5. medisch specialisten, te onderscheiden naar categorieën van specialismen overeenkomstig het onderscheid
      zoals dat wordt gemaakt in het specialistenregister van de Koninklijke Nederlandse Maatschappij tot bevordering
      der Geneeskunst, zoals dat register luidt op het tijdstip van het goedkeuren of vaststellen van een tarief of
      maximumtarief door het College tarieven gezondheidszorg voor de desbetreffende categorie van specialismen,

      6. verloskundigen,

      7. fysiotherapeuten,

      8. oefentherapeuten Mensendieck en César,

      9. logopedisten,

      10. psychotherapeuten,

      11. vrijgevestigde diëtisten.

      C.

      D. de navolgende andere met organen voor gezondheidszorg gelijkgestelde instellingen:

      1. centrale posten voor het ambulancevervoer,

      2. de Stichting Centraal Begeleidingsorgaan Intercollegiale Toetsing (CBO),

      3. het Pathologisch Anatomisch Landelijk Geautomatiseerd Archief (PALGA).


