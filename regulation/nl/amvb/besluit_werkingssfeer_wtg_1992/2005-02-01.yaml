  - number: '2'
    text: |-
      Voorts worden als organen voor gezondheidszorg aangemerkt personen en instellingen die:

      a. farmaceutische hulp leveren als bedoeld in [artikel 9 van het Verstrekkingenbesluit ziekenfondsverzekering][ref1];

      b. niet met verblijf gepaard gaande huishoudelijke verzorging, persoonlijke verzorging, verpleging of
      ondersteunende begeleiding leveren anders dan op grond van de [artikelen 3][ref2], [4][ref3], [5][ref4],
      [6][ref5] of [7 van het Besluit zorgaanspraken AWBZ][ref6].


