  - number: '3'
    text: |-
      Als organen voor gezondheidszorg worden mede aangemerkt personen of instellingen, niet behorend tot de in de
      [artikelen 1][ref1] en [2][ref2] bedoelde categorieën, voor zover zij vervangende hulp leveren als bedoeld in een
      subsidieregeling op grond van [artikel 1p, eerste lid, onder b, van de Ziekenfondswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005342#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005342#Artikel2
