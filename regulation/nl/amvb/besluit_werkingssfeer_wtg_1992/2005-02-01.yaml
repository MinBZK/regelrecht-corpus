  - number: '4'
    text: |-
      Als organen voor gezondheidszorg worden mede aangemerkt personen of instellingen, niet behorende tot de in de
      artikelen 1 tot met 3 bedoelde categorieën, voor zover zij tarieven in rekening brengen namens, ten behoeve van of
      in verband met het leveren van een prestatie of geheel van prestaties door organen voor gezondheidszorg als bedoeld
      in de [artikelen 1][ref1] tot en met [3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005342#Artikel1
