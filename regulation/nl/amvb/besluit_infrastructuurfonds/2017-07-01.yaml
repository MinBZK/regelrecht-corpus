        artikel: '5'
        paragraaf: '2'
  - number: '28.2'
    text: Onze Minister kan ter uitwerking van het eerste lid bij ministeriële regeling nadere regels geven.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel28
  - number: 28a.1
    text: |-
      Onze Minister kan uit het fonds op aanvraag een bijzondere subsidie verlenen ten behoeve van een experiment of
      demonstratieproject dat naar zijn oordeel noodzakelijk is voor de kennisverwerving en de ontwikkeling van het
      beleid op nationaal niveau op het terrein van infrastructuur.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel28a
  - number: 28a.2
    text: |-
      De subsidie strekt met inachtneming van [artikel 9, tweede lid][ref1], tot een gedeeltelijke tegemoetkoming
      in de kosten van het experiment of demonstratieproject. Tot de kosten worden gerekend de kosten, bedoeld in
      [artikel 5, eerste lid][ref2], alsmede de kosten van begeleiding, evaluatie en monitoring.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006264#Artikel5
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0006264
        artikel: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006264
        artikel: '5'
        paragraaf: '2'
  - number: 28a.3
    text: |-
      Onze Minister houdt bij het bepalen van het subsidiebedrag rekening met het karakter van het experiment of het
      demonstratieproject en met de kosten die redelijkerwijs ten laste van de subsidie-ontvanger behoren te komen. Hij
      kan de subsidie verlenen in de vorm van een vast subsidiebedrag.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel28a
  - number: 28a.4
    text: |-
      De[ artikelen 4][ref1], [5][ref2], [6, tweede en derde lid][ref3], [7][ref4], [8][ref5], [9, tweede lid][ref6],
      en [10][ref7] tot en met [14a][ref8] zijn van overeenkomstige toepassing.


