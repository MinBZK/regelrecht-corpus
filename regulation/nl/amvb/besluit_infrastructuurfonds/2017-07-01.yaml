  - number: '43'
    text: De Bijdrageregeling Mobiliteitsfonds (*Stb.* 1989, 220) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel43
  - number: 44a
    text: |-
      Onze Minister kan bij de vaststelling van bijdragen, bedoeld in artikel 111, eerste en tweede lid, van het Besluit
      personenvervoer, die vóór 1 januari 1994 krachtens dat besluit zijn aangevraagd en die zijn verleend onder de
      toezegging dat de bijdrage op het punt van de vergoeding van de kosten van voorbereiding, administratie en toezicht
      zal worden bijgesteld overeenkomstig een nieuwe regeling, de kosten van voorbereiding, administratie en toezicht
      vergoeden overeenkomstig [artikel 5, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel5
