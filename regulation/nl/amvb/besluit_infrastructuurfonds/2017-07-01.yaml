  - number: '4'
    text: |-
      1 Bij een aanvraag om een subsidie voor een groot project uit het fonds verstrekt de aanvrager met betrekking tot
      dat project Onze Minister de volgende gegevens en bescheiden:

      a. een beschrijving op hoofdkenmerken en het programma van eisen;

      b. tekeningen van het project;

      c. een kostenraming, met een tijdschema van de uitvoering en de daarbij behorende uitgaven van het werk;

      d. een opgave van de kostenelementen, die ten laste van andere kostendragers kunnen worden gebracht;

      e. een raming van de inkomsten uit het project;

      f. een opgave van de stand van zaken met betrekking tot de voor de uitvoering noodzakelijke wettelijke procedures;

      g. een raming van het gebruik, dat van het beoogde project zal worden gemaakt en de verwachte effecten daarvan;

      h. de functie van het project in het openbaar vervoernetwerk, de exploitatiegevolgen voor het openbaar
      vervoernetwerk en de financiering van beheer en instandhouding van het project;

      i. andere door Onze Minister noodzakelijk geachte gegevens.

      2 Een subsidie voor een groot project gelegen in een samenwerkingsgebied kan uitsluitend worden aangevraagd door
      het dagelijks bestuur, een publiekrechtelijk rechtspersoon, niet zijnde een gemeente, provincie of een waterschap,
      of een privaatrechtelijk rechtspersoon, niet zijnde een regionaal of lokaal vervoerbedrijf welke in het betrokken
      samenwerkingsgebied openbaar vervoer verricht.

      3 Indien de aanvraag betrekking heeft op een groot project voor regionale of lokale infrastructuur, en de aanvrager
      in aanmerking meent te komen voor toepassing van [artikel 9, vierde lid, onderdeel a of b][ref1], voegt de
      aanvrager een onderbouwing toe op grond waarvan de aanvrager hiervoor in aanmerking meent te komen.

      4 Een aanvrager van een subsidie voor een groot project toont aan dat het project is opgenomen in een
      provinciaal verkeers- en vervoerplan, dan wel, indien het project is gelegen in een samenwerkingsgebied,
      in een regionaal verkeers- en vervoerplan als bedoeld in [artikel 5, eerste lid][ref2], onderscheidenlijk
      [artikel 16 van de Planwet verkeer en vervoer][ref3].

      5 Het vierde lid is niet van toepassing indien de aanvraag betrekking heeft op een groot project dat onderdeel
      uitmaakt van het landelijk spoorwegnet.


