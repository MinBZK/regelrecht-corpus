  - number: 3a
    text: |-
      1 Onze Minister stelt ieder begrotingsjaar een subsidieplafond vast voor op grond van dit besluit te verstrekken
      subsidies.

      2 Onze Minister kan afzonderlijke subsidieplafonds vaststellen voor de onderscheiden onderdelen van dit besluit.

      3 Onze Minister verdeelt het beschikbare bedrag rekening houdend met:

      a. de mate waarin een project de doelstellingen van het nationaal verkeers- en vervoerplan als bedoeld in
      [artikel 2, eerste lid, van de Planwet verkeer en vervoer][ref1], de nota voor het nationaal ruimtelijk beleid,
      en het nationale milieubeleidsplan als bedoeld in [artikel 4.3, eerste lid, van de Wet milieubeheer][ref2], tot
      uitvoering brengt;

      b. het stadium van voorbereiding van een project;

      c. de hoogte van het subsidiebedrag dat is aangevraagd, en

      d. de verplichtingen die ten laste van de begroting van het Infrastructuurfonds komen op grond van eerder afgegeven
      beschikkingen.

      4 Onze Minister kan in bijzondere gevallen bij de beschikking tot weigering van het verlenen van subsidie op
      grond van [artikel 4:25, tweede lid, van de Algemene wet bestuursrecht][ref3] bepalen dat in het daaropvolgende
      begrotingsjaar, zonder nieuwe indiening van de aanvraag, opnieuw een beschikking op de aanvraag wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0009642#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel4.3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel425
