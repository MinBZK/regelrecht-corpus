  - number: 16c
    text: 'Een subsidie voor een overig project kan uitsluitend bij Onze Minister worden aangevraagd door:'
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel16c
  - number: 16c.a
    text: |-
      andere publiekrechtelijke rechtspersonen dan een provincie, gemeente, waterschap en een regionaal openbaar lichaam
      ingeval het project landelijke betekenis heeft;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel16c
  - number: 16c.b
    text: privaatrechtelijke rechtspersonen ingeval het project landelijke betekenis heeft;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel16c
  - number: 16c.c
    text: een beheerder van landelijke spoorweginfrastructuur;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel16c
  - number: 16c.d
    text: |-
      Publiekrechtelijke rechtspersonen en privaatrechtelijke rechtspersonen ten behoeve van investeringen in en
      onderhoud van infrastructurele werken buiten Nederland doch binnen Europa.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel16c
  - number: 16d.1
    text: |-
      Aanvragen om een subsidie voor overige projecten vinden plaats overeenkomstig [artikel 4, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel4
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel16d
    references:
      - id: ref1
        bwb_id: BWBR0006264
        artikel: '4'
        paragraaf: '2'
  - number: 16d.2
    text: |-
      Onze Minister beslist op een aanvraag als bedoeld in het eerste lid overeenkomstig de[ artikelen 6][ref1],
      [10][ref2], [11][ref3] en [12][ref4] met dien verstande dat in [artikel 10][ref5] in plaats van 'groot project'
      moet worden gelezen: project, waarvan de geraamde kosten op grond van [artikel 5][ref6] meer bedragen dan € 5 000
      000.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006264#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0006264#Artikel11
