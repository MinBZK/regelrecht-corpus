      1 De ontvanger van een subsidie krachtens dit besluit is verplicht tot het verlenen van medewerking aan een door of
      vanwege Onze Minister te verrichten onderzoek naar de besteding van de subsidie.

      2 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur leggen bij de verlening van een subsidie die wordt
      bekostigd uit de doeluitkering, bedoeld in [artikel 29][ref1] onderscheidenlijk [artikel 31][ref2], de subsidie-
      ontvanger de verplichtingen op om:

      a. in het jaar volgend op het jaar waarin het subsidiebedrag is betaald een financieel verslag uit te brengen over
      de besteding van de subsidie en dit verslag vergezeld te doen gaan van een accountantsverklaring;

      b. medewerking te verlenen aan een door of vanwege gedeputeerde staten onderscheidenlijk het dagelijks bestuur te
      verrichten onderzoek naar de besteding van de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0006264#Artikel31
