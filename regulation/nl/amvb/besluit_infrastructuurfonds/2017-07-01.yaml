  - number: '17'
    text: |-
      In afwijking van [§ 2][ref1] zijn voor het verstrekken van subsidies aan een beheerder van landelijke
      spoorweginfrastructuur voor de kapitaallasten voortvloeiende uit de investeringen in die spoorweginfrastructuur ,
      voor de bediening en voor het onderhoud van die spoorweginfrastructuur de bepalingen van deze paragraaf van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006264
        paragraaf: '2'
  - number: '18'
    text: |-
      De beheerder dient jaarlijks uiterlijk vier maanden voor de aanvang van het kalenderjaar waarop de subsidie
      betrekking heeft, een aanvraag om een subsidie in, waarbij hij de volgende gegevens verstrekt:
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel18
  - number: 18.a
    text: |-
      een raming van de te verwachten wijziging van de kapitaallasten ten opzichte van het voorgaande jaar, als gevolg
      van een te verwachten wijziging in de resterende schuld en de daarover berekende rente ten gevolge van de niet à
      fonds perdu gefinancierde spoorweginfrastructuur;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel18
  - number: 18.b
    text: |-
      een raming van de te verwachten wijziging van de kosten van bediening en van de onderhoudskosten ten opzichte van
      het voorgaande jaar, als gevolg van een te verwachten wijziging in omvang van de bestaande spoorweginfrastructuur
      en als gevolg van een te verwachten wijziging van de mate van gebruik van de bestaande spoorweginfrastructuur;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel18
  - number: 18.c
    text: een raming van de te verwachten opbrengsten van vergoedingen van gebruikers van de spoorweginfrastructuur;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel18
  - number: 18.d
    text: andere door Onze Minister noodzakelijk geachte gegevens.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel18
  - number: '19.1'
    text: |-
      Onze Minister verleent jaarlijks de subsidie voor de aanvang van het kalenderjaar waarop de subsidie betrekking
      heeft.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel19
  - number: '19.2'
    text: |-
      Bij de verlening van de subsidie wordt uitgegaan van de kapitaallasten, van de kosten van bediening en onderhoud en
      de omvang van de opbrengsten van vergoedingen van gebruikers, in een door hem te bepalen basisjaar. De subsidie kan
      worden aangepast aan de wijzigingen ten opzichte van het basisjaar als gevolg van:
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel19
  - number: 19.2.a
    text: de omvang van landelijke spoorweginfrastructuur;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel19
  - number: 19.2.b
    text: het niveau van instandhoudingskwaliteit, voor zover Onze Minister daarom verzoekt;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel19
  - number: 19.2.c
    text: het gebruik van landelijke spoorweginfrastructuur;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel19
  - number: 19.2.d
    text: de omvang van de opbrengsten van vergoedingen van gebruikers van landelijke spoorweginfrastructuur;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel19
  - number: 19.2.e
    text: de evaluatie van de algemene overeenkomst inzake de aanraking van infrastructuur;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel19
  - number: 19.2.f
    text: opgebouwde overschotten danwel tekorten;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel19
  - number: 19.2.g
    text: het loon- en prijspeil.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel19
  - number: '19.3'
    text: |-
      Kapitaallasten voortvloeiend uit projecten, die het Rijk reeds overeenkomstig [paragraaf 2][ref1] heeft vergoed,
      worden in mindering gebracht op de totale kapitaallasten. De subsidie heeft betrekking op de dan resterende
      kapitaallasten.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006264
        paragraaf: '2'
  - number: '19.4'
    text: |-
      De verplichtingen voortvloeiend uit de door Onze Minister toegestane leningfinanciering van projecten, bedoeld in
      [paragraaf 2][ref1], worden afzonderlijk vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006264
        paragraaf: '2'
  - number: '19.5'
    text: |-
      Onze Minister kan besluiten tot het vaststellen van een nieuw basisjaar met inachtneming van de dan geldende
      omstandigheden.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel19
  - number: '19.6'
    text: |-
      Onze Minister verleent de subsidie met inachtneming van eisen van soberheid en doelmatigheid. Hij kan bij de
      verlening van de subsidie bepalen dat het subsidiebedrag tussentijds danwel bij de vaststelling van de subsidie
      kan worden aangepast aan de ontwikkelingen van het loon- en prijspeil. [Artikel 7, vierde lid][ref1], is van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel7
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006264
        artikel: '7'
        paragraaf: '2'
  - number: '19.7'
    text: |-
      Onverminderd het zesde lid kan Onze Minister het subsidiebedrag tussentijds danwel bij de vaststelling van de
      subsidie aanpassen wanneer een wijziging van het bijdragesysteem daartoe noodzaakt.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel19
  - number: '20.1'
    text: Bij de subsidieverlening wordt bepaald dat voorschotten worden verleend.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel20
  - number: '20.2'
    text: |-
      De voorschotten worden betaald in het jaar waarop de subsidie betrekking heeft in dertien maandelijkse
      termijnbedragen, waarbij in de maand mei twee termijnbedragen worden betaald.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel20
  - number: '21.1'
    text: |-
      Binnen zes maanden na afloop van het jaar waarop de subsidie betrekking heeft dient de beheerder bij Onze Minister
      een aanvraag tot vaststelling van de subsidie in. De aanvraag gaat vergezeld van de jaarrekening en de financiële
      verantwoording van de kapitaallasten voortvloeiende uit investeringen, kosten van bediening en onderhoudskosten en
      de opbrengsten in de bestaande spoorweginfrastructuur. De jaarrekening en de financiële verantwoording dienen te
      zijn voorzien van een accountantsverklaring.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel21
  - number: '21.2'
    text: |-
      De in het eerste lid bedoelde financiële verantwoording dient te worden opgesteld overeenkomstig het door Onze
      Minister vastgestelde informatieprofiel.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel21
  - number: '21.3'
    text: |-
      Indien uit de accountantsverklaring blijkt, dat de beheerder ten onrechte kapitaallasten voortvloeiende uit
      investeringen, kosten van bediening en onderhoudskosten of opbrengsten ten laste onderscheidenlijk ten gunste van
      de door hem beheerde spoorweginfrastructuur heeft gebracht, brengt de beheerder in de jaarrekening en de financiële
      verantwoording de nodige correcties aan.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel21
  - number: '21.4'
    text: |-
      Onze Minister beslist op de aanvraag tot het vaststellen van de subsidie binnen zes maanden na ontvangst van de
      aanvraag.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel21
  - number: '22'
    text: Bij ministeriële regeling kan Onze Minister nadere regels geven met betrekking tot deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel22
  - number: '28.1'
    text: 'In afwijking van de paragrafen 2 en 3 kan Onze Minister voor:'
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel28
  - number: 28.1.a
    text: |-
      beheer en onderhoud aan wegen, die op 1 januari 1994 in beheer waren bij het Rijk en nadien in beheer zijn gekomen
      bij een provincie, een gemeente of een waterschap, of
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel28
  - number: 28.1.b
    text: |-
      aanleg en beheer en onderhoud van vaarwegen, ten behoeve van de binnenvaart, die in beheer zijn bij een provincie,
      een gemeente of een waterschap, aan die provincie, die gemeente of dat waterschap op aanvraag een subsidie
      verstrekken. [Artikel 5, eerste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel5
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel28
    references:
