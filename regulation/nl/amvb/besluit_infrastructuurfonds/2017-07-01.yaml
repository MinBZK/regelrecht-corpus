  - number: 16b.1
    text: |-
      Onze Minister kan na ingebruikneming van een groot project, waarvoor een subsidie als bedoeld in
      [artikel 4, eerste lid][ref1], is verstrekt, op aanvraag uit het fonds een subsidie verlenen ten behoeve van de
      evaluatie van dat project indien die evaluatie naar zijn oordeel noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel4
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0006264
        artikel: '4'
        paragraaf: '2'
  - number: 16b.2
    text: De subsidie bedraagt vijfennegentig procent van de in aanmerking komende kosten van evaluatie.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel16b
  - number: 16b.3
    text: |-
      De [artikelen 4, tweede lid][ref1], [6, tweede en derde lid][ref2], [7, eerste, tweede en vierde lid][ref3],
      [13][ref4], [14][ref5] en [14a][ref6] zijn van overeenkomstige toepassing.


