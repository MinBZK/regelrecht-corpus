  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 21 juli 1993, nr. WJZ/V-323589, Directoraat-
    Generaal voor het Vervoer;

    Gelet op de artikelen 8 en 9 van de Wet Infrastructuurfonds (Stb. 1993, nr. 319);

    De Raad van State gehoord, advies van 12 november 1993, nr. W09.93.0477;

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 19 november 1993, nr. WJZ/V-324679,
    Directoraat-Generaal voor het Vervoer;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel1
  - number: 1.a
    text: |-
      wet: de [Wet Infrastructuurfonds][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006001
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006001
  - number: 1.b
    text: 'dagelijks bestuur: dagelijks bestuur van een regionaal openbaar lichaam;'
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel1
  - number: 1.c
    text: |-
      samenwerkingsgebied: gebied aangewezen op grond van [artikel 20, derde lid, van de Wet personenvervoer 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '20'
  - number: 1.d
    text: |-
      project: een ondeelbaar geheel aan werkzaamheden met als doel de aanleg van infrastructuur en met als kenmerken,
      dat tot de uitvoering van de werkzaamheden in beginsel alleen in zijn geheel kan worden besloten en dat een
      gefaseerde uitvoering van onderdelen, waarbij ieder onderdeel na voltooiing in gebruik kan worden genomen en
      effectief is, niet zonder aanzienlijke meerkosten mogelijk is;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel1
  - number: 1.e
    text: |-
      groot project: een project waarvan de geraamde op grond van [artikel 5][ref1] voor subsidie in aanmerking komende
      kosten ten minste € 225 000 000,– bedragen of ten minste € 112 500 000,– bedragen indien het een project voor
      regionale of lokale infrastructuur betreft dat geheel wordt gerealiseerd buiten de samenwerkingsgebieden waarin de
      gemeente Amsterdam, de gemeente Rotterdam of de gemeente 's-Gravenhage is gelegen;


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel5
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006264
        artikel: '5'
        paragraaf: '2'
  - number: 1.f
    text: |-
      overig project: een project waarvan de geraamde op grond van [artikel 5][ref1] voor subsidie in aanmerking komende
      kosten minder dan € 225 000 000,– bedragen of minder dan € 112 500 000,– bedragen indien het een project betreft
      voor regionale of lokale infrastructuur dat geheel wordt gerealiseerd buiten samenwerkingsgebieden waarin de
      gemeente Amsterdam, de gemeente Rotterdam of de gemeente 's-Gravenhage is gelegen;


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel5
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006264
        artikel: '5'
        paragraaf: '2'
  - number: 1.g
    text: |-
      vaste subsidiebedrag: subsidie, waarop geen nacalculatie plaatsvindt en welke alleen kan worden bijgesteld op grond
      van wijzigingen van het algemene loon- en prijspeil;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel1
  - number: 1.h
    text: |-
      landelijke infrastructuur: het hoofdwegennet, het landelijk spoorwegnet en het hoofdvaarwegennet, als bedoeld in
      [artikel 1, eerste lid, van de Tracéwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel1
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '1'
  - number: 1.i
    text: |-
      lokale infrastructuur: infrastructuur, gelegen binnen één gemeente en in beheer bij die gemeente en met een lokale
      functie;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel1
  - number: 1.j
    text: |-
      regionale infrastructuur: infrastructuur gelegen binnen een provincie of samenwerkingsgebied, in beheer bij een
      provincie, gemeente of waterschap en met een regionale functie;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel1
  - number: 1.k
    text: |-
      Besluit personenvervoer: Besluit personenvervoer, zoals dat gold voor de inwerkingtreding van het
      [Besluit personenvervoer 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011982
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011982
  - number: '2.1'
    text: Uit het fonds kunnen in ieder geval
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel2
  - number: 2.1.a
    text: |-
      uitgaven worden gedaan ten behoeve van categorieën of onderdelen van infrastructuur, welke zijn opgenomen in de bij
      dit besluit behorende bijlage en
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel2
  - number: 2.1.b
    text: |-
      subsidies worden verstrekt ten behoeve van categorieën of onderdelen van infrastructuur, welke zijn opgenomen in
      de bij dit besluit behorende bijlage, voorzover deze binnen de grenzen van de paragrafen 2 tot en met 7 van dit
      besluit passen.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel2
  - number: '2.2'
    text: 'Uit het fonds worden geen uitgaven gedaan of subsidies verstrekt ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel2
  - number: 2.2.a
    text: kosten van algemeen bestuurlijke aard;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel2
  - number: 2.2.b
    text: |-
      kosten voor het doen van een aanvraag om een subsidie, anders dan bedoeld in [artikel 5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel5
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel2
    references:
