  - number: '10'
    text: |-
      Indien een groot project anders wordt aanbesteed dan openbaar of met voorafgaande selectie, kan Onze Minister
      vooraf toetsen of aan de regelgeving terzake is voldaan.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel10
  - number: '11'
    text: |-
      1 Onze Minister kan bij de subsidieverlening de subsidie-ontvanger de verplichting opleggen om binnen twaalf
      maanden na dagtekening van de beschikking te beginnen met de uitvoering van het project.

      2 De subsidie-ontvanger is verplicht wijzigingen ten opzichte van de op grond van [artikel 4][ref1] ingediende
      gegevens en bescheiden te onderwerpen aan de instemming van Onze Minister, voor zover die wijzigingen van invloed
      zijn op de effectiviteit, de kosten, de kwaliteit of de fasering van het project. De voorstellen tot wijziging
      worden vermeld in de voortgangsrapportage, bedoeld in [artikel 13, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006264#Artikel13
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006264
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006264
        artikel: '13'
        paragraaf: '2'
  - number: '12'
    text: |-
      1 Op een aanvraag om een subsidie als bedoeld in [artikel 4, eerste lid][ref1], beslist Onze Minister afwijzend
      indien:

      a. naar zijn oordeel ernstige twijfel bestaat of de met het betrokken project beoogde doelstellingen worden
      bereikt;

      b. het project naar zijn oordeel onvoldoende bijdraagt of in verhouding tot de kosten onvoldoende bijdraagt aan
      het bereiken van de doelstellingen van het vigerende Structuurschema Verkeer en Vervoer, de vigerende Nota op de
      Ruimtelijke Ordening en het vigerende nationale milieubeleidsplan;

      c. naar zijn oordeel het betrokken project niet past binnen het geldende meerjarenprogramma infrastructuur en
      transport;

      d. de aanvrager failliet is verklaard of aan hem surséance van betaling is verleend, dan wel een verzoek daartoe
      bij de rechtbank is ingediend;

      2 Tenzij Onze Minister in bijzondere gevallen anders beslist, wijst hij een aanvraag af, indien op het tijdstip,
      waarop de aanvraag wordt ingediend, reeds met de uitvoering van het project, waarop de aanvraag betrekking heeft,
      is begonnen.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel4
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006264
        artikel: '4'
        paragraaf: '2'
  - number: '13'
    text: |-
      1 Indien subsidie wordt verleend voor meer dan één kalenderjaar wordt bij de subsidieverlening het bedrag
      aangegeven dat per kalenderjaar aan voorschotten kan worden verleend.

      2 Tenzij bij de subsidieverlening anders wordt bepaald, worden voorschotten verleend per kwartaal. Voorschotten
      worden verleend op basis van in te dienen declaraties die zijn afgestemd op de gerealiseerde en geplande
      voortgang van het werk en die zijn onderbouwd door een voortgangsrapportage van het betrokken project. De
      voortgangsrapportage bevat in ieder geval een overzicht van de gerealiseerde werkzaamheden, een planning van de nog
      te verrichten werkzaamheden en een raming van de nog te maken kosten.

      3 Indien een project slechts gedeeltelijk uit het fonds wordt betaald, is het bedrag dat aan voorschotten wordt
      verleend niet hoger dan het aandeel van het fonds in de financiering van het project.

      4 De subsidie-ontvanger dient jaarlijks binnen vier maanden na afloop van het betrokken kalenderjaar een financiële
      verantwoording, voorzien van een accountants-verklaring, in. Onze Minister kan op verzoek van de subsidie-ontvanger
      de termijn twee keer met telkens ten hoogste twee maanden verlengen. Artikel 14, tweede en derde lid, is van
      overeenkomstige toepassing.

      5 In afwijking van het vijfde lid dient de subsidie-ontvanger tenzij bij de subsidieverlening anders wordt bepaald
      na afloop van het kalenderjaar geen financiële verantwoording voorzien van een accountantsverklaring in.

      6 In geval van snellere voortgang van het werk dan voorzien bij de subsidieverlening kan, in afwijking van het
      tweede lid, het bedrag dat aan voorschotten kan worden verleend, worden verhoogd voor zover dat inpasbaar is binnen
      de begroting van het fonds. De rentekosten van de voorfinanciering van de versnelling worden niet vergoed.

      7 Een voorschot wordt betaald binnen acht weken na ontvangst van de declaratie, bedoeld in het derde lid.

      8 Indien als gevolg van onvoorziene omstandigheden de werkelijk gemaakte kosten hoger uitvallen dan het bedrag
      waarvoor subsidie is verleend, kan de subsidie-ontvanger een suppletoire aanvraag indienen. De artikelen 4 tot en
      met 9 en 12 zijn voor zover nodig van toepassing.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel13
  - number: '14'
    text: |-
      1 Binnen een jaar nadat het betrokken project in gebruik is genomen doet de subsidie-ontvanger aan Onze Minister
      daarvan mededeling. De mededeling gaat vergezeld van een aanvraag tot vaststelling van de subsidie, alsmede van een
      eindverslag en een financiële verantwoording van de totale projectkosten, voorzien van een accountantsverklaring
      alsmede een slotdeclaratie. Onze Minister kan op verzoek van de subsidie-ontvanger de termijn met ten hoogste zes
      maanden verlengen.

      2 De in het eerste lid bedoelde financiële verantwoording en accountantsverklaring dienen te worden opgesteld
      overeenkomstig de in [artikel 4, eerste lid, onder c][ref1], bedoelde kostenraming respectievelijk de door Onze
      Minister vast te stellen controle-instructie.

      3 Met betrekking tot de financiële controle kan Onze Minister bij ministeriële regeling nadere regels geven.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel4
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006264
        artikel: '4'
        paragraaf: '2'
  - number: 14a
    text: |-
      1 Onze Minister beslist op de aanvraag tot het vaststellen van de subsidie binnen twaalf weken na ontvangst van
      de aanvraag.

      2 Indien de subsidie-ontvanger geen aanvraag tot vaststelling van de subsidie heeft ingediend binnen de in
      [artikel 14, eerste lid][ref1], bedoelde termijn stelt Onze Minister de subsidie ambtshalve vast binnen twaalf
      weken na het tijdstip waarop de betrokken termijn is verstreken.

      3 Indien de werkelijke kosten lager zijn dan het bedrag dat als vast subsidiebedrag is verleend, besteedt de
      subsidieontvanger het verschil aan infrastructurele maatregelen overeenkomstig de bijlage bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel14
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel14a
