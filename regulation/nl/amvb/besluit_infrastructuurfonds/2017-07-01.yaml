  - number: '3.1'
    text: |-
      De ontvanger van een subsidie krachtens dit besluit is verplicht tot het verlenen van medewerking aan een door of
      vanwege Onze Minister te verrichten onderzoek naar de besteding van de subsidie.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel3
  - number: '3.2'
    text: |-
      Gedeputeerde staten onderscheidenlijk het dagelijks bestuur leggen bij de verlening van een subsidie die wordt
      bekostigd uit de doeluitkering, bedoeld in [artikel 29][ref1] onderscheidenlijk [artikel 31][ref2], de subsidie-
      ontvanger de verplichtingen op om:


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0006264#Artikel31
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006264
        artikel: '29'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0006264
        artikel: '31'
        paragraaf: '8'
  - number: 3.2.a
    text: |-
      in het jaar volgend op het jaar waarin het subsidiebedrag is betaald een financieel verslag uit te brengen over de
      besteding van de subsidie en dit verslag vergezeld te doen gaan van een accountantsverklaring;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel3
  - number: 3.2.b
    text: |-
      medewerking te verlenen aan een door of vanwege gedeputeerde staten onderscheidenlijk het dagelijks bestuur te
      verrichten onderzoek naar de besteding van de subsidie.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel3
  - number: 3a.1
    text: |-
      Onze Minister stelt ieder begrotingsjaar een subsidieplafond vast voor op grond van dit besluit te verstrekken
      subsidies.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel3a
  - number: 3a.2
    text: Onze Minister kan afzonderlijke subsidieplafonds vaststellen voor de onderscheiden onderdelen van dit besluit.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel3a
  - number: 3a.3
    text: 'Onze Minister verdeelt het beschikbare bedrag rekening houdend met:'
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel3a
  - number: 3a.3.a
    text: |-
      de mate waarin een project de doelstellingen van het nationaal verkeers- en vervoerplan als bedoeld in
      [artikel 2, eerste lid, van de Planwet verkeer en vervoer][ref1], de nota voor het nationaal ruimtelijk beleid,
      en het nationale milieubeleidsplan als bedoeld in [artikel 4.3, eerste lid, van de Wet milieubeheer][ref2], tot
      uitvoering brengt;


      [ref1]: https://wetten.overheid.nl/BWBR0009642#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel4
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0009642
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '4'
  - number: 3a.3.b
    text: het stadium van voorbereiding van een project;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel3a
  - number: 3a.3.c
    text: de hoogte van het subsidiebedrag dat is aangevraagd, en
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel3a
  - number: 3a.3.d
    text: |-
      de verplichtingen die ten laste van de begroting van het Infrastructuurfonds komen op grond van eerder afgegeven
      beschikkingen.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel3a
  - number: 3a.4
    text: |-
      Onze Minister kan in bijzondere gevallen bij de beschikking tot weigering van het verlenen van subsidie op
      grond van [artikel 4:25, tweede lid, van de Algemene wet bestuursrecht][ref1] bepalen dat in het daaropvolgende
      begrotingsjaar, zonder nieuwe indiening van de aanvraag, opnieuw een beschikking op de aanvraag wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '4.1'
    text: |-
      Bij een aanvraag om een subsidie voor een groot project uit het fonds verstrekt de aanvrager met betrekking tot dat
      project Onze Minister de volgende gegevens en bescheiden:
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel4
  - number: 4.1.a
    text: een beschrijving op hoofdkenmerken en het programma van eisen;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel4
  - number: 4.1.b
    text: tekeningen van het project;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel4
  - number: 4.1.c
    text: een kostenraming, met een tijdschema van de uitvoering en de daarbij behorende uitgaven van het werk;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel4
  - number: 4.1.d
    text: een opgave van de kostenelementen, die ten laste van andere kostendragers kunnen worden gebracht;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel4
  - number: 4.1.e
    text: een raming van de inkomsten uit het project;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel4
  - number: 4.1.f
    text: een opgave van de stand van zaken met betrekking tot de voor de uitvoering noodzakelijke wettelijke procedures;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel4
  - number: 4.1.g
    text: een raming van het gebruik, dat van het beoogde project zal worden gemaakt en de verwachte effecten daarvan;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel4
  - number: 4.1.h
    text: |-
      de functie van het project in het openbaar vervoernetwerk, de exploitatiegevolgen voor het openbaar vervoernetwerk
      en de financiering van beheer en instandhouding van het project;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel4
  - number: 4.1.i
    text: andere door Onze Minister noodzakelijk geachte gegevens.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel4
  - number: '4.2'
    text: |-
      Een subsidie voor een groot project gelegen in een samenwerkingsgebied kan uitsluitend worden aangevraagd door
      het dagelijks bestuur, een publiekrechtelijk rechtspersoon, niet zijnde een gemeente, provincie of een waterschap,
      of een privaatrechtelijk rechtspersoon, niet zijnde een regionaal of lokaal vervoerbedrijf welke in het betrokken
      samenwerkingsgebied openbaar vervoer verricht.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel4
  - number: '4.3'
    text: |-
      Indien de aanvraag betrekking heeft op een groot project voor regionale of lokale infrastructuur, en de aanvrager
      in aanmerking meent te komen voor toepassing van [artikel 9, vierde lid, onderdeel a of b][ref1], voegt de
      aanvrager een onderbouwing toe op grond waarvan de aanvrager hiervoor in aanmerking meent te komen.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel9
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006264
        artikel: '9'
        paragraaf: '2'
  - number: '4.4'
    text: |-
      Een aanvrager van een subsidie voor een groot project toont aan dat het project is opgenomen in een
      provinciaal verkeers- en vervoerplan, dan wel, indien het project is gelegen in een samenwerkingsgebied,
      in een regionaal verkeers- en vervoerplan als bedoeld in [artikel 5, eerste lid][ref1], onderscheidenlijk
      [artikel 16 van de Planwet verkeer en vervoer][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009642#Artikel16
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006264
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009642
        artikel: '16'
  - number: '4.5'
    text: |-
      Het vierde lid is niet van toepassing indien de aanvraag betrekking heeft op een groot project dat onderdeel
      uitmaakt van het landelijk spoorwegnet.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel4
  - number: '5.1'
    text: |-
      Voor een subsidie als bedoeld in [artikel 4, eerste lid][ref1] ten behoeve van investeringen in infrastructuur
      komen in aanmerking de kosten van:


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel4
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006264
        artikel: '4'
        paragraaf: '2'
  - number: 5.1.a
    text: studies voor het betrokken project voor zover die door Onze Minister aanvaardbaar worden geacht;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel5
  - number: 5.1.b
    text: verwerving van een onroerende zaak voor zover door Onze Minister aanvaardbaar geacht;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel5
  - number: 5.1.c
    text: vergunningen en leges voor zover door Onze Minister aanvaardbaar geacht;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel5
  - number: 5.1.d
    text: |-
      bouwrente; deze is gelijk aan de rente van de meest recente staatslening op het moment van gunning van het werk;
      het bedrag en de termijn, waarover de bouwrente vergoed wordt, behoeft de goedkeuring van Onze Minister;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel5
  - number: 5.1.e
    text: materialen;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel5
  - number: 5.1.f
    text: werkzaamheden van aanleg, bouw, wijziging of inrichting van de betrokken infrastructuur;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel5
  - number: 5.1.g
    text: bijkomende voorzieningen nodig om de betrokken infrastructuur na voltooiing zijn functie te kunnen laten vervullen;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel5
  - number: 5.1.h
    text: met het project samenhangende door Onze Minister redelijk geachte schadevergoedingen aan derden;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel5
  - number: 5.1.i
    text: voorlichting over de uitvoering van het project als begeleiding gedurende de bouw;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel5
  - number: 5.1.j
    text: |-
      de omzetbelasting die niet op de voet van [artikel 15 van de Wet op de omzetbelasting 1968][ref1] in aftrek kan
      worden gebracht en geen recht geeft op een bijdrage uit het BTW-compensatiefonds;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
  - number: 5.1.k
    text: |-
      voorbereiding, administratie en toezicht voor zover het betreft projecten ten behoeve van het openbaar vervoer, van
      het goederenvervoer over het spoor en van vaarwegen;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel5
  - number: 5.1.l
    text: |-
      onvoorziene omstandigheden bij grote projecten met betrekking tot regionale of lokale infrastructuur, voorzover de
      kosten betrekking hebben op de kosten, genoemd in de onderdelen a tot en met i.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel5
  - number: '5.2'
    text: |-
      De kosten, bedoeld in het eerste lid, worden slechts tot een in redelijkheid als noodzakelijk te beschouwen hoogte
      in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel5
  - number: '5.3'
    text: |-
      De kosten bedoeld in het eerste lid, onderdeel k, bedragen voor projecten ten behoeve van het openbaar vervoer en
      van het goederenvervoer zestien procent en voor projecten ten behoeve van vaarwegen tien procent van de kosten,
      bedoeld in het eerste lid, onderdelen e, f en g.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel5
  - number: '5.4'
    text: |-
      In afwijking van het bepaalde in het derde lid stelt Onze Minister, indien het een subsidie betreft voor projecten
      ten behoeve van het landelijk spoorwegnet, de in dat lid genoemde kosten per soort van investering nader vast.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel5
  - number: '6.1'
    text: |-
      Een aanvraag om een subsidie voor een groot project wordt slechts in behandeling genomen indien dat project is
      opgenomen in een realisatieprogramma dat deel uitmaakt van het meerjarenprogramma. In bijzondere gevallen kan
      Onze Minister besluiten de aanvraag reeds in behandeling te nemen voordat dat project in een realisatieprogramma
      is opgenomen.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel6
  - number: '6.2'
    text: |-
      Onze Minister beslist op een aanvraag om een subsidie als bedoeld in [artikel 4, eerste lid][ref1], binnen zes
      maanden na de indiening daarvan. Hij kan daarbij van de aanvraag afwijken.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel4
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006264
        artikel: '4'
        paragraaf: '2'
  - number: '6.3'
    text: |-
      Indien als gevolg van de complexiteit van de te behandelen aanvraag Onze Minister niet binnen de in het tweede lid
      genoemde termijn kan beslissen, kan hij deze termijn twee keer met telkens ten hoogste zes maanden verlengen. Onze
      Minister doet hiervan terstond mededeling aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel6
  - number: '7.1'
    text: |-
      Onze Minister verleent de subsidie met inachtneming van eisen van soberheid en doelmatigheid. Hij kan bij de
      verlening van de subsidie bepalen dat het subsidiebedrag tussentijds danwel bij de vaststelling van de subsidie kan
      worden aangepast aan de ontwikkelingen van het loon- en prijspeil.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel7
  - number: '7.2'
    text: |-
      De subsidie wordt verleend voor de werkelijk te maken kosten, tenzij de subsidie in de vorm van een vast
      subsidiebedrag wordt verleend.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel7
  - number: '7.3'
    text: |-
      Een subsidie voor een groot project met betrekking tot regionale of lokale infrastructuur wordt uitsluitend
      verleend voor in de beschikking omschreven functionele eisen in de vorm van een vast subsidiebedrag, dat is
      gebaseerd op de kosten van de meest kosteneffectieve variant. De beschikking tot subsidieverlening vermeldt de
      variant die naar het oordeel van Onze Minister , op basis van de studies van de subsidieaanvrager ter voorbereiding
      van de aanvraag als het meest kosteneffectief kan worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel7
  - number: '7.4'
    text: |-
      Bij het verlenen van de subsidie worden de kosten, welke naar het oordeel van Onze Minister redelijkerwijs ten
      laste van andere kostendragers kunnen worden gebracht, buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel7
  - number: '7.5'
    text: |-
      Niet voor een subsidie komen in aanmerking de kosten van wegverharding in geval van achterstallig onderhoud aan het
      gehele betrokken wegdek; in geval van achterstallig onderhoud aan een gedeelte van het betrokken wegdek wordt de
      subsidie naar evenredigheid met de mate van achterstallig onderhoud verminderd.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel7
  - number: '9.1'
    text: |-
      Een subsidie als bedoeld in [artikel 4, eerste lid][ref1], bedraagt, met inachtneming van het tweede lid, als
      percentage van de op grond van [artikel 5][ref2] in aanmerking komende kosten voor:


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006264#Artikel5
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006264
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006264
        artikel: '5'
        paragraaf: '2'
  - number: 9.1.a
    text: |-
      het landelijk spoorwegnet honderd procent; indien het infrastructuur betreft hoofdzakelijk ten behoeve van het
      internationale vervoer over spoorwegen kan Onze Minister een ander percentage vaststellen;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel9
  - number: 9.1.b
    text: |-
      een groot project: voor regionale of lokale infrastructuur honderd procent van de kosten van de variant die naar
      het oordeel van Onze Minister als meest kosteneffectief kan worden aangemerkt, onder aftrek van € 225 000 000,–
      indien dat project geheel of gedeeltelijk wordt gerealiseerd binnen één of meer van de samenwerkingsgebieden waarin
      de gemeente Amsterdam, de gemeente Rotterdam of de gemeente 's-Gravenhage is gelegen of onder aftrek van € 112 500
      000,– indien dat project geheel in een ander gebied wordt gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel9
  - number: 9.1.c
    text: |-
      voorzieningen met betrekking tot de veiligheid van het wegverkeer vijftig procent; indien de subsidie bestemd
      is voor herinrichting van verblijfsgebieden als 30-km zone, dient de aaneengesloten oppervlakte van dit gebied
      minimaal tien hectare te bedragen;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel9
  - number: 9.1.d
    text: |-
      studies als bedoeld in [artikel 5, eerste lid, onderdeel a][ref1], vijftig procent voor zover de kosten niet als
      bestuurskosten van de aanvrager kunnen worden aangemerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel5
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006264
        artikel: '5'
        paragraaf: '2'
  - number: 9.1.e
    text: aanleg van een terminal ten behoeve van intermodaal vervoer vijfentwintig procent.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel9
  - number: '9.2'
    text: |-
      Bij de vergoeding voor de verlegging of vervanging van kabels of leidingen wordt rekening gehouden met het
      juridische regime, waaronder de kabels of leidingen liggen. Indien bij de verlegging de kabels of leidingen
      gelijktijdig worden vervangen wordt een aftrek toegepast, welke wordt berekend op basis van de resterende
      economische levensduur van de kabels of leidingen.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel9
  - number: '9.3'
    text: |-
      In afwijking van het eerste lid, onderdeel *a*, kan Onze Minister voor de subsidie voor een investering ten behoeve
      van spoorweginfrastructuur uitsluitend bestemd voor vervoer van goederen een lager percentage vaststellen.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel9
  - number: '9.4'
    text: |-
      In afwijking van het eerste lid, aanhef en onderdeel b, kan Onze Minister een lager bedrag dan € 225 000 000,–
      onderscheidenlijk € 112 500 000,– aftrekken in geval:
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel9
  - number: 9.4.a
    text: |-
      de financiële draagkracht van de aanvrager hiertoe aanleiding geeft; hiervan is in ieder geval sprake indien de
      hoogte van de brede doeluitkering als bedoeld in [artikel 3, eerste lid, van de Wet BDU verkeer en vervoer][ref1],
      in het jaar waarin de aanvraag is ingediend, vermenigvuldigd met twee, gelijk is aan of lager dan € 225.000.000,–:
      of


      [ref1]: https://wetten.overheid.nl/BWBR0017828#Artikel3
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0017828
        artikel: '3'
  - number: 9.4.b
    text: |-
      het project een functie heeft die naar het oordeel van Onze Minister het regionale of lokale belang aanmerkelijk te
      boven gaat.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel9
  - number: '9.5'
    text: |-
      Indien reeds subsidie is verleend voor de kosten, bedoeld in [artikel 5, eerste lid, onderdeel a][ref1], wordt deze
      bij de verlening van een subsidie voor de overige kosten, genoemd in artikel 5, eerste lid, in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel5
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006264
        artikel: '5'
        paragraaf: '2'
  - number: '10'
    text: |-
      Indien een groot project anders wordt aanbesteed dan openbaar of met voorafgaande selectie, kan Onze Minister
      vooraf toetsen of aan de regelgeving terzake is voldaan.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel10
  - number: '11.1'
    text: |-
      Onze Minister kan bij de subsidieverlening de subsidie-ontvanger de verplichting opleggen om binnen twaalf maanden
      na dagtekening van de beschikking te beginnen met de uitvoering van het project.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel11
  - number: '11.2'
    text: |-
      De subsidie-ontvanger is verplicht wijzigingen ten opzichte van de op grond van [artikel 4][ref1] ingediende
      gegevens en bescheiden te onderwerpen aan de instemming van Onze Minister, voor zover die wijzigingen van invloed
      zijn op de effectiviteit, de kosten, de kwaliteit of de fasering van het project. De voorstellen tot wijziging
      worden vermeld in de voortgangsrapportage, bedoeld in [artikel 13, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006264#Artikel13
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006264
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006264
        artikel: '13'
        paragraaf: '2'
  - number: '12.1'
    text: |-
      Op een aanvraag om een subsidie als bedoeld in [artikel 4, eerste lid][ref1], beslist Onze Minister afwijzend
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel4
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006264
        artikel: '4'
        paragraaf: '2'
  - number: 12.1.a
    text: naar zijn oordeel ernstige twijfel bestaat of de met het betrokken project beoogde doelstellingen worden bereikt;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel12
  - number: 12.1.b
    text: |-
      het project naar zijn oordeel onvoldoende bijdraagt of in verhouding tot de kosten onvoldoende bijdraagt aan
      het bereiken van de doelstellingen van het vigerende Structuurschema Verkeer en Vervoer, de vigerende Nota op de
      Ruimtelijke Ordening en het vigerende nationale milieubeleidsplan;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel12
  - number: 12.1.c
    text: |-
      naar zijn oordeel het betrokken project niet past binnen het geldende meerjarenprogramma infrastructuur en
      transport;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel12
  - number: 12.1.d
    text: |-
      de aanvrager failliet is verklaard of aan hem surséance van betaling is verleend, dan wel een verzoek daartoe bij
      de rechtbank is ingediend;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel12
  - number: '12.2'
    text: |-
      Tenzij Onze Minister in bijzondere gevallen anders beslist, wijst hij een aanvraag af, indien op het tijdstip,
      waarop de aanvraag wordt ingediend, reeds met de uitvoering van het project, waarop de aanvraag betrekking heeft,
      is begonnen.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel12
  - number: '13.1'
    text: |-
      Indien subsidie wordt verleend voor meer dan één kalenderjaar wordt bij de subsidieverlening het bedrag aangegeven
      dat per kalenderjaar aan voorschotten kan worden verleend.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel13
  - number: '13.2'
    text: |-
      Tenzij bij de subsidieverlening anders wordt bepaald, worden voorschotten verleend per kwartaal. Voorschotten
      worden verleend op basis van in te dienen declaraties die zijn afgestemd op de gerealiseerde en geplande
      voortgang van het werk en die zijn onderbouwd door een voortgangsrapportage van het betrokken project. De
      voortgangsrapportage bevat in ieder geval een overzicht van de gerealiseerde werkzaamheden, een planning van de nog
      te verrichten werkzaamheden en een raming van de nog te maken kosten.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel13
  - number: '13.3'
    text: |-
      Indien een project slechts gedeeltelijk uit het fonds wordt betaald, is het bedrag dat aan voorschotten wordt
      verleend niet hoger dan het aandeel van het fonds in de financiering van het project.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel13
  - number: '13.4'
    text: |-
      De subsidie-ontvanger dient jaarlijks binnen vier maanden na afloop van het betrokken kalenderjaar een financiële
      verantwoording, voorzien van een accountants-verklaring, in. Onze Minister kan op verzoek van de subsidie-ontvanger
      de termijn twee keer met telkens ten hoogste twee maanden verlengen. Artikel 14, tweede en derde lid, is van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel13
  - number: '13.5'
    text: |-
      In afwijking van het vijfde lid dient de subsidie-ontvanger tenzij bij de subsidieverlening anders wordt bepaald na
      afloop van het kalenderjaar geen financiële verantwoording voorzien van een accountantsverklaring in.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel13
  - number: '13.6'
    text: |-
      In geval van snellere voortgang van het werk dan voorzien bij de subsidieverlening kan, in afwijking van het tweede
      lid, het bedrag dat aan voorschotten kan worden verleend, worden verhoogd voor zover dat inpasbaar is binnen de
      begroting van het fonds. De rentekosten van de voorfinanciering van de versnelling worden niet vergoed.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel13
  - number: '13.7'
    text: Een voorschot wordt betaald binnen acht weken na ontvangst van de declaratie, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel13
  - number: '13.8'
    text: |-
      Indien als gevolg van onvoorziene omstandigheden de werkelijk gemaakte kosten hoger uitvallen dan het bedrag
      waarvoor subsidie is verleend, kan de subsidie-ontvanger een suppletoire aanvraag indienen. De artikelen 4 tot en
      met 9 en 12 zijn voor zover nodig van toepassing.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel13
  - number: '14.1'
    text: |-
      Binnen een jaar nadat het betrokken project in gebruik is genomen doet de subsidie-ontvanger aan Onze Minister
      daarvan mededeling. De mededeling gaat vergezeld van een aanvraag tot vaststelling van de subsidie, alsmede van een
      eindverslag en een financiële verantwoording van de totale projectkosten, voorzien van een accountantsverklaring
      alsmede een slotdeclaratie. Onze Minister kan op verzoek van de subsidie-ontvanger de termijn met ten hoogste zes
      maanden verlengen.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel14
  - number: '14.2'
    text: |-
      De in het eerste lid bedoelde financiële verantwoording en accountantsverklaring dienen te worden opgesteld
      overeenkomstig de in [artikel 4, eerste lid, onder c][ref1], bedoelde kostenraming respectievelijk de door Onze
      Minister vast te stellen controle-instructie.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel4
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006264
        artikel: '4'
        paragraaf: '2'
  - number: '14.3'
    text: Met betrekking tot de financiële controle kan Onze Minister bij ministeriële regeling nadere regels geven.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel14
  - number: 14a.1
    text: |-
      Onze Minister beslist op de aanvraag tot het vaststellen van de subsidie binnen twaalf weken na ontvangst van de
      aanvraag.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel14a
  - number: 14a.2
    text: |-
      Indien de subsidie-ontvanger geen aanvraag tot vaststelling van de subsidie heeft ingediend binnen de in
      [artikel 14, eerste lid][ref1], bedoelde termijn stelt Onze Minister de subsidie ambtshalve vast binnen twaalf
      weken na het tijdstip waarop de betrokken termijn is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel14
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0006264
        artikel: '14'
        paragraaf: '2'
  - number: 14a.3
    text: |-
      Indien de werkelijke kosten lager zijn dan het bedrag dat als vast subsidiebedrag is verleend, besteedt de
      subsidieontvanger het verschil aan infrastructurele maatregelen overeenkomstig de bijlage bij dit besluit.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel14a
  - number: 16a.1
    text: |-
      Onze Minister kan voor een project dat is opgenomen in een planstudieprogramma dat deel uitmaakt van het
      meerjarenprogramma op aanvraag een subsidie verlenen voor naar het oordeel van Onze Minister in de planstudiefase
      redelijkerwijs te maken kosten als bedoeld in [artikel 5, eerste lid, onderdelen a, b of k][ref1]. Kosten van
      studies voor het regionale of lokale wegennet komen niet voor subsidie in aanmerking. In bijzondere gevallen kan
      Onze Minister besluiten de aanvraag reeds in behandeling te nemen voordat dat project in een planstudieprogramma
      is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel5
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0006264
        artikel: '5'
        paragraaf: '2'
  - number: 16a.2
    text: |-
      De subsidie bedraagt voor projecten ten behoeve van het landelijk spoorwegnet ten hoogste honderd procent en voor
      andere projecten ten hoogste vijftig procent van de op grond van het eerste lid in aanmerking komende kosten.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel16a
  - number: 16a.3
    text: |-
      De subsidie-ontvanger neemt geen beslissing om het project niet tot uitvoering te brengen dan na instemming van
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel16a
  - number: 16a.4
    text: |-
      De [artikelen 4, eerste en tweede lid][ref1], [6, tweede en derde lid][ref2],
      [7, eerste, tweede en vierde lid][ref3], [10][ref4], [11, tweede lid][ref5], [12, eerste lid][ref6], [13][ref7],
      [14][ref8] en [14a][ref9] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006264#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0006264#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0006264#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0006264#Artikel11
      [ref6]: https://wetten.overheid.nl/BWBR0006264#Artikel12
      [ref7]: https://wetten.overheid.nl/BWBR0006264#Artikel13
      [ref8]: https://wetten.overheid.nl/BWBR0006264#Artikel14
      [ref9]: https://wetten.overheid.nl/BWBR0006264#Artikel14a
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0006264
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006264
        artikel: '6'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006264
        artikel: '7'
        paragraaf: '2'
      - id: ref4
