  - number: '45'
    text: De Bijdrageregeling wegverkeersvoorzieningen (*Stcrt.* 1988, 215) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel45
  - number: '49'
    text: Dit besluit kan worden aangehaald als Besluit Infrastructuurfonds.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel49
  - number: '50'
    text: Dit besluit treedt in werking met ingang van 1 januari 1994 .
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel50
  - number: '51'
    text: |-
      De [artikelen 3 tot en met 22][ref1], [28][ref2] en [28a][ref3] vervallen met ingang van 1 januari 2025, met dien
      verstande dat zij van toepassing blijven op voor die datum aangevraagde en verleende subsidies.


