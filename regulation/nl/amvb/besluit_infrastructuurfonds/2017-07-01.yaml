  - number: 16aa
    text: |-
      1 Onze Minister kan voor een verkenning die is opgenomen in een verkenningenprogramma dat deel uitmaakt van het
      meerjarenprogramma op aanvraag een subsidie verlenen voor te maken kosten van studies of onderzoeken.

      2 Bij een aanvraag om een subsidie als bedoeld in het eerste lid verstrekt de aanvrager Onze Minister de volgende
      gegevens en bescheiden:

      a. de opzet van studies of onderzoeken;

      b. een beschrijving op hoofdlijnen van het verkeers- en vervoerprobleem en van mogelijke oplossingen;

      c. een kostenraming met een tijdschema van de te verrichten studies of onderzoeken;

      d. een opgave van de kostenelementen die ten laste van andere kostendragers kunnen worden gebracht;

      e. inzicht in het voorgenomen verkeers- en vervoerbeleid.

      3 De subsidie bedraagt ten hoogste vijftig procent van de op grond van het eerste lid in aanmerking komende kosten.

      4 Onze Minister kan bij zijn beslissing als bedoeld in het eerste lid de in dat lid bedoelde kosten nader
      specificeren, dan wel de subsidie in afwijking van het derde lid verlenen in de vorm van een vast subsidiebedrag,
      dat echter niet hoger mag zijn dan vijftig procent van de op grond van het eerste lid in aanmerking komende kosten.

      5 De [artikelen 4, tweede lid][ref1], [6, tweede en derde lid][ref2], [7, eerste, tweede en vierde lid][ref3],
      [10][ref4], [12, eerste lid][ref5], [13][ref6], [14][ref7] en [14a][ref8] zijn van overeenkomstige
      toepassing, met dien verstande dat wanneer de subsidie in de vorm van een vast subsidiebedrag is verleend geen
      accountantsverklaring behoeft te worden ingediend.


