articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. wet: de [Wet Infrastructuurfonds][ref1];

      b. dagelijks bestuur: dagelijks bestuur van een regionaal openbaar lichaam;

      c. samenwerkingsgebied: gebied aangewezen op grond van
      [artikel 20, derde lid, van de Wet personenvervoer 2000][ref2];

      d. project: een ondeelbaar geheel aan werkzaamheden met als doel de aanleg van infrastructuur en met als kenmerken,
      dat tot de uitvoering van de werkzaamheden in beginsel alleen in zijn geheel kan worden besloten en dat een
      gefaseerde uitvoering van onderdelen, waarbij ieder onderdeel na voltooiing in gebruik kan worden genomen en
      effectief is, niet zonder aanzienlijke meerkosten mogelijk is;

      e. groot project: een project waarvan de geraamde op grond van [artikel 5][ref3] voor subsidie in aanmerking
      komende kosten ten minste € 225 000 000,– bedragen of ten minste € 112 500 000,– bedragen indien het een project
      voor regionale of lokale infrastructuur betreft dat geheel wordt gerealiseerd buiten de samenwerkingsgebieden
      waarin de gemeente Amsterdam, de gemeente Rotterdam of de gemeente 's-Gravenhage is gelegen;

      f. overig project: een project waarvan de geraamde op grond van [artikel 5][ref4] voor subsidie in aanmerking
      komende kosten minder dan € 225 000 000,– bedragen of minder dan € 112 500 000,– bedragen indien het een project
      betreft voor regionale of lokale infrastructuur dat geheel wordt gerealiseerd buiten samenwerkingsgebieden waarin
      de gemeente Amsterdam, de gemeente Rotterdam of de gemeente 's-Gravenhage is gelegen;

      g. vaste subsidiebedrag: subsidie, waarop geen nacalculatie plaatsvindt en welke alleen kan worden bijgesteld op
      grond van wijzigingen van het algemene loon- en prijspeil;

      h. landelijke infrastructuur: het hoofdwegennet, het landelijk spoorwegnet en het hoofdvaarwegennet, als bedoeld in
      [artikel 1, eerste lid, van de Tracéwet][ref5];

      i. lokale infrastructuur: infrastructuur, gelegen binnen één gemeente en in beheer bij die gemeente en met een
      lokale functie;

      j. regionale infrastructuur: infrastructuur gelegen binnen een provincie of samenwerkingsgebied, in beheer bij een
      provincie, gemeente of waterschap en met een regionale functie;

      k. Besluit personenvervoer: Besluit personenvervoer, zoals dat gold voor de inwerkingtreding van het
      [Besluit personenvervoer 2000][ref6].


