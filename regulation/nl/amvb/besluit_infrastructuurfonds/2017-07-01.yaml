  - number: '7'
    text: |-
      1 Onze Minister verleent de subsidie met inachtneming van eisen van soberheid en doelmatigheid. Hij kan bij de
      verlening van de subsidie bepalen dat het subsidiebedrag tussentijds danwel bij de vaststelling van de subsidie kan
      worden aangepast aan de ontwikkelingen van het loon- en prijspeil.

      2 De subsidie wordt verleend voor de werkelijk te maken kosten, tenzij de subsidie in de vorm van een vast
      subsidiebedrag wordt verleend.

      3 Een subsidie voor een groot project met betrekking tot regionale of lokale infrastructuur wordt uitsluitend
      verleend voor in de beschikking omschreven functionele eisen in de vorm van een vast subsidiebedrag, dat is
      gebaseerd op de kosten van de meest kosteneffectieve variant. De beschikking tot subsidieverlening vermeldt de
      variant die naar het oordeel van Onze Minister , op basis van de studies van de subsidieaanvrager ter voorbereiding
      van de aanvraag als het meest kosteneffectief kan worden aangemerkt.

      4 Bij het verlenen van de subsidie worden de kosten, welke naar het oordeel van Onze Minister redelijkerwijs ten
      laste van andere kostendragers kunnen worden gebracht, buiten beschouwing gelaten.

      5 Niet voor een subsidie komen in aanmerking de kosten van wegverharding in geval van achterstallig onderhoud aan
      het gehele betrokken wegdek; in geval van achterstallig onderhoud aan een gedeelte van het betrokken wegdek wordt
      de subsidie naar evenredigheid met de mate van achterstallig onderhoud verminderd.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel7
  - number: '9'
    text: |-
      1 Een subsidie als bedoeld in [artikel 4, eerste lid][ref1], bedraagt, met inachtneming van het tweede lid, als
      percentage van de op grond van [artikel 5][ref2] in aanmerking komende kosten voor:

      a. het landelijk spoorwegnet honderd procent; indien het infrastructuur betreft hoofdzakelijk ten behoeve van het
      internationale vervoer over spoorwegen kan Onze Minister een ander percentage vaststellen;

      b. een groot project: voor regionale of lokale infrastructuur honderd procent van de kosten van de variant die naar
      het oordeel van Onze Minister als meest kosteneffectief kan worden aangemerkt, onder aftrek van € 225 000 000,–
      indien dat project geheel of gedeeltelijk wordt gerealiseerd binnen één of meer van de samenwerkingsgebieden waarin
      de gemeente Amsterdam, de gemeente Rotterdam of de gemeente 's-Gravenhage is gelegen of onder aftrek van € 112 500
      000,– indien dat project geheel in een ander gebied wordt gerealiseerd.

      c. voorzieningen met betrekking tot de veiligheid van het wegverkeer vijftig procent; indien de subsidie bestemd
      is voor herinrichting van verblijfsgebieden als 30-km zone, dient de aaneengesloten oppervlakte van dit gebied
      minimaal tien hectare te bedragen;

      d. studies als bedoeld in [artikel 5, eerste lid, onderdeel a][ref3], vijftig procent voor zover de kosten niet als
      bestuurskosten van de aanvrager kunnen worden aangemerkt;

      e. aanleg van een terminal ten behoeve van intermodaal vervoer vijfentwintig procent.

      2 Bij de vergoeding voor de verlegging of vervanging van kabels of leidingen wordt rekening gehouden met het
      juridische regime, waaronder de kabels of leidingen liggen. Indien bij de verlegging de kabels of leidingen
      gelijktijdig worden vervangen wordt een aftrek toegepast, welke wordt berekend op basis van de resterende
      economische levensduur van de kabels of leidingen.

      3 In afwijking van het eerste lid, onderdeel *a*, kan Onze Minister voor de subsidie voor een investering ten
      behoeve van spoorweginfrastructuur uitsluitend bestemd voor vervoer van goederen een lager percentage vaststellen.

      4 In afwijking van het eerste lid, aanhef en onderdeel b, kan Onze Minister een lager bedrag dan € 225 000 000,–
      onderscheidenlijk € 112 500 000,– aftrekken in geval:

      a. de financiële draagkracht van de aanvrager hiertoe aanleiding geeft;

      hiervan is in ieder geval sprake indien de hoogte van de brede doeluitkering als bedoeld in
      [artikel 3, eerste lid, van de Wet BDU verkeer en vervoer][ref4], in het jaar waarin de aanvraag is ingediend,
      vermenigvuldigd met twee, gelijk is aan of lager dan € 225.000.000,–: of

      b. het project een functie heeft die naar het oordeel van Onze Minister het regionale of lokale belang aanmerkelijk
      te boven gaat.

      5 Indien reeds subsidie is verleend voor de kosten, bedoeld in [artikel 5, eerste lid, onderdeel a][ref5], wordt
      deze bij de verlening van een subsidie voor de overige kosten, genoemd in artikel 5, eerste lid, in mindering
      gebracht.


