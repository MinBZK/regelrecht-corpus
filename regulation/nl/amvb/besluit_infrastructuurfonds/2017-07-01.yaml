  - number: '20'
    text: |-
      1 Bij de subsidieverlening wordt bepaald dat voorschotten worden verleend.

      2 De voorschotten worden betaald in het jaar waarop de subsidie betrekking heeft in dertien maandelijkse
      termijnbedragen, waarbij in de maand mei twee termijnbedragen worden betaald.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel20
  - number: '21'
    text: |-
      1 Binnen zes maanden na afloop van het jaar waarop de subsidie betrekking heeft dient de beheerder bij Onze
      Minister een aanvraag tot vaststelling van de subsidie in. De aanvraag gaat vergezeld van de jaarrekening en
      de financiële verantwoording van de kapitaallasten voortvloeiende uit investeringen, kosten van bediening en
      onderhoudskosten en de opbrengsten in de bestaande spoorweginfrastructuur. De jaarrekening en de financiële
      verantwoording dienen te zijn voorzien van een accountantsverklaring.

      2 De in het eerste lid bedoelde financiële verantwoording dient te worden opgesteld overeenkomstig het door Onze
      Minister vastgestelde informatieprofiel.

      3 Indien uit de accountantsverklaring blijkt, dat de beheerder ten onrechte kapitaallasten voortvloeiende uit
      investeringen, kosten van bediening en onderhoudskosten of opbrengsten ten laste onderscheidenlijk ten gunste van
      de door hem beheerde spoorweginfrastructuur heeft gebracht, brengt de beheerder in de jaarrekening en de financiële
      verantwoording de nodige correcties aan.

      4 Onze Minister beslist op de aanvraag tot het vaststellen van de subsidie binnen zes maanden na ontvangst van
      de aanvraag.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel21
  - number: '22'
    text: Bij ministeriële regeling kan Onze Minister nadere regels geven met betrekking tot deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel22
  - number: '28'
    text: |-
      1 In afwijking van de paragrafen 2 en 3 kan Onze Minister voor:

      a. beheer en onderhoud aan wegen, die op 1 januari 1994 in beheer waren bij het Rijk en nadien in beheer zijn
      gekomen bij een provincie, een gemeente of een waterschap, of

      b. aanleg en beheer en onderhoud van vaarwegen, ten behoeve van de binnenvaart, die in beheer zijn bij een
      provincie, een gemeente of een waterschap, aan die provincie, die gemeente of dat waterschap op aanvraag een
      subsidie verstrekken. [Artikel 5, eerste lid][ref1], is van overeenkomstige toepassing.

      2 Onze Minister kan ter uitwerking van het eerste lid bij ministeriële regeling nadere regels geven.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel5
