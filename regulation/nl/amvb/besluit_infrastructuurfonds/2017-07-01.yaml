        bwb_id: BWBR0006264
        artikel: '5'
        paragraaf: '2'
  - number: 2.2.c
    text: |-
      kosten van onderhoud aan wegen in beheer bij anderen dan het Rijk, tenzij het betreft onderhoud verricht op verzoek
      van het Rijk, dan wel onderhoud, als bedoeld in [artikel 28, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel28
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel2
    references:
