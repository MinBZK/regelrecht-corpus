  - number: 16a.5
    text: |-
      Indien voor een project waarvoor krachtens het eerste lid een subsidie is verstrekt, uiteindelijk een subsidie als
      bedoeld in [artikel 4, eerste lid][ref1], wordt verleend, brengt Onze Minister het subsidiebedrag, bedoeld in het
      eerste lid, in mindering op de subsidie, bedoeld in [artikel 4, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006264#Artikel4
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0006264
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006264
        artikel: '4'
        paragraaf: '2'
  - number: 16aa.1
    text: |-
      Onze Minister kan voor een verkenning die is opgenomen in een verkenningenprogramma dat deel uitmaakt van het
      meerjarenprogramma op aanvraag een subsidie verlenen voor te maken kosten van studies of onderzoeken.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel16aa
  - number: 16aa.2
    text: |-
      Bij een aanvraag om een subsidie als bedoeld in het eerste lid verstrekt de aanvrager Onze Minister de volgende
      gegevens en bescheiden:
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel16aa
  - number: 16aa.2.a
    text: de opzet van studies of onderzoeken;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel16aa
  - number: 16aa.2.b
    text: een beschrijving op hoofdlijnen van het verkeers- en vervoerprobleem en van mogelijke oplossingen;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel16aa
  - number: 16aa.2.c
    text: een kostenraming met een tijdschema van de te verrichten studies of onderzoeken;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel16aa
  - number: 16aa.2.d
    text: een opgave van de kostenelementen die ten laste van andere kostendragers kunnen worden gebracht;
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel16aa
  - number: 16aa.2.e
    text: inzicht in het voorgenomen verkeers- en vervoerbeleid.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel16aa
  - number: 16aa.3
    text: De subsidie bedraagt ten hoogste vijftig procent van de op grond van het eerste lid in aanmerking komende kosten.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel16aa
  - number: 16aa.4
    text: |-
      Onze Minister kan bij zijn beslissing als bedoeld in het eerste lid de in dat lid bedoelde kosten nader
      specificeren, dan wel de subsidie in afwijking van het derde lid verlenen in de vorm van een vast subsidiebedrag,
      dat echter niet hoger mag zijn dan vijftig procent van de op grond van het eerste lid in aanmerking komende kosten.
    url: https://wetten.overheid.nl/BWBR0006264/2017-07-01#Artikel16aa
  - number: 16aa.5
    text: |-
      De [artikelen 4, tweede lid][ref1], [6, tweede en derde lid][ref2], [7, eerste, tweede en vierde lid][ref3],
      [10][ref4], [12, eerste lid][ref5], [13][ref6], [14][ref7] en [14a][ref8] zijn van overeenkomstige
      toepassing, met dien verstande dat wanneer de subsidie in de vorm van een vast subsidiebedrag is verleend geen
      accountantsverklaring behoeft te worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006264#Artikel6
