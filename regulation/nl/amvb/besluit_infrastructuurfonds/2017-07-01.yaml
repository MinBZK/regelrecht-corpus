  - number: 16d.3
    text: |-
      De [artikelen 5][ref1], [7][ref2], [9, eerste lid, onderdelen a, c en d, tweede en derde lid][ref3],
      [13 tot en met 14a][ref4], en [16a tot en met 16b][ref5], zijn van overeenkomstige toepassing, met dien verstande
      dat, indien een subsidie als bedoeld in het eerste lid betrekking heeft op een projectgebonden onderzoek ten
      behoeve van de veiligheid van het wegverkeer de hoogte van de subsidie vijftig procent bedraagt van de kosten die
      overeenkomstig [artikel 5][ref6] voor vergoeding in aanmerking komen.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006264#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0006264#Artikel9
