        artikel: '28'
        paragraaf: '6'
  - number: '2.3'
    text: |-
      Uit het fonds kunnen subsidies worden verstrekt op grond van de volgende wetten en regelingen: - [Deltawet][ref1]
        - Uitkeringsregeling bestrijding verontreiniging rijkswateren
        - [Regeling bijzondere subsidies waterkeren en waterbeheren][ref2]
        - [Tijdelijke bijdrageregeling spoorwegaansluitingen][ref3]
        - [Tijdelijke beleidsregeling bijdragen vaarwegaansluitingen][ref4]
        - [Regeling subsidies uitvoeringsprogramma duurzaam veilig][ref5]
        - Subsidieregeling transferpunten
        - [Subsidieregeling openbare inland terminals][ref6]
        - [Subsidieregeling bedrijfsgebonden vaarwegaansluitingen][ref7]
        - [Tijdelijke regeling eenmalige subsidies baggerplannen bebouwd gebied][ref8]
        - [Regeling eenmalige uitkering baggerwerkzaamheden bebouwd gebied][ref9]
        - [Tijdelijke Stimuleringsregeling verwerking baggerspecie][ref10]
        - [Tijdelijke regeling eenmalige uitkering bestrijding regionale wateroverlast][ref11]
        - [Regeling eenmalige uitkering spoorse doorsnijdingen][ref12]
        - Subsidieregeling Zuidas
        - Subsidieregeling ERTMS.


