  - number: '6'
    text: |-
      1 Een aanvraag om een subsidie voor een groot project wordt slechts in behandeling genomen indien dat project
      is opgenomen in een realisatieprogramma dat deel uitmaakt van het meerjarenprogramma. In bijzondere gevallen kan
      Onze Minister besluiten de aanvraag reeds in behandeling te nemen voordat dat project in een realisatieprogramma
      is opgenomen.

      2 Onze Minister beslist op een aanvraag om een subsidie als bedoeld in [artikel 4, eerste lid][ref1], binnen zes
      maanden na de indiening daarvan. Hij kan daarbij van de aanvraag afwijken.

      3 Indien als gevolg van de complexiteit van de te behandelen aanvraag Onze Minister niet binnen de in het tweede
      lid genoemde termijn kan beslissen, kan hij deze termijn twee keer met telkens ten hoogste zes maanden verlengen.
      Onze Minister doet hiervan terstond mededeling aan de aanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel4
