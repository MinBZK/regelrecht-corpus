  - number: 3a
    text: |-
      1 Onze Minister stelt ieder begrotingsjaar een subsidieplafond vast voor op grond van dit besluit te verstrekken
      subsidies.

      2 Onze Minister kan afzonderlijke subsidieplafonds vaststellen voor de onderscheiden onderdelen van dit besluit.

      3 Onze Minister verdeelt het beschikbare bedrag in de volgorde van ontvangst van de aanvragen, met dien verstande
      dat wanneer de aanvrager krachtens [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad
      de aanvraag aan te vullen, de dag waarop de aanvraag is aangevuld, met betrekking tot de verdeling, als datum van
      ontvangst geldt.

      4 Onze Minister kan in bijzondere gevallen bij de beschikking tot weigering van het verlenen van subsidie op
      grond van [artikel 4:25, tweede lid, van de Algemene wet bestuursrecht][ref2] bepalen dat in het daaropvolgende
      begrotingsjaar, zonder nieuwe indiening van de aanvraag, opnieuw een beschikking op de aanvraag wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel425
