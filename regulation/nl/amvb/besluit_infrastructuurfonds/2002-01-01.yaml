  - number: 28a
    text: |-
      1 Onze Minister kan uit het fonds op aanvraag een bijzondere subsidie verlenen ten behoeve van een experiment
      of demonstratieproject dat naar zijn oordeel noodzakelijk is voor de kennisverwerving en de ontwikkeling van het
      beleid op nationaal niveau op het terrein van infrastructuur.

      2 De subsidie strekt met inachtneming van [artikel 9, tweede lid][ref1], tot een gedeeltelijke tegemoetkoming
      in de kosten van het experiment of demonstratieproject. Tot de kosten worden gerekend de kosten, bedoeld in
      [artikel 5, eerste lid][ref2], alsmede de kosten van begeleiding, evaluatie en monitoring.

      3 Onze Minister houdt bij het bepalen van het subsidiebedrag rekening met het karakter van het experiment of het
      demonstratieproject en met de kosten die redelijkerwijs ten laste van de subsidie-ontvanger behoren te komen. Hij
      kan de subsidie verlenen in de vorm van een vast subsidiebedrag.

      4 De[ artikelen 4][ref3], [5][ref4], [6, tweede en derde lid][ref5], [7][ref6], [8][ref7],
      [9, tweede lid][ref8], en [10][ref9] tot en met [14a][ref10] zijn van overeenkomstige toepassing, met dien
      verstande dat wanneer de subsidie in de vorm van een vast subsidiebedrag is verleend geen accountantsverklaring
      behoeft te worden ingediend.


