  - number: '2'
    text: |-
      1 Uit het fonds kunnen in ieder geval

      a. uitgaven worden gedaan ten behoeve van categorieën of onderdelen van infrastructuur, welke zijn opgenomen in de
      bij dit besluit behorende bijlage en

      b. subsidies worden verstrekt ten behoeve van categorieën of onderdelen van infrastructuur, welke zijn opgenomen
      in de bij dit besluit behorende bijlage, voorzover deze binnen de grenzen van de paragrafen 2 tot en met 7 van dit
      besluit passen.

      2 Uit het fonds worden geen uitgaven gedaan of subsidies verstrekt ten behoeve van:

      a. kosten van algemeen bestuurlijke aard;

      b. kosten voor het doen van een aanvraag om een subsidie, anders dan bedoeld in [artikel 5][ref1];

      c. kosten van onderhoud aan wegen in beheer bij anderen dan het Rijk, tenzij het betreft onderhoud verricht op
      verzoek van het Rijk, dan wel onderhoud, als bedoeld in [artikel 28, eerste lid][ref2].

      3 Uit het fonds kunnen subsidies worden verstrekt op grond van de volgende wetten en regelingen:

        - [Deltawet][ref3]
        - [Uitkeringsregeling][ref4] bestrijding verontreiniging rijkswateren
        - Regeling bijzondere subsidies waterkeren en waterbeheren
        - Tijdelijke bijdrageregeling spoorwegaansluitingen
        - Tijdelijke beleidsregeling bijdragen vaarwegaansluitingen
        - Regeling subsidies uitvoeringsprogramma duurzaam veilig
        - Subsidieregeling transferpunten
        - Subsidieregeling openbare inland terminals
        - Subsidieregeling bedrijfsgebonden vaarwegaansluitingen.


