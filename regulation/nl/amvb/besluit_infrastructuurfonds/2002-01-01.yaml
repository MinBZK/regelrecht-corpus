  - number: '4'
    text: |-
      1 Bij een aanvraag om een subsidie voor een groot project uit het fonds verstrekt de aanvrager met betrekking tot
      dat project Onze Minister de volgende gegevens en bescheiden:

      a. een beschrijving op hoofdkenmerken en het programma van eisen;

      b. tekeningen van het project;

      c. een kostenraming, met een tijdschema van de uitvoering en de daarbij behorende uitgaven van het werk;

      d. een opgave van de kostenelementen, die ten laste van andere kostendragers kunnen worden gebracht;

      e. een raming van de inkomsten uit het project;

      f. een opgave van de stand van zaken met betrekking tot de voor de uitvoering noodzakelijke wettelijke procedures;

      g. een raming van het gebruik, dat van het beoogde project zal worden gemaakt en de verwachte effecten daarvan;

      h. andere door Onze Minister noodzakelijk geachte gegevens.

      2 Een subsidie voor een groot project gelegen in een samenwerkingsgebied kan uitsluitend worden aangevraagd door
      het dagelijks bestuur, een publiekrechtelijk rechtspersoon, niet zijnde een gemeente, provincie of een waterschap,
      of een privaatrechtelijk rechtspersoon, niet zijnde een regionaal of lokaal vervoerbedrijf welke in het betrokken
      samenwerkingsgebied openbaar vervoer verricht.

      3 De aanvrager van een subsidie voor een groot project gelegen in een samenwerkingsgebied verschaft Onze Minister
      tevens inzicht in het voorgenomen verkeers- en vervoerbeleid, dat daarvoor van belang is.

      4 Indien een subsidie voor een groot project gelegen in een samenwerkingsgebied wordt aangevraagd door het
      dagelijks bestuur wordt het inzicht, bedoeld in het derde lid, verschaft door overlegging van een regionaal
      verkeers- en vervoerplan.

      5 Indien een subsidie voor een groot project gelegen buiten een samenwerkingsgebied wordt aangevraagd wordt het
      inzicht in het voorgenomen verkeers- en vervoerbeleid, dat daarvoor van belang is, verschaft door overlegging van
      een regionaal verkeers- en vervoerplan, een gemeentelijk verkeers- en vervoerplan, een provinciaal verkeers- en
      vervoerplan of van een besluit van provinciale staten, dat inzicht verschaft in de onderlinge samenhang tussen het
      betrokken project en het provinciaal verkeers- en vervoerbeleid.

      6 Ingeval een gemeentelijk verkeers- en vervoerplan wordt overgelegd wordt tevens een verklaring van provinciale
      staten overgelegd dat het betrokken project past binnen het bestaande dan wel toekomstige provinciaal verkeers-
      en vervoerbeleid.

      7 Onze Minister kan bij ministeriële regeling met betrekking tot de in het eerste lid bedoelde gegevens en
      bescheiden nadere regels geven.
    url: https://wetten.overheid.nl/BWBR0006264/2002-01-01#Artikel4
  - number: '5'
    text: |-
      1 Voor een subsidie als bedoeld in [artikel 4, eerste lid][ref1] ten behoeve van investeringen in infrastructuur
      komen in aanmerking de kosten van:

      a. studies voor het betrokken project voor zover die door Onze Minister aanvaardbaar worden geacht;

      b. verwerving van een onroerende zaak voor zover door Onze Minister aanvaardbaar geacht;

      c. vergunningen en leges voor zover door Onze Minister aanvaardbaar geacht;

      d. bouwrente; deze is gelijk aan de rente van de meest recente staatslening op het moment van gunning van het werk;
      het bedrag en de termijn, waarover de bouwrente vergoed wordt, behoeft de goedkeuring van Onze Minister;

      e. materialen;

      f. werkzaamheden van aanleg, bouw, wijziging of inrichting van de betrokken infrastructuur;

      g. bijkomende voorzieningen nodig om de betrokken infrastructuur na voltooiing zijn functie te kunnen laten
      vervullen;

      h. met het project samenhangende door Onze Minister redelijk geachte schadevergoedingen aan derden;

      i. voorlichting over de uitvoering van het project als begeleiding gedurende de bouw;

      j. de krachtens de [Wet op de Omzetbelasting 1968][ref2] verschuldigde belasting voor zover die niet kan worden
      teruggevorderd;

      k. voorbereiding, administratie en toezicht voor zover het betreft projecten ten behoeve van het openbaar vervoer,
      van het goederenvervoer over de rail en van vaarwegen.

      2 De kosten, bedoeld in het eerste lid, worden slechts tot een in redelijkheid als noodzakelijk te beschouwen
      hoogte in aanmerking genomen.

      3 De kosten bedoeld in het eerste lid, onderdeel *k*, bedragen voor projecten ten behoeve van het openbaar vervoer
      en van het goederenvervoer zestien procent en voor projecten ten behoeve van vaarwegen tien procent van de kosten,
      bedoeld in het eerste lid, onderdelen *e, f* en *g*.

      4 In afwijking van het bepaalde in het derde lid stelt Onze Minister, indien het een subsidie betreft voor
      projecten ten behoeve van het landelijk railnet, de in dat lid genoemde kosten per soort van investering nader
      vast.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002629
