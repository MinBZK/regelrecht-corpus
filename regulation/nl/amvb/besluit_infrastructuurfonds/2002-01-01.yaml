  - number: 16a
    text: |-
      1 Onze Minister kan voor een project dat is opgenomen in een planstudieprogramma dat deel uitmaakt van het
      meerjarenprogramma op aanvraag een subsidie verlenen voor naar het oordeel van Onze Minister in de planstudiefase
      redelijkerwijs te maken kosten als bedoeld in [artikel 5, eerste lid, onderdelen a, b of k][ref1]. Kosten van
      studies voor het regionale of lokale wegennet komen niet voor subsidie in aanmerking. In bijzondere gevallen kan
      Onze Minister besluiten de aanvraag reeds in behandeling te nemen voordat dat project in een planstudieprogramma
      is opgenomen.

      2 De subsidie bedraagt voor projecten ten behoeve van het landelijk railnet ten hoogste honderd procent en voor
      andere projecten ten hoogste vijftig procent van de op grond van het eerste lid in aanmerking komende kosten.

      3 De subsidie-ontvanger neemt geen beslissing om het project niet tot uitvoering te brengen dan na instemming van
      Onze Minister.

      4 De [artikelen 4, eerste, tweede en zevende lid][ref2], [6, tweede en derde lid][ref3],
      [7, eerste tot en met derde lid][ref4], [10][ref5], [11, tweede lid][ref6], [12, eerste lid][ref7], [13][ref8],
      [14][ref9] en [14a][ref10] zijn van overeenkomstige toepassing.

      5 Indien voor een project waarvoor krachtens het eerste lid een subsidie is verstrekt, uiteindelijk een subsidie
      als bedoeld in [artikel 4, eerste lid][ref11], wordt verleend, brengt Onze Minister het subsidiebedrag, bedoeld in
      het eerste lid, in mindering op de subsidie, bedoeld in [artikel 4, eerste lid][ref12].


