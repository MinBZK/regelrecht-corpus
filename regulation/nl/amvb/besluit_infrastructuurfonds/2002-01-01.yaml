  - number: '29'
    text: |-
      Totdat de desbetreffende middelen worden toegevoegd aan het Provinciefonds en het Gemeentefonds, verstrekt Onze
      Minister aan de provincie een doeluitkering voor de bekostiging van overige projecten, dan wel van het aandeel
      van de aanvrager van een subsidie als bedoeld in artikel 4, eerste lid, in een groot project dat buiten een
      samenwerkingsgebied in een provincie is gelegen.
    url: https://wetten.overheid.nl/BWBR0006264/2002-01-01#Artikel29
  - number: '30'
    text: |-
      1 Gedeputeerde staten en burgemeester en wethouders van de in de provincie gelegen gemeenten, met uitzondering
      van die gemeenten die zijn gelegen in een samenwerkingsgebied, stellen op basis van overleg en op basis van
      vastgestelde en in voorbereiding zijnde regionale verkeers- en vervoerplannen en provinciale plannen, voor
      zover deze betrekking hebben op verkeer en vervoer, een lijst op van overige projecten die in de eerstvolgende
      jaren worden uitgevoerd, waarbij per project wordt aangegeven welk bedrag in welk jaar uit de doeluitkering ter
      beschikking wordt gesteld.

      2 Alvorens toepassing te geven aan het eerste lid plegen gedeputeerde staten overleg met de naar hun oordeel
      betrokken waterschappen en andere publiekrechtelijke rechtspersonen, alsmede met de regionale vervoerbedrijven, die
      in de provincie, een samenwerkingsgebied uitgezonderd, het openbaar vervoer verrichten, omtrent hun wensen inzake
      op de lijst te plaatsen overige projecten.

      3 Alvorens toepassing te geven aan het eerste lid plegen burgemeester en wethouders overleg met de lokale
      vervoerbedrijven, die in de gemeente het openbaar vervoer verrichten, omtrent hun wensen inzake op de lijst te
      plaatsen overige projecten.

      4 Gedeputeerde staten bieden jaarlijks vóór 1 april provinciale staten de lijst van overige projecten aan, die zij
      tezamen met burgemeester en wethouders hebben opgesteld.

      5 Indien het overleg met burgemeester en wethouders niet heeft geresulteerd in een gezamenlijke lijst, stellen
      gedeputeerde staten zelf een lijst op, die zij jaarlijks vóór 1 april aanbieden aan provinciale staten.

      6 Provinciale staten stellen jaarlijks vóór 1 mei de lijst van overige projecten vast. Zij geven op de lijst per
      project aan welk bedrag in welk jaar uit de doeluitkering ter beschikking wordt gesteld. De lijst kan voor één of
      meer jaren worden vastgesteld.

      7 Het besluit tot vaststelling van de lijst bevat tevens de beschikkingen tot verlening van de subsidie voor de op
      de lijst geplaatste projecten.

      8 Provinciale staten kunnen de lijst herzien door het schrappen van geplaatste projecten of door projecten aan de
      lijst toe te voegen. Een project kan alleen worden geschrapt als het project niet binnen één jaar na dagtekening
      van de beschikking, bedoeld in het zevende lid, in uitvoering is genomen. Op de herziening zijn het eerste tot en
      met het zevende lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0006264/2002-01-01#Artikel30
  - number: '31'
    text: |-
      1 Onze Minister verstrekt voor de geldingsduur van de overeenkomstig de [afdelingen 2](onbekend), [3](onbekend)
      en [7][ref1] van [hoofdstuk 2 van de Kaderwet bestuur in verandering][ref2] vastgestelde gemeenschappelijke
      regeling aan een regionaal openbaar lichaam een doeluitkering voor de bekostiging van overige projecten in het
      samenwerkingsgebied danwel van het eigen aandeel in een groot project.

      2 Indien de gemeenschappelijke regeling, bedoeld in het eerste lid, krachtens
      [artikel 31, derde lid, van de Kaderwet bestuur in verandering][ref3] voor een bepaalde periode is verlengd,
      verstrekt Onze Minister aan het regionaal openbaar lichaam in het eerste jaar van die periode voor die gehele
      periode opnieuw een doeluitkering voor de bekostiging van overige projecten in het samenwerkingsgebied.

      3 Voor zover in een samenwerkingsgebied wegen gelegen zijn die in beheer zijn bij de provincie of een waterschap
      pleegt het dagelijks bestuur alvorens besluiten te nemen omtrent de besteding van een doeluitkering als bedoeld in
      het eerste en tweede lid overleg met die provincie of dat waterschap in haar onderscheidenlijk zijn hoedanigheid
      als wegbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0006620#Afdeling7
      [ref2]: https://wetten.overheid.nl/BWBR0006620#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0006620#Artikel31
