  - number: '17'
    text: |-
      In afwijking van § 2 zijn voor het verstrekken van subsidies aan een beheerder van landelijke railinfrastructuur
      voor de kapitaallasten voortvloeiende uit de investeringen in die railinfrastructuur en voor het onderhoud van die
      railinfrastructuur de bepalingen van deze paragraaf van toepassing.
    url: https://wetten.overheid.nl/BWBR0006264/2002-01-01#Artikel17
  - number: '18'
    text: |-
      De beheerder dient jaarlijks uiterlijk vier maanden voor de aanvang van het kalenderjaar waarop de subsidie
      betrekking heeft, een aanvraag om een subsidie in, waarbij hij de volgende gegevens verstrekt:

      a. een raming van de te verwachten wijziging van de kapitaallasten ten opzichte van het voorgaande jaar, als gevolg
      van een te verwachten wijziging in de resterende schuld en de daarover berekende rente ten gevolge van de niet à
      fonds perdu gefinancierde railinfrastructuur;

      b. een raming van de te verwachten wijziging van de onderhoudskosten ten opzichte van het voorgaande jaar, als
      gevolg van een te verwachten wijziging in omvang van de bestaande railinfrastructuur en als gevolg van een te
      verwachten wijziging van de mate van gebruik van de bestaande railinfrastructuur;

      c. een raming van de te verwachten opbrengsten van vergoedingen van gebruikers van de railinfrastructuur;

      d. andere door Onze Minister noodzakelijk geachte gegevens.
    url: https://wetten.overheid.nl/BWBR0006264/2002-01-01#Artikel18
  - number: '19'
    text: |-
      1 Onze Minister verleent jaarlijks de subsidie voor de aanvang van het kalenderjaar waarop de subsidie betrekking
      heeft.

      2 Bij de verlening van de subsidie wordt uitgegaan van de kapitaallasten, van de kosten van onderhoud en de omvang
      van de opbrengsten van vergoedingen van gebruikers, in een door hem te bepalen basisjaar. De subsidie kan worden
      aangepast aan de wijzigingen ten opzichte van het basisjaar als gevolg van:

      a. de omvang van landelijke railinfrastructuur;

      b. het niveau van instandhoudingskwaliteit, voor zover Onze Minister daarom verzoekt;

      c. het gebruik van landelijke railinfrastructuur;

      d. de omvang van de opbrengsten van vergoedingen van gebruikers van landelijke railinfrastructuur;

      e. de evaluatie van de algemene overeenkomst inzake de aanraking van infrastructuur;

      f. opgebouwde overschotten danwel tekorten;

      g. het loon- en prijspeil.

      3 Kapitaallasten voortvloeiend uit projecten, die het Rijk reeds overeenkomstig [paragraaf 2][ref1] heeft vergoed,
      worden in mindering gebracht op de totale kapitaallasten. De subsidie heeft betrekking op de dan resterende
      kapitaallasten.

      4 De verplichtingen voortvloeiend uit de door Onze Minister toegestane leningfinanciering van projecten, bedoeld in
      [paragraaf 2][ref2], worden afzonderlijk vergoed.

      5 Onze Minister kan besluiten tot het vaststellen van een nieuw basisjaar met inachtneming van de dan geldende
      omstandigheden.

      6 Onze Minister verleent de subsidie met inachtneming van eisen van soberheid en doelmatigheid. Hij kan bij de
      verlening van de subsidie bepalen dat het subsidiebedrag tussentijds danwel bij de vaststelling van de subsidie kan
      worden aangepast aan de ontwikkelingen van het loon- en prijspeil. Artikel 7, derde lid, is van toepassing.

      7 Onverminderd het zesde lid kan Onze Minister het subsidiebedrag tussentijds danwel bij de vaststelling van de
      subsidie aanpassen wanneer een wijziging van het bijdragesysteem daartoe noodzaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Paragraaf2
      [ref2]: https://wetten.overheid.nl/BWBR0006264#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0006264/2002-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006264
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006264
        paragraaf: '2'
  - number: '20'
    text: |-
      1 Bij de subsidieverlening wordt bepaald dat voorschotten worden verleend.

      2 De voorschotten worden betaald in het jaar waarop de subsidie betrekking heeft in dertien maandelijkse
      termijnbedragen, waarbij in de maand mei twee termijnbedragen worden betaald.
    url: https://wetten.overheid.nl/BWBR0006264/2002-01-01#Artikel20
  - number: '21'
    text: |-
      1 Binnen zes maanden na afloop van het jaar waarop de subsidie betrekking heeft dient de beheerder bij Onze
      Minister een aanvraag tot vaststelling van de subsidie in. De aanvraag gaat vergezeld van de jaarrekening en
      de financiële verantwoording van de kapitaallasten voortvloeiende uit investeringen en onderhoudskosten en de
      opbrengsten in de bestaande railinfrastructuur. De jaarrekening en de financiële verantwoording dienen te zijn
      voorzien van een accountantsverklaring.

      2 De in het eerste lid bedoelde financiële verantwoording dient te worden opgesteld overeenkomstig het door Onze
      Minister vastgestelde informatieprofiel.

      3 Indien uit de accountantsverklaring blijkt, dat de beheerder ten onrechte kapitaallasten voortvloeiende uit
      investeringen en onderhoudskosten of opbrengsten ten laste onderscheidenlijk ten gunste van de door hem beheerde
      railinfrastructuur heeft gebracht, brengt de beheerder in de jaarrekening en de financiële verantwoording de nodige
      correcties aan.

      4 Onze Minister beslist op de aanvraag tot het vaststellen van de subsidie binnen zes maanden na ontvangst van
      de aanvraag.
    url: https://wetten.overheid.nl/BWBR0006264/2002-01-01#Artikel21
  - number: '22'
    text: Bij ministeriële regeling kan Onze Minister nadere regels geven met betrekking tot deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0006264/2002-01-01#Artikel22
  - number: '28'
    text: |-
      1 In afwijking van de paragrafen 2 en 3 kan Onze Minister voor:

      a. beheer en onderhoud aan wegen, die op 1 januari 1994 in beheer waren bij het Rijk en nadien in beheer zijn
      gekomen bij een provincie, een gemeente of een waterschap, of

      b. aanleg en beheer en onderhoud van vaarwegen, ten behoeve van de binnenvaart, die in beheer zijn bij een
      provincie, een gemeente of een waterschap, aan die provincie, die gemeente of dat waterschap op aanvraag een
      subsidie verstrekken. [Artikel 5, eerste lid][ref1], is van overeenkomstige toepassing.

      2 Onze Minister kan ter uitwerking van het eerste lid bij ministeriële regeling nadere regels geven.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel5
    url: https://wetten.overheid.nl/BWBR0006264/2002-01-01#Artikel28
