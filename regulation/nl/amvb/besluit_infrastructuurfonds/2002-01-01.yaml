  - number: '7'
    text: |-
      1 Onze Minister verleent de subsidie met inachtneming van eisen van soberheid en doelmatigheid. Hij kan bij de
      verlening van de subsidie bepalen dat het subsidiebedrag tussentijds danwel bij de vaststelling van de subsidie kan
      worden aangepast aan de ontwikkelingen van het loon- en prijspeil.

      2 De subsidie wordt verleend voor de werkelijk te maken kosten, tenzij de subsidie in de vorm van een vast
      subsidiebedrag wordt verleend.

      3 Bij het verlenen van de subsidie worden de kosten, welke naar het oordeel van Onze Minister redelijkerwijs ten
      laste van andere kostendragers kunnen worden gebracht, buiten beschouwing gelaten.

      4 Niet voor een subsidie komen in aanmerking de kosten van wegverharding in geval van achterstallig onderhoud aan
      het gehele betrokken wegdek; in geval van achterstallig onderhoud aan een gedeelte van het betrokken wegdek wordt
      de subsidie naar evenredigheid met de mate van achterstallig onderhoud verminderd.
    url: https://wetten.overheid.nl/BWBR0006264/2002-01-01#Artikel7
  - number: '9'
    text: |-
      1 Wanneer een subsidie als bedoeld in [artikel 4, eerste lid][ref1], voor een investering wordt verleend, bedraagt
      deze met inachtneming van het tweede lid als percentage van de op grond van [artikel 5][ref2] in aanmerking komende
      kosten voor:

      a. het landelijk railnet honderd procent; indien het infrastructuur betreft hoofdzakelijk ten behoeve van het
      internationale vervoer over railwegen kan Onze Minister een ander percentage vaststellen;

      b. de regionale of lokale openbaar vervoer infrastructuur, waaronder infrastructuur ten behoeve van bussen,
      vijfennegentig procent;

      c. aanleg van een stationsplein met inbegrip van de daarbij behorende voorzieningen alsmede dergelijke
      voorzieningen op een bestaand stationsplein vijftig procent;

      d. voorzieningen aan het regionale of lokale wegennet of fietswegennet vijftig procent;

      e. voorzieningen met betrekking tot de veiligheid van het wegverkeer vijftig procent; indien de subsidie bestemd
      is voor herinrichting van verblijfsgebieden als 30-km zone, dient de aaneengesloten oppervlakte van dit gebied
      minimaal tien hectare te bedragen;

      f. studies als bedoeld in [artikel 5, eerste lid, onderdeel a][ref3], vijftig procent met een maximum van € 2 270
      000 voor zover de kosten niet als bestuurskosten van de aanvrager kunnen worden aangemerkt;

      g. aanleg van een terminal ten behoeve van intermodaal vervoer vijfentwintig procent.

      2 Bij de vergoeding voor de verlegging of vervanging van kabels of leidingen wordt rekening gehouden met het
      juridische regime, waaronder de kabels of leidingen liggen. Indien bij de verlegging de kabels of leidingen
      gelijktijdig worden vervangen wordt een aftrek toegepast, welke wordt berekend op basis van de resterende
      economische levensduur van de kabels of leidingen.

      3 In afwijking van het eerste lid, onderdeel *a*, kan Onze Minister voor de subsidie voor een investering ten
      behoeve van railinfrastructuur uitsluitend bestemd voor vervoer van goederen een lager percentage vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006264#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0006264#Artikel5
