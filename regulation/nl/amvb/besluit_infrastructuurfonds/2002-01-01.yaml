  - number: 16c
    text: |-
      Een subsidie voor een overig project kan uitsluitend bij Onze Minister worden aangevraagd door:

      a. andere publiekrechtelijke rechtspersonen dan een provincie, gemeente, waterschap en een regionaal openbaar
      lichaam ingeval het project landelijke betekenis heeft;

      b. privaatrechtelijke rechtspersonen ingeval het project landelijke betekenis heeft;

      c. een beheerder van landelijke railinfrastructuur;

      d. Publiekrechtelijke rechtspersonen en privaatrechtelijke rechtspersonen ten behoeve van investeringen in en
      onderhoud van infrastructurele werken buiten Nederland doch binnen Europa.
    url: https://wetten.overheid.nl/BWBR0006264/2002-01-01#Artikel16c
  - number: 16d
    text: |-
      1 Aanvragen om een subsidie voor overige projecten vinden plaats overeenkomstig [artikel 4][ref1].

      2 Onze Minister beslist op een aanvraag als bedoeld in het eerste lid overeenkomstig de[ artikelen 6][ref2],
      [10][ref3], [11][ref4] en [12][ref5] met dien verstande dat in [artikel 10][ref6] in plaats van 'groot project'
      moet worden gelezen: project, waarvan de geraamde kosten op grond van [artikel 5][ref7] meer bedragen dan € 5 000
      000.

      3 De[artikelen 5][ref8], [7][ref9], [9][ref10], [13][ref11], [14][ref12], [14a][ref13], [16a][ref14],
      [16aa][ref15] en [16b][ref16] zijn van overeenkomstige toepassing, met dien verstande dat:

      a. in artikel 9, eerste lid, onderdeel *b*, in plaats van 'vijfennegentig procent' moet worden gelezen: tachtig
      procent;

      b. indien een subsidie als bedoeld in het eerste lid betrekking heeft op een projectgebonden onderzoek ten
      behoeve van de veiligheid van het wegverkeer de hoogte van de subsidie vijftig procent bedraagt van de kosten die
      overeenkomstig [artikel 5][ref17] voor vergoeding in aanmerking komen.


