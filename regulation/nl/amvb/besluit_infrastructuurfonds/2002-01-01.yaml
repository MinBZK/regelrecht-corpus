  - number: '12'
    text: |-
      1 Op een aanvraag om een subsidie als bedoeld in [artikel 4, eerste lid][ref1], beslist Onze Minister afwijzend
      indien:

      a. naar zijn oordeel ernstige twijfel bestaat of de met het betrokken project beoogde doelstellingen worden
      bereikt;

      b. het project naar zijn oordeel onvoldoende bijdraagt of in verhouding tot de kosten onvoldoende bijdraagt aan
      het bereiken van de doelstellingen van het vigerende Structuurschema Verkeer en Vervoer, de vigerende Nota op de
      Ruimtelijke Ordening en het vigerende nationale milieubeleidsplan;

      c. naar zijn oordeel het betrokken project niet past binnen het geldende meerjarenprogramma infrastructuur en
      transport;

      d. de aanvrager failliet is verklaard of aan hem surséance van betaling is verleend, dan wel een verzoek daartoe
      bij de rechtbank is ingediend;

      2 Tenzij Onze Minister in bijzondere gevallen anders beslist, wijst hij een aanvraag af, indien op het tijdstip,
      waarop de aanvraag wordt ingediend, reeds met de uitvoering van het project, waarop de aanvraag betrekking heeft,
      is begonnen.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel4
    url: https://wetten.overheid.nl/BWBR0006264/2002-01-01#Artikel12
