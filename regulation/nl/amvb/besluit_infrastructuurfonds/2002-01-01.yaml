  - number: '13'
    text: |-
      1 Bij de subsidieverlening kan worden bepaald dat één of meer voorschotten worden verleend.

      2 Indien subsidie wordt verleend voor meer dan één kalenderjaar wordt bij de subsidieverlening het bedrag
      aangegeven dat per kalenderjaar aan voorschotten kan worden verleend.

      3 Tenzij bij de subsidieverlening anders wordt bepaald, worden voorschotten verleend per kwartaal. Voorschotten
      worden verleend op basis van in te dienen declaraties die zijn afgestemd op de gerealiseerde en geplande
      voortgang van het werk en die zijn onderbouwd door een voortgangsrapportage van het betrokken project. De
      voortgangsrapportage bevat in ieder geval een overzicht van de gerealiseerde werkzaamheden, een planning van de nog
      te verrichten werkzaamheden en een raming van de nog te maken kosten.

      4 Indien een project slechts gedeeltelijk uit het fonds wordt betaald, is het bedrag dat aan voorschotten wordt
      verleend niet hoger dan het aandeel van het fonds in de financiering van het project.

      5 De subsidie-ontvanger dient jaarlijks binnen vier maanden na afloop van het betrokken kalenderjaar een financiële
      verantwoording, voorzien van een accountants-verklaring, in. Onze Minister kan op verzoek van de subsidie-ontvanger
      de termijn twee keer met telkens ten hoogste twee maanden verlengen. Artikel 14, tweede en derde lid, is van
      overeenkomstige toepassing.

      6 In geval van snellere voortgang van het werk dan voorzien bij de subsidieverlening kan, in afwijking van het
      tweede lid, het bedrag dat aan voorschotten kan worden verleend, worden verhoogd voor zover dat inpasbaar is binnen
      de begroting van het fonds. De rentekosten van de voorfinanciering van de versnelling worden niet vergoed.

      7 Een voorschot wordt betaald binnen acht weken na ontvangst van de declaratie, bedoeld in het derde lid.

      8 Indien als gevolg van onvoorziene omstandigheden de werkelijk gemaakte kosten hoger uitvallen dan het bedrag
      waarvoor subsidie is verleend, kan de subsidie-ontvanger een suppletoire aanvraag indienen. De artikelen 4 tot en
      met 9 en 12 zijn voor zover nodig van toepassing.
    url: https://wetten.overheid.nl/BWBR0006264/2002-01-01#Artikel13
  - number: '14'
    text: |-
      1 Binnen een jaar nadat het betrokken project in gebruik is genomen doet de subsidie-ontvanger aan Onze Minister
      daarvan mededeling. De mededeling gaat vergezeld van een aanvraag tot vaststelling van de subsidie, alsmede van een
      eindverslag en een financiële verantwoording van de totale projectkosten, voorzien van een accountantsverklaring
      alsmede een slotdeclaratie. Onze Minister kan op verzoek van de subsidie-ontvanger de termijn met ten hoogste zes
      maanden verlengen.

      2 De in het eerste lid bedoelde financiële verantwoording en accountantsverklaring dienen te worden opgesteld
      overeenkomstig de in [artikel 4, eerste lid, onder c][ref1], bedoelde kostenraming respectievelijk de door Onze
      Minister vast te stellen controle-instructie.

      3 Met betrekking tot de financiële controle kan Onze Minister bij ministeriële regeling nadere regels geven.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel4
    url: https://wetten.overheid.nl/BWBR0006264/2002-01-01#Artikel14
    references:
