  - number: '32'
    text: |-
      1 Gedeputeerde staten en het dagelijks bestuur verschaffen Onze Minister de gegevens, die nodig zijn voor de
      toepassing van [artikel 36, eerste lid][ref1].

      2 Het gemeentebestuur en het bestuur van een waterschap verschaffen gedeputeerde staten en het dagelijks bestuur de
      gegevens die nodig zijn voor de uitvoering van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel36
    url: https://wetten.overheid.nl/BWBR0006264/2002-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0006264
        artikel: '36'
        paragraaf: '8'
  - number: '33'
    text: |-
      Onze Minister kan de doeluitkering aanpassen:

      a. aan de ontwikkelingen van het loon- en prijspeil;

      b. in het geval van wijziging van de beschikbare middelen, bedoeld in [artikel 36, derde lid, onderdeel ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel36
    url: https://wetten.overheid.nl/BWBR0006264/2002-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0006264
        artikel: '36'
        paragraaf: '8'
  - number: '36'
    text: |-
      1 Onze Minister berekent de omvang van de doeluitkering voor iedere provincie onderscheidenlijk voor ieder
      regionaal openbaar lichaam afzonderlijk, als percentage van de voor de doeluitkeringen gezamenlijk beschikbare
      middelen, overeenkomstig de volgende formule: P = [0,5 * Ir/It + 0,25 * Mr/Mt + 0,125 * Vr/Vt + 0,125 * Zr/Zt]
      * 100%.

      Hierin betekent:

      P: het percentage voor de desbetreffende provincie onderscheidenlijk het desbetreffende regionaal openbaar lichaam;

      Ir/It: de verhouding tussen het aantal inwoners van de gemeenten uit de twee meest verstedelijkte klassen in de
      provincie, uitgezonderd dat deel van de provincie dat samenvalt met een samenwerkingsgebied, onderscheidenlijk in
      het samenwerkingsgebied en dat aantal inwoners van Nederland op 1 januari van het meest recente jaar ten aanzien
      waarvan het Centraal Bureau voor de Statistiek de desbetreffende gegevens beschikbaar heeft, met dien verstande dat
      het aantal inwoners van gemeenten die behoren tot de zeer sterk stedelijke klasse met 5 wordt vermenigvuldigd;

      Mr/Mt: de verhouding tussen het jaarlijks gemiddelde aantal autokilometers in de provincie, uitgezonderd dat deel
      van de provincie dat samenvalt met een samenwerkingsgebied, onderscheidenlijk in het samenwerkingsgebied en dat
      aantal kilometers in Nederland, in de periode 1986-1992;

      Vr/Vt: de verhouding tussen het jaarlijks gemiddelde aantal personen, overleden ten gevolge van een
      verkeersongeval in de provincie, uitgezonderd dat deel van de provincie dat samenvalt met een samenwerkingsgebied,
      onderscheidenlijk in het samenwerkingsgebied en dat aantal in Nederland, in de periode 1990-1992;

      Zr/Zt: de verhouding tussen het jaarlijks gemiddelde aantal personen, opgenomen in een ziekenhuis ten
      gevolge van een verkeersongeval in de provincie, uitgezonderd dat deel van de provincie dat samenvalt met een
      samenwerkingsgebied, onderscheidenlijk in het samenwerkingsgebied en dat aantal in Nederland, in de periode 1990-
      1992.

      2 Onze Minister stelt de verhoudingsgetallen, bedoeld in het eerste lid, vast aan de hand van gegevens, verstrekt
      door het Centraal Bureau voor de Statistiek; hij stelt de gemeenten uit de meest verstedelijkte klassen vast aan de
      hand van het door het Centraal Bureau voor de Statistiek gepubliceerde gebiedsindelingenregister.

      3 Met betrekking tot de doeluitkering gelden voorts de volgende bepalingen:

      a. indien de beschikbare middelen op het begrotingsartikel, waarop de doeluitkering geboekt wordt, gewijzigd
      worden, kan Onze Minister deze wijziging laten doorwerken op de hoogte van de doeluitkering;

      b. het provinciaal bestuur onderscheidenlijk het dagelijks bestuur mag in enig jaar binnen de periode waarvoor de
      doeluitkering is verstrekt, gelden overhouden van de doeluitkering voor het doen van investeringen in een later
      jaar; het gespaarde bedrag met inbegrip van de verkregen rente mag alleen bestemd worden voor overige projecten
      en het aandeel in grote projecten. Voor het gespaarde bedrag dienen, tenzij Onze Minister anders beslist, voor de
      afloop van de periode waarvoor de doeluitkering is verstrekt tenminste verplichtingen aangegaan te zijn. Indien
      niet ten minste verplichtingen zijn aangegaan, vordert Onze Minister het gespaarde bedrag en de verkregen rente
      geheel of gedeeltelijk terug.
    url: https://wetten.overheid.nl/BWBR0006264/2002-01-01#Artikel36
  - number: 36a
    text: |-
      1 Op de omvang van een doeluitkering aan een provincie worden in mindering gebracht de verplichtingen die zijn
      aangegaan bij het verstrekken van bijdragen voor overige projecten krachtens het Besluit personenvervoer of
      dit besluit jegens de betrokken provincie, alsmede jegens gemeenten, waterschappen en andere publiekrechtelijke
      rechtspersonen in de betrokken provincie, uitgezonderd dat deel van de provincie dat samenvalt met een
      samenwerkingsgebied, voor zover deze ten laste komen van Hoofdstuk XII van de Rijksbegroting voor het kalenderjaar
      1994 en volgende kalenderjaren dan wel van de Wet tot vaststelling van de begroting van de uitgaven en de
      ontvangsten van het Infrastructuurfonds voor vorenbedoelde kalenderjaren.

      2 Op de omvang van een doeluitkering aan een provincie worden voorts in mindering gebracht de verplichtingen die
      zijn aangegaan bij het verstrekken van bijdragen voor overige projecten krachtens het Besluit personenvervoer
      of dit besluit jegens de regionale of lokale vervoerbedrijven, welke in de betrokken provincie, uitgezonderd dat
      deel van de provincie dat samenvalt met een samenwerkingsgebied, openbaar vervoer verrichten, voor zover deze ten
      laste komen van Hoofdstuk XII van de Rijksbegroting voor het kalenderjaar 1994 en volgende kalenderjaren dan wel
      van de Wet tot vaststelling van de begroting van de uitgaven en de ontvangsten van het Infrastructuurfonds voor
      vorenbedoelde kalenderjaren.

      3 In afwijking van het eerste en tweede lid kunnen uitsluitend die verplichtingen in mindering worden gebracht,
      voor zover zij voorkomen op een lijst die door Onze Minister uiterlijk acht weken na de inwerkingtreding van het
      besluit tot wijziging van het Besluit Infrastructuurfonds (doeluitkering aan provincies en andere wijzigingen) in
      de *Staatscourant* bekend is gemaakt.
    url: https://wetten.overheid.nl/BWBR0006264/2002-01-01#Artikel36a
  - number: 36b
    text: |-
      1 Op de omvang van een doeluitkering aan een regionaal openbaar lichaam worden in mindering gebracht de
      verplichtingen die zijn aangegaan bij het verstrekken van bijdragen voor overige projecten krachtens het Besluit
      personenvervoer of dit besluit jegens het betrokken regionaal openbaar lichaam, gemeenten, waterschappen en
      andere publiekrechtelijke rechtspersonen in het betrokken samenwerkingsgebied, voor zover deze ten laste komen
      van Hoofdstuk XII van de Rijksbegroting voor het kalenderjaar 1994 en volgende kalenderjaren dan wel van de Wet
      tot vaststelling van de begroting van de uitgaven en de ontvangsten van het Infrastructuurfonds voor vorenbedoelde
      kalenderjaren.

      2 Op de omvang van een doeluitkering aan een regionaal openbaar lichaam worden voorts in mindering gebracht
      de verplichtingen die zijn aangegaan bij het verstrekken van bijdragen voor overige projecten krachtens het
      Besluit personenvervoer of dit besluit jegens regionale of lokale vervoerbedrijven, welke in het betrokken
      samenwerkingsgebied openbaar vervoer verrichten, voor zover deze ten laste komen van Hoofdstuk XII van de
      Rijksbegroting voor het kalenderjaar 1994 en volgende kalenderjaren dan wel van de Wet tot vaststelling van de
      begroting van de uitgaven en de ontvangsten van het Infrastructuurfonds voor vorenbedoelde kalenderjaren.

      3 Op de omvang van een doeluitkering aan een regionaal openbaar lichaam wordt voorts in mindering gebracht de
      doeluitkering die aan het betrokken regionaal openbaar lichaam voor de jaren 1996 en 1997 is verstrekt op grond
      van [paragraaf 6][ref1], zoals die paragraaf luidde voor de inwerkingtreding van het besluit tot wijziging van het
      Besluit Infrastructuurfonds (doeluitkering aan provincies en andere wijzigingen).

      4 Voorwaarden die zijn gesteld aan een doeluitkering die is verstrekt voor de inwerkingtreding van het besluit
      tot wijziging van het Besluit Infrastructuurfonds (doeluitkering aan provincies en andere wijzigingen) komen voor
      wat betreft de jaren 1996 en 1997 te vervallen, voor zover deze niet kunnen worden gesteld aan een doeluitkering
      die wordt verstrekt na de inwerkingtreding van het besluit tot wijziging van het Besluit Infrastructuurfonds
      (doeluitkering aan provincies en andere wijzigingen).

      5 [Artikel 36][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Paragraaf6
      [ref2]: https://wetten.overheid.nl/BWBR0006264#Artikel36a
    url: https://wetten.overheid.nl/BWBR0006264/2002-01-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0006264
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0006264
        artikel: 36a
        paragraaf: '8'
  - number: '39'
    text: De doeluitkering wordt eenmaal per kalenderjaar uiterlijk in de maand juni van dat jaar betaald.
    url: https://wetten.overheid.nl/BWBR0006264/2002-01-01#Artikel39
  - number: 39a
    text: |-
      Uiterlijk vier weken na ontvangst van de mededeling dat een op de door provinciale staten vastgestelde of herziene
      lijst geplaatst overig project na aanbesteding is gegund, betalen gedeputeerde staten het bedrag dat volgens de
      lijst voor dat project beschikbaar is gesteld.
    url: https://wetten.overheid.nl/BWBR0006264/2002-01-01#Artikel39a
  - number: '40'
    text: |-
      1 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur brengen jaarlijks voor 15 november onderscheidenlijk
      voor 15 september van het jaar, volgende op het jaar waarin de doeluitkering is betaald, over het desbetreffende
      jaar aan Onze Minister een financieel verslag over de besteding van de doeluitkering uit.

      2 Het financieel verslag gaat vergezeld van een accountantsverklaring.

      3 Onze Minister stelt een model vast voor het financieel verslag en voor de accountantsverklaring.

      4 Indien uit de accountantsverklaring blijkt, dat de doeluitkering gebruikt is voor betalingen van doelen, waarvoor
      die uitkering niet bestemd is, zullen die betalingen door Onze Minister teruggevorderd worden.
    url: https://wetten.overheid.nl/BWBR0006264/2002-01-01#Artikel40
  - number: 41a
    text: |-
      Indien het dagelijks bestuur krachtens [paragraaf 6][ref1], zoals die paragraaf luidde voor de inwerkingtreding van
      het besluit tot wijziging van het Besluit Infrastructuurfonds (doeluitkering aan provincies en andere wijzigingen),
      overeenkomstig die paragraaf een doeluitkering heeft aangevraagd, en op die aanvraag nog niet is beslist op het
      tijdstip van inwerkingtreding van vorenbedoeld wijzigingsbesluit, wordt door Onze Minister op die aanvraag beslist
      als ware het een aanvraag om een doeluitkering op grond van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Paragraaf6
    url: https://wetten.overheid.nl/BWBR0006264/2002-01-01#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0006264
        paragraaf: '6'
  - number: '42'
    text: Onze Minister draagt zorg voor een evaluatie van de werking van dit besluit vier jaar na inwerkingtreding ervan.
    url: https://wetten.overheid.nl/BWBR0006264/2002-01-01#Artikel42
  - number: '43'
    text: De Bijdrageregeling Mobiliteitsfonds (*Stb.* 1989, 220) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006264/2002-01-01#Artikel43
  - number: 44a
    text: |-
      Onze Minister kan bij de vaststelling van bijdragen, bedoeld in artikel 111, eerste en tweede lid, van het Besluit
      personenvervoer, die vóór 1 januari 1994 krachtens dat besluit zijn aangevraagd en die zijn verleend onder de
      toezegging dat de bijdrage op het punt van de vergoeding van de kosten van voorbereiding, administratie en toezicht
      zal worden bijgesteld overeenkomstig een nieuwe regeling, de kosten van voorbereiding, administratie en toezicht
      vergoeden overeenkomstig [artikel 5, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel5
    url: https://wetten.overheid.nl/BWBR0006264/2002-01-01#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0006264
        artikel: '5'
        paragraaf: '2'
  - number: 44b
    text: |-
      Onze Minister kan bij de vaststelling van bijdragen, die zijn verleend krachtens
      [paragraaf 2 of 3 van het Besluit Infrastructuurfonds][ref1], zoals die luidden vóór de inwerkingtreding van
      het onderhavige besluit, en waarbij is toegezegd dat de bijdrage op het punt van de vergoeding van de kosten van
      verlegging of vervanging van kabels of leidingen zal worden bijgesteld overeenkomstig een nieuwe regeling, de
      bijdrage voor de kosten van verlegging of vervanging vaststellen overeenkomstig [artikel 9, tweede lid][ref2] .


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Paragraaf6
      [ref2]: https://wetten.overheid.nl/BWBR0006264#Artikel9
    url: https://wetten.overheid.nl/BWBR0006264/2002-01-01#Artikel44b
    references:
      - id: ref1
        bwb_id: BWBR0006264
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0006264
        artikel: '9'
        paragraaf: '2'
  - number: '45'
    text: De Bijdrageregeling wegverkeersvoorzieningen (*Stcrt.* 1988, 215) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006264/2002-01-01#Artikel45
  - number: '49'
    text: Dit besluit kan worden aangehaald als Besluit Infrastructuurfonds.
