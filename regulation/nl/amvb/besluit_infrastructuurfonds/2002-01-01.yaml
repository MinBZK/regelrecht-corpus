articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. wet: de [Wet Infrastructuurfonds][ref1];

      b. dagelijks bestuur: dagelijks bestuur van een regionaal openbaar lichaam;

      c. samenwerkingsgebied: samenwerkingsgebied als bedoeld in [artikel 2 van de Kaderwet bestuur in verandering][ref2];

      d. groot project: investeringsproject, waarvan de geraamde kosten op grond van [artikel 5][ref3] tenminste € 11
      345.000 bedragen;

      e. overig project: investeringsproject, waarvan de overeenkomstig [artikel 5][ref4] geraamde kosten minder dan € 11
      345.000 bedragen;

      f. vaste subsidiebedrag: subsidie, waarop geen nacalculatie plaatsvindt en welke alleen kan worden bijgesteld op
      grond van wijzigingen van het algemene loon- en prijspeil;

      g. landelijke infrastructuur: het hoofdwegennet, het landelijk railnet en het hoofdvaarwegennet, als bedoeld in
      [artikel 1, eerste lid, van de Tracéwet][ref5];

      h. lokale infrastructuur: infrastructuur, gelegen binnen één gemeente en in beheer bij die gemeente en met een
      lokale functie;

      i. regionale infrastructuur: infrastructuur niet behorende tot landelijke of lokale infrastructuur;

      j. Besluit personenvervoer: Besluit personenvervoer, zoals dat gold voor de inwerkingtreding van het
      [Besluit personenvervoer 2000][ref6].


