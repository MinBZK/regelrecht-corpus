        artikel: '2'
  - number: '2.1'
    text: |-
      Onze Minister, gedeputeerde staten, het college van burgemeester en wethouders, het dagelijks bestuur van
      het waterschap, het bestuurscollege, het dagelijks bestuur van het openbaar lichaam, het bestuur van de
      bedrijfsvoeringsorganisatie en het gemeenschappelijk orgaan, dragen er zorg voor dat de nodige maatregelen worden
      getroffen om te waarborgen dat het bekendgemaakte besluit het besluit is waarover is beraadslaagd en dat nadien is
      vastgesteld. Bij ministeriële regeling kunnen daaromtrent nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel2.1
  - number: 3.1.1
    text: |-
      De publicatiebladen, met uitzondering van het afkondigingsblad, worden uitgegeven op een bij ministeriële regeling
      te bepalen internetadres.
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel3.1
  - number: 3.1.2
    text: |-
      Het afkondigingsblad dat elektronisch wordt uitgegeven, wordt uitgegeven op het internetadres, bedoeld in het
      eerste lid, of op een door het bestuurscollege te bepalen internetadres.
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel3.1
  - number: 3.1.3
    text: Op de publicatiebladen wordt vermeld wanneer zij zijn uitgegeven.
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel3.1
  - number: '3.2'
    text: |-
      Onze Minister draagt er zorg voor dat de publicatiebladen die worden uitgegeven door middel van de door Onze
      Minister in stand gehouden digitale infrastructuur na de uitgifte elektronisch op een algemeen toegankelijke wijze
      beschikbaar blijven. Bij ministeriële regeling kunnen daaromtrent nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel3.2
  - number: '3.3'
    text: |-
      Onze Minister draagt er zorg voor dat de nodige maatregelen worden getroffen ter waarborging van de betrouwbaarheid
      en de beveiliging van de elektronische uitgifte en de beschikbaarstelling van de publicatiebladen die worden
      uitgegeven door middel van de door Onze Minister in stand gehouden digitale infrastructuur, alsmede van de
      integriteit van publicaties zodanig dat de beschikbare versie van een publicatie gelijk is aan de publicatie zoals
      deze in het betreffende publicatieblad is geplaatst. Bij ministeriële regeling kunnen daaromtrent nadere regels
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel3.3
  - number: '3.4'
    text: |-
      Indien het afkondigingsblad elektronisch wordt uitgegeven, is de zorgplicht, bedoeld in de [artikelen 3.2][ref1] en
      [3.3][ref2], van overeenkomstige toepassing op het bestuurscollege.


      [ref1]: https://wetten.overheid.nl/BWBR0045037#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045037#Artikel3
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0045037
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0045037
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.5.1
    text: |-
      Naast al hetgeen waarvan bekendmaking, mededeling of kennisgeving in de publicatiebladen wettelijk is
      voorgeschreven, worden tevens opgenomen:
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel3.5
  - number: 3.5.1.a
    text: |-
      in de Staatscourant andere publicaties afkomstig van het Rijk, van bestuursorganen van andere openbare lichamen dan
      genoemd in [artikel 2, eerste tot en met vijfde lid, van de wet][ref1] en van bestuursorganen die niet behoren tot
      een openbaar lichaam; en


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel2
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '2'
  - number: 3.5.1.b
    text: |-
      in het betreffende publicatieblad andere publicaties afkomstig van bestuursorganen die behoren tot een van de in
      [artikel 2, eerste tot en met vierde lid, van de wet][ref1] genoemde openbare lichamen, of de in artikel 2, vijfde
      lid, van de wet genoemde openbare lichamen, bedrijfsvoeringsorganisaties en gemeenschappelijke organen.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel2
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '2'
  - number: 3.5.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent andere publicaties als bedoeld in het eerste
      lid, onderdelen a en b.
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel3.5
  - number: '3.6'
    text: |-
      De eerste ondertekenaar van een publicatie als bedoeld in [artikel 3.5, eerste lid, aanhef en onderdeel a][ref1],
      bepaalt het tijdstip van de plaatsing van de publicatie in de Staatscourant en draagt er zorg voor dat de
      toezending op een zodanig tijdstip en op zodanige wijze plaatsvindt dat de plaatsing tijdig kan geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0045037#Artikel3
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0045037
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.7.1
    text: |-
      In een kennisgeving in de vorm van een zakelijke weergave van de inhoud van een publicatie als bedoeld in
      [artikel 12, eerste lid, van de wet][ref1], wordt ten minste vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel12
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '12'
  - number: 3.7.1.a
    text: |-
      een beschrijving van het betreffende object of de betreffende activiteit en, in voorkomend geval, de locatie
      daarvan;
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel3.7
  - number: 3.7.1.b
    text: |-
      een zodanige beschrijving van het gevraagde besluit, het ontwerpbesluit of het besluit en het gevraagde
      rechtsgevolg, het beoogde rechtsgevolg onderscheidenlijk het rechtsgevolg daarvan dat potentiële belanghebbenden
      eruit kunnen afleiden in hoeverre zij in hun belangen worden geraakt; en
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel3.7
  - number: 3.7.1.c
    text: |-
      of gelegenheid bestaat om zienswijzen naar voren te brengen dan wel rechtsmiddelen in te stellen en zo ja, voor
      wie.
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel3.7
  - number: 3.7.2
    text: Bij ministeriële regeling kunnen daaromtrent nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel3.7
  - number: '3.8'
    text: |-
      Onze Minister, gedeputeerde staten, het college van burgemeester en wethouders, het dagelijks bestuur
      van het waterschap, het bestuurscollege, het dagelijks bestuur van het openbaar lichaam, het bestuur van
      de bedrijfsvoeringsorganisatie en het gemeenschappelijk orgaan, passen met betrekking tot de plaatsing
      in onderscheidenlijk de Staatscourant, het provinciaal blad, het gemeenteblad, het waterschapsblad, het
      afkondigingsblad indien dat elektronisch wordt uitgegeven en het publicatieblad de regels of technische standaarden
      toe die bij regeling van Onze Minister zijn gesteld onderscheidenlijk zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel3.8
  - number: 4.1.1
    text: |-
      Onderdelen van besluiten die zijn bekendgemaakt op de wijze, bedoeld in [artikel 7, tweede lid, van de wet][ref1],
      blijven elektronisch beschikbaar op de bij de bekendmaking aangegeven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel7
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '7'
  - number: 4.1.2
    text: |-
      Indien de elektronische beschikbaarheid op de bij de bekendmaking aangegeven wijze niet langer is geborgd, voorziet
      het betreffende bestuursorgaan in afwijking van het eerste lid in een vervangende wijze die ten minste in de
      geconsolideerde tekst wordt vermeld.
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel4.1
  - number: 4.1.3
    text: Bij ministeriële regeling kunnen daaromtrent nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel4.1
  - number: 5.1.1
    text: |-
      De teksten van bekendgemaakte wetten, algemene maatregelen van bestuur en anders dan bij wet of algemene maatregel
      van bestuur vastgestelde algemeen verbindende voorschriften, beleidsregels en gemeenschappelijke regelingen zijn
      in geconsolideerde vorm voor eenieder beschikbaar door plaatsing op een bij ministeriële regeling te bepalen
      internetadres.
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel5.1
  - number: 5.1.2
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel5.1
  - number: 5.1.2.a
    text: |-
      wetten, algemene maatregelen van bestuur en anders dan bij wet of algemene maatregel van bestuur vanwege het Rijk
      vastgestelde algemeen verbindende voorschriften die zijn ingetrokken of uitgewerkt vóór 1 juli 2009;
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel5.1
  - number: 5.1.2.b
    text: |-
      anders dan vanwege het Rijk vastgestelde algemeen verbindende voorschriften die zijn ingetrokken of uitgewerkt vóór
      1 januari 2011;
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel5.1
  - number: 5.1.2.c
    text: |-
      beleidsregels die zijn ingetrokken of uitgewerkt vóór de datum gelegen een jaar na het tijdstip waarop
      [artikel 1.1 van de Wet elektronische publicaties][ref1] in werking is getreden;


      [ref1]: https://wetten.overheid.nl/BWBR0043961#Artikel1
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0043961
        artikel: '1'
  - number: 5.1.2.d
    text: gemeenschappelijke regelingen die zijn ingetrokken of uitgewerkt vóór 1 januari 2015;
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel5.1
  - number: 5.1.2.e
    text: |-
      algemeen verbindende voorschriften die zijn bekendgemaakt op grond van de [Wet ruimtelijke ordening][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020449
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0020449
  - number: 5.1.2.f
    text: |-
      wetten, algemene maatregelen van bestuur en anders dan bij wet of algemene maatregel van bestuur vastgestelde
      algemeen verbindende voorschriften, beleidsregels en gemeenschappelijke regelingen voor zover deze strekken tot
      wijziging van een of meer wetten, algemene maatregelen van bestuur of anders dan bij wet of algemene maatregel van
      bestuur vastgestelde algemeen verbindende voorschriften, beleidsregels of gemeenschappelijke regelingen;
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel5.1
  - number: 5.1.2.g
    text: |-
      wetten inzake de begroting, bedoeld in [artikel 105, eerste lid, van de Grondwet][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel105
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '105'
  - number: 5.1.2.h
    text: wetten die uitsluitend strekken tot goedkeuring van verdragen.
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel5.1
  - number: '6.1'
    text: |-
      Elektronische berichten over bekendmakingen, mededelingen en kennisgevingen in de publicatiebladen worden gezonden
      aan personen die beschikken over een geactiveerd MijnOverheid-account op het in dat kader opgegeven e-mailadres.
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel6.1
  - number: '6.2'
    text: |-
      Personen die geen elektronische berichten willen ontvangen, melden zich voor deze berichten af in hun MijnOverheid-
      account. Indien het adres van hun inschrijving in de basisregistratie personen wijzigt, kunnen zij worden
      uitgenodigd zich voor deze berichten aan te melden.
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel6.2
  - number: '10.1'
    text: |-
      Het [Besluit bekendmaking en beschikbaarstelling regelgeving decentrale overheden][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0024917
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel10.1
    references:
      - id: ref1
        bwb_id: BWBR0024917
  - number: 11.1.1
    text: |-
      Van 1 januari 2024 tot 1 januari 2025 kan een bestuursorgaan in plaats van de krachtens [artikel 3.8][ref1]
      aangewezen technische standaarden toepassing geven aan een technische standaard als bedoeld in de
      [Regeling standaarden ruimtelijke ordening 2012][ref2], zoals deze gold onmiddellijk voor 1 januari 2024.


      [ref1]: https://wetten.overheid.nl/BWBR0045037#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0031829
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0045037
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0031829
  - number: 11.1.2
    text: |-
      In afwijking van het eerste lid, geldt de uitzondering, bedoeld in het eerste lid, tot 1 januari
      2026 voor besluiten op grond van de [artikelen 2.4][ref1], [2.6][ref2], [2.33][ref3], [4.14][ref4]
      en [16.21 van de Omgevingswet][ref5], en voor besluiten genomen door gedeputeerde staten op grond van
      [5.44 van de Omgevingswet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0037885#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0037885#Artikel16
      [ref6]: https://wetten.overheid.nl/BWBR0037885#Artikel5
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '2'
      - id: ref2
