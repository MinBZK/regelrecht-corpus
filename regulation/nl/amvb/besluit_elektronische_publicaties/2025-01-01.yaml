        artikel: '10'
      - id: ref3
        bwb_id: BWBR0041278
        artikel: '10'
  - number: 11.1.6
    text: |-
      Op de landelijke voorziening, bedoeld in [artikel 1.2.1, tweede lid, van het Besluit ruimtelijke ordening][ref1],
      zoals dat luidde onmiddellijk voor 1 januari 2024, blijft het recht van overeenkomstige toepassing
      zoals dat gold onmiddellijk voor 1 januari 2024, voor zover dat nodig is voor het beschikbaar stellen
      van de ontwerpbesluiten en besluiten met gebruik van een technische standaard als bedoeld in de
      [Regeling standaarden ruimtelijke ordening 2012][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023798#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0031829
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel11.1
