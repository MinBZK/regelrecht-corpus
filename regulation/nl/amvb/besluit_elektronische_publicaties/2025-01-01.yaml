  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties van 25 mei 2020, nr. 2020-
    0000255276;

    Gelet op de artikelen 15, 16, eerste, tweede en vierde lid, 19, eerste en tweede lid, en 20, tweede en derde
    lid, van de Bekendmakingswet, artikel 69, eerste en vijfde lid, van de Kernenergiewet, de artikelen 5.16, tweede
    lid, 5.44b, tweede lid, 15.8, vierde lid, 16.139, eerste en tweede lid, 19.12, vierde lid, en 20.26, eerste lid,
    van de Omgevingswet, artikel 18, derde lid, van de Wegenverkeerswet 1994, de artikelen 7.4, eerste lid, en 7.6,
    eerste lid, van de Wet dieren, artikel X, derde lid, van de Wet elektronisch berichtenverkeer Belastingdienst, de
    artikelen 8.40, eerste lid, 8.41, vierde lid, 8.42, vijfde lid, en 10.32 van de Wet milieubeheer, artikel 1.13,
    eerste lid, van de Wet natuurbescherming en de artikelen 2.4, tweede lid, 3.7, achtste lid, 3.37, eerste lid, 4.2,
    vijfde lid, en 6.13, negende lid, van de Wet ruimtelijke ordening;

    De Afdeling advisering van de Raad van State gehoord (advies van 17 juni 2020, nr. W04.20.0154/I);

    Gezien het nader rapport van de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties van 29 maart 2021,
    nr. 2020-0000412175;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit wordt verstaan onder: - *afkondigingsblad:* door het bestuurscollege uitgegeven publicatieblad;
        - *bestuur van de bedrijfsvoeringsorganisatie:* bestuur van de bedrijfsvoeringsorganisatie, bedoeld in
      [artikel 8, derde lid, van de Wet gemeenschappelijke regelingen][ref1];
        - *bestuurscollege:* bestuurscollege van het openbaar lichaam, bedoeld in
      [artikel 1, onderdeel a, van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref2];
        - *dagelijks bestuur van het openbaar lichaam:* dagelijks bestuur van het openbaar lichaam, bedoeld in
      [artikel 8, eerste lid, van de Wet gemeenschappelijke regelingen][ref3];
        - *de wet:* de [Bekendmakingswet][ref4];
        - *gemeenschappelijk orgaan:* gemeenschappelijk orgaan als bedoeld in
      [artikel 8, tweede lid, van de Wet gemeenschappelijke regelingen][ref5];
        - *MijnOverheid-account:* MijnOverheid-account als bedoeld in [artikel 1 van het Besluit digitale overheid][ref6];
        - *Onze Minister:* Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - *publicatiebladen:* in de [artikelen 1][ref7] en [2 van de wet][ref8] genoemde publicatiebladen die elektronisch
      worden uitgegeven, met uitzondering van het Staatsblad.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0003740#Artikel8
