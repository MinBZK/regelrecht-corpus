  - number: 11.1.3
    text: |-
      Als voor het einde van de termijn, bedoeld in het eerste of tweede lid, een ontwerpbesluit ter inzage is
      gelegd, kan een bestuursorgaan bij de publicatie van het besluit in plaats van de krachtens [artikel 3.8][ref1]
      aangewezen technische standaarden toepassing geven aan een technische standaard als bedoeld in de
      [Regeling standaarden ruimtelijke ordening 2012][ref2], zoals deze gold onmiddellijk voor 1 januari 2024.


      [ref1]: https://wetten.overheid.nl/BWBR0045037#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0031829
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0045037
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0031829
  - number: 11.1.4
    text: |-
      Totdat een besluit, gepubliceerd met toepassing van de uitzonderingen, bedoeld in het eerste, tweede of derde
      lid, onherroepelijk is geworden, kan dit besluit worden gewijzigd met toepassing van een technische standaard als
      bedoeld in de [Regeling standaarden ruimtelijke ordening 2012][ref1], zoals deze gold onmiddellijk voor 1 januari
      2024, in plaats van de krachtens [artikel 3.8][ref2] aangewezen technische standaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0031829
      [ref2]: https://wetten.overheid.nl/BWBR0045037#Artikel3
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel11.1
