        artikel: '1'
      - id: ref2
        bwb_id: BWBR0031829
  - number: 11.1.7
    text: |-
      [Artikel 5.1, eerste lid][ref1], is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0045037#Artikel5
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0045037
        artikel: '5'
        hoofdstuk: '5'
  - number: 11.1.7.a
    text: besluiten, gepubliceerd met toepassing van de uitzonderingen bedoeld in het eerste, tweede, derde of vierde lid, en
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel11.1
  - number: 11.1.7.b
    text: |-
      algemeen verbindende voorschriften, beleidsregels en andere besluiten die niet tot een of meer belanghebbenden
      zijn gericht:
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel11.1
  - number: 11.1.7.b.1°
    text: |-
      waarvan de grondslag is opgenomen in de [Omgevingswet][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: 11.1.7.b.2°
    text: die zijn gepubliceerd voor 1 januari 2024.
    url: https://wetten.overheid.nl/BWBR0045037/2025-01-01#Artikel11.1
  - number: 11.1.8
    text: |-
      Dit artikel vervalt met ingang van het tijdstip, bepaald in het [koninklijk besluit][ref1], bedoeld in
      [artikel 22.6, derde lid, van de Omgevingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0049301
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel22
