        hoofdstuk: '3'
  - number: 11.1.5
    text: |-
      Als een bestuursorgaan toepassing geeft aan het eerste, tweede, derde of vierde lid, zijn de
      [artikelen 5.5a][ref1], [10.3c][ref2] en [10.7a van het Omgevingsbesluit][ref3] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0041278#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0041278#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0041278#Artikel10
