        artikel: '3.3'
        hoofdstuk: '3'
  - number: '3.5'
    text: |-
      1 Naast al hetgeen waarvan bekendmaking, mededeling of kennisgeving in de publicatiebladen wettelijk is
      voorgeschreven, worden tevens opgenomen:

      a. in de Staatscourant andere publicaties afkomstig van het Rijk, van bestuursorganen van andere openbare lichamen
      dan genoemd in [artikel 2, eerste tot en met vijfde lid, van de wet][ref1] en van bestuursorganen die niet behoren
      tot een openbaar lichaam; en

      b. in het betreffende publicatieblad andere publicaties afkomstig van bestuursorganen die behoren tot een van de in
      [artikel 2, eerste tot en met vierde lid, van de wet][ref2] genoemde openbare lichamen, of de in artikel 2, vijfde
      lid, van de wet genoemde openbare lichamen, bedrijfsvoeringsorganisaties en gemeenschappelijke organen.

      2 Bij ministeriële regeling kunnen daaromtrent nadere regels worden gesteld omtrent andere publicaties als bedoeld
      in het eerste lid, onderdelen a en b.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004287#Artikel2
    url: https://wetten.overheid.nl/BWBR0045037/2024-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004287
        artikel: '2'
  - number: '3.6'
    text: |-
      De eerste ondertekenaar van een publicatie als bedoeld in [artikel 3.5, eerste lid, aanhef en onderdeel a][ref1],
      bepaalt het tijdstip van de plaatsing van de publicatie in de Staatscourant en draagt er zorg voor dat de
      toezending op een zodanig tijdstip en op zodanige wijze plaatsvindt dat de plaatsing tijdig kan geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0045037#Artikel3.5
    url: https://wetten.overheid.nl/BWBR0045037/2024-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0045037
        artikel: '3.5'
        hoofdstuk: '3'
  - number: '3.7'
    text: |-
      1 In een kennisgeving in de vorm van een zakelijke weergave van de inhoud van een publicatie als bedoeld in
      [artikel 12, eerste lid, van de wet][ref1], wordt ten minste vermeld:

      a. een beschrijving van het betreffende object of de betreffende activiteit en, in voorkomend geval, de locatie
      daarvan;

      b. een zodanige beschrijving van het gevraagde besluit, het ontwerpbesluit of het besluit en het gevraagde
      rechtsgevolg, het beoogde rechtsgevolg onderscheidenlijk het rechtsgevolg daarvan dat potentiële belanghebbenden
      eruit kunnen afleiden in hoeverre zij in hun belangen worden geraakt; en

      c. of gelegenheid bestaat om zienswijzen naar voren te brengen dan wel rechtsmiddelen in te stellen en zo ja, voor
      wie.

      2 Bij ministeriële regeling kunnen daaromtrent nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel12
    url: https://wetten.overheid.nl/BWBR0045037/2024-01-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '12'
  - number: '3.8'
    text: |-
      Onze Minister, gedeputeerde staten, het college van burgemeester en wethouders, het dagelijks bestuur
      van het waterschap, het bestuurscollege, het dagelijks bestuur van het openbaar lichaam, het bestuur van
      de bedrijfsvoeringsorganisatie en het gemeenschappelijk orgaan, passen met betrekking tot de plaatsing
      in onderscheidenlijk de Staatscourant, het provinciaal blad, het gemeenteblad, het waterschapsblad, het
      afkondigingsblad indien dat elektronisch wordt uitgegeven en het publicatieblad de regels of technische standaarden
      toe die bij regeling van Onze Minister zijn gesteld onderscheidenlijk zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0045037/2024-01-01#Artikel3.8
  - number: '4.1'
    text: |-
      1 Onderdelen van besluiten die zijn bekendgemaakt op de wijze, bedoeld in [artikel 7, tweede lid, van de wet][ref1],
      blijven elektronisch beschikbaar op de bij de bekendmaking aangegeven wijze.

      2 Indien de elektronische beschikbaarheid op de bij de bekendmaking aangegeven wijze niet langer is geborgd,
      voorziet het betreffende bestuursorgaan in afwijking van het eerste lid in een vervangende wijze die ten minste in
      de geconsolideerde tekst wordt vermeld.

      3 Bij ministeriële regeling kunnen daaromtrent nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel7
    url: https://wetten.overheid.nl/BWBR0045037/2024-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '7'
  - number: '5.1'
    text: |-
      1 De teksten van bekendgemaakte wetten, algemene maatregelen van bestuur en anders dan bij wet of algemene
      maatregel van bestuur vastgestelde algemeen verbindende voorschriften, beleidsregels en gemeenschappelijke
      regelingen zijn in geconsolideerde vorm voor eenieder beschikbaar door plaatsing op een bij ministeriële regeling
      te bepalen internetadres.

      2 Het eerste lid is niet van toepassing op:

      a. wetten, algemene maatregelen van bestuur en anders dan bij wet of algemene maatregel van bestuur vanwege het
      Rijk vastgestelde algemeen verbindende voorschriften die zijn ingetrokken of uitgewerkt vóór 1 juli 2009;

      b. anders dan vanwege het Rijk vastgestelde algemeen verbindende voorschriften die zijn ingetrokken of uitgewerkt
      vóór 1 januari 2011;

      c. beleidsregels die zijn ingetrokken of uitgewerkt vóór de datum gelegen een jaar na het tijdstip waarop
      [artikel 1.1 van de Wet elektronische publicaties][ref1] in werking is getreden;

      d. gemeenschappelijke regelingen die zijn ingetrokken of uitgewerkt vóór 1 januari 2015;

      e. algemeen verbindende voorschriften die zijn bekendgemaakt op grond van de [Wet ruimtelijke ordening][ref2];

      f. wetten, algemene maatregelen van bestuur en anders dan bij wet of algemene maatregel van bestuur vastgestelde
      algemeen verbindende voorschriften, beleidsregels en gemeenschappelijke regelingen voor zover deze strekken tot
      wijziging van een of meer wetten, algemene maatregelen van bestuur of anders dan bij wet of algemene maatregel van
      bestuur vastgestelde algemeen verbindende voorschriften, beleidsregels of gemeenschappelijke regelingen;

      g. wetten inzake de begroting, bedoeld in [artikel 105, eerste lid, van de Grondwet][ref3]; en

      h. wetten die uitsluitend strekken tot goedkeuring van verdragen.


      [ref1]: https://wetten.overheid.nl/BWBR0043961#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0020449
      [ref3]: https://wetten.overheid.nl/BWBR0001840#Artikel105
    url: https://wetten.overheid.nl/BWBR0045037/2024-01-01#Artikel5.1
