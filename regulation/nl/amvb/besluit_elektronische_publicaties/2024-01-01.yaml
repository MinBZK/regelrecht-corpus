  - number: '6.1'
    text: |-
      Elektronische berichten over bekendmakingen, mededelingen en kennisgevingen in de publicatiebladen worden gezonden
      aan personen die beschikken over een geactiveerd MijnOverheid-account op het in dat kader opgegeven e-mailadres.
    url: https://wetten.overheid.nl/BWBR0045037/2024-01-01#Artikel6.1
  - number: '6.2'
    text: |-
      Personen die geen elektronische berichten willen ontvangen, melden zich voor deze berichten af in hun MijnOverheid-
      account. Indien het adres van hun inschrijving in de basisregistratie personen wijzigt, kunnen zij worden
      uitgenodigd zich voor deze berichten aan te melden.
    url: https://wetten.overheid.nl/BWBR0045037/2024-01-01#Artikel6.2
  - number: '10.1'
    text: |-
      Het [Besluit bekendmaking en beschikbaarstelling regelgeving decentrale overheden][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0024917
    url: https://wetten.overheid.nl/BWBR0045037/2024-01-01#Artikel10.1
    references:
      - id: ref1
        bwb_id: BWBR0024917
  - number: '11.1'
    text: |-
      1 Tot het tijdstip van inwerkingtreding van de [Omgevingswet][ref1] is [artikel 5.1, eerste lid][ref2], niet
      van toepassing op algemeen verbindende voorschriften, beleidsregels en andere besluiten die niet tot een of meer
      belanghebbenden zijn gericht waarvan de grondslag is opgenomen in die wet.

      2 Vanaf het tijdstip van inwerkingtreding van de [Omgevingswet][ref3] kan een bestuursorgaan in plaats van de
      krachtens [artikel 3.8][ref4] aangewezen technische standaarden toepassing geven aan een technische standaard
      als bedoeld in de [Regeling standaarden ruimtelijke ordening 2012][ref5], zoals deze gold onmiddellijk voor het
      tijdstip van intrekking van de [Wet ruimtelijke ordening][ref6]. [Artikel 5.1, eerste lid][ref7], is dan niet van
      toepassing. Op de voorziening, bedoeld in [artikel 1.2.1 van het Besluit ruimtelijke ordening][ref8], blijft het
      recht van toepassing zoals dat gold onmiddellijk voor het tijdstip van intrekking van de Wet ruimtelijke ordening.

      3 Dit artikel vervalt een jaar na inwerkingtreding van de [Omgevingswet][ref9], of zoveel eerder als bij koninklijk
      besluit wordt bepaald.


