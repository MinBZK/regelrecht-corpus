  - number: '11.1'
    text: |-
      Bij elke inrichting of afdeling is een commissie van toezicht, waarvan de leden worden benoemd voor de tijd van
      vijf jaren. Zij kunnen tweemaal voor herbenoeming in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel11
  - number: '11.2'
    text: De commissie bestaat uit ten minste zes en ten hoogste een door Onze Minister vast te stellen aantal leden.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel11
  - number: '11.3'
    text: 'De commissie van toezicht is zo breed mogelijk samengesteld. Van elke commissie maken in elk geval deel uit:'
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel11
  - number: 11.3.a
    text: een met rechtspraak belast lid van de rechterlijke macht;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel11
  - number: 11.3.b
    text: een advocaat;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel11
  - number: 11.3.c
    text: een medicus;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel11
  - number: 11.3.d
    text: een deskundige uit de kring van het maatschappelijk werk.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel11
  - number: '11.4'
    text: |-
      Indien de commissie toezicht houdt op een inrichting of afdeling waar geneeskundige behandeling als bedoeld in de
      [artikelen 46a tot en met 46e van de wet][ref1] wordt verricht, maakt ook een psychiater van de commissie deel uit.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel46a
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: 46a
  - number: '12.1'
    text: |-
      De leden van de commissie van toezicht worden door Onze Minister benoemd. Onze Minister wijst uit de leden een
      voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel12
  - number: '12.2'
    text: |-
      Aan de commissie is een secretaris verbonden. Deze is geen lid van de commissie. De secretaris wordt door
      Onze Minister benoemd en ontslagen. De secretaris van de commissie van toezicht is tevens secretaris van de
      beklagcommissie.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel12
  - number: '12.3'
    text: |-
      De commissie kan uit haar midden een of meer plaatsvervangende secretarissen aanwijzen om, in overleg met de
      secretaris, bepaalde secretariaatswerkzaamheden te verrichten en de secretaris bij diens afwezigheid te vervangen.
      Onze Minister kan aan een commissie van toezicht een of meer plaatsvervangende secretarissen toevoegen die geen lid
      zijn van de commissie.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel12
  - number: '12.4'
    text: |-
      Onze Minister beslist binnen drie maanden op een verzoek tot benoeming als bedoeld in het eerste, tweede of derde
      lid.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel12
  - number: '13'
    text: 'Voor benoeming als lid, secretaris of plaatsvervangend secretaris komen niet in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel13
  - number: 13.a
    text: |-
      ambtenaren of andere personen, werkzaam onder de verantwoordelijkheid van Onze Minister op het terrein van
      de tenuitvoerlegging van vrijheidsbenemende straffen en maatregelen, niet zijnde ambtenaren bij het openbaar
      ministerie;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel13
  - number: 13.b
    text: personeelsleden of medewerkers, werkzaam bij een inrichting;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel13
  - number: 13.c
    text: |-
      personen, werkzaam bij een door Onze Minister gesubsidieerde instelling die werkzaam is op het terrein van
      de tenuitvoerlegging van vrijheidsstraffen en vrijheidsbenemende maatregelen, indien zij in het kader van de
      uitoefening van hun functie te maken hebben met de personen, ingesloten in de inrichting waarbij de commissie van
      toezicht is ingesteld;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel13
  - number: 13.d
    text: |-
      personen, werkzaam onder de verantwoordelijkheid van Onze Minister, indien hun onafhankelijkheid of onpartijdigheid
      hetzij door hun positie, hetzij door de aard van hun werkzaamheden in het geding zou kunnen komen;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel13
  - number: 13.e
    text: |-
      personen tegen wie bezwaren bestaan tegen de vervulling van de functie die blijken uit de algemene
      documentatieregisters als bedoeld in het [Besluit justitiële gegevens][ref1] of de politiegegevens, bedoeld in
      [artikel 1, onderdeel a, van de Wet politiegegevens][ref2]. De bezwaren hebben betrekking op het vertrouwelijk
      karakter van de functie alsmede de aan de functie verbonden bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0016544
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel1
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0016544
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '1'
  - number: '14.1'
    text: 'Een lid van de commissie van toezicht wordt door Onze Minister tussentijds ontslagen:'
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel14
  - number: 14.1.a
    text: op eigen verzoek;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel14
  - number: 14.1.b
    text: |-
      bij de aanvaarding van een ambt of betrekking dat onverenigbaar is met het lidmaatschap van een commissie van
      toezicht;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel14
  - number: 14.1.c
    text: |-
      wanneer hij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij zulk
      een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel14
  - number: 14.1.d
    text: |-
      wanneer hij naar het oordeel van Onze Minister door handelen of nalaten ernstig nadeel toebrengt aan het in hem te
      stellen vertrouwen.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel14
  - number: '14.2'
    text: |-
      Aan een lid kan door Onze Minister tussentijds ontslag worden verleend bij het verlies van de hoedanigheid of
      beëindiging van de ambtsvervulling in verband waarmede de benoeming heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel14
  - number: '14.3'
    text: Hangende de procedure voor ontslag kan Onze Minister het lid in de uitoefening van zijn functie schorsen.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel14
  - number: '15.1'
    text: |-
      De leden van de commissie van toezicht hebben te allen tijde toegang tot alle plaatsen in de inrichting en tot alle
      plaatsen waar de gedetineerden of deelnemers aan een penitentiair programma verblijven.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel15
  - number: '15.2'
    text: |-
      De leden van de commissie van toezicht ontvangen van de directeur en de ambtenaren of medewerkers bij de inrichting
      of afdeling of het penitentiair programma alle door hen gewenste inlichtingen ten aanzien van de gedetineerden
      onderscheidenlijk deelnemers aan een penitentiair programma en kunnen alle op de wijze van tenuitvoerlegging
      van vrijheidsbenemende straffen en maatregelen betrekking hebbende stukken inzien. Zij zijn tot geheimhouding
      verplicht behoudens voor zover enig wettelijk voorschrift hen tot bekendmaking verplicht of in verband met de
      tenuitvoerlegging van hun taak de noodzaak tot bekendmaking voortvloeit. Dossiers die gedetineerden dan wel
      deelnemers aan een penitentiair programma betreffen kunnen worden ingezien, tenzij de betrokkene bezwaar maakt.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel15
  - number: '15.3'
    text: |-
      De directeur brengt alle voor de uitoefening van de taak der commissie belangrijke feiten en omstandigheden ter
      kennis van de commissie.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel15
  - number: '16.1'
    text: De commissie van toezicht vergadert, zo mogelijk, eenmaal in de maand.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel16
  - number: '16.2'
    text: |-
      De directeur woont de vergaderingen van de commissie van toezicht bij. Hij brengt op iedere vergadering een
      algemeen verslag uit over hetgeen sedert de vorige vergadering in de inrichting of afdeling is geschied.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel16
  - number: '16.3'
    text: De commissie kan besluiten buiten tegenwoordigheid van de directeur te vergaderen.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel16
  - number: '16.4'
    text: |-
      Onze Minister is bevoegd vergaderingen van de commissie van toezicht door een door hem aan te wijzen ambtenaar van
      zijn ministerie te doen bijwonen.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel16
  - number: '16.5'
    text: |-
      In iedere vergadering van de commissie van toezicht wordt mededeling gedaan van de grieven terzake waarvan
      werd bemiddeld, de door de beklagcommissie behandelde klaagschriften, en de bijzondere opmerkingen waartoe zij
      aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel16
  - number: '17.1'
    text: |-
      De maandcommissaris, bedoeld in [artikel 7, derde lid, tweede volzin, van de wet][ref1] houdt tenminste eenmaal per
      maand in de inrichting of afdeling spreekuur. Dit spreekuur wordt tijdig bekend gemaakt en kan worden bezocht door
      elke gedetineerde of deelnemer aan een penitentiair programma die de wens daartoe te kennen geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel7
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '7'
  - number: '17.2'
    text: |-
      De maandcommissaris doet van zijn werkzaamheden verslag aan de commissie van toezicht en informeert tevens de
      directeur hiervan.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel17
  - number: '18.1'
    text: |-
      De beklagcommissie, of, indien [artikel 62, tweede lid, van de wet][ref1] wordt toegepast, de voorzitter dan wel
      de door hem aangewezen persoon, houdt zitting zo dikwijls als een onverwijlde behandeling en afdoening van de
      klaagschriften dit noodzakelijk maken. Deze wordt bijgestaan door een secretaris.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel62
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '62'
  - number: '18.2'
    text: |-
      Indien de beklagcommissie zitting houdt treedt bij voorkeur als voorzitter op een met rechtspraak belast lid van de
      rechterlijke macht.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel18
  - number: '19.1'
    text: |-
      De commissie van toezicht brengt jaarlijks vóór 1 maart aan Onze Minister en aan de sectie gevangeniswezen verslag
      uit over haar werkzaamheden in het voorgaande jaar.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel19
  - number: '19.2'
    text: |-
      Zij schenkt in haar verslag in het bijzonder aandacht aan de werkzaamheden van de beklagcommissie, onder meer door
      een overzicht van de klaagschriften en de daarop genomen beslissingen. Onze Minister kan een model vaststellen
      omtrent de inrichting van het verslag.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel19
  - number: '20.1'
    text: De kosten van de commissie van toezicht worden door de Staat gedragen.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20
  - number: '20.2'
    text: |-
      De leden van de commissie van toezicht genieten vergoeding van reis- en verblijfskosten en een vacatiegeld met
      betrekking tot hun werkzaamheden overeenkomstig hetgeen daarover is overeengekomen in de laatstelijk gesloten
      collectieve arbeidsovereenkomst voor ambtenaren die krachtens een arbeidsovereenkomst met de Staat werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20
  - number: '20.3'
    text: |-
      Voor zover de secretaris of de plaatsvervangend secretaris geen ambtenaar is geniet deze tevens de in het tweede
      lid bedoelde vergoeding.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20
  - number: 20a.1
    text: |-
      De leden van de commissie van toezicht voor het vervoer, genoemd in [artikel 18e, eerste lid, van de wet][ref1],
      worden benoemd voor een periode van vijf jaren. Zij kunnen tweemaal voor herbenoeming in aanmerking komen.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel18e
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: 18e
  - number: 20a.2
    text: |-
      De [artikelen 11, derde lid][ref1], [12][ref2], [14][ref3], [16][ref4], [18][ref5], [19][ref6] en [20][ref7] zijn
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009398#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0009398#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0009398#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0009398#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0009398#Artikel18
      [ref6]: https://wetten.overheid.nl/BWBR0009398#Artikel19
      [ref7]: https://wetten.overheid.nl/BWBR0009398#Artikel20
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0009398
        artikel: '11'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0009398
        artikel: '12'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0009398
        artikel: '14'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0009398
        artikel: '16'
        hoofdstuk: '4'
      - id: ref5
        bwb_id: BWBR0009398
        artikel: '18'
        hoofdstuk: '4'
      - id: ref6
        bwb_id: BWBR0009398
        artikel: '19'
        hoofdstuk: '4'
      - id: ref7
        bwb_id: BWBR0009398
        artikel: '20'
        hoofdstuk: '4'
  - number: 20a.3
    text: |-
      [Artikel 13][ref1] is van overeenkomstige toepassing, met dien verstande dat voor benoeming als lid eveneens niet
      in aanmerking komen ambtenaren of andere personen, werkzaam onder de verantwoordelijkheid van Onze Minister op het
      terrein van de tenuitvoerlegging van vrijheidsbenemende straffen en maatregelen, niet zijnde ambtenaren bij het
      openbaar ministerie.


      [ref1]: https://wetten.overheid.nl/BWBR0009398#Artikel13
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0009398
        artikel: '13'
        hoofdstuk: '4'
  - number: 20b.1
    text: |-
      De leden van de commissie van toezicht voor het vervoer hebben te allen tijde toegang tot de plaatsen waar en de
      vervoersmiddelen waarmee handelingen betreffende het vervoer worden uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20b
  - number: 20b.2
    text: |-
      De leden van de commissie van toezicht ontvangen van Onze Minister en de directeur van de inrichting alle door
      hen gewenste inlichtingen ten aanzien van het vervoer van gedetineerden en kunnen alle op het vervoer betreffende
      stukken inzien. Zij zijn tot geheimhouding verplicht, behoudens voor zover enig wettelijk voorschrift hen tot
      bekendmaking verplicht of uit de tenuitvoerlegging van hun taak de noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20b
  - number: 20b.3
    text: |-
      Onze Minister en de directeur van de inrichting brengen alle voor de uitoefening van de taak van de commissie van
      toezicht belangrijke feiten en omstandigheden ter kennis van de commissie van toezicht.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20b
  - number: 20c
    text: |-
      Onze Minister kan nadere regels stellen over de inrichting van het detentie- en re-integratieplan, bedoeld in
      [artikel 18a van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel18a
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20c
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: 18a
  - number: 20d.1
    text: |-
      Voor zover dit noodzakelijk is ten behoeve van het vaststellen, aanpassen en uitvoeren van het detentie- en re-
      integratieplan van de gedetineerde kunnen gegevens, waaronder persoonsgegevens betreffende de gezondheid, over de
      essentiële voorwaarden voor deelname aan het maatschappelijk leven aan elkaar worden verstrekt door de directeur,
      de reclassering en het college.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20d
  - number: 20d.2
    text: 'De in het eerste lid bedoelde gegevens betreffen:'
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20d
  - number: 20d.2.a
    text: 'persoonsidentificerende gegevens:'
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20d
  - number: 20d.2.a.1°
    text: de geslachtsnaam;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20d
  - number: 20d.2.a.2°
    text: voornamen;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20d
  - number: 20d.2.a.3°
    text: adres;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20d
  - number: 20d.2.a.4°
    text: geboorteplaats en geboortedatum;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20d
  - number: 20d.2.a.5°
    text: nationaliteit;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20d
  - number: 20d.2.a.6°
    text: persoonsidentificerende nummers.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20d
  - number: 20d.2.b
    text: de datum van aanvang van de vrijheidsbeneming en van de invrijheidstelling.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20d
  - number: 20d.2.c
    text: |-
      de vaststelling dat de gedetineerde al dan niet beschikt over een geldig identiteitsbewijs als bedoeld in
      [artikel 1, eerste lid, onder 1° tot en met 3°, van de Wet op de identificatieplicht][ref1] en, indien hij over
      een dergelijk document beschikt, wat daarvan de geldigheidsduur is.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20d
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 20d.2.d
    text: 'het behoud of het verkrijgen van huisvesting of onderdak na detentie, zoals:'
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20d
  - number: 20d.2.d.1°
    text: de inschrijving als woningzoekende;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20d
  - number: 20d.2.d.2°
    text: de woonsituatie vóór detentie;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20d
  - number: 20d.2.d.3°
    text: het bestaan van een betalingsachterstand bij een huurovereenkomst.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20d
  - number: 20d.2.e
    text: 'het verkrijgen van een inkomen uit betaald werk of uitkering na detentie, zoals:'
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20d
  - number: 20d.2.e.1°
    text: het arbeidsverleden;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20d
  - number: 20d.2.e.2°
    text: eerdere uitkeringen of werkinkomen en de hoogte daarvan;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20d
  - number: 20d.2.e.3°
    text: het opleidingsniveau en eventueel lopende opleidingstrajecten.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20d
  - number: 20d.2.f
    text: |-
      gegevens als bedoeld in [artikel 8 van de Wet gemeentelijke schuldhulpverlening][ref1] ten behoeve van de
      toeleiding naar schuldhulpverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0031331#Artikel8
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20d
    references:
      - id: ref1
        bwb_id: BWBR0031331
        artikel: '8'
  - number: 20d.2.g
    text: |-
      de ondersteuning van de gedetineerde bij het opschorten en weer opstarten, of aanvragen van een zorgverzekering,
      zoals:
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20d
  - number: 20d.2.g.1°
    text: het hebben van een zorgverzekering vóór detentie;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20d
  - number: 20d.2.g.2°
    text: de naam van de zorgverzekeraar;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20d
  - number: 20d.2.g.3°
    text: het polisnummer behorende bij de verzekering.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20d
  - number: 20d.2.h
    text: |-
      het behoud of de versterking van een positief sociaal netwerk, met inbegrip van een hulpvraag namens de
      gedetineerde voor ondersteuning in de thuissituatie na detentie en een hulpvraag namens de gedetineerde aan de
      gemeente voor ondersteuning van gezinsleden tijdens de detentie.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20d
  - number: 20d.3
    text: |-
      De directeur, de reclassering en het college verstrekken elkaar, indien zorg of maatschappelijke ondersteuning
      tijdens of na detentie nodig is, de door hen verwerkte persoonsgegevens betreffende de gezondheid als bedoeld in
      het eerste lid, die noodzakelijk zijn voor het organiseren van deze zorg of maatschappelijke ondersteuning. Die
      gegevens kunnen betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20d
  - number: 20d.3.a
    text: |-
      eerdere en lopende zorgtrajecten in het kader van de [Wet maatschappelijke ondersteuning][ref1],
      de [Wet verplichte geestelijke gezondheidszorg][ref2], de
      [Wet zorg en dwang psychogeriatrische en verstandelijk gehandicapte cliënten][ref3], de [Jeugdwet][ref4] of de
      [Wet forensische zorg][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0035362
      [ref2]: https://wetten.overheid.nl/BWBR0040635
      [ref3]: https://wetten.overheid.nl/BWBR0040632
      [ref4]: https://wetten.overheid.nl/BWBR0034925
      [ref5]: https://wetten.overheid.nl/BWBR0040634
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20d
    references:
      - id: ref1
        bwb_id: BWBR0035362
      - id: ref2
        bwb_id: BWBR0040635
      - id: ref3
        bwb_id: BWBR0040632
      - id: ref4
        bwb_id: BWBR0034925
      - id: ref5
        bwb_id: BWBR0040634
  - number: 20d.3.b
    text: de naam van de zorgaanbieder die de trajecten uitvoert of bij de eerdere uitvoering betrokken is geweest;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20d
  - number: 20d.3.c
    text: de gemeente waar de zorg of maatschappelijke ondersteuning is of wordt verleend.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20d
  - number: 20d.4
    text: |-
      Ten behoeve van het vaststellen, aanpassen en uitvoeren van het detentie- en re-integratieplan, kunnen de
      directeur, de reclassering en het college overleggen over het inzetten van reclasseringstoezicht, het uitbrengen
      van advies en de inzet van interventies voor de invulling en uitvoering van het detentie- en re-integratieplan.
      Hiertoe kunnen gegevens worden verstrekt over:
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20d
  - number: 20d.4.a
    text: eerdere reclasseringscontacten, het detentieverloop en de detentiefasering;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20d
  - number: 20d.4.b
    text: de motivatie van de gedetineerde;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20d
  - number: 20d.4.c
    text: het gedrag van de gedetineerde tijdens detentie.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel20d
  - number: '21'
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *a-dwangbehandeling:* een onvrijwillige geneeskundige behandeling als
      bedoeld in [artikel 46d, onder a, van de wet][ref1];
        - *b-dwangbehandeling:* een onvrijwillige geneeskundige behandeling als bedoeld in
      [artikel 46d, onder b, van de wet][ref2];
        - *gedwongen geneeskundige handeling:* de gedwongen geneeskundige handeling, bedoeld in
      [artikel 32 van de wet][ref3];
        - *geneeskundige behandeling:* de onvrijwillige geneeskundige behandelingen, bedoeld in de onderdelen a tot en met
      c, en de vrijwillige geneeskundige behandeling, bedoeld in [artikel 46c van de wet][ref4];
        - *geneeskundig behandelingsplan:* het geneeskundig behandelingsplan, bedoeld in [artikel 46b van de wet][ref5];
        - *inspecteur:* de inspecteur, bedoeld in
      [artikel 1, onder c, van de Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref6];
        - *voorzetting van a-dwangbehandeling:* de voortzetting van a-dwangbehandeling, bedoeld in
      [artikel 46e, vijfde lid, van de wet][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel46d
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel46b
      [ref3]: https://wetten.overheid.nl/BWBR0009709#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0009709#Artikel46c
      [ref5]: https://wetten.overheid.nl/BWBR0009709#Artikel46b
      [ref6]: https://wetten.overheid.nl/BWBR0005700#Artikel1
      [ref7]: https://wetten.overheid.nl/BWBR0009709#Artikel46e
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: 46d
      - id: ref2
        bwb_id: BWBR0009709
        artikel: 46b
      - id: ref3
        bwb_id: BWBR0009709
        artikel: '32'
      - id: ref4
        bwb_id: BWBR0009709
        artikel: 46c
      - id: ref5
        bwb_id: BWBR0009709
        artikel: 46b
      - id: ref6
        bwb_id: BWBR0005700
        artikel: '1'
      - id: ref7
        bwb_id: BWBR0009709
        artikel: 46e
  - number: 21a.1
    text: |-
      Een geneeskundige behandeling wordt verricht in een daartoe geschikte ruimte, onder verantwoordelijkheid van de
      behandelend arts.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel21a
  - number: 21a.2
    text: |-
      In een inrichting of op een afdeling als bedoeld in [artikel 14, vierde lid, van de wet][ref1] is vierentwintig uur
      per dag, zeven dagen per week, voldoende psychiatrisch geschoold verpleegkundig personeel aanwezig. Bovendien is
      vierentwintig uur per dag, zeven dagen per week, een psychiater beschikbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel14
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '14'
  - number: 21a.3
    text: |-
      Een geneeskundige behandeling wordt slechts uitgevoerd door een arts of verpleegkundige die over voldoende
      deskundigheid beschikt deze behandeling uit te voeren en indien daartoe voldoende voorzieningen beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel21a
  - number: 21a.4
    text: |-
      Eens per twee weken, of vaker indien het belang van de gedetineerde dit eist, vindt een multidisciplinair overleg
      plaats, waaraan in ieder geval een psychiater, een arts, een psycholoog en een verpleegkundige deelnemen. De
      resultaten van het overleg alsmede de afspraken die daarbij zijn gemaakt worden geregistreerd in het medische
      dossier.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel21a
  - number: 21a.5
    text: |-
      Een geneeskundige behandeling van een gedetineerde die verblijft in een afdeling voor intensief toezicht als
      bedoeld in [artikel 1, onderdeel g, van de wet][ref1] of in een extra beveiligde inrichting als bedoeld in
      [artikel 13, eerste lid, onderdeel d, van de wet][ref2], wordt verricht door twee artsen, waarvan ten minste één
      arts is verbonden aan de inrichting, of door een aan de inrichting verbonden arts en een verpleegkundige.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel13
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0009709
        artikel: '13'
  - number: 21b.1
    text: 'In het geneeskundig behandelingsplan worden ten minste opgenomen:'
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel21b
  - number: 21b.1.a
    text: de diagnose van de stoornis van de geestvermogens van de gedetineerde;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel21b
  - number: 21b.1.b
    text: |-
      de therapeutische middelen, zo mogelijk gerelateerd aan de verschillende aspecten die in de stoornis te
      onderscheiden zijn, die zullen worden toegepast teneinde een zodanige verbetering van de stoornis van de
      geestvermogens van de gedetineerde te bereiken, dat het gevaar op grond waarvan deze in verband met zijn
      geestelijke gezondheidstoestand in een daartoe krachtens [artikel 14 van de wet][ref1] aangewezen afdeling of
      inrichting behoeft te verblijven, wordt weggenomen;


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel14
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel21b
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '14'
  - number: 21b.1.c
    text: of er overeenstemming over het geneeskundig behandelingsplan is.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel21b
  - number: 21b.2
    text: |-
      Gedurende de behandeling, kan het geneeskundig behandelingsplan worden gewijzigd. Bij een wijziging worden de
      uitkomsten van het multidisciplinair overleg, bedoeld in [artikel 21a, vierde lid][ref1], betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0009398#Artikel21a
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel21b
    references:
      - id: ref1
        bwb_id: BWBR0009398
        artikel: 21a
        hoofdstuk: '5'
  - number: 21b.3
    text: |-
      Een wijziging van het geneeskundig behandelingsplan wordt, in overleg met de gedetineerde, vastgesteld. De
      wijziging wordt hem voor het ingaan daarvan medegedeeld.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel21b
  - number: '22.1'
    text: 'Ingeval van een a- of b-dwangbehandeling wordt in het geneeskundig behandelingsplan eveneens opgenomen:'
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel22
  - number: 22.1.a
    text: |-
      welke minder bezwarende middelen zijn aangewend om het gevaar dat de stoornis van de geestvermogens de gedetineerde
      doet veroorzaken weg te nemen dan wel af te wenden; en
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel22
  - number: 22.1.b
    text: de wijze waarop rekening wordt gehouden met de voorkeuren van de gedetineerde ten aanzien van de behandeling.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel22
  - number: '22.2'
    text: |-
      Het deel van het geneeskundig behandelingsplan waarover geen overeenstemming kan worden bereikt met de gedetineerde
      dan wel diens curator of mentor, wordt slechts vastgesteld door een psychiater nadat een multidisciplinair overleg
      heeft plaatsgehad waaraan in ieder geval een psychiater, een arts, een psycholoog en een verpleegkundige hebben
      deelgenomen.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel22
  - number: '22.3'
    text: |-
      Ingeval van a-dwangbehandeling worden de verklaringen van de psychiaters, bedoeld in
      [artikel 46e, tweede lid, van de wet][ref1], bij het in het tweede lid bedoelde overleg betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel46e
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: 46e
  - number: 22a.1
    text: |-
      Voordat de directeur beslist dat een door de arts noodzakelijk geachte b-dwangbehandeling of gedwongen
      geneeskundige handeling zal worden toegepast, pleegt de directeur overleg met die arts en met het hoofd van de
      afdeling waar de gedetineerde verblijft. Indien de behandeling door een andere arts wordt verricht, wordt tevens
      met hem overlegd.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel22a
  - number: 22a.2
    text: |-
      Ingeval van b-dwangbehandeling of indien het verrichten van een gedwongen geneeskundige handeling noodzakelijk
      is ter afwending van gevaar dat voortvloeit uit de stoornis van de geestvermogens van de gedetineerde, pleegt de
      directeur bovendien overleg met de voor de behandeling verantwoordelijke psychiater.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel22a
  - number: 22a.3
    text: |-
      In het in het eerste en tweede lid bedoelde overleg wordt nagegaan of het gevaar niet op een andere wijze kan
      worden afgewend.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel22a
  - number: 22b.1
    text: |-
      Zo spoedig mogelijk na de aanvang van de gedwongen geneeskundige handeling wordt door of onder verantwoordelijkheid
      van een arts een plan opgesteld gericht op een zodanige verbetering van de toestand van de gedetineerde dat
      de toepassing van de gedwongen geneeskundige handeling kan worden beëindigd. Dit plan wordt opgenomen in het
      geneeskundig behandelingsplan.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel22b
  - number: 22b.2
    text: |-
      Bij de keuze voor een bepaalde geneeskundige handeling wordt steeds gekozen voor de voor de gedetineerde minst
      ingrijpende handeling.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel22b
  - number: 22c.1
    text: |-
      Voordat de directeur de beslissing tot verlenging van a-dwangbehandeling neemt, pleegt hij in ieder geval overleg
      met de voor de behandeling verantwoordelijke psychiater en met het hoofd van de afdeling waar de gedetineerde
      verblijft.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel22c
  - number: 22c.2
    text: |-
      In het in het eerste lid bedoelde overleg wordt nagegaan of van de voortzetting van de behandeling alsnog het
      beoogde effect kan worden verwacht.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel22c
  - number: 22c.3
    text: |-
      De uitkomsten van het multidisciplinaire overleg, bedoeld in [artikel 21a, vierde lid][ref1], worden bij de
      beslissing meegenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009398#Artikel21a
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel22c
    references:
      - id: ref1
        bwb_id: BWBR0009398
        artikel: 21a
        hoofdstuk: '5'
  - number: 22d
    text: |-
      De gedetineerde wordt gedurende de periode dat de a- of b-dwangbehandeling of de gedwongen geneeskundige handeling
      wordt verricht, zo vaak als nodig is bezocht door een arts of in diens opdracht een verpleegkundige. Het verslag
      van diens bevindingen wordt opgenomen in het medische dossier.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel22d
  - number: 22e.1
    text: |-
      De directeur stelt de voorzitter van de commissie van toezicht, de raadsman van de gedetineerde, de curator en de
      mentor in kennis van een voorgenomen beslissing tot a-dwangbehandeling uiterlijk drie dagen voor het nemen van die
      beslissing. Zij worden in de gelegenheid gesteld bezwaren tegen de beslissing kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel22e
  - number: 22e.2
    text: |-
      De voorzitter van de commissie van toezicht doet onverwijld een melding aan de maandcommissaris. De
      maandcommissaris bezoekt na de melding onverwijld de gedetineerde.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel22e
  - number: 22e.3
    text: |-
      Van de toepassing van een a-dwangbehandeling, b-dwangbehandeling, gedwongen geneeskundige handeling of voortzetting
      van een a-dwangbehandeling wordt uiterlijk bij de aanvang van de behandeling melding gedaan aan Onze Minister en de
      commissie van toezicht. Ingeval van a- en b- dwangbehandeling en indien een gedwongen geneeskundige handeling wordt
      toegepast in verband met een gevaar dat voortvloeit uit een stoornis van de geestvermogens van de verpleegde, wordt
      bovendien melding gedaan aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel22e
  - number: 22e.4
    text: |-
      Bij de aanvang van een a-dwangbehandeling geeft de directeur daarvan eveneens kennis aan de in het eerste lid
      genoemde personen.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel22e
  - number: 22e.5
    text: |-
      De directeur zendt met de melding, bedoeld in het derde lid, een afschrift van de beslissing tot de behandeling mee
      waarin hij in ieder geval vermeldt:
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel22e
  - number: 22e.5.a
    text: |-
      in verband met welk gevaar is besloten tot een a- of b-dwangbehandeling, dan wel een gedwongen geneeskundige
      handeling;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel22e
  - number: 22e.5.b
    text: |-
      welke minder bezwarende middelen zijn aangewend om het gevaar dat de gedetineerde doet veroorzaken weg te nemen dan
      wel af te wenden;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel22e
  - number: 22e.5.c
    text: |-
      welke personen, bedoeld in [artikel 46c, onder c, van de wet][ref1], zich tegen de behandeling verzetten;


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel46c
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel22e
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: 46c
  - number: 22e.5.d
    text: de wijze waarop rekening wordt gehouden met de voorkeuren van de gedetineerde ten aanzien van de behandeling; en
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel22e
  - number: 22e.5.e
    text: |-
      indien een behandeling plaatsvindt in een situatie waarin het de gedetineerde is die zich verzet, of deze in
      staat kan worden geacht gebruik te kunnen maken van de regeling, vervat in de [hoofdstukken XI–XII][ref1]
      respectievelijk [XIII van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009709#HoofdstukXI
      [ref2]: https://wetten.overheid.nl/BWBR0009709#HoofdstukXIII
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel22e
    references:
      - id: ref1
        bwb_id: BWBR0009709
        hoofdstuk: XI
      - id: ref2
        bwb_id: BWBR0009709
        hoofdstuk: XIII
  - number: 22e.6
    text: |-
      Ingeval van een beslissing tot a-dwangbehandeling, b-dwangbehandeling en een beslissing tot voortzetting van a-
      dwangbehandeling, vermeldt de directeur tevens welke pogingen zijn gedaan om tot overeenstemming als bedoeld in
      [artikel 46c, onder b, van de wet][ref1] te komen. Ingeval van een beslissing tot a-dwangbehandeling vermeldt hij
      bovendien welke bezwaren tegen de behandeling zijn aangevoerd door de personen, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel46c
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel22e
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: 46c
  - number: 22e.7
    text: |-
      Van een beëindiging van een a-dwangbehandeling, b-dwangbehandeling of gedwongen geneeskundige handeling geeft de
      directeur kennis aan de personen, genoemd in het derde en – indien van toepassing – vierde lid.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel22e
  - number: 22f
    text: |-
      De verantwoordelijke arts draagt zorg dat de melding van de toepassing van a-dwangbehandeling, b-dwangbehandeling,
      gedwongen geneeskundige handeling of voortzetting van a-dwangbehandeling en de resultaten van het overleg, bedoeld
      in [artikel 21a, vierde lid][ref1], [artikel 22a][ref2] en [22c][ref3], alsmede de adviezen die daarbij zijn
      gegeven en de afspraken die zijn gemaakt worden geregistreerd in het medische dossier.


      [ref1]: https://wetten.overheid.nl/BWBR0009398#Artikel21a
      [ref2]: https://wetten.overheid.nl/BWBR0009398#Artikel22a
      [ref3]: https://wetten.overheid.nl/BWBR0009398#Artikel22c
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel22f
    references:
      - id: ref1
        bwb_id: BWBR0009398
        artikel: 21a
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0009398
        artikel: 22a
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0009398
        artikel: 22c
        hoofdstuk: '5'
  - number: 22g.1
    text: |-
      De inspecteur stelt na beëindiging van elke a- of b-dwangbehandeling doch in ieder geval na afloop van de termijn,
      bedoeld in [artikel 46e, vierde lid, van de wet][ref1], een onderzoek in of de beslissing tot de behandeling
      zorgvuldig is genomen en of de uitvoering van de behandeling zorgvuldig is geschied.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel46e
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel22g
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: 46e
  - number: 22g.2
    text: |-
      De inspecteur stelt eveneens een onderzoek in na beëindiging van elke gedwongen geneeskundige handeling indien
      die handeling is verricht ter afwending van een gevaar dat voortvloeit uit de stoornis van de geestvermogens van
      de gedetineerde.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel22g
  - number: '23.1'
    text: |-
      Indien de toepassing van de behandeling, bedoeld in [artikel 22a, tweede lid][ref1], de duur van twee weken te
      boven gaat wordt door de directeur een commissie samengesteld bestaande uit ten minste een afdelingshoofd, een
      psychiater, een arts en een psycholoog.


      [ref1]: https://wetten.overheid.nl/BWBR0009398#Artikel22a
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009398
        artikel: 22a
        hoofdstuk: '5'
  - number: '23.2'
    text: |-
      De in het eerste lid bedoelde commissie brengt binnen twee dagen na de in het eerste lid bedoelde termijn en,
      indien de onvrijwillige geneeskundige behandeling langer wordt voortgezet, om de twee weken, advies uit aan de
      directeur over de voortzetting van die behandeling.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel23
  - number: 23a.1
    text: |-
      Telefoongesprekken die in verband met het toezicht, bedoeld in [artikel 39, tweede lid, van de wet][ref1] worden
      opgenomen, worden bewaard voor een periode van ten hoogste vier maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel39
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '39'
  - number: 23a.2
    text: Na het verstrijken van de periode, genoemd in het eerste lid, wordt een opgenomen telefoongesprek gewist.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel23a
  - number: 23a.3
    text: |-
      Indien bij de uitoefening van het toezicht blijkt dat een telefoongesprek met een persoon als bedoeld in
      [artikel 37, eerste lid, van de wet][ref1] is opgenomen, wordt dit opgenomen gesprek terstond gewist.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel37
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '37'
  - number: 23a.4
    text: De gedetineerde wordt van het opnemen van het telefoonverkeer op de hoogte gesteld.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel23a
  - number: 23a.5
    text: |-
      Opgenomen telefoongesprekken worden slechts verstrekt aan derden die ingevolge de uitvoering van hen bij of
      krachtens de wet opgedragen taken, tot kennisneming daarvan bevoegd zijn.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel23a
  - number: 23a.6
    text: 'De verstrekking, bedoeld in het vijfde lid, kan slechts geschieden in verband met:'
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel23a
  - number: 23a.6.a
    text: de handhaving van de orde of de veiligheid in de inrichting;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel23a
  - number: 23a.6.b
    text: de bescherming van de openbare orde of nationale veiligheid;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel23a
  - number: 23a.6.c
    text: de voorkoming of opsporing van strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel23a
  - number: 23a.6.d
    text: de bescherming van slachtoffers van of anderszins betrokkenen bij misdrijven.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel23a
  - number: 23b.1
    text: |-
      De gedetineerde en de rechtsbijstandverlener worden op de hoogte gesteld van het visueel toezicht op gesprekken
      tussen de gedetineerde en de rechtsbijstandverlener als bedoeld in [artikel 38, achtste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel38
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '38'
  - number: 23b.2
    text: |-
      Het visueel toezicht vindt plaats door middel van cameraobservatie. De camerabeelden worden terstond na het gesprek
      gewist.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel23b
  - number: 23b.3
    text: |-
      In afwijking van het tweede lid worden de camerabeelden bewaard als een ambtenaar of medewerker bij de inrichting
      of afdeling het gesprek tussen de gedetineerde en de rechtsbijstandverlener onderbreekt en de directeur na het
      horen van de ambtenaar of medewerker beslist tot beëindiging van het gesprek.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel23b
  - number: 23b.4
    text: |-
      De op grond van het derde lid bewaarde camerabeelden worden verwijderd zes weken na het verstrijken van
      de beklagtermijn als bedoeld in [artikel 61, vijfde lid, van de wet][ref1], tenzij beklag is ingesteld.
      In dat geval volgt verwijdering zes weken na het verstrijken van de beroepstermijn als bedoeld in
      [artikel 69, eerste lid, van de wet][ref2], tenzij beroep is ingesteld. In dat geval volgt verwijdering de dag na
      de uitspraak van de beroepscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel69
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '61'
      - id: ref2
        bwb_id: BWBR0009709
        artikel: '69'
  - number: 23b.5
    text: |-
      In het kader van het in [artikel 45a, eerste lid, van de Advocatenwet][ref1] bedoelde toezicht licht de directeur
      de deken in het arrondissement waar de rechtsbijstandverlener kantoor houdt in over het beëindigen van een gesprek,
      als bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel45a
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 45a
  - number: '24.1'
    text: |-
      Bij het Ministerie van Justitie en Veiligheid zijn een hoofd boeddhistische geestelijke verzorging, een hoofd
      hindoeïstische geestelijke verzorging, een hoofd islamitische geestelijke verzorging, een hoofdrabbijn, een
      hoofdpredikant, een hoofdaalmoezenier en een hoofd humanistische geestelijke verzorging aangesteld. Zij treden op
      als vertegenwoordiging van de zendende instanties en dienen Onze Minister gevraagd en ongevraagd van advies omtrent
      de geestelijke verzorging in de inrichtingen.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel24
  - number: '24.2'
    text: |-
      De hoofden zijn in ieder geval belast met het doen van voordrachten voor aanstelling van geestelijk verzorgers
      behorende tot hun gezindte of levensovertuiging.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel24
  - number: '25'
    text: |-
      Aan een inrichting zijn geestelijk verzorgers van verschillende godsdiensten of levensovertuigingen verbonden, doch
      in elk geval geestelijk verzorgers van boeddhistische, hindoeïstische, islamitische, joodse, protestantse en rooms-
      katholieke gezindte en geestelijk verzorgers van het humanistisch verbond.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel25
  - number: '26'
    text: |-
      De aanstelling van een geestelijk verzorger van boeddhistische, hindoeïstische, islamitische, joodse, protestantse
      of rooms-katholieke gezindte of een geestelijk verzorger behorend tot het humanistisch verbond geschiedt door of
      vanwege Onze Minister op voordracht van de betrokken hoofdgeestelijke, genoemd in [artikel 24, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009398#Artikel24
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0009398
        artikel: '24'
        hoofdstuk: '6'
  - number: '27'
    text: |-
      Een andere geestelijk verzorger dan de in [artikel 25][ref1] genoemde kan door de directeur toegang worden verleend
      tot de inrichting. De directeur neemt deze beslissing niet dan na overleg met Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0009398#Artikel25
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0009398
        artikel: '25'
        hoofdstuk: '6'
  - number: '28'
    text: |-
      Geestelijke verzorging van een gedetineerde die verblijft in een afdeling voor intensief toezicht als
      bedoeld in [artikel 1, onderdeel g, van de wet][ref1] of in een extra beveiligde inrichting, bedoeld in
      [artikel 13, eerste lid, onderdeel d, van de wet][ref2], wordt verleend door twee geestelijke verzorgers van in
      beginsel dezelfde godsdienst of levensovertuiging, waarvan ten minste één geestelijk verzorger is verbonden aan
      een inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel13
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0009709
        artikel: '13'
  - number: '29'
    text: |-
      De directeur houdt aantekening van de rechtsbijstandverleners die op grond van
      [artikel 40a, eerste, vijfde of zesde lid, van de wet][ref1] toegang hebben tot de gedetineerde die verblijft in
      een afdeling voor intensief toezicht als bedoeld in [artikel 1, onderdeel g, van de wet][ref2] of in een extra
      beveiligde inrichting, als bedoeld in [artikel 13, eerste lid, onderdeel d, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel40a
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0009709#Artikel13
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: 40a
      - id: ref2
        bwb_id: BWBR0009709
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0009709
        artikel: '13'
  - number: '30'
    text: |-
      De directeur draagt er zorg voor dat brieven of andere poststukken die op grond van
      [artikel 40a, tweede lid, van de wet][ref1] niet worden uitgereikt aan de gedetineerde, ongeopend worden
      geretourneerd aan de afzender. De directeur vermeldt aan de afzender de reden waarom niet tot uitreiking is
      overgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel40a
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: 40a
  - number: '31'
    text: |-
      Op een verzoek tot het toestaan van een of meer andere rechtsbijstandverleners als bedoeld in
      [artikel 40a, zesde lid, van de wet][ref1], wordt zo spoedig mogelijk maar in elk geval binnen een maand beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel40a
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: 40a
  - number: '32.1'
    text: |-
      Bezoek door de in [artikel 37, eerste lid, van de wet][ref1], genoemde personen en instanties, aan een gedetineerde
      die verblijft in een afdeling voor intensief toezicht als bedoeld in [artikel 1, onderdeel g, van de wet][ref2]
      of in een extra beveiligde inrichting als bedoeld in [artikel 13, eerste lid, onderdeel d, van de wet][ref3] wordt
      afgelegd door ten minste twee personen.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0009709#Artikel13
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '37'
      - id: ref2
        bwb_id: BWBR0009709
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0009709
        artikel: '13'
  - number: '32.2'
    text: Het eerste lid is niet van toepassing op de rechtsbijstandverlener van de gedetineerde.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel32
  - number: '35'
    text: |-
      Met uitzondering van personen in vreemdelingenbewaring wordt van iedere gedetineerde en deelnemer aan een
      penitentiair programma een penitentiair dossier aangelegd.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel35
  - number: '36.1'
    text: |-
      Het penitentiair dossier wordt op zorgvuldige wijze volgens een vaste standaardindeling opgebouwd. In de navolgende
      volgorde worden in het penitentiair dossier opgenomen:
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel36
  - number: 36.1.a
    text: een overzicht van de periodes en inrichtingen van verblijf;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel36
  - number: 36.1.b
    text: selectie- en plaatsingsvoorstellen;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel36
  - number: 36.1.c
    text: registratiekaarten;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel36
  - number: 36.1.d
    text: |-
      de in [artikel 37][ref1] genoemde bescheiden, gerangschikt per inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0009398#Artikel37
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0009398
        artikel: '37'
        hoofdstuk: '8'
  - number: '36.2'
    text: Het dossier wordt in een afsluitbare ruimte in de inrichting bewaard.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel36
  - number: '37.1'
    text: 'In het penitentiair dossier worden tevens opgenomen:'
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel37
  - number: 37.1.a
    text: |-
      een eindrapportage van de inrichting bij invrijheidstelling van de gedetineerde dan wel een eindrapportage van het
      penitentiair programma bij invrijheidstelling vanuit het penitentiair programma van de deelnemer daaraan;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel37
  - number: 37.1.b
    text: |-
      een kopie van een selectieadvies onderscheidenlijk een overplaatsingsvoorstel onderscheidenlijk een voorstel tot
      deelname aan een penitentiair programma of de beëindiging daarvan met de daarbij behorende adviezen;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel37
  - number: 37.1.c
    text: de meest recente registratiekaart;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel37
  - number: 37.1.d
    text: 'andere belangrijke justitiële documenten, waaronder:'
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel37
  - number: 37.1.d.1
    text: |-
      de grond voor opneming, bedoeld in [artikel 6:2:1 van het Wetboek van Strafvordering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
  - number: 37.1.d.2
    text: formulieren betreffende verlof en de daarop genomen beslissing;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel37
  - number: 37.1.d.3
    text: verzoeken onderscheidenlijk machtigingen tot plaatsing en overplaatsing en deelname aan een penitentiair programma;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel37
  - number: 37.1.d.4
    text: gratieverzoeken en de daarop genomen beslissing;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel37
  - number: 37.1.d.5
    text: verzoeken om strafonderbreking en de daarop genomen beslissing;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel37
  - number: 37.1.d.6
    text: mededelingen omtrent de voorwaardelijke invrijheidstelling.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel37
  - number: 37.1.e
    text: uitslagen van urinecontroles, dan wel een samenvattend overzicht daarvan;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel37
  - number: 37.1.f
    text: kopieën van strafrapporten, meldingen van bijzondere voorvallen en interne meldingen;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel37
  - number: 37.1.g
    text: documenten betreffende beklagzaken en beroepszaken;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel37
  - number: 37.1.h
    text: kopieën van correspondentie van de inrichting over de gedetineerde;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel37
  - number: 37.1.i
    text: een kopie van het intakeformulier per inrichting van verblijf;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel37
  - number: 37.1.j
    text: samenvattingen van periodieke besprekingen over de gedetineerde in inrichtingsoverleggen;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel37
  - number: 37.1.k
    text: kopieën van risicotaxaties;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel37
  - number: 37.1.l
    text: kopieën van delictanalyses;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel37
  - number: 37.1.m
    text: het detentie- en re-integratieplan en de daarop aangebrachte aanpassingen.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel37
  - number: '37.2'
    text: |-
      De overige op de gedetineerde betrekking hebbende stukken worden verzameld in een inrichtingsdossier. Zij worden
      gerangschikt naar onderwerp in chronologische volgorde.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel37
  - number: '38.1'
    text: |-
      Indien de directeur een voorstel tot selectie van een gedetineerde doet, zendt hij daarbij het penitentiair dossier
      mee aan de selectiefunctionaris.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel38
  - number: '38.2'
    text: |-
      De directeur zendt het penitentiair dossier gelijktijdig met de formele overplaatsing van de gedetineerde aan de
      directeur van de inrichting of afdeling waar de gedetineerde verder zal verblijven.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel38
  - number: '38.3'
    text: |-
      Indien een gedetineerde wordt overgebracht naar een instelling voor de verlening van forensische zorg, als bedoeld
      in [artikel 1.1, eerste lid, onder f, van de Wet forensische zorg][ref1], zendt de directeur de voor een goede en
      veilige verlening van de forensische zorg noodzakelijk geachte bescheiden daaruit aan het hoofd of de geneesheer-
      directeur van die instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0040634#Artikel1
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0040634
        artikel: '1'
  - number: '38.4'
    text: |-
      Indien een gedetineerde in de gelegenheid wordt gesteld deel te nemen aan een penitentiair programma zendt de
      directeur het penitentiair dossier aan de directeur bedoeld in [artikel 8, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009398#Artikel8
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0009398
        artikel: '8'
        hoofdstuk: '3'
  - number: '38.5'
    text: |-
      Bij invrijheidstelling, ontvluchting of overlijden van een gedetineerde zendt de directeur het penitentiair dossier
      naar Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel38
  - number: '39.1'
    text: |-
      Onze Minister bewaart het penitentiair dossier gedurende een termijn van tien jaren, te rekenen vanaf het tijdstip
      van ontvangst van het dossier.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel39
  - number: '39.2'
    text: |-
      Na de in het eerste lid genoemde termijn worden de bescheiden, opgenomen in het penitentiair dossier, vernietigd,
      ofwel zodanig bewerkt dat deze niet meer tot de gedetineerde kunnen worden herleid, tenzij dit in strijd is met een
      aanmerkelijk belang van een ander dan de gedetineerde.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel39
  - number: '39.3'
    text: |-
      Indien de gedetineerde vóór de afloop van de in het eerste lid bedoelde termijn opnieuw wordt gedetineerd vervalt
      de bewaartermijn.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel39
  - number: '39.4'
    text: |-
      Het inrichtingsdossier, bedoeld in [artikel 37, tweede lid][ref1], wordt zes maanden na beëindiging van het
      verblijf van de gedetineerde in de inrichting vernietigd. Indien de gedetineerde vóór de afloop van deze termijn
      opnieuw in die inrichting wordt gedetineerd vervalt de bewaartermijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009398#Artikel37
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0009398
        artikel: '37'
        hoofdstuk: '8'
  - number: '40.1'
    text: |-
      De directeur kan, in geval van weigering van inzage door de gedetineerde van diens dossier op een van de gronden
      van [artikel 21, tweede lid, van de Wet justitiële en strafvorderlijke gegevens][ref1], een door de gedetineerde
      gemachtigd lid van de commissie van toezicht doen kennis nemen van de gegevens waarvan de kennisneming aan de
      gedetineerde onthouden wordt. De [artikelen 57][ref2] en [58 van de wet][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel57
      [ref3]: https://wetten.overheid.nl/BWBR0009709#Artikel58
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0009709
        artikel: '57'
      - id: ref3
        bwb_id: BWBR0009709
        artikel: '58'
  - number: '40.2'
    text: |-
      Aan Onze Minister en de door deze aan te wijzen ambtenaren of medewerkers kunnen gegevens uit het dossier worden
      verstrekt voor zover dat noodzakelijk is voor:
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel40
  - number: 40.2.a
    text: de behandeling van verzoeken de gedetineerde betreffende;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel40
  - number: 40.2.b
    text: de behandeling van procedures de gedetineerde betreffende;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel40
  - number: 40.2.c
    text: het beheer van de dossiers;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel40
  - number: 40.2.d
    text: de behandeling van overige beslissingen de gedetineerde betreffende.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel40
  - number: 44b
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44b
  - number: 44b.a
    text: |-
      maatregel: plaatsing in een inrichting voor stelselmatige daders als bedoeld in
      [artikel 38m van het Wetboek van Strafrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38m
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 38m
  - number: 44b.b
    text: |-
      inrichting: inrichting voor stelselmatige daders als bedoeld in [artikel 10a van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel10a
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44b
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: 10a
  - number: 44b.c
    text: 'betrokkene: persoon aan wie de maatregel is opgelegd tot plaatsing in een inrichting voor stelselmatige daders;'
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44b
  - number: 44b.d
    text: |-
      college van burgemeester en wethouders: college van burgemeester en wethouders van de gemeente die deelneemt aan de
      tenuitvoerlegging van de maatregel, als bedoeld in [artikel 38o, derde lid, van het Wetboek van Strafrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38o
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 38o
  - number: 44b.e
    text: |-
      verblijfsplan: verblijfsplan als bedoeld in [artikel 18a, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel18a
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44b
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: 18a
  - number: 44b.f
    text: |-
      evaluatie: evaluatie als bedoeld in [artikel 18c van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel18c
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44b
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: 18c
  - number: 44c
    text: |-
      [Hoofdstuk 3][ref1] is niet van toepassing op de tenuitvoerlegging van de maatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0009398#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44c
    references:
      - id: ref1
        bwb_id: BWBR0009398
        hoofdstuk: '3'
  - number: 44d.1
    text: De tenuitvoerlegging van de maatregel vindt plaats in een inrichting.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44d
  - number: 44d.2
    text: |-
      De directeur kan betrokkene overeenkomstig bij regeling van Onze Minister te stellen nadere regels toestemming
      verlenen om de inrichting tijdelijk te verlaten.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44d
  - number: 44d.3
    text: De tenuitvoerlegging van de laatste fase van de maatregel kan plaatsvinden buiten de inrichting.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44d
  - number: 44e.1
    text: |-
      De algemene verantwoordelijkheid voor de tenuitvoerlegging van de laatste fase van de maatregel buiten de
      inrichting ligt bij de directeur.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44e
  - number: 44e.2
    text: |-
      De verantwoordelijkheid voor de uitvoering van de laatste fase van de maatregel buiten de inrichting ligt bij het
      college van burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44e
  - number: 44f.1
    text: |-
      Onze Minister en het college van burgemeester en wethouders maken nadere afspraken over de tenuitvoerlegging van de
      laatste fase van de maatregel buiten de inrichting. Daarin worden in ieder geval afspraken gemaakt over:
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44f
  - number: 44f.1.a
    text: huisvesting;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44f
  - number: 44f.1.b
    text: arbeid;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44f
  - number: 44f.1.c
    text: dagbesteding van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44f
  - number: 44f.2
    text: |-
      De kosten van de tenuitvoerlegging van de laatste fase van de maatregel, voor zover die betrekking hebben op
      het verblijf buiten de inrichting, komen ten laste van de gemeente, onverminderd het recht van betrokkene op een
      socialezekerheidsuitkering.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44f
  - number: 44g.1
    text: |-
      Het verblijfsplan bestrijkt de wijze van tenuitvoerlegging van de maatregel. Het plan wordt in zijn geheel of
      in gedeelten vastgesteld door de directeur. Het verblijfsplan voor de laatste fase van de maatregel buiten de
      inrichting wordt vastgesteld door de directeur en het college van burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44g
  - number: 44g.2
    text: |-
      Indien een programma als bedoeld in [artikel 44j][ref1] wordt aangeboden, wordt bij de opstelling van het
      verblijfsplan het oordeel ingewonnen van degenen die verantwoordelijk zijn voor de uitvoering van de onderdelen van
      dat programma.


      [ref1]: https://wetten.overheid.nl/BWBR0009398#Artikel44j
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44g
    references:
      - id: ref1
        bwb_id: BWBR0009398
        artikel: 44j
        hoofdstuk: 9A
  - number: 44h.1
    text: |-
      Het verblijfsplan kan worden gewijzigd. Bij een wijziging wordt het evaluatieverslag, bedoeld in
      [artikel 18c, derde lid, van de wet][ref1], betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel18c
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44h
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: 18c
  - number: 44h.2
    text: |-
      Een wijziging in het verblijfsplan wordt zo veel mogelijk in overleg met betrokkene vastgesteld. De wijziging wordt
      hem voor het ingaan daarvan meegedeeld.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44h
  - number: 44h.3
    text: |-
      [Artikel 44g][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009398#Artikel44g
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44h
    references:
      - id: ref1
        bwb_id: BWBR0009398
        artikel: 44g
        hoofdstuk: 9A
  - number: 44i.1
    text: 'In het verblijfsplan worden in ieder geval opgenomen:'
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44i
  - number: 44i.1.a
    text: een diagnose van de lichamelijke en geestelijke gesteldheid van betrokkene;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44i
  - number: 44i.1.b
    text: een individueel begeleidingsplan.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44i
  - number: 44i.2
    text: 'Indien een programma wordt aangeboden, wordt in het verblijfsplan ook opgenomen:'
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44i
  - number: 44i.2.a
    text: het programma;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44i
  - number: 44i.2.b
    text: |-
      de voorwaarden die zijn verbonden aan deelneming aan het programma, de afspraken met betrokkene over deelneming
      daaraan en de gevolgen van het niet nakomen van die afspraken;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44i
  - number: 44i.2.c
    text: |-
      de naam van de trajectcoördinator, bedoeld in [artikel 44k][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009398#Artikel44k
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44i
    references:
      - id: ref1
        bwb_id: BWBR0009398
        artikel: 44k
        hoofdstuk: 9A
  - number: 44i.3
    text: |-
      De in het tweede lid, onderdeel b, bedoelde afspraken houden in ieder geval in dat betrokkene zich schriftelijk
      bereid verklaart deel te nemen aan het programma en te voldoen aan de daaraan verbonden voorwaarden.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44i
  - number: 44i.4
    text: Het verblijfsplan wordt opgenomen in het penitentiair dossier.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44i
  - number: 44j.1
    text: |-
      Gedurende het verblijf wordt een programma aangeboden, indien aannemelijk is dat betrokkene in staat en bereid is
      aan een programma deel te nemen.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44j
  - number: 44j.2
    text: |-
      Indien ten aanzien van de betrokkene een specifieke problematiek bestaat waarmee het plegen van strafbare feiten
      samenhangt, wordt in het programma met die problematiek rekening gehouden.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44j
  - number: 44j.3
    text: 'Het programma is in ieder geval gericht op de ontwikkeling van vaardigheden van betrokkene ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44j
  - number: 44j.3.a
    text: zelfzorg en hygiëne;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44j
  - number: 44j.3.b
    text: arbeid;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44j
  - number: 44j.3.c
    text: scholing;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44j
  - number: 44j.3.d
    text: besteding van vrije tijd;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44j
  - number: 44j.3.e
    text: beheer van financiën;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44j
  - number: 44j.3.f
    text: zelfstandig wonen;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44j
  - number: 44j.3.g
    text: sociale omgang.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44j
  - number: 44k
    text: |-
      Indien een programma wordt aangeboden, wijst de directeur voor de betrokkene een trajectcoördinator aan. De
      trajectcoördinator heeft tot taak:
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44k
  - number: 44k.a
    text: betrokkene gedurende het gehele verblijf te begeleiden;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44k
  - number: 44k.b
    text: |-
      toezicht uit te oefenen op de naleving van de afspraken met betrokkene en op het voldoen aan de voorwaarden voor
      deelneming aan het programma;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44k
  - number: 44k.c
    text: |-
      over het verblijfsplan te rapporteren en te adviseren aan de directeur en, wat de laatste fase buiten de inrichting
      betreft, ook aan het college van burgemeester en wethouders;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44k
  - number: 44k.d
    text: verbindingen te leggen tussen de instanties die verantwoordelijk zijn voor de uitvoering van het programma.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44k
  - number: 44l.1
    text: |-
      De selectiefunctionaris beslist over plaatsing buiten de inrichting in de laatste fase op de grondslag van een
      advies van de directeur en het college van burgemeester en wethouders. Alvorens te adviseren winnen de directeur en
      het college van burgemeester en wethouders het oordeel van de trajectcoördinator in.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44l
  - number: 44l.2
    text: |-
      Bij de beslissing over plaatsing buiten de inrichting in de laatste fase worden in ieder geval de volgende aspecten
      betrokken:
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44l
  - number: 44l.2.a
    text: |-
      het verloop van de tenuitvoerlegging, waaronder het gedrag van betrokkene, het nakomen van afspraken door hem en
      zijn gemotiveerdheid;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44l
  - number: 44l.2.b
    text: het gevaar voor recidive;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44l
  - number: 44l.2.c
    text: de mate waarin hij in staat zal zijn de met de grotere vrijheden gepaard gaande verantwoordelijkheid te dragen.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44l
  - number: 44l.3
    text: |-
      Aan de plaatsing buiten de inrichting in de laatste fase worden, behoudens nader door de directeur of het college
      van burgemeester en wethouders te stellen bijzondere voorwaarden, de volgende algemene voorwaarden gesteld:
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44l
  - number: 44l.3.a
    text: |-
      betrokkene gedraagt zich overeenkomstig de aanwijzingen van de trajectcoördinator en degenen die verantwoordelijk
      zijn voor de uitvoering van het programma en verschaft aan dezen alle verlangde inlichtingen;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44l
  - number: 44l.3.b
    text: hij doet tevoren melding aan de trajectcoördinator van een verandering van betrekking of woonplaats;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44l
  - number: 44l.3.c
    text: hij maakt zich niet schuldig aan een strafbaar feit;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44l
  - number: 44l.3.d
    text: |-
      hij onthoudt zich van het gebruik van een middel, vermeld op de bij de [Opiumwet behorende lijst I][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001941
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44l
    references:
      - id: ref1
        bwb_id: BWBR0001941
  - number: 44l.4
    text: Van het stellen van bijzondere voorwaarden doet de directeur mededeling aan de selectiefunctionaris.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44l
  - number: 44l.5
    text: |-
      Betrokkene heeft het recht bij de selectiefunctionaris een met redenen omkleed
      verzoekschrift in te dienen strekkende tot plaatsing buiten de inrichting in de laatste fase.
      [Artikel 18, tweede en derde lid, van de wet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel18
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44l
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '18'
  - number: 44m.1
    text: |-
      Indien betrokkene niet of niet meer in staat of bereid is deel te nemen aan het programma in de laatste fase
      buiten de inrichting dan wel te voldoen aan de daaraan verbonden voorwaarden, kan de selectiefunctionaris hem op de
      grondslag van een advies van de directeur terugplaatsen in de inrichting.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44m
  - number: 44m.2
    text: |-
      Alvorens te adviseren aan de selectiefunctionaris wint de directeur het oordeel van het college van burgemeester en
      wethouders- en de trajectcoördinator in.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44m
  - number: 44m.3
    text: |-
      Betrokkene heeft het recht een met redenen omkleed bezwaarschrift in te dienen tegen de beslissing, bedoeld in het
      eerste lid. [Artikel 17, tweede tot en met vijfde lid, van de wet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel17
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44m
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '17'
  - number: 44n.1
    text: |-
      Bij overtreding van de in [artikel 44l, derde lid][ref1], bedoelde voorwaarden kan de directeur beslissen tot:


      [ref1]: https://wetten.overheid.nl/BWBR0009398#Artikel44l
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44n
    references:
      - id: ref1
        bwb_id: BWBR0009398
        artikel: 44l
        hoofdstuk: 9A
  - number: 44n.1.a
    text: het geven van een waarschuwing aan betrokkene;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44n
  - number: 44n.1.b
    text: wijziging of aanvulling van de aan plaatsing buiten de inrichting gestelde bijzondere voorwaarden.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44n
  - number: 44n.2
    text: |-
      De directeur neemt een beslissing als bedoeld in het eerste lid niet dan nadat hij het oordeel van de
      trajectcoördinator heeft ingewonnen en heeft overlegd met het college van burgemeester en wethouders. De directeur
      geeft betrokkene van een beslissing als bedoeld in het eerste lid onverwijld schriftelijk en zo veel mogelijk
      in een voor hem begrijpelijke taal een met redenen omklede, gedagtekende en ondertekende mededeling. Van de
      overtreding van de voorwaarden en een beslissing als bedoeld in het eerste lid doet de directeur mededeling aan
      de selectiefunctionaris.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44n
  - number: 44o
    text: |-
      De [artikelen 15, eerste en tweede lid][ref1], en [17, eerste lid][ref2], zijn van overeenkomstige toepassing op de
      tenuitvoerlegging van de laatste fase van de maatregel buiten de inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0009398#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009398#Artikel17
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44o
    references:
      - id: ref1
        bwb_id: BWBR0009398
        artikel: '15'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0009398
        artikel: '17'
        hoofdstuk: '4'
  - number: 44p.1
    text: |-
      Betrokkene kan bij de beklagcommissie beklag doen over een beslissing als bedoeld in
      [artikel 44n, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009398#Artikel44n
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44p
    references:
      - id: ref1
        bwb_id: BWBR0009398
        artikel: 44n
        hoofdstuk: 9A
  - number: 44p.2
    text: |-
      De [artikelen 60, tweede en derde lid][ref1], [61 tot en met 65][ref2],
      [67, met uitzondering van het derde lid, het vijfde lid, tweede volzin, en het zesde lid][ref3], en
      [68 tot en met 71 van de wet][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0009709#Artikel67
      [ref4]: https://wetten.overheid.nl/BWBR0009709#Artikel68
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44p
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '60'
      - id: ref2
        bwb_id: BWBR0009709
        artikel: '61'
      - id: ref3
        bwb_id: BWBR0009709
        artikel: '67'
      - id: ref4
        bwb_id: BWBR0009709
        artikel: '68'
  - number: 44q.1
    text: |-
      De directeur voert de evaluatie uit van het verloop van het verblijf in de inrichting. De directeur en het college
      van burgemeester en wethouders voeren de evaluatie uit van het verloop van het verblijf buiten de inrichting in de
      laatste fase.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44q
  - number: 44q.2
    text: |-
      In het evaluatieverslag wordt een visie op de persoon van betrokkene gegeven. Daarbij wordt in ieder geval aandacht
      besteed aan de volgende aspecten ten aanzien van hem:
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44q
  - number: 44q.2.a
    text: zijn lichamelijke en geestelijke gesteldheid en het herstel daarvan;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44q
  - number: 44q.2.b
    text: |-
      de ontwikkeling van zijn vaardigheden met het oog op zijn terugkeer in de maatschappij en de beëindiging van zijn
      recidive;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44q
  - number: 44q.2.c
    text: de ontwikkeling van zijn motivatie tot gedragsverandering;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44q
  - number: 44q.2.d
    text: zijn oordeel over het verblijf;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44q
  - number: 44q.2.e
    text: incidenten waarbij hij betrokken is geweest;
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44q
  - number: 44q.2.f
    text: punten die van belang zijn voor de nazorg.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44q
  - number: 44q.3
    text: |-
      Het verslag komt tot stand in samenwerking met de trajectcoördinator, indien deze is aangewezen, en degenen die
      verantwoordelijk zijn voor de uitvoering van het programma.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel44q
  - number: '45.1'
    text: |-
      De beloning van de tolk of de vertaler en de vergoeding van de door hen gemaakte kosten, bedoeld in
      [artikel 61, vierde lid][ref1], [65, tweede lid][ref2], en [67, vierde lid, van de wet][ref3] geschieden volgens
      het bepaalde bij of krachtens de [Wet tarieven in strafzaken][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0009709#Artikel67
      [ref4]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '61'
      - id: ref2
        bwb_id: BWBR0009709
        artikel: '65'
      - id: ref3
        bwb_id: BWBR0009709
        artikel: '67'
      - id: ref4
        bwb_id: BWBR0002406
  - number: '45.2'
    text: |-
      De secretaris van de beklag- of beroepscommissie stelt op basis van de in het eerste lid bedoelde bepalingen de
      hoogte van de beloning en vergoeding vast. Met de uitbetaling is de directeur belast.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel45
  - number: '46'
    text: |-
      De gedetineerde ontvangt bij invrijheidstelling reisgeld voor een reis of reisgelegenheid naar zijn woon- of
      verblijfplaats binnen Nederland.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel46
  - number: '47'
    text: |-
      Onverminderd het bepaalde bij of krachtens de [Wet langdurige zorg][ref1] komen ten laste van de Staat de kosten
      van geneeskundige verzorging van de gedetineerde die in een inrichting gevangenisstraf of hechtenis ondergaat.


      [ref1]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0035917
  - number: '48'
    text: |-
      Bij overlijden van een gedetineerde komen de kosten van begrafenis of crematie, voor zover die redelijkerwijs
      noodzakelijk kunnen worden geacht, ten laste van de Staat.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel48
  - number: '49'
    text: |-
      Buiten geval van opzet of bewuste roekeloosheid is de aansprakelijkheid van de directeur voor voorwerpen die een
      gedetineerde ingevolge [artikel 45, tweede lid, van de wet][ref1] onder zich heeft, beperkt tot € 500 per voorwerp,
      inclusief eventuele gevolgschade.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel45
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '45'
  - number: '58'
    text: |-
      Een ieder die betrokken is bij de uitvoering van de wet en dit besluit en daarbij de beschikking krijgt over
      gegevens waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, en voor wie niet reeds
      uit hoofde van ambt, beroep of wettelijk voorschrift terzake van die gegevens een geheimhoudingsplicht geldt, is
      verplicht tot geheimhouding daarvan, behoudens voor zover enig wettelijk voorschrift hem tot bekendmaking verplicht
      of uit zijn taak bij de uitvoering van dit besluit de noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel58
  - number: '59'
    text: |-
      Dit besluit berust mede op de [artikelen 4, zesde lid][ref1], en
      [18a, zesde lid, van de Penitentiaire beginselenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel18a
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0009709
        artikel: 18a
  - number: '60'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel60
  - number: '61'
    text: 'Dit besluit wordt aangehaald als: Penitentiaire maatregel.'
    url: https://wetten.overheid.nl/BWBR0009398/2025-11-01#Artikel61
