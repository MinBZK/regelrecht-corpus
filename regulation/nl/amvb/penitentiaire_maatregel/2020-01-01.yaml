preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Onze Minister van Justitie, van 8 juli 1997, nr. 640008/97/6;

    Gelet op artikel 89 van de Grondwet, artikel 13 van het Wetboek van Strafrecht en voorts de artikelen 3, vijfde
    lid, 4, tweede lid, 7, vierde lid, 32, tweede lid, 41, vierde lid, 42, vijfde lid, 45, derde lid, 59, 61,
    vierde lid, 65, tweede lid, 67, vierde lid, van de Penitentiaire beginselenwet en artikel 40, vierde lid, van de
    Beginselenwet verpleging ter beschikking gestelden;

    Gezien de adviezen van de Centrale Raad voor Strafrechtstoepassing van 11 november 1996, nr. RA/98/96, 25 maart
    1997, nr. RA 20/97 en 6 juni 1997, nr. 631365/97, en het advies van de Registratiekamer van 23 oktober 1996, nr.
    96.A.495/1;

    De Raad van State gehoord (advies van 26 november 1997, No.W03.97 0476);

    Gezien het nader rapport van Onze Minister van Justitie van 16 februari 1998, nr. 680358/98/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop rustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel1
  - number: 1.a
    text: |-
      de wet: de [Penitentiaire beginselenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009709
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009709
  - number: 1.b
    text: |-
      reclassering: een reclasseringsinstelling als bedoeld in
      [artikel 1, onder b, van de Reclasseringsregeling 1995][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007120#Artikel1
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007120
        artikel: '1'
  - number: '2.1'
    text: |-
      De directeur brengt jaarlijks vóór 1 oktober aan Onze Minister een jaarplan voor het volgende jaar uit. Het
      jaarplan omvat in ieder geval een begroting van de kosten en opbrengsten voor dat jaar.
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel2
  - number: '2.2'
    text: |-
      De directeur brengt jaarlijks vóór 1 maart aan Onze Minister een jaarverslag over het voorgaande jaar uit. Bij dit
      verslag wordt een jaarrekening gevoegd.
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel2
  - number: '2.3'
    text: Onze Minister kan regels stellen aan de vorm en de inhoud van de in het eerste en tweede lid genoemde stukken.
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel2
  - number: '3.1'
    text: |-
      Het dagprogramma voor een inrichting of afdeling wordt bepaald in de huisregels en beslaat de periode tussen
      uitsluiting van de gedetineerden in de ochtend en de insluiting van de gedetineerden voor de nacht.
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel3
  - number: '3.2'
    text: |-
      In het regime van algehele gemeenschap, bedoeld in [artikel 20 van de wet][ref1], duurt het dagprogramma minimaal
      59 uren per week en worden daarin tussen 18 uren en 63 uren per week aan activiteiten en bezoek geboden.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel20
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '20'
  - number: '3.3'
    text: |-
      In het regime van beperkte gemeenschap, bedoeld in [artikel 21 van de wet][ref1], worden tussen 18 uren en 63 uren
      per week aan activiteiten en bezoek geboden.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel21
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '21'
  - number: '3.4'
    text: |-
      Onze Minister stelt nadere regels omtrent de verschillende regimes die in de daarbij aangeduide inrichtingen
      gelden.
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel3
  - number: '5.1'
    text: |-
      Een penitentiair programma omvat minimaal 26 uur per week aan activiteiten waaraan door de deelnemer aan dat
      penitentiair programma wordt deelgenomen.
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel5
  - number: '5.2'
    text: |-
      De activiteiten in een penitentiair programma zijn gericht op het aanleren van bepaalde sociale vaardigheden, het
      vergroten van de kans op arbeid na invrijheidstelling, het bieden van onderwijs, het bieden van bijzondere zorg
      aan de deelnemer zoals verslavingszorg of geestelijke gezondheidszorg, of geven op andere wijze invulling aan de
      voorbereiding van de terugkeer in de maatschappij.
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel5
  - number: '5.3'
    text: |-
      Van een penitentiair programma wordt een schriftelijke omschrijving gemaakt. Deze omvat in ieder geval een
      beschrijving van de activiteiten, een regeling van de verantwoordelijkheid voor de uitvoering van het programma,
      de begeleiding van en het toezicht op de deelnemer aan het penitentiair programma, de melding van bijzondere
      voorvallen en de wijze en de frequentie van rapporteren over de deelnemer aan het penitentiair programma.
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel5
  - number: '5.4'
    text: |-
      Onze Minister kan nadere regels stellen over de procedure tot erkenning van een penitentiair programma en over de
      kwaliteitseisen waaraan een penitentiair programma moet voldoen.
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel5
  - number: '5.5'
    text: |-
      De noodzakelijke kosten van bestaan tijdens deelname aan een penitentiair programma komen niet ten laste van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel5
  - number: '6'
    text: 'Voor deelname aan een penitentiair programma komen niet in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel6
  - number: 6.a
    text: |-
      gedetineerden ten aanzien van wie de tenuitvoerlegging van een tevens opgelegde maatregel van
      terbeschikkingstelling met verpleging van overheidswege nog moet aanvangen;
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel6
  - number: 6.b
    text: |-
      gedetineerden die na de tenuitvoerlegging van de vrijheidsstraf gevolg dienen te geven aan de op hen rustende
      vertrekplicht of die uitgeleverd zullen worden;
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel6
  - number: 6.c
    text: gedetineerden die in een extra beveiligde inrichting verblijven.
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel6
  - number: '7.1'
    text: |-
      Indien de directeur het verantwoord acht dat een gedetineerde in aanmerking komt voor deelname aan een penitentiair
      programma doet hij een daartoe strekkende voordracht aan de selectiefunctionaris.
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel7
  - number: '7.2'
    text: |-
      De directeur voegt bij zijn voordracht het advies van de reclassering, en het advies van het openbaar ministerie
      indien dit op grond van [artikel 6:1:10 van het Wetboek van Strafvordering][ref1] is uitgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
  - number: '7.3'
    text: |-
      Bij zijn beslissing om een gedetineerde in de gelegenheid te stellen deel te nemen aan een penitentiair programma
      betrekt de selectiefunctionaris in ieder geval de volgende aspecten:
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel7
  - number: 7.3.a
    text: de aard, zwaarte en achtergronden van het gepleegde delict;
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel7
  - number: 7.3.b
    text: |-
      het huidige detentieverloop, waaronder het gedrag van de gedetineerde, het nakomen van afspraken door de
      gedetineerde en diens gemotiveerdheid;
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel7
  - number: 7.3.c
    text: het gevaar voor recidive;
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel7
  - number: 7.3.d
    text: |-
      de mate waarin de gedetineerde in staat zal zijn de met de grotere vrijheden gepaard gaande verantwoordelijkheid te
      kunnen dragen;
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel7
  - number: 7.3.e
    text: een aanvaardbaar verblijfadres;
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel7
  - number: 7.3.f
    text: de geschiktheid van de gedetineerde voor een penitentiair programma;
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel7
  - number: 7.3.g
    text: de mate van onzekerheid over de datum van invrijheidstelling.
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel7
  - number: '7.4'
    text: |-
      De selectiefunctionaris neemt zijn beslissing over deelname aan een penitentiair programma slechts indien de
      gedetineerde zich bereid heeft verklaard tot deelname aan het programma en de daaraan verbonden voorwaarden.
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel7
  - number: 7a.1
    text: |-
      De deelnemer aan een penitentiair programma staat gedurende het eerste derde deel van de totale duur van het
      programma onder elektronisch toezicht. Voor het einde van deze periode wordt bezien of het elektronisch toezicht
      kan vervallen. Op grond van het gedrag van de deelnemer kan worden besloten dat het elektronisch toezicht wordt
      voortgezet gedurende het tweede derde deel van het penitentiair programma. In dat geval wordt voor het einde van
      het tweede deel bezien of het elektronisch toezicht kan vervallen. Op grond van het gedrag van de deelnemer kan
      worden besloten dat het elektronisch toezicht wordt voortgezet gedurende het laatste deel van het penitentiair
      programma. Indien het elektronisch toezicht is vervallen kan de deelnemer wederom onder elektronisch toezicht
      worden gesteld, indien het gedrag van de deelnemer daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel7a
  - number: 7a.2
    text: |-
      De selectiefunctionaris is belast met de beslissingen, bedoeld in het eerste lid. Hij kan bepalen dat geen
      elektronisch toezicht wordt toegepast indien:
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel7a
  - number: 7a.2.a
    text: een andere vorm van vierentwintiguurstoezicht aanwezig is,
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel7a
  - number: 7a.2.b
    text: de duur van het penitentiair programma korter is dan negen weken,
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel7a
  - number: 7a.2.c
    text: het elektronisch toezicht afbreuk doet aan de resocialisatie van de deelnemer, of
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel7a
  - number: 7a.2.d
    text: bijzondere omstandigheden daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel7a
  - number: '8.1'
    text: |-
      De algemene verantwoordelijkheid voor de tenuitvoerlegging van een penitentiair programma ligt bij de directeur van
      de inrichting of afdeling waarin de deelnemer aan het penitentiair programma is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel8
  - number: '8.2'
    text: |-
      Degene die verantwoordelijk is voor de uitvoering van het programma houdt toezicht op het dagelijkse verloop van
      het penitentiair programma. Hij beoordeelt in eerste instantie of de activiteiten naar behoren worden verricht en
      de voorwaarden naar behoren worden nageleefd en kan in dat kader aanwijzingen geven aan de deelnemer. Hij kan ten
      aanzien van de wijze of het tijdstip waarop de activiteiten binnen het penitentiair programma worden uitgevoerd,
      wijzigingen aanbrengen. Van deze wijzigingen stelt hij de directeur schriftelijk op de hoogte.
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel8
  - number: '9.1'
    text: |-
      Aan een beslissing om een gedetineerde in de gelegenheid te stellen deel te nemen aan een penitentiair programma
      worden, behoudens nader door de directeur te stellen bijzondere voorwaarden, de volgende algemene voorwaarden
      verbonden:
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel9
  - number: 9.1.a
    text: |-
      de deelnemer aan het penitentiair programma gedraagt zich overeenkomstig de aanwijzingen van degene die is belast
      met zijn begeleiding en toezicht en zal aan deze alle verlangde inlichtingen verschaffen;
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel9
  - number: 9.1.b
    text: hij doet tevoren melding aan de directeur van een verandering van betrekking of woonplaats;
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel9
  - number: 9.1.c
    text: hij maakt zich niet schuldig aan een strafbaar feit.
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel9
  - number: '9.2'
    text: 'Bij overtreding van de voorwaarden kan de directeur, afhankelijk van de ernst van de overtreding, beslissen tot:'
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel9
  - number: 9.2.a
    text: het geven van een waarschuwing aan de deelnemer aan het penitentiair programma;
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel9
  - number: 9.2.b
    text: wijziging of aanvulling van de bijzondere voorwaarden gesteld aan deelname aan een penitentiair programma;
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel9
  - number: 9.2.c
    text: het adviseren van de selectiefunctionaris de deelname aan het penitentiair programma te beëindigen.
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel9
  - number: '9.3'
    text: |-
      De directeur geeft de deelnemer aan een penitentiair programma van een beslissing als bedoeld in het tweede lid
      onverwijld schriftelijk en zoveel mogelijk in een voor hem begrijpelijke taal een met redenen omklede, gedagtekende
      en ondertekende mededeling.
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel9
  - number: '9.4'
    text: |-
      Van het stellen van bijzondere voorwaarden, de overtreding van de voorwaarden en een beslissing als bedoeld in het
      tweede lid doet de directeur mededeling aan de selectiefunctionaris.
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel9
  - number: '10.1'
    text: |-
      De deelnemer aan een penitentiair programma kan bij de beklagcommissie bij de inrichting of afdeling waarin hij is
      ingeschreven een klacht indienen over de beslissingen, bedoeld in [artikel 9, tweede lid, onder a en b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009398#Artikel9
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009398
        artikel: '9'
        hoofdstuk: '3'
  - number: '10.2'
    text: |-
      De [artikelen 60, tweede en derde lid][ref1], [61][ref2], [62][ref3], [63][ref4], [64][ref5], [65][ref6],
      [67, met uitzondering van het derde lid, het vijfde lid, tweede volzin, en het zesde lid][ref7], [68][ref8],
      [69][ref9], [70][ref10] en [71 van de wet][ref11] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0009709#Artikel62
      [ref4]: https://wetten.overheid.nl/BWBR0009709#Artikel63
      [ref5]: https://wetten.overheid.nl/BWBR0009709#Artikel64
      [ref6]: https://wetten.overheid.nl/BWBR0009709#Artikel65
      [ref7]: https://wetten.overheid.nl/BWBR0009709#Artikel67
      [ref8]: https://wetten.overheid.nl/BWBR0009709#Artikel68
      [ref9]: https://wetten.overheid.nl/BWBR0009709#Artikel69
      [ref10]: https://wetten.overheid.nl/BWBR0009709#Artikel70
      [ref11]: https://wetten.overheid.nl/BWBR0009709#Artikel71
    url: https://wetten.overheid.nl/BWBR0009398/2020-01-01#Artikel10
    references:
