  - number: '2'
    text: |-
      1 In afwijking van [artikel 1][ref1] bedraagt voor de daar bedoelde verzekerde die in Nederland is gaan
      wonen binnen twaalf jaar nadat zijn verzekering ingevolge de Algemene Wet Bijzondere Ziektekostenverzekering
      laatstelijk is geëindigd of, indien het een minderjarige betreft, de verzekering ingevolge de
      [Algemene Wet Bijzondere Ziektekosten][ref2] van zijn wettelijk vertegenwoordiger laatstelijk is geëindigd, de
      periode gedurende welke hij geen aanspraak op de in artikel 1 bedoelde zorg heeft een aantal maanden overeenkomend
      met het aantal volle jaren liggende tussen het tijdstip van vestiging in Nederland en het einde van het laatste
      tijdvak van verzekering ingevolge de Algemene Wet Bijzondere Ziektekosten.

      2 Indien de verzekerde, bedoeld in het eerste lid, in die periode van twaalf jaar ten laste van Nederland aanspraak
      heeft gehad op verstrekkingen met toepassing van een Verordening van de Raad van de Europese gemeenschappen of van
      een verdrag inzake sociale zekerheid waarbij Nederland partij is, wordt het aantal volle jaren gedurende welke men
      die aanspraak ten laste van Nederland had, in mindering gebracht op de periode, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005337#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0005337/2013-01-01#Artikel2
