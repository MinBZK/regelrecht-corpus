articles:
  - number: '1'
    text: |-
      1 Degene die, komend vanuit het buitenland, in Nederland is gaan wonen en als gevolg daarvan verzekerd is geworden
      in de zin van de [Algemene Wet Bijzondere Ziektekosten][ref1] heeft gedurende de eerste twaalf maanden na het
      tijdstip waarop hij zich in Nederland heeft gevestigd, geen aanspraak op een of meer vormen van zorg als bedoeld in
      [Hoofdstuk II van het Besluit zorgaanspraken AWBZ][ref2] of op vergoeding daarvan ingevolge [artikel 20][ref3] van
      dat besluit indien hij op dat tijdstip, gelet op zijn behoefte, reeds op de desbetreffende zorg is aangewezen, dan
      wel indien de gezondheidstoestand van betrokkene kennelijk moest doen verwachten, dat hij, gelet op zijn behoefte,
      binnen een half jaar op de desbetreffende zorg zou zijn aangewezen.

      2 Dit artikel is niet van toepassing op de aanspraken, bedoeld in de [artikelen 17][ref4] en
      [18 van het Besluit zorgaanspraken AWBZ][ref5].


