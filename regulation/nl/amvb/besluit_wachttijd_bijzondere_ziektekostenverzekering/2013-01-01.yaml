  - number: '3'
    text: |-
      De [artikelen 1][ref1] en [2][ref2] zijn niet van toepassing op:

      a. vreemdelingen die rechtmatig in Nederland verblijf hebben als bedoeld in
      [artikel 8, onder c en d, van de Vreemdelingenwet 2000][ref3];

      b. personen die hier te lande terugkeren na werkzaam te zijn geweest in het kader van ontwikkelingssamenwerking, in
      een naar het oordeel van Onze Minister voor Ontwikkelingssamenwerking als ontwikkelingsgebied te beschouwen gebied,
      alsmede de vorenbedoelde personen vergezellende echtgenoten, eigen en aangehuwde kinderen en pleegkinderen;

      c. personen die tot de dag voorafgaand aan het tijdstip waarop zij verzekerd zijn geworden in de
      zin van de [Algemene wet Bijzondere Ziektekosten][ref4] vergoeding ter zaken van de kosten van zorg
      ontvingen op grond van [artikel 3.1.2 van de Invoerings- en aanpassingswet Zorgverzekeringswet][ref5] en
      [artikel 1.22 van het Aanpassingsbesluit Zorgverzekeringswet][ref6].


