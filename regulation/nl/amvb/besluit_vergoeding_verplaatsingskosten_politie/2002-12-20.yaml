        artikel: '1'
  - number: 1.1.g
    text: |-
      werkgebied: het werkgebied, bedoeld in
      [artikel 1, eerste lid, onder v, van het Besluit algemene rechtspositie politie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel1
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '1'
  - number: 1.1.h
    text: |-
      woonplaats: de gemeente of het met name bekende afzonderlijk liggende deel van de gemeente waar de woning van de
      ambtenaar is gelegen;
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel1
  - number: 1.1.i
    text: |-
      gezinsleden: de echtgenoot, de geregistreerde partner of de levenspartner van de betrokkene en de kinderen, stief-
      en pleegkinderen van hemzelf of van zijn echtgenoot, geregistreerde partner of levenspartner, voor zover zij deel
      uitmaken van zijn huishouding;
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel1
  - number: 1.1.j
    text: 'geregistreerde partner: degene met wie de niet-gehuwde ambtenaar een geregistreerd partnerschap is aangegaan.'
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel1
  - number: 1.1.k
    text: |-
      levenspartner: degene met wie de niet gehuwde ambtenaar samenwoont en een gemeenschappelijke huishouding voert,
      hetgeen blijkt uit een bij notariële akte gesloten samenlevingscontract of uit een schriftelijke verklaring van een
      notaris dat een samenlevingscontract is opgemaakt;
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel1
  - number: 1.1.l
    text: |-
      eigen huishouding voeren: het zelfstandig bewonen van woonruimte, voorzien van eigen meubilair en stoffering, een
      en ander ter beoordeling van het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel1
  - number: 1.1.m
    text: |-
      berekeningsbasis: het twaalfvoud van de bezoldiging in de zin van het [Besluit bezoldiging politie][ref1] die de
      betrokkene geniet op het berekeningstijdstip, vermeerderd met de aanspraak op zowel de vakantie-uitkering, bedoeld
      in [artikel 23 van het Besluit bezoldiging politie](onbekend), als de uitkering op grond van [artikel 25b van dat
      besluit](onbekend) en in voorkomende gevallen verhoogd met:


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006517
  - number: 1.1.m.1e
    text: |-
      genoten wachtgeld of uitkering krachtens dan wel overeenkomstig het [Rijkswachtgeldbesluit 1959][ref1] of de
      [Uitkeringsregeling 1966][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002326
      [ref2]: https://wetten.overheid.nl/BWBR0002537
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002326
      - id: ref2
        bwb_id: BWBR0002537
  - number: 1.1.m.2e
    text: |-
      genoten uitkering krachtens dan wel overeenkomstig de Regeling uitkering wegens functioneel leeftijdsontslag of de
      Wet uitkering wegens vrijwillig vervroegd uittreden of
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel1
  - number: 1.1.m.3e
    text: |-
      genoten herplaatsingstoelage als bedoeld in paragraaf 9 van het pensioenreglement van de Stichting Pensioenfonds
      ABP, bedoeld in [artikel 6 van de Wet Privatisering ABP][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel6
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '6'
  - number: 1.1.m.4e
    text: |-
      indien de ambtenaar recht heeft op een uitkering op grond van de [Ziektewet][ref1] respectievelijk van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref2], de bezoldiging zoals die zou zijn genoten indien geen
      sprake zou zijn geweest van recht op een uitkering op grond van de [Ziektewet][ref3] respectievelijk de
      [Wet op de arbeidsongeschiktheidsverzekering][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0001888
      [ref4]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0001888
      - id: ref4
        bwb_id: BWBR0002524
  - number: 1.1.n
    text: 'berekeningstijdstip:'
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel1
  - number: 1.1.n.1e
    text: de datum waarop de betrokkene verhuist;
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel1
  - number: 1.1.n.2e
    text: |-
      indien de betrokkene verhuist vóór de datum dat de functie feitelijk wordt vervuld, de datum van ingang van de
      functievervulling;
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel1
  - number: 1.1.n.3e
    text: bij het overlijden of ontslag van de betrokkene de datum waarop laatstelijk bezoldiging werd genoten;
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel1
  - number: 1.1.o
    text: |-
      verplaatsen: veranderen van het werkgebied van de betrokkene in opdracht van het bevoegd gezag, waaronder mede
      wordt verstaan het tewerkstellen in een ander deel van het werkgebied, wanneer hiermee een verhuizing gepaard gaat
      die op last van het bevoegd gezag plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel1
  - number: 1.1.p
    text: |-
      voor het eerst in dienst treden: in dienst treden bij een regionaal politiekorps, bij het Korps landelijke
      politiediensten, bij het LSOP, bij ITO danwel bij een organisatie-onderdeel van de bijzondere ambtenaar van
      politie, anders dan in geval van overgang binnen één maand:
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel1
  - number: 1.1.p.1e
    text: van de ene naar de andere hiervoor genoemde dienst;
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel1
  - number: 1.1.p.2e
    text: |-
      van een andere overheidsdienst of een door het Rijk bekostigde onderwijsinstelling naar een regionaal politiekorps,
      het Korps landelijke politiediensten, het LSOP, ITO danwel een organisatie-onderdeel van de bijzondere ambtenaren
      van politie.
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel m, wordt, indien de betrokkene een toelage als bedoeld in
      de [artikelen 13][ref1], [14][ref2], [15][ref3] en [18 van het Besluit bezoldiging politie][ref4] geniet, dit
      bezoldigingsdeel vastgesteld op het bedrag dat de betrokkene gedurende de drie kalendermaanden voorafgaande aan het
      berekeningstijdstip gemiddeld per maand aan deze toelagen heeft genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0006517#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0006517#Artikel18
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0006517
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0006517
        artikel: '15'
      - id: ref4
        bwb_id: BWBR0006517
        artikel: '18'
  - number: '2.1'
    text: |-
      Naar de regels bij of krachtens dit besluit wordt een tegemoetkoming verleend ter zake van uitgaven, gedaan in
      verband met een verhuizing in het belang van de dienst of ter zake van terugkeer naar de oude woonomgeving dan wel
      in verband met reizen naar de plaats van tewerkstelling.
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel2
  - number: '2.2'
    text: |-
      Indien uit anderen hoofde reeds in enigerlei vorm aanspraak bestaat op een tegemoetkoming voor de in het eerste
      lid bedoelde uitgaven, wordt de tegemoetkoming krachtens dit besluit slechts verleend tot het bedrag, waarmee deze
      tegemoetkoming de eerstbedoelde aanspraak overschrijdt.
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel2
  - number: '3.1'
    text: |-
      De betrokkene die in verband met een verplaatsing of indiensttreding in opdracht van het bevoegd gezag is verhuisd
      en een woning in het werkgebied heeft betrokken, wordt een tegemoetkoming in de verhuiskosten verleend.
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel3
  - number: '3.2'
    text: |-
      De betrokkene die in verband met een verplaatsing of indiensttreding in opdracht van het bevoegd gezag is verhuisd
      en een woning buiten het werkgebied heeft betrokken, wordt een tegemoetkoming in de verhuiskosten verleend, indien
      het bevoegd gezag vooraf heeft vastgesteld dat met de verhuizing aan de opdracht om naar de nabijheid van het
      werkgebied te verhuizen, is voldaan.
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel3
  - number: '3.3'
    text: |-
      De betrokkene die zonder dat daartoe opdracht is verleend door het bevoegd gezag in verband met een verplaatsing
      is verhuisd, wordt een tegemoetkoming in de verhuiskosten verleend, indien hij zich binnen een afstand van 25
      kilometer van het werkgebied heeft gevestigd en de afstand tussen de oude woning en de plaats van tewerkstelling
      dan wel de hoofdplaats van tewerkstelling ten minste 50 kilometer bedraagt.
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel3
  - number: '3.4'
    text: |-
      De betrokkene die in verband met een indiensttreding is verhuisd en aan wie binnen twee jaren na de verhuizing
      ontslag op aanvraag wordt verleend of die ten gevolge van aan hem te wijten feiten of omstandigheden binnen twee
      jaren wordt ontslagen, dient de hem toegekende tegemoetkoming in verhuiskosten terug te betalen. Overgang binnen
      een maand naar een andere functie binnen de politie wordt niet als een ontslag op aanvraag beschouwd, tenzij de
      betrokkene als gevolg van die overgang opnieuw moet verhuizen met aanspraak op tegemoetkoming in de verhuiskosten.
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel3
  - number: '3.5'
    text: |-
      De tegemoetkoming in de verhuiskosten wordt aan de betrokkene die in verband met een indiensttreding dient te
      verhuizen of de betrokkene, bedoeld in het derde lid, slechts verleend, indien hij schriftelijk heeft verklaard dat
      een verplichting tot terugbetalen als bedoeld in het vierde lid hem bekend is.
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel3
  - number: '4.1'
    text: |-
      Buiten het geval, bedoeld in [artikel 3, derde lid][ref1], kan een tegemoetkoming in verhuiskosten bij een
      vrijwillige verandering van de woonplaats binnen Nederland, slechts worden verleend, indien de verandering van
      woonplaats verband houdt met:


      [ref1]: https://wetten.overheid.nl/BWBR0006520#Artikel3
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006520
        artikel: '3'
        hoofdstuk: II
  - number: 4.1.a
    text: |-
      een ontslag, ter zake waarvan de betrokkene recht heeft op dadelijk ingaand pensioen, dan wel op een uitkering
      krachtens dan wel overeenkomstig de Wet uitkering wegens vrijwillig vervroegd uittreden of de Regeling uitkering
      wegens functioneel leeftijdsontslag;
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel4
  - number: 4.1.b
    text: |-
      een ontslag, dat de betrokkene anders dan op zijn aanvraag is verleend en niet het gevolg is van aan hem te wijten
      feiten of omstandigheden of
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel4
  - number: 4.1.c
    text: het overlijden van betrokkene, welke tegemoetkoming wordt verleend aan de nagelaten gezinsleden.
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel4
  - number: '4.2'
    text: |-
      Een tegemoetkoming als bedoeld in het eerste lid wordt slechts verleend, indien de betrokkene in een periode
      van minder dan tien jaar voorafgaand aan het beëindigen van het dienstverband is verhuisd ten gevolge van een
      verplaatsing en het bevoegd gezag een verhuizing van het gezin naar de oude woonomgeving noodzakelijk acht. Het
      bevoegd gezag neemt niet eerder een beslissing dan nadat een bedrijfsmaatschappelijk advies is ingewonnen.
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel4
  - number: '5.1'
    text: |-
      De betrokkene aan wie tijdens zijn plaatsing buiten Nederland ontslag op aanvraag wordt verleend met recht op
      een uitkering krachtens dan wel overeenkomstig de Wet uitkering wegens vrijwillig vervroegd uittreden dan wel die
      anders dan op zijn aanvraag en niet wegens aan hem te wijten feiten of omstandigheden wordt ontslagen, wordt een
      tegemoetkoming in de verhuiskosten voor terugkeer naar Nederland verleend.
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel5
  - number: '5.2'
    text: |-
      De betrokkene aan wie tijdens zijn plaatsing buiten Nederland ontslag op aanvraag wordt verleend, anders dan
      ontslag op aanvraag als bedoeld in het eerste lid, of die niet op aanvraag wordt ontslagen als gevolg van aan hem
      te wijten feiten of omstandigheden, wordt volgens nader door Onze Minister te stellen regels een gedeeltelijke
      tegemoetkoming in verhuiskosten verleend voor terugkeer naar Nederland.
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel5
  - number: '5.3'
    text: |-
      Indien de betrokkene tijdens zijn plaatsing in het buitenland overlijdt, wordt aan de nagelaten gezinsleden een
      tegemoetkoming in verhuiskosten verleend voor terugkeer naar Nederland.
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel5
  - number: '6'
    text: |-
      Geen tegemoetkoming in verhuiskosten ingevolge [de artikelen 3][ref1], [4][ref2] of [5][ref3] wordt verleend,
      indien de verhuizing niet heeft plaatsgevonden binnen twee jaren nadat de verplichting tot verhuizen is opgelegd
      dan wel na de datum van het ontslag, het overlijden of de verplaatsing.


      [ref1]: https://wetten.overheid.nl/BWBR0006520#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006520#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0006520#Artikel5
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006520
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0006520
        artikel: '4'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0006520
        artikel: '5'
        hoofdstuk: II
  - number: '7.1'
    text: 'De tegemoetkoming in verhuiskosten kan slechts bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel7
  - number: 7.1.a
    text: |-
      een bedrag voor de kosten van transport van de bagage en van de inboedel van de betrokkene en zijn gezinsleden naar
      de nieuwe woning, waaronder begrepen de kosten van het in- en uitpakken van breekbare zaken;
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel7
  - number: 7.1.b
    text: een bedrag voor dubbele woonkosten;
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel7
  - number: 7.1.c
    text: een bedrag voor alle andere direct uit de verhuizing voortvloeiende kosten.
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel7
  - number: '7.2'
    text: |-
      Onze Minister stelt regels ten aanzien van de uitvoering van het eerste lid, onderdelen *a* en *b*, alsmede ten
      aanzien van de berekening van de daarin bedoelde bedragen.
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel7
  - number: '7.3'
    text: |-
      Indien de betrokkene op de dag van de verhuizing een eigen huishouding voert, wordt het bedrag, bedoeld in het
      eerste lid, onderdeel *c*, voor zover bij of krachtens [dit artikel][ref1] niet anders is bepaald, gesteld op een
      tegemoetkoming van 3% van de berekeningsbasis voor ieder woon- of slaapvertrek, tot een maximum van vier van deze
      vertrekken die de achtergelaten woning telt, met dien verstande dat het bedrag een nader door Onze Minister vast te
      stellen bedrag niet mag overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0006520#Artikel7
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006520
        artikel: '7'
        hoofdstuk: III
  - number: '7.4'
    text: |-
      Indien het betreft een verhuizing van een gezin waarin de echtgenoten, geregistreerde partners of levenspartners
      beiden betrokkene zijn en afzonderlijk de opdracht hebben om te verhuizen of zijn verplaatst, wordt het bedrag,
      bedoeld in het derde lid, berekend over de gezamenlijke berekeningsbasis.
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel7
  - number: '7.5'
    text: |-
      Indien het betreft een verhuizing als gevolg van een verplaatsing van de betrokkene naar of in een buiten Nederland
      gelegen gebied, wordt voor de toepassing van het derde lid de berekeningsbasis vermeerderd met een eventueel bedrag
      wegens verblijf buiten Nederland dat de betrokkene is of zal worden toegekend.
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel7
  - number: '7.6'
    text: |-
      Indien de betrokkene geen eigen huishouding voert, wordt geen tegemoetkoming als bedoeld in het eerste lid,
      onderdeel *c*, verleend. Indien bijzondere omstandigheden daartoe aanleiding geven, kan voor deze kosten niettemin
      een tegemoetkoming worden verleend van 3% van de berekeningsbasis.
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel7
  - number: '7.7'
    text: |-
      Indien aan de betrokkene door het bevoegd gezag tevoren is medegedeeld dat de verplaatsing maximaal twee jaar zal
      duren, bestaat slechts aanspraak op vergoeding van transportkosten van de bagage. Voorts kan, indien bijzondere
      omstandigheden daartoe aanleiding geven, een tegemoetkoming als bedoeld in het eerste lid, onderdeel *c*, worden
      verleend van 3% van de berekeningsbasis.
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel7
  - number: '7.8'
    text: |-
      De betrokkene bedoeld in [artikel 3][ref1], die voor het eerst bij een regionaal politiekorps, het Korps landelijke
      politiediensten danwel een organisatie-onderdeel van de bijzondere ambtenaren van politie in dienst treedt,
      kan slechts in aanmerking worden gebracht voor een tegemoetkoming in verhuiskosten gelijk aan de helft van de
      tegemoetkoming die op grond van het eerste tot en met zevende lid zou zijn toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0006520#Artikel3
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006520
        artikel: '3'
        hoofdstuk: II
  - number: '8.1'
    text: |-
      Bij een verplaatsing uit, naar en buiten Nederland op grond van [artikel 3, eerste of tweede lid][ref1], kan de
      tegemoetkoming in verhuiskosten naast de in [artikel 7, eerste lid][ref2], bedoelde bedragen slechts bestaan uit:


      [ref1]: https://wetten.overheid.nl/BWBR0006520#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006520#Artikel7
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006520
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0006520
        artikel: '7'
        hoofdstuk: III
  - number: 8.1.a
    text: |-
      een bedrag voor de kosten verbonden aan het vervoer van betrokkene en zijn gezinsleden naar de nieuwe woning en
      zonodig voor de overnachtingskosten;
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel8
  - number: 8.1.b
    text: |-
      een bedrag voor de kosten van één of meer reizen van de betrokkene en van de gezinsleden die in het land van
      vertrek zijn gemaakt ter voldoening aan een oproep tot het vervullen van formaliteiten, vereist in verband met
      de reis.
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel8
  - number: '8.2'
    text: |-
      Bij een verplaatsing als bedoeld in het eerste lid worden onder transportkosten als bedoeld in
      [artikel 7, eerste lid, onderdeel ][ref1], mede verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0006520#Artikel7
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006520
        artikel: '7'
        hoofdstuk: III
  - number: 8.2.a
    text: een bedrag voor de verschuldigde belastingen bij de invoer voor de bagage en de inboedel;
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel8
  - number: 8.2.b
    text: |-
      een bedrag voor de kosten van verzekering van de bagage en de inboedel tegen schade ten gevolge van of in verband
      met de verhuizing;
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel8
  - number: 8.2.c
    text: |-
      een bedrag voor de kosten van het inpakken van de gehele inboedel alsmede van de- en montage van meubilair en
      afvoer van emballage;
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel8
  - number: 8.2.d
    text: |-
      voor zover geen emballage in natura wordt verstrekt, een bedrag voor de kosten van aanschaffing van emballage zulks
      echter slechts onder beding dat de emballage na de verhuizing desgevorderd ter beschikking van het desbetreffende
      regionale politiekorps, het Korps landelijke politiediensten danwel het desbetreffende organisatie-onderdeel van de
      bijzondere ambtenaren van politie wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel8
  - number: '9.1'
    text: |-
      Indien bij een verplaatsing uit, naar en buiten Nederland de door Onze Minister vastgestelde regels niet toelaten
      dat de betrokkene zijn gezinsleden op kosten van het Rijk of de gemeente meeneemt, bestaat slechts aanspraak op
      vergoeding van:
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel9
  - number: 9.1.a
    text: transportkosten van de bagage van belanghebbende zelf;
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel9
  - number: 9.1.b
    text: |-
      kosten bedoeld in [artikel 8, eerste en tweede lid][ref1], voor zover deze betrekking hebben op de betrokkene zelf.


      [ref1]: https://wetten.overheid.nl/BWBR0006520#Artikel8
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006520
        artikel: '8'
        hoofdstuk: III
  - number: '9.2'
    text: |-
      Indien bijzondere omstandigheden daartoe aanleiding geven, kan een tegemoetkoming als bedoeld in
      [artikel 7, eerste lid, onderdeel ][ref1], worden verleend van 3% van de berekeningsbasis.


      [ref1]: https://wetten.overheid.nl/BWBR0006520#Artikel7
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006520
        artikel: '7'
        hoofdstuk: III
  - number: '10'
    text: |-
      Bij een verplaatsing naar een land buiten Europa en terug, kan - indien de tewerkstelling aldaar naar verwachting
      tenminste één jaar zal duren - de tegemoetkoming in de verhuiskosten mede bestaan uit een tegemoetkoming in de
      kosten van transport over zee van een aan de betrokkene in eigendom behorende personenauto volgens nader door Onze
      Minister vast te stellen regels.
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel10
  - number: 10a
    text: |-
      Het bevoegd gezag kan ten behoeve van het dagelijks reizen tussen de woning en de plaats van tewerkstelling een
      vervoerplan vaststellen. Het vervoerplan treedt in de plaats van het bepaalde in [artikel 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006520#Artikel11
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0006520
        artikel: '11'
        hoofdstuk: IV
  - number: '11.1'
    text: |-
      De betrokkene die geen opdracht heeft om te verhuizen, heeft aanspraak op een tegemoetkoming in de kosten voor
      het dagelijks reizen tussen de woning en de plaats van tewerkstelling, indien de te reizen afstand meer dan tien
      kilometer bedraagt.
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel11
  - number: '11.2'
    text: |-
      De betrokkene die opdracht van het bevoegd gezag heeft gekregen naar of naar de nabijheid van het werkgebied te
      verhuizen en daarin, ondanks alle pogingen niet slaagt, heeft aanspraak op een tegemoetkoming in de kosten voor het
      dagelijks reizen tussen de woning en de plaats van tewerkstelling, zolang hij bij de verhuizing in aanmerking zou
      kunnen komen voor een tegemoetkoming in de verhuiskosten en de te reizen afstand meer dan tien kilometer bedraagt.
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel11
  - number: '11.3'
    text: |-
      Een betrokkene als bedoeld in het tweede lid die naar het oordeel van het bevoegd gezag niet dagelijks heen en weer
      kan reizen, heeft, tenzij van overheidswege al dan niet tegen betaling in huisvesting wordt voorzien, aanspraak
      op een tegemoetkoming in de pensionkosten voor verblijf in een pension in of nabij het werkgebied alsmede op
      een tegemoetkoming voor ten hoogste eenmaal per week in de reiskosten voor gezinsbezoek dan wel voor reiskosten
      naar de plaats waar hij zijn woonplaats heeft of zich heeft gevestigd. Indien de betrokkene er niet in slaagt om
      een pension in het werkgebied te betrekken en hij zich naar het oordeel van het bevoegd gezag daartoe voldoende
      inspanningen heeft getroost, heeft hij tevens aanspraak op een tegemoetkoming in de kosten voor het dagelijks
      reizen tussen het pension nabij het werkgebied en de plaats van tewerkstelling.
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel11
  - number: '11.4'
    text: |-
      Indien de betrokkene bedoeld in het tweede en derde lid, naar het oordeel van het bevoegd gezag niet alles wat
      redelijkerwijze van hem mag worden verwacht, heeft gedaan om zo spoedig mogelijk te verhuizen, komt hij niet langer
      in aanmerking voor de tegemoetkomingen, bedoeld in het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel11
  - number: '11.5'
    text: |-
      Een betrokkene die een functie voor maximaal twee jaar bekleedt of voor maximaal twee jaar elders is geplaatst
      en als gevolg daarvan niet behoeft te verhuizen, wordt in afwijking van het eerste lid een tegemoetkoming in de
      reiskosten als bedoeld in het tweede lid verleend, dan wel een tegemoetkoming overeenkomstig het derde lid, indien
      de betrokkene naar het oordeel van het bevoegd gezag niet dagelijks heen en weer kan reizen.
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel11
  - number: '11.6'
    text: |-
      De betrokkene die in verband met een verplaatsing opdracht van het bevoegd gezag heeft gekregen om naar of naar de
      nabijheid van het toekomstige werkgebied te verhuizen en die vóór die datum van verplaatsing verhuist, heeft tot
      een maximum termijn van drie maanden aanspraak op een tegemoetkoming in de kosten voor het reizen tussen de nieuwe
      woning en de plaats van tewerkstelling als bedoeld in het tweede lid, dan wel een tegemoetkoming als bedoeld in het
      derde lid.
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel11
  - number: '11.7'
    text: |-
      De tegemoetkomingen, bedoeld in [dit artikel][ref1], worden vastgesteld volgens nader door Onze Minister te stellen
      regels.


      [ref1]: https://wetten.overheid.nl/BWBR0006520#Artikel11
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006520
        artikel: '11'
        hoofdstuk: IV
  - number: '12.1'
    text: |-
      Aan de betrokkene die met zijn gezin ten gevolge van een verplaatsing naar een buiten Nederland gelegen gebied
      is verhuisd of terugkeert van een plaatsing in een in het buitenland gelegen gebied en die, als gevolg van
      het ontbreken van passende woonruimte, dan wel het nog niet beschikbaar zijn van zijn boedel, voor bijzondere
      financiële lasten komt te staan, kan om die redenen een tegemoetkoming worden verleend.
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel12
  - number: '12.2'
    text: |-
      De in het eerste lid bedoelde tegemoetkoming kan ook worden verleend ingeval de betrokkene buiten Nederland blijft
      geplaatst, doch zijn gezin naar Nederland terugkeert.
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel12
  - number: '13'
    text: Het bevoegd gezag kan ter zake van de in of krachtens dit besluit bedoelde tegemoetkomingen een voorschot verlenen.
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel13
  - number: '14'
    text: |-
      Het bevoegd gezag kan in individuele gevallen dan wel ten aanzien van een door hem aan te wijzen groep betrokkenen
      in afwijking van de bij of krachtens dit besluit gestelde regels beslissen, indien de afwijking strekt tot het
      vermijden van onbillijkheden van overwegende aard die uit de toepassing van deze regels zouden voortkomen.
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel14
  - number: '15'
    text: |-
      Het bevoegd gezag kan zijn bevoegdheid, bedoeld in [artikel 14][ref1] overdragen aan onder hem ressorterende
      diensten dan wel aan personen die het met de uitvoering van dit besluit en de daarbij behorende
      uitvoeringsregelingen heeft belast.


      [ref1]: https://wetten.overheid.nl/BWBR0006520#Artikel14
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006520
        artikel: '14'
        hoofdstuk: V
  - number: '16'
    text: |-
      De betrokkene die vóór de datum van inwerkingtreding van dit besluit bij een verhuizing aanspraak kon maken op
      een tegemoetkoming in verhuiskosten op grond van het [Verplaatsingskostenbesluit][ref1] politie en voor wie de
      tegemoetkoming in verhuiskosten ingevolge dit besluit lager is, kan bij een verhuizing binnen zes maanden na
      inwerkingtreding van dit besluit, onverminderd [artikel 6][ref2], in aanmerking komen voor een tegemoetkoming in
      verhuiskosten zoals deze van toepassing was vóór de inwerkingtreding van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0004630
      [ref2]: https://wetten.overheid.nl/BWBR0006520#Artikel6
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004630
      - id: ref2
        bwb_id: BWBR0006520
        artikel: '6'
        hoofdstuk: II
  - number: '17'
    text: Dit besluit treedt in werking met ingang van 1 april 1994.
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel17
  - number: '18'
    text: 'Dit besluit wordt aangehaald als: Besluit vergoeding verplaatsingskosten politie.'
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel18
