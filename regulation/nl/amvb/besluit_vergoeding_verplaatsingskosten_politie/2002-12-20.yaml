articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende regelingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel1
  - number: 1.1.b
    text: |-
      het LSOP: het Landelijk selectie- en opleidingsinstituut politie, bedoeld in [artikel 2 van de LSOP-wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006942#Artikel2
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel1
    references:
