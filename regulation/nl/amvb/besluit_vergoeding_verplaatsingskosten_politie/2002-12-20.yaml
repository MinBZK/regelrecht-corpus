        artikel: '1'
  - number: 1.1.f
    text: |-
      plaats van tewerkstelling: de plaats van tewerkstelling, bedoeld in
      [artikel 1, eerste lid, onder t, van het Besluit algemene rechtspositie politie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel1
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel1
    references:
      - id: ref1
