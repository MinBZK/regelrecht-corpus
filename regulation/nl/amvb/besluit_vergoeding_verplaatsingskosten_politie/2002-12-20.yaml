    text: 'ITO: de Organisatie Informatie- en communicatietechnologie OOV;'
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel1
  - number: 1.1.d
    text: 'bevoegd gezag:'
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel1
  - number: 1.1.d.1°
    text: |-
      de korpsbeheerder, voor zover het betreft de adspirant, de ambtenaar, aangesteld voor de uitvoering van de
      politietaak en de ambtenaar aangesteld voor de uitvoering van technische, administratieve en andere taken ten
      dienste van de politie, die werkzaam is bij een regionaal politiekorps;
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel1
  - number: 1.1.d.2°
    text: |-
      Onze Minister, voor zover het betreft de adspirant, de ambtenaar, aangesteld voor de uitvoering van de politietaak,
      en de ambtenaar, aangesteld voor de uitvoering van technische, administratieve en andere taken ten dienste van de
      politie, die werkzaam is bij het Korps landelijke politiediensten of bij ITO;
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel1
  - number: 1.1.d.3°
    text: Onze Minister van Justitie, voor zover het betreft de bijzondere ambtenaar van politie;
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel1
  - number: 1.1.d.4°
    text: |-
      de bestuursraad van het LSOP, voor zover het betreft de ambtenaren, bedoeld in
      [artikel 9, eerste lid, onderdelen ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006942#Artikel9
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel1
    references:
