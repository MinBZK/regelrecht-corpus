        artikel: '9'
  - number: 1.1.d.5°
    text: |-
      de directie van het LSOP, voor zover het betreft de ambtenaren, bedoeld in
      [artikel 9, eerste lid, onderdeel ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006942#Artikel9
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006942
        artikel: '9'
  - number: 1.1.e
    text: |-
      betrokkene: de ambtenaar, bedoeld in [artikel 1, eerste lid, onder ][ref1], dan wel degene die ambtenaar in
      bedoelde zin is geweest;


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel1
    url: https://wetten.overheid.nl/BWBR0006520/2002-12-20#Artikel1
    references:
