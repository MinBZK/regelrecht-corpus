        bwb_id: BWBR0023009
  - number: '2.1'
    text: |-
      Bij bedrijfsmatig vervoer van goederen of personen tussen twee plaatsen aan de binnenwateren, bedoeld in artikel 4,
      eerste lid, van de Herziene Rijnvaartakte, is het schip voorzien van een Rijnvaartverklaring.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel2
  - number: '2.2'
    text: |-
      Bij bedrijfsmatig vervoer van goederen of personen dat niet plaatsvindt tussen twee plaatsen als bedoeld in het
      eerste lid, is het schip voorzien van:
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel2
  - number: 2.2.a
    text: een Rijnvaartverklaring;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel2
  - number: 2.2.b
    text: een bewijs van toelating; of
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel2
  - number: 2.2.c
    text: |-
      een door Onze Minister aangewezen geëigend document van de bevoegde autoriteit van een andere lidstaat van de
      Europese Gemeenschappen of van een van de overige staten die partij zijn bij de Overeenkomst betreffende de
      Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel2
  - number: '2.3'
    text: 'Het tweede lid is van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel2
  - number: 2.3.a
    text: een schip met een lengte van ten minste 20 meter; of
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel2
  - number: 2.3.b
    text: een schip waarvoor het product van lengte, breedte en diepgang in meters ten minste 100 m3 bedraagt.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel2
  - number: '2.4'
    text: Bij regeling van Onze Minister kan vrijstelling worden verleend van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel2
  - number: '3.1'
    text: |-
      Onze Minister verstrekt voor een schip een Rijnvaartverklaring, indien de eigenaar voldoet aan bij regeling van
      Onze Minister te stellen regels:
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel3
  - number: 3.1.a
    text: 'in geval van een natuurlijke persoon: met betrekking tot de nationaliteit en de woon- en verblijfplaats; of'
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel3
  - number: 3.1.b
    text: |-
      in geval van een rechtspersoon of een vennootschap zonder rechtspersoonlijkheid: met betrekking tot de oprichting,
      de zetel, het centrum van de handelsactiviteit, de plaats van waaruit de exploitatie wordt geleid, het bestuur en
      het beheer.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel3
  - number: '3.2'
    text: |-
      De houder van een Rijnvaartverklaring doet aan Onze Minister binnen twee weken schriftelijk mededeling van iedere
      wijziging in de omstandigheden op grond waarvan de Rijnvaartverklaring is verstrekt.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel3
  - number: '3.3'
    text: |-
      Onze Minister trekt de verklaring in, indien niet langer aan de in het eerste lid bedoelde regels wordt voldaan en
      kan de verklaring intrekken als de houder niet voldoet aan de verplichting genoemd in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel3
  - number: '3.4'
    text: |-
      Onze Minister kan in het geval dat een Rijnvaartverklaring wordt aangevraagd in verband met het verrichten van
      vervoer als bedoeld in [artikel 2, tweede lid][ref1], uitzonderingen toestaan wat betreft de eis van meerderheid,
      bedoeld in artikel 3, eerste lid, onderdeel c, onder cc, alsmede artikel 3, tweede lid, van de bijlage bij
      Verordening (EEG) nr. 2919/85 van de Raad van de Europese Gemeenschappen van 17 oktober 1985 houdende vaststelling
      van de voorwaarden waaraan moet worden voldaan om in aanmerking te komen voor het regime dat door de Herziene
      Rijnvaartakte wordt gereserveerd voor de vaartuigen die tot de Rijnvaart behoren (PbEG L 280), op voorwaarde dat
      het doel van Aanvullend Protocol nr. 2 bij de Herziene Rijnvaartakte niet in gevaar wordt gebracht en hij tevens de
      door de Centrale Commissie voor de Rijnvaart vastgestelde algemene voorwaarden, bedoeld in artikel 3, vierde lid,
      van de bijlage bij bovengenoemde verordening overeenkomstig toepast.


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel2
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0025631
        artikel: '2'
        hoofdstuk: '2'
  - number: '4.1'
    text: |-
      Onze Minister kan voor een schip dat niet in aanmerking komt voor een Rijnvaartverklaring of een geëigend document
      als bedoeld in [artikel 2, tweede lid][ref1], op aanvraag van de eigenaar van het schip een bewijs van toelating
      als bedoeld in dat artikellid verstrekken, indien dat schip is voorzien van een door Onze Minister aangewezen
      document dat door een andere staat dan een lidstaat van de Europese Unie, door een andere staat die partij is bij
      de Overeenkomst betreffende de Europese Economische Ruimte of door Zwitserland wordt verstrekt in het kader van een
      door Nederland met de betrokken staat gesloten overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel2
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0025631
        artikel: '2'
        hoofdstuk: '2'
  - number: '4.2'
    text: |-
      Onze Minister kan als niet wordt voldaan aan de voorwaarden, bedoeld in artikel 4, tweede lid, van de Herziene
      Rijnvaartakte:
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel4
  - number: 4.2.a
    text: de afgifte van een bewijs van toelating weigeren of een dergelijk bewijs intrekken; of
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel4
  - number: 4.2.b
    text: aan een bewijs van toelating voorschriften verbinden of zodanige voorschriften wijzigen of intrekken.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel4
  - number: '4.3'
    text: |-
      [Artikel 3, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel3
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0025631
        artikel: '3'
        hoofdstuk: '2'
  - number: '5'
    text: 'Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel5
  - number: 5.a
    text: de vorm, de inhoud en de verstrekking van de Rijnvaartverklaring en van het bewijs van toelating;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel5
  - number: 5.b
    text: |-
      de voorschriften waaraan moet zijn voldaan en de gegevens die worden verstrekt bij een aanvraag om afgifte of
      intrekking van de Rijnvaartverklaring en het bewijs van toelating;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel5
  - number: 5.c
    text: |-
      de wijze waarop een aanvraag om afgifte of intrekking van een Rijnvaartverklaring en een bewijs van toelating wordt
      ingediend;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel5
  - number: 5.d
    text: de controleerbaarheid van de Rijnvaartverklaring, van het bewijs van toelating en van het geëigend document.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel5
  - number: '6'
    text: 'Voor de volgende categorieën van binnenschepen is een certificaat van onderzoek vereist:'
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel6
  - number: 6.a
    text: binnenschepen met een lengte van ten minste 20 meter;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel6
  - number: 6.b
    text: binnenschepen waarvoor het product van lengte, breedte en diepgang ten minste 100 m3 bedraagt;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel6
  - number: 6.c
    text: |-
      sleepboten, duwboten of sleepduwboten, die zijn bestemd of worden gebruikt om de schepen bedoeld onder a en b
      of drijvende werktuigen met vergelijkbare afmetingen als bedoeld onder a en b te slepen, te duwen of langszij
      gekoppeld mee te voeren;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel6
  - number: 6.d
    text: passagiersschepen;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel6
  - number: 6.e
    text: |-
      veerponten die zijn bestemd of worden gebruikt voor het bedrijfsmatig vervoer van meer dan twaalf personen buiten
      de bemanningsleden;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel6
  - number: 6.f
    text: veerboten;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel6
  - number: 6.g
    text: drijvende werktuigen;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel6
  - number: 6.h
    text: |-
      binnenschepen die gevaarlijke stoffen als bedoeld in de [Wet vervoer gevaarlijke stoffen vervoeren][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007606
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007606
  - number: 6.i
    text: |-
      binnenschepen die krachtens het [Binnenvaartpolitiereglement](onbekend) of het
      [Rijnvaartpolitiereglement 1995][ref1] zijn toegelaten tot het ligplaats nemen langszijde van een binnenschip als
      bedoeld in onderdeel h; of


      [ref1]: https://wetten.overheid.nl/BWBR0006923
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006923
  - number: 6.j
    text: samenstellen van hecht aan elkaar verbonden schepen met een gezamenlijke afmeting als bedoeld in onderdeel a of b;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel6
  - number: 6.k
    text: bunkerstations met een afmeting als bedoeld in de onderdelen a of b.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel6
  - number: '7'
    text: 'Het certificaat van onderzoek is niet vereist voor:'
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel7
  - number: 7.a
    text: |-
      binnenschepen voorzien van een geldig certificaat van onderzoek als bedoeld in artikel 22 van de Herziene
      Rijnvaartakte:
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel7
  - number: 7.a.1°
    text: |-
      met inachtneming van [artikel 9][ref1] van dit besluit, en


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel9
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0025631
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 7.a.2°
    text: mits voldaan wordt aan de technische eisen op grond waarvan dat certificaat is verleend;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel7
  - number: 7.b
    text: |-
      zeeschepen voorzien van een geldig certificaat of document, afgegeven door of namens de bevoegde autoriteiten van
      de staat wiens vlag het schip gerechtigd is te voeren, op grond waarvan de vaart op zee mag worden ondernomen, mits
      voldaan wordt aan de technische eisen op grond waarvan die certificaten zijn verleend;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel7
  - number: 7.c
    text: |-
      binnenschepen voorzien van een ander geldig document dan in onderdeel a bedoeld, dat door de bevoegde autoriteiten
      in het buitenland ten bewijze van de deugdelijkheid van het binnenschip is afgegeven, mits voldaan wordt aan de
      technische eisen op grond waarvan dat document is afgegeven en voor zover:
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel7
  - number: 7.c.1°
    text: afgegeven ter uitvoering van bindende besluiten van organen van de Europese Unie,
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel7
  - number: 7.c.2°
    text: anderszins afgegeven ter uitvoering van verdragen of bindende besluiten van volkenrechtelijke organisaties, of
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel7
  - number: 7.c.3°
    text: door Onze Minister erkend in bij regeling van Onze Minister vast te stellen gevallen;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel7
  - number: 7.d
    text: binnenschepen die uitsluitend door spierkracht worden voortbewogen;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel7
  - number: 7.e
    text: drijvende werktuigen die zich in een grind- of zandgat bevinden;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel7
  - number: 7.f
    text: binnenschepen die in aanbouw zijn of waarmee een proefvaart wordt ondernomen;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel7
  - number: 7.g
    text: |-
      binnenschepen met permanente ligplaats, uitsluitend gebruikt voor bewoning en zonder eigen aandrijving dan wel
      anderszins niet voor de vaart geschikt, ook gedurende de tijd van verslepen;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel7
  - number: 7.h
    text: schepen bestemd tot het redden van drenkelingen.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel7
  - number: '8'
    text: |-
      Een Uniebinnenvaartcertificaat voor binnenschepen overeenkomstig richtlijn (EU) 2016/1629 wordt gelijkgesteld met
      een certificaat van onderzoek.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel8
  - number: '9.1'
    text: |-
      Voor binnenschepen waarop aanvullende regels als bedoeld in [artikel 8, tweede lid, van de wet][ref1], van
      toepassing zijn en die zijn voorzien van een certificaat van onderzoek, verstrekt Onze Minister op aanvraag van de
      eigenaar van het binnenschip een aanvullend Uniebinnenvaartcertificaat overeenkomstig richtlijn (EU) 2016/1629.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel8
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '8'
  - number: '9.2'
    text: |-
      Onze Minister verstrekt op aanvraag voor zeeschepen ten behoeve van de vaart op de binnenwateren een aanvullend
      Uniebinnenvaartcertificaat.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel9
  - number: '9.3'
    text: |-
      Op het aanvullend Uniebinnenvaartcertificaat zijn [hoofdstuk 3, paragraaf 1, van de wet][ref1] en deze paragraaf
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Paragraaf1
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0023009
        paragraaf: '1'
  - number: '10.1'
    text: |-
      Onze Minister kan een voorlopig certificaat van onderzoek afgeven voor binnenschepen, behorende tot de categorieën,
      bedoeld in [artikel 6][ref1], voor:


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel6
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0025631
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 10.1.a
    text: |-
      binnenschepen, die teneinde een certificaat van onderzoek te verkrijgen, met toestemming van Onze Minister naar een
      bepaalde plaats worden gevaren;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel10
  - number: 10.1.b
    text: |-
      binnenschepen die, wegens een van de in artikel 2.07 van bijlage V van richtlijn (EU) 2016/1629 of de in de
      artikelen 13 en 15 van die richtlijn bedoelde gevallen, tijdelijk niet van hun Uniebinnenvaartcertificaat zijn
      voorzien;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel10
  - number: 10.1.c
    text: binnenschepen waarvan de aanvraag voor het certificaat van onderzoek na het onderzoek nog in behandeling is;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel10
  - number: 10.1.d
    text: |-
      binnenschepen die niet aan alle voorwaarden voor de afgifte van een Uniebinnenvaartcertificaat overeenkomstig
      bijlage 3, onderdelen I tot en met III, van deel I, van de bijlagen bij bijlage II van richtlijn (EU) 2016/1629,
      van richtlijn (EU) 2016/1629 voldoen;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel10
  - number: 10.1.e
    text: |-
      binnenschepen die een zodanige schade hebben geleden dat de staat waarin zij verkeren, niet meer met het in het
      certificaat van onderzoek gestelde overeenstemt;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel10
  - number: 10.1.f
    text: |-
      drijvende inrichtingen en drijvende voorwerpen, wanneer de voor bijzonder transport bevoegde autoriteiten,
      overeenkomstig het [Rijnvaartpolitiereglement 1995][ref1] of het [Binnenvaartpolitiereglement](onbekend),
      de vergunning voor een bijzonder transport afhankelijk stelt van het hebben van een dergelijk voorlopig
      Uniebinnenvaartcertificaat;


      [ref1]: https://wetten.overheid.nl/BWBR0006923
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006923
  - number: 10.1.g
    text: |-
      binnenschepen die volgens artikel 9, eerste lid, onderdeel g van richtlijn (EU) 2016/1629 van de bepalingen van
      bijlage II van die richtlijn afwijken.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel10
  - number: '10.2'
    text: 'Het voorlopig certificaat is geldig:'
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel10
  - number: 10.2.a
    text: |-
      in de in het eerste lid, onderdelen a en d tot en met f, bedoelde gevallen voor één bepaalde reis, te maken binnen
      een redelijke termijn die ten hoogste één maand is;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel10
  - number: 10.2.b
    text: in de in het eerste lid, onderdelen b en c, bedoelde gevallen gedurende een redelijke termijn;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel10
  - number: 10.2.c
    text: |-
      in de in het eerste lid, onderdeel g, genoemde gevallen gedurende zes maanden, hetgeen elke zes maanden kan worden
      verlengd, zolang nog geen uitvoeringshandeling als bedoeld in dat onderdeel is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel10
  - number: '10.3'
    text: |-
      Het voorlopig certificaat van onderzoek kan voorschriften bevatten die door Onze Minister in het belang van de
      veiligheid van het binnenschip of de opvarenden nodig worden geacht. De eigenaar draagt zorg voor de naleving van
      deze voorschriften.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel10
  - number: '11.1'
    text: 'Bij regeling van Onze Minister worden vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel11
  - number: 11.1.a
    text: de modellen voor de certificaten van onderzoek;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel11
  - number: 11.1.b
    text: |-
      de procedure waarbij natuurlijke personen of rechtspersonen als bedoeld in [artikel 14 van de wet][ref1] worden
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel14
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '14'
  - number: '11.2'
    text: 'Bij regeling van Onze Minister worden nadere regels vastgesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel11
  - number: 11.2.a
    text: de afgifte van de certificaten van onderzoek;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel11
  - number: 11.2.b
    text: |-
      het onderzoek, bedoeld in [artikel 14 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel14
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '14'
  - number: '12.1'
    text: |-
      De categorieën schepen, bedoeld in [artikel 22, eerste lid, van de wet][ref1], zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel22
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '22'
  - number: 12.1.a
    text: schepen met een lengte van ten minste 20 meter;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel12
  - number: 12.1.b
    text: 'sleepboten, duwboten of sleepduwboten, tenzij:'
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel12
  - number: 12.1.b.1°
    text: ze blijkens een verklaring van Onze Minister uitsluitend worden gebruikt als pleziervaartuig, en
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel12
  - number: 12.1.b.2°
    text: ze overeenkomstig de voorwaarden gesteld op die verklaring worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel12
  - number: 12.1.c
    text: passagiersschepen;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel12
  - number: 12.1.d
    text: veerponten;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel12
  - number: 12.1.e
    text: veerboten;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel12
  - number: 12.1.f
    text: drijvende werktuigen;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel12
  - number: 12.1.g
    text: |-
      binnenschepen die voor het vervoer van gevaarlijke stoffen als bedoeld in de
      [Wet vervoer gevaarlijke stoffen zijn toegelaten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007606
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007606
  - number: 12.1.h
    text: |-
      schepen die krachtens het [Binnenvaartpolitiereglement](onbekend) en het [Rijnvaartpolitiereglement 1995][ref1]
      zijn toegelaten tot het ligplaats nemen langszijde van een schip als bedoeld in onderdeel g; of


      [ref1]: https://wetten.overheid.nl/BWBR0006923
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006923
  - number: 12.1.i
    text: samenstellen van hecht aan elkaar verbonden schepen met een gezamenlijke afmeting als bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel12
  - number: '12.2'
    text: 'Tot de in het eerste lid genoemde categorieën behoren niet:'
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel12
  - number: 12.2.a
    text: pleziervaartuigen en reddingsboten;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel12
  - number: 12.2.b
    text: bunkerstations;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel12
  - number: 12.2.c
    text: |-
      zeeschepen die uitsluitend worden gebruikt voor het vangen van vis op zee als bedoeld in de
      [Visserijwet 1963][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002416
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002416
  - number: 12.2.d
    text: 'zeeschepen, niet zijnde een sleepboot:'
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel12
  - number: 12.2.d.1°
    text: |-
      die gebruik dienen te maken van een loods en zich bevinden op de scheepvaartwegen, bedoeld in de
      [artikel 10, eerste, tweede, derde en vierde lid, van de Scheepvaartverkeerswet][ref1] en de daarop berustende
      bepalingen;


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel10
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '10'
  - number: 12.2.d.2°
    text: |-
      die van de loodsplicht zijn vrijgesteld of ontheven op grond van
      [artikel 11, eerste lid, van de Scheepvaarverkeerswet][ref1] en zich bevinden op de scheepvaartwegen, bedoeld onder
      1°;


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel11
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '11'
  - number: 12.2.e
    text: |-
      zeeschepen die voldoen aan bij regeling van Onze Minister overeenkomstig bindende besluiten van organen van
      de Europese Unie dan wel anderszins ter uitvoering van verdragen of bindende besluiten van volkenrechtelijke
      organisaties gestelde regels.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel12
  - number: '13.1'
    text: |-
      Voor de vaart op rivieren, kanalen en meren is de gezagvoerder voorzien van een groot, beperkt groot, dan wel klein
      vaarbewijs, voor rivieren, kanalen en meren.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel13
  - number: '13.2'
    text: |-
      Voor de vaart op de overige binnenwateren is de gezagvoerder voorzien van een groot, beperkt groot, dan wel klein
      vaarbewijs, voor alle binnenwateren.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel13
  - number: '13.3'
    text: |-
      Voor de toepassing van het eerste lid worden onder rivieren, kanalen en meren verstaan de binnenwateren met
      uitzondering van de Westerschelde, de Oosterschelde, de Waddenzee, de Eems, de Dollard, het IJsselmeer, het IJmeer
      en het Markermeer met uitzondering van de Gouwzee.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel13
  - number: '14.1'
    text: 'Een groot vaarbewijs is vereist voor het voeren van:'
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel14
  - number: 14.1.a
    text: schepen met een lengte van ten minste 20 meter;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel14
  - number: 14.1.b
    text: passagiersschepen;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel14
  - number: 14.1.c
    text: 'veerponten die:'
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel14
  - number: 14.1.c.1°
    text: |-
      zijn bestemd of worden gebruikt voor het bedrijfsmatig vervoer van meer dan twaalf personen buiten de
      bemanningsleden, of
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel14
  - number: 14.1.c.2°
    text: |-
      Door middel van de eigen mechanische voortstuwingsmiddelen een snelheid van 30 kilometer per uur of meer ten
      opzichte van het water kunnen bereiken;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel14
  - number: 14.1.d
    text: veerboten, of
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel14
  - number: 14.1.e
    text: sleepboten, duwboten of sleepduwboten.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel14
  - number: '14.2'
    text: |-
      Een groot vaarbewijs is geldig voor het voeren van schepen waarvoor een beperkt groot vaarbewijs of een klein
      vaarbewijs vereist is.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel14
  - number: '14.3'
    text: |-
      In afwijking van het eerste lid, onder a, is een groot vaarbewijs niet vereist voor schepen die een lengte hebben
      van ten minste 20 meter en minder dan 40 meter en die niet behoren tot de in het eerste lid, onderdelen b tot en
      met e, genoemde categorieën als de gezagvoerder op grond van het bepaalde in [artikel 15][ref1] in het bezit is van
      een geldig beperkt groot vaarbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel15
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0025631
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '14.4'
    text: |-
      Het eerste lid, onderdeel e, is niet van toepassing op sleepboten, duwboten of sleepduwboten met een lengte van
      minder dan 15 meter, indien:
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel14
  - number: 14.4.a
    text: ze blijkens een verklaring van Onze Minister uitsluitend worden gebruikt als pleziervaartuig; en
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel14
  - number: 14.4.b
    text: ze overeenkomstig de voorwaarden gesteld op die verklaring worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel14
  - number: '15.1'
    text: 'Een beperkt groot vaarbewijs is vereist voor het voeren van:'
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel15
  - number: 15.1.a
    text: 'schepen met een lengte van ten minste 20 meter en minder dan 40 meter, met uitzondering van:'
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel15
  - number: 15.1.a.1°
    text: pleziervaartuigen met een lengte van minder dan 25 meter, en
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel15
  - number: 15.1.a.2°
    text: |-
      schepen die behoren tot de in [artikel 14, eerste lid, onderdelen b, c, d en e][ref1], genoemde categorieën, of


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel14
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0025631
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 15.1.b
    text: 'sleepboten, duwboten of sleepduwboten met een lengte van ten minste 25 meter en minder dan 40 meter, indien:'
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel15
  - number: 15.1.b.1°
    text: ze blijkens een verklaring van Onze Minister uitsluitend worden gebruikt als pleziervaartuig, en
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel15
  - number: 15.1.b.2°
    text: ze overeenkomstig de voorwaarden gesteld op die verklaring worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel15
  - number: '15.2'
    text: Een beperkt groot vaarbewijs is geldig voor het voeren van een schip waarvoor een klein vaarbewijs vereist is.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel15
  - number: '16'
    text: 'Een klein vaarbewijs is vereist voor het voeren van:'
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel16
  - number: 16.a
    text: |-
      schepen met een lengte van ten minste 15 en minder dan 20 meter die niet behoren tot de in
      [artikel 14, eerste lid, onderdelen b, c, en d, bedoelde categorieën][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel14
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0025631
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 16.b
    text: pleziervaartuigen met een lengte van ten minste 15 meter en minder dan 25 meter;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel16
  - number: 16.c
    text: 'sleepboten, duwboten of sleepduwboten met een lengte van ten minste 15 meter en minder dan 25 meter, indien:'
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel16
  - number: 16.c.1°
    text: ze blijkens een verklaring van Onze Minister uitsluitend worden gebruikt als pleziervaartuig, en
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel16
  - number: 16.c.2°
    text: ze overeenkomstig de voorwaarden gesteld op die verklaring worden gebruikt, of
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel16
  - number: 16.d
    text: |-
      schepen met een lengte van minder dan 15 meter die door middel van de eigen mechanische voortstuwingsmiddelen een
      snelheid van meer dan 20 kilometer per uur ten opzichte van het water kunnen bereiken, en niet behoren tot de in
      [artikel 14, eerste lid, onderdelen b, c, d en e][ref1], genoemde schepen.


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel14
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0025631
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '17.1'
    text: 'Het bezit van een vaarbewijs is niet vereist voor het voeren van:'
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel17
  - number: 17.1.a
    text: schepen die uitsluitend door spierkracht worden voortbewogen;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel17
  - number: 17.1.b
    text: drijvende werktuigen die zich bevinden in een grind- of zandgat;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel17
  - number: 17.1.c
    text: bunkerstations.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel17
  - number: '17.2'
    text: |-
      Geen verplichting tot het bezit van een vaarbewijs geldt voor de gezagvoerder die in het bezit is van een bij
      regeling van Onze Minister aangewezen krachtens de Herziene Rijnvaartakte afgegeven geldig gelijkwaardig vaarbewijs
      of van een geldig gelijkwaardig vaarbewijs als bedoeld in [artikel 25, derde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel25
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '25'
  - number: '17.3'
    text: 'Geen verplichting tot het bezit van een vaarbewijs geldt voor de gezagvoerder van een zeeschip:'
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel17
  - number: 17.3.a
    text: |-
      indien zich een persoon aan boord bevindt die in het bezit is van een geldig groot vaarbewijs, van een bij regeling
      van Onze Minister aangewezen krachtens de Herziene Rijnvaartakte afgegeven daaraan gelijkwaardig geldig vaarbewijs
      of van een daaraan gelijkwaardig geldig vaarbewijs als bedoeld in [artikel 25, derde lid, van de wet][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel25
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '25'
  - number: 17.3.b
    text: 'niet zijnde een sleepboot:'
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel17
  - number: 17.3.b.1°
    text: |-
      die gebruik dienen te maken van een loods en zich bevinden op de scheepvaartwegen, bedoeld in de
      [artikel 10, eerste, tweede, derde en vierde lid, van de Scheepvaartverkeerswet][ref1] en de daarop berustende
      bepalingen;


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel10
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '10'
  - number: 17.3.b.2°
    text: |-
      die van de loodsplicht zijn vrijgesteld of ontheven op grond van
      [artikel 11, eerste lid, van de Scheepvaarverkeerswet][ref1] en zich bevinden op de scheepvaartwegen, bedoeld onder
      1°.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel11
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '11'
  - number: '17.4'
    text: 'Geen verplichting tot het bezit van een vaarbewijs geldt voor de gezagvoerder, indien:'
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel17
  - number: 17.4.a
    text: |-
      de gezagvoerder is voorzien van een door Onze Minister aangewezen bewijs van bekwaamheid dat is erkend ingevolge
      [artikel 25, derde lid, van de wet][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel25
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '25'
  - number: 17.4.b
    text: |-
      de gezagvoerder of een ander lid van de dekbemanning is voorzien van een door Onze Minister aangewezen aanvullend
      bewijs van bekwaamheid voor de binnenvaart dat is afgegeven door een daartoe bevoegde autoriteit in het buitenland.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel17
  - number: '18.1'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld houdende vrijstelling van de vaarbewijsplicht, indien
      naar het oordeel van Onze Minister de veilige vaart voldoende gewaarborgd is.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel18
  - number: '18.2'
    text: |-
      De in het eerste lid genoemde regels betreffen in elk geval de voorschriften voor afgifte en intrekking van
      vrijstellingsbewijzen.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel18
  - number: '19'
    text: Bij regeling van Onze Minister worden vorm en inhoud van de vaarbewijzen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel19
  - number: '20.1'
    text: 'Bij de aanvraag tot afgifte van een vaarbewijs worden overgelegd:'
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel20
  - number: 20.1.a
    text: |-
      de geneeskundige verklaring, niet ouder dan dertien weken, of een eigen verklaring als bedoeld in
      [artikel 26, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel26
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0025631
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 20.1.b
    text: |-
      het getuigschrift dat betrekking heeft op het examen voor het verlangde vaarbewijs onderscheidenlijk een bewijs van
      bekwaamheid voor de binnenvaart dat door Onze Minister is erkend;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel20
  - number: 20.1.c
    text: overige, bij regeling van Onze Minister nader te regelen, bescheiden.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel20
  - number: '20.2'
    text: |-
      Onverminderd het eerste lid toont de aanvrager bij de aanvraag tot afgifte van een beperkt groot vaarbewijs of een
      groot vaarbewijs op bij regeling van Onze Minister te bepalen wijze aan dat hij een vaartijd heeft doorlopen van
      drie jaren respectievelijk vier jaren.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel20
  - number: '20.3'
    text: |-
      Een jaar vaartijd als bedoeld in het tweede lid bestaat uit 180 effectieve vaardagen. Binnen een periode van 365
      opeenvolgende dagen kunnen maximaal 180 dagen als vaartijd worden meegerekend.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel20
  - number: '20.4'
    text: |-
      In het geval van ongeldigverklaring van het vaarbewijs mag bij een nieuwe aanvraag tot afgifte geen gebruik worden
      gemaakt van een eerder overgelegd getuigschrift of erkend bewijs van bekwaamheid voor de binnenvaart.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel20
  - number: '20.5'
    text: |-
      Bij regeling van Onze Minister worden nadere regels gegeven omtrent de toelating van de aanvrager tot het onderzoek
      en de wijze van onderzoek als bedoeld in [artikel 26, tweede lid, onderdeel b, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel26
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '26'
  - number: '21'
    text: |-
      In plaats van een document als bedoeld in [artikel 20, eerste lid, onderdeel b][ref1], kan worden overgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel20
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0025631
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 21.a
    text: een ten minste gelijkwaardig geldig vaarbewijs, of
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel21
  - number: 21.b
    text: |-
      een ten minste gelijkwaardig vaarbewijs dat zijn geldigheid heeft verloren uitsluitend door het verstrijken van
      de geldigheidsduur.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel21
  - number: '22.1'
    text: |-
      Een groot vaarbewijs en een beperkt groot vaarbewijs, afgegeven voor de 50-jarige leeftijd van de houder, zijn
      geldig tot de dag waarop hij de leeftijd van 50 jaar en dertien weken heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel22
  - number: '22.2'
    text: |-
      Een groot vaarbewijs en een beperkt groot vaarbewijs, afgegeven aan de houder na het bereiken van de
      leeftijd van 50 jaar, zijn geldig tot de dag waarop de houder de leeftijd van 65 jaar en dertien weken
      heeft bereikt in bij regeling genoemde gevallen, mits zij samen met de geneeskundige verklaring, bedoeld in
      [artikel 28 van de wet][ref1], worden getoond.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel28
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '28'
  - number: '22.3'
    text: |-
      Een groot vaarbewijs en een beperkt groot vaarbewijs zijn na de dag waarop de houder de leeftijd van 65 jaar en
      dertien weken heeft bereikt slechts geldig in bij regeling genoemde gevallen, mits zij samen met de geneeskundige
      verklaring, bedoeld in [artikel 28 van de wet][ref1], worden getoond.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel28
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '28'
  - number: '23.1'
    text: |-
      Het vaarbewijs wordt binnen twee weken na ongeldigverklaring als bedoeld in [artikel 30 van de wet][ref1] bij Onze
      Minister ingeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel30
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '30'
  - number: '23.2'
    text: |-
      Onze Minister kan degene wiens vaarbewijs ongeldig is verklaard geheel of gedeeltelijk ontheffing van het examen
      verlenen.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel23
  - number: '23.3'
    text: Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot het in dit artikel bepaalde.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel23
  - number: '24'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld omtrent de verstrekking van gegevens betreffende afgegeven en
      ongeldige vaarbewijzen, bedoeld in [artikel 35 van de wet][ref1]. Die regels betreffen:


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel35
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '35'
  - number: 24.a
    text: de gegevens die verstrekt worden;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel24
  - number: 24.b
    text: de aanwijzing van degenen die namens Onze Minister gegevens verstrekken;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel24
  - number: 24.c
    text: de wijze waarop de gegevens verstrekt worden; en
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel24
  - number: 24.d
    text: |-
      de wijze waarop de houder van het ongeldige vaarbewijs in kennis wordt gesteld van de verstrekking van zijn
      gegevens.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel24
  - number: 24a
    text: |-
      De geldigheid van het vaardocument, bedoeld in [artikel 33a][ref1], is van rechtswege geschorst gedurende de
      periode dat het ingevolge de [artikelen 35a, eerste lid, van de Scheepvaartverkeerswet][ref2] onderscheidenlijk
      [42, eerste lid, van de wet][ref3], is ingevorderd maar nog niet overhandigd.


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel33a
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel35a
      [ref3]: https://wetten.overheid.nl/BWBR0023009#Artikel42
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0025631
        artikel: 33a
        hoofdstuk: 4a
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004364
        artikel: 35a
      - id: ref3
        bwb_id: BWBR0023009
        artikel: '42'
  - number: '25.1'
    text: |-
      Het geneeskundig onderzoek ter afgifte van de geneeskundige verklaringen, bedoeld in de [artikelen 23][ref1] en
      [28 van de wet][ref2], heeft betrekking op de lichamelijke en geestelijke toestand van de aanvrager in het algemeen
      en in het bijzonder op:


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0023009#Artikel28
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0023009
        artikel: '28'
  - number: 25.1.a
    text: de gezichtsscherpte en het kleuronderscheidingsvermogen;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel25
  - number: 25.1.b
    text: de gehoorscherpte;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel25
  - number: 25.1.c
    text: de toestand van het hart, de longen en de bloeddruk;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel25
  - number: 25.1.d
    text: het functioneren van armen en benen;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel25
  - number: 25.1.e
    text: de neurologische en psychische gesteldheid; en
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel25
  - number: 25.1.f
    text: overige afwijkingen die het veilig varen nadelig kunnen beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel25
  - number: '25.2'
    text: |-
      Het geneeskundig onderzoek en de afgifte van de geneeskundige verklaring geschieden met inachtneming van de bij
      regeling van Onze Minister te stellen regels.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel25
  - number: '26.1'
    text: |-
      Het geneeskundig onderzoek ten behoeve van de verkrijging van het vaarbewijs blijft achterwege, indien uit een
      eigen verklaring van de aanvrager blijkt, dat hij lichamelijk en geestelijk voldoende geschikt is voor het voeren
      van een binnenschip en indien hij:
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel26
  - number: 26.1.a
    text: een klein vaarbewijs wenst te verkrijgen; of
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel26
  - number: 26.1.b
    text: niet langer dan dertien weken tevoren een overeenkomstig geneeskundig onderzoek met gunstig gevolg heeft ondergaan.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel26
  - number: '26.2'
    text: |-
      De eigen verklaring heeft betrekking op de onderwerpen, bedoeld in [artikel 25, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel25
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0025631
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '26.3'
    text: |-
      De aanvrager, bedoeld in het eerste lid, onder b, legt bescheiden over ten bewijze van het feit dat hij voldoet aan
      de aldaar gestelde vereisten.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel26
  - number: '26.4'
    text: De eigen verklaring mag niet ouder zijn dan zesentwintig weken.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel26
  - number: '26.5'
    text: |-
      Indien de eigen verklaring op enige afwijking wijst kan een deskundige, bedoeld in
      [artikel 28, eerste lid, van de wet][ref1], een geneeskundige verklaring afgeven, indien hij van oordeel is dat de
      afwijking het veilig varen niet nadelig zal beïnvloeden.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel28
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '28'
  - number: '26.6'
    text: |-
      Het opmaken en het beoordelen van de eigen verklaring geschiedt met inachtneming van de bij regeling van Onze
      Minister te stellen regels.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel26
  - number: '27.1'
    text: |-
      Het geneeskundig onderzoek ten behoeve van de verkrijging van het vaarbewijs blijft achterwege indien de aanvrager
      van een groot of beperkt groot vaarbewijs reeds een geldig groot of beperkt groot vaarbewijs bezit en de 50-jarige
      leeftijd nog niet heeft bereikt en niet is gebleken dat hij sinds de afgifte van dat vaarbewijs medisch ongeschikt
      is geworden.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel27
  - number: '27.2'
    text: |-
      De houder van het beperkt groot vaarbewijs of van het groot vaarbewijs toont zijn lichamelijke en geestelijke
      geschiktheid opnieuw aan bij Onze Minister door het overleggen van een geneeskundige verklaring als bedoeld in
      [artikel 28 van de wet][ref1], die niet ouder dan dertien weken is:


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel28
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '28'
  - number: 27.2.a
    text: iedere vijf jaren vanaf het bereiken van de leeftijd van 50 jaar tot de leeftijd van 65 jaar;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel27
  - number: 27.2.b
    text: ieder jaar vanaf het bereiken van de leeftijd van 65 jaar.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel27
  - number: '28.1'
    text: |-
      Een geneeskundige verklaring als bedoeld in [artikel 23 van de wet][ref1], afgegeven vóór de 65-jarige leeftijd van
      een bemanningslid, is geldig tot dertien weken na de dag waarop hij de 65-jarige leeftijd bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel23
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '23'
  - number: '28.2'
    text: |-
      Een geneeskundige verklaring als bedoeld in [artikel 23 van de wet][ref1] afgegeven nadat een bemanningslid de 65-
      jarige leeftijd heeft bereikt, is geldig gedurende een jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel23
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '23'
  - number: '28.3'
    text: |-
      Een geneeskundige verklaring als bedoeld in [artikel 23 van de wet][ref1] is niet
      vereist voor de gezagvoerder die in het bezit is van een groot patent als bedoeld in het
      [Reglement betreffende het scheepvaartpersoneel op de Rijn][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0030215
  - number: '29.1'
    text: |-
      Bij regeling van Onze Minister worden nadere regels gesteld omtrent de aanwijzing van instellingen of personen die
      het geneeskundig onderzoek verrichten alsmede over de procedure die instellingen of personen bij het geneeskundig
      onderzoek volgen.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel29
  - number: '29.2'
    text: |-
      Bij regeling van Onze Minister worden nadere regels gesteld omtrent het onderzoek naar de kennis en bekwaamheid om
      het binnenschip te voeren als bedoeld in [artikel 29, derde lid, onder a, van de wet][ref1]. Deze regels betreffen:


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel29
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '29'
  - number: 29.2.a
    text: de toelating van de aanvrager tot het onderzoek;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel29
  - number: 29.2.b
    text: de wijze van onderzoek; en
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel29
  - number: 29.2.c
    text: de vaartijd.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel29
  - number: '30.1'
    text: |-
      Onze Minister houdt de afgifte van scheepsnummers, bedoeld in [artikel 36, eerste lid, van de wet][ref1], bij in
      een register.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel36
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '36'
  - number: '30.2'
    text: 'Bij regeling van Onze Minister worden nadere regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel30
  - number: 30.2.a
    text: de plaats en wijze waarop het scheepsnummer op het binnenschip wordt aangebracht;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel30
  - number: 30.2.b
    text: de te registreren gegevens;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel30
  - number: 30.2.c
    text: de wijze waarop van een wijziging van de geregistreerde gegevens kennis wordt gegeven;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel30
  - number: 30.2.d
    text: de bescherming van de geregistreerde gegevens;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel30
  - number: 30.2.e
    text: |-
      de wijze waarop de geregistreerde personen kennis kunnen nemen en verbetering kunnen laten aanbrengen van de over
      hen en hun binnenschepen opgenomen gegevens.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel30
  - number: '31'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld betreffende de middelen waarmee de gegevens ten behoeve van
      het toezicht op de naleving van de voorschriften betreffende de vaartijden, de rusttijden en de bemanningssterkte
      worden geregistreerd.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel31
  - number: '32'
    text: |-
      Bij regeling van Onze Minister kunnen in het belang van de statistiek regels worden gesteld omtrent de verstrekking
      van gegevens betreffende het vervoer.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel32
  - number: '33.1'
    text: |-
      Onze Minister wijst de bevoegde autoriteit onderscheidenlijk de bevoegde autoriteiten aan, bedoeld in de
      reglementen ter uitvoering van de Herziene Rijnvaartakte.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel33
  - number: '33.2'
    text: |-
      De bevoegde autoriteit, bedoeld in het eerste lid, is verwerkingsverantwoordelijke voor verwerking van de
      persoonsgegevens als bedoeld in [artikel 39, vierde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel39
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '39'
  - number: 33a
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder: - *ongeldigverklaring van een
      vaardocument:* ongeldigverklaring als bedoeld in [artikel 30, eerste lid, van de wet][ref1];
        - *ontzegging van de vaarbevoegdheid:* ontzegging als bedoeld in
      [artikel 35b, eerste lid, van de Scheepvaartverkeerswet][ref2];
        - *register:* register als bedoeld in [artikel 35a van de Wet][ref3];
        - *vaardocument:* document ten bewijze van de bevoegdheid om op de Nederlandse binnenwateren een schip te voeren,
      waaronder begrepen een daarmee vergelijkbaar document dat is afgegeven door een buitenlandse autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel35b
      [ref3]: https://wetten.overheid.nl/BWBR0023009#Artikel35a
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0004364
        artikel: 35b
      - id: ref3
        bwb_id: BWBR0023009
        artikel: 35a
  - number: 33b
    text: 'In het register worden per betrokkene in samenhang en voor zover van toepassing, de volgende gegevens opgenomen:'
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel33b
  - number: 33b.a
    text: naam, adres, woonplaats, zoals luidend ten tijde van het opnemen;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel33b
  - number: 33b.b
    text: geboortedatum en burgerservicenummer;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel33b
  - number: 33b.c
    text: |-
      de datum van invordering van het vaardocument, bedoeld in de
      [artikelen 35a, eerste lid, van de Scheepvaartverkeerswet][ref1] onderscheidenlijk
      [42, eerste lid, van de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel35a
      [ref2]: https://wetten.overheid.nl/BWBR0023009#Artikel42
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel33b
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: 35a
      - id: ref2
        bwb_id: BWBR0023009
        artikel: '42'
  - number: 33b.d
    text: |-
      de ingangsdatum van intrekking van de ontheffing, bedoeld in [artikel 22, zesde lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel22
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel33b
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '22'
  - number: 33b.e
    text: de ingangsdatum van ontzegging van de vaarbevoegdheid;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel33b
  - number: 33b.f
    text: |-
      de ingangsdatum van ongeldigverklaring van het vaardocument, bedoeld in [artikel 30, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel30
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel33b
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '30'
  - number: 33b.g
    text: de datum waarop de ontzegging van de vaarbevoegdheid zal eindigen;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel33b
  - number: 33b.h
    text: de datum waarop de ongeldigverklaring van het vaardocument zal eindigen.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel33b
  - number: 33d.1
    text: |-
      De officier van justitie, bedoeld in [artikel 35a, tweede lid, van de Scheepvaartverkeerswet][ref1], meldt
      onverwijld aan Onze Minister, ter opneming in het register:


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel35a
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel33d
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: 35a
  - number: 33d.1.a
    text: |-
      de invordering van een vaardocument, bedoeld in [artikel 35a, eerste lid, van de Scheepvaartverkeerswet][ref1],
      tenzij het vaardocument inmiddels is teruggegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel35a
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel33d
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: 35a
  - number: 33d.1.b
    text: |-
      de teruggave van een vaardocument, bedoeld in [artikel 35a, derde lid, van de Scheepvaartverkeerswet][ref1],
      waarvan de datum van invordering in het register is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel35a
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel33d
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: 35a
  - number: 33d.2
    text: Onze Minister registreert onverwijld de ongeldigverklaring van een vaardocument.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel33d
  - number: 33e.1
    text: |-
      Onze Minister meldt onverwijld aan de instanties die zijn belast met de afgifte van vaardocumenten de opneming,
      wijziging of verwijdering van gegevens.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel33e
  - number: 33e.2
    text: |-
      Onze Minister geeft uitsluitend informatie door die de instanties behoeven om afgifte van een vaardocument te
      weigeren onderscheidenlijk niet langer te weigeren.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel33e
  - number: 33f
    text: Onze Minister meldt onverwijld aan Onze Minister van Veiligheid en Justitie een wijziging in het register.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel33f
  - number: 33g.1
    text: |-
      Onze Minister kan informatie uit het register verstrekken aan een ambtenaar die is aangewezen voor opsporing
      of toezicht als bedoeld in de [artikelen 40][ref1] of [45 van de wet][ref2] onderscheidenlijk [32][ref3] of
      [34 van de Scheepvaartverkeerswet][ref4], mits hij zich van de handhavingsbevoegdheid van die ambtenaar heeft
      vergewist.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0023009#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0004364#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0004364#Artikel34
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel33g
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '40'
      - id: ref2
        bwb_id: BWBR0023009
        artikel: '45'
      - id: ref3
        bwb_id: BWBR0004364
        artikel: '32'
      - id: ref4
        bwb_id: BWBR0004364
        artikel: '34'
  - number: 33g.2
    text: |-
      Onze Minister geeft uitsluitend informatie door die een ambtenaar als bedoeld in het eerste lid nodig heeft voor de
      handhaving op dat moment.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel33g
  - number: 33h.1
    text: |-
      Onze Minister verstrekt informatie uit het register aan autoriteiten buiten de Europese Economische Ruimte die
      belast zijn met de handhaving van de vaarbewijsplicht of met de afgifte van vaardocumenten, indien zij schriftelijk
      hebben verklaard de verkregen informatie uitsluitend te gebruiken in het belang van de handhaving van de
      vaarbewijsplicht of van de afgifte van vaardocumenten.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel33h
  - number: 33h.2
    text: |-
      Op de informatieverstrekking, bedoeld in het eerste lid, zijn de [artikelen 33e, tweede lid][ref1], en
      [33g, tweede lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel33e
      [ref2]: https://wetten.overheid.nl/BWBR0025631#Artikel33g
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel33h
    references:
      - id: ref1
        bwb_id: BWBR0025631
        artikel: 33e
        hoofdstuk: 4a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0025631
        artikel: 33g
        hoofdstuk: 4a
        paragraaf: '2'
  - number: 33i
    text: |-
      Informatieverstrekking uit het register of informatieverstrekking aan het register als in dit besluit bedoeld,
      anders dan desgevraagd of incidenteel, kan geschieden met behulp van elektronische koppeling van bestanden, mits
      niet méér informatie wordt verstrekt of verkregen dan nodig is voor het doel van de verstrekking of verkrijging.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel33i
  - number: 33j
    text: 'Onze Minister verwijdert onverwijld de gegevens van een betrokkene uit het register:'
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel33j
  - number: 33j.a
    text: zodra betrokkene na ongeldigverklaring van zijn vaardocument opnieuw over een vaardocument beschikt;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel33j
  - number: 33j.b
    text: zodra betrokkene zijn ingevorderde vaardocument terugontvangt;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel33j
  - number: 33j.c
    text: op de datum waarop de ontzegging van de vaarbevoegdheid eindigt;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel33j
  - number: 33j.d
    text: op de datum waarop de ongeldigverklaring van het vaardocument eindigt;
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel33j
  - number: 33j.e
    text: na diens overlijden, na kennisneming daarvan.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel33j
  - number: 33k
    text: |-
      Onze Minister kan op verzoek van een instantie die vaardocumenten afgeeft of van het openbaar ministerie gegevens
      in het register aanvullen, verbeteren of uit het register verwijderen.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel33k
  - number: 33l
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitwerking van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel33l
  - number: '34'
    text: |-
      Een geldige geneeskundige verklaring als bedoeld in
      [artikel 19, eerste lid, van het Besluit vaartijden en bemanningssterkte binnenvaart][ref1], geldt als een
      geneeskundige verklaring als bedoeld in [artikel 23 van de Binnenvaartwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0023009#Artikel23
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0023009
        artikel: '23'
  - number: '35'
    text: |-
      Een geldige eigen verklaring als bedoeld in [artikel 7 van het Besluit vaarbewijzen binnenvaart][ref1], geldt als
      een eigen verklaring als bedoeld in [artikel 26][ref2] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003526#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0025631#Artikel26
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003526
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0025631
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '36'
    text: |-
      Een geldig groot vaarbewijs als bedoeld in [artikel 16, eerste lid, van de Binnenschepenwet][ref1], geldt als een
      groot vaarbewijs als bedoeld in [artikel 14][ref2] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0025631#Artikel14
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0025631
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '37'
    text: |-
      Een geldig klein vaarbewijs als bedoeld in [artikel 16, tweede lid, van de Binnenschepenwet][ref1], geldt als een
      klein vaarbewijs als bedoeld in [artikel 16][ref2] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0025631#Artikel16
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0025631
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '38'
    text: |-
      Een geldige Rijnvaartverklaring als bedoeld in [artikel 5, eerste lid, van de Wet vervoer binnenvaart][ref1], geldt
      als een Rijnvaartverklaring als bedoeld in [artikel 2, tweede lid, onderdeel a][ref2], van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0025631#Artikel2
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0005319
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0025631
        artikel: '2'
        hoofdstuk: '2'
  - number: '39'
    text: |-
      Een geldig bewijs van toelating als bedoeld in [artikel 6, eerste lid, van de Wet vervoer binnenvaart][ref1], geldt
      als een bewijs van toelating als bedoeld in [artikel 2, tweede lid, onderdeel b][ref2], van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0025631#Artikel2
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005319
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0025631
        artikel: '2'
        hoofdstuk: '2'
  - number: '40'
    text: |-
      Een geldig geëigend document als bedoeld in [artikel 7, onderdeel b, van de Wet vervoer binnenvaart][ref1], geldt
      als een geëigend document als bedoeld in [artikel 2, tweede lid, onderdeel c][ref2], van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0025631#Artikel2
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0005319
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0025631
        artikel: '2'
        hoofdstuk: '2'
  - number: '49'
    text: 'Dit besluit wordt aangehaald als: Binnenvaartbesluit.'
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel49
  - number: '50'
    text: |-
      Dit besluit, de [Binnenvaartwet][ref1], met uitzondering van [hoofdstuk 5, paragraaf 2][ref2] (de
      [artikelen 48 tot en met 50c][ref3]), en de [Invoeringswet Binnenvaartwet][ref4], met uitzondering van de
      [artikelen 24a][ref5] en [27, tweede lid][ref6], treden in werking met ingang van 1 juli 2009.


      [ref1]: https://wetten.overheid.nl/BWBR0023009
      [ref2]: https://wetten.overheid.nl/BWBR0023009#Paragraaf2
      [ref3]: https://wetten.overheid.nl/BWBR0023009#Artikel48
      [ref4]: https://wetten.overheid.nl/BWBR0023849
      [ref5]: https://wetten.overheid.nl/BWBR0023849#Artikel24a
      [ref6]: https://wetten.overheid.nl/BWBR0023849#Artikel27
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0023009
      - id: ref2
        bwb_id: BWBR0023009
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0023009
        artikel: '48'
      - id: ref4
        bwb_id: BWBR0023849
      - id: ref5
        bwb_id: BWBR0023849
        artikel: 24a
      - id: ref6
        bwb_id: BWBR0023849
        artikel: '27'
