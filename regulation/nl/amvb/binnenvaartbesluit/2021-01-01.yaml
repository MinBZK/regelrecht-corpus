preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Verkeer en Waterstaat van 21 mei 2008, nr. CEND/HDJZ/2008-459 sector
    SCH Hoofddirectie Juridische Zaken,

    Gelet op de artikelen 5, tweede lid, 7, tweede lid, 14, vijfde lid, 22, eerste lid, 23, tweede lid, 25, eerste,
    tweede en derde lid, 26, eerste lid, 28, vijfde en zesde lid, 29, derde lid, 30, derde lid, 34, 35, 36, derde
    lid, 37, eerste lid, 38, en 39, vierde lid, van de Binnenvaartwet, artikel 2 van de Wet geluidhinder, de artikelen
    4, eerste lid, onder a, en derde lid, 9, 10, tweede lid, onderdeel b, en 18 van de Scheepvaartverkeerswet, de
    artikelen 8.40, eerste lid, 8.41, derde lid, 8.42, eerste en tweede lid, 8.45, 10.45, tweede lid, 10.46 en 10.48,
    eerste lid van de Wet milieubeheer, artikel 74c van het Wetboek van Strafrecht en de artikelen 2:1, eerste lid,
    2:7, eerste lid, 4:3, tweede en vierde lid en artikel 5:12, eerste en tweede lid, van de Arbeidstijdenwet;

    De Raad van State gehoord (advies van 18 juli 2008 nr. W09.08.0185/IV);

    Gezien het nader rapport van de Staatssecretaris van Verkeer en Waterstaat van 13 maart 2009, nr. CEND/HDJZ-
    2009/102 sector SCH, uitgebracht mede namens Onze Minister van Sociale Zaken en Werkgelegenheid;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt, tenzij anders is bepaald, verstaan onder: - *breedte:* de
      grootste breedte van de scheepsromp in meters, gemeten op de buitenkant van de huidbeplating;
        - *Bunkerstation:* drijvend bouwsel met permanente ligplaats dat is bestemd of wordt gebruikt voor de opslag of
      levering van brandstof voor de voortstuwing van schepen;
        - *diepgang:* de verticale afstand in meters tussen het laagste punt van de scheepsromp, zonder de kiel of andere
      uitstekende delen, en het vlak van de grootste inzinking van de scheepsromp in meters;
        - *duwboot:* schip dat is bestemd of wordt gebruikt voor het duwen van schepen en niet bestemd is voor het
      zelfstandig vervoeren van goederen;
        - *geneeskundig onderzoek:* onderzoek, bedoeld in [artikel 28, eerste lid, van de wet][ref1];
        - *lengte:* grootste lengte van de scheepsromp in meters, het roer en de boegspriet niet inbegrepen;
        - *openbaar vervoersdienst:* voor ieder openstaand personenvervoer;
        - *passagiersschip:* binnenschip, niet zijnde een veerpont of een veerboot, dat is bestemd of wordt gebruikt voor
      het bedrijfsmatig vervoer van meer dan twaalf personen buiten de bemanningsleden;
        - *pleziervaartuig:* schip dat is bestemd of wordt gebruikt voor sportbeoefening of vrijetijdsbesteding;
        - *richtlijn (EU) 2016/1629:* richtlijn (EU) 2016/1629 van het Europees Parlement en de Raad van 14 september 2016
      tot vaststelling van de technische voorschriften voor binnenschepen, tot wijziging van [Richtlijn 2009/100/EG]
      (32009L0100) en tot intrekking van [Richtlijn 2006/87/EG](32006L0087);
        - *Rijnvaartverklaring:* verklaring, bedoeld in artikel 2, derde lid, van de Herziene Rijnvaartakte;
        - *sleepboot:* schip dat is bestemd of wordt gebruikt voor het slepen van schepen en niet is bestemd voor het
      zelfstandig vervoeren van goederen;
        - *sleepduwboot:* schip dat is bestemd of wordt gebruikt voor het slepen of duwen van schepen en niet is bestemd
      voor het zelfstandig vervoeren van goederen;
        - *veerboot:* schip dat is bestemd of wordt gebruikt voor het bedrijfsmatig vervoer van meer dan twaalf personen
      buiten de bemanningsleden alsook van voertuigen op meer dan twee wielen en dat een openbaar vervoersdienst
      onderhoudt tussen plaatsen gelegen aan de Dollard, de Eems, de Waddenzee met inbegrip van de verbindingen met de
      Noordzee, of de Westerschelde en de zeemonding daarvan;
        - *veerpont:* schip, niet zijnde een veerboot, dat is bestemd of wordt gebruikt voor het bedrijfsmatig vervoer van
      een of meer personen buiten de bemanningsleden en dat een openbaar vervoersdienst onderhoudt;
        - *wet:* [Binnenvaartwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0023009
    url: https://wetten.overheid.nl/BWBR0025631/2021-01-01#Artikel1
    references:
