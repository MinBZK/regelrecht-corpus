---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_verbranden_afvalstoffen
regulatory_layer: AMVB
publication_date: '2012-11-13'
valid_from: '2007-07-12'
bwb_id: BWBR0016460
url: https://wetten.overheid.nl/BWBR0016460/2007-07-12
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 17 januari
    2003, nr. MJZ2003001473, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Gelet op artikel 9, achtste lid, van richtlijn nr. 96/61/EG van de Raad van de Europese Gemeenschappen van
    24 september 1996 inzake geïntegreerde preventie en bestrijding van verontreiniging (PbEG L 257), richtlijn
    nr. 2000/76/EG van het Europees Parlement en de Raad van de Europese Unie van 4 december 2000 betreffende de
    verbranding van afval (PbEG L 332), de artikelen 8.5, 8.40, 8.44, 8.45, 12.1, tweede lid, en21.8 van de Wet
    milieubeheer en artikel 13 van de Wet inzake de luchtverontreiniging voorzover het betreft de artikelen 4 en 13;

    De Raad van State gehoord (advies van 14 juli 2003, nr. W08.03.0036/V);

    Gezien het nader rapport van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van
    25 februari 2004, nr. MJZ2004017 834, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel1
  - number: 1.1.a
    text: |-
      afvalverbrandingsinstallatie: technische eenheid waarin al dan niet de opgewekte warmte wordt teruggewonnen en die
      uitsluitend of in hoofdzaak is bestemd voor:
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel1
  - number: 1.1.a.1º
    text: de verbranding door oxidatie van afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel1
  - number: 1.1.a.2º
    text: |-
      een andere thermische behandeling van afvalstoffen dan bedoeld onder 1° ingeval de producten daarvan vervolgens
      worden verbrand, of
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel1
  - number: 1.1.a.3º
    text: de verbranding van producten die voortkomen uit thermische behandeling van afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel1
  - number: 1.1.b
    text: |-
      meeverbrandingsinstallatie: technische eenheid die in hoofdzaak is bestemd voor de opwekking van energie of de
      vervaardiging van producten en waarin afvalstoffen of de producten van thermische behandeling als brandstof worden
      gebruikt of afvalstoffen thermisch worden behandeld ten behoeve van verwijdering;
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel1
  - number: 1.1.c
    text: 'verbrandingsinstallatie: afvalverbrandingsinstallatie of meeverbrandingsinstallatie;'
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel1
  - number: 1.1.d
    text: |-
      gemiddelde netto calorische waarde: op de onderste verbrandingswaarde betrokken hoeveelheid energie die bij de
      verbranding van een bepaalde hoeveelheid brandstof vrijkomt;
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel1
  - number: 1.1.e
    text: |-
      vergunning: vergunning als bedoeld in [artikel 8.1 van de Wet milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 1.1.f
    text: |-
      stookinstallatie: technische eenheid waarin brandstof wordt geoxideerd met als doel de aldus opgewekte warmte te
      gebruiken, niet zijnde een:
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel1
  - number: 1.1.f.1º
    text: |-
      verbrandingsinstallatie waarvan de daarin ontstane verbrandingsproducten rechtstreeks in een productieproces worden
      gebruikt;
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel1
  - number: 1.1.f.2º
    text: zuigermotor;
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel1
  - number: 1.1.f.3º
    text: gasturbine die op offshoreplatforms wordt gebruikt, en
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel1
  - number: 1.1.f.4º
    text: |-
      technische voorziening voor de zuivering van rookgassen door verbranding die niet als autonome stookinstallatie
      wordt geëxploiteerd;
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel1
  - number: 1.1.g
    text: |-
      emissiegrenswaarde: maximale toegestane hoeveelheid emissie in de lucht gedurende een of meer perioden, uitgedrukt
      in gewichtseenheid per volume-eenheid;
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel1
  - number: 1.1.h
    text: |-
      nominale capaciteit: gezamenlijke verbrandingscapaciteit van de ovens waaruit de verbrandingsinstallatie bestaat,
      met in achtneming van de verbrandingswaarde van de afvalstoffen, uitgedrukt in de hoeveelheid afvalstoffen die per
      uur kan worden verbrand;
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel1
  - number: 1.1.i
    text: 'dioxinen en furanen: stoffen als bedoeld in onderdeel 2.15 van de bijlage bij dit besluit;'
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel1
  - number: 1.1.j
    text: 'residuen: afvalstoffen die worden geproduceerd door de verbrandingsinstallatie;'
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel1
  - number: 1.1.k
    text: |-
      energetisch rendement: elektrisch rendement vermeerderd met het equivalente warmterendement, uitgedrukt in
      elektriciteitsequivalenten, waarbij het equivalente warmterendement 0,67 maal het warmterendement is;
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel1
  - number: 1.1.l
    text: |-
      biomassa: producten bestaande uit plantaardige materialen afkomstig uit de land- of bosbouw, die kunnen
      worden gebruikt om de daarin aanwezige energie-inhoud terug te winnen, alsmede afvalstoffen als bedoeld in
      [artikel 2, onder a, onderdelen 1° tot en met 5°][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016460#Artikel2
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0016460
        artikel: '2'
        paragraaf: '1'
  - number: 1.1.m
    text: |-
      afvalstoffenlijst: bijlage bij beschikking nr. 2000/532/EG van de Commissie van de Europese Gemeenschappen van
      3 mei 2000 houdende vaststelling van een lijst van afvalstoffen overeenkomstig artikel 1, onder a), van [Richtlijn
      75/442/EEG](31975L0442) van de Raad van de Europese Gemeenschappen betreffende afvalstoffen en Beschikking 94/904/
      EG van de Raad van de Europese Unie tot vaststelling van een lijst van gevaarlijke afvalstoffen overeenkomstig
      artikel 1, lid 4, van [Richtlijn 91/689/EEG](31991L0689) van de Raad van de Europese Gemeenschappen betreffende
      gevaarlijke afvalstoffen (PbEG L 226/3);
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel1
  - number: 1.1.n
    text: |-
      afvalverbrandingsrichtlijn: [richtlijn nr. 2000/76/EG](32000L0076) van het Europees Parlement en de Raad van de
      Europese Unie van 4 december 2000 betreffende de verbranding van afval (PbEG L 332).
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel1
  - number: '1.2'
    text: In dit besluit wordt onder thermische behandeling mede verstaan pyrolyse, vergassing en plasmaprocessen.
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel1
  - number: '2'
    text: 'Dit besluit is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel2
  - number: 2.a
    text: |-
      verbrandingsinstallaties waarin uitsluitend de volgende afvalstoffen thermisch worden behandeld of producten van
      thermische behandeling van uitsluitend de volgende afvalstoffen worden verbrand:
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel2
  - number: 2.a.1º
    text: plantaardige afvalstoffen die ontstaan zijn bij de uitoefening van land- of bosbouw;
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel2
  - number: 2.a.2º
    text: |-
      plantaardige afvalstoffen die afkomstig zijn van de levensmiddelenindustrie indien de als gevolg van de thermische
      behandeling van zodanige afvalstoffen opgewekte warmte wordt teruggewonnen;
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel2
  - number: 2.a.3º
    text: |-
      vezelachtige afvalstoffen die ontstaan zijn bij de vervaardiging van ruwe pulp of de vervaardiging van papier uit
      pulp, indien zodanige afvalstoffen op de plaats waar zij zijn ontstaan, thermisch worden behandeld en de als gevolg
      daarvan opgewekte warmte wordt teruggewonnen;
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel2
  - number: 2.a.4º
    text: |-
      afvalstoffen bestaande uit hout dat niet als gevolg van een behandeling met houtbeschermingsmiddelen of aanbrenging
      van een beschermingslaag gehalogeneerde organische verbindingen dan wel zware metalen kan bevatten;
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel2
  - number: 2.a.5º
    text: afvalstoffen bestaande uit kurk;
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel2
  - number: 2.a.6º
    text: |-
      kadavers als bedoeld in [Verordening (EG) nr. 1774/2002](32002R1774) van het Europees Parlement en de Raad van
      3 oktober 2002 tot vaststelling van gezondheidsvoorschriften inzake niet voor menselijke consumptie bestemde
      dierlijke bijproducten (PbEG L 273);
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel2
  - number: 2.a.7º
    text: radioactieve afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel2
  - number: 2.a.8º
    text: |-
      afvalstoffen die ontstaan zijn bij de exploratie en exploitatie van olie- en gasbronnen vanaf een installatie in
      zee en die aan boord van die installatie worden verbrand;
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel2
  - number: 2.b
    text: |-
      experimentele verbrandingsinstallaties, bestemd voor onderzoek, ontwikkeling en tests ter verbetering van het
      thermisch behandelingsproces waarin per kalenderjaar minder dan 50 000 kilogram afvalstoffen wordt verwerkt;
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel2
  - number: 2.c
    text: |-
      gasvormige afvalstoffen, met uitzondering van gasvormige afvalstoffen die het resultaat zijn van een thermische
      behandeling van afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel2
  - number: '3'
    text: |-
      Dit besluit is, voorzover het voorschriften betreft die uitsluitend betrekking hebben op gevaarlijke afvalstoffen,
      niet van toepassing op brandbare vloeibare afvalstoffen, waaronder afgewerkte olie, voorzover:
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel3
  - number: 3.a
    text: het vloeipunt minder dan 30°C bedraagt;
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel3
  - number: 3.b
    text: de gemiddelde netto calorische waarde meer dan 30 MJ/kg bedraagt;
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel3
  - number: 3.c
    text: |-
      de concentratie aan extraheerbare organische halogeenverbindingen en polychloorbifenylen de in
      [artikel 2, eerste lid, van het Besluit organisch halogeengehalte van brandstoffen][ref1] genoemde gehalten niet
      overschrijdt;


      [ref1]: https://wetten.overheid.nl/BWBR0004501#Artikel2
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004501
        artikel: '2'
  - number: 3.d
    text: |-
      deze uitsluitend op grond van het gehalte aan alifatische en naftenische koolwaterstoffen, polycyclische aromaten
      of (alk(en)yl)benzenen worden aangemerkt als gevaarlijke afvalstof;
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel3
  - number: 3.e
    text: |-
      het zwavelgehalte gelijk is aan of minder is dan het zwavelgehalte dat op grond van het
      [Besluit zwavelgehalte brandstoffen][ref1] is toegestaan voor gasolie, en


      [ref1]: https://wetten.overheid.nl/BWBR0002939
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002939
  - number: 3.f
    text: het asgehalte lager is dan 0,01 gewichtsprocent.
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel3
  - number: '4'
    text: Het is verboden buiten een inrichting een verbrandingsinstallatie in werking te hebben.
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel4
  - number: '5.1'
    text: |-
      Degene die een inrichting drijft waarbinnen zich een verbrandingsinstallatie bevindt, draagt er zorg voor dat
      afvalstoffen niet in ontvangst worden genomen dan nadat:
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel5
  - number: 5.1.a
    text: |-
      ten minste de massa van de afvalstoffen, voorzover mogelijk per categorie, genoemd in de afvalstoffenlijst, is
      bepaald en geregistreerd;
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel5
  - number: 5.1.b
    text: |-
      voorzover het gevaarlijke afvalstoffen betreft, ten minste van die afvalstoffen monsters zijn genomen en die
      monsters zijn geanalyseerd, tenzij dit niet dienstig is, en
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel5
  - number: 5.1.c
    text: |-
      voorzover het gevaarlijke afvalstoffen betreft, hij van de ontdoener van die afvalstoffen ten minste de volgende
      gegevens heeft ontvangen en daarvan de gegevens, bedoeld onder 1° en 2°, heeft gecontroleerd:
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel5
  - number: 5.1.c.1º
    text: |-
      de gegevens die vereist zijn op grond van [richtlijn nr. 91/689/EEG](31991L0689) van de Raad van de Europese
      Gemeenschappen van 12 december 1991 betreffende gevaarlijke afvalstoffen (PbEG L 377) en, voorzover van toepassing,
      op grond van EG-verordening overbrenging van afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel5
  - number: 5.1.c.2º
    text: |-
      de gegevens die vereist zijn bij of krachtens de [Wet vervoer gevaarlijke stoffen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007606
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007606
  - number: 5.1.c.3º
    text: gegevens over de gevaarlijke eigenschappen van de gevaarlijke afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel5
  - number: 5.1.c.4º
    text: gegevens over de stoffen waarmee zij niet mogen worden gemengd;
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel5
  - number: 5.1.c.5º
    text: gegevens over de bij de behandeling van de gevaarlijke afvalstoffen te treffen voorzorgsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel5
  - number: '5.2'
    text: |-
      De monsters, bedoeld in het eerste lid, onder b, worden ten minste gedurende een maand na het thermisch behandelen
      van de partij waaruit de monsters zijn genomen, bewaard. De omstandigheden waaronder de monsters worden bewaard,
      zijn zodanig dat de fysische en chemische samenstelling ongewijzigd blijft.
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel5
  - number: '5.3'
    text: |-
      De gegevens, bedoeld in het eerste lid, onder a en c, worden ten minste gedurende vijf jaren na het thermisch
      behandelen van de partij waarop de gegevens betrekking hebben, bewaard.
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel5
  - number: '5.4'
    text: |-
      Het bevoegd gezag kan bij zijn beslissing omtrent een vergunning afwijken van het bepaalde in het eerste, tweede
      en derde lid, voorzover het verbrandingsinstallaties betreft waarin uitsluitend afvalstoffen afkomstig uit de
      inrichting waarbinnen de verbrandings-installatie zich bevindt, thermisch worden behandeld.
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel5
  - number: '6'
    text: |-
      Het bevoegd gezag kan bij zijn beslissing omtrent een vergunning afwijken van de voorschriften die in de bijlage
      bij dit besluit zijn opgenomen of in de vergunning nadere eisen stellen met betrekking tot de in de bijlage bij dit
      besluit opgenomen voorschriften, voorzover dit uitdrukkelijk in die bijlage is vermeld.
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel6
  - number: '7'
    text: 'Degene die een inrichting drijft waarbinnen zich een verbrandingsinstallatie bevindt, draagt er zorg voor dat:'
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel7
  - number: 7.a
    text: |-
      de in de bijlage bij dit besluit opgenomen voorschriften worden nageleefd, voorzover van die voorschriften bij de
      beslissing omtrent de vergunning niet is afgeweken, en
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel7
  - number: 7.b
    text: de door het bevoegd gezag krachtens de bijlage bij dit besluit gestelde nadere eisen worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel7
  - number: '8'
    text: |-
      Het bevoegd gezag geeft in de vergunning voor een inrichting waarbinnen zich een verbrandingsinstallatie bevindt
      aan:
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel8
  - number: 8.a
    text: |-
      welke afvalstoffen of voorzover mogelijk categorieën van afvalstoffen overeenkomstig de afvalstoffenlijst thermisch
      mogen worden behandeld;
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel8
  - number: 8.b
    text: de nominale capaciteit van de verbrandingsinstallatie;
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel8
  - number: 8.c
    text: |-
      de slechtst denkbare bedrijfsomstandigheden, bedoeld in voorschrift 2.5, onder b, van de bijlage bij dit besluit,
      tenzij het een inrichting betreft als bedoeld in [artikel 17][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0016460#Artikel17
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0016460
        artikel: '17'
        paragraaf: '5'
  - number: 8.d
    text: de plaats in de inrichting waar de bemonsterings- en meetpunten moeten zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel8
  - number: '9'
    text: |-
      Onverminderd [artikel 8][ref1] geeft het bevoegd gezag in de vergunning voor een inrichting waarbinnen zich een
      verbrandingsinstallatie bevindt waarin gevaarlijke afvalstoffen thermisch worden behandeld aan:


      [ref1]: https://wetten.overheid.nl/BWBR0016460#Artikel8
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0016460
        artikel: '8'
        paragraaf: '3'
  - number: 9.a
    text: |-
      de hoeveelheid van de gevaarlijke afvalstoffen en voorzover mogelijk van de categorieën van gevaarlijke
      afvalstoffen overeenkomstig de afvalstoffenlijst, die thermisch mag worden behandeld;
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel9
  - number: 9.b
    text: |-
      de laagste en de hoogste gemiddelde netto calorische waarde van de gevaarlijke afvalstoffen die thermisch mogen
      worden behandeld, en
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel9
  - number: 9.c
    text: |-
      de maximale concentratiewaarde van verontreinigende stoffen in de gevaarlijke afvalstoffen die thermisch mogen
      worden behandeld.
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel9
  - number: '10.1'
    text: |-
      Het bevoegd gezag kan nadere eisen stellen met betrekking tot de in de onderwerpen, geregeld in de voorschriften
      die overeenkomstig de [artikelen 8][ref1] en [9][ref2] aan een vergunning voor een inrichting zijn of worden
      verbonden, met dien verstande dat daarbij de eisen niet afwijken van de in de bijlage bij dit besluit opgenomen
      voorschriften waarvan ingevolge [artikel 6][ref3] niet kan worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0016460#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0016460#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0016460#Artikel6
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0016460
        artikel: '8'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0016460
        artikel: '9'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0016460
        artikel: '6'
        paragraaf: '2'
  - number: '10.2'
    text: |-
      Het bevoegd gezag kan nadere eisen als bedoeld in het eerste lid wijzigen, voorzover het belang van de bescherming
      van het milieu zich daartegen niet verzet en niet wordt afgeweken van de in de bijlage bij dit besluit opgenomen
      voorschriften waarvan ingevolge [artikel 6][ref1] niet kan worden afgeweken, of intrekken indien het belang van de
      bescherming van het milieu zich daartegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0016460#Artikel6
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0016460
        artikel: '6'
        paragraaf: '2'
  - number: '10.3'
    text: |-
      Het bevoegd gezag draagt er zorg voor dat op 28 december 2005 de voor de datum van inwerkingtreding van dit besluit
      verleende vergunningen voor inrichtingen waarin zich een verbrandingsinstallatie bevindt aan dit besluit voldoen.
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel10
  - number: '15'
    text: |-
      Onze Minister draagt er zorg voor dat zo spoedig mogelijk na de datum van inwerkingtreding van dit besluit
      in de Staatscourant een overzicht wordt geplaatst van de in artikel 12, tweede lid, derde volzin, van de
      afvalverbrandingsrichtlijn bedoelde verbrandingsinstallaties en meeverbrandingsinstallaties.
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel15
  - number: '16.1'
    text: |-
      Een wijziging van de afvalverbrandingsrichtlijn of de richtlijn, bedoeld in [artikel 5, eerste lid, onder c][ref1],
      gaat voor de toepassing van dit besluit gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn
      uitvoering moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0016460#Artikel5
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0016460
        artikel: '5'
        paragraaf: '2'
  - number: '16.2'
    text: |-
      Een wijziging van de afvalstoffenlijst gaat voor de toepassing van dit besluit gelden met ingang van de dag waarop
      aan die wijziging uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt
      bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel16
  - number: '17'
    text: 'Ingetrokken worden:'
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel17
  - number: 17.a
    text: |-
      het [Besluit luchtemissies afvalverbranding][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005836
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005836
  - number: 17.b
    text: |-
      de [Regeling verbranden gevaarlijke afvalstoffen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009549
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0009549
  - number: '18'
    text: |-
      In afwijking van [artikel 17][ref1] blijven het [Besluit luchtemissies afvalverbranding][ref2],
      het [Besluit emissie-eisen stookinstallaties milieubeheer A][ref3], het
      [Besluit emissie-eisen stookinstallaties milieubeheer B][ref4] en de
      [Regeling verbranden gevaarlijke afvalstoffen][ref5], zoals ze luidden voor de datum van inwerkingtreding van dit
      besluit, tot 28 december 2005 van kracht voor inrichtingen waarvoor voor de datum van inwerkingtreding van dit
      besluit een vergunning is verleend voor het in werking hebben van:


      [ref1]: https://wetten.overheid.nl/BWBR0016460#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0005836
      [ref3]: https://wetten.overheid.nl/BWBR0004147
      [ref4]: https://wetten.overheid.nl/BWBR0004833
      [ref5]: https://wetten.overheid.nl/BWBR0009549
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0016460
        artikel: '17'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005836
      - id: ref3
        bwb_id: BWBR0004147
      - id: ref4
        bwb_id: BWBR0004833
      - id: ref5
        bwb_id: BWBR0009549
  - number: 18.a
    text: een afvalverbrandingsinstallatie die voor 29 december 2003 in werking is gebracht, of
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel18
  - number: 18.b
    text: een meeverbrandingsinstallatie die voor 29 december 2004 in werking is of zal worden gebracht.
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel18
  - number: '19'
    text: |-
      Dit besluit wordt eerst van toepassing op inrichtingen als bedoeld in [artikel 18][ref1] met ingang van 28 december
      2005.


      [ref1]: https://wetten.overheid.nl/BWBR0016460#Artikel18
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0016460
        artikel: '18'
        paragraaf: '5'
  - number: '20'
    text: |-
      Dit besluit treedt in werking met ingang van de dag waarop vier weken zijn verstreken sedert de dag van uitgifte
      van het Staatsblad waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel20
  - number: '21'
    text: 'Dit besluit wordt aangehaald als: Besluit verbranden afvalstoffen.'
    url: https://wetten.overheid.nl/BWBR0016460/2007-07-12#Artikel21
