articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;

      b. werknemer:

      1°. de werknemer, bedoeld in [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1];

      2°. degene, die persoonlijk arbeid verricht voor een ander, tenzij hij dergelijke arbeid in de regel voor meer dan
      twee anderen verricht of hij zich door meer dan twee andere personen, niet zijnde zijn echtgenoot of geregistreerde
      partner of bij hem inwonende bloedverwanten of aanverwanten of pleegkinderen, laat bijstaan of deze arbeid voor hem
      slechts een bijkomstige werkzaamheid is;

      c. werkgever:

      1°. de werkgever, bedoeld in [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref2];

      2°. de natuurlijke of rechtspersoon, voor wie de onder b sub 2°. genoemde arbeid wordt verricht;

      d. arbeidsverhouding: de rechtsbetrekking tussen werkgever en werknemer;

      e. loon: de vergoeding van de werkgever aan de werknemer ter zake van de arbeid;

      f. dringende reden voor de werkgever: daden, eigenschappen of gedragingen van de werknemer, welke ten gevolge
      hebben dat van de werkgever redelijkerwijze niet kan worden gevergd de arbeidsverhouding te laten voortduren;

      g. Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel610
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
