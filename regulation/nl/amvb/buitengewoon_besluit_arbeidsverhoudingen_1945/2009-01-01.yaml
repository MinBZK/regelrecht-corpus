        artikel: '8'
  - number: '10'
    text: |-
      1 De werkgever, die ten gevolge van tijdelijke stilstand van of slapte in de onderneming niet voldoende
      werkgelegenheid voor zijn werknemers heeft, kan een wachtgeldregeling voor hen treffen. Deze wachtgeldregeling
      behoeft de toestemming van Onze Minister. In de kosten van de wachtgeldregeling kan de werkgever onder bepaalde
      voorwaarden van Overheidswege een tegemoetkoming worden verleend.

      2 Ter uitvoering van het bepaalde in het vorige lid worden door Onze Minister nadere bepalingen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002014/2009-01-01#Artikel10
  - number: '30'
    text: |-
      Burgerlijke rechtsvorderingen van werkgevers of werknemers, welke voortvloeien uit niet-naleving van het bepaalde
      bij of krachtens dit besluit, worden geacht betrekkelijk te zijn tot een arbeidsovereenkomst. De artikelen 131 en
      241 van Boek 2 (Rechtspersonen) van het Burgerlijk Wetboek blijven echter op deze vorderingen van toepassing.
    url: https://wetten.overheid.nl/BWBR0002014/2009-01-01#Artikel30
  - number: '32'
    text: |-
      Onze Minister kan bevoegdheden, welke krachtens dit besluit aan hem of aan het Uitvoeringsinstituut
      werknemersverzekeringen toekomen, overdragen aan organisaties uit het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0002014/2009-01-01#Artikel32
  - number: '33'
    text: |-
      1 Dit besluit, ten aanzien waarvan de bevoegdheid, bedoeld in artikel 9, tweede lid, van het Besluit op den
      bijzonderen staat van beleg niet kan worden uitgeoefend, treedt in werking met ingang van 15 oktober 1945.

      2 Met ingang van die datum vervalt het Buitengewoon Besluit Arbeidsverhoudingen (Besluit van 17 juli 1944,
      *Staatsblad* no. E 52, laatstelijk gewijzigd bij besluit van 29 december 1944, *Staatsblad* no. E 157).

      Dit besluit kan worden aangehaald onder de titel: Buitengewoon Besluit Arbeidsverhoudingen 1945.
    url: https://wetten.overheid.nl/BWBR0002014/2009-01-01#Artikel33
