        artikel: '10'
  - number: '9'
    text: |-
      1 Een opzegging zonder de op grond van [artikel 6][ref1] vereiste toestemming is vernietigbaar.

      2 Handelingen in strijd met [artikel 8, eerste lid][ref2], zijn vernietigbaar.

      3 De werknemer kan gedurende zes maanden een beroep op deze vernietigingsgrond doen.


      [ref1]: https://wetten.overheid.nl/BWBR0002014#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002014#Artikel8
    url: https://wetten.overheid.nl/BWBR0002014/2009-01-01#Artikel9
