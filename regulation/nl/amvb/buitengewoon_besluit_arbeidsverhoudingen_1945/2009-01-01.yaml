  - number: '2'
    text: |-
      1 Dit besluit is niet van toepassing op de arbeidsverhouding van:

      a. werknemers bij een publiekrechtelijk lichaam;

      b. onderwijzend en docerend personeel, werkzaam aan onderwijsinrichtingen, staande onder beheer van een natuurlijk
      of rechtspersoon;

      c. personen, die een geestelijk ambt bekleden;

      d. de werknemer die doorgaans op minder dan vier dagen per week uitsluitend of nagenoeg uitsluitend diensten
      verricht ten behoeve van het huishouden van de natuurlijke persoon tot wie hij in dienstbetrekking staat;

      2 Voor de toepassing van het eerste lid, onderdeel d, wordt onder het verrichten van diensten ten behoeve van een
      huishouden mede verstaan het verlenen van zorg aan de leden van dat huishouden.

      3 Onze Minister kan voorts bepalen, dat dit besluit of sommige artikelen van dit besluit niet van toepassing zijn
      op de arbeidsverhouding van door hem aangewezen werknemers of groepen van werknemers.
    url: https://wetten.overheid.nl/BWBR0002014/2009-01-01#Artikel2
  - number: '3'
    text: |-
      Voor zover in dit besluit wordt afgeweken van bestaande wetten en verordeningen, daaronder
      begrepen de afdelingen 1 tot en met 9 van titel 10 van Boek 7 van het Burgerlijk Wetboek,
      de Arbeidsgeschillenwet 1923, de [Wet op de collectieve arbeidsovereenkomst][ref1] en de
      __REF001___________________________________________________________________________________________________________
      ______, is dit besluit van kracht, zolang een nadere wettelijke regeling niet tot stand is gekomen.


