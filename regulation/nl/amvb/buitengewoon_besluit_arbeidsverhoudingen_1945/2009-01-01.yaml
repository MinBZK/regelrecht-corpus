  - number: '6'
    text: |-
      1 De werkgever behoeft voor de opzegging van de arbeidsverhouding voorafgaande toestemming van het
      Uitvoeringsinstituut werknemersverzekeringen.

      2 De werkgever behoeft deze toestemming niet:

      a. indien de opzegging onverwijld geschiedt om een dringende reden, onder gelijktijdige mededeling van die reden
      aan de werknemer ;

      b. tijdens de proeftijd;

      c. indien de opzegging geschiedt ten gevolge van faillissement van de werkgever of toepassing ten aanzien van hem
      de schuldsaneringsregeling natuurlijke personen.

      3 Bij ministeriële regeling worden regels gesteld met betrekking tot de toestemming als bedoeld in het eerste lid.

      4 Alvorens een beslissing inzake het verlenen van toestemming krachtens het eerste lid wordt genomen, hoort het
      Uitvoeringsinstituut werknemersverzekeringen vertegenwoordigers van de in aanmerking komende organisaties van
      werkgevers en werknemers, behoudens in bij ministeriële regeling bepaalde gevallen.

      5 Onze Minister kan het Uitvoeringsinstituut werknemersverzekeringen aanwijzingen geven met betrekking tot de
      uitoefening van de bevoegdheid tot het verlenen van toestemming als bedoeld in het eerste lid. Hij treedt daarbij
      niet in de besluitvorming in individuele gevallen.

      6 Bij ministeriële regeling kunnen voorzieningen worden getroffen voor het geval het Uitvoeringsinstituut
      werknemersverzekeringen zijn uit dit artikel voortvloeiende verplichtingen niet naar behoren nakomt.

      7 Het Uitvoeringsinstituut werknemersverzekeringen brengt aan Onze Minister verslag uit over de wijze waarop de
      bevoegdheid tot het verlenen van de toestemming is uitgeoefend. Bij ministeriële regeling worden hieromtrent nadere
      regels gesteld.

      8 Het Uitvoeringsinstituut werknemersverzekeringen is verplicht aan Onze Minister desgevraagd binnen een daartoe
      gestelde termijn en op de aangegeven wijze kosteloos alle opgaven te verstrekken betreffende de wijze waarop de
      bevoegdheid tot het verlenen van de toestemming is uitgeoefend.

      9 Van het eerste lid kan bij ministeriële regeling voor bepaalde werknemers of groepen van werknemers
      voorwaardelijk of onvoorwaardelijk ontheffing of vrijstelling worden verleend.

      10 Tegen beslissingen van het Uitvoeringsinstituut werknemersverzekeringen inzake het verlenen van toestemming op
      grond van het eerste lid staat geen beroep open bij het College van Beroep voor het Bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0002014/2009-01-01#Artikel6
  - number: '8'
    text: |-
      1 Het is de werkgever verboden de werktijd van de werknemer op minder dan 48 uur per week te stellen of gesteld
      te houden.

      2 Het bepaalde in het vorige lid geldt niet:

      a. ten aanzien van die werknemers, voor wier werkzaamheden de normale werktijd vóór 10 mei 1940 op een geringer
      aantal uren per week placht te zijn vastgesteld, zoals voor steenhouwers, kantoorbedienden, avondboekhouders,
      schoonmaaksters, stokers van centrale verwarmingen en dergelijke personen, mits hun loon als gevolg der
      werktijdverkorting niet daalt beneden het gebruikelijke bedrag;

      b. ten aanzien van die werknemers, wier week- of maandloon op een vast bedrag is vastgesteld en niet daaronder
      daalt bij de werktijdverkorting;

      c. voor de tijd, gedurende welke een door Onze Minister goedgekeurde wachtgeldregeling, als bedoeld in
      [artikel 10][ref1], van kracht is, ten aanzien van de onder die wachtgeldregeling vallende werknemers.

      3 Van het bepaalde in het eerste lid kan voorts door of vanwege Onze Minister voor bepaalde werknemers of groepen
      van werknemers voorwaardelijk of onvoorwaardelijk ontheffing worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002014#Artikel10
    url: https://wetten.overheid.nl/BWBR0002014/2009-01-01#Artikel8
