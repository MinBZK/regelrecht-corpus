$id: buitengewoon_besluit_arbeidsverhoudingen_1945
regulatory_layer: AMVB
publication_date: '2014-06-24'
valid_from: '2015-07-01'
bwb_id: BWBR0002014
url: https://wetten.overheid.nl/BWBR0002014/2015-07-01
preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onzen Minister van Sociale Zaken van 5 September 1945, n°. 4600, afdeeling Arbeid II;

    Overwegende, dat het wenschelijk is gebleken, in afwachting van het tot stand komen van een nadere wettelijke
    regeling, het Buitengewoon Besluit Arbeidsverhoudingen (Staatsblad 1944, n°. E 52), laatstelijk gewijzigd bij Ons
    besluit van 29 December 1944 (Staatsblad n°. E 157), te herzien en opnieuw vast te stellen;

    Den Raad van State gehoord (advies van 25 September 1945, n°. 16);

    Gezien het nader rapport van Onzen voornoemden Minister van 2 October 1945, n°. 4827, afdeeling Arbeid II;

    Hebben goedgevonden en verstaan:

    vast te stellen de navolgende bepalingen
  url: https://wetten.overheid.nl/BWBR0002014/2015-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002014/2015-07-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0002014/2015-07-01#Artikel1
  - number: 1.b
    text: 'werknemer:'
    url: https://wetten.overheid.nl/BWBR0002014/2015-07-01#Artikel1
  - number: 1.b.1°
    text: |-
      de werknemer, bedoeld in [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
    url: https://wetten.overheid.nl/BWBR0002014/2015-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '610'
  - number: 1.b.2°
    text: |-
      degene, die persoonlijk arbeid verricht voor een ander, tenzij hij dergelijke arbeid in de regel voor meer dan
      twee anderen verricht of hij zich door meer dan twee andere personen, niet zijnde zijn echtgenoot of geregistreerde
      partner of bij hem inwonende bloedverwanten of aanverwanten of pleegkinderen, laat bijstaan of deze arbeid voor hem
      slechts een bijkomstige werkzaamheid is;
    url: https://wetten.overheid.nl/BWBR0002014/2015-07-01#Artikel1
  - number: 1.c
    text: 'werkgever:'
    url: https://wetten.overheid.nl/BWBR0002014/2015-07-01#Artikel1
  - number: 1.c.1°
    text: |-
      de werkgever, bedoeld in [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
    url: https://wetten.overheid.nl/BWBR0002014/2015-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '610'
  - number: 1.c.2°
    text: de natuurlijke of rechtspersoon, voor wie de onder b sub 2°. genoemde arbeid wordt verricht;
    url: https://wetten.overheid.nl/BWBR0002014/2015-07-01#Artikel1
  - number: 1.d
    text: 'arbeidsverhouding: de rechtsbetrekking tussen werkgever en werknemer;'
    url: https://wetten.overheid.nl/BWBR0002014/2015-07-01#Artikel1
  - number: 1.e
    text: 'loon: de vergoeding van de werkgever aan de werknemer ter zake van de arbeid;'
    url: https://wetten.overheid.nl/BWBR0002014/2015-07-01#Artikel1
  - number: 1.f
    text: |-
      dringende reden voor de werkgever: daden, eigenschappen of gedragingen van de werknemer, welke ten gevolge hebben
      dat van de werkgever redelijkerwijze niet kan worden gevergd de arbeidsverhouding te laten voortduren;
    url: https://wetten.overheid.nl/BWBR0002014/2015-07-01#Artikel1
  - number: 1.g
    text: |-
      Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0002014/2015-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: '2.1'
    text: 'Dit besluit is niet van toepassing op de arbeidsverhouding van:'
    url: https://wetten.overheid.nl/BWBR0002014/2015-07-01#Artikel2
  - number: 2.1.a
    text: werknemers bij een publiekrechtelijk lichaam;
    url: https://wetten.overheid.nl/BWBR0002014/2015-07-01#Artikel2
  - number: 2.1.b
    text: |-
      onderwijzend en docerend personeel, werkzaam aan onderwijsinrichtingen, staande onder beheer van een natuurlijk
      of rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0002014/2015-07-01#Artikel2
  - number: 2.1.c
    text: personen, die een geestelijk ambt bekleden;
    url: https://wetten.overheid.nl/BWBR0002014/2015-07-01#Artikel2
  - number: 2.1.d
    text: |-
      de werknemer die doorgaans op minder dan vier dagen per week uitsluitend of nagenoeg uitsluitend diensten verricht
      ten behoeve van het huishouden van de natuurlijke persoon tot wie hij in dienstbetrekking staat;
    url: https://wetten.overheid.nl/BWBR0002014/2015-07-01#Artikel2
  - number: '2.2'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel d, wordt onder het verrichten van diensten ten behoeve van een
      huishouden mede verstaan het verlenen van zorg aan de leden van dat huishouden.
    url: https://wetten.overheid.nl/BWBR0002014/2015-07-01#Artikel2
  - number: '2.3'
    text: |-
      Onze Minister kan voorts bepalen, dat dit besluit of sommige artikelen van dit besluit niet van toepassing zijn op
      de arbeidsverhouding van door hem aangewezen werknemers of groepen van werknemers.
    url: https://wetten.overheid.nl/BWBR0002014/2015-07-01#Artikel2
  - number: '8.1'
    text: |-
      Het is de werkgever verboden de werktijd van de werknemer op minder dan 48 uur per week te stellen of gesteld te
      houden.
    url: https://wetten.overheid.nl/BWBR0002014/2015-07-01#Artikel8
  - number: '8.2'
    text: 'Het bepaalde in het vorige lid geldt niet:'
    url: https://wetten.overheid.nl/BWBR0002014/2015-07-01#Artikel8
  - number: 8.2.a
    text: |-
      ten aanzien van die werknemers, voor wier werkzaamheden de normale werktijd vóór 10 mei 1940 op een geringer
      aantal uren per week placht te zijn vastgesteld, zoals voor steenhouwers, kantoorbedienden, avondboekhouders,
      schoonmaaksters, stokers van centrale verwarmingen en dergelijke personen, mits hun loon als gevolg der
      werktijdverkorting niet daalt beneden het gebruikelijke bedrag;
    url: https://wetten.overheid.nl/BWBR0002014/2015-07-01#Artikel8
  - number: 8.2.b
    text: |-
      ten aanzien van die werknemers, wier week- of maandloon op een vast bedrag is vastgesteld en niet daaronder daalt
      bij de werktijdverkorting;
    url: https://wetten.overheid.nl/BWBR0002014/2015-07-01#Artikel8
  - number: 8.2.c
    text: |-
      voor de tijd, gedurende welke een door Onze Minister goedgekeurde wachtgeldregeling, als bedoeld in
      [artikel 10][ref1], van kracht is, ten aanzien van de onder die wachtgeldregeling vallende werknemers.


      [ref1]: https://wetten.overheid.nl/BWBR0002014#Artikel10
    url: https://wetten.overheid.nl/BWBR0002014/2015-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002014
        artikel: '10'
  - number: '8.3'
    text: |-
      Van het bepaalde in het eerste lid kan voorts door of vanwege Onze Minister voor bepaalde werknemers of groepen van
      werknemers voorwaardelijk of onvoorwaardelijk ontheffing worden verleend.
    url: https://wetten.overheid.nl/BWBR0002014/2015-07-01#Artikel8
