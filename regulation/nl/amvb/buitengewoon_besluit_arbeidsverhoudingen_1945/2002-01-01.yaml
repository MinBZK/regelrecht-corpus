$id: buitengewoon_besluit_arbeidsverhoudingen_1945
regulatory_layer: AMVB
publication_date: '2014-06-24'
valid_from: '2002-01-01'
bwb_id: BWBR0002014
url: https://wetten.overheid.nl/BWBR0002014/2002-01-01
preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onzen Minister van Sociale Zaken van 5 September 1945, n°. 4600, afdeeling Arbeid II;

    Overwegende, dat het wenschelijk is gebleken, in afwachting van het tot stand komen van een nadere wettelijke
    regeling, het Buitengewoon Besluit Arbeidsverhoudingen (Staatsblad 1944, n°. E 52), laatstelijk gewijzigd bij Ons
    besluit van 29 December 1944 (Staatsblad n°. E 157), te herzien en opnieuw vast te stellen;

    Den Raad van State gehoord (advies van 25 September 1945, n°. 16);

    Gezien het nader rapport van Onzen voornoemden Minister van 2 October 1945, n°. 4827, afdeeling Arbeid II;

    Hebben goedgevonden en verstaan:

    vast te stellen de navolgende bepalingen
  url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel1
  - number: 1.b
    text: 'werknemer:'
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel1
  - number: 1.b.1°
    text: |-
      de werknemer, bedoeld in [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '610'
  - number: 1.b.2°
    text: |-
      degene, die persoonlijk arbeid verricht voor een ander, tenzij hij dergelijke arbeid in de regel voor meer dan
      twee anderen verricht of hij zich door meer dan twee andere personen, niet zijnde zijn echtgenoot of geregistreerde
      partner of bij hem inwonende bloedverwanten of aanverwanten of pleegkinderen, laat bijstaan of deze arbeid voor hem
      slechts een bijkomstige werkzaamheid is;
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel1
  - number: 1.c
    text: 'werkgever:'
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel1
  - number: 1.c.1°
    text: |-
      de werkgever, bedoeld in [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '610'
  - number: 1.c.2°
    text: |-
      de natuurlijke of rechtspersoon, voor wie [de onder ][ref1] sub 2°. genoemde arbeid wordt verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0002014#Artikel1
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002014
        artikel: '1'
  - number: 1.d
    text: 'arbeidsverhouding: de rechtsbetrekking tussen werkgever en werknemer;'
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel1
  - number: 1.e
    text: 'loon: de vergoeding van de werkgever aan de werknemer ter zake van de arbeid;'
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel1
  - number: 1.f
    text: |-
      dringende reden voor de werkgever: daden, eigenschappen of gedragingen van de werknemer, welke ten gevolge hebben
      dat van de werkgever redelijkerwijze niet kan worden gevergd de arbeidsverhouding te laten voortduren;
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel1
  - number: 1.g
    text: |-
      Centrale organisatie werk en inkomen: de Centrale organisatie werk en inkomen, genoemd in
      [hoofdstuk 4 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '4'
  - number: '2.1'
    text: 'Dit besluit is niet van toepassing op de arbeidsverhouding van:'
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel2
  - number: 2.1.a
    text: werknemers bij een publiekrechtelijk lichaam;
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel2
  - number: 2.1.b
    text: |-
      onderwijzend en docerend personeel, werkzaam aan onderwijsinrichtingen, staande onder beheer van een natuurlijk
      of rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel2
  - number: 2.1.c
    text: personen, die een geestelijk ambt bekleden;
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel2
  - number: 2.1.d
    text: |-
      werknemers die doorgaans op minder dan drie dagen per week uitsluitend of hoofdzakelijk huishoudelijke of
      persoonlijke diensten in de huishouding van een natuurlijk persoon verrichten.
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel2
  - number: '2.2'
    text: |-
      Onze Minister kan voorts bepalen, dat dit besluit of sommige artikelen van dit besluit niet van toepassing zijn op
      de arbeidsverhouding van door hem aangewezen werknemers of groepen van werknemers.
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel2
  - number: '3'
    text: |-
      Voor zover in dit besluit wordt afgeweken van bestaande wetten en verordeningen, daaronder
      begrepen de afdelingen 1 tot en met 9 van titel 10 van Boek 7 van het Burgerlijk Wetboek,
      de Arbeidsgeschillenwet 1923, de [Wet op de collectieve arbeidsovereenkomst][ref1] en de
      __REF001___________________________________________________________________________________________________________
      ______, is dit besluit van kracht, zolang een nadere wettelijke regeling niet tot stand is gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001937
      [ref2]: https://wetten.overheid.nl/BWBR0001987
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001937
      - id: ref2
        bwb_id: BWBR0001987
  - number: '6.1'
    text: |-
      De werkgever behoeft voor de opzegging van de arbeidsverhouding voorafgaande toestemming van de Centrale
      organisatie werk en inkomen.
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel6
  - number: '6.2'
    text: 'De werkgever behoeft deze toestemming niet:'
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel6
  - number: 6.2.a
    text: |-
      indien de opzegging onverwijld geschiedt om een dringende reden, onder gelijktijdige mededeling van die reden aan
      de werknemer ;
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel6
  - number: 6.2.b
    text: tijdens de proeftijd;
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel6
  - number: 6.2.c
    text: |-
      indien de opzegging geschiedt ten gevolge van faillissement van de werkgever of toepassing ten aanzien van hem de
      schuldsaneringsregeling natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel6
  - number: '6.3'
    text: Bij ministeriële regeling worden regels gesteld met betrekking tot de toestemming als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel6
  - number: '6.4'
    text: |-
      Alvorens een beslissing inzake het verlenen van toestemming krachtens het eerste lid wordt genomen, hoort de
      Centrale organisatie werk en inkomen vertegenwoordigers van de in aanmerking komende organisaties van werkgevers en
      werknemers, behoudens in bij ministeriële regeling bepaalde gevallen.
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel6
  - number: '6.5'
    text: |-
      Onze Minister kan de Centrale organisatie werk en inkomen aanwijzingen geven met betrekking tot de uitoefening
      van de bevoegdheid tot het verlenen van toestemming als bedoeld in het eerste lid. Hij treedt daarbij niet in de
      besluitvorming in individuele gevallen.
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel6
  - number: '6.6'
    text: |-
      Bij ministeriële regeling kunnen voorzieningen worden getroffen voor het geval de Centrale organisatie werk en
      inkomen zijn uit dit artikel voortvloeiende verplichtingen niet naar behoren nakomt.
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel6
  - number: '6.7'
    text: |-
      De Centrale organisatie werk en inkomen brengt aan Onze Minister verslag uit over de wijze waarop de bevoegdheid
      tot het verlenen van de toestemming is uitgeoefend. Bij ministeriële regeling worden hieromtrent nadere regels
      gesteld.
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel6
  - number: '6.8'
    text: |-
      De Centrale organisatie werk en inkomen is verplicht aan Onze Minister desgevraagd binnen een daartoe gestelde
      termijn en op de aangegeven wijze kosteloos alle opgaven te verstrekken betreffende de wijze waarop de bevoegdheid
      tot het verlenen van de toestemming is uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel6
  - number: '6.9'
    text: |-
      Van het eerste lid kan bij ministeriële regeling voor bepaalde werknemers of groepen van werknemers voorwaardelijk
      of onvoorwaardelijk ontheffing of vrijstelling worden verleend.
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel6
  - number: '6.10'
    text: |-
      Tegen beslissingen van de Centrale organisatie werk en inkomen inzake het verlenen van toestemming op grond van het
      eerste lid staat geen beroep open bij het College van Beroep voor het Bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel6
  - number: '8.1'
    text: |-
      Het is de werkgever verboden de werktijd van de werknemer op minder dan 48 uur per week te stellen of gesteld te
      houden.
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel8
  - number: '8.2'
    text: 'Het bepaalde in het vorige lid geldt niet:'
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel8
  - number: 8.2.a
    text: |-
      ten aanzien van die werknemers, voor wier werkzaamheden de normale werktijd vóór 10 mei 1940 op een geringer
      aantal uren per week placht te zijn vastgesteld, zoals voor steenhouwers, kantoorbedienden, avondboekhouders,
      schoonmaaksters, stokers van centrale verwarmingen en dergelijke personen, mits hun loon als gevolg der
      werktijdverkorting niet daalt beneden het gebruikelijke bedrag;
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel8
  - number: 8.2.b
    text: |-
      ten aanzien van die werknemers, wier week- of maandloon op een vast bedrag is vastgesteld en niet daaronder daalt
      bij de werktijdverkorting;
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel8
  - number: 8.2.c
    text: |-
      voor de tijd, gedurende welke een door Onze Minister goedgekeurde wachtgeldregeling, als bedoeld in
      [artikel 10][ref1], van kracht is, ten aanzien van de onder die wachtgeldregeling vallende werknemers.


      [ref1]: https://wetten.overheid.nl/BWBR0002014#Artikel10
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002014
        artikel: '10'
  - number: '8.3'
    text: |-
      Van het bepaalde in het eerste lid kan voorts door of vanwege Onze Minister voor bepaalde werknemers of groepen van
      werknemers voorwaardelijk of onvoorwaardelijk ontheffing worden verleend.
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel8
  - number: '9.1'
    text: |-
      Een opzegging zonder de op grond van [artikel 6][ref1] vereiste toestemming is vernietigbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002014#Artikel6
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002014
        artikel: '6'
  - number: '9.2'
    text: |-
      Handelingen in strijd met [artikel 8, eerste lid][ref1], zijn vernietigbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002014#Artikel8
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002014
        artikel: '8'
  - number: '9.3'
    text: De werknemer kan gedurende zes maanden een beroep op deze vernietigingsgrond doen.
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel9
  - number: '10.1'
    text: |-
      De werkgever, die ten gevolge van tijdelijke stilstand van of slapte in de onderneming niet voldoende
      werkgelegenheid voor zijn werknemers heeft, kan een wachtgeldregeling voor hen treffen. Deze wachtgeldregeling
      behoeft de toestemming van Onze Minister. In de kosten van de wachtgeldregeling kan de werkgever onder bepaalde
      voorwaarden van Overheidswege een tegemoetkoming worden verleend.
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel10
  - number: '10.2'
    text: Ter uitvoering van het bepaalde in het vorige lid worden door Onze Minister nadere bepalingen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel10
  - number: '30'
    text: |-
      Burgerlijke rechtsvorderingen van werkgevers of werknemers, welke voortvloeien uit niet-naleving van het bepaalde
      bij of krachtens dit besluit, worden geacht betrekkelijk te zijn tot een arbeidsovereenkomst. De artikelen 131 en
      241 van Boek 2 (Rechtspersonen) van het Burgerlijk Wetboek blijven echter op deze vorderingen van toepassing.
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel30
  - number: '32'
    text: |-
      Onze Minister kan bevoegdheden, welke krachtens dit besluit aan hem of aan de Centrale organisatie werk en inkomen
      toekomen, overdragen aan organisaties uit het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel32
  - number: '33.1'
    text: |-
      Dit besluit, ten aanzien waarvan de bevoegdheid, bedoeld in artikel 9, tweede lid, van het Besluit op den
      bijzonderen staat van beleg niet kan worden uitgeoefend, treedt in werking met ingang van 15 oktober 1945.
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel33
  - number: '33.2'
    text: |-
      Met ingang van die datum vervalt het Buitengewoon Besluit Arbeidsverhoudingen (Besluit van 17 juli 1944,
      *Staatsblad* no. E 52, laatstelijk gewijzigd bij besluit van 29 december 1944, *Staatsblad* no. E 157). Dit besluit
      kan worden aangehaald onder de titel: Buitengewoon Besluit Arbeidsverhoudingen 1945.
    url: https://wetten.overheid.nl/BWBR0002014/2002-01-01#Artikel33
