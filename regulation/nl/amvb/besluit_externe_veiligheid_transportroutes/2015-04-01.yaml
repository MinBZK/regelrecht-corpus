articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *basisnetafstand:* afstand tussen de
      krachtens [artikel 14, eerste lid, van de Wet vervoer gevaarlijke stoffen][ref1] voor een basisnetroute aangewezen
      plaatsen waar het plaatsgebonden risico ten hoogste 10-6 per jaar mag zijn;
        - *basisnetroute:* krachtens [artikel 13 van de Wet vervoer gevaarlijke stoffen][ref2] aangewezen weg, binnenwater
      of hoofdspoorweg;
        - *beheersverordening:* beheersverordening als bedoeld in
      [artikel 3.38, eerste lid, van de Wet ruimtelijke ordening][ref3];
        - *beperkt kwetsbaar object:* object als bedoeld in
      [artikel 1, eerste lid, onderdeel b, van het Besluit externe veiligheid inrichtingen][ref4];
        - *bestemmingsplan:* bestemmingsplan als bedoeld in [artikel 3.1 van de Wet ruimtelijke ordening][ref5];
        - *geprojecteerd (beperkt) kwetsbaar object:* nog niet aanwezig (beperkt) kwetsbaar object dat op grond van het
      voor het desbetreffende gebied geldende bestemmingsplan toelaatbaar is;
        - *gevaarlijke stof:* gevaarlijke stof als bedoeld in
      [artikel 1, eerste lid, van de Wet vervoer gevaarlijke stoffen][ref6];
        - *grenswaarde:* grenswaarde als bedoeld in [artikel 5.1, derde lid, van de Wet milieubeheer][ref7] ten aanzien van
      het niveau van het plaatsgebonden risico;
        - *groepsrisico:* cumulatieve kansen per jaar per kilometer transportroute dat tien of meer personen in het
      invloedsgebied van een transportroute overlijden als rechtstreeks gevolg van een ongewoon voorval op die
      transportroute waarbij een gevaarlijke stof betrokken is;
        - *invloedsgebied:* gebied waarin personen worden meegeteld voor de berekening van het groepsrisico van een weg,
      spoorweg of binnenwater tot de grens waarop de letaliteit van die personen 1% is;
        - *kwetsbaar object:* object als bedoeld in
      [artikel 1, eerste lid, onderdeel l, van het Besluit externe veiligheid inrichtingen][ref8];
        - *Onze Minister:* Onze Minister van Infrastructuur en Milieu;
        - *oriëntatiewaarde:* waarde voor het groepsrisico weergegeven door de lijn die de punten met elkaar verbindt
      waarbij de kans op een ongeval met tien of meer dodelijke slachtoffers 10-4 per jaar, de kans op een ongeval met
      100 of meer dodelijke slachtoffers 10-6 per jaar en de kans op een ongeval met 1.000 of meer dodelijke slachtoffers
      10-8 per jaar is;
        - *plaatsgebonden risico:* risico op een plaats langs, op of boven een transportroute, uitgedrukt in een waarde
      voor de kans per jaar dat een persoon die onafgebroken en onbeschermd op die plaats zou verblijven, overlijdt als
      rechtstreeks gevolg van een ongewoon voorval op die transportroute waarbij een gevaarlijke stof betrokken is;
        - *plasbrandaandachtsgebied:* gebied waar bij het realiseren van kwetsbare of beperkt kwetsbare objecten rekening
      dient te worden gehouden met de mogelijke gevolgen van een ongeval met brandbare vloeistoffen;
        - *ramp:* ramp als bedoeld in [artikel 1 van de Wet veiligheidsregio’s][ref9];
        - *richtwaarde:* richtwaarde als bedoeld in [artikel 5.1, derde lid, van de Wet milieubeheer][ref10] ten aanzien
      van het niveau van het plaatsgebonden risico;
        - *transportroute:* basisnetroute of weg, niet zijnde een basisnetroute, in beheer bij gemeente, provincie of
      waterschap, waarover gevaarlijke stoffen worden vervoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel14
