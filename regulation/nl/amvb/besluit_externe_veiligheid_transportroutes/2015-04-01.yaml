        paragraaf: '2'
  - number: 2.a
    text: de vaststelling van een bestemmingsplan;
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel2
  - number: 2.b
    text: |-
      de wijziging of uitwerking van een bestemmingsplan of het stellen van nadere eisen, bedoeld in
      [artikel 3.6, eerste lid, van de Wet ruimtelijke ordening][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 2.c
    text: |-
      het verlenen van een omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, of tweede lid, van de Wet algemene bepalingen omgevingsrecht][ref1] van het
      bestemmingsplan of de beheersverordening wordt afgeweken dan wel krachtens [artikel 11 van de Woningwet][ref2] van
      de bouwverordening wordt afgeweken, en


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel11
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '11'
  - number: 2.d
    text: |-
      het geven van een aanwijzing als bedoeld in de [artikelen 4.2, eerste lid][ref1], en
      [4.4, eerste lid, onderdeel a, van de Wet ruimtelijke ordening][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel4
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '4'
  - number: '3.1'
    text: |-
      Het bevoegd gezag neemt bij het vaststellen van een besluit dat betrekking heeft op gronden in de omgeving van een
      basisnetroute ten aanzien van nieuw toe te laten kwetsbare objecten de basisnetafstand in acht en houdt daarmee
      rekening ten aanzien van nieuw toe te laten beperkt kwetsbare objecten.
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel3
  - number: '3.2'
    text: |-
      Voor zover een basisnetafstand slechts een deel van de breedte van een basisnetroute beslaat, worden boven de volle
      breedte van het desbetreffende gedeelte van die basisnetroute geen nieuwe kwetsbare objecten toegelaten.
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel3
  - number: '3.3'
    text: |-
      Voor zover de basisnetroute gedeeltelijk bestaat uit een tunnel waardoor het vervoer van brandbare gassen in
      bulkhoeveelheden en ontplofbare stoffen is toegestaan, worden boven dat gedeelte geen nieuwe kwetsbare objecten
      toegelaten en wordt daarmee rekening gehouden ten aanzien van nieuw toe te laten beperkt kwetsbare objecten.
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel3
  - number: '3.4'
    text: Het eerste lid is niet van toepassing op gronden die parallel aan een tunnel zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel3
  - number: '3.5'
    text: Het eerste en tweede lid zijn niet van toepassing op bij regeling van Onze Minister aangewezen binnenwateren.
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel3
  - number: '4.1'
    text: |-
      Het bevoegd gezag neemt bij de vaststelling van een besluit dat betrekking heeft op gronden in de omgeving van een
      transportroute, niet zijnde een basisnetroute, ten aanzien van nieuw toe te laten kwetsbare objecten de grenswaarde
      10-6 per jaar in acht en houdt ten aanzien van nieuw toe te laten beperkt kwetsbare objecten rekening met de
      richtwaarde 10-6 per jaar.
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel4
  - number: '4.2'
    text: Het plaatsgebonden risico wordt berekend volgens bij regeling van Onze Minister gestelde regels.
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel4
  - number: '5.1'
    text: |-
      Bij de vaststelling van een bestemmingsplan dat betrekking heeft op gronden die zijn gelegen binnen een
      basisnetafstand wijzigt de gemeenteraad de bestemming van die gronden, indien van toepassing, zodanig dat daarop
      geen kwetsbare objecten geprojecteerd worden binnen die afstand.
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel5
  - number: '5.2'
    text: |-
      Gedurende de periode dat nog geen wijziging als bedoeld in het eerste lid van kracht is, wijst
      het bevoegd gezag een aanvraag om een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder a of c, van de Wet algemene bepalingen omgevingsrecht][ref1] af, voor zover die
      activiteit betrekking heeft op de bouw, vestiging of aanleg van een kwetsbaar object binnen een basisnetafstand.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '6'
    text: |-
      In deze paragraaf wordt verstaan onder omgevingsvergunning: vergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref1] van het
      bestemmingsplan of de beheersverordening wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '7'
    text: |-
      In de toelichting bij een bestemmingsplan en in de ruimtelijke onderbouwing van een omgevingsvergunning wordt, voor
      zover het gebied waarop dat plan of die vergunning betrekking heeft binnen het invloedsgebied ligt van een weg,
      spoorweg of binnenwater waarover gevaarlijke stoffen worden vervoerd, in elk geval ingegaan op:
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel7
  - number: 7.a
    text: |-
      de mogelijkheden tot voorbereiding van bestrijding en beperking van de omvang van een ramp op die weg, spoorweg of
      dat binnenwater, en
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel7
  - number: 7.b
    text: |-
      voor zover dat plan of die vergunning betrekking heeft op nog niet aanwezige kwetsbare of beperkt kwetsbare
      objecten: de mogelijkheden voor personen om zich in veiligheid te brengen indien zich op die weg, spoorweg of dat
      binnenwater een ramp voordoet.
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel7
  - number: '8.1'
    text: |-
      Indien een bestemmingsplan of omgevingsvergunning betrekking heeft op een gebied dat geheel of gedeeltelijk
      gelegen is binnen 200 meter van een transportroute, wordt in de toelichting bij dat plan onderscheidenlijk in de
      ruimtelijke onderbouwing van die vergunning tevens ingegaan op:
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel8
  - number: 8.1.a.1°
    text: |-
      de dichtheid van personen in het invloedsgebied van de transportroute op het tijdstip waarop het plan of besluit
      wordt vastgesteld, rekening houdend met de in dat gebied reeds aanwezige personen en de personen die in dat
      gebied op grond van het geldende bestemmingsplan of de geldende bestemmingsplannen of een omgevingsvergunning
      redelijkerwijs te verwachten zijn, en
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel8
  - number: 8.1.a.2°
    text: |-
      de als gevolg van het bestemmingsplan of de omgevingsvergunning redelijkerwijs te verwachten verandering van de
      dichtheid van personen in het gebied waarop dat plan of die vergunning betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel8
  - number: 8.1.b
    text: |-
      het groepsrisico op het tijdstip waarop het plan of de vergunning wordt vastgesteld en de bijdrage van de in dat
      plan of besluit toegelaten kwetsbare en beperkt kwetsbare objecten aan de hoogte van het groepsrisico, vergeleken
      met de oriëntatiewaarde;
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel8
  - number: 8.1.c
    text: |-
      de maatregelen ter beperking van het groepsrisico die bij de voorbereiding van het plan of de vergunning zijn
      overwogen en de in dat plan of die vergunning opgenomen maatregelen, waaronder de stedenbouwkundige opzet en
      voorzieningen met betrekking tot de inrichting van de openbare ruimte, en
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel8
  - number: 8.1.d
    text: de mogelijkheden voor ruimtelijke ontwikkelingen met een lager groepsrisico en de voor- en nadelen daarvan.
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel8
  - number: '8.2'
    text: |-
      Het eerste lid kan buiten toepassing blijven indien bij de vaststelling van het besluit, bedoeld in het eerste lid,
      wordt aangetoond dat:
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel8
  - number: 8.2.a
    text: |-
      het groepsrisico, gelet op de dichtheid van personen, bedoeld in het eerste lid, onderdeel a, onder 1° en 2°, niet
      hoger is dan 0,1 maal de oriëntatiewaarde, of
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel8
  - number: 8.2.b.1°
    text: |-
      het groepsrisico, gelet op de redelijkerwijs te verwachten verandering van de dichtheid van personen, bedoeld in
      het eerste lid, onderdeel a, onder 2°, met niet meer dan tien procent toeneemt, en
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel8
  - number: 8.2.b.2°
    text: |-
      de oriëntatiewaarde, gelet op de dichtheid van personen, bedoeld in het eerste lid, onderdeel a, onder 1° en 2°,
      niet wordt overschreden.
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel8
  - number: '8.3'
    text: Indien toepassing wordt gegeven aan het tweede lid, bevat de toelichting bij het besluit de onderbouwing daarvan.
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel8
  - number: '8.4'
    text: Het groepsrisico wordt berekend volgens bij regeling van Onze Minister gestelde regels.
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel8
  - number: '9'
    text: |-
      Bij de voorbereiding van een bestemmingsplan of omgevingsvergunning als bedoeld in [artikel 7][ref1], stelt het
      bevoegd gezag het bestuur van de veiligheidsregio in wiens regio het gebied ligt waarop dat plan of die vergunning
      betrekking heeft, in de gelegenheid advies uit te brengen over de in de artikel 7 en, voor zover van toepassing,
      [artikel 8][ref2] genoemde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0034233#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0034233#Artikel8
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0034233
        artikel: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0034233
        artikel: '8'
        paragraaf: '3'
  - number: '10.1'
    text: |-
      Onverminderd de [artikelen 7][ref1] en [8][ref2] worden in de toelichting bij een bestemmingsplan en in de
      ruimtelijke onderbouwing van een omgevingsvergunning, voor zover dat plan of die vergunning betrekking heeft op een
      gebied dat ligt binnen:


      [ref1]: https://wetten.overheid.nl/BWBR0034233#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0034233#Artikel8
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0034233
        artikel: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0034233
        artikel: '8'
        paragraaf: '3'
  - number: 10.1.a
    text: |-
      een bij regeling van Onze Minister aangewezen plasbrandaandachtsgebied langs en boven een basisnetroute die een weg
      of hoofdspoorweg is, of
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel10
  - number: 10.1.b
    text: |-
      indien een basisnetroute een binnenwater is: een vrijwaringszone als bedoeld in
      [artikel 2.1.1 van het Besluit algemene regels ruimtelijke ordening][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0030378#Artikel2
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0030378
        artikel: '2'
  - number: '10.2'
    text: Het eerste lid is niet van toepassing op gebieden langs tunnels.
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel10
  - number: '11.1'
    text: |-
      De grenswaarde en richtwaarde, genoemd in [artikel 4][ref1], gelden op de bij regeling van Onze Minister
      vastgestelde meetpunten aan of bij kwetsbare onderscheidenlijk beperkt kwetsbare objecten.


      [ref1]: https://wetten.overheid.nl/BWBR0034233#Artikel4
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0034233
        artikel: '4'
        paragraaf: '2'
  - number: '11.2'
    text: |-
      Voor de vaststelling of ten aanzien van een kwetsbaar of beperkt kwetsbaar object wordt voldaan aan de
      basisnetafstand, bedoeld in [artikel 3, eerste lid][ref1], of, voor de toepassing van [artikel 5][ref2], in
      een bestemmingsplan een kwetsbaar object geprojecteerd is binnen een basisnetafstand, gelden de bij regeling
      van Onze Minister vastgestelde meetpunten aan of bij kwetsbare en beperkt kwetsbare objecten onderscheidenlijk
      geprojecteerde kwetsbare objecten.


      [ref1]: https://wetten.overheid.nl/BWBR0034233#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0034233#Artikel5
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0034233
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0034233
        artikel: '5'
        paragraaf: '2'
  - number: '11.3'
    text: |-
      De afstand, genoemd in de aanhef van [artikel 8, eerste lid][ref1], wordt gemeten vanaf de buitenrand van de
      transportroute.


      [ref1]: https://wetten.overheid.nl/BWBR0034233#Artikel8
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0034233
        artikel: '8'
        paragraaf: '3'
  - number: '12'
    text: |-
      Het bevoegd gezag draagt er zorg voor dat bij de voorbereiding van
      een bestemmingsplan of omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref1] van het
      bestemmingsplan of de beheersverordening wordt afgeweken in een zo vroeg mogelijk stadium van voorbereiding de
      gevolgen van dat plan of die vergunning voor de externe veiligheid in verband met het vervoer van gevaarlijke
      stoffen over een transportroute worden onderzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '13'
    text: |-
      [Artikel 5.2, derde lid, eerste zin, van de Wet milieubeheer][ref1] is niet van toepassing op de bij dit besluit
      gestelde milieukwaliteitseisen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
  - number: '14'
    text: |-
      Onze Minister geeft voor 1 januari 2022 aan in hoeverre de bij dit besluit gestelde milieukwaliteitseisen
      herziening behoeven.
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel14
  - number: '15'
    text: |-
      De [artikelen 7 tot en met 10][ref1] zijn niet van toepassing op een
      bestemmingsplan of omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref2] van
      het bestemmingsplan of de beheersverordening wordt afgeweken, waarvan het ontwerp voor het tijdstip van
      inwerkingtreding van dit besluit ter inzage is gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0034233#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0034233
        artikel: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '16'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel16
  - number: '17'
    text: 'Dit besluit wordt aangehaald als: Besluit externe veiligheid transportroutes.'
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel17
