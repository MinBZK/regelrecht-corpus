        artikel: '2'
  - number: '1.4'
    text: |-
      De [artikelen 2 tot en met 5][ref1] zijn niet van toepassing op gronden gelegen binnen een veiligheidscontour als
      bedoeld in [artikel 14 van het Besluit externe veiligheid inrichtingen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0034233#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016767#Artikel14
