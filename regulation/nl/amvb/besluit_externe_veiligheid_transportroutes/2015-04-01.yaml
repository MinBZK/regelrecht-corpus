  - number: '2'
    text: |-
      De [artikelen 3][ref1] en [4][ref2] zijn van toepassing op besluiten inhoudende:


      [ref1]: https://wetten.overheid.nl/BWBR0034233#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0034233#Artikel4
    url: https://wetten.overheid.nl/BWBR0034233/2015-04-01#Artikel2
