    Hoofddirectie Bestuurlijke en Juridische Zaken;

    Gelet op de artikelen 5.1, eerste en vijfde lid, 5.2, eerste lid, 5.3, eerste en tweede lid, en 21.8 van de Wet
    milieubeheer, 2.4, 3.37 en 4.3, eerste en derde lid, van de Wet ruimtelijke ordening, 2.12, derde lid, en 2.22,
