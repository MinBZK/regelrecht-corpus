articles:
  - number: III.1
    text: |-
      Dit besluit treedt in werking met ingang van de eenentwintigste dag na de datum van uitgifte van het Staatsblad
      waarin het wordt geplaatst, met uitzondering van [artikel II][ref1], dat in werking treedt met ingang van 1 maart
      2021.


      [ref1]: https://wetten.overheid.nl/BWBR0043908#ArtikelII
    url: https://wetten.overheid.nl/BWBR0043908/2020-08-10#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0043908
        artikel: II
  - number: III.2
    text: |-
      In afwijking van het eerste lid kan bij koninklijk besluit worden bepaald dat [artikel II][ref1] op een later
      tijdstip in werking treedt, met dien verstande dat dit tijdstip ten hoogste zes maanden na 1 maart 2021 ligt.


      [ref1]: https://wetten.overheid.nl/BWBR0043908#ArtikelII
    url: https://wetten.overheid.nl/BWBR0043908/2020-08-10#ArtikelIII
    references:
