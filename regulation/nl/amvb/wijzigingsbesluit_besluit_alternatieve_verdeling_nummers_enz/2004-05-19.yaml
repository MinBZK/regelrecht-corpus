preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 10 juli 2003, nr. WJZ 3025192;

    Gelet op richtlijn nr. 2002/20/EG van het Europees Parlement en de Raad van de Europese Unie van 7 maart 2002
    betreffende de machtiging voor elektronische-communicatienetwerken en -diensten (PbEG L 108), richtlijn nr.
    2002/21/EG van het Europees Parlement en de Raad van de Europese Unie van 7 maart 2002 inzake een gemeenschappelijk
    regelgevingskader voor elektronische-communicatienetwerken en -diensten (PbEG L 108), richtlijn nr. 2002/22/
    EG van het Europees Parlement en de Raad van de Europese Unie van 7 maart 2002 inzake de universele dienst en
    gebruikersrechten met betrekking tot elektronische-communicatienetwerken en -diensten (PbEG L 108), en de artikelen
    3.3, negende lid, 3.5, derde en vierde lid, 4.2, tiende lid, 4.10, eerste lid, 4.11, tweede lid, 10.1b en 16.1,
    eerste lid, van de Telecommunicatiewet;

    De Raad van State gehoord (advies van 14 augustus 2003, nr. W 10.03.0306/II);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 3 mei 2004, nr. WJZ 4028469;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0016701/2004-05-19#ArtikelAanhef
articles:
  - number: VII.1
    text: |-
      Indien na het tijdstip waarop dit besluit in werking is getreden, in het jaar 2004 voor de eerste maal krachtens
      [artikel 5 van het Besluit vergoedingen Telecommunicatiewet][ref1] bij ministeriële regeling een vergoeding voor
      een categorie van werkzaamheden of diensten als bedoeld in [artikel 4, tweede lid, van dat besluit][ref2] wordt
      vastgesteld, heeft die vergoeding slechts betrekking op de periode vanaf het tijdstip van inwerkingtreding van die
      regeling tot en met 31 december 2004.


      [ref1]: https://wetten.overheid.nl/BWBR0010334#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0010334#Artikel4
    url: https://wetten.overheid.nl/BWBR0016701/2004-05-19#ArtikelVII
    references:
      - id: ref1
        bwb_id: BWBR0010334
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0010334
        artikel: '4'
  - number: VII.2
    text: |-
      Indien door de toepassing van [artikel 4, tweede lid, van het Besluit vergoedingen Telecommunicatiewet][ref1] na
      de inwerkingtreding van het onderhavige besluit een andere vergoeding voor een bij de Regeling vergoedingen OPTA
      2004 vastgestelde categorie of subcategorie van gelijksoortige werkzaamheden of diensten wordt vastgesteld, heeft
      die vergoeding slechts betrekking op de periode vanaf het tijdstip van inwerkingtreding van de desbetreffende
      ministeriële regeling tot en met 31 december 2004 en vindt er een verrekening plaats met de reeds voor het
      kalenderjaar 2004 betaalde vergoeding voor het deel dat betrekking heeft op de eerder vermelde periode.


      [ref1]: https://wetten.overheid.nl/BWBR0010334#Artikel4
    url: https://wetten.overheid.nl/BWBR0016701/2004-05-19#ArtikelVII
    references:
      - id: ref1
        bwb_id: BWBR0010334
        artikel: '4'
  - number: VIII
    text: |-
      Het [Besluit ONP-geschillenbeslechting][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0009993
    url: https://wetten.overheid.nl/BWBR0016701/2004-05-19#ArtikelVIII
    references:
      - id: ref1
        bwb_id: BWBR0009993
  - number: IX
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop de
      [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref1] in werking
      treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0016635
    url: https://wetten.overheid.nl/BWBR0016701/2004-05-19#ArtikelIX
    references:
      - id: ref1
        bwb_id: BWBR0016635
