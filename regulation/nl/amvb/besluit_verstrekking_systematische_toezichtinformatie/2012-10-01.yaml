preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 19 april 2012, 2012-
    0000227850, DCB/CZW/S&B;

    Gelet op de artikelen 119, derde lid, en 124h van de Gemeentewet en 117, derde lid, en 121f van de Provinciewet;

    De Afdeling advisering van de Raad van State gehoord (advies van 22 juni 2012, nr. W04.12.0132/I);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 6 juli 2012, nr. 2012-
    0000394262, DCB/CZW/S&B;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0031812/2012-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en op dit besluit gebaseerde regelingen en provinciale verordeningen wordt verstaan onder:

      a. *wettelijke taak:* de wettelijk gevorderde beslissingen, handelingen of resultaten, bedoeld in
      [artikel 124, eerste lid, van de Gemeentewet][ref1] of [artikel 121, eerste lid, van de Provinciewet][ref2];

      b. *toezicht:* het verzamelen van de informatie door het provinciebestuur of Onze Minister die het aangaat over de
      vraag of de uitvoering van een wettelijke taak voldoet aan de daaraan gestelde eisen, het zich daarna vormen van
      een oordeel daarover en het eventueel naar aanleiding daarvan interveniëren;

      c. *toezichtinformatie:* informatie die door het provinciebestuur of Onze Minister die het aangaat van het
      gemeentebestuur of het provinciebestuur wordt gevraagd ten behoeve van het toezicht;

      d. *systematische toezichtinformatie:* toezichtinformatie die van meer dan één gemeentebestuur of provinciebestuur
      wordt gevraagd of die vaker dan één keer wordt gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel124
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel121
    url: https://wetten.overheid.nl/BWBR0031812/2012-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '124'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '121'
  - number: '2'
    text: |-
      1 Onze Minister die het aangaat kan, voor zover hij met toezicht is belast, met inachtneming van dit besluit
      bij ministeriële regeling de verplichting opleggen tot het periodiek aan hem verstrekken van systematische
      toezichtinformatie.

      2 Voor zover gedeputeerde staten of de commissaris van de Koning met toezicht zijn belast, kunnen provinciale
      staten met inachtneming van dit besluit bij verordening de verplichting opleggen tot het periodiek verstrekken van
      systematische toezichtinformatie aan gedeputeerde staten of de commissaris van de Koning.

      3 Onze Minister die het aangaat, gedeputeerde staten of de commissaris van de Koning kan onderscheidenlijk kunnen,
      voor zover hij, onderscheidenlijk zij, met toezicht is belast, de verplichting opleggen tot eenmalige verstrekking
      van systematische toezichtinformatie overeenkomstig [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031812#Artikel6
    url: https://wetten.overheid.nl/BWBR0031812/2012-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0031812
        artikel: '6'
  - number: '3'
    text: |-
      Het provinciebestuur of Onze Minister kan een jaarplan opstellen waarin de prioriteiten inzake het toezicht worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0031812/2012-10-01#Artikel3
  - number: '4'
    text: |-
      1 De verplichting tot het verstrekken van systematische toezichtinformatie wordt slechts opgelegd, voor zover en
      voor zolang dit noodzakelijk is voor de uitoefening van het toezicht.

      2 De verplichting tot het verstrekken van systematische toezichtinformatie wordt slechts opgelegd, indien het
      provinciebestuur of Onze Minister die het aangaat de gegevens niet op andere wijze kan verkrijgen of indien de
      door het provinciebestuur of Onze Minister te leveren inspanning ter verkrijging van de gegevens niet opweegt
      tegen de inspanning die het gemeentebestuur of het provinciebestuur levert bij het verstrekken van de systematische
      toezichtinformatie.
    url: https://wetten.overheid.nl/BWBR0031812/2012-10-01#Artikel4
  - number: '5'
    text: |-
      1 Bij een verplichting tot periodieke verstrekking van systematische toezichtinformatie wordt bepaald:

      a. over welke wettelijke taak informatie wordt gevraagd;

      b. welke gegevens worden verstrekt;

      c. op welk tijdstip de informatie wordt verstrekt;

      d. op welke wijze de informatie wordt verstrekt.

      2 In de in [artikel 2][ref1] bedoelde regeling of verordening wordt voor een verplichting als bedoeld in het eerste
      lid een vrijstelling verleend, voor zover:

      a. het provinciebestuur of Onze Minister die het aangaat reeds over de informatie beschikt;

      b. de uitvoering van de wettelijke taak waarop de informatie betrekking heeft, hiertoe aanleiding geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0031812#Artikel2
    url: https://wetten.overheid.nl/BWBR0031812/2012-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0031812
        artikel: '2'
  - number: '6'
    text: |-
      1 De verplichting tot eenmalige verstrekking van systematische toezichtinformatie wordt slechts opgelegd in geval
      de verplichting noodzakelijk is:

      a. ter uitwerking van een op toezicht betrekking hebbend onderzoeksthema dat is opgenomen in het jaarplan, bedoeld
      in [artikel 3][ref1] of een ander bij of krachtens de wet voorzien jaarplan;

      b. wegens een ernstige onvoorziene gebeurtenis die aanleiding geeft tot toezicht dat niet in het jaarplan is
      voorzien.

      2 De verplichting wordt voor een onderzoeksthema als bedoeld in het eerste lid, onderdeel a, niet voor twee
      achtereenvolgende jaren opgelegd.

      3 Bij het opleggen van de verplichting wordt een termijn gesteld die het gemeentebestuur of het provinciebestuur
      voldoende gelegenheid geeft om aan de verplichting te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0031812#Artikel3
    url: https://wetten.overheid.nl/BWBR0031812/2012-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0031812
        artikel: '3'
  - number: '7'
    text: |-
