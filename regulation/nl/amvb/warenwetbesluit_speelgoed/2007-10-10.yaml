  - number: '9'
    text: >-
      1 Als methoden van onderzoek welke bij uitsluiting beslissend zijn voor de vaststelling of met betrekking tot
      kinderwaren al dan niet is voldaan aan bij of krachtens dit besluit gestelde regels, worden aangewezen methoden op
      het gebied van analytisch - chemisch, fysisch - mechanisch en microbiologisch onderzoek.


      2 Onze Minister kan omtrent de in het eerste lid bedoelde methoden van onderzoek nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0005094/2007-10-10#Artikel9
  - number: '10'
    text: Het Speelgoedbesluit (Warenwet) 1985 (*Stb.* 1985, 751) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005094/2007-10-10#Artikel10
  - number: '11'
    text: >-
      Dit besluit treedt in werking met ingang van de zevende kalendermaand na de datum van uitgifte van het *Staatsblad*
      waarin het wordt geplaatst, met dien verstande dat speelgoed en kinderwaren die voldoen aan het Speelgoedbesluit
      1985 (Warenwet) zoals dat luidde onmiddellijk vóór de inwerkingtreding van dit besluit en voor die inwerkingtreding
      voor het eerst zijn verhandeld, nog 6 maanden na die inwerkingtreding mogen worden verhandeld.
    url: https://wetten.overheid.nl/BWBR0005094/2007-10-10#Artikel11
  - number: '12'
    text: Dit besluit kan worden aangehaald als Warenwetbesluit Speelgoed.
    url: https://wetten.overheid.nl/BWBR0005094/2007-10-10#Artikel12
