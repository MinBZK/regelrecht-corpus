preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 3 oktober 1990, VVP/P/U-689106
    gedaan in overeenstemming met Onze Minister van Economische Zaken;


    Overwegende dat regelen moeten worden gesteld ter uitvoering van de richtlijn van de Raad van Europese
    Gemeenschappen van 3 mei 1988 (88/378/EEG, Pb EG L 187) inzake de onderlinge aanpassing van de wetgevingen
    betreffende de veiligheid van speelgoed;


    Overwegende dat het tevens wenselijk is om redenen van volksgezondheid regelen te stellen met betrekking tot de
    veiligheid van kinderwaren niet zijnde speelgoed in de zin van richtlijn 88/378/EEG;


    Overwegende dat tevens uitvoering dient te worden gegeven aan de richtlijn van de Raad van de Europese
    Gemeenschappen van 22 november 1982 houdende de tweede wijziging (benzeen) van richtlijn 76/769/EEG betreffende de
    onderlinge aanpassing van de wettelijke en bestuursrechtelijke bepalingen der Lid-Staten inzake de beperking van
    het op de markt brengen en het gebruik van gevaarlijke stoffen en preparaten (82/806/EEG, Pb EG L 339), en aan de
    richtlijn van de Raad van de Europese Gemeenschappen van 16 mei 1983 houdende vierde wijziging van vorengenoemde
    richtlijn 76/769/EEG (83/264/EEG, Pb EG L 147);


    Gelet op de artikelen 4, eerste lid, onderdeel a, 8, onderdelen a, b en c, 11, 12, 13 en 14 van de Warenwet (Stb.
    1988, 360);


    Gezien het advies van de Adviescommissie Warenwet van 10 juli 1990, no. 14.166/(52)5;


    De Raad van State gehoord (advies van 22 februari 1991, no. W 13.90.0495);


    Gezien het nader rapport van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 15 mei 1991, VVP/P/U-
    690568, uitgebracht in overeenstemming met Onze Minister van Economische Zaken;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005094/2007-10-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. speelgoed: goederen of delen daarvan, die ontworpen of kennelijk bestemd zijn om bij het spelen door kinderen
      tot de leeftijd van 14 jaar te worden gebruikt waaronder begrepen teken-, schrijf- en kleurmateriaal, alsmede
      materiaal voor handenarbeid en leer- en ontwikkelingsmateriaal, met uitzondering van boeken;

      b. kinderwaren: overige goederen of delen daarvan, die kennelijk geschikt zijn om bij het spelen door kinderen tot
      de leeftijd van 14 jaar te worden gebruikt;

      c. het EEG-verdrag: het verdrag tot oprichting van de Europese Economische Gemeenschap van 25 maart 1957,
      laatstelijk gewijzigd door de Europese akte van 17 en 28 februari 1986 (*Trb.* 1986, 63).

      2 Niet als speelgoed worden beschouwd de in [bijlage 1][ref1] bij dit besluit vermelde artikelen.

      3 Tot kinderwaren behoren in ieder geval:

      a. schertsartikelen;

      b. fopspenen;

      c. speelgoedstoommachines.


      [ref1]: https://wetten.overheid.nl/BWBR0005094
    url: https://wetten.overheid.nl/BWBR0005094/2007-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005094
  - number: '2'
    text: >-
      1 Het is verboden speelgoed en kinderwaren te verhandelen indien die niet voldoen aan de eisen gesteld bij of
      krachtens dit besluit met betrekking tot hun samenstelling, uitvoering, hoedanigheid of eigenschappen.


      2 Het is verboden speelgoed en kinderwaren te verhandelen anders dan met inachtneming van de voorschriften bij
      of krachtens dit besluit gesteld met betrekking tot de aanduiding, het bezigen van vermeldingen en het technisch
      dossier.


      3 Het is verboden met gebruikmaking van de in dit besluit aangegeven aanduiding ander speelgoed te verhandelen dan
      dat waarvoor die aanduiding in dit besluit is voorbehouden.
    url: https://wetten.overheid.nl/BWBR0005094/2007-10-10#Artikel2
  - number: '3'
    text: |-
      1 Speelgoed en kinderwaren dienen zodanig te zijn samengesteld en zodanige eigenschappen te hebben alsmede van
      zodanige vermeldingen te zijn voorzien, dat zij bij gebruik overeenkomstig de bestemming of bij gebruik op een
      wijze die gezien het gangbare gedrag van kinderen te verwachten is, geen bijzonder gevaar opleveren voor de
      veiligheid of gezondheid van de gebruiker of van derden.

      2 Speelgoed en kinderwaren moeten voldoen aan de in [bijlage 2][ref1] vermelde voorschriften.

      3 Onze Minister kan voor wat betreft kinderwaren nadere regelen vaststellen met betrekking tot de in het eerste lid
      bedoelde samenstelling, eigenschappen en vermeldingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005094
    url: https://wetten.overheid.nl/BWBR0005094/2007-10-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005094
  - number: '4'
    text: |-
      1 De aanduiding houdende de CE-markering:

      a. moet worden gebezigd voor speelgoed;

      b. mag niet worden gebezigd voor kinderwaren.

      2 De in het eerste lid bedoelde aanduiding mag uitsluitend voor speelgoed worden gebezigd:

      a. dat geheel is vervaardigd in overeenstemming met de door Onze Minister daartoe aan te wijzen normen, of

      b. waarvoor een verklaring is afgegeven waaruit blijkt dat het speelgoed bij gebruik overeenkomstig de bestemming
      of bij gebruik op een wijze die gezien het gangbare gedrag van kinderen te verwachten is, geen bijzonder gevaar
      oplevert voor de veiligheid en/of gezondheid van de gebruiker of derden.

      3 Speelgoed, waarbij de in het eerste lid bedoelde aanduiding, overeenkomstig het tweede lid wordt gebezigd, wordt
      vermoed te voldoen aan het bij [artikel 3, tweede lid][ref1], bepaalde.

      4 Onze Minister kan nadere regels stellen inzake vorm en grootte van de in het eerste lid genoemde aanduiding.

      5 Ten aanzien van speelgoed en kinderwaren mogen geen vermeldingen, voorstellingen of aanduidingen worden gebezigd
      die met de in het eerste lid genoemde aanduiding kunnen worden verward.


      [ref1]: https://wetten.overheid.nl/BWBR0005094#Artikel3
    url: https://wetten.overheid.nl/BWBR0005094/2007-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005094
        artikel: '3'
  - number: '5'
    text: >-
      1 Speelgoed en kinderwaren dienen te zijn voorzien van de naam, firmanaam of handelsmerk alsmede het adres van de
      fabrikant, de importeur die de waren binnen het grondgebied waarop het EEG-verdrag van toepassing is dan wel het
      grondgebied van een van de staten die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte,
      in de handel brengt of heeft gebracht, of de binnen de hiervoor bedoelde grondgebieden gevestigde gemachtigde van
      de fabrikant.


      2 De in het eerste lid bedoelde vermeldingen mogen worden afgekort mits identificatie van fabrikant, diens
      gemachtigde of importeur mogelijk blijft.
    url: https://wetten.overheid.nl/BWBR0005094/2007-10-10#Artikel5
  - number: '6'
    text: >-
      1 De bij of krachtens dit besluit voorgeschreven vermeldingen en aanduiding moeten, voor zover bij of krachtens dit
      besluit niet anders is bepaald, duidelijk zichtbaar, gemakkelijk leesbaar en onuitwisbaar in de Nederlandse taal op
      speelgoed en kinderwaren of de verpakking ervan worden aangebracht.


      2 Bij speelgoed van klein formaat en speelgoed dat bestaat uit onderdelen van klein formaat, mogen de in het eerste
      lid bedoelde vermeldingen en aanduiding worden aangebracht op de verpakking, op een etiket of op een bijgesloten
      mededeling.


      3 Indien de in het eerste lid bepaalde vermeldingen niet op het speelgoed zijn aangebracht, moet de consument op
      de verpakking, het etiket of de bijgesloten mededeling erop worden gewezen dat het nuttig is bedoelde vermeldingen
      te bewaren.
    url: https://wetten.overheid.nl/BWBR0005094/2007-10-10#Artikel6
  - number: '7'
    text: |-
      1 De in [artikel 4, tweede lid, onderdeel b][ref1], bedoelde verklaring kan uitsluitend worden afgegeven door:

      a. de door Onze Minister aangewezen instanties;

      b. de door de bevoegde autoriteiten van de Lid-Staten van de EEG dan wel die van de overige staten die partij zijn
      bij de Overeenkomst betreffende de Europese Economische Ruimte, daartoe aangewezen instanties.

      2 Voor een aanwijzing als bedoeld in het eerste lid, onder *a*, komen slechts in aanmerking instanties die voldoen
      aan de in [bijlage 3][ref2] neergelegde voorwaarden. Onze Minister kan nadere voorwaarden stellen.

      3 Indien Onze Minister constateert dat een door hem aangewezen instantie niet meer voldoet aan de in
      [bijlage 3][ref3] neergelegde voorwaarden, trekt hij de aanwijzing in.

      4 De in het eerste lid, onder *a*, bedoelde aanwijzing, alsmede de intrekking of wijziging daarvan worden bekend
      gemaakt in de *Staatscourant*.

      5 De verklaring, bedoeld in het eerste lid, kan door de in dat lid onder *a* bedoelde instanties uitsluitend worden
      afgegeven aan de fabrikant, of aan de binnen het grondgebied waarop het EEG-verdrag van toepassing is dan wel het
      grondgebied van een van de staten die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte,
      gevestigde gemachtigde van de fabrikant.

      6 Onze Minister stelt nadere regelen omtrent het indienen van een aanvraag als bedoeld in het vierde lid, waaronder
      de daarbij over te leggen documenten, en de behandeling daarvan door de in het eerste lid, onderdeel *a*, bedoelde
      instanties, alsmede omtrent de vorm van de door deze instanties af te geven verklaringen.


      [ref1]: https://wetten.overheid.nl/BWBR0005094#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005094
      [ref3]: https://wetten.overheid.nl/BWBR0005094
    url: https://wetten.overheid.nl/BWBR0005094/2007-10-10#Artikel7
    references:
