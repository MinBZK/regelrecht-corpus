        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005094
      - id: ref3
        bwb_id: BWBR0005094
  - number: '8'
    text: |-
      1 Ten aanzien van het met de in [artikel 4, eerste lid][ref1], bedoelde aanduiding voorziene speelgoed dient een
      technisch dossier voorhanden te zijn bij de fabrikant, diens gemachtigde of, indien deze niet gevestigd zijn binnen
      het grondgebied waarop het EEG-verdrag van toepassing is dan wel het grondgebied van een van de staten die partij
      zijn bij de Overeenkomst betreffende de Europese Economische Ruimte, de importeur die het speelgoed binnen een van
      de hiervoor bedoelde grondgebieden in de handel heeft gebracht.

      2 Het in het eerste lid bedoelde dossier moet ten minste omvatten:

      a. gegevens met betrekking tot de wijze waarop de fabrikant zorgdraagt dat het speelgoed voldoet aan de
      in [artikel 4, tweede lid onderdeel a][ref2], bedoelde normen dan wel voldoet aan het gestelde in de in
      [artikel 4, tweede lid, onderdeel b][ref3], bedoelde verklaring.

      b. gegevens met betrekking tot ontwerp en vervaardiging;

      c. adressen van opslag en vervaardiging.

      3 Heeft het in het eerste lid bedoelde dossier betrekking op speelgoed waarvoor een verklaring als bedoeld in
      [artikel 4, tweede lid, onderdeel b][ref4], is afgegeven, dan omvat het tevens deze verklaring of een gewaarmerkt
      afschrift daarvan.

      4 Onze Minister kan nadere regelen stellen omtrent de inhoud van het dossier.


      [ref1]: https://wetten.overheid.nl/BWBR0005094#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005094#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005094#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0005094#Artikel4
    url: https://wetten.overheid.nl/BWBR0005094/2007-10-10#Artikel8
