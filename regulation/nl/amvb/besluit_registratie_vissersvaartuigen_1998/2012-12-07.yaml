  - number: '3'
    text: |-
      1 Bij regeling van Onze Minister worden de gemeenten aangewezen die in aanmerking komen als thuishaven voor
      vissersvaartuigen en worden de lettertekens vastgesteld waarmee die gemeenten worden aangeduid.

      2 In de regeling, bedoeld in het eerste lid, worden regels gesteld omtrent de grootte, de kleur en de plaats van de
      lettertekens en nummers.
    url: https://wetten.overheid.nl/BWBR0009353/2012-12-07#Artikel3
  - number: '4'
    text: |-
      Onze Minister houdt een register bij waarin de vissersvaartuigen worden ingeschreven onder vermelding van hun
      thuishaven, de overige gegevens, bedoeld in bijlage II van Verordening (EG) nr. 26/2004 van de Commissie van de
      Europese Gemeenschappen van 30 december 2003 betreffende het communautaire gegevensbestand over de vissersvloot
      (PbEU L 5) en andere gegevens waarvan Onze Minister vermelding noodzakelijk acht op grond van communautaire
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0009353/2012-12-07#Artikel4
  - number: '5'
    text: |-
      Het is verboden een vissersvaartuig te gebruiken indien dat vaartuig niet het letterteken voert dat in de regeling,
      bedoeld in [artikel 3][ref1], is bepaald voor de gemeente waar dat vaartuig zijn thuishaven heeft, en het nummer
      waaronder het vaartuig in het visserijregister is ingeschreven, danwel indien het vaartuig niet is ingeschreven in
      het visserijregister, bedoeld in [artikel 4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009353#Artikel4
    url: https://wetten.overheid.nl/BWBR0009353/2012-12-07#Artikel5
    references:
      - id: ref1
