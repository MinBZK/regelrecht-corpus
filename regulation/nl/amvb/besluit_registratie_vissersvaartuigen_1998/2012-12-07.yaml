        artikel: '3'
      - id: ref2
        bwb_id: BWBR0009353
        artikel: '4'
  - number: '6'
    text: |-
      1 De eigenaar van een vaartuig dient, alvorens het als vissersvaartuig in gebruik te nemen, een aanvraag in voor
      inschrijving in het visserijregister op een door Onze Minister vast te stellen en beschikbaar te stellen formulier.

      2 Onze Minister kan regels stellen omtrent het in het eerste lid bedoelde formulier en de bescheiden die overgelegd
      worden bij de in het eerste lid bedoelde aanvraag.

      3 Inschrijving in het visserijregister vindt slechts plaats indien:

      a. het formulier, bedoeld in het eerste lid, volledig en naar waarheid is ingevuld en is ondertekend;

      b. is voldaan aan het tweede lid, en

      c. Onze Minister geen reden heeft de juistheid van de bij de aanvraag vermelde opgaven of verstrekte gegevens in
      twijfel te trekken.

      4 Onze Minister kan besluiten tot doorhaling van een inschrijving in het visserijregister indien blijkt dat de door
      de eigenaar van het desbetreffende vissersvaartuig bij zijn aanvraag vermelde opgaven of verstrekte gegevens niet
      overeenstemmen met de werkelijkheid.
    url: https://wetten.overheid.nl/BWBR0009353/2012-12-07#Artikel6
  - number: 6a
    text: |-
      1 Onze Minister doet de eigenaar van een vaartuig een bewijs van inschrijving in het visserijregister toekomen.

      2 Een ten behoeve van het vissersvaartuig verleende visvergunning als bedoeld in artikel 6, eerste lid
      van Verordening (EG) nr. 1224/2009 van de Raad van 20 november 2009 tot vaststelling van een communautaire
      controleregeling die de naleving van de regels van het gemeenschappelijk visserijbeleid moet garanderen, tot
      wijziging van Verordeningen (EG) nr. 847/96, (EG) nr. 2371/2002, (EG) nr. 811/2004, (EG) nr. 768/2005, (EG) nr.
      2115/2005, (EG) nr. 2166/2005, (EG) nr. 388/2006, (EG) nr. 509/2007, (EG) nr. 676/2007, (EG) nr. 1098/2007, (EG)
      nr. 1300/2008, (EG) nr. 1342/2008 en tot intrekking van Verordeningen (EEG) nr. 2847/93, (EG) nr. 1627/94 en (EG)
      nr. 1966/2006 (PbEU 2009, L 343), geldt als bewijs van inschrijving in het visserijregister als bedoeld in het
      eerste lid.

      3 De visvergunning, bedoeld in het tweede lid, geldt tevens als het document, bedoeld in
      [artikel 2, eerste lid, van de Uitvoeringswet Visserijverdrag 1967][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002897#Artikel2
    url: https://wetten.overheid.nl/BWBR0009353/2012-12-07#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0002897
        artikel: '2'
  - number: '7'
    text: |-
      1 Indien een vaartuig:

      a. niet meer gebruikt wordt als vissersvaartuig;

      b. niet meer geldt als Nederlands in de zin van
      [artikel 1, tweede lid, van de Uitvoeringswet Visserijverdrag 1967][ref1], of

      c. is vergaan of gesloopt,

      doet de eigenaar onder wiens naam het betrokken vaartuig in het visserijregister is ingeschreven hiervan mededeling
      aan Onze Minister op een door Onze Minister vast te stellen en beschikbaar te stellen formulier, zo spoedig
      mogelijk, doch uiterlijk zes weken nadat de desbetreffende verandering heeft plaatsgevonden.

      2 De eigenaar van een vissersvaartuig doet aan Onze Minister op een daarvoor door Onze Minister vast te stellen
      en beschikbaar te stellen formulier mededeling van elke andere verandering ten aanzien van de gegevens, bedoeld in
      [artikel 4][ref2], uiterlijk zes weken nadat de desbetreffende verandering heeft plaatsgevonden.

      3 Van de omstandigheid, bedoeld in het eerste lid, onder a, is in elk geval sprake indien het vaartuig een jaar of
      langer niet is gebruikt als vissersvaartuig.


      [ref1]: https://wetten.overheid.nl/BWBR0002897#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009353#Artikel4
    url: https://wetten.overheid.nl/BWBR0009353/2012-12-07#Artikel7
    references:
