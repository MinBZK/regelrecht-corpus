  - number: '10'
    text: |-
      1 Na inwerkingtreding van dit besluit geldt de registratie van een vissersvaartuig in het centraal
      visserijregister, bedoeld in het Registratiebesluit vissersvaartuigen 1964, als een registratie in het
      visserijregister.

      2 Een bewijs, verkregen op grond van het [Besluit nationaliteitsbewijs vissersvaartuigen][ref1], wordt beschouwd
      als het document, bedoeld in [artikel 2, eerste lid, van de Uitvoeringswet Visserijverdrag 1967][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002930
      [ref2]: https://wetten.overheid.nl/BWBR0002897#Artikel2
