articles:
  - number: '1'
    text: |-
      In afwijking in zoverre van [artikel 1, eerste lid, van de Uitvoeringwet Visserijverdrag 1967][ref1] wordt in dit
      besluit en de daarop berustende bepalingen verstaan onder:

      a. Onze Minister: Onze Minister van Economische Zaken;

      b. vissersvaartuig:

      1°. vaartuig als bedoeld in artikel 3, onderdeel c, van Verordening (EG) nr. 2371/2002 van de Raad van de
      Europese Unie van 20 december 2002 inzake de instandhouding en de duurzame exploitatie van de visbestanden
      in het kader van het gemeenschappelijk visserijbeleid (PbEG L 358), dat geldt als Nederlands op grond van
      [artikel 1, tweede lid, van de Uitvoeringswet Visserijverdrag 1967][ref2], of

      2°. vaartuig dat is uitgerust voor de commerciële exploitatie van vis in het IJsselmeer;

      c. eigenaar: natuurlijke of rechtspersoon die de eigendom heeft;

      d. visserijregister: het register, bedoeld in [artikel 4][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002897#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002897#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0009353#Artikel4
    url: https://wetten.overheid.nl/BWBR0009353/2012-12-07#Artikel1
