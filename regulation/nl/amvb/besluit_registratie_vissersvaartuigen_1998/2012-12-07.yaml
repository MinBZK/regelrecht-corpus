  - number: '9'
    text: |-
      Onze Minister kan de inschrijving in het visserijregister, bedoeld in [artikel 6, eerste lid][ref1], of de
      aanpassing van de betrokken gegevens in het visserijregister, bedoeld in [artikel 8, eerste lid, onderdeel b][ref2],
      weigeren, indien hij dit noodzakelijk acht ter nakoming van communautaire verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009353#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009353#Artikel8
