        artikel: '4'
  - number: '8'
    text: |-
      1 Na ontvangst van de mededeling, bedoeld in [artikel 7][ref1], hetzij indien anders blijkt dat een verandering
      heeft plaatsgevonden besluit Onze Minister:

      a. indien het betreft een verandering als bedoeld in [artikel 7, eerste lid][ref2], tot doorhaling van de
      desbetreffende inschrijving in het visserijregister;

      b. indien het betreft een verandering als bedoeld in [artikel 7, tweede lid][ref3], tot dienovereenkomstige
      aanpassing van de betrokken gegevens in het visserijregister.

      2 Indien Onze Minister een besluit neemt als bedoeld in het eerste lid, onderdeel b, is
      [artikel 6a, eerste en tweede lid][ref4], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009353#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009353#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0009353#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0009353#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009353/2012-12-07#Artikel8
