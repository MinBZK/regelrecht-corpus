preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuurbeheer en Visserij van 4 december 1997, nr. J. 9713365,
    Directie Juridische Zaken;

    Gelet op artikel 3 van de Visserijwet 1963;

    De Raad van State gehoord (advies van 17 december 1997, no. W11.97.0777);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuurbeheer en Visserij van 19 januari 1998, No. J.
    98360, Directie Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In afwijking in zoverre van [artikel 1, eerste lid, van de Uitvoeringwet Visserijverdrag 1967][ref1] wordt in dit
      besluit en de daarop berustende bepalingen verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0002897#Artikel1
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002897
        artikel: '1'
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel1
  - number: 1.b
    text: 'vissersvaartuig:'
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel1
  - number: 1.b.1°
    text: |-
      vissersvaartuig als bedoeld in artikel 4, eerste lid, punt 4, van Verordening (EU) nr. 1380/2013 van het
      Europees Parlement en de Raad van 11 december 2013 inzake het gemeenschappelijk visserijbeleid, tot wijziging
      van [Verordeningen (EG) nr. 1954/2003](32003R1954) en [(EG) nr. 1224/2009](32009R1224) van de Raad en tot
      intrekking van Verordeningen (EG) nr. [2371/2002](32002R2371) en (EG) nr. [639/2004](32004R0639) van de Raad
      en Besluit [2004/585/EG](32485R2004) van de Raad (PbEU 2013, L 354), dat geldt als Nederlands op grond van
      [artikel 1, tweede lid, van de Uitvoeringswet Visserijverdrag 1967][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0002897#Artikel1
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002897
        artikel: '1'
  - number: 1.b.2°
    text: vaartuig dat is uitgerust voor de commerciële exploitatie van vis in het IJsselmeer;
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel1
  - number: 1.c
    text: 'eigenaar: natuurlijke of rechtspersoon die de eigendom heeft;'
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel1
  - number: 1.d
    text: |-
      visserijregister: het register, bedoeld in [artikel 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009353#Artikel4
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009353
        artikel: '4'
  - number: '3.1'
    text: |-
      Bij regeling van Onze Minister worden de gemeenten aangewezen die in aanmerking komen als thuishaven voor
      vissersvaartuigen en worden de lettertekens vastgesteld waarmee die gemeenten worden aangeduid.
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel3
  - number: '3.2'
    text: |-
      In de regeling, bedoeld in het eerste lid, worden regels gesteld omtrent de grootte, de kleur en de plaats van de
      lettertekens en nummers.
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel3
  - number: '4'
    text: |-
      Onze Minister houdt een register bij waarin de vissersvaartuigen worden ingeschreven onder vermelding van hun
      thuishaven, de overige gegevens, bedoeld in artikel 24 van Verordening (EU) nr. 1380/2013 van het Europees
      Parlement en de Raad van 11 december 2013 inzake het gemeenschappelijk visserijbeleid, tot wijziging van
      Verordeningen (EG) nr. 1954/2003 en (EG) nr. 1224/2009 van de Raad en tot intrekking van Verordeningen (EG) nr.
      2371/2002 en (EG) nr. 639/2004 van de Raad en Besluit 2004/585/EG van de Raad (PbEU 2013, L 354) en andere gegevens
      waarvan Onze Minister vermelding noodzakelijk acht op grond van verplichtingen van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel4
  - number: '5'
    text: |-
      Het is verboden een vissersvaartuig te gebruiken indien dat vaartuig niet het letterteken voert dat in de regeling,
      bedoeld in [artikel 3][ref1], is bepaald voor de gemeente waar dat vaartuig zijn thuishaven heeft, en het nummer
      waaronder het vaartuig in het visserijregister is ingeschreven, danwel indien het vaartuig niet is ingeschreven in
      het visserijregister, bedoeld in [artikel 4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009353#Artikel4
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0009353
        artikel: '4'
  - number: '6.1'
    text: |-
      De eigenaar van een vaartuig dient, alvorens het als vissersvaartuig in gebruik te nemen, een aanvraag in voor
      inschrijving in het visserijregister op een door Onze Minister vast te stellen en beschikbaar te stellen formulier.
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel6
  - number: '6.2'
    text: |-
      Onze Minister kan regels stellen omtrent het in het eerste lid bedoelde formulier en de bescheiden die overgelegd
      worden bij de in het eerste lid bedoelde aanvraag.
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel6
  - number: '6.3'
    text: 'Inschrijving in het visserijregister vindt slechts plaats indien:'
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel6
  - number: 6.3.a
    text: het formulier, bedoeld in het eerste lid, volledig en naar waarheid is ingevuld en is ondertekend;
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel6
  - number: 6.3.b
    text: is voldaan aan het tweede lid, en
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel6
  - number: 6.3.c
    text: |-
      Onze Minister geen reden heeft de juistheid van de bij de aanvraag vermelde opgaven of verstrekte gegevens in
      twijfel te trekken.
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel6
  - number: '6.4'
    text: |-
      Onze Minister kan besluiten tot doorhaling van een inschrijving in het visserijregister indien blijkt dat de door
      de eigenaar van het desbetreffende vissersvaartuig bij zijn aanvraag vermelde opgaven of verstrekte gegevens niet
      overeenstemmen met de werkelijkheid.
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel6
  - number: 6a.1
    text: Onze Minister doet de eigenaar van een vaartuig een bewijs van inschrijving in het visserijregister toekomen.
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel6a
  - number: 6a.2
    text: |-
      Een ten behoeve van het vissersvaartuig verleende visvergunning als bedoeld in artikel 6, eerste lid van
      Verordening (EG) nr. 1224/2009 van de Raad van 20 november 2009 tot vaststelling van een communautaire
      controleregeling die de naleving van de regels van het gemeenschappelijk visserijbeleid moet garanderen, tot
      wijziging van Verordeningen (EG) nr. 847/96, (EG) nr. 2371/2002, (EG) nr. 811/2004, (EG) nr. 768/2005, (EG) nr.
      2115/2005, (EG) nr. 2166/2005, (EG) nr. 388/2006, (EG) nr. 509/2007, (EG) nr. 676/2007, (EG) nr. 1098/2007, (EG)
      nr. 1300/2008, (EG) nr. 1342/2008 en tot intrekking van Verordeningen (EEG) nr. 2847/93, (EG) nr. 1627/94 en (EG)
      nr. 1966/2006 (PbEU 2009, L 343), geldt als bewijs van inschrijving in het visserijregister als bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel6a
  - number: 6a.3
    text: |-
      De visvergunning, bedoeld in het tweede lid, geldt tevens als het document, bedoeld in
      [artikel 2, eerste lid, van de Uitvoeringswet Visserijverdrag 1967][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002897#Artikel2
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0002897
        artikel: '2'
  - number: '7.1'
    text: 'Indien een vaartuig:'
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel7
  - number: 7.1.a
    text: niet meer gebruikt wordt als vissersvaartuig;
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel7
  - number: 7.1.b
    text: |-
      niet meer geldt als Nederlands in de zin van
      [artikel 1, tweede lid, van de Uitvoeringswet Visserijverdrag 1967][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0002897#Artikel1
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002897
        artikel: '1'
  - number: 7.1.c
    text: is vergaan of gesloopt,
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel7
  - number: '7.2'
    text: |-
      De eigenaar van een vissersvaartuig doet aan Onze Minister op een daarvoor door Onze Minister vast te stellen en
      beschikbaar te stellen formulier mededeling van elke andere verandering ten aanzien van de gegevens, bedoeld in
      [artikel 4][ref1], uiterlijk zes weken nadat de desbetreffende verandering heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0009353#Artikel4
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009353
        artikel: '4'
  - number: '7.3'
    text: |-
      Van de omstandigheid, bedoeld in het eerste lid, onder a, is in elk geval sprake indien het vaartuig een jaar of
      langer niet is gebruikt als vissersvaartuig.
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel7
  - number: '8.1'
    text: |-
      Na ontvangst van de mededeling, bedoeld in [artikel 7][ref1], hetzij indien anders blijkt dat een verandering heeft
      plaatsgevonden besluit Onze Minister:


      [ref1]: https://wetten.overheid.nl/BWBR0009353#Artikel7
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009353
        artikel: '7'
  - number: 8.1.a
    text: |-
      indien het betreft een verandering als bedoeld in [artikel 7, eerste lid][ref1], tot doorhaling van de
      desbetreffende inschrijving in het visserijregister;


      [ref1]: https://wetten.overheid.nl/BWBR0009353#Artikel7
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009353
        artikel: '7'
  - number: 8.1.b
    text: |-
      indien het betreft een verandering als bedoeld in [artikel 7, tweede lid][ref1], tot dienovereenkomstige aanpassing
      van de betrokken gegevens in het visserijregister.


      [ref1]: https://wetten.overheid.nl/BWBR0009353#Artikel7
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009353
        artikel: '7'
  - number: '8.2'
    text: |-
      Indien Onze Minister een besluit neemt als bedoeld in het eerste lid, onderdeel b, is
      [artikel 6a, eerste en tweede lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009353#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009353
        artikel: 6a
  - number: '9'
    text: |-
      Onze Minister kan de inschrijving in het visserijregister, bedoeld in [artikel 6, eerste lid][ref1], of de
      aanpassing van de betrokken gegevens in het visserijregister, bedoeld in [artikel 8, eerste lid, onderdeel b][ref2],
      weigeren, indien hij dit noodzakelijk acht ter nakoming van communautaire verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009353#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009353#Artikel8
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009353
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0009353
        artikel: '8'
  - number: '10.1'
    text: |-
      Na inwerkingtreding van dit besluit geldt de registratie van een vissersvaartuig in het centraal visserijregister,
      bedoeld in het Registratiebesluit vissersvaartuigen 1964, als een registratie in het visserijregister.
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel10
  - number: '10.2'
    text: |-
      Een bewijs, verkregen op grond van het [Besluit nationaliteitsbewijs vissersvaartuigen][ref1], wordt beschouwd als
      het document, bedoeld in [artikel 2, eerste lid, van de Uitvoeringswet Visserijverdrag 1967][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002930
      [ref2]: https://wetten.overheid.nl/BWBR0002897#Artikel2
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002930
      - id: ref2
        bwb_id: BWBR0002897
        artikel: '2'
  - number: 10a
    text: |-
      Dit besluit berust mede op [artikel 2, tweede lid, van de Uitvoeringswet Visserijverdrag 1967][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002897#Artikel2
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0002897
        artikel: '2'
  - number: '13'
    text: Het Registratiebesluit vissersvaartuigen 1964 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel13
  - number: '14'
    text: Dit besluit treedt in werking met ingang van 1 maart 1998.
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel14
  - number: '15'
    text: 'Dit besluit wordt aangehaald als: Besluit registratie vissersvaartuigen 1998.'
    url: https://wetten.overheid.nl/BWBR0009353/2018-01-01#Artikel15
