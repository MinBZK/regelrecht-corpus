        artikel: '6'
  - number: '9'
    text: |-
      1 De eigenaar van een in het visserijregister geregistreerd vissersvaartuig doet Onze Minister jaarlijks vóór
      1 april bescheiden toekomen waaruit ten genoegen van Onze Minister blijkt dat het vaartuig in het aan die datum
      voorafgaande kalenderjaar als vissersvaartuig is gebruikt, tenzij in dat voorafgaande jaar vangsten vis zijn
      geregistreerd in een registratiesysteem of -bestand als bedoeld in [artikel 6, tweede lid][ref1].

      2 Indien niet is voldaan aan het eerste lid, besluit Onze Minister tot doorhaling van de desbetreffende
      inschrijving in het visserijregister.


      [ref1]: https://wetten.overheid.nl/BWBR0009353#Artikel6
    url: https://wetten.overheid.nl/BWBR0009353/1998-03-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009353
        artikel: '6'
  - number: '10'
    text: |-
      Na inwerkingtreding van dit besluit geldt de registratie van een vissersvaartuig in het centraal visserijregister,
      bedoeld in het Registratiebesluit vissersvaartuigen 1964, als een registratie in het visserijregister.
    url: https://wetten.overheid.nl/BWBR0009353/1998-03-01#Artikel10
  - number: '13'
    text: Het Registratiebesluit vissersvaartuigen 1964 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009353/1998-03-01#Artikel13
