    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuurbeheer en Visserij van 4 december 1997, nr. J. 9713365,
    Directie Juridische Zaken;

    Gelet op artikel 3 van de Visserijwet 1963;

    De Raad van State gehoord (advies van 17 december 1997, no. W11.97.0777);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuurbeheer en Visserij van 19 januari 1998, No. J.
    98360, Directie Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009353/1998-03-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - a. Onze Minister: Onze Minister van Landbouw, Natuurbeheer en Visserij;
        - b. vissersvaartuig: vaartuig dat wordt gebruikt voor de bedrijfsmatige uitoefening van de zeevisserij,
      de kustvisserij of de visserij op het IJsselmeer en dat als Nederlands geldt op grond van de Uitvoeringswet
      Visserijverdrag 1967;
        - c. eigenaar: natuurlijke persoon of rechtspersoon die de eigendom heeft;
        - d. visserijregister: register, bedoeld in [artikel 4][ref1];
        - e. verandering: wijziging ten aanzien van de in het visserijregister geregistreerde gegevens van het
      desbetreffende vissersvaartuig en van de onderneming die dat vissersvaartuig exploiteert.


      [ref1]: https://wetten.overheid.nl/BWBR0009353#Artikel4
    url: https://wetten.overheid.nl/BWBR0009353/1998-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009353
        artikel: '4'
  - number: '2'
    text: |-
      1 Voor de toepassing van het bepaalde bij of krachtens dit besluit heeft een vissersvaartuig zijn thuishaven in de
      gemeente waar de onderneming van de eigenaar van het vissersvaartuig is gevestigd of een nevenvestiging heeft, en
      die als zodanig in de regeling, bedoeld in [artikel 3][ref1], is aangewezen.

      2 Indien zowel de gemeente waar de onderneming van de eigenaar van het vissersvaartuig is gevestigd als de
      gemeente waar die onderneming een nevenvestiging heeft is aangewezen in de regeling, bedoeld in [artikel 3][ref2],
      heeft het vissersvaartuig zijn thuishaven in één van deze gemeenten, overeenkomstig de keuze van de eigenaar
      bij de aanvraag, bedoeld in [artikel 6, eerste lid][ref3], onderscheidenlijk bij de mededeling, bedoeld in
      [artikel 7, eerste lid][ref4].

      3 Indien de onderneming van de eigenaar van een vissersvaartuig niet is gevestigd in een gemeente die als zodanig
      in de regeling, bedoeld in [artikel 3][ref5], is aangewezen, noch in een dergelijke gemeente een nevenvestiging
      heeft, heeft het desbetreffende vissersvaartuig zijn thuishaven in een door Onze Minister aan de wijzen en wel als
      zodanig in die regeling aangewezen gemeente. Alvorens Onze Minister tot aanwijzing overgaat, hoort hij de betrokken
      eigenaar.


