        artikel: '3'
  - number: '3'
    text: |-
      1 Bij regeling van Onze Minister worden de gemeenten aangewezen die in aanmerking komen als thuishaven voor
      vissersvaartuigen en worden de lettertekens vastgesteld waarmee die gemeenten worden aangeduid.

      2 In de regeling, bedoeld in het eerste lid, worden regels gesteld omtrent de grootte, de kleur en de plaats van de
      lettertekens en nummers.
    url: https://wetten.overheid.nl/BWBR0009353/1998-03-01#Artikel3
  - number: '4'
    text: |-
      Onze Minister houdt een register bij waarin de vissersvaartuigen onder vermelding van hun thuishaven worden
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0009353/1998-03-01#Artikel4
  - number: '5'
    text: |-
      Het is verboden een vissersvaartuig te gebruiken indien dat vaartuig niet het letterteken voert dat in de regeling,
      bedoeld in [artikel 3][ref1], is bepaald voor de gemeente waar dat vaartuig zijn thuishaven heeft, en het nummer
      waaronder het vaartuig in het visserijregister is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0009353#Artikel3
    url: https://wetten.overheid.nl/BWBR0009353/1998-03-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009353
        artikel: '3'
  - number: '6'
    text: |-
      1 De eigenaar van een vaartuig dient, alvorens het als vissersvaartuig in gebruik te nemen, een aanvraag in voor
      inschrijving in het visserijregister op een door Onze Minister vast te stellen en beschikbaar te stellen formulier.

      2 Indien het een vaartuig betreft dat in de periode van 12 maanden voorafgaande aan de aanvraag in het
      visserijregister was ingeschreven, gaat de aanvraag vergezeld van bescheiden waaruit ten genoegen van Onze
      Minister blijkt dat het vaartuig in dat jaar als vissersvaartuig is gebruikt, tenzij in dat jaar vangsten vis met
      dat vaartuig zijn geregistreerd in een door Onze Minister te houden registratiesysteem of in een door hem erkend
      registratiesysteem of -bestand.

      3 De erkenning van een registratiesysteem of -bestand, bedoeld in het tweede lid, wordt in de Staatscourant
      bekendgemaakt

      4 Inschrijving in het visserijregister vindt slechts plaats indien:

      a. het formulier, bedoeld in het eerste lid, volledig en naar waarheid is ingevuld en is ondertekend;

      b. is voldaan aan het tweede lid, en

      c. de houder van het register geen reden heeft de juistheid van de bij de aanvraag vermelde opgaven of verstrekte
      gegevens in twijfel te trekken.

      5 Van de inschrijving van een vaartuig in het visserijregister doet Onze Minister de eigenaar een bewijs toekomen.

      6 Onze Minister kan besluiten tot doorhaling van een inschrijving in het visserijregister indien blijkt dat de door
      de eigenaar van het desbetreffende vissersvaartuig bij zijn aanvraag vermelde opgaven of verstrekte gegevens niet
      overeenstemmen met de werkelijkheid.
    url: https://wetten.overheid.nl/BWBR0009353/1998-03-01#Artikel6
  - number: '7'
    text: |-
      1 Indien een vaartuig:

      a. niet meer het letterteken en nummer voert of zal voeren waaronder het in het visserijregister is ingeschreven;

      b. niet meer de eigendom is of zal zijn van de eigenaar onder wiens naam het vaartuig in het visserijregister is
      ingeschreven, of

      c. verloren is gegaan,

      doet de eigenaar onder wiens naam het betrokken vaartuig in het visserijregister is ingeschreven hiervan mededeling
      aan Onze Minister op een door Onze Minister vast te stellen en beschikbaar te stellen formulier, zo spoedig
      mogelijk, doch uiterlijk zes weken nadat de desbetreffende verandering heeft plaatsgevonden.

      2 De eigenaar van een vissersvaartuig doet aan Onze Minister op een daarvoor door Onze Minister vast te stellen
      en beschikbaar te stellen formulier mededeling van elke andere verandering, uiterlijk zes weken nadat de
      desbetreffende verandering heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0009353/1998-03-01#Artikel7
  - number: '8'
    text: |-
      1 Na ontvangst van de mededeling, bedoeld in [artikel 7][ref1], hetzij indien anders blijkt dat een verandering
      heeft plaatsgevonden besluit Onze Minister:

      a. indien het betreft een verandering als bedoeld in [artikel 7, eerste lid][ref2], tot doorhaling van de
      desbetreffende inschrijving in het visserijregister;

      b. indien het betreft een verandering als bedoeld in [artikel 7, tweede lid][ref3], tot dienovereenkomstige
      aanpassing van de betrokken gegevens in het visserijregister.

      2 Indien Onze Minister een besluit neemt als bedoeld in het eerste lid, onderdeel b, is
      [artikel 6, vijfde lid][ref4], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009353#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009353#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0009353#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0009353#Artikel6
    url: https://wetten.overheid.nl/BWBR0009353/1998-03-01#Artikel8
