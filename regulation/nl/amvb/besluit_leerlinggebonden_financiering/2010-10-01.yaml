  - number: '14'
    text: |-
      1 Onder zorg als bedoeld in de [artikelen 16][ref1], [17][ref2], [19][ref3], [20][ref4], [21][ref5], [23][ref6]
      en [27][ref7] wordt de extra zorg verstaan die is geboden of zal kunnen worden geboden door de reguliere school
      en door het samenwerkingsverband waarvan deze school deel uitmaakt, om het onderwijs aan te passen aan de
      onderwijsbeperking van de leerling, bedoeld in [artikel 13][ref8], die samenhangt met de handicap of de stoornis
      van de leerling.

      2 De zorg, bedoeld in het eerste lid, wordt beschreven in het onderwijskundig rapport. Indien deze zorg na een half
      jaar onvoldoende effect heeft gehad of zal kunnen hebben, wordt in het onderwijskundig rapport tevens beschreven:

      a. de evaluatie waar dit uit blijkt, of

      b. indien de leerling nog geen school bezoekt, de gegevens van de zorginstantie waar dit uit blijkt.

      3 Onder ondersteuning als bedoeld in de [artikelen 16][ref9], [17][ref10], [19][ref11], [20][ref12], [21][ref13]
      en [23][ref14] wordt verstaan: de ondersteuning van zorg- of hulpverleningsinstanties, die redelijkerwijs voor de
      desbetreffende stoornis beschikbaar is.


