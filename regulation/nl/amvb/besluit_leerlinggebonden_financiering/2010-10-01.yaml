  - number: '24'
    text: |-
      1 Indien een leerling op grond van de [artikelen 15 tot en met 17][ref1], en [19 tot en met 23][ref2] toelaatbaar
      zou zijn tot meer dan één onderwijssoort of toelaatbaar zou zijn tot zowel een onderwijssoort als tot cluster 4 dan
      geldt het volgende:

      a. indien het in ieder geval betreft onderwijs aan dove kinderen, dan wel het onderwijs aan slechthorende
      kinderen: dan wordt de leerling toelaatbaar verklaard tot het onderwijs aan dove, respectievelijk het onderwijs aan
      slechthorende kinderen,

      b. indien het in ieder geval betreft onderwijs aan doofblinde kinderen: dan wordt de leerling toelaatbaar verklaard
      tot het onderwijs aan doofblinde kinderen,

      c. indien het in ieder geval betreft onderwijs aan zeer moeilijk lerende kinderen: dan wordt de leerling
      toelaatbaar verklaard tot het onderwijs aan zeer moeilijk lerende kinderen,

      d. indien het in ieder geval cluster 4 betreft: dan wordt de leerling toelaatbaar verklaard tot cluster 4.

      2 Bij indicaties anders dan bedoeld in het eerste lid, beoordeelt de commissie voor de indicatiestelling op basis
      van de handicaps of de leerling toelaatbaar is tot een van de onderwijssoorten of tot cluster 4.


      [ref1]: https://wetten.overheid.nl/BWBR0014753#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0014753#Artikel19
