      1 Een leerling is toelaatbaar tot het speciaal onderwijs en het voortgezet speciaal onderwijs aan meervoudig
      gehandicapte kinderen binnen cluster 3, indien op basis van psychodiagnostisch onderzoek is vastgesteld een
      diepe stoornis in de intellectuele ontwikkeling, of een ernstige stoornis in de intellectuele ontwikkeling met
      bijbehorend zeer beperkt gedragsrepertoire en bijkomende medische of gedragsproblematiek.

      2 Een leerling is tevens toelaatbaar tot het onderwijs, bedoeld in het eerste lid, indien:

      a. de leerling voldoet aan de criteria, bedoeld in [artikel 19, eerste lid][ref1], of
      [artikel 19, tweede lid, onder a][ref2],

      b. de leerling tevens voldoet aan de criteria, bedoeld in [artikel 20, onder a][ref3], en

      c. de leerling voldoet aan de criteria, bedoeld in [artikel 20, onder b][ref4], tweede of derde graad.


