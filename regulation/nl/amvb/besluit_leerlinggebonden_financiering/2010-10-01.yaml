      Een leerling is toelaatbaar tot het speciaal onderwijs en het voortgezet speciaal onderwijs aan langdurig zieke
      kinderen met een lichamelijke handicap indien:

      a. op basis van psychodiagnostisch en medisch onderzoek is vastgesteld:

      1°. een chronische somatische stoornis;

      2°. een chronische centrale of chronische perifere neurologische stoornis; of

      3°. een chronische psychosomatische stoornis; die niet in hoofdzaak leiden tot een stoornis in motorische functies
      maar wel leiden tot een ernstige belemmering om aan onderwijs deel te nemen,

      b. sprake is van een beperking in de onderwijsparticipatie die blijkt uit:

      1°. een leerachterstand als bedoeld in [artikel 13, onder a][ref1];

      2°. structureel schoolverzuim als bedoeld in [artikel 13, onder e][ref2]; of

      3°. een zeer geringe zelfredzaamheid als bedoeld in [artikel 13, onder d][ref3], en

      c. de zorg onvoldoende effect heeft gesorteerd of zal kunnen sorteren, en de ondersteuning deelname aan het
      regulier onderwijs niet mogelijk maakt.


