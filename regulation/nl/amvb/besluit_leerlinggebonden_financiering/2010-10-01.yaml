  - number: '27'
    text: |-
      1 Bij een beoordeling van leerlingen op basis van artikel 28c, tweede lid, derde volzin, kunnen stoornissen als
      bedoeld in deze regeling worden aangetoond aan de hand van onderzoek dat tot een voorgaande indicatiestelling
      heeft geleid indien sprake is van een evident stabiel kindkenmerk. Die onderzoeksgegevens worden aangevuld met
      een recente beschrijving van de aard en de ernst van de stoornis door een deskundig lid van de commissie voor de
      begeleiding en een onderbouwing dat het om een evident stabiel kindkenmerk gaat.

      2 Bij een beoordeling van leerlingen door de commissie voor indicatiestelling als bedoeld in
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      _______________________________________________________________ (Stb. 2002, 631), kunnen stoornissen als bedoeld
      in deze regeling worden aangetoond met een recente beschrijving van de aard en de ernst van de stoornis door een
      deskundig lid van de commissie voor de begeleiding en een onderbouwing dat het om een evident stabiel kindkenmerk
      gaat. Een afschrift van het toelatingsbesluit dat opgesteld is bij eerste toelating van de leerling wordt aan deze
      beoordeling bijgevoegd. Voor leerlingen die voor 1 augustus 2003 ambulante begeleiding ontvingen zijn de eerste
      twee volzinnen van overeenkomstige toepassing.

      3 De verklaring waaruit een beperking in de onderwijsparticipatie blijkt als bedoeld in [artikel 13][ref2], en
      waaruit blijkt dat de zorg ontoereikend is, kan in de gevallen, bedoeld in het eerste en tweede lid, bestaan
      uit de evaluatie van het handelingsplan zoals bedoeld in [artikel 41a van de wet][ref3] samen met het rapport
      waarin de commissie voor de begeleiding of de reguliere school met de ambulant begeleider de beperking in de
      onderwijsparticipatie vaststelt en de zorg die de leerling nodig heeft om aan onderwijs deel te kunnen nemen
      beschrijft.


      [ref1]: https://wetten.overheid.nl/BWBR0014350#ArtikelV
      [ref2]: https://wetten.overheid.nl/BWBR0014753#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel41a
