  - number: '28'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.

      Laatstbedoeld besluit wordt niet genomen voordat vier weken zijn verstreken nadat het onderhavige besluit is
      overgelegd aan de Tweede Kamer der Staten-Generaal, en evenmin indien binnen die termijn door of namens de Tweede
      Kamer de wens te kennen wordt gegeven dat het in dit besluit geregelde onderwerp bij wet wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0014753/2010-10-01#Artikel28
