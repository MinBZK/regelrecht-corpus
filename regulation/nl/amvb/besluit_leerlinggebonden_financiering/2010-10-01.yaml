  - number: '4'
    text: |-
      1 De commissie voor de indicatiestelling bestaat uit:

      a. een voorzitter die tevens lid is van de commissie, en

      b. vier of meer andere leden.

      2 Tot de commissie voor de indicatiestelling behoren de volgende deskundigen: een onderwijsdeskundige, een als
      diagnosticus gekwalificeerd gedragswetenschapper, een jeugdarts of andere arts, en een maatschappelijk werker of
      voor zover het cluster 2 betreft, een logopedist.

      3 De commissie voor de indicatiestelling die een verzoek beoordeelt als bedoeld in
      [artikel 28c, eerste lid, aanhef, of tweede lid, derde volzin, van de wet][ref1],
      [artikel 70b van de Wet op het primair onderwijs][ref2] en
      [artikel 77b van de Wet op het voortgezet onderwijs][ref3], is samengesteld uit de voorzitter en vier andere leden.
      Het tweede lid is van toepassing.

      4 Indien dat in een uitzonderlijk geval in het belang van een goede beoordeling noodzakelijk is, kan de commissie
      in haar samenstelling, bedoeld in het derde lid, met een of meer daartoe deskundigen worden uitgebreid.

      5 De leden van de commissie voor de indicatiestelling vervullen geen nevenbetrekking of nevenwerkzaamheden die
      schadelijk zijn voor de vervulling van de functie van lid van de commissie en zij verrichten hun werkzaamheden
      zonder last of ruggespraak.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28c
