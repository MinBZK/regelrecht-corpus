      1 Een leerling is toelaatbaar tot cluster 4 indien:

      a. op basis van psychodiagnostisch of psychiatrisch onderzoek eventueel in combinatie met andere onderzoekgegevens
      over de mate waarin de problematiek een integraal karakter heeft, is vastgesteld een ernstige psychische stoornis
      of een ontwikkelingspsychopathologie volgens het classificatiesysteem DSM-IV of ICD-10, voor zover het betreft:

      1°. een emotionele stoornis;

      2°. een gedragsstoornis; of

      3°. een ontwikkelingsstoornis,

      b. de stoornis, bedoeld onder a, zich manifesteert op school, en thuis of tijdens vrijetijdsbesteding waarbij
      gerichte hulpverlening is verleend of wordt verleend door een voorziening als Jeugdhulpverlening, Jeugd-GGZ of hulp
      door een kinderpsychiatrische voorziening of Jeugdbescherming,

      c. sprake is van een beperking in de onderwijsparticipatie die blijkt uit twee in dit onderdeel bedoelde
      subonderdelen:

      1°. leerachterstanden als bedoeld in [artikel 13, onder a][ref1], die niet toe te schrijven zijn aan een beperkt
      niveau van cognitief functioneren;

      2°. ernstige tekortkomingen in verband met het gedrag als bedoeld in [artikel 13, onder g, sub 1°][ref2];

      3°. ernstige problemen in de interactie met het onderwijzend personeel als bedoeld in
      [artikel 13, onder g, sub 2°][ref3];

      4°. ernstig storend gedrag in het onderwijsleerproces van medeleerlingen als bedoeld in
      [artikel 13, onder g, sub 3°][ref4]; of

      5°. extreem agressief gedrag of extreem impulsief gedrag als bedoeld in [artikel 13, onder h][ref5], en

      d. de zorg onvoldoende effect heeft gesorteerd of zal kunnen sorteren, en de ondersteuning deelname aan het
      regulier onderwijs niet mogelijk maakt.

      2 Een leerling is tevens toelaatbaar tot cluster 4, indien:

      a. er sprake is van ernstige gedragsproblemen, die zich manifesteren op school en thuis of tijdens
      vrijetijdsbesteding, waarvoor gerichte geïndiceerde hulpverlening is verleend of wordt verleend door
      een voorziening als Jeugdhulpverlening, Jeugd-GGZ, of hulp van een kinderpsychiatrische voorziening of
      Jeugdbescherming, waarbij uit de resultaten blijkt dat na een half jaar weinig tot geen vooruitgang is geboekt,

      b. sprake is van een beperking in de onderwijsparticipatie die blijkt uit twee in dit onderdeel bedoelde
      subonderdelen:

      1°. leerachterstanden als bedoeld in [artikel 13, onder a][ref6], die niet toe te schrijven zijn aan een beperkt
      niveau van cognitief functioneren;

      2°. ernstige tekortkomingen in verband met het gedrag als bedoeld in [artikel 13, onder g, sub 1°][ref7];

      3°. ernstige problemen in de interactie met het onderwijzend personeel als bedoeld in
      [artikel 13, onder g, sub 2°][ref8];

      4°. ernstig storend gedrag in het onderwijsleerproces van medeleerlingen als bedoeld in
      [artikel 13, onder g, sub 3°][ref9]; of

      5°. extreem agressief gedrag of extreem impulsief gedrag als bedoeld in [artikel 13, onder h][ref10], en

      c. de zorg onvoldoende effect heeft gesorteerd of zal kunnen sorteren, en de ondersteuning deelname aan het
      regulier onderwijs niet mogelijk maakt.

      3 Een jongere afkomstig uit een justitiële jeugdinrichting is toelaatbaar tot cluster 4, indien de ouders het
      bewijs van inschrijving bij de school in de justitiële jeugdinrichting overleggen aan de commissie voor de
      indicatiestelling.


