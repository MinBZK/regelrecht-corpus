      1 Een leerling is toelaatbaar tot het speciaal onderwijs en het voortgezet speciaal onderwijs aan doofblinde
      kinderen, indien deze leerling geen diepe of ernstige stoornis in de intellectuele ontwikkeling als bedoeld in
      [artikel 22, eerste lid][ref1], heeft, waarbij rekening is gehouden met leerlingkenmerken en:

      a. op basis van multidisciplinair onderzoek is vastgesteld dat deze leerling:

      1°. een gehoorstoornis heeft van 35 decibel of meer bij het beste oor zonder gehoortoestel of indien van toepassing
      met gebruik van het cochleair implantaat; en

      2°. een visuele beperking heeft van ten minste 0.3 gezichtsscherpte of een diameter gezichtsveld heeft van minder
      dan 30 graden gemeten bij het beste oog, waarbij het gezichtsvermogen gecorrigeerd is;

      b. op basis van medisch onderzoek een syndroom bij deze leerling is vastgesteld dat:

      1°. bekend is met gehoorverlies en verlies van het gezichtsvermogen al dan niet progressief; en

      2°. leidt tot een ernstige beperking om deel te nemen aan het onderwijs; of

      c. op basis van medisch onderzoek een syndroom of een neurologisch deficit bij deze leerling is vastgesteld dat
      leidt tot een beperking in de onderwijsparticipatie en waardoor op neurologische basis:

      1°. problemen aan het gezichtsvermogen ontstaan; en

      2°. gehoorproblemen ontstaan; of

      3°. ernstige problemen in de auditieve en visuele verwerking.

      2 Van een multidisciplinair onderzoek als bedoeld in het eerste lid, onderdeel a, is sprake, indien naast een
      psychologisch of orthopedagogisch onderzoek in ieder geval is uitgevoerd:

      a. een audiologisch onderzoek;

      b. een visueel onderzoek; en

      c. een medisch onderzoek naar neurologische stoornissen.


      [ref1]: https://wetten.overheid.nl/BWBR0014753#Artikel22
