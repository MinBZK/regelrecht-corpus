  - number: '25'
    text: |-
      1 Een leerling bij wie een stoornis is vastgesteld die gepaard gaat met een structurele beperking in de
      onderwijsparticipatie die niet leidt tot toelaatbaarheid op grond van de [artikelen 15 tot en met 23][ref1], is
      eveneens toelaatbaar tot een van de onderwijssoorten in cluster 2 of 3, dan wel tot cluster 4 indien de ernst
      van de stoornis en de beperking in de onderwijsparticipatie vergelijkbaar zijn met die van de op grond van
      [artikel 15 tot en met 23][ref2] toelaatbare leerlingen. De aard van de stoornis(sen) en de aard van de beperking
      in de onderwijsparticipatie zijn in dat geval bepalend voor de onderwijssoort waarvoor de leerling toelaatbaar is.

      2 Een leerling bij wie een progressieve stoornis is vastgesteld die niet leidt tot toelaatbaarheid op grond van
      de [artikelen 15 tot en met 23][ref3], is toelaatbaar tot een van de onderwijssoorten in cluster 2 of 3, dan wel
      tot cluster 4 indien zich als gevolg van die stoornis, een structurele beperking in de onderwijsparticipatie als
      bedoeld in [artikel 13][ref4], zal voordoen binnen zes tot twaalf maanden na indiening van het verzoek, bedoeld
      in [artikel 28c, eerste lid, aanhef, van de wet][ref5]. De progressieve stoornis is in dat geval bepalend voor de
      onderwijssoort waartoe de leerling toelaatbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0014753#Artikel15
