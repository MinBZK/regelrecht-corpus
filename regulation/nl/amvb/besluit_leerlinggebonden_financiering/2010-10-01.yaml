  - number: '12'
    text: |-
      Een leerling komt in aanmerking voor een leerlinggebonden budget en is toelaatbaar tot een van de onderwijssoorten
      in cluster 2 of 3, dan wel tot cluster 4, in de zin van [artikel 28c, eerste lid, van de wet][ref1] indien wordt
      voldaan aan de criteria, bedoeld in de [artikelen 15 tot en met 23][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28c
      [ref2]: https://wetten.overheid.nl/BWBR0014753#Artikel15
