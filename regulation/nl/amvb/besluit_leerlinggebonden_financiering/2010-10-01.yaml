  - number: '11'
    text: |-
      1 Het aantal schooljaren waarop het oordeel van de commissie voor de indicatiestelling, bedoeld in
      [artikel 28c, tweede lid, eerste volzin, van de wet][ref1] betrekking heeft, is

      a. indien het betreft de toelaatbaarheid tot het speciaal onderwijs of voortgezet speciaal onderwijs aan:

      1°. dove kinderen: 4 schooljaren;

      2°. slechthorende kinderen: 3 schooljaren;

      3°. kinderen met ernstige spraakmoeilijkheden die niet tevens behoren tot de onder 1° of onder 2° bedoelde
      kinderen: 3 schooljaren;

      4°. lichamelijk gehandicapte kinderen: 3 schooljaren;

      5°. langdurig zieke kinderen met een lichamelijke handicap: 3 schooljaren;

      6°. langdurig zieke kinderen anders dan met een lichamelijke handicap: 3 schooljaren;

      7°. zeer moeilijk lerende kinderen: 4 schooljaren;

      8°. meervoudig gehandicapte kinderen: 4 schooljaren, en

      b. indien het betreft de toelaatbaarheid tot cluster 4: 3 schooljaren voor alle tot cluster 4 behorende
      onderwijssoorten.

      2 Indien het de toelaatbaarheid van een kind met het syndroom van Down betreft voor de onderwijssoort
      zeer moeilijk lerende kinderen, ziet het oordeel van de commissie voor de indicatiestelling in
      afwijking van het eerste lid op de schooljaren waarvoor het kind ingeschreven staat bij een school
      als bedoeld in [artikel 1 van de Wet op het primair onderwijs][ref2], [artikel 1 van de wet][ref3] en
      [artikel 1 van de Wet op het voortgezet onderwijs][ref4], en op de studiejaren waarvoor het betreffende kind
      deelnemer is als bedoeld in [artikel 2.2.5 van de Wet educatie en beroepsonderwijs][ref5].

      3 Indien het de toelaatbaarheid van een jongere afkomstig uit een justitiële jeugdinrichting betreft en deze
      jongere toelaatbaar is op grond van [artikel 23, derde lid][ref6], ziet het oordeel van de commissie voor de
      indicatiestelling in afwijking van het eerste lid op een periode van één schooljaar aansluitend op de periode dat
      deze jongere in een justitiële jeugdinrichting heeft gezeten. Indien het oordeel in de loop van een schooljaar
      wordt gegeven, wordt de periode tot de eerste dag van het eerstvolgende schooljaar toegevoegd aan de in de eerste
      volzin bedoelde periode.


