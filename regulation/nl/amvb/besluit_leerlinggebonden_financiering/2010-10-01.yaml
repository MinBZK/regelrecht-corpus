      1 Een leerling is toelaatbaar tot het speciaal onderwijs en het voortgezet speciaal onderwijs aan meervoudig
      gehandicapte dove kinderen binnen cluster 2, indien:

      a. op basis van audiologisch onderzoek is vastgesteld een gehoorstoornis van meer dan 70 decibel bij het beste oor
      zonder gehoortoestel, en

      b. op basis van psychodiagnostisch onderzoek dat individueel is afgenomen en rekening houdt met de kenmerken van de
      leerling, is vastgesteld een intelligentiequotiënt lager dan 70.

      2 Een leerling is toelaatbaar tot het speciaal onderwijs en het voortgezet speciaal onderwijs aan meervoudig
      gehandicapte slechthorende kinderen binnen cluster 2, indien:

      a. op basis van audiologisch onderzoek is vastgesteld een gehoorstoornis tussen 35 decibel en 71 decibel bij het
      beste oor zonder gehoortoestel, en

      b. wordt voldaan aan het eerste lid, onder b.

      3 Bij leerlingen met een cochleair implantaat wordt het gehoor twee jaar na operatie vastgesteld met gebruik van
      het cochleair implantaat.
    url: https://wetten.overheid.nl/BWBR0014753/2010-10-01#Artikel18
  - number: 18a
