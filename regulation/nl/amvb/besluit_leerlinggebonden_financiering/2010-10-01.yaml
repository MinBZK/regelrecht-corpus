      1 De gebieden, bedoeld in [artikel 28b, tweede lid, van de wet][ref1] zijn de in [bijlage A van dit besluit][ref2]
      opgenomen gebieden.

      2 Bij wijziging van een of meer gemeentenamen als gevolg van een herindeling op grond van
      [artikel 3, eerste lid, van de Wet algemene regels herindeling][ref3] die de indeling in gebieden, bedoeld in het
      eerste lid, niet wijzigt, treedt de naam van de nieuwe gemeente dan wel treden de namen van de nieuwe gemeenten op
      de datum van de herindeling in de plaats van de betreffende, in [bijlage A van dit besluit][ref4] opgenomen naam
      dan wel namen.

      3 Indien op grond van [artikel 158, eerste lid, van de Gemeentewet][ref5] de naam van een gemeente
      wordt gewijzigd, treedt de gewijzigde naam op het moment van de naamswijziging in de plaats van de in
      [bijlage A van dit besluit][ref6] opgenomen oorspronkelijke naam.


