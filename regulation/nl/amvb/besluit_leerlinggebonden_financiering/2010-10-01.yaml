articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      Onze minister: Onze minister van Onderwijs, Cultuur en Wetenschap;

      wet: [Wet op de expertisecentra][ref1];

      cluster: een cluster als bedoeld in [artikel 2, vierde lid, van de wet][ref2];

      commissie voor de indicatiestelling: een commissie als bedoeld in
      [artikel 28b, zesde lid, onder a, van de wet][ref3];

      Regionaal expertisecentrum: een expertisecentrum als bedoeld in
      [artikel 28b, eerste lid, van de Wet op de expertisecentra][ref4];

      DSM-IV: het classificatiesysteem voor psychische stoornissen volgens Diagnostic and Statistical Manual of Mental
      Disorders, 4th Edition (American Psychiatric Association, 1997);

      ICD-10: het classificatiesysteem voor psychische stoornissen volgens International Classification of Diseases;
      classificatie van ziekten en met gezondheid verbandhoudende problemen; 10e revisie (World Health Organisation,
      Genève, 1992);

      Cochleair implantaat: een electronische prothese die het buiten-, midden- en binnenoor overbrugt. Het zet geluid om
      in electrische pulsen die de gehoorzenuw stimuleren;

      Jeugd-GGZ: de geestelijke gezondheidszorg voor kinderen en jeugdigen, is onderdeel van de jeugdzorg;

      onderwijskundig rapport: onderwijskundig rapport als bedoeld in [artikel 43 van de wet][ref5] en de
      [artikelen 42][ref6] en [43 van de Wet op het primair onderwijs][ref7];

      LG: lichamelijk gehandicapte kinderen voor wie vaststaat dat zij overwegend op een orthopedagogische en
      orthodidactische benadering aangewezen zijn;

      LZK: langdurig somatisch zieke kinderen voor wie vaststaat dat zij overwegend op een orthopedagogische en
      orthodidactische benadering aangewezen zijn;

      ZMLK: zeer moeilijk lerende kinderen voor wie vaststaat dat zij overwegend op een orthopedagogische en
      orthodidactische benadering aangewezen zijn.


