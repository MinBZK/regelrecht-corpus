      1 Een leerling is toelaatbaar tot het speciaal onderwijs aan kinderen met ernstige spraakmoeilijkheden, indien:

      a. op basis van logopedisch en psychodiagnostisch onderzoek gericht op het communicatief en cognitief functioneren,
      zo nodig aangevuld met audiologisch onderzoek, is vastgesteld:

      1°. spraak- of taalstoornissen, die niet toe te schrijven zijn aan een beperkt niveau van cognitief functioneren,
      op het gebied van spraakproblematiek, problemen in de auditieve verwerking, grammaticale problematiek, of lexicaal-
      semantische problematiek, bij welke stoornissen uit tests voor tenminste twee van de vier genoemde gebieden een
      afwijking naar beneden in spraak-taalontwikkeling van meer dan anderhalve standaarddeviatie blijkt; of

      2°. een algemene spraak-taalstoornis die niet toe te schrijven is aan een beperkt niveau van cognitief
      functioneren, op het gehele gebied van spraakproblematiek, problemen in de auditieve verwerking, grammaticale
      problematiek, of lexicaal-semantische problematiek, bij welke stoornis uit de totaalscore op algemene tests voor
      spraak-taalproblematiek deviatie naar beneden in spraak-taalontwikkeling van meer dan twee standaarddeviaties
      blijkt,

      b. gerichte spraak- of taaltherapie van een half jaar geen vooruitgang heeft opgeleverd, ofwel een ernstige
      stoornis, die indien van toepassing volgens het classificatiesysteem DSM-IV of ICD-10 is vastgesteld en de
      beperking, bedoeld onder c, negatief beïnvloedt,

      c. sprake is van een beperking in de onderwijsparticipatie die blijkt uit:

      1°. een leerachterstand als bedoeld in [artikel 13, onder a][ref1]; of

      2°. een zeer geringe communicatieve redzaamheid als bedoeld in [artikel 13, onder b][ref2], en

      d. de zorg onvoldoende effect heeft gesorteerd of zal kunnen sorteren, en de ondersteuning deelname aan het
      regulier onderwijs niet mogelijk maakt.

      2 Een leerling is tevens toelaatbaar tot het onderwijs, bedoeld in het eerste lid, aanhef, indien:

      a. een stoornis uit het autismespectrum is vastgesteld volgens de classificatiesysteem DSM-IV, waarbij de verbale
      communicatieve beperking op de voorgrond staat, blijkend uit onderzoeksgegevens die wijzen op ernstige achterstand
      in lexicaal-semantische kennisontwikkeling of pragmatiek,

      b. de zorg onvoldoende effect heeft gesorteerd of zal kunnen sorteren, en de ondersteuning als deelname aan het
      regulier onderwijs niet mogelijk maakt, en

      c. sprake is van een beperking als bedoeld in het eerste lid, onder b.


