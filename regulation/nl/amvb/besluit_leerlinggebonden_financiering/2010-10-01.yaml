  - number: '26'
    text: |-
      1 Voor het vaststellen van de stoornissen en beperkingen genoemd in de [artikelen 14 tot en met 22][ref1] worden
      betrouwbare onderzoeksgegevens gebruikt. Wanneer het een diagnose betreft die een aantal symptomen samenvat,
      dan is voor de indicatiestelling een heldere omschrijving nodig van de aard van de problemen, de mate waarin de
      leerling beperkt wordt bij het volgen van onderwijs en die waar van toepassing geclassificeerd zijn op basis van de
      classificatiesystemen DSM-IV of ICD-10.

      2 De onderzoeksgegevens bedoeld in het eerste lid zijn betrouwbaar indien:

      a. het onderzoek is uitgevoerd door een daartoe bevoegde deskundige;

      b. het onderzoek is uitgevoerd met een door de beroepsgroep als geschikt aangemerkt onderzoeksinstrumentarium;

      c. gegevens bij indiening van het verzoek op grond van [artikel 28c, eerste lid, van de wet][ref2] niet ouder zijn
      dan een jaar, of in geval van psychiatrisch of psychodiagnostisch onderzoek twee jaar, tenzij het gegevens betreft
      over evident stabiele leerlingkenmerken, en

      d. gegevens in het onderwijskundig rapport van de school waar een leerling staat ingeschreven zo recent mogelijk
      zijn, maar niet ouder dan zes maanden.

      3 Waar mogelijk worden reeds beschikbare onderzoeksgegevens, bedoeld in het eerste lid, gebruikt uit de
      gezondheidszorg, jeugdzorg, justitie, de zorgstructuur van het regulier onderwijs of de schoolbegeleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0014753#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel28c
