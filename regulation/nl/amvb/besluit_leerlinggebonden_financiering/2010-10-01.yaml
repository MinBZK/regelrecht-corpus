  - number: '13'
    text: |-
      Een leerling heeft een beperking in de mogelijkheid tot participatie in het onderwijs wanneer in die gevallen dat
      er sprake is van:

      a. een leerachterstand in het basis onderwijs en bij instroom in de eerste klas van het voortgezet onderwijs,
      blijkend uit resultaten in het onderwijskundig rapport, zodanig dat de prestaties van de leerling in het
      basisonderwijs en bij instroom in het voortgezet onderwijs in vergelijking met de prestaties van leerlingen van de
      overeenkomstige didactische leeftijdsgroep, behoren tot de 10 procent zwakst presterende leerlingen op twee van de
      drie volgende terreinen:

      1°. voor groep 1 en 2 voorbereidend lezen, spellen en rekenen;

      2°. voor groep 3 tot en met groep 8 rekenen, technisch lezen of spellen, en begrijpend lezen; en

      3°. bij de instroom in het voortgezet onderwijs rekenen, technisch lezen of spellen, en begrijpend lezen,

      b. een zeer geringe communicatieve redzaamheid bij de leerling die voor cluster 2 wordt aangemeld, die op basis van
      een logopedisch of een psychodiagnostisch onderzoek is vastgesteld en blijkt uit resultaten in het onderwijskundig
      rapport indien de leerling naar school gaat, zodanig dat de leerling een zeer beperkt vermogen heeft om wederkerig
      te communiceren met behulp van woord en gebaar en dit beperkte vermogen zich manifesteert in gesprekken in diverse
      situaties vanaf de periode dat de leerling leerde spreken en niet is te verklaren uit de ontwikkelingscontext van
      de leerling,

      c. een zeer geringe sociale redzaamheid bij de leerling met een IQ tussen 54 en 70 die voor ZMLK onderwijs wordt
      aangemeld. De mate van sociale redzaamheid wordt vastgesteld op basis van een psychodiagnostisch onderzoek met
      onderzoeksgegevens, waaruit blijkt dat de leerling een zeer ernstige ontwikkelingsachterstand heeft op het gebied
      van sociale redzaamheid, en niet zelfstandig op een reguliere school kan functioneren,

      d. een zeer geringe zelfredzaamheid bij de leerling die voor cluster 3 LG/LZK wordt aangemeld, die op basis van
      medisch of psychodiagnostisch onderzoek is vastgesteld, waarbij de leerling ook met gebruikmaking van technische
      hulpmiddelen afhankelijk is van een ander voor de algemene dagelijkse levensverrichtingen of de voor het onderwijs
      voorwaardelijke, fijnmotorische en motorische activiteiten en handelingen,

      e. structureel schoolverzuim bij de leerling die voor cluster 3 LG/LZK wordt aangemeld, blijkend uit het
      onderwijskundig rapport met een verzuimregistratie van het afgelopen jaar of een behandelschema van zorgverleners,
      waarbij de leerling 25 procent van de verplichte onderwijstijd verzuimt als gevolg van de stoornis of in verband
      met de benodigde zorg terzake van de stoornis,

      f. ontbrekende leervoorwaarden of leerachterstand bij leerlingen met een IQ tussen 54 en 70 die voor ZMLK worden
      aangemeld:

      1°. voor kinderen tot en met 7 jaar het ontbreken van algemene leervoorwaarden, blijkend uit ernstige
      tekortkomingen in eigenschappen die noodzakelijk zijn om deel te kunnen nemen aan regulier onderwijs: voor de
      leerling die nog niet naar school gaat of voor de leerling uit groep 1 en 2, voor deze laatste blijkend uit
      gegevens van het onderwijskundig rapport, zodanig dat sprake is van ernstige tekortkomingen op het gebied van het
      leer- en taakgedrag, zoals werkhouding, taakgerichtheid, aandacht en motivatie, waarbij uit rapportages blijkt dat
      de leerling gedurende een jaar zeer geringe vooruitgang heeft geboekt;

      2°. voor kinderen van 8 tot 12 jaar een zeer geringe vooruitgang gedurende een jaar op de gebieden van aanvankelijk
      lezen, spellen en rekenen die blijkt uit een didactisch toetsoverzicht van tenminste een jaar met ruwe toetsscores;
      of

      3°. voor leerlingen van 12 jaar en ouder schoolvorderingen die niet verder gaan dan beheersing van de leerstof tot
      en met eind groep 3,

      g. het ontbreken van algemene voorwaarden wat betreft het leer- of werkgedrag van de leerling blijkend uit gegevens
      van een psychodiagnostisch onderzoek niet ouder dan een jaar en uit het onderwijskundig rapport zodanig dat er
      sprake is van:

      1°. ernstige tekortkomingen in verband met het gedrag op het gebied van het leer- en taakgedrag zoals werkhouding,
      taakgerichtheid, aandacht en motivatie;

      2°. ernstige problemen in de interactie met het onderwijsgevend personeel; of

      3°. ernstig storend gedrag in het onderwijsleerproces van medeleerlingen, waarbij de genoemde problemen manifest
      zijn gedurende ten minste een half jaar, zich niet beperken tot een bepaalde situatie en weinig of niet worden
      beïnvloed door op de problemen gerichte aanpak en afspraken, of

      h. extreem agressief gedrag of extreem impulsief gedrag bij de leerling die voor cluster 4 wordt aangemeld, waarbij
      op basis van psychodiagnostisch onderzoek blijkt dat de leerling een gevaar voor zichzelf of voor anderen is of
      extreem fysiek of extreem verbaal agressief gedrag vertoont, waarbij dit gedrag zich niet beperkt tot een bepaalde
      situatie en weinig of niet wordt beïnvloed door op de problemen gerichte aanpak en afspraken.
