    text: |-
      1 Een leerling is toelaatbaar tot het speciaal onderwijs en het voortgezet speciaal onderwijs aan dove kinderen,
      indien op basis van audiologisch onderzoek, zo nodig aangevuld met logopedisch onderzoek of een onderzoek van de
      behandelend arts, gericht op de vraag of de leerling dooffunctionerend is, is vastgesteld:

      a. een gehoorstoornis van 80 decibel of meer bij het beste oor zonder gehoortoestel, of

      b. een gehoorstoornis tussen 70 decibel en 80 decibel bij het beste oor zonder gehoortoestel waarbij de leerling
      kennelijk dooffunctionerend is.

      2 Een leerling met een cochleair implantaat is toelaatbaar tot het onderwijs, bedoeld in het eerste lid, indien
      is vastgesteld:

      a. dat de leerling, met gebruikmaking van het cochleair implantaat dat ten minste twee jaar eerder is aangebracht,
      kennelijk dooffunctionerend is; en

      b. dat er sprake is van een zeer geringe verbale communicatieve redzaamheid, zodanig dat bij de leerling
      betekenisverlening aan geluid niet of nauwelijks tot stand komt en dat de leerling niet of nauwelijks in staat is
      om door middel van gesproken taal te reageren.

      3 De vaststelling op grond van het tweede lid, onderdelen a en b, geschiedt op basis van een audiologisch onderzoek
      aangevuld met een logopedisch onderzoek of een door een gedragsdeskundige gemaakte beschrijving van de wijze waarop
      de leerling het cochleair implantaat gebruikt.
    url: https://wetten.overheid.nl/BWBR0014753/2010-10-01#Artikel15
  - number: '16'
    text: |-
      1 Een leerling is toelaatbaar tot het speciaal onderwijs en het voortgezet speciaal onderwijs aan slechthorende
      kinderen, indien:

      a. op basis van audiologisch onderzoek een gehoorstoornis, niet zijnde een gehoorstoornis als bedoeld in artikel
      15, eerste lid, onderdeel b, is vastgesteld tussen 35 decibel en 80 decibel bij het beste oor zonder gehoortoestel;

      b. sprake is van een beperking in de onderwijsparticipatie die blijkt uit:

      1°. een leerachterstand als bedoeld in [artikel 13, onder a][ref1]; of

      2°. een zeer geringe communicatieve redzaamheid als bedoeld in [artikel 13, onder b][ref2]; en

      c. de zorg onvoldoende effect heeft gesorteerd of zal kunnen sorteren, en de ondersteuning deelname aan het
      regulier onderwijs niet mogelijk maakt.

      2 Het eerste lid is van overeenkomstige toepassing op een leerling met een cochleair implantaat dat ten minste 2
      jaar eerder is aangebracht met dien verstande dat:

      a. het audiologische onderzoek is aangevuld met een logopedisch onderzoek of met een door een gedragsdeskundige
      gemaakte beschrijving van de wijze waarop de leerling het cochleair implantaat gebruikt; en

      b. de leerling wat betreft de communicatie is aangewezen op het gesproken Nederlands aangevuld met gebaren.

      3 Een leerling van 12 jaar of ouder is tevens toelaatbaar tot het speciaal onderwijs en het voortgezet speciaal
      onderwijs aan slechthorende kinderen, indien:

      a. op basis van logopedisch en psychodiagnostisch onderzoek gericht op het communicatief en cognitief functioneren,
      zo nodig aangevuld met audiologisch onderzoek, is vastgesteld:

      1°. spraak- of taalstoornissen, die niet toe te schrijven zijn aan een beperkt niveau van cognitief functioneren,
      op het gebied van spraakproblematiek, problemen in de auditieve verwerking, grammaticale problematiek, of lexicaal-
      semantische problematiek, bij welke stoornissen uit tests voor tenminste twee van de vier genoemde gebieden een
      afwijking naar beneden in spraak-taalontwikkeling van meer dan anderhalve standaarddeviatie blijkt; of

      2°. een algemene spraak of taalstoornis die niet toe te schrijven is aan een beperkt niveau van cognitief
      functioneren, op het gehele gebied van spraak of taalstoornissen, namelijk spraakproblematiek, problemen in de
      auditieve verwerking, grammaticale problematiek en lexicaal-semantische problematiek, bij welke stoornis uit de
      totaalscore op algemene tests voor spraak-taalproblematiek een afwijking naar beneden in spraak-taalontwikkeling
      van meer dan twee standaarddeviaties blijkt,

      b. sprake is van een beperking als bedoeld in het eerste lid, onder b, en

      c. gerichte spraak- of taaltherapie van een half jaar geen vooruitgang heeft opgeleverd, ofwel een ernstige
      stoornis, die indien van toepassing volgens het classificatiesysteem DSM-IV of ICD-10 is vastgesteld en de
      beperking, bedoeld in het eerste lid, onder b, negatief beïnvloedt,

      d. de zorg onvoldoende effect heeft gesorteerd of zal kunnen sorteren, en de ondersteuning deelname aan het
      regulier onderwijs niet mogelijk maakt.

      4 Een leerling van 12 jaar of ouder is tevens toelaatbaar tot het onderwijs, bedoeld in het eerste lid, aanhef,
      indien:

      a. een stoornis uit het autismespectrum is vastgesteld volgens het classificatiesysteem DSM IV waarbij de verbale
      communicatieve beperking op de voorgrond staat, blijkend uit onderzoeksgegevens die wijzen op ernstige achterstand
      in lexicaal-semantische kennisontwikkeling of pragmatiek,

      b. sprake is van een beperking als bedoeld in het eerste lid, onder b, en

      c. de zorg onvoldoende effect heeft gesorteerd of zal kunnen sorteren, en de ondersteuning deelname aan het
      regulier onderwijs niet mogelijk maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0014753#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0014753#Artikel13
