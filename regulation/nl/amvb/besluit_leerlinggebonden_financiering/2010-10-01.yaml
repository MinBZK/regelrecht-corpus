      1 Een leerling is toelaatbaar tot het speciaal onderwijs en het voortgezet speciaal onderwijs aan zeer moeilijk
      lerende kinderen, indien op basis van psychodiagnostisch onderzoek dat individueel is afgenomen en rekening houdt
      met de kenmerken van de leerling, is vastgesteld een intelligentiequotiënt lager dan 55, niet zijnde een diepe of
      ernstige stoornis als bedoeld in [artikel 22, eerste lid][ref1].

      2 Een leerling is tevens toelaatbaar tot het onderwijs, bedoeld in het eerste lid, indien:

      a. op basis van psychodiagnostisch onderzoek dat individueel is afgenomen en rekening houdt met de kenmerken van de
      leerling, een intelligentiequotiënt tussen 54 en 70 is vastgesteld,

      b. sprake is van een beperking in de onderwijsparticipatie die blijkt uit:

      1°. een leerachterstand of het ontbreken van algemene leervoorwaarden als bedoeld in [artikel 13, onder f][ref2];
      en

      2°. een zeer geringe sociale redzaamheid als bedoeld in [artikel 13, onder c][ref3],

      c. voor leerlingen tot en met 7 jaar een stoornis is vastgesteld, indien van toepassing volgens het
      classificatiesysteem DSM-IV of ICD-10, die de beperking, bedoeld onder b, ernstig negatief beïnvloedt, en

      d. de zorg onvoldoende effect heeft gesorteerd of zal kunnen sorteren, en de ondersteuning deelname aan het
      regulier onderwijs niet mogelijk maakt.

      3 Een leerling is tevens toelaatbaar tot het onderwijs, bedoeld in het eerste lid, indien uit een verklaring van
      een arts blijkt dat er bij de leerling sprake is van het syndroom van Down.


