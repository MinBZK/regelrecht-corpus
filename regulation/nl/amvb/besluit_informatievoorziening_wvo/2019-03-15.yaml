preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs, Cultuur en Wetenschappen, T. Netelenbos, van 1 juli
    1997, nr. 97010805/3709, directie Wetgeving en Juridische Zaken, gedaan mede namens Onze Minister van Landbouw,
    Natuurbeheer en Visserij;

    Gelet op de artikelen 103 en 103a van de Wet op het voortgezet onderwijs;

    De Raad van State gehoord (advies van 17 september 1997, nr. WO5.97.0394);

    Gezien het nader rapport van de Staatssecretaris van Onderwijs, Cultuur en Wetenschappen, T. Netelenbos, van 2
    oktober 1997 nr. 1997/23520 (3709), directie Wetgeving en Juridische Zaken, uitgebracht mede namens Onze Minister
    van Landbouw, Natuurbeheer en Visserij;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#ArtikelAanhef
articles:
  - number: '1'
    text: 'Dit besluit verstaat onder:'
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel1
  - number: 1.a
    text: |-
      de wet: de [Wet op het voortgezet onderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002399
  - number: 1.b
    text: 'Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschap;'
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel1
  - number: 1.c
    text: 'school: een school voor voortgezet onderwijs, tenzij het tegendeel blijkt;'
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel1
  - number: 1.d
    text: 'bevoegd gezag: voor wat betreft'
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel1
  - number: 1.d.1
    text: |-
      een openbare school in stand gehouden door een gemeente: het college van burgemeester en wethouders, voor zover
      de raad niet anders bepaalt, en indien de raad dit wenselijk oordeelt, met inachtneming van door hem te stellen
      regelen,
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel1
  - number: 1.d.2
    text: |-
      een openbare school in stand gehouden door een openbaar lichaam: het krachtens de desbetreffende gemeenschappelijke
      regeling bevoegde orgaan, en
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel1
  - number: 1.d.3
    text: 'een bijzondere school: het schoolbestuur;'
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel1
  - number: 1.e
    text: |-
      samenwerkingsverband: een samenwerkingsverband als bedoeld in
      [artikel 1 van de Wet op het voortgezet onderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel1
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '1'
  - number: 1.f
    text: |-
      lerarenregister: lerarenregister als bedoeld in [artikel 41a van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel41a
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 41a
  - number: 1.g
    text: |-
      registervoorportaal: registervoorportaal als bedoeld in [artikel 41o van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel41o
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 41o
  - number: 1a
    text: |-
      Bij de gegevensverstrekking op grond van [artikel 103a1 van de wet][ref1] maakt het bevoegd gezag gebruik van het
      burgerservicenummer, bedoeld in [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref2],
      van een lid van het personeel of gewezen personeel van de school.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel103a1
      [ref2]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 103a1
      - id: ref2
        bwb_id: BWBR0022428
        artikel: '1'
  - number: '2'
    text: |-
      De gegevens, bedoeld in de [artikelen 103a][ref1] en [103a1 van de wet][ref2], waarover een bevoegd gezag
      of een samenwerkingsverband beschikt, worden gedefinieerd en geordend volgens de voorschriften vermeld in
      [bijlage 1][ref3] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel103a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel103a1
      [ref3]: https://wetten.overheid.nl/BWBR0008948
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 103a
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 103a1
      - id: ref3
        bwb_id: BWBR0008948
  - number: '3.1'
    text: |-
      Bij ministeriële regeling wordt een nadere invulling gegeven van de gegevens, bedoeld in [bijlage 1][ref1] bij
      dit besluit, en van de wijze waarop de gegevens beschikbaar worden gesteld. Tevens kan een nadere invulling
      worden gegeven van de gegevens die betrekking hebben op verstrekte aanvullende bekostiging en de wijze waarop deze
      gegevens worden gedefinieerd, geordend en beschikbaar gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008948
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008948
  - number: '3.2'
    text: |-
      Daarbij wordt aangegeven welke gevraagde gegevens van belang zijn voor de berekening van de hoogte van de
      bekostiging als bedoeld in [artikel 103a van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel103a
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 103a
  - number: '3.3'
    text: |-
      In voorkomende gevallen kan Onze Minister bij het verzoek om beschikbaarstelling reeds bij hem bekende gegevens
      opnemen.
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel3
  - number: '4'
    text: |-
      Bij ministeriële regeling kan in spoedeisende gevallen een aanvullende vragenlijst ten aanzien van bekostiging
      worden vastgesteld ter beantwoording door het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel4
  - number: 4a.1
    text: |-
      De gegevens in het lerarenregister of het registervoorportaal betreffende de benoeming of tewerkstelling zonder
      benoeming als bedoeld in [artikel 41f, eerste lid, onder c][ref1], of [artikel 41p, eerste lid, van de wet][ref2]
      bestaan naast de ingangsdatum, van de benoeming of tewerkstelling zonder benoeming uit:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel41f
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel41p
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 41f
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 41p
  - number: 4a.1.a
    text: 'indien van toepassing: de einddatum van de benoeming of tewerkstelling zonder benoeming;'
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel4a
  - number: 4a.1.b
    text: 'de begindatum, en indien van toepassing: en einddatum van de arbeidsovereenkomst;'
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel4a
  - number: 4a.1.c
    text: de betreffende benoemingsgrondslag in de wet; en
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel4a
  - number: 4a.1.d
    text: |-
      voor het registervoorportaal, wat betreft het gegeven betreffende het onderwijs: de aanduiding leraar voortgezet
      onderwijs en de onderdelen of de vakken waarvoor hij in registervoorportaal wordt opgenomen.
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel4a
  - number: 4a.2
    text: |-
      De gegevens, bedoeld in [artikel 41f, eerste lid, onder d, van de wet][ref1] betreffende de school waaraan
      een leraar die in het lerarenregister of het registervoorportaal zijn opgenomen, worden onderscheiden in de
      registratienummers van de school, en indien van toepassing de registratienummers van de vestigingen van de school,
      en bestaan per registratienummer uit:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel41f
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 41f
  - number: 4a.2.a
    text: de naam van de school of de vestiging van de school;
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel4a
  - number: 4a.2.b
    text: het adres, de postcode en plaats;
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel4a
  - number: 4a.2.c
    text: het telefoonnummer en e-mailadres.
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel4a
  - number: 4a.3
    text: |-
      De gegevens betreffende het onderwijs waarvoor de leraar kan opgaan voor herregistratie als bedoeld in
      [artikel 41f, eerste lid, onder e, van de wet][ref1] bestaan uit de aanduiding leraar voortgezet onderwijs en de
      onderdelen of de vakken waarvoor hij opgaat voor herregistratie.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel41f
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 41f
  - number: 4c.1
    text: |-
      De gegevens betreffende de benoeming of tewerkstelling zonder benoeming die op grond van
      [artikel 41n, tweede lid, onder b][ref1], of [artikel 41s, tweede lid, onder b, van de wet][ref2] worden verstrekt,
      bestaan naast de ingangsdatum van de benoeming of tewerkstelling zonder benoeming uit:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel41n
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel41s
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel4c
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 41n
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 41s
  - number: 4c.1.a
    text: 'indien van toepassing: de einddatum van de benoeming of tewerkstelling zonder benoeming;'
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel4c
  - number: 4c.1.b
    text: 'de begindatum en, indien van toepassing: de einddatum van de arbeidsovereenkomst;'
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel4c
  - number: 4c.1.c
    text: de betreffende benoemingsgrondslag in de wet; en
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel4c
  - number: 4c.1.d
    text: |-
      voor het registervoorportaal, wat betreft het gegeven betreffende het onderwijs: de aanduiding leraar voortgezet
      onderwijs en de onderdelen of de vakken waarvoor hij in registervoorportaal wordt opgenomen.
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel4c
  - number: 4c.2
    text: |-
      De gegevens betreffende de school die op grond van [artikel 41n, tweede lid, onder b][ref1], of
      [artikel 41s, tweede lid, onder c][ref2], worden verstrekt op verzoek van het bevoegd gezag van een school worden
      onderscheiden in de registratienummers van de betreffende school of de vestigingen van de school, en bestaan per
      registratienummer uit de naam, het adres, de postcode en plaats, het telefoonnummer en e-mailadres.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel41n
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel41s
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel4c
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 41n
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 41s
  - number: 4d
    text: |-
      De gegevens die worden geleverd en verwerkt voor het lerarenregister en het registervoorportaal worden gedefinieerd
      en geordend volgens de voorschriften vermeld in [bijlage 2][ref1] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0008948
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel4d
    references:
      - id: ref1
        bwb_id: BWBR0008948
  - number: 4e
    text: |-
      Bij ministeriële regeling kan een nadere invulling worden gegeven aan de definiëring en ordening, bedoeld in
      [artikel 4d][ref1], en aan:


      [ref1]: https://wetten.overheid.nl/BWBR0008948#Artikel4d
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel4e
    references:
      - id: ref1
        bwb_id: BWBR0008948
        artikel: 4d
        hoofdstuk: III
  - number: 4e.a
    text: de wijze waarop de gegevens worden gedefinieerd, geordend, gecorrigeerd en verstrekt,
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel4e
  - number: 4e.b
    text: de tijdstippen waarop de gegevens worden geleverd, en
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel4e
  - number: 4e.c
    text: |-
      de wijze waarop een leraar die niet is benoemd of tewerkgesteld zonder benoeming ten behoeve van opname in het
      lerarenregister kan aantonen aan de bekwaamheidseisen te voldoen.
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel4e
  - number: 4f
    text: |-
      Dit besluit berust op de [artikelen 41g][ref1], [41h][ref2], [41p][ref3], [41q][ref4], [103a][ref5] en
      [103a1 van de wet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel41g
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel41h
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel41p
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel41q
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel103a
      [ref6]: https://wetten.overheid.nl/BWBR0002399#Artikel103a1
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel4f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 41g
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 41h
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 41p
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 41q
      - id: ref5
        bwb_id: BWBR0002399
        artikel: 103a
      - id: ref6
        bwb_id: BWBR0002399
        artikel: 103a1
  - number: '5'
    text: |-
      Dit besluit treedt in werking 12 maanden na de datum van uitgifte van het *Staatsblad* waarin het wordt geplaatst,
      met dien verstande dat deze vragenlijsten niet eerder van toepassing zijn dan in het schooljaar 1998–1999.
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel5
  - number: '6'
    text: 'Dit besluit wordt aangehaald als: Besluit informatievoorziening WVO.'
    url: https://wetten.overheid.nl/BWBR0008948/2019-03-15#Artikel6
