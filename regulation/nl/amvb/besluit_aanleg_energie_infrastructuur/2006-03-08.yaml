---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_aanleg_energie_infrastructuur
regulatory_layer: AMVB
publication_date: '2025-11-12'
valid_from: '2006-03-08'
bwb_id: BWBR0012292
url: https://wetten.overheid.nl/BWBR0012292/2006-03-08
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Staatssecretaris van Economische Zaken van 3 oktober 2000, nr. WJZ 00059434;

    Gelet op de artikelen 20 van de Elektriciteitswet 1998 en 39 van de Gaswet;

    De Raad van State gehoord (advies van 17 november 2000, nr. W10.000464/II);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 28 februari 2001, nr. WJZ 01004766;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0012292/2006-03-08#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012292/2006-03-08#Artikel1
  - number: 1.a
    text: |-
      energie-infrastructuur: een samenstel van een net als bedoeld in
      [artikel 1, eerste lid, onderdeel i, van de Elektriciteitswet 1998][ref1], een gastransportnet als bedoeld in
      [artikel 1, eerste lid, onderdeel d, van de Gaswet][ref2] of leidingen voor het transport van warmte;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel1
    url: https://wetten.overheid.nl/BWBR0012292/2006-03-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '1'
  - number: 1.b
    text: |-
      eisen voor de energie-infrastructuur: het programma van eisen dat in acht genomen moet worden door de natuurlijke
      persoon of rechtspersoon, bedoeld in [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012292#Artikel5
    url: https://wetten.overheid.nl/BWBR0012292/2006-03-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012292
        artikel: '5'
  - number: '2'
    text: |-
      Dit besluit is van toepassing ten aanzien van gebieden waarin projecten voor de bouw of vernieuwing van ten minste
      500 woningen of woningequivalenten worden ontwikkeld.
    url: https://wetten.overheid.nl/BWBR0012292/2006-03-08#Artikel2
  - number: '3'
    text: |-
      Het college van burgemeester en wethouders van de gemeente waarin een gebied als bedoeld in [artikel 2][ref1]
      is gelegen bepaalt met inachtneming van het belang van een betrouwbaar, duurzaam, doelmatig en milieuhygiënisch
      verantwoord functionerende energiehuishouding of de aanleg van de energie-infrastructuur in dat gebied plaatsvindt:


      [ref1]: https://wetten.overheid.nl/BWBR0012292#Artikel2
    url: https://wetten.overheid.nl/BWBR0012292/2006-03-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012292
        artikel: '2'
  - number: 3.a
    text: |-
      door de netbeheerder, bedoeld in de [Elektriciteitswet 1998][ref1], voor zover het de aanleg van het net betreft,
      al dan niet tezamen met anderen, voor zover het de aanleg van het gastransportnet of leidingen voor het transport
      van warmte betreft, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0009755
    url: https://wetten.overheid.nl/BWBR0012292/2006-03-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009755
  - number: 3.b
    text: |-
      door een natuurlijke persoon of rechtspersoon als bedoeld in [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012292#Artikel5
    url: https://wetten.overheid.nl/BWBR0012292/2006-03-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012292
        artikel: '5'
  - number: '4.1'
    text: |-
      Indien het college van burgemeester en wethouders, bedoeld in [artikel 3][ref1], bepaalt dat een natuurlijke
      persoon of rechtspersoon als bedoeld in [artikel 5][ref2] de energie-infrastructuur zal aanleggen, stelt het
      voor dat gebied, met inachtneming van het belang van een betrouwbare, duurzame, doelmatige en milieuhygiënisch
      verantwoorde energievoorziening, de eisen voor de energie-infrastructuur vast.


      [ref1]: https://wetten.overheid.nl/BWBR0012292#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012292#Artikel5
    url: https://wetten.overheid.nl/BWBR0012292/2006-03-08#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012292
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0012292
        artikel: '5'
  - number: '4.2'
    text: |-
      Het college van burgemeester en wethouders bepaalt in de eisen voor de energie-infrastructuur onder meer binnen
      welke termijn een begin wordt gemaakt met de aanleg van de energie-infrastructuur en binnen welke termijn deze
      wordt voltooid.
    url: https://wetten.overheid.nl/BWBR0012292/2006-03-08#Artikel4
  - number: '5.1'
    text: |-
      Het college van burgemeester en wethouders, bedoeld in [artikel 3][ref1], bepaalt door middel van een openbare
      procedure, waarbij ingeschreven wordt op een opdracht om de energie-infrastructuur van een gebied als bedoeld in
      [artikel 2][ref2] aan te leggen, en met inachtneming van de eisen voor de energie-infrastructuur welke natuurlijke
      persoon of rechtspersoon die energie-infrastructuur mag aanleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0012292#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012292#Artikel2
    url: https://wetten.overheid.nl/BWBR0012292/2006-03-08#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012292
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0012292
        artikel: '2'
  - number: '5.2'
    text: |-
      De opdracht wordt algemeen bekend gemaakt, waarbij een ieder zich als gegadigde kan inschrijven, dan wel waarbij
      een ieder zich als gegadigde kan aanmelden en twee of meer van de gegadigden voor inschrijving kunnen worden
      uitgenodigd.
    url: https://wetten.overheid.nl/BWBR0012292/2006-03-08#Artikel5
  - number: '5.3'
    text: |-
      Het college van burgemeester en wethouders maakt een keuze uit de voorstellen voor de aanleg van de energie-
      infrastructuur met inachtneming van de eisen voor de energie-infrastructuur en bepaalt op grond daarvan welke
      natuurlijke persoon of rechtspersoon de energie-infrastructuur in het desbetreffende gebied aanlegt.
    url: https://wetten.overheid.nl/BWBR0012292/2006-03-08#Artikel5
  - number: '5.4'
    text: |-
      Is overeenkomstig het derde lid bepaald welke natuurlijke persoon of rechtspersoon de energie-infrastructuur mag
      aanleggen, dan is die natuurlijke persoon of rechtspersoon ook daartoe gerechtigd.
    url: https://wetten.overheid.nl/BWBR0012292/2006-03-08#Artikel5
  - number: '6'
    text: |-
      Indien een gemeentebestuur voorafgaande aan de inwerkingtreding van dit besluit door middel van een openbare
      procedure, die voldoet aan de regels, gesteld in de [artikelen 4][ref1] en [5][ref2], heeft bepaald welke
      natuurlijke persoon of rechtspersoon de energie-infrastructuur in een gebied in de gemeente mag aanleggen, dan is
      die natuurlijke persoon of rechtspersoon ook daartoe gerechtigd.


      [ref1]: https://wetten.overheid.nl/BWBR0012292#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0012292#Artikel5
    url: https://wetten.overheid.nl/BWBR0012292/2006-03-08#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012292
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0012292
        artikel: '5'
  - number: '7'
    text: |-
      Onze Minister zendt binnen twee jaar na de plaatsing van dit besluit in het Staatsblad aan de Staten-Generaal een
      verslag over de doeltreffendheid en de effecten van dit besluit in de praktijk.
    url: https://wetten.overheid.nl/BWBR0012292/2006-03-08#Artikel7
  - number: '8'
    text: 'Dit besluit wordt aangehaald als: Besluit aanleg energie-infrastructuur.'
    url: https://wetten.overheid.nl/BWBR0012292/2006-03-08#Artikel8
  - number: '9'
    text: |-
      Dit besluit treedt in werking met ingang van de eerste dag van de tweede kalendermaand na de datum van uitgifte van
      het Staatsblad waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0012292/2006-03-08#Artikel9
