$id: landbouwkwaliteitsbesluit_groenten_en_fruit
regulatory_layer: AMVB
publication_date: '2007-09-27'
valid_from: '1999-11-26'
bwb_id: BWBR0003120
url: https://wetten.overheid.nl/BWBR0003120/1999-11-26
preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Ministers van Landbouw en Visserij en van Economische Zaken en de Staatssecretaris van
    Volksgezondheid en Milieuhygiëne van 13 april 1977, Directie Juridische en Bedrijfsorganisatorische Zaken, no.
    J. 1011;

    Gehoord het Landbouwschap, het Produktschap voor Groenten en Fruit, het Bedrijfschap voor de Groothandel en de
    Tussenpersonen in Groenten en Fruit, het Bedrijfschap voor de Detailhandel in Aardappelen, Groenten en Fruit, het
    Uitvoer-Controle-Bureau voor Tuinbouwprodukten, de Adviescommissie Warenwet, de Consumentenbond en het Konsumenten
    Kontakt;

    Overwegende, dat regelen ter bevordering van de afzet van groenten en fruit, mede met het oog op de uitvoering van
    de in het kader van de betreffende Europese marktorganisatie vastgestelde bepalingen, dienen te worden gesteld;

    Gelet op de artikelen 2, 3, 4, 6, 7, 8, 9, 12, eerste lid, en 19, eerste lid, van de Landbouwkwaliteitswet (Stb.
    1971, 371);

    De Raad van State gehoord (advies van 25 mei 1977, no. 16);

    Gezien het nader rapport van Onze Ministers van Landbouw en Visserij en van Economische Zaken en
    de Staatssecretaris van Volksgezondheid en Milieuhygiëne van 20 juli 1977, Directie Juridische en
    Bedrijfsorganisatorische Zaken, no. J.1628);

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003120/1999-11-26#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      "wet": [Landbouwkwaliteitswet][ref1] (*Stb.* 1971, 371);

      productschap: Productschap Tuinbouw;

      "groenten en fruit": een of meer van de op een door Onze Minister vast te stellen lijst voorkomende verse eetbare
      tuinbouwproducten, met inbegrip van gedroogde knoflook;

      "derde landen": landen of gebieden, die geen deel uitmaken van de Europese Unie;

      "verhandelen": het bedrijfsmatig in voorraad hebben ter bewerking of verwerking, ten verkoop voorhanden hebben, te
      koop aanbieden, verkopen of afleveren;

      "sorteer- en pakstation": onderneming, die in Nederland geteelde groenten en fruit sorteert of verpakt, en als
      zodanig bij het productschap geregistreerd is;

      in- of uitvoer: in- of uitvoer als bedoeld in [artikel 1, eerste lid, van de In- en uitvoerwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002755
      [ref2]: https://wetten.overheid.nl/BWBR0002376#Artikel1
    url: https://wetten.overheid.nl/BWBR0003120/1999-11-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002755
      - id: ref2
        bwb_id: BWBR0002376
        artikel: '1'
  - number: '2'
    text: |-
      Het is verboden groenten en fruit te verhandelen, bedrijfsmatig te vervoeren of in te voeren, tenzij deze voldoen
      aan het bij of krachtens dit besluit bepaalde.
    url: https://wetten.overheid.nl/BWBR0003120/1999-11-26#Artikel2
  - number: '3'
    text: |-
      Groenten en fruit bestemd voor de consument moeten voldoen aan de navolgende eisen:

      a. zij moeten gezond zijn, zuiver, vrij van abnormale uitwendige vochtigheid, vrij van vreemde geur of smaak, en
      zodanig ontwikkeld en rijp, dat ze hun bestemming in goede staat kunnen bereiken;

      b. zij moeten worden gepresenteerd in overeenstemming met hun aard en bestemming;

      een en ander met inachtneming van dienaangaande gestelde nadere regelen, welke mede voorschriften kunnen inhouden
      met betrekking tot

        - de indeling in kwaliteitsklassen, de sortering, de oorsprong, het gewicht, de soort of variëteit, alsmede de
      aanduiding daarvan;
        - de verpakking;
        - de bewerkingswijze.
    url: https://wetten.overheid.nl/BWBR0003120/1999-11-26#Artikel3
  - number: '4'
    text: |-
      1 De eisen gesteld in [artikel 3][ref1] gelden niet ten aanzien van groenten en fruit:

      a. die door de teler daarvan op zijn bedrijf aan de consument voor diens persoonlijke behoeften worden verhandeld;

      b. die binnen Nederland door de teler worden verhandeld aan sorteer- en pakstations of aan bewaarinrichtingen, of
      die van de teler naar deze sorteer- en pakstations of bewaarinrichtingen worden vervoerd;

      c. die binnen Nederland van een bewaarinrichting naar een sorteer- en pakstation worden vervoerd;

      d. die binnen Nederland van een teler naar een veiling of een ander groothandelscentrum worden vervoerd, of die
      op een dergelijke veiling of ander groothandelscentrum door een teler worden verhandeld, behoudens dienaangaande
      gestelde nadere regelen;

      e. die worden ingevoerd uit derde landen en onder ambtelijk toezicht, overeenkomstig de door Onze Minister te
      stellen regelen, in de staat worden gebracht waarin zij voldoen aan de kwaliteitsvoorschriften.

      2 Groenten en fruit moeten, in de in het eerste lid, onder *a* en *e* bedoelde gevallen, ten minste geschikt zijn
      voor menselijke consumptie.


      [ref1]: https://wetten.overheid.nl/BWBR0003120#Artikel3
    url: https://wetten.overheid.nl/BWBR0003120/1999-11-26#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003120
        artikel: '3'
  - number: '5'
    text: |-
      Groenten en fruit bestemd voor de verwerkende industrie dienen een voor hun bestemming geschikte hoedanigheid te
      hebben, een en ander met inachtneming van dienaangaande gestelde nadere regelen. Zij mogen niet worden verwerkt,
      tenzij ze geschikt zijn voor menselijke consumptie.
    url: https://wetten.overheid.nl/BWBR0003120/1999-11-26#Artikel5
  - number: '6'
    text: |-
      1 Het bestuur van het productschap stelt bij verordening nadere regelen als bedoeld in de [artikelen 3][ref1],
      [4, eerste lid, onder ][ref2].

      2 Onze Minister kan bepalen dat krachtens verordening, als bedoeld in het eerste lid, genomen besluiten de
      goedkeuring behoeven van een door hem aangewezen autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0003120#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003120#Artikel4
    url: https://wetten.overheid.nl/BWBR0003120/1999-11-26#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003120
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003120
        artikel: '4'
  - number: '7'
    text: Groenten en fruit zijn onderworpen aan een keuring, volgens door Onze Minister te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0003120/1999-11-26#Artikel7
  - number: '8'
    text: |-
      1 Onze Minister kan merken, tekenen en bewijsstukken vaststellen, als bedoeld in artikel 7, eerste lid, van de wet,
      welke kunnen verschillen naar kwaliteitsklasse.

      2 Onze Minister kan regelen stellen inzake de gebruikmaking van merken, tekenen of bewijsstukken.

      3 Onze Minister kan regelen stellen betreffende het vervaardigen, voorhanden en in voorraad hebben zomede het
      afleveren en gebruiken van in het eerste lid bedoelde merken, tekenen of bewijsstukken van de cliché's, stempels en
      andere werktuigen tot het vervaardigen of aanbrengen van die merken, tekenen of bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0003120/1999-11-26#Artikel8
  - number: '9'
    text: |-
      1 Het is verboden de in [artikel 8][ref1] bedoelde merken, tekenen of bewijsstukken te bezigen in strijd met het
      bij of krachtens dit besluit bepaalde.

      2 Het is verboden voor groenten en fruit aanduidingen te bezigen welke sterk gelijken op de in [artikel 8][ref2]
      bedoelde merken, tekenen of bewijsstukken.


      [ref1]: https://wetten.overheid.nl/BWBR0003120#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003120#Artikel8
    url: https://wetten.overheid.nl/BWBR0003120/1999-11-26#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003120
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0003120
        artikel: '8'
  - number: 9a
    text: |-
      Een ieder die groenten en fruit waarop een merk als bedoeld in [artikel 8][ref1] is aangebracht verhandelt, is
      verplicht het merk daarvan te verwijderen, zodra de groenten en fruit niet meer de hoedanigheid bezitten die aan
      het merk is verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003120#Artikel8
    url: https://wetten.overheid.nl/BWBR0003120/1999-11-26#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0003120
        artikel: '8'
  - number: '10'
    text: |-
      Het Kwaliteits-Controle-Bureau voor Groenten en Fruit te 's-Gravenhage

        - is belast met het toezicht op de naleving door de aangeslotenen van het bij of krachtens dit besluit bepaalde;
        - is belast met keuring als bedoeld in [artikel 7][ref1], bij zijn aangeslotenen;
        - is bevoegd tot het uitreiken van de merken, tekenen of bewijsstukken, bedoeld in [artikel 8][ref2]; deze merken,
      tekenen of bewijsstukken worden uitsluitend uitgereikt aan aangeslotenen.


      [ref1]: https://wetten.overheid.nl/BWBR0003120#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003120#Artikel8
    url: https://wetten.overheid.nl/BWBR0003120/1999-11-26#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003120
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0003120
        artikel: '8'
  - number: '11'
    text: |-
      1 Veilingen en andere groothandelscentra als bedoeld in [artikel 4, eerste lid, onder ][ref1], waar in Nederland
      geteelde groenten en fruit worden verhandeld, dienen aangesloten te zijn bij de in [artikel 10][ref2] genoemde
      instelling.

      2 Sorteer- en pakstations dienen aangesloten te zijn bij de in [artikel 10][ref3] genoemde instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0003120#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003120#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003120#Artikel10
    url: https://wetten.overheid.nl/BWBR0003120/1999-11-26#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003120
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0003120
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0003120
        artikel: '10'
  - number: '12'
    text: |-
      1 De voorzitter van de in [artikel 10][ref1] genoemde instelling wordt door Onze Minister telkens voor ten hoogste
      vier jaren benoemd. Hij is terstond wederbenoembaar.

      2 Het bestuur van de in [artikel 10][ref2] genoemde instelling doet aan Onze Minister een voordracht voor de
      benoeming.

      3 De voorzitter mag niet rechtstreeks betrokken zijn bij de teelt van of de handel in groenten en fruit.


      [ref1]: https://wetten.overheid.nl/BWBR0003120#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003120#Artikel10
    url: https://wetten.overheid.nl/BWBR0003120/1999-11-26#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003120
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0003120
        artikel: '10'
  - number: '13'
    text: |-
      Onze Minister kan in overeenstemming met Onze Minister van Financiën plaatsen aanwijzen waarop ten in- of uitvoer
      bestemde groenten en fruit worden aangeboden ten invoer, onderscheidenlijk ten uitvoer.
    url: https://wetten.overheid.nl/BWBR0003120/1999-11-26#Artikel13
  - number: '14'
    text: |-
      1 Onze Minister kan vrijstelling en, op aanvraag, ontheffing verlenen van het bepaalde bij of krachtens dit
      besluit.

      2 Onze Minister kan bepalen dat een vrijstelling of ontheffing als bedoeld in het eerste lid, door het produktschap
      wordt verleend. Hij kan voorts bepalen dat een besluit, waarbij een zodanige vrijstelling wordt verleend, de
      goedkeuring behoeft van een door hem aangewezen autoriteit.
    url: https://wetten.overheid.nl/BWBR0003120/1999-11-26#Artikel14
  - number: '15'
    text: Het Uitvoercontrolebesluit 1963 (Tuinbouwprodukten) (*Stb.* 218) is buiten werking gesteld.
    url: https://wetten.overheid.nl/BWBR0003120/1999-11-26#Artikel15
  - number: '16'
    text: |-
      1 Dit besluit kan worden aangehaald als "Landbouwkwaliteitsbesluit groenten en fruit".

      2 Het treedt in werking met ingang van 1 oktober 1977.
    url: https://wetten.overheid.nl/BWBR0003120/1999-11-26#Artikel16
