        artikel: '49'
  - number: 1b.1
    text: |-
      Onverminderd de [artikelen 3:4][ref1] en [5:46 van de Algemene wet bestuursrecht][ref2], houdt de toezichthouder
      bij het vaststellen van een bestuurlijke boete in ieder geval rekening met de volgende omstandigheden, voor zover
      die van toepassing zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0026204/2021-07-03#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 1b.1.a
    text: de ernst en de duur van de overtreding;
    url: https://wetten.overheid.nl/BWBR0026204/2021-07-03#Artikel1b
  - number: 1b.1.b
    text: het voordeel dat de overtreder door de overtreding heeft verkregen;
    url: https://wetten.overheid.nl/BWBR0026204/2021-07-03#Artikel1b
  - number: 1b.1.c
    text: |-
      de verliezen die derden wegens de overtreding hebben geleden en de schade die is toegebracht aan de werking van de
      markten of aan de economie in bredere zin;
    url: https://wetten.overheid.nl/BWBR0026204/2021-07-03#Artikel1b
  - number: 1b.1.d
    text: de gevolgen van de overtreding voor het financieel stelsel;
    url: https://wetten.overheid.nl/BWBR0026204/2021-07-03#Artikel1b
  - number: 1b.1.e
    text: de mate waarin de overtreding aan de overtreder kan worden verweten;
    url: https://wetten.overheid.nl/BWBR0026204/2021-07-03#Artikel1b
  - number: 1b.1.f
    text: eerdere overtredingen van de overtreder;
    url: https://wetten.overheid.nl/BWBR0026204/2021-07-03#Artikel1b
  - number: 1b.1.g
    text: de mate waarin de overtreder meewerkt bij het vaststellen van de overtreding;
    url: https://wetten.overheid.nl/BWBR0026204/2021-07-03#Artikel1b
  - number: 1b.1.h
    text: maatregelen die de overtreder na de overtreding heeft genomen om herhaling van de overtreding te voorkomen.
    url: https://wetten.overheid.nl/BWBR0026204/2021-07-03#Artikel1b
  - number: 1b.2
    text: |-
      De omstandigheden genoemd in het eerste lid, onderdelen g en h, kunnen slechts tot een verlaging van de
      bestuurlijke boete leiden.
    url: https://wetten.overheid.nl/BWBR0026204/2021-07-03#Artikel1b
  - number: '2.1'
    text: De toezichthouder stelt een bestuurlijke boete in de tweede of derde categorie vast op het basisbedrag.
    url: https://wetten.overheid.nl/BWBR0026204/2021-07-03#Artikel2
  - number: '2.2'
    text: |-
      De toezichthouder verlaagt of verhoogt het basisbedrag met ten hoogste 50 procent indien de ernst of duur van
      de overtreding, mede gelet op de omstandigheden genoemd in [artikel 1b, onderdelen a tot en met d][ref1], een
      dergelijke verlaging of verhoging rechtvaardigen.


      [ref1]: https://wetten.overheid.nl/BWBR0026204#Artikel1b
    url: https://wetten.overheid.nl/BWBR0026204/2021-07-03#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0026204
        artikel: 1b
        paragraaf: '1'
  - number: '2.3'
    text: |-
      De toezichthouder verlaagt of verhoogt het basisbedrag met ten hoogste 50 procent indien de verwijtbaarheid, mede
      gelet op de omstandigheden genoemd in [artikel 1b, onderdelen e en f][ref1], een dergelijke verlaging of verhoging
      rechtvaardigen.


      [ref1]: https://wetten.overheid.nl/BWBR0026204#Artikel1b
    url: https://wetten.overheid.nl/BWBR0026204/2021-07-03#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0026204
        artikel: 1b
        paragraaf: '1'
  - number: '3'
    text: |-
      De door de toezichthouder met toepassing van [artikel 2][ref1] vast te stellen bestuurlijke boete wordt verdubbeld
      indien tijdens het plegen van de overtreding nog geen vijf jaren zijn verlopen sedert het opleggen van een
      bestuurlijke boete aan de overtreder ter zake van eenzelfde overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0026204#Artikel2
    url: https://wetten.overheid.nl/BWBR0026204/2021-07-03#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0026204
        artikel: '2'
        paragraaf: '1'
  - number: 3a
    text: |-
      De [artikelen 2][ref1] en [3][ref2] zijn niet van toepassing indien de toezichthouder een boete oplegt ter zake
      van een overtreding waarvoor ingevolge [artikel 1:82 van de Wet op het financieel toezicht][ref3] geldt dat de
      boete ten hoogste een percentage bedraagt van de netto-omzet van de overtreder in het boekjaar voorafgaande aan de
      beschikking waarmee de bestuurlijke boete wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0026204#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0026204#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0026204/2021-07-03#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0026204
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0026204
        artikel: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '4.1'
    text: |-
      De toezichthouder houdt bij het vaststellen van een bestuurlijke boete rekening met de draagkracht van de
      overtreder.
    url: https://wetten.overheid.nl/BWBR0026204/2021-07-03#Artikel4
  - number: '4.2'
    text: |-
      De toezichthouder kan op basis van het eerste lid of de omstandigheden genoemd in
      [artikel 1b, onderdelen g en h][ref1], de op te leggen bestuurlijke boete verlagen met maximaal 100 procent.


      [ref1]: https://wetten.overheid.nl/BWBR0026204#Artikel1b
    url: https://wetten.overheid.nl/BWBR0026204/2021-07-03#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0026204
        artikel: 1b
        paragraaf: '1'
  - number: '5'
    text: |-
      Overtreding van [artikel 5:20 van de Algemene wet bestuursrecht][ref1] is beboetbaar volgens de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0026204/2021-07-03#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '6'
    text: |-
      Overtreding van [artikel 10b van de Sanctiewet 1977][ref1] is beboetbaar volgens de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0003296#Artikel10b
    url: https://wetten.overheid.nl/BWBR0026204/2021-07-03#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003296
        artikel: 10b
  - number: '7'
    text: |-
      Overtreding van [artikel 1 van het Besluit financieel verkeer strategische goederen 1996][ref1] is beboetbaar
      volgens de derde categorie


      [ref1]: https://wetten.overheid.nl/BWBR0008298#Artikel1
    url: https://wetten.overheid.nl/BWBR0026204/2021-07-03#Artikel7
    references:
