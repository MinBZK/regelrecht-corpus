  - number: 1a
    text: |-
      Dit besluit berust mede op de [artikelen 1:81, derde lid][ref1], [1:82, tweede lid][ref2],
      [1:88a][ref3] en [1:97, derde lid, onderdeel b, van de Wet op het financieel toezicht][ref4] en
      [artikel 49, eerste lid, van de Wet toezicht trustkantoren 2018][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel1
