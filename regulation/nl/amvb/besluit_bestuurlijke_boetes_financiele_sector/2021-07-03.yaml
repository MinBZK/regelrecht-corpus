preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Financiën, gedaan mede namens Onze Minister van Sociale Zaken en
    Werkgelegenheid, van 19 mei 2009, nr. FM/2009/1037 M, Generale Thesaurie, Directie Financiële Markten;

    Gelet op de artikelen 176, tweede lid en 179, eerste lid, van de Pensioenwet, artikelen 10d, vijfde lid en 10e van
    de Sanctiewet 1977, artikelen 9b, tweede lid en 9c, eerste lid, van de Wet financiële betrekkingen buitenland 1994,
    artikelen 21, tweede lid en 22, eerste lid, van de Wet inzake de geldtransactiekantoren, artikelen 1:80, tweede
    lid en 1:81, eerste lid, van de Wet op het financieel toezicht, artikel 28, eerste en tweede lid, van de Wet ter
    voorkoming van witwassen en financieren van terrorisme, artikelen 54, tweede lid en 55, eerste lid, van de Wet
    toezicht accountantsorganisaties, artikelen 21, tweede lid en 22, eerste lid, van de Wet toezicht trustkantoren,
    artikelen 171, tweede lid en 174, eerste lid, van de Wet verplichte beroepspensioenregeling en artikelen 19, tweede
    lid en 20, eerste lid, van de Wet verplichte deelneming in een bedrijfstakpensioenfonds 2000;

    De Raad van State gehoord (advies van 2 april 2009, nr. W06.09.0076/III);

    Gezien het nader rapport van Onze Minister van Financiën, van 2 juni 2009, nr. FM 2009/1037 M, Generale Thesaurie,
    Directie Financiële Markten, uitgebracht mede namens Onze Minister van Sociale Zaken en Werkgelegenheid;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0026204/2021-07-03#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder basisbedrag: basisbedrag als
      bedoeld in [artikel 10e, tweede lid, van de Sanctiewet 1977][ref1],
      [artikel 9c, tweede lid, van de Wet financiële betrekkingen buitenland 1994][ref2],
      [artikel 1:81, tweede en derde lid, van de Wet op het financieel toezicht][ref3],
      [artikel 31, tweede en derde lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref4],
      [artikel 55, tweede lid, van de Wet toezicht accountantsorganisaties][ref5],
      [artikel 22, tweede lid, van de Wet toezicht trustkantoren][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0003296#Artikel10e
      [ref2]: https://wetten.overheid.nl/BWBR0006547#Artikel9c
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel1
