        artikel: '1'
  - number: '10.6'
    text: |-
      Indien in onderstaande tabellen in de kolom «Bijzondere termijn openbaarmaking» een «P» staat opgenomen, maakt de
      toezichthouder op grond van [artikel 1:97, derde lid, van de Wet op het financieel toezicht][ref1] het besluit tot
      het opleggen van een bestuurlijke boete zo spoedig mogelijk openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
