  - number: '10.2'
    text: |-
      Overtreding van een voorschrift, gesteld krachtens
      [artikel 1:28, tweede of derde lid, van de Wet op het financieel toezicht][ref1] is beboetbaar met categorie 3.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0026204/2021-07-03#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '10.3'
    text: |-
      Overtreding van een voorschrift, gesteld krachtens [artikel 3:66 van de Wet op het financieel toezicht][ref1], is
      beboetbaar met categorie 2.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0026204/2021-07-03#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '10.4'
    text: |-
      Indien in onderstaande tabellen in de kolom «Boetecategorie» tussen haakjes een bedrag is opgenomen, geldt dit
      bedrag op grond van [artikel 1:81, tweede lid, van de Wet op het financieel toezicht][ref1] als maximumbedrag. In
      dat geval geldt als basisbedrag de helft van dat maximumbedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0026204/2021-07-03#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '10.5'
    text: |-
      Indien in onderstaande tabellen in de kolom «Boetecategorie» tussen haakjes een percentage is opgenomen, kan
      op grond van [artikel 1:82, tweede lid, van de Wet op het financieel toezicht][ref1] bij overtreding van dat
      voorschrift een bestuurlijke boete worden opgelegd van ten hoogste het opgenomen percentage van de netto-omzet van
      de overtreder in het boekjaar voorafgaande aan de beschikking waarmee de bestuurlijke boete wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0026204/2021-07-03#Artikel10
    references:
      - id: ref1
