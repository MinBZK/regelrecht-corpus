  - number: '10.1'
    text: |-
      Overtreding van een voorschrift, gesteld in een hierna genoemd artikel van de
      [Wet op het financieel toezicht][ref1] of in een hierna genoemd artikel van een op die wet gebaseerde algemene
      maatregel van bestuur, is beboetbaar zoals bepaald in onderstaande tabellen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0026204/2021-07-03#Artikel10
