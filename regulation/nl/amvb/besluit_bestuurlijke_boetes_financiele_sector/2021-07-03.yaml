        artikel: '1'
  - number: '8'
    text: |-
      Overtreding van een voorschrift, gesteld in een hierna genoemd artikel van de
      [Wet financiële betrekkingen buitenland 1994][ref1], is als volgt beboetbaar:






                  Artikel


                  Boetecategorie






                  [6, derde lid][ref2]


                  2




                  [7, eerste tot en met het vierde lid][ref3]


                  1


