articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder basisbedrag: basisbedrag als
      bedoeld in [artikel 10e, tweede lid, van de Sanctiewet 1977][ref1],
      [artikel 9c, tweede lid, van de Wet financiële betrekkingen buitenland 1994][ref2],
      [artikel 1:81, tweede en derde lid, van de Wet op het financieel toezicht][ref3],
      [artikel 31, tweede en derde lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref4],
      [artikel 55, tweede lid, van de Wet toezicht accountantsorganisaties][ref5],
      [artikel 22, tweede lid, van de Wet toezicht trustkantoren][ref6].


