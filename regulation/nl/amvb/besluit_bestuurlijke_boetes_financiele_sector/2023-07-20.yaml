  - number: 1b
    text: |-
      1 Onverminderd de [artikelen 3:4][ref1] en [5:46 van de Algemene wet bestuursrecht][ref2], houdt de toezichthouder
      bij het vaststellen van een bestuurlijke boete in ieder geval rekening met de volgende omstandigheden, voor zover
      die van toepassing zijn:

      a. de ernst en de duur van de overtreding;

      b. het voordeel dat de overtreder door de overtreding heeft verkregen;

      c. de verliezen die derden wegens de overtreding hebben geleden en de schade die is toegebracht aan de werking van
      de markten of aan de economie in bredere zin;

      d. de gevolgen van de overtreding voor het financieel stelsel;

      e. de mate waarin de overtreding aan de overtreder kan worden verweten;

      f. eerdere overtredingen van de overtreder;

      g. de mate waarin de overtreder meewerkt bij het vaststellen van de overtreding;

      h. maatregelen die de overtreder na de overtreding heeft genomen om herhaling van de overtreding te voorkomen.

      2 De omstandigheden genoemd in het eerste lid, onderdelen g en h, kunnen slechts tot een verlaging van de
      bestuurlijke boete leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel546
    url: https://wetten.overheid.nl/BWBR0026204/2023-07-20#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 3:4
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 5:46
  - number: '2'
    text: |-
      1 De toezichthouder stelt een bestuurlijke boete in de tweede of derde categorie vast op het basisbedrag.

      2 De toezichthouder verlaagt of verhoogt het basisbedrag met ten hoogste 50 procent indien de ernst of duur van
      de overtreding, mede gelet op de omstandigheden genoemd in [artikel 1b, onderdelen a tot en met d][ref1], een
      dergelijke verlaging of verhoging rechtvaardigen.

      3 De toezichthouder verlaagt of verhoogt het basisbedrag met ten hoogste 50 procent indien de verwijtbaarheid, mede
      gelet op de omstandigheden genoemd in [artikel 1b, onderdelen e en f][ref2], een dergelijke verlaging of verhoging
      rechtvaardigen.


      [ref1]: https://wetten.overheid.nl/BWBR0026204#Artikel1b
      [ref2]: https://wetten.overheid.nl/BWBR0026204#Artikel1b
    url: https://wetten.overheid.nl/BWBR0026204/2023-07-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0026204
        artikel: 1b
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0026204
        artikel: 1b
        paragraaf: '1'
  - number: '3'
    text: |-
      De door de toezichthouder met toepassing van [artikel 2][ref1] vast te stellen bestuurlijke boete wordt verdubbeld
      indien tijdens het plegen van de overtreding nog geen vijf jaren zijn verlopen sedert het opleggen van een
      bestuurlijke boete aan de overtreder ter zake van eenzelfde overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0026204#Artikel2
    url: https://wetten.overheid.nl/BWBR0026204/2023-07-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0026204
        artikel: '2'
        paragraaf: '1'
  - number: 3a
    text: |-
      De [artikelen 2][ref1] en [3][ref2] zijn niet van toepassing indien de toezichthouder een boete oplegt ter zake
      van een overtreding waarvoor ingevolge [artikel 1:82 van de Wet op het financieel toezicht][ref3] geldt dat de
      boete ten hoogste een percentage bedraagt van de netto-omzet van de overtreder in het boekjaar voorafgaande aan de
      beschikking waarmee de bestuurlijke boete wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0026204#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0026204#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel182
    url: https://wetten.overheid.nl/BWBR0026204/2023-07-20#Artikel3a
    references:
      - id: ref1
