        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0026204
        artikel: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: 1:82
  - number: '4'
    text: |-
      1 De toezichthouder houdt bij het vaststellen van een bestuurlijke boete rekening met de draagkracht van de
      overtreder.

      2 De toezichthouder kan op basis van het eerste lid of de omstandigheden genoemd in
      [artikel 1b, onderdelen g en h][ref1], de op te leggen bestuurlijke boete verlagen met maximaal 100 procent.


      [ref1]: https://wetten.overheid.nl/BWBR0026204#Artikel1b
    url: https://wetten.overheid.nl/BWBR0026204/2023-07-20#Artikel4
    references:
