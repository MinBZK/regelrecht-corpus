    text: |-
      1 Overtreding van een voorschrift, gesteld in een hierna genoemd artikel van de
      [Wet op het financieel toezicht][ref1] of in een hierna genoemd artikel van een op die wet gebaseerde algemene
      maatregel van bestuur, is beboetbaar zoals bepaald in onderstaande tabellen.

      2 Overtreding van een voorschrift, gesteld krachtens
      [artikel 1:28, tweede of derde lid, van de Wet op het financieel toezicht][ref2] is beboetbaar met categorie 3.

      3 Indien in onderstaande tabellen in de kolom «Boetecategorie» tussen haakjes een bedrag is opgenomen, geldt dit
      bedrag op grond van [artikel 1:81, tweede lid, van de Wet op het financieel toezicht][ref3] als maximumbedrag. In
      dat geval geldt als basisbedrag de helft van dat maximumbedrag.

      4 Indien in onderstaande tabellen in de kolom «Boetecategorie» tussen haakjes een percentage is opgenomen, kan
      op grond van [artikel 1:82, tweede lid, van de Wet op het financieel toezicht][ref4] bij overtreding van dat
      voorschrift een bestuurlijke boete worden opgelegd van ten hoogste het opgenomen percentage van de netto-omzet van
      de overtreder in het boekjaar voorafgaande aan de beschikking waarmee de bestuurlijke boete wordt opgelegd.

      5 Indien in onderstaande tabellen in de kolom «Bijzondere termijn openbaarmaking» een «P» staat opgenomen, maakt de
      toezichthouder op grond van [artikel 1:97, derde lid, van de Wet op het financieel toezicht][ref5] het besluit tot
      het opleggen van een bestuurlijke boete zo spoedig mogelijk openbaar.










