articles:
  - number: '1'
    text: |-
      1 Dit besluit geeft uitvoering aan [artikel 20, tweede lid, van de Wet waardering onroerende zaken][ref1].

      2 In dit besluit wordt verstaan onder de wet: de [Wet waardering onroerende zaken][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0007119
    url: https://wetten.overheid.nl/BWBR0007179/2010-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0007119
  - number: '2'
    text: |-
      Bij ministeriële regeling wordt een instructie vastgesteld waarin regels zijn neergelegd voor de onderbouwing en de
      uitvoering van de waardebepaling van onroerende zaken op de voet van de wet.
    url: https://wetten.overheid.nl/BWBR0007179/2010-01-01#Artikel2
  - number: '3'
    text: |-
      De instructie bevat richtlijnen voor het rapporteren door de colleges van burgemeester en wethouders aan de
      Waarderingskamer over de stand van zaken, de planning en de voortgang van de werkzaamheden in het kader van de
      [Wet waardering onroerende zaken][ref1], alsmede over de kwaliteit van die werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0007119
    url: https://wetten.overheid.nl/BWBR0007179/2010-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007119
  - number: '4'
    text: |-
      De instructie bevat richtlijnen voor het verzamelen, analyseren en registreren van objectgegevens en marktgegevens
      die ten grondslag liggen aan de waardebepaling.
    url: https://wetten.overheid.nl/BWBR0007179/2010-01-01#Artikel4
  - number: '5'
    text: |-
      De instructie bevat richtlijnen voor de toepassing van de te hanteren taxatiemethoden en een uitwerking van die
      methoden.
    url: https://wetten.overheid.nl/BWBR0007179/2010-01-01#Artikel5
  - number: '6'
    text: |-
      De instructie bevat richtlijnen voor de onderbouwing van de taxatie ten behoeve van belanghebbenden in de
      vorm van een model-taxatieverslag. Het taxatieverslag bevat ten minste de objectaanduiding, de waarderelevante
      objectgegevens, de motivering van de individuele afwijking ten opzichte van de relevante marktgegevens en de
      getaxeerde waarde.
    url: https://wetten.overheid.nl/BWBR0007179/2010-01-01#Artikel6
  - number: '7'
    text: |-
      De instructie bevat richtlijnen voor het uitvoeren van kwaliteitscontroles door de colleges van burgemeester en
      wethouders.
    url: https://wetten.overheid.nl/BWBR0007179/2010-01-01#Artikel7
  - number: '8'
    text: Dit besluit treedt in werking met ingang van 1 januari 1995.
    url: https://wetten.overheid.nl/BWBR0007179/2010-01-01#Artikel8
  - number: '9'
    text: |-
      Dit besluit wordt aangehaald als: Uitvoeringsbesluit onderbouwing en uitvoering waardebepaling Wet waardering
      onroerende zaken.
    url: https://wetten.overheid.nl/BWBR0007179/2010-01-01#Artikel9
