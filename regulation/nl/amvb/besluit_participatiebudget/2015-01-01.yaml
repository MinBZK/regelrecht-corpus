$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_participatiebudget
regulatory_layer: AMVB
publication_date: '2014-12-22'
valid_from: '2015-01-01'
bwb_id: BWBR0025044
url: https://wetten.overheid.nl/BWBR0025044/2015-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 12 september 2008, nr. W&B/
    SFI/08/22818, gedaan mede namens Onze Minister voor Wonen, Wijken en Integratie en de Staatssecretaris van
    Onderwijs, Cultuur en Wetenschap;

    Gelet op artikel 89 van de Grondwet, de artikelen 2, vierde en vijfde lid, 4, vierde lid, en 15, tweede lid,
    van de Wet participatiebudget en de artikelen 2.5.5, tweede en derde lid, en 2.5.10 van de Wet educatie en
    beroepsonderwijs;

    De Raad van State gehoord (advies van 25 september 2008);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 23 december 2008, nr.
    W&B/SFI/08/2771 uitgebracht mede namens Onze Minister voor Wonen, Wijken en Integratie en de Staatssecretaris van
    Onderwijs, Cultuur en Wetenschap, J.M. van Bijsterveldt-Vliegenthart;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0025044/2015-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - *duale inburgeringsvoorziening:* inburgeringsvoorziening die met het oog
      op de actieve deelname aan de Nederlandse samenleving mede voorziet in activiteiten die in samenhang en ten minste
      voor een deel gelijktijdig met het verwerven van mondelinge en schriftelijke vaardigheden in de Nederlandse taal en
      kennis van de Nederlandse samenleving worden uitgevoerd;
        - *participatiebudget:* uitkering aan het college, bedoeld in [artikel 2, eerste lid, van de wet][ref1];
        - *wet:* [Wet participatiebudget][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025039#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025039
    url: https://wetten.overheid.nl/BWBR0025044/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0025039
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0025039
  - number: '2.1'
    text: |-
      Het deel van het participatiebudget dat een college ontvangt uit het totale bedrag dat beschikbaar is gesteld door
      Onze Minister van Sociale Zaken en Werkgelegenheid voor een participatiebudget voor alle colleges wordt berekend op
      grond van de formule: (a × (OW / OTW) + (1–a) × (KW / TKW)) × TBW waarbij:
    url: https://wetten.overheid.nl/BWBR0025044/2015-01-01#Artikel2
  - number: 2.1.a
    text: |-
      a het aandeel van het totale bedrag is dat beschikbaar is gesteld door Onze Minister van Sociale Zaken en
      Werkgelegenheid voor een participatiebudget voor alle colleges dat objectief wordt verdeeld, zoals opgenomen in
      [bijlage 1][ref1] van dit besluit;


      [ref1]: https://wetten.overheid.nl/BWBR0025044
    url: https://wetten.overheid.nl/BWBR0025044/2015-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0025044
  - number: 2.1.b
    text: |-
      OW het aan de hand van het verdeelmodel, dat is opgenomen in [bijlage 1][ref1] van dit besluit, bepaalde gewicht
      van de gemeente is;


      [ref1]: https://wetten.overheid.nl/BWBR0025044
    url: https://wetten.overheid.nl/BWBR0025044/2015-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0025044
  - number: 2.1.c
    text: |-
      OTW het totaal is van de aan de hand van het verdeelmodel, dat is opgenomen in [bijlage 1][ref1] van dit besluit,
      bepaalde gewichten van alle gemeenten samen;


      [ref1]: https://wetten.overheid.nl/BWBR0025044
    url: https://wetten.overheid.nl/BWBR0025044/2015-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0025044
  - number: 2.1.d
    text: |-
      KW de uitkering, bedoeld in [artikel 69, eerst lid, onderdeel a, van de Wet werk en bijstand][ref1], zoals die
      luidde op 31 december 2008, voor het kalenderjaar 2003 is;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel69
    url: https://wetten.overheid.nl/BWBR0025044/2015-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '69'
  - number: 2.1.e
    text: |-
      TKW het totaal is van de uitkeringen, bedoeld in
      [artikel 69, eerste lid, onderdeel a, van de Wet werk en bijstand][ref1], zoals die luidde op 31 december 2008,
      voor het kalenderjaar 2003 voor alle gemeenten samen;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel69
    url: https://wetten.overheid.nl/BWBR0025044/2015-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '69'
  - number: 2.1.f
    text: |-
      TBW het bedrag is dat beschikbaar is gesteld door Onze Minister van Sociale Zaken en Werkgelegenheid voor een
      participatiebudget voor alle colleges voor het desbetreffende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0025044/2015-01-01#Artikel2
  - number: '2.2'
    text: |-
      Indien het aan de hand van het verdeelmodel, dat is opgenomen in [bijlage 1][ref1] van dit besluit, bepaalde
      gewicht van de gemeente negatief is, wordt dat voor de toepassing van het eerste lid, onderdelen b en c, op nihil
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0025044
    url: https://wetten.overheid.nl/BWBR0025044/2015-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0025044
  - number: '2.3'
    text: |-
      Jaarlijks worden bij ministeriële regeling voor de verdeelmaatstaven in [bijlage 1][ref1] bij dit besluit de
      peiljaren en de gewichten vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0025044
    url: https://wetten.overheid.nl/BWBR0025044/2015-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0025044
  - number: '2.4'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld voor de toepassing van dit artikel en van het
      verdeelmodel, dat is opgenomen in [bijlage 1][ref1] bij dit besluit, ter voorkoming van onvoorziene en ongewenste
      verdeeleffecten.


      [ref1]: https://wetten.overheid.nl/BWBR0025044
    url: https://wetten.overheid.nl/BWBR0025044/2015-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0025044
  - number: '11'
    text: |-
      Bij een wijziging van de gemeentelijke indeling of een grenscorrectie als bedoeld in de
      [Wet algemene regels herindeling][ref1] worden de gegevens waarmee de berekeningen op grond van dit hoofdstuk
      worden uitgevoerd, vastgesteld op basis van een redelijke schatting van de toestand van die gegevens zoals die zou
      zijn geweest als de wijziging op de datum waarop die gegevens betrekking hebben reeds was ingegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003718
    url: https://wetten.overheid.nl/BWBR0025044/2015-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003718
  - number: '12.1'
    text: |-
      Indien in een kalenderjaar het participatiebudget niet volledig is besteed aan participatievoorzieningen, kan het
      college het niet bestede bedrag tot maximaal 25% van het voor dat jaar toegekende participatiebudget reserveren
      voor besteding aan participatievoorzieningen in het daaropvolgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0025044/2015-01-01#Artikel12
  - number: '12.2'
    text: |-
      Indien in een kalenderjaar meer dan het participatiebudget is besteed aan participatievoorzieningen, kan het
      college het meer bestede bedrag tot maximaal 25% van het voor dat jaar toegekende participatiebudget ten laste
      brengen van het participatiebudget voor het daaropvolgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0025044/2015-01-01#Artikel12
  - number: '12.3'
    text: |-
      Voor het jaar 2009 bedragen de in het eerste en tweede lid genoemde percentages voor een college als bedoeld in
      [artikel 13 van de wet][ref1] 31,25.


      [ref1]: https://wetten.overheid.nl/BWBR0025039#Artikel13
    url: https://wetten.overheid.nl/BWBR0025044/2015-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0025039
        artikel: '13'
  - number: '13'
    text: |-
      Iedere maand wordt op of omstreeks de vijftiende dag van die maand een twaalfde deel van het voor dat kalenderjaar
      vastgestelde participatiebudget betaald.
    url: https://wetten.overheid.nl/BWBR0025044/2015-01-01#Artikel13
  - number: '18'
    text: Dit besluit treedt in werking met ingang van 1 januari 2009.
    url: https://wetten.overheid.nl/BWBR0025044/2015-01-01#Artikel18
  - number: '19'
    text: 'Dit besluit wordt aangehaald als: Besluit participatiebudget.'
    url: https://wetten.overheid.nl/BWBR0025044/2015-01-01#Artikel19
