$id: bekostigingsbesluit_cultuuruitingen
regulatory_layer: AMVB
publication_date: '2005-11-22'
valid_from: '2009-07-01'
bwb_id: BWBR0006759
url: https://wetten.overheid.nl/BWBR0006759/2009-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Welzijn, Volksgezondheid en Cultuur van 2 september 1993 (kenmerk DGCZ/SCB-
    U-935307),

    Gelet op artikel 8 van de Wet op het specifiek cultuurbeleid;

    Gezien de adviezen van de Raad voor de Gemeentefinanciën, de Raad voor het cultuurbeheer en de Raad voor de Kunst;

    De Raad van State gehoord (advies van 28 maart 1994, no. W.13.93.0601);

    Gezien het nader rapport van Onze Minister van Welzijn, Volksgezondheid en Cultuur van 13 juni 1994, DGCZ/SCB-
    U-944172;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel1
  - number: 1.1.a
    text: |-
      wet: [Wet op het specifiek cultuurbeleid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005904
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005904
  - number: 1.1.b
    text: |-
      instelling: privaatrechtelijke rechtspersoon met volledige rechtsbevoegdheid, dan wel publiekrechtelijke
      rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel1
  - number: 1.1.c
    text: |-
      aangewezen instelling: instelling die door Onze Minister is aangewezen als een instelling als bedoeld in
      [artikel 4b van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005904#Artikel4b
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005904
        artikel: 4b
  - number: 1.1.d
    text: 'project: activiteit op het terrein van cultuur met een incidenteel karakter;'
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel1
  - number: 1.1.e
    text: |-
      jaarlijkse instellingssubsidie: subsidie aan een instelling gedurende een kalenderjaar voor het geheel of een deel
      van de activiteiten van die instelling;
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel1
  - number: 1.1.f
    text: |-
      vierjaarlijkse instellingssubsidie: subsidie krachtens [artikel 4a van de wet][ref1] aan een instelling gedurende
      in beginsel vier aaneengesloten kalenderjaren voor het geheel of een deel van de activiteiten van die instelling;


      [ref1]: https://wetten.overheid.nl/BWBR0005904#Artikel4a
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005904
        artikel: 4a
  - number: 1.1.g
    text: 'projectsubsidie: subsidie voor een project;'
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel1
  - number: '1.2'
    text: |-
      [Artikel 28 van het Besluit financiële verhouding 2001][ref1] is niet van toepassing op het verstrekken van
      specifieke uitkeringen als bedoeld in de [artikelen 5][ref2], [6][ref3] en [7 van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0012216#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005904#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005904#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0005904#Artikel7
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012216
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005904
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005904
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0005904
        artikel: '7'
  - number: '2'
    text: |-
      Onze Minister maakt openbaar welke activiteiten voor subsidie of voor een specifieke uitkering als bedoeld in
      [artikel 40][ref1] in aanmerking komen voor zover dit niet reeds blijkt uit nota’s die van belang zijn voor het
      cultuurbeleid of uit de ministeriële regeling, bedoeld in [artikel 4a van de wet][ref2], alsmede voor zover hij
      voornemens is af te wijken van het in die nota’s of ministeriële regeling gestelde onderscheidenlijk bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0005904#Artikel4a
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '40'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0005904
        artikel: 4a
  - number: 2a
    text: Onze Minister verstrekt subsidie voor perioden van ten hoogste vier jaren.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel2a
  - number: '3'
    text: |-
      Een subsidie of een specifieke uitkering als bedoeld in [artikel 40][ref1] ten laste van
      een begroting die nog niet is vastgesteld, wordt verleend onder de voorwaarde, bedoeld in
      [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '40'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '4.1'
    text: |-
      Op de verlening van een specifieke uitkering als bedoeld in [artikel 40][ref1] is
      [artikel 4:35 van de Algemene wet bestuursrecht][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '40'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '4.2'
    text: |-
      De subsidieverlening of de verlening van een specifieke uitkering als bedoeld in [artikel 40][ref1] wordt geweigerd
      voor zover Onze Minister van oordeel is dat het verstrekken daarvan zijn beleid dat is neergelegd in de nota’s die
      van belang zijn voor het cultuurbeleid of in de ministeriële regeling, bedoeld in [artikel 4a van de wet][ref2],
      of dat met toepassing van [artikel 2][ref3] openbaar is gemaakt, mede gelet op de beschikbare financiële middelen,
      niet of onvoldoende ondersteunt.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0005904#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0006759#Artikel2
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '40'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0005904
        artikel: 4a
      - id: ref3
        bwb_id: BWBR0006759
        artikel: '2'
        hoofdstuk: I
  - number: '4.3'
    text: 'De subsidieverlening wordt voorts geweigerd voor zover:'
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel4
  - number: 4.3.a
    text: |-
      naar het oordeel van Onze Minister mag worden verwacht dat de met de subsidieverlening beoogde doeleinden niet
      zullen worden bereikt;
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel4
  - number: 4.3.b
    text: |-
      de aanvrager naar het oordeel van Onze Minister de behoefte aan subsidie niet heeft aangetoond, tenzij de aanvrager
      een publiekrechtelijke rechtspersoon is;
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel4
  - number: 4.3.c
    text: |-
      de aanvrager niet aannemelijk heeft gemaakt dat de financiële middelen met inbegrip van subsidie voldoende zullen
      zijn om de voorgenomen activiteiten uit te voeren.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel4
  - number: '4.4'
    text: |-
      Onze Minister kan bepalen dat in een geval of een categorie gevallen de behoefte aan subsidie niet behoeft te
      worden aangetoond.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel4
  - number: '5'
    text: |-
      Onze Minister kan regels stellen met betrekking tot de wijze waarop het bedrag van een specifieke uitkering als
      bedoeld in [artikel 40][ref1] of van een subsidie wordt berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel40
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '40'
        hoofdstuk: VI
  - number: 5a
    text: |-
      Onze Minister kan ieder jaar subsidieplafonds vaststellen voor de verschillende categorieën van activiteiten
      waarvoor een subsidie kan worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel5a
  - number: 5b.1
    text: |-
      Indien Onze Minister een subsidieplafond vaststelt in verband met verlening van vierjaarlijkse of jaarlijkse
      instellingssubsidie dan wel van projectsubsidie, voorziet hij in een gelijktijdige beslissing op aanvragen
      met betrekking tot soortgelijke instellingen en soortgelijke projecten op basis van een vergelijking van hun
      geschiktheid om bij te dragen aan de doelstellingen van de subsidie, tenzij Onze Minister bij de vaststelling van
      een subsidieplafond bepaalt dat hij het beschikbare bedrag in de volgorde van ontvangst van de aanvragen verdeelt.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel5b
  - number: 5b.2
    text: |-
      Wanneer de aanvrager krachtens [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de
      aanvraag aan te vullen, geldt in het geval, bedoeld in het eerste lid, laatste zinsdeel, de dag waarop de aanvraag
      is aangevuld, met betrekking tot de verdeling, als datum van ontvangst.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 5b.3
    text: |-
      Indien Onze Minister een subsidieplafond vaststelt in verband met subsidieverlening aan aangewezen instellingen of
      fondsen, voorziet hij in een gelijktijdige beslissing ten aanzien van die instellingen of fondsen op basis van een
      vergelijking van hun geschiktheid om bij te dragen aan de doelstellingen van de subsidie.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel5b
  - number: '6'
    text: |-
      Deze paragraaf is op aangewezen instellingen en fondsen slechts van toepassing voor zover het betreft
      projectsubsidies.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel6
  - number: '7.1'
    text: |-
      Een instelling die een vierjaarlijkse instellingssubsidie verlangt, dient voor een door Onze Minister te bepalen
      tijdstip een subsidieaanvraag in. Dit tijdstip ligt ten minste zes maanden vóór de aanvang van de periode van vier
      jaar waarvoor subsidie wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel7
  - number: '7.2'
    text: |-
      Een instelling die een jaarlijkse instellingssubsidie verlangt, dient uiterlijk zes maanden vóór de aanvang van het
      betreffende jaar een subsidieaanvraag in.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel7
  - number: '7.3'
    text: |-
      Een instelling of een natuurlijke persoon die een projectsubsidie verlangt, dient uiterlijk dertien weken voor de
      aanvang van het project een subsidieaanvraag in.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel7
  - number: '7.4'
    text: |-
      De subsidieaanvraag voor een vierjaarlijkse of een jaarlijkse instellingssubsidie geeft mede aan of de aanvraag
      geschiedt voor het geheel of een gedeelte van de activiteiten van de instelling.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel7
  - number: '7.5'
    text: Onze Minister kan op aanvraag ontheffing verlenen van de in het eerste en tweede lid bedoelde aanvraagtermijn;
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel7
  - number: '7.6'
    text: 'In afwijking van het derde lid kan Onze Minister:'
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel7
  - number: 7.6.a
    text: |-
      bepalen dat aanvragen voor bepaalde categorieën projecten vóór een of meer door hem vastgestelde data dienen te
      worden ingediend; of
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel7
  - number: 7.6.b
    text: een andere aanvraagtermijn vaststellen.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel7
  - number: '8.1'
    text: 'De subsidieaanvraag gaat in ieder geval vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel8
  - number: 8.1.a
    text: een activiteitenplan; en
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel8
  - number: 8.1.b
    text: een begroting.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel8
  - number: '8.2'
    text: |-
      Het activiteitenplan geeft het doel aan van en geeft inzicht in de voorgenomen activiteiten waarvoor subsidie wordt
      gevraagd.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel8
  - number: '8.3'
    text: Het activiteitenplan van de aanvraag voor een vierjaarlijkse instellingssubsidie is uitgesplitst per jaar.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel8
  - number: '8.4'
    text: |-
      De begroting geeft inzicht in de geschatte baten en lasten van de voorgenomen activiteiten. Daarbij wordt uitgegaan
      van het prijspeil op 1 januari van het jaar van indiening van de aanvraag. De begroting is tevens voorzien van een
      postgewijze toelichting.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel8
  - number: '8.5'
    text: |-
      De begroting van de aanvraag voor een vierjaarlijkse instellingssubsidie omvat tevens een prestatieoverzicht dat
      in kort bestek een inzichtelijk kwantitatief overzicht bevat van de te verrichten activiteiten in ieder van de vier
      jaren van de periode waarvoor de subsidie wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel8
  - number: '8.6'
    text: |-
      Voor zover de aanvrager voor dezelfde begrote uitgaven tevens subsidie heeft aangevraagd bij een of meer andere
      bestuursorganen, doet hij daarvan mededeling in de aanvraag, onder vermelding van de stand van zaken met betrekking
      tot de beoordeling van die aanvraag of aanvragen.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel8
  - number: '9.1'
    text: |-
      De aanvraag voor een jaarlijkse instellingssubsidie of een projectsubsidie gaat vergezeld van een
      liquiditeitsprognose, indien de liquiditeitsbehoefte van de betreffende instelling of de betrokken natuurlijke
      persoon onregelmatig is gespreid over de duur van de activiteiten.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel9
  - number: '9.2'
    text: De liquiditeitsprognose geeft gemotiveerd inzicht in het verloop van de liquiditeitsbehoefte van de activiteiten.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel9
  - number: '10.1'
    text: 'Bij de aanvraag worden tevens overgelegd:'
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel10
  - number: 10.1.a
    text: een afschrift van de oprichtingsakte of de statuten;
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel10
  - number: 10.1.b
    text: een afschrift waaruit de inschrijving van de instelling in het geldende openbaar register blijkt; en
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel10
  - number: 10.1.c
    text: |-
      een volledig overzicht van de financiële toestand van de instelling op het tijdstip van de aanvraag, tenzij de
      aanvrager er redelijkerwijs van uit kan gaan dat de in die bescheiden opgenomen gegevens aan Onze Minister bekend
      zijn. Legt de aanvrager niet een of meer van deze bescheiden over dan doet hij daarvan mededeling in de aanvraag.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel10
  - number: '10.2'
    text: Het eerste lid is niet van toepassing op publiekrechtelijke rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel10
  - number: '11.1'
    text: |-
      Aangewezen instellingen en fondsen dienen uiterlijk zes maanden voor de aanvang van iedere subsidieperiode van
      vier kalenderjaren een begroting in die betrekking heeft op de door die instellingen als zodanig te verrichten
      activiteiten in die periode. De begroting is uitgesplitst per jaar.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel11
  - number: '11.2'
    text: |-
      [Artikel 8, vierde tot en met zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel8
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
  - number: '12'
    text: |-
      Indien aan een aangewezen instelling of een fonds voor de eerste maal een subsidie als bedoeld in
      [artikel 11][ref1] wordt verleend, is [artikel 10][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0006759#Artikel10
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006759
        artikel: '10'
        hoofdstuk: II
        paragraaf: '1'
  - number: '13.1'
    text: |-
      Op een aanvraag voor een vierjaarlijkse of jaarlijkse instellingssubsidie wordt beslist dertien weken voorafgaand
      aan het betrokken jaar.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel13
  - number: '13.2'
    text: |-
      Met het oog op de onderlinge afweging van aanvragen kan Onze Minister bepalen dat op een aanvraag niet wordt
      beslist voor een bepaalde datum in een kalenderjaar, dan wel dat wordt beslist op of na een of meer data in een
      kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel13
  - number: '14.1'
    text: Onze Minister houdt bij het verlenen van voorschotten rekening met de liquiditeitsbehoefte.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel14
  - number: '14.2'
    text: |-
      Ingeval van voorschotverlening aan instellingen met vierjaarlijkse instellingssubsidie, aan aangewezen instellingen
      of aan fondsen wordt in de beschikking tot voorschotverlening vermeld welk bedrag elk jaar van de betrokken periode
      als voorschot zal worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel14
  - number: '14.3'
    text: |-
      Indien een subsidieaanvraag voor een vierjaarlijkse of jaarlijkse instellingssubsidie of voor een projectsubsidie
      te laat wordt ingediend en Onze Minister de aanvraag desondanks in behandeling neemt, kan hij het verlenen van
      voorschotten evenredig later doen plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel14
  - number: '14.4'
    text: Onze Minister kan met betrekking tot de bevoorschotting nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel14
  - number: '15.1'
    text: |-
      Bij de subsidieverlening aan instellingen met vierjaarlijkse instellingssubsidie, aan aangewezen instellingen of
      aan fondsen kan Onze Minister bepalen dat het subsidiebedrag jaarlijks door hem wordt bijgesteld, rekening houdend
      met de ontwikkeling van het prijspeil en met de ontwikkeling in de kosten van de arbeidsvoorwaarden.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel15
  - number: '15.2'
    text: |-
      Met het oog op de toepassing van het eerste lid kan Onze Minister bij de verlening van de subsidie tevens
      bepalen welk deel van het subsidiebedrag in aanmerking zal worden genomen voor een bijstelling in verband met de
      ontwikkeling van het prijspeil, onderscheidenlijk van de kosten van de arbeidsvoorwaarden.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel15
  - number: '15.3'
    text: |-
      Indien een subsidie met toepassing van het eerste lid wordt bijgesteld, kan de bevoorschotting overeenkomstig
      worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel15
  - number: '15.4'
    text: |-
      Jaarlijks vindt overleg plaats tussen Onze Minister en, naar het oordeel van Onze Minister, representatieve
      vertegenwoordigers van subsidieontvangers over de ontwikkeling van de kosten van de arbeidsvoorwaarden in
      het daarop volgende jaar in relatie tot de kwaliteit en de kwantiteit van de gesubsidieerde activiteiten. Een
      bijstelling van het subsidiebedrag met toepassing van het eerste lid vindt eerst plaats nadat dit overleg heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel15
  - number: '19'
    text: 'De subsidieontvanger zorgt ervoor dat:'
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel19
  - number: 19.a
    text: |-
      de doeleinden gesteld in het activiteitenplan of, in geval van subsidieverlening aan aangewezen instellingen of
      fondsen, het prestatieoverzicht op doelmatige wijze worden nagestreefd;
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel19
  - number: 19.b
    text: dat de werkzaamheden op een zodanige manier worden geregeld dat een goed beleid en beheer worden gevoerd; en
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel19
  - number: 19.c
    text: dat de subsidie op doelmatige wijze wordt gebruikt voor de doeleinden waarvoor het wordt verleend.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel19
  - number: '20'
    text: 'De subsidieontvanger zorgt er voorts voor dat:'
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel20
  - number: 20.a
    text: de administratie op overzichtelijke en doelmatige wijze wordt gevoerd;
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel20
  - number: 20.b
    text: de administratie een juist, volledig en actueel beeld geeft van het functioneren van de instelling;
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel20
  - number: 20.c
    text: |-
      van alle ontvangsten en uitgaven deugdelijke bewijsstukken waaruit de aard en de omvang van de geleverde goederen
      of van de verrichte diensten duidelijk blijken, aanwezig zijn; en
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel20
  - number: 20.d
    text: |-
      de administratie en de daarbij behorende bewijsstukken ten minste gedurende vijf jaar na de vaststelling van de
      subsidie worden bewaard.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel20
  - number: '21.1'
    text: |-
      Bij instellingen met vierjaarlijkse of jaarlijkse instellingssubsidie, bij aangewezen instellingen en bij fondsen
      is het boekjaar gelijk aan het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel21
  - number: '21.2'
    text: Onze Minister kan van het eerste lid ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel21
  - number: '22'
    text: |-
      De subsidieontvanger doet zo spoedig mogelijk schriftelijk mededeling aan Onze Minister van omstandigheden die van
      belang kunnen zijn voor een beslissing tot wijziging, intrekking of vaststelling van de subsidie. Daarbij worden de
      relevante stukken overgelegd.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel22
  - number: '23.1'
    text: |-
      Instellingen met vierjaarlijkse of jaarlijkse instellingssubsidie, aangewezen instellingen en fondsen verzekeren
      hun roerende en onroerende zaken op afdoende wijze tegen het risico van diefstal en brand, alsmede tegen het risico
      van wettelijke aansprakelijkheid tegenover derden.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel23
  - number: '23.2'
    text: |-
      Instellingen met een vierjaarlijkse of jaarlijkse instellingssubsidie, aangewezen instellingen en fondsen
      verzekeren voor vrijwilligers die werkzaamheden voor deze verrichten in het kader van de gesubsidieerde
      activiteiten, hun wettelijke aansprakelijkheid.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel23
  - number: '23.3'
    text: Het eerste lid is niet van toepassing op zaken van provincies en gemeenten en op collecties van musea.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel23
  - number: '23.4'
    text: Onze Minister kan op aanvraag ontheffing verlenen van het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel23
  - number: '23.5'
    text: |-
      Onze Minister kan het eerste of tweede lid van overeenkomstige toepassing verklaren op de ontvanger van een
      projectsubsidie.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel23
  - number: '24.1'
    text: |-
      Instellingen met vierjaarlijkse instellingssubsidie, aangewezen instellingen en fondsen dienen binnen vier maanden
      na afloop van enig jaar waarvoor subsidie is verleend een bestuursverslag en een jaarrekening of financieel verslag
      in. De jaarrekening of het financieel verslag gaat vergezeld van een toelichting.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel24
  - number: '24.2'
    text: |-
      Op de jaarrekening zijn de [artikelen 35][ref1] en [37][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0006759#Artikel37
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '35'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0006759
        artikel: '37'
        hoofdstuk: V
  - number: '24.3'
    text: |-
      Op het financieel verslag zijn de [artikelen 36][ref1] en [37][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006759#Artikel37
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '36'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0006759
        artikel: '37'
        hoofdstuk: V
  - number: '24.4'
    text: 'Het bestuursverslag geeft toelichting op:'
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel24
  - number: 24.4.a
    text: het exploitatieresultaat van de instelling;
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel24
  - number: 24.4.b
    text: de financiële positie van de instelling;
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel24
  - number: 24.4.c
    text: het al dan niet realiseren van de voorgenomen activiteiten;
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel24
  - number: 24.4.d
    text: de zaken die nu of in de toekomst van invloed kunnen zijn op het functioneren van de instelling.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel24
  - number: '24.5'
    text: |-
      Het bestuursverslag bevat naast de toelichting, bedoeld in het vierde lid, in kort bestek een inzichtelijke
      kwalitatieve beschrijving van de verrichte activiteiten in het afgelopen jaar.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel24
  - number: '24.6'
    text: |-
      Het bestuursverslag dat betrekking heeft op het laatste jaar van een periode van vier kalenderjaren waarvoor
      subsidie is verleend, bevat tevens een beschouwing over die vier kalenderjaren gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel24
  - number: '24.7'
    text: Het bestuur van de instelling ondertekent het bestuursverslag.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel24
  - number: '24.8'
    text: |-
      Onze Minister kan regels stellen met betrekking tot tussentijdse verslaglegging bij projectsubsidies die zich over
      meer dan één kalenderjaar uitstrekken.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel24
  - number: '25.1'
    text: |-
      Indien een gesubsidieerd project leidt tot een publicatie, draagt de subsidieontvanger er zorg voor dat bij de
      publicatie wordt aangegeven wie de uitvoerder en subsidiënt van het project zijn geweest.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel25
  - number: '25.2'
    text: |-
      Indien een subsidie gericht is of mede gericht is op de totstandkoming van een werk als bedoeld in
      [artikel 10, onder 1°, van de Auteurswet][ref1], draagt de subsidieontvanger er zorg voor auteursrechthebbende te
      zijn ter zake van dat werk.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel10
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '10'
  - number: '25.3'
    text: |-
      De subsidieontvanger vrijwaart de Staat der Nederlanden voor aanspraken van derden ter zake van alle schade die zij
      lijden ten gevolge van de door of vanwege de subsidieontvanger verrichte publicaties.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel25
  - number: '26.1'
    text: |-
      Voor zover na uitvoering van de gesubsidieerde activiteiten overeenkomstig het bepaalde bij of krachtens dit
      besluit het bedrag van een verleend instellingssubsidie niet is besteed aan de doeleinden waarvoor de subsidie is
      verstrekt, wordt het gereserveerd in een bestemmingsfonds OCW. De aldus gereserveerde bedragen kunnen uitsluitend
      worden besteed aan doeleinden waarvoor de subsidie werd verstrekt.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel26
  - number: '26.2'
    text: |-
      Over de aanwending van het bedrag in het bestemmingsfonds OCW neemt Onze Minister na afloop van de subsidieperiode
      binnen tien maanden een besluit.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel26
  - number: '27.1'
    text: |-
      In de gevallen, bedoeld in [artikel 4:41, tweede lid, van de Algemene wet bestuursrecht][ref1], is de
      subsidieontvanger aan Onze Minister een door hem te bepalen vergoeding voor vermogensvorming verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '27.2'
    text: |-
      Bij de bepaling van de hoogte van de vergoeding wordt uitgegaan van de waarde van de goederen en andere
      vermogensbestanddelen op het tijdstip waarop de vergoeding verschuldigd wordt, met dien verstande dat in geval
      van ontvangst van schadevergoeding voor verlies of beschadiging van zaken, wordt uitgegaan van het bedrag dat
      als schadevergoeding door de instelling wordt ontvangen. Indien het onroerende zaken betreft, geschiedt de
      waardebepaling door één of drie onafhankelijke deskundigen.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel27
  - number: '27.3'
    text: |-
      Toepassing van het eerste lid blijft achterwege indien de activiteiten van de subsidieontvanger, na toestemming
      van Onze Minister, door een andere rechtspersoon worden voortgezet en de activa tegen boekwaarde aan die andere
      rechtspersoon in eigendom zijn overgedragen.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel27
  - number: '28.1'
    text: |-
      De vergoeding die de instelling betaalt aan een organisatie die zich de ondersteuning van één of meer
      gesubsidieerde instellingen ten doel stelt, voor door die organisatie aan de instelling ter beschikking gestelde
      goederen, is niet hoger dan het bedrag dat op grond van de historische kostprijs berekend wordt, rekening houdend
      met de geldende afschrijvingspercentages.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel28
  - number: '28.2'
    text: |-
      De vergoeding die de instelling betaalt aan een organisatie die zich de ondersteuning van één of meer
      gesubsidieerde instellingen ten doel stelt, voor door die organisatie aan de instelling geleverde diensten, is
      indien het diensten betreft die in het algemeen door soortgelijke instellingen in eigen beheer worden verricht,
      niet hoger dan het bedrag dat gelijk is aan de kosten die de instelling zou hebben gehad bij het verrichten van de
      diensten in eigen beheer.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel28
  - number: '28.3'
    text: |-
      De vergoeding die de instelling betaalt aan een organisatie die zich de ondersteuning van één of meer
      gesubsidieerde instellingen ten doel stelt, voor door die organisatie aan de instelling geleverde diensten,
      andere dan de in het tweede lid bedoelde diensten, is niet hoger dan het bedrag dat voor het doen verrichten van
      dergelijke diensten door andere organisaties gebruikelijk kan worden geacht.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel28
  - number: '29'
    text: |-
      De subsidieontvanger die aan derden goederen ter beschikking stelt of voor derden diensten verricht, brengt
      daarvoor een vergoeding in rekening die ten minste kostendekkend is, tenzij het derden betreft voor wie de
      gesubsidieerde activiteiten bestemd zijn. Onze Minister kan ook andere gevallen aanwijzen waarin de bepaling niet
      geldt.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel29
  - number: '31.1'
    text: |-
      De subsidieontvanger werkt mee aan door of namens Onze Minister ingestelde onderzoekingen die erop zijn gericht
      Onze Minister inlichtingen te verschaffen ten behoeve van de ontwikkeling van het beleid.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel31
  - number: '31.2'
    text: |-
      Indien bij Onze Minister het vermoeden is gerezen dat [artikel 28][ref1] niet is nageleefd, spant de
      subsidieontvanger zich desgevraagd in de jaarrekening van de desbetreffende organisatie over te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel28
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '28'
        hoofdstuk: IV
  - number: 31a.1
    text: |-
      Tijdens iedere periode waarin aan de aangewezen instellingen of fondsen subsidie is verleend, wordt bij ieder van
      die instellingen een visitatie uitgevoerd die ten doel heeft de wijze waarop die instelling haar taken verricht
      te beoordelen.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel31a
  - number: 31a.2
    text: Met de visitatie zijn visitatiecommissies belast.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel31a
  - number: 31a.3
    text: |-
      Een visitatiecommissie wordt door Onze Minister ingesteld na overleg met de instelling of instellingen waarbij
      die visitatie wordt uitgevoerd. Onze Minister stelt daarbij vast over welke instelling of instellingen de
      visitatiecommissie haar bemoeienis uitstrekt.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel31a
  - number: 31a.4
    text: |-
      De leden van de visitatiecommissie worden benoemd, ontslagen en geschorst door Onze Minister, gehoord de instelling
      of instellingen, waartoe de visitatiecommissie haar bemoeienis zal uitstrekken.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel31a
  - number: 31a.5
    text: |-
      Na afloop van iedere visitatie stelt de visitatiecommissie een visitatierapport vast. Het visitatierapport is
      openbaar.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel31a
  - number: 31a.6
    text: |-
      Op de visitatiecommissies is het [Vacatiegeldenbesluit 1988][ref1] van toepassing. De visitatiecommissies worden
      als «algemeen» in de zin van [dat besluit][ref2] aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0004317
      [ref2]: https://wetten.overheid.nl/BWBR0004317
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0004317
      - id: ref2
        bwb_id: BWBR0004317
  - number: '32.1'
    text: |-
      Onze Minister kan nadere regels stellen omtrent aan de verlening van bepaalde categorieën subsidies te verbinden
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel32
  - number: '32.2'
    text: |-
      Indien subsidie wordt verstrekt voor activiteiten op een terrein van cultuur waarvoor een sponsorcode is
      vastgesteld, kan Onze Minister bij de subsidieverlening bepalen dat de subsidieontvanger zich dient aan te sluiten
      bij de code.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel32
  - number: '33'
    text: |-
      Binnen vier maanden na afloop van de periode dan wel het project, waarvoor subsidie is verleend, dient de
      subsidieontvanger in ieder geval de volgende bescheiden in:
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel33
  - number: 33.a
    text: een activiteitenverslag;
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel33
  - number: 33.b
    text: een jaarrekening of een financieel verslag.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel33
  - number: '34'
    text: |-
      Het activiteitenverslag geeft inzicht in de aard, duur en omvang van de in het kader van de subsidiëring verrichte
      activiteiten. Het activiteitenverslag vergelijkt de verrichte activiteiten met de voorgenomen activiteiten
      in het activiteitenplan of, ingeval van subsidieverlening aan aangewezen instellingen of fondsen, in het
      prestatieoverzicht.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel34
  - number: '35.1'
    text: |-
      [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] is van toepassing op de jaarrekening, met dien verstande
      dat de winst- en verliesrekening vervangen wordt door een exploitatierekening; op deze rekening zijn de bepalingen
      omtrent de winst- en verliesrekening van overeenkomstige toepassing. Bepalingen omtrent winst en verlies zijn van
      overeenkomstige toepassing op het exploitatiesaldo.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: '35.2'
    text: |-
      Onze Minister kan bepalen dat bepalingen van [Titel 9][ref1] of onderdelen daarvan niet van toepassing zijn op
      bepaalde instellingen of categorieën instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: '35.3'
    text: De jaarrekening omvat de balans en de exploitatierekening, en gaat vergezeld van een toelichting op beide.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel35
  - number: '35.4'
    text: |-
      De jaarrekening van instellingen met vierjaarlijkse instellingssubsidie, van aangewezen instellingen en van fondsen
      gaat tevens vergezeld van een prestatieverantwoording die in kort bestek een inzichtelijk kwantitatief overzicht
      bevat van de activiteiten die zijn verricht in het jaar waarop de jaarrekening betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel35
  - number: '35.5'
    text: 'De jaarrekening behoeft niet te worden ingezonden, indien het gaat om:'
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel35
  - number: 35.5.a
    text: een subsidie waarvan de omvang kleiner is dan een door Onze Minister vast te stellen bedrag;
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel35
  - number: 35.5.b
    text: een projectsubsidie; of
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel35
  - number: 35.5.c
    text: een subsidie aan een publiekrechtelijke rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel35
  - number: '36.1'
    text: |-
      Het financieel verslag geeft een zodanig inzicht dat een verantwoord oordeel kan worden gevormd omtrent de
      aanwending en de besteding van de subsidie door de instelling. Het financieel verslag sluit aan op de indeling
      van de begroting die voorafgaand aan de subsidieverlening is overgelegd. Belangrijke verschillen tussen financieel
      verslag en begroting worden toegelicht.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel36
  - number: '36.2'
    text: |-
      Op het financieel verslag is [artikel 35, vierde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel35
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '35'
        hoofdstuk: V
  - number: '36.3'
    text: |-
      Een financieel verslag kan achterwege blijven indien de daarmee te verstrekken informatie reeds in de in te zenden
      jaarrekening is opgenomen.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel36
  - number: '37.1'
    text: |-
      De jaarrekening en het financieel verslag zijn ieder afzonderlijk voorzien van een verklaring van een accountant
      als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '37.2'
    text: |-
      De jaarrekening of het financieel verslag gaat vergezeld van een rapportage omtrent de naleving van de
      subsidiebepalingen door de subsidieontvanger, opgesteld door de accountant overeenkomstig een door Onze Minister
      vast te stellen protocol.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel37
  - number: '37.3'
    text: |-
      De subsidieontvanger draagt er zorg voor dat de accountant meewerkt aan door of namens de departementale
      accountantsdienst in te stellen onderzoeken naar de door de accountant verrichte (controle)werkzaamheden. De
      daaraan verbonden kosten worden geacht te zijn begrepen in de subsidie.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel37
  - number: '37.4'
    text: |-
      Indien het totaal van de door Onze Minister verleende subsidies met betrekking tot het boekjaar minder bedraagt dan
      een door hem vast te stellen bedrag zijn het eerste en het tweede lid niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel37
  - number: '38'
    text: |-
      Na ontvangst van de gegevens, bedoeld in de [artikelen 33 tot en met 37][ref1], stelt Onze Minister de subsidie
      binnen zes maanden vast.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel33
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '33'
        hoofdstuk: V
  - number: '40'
    text: |-
      Specifieke uitkeringen aan provincies en gemeenten ten behoeve van het door het desbetreffende
      openbaar lichaam te voeren cultuurbeleid worden door Onze Minister verstrekt met inachtneming van
      de[ artikelen 41 tot en met 49][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel41
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '41'
        hoofdstuk: VI
  - number: '41.1'
    text: |-
      De aanvraag voor een specifieke uitkering wordt uiterlijk zes maanden vóór de aanvang van de desbetreffende
      uitkeringsperiode ingediend. Bij ministeriële regeling kan een andere termijn worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel41
  - number: '41.2'
    text: |-
      In de aanvraag voor een specifieke uitkering geeft het college van gedeputeerde staten of het college van
      burgemeester en wethouders aan welke:
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel41
  - number: 41.2.a
    text: doelen worden nagestreefd,
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel41
  - number: 41.2.b
    text: indicatoren de realisatie van deze doelen uitdrukken, en
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel41
  - number: 41.2.c
    text: kosten met het realiseren van deze doelen zullen zijn gemoeid.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel41
  - number: '41.3'
    text: Bij ministeriële regeling kunnen indicatoren worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel41
  - number: '41.4'
    text: |-
      Onze Minister kan bij ministeriële regeling bepalen dat het college van gedeputeerde staten of het college van
      burgemeester en wethouders geen toepassing behoeft te geven aan het tweede lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel41
  - number: '42'
    text: |-
      Met het oog op de onderlinge afweging van aanvragen kan Onze Minister bepalen dat op een aanvraag niet wordt
      beslist voor een bepaalde datum in een kalenderjaar, dan wel op of na een of meer data in een kalenderjaar. Op een
      aanvraag wordt dertien weken voorafgaande aan de betrokken uitkeringsperiode beslist.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel42
  - number: '43.1'
    text: Nadat een aanvraag voor een specifieke uitkering is ingediend, kan Onze Minister voorschotten verlenen.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel43
  - number: '43.2'
    text: Onze Minister kan met betrekking tot de bevoorschotting nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel43
  - number: '44'
    text: |-
      Gedeputeerde staten of het college van burgemeester en wethouders doet zo spoedig mogelijk schriftelijk
      mededeling aan Onze Minister van omstandigheden die van belang kunnen zijn voor een beslissing tot
      wijziging of intrekking van een specifieke uitkering. Daarbij worden de relevante stukken overgelegd.
      [Artikel 4:49 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '46'
    text: |-
      Gedeputeerde staten of het college van burgemeester en wethouders werkt mee aan door of namens Onze Minister
      ingestelde onderzoekingen die erop zijn gericht Onze Minister inlichtingen te verschaffen ten behoeve van de
      ontwikkeling van het beleid.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel46
  - number: '47'
    text: |-
      Voor zover niet uit de jaarrekening van de provincie of gemeente, alsmede uit de accountantsverklaring en het
      verslag van bevindingen, behorend bij die jaarrekening krachtens [artikel 217 van de Provinciewet][ref1] of
      [artikel 213 van de Gemeentewet][ref2], blijkt dat een specifieke uitkering rechtmatig is besteed, kan het bedrag
      waarvan de rechtmatige besteding niet vaststaat, worden teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel217
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel213
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '217'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '213'
  - number: '48'
    text: |-
      Onze Minister kan nadere regels stellen ten aanzien van de inrichting van aanvragen, het activiteitenplan de
      begroting, de liquiditeitsprognose, de administratie, de jaarrekening, bedoeld in de [hoofdstukken IV][ref1] en
      [V][ref2], het financieel verslag, de verklaring van de accountant, bedoeld in [artikel 36, eerste lid][ref3], het
      activiteitenverslag en het bestuursverslag.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0006759#HoofdstukV
      [ref3]: https://wetten.overheid.nl/BWBR0006759#Artikel36
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0006759
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0006759
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0006759
        artikel: '36'
        hoofdstuk: V
  - number: '49'
    text: |-
      Onze Minister kan, gelet op het belang dat dit besluit beoogt te beschermen, artikelen buiten toepassing laten of
      daarvan afwijken voor zover strikte toepassing leidt tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel49
  - number: '52'
    text: 'Dit besluit kan worden aangehaald als: Bekostigingsbesluit cultuuruitingen.'
    url: https://wetten.overheid.nl/BWBR0006759/2009-07-01#Artikel52
