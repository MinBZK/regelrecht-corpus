  - number: '2'
    text: |-
      Onze Minister maakt openbaar welke activiteiten voor subsidie of voor een specifieke uitkering als bedoeld in
      [artikel 40][ref1] in aanmerking komen voor zover dit niet reeds blijkt uit de cultuurnota of uit sectornota’s,
      alsmede voor zover hij voornemens is af te wijken van het in die nota’s gestelde.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel40
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '40'
        hoofdstuk: VI
  - number: 2a
    text: |-
      Onze Minister kan subsidie verstrekken voor perioden van ten hoogste vier jaren, doch uitsluitend binnen de
      perioden waarvoor een cultuurnota geldt.
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel2a
  - number: '3'
    text: |-
      Een subsidie of een specifieke uitkering als bedoeld in [artikel 40][ref1] ten laste van
      een begroting die nog niet is vastgesteld, wordt verleend onder de voorwaarde, bedoeld in
      [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel434
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '40'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:34
  - number: '4'
    text: |-
      1 Op de verlening van een specifieke uitkering als bedoeld in [artikel 40][ref1] is
      [artikel 4:35 van de Algemene wet bestuursrecht][ref2] van overeenkomstige toepassing.

      2 De subsidieverlening of de verlening van een specifieke uitkering als bedoeld in [artikel 40][ref3] wordt
      geweigerd indien Onze Minister van oordeel is dat het verstrekken daarvan zijn beleid dat is neergelegd in de
      cultuurnota, in een sectornota, of met toepassing van [artikel 2][ref4] openbaar is gemaakt, mede gelet op de
      beschikbare financiële middelen, niet ondersteunt.

      3 De subsidieverlening wordt voorts geweigerd indien:

      a. naar het oordeel van Onze Minister mag worden verwacht dat de met de subsidieverlening beoogde doeleinden niet
      zullen worden bereikt;

      b. de aanvrager naar het oordeel van Onze Minister de behoefte aan subsidie niet heeft aangetoond, tenzij de
      aanvrager een publiekrechtelijke rechtspersoon is;

      c. de aanvrager niet aannemelijk heeft gemaakt dat de financiële middelen met inbegrip van subsidie voldoende
      zullen zijn om de voorgenomen activiteiten uit te voeren.

      4 Onze Minister kan bepalen dat in een geval of een categorie gevallen de behoefte aan subsidie niet behoeft te
      worden aangetoond.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel435
      [ref3]: https://wetten.overheid.nl/BWBR0006759#Artikel40
      [ref4]: https://wetten.overheid.nl/BWBR0006759#Artikel2
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel4
