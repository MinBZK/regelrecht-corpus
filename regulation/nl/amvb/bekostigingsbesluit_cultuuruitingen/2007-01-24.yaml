  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Welzijn, Volksgezondheid en Cultuur van 2 september 1993 (kenmerk DGCZ/SCB-
    U-935307),

    Gelet op artikel 8 van de Wet op het specifiek cultuurbeleid;

    Gezien de adviezen van de Raad voor de Gemeentefinanciën, de Raad voor het cultuurbeheer en de Raad voor de Kunst;

    De Raad van State gehoord (advies van 28 maart 1994, no. W.13.93.0601);

    Gezien het nader rapport van Onze Minister van Welzijn, Volksgezondheid en Cultuur van 13 juni 1994, DGCZ/SCB-
    U-944172;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. de wet: de [Wet op het specifiek cultuurbeleid][ref1];

      b. instelling: een privaatrechtelijke rechtspersoon met volledige rechtsbevoegdheid, dan wel een publiekrechtelijke
      rechtspersoon;

      c. project: een activiteit op het terrein van cultuur met een incidenteel karakter;

      d. instellingssubsidie: een subsidie als bedoeld in [artikel 6][ref2];

      e. projectsubsidie: een subsidie als bedoeld in [artikel 11][ref3];

      f. beleidsplan: een plan als bedoeld in [artikel 9][ref4];

      g. cultuurnota: de cultuurnota, bedoeld in [artikel 3][ref5] van de wet;

      h. sectornota: een sectornota als bedoeld in [artikel 3, vierde lid][ref6], van de wet.

      2 [Artikel 28 van het Besluit financiële verhouding 2001][ref7] is niet van toepassing op het verstrekken van
      specifieke uitkeringen als bedoeld in de[ artikelen 5][ref8], [6][ref9] en [7][ref10] van de wet.


