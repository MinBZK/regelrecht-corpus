  - number: '5'
    text: |-
      Onze Minister kan regels stellen met betrekking tot de wijze waarop het bedrag van een specifieke uitkering als
      bedoeld in [artikel 40][ref1] of van een subsidie wordt berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel40
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '40'
        hoofdstuk: VI
  - number: 5a
    text: |-
      Onze Minister kan ieder jaar subsidieplafonds vaststellen voor de verschillende categorieën van activiteiten
      waarvoor een instellings- of projectsubsidie kan worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel5a
  - number: 5b
    text: |-
      1 Indien Onze Minister een subsidieplafond vaststelt, voorziet hij in een gelijktijdige beslissing op aanvragen
      met betrekking tot soortgelijke instellingen en soortgelijke projecten op basis van een vergelijking van hun
      geschiktheid om bij te dragen aan de doelstellingen van de subsidie, tenzij Onze Minister bij de vaststelling van
      een subsidieplafond bepaalt dat hij het beschikbare bedrag in de volgorde van ontvangst van de aanvragen verdeelt.

      2 Wanneer de aanvrager krachtens [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad
      de aanvraag aan te vullen, geldt in het geval, bedoeld in het eerste lid, laatste zinsdeel, de dag waarop de
      aanvraag is aangevuld, met betrekking tot de verdeling, als datum van ontvangst.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:5
  - number: '6'
    text: |-
      1 De instelling die voor zijn activiteiten of een gedeelte daarvan in een kalenderjaar subsidie verlangt,
      dient uiterlijk zes maanden vóór de aanvang van het desbetreffende jaar een subsidieaanvraag in. De aanvraag
      wordt onderbouwd met een activiteitenplan en een begroting van de instelling en gaat vergezeld van een
      liquiditeitsprognose, indien de liquiditeitsbehoefte van de instelling onregelmatig over het jaar is gespreid.

      2 In het activiteitenplan worden de aard en de omvang van de voorgenomen activiteiten beschreven. Daarbij wordt
      aangegeven welke doelstelling de instelling met de activiteiten nastreeft, op welke wijze zij zullen worden
      uitgevoerd en voor welke doelgroep zij zijn bestemd.

      3 De begroting geeft inzicht in de baten en lasten van de activiteiten in dat jaar. Daarbij wordt uitgegaan van
      het prijspeil en het niveau van de kosten van de arbeidsvoorwaarden op 1 januari van het jaar van indiening van
      de aanvraag. De begroting is voorzien van een postgewijze toelichting. Tevens bevat de begroting zowel de baten en
      lasten van de instelling als geheel als de baten en lasten van elk te onderscheiden onderdeel van de instelling.

      4 De liquiditeitsprognose geeft gemotiveerd inzicht in het verloop van de liquiditeitsbehoefte van de activiteiten
      per kalenderkwartaal.

      5 Onze Minister kan op aanvraag ontheffing verlenen van de in het eerste lid bedoelde aanvraagtermijn.
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel6
  - number: '7'
    text: |-
      1 Bij de aanvraag van een instellingssubsidie worden tevens overgelegd:

      a. een afschrift van de oprichtingsakte of de statuten;

      b. een afschrift waaruit de inschrijving van de instelling in het geldende openbaar register blijkt;

      c. een volledig overzicht van de financiële toestand van de instelling op het tijdstip van de aanvraag.

      2 Voor zover de aanvrager voor dezelfde begrote uitgaven tevens subsidie heeft aangevraagd bij een of meer andere
      bestuursorganen, doet hij daarvan mededeling in de aanvraag, onder vermelding van de stand van zaken met betrekking
      tot de beoordeling van die aanvraag of aanvragen.

      3 Overlegging van de in het eerste lid, onder a, b of c, bedoelde bescheiden kan achterwege blijven indien de
      aanvrager er redelijkerwijs van uit kan gaan dat de in die bescheiden opgenomen gegevens aan Onze Minister bekend
      zijn. In de aanvraag wordt daarvan mededeling gedaan.

      4 Het eerste lid is niet van toepassing indien een publiekrechtelijke rechtspersoon een instellingssubsidie
      aanvraagt.
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel7
  - number: '9'
    text: |-
      1 Een aanvraag voor een meerjarige instellingssubsidie wordt ingediend vóór een door Onze Minister te bepalen
      tijdstip, dat voor verschillende cultuuruitingen verschillend kan worden vastgesteld. Dit tijdstip ligt ten minste
      zes maanden vóór de aanvang van de periode waarvoor subsidie wordt gevraagd.

      De aanvraag gaat vergezeld van een:

      a. beleidsplan voor de betrokken periode, en

      b. begroting voor de betrokken periode.

      [Artikel 7][ref1] is van overeenkomstige toepassing.

      2 Het beleidsplan geeft ten minste een duidelijk inzicht in de beleidsvoornemens.

      3 De begroting geeft inzicht in de geschatte baten en lasten. Daarbij wordt uitgegaan van het prijspeil in het jaar
      dat bij ministeriële regeling is aangewezen.

      4 Onze Minister kan op aanvraag ontheffing verlenen van de in het eerste lid bedoelde aanvraagtermijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel7
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
  - number: '11'
    text: |-
      1 De natuurlijke persoon of de rechtspersoon die subsidie voor een bepaald project verlangt, dient ten minste
      dertien weken vóór de aanvang van het project een aanvraag in. De aanvraag wordt onderbouwd met een projectplan en
      een begroting en gaat vergezeld van een liquiditeitsprognose.

      2 In het projectplan worden de aard en de omvang van de voorgenomen activiteiten beschreven. Daarbij wordt
      aangegeven welke doelstelling de aanvrager met de activiteiten nastreeft en op welke wijze die zullen worden
      uitgevoerd.

      3 De begroting geeft inzicht in de baten en lasten van het project. De begroting is voorzien van een postgewijze
      toelichting. Daarbij wordt uitgegaan van het prijspeil en het niveau van de kosten van de arbeidsvoorwaarden op 1
      januari van het jaar van indiening van de aanvraag.

      4 De liquiditeitsprognose geeft gemotiveerd inzicht in het verloop van de liquiditeitsbehoefte van de activiteiten
      per kalenderkwartaal. De liquiditeitsprognose kan achterwege blijven als de liquiditeitsbehoefte regelmatig
      gespreid is over de duur van het project; in de aanvraag wordt dit uitdrukkelijk vermeld.

      5 In afwijking van het eerste lid kan Onze Minister:

      a. bepalen dat aanvragen voor bepaalde categorieën projecten vóór een of meer door hem vastgestelde data dienen te
      worden ingediend;

      b. een andere aanvraagtermijn vaststellen.
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel11
  - number: '12'
    text: |-
      1 Bij de aanvraag van de subsidie door een privaatrechtelijke rechtspersoon worden tevens overgelegd:

      a. een afschrift van de oprichtingsakte of de statuten; en

      b. een afschrift waaruit de inschrijving van de instelling in het geldende openbaar register blijkt.

      2 Onze Minister kan een aanvrager of een categorie aanvragers tevens verplichten tot het overleggen van een
      volledig overzicht van de financiële toestand van de instelling op het tijdstip van de aanvraag.

      3 Voor zover de aanvrager voor dezelfde begrote uitgaven tevens subsidie heeft aangevraagd bij een of meer andere
      bestuursorganen, doet hij daarvan mededeling in de aanvraag, onder vermelding van de stand van zaken met betrekking
      tot de beoordeling van die aanvraag of aanvragen.

      4 Overlegging van in het eerste lid bedoelde afschriften kan achterwege blijven, indien de aanvrager er
      redelijkerwijs van uit kan gaan dat deze gegevens aan Onze Minister bekend zijn. In de aanvraag wordt daarvan
      mededeling gedaan.

      5 Het eerste en tweede lid is niet van toepassing indien een publiekrechtelijke rechtspersoon een projectsubsidie
      aanvraagt.
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel12
  - number: '13'
    text: |-
      Op een aanvraag voor een instellingssubsidie wordt beslist dertien weken voorafgaand aan het betrokken jaar.
      Met het oog op de onderlinge afweging van aanvragen kan Onze Minister bepalen dat op een aanvraag niet wordt
      beslist voor een bepaalde datum in een kalenderjaar, dan wel dat wordt beslist op of na een of meer data in een
      kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel13
  - number: '14'
    text: |-
      1 Nadat een subsidieaanvraag is ingediend, kan Onze Minister voorschotten verlenen. Daarbij wordt rekening gehouden
      met de liquiditeitsbehoefte.

      2 Onze Minister kan met betrekking tot de bevoorschotting nadere regels stellen.

      3 Indien de subsidieaanvraag te laat wordt ingediend en Onze Minister de aanvraag desondanks in behandeling neemt,
      kan hij het verlenen van voorschotten evenredig later doen plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel14
  - number: '15'
    text: |-
      Ten aanzien van de verlening en bevoorschotting van een meerjarige instellingssubsidie zijn de[ artikelen 13][ref1]
      en [14][ref2] van toepassing, met dien verstande dat Onze Minister beslist dertien weken voorafgaand aan de
      betrokken periode en dat in een beslissing waarbij een meerjarige instellingssubsidie wordt verleend, wordt vermeld
      welk bedrag elk jaar van de betrokken periode als voorschot zal worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0006759#Artikel14
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '13'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0006759
        artikel: '14'
        hoofdstuk: III
  - number: '16'
    text: |-
      1 Bij de verlening van een meerjarige instellingssubsidie kan Onze Minister bepalen dat het subsidiebedrag
      jaarlijks door hem wordt bijgesteld, rekening houdend met de ontwikkeling van het prijspeil en met de ontwikkeling
      in de kosten van de arbeidsvoorwaarden.

      2 Met het oog op de toepassing van het eerste lid kan Onze Minister bij de verlening van de subsidie tevens
      bepalen welk deel van het subsidiebedrag in aanmerking zal worden genomen voor een bijstelling in verband met de
      ontwikkeling van het prijspeil, onderscheidenlijk van de kosten van de arbeidsvoorwaarden.

      3 Indien een subsidie met toepassing van het eerste lid wordt bijgesteld, kan de bevoorschotting overeenkomstig
      worden gewijzigd.

      4 Jaarlijks vindt overleg plaats tussen Onze Minister en, naar het oordeel van Onze Minister, representatieve
      vertegenwoordigers van subsidieontvangers over de ontwikkeling van de kosten van de arbeidsvoorwaarden in
      het daarop volgende jaar in relatie tot de kwaliteit en de kwantiteit van de gesubsidieerde activiteiten. Een
      bijstelling van het subsidiebedrag met toepassing van het eerste lid vindt eerst plaats nadat dit overleg heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel16
  - number: '19'
    text: |-
      De subsidieontvanger zorgt ervoor dat:

      a. de doeleinden gesteld in het activiteitenplan, het beleidsplan of het projectplan op doelmatige wijze worden
      nagestreefd;

      b. dat de werkzaamheden op een zodanige manier worden geregeld dat een goed beleid en beheer worden gevoerd; en

      c. dat de subsidie op doelmatige wijze wordt gebruikt voor de doeleinden waarvoor het wordt verleend.
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel19
  - number: '20'
    text: |-
      De subsidieontvanger zorgt er voorts voor dat:

      a. de administratie op overzichtelijke en doelmatige wijze wordt gevoerd;

      b. de administratie een juist, volledig en actueel beeld geeft van het functioneren van de instelling;

      c. van alle ontvangsten en uitgaven deugdelijke bewijsstukken waaruit de aard en de omvang van de geleverde
      goederen of van de verrichte diensten duidelijk blijken, aanwezig zijn; en

      d. de administratie en de daarbij behorende bewijsstukken ten minste gedurende vijf jaar na de vaststelling van de
      subsidie worden bewaard.
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel20
  - number: '21'
    text: |-
      1 Bij instellingen die een instellingssubsidie ontvangen, is het boekjaar gelijk aan het kalenderjaar.

      2 Onze Minister kan van het eerste lid ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel21
  - number: '22'
    text: |-
      De subsidieontvanger doet zo spoedig mogelijk schriftelijk mededeling aan Onze Minister van omstandigheden die van
      belang kunnen zijn voor een beslissing tot wijziging, intrekking of vaststelling van de subsidie. Daarbij worden de
      relevante stukken overgelegd.
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel22
  - number: '23'
    text: |-
      1 De ontvanger van een instellingssubsidie verzekert zijn roerende en onroerende zaken op afdoende wijze tegen het
      risico van diefstal en brand, alsmede tegen het risico van wettelijke aansprakelijkheid tegenover derden.

      2 De ontvanger van een instellingssubsidie verzekert voor vrijwilligers die werkzaamheden verrichten in het kader
      van de gesubsidieerde activiteiten, hun wettelijke aansprakelijkheid.

      3 Het eerste lid is niet van toepassing op zaken van provincies en gemeenten en op collecties van musea.

      4 Onze Minister kan op aanvraag ontheffing verlenen van het eerste of tweede lid.

      5 Onze Minister kan het eerste of tweede lid van overeenkomstige toepassing verklaren op de ontvanger van een
      projectsubsidie.
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel23
  - number: '24'
    text: |-
      1 De subsidieontvanger stelt na afloop van de periode of het project waarvoor subsidie is verleend een
      activiteitenverslag vast dat inzicht geeft in de aard, duur en omvang van de in het kader van de subsidiëring
      verrichte activiteiten. Het activiteitenverslag vergelijkt de verrichte activiteiten met de in het beleidsplan,
      activiteitenplan, onderscheidenlijk projectplan voorgenomen activiteiten.

      2 De ontvanger van een meerjarige instellingssubsidie dient binnen vier maanden na afloop van enig jaar waarvoor
      subsidie is verleend een activiteitenverslag, een bestuursverslag en een jaarrekening vergezeld van een toelichting
      in. De [artikelen 33, derde lid][ref1], [35][ref2] en [36][ref3] zijn op de jaarrekening van toepassing.

      3 Het bestuursverslag geeft toelichting op:

      a. het exploitatieresultaat van de instelling;

      b. de financiële positie van de instelling;

      c. het al dan niet realiseren van de voorgenomen activiteiten;

      d. de zaken die nu of in de toekomst van invloed kunnen zijn op het functioneren van de instelling.

      4 Het bestuur van de instelling ondertekent het bestuursverslag.

      5 Onze Minister kan regels stellen met betrekking tot tussentijdse verslaglegging bij projectsubsidies die zich
      over meer dan één kalenderjaar uitstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0006759#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0006759#Artikel36
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel24
