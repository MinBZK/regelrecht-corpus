  - number: '25'
    text: |-
      1 Indien een gesubsidieerd project leidt tot een publicatie, draagt de subsidieontvanger er zorg voor dat bij de
      publicatie wordt aangegeven wie de uitvoerder en subsidiënt van het project zijn geweest.

      2 Indien een subsidie gericht is of mede gericht is op de totstandkoming van een werk als bedoeld
      in [artikel 10, onder 1°, van de Auteurswet 1912][ref1], draagt de subsidieontvanger er zorg voor
      auteursrechthebbende te zijn ter zake van dat werk.

      3 De subsidieontvanger vrijwaart de Staat der Nederlanden voor aanspraken van derden ter zake van alle schade die
      zij lijden ten gevolge van de door of vanwege de subsidieontvanger verrichte publicaties.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel10
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '10'
  - number: '26'
    text: |-
      1 Voor zover na uitvoering van de gesubsidieerde activiteiten overeenkomstig het bepaalde bij of krachtens dit
      besluit het bedrag van een verleend instellingssubsidie niet is besteed aan de doeleinden waarvoor de subsidie
      is verstrekt, kan het worden gereserveerd in een bestemmingsfonds OCW. De aldus gereserveerde bedragen kunnen
      uitsluitend worden besteed aan doeleinden waarvoor de subsidie werd verstrekt.

      2 Over de aanwending van het bedrag in het bestemmingsfonds OCW neemt Onze Minister na afloop van de
      subsidieperiode binnen tien maanden een besluit.
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel26
  - number: '27'
    text: |-
      1 In de gevallen, bedoeld in [artikel 4:41, tweede lid, van de Algemene wet bestuursrecht][ref1], is de
      subsidieontvanger aan Onze Minister een door hem te bepalen vergoeding voor vermogensvorming verschuldigd.

      2 Bij de bepaling van de hoogte van de vergoeding wordt uitgegaan van de waarde van de goederen en andere
      vermogensbestanddelen op het tijdstip waarop de vergoeding verschuldigd wordt, met dien verstande dat in geval
      van ontvangst van schadevergoeding voor verlies of beschadiging van zaken, wordt uitgegaan van het bedrag dat
      als schadevergoeding door de instelling wordt ontvangen. Indien het onroerende zaken betreft, geschiedt de
      waardebepaling door één of drie onafhankelijke deskundigen.

      3 Toepassing van het eerste lid blijft achterwege indien de activiteiten van de subsidieontvanger, na toestemming
      van Onze Minister, door een andere rechtspersoon worden voortgezet en de activa tegen boekwaarde aan die andere
      rechtspersoon in eigendom zijn overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel441
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:41
  - number: '28'
    text: |-
      1 De vergoeding die de instelling betaalt aan een organisatie die zich de ondersteuning van één of meer
      gesubsidieerde instellingen ten doel stelt, voor door die organisatie aan de instelling ter beschikking gestelde
      goederen, is niet hoger dan het bedrag dat op grond van de historische kostprijs berekend wordt, rekening houdend
      met de geldende afschrijvingspercentages.

      2 De vergoeding die de instelling betaalt aan een organisatie die zich de ondersteuning van één of meer
      gesubsidieerde instellingen ten doel stelt, voor door die organisatie aan de instelling geleverde diensten, is
      indien het diensten betreft die in het algemeen door soortgelijke instellingen in eigen beheer worden verricht,
      niet hoger dan het bedrag dat gelijk is aan de kosten die de instelling zou hebben gehad bij het verrichten van de
      diensten in eigen beheer.

      3 De vergoeding die de instelling betaalt aan een organisatie die zich de ondersteuning van één of meer
      gesubsidieerde instellingen ten doel stelt, voor door die organisatie aan de instelling geleverde diensten,
      andere dan de in het tweede lid bedoelde diensten, is niet hoger dan het bedrag dat voor het doen verrichten van
      dergelijke diensten door andere organisaties gebruikelijk kan worden geacht.
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel28
  - number: '29'
    text: |-
      De subsidieontvanger die aan derden goederen ter beschikking stelt of voor derden diensten verricht, brengt
      daarvoor een vergoeding in rekening die ten minste kostendekkend is, tenzij het derden betreft voor wie de
      gesubsidieerde activiteiten bestemd zijn. Onze Minister kan ook andere gevallen aanwijzen waarin de bepaling niet
      geldt.
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel29
  - number: '31'
    text: |-
      1 De subsidieontvanger werkt mee aan door of namens Onze Minister ingestelde onderzoekingen die erop zijn gericht
      Onze Minister inlichtingen te verschaffen ten behoeve van de ontwikkeling van het beleid.

      2 Indien bij Onze Minister het vermoeden is gerezen dat [artikel 28][ref1] niet is nageleefd, spant de
      subsidieontvanger zich desgevraagd in de jaarrekening van de desbetreffende organisatie over te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel28
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '28'
        hoofdstuk: IV
  - number: '32'
    text: |-
      1 Onze Minister kan nadere regels stellen omtrent aan de verlening van bepaalde categorieën subsidies te verbinden
      verplichtingen.

      2 Indien subsidie wordt verstrekt voor activiteiten op een terrein van cultuur waarvoor een sponsorcode is
      vastgesteld, kan Onze Minister bij de subsidieverlening bepalen dat de subsidieontvanger zich dient aan te sluiten
      bij de code.
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel32
  - number: '33'
    text: |-
      1 Binnen vier maanden na afloop van de periode dan wel het project waarvoor subsidie is verleend, dient de
      subsidieontvanger de volgende bescheiden in:

      a. het activiteitenverslag, bedoeld in [artikel 24][ref1];

      b. een subsidiedeclaratie; en

      c. de jaarrekening.

      2 Een subsidiedeclaratie kan achterwege blijven indien de daarmee te verstrekken informatie reeds in de in te
      zenden jaarrekening is opgenomen.

      3 De jaarrekening behoeft niet te worden ingezonden, indien het gaat om:

      a. een projectsubsidie; of

      b. een subsidie aan een publiekrechtelijke rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel24
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '24'
        hoofdstuk: IV
  - number: '34'
    text: |-
      De subsidiedeclaratie geeft een zodanig inzicht dat een verantwoord oordeel kan worden gevormd omtrent de
      aanwending en de besteding van de subsidie door de instelling. De subsidiedeclaratie sluit aan op de indeling van
      de bij de subsidieaanvraag ingediende begroting. Belangrijke verschillen tussen declaratie en begroting worden
      toegelicht. In de subsidiedeclaratie van instellingssubsidies wordt de aansluiting tussen de subsidiedeclaratie en
      de jaarrekening toegelicht.
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel34
  - number: '35'
    text: |-
      1 [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] is van toepassing op de jaarrekening, met dien verstande
      dat de winst- en verliesrekening vervangen wordt door een exploitatierekening; op deze rekening zijn de bepalingen
      omtrent de winsten verliesrekening van overeenkomstige toepassing. Bepalingen omtrent winst en verlies zijn van
      overeenkomstige toepassing op het exploitatiesaldo.

      2 Onze Minister kan bepalen dat bepalingen van [Titel 9][ref2] of onderdelen daarvan niet van toepassing zijn op
      bepaalde instellingen of categorieën instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0003045
  - number: '36'
    text: |-
      1 De jaarrekening en de subsidiedeclaratie zijn ieder afzonderlijk voorzien van een verklaring van een accountant
      als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].

      2 De jaarrekening of de subsidiedeclaratie gaat vergezeld van een rapportage omtrent de naleving van de
      subsidiebepalingen door de subsidieontvanger, opgesteld door de accountant overeenkomstig een door Onze Minister
      vast te stellen protocol.

      3 De subsidieontvanger draagt er zorg voor dat de accountant meewerkt aan door of namens de departementale
      accountantsdienst in te stellen onderzoeken naar de door de accountant verrichte (controle)werkzaamheden. De
      daaraan verbonden kosten worden geacht te zijn begrepen in de subsidie.

      4 Indien het totaal van de door Onze Minister verleende subsidies met betrekking tot het boekjaar minder bedraagt
      dan € 125.000 zijn het eerste en het tweede lid niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '37'
    text: |-
      Na ontvangst van de gegevens, bedoeld in de[ artikelen 33 tot en met 36][ref1], stelt Onze Minister de subsidie
      binnen zes maanden vast.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel33
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '33'
        hoofdstuk: V
  - number: '40'
    text: |-
      Specifieke uitkeringen aan provincies en gemeenten ten behoeve van het door het desbetreffende
      openbaar lichaam te voeren cultuurbeleid worden door Onze Minister verstrekt met inachtneming van
      de[ artikelen 41 tot en met 49][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel41
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '41'
        hoofdstuk: VI
  - number: '41'
    text: |-
      1 De aanvraag voor een specifieke uitkering wordt uiterlijk zes maanden vóór de aanvang van de desbetreffende
      uitkeringsperiode ingediend. Bij ministeriële regeling kan een andere termijn worden vastgesteld.

      2 In de aanvraag voor een specifieke uitkering geeft het college van gedeputeerde staten of het college van
      burgemeester en wethouders aan welke:

      a. doelen worden nagestreefd,

      b. indicatoren de realisatie van deze doelen uitdrukken, en

      c. kosten met het realiseren van deze doelen zullen zijn gemoeid.

      3 Bij ministeriële regeling kunnen indicatoren worden vastgesteld.

      4 Onze Minister kan bij ministeriële regeling bepalen dat het college van gedeputeerde staten of het college van
      burgemeester en wethouders geen toepassing behoeft te geven aan het tweede lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel41
  - number: '42'
    text: |-
      Met het oog op de onderlinge afweging van aanvragen kan Onze Minister bepalen dat op een aanvraag niet wordt
      beslist voor een bepaalde datum in een kalenderjaar, dan wel op of na een of meer data in een kalenderjaar. Op een
      aanvraag wordt dertien weken voorafgaande aan de betrokken uitkeringsperiode beslist.
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel42
  - number: '43'
    text: |-
      1 Nadat een aanvraag voor een specifieke uitkering is ingediend, kan Onze Minister voorschotten verlenen.

      2 Onze Minister kan met betrekking tot de bevoorschotting nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel43
  - number: '44'
    text: |-
      Gedeputeerde staten of het college van burgemeester en wethouders doet zo spoedig mogelijk schriftelijk
      mededeling aan Onze Minister van omstandigheden die van belang kunnen zijn voor een beslissing tot
      wijziging of intrekking van een specifieke uitkering. Daarbij worden de relevante stukken overgelegd.
      [Artikel 4:49 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel449
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:49
  - number: '46'
    text: |-
      Gedeputeerde staten of het college van burgemeester en wethouders werkt mee aan door of namens Onze Minister
      ingestelde onderzoekingen die erop zijn gericht Onze Minister inlichtingen te verschaffen ten behoeve van de
      ontwikkeling van het beleid.
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel46
  - number: '47'
    text: |-
      Voor zover niet uit de jaarrekening van de provincie of gemeente, alsmede uit de accountantsverklaring en het
      verslag van bevindingen, behorend bij die jaarrekening krachtens [artikel 217 van de Provinciewet][ref1] of
      [artikel 213 van de Gemeentewet][ref2], blijkt dat een specifieke uitkering rechtmatig is besteed, kan het bedrag
      waarvan de rechtmatige besteding niet vaststaat, worden teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel217
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel213
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '217'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '213'
  - number: '48'
    text: |-
      Onze Minister kan nadere regels stellen ten aanzien van de inrichting van aanvragen, het beleidsplan, het
      activiteitenplan, het projectplan, de begroting, de liquiditeitsprognose, de administratie, de jaarrekening,
      bedoeld in de [hoofdstukken IV][ref1] en [V][ref2], de subsidiedeclaratie, de verklaring van de accountant,
      bedoeld in [artikel 36, eerste lid][ref3], activiteitenverslagen en het bestuursverslag.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0006759#HoofdstukV
      [ref3]: https://wetten.overheid.nl/BWBR0006759#Artikel36
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0006759
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0006759
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0006759
        artikel: '36'
        hoofdstuk: V
  - number: '49'
    text: |-
      Onze Minister kan, gelet op het belang dat dit besluit beoogt te beschermen, artikelen buiten toepassing laten of
      daarvan afwijken voor zover strikte toepassing leidt tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel49
  - number: '52'
    text: 'Dit besluit kan worden aangehaald als: Bekostigingsbesluit cultuuruitingen.'
    url: https://wetten.overheid.nl/BWBR0006759/2007-01-24#Artikel52
