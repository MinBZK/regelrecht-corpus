preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuurbeheer en Visserij van 18 juni 1997, No J.97.5746, Directie
    Juridische Zaken, gedaan mede namens Onze Minister van Economische Zaken;

    Gelet op verordening (EG) nr 820/97 van de Raad van de Europese Unie van 21 april 1997 tot vaststelling van een
    identificatie- en registratieregeling voor runderen en inzake de etikettering van rundvlees en rundvleesproducten
    (PbEG L 117), alsmede de artikelen 2 en 4 van de Landbouwkwaliteitswet;

    De Raad van State gehoord (advies van 19 augustus 1997, No. W11.97.0340);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuurbeheer en Visserij van 23 september 1997, No.
    J.97.8654, Directie Juridische Zaken, uitgebracht mede namens Onze Minister van Economische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008947/1999-11-26#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      ln dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. [verordening 820/97](31997R0820): [verordening (EG) nr 820/97](31997R0820) van de Raad van de Europese Unie
      van 21 april 1997 tot vaststelling van een identificatie- en registratieregeling voor runderen en inzake de
      etikettering van rundvlees en rundvleesproducten (*PbEG* L 117);

      b. rundvlees: rundvlees als bedoeld in artikel 13 van [verordening 820/97](31997R0820);

      c. vereniging: vereniging als bedoeld in artikel 13 van [verordening 820/97](31997R0820);

      d. etiketteren: etiketteren als bedoeld in de begripsomschrijving van «etikettering» in artikel 13 van [verordening
      820/97](31997R0820);

      e. Produktschap: Produktschap voor Vee en Vlees.
    url: https://wetten.overheid.nl/BWBR0008947/1999-11-26#Artikel1
  - number: '2'
    text: |-
      Het is de handelaar of vereniging verboden in een verkooppunt rundvlees op zodanige wijze te etiketteren dat
      informatie wordt verstrekt over de oorsprong, bepaalde kenmerken of productieomstandigheden van het geëtiketteerde
      vlees of van het dier waarvan het vlees afkomstig is, tenzij is voldaan aan titel ll van [verordening 820/97]
      (31997R0820) en het bij of krachtens dit besluit bepaalde.
    url: https://wetten.overheid.nl/BWBR0008947/1999-11-26#Artikel2
  - number: '3'
    text: |-
      1 Onze Minister is bevoegd:

      a. te beslissen omtrent de aanvraag tot goedkeuring van een productspecificatie als bedoeld in artikel 14, eerste
      lid, van [verordening 820/97](31997R0820);

      b. te beslissen omtrent de erkenning van een controledienst als bedoeld in artikel 14, eerste lid, van [verordening
      820/97](31997R0820), alsmede

      c. tot het nemen van de bij of krachtens [verordening 820/97](31997R0820) gestelde maatregelen om de naleving van
      [verordening 820/97](31997R0820) te bewerkstelligen.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008947/1999-11-26#Artikel3
  - number: '4'
    text: |-
      1 Onze Minister kan voor de toepassing van de in [artikel 3][ref1] gestelde regels de medewerking vorderen van het
      bestuur van het Produktschap.

      2 Onze Minister kan bepalen dat de in [artikel 3, tweede lid][ref2], bedoelde nadere regels met betrekking tot
      [artikel 3, eerste lid, onderdelen ][ref3], door het bestuur van het Produktschap bij verordening worden gesteld.

      3 Onze Minister kan met betrekking tot het verlenen van de medewerking van het Produktschap regelen stellen
      of aanwijzingen geven en kan daarbij bepalen dat de krachtens verordening, bedoeld in het tweede lid, genomen
      besluiten de goedkeuring behoeven van een door hem aangewezen autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0008947#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008947#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0008947#Artikel3
    url: https://wetten.overheid.nl/BWBR0008947/1999-11-26#Artikel4
