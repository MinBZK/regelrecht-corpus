        paragraaf: '2'
  - number: '6'
    text: |-
      1 De volgende handelingen, indien de concentratie van asbestvezels is ingedeeld in risicoklasse 2 of 2A als
      bedoeld in [artikel 4.48][ref1] onderscheidenlijk [artikel 4.53a van het Arbeidsomstandighedenbesluit][ref2],
      mogen slechts worden verricht door een bedrijf dat in het bezit is van een certificaat als bedoeld in
      [artikel 4.54d, eerste lid, van het Arbeidsomstandighedenbesluit][ref3]:

      a. het geheel of gedeeltelijk afbreken of uit elkaar nemen van bouwwerken of objecten indien in die bouwwerken of
      objecten asbest of een asbesthoudend product is verwerkt;

      b. het verwijderen van asbest of asbesthoudende producten uit bouwwerken of objecten;

      c. het opruimen van asbest dat of asbesthoudende producten die ten gevolge van een incident is of zijn vrijgekomen.

      2 [Artikel 4][ref4] is, met uitzondering van het eerste lid onder a, van overeenkomstige toepassing.

      3 Het is verboden een handeling als bedoeld in het eerste lid te doen verrichten in strijd met het bepaalde in het
      eerste lid in verbinding met het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.48
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4.53a
