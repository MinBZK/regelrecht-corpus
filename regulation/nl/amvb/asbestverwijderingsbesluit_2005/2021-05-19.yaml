  - number: '14'
    text: |-
      1 De gegevens en bescheiden die in het LAVS zijn opgenomen, worden bewaard totdat het LAVS is opgeheven.

      2 De LAVS-beheerder kan ten behoeve van de goede werking van het LAVS gegevens en bescheiden die in het LAVS zijn
      opgenomen, verwijderen overeenkomstig bij ministeriële regeling gestelde regels indien de gegevens en bescheiden
      voor degenen die op grond van [artikel 13, eerste en tweede lid][ref1], toegang tot het LAVS hebben, redelijkerwijs
      niet meer van belang zijn om te kunnen raadplegen.


