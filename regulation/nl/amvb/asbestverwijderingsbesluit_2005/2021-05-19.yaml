  - number: '7'
    text: |-
      Degene die anders dan in de uitoefening van een beroep of bedrijf asbest of een asbesthoudend product verwijdert,
      draagt er zorg voor dat:

      a. de verwijderingshandeling, indien technisch mogelijk, wordt verricht alvorens het bouwwerk of object waarin het
      asbest of asbesthoudende product zich bevindt, geheel of gedeeltelijk wordt afgebroken of uit elkaar genomen;

      b. verwijderd asbest of een verwijderd asbesthoudend product onmiddellijk van niet-asbesthoudende producten wordt
      gescheiden en verzameld;

      c. het verzamelde asbest of de verzamelde asbesthoudende producten, tenzij dit door vorm of formaat niet mogelijk
      is, onmiddellijk wordt respectievelijk worden verpakt in niet-luchtdoorlatend verpakkingsmateriaal van zodanige
      dikte en sterkte dat deze niet scheurt;

      d. niet-luchtdoorlatend verpakkingsmateriaal waarin verwijderd asbest of een verwijderd asbesthoudend product is
      verpakt onmiddellijk wordt afgesloten en opgeslagen in een afgesloten opslagplaats;

      e. ingeval verzameld asbest of verzamelde asbesthoudende producten niet in niet-luchtdoorlatend
      verpakkingsmateriaal kan respectievelijk kunnen worden verpakt, dat asbest of die asbesthoudende producten
      onmiddellijk in een afgesloten container wordt respectievelijk worden opgeslagen;

      f. niet-luchtdoorlatend verpakkingsmateriaal waarin verwijderd asbest of een verwijderd
      asbesthoudend product is verpakt op duidelijke wijze wordt voorzien van aanduidingen overeenkomstig
      [artikel 7 van het Productenbesluit asbest][ref1];

      g. opgeslagen verwijderd asbest of een opgeslagen verwijderd asbesthoudend product binnen
      twee weken na het vrijkomen hiervan wordt afgevoerd naar een inrichting als bedoeld in
      [artikel 1.1, vierde lid, van de Wet milieubeheer][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017778#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel1.1
