  - number: '12'
    text: |-
      1 De LAVS-beheerder draagt er zorg voor dat het LAVS zeven dagen per week gedurende 24 uur per dag beschikbaar is,
      behoudens korte perioden waarin dat onverenigbaar is met aangekondigde werkzaamheden die noodzakelijk zijn voor de
      goede werking van het systeem.

      2 De LAVS-beheerder draagt er zorg voor dat storingen in de goede werking van het LAVS zoveel mogelijk worden
      voorkomen en dat eventuele storingen zo snel mogelijk worden verholpen.

      3 De LAVS-beheerder draagt zorg voor de instandhouding van een helpdesk, die fungeert als centraal aanspreekpunt
      voor de gebruikers. De helpdesk is in elk geval per e-mail bereikbaar.
    url: https://wetten.overheid.nl/BWBR0019316/2021-05-19#Artikel12
  - number: '13'
    text: |-
      1 De gegevens en bescheiden die in het LAVS zijn opgenomen, zijn toegankelijk voor:

      a. de instanties die belast zijn met het toezicht op de naleving van de voor asbestsaneringen geldende regels en
      de handhaving van die regels, voor zover het asbestsaneringsprojecten betreft die behoren tot het werkgebied van de
      betrokken instantie;

      b. certificerende instellingen die op grond van de [Arbeidsomstandighedenwet][ref1] zijn aangewezen door de
      Minister van Sociale Zaken en Werkgelegenheid voor het verstrekken van certificaten aan bedrijven die werkzaamheden
      verrichten met betrekking tot asbestsaneringen;

      c. de Stichting Raad voor Accreditatie;

      d. de instanties die op grond van de Wet veiligheidsrisico’s zijn belast met de rampenbestrijding, de
      crisisbeheersing en de geneeskundige hulpverlening;

      e. de politie;

      f. de Rijksdienst voor Ondernemend Nederland of andere instanties die zijn belast met de verstrekking van
      overheidswege van subsidies voor asbestsaneringsprojecten;

      g. de Belastingdienst, voor zover het asbestsaneringsprojecten betreft waarvoor op grond van
      [artikel 29b, eerste lid, van de Wet belastingen op milieugrondslag][ref2] een vrijstelling van de
      afvalstoffenbelasting geldt.

      2 De gegevens en bescheiden die in het LAVS zijn opgenomen, zijn toegankelijk voor:

      a. bedrijven die in het bezit zijn van een certificaat als bedoeld in [artikel 4.54a, vierde lid][ref3], of
      [4.54d, eerste lid, van het Arbeidsomstandighedenbesluit][ref4], voor zover het bedrijf of zijn rechtsvoorgangers
      ten behoeve van het asbestsaneringsproject waarop de gegevens en bescheiden betrekking hebben, werkzaamheden
      verrichten of hebben verricht, alsmede de rechtsopvolgers van die bedrijven;

      b. bedrijven of instellingen die door middel van eHerkenning kunnen worden geauthentiseerd, of hun
      rechtsvoorgangers of rechtsopvolgers, die asbest of een asbesthoudend product uit een bouwwerk of object
      hebben doen verwijderen of doen verwijderen, voor zover het de gegevens en bescheiden betreft die op hun
      asbestsaneringsproject betrekking hebben;

      c. laboratoria als bedoeld in [artikel 4.51a, eerste lid, van het Arbeidsomstandighedenbesluit][ref5] en bedrijven
      als bedoeld in artikel 4.51a, derde lid, van het Arbeidsomstandighedenbesluit.

      3 Voor de toegang tot het LAVS wordt gebruikgemaakt van eHerkenning of een ander door de LAVS-beheerder aangewezen
      elektronisch authenticatiemiddel.

      4 De toegang tot het LAVS is beperkt tot medewerkers van de in het eerste en tweede lid bedoelde instanties en
      bedrijven die rechtstreeks zijn betrokken bij de uitvoering van de wettelijke taak van de betrokken instantie dan
      wel de werkzaamheden die het betrokken bedrijf ten behoeve van een asbestsaneringsproject verricht en die door de
      instantie of bedrijf zijn geautoriseerd.

      5 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de wijze van invoering en
      raadpleging van gegevens en bescheiden in het LAVS door degenen die toegang tot dat systeem hebben. Daarin kan ook
      het vereiste betrouwbaarheidsniveau van de eHerkenning worden vastgesteld.


