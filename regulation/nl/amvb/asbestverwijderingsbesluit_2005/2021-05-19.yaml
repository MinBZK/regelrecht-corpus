  - number: '10'
    text: |-
      1 De LAVS-beheerder draagt er zorg voor dat de gegevens en bescheiden over asbestsaneringsprojecten die in het LAVS
      zijn ingevoerd, onverwijld ter beschikking worden gesteld van de instanties waarvoor de gegevens en bescheiden op
      grond van [artikel 13, eerste lid, onder a en b][ref1], toegankelijk zijn.

      2 De LAVS-beheerder draagt er zorg voor dat degene die verplicht is gegevens en bescheiden over een
      asbestsaneringsproject te verstrekken of in het LAVS in te voeren, ter voldoening aan die verplichting gebruik kan
      maken van gegevens en bescheiden die al in het LAVS zijn ingevoerd zonder deze opnieuw te hoeven invoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0019316#Artikel13
    url: https://wetten.overheid.nl/BWBR0019316/2021-05-19#Artikel10
