        artikel: '13'
        paragraaf: '4'
  - number: '11'
    text: |-
      1 De LAVS-beheerder draagt er zorg voor dat aan elk asbestsaneringsproject waarover in het LAVS gegevens en
      bescheiden worden opgenomen, een uniek kenmerk wordt toegekend, waarmee het project kan worden geïdentificeerd.

      2 De LAVS-beheerder draagt er zorg voor dat de gegevens en bescheiden die met betrekking
      tot een asbestsaneringsproject in het LAVS of de landelijke voorziening, bedoeld in
      [artikel 7.6 van de Wet algemene bepalingen omgevingsrecht][ref1], zijn ingevoerd, in het LAVS worden opgenomen
      onder het unieke kenmerk van het asbestsaneringsproject waarop ze betrekking hebben.

      3 De LAVS-beheerder is niet gehouden de juistheid, volledigheid en waarheidsgetrouwheid van de gegevens en
      bescheiden die in het LAVS worden opgenomen, te onderzoeken.

      4 De LAVS-beheerder draagt er zorg voor dat de gegevens en bescheiden die in het LAVS zijn ingevoerd, na de
      invoering niet worden gewijzigd, tenzij hij daartoe verplicht is op grond van artikel 5, eerste lid, aanhef
      en onder d, of artikel 16 van de algemene verordening gegevensbescherming of indien een verzoek is gedaan voor
      een wijziging die gelet op de doelstellingen van het desbetreffende voorschrift van ondergeschikt belang is. In
      aanvulling op eerder ingevoerde onjuiste of onvolledige gegevens en bescheiden kunnen, mede ter uitvoering van
      genoemde bepalingen, alsnog de juiste of volledige gegevens en bescheiden in het LAVS worden ingevoerd.

      5 De LAVS-beheerder kan de mogelijkheid bieden dat de instanties en bedrijven die op grond van
      [artikel 13, eerste en tweede lid][ref2], toegang tot het LAVS hebben, andere gegevens en bescheiden met betrekking
      tot het asbestsaneringsproject in het LAVS invoeren, voor zover die gegevens en bescheiden de persoonlijke
      levenssfeer van een persoon op wie zij betrekking hebben, niet kunnen schaden.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel7.6
      [ref2]: https://wetten.overheid.nl/BWBR0019316#Artikel13
