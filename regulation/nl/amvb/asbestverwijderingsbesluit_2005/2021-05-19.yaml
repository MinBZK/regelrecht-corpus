preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 6 april
    2005, nr. MJZ2005029056, Directie Juridische Zaken, Afdeling Wetgeving, gedaan mede namens de Staatssecretaris van
    Sociale Zaken en Werkgelegenheid en in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport,
    Onze Minister van Verkeer en Waterstaat en Onze Minister van Economische Zaken;

    Gelet op artikel 7 van richtlijn nr. 87/217/EEG van de Raad van 19 maart 1987 inzake voorkoming en vermindering
    van verontreiniging van het milieu door asbest (PbEG L 85), artikel 1, onderdelen 11, 13 en 14, voor zover het
    betreft artikel 12 ter, van richtlijn nr. 2003/18/EG van het Europees Parlement en de Raad van 27 maart 2003 (PbEU
    L 97) tot wijziging van richtlijn nr. 83/477/EEG van de Raad betreffende de bescherming van werknemers tegen de
    risico’s van blootstelling van asbest op het werk, de artikelen 24, 35, vierde lid, en 39, derde lid, van de Wet
    milieugevaarlijke stoffen, de artikelen 8, achtste lid, juncto 8, tweede lid, onderdelen d en h, en 120 van de
    Woningwet voorzover het betreft artikel 10, alsmede de artikelen 16, 20, 21, 22, 23 en 33, tweede lid, van de
    Arbeidsomstandighedenwet 1998 voorzover het betreft artikel 12 en artikel 8.44, eerste lid, van de Wet milieubeheer
    voorzover het betreft artikel 13;

    De Raad van State gehoord (advies van 14 juli 2005, nr. W08.05.0120/V);

    Gezien het nader rapport van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van
    14 december 2005, nr. DJZ2005215654, Directie Juridische Zaken, Afdeling Wetgeving, uitgebracht mede namens de
    Staatssecretaris van Sociale Zaken en Werkgelegenheid en in overeenstemming met Onze Minister van Volksgezondheid,
    Welzijn en Sport, Onze Minister van Verkeer en Waterstaat en Onze Minister van Economische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0019316/2021-05-19#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *algemene verordening gegevensbescherming:* Verordening (EU) 2016/679 van het Europees Parlement en de Raad van
      27 april 2016 betreffende de bescherming van natuurlijke personen in verband met de verwerking van persoonsgegevens
      en betreffende het vrije verkeer van die gegevens en tot intrekking van Richtlijn 95.46/EG (algemene verordening
      gegevensbescherming) (PbEU 2016 L 119);
        - *asbest:* stoffen die een of meer van de volgende vezelachtige silicaten bevatten: 1°. actinoliet (CAS-nummer
      77536-66-4); 2°. amosiet (CAS-nummer 12172-73-5); 3°. anthofylliet (CAS-nummer 77536-67-5); 4°. chrysotiel (CAS-
      nummer 12001-29-5); 5°. tremoliet (CAS-nummer 77536-68-6); 6°. crocidoliet (CAS-nummer 12001-28-4);
        - *asbesthoudend product:* product waarin asbest voorkomt;
        - *asbestinventarisatie:* inventarisatie als bedoeld in
      [artikel 4.54a, eerste lid, van het Arbeidsomstandighedenbesluit][ref1];
        - *asbestinventarisatierapport:* rapport als bedoeld in
      [artikel 4.54a, derde lid, van het Arbeidsomstandighedenbesluit][ref2];
        - *asbestsanering:* keten van handelingen die tot doel hebben een gebouw, object of terrein, waar asbest of een
      asbesthoudend product aanwezig is, geheel of gedeeltelijk te saneren en die achtereenvolgens de inventarisatie en
      verwijdering van het asbest of asbesthoudend product, de eindbeoordeling van het resultaat van de verwijdering en
      de afvoer en verwerking van het asbestafval omvat;
        - *bouwwerk:* bouwwerk in de zin van de [Woningwet][ref3];
        - *LAVS:* landelijk asbestvolgsysteem, bedoeld in [artikel 9.5.7, eerste lid, van de Wet milieubeheer][ref4];
        - *LAVS-beheerder:* Rijkswaterstaat, optredend namens Onze Minister ter uitvoering van
      [artikel 9.5.7, tweede lid, van de Wet milieubeheer][ref5];
        - *object:* constructie, installatie, apparaat of transportmiddel, niet zijnde een bouwwerk en niet bedoeld ter
      ondersteuning van de functie van een bouwwerk;
        - *sloopmelding:* melding als bedoeld in [artikel 1.26, eerste lid, van het Bouwbesluit 2012][ref6].

      2 In dit besluit wordt onder woning verstaan hetgeen daaronder wordt verstaan in de [Woningwet][ref7].


