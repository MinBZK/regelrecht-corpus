  - number: '2'
    text: |-
      Dit besluit is niet van toepassing op:

      a. puin, puingranulaat, bodem, grond, slib, baggerspecie en grondwater;

      b. producten waaromtrent regels zijn gesteld in de
      [Regeling afgedankte elektrische en elektronische apparatuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034782
    url: https://wetten.overheid.nl/BWBR0019316/2021-05-19#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0034782
  - number: '3'
    text: |-
      1 Degene die:

      a. anders dan in de uitoefening van een beroep of bedrijf een bouwwerk of object geheel of gedeeltelijk afbreekt of
      uit elkaar neemt, of

      b. een bouwwerk of object geheel of gedeeltelijk doet afbreken of uit elkaar doet nemen,

      draagt er zorg voor dat voor het bouwwerk of object, dan wel het gedeelte daarvan ten aanzien waarvan de handeling
      wordt verricht, eerst een asbestinventarisatie wordt verricht en een asbestinventarisatierapport wordt opgesteld
      indien in het bouwwerk of object naar redelijke verwachting asbest of een asbesthoudend product is toegepast.

      2 Degene die:

      a. anders dan in de uitoefening van een beroep of bedrijf asbest of een asbesthoudend product uit een bouwwerk of
      object verwijdert, of

      b. asbest of een asbesthoudend product uit een bouwwerk of object doet verwijderen,

      draagt er zorg voor dat voor het bouwwerk of object eerst een asbestinventarisatie wordt verricht en een
      asbestinventarisatierapport wordt opgesteld.

      3 Degene die materialen of producten doet opruimen die ten gevolge van een incident zijn vrijgekomen,
      draagt er zorg voor dat voor de materialen of producten eerst een asbestinventarisatie wordt verricht en een
      asbestinventarisatierapport wordt opgesteld indien in de materialen of producten naar redelijke verwachting asbest
      of een asbesthoudend product is toegepast.

      4 De personen, bedoeld in het eerste tot en met derde lid, beschikken met betrekking tot het bouwwerk of object
      waar handelingen worden verricht als in die leden bedoeld, over het asbestinventarisatierapport dat ten behoeve van
      die handelingen is opgesteld.
    url: https://wetten.overheid.nl/BWBR0019316/2021-05-19#Artikel3
  - number: '4'
    text: |-
      1 [Artikel 3][ref1] is niet van toepassing op:

      a. werkzaamheden die worden uitgevoerd in of aan bouwwerken of objecten, niet zijnde zeeschepen als bedoeld in
      [artikel 8:2, eerste lid, van het Burgerlijk Wetboek][ref2], die op of na 1 januari 1994 zijn gebouwd dan wel
      vervaardigd;

      b. het geheel of gedeeltelijk verwijderen van rem- en frictiematerialen;

      c. wegen als bedoeld in het [Besluit asbestwegen milieubeheer][ref3].

      2 [Artikel 3][ref4] is voorts niet van toepassing op het in de uitoefening van een beroep of bedrijf geheel of
      gedeeltelijk:

      a. verwijderen van waterleidingbuizen, gasleidingbuizen, rioolleidingbuizen en mantelbuizen, voorzover zij deel
      uitmaken van het ondergrondse openbare gas-, water- en rioolleidingnet;

      b. verwijderen van geklemde vloerplaten onder verwarmingstoestellen;

      c. verwijderen van beglazingskit dat is verwerkt in de constructie van kassen;

      d. verwijderen van pakkingen uit verbrandingsmotoren;

      e. verwijderen van pakkingen uit procesinstallaties onderscheidelijk verwarmingstoestellen met een nominaal
      vermogen dat lager is dan 2250 kilowatt.

      3 [Artikel 3][ref5] is voorts niet van toepassing op het anders dan in de uitoefening van een beroep of bedrijf in
      zijn geheel:

      a. verwijderen van geschroefde, asbesthoudende platen waarin de asbestvezels hechtgebonden zijn, niet zijnde
      dakleien, uit een woning of uit een op het erf van die woning staand bijgebouw, voorzover de woning of het
      bijgebouw niet in het kader van de uitoefening van een beroep of bedrijf worden gebruikt of bedoeld zijn voor
      gebruik in dat kader en de oppervlakte van de te verwijderen asbesthoudende platen maximaal vijfendertig vierkante
      meter per kadastraal perceel bedraagt;

      b. verwijderen van asbesthoudende vloertegels of niet-gelijmde, asbesthoudende vloerbedekking uit een woning of
      uit een op het erf van die woning staand bijgebouw, voorzover de woning of het bijgebouw niet in het kader van de
      uitoefening van een beroep of bedrijf worden gebruikt of bedoeld zijn voor gebruik in dat kader en de oppervlakte
      van de te verwijderen asbesthoudende vloerbedekking of vloertegels maximaal vijfendertig vierkante meter per
      kadastraal perceel bedraagt;

      c. verwijderen van geschroefde, asbesthoudende platen waarin de asbestvezels hechtgebonden zijn, niet zijnde
      dakleien, of asbesthoudende vloertegels of niet-gelijmde, asbesthoudende vloerbedekking uit een vaartuig, voorzover
      het vaartuig niet in het kader van de uitoefening van een beroep of bedrijf wordt gebruikt of bedoeld is voor
      gebruik in dat kader en de oppervlakte van de te verwijderen asbesthoudende platen maximaal vijfendertig vierkante
      meter bedraagt.


