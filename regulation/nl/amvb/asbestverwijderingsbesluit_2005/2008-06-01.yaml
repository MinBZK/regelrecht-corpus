---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: asbestverwijderingsbesluit_2005
regulatory_layer: AMVB
publication_date: '2025-11-12'
valid_from: '2008-06-01'
bwb_id: BWBR0019316
url: https://wetten.overheid.nl/BWBR0019316/2008-06-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 6 april
    2005, nr. MJZ2005029056, Directie Juridische Zaken, Afdeling Wetgeving, gedaan mede namens de Staatssecretaris van
    Sociale Zaken en Werkgelegenheid en in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport,
    Onze Minister van Verkeer en Waterstaat en Onze Minister van Economische Zaken;

    Gelet op artikel 7 van richtlijn nr. 87/217/EEG van de Raad van 19 maart 1987 inzake voorkoming en vermindering
    van verontreiniging van het milieu door asbest (PbEG L 85), artikel 1, onderdelen 11, 13 en 14, voor zover het
    betreft artikel 12 ter, van richtlijn nr. 2003/18/EG van het Europees Parlement en de Raad van 27 maart 2003 (PbEU
    L 97) tot wijziging van richtlijn nr. 83/477/EEG van de Raad betreffende de bescherming van werknemers tegen de
    risico’s van blootstelling van asbest op het werk, de artikelen 24, 35, vierde lid, en 39, derde lid, van de Wet
    milieugevaarlijke stoffen, de artikelen 8, achtste lid, juncto 8, tweede lid, onderdelen d en h, en 120 van de
    Woningwet voorzover het betreft artikel 10, alsmede de artikelen 16, 20, 21, 22, 23 en 33, tweede lid, van de
    Arbeidsomstandighedenwet 1998 voorzover het betreft artikel 12 en artikel 8.44, eerste lid, van de Wet milieubeheer
    voorzover het betreft artikel 13;

    De Raad van State gehoord (advies van 14 juli 2005, nr. W08.05.0120/V);

    Gezien het nader rapport van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van
    14 december 2005, nr. DJZ2005215654, Directie Juridische Zaken, Afdeling Wetgeving, uitgebracht mede namens de
    Staatssecretaris van Sociale Zaken en Werkgelegenheid en in overeenstemming met Onze Minister van Volksgezondheid,
    Welzijn en Sport, Onze Minister van Verkeer en Waterstaat en Onze Minister van Economische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel1
  - number: 1.1.a
    text: |-
      asbest: 'de volgende vezelachtige silicaten: actinoliet (CAS-nummer 77536-66-4), amosiet (CAS-nummer 12172-73-5),'
      anthofylliet (CAS-nummer 77536-67-5), chrysotiel (CAS-nummer 12001-29-5), crocidoliet (CAS-nummer 12001-28-4) en
      tremoliet (CAS-nummer 77536-68-6);
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel1
  - number: 1.1.b
    text: |-
      asbestinventarisatierapport: rapport dat voldoet aan de eisen, gesteld in
      [artikel 4.54a, eerste, derde en vierde lid, van het Arbeidsomstandighedenbesluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 1.1.c
    text: 'Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;'
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel1
  - number: 1.1.d
    text: 'object: constructie, installatie, apparaat of transportmiddel, niet zijnde een bouwwerk.'
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel1
  - number: '1.2'
    text: |-
      In dit besluit wordt onder woning verstaan hetgeen daaronder wordt verstaan in de [Woningwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: '2'
    text: 'Dit besluit is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel2
  - number: 2.a
    text: puin, puingranulaat, bodem, grond, slib, baggerspecie en grondwater;
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel2
  - number: 2.b
    text: |-
      producten waaromtrent regels zijn gesteld bij of krachtens het
      [Besluit beheer elektrische en elektronische apparatuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016990
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0016990
  - number: '3.1'
    text: 'Degene die:'
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel3
  - number: 3.1.a
    text: |-
      anders dan in de uitoefening van een beroep of bedrijf een bouwwerk of object geheel of gedeeltelijk afbreekt of
      uit elkaar neemt, of
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel3
  - number: 3.1.b
    text: een bouwwerk of object geheel of gedeeltelijk doet afbreken of uit elkaar doet nemen,
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel3
  - number: '3.2'
    text: 'Degene die:'
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel3
  - number: 3.2.a
    text: |-
      anders dan in de uitoefening van een beroep of bedrijf asbest of een asbesthoudend product uit een bouwwerk of
      object verwijdert, of
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel3
  - number: 3.2.b
    text: asbest of een asbesthoudend product uit een bouwwerk of object doet verwijderen,
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel3
  - number: '3.3'
    text: |-
      Degene die materialen of producten doet opruimen die ten gevolge van een incident zijn vrijgekomen, beschikt met
      betrekking tot de materialen of producten over een asbestinventarisatierapport indien hij weet of redelijkerwijs
      kan weten dat zich in de materialen of producten asbest of een asbesthoudend product bevindt.
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel3
  - number: '4.1'
    text: |-
      [Artikel 3][ref1] is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0019316#Artikel3
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0019316
        artikel: '3'
        paragraaf: '2'
  - number: 4.1.a
    text: |-
      werkzaamheden die worden uitgevoerd in of aan bouwwerken of objecten, niet zijnde zeeschepen als bedoeld in
      [artikel 8:2, eerste lid, van het Burgerlijk Wetboek][ref1], die op of na 1 januari 1994 zijn gebouwd dan wel
      vervaardigd;


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel2
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '2'
  - number: 4.1.b
    text: het geheel of gedeeltelijk verwijderen van rem- en frictiematerialen;
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel4
  - number: 4.1.c
    text: |-
      wegen als bedoeld in het [Besluit asbestwegen milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011619
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011619
  - number: '4.2'
    text: |-
      [Artikel 3][ref1] is voorts niet van toepassing op het in de uitoefening van een beroep of bedrijf geheel of
      gedeeltelijk:


      [ref1]: https://wetten.overheid.nl/BWBR0019316#Artikel3
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0019316
        artikel: '3'
        paragraaf: '2'
  - number: 4.2.a
    text: |-
      verwijderen van waterleidingbuizen, gasleidingbuizen, rioolleidingbuizen en mantelbuizen, voorzover zij deel
      uitmaken van het ondergrondse openbare gas-, water- en rioolleidingnet;
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel4
  - number: 4.2.b
    text: verwijderen van geklemde vloerplaten onder verwarmingstoestellen;
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel4
  - number: 4.2.c
    text: verwijderen van beglazingskit dat is verwerkt in de constructie van kassen;
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel4
  - number: 4.2.d
    text: verwijderen van pakkingen uit verbrandingsmotoren;
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel4
  - number: 4.2.e
    text: |-
      verwijderen van pakkingen uit procesinstallaties onderscheidelijk verwarmingstoestellen met een nominaal vermogen
      dat lager is dan 2250 kilowatt.
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel4
  - number: '4.3'
    text: |-
      [Artikel 3][ref1] is voorts niet van toepassing op het anders dan in de uitoefening van een beroep of bedrijf in
      zijn geheel:


      [ref1]: https://wetten.overheid.nl/BWBR0019316#Artikel3
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0019316
        artikel: '3'
        paragraaf: '2'
  - number: 4.3.a
    text: |-
      verwijderen van geschroefde, asbesthoudende platen waarin de asbestvezels hechtgebonden zijn, niet zijnde dakleien,
      uit een woning of uit een op het erf van die woning staand bijgebouw, voorzover de woning of het bijgebouw niet in
      het kader van de uitoefening van een beroep of bedrijf worden gebruikt of bedoeld zijn voor gebruik in dat kader
      en de oppervlakte van de te verwijderen asbesthoudende platen maximaal vijfendertig vierkante meter per kadastraal
      perceel bedraagt;
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel4
  - number: 4.3.b
    text: |-
      verwijderen van asbesthoudende vloertegels of niet-gelijmde, asbesthoudende vloerbedekking uit een woning of uit
      een op het erf van die woning staand bijgebouw, voorzover de woning of het bijgebouw niet in het kader van de
      uitoefening van een beroep of bedrijf worden gebruikt of bedoeld zijn voor gebruik in dat kader en de oppervlakte
      van de te verwijderen asbesthoudende vloerbedekking of vloertegels maximaal vijfendertig vierkante meter per
      kadastraal perceel bedraagt;
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel4
  - number: 4.3.c
    text: |-
      verwijderen van geschroefde, asbesthoudende platen waarin de asbestvezels hechtgebonden zijn, niet zijnde dakleien,
      of asbesthoudende vloertegels of niet-gelijmde, asbesthoudende vloerbedekking uit een vaartuig, voorzover het
      vaartuig niet in het kader van de uitoefening van een beroep of bedrijf wordt gebruikt of bedoeld is voor gebruik
      in dat kader en de oppervlakte van de te verwijderen asbesthoudende platen maximaal vijfendertig vierkante meter
      bedraagt.
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel4
  - number: '5'
    text: |-
      Degene die een handeling doet verrichten waarop [artikel 3][ref1] van toepassing is, verstrekt, voordat de
      handeling wordt verricht, een afschrift van het asbestinventarisatierapport aan degene die de handeling verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0019316#Artikel3
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019316
        artikel: '3'
        paragraaf: '2'
  - number: '6.1'
    text: |-
      De volgende handelingen, indien de concentratie van asbeststof is ingedeeld in risicoklasse 2 of 3 als
      bedoeld in [artikel 4.48][ref1] onderscheidenlijk [artikel 4.53a van het Arbeidsomstandighedenbesluit][ref2],
      mogen slechts worden verricht door een bedrijf dat in het bezit is van een certificaat als bedoeld in
      [artikel 4.54d, eerste lid, van het Arbeidsomstandighedenbesluit][ref3]:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 6.1.a
    text: |-
      het geheel of gedeeltelijk afbreken of uit elkaar nemen van bouwwerken of objecten indien in die bouwwerken of
      objecten asbest of een asbesthoudend product is verwerkt;
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel6
  - number: 6.1.b
    text: het verwijderen van asbest of asbesthoudende producten uit bouwwerken of objecten;
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel6
  - number: 6.1.c
    text: het opruimen van asbest dat of asbesthoudende producten die ten gevolge van een incident is of zijn vrijgekomen.
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel6
  - number: '6.2'
    text: |-
      [Artikel 4][ref1] is, met uitzondering van het eerste lid onder a, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019316#Artikel4
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019316
        artikel: '4'
        paragraaf: '2'
  - number: '6.3'
    text: |-
      Het is verboden een handeling als bedoeld in het eerste lid te doen verrichten in strijd met het bepaalde in het
      eerste lid in verbinding met het tweede lid.
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel6
  - number: '7'
    text: |-
      Degene die anders dan in de uitoefening van een beroep of bedrijf asbest of een asbesthoudend product verwijdert,
      draagt er zorg voor dat:
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel7
  - number: 7.a
    text: |-
      de verwijderingshandeling, indien technisch mogelijk, wordt verricht alvorens het bouwwerk of object waarin het
      asbest of asbesthoudende product zich bevindt, geheel of gedeeltelijk wordt afgebroken of uit elkaar genomen;
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel7
  - number: 7.b
    text: |-
      verwijderd asbest of een verwijderd asbesthoudend product onmiddellijk van niet-asbesthoudende producten wordt
      gescheiden en verzameld;
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel7
  - number: 7.c
    text: |-
      het verzamelde asbest of de verzamelde asbesthoudende producten, tenzij dit door vorm of formaat niet mogelijk is,
      onmiddellijk wordt respectievelijk worden verpakt in niet-luchtdoorlatend verpakkingsmateriaal van zodanige dikte
      en sterkte dat deze niet scheurt;
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel7
  - number: 7.d
    text: |-
      niet-luchtdoorlatend verpakkingsmateriaal waarin verwijderd asbest of een verwijderd asbesthoudend product is
      verpakt onmiddellijk wordt afgesloten en opgeslagen in een afgesloten opslagplaats;
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel7
  - number: 7.e
    text: |-
      ingeval verzameld asbest of verzamelde asbesthoudende producten niet in niet-luchtdoorlatend verpakkingsmateriaal
      kan respectievelijk kunnen worden verpakt, dat asbest of die asbesthoudende producten onmiddellijk in een
      afgesloten container wordt respectievelijk worden opgeslagen;
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel7
  - number: 7.f
    text: |-
      niet-luchtdoorlatend verpakkingsmateriaal waarin verwijderd asbest of een verwijderd asbesthoudend
      product is verpakt op duidelijke wijze wordt voorzien van aanduidingen overeenkomstig
      [artikel 7 van het Productenbesluit asbest][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017778#Artikel7
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017778
        artikel: '7'
  - number: 7.g
    text: |-
      opgeslagen verwijderd asbest of een opgeslagen verwijderd asbesthoudend product binnen twee weken na het vrijkomen
      hiervan wordt afgevoerd naar een inrichting als bedoeld in [artikel 1.1, vierde lid, van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: '8.1'
    text: |-
      Degene die anders dan in de uitoefening van een beroep of bedrijf een handeling als bedoeld in [artikel 7][ref1]
      verricht, doet dat op een zodanige wijze dat gevaren voor mens en milieu die door zodanige handelingen kunnen
      ontstaan, worden voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0019316#Artikel7
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019316
        artikel: '7'
        paragraaf: '3'
  - number: '8.2'
    text: |-
      Bij regeling van Onze Minister kunnen met het oog op het voorkomen van gevaren voor mens en milieu regels worden
      gegeven die ten minste bij het verrichten van zodanige handelingen in acht worden genomen.
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel8
  - number: '9.1'
    text: |-
      Degene die in een binnenruimte een handeling doet verrichten waarop [artikel 6, eerste lid][ref1],
      van toepassing is, draagt er zorg voor dat direct na het verrichten van die handeling
      een eindbeoordeling wordt uitgevoerd overeenkomstig het bepaalde bij of krachtens
      [artikel 4.51a, eerste, tweede en vijfde lid, van het Arbeidsomstandighedenbesluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019316#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0019316
        artikel: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
  - number: '9.2'
    text: |-
      Degene die in de buitenlucht een handeling doet verrichten waarop [artikel 6, eerste lid][ref1],
      van toepassing is, draagt er zorg voor dat direct na het verrichten van die handeling
      een visuele inspectie wordt uitgevoerd overeenkomstig het bepaalde bij of krachtens
      [4.51a, derde en vijfde lid, van het Arbeidsomstandighedenbesluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019316#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0019316
        artikel: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
  - number: '9.3'
    text: |-
      Het is verboden andere werkzaamheden in een binnenruimte te verrichten of te doen verrichten met betrekking
      tot een bouwwerk of object ten aanzien waarvan een handeling als bedoeld in [artikel 6, eerste lid][ref1],
      is verricht, zolang niet een eindbeoordeling als bedoeld in het eerste lid is uitgevoerd of indien
      uit de eindbeoordeling, bedoeld in het eerste lid, volgt dat er op de plaats van de handeling
      nog visueel waarneembaar asbest aanwezig is of de concentratie asbeststof in de lucht, bedoeld in
      [artikel 4.55a, tweede lid, van het Arbeidsomstandighedenbesluit][ref2] wordt overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0019316#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0019316
        artikel: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
  - number: '9.4'
    text: |-
      Het is verboden andere werkzaamheden in de buitenlucht te verrichten of te doen verrichten met betrekking tot een
      bouwwerk of object ten aanzien waarvan een handeling als bedoeld in [artikel 6, eerste lid, onder a of b][ref1],
      is verricht of op de plaats waar een handeling als bedoeld in [artikel 6, eerste lid, onder c][ref2], is verricht,
      zolang niet een visuele inspectie als bedoeld in het tweede lid is uitgevoerd of indien uit de visuele inspectie,
      bedoeld in het tweede lid, volgt dat er op de plaats van de handeling nog visueel waarneembaar asbest aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0019316#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0019316#Artikel6
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0019316
        artikel: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0019316
        artikel: '6'
        paragraaf: '3'
  - number: '10'
    text: 'In de bouwverordening worden regels gesteld inhoudende dat:'
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel10
  - number: 10.a
    text: |-
      onverminderd het ter zake bepaalde in de bouwverordening het verboden is te slopen zonder of in afwijking van een
      vergunning van burgemeester en wethouders (sloopvergunning), voorzover in het bouwwerk dat geheel of gedeeltelijk
      wordt gesloopt asbest of een asbesthoudend product aanwezig is;
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel10
  - number: 10.b
    text: |-
      het onder a bepaalde niet van toepassing is op een handeling als bedoeld in [artikel 4, eerste en tweede lid][ref1],
      indien die wordt verricht in het kader van de uitoefening van een beroep of bedrijf;


      [ref1]: https://wetten.overheid.nl/BWBR0019316#Artikel4
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0019316
        artikel: '4'
        paragraaf: '2'
  - number: 10.c
    text: |-
      het onder a bepaalde niet van toepassing is op een handeling als bedoeld in [artikel 4, eerste en derde lid][ref1],
      indien die niet wordt verricht in het kader van de uitoefening van een beroep of bedrijf en het voornemen tot
      slopen bij burgemeester en wethouders is gemeld en zij overeenkomstig bij de bouwverordening gegeven voorschriften
      binnen acht dagen na de dag waarop het voornemen tot slopen is gemeld, schriftelijk aan degene die heeft gemeld
      hebben medegedeeld dat geen sloopvergunning is vereist;


      [ref1]: https://wetten.overheid.nl/BWBR0019316#Artikel4
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0019316
        artikel: '4'
        paragraaf: '2'
  - number: 10.d
    text: |-
      indien burgemeester en wethouders niet binnen de in onderdeel c genoemde termijn hebben medegedeeld dat geen
      sloopvergunning is vereist, de mededeling van rechtswege is gedaan;
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel10
  - number: 10.e
    text: |-
      burgemeester en wethouders aan een mededeling als bedoeld onder c voorschriften kunnen verbinden met betrekking tot
      de verwijdering, opslag en afvoer van asbest of asbesthoudende producten;
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel10
  - number: 10.f
    text: de houder van een mededeling als bedoeld onder c verplicht is de voorschriften, bedoeld onder e, in acht te nemen;
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel10
  - number: 10.g
    text: |-
      de houder van een mededeling als bedoeld onder c verplicht is de voorschriften, bij of krachtens de
      [artikelen 7][ref1] en [8][ref2], in acht te nemen;


      [ref1]: https://wetten.overheid.nl/BWBR0019316#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0019316#Artikel8
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0019316
        artikel: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0019316
        artikel: '8'
        paragraaf: '3'
  - number: 10.h
    text: een aanvraag om een sloopvergunning tevens geldt als een melding als bedoeld onder c;
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel10
  - number: 10.i
    text: |-
      indien het slopen uitsluitend is bedoeld om asbest of asbesthoudende producten uit een bouwwerk te verwijderen,
      burgemeester en wethouders binnen vier weken na de dag waarop de aanvraag om een sloopvergunning is ingediend,
      beslissen op die aanvraag;
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel10
  - number: 10.j
    text: |-
      bij een aanvraag om een sloopvergunning een afschrift van het asbestinventarisatierapport wordt overgelegd dat
      betrekking heeft op het af te breken of uit elkaar te nemen bouwwerk of gedeelte daarvan, dan wel onder opgave
      van redenen schriftelijk wordt aangegeven dat op het afbreken of uit elkaar nemen van het betrokken bouwwerk of
      gedeelte daarvan [artikel 3][ref1] niet van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0019316#Artikel3
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0019316
        artikel: '3'
        paragraaf: '2'
  - number: 10.k
    text: |-
      de houder van een sloopvergunning het slopen, voorzover dat betrekking heeft op asbest of asbesthoudende producten
      niet zijnde beglazingskit dat is verwerkt in de constructie van kassen, opdraagt aan een bedrijf dat in het bezit
      is van een certificaat als bedoeld in [artikel 4.54d, eerste lid, van het Arbeidsomstandighedenbesluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 10.l
    text: |-
      de houder van een sloopvergunning een afschrift van de sloopvergunning ter hand stelt aan het bedrijf, bedoeld
      onder k, dat het slopen zal uitvoeren;
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel10
  - number: 10.m
    text: |-
      de houder van de sloopvergunning, ten minste één week voorafgaand aan de aanvang van het slopen, burgemeester en
      wethouders schriftelijk op de hoogte stelt van de data en tijdstippen waarop het slopen, voorzover dat betrekking
      heeft op asbest of asbesthoudende producten, zal plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel10
  - number: 10.n
    text: |-
      de houder van een sloopvergunning binnen twee weken na de uitvoering van de werkzaamheden burgemeester en
      wethouders een afschrift stuurt van de resultaten van de eindbeoordeling, bedoeld in [artikel 9, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019316#Artikel9
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0019316
        artikel: '9'
        paragraaf: '3'
  - number: '11.1'
    text: |-
      In de bouwverordening wordt bepaald dat overtreding van het krachtens
      [artikel 10, onder a, b, c, f, g, j, k, l, m en n][ref1], in die verordening bepaalde, een strafbaar feit is als
      bedoeld in [artikel 110, tweede lid, van de Woningwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019316#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel110
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0019316
        artikel: '10'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '110'
  - number: '11.2'
    text: |-
      Zolang de bouwverordening niet met [artikel 10][ref1] in overeenstemming is gebracht, is overtreding
      van [artikel 10, onder a, b, c, f, g, j, k, l, m en n][ref2], een strafbaar feit als bedoeld in
      [artikel 110, tweede lid, van de Woningwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019316#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0019316#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel110
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0019316
        artikel: '10'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0019316
        artikel: '10'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '110'
  - number: 14a
    text: |-
      Voor zover dit besluit berust op de [Wet milieubeheer][ref1], berust dit op de [artikelen 9.2.2.1][ref2],
      [9.2.3.2][ref3] en [9.2.3.3, vierde lid, van die wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel14a
