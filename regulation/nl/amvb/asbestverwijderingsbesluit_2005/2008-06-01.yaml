        artikel: '9'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '15'
    text: |-
      Het [Asbest-verwijderingsbesluit][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006006
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006006
  - number: '16'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel16
  - number: '17'
    text: 'Dit besluit wordt aangehaald als: Asbestverwijderingsbesluit 2005.'
    url: https://wetten.overheid.nl/BWBR0019316/2008-06-01#Artikel17
