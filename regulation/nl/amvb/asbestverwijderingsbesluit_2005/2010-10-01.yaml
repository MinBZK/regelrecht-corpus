  - number: '10'
    text: |-
      In de bouwverordening worden regels gesteld inhoudende dat:

      a. onverminderd het ter zake bepaalde in de bouwverordening het verboden is te slopen zonder of in afwijking van
      een vergunning van het bevoegd gezag (sloopvergunning), voorzover in het bouwwerk dat geheel of gedeeltelijk wordt
      gesloopt asbest of een asbesthoudend product aanwezig is;

      b. het onder a bepaalde niet van toepassing is op een handeling als bedoeld in
      [artikel 4, eerste en tweede lid][ref1], indien die wordt verricht in het kader van de uitoefening van een beroep
      of bedrijf;

      c. het onder a bepaalde niet van toepassing is op een handeling als bedoeld in
      [artikel 4, eerste en derde lid][ref2], indien die niet wordt verricht in het kader van de uitoefening van een
      beroep of bedrijf en het voornemen tot slopen bij burgemeester en wethouders is gemeld en zij overeenkomstig bij
      de bouwverordening gegeven voorschriften binnen acht dagen na de dag waarop het voornemen tot slopen is gemeld,
      schriftelijk aan degene die heeft gemeld hebben medegedeeld dat geen sloopvergunning is vereist;

      d. indien burgemeester en wethouders niet binnen de in onderdeel c genoemde termijn hebben medegedeeld dat geen
      sloopvergunning is vereist, de mededeling van rechtswege is gedaan;

      e. burgemeester en wethouders aan een mededeling als bedoeld onder c voorschriften kunnen verbinden met betrekking
      tot de verwijdering, opslag en afvoer van asbest of asbesthoudende producten;

      f. de houder van een mededeling als bedoeld onder c verplicht is de voorschriften, bedoeld onder e, in acht te
      nemen;

      g. de houder van een mededeling als bedoeld onder c verplicht is de voorschriften, bij of krachtens de
      [artikelen 7][ref3] en [8][ref4], in acht te nemen;

      h. een aanvraag om een sloopvergunning tevens geldt als een melding als bedoeld onder c;

      i. de houder van een sloopvergunning het slopen, voorzover dat betrekking heeft op asbest of asbesthoudende
      producten niet zijnde beglazingskit dat is verwerkt in de constructie van kassen en voorzover verplicht op grond
      van [artikel 6, eerste lid][ref5], opdraagt aan een bedrijf dat in het bezit is van een certificaat als bedoeld in
      [artikel 4.54d, eerste lid, van het Arbeidsomstandighedenbesluit][ref6];

      j. de houder van een sloopvergunning een afschrift van de sloopvergunning ter hand stelt aan het bedrijf, bedoeld
      onder i, dat het slopen zal uitvoeren;

      k. de houder van de sloopvergunning, ten minste één week voorafgaand aan de aanvang van het slopen, het bevoegd
      gezag schriftelijk op de hoogte stelt van de data en tijdstippen waarop het slopen, voorzover dat betrekking heeft
      op asbest of asbesthoudende producten, zal plaatsvinden;

      l. de houder van een sloopvergunning binnen twee weken na de uitvoering van de werkzaamheden het bevoegd gezag een
      afschrift stuurt van de resultaten van de eindbeoordeling, bedoeld in [artikel 9, eerste lid][ref7].


