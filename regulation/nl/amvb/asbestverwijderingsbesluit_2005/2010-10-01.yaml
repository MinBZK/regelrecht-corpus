  - number: '9'
    text: |-
      1 Degene die in een binnenruimte een handeling doet verrichten waarop [artikel 6, eerste lid][ref1],
      van toepassing is, draagt er zorg voor dat direct na het verrichten van die handeling
      een eindbeoordeling wordt uitgevoerd overeenkomstig het bepaalde bij of krachtens
      [artikel 4.51a, eerste, tweede en vijfde lid, van het Arbeidsomstandighedenbesluit][ref2].

      2 Degene die in de buitenlucht een handeling doet verrichten waarop [artikel 6, eerste lid][ref3],
      van toepassing is, draagt er zorg voor dat direct na het verrichten van die handeling
      een visuele inspectie wordt uitgevoerd overeenkomstig het bepaalde bij of krachtens
      [4.51a, derde en vijfde lid, van het Arbeidsomstandighedenbesluit][ref4].

      3 Het is verboden andere werkzaamheden in een binnenruimte te verrichten of te doen verrichten met betrekking
      tot een bouwwerk of object ten aanzien waarvan een handeling als bedoeld in [artikel 6, eerste lid][ref5],
      is verricht, zolang niet een eindbeoordeling als bedoeld in het eerste lid is uitgevoerd of indien
      uit de eindbeoordeling, bedoeld in het eerste lid, volgt dat er op de plaats van de handeling
      nog visueel waarneembaar asbest aanwezig is of de concentratie asbeststof in de lucht, bedoeld in
      [artikel 4.51a, tweede lid, van het Arbeidsomstandighedenbesluit][ref6] wordt overschreden.

      4 Het is verboden andere werkzaamheden in de buitenlucht te verrichten of te doen verrichten met betrekking tot een
      bouwwerk of object ten aanzien waarvan een handeling als bedoeld in [artikel 6, eerste lid, onder a of b][ref7],
      is verricht of op de plaats waar een handeling als bedoeld in [artikel 6, eerste lid, onder c][ref8], is verricht,
      zolang niet een visuele inspectie als bedoeld in het tweede lid is uitgevoerd of indien uit de visuele inspectie,
      bedoeld in het tweede lid, volgt dat er op de plaats van de handeling nog visueel waarneembaar asbest aanwezig is.


