  - number: '8'
    text: |-
      1 Degene die anders dan in de uitoefening van een beroep of bedrijf een handeling als bedoeld in [artikel 7][ref1]
      verricht, doet dat op een zodanige wijze dat gevaren voor mens en milieu die door zodanige handelingen kunnen
      ontstaan, worden voorkomen.

      2 Bij regeling van Onze Minister kunnen met het oog op het voorkomen van gevaren voor mens en milieu regels worden
      gegeven die ten minste bij het verrichten van zodanige handelingen in acht worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0019316#Artikel7
