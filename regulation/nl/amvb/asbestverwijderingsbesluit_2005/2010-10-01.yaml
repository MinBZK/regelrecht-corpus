  - number: '5'
    text: |-
      Degene die een handeling doet verrichten waarop [artikel 3][ref1] van toepassing is, verstrekt, voordat de
      handeling wordt verricht, een afschrift van het asbestinventarisatierapport aan degene die de handeling verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0019316#Artikel3
    url: https://wetten.overheid.nl/BWBR0019316/2010-10-01#Artikel5
