preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid en de Staatssecretaris van Sociale Zaken en
    Werkgelegenheid, J. F. Hoogervorst, van 19 oktober 2001, Directie Toezicht, nr. TZ/SUWI/01/71157;

    Gelet op artikel 38, derde lid, en artikel 44 van de Wet structuur uitvoeringsorganisatie werk en inkomen, artikel
    130, tweede lid, van de Algemene bijstandswet, artikel 52, tweede lid, van de Wet inkomensvoorziening oudere
    en gedeeltelijk arbeidsongeschikte werkloze werknemers, artikel 52, tweede lid, van de Wet inkomensvoorziening
    oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen, artikel 13, tweede lid, van de Wet sociale
    werkvoorziening, artikel 20, tweede lid, van de Wet inschakeling werkzoekenden, en artikel 33, tweede lid, van de
    Wet inkomensvoorziening kunstenaars;

    De Raad van State gehoord (advies van 23 november 2001, nr. W12.01.0541/IV);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid en de Staatssecretaris van Sociale
    Zaken en Werkgelegenheid, J. F. Hoogervorst, van 11 december 2001, Directie Toezicht nr. TZ/SUWI/01/81960;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0013179/2003-08-29#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. secretaris-generaal: de secretaris-generaal van het Ministerie van Sociale Zaken en Werkgelegenheid;

      b. Inspectie: de Inspectie Werk en Inkomen, genoemd in
      [artikel 36, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];

      c. inspecteur-generaal: het hoofd van de Inspectie Werk en Inkomen;

      d. Ministerie: het Ministerie van Sociale Zaken en Werkgelegenheid;

      e. wet: de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref2];

      f. apparaatszorg: het geheel van activiteiten, noodzakelijk voor en in samenhang met:

        - het functioneren van de organisatie;
        - de personeelsvoorziening;
        - de toepassing van rechtspositionele regelingen;
        - het treffen van beschikkingen jegens personeelsleden;
        - het welbevinden van individuele personeelsleden;
        - de ontwikkeling van de kwaliteit van het personeelsbestand;
        - de lokatiekeuze en huisvesting van het personeel;
        - de opslag en distributie van goederen;
        - de beveiliging van mensen en goederen;
        - de dagelijkse huishoudelijke gang van zaken;
        - de informatievoorziening, inclusief automatisering, en
        - het beheer van de voor deze activiteiten beschikbaar gestelde middelen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0013060
    url: https://wetten.overheid.nl/BWBR0013179/2003-08-29#Artikel1
    references:
      - id: ref1
