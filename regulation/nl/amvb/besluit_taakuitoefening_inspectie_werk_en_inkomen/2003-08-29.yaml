        artikel: '36'
      - id: ref2
        bwb_id: BWBR0013060
  - number: '2'
    text: |-
      Op de Inspectie is het Organisatie-, mandaat- en volmachtbesluit SZW van toepassing voor zover daarvan in dit
      besluit niet wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0013179/2003-08-29#Artikel2
  - number: '3'
    text: |-
      De Inspectie oefent haar in [artikel 37 van de wet][ref1] bedoelde taken uniform uit, behoudens voor zover de
      bestuurlijke positie van de betrokken bestuursorganen dan wel bijzondere omstandigheden tot afwijking nopen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel37
    url: https://wetten.overheid.nl/BWBR0013179/2003-08-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '37'
  - number: '4'
    text: |-
      Het jaarverslag van de Inspectie bevat een integrale rapportage van de bevindingen van de Inspectie over de
      rechtmatigheid en doelmatigheid, waaronder begrepen de doeltreffendheid, van de uitvoering van wettelijke taken
      door de in [artikel 37 van de wet][ref1] genoemde bestuursorganen, alsmede van de wijze waarop deze daarbij
      samenwerken. Het verslag bevat verder de daaraan door de Inspectie verbonden conclusies ten aanzien van de werking
      van het stelsel voor zover dat samenhangt met het functioneren van en de onderlinge betrekkingen tussen de bedoelde
      bestuursorganen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel37
    url: https://wetten.overheid.nl/BWBR0013179/2003-08-29#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '37'
  - number: '5'
    text: |-
      Het in [artikel 38, derde lid, van de wet][ref1] bedoelde verslag wordt voor de eerste maal vóór 1 mei 2003 en
      vervolgens eens per twee jaar vóór 1 mei door de Inspectie Werk en Inkomen opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel38
    url: https://wetten.overheid.nl/BWBR0013179/2003-08-29#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '38'
  - number: '6'
    text: |-
      1 De secretaris-generaal draagt, in overeenstemming met het koninklijk
      __REF000___________________________________________________________________________________________________________
      _______________, zorg voor een zodanige bewerktuiging van de Inspectie dat deze haar wettelijke taken naar behoren
      en onafhankelijk kan uitvoeren.

      2 De departementale voorschriften met betrekking tot de apparaatszorg zijn van toepassing op de werkwijze van de
      Inspectie voor zover daarvan bij dit besluit of op grond van het eerste lid niet wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0004419
    url: https://wetten.overheid.nl/BWBR0013179/2003-08-29#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004419
  - number: '7'
    text: |-
      1 De inspecteur-generaal fungeert rechtstreeks onder de secretaris-generaal.

      2 De inspecteur-generaal neemt deel aan periodiek ambtelijk overleg van de secretaris-generaal en directeuren-
      generaal van het Ministerie als bedoeld in het Organisatie-, mandaat- en volmachtbesluit SZW.
    url: https://wetten.overheid.nl/BWBR0013179/2003-08-29#Artikel7
  - number: '8'
    text: |-
      1 De inspecteur-generaal regelt, met inachtneming van [artikel 6][ref1], de inrichting en de organisatie van de
      Inspectie.

      2 De inspecteur-generaal oefent, met inachtneming van [artikel 6][ref2], de bevoegdheden ter zake van de
      apparaatszorg uit en draagt daarbij zorg voor afstemming met de overige departementsonderdelen.

      3 De inspecteur-generaal is bestuurder in de zin van de [Wet op de ondernemingsraden][ref3] en voert het overleg
      met de op grond van die wet ingestelde medezeggenschapsorganen.


      [ref1]: https://wetten.overheid.nl/BWBR0013179#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013179#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0002747
    url: https://wetten.overheid.nl/BWBR0013179/2003-08-29#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0013179
        artikel: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013179
        artikel: '6'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0002747
  - number: '9'
    text: |-
      1 De inspecteur-generaal maakt afspraken met andere departementsonderdelen over de informatie-uitwisseling
      met betrekking tot de taakverdeling, rapportage, informatievoorziening, voorlichting, informatie- en
      communicatietechnologie en afstemming van onderzoek en legt deze vast in een protocol.

      2 De secretaris-generaal stelt het protocol, bedoeld in het eerste lid, vast.
    url: https://wetten.overheid.nl/BWBR0013179/2003-08-29#Artikel9
  - number: '10'
    text: |-
      1 De inspecteur-generaal verstrekt na iedere periode van vier kalendermaanden informatie aan de secretaris-generaal
      over de voortgang van de werkzaamheden van de Inspectie in de verstreken periode.

      2 De secretaris-generaal en de inspecteur-generaal maken afspraken over de inrichting van de informatie, bedoeld in
      het eerste lid, en over de tijdstippen waarop deze informatie wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0013179/2003-08-29#Artikel10
  - number: '11'
    text: |-
      De inspecteur-generaal informeert Onze Minister en de secretaris-generaal onverwijld over bevindingen,
      ontwikkelingen en gebeurtenissen waarvan de Inspectie bij de uitoefening van haar taken kennis heeft gekregen en
      die van zodanig maatschappelijk of politiek belang zijn of die anderszins zodanig de aandacht kunnen trekken, dat
      tijdige kennisneming door hen gewenst is.
    url: https://wetten.overheid.nl/BWBR0013179/2003-08-29#Artikel11
  - number: '12'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1]
      in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0013060
    url: https://wetten.overheid.nl/BWBR0013179/2003-08-29#Artikel12
