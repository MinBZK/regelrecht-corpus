preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Economische Zaken, K. H. Beyen, van Onze Minister van Landbouw
    en Visserij en van de Staatssecretaris van Financiën, van 23 september 1980, no. 680/772 W. J. A., gehoord de
    Commissie Regelingen In- en uitvoerwet, door de Sociaal-Economische Raad ingesteld op grond van artikel 43 van de
    Wet op de Bedrijfsorganisatie (Stb. 1950, K 22);

    Overwegende, dat naar Ons oordeel het belang van de volkshuishouding vereist nieuwe regelen te stellen ten aanzien
    van de in- en uitvoer van bepaalde landbouwgoederen, ten einde in Nederland uitvoering te kunnen geven aan in het
    kader van het communautair landbouwbeleid daaromtrent door de Raad of de Commissie van de Europese Gemeenschappen
    gestelde regelen;

    Gelet op de artikelen 2, 2a, 4 en 17 van de In- en uitvoerwet (Stb. 1962, 295);

    De Raad van State gehoord (advies van 28 oktober 1980, no. 801022/21);

    Gezien het nader rapport van de voornoemde Staatssecretarissen en van Onze voornoemde Minister van 2 december 1980,
    no. 680/1014 W.J.A.;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003360/1998-03-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      Gemeenschap: de Europese Economische Gemeenschap;

      Verdrag: het Verdrag tot oprichting van de Europese Economische Gemeenschap (*Trb.* 1957, 91);

      Raad: de Raad van Ministers van de Europese Gemeenschappen;

      Commissie: de Commissie van de Europese Gemeenschappen;

      derde land: een land, dat geen lid is van de Europese Economische Gemeenschap;

      communautaire regeling: een door de Raad of de Commissie vastgestelde verordening of beschikking, houdende
      maatregelen voor het handelsverkeer tussen de Gemeenschap en derde landen of tussen de Lid-Staten der Gemeenschap
      onderling van een of meer goederen;

      invoercertificaat: een document, dat ingevolge een communautaire regeling bij de invoer van een in die regeling
      omschreven of aangeduid goed moet worden overgelegd en dat het recht en de plicht meebrengt tot het invoeren van
      het in het document omschreven of aangeduide goed tijdens de geldigheidsduur van dat document;

      uitvoercertificaat: een document, dat ingevolge een communautaire regeling bij de uitvoer van een in die regeling
      omschreven of aangeduid goed moet worden overgelegd en dat het recht en de plicht meebrengt tot het uitvoeren van
      het in het document omschreven of aangeduide goed tijdens de geldigheidsduur van dat document;

      Onze Minister: Onze Minister van Landbouw en Visserij.
    url: https://wetten.overheid.nl/BWBR0003360/1998-03-01#Artikel1
  - number: '2'
    text: |-
      1 De invoer van goederen, aangewezen in deel I van de bij dit besluit behorende bijlage, zonder vergunning van Onze
      Minister, is verboden.

      2 Het eerste lid geldt niet in de gevallen, waarin [artikel 2 van het Invoerbesluit landen 1981][ref1] (*Stb.* 576)
      van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003448#Artikel2
    url: https://wetten.overheid.nl/BWBR0003360/1998-03-01#Artikel2
    references:
