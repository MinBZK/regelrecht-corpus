        bwb_id: BWBR0003448
        artikel: '2'
  - number: '3'
    text: |-
      1 De uitvoer van goederen, aangewezen in de bij dit besluit behorende bijlage, zonder vergunning van Onze Minister,
      is verboden.
    url: https://wetten.overheid.nl/BWBR0003360/1998-03-01#Artikel3
  - number: '4'
    text: |-
      1 Ingeval bij de invoer van een goed ter voldoening aan een communautaire regeling een binnen de Gemeenschap
      bevoegdelijk afgegeven geldig invoercertificaat wordt overgelegd, geldt dit certificaat voor die invoer als een
      vergunning als bedoeld in [artikel 2][ref1].

      2 Ingeval bij de uitvoer van een goed ter voldoening aan een communautaire regeling een binnen de Gemeenschap
      bevoegdelijk afgegeven geldig uitvoercertificaat wordt overgelegd, geldt dit certificaat voor die uitvoer als een
      vergunning als bedoeld in [artikel 3][ref2].

      3 Onze Minister wijst het orgaan aan, dat bevoegd is tot het afgeven van invoer- en uitvoercertificaten in
      Nederland, en kan, voor zover zulks voor een goede uitvoering van een communautaire regeling nodig is, regelen
      stellen met betrekking tot het afgeven van deze certificaten. Daarbij kan hij onder meer bepalen, dat een
      waarborgsom moet worden gestort.


      [ref1]: https://wetten.overheid.nl/BWBR0003360#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003360#Artikel3
    url: https://wetten.overheid.nl/BWBR0003360/1998-03-01#Artikel4
