        artikel: '1'
  - number: '8'
    text: |-
      1 Onze Minister kan:

      a. op aanvrage een restitutie verstrekken ter zake van de uitvoer van in de bij dit besluit behorende bijlage
      aangewezen goederen, dan wel ter zake van de uitvoer van daaruit of met behulp daarvan verkregen goederen;

      b. regelen stellen met betrekking tot de aanspraak op restitutie, de bij het aanvragen daarvan te verstrekken
      gegevens of over te leggen bewijsstukken, de vaststelling van de grondslagen waarnaar de berekening van de uit te
      keren bedragen plaatsvindt en de wijze van verstrekking van de restituties;

      c. sancties opleggen als bedoeld in artikel 11 van [verordening (EEG) nr. 3665/87](31987R3665) van de Commissie van
      de Europese Gemeenschappen van 27 november 1987 houdende gemeenschappelijke uitvoeringsbepalingen van het stelsel
      van restituties bij uitvoer voor landbouwprodukten (*PbEG* L 351).

      2 Het bedrag ener krachtens het eerste lid te verstrekken restitutie kan onder meer verschillen naar gelang van
      het land van bestemming van het uit te voeren goed, het tijdstip waarop de exporteur van zijn voornemen tot uitvoer
      heeft doen blijken, het tijdstip waarop aan de exporteur een uitvoervergunning is verstrekt en het tijdstip van
      de uitvoer.

      3 Voor zover voor de toepassing van het ingevolge het eerste lid bepaalde de medewerking van de
      rijksbelastingdienst wordt ingeroepen, geschiedt zulks in dier voege, dat Onze Minister in de aldaar onder
      *b* bedoelde regelen tevens, in overeenstemming met Onze Minister van Financiën, de constatering van feiten of
      omstandigheden, op grondslag waarvan de restituties worden berekend, opdraagt aan de genoemde dienst.
    url: https://wetten.overheid.nl/BWBR0003360/1998-03-01#Artikel8
  - number: '9'
    text: |-
      1 Restituties ter zake van de uitvoer van in de bij dit besluit behorende bijlage aangewezen goederen of van
      daaruit of met behulp daarvan verkregen goederen, die Nederland ingevolge een communautaire regeling gehouden
      of gerechtigd is te verstrekken, worden als restituties in de [zin van artikel 8][ref1] verstrekt. Op zodanige
      restituties zijn alle andere ten aanzien van krachtens dit besluit te verstrekken restituties geldende wettelijke
      regelingen eveneens van toepassing.

      2 Onder restitutie als bedoeld in de aanhef van het eerste lid is te verstaan elk bedrag, dat ingevolge een
      communautaire regeling als restitutie, als subsidie, als compenserend bedrag of onder welke andere benaming ook bij
      de uitvoer van een goed als in het eerste lid bedoeld moet of mag worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003360#Artikel8
    url: https://wetten.overheid.nl/BWBR0003360/1998-03-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003360
        artikel: '8'
  - number: '10'
    text: |-
      1 In de gevallen, waarin ingevolge een communautaire regeling bij de invoer van een in de bij dit besluit behorende
      bijlage aangewezen goed of een daaruit of met behulp daarvan verkregen goed in een Lid-Staat van de Gemeenschap,
      die Lid-Staat gehouden of gerechtigd is een subsidie te verstrekken, kan Onze Minister:

      a. op aanvrage ter zake van de invoer van het in de aanhef bedoelde goed een subsidie verstrekken;

      b. regelen stellen met betrekking tot de aanspraak op subsidie, de bij het aanvragen daarvan te verstrekken
      gegevens of over te leggen bewijsstukken, de vaststelling van de grondslagen waarnaar de berekening van de uit
      te keren bedragen plaatsvindt, de wijze van verstrekking van de subsidie en al hetgeen voorts nodig is voor de
      uitvoering van de communautaire regeling in Nederland.

      2 Onder subsidie als bedoeld in de aanhef van het eerste lid is te verstaan elk bedrag, dat ingevolge een
      communautaire regeling als subsidie, als restitutie, als compenserend bedrag of onder welke andere benaming ook bij
      de invoer van een goed als in het eerste lid bedoeld moet of mag worden verstrekt.

      3 Voor zover voor de toepassing van het ingevolge het eerste lid bepaalde de medewerking van de
      rijksbelastingdienst wordt ingeroepen, geschiedt zulks in dier voege, dat Onze Minister in de aldaar onder
      *b* bedoelde regelen tevens, in overeenstemming met Onze Minister van Financiën, de constatering van feiten of
      omstandigheden, op grondslag waarvan de subsidies worden berekend, opdraagt aan de genoemde dienst.
    url: https://wetten.overheid.nl/BWBR0003360/1998-03-01#Artikel10
  - number: '11'
    text: |-
      1 Bij de uitvoer van een goed, waarvoor [artikel 8][ref1] of 10 is toegepast, moeten de regelen in acht worden
      genomen die Onze Minister, voor zover hij dat voor een goede toepassing van dit besluit noodzakelijk acht, stelt
      met betrekking tot:

      a. het kennis geven van een voorgenomen uitvoer van de in aanhef bedoelde goederen;

      b. het aangeven van zodanige goederen ten uitvoer;

      c. het aanbieden van die ten uitvoer aangegeven goederen voor onderzoek en monsterneming;

      d. het onder toezicht stellen van in de aanhef bedoelde goederen met het oog op hun opslag, uitslag, be- of
      verwerking, voorafgaand aan de uitvoer van - al naar het geval - de desbetreffende of de daaruit of met behulp
      daarvan verkregen goederen;

      e. de verantwoording van de rendementen die zijn behaald bij de onder *d* bedoelde be- of verwerking;

      f. het kennis geven van de na uitvoer bereikte bestemming van in de aanhef bedoelde goederen.

      2 Voor zover voor de toepassing van het ingevolge het eerste lid bepaalde de medewerking van de
      rijksbelastingdienst wordt ingeroepen, stelt Onze Minister de aldaar bedoelde regelen vast in overeenstemming met
      Onze Minister van Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0003360#Artikel8
    url: https://wetten.overheid.nl/BWBR0003360/1998-03-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003360
        artikel: '8'
  - number: '12'
    text: |-
      1 Onverminderd enig ander wettelijk voorschrift is hij, die een goed ten aanzien waarvan krachtens
      [artikel 8][ref1] of 10 regelen zijn gesteld, in de uitoefening van zijn beroep of bedrijf invoert, doet invoeren,
      uitvoert of doet uitvoeren, verplicht:

      a. de door hem met betrekking tot die invoer of uitvoer en met betrekking tot het ingevoerde of uitgevoerde goed
      verrichte handelingen, de vervaardiging van het goed daaronder begrepen, op de in zijn beroep of bedrijfstak
      gebruikelijke wijze in zijn administratie te verantwoorden;

      b. alle desbetreffende aantekeningen en bescheiden, zoals nota's, brieven, analyserapporten en andere
      bewijsstukken, boeken, registers of andere hulpmiddelen, waarin de gegevens inzake die handelingen zijn vastgelegd,
      vanaf het tijdstip van hun opstelling of verkrijging tot het tijdstip, waarop drie kalenderjaren zijn verlopen te
      rekenen van het einde van het jaar, waarin de invoer of de uitvoer heeft plaatsgevonden, te bewaren.

      2 Overtreding van het gestelde in het eerste lid is een strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0003360#Artikel8
    url: https://wetten.overheid.nl/BWBR0003360/1998-03-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003360
        artikel: '8'
  - number: '13'
    text: |-
      1 Onze Minister kan van het bij [artikel 2, eerste lid][ref1], 3, eerste lid, 11, eerste lid, 12, eerste lid, dan
      wel van het krachtens [artikel 2, derde lid][ref2], 3, tweede lid, 4, derde lid, 8, eerste lid, onder *b*, of 10,
      eerste lid, onder *b*, bepaalde vrijstelling en op aanvrage ontheffing verlenen.

      2 Voor zover voor de toepassing van het ingevolge het eerste lid bepaalde de medewerking van de
      rijksbelastingdienst wordt ingeroepen, geschiedt zulks in dier voege, dat Onze Minister, in overeenstemming
      met Onze Minister van Financiën, aan de genoemde dienst opdraagt op aanvragen om ontheffing te beslissen of
      vrijstellingsregelen uit te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0003360#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003360#Artikel2
    url: https://wetten.overheid.nl/BWBR0003360/1998-03-01#Artikel13
