  - number: '21'
    text: |-
      1 Het In- en uitvoerbesluit landbouwgoederen 1963 (*Stb.* 125) wordt ingetrokken.

      2 Vergunningen, invoer- en uitvoercertificaten en ontheffingen, die zijn verleend ingevolge het In- en
      uitvoerbesluit landbouwgoederen 1963 worden, voor zover zij hun gelding nog niet hebben verloren, geacht te zijn
      verleend op grond van dit besluit.
    url: https://wetten.overheid.nl/BWBR0003360/1998-03-01#Artikel21
  - number: '22'
    text: |-
      1 Dit besluit kan worden aangehaald als: In- en uitvoerbesluit landbouwgoederen 1980.

      2 Het treedt in werking met ingang van de dag liggende twee maanden en één dag na de datum van uitgifte van het
      *Staatsblad*, waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0003360/1998-03-01#Artikel22
