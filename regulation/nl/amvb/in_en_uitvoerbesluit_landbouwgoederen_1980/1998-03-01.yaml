  - number: '5'
    text: |-
      1 Onze Minister is bevoegd tot de vaststelling van rechten bij invoer, andere dan douanerechten als bedoeld in
      [artikel 1, tweede lid, van de Douanewet][ref1].

      2 Het bedrag van een krachtens het eerste lid vastgesteld recht kan onder meer verschillen naar gelang van het land
      van herkomst of oorsprong van het in te voeren goed, het tijdstip waarop de importeur van zijn voornemen tot invoer
      heeft doen blijken, het tijdstip waarop aan de importeur een invoervergunning is verstrekt en het tijdstip van
      de invoer.

      3 Bij het vaststellen van een recht kan voorts worden bepaald dat een recht verschuldigd is vóór het tijdstip van
      invoer van het betrokken goed.


      [ref1]: https://wetten.overheid.nl/BWBR0007632#Artikel1
    url: https://wetten.overheid.nl/BWBR0003360/1998-03-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007632
        artikel: '1'
  - number: '6'
    text: |-
      1 Onze Minister is bevoegd tot de vaststelling van rechten bij uitvoer als bedoeld in
      [artikel 1, derde lid, van de Douanewet][ref1].

      2 Het bedrag van een krachtens het eerste lid vastgesteld recht kan onder meer verschillen naar gelang van het
      land van bestemming van het uit te voeren goed, het tijdstip waarop de exporteur van zijn voornemen tot uitvoer
      heeft doen blijken, het tijdstip waarop aan de exporteur een uitvoervergunning is verstrekt en het tijdstip van
      de uitvoer.

      3 Bij het vaststellen van het recht kan voorts worden bepaald, dat een recht verschuldigd is vóór het tijdstip van
      uitvoer van het betrokken goed.


      [ref1]: https://wetten.overheid.nl/BWBR0007632#Artikel1
    url: https://wetten.overheid.nl/BWBR0003360/1998-03-01#Artikel6
    references:
