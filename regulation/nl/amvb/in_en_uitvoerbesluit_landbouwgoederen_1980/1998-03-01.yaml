        artikel: '2'
  - number: '18'
    text: |-
      Waarborgsommen als bedoeld in [artikel 4, derde lid][ref1], die ingevolge de communautaire regeling op grond
      waarvan zij zijn gestort geheel of ten dele niet kunnen worden vrijgegeven en evenmin ingevolge enig communautair
      voorschrift in mindering dienen te worden gebracht op de ten laste van de Gemeenschap komende uitgaven, vervallen
      aan de Staat en maken deel uit van de ontvangsten van afdeling A van het Landbouw-Egalisatiefonds.


      [ref1]: https://wetten.overheid.nl/BWBR0003360#Artikel4
    url: https://wetten.overheid.nl/BWBR0003360/1998-03-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003360
        artikel: '4'
  - number: '19'
    text: |-
      1 Onze Minister stelt het model vast van de in de [artikelen 2][ref1] en [3][ref2] bedoelde vergunningen.

      2 Bij de verlening van een vergunning als bedoeld in [artikel 2][ref3] of 3 worden daaraan voor de houder de
      volgende voorschriften verbonden:

      a. zodra vaststaat dat daarvan geen gebruik meer kan worden gemaakt, moet de vergunning terstond teruggezonden
      worden aan degene die haar heeft verleend;

      b. aan degene, die de vergunning heeft verleend, moeten binnen de daartoe gestelde termijn alle gewenste
      inlichtingen worden verstrekt omtrent het daarvan gemaakte gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0003360#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003360#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003360#Artikel2
