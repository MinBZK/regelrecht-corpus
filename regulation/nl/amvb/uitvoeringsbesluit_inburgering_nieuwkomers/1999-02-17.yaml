---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: uitvoeringsbesluit_inburgering_nieuwkomers
regulatory_layer: AMVB
publication_date: '2006-12-07'
valid_from: '1999-02-17'
bwb_id: BWBR0009734
url: https://wetten.overheid.nl/BWBR0009734/1999-02-17
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken van 12 februari 1998, nr. CIM98/241; gedaan
    in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschappen en de Staatssecretaris van
    Volksgezondheid, Welzijn en Sport;

    Gelet op de artikelen 4, vijfde lid, 14 en 15, tweede lid van de Wet inburgering nieuwkomers en artikel 6a van de
    Wet persoonsregistraties;

    De Raad van State gehoord (advies van 3 april 1998, nr. W04.98.0054);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken van 19 juni 1998, nr. CIM98/824; uitgebracht
    in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschappen en de Staatssecretaris van
    Volksgezondheid, Welzijn en Sport;

    HEBBEN GOEDGEVONDEN EN VERSTAAN:
  url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#Artikel1
  - number: 1.a
    text: |-
      wet: de [Wet inburgering nieuwkomers][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009544
    url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009544
  - number: 1.b
    text: |-
      sociaal-fiscaal nummer: het nummer, bedoeld in
      [artikel 47b, derde lid, van de Algemene wet inzake rijksbelastingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel47b
    url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 47b
  - number: '2'
    text: |-
      Tijdens het inburgeringsonderzoek wordt de opleiding en de werkervaring vastgesteld die de nieuwkomer reeds in
      Nederland of in een ander land heeft genoten, onderscheidenlijk opgedaan.
    url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#Artikel2
  - number: '3'
    text: |-
      Bij het vaststellen van de opleiding, bedoeld in [artikel 2][ref1], wordt, zonodig, het niveau van buitenlandse
      diploma's vastgesteld door vergelijking van deze diploma's met Nederlandse diploma's.


      [ref1]: https://wetten.overheid.nl/BWBR0009734#Artikel2
    url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009734
        artikel: '2'
        hoofdstuk: '2'
  - number: '4'
    text: |-
      De test, bedoeld in [artikel 4, derde lid, onderdeel c, van de wet][ref1] bestaat in de toepassing van de door Onze
      Minister van Onderwijs, Cultuur en Wetenschappen toegestane instrumenten waarmee de actieve en passieve kennis van
      de Nederlandse taal, de leerervaring en de studievaardigheden worden gemeten.


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel4
    url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '4'
  - number: '5'
    text: |-
      Indien de nieuwkomer tijdens zijn deelname aan het voor hem vastgestelde inburgeringsprogramma, op grond van
      [artikel 27 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref1] wordt ingeschreven in een andere
      gemeente dan de gemeente waar hij tot dat moment is ingeschreven, doet het college van burgemeester en wethouders
      van de vorige gemeente van inschrijving het college van burgemeester en wethouders van de volgende gemeente van
      inschrijving binnen vier weken na de uitschrijving, bedoeld in [artikel 30 van die wet][ref2], mededeling van het
      feit dat betrokkene aan een inburgeringsprogramma deelneemt.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel30
    url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '30'
  - number: '6.1'
    text: |-
      Binnen twee weken na ontvangst van de in [artikel 5][ref1] bedoelde mededeling sluiten de colleges van burgemeester
      en wethouders van de betrokken gemeenten, na overleg met de nieuwkomer, een overeenkomst waarin wordt vastgesteld
      welk van beide colleges vanaf een in die overeenkomst te bepalen datum jegens de nieuwkomer is belast met de
      uitvoering van de wet en de daarop berustende bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009734#Artikel5
    url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009734
        artikel: '5'
        hoofdstuk: '3'
  - number: '6.2'
    text: |-
      Indien het college van burgemeester en wethouders van de volgende gemeente van inschrijving wordt aangewezen,
      draagt het college van burgemeester en wethouders van de vorige gemeente van inschrijving de bij hem aanwezige
      gegevens over de nieuwkomer aan dat college over.
    url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#Artikel6
  - number: '6.3'
    text: |-
      In een geval als bedoeld in het tweede lid wordt, zo nodig, in de overeenkomst tussen de betrokken gemeenten een te
      betalen vergoeding vastgesteld in verband met reeds gemaakte of nog te maken kosten ten behoeve van de uitvoering
      van het desbetreffende inburgeringsprogramma.
    url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#Artikel6
  - number: '6.4'
    text: |-
      In het inburgeringsprogramma wordt een voorziening opgenomen voor het geval dat, indien een aanwijzing als bedoeld
      in het tweede lid plaatsvindt, voor het volgen van het educatieve programma een overeenkomst als bedoeld in
      [artikel 8.1.3 van de Wet educatie en beroepsonderwijs][ref1] moet worden gesloten met het bevoegd gezag van een
      andere instelling dan de instelling waarbij de nieuwkomer tot dat moment is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
  - number: '7.1'
    text: |-
      Het college van burgemeester en wethouders registreert van de nieuwkomer de voortgang voor elke van de onderdelen
      van het inburgeringsprogramma. De voortgang bij het deelnemen aan het educatieve programma wordt slechts
      vastgesteld in overeenstemming met een instelling.
    url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#Artikel7
  - number: '7.2'
    text: |-
      Het college van burgemeester en wethouders registreert de voortgang van de nieuwkomer in relatie tot
      het eveneens door dat college te registreren doel en de inhoud van het inburgeringsprogramma, bedoeld in
      [artikel 4, derde lid, onderdelen b en c, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel4
    url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '4'
  - number: '7.3'
    text: 'De registratie omvat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#Artikel7
  - number: 7.3.a
    text: |-
      het individueel trajectplan, bedoeld in [artikel 15, tweede lid, van de wet][ref1] waarin wordt vastgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel15
    url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '15'
  - number: 7.3.a.1°
    text: het tijdens het inburgeringsonderzoek vastgestelde niveau van kennis, inzicht en vaardigheden van de nieuwkomer,
    url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#Artikel7
  - number: 7.3.a.2°
    text: het met het inburgeringsprogramma te bereiken einddoel, en,
    url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#Artikel7
  - number: 7.3.a.3°
    text: een regeling van tussentijdse evaluatiegesprekken met de nieuwkomer;
    url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#Artikel7
  - number: 7.3.b
    text: |-
      het resultaat, de intensiteit en de duur van het educatieve programma, vastgesteld ingevolge
      [artikel 6, tweede lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel6
    url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '6'
  - number: 7.3.c
    text: |-
      de wijze waarop en de frequentie waarmee de maatschappelijke begeleiding, bedoeld in
      [artikel 6, eerste lid, onderdeel b, van de wet][ref1] plaatsvindt;


      [ref1]: https://wetten.overheid.nl/BWBR0009544
    url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009544
  - number: 7.3.d
    text: |-
      voor zover de nieuwkomer daarvoor in aanmerking komt, het doel van de doorgeleiding, bedoeld in
      [artikel 6, eerste lid, onderdeel c, van de wet][ref1] en het resultaat hiervan, in relatie tot het doel;


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel6
    url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '6'
  - number: 7.3.e
    text: |-
      de uitkomsten van de evaluatiegesprekken, bedoeld in [artikel 15, tweede lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel15
    url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '15'
  - number: 7.3.f
    text: |-
      het advies, bedoeld in [artikel 12, tweede lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel12
    url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '12'
  - number: 7.3.g
    text: |-
      de datum van ontvangst door het college van burgemeester en wethouders van het afschrift van
      de verklaring alsmede de datum van afgifte aan de nieuwkomer van de verklaring, bedoeld in
      [artikel 7.4.15 van de Wet educatie en beroepsonderwijs][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 7.3.h
    text: |-
      de datum waarop het certificaat, bedoeld in [artikel 13, tweede lid, van de wet][ref1], is uitgereikt aan de
      nieuwkomer.


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel13
    url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '13'
  - number: '7.4'
    text: |-
      Voorzover de nieuwkomer als werkzoekende is geregistreerd en de in die registratie opgenomen gegevens de kennis
      van, de toegang tot en de doorstroming naar de arbeidsmarkt betreffen, verstrekt de Arbeidsvoorzieningsorganisatie
      aan het college van burgemeester en wethouders die gegevens met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#Artikel7
  - number: 7.4.a
    text: het doel van het inburgeringsprogramma, bedoeld in het tweede lid;
    url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#Artikel7
  - number: 7.4.b
    text: de doorgeleiding, bedoeld in het derde lid, onderdeel d;
    url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#Artikel7
  - number: 7.4.c
    text: het advies, bedoeld in het derde lid, onderdeel f; en
    url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#Artikel7
  - number: 7.4.d
    text: de uitkomsten van de evaluatiegesprekken, bedoeld in het derde lid, onderdeel e.
    url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#Artikel7
  - number: '7.5'
    text: |-
      Bij ministeriële regeling kunnen ten behoeve van de registratie nog andere gegevens worden genoemd, dan de gegevens
      bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#Artikel7
  - number: '8'
    text: |-
      Het sociaal-fiscaal nummer wordt door het college van burgemeester en wethouders in de persoonsregistratie
      die aangelegd wordt voor de uitvoering van de wet, gebruikt met het oog op de registratie van de gegevens,
      bedoeld in [artikel 7, vierde lid][ref1], en gebruikt bij het verstrekken van gegevens daaruit aan de
      Arbeidsvoorzieningsorganisatie ten behoeve van de uitvoering van [artikel 4, eerste en tweede lid][ref2],
      [artikel 6, eerste lid, onderdeel c][ref3], [artikel 12, tweede lid][ref4], en [artikel 15 van de wet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0009734#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009544#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0009544#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0009544#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0009544#Artikel15
    url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009734
        artikel: '7'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0009544
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0009544
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0009544
        artikel: '12'
      - id: ref5
        bwb_id: BWBR0009544
        artikel: '15'
  - number: '9'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gegeven met betrekking tot de toepassing van de
      [artikelen 7][ref1] en [8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009734#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009734#Artikel8
    url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009734
        artikel: '7'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0009734
        artikel: '8'
        hoofdstuk: '4'
  - number: '11'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop de [Wet inburgering nieuwkomers][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0009544
    url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009544
  - number: '12'
    text: 'Dit besluit wordt aangehaald als: Uitvoeringsbesluit inburgering nieuwkomers.'
    url: https://wetten.overheid.nl/BWBR0009734/1999-02-17#Artikel12
