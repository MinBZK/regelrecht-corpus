preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 17 juli 1989,
    nr.MJZ17789031, Centrale Directie Juridische Zaken, afdeling Wetgeving, gedaan na overleg met Onze Minister van
    Verkeer en Waterstaat;

    Gelet op de artikelen 25, tweede lid, en 76, eerste lid, onder a, van de Luchtvaartwet (Stb. 1958, 47) en
    artikel VII, derde lid, van de Wet van 7 juni 1978, houdende wijziging van de Luchtvaartwet met betrekking tot de
    aanwijzing van luchtvaartterreinen (Stb. 354);

    Gezien het advies van de Centrale raad voor de milieuhygiëne van 9 februari 1989;

    De Raad van State gehoord (advies van 29 december 1989, nr. W08. 89. 0391);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 12
    december 1990, nr. MJZ12d90065, Centrale Directie Juridische Zaken, afdeling Wetgeving, uitgebracht na overleg met
    Onze Minister van Verkeer en Waterstaat;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van dit besluit wordt verstaan onder: gebouw: een gebouw als bedoeld
      in [artikel 1, eerste lid, onder ][ref1]; bouwvergunning: een vergunning als bedoeld in
      [artikel 40, eerste lid, van de Woningwet][ref2]; woonwagenstandplaats: een standplaats als bedoeld in
      [artikel 1, eerste lid, onder ][ref3]; bkl: geluidsbelastingseenheden kleine luchtvaart; geluidsbelasting in bkl:
      de geluidsbelasting op een bepaalde plaats veroorzaakt door de gezamenlijke op een luchtvaartterrein landende en
      opstijgende vaste-vleugel luchtvaartuigen met schroefaandrijving en een toegelaten totaal massa die hoger is dan
      390 kg doch niet hoger dan 6000 kg, uitgedrukt in bkl en vastgesteld volgens de formule: geluidsbelasting = 10 log
      (∑n 10LAX/10) - 46: waarin: het teken "∑" staat voor de optelling van de bijdragen van alle luchtvaartuigen die
      ter plaatse voorbijvliegen gedurende een representatieve dag, zijnde het gewogen daggemiddelde van het vliegverkeer
      gedurende een geheel jaar, waarbij de weging hieruit bestaat dat het aantal vliegtuigbewegingen op zater-, zon-
      en feestdagen in de drukste zes maanden van het jaar wordt vermenigvuldigd met een factor 5 waarin: het teken "n"
      staat voor een factor gelijk aan 1 gedurende de periode van 07.00 tot 19.00 uur en voor de verdere tijdsperiode
      volgens onderstaande tabel:







                  n


                  tijdsperiode (lokale tijd)





                  van


                  tot






                  10


                  0


                  7 uur




                  1


                  7


                  19 uur




                  3,16


                  19


                  23 uur




                  10


                  23


                  24 uur




         waarin het teken "LAX" staat voor het tijdgeïntegreerde geluidsniveau ten gevolge van elke vliegtuigpassage,
      berekend volgens de formule: waarin het teken "LA(t)" staat voor het tijdsafhankelijke momentane geluidsniveau
      in dB(A), waarin het teken "T" staat voor de referentietijd van 1 seconde en waarin de tekens "t1" en "t2" staan
      voor het begin respectievelijk het einde van de vliegtuigpassage; geluidszone: een geluidszone als bedoeld in
      [artikel 25][ref4] voor de grenswaarde, bedoeld in artikel 25, eerste lid, aanhef en onder *b*, van die wet;
      circuitvluchten: vliegtuigbewegingen in de onmiddellijke omgeving van het luchtvaartterrein, in het bijzonder
      verband houdend met het starten, het oefenen voor het landen en het landen als onderdeel van het lesvliegen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0002267#Artikel25a
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel1
    references:
      - id: ref1
