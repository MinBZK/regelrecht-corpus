  - number: '2.1'
    text: |-
      In dit besluit wordt verstaan onder geluidsgevoelige objecten: woningen, andere geluidsgevoelige gebouwen en
      woonwagenstandplaatsen.
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel2
  - number: '2.2'
    text: 'In dit besluit wordt verstaan onder ander geluidsgevoelig gebouw:'
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel2
  - number: 2.2.1°
    text: basisscholen;
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel2
  - number: 2.2.2°
    text: |-
      school voor voortgezet onderwijs als bedoeld in [deel I van de Wet op het voortgezet onderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002399
  - number: 2.2.3°
    text: school voor beroepsonderwijs;
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel2
  - number: 2.2.4°
    text: instelling voor hoger onderwijs;
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel2
  - number: 2.2.5°
    text: gezondheidszorggebouw.
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel2
  - number: '2.3'
    text: |-
      Een opvangcentrum als bedoeld in [artikel 1, onderdeel d, van de Wet Centraal Orgaan opvang asielzoekers][ref1] is
      geen woning als bedoeld in dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006685#Artikel1
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006685
        artikel: '1'
  - number: '3.1'
    text: 'Dit besluit is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel3
  - number: 3.1.a
    text: |-
      gebieden binnen een geluidszone waarop het [Besluit geluidsbelasting grote luchtvaart][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0008439
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008439
  - number: 3.1.b
    text: |-
      de geluidsbelasting vanwege de luchtvaartterreinen Rotterdam, Eelde en Maastricht voor zover deze niet wordt
      veroorzaakt door circuitvluchten;
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel3
  - number: 3.1.c
    text: |-
      geluidsgevoelige objecten die op het tijdstip van vaststelling van de geluidszone rond de in het tweede lid
      genoemde luchtvaartterreinen binnen die geluidszone reeds aanwezig zijn of nog niet aanwezig zijn maar waarvoor de
      bouwvergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel3
  - number: '3.2'
    text: |-
      De in het eerste lid, onder *c*, bedoelde luchtvaartterreinen zijn de luchtvaartterreinen Ameland, Budel, Drachten,
      Eelde, Hilversum, Hoogeveen, Lelystad, Maastricht, Midden-Zeeland, Noordoostpolder, Rotterdam, Seppe, Terlet, Teuge
      en Texel.
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel3
  - number: '4'
    text: |-
      Voor de luchtvaartterreinen, genoemd in artikel 3, tweede lid, is de grenswaarde voor de maximaal toelaatbare
      geluidsbelasting, bedoeld in artikel 25, eerste lid, aanhef en onder *b*, van de [Luchtvaartwet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0002267
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002267
  - number: 4.a
    text: 'tot 1 januari 2000: 50 bkl;'
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel4
  - number: 4.b
    text: 'met ingang van 1 januari 2000: 47 bkl.'
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel4
  - number: '5.1'
    text: |-
      Onze Minister stelt in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening
      en Milieubeheer, na overleg met de exploitanten van de luchtvaartterreinen die zijn genoemd in
      [artikel 3, tweede lid][ref1], vóór 1 oktober 1998 beleidsregels vast omtrent de te treffen maatregelen ten aanzien
      van ieder luchtvaartterrein dat is genoemd in [artikel 3, tweede lid][ref2], ter verzekering dat met ingang van 1
      januari 2000 de grenswaarde van 47 bkl niet wordt overschreden. Onze Minister hoort zo nodig de Rijksplanologische
      Commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0004958#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004958#Artikel3
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004958
        artikel: '3'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0004958
        artikel: '3'
        hoofdstuk: I
  - number: '5.2'
    text: Onze Minister doet mededeling van deze voornemens aan de betrokken provincies en gemeenten.
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel5
  - number: '6.1'
    text: |-
      Indien in verband met de te treffen maatregelen vanwege artikel 4, aanhef en onder *b*, de
      aanwijzing van een luchtvaartterrein kan worden gewijzigd zonder toepassing te geven aan
      [artikel 27, tweede lid, van de Luchtvaartwet][ref1], wijzigt Onze Minister in overeenstemming met Onze Minister
      van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer de aanwijzing niet dan nadat hij overleg heeft gepleegd
      met gedeputeerde staten van de betrokken provincies en burgemeester en wethouders van de betrokken gemeenten.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel27
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '27'
  - number: '6.2'
    text: |-
      Op de voorbereiding van het besluit tot wijziging als bedoeld in het eerste lid is de in
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] geregelde procedure van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '6.3'
    text: |-
      De [artikelen 21][ref1], eerste lid, [23][ref2], tweede lid, en [24][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel24b
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '23'
      - id: ref3
        bwb_id: BWBR0002267
        artikel: 24b
  - number: '7.1'
    text: |-
      50 bkl is de maximaal toelaatbare geluidsbelasting van geluidsgevoelige objecten die op het tijdstip van
      vaststelling van de geluidszone daarbinnen nog niet aanwezig zijn en waarvoor nog geen bouwvergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel7
  - number: '7.2'
    text: Met ingang van 1 januari 2000 is 47 bkl de maximaal toelaatbare geluidsbelasting, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel7
  - number: '8.1'
    text: |-
      In afwijking van artikel 7 is 60 bkl de maximaal toelaatbare geluidsbelasting van geluidsgevoelige objecten als
      bedoeld in artikel 7 die:
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel8
  - number: 8.1.a
    text: een open plek in de bestaande, te handhaven bebouwing opvullen;
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel8
  - number: 8.1.b
    text: ter plaatse dringend noodzakelijk zijn om redenen van grond- of bedrijfsgebondenheid, of
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel8
  - number: 8.1.c
    text: |-
      zullen dienen ter vervanging van op die plaats reeds aanwezige bebouwing, niet zijnde woningen, andere
      geluidsgevoelige gebouwen of woonwagenstandplaatsen.
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel8
  - number: '8.2'
    text: Met ingang van 1 januari 2000 is 57 bkl de maximaal toelaatbare geluidsbelasting, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel8
  - number: '9'
    text: |-
      Dit besluit is niet van toepassing op geluidsgevoelige objecten die geluidsgevoelige objecten als bedoeld in
      artikel 3, onder *c*, vervangen, tenzij de vervanging zou leiden tot:
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel9
  - number: 9.a
    text: een ingrijpende wijziging van de bestaande stedebouwkundige functie of structuur;
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel9
  - number: 9.b
    text: een wezenlijke toename van het aantal geluidgehinderden, of
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel9
  - number: 9.c
    text: een wezenlijke toename van de aan de uitwendige scheidingsconstructie optredende geluidsbelasting.
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel9
  - number: '10.1'
    text: |-
      60 bkl is de maximaal toelaatbare geluidsbelasting van geluidsgevoelige objecten die op het tijdstip van
      vaststelling van de geluidszone daarbinnen nog niet aanwezig zijn en waarvoor nog geen bouwvergunning is verleend,
      maar waarvoor het bestemmingsplan dat geldt op het tijdstip van vaststelling van de geluidszone die verlening
      toelaat.
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel10
  - number: '10.2'
    text: Het eerste lid is niet van toepassing indien het bestemmingsplan vóór 1 januari 1988 onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel10
  - number: '12.1'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin het
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel12
  - number: '12.2'
    text: 'Dit besluit kan worden aangehaald als: Besluit geluidsbelasting kleine luchtvaart.'
    url: https://wetten.overheid.nl/BWBR0004958/2003-07-18#Artikel12
