  - number: '28'
    text: |-
      1 Onze Ministers dragen zorg voor opstelling en bekendmaking van een overzicht, alsmede van wijziging van dat
      overzicht, van bouwstoffen waarvoor een door hen erkende kwaliteitsverklaring is afgegeven.

      2 Het in het eerste lid bedoelde overzicht omvat tevens een overzicht van bouwstoffen die overeenkomstig de
      Europese richtlijn bouwprodukten moeten zijn voorzien van de CE-markering en die bovendien, bij een bepaalde
      wijze van gebruik, in overeenstemming zijn met de bij of krachtens dit besluit gestelde eisen met betrekking tot
      samenstelling en immissie.

      3 Bij regeling van Onze Ministers kunnen nadere regels worden gesteld omtrent opstelling en bekendmaking van het in
      het eerste lid bedoelde overzicht en van wijziging van dat overzicht.
