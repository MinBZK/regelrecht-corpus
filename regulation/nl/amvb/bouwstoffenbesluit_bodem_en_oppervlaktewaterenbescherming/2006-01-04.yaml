        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '7'
    text: |-
      1 Het op of in de bodem gebruiken van een bouwstof, is verboden, indien:

      a. die bouwstof één of meer van de samenstellingswaarden voor organische stoffen of, in geval het grond
      betreft, één of meer van de samenstellingswaarden voor organische of anorganische stoffen, zoals aangegeven in
      [bijlage 2][ref1], overschrijdt, of

      b. die bouwstof op zodanige wijze wordt gebruikt dat één of meer van de immissiewaarden voor anorganische stoffen,
      zoals aangegeven in [bijlage 2][ref2], worden overschreden.

      2 Ten aanzien van de vaststelling van een overschrijding als bedoeld in het eerste lid, onder *a*, zijn
      de regels met betrekking tot de bepaling van de samenstelling van de bouwstof, gesteld bij of krachtens
      [artikel 9, tweede, derde, zesde of zevende lid][ref3], van toepassing, voor zover dat bij regeling van Onze
      Ministers is bepaald. Bij die regeling kunnen ten aanzien van de vaststelling, bedoeld in de eerste volzin, nadere
      regels worden gesteld.

      3 Ten aanzien van de vaststelling van een overschrijding als bedoeld in het eerste lid, onder *b*, zijn de regels
      met betrekking tot de bepaling van de immissie in de bodem als gevolg van emissie uit de bouwstof, gesteld bij of
      krachtens [artikel 9, vijfde, zesde of zevende lid][ref4], van toepassing, voor zover dat bij regeling van Onze
      Ministers is bepaald. Bij die regeling kunnen ten aanzien van de vaststelling, bedoeld in de eerste volzin, nadere
      regels worden gesteld.

      4 Voor een bouwstof met teerhoudend asfaltgranulaat kan bij regeling van Onze Minister worden bepaald dat ten
      aanzien van de in die bouwstof aanwezige polycyclische aromatische koolwaterstoffen het in het eerste lid gestelde
      verbod niet van toepassing is gedurende een daarbij aan te geven periode.

      5 Voor avi-bodemas die behoort tot de bijzondere, bij regeling van Onze Minister aan te wijzen categorie, kan bij
      regeling van Onze Minister worden bepaald dat gedurende een daarbij aan te geven periode het eerste, tweede en
      derde lid niet van toepassing zijn.

      6 Voor E-vliegas zijn ten aanzien van de in die bouwstof aanwezige stoffen molybdeen en seleen het eerste, tweede
      en derde lid niet van toepassing, indien de krachtens [artikel 14, vierde lid][ref5], voor avi-bodemas bepaalde
      isolatie-, beheers- en controlemaatregelen zijn getroffen.

      7 Voor het op of in de bodem gebruiken van E-vliegas in niet-standaard toepassingen is het daarvoor krachtens
      [artikel 14, zesde lid][ref6], voor avi-bodemas bepaalde van overeenkomstige toepassing.


