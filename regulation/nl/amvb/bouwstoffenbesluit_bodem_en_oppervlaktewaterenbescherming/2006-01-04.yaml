  - number: '15'
    text: |-
      Behoudens in een geval als bedoeld in [artikel 14, vijfde lid][ref1], kan het bevoegd gezag ten aanzien
      van het aanbrengen, het onderhoud en de controle van een isolerende bovenafdichting als bedoeld in
      [artikel 14, eerste lid, onder ][ref2], nadere eisen stellen. Degene tot wie een nadere eis wordt gericht, is
      verplicht daaraan te voldoen.


