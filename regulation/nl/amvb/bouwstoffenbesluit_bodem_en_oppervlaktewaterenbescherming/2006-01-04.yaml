  - number: '30'
    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip waarop [dit artikel][ref1] vervalt, wordt in afwijking
      van [artikel 1, eerste lid, onder ][ref2] "deskundig bedrijf" verstaan: een bedrijf dat of een dienst die
      aantoonbare ervaring en deskundigheid heeft met het verrichten van een bij of krachtens dit besluit voorgeschreven
      werkzaamheid.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0007667#Artikel1
    url: https://wetten.overheid.nl/BWBR0007667/2006-01-04#Artikel30
