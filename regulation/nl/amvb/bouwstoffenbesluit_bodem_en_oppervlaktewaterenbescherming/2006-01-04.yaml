  - number: '19'
    text: |-
      1 Ten aanzien van het in oppervlaktewater gebruiken van schone grond zijn de regels, gesteld bij of krachtens
      [artikel 5][ref1] van overeenkomstige toepassing.

      2 Tenzij op grond van kennis of visuele waarneming niet kan of redelijkerwijs niet zou kunnen worden aangenomen
      dat die grond voldoet aan de samenstellingswaarden, zoals aangegeven in [bijlage 1][ref2], is het eerste lid niet
      van toepassing op het bij de uitvoering van zandsuppleties op het strand of de onderwaterbodem van de Noordzee, de
      Waddenzee, of de Westerschelde gebruiken van grond afkomstig uit die wateren.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007667
