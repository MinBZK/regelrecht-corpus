  - number: '10'
    text: |-
      1 Degene die een bouwstof gebruikt op of in de bodem, draagt er zorg voor dat die bouwstof:

      a. niet met de bodem wordt vermengd;

      b. kan worden verwijderd en

      c. wordt verwijderd in geval het deel van het werk waarvan de bouwstof deel uitmaakt, wordt verwijderd.

      2 In afwijking van het eerste lid, aanhef en onder c, wordt een categorie 1-bouwstof niet verwijderd, indien het
      verwijderen van die bouwstof tot een grotere aantasting van de bodem ter plaatse van die bouwstof leidt dan het
      niet verwijderen van die bouwstof.
    url: https://wetten.overheid.nl/BWBR0007667/2006-01-04#Artikel10
  - number: '11'
    text: |-
      1 Degene die voornemens is een bouwstof op of in de bodem te gebruiken, meldt dit voornemen aan het bevoegd gezag.

      2 Een melding als bedoeld in het eerste lid, wordt gedaan gelijktijdig met het voor of in verband met dat werk:

      a. indienen van een aanvraag voor een vergunning als bedoeld in [artikel 40, eerste lid, van de Woningwet][ref1]
      of, indien deze vergunning niet is vereist;

      b. doen van een melding als bedoeld in [artikel 42, eerste lid, onder a, van de Woningwet][ref2] of, indien noch
      deze melding noch een vergunning als bedoeld onder a, is vereist;

      c. indienen van een aanvraag voor een vergunning als bedoeld in
      [artikel 8.1, eerste lid, van de Wet milieubeheer][ref3] of, indien noch deze vergunning noch een vergunning als
      bedoeld onder a, noch een melding als bedoeld onder b, is vereist;

      d. doen van een melding als bedoeld in [artikel 8.41, eerste lid, van de Wet milieubeheer][ref4] of, indien noch
      deze melding, noch een melding als bedoeld onder b, noch een vergunning als bedoeld onder a of onder c, is vereist;

      e. indienen van een aanvraag voor een vergunning als bedoeld in
      [artikel 14 van de Wet op de Ruimtelijke Ordening][ref5], indien het bestuursorgaan dat bevoegd is een vergunning
      als bedoeld onder a, c of e, te verlenen of het bestuursorgaan tot wie een melding als bedoeld onder b of d, moet
      worden gericht tevens voor het betreffende gebruiken van bouwstoffen krachtens [artikel 3][ref6] het bevoegd gezag
      is.

      3 Indien enig voor een melding benodigd gegeven nog niet bekend is op het tijdstip waarop een aanvraag voor een
      vergunning wordt ingediend of een melding wordt gedaan als bedoeld in het tweede lid, onder a tot en met e, dan
      wordt dat gegeven aan het bevoegd gezag verstrekt:

      a. ten minste vijf werkdagen voor het gebruiken bij een voorgenomen gebruik van grond die behoort tot de categorie
      1-bouwstoffen, of

      b. ten minste een maand voor het gebruiken bij een voorgenomen gebruik van een andere bouwstof.

      4 Het derde lid is van overeenkomstige toepassing in geval van wijziging van bij een melding verstrekte gegevens.

      5 Indien zich niet één van de gevallen, bedoeld in het tweede lid, voordoet, wordt een melding als bedoeld in het
      eerste lid, gedaan:

      a. ten minste vijf werkdagen voor het gebruiken bij een voorgenomen gebruik van grond die behoort tot de categorie
      1-bouwstoffen, of

      b. ten minste een maand voor het gebruiken bij een voorgenomen gebruik van een andere bouwstof.

      6 Indien bij een voorgenomen gebruik van een bouwstof, niet zijnde grond die behoort tot de categorie 1-
      bouwstoffen, de in [bijlage 3][ref7], onder punt 4, genoemde gegevens nog niet bekend zijn op het tijdstip waarop
      de melding, bedoeld in het eerste lid, dient te worden gedaan, worden deze gegevens, zo nodig in afwijking van
      het tweede, derde of vijfde lid, uiterlijk vijf werkdagen voor het gebruik van de desbetreffende bouwstof aan het
      bevoegd gezag verstrekt.

      7 Bij een melding als bedoeld in het eerste lid, worden de in [bijlage 3][ref8] genoemde gegevens verstrekt. Voor
      zover deze gegevens reeds in het kader van een aanvraag voor een vergunning of in het kader van een melding als
      bedoeld in het tweede lid, onder a tot en met *e*, worden verstrekt, behoeven deze niet meer bij de melding te
      worden verstrekt. De melding wordt gedaan op een formulier waarvan het model wordt vastgesteld door Onze Minister.

      8 Onze Minister kan nadere regels stellen met betrekking tot de bij de melding te verstrekken gegevens.

      9 Dit artikel is niet van toepassing op het gebruiken van een categorie 1-bouwstof, niet zijnde grond.

      10 Indien bij een voorgenomen gebruik van een bouwstof sprake is van verschillende partijen kunnen met uitzondering
      van de eerste partij de in [bijlage 3, onder punt 4][ref9], genoemde gegevens zo nodig in afwijking van het
      derde lid, onderdeel a, vijfde lid, onderdeel a, en zesde lid uiterlijk twee werkdagen voor het gebruik van de
      desbetreffende bouwstof aan het bevoegd gezag worden verstrekt.

      11 In afwijking van het zevende lid worden bij een melding als bedoeld in het eerste lid van het gebruik van
      een niet-vormgegeven bouwstof zijnde grond als bedoeld in [artikel 9, elfde lid][ref10], in plaats van de in
      [bijlage 3, onder punt 4][ref11], genoemde gegevens met betrekking tot de immissie in de bodem, de gegevens als
      bedoeld in [artikel 9, elfde lid][ref12], verstrekt.

      12 In afwijking van het zevende lid worden bij een melding als bedoeld in het eerste lid van
      het opnieuw binnen een project gebruiken van categorie 1-bouwstoffen zijnde grond als bedoeld in
      [artikel 9a, eerste lid, onderdeel d][ref13], in plaats van de in [bijlage 3, onder punt 4][ref14], genoemde
      gegevens, de gegevens als bedoeld in [artikel 9a, eerste lid, onderdeel d, onder 1° en 2°][ref15] verstrekt.


