  - number: '3'
    text: |-
      1 Behoudens het tweede, derde en vierde lid, zijn voor de toepassing van dit besluit en de daarop berustende
      bepalingen burgemeester en wethouders van de gemeente waar de bouwstoffen worden gebruikt, het bevoegd gezag.

      2 Behoudens het derde en vierde lid, zijn gedeputeerde staten het bevoegd gezag, indien:

      a. de bouwstoffen worden gebruikt, anders dan bij het bouwen van bouwwerken als bedoeld in
      [artikel 1, onder ][ref1], en

      b. de bouwstoffen worden gebruikt binnen een inrichting die is aangewezen krachtens
      [artikel 1.1, derde lid, van de Wet milieubeheer][ref2] en waarvoor gedeputeerde staten voor de vergunningverlening
      krachtens die wet het bevoegd gezag zijn.

      3 Behoudens het vierde lid, is Onze Minister het bevoegd gezag, indien:

      a. de bouwstoffen worden gebruikt, anders dan bij het bouwen van bouwwerken als bedoeld in
      [artikel 1, onder ][ref3], en

      b. de bouwstoffen worden gebruikt binnen een inrichting die is aangewezen krachtens
      [artikel 1.1, derde lid, van de Wet milieubeheer][ref4] en waarvoor Onze Minister voor de vergunningverlening
      krachtens die wet bevoegd gezag is.

      4 De waterkwaliteitsbeheerder is het bevoegd gezag indien bouwstoffen worden gebruikt in oppervlaktewater of op of
      in de bodem onder oppervlaktewater.


