  - number: 22a
    text: |-
      Tenzij het gaat om bouwstoffen waarvan op grond van kennis of organoleptische waarneming niet kan of redelijkerwijs
      niet zou kunnen worden aangenomen dat die bouwstoffen voldoen aan de samenstellings- en immissiewaarden, zoals
      aangegeven in [bijlage 2][ref1], is [artikel 22][ref2] niet van toepassing op:

      a. het in oppervlaktewater gebruiken van gezaagde natuursteenproducten of metselmortel;

      b. het zonder bewerking opnieuw in oppervlaktewater gebruiken van vormgegeven bouwstoffen van beton, keramiek,
      natuursteen, alsmede bakstenen;

      c. het opnieuw warm in situ in oppervlaktewater gebruiken van asfalt in wegverhardingen, indien overeenkomstig de
      CROW-rapport 04-08, «Richtlijn omgaan met vrijkomend asfalt» wordt aangetoond dat het materiaal niet teerhoudend
      is;

      d. het binnen een project in oppervlaktewater zonder bewerking en onder dezelfde condities opnieuw gebruiken van
      categorie 1-bouwstoffen, mits wordt aangetoond dat de bouwstof voldoet aan de samenstellings- en immissiewaarden,
      zoals aangegeven in [bijlage 2][ref3] op grond van:

      1°. algemene informatie of

      2°. gegevens omtrent samenstelling en immissie die bij of krachtens het
      [eerste tot en met zesde lid van artikel 22][ref4] of vooruitlopend daarop onder de vigeur van het IPO-
      interimbeleid «Werken met secundaire grondstoffen» zijn bepaald in het kader van het eerdere gebruiken in een werk.


      [ref1]: https://wetten.overheid.nl/BWBR0007667
      [ref2]: https://wetten.overheid.nl/BWBR0007667#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0007667
      [ref4]: https://wetten.overheid.nl/BWBR0007667#Artikel22
