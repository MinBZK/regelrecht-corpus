preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 1 november 1993,
    nr. MJZ01n93028, Centrale Directie Juridische Zaken, Afdeling Wetgeving, gedaan mede namens Onze Minister van
    Verkeer en Waterstaat;

    Gelet op richtlijn nr. 89/106/EEG van de Raad van de Europese Gemeenschappen van 21 december 1988 betreffende de
    onderlinge aanpassing van de wettelijke en bestuursrechtelijke bepalingen der lid-staten inzake de voor de bouw
    bestemde produkten (PbEG 1989, L 40), zoals gewijzigd bij richtlijn nr. 93/68/EEG van de Raad van de Europese
    Gemeenschappen van 22 juli 1993 (PbEG L 220);

    Gelet op de artikelen 6, 8, 15, 16, 17, en 71 van de Wet bodembescherming, gelet op de artikelen 2a, 2b, 2c en
    2d van de Wet verontreiniging oppervlaktewateren voor zover het betreft de artikelen 17 tot en met 27 en gelet op
    artikel 120 van de Woningwet voor zover het betreft artikel 29;

    Gezien het advies van de Centrale raad voor de milieuhygiëne van 9 januari 1992, nr. B-92/26, het advies van de
    Raad van de Waterstaat van 28 november 1991 en de adviezen van de Technische commissie bodembescherming nrs. TCB
    A89/13 en TCB A91/02 van april 1989 en juli 1991;

    De Raad van State gehoord (advies van 1 juli 1994, nr. W08.93.0727);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 21
    november 1995, nr. MJZ 95024090, Centrale Directie Juridische Zaken, Afdeling Wetgeving, uitgebracht mede namens
    Onze Minister van Verkeer en Waterstaat;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007667/2006-01-04#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. werk: grondwerk, wegenbouwkundig werk, waterbouwkundig werk of bouwwerk;

      b. bouwstof: materiaal in de hoedanigheid waarin het is bestemd in een werk te worden gebruikt en waarin de
      totaalgehalten aan silicium, calcium of aluminium tezamen meer dan 10% (m/m) van dat materiaal bedragen;

      c. gebruik of gebruiken van bouwstoffen: in een werk aanbrengen of houden van bouwstoffen;

      d. degene die een bouwstof gebruikt:

      1°. wanneer een bouwstof in een werk wordt aangebracht: degene die zelf, op eigen kosten, een bouwstof in een werk
      aanbrengt of degene die opdracht geeft om op zijn kosten een bouwstof in een werk aan te brengen, en

      2°. wanneer een bouwstof in een werk is aangebracht en in dat werk wordt gehouden: de eigenaar van die bouwstof;

      e. vormgegeven bouwstof: bouwstof met een volume per kleinste eenheid van ten minste cm3, die onder normale
      omstandigheden een duurzame vormvastheid heeft;

      f. niet-vormgegeven bouwstof: bouwstof, niet zijnde een vormgegeven bouwstof;

      g. grond: niet-vormgegeven bouwstof met een vaste structuur, die van natuurlijke oorsprong is, niet door de mens is
      geproduceerd en onderdeel van de Nederlandse bodem kan uitmaken;

      h. schone grond: grond die geen van de samenstellingswaarden voor anorganische en organische stoffen, zoals
      aangegeven in [bijlage 1][ref1], overschrijdt;

      i. isolatiemaatregelen: maatregelen waardoor bij gebruik van een bouwstof nagenoeg geen contact van die
      bouwstof met hemelwater of grondwater en in geval van gebruik in oppervlaktewater of op of in de bodem onder
      oppervlaktewater tevens nagenoeg geen contact met oppervlaktewater plaats vindt;

      j. categorie 1-bouwstof: bouwstof die:

      1°. geen van de samenstellingswaarden voor organische stoffen en, in geval het grond betreft, tevens geen van de
      samenstellingswaarden voor anorganische stoffen, zoals aangegeven in [bijlage 2][ref2], overschrijdt, en

      2°. op zodanige wijze wordt gebruikt dat, ook indien geen isolatiemaatregelen worden genomen, geen van de
      immissiewaarden voor anorganische stoffen, zoals aangegeven in [bijlage 2][ref3], wordt overschreden;

      k. categorie 2-bouwstof: bouwstof die:

      1°. geen van de samenstellingswaarden voor organische stoffen en, in geval het grond betreft, tevens geen van de
      samenwetllingswaarden voor anorganische stoffen, zoals aangegeven in [bijlage 2][ref4], overschrijdt, en

      2°. op zodanige wijze wordt gebruikt dat, slechts indien isolatiemaatregelen worden genomen, geen van de
      immissiewaarden voor anorganische stoffen, zoals aangegeven in [bijlage 2][ref5], wordt overschreden;

      l. bouwstof met teerhoudend asfaltgranulaat: bouwstof die geheel of gedeeltelijk is samengesteld uit granulaat,
      verkregen door het breken of frezen van teerhoudend asfalt, en die:

      1°. van de samenstellingswaarden voor organische stoffen, zoals aangegeven in [bijlage 2][ref6], uitsluitend één of
      meer van de waarden voor polycyclische aromatische koolwaterstoffen overschrijdt, en

      2°. op zodanige wijze wordt gebruikt dat geen van de immissiewaarden voor anorganische stoffen, zoals aangegeven in
      [bijlage 2][ref7], wordt overschreden;

      m. avi-bodemas: de bodemas die resteert na verbranding in een inrichting die uitsluitend of in hoofdzaak
      is bestemd voor het verbranden van huishoudelijke afvalstoffen en bedrijfsafvalstoffen als bedoeld in
      [artikel 1.1, eerste lid, van de Wet milieubeheer][ref8] in een roosteroven of wervelbedoven;.

      n. gemiddeld hoogste grondwaterstand: rekenkundig gemiddelde over ten minste acht achtereenvolgende jaren van de
      drie hoogste grondwaterstanden per hydrologisch jaar;

      o. hydrologisch jaar: periode van 1 april tot en met 31 maart;

      p. waterkwaliteitsbeheerder: bestuursorgaan dat op grond van [artikel 3][ref9] onderscheidenlijk
      [artikel 6, eerste lid, van de Wet verontreiniging oppervlaktewateren][ref10] bevoegd is tot vergunningverlening;

      q. Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

      r. Onze Ministers: Onze Minister en Onze Minister van Verkeer en Waterstaat;

      s. NEN: door de Stichting Nederlands Normalisatie-instituut uitgegeven norm;

      t. kwaliteitsverklaring: schriftelijk bewijs, voorzien van een door Onze Ministers aangewezen merkteken, afgegeven
      door een door Onze Ministers aangewezen, deskundig, onafhankelijk instituut, op grond waarvan een bouwstof,
      indien die bouwstof wordt gebruikt op de in de verklaring aangegeven wijze, wordt geacht te voldoen aan de bij of
      krachtens dit besluit gestelde eisen met betrekking tot samenstelling en immissie;

      u. deskundig bedrijf: bedrijf dat of dienst die voldoet aan de eisen ter zake van het verrichten van een bij of
      krachtens dit besluit voorgeschreven werkzaamheid zoals die zijn gesteld door een door de Stichting Raad voor de
      Certificatie erkende certificatie-instelling op grond waarvan het bedrijf of de dienst is gemachtigd het voor die
      werkzaamheid door Onze Ministers aangewezen merkteken te voeren;

      v. Europese richtlijn bouwprodukten: [richtlijn nr. 89/106/EEG](31989L0106) van de Raad van de Europese
      Gemeenschappen van 21 december 1988 betreffende de onderlinge aanpassing van de wettelijke en bestuursrechtelijke
      bepalingen der lid-staten inzake de voor de bouw bestemde produkten (*PbEG* 1989, L 40), zoals gewijzigd bij
      [richtlijn nr. 93/68/EEG](31993L0068) van de Raad van de Europese Gemeenschappen van 22 juli 1993 (*PbEG* 1993,
      L 220);

      w. CE-markering: CE-markering als bedoeld in artikel 4 van de Europese richtlijn bouwprodukten;

      x. bijlagen 1, 2, 3, 4*a* en 4*b*: de bij dit besluit behorende [bijlagen 1][ref11], [2][ref12], [3][ref13],
      [4a][ref14] en [4b][ref15];

      y. werkdagen: dagen die niet vallen op zaterdag, zondag, algemeen erkende feestdagen of Goede Vrijdag;

      z. algemeen erkende feestdagen: de Nieuwjaarsdag, de Christelijke tweede Paas- en Pinksterdag, de beide Kerstdagen,
      de Hemelvaartsdag, de dag waarop de verjaardag van de Koning wordt gevierd en de vijfde mei, alsmede de dagen die
      op grond van het derde lid van [artikel 3 van de Algemene termijnenwet][ref16] gelijk worden gesteld aan algemeen
      erkende feestdagen;

      aa. CROW-rapport 04-08, «Richtlijn omgaan met vrijkomend asfalt»: door het Kennisplatform voor infrastructuur,
      verkeer, vervoer en openbare ruimte uitgegeven richtlijn inzake het omgaan met vrijkomend asfalt, Voorpublicatie
      210, augustus 2004;

      bb. E-vliegas: fijn poeder, hoofdzakelijk bestaand uit bolvormige glasachtige deeltjes, dat vrijkomt bij filtering
      van de rookgasstroom in poederkoolgestookte elektriciteitscentrales;

      cc. IPO-interimbeleid «Werken met secundaire grondstoffen»: vooruitlopend op dit besluit door het Inter
      Provinciaal Overlegorgaan ter uitwerking van [artikel 10.47 van de Wet milieubeheer][ref17] en het
      [Inrichtingen- en vergunningenbesluit milieubeheer][ref18] vastgesteld beleid inzake het toepassen van secundaire
      grondstoffen van december 1994, zoals gewijzigd in juni 1997;

      dd. project: een combinatie van werken die worden uitgevoerd als samenhangend en in tijd en plaats afgebakend
      geheel.

      2 Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt het houden van een bouwstof in
      een werk geacht niet onderbroken te zijn, wanneer die bouwstof tijdelijk wordt verplaatst of uit het werk wordt
      weggenomen en die bouwstof na de verplaatsing of het wegnemen, zonder te zijn bewerkt, op of nabij dezelfde plaats
      en onder dezelfde condities opnieuw in dat werk wordt aangebracht.

      3 Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt het terugbrengen van grond op of in
      de bodem, daaronder begrepen de bodem onder oppervlaktewater, op of nabij de plaats waar deze is ontgraven, niet
      beschouwd als het gebruiken van een bouwstof, tenzij die grond sinds dat ontgraven is bewerkt.


