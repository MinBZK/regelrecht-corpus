  - number: '16'
    text: |-
      1 Degene die ingevolge de bij of krachtens [artikel 14][ref1] gestelde regels onderzoek dient te
      verrichten op of in een gedeelte van de bodem ten aanzien waarvan hem de nodige bevoegdheid ontbreekt,
      kan het bevoegd gezag verzoeken de rechthebbenden een verplichting op te leggen als bedoeld in
      [artikel 71, eerste lid, van de Wet bodembescherming][ref2].

      2 Degene die een verzoek doet als bedoeld in het eerste lid, verstrekt bij het verzoek de volgende gegevens:

      a. de naam en het adres van de aanvrager en de rechthebbenden;

      b. de plaats waar het onderzoek moet plaatsvinden;

      c. de aard, de omvang en het tijdstip van het voorgenomen onderzoek, en

      d. de handelingen die de rechthebbenden in het belang van het onderzoek moeten nalaten.

      3 Het bevoegd gezag kan, indien een verzoek als bedoeld in het eerste lid is gedaan, de rechthebbenden ten aanzien
      van het betrokken gedeelte van de bodem de in [artikel 71, eerste lid van de Wet bodembescherming][ref3] bedoelde
      verplichting opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel71
