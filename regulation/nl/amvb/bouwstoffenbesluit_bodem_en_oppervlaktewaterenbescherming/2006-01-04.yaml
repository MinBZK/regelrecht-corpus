    text: |-
      1 De bij of krachtens [artikel 1, eerste, derde of vierde lid, van de Wet verontreiniging oppervlaktewateren][ref1]
      gestelde verboden gelden niet voor het in oppervlaktewater gebruiken van schone grond.

      2 Degene die voornemens is schone grond te gebruiken in oppervlaktewater, meldt dit voornemen aan het bevoegd gezag
      uiterlijk vijf werkdagen voor het gebruiken.

      3 Bij een melding als bedoeld in het tweede lid, worden de in [bijlage 4a][ref2] genoemde gegevens verstrekt.


