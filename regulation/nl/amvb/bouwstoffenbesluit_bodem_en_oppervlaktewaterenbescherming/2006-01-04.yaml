  - number: 9a
    text: |-
      1 Tenzij het gaat om bouwstoffen waarvan op grond van kennis of organoleptische waarneming niet kan of
      redelijkerwijs niet zou kunnen worden aangenomen dat die bouwstoffen voldoen aan de samenstellings- en
      immissiewaarden, zoals aangegeven in [bijlage 2][ref1], is [artikel 9][ref2] niet van toepassing op:

      a. het op of in de bodem gebruiken van gezaagde natuursteenproducten of metselmortel;

      b. het zonder bewerking opnieuw op of in de bodem gebruiken van vormgegeven bouwstoffen van beton, keramiek,
      natuursteen, alsmede bakstenen;

      c. het opnieuw warm in situ op of in de bodem gebruiken van asfalt in wegverhardingen, indien overeenkomstig de
      CROW-rapport 04-08, «Richtlijn omgaan met vrijkomend asfalt» wordt aangetoond dat het materiaal niet teerhoudend
      is;

      d. het binnen een project op of in de bodem zonder bewerking en onder dezelfde condities opnieuw gebruiken van
      categorie 1-bouwstoffen, mits wordt aangetoond dat de bouwstof voldoet aan de samenstellings- en immissiewaarden,
      zoals aangegeven in [bijlage 2][ref3] op grond van:

      1°. algemene informatie of

      2°. gegevens omtrent samenstelling en immissie die bij of krachtens het
      [eerste tot en met achtste lid van artikel 9][ref4] of vooruitlopend daarop onder de vigeur van het IPO-
      interimbeleid «Werken met secundaire grondstoffen» zijn bepaald in het kader van het eerdere gebruiken in een werk.

      2 Tot vijf jaar na het tijdstip waarop opnieuw asfalt als bedoeld in het eerste lid, onderdeel c of opnieuw binnen
      een project een categorie1-bouwstof niet zijnde grond als bedoeld in het eerste lid, onderdeel d in een werk
      is aangebracht, worden op verzoek van het bevoegd gezag de gegevens als bedoeld in het eerste lid, onderdeel c
      respectievelijk onderdeel d, onder 1° en 2° verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0007667
      [ref2]: https://wetten.overheid.nl/BWBR0007667#Artikel9
