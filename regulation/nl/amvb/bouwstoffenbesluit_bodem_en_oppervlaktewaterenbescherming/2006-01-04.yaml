  - number: '5'
    text: |-
      1 Tot één jaar na het tijdstip waarop schone grond in een werk is aangebracht, verstrekt degene die die grond op of
      in de bodem gebruikt op verzoek van het bevoegd gezag gegevens met betrekking tot de samenstelling van die grond.

      2 Indien het bevoegd gezag daarom verzoekt, dienen de gegevens die ingevolge het eerste lid worden verstrekt, te
      zijn verkregen door bepaling van de samenstelling van de grond door een door Onze Ministers aangewezen instantie
      overeenkomstig de bij regeling van Onze Ministers ter zake gestelde regels of overeenkomstig een wijze die
      gelijkwaardig is aan de wijze zoals in die regels wordt voorgeschreven.

      3 Bij regeling van Onze Ministers:

      a. kunnen gevallen worden aangewezen, waarin de verplichting, bedoeld in het eerste lid, niet geldt, en

      b. kan een formulier worden vastgesteld, dat bij het verstrekken van de gegevens, bedoeld in het eerste lid, wordt
      gebruikt.

      4 Degene die grond gebruikt, waarvoor een door Onze Ministers erkende kwaliteitsverklaring is afgegeven, waaruit
      blijkt dat die grond is aan te merken als schone grond, kan ter voldoening aan het bepaalde in het eerste en tweede
      lid aan het bevoegd gezag die kwaliteitsverklaring verstrekken.
    url: https://wetten.overheid.nl/BWBR0007667/2006-01-04#Artikel5
  - number: '6'
    text: |-
      1 Deze paragraaf is niet van toepassing op het op of in de bodem gebruiken van schone grond.

      2 Bij het gebruiken van niet-schone grond op of in de bodem zijn ten aanzien van de vaststelling van een
      overschrijding van één of meer van de samenstellingswaarden voor anorganische of organische stoffen, zoals
      aangegeven in bijlage 1, in die grond de regels met betrekking tot de bepaling van de samenstelling van schone
      grond, gesteld bij of krachtens [artikel 5, tweede lid][ref1], van toepassing voor zover dat bij regeling van Onze
      Ministers is bepaald. Bij die regeling kunnen ten aanzien van de vaststelling, bedoeld in de eerste volzin, nadere
      regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel5
    url: https://wetten.overheid.nl/BWBR0007667/2006-01-04#Artikel6
