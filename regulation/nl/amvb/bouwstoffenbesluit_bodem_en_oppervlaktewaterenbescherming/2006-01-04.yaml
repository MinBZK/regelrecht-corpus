  - number: '2'
    text: |-
      1 Bij regeling van Onze Ministers worden regels gesteld met betrekking tot het bepalen van de totaalgehalten aan
      silicium, calcium of aluminium in een materiaal dat is bestemd om in een werk te worden gebruikt, ter bepaling of
      dat materiaal als bouwstof kan worden aangemerkt.

      2 Bij regeling van Onze Ministers worden voorts regels gesteld met betrekking tot:

      a. het bepalen van het volume van de kleinste eenheid van een bouwstof, en

      b. het bepalen of een bouwstof een duurzame vormvastheid heeft, ter bepaling of een bouwstof als vormgegeven
      bouwstof kan worden aangemerkt.

      3 Bij regeling van Onze Ministers kunnen bouwstoffen worden aangewezen, die, indien die bouwstoffen worden gebruikt
      op een bij die regeling aangegeven wijze, geacht worden onder normale omstandigheden niet duurzaam vormvast te
      zijn.

      4 Bij regeling van Onze Minister van Verkeer en Waterstaat kunnen grote oppervlaktewateren als bedoeld in
      [bijlage 2][ref1] worden aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0007667
