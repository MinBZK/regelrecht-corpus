  - number: '31'
    text: |-
      Een artikel van dit besluit of onderdeel daarvan is niet van toepassing op het gebruiken van een bouwstof in een
      werk, indien die bouwstof in dat werk is aangebracht uiterlijk zes maanden na het tijdstip waarop dat artikel of
      artikelonderdeel ingevolge [artikel 32][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel32
    url: https://wetten.overheid.nl/BWBR0007667/2006-01-04#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '32'
        hoofdstuk: '4'
  - number: '32'
    text: |-
      Dit besluit treedt in werking met ingang van 1 januari 1998 danwel met ingang van een ander, bij koninklijk besluit
      te bepalen tijdstip. Dit tijdstip kan voor de verschillende artikelen of onderdelen daarvan en voor verschillende,
      bij het koninklijk besluit aan te wijzen bouwstoffen of categorieën van bouwstoffen, die op een bij het koninklijk
      besluit aan te geven wijze worden gebruikt, verschillend worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007667/2006-01-04#Artikel32
  - number: '33'
    text: 'Dit besluit wordt aangehaald als: Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming.'
    url: https://wetten.overheid.nl/BWBR0007667/2006-01-04#Artikel33
