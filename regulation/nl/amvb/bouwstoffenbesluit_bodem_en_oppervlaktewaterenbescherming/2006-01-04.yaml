  - number: '22'
    text: |-
      1 Een bouwstof wordt in oppervlaktewater slechts gebruikt indien voor de in [bijlage 2][ref1] vermelde
      organische stoffen en, in geval het grond betreft, tevens voor de in die bijlage vermelde anorganische stoffen de
      samenstelling van die bouwstof door een door Onze Ministers aangewezen instantie is bepaald.

      2 De bepaling van de samenstelling van de bouwstof, bedoeld in het eerste lid, vindt plaats overeenkomstig de
      regels, gesteld bij of krachtens [artikel 9, tweede en zesde lid, of zevende lid][ref2].

      3 In afwijking van het tweede lid vindt voor grond de bepaling van de samenstelling plaats overeenkomstig de
      regels, gesteld bij of krachtens [artikel 9, derde of zevende lid][ref3].

      4 Een bouwstof wordt in oppervlaktewater slechts gebruikt indien voor de in [bijlage 2][ref4] vermelde anorganische
      stoffen de immissie in het oppervlaktewater als gevolg van emissie uit die bouwstof door een door Onze Ministers
      aangewezen instantie is bepaald.

      5 De bepaling van de immissie in het oppervlaktewater, bedoeld in het vierde lid, vindt plaats overeenkomstig de
      regels, gesteld bij of krachtens [artikel 9, vijfde en zesde lid, of zevende lid][ref5].

      6 Degene die een categorie 1-bouwstof gebruikt en beschikt over een voor de desbetreffende bouwstof afgegeven, door
      Onze Ministers erkende kwaliteitsverklaring voldoet aan de bij of krachtens het eerste tot en met het vijfde lid
      gestelde regels.

      7 Het vierde lid is niet van toepassing op het in oppervlaktewater gebruiken van niet-vormgegeven bouwstoffen,
      indien een door Onze Ministers aangewezen instantie het uitlooggedrag conform NEN 7373 heeft trachten te bepalen
      gedurende een periode van tenminste 28 dagen en daarbij een L/S-waarde is bereikt die kleiner is dan 2.


      [ref1]: https://wetten.overheid.nl/BWBR0007667
      [ref2]: https://wetten.overheid.nl/BWBR0007667#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0007667#Artikel9
