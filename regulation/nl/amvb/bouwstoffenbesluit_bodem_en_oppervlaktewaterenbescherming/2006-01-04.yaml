  - number: '12'
    text: |-
      1 Grond die behoort tot de categorie 1-bouwstoffen, wordt op of in de bodem slechts gebruikt in een zodanige
      hoeveelheid dat is gewaarborgd dat de gebruiker van die grond kan voldoen aan [artikel 10][ref1]. Die hoeveelheid
      is ten minste 50 m3 aaneensluitend in een werk.

      2 Het bevoegd gezag kan een nadere eis stellen ten aanzien van de minimumhoeveelheid, waarin de in het eerste lid
      bedoelde grond in een werk moet worden gebruikt; deze hoeveelheid mag echter niet kleiner zijn dan de in het eerste
      lid, tweede volzin, genoemde hoeveelheid. Degene tot wie een nadere eis als bedoeld in de eerste volzin, wordt
      gericht, is verplicht daaraan te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel10
    url: https://wetten.overheid.nl/BWBR0007667/2006-01-04#Artikel12
