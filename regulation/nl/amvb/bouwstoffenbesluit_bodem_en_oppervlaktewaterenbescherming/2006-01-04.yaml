  - number: '4'
    text: |-
      1 Voor de toepassing van de bij of krachtens dit hoofdstuk gestelde regels wordt onder "bodem" niet mede de bodem
      onder oppervlaktewater verstaan.

      2 Dit hoofdstuk is niet van toepassing op het gebruiken van:

      a. bouwstoffen binnen een gebouw als bedoeld in [artikel 1, onder ][ref1];

      b. vlakglas, en

      c. metallisch aluminium.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
