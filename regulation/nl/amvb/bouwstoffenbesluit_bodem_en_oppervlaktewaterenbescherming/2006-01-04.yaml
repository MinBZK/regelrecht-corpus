  - number: '26'
    text: |-
      1 De waterkwaliteitsbeheerder verbindt aan een vergunning als bedoeld in
      [artikel 1, eerste, derde of vierde lid, van de Wet verontreiniging oppervlaktewateren][ref1], die betrekking
      heeft op het gebruiken van een bouwstof in oppervlaktewater, voorschriften, inhoudende de verplichting dat
      isolatiemaatregelen en daarbij behorende beheers- en controlemaatregelen worden getroffen.

      2 In de in het eerste lid bedoelde voorschriften wordt ten minste bepaald dat degene die de bouwstof gebruikt:

      a. een zodanige isolerende afdichting aanbrengt dat nagenoeg geen contact van de bouwstof met het oppervlaktewater,
      met hemelwater of met het grondwater plaatsvindt;

      b. de afdichting zodanig onderhoudt en controleert dat haar goede werking is gewaarborgd, en

      c. de gegevens, verkregen bij de controles van de afdichting, op verzoek aan het bevoegd gezag verstrekt.

      3 Het eerste en tweede lid zijn niet van toepassing op een categorie 1-bouwstof.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
    url: https://wetten.overheid.nl/BWBR0007667/2006-01-04#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '1'
  - number: '27'
    text: |-
      1 De waterkwaliteitsbeheerder brengt aan een vergunning als bedoeld in
      [artikel 1, eerste, derde of vierde lid, van de Wet verontreiniging oppervlaktewateren][ref1], die betrekking heeft
      op het gebruiken van een bouwstof in oppervlaktewater, een beperking aan in de zin van het voorschrijven van de
      maximumhoeveelheid te gebruiken bouwstoffen.

      2 Het eerste lid is niet van toepassing op een categorie 1-bouwstof.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
