  - number: '8'
    text: |-
      Het is verboden op of in de bodem een bouwstof te gebruiken, indien daarbij niet wordt voldaan aan de regels die
      bij of krachtens deze paragraaf met betrekking tot het gebruiken van die bouwstof zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0007667/2006-01-04#Artikel8
  - number: '9'
    text: |-
      1 Een bouwstof wordt op of in de bodem slechts gebruikt, indien voor de in bijlage 2 vermelde organische stoffen
      en, in geval het grond betreft, tevens voor de in die bijlage vermelde anorganische stoffen de samenstelling van
      die bouwstof door een door Onze Ministers aangewezen instantie is bepaald.

      2 De bepaling van de samenstelling van een bouwstof vindt plaats overeenkomstig de volgende methoden:

      a. de monsterneming vindt plaats overeenkomstig NEN 7300;

      b. de monsters worden voorbereid overeenkomstig NEN 7310, en

      c. de analyse van de organische stoffen in de monsters vindt plaats overeenkomstig NEN 7330.

      3 Voor grond vindt, in afwijking van het tweede lid, de bepaling van de samenstelling plaats overeenkomstig de bij
      regeling van Onze Ministers gestelde regels.

      4 Een bouwstof wordt op of in de bodem slechts gebruikt, indien voor de in bijlage 2 vermelde anorganische stoffen
      de immissie in de bodem als gevolg van emissie uit die bouwstof door een door Onze Ministers aangewezen instantie
      is bepaald.

      5 De bepaling van de immissie in de bodem, bedoeld in het vierde lid, vindt, rekening houdend met de wijze waarop
      een bouwstof wordt gebruikt, en - indien van toepassing - rekening houdend met de isolatiemaatregelen die worden
      genomen, plaats overeenkomstig de volgende methoden:

      a. de monsterneming vindt plaats overeenkomstig NEN 7300;

      b. de monsters worden voorbereid overeenkomstig NEN 7310;

      c. de bepaling van de uitloging van de monsters van de bouwstof in het laboratorium vindt plaats overeenkomstig
      NEN 7340;

      d. de analyse van de anorganische stoffen in het eluaat uit de monsters vindt plaats overeenkomstig NEN 7320;

      e. de berekening van de immissie in de bodem als gevolg van emissie uit de bouwstof vindt plaats:

      1°. voor de anorganische stoffen in een vormgegeven bouwstof, waarvan de uitloging niet diffusie-bepaald is, en
      voor de anorganische stoffen in een niet-vormgegeven bouwstof volgens een functie waarin Ib uitgedrukt wordt in E ,
      a, h en fext.n, waarbij:

      I = berekende immissie van de bouwstof in de bodem als gevolg van het gebruik van een bouwstof [mg/m2]

      E = uitloging van een bouwstof in het laboratorium [mg/kg]

      a = correctie voor de uitloging van een bouwstof in het laboratorium en de uitloging in de praktijk [mg/kg]

      h = de grootste hoogte waarin een bouwstof in een werk wordt aangebracht[m], met een voor de berekening te hanteren
      minimum van 0,2 m

      f = factor voor de extrapolatie van de uitloging van de bouwstof bij de kort durende laboratoriumproef naar de
      uitloging over 100 jaar, voor toepassingen met isolatiemaatregelen en toepassingen zonder isolatiemaatregelen;

      2°. voor de anorganische stoffen in een vormgegeven bouwstof, waarvan de uitloging diffusie-bepaald is, volgens een
      functie waarin Ib wordt uitgedrukt in E, f, f, f en f, waarbij:

      I = berekende immissie van de bouwstof in de bodem als gevolg van het gebruik van een bouwstof [mg/m2]

      E = uitloging van een bouwstof in het laboratorium [mg/m2]

      f = factor voor de extrapolatie van de uitloging van de bouwstof bij de kort durende laboratoriumproef naar de
      uitloging over 100 jaar

      f = factor voor de bevochtigingsperiode

      f = factor voor het verschil in temperatuur bij bepaling van de uitloging van een bouwstof in het laboratorium en
      bij het gebruik van die bouwstof

      f = factor voor de isolatiemaatregelen,

      of volgens de functie, beschreven [onder 1°][ref1].

      6 Bij regeling van Onze Ministers worden nadere regels gesteld met betrekking tot:

      a. de bepaling van de samenstelling van een bouwstof, uitgezonderd grond, bedoeld in het eerste lid, en

      b. de bepaling van de immissie in de bodem als gevolg van emissie uit een bouwstof, bedoeld in het vierde lid.

      Tot die regels behoren in ieder geval:

      1°. regels met betrekking tot de wijze waarop wordt bepaald of de uitloging van een anorganische stof in een
      vormgegeven bouwstof diffusie-bepaald is;

      2°. regels met betrekking tot de toepassing van de in het tweede en vijfde lid genoemde NEN, daaronder begrepen de
      aanwijzing van door de Stichting Nederlands Normalisatie-instituut uitgegeven ontwerp- of voornormen die in plaats
      van die NEN gelden zolang die NEN nog niet zijn vastgesteld, en

      3°. regels ter uitwerking van de in het vijfde lid, onder *e*, beschreven functies.

      7 De bepaling van de samenstelling van een bouwstof of de bepaling van de immissie in de bodem als gevolg van
      emissie uit een bouwstof door een door Onze Ministers aangewezen instantie, bedoeld in het eerste onderscheidenlijk
      vierde lid, kan op een andere wijze plaatsvinden dan die welke is voorgeschreven in de bij of krachtens het tweede,
      derde, vijfde of zesde lid gestelde regels, indien die andere wijze ten minste gelijkwaardig is aan bedoelde,
      voorgeschreven wijze.

      8 Degene die beschikt over een voor de desbetreffende bouwstof afgegeven, door Onze Ministers erkende
      kwaliteitsverklaring, voldoet aan de bij of krachtens het eerste tot en met het zevende lid gestelde regels.

      9 Tot vijf jaar na het tijdstip waarop een categorie 1-bouwstof niet zijnde grond, in een werk is aangebracht,
      verstrekt degene die de bouwstof gebruikt, op verzoek van het bevoegd gezag:

      a. gegevens met betrekking tot de samenstelling van die bouwstof en de immissie in de bodem als gevolg van emissie
      uit die bouwstof, verkregen door bepaling van die samenstelling en immissie overeenkomstig de bij of krachtens het
      tweede, vijfde, zesde of zevende lid gestelde regels, dan wel

      b. een voor die bouwstof afgegeven kwaliteitsverklaring als bedoeld in het achtste lid.

      Onze Ministers kunnen een model van een formulier vaststellen, dat bij het verstrekken van de gegevens, bedoeld
      [onder a][ref2], wordt gebruikt.

      10 Dit artikel is niet van toepassing op het gebruiken van avi-bodemas die behoort tot de bijzondere, krachtens
      [artikel 7, vijfde lid][ref3], aangewezen categorie gedurende een krachtens dat artikel aangegeven periode.

      11 Het vierde lid is niet van toepassing op het op of in de bodem gebruiken van niet-vormgegeven bouwstoffen,
      indien een door Onze Ministers aangewezen instantie het uitlooggedrag overeenkomstig NEN 7373 heeft trachten te
      bepalen gedurende een periode van tenminste 28 dagen en daarbij een L/S-waarde is bereikt die kleiner is dan 2. Tot
      vijf jaar na het tijdstip waarop een niet-vormgegeven bouwstof niet zijnde grond in een werk is aangebracht worden
      op verzoek van het bevoegd gezag de gegevens van deze uitloogproef verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0007667#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0007667#Artikel7
