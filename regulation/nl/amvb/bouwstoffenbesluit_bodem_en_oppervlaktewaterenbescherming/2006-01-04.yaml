  - number: '25'
    text: |-
      1 Met betrekking tot het gebruiken van een bouwstof in oppervlaktewater, is [artikel 13][ref1] van overeenkomstige
      toepassing.

      2 Het eerste lid is niet van toepassing op een categorie 1-bouwstof.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel13
