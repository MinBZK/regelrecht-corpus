  - number: '13'
    text: |-
      1 Een bouwstof, niet zijnde een categorie 1-bouwstof, wordt op of in de bodem slechts gebruikt in hoeveelheden van
      ten minste 10 000 ton aaneensluitend in een werk.

      2 In afwijking van het eerste lid is het gebruiken van een categorie 2-bouwstof in funderingen van een
      wegenbouwkundig werk toegestaan in hoeveelheden van ten minste 1 000 ton aaneensluitend.
    url: https://wetten.overheid.nl/BWBR0007667/2006-01-04#Artikel13
  - number: '14'
    text: |-
      1 Degene die een bouwstof, niet zijnde een categorie 1-bouwstof, op of in de bodem gebruikt, treft de volgende
      isolatiemaatregelen en daarbij behorende beheers- en controlemaatregelen:

      a. voordat de bouwstof op of in de bodem wordt gebracht, wordt door een deskundig bedrijf de gemiddeld
      hoogste grondwaterstand ter plaatse van het gebruiken van de bouwstof en de te verwachten afstand tussen die
      grondwaterstand en de aan te brengen bouwstof bepaald;

      b. de bouwstof wordt zodanig gebruikt dat deze zich, na zetting van de bodem, ten minste 0,5 m boven de gemiddeld
      hoogste grondwaterstand bevindt;

      c. gedurende het houden van de bouwstof wordt periodiek de gemiddeld hoogste grondwaterstand ter plaatse van de
      aangebrachte bouwstof en de afstand van de bouwstof tot die grondwaterstand door een deskundig bedrijf bepaald en
      worden de daarbij verkregen gegevens op verzoek aan het bevoegd gezag overgelegd;

      d. aan de bovenzijde van de bouwstof wordt een zodanige isolerende afdichting aangebracht dat nagenoeg geen contact
      van de bouwstof met hemelwater plaatsvindt, en

      e. de afdichting wordt zodanig onderhouden en gecontroleerd dat haar isolerende werking is gewaarborgd.

      2 Bij regeling van Onze Minister worden nadere regels gesteld omtrent de bepaling van de gemiddeld hoogste
      grondwaterstand en van de afstand van de bouwstof tot die grondwaterstand, bedoeld in het eerste lid, onder *a*
      en *c*, en het verstrekken van gegevens als bedoeld in [onderdeel ][ref1] van dat lid. Tot die regels behoren in
      ieder geval regels met betrekking tot het onderzoek dat ten behoeve van die bepalingen moet worden verricht en de
      frequentie waarmee die bepalingen dienen plaats te vinden.

      3 Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent het aanbrengen, het onderhoud en de
      controle van de isolerende bovenafdichting, bedoeld in het eerste lid, onder *d* en *e*. Tot de in de eerste volzin
      bedoelde regels kan de eis behoren, dat de afdichting bij het aanbrengen en vervolgens periodiek door een deskundig
      bedrijf op haar isolerende werking wordt gekeurd. Bij de in de eerste volzin bedoelde regeling kunnen voorts regels
      worden gesteld omtrent het verstrekken aan het bevoegd gezag van gegevens, verkregen bij controles of keuringen van
      de afdichting.

      4 Bij regeling van Onze Minister kunnen voor bouwstoffen, niet zijnde categorie 1-bouwstoffen, die op een bij
      die regeling aangewezen wijze worden gebruikt, de naar zijn oordeel geschikte maatregelen inzake een isolerende
      bovenafdichting als bedoeld in het eerste lid, onder *d* en *e*, worden aangewezen.

      5 Degene die een bouwstof, niet zijnde een categorie 1-bouwstof, gebruikt op de bij de regeling, bedoeld in het
      vierde lid, aangewezen wijze, en de voor die bouwstof bij die regeling aangewezen maatregelen inzake een isolerende
      bovenafdichting treft, voldoet aan de regels, gesteld bij of krachtens het eerste lid, onder *d* en *e*, en derde
      lid.

      6 Degene die voornemens is een bouwstof, niet zijnde een categorie 1-bouwstof, te gebruiken, overlegt, in geval
      op hem het vijfde lid niet van toepassing zal zijn, bij de melding, bedoeld in [artikel 11, eerste lid][ref2],
      gegevens over de te verwachten isolerende werking van de isolatiemaatregelen en daarbij behorende beheers- en
      controlemaatregelen die hij ingevolge de bij of krachtens het eerste lid, onder *d* en *e*, en derde lid, gestelde
      regels dient te treffen. De gegevens, bedoeld in de eerste volzin, worden opgesteld door een deskundig bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007667#Artikel11
