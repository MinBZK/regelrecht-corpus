  - number: '21'
    text: |-
      1 De bij of krachtens [artikel 1, eerste, derde of vierde lid, van de Wet verontreiniging oppervlaktewateren][ref1]
      gestelde verboden gelden niet voor het in oppervlaktewater gebruiken van categorie 1-bouwstoffen.

      2 Degene die voornemens is een categorie 1-bouwstof te gebruiken in oppervlaktewater, meldt dit voornemen aan het
      bevoegd gezag uiterlijk vijf werkdagen voor het gebruiken.

      3 Bij een melding als bedoeld in het tweede lid, worden de in [bijlage 4b][ref2] genoemde gegevens verstrekt.

      4 Indien bij een voorgenomen gebruik van een categorie1-bouwstof sprake is van verschillende partijen kunnen met
      uitzondering van de eerste partij de in [bijlage 4b, onder punt 3][ref3], genoemde gegevens zo nodig in afwijking
      van het tweede lid uiterlijk twee werkdagen voor het gebruik van de desbetreffende bouwstof aan het bevoegd gezag
      worden verstrekt.

      5 In afwijking van het derde lid worden bij een melding als bedoeld in het tweede lid van het gebruiken
      van een niet-vormgegeven bouwstof als bedoeld in [artikel 22, zevende lid][ref4], in plaats van de in
      [bijlage 4b, onder punt 3][ref5], genoemde gegevens met betrekking tot de immissie in oppervlaktewater, de gegevens
      als bedoeld in [artikel 22, zevende lid][ref6], verstrekt.

      6 In afwijking van het derde lid worden bij een melding als bedoeld in het tweede lid van het opnieuw
      asfalt gebruiken als bedoeld in [artikel 22a, eerste lid, onder c][ref7] of het opnieuw binnen een project
      gebruiken van categorie 1-bouwstoffen als bedoeld in [artikel 22a, eerste lid, onder deel d][ref8],
      in plaats van de in [bijlage 4b, onder punt 3][ref9] genoemde gegevens, de gegevens als bedoeld in
      [artikel 22a, eerste lid, onderdeel c respectievelijk d, onder 1° en 2°][ref10] verstrekt.

      7 Ten aanzien van het in oppervlaktewater gebruiken van een categorie 1-bouwstof zijn de regels, gesteld bij of
      krachtens [artikel 7, tweede en derde lid][ref11], van overeenkomstige toepassing.


