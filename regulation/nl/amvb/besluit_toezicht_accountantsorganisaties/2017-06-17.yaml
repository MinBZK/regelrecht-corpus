        artikel: 38a
        hoofdstuk: '9'
  - number: '41'
    text: |-
      Een aanvraag van een vergunning als bedoeld in [artikel 5 van de wet][ref1] die ingevolge
      [artikel 80, tweede lid, van de wet][ref2] binnen een maand na inwerkingtreding van de [wet][ref3] bij de
      Autoriteit Financiële Markten wordt ingediend, bevat in aanvulling op de in [artikel 2, eerste lid][ref4], bedoelde
      gegevens en bescheiden, het aantal wettelijke controles dat de aanvrager op het tijdstip van de aanvraag verricht
      bij organisaties van openbaar belang of overige ondernemingen of instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel80
      [ref3]: https://wetten.overheid.nl/BWBR0019468
      [ref4]: https://wetten.overheid.nl/BWBR0020184#Artikel2
    url: https://wetten.overheid.nl/BWBR0020184/2017-06-17#Artikel41
