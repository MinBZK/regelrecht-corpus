  - number: '12'
    text: |-
      1 Alvorens een opdracht voor een wettelijke controle te aanvaarden of te continueren, beoordeelt een
      accountantsorganisatie:

      a. of zij voldoet aan het gestelde bij en krachtens [paragraaf 3.1.2 van de wet][ref1] en, voor zover van
      toepassing, [paragraaf 3.1.3 van de wet][ref2] en de verordening;

      b. of er sprake is van bedreigingen voor haar onafhankelijkheid en wat er gedaan wordt om deze bedreigingen te
      beperken;

      c. of zij kan voldoen aan [artikel 15][ref3]; en

      d. de integriteit van de controlecliënt.

      2 De accountantsorganisatie legt de beoordeling, bedoeld in het eerste lid, schriftelijk vast.

      3 De accountantsorganisatie waarborgt dat haar medewerkers haar de informatie verstrekken die van belang is voor
      de beoordeling.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Paragraaf3.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Paragraaf3.1.3
      [ref3]: https://wetten.overheid.nl/BWBR0020184#Artikel15
    url: https://wetten.overheid.nl/BWBR0020184/2017-06-17#Artikel12
