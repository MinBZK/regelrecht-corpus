  - number: 2a
    text: |-
      1 Een aanvraag tot inschrijving in het register, bedoeld in [artikel 12c, eerste lid, van de wet][ref1], wordt
      schriftelijk ingediend en bevat de volgende gegevens:

      a. de datum van de aanvraag;

      b. de naam, het adres en de vestigingsplaats of de woonplaats van de aanvrager;

      c. de contactgegevens, de contactpersoon en, indien aanwezig, het internetadres van de aanvrager;

      d. de rechtsvorm van de aanvrager;

      e. de naam van alle auditors van een derde land die de aanvrager doet inschrijven in het register, bedoeld in
      [artikel 11 van de wet][ref2], de naam van de toezichthoudende instanties in dat derde land waarbij deze auditors
      van een derde land zijn geregistreerd en, voor zover van toepassing, het inschrijvingsnummer;

      f. de namen, adressen en vestigingsplaatsen van alle vestigingen van de aanvrager van waaruit verklaringen worden
      of zullen worden afgegeven als bedoeld in [artikel 12b van de wet][ref3];

      g. de naam, het zakelijk adres en, indien van toepassing, het inschrijvingsnummer bij een beroepsorganisatie
      van alle personen die het dagelijks beleid van de aanvrager bepalen of mede bepalen, alsmede de naam van die
      beroepsorganisatie;

      h. indien de aanvrager deel uitmaakt van een netwerk:

      1°. een beschrijving van de juridische en organisatorische structuur van het netwerk; en

      2°. de namen, adressen en vestigingsplaatsen van de onderscheiden onderdelen van het netwerk; of

      3°. een verwijzing naar de plaats waar de in onderdeel 2° bedoelde informatie publiek toegankelijk is;

      i. indien de aanvrager is ingeschreven als auditkantoor of auditorganisatie van een derde land in de registers van
      toezichthoudende instanties in lidstaten: de naam van de toezichthoudende instanties en, indien van toepassing,
      het inschrijvingsnummer;

      j. indien de aanvrager is ingeschreven in de registers van toezichthoudende instanties in staten die geen lidstaat
      zijn: de naam van de toezichthoudende instanties en, indien van toepassing, het inschrijvingsnummer.

      2 Desgevraagd verstrekt de aanvrager aan de Autoriteit Financiële Markten tevens overige gegevens en bescheiden die
      naar het oordeel van de Autoriteit Financiële Markten nodig zijn in het belang van de beoordeling van de aanvraag.

      3 Voor een aanvraag als bedoeld in het eerste lid wordt gebruik gemaakt van door de Autoriteit Financiële Markten
      voorgeschreven formulieren.

      4 Een aanvraag als bedoeld in het eerste lid wordt ondertekend door tenminste een van de personen die het dagelijks
      beleid van een auditorganisatie van een derde land bepalen.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel12c
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0019468#Artikel12b
