        artikel: 30c
        hoofdstuk: '6'
  - number: '31'
    text: |-
      Een accountantsorganisatie houdt zich aan de verordeningen en nadere voorschriften die krachtens
      [artikel 19, tweede lid, aanhef en onderdeel b, van de Wet op het accountantsberoep][ref1] zijn vastgesteld en die
      nadere regels stellen ter zake van de in dit hoofdstuk geregelde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel19
    url: https://wetten.overheid.nl/BWBR0020184/2017-06-17#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '19'
  - number: '32'
    text: |-
      1 Een accountantsorganisatie heeft een beleid dat ertoe strekt dat de betrokkenheid van de accountantsorganisatie
      en haar medewerkers wordt voorkomen bij strafbare feiten en wetsovertredingen die het vertrouwen in de
      accountantsorganisatie of in de financiële markten kunnen schaden. Gedragslijnen en procedures ter waarborging van
      de naleving van [artikel 27][ref1] maken onderdeel uit van dit beleid.

      2 Een accountantsorganisatie stelt procedures en regels vast ter zake van de omgang met en vastlegging van
      incidenten die ernstige gevolgen hebben voor de integere uitoefening van haar bedrijf.

      3 Een accountantsorganisatie neemt naar aanleiding van een incident als bedoeld in het tweede lid passende
      maatregelen. Deze maatregelen zijn gericht op het beheersen van de als gevolg van het incident opgetreden risico’s
      en op het voorkomen van herhaling.

      4 Een accountantsorganisatie informeert de Autoriteit Financiële Markten onverwijld omtrent de in het tweede lid
      bedoelde incidenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020184#Artikel27
    url: https://wetten.overheid.nl/BWBR0020184/2017-06-17#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0020184
        artikel: '27'
        hoofdstuk: '6'
  - number: '33'
    text: |-
      1 De administratieve vastlegging van incidenten als bedoeld in [artikel 32, tweede lid][ref1], omvat ten minste de
      feiten en omstandigheden van het incident, de gegevens over degene of degenen die bij het incident zijn betrokken
      en de maatregelen die naar aanleiding van het incident zijn genomen.

      2 Een accountantsorganisatie bewaart de in het eerste lid bedoelde gegevens gedurende ten minste zeven jaren nadat
      zij zijn vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020184#Artikel32
    url: https://wetten.overheid.nl/BWBR0020184/2017-06-17#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0020184
        artikel: '32'
        hoofdstuk: '7'
  - number: '34'
    text: |-
      Een accountantsorganisatie houdt zich aan de verordeningen en nadere voorschriften die krachtens
      [artikel 19, tweede lid, aanhef en onderdeel b, van de Wet op het accountantsberoep][ref1] zijn vastgesteld en die
      nadere regels stellen ter zake van de in dit hoofdstuk geregelde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel19
    url: https://wetten.overheid.nl/BWBR0020184/2017-06-17#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '19'
  - number: '35'
    text: |-
      Een externe accountant houdt zich aan de verordeningen en nadere voorschriften die krachtens
      [artikel 19, eerste lid, van de Wet op het accountantsberoep][ref1] zijn vastgesteld en die nadere regels
      stellen ter zake van zijn vakbekwaamheid, onafhankelijkheid, objectiviteit professioneel-kritische instelling en
      integriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel19
    url: https://wetten.overheid.nl/BWBR0020184/2017-06-17#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '19'
  - number: '36'
    text: |-
      Onder fraude van materieel belang als bedoeld in [artikel 26, derde lid, van de wet][ref1] wordt verstaan een
      opzettelijk handelen of nalaten waarbij misleiding wordt gebruikt om een wederrechtelijk voordeel te behalen en
      waarbij de aard of de omvang zodanig is dat beslissingen die in het maatschappelijk verkeer worden genomen op grond
      van de financiële verantwoording van de controlecliënt zouden kunnen worden beïnvloed door die misleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel26
    url: https://wetten.overheid.nl/BWBR0020184/2017-06-17#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '26'
  - number: '37'
    text: |-
      1 Een melding als bedoeld in [artikel 26, tweede lid, van de wet][ref1] kan achterwege blijven, indien:

      a. de controlecliënt, nadat de externe accountant hem heeft gewezen op zijn redelijk vermoeden van fraude van
      materieel belang, daarnaar onverwijld onderzoek verricht of doet verrichten en op basis daarvan een schriftelijk
      plan opstelt waarin zijn opgenomen:

      1°. de maatregelen die de controlecliënt zal nemen om de gevolgen van de fraude, voor zover mogelijk, ongedaan te
      maken en om herhaling van zodanige fraude te voorkomen; en

      2°. de termijn waarbinnen de controlecliënt de maatregelen zal hebben uitgevoerd;

      b. de externe accountant, binnen vier weken nadat het plan is opgesteld, heeft geoordeeld dat het in onderdeel a
      bedoelde plan toereikend is; en

      c. de externe accountant heeft vastgesteld dat de controlecliënt binnen de in onderdeel a, onder 2°, bedoelde
      termijn de in het plan opgenomen maatregelen in voldoende mate heeft uitgevoerd.

      2 De externe accountant legt zijn oordeel, bedoeld in het eerste lid, onderdeel b, en zijn vaststelling, bedoeld in
      het eerste lid, onderdeel c, vast.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel26
    url: https://wetten.overheid.nl/BWBR0020184/2017-06-17#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '26'
  - number: '38'
    text: |-
      Een externe accountant meldt, indien [artikel 37][ref1] geen toepassing vindt, schriftelijk de volgende gegevens
      aan de in [artikel 26 van de wet][ref2] bedoelde opsporingsambtenaar:

      a. de naam, het adres en de vestigingsplaats van de controlecliënt;

      b. de naam, het adres en de vestigingsplaats van de accountantsorganisatie waarbij de externe accountant werkzaam
      is of waaraan hij is verbonden;

      c. de naam van de externe accountant;

      d. de datum van de melding; en

      e. een omschrijving van de aard van de vermoedelijke fraude van materieel belang.


      [ref1]: https://wetten.overheid.nl/BWBR0020184#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel26
    url: https://wetten.overheid.nl/BWBR0020184/2017-06-17#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0020184
        artikel: '37'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '26'
  - number: 38a
    text: |-
      1 Een externe accountant kan vertrouwelijke gegevens of inlichtingen verkregen bij het verrichten van een
      wettelijke controle, aan derden verstrekken:

      a. indien dit redelijkerwijs noodzakelijk is voor de naleving van het ingevolge
      de wet bepaalde of van de verordeningen en nadere voorschriften die krachtens
      [artikel 19, tweede lid, aanhef en onderdelen a en b, van de Wet op het accountantsberoep][ref1] zijn vastgesteld
      en geschiedt:

      1°. aan een deskundige die door de externe accountant is betrokken bij de uitvoering van een wettelijke controle;

      2°. aan personen binnen de accountantsorganisatie waarbinnen de externe accountant werkzaam is of waaraan hij is
      verbonden dan wel binnen het netwerk waartoe de accountantsorganisatie behoort, die op enigerlei wijze betrokken
      zijn bij een wettelijke controle waarvoor de externe accountant verantwoordelijk is;

      3°. aan een groepsaccountant of een buitenlandse accountant die verantwoordelijkheid draagt voor het afgeven van
      een accountantsverklaring bij de jaarrekening die mede de geconsolideerde jaarrekening van een groep ondernemingen
      of instellingen bevat waarin de gegevens van een controlecliënt van de externe accountant worden opgenomen;

      4°. aan een registeraccountant, een Accountant-Administratieconsulent of een buitenlandse accountant indien deze in
      het kader van een assurance-opdracht gebruik maakt van de werkzaamheden van de externe accountant;

      5°. aan een registeraccountant, een Accountant-Administratieconsulent of buitenlandse accountant van wiens
      werkzaamheden de externe accountant in het kader van een wettelijke controle gebruik maakt;

      6°. aan een registeraccountant, een Accountant-Administratieconsulent of een buitenlandse accountant ten behoeve
      van diens beoordeling van de aanvaardbaarheid van een controleopdracht;

      7°. aan een persoon aan wie advies wordt gevraagd, zoals bedoeld in [artikel 17, eerste lid][ref2];

      8°. aan de persoon die overeenkomstig artikel 8, tweede lid, van de verordening een opdrachtgerichte
      kwaliteitsbeoordeling verricht of de persoon, bedoeld in [artikel 23, eerste lid][ref3];

      9°. aan de persoon die is betrokken bij de uitvoering van een periodiek intern kwaliteitsonderzoek van afgeronde
      opdrachten tot het verrichten van een wettelijke controle;

      10°. aan de beroepsorganisatie;

      b. indien dit plaatsvindt in het kader van de naleving van de verordeningen en nadere voorschriften krachtens
      [artikel 19, tweede lid, aanhef en onderdelen a en b, van de Wet op het accountantsberoep][ref4], in andere
      gevallen dan bedoeld in onderdeel a, en de externe accountant vastlegt op welke onderdelen van die verordeningen en
      nadere voorschriften het verstrekken betrekking heeft;

      c. in het kader van een gerechtelijke procedure of klachtprocedure jegens de externe accountant of de
      accountantsorganisatie waarbij de externe accountant werkzaam is of is geweest of waaraan hij verbonden is of is
      geweest in relatie tot de betreffende controleopdracht; of

      d. indien dit geschiedt met schriftelijke toestemming van de controlecliënt en indien sprake is van een specifiek
      doel en de externe accountant dit doel vastlegt.

      2 Onder een buitenlandse accountant als bedoeld in het eerste lid, onderdeel a, onder 3° tot en met 6° wordt
      verstaan een in een andere lidstaat gevestigde wettelijke auditor als bedoeld in artikel 2, tweede lid, van de
      richtlijn, of een auditor van een derde land.


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0020184#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0020184#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0032573#Artikel19
    url: https://wetten.overheid.nl/BWBR0020184/2017-06-17#Artikel38a
