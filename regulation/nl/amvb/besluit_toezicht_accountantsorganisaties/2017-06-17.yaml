  - number: '46'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0020184/2017-06-17#Artikel46
  - number: '47'
    text: 'Dit besluit wordt aangehaald als: Besluit toezicht accountantsorganisaties.'
    url: https://wetten.overheid.nl/BWBR0020184/2017-06-17#Artikel47
