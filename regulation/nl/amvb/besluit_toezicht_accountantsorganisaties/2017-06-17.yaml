preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Financiën van 22 juni 2006, nr. FM 2006-1525 M, Generale Thesaurie, Directie
    Financiële Markten, Afdeling Marktgedrag en Effectenverkeer;

    Gelet op richtlijn nr. 2006/43/EG van 17 mei 2006 van het Europees Parlement en de Raad van de Europese Unie
    betreffende de wettelijke accountantscontrole van jaarrekeningen en geconsolideerde jaarrekeningen en tot wijziging
    van de Richtlijnen 78/660/EEG en 83/349/EEG van de Raad (PbEU L 157), de artikelen 1, tweede lid, 8, 11, derde lid,
    15, tweede lid, 18, derde lid, 19, 21, tweede lid, 22, 25, 26, tweede en derde lid, 41, vierde lid, en 55, eerste
    lid, van de Wet toezicht accountantsorganisaties;

    De Raad van State gehoord (advies van 20 juli 2006, no. W06.06.0253/IV);

    Gezien het nader rapport van Onze Minister van Financiën van 8 augustus 2006, nr. FM 2006-1908 U;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0020184/2017-06-17#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

        - beroepsorganisatie: Nederlandse beroepsorganisatie van accountants, bedoeld in
      [artikel 2, eerste lid, van de Wet op het accountantsberoep][ref1];
        - controledossier: geheel van gegevens en bescheiden die zijn vastgelegd tijdens het uitvoeren van een wettelijke
      controle en waarop de externe accountant zijn verklaring baseert;
        - groepsaccountant: externe accountant die de verantwoordelijkheid draagt voor het afgeven van een
      accountantsverklaring bij de jaarrekening die mede de geconsolideerde jaarrekening van een groep ondernemingen of
      instellingen bevat;
        - medewerkers: externe accountants en overige personen die werkzaam zijn bij of verbonden zijn aan een
      accountantsorganisatie en die zijn betrokken bij de uitvoering van wettelijke controles;
        - verbonden entiteit: onderneming of instelling die met een accountantsorganisatie is verbonden door middel van
      gemeenschappelijke eigendom, zeggenschap of bestuur;
        - wet: [Wet toezicht accountantsorganisaties][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019468
