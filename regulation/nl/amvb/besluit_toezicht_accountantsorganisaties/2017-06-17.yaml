  - number: '4'
    text: |-
      1 Het register, bedoeld in [artikel 11 van de wet][ref1], vermeldt:

      a. de datum van vergunningverlening als bedoeld in [artikel 6, eerste lid, van de wet][ref2];

      b. de datum van inschrijving in het register als bedoeld in [artikel 12c, eerste lid][ref3], onderscheidenlijk
      [artikel 12e, tweede lid, van de wet][ref4];

      c. de in [artikel 2, eerste lid, onderdelen b tot en met d, h tot en met j, k][ref5], met uitzondering van het
      woonadres, l, met uitzondering van het woonadres, m, onder 2° of 3°, en n tot en met q, bedoelde gegevens;

      d. de in [artikel 2a, eerste lid, onderdelen b tot en met j][ref6] bedoelde gegevens, voor zover het register deze
      gegevens niet reeds bevat op grond van onderdeel c;

      e. de in [artikel 2b, eerste lid][ref7], bedoelde gegevens; en

      f. het feit dat de Autoriteit Financiële Markten belast is met het verlenen van vergunningen als bedoeld
      in [artikel 5 van de wet][ref8], toezicht en handhaving zoals geregeld in [hoofdstuk 5 van de wet][ref9] en
      het uitvaardigen van openbare waarschuwingen en de publicatie van handhavingsmaatregelen zoals geregeld in
      [hoofdstuk 6 van de wet][ref10], alsmede het adres van de Autoriteit Financiële Markten.

      2 Indien een vergunning mede strekt tot het verrichten van wettelijke controles bij organisaties van openbaar
      belang, wordt dat vermeld in het register.

      3 De Autoriteit Financiële Markten verwerkt een ingevolge [artikel 3, tweede tot en met vierde lid][ref11], gemelde
      wijziging van de in het eerste lid bedoelde gegevens binnen vijf werkdagen na ontvangst van de melding in het
      register.


