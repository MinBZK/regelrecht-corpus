  - number: '10'
    text: |-
      1 Een accountantsorganisatie houdt een systematische, toegankelijke en actuele cliëntenadministratie bij waarin per
      controlecliënt, voor zover van toepassing, de volgende gegevens worden vastgelegd:

      a. de naam, het adres en de vestigingsplaats;

      b. of de controlecliënt een organisatie van openbaar belang is;

      c. de naam van de externe accountant; en

      d. de per boekjaar in rekening gebrachte vergoedingen voor de wettelijke controle en de in rekening gebrachte
      vergoedingen voor de overige verleende diensten.

      2 De accountantsorganisatie bewaart de gegevens in haar cliëntenadministratie gedurende ten minste zeven jaren
      nadat zij zijn vastgelegd.
    url: https://wetten.overheid.nl/BWBR0020184/2017-06-17#Artikel10
  - number: '11'
    text: |-
      1 Een accountantsorganisatie zorgt ervoor dat externe accountants voor elke wettelijke controle een controledossier
      inrichten.

      2 Een accountantsorganisatie heeft een standaard voor de inrichting van een controledossier.

      3 In het controledossier worden ten minste de volgende gegevens en bescheiden schriftelijk of elektronisch
      vastgelegd:

      a. de overeenkomst tussen de accountantsorganisatie en de controlecliënt en de eventuele wijzigingen daarin;

      b. de correspondentie met betrekking tot de controlecliënt, voor zover deze betrekking heeft op de wettelijke
      controle;

      c. een controleplan waarin de vermoedelijke reikwijdte en aanpak van de wettelijke controle worden vastgelegd;

      d. een beschrijving van de aard en de omvang van de uitgevoerde controlewerkzaamheden;

      e. de begin- en einddatum van uitvoering van de in het controleplan onderscheiden fasen van controlewerkzaamheden;

      f. de voornaamste bevindingen van de uitgevoerde controlewerkzaamheden;

      g. de uit de bevindingen, bedoeld in onderdeel f, getrokken conclusies;

      h. het oordeel van de externe accountant, zoals dat blijkt uit de door hem af te geven accountantsverklaring;

      i. de gegevens die worden vastgelegd ingevolge de artikelen 6 tot en met 8 van de verordening en
      de [artikelen 12, tweede lid][ref1], [13, tweede lid][ref2], [15a, eerste en tweede lid][ref3],
      [17, tweede lid][ref4], en [37, tweede lid][ref5]; en

      j. de overige relevante gegevens en bescheiden die van belang zijn voor het toezicht op de naleving van de bij of
      krachtens de [wet][ref6], de [Wet op het accountantsberoep][ref7] en de verordening gestelde regels.

      4 Een accountantsorganisatie zorgt ervoor dat de externe accountant de accountantsverklaring ondertekent nadat de
      controlewerkzaamheden zijn verricht en vastgelegd.

      5 Een accountantsorganisatie zorgt ervoor dat de externe accountant uiterlijk 60 dagen na de ondertekening van de
      accountantsverklaring de in het derde lid bedoelde gegevens en bescheiden in het controledossier heeft opgenomen en
      het controledossier heeft afgesloten.

      6 Een accountantsorganisatie bewaart een controledossier gedurende ten minste zeven jaren nadat het is afgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0020184#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0020184#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0020184#Artikel15a
