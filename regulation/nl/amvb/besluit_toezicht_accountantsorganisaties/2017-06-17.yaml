  - number: '3'
    text: |-
      1 Een aanvrager meldt een wijziging in de gegevens of bescheiden die hij heeft overgelegd op grond
      van [artikel 2, eerste tot en met derde lid][ref1], [artikel 2a, eerste of tweede lid][ref2], of
      [artikel 2b, eerste of tweede lid][ref3] onverwijld schriftelijk aan de Autoriteit Financiële Markten.

      2 Onverminderd het bepaalde in [artikel 7][ref4], meldt een accountantsorganisatie
      een wijziging in de gegevens of bescheiden die zij heeft overgelegd op grond van
      [artikel 2, eerste lid, onderdelen b tot en met d, h tot en met l, m, onder 2°, en n][ref5] onverwijld en
      wijzigingen in de overige in artikel 2, eerste tot en met derde lid, bedoelde gegevens of bescheiden, met
      uitzondering van de in onderdeel r bedoelde gegevens, ten minste eenmaal per kwartaal, schriftelijk aan de
      Autoriteit Financiële Markten.

      3 Een auditorganisatie van een derde land meldt een wijziging in de gegevens of bescheiden die zij heeft overgelegd
      op grond van [artikel 2a, eerste lid, onderdelen b tot en met j][ref6], onverwijld en wijzigingen in de in artikel
      2a, tweede lid, bedoelde gegevens en bescheiden tenminste eenmaal per kwartaal schriftelijk aan de Autoriteit
      Financiële Markten.

      4 Een auditkantoor meldt een wijziging in de gegevens of bescheiden die hij heeft overgelegd op grond van
      [artikel 2b, eerste lid, onderdelen b tot en met h en i, onder 2°, en j][ref7], onverwijld en wijzigingen in de
      overige in artikel 2b, eerste tot en met derde lid, bedoelde gegevens en bescheiden ten minste eenmaal per kwartaal
      schriftelijk aan de Autoriteit Financiële Markten.

      5 Een melding als bedoeld in het eerste tot en met vierde lid wordt ondertekend door ten minste een van de personen
      die het dagelijks beleid van de accountantsorganisatie, auditorganisatie van een derde land onderscheidenlijk het
      auditkantoor bepalen.


