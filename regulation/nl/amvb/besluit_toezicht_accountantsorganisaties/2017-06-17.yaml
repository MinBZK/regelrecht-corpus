  - number: '9'
    text: |-
      Een accountantsorganisatie houdt zich aan de verordeningen en nadere voorschriften die krachtens
      [artikel 19, tweede lid, aanhef en onderdeel b, van de Wet op het accountantsberoep][ref1] zijn vastgesteld en die
      nadere regels stellen terzake van de in dit hoofdstuk geregelde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel19
    url: https://wetten.overheid.nl/BWBR0020184/2017-06-17#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '19'
  - number: 9a
    text: |-
      1 De accountantsorganisatie evalueert jaarlijks het stelsel van kwaliteitsbeheersing, bedoeld in
      [artikel 8a][ref1], en voldoet daarbij aan artikel 24bis, eerste lid, onderdeel k, van de richtlijn opgenomen eisen
      met betrekking tot die evaluatie.

      2 De accountantsorganisatie evalueert de procedures en gedragslijnen en het beleid, bedoeld in
      [artikel 8, eerste lid, tweede volzin][ref2], en voldoet daarbij aan de in artikel 24bis, eerste lid, onderdeel k,
      van de richtlijn opgenomen eisen met betrekking tot die evaluatie.


      [ref1]: https://wetten.overheid.nl/BWBR0020184#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0020184#Artikel8
