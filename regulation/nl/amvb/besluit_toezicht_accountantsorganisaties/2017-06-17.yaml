  - number: '2'
    text: |-
      1 Een aanvraag van een vergunning als bedoeld in [artikel 5 van de wet][ref1] wordt schriftelijk ingediend en bevat
      de volgende gegevens en bescheiden:

      a. de datum van de aanvraag;

      b. de naam, het adres en de vestigingsplaats of de woonplaats van de aanvrager;

      c. de contactgegevens, de contactpersoon en, indien aanwezig, het internetadres van de aanvrager;

      d. de rechtsvorm van de aanvrager;

      e. een beschrijving van de juridische en organisatorische structuur van de aanvrager;

      f. de statuten of overeenkomsten waarin de juridische en organisatorische structuur van de aanvrager zijn
      vastgelegd;

      g. indien van toepassing: een opgave van het nummer van inschrijving in het handelsregister;

      h. de namen, adressen en vestigingsplaatsen van alle vestigingen van de aanvrager;

      i. de naam en het zakelijk adres van alle natuurlijke personen die, door middel van middellijk of onmiddellijk
      aandeelhouderschap of op andere wijze, economisch middellijk of onmiddellijk eigenaar van de aanvrager zijn;

      j. indien de aanvrager een vennootschap of maatschap is: de naam, het zakelijk adres en de woonplaats of
      vestigingsplaats van alle natuurlijke personen die middellijk of onmiddellijk partij zijn bij de overeenkomst van
      maatschap of vennootschap;

      k. de naam, het woonadres, het zakelijk adres, en, voor zover van toepassing, het inschrijvingsnummer bij een
      beroepsorganisatie van alle personen die het dagelijks beleid van de aanvrager bepalen of mede bepalen en de naam
      van die organisatie;

      l. de naam, het woonadres, het zakelijk adres en de vestigingsplaats of de woonplaats van alle leden van het
      toezichthoudende orgaan van de aanvrager, of bij afwezigheid daarvan, van enig ander orgaan dat toezicht houdt op
      het bestuur van de aanvrager;

      m. indien de aanvrager deel uitmaakt van een netwerk:

      1°. een beschrijving van de juridische en organisatorische structuur van het netwerk; en

      2°. de namen, adressen en vestigingsplaatsen van de onderscheiden onderdelen van het netwerk, waaronder verbonden
      entiteiten; of

      3°. een verwijzing naar de plaats waar de in onderdeel 2° bedoelde informatie publiek toegankelijk is;

      n. de naam en het inschrijvingsnummer bij de beroepsorganisatie van alle externe accountants die de aanvrager doet
      inschrijven in het register, bedoeld in [artikel 11 van de wet][ref2], alsmede of deze externe accountants bij de
      aanvrager werkzaam zijn, dan wel aan hem zijn verbonden;

      o. indien een externe accountant als bedoeld in onderdeel n, is ingeschreven in de registers van andere
      toezichthoudende instanties: de naam van de toezichthoudende instanties en, indien van toepassing, het
      inschrijvingsnummer;

      p. indien de aanvrager is ingeschreven als auditkantoor of auditorganisatie van een derde land in de registers van
      toezichthoudende instanties in lidstaten: de naam van de toezichthoudende instanties en, indien van toepassing,
      het inschrijvingsnummer;

      q. indien de aanvrager is ingeschreven in de registers van toezichthoudende instanties in staten die geen lidstaat
      zijn: de naam van de toezichthoudende instanties en, indien van toepassing, het inschrijvingsnummer; en

      r. het aantal wettelijke controles dat de aanvrager gedurende een periode van twaalf maanden vanaf het tijdstip
      van de aanvraag voornemens is te verrichten bij organisaties van openbaar belang of andere ondernemingen of
      instellingen.

      2 Indien een auditkantoor of accountantsorganisatie middellijk of onmiddellijk aandeelhouder of anderszins eigenaar
      is van een aanvrager als bedoeld in het eerste lid, is het eerste lid, onderdelen i en j, niet van toepassing op
      de natuurlijke personen die middellijk of onmiddellijk aandeelhouder, partij bij de overeenkomst van maatschap of
      vennootschap of op andere wijze economisch eigenaar zijn van dat auditkantoor of die accountantsorganisatie. In
      dat geval bevat de aanvraag, bedoeld in het eerste lid, de naam, het adres en vestigingsplaats van het auditkantoor
      dat of de accountantsorganisatie die middellijk of onmiddellijk aandeelhouder of anderszins eigenaar is van de
      aanvrager.

      3 Desgevraagd verstrekt de aanvrager aan de Autoriteit Financiële Markten tevens overige gegevens en bescheiden die
      naar het oordeel van de Autoriteit Financiële Markten nodig zijn in het belang van de beoordeling van de aanvraag.

      4 Voor een aanvraag als bedoeld in het eerste lid wordt gebruik gemaakt van door de Autoriteit Financiële Markten
      voorgeschreven formulieren.

      5 Een aanvraag als bedoeld in het eerste lid wordt ondertekend door tenminste een van de personen die het dagelijks
      beleid van een accountantsorganisatie bepalen.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel11
