  - number: 2b
    text: |-
      1 Een aanvraag tot inschrijving in het register als bedoeld in [artikel 12e, tweede lid, van de wet][ref1], wordt
      schriftelijk ingediend en bevat de volgende gegevens:

      a. de datum van de aanvraag;

      b. de naam, het adres en de vestigingsplaats of de woonplaats van de aanvrager;

      c. de contactgegevens, de contactpersoon en, indien aanwezig, het internetadres van de aanvrager;

      d. de rechtsvorm van de aanvrager;

      e. de namen, adressen en vestigingsplaatsen van alle vestigingen van de aanvrager;

      f. de naam en het inschrijfnummer bij de beroepsorganisatie of bij een daarmee vergelijkbare organisatie in het
      buitenland van alle externe accountants die bij de aanvrager werkzaam zijn dan wel aan hem zijn verbonden en die
      de aanvrager doet inschrijven in het register als bedoeld in [artikel 11 van de wet][ref2] en de naam van die
      organisatie;

      g. de naam en het zakelijk adres van alle personen die als vennoot of anderszins aan het auditkantoor verbonden
      zijn;

      h. de naam en het zakelijk adres van alle natuurlijke personen die, door middel van middellijk of onmiddellijk
      aandeelhouderschap of op andere wijze, economisch middellijk of onmiddellijk eigenaar van de aanvrager zijn;

      i. de naam en het zakelijk adres en, voor zover van toepassing, het inschrijfnummer bij de beroepsorganisatie
      of bij een daarmee vergelijkbare organisatie in het buitenland van alle personen die het dagelijks beleid van de
      aanvrager bepalen of mede bepalen en de naam van die organisatie;

      j. indien de aanvrager deel uitmaakt van een netwerk:

      1°. een beschrijving van de juridische en organisatorische structuur van het netwerk; en

      2°. de namen, adressen en vestigingsplaatsen van de onderscheiden onderdelen van het netwerk, waaronder verbonden
      entiteiten; of

      3°. een verwijzing naar de plaats waar de onder 2° bedoelde informatie voor het publiek toegankelijk is;

      k. de naam van de toezichthoudende instanties van de lidstaat waar het auditkantoor is toegelaten tot het
      verrichten van controles als bedoeld in artikel 2, onderdeel 1, van de richtlijn en, indien van toepassing, het
      inschrijvingsnummer;

      l. indien de aanvrager is ingeschreven in de registers van toezichthoudende instanties in staten die geen lidstaat
      zijn: de naam van de toezichthoudende instanties en, indien van toepassing, het inschrijvingsnummer.

      2 Desgevraagd verstrekt de aanvrager aan de Autoriteit Financiële Markten tevens overige gegevens en bescheiden die
      naar het oordeel van de Autoriteit Financiële Markten nodig zijn in het belang van de beoordeling van de aanvraag,
      bedoeld in het eerste lid.

      3 Voor een aanvraag als bedoeld in het eerste lid wordt gebruik gemaakt van door de Autoriteit Financiële Markten
      voorgeschreven formulieren.

      4 Een aanvraag als bedoeld in het eerste lid wordt ondertekend door ten minste een van de personen die het
      dagelijks beleid van het auditkantoor bepalen.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel12e
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel11
