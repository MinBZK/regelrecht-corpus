  - number: '5'
    text: |-
      1 Een accountantsorganisatie die voornemens is een persoon te benoemen in een functie waarbij deze persoon het
      dagelijks beleid van de accountantsorganisatie zal bepalen of medebepalen, gaat daartoe niet over dan nadat de
      Autoriteit Financiële Markten diens betrouwbaarheid heeft beoordeeld en heeft meegedeeld dat deze buiten twijfel
      staat.

      2 Een accountantsorganisatie met een vergunning die mede strekt tot het verrichten van wettelijke controles bij
      organisaties van openbaar belang, die voornemens is een natuurlijk persoon te benoemen in een functie waarbij
      deze persoon het dagelijks beleid van de accountantsorganisatie zal bepalen, gaat daartoe niet over dan nadat de
      Autoriteit Financiële Markten heeft vastgesteld dat deze persoon geschikt is.

      3 Indien een accountantsorganisatie als bedoeld in het tweede lid onderdeel uitmaakt van een netwerk, gaat het
      binnen het netwerk hiërarchisch hoogste netwerkonderdeel met zetel in Nederland dat invloed uitoefent op het
      beleid van de accountantsorganisatie dat voornemens is een natuurlijk persoon te benoemen in een functie waarbij
      deze persoon het dagelijks beleid van dit netwerkonderdeel zal bepalen, daartoe niet over dan nadat de Autoriteit
      Financiële Markten heeft vastgesteld dat deze persoon geschikt is.

      4 Een accountantsorganisatie als bedoeld in het tweede lid of het hiërarchisch hoogste netwerkonderdeel, bedoeld
      in het derde lid, die of dat voornemens is een natuurlijk persoon te benoemen die deel uit zal gaan maken van het
      orgaan dat belast is met het interne toezicht, gaat daartoe niet over dan nadat de Autoriteit Financiële Markten
      heeft vastgesteld dat deze persoon geschikt is.
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel5
  - number: '6'
    text: |-
      De betrouwbaarheid van een persoon die het beleid van een accountantsorganisatie bepaalt of mede bepaalt, staat
      buiten twijfel wanneer dat eenmaal door de Autoriteit Financiële Markten of De Nederlandsche Bank NV is vastgesteld
      voor de toepassing van enige wet, zolang niet een wijziging in de relevante feiten of omstandigheden een aanleiding
      geeft tot een nieuwe beoordeling.
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel6
  - number: '7'
    text: |-
      Indien een accountantsorganisatie in het kader van haar normale bedrijfsvoering vaststelt dat zich een wijziging
      heeft voorgedaan in de gegevens, bedoeld in [artikel 2, derde lid][ref1], die nodig zijn in het belang van de
      beoordeling van de betrouwbaarheid van een persoon als bedoeld in [artikel 6][ref2], meldt zij dit onverwijld
      schriftelijk aan de Autoriteit Financiële Markten.


      [ref1]: https://wetten.overheid.nl/BWBR0020184#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020184#Artikel6
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel7
