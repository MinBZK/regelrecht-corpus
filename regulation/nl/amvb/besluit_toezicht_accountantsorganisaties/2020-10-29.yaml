  - number: 34f
    text: |-
      1 Bij de vervulling van hun taak richten de leden van het orgaan belast met het interne toezicht zich naar het
      belang van de accountantsorganisatie en de met haar verbonden onderneming en het publieke belang om de kwaliteit
      van wettelijke controles te borgen.

      2 Indien het stelsel van intern onafhankelijk toezicht overeenkomstig [artikel 22a, tweede lid, van de wet][ref1]
      is ingericht, richten de leden van het orgaan belast met het interne toezicht zich bij de vervulling van hun taak
      mede naar het belang van de accountantsorganisatie, de met haar verbonden onderneming en het publieke belang om de
      kwaliteit van wettelijke controles te borgen.

      3 Een lid van het orgaan belast met het interne toezicht neemt niet deel aan de beraadslaging en de besluitvorming
      indien hij daarbij een direct of indirect persoonlijk belang heeft dat tegenstrijdig is met het belang, bedoeld in
      het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel22a
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel34f
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: 22a
  - number: 34g
    text: |-
      1 De personen die het dagelijks beleid van de accountantsorganisatie bepalen, en, indien van toepassing,
      de personen die het dagelijks beleid bepalen van het hiërarchisch hoogste netwerkonderdeel, bedoeld in
      [artikel 22a, tweede lid, van de wet][ref1], verschaffen het orgaan belast met het interne toezicht tijdig alle
      voor de uitoefening van diens taken en bevoegdheden noodzakelijke gegevens.

      2 De personen, bedoeld in het eerste lid, verstrekken in ieder geval gegevens met betrekking tot:

      a. de werking van het beleid van de accountantsorganisatie ten aanzien van het stelsel van kwaliteitsbeheersing,
      bedoeld in [artikel 8, eerste lid][ref2];

      b. de hoofdlijnen van het strategisch beleid van de accountantsorganisatie in Nederland;

      c. de algemene en financiële risico’s met betrekking tot de accountantsorganisatie;

      d. het beheers- en controlesysteem van de accountantsorganisatie;

      e. incidenten betreffende de accountantsorganisatie als bedoeld in [artikel 32, tweede lid][ref3];

      f. klachten tegen medewerkers van de accountantsorganisatie ingevolge
      [artikel 22 van de Wet tuchtrechtspraak accountants][ref4];

      g. de bevindingen en conclusies van onderzoeken naar de accountantsorganisatie verricht door de Autoriteit
      Financiële Markten;

      h. voornemens van de Autoriteit Financiële Markten om maatregelen te treffen tegen de accountantsorganisatie;

      i. handhavingsbesluiten van de Autoriteit Financiële Markten tegen de accountantsorganisatie.

      3 De accountantsorganisatie zorgt ervoor dat haar medewerkers en haar externe adviseurs gegevens verstrekken aan
      het orgaan belast met het interne toezicht, indien het orgaan om deze gegevens verzoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel22a
      [ref2]: https://wetten.overheid.nl/BWBR0020184#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0020184#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0024238#Artikel22
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel34g
