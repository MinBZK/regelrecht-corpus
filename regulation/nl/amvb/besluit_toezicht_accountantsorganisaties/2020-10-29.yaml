  - number: 38b
    text: |-
      1 De externe accountant betrekt in zijn beslissing op grond van [artikel 38a, eerste lid, onderdeel b of d][ref1],
      om al dan niet over te gaan tot het verstrekken van vertrouwelijke gegevens of inlichtingen:

      a. de belangen van betrokken partijen en derden, waaronder het maatschappelijk belang;

      b. de betrouwbaarheid, volledigheid en onderbouwing van de betreffende gegevens of inlichtingen; en

      c. de wijze waarop en aan wie de vertrouwelijke gegevens of inlichtingen worden verstrekt.

      2 De externe accountant legt de overwegingen die hebben geleid tot de in het eerste lid bedoelde beslissing vast.

      3 Een externe accountant verstrekt geen vertrouwelijke gegevens of inlichtingen aan toezichthoudende instanties.


      [ref1]: https://wetten.overheid.nl/BWBR0020184#Artikel38a
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel38b
