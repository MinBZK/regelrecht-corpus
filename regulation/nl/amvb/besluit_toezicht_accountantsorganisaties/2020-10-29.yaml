  - number: 1a
    text: |-
      Als organisaties van openbaar belang als bedoeld in
      [artikel 1, eerste lid, onderdeel l, onder 5°, van de wet][ref1] zijn aangewezen:

      a. netbeheerders als bedoeld in [artikel 1, eerste lid, onderdeel k, van de Elektriciteitswet 1998][ref2] of
      [artikel 1, eerste lid, onderdeel e, van de Gaswet][ref3];

      b. toegelaten instellingen als bedoeld in [artikel 1 van de Woningwet][ref4], eerste lid, die op twee opeenvolgende
      balansdata, zonder onderbreking nadien op twee opeenvolgende balansdata, meer dan 5.000 verhuureenheden bezitten;

      c. de instellingen voor wetenschappelijk onderzoek, genoemd in
      [artikel 1.16 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref5]
      en de Nederlandse organisatie voor wetenschappelijk onderzoek, genoemd in
      [artikel 2, eerste lid, van de Wet op de Nederlandse organisatie voor wetenschappelijk onderzoek][ref6]; en

      d. pensioenfondsen die op twee opeenvolgende balansdata, zonder onderbreking nadien
      op twee opeenvolgende balansdata, kwalificeren als grote fondsen als bedoeld in
      __REF000___________________________________________________________________________________________________________
