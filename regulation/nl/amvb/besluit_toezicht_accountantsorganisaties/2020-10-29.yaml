  - number: '25'
    text: |-
      Een accountantsorganisatie zorgt voor een zorgvuldige afhandeling en vastlegging van klachten over de uitvoering
      van wettelijke controles.
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel25
  - number: '26'
    text: |-
      1 Indien bij de accountantskamer te Zwolle een tuchtprocedure aanhangig is gemaakt tegen een bij de
      accountantsorganisatie werkzame of daaraan verbonden externe accountant, meldt de accountantsorganisatie
      dat aan de Autoriteit Financiële Markten, binnen een week nadat de accountantsorganisatie hiervan kennis
      heeft genomen, onder vermelding van de naam en het inschrijvingsnummer bij de beroepsorganisatie van de
      desbetreffende externe accountant of, indien de externe accountant een wettelijke auditor als bedoeld in
      [artikel 27, eerste lid, van de wet][ref1] is, de naam en het inschrijvingsnummer bij de met de beroepsorganisatie
      vergelijkbare organisatie van de lidstaat waarin hij is toegelaten.

      2 De in het eerste lid bedoelde melding kan achterwege blijven indien de Autoriteit Financiële Markten degene is
      die de in het eerste lid bedoelde tuchtprocedure aanhangig heeft gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel27
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '27'
  - number: '27'
    text: |-
      De eigenaars of aandeelhouders van een accountantsorganisatie, de personen die het dagelijks beleid van een
      accountantsorganisatie bepalen of mede bepalen, het toezichthoudende orgaan van een accountantsorganisatie, of
      een met een accountantsorganisatie verbonden entiteit, hebben geen zodanige bemoeienis met de uitvoering van de
      wettelijke controle door die accountantsorganisatie dat daardoor afbreuk wordt gedaan aan de onafhankelijkheid
      en objectiviteit van de externe accountant die namens de betrokken accountantsorganisatie de wettelijke controle
      verricht.
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel27
  - number: '28'
    text: |-
      Een accountantsorganisatie zorgt ervoor dat de bij haar werkzame of aan haar verbonden externe accountants haar ten
      minste eenmaal per jaar schriftelijk:

      a. bevestigen dat zij de bij en krachtens de wet en de [Wet op het accountantsberoep][ref1] gestelde regels inzake
      onafhankelijkheid naleven; en

      b. informeren over bedreigingen ter zake van hun onafhankelijkheid.


      [ref1]: https://wetten.overheid.nl/BWBR0032573
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0032573
  - number: '29'
    text: |-
      1 Een accountantsorganisatie ontvangt geen vergoeding voor de uitvoering van een wettelijke controle waarbij het
      bedrag van de vergoeding afhankelijk is gesteld van:

      a. aanvullende diensten die zij verleent aan de controlecliënt; of

      b. de strekking van de af te geven accountantsverklaring.

      2 De accountantsorganisatie komt de grondslag voor de berekening van de vergoeding voor iedere wettelijke controle
      elk jaar van tevoren met de controlecliënt overeen.
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel29
  - number: 30a
    text: |-
      1 Een accountantsorganisatie geniet of bezit geen materieel of financieel belang in een controlecliënt waarvan
      zij de wettelijke controle verricht en koopt of verkoopt geen financiële instrumenten die door die controlecliënt
      worden uitgegeven, gegarandeerd of anderzijds ondersteund.

      2 Het in het eerste lid opgenomen verbod is niet van toepassing, indien sprake is van de in artikel 22, tweede lid,
      van de richtlijn genoemde uitzondering daarop.
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel30a
  - number: 30b
    text: |-
      1 Een accountantsorganisatie oefent geen invloed uit op de uitkomst van een wettelijke controle, indien:

      a. zij financiële instrumenten van de controlecliënt bezit of financiële instrumenten als bedoeld in artikel 22,
      vierde lid, onderdeel b, van de richtlijn bezit van een entiteit die met die cliënt verbonden is;

      b. zij met de controlecliënt een dienstverband als bedoeld in [artikel 19, tweede lid, van de wet][ref1] onderhoudt
      dat of relatie als bedoeld in artikel 19, tweede lid, van de wet onderhoudt die de onafhankelijkheid beïnvloedt.

      2 Het eerste lid, onderdeel a, is niet van toepassing indien sprake is van de in artikel 22, vierde lid, onderdeel
      b, van de richtlijn genoemde uitzondering.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel19
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel30b
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '19'
  - number: 30c
    text: |-
      Een accountantsorganisatie vraagt of accepteert geen geldelijke of andere geschenken van de controlecliënt of
      entiteiten die met de controlecliënt verbonden zijn, tenzij een objectieve, redelijke en geïnformeerde derde partij
      de waarde daarvan als verwaarloosbaar of onbeduidend zou beschouwen.
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel30c
  - number: 30d
    text: |-
      Een accountantsorganisatie zorgt ervoor dat haar werknemers en andere in artikel 22, tweede lid, van de richtlijn
      genoemde personen geen:

      a. materieel of financieel belang bezitten in de zin van [artikel 30a][ref1];

      b. invloed uitoefenen in de zin van [30b][ref2];

      c. geldelijke of andere geschenken vragen of accepteren in de zin van [30c][ref3];

      d. dienstverband bij de controlecliënt hebben of hebben gehad in de zin van artikel 22, vierde lid, onder c, van
      de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020184#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0020184#Artikel30b
      [ref3]: https://wetten.overheid.nl/BWBR0020184#Artikel30c
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel30d
    references:
      - id: ref1
        bwb_id: BWBR0020184
        artikel: 30a
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020184
        artikel: 30b
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0020184
        artikel: 30c
        hoofdstuk: '6'
  - number: '31'
    text: |-
      Een accountantsorganisatie houdt zich aan de verordeningen en nadere voorschriften die krachtens
      [artikel 19, tweede lid, aanhef en onderdeel b, van de Wet op het accountantsberoep][ref1] zijn vastgesteld en die
      nadere regels stellen ter zake van de in dit hoofdstuk geregelde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel19
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '19'
  - number: 31a
    text: Een accountantsorganisatie verstrekt geen vertrouwelijke gegevens of inlichtingen aan toezichthoudende instanties.
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel31a
  - number: '32'
    text: |-
      1 Een accountantsorganisatie heeft een beleid dat ertoe strekt dat de betrokkenheid van de accountantsorganisatie
      en haar medewerkers wordt voorkomen bij strafbare feiten en wetsovertredingen die het vertrouwen in de
      accountantsorganisatie of in de financiële markten kunnen schaden. Gedragslijnen en procedures ter waarborging van
      de naleving van [artikel 27][ref1] maken onderdeel uit van dit beleid.

      2 Een accountantsorganisatie stelt procedures en regels vast ter zake van de omgang met en vastlegging van
      incidenten die ernstige gevolgen hebben voor de integere uitoefening van haar bedrijf.

      3 Een accountantsorganisatie neemt naar aanleiding van een incident als bedoeld in het tweede lid passende
      maatregelen. Deze maatregelen zijn gericht op het beheersen van de als gevolg van het incident opgetreden risico’s
      en op het voorkomen van herhaling.

      4 Een accountantsorganisatie informeert de Autoriteit Financiële Markten onverwijld omtrent de in het tweede lid
      bedoelde incidenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020184#Artikel27
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0020184
        artikel: '27'
        hoofdstuk: '6'
  - number: '33'
    text: |-
      1 De administratieve vastlegging van incidenten als bedoeld in [artikel 32, tweede lid][ref1], omvat ten minste de
      feiten en omstandigheden van het incident, de gegevens over degene of degenen die bij het incident zijn betrokken
      en de maatregelen die naar aanleiding van het incident zijn genomen.

      2 Een accountantsorganisatie bewaart de in het eerste lid bedoelde gegevens gedurende ten minste zeven jaren nadat
      zij zijn vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020184#Artikel32
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel33
