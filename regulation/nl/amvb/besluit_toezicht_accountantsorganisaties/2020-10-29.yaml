        bwb_id: BWBR0020184
        artikel: '32'
        hoofdstuk: '7'
  - number: '34'
    text: |-
      Een accountantsorganisatie houdt zich aan de verordeningen en nadere voorschriften die krachtens
      [artikel 19, tweede lid, aanhef en onderdeel b, van de Wet op het accountantsberoep][ref1] zijn vastgesteld en die
      nadere regels stellen ter zake van de in dit hoofdstuk geregelde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel19
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '19'
  - number: 34a
    text: |-
      Dit hoofdstuk is van toepassing op accountantsorganisaties met een vergunning die mede strekt tot het verrichten
      van wettelijke controles bij organisaties van openbaar belang.
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel34a
  - number: 34b
    text: |-
      Een accountantsorganisatie als bedoeld in [artikel 34a][ref1] richt het stelsel van intern onafhankelijk toezicht,
      bedoeld in [artikel 22a van de wet][ref2], in overeenkomstig dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0020184#Artikel34a
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel22a
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel34b
    references:
      - id: ref1
        bwb_id: BWBR0020184
        artikel: 34a
        hoofdstuk: 7a
      - id: ref2
        bwb_id: BWBR0019468
        artikel: 22a
  - number: 34c
    text: |-
      1 Het orgaan belast met het interne toezicht stelt een profielschets vast voor zijn omvang en samenstelling,
      waarbij ten minste rekening gehouden wordt met de aard van de accountantsorganisatie, haar activiteiten en de
      gewenste deskundigheid, ervaring en achtergrond van de leden.

      2 De leden van het orgaan belast met het interne toezicht:

      a. zijn gedurende drie jaar voorafgaande aan de aanvaarding van hun functie niet werkzaam geweest voor of hebben
      geen deel uitgemaakt van de dagelijkse leiding of het bestuur van de accountantsorganisatie of het hiërarchisch
      hoogste netwerkonderdeel, bedoeld in [artikel 22a, tweede lid, van de wet][ref1];

      b. hebben in de drie aan de aanvaarding van de functie voorafgaande jaren geen stemrechten of financiële
      belangen in de accountantsorganisatie of het hiërarchisch hoogste netwerkonderdeel, bedoeld in
      [artikel 22a, tweede lid van de wet][ref2], gehouden;

      c. houden gedurende de periode dat zij lid zijn van het orgaan geen stemrechten of financiële
      belangen in de accountantsorganisatie of het hiërarchisch hoogste netwerkonderdeel, bedoeld in
      [artikel 22a, tweede lid van de wet][ref3].

      3 De onderdelen a en b van het tweede lid zijn niet van toepassing op de persoon, bedoeld in
      [artikel 22a, vijfde lid, van de wet][ref4].

      4 De taakverdeling binnen het orgaan belast met het interne toezicht en de werkwijze van het orgaan worden
      neergelegd in een reglement dat openbaar wordt gemaakt op de website van de accountantsorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel22a
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel22a
      [ref3]: https://wetten.overheid.nl/BWBR0019468#Artikel22a
      [ref4]: https://wetten.overheid.nl/BWBR0019468#Artikel22a
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel34c
