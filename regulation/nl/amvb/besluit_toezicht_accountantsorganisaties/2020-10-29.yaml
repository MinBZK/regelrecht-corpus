        artikel: '22'
  - number: 34h
    text: |-
      1 Het orgaan belast met het interne toezicht voert ten minste eenmaal per jaar een evaluatie uit. Deze evaluatie
      vindt plaats buiten de aanwezigheid van de personen die het dagelijks beleid bepalen van de accountantsorganisatie
      en, indien van toepassing, de personen die het dagelijks beleid bepalen van het hiërarchisch hoogste
      netwerkonderdeel, bedoeld in [artikel 22a, tweede lid, van de wet][ref1].

      2 De evaluatie omvat ten minste:

      a. het functioneren van het orgaan en van de individuele leden;

      b. zaken die zich in de praktijk hebben voorgedaan waaruit lessen kunnen worden getrokken;

      c. het gewenste profiel, de samenstelling en de competenties van het orgaan; en

      d. het functioneren van de personen die het dagelijks beleid bepalen, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel22a
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel34h
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: 22a
  - number: 34i
    text: |-
      1 Het orgaan belast met het interne toezicht stelt jaarlijks een verslag op. Dit verslag wordt, tegelijk met de
      publicatie van het transparantieverslag, bedoeld in artikel 13 van de EU-verordening, geplaatst op de website van
      de accountantsorganisatie.

      2 Het verslag bevat ten minste de volgende informatie:

      a. hoe het orgaan zijn rol heeft ingevuld op alle aan het orgaan toegewezen taken en bevoegdheden;

      b. het aanwezigheidspercentage van de individuele leden van het orgaan belast met het interne toezicht bij
      vergaderingen van het orgaan;

      c. wat de belangrijkste inhoudelijke bevindingen, discussies en besluitvorming van het orgaan zijn;

      d. op welke wijze de evaluatie, bedoeld in [artikel 34h][ref1], heeft plaatsgevonden en op welke wijze opvolging
      wordt gegeven aan de conclusies van de evaluatie.


      [ref1]: https://wetten.overheid.nl/BWBR0020184#Artikel34h
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel34i
    references:
      - id: ref1
        bwb_id: BWBR0020184
        artikel: 34h
        hoofdstuk: 7a
  - number: '35'
    text: |-
      Een externe accountant houdt zich aan de verordeningen en nadere voorschriften die krachtens
      [artikel 19, eerste lid, van de Wet op het accountantsberoep][ref1] zijn vastgesteld en die nadere regels
      stellen ter zake van zijn vakbekwaamheid, onafhankelijkheid, objectiviteit professioneel-kritische instelling en
      integriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel19
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '19'
  - number: '36'
    text: |-
      Onder fraude van materieel belang als bedoeld in [artikel 26, derde lid, van de wet][ref1] wordt verstaan een
      opzettelijk handelen of nalaten waarbij misleiding wordt gebruikt om een wederrechtelijk voordeel te behalen en
      waarbij de aard of de omvang zodanig is dat beslissingen die in het maatschappelijk verkeer worden genomen op grond
      van de financiële verantwoording van de controlecliënt zouden kunnen worden beïnvloed door die misleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel26
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '26'
  - number: '37'
    text: |-
      1 Een melding als bedoeld in [artikel 26, tweede lid, van de wet][ref1] kan achterwege blijven, indien:

      a. de controlecliënt, nadat de externe accountant hem heeft gewezen op zijn redelijk vermoeden van fraude van
      materieel belang, daarnaar onverwijld onderzoek verricht of doet verrichten en op basis daarvan een schriftelijk
      plan opstelt waarin zijn opgenomen:

      1°. de maatregelen die de controlecliënt zal nemen om de gevolgen van de fraude, voor zover mogelijk, ongedaan te
      maken en om herhaling van zodanige fraude te voorkomen; en

      2°. de termijn waarbinnen de controlecliënt de maatregelen zal hebben uitgevoerd;

      b. de externe accountant, binnen vier weken nadat het plan is opgesteld, heeft geoordeeld dat het in onderdeel a
      bedoelde plan toereikend is; en

      c. de externe accountant heeft vastgesteld dat de controlecliënt binnen de in onderdeel a, onder 2°, bedoelde
      termijn de in het plan opgenomen maatregelen in voldoende mate heeft uitgevoerd.

      2 De externe accountant legt zijn oordeel, bedoeld in het eerste lid, onderdeel b, en zijn vaststelling, bedoeld in
      het eerste lid, onderdeel c, vast.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel26
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '26'
  - number: '38'
    text: |-
      Een externe accountant meldt, indien [artikel 37][ref1] geen toepassing vindt, schriftelijk de volgende gegevens
      aan de in [artikel 26 van de wet][ref2] bedoelde opsporingsambtenaar:

      a. de naam, het adres en de vestigingsplaats van de controlecliënt;

      b. de naam, het adres en de vestigingsplaats van de accountantsorganisatie waarbij de externe accountant werkzaam
      is of waaraan hij is verbonden;

      c. de naam van de externe accountant;

      d. de datum van de melding; en

      e. een omschrijving van de aard van de vermoedelijke fraude van materieel belang.


      [ref1]: https://wetten.overheid.nl/BWBR0020184#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel26
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel38
