  - number: '13'
    text: |-
      1 Een accountantsorganisatie beëindigt een opdracht tot het verrichten van een wettelijke controle, indien na
      aanvaarding of continuering ervan:

      a. informatie bekend wordt die, was zij haar bekend geweest op het moment van aanvaarding of continuering
      van de opdracht, ertoe zou hebben geleid dat de opdracht niet dan wel in gewijzigde vorm zou zijn aanvaard of
      gecontinueerd, tenzij deze in gewijzigde vorm kan worden voortgezet;

      b. de controlecliënt wordt overgenomen door, fuseert met of het eigendom verwerft van een andere entiteit en
      niet wordt voldaan of kan worden voldaan aan de in artikel 22, zesde lid, van de richtlijn opgenomen eisen met
      betrekking tot de identificatie en evaluatie van die belangen en de naar aanleiding daarvan te nemen maatregelen.

      2 De accountantsorganisatie legt de in het eerste lid bedoelde beslissing vast, met inbegrip van de daaraan ten
      grondslag liggende overwegingen.

      3 Onverminderd [artikel 393, tweede lid, laatste volzin, van Boek 2 van het Burgerlijk Wetboek][ref1] zorgt de
      accountantsorganisatie ervoor dat de tussentijdse beëindiging dan wel de intrekking van een opdracht tot het
      verrichten van een wettelijke controle door de voor de controle verantwoordelijke externe accountant wordt gemeld
      aan de Autoriteit Financiële Markten, indien bekend onder opgave van een afdoende motivering daarvoor.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '14'
    text: |-
      1 Een accountantsorganisatie wijst voor de uitvoering van elke opdracht tot het verrichten van een wettelijke
      controle een externe accountant aan die bevoegd is tot het uitvoeren van die wettelijke controle.

      2 Borging van de kwaliteit van de wettelijke controle, de onafhankelijkheid en de bekwaamheid is voor de
      accountantsorganisatie het belangrijkste criterium bij de selectie van de externe accountant, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel14
  - number: '15'
    text: |-
      Een accountantsorganisatie stelt de benodigde tijd en middelen en het benodigde gekwalificeerde personeel aan de
      externe accountant beschikbaar, opdat hij zijn taak naar behoren kan uitvoeren.
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel15
  - number: 15a
    text: |-
      1 Een accountantsorganisatie die een wettelijke controle verricht van een geconsolideerde jaarrekening van een
      groep ondernemingen of instellingen, zorgt ervoor dat de groepsaccountant op basis van adequate informatie:

      a. een controleverklaring afgeeft die voldoet aan daarvoor in artikel 28 van de richtlijn opgenomen eisen en,
      indien de controlecliënt een organisatie van openbaar belang is, een controleverklaring afgeeft die eveneens
      voldoet aan de daar in artikel 10 van de verordening opgenomen eisen en daarnaast de in artikel 11 van de
      verordening bedoelde aanvullende verklaring aan de auditcommissie verstrekt;

      b. de controlewerkzaamheden evalueert in overeenstemming met daarvoor in artikel 27, eerste lid, van de richtlijn
      opgenomen eisen;

      c. in overeenstemming met artikel 27, eerste, onderdeel c, van de richtlijn beschikt over de in dat onderdeel
      genoemde informatie en documenten of, indien hij hieraan niet kan voldoen, passende maatregelen als bedoeld in
      artikel 27, tweede lid, van de richtlijn neemt en deze maatregelen meldt aan de Autoriteit Financiële Markten.

      2 Met het oog op de verstrekking van gegevens of inlichtingen aan de Autoriteit Financiële Markten in het kader
      van een kwaliteitsbeoordeling of een onderzoek naar de controle van een geconsolideerde jaarrekening, zorgt de
      accountantsorganisatie ervoor dat de groepsaccountant voldoet aan de daarvoor in artikel 27, derde lid, van de
      richtlijn opgenomen eisen.

      3 De accountantsorganisatie stelt passende procedures vast om te kunnen voldoen aan het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel15a
  - number: '17'
    text: |-
      1 Een accountantsorganisatie zorgt ervoor dat een externe accountant ten behoeve van de uitvoering van een
      wettelijke controle zonodig advies vraagt aan vakbekwame personen.

      2 De accountantsorganisatie zorgt ervoor dat de externe accountant het onderwerp van de adviesaanvraag en het
      verkregen advies vastlegt.
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel17
  - number: '18'
    text: |-
      1 Een accountantsorganisatie stelt toetsingscriteria op aan de hand waarvan zij vaststelt voor welke andere
      wettelijke controles dan die bij organisaties van openbaar belang een opdrachtgerichte kwaliteitsbeoordeling
      plaatsvindt. De opdrachtgerichte kwaliteitsbeoordeling vindt plaats voordat een accountantsverklaring als bedoeld
      in [artikel 1 van de wet][ref1] wordt afgegeven, om na te gaan of de externe accountant redelijkerwijs tot het
      oordeel en de conclusies kan zijn gekomen die zijn verwoord in het ontwerp van die accountantsverklaring.

      2 De opdrachtgerichte kwaliteitsbeoordeling wordt uitgevoerd overeenkomstig artikel 8, tweede lid, derde lid,
      tweede en derde volzin, en vierde tot en met zevende lid, van de verordening, met dien verstande dat de beoordeling
      ook mag worden uitgevoerd door een beoordelaar die:

      a. accountant is ten aanzien van wie in het accountantsregister een aantekening is opgenomen als bedoeld in
      [artikel 36, tweede lid, onderdeel i, van de Wet op het accountantsberoep][ref2]; en

      b. voldoende bekwaam is en over voldoende relevante werkervaring beschikt om de desbetreffende wettelijke controle
      te beoordelen.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0032573#Artikel36
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0032573
        artikel: '36'
  - number: '22'
    text: Een accountantsorganisatie waarborgt de naleving van het stelsel van kwaliteitsbeheersing.
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel22
  - number: '23'
    text: |-
      1 Een accountantsorganisatie die wettelijke controles verricht bij organisaties van openbaar belang wijst
      een persoon aan die binnen de accountantsorganisatie toeziet op de naleving van de bij en krachtens de
      [artikelen 13 tot en met 24b van de wet][ref1] en bij de verordening gestelde regels. De accountantsorganisatie
      wijst eveneens een plaatsvervanger aan.

      2 De in het eerste lid bedoelde persoon legt aan de personen die het dagelijks beleid van de accountantsorganisatie
      bepalen verantwoording af omtrent zijn werkzaamheden en de uitkomsten daarvan.

      3 Indien de in het eerste lid bedoelde persoon is betrokken bij een opdracht tot het verrichten van een wettelijke
      controle, is het zijn plaatsvervanger die ter zake van die opdracht toeziet op de naleving van de in het eerste lid
      bedoelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel13
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '13'
  - number: '24'
    text: |-
      1 Een accountantsorganisatie zorgt voor een vastlegging van:

      a. een overzicht van de overtredingen van de bij en krachtens de [artikelen 13 tot en met 24b van de wet][ref1]
      en de bij de verordening gestelde regels, voor zover deze bekend zijn bij de in [artikel 23, eerste lid][ref2],
      bedoelde persoon of de personen die het dagelijks beleid van de accountantsorganisatie bepalen en hiervoor een
      boete kan worden opgelegd in de tweede of derde categorie dan wel sprake is van structurele overtredingen van
      dezelfde regel;

      b. een overzicht van de overtredingen van de bij of krachtens de [artikelen 25 tot en met 31 van de Wta][ref3]
      gestelde regels, voor zover deze bekend zijn bij de in [artikel 23, eerste lid][ref4], bedoelde persoon of de
      personen die het dagelijks beleid van de accountantsorganisatie bepalen en voor zover deze bekend zijn bij de in
      artikel 23, eerste lid, bedoelde persoon of de personen die het dagelijks beleid van de accountantsorganisatie
      bepalen en deze overtredingen geen kleine inbreuk als bedoeld in artikel 24, ter, derde lid, van de richtlijn zijn;

      c. maatregelen die de accountantsorganisatie heeft genomen jegens de medewerkers die bij de in onderdeel a of b
      bedoelde overtredingen betrokken zijn geweest, met inbegrip van de daaraan ten grondslag liggende overwegingen; en

      d. de door de accountantsorganisatie genomen maatregelen tot aanpassing van het stelsel van kwaliteitsbeheersing.

      2 De accountantsorganisatie stelt jaarlijks een verslag op met een overzicht van de in het eerste lid, onderdelen c
      en d, bedoelde maatregelen en de daaraan ten grondslag liggende overwegingen.

      3 De accountantsorganisatie deelt het verslag mede aan haar medewerkers.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0020184#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0019468#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0020184#Artikel23
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel24
