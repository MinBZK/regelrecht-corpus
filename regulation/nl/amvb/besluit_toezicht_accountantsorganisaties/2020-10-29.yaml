  - number: '8'
    text: |-
      1 Een accountantsorganisatie voert een beleid ten aanzien van het stelsel van kwaliteitsbeheersing. Dit beleid
      wordt in elk geval uitgewerkt in het stelsel van kwaliteitsbeheersing, bedoeld in [artikel 8a][ref1], Het beleid,
      bedoeld in [artikel 18b van de wet][ref2], maakt in elk geval onderdeel uit van het beleid ten aanzien van het
      stelsel van kwaliteitsbeheersing en voldoet aan artikel 24bis, eerste lid, onderdeel j, van de richtlijn.

      2 De accountantsorganisatie legt het beleid ten aanzien van het stelsel van kwaliteitsbeheersing schriftelijk vast.

      3 De accountantsorganisatie deelt het beleid ten aanzien van het stelsel van kwaliteitsbeheersing mede aan haar
      medewerkers en maakt dit voor hen toegankelijk.

      4 De accountantsorganisatie bewaart de schriftelijke vastlegging van het beleid ten aanzien van het stelsel van
      kwaliteitsbeheersing, bedoeld in het eerste lid, gedurende ten minste zeven jaren nadat het is vastgelegd of
      gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0020184#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel18b
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020184
        artikel: 8a
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: 18b
  - number: 8a
    text: |-
      1 Het stelsel van kwaliteitsbeheersing bevat onder andere procedures, beschrijvingen en standaarden als bedoeld in
      de [artikelen 11, tweede lid][ref1], en [16][ref2], die ten doel hebben de naleving door de accountantsorganisatie
      te waarborgen van de bij en krachtens de [artikelen 14 tot en met 24b van de wet][ref3] gestelde regels.
      Het stelsel van kwaliteitsbeheersing voldoet aan de in artikel 24bis, eerste lid, onderdelen b, c, e tot
      en met h, en tweede lid, van de richtlijn opgenomen eisen met betrekking tot de interne organisatie van de
      accountantsorganisatie.

      2 De accountantsorganisatie legt het stelsel van kwaliteitsbeheersing schriftelijk vast.

      3 De accountantsorganisatie informeert haar medewerkers over het stelsel van kwaliteitsbeheersing en maakt dit voor
      hen toegankelijk.

      4 De accountantsorganisatie bewaart de schriftelijke vastlegging van het stelsel van kwaliteitsbeheersing, bedoeld
      in het eerste lid, gedurende ten minste zeven jaren nadat het is vastgelegd of gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0020184#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0020184#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0019468#Artikel14
    url: https://wetten.overheid.nl/BWBR0020184/2020-10-29#Artikel8a
