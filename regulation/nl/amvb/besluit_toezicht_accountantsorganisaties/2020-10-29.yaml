  - number: '42'
    text: |-
      Het register, bedoeld in [artikel 11 van de wet][ref1], bevat de datum van de aanvraag, bedoeld in
      [artikel 80, tweede lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel11
