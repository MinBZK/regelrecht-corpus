  - number: 42a
    text: |-
      1 Op de wettelijke controle van een in [artikel 1a][ref1] aangewezen organisatie van openbaar belang,
      die betrekking heeft op een boekjaar dat is aangevangen voor het tijdstip van inwerkingtreding van
      [artikel I van het Besluit aanwijzing organisaties van openbaar belang][ref2], blijft het recht van toepassing
      zoals dat gold voor dat tijdstip.

      2 [Artikel 1a][ref3] is, voor zover het de op grond van [artikelen 23, onderdelen a en b][ref4], en
      [24 van de wet][ref5] op de wettelijke controle bij organisaties van openbaar belang voortvloeiende
      verplichtingen betreft, eerst van toepassing na verloop van 24 maanden na de inwerkingtreding van
      [artikel I van het Besluit aanwijzing organisaties van openbaar belang][ref6].

      3 [Artikel 1a][ref7] is, voor zover het de op grond van [artikel 24b, eerste lid, van de wet][ref8]
      op de wettelijke controle bij organisaties van openbaar belang voortvloeiende verplichtingen
      betreft, eerst van toepassing na verloop van 12 maanden na de inwerkingtreding van
      [artikel I van het Besluit aanwijzing organisaties van openbaar belang.][ref9]

      4 De overeenkomstige toepassing van artikel 5 van verordening (EU) nr. 537/2014 van het Europees Parlement en
      de Raad van 16 april 2014 betreffende specifieke eisen voor de wettelijke controles van financiële overzichten
      van organisaties van openbaar belang (PbEU 2014, L 158) op grond van[ artikel 2, tweede lid, van de wet][ref10],
      geldt voor de bij de in [artikel 1a][ref11] aangewezen organisaties van openbaar belang werkzame
      accountants en accountantsorganisaties niet tot en met 12 maanden na de inwerkingtreding van
      [artikel I van het Besluit aanwijzing organisaties van openbaar belang][ref12].


