  - number: 1b
    text: |-
      1 Een organisatie van openbaar belang als bedoeld in [artikel 1a, onderdeel c][ref1], hoeft niet te voldoen aan het
      [Besluit instelling auditcommissie][ref2], indien:

      a. deze organisatie beschikt over een auditcommissie of een orgaan met gelijksoortige taken;

      b. bij de samenstelling van deze commissie of dit orgaan rekening is gehouden met de benodigde deskundigheid van de
      leden gezamenlijk die relevant is voor de sector waarin de organisatie actief is; en

      c. ten minste één lid van deze commissie of dit orgaan onafhankelijk is van deze organisatie.

      2 Een organisatie van openbaar belang als bedoeld in [artikel 1a, onderdeel d][ref3], behoeft niet te voldoen aan
      het [Besluit instelling auditcommissie][ref4].


