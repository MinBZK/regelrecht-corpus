    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0019468
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0019468
        hoofdstuk: '6'
  - number: '4.2'
    text: |-
      Indien een vergunning mede strekt tot het verrichten van wettelijke controles bij organisaties van openbaar belang,
      wordt dat vermeld in het register.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel4
  - number: '4.3'
    text: |-
      De Autoriteit Financiële Markten verwerkt een ingevolge [artikel 3, tweede en derde lid][ref1], gemelde wijziging
      van de in het eerste lid bedoelde gegevens binnen vijf werkdagen na ontvangst van de melding in het register.


      [ref1]: https://wetten.overheid.nl/BWBR0020184#Artikel3
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020184
        artikel: '3'
        hoofdstuk: '2'
  - number: '5'
    text: |-
      Een accountantsorganisatie die voornemens is een persoon te benoemen in een functie waarbij deze persoon het
      dagelijks beleid van de accountantsorganisatie zal bepalen of medebepalen, gaat daartoe niet over dan nadat de
      Autoriteit Financiële Markten diens betrouwbaarheid heeft beoordeeld en heeft meegedeeld dat deze buiten twijfel
      staat.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel5
  - number: '6'
    text: |-
      De betrouwbaarheid van een persoon die het beleid van een accountantsorganisatie bepaalt of mede bepaalt, staat
      buiten twijfel wanneer dat eenmaal door de Autoriteit Financiële Markten of De Nederlandsche Bank NV is vastgesteld
      voor de toepassing van enige wet, zolang niet een wijziging in de relevante feiten of omstandigheden een aanleiding
      geeft tot een nieuwe beoordeling.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel6
  - number: '7'
    text: |-
      Indien een accountantsorganisatie in het kader van haar normale bedrijfsvoering vaststelt dat zich een wijziging
      heeft voorgedaan in de gegevens, bedoeld in [artikel 2, derde lid][ref1], die nodig zijn in het belang van de
      beoordeling van de betrouwbaarheid van een persoon als bedoeld in [artikel 6][ref2], meldt zij dit onverwijld
      schriftelijk aan de Autoriteit Financiële Markten.


      [ref1]: https://wetten.overheid.nl/BWBR0020184#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020184#Artikel6
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020184
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020184
        artikel: '6'
        hoofdstuk: '4'
  - number: '8.1'
    text: Een accountantsorganisatie voert een beleid ten aanzien van het stelsel van kwaliteitsbeheersing.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel8
  - number: '8.2'
    text: |-
      Het stelsel van kwaliteitsbeheersing bevat procedures, beschrijvingen en standaarden als bedoeld in de
      [artikelen 11, tweede lid][ref1], en [16][ref2], die ten doel hebben de naleving door de accountantsorganisatie te
      waarborgen van de bij en krachtens de [artikelen 14 tot en met 24 van de wet][ref3] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0020184#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0020184#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0019468#Artikel14
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020184
        artikel: '11'
        hoofdstuk: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0020184
        artikel: '16'
        hoofdstuk: '5'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0019468
        artikel: '14'
  - number: '8.3'
    text: |-
      De accountantsorganisatie legt het in het eerste lid bedoelde beleid en het stelsel van kwaliteitsbeheersing
      schriftelijk vast.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel8
  - number: '8.4'
    text: |-
      De accountantsorganisatie bewaart het stelsel van kwaliteitsbeheersing en de schriftelijke vastlegging van het
      beleid, bedoeld in het eerste lid gedurende ten minste zeven jaren nadat zij zijn vastgelegd.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel8
  - number: '8.5'
    text: |-
      De accountantsorganisatie deelt het in het eerste lid bedoelde beleid en het stelsel van kwaliteitsbeheersing mede
      aan haar medewerkers en maakt dit voor hen toegankelijk.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel8
  - number: '9'
    text: |-
      Een accountantsorganisatie houdt zich aan de verordeningen en nadere voorschriften die krachtens
      [artikel 19, tweede lid, aanhef en onderdeel b, van de Wet op het accountantsberoep][ref1] zijn vastgesteld en die
      nadere regels stellen terzake van de in dit hoofdstuk geregelde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel19
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '19'
  - number: '10.1'
    text: |-
      Een accountantsorganisatie houdt een systematische, toegankelijke en actuele cliëntenadministratie bij waarin per
      controlecliënt, voor zover van toepassing, de volgende gegevens worden vastgelegd:
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel10
  - number: 10.1.a
    text: de naam, het adres en de vestigingsplaats;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel10
  - number: 10.1.b
    text: of de controlecliënt een organisatie van openbaar belang is;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel10
  - number: 10.1.c
    text: de naam van de externe accountant; en
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel10
  - number: 10.1.d
    text: |-
      de per boekjaar in rekening gebrachte vergoedingen voor de wettelijke controle en de in rekening gebrachte
      vergoedingen voor de overige verleende diensten.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel10
  - number: '10.2'
    text: |-
      De accountantsorganisatie bewaart de gegevens in haar cliëntenadministratie gedurende ten minste zeven jaren nadat
      zij zijn vastgelegd.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel10
  - number: '11.1'
    text: |-
      Een accountantsorganisatie zorgt ervoor dat externe accountants voor elke wettelijke controle een controledossier
      inrichten.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel11
  - number: '11.2'
    text: Een accountantsorganisatie heeft een standaard voor de inrichting van een controledossier.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel11
  - number: '11.3'
    text: |-
      In het controledossier worden ten minste de volgende gegevens en bescheiden schriftelijk of elektronisch
      vastgelegd:
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel11
  - number: 11.3.a
    text: de overeenkomst tussen de accountantsorganisatie en de controlecliënt en de eventuele wijzigingen daarin;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel11
  - number: 11.3.b
    text: |-
      de correspondentie met betrekking tot de controlecliënt, voor zover deze betrekking heeft op de wettelijke
      controle;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel11
  - number: 11.3.c
    text: een controleplan waarin de vermoedelijke reikwijdte en aanpak van de wettelijke controle worden vastgelegd;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel11
  - number: 11.3.d
    text: een beschrijving van de aard en de omvang van de uitgevoerde controlewerkzaamheden;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel11
  - number: 11.3.e
    text: de begin- en einddatum van uitvoering van de in het controleplan onderscheiden fasen van controlewerkzaamheden;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel11
  - number: 11.3.f
    text: de voornaamste bevindingen van de uitgevoerde controlewerkzaamheden;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel11
  - number: 11.3.g
    text: de uit de bevindingen, bedoeld in onderdeel f, getrokken conclusies;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel11
  - number: 11.3.h
    text: het oordeel van de externe accountant, zoals dat blijkt uit de door hem af te geven accountantsverklaring;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel11
  - number: 11.3.i
    text: |-
      de gegevens die worden vastgelegd ingevolge de [artikelen 12, derde lid][ref1], [artikel 13, tweede lid][ref2],
      [15a, eerste, derde en vijfde lid][ref3], [17, tweede lid][ref4], [20, derde lid][ref5], en [37, tweede lid][ref6];
      en


      [ref1]: https://wetten.overheid.nl/BWBR0020184#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0020184#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0020184#Artikel15a
      [ref4]: https://wetten.overheid.nl/BWBR0020184#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0020184#Artikel20
      [ref6]: https://wetten.overheid.nl/BWBR0020184#Artikel37
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0020184
        artikel: '12'
        hoofdstuk: '5'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0020184
        artikel: '13'
        hoofdstuk: '5'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0020184
        artikel: 15a
        hoofdstuk: '5'
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0020184
        artikel: '17'
        hoofdstuk: '5'
        paragraaf: '5'
      - id: ref5
        bwb_id: BWBR0020184
        artikel: '20'
        hoofdstuk: '5'
        paragraaf: '5'
      - id: ref6
        bwb_id: BWBR0020184
        artikel: '37'
        hoofdstuk: '9'
  - number: 11.3.j
    text: |-
      de overige relevante gegevens en bescheiden die van belang zijn voor de onderbouwing van de door de externe
      accountant afgegeven verklaring en voor het toezicht op de naleving van de bij en krachtens de wet en de
      [Wet op het accountantsberoep][ref1] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0032573
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0032573
  - number: '11.4'
    text: |-
      Een accountantsorganisatie zorgt ervoor dat de externe accountant de accountantsverklaring ondertekent nadat de
      controlewerkzaamheden zijn verricht en vastgelegd.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel11
  - number: '11.5'
    text: |-
      Een accountantsorganisatie zorgt ervoor dat de externe accountant uiterlijk twee maanden na de ondertekening van de
      accountantsverklaring de in het derde lid bedoelde gegevens en bescheiden in het controledossier heeft opgenomen en
      het controledossier heeft afgesloten.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel11
  - number: '11.6'
    text: Een accountantsorganisatie bewaart een controledossier gedurende ten minste zeven jaren nadat het is afgesloten.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel11
  - number: '12.1'
    text: |-
      Alvorens een accountantsorganisatie een opdracht tot het uitvoeren van een wettelijke controle aanvaardt of
      continueert, beoordeelt zij:
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel12
  - number: 12.1.a
    text: |-
      of zij voldoet aan het gestelde bij en krachtens [paragraaf 3.1.2 van de wet][ref1] en, voor zover van toepassing,
      [paragraaf 3.1.3 van de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Paragraaf3.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Paragraaf3.1.3
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0019468
        paragraaf: 3.1.2
      - id: ref2
        bwb_id: BWBR0019468
        paragraaf: 3.1.3
  - number: 12.1.b
    text: |-
      of zij beschikt over de benodigde vakbekwame medewerkers, tijd en middelen om de wettelijke controle naar behoren
      te verrichten;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel12
  - number: 12.1.c
    text: |-
      of de externe accountant, bedoeld in [artikel 14][ref1], voldoet aan het gestelde bij en krachtens
      [afdeling 3.2 van de wet][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020184#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Afdeling3.2
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0020184
        artikel: '14'
        hoofdstuk: '5'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0019468
        afdeling: '3.2'
  - number: 12.1.d
    text: de integriteit van de controlecliënt.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel12
  - number: '12.2'
    text: |-
      De accountantsorganisatie waarborgt dat haar medewerkers haar de informatie verstrekken die van belang is voor de
      in het eerste lid bedoelde beoordeling.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel12
  - number: '12.3'
    text: De accountantsorganisatie legt de in het eerste lid bedoelde beoordeling vast.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel12
  - number: '13.1'
    text: |-
      Indien na aanvaarding of continuering van een opdracht tot het verrichten van een wettelijke controle aan een
      accountantsorganisatie informatie bekend wordt die, was zij haar bekend geweest op het moment van aanvaarding of
      continuering van de opdracht, ertoe zou hebben geleid dat de opdracht niet dan wel in gewijzigde vorm zou zijn
      aanvaard of gecontinueerd, beëindigt de accountantsorganisatie de opdracht, tenzij deze in gewijzigde vorm kan
      worden voortgezet.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel13
  - number: '13.2'
    text: |-
      De accountantsorganisatie legt de in het eerste lid bedoelde beslissing vast, met inbegrip van de daaraan ten
      grondslag liggende overwegingen.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel13
  - number: '14'
    text: |-
      Een accountantsorganisatie wijst voor de uitvoering van elke opdracht tot het verrichten van een wettelijke
      controle een externe accountant aan.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel14
  - number: '15'
    text: |-
      Een accountantsorganisatie stelt de benodigde tijd, middelen en personeel aan de externe accountant beschikbaar,
      opdat hij zijn taak naar behoren kan uitvoeren.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel15
  - number: 15a.1
    text: |-
      Een accountantsorganisatie die een wettelijke controle verricht van een jaarrekening die mede de geconsolideerde
      jaarrekening van een groep ondernemingen of instellingen bevat, zorgt ervoor dat de groepsaccountant onderzoek
      verricht, en daarover informatie vastlegt, naar de controlewerkzaamheden die door een externe accountant,
      accountantsorganisatie, auditkantoor, auditor van een derde land of auditorganisatie van een derde land zijn
      verricht met het oog op de groepscontrole.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel15a
  - number: 15a.2
    text: |-
      Indien een onderdeel van een groep ondernemingen of instellingen is gecontroleerd door een auditor van een
      derde land of auditorganisatie van een derde land met statutaire zetel in een staat waarmee de Autoriteit
      Financiële Markten geen overeenkomst als bedoeld in [artikel 63j van de wet][ref1] heeft gesloten, zorgt de
      accountantsorganisatie dat de groepsaccountant, op verzoek van de Autoriteit Financiële Markten, de gegevens of
      inlichtingen verstrekt die op de controlewerkzaamheden van die auditors van een derde land of auditorganisaties
      van een derde land betrekking hebben, met inbegrip van de gegevens of inlichtingen met betrekking tot de
      groepscontrole, opdat de Autoriteit Financiële Markten het werk van de groepsaccountant kan beoordelen.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel63j
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: 63j
  - number: 15a.3
    text: |-
      Met het oog op de verstrekking van de in het tweede lid bedoelde gegevens of inlichtingen aan de Autoriteit
      Financiële Markten, zorgt de accountantsorganisatie ervoor dat de groepsaccountant:
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel15a
  - number: 15a.3.a
    text: een afschrift van deze gegevens of inlichtingen vastlegt;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel15a
  - number: 15a.3.b
    text: |-
      met de auditors van een derde land of auditorganisaties van een derde land overeenkomt dat hij, op verzoek,
      onbeperkt toegang heeft tot deze gegevens of inlichtingen; of
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel15a
  - number: 15a.3.c
    text: |-
      andere passende maatregelen neemt teneinde de verstrekking van de in het tweede lid bedoelde gegevens of
      inlichtingen aan de Autoriteit Financiële Markten mogelijk te maken.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel15a
  - number: 15a.4
    text: |-
      De accountantsorganisatie stelt passende procedures vast om de toegang tot de in het tweede lid bedoelde gegevens
      of inlichtingen te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel15a
  - number: 15a.5
    text: |-
      Indien gegevens of inlichtingen met betrekking tot een controle om wettelijke of andere redenen niet door
      de auditors van een derde land of auditorganisaties van een derde land aan de groepsaccountant kunnen worden
      verstrekt, zorgt de accountantsorganisatie ervoor dat de groepsaccountant vastlegt dat hij de in het vierde
      lid bedoelde procedures heeft gevolgd en, in het geval van andere dan wettelijke belemmeringen, dat dergelijke
      belemmeringen bestaan.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel15a
  - number: '16'
    text: 'Een accountantsorganisatie heeft een standaard voor:'
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel16
  - number: 16.a
    text: het uitvoeren van wettelijke controles; en
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel16
  - number: 16.b
    text: de begeleiding van, het toezicht op en de beoordeling van door de medewerkers uitgevoerde werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel16
  - number: '17.1'
    text: |-
      Een accountantsorganisatie zorgt ervoor dat een externe accountant ten behoeve van de uitvoering van een wettelijke
      controle zonodig advies vraagt aan vakbekwame personen.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel17
  - number: '17.2'
    text: |-
      De accountantsorganisatie zorgt ervoor dat de externe accountant het onderwerp van de adviesaanvraag en het
      verkregen advies vastlegt.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel17
  - number: '18.1'
    text: |-
      Een accountantsorganisatie zorgt ervoor dat een kwaliteitsbeoordeling plaatsvindt van wettelijke controles die zij
      verricht bij organisaties van openbaar belang.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel18
  - number: '18.2'
    text: |-
      De accountantsorganisatie stelt toetsingscriteria op aan de hand waarvan zij vaststelt voor welke andere wettelijke
      controles dan bedoeld in het eerste lid een kwaliteitsbeoordeling plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel18
  - number: '19.1'
    text: De kwaliteitsbeoordeling wordt verricht door een kwaliteitsbeoordelaar.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel19
  - number: '19.2'
    text: |-
      Een kwaliteitsbeoordelaar is een registeraccountant of een Accountant-Administratieconsulent
      ten aanzien van wie in het accountantsregister een aantekening is geplaatst als bedoeld in
      [artikel 36, tweede lid, onderdeel i, van de Wet op het accountantsberoep][ref1] die niet is betrokken bij de
      uitvoering van de wettelijke controle die hij beoordeelt.


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel36
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '36'
  - number: '19.3'
    text: |-
      De kwaliteitsbeoordeling heeft ten doel te beoordelen of de externe accountant in redelijkheid tot het oordeel
      heeft kunnen komen, zoals dat blijkt uit de door hem af te geven accountantsverklaring.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel19
  - number: '19.4'
    text: 'De kwaliteitsbeoordelaar betrekt ten minste in zijn beoordeling:'
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel19
  - number: 19.4.a
    text: |-
      de mondeling en schriftelijk door de desbetreffende externe accountant, al dan niet op verzoek van de
      kwaliteitsbeoordelaar, gegeven informatie;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel19
  - number: 19.4.b
    text: de gecontroleerde financiële verantwoording;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel19
  - number: 19.4.c
    text: |-
      de voornaamste bevindingen van de uitgevoerde controlewerkzaamheden en de uit deze bevindingen getrokken
      conclusies; en
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel19
  - number: 19.4.d
    text: het oordeel van de externe accountant, zoals dat blijkt uit de door hem af te geven accountantsverklaring.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel19
  - number: '19.5'
    text: |-
      De kwaliteitsbeoordeling van wettelijke controles die worden verricht bij organisaties van openbaar belang omvat
      ten minste een beoordeling van de volgende aspecten:
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel19
  - number: 19.5.a
    text: de onafhankelijkheid van de accountantsorganisatie en de externe accountant met betrekking tot de controlecliënt;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel19
  - number: 19.5.b
    text: |-
      de belangrijke risico’s die de externe accountant tijdens het uitvoeren van de wettelijke controle heeft
      gesignaleerd en de maatregelen die hij heeft genomen om deze risico’s afdoende te beheersen;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel19
  - number: 19.5.c
    text: |-
      de afwegingen die de externe accountant heeft gemaakt, in het bijzonder met betrekking tot het materieel belang en
      de belangrijke risico’s, bedoeld in onderdeel b;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel19
  - number: 19.5.d
    text: |-
      de ingevolge [artikel 17][ref1] gevraagde adviezen en de verwerking daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0020184#Artikel17
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0020184
        artikel: '17'
        hoofdstuk: '5'
        paragraaf: '5'
  - number: 19.5.e
    text: |-
      de aard en de omvang van de gecorrigeerde en niet-gecorrigeerde afwijkingen in de financiële verantwoording die
      tijdens het uitvoeren van de wettelijke controle zijn gesignaleerd;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel19
  - number: 19.5.f
    text: |-
      de onderwerpen die naar aanleiding van de uitgevoerde controle zijn besproken met het bestuur en het
      toezichthoudende orgaan van de controlecliënt, en indien van toepassing met derden; en
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel19
  - number: 19.5.g
    text: |-
      of de geselecteerde dossierstukken de werkzaamheden met betrekking tot belangrijke standpunten die de bij
      de controle betrokken medewerkers hebben ingenomen voldoende weergeven en of deze het oordeel van de externe
      accountant, zoals dat blijkt uit de door hem af te geven accountantsverklaring, onderbouwen.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel19
  - number: '20.1'
    text: |-
      Een accountantsorganisatie zorgt ervoor dat de kwaliteitsbeoordelaar de uitkomst van de kwaliteitsbeoordeling
      bespreekt met de externe accountant. De accountantsorganisatie stelt een door de kwaliteitsbeoordelaar en de
      externe accountant te volgen procedure vast in het geval zij geen overeenstemming bereiken over de uitkomst van
      de kwaliteitsbeoordeling.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel20
  - number: '20.2'
    text: |-
      De kwaliteitsbeoordeling is voltooid op het tijdstip waarop de uitkomst van de kwaliteitsbeoordeling, volgens
      een door de accountantsorganisatie vast te stellen procedure, is medegedeeld aan de persoon, bedoeld in
      [artikel 23, eerste lid][ref1], of aan de personen die het dagelijks beleid van de accountantsorganisatie bepalen.


      [ref1]: https://wetten.overheid.nl/BWBR0020184#Artikel23
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0020184
        artikel: '23'
        hoofdstuk: '5'
        paragraaf: '6'
  - number: '20.3'
    text: |-
      De accountantsorganisatie legt de uitkomst van de kwaliteitsbeoordeling vast, met inbegrip van de aan die uitkomst
      ten grondslag liggende overwegingen.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel20
  - number: '21'
    text: |-
      Een accountantsorganisatie zorgt ervoor dat een externe accountant zijn accountantsverklaring niet eerder afgeeft
      dan nadat de kwaliteitsbeoordeling, voor zover deze is vereist ingevolge [artikel 18][ref1], is voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0020184#Artikel18
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0020184
        artikel: '18'
        hoofdstuk: '5'
        paragraaf: '5'
  - number: '22.1'
    text: Een accountantsorganisatie waarborgt de naleving van het stelsel van kwaliteitsbeheersing.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel22
  - number: '22.2'
    text: |-
      Een accountantsorganisatie evalueert jaarlijks het stelsel van kwaliteitsbeheersing en legt de uitkomst
      van deze evaluatie vast alsmede de door haar voorgenomen maatregelen tot aanpassing van het stelsel van
      kwaliteitsbeheersing.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel22
  - number: '23.1'
    text: |-
      Een accountantsorganisatie die wettelijke controles verricht bij organisaties van openbaar belang wijst
      een persoon aan die binnen de accountantsorganisatie toeziet op de naleving van de bij en krachtens de
      [artikelen 13 tot en met 24 van de wet][ref1] gestelde regels. De accountantsorganisatie wijst eveneens een
      plaatsvervanger aan.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel13
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '13'
  - number: '23.2'
    text: |-
      De in het eerste lid bedoelde persoon legt aan de personen die het dagelijks beleid van de accountantsorganisatie
      bepalen verantwoording af omtrent zijn werkzaamheden en de uitkomsten daarvan.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel23
  - number: '23.3'
    text: |-
      Indien de in het eerste lid bedoelde persoon is betrokken bij een opdracht tot het verrichten van een wettelijke
      controle, is het zijn plaatsvervanger die ter zake van die opdracht toeziet op de naleving van de in het eerste lid
      bedoelde regels.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel23
  - number: '24.1'
    text: 'Een accountantsorganisatie zorgt voor een vastlegging van:'
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel24
  - number: 24.1.a
    text: |-
      een overzicht op hoofdlijnen van schendingen door medewerkers van de bij en krachtens de
      [artikelen 13 tot en met 24 van de wet][ref1] gestelde regels, voor zover deze bekend zijn bij de
      in [artikel 23, eerste lid][ref2], bedoelde persoon of de personen die het dagelijks beleid van de
      accountantsorganisatie bepalen;


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0020184#Artikel23
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0020184
        artikel: '23'
        hoofdstuk: '5'
        paragraaf: '6'
  - number: 24.1.b
    text: |-
      de maatregelen die de accountantsorganisatie heeft genomen jegens de in onderdeel a bedoelde medewerkers, met
      inbegrip van de daaraan ten grondslag liggende overwegingen; en
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel24
  - number: 24.1.c
    text: de door de accountantsorganisatie genomen maatregelen tot aanpassing van het stelsel van kwaliteitsbeheersing.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel24
  - number: '24.2'
    text: |-
      De accountantsorganisatie stelt jaarlijks een verslag op met een overzicht van de in het eerste lid, onderdeel b,
      bedoelde maatregelen en de daaraan ten grondslag liggende overwegingen.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel24
  - number: '24.3'
    text: De accountantsorganisatie deelt het verslag mede aan haar medewerkers.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel24
  - number: '25'
    text: |-
      Een accountantsorganisatie zorgt voor een zorgvuldige afhandeling en vastlegging van klachten over de uitvoering
      van wettelijke controles.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel25
  - number: '26.1'
    text: |-
      Indien bij de accountantskamer te Zwolle een tuchtprocedure aanhangig is gemaakt tegen een bij de
      accountantsorganisatie werkzame of daaraan verbonden externe accountant, meldt de accountantsorganisatie dat aan
      de Autoriteit Financiële Markten, binnen een week nadat de accountantsorganisatie hiervan kennis heeft genomen,
      onder vermelding van de naam en het inschrijvingsnummer bij de beroepsorganisatie van de desbetreffende externe
      accountant.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel26
  - number: '26.2'
    text: |-
      De in het eerste lid bedoelde melding kan achterwege blijven indien de Autoriteit Financiële Markten degene is die
      de in het eerste lid bedoelde tuchtprocedure aanhangig heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel26
  - number: '27'
    text: |-
      De eigenaars of aandeelhouders van een accountantsorganisatie, de personen die het dagelijks beleid van een
      accountantsorganisatie bepalen of mede bepalen, het toezichthoudende orgaan van een accountantsorganisatie, of
      een met een accountantsorganisatie verbonden entiteit, hebben geen zodanige bemoeienis met de uitvoering van de
      wettelijke controle door die accountantsorganisatie dat daardoor afbreuk wordt gedaan aan de onafhankelijkheid
      en objectiviteit van de externe accountant die namens de betrokken accountantsorganisatie de wettelijke controle
      verricht.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel27
  - number: '28'
    text: |-
      Een accountantsorganisatie zorgt ervoor dat de bij haar werkzame of aan haar verbonden externe accountants haar ten
      minste eenmaal per jaar schriftelijk:
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel28
  - number: 28.a
    text: |-
      bevestigen dat zij de bij en krachtens de wet en de [Wet op het accountantsberoep][ref1] gestelde regels inzake
      onafhankelijkheid naleven; en


      [ref1]: https://wetten.overheid.nl/BWBR0032573
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0032573
  - number: 28.b
    text: informeren over bedreigingen ter zake van hun onafhankelijkheid.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel28
  - number: '29.1'
    text: |-
      Een accountantsorganisatie ontvangt geen vergoeding voor de uitvoering van een wettelijke controle waarbij het
      bedrag van de vergoeding afhankelijk is gesteld van:
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel29
  - number: 29.1.a
    text: aanvullende diensten die zij verleent aan de controlecliënt; of
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel29
  - number: 29.1.b
    text: de strekking van de af te geven accountantsverklaring.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel29
  - number: '29.2'
    text: |-
      De accountantsorganisatie komt de grondslag voor de berekening van de vergoeding voor iedere wettelijke controle
      elk jaar van tevoren met de controlecliënt overeen.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel29
  - number: '30.1'
    text: |-
      Een accountantsorganisatie die een wettelijke controle heeft verricht bij een organisatie van openbaar belang stelt
      binnen drie maanden na afloop van haar boekjaar een verslag op waarin ten minste het volgende wordt opgenomen:
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel30
  - number: 30.1.a
    text: een beschrijving op hoofdlijnen van haar juridische en organisatorische structuur;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel30
  - number: 30.1.b
    text: |-
      indien zij onderdeel uitmaakt van een netwerk: een beschrijving op hoofdlijnen van de organisatiestructuur van
      het netwerk;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel30
  - number: 30.1.c
    text: een beschrijving op hoofdlijnen van haar beheersstructuur;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel30
  - number: 30.1.d
    text: |-
      een beschrijving op hoofdlijnen van haar stelsel van kwaliteitsbeheersing en een verklaring van de personen die
      haar dagelijks beleid bepalen dat dit stelsel al dan niet doeltreffend functioneert;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel30
  - number: 30.1.e
    text: |-
      het tijdstip waarop het stelsel van kwaliteitsbeheersing is geëvalueerd ingevolge [artikel 22, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020184#Artikel22
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0020184
        artikel: '22'
        hoofdstuk: '5'
        paragraaf: '6'
  - number: 30.1.f
    text: of het stelsel van kwaliteitsbeheersing voorwerp is geweest van toezicht door de Autoriteit Financiële Markten;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel30
  - number: 30.1.g
    text: |-
      een lijst van de organisaties van openbaar belang waarbij in het desbetreffende boekjaar een wettelijke controle
      is verricht;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel30
  - number: 30.1.h
    text: |-
      een verklaring die bevestigt dat intern toezicht op de naleving van de onafhankelijkheidsvoorschriften is
      uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel30
  - number: 30.1.i
    text: |-
      een verklaring over het beleid dat door de accountantsorganisatie wordt gevoerd inzake het op een gestructureerde
      manier onderhouden van de basiskennis van haar medewerkers en het bijhouden van ontwikkelingen op hun vakgebied;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel30
  - number: 30.1.j
    text: |-
      de totale omzet van de onderdelen van het netwerk die zich in Nederland bevinden, waarbij de omzet van de
      accountantsorganisatie wordt verdeeld in omzet voor wettelijke controles en voor overige dienstverlening; en
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel30
  - number: 30.1.k
    text: informatie over de grondslag voor de beloning van de externe accountants.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel30
  - number: '30.2'
    text: |-
      De accountantsorganisatie ondertekent het verslag en plaatst dit onverwijld op haar website. De
      accountantsorganisatie houdt het verslag gedurende tenminste een jaar op de website toegankelijk.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel30
  - number: '31'
    text: |-
      Een accountantsorganisatie houdt zich aan de verordeningen en nadere voorschriften die krachtens
      [artikel 19, tweede lid, aanhef en onderdeel b, van de Wet op het accountantsberoep][ref1] zijn vastgesteld en die
      nadere regels stellen ter zake van de in dit hoofdstuk geregelde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel19
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '19'
  - number: '32.1'
    text: |-
      Een accountantsorganisatie heeft een beleid dat ertoe strekt dat de betrokkenheid van de accountantsorganisatie
      en haar medewerkers wordt voorkomen bij strafbare feiten en wetsovertredingen die het vertrouwen in de
      accountantsorganisatie of in de financiële markten kunnen schaden.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel32
  - number: '32.2'
    text: |-
      Een accountantsorganisatie stelt procedures en regels vast ter zake van de omgang met en vastlegging van incidenten
      die ernstige gevolgen hebben voor de integere uitoefening van haar bedrijf.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel32
  - number: '32.3'
    text: |-
      Een accountantsorganisatie neemt naar aanleiding van een incident als bedoeld in het tweede lid passende
      maatregelen. Deze maatregelen zijn gericht op het beheersen van de als gevolg van het incident opgetreden risico’s
      en op het voorkomen van herhaling.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel32
  - number: '32.4'
    text: |-
      Een accountantsorganisatie informeert de Autoriteit Financiële Markten onverwijld omtrent de in het tweede lid
      bedoelde incidenten.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel32
  - number: '33.1'
    text: |-
      De administratieve vastlegging van incidenten als bedoeld in [artikel 32, tweede lid][ref1], omvat ten minste de
      feiten en omstandigheden van het incident, de gegevens over degene of degenen die bij het incident zijn betrokken
      en de maatregelen die naar aanleiding van het incident zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020184#Artikel32
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0020184
        artikel: '32'
        hoofdstuk: '7'
  - number: '33.2'
    text: |-
      Een accountantsorganisatie bewaart de in het eerste lid bedoelde gegevens gedurende ten minste zeven jaren nadat
      zij zijn vastgelegd.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel33
  - number: '34'
    text: |-
      Een accountantsorganisatie houdt zich aan de verordeningen en nadere voorschriften die krachtens
      [artikel 19, tweede lid, aanhef en onderdeel b, van de Wet op het accountantsberoep][ref1] zijn vastgesteld en die
      nadere regels stellen ter zake van de in dit hoofdstuk geregelde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel19
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '19'
  - number: '35'
    text: |-
      Een externe accountant houdt zich aan de verordeningen en nadere voorschriften die krachtens
      [artikel 19, eerste lid, van de Wet op het accountantsberoep][ref1] zijn vastgesteld en die nadere regels stellen
      ter zake van zijn vakbekwaamheid, onafhankelijkheid, objectiviteit en integriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel19
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '19'
  - number: '36'
    text: |-
      Onder fraude van materieel belang als bedoeld in [artikel 26, derde lid, van de wet][ref1] wordt verstaan een
      opzettelijk handelen of nalaten waarbij misleiding wordt gebruikt om een wederrechtelijk voordeel te behalen en
      waarbij de aard of de omvang zodanig is dat beslissingen die in het maatschappelijk verkeer worden genomen op grond
      van de financiële verantwoording van de controlecliënt zouden kunnen worden beïnvloed door die misleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel26
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '26'
  - number: '37.1'
    text: |-
      Een melding als bedoeld in [artikel 26, tweede lid, van de wet][ref1] kan achterwege blijven, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel26
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '26'
  - number: 37.1.a
    text: |-
      de controlecliënt, nadat de externe accountant hem heeft gewezen op zijn redelijk vermoeden van fraude van
      materieel belang, daarnaar onverwijld onderzoek verricht of doet verrichten en op basis daarvan een schriftelijk
      plan opstelt waarin zijn opgenomen:
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel37
  - number: 37.1.a.1°
    text: |-
      de maatregelen die de controlecliënt zal nemen om de gevolgen van de fraude, voor zover mogelijk, ongedaan te maken
      en om herhaling van zodanige fraude te voorkomen; en
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel37
  - number: 37.1.a.2°
    text: de termijn waarbinnen de controlecliënt de maatregelen zal hebben uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel37
  - number: 37.1.b
    text: |-
      de externe accountant, binnen vier weken nadat het plan is opgesteld, heeft geoordeeld dat het in onderdeel a
      bedoelde plan toereikend is; en
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel37
  - number: 37.1.c
    text: |-
      de externe accountant heeft vastgesteld dat de controlecliënt binnen de in onderdeel a, onder 2°, bedoelde termijn
      de in het plan opgenomen maatregelen in voldoende mate heeft uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel37
  - number: '37.2'
    text: |-
      De externe accountant legt zijn oordeel, bedoeld in het eerste lid, onderdeel b, en zijn vaststelling, bedoeld in
      het eerste lid, onderdeel c, vast.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel37
  - number: '38'
    text: |-
      Een externe accountant meldt, indien [artikel 37][ref1] geen toepassing vindt, schriftelijk de volgende gegevens
      aan de in [artikel 26 van de wet][ref2] bedoelde opsporingsambtenaar:


      [ref1]: https://wetten.overheid.nl/BWBR0020184#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel26
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0020184
        artikel: '37'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '26'
  - number: 38.a
    text: de naam, het adres en de vestigingsplaats van de controlecliënt;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel38
  - number: 38.b
    text: |-
      de naam, het adres en de vestigingsplaats van de accountantsorganisatie waarbij de externe accountant werkzaam is
      of waaraan hij is verbonden;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel38
  - number: 38.c
    text: de naam van de externe accountant;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel38
  - number: 38.d
    text: de datum van de melding; en
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel38
  - number: 38.e
    text: een omschrijving van de aard van de vermoedelijke fraude van materieel belang.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel38
  - number: 38a.1
    text: |-
      Een externe accountant kan vertrouwelijke gegevens of inlichtingen verkregen bij het verrichten van een wettelijke
      controle, aan derden verstrekken:
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel38a
  - number: 38a.1.a
    text: |-
      indien dit redelijkerwijs noodzakelijk is voor de naleving van het ingevolge
      de wet bepaalde of van de verordeningen en nadere voorschriften die krachtens
      [artikel 19, tweede lid, aanhef en onderdelen a en b, van de Wet op het accountantsberoep][ref1] zijn vastgesteld
      en geschiedt:


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel19
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '19'
  - number: 38a.1.a.1°
    text: aan een deskundige die door de externe accountant is betrokken bij de uitvoering van een wettelijke controle;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel38a
  - number: 38a.1.a.2°
    text: |-
      aan personen binnen de accountantsorganisatie waarbinnen de externe accountant werkzaam is of waaraan hij is
      verbonden dan wel binnen het netwerk waartoe de accountantsorganisatie behoort, die op enigerlei wijze betrokken
      zijn bij een wettelijke controle waarvoor de externe accountant verantwoordelijk is;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel38a
  - number: 38a.1.a.3°
    text: |-
      aan een groepsaccountant of een buitenlandse accountant die verantwoordelijkheid draagt voor het afgeven van een
      accountantsverklaring bij de jaarrekening die mede de geconsolideerde jaarrekening van een groep ondernemingen of
      instellingen bevat waarin de gegevens van een controlecliënt van de externe accountant worden opgenomen;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel38a
  - number: 38a.1.a.4°
    text: |-
      aan een registeraccountant, een Accountant-Administratieconsulent of een buitenlandse accountant indien deze in het
      kader van een assurance-opdracht gebruik maakt van de werkzaamheden van de externe accountant;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel38a
  - number: 38a.1.a.5°
    text: |-
      aan een registeraccountant, een Accountant-Administratieconsulent of buitenlandse accountant van wiens
      werkzaamheden de externe accountant in het kader van een wettelijke controle gebruik maakt;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel38a
  - number: 38a.1.a.6°
    text: |-
      aan een registeraccountant, een Accountant-Administratieconsulent of een buitenlandse accountant ten behoeve van
      diens beoordeling van de aanvaardbaarheid van een controleopdracht;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel38a
  - number: 38a.1.a.7°
    text: |-
      aan een persoon aan wie advies wordt gevraagd, zoals bedoeld in [artikel 17, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020184#Artikel17
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0020184
        artikel: '17'
        hoofdstuk: '5'
        paragraaf: '5'
  - number: 38a.1.a.8°
    text: |-
      aan de persoon, bedoeld in [artikel 19, tweede lid][ref1], of [artikel 23, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020184#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0020184#Artikel23
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0020184
        artikel: '19'
        hoofdstuk: '5'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0020184
        artikel: '23'
        hoofdstuk: '5'
        paragraaf: '6'
  - number: 38a.1.a.9°
    text: |-
      aan de persoon die is betrokken bij de uitvoering van een periodiek intern kwaliteitsonderzoek van afgeronde
      opdrachten tot het verrichten van een wettelijke controle;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel38a
  - number: 38a.1.a.10°
    text: aan de beroepsorganisatie;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel38a
  - number: 38a.1.b
    text: |-
      indien dit plaatsvindt in het kader van de naleving van de verordeningen en nadere voorschriften krachtens
      [artikel 19, tweede lid, aanhef en onderdelen a en b, van de Wet op het accountantsberoep][ref1], in andere
      gevallen dan bedoeld in onderdeel a, en de externe accountant vastlegt op welke onderdelen van die verordeningen en
      nadere voorschriften het verstrekken betrekking heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel19
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '19'
  - number: 38a.1.c
    text: |-
      in het kader van een gerechtelijke procedure of klachtprocedure jegens de externe accountant of de
      accountantsorganisatie waarbij de externe accountant werkzaam is of is geweest of waaraan hij verbonden is of is
      geweest in relatie tot de betreffende controleopdracht; of
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel38a
  - number: 38a.1.d
    text: |-
      indien dit geschiedt met schriftelijke toestemming van de controlecliënt en indien sprake is van een specifiek doel
      en de externe accountant dit doel vastlegt.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel38a
  - number: 38a.2
    text: |-
      Onder een buitenlandse accountant als bedoeld in het eerste lid, onderdeel a, onder 3° tot en met 6° wordt verstaan
      een in een andere lidstaat gevestigde wettelijke auditor als bedoeld in artikel 2, tweede lid, van de richtlijn, of
      een auditor van een derde land.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel38a
  - number: 38b.1
    text: |-
      De externe accountant betrekt in zijn beslissing op grond van [artikel 38a, eerste lid, onderdeel b of d][ref1], om
      al dan niet over te gaan tot het verstrekken van vertrouwelijke gegevens of inlichtingen:


      [ref1]: https://wetten.overheid.nl/BWBR0020184#Artikel38a
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel38b
    references:
      - id: ref1
        bwb_id: BWBR0020184
        artikel: 38a
        hoofdstuk: '9'
  - number: 38b.1.a
    text: de belangen van betrokken partijen en derden, waaronder het maatschappelijk belang;
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel38b
  - number: 38b.1.b
    text: de betrouwbaarheid, volledigheid en onderbouwing van de betreffende gegevens of inlichtingen; en
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel38b
  - number: 38b.1.c
    text: de wijze waarop en aan wie de vertrouwelijke gegevens of inlichtingen worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel38b
  - number: 38b.2
    text: De externe accountant legt de overwegingen die hebben geleid tot de in het eerste lid bedoelde beslissing vast.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel38b
  - number: '40'
    text: |-
      De toezichthouder kan een bestuurlijke boete opleggen bij overtreding van
      de [artikelen 3, eerste tot en met derde lid][ref1], [5][ref2], [7][ref3],
      [8, eerste tot en met het vijfde lid][ref4], [9][ref5], [10, eerste en tweede lid][ref6],
