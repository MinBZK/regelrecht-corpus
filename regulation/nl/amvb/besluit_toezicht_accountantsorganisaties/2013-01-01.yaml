      Autoriteit Financiële Markten.


      [ref1]: https://wetten.overheid.nl/BWBR0020184#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0020184#Artikel2
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel3
