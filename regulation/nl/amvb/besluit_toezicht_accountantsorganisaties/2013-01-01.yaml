  - number: '41'
    text: |-
      Een aanvraag van een vergunning als bedoeld in [artikel 5 van de wet][ref1] die ingevolge
      [artikel 80, tweede lid, van de wet][ref2] binnen een maand na inwerkingtreding van de [wet][ref3] bij de
      Autoriteit Financiële Markten wordt ingediend, bevat in aanvulling op de in [artikel 2, eerste lid][ref4], bedoelde
      gegevens en bescheiden, het aantal wettelijke controles dat de aanvrager op het tijdstip van de aanvraag verricht
      bij organisaties van openbaar belang of overige ondernemingen of instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel80
      [ref3]: https://wetten.overheid.nl/BWBR0019468
      [ref4]: https://wetten.overheid.nl/BWBR0020184#Artikel2
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '80'
      - id: ref3
        bwb_id: BWBR0019468
      - id: ref4
        bwb_id: BWBR0020184
        artikel: '2'
        hoofdstuk: '2'
  - number: '42'
    text: |-
      Het register, bedoeld in [artikel 11 van de wet][ref1], bevat de datum van de aanvraag, bedoeld in
      [artikel 80, tweede lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel80
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '80'
  - number: '46'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel46
  - number: '47'
    text: 'Dit besluit wordt aangehaald als: Besluit toezicht accountantsorganisaties.'
    url: https://wetten.overheid.nl/BWBR0020184/2013-01-01#Artikel47
