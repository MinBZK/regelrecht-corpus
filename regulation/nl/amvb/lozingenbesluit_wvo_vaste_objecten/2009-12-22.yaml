---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: lozingenbesluit_wvo_vaste_objecten
regulatory_layer: AMVB
publication_date: '1998-01-29'
valid_from: '2009-12-22'
bwb_id: BWBR0009355
url: https://wetten.overheid.nl/BWBR0009355/2009-12-22
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 16 juli 1997, nr. HKW/AW 97/7738, Hoofddirectie
    van de Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken, gedaan mede namens Onze Minister van
    Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Gelet op de artikelen 1, eerste en derde lid, 2a, eerste en tweede lid, 2b en 2c, tweede lid, van de Wet
    verontreiniging oppervlaktewateren;

    Gezien het advies van de Staatscommissie voor de Waterstaatswetgeving (advies van 2 april 1997);

    De Raad van State gehoord (advies van 14 oktober 1997, no. W09.97.0483);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 23 januari 1998, nr. HKW/A RH 1998/313,
    Hoofddirectie van de Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken, uitgebracht mede namens Onze
    Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel1
  - number: 1.1.a
    text: '*vast object:*locatiegebonden constructie of gedeelte daarvan, gelegen in of nabij een oppervlaktewaterlichaam;'
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel1
  - number: 1.1.b
    text: |-
      *reinigingswerkzaamheden:* verwijderen van stoffen aan vaste objecten door middel van een techniek als beschreven
      in [bijlage 1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009355
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009355
  - number: 1.1.c
    text: |-
      *conserveringswerkzaamheden:* aanbrengen van verfraaiende, beschermende of afwerklagen op vaste objecten door
      middel van een techniek als beschreven in [bijlage 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009355
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009355
  - number: 1.1.d
    text: '*werkzaamheden:* reinigings- of conserveringswerkzaamheden;'
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel1
  - number: 1.1.e
    text: '*hulpconstructie*: constructie ter omsluiting van de ruimte waarin werkzaamheden aan een vast object plaatsvinden;'
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel1
  - number: 1.1.f
    text: '*stofdichte wand*: afdichting gericht op het voorkomen van emissie van stofdelen uit de hulpconstructie;'
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel1
  - number: 1.1.g
    text: |-
      *vloeistofdichte wand*: afdichting gericht op het voorkomen van emissie van vloeistof of nevel uit de
      hulpconstructie;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel1
  - number: 1.1.h
    text: |-
      *winddichte wand*: afdichting gericht op het voorkomen van invloed van wind op de emissie van stofdelen, vloeistof
      of nevel uit de hulpconstructie;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel1
  - number: 1.1.i
    text: |-
      *stoffen*: afvalstoffen, verontreinigende of schadelijke stoffen als bedoeld in [bijlage 3][ref1], die bij
      reinigings- of conserveringswerkzaamheden plegen vrij te komen;


      [ref1]: https://wetten.overheid.nl/BWBR0009355
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009355
  - number: 1.1.j
    text: '*afvalwater:* water dat stoffen bevat en vrijkomt door het toepassen van een natte techniek;'
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel1
  - number: 1.1.k
    text: |-
      *NEN 6621:*door het Nederlands Normalisatie-Instituut uitgegeven norm «Afvalwater en slib; bepaling van het gehalte
      onopgeloste bestanddelen en de gloeirest daarvan; gravimetrische methode», publicatiejaar 1992, met de daarop
      uitgegeven aanvullingen en correctie-bladen, zoals deze zijn medegedeeld in de Staatscourant, vanaf het moment dat
      deze volgens die mededeling van toepassing zijn geworden;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel1
  - number: 1.1.l
    text: |-
      *NEN/ISO 9096:*door het Nederlands Normalisatie-Instituut uitgegeven norm «Emissie van stationaire bronnen;
      bepaling van de stofconcentratie en het stofdebiet in rook-/ proces- en uitlaatgassen; handmatige gravimetrische
      methode«, publicatiejaar 1994, met de daarop uitgegeven aanvullingen en correctie-bladen, zoals deze zijn
      medegedeeld in de Staatscourant, vanaf het moment dat deze volgens die mededeling van toepassing zijn geworden;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel1
  - number: 1.1.m
    text: '*Onze Minister*: Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel1
  - number: 1.1.n
    text: |-
      *wet*: [Waterwet][ref1].

      [ref1]: https://wetten.overheid.nl/BWBR0025458
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0025458
  - number: '1.2'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt onder vast object mede verstaan een demontabel object dat
      in of nabij een oppervlaktewaterlichaam wordt gereinigd of geconserveerd.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel1
  - number: '1.3'
    text: In dit besluit en de daarop berustende bepalingen wordt onder vast object niet begrepen een hoogspanningsmast.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel1
  - number: 1a
    text: |-
      Dit besluit berust op de [artikelen 6.2, eerste lid, onderdeel b][ref1], [6.6][ref2] en
      [6.7 van de Waterwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0025458
        artikel: '6'
  - number: '2.1'
    text: |-
      Stoffen zijn in [bijlage 3][ref1] behorende bij dit besluit ingedeeld in de categorieën A tot en met C.


      [ref1]: https://wetten.overheid.nl/BWBR0009355
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009355
  - number: '2.2'
    text: |-
      Bij de werkzaamheden te gebruiken technieken zijn in [bijlage 1][ref1] en [2][ref2] behorende bij dit besluit
      ingedeeld in de clusters 1 tot en met 7.


      [ref1]: https://wetten.overheid.nl/BWBR0009355
      [ref2]: https://wetten.overheid.nl/BWBR0009355
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009355
      - id: ref2
        bwb_id: BWBR0009355
  - number: '2.3'
    text: |-
      Werkzaamheden zijn in de [artikelen 3 tot en met 9][ref1] van dit besluit ingedeeld in de afschermingsklassen O tot
      en met VI.


      [ref1]: https://wetten.overheid.nl/BWBR0009355#Artikel3
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009355
        artikel: '3'
        hoofdstuk: I
        paragraaf: '1.2'
  - number: '3.1'
    text: 'In de afschermingsklasse 0 zijn de volgende werkzaamheden ingedeeld:'
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel3
  - number: 3.1.a
    text: werkzaamheden die niet in het kader van de uitoefening van beroep of bedrijf worden verricht in klasse I of II;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel3
  - number: 3.1.b
    text: 'reinigingswerkzaamheden met behulp van een techniek uit cluster 1, indien:'
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel3
  - number: 3.1.b.1°
    text: met deze reinigingswerkzaamheden wordt volstaan, of
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel3
  - number: 3.1.b.2°
    text: deze worden gevolgd door werkzaamheden in uitsluitend de afschermingsklasse 0, I of II, en
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel3
  - number: 3.1.c
    text: conserveringswerkzaamheden, waarbij een stof van categorie A wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel3
  - number: '3.2'
    text: |-
      Indien de afstand van het te behandelen deel van het oppervlak tot het wateroppervlak minder dan 50 cm bedraagt,
      zijn de volgende werkzaamheden in afschermingsklasse 0 ingedeeld:
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel3
  - number: 3.2.a
    text: 'reinigingswerkzaamheden met behulp van:'
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel3
  - number: 3.2.a.1°
    text: een techniek uit cluster 2, waarbij een stof van categorie A, B of C vrijkomt;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel3
  - number: 3.2.a.2°
    text: een techniek uit cluster 3, waarbij een stof van categorie A vrijkomt;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel3
  - number: 3.2.a.3°
    text: een techniek uit cluster 4.1, waarbij een stof van categorie A, B of C vrijkomt, en
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel3
  - number: 3.2.a.4°
    text: een techniek uit cluster 4.2, waarbij een stof van categorie A vrijkomt, en
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel3
  - number: 3.2.b
    text: |-
      conserveringswerkzaamheden met behulp van een techniek uit cluster 5, waarbij een stof uit categorie B of C wordt
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel3
  - number: '3.3'
    text: |-
      Indien sprake is van zware golfslag wordt in overleg met de beheerder het punt bepaald van waar af de 50 cm,
      bedoeld in het tweede lid, wordt gemeten.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel3
  - number: '4'
    text: |-
      In de afschermingsklasse I zijn de volgende werkzaamheden ingedeeld, waarbij de afstand van het te behandelen deel
      van het oppervlak tot het wateroppervlak gelijk is aan of groter is dan 50 cm:
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel4
  - number: 4.a
    text: |-
      reinigingswerkzaamheden met behulp van een techniek uit cluster 4.1, waarbij een stof uit categorie A, B of C
      vrijkomt, en
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel4
  - number: 4.b
    text: conserveringswerkzaamheden met behulp van een techniek uit cluster 5, waarbij een stof uit categorie B vrijkomt.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel4
  - number: '5'
    text: |-
      In de afschermingsklasse II zijn de volgende werkzaamheden ingedeeld, waarbij de afstand van het te behandelen deel
      van het oppervlak tot het wateroppervlak gelijk is aan of groter is dan 50 cm:
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel5
  - number: 5.a
    text: 'reinigingswerkzaamheden met behulp van:'
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel5
  - number: 5.a.1°
    text: een techniek uit cluster 2, waarbij een stof uit categorie A, B of C vrijkomt;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel5
  - number: 5.a.2°
    text: een techniek uit cluster 3, waarbij een stof uit categorie A vrijkomt, en
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel5
  - number: 5.b
    text: |-
      conserveringswerkzaamheden met behulp van een techniek uit cluster 5, waarbij een stof uit categorie C wordt
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel5
  - number: '6'
    text: 'In de afschermingsklasse III zijn reinigingswerkzaamheden ingedeeld met behulp van:'
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel6
  - number: 6.a
    text: |-
      een techniek uit cluster 3, waarbij een stof uit categorie A vrijkomt en waarbij smeltslakgrit of een mineraal
      straalmiddel wordt gebruikt, en
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel6
  - number: 6.b
    text: |-
      een techniek uit cluster 4.2, waarbij een stof uit categorie A vrijkomt en waarbij de afstand van het te behandelen
      deel van het oppervlak tot het wateroppervlak gelijk is aan of groter is dan 50 cm.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel6
  - number: '7'
    text: 'In de afschermingsklasse IV zijn de volgende werkzaamheden ingedeeld:'
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel7
  - number: 7.a
    text: 'reinigingswerkzaamheden met behulp van:'
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel7
  - number: 7.a.1°
    text: een techniek uit cluster 3, waarbij een stof uit categorie B vrijkomt, en
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel7
  - number: 7.a.2°
    text: |-
      een techniek uit cluster 4.2, waarbij een stof uit categorie B vrijkomt en waarbij een metallisch straalmiddel
      wordt gebruikt, en
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel7
  - number: 7.b
    text: |-
      conserveringswerkzaamheden met behulp van een techniek uit cluster 6, waarbij een stof uit categorie B wordt
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel7
  - number: '8'
    text: 'In de afschermingsklasse V zijn de volgende werkzaamheden ingedeeld:'
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel8
  - number: 8.a
    text: 'reinigingswerkzaamheden met behulp van:'
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel8
  - number: 8.a.1°
    text: een techniek uit cluster 3, waarbij een stof uit categorie C vrijkomt;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel8
  - number: 8.a.2°
    text: |-
      een techniek uit cluster 4.2, waarbij een stof uit categorie B vrijkomt en waarbij smeltslakgrit of een mineraal
      straalmiddel wordt gebruikt, en
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel8
  - number: 8.a.3°
    text: |-
      een techniek uit cluster 4.2, waarbij een stof uit categorie C vrijkomt en waarbij een metallisch straalmiddel
      wordt gebruikt, en
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel8
  - number: 8.b
    text: 'conserveringswerkzaamheden met behulp van:'
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel8
  - number: 8.b.1°
    text: een techniek uit cluster 6 en een stof uit categorie C wordt gebruikt, en
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel8
  - number: 8.b.2°
    text: een techniek uit cluster 7, waarbij een stof uit categorie B wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel8
  - number: '9'
    text: 'In de afschermingsklasse VI zijn de volgende werkzaamheden ingedeeld:'
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel9
  - number: 9.a
    text: |-
      reinigingswerkzaamheden met behulp van een techniek uit cluster 4.2, waarbij een stof uit categorie C vrijkomt en
      waarbij smeltslakgrit of een mineraal straalmiddel wordt gebruikt, en
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel9
  - number: 9.b
    text: |-
      conserveringswerkzaamheden met behulp van een techniek uit cluster 7, waarbij een stof uit categorie C wordt
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel9
  - number: '10'
    text: |-
      De voorschriften die bij dit besluit zijn gesteld, alsmede de krachtens deze voorschriften gestelde nadere eisen,
      zijn van toepassing op het in een oppervlaktewaterlichaam brengen van stoffen in het kader van reinigings- of
      conserveringswerkzaamheden aan vaste objecten.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel10
  - number: '11.1'
    text: |-
      Bij werkzaamheden als bedoeld in [artikel 10][ref1], wordt voldaan aan de voorschriften die bij dit besluit zijn
      gesteld, alsmede aan de krachtens deze voorschriften gestelde nadere eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009355#Artikel10
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009355
        artikel: '10'
        hoofdstuk: II
  - number: '11.2'
    text: |-
      Vrijstelling wordt verleend van het verbod, bedoeld in [artikel 6.2, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
  - number: '12.1'
    text: Het in een oppervlaktewaterlichaam brengen van stoffen bij reinigingsen conserveringswerkzaamheden is verboden.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel12
  - number: '12.2'
    text: |-
      Het verbod in het eerste lid geldt niet, indien het in een oppervlaktewaterlichaam brengen van stoffen plaatsvindt
      in het kader van werkzaamheden waarvoor in de [artikelen 13 tot en met 27][ref1] voorschriften zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009355#Artikel13
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009355
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3.1'
  - number: '13.1'
    text: |-
      Bij reinigings- en conserveringswerkzaamheden neemt een ieder voldoende zorg in acht ter bescherming van de
      kwaliteit van een oppervlaktewaterlichaam.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel13
  - number: '13.2'
    text: |-
      De zorg, bedoeld in het eerste lid, houdt in ieder geval in dat een ieder die weet of redelijkerwijs kan vermoeden
      dat door zijn handelen of nalaten nadelige gevolgen voor een oppervlaktewaterlichaam kunnen worden veroorzaakt,
      verplicht is dergelijk handelen achterwege te laten voor zover zulks in redelijkheid kan worden gevergd, dan wel
      alle maatregelen te nemen die redelijkerwijs van hem kunnen worden gevergd teneinde die gevolgen te voorkomen of,
      voor zover die gevolgen niet kunnen worden voorkomen, deze zoveel mogelijk te beperken of ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel13
  - number: '14.1'
    text: |-
      Indien een installatie wordt gebruikt die olie bevat, is de installatie in een vloeistofdichte bak geplaatst,
      waarvan het volume voldoende is om de in de installatie aanwezige olie te bergen.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel14
  - number: '14.2'
    text: De in de bak aanwezige vloeistof wordt dagelijks verwijderd.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel14
  - number: '14.3'
    text: De bak is zodanig afgedekt dat geen regenwater in de bak kan geraken.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel14
  - number: '14.4'
    text: De bak staat niet in directe verbinding met een oppervlaktewaterlichaam.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel14
  - number: '15'
    text: |-
      Bij een beweegbare brug zijn zichtbare verontreinigingen van de vloer van de hulpconstructie verwijderd alvorens de
      brug wordt geopend.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel15
  - number: '16.1'
    text: 'Voor de afschermingsklassen I tot en met VI gelden de volgende voorschriften:'
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel16
  - number: 16.1.a
    text: er is een hulpconstructie voor de gehele duur van de werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel16
  - number: 16.1.b
    text: de vloer van de hulpconstructie is voorzien van opstaande randen met een hoogte van ten minste 20 cm;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel16
  - number: 16.1.c
    text: de vloer is stofdicht;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel16
  - number: 16.1.d
    text: |-
      dagelijks, na beëindiging van de werkzaamheden of zoveel eerder als noodzakelijk is, worden de op de vloer
      achtergebleven stoffen verzameld en naar een verzamelplaats afgevoerd;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel16
  - number: 16.1.e
    text: smeeroliën en vetten worden verwijderd met behulp van plamuurmessen dan wel met een met ontvetter bevochtigde doek;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel16
  - number: 16.1.f
    text: |-
      degene die loost ten behoeve van reinigingswerkzaamheden draagt er zorg voor dat het gehalte aan stoffen in
      ontvetters zodanig is, dat de nadelige gevolgen voor de kwaliteit van een oppervlaktewaterlichaam zoveel mogelijk
      worden beperkt, en
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel16
  - number: 16.1.g
    text: opslag van straalmiddelen vindt plaats in afgesloten containers.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel16
  - number: '16.2'
    text: |-
      De beheerder kan nadere eisen stellen ten aanzien van het bepaalde in het eerste lid; daarbij kan slechts worden
      voorgeschreven:
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel16
  - number: 16.2.a
    text: |-
      dat het gehalte aan stoffen in ontvetters bij het lozen een bij die nadere eis aangegeven waarde niet mag
      overschrijden, of
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel16
  - number: 16.2.b
    text: |-
      dat het gehalte aan stoffen in ontvetters wordt bepaald met een daarbij aan te geven meetfrequentie,
      meetvoorschrift of analysemethode.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel16
  - number: '17.1'
    text: |-
      Indien afvalwater vrijkomt bij werkzaamheden van de afschermingsklassen II tot en met VI, zijn voorts de volgende
      voorschriften van toepassing:
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel17
  - number: 17.1.a
    text: de vloer van de hulpconstructie is vloeistofdicht;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel17
  - number: 17.1.b
    text: |-
      de vloer is zodanig geconstrueerd dat er sprake is van een vrije afstroming van afvalwater naar één of meer in de
      vloer aanwezige afvoerpunten;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel17
  - number: 17.1.c
    text: het afvalwater wordt vanaf de afvoerpunten lekdicht naar een bezinkbassin geleid;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel17
  - number: 17.1.d
    text: |-
      na het doorlopen van het bezinkbassin bedraagt het gehalte aan onopgeloste bestanddelen in het effluent ten hoogste
      50 mg/l; dit gehalte wordt niet door verdunning bereikt, en
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel17
  - number: 17.1.e
    text: |-
      teneinde het gehalte aan onopgeloste bestanddelen, bedoeld in onderdeel d, te bepalen neemt degene die loost, op de
      eerste dag van de werkzaamheden, een steekmonster van het effluent en rapporteert de resultaten van de analyse zo
      spoedig mogelijk aan de beheerder.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel17
  - number: '17.2'
    text: De analyse van het steekmonster, bedoeld in het eerste lid, onderdeel e, wordt uitgevoerd volgens NEN 6621.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel17
  - number: '17.3'
    text: |-
      Het bezinksel wordt uit het bezinkbassin, bedoeld in het eerste lid, verwijderd, zo dikwijls als voor de goede
      werking van dat bassin noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel17
  - number: '17.4'
    text: Het bezinksel en de bij de verwijdering daarvan vrijkomende afvalstoffen mogen niet worden geloosd.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel17
  - number: '18'
    text: |-
      Onverminderd [paragraaf 3.1][ref1]., gelden voor de afschermingsklasse 0 de volgende voorschriften:


      [ref1]: https://wetten.overheid.nl/BWBR0009355#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009355
        hoofdstuk: III
        paragraaf: '3.1'
  - number: 18.a
    text: |-
      bij reinigingswerkzaamheden die in het kader van de uitoefening van beroep of bedrijf worden verricht wordt
      uitsluitend water gebruikt, zonder toevoeging van ontvetters;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel18
  - number: 18.b
    text: |-
      loszittende verfdelen worden vóór aanvang van de werkzaamheden verwijderd; deze verfdelen en de bij de verwijdering
      vrijkomende stoffen worden opgevangen en naar een verzamelplaats afgevoerd;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel18
  - number: 18.c
    text: werkzaamheden worden uitgevoerd bij een windkracht lager dan 4 op de schaal van Beaufort, en
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel18
  - number: 18.d
    text: |-
      indien bij de uitvoering van de werkzaamheden een werkplatvorm wordt gebruikt, voldoet de vloer van het
      werkplatvorm aan de voorschriften voor een vloer van een hulpconstructie, gesteld in [paragraaf 3.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009355#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009355
        hoofdstuk: III
        paragraaf: '3.1'
  - number: '19'
    text: |-
      Onverminderd [paragraaf 3.1][ref1]., gelden voor de afschermingsklasse I de volgende voorschriften:


      [ref1]: https://wetten.overheid.nl/BWBR0009355#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009355
        hoofdstuk: III
        paragraaf: '3.1'
  - number: 19.a
    text: er is een vloer, die aan alle zijden ten minste 2m uitsteekt buiten het te behandelen object, en
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel19
  - number: 19.b
    text: werkzaamheden worden uitgevoerd bij een windkracht lager dan 4 op de schaal van Beaufort.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel19
  - number: '20'
    text: |-
      Onverminderd [paragraaf 3.1][ref1]., gelden voor de afschermingsklasse II de volgende voorschriften:


      [ref1]: https://wetten.overheid.nl/BWBR0009355#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009355
        hoofdstuk: III
        paragraaf: '3.1'
  - number: 20.a
    text: de hulpconstructie heeft zijwanden van gaasnetten met een maaswijdte van ten hoogste 0,4 mm bij 0,4 mm of zeilen;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel20
  - number: 20.b
    text: de zijwanden van de hulpconstructie bevinden zich tot 1m boven het te behandelen deel van het object, en
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel20
  - number: 20.c
    text: werkzaamheden worden uitgevoerd bij een windkracht lager dan 6 op de schaal van Beaufort.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel20
  - number: '21'
    text: |-
      Onverminderd [paragraaf 3.1][ref1]., gelden voor de afschermingsklasse III de volgende voorschriften:


      [ref1]: https://wetten.overheid.nl/BWBR0009355#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0009355
        hoofdstuk: III
        paragraaf: '3.1'
  - number: 21.a
    text: een hulpconstructie omsluit de ruimte waarin wordt gewerkt volledig;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel21
  - number: 21.b
    text: |-
      de hulpconstructie heeft zij- en bovenwanden van gaasnetten met een maaswijdte van ten hoogste 0,4 mm bij 0,4 mm of
      zeilen, en
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel21
  - number: 21.c
    text: werkzaamheden worden uitgevoerd bij een windkracht lager dan 6 op de schaal van Beaufort.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel21
  - number: '22'
    text: |-
      Onverminderd [paragraaf 3.1][ref1], gelden voor de afschermingsklasse IV de volgende voorschriften:


      [ref1]: https://wetten.overheid.nl/BWBR0009355#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009355
        hoofdstuk: III
        paragraaf: '3.1'
  - number: 22.a
    text: een hulpconstructie omsluit de ruimte waarin wordt gewerkt volledig;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel22
  - number: 22.b
    text: |-
      de zij- en bovenwanden van de hulpconstructie zijn vloeistofdicht en sluiten vloeistofdicht op elkaar aan, indien
      werkzaamheden worden uitgevoerd met behulp van een techniek uit cluster 3 of 6;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel22
  - number: 22.c
    text: |-
      de zij- en bovenwanden van de hulpconstructie zijn winddicht en sluiten winddicht op elkaar aan, indien
      werkzaamheden worden uitgevoerd met behulp van een techniek uit cluster 4.2;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel22
  - number: 22.d
    text: |-
      indien de hulpconstructie deel uitmaakt van het vaste object en werkzaamheden worden uitgevoerd met behulp van een
      techniek uit cluster 3 of 6, sluit de hulpconstructie daarop vloeistofdicht aan en zodanig dat geen stoffen tussen
      de opstaande randen van de vloer en de wanden van de hulpconstructie kunnen geraken, en
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel22
  - number: 22.e
    text: |-
      indien de hulpconstructie deel uitmaakt van het vaste object en werkzaamheden worden uitgevoerd met behulp van
      een techniek uit cluster 4.2, sluit de hulpconstructie daarop winddicht aan en zodanig dat geen stoffen tussen de
      opstaande randen van de vloer en de wanden van de hulpconstructie kunnen geraken.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel22
  - number: '23.1'
    text: |-
      Onverminderd [paragraaf 3.1][ref1], gelden voor de afschermingsklasse V de volgende voorschriften:


      [ref1]: https://wetten.overheid.nl/BWBR0009355#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009355
        hoofdstuk: III
        paragraaf: '3.1'
  - number: 23.1.a
    text: een hulpconstructie omsluit de ruimte waarin wordt gewerkt volledig;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel23
  - number: 23.1.b
    text: |-
      de zij- en bovenwanden van de hulpconstructie zijn vloeistofdicht en sluiten vloeistofdicht op elkaar aan, indien
      werkzaamheden worden uitgevoerd met behulp van een techniek uit cluster 3, 6 of 7;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel23
  - number: 23.1.c
    text: |-
      de zij- en bovenwanden van de hulpconstructie zijn winddicht en sluiten winddicht op elkaar aan, indien
      werkzaamheden worden uitgevoerd met behulp van een techniek uit cluster 4.2;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel23
  - number: 23.1.d
    text: |-
      indien de hulpconstructie deel uitmaakt van het vaste object en werkzaamheden worden uitgevoerd met behulp van een
      techniek uit cluster 3, 6 of 7, sluit de hulpconstructie op het vaste object vloeistofdicht aan en zodanig dat geen
      stoffen tussen de opstaande randen van de vloer en de wanden van de hulpconstructie kunnen geraken;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel23
  - number: 23.1.e
    text: |-
      indien de hulpconstructie deel uitmaakt van het vaste object en werkzaamheden worden uitgevoerd met behulp van een
      techniek uit cluster 4.2, sluit de hulpconstructie op het vaste object winddicht aan en zodanig dat geen stoffen
      tussen de opstaande randen van de vloer en de wanden van de hulpconstructie kunnen geraken, en
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel23
  - number: 23.1.f
    text: |-
      indien in de hulpconstructie lucht wordt afgezogen, bedraagt het stofgehalte van de geëmitteerde lucht niet meer
      dan 10 mg/Nm3.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel23
  - number: '23.2'
    text: Het stofgehalte bedoeld in het eerste lid, onderdeel f, wordt bepaald volgens NEN/ISO 9096.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel23
  - number: '23.3'
    text: |-
      [Artikel 16, eerste lid, onderdeel d][ref1], is niet van toepassing op straalmiddelen met een klimatiserende
      functie die worden gebruikt bij werkzaamheden met behulp van een techniek uit cluster 4.2.


      [ref1]: https://wetten.overheid.nl/BWBR0009355#Artikel16
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009355
        artikel: '16'
        hoofdstuk: III
        paragraaf: '3.1'
  - number: '24.1'
    text: |-
      Onverminderd [paragraaf 3.1][ref1], gelden voor de afschermingsklasse VI de volgende voorschriften:


      [ref1]: https://wetten.overheid.nl/BWBR0009355#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0009355
        hoofdstuk: III
        paragraaf: '3.1'
  - number: 24.1.a
    text: een hulpconstructie omsluit de ruimte waarin wordt gewerkt volledig;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel24
  - number: 24.1.b
    text: de zij- en bovenwanden van de hulpconstructie zijn stofdicht;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel24
  - number: 24.1.c
    text: |-
      de wanden van de hulpconstructie sluiten stofdicht op elkaar aan en zodanig dat geen stoffen tussen de opstaande
      randen van de vloer en de wanden van de hulpconstructie kunnen geraken;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel24
  - number: 24.1.d
    text: |-
      indien de hulpconstructie deel uitmaakt van het vaste object, sluit de hulpconstructie op het vaste object
      stofdicht aan en zodanig dat geen stoffen tussen de opstaande randen van de vloer en de wanden van de
      hulpconstructie kunnen geraken;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel24
  - number: 24.1.e
    text: |-
      indien in de hulpconstructie wordt afgezogen bedraagt het stofgehalte van de geëmitteerde lucht niet meer dan 10
      mg/N m3, en
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel24
  - number: 24.1.f
    text: binnen de hulpconstructie is tijdens reinigingswerkzaamheden sprake van een permanente onderdruk.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel24
  - number: '24.2'
    text: Het stofgehalte bedoeld in het eerste lid, onderdeel e, wordt bepaald volgens NEN/ISO 9096.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel24
  - number: '24.3'
    text: |-
      [Artikel 16, eerste lid, onderdeel d][ref1], is niet van toepassing op straalmiddelen met een klimatiserende
      functie die worden gebruikt bij werkzaamheden met behulp van een techniek uit cluster 4.2.


      [ref1]: https://wetten.overheid.nl/BWBR0009355#Artikel16
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0009355
        artikel: '16'
        hoofdstuk: III
        paragraaf: '3.1'
  - number: '25.1'
    text: |-
      Bij werkzaamheden aan spoorbruggen is van de [artikelen 21][ref1] en [22][ref2] telkens onderdeel a en van de
      [artikelen 23][ref3] en [24][ref4] telkens het eerste lid, onderdeel a, niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009355#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0009355#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0009355#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0009355#Artikel24
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0009355
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0009355
        artikel: '22'
        hoofdstuk: III
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0009355
        artikel: '23'
        hoofdstuk: III
        paragraaf: '3.2'
      - id: ref4
        bwb_id: BWBR0009355
        artikel: '24'
        hoofdstuk: III
        paragraaf: '3.2'
  - number: '25.2'
    text: |-
      De hulpconstructie bevat geen bovenwand en aan de in- en uitrijrichting geen zijwand. De zijwanden van de
      hulpconstructie bevinden zich tot twee meter boven het te behandelen deel van het object.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel25
  - number: '26.1'
    text: |-
      Bij werkzaamheden aan vaste objecten in direct contact met het water van een oppervlaktewaterlichaam of
      bij werkzaamheden aan het beweegbare deel van vaste objecten, zoals bruggen of aanlegsteigers, is van de
      [artikelen 21][ref1] en [22][ref2] telkens onderdeel a en van de [artikelen 23][ref3] en [24][ref4] telkens het
      eerste lid, onderdeel a, niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009355#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0009355#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0009355#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0009355#Artikel24
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0009355
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0009355
        artikel: '22'
        hoofdstuk: III
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0009355
        artikel: '23'
        hoofdstuk: III
        paragraaf: '3.2'
      - id: ref4
        bwb_id: BWBR0009355
        artikel: '24'
        hoofdstuk: III
        paragraaf: '3.2'
  - number: '26.2'
    text: De hulpconstructie omsluit de ruimte waarin wordt gewerkt zoveel als mogelijk.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel26
  - number: '26.3'
    text: |-
      De beheerder kan nadere eisen stellen ten aanzien van de mate waarin en de wijze waarop de hulpconstructie de
      ruimte omsluit.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel26
  - number: '27.1'
    text: |-
      Bij werkzaamheden aan hoge, smalle vaste objecten, zoals kranen, waar door het aanbrengen van een hulpconstructie
      het object beperkt stabiel wordt, is van de [artikelen 21][ref1] en [22][ref2] telkens onderdeel a en van de
      [artikelen 23][ref3] en [24][ref4] telkens het eerste lid, onderdeel a, niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009355#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0009355#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0009355#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0009355#Artikel24
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0009355
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0009355
        artikel: '22'
        hoofdstuk: III
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0009355
        artikel: '23'
        hoofdstuk: III
        paragraaf: '3.2'
      - id: ref4
        bwb_id: BWBR0009355
        artikel: '24'
        hoofdstuk: III
        paragraaf: '3.2'
  - number: '27.2'
    text: De hulpconstructie omsluit de ruimte waarin wordt gewerkt zoveel als mogelijk.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel27
  - number: '27.3'
    text: |-
      De beheerder kan nadere eisen stellen ten aanzien de mate waarin en de wijze waarop de hulpconstructie de ruimte
      omsluit.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel27
  - number: '28.1'
    text: |-
      De eigenaar of beheerder van het vaste object die voornemens is werkzaamheden te verrichten en in dit kader
      te lozen onderscheidenlijk het lozen te veranderen, meldt dit voornemen ten minste zes weken voordat met de
      werkzaamheden onderscheidenlijk het veranderen van lozen in het kader van de werkzaamheden wordt aangevangen aan de
      beheerder binnen wiens gebied de werkzaamheden zullen plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel28
  - number: '28.2'
    text: 'Een melding als bedoeld in het eerste lid wordt schriftelijk gedaan en omvat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel28
  - number: 28.2.a
    text: naam, adres en telefoonnummer van degene die meldt;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel28
  - number: 28.2.b
    text: |-
      naam, adres en telefoonnummer van degene die de feitelijke leiding heeft bij de werkzaamheden alsmede van de
      aangewezen contactpersoon;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel28
  - number: 28.2.c
    text: locatie van het vaste object met een plattegrond;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel28
  - number: 28.2.d
    text: naam van het ontvangende oppervlaktewaterlichaam;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel28
  - number: 28.2.e
    text: beschrijving van aard, aanvang en duur van de werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel28
  - number: 28.2.f
    text: aanduiding van het soort vaste object;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel28
  - number: 28.2.g
    text: aanduiding van de afmeting van het vaste object;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel28
  - number: 28.2.h
    text: opsomming van de onderdelen van het vaste object die moeten worden behandeld;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel28
  - number: 28.2.i
    text: een tekening van de hulpconstructie;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel28
  - number: 28.2.j
    text: aanduiding van het materiaal waarvan de hulpconstructie is vervaardigd en hoe de afdichting wordt gerealiseerd;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel28
  - number: 28.2.k
    text: naam van toe te passen straalmiddelen, reinigings- of conserveringsmiddelen;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel28
  - number: 28.2.l
    text: de hoeveelheid toe te passen ontvetters;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel28
  - number: 28.2.m
    text: 'bij gebruik van een bezinkbassin: aanduiding van het type en de afmeting;'
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel28
  - number: 28.2.n
    text: 'bij gebruik van een luchtfilterinstallatie: aanduiding van het type en de capaciteit;'
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel28
  - number: 28.2.o
    text: |-
      gegevens over het voorgenomen lozen onderscheidenlijk het voorgenomen veranderde lozen, waaruit de omvang blijkt en
      welke stoffen worden geloosd, en
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel28
  - number: 28.2.p
    text: |-
      gegevens over de opslag van reinigings- of straalmiddelen op het vaste object en over de verwijdering van gebruikte
      stoffen vanaf het vaste object.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel28
  - number: '30.1'
    text: |-
      Indien zich bij werkzaamheden een ongewoon voorval voordoet of heeft voorgedaan waardoor nadelige gevolgen voor
      de kwaliteit van het ontvangende oppervlaktewaterlichaam zijn ontstaan of dreigen te ontstaan, treft degene die
      loost onmiddellijk de maatregelen die redelijkerwijs van hem kunnen worden verlangd om de gevolgen van het voorval
      te voorkomen of, voor zover die gevolgen niet kunnen worden voorkomen, zoveel mogelijk te beperken en ongedaan
      te maken.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel30
  - number: '30.2'
    text: |-
      Indien zich een voorval als bedoeld in het eerste lid, voordoet of heeft voorgedaan, maakt degene die loost zo
      spoedig mogelijk, doch uiterlijk binnen 8 uur, melding van dat voorval aan de beheerder binnen wiens gebied het
      lozen heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel30
  - number: '30.3'
    text: |-
      Bij de in het tweede lid bedoelde melding worden tevens, zodra zij bekend zijn, gegevens verstrekt met betrekking
      tot:
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel30
  - number: 30.3.a
    text: de oorzaak van het voorval en de omstandigheden waaronder het voorval zich heeft voorgedaan;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel30
  - number: 30.3.b
    text: de ten gevolge van het voorval vrijgekomen stoffen, alsmede hun eigenschappen;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel30
  - number: 30.3.c
    text: |-
      de gegevens die van belang zijn om de aard en de ernst van de gevolgen van het voorval voor het ontvangende
      oppervlaktewaterlichaam te kunnen beoordelen;
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel30
  - number: 30.3.d
    text: |-
      de maatregelen die zijn genomen of worden overwogen om de gevolgen van het voorval te voorkomen, te beperken of
      ongedaan te maken, en
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel30
  - number: 30.3.e
    text: de maatregelen die worden overwogen om te voorkomen dat een zodanig voorval zich nogmaals kan voordoen.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel30
  - number: '30.4'
    text: |-
      De beheerder geeft van de in het tweede lid bedoelde melding en de daarbij ingevolge het derde lid verstrekte
      gegevens onverwijld kennis aan de burgemeesters van de betrokken gemeenten.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel30
  - number: '30.5'
    text: |-
      Indien zich een ongewoon voorval of uitzonderlijke omstandigheid buiten de plaats waar de werkzaamheden worden
      verricht, voordoet of heeft voorgedaan en de beheerder maatregelen van tijdelijke aard voorschrijft ter voorkoming
      van ernstige verontreiniging van een oppervlaktewaterlichaam, is degene die loost verplicht deze maatregelen
      onverwijld te treffen.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel30
  - number: '31'
    text: |-
      Van de beschikking waarbij een nadere eis wordt gesteld krachtens dit besluit, wordt mededeling gedaan door
      kennisgeving in één of meer dag-, nieuws- of huis-aan-huisbladen.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel31
  - number: '34.1'
    text: |-
      Dit besluit treedt in werking met ingang van de eerste dag van de tweede kalendermaand na de datum van uitgifte van
      het Staatsblad waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel34
  - number: '34.2'
    text: Artikel 29 treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel34
  - number: '35'
    text: 'Dit besluit wordt aangehaald als: Lozingenbesluit Wvo vaste objecten.'
    url: https://wetten.overheid.nl/BWBR0009355/2009-12-22#Artikel35
