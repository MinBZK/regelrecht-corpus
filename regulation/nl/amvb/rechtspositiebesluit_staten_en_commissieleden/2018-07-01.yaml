    text: |-
      1 De [artikelen 2 tot en met 4][ref1] en [6a tot en met 12][ref2] van dit besluit zijn van overeenkomstige
      toepassing op het lid van provinciale staten aan wie ingevolge [artikel X 10 van de Kieswet][ref3] tijdelijk
      ontslag is verleend wegens zwangerschap en bevalling of ziekte, met dien verstande dat:

      a. de onkostenvergoeding die dit lid op grond van [artikel 2, derde of vierde lid][ref4], ontvangt, de helft
      bedraagt van het bedrag dat op grond van die bepalingen van toepassing is;

      b. indien door provinciale staten toepassing is gegeven aan [artikel 4][ref5], dit lid een uitkering ontvangt voor
      alle vergaderingen die gedurende het tijdelijk ontslag plaatsvinden of hebben plaatsgevonden.

      2 Een tijdelijk ontslag als bedoeld in [artikel X 10 van de Kieswet][ref6] wordt niet aangemerkt als beëindiging
      van het lidmaatschap van provinciale staten als bedoeld in [artikel 7, tweede en derde lid][ref7], en als aftreden
      als bedoeld in [artikel 8][ref8].


