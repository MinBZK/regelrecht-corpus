  - number: '5'
    text: |-
      1 Aan een lid van provinciale staten wordt vergoeding van reiskosten verleend naar bij provinciale verordening
      te stellen regels voor het bijwonen van vergaderingen van provinciale staten en van commissies of een Openbaar-
      Vervoerjaarkaart verstrekt dan wel een keuze tussen een vergoeding of een Openbaar-Vervoerjaarkaart geboden, met
      dien verstande dat voor het gebruik van een eigen motorvoertuig de vergoeding niet hoger wordt gesteld dan het
      bedrag dat bij of krachtens [artikel 7 van het Reisbesluit binnenland][ref1] is vastgesteld.

      2 Aan een lid van provinciale staten wordt vergoeding van werkelijk gemaakte verblijfkosten verleend naar bij
      provinciale verordening te stellen regels voor het bijwonen van vergaderingen, genoemd in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005889#Artikel7
    url: https://wetten.overheid.nl/BWBR0006534/2018-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005889
        artikel: '7'
  - number: '6'
    text: |-
      1 Provinciale staten kunnen bij verordening bepalen dat aan een lid van provinciale staten naast de vergoeding,
      genoemd in [artikel 5][ref1], vergoeding wordt verleend voor reiskosten ter zake van andere dan de in
      [artikel 5][ref2] bedoelde reizen, ten behoeve van de provincie gemaakt, met dien verstande dat voor het
      gebruik van een eigen motorvoertuig de vergoeding niet hoger wordt gesteld dan het bedrag dat bij of krachtens
      [artikel 7 van het Reisbesluit binnenland][ref3] is vastgesteld.

      2 Provinciale staten kunnen bij verordening bepalen dat aan een lid van provinciale staten vergoeding wordt
      verleend voor werkelijk gemaakte verblijfkosten ter zake van reizen, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006534#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006534#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005889#Artikel7
    url: https://wetten.overheid.nl/BWBR0006534/2018-07-01#Artikel6
