articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      b. lid van provinciale staten: een lid van provinciale staten, dat niet tevens lid van gedeputeerde staten is;

      c. tijdstip van beëindiging van het lidmaatschap van provinciale staten: het tijdstip van beëindiging
      van het lidmaatschap, bedoeld in de [artikelen X1, eerste en derde lid][ref1], [X6][ref2] en
      [X7, tweede, derde en vijfde lid, van de Kieswet][ref3].

      d. lid van een commissie: een lid van een commissie als bedoeld in de [artikelen 80][ref4], [81][ref5] en
      [82 van de Provinciewet][ref6], dat niet tevens lid van provinciale staten is of ambtenaar die als zodanig tot lid
      van een commissie is benoemd.


