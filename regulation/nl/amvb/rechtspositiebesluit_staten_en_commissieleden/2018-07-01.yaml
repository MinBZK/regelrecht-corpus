  - number: '11'
    text: |-
      1 In het geval een staten- of commissielid een uitkering op grond van de [Werkloosheidswet][ref1] ontvangt en de na
      toepassing van [artikel 20 van die wet][ref2] ontstane korting op deze uitkering ten gevolge van het uitoefenen van
      het staten- of commissielidmaatschap meer bedraagt dan de vergoeding voor de werkzaamheden wordt deze vergoeding
      ten laste van de provincie verhoogd tot het bedrag van bedoelde korting.

      2 In het geval een staten- of commissielid een uitkering op grond van het
      [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref3] ontvangt en de na toepassing van
      [artikel 6, vierde lid, van dat besluit][ref4] ontstane korting op deze uitkering ten gevolge van het uitoefenen
      van de functie van staten- of commissielid meer bedraagt dan de vergoeding voor de werkzaamheden wordt deze
      vergoeding ten laste van de provincie verhoogd tot het bedrag van bedoelde korting.

      3 In het geval een staten- of commissielid een uitkering in verband met gehele of gedeeltelijke
      arbeidsongeschiktheid ontvangt, kan de vergoeding voor de werkzaamheden op verzoek van het desbetreffende staten-
      of commissielid worden verlaagd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0006445
      [ref4]: https://wetten.overheid.nl/BWBR0006445#Artikel6
