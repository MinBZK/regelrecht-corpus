        artikel: X_12
  - number: '10'
    text: |-
      1 Een statenlid ontvangt ten laste van de provincie een tegemoetkoming in de kosten van een ziektekostenverzekering
      van € 103,98 per jaar.

      2 Het in het eerste lid genoemde bedrag wordt bij ministeriële regeling gewijzigd overeenkomstig de wijzigingen die
      de bezoldiging van het personeel in de sector Rijk ondergaat.
    url: https://wetten.overheid.nl/BWBR0006534/2018-07-01#Artikel10
  - number: 10a
    text: |-
      Ten aanzien van individuele gevallen kunnen gedeputeerde staten [artikel 10, eerste lid][ref1],
      buiten toepassing laten of daarvan afwijken voor zover toepassing van de in het
      __REF001___________________________________________________________________________________________________________
      ____ (Stb. 2014, 431) aan dit artikellid verleende terugwerkende kracht, zal leiden tot een onbillijkheid van
      overwegende aard.


      [ref1]: https://wetten.overheid.nl/BWBR0006534#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0035749
    url: https://wetten.overheid.nl/BWBR0006534/2018-07-01#Artikel10a
