  - number: '2'
    text: |-
      1 Aan een lid van provinciale staten wordt een vergoeding voor de werkzaamheden toegekend die € 1.163,75 per maand
      bedraagt.

      2 Het bedrag van de vergoeding voor de werkzaamheden wordt per 1 januari van elk jaar bij ministeriële regeling
      gewijzigd aan de hand van het door het Centraal Bureau voor de Statistiek voor de maand september van het
      voorafgaande kalenderjaar vastgestelde indexcijfer CAO lonen overheid, inclusief bijzondere beloningen.

      3 Aan een lid van provinciale staten wordt een onkostenvergoeding voor aan de uitoefening van het
      statenlidmaatschap verbonden kosten toegekend die € 170,17 per maand bedraagt.

      4 Het bedrag, genoemd in het derde lid, wordt per 1 januari van elk jaar bij ministeriële regeling gewijzigd aan de
      hand van de consumentenprijsindex geldend voor de maand september van het voorafgaande kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006534/2018-07-01#Artikel2
  - number: '4'
    text: |-
      Provinciale staten kunnen bij verordening bepalen dat ten hoogste 20% van de vergoeding voor de werkzaamheden wordt
      uitgekeerd, berekend naar het aantal gehouden vergaderingen. In dat geval geschiedt de uitkering aan het lid van
      provinciale staten op basis van het aantal bijgewoonde vergaderingen.
    url: https://wetten.overheid.nl/BWBR0006534/2018-07-01#Artikel4
  - number: 4a
    text: |-
      1 Aan een lid van provinciale staten dat lid is van de vertrouwenscommissie, bedoeld in
      [artikel 61, derde lid, van de Provinciewet][ref1] dan wel de rekenkamerfunctie, bedoeld in
      [artikel 79p van de Provinciewet][ref2], uitoefent dan wel lid is van de onderzoekscommissie als bedoeld in
      [artikel 151a, derde lid, van de Provinciewet][ref3], wordt voor de duur van het lidmaatschap van de commissie dan
      wel de duur van de activiteiten per jaar ten laste van de provincie een toelage verleend van 5% van de vergoeding
      voor de werkzaamheden op jaarbasis.

      2 Voor de toepassing van het eerste lid stelt de commissaris de duur van het lidmaatschap van de commissie dan wel
      de duur van de activiteiten vast.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel79p
      [ref3]: https://wetten.overheid.nl/BWBR0005645#Artikel151a
    url: https://wetten.overheid.nl/BWBR0006534/2018-07-01#Artikel4a
