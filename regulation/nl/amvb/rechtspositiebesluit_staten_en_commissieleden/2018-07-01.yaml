        hoofdstuk: '3'
      - id: ref6
        bwb_id: BWBR0006534
        artikel: '12'
        hoofdstuk: '3'
  - number: 12b
    text: |-
      Indien gedeputeerde staten ten behoeve van een veilige woon- en werkplek van een statenlid kosten maken, die in
      het kader van het stelsel bewaken en beveiligen zijn aangemerkt als werkgeverskosten, komen deze ten laste van
      de provincie.
    url: https://wetten.overheid.nl/BWBR0006534/2018-07-01#Artikel12b
  - number: '13'
    text: |-
      Aan een lid van een commissie wordt ten laste van de provincie een vergoeding voor het bijwonen van de
      vergaderingen van de commissie toegekend van € 112,25 per vergadering. De [artikelen 2, tweede lid][ref1],
      [6a][ref2][11][ref3], [12][ref4] en [12b][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006534#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006534#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0006534#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0006534#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0006534#Artikel12b
    url: https://wetten.overheid.nl/BWBR0006534/2018-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006534
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
