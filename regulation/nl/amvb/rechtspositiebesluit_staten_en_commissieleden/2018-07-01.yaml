        artikel: '7'
  - number: 6a
    text: |-
      1 Op aanvraag wordt ten laste van de provincie aan een lid van provinciale staten voor de uitoefening van het
      statenlidmaatschap een computer, bijbehorende apparatuur en software in bruikleen ter beschikking gesteld.

      2 Indien geen computer, bijbehorende apparatuur en software ter beschikking is gesteld, wordt door gedeputeerde
      staten aan een lid van provinciale staten op aanvraag voor de uitoefening van het statenlidmaatschap een
      tegemoetkoming verleend voor:

      a. aanschaf van een computer, bijbehorende apparatuur en software, of,

      b. gebruik van een eigen computer, bijbehorende apparatuur en software.

      3 Op aanvraag wordt door gedeputeerde staten een vergoeding aan het lid van provinciale staten verleend voor
      de aanleg- en de abonnementskosten voor de internetverbinding voor de in het eerste of het tweede lid genoemde
      computerapparatuur.

      4 Provinciale staten kunnen bij verordening nadere regels stellen over het ter beschikking stellen van
      computerapparatuur en de tegemoetkoming, bedoeld in het eerste en tweede lid en de vergoeding, bedoeld in het derde
      lid.
    url: https://wetten.overheid.nl/BWBR0006534/2018-07-01#Artikel6a
  - number: '7'
    text: |-
      1 De vergoeding voor de werkzaamheden en de onkostenvergoeding worden door het lid van provinciale staten genoten
      met ingang van de dag van de beëdiging.

      2 De vergoeding voor de werkzaamheden en de onkostenvergoeding eindigt op het tijdstip van beëindiging van het
      lidmaatschap van provinciale staten.

      3 Het lid van provinciale staten dat in de loop van een kalenderjaar is beëdigd dan wel het lidmaatschap van
      provinciale staten heeft beëindigd, ontvangt de vergoeding voor de werkzaamheden en de onkostenvergoeding naar
      evenredigheid van de periode van uitoefening van het lidmaatschap in bedoeld kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006534/2018-07-01#Artikel7
  - number: 7a
    text: |-
      1 Een lid van provinciale staten dat op grond van [artikel 75 van de Provinciewet][ref1] meer dan dertig dagen
      onafgebroken het voorzitterschap van de staten waarneemt, ontvangt voor die tijd voor die waarneming een toeslag
      van 8% van zijn vergoeding als lid van provinciale staten.

      2 Het eerste lid is van overeenkomstige toepassing ten aanzien van de onkostenvergoeding, bedoeld in
      [artikel 2, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0006534#Artikel2
    url: https://wetten.overheid.nl/BWBR0006534/2018-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '75'
      - id: ref2
        bwb_id: BWBR0006534
        artikel: '2'
        hoofdstuk: '2'
  - number: 7b
    text: |-
      1 Naast de vergoeding voor de werkzaamheden ontvangen fractievoorzitters voor de duur van hun voorzitterschap per
      jaar een toelage gelijk aan 1,2% van de vergoeding op jaarbasis en een toelage gelijk aan 0,4% van de vergoeding
      op jaarbasis voor elk lid dat de fractie buiten de fractievoorzitter telt. De toelagen tezamen bedragen ten hoogste
      6,4% van de vergoeding op jaarbasis.

      2 Voor de toepassing van het eerste lid stelt de commissaris vast:

      a. hoeveel leden een fractie telt;

      b. de duur van het fractievoorzitterschap.
    url: https://wetten.overheid.nl/BWBR0006534/2018-07-01#Artikel7b
  - number: '8'
    text: |-
      1 Voor de toepassing van dit artikel wordt verstaan onder:

      a. *een ziekte:* een ziekte die in overwegende mate haar oorzaak vindt in de uitoefening van de aan de functie
      verbonden werkzaamheden;

      b. *een dienstongeval:* een ongeval dat plaatsvindt tijdens de uitoefening van de aan de functie verbonden
      werkzaamheden.

      2 Een staten- of commissielid ontvangt een vergoeding voor de noodzakelijk gemaakte kosten in verband met een
      geneeskundige behandeling of verzorging of overige kosten, indien deze in overwegende mate hun oorzaak vinden in
      een ziekte of een dienstongeval:

      a. voor zover deze kosten ten laste van staten- of commissielid blijven en

      b. voor zover de ziekte of het dienstongeval niet aan eigen schuld of onvoorzichtigheid te wijten is.

      3 In bijzondere gevallen kunnen gedeputeerde staten bepalen dat overige schade aangemerkt wordt als voortvloeiend
      uit de ziekte of het dienstongeval, naar redelijkheid en billijkheid en gehoord de vergadering van de
      fractievoorzitters van alle partijen in provinciale staten.

      4 Onder overige schade valt niet het gederfde inkomen.

      5 Als de schade van de ziekte of het dienstongeval is ontstaan tijdens zijn functie als staten- of commissielid en
      voortduurt na zijn aftreden is dit artikel van overeenkomstige toepassing op het gewezen staten- of commissielid.
    url: https://wetten.overheid.nl/BWBR0006534/2018-07-01#Artikel8
  - number: '9'
    text: |-
      1 Provinciale staten kunnen bij verordening bepalen dat het provinciaal bestuur ten behoeve van de leden van
      provinciale staten één of meer collectieve verzekeringen kan afsluiten, waarbij wordt voorzien in de opbouw van een
      ouderdomspensioen en in geldelijke voorzieningen bij invaliditeit en overlijden.

      2 Dit artikel is niet van toepassing op een lid van provinciale staten dat is benoemd in een plaats die is
      opengevallen als gevolg van het tijdelijk ontslag van een lid van provinciale staten wegens zwangerschap en
      bevalling of ziekte, ingevolge [artikel X 12 van de Kieswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_12
    url: https://wetten.overheid.nl/BWBR0006534/2018-07-01#Artikel9
