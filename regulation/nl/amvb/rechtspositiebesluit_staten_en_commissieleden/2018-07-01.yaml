        artikel: '35'
  - number: '12'
    text: |-
      1 De kosten voor niet-partijpolitiek georiënteerde scholing in verband met de vervulling van de functie van staten-
      of commissielid komen ten laste van de provincie.

      2 Provinciale Staten kunnen over de in het eerste lid bedoelde scholing nadere regels stellen.

      3 Indien een statenlid in verband met de uitoefening van de functie lid is van een beroepsvereniging vergoedt de
      provincie de contributie van die beroepsvereniging.
    url: https://wetten.overheid.nl/BWBR0006534/2018-07-01#Artikel12
  - number: 12a
    text: |-
      Als eindheffingsbestanddeel als bedoeld in
      [artikel 31, eerste lid, onderdeel f, van de Wet op de loonbelasting 1964][ref1] worden aangewezen:

      a. de onkostenvergoeding, bedoeld in [artikel 2, derde lid][ref2];

      b. de verstrekkingen, bedoeld in [artikel 6a, eerste lid][ref3];

      c. de vergoeding, bedoeld in [artikel 6a, derde lid][ref4];

      d. de tegemoetkoming, bedoeld in [artikel 10, eerste lid][ref5];

      e. de vergoeding, bedoeld in [artikel 12, eerste en derde lid][ref6].


