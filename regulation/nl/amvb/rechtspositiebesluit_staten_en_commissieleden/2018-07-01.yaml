        artikel: '13'
        hoofdstuk: '4'
  - number: '15'
    text: |-
      Het koninklijk besluit van 3 april 1980 tot uitvoering van de [artikelen 13][ref1], [derde lid][ref2], en [65]
      (onbekend) (*Stb.* 203) wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel13
