        artikel: '13'
      - id: ref2
        bwb_id: BWBR0006534
        artikel: '15'
        hoofdstuk: '5'
  - number: '16.1'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst en werkt terug tot en met 1 januari 1994.
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel16
  - number: '16.2'
    text: |-
      In afwijking van het eerste lid werkt [artikel 11, tweede lid][ref1], terug tot en met 1 maart 1994.


      [ref1]: https://wetten.overheid.nl/BWBR0006534#Artikel11
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel16
