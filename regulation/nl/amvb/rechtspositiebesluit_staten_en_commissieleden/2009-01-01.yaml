preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Binnenlandse Zaken van 4 oktober 1993, nr. BW93/U2068, directoraat-
    generaal Openbaar Bestuur, gedaan mede namens Onze Minister van Binnenlandse Zaken;

    Gelet op de artikelen 93 en 94 van de Provinciewet;

    De Raad van State gehoord (advies van 8 februari 1994, nr. W04.93.0653.);

    Gezien het nader rapport van de Staatssecretaris van Binnenlandse Zaken van 18 maart 1994, nr. BW94/275,
    directoraat-generaal Openbaar Bestuur, uitgebracht mede namens Onze Minister van Binnenlandse Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Binnenlandse Zaken;'
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel1
  - number: 1.b
    text: 'lid van provinciale staten: een lid van provinciale staten, dat niet tevens lid van gedeputeerde staten is;'
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel1
  - number: 1.c
    text: |-
      tijdstip van beëindiging van het lidmaatschap van provinciale staten: het tijdstip van beëindiging
      van het lidmaatschap, bedoeld in de [artikelen X1, eerste en derde lid][ref1], [X6][ref2] en
      [X7, tweede, derde en vijfde lid, van de Kieswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_6
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_7
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: X_1
      - id: ref2
        bwb_id: BWBR0004627
        artikel: X_6
      - id: ref3
        bwb_id: BWBR0004627
        artikel: X_7
  - number: 1.d
    text: |-
      lid van een commissie: een lid van een commissie als bedoeld in de [artikelen 80][ref1], [81][ref2] en
      [82 van de Provinciewet][ref3], dat niet tevens lid van provinciale staten is of ambtenaar die als zodanig tot lid
      van een commissie is benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel81
      [ref3]: https://wetten.overheid.nl/BWBR0005645#Artikel82
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '80'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '81'
      - id: ref3
        bwb_id: BWBR0005645
        artikel: '82'
  - number: 1a.1
    text: |-
      De [artikelen 2 tot en met 4][ref1] en [6a tot en met 12][ref2] van dit besluit zijn van overeenkomstige toepassing
      op het lid van provinciale staten aan wie ingevolge [artikel X 10 van de Kieswet][ref3] tijdelijk ontslag is
      verleend wegens zwangerschap en bevalling of ziekte, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0006534#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006534#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_10
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0006534
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0006534
        artikel: '7'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0004627
        artikel: X_10
  - number: 1a.1.a
    text: |-
      de onkostenvergoeding die dit lid op grond van [artikel 2, derde of vierde lid][ref1], ontvangt, de helft bedraagt
      van het bedrag dat op grond van die bepalingen van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0006534#Artikel2
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0006534
        artikel: '2'
        hoofdstuk: '2'
  - number: 1a.1.b
    text: |-
      indien door provinciale staten toepassing is gegeven aan [artikel 4][ref1], dit lid een uitkering ontvangt voor
      alle vergaderingen die gedurende het tijdelijk ontslag plaatsvinden of hebben plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0006534#Artikel4
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0006534
        artikel: '4'
        hoofdstuk: '2'
  - number: 1a.2
    text: |-
      Een tijdelijk ontslag als bedoeld in [artikel X 10 van de Kieswet][ref1] wordt niet aangemerkt als beëindiging van
      het lidmaatschap van provinciale staten als bedoeld in [artikel 7, tweede en derde lid][ref2], en als aftreden als
      bedoeld in [artikel 8][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_10
      [ref2]: https://wetten.overheid.nl/BWBR0006534#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0006534#Artikel8
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: X_10
      - id: ref2
        bwb_id: BWBR0006534
        artikel: '7'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0006534
        artikel: '8'
        hoofdstuk: '3'
  - number: '2.1'
    text: |-
      Aan een lid van provinciale staten wordt een vergoeding voor de werkzaamheden toegekend die ten hoogste € 9 991,79
      per jaar bedraagt.
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel2
  - number: '2.2'
    text: |-
      Het bedrag van de vergoeding voor de werkzaamheden wordt per 1 januari van elk jaar door Onze Minister herzien
      aan de hand van het door het Centraal Bureau voor de Statistiek voor de maand september van het voorafgaande
      kalenderjaar vastgestelde indexcijfer CAO lonen overheid, inclusief bijzondere beloningen en bekend gemaakt in
      de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel2
  - number: '2.3'
    text: |-
      Aan een lid van provinciale staten wordt een onkostenvergoeding voor aan de uitoefening van het statenlidmaatschap
      verbonden kosten toegekend die ten hoogste € 70,79  per maand bedraagt.
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel2
  - number: '2.4'
    text: |-
      Ten aanzien van een lid van provinciale staten van wie de arbeidsverhouding ingevolge
      [artikel 4, aanhef en onderdeel f, van de Wet op de loonbelasting 1964][ref1] voor de toepassing van die wet als
      dienstbetrekking wordt aangemerkt, wordt in afwijking van het derde lid een onkostenvergoeding die ten hoogste
      147,48  per maand bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel4
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '4'
  - number: '2.5'
    text: |-
      De bedragen van de vergoeding van de kosten, bedoeld in het derde en vierde lid, worden per 1 januari van elk
      jaar door Onze Minister herzien aan de hand van de consumentenprijsindex, geldend voor de maand september van het
      voorafgaande kalenderjaar en bekend gemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel2
  - number: '3'
    text: |-
      Provinciale staten kunnen bij verordening tot ten hoogste 20% naar beneden afwijken van de bedragen, genoemd in
      [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006534#Artikel2
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006534
        artikel: '2'
        hoofdstuk: '2'
  - number: '4'
    text: |-
      Provinciale staten kunnen bij verordening bepalen dat ten hoogste 20% van de vergoeding voor de werkzaamheden wordt
      uitgekeerd, berekend naar het aantal gehouden vergaderingen. In dat geval geschiedt de uitkering aan het lid van
      provinciale staten op basis van het aantal bijgewoonde vergaderingen.
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel4
  - number: '5.1'
    text: |-
      Aan een lid van provinciale staten wordt vergoeding van reiskosten verleend naar bij provinciale verordening
      te stellen regels voor het bijwonen van vergaderingen van provinciale staten en van commissies of een Openbaar-
      Vervoerjaarkaart verstrekt dan wel een keuze tussen een vergoeding of een Openbaar-Vervoerjaarkaart geboden, met
      dien verstande dat voor het gebruik van een eigen motorvoertuig de vergoeding niet hoger wordt gesteld dan het
      bedrag dat bij of krachtens [artikel 7 van het Reisbesluit binnenland][ref1] is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005889#Artikel7
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005889
        artikel: '7'
  - number: '5.2'
    text: |-
      Aan een lid van provinciale staten wordt vergoeding van werkelijk gemaakte verblijfkosten verleend naar bij
      provinciale verordening te stellen regels voor het bijwonen van vergaderingen, genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel5
  - number: '6.1'
    text: |-
      Provinciale staten kunnen bij verordening bepalen dat aan een lid van provinciale staten naast de vergoeding,
      genoemd in [artikel 5][ref1], vergoeding wordt verleend voor reiskosten ter zake van andere dan de in
      [artikel 5][ref2] bedoelde reizen, ten behoeve van de provincie gemaakt, met dien verstande dat voor het
      gebruik van een eigen motorvoertuig de vergoeding niet hoger wordt gesteld dan het bedrag dat bij of krachtens
      [artikel 7 van het Reisbesluit binnenland][ref3] is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006534#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006534#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005889#Artikel7
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006534
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0006534
        artikel: '5'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0005889
        artikel: '7'
  - number: '6.2'
    text: |-
      Provinciale staten kunnen bij verordening bepalen dat aan een lid van provinciale staten vergoeding wordt verleend
      voor werkelijk gemaakte verblijfkosten ter zake van reizen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel6
  - number: 6a.1
    text: |-
      Op aanvraag wordt ten laste van de provincie aan een lid van provinciale staten voor de uitoefening van het
      statenlidmaatschap een computer, bijbehorende apparatuur en software in bruikleen ter beschikking gesteld.
      Gedeputeerde staten verstrekken op aanvraag een tegemoetkoming voor de belastingheffing als gevolg hiervan.
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel6a
  - number: 6a.2
    text: |-
      Indien geen computer, bijbehorende apparatuur en software ter beschikking is gesteld, wordt door gedeputeerde
      staten aan een lid van provinciale staten op aanvraag voor de uitoefening van het statenlidmaatschap een
      tegemoetkoming verleend voor:
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel6a
  - number: 6a.2.a
    text: aanschaf van een computer, bijbehorende apparatuur en software, of,
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel6a
  - number: 6a.2.b
    text: gebruik van een eigen computer, bijbehorende apparatuur en software.
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel6a
  - number: 6a.3
    text: |-
      Op aanvraag wordt door gedeputeerde staten een vergoeding aan het lid van provinciale staten verleend voor de
      aanleg- en de abonnementskosten voor de internetverbinding voor de in het eerste of het tweede lid genoemde
      computerapparatuur.
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel6a
  - number: 6a.4
    text: |-
      Provinciale staten kunnen bij verordening nadere regels stellen over het ter beschikking stellen van
      computerapparatuur en de tegemoetkoming, bedoeld in het eerste en tweede lid en de vergoeding, bedoeld in het derde
      lid.
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel6a
  - number: '7.1'
    text: |-
      De vergoeding voor de werkzaamheden en de onkostenvergoeding worden door het lid van provinciale staten genoten met
      ingang van de dag van de beëdiging.
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel7
  - number: '7.2'
    text: |-
      De vergoeding voor de werkzaamheden en de onkostenvergoeding eindigt op het tijdstip van beëindiging van het
      lidmaatschap van provinciale staten.
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel7
  - number: '7.3'
    text: |-
      Het lid van provinciale staten dat in de loop van een kalenderjaar is beëdigd dan wel het lidmaatschap van
      provinciale staten heeft beëindigd, ontvangt de vergoeding voor de werkzaamheden en de onkostenvergoeding naar
      evenredigheid van de periode van uitoefening van het lidmaatschap in bedoeld kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel7
  - number: 7a.1
    text: |-
      Een lid van provinciale staten dat op grond van [artikel 75 van de Provinciewet][ref1] meer dan dertig dagen
      onafgebroken het voorzitterschap van de staten waarneemt, ontvangt voor die tijd voor die waarneming een toeslag
      van 8% van zijn vergoeding als lid van provinciale staten.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel75
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '75'
  - number: 7a.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van de onkostenvergoeding, bedoeld in
      [artikel 2, derde en vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006534#Artikel2
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0006534
        artikel: '2'
        hoofdstuk: '2'
  - number: '8.1'
    text: |-
      Provinciale staten kunnen bij verordening bepalen dat een lid van provinciale staten met ingang van de dag van zijn
      aftreden een uitkering ten laste van de provincie ontvangt, naar in de verordening te stellen regels.
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel8
  - number: '8.2'
    text: |-
      De uitkering heeft een maximumduur van twee jaar en bedraagt in het eerste jaar ten hoogste 80% en in het tweede
      jaar ten hoogste 70% van het op het moment van aftreden geldende bedrag van de vergoeding voor de werkzaamheden,
      eventueel vermeerderd met het bedrag van de in het jaar voor het aftreden ontvangen vergoeding, bedoeld in
      [artikel 4][ref1]. De uitkering eindigt in ieder geval met ingang van de maand volgend op die waarop de leeftijd
      van 65 jaar wordt bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0006534#Artikel4
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006534
        artikel: '4'
        hoofdstuk: '2'
  - number: '8.3'
    text: |-
      Provinciale staten kunnen bij verordening bepalen dat geen recht op op uitkering bestaat indien het lid van
      provinciale staten van zijn lidmaatschap vervallen is verklaard ingevolge [artikel X 7 van de Kieswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_7
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: X_7
  - number: '8.4'
    text: |-
      Dit artikel is niet van toepassing op een lid van provinciale staten dat is benoemd in de plaats die is
      opengevallen als gevolg van het tijdelijk ontslag van een lid van provinciale staten wegens zwangerschap en
      bevalling of ziekte, ingevolge [artikel X 12 van de Kieswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_12
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: X_12
  - number: '9.1'
    text: |-
      Provinciale staten kunnen bij verordening bepalen dat het provinciaal bestuur ten behoeve van de leden van
      provinciale staten één of meer collectieve verzekeringen kan afsluiten, waarbij wordt voorzien in de opbouw van een
      ouderdomspensioen en in geldelijke voorzieningen bij invaliditeit en overlijden.
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel9
  - number: '9.2'
    text: |-
      Dit artikel is niet van toepassing op een lid van provinciale staten dat is benoemd in een plaats die is
      opengevallen als gevolg van het tijdelijk ontslag van een lid van provinciale staten wegens zwangerschap en
      bevalling of ziekte, ingevolge [artikel X 12 van de Kieswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_12
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: X_12
  - number: '10.1'
    text: |-
      Provinciale staten kunnen bij verordening bepalen dat een lid van provinciale staten ten laste van de provincie een
      tegemoetkoming in de kosten van een ziektekostenverzekering ontvangt van € 175 per jaar.
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel10
  - number: '10.2'
    text: |-
      Indien de nominale eindejaarsuitkering van het personeel werkzaam bij de sector Rijk wijziging ondergaat, wordt het
      in het eerste lid genoemde bedrag naar evenredigheid gewijzigd.
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel10
  - number: '11.1'
    text: |-
      Provinciale staten kunnen bij verordening bepalen dat in het geval dat een lid van provinciale staten een uitkering
      op grond van de [Werkloosheidswet][ref1] ontvangt en na de toepassing van artikel 20 van die wet ontstane korting
      op deze uitkering ten gevolge van het uitoefenen van het lidmaatschap van provinciale staten meer bedraagt dan
      de vergoeding voor de werkzaamheden die dit lid ontvangt van provinciale staten, deze vergoeding ten laste van de
      provincie wordt verhoogd tot het bedrag van bedoelde korting.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '11.2'
    text: |-
      Provinciale staten kunnen bij verordening bepalen dat in het geval dat een lid van provinciale staten een
      uitkering op grond van het Besluit Werkloosheid onderwijs- en onderzoekspersoneel ontvangt en de na toepassing van
      [artikel 6, vierde lid][ref1], van dat besluit ontstane korting op deze uitkering ten gevolge van het uitoefenen
      van lidmaatschap van provinciale staten meer bedraagt dan de vergoeding voor de werkzaamheden die dit lid ontvangt
      van provinciale staten, deze vergoeding ten laste van de provincie wordt verhoogd tot het bedrag van bedoelde
      korting.


      [ref1]: https://wetten.overheid.nl/BWBR0006534#Artikel6
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006534
        artikel: '6'
        hoofdstuk: '2'
  - number: '11.3'
    text: |-
      Provinciale staten kunnen bij verordening bepalen dat, in het geval een lid van provinciale staten een uitkering in
      verband met geheel of gedeeltelijke arbeidsongeschiktheid ontvangt, de vergoeding voor de werkzaamheden op verzoek
      van het desbetreffende lid wordt verlaagd.
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel11
  - number: '12'
    text: |-
      Provinciale staten kunnen bij verordening bepalen dat een lid van provinciale staten, naar in de verordening te
      stellen regels, ten laste van de provincie een tegemoetkoming ontvangt ter zake van kosten voor scholing in verband
      met de vervulling van het statenlidmaatschap, alsmede ter zake van kosten voor in verband met de vervulling van het
      statenlidmaatschap noodzakelijke kinderopvang.
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel12
  - number: '13'
    text: |-
      Provinciale staten kunnen bij verordening bepalen dat aan een lid van een commissie een vergoeding voor
      het bijwonen van de vergaderingen van de commissie wordt toegekend tot het maximumbedrag van € 80,32 . Het
      [artikel 2, tweede en vierde lid][ref1], is van overeenkomstige toepassing. Provinciale Staten kunnen bij
      verordening bepalen dat [artikel 6a][ref2] geheel of gedeeltelijk van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0006534#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006534#Artikel6a
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006534
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0006534
        artikel: 6a
        hoofdstuk: '2'
  - number: '14'
    text: 'Ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel14
  - number: 14.a
    text: |-
      een lid van een commissie die op grond van zijn bijzondere beroepsmatige deskundigheid op het taakgebied van de
      commissie voor deelneming aan haar werkzaamheden is aangetrokken, en
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel14
  - number: 14.b
    text: |-
      een lid van een commissie ten aanzien waarvan de vergoeding niet geacht kan worden in een redelijke verhouding te
      staan tot de zwaarte van zijn taak en de omvang van de door hem te verrichten arbeid, kunnen provinciale staten bij
      verordening bepalen dat de vergoeding voor het bijwonen van de vergaderingen van de commissie naar boven afwijkt
      van het bedrag, genoemd in [artikel 13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006534#Artikel13
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006534
        artikel: '13'
        hoofdstuk: '4'
  - number: '15'
    text: |-
      Het koninklijk besluit van 3 april 1980 tot uitvoering van de [artikelen 13][ref1], [derde lid][ref2], en [65]
      (onbekend) (*Stb.* 203) wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0006534#Artikel15
    url: https://wetten.overheid.nl/BWBR0006534/2009-01-01#Artikel15
    references:
