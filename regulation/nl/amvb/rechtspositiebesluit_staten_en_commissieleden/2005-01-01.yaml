preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Binnenlandse Zaken van 4 oktober 1993, nr. BW93/U2068, directoraat-
    generaal Openbaar Bestuur, gedaan mede namens Onze Minister van Binnenlandse Zaken;

    Gelet op de artikelen 93 en 94 van de Provinciewet;

    De Raad van State gehoord (advies van 8 februari 1994, nr. W04.93.0653.);

    Gezien het nader rapport van de Staatssecretaris van Binnenlandse Zaken van 18 maart 1994, nr. BW94/275,
    directoraat-generaal Openbaar Bestuur, uitgebracht mede namens Onze Minister van Binnenlandse Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006534/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Binnenlandse Zaken;

      b. lid van provinciale staten: een lid van provinciale staten, dat niet tevens lid van gedeputeerde staten is;

      c. tijdstip van beëindiging van het lidmaatschap van provinciale staten: het tijdstip van beëindiging van het
      lidmaatschap, bedoeld in de [artikelen X1](onbekend), [eerste][ref1] en [derde lid][ref2], [X6](onbekend) en [X7,
      tweede, derde en vijfde lid, van de Kieswet](onbekend).

      d. lid van een commissie: een lid van een commissie als bedoeld in de [artikelen 80][ref3], [89][ref4] en
      [90 van de Provinciewet][ref5], dat niet tevens lid van provinciale staten is of ambtenaar die als zodanig tot lid
      van een commissie is benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0006534#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006534#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005645#Artikel80
      [ref4]: https://wetten.overheid.nl/BWBR0005645#Artikel89
      [ref5]: https://wetten.overheid.nl/BWBR0005645#Artikel90
    url: https://wetten.overheid.nl/BWBR0006534/2005-01-01#Artikel1
