        artikel: '90'
  - number: '2'
    text: |-
      1 Aan een lid van provinciale staten wordt een vergoeding voor de werkzaamheden toegekend die ten hoogste € 9
      991,79  per jaar bedraagt.

      2 Het bedrag van de vergoeding voor de werkzaamheden wordt per 1 januari van elk jaar door Onze Minister herzien
      aan de hand van het door het Centraal Bureau voor de Statistiek voor de maand september van het voorafgaande
      kalenderjaar vastgestelde indexcijfer CAO lonen overheid voor volwassenen, inclusief bijzondere beloningen en
      bekend gemaakt in de Staatscourant.

      3 Aan een lid van provinciale staten wordt een onkostenvergoeding voor aan de uitoefening van het
      statenlidmaatschap verbonden kosten toegekend die ten hoogste € 70,79  per maand bedraagt.

      4 Ten aanzien van een lid van provinciale staten van wie de arbeidsverhouding ingevolge
      [artikel 4, aanhef en onderdeel f, van de Wet op de loonbelasting 1964][ref1] voor de toepassing van die wet als
      dienstbetrekking wordt aangemerkt, wordt in afwijking van het derde lid een onkostenvergoeding die ten hoogste
      147,48  per maand bedraagt.

      5 De bedragen van de vergoeding van de kosten, bedoeld in het derde en vierde lid, worden per 1 januari van elk
      jaar door Onze Minister herzien aan de hand van de consumentenprijsindex, geldend voor de maand september van het
      voorafgaande kalenderjaar en bekend gemaakt in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel4
    url: https://wetten.overheid.nl/BWBR0006534/2005-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '4'
  - number: '3'
    text: |-
      Provinciale staten kunnen bij verordening tot ten hoogste 20% naar beneden afwijken van de bedragen, genoemd in
      [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006534#Artikel2
    url: https://wetten.overheid.nl/BWBR0006534/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006534
        artikel: '2'
        hoofdstuk: '2'
  - number: '4'
    text: |-
      Provinciale staten kunnen bij verordening bepalen dat ten hoogste 20% van de vergoeding voor de werkzaamheden wordt
      uitgekeerd, berekend naar het aantal gehouden vergaderingen. In dat geval geschiedt de uitkering aan het lid van
      provinciale staten op basis van het aantal bijgewoonde vergaderingen.
    url: https://wetten.overheid.nl/BWBR0006534/2005-01-01#Artikel4
  - number: '5'
    text: |-
      1 Aan een lid van provinciale staten wordt vergoeding van reiskosten verleend naar bij provinciale verordening
      te stellen regels voor het bijwonen van vergaderingen van provinciale staten en van commissies of een Openbaar-
      Vervoerjaarkaart verstrekt dan wel een keuze tussen een vergoeding of een Openbaar-Vervoerjaarkaart geboden, met
      dien verstande dat voor het gebruik van een eigen motorvoertuig de vergoeding niet hoger wordt gesteld dan het
      bedrag dat bij of krachtens [artikel 7 van het Reisbesluit binnenland][ref1] is vastgesteld.

      2 Aan een lid van provinciale staten wordt vergoeding van werkelijk gemaakte verblijfkosten verleend naar bij
      provinciale verordening te stellen regels voor het bijwonen van vergaderingen, genoemd in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005889#Artikel7
    url: https://wetten.overheid.nl/BWBR0006534/2005-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005889
        artikel: '7'
  - number: '6'
    text: |-
      1 Provinciale staten kunnen bij verordening bepalen dat aan een lid van provinciale staten naast de vergoeding,
      genoemd in [artikel 5][ref1], vergoeding wordt verleend voor reiskosten ter zake van andere dan de in
      [artikel 5][ref2] bedoelde reizen, ten behoeve van de provincie gemaakt, met dien verstande dat voor het
      gebruik van een eigen motorvoertuig de vergoeding niet hoger wordt gesteld dan het bedrag dat bij of krachtens
      [artikel 7 van het Reisbesluit binnenland][ref3] is vastgesteld.

      2 Provinciale staten kunnen bij verordening bepalen dat aan een lid van provinciale staten vergoeding wordt
      verleend voor werkelijk gemaakte verblijfkosten ter zake van reizen, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006534#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006534#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005889#Artikel7
    url: https://wetten.overheid.nl/BWBR0006534/2005-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006534
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0006534
        artikel: '5'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0005889
        artikel: '7'
  - number: 6a
    text: |-
      De provincie kan, naar bij verordening te stellen regels, aan een lid van provinciale staten voor de uitoefening
      van het statenlidmaatschap benodigde computer- en communicatieapparatuur ter beschikking stellen. Het ter
      beschikking stellen van computerapparatuur kan geschieden door het bieden van een mogelijkheid tot deelname aan een
      voor het provinciepersoneel geldende pc-privéregeling.
    url: https://wetten.overheid.nl/BWBR0006534/2005-01-01#Artikel6a
  - number: '7'
    text: |-
      1 De vergoeding voor de werkzaamheden en de onkostenvergoeding worden door het lid van provinciale staten genoten
      met ingang van de dag van de beëdiging.

      2 De vergoeding voor de werkzaamheden en de onkostenvergoeding eindigt op het tijdstip van beëindiging van het
      lidmaatschap van provinciale staten.

      3 Het lid van provinciale staten dat in de loop van een kalenderjaar is beëdigd dan wel het lidmaatschap van
      provinciale staten heeft beëindigd, ontvangt de vergoeding voor de werkzaamheden en de onkostenvergoeding naar
      evenredigheid van de periode van uitoefening van het lidmaatschap in bedoeld kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006534/2005-01-01#Artikel7
  - number: '8'
    text: |-
      1 Provinciale staten kunnen bij verordening bepalen dat een lid van provinciale staten met ingang van de dag van
      zijn aftreden een uitkering ten laste van de provincie ontvangt, naar in de verordening te stellen regels.

      2 De uitkering heeft een maximumduur van twee jaar en bedraagt in het eerste jaar ten hoogste 80% en in het tweede
      jaar ten hoogste 70% van het op het moment van aftreden geldende bedrag van de vergoeding voor de werkzaamheden,
      eventueel vermeerderd met het bedrag van de in het jaar voor het aftreden ontvangen vergoeding, bedoeld in
      [artikel 4][ref1]. De uitkering eindigt in ieder geval met ingang van de maand volgend op die waarop de leeftijd
      van 65 jaar wordt bereikt.

      3 Provinciale staten kunnen bij verordening bepalen dat geen recht op op uitkering bestaat indien het lid van
      provinciale staten van zijn lidmaatschap vervallen is verklaard ingevolge [artikel X 7 van de Kieswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006534#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_7
    url: https://wetten.overheid.nl/BWBR0006534/2005-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006534
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0004627
        artikel: X_7
  - number: '9'
    text: |-
      Provinciale staten kunnen bij verordening bepalen dat het provinciaal bestuur ten behoeve van de leden van
      provinciale staten één of meer collectieve verzekeringen kan afsluiten, waarbij wordt voorzien in de opbouw van een
      ouderdomspensioen en in geldelijke voorzieningen bij invaliditeit en overlijden.
    url: https://wetten.overheid.nl/BWBR0006534/2005-01-01#Artikel9
  - number: '10'
    text: |-
      1 Provinciale staten kunnen bij verordening bepalen dat een lid van provinciale staten, naar in de verordening
      te stellen regels, ten laste van de provincie een tegemoetkoming ontvangt ter zake van ziektekosten, waaronder de
      premie van een verzekering tegen ziektekosten.

      2 De tegemoetkoming bedraagt ten hoogste een bepaald percentage van de vergoeding voor de werkzaamheden, genoemd
      in [artikel 2][ref1].

      3 Het in het tweede lid bedoelde percentage is gelijk aan het werkgeversaandeel in de procentuele premie van de
      publiekrechtelijke ziektekostenregeling Interprovinciale Ziektekosten Regeling (IZR).


      [ref1]: https://wetten.overheid.nl/BWBR0006534#Artikel2
    url: https://wetten.overheid.nl/BWBR0006534/2005-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006534
        artikel: '2'
        hoofdstuk: '2'
  - number: '11'
    text: |-
      1 Provinciale staten kunnen bij verordening bepalen dat in het geval dat een lid van provinciale staten een
      uitkering op grond van de [Werkloosheidswet][ref1] ontvangt en na de toepassing van artikel 20 van die wet ontstane
      korting op deze uitkering ten gevolge van het uitoefenen van het lidmaatschap van provinciale staten meer bedraagt
      dan de vergoeding voor de werkzaamheden die dit lid ontvangt van provinciale staten, deze vergoeding ten laste van
      de provincie wordt verhoogd tot het bedrag van bedoelde korting.

      2 Provinciale staten kunnen bij verordening bepalen dat in het geval dat een lid van provinciale staten een
      uitkering op grond van het Besluit Werkloosheid onderwijs- en onderzoekspersoneel ontvangt en de na toepassing van
      [artikel 6, vierde lid][ref2], van dat besluit ontstane korting op deze uitkering ten gevolge van het uitoefenen
      van lidmaatschap van provinciale staten meer bedraagt dan de vergoeding voor de werkzaamheden die dit lid ontvangt
      van provinciale staten, deze vergoeding ten laste van de provincie wordt verhoogd tot het bedrag van bedoelde
      korting.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0006534#Artikel6
    url: https://wetten.overheid.nl/BWBR0006534/2005-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0006534
        artikel: '6'
        hoofdstuk: '2'
  - number: '12'
    text: |-
      Provinciale staten kunnen bij verordening bepalen dat een lid van provinciale staten, naar in de verordening te
      stellen regels, ten laste van de provincie een tegemoetkoming ontvangt ter zake van kosten voor scholing in verband
      met de vervulling van het statenlidmaatschap, alsmede ter zake van kosten voor in verband met de vervulling van het
      statenlidmaatschap noodzakelijke kinderopvang.
    url: https://wetten.overheid.nl/BWBR0006534/2005-01-01#Artikel12
  - number: '13'
    text: |-
      Provinciale staten kunnen bij verordening bepalen dat aan een lid van een commissie een vergoeding voor
      het bijwonen van de vergaderingen van de commissie wordt toegekend tot het maximumbedrag van € 80,32 . Het
      [artikel 2, tweede en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006534#Artikel2
    url: https://wetten.overheid.nl/BWBR0006534/2005-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006534
        artikel: '2'
        hoofdstuk: '2'
  - number: '14'
    text: |-
      Ten aanzien van:

      a. een lid van een commissie die op grond van zijn bijzondere beroepsmatige deskundigheid op het taakgebied van de
      commissie voor deelneming aan haar werkzaamheden is aangetrokken, en

      b. een lid van een commissie ten aanzien waarvan de vergoeding niet geacht kan worden in een redelijke verhouding
      te staan tot de zwaarte van zijn taak en de omvang van de door hem te verrichten arbeid, kunnen provinciale staten
      bij verordening bepalen dat de vergoeding voor het bijwonen van de vergaderingen van de commissie naar boven
      afwijkt van het bedrag, genoemd in [artikel 13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006534#Artikel13
    url: https://wetten.overheid.nl/BWBR0006534/2005-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006534
        artikel: '13'
        hoofdstuk: '4'
  - number: '15'
    text: |-
      Het koninklijk besluit van 3 april 1980 tot uitvoering van de [artikelen 13][ref1], [derde lid][ref2], en [65]
      (onbekend) (*Stb.* 203) wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0006534#Artikel15
    url: https://wetten.overheid.nl/BWBR0006534/2005-01-01#Artikel15
