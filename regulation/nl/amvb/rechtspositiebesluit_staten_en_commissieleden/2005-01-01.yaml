  - number: '16'
    text: |-
      1 Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het
      wordt geplaatst en werkt terug tot en met 1 januari 1994.

      2 In afwijking van het eerste lid werkt [artikel 11, tweede lid][ref1], terug tot en met 1 maart 1994.


      [ref1]: https://wetten.overheid.nl/BWBR0006534#Artikel11
    url: https://wetten.overheid.nl/BWBR0006534/2005-01-01#Artikel16
