---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: douanebesluit
regulatory_layer: AMVB
publication_date: '2008-04-15'
valid_from: '2005-01-01'
bwb_id: BWBR0007925
url: https://wetten.overheid.nl/BWBR0007925/2005-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Financiën van 13 december 1993, nr. WD.93/697, Directoraat-Generaal
    voor Fiscale Zaken, directie Wetgeving Douane;

    Gelet op artikel 22f van de Algemene wet inzake rijksbelastingen, de artikelen 3, 23, vijfde lid, 28, 35, 53,
    vijfde lid, 56 en 57 van de Douanewet en artikel 25 van de Invorderingswet 1990;

    De Raad van State gehoord (advies van 26 april 1994, nr. W06.93.0837);

    Gezien het nader rapport van de Staatssecretaris van Financiën van 26 februari 1996, nr. WD.94/349, Directoraat-
    Generaal voor Fiscale Zaken, directie Wetgeving Douane;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Dit besluit en de daarop berustende bepalingen verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel1
  - number: 1.a
    text: |-
      binnenkomend luchtvaartuig: een luchtvaartuig dat in Nederland landt, terzake van welke landing de in artikelen 40
      en 43 van het Communautair douanewetboek bedoelde formaliteiten moeten worden vervuld;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel1
  - number: 1.b
    text: |-
      binnenkomend schip: een schip dat in Nederland vanuit zee binnenkomt, terzake van welke binnenkomst de in artikelen
      40 en 43 van het Communautair douanewetboek bedoelde formaliteiten moeten worden vervuld;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel1
  - number: 1.c
    text: |-
      douanekantoor van uitgang: onverminderd het bepaalde in artikel 793, tweede lid, van de toepassingsverordening
      Communautair douanewetboek, de haven of luchthaven van waaruit de goederen, over zee dan wel door de lucht het
      douanegebied van de Gemeenschap verlaten;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel1
  - number: 1.d
    text: 'de Post: de Koninklijke TPG Post BV;'
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel1
  - number: 1.e
    text: |-
      brieven en postzendingen: brieven en postzendingen als bedoeld in
      [artikel 1, onderdelen b en c, van de Postwet][ref1], voorzover zij onder de verplichting, bedoeld in
      [artikel 2, eerste lid, van die wet][ref2], vallen;


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004423#Artikel2
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004423
        artikel: '2'
  - number: 1.f
    text: |-
      beheerder vrije zone controletype II: de persoon aan wie vergunning is verleend de vrije zone controletype II te
      beheren;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel1
  - number: 1.g
    text: 'operateur: de belanghebbende, bedoeld in artikel 799 van de toepassingsverordening Communautair douanewetboek.'
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel1
  - number: '3'
    text: |-
      Indien op grond van wettelijke bepalingen een vergunning dan wel goedkeuring van de inspecteur is vereist,
      dient ter verkrijging van deze vergunning, onderscheidenlijk goedkeuring, een verzoek te worden gericht aan de
      inspecteur.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel3
  - number: '4.1'
    text: |-
      Binnenkomende schepen en de daarin of daarop aanwezige goederen worden langs bij ministeriële regeling aangewezen
      vaarwaters overgebracht naar een haven ressorterende onder een bij ministeriële regeling aangewezen douanekantoor,
      alwaar de in artikel 40 van het Communautair douanewetboek bedoelde formaliteit van aanbrengen wordt vervuld.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel4
  - number: '4.2'
    text: |-
      Bij ministeriële regeling kunnen eveneens plaatsen als bedoeld in artikel 38, eerste lid, onderdeel a, van het
      Communautair douanewetboek worden aangewezen, alwaar voor schepen en de daarin of daarop aanwezige goederen
      onder bij ministeriële regeling gestelde voorwaarden de in artikel 40 van het Communautair douanewetboek bedoelde
      formaliteit van het aanbrengen wordt vervuld.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel4
  - number: '5.1'
    text: |-
      De summiere aangifte, bedoeld in artikel 43 van het Communautair douanewetboek, houdt aangifte in van alle bij het
      douanekantoor, bedoeld in [artikel 4][ref1], te lossen goederen. Voor de in het schip aanwezige provisie wordt een
      afzonderlijke summiere aangifte gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel4
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007925
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '5.2'
    text: |-
      Aan het douanekantoor, bedoeld in [artikel 4][ref1], wordt in voorkomend geval tevens een summiere aangifte
      gedaan voor de goederen die zullen worden gelost bij een ander in Nederland gelegen douanekantoor als bedoeld in
      [artikel 4][ref2] voor zover het schip zich anders dan over zee naar dat douanekantoor zal begeven.


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007925#Artikel4
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007925
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007925
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '5.3'
    text: |-
      Op verzoek van belanghebbende kan aan het douanekantoor, bedoeld in [artikel 4][ref1], een summiere aangifte worden
      gedaan voor de goederen welke zullen worden gelost bij een ander in Nederland gelegen douanekantoor als bedoeld in
      [artikel 4][ref2], indien het schip zich over zee naar dat laatst genoemde douanekantoor zal begeven.


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007925#Artikel4
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007925
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007925
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '5.4'
    text: |-
      Een binnengekomen schip mag van het douanekantoor, bedoeld in [artikel 4][ref1], niet vertrekken zonder toestemming
      van de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel4
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007925
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '6.1'
    text: |-
      Communautaire goederen mogen nadat zij zijn gelost eerst worden weggevoerd nadat ten genoegen van de inspecteur is
      aangetoond dat deze goederen de communautaire status hebben.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel6
  - number: '6.2'
    text: |-
      Indien binnen het douanegebied van de Gemeenschap voor goederen een bewijs van de communautaire status is
      afgegeven, dient dit bewijs aan de inspecteur te worden overgelegd alvorens de goederen waarop dit bewijs
      betrekking heeft kunnen worden weggevoerd.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel6
  - number: '8.1'
    text: |-
      [De artikelen 4][ref1] en [5][ref2] zijn niet van toepassing op de volgende schepen, mits zij in de Gemeenschap
      thuishoren, overeenkomstig hun bestemming worden gebezigd en geen goederen meevoeren waarvoor bij het in het vrije
      verkeer brengen rechten bij invoer zijn verschuldigd:


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007925#Artikel5
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007925
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007925
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 8.1.a
    text: oorlogsschepen;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel8
  - number: 8.1.b
    text: pleziervaartuigen welke op hun reis niet een buitenlandse haven hebben aangedaan;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel8
  - number: 8.1.c
    text: |-
      vissersschepen welke van de visvangst komen en zijn voorzien van een aanduiding omtrent de haven waar zij
      thuishoren;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel8
  - number: 8.1.d
    text: sleepboten welke op hun reis niet een buitenlandse haven hebben aangedaan;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel8
  - number: 8.1.e
    text: reddingsboten;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel8
  - number: 8.1.f
    text: bij ministeriële regeling aangewezen vaartuigen van openbare diensten.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel8
  - number: '8.2'
    text: |-
      Het eerste lid is niet van toepassing indien voor het verkrijgen van vrijstelling van rechten bij invoer of
      voor het plaatsen onder de betreffende douaneregeling voor het schip of voor de meegevoerde goederen ingevolge
      wettelijke bepalingen de vervulling van bepaalde formaliteiten is vereist.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel8
  - number: '9.1'
    text: |-
      Degene die aan de kust goederen heeft opgevist of gered, dan wel aldaar aangespoelde of gestrande goederen heeft
      geborgen, geeft daarvan onverwijld kennis aan de inspecteur. Onder kust worden te dezen mede verstaan de wateren,
      stranden en oevers welke ingevolge [artikel 21 van de Wet op de strandvonderij][ref1] worden beschouwd te behoren
      tot de zee en het zeestrand.


      [ref1]: https://wetten.overheid.nl/BWBR0001951#Artikel21
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001951
        artikel: '21'
  - number: '9.2'
    text: |-
      De goederen mogen zonder toestemming van de inspecteur niet verder landinwaarts worden gebracht dan tot de eerste
      plaats waar zij tegen beschadiging door het zeewater zijn beveiligd.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel9
  - number: '9.3'
    text: |-
      Na de kennisgeving worden de goederen aangemerkt als binnengebrachte goederen in de zin van artikel 37, eerste lid,
      van het Communautair douanewetboek.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel9
  - number: '10'
    text: |-
      Binnenkomende luchtvaartuigen worden zonder tussenlanding overgebracht naar een bij ministeriële regeling
      aangewezen internationale luchthaven ressorterende onder een bij ministeriële regeling aangewezen douanekantoor
      alwaar de formaliteit van aanbrengen, bedoeld in artikel 40 van het Communautair douanewetboek, wordt vervuld.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel10
  - number: '11'
    text: |-
      De summiere aangifte, bedoeld in artikel 43 van het Communautair douanewetboek, houdt aangifte in van alle te
      lossen goederen bij het douanekantoor, bedoeld in [artikel 10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel10
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007925
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '12.1'
    text: |-
      [Artikel 10][ref1] is niet van toepassing op militaire, politie- en douaneluchtvaartuigen van Nederlandse of
      vreemde nationaliteit of op andere bij ministeriële regeling aangewezen luchtvaartuigen, mits zij overeenkomstig
      hun bestemming worden gebezigd en geen goederen meevoeren welke vreemd zijn aan de normale behoeften aan boord.


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel10
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007925
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '12.2'
    text: |-
      Het eerste lid is niet van toepassing, indien voor het verkrijgen van vrijstelling van rechten bij invoer of voor
      het plaatsen onder de betreffende douaneregeling voor het luchtvaartuig of voor de aan boord aanwezige goederen
      ingevolge wettelijke bepalingen de vervulling van bepaalde formaliteiten is vereist.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel12
  - number: '13.1'
    text: |-
      De goedkeuring, bedoeld in artikel 185, eerste lid, van de toepassingsverordening Communautair douanewetboek, van
      een ruimte voor tijdelijke opslag is gebonden aan een vergunning.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel13
  - number: '13.2'
    text: Bij ministeriële regeling worden regels gesteld met betrekking tot de goedkeuring, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel13
  - number: '14'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de in- en uitslag van goederen in en uit de
      ruimte voor tijdelijke opslag. Deze regels hebben in het bijzonder betrekking op de te gebruiken aangiften.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel14
  - number: '15.1'
    text: Aangiften tot plaatsing van goederen onder een douaneregeling worden gedaan in de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel15
  - number: '15.2'
    text: |-
      In afwijking in zoverre van het eerste lid kunnen aangiften tot plaatsing onder de douaneregeling douanevervoer,
      aangiften tot plaatsing onder een douaneregeling met gebruikmaking van een handels- of administratief bescheid en
      andere aangiften dan die bedoeld in het eerste lid, behalve in het Nederlands worden gedaan in het Frans, Duits
      of Engels.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel15
  - number: '15.3'
    text: |-
      Ingeval in het buitenland aanvaarde douaneaangiften zijn gesteld in een andere taal dan het Nederlands, Frans,
      Duits of Engels, kan de inspecteur een vertaling vragen welke mag zijn gesteld in het Nederlands, Frans, Duits
      of Engels.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel15
  - number: '16.1'
    text: |-
      In de gevallen waarin op grond van wettelijke bepalingen in een aangifte de goederencode van de desbetreffende
      goederen moet worden vermeld, is dat de code die voor die goederen is vastgesteld in het gebruikstarief.
      Het gebruikstarief is de lijst van goederenomschrijvingen met bijbehorende codes en aanduiding van de voor
      de desbetreffende goederen van toepassing zijnde maatregelen bij in- of uitvoer, zoals die geldt ingevolge
      verordeningen van de Raad van de Europese Unie of de Commissie van de Europese Gemeenschappen, en waarin nadere
      onderverdelingen met bijbehorende codes zijn aangebracht in verband met de nationale statistiek en bijzondere
      maatregelen die voor de desbetreffende goederen gelden.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel16
  - number: '16.2'
    text: |-
      Bij ministeriële regeling worden regels gesteld voor de vaststelling, de uitgifte en de beschikbaarstelling van
      het gebruikstarief.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel16
  - number: '16.3'
    text: |-
      Een wijziging in de vaststelling van de goederencodes treedt in werking met ingang van de tweede dag na de
      dagtekening van het wijzigingsblad van het gebruikstarief waarin de wijziging is vermeld. Indien een wijziging in
      de vaststelling van goederencodes in afwachting van de uitgifte van een wijzigingsblad in de *Staatscourant* wordt
      bekend gemaakt, treedt deze in werking met ingang van de daarbij vermelde dag.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel16
  - number: '17.1'
    text: |-
      Ten aanzien van de bij ministeriële regeling aangewezen goederen en in de daarbij aangewezen gevallen kan, indien
      gehalte, samenstelling of hoeveelheid van goederen waarvoor een aangifte tot plaatsing onder een douaneregeling,
      met uitzondering van de regeling douanevervoer, moet worden gedaan aan de aangever niet bekend is, de vermelding
      van dat gegeven achterwege blijven indien de aangever verzoekt dat gegeven op zijn kosten van rijkswege te doen
      bepalen.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel17
  - number: '17.2'
    text: |-
      Indien in de gevallen, bedoeld in het eerste lid, de goederen met toepassing van artikel 73 van het Communautair
      douanewetboek ter beschikking van de aangever worden gesteld om hun bestemming te volgen, worden de gegevens
      aan de hand waarvan de berekening van de rechten bij invoer moet plaatsvinden zo nodig bij wijze van schatting
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel17
  - number: '17.3'
    text: |-
      Bij ministeriële regeling kunnen nadere voorwaarden en bepalingen worden vastgesteld voor de toepassing van dit
      artikel.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel17
  - number: '18'
    text: |-
      De in artikel 212 van de toepassingsverordening Communautair douanewetboek bedoelde toelichting kan worden
      aangevuld door de toelichting met daarin opgenomen de aanvullingen, bij ministeriële regeling vast te stellen.
      Wijzigingen van de aanvullingen en nadere aanvullingen kunnen plaatsvinden door de overeenkomstig het vorenstaande
      vastgestelde toelichting bij ministeriële regeling te wijzigen.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel18
  - number: '19.1'
    text: 'De aangifte ten uitvoer wordt gedaan:'
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel19
  - number: 19.1.a
    text: |-
      ten aanzien van goederen welke worden uitgevoerd ter voldoening aan de verplichting welke voortvloeit uit de
      douaneregeling waaronder zij waren geplaatst, op de voor het doen van de aangifte ten uitvoer aangewezen plaats,
      indien deze plaats in de wettelijke bepalingen of in de op de betreffende douaneregeling betrekking hebbende
      vergunning is aangewezen;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel19
  - number: 19.1.b
    text: |-
      in andere gevallen bij de inspecteur onder wie de exporteur ressorteert of onder wie de plaats ressorteert waar de
      goederen zijn verpakt of met het oog op de uitvoer in of op het vervoermiddel zijn geladen.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel19
  - number: '19.2'
    text: |-
      De inspecteur kan bepalen dat in de gevallen, andere dan die bedoeld in het eerste lid, onderdeel *a*, waarin het
      wenselijk wordt geacht om de controle van de aangifte ten uitvoer te laten plaatsvinden op een douanekantoor zo
      dicht mogelijk gelegen bij de plaats waar de exporteur is gevestigd of waar de goederen zijn verpakt of met het oog
      op de uitvoer in of op het vervoermiddel zijn geladen, de aangifte ten uitvoer wordt gedaan op een door hem aan te
      wijzen douanekantoor.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel19
  - number: '19.3'
    text: |-
      In afwijking van het eerste lid, onderdeel *b*, kan de aangifte ten uitvoer eveneens worden gedaan op bij
      ministeriële regeling aangewezen douanekantoren voor zover deze goederen via deze kantoren Nederland zullen
      verlaten en voor zover de aangifte wordt gedaan door of ten behoeve van in Nederland gevestigde exporteurs.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel19
  - number: '19.4'
    text: |-
      De voorgaande leden zijn van overeenkomstige toepassing indien ter zake van de wederuitvoer ingevolge wettelijke
      bepalingen een aangifte is vereist.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel19
  - number: '20'
    text: |-
      De weigering van een vergunning tot het doen van aangifte volgens een vereenvoudigde procedure op grond van het
      overtreden van douanevoorschriften geschiedt slechts indien:
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel20
  - number: 20.a
    text: |-
      de aanvrager in de laatste vijf jaren voorafgaande aan de aanvraag een bij wettelijke bepalingen strafbaar gesteld
      misdrijf heeft gepleegd;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel20
  - number: 20.b
    text: |-
      de aanvrager herhaaldelijk een bij wettelijke bepalingen strafbaar gestelde overtreding heeft begaan,
      waarvoor hij onherroepelijk is veroordeeld of waarvoor het recht tot strafvordering is vervallen ingevolge
      [artikel 76 van de Algemene wet inzake rijksbelastingen][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel76
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '76'
  - number: 20.c
    text: |-
      aan de aanvrager in de laatste vijf jaren voorafgaand aan de aanvraag herhaalde malen ingevolge wettelijke
      bepalingen een bestuurlijke boete is opgelegd.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel20
  - number: '21'
    text: |-
      Een vergunning tot toepassing van de domiciliëringsprocedure wordt slechts verleend indien de aanvrager van
      de desbetreffende vergunning een bedrijf uitoefent waarvan de administratieve organisatie zodanig is, dat zij
      voldoende waarborgen inhoudt voor een juiste vastlegging van de bedrijfshandelingen en de administratie zodanig
      is ingericht, dat daarin op overzichtelijke wijze zijn opgenomen de door de inspecteur nodig geoordeelde gegevens
      omtrent de goederen welke met toepassing van de verlangde vereenvoudigde procedure onder een douaneregeling zijn
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel21
  - number: '22.1'
    text: |-
      Indien de vergunninghouder van een domiciliëringsprocedure op grond van wettelijke bepalingen een aanvullende
      aangifte moet indienen, moet deze aangifte vóór de derde werkdag van het tijdvak dat in de vergunning is opgenomen
      zijn ingediend. De aanvullende aangifte ziet op alle goederen welke in de loop van het voorafgaande tijdvak met
      toepassing van deze procedure een douanebestemming hebben gekregen.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel22
  - number: '22.2'
    text: |-
      In gevallen waarin het doen van aangifte binnen de in het eerste lid bedoelde termijn bijzondere bezwaren ontmoet,
      kan de inspecteur toestaan dat de aangifte wordt gedaan uiterlijk de tiende dag van het tijdvak volgend op die
      waarin de goederen een douanebestemming hebben gekregen.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel22
  - number: '22.3'
    text: |-
      In de aangifte wordt, onverminderd hetgeen ingevolge andere wettelijke bepalingen is vereist, als waarde vermeld de
      waarde op de dag waarop de goederen de douanebestemming hebben gekregen. Die dag wordt in de aangifte vermeld.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel22
  - number: '22.4'
    text: |-
      Indien de vergunninghouder van een vereenvoudigde aangifteprocedure op grond van wettelijke bepalingen een
      aanvullende aangifte moet indienen, moet deze aangifte vóór de derde werkdag na de dag waarop de vereenvoudigde
      aangifte is gedaan zijn ingediend bij de inspecteur bij wie de vereenvoudigde aangifte is gedaan.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel22
  - number: '22.5'
    text: |-
      Bij ministeriële regeling kunnen gevallen of groepen van gevallen worden aangewezen waarin voor het doen van
      de aanvullende aangifte, bedoeld in het vierde lid, een termijn geldt die afwijkt van de in dat lid gestelde
      termijn of waarin deze aangifte periodiek wordt gedaan. Indien is bepaald dat de aanvullende aangifte periodiek
      wordt gedaan wordt steeds binnen een te bepalen termijn na het einde van het daartoe vastgestelde tijdvak, een
      aanvullende aangifte gedaan van alle goederen welke in de loop van dat tijdvak met toepassing van de vergunning hun
      douanebestemming hebben gekregen.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel22
  - number: '23.1'
    text: |-
      Indien de overeenkomstig [artikel 22, eerste of tweede lid][ref1], vereiste aangifte niet of niet tijdig wordt
      gedaan, geschiedt in voorkomend geval de berekening van de verschuldigde rechten bij invoer overeenkomstig de door
      de inspecteur aan de hand van de administratie van de vergunninghouder of aan de hand van op andere wijze, zo nodig
      bij wijze van schatting, vastgestelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel22
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007925
        artikel: '22'
        hoofdstuk: '3'
        afdeling: '2'
  - number: '23.2'
    text: |-
      Indien de overeenkomstig [artikel 22, vierde of vijfde lid][ref1], vereiste aangifte niet of niet tijdig wordt
      gedaan, is de vergunninghouder de rechten bij invoer verschuldigd berekend op basis van de vereenvoudigde
      aangifte, waarbij in aanmerking wordt genomen hetgeen bij een eventueel onderzoek van de goederen is bevonden, of
      overeenkomstig andere gegevens die zo nodig bij wijze van schatting worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel22
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007925
        artikel: '22'
        hoofdstuk: '3'
        afdeling: '2'
  - number: '24'
    text: |-
      Bij ministeriële regeling kan, indien bij het vervoer van goederen de identificatie plaatsvindt door middel van
      verzegeling van de laadruimte van een vervoermiddel of een container, worden bepaald dat het vervoermiddel of de
      container, ten behoeve van de beoordeling van het gestelde in artikel 357, derde lid, van de toepassingsverordening
      Communautair douanewetboek, op een bij die regeling aangewezen plaats, voor een onderzoek van de bouw en de
      inrichting van de laadruimte moet worden aangeboden aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel24
  - number: '25.1'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel25
  - number: 25.1.a
    text: |-
      de gevallen waarin het vervoer van goederen in afwijking van artikel 357, vierde lid, van de toepassingsverordening
      Communautair douanewetboek, zonder verzegeling kan plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel25
  - number: 25.1.b
    text: |-
      de overbrenging, al dan niet in gedeelten, binnen het ambtsgebied van het kantoor van bestemming, onder geleide van
      het document dat ten geleide van de goederen is afgegeven voor het vervoer naar dat kantoor van bestemming;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel25
  - number: 25.1.c
    text: |-
      de overbrenging, al dan niet in gedeelten, binnen het ambtsgebied van het kantoor van vertrek, onder geleide van
      het document dat ten geleide van de goederen is afgegeven voor het vervoer vanaf dat kantoor van vertrek.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel25
  - number: '26'
    text: |-
      Een vergunning voor een douane-entrepot van het type E wordt slechts verleend indien de aanvrager van de
      desbetreffende vergunning een bedrijf uitoefent waarvan de administratieve organisatie zodanig is, dat zij
      voldoende waarborgen inhoudt voor een juiste vastlegging van de bedrijfshandelingen en de administratie zodanig
      is ingericht, dat daarin op overzichtelijke wijze zijn opgenomen de door de inspecteur nodig geoordeelde gegevens
      omtrent de goederen welke onder het stelsel van douane-entrepots zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel26
  - number: '27'
    text: |-
      Aan accijns onderworpen goederen kunnen slechts onder het stelsel van douane-entrepots worden geplaatst voorzover
      de [Wet op de accijns][ref1] in deze plaatsing voorziet en onder de daarbij gestelde voorwaarden en beperkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005251
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005251
  - number: '28'
    text: |-
      Indien in een douane-entrepot een overmaat wordt vastgesteld, worden de te veel bevonden goederen geacht onder het
      stelsel van douane-entrepots te zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel28
  - number: '29'
    text: |-
      De entreposeur die zodanige wijziging wenst te brengen in de door hem gevoerde administratie dat daardoor de wijze
      waarop toezicht op het douane-entrepot wordt uitgeoefend, wordt beïnvloed, onderwerpt de voorgenomen wijziging aan
      goedkeuring van de inspecteur. De wijziging wordt niet aangebracht dan na verkregen goedkeuring.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel29
  - number: '30'
    text: |-
      Onverminderd [artikel 41][ref1], dienen goederen welke voor uitvoer zijn vrijgegeven, te blijven in de staat waarin
      zij verkeerden ten tijde van de aanvaarding van de aangifte ten uitvoer.


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel41
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0007925
        artikel: '41'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '32'
    text: |-
      Ter uitvoering van artikel 183 van het Communautair douanewetboek wordt van een schip of een luchtvaartuig dat
      het douanegebied van de Gemeenschap via zee of door de lucht zal verlaten aangifte ten uitklaring gedaan van het
      schip of het luchtvaartuig en alle bij het douanekantoor van uitgang aangebrachte goederen overeenkomstig de bij
      ministeriële regeling vast te stellen bepalingen.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel32
  - number: '34.1'
    text: |-
      Een schip of luchtvaartuig dat het douanegebied van de Gemeenschap ter zee of door de lucht zal verlaten mag niet
      vertrekken uit de haven of van de luchthaven van binnenkomst zonder dat de inspecteur daarvoor toestemming heeft
      verleend.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel34
  - number: '34.2'
    text: |-
      Bij het douanekantoor van uitgang aangebrachte goederen die ter zee of door de lucht het douanegebied van de
      Gemeenschap zullen verlaten, mogen niet worden weggevoerd zonder toestemming van de inspecteur.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel34
  - number: '35.1'
    text: |-
      Ter uitvoering van artikel 183, eerste lid, van het Communautair douanewetboek worden goederen die ter zee het
      douanegebied van de Gemeenschap verlaten vanuit de haven, of in voorkomende gevallen van de bij ministeriële
      regeling aangewezen plaatsen als genoemd in [artikel 4, tweede lid][ref1], rechtstreeks langs de daartoe bij
      ministeriële regeling aangewezen vaarwaters buiten het douanegebied van de Gemeenschap gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel4
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0007925
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '35.2'
    text: |-
      In afwijking van het eerste lid kan onder bij ministeriële regeling vast te stellen voorwaarden worden toegestaan
      dat goederen die ter zee het douanegebied van de Gemeenschap zullen verlaten, worden overgeladen in een uitgaand
      schip op de daartoe bij ministeriële regeling aangewezen plaatsen als genoemd in [artikel 4, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel4
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0007925
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '35.3'
    text: |-
      Ter uitvoering van artikel 183 van het Communautair douanewetboek worden goederen die het douanegebied van de
      Gemeenschap door de lucht zullen verlaten van de luchthaven buiten het douanegebied van de Gemeenschap gebracht
      zonder tussenlanding elders dan op een internationale luchthaven.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel35
  - number: '36.1'
    text: |-
      Schepen welke ingevolge [artikel 8, eerste lid][ref1], bij binnenkomst uit zee zijn vrijgesteld van het bepaalde
      in de [artikelen 4][ref2] en [5][ref3], behoeven bij het uitgaan ter zee niet te worden aangebracht bij een
      douanekantoor van uitgang.


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007925#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0007925#Artikel5
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0007925
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007925
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007925
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '36.2'
    text: |-
      Evenmin behoeven aan een douanekantoor van uitgang worden aangebracht schepen welke over zee van de ene in
      Nederland gelegen haven naar de andere gaan.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel36
  - number: '36.3'
    text: |-
      Luchtvaartuigen welke ingevolge [artikel 12][ref1] bij binnenkomst zijn vrijgesteld van het bepaalde in
      [artikel 10][ref2], behoeven bij het uitgaan niet te worden aangebracht bij een douanekantoor van uitgang.


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007925#Artikel10
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0007925
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007925
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '36.4'
    text: |-
      De voorgaande leden zijn niet van toepassing indien ter zake van de uitvoer, wederuitvoer, dan wel met het oog
      op de verkrijging van kwijtschelding of terugbetaling van rechten bij invoer aan het douanekantoor van uitgang
      formaliteiten moeten worden vervuld.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel36
  - number: '37.1'
    text: |-
      Goederen welke voor uitvoer zijn vrijgegeven kunnen, in afwachting van het verlaten van de Gemeenschap, op de
      voet van deze paragraaf worden opgeslagen in een opslaginrichting die in gebruik is als ruimte voor tijdelijke
      opslag als genoemd in artikel 185 van de toepassingsverordening Communautair douanewetboek. Zodanige opslag kan
      ook plaatsvinden in een douane-entrepot van het type B of C, zonder dat de goederen onder het stelsel van douane-
      entrepots worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel37
  - number: '37.2'
    text: |-
      Het eerste lid is eveneens van toepassing op goederen welke worden vervoerd onder een regeling voor douanevervoer
      en waarvan, overeenkomstig de aanduidingen op de ten behoeve van dat vervoer aanvaarde aangifte, het kantoor van
      bestemming buiten Nederland is gelegen.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel37
  - number: '38'
    text: |-
      De in [artikel 37][ref1] bedoelde goederen mogen, nadat van het voornemen tot opslag kennis is gegeven aan de
      inspecteur, onder overlegging van de aangifte waarmee de goederen zijn aangebracht, zonder verdere formaliteiten in
      één van de in het eerste lid van dat artikel genoemde opslaginrichtingen worden opgeslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel37
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0007925
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '40.1'
    text: |-
      Opslag van goederen op de voet van deze paragraaf in dezelfde ruimten waar andere goederen zijn opgeslagen,
      mag slechts plaatsvinden indien de goederen naar het oordeel van de inspecteur voldoende van elkaar zijn te
      onderscheiden.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel40
  - number: '40.2'
    text: |-
      Goederen welke in strijd met het eerste lid zijn opgeslagen, worden geacht niet op de voet van deze paragraaf te
      zijn opgeslagen.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel40
  - number: '41'
    text: |-
      De opslag wordt beëindigd door uitslag van de goederen. Van het voornemen tot uitslag van goederen wordt, onder
      overlegging van de in [artikel 38][ref1] bedoelde aangifte, kennis gegeven aan de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel38
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0007925
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '42.1'
    text: |-
      De inspecteur kan onder daarbij te stellen voorwaarden toestaan dat ten aanzien van goederen welke op de voet van
      [hoofdstuk 4][ref1], paragraaf 2, zijn opgeslagen:


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0007925
        hoofdstuk: '4'
  - number: 42.1.a
    text: de verpakkingsmiddelen worden vervangen;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel42
  - number: 42.1.b
    text: de colli worden gesplitst;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel42
  - number: 42.1.c
    text: de merken en nummers van de colli worden gewijzigd;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel42
  - number: 42.1.d
    text: losse of gestorte goederen worden verpakt;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel42
  - number: 42.1.e
    text: verpakte goederen welke gestort plegen te worden aangeboden, worden ontpakt;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel42
  - number: 42.1.f
    text: de goederen aan bepaalde onderzoekingen worden onderworpen en worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel42
  - number: '42.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op uitgaande goederen waarvoor het bezwaarlijk is deze met het oog
      op de in dat lid bedoelde behandelingen in een ruimte voor tijdelijke opslag of in een entrepot van het type B of C
      op te slaan.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel42
  - number: '42.3'
    text: |-
      Indien het ten gevolge van dringende noodzakelijkheid niet mogelijk is om toestemming te vragen alvorens uitgaande
      goederen een behandeling als bedoeld in het eerste lid te laten ondergaan, wordt daarvan onverwijld kennis gegeven
      aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel42
  - number: '42.4'
    text: De inspecteur geeft desgevraagd een verklaring af omtrent de staat waarin de goederen na de behandeling verkeren.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel42
  - number: '43'
    text: |-
      Aan accijns onderworpen goederen kunnen slechts in een vrij entrepot worden opgeslagen voor zover de
      [Wet op de accijns][ref1] in deze opslag voorziet en onder de daarbij gestelde voorwaarden en beperkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005251
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005251
  - number: '44'
    text: |-
      Bij ministeriële regeling kunnen voor de in- en uitslag van goederen in en uit vrij entrepot per goederensoort
      minimumhoeveelheden worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel44
  - number: '45'
    text: |-
      De in artikel 799 van de toepassingsverordening Communautair douanewetboek bedoelde belanghebbende die zodanige
      wijziging wenst te brengen in de door hem gevoerde administratie dat daardoor de wijze waarop toezicht op het
      vrij entrepot wordt uitgeoefend wordt beïnvloed, onderwerpt de voorgenomen wijziging aan de goedkeuring van de
      inspecteur. De wijziging wordt niet aangebracht dan na verkregen goedkeuring.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel45
  - number: '46.1'
    text: Vrije entrepots worden, wanneer daar niet wordt gewerkt, ambtelijk gesloten.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel46
  - number: '46.2'
    text: |-
      Buiten de kantooruren van de inspecteur mag alleen met toestemming van de inspecteur in de vrije entrepots worden
      gewerkt.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel46
  - number: 46a.1
    text: |-
      Op aanvraag als bedoeld in artikel 800 van de Toepassingsverordening Communautair douanewetboek kunnen bij
      ministeriële regeling vrije zones controletype II als bedoeld in artikel 168 bis van het Communautair douanewetboek
      worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel46a
  - number: 46a.2
    text: |-
      De aanvraag, bedoeld in het eerste lid, wordt ingediend bij de inspecteur en dient te geschieden door de beoogd
      beheerder van de vrije zone controletype II.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel46a
  - number: 46b.1
    text: 'De beheerder vrije zone controletype II dient ervoor te zorgen dat:'
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel46b
  - number: 46b.1.a
    text: goederen tijdens hun verblijf in de vrije zone controletype II niet aan het douanetoezicht worden onttrokken;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel46b
  - number: 46b.1.b
    text: |-
      de verplichtingen worden nagekomen welke voortvloeien uit de opslag, de veredeling, de behandeling, de aan- of
      verkoop van goederen in een vrije zone controletype II;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel46b
  - number: 46b.1.c
    text: wordt voldaan aan de bijzondere voorwaarden die in de vergunning zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel46b
  - number: 46b.2
    text: |-
      De operateur is altijd verantwoordelijk voor het nakomen van de verplichtingen die voortvloeien uit de plaatsing
      van de goederen in de vrije zone controletype II.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel46b
  - number: 46b.3
    text: |-
      In afwijking van het eerste lid kan in de vergunning worden bepaald dat de in dat lid onder a en b bedoelde
      verplichtingen uitsluitend bij de operateur berusten.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel46b
  - number: 46b.4
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld ten aanzien de werking van de vrije zone
      controletype II.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel46b
  - number: 46c
    text: |-
      De beheerder vrije zone controletype II of de operateur die zodanige wijziging wenst te brengen in of aan een in
      de vrije zone controletype II gelegen gebouw, dan wel in de door hem gevoerde administratie, dat daardoor de wijze
      waarop toezicht op de vrije zone controletype II wordt uitgeoefend wordt beïnvloed, onderwerpt de voorgenomen
      wijziging aan goedkeuring van de inspecteur. De wijziging wordt niet aangebracht dan na verkregen goedkeuring.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel46c
  - number: '47.1'
    text: |-
      Binnengebrachte postzendingen als bedoeld in artikel 237, eerste lid, onderdeel A, van de toepassingsverordening
      Communautair douanewetboek, welke niet rechtstreeks naar een plaats buiten Nederland zullen worden gevoerd, worden
      gebracht naar een sorteerplaats van de Post of naar een bergplaats van de Post.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel47
  - number: '47.2'
    text: |-
      Vanaf de sorteerplaats kunnen postzendingen als bedoeld in artikel 237, derde lid, onderdeel *a*, van de
      toepassingsverordening Communautair douanewetboek zonder verdere formaliteiten ter beschikking worden gesteld aan
      de geadresseerde. Andere postzendingen worden zonder verdere formaliteiten hetzij buiten Nederland gevoerd, hetzij
      overgebracht naar een bergplaats van de Post.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel47
  - number: '48'
    text: |-
      De plaatsen waar sorteerplaatsen en bergplaatsen voor binnengekomen postzendingen zijn gelegen, worden bij
      ministeriële regeling aangewezen in overeenstemming met Onze Minister van Verkeer en Waterstaat. Op de bergplaatsen
      is [artikel 77][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel77
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0007925
        artikel: '77'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '49.1'
    text: |-
      In een bergplaats opgeslagen postzendingen kunnen zonder formaliteiten uit de bergplaats worden uitgeslagen
      mits zij als postzendingen hetzij in een andere bergplaats worden ingeslagen, hetzij buiten Nederland worden
      gevoerd dan wel, indien het betreft postzendingen als bedoeld in artikel 237, derde lid, onderdeel *a*, van de
      toepassingsverordening Communautair douanewetboek, ter beschikking worden gesteld aan de geadresseerde.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel49
  - number: '49.2'
    text: |-
      In andere dan de in het eerste lid vermelde gevallen vindt de uitslag uit de bergplaats plaats nadat een aangifte
      is gedaan om de goederen een douanebestemming te geven in [de zin van artikel 4][ref1], 15°, van het Communautair
      douanewetboek.


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel4
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0007925
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '50.1'
    text: 'Indien goederen als postzending het douanegebied van de Gemeenschap zullen verlaten:'
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel50
  - number: 50.1.a
    text: |-
      bij uitvoer met kwijtschelding of terugbetaling van rechten bij invoer of ter voldoening aan de voorwaarden
      opgenomen in de vergunning voor de betreffende douaneregeling de aangifte ten uitvoer of tot wederuitvoer aan de
      Post overgelegd;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel50
  - number: 50.1.b
    text: |-
      bij uitvoer in andere dan de in [onderdeel ][ref1] vermelde gevallen de aangifte ten uitvoer bij de Post gedaan;


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel50
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0007925
        artikel: '50'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 50.1.c
    text: |-
      indien de goederen voor de regeling douanevervoer zijn aangegeven, de aanvaarde aangifte voor die regeling aan de
      Post overgelegd.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel50
  - number: '50.2'
    text: |-
      De aftekening van de in het eerste lid bedoelde aangiften geschiedt door medewerkers van de Post. Deze aftekening
      kan slechts plaatsvinden op kantoren van de Post in plaatsen die bij ministeriële regeling in overeenstemming met
      Onze Minister van Verkeer en Waterstaat zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel50
  - number: '51.1'
    text: |-
      Een exploitant van een pijpleiding als bedoeld in artikel 450 van de toepassingsverordening Communautair
      douanewetboek, neemt de leidingen en de van de leidinginstallatie deel uitmakende gebouwen en inrichtingen niet in
      gebruik dan nadat de ligging en de inrichting daarvan door de inspecteur zijn goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel51
  - number: '51.2'
    text: |-
      Bij het verzoek, bedoeld in [artikel 3][ref1], wordt een opgave gedaan van de leidingen en van de gebouwen en
      inrichtingen, onder overlegging van duidelijke tekeningen op schaal.


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel3
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0007925
        artikel: '3'
        hoofdstuk: '1'
  - number: '52'
    text: |-
      Langs leidingen binnenkomende goederen worden gevoerd naar een plaats waar de soort en de hoeveelheid van de
      goederen worden bepaald. Dienovereenkomstig worden de soort en de hoeveelheid van de goederen vermeld in de
      aangiften welke naar gelang van de bestemmingen die de goederen hebben gevolgd, worden gedaan.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel52
  - number: '53'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat, indien aan de hand van de administratie een doeltreffende
      controle kan worden verricht, de vereiste douaneaangiften naar door bij die regeling te stellen regels maandelijks
      worden gedaan.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel53
  - number: '54'
    text: |-
      Indien een douaneaangifte als bedoeld in artikel 201, derde lid, van het Communautair douanewetboek, is opgesteld
      op basis van gegevens die er toe leiden dat de verschuldigde rechten bij invoer gedeeltelijk niet worden geheven,
      is de persoon die de voor de opstelling van die aangifte benodigde gegevens heeft verstrekt terwijl hij wist
      of redelijkerwijs had moeten weten dat deze gegevens verkeerd waren, eveneens schuldenaar voor de verschuldigde
      rechten bij invoer.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel54
  - number: '55.1'
    text: |-
      De bedragen van de verschuldigde rechten bij invoer, administratieve boeten, compenserende rente en kosten
      van ambtelijke werkzaamheden, zomede van de ter zake te verlenen terugbetalingen en kwijtscheldingen, worden
      rekenkundig afgerond op centen.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel55
  - number: '55.2'
    text: |-
      Geschiedt de berekening van de rechten bij invoer, de terugbetaling of de kwijtschelding aan de hand van een
      aangifte, dan vindt de afronding plaats voor elk onderdeel van de aangifte.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel55
  - number: '56.1'
    text: |-
      Voor de berekening van de verschuldigde rechten bij invoer worden gedeelten van een euro rekenkundig afgerond op
      hele euro's en worden gedeelten van een kilogram, van een liter of van een meter voor een geheel kilogram, een
      gehele liter of een gehele meter genomen.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel56
  - number: '56.2'
    text: |-
      In afwijking in zoverre van het eerste lid, worden, indien de hoeveelheid waarover de rechten bij invoer moeten
      worden berekend, minder dan een kilogram, een liter of een meter bedraagt, gedeelten van 100 gram, van een
      deciliter of van een decimeter voor 100 gram, een gehele deciliter of een gehele decimeter genomen.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel56
  - number: '56.3'
    text: |-
      De berekening van de rechten bij invoer op basis van het volumepercentage ethylalcohol geschiedt per tiende percent
      absolute ethylalcohol, met dien verstande dat gedeelten van een tiende percent worden verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel56
  - number: '56.4'
    text: |-
      Ingeval de hoeveelheid goederen waarover de rechten bij invoer moeten worden berekend groter of kleiner is dan de
      hoeveelheid waarin het tarief van het invoerrecht is uitgedrukt, worden de rechten bij invoer naar evenredigheid
      berekend.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel56
  - number: '57.1'
    text: |-
      De boeking van rechten bij invoer bedoeld in [artikel 1, tweede lid, van de Douanewet][ref1] blijft achterwege
      indien het totaal verschuldigde bedrag niet meer bedraagt dan € 10.


      [ref1]: https://wetten.overheid.nl/BWBR0007632#Artikel1
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0007632
        artikel: '1'
  - number: '57.2'
    text: |-
      In geval een aanvullende aangifte als bedoeld in artikel 76, tweede lid, van het Communautair douanewetboek wordt
      gedaan, is het op grond van die aangifte getotaliseerde verschuldigde bedrag bepalend voor de toepassing van het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel57
  - number: '58'
    text: |-
      De voor de toepassing van artikel 226, onderdeel *b*, van het Communautair douanewetboek in aanmerking te nemen
      periode is de kalendermaand.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel58
  - number: '59'
    text: 'Deze paragraaf verstaat onder:'
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel59
  - number: 59.a
    text: |-
      meerdere: de ambtenaar van de rijksbelastingdienst die uit hoofde van zijn functie of krachtens beschikking of
      aanwijzing met de leiding is belast of het bevel heeft over de taakuitvoering;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel59
  - number: 59.b
    text: 'geweld: elke dwangmatige kracht van meer dan geringe betekenis uitgeoefend op personen of zaken;'
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel59
  - number: 59.c
    text: |-
      aanwenden van geweld: het gebruiken van geweld en het dreigen met geweld, waaronder niet wordt begrepen het uit
      voorzorg ter hand nemen van een vuurwapen;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel59
  - number: 59.d
    text: |-
      geweldmiddel: de wapens en de uitrusting, waarmee geweld kan worden uitgeoefend, die krachtens
      [artikel 3a, derde lid, van de Wet wapens en munitie][ref1] zijn toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel3a
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: 3a
  - number: '60'
    text: |-
      Het gebruik van een geweldmiddel is uitsluitend toegestaan aan een ambtenaar van de rijksbelastingdienst die in het
      gebruik van dat geweldmiddel is geoefend.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel60
  - number: '61.1'
    text: |-
      Indien de ambtenaar van de rijksbelastingdienst onder leiding van een ter plaatse aanwezige meerdere optreedt,
      gebruikt hij geen geweld dan na uitdrukkelijke last van deze meerdere. De meerdere geeft daarbij aan van welk
      geweldmiddel gebruik wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel61
  - number: '61.2'
    text: |-
      Het eerste lid is niet van toepassing in het geval de meerdere, bedoeld in het eerste lid, vooraf anders heeft
      bepaald.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel61
  - number: '62.1'
    text: 'Het gebruik van een vuurwapen is slechts geoorloofd:'
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel62
  - number: 62.1.a
    text: om een visitatie van vervoermiddelen te bewerkstelligen;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel62
  - number: 62.1.b
    text: |-
      om een persoon aan te houden ten aanzien van wie redelijkerwijs mag worden aangenomen dat hij een voor onmiddellijk
      gebruik gereed zijnd vuurwapen bij zich heeft en dit tegen personen zal gebruiken;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel62
  - number: 62.1.c
    text: |-
      om een persoon aan te houden die zich aan zijn aanhouding, voorgeleiding of andere rechtmatige vrijheidsbeneming
      tracht te onttrekken of heeft onttrokken en die wordt verdacht van of is veroordeeld wegens het plegen van een
      ernstig misdrijf, dat bovendien moet worden aangemerkt als een grove aantasting van de rechtsorde.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel62
  - number: '62.2'
    text: |-
      Het gebruik in het eerste lid is slechts geoorloofd tegen personen en vervoermiddelen waarin of
      waarop zich personen bevinden, indien deze personen of vervoermiddelen aanwezig zijn in of op de in
      [artikel 12 van de Douanewet][ref1] bedoelde entrepots, ruimten voor tijdelijke opslag, plaatsen,
      spoorwegemplacementen, havens, haventerreinen, luchthavens, terreinen, gebouwen en erven.


      [ref1]: https://wetten.overheid.nl/BWBR0007632#Artikel12
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0007632
        artikel: '12'
  - number: '62.3'
    text: |-
      In de gevallen, bedoeld in het eerste lid, onderdelen *b* en *c*, wordt van het vuurwapen geen gebruik gemaakt,
      indien de identiteit van de aan te houden persoon bekend is en redelijkerwijs mag worden aangenomen dat het uitstel
      van de aanhouding geen onaanvaardbaar te achten gevaar voor de rechtsorde met zich brengt.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel62
  - number: '62.4'
    text: |-
      Onder het plegen van een ernstig misdrijf, bedoeld in het eerste lid, onderdeel *c*, worden mede begrepen de poging
      en de deelnemingsvormen, bedoeld in de [artikelen 47][ref1] en [48 van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel48
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '47'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '48'
  - number: '63'
    text: |-
      De ambtenaar van de rijksbelastingdienst mag in verband met zijn eigen veiligheid of die van anderen slechts uit
      voorzorg een vuurwapen ter hand nemen indien redelijkerwijs mag worden aangenomen dat een situatie ontstaat waarin
      hij bevoegd is het vuurwapen te gebruiken. Zodra blijkt dat een dergelijke situatie zich niet voordoet, wordt het
      vuurwapen terstond opgeborgen.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel63
  - number: '64'
    text: Het trekken van een vuurwapen is slechts geoorloofd in gevallen waarin het gebruik van een vuurwapen toegestaan is.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel64
  - number: '65.1'
    text: |-
      De ambtenaar van de rijksbelastingdienst waarschuwt onmiddellijk voordat hij gericht met een vuurwapen zal
      schieten, met luide stem of op andere niet mis te verstane wijze dat geschoten zal worden, indien niet onverwijld
      het gegeven bevel wordt opgevolgd. Deze waarschuwing, die zonodig vervangen kan worden door een waarschuwingsschot,
      blijft slechts achterwege, wanneer de omstandigheden de waarschuwing niet toelaten.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel65
  - number: '65.2'
    text: |-
      Een waarschuwingsschot moet op zodanige wijze worden gegeven dat gevaar voor personen of zaken zoveel mogelijk
      wordt vermeden.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel65
  - number: '66.1'
    text: |-
      De ambtenaar van de rijksbelastingdienst die geweld heeft aangewend, meldt dit aanwenden van geweld, de redenen die
      daartoe hebben geleid en de daaruit voortvloeiende gevolgen onverwijld schriftelijk aan zijn meerdere.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel66
  - number: '66.2'
    text: |-
      Indien de aanwending van het geweld lichamelijk letsel van meer dan geringe betekenis tot gevolg heeft gehad en in
      alle gevallen waarin van een vuurwapen gebruik is gemaakt, dient deze melding tevens ter kennis te worden gebracht
      van de officier van justitie van het arrondissement waarbinnen het geweld is aangewend.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel66
  - number: '66.3'
    text: 'De melding, bedoeld in het eerste en tweede lid, geschiedt binnen 48 uur in de vorm van een rapport indien:'
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel66
  - number: 66.3.a
    text: |-
      de gevolgen van het aangewende geweld daartoe, naar het oordeel van de in het eerste lid bedoelde meerdere,
      aanleiding geven, of
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel66
  - number: 66.3.b
    text: gebruik is gemaakt van enig geweldmiddel en lichamelijk letsel dan wel de dood veroorzaakt is.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel66
  - number: '67'
    text: |-
      Indien de aanwending van het geweld met gebruikmaking van enig geweldmiddel op uitdrukkelijke last van een meerdere
      heeft plaatsgevonden, wordt het rapport, bedoeld in [artikel 66, derde lid][ref1], door die meerdere opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel66
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0007925
        artikel: '66'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '68'
    text: |-
      De meerdere licht de ambtenaar van de rijksbelastingdienst zo spoedig mogelijk in over de afhandeling van de
      melding. Desgevraagd worden aan de ambtenaar van de rijksbelastingdienst tussentijds inlichtingen verstrekt.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel68
  - number: '69'
    text: |-
      Het onderzoek, bedoeld in [artikel 27, derde lid, van de Douanewet][ref1], geschiedt door het oppervlakkig aftasten
      van de kleding en wordt zoveel mogelijk uitgevoerd door een ambtenaar van de rijksbelastingdienst van hetzelfde
      geslacht als degene die aan het onderzoek wordt onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0007632#Artikel27
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0007632
        artikel: '27'
  - number: '70'
    text: |-
      De ambtenaar van de rijksbelastingdienst die een onderzoek als bedoeld in
      [artikel 27, derde lid, van de Douanewet][ref1] heeft uitgevoerd, meldt dit onverwijld schriftelijk aan de
      meerdere, onder vermelding van de redenen die tot dit onderzoek hebben geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0007632#Artikel27
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0007632
        artikel: '27'
  - number: '71.1'
    text: |-
      De ambtenaar van de rijksbelastingdienst kan een persoon die rechtens van zijn vrijheid is beroofd, ten behoeve van
      het vervoer handboeien aanleggen.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel71
  - number: '71.2'
    text: |-
      De maatregel, bedoeld in het eerste lid, kan slechts worden getroffen, indien de feiten of omstandigheden dit
      redelijkerwijs vereisen met het oog op gevaar voor ontvluchting, dan wel met het oog op gevaar voor de veiligheid
      of het leven van de persoon die rechtens van zijn vrijheid is beroofd, van de ambtenaar van de rijksbelastingdienst
      of van derden.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel71
  - number: '71.3'
    text: 'De in het tweede lid bedoelde feiten of omstandigheden kunnen slechts gelegen zijn in:'
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel71
  - number: 71.3.a
    text: de persoon die rechtens van zijn vrijheid is beroofd, of
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel71
  - number: 71.3.b
    text: |-
      de aard van het strafbare feit op grond waarvan de vrijheidsbeneming heeft plaatsgevonden, één en ander in
      samenhang met de wijze waarop en de situatie waarin het vervoer plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel71
  - number: '72'
    text: |-
      De ambtenaar van de rijksbelastingdienst die gebruik heeft gemaakt van handboeien als bedoeld in
      [artikel 71, eerste lid][ref1], meldt dit onverwijld schriftelijk aan de meerdere, onder vermelding van de redenen
      die tot het gebruik van handboeien hebben geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel71
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0007925
        artikel: '71'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '73'
    text: |-
      De ambtenaar van de rijksbelastingdienst maakt bij de uitoefening van zijn dienst uitsluitend gebruik van het door
      of vanwege Onze Minister verstrekte geweldmiddel of de door of vanwege deze minister verstrekte handboeien.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel73
  - number: '74.1'
    text: 'Ter zake van het verrichten van de volgende ambtelijke werkzaamheden zijn kosten verschuldigd:'
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel74
  - number: 74.1.a
    text: |-
      het bewaken van goederen in de gevallen waarin niet is voldaan aan het vereiste in de wettelijke bepalingen dat de
      identificatie van de goederen moet zijn verzekerd;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel74
  - number: 74.1.b
    text: |-
      het opnieuw opnemen van de inhoudsruimte van bergingsmiddelen en werktuigen, zomede het opnieuw verifiëren van
      peilinstrumenten en meetapparaten, ingeval zulks ingevolge wettelijke bepalingen op vordering van de belanghebbende
      geschiedt, en de uitkomst van de opneming of de verificatie niet van het vroeger bevondene verschilt;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel74
  - number: 74.1.c
    text: |-
      het heronderzoek van goederen, ingeval tussen de uitkomst van het onderzoek en die van het heronderzoek geen
      verschil bestaat in het voordeel van de belanghebbende;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel74
  - number: 74.1.d
    text: 'werkzaamheden verricht op verzoek van de belanghebbende:'
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel74
  - number: 74.1.d.1°
    text: buiten de gewone diensttijd;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel74
  - number: 74.1.d.2°
    text: |-
      elders dan aan douanekantoren, in ruimten voor tijdelijke opslag, entrepots en panden waar zich goederen bevinden
      waarvoor vrijstelling van rechten bij invoer wordt genoten dan wel waarbij de plaatsing onder de betreffende
      douaneregeling aan een vergunning is onderworpen;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel74
  - number: 74.1.e
    text: |-
      het op verzoek van de belanghebbende instellen van een onderzoek naar de laadruimte van een vervoermiddel of een
      container, elders dan op een daarvoor krachtens [artikel 24][ref1] aangewezen plaats;


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel24
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0007925
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: 74.1.f
    text: |-
      werkzaamheden verricht ter opheffing van de gevolgen van het door de belanghebbende niet naleven van de wettelijke
      bepalingen of van een te zijnen aanzien getroffen regeling;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel74
  - number: 74.1.g
    text: |-
      werkzaamheden welke voortvloeien uit het teloorgaan, vernietigen, bederven of op andere wijze onbruikbaar worden
      van goederen;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel74
  - number: 74.1.h
    text: |-
      werkzaamheden niet voorzien in de wettelijke bepalingen, uitsluitend verricht op verzoek of ten behoeve van de
      belanghebbende.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel74
  - number: '74.2'
    text: |-
      Het bepaalde in het eerste lid, onderdeel *d*, vindt geen toepassing ingeval ontheffing is verleend van de
      verplichting tot het aanbrengen aan een douanekantoor of douanekantoor van uitgang en de werkzaamheden in verband
      met de aard van de goederen, de wijze van transport of om andere redenen, naar het oordeel van de inspecteur kunnen
      worden verricht binnen het kader van de normale dienstuitoefening.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel74
  - number: '74.3'
    text: |-
      Voor de behandeling van een verzoek om kwijtschelding of terugbetaling van rechten bij invoer zijn slechts kosten
      verschuldigd indien de rechten bij invoer ten onrechte zijn geheven als gevolg van een laakbare slordigheid of
      nalatigheid van de aangever of diens opdrachtgever.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel74
  - number: '75.1'
    text: Als gewone diensttijd wordt aangemerkt de tijd op werkdagen gelegen tussen 07.00 en 19.00 uur.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel75
  - number: '75.2'
    text: |-
      Voor douanekantoren als bedoeld in de[artikelen 4][ref1] en [10][ref2] en voor laatste kantoren wordt met
      betrekking tot werkzaamheden welke verband houden met het nakomen van verplichtingen, bij wettelijke bepalingen
      opgelegd ter zake van het binnenbrengen van goederen in of het verlaten van goederen van het douanegebied van de
      Gemeenschap, als gewone diensttijd aangemerkt, de tijd gedurende welke het douanekantoor of laatste kantoor voor
      het aangeven van die goederen is opengesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007925#Artikel10
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0007925
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007925
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '75.3'
    text: |-
      Andere tijden dan de in het eerste lid genoemde tijd, gedurende welke op of aan douanekantoren het lossen,
      laden, verpakken en ontpakken van goederen gebruikelijk is, worden voor wat betreft de daar verband mee houdende
      ambtelijke werkzaamheden mede aangemerkt als gewone diensttijd. De inspecteur wijst de plaatsen aan waar, alsmede
      de tijden gedurende welke, het lossen, laden, verpakken en ontpakken als gebruikelijk moet worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel75
  - number: '75.4'
    text: |-
      Voor de toepassing van het eerste lid worden onder werkdagen niet begrepen de zaterdagen, de zondagen en de in
      [artikel 3, eerste lid, van de Algemene termijnenwet][ref1], genoemde algemeen erkende feestdagen.


      [ref1]: https://wetten.overheid.nl/BWBR0002448#Artikel3
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0002448
        artikel: '3'
  - number: '76'
    text: |-
      Op de uit te keren opbrengst van in bewaring genomen goederen - in geval van uitoefening van het recht van verhaal
      op hetgeen is overgebleven - wordt na aftrek van de kosten een vergoeding in mindering gebracht welke bedraagt:
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel76
  - number: 76.a
    text: |-
      zes percent van de kosten, doch ten minste € 5 indien de goederen niet binnen zes maanden na de mededeling omtrent
      de inbewaringneming zijn verkocht;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel76
  - number: 76.b
    text: drie percent van de kosten, doch ten minste € 2 in de overige gevallen.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel76
  - number: '77.1'
    text: |-
      De inrichting van visitatieruimten op haven- en luchtvaartterreinen en van andere voor douanedoeleinden dienende
      gebouwen, gedeelten van gebouwen en terreinen van vervoersondernemingen in geregelde dienst, moet zodanig zijn dat
      de ambtelijke werkzaamheden op doelmatige wijze kunnen worden verricht.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel77
  - number: '77.2'
    text: |-
      Een dergelijke ruimte of een dergelijk gebouw, gedeelte van een gebouw of terrein mag voor douanedoeleinden niet in
      gebruik worden genomen alvorens de inrichting ervan door de inspecteur is goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel77
  - number: '77.3'
    text: Een wijziging in de inrichting wordt niet aangebracht dan na verkregen goedkeuring van de inspecteur.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel77
  - number: '77.4'
    text: |-
      Indien de doelmatigheid van de ambtelijke werkzaamheden zulks vordert kan de inspecteur eisen dat binnen een door
      hem, gezien de aard van de wijziging, te bepalen redelijke termijn, wijziging wordt gebracht in de inrichting. De
      belanghebbende wordt daarvan schriftelijk in kennis gesteld. Indien de wijziging niet binnen de gestelde termijn is
      aangebracht, kan de inspecteur bepalen dat het gebruik voor douanedoeleinden niet meer is toegestaan.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel77
  - number: '78'
    text: |-
      Bij ministeriële regeling worden regels gesteld welke noodzakelijk zijn voor de goede werking van de wettelijke
      bepalingen:
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel78
  - number: 78.a
    text: |-
      inzake vrijstelling van rechten bij invoer, vastgesteld overeenkomstig artikel 184 van het Communautair
      douanewetboek;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel78
  - number: 78.b
    text: |-
      inzake de preferentiële tariefmaatregelen als bedoeld in artikel 20, derde lid, onderdelen *d*, *e*, *f* en *g*,
      van het Communautair douanewetboek;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel78
  - number: 78.c
    text: inzake de gunstige tariefbehandeling als bedoeld in artikel 21 van het Communautair douanewetboek;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel78
  - number: 78.d
    text: |-
      inzake de forfaitaire heffing van rechten bij invoer als bedoeld in bijlage I, titel II, onderdeel C, 1°,
      van [Verordening (EEG) nr. 2658/87](31987R2658) van 23 juli 1987 van de Raad met betrekking tot de tarief- en
      statistieknomenclatuur en het gemeenschappelijk douanetarief;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel78
  - number: 78.e
    text: |-
      inzake de douanewaarde van goederen, in het bijzonder de bepalingen betreffende de toe te passen wisselkoers en
      die betreffende de eenheidswaarde van bepaalde goederen als bedoeld in artikel 173 van de toepassingsverordening
      Communautair douanewetboek.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel78
  - number: '79.1'
    text: |-
      Goederen welke ten behoeve van de verrichting van ambtelijke werkzaamheden zijn gelost uit het vervoermiddel waarin
      of waarop zij zich bevonden, worden niet geladen dan met toestemming van de inspecteur.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel79
  - number: '79.2'
    text: |-
      Voor zover niet anders is bepaald, worden binnengebrachte goederen en goederen, die het douanegebied van de
      Gemeenschap zullen verlaten, waarvoor een summiere aangifte dan wel een douaneaangifte is gedaan, niet weggevoerd
      van de plaats waar zij zich volgens de aangifte bevinden, dan met toestemming van de inspecteur.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel79
  - number: '80.1'
    text: |-
      Indien de lossing, lading, inslag of uitslag van goederen krachtens wettelijke bepalingen slechts kan geschieden
      indien daartoe een aangifte is gedaan, wordt, voor zover bij ministeriële regeling niet anders is bepaald, niet
      aangevangen met de lossing, lading, inslag of uitslag dan met toestemming van de inspecteur.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel80
  - number: '80.2'
    text: |-
      De in het eerste lid bedoelde toestemming wordt verleend na kennisgeving van de voorgenomen lossing, lading, inslag
      of uitslag van goederen.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel80
  - number: '81'
    text: |-
      De entreposeur of een in artikel 799 van de toepassingsverordening Communautair douanewetboek bedoelde
      belanghebbende die handelt in strijd met het bepaalde in de hem verleende vergunning beloopt een bestuurlijke boete
      van € 90.
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel81
  - number: '82'
    text: 'Strafbare feiten zijn:'
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel82
  - number: 82.a
    text: het zonder de ingevolge wettelijke bepalingen vereiste toestemming lossen, laden, inslaan of uitslaan van goederen;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel82
  - number: 82.b
    text: het achterwege laten van een ingevolge wettelijke bepalingen verplichte kennisgeving of inkennisstelling;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel82
  - number: 82.c
    text: |-
      het zonder de ingevolge wettelijke bepalingen vereiste toestemming wegvoeren van goederen of vertrekken met een
      vervoermiddel;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel82
  - number: 82.d
    text: |-
      het in strijd met dit besluit met een binnenkomend luchtvaartuig landen elders dan op een internationale luchthaven
      of op een tijdstip waarop de internationale luchthaven daarvoor niet is opengesteld;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel82
  - number: 82.e
    text: |-
      het nalaten te voldoen aan een krachtens [artikel 25][ref1] gestelde voorwaarde;


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel25
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0007925
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: 82.f
    text: |-
      het in strijd met wettelijke bepalingen verandering brengen in de staat waarin binnengebrachte goederen of goederen
      die het douanegebied van de Gemeenschap zullen verlaten zijn aangebracht;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel82
  - number: 82.g
    text: het in strijd met wettelijke bepalingen wijziging brengen in de administratie van een entrepot;
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel82
  - number: 82.h
    text: |-
      het achterwege laten of niet tijdig doen van een aangifte bedoeld in [artikel 22][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel22
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0007925
        artikel: '22'
        hoofdstuk: '3'
        afdeling: '2'
  - number: '83'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop de [Douanewet][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0007632
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0007632
  - number: '84'
    text: 'Dit besluit wordt aangehaald als: Douanebesluit.'
    url: https://wetten.overheid.nl/BWBR0007925/2005-01-01#Artikel84
