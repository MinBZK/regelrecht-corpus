preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw en Visserij, van 4 april 1989, J. 891072, Directie Juridische en
    Bedrijfsorganisatorische Zaken, gedaan in overeenstemming met de Staatssecretaris van Welzijn, Volksgezondheid en
    Cultuur na overleg met de Staatssecretaris van Sociale Zaken en Werkgelegenheid;

    Gelet op artikel 42, eerste lid, onderdelen b, d, e en f, van de Diergeneesmiddelenwet (Stb. 1985, 410);

    De Raad van State gehoord (advies van 8 augustus 1989, nr. W11.89.0183);

    Gezien het nader rapport van Onze Minister van Landbouw en Visserij, van 9 oktober 1989 No. J. 897266, Directie
    Juridische en Bedrijfsorganisatorische Zaken, uitgebracht in overeenstemming met de Staatssecretaris van Welzijn,
    Volksgezondheid en Cultuur;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004640/1993-12-23#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      wet: [Diergeneesmiddelenwet][ref1] (*Stb.* 1985, 410);

      magistraal bereiden: bereiden van diergeneesmiddelen bedoeld in [artikel 2, tweede lid, onderdeel ][ref2], van
      de wet;

      ambulante handel: het afleveren in het kader van markthandel, straathandel en handel te water, zomede het afleveren
      van diergeneesmiddelen aan de huizen van vaste afnemers alsmede in het kader van het venten, zijnde de vorm van
      straathandel in de uitoefening waarvan diergeneesmiddelen aan willekeurige gegadigden worden afgeleverd anders dan
      op een vaste standplaats;

      gekanaliseerde diergeneesmiddelen: diergeneesmiddelen bedoeld in artikel 29 van de wet;

      verpakking, recipiënt of buitenverpakking: hetgeen daaronder wordt verstaan in het
      [Besluit verpakking en etikettering diergeneesmiddelen][ref3] (*Stb.* 1986, 511).


      [ref1]: https://wetten.overheid.nl/BWBR0003818
      [ref2]: https://wetten.overheid.nl/BWBR0004640#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004022
    url: https://wetten.overheid.nl/BWBR0004640/1993-12-23#Artikel1
    references:
