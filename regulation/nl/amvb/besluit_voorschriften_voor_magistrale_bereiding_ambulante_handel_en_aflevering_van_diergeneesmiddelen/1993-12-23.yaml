  - number: '2'
    text: |-
      1 Het is dierenartsen verboden diergeneesmiddelen magistraal te bereiden, tenzij het bereiden uitsluitend plaats
      vindt:

      a. in een lokaliteit die voldoet aan de in artikel 5 gestelde eisen;

      b. hetzij door hen zelf, hetzij door anderen onder hun persoonlijke toezicht en verantwoordelijkheid, en

      c. in verband met een aanwijsbaar ziektegeval en ten behoeve van dieren die bij hen onder behandeling zijn en
      waarvoor hun hulp is ingeroepen.

      2 Het is verboden magistraal bereide diergeneesmiddelen in voorraad te hebben.
    url: https://wetten.overheid.nl/BWBR0004640/1993-12-23#Artikel2
  - number: '3'
    text: |-
      Het is dierenartsen verboden recepten voor de magistrale bereiding uit te schrijven of af te geven anders dan
      in verband met een aanwijsbaar ziektegeval bij dieren die bij hen onder behandeling zijn en waarvoor hun hulp is
      ingeroepen.
    url: https://wetten.overheid.nl/BWBR0004640/1993-12-23#Artikel3
  - number: '4'
    text: |-
      Het is dierenartsen verboden diergeneesmiddelen magistraal te bereiden of daartoe recepten uit te schrijven of af
      te geven indien diergeneesmiddelen voor eenzelfde doel zijn geregistreerd, dan wel diergeneesmiddelen met dezelfde
      werkzame substantie en farmaceutische vorm zijn geregistreerd.
    url: https://wetten.overheid.nl/BWBR0004640/1993-12-23#Artikel4
  - number: '5'
    text: |-
      De lokaliteit die door een dierenarts wordt gebruikt om diergeneesmiddelen magistraal te bereiden dient:

      a. voldoende groot te zijn en zodanig te zijn ingericht dat daarin alle noodzakelijke handelingen naar behoren
      kunnen worden verricht;

      b. goed onderhouden, schoon, opgeruimd en goed verlicht te zijn;

      c. van een zodanige klimaatbeheersing te zijn voorzien, dat de temperatuur en de vochtigheidsgraad geen ongewenste
      invloed kunnen uitoefenen op de zich daarin bevindende grondstoffen of diergeneesmiddelen;

      d. van een vlakke, gladde en ondoorlaatbare vloer te zijn voorzien, zonder scheuren of open afvoeren.
    url: https://wetten.overheid.nl/BWBR0004640/1993-12-23#Artikel5
  - number: '6'
    text: De ambulante handel in gekanaliseerde diergeneesmiddelen is verboden.
    url: https://wetten.overheid.nl/BWBR0004640/1993-12-23#Artikel6
  - number: '7'
    text: |-
      De ambulante handel in andere dan gekanaliseerde diergeneesmiddelen is verboden, tenzij:

      a. degene die de ambulante handel bedrijft, beschikt over een lokaliteit waarin diergeneesmiddelen worden bewaard
      welke tenminste voldoet aan de in artikel 25 van het Eisen- en controlebesluit 1993, bedoelde eisen.

      b. de diergeneesmiddelen op de plaats van verkoop duidelijk gescheiden worden gehouden van andere produkten en zij
      zich bevinden in een verpakking welke het gebruik van het desbetreffende diergeneesmiddel slechts mogelijk maakt
      bij één of een klein aantal dieren;

      c. de diergeneesmiddelen verpakt in daarvoor bestemde bakken worden gehouden, die geen vocht doorlaten, schoon,
      vlak, glad en afwasbaar zijn. De inhoud van de desbetreffende bak moet groter zijn dan het totaal volume van de
      zich daarin bevindende verpakkingen;

      d. de plaats van waar of waaruit de verkoop van diergeneesmiddelen plaatsvindt, schoon en droog is en op eenvoudige
      wijze kan worden gereinigd;

      e. de diergeneesmiddelen in een zodanige toestand worden gehouden dat de kwaliteit voldoende blijft gewaarborgd;

      f. de plaats waar de verkoop van diergeneesmiddelen plaatsvindt van voldoende verlichting is voorzien.
    url: https://wetten.overheid.nl/BWBR0004640/1993-12-23#Artikel7
  - number: '8'
    text: |-
      1 Het is verboden diergeneesmiddelen af te leveren aan houders van dieren indien:

      a. de houdbaarheidstermijn is verstreken;

      b. de aanduidingen op de recipiënt, en in voorkomend geval de buitenverpakking of bijsluiter onleesbaar zijn
      gemaakt of daarin wijzigingen zijn aangebracht;

      c. de oorspronkelijke sluiting van de recipiënt en in voorkomend geval van de buitenverpakking is verbroken.

      2 Het in het eerste lid, aanhef en onderdeel *c*, bepaalde geldt niet ten aanzien van het afleveren van
      diergeneesmiddelen aan houders van dieren door dierenartsen en apothekers mits de oorspronkelijke sluiting
      is vervangen door een sluiting welke is voorzien van de naam en het adres van de desbetreffende dierenarts of
      apotheker.
    url: https://wetten.overheid.nl/BWBR0004640/1993-12-23#Artikel8
  - number: '9'
    text: |-
      1 Het is verboden gekanaliseerde diergeneesmiddelen, diergeneesmiddelen of gemedicineerde voeders waarvoor een
      wachttermijn geldt of magistraal bereide diergeneesmiddelen af te leveren aan degene die bedrijfsmatig dieren
      houdt, zonder daarbij schriftelijk de noodzakelijke gegevens te verstrekken omtrent dat diergeneesmiddel of
      gemedicineerd voeder.

      2 Het is een dierenarts verboden gekanaliseerde diergeneesmiddelen, diergeneesmiddelen of gemedicineerde voeders
      waarvoor een wachttermijn geldt of magistraal bereide diergeneesmiddelen voor te schrijven, zonder daarbij
      aan degene die bedrijfsmatig dieren houdt schriftelijk de noodzakelijke gegevens te verstrekken omtrent dat
      diergeneesmiddel of gemedicineerd voeder.

      3 Onze Minister kan met betrekking tot het verstrekken van de in het eerste en tweede lid bedoelde gegevens nadere
      regelen stellen.
    url: https://wetten.overheid.nl/BWBR0004640/1993-12-23#Artikel9
  - number: '10'
    text: |-
      Het is onverminderd het bepaalde in het [Besluit verpakking en etikettering diergeneesmiddelen][ref1] aan
      dierenartsen en apothekers verboden gekanaliseerde diergeneesmiddelen af te leveren aan houders van dieren indien
      de verpakking of het etiket niet tevens is voorzien van een aanduiding inhoudende de vermelding "dierenarts" of
      "apotheker" alsmede hun adres en de datum waarop de betrokken aflevering plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0004022
    url: https://wetten.overheid.nl/BWBR0004640/1993-12-23#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004022
  - number: '11'
    text: |-
      1 Dit besluit treedt met uitzondering van [artikel 2, eerste lid, onderdeel ][ref1], en [de artikelen 5][ref2] en
      [7][ref3] in werking met ingang van de tweede kalendermaand na de datum van uitgifte van het *Staatsblad* waarin
      het wordt geplaatst.

      2 [Artikel 2, eerste lid, onderdeel ][ref4], en [de artikelen 5][ref5] en [7][ref6] treden in werking met ingang
      van de dertiende maand na de datum van uitgifte van het *Staatsblad* waarin het besluit wordt geplaatst.

      3 Dit besluit kan worden aangehaald als: Besluit voorschriften voor magistrale bereiding, ambulante handel en
      aflevering van diergeneesmiddelen.


