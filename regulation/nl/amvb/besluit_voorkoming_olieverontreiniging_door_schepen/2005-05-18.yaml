        artikel: '18'
        hoofdstuk: II
  - number: '2.1'
    text: Tenzij uitdrukkelijk anders bepaald, zijn de bepalingen van dit besluit van toepassing op alle schepen.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel2
  - number: 2.2.a
    text: |-
      Op schepen geen olietankschepen zijnde, welke zijn uitgerust met laadruimten, gebouwd en gebruikt voor het vervoer
      van olie in bulk met een totale inhoud van 200m3 of meer, zijn voor wat betreft de constructie en het gebruik
      van die laadruimten, de bepalingen voor olietankschepen van de [artikelen 9][ref1], [10][ref2], [14][ref3],
      [15, eerste tot en met vijfde lid][ref4], [18][ref5], [20][ref6], en [24, vierde lid][ref7], eveneens van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003936#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003936#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0003936#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0003936#Artikel18
      [ref6]: https://wetten.overheid.nl/BWBR0003936#Artikel20
      [ref7]: https://wetten.overheid.nl/BWBR0003936#Artikel24
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '9'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003936
        artikel: '10'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003936
        artikel: '14'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0003936
        artikel: '15'
        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0003936
        artikel: '18'
        hoofdstuk: II
      - id: ref6
        bwb_id: BWBR0003936
        artikel: '20'
        hoofdstuk: II
      - id: ref7
        bwb_id: BWBR0003936
        artikel: '24'
        hoofdstuk: III
  - number: 2.2.b
    text: |-
      Indien echter de totale inhoud van de onder *a* van dit lid bedoelde laadruimten minder is dan 1000 m3,
      mogen de bepalingen van [het zesde lid van artikel 15][ref1] worden toegepast, in plaats van die van
      [het eerste tot en met het vijfde lid van artikel 15][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003936#Artikel15
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '15'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003936
        artikel: '15'
        hoofdstuk: II
  - number: '2.3'
    text: |-
      Indien een lading waarop de bepalingen van het
      [Besluit voorkoming verontreiniging door met schepen in bulk vervoerde schadelijke vloeistoffen][ref1] van
      toepassing zijn, in de ladingtanks van een olietankschip of combinatietankschip wordt vervoerd, dient eveneens te
      worden voldaan aan de desbetreffende voorschriften van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0004306
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004306
  - number: 2.4.a
    text: |-
      Draagvleugelboten, luchtkussenvaartuigen en andere nieuwe typen vaartuigen waarop, gezien hun constructie, de
      toepassing van de bepalingen van de[ Hoofdstukken II][ref1] en [III][ref2] ten aanzien van constructieve aspecten
      en uitrusting onredelijk of onuitvoerbaar zou zijn, kunnen door de inspecteur-generaal van de toepassing van deze
      bepalingen worden ontheven, mits de constructie en de uitrusting van deze schepen gelijkwaardige bescherming bieden
      tegen verontreiniging door olie, een en ander met inachtneming van het doel waarvoor deze schepen zijn bestemd en
      met inachtneming van [artikel 2a, eerste en tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003936#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0003936#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0003936#Artikel2a
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003936
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003936
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0003936
        artikel: 2a
        hoofdstuk: I
  - number: 2.4.b
    text: |-
      Indien het bepaalde in [artikel 4, eerste lid][ref1], op een vaartuig als bedoeld onder *a* van toepassing is,
      worden de bijzonderheden betreffende een ontheffing door de inspecteur-generaal vermeld op het certificaat, bedoeld
      in [artikel 5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003936#Artikel5
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '4'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003936
        artikel: '5'
        hoofdstuk: I
  - number: 2a.1
    text: 'Uitrusting als bedoeld in bijlage A.1/2 mag slechts aan boord van schepen worden geplaatst indien die uitrusting:'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel2a
  - number: 2a.1.a
    text: is voorzien van het merk van overeenstemming, weergegeven in bijlage D van [richtlijn nr. 96/98/EG](31996L0098), of
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel2a
  - number: 2a.1.b
    text: |-
      vergezeld gaat van een certificaat van gelijkwaardigheid of een certificaat ten behoeve van beproeving als bedoeld
      in de [artikelen 20][ref1] respectievelijk [21 van de Wet scheepsuitrusting][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011301#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0011301#Artikel21
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0011301
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0011301
        artikel: '21'
  - number: 2a.2
    text: |-
      Indien uitrusting als bedoeld in het eerste lid vervangen moet worden terwijl het schip zich bevindt in een haven
      van een andere staat dan een van de lidstaten van de Europese Unie, en het uit oogpunt van tijd, vertraging en
      kosten redelijkerwijs niet uitvoerbaar is om uitrusting aan boord te plaatsen waarvoor overeenkomstig [richtlijn
      nr. 96/98/EG](31996L0098) een EG-typegoedkeuring is verleend, mag andere dan de in het eerste lid bedoelde
      uitrusting worden geplaatst, mits is voldaan aan de voorwaarden, bedoeld in artikel 16, eerste en tweede lid, van
      die richtlijn.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel2a
  - number: 2a.3
    text: |-
      Gebruik van uitrusting waarvoor een certificaat van gelijkwaardigheid of een certificaat ten behoeve van
      beproeving is afgegeven, is slechts toegestaan met inachtneming van de aan het desbetreffende certificaat verbonden
      voorschriften of beperkingen.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel2a
  - number: 2a.4
    text: |-
      Indien ten aanzien van uitrusting als bedoeld in het eerste lid, onderdeel a, toepassing is gegeven aan
      [artikel 23, eerste lid, van de Wet scheepsuitrusting][ref1], neemt de inspecteur-generaal de passende voorlopige
      maatregelen om het gebruik van die uitrusting te beperken. Zo nodig verbiedt hij de plaatsing of het gebruik van
      die uitrusting aan boord van schepen.


      [ref1]: https://wetten.overheid.nl/BWBR0011301#Artikel23
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0011301
        artikel: '23'
  - number: 2a.5
    text: |-
      [Artikel 23, tweede lid, van de Wet scheepsuitrusting][ref1] is van overeenkomstige toepassing indien toepassing
      wordt gegeven aan het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011301#Artikel23
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0011301
        artikel: '23'
  - number: '3.1'
    text: |-
      De inspecteur-generaal kan het aanbrengen van andere onderdelen, materialen, voorzieningen of apparatuur, voorzover
      het geen uitrusting als bedoeld in [artikel 2a, eerste lid][ref1], betreft, dan welke in dit besluit worden
      voorgeschreven, in een schip toestaan, mits deze ten minste even doelmatig zijn als die welke in dit besluit worden
      vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel2a
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: 2a
        hoofdstuk: I
  - number: '3.2'
    text: |-
      In geen geval zullen vormen van ontwerp en constructie ter regeling van het lozen van olie, zoals deze in dit
      besluit zijn voorgeschreven, kunnen worden vervangen door operationele methoden, behoudens het bepaalde in
      [artikel 13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel13
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '13'
        hoofdstuk: II
  - number: '4.1'
    text: |-
      Elk olietankschip met een tonnage van 150 of meer, alsmede elk schip geen olietankschip zijnde, met een tonnage van
      400 of meer is onderworpen aan:
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel4
  - number: 4.1.a
    text: |-
      een eerste onderzoek dat wordt verricht voordat het schip in dienst wordt gesteld of voordat het certificaat,
      bedoeld in [artikel 5][ref1], voor de eerste maal wordt afgegeven, en dat een volledig onderzoek van de bouw,
      uitrusting, systemen, onderdelen, voorzieningen en materialen van het schip omvat teneinde na te gaan of wordt
      voldaan aan de regels bij of krachtens dit besluit gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel5
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '5'
        hoofdstuk: I
  - number: 4.1.b
    text: |-
      een hernieuwd onderzoek dat wordt verricht met door de inspecteur-generaal vast te stellen tussenpozen die,
      behoudens indien [artikel 8, tweede, vijfde, zesde of zevende lid][ref1], van toepassing is, niet langer dan
      vijf jaar zijn, en dat de bouw, uitrusting, systemen, onderdelen, voorzieningen en materialen van het schip omvat
      teneinde na te gaan of wordt voldaan aan de regels bij of krachtens dit besluit gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel8
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '8'
        hoofdstuk: I
  - number: 4.1.c
    text: |-
      een tussentijds onderzoek dat wordt verricht binnen drie maanden voor of na de tweede of de derde verjaardatum
      en dat in de plaats komt van een van de jaarlijkse onderzoeken als bedoeld onder *d* , en dat de uitrusting en
      de daarbij behorende pompen en pijpleidingen, de systemen voor het bewaken en regelen van het lozen van olie en
      voor het schoonmaken van tanks met ruwe olie, de olie-water afscheider en de oliefiltersystemen van het schip
      omvat teneinde na te gaan of wordt voldaan aan de regels bij of krachtens dit besluit gesteld. Van dit tussentijds
      onderzoek wordt een aantekening geplaatst op het certificaat;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel4
  - number: 4.1.d
    text: |-
      een jaarlijks onderzoek dat wordt verricht binnen drie maanden voor of na elke verjaardatum en dat de bouw,
      uitrusting, systemen, onderdelen, voorzieningen en materialen van het schip omvat teneinde na te gaan of zij zijn
      onderhouden overeenkomstig het derde lid, onder *a*, en zich in goede staat bevinden. Van dit jaarlijks onderzoek
      wordt een aantekening geplaatst op het certificaat;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel4
  - number: 4.1.e
    text: |-
      een aanvullend onderzoek dat afhankelijk van de omstandigheden hetzij geheel, hetzij gedeeltelijk wordt verricht,
      indien herstellingen of vernieuwingen zijn uitgevoerd, of indien zich een ongeval heeft voorgedaan, waarbij wordt
      nagegaan of de noodzakelijke reparaties of vernieuwingen deugdelijk zijn doorgevoerd en of wordt voldaan aan de
      regels bij of krachtens dit besluit gesteld.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel4
  - number: '4.2'
    text: |-
      Bij ministeriële regeling worden regels gesteld ten aanzien van onderzoeken van schepen die niet vallen onder het
      eerste lid, teneinde na te gaan of wordt voldaan aan de regels bij of krachtens dit besluit gesteld. Op verzoek van
      de reder geeft ten aanzien van dergelijke onderzoeken de inspecteur-generaal een verklaring af.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel4
  - number: 4.3.a
    text: |-
      De toestand van het schip en van de uitrusting dient te worden gehandhaafd in overeenstemming met de bepalingen
      vastgesteld bij of krachtens dit besluit om zeker te stellen dat het schip in alle opzichten geschikt blijft tot
      het verlaten van een haven zonder dat het een gevaar vormt voor verontreiniging van het mariene milieu.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel4
  - number: 4.3.b
    text: |-
      Nadat een onderzoek als bedoeld in het eerste en tweede lid is voltooid, mag zonder de toestemming van de
      inspecteur-generaal en onverminderd [artikel 2a, eerste en tweede lid][ref1], geen verandering worden aangebracht
      in de bouw, uitrusting, systemen, onderdelen, voorzieningen en materialen die aan het onderzoek zijn onderworpen,
      tenzij het de onmiddellijke vervanging van dergelijke uitrusting en onderdelen betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel2a
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: 2a
        hoofdstuk: I
  - number: 4.3.c
    text: |-
      Indien een schip een ongeval overkomt, of indien gebreken worden geconstateerd die de hechtheid van het schip, de
      doelmatigheid of de volledigheid van de uitrusting, vallende onder de bepalingen van dit besluit in belangrijke
      mate beïnvloeden, dient de kapitein van het schip de inspecteur-generaal zo spoedig mogelijk in te lichten. Indien
      het schip zich in een haven buiten Nederland bevindt, dient de kapitein tevens onmiddellijk de ter plaatse bevoegde
      autoriteiten in te lichten.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel4
  - number: '5'
    text: |-
      Het Internationaal certificaat van voorkoming van verontreiniging door olie wordt door de inspecteur-
      generaal afgegeven na de voltooiing van een eerste of een hernieuwd onderzoek als bedoeld in
      [artikel 4, eerste lid, onder ][ref1], ten behoeve van elk olietankschip met een tonnage van 150 of meer, alsmede
      ten behoeve van elk schip geen olietankschip zijnde, met een tonnage van 400 of meer.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel4
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '4'
        hoofdstuk: I
  - number: 6.1.a
    text: |-
      De inspecteur-generaal kan een daartoe bevoegde regering verzoeken de onderzoeken als bedoeld in [artikel 4][ref1]
      uit te voeren en het certificaat als bedoeld in [artikel 5][ref2] af te geven, of, voorzover van toepassing, een
      aantekening te plaatsen.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003936#Artikel5
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '4'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003936
        artikel: '5'
        hoofdstuk: I
  - number: 6.1.b
    text: |-
      Op verzoek van de daartoe bevoegde buitenlandse regering kan namens de inspecteur-generaal een schip
      dat niet gerechtigd is de Nederlandse vlag te voeren, aan de in [artikel 4][ref1] genoemde onderzoeken
      worden onderworpen en ten behoeve van dat schip een certificaat als bedoeld in [artikel 5][ref2], worden
      afgegeven, of, voorzover van toepassing, een aantekening worden geplaatst. Indien het een communautair
      schip als bedoeld in artikel 2 van [richtlijn nr. 96/98/EG](31996L0098) betreft, moet uitrusting als bedoeld
      in [artikel 2a, eerste lid, onderdeel a][ref3], zijn voorzien van het in dat artikel bedoelde merk van
      overeenstemming. Indien het een schip betreft dat een vlag voert van een van de andere lidstaten van de Europese
      Unie, zijn ten aanzien van de uitrusting, bedoeld in bijlage A.1/2 de desbetreffende voorschriften van het Verdrag
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003936#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0003936#Artikel2a
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '4'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003936
        artikel: '5'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0003936
        artikel: 2a
        hoofdstuk: I
  - number: '6.2'
    text: |-
      In het geval genoemd in het eerste lid onder *b* wordt een afschrift van het certificaat en een afschrift van het
      rapport van onderzoek zo spoedig mogelijk toegezonden aan de regering die het verzoek heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel6
  - number: '6.3'
    text: |-
      Een krachtens het bepaalde in het eerste lid, onder *b*, afgegeven certificaat zal een verklaring bevatten,
      inhoudende dat het is afgegeven op verzoek van de betrokken regering.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel6
  - number: '6.4'
    text: |-
      Er wordt geen certificaat als bedoeld in [artikel 5][ref1] afgegeven aan een schip dat gerechtigd is de vlag te
      voeren van een staat, die geen partij is bij het Verdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel5
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '5'
        hoofdstuk: I
  - number: '7'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld betreffende de aanvraag tot het afgeven van een
      certificaat en de daarbij te overleggen bescheiden.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel7
  - number: '8.1'
    text: |-
      Het Internationaal certificaat van voorkoming van verontreiniging door olie wordt door de inspecteur-generaal
      afgegeven voor een periode van ten hoogste vijf jaar.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel8
  - number: '8.2'
    text: |-
      In afwijking van het eerste lid is, indien het hernieuwde onderzoek binnen drie maanden voor de vervaldatum van het
      bestaande certificaat wordt voltooid, het nieuwe certificaat geldig vanaf de datum van voltooiing van dit onderzoek
      tot een datum niet later dan vijf jaar na de vervaldatum van het bestaande certificaat.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel8
  - number: '8.3'
    text: |-
      Onverminderd het eerste lid is, indien het hernieuwde onderzoek binnen drie maanden na de vervaldatum van het
      bestaande certificaat wordt voltooid, het nieuwe certificaat geldig vanaf de datum van voltooiing van dit onderzoek
      tot een datum niet later dan vijf jaar na de vervaldatum van het bestaande certificaat.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel8
  - number: '8.4'
    text: |-
      Indien een certificaat wordt afgegeven voor een periode korter dan vijf jaar, kan de inspecteur-generaal na de
      voltooiing van een tussentijds of jaarlijks onderzoek de geldigheidsduur van het certificaat verlengen tot een
      periode van vijf jaar.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel8
  - number: '8.5'
    text: |-
      Indien een hernieuwd onderzoek wordt voltooid en indien geen nieuw certificaat ten behoeve van het schip kan
      worden afgegeven voor de vervaldatum van het bestaande certificaat, kan daarvan een aantekening op het bestaande
      certificaat worden geplaatst. In afwijking van het eerste lid wordt in dat geval de geldigheidsduur van het
      certificaat verlengd voor een periode van niet langer dan vijf maanden na de vervaldatum.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel8
  - number: '8.6'
    text: |-
      In afwijking van het eerste lid kan, indien een schip zich op het tijdstip waarop het certificaat zijn geldigheid
      verliest niet in een haven bevindt waar het hernieuwde onderzoek kan plaatsvinden, de inspecteur-generaal de
      geldigheidsduur van het certificaat verlengen voor een periode van ten hoogste drie maanden na de vervaldatum,
      uitsluitend om het schip in staat te stellen de reis naar de haven waar het moet worden onderzocht te voltooien. Na
      de voltooiing van het hernieuwde onderzoek in die haven is het nieuwe certificaat geldig tot een datum niet later
      dan vijf jaar na de oorspronkelijke vervaldatum van het bestaande certificaat.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel8
  - number: '8.7'
    text: |-
      In afwijking van het eerste lid kan, indien een certificaat is afgegeven ten behoeve van een schip dat korte
      reizen maakt en de geldigheidsduur van het certificaat niet is verlengd ingevolge een van de andere leden, de
      inspecteur-generaal de geldigheidsduur van het certificaat verlengen voor een periode van ten hoogste een maand na
      de vervaldatum. Na de voltooiing van het hernieuwde onderzoek is het nieuwe certificaat geldig tot een datum niet
      later dan vijf jaar na de oorspronkelijke vervaldatum van het bestaande certificaat.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel8
  - number: '8.8'
    text: |-
      In bijzondere omstandigheden behoeft een nieuw certificaat niet te worden gedateerd vanaf de vervaldatum van het
      bestaande certificaat. Na de voltooiing van het hernieuwde onderzoek in deze bijzondere omstandigheden is het
      nieuwe certificaat geldig tot een datum niet later dan vijf jaar na de datum van voltooiing van het hernieuwde
      onderzoek.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel8
  - number: '8.9'
    text: |-
      Indien een tussentijds of jaarlijks onderzoek wordt voltooid voor de aanvang van de periode waarin het dient plaats
      te vinden, worden er, voorzover van toepassing, een of meer aanvullende tussentijdse of jaarlijkse onderzoeken
      verricht, zodat de maximale tussenpozen tussen de onderzoeken, bedoeld in [artikel 4][ref1], niet worden
      overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel4
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '4'
        hoofdstuk: I
  - number: '8.10'
    text: 'Het certificaat verliest zijn geldigheid wanneer:'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel8
  - number: 8.10.a
    text: de op het certificaat aangegeven periode van geldigheid is verstreken;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel8
  - number: 8.10.b
    text: |-
      het tussentijdse of jaarlijkse onderzoek niet is uitgevoerd binnen de gestelde periode danwel indien daarvan geen
      aantekening is gemaakt op het certificaat;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel8
  - number: 8.10.c
    text: het schip ophoudt te behoren tot de categorie van schepen, waarop dit besluit van toepassing is;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel8
  - number: 8.10.d
    text: |-
      de bouw, uitrusting, systemen, onderdelen, voorzieningen en materialen van het schip op
      ingrijpende wijze worden gewijzigd zonder de toestemming van de inspecteur-generaal en onverminderd
      [artikel 2a, eerste en tweede lid][ref1], tenzij het de onmiddellijke vervanging van dergelijke uitrusting en
      onderdelen betreft;


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel2a
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: 2a
        hoofdstuk: I
  - number: 8.10.e
    text: |-
      de naam van het schip wordt veranderd of het schip een ander letterteken of nummer krijgt. In dat geval wordt
      op aanvraag een nieuw certificaat afgegeven voor het nog niet verstreken gedeelte van het tijdvak, waarvoor het
      vervallen certificaat zou hebben gegolden;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel8
  - number: 8.10.f
    text: het schip niet meer gerechtigd is de Nederlandse vlag te voeren.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel8
  - number: 8.11.a
    text: 'Het certificaat kan door de inspecteur-generaal worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel8
  - number: 8.11.a.1°
    text: wanneer het schip schade van betekenis heeft belopen en de herstelling daarvan niet naar behoren is geschied, of
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel8
  - number: 8.11.a.2°
    text: |-
      wanneer uit een onderzoek van de bevoegde ambtenaar van de divisie Scheepvaart is gebleken dat het schip niet
      zonder gevaar voor verontreiniging van het mariene milieu de haven kan verlaten. Van de intrekking wordt de
      eigenaar bericht gezonden, onder vermelding van de redenen, welke tot de intrekking hebben geleid;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel8
  - number: 8.11.b
    text: |-
      Een vervallen of ingetrokken certificaat moet door de eigenaar zo spoedig mogelijk aan de inspecteur-generaal
      worden ingezonden door tussenkomst van ambtenaren van de divisie Scheepvaart, de ambtenaren met de in- of
      uitklaring belast, dan wel de Nederlandse diplomatieke of consulaire ambtenaren.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel8
  - number: 8.11.c
    text: Voor een ingezonden certificaat wordt desverlangd een bewijs van ontvangst afgegeven.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel8
  - number: '8.12'
    text: |-
      In afwijking van het tiende lid, onder *b*, kan de inspecteur-generaal, indien het certificaat zijn geldigheid
      heeft verloren omdat een tussentijds of jaarlijks onderzoek niet binnen de gestelde periode is verricht, in
      bijzondere omstandigheden de geldigheid van het certificaat herstellen, nadat door middel van een inspectie is
      vastgesteld dat het schip voldoet aan de regels bij of krachtens dit besluit gesteld. De omvang van deze inspectie
      is ter beoordeling van de inspecteur-generaal.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel8
  - number: '9.1'
    text: |-
      Behoudens het bepaalde in [de artikelen 10][ref1] en [11][ref2], en het bepaalde in het tweede lid, is elke
      lozing in zee van olierestanten of oliehoudende mengsels vanaf schepen verboden, tenzij wordt voldaan aan alle
      onderstaande voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003936#Artikel11
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '10'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003936
        artikel: '11'
        hoofdstuk: II
  - number: 9.1.a
    text: 'voor een olietankschip, behalve zoals bepaald onder *b* :'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel9
  - number: 9.1.a.1°
    text: |-
      het olietankschip bevindt zich niet in een bijzonder gebied, als bedoeld in [artikel 10][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel10
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '10'
        hoofdstuk: II
  - number: 9.1.a.2°
    text: het olietankschip bevindt zich meer dan 50 zeemijl van het dichtstbijzijnde land;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel9
  - number: 9.1.a.3°
    text: het olietankschip vervolgt zijn vaarroute;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel9
  - number: 9.1.a.4°
    text: de hoeveelheid geloosde olie bedraagt op elk moment van het lozen niet meer dan 30 liter per afgelegde zeemijl;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel9
  - number: 9.1.a.5°
    text: |-
      de totale hoeveelheid in zee geloosde olie bedraagt voor bestaande olietankschepen niet meer dan 1/15.000ste van de
      totale hoeveelheid van de lading waarvan het restant deel uitmaakte en, voor nieuwe olietankschepen niet meer dan
      1/30.000ste van de totale hoeveelheid van de lading waarvan het restant deel uitmaakte;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel9
  - number: 9.1.a.6°
    text: |-
      het olietankschip heeft de apparatuur en de voorzieningen, als vereist in [artikel 15][ref1], in bedrijf;


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel15
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '15'
        hoofdstuk: II
  - number: 9.1.b
    text: |-
      voor een schip dat geen olietankschip is, met een tonnage van 400 of meer en voor een olietankschip voorzover het
      betreft een lozing van olierestanten of oliehoudende mengsels vanuit de vullings van de ruimten voor machines, met
      uitzondering van de vullings van de ladingpompkamer, tenzij vermengd met ladingolierestanten:
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel9
  - number: 9.1.b.1°
    text: het schip bevindt zich niet in een bijzonder gebied;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel9
  - number: 9.1.b.2°
    text: het schip vervolgt zijn vaarroute;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel9
  - number: 9.1.b.3°
    text: het oliegehalte van de geloosde vloeistof is zonder verdunning niet hoger dan 15 delen per miljoen;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel9
  - number: 9.1.b.4°
    text: |-
      het schip heeft de apparatuur, bedoeld in [artikel 16][ref1], in bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel16
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '16'
        hoofdstuk: II
  - number: '9.2'
    text: |-
      Een schip geen olietankschip zijnde, met een tonnage van minder dan 400, dat zich buiten een bijzonder
      gebied bevindt, dient olierestanten of oliehoudende mengsels aan boord op te slaan en af te geven aan
      havenontvangstvoorzieningen of in zee te lozen overeenkomstig het bepaalde in het eerste lid, onder *b*.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel9
  - number: '9.3'
    text: |-
      Het bepaalde in het eerste lid is niet van toepassing op de lozing van schone of gescheiden ballast of van niet
      behandelde oliehoudende mengsels waarvan zonder verdunning het oliegehalte niet hoger is dan 15 delen per miljoen
      en deze mengsels niet afkomstig zijn van de vullings van de ladingpompkamer en niet vermengd zijn met olierestanten
      van de lading.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel9
  - number: '9.4'
    text: |-
      Lozingen in zee van olierestanten of oliehoudende mengsels mogen geen chemicaliën of andere stoffen bevatten in
      hoeveelheden of concentraties welke schadelijk zijn voor het mariene milieu, dan wel chemicaliën of andere stoffen
      welke worden aangewend teneinde de in dit artikel aangegeven lozingsvoorwaarden ter zijde te stellen.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel9
  - number: '9.5'
    text: |-
      De olierestanten welke niet in zee kunnen worden geloosd volgens het bepaalde in het eerste, tweede en derde lid
      van dit artikel, dienen aan boord te worden gehouden of aan havenontvangstvoorzieningen te worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel9
  - number: '9.6'
    text: |-
      Voor schepen als bedoeld in [artikel 16, zesde lid][ref1], die niet zijn uitgerust met de apparatuur vereist in
      [artikel 16, eerste of tweede lid][ref2], is het bepaalde in het eerste lid, onderdeel *b*, van toepassing met
      ingang van 6 juli 1998 of met ingang van een eerdere datum waarop het schip met deze apparatuur wordt uitgerust.
      Tot deze datum is elke lozing in zee van olierestanten of oliehoudende mengsels verboden, tenzij wordt voldaan aan
      alle onderstaande voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003936#Artikel16
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '16'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003936
        artikel: '16'
        hoofdstuk: II
  - number: 9.6.a
    text: het oliehoudende mengsel is niet afkomstig van de vullings van de ladingpompkamer;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel9
  - number: 9.6.b
    text: het oliehoudende mengsel is niet vermengd met ladingolierestanten;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel9
  - number: 9.6.c
    text: het schip bevindt zich niet in een bijzonder gebied;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel9
  - number: 9.6.d
    text: het schip bevindt zich meer dan 12 zeemijlen van het dichtstbijzijnde land;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel9
  - number: 9.6.e
    text: het schip vervolgt zijn vaarroute;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel9
  - number: 9.6.f
    text: het oliegehalte van de geloosde vloeistof is lager dan 100 delen per miljoen;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel9
  - number: 9.6.g
    text: het schip heeft de goedgekeurde apparatuur voor het scheiden van olie en water in bedrijf.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel9
  - number: '10.1'
    text: |-
      Voor de toepassing van dit besluit worden onder bijzondere gebieden verstaan het gebied van de Middellandse
      Zee, van de Oostzee, van de Zwarte Zee, van de Rode Zee, van de Perzische Golf, van de Golf van Aden, van het
      Antarctisch gebied en van de Noordwest-Europese wateren, welke als volgt worden omschreven:
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel10
  - number: 10.1.a
    text: |-
      Onder het gebied van de Middellandse Zee wordt verstaan de Middellandse Zee zelf, alsmede de golven en zeeën
      daarin, waarbij de grens tussen de Middellandse en de Zwarte Zee wordt gevormd door de parallel van 41°
      noorderbreedte en de westelijke grens wordt gevormd door de Straat van Gibraltar op de meridiaan van 5°36'
      westerlengte.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel10
  - number: 10.1.b
    text: |-
      Onder het gebied van de Oostzee wordt verstaan de Oostzee zelf met inbegrip van de Botnische Golf, de Finse Golf en
      de toegang tot de Oostzee, begrensd door de parallel van Kaap Skagen in het Skagerrak op 57°44,8' noorderbreedte.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel10
  - number: 10.1.c
    text: |-
      Onder het gebied van de Zwarte Zee wordt verstaan de Zwarte Zee zelf, waarbij de grens tussen de Middellandse en de
      Zwarte Zee wordt gevormd door de parallel van 41° noorderbreedte.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel10
  - number: 10.1.d
    text: |-
      Onder het gebied van de Rode Zee wordt verstaan de Rode Zee zelf met inbegrip van de Golf van Suez en de Golf van
      Aqaba, in het zuiden begrensd door de loxodroom tussen Ras si Ane (12°08,5' noorderbreedte, 43°19,6' oosterlengte)
      en Husn Murad (12°40,4' noorderbreedte, 43°30,2' oosterlengte).
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel10
  - number: 10.1.e
    text: |-
      Onder het gebied van de Perzische Golf wordt verstaan het zeegebied ten noordwesten van de loxodroom tussen Ras al
      Hadd (22°30' noorderbreedte, 59°48' oosterlengte) en Ras al Fasteh (25°04' noorderbreedte, 61°25' oosterlengte).
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel10
  - number: 10.1.f
    text: |-
      Onder het gebied van de Golf van Aden wordt verstaan het zeegebied tussen de Rode Zee en de Arabische Zee in
      het westen begrensd door de loxodroom tussen Ras si Ane (12° 08,5' noorderbreedte, 43° 19,6' oosterlengte) en
      Husn Murad (12° 40,4' noorderbreedte, 43° 30,2' oosterlengte) en in het oosten begrensd door de loxodroom tussen
      Ras Asir (11° 50' noorderbreedte, 51° 16,9' oosterlengte) en Ras Fartak (15° 35' noorderbreedte, 52° 13,8'
      oosterlengte).
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel10
  - number: 10.1.g
    text: Onder het Antarctisch gebied wordt verstaan het zeegebied ten zuiden van 60° zuiderbreedte;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel10
  - number: 10.1.h
    text: |-
      Onder het gebied van de Noordwest-Europese wateren wordt verstaan de Noordzee en zijn toegangen, de Ierse Zee
      en zijn toegangen, de Keltische zee, het Engels Kanaal en zijn toegangen en het gedeelte van de Noordoostelijke
      Atlantische Oceaan direct ten westen van Ierland, begrensd door de lijnen die achtereenvolgens de volgende punten
      verbinden:
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel10
  - number: 10.1.h.i
    text: 48° 27' noorderbreedte aan de Franse kust,
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel10
  - number: 10.1.h.ii
    text: 48° 27' noorderbreedte; 6° 25' westerlengte,
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel10
  - number: 10.1.h.iii
    text: 49° 52' noorderbreedte; 7° 44' westerlengte,
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel10
  - number: 10.1.h.iv
    text: 50° 30' noorderbreedte; 12° westerlengte,
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel10
  - number: 10.1.h.v
    text: 56° 30' noorderbreedte; 12° westerlengte,
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel10
  - number: 10.1.h.vi
    text: 62° noorderbreedte; 3° westerlengte,
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel10
  - number: 10.1.h.vii
    text: 62° noorderbreedte aan de Noorse kust,
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel10
  - number: 10.1.h.viii
    text: 57° 44,8' noorderbreedte aan de Deense en aan de Zweedse kust.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel10
  - number: 10.2.a
    text: |-
      Behoudens het bepaalde in [artikel 11][ref1] is elke lozing van olierestanten of oliehoudende mengsels in zee door
      een olietankschip en door een schip geen olietankschip zijnde, met een tonnage van 400 of meer, verboden wanneer
      deze zich in een bijzonder gebied bevinden.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel11
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '11'
        hoofdstuk: II
  - number: 10.2.b
    text: |-
      Elke lozing van olierestanten of oliehoudende mengsels in zee vanaf een schip dat geen olietankschip is, met een
      tonnage van minder dan 400, is verboden wanneer dit schip zich in een bijzonder gebied bevindt, behalve indien het
      oliegehalte van de geloosde vloeistof zonder verdunning niet hoger is dan 15 delen per miljoen.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel10
  - number: 10.3.a
    text: Het bepaalde in het tweede lid is niet van toepassing op de lozing van schone of gescheiden ballast.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel10
  - number: 10.3.b
    text: |-
      Het bepaalde in het tweede lid, onder *a*, is niet van toepassing op de lozing van behandeld lenswater van ruimten
      voor machines, mits wordt voldaan aan alle volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel10
  - number: 10.3.b.1°
    text: het lenswater is niet afkomstig van de vulling van de ladingpompkamer;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel10
  - number: 10.3.b.2°
    text: het lenswater is niet vermengd met ladingolierestanten;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel10
  - number: 10.3.b.3°
    text: het schip vervolgt zijn vaarroute;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel10
  - number: 10.3.b.4°
    text: het oliegehalte van het geloosde mengsel is zonder verdunning niet hoger dan 15 delen per miljoen;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel10
  - number: 10.3.b.5°
    text: |-
      het schip heeft de apparatuur als bedoeld in [artikel 16, vijfde lid][ref1], in bedrijf; en


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel16
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '16'
        hoofdstuk: II
  - number: 10.3.b.6°
    text: |-
      de apparatuur voor het filtreren is uitgerust met een inrichting die de lozing automatisch stopt indien het
      oliegehalte van het te lozen mengsel hoger is dan 15 delen per miljoen.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel10
  - number: 10.4.a
    text: |-
      Lozingen in zee van olierestanten of oliehoudende mengsels mogen geen chemicaliën of andere stoffen bevatten in
      hoeveelheden of concentraties welke schadelijk zijn voor het mariene milieu, dan wel chemicaliën of andere stoffen
      aangewend teneinde de in dit artikel aangegeven lozingsvoorwaarden ter zijde te stellen.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel10
  - number: 10.4.b
    text: |-
      De olierestanten welke niet in zee mogen worden geloosd volgens het bepaalde onder het tweede en derde lid, dienen
      aan boord te worden gehouden of aan havenontvangstvoorzieningen te worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel10
  - number: '10.5'
    text: |-
      Tot een nader bij koninklijk besluit vast te stellen tijdstip mogen schepen in het gebied van de Rode Zee, van de
      Perzische Golf en van de Golf van Aden lozen volgens het bepaalde in [artikel 9][ref1] in plaats van het bepaalde
      in het tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel9
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '9'
        hoofdstuk: II
  - number: '10.6'
    text: |-
      In afwijking van het tweede lid is in het Antarctisch gebied elke lozing in zee van olierestanten of oliehoudende
      mengsels vanaf een schip verboden.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel10
  - number: '11'
    text: |-
      Het bepaalde in [de artikelen 9][ref1] en [10][ref2] is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003936#Artikel10
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '9'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003936
        artikel: '10'
        hoofdstuk: II
  - number: 11.a
    text: |-
      het lozen in zee van olierestanten of oliehoudende mengsels indien dit noodzakelijk is om de veiligheid van het
      schip zeker te stellen of om mensenlevens op zee te redden; of
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel11
  - number: 11.b
    text: |-
      het lozen in zee van olierestanten of oliehoudende mengsels in geval van schade aan het schip of aan de uitrusting
      daarvan:
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel11
  - number: 11.b.1°
    text: |-
      mits na het ontstaan van de schade of na het ontdekken van de lozing alle redelijke voorzorgen zijn getroffen om de
      lozing te voorkomen of tot een minimum te beperken; en
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel11
  - number: 11.b.2°
    text: |-
      uitgezonderd in geval de eigenaar of de kapitein handelde met de bedoeling om schade te veroorzaken, of wel
      roekeloos handelde en in de wetenschap dat er waarschijnlijk schade zou ontstaan; of
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel11
  - number: 11.c
    text: |-
      het lozen in zee van oliehoudende stoffen met toestemming van Onze Minister, indien dit geschiedt met het doel
      bepaalde verontreinigingsvoorvallen te bestrijden teneinde de schade door verontreiniging tot een minimum te
      beperken.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel11
  - number: '13.1'
    text: |-
      Behoudens het bepaalde in de [artikelen 13 C][ref1] en [13 D][ref2], dienen olietankschepen te voldoen aan de
      bepalingen van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel13C
      [ref2]: https://wetten.overheid.nl/BWBR0003936#Artikel13D
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: 13C
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003936
        artikel: 13D
        hoofdstuk: II
  - number: '13.2'
    text: 'Nieuwe olietankschepen met een draagvermogen van 20.000 tonmassa of meer dienen aan het onderstaande te voldoen:'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13
  - number: 13.2.a
    text: |-
      Elk nieuw ruwe olietankschip met een draagvermogen van 20.000 tonmassa of meer en elk nieuw produktentankschip met
      een draagvermogen van 30.000 tonmassa of meer dient te zijn voorzien van gescheiden ballasttanks en te voldoen aan
      het bepaalde onder *b*, c en *d* of, indien toepasselijk, aan het bepaalde onder *e*.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13
  - number: 13.2.b
    text: |-
      De capaciteit van de gescheiden ballasttanks dient zodanig te zijn dat het schip veilig kan varen tijdens
      ballastreizen, zonder dat, behoudens het bepaalde onder *c* en *d*, voor het benodigde ballastwater gebruik
      behoeft te worden gemaakt van ladingtanks. Echter dient in alle gevallen de gezamenlijke inhoud van de gescheiden
      ballasttanks ten minste zodanig te zijn, dat gedurende elk deel van de reis in elke ballasttoestand - met inbegrip
      van de toestand van leeg schip plus uitsluitend gescheiden ballast - de diepgang en trim van het schip aan elk van
      de volgende voorwaarden kunnen voldoen:
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13
  - number: 13.2.b.1°
    text: |-
      de diepgang naar de mal (dm) midscheeps gemeten in meters zonder rekening te houden met enige vervorming van het
      schip dient niet minder te zijn dan: dm = 2.0 + 0.02 L
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13
  - number: 13.2.b.2°
    text: |-
      de diepgangen op de voor- en achterloodlijn dienen overeen te komen met de diepgang midscheeps (dm), als bepaald
      onder 1° van dit lid, in samenhang met een stuurlast van niet meer dan 0,015 L; en
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13
  - number: 13.2.b.3°
    text: |-
      de diepgang op de achterloodlijn dient in geen geval minder te zijn dan noodzakelijk is voor de volledige
      onderdompeling van de schroef (schroeven).
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13
  - number: 13.2.c
    text: 'In geen geval mag ballastwater in ladingtanks worden vervoerd, behalve:'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13
  - number: 13.2.c.1°
    text: |-
      in het bijzondere geval dat de weersomstandigheden dermate slecht zijn dat, naar het oordeel van de kapitein, de
      veiligheid van het schip vereist dat er extra ballastwater in ladingtanks wordt vervoerd; of
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13
  - number: 13.2.c.2°
    text: |-
      in de uitzonderlijke gevallen waarbij de bijzondere aard van de bedrijfsvoering van een olietankschip het
      noodzakelijk maakt dat er extra ballastwater in ladingtanks wordt vervoerd.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13
  - number: 13.2.d
    text: |-
      Het extra ballastwater dient te worden behandeld en geloosd overeenkomstig het bepaalde in de [artikelen 9][ref1]
      en [15][ref2], tevens dient daarvan aantekening te worden gehouden in het oliejournaal, bedoeld in
      [artikel 20][ref3]. Ten aanzien van het bepaalde in onderdeel *c* , onder 2°, kunnen door de inspecteur-generaal
      nadere voorschriften worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003936#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0003936#Artikel20
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '9'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003936
        artikel: '15'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003936
        artikel: '20'
        hoofdstuk: II
  - number: 13.2.e
    text: |-
      In afwijking van het bepaalde onder *b* , dient de capaciteit van de gescheiden ballasttanks van een olietankschip
      met een lengte van minder dan 150 m, ten genoegen van de inspecteur-generaal te zijn.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13
  - number: 13.2.f
    text: |-
      Elk nieuw ruwe olietankschip met een draagvermogen van 20.000 tonmassa of meer dient te zijn uitgerust met een
      installatie voor het schoonmaken van de ladingtanks door middel van het wassen met ruwe olie. Deze installatie
      moet geheel voldoen aan het bepaalde in [artikel 13 B][ref1], één jaar nadat het tankschip voor het eerst voor het
      vervoer van ruwe olie is gebezigd, dan wel aan het einde van de derde reis gemaakt met een ruwe olie geschikt voor
      deze wasmethode waarbij de langste periode bepalend is.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel13B
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: 13B
        hoofdstuk: II
  - number: 13.2.g
    text: |-
      De installatie dient te worden gebruikt in overeenstemming met het bepaalde in [artikel 13 B][ref1], tenzij het
      olietankschip een ruwe olie vervoert die niet geschikt is voor de wasmethode met ruwe olie.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel13B
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: 13B
        hoofdstuk: II
  - number: '13.3'
    text: |-
      Behoudens het bepaalde in het vierde moet elk bestaand ruwe olietankschip van 40.000 tonmassa draagvermogen of meer
      zijn voorzien van gescheiden ballasttanks en voldoen aan het bepaalde in het tweede lid, onder *b* en *c*.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13
  - number: '13.4'
    text: |-
      Bestaande ruwe olietankschepen als bedoeld in het derde lid mogen, indien zij bestemd zijn voor het vervoer
      van ruwe olie geschikt voor de ruwe oliewasmethode, deze methode in overeenstemming met het bepaalde van
      [artikel 13 B][ref1] toepassen, in plaats van te zijn voorzien van gescheiden ballasttanks.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel13B
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: 13B
        hoofdstuk: II
  - number: '13.5'
    text: |-
      Elk bestaand produktentankschip met een draagvermogen van 40.000 tonmassa of meer dient te zijn voorzien van
      gescheiden ballasttanks en te voldoen aan het bepaalde in het tweede lid, onder *b* en *c*, dan wel de methode van
      aangewezen schone ballasttanks te gebruiken in overeenstemming met het bepaalde in [artikel 13 A][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel13A
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: 13A
        hoofdstuk: II
  - number: '13.6'
    text: |-
      Elk olietankschip dat niet behoeft te zijn voorzien van gescheiden ballasttanks in overeenstemming met het tweede
      lid, onder *a*, derde of vijfde lid, kan echter worden aangemerkt als een olietankschip met gescheiden ballasttanks
      indien het schip voldoet aan het bepaalde in het tweede lid, onder *b, c* en *e*.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13
  - number: 13A.1
    text: |-
      Een olietankschip dat de methode van aangewezen schone ballasttanks gebruikt in overeenstemming met het bepaalde in
      [het vijfde lid van artikel 13][ref1], dient te beschikken over tanks van voldoende inhoud en welke zijn aangewezen
      voor het vervoeren van uitsluitend schone ballast zoals omschreven in [het eerste lid van artikel 1, onder ][ref2],
      teneinde te kunnen voldoen aan het bepaalde in [het tweede lid, onder ][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003936#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0003936#Artikel13
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13A
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '13'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003936
        artikel: '1'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0003936
        artikel: '13'
        hoofdstuk: II
  - number: 13A.2
    text: |-
      De voorzieningen voor en de werkwijze met de methode van aangewezen schone ballasttanks dienen te voldoen aan de
      voorschriften vastgesteld door de inspecteur-generaal.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13A
  - number: 13A.3
    text: |-
      Een olietankschip dat de methode van aangewezen schone ballasttanks gebruikt, moet zijn uitgerust met een
      goedgekeurde oliegehaltemeter, welke controle mogelijk maakt van het oliegehalte van het geloosde ballastwater.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13A
  - number: 13A.4
    text: |-
      Elk olietankschip dat de methode van aangewezen schone ballasttanks gebruikt, moet zijn voorzien van een handboek
      waarin het systeem, de uitrusting en de werkwijze daarmee beschreven staan en dat ten genoegen van de inspecteur-
      generaal is. Wanneer een wijziging wordt aangebracht die het systeem van aangewezen schone ballasttanks beïnvloedt,
      dient het handboek overeenkomstig te worden herzien.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13A
  - number: 13B.1
    text: |-
      Elk systeem voor het wassen met ruwe olie, voorgeschreven ingevolge het bepaalde in [het tweede lid, onder ][ref1],
      moet voldoen aan het bepaalde in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel13
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13B
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '13'
        hoofdstuk: II
  - number: 13B.2
    text: |-
      De installatie voor het wassen met ruwe olie alsmede de bijbehorende uitrusting en voorzieningen moeten voldoen aan
      de voorschriften vastgesteld door de inspecteur-generaal.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13B
  - number: 13B.3
    text: |-
      Een inert-gasinstallatie moet zijn aangebracht en aangesloten op elke ladingtank en sloptank in overeenstemming met
      de van toepassing zijnde artikelen van [Bijlage IV van het Schepenbesluit 1965][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13B
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: 13B.4
    text: |-
      Alvorens een ballastreis wordt aangevangen, dienen voldoende ladingtanks met ruwe olie te zijn gewassen opdat,
      rekening houdend met het vaarschema van het schip en de te verwachten weersomstandigheden, ballastwater alleen
      wordt vervoerd in ladingtanks die met ruwe olie zijn gewassen.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13B
  - number: 13B.5
    text: |-
      Elk olietankschip uitgerust met een systeem voor het wassen met ruwe olie, moet zijn voorzien van een handboek
      waarin het systeem, de uitrusting en de werkwijze daarmee beschreven staan en dat ten genoegen van de inspecteur-
      generaal is. Wanneer een wijziging wordt aangebracht die het systeem voor het wassen met ruwe olie beïnvloedt,
      dient het handboek overeenkomstig te worden herzien.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13B
  - number: 13C.1
    text: |-
      Het bepaalde in [het derde tot en met het vijfde lid van artikel 13][ref1] is niet van toepassing op een bestaand
      olietankschip dat uitsluitend wordt ingezet op bepaalde reizen:


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel13
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13C
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '13'
        hoofdstuk: II
  - number: 13C.1.a
    text: tussen havens binnen Nederland; of
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13C
  - number: 13C.1.b
    text: |-
      tussen havens van staten die partij zijn bij het Verdrag, voorzover deze reizen geheel plaatsvinden binnen een
      bijzonder gebied als bedoeld in [het eerste lid van artikel 10][ref1], of binnen andere, door Onze Minister
      vastgestelde grenzen.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel10
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13C
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '10'
        hoofdstuk: II
  - number: 13C.2
    text: 'Het bepaalde in het eerste lid is alleen van toepassing indien tevens wordt voldaan aan de navolgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13C
  - number: 13C.2.a
    text: |-
      de havens waar lading wordt ingenomen, zijn voorzien van havenontvangstvoorzieningen die naar het oordeel van Onze
      Minister toereikend zijn voor het ontvangen en verwerken van alle ballast- en tankwaswater van het schip;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13C
  - number: 13C.2.b
    text: |-
      alle ballastwater daarbij inbegrepen schone ballast en restanten van het tankwassen, worden tijdens de reis aan
      boord gehouden en bij aankomst in de haven afgegeven aan havenontvangstvoorzieningen, behoudens het bepaalde in
      [artikel 11][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel11
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13C
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '11'
        hoofdstuk: II
  - number: 13C.2.c
    text: |-
      van het bepaalde onder *b* aantekening wordt gehouden in het oliejournaal als bedoeld in [artikel 20][ref1], welke
      aantekening dient te worden gewaarmerkt door de bevoegde autoriteiten van de havenstaat;


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel20
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13C
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '20'
        hoofdstuk: II
  - number: 13C.2.d
    text: |-
      op het certificaat als bedoeld in [artikel 5][ref1] wordt aangetekend dat het schip uitsluitend wordt gebezigd voor
      de reizen als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel5
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13C
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '5'
        hoofdstuk: I
  - number: 13D.1
    text: |-
      Een bestaand ruwe olietankschip wordt geacht te voldoen aan het bepaalde in [het derde lid van artikel 13][ref1]
      betreffende gescheiden ballasttanks, indien aan alle onderstaande voorwaarden wordt voldaan:


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel13
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13D
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '13'
        hoofdstuk: II
  - number: 13D.1.a
    text: |-
      het schip zodanig is gebouwd of zodanig wordt gebruikt dat te allen tijde zonder het gebruik van ballastwater wordt
      voldaan aan het bepaalde ten aanzien van de diepgang en de stuurlast als bedoeld in [het tweede lid, onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel13
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13D
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '13'
        hoofdstuk: II
  - number: 13D.1.b
    text: de werkwijze en ballastvoorzieningen zijn goedgekeurd door de inspecteur-generaal;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13D
  - number: 13D.1.c
    text: |-
      op het certificaat als bedoeld in [artikel 5][ref1] is aangetekend dat het schip met speciale ballastvoorzieningen
      vaart.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel5
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13D
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '5'
        hoofdstuk: I
  - number: 13D.2
    text: |-
      Op schepen als bedoeld in het eerste lid is het bepaalde in [artikel 13, lid 2, onder ][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel13
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13D
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '13'
        hoofdstuk: II
  - number: 13E.1
    text: |-
      Op elk nieuw ruwe olietankschip met een draagvermogen van 20.000 tonmassa of meer en op elk nieuw
      produktentankschip met een draagvermogen van 30.000 tonmassa of meer dient de ligging van de gescheiden
      ballasttanks, met een inhoud die noodzakelijk is teneinde te kunnen voldoen aan de eisen van [artikel 13][ref1]
      en die binnen het ladingtankgedeelte zijn gelegen, in overeenstemming te zijn met het bepaalde in
      [het tweede, derde en vierde lid van dit artikel][ref2] teneinde een zekere mate van bescherming te bieden tegen
      het uitstromen van olie ingeval van stranding of aanvaring.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003936#Artikel13E
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13E
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '13'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003936
        artikel: 13E
        hoofdstuk: II
  - number: 13E.2
    text: |-
      Gescheiden ballasttanks en ruimten binnen het ladingtankgedeelte (Lt), geen olietanks zijnde, dienen zodanig
      te zijn gelegen dat aan de volgende eisen wordt voldaan: σ PAc + σ PAs = J [Lt (B + 2 D)] waarin: PAc = voor
      elke gescheiden ballasttank of ruimte, geen olietank zijnde: de vertikale projektie van de oppervlakte van de
      zijbeplating van de huid, gemeten naar de mal in vierkante meters, PAs = voor elke zodanige tank of ruimte: de
      horizontale projektie van de oppervlakte van de vlakbeplating van de huid, gemeten naar de mal in vierkante meters,
      Lt = lengte tussen het voorste en achterste begrenzingsschot van de ladingtanks in meters, B = grootste breedte
      van het schip in meters, zoals omschreven in [het eerste lid, onder ][ref1], D = holte naar de mal, vertikaal
      gemeten van de bovenkant van de kiel tot de bovenkant van de balken van het vrijboorddek zoals gedefinieerd
      in [Bijlage I van het Schepenbesluit 1965][ref2] in de zijde in meters. Bij schepen waar de overgang van de
      huidbeplating naar de dekbeplating als een rondgezette plaat is uitgevoerd, moet de holte naar de mal gemeten
      worden tot het snijpunt van de doorgestrookte lijn van de bovenkant van de balken met de doorgestrookte lijn
      van de buitenkant van de spanten. J = 0,45 voor olietankschepen met een draagvermogen van 20.000 tonmassa;
      0,30 voor olietankschepen met een draagvermogen van 200.000 tonmassa of meer, behoudens het gestelde in
      [het derde lid van dit artikel][ref3]. Voor tussengelegen waarden van het draagvermogen moet de waarde van "J" door
      lineaire interpolatie worden bepaald. Waar in dit artikel de in dit lid vermelde symbolen voorkomen, hebben zij de
      betekenis zoals omschreven in dit lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002501
      [ref3]: https://wetten.overheid.nl/BWBR0003936#Artikel13E
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13E
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002501
      - id: ref3
        bwb_id: BWBR0003936
        artikel: 13E
        hoofdstuk: II
  - number: 13E.3
    text: |-
      Voor olietankschepen met een draagvermogen van 200.000 tonmassa of meer mag de waarde van "J" als volgt
      worden verminderd tot: of 0,2 welke van de twee de grootste is waarin: a = 0,25 voor olietankschepen met een
      draagvermogen van 200.000 tonmassa a = 0,40 voor olietankschepen met een draagvermogen van 300.000 tonmassa
      a 0,50 voor olietankschepen met een draagvermogen van 420.000 tonmassa of meer Voor tussengelegen waarden
      van het draagvermogen moet de waarde van "a" door lineaire interpolatie worden bepaald. Oc = als omschreven
      in [het eerste lid, onder ][ref1] Os = als omschreven in [het eerste lid, onder ][ref2] OA = de toelaatbare
      hoeveelheid uitgestroomde olie zoals bepaald in [het tweede lid van artikel 24][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0003936#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0003936#Artikel24
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13E
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '23'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003936
        artikel: '23'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0003936
        artikel: '24'
        hoofdstuk: III
  - number: 13E.4
    text: |-
      Bij de vaststelling van de waarden van PAc en PAs voor gescheiden ballasttanks en -ruimten, geen olietanks zijnde,
      is het volgende van toepassing:
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13E
  - number: 13E.4.a
    text: |-
      de kleinste breedte van elke zijtank of ruimte die zich over de volle hoogte van de scheepszijde, dan wel van het
      dek tot de bovenzijde van de dubbele bodem uitstrekt, mag niet minder zijn dan 2 m. De breedte dient binnenboord
      te worden gemeten vanaf de scheepshuid loodrecht op het vlak van kiel en stevens. Indien deze breedte geringer is
      mag de betreffende zijtank of ruimte niet in de berekening van de bescherming biedende oppervlakte "PAc " worden
      betrokken; en
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13E
  - number: 13E.4.b
    text: |-
      de kleinste hoogte van elke dubbele bodemtank of ruimte moet tenminste gelijk zijn aan B/15 of 2 m, welke van deze
      waarden de kleinste is. Indien de hoogte geringer is mag de betreffende bodemtank of ruimte niet in de berekening
      van de bescherming biedende oppervlakte "PAs" worden betrokken. De kleinste breedte en hoogte van zijtanks en
      dubbele bodemtanks dienen te worden gemeten buiten het gebied van de kimronding; de kleinste breedte moet, indien
      bij de overgang van huidbeplating naar dekbeplating een rondgezette plaat wordt toegepast, worden gemeten buiten
      het gebied van deze rondgezette plaat.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13E
  - number: 13F.1
    text: |-
      [Dit artikel][ref1] is van toepassing op olietankschepen met een draagvermogen van 600 tonmassa of meer:


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel13F
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13F
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: 13F
        hoofdstuk: II
  - number: 13F.1.a
    text: waarvoor het bouwcontract is gesloten op of na 6 juli 1993; of
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13F
  - number: 13F.1.b
    text: |-
      indien er geen bouwcontract is, waarvan de kiel is gelegd of waarvan de bouw zich in een soortgelijk stadium
      bevindt op of na 6 januari 1994; of
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13F
  - number: 13F.1.c
    text: waarvan de oplevering op of na 6 juli 1996 heeft plaatsgevonden; of
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13F
  - number: 13F.1.d
    text: 'die een belangrijke verbouwing hebben ondergaan:'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13F
  - number: 13F.1.d.1°
    text: waarvoor het contract is gesloten na 6 juli 1993; of
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13F
  - number: 13F.1.d.2°
    text: waarvan, indien er geen contract is, de verbouwing na 6 januari 1994 is begonnen; of
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13F
  - number: 13F.1.d.3°
    text: die na 6 juli 1996 is voltooid.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13F
  - number: 13F.2
    text: 'Elk olietankschip met een draagvermogen van 5 000 tonmassa of meer:'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13F
  - number: 13F.2.a
    text: |-
      voldoet, in plaats van aan [artikel 13e][ref1] indien van toepassing, aan het derde lid, tenzij wordt voldaan aan
      het bepaalde in het vierde en vijfde lid; en


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel13E
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13F
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: 13E
        hoofdstuk: II
  - number: 13F.2.b
    text: voldoet, indien van toepassing, aan het bepaalde in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13F
  - number: 13F.3
    text: |-
      De gehele lengte van het ladinggedeelte wordt als volgt beschermd door ballasttanks of ruimten, geen ladingtanks of
      brandstoftanks zijnde:
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13F
  - number: 13F.3.a
    text: |-
      zijtanks of ruimten strekken zich uit over de volle holte van het schip in de zijde of vanaf de bovenzijde van
      de dubbele bodem tot het bovenste dek, daarbij geen rekening houdende met een rondgezette plaat als overgang van
      huidbeplating naar dekbeplating. Zij zijn zodanig gesitueerd dat de ladingtanks nergens op een afstand geringer dan
      w binnenboord van de malkant van de huidbeplating zijn gelegen, loodrecht op de huid gemeten ter plaatse van elke
      willekeurige dwarsdoorsnede, zoals aangegeven in figuur 1, waarbij: w = 0,5 + DWT/20 000 m of 2 m, welke van de
      twee de kleinste is. De minimum waarde van w = 1 m.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13F
  - number: 13F.3.b
    text: |-
      ter plaatse van elke willekeurige dwarsdoorsnede is de hoogte van elke dubbele bodem tank of ruimte zodanig dat
      de afstand h tussen de bodem van de ladingtanks en de malkant van de vlakbeplating, loodrecht op deze beplating
      gemeten zoals aangegeven in figuur 1, niet minder is dan: h = B/15 m of 2 m, welke van de twee de kleinste is. De
      minimum waarde van h = 1 m.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13F
  - number: 13F.3.c
    text: |-
      indien de afstanden h en w verschillen wordt op hoogten groter dan 1,5h boven de basislijn de afstand w
      aangehouden, zoals aangegeven in figuur 1.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13F
  - number: 13F.3.d
    text: |-
      voor ruwe-olietankschepen met een draagvermogen van 20 000 tonmassa of meer en produktentankschepen met een
      draagvermogen van 30 000 tonmassa of meer is de gezamenlijke capaciteit van zijtanks, dubbele bodemtanks,
      voorpiektanks en achterpiektanks niet kleiner dan de capaciteit van de gescheiden ballasttanks benodigd
      om te voldoen aan [artikel 13][ref1]. Zijtanks of ruimten en dubbele bodemtanks gebruikt om te voldoen aan
      [artikel 13][ref2] zijn gelijkmatig verdeeld over de gehele lengte van het ladinggedeelte. Aanvullende gescheiden
      ballast capaciteit gebruikt voor het verminderen van langsscheepse spanningen of trim mag op elke plaats in het
      schip zijn gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003936#Artikel13
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13F
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '13'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003936
        artikel: '13'
        hoofdstuk: II
  - number: 13F.3.e
    text: |-
      zuigputten van ladingtanks mogen in de dubbele bodem onder de door de afstand h bepaalde grenslijn worden
      aangebracht, mits deze putten zo klein als praktisch mogelijk zijn en de afstand tussen de bodem van de put en de
      vlakbeplating ten minste 0,5h bedraagt.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13F
  - number: 13F.3.f
    text: |-
      ballastleidingen en andere leidingen, zoals peil- en ventilatieleidingen naar ballasttanks, lopen niet door
      ladingtanks. Ladingleidingen en soortgelijke leidingen naar ladingtanks lopen niet door ballasttanks. Uitzondering
      mag worden gemaakt voor korte leidinggedeelten mits deze geheel gelast of gelijkwaardig geconstrueerd zijn.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13F
  - number: 13F.4.a
    text: |-
      Dubbele bodemtanks of ruimten als vereist in het derde lid, onder *b*, kunnen achterwege blijven indien het
      ontwerp van de tanker zodanig is dat de druk op de vlakbeplating, die de enige scheiding vormt met de zee,
      uitgeoefend door de lading en de dampdruk, de hydrostatische waterdruk van het zeewater niet overschrijdt zoals
      aangegeven in de volgende formule:f * hc * pc * g + 100 | p dn * p s * gwaarin: hc = hoogte van de lading die op
      de vlakbeplating rust in meters; pc = maximum dichtheid van de lading in t/m3; dn = minimum diepgang voor elke
      verwachte beladingstoestand in meters; ps = dichtheid van het zeewater in t/;m3 |p = maximum insteldruk van de
      over-/onderdrukkleppen van de ladingtank in bar; f = veiligheidsfactor = 1,1; g = versnelling van de zwaartekracht
      (9,81 m/s2).
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13F
  - number: 13F.4.b
    text: |-
      Elke horizontale scheiding benodigd om te voldoen aan het gestelde [onder ][ref1], is geplaatst op een hoogte van
      de kleinste waarde van B/6 of 6 meter, maar niet meer dan 0,6D, waarin D de holte naar de mal midscheeps gemeten,
      boven de basislijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel13F
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13F
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: 13F
        hoofdstuk: II
  - number: 13F.4.c
    text: |-
      Zijtanks of ruimten zijn gesitueerd zoals bepaald in het derde lid, onder *a*, behalve dat, beneden een nniveau
      van 1,5h boven de basislijn, de grenslijn van de ladingtank verticaal naar beneden mag lopen tot het vlak zoals
      aangegeven in figuur 2, waarbij h als bedoeld in het derde lid, onder *b*.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13F
  - number: 13F.5
    text: |-
      Andere ontwerpen en vormen van constructie van olietankschepen kunnen worden aanvaard als gelijkwaardig alternatief
      voor het bepaalde in het derde lid na te zijn goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13F
  - number: 13F.6
    text: |-
      Voor olietankschepen met een draagvermogen van 20 000 tonmassa of meer wordt de aangenomen schade als bedoeld in
      [artikel 25, tweede lid, onder ][ref1], aangevuld met de onderstaande aangenomen bodemschade:


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel25
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13F
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '25'
        hoofdstuk: III
  - number: 13F.6.a
    text: 'langsscheeps:'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13F
  - number: 13F.6.a.1°
    text: 'schepen met een draagvermogen van 75 000 tonmassa of meer: 0,6L gemeten vanaf de voorloodlijn;'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13F
  - number: 13F.6.a.2°
    text: 'schepen met een draagvermogen kleiner dan 75 000 tonmassa: 0,4L gemeten vanaf de voorloodlijn'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13F
  - number: 13F.6.b
    text: 'dwarsscheeps: B/3 op elke plaats van het vlak'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13F
  - number: 13F.6.c
    text: 'verticaal: beschadiging van de huidbeplating.'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13F
  - number: 13F.7
    text: 'Olietankschepen met een draagvermogen kleiner dan 5 000 tonmassa zijn:'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13F
  - number: 13F.7.a
    text: |-
      ten minste uitgerust met dubbele bodemtanks of ruimten met een zodanige hoogte dat de afstand h als bedoeld in het
      derde lid, onder *b*, voldoet aan de volgende waarde:h: = B/15.De minimum waarde van h 0,76 m. In de ronding van de
      kim en op plaatsen zonder een duidelijke ronding van de kim loopt de begrenzing van het ladinggedeelte parallel aan
      het vlak zoals aangegeven in figuur 3; en
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13F
  - number: 13F.7.b
    text: |-
      voorzien van ladingtanks waarvan de inhoud niet groter is dan 700m3 tenzij voorzien is in zijtanks of ruimten
      overeenkomstig het bepaalde in het derde lid, onder *a*, waarbij voldaan wordt aan: w = 0,4 + 2,4DWT/20 000 m. De
      minimum waarde van w = 0,76 m.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13F
  - number: 13F.8
    text: |-
      Olie wordt niet vervoerd in een ruimte gelegen voor het aanvaringsschot dat is aangebracht, zoals is voorgeschreven
      in [artikel 11][ref1], tweede lid, van [Bijlage II van het Schepenbesluit 1965][ref2]. Een olietankschip
      waarvoor geen aanvaringsschot is vereist, zoals is voorgeschreven in [artikel 11][ref3], tweede lid, van
      [Bijlage II van het Schepenbesluit 1965][ref4], vervoert geen olie in een ruimte die zich uitstrekt voor een
      hypothetisch dwarsscheeps vlak, loodrecht op hart schip, en is gesitueerd als zijnde een aanvaringsschot dat
      voldoet aan het bepaalde in dat artikel. figuur 1 figuur 2 figuur 3


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002501
      [ref3]: https://wetten.overheid.nl/BWBR0002501#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13F
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0002501
      - id: ref3
        bwb_id: BWBR0002501
        artikel: '11'
      - id: ref4
        bwb_id: BWBR0002501
  - number: 13G
    text: |-
      Een olietankschip waarvoor het Internationaal certificaat van voorkoming van verontreiniging door olie, bedoeld
      in [artikel 5][ref1] vereist is, voldoet ter verkrijging en behoud van dat certificaat mede aan de eisen van
      [verordening (EG) nr. 417/2002](32002R0417) van het Europees Parlement en de Raad van de Europese Unie van
      18 februari 2002, betreffende het versneld invoeren van de vereisten inzake een dubbelwandige uitvoering of een
      gelijkwaardig ontwerp voor enkelwandige olietankschepen en tot intrekking van [Verordening (EG) nr. 2978/94]
      (31994R2978) van de Raad van de Europese Unie (PbEG L 64).


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel5
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel13G
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '5'
        hoofdstuk: I
  - number: '14.1'
    text: |-
      Behoudens het bepaalde in het tweede lid van dit artikel is het verboden ballastwater in enige brandstofolietank
      te vervoeren aan boord van nieuwe schepen geen olietankschepen zijnde, met een tonnage van 4000 of meer alsmede aan
      boord van nieuwe olietankschepen met een tonnage van 150 of meer.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel14
  - number: '14.2'
    text: |-
      Het bepaalde in het vorige lid is niet van toepassing, indien ongewone omstandigheden of de noodzaak om grote
      hoeveelheden brandstof mee te voeren ertoe leiden dat ballastwater moet worden vervoerd in enige brandstofolietank.
      In dergelijke gevallen dient zulk ballastwater te worden afgegeven aan havenontvangstvoorzieningen, dan wel is
      lozing ervan in zee toegestaan met inachtname van het bepaalde in de [artikelen 9][ref1] en [20][ref2], waarbij het
      gebruik van apparatuur als bedoeld in [artikel 16, tweede lid][ref3], is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003936#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0003936#Artikel16
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '9'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003936
        artikel: '20'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003936
        artikel: '16'
        hoofdstuk: II
  - number: '14.3'
    text: |-
      Het is niet toegestaan olie te vervoeren in de voorpiektank of in een tank die vóór het aanvaringsschot is gelegen,
      aan boord van een schip met een tonnage van 400 of meer;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel14
  - number: 14.3.a
    text: waarvoor het bouwcontract is gesloten na 1 januari 1982; of
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel14
  - number: 14.3.b
    text: |-
      indien geen bouwcontract is gesloten, waarvan de kiel is gelegd of waarvan de bouw zich in een soortgelijk stadium
      bevindt na 1 juli 1982.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel14
  - number: '14.4'
    text: |-
      Schepen niet vallende onder het eerste en derde lid dienen aan het bepaalde in deze leden te voldoen, tenzij zulks
      naar het oordeel van de inspecteur-generaal niet redelijk en praktisch uitvoerbaar is.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel14
  - number: '15.1'
    text: 'Olietankschepen met een tonnage van 150 of meer dienen te zijn uitgerust met:'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
  - number: 15.1.a
    text: |-
      toereikende middelen voor het reinigen van de ladingtanks, alsmede voor het overbrengen van de verontreinigde
      ballastrestanten en het tankwaswater naar een goedgekeurde sloptank, waarbij zodanige voorzieningen voor het
      overbrengen van de oliehoudende restanten naar een sloptank of een combinatie van sloptanks zijn getroffen, dat de
      lozing van elke vloeistof in de zee voldoet aan het bepaalde in [artikel 9][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel9
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '9'
        hoofdstuk: II
  - number: 15.1.b
    text: een sloptank of een combinatie van sloptanks die voldoen aan het bepaalde in het vierde lid;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
  - number: 15.1.c
    text: een bewakings- en regelsysteem voor het lozen van olie dat voldoet aan het bepaalde in het vijfde lid;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
  - number: 15.1.d
    text: doelmatige apparatuur om snel en nauwkeurig het oliewater scheidingsvlak in de sloptank vast te stellen; en
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
  - number: 15.1.e
    text: |-
      een goedgekeurd handboek waarin richtlijnen met betrekking tot het gebruik van de bewakings- en regelapparatuur
      zijn opgenomen en waarin zowel de automatische als de hand bediende werkwijze is beschreven.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
  - number: '15.2'
    text: |-
      Nieuwe olietankschepen met een draagvermogen van 70.000 tonmassa of meer dienen te zijn voorzien van tenminste
      twee sloptanks.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
  - number: '15.3'
    text: |-
      Bestaande olietankschepen met een tonnage van 150 of meer dienen eveneens te voldoen aan het bepaalde in het eerste
      lid met dien verstande dat iedere ladingtank kan worden aangemerkt als sloptank.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
  - number: 15.4.a
    text: |-
      Sloptanks dienen zo te zijn ontworpen, in het bijzonder met betrekking tot de plaatsing van de in- en uitlaten,
      keerplaten en -schotten voor zover aangebracht, dat overmatige turbulentie met het meevoeren van olie in het water
      of het vormen van emulsie met het water, wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
  - number: 15.4.b.1°
    text: |-
      De inhoud van de sloptank of van een combinatie van sloptanks mag niet minder zijn dan 3% van de inhoud van de
      ladingtanks van het schip.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
  - number: 15.4.b.2°
    text: |-
      De inspecteur-generaal kan toestaan dat de onder 1° voorgeschreven inhoud van de sloptanks of van de combinatie van
      sloptanks wordt verminderd:
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
  - number: 15.4.b.2°.(i)
    text: tot 2% voor een olietankschip dat is uitgerust met een gesloten tankwassysteem;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
  - number: 15.4.b.2°.(ii)
    text: |-
      tot 2% voor een olietankschip dat is uitgerust met gescheiden ballasttanks of aangewezen schone ballasttanks
      overeenkomstig het bepaalde in [artikel 13][ref1] of dat is uitgerust met een systeem voor het wassen met ruwe olie
      overeenkomstig het bepaalde in [artikel 13b][ref2], met dien verstande dat de inhoud mag worden verminderd tot 1½%
      indien het schip tevens is uitgerust met een gesloten tankwassysteem;


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003936#Artikel13B
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '13'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003936
        artikel: 13B
        hoofdstuk: II
  - number: 15.4.b.2°.(iii)
    text: |-
      tot 1% voor een combinatietankschip, dat de olie uitsluitend vervoert in tanks met gladde wanden, met dien
      verstande dat de inhoud mag worden verminderd tot 0,8% indien het schip tevens is uitgerust met een gesloten
      tankwassysteem.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
  - number: 15.5.a
    text: 'Het bewaking- en regelsysteem voor olielozingen als bedoeld in het eerste lid, onder *c* dient:'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
  - number: 15.5.a.1°
    text: |-
      te zijn voorzien van apparatuur voor een doorlopende weergave van de lozing in liters per zeemijl, alsmede van
      ofwel de totale hoeveelheid geloosde olie, ofwel van het oliegehalte en de hoeveelheid geloosde vloeistof per
      tijdseenheid. Deze registratie dient een aanduiding van tijd en datum te bevatten en dient tenminste drie jaar te
      worden bewaard; en
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
  - number: 15.5.a.2°
    text: |-
      automatisch in werking te treden wanneer er enige lozing van vloeistof in de zee plaatsvindt en zo te zijn
      ingericht dat elke lozing van een oliehoudend mengsel automatisch wordt gestopt wanneer de hoeveelheid geloosde
      olie per zeemijl het bepaalde in [het eerste lid, onder ][ref1] overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel9
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '9'
        hoofdstuk: II
  - number: 15.5.b
    text: |-
      Elke storing in het bewakings- en regelsysteem dient de lozing automatisch te doen stoppen en moet worden
      aangetekend in het oliejournaal, bedoeld in [artikel 20.][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel20
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '20'
        hoofdstuk: II
  - number: 15.5.c
    text: |-
      Er dient een andere methode door middel van handbediening aanwezig te zijn, die in geval van een dergelijke storing
      kan worden gebruikt. Het onklaar onderdeel van de apparatuur dient echter zo spoedig mogelijk bedrijfsklaar te
      worden gemaakt. De havenautoriteit kan een olietankschip met een onklaar onderdeel van de apparatuur toestemming
      verlenen een ballastreis te ondernemen voordat het zich naar een reparatiehaven begeeft.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
  - number: '15.6'
    text: |-
      Op olietankschepen met een tonnage van minder dan 150 is het bepaalde in de vorige leden niet van toepassing. Olie
      en verontreinigd tankwaswater dienen aan boord te worden gehouden en te worden verzameld in een opslagtank voor
      afgifte aan havenontvangstvoorzieningen, tenzij voldoende voorzieningen zijn getroffen voor het zodanig bewaken
      van de lozing van deze vloeistoffen in de zee dat verzekerd is dat daarbij aan het bepaalde in [artikel 9][ref1]
      wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel9
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '9'
        hoofdstuk: II
  - number: 15.7.a
    text: |-
      De inspecteur-generaal kan ontheffing verlenen van het bepaalde in het eerste tot en met het vijfde lid indien
      een olietankschip uitsluitend reizen maakt gelegen binnen een afstand van 50 zeemijlen van het dichtstbijzijnde
      land, waarvan de reisduur niet meer bedraagt dan 72 uur en de reizen uitsluitend gemaakt worden tussen havens
      van staten die partij zijn bij het Verdrag. Een zodanige ontheffing kan slechts worden verleend indien het
      olietankschip alle oliehoudende mengsels aan boord houdt, ter latere afgifte aan havenontvangstvoorzieningen, en
      deze havenontvangstvoorzieningen toereikend zijn, dit ter beoordeling van de inspecteur-generaal.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
  - number: 15.7.b
    text: |-
      De inspecteur-generaal kan ontheffing verlenen van het bepaalde in het vijfde lid, voor schepen niet vallende onder
      *a*, in de volgende gevallen:
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
  - number: 15.7.b.1°
    text: |-
      voor bestaande olietankschepen met een draagvermogen van 40 000 tonmassa of meer ingezet op reizen als bedoeld in
      [artikel 13c, eerste lid][ref1], en welke daarbij voldoen aan het bepaalde in [artikel 13c, tweede lid][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel13C
      [ref2]: https://wetten.overheid.nl/BWBR0003936#Artikel13C
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: 13C
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003936
        artikel: 13C
        hoofdstuk: II
  - number: 15.7.b.2°
    text: 'voor olietankschepen die uitsluitend reizen maken:'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
  - number: 15.7.b.2°.(i)
    text: |-
      binnen een bijzonder gebied als bedoeld in [artikel 10, eerste lid][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel10
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '10'
        hoofdstuk: II
  - number: 15.7.b.2°.(ii)
    text: |-
      binnen 50 zeemijlen van het dichtstbijzijnde land buiten een bijzonder gebied als bedoeld in
      [artikel 10, eerste lid][ref1], waarbij het olietankschip ingezet wordt:


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel10
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '10'
        hoofdstuk: II
  - number: 15.7.b.2°.(ii).1e
    text: voor reizen tussen havens van staten die partij zijn bij het Verdrag; of
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
  - number: 15.7.b.2°.(ii).2e
    text: |-
      voor reizen binnen een beperkt vaargebied, vastgesteld door de inspecteur-generaal, waarvan de reisduur niet meer
      dan 72 uur bedraagt.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
  - number: 15.7.c
    text: |-
      Indien een ontheffing wordt verleend overeenkomstig het bepaalde onder *b*, dient tevens te worden voldaan aan de
      volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
  - number: 15.7.c.1°
    text: alle oliehoudende mengsels worden aan boord gehouden voor afgifte aan havenontvangstvoorzieningen; en
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
  - number: 15.7.c.2°
    text: |-
      de hoeveelheid van het af te geven mengsel, het tijdstip van afgifte en de haven van afgifte worden aangetekend in
      het oliejournaal, bedoeld in [artikel 20.][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel20
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '20'
        hoofdstuk: II
  - number: 15.7.d
    text: |-
      Indien een ontheffing wordt verleend voor een olietankschip dat reizen maakt binnen een gebied als bedoeld in
      onderdeel *b*, onder 2°, onder (ii), dienen binnen het genoemde gebied de havenontvangstvoorzieningen toereikend te
      zijn, dit ter beoordeling van de inspecteur-generaal.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
  - number: 15.7.e
    text: |-
      Indien een ontheffing wordt verleend voor een olietankschip dat reizen maakt binnen een gebied als bedoeld in
      onderdeel *b*, onder 2° (i) en 2° (ii), ten 2e, zullen de genoemde gebieden worden vermeld op het certificaat,
      bedoeld in [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel5
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '5'
        hoofdstuk: I
  - number: 15.8.a
    text: |-
      De inspecteur-generaal kan vrijstelling verlenen van het bepaalde in [artikel 9, eerste lid onder ][ref1] en in
      het eerste lid onder *c* van dit artikel, indien geen apparatuur voor de bewaking en regeling van het lozen van
      geraffineerde lichte produkten beschikbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel15
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '15'
        hoofdstuk: II
  - number: 15.8.b
    text: |-
      Indien een vrijstelling als bedoeld onder *a* is verleend, dient de lozing te geschieden volgens door de
      inspecteur-generaal te stellen voorschriften.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
  - number: 15.8.c
    text: De inspecteur-generaal zal jaarlijks bezien of en in hoeverre de onder *a* genoemde apparatuur beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
  - number: '15.9'
    text: |-
      Het bepaalde in het eerste tot en met het vijfde lid is niet van toepassing op een olietankschip dat asfalt
      vervoert of andere producten waarop de bepalingen van dit besluit van toepassing zijn, waarvan de fysische
      eigenschappen een effectieve scheiding van het product en water alsmede een effectief bewaken van de lozing
      belemmeren. Alle ladingrestanten dienen aan boord te worden gehouden en tezamen met alle verontreinigd waswater aan
      een havenontvangstvoorziening te worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel15
  - number: '16.1'
    text: |-
      Elk schip met een tonnage van 400 of meer en minder dan 10 000 is uitgerust met apparatuur voor het filtreren van
      oliehoudende mengsels welke voldoet aan het vierde lid. Indien zo’n schip grote hoeveelheden brandstof vervoert,
      voldoet het schip aan het tweede lid of aan [artikel 14, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel14
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '14'
        hoofdstuk: II
  - number: '16.2'
    text: |-
      Elk schip met een tonnage van 10 000 of meer is uitgerust met apparatuur voor het filtreren van oliehoudende
      mengsels en met een inrichting voor een alarm en een automatische stop indien het oliegehalte van de te lozen
      vloeistof hoger is dan 15 delen per miljoen.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel16
  - number: 16.3.a
    text: |-
      De inspecteur-generaal kan ontheffing verlenen van het bepaalde in het eerste en tweede lid voor een schip dat
      uitsluitend reizen maakt binnen bijzondere gebieden indien wordt voldaan aan alle volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel16
  - number: 16.3.a.1°
    text: |-
      het schip is voorzien van een verzameltank met een voldoende inhoud voor het aan boord opslaan van alle met olie
      verontreinigd lenswater;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel16
  - number: 16.3.a.2°
    text: |-
      al het met olie verontreinigd lenswater wordt aan boord opgeslagen om vervolgens te worden afgegeven aan
      havenontvangstvoorzieningen;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel16
  - number: 16.3.a.3°
    text: |-
      in de havens waarnaar het schip reizen maakt, zijn voldoende havenontvangstvoorzieningen beschikbaar voor het in
      ontvangst nemen van het met olie verontreinigd lenswater;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel16
  - number: 16.3.a.4°
    text: op het certificaat is aangetekend dat het schip uitsluitend reizen maakt binnen bijzondere gebieden;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel16
  - number: 16.3.a.5°
    text: |-
      de hoeveelheid van het af te geven mengsel, het tijdstip en de haven van afgifte worden aangetekend in het
      oliejournaal.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel16
  - number: 16.3.b
    text: |-
      Een schip met een tonnage van minder dan 400 dient, voor zover praktisch uitvoerbaar, zodanig te zijn uitgerust
      dat olierestanten of oliehoudende mengsels aan boord kunnen worden opgeslagen of dat lozing daarvan kan geschieden
      overeenkomstig het bepaalde in [artikel 9, eerste lid, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel9
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '9'
        hoofdstuk: II
  - number: '16.4'
    text: |-
      Apparatuur voor het filtreren van oliehoudende mengsels als bedoeld in het eerste lid, moet waarborgen dat van elk
      in zee te lozen oliehoudend mengsel, nadat het door deze apparatuur is gevoerd, het oliegehalte niet hoger is dan
      15 delen per miljoen.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel16
  - number: '16.5'
    text: |-
      Apparatuur voor het filtreren van oliehoudende mengsels als bedoeld in het tweede lid moet waarborgen dat van elk
      in zee te lozen oliehoudend mengsel, nadat het door deze apparatuur is gevoerd, het oliegehalte niet hoger is dan
      15 delen per miljoen. De apparatuur dient te zijn voorzien van een alarminrichting die aangeeft wanneer dit gehalte
      wordt overschreden. De apparatuur dient zodanig te zijn ingericht dat elke lozing automatisch wordt gestopt indien
      het oliegehalte van de te lozen vloeistof hoger is dan 15 delen per miljoen.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel16
  - number: '16.6'
    text: |-
      Schepen opgeleverd voor 6 juli 1993 moeten met ingang van 6 juli 1998 aan dit artikel voldoen indien deze schepen
      zijn uitgerust met apparatuur voor het scheiden van olie en water tot 100 delen per miljoen.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel16
  - number: '17.1'
    text: |-
      Elk schip met een tonnage van 400 of meer dient te zijn uitgerust met een of meer tanks met een inhoud die, met
      inachtneming van het type van de machine-installatie en de duur van de reis, toereikend is voor het opslaan van
      olierestanten welke ontstaan bij het reinigen van brandstof en smeeroliën en door olielekkages in de ruimten voor
      machines, en welke niet kunnen worden behandeld op enige andere wijze overeenkomstig de bepalingen van dit besluit.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel17
  - number: '17.2'
    text: |-
      Aan boord van nieuwe schepen dienen deze tanks zodanig te zijn ontworpen en gebouwd dat de reiniging ervan en
      de afgifte van restanten aan havenontvangstvoorzieningen wordt vergemakkelijkt. Inrichtingen voor het ontluchten
      van de tanks, het ledigen ervan en het meten van de in de tanks aanwezige vloeistof, dienen ten genoegen van de
      inspecteur-generaal te zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel17
  - number: '17.3'
    text: |-
      Op bestaande schepen is het bepaalde in het tweede lid van toepassing, indien zulks naar het oordeel van de
      inspecteur-generaal redelijk en praktisch uitvoerbaar is.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel17
  - number: '17.4'
    text: |-
      Pijpleidingen naar en van tanks voor olierestanten welke ontstaan bij het reinigen van brandstof en
      smeeroliën mogen geen andere directe aansluiting overboord hebben dan de standaard aansluiting, bedoeld in
      [artikel 19][ref1] .


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel19
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '19'
        hoofdstuk: II
  - number: '18.1'
    text: |-
      Aan boord van elk olietankschip dient op het open dek, aan beide zijden van het schip, een losaansluiting
      te zijn aangebracht voor de afgifte van door olie verontreinigd ballastwater of tankwaswater aan
      havenontvangstvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel18
  - number: 18.2.a
    text: |-
      Aan boord van elk olietankschip dienen de pijpleidingen voor het lozen van ballastwater of met olie verontreinigd
      water afkomstig van het ladinggedeelte van het schip, zoals toegestaan krachtens [artikel 9][ref1] of
      [10][ref2], te zijn geleid naar het open dek, of naar de zijde van het schip boven de waterlijn, behorende bij de
      ballasttoestand met de grootste diepgang.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003936#Artikel10
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '9'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003936
        artikel: '10'
        hoofdstuk: II
  - number: 18.2.b
    text: |-
      Voor lozingen toegestaan krachtens het bepaalde in het zesde lid kan een afwijkend systeem worden aanvaard, zulks
      naar het oordeel van de inspecteur-generaal.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel18
  - number: 18.3.a
    text: |-
      Aan boord van nieuwe olietankschepen dienen voorzieningen te zijn getroffen voor het stoppen van de lozing van
      ballastwater of met olie verontreinigd water afkomstig van het ladinggedeelte van het schip, vanaf een zodanige
      plaats op het bovendek of hoger, dat de in gebruik zijnde losaansluiting, bedoeld in het eerste lid, en de lozing
      in zee uit de pijpleidingen, bedoeld in het tweede lid, onder *a*, vanaf die plaats met het oog waarneembaar zijn.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel18
  - number: 18.3.b
    text: |-
      Er behoeven geen voorzieningen voor het stoppen van de lozing bij de waarnemingsplaats te zijn aangebracht, indien
      is voorzien in een goed werkende radio- of telefoonverbinding tussen de waarnemingsplaats en de plaats waar de
      lozing kan worden gestopt.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel18
  - number: '18.4'
    text: |-
      Elk nieuw olietankschip dat moet zijn voorzien van gescheiden ballasttanks of dat moet zijn uitgerust met een
      systeem voor het wassen met ruwe olie, dient te voldoen aan de volgende bepalingen:
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel18
  - number: 18.4.a
    text: |-
      het schip moet zijn uitgerust met ladingleidingen welke zodanig zijn ontworpen en aangebracht dat het achterblijven
      van olie in de leidingen tot een minimum wordt beperkt; en
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel18
  - number: 18.4.b
    text: |-
      voorzieningen moeten zijn getroffen voor het aftappen van alle ladingpompen en alle ladingleidingen na het lossen,
      zonodig door aansluiting op een nazuigsysteem. De afgetapte olie moet zowel naar de wal als naar een ladingtank of
      sloptank kunnen worden overgebracht. Voor afgifte aan de wal moet een afzonderlijke leiding met een kleine diameter
      zijn aangebracht. Deze leiding dient te zijn aangesloten op de losaansluiting buiten de hoofdafsluiters.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel18
  - number: '18.5'
    text: |-
      Elk bestaand ruwe olietankschip dat dient te zijn voorzien van gescheiden ballasttanks of de methode van aangewezen
      schone ballasttanks gebruikt dan wel dient te zijn uitgerust met een systeem voor het wassen met ruwe olie, dient
      te voldoen aan het bepaalde in het vierde lid, onder b.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel18
  - number: '18.6'
    text: |-
      Aan boord van olietankschepen dient ballastwater of met olie verontreinigd water afkomstig van het ladinggedeelte
      boven de waterlijn te worden geloosd behalve in de volgende gevallen:
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel18
  - number: 18.6.a
    text: 'gescheiden en schone ballast mogen onder de waterlijn worden geloosd:'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel18
  - number: 18.6.a.1°
    text: in havens; of
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel18
  - number: 18.6.a.2°
    text: |-
      op zee door het laten aflopen van de tanks; mits een onderzoek van de oppervlakte van het ballastwater onmiddellijk
      voorafgaand aan de lozing heeft uitgewezen dat geen verontreiniging met olie heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel18
  - number: 18.6.b
    text: |-
      bestaande olietankschepen welke zonder verbouwing niet in staat zijn gescheiden ballastwater boven de waterlijn
      te lozen, mogen dergelijk ballastwater op zee onder de waterlijn lozen mits een onderzoek van de oppervlakte van
      het ballastwater onmiddellijk voorafgaand aan de lozing heeft uitgewezen dat geen verontreiniging met olie heeft
      plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel18
  - number: 18.6.c
    text: |-
      bestaande olietankschepen welke gebruik maken van aangewezen schone ballasttanks en zonder verbouwing niet in staat
      zijn ballastwater uit deze tanks boven de waterlijn te lozen, mogen dergelijk ballastwater onder de waterlijn lozen
      mits de lozing wordt gecontroleerd overeenkomstig het bepaalde in [artikel 13 A, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel13A
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: 13A
        hoofdstuk: II
  - number: 18.6.d
    text: |-
      olietankschepen mogen verontreinigd ballastwater of met olie verontreinigd water afkomstig van de ladingtanks,
      uitgezonderd de sloptanks, op zee onder de waterlijn lozen door het laten aflopen van de tank mits:
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel18
  - number: 18.6.d.1°
    text: er voldoende tijd is verstreken zodat scheiding van olie en water heeft plaatsgevonden; en
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel18
  - number: 18.6.d.2°
    text: |-
      het ballastwater is onderzocht onmiddellijk voorafgaand aan de lozing met apparatuur voor het vaststellen van het
      oliewater scheidingsvlak, bedoeld in [artikel 15, eerste lid onder ][ref1], teneinde te verzekeren dat de hoogte
      van het scheidingsvlak zodanig is dat de lozing geen verhoogd risico met zich meebrengt voor het mariene milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel15
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '15'
        hoofdstuk: II
  - number: 18.6.e
    text: |-
      In afwijking van het bepaalde onder *d* , mag een bestaand olietankschip verontreinigd ballastwater of met olie
      verontreinigd water afkomstig van het ladinggedeelte op zee onder de waterlijn lozen mits:
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel18
  - number: 18.6.e.1°
    text: |-
      een deel van het te lozen water door een vaste leiding wordt geleid naar een gemakkelijk bereikbare plaats op het
      bovendek of daarboven, alwaar de lozing visueel kan worden gecontroleerd; en
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel18
  - number: 18.6.e.2°
    text: deze voorzieningen van lozen voldoen aan nadere door de inspecteur-generaal te geven voorschriften.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel18
  - number: '19'
    text: |-
      Teneinde de leidingen van havenontvangstvoorzieningen te kunnen aansluiten op de scheepspijpleiding bestemd voor
      de afgifte van restanten afkomstig van de ruimten voor machines, dienen beide leidingen te zijn uitgerust met
      een standaardaansluiting voor afgifte, overeenkomstig de volgende tabel: Standaardafmetingen van flenzen voor
      aansluitingen voor afgifte






                  Omschrijving


                  Afmeting






                  uitwendige flensdiameter


                  215 mm




                  inwendige flensdiameter


                  overeenkomstig de uitwendige diameter van de pijp




                  diameter van de steek-cirkel van de bouten


                  183 mm




                  boutgaten


                  6 gaten van 22 mm diameter, aangebracht op onderling gelijke afstanden op de bovenstaande steekcirkel
      van de bouten, met sleuven radiaal doorgetrokken tot de omtrek




                  flensdikte


                  20 mm




                  bouten en moeren


                  6, elk met een diameter van 20 mm en van voldoende lengte




         De flens is zo ontworpen dat er pijpleidingen op kunnen worden aangesloten met een inwendige diameter van ten
      hoogste 125 mm. Deze flens dient van staal of ander gelijkwaardig materiaal te zijn met een vlakke voorzijde. Deze
      flens dient, tezamen met een pakking van oliebestendig materiaal, geschikt te zijn voor een werkdruk van 6kg/cm2.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel19
  - number: '20.1'
    text: |-
      Elk olietankschip met een tonnage van 150 of meer en elk schip, geen olietankschip zijnde, met een tonnage van 400
      of meer, moet zijn voorzien van een oliejournaal [deel I][ref1]. Elk olietankschip met een tonnage van 150 of meer
      moet tevens zijn voorzien van een oliejournaal [deel II][ref2]. Het oliejournaal moet zijn ingericht overeenkomstig
      het model als aangegeven in Aanhangsel III van Bijlage I van het Verdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0003936#Artikel20
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '20'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003936
        artikel: '20'
        hoofdstuk: II
  - number: '20.2'
    text: |-
      Het oliejournaal dient, indien van toepassing voor elke tank afzonderlijk, te worden ingevuld telkens wanneer een
      van de volgende handelingen plaats vindt aan boord van:
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel20
  - number: 20.2.a
    text: 'alle schepen:'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel20
  - number: 20.2.a.1°
    text: het ballasten of schoonmaken van brandstofolietanks;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel20
  - number: 20.2.a.2°
    text: |-
      het lozen van verontreinigd ballastwater of waswater uit tanks, bedoeld [onder 1°][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel20
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '20'
        hoofdstuk: II
  - number: 20.2.a.3°
    text: het verwijderen van oliehoudende restanten; en
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel20
  - number: 20.2.a.4°
    text: het lozen of afgeven van lenswater dat zich in ruimten voor machines heeft verzameld;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel20
  - number: 20.2.b
    text: 'olietankschepen:'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel20
  - number: 20.2.b.1°
    text: het innemen van ladingolie;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel20
  - number: 20.2.b.2°
    text: het overbrengen van ladingolie van de ene tank naar de andere tijdens de reis;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel20
  - number: 20.2.b.3°
    text: het lossen van ladingolie;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel20
  - number: 20.2.b.4°
    text: het ballasten van ladingtanks en aangewezen schone ballasttanks;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel20
  - number: 20.2.b.5°
    text: het schoonmaken van ladingtanks waaronder het wassen met ruwe olie;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel20
  - number: 20.2.b.6°
    text: het lozen van ballastwater, behalve vanuit gescheiden ballasttanks;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel20
  - number: 20.2.b.7°
    text: het lozen van water uit sloptanks;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel20
  - number: 20.2.b.8°
    text: het sluiten van de afsluiters of soortgelijke middelen na het lozen of afgeven van de inhoud van sloptanks;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel20
  - number: 20.2.b.9°
    text: |-
      het sluiten van afsluiters voor het scheiden van aangewezen schone ballasttanks van laadleidingen en
      nazuigleidingen, na lozing of afgifte van de inhoud van de sloptank; en
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel20
  - number: 20.2.b.10°
    text: het verwijderen van oliehoudende restanten.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel20
  - number: '20.3'
    text: |-
      Indien olierestanten of oliehoudende mengsels worden geloosd als bedoeld in [artikel 11][ref1], of indien een
      ongewilde of een buitengewone lozing van olie plaatsvindt welke niet als uitzondering geldt volgens dat artikel,
      dient melding in het oliejournaal te worden gemaakt van de omstandigheden waaronder en de redenen waarom de lozing
      geschiedde.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel11
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '11'
        hoofdstuk: II
  - number: '20.4'
    text: |-
      Elke handeling als bedoeld in het tweede lid dient onverwijld en volledig te worden vermeld, en wel zodanig dat
      alle rubrieken in het oliejournaal die betrekking hebben op de handeling, worden ingevuld. Deze vermelding dient
      in de Nederlandse en in de Engelse taal te worden gesteld. Elk deel van het oliejournaal moet door een officier
      of officieren, belast met het toezicht op de betreffende handelingen, worden ondertekend. Elke bladzijde van het
      oliejournaal dient te worden ondertekend door de kapitein.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel20
  - number: 20.5.a
    text: |-
      Het oliejournaal moet, behalve in geval van onbemand gesleepte schepen, op een zodanige plaats aan boord worden
      bewaard dat het op elk redelijk tijdstip beschikbaar is voor onderzoek door de daartoe bevoegde autoriteit.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel20
  - number: 20.5.b
    text: |-
      Het oliejournaal moet gedurende een periode van drie jaar nadat de laatste aantekening erin is gesteld worden
      bewaard.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel20
  - number: '21'
    text: |-
      Installaties dienen, gedurende de tijd dat zij drijven en niet worden gebezigd voor het instellen van een onderzoek
      naar delfstoffen onder de zeebodem of het winnen daarvan, te voldoen aan de bepalingen van dit besluit welke van
      toepassing zijn op schepen geen olietankschepen zijnde, met een tonnage van 400 of meer, met dien verstande dat
      zij:
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel21
  - number: 21.a
    text: |-
      moeten zijn uitgerust met de voorzieningen als bedoeld in de[ artikelen 16][ref1] en [17][ref2], voorzover
      praktisch uitvoerbaar;


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003936#Artikel17
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '16'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003936
        artikel: '17'
        hoofdstuk: II
  - number: 21.b
    text: |-
      in plaats van het oliejournaal aantekening houden in een staat, volgens een door de Minister van Economische
      Zaken vast te stellen model, van alle werkzaamheden waarbij lozingen van olierestanten of oliehoudende mengsels
      plaatsvinden; en
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel21
  - number: 21.c
    text: |-
      behoudens het bepaalde in [artikel 11][ref1] geen olierestanten of oliehoudende mengsels in zee mogen lozen, tenzij
      het oliegehalte in het geloosde onverdunde mengsel niet hoger is dan 15 delen per miljoen.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel11
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '11'
        hoofdstuk: II
  - number: '22.1'
    text: |-
      Aan de berekening van hypothetische uitstroming van olie uit olietankschepen liggen voor de mate van beschadiging
      drie grootheden van een parallellepipedum in de zijde en aan het vlak van het schip als volgt ten grondslag. In
      geval van schade aan het vlak worden twee voorwaarden gesteld, die afzonderlijk op de aangegeven gedeelten van het
      olietankschip moeten worden toegepast.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel22
  - number: 22.1.a
    text: |-
      Schade in de zijde van het schip:







                        1°.


                        Langsscheeps (L):


                        1/3L2/3 of 14,5 m, welke van de twee de kleinste is




                        2°.


                        Dwarsscheeps (t):


                        B/5 of 11,5 m, welke van de twee de kleinste is





                        (binnenboord gemeten vanaf de scheepshuid loodrecht op het vlak van kiel en stevens, ter hoogte
      van de lastlijn behorende bij het toegekende zomervrijboord)





                        3°.


                        Verticaal (v):


                        vanaf de lijn van onderkant spanten naar boven, zonder begrenzing
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel22
  - number: 22.1.b
    text: |-
      Schade aan het vlak van het schip:








                        Over 0,3 L vanaf voorlood lijn van het schip


                        Elk ander deel van het schip






                        1°. Langsscheeps (L):


                        L/10


                        L/10 of 5 m, welke van de twee de kleinste is









                        2°. Dwarsscheeps (t):


                        B/6 of 10 m, welke van de twee de 5 m kleinste is, maar niet minder dan 5 m










                        3°. Verticaal vanaf de lijn van onderkant spanten (v):


                        B/15 of 6m, welke van de twee de kleinste is
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel22
  - number: '22.2'
    text: |-
      Waar de in [dit artikel][ref1] gegeven symbolen in [dit hoofdstuk][ref2] voorkomen, hebben zij de in
      [dit artikel][ref3] omschreven betekenis.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0003936#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0003936#Artikel22
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '22'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003936
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0003936
        artikel: '22'
        hoofdstuk: III
  - number: 23.1.a
    text: |-
      De hypothetische uitstroming van olie in geval van schade in de zijde van het schip (Oc en aan het vlak van het
      schip (Os) dient ten aanzien van beschadigde afdelingen op alle mogelijke plaatsen over de gehele lengte van het
      schip, in de mate als omschreven in [artikel 22][ref1], te worden berekend met de volgende formules:


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel22
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '22'
        hoofdstuk: III
  - number: 23.1.a.1°
    text: 'bij schade in de zijde van het schip: Oc = σ Wi + σ KiCi (I)'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel23
  - number: 23.1.a.2°
    text: |-
      bij schade aan het vlak van het schip: Os = 1/3 (σ ZiWi + σ ZiCi) (II) waarin: Wi = de inhoud in kubieke meters van
      een zijtank, die wordt geacht te zijn lek gestoten als gevolg van de schade zoals aangegeven in [artikel 22][ref1].
      Voor gescheiden ballasttanks kan Wi gelijk aan nul worden gesteld; Ci = de inhoud in kubieke meters van een
      middentank die wordt geacht te zijn lek gestoten als gevolg van de schade zoals aangegeven in [artikel 22][ref2].
      Voor gescheiden ballasttanks kan Ci gelijk aan nul worden gesteld; Ki = 1 - bi/tc; wanneer bi gelijk is aan of
      groter is dan tc, dient Ki gelijk aan nul te worden gesteld; Zi = 1 - hi/vs; wanneer hi gelijk is aan of groter
      dan vs, dient Zi gelijk aan nul te worden gesteld; bi = breedte van de betreffende zijtank in meters, binnenboord
      gemeten vanaf de scheepshuid loodrecht op het vlak van kiel en stevens, ter hoogte van de lastlijn behorende bij
      het toegekende zomervrijboord; hi = kleinste hoogte van de betreffende dubbele bodem, in meters. Wanneer er geen
      dubbele bodem is aangebracht dient hi gelijk aan nul te worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0003936#Artikel22
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '22'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003936
        artikel: '22'
        hoofdstuk: III
  - number: 23.1.b
    text: |-
      Waar de onder *a* van dit lid gegeven symbolen in dit hoofdstuk voorkomen, hebben zij de in dit artikel omschreven
      betekenis.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel23
  - number: '23.2'
    text: |-
      Indien een loze ruimte of een gescheiden ballasttank met een lengte die kleiner is dan 1c zoals omschreven in
      [artikel 22][ref1], tussen zijtanks voor olie is gelegen, kan Oc in formule (I) worden berekend onder de aanname
      dat Wi de werkelijke inhoud van één dezer zijtanks is (wanneer zij eenzelfde inhoud hebben) of dat de inhoud Wi
      de kleinste is van de twee zijtanks (wanneer zij een verschillende inhoud hebben) vermenigvuldigd met Si zoals
      hieronder omschreven, terwijl voor alle andere bij een zodanige aanvaring betrokken zijtanks de waarde van de
      werkelijke volle inhoud moet worden aangehouden. Si = 1 - li/lc waarin: li = lengte van de betreffende lege ruimte
      of gescheiden ballasttank in meters.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel22
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '22'
        hoofdstuk: III
  - number: 23.3.a
    text: |-
      De hoogte hi van de dubbele bodem als bedoeld in het eerste lid, onder *a*, mag alleen in rekening worden gebracht
      indien zij leeg zijn of schoon water bevatten, en wanneer in de daarboven gelegen tanks lading wordt vervoerd.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel23
  - number: 23.3.b
    text: |-
      Indien de dubbele bodem zich niet uitstrekt over de gehele lengte en breedte van de betreffende tank, wordt de
      dubbele bodem geacht niet aanwezig te zijn en dient de inhoud van de tanks boven het gebied van de bodemschade
      in formule (II) inbegrepen te worden, zelf indien de tank wegens het aanbrengen van een dergelijke gedeeltelijke
      dubbele bodem als onbeschadigd kan worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel23
  - number: 23.3.c
    text: |-
      Voor de bepaling van de waarde hi mogen zuigputten buiten beschouwing worden gelaten, mits deze geen buitensporig
      groot oppervlak hebben, zulks ter beoordeling van de inspecteur-generaal, en welke zo weinig mogelijk, in geen
      geval meer dan de halve hoogte van de dubbele bodem, onder de tank uitsteken.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel23
  - number: '23.4'
    text: |-
      Indien een bodemschade tegelijkertijd vier middentanks betreft, kan de waarde Os worden berekend aan de hand van de
      volgende formule: Os = 1/4 (σ ZiWi + σ ZiCi) (III)
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel23
  - number: '23.5'
    text: |-
      Indien elke ladingtank is voorzien van een inrichting voor het verpompen van lading welke is uitgevoerd met een
      hoog aangebrachte noodzuigaansluiting en waarmee lading vanuit één of meer beschadigde tanks kan worden overgepompt
      naar gescheiden ballasttanks of naar andere ladingtanks waarvan het zeker is dat de ullage in deze tanks voldoende
      is, kan de inspecteur-generaal toestaan dat bij bodemschade rekening wordt gehouden met een geringere hoeveelheid
      uitgestroomde olie. Het al of niet rekening houden met een zodanig leidingstelsel is afhankelijk van het vermogen
      om in twee uur tijd een hoeveelheid olie over te pompen, die gelijk is aan de helft van de inhoud van de grootste
      van de betreffende beschadigde tanks en van de beschikbaarheid van een daarmede overeenkomende opnamecapaciteit in
      ballast- of ladingtanks. Het rekening houden met deze omstandigheden dient te worden beperkt tot het toestaan van
      de berekening van Os volgens formule (III). De leidingen voor dergelijke zuiginrichtingen moeten zijn aangebracht
      op een hoogte die ten minste gelijk is aan de vertikale omvang van de schade aan het vlak van het schip vs.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel23
  - number: '24.1'
    text: |-
      Elk nieuw olietankschip dient te voldoen aan de bepalingen van dit artikel. Elk bestaand olietankschip dient vanaf
      2 oktober 1985 te voldoen aan de bepalingen van [dit artikel][ref1], indien een dergelijk olietankschip behoort tot
      een der volgende categorieën:


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel24
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '24'
        hoofdstuk: III
  - number: 24.1.a
    text: een olietankschip dat na 1 januari 1977 wordt opgeleverd; of
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel24
  - number: 24.1.b
    text: 'een olietankschip dat aan beide van de volgende voorwaarden voldoet:'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel24
  - number: 24.1.b.1°
    text: de oplevering geschiedt niet later dan 1 januari 1977; en
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel24
  - number: 24.1.b.2°
    text: |-
      het bouwcontract is afgesloten na 1 januari 1974 ofwel, indien vooraf geen bouwcontract is afgesloten, de kiel is
      gelegd, dan wel de bouw van het olietankschip zich bevindt in een soortgelijk stadium, na 30 juni 1974.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel24
  - number: '24.2'
    text: |-
      De grootte en de indeling van de ladingtanks van olietankschepen dienen zodanig te zijn, dat de hypothetische
      uitstroming Oc of Os, berekend in overeenstemming met het bepaalde in [artikel 23][ref1], op elke willekeurige
      plaats over de gehele lengte van het schip niet groter is dan 30.000 m3 of 4003 DWT, welke van de twee de grootste
      is, maar niet groter dan 40.000 m3.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel23
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '23'
        hoofdstuk: III
  - number: '24.3'
    text: |-
      De inhoud van elke zijtank voor olie van een olietankschip mag niet groter zijn dan vijfenzeventig procent van de
      toegelaten hypothetische uitstroming van olie zoals bedoeld in [het tweede lid van dit artikel][ref1]. De inhoud
      van een middentank mag niet groter zijn dan 50.000 m3. Bij gescheiden ballast olietankschepen zoals bedoeld in
      [artikel 13][ref2], mag de toegestane inhoud van een zijtank, gelegen tussen twee gescheiden ballasttanks die elk
      langer zijn dan Zc, worden vergroot tot de maximaal toegestane hypothetische uitstroming van olie, mits de breedte
      van de zijtanks groter is dan tc.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0003936#Artikel13
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '24'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003936
        artikel: '13'
        hoofdstuk: II
  - number: '24.4'
    text: 'De lengte van elke ladingtank mag niet groter zijn dan 10 m of de grootste van een van de volgende waarden:'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel24
  - number: 24.4.a
    text: 'wanneer geen langsschot in de ladingtanks is aangebracht: (0,5 bi/B + 0,1)L maar niet groter dan 0,2L'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel24
  - number: 24.4.b
    text: 'wanneer op hart schip een langsschot in de ladingtanks is aangebracht: (0,25 bi/B + 0,15)L'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel24
  - number: 24.4.c
    text: 'wanneer twee of meer langsschotten in de ladingtanks zijn aangebracht:'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel24
  - number: 24.4.c.1°
    text: 'voor zijtanks voor lading: 0,2L'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel24
  - number: 24.4.c.2°
    text: 'voor middentanks voor lading:'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel24
  - number: 24.4.c.2°.(i)
    text: |-
      indien bi/B gelijk is aan of groter dan één vijfde: 0,2L (ii). indien bi/B kleiner is dan één vijfde: - wanneer
      geen langsschot op hart schip is aangebracht: (0,5 bi/B + 0,1)L
        - wanneer een langsschot op hart schip is aangebracht: (0,25 bi/B + 0,15)L bi is de minimum afstand van de
      scheepshuid tot het buitenste langsschot van de desbetreffende tank, binnenboord gemeten loodrecht op het vlak van
      kiel en stevens, ter hoogte van de lastlijn behorende bij het toegekende zomervrijboord.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel24
  - number: 24.5.a
    text: |-
      Indien een geïnstalleerd en goedgekeurd "ladingpompsysteem" twee of meer ladingtanks met elkaar verbindt, dienen
      afsluiters of soortgelijke afsluitmiddelen ter onderlinge afscheiding van deze tanks te zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel24
  - number: 24.5.b
    text: Deze afsluiters of afsluitmiddelen dienen gesloten te zijn wanneer het tankschip zich op zee bevindt.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel24
  - number: 24.6.a
    text: |-
      Pijpleidingen die door ladingtanks lopen, en die zich op een kleinere afstand dan tc van de scheepshuid of op een
      geringere hoogte dan vs van de bodem bevinden, dienen voor elke tank waarin zich een open zuigeinde bevindt ter
      plaatse waar de leiding de tank binnentreedt te zijn voorzien van afsluiters of soortgelijke afsluitmiddelen.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel24
  - number: 24.6.b
    text: De afsluiters dienen gesloten te blijven wanneer het schip zich op zee bevindt èn de tanks olie bevatten.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel24
  - number: 24.6.c
    text: |-
      De afsluiters mogen slechts dan worden geopend indien met het oog op het vertrimmen van het schip, het overpompen
      van de lading noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel24
  - number: '25.1'
    text: |-
      Elk nieuw olietankschip dient bij de aangenomen schade in de zijde of aan het vlak van het schip, zoals aangegeven
      in het derde lid, te voldoen aan de criteria betreffende de waterdichte indeling en de stabiliteit van het
      schip in beschadigde toestand zoals aangegeven in het derde lid van dit artikel. Het hierboven bepaalde is van
      toepassing op elke voorkomende diepgang die voortvloeit uit een gedeeltelijke of volledige belading van het schip
      in overeenstemming met de toelaatbare trim en sterkte van het schip alsmede uit de soortelijk gewichten van de
      lading. De beschadiging dient op alle mogelijke plaatsen over de gehele lengte van het schip als volgt te worden
      aangenomen:
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25
  - number: 25.1.a
    text: |-
      bij olietankschepen met een lengte van meer dan 225 m: op elke willekeurige plaats over de gehele lengte van het
      schip;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25
  - number: 25.1.b
    text: |-
      bij olietankschepen met een lengte van meer dan 150 m, maar niet meer dan 225 m: op elke willekeurige plaats over
      de gehele lengte van het schip, behalve ter plaatse van de schotten die de in het achterschip gelegen machinekamer
      begrenzen. De machinekamer dient te worden beschouwd als een afzonderlijke afdeling die lek kan worden;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25
  - number: 25.1.c
    text: |-
      bij olietankschepen met een lengte van niet meer dan 150 m: op elke willekeurige plaats over de gehele lengte van
      het schip tussen aangrenzende dwarsschotten, met uitzondering van de machinekamer;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25
  - number: 25.1.d
    text: |-
      aan olietankschepen met een lengte van 100 m of minder die niet aan alle criteria van het vierde lid kunnen voldoen
      zonder daarbij ingrijpend afbreuk te doen aan de bedrijfshoedanigheden van het schip, kan de inspecteur-generaal
      een verlichting van deze criteria toestaan;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25
  - number: 25.1.e
    text: |-
      ballasttoestanden, waarbij het olietankschip geen olie behalve olierestanten, in ladingtanks vervoert, behoeven
      niet in beschouwing te worden genomen.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25
  - number: '25.2'
    text: 'De volgende bepalingen met betrekking tot de overgang en de aard van de aangenomen schade zijn van toepassing:'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25
  - number: 25.2.a
    text: |-
      Beschadiging in de zijde:






                        1°. langsscheeps


                        1/3 L2/3 of 14,5 m, welke van de twee de kleinste is




                        2°. dwarsscheeps (binnenboord gemeten vanaf de scheepshuis loodrecht op het vlak van kiel en
      stevens, ter hoogte van de zomerlastlijn)


                        B/5 of 11,5 m, welke van de twee de kleinste is




                        3°. verticaal


                        vanaf de lijn van onderkant spanten op hart schip, naar boven, zonder begrenzing
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25
  - number: 25.2.b
    text: |-
      Bodem schade








                        over 0,3 L vanaf voorlood lijn van het schip


                        elk ander deel van het schip











                        1°. langsscheeps


                        1/3 L 2/3 of 14,5 m welke van de twee de kleinste is


                        1/3 L 2/3 of 5 m, welk van de twee de kleinste is




                        2°. dwarsscheeps


                        B/6 of 10 m, welke van de twee de kleinste is


                        B/6 of 5 m, welke van de twee de kleinste is




                        3°. verticaal


                        B/15 of 6 m, welke van de twee de kleinste is, gemeten van de lijn van onderkant spanten op hart
      schip


                        B/15 of 6 m, welke van de twee de kleinste is, gemeten van de lijn van onderkant spanten op hart
      schip
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25
  - number: 25.2.b
    text: |-
      Bodem schade








                        over 0,3 L vanaf voorlood lijn van het schip


                        elk ander deel van het schip











                        1°. langsscheeps


                        1/3 L 2/3 of 14,5 m welke van de twee de kleinste is


                        1/3 L 2/3 of 5 m, welk van de twee de kleinste is




                        2°. dwarsscheeps


                        B/6 of 10 m, welke van de twee de kleinste is


                        B/6 of 5 m, welke van de twee de kleinste is




                        3°. verticaal


                        B/15 of 6 m, welke van de twee de kleinste is, gemeten van de lijn van onderkant spanten op hart
      schip


                        B/15 of 6 m, welke van de twee de kleinste is, gemeten van de lijn van onderkant spanten op hart
      schip
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25
  - number: 25.2.c
    text: |-
      Indien een beschadiging van geringere omvang dan de maximale beschadiging onder *a* en *b* , een ernstiger situatie
      ten gevolge heeft, moet een dergelijke beschadiging worden aangenomen.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25
  - number: 25.2.d
    text: |-
      In gevallen waarin beschadiging aan dwarsschotten wordt verwacht, zoals bedoeld in het eerste lid, onder *a* en
      *b*, dienen waterdichte dwarsschotten, teneinde als doelmatig te kunnen worden beschouwd te worden geplaatst op een
      onderlinge afstand die ten minste gelijk is aan de lengte waarover de veronderstelde beschadiging, bedoeld onder
      *a* , zich uitstrekt. In gevallen waarin de dwarsschotten op een kleinere onderlinge afstand zijn geplaatst, worden
      binnen het beschadigde gedeelte een of meer van deze schotten geacht niet aanwezig te zijn bij het vaststellen van
      afdelingen die vol kunnen lopen.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25
  - number: 25.2.e
    text: |-
      In gevallen waarin beschadiging tussen aangrenzende waterdichte dwarsschotten wordt verwacht, zoals bedoeld in het
      eerste lid, onder *c*, wordt aangenomen dat een hoofddwarsschot of een dwarsschot dat de afscheiding vormt tussen
      zijtanks of dubbele bodemtanks niet beschadigd is, tenzij:
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25
  - number: 25.2.e.1°
    text: |-
      de aangrenzende schotten dichter bij elkaar zijn geplaatst dan de lengte waarover de veronderstelde beschadiging
      zich uitstrekt, zoals bedoeld onder *a* van dit lid, of
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25
  - number: 25.2.e.2°
    text: |-
      in een schot een nis is aangebracht of een schot trapsgewijs verspringt waarbij de lengte van de nis dan wel de
      afstand van de dwarsvlakken van trapsgewijs verspringende schotten meer bedraagt dan 3,05 m binnen het gebied
      van de veronderstelde beschadiging. De trapsgewijze verspringing van het achterpiekschot en de top van de
      achterpiektank wordt voor de toepassing van de bepalingen van dit artikel buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25
  - number: 25.2.f
    text: |-
      Indien zich binnen het gebied van de aangenomen beschadiging pijpleidingen, kokers of tunnels bevinden, dienen
      voorzieningen te worden getroffen om te voorkomen dat binnenstromend water via deze kanalen verder kan doordringen
      naar andere afdelingen dan die, welke in alle gevallen van schade worden geacht vol te lopen.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25
  - number: '25.3'
    text: 'Olietankschepen voldoen aan de criteria betreffende de stabiliteit van het schip in beschadigde toestand, indien:'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25
  - number: 25.3.a
    text: |-
      de waterlijn in de eindtoestand, rekening houdend met inzinken, slagzij en trim, niet hoger is dan de onderrand
      van alle openingen waardoor binnenstromend water verder in het schip kan doordringen. Onder deze openingen worden
      begrepen luchtpijpen en andere openingen die worden afgesloten door middel van tegen weer en wind dichte deuren
      en luiken; niet hieronder begrepen zijn mangaten en verzonken stortranden die zijn afgesloten door waterdichte,
      van pakking voorziene deksels ter handhaving van de hoge mate van waterdichtheid van het dek, op afstandbediende
      waterdichte schuifdeuren, alsmede vaste lichtranden.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25
  - number: 25.3.b
    text: |-
      in de eindtoestand na het vollopen de slagzij, ten gevolge van onsymmetrisch vollopen, niet groter is dan
      25 graden. Indien geen enkel deel van het dek is ondergedompeld is een slagzij van niet meer dan 30 graden
      aanvaardbaar.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25
  - number: 25.3.c
    text: |-
      de kromme van armen van statische stabiliteit dient een minimum bereik te hebben van 20 graden voorbij de
      evenwichtstoestand, te zamen met een resterende maximale oprichtende arm van ten minste 0,1 m binnen het bereik van
      20 graden. Daarbij dient de oppervlakte onder de kromme binnen dit bereik niet minder dan 0,0175 meter radialen te
      bedragen. Binnen bovengenoemd bereik van de kromme van armen van statische stabiliteit mogen onbeschermde openingen
      niet onder water komen, tenzij de desbetreffende ruimte wordt verondersteld vervuld te zijn geraakt. Voor openingen
      als bedoeld onder *a* en andere tegen weer en wind afsluitbare openingen is het toegestaan dat deze worden
      ondergedompeld binnen het bereik van 20 graden.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25
  - number: 25.3.d
    text: |-
      ten genoegen van de inspecteur-generaal wordt aangetoond dat de stabiliteit tijdens het vollopen steeds voldoende
      is.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25
  - number: 25.3.e
    text: |-
      Overvloeiinrichtingen waarvoor mechanische hulpmiddelen nodig zijn, zoals afsluiters of eventueel aangebrachte
      overvloeipijpen, mogen niet in aanmerking worden genomen voor het verminderen van slagzij of voor het verkrijgen
      van het minimaal vereiste bereik van de reststabiliteit teneinde te voldoen aan het bepaalde onder *a* , b en *c.*
      Gedurende alle stadia van het overvloeien dient voldoende reststabiliteit te worden gehandhaafd. Ruimten die door
      kokers van grote doorsnede zijn verbonden, kunnen als één ruimte worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25
  - number: '25.4'
    text: |-
      Er dient ten genoegen van de inspecteur-generaal met berekeningen te worden aangetoond dat aan het bepaalde in het
      eerste lid van dit artikel wordt voldaan. Hierbij moet rekening worden gehouden met de ontwerpeigenschappen van
      het schip, de indeling, ligging en inhoud van de beschadigde afdelingen, alsmede met de verdeling, het soortelijk
      gewicht en de invloed van vrije vloeistofoppervlakken. Bij de berekeningen moet worden uitgegaan van de volgende
      aannamen:
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25
  - number: 25.4.a
    text: |-
      alle lege of gedeeltelijk gevulde tanks, het soortgelijk gewicht van de vervoerde lading, alsmede elke uitstroming
      van vloeistoffen uit beschadigde afdelingen, dienen in beschouwing te worden genomen;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25
  - number: 25.4.b
    text: |-
      de volgende permeabiliteiten moeten worden aangenomen:






                        Ruimten


                        Permeabiliteit






                        bestemd voor voorraden


                        0,60




                        ingenomen door verblijven


                        0,95




                        ingenomen door machines


                        0,85




                        lege ruimte


                        0,95




                        bestemd voor verbruiksvloeistoffen


                        0-0,95 (∗1)




                        bestemd voor andere vloeistoffen


                        0-0,95 (∗1)




               (∗1) de permeabiliteit van gedeeltelijk gevulde afdelingen dient in overeenstemming te zijn met de
      hoeveelheid vloeistof die wordt vervoerd in die afdeling. Indien een met vloeistof gevulde tank wordt beschadigd,
      moet worden aangenomen dat de inhoud van de tank geheel uitstroomt en de tank vol loopt met zeewater tot een niveau
      behorend bij het vlak van evenwicht in de eindtoestand.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25
  - number: 25.4.c
    text: |-
      Het drijfvermogen van een bovenbouw die zich onmiddellijk boven de beschadigde plaats in de zijde van het schip
      bevindt, dient buiten beschouwing te worden gelaten. De niet volgelopen gedeelten van de bovenbouwen die buiten
      het beschadigde gedeelte vallen, kunnen echter wel in de beschouwing worden betrokken, mits zij van het beschadigde
      gedeelte worden gescheiden door waterdichte schotten en aan de bepalingen van het derde lid onder *a* met
      betrekking tot deze onbeschadigde ruimten is voldaan. In waterdichte schotten binnen de bovenbouw zijn waterdichte
      scharnierende deuren toegestaan.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25
  - number: 25.4.d
    text: |-
      De invloed van vrije vloeistofoppervlakken dient voor elke afdeling afzonderlijk te worden berekend bij een slagzij
      van 5 graden. de inspecteur-generaal kan eisen dan wel toestaan dat de invloed van vrije vloeistofoppervlakken in
      gedeeltelijk gevulde tanks wordt berekend bij een slagzij van meer dan 5 graden.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25
  - number: 25.4.e
    text: |-
      Bij het berekenen van de invloed van vrije vloeistofoppervlakken van verbruiksvloeistoffen dient te worden
      aangenomen dat, voor elk soort vloeistof, ten minste twee dwarsscheeps naast elkaar gelegen tanks of een middentank
      een vrije vloeistofoppervlak hebben: rekening dient te worden gehouden met de tank of combinatie van tanks waar de
      invloed van het vrije vloeistofoppervlak het grootst is.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25
  - number: '25.5'
    text: |-
      Aan boord van elk nieuw olietankschip dienen voldoende goedgekeurde gegevens ter beschikking te zijn die de
      volgende informatie verschaffen:
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25
  - number: 25.5.a
    text: |-
      gegevens betreffende het innemen en verdelen van de lading die nodig zijn om ervoor te zorgen dat aan het bepaalde
      in dit artikel wordt voldaan, en
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25
  - number: 25.5.b
    text: |-
      gegevens omtrent het vermogen van het schip om te voldoen aan de criteria betreffende de stabiliteit van het
      schip in beschadigde toestand zoals vastgesteld in dit artikel, alsmede gegevens betreffende de gevolgen van
      verlichtingen die eventueel zijn toegestaan ingevolge het bepaalde in het tweede lid onder *d*.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25
  - number: 25a.1
    text: 'Dit artikel is van toepassing op olietankschepen met een draagvermogen van 5000 tonmassa of meer:'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25a
  - number: 25a.1.a
    text: waarvoor het bouwcontract is gesloten op of na 1 februari 1999;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25a
  - number: 25a.1.b
    text: |-
      waarvan, bij het ontbreken van een bouwcontract, de kiel is gelegd of waarvan de bouw zich in een soortgelijk
      stadium bevindt op of na 1 augustus 1999;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25a
  - number: 25a.1.c
    text: waarvan de oplevering op of na 1 februari 2002 heeft plaatsgevonden; of
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25a
  - number: 25a.1.d
    text: 'die een belangrijke verbouwing hebben ondergaan:'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25a
  - number: 25a.1.d.1°
    text: waarvoor het contract is gesloten na 1 februari 1999;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25a
  - number: 25a.1.d.2°
    text: waarvan, bij het ontbreken van een contract, de verbouwing na 1 augustus 1999 is begonnen; of
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25a
  - number: 25a.1.d.3°
    text: die na 1 februari 2002 is voltooid.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25a
  - number: 25a.2
    text: |-
      Elk olietankschip voldoet, voor zover van toepassing, bij elke bedrijfsmatig voorkomende diepgang onder de meest
      ongunstige omstandigheden van beladen, ballasten of combinaties daarvan, verenigbaar met een goede bedrijfsvoering,
      met inbegrip van de tussenliggende fasen van vloeistofverplaatsing, aan de bepalingen voor stabiliteit in
      onbeschadigde toestand, genoemd in het vierde en vijfde lid.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25a
  - number: 25a.3
    text: |-
      Bij alle beladingstoestanden worden vrije vloeistofoppervlakken in de ballasttanks verondersteld en in de
      berekeningen betrokken.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25a
  - number: 25a.4
    text: |-
      Indien het schip zich in de haven bevindt, is de aanvangsmetacenterhoogte (GM), gecorrigeerd voor de invloed van
      vrije vloeistofoppervlakken bij een helling van 0 graden, ten minste 0,15 meter.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25a
  - number: 25a.5
    text: 'Indien het schip zich op zee bevindt gelden de volgende bepalingen:'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25a
  - number: 25a.5.1
    text: |-
      De dynamische weg bij een helling van 30 graden is ten minste 0,055 meterradialen en bij een helling van 40 graden
      of bij een andere helling waarbij het schip vervuld raakt (Φ) indien deze kleiner is dan 40 graden, niet minder dan
      0,09 meterradialen. voorts is de toename van de dynamische weg tussen een helling van 30 graden en een helling van
      40 graden of de helling (Φ) indien deze kleiner is dan 40 graden, niet minder dan 0,03 meterradialen. de helling
      waarbij een schip vervuld raakt (Φ) is de helling waarbij openingen in de romp, de bovenbouwen of dekhuizen die
      niet waterdicht kunnen worden afgesloten, onder water komen, met dien verstande dat bij de toepassing van dit
      criterium kleine openingen waar doorheen, naar het oordeel van de inspecteur-generaal, binnenstromend water niet
      verder het schip kan binnendringen, niet als open behoeven te worden beschouwd;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25a
  - number: 25a.5.2
    text: de arm van statische stabiliteit bedraagt ten minste 0,20 meter bij een helling van 30 graden of meer;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25a
  - number: 25a.5.3
    text: |-
      de maximale waarde van de armen van statische stabiliteit wordt bij voorkeur bereikt bij een helling van ten minste
      30 graden, doch in geen geval bij een helling van minder dan 25 graden; en
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25a
  - number: 25a.5.4
    text: |-
      de aanvangsmetacenterhoogte (GM), gecorrigeerd voor de invloed van vrije vloeistofoppervlakken bij 0 graden
      helling, is ten minste 0,15 meter.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25a
  - number: 25a.6
    text: |-
      In het ontwerp van een olietankschip worden de stabiliteitscriteria, bedoeld in het vierde en vijfde lid, in acht
      genomen.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25a
  - number: 25a.7
    text: |-
      Voor combinatietankschepen kunnen eenvoudige aanvullende operationele procedures voor vloeistofverplaatsing worden
      toegepast, die aan de kapitein schriftelijk ter beschikking worden gesteld en die:
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25a
  - number: 25a.7.1°
    text: ten aanzien van Nederlandse schepen door de inspecteur-generaal zijn goedgekeurd;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25a
  - number: 25a.7.2°
    text: |-
      aangeven in welke lading- en ballasttanks, onder alle van toepassing zijnde toestanden van vloeistofverplaatsing
      en de voorkomende soortelijke massa's van de lading, vrije vloeistofoppervlakken mogen voorkomen waarbij aan de
      stabiliteitscriteria, bedoeld in het vierde en vijfde lid, wordt voldaan. Deze tanks behoeven niet steeds dezelfde
      te zijn tijdens de vloeistofverplaatsing en elke combinatie is toegestaan, mits aan de stabiliteitscriteria,
      bedoeld in het vierde en vijfde lid, wordt voldaan;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25a
  - number: 25a.7.3°
    text: duidelijk en begrijpelijk zijn voor de dienstdoende officier, belast met de vloeistofverplaatsing;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25a
  - number: 25a.7.4°
    text: voorzien in een vastgestelde volgorde van operaties waarbij lading, ballast dan wel beide worden verplaatst;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25a
  - number: 25a.7.5°
    text: |-
      de mogelijkheid bieden vergelijkingen te maken tussen de verkregen en vereiste stabiliteit door middel van
      stabiliteitsgegevens in grafische of tabelvorm;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25a
  - number: 25a.7.6°
    text: geen uitgebreide wiskundige berekeningen vereisen van de officier, bedoeld in 3°;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25a
  - number: 25a.7.7°
    text: |-
      voorzien in corrigerende handelingen, te verrichten door de officier, bedoeld in 3°, in geval van afwijking van de
      aanbevolen waarden en in noodsituaties; en
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25a
  - number: 25a.7.8°
    text: |-
      nadrukkelijk worden weergegeven in het goedgekeurde trim- en stabiliteitsboekje en in de lading- en
      ballastcontrolekamer en in alle computersoftware waarmee stabiliteitsberekeningen worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel25a
  - number: '26.1'
    text: |-
      Elk olietankschip met een tonnage van 150 of meer en elk schip dat geen olietankschip is, met een tonnage van 400
      of meer, heeft een goedgekeurd scheepsnoodplan voor olieverontreiniging aan boord.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel26
  - number: '26.2'
    text: 'Een scheepsnoodplan voor olieverontreiniging bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel26
  - number: 26.2.a
    text: |-
      de procedure die de kapitein of een ander bemanningslid dat de leiding van het schip heeft, moet volgen voor het
      melden van een voorval van olieverontreiniging;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel26
  - number: 26.2.b
    text: een lijst van autoriteiten of personen aan wie een voorval van olieverontreiniging moet worden gemeld;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel26
  - number: 26.2.c
    text: |-
      een gedetailleerde beschrijving van de maatregelen welke de bemanning onmiddellijk moet nemen om de uitstroom van
      olie ten gevolge van een voorval zoveel mogelijk te beperken;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel26
  - number: 26.2.d
    text: |-
      de procedure en contactpersoon aan boord van het schip voor het coördineren van de maatregelen aan boord met
      nationale en plaatselijke autoriteiten bij het bestrijden van een olieverontreiniging.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel26
  - number: '26.3'
    text: |-
      Een schip waarop
      __REF000___________________________________________________________________________________________________________
      _______ naast dit artikel van toepassing is, mag het scheepsnoodplan voor olieverontreinigingen combineren met het
      scheepsnoodplan voor verontreiniging van de zee door schadelijke vloeistoffen, bedoeld in [dat artikel][ref2]. In
      dat geval is de titel van het plan: scheepsnoodplan voor verontreiniging van de zee.


      [ref1]: https://wetten.overheid.nl/BWBR0004306#Artikel14A
      [ref2]: https://wetten.overheid.nl/BWBR0004306#Artikel14A
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004306
        artikel: 14A
      - id: ref2
        bwb_id: BWBR0004306
        artikel: 14A
  - number: 26a
    text: |-
      Ter uitvoering van internationale afspraken en besluiten van volkenrechtelijke organisaties over voorkoming van
      olieverontreiniging door schepen kunnen bij ministeriële regeling nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel26a
  - number: 26b.1
    text: |-
      [Artikel 2a, eerste lid, onderdeel a][ref1], is gedurende een termijn van twee jaar niet van toepassing op
      uitrusting die ingevolge een besluit van een of meer van de instellingen van de Europese Unie in bijlage A.1/2 is
      opgenomen indien die uitrusting:


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel2a
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: 2a
        hoofdstuk: I
  - number: 26b.1.a
    text: |-
      is vervaardigd voor de dag waarop het desbetreffende wijzigingsbesluit voor de toepassing van dit besluit is gaan
      gelden, en
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel26b
  - number: 26b.1.b
    text: |-
      is goedgekeurd op grond van regels gesteld bij of krachtens de [Wet voorkoming verontreiniging door schepen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003642
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0003642
  - number: 26b.2
    text: 'De in het eerste lid bedoelde termijn vangt aan:'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel26b
  - number: 26b.2.a
    text: |-
      voor uitrusting die van bijlage A.2 naar bijlage A.1/2 is overgeschreven op het tijdstip waarop ingevolge artikel
      7, zesde lid, jo. artikel 5 van [richtlijn nr. 96/98/EG](31996L0098) de overschrijving van kracht wordt;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel26b
  - number: 26b.2.b
    text: |-
      voor uitrusting die in bijlage A.1/2 is opgenomen en niet voordien reeds in bijlage A.2/2 was opgenomen op het in
      het desbetreffende wijzigingsbesluit van een of meer van de instellingen van de Europese Unie bepaalde tijdstip.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel26b
  - number: 26c
    text: |-
      Een wijziging van [richtlijn nr. 96/98/EG](31996L0098) gaat voor de toepassing van dit besluit gelden met ingang
      van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel
      besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel26c
  - number: '27.1'
    text: |-
      De inspecteur-generaal kan, indien bijzondere omstandigheden daartoe nopen, onverminderd
      [artikel 2a, eerste en tweede lid][ref1] geheel of gedeeltelijk ontheffing verlenen van de bij of krachtens dit
      besluit gestelde regelen met betrekking tot de bouw, inrichting of uitrusting van een schip.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel2a
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: 2a
        hoofdstuk: I
  - number: '27.2'
    text: |-
      Indien een ontheffing als bedoeld in het eerste lid wordt verleend aan een schip dat een certificaat behoeft als
      bedoeld in [artikel 5][ref1], dient daarvan aantekening te worden gemaakt op het certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel5
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '5'
        hoofdstuk: I
  - number: '28'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel28
  - number: '29'
    text: Dit besluit kan worden aangehaald als "Besluit voorkoming olieverontreiniging door schepen".
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel29
