        artikel: 13A
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003936
        artikel: 13B
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0003936
        artikel: 13C
        hoofdstuk: II
      - id: ref5
