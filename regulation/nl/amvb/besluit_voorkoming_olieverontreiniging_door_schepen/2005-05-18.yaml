---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_voorkoming_olieverontreiniging_door_schepen
regulatory_layer: AMVB
publication_date: '2004-10-07'
valid_from: '2005-05-18'
bwb_id: BWBR0003936
url: https://wetten.overheid.nl/BWBR0003936/2005-05-18
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Ministers van Verkeer en Waterstaat en van Volkshuisvesting, Ruimtelijke Ordening en
    Milieubeheer van 17 juni 1985, nr. PJ/S-30.956, Directoraat-Generaal Scheepvaart en Maritieme Zaken;

    Overwegende dat het noodzakelijk is uitvoering te geven aan de bepalingen van Bijlage I van het Internationaal
    Verdrag ter voorkoming van verontreiniging door schepen met Protocollen en Bijlagen met Aanhangsels ( Trb. 1975,
    147 en 1978, 187), zoals gewijzigd en aangevuld bij het op 17 februari 1978 te Londen tot stand gekomen Protocol
    bij dat Verdrag met Bijlage en Aanhangsels (Trb. 1978, 188);

    Gelet op de artikelen 1, onder e, 4, 5, 6, 7, 8, 10, 11, 35, 38 en 39 van de Wet voorkoming verontreiniging door
    schepen, (Stb. 1983, 683);

    De Raad van State gehoord (advies van 17 december 1985, no. W09.85.0334/16.5.51);

    Gezien het nader rapport van Onze Ministers van Verkeer en Waterstaat en van Volkshuisvesting, Ruimtelijke Ordening
    en Milieubeheer van 12 maart 1986, nr. PJ/S 30462, Directoraat-Generaal Scheepvaart en Maritieme Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop rustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.a
    text: |-
      olie: minerale olie in elke vorm, daaronder begrepen ruwe olie, stookolie, oliedrab, olieafval en geraffineerde
      produkten, andere dan die petrochemische produkten welke zijn begrepen onder de bepalingen van het
      [Besluit voorkoming verontreiniging door met schepen in bulk vervoerde schadelijke vloeistoffen][ref1] (*Stb.*
      1988, 112);


      [ref1]: https://wetten.overheid.nl/BWBR0004306
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004306
  - number: 1.1.b
    text: 'oliehoudend mengsel: een mengsel dat olie bevat in elk gehalte;'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.c
    text: |-
      brandstofolie: elke olie die wordt gebruikt als brandstof voor de voortstuwings- en hulpwerktuigen van het schip
      dat die olie aan boord heeft;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.d
    text: |-
      olietankschip: een schip dat is gebouwd voor of aangepast aan voornamelijk het vervoer van olie in bulk in zijn
      laadruimten, daaronder begrepen combinatietankschepen en elk chemicaliëntankschip indien dit schip een gehele of
      gedeeltelijke lading olie in bulk vervoert;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.e
    text: 'combinatietankschip: een schip ingericht voor het vervoer van afwisselend olie of stortladingen;'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.f
    text: 'nieuw schip:'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.f.1°
    text: een schip waarvoor het bouwcontract is gesloten na 31 december 1975; of,
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.f.2°
    text: |-
      indien geen bouwcontract is gesloten, een schip waarvan de kiel is gelegd of waarvan de bouw zich in een
      soortgelijk stadium bevindt na 30 juni 1976; of
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.f.3°
    text: een schip waarvan de oplevering na 31 december 1979 heeft plaatsgevonden; of
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.f.4°
    text: 'een schip dat een belangrijke verbouwing heeft ondergaan:'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.f.4°.(i)
    text: waarvoor het contract is gesloten na 31 december 1975; of
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.f.4°.(ii)
    text: waarvan, indien geen contract is gesloten, de verbouwing na 30 juni 1976 is begonnen; of
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.f.4°.(iii)
    text: welke na 31 december 1979 is voltooid;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.g
    text: 'bestaand schip: een schip geen nieuw schip zijnde;'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.h.1°
    text: 'belangrijke verbouwing: de verbouwing van een bestaand schip:'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.h.1°.(i)
    text: waardoor de afmetingen of het laadvermogen van het schip in belangrijke mate worden gewijzigd; of
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.h.1°.(ii)
    text: waardoor het scheepstype wordt gewijzigd; of
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.h.1°.(iii)
    text: |-
      welke naar het oordeel van de inspecteur-generaal voornamelijk is gericht op het verlengen van de levensduur van
      het schip; of
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.h.1°.(iv)
    text: |-
      waardoor anderszins het schip zodanig verandert, dat het, indien het een nieuw schip betrof, daardoor zou zijn
      onderworpen aan de bepalingen van dit besluit, waaraan het als bestaand schip niet zou zijn onderworpen.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.h.2°
    text: |-
      ongeacht het bepaalde onder 1° wordt een verbouwing van een bestaand olietankschip met een draagvermogen van 20.000
      tonmassa of meer, teneinde te voldoen aan de bepalingen van [artikel 13][ref1], niet beschouwd als een belangrijke
      verbouwing in de zin van dit besluit;


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel13
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '13'
        hoofdstuk: II
  - number: 1.1.h.3°
    text: |-
      ongeacht het bepaalde onder 1° wordt een verbouwing van een bestaand olietankschip, teneinde te voldoen aan de
      bepalingen van [artikel 13F][ref1] of [13G][ref2], niet beschouwd als een belangrijke verbouwing in de zin van
      dit besluit;


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel13F
      [ref2]: https://wetten.overheid.nl/BWBR0003936#Artikel13G
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: 13F
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003936
        artikel: 13G
        hoofdstuk: II
  - number: 1.1.i
    text: |-
      van het dichtstbijzijnde land: van de basislijn van waaruit de territoriale zee van het betrokken gebied wordt
      bepaald overeenkomstig het internationale recht, behoudens dat voor de toepassing van dit besluit "van het
      dichtstbijzijnde land" onder de noordoostkust van Australië betekent: van een lijn getrokken van een punt op de
      kust van Australië gelegen op 11°00' zuiderbreedte en 142°08' oosterlengte, naar een punt op 10°35' zuiderbreedte
      en 141°55' oosterlengte, vandaar naar een punt op 10°00' zuiderbreedte en 142°00' oosterlengte, vandaar naar
      een punt op 9°10' zuiderbreedte en 143°52' oosterlengte, vandaar naar een punt op 9°00' zuiderbreedte en
      144°30' oosterlengte, vandaar naar een punt op 13°00' zuiderbreedte en 144°00' oosterlengte, vandaar naar een
      punt op 15°00' zuiderbreedte en 146°00' oosterlengte, vandaar naar een punt op 18°00' zuiderbreedte en 147°00'
      oosterlengte, vandaar naar een punt op 21°00' zuiderbreedte en 153°00' oosterlengte, vandaar naar een punt op de
      kust van Australië op 24°42' zuiderbreedte en 153°15' oosterlengte;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.j
    text: |-
      bijzonder gebied: een zeegebied waarbinnen het volgen van bijzondere in dit besluit voorgeschreven methoden ter
      voorkoming van verontreiniging van de zee door olie is vereist. Onder deze bijzondere gebieden worden begrepen de
      gebieden genoemd in [artikel 10][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel10
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '10'
        hoofdstuk: II
  - number: 1.1.k
    text: |-
      tank: een besloten ruimte gevormd door de permanente scheepsconstructie, en ontworpen voor het vervoer van
      vloeistoffen in bulk;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.l
    text: 'zijtank: een tank grenzend aan de huidbeplating van het schip in de zijde;'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.m
    text: 'middentank: een tank in de zijden begrensd door langsschotten;'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.n
    text: |-
      sloptank: een tank speciaal bestemd voor de opslag van olierestanten en waswater uit de tanks en van andere
      oliehoudende mengsels;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.o
    text: |-
      schone ballast: de ballast in een tank die, nadat er voor de laatste maal olie in werd vervoerd, zodanig is
      gereinigd dat de ballast daaruit afkomstig, indien geloosd uit een schip, dat stil ligt in schoon rustig water
      op een heldere dag, geen zichtbare oliesporen achterlaat op het wateroppervlak of op aangrenzende kusten, noch
      oliedrab of emulsie veroorzaakt welke zich onder het wateroppervlak of op de aangrenzende kusten zal afzetten.
      Onder schone ballast wordt mede verstaan de ballast, geloosd via een goedgekeurd bewakings- en regelsysteem voor
      olielozing, waarvan volgens dit systeem het oliegehalte van het mengsel niet hoger ligt dan 15 delen per miljoen,
      niettegenstaande de aanwezigheid van zichtbare oliesporen.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.p
    text: |-
      gescheiden ballast: ballastwater dat wordt ingenomen in een tank die volledig is gescheiden van het ladingolie- en
      brandstofoliesysteem en die blijvend is bestemd voor het vervoer van ballastwater of voor het vervoer van ballast
      of ladingen andere dan olie en overige schadelijke stoffen;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.q
    text: |-
      lengte (L): 96 percent van de lengte van de lastlijn op 85 percent van de kleinste holte naar de mal gemeten
      vanaf de bovenzijde van de kielplaat, dan wel de lengte van de voorzijde van de voorsteven tot aan de hartlijn
      van de roerkoning op deze lastlijn gemeten, indien deze laatste lengte groter is. Bij schepen die met stuurlast
      zijn ontworpen, moet de lastlijn waarop deze lengte wordt gemeten, evenwijdig aan de constructiewaterlijn worden
      genomen;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.r
    text: |-
      de voorloodlijn en de achterloodlijn: de loodlijnen op het voorste en achterste punt van de lengte (L). De
      voorloodlijn moet getrokken worden door het snijpunt van de lastlijn waarop de lengte (L) is gemeten en de
      voorzijde van de voorsteven;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.s
    text: 'midscheeps: het midden van de lengte (L);'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.t
    text: |-
      breedte (B): de grootste breedte van het schip midscheeps gemeten op de buitenkant van de spanten bij een schip met
      een metalen huid en op de buitenkant van de romp bij een schip met een huid van ander materiaal;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.u
    text: |-
      draagvermogen (DWT): het verschil tussen de massa van het deplacement van een schip liggende op zijn zomerlastlijn
      in water met een dichtheid van 1,025 t/m3 en de massa van het lege schip, uitgedrukt in tonmassa;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.v
    text: |-
      massa van het lege schip: de massa van het deplacement van een schip, zonder lading, brandstof, smeerolie,
      ballastwater, zoetwater en ketelvoedingwater in tanks, verbruiksvoorraden, passagiers en bemanning en hun
      bezittingen, uitgedrukt in tonmassa;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.w
    text: |-
      permeabiliteit van een ruimte: de verhouding tussen het volume binnen die ruimte dat wordt geacht door water te
      worden ingenomen en het totale volume van die ruimte;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.x
    text: |-
      inhouden en oppervlakten in een schip: de inhouden en oppervlakten berekend tot buitenkant spanten en
      verstijvingen;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.y
    text: |-
      ruwe olie: elk vloeibaar koolwaterstofmengsel dat in natuurlijke staat in de aarde voorkomt en al dan niet
      behandeld is om het geschikt te maken voor het transport, en dat tevens omvat:
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.y.1°
    text: ruwe olie waaruit bepaalde lichte fracties kunnen zijn verwijderd; en
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.y.2°
    text: ruwe olie waaraan bepaalde lichte fracties kunnen zijn toegevoegd;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.z
    text: 'ruwe olietankschip: een olietankschip gebruikt voor het vervoer van ruwe olie;'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.aa
    text: 'produktentankschip: een olietankschip gebruikt voor het vervoer van olie, geen ruwe olie zijnde;'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.bb
    text: |-
      chemicaliëntankschip: een schip dat is gebouwd voor of aangepast aan voornamelijk het vervoer in bulk van
      schadelijke vloeistoffen geen olie zijnde;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.cc
    text: 'goedgekeurd: door de inspecteur-generaal goedgekeurd.'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.dd
    text: |-
      tonnage: bruto-tonnage als bedoeld in de [Meetbrievenwet 1981][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003378
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003378
  - number: 1.1.ee
    text: |-
      gesloten tankwassysteem: een zodanig tankwassysteem dat, wanneer de sloptank of tanks eenmaal zijn voorzien van
      waswater, dit waswater voldoende is voor tankwassen en, indien van toepassing, ter voorziening van aandrijfwater
      voor ejecteurs, zonder toevoegen van extra water in het systeem;
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.ff
    text: |-
      verjaardatum: de datum van afgifte van het eerste certificaat, bedoeld in [artikel 5][ref1], in elk kalenderjaar,
      volgend op het jaar waarin dit certificaat is afgegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel5
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '5'
        hoofdstuk: I
  - number: 1.1.gg
    text: |-
      [richtlijn nr. 96/98/EG](31996L0098): [richtlijn nr. 96/98/EG](31996L0098) van de Raad van de Europese Unie van 20
      december 1996 inzake uitrusting van zeeschepen (PbEG 1997, L 46);
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.1.hh
    text: |-
      bijlage A.1/2: bijlage A.1/2 van [richtlijn nr. 96/98/EG](31996L0098), voorzover het uitrusting betreft waarop dit
      besluit van toepassing is.
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.2.a
    text: |-
      Ongeacht het bepaalde onder f van het eerste lid, wordt voor de toepassing van [de artikelen 13][ref1],
      [13 B][ref2], [13 E][ref3] en [18, vierde lid][ref4], onder een "nieuw olietankschip" verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003936#Artikel13B
      [ref3]: https://wetten.overheid.nl/BWBR0003936#Artikel13E
      [ref4]: https://wetten.overheid.nl/BWBR0003936#Artikel18
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: '13'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003936
        artikel: 13B
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003936
        artikel: 13E
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0003936
        artikel: '18'
        hoofdstuk: II
  - number: 1.2.a.1°
    text: een olietankschip waarvoor het bouwcontract is gesloten na 1 juni 1979; of
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.2.a.2°
    text: |-
      indien geen bouwcontract is gesloten, een olietankschip waarvan de kiel is gelegd of waarvan de bouw zich in een
      soortgelijk stadium bevindt na 1 januari 1980; of
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.2.a.3°
    text: een olietankschip waarvan de oplevering na 1 juni 1982 plaatsvindt; of
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.2.a.4°
    text: 'een olietankschip dat een belangrijke verbouwing heeft ondergaan:'
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.2.a.4°.(i)
    text: waarvoor het contract is gesloten na 1 juni 1979; of
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.2.a.4°.(ii)
    text: waarvan, indien geen contract is gesloten de verbouwing na 1 januari 1980 is begonnen; of
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
  - number: 1.2.a.4°.(iii)
    text: |-
      welke na 1 juni 1982 is voltooid, met dien verstande dat voor olietankschepen met een draagvermogen van
      70 000 tonmassa of meer de omschrijving onder *f* van het eerste lid van toepassing is met betrekking tot
      [het tweede lid van artikel 13.][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel13B
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003936
        artikel: 13B
        hoofdstuk: II
  - number: 1.2.b
    text: |-
      Ongeacht het bepaalde onder *g* van het eerste lid, wordt voor de toepassing van de [artikelen 13][ref1],
      [13 A][ref2], [13 B][ref3], [13 C][ref4], [13 D][ref5] en [18, vijfde lid en zesde lid onder c][ref6], onder een
      "bestaand olietankschip" verstaan een olietankschip, geen nieuw olietankschip zijnde, als omschreven onder *a*;


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003936#Artikel13A
      [ref3]: https://wetten.overheid.nl/BWBR0003936#Artikel13B
      [ref4]: https://wetten.overheid.nl/BWBR0003936#Artikel13C
      [ref5]: https://wetten.overheid.nl/BWBR0003936#Artikel13D
      [ref6]: https://wetten.overheid.nl/BWBR0003936#Artikel18
    url: https://wetten.overheid.nl/BWBR0003936/2005-05-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003936
