  - number: '13'
    text: |-
      1 Behoudens het bepaalde in de [artikelen 13 C][ref1] en [13 D][ref2], dienen olietankschepen te voldoen aan de
      bepalingen van dit artikel.

      2 Nieuwe olietankschepen met een draagvermogen van 20.000 tonmassa of meer dienen aan het onderstaande te voldoen:

      a. Elk nieuw ruwe olietankschip met een draagvermogen van 20.000 tonmassa of meer en elk nieuw produktentankschip
      met een draagvermogen van 30.000 tonmassa of meer dient te zijn voorzien van gescheiden ballasttanks en te voldoen
      aan het bepaalde onder b, c en d of, indien toepasselijk, aan het bepaalde onder e.

      b. De capaciteit van de gescheiden ballasttanks dient zodanig te zijn dat het schip veilig kan varen tijdens
      ballastreizen, zonder dat, behoudens het bepaalde onder c en d, voor het benodigde ballastwater gebruik behoeft te
      worden gemaakt van ladingtanks. Echter dient in alle gevallen de gezamenlijke inhoud van de gescheiden ballasttanks
      ten minste zodanig te zijn, dat gedurende elk deel van de reis in elke ballasttoestand - met inbegrip van de
      toestand van leeg schip plus uitsluitend gescheiden ballast - de diepgang en trim van het schip aan elk van de
      volgende voorwaarden kunnen voldoen:

      1°. de diepgang naar de mal (dm) midscheeps gemeten in meters zonder rekening te houden met enige vervorming van
      het schip dient niet minder te zijn dan:

      dm = 2.0 + 0.02 L

      2°. de diepgangen op de voor- en achterloodlijn dienen overeen te komen met de diepgang midscheeps (dm), als
      bepaald onder 1° van dit lid, in samenhang met een stuurlast van niet meer dan 0,015 L; en

      3°. de diepgang op de achterloodlijn dient in geen geval minder te zijn dan noodzakelijk is voor de volledige
      onderdompeling van de schroef (schroeven).

      c. In geen geval mag ballastwater in ladingtanks worden vervoerd, behalve:

      1°. in het bijzondere geval dat de weersomstandigheden dermate slecht zijn dat, naar het oordeel van de kapitein,
      de veiligheid van het schip vereist dat er extra ballastwater in ladingtanks wordt vervoerd; of

      2°. in de uitzonderlijke gevallen waarbij de bijzondere aard van de bedrijfsvoering van een olietankschip het
      noodzakelijk maakt dat er extra ballastwater in ladingtanks wordt vervoerd.

      d. Het extra ballastwater dient te worden behandeld en geloosd overeenkomstig het bepaalde in de
      [artikelen 9][ref3] en [15][ref4], tevens dient daarvan aantekening te worden gehouden in het oliejournaal, bedoeld
      in [artikel 20][ref5]. Ten aanzien van het bepaalde in onderdeel *c*, onder 2°, kunnen door het Hoofd van de
      Scheepvaartinspectie nadere voorschriften worden gegeven.

      e. In afwijking van het bepaalde onder *b* , dient de capaciteit van de gescheiden ballasttanks van een
      olietankschip met een lengte van minder dan 150 m, ten genoegen van het Hoofd van de Scheepvaartinspectie te zijn.

      f. Elk nieuw ruwe olietankschip met een draagvermogen van 20.000 tonmassa of meer dient te zijn uitgerust met een
      installatie voor het schoonmaken van de ladingtanks door middel van het wassen met ruwe olie. Deze installatie
      moet geheel voldoen aan het bepaalde in [artikel 13 B][ref6], één jaar nadat het tankschip voor het eerst voor het
      vervoer van ruwe olie is gebezigd, dan wel aan het einde van de derde reis gemaakt met een ruwe olie geschikt voor
      deze wasmethode waarbij de langste periode bepalend is.

      g. De installatie dient te worden gebruikt in overeenstemming met het bepaalde in [artikel 13 B][ref7], tenzij het
      olietankschip een ruwe olie vervoert die niet geschikt is voor de wasmethode met ruwe olie.

      3 Behoudens het bepaalde in het vierde moet elk bestaand ruwe olietankschip van 40.000 tonmassa draagvermogen of
      meer zijn voorzien van gescheiden ballasttanks en voldoen aan het bepaalde in het tweede lid, onder *b* en *c*.

      4 Bestaande ruwe olietankschepen als bedoeld in het derde lid mogen, indien zij bestemd zijn voor het vervoer
      van ruwe olie geschikt voor de ruwe oliewasmethode, deze methode in overeenstemming met het bepaalde van
      [artikel 13 B][ref8] toepassen, in plaats van te zijn voorzien van gescheiden ballasttanks.

      5 Elk bestaand produktentankschip met een draagvermogen van 40.000 tonmassa of meer dient te zijn voorzien van
      gescheiden ballasttanks en te voldoen aan het bepaalde in het tweede lid, onder *b* en *c*, dan wel de methode van
      aangewezen schone ballasttanks te gebruiken in overeenstemming met het bepaalde in [artikel 13 A][ref9].

      6 Elk olietankschip dat niet behoeft te zijn voorzien van gescheiden ballasttanks in overeenstemming met het tweede
      lid, onder *a*, derde of vijfde lid, kan echter worden aangemerkt als een olietankschip met gescheiden ballasttanks
      indien het schip voldoet aan het bepaalde in het tweede lid, onder *b, c* en *e*.


