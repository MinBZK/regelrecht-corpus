$id: besluit_voorkoming_olieverontreiniging_door_schepen
regulatory_layer: AMVB
publication_date: '2004-10-07'
valid_from: '2004-10-15'
bwb_id: BWBR0003936
url: https://wetten.overheid.nl/BWBR0003936/2004-10-15
preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Ministers van Verkeer en Waterstaat en van Volkshuisvesting, Ruimtelijke Ordening en
    Milieubeheer van 17 juni 1985, nr. PJ/S-30.956, Directoraat-Generaal Scheepvaart en Maritieme Zaken;


    Overwegende dat het noodzakelijk is uitvoering te geven aan de bepalingen van Bijlage I van het Internationaal
    Verdrag ter voorkoming van verontreiniging door schepen met Protocollen en Bijlagen met Aanhangsels ( Trb. 1975,
    147 en 1978, 187), zoals gewijzigd en aangevuld bij het op 17 februari 1978 te Londen tot stand gekomen Protocol
    bij dat Verdrag met Bijlage en Aanhangsels (Trb. 1978, 188);


    Gelet op de artikelen 1, onder e, 4, 5, 6, 7, 8, 10, 11, 35, 38 en 39 van de Wet voorkoming verontreiniging door
    schepen, (Stb. 1983, 683);


    De Raad van State gehoord (advies van 17 december 1985, no. W09.85.0334/16.5.51);


    Gezien het nader rapport van Onze Ministers van Verkeer en Waterstaat en van Volkshuisvesting, Ruimtelijke Ordening
    en Milieubeheer van 12 maart 1986, nr. PJ/S 30462, Directoraat-Generaal Scheepvaart en Maritieme Zaken;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003936/2004-10-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop rustende bepalingen wordt verstaan onder:

      a. olie: minerale olie in elke vorm, daaronder begrepen ruwe olie, stookolie, oliedrab, olieafval en
      geraffineerde produkten, andere dan die petrochemische produkten welke zijn begrepen onder de bepalingen van het
      [Besluit voorkoming verontreiniging door met schepen in bulk vervoerde schadelijke vloeistoffen][ref1] (*Stb.*
      1988, 112);

      b. oliehoudend mengsel: een mengsel dat olie bevat in elk gehalte;

      c. brandstofolie: elke olie die wordt gebruikt als brandstof voor de voortstuwings- en hulpwerktuigen van het schip
      dat die olie aan boord heeft;

      d. olietankschip: een schip dat is gebouwd voor of aangepast aan voornamelijk het vervoer van olie in bulk in zijn
      laadruimten, daaronder begrepen combinatietankschepen en elk chemicaliëntankschip indien dit schip een gehele of
      gedeeltelijke lading olie in bulk vervoert;

      e. combinatietankschip: een schip ingericht voor het vervoer van afwisselend olie of stortladingen;

      f. nieuw schip:

      1°. een schip waarvoor het bouwcontract is gesloten na 31 december 1975; of,

      2°. indien geen bouwcontract is gesloten, een schip waarvan de kiel is gelegd of waarvan de bouw zich in een
      soortgelijk stadium bevindt na 30 juni 1976; of

      3°. een schip waarvan de oplevering na 31 december 1979 heeft plaatsgevonden; of

      4°. een schip dat een belangrijke verbouwing heeft ondergaan:

      (i). waarvoor het contract is gesloten na 31 december 1975; of

      (ii). waarvan, indien geen contract is gesloten, de verbouwing na 30 juni 1976 is begonnen; of

      (iii). welke na 31 december 1979 is voltooid;

      g. bestaand schip: een schip geen nieuw schip zijnde;

      h. 1°. belangrijke verbouwing: de verbouwing van een bestaand schip:

      (i). waardoor de afmetingen of het laadvermogen van het schip in belangrijke mate worden gewijzigd; of

      (ii). waardoor het scheepstype wordt gewijzigd; of

      (iii). welke naar het oordeel van het Hoofd van de Scheepvaartinspectie voornamelijk is gericht op het verlengen
      van de levensduur van het schip;

      of

      (iv). waardoor anderszins het schip zodanig verandert, dat het, indien het een nieuw schip betrof, daardoor zou
      zijn onderworpen aan de bepalingen van dit besluit, waaraan het als bestaand schip niet zou zijn onderworpen.

      2°. ongeacht het bepaalde [onder 1°][ref2] wordt een verbouwing van een bestaand olietankschip met een
      draagvermogen van 20.000 tonmassa of meer, teneinde te voldoen aan de bepalingen van [artikel 13][ref3], niet
      beschouwd als een belangrijke verbouwing in de zin van dit besluit;

      3°. ongeacht het bepaalde [onder 1°][ref4] wordt een verbouwing van een bestaand olietankschip, teneinde te
      voldoen aan de bepalingen van [artikel 13F][ref5] of [13G][ref6], niet beschouwd als een belangrijke verbouwing in
      de zin van dit besluit;

      i. van het dichtstbijzijnde land: van de basislijn van waaruit de territoriale zee van het betrokken gebied
      wordt bepaald overeenkomstig het internationale recht, behoudens dat voor de toepassing van dit besluit "van het
      dichtstbijzijnde land" onder de noordoostkust van Australië betekent: van een lijn getrokken van een punt op de
      kust van Australië gelegen op

      11°00' zuiderbreedte en 142°08' oosterlengte, naar een punt op 10°35' zuiderbreedte en 141°55' oosterlengte,

      vandaar naar een punt op 10°00' zuiderbreedte en 142°00' oosterlengte,

      vandaar naar een punt op 9°10' zuiderbreedte en 143°52' oosterlengte,

      vandaar naar een punt op 9°00' zuiderbreedte en 144°30' oosterlengte,

      vandaar naar een punt op 13°00' zuiderbreedte en 144°00' oosterlengte,

      vandaar naar een punt op 15°00' zuiderbreedte en 146°00' oosterlengte,

      vandaar naar een punt op 18°00' zuiderbreedte en 147°00' oosterlengte,

      vandaar naar een punt op 21°00' zuiderbreedte en 153°00' oosterlengte,

      vandaar naar een punt op de kust van Australië op 24°42' zuiderbreedte en 153°15' oosterlengte;

      j. bijzonder gebied: een zeegebied waarbinnen het volgen van bijzondere in dit besluit voorgeschreven methoden ter
      voorkoming van verontreiniging van de zee door olie is vereist. Onder deze bijzondere gebieden worden begrepen de
      gebieden genoemd in [artikel 10][ref7];

      k. tank: een besloten ruimte gevormd door de permanente scheepsconstructie, en ontworpen voor het vervoer van
      vloeistoffen in bulk;

      l. zijtank: een tank grenzend aan de huidbeplating van het schip in de zijde;

      m. middentank: een tank in de zijden begrensd door langsschotten;

      n. sloptank: een tank speciaal bestemd voor de opslag van olierestanten en waswater uit de tanks en van andere
      oliehoudende mengsels;

      o. schone ballast: de ballast in een tank die, nadat er voor de laatste maal olie in werd vervoerd, zodanig is
      gereinigd dat de ballast daaruit afkomstig, indien geloosd uit een schip, dat stil ligt in schoon rustig water
      op een heldere dag, geen zichtbare oliesporen achterlaat op het wateroppervlak of op aangrenzende kusten, noch
      oliedrab of emulsie veroorzaakt welke zich onder het wateroppervlak of op de aangrenzende kusten zal afzetten.

      Onder schone ballast wordt mede verstaan de ballast, geloosd via een goedgekeurd bewakings- en regelsysteem voor
      olielozing, waarvan volgens dit systeem het oliegehalte van het mengsel niet hoger ligt dan 15 delen per miljoen,
      niettegenstaande de aanwezigheid van zichtbare oliesporen.

      p. gescheiden ballast: ballastwater dat wordt ingenomen in een tank die volledig is gescheiden van het ladingolie-
      en brandstofoliesysteem en die blijvend is bestemd voor het vervoer van ballastwater of voor het vervoer van
      ballast of ladingen andere dan olie en overige schadelijke stoffen;

      q. lengte (L): 96 percent van de lengte van de lastlijn op 85 percent van de kleinste holte naar de mal gemeten
      vanaf de bovenzijde van de kielplaat, dan wel de lengte van de voorzijde van de voorsteven tot aan de hartlijn
      van de roerkoning op deze lastlijn gemeten, indien deze laatste lengte groter is. Bij schepen die met stuurlast
      zijn ontworpen, moet de lastlijn waarop deze lengte wordt gemeten, evenwijdig aan de constructiewaterlijn worden
      genomen;

      r. de voorloodlijn en de achterloodlijn: de loodlijnen op het voorste en achterste punt van de lengte (L).
      De voorloodlijn moet getrokken worden door het snijpunt van de lastlijn waarop de lengte (L) is gemeten en de
      voorzijde van de voorsteven;

      s. midscheeps: het midden van de lengte (L);

      t. breedte (B): de grootste breedte van het schip midscheeps gemeten op de buitenkant van de spanten bij een schip
      met een metalen huid en op de buitenkant van de romp bij een schip met een huid van ander materiaal;

      u. draagvermogen (DWT): het verschil tussen de massa van het deplacement van een schip liggende op zijn
      zomerlastlijn in water met een dichtheid van 1,025 t/m3 en de massa van het lege schip, uitgedrukt in tonmassa;

      v. massa van het lege schip: de massa van het deplacement van een schip, zonder lading, brandstof, smeerolie,
      ballastwater, zoetwater en ketelvoedingwater in tanks, verbruiksvoorraden, passagiers en bemanning en hun
      bezittingen, uitgedrukt in tonmassa;

      w. permeabiliteit van een ruimte: de verhouding tussen het volume binnen die ruimte dat wordt geacht door water te
      worden ingenomen en het totale volume van die ruimte;

      x. inhouden en oppervlakten in een schip: de inhouden en oppervlakten berekend tot buitenkant spanten en
      verstijvingen;

      y. ruwe olie: elk vloeibaar koolwaterstofmengsel dat in natuurlijke staat in de aarde voorkomt en al dan niet
      behandeld is om het geschikt te maken voor het transport, en dat tevens omvat:

      1°. ruwe olie waaruit bepaalde lichte fracties kunnen zijn verwijderd; en

      2°. ruwe olie waaraan bepaalde lichte fracties kunnen zijn toegevoegd;

      z. ruwe olietankschip: een olietankschip gebruikt voor het vervoer van ruwe olie;

      aa. produktentankschip: een olietankschip gebruikt voor het vervoer van olie, geen ruwe olie zijnde;

      bb. chemicaliëntankschip: een schip dat is gebouwd voor of aangepast aan voornamelijk het vervoer in bulk van
      schadelijke vloeistoffen geen olie zijnde;

      cc. goedgekeurd: door het Hoofd van de Scheepvaartinspectie goedgekeurd.

      dd. tonnage: bruto-tonnage als bedoeld in de [Meetbrievenwet 1981][ref8];

      ee. gesloten tankwassysteem: een zodanig tankwassysteem dat, wanneer de sloptank of tanks eenmaal zijn voorzien van
      waswater, dit waswater voldoende is voor tankwassen en, indien van toepassing, ter voorziening van aandrijfwater
      voor ejecteurs, zonder toevoegen van extra water in het systeem;

      ff. verjaardatum: de datum van afgifte van het eerste certificaat, bedoeld in [artikel 5][ref9], in elk
      kalenderjaar, volgend op het jaar waarin dit certificaat is afgegeven.

      2 a. Ongeacht het bepaalde onder f van het eerste lid, wordt voor de toepassing van [de artikelen 13][ref10],
      [13 B][ref11], [13 E][ref12] en [18, vierde lid, onder][ref13] een "nieuw olietankschip" verstaan:

      1°. een olietankschip waarvoor het bouwcontract is gesloten na 1 juni 1979; of

      2°. indien geen bouwcontract is gesloten, een olietankschip waarvan de kiel is gelegd of waarvan de bouw zich in
      een soortgelijk stadium bevindt na 1 januari 1980; of

      3°. een olietankschip waarvan de oplevering na 1 juni 1982 plaatsvindt; of

      4°. een olietankschip dat een belangrijke verbouwing heeft ondergaan:

      (i). waarvoor het contract is gesloten na 1 juni 1979; of

      (ii). waarvan, indien geen contract is gesloten de verbouwing na 1 januari 1980 is begonnen; of

      (iii). welke na 1 juni 1982 is voltooid,

      met dien verstande dat voor olietankschepen met een draagvermogen van 70 000 tonmassa of meer de omschrijving onder
      *f* van het eerste lid van toepassing is met betrekking tot [het tweede lid van artikel 13.][ref14]

      b. Ongeacht het bepaalde onder *g* van het eerste lid, wordt voor de toepassing van [de artikelen 13][ref15],
      [13 A][ref16], [13 B][ref17], [13 C][ref18], [13 D][ref19] en [18, vijfde lid en zesde lid onder ][ref20]
      een "bestaand olietankschip" verstaan een olietankschip, geen nieuw olietankschip zijnde, als omschreven
      [onder ][ref21].


