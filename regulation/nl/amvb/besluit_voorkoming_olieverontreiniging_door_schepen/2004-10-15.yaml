  - number: '2'
    text: |-
      1 Tenzij uitdrukkelijk anders bepaald, zijn de bepalingen van dit besluit van toepassing op alle schepen.

      2 a. Op schepen geen olietankschepen zijnde, welke zijn uitgerust met laadruimten, gebouwd en gebruikt voor
      het vervoer van olie in bulk met een totale inhoud van 200m3 of meer, zijn voor wat betreft de constructie en
      het gebruik van die laadruimten, de bepalingen voor olietankschepen van [de artikelen 9][ref1], [10][ref2],
      [14][ref3], [15, eerste tot en met vijfde lid][ref4], [18][ref5], [20][ref6], en [24, vierde lid][ref7], eveneens
      van toepassing.

      b. Indien echter de totale inhoud van de onder *a* van dit lid bedoelde laadruimten minder is dan 1000
      m3, mogen de bepalingen van [het zesde lid van artikel 15][ref8] worden toegepast, in plaats van die van
      [het eerste tot en met het vijfde lid van artikel 15][ref9].

      3 Indien een lading waarop de bepalingen van het
      [Besluit voorkoming verontreiniging door met schepen in bulk vervoerde schadelijke vloeistoffen][ref10] van
      toepassing zijn, in de ladingtanks van een olietankschip of combinatietankschip wordt vervoerd, dient eveneens te
      worden voldaan aan de desbetreffende voorschriften van dat besluit.

      4 a. Draagvleugelboten, luchtkussenvaartuigen en andere nieuwe typen vaartuigen waarop, gezien hun constructie,
      de toepassing van de bepalingen van de[ Hoofdstukken II][ref11] en [III][ref12] ten aanzien van constructieve
      aspecten en uitrusting onredelijk of onuitvoerbaar zou zijn, kunnen door het Hoofd van de Scheepvaartinspectie
      van de toepassing van deze bepalingen worden ontheven, mits de constructie en de uitrusting van deze schepen
      gelijkwaardige bescherming bieden tegen verontreiniging door olie, een en ander met inachtneming van het doel
      waarvoor deze schepen zijn bestemd.

      b. Indien het bepaalde in artikel 4, eerste lid, op een vaartuig als bedoeld [onder ][ref13] van toepassing is,
      worden de bijzonderheden betreffende een ontheffing door het Hoofd van de Scheepvaartinspectie vermeld op het
      certificaat, bedoeld in [artikel 5][ref14].


