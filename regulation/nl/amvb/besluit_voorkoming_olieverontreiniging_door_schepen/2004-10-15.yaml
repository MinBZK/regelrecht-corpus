  - number: 13D
    text: |-
      1 Een bestaand ruwe olietankschip wordt geacht te voldoen aan het bepaalde in [het derde lid van artikel 13][ref1]
      betreffende gescheiden ballasttanks, indien aan alle onderstaande voorwaarden wordt voldaan:

      a. het schip zodanig is gebouwd of zodanig wordt gebruikt dat te allen tijde zonder het gebruik van ballastwater
      wordt voldaan aan het bepaalde ten aanzien van de diepgang en de stuurlast als bedoeld

      in [het tweede lid, onder ][ref2];

      b. de werkwijze en ballastvoorzieningen zijn goedgekeurd door het Hoofd van de Scheepvaartinspectie;

      c. op het certificaat als bedoeld in [artikel 5][ref3] is aangetekend dat het schip met speciale
      ballastvoorzieningen vaart.

      2 Op schepen als bedoeld in het eerste lid is het bepaalde in [artikel 13, lid 2, onder ][ref4], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel13
