  - number: 13A
    text: |-
      1 Een olietankschip dat de methode van aangewezen schone ballasttanks gebruikt in overeenstemming met het
      bepaalde in [het vijfde lid van artikel 13][ref1], dient te beschikken over tanks van voldoende inhoud en
      welke zijn aangewezen voor het vervoeren van uitsluitend schone ballast zoals omschreven in het eerste lid van
      [artikel 1, onder ][ref2], teneinde te kunnen voldoen aan het bepaalde in [het tweede lid, onder ][ref3].

      2 De voorzieningen voor en de werkwijze met de methode van aangewezen schone ballasttanks dienen te voldoen aan de
      voorschriften vastgesteld door het Hoofd van de Scheepvaartinspectie.

      3 Een olietankschip dat de methode van aangewezen schone ballasttanks gebruikt, moet zijn uitgerust met een
      goedgekeurde oliegehaltemeter, welke controle mogelijk maakt van het oliegehalte van het geloosde ballastwater.

      4 Elk olietankschip dat de methode van aangewezen schone ballasttanks gebruikt, moet zijn voorzien van een handboek
      waarin het systeem, de uitrusting en de werkwijze daarmee beschreven staan en dat ten genoegen van het Hoofd van de
      Scheepvaartinspectie is. Wanneer een wijziging wordt aangebracht die het systeem van aangewezen schone ballasttanks
      beïnvloedt, dient het handboek overeenkomstig te worden herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel13
