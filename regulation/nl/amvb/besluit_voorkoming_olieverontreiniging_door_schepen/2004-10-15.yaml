  - number: '26'
    text: |-
      1 Elk olietankschip met een tonnage van 150 of meer en elk schip dat geen olietankschip is, met een tonnage van 400
      of meer, heeft een goedgekeurd scheepsnoodplan voor olieverontreiniging aan boord.

      2 Een scheepsnoodplan voor olieverontreiniging bevat ten minste:

      a. de procedure die de kapitein of een ander bemanningslid dat de leiding van het schip heeft, moet volgen voor het
      melden van een voorval van olieverontreiniging;

      b. een lijst van autoriteiten of personen aan wie een voorval van olieverontreiniging moet worden gemeld;

      c. een gedetailleerde beschrijving van de maatregelen welke de bemanning onmiddellijk moet nemen om de uitstroom
      van olie ten gevolge van een voorval zoveel mogelijk te beperken;

      d. de procedure en contactpersoon aan boord van het schip voor het coördineren van de maatregelen aan boord met
      nationale en plaatselijke autoriteiten bij het bestrijden van een olieverontreiniging.

      3 Een schip waarop
      __REF000___________________________________________________________________________________________________________
      _______ naast dit artikel van toepassing is, mag het scheepsnoodplan voor olieverontreinigingen combineren met het
      scheepsnoodplan voor verontreiniging van de zee door schadelijke vloeistoffen, bedoeld in [dat artikel][ref2]. In
      dat geval is de titel van het plan: scheepsnoodplan voor verontreiniging van de zee.


