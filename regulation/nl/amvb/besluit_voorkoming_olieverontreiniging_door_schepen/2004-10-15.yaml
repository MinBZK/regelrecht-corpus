  - number: '9'
    text: |-
      1 Behoudens het bepaalde in [de artikelen 10][ref1] en [11][ref2], en het bepaalde in het tweede lid, is elke
      lozing in zee van olierestanten of oliehoudende mengsels vanaf schepen verboden, tenzij wordt voldaan aan alle
      onderstaande voorwaarden:

      a. voor een olietankschip, behalve zoals bepaald onder *b* :

      1°. het olietankschip bevindt zich niet in een bijzonder gebied, als bedoeld in [artikel 10][ref3];

      2°. het olietankschip bevindt zich meer dan 50 zeemijl van het dichtstbijzijnde land;

      3°. het olietankschip vervolgt zijn vaarroute;

      4°. de hoeveelheid geloosde olie bedraagt op elk moment van het lozen niet meer dan 30 liter per afgelegde zeemijl;

      5°. de totale hoeveelheid in zee geloosde olie bedraagt voor bestaande olietankschepen niet meer dan 1/15.000ste
      van de totale hoeveelheid van de lading waarvan het restant deel uitmaakte en, voor nieuwe olietankschepen niet
      meer dan 1/30.000ste van de totale hoeveelheid van de lading waarvan het restant deel uitmaakte;

      6°. het olietankschip heeft de apparatuur en de voorzieningen, als vereist in [artikel 15][ref4], in bedrijf;

      b. voor een schip dat geen olietankschip is, met een tonnage van 400 of meer en voor een olietankschip voorzover
      het betreft een lozing van olierestanten of oliehoudende mengsels vanuit de vullings van de ruimten voor machines,
      met uitzondering van de vullings van de ladingpompkamer, tenzij vermengd met ladingolierestanten:

      1°. het schip bevindt zich niet in een bijzonder gebied;

      2°. het schip vervolgt zijn vaarroute;

      3°. het oliegehalte van de geloosde vloeistof is zonder verdunning niet hoger dan 15 delen per miljoen;

      4°. het schip heeft de apparatuur, bedoeld in [artikel 16][ref5], in bedrijf.

      2 Een schip geen olietankschip zijnde, met een tonnage van minder dan 400, dat zich buiten een bijzonder
      gebied bevindt, dient olierestanten of oliehoudende mengsels aan boord op te slaan en af te geven aan
      havenontvangstvoorzieningen of in zee te lozen overeenkomstig het bepaalde in het eerste lid, onder *b*.

      3 Het bepaalde in het eerste lid is niet van toepassing op de lozing van schone of gescheiden ballast of van niet
      behandelde oliehoudende mengsels waarvan zonder verdunning het oliegehalte niet hoger is dan 15 delen per miljoen
      en deze mengsels niet afkomstig zijn van de vullings van de ladingpompkamer en niet vermengd zijn met olierestanten
      van de lading.

      4 Lozingen in zee van olierestanten of oliehoudende mengsels mogen geen chemicaliën of andere stoffen bevatten in
      hoeveelheden of concentraties welke schadelijk zijn voor het mariene milieu, dan wel chemicaliën of andere stoffen
      welke worden aangewend teneinde de in dit artikel aangegeven lozingsvoorwaarden ter zijde te stellen.

      5 De olierestanten welke niet in zee kunnen worden geloosd volgens het bepaalde in het eerste, tweede en derde lid
      van dit artikel, dienen aan boord te worden gehouden of aan havenontvangstvoorzieningen te worden afgegeven.

      6 Voor schepen als bedoeld in [artikel 16, zesde lid][ref6], die niet zijn uitgerust met de apparatuur vereist
      in [artikel 16, eerste of tweede lid][ref7], is het bepaalde in het eerste lid, onderdeel *b*, van toepassing met
      ingang van 6 juli 1998 of met ingang van een eerdere datum waarop het schip met deze apparatuur wordt uitgerust.
      Tot deze datum is elke lozing in zee van olierestanten of oliehoudende mengsels verboden, tenzij wordt voldaan aan
      alle onderstaande voorwaarden:

      a. het oliehoudende mengsel is niet afkomstig van de vullings van de ladingpompkamer;

      b. het oliehoudende mengsel is niet vermengd met ladingolierestanten;

      c. het schip bevindt zich niet in een bijzonder gebied;

      d. het schip bevindt zich meer dan 12 zeemijlen van het dichtstbijzijnde land;

      e. het schip vervolgt zijn vaarroute;

      f. het oliegehalte van de geloosde vloeistof is lager dan 100 delen per miljoen;

      g. het schip heeft de goedgekeurde apparatuur voor het scheiden van olie en water in bedrijf.


