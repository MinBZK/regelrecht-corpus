        artikel: '13'
        hoofdstuk: II
  - number: '4'
    text: |-
      1 Elk olietankschip met een tonnage van 150 of meer, alsmede elk schip geen olietankschip zijnde, met een tonnage
      van 400 of meer is onderworpen aan:

      a. een eerste onderzoek dat wordt verricht voordat het schip in dienst wordt gesteld of voordat het certificaat,
      bedoeld in [artikel 5][ref1], voor de eerste maal wordt afgegeven, en dat een volledig onderzoek van de bouw,
      uitrusting, systemen, onderdelen, voorzieningen en materialen van het schip omvat teneinde na te gaan of wordt
      voldaan aan de regels bij of krachtens dit besluit gesteld;

      b. een hernieuwd onderzoek dat wordt verricht met door het Hoofd van de Scheepvaartinspectie vast te stellen
      tussenpozen die, behoudens indien [artikel 8, tweede, vijfde, zesde of zevende lid][ref2], van toepassing is, niet
      langer dan vijf jaar zijn, en dat de bouw, uitrusting, systemen, onderdelen, voorzieningen en materialen van het
      schip omvat teneinde na te gaan of wordt voldaan aan de regels bij of krachtens dit besluit gesteld;

      c. een tussentijds onderzoek dat wordt verricht binnen drie maanden voor of na de tweede of de derde verjaardatum
      en dat in de plaats komt van een van de jaarlijkse onderzoeken als bedoeld [onder ][ref3], en dat de uitrusting
      en de daarbij behorende pompen en pijpleidingen, de systemen voor het bewaken en regelen van het lozen van olie
      en voor het schoonmaken van tanks met ruwe olie, de olie-water afscheider en de oliefiltersystemen van het schip
      omvat teneinde na te gaan of wordt voldaan aan de regels bij of krachtens dit besluit gesteld. Van dit tussentijds
      onderzoek wordt een aantekening geplaatst op het certificaat;

      d. een jaarlijks onderzoek dat wordt verricht binnen drie maanden voor of na elke verjaardatum en dat de bouw,
      uitrusting, systemen, onderdelen, voorzieningen en materialen van het schip omvat teneinde na te gaan of zij zijn
      onderhouden overeenkomstig het derde lid, onder *a*, en zich in goede staat bevinden. Van dit jaarlijks onderzoek
      wordt een aantekening geplaatst op het certificaat;

      e. een aanvullend onderzoek dat afhankelijk van de omstandigheden hetzij geheel, hetzij gedeeltelijk wordt
      verricht, indien herstellingen of vernieuwingen zijn uitgevoerd, of indien zich een ongeval heeft voorgedaan,
      waarbij wordt nagegaan of de noodzakelijke reparaties of vernieuwingen deugdelijk zijn doorgevoerd en of wordt
      voldaan aan de regels bij of krachtens dit besluit gesteld.

      2 Bij ministeriële regeling worden regels gesteld ten aanzien van onderzoeken van schepen die niet vallen onder het
      eerste lid, teneinde na te gaan of wordt voldaan aan de regels bij of krachtens dit besluit gesteld. Op verzoek van
      de reder geeft ten aanzien van dergelijke onderzoeken het Hoofd van de Scheepvaartinspectie een verklaring af. De
      daaraan verbonden kosten worden in rekening gebracht volgens een door Onze Minister vast te stellen tarief.

      3 a. De toestand van het schip en van de uitrusting dient te worden gehandhaafd in overeenstemming met de
      bepalingen vastgesteld bij of krachtens dit besluit om zeker te stellen dat het schip in alle opzichten geschikt
      blijft tot het verlaten van een haven zonder dat het een gevaar vormt voor verontreiniging van het mariene milieu.

      b. Nadat een onderzoek als bedoeld in het eerste en tweede lid is voltooid, mag zonder de toestemming van het Hoofd
      van de Scheepvaartinspectie, geen verandering worden aangebracht in de bouw, uitrusting, systemen, onderdelen,
      voorzieningen en materialen die aan het onderzoek zijn onderworpen, tenzij het de onmiddellijke vervanging van
      dergelijke uitrusting en onderdelen betreft.

      c. Indien een schip een ongeval overkomt, of indien gebreken worden geconstateerd die de hechtheid van het schip,
      de doelmatigheid of de volledigheid van de uitrusting, vallende onder de bepalingen van dit besluit in belangrijke
      mate beïnvloeden, dient de kapitein van het schip het betreffende districtshoofd van de Scheepvaartinspectie zo
      spoedig mogelijk in te lichten.

      Indien het schip zich in een haven buiten Nederland bevindt, dient de kapitein tevens onmiddellijk de ter plaatse
      bevoegde autoriteiten in te lichten.


