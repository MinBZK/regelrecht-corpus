  - number: '16'
    text: |-
      1 Elk schip met een tonnage van 400 of meer en minder dan 10 000 is uitgerust met apparatuur voor het filtreren van
      oliehoudende mengsels welke voldoet aan het vierde lid. Indien zo’n schip grote hoeveelheden brandstof vervoert,
      voldoet het schip aan het tweede lid of aan [artikel 14, eerste lid][ref1].

      2 Elk schip met een tonnage van 10 000 of meer is uitgerust met apparatuur voor het filtreren van oliehoudende
      mengsels en met een inrichting voor een alarm en een automatische stop indien het oliegehalte van de te lozen
      vloeistof hoger is dan 15 delen per miljoen.

      3 a. Het Hoofd van de Scheepvaartinspectie kan ontheffing verlenen van het bepaalde in het eerste en tweede lid
      voor een schip dat uitsluitend reizen maakt binnen bijzondere gebieden indien wordt voldaan aan alle volgende
      voorwaarden:

      1°. het schip is voorzien van een verzameltank met een voldoende inhoud voor het aan boord opslaan van alle met
      olie verontreinigd lenswater;

      2°. al het met olie verontreinigd lenswater wordt aan boord opgeslagen om vervolgens te worden afgegeven aan
      havenontvangstvoorzieningen;

      3°. in de havens waarnaar het schip reizen maakt, zijn voldoende havenontvangstvoorzieningen beschikbaar voor het
      in ontvangst nemen van het met olie verontreinigd lenswater;

      4°. op het certificaat is aangetekend dat het schip uitsluitend reizen maakt binnen bijzondere gebieden;

      5°. de hoeveelheid van het af te geven mengsel, het tijdstip en de haven van afgifte worden aangetekend in het
      oliejournaal.

      b. Een schip met een tonnage van minder dan 400 dient, voor zover praktisch uitvoerbaar, zodanig te zijn uitgerust
      dat olierestanten of oliehoudende mengsels aan boord kunnen worden opgeslagen of dat lozing daarvan kan geschieden
      overeenkomstig het bepaalde in [artikel 9, eerste lid, onder ][ref2].

      4 Apparatuur voor het filtreren van oliehoudende mengsels als bedoeld in het eerste lid, dient van een goedgekeurd
      type te zijn en moet waarborgen dat van elk in zee te lozen oliehoudend mengsel, nadat het door deze apparatuur is
      gevoerd, het oliegehalte niet hoger is dan 15 delen per miljoen.

      5 Apparatuur voor het filtreren van oliehoudende mengsels als bedoeld in het tweede lid dient van een goedgekeurd
      type te zijn en moet waarborgen dat van elk in zee te lozen oliehoudend mengsel, nadat het door deze apparatuur
      is gevoerd, het oliegehalte niet hoger is dan 15 delen per miljoen. De apparatuur dient te zijn voorzien van een
      alarminrichting die aangeeft wanneer dit gehalte wordt overschreden. De apparatuur dient zodanig te zijn ingericht
      dat elke lozing automatisch wordt gestopt indien het oliegehalte van de te lozen vloeistof hoger is dan 15 delen
      per miljoen.

      6 Schepen opgeleverd voor 6 juli 1993 moeten met ingang van 6 juli 1998 aan dit artikel voldoen indien deze schepen
      zijn uitgerust met apparatuur voor het scheiden van olie en water tot 100 delen per miljoen.

      7 Bij ministeriële regeling worden nadere regels gesteld ten aanzien van het bepaalde in het vierde en vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel14
