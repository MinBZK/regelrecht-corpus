  - number: '10'
    text: |-
      1 Voor de toepassing van dit besluit worden onder bijzondere gebieden verstaan het gebied van de Middellandse
      Zee, van de Oostzee, van de Zwarte Zee, van de Rode Zee, van de Perzische Golf, van de Golf van Aden, van het
      Antarctisch gebied en van de Noordwest-Europese wateren, welke als volgt worden omschreven:

      a. Onder het gebied van de Middellandse Zee wordt verstaan de Middellandse Zee zelf, alsmede de golven en
      zeeën daarin, waarbij de grens tussen de Middellandse en de Zwarte Zee wordt gevormd door de parallel van 41°
      noorderbreedte en de westelijke grens wordt gevormd door de Straat van Gibraltar op de meridiaan van 5°36'
      westerlengte.

      b. Onder het gebied van de Oostzee wordt verstaan de Oostzee zelf met inbegrip van de Botnische Golf, de Finse
      Golf en de toegang tot de Oostzee, begrensd door de parallel van Kaap Skagen in het Skagerrak op 57°44,8'
      noorderbreedte.

      c. Onder het gebied van de Zwarte Zee wordt verstaan de Zwarte Zee zelf, waarbij de grens tussen de Middellandse en
      de Zwarte Zee wordt gevormd door de parallel van 41° noorderbreedte.

      d. Onder het gebied van de Rode Zee wordt verstaan de Rode Zee zelf met inbegrip van de Golf van Suez en de
      Golf van Aqaba, in het zuiden begrensd door de loxodroom tussen Ras si Ane (12°08,5' noorderbreedte, 43°19,6'
      oosterlengte) en Husn Murad (12°40,4' noorderbreedte, 43°30,2' oosterlengte).

      e. Onder het gebied van de Perzische Golf wordt verstaan het zeegebied ten noordwesten van de loxodroom tussen Ras
      al Hadd (22°30' noorderbreedte, 59°48' oosterlengte) en Ras al Fasteh (25°04' noorderbreedte, 61°25' oosterlengte).

      f. Onder het gebied van de Golf van Aden wordt verstaan het zeegebied tussen de Rode Zee en de Arabische Zee
      in het westen begrensd door de loxodroom tussen Ras si Ane (12° 08,5' noorderbreedte, 43° 19,6' oosterlengte)
      en Husn Murad (12° 40,4' noorderbreedte, 43° 30,2' oosterlengte) en in het oosten begrensd door de loxodroom
      tussen Ras Asir (11° 50' noorderbreedte, 51° 16,9' oosterlengte) en Ras Fartak (15° 35' noorderbreedte, 52° 13,8'
      oosterlengte).

      g. Onder het Antarctisch gebied wordt verstaan het zeegebied ten zuiden van 60° zuiderbreedte;

      h. Onder het gebied van de Noordwest-Europese wateren wordt verstaan de Noordzee en zijn toegangen, de Ierse Zee
      en zijn toegangen, de Keltische zee, het Engels Kanaal en zijn toegangen en het gedeelte van de Noordoostelijke
      Atlantische Oceaan direct ten westen van Ierland, begrensd door de lijnen die achtereenvolgens de volgende punten
      verbinden:

      i. 48° 27' noorderbreedte aan de Franse kust,

      ii. 48° 27' noorderbreedte; 6° 25' westerlengte,

      iii. 49° 52' noorderbreedte; 7° 44' westerlengte,

      iv. 50° 30' noorderbreedte; 12° westerlengte,

      v. 56° 30' noorderbreedte; 12° westerlengte,

      vi. 62° noorderbreedte; 3° westerlengte,

      vii. 62° noorderbreedte aan de Noorse kust,

      viii. 57° 44,8' noorderbreedte aan de Deense en aan de Zweedse kust.

      2 a. Behoudens het bepaalde in [artikel 11][ref1] is elke lozing van olierestanten of oliehoudende mengsels in
      zee door een olietankschip en door een schip geen olietankschip zijnde, met een tonnage van 400 of meer, verboden
      wanneer deze zich in een bijzonder gebied bevinden.

      b. Elke lozing van olierestanten of oliehoudende mengsels in zee vanaf een schip dat geen olietankschip is, met een
      tonnage van minder dan 400, is verboden wanneer dit schip zich in een bijzonder gebied bevindt, behalve indien het
      oliegehalte van de geloosde vloeistof zonder verdunning niet hoger is dan 15 delen per miljoen.

      3 a. Het bepaalde in het tweede lid is niet van toepassing op de lozing van schone of gescheiden ballast.

      b. Het bepaalde in het tweede lid, onder *a*, is niet van toepassing op de lozing van behandeld lenswater van
      ruimten voor machines, mits wordt voldaan aan alle volgende voorwaarden:

      1°. het lenswater is niet afkomstig van de vulling van de ladingpompkamer;

      2°. het lenswater is niet vermengd met ladingolierestanten;

      3°. het schip vervolgt zijn vaarroute;

      4°. het oliegehalte van het geloosde mengsel is zonder verdunning niet hoger dan 15 delen per miljoen;

      5°. het schip heeft de apparatuur als bedoeld in [artikel 16, vijfde lid][ref2], in bedrijf; en

      6°. de apparatuur voor het filtreren is uitgerust met een inrichting die de lozing automatisch stopt indien het
      oliegehalte van het te lozen mengsel hoger is dan 15 delen per miljoen.

      4 a. Lozingen in zee van olierestanten of oliehoudende mengsels mogen geen chemicaliën of andere stoffen bevatten
      in hoeveelheden of concentraties welke schadelijk zijn voor het mariene milieu, dan wel chemicaliën of andere
      stoffen aangewend teneinde de in dit artikel aangegeven lozingsvoorwaarden ter zijde te stellen.

      b. De olierestanten welke niet in zee mogen worden geloosd volgens het bepaalde onder het tweede en derde lid,
      dienen aan boord te worden gehouden of aan havenontvangstvoorzieningen te worden afgegeven.

      5 Tot een nader bij koninklijk besluit vast te stellen tijdstip mogen schepen in het gebied van de Rode Zee, van de
      Perzische Golf en van de Golf van Aden lozen volgens het bepaalde in [artikel 9][ref3] in plaats van het bepaalde
      in het tweede en derde lid.

      6 In afwijking van het tweede lid is in het Antarctisch gebied elke lozing in zee van olierestanten of oliehoudende
      mengsels vanaf een schip verboden.


