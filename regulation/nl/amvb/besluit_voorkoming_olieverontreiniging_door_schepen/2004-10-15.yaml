  - number: '27'
    text: |-
      1 Het Hoofd van de Scheepvaartinspectie kan, indien bijzondere omstandigheden daartoe nopen, geheel of gedeeltelijk
      ontheffing verlenen van de bij of krachtens dit besluit gestelde regelen met betrekking tot de bouw, inrichting of
      uitrusting van een schip.

      2 Indien een ontheffing als bedoeld in het eerste lid wordt verleend aan een schip dat een certificaat behoeft als
      bedoeld in [artikel 5][ref1], dient daarvan aantekening te worden gemaakt op het certificaat.


