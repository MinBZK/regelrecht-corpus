  - number: '11'
    text: |-
      Het bepaalde in [de artikelen 9][ref1] en [10][ref2] is niet van toepassing op:

      a. het lozen in zee van olierestanten of oliehoudende mengsels indien dit noodzakelijk is om de veiligheid van het
      schip zeker te stellen of om mensenlevens op zee te redden; of

      b. het lozen in zee van olierestanten of oliehoudende mengsels in geval van schade aan het schip of aan de
      uitrusting daarvan:

      1°. mits na het ontstaan van de schade of na het ontdekken van de lozing alle redelijke voorzorgen zijn getroffen
      om de lozing te voorkomen of tot een minimum te beperken; en

      2°. uitgezonderd in geval de eigenaar of de kapitein handelde met de bedoeling om schade te veroorzaken, of wel
      roekeloos handelde en in de wetenschap dat er waarschijnlijk schade zou ontstaan; of

      c. het lozen in zee van oliehoudende stoffen met toestemming van Onze Minister, indien dit geschiedt met het
      doel bepaalde verontreinigingsvoorvallen te bestrijden teneinde de schade door verontreiniging tot een minimum
      te beperken.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003936#Artikel10
