  - number: '23'
    text: |-
      1 a. De hypothetische uitstroming van olie in geval van schade in de zijde van het schip (Oc en aan het vlak van
      het schip (Os) dient ten aanzien van beschadigde afdelingen op alle mogelijke plaatsen over de gehele lengte van
      het schip, in de mate als omschreven in [artikel 22][ref1], te worden berekend met de volgende formules:

      1°. bij schade in de zijde van het schip:

      Oc = σ Wi + σ KiCi (I)

      2°. bij schade aan het vlak van het schip:

      Os = 1/3 (σ ZiWi + σ ZiCi) (II)

      waarin: Wi = de inhoud in kubieke meters van een zijtank, die wordt geacht te zijn lek gestoten als gevolg van de
      schade zoals aangegeven in [artikel 22][ref2]. Voor gescheiden ballasttanks kan Wi gelijk aan nul worden gesteld;

      Ci = de inhoud in kubieke meters van een middentank die wordt geacht te zijn lek gestoten als gevolg van de schade
      zoals aangegeven in [artikel 22][ref3]. Voor gescheiden ballasttanks kan Ci gelijk aan nul worden gesteld;

      Ki = 1 - bi/tc; wanneer bi gelijk is aan of groter is dan tc, dient Ki gelijk aan nul te worden gesteld;

      Zi = 1 - hi/vs; wanneer hi gelijk is aan of groter dan vs, dient Zi gelijk aan nul te worden gesteld;

      bi = breedte van de betreffende zijtank in meters, binnenboord gemeten vanaf de scheepshuid loodrecht op het vlak
      van kiel en stevens, ter hoogte van de lastlijn behorende bij het toegekende zomervrijboord;

      hi = kleinste hoogte van de betreffende dubbele bodem, in meters. Wanneer er geen dubbele bodem is aangebracht
      dient hi gelijk

      aan nul te worden gesteld.

      b. Waar de onder *a* van dit lid gegeven symbolen in dit hoofdstuk voorkomen, hebben zij de in dit artikel
      omschreven betekenis.

      2 Indien een loze ruimte of een gescheiden ballasttank met een lengte die kleiner is dan 1c zoals omschreven in
      [artikel 22][ref4], tussen zijtanks voor olie is gelegen, kan Oc in formule (I) worden berekend onder de aanname
      dat Wi de werkelijke inhoud van één dezer zijtanks is (wanneer zij eenzelfde inhoud hebben) of dat de inhoud Wi
      de kleinste is van de twee zijtanks (wanneer zij een verschillende inhoud hebben) vermenigvuldigd met Si zoals
      hieronder omschreven, terwijl voor alle andere bij een zodanige aanvaring betrokken zijtanks de waarde van de
      werkelijke volle inhoud moet worden aangehouden.

      Si = 1 - li/lc

      waarin: li = lengte van de betreffende lege ruimte of gescheiden ballasttank in meters.

      3 a. De hoogte hi van de dubbele bodem als bedoeld in het eerste lid, onder *a*, mag alleen in rekening worden
      gebracht indien zij leeg zijn of schoon water bevatten, en wanneer in de daarboven gelegen tanks lading wordt
      vervoerd.

      b. Indien de dubbele bodem zich niet uitstrekt over de gehele lengte en breedte van de betreffende tank, wordt
      de dubbele bodem geacht niet aanwezig te zijn en dient de inhoud van de tanks boven het gebied van de bodemschade
      in formule (II) inbegrepen te worden, zelf indien de tank wegens het aanbrengen van een dergelijke gedeeltelijke
      dubbele bodem als onbeschadigd kan worden beschouwd.

      c. Voor de bepaling van de waarde hi mogen zuigputten buiten beschouwing worden gelaten, mits deze geen
      buitensporig groot oppervlak hebben, zulks ter beoordeling van het Hoofd van de Scheepvaartinspectie, en welke zo
      weinig mogelijk, in geen geval meer dan de halve hoogte van de dubbele bodem, onder de tank uitsteken.

      Indien de diepte van dergelijke zuigputten groter is dan de halve hoogte van de dubbele bodem, dient voor hi de
      hoogte van de dubbele bodem, verminderd met de hoogte van de zuigput, te worden aangenomen.

      Pijpleidingen naar dergelijke zuigputten dienen, indien zij in de dubbele bodem zijn aangebracht, te zijn voorzien
      van afsluiters of andere afsluitmiddelen die moeten zijn aangebracht ter plaatse waar de leidingen de aangesloten
      tank binnentreden, teneinde het uitstromen van olie in geval van beschadiging van de leidingen te voorkomen.

      Deze leidingen dienen zo hoog mogelijk boven het scheepsvlak te zijn aangebracht. Deze afsluiters dienen op zee te
      allen tijde gesloten te blijven wanneer de tank olie bevat, met dien verstande dat zij mogen worden geopend voor
      het overpompen van lading doch uitsluitend wanneer dat nodig is voor het vertrimmen van het schip.

      4 Indien een bodemschade tegelijkertijd vier middentanks betreft, kan de waarde Os worden berekend aan de hand van
      de volgende formule:

      Os = 1/4 (σ ZiWi + σ ZiCi) (III)

      5 Indien elke ladingtank is voorzien van een inrichting voor het verpompen van lading welke is uitgevoerd met een
      hoog aangebrachte noodzuigaansluiting en waarmee lading vanuit één of meer beschadigde tanks kan worden overgepompt
      naar gescheiden ballasttanks of naar andere ladingtanks waarvan het zeker is dat de ullage in deze tanks voldoende
      is, kan het Hoofd van de Scheepvaartinspectie toestaan dat bij bodemschade rekening wordt gehouden met een
      geringere hoeveelheid uitgestroomde olie.

      Het al of niet rekening houden met een zodanig leidingstelsel is afhankelijk van het vermogen om in twee uur tijd
      een hoeveelheid olie over te pompen, die gelijk is aan de helft van de inhoud van de grootste van de betreffende
      beschadigde tanks en van de beschikbaarheid van een daarmede overeenkomende opnamecapaciteit in ballast- of
      ladingtanks.

      Het rekening houden met deze omstandigheden dient te worden beperkt tot het toestaan van de berekening van Os
      volgens formule (III).

      De leidingen voor dergelijke zuiginrichtingen moeten zijn aangebracht op een hoogte die ten minste gelijk is aan de
      vertikale omvang van de schade aan het vlak van het schip vs.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0003936#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0003936#Artikel22
