  - number: '6'
    text: |-
      1 a. Het Hoofd van de Scheepvaartinspectie kan een daartoe bevoegde regering verzoeken de onderzoeken als bedoeld
      in [artikel 4][ref1] uit te voeren en het certificaat als bedoeld in [artikel 5, eerste lid][ref2], af te geven,
      of, voorzover van toepassing, een aantekening te plaatsen.

      b. Op verzoek van de daartoe bevoegde buitenlandse regering kan namens het Hoofd van de Scheepvaartinspectie een
      schip dat niet gerechtigd is de Nederlandse vlag te voeren, aan de in [artikel 4][ref3] genoemde onderzoeken worden
      onderworpen en ten behoeve van dat schip een certificaat als bedoeld in [artikel 5][ref4], worden afgegeven, of,
      voorzover van toepassing, een aantekening worden geplaatst.

      2 In het geval genoemd in het eerste lid onder *b* wordt een afschrift van het certificaat en een afschrift van het
      rapport van onderzoek zo spoedig mogelijk toegezonden aan de regering die het verzoek heeft gedaan.

      3 Een krachtens het bepaalde in het eerste lid, onder *b*, afgegeven certificaat zal een verklaring bevatten,
      inhoudende dat het is afgegeven op verzoek van de betrokken regering.

      4 Er wordt geen certificaat als bedoeld in [artikel 5][ref5] afgegeven aan een schip dat gerechtigd is de vlag te
      voeren van een staat, die geen partij is bij het Verdrag.


