  - number: 13G
    text: |-
      Een olietankschip waarvoor het Internationaal certificaat van voorkoming van verontreiniging door olie, bedoeld
      in [artikel 5, eerste lid][ref1], vereist is, voldoet ter verkrijging en behoud van dat certificaat mede aan de
      eisen van [verordening (EG) nr. 417/2002](32002R0417) van het Europees Parlement en de Raad van de Europese Unie
      van 18 februari 2002, betreffende het versneld invoeren van de vereisten inzake een dubbelwandige uitvoering of
      een gelijkwaardig ontwerp voor enkelwandige olietankschepen en tot intrekking van [Verordening (EG) nr. 2978/94]
      (31994R2978) van de Raad van de Europese Unie (PbEG L 64).


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel5
