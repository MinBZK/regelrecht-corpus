  - number: '17'
    text: |-
      1 Elk schip met een tonnage van 400 of meer dient te zijn uitgerust met een of meer tanks met een inhoud die, met
      inachtneming van het type van de machine-installatie en de duur van de reis, toereikend is voor het opslaan van
      olierestanten welke ontstaan bij het reinigen van brandstof en smeeroliën en door olielekkages in de ruimten voor
      machines, en welke niet kunnen worden behandeld op enige andere wijze overeenkomstig de bepalingen van dit besluit.

      2 Aan boord van nieuwe schepen dienen deze tanks zodanig te zijn ontworpen en gebouwd dat de reiniging ervan en de
      afgifte van restanten aan havenontvangstvoorzieningen wordt vergemakkelijkt. Inrichtingen voor het ontluchten van
      de tanks, het ledigen ervan en het meten van de in de tanks aanwezige vloeistof, dienen ten genoegen van het Hoofd
      van de Scheepvaartinspectie te zijn aangebracht.

      3 Op bestaande schepen is het bepaalde in het tweede lid van toepassing, indien zulks naar het oordeel van het
      Hoofd van de Scheepvaartinspectie redelijk en praktisch uitvoerbaar is.

      4 Pijpleidingen naar en van tanks voor olierestanten welke ontstaan bij het reinigen van brandstof en
      smeeroliën mogen geen andere directe aansluiting overboord hebben dan de standaard aansluiting, bedoeld in
      [artikel 19][ref1] .


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel19
