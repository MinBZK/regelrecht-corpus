  - number: '14'
    text: |-
      1 Behoudens het bepaalde in het tweede lid van dit artikel is het verboden ballastwater in enige brandstofolietank
      te vervoeren aan boord van nieuwe schepen geen olietankschepen zijnde, met een tonnage van 4000 of meer alsmede aan
      boord van nieuwe olietankschepen met een tonnage van 150 of meer.

      2 Het bepaalde in het vorige lid is niet van toepassing, indien ongewone omstandigheden of de noodzaak om grote
      hoeveelheden brandstof mee te voeren ertoe leiden dat ballastwater moet worden vervoerd in enige brandstofolietank.
      In dergelijke gevallen dient zulk ballastwater te worden afgegeven aan havenontvangstvoorzieningen, dan wel is
      lozing ervan in zee toegestaan met inachtname van het bepaalde in de [artikelen 9][ref1] en [20][ref2], waarbij het
      gebruik van apparatuur als bedoeld in [artikel 16, tweede lid][ref3], is vereist.

      3 Het is niet toegestaan olie te vervoeren in de voorpiektank of in een tank die vóór het aanvaringsschot is
      gelegen, aan boord van een schip met een tonnage van 400 of meer;

      a. waarvoor het bouwcontract is gesloten na 1 januari 1982; of

      b. indien geen bouwcontract is gesloten, waarvan de kiel is gelegd of waarvan de bouw zich in een soortgelijk
      stadium bevindt na 1 juli 1982.

      4 Schepen niet vallende onder het eerste en derde lid dienen aan het bepaalde in deze leden te voldoen, tenzij
      zulks naar het oordeel van het Hoofd van de Scheepvaartinspectie niet redelijk en praktisch uitvoerbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel9
