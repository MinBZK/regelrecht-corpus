  - number: '15'
    text: |-
      1 Olietankschepen met een tonnage van 150 of meer dienen te zijn uitgerust met:

      a. toereikende middelen voor het reinigen van de ladingtanks, alsmede voor het overbrengen van de verontreinigde
      ballastrestanten en het tankwaswater naar een goedgekeurde sloptank, waarbij zodanige voorzieningen voor het
      overbrengen van de oliehoudende restanten naar een sloptank of een combinatie van sloptanks zijn getroffen, dat de
      lozing van elke vloeistof in de zee voldoet aan het bepaalde in [artikel 9][ref1];

      b. een sloptank of een combinatie van sloptanks die voldoen aan het bepaalde in het vierde lid;

      c. een bewakings- en regelsysteem voor het lozen van olie dat voldoet aan het bepaalde in het vijfde lid;

      d. goedgekeurde en doelmatige apparatuur om snel en nauwkeurig het oliewater scheidingsvlak in de sloptank vast te
      stellen; en

      e. een goedgekeurd handboek waarin richtlijnen met betrekking tot het gebruik van de bewakings- en regelapparatuur
      zijn opgenomen en waarin zowel de automatische als de hand bediende werkwijze is beschreven.

      De apparatuur als bedoeld onder *d* dient ook beschikbaar te zijn voor gebruik in andere tanks waarin scheiding van
      olie en water tot stand komt, en van waaruit men lozing rechtstreeks in de zee wil doen plaatsvinden.

      2 Nieuwe olietankschepen met een draagvermogen van 70.000 tonmassa of meer dienen te zijn voorzien van tenminste
      twee sloptanks.

      3 Bestaande olietankschepen met een tonnage van 150 of meer dienen eveneens te voldoen aan het bepaalde in het
      eerste lid met dien verstande dat iedere ladingtank kan worden aangemerkt als sloptank.

      4 a. Sloptanks dienen zo te zijn ontworpen, in het bijzonder met betrekking tot de plaatsing van de in- en
      uitlaten, keerplaten en -schotten voor zover aangebracht, dat overmatige turbulentie met het meevoeren van olie in
      het water of het vormen van emulsie met het water, wordt voorkomen.

      b. 1°. De inhoud van de sloptank of van een combinatie van sloptanks mag niet minder zijn dan 3% van de inhoud van
      de ladingtanks van het schip.

      2°. Het Hoofd van de Scheepvaartinspectie kan toestaan dat de onder 1° voorgeschreven inhoud van de sloptanks of
      van de combinatie van sloptanks wordt verminderd:

      (i). tot 2% voor een olietankschip dat is uitgerust met een gesloten tankwassysteem;

      (ii). tot 2% voor een olietankschip dat is uitgerust met gescheiden ballasttanks of aangewezen schone ballasttanks
      overeenkomstig het bepaalde in [artikel 13][ref2] of dat is uitgerust met een systeem voor het wassen met ruwe olie
      overeenkomstig het bepaalde in [artikel 13b][ref3], met dien verstande dat de inhoud mag worden verminderd tot 1½%
      indien het schip tevens is uitgerust met een gesloten tankwassysteem;

      (iii). tot 1% voor een combinatietankschip, dat de olie uitsluitend vervoert in tanks met gladde wanden, met
      dien verstande dat de inhoud mag worden verminderd tot 0,8% indien het schip tevens is uitgerust met een gesloten
      tankwassysteem.

      5 a. Het bewaking- en regelsysteem voor olielozingen als bedoeld in het eerste lid, onder *c* dient:

      1°. van een goedgekeurd type te zijn;

      2°. te zijn voorzien van apparatuur voor een doorlopende weergave van de lozing in liters per zeemijl, alsmede
      van ofwel de totale hoeveelheid geloosde olie, ofwel van het oliegehalte en de hoeveelheid geloosde vloeistof per
      tijdseenheid. Deze registratie dient een aanduiding van tijd en datum te bevatten en dient tenminste drie jaar te
      worden bewaard; en

      3°. automatisch in werking te treden wanneer er enige lozing van vloeistof in de zee plaatsvindt en zo te zijn
      ingericht dat elke lozing van een oliehoudend mengsel automatisch wordt gestopt wanneer de hoeveelheid geloosde
      olie per zeemijl het bepaalde in het [eerste lid, onder ][ref4] overschrijdt.

      b. Elke storing in het bewakings- en regelsysteem dient de lozing automatisch te doen stoppen en moet worden
      aangetekend in het oliejournaal, bedoeld in [artikel 20.][ref5]

      c. Er dient een andere methode door middel van handbediening aanwezig te zijn, die in geval van een dergelijke
      storing kan worden gebruikt. Het onklaar onderdeel van de apparatuur dient echter zo spoedig mogelijk bedrijfsklaar
      te worden gemaakt. De havenautoriteit kan een olietankschip met een onklaar onderdeel van de apparatuur toestemming
      verlenen een ballastreis te ondernemen voordat het zich naar een reparatiehaven begeeft.

      6 Op olietankschepen met een tonnage van minder dan 150 is het bepaalde in de vorige leden niet van toepassing.
      Olie en verontreinigd tankwaswater dienen aan boord te worden gehouden en te worden verzameld in een opslagtank
      voor afgifte aan havenontvangstvoorzieningen, tenzij voldoende voorzieningen zijn getroffen voor het zodanig
      bewaken van de lozing van deze vloeistoffen in de zee dat verzekerd is dat daarbij aan het bepaalde in
      [artikel 9][ref6] wordt voldaan.

      7 a. Het Hoofd van de Scheepvaartinspectie kan ontheffing verlenen van het bepaalde in het eerste tot en met
      het vijfde lid indien een olietankschip uitsluitend reizen maakt gelegen binnen een afstand van 50 zeemijlen
      van het dichtstbijzijnde land, waarvan de reisduur niet meer bedraagt dan 72 uur en de reizen uitsluitend
      gemaakt worden tussen havens van staten die partij zijn bij het Verdrag. Een zodanige ontheffing kan slechts
      worden verleend indien het olietankschip alle oliehoudende mengsels aan boord houdt, ter latere afgifte aan
      havenontvangstvoorzieningen, en deze havenontvangstvoorzieningen toereikend zijn, dit ter beoordeling van het Hoofd
      van de Scheepvaartinspectie.

      b. Het Hoofd van de Scheepvaartinspectie kan ontheffing verlenen van het bepaalde in het vijfde lid, voor schepen
      niet vallende onder *a*, in de volgende gevallen:

      1°. voor bestaande olietankschepen met een draagvermogen van 40 000 tonmassa of meer ingezet op reizen als bedoeld
      in [artikel 13c, eerste lid][ref7], en welke daarbij voldoen aan het bepaalde in [artikel 13c, tweede lid][ref8];
      of

      2°. voor olietankschepen die uitsluitend reizen maken:

      (i). binnen een bijzonder gebied als bedoeld in [artikel 10, eerste lid][ref9]; of

      (ii). binnen 50 zeemijlen van het dichtstbijzijnde land buiten een bijzonder gebied als bedoeld in
      [artikel 10, eerste lid][ref10], waarbij het olietankschip ingezet wordt:

      1e. voor reizen tussen havens van staten die partij zijn bij het Verdrag; of

      2e. voor reizen binnen een beperkt vaargebied, vastgesteld door het Hoofd van de Scheepvaartinspectie, waarvan de
      reisduur niet meer dan 72 uur bedraagt.

      c. Indien een ontheffing wordt verleend overeenkomstig het bepaalde onder *b* , dient tevens te worden voldaan aan
      de volgende voorwaarden:

      1°. alle oliehoudende mengsels worden aan boord gehouden voor afgifte aan havenontvangstvoorzieningen; en

      2°. de hoeveelheid van het af te geven mengsel, het tijdstip van afgifte en de haven van afgifte worden aangetekend
      in het oliejournaal, bedoeld in [artikel 20.][ref11]

      d. Indien een ontheffing wordt verleend voor een olietankschip dat reizen maakt binnen een gebied als bedoeld in
      onderdeel *b* , onder 2°, onder (ii), dienen binnen het genoemde gebied de havenontvangstvoorzieningen toereikend
      te zijn, dit ter beoordeling van het Hoofd van de Scheepvaartinspectie.

      e. Indien een ontheffing wordt verleend voor een olietankschip dat reizen maakt binnen een gebied als bedoeld in
      onderdeel *b* , onder 2° (i) en 2° (ii), ten 2e, zullen de genoemde gebieden worden vermeld op het certificaat,
      bedoeld in [artikel 5][ref12].

      8 a. Het Hoofd van de Scheepvaartinspectie kan vrijstelling verlenen van het bepaalde in
      [artikel 9, eerste lid onder ][ref13], indien geen apparatuur voor de bewaking en regeling van het lozen van
      geraffineerde lichte produkten beschikbaar is.

      b. Indien een vrijstelling als bedoeld onder *a* is verleend, dient de lozing te geschieden volgens door het Hoofd
      van de Scheepvaartinspectie te stellen voorschriften.

      c. Het Hoofd van de Scheepvaartinspectie zal jaarlijks bezien of en in hoeverre de onder *a* genoemde apparatuur
      beschikbaar is.

      9 Het bepaalde in het eerste tot en met het vijfde lid is niet van toepassing op een olietankschip dat asfalt
      vervoert of andere producten waarop de bepalingen van dit besluit van toepassing zijn, waarvan de fysische
      eigenschappen een effectieve scheiding van het product en water alsmede een effectief bewaken van de lozing
      belemmeren. Alle ladingrestanten dienen aan boord te worden gehouden en tezamen met alle verontreinigd waswater aan
      een havenontvangstvoorziening te worden afgegeven.

      10 Bij ministeriële regeling worden nadere regels gesteld ten aanzien van het bepaalde in het eerste lid, onder
      *d*, alsmede het bepaalde in het vijfde lid.


