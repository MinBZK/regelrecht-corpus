  - number: 13F
    text: |-
      1 [Dit artikel][ref1] is van toepassing op olietankschepen met een draagvermogen van 600 tonmassa of meer:

      a. waarvoor het bouwcontract is gesloten op of na 6 juli 1993; of

      b. indien er geen bouwcontract is, waarvan de kiel is gelegd of waarvan de bouw zich in een soortgelijk stadium
      bevindt op of na 6 januari 1994; of

      c. waarvan de oplevering op of na 6 juli 1996 heeft plaatsgevonden; of

      d. die een belangrijke verbouwing hebben ondergaan:

      1°. waarvoor het contract is gesloten na 6 juli 1993; of

      2°. waarvan, indien er geen contract is, de verbouwing na 6 januari 1994 is begonnen; of

      3°. die na 6 juli 1996 is voltooid.

      2 Elk olietankschip met een draagvermogen van 5 000 tonmassa of meer:

      a. voldoet, in plaats van aan [artikel 13e][ref2] indien van toepassing, aan het derde lid, tenzij wordt voldaan
      aan het bepaalde in het vierde en vijfde lid; en

      b. voldoet, indien van toepassing, aan het bepaalde in het zesde lid.

      3 De gehele lengte van het ladinggedeelte wordt als volgt beschermd door ballasttanks of ruimten, geen ladingtanks
      of brandstoftanks zijnde:

      a. zijtanks of ruimten strekken zich uit over de volle holte van het schip in de zijde of vanaf de bovenzijde van
      de dubbele bodem tot het bovenste dek, daarbij geen rekening houdende met een rondgezette plaat als overgang van
      huidbeplating naar dekbeplating. Zij zijn zodanig gesitueerd dat de ladingtanks nergens op een afstand geringer dan
      w binnenboord van de malkant van de huidbeplating zijn gelegen, loodrecht op de huid gemeten ter plaatse van elke
      willekeurige dwarsdoorsnede, zoals aangegeven in figuur 1, waarbij:

      w = 0,5 + DWT/20 000 m of 2 m, welke van de twee de kleinste is.

      De minimum waarde van w = 1 m.

      b. ter plaatse van elke willekeurige dwarsdoorsnede is de hoogte van elke dubbele bodem tank of ruimte zodanig dat
      de afstand h tussen de bodem van de ladingtanks en de malkant van de vlakbeplating, loodrecht op deze beplating
      gemeten zoals aangegeven in figuur 1, niet minder is dan:

      h = B/15 m of 2 m, welke van de twee de kleinste is.

      De minimum waarde van h = 1 m.

      c. indien de afstanden h en w verschillen wordt op hoogten groter dan 1,5h boven de basislijn de afstand w
      aangehouden, zoals aangegeven in figuur 1.

      d. voor ruwe-olietankschepen met een draagvermogen van 20 000 tonmassa of meer en produktentankschepen met
      een draagvermogen van 30 000 tonmassa of meer is de gezamenlijke capaciteit van zijtanks, dubbele bodemtanks,
      voorpiektanks en achterpiektanks niet kleiner dan de capaciteit van de gescheiden ballasttanks benodigd
      om te voldoen aan [artikel 13][ref3]. Zijtanks of ruimten en dubbele bodemtanks gebruikt om te voldoen aan
      [artikel 13][ref4] zijn gelijkmatig verdeeld over de gehele lengte van het ladinggedeelte. Aanvullende gescheiden
      ballast capaciteit gebruikt voor het verminderen van langsscheepse spanningen of trim mag op elke plaats in het
      schip zijn gelegen.

      e. zuigputten van ladingtanks mogen in de dubbele bodem onder de door de afstand h bepaalde grenslijn worden
      aangebracht, mits deze putten zo klein als praktisch mogelijk zijn en de afstand tussen de bodem van de put en de
      vlakbeplating ten minste 0,5h bedraagt.

      f. ballastleidingen en andere leidingen, zoals peil- en ventilatieleidingen naar ballasttanks, lopen niet door
      ladingtanks. Ladingleidingen en soortgelijke leidingen naar ladingtanks lopen niet door ballasttanks. Uitzondering
      mag worden gemaakt voor korte leidinggedeelten mits deze geheel gelast of gelijkwaardig geconstrueerd zijn.

      4 a. Dubbele bodemtanks of ruimten als vereist in het derde lid, onder *b*, kunnen achterwege blijven indien
      het ontwerp van de tanker zodanig is dat de druk op de vlakbeplating, die de enige scheiding vormt met de zee,
      uitgeoefend door de lading en de dampdruk, de hydrostatische waterdruk van het zeewater niet overschrijdt zoals
      aangegeven in de volgende formule:f * hc * pc * g + 100 | p dn * p s * gwaarin:

      hc = hoogte van de lading die op de vlakbeplating rust in meters;

      pc = maximum dichtheid van de lading in t/m3;

      dn = minimum diepgang voor elke verwachte beladingstoestand in meters;

      ps = dichtheid van het zeewater in t/;m3

      |p = maximum insteldruk van de over-/onderdrukkleppen van de ladingtank in bar;

      f = veiligheidsfactor = 1,1;

      g = versnelling van de zwaartekracht (9,81 m/s2).

      b. Elke horizontale scheiding benodigd om te voldoen aan het gestelde [onder ][ref5], is geplaatst op een hoogte
      van de kleinste waarde van B/6 of 6 meter, maar niet meer dan 0,6D, waarin D de holte naar de mal midscheeps
      gemeten, boven de basislijn.

      c. Zijtanks of ruimten zijn gesitueerd zoals bepaald in het derde lid, onder *a*, behalve dat, beneden een nniveau
      van 1,5h boven de basislijn, de grenslijn van de ladingtank verticaal naar beneden mag lopen tot het vlak zoals
      aangegeven in figuur 2, waarbij h als bedoeld in het derde lid, onder *b*.

      5 Andere ontwerpen en vormen van constructie van olietankschepen kunnen worden aanvaard als gelijkwaardig
      alternatief voor het bepaalde in het derde lid na te zijn goedgekeurd.

      6 Voor olietankschepen met een draagvermogen van 20 000 tonmassa of meer wordt de aangenomen schade als bedoeld in
      [artikel 25, tweede lid, onder ][ref6], aangevuld met de onderstaande aangenomen bodemschade:

      a. langsscheeps:

      1°. schepen met een draagvermogen van 75 000 tonmassa of meer: 0,6L gemeten vanaf de voorloodlijn;

      2°. schepen met een draagvermogen kleiner dan 75 000 tonmassa: 0,4L gemeten vanaf de voorloodlijn

      b. dwarsscheeps: B/3 op elke plaats van het vlak

      c. verticaal: beschadiging van de huidbeplating.

      7 Olietankschepen met een draagvermogen kleiner dan 5 000 tonmassa zijn:

      a. ten minste uitgerust met dubbele bodemtanks of ruimten met een zodanige hoogte dat de afstand h als bedoeld in
      het derde lid, onder *b*, voldoet aan de volgende waarde:h: = B/15.De minimum waarde van h 0,76 m.

      In de ronding van de kim en op plaatsen zonder een duidelijke ronding van de kim loopt de begrenzing van het
      ladinggedeelte parallel aan het vlak zoals aangegeven in figuur 3; en

      b. voorzien van ladingtanks waarvan de inhoud niet groter is dan 700m3 tenzij voorzien is in zijtanks of ruimten
      overeenkomstig het bepaalde in het derde lid, onder *a*, waarbij voldaan wordt aan:

      w = 0,4 + 2,4DWT/20 000 m.

      De minimum waarde van w = 0,76 m.

      8 Olie wordt niet vervoerd in een ruimte gelegen voor het aanvaringsschot dat is aangebracht, zoals is
      voorgeschreven in [artikel 11][ref7], tweede lid, van [Bijlage II van het Schepenbesluit 1965][ref8]. Een
      olietankschip waarvoor geen aanvaringsschot is vereist, zoals is voorgeschreven in [artikel 11][ref9], tweede
      lid, van [Bijlage II van het Schepenbesluit 1965][ref10], vervoert geen olie in een ruimte die zich uitstrekt voor
      een hypothetisch dwarsscheeps vlak, loodrecht op hart schip, en is gesitueerd als zijnde een aanvaringsschot dat
      voldoet aan het bepaalde in dat artikel.

      figuur 1

      figuur 2

      figuur 3


