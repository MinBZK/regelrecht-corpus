  - number: '3'
    text: |-
      1 Het Hoofd van de Scheepvaartinspectie kan het aanbrengen van andere onderdelen, materialen, voorzieningen of
      apparatuur, dan welke in dit besluit worden voorgeschreven, in een schip toestaan, mits deze ten minste even
      doelmatig zijn als die welke in dit besluit worden vereist.

      2 In geen geval zullen vormen van ontwerp en constructie ter regeling van het lozen van olie, zoals deze in
      dit besluit zijn voorgeschreven, kunnen worden vervangen door operationele methoden, behoudens het bepaalde in
      [artikel 13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel13
    url: https://wetten.overheid.nl/BWBR0003936/2004-10-15#Artikel3
