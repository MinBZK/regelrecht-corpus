  - number: '18'
    text: |-
      1 Aan boord van elk olietankschip dient op het open dek, aan beide zijden van het schip, een losaansluiting
      te zijn aangebracht voor de afgifte van door olie verontreinigd ballastwater of tankwaswater aan
      havenontvangstvoorzieningen.

      2 a. Aan boord van elk olietankschip dienen de pijpleidingen voor het lozen van ballastwater of met olie
      verontreinigd water afkomstig van het ladinggedeelte van het schip, zoals toegestaan krachtens [artikel 9][ref1] of
      [10][ref2], te zijn geleid naar het open dek, of naar de zijde van het schip boven de waterlijn, behorende bij de
      ballasttoestand met de grootste diepgang.

      b. Voor lozingen toegestaan krachtens het bepaalde in het zesde lid kan een afwijkend systeem worden aanvaard,
      zulks naar het oordeel van het Hoofd van de Scheepvaartinspectie.

      3 a. Aan boord van nieuwe olietankschepen dienen voorzieningen te zijn getroffen voor het stoppen van de lozing
      van ballastwater of met olie verontreinigd water afkomstig van het ladinggedeelte van het schip, vanaf een zodanige
      plaats op het bovendek of hoger, dat de in gebruik zijnde losaansluiting, bedoeld in het eerste lid, en de lozing
      in zee uit de pijpleidingen, bedoeld in het tweede lid, onder *a*, vanaf die plaats met het oog waarneembaar zijn.

      b. Er behoeven geen voorzieningen voor het stoppen van de lozing bij de waarnemingsplaats te zijn aangebracht,
      indien is voorzien in een goed werkende radio- of telefoonverbinding tussen de waarnemingsplaats en de plaats waar
      de lozing kan worden gestopt.

      4 Elk nieuw olietankschip dat moet zijn voorzien van gescheiden ballasttanks of dat moet zijn uitgerust met een
      systeem voor het wassen met ruwe olie, dient te voldoen aan de volgende bepalingen:

      a. het schip moet zijn uitgerust met ladingleidingen welke zodanig zijn ontworpen en aangebracht dat het
      achterblijven van olie in de leidingen tot een minimum wordt beperkt; en

      b. voorzieningen moeten zijn getroffen voor het aftappen van alle ladingpompen en alle ladingleidingen na het
      lossen, zonodig door aansluiting op een nazuigsysteem. De afgetapte olie moet zowel naar de wal als naar een
      ladingtank of sloptank kunnen worden overgebracht. Voor afgifte aan de wal moet een afzonderlijke leiding met
      een kleine diameter zijn aangebracht. Deze leiding dient te zijn aangesloten op de losaansluiting buiten de
      hoofdafsluiters.

      5 Elk bestaand ruwe olietankschip dat dient te zijn voorzien van gescheiden ballasttanks of de methode van
      aangewezen schone ballasttanks gebruikt dan wel dient te zijn uitgerust met een systeem voor het wassen met ruwe
      olie, dient te voldoen aan het bepaalde in het vierde lid, onder b.

      6 Aan boord van olietankschepen dient ballastwater of met olie verontreinigd water afkomstig van het ladinggedeelte
      boven de waterlijn te worden geloosd behalve in de volgende gevallen:

      a. gescheiden en schone ballast mogen onder de waterlijn worden geloosd:

      1°. in havens; of

      2°. op zee door het laten aflopen van de tanks;

      mits een onderzoek van de oppervlakte van het ballastwater onmiddellijk voorafgaand aan de lozing heeft uitgewezen
      dat geen verontreiniging met olie heeft plaatsgevonden;

      b. bestaande olietankschepen welke zonder verbouwing niet in staat zijn gescheiden ballastwater boven de waterlijn
      te lozen, mogen dergelijk ballastwater op zee onder de waterlijn lozen mits een onderzoek van de oppervlakte van
      het ballastwater onmiddellijk voorafgaand aan de lozing heeft uitgewezen dat geen verontreiniging met olie heeft
      plaatsgevonden;

      c. bestaande olietankschepen welke gebruik maken van aangewezen schone ballasttanks en zonder verbouwing niet in
      staat zijn ballastwater uit deze tanks boven de waterlijn te lozen, mogen dergelijk ballastwater onder de waterlijn
      lozen mits de lozing wordt gecontroleerd overeenkomstig het bepaalde in [artikel 13 A, derde lid][ref3];

      d. olietankschepen mogen verontreinigd ballastwater of met olie verontreinigd water afkomstig van de ladingtanks,
      uitgezonderd de sloptanks, op zee onder de waterlijn lozen door het laten aflopen van de tank mits:

      1°. er voldoende tijd is verstreken zodat scheiding van olie en water heeft plaatsgevonden; en

      2°. het ballastwater is onderzocht onmiddellijk voorafgaand aan de lozing met apparatuur voor het vaststellen
      van het oliewater scheidingsvlak, bedoeld in [artikel 15, eerste lid onder ][ref4], teneinde te verzekeren dat de
      hoogte van het scheidingsvlak zodanig is dat de lozing geen verhoogd risico met zich meebrengt voor het mariene
      milieu.

      e. In afwijking van het bepaalde onder *d* , mag een bestaand olietankschip verontreinigd ballastwater of met olie
      verontreinigd water afkomstig van het ladinggedeelte op zee onder de waterlijn lozen mits:

      1°. een deel van het te lozen water door een vaste leiding wordt geleid naar een gemakkelijk bereikbare plaats op
      het bovendek of daarboven, alwaar de lozing visueel kan worden gecontroleerd; en

      2°. deze voorzieningen van lozen voldoen aan nadere door het Hoofd van de Scheepvaartinspectie te geven
      voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003936#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003936#Artikel13A
      [ref4]: https://wetten.overheid.nl/BWBR0003936#Artikel15
