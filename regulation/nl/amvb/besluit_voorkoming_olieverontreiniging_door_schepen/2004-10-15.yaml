  - number: '24'
    text: |-
      1 Elk nieuw olietankschip dient te voldoen aan de bepalingen van dit artikel. Elk bestaand olietankschip dient
      vanaf 2 oktober 1985 te voldoen aan de bepalingen van [dit artikel][ref1], indien een dergelijk olietankschip
      behoort tot een der volgende categorieën:

      a. een olietankschip dat na 1 januari 1977 wordt opgeleverd; of

      b. een olietankschip dat aan beide van de volgende voorwaarden voldoet:

      1°. de oplevering geschiedt niet later dan 1 januari 1977; en

      2°. het bouwcontract is afgesloten na 1 januari 1974 ofwel, indien vooraf geen bouwcontract is afgesloten, de kiel
      is gelegd, dan wel de bouw van het olietankschip zich bevindt in een soortgelijk stadium, na 30 juni 1974.

      2 De grootte en de indeling van de ladingtanks van olietankschepen dienen zodanig te zijn, dat de hypothetische
      uitstroming Oc of Os, berekend in overeenstemming met het bepaalde in [artikel 23][ref2], op elke willekeurige
      plaats over de gehele lengte van het schip niet groter is dan 30.000 m3 of 4003 DWT, welke van de twee de grootste
      is, maar niet groter dan 40.000 m3.

      3 De inhoud van elke zijtank voor olie van een olietankschip mag niet groter zijn dan vijfenzeventig procent van de
      toegelaten hypothetische uitstroming van olie zoals bedoeld in [het tweede lid van dit artikel][ref3].

      De inhoud van een middentank mag niet groter zijn dan 50.000 m3.

      Bij gescheiden ballast olietankschepen zoals bedoeld in [artikel 13][ref4], mag de toegestane inhoud van een
      zijtank, gelegen tussen twee gescheiden ballasttanks die elk langer zijn dan Zc, worden vergroot tot de maximaal
      toegestane hypothetische uitstroming van olie, mits de breedte van de zijtanks groter is dan tc.

      4 De lengte van elke ladingtank mag niet groter zijn dan 10 m of de grootste van een van de volgende waarden:

      a. wanneer geen langsschot in de ladingtanks is aangebracht:

      (0,5 bi/B + 0,1)L maar niet groter dan 0,2L

      b. wanneer op hart schip een langsschot in de ladingtanks is aangebracht:

      (0,25 bi/B + 0,15)L

      c. wanneer twee of meer langsschotten in de ladingtanks zijn aangebracht:

      1°. voor zijtanks voor lading: 0,2L

      2°. voor middentanks voor lading:

      (i). indien bi/B gelijk is aan of groter dan één vijfde: 0,2L

      (ii). indien bi/B kleiner is dan één vijfde:

      - wanneer geen langsschot op hart schip is aangebracht: (0,5 bi/B + 0,1)L
      - wanneer een langsschot op hart schip is aangebracht:

      (0,25 bi/B + 0,15)L

      bi is de minimum afstand van de scheepshuid tot het buitenste langsschot van de desbetreffende tank, binnenboord
      gemeten loodrecht op het vlak van kiel en stevens, ter hoogte van de lastlijn behorende bij het toegekende
      zomervrijboord.

      5 a. Indien een geïnstalleerd en goedgekeurd "ladingpompsysteem" twee of meer ladingtanks met elkaar verbindt,
      dienen afsluiters of soortgelijke afsluitmiddelen ter onderlinge afscheiding van deze tanks te zijn aangebracht.

      b. Deze afsluiters of afsluitmiddelen dienen gesloten te zijn wanneer het tankschip zich op zee bevindt.

      6 a. Pijpleidingen die door ladingtanks lopen, en die zich op een kleinere afstand dan tc van de scheepshuid of op
      een geringere hoogte dan vs van de bodem bevinden, dienen voor elke tank waarin zich een open zuigeinde bevindt ter
      plaatse waar de leiding de tank binnentreedt te zijn voorzien van afsluiters of soortgelijke afsluitmiddelen.

      b. De afsluiters dienen gesloten te blijven wanneer het schip zich op zee bevindt èn de tanks olie bevatten.

      c. De afsluiters mogen slechts dan worden geopend indien met het oog op het vertrimmen van het schip, het
      overpompen van de lading noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0003936#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0003936#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0003936#Artikel13
