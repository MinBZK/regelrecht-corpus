  - number: '25'
    text: |-
      1 Elk nieuw olietankschip dient bij de aangenomen schade in de zijde of aan het vlak van het schip, zoals
      aangegeven in het derde lid, te voldoen aan de criteria betreffende de waterdichte indeling en de stabiliteit van
      het schip in beschadigde toestand zoals aangegeven in het derde lid van dit artikel.

      Het hierboven bepaalde is van toepassing op elke voorkomende diepgang die voortvloeit uit een gedeeltelijke of
      volledige belading van het schip in overeenstemming met de toelaatbare trim en sterkte van het schip alsmede uit de
      soortelijk gewichten van de lading.

      De beschadiging dient op alle mogelijke plaatsen over de gehele lengte van het schip als volgt te worden
      aangenomen:

      a. bij olietankschepen met een lengte van meer dan 225 m: op elke willekeurige plaats over de gehele lengte van
      het schip;

      b. bij olietankschepen met een lengte van meer dan 150 m, maar niet meer dan 225 m: op elke willekeurige plaats
      over de gehele lengte van het schip, behalve ter plaatse van de schotten die de in het achterschip gelegen
      machinekamer begrenzen.

      De machinekamer dient te worden beschouwd als een afzonderlijke afdeling die lek kan worden;

      c. bij olietankschepen met een lengte van niet meer dan 150 m: op elke willekeurige plaats over de gehele lengte
      van het schip tussen aangrenzende dwarsschotten, met uitzondering van de machinekamer;

      d. aan olietankschepen met een lengte van 100 m of minder die niet aan alle criteria van het vierde lid kunnen
      voldoen zonder daarbij ingrijpend afbreuk te doen aan de bedrijfshoedanigheden van het schip, kan het Hoofd van de
      Scheepvaartinspectie een verlichting van deze criteria toestaan;

      e. ballasttoestanden, waarbij het olietankschip geen olie behalve olierestanten, in ladingtanks vervoert, behoeven
      niet in beschouwing te worden genomen.

      2 De volgende bepalingen met betrekking tot de overgang en de aard van de aangenomen schade zijn van toepassing:

      a. Beschadiging in de zijde:








                        1°. langsscheeps


                        1/3 L2/3 of 14,5 m, welke van de twee de kleinste is




                        2°. dwarsscheeps (binnenboord gemeten vanaf de scheepshuis loodrecht op het vlak van kiel en
      stevens, ter hoogte van de zomerlastlijn)


                        B/5 of 11,5 m, welke van de twee de kleinste is




                        3°. verticaal


                        vanaf de lijn van onderkant spanten op hart schip, naar boven, zonder begrenzing






      b. Bodem schade










                        over 0,3 L vanaf voorlood lijn van het schip


                        elk ander deel van het schip











                        1°. langsscheeps


                        1/3 L 2/3 of 14,5 m welke van de twee de kleinste is


                        1/3 L 2/3 of 5 m, welk van de twee de kleinste is




                        2°. dwarsscheeps


                        B/6 of 10 m, welke van de twee de kleinste is


                        B/6 of 5 m, welke van de twee de kleinste is




                        3°. verticaal


                        B/15 of 6 m, welke van de twee de kleinste is, gemeten van de lijn van onderkant spanten op hart
      schip


                        B/15 of 6 m, welke van de twee de kleinste is, gemeten van de lijn van onderkant spanten op hart
      schip






      b. Bodem schade










                        over 0,3 L vanaf voorlood lijn van het schip


                        elk ander deel van het schip











                        1°. langsscheeps


                        1/3 L 2/3 of 14,5 m welke van de twee de kleinste is


                        1/3 L 2/3 of 5 m, welk van de twee de kleinste is




                        2°. dwarsscheeps


                        B/6 of 10 m, welke van de twee de kleinste is


                        B/6 of 5 m, welke van de twee de kleinste is




                        3°. verticaal


                        B/15 of 6 m, welke van de twee de kleinste is, gemeten van de lijn van onderkant spanten op hart
      schip


                        B/15 of 6 m, welke van de twee de kleinste is, gemeten van de lijn van onderkant spanten op hart
      schip






      c. Indien een beschadiging van geringere omvang dan de maximale beschadiging onder a en b, een ernstiger situatie
      ten gevolge heeft, moet een dergelijke beschadiging worden aangenomen.

      d. In gevallen waarin beschadiging aan dwarsschotten wordt verwacht, zoals bedoeld in het eerste lid, onder a en
      b, dienen waterdichte dwarsschotten, teneinde als doelmatig te kunnen worden beschouwd te worden geplaatst op een
      onderlinge afstand die ten minste gelijk is aan de lengte waarover de veronderstelde beschadiging, bedoeld onder
      a, zich uitstrekt. In gevallen waarin de dwarsschotten op een kleinere onderlinge afstand zijn geplaatst, worden
      binnen het beschadigde gedeelte een of meer van deze schotten geacht niet aanwezig te zijn bij het vaststellen van
      afdelingen die vol kunnen lopen.

      e. In gevallen waarin beschadiging tussen aangrenzende waterdichte dwarsschotten wordt verwacht, zoals bedoeld
      in het eerste lid, onder *c*, wordt aangenomen dat een hoofddwarsschot of een dwarsschot dat de afscheiding vormt
      tussen zijtanks of dubbele bodemtanks niet beschadigd is, tenzij:

      1°. de aangrenzende schotten dichter bij elkaar zijn geplaatst dan de lengte waarover de veronderstelde
      beschadiging zich uitstrekt, zoals bedoeld onder *a* van dit lid, of

      2°. in een schot een nis is aangebracht of een schot trapsgewijs verspringt waarbij de lengte van de nis dan
      wel de afstand van de dwarsvlakken van trapsgewijs verspringende schotten meer bedraagt dan 3,05 m binnen het
      gebied van de veronderstelde beschadiging. De trapsgewijze verspringing van het achterpiekschot en de top van de
      achterpiektank wordt voor de toepassing van de bepalingen van dit artikel buiten beschouwing gelaten.

      f. Indien zich binnen het gebied van de aangenomen beschadiging pijpleidingen, kokers of tunnels bevinden, dienen
      voorzieningen te worden getroffen om te voorkomen dat binnenstromend water via deze kanalen verder kan doordringen
      naar andere afdelingen dan die, welke in alle gevallen van schade worden geacht vol te lopen.

      3 Olietankschepen voldoen aan de criteria betreffende de stabiliteit van het schip in beschadigde toestand, indien:

      a. de waterlijn in de eindtoestand, rekening houdend met inzinken, slagzij en trim, niet hoger is dan de onderrand
      van alle openingen waardoor binnenstromend water verder in het schip kan doordringen.

      Onder deze openingen worden begrepen luchtpijpen en andere openingen die worden afgesloten door middel van tegen
      weer en wind dichte deuren en luiken; niet hieronder begrepen zijn mangaten en verzonken stortranden die zijn
      afgesloten door waterdichte, van pakking voorziene deksels ter handhaving van de hoge mate van waterdichtheid van
      het dek, op afstandbediende waterdichte schuifdeuren, alsmede vaste lichtranden.

      b. in de eindtoestand na het vollopen de slagzij, ten gevolge van onsymmetrisch vollopen, niet groter is dan 25
      graden.

      Indien geen enkel deel van het dek is ondergedompeld is een slagzij van niet meer dan 30 graden aanvaardbaar.

      c. de kromme van armen van statische stabiliteit dient een minimum bereik te hebben van 20 graden voorbij de
      evenwichtstoestand, te zamen met een resterende maximale oprichtende arm van ten minste 0,1 m binnen het bereik
      van 20 graden. Daarbij dient de oppervlakte onder de kromme binnen dit bereik niet minder dan 0,0175 meter radialen
      te bedragen. Binnen bovengenoemd bereik van de kromme van armen van statische stabiliteit mogen onbeschermde
      openingen niet onder water komen, tenzij de desbetreffende ruimte wordt verondersteld vervuld te zijn geraakt. Voor
      openingen als bedoeld onder a en andere tegen weer en wind afsluitbare openingen is het toegestaan dat deze worden
      ondergedompeld binnen het bereik van 20 graden.

      d. ten genoegen van het Hoofd van de Scheepvaartinspectie wordt aangetoond dat de stabiliteit tijdens het vollopen
      steeds voldoende is.

      e. Overvloeiinrichtingen waarvoor mechanische hulpmiddelen nodig zijn, zoals afsluiters of eventueel aangebrachte
      overvloeipijpen, mogen niet in aanmerking worden genomen voor het verminderen van slagzij of voor het verkrijgen
      van het minimaal vereiste bereik van de reststabiliteit teneinde te voldoen aan het bepaalde onder a, b en c.
      Gedurende alle stadia van het overvloeien dient voldoende reststabiliteit te worden gehandhaafd. Ruimten die door
      kokers van grote doorsnede zijn verbonden, kunnen als één ruimte worden beschouwd.

      4 Er dient ten genoegen van het Hoofd van de Scheepvaartinspectie met berekeningen te worden aangetoond dat aan het
      bepaalde in het eerste lid van dit artikel wordt voldaan.

      Hierbij moet rekening worden gehouden met de ontwerpeigenschappen van het schip, de indeling, ligging en
      inhoud van de beschadigde afdelingen, alsmede met de verdeling, het soortelijk gewicht en de invloed van vrije
      vloeistofoppervlakken. Bij de berekeningen moet worden uitgegaan van de volgende aannamen:

      a. alle lege of gedeeltelijk gevulde tanks, het soortgelijk gewicht van de vervoerde lading, alsmede elke
      uitstroming van vloeistoffen uit beschadigde afdelingen, dienen in beschouwing te worden genomen;

      b. de volgende permeabiliteiten moeten worden aangenomen:








                        Ruimten


                        Permeabiliteit






                        bestemd voor voorraden


                        0,60




                        ingenomen door verblijven


                        0,95




                        ingenomen door machines


                        0,85




                        lege ruimte


                        0,95




                        bestemd voor verbruiksvloeistoffen


                        0-0,95 (∗1)




                        bestemd voor andere vloeistoffen


                        0-0,95 (∗1)






      (∗1) de permeabiliteit van gedeeltelijk gevulde afdelingen dient in overeenstemming te zijn met de hoeveelheid
      vloeistof die wordt vervoerd in die afdeling. Indien een met vloeistof gevulde tank wordt beschadigd, moet worden
      aangenomen dat de inhoud van de tank geheel uitstroomt en de tank vol loopt met zeewater tot een niveau behorend
      bij het vlak van evenwicht in de eindtoestand.

      c. Het drijfvermogen van een bovenbouw die zich onmiddellijk boven de beschadigde plaats in de zijde van het schip
      bevindt, dient buiten beschouwing te worden gelaten. De niet volgelopen gedeelten van de bovenbouwen die buiten
      het beschadigde gedeelte vallen, kunnen echter wel in de beschouwing worden betrokken, mits zij van het beschadigde
      gedeelte worden gescheiden door waterdichte schotten en aan de bepalingen van het derde lid onder *a* met
      betrekking tot deze onbeschadigde ruimten is voldaan. In waterdichte schotten binnen de bovenbouw zijn waterdichte
      scharnierende deuren toegestaan.

      d. De invloed van vrije vloeistofoppervlakken dient voor elke afdeling afzonderlijk te worden berekend bij een
      slagzij van 5 graden.

      Het Hoofd van de Scheepvaartinspectie kan eisen dan wel toestaan dat de invloed van vrije vloeistofoppervlakken in
      gedeeltelijk gevulde tanks wordt berekend bij een slagzij van meer dan 5 graden.

      e. Bij het berekenen van de invloed van vrije vloeistofoppervlakken van verbruiksvloeistoffen dient te worden
      aangenomen dat, voor elk soort vloeistof, ten minste twee dwarsscheeps naast elkaar gelegen tanks of een middentank
      een vrije vloeistofoppervlak hebben: rekening dient te worden gehouden met de tank of combinatie van tanks waar de
      invloed van het vrije vloeistofoppervlak het grootst is.

      5 Aan boord van elk nieuw olietankschip dienen voldoende goedgekeurde gegevens ter beschikking te zijn die de
      volgende informatie verschaffen:

      a. gegevens betreffende het innemen en verdelen van de lading die nodig zijn om ervoor te zorgen dat aan het
      bepaalde in dit artikel wordt voldaan, en

      b. gegevens omtrent het vermogen van het schip om te voldoen aan de criteria betreffende de stabiliteit van het
      schip in beschadigde toestand zoals vastgesteld in dit artikel, alsmede gegevens betreffende de gevolgen van
      verlichtingen die eventueel zijn toegestaan ingevolge het bepaalde in het tweede lid onder *d*.
