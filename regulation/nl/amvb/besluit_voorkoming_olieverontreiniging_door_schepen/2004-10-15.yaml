  - number: 25a
    text: >-
      1 Dit artikel is van toepassing op olietankschepen met een draagvermogen van 5000 tonmassa of meer:


      a. waarvoor het bouwcontract is gesloten op of na 1 februari 1999;


      b. waarvan, bij het ontbreken van een bouwcontract, de kiel is gelegd of waarvan de bouw zich in een soortgelijk
      stadium bevindt op of na 1 augustus 1999;


      c. waarvan de oplevering op of na 1 februari 2002 heeft plaatsgevonden; of


      d. die een belangrijke verbouwing hebben ondergaan:


      1°. waarvoor het contract is gesloten na 1 februari 1999;


      2°. waarvan, bij het ontbreken van een contract, de verbouwing na 1 augustus 1999 is begonnen; of


      3°. die na 1 februari 2002 is voltooid.


      2 Elk olietankschip voldoet, voor zover van toepassing, bij elke bedrijfsmatig voorkomende diepgang onder de meest
      ongunstige omstandigheden van beladen, ballasten of combinaties daarvan, verenigbaar met een goede bedrijfsvoering,
      met inbegrip van de tussenliggende fasen van vloeistofverplaatsing, aan de bepalingen voor stabiliteit in
      onbeschadigde toestand, genoemd in het vierde en vijfde lid.


      3 Bij alle beladingstoestanden worden vrije vloeistofoppervlakken in de ballasttanks verondersteld en in de
      berekeningen betrokken.


      4 Indien het schip zich in de haven bevindt, is de aanvangsmetacenterhoogte (GM), gecorrigeerd voor de invloed van
      vrije vloeistofoppervlakken bij een helling van 0 graden, ten minste 0,15 meter.


      5 Indien het schip zich op zee bevindt gelden de volgende bepalingen:


      1° De dynamische weg bij een helling van 30 graden is ten minste 0,055 meterradialen en bij een helling van 40
      graden of bij een andere helling waarbij het schip vervuld raakt (Φ) indien deze kleiner is dan 40 graden, niet
      minder dan 0,09 meterradialen. voorts is de toename van de dynamische weg tussen een helling van 30 graden en een
      helling van 40 graden of de helling (Φ) indien deze kleiner is dan 40 graden, niet minder dan 0,03 meterradialen.
      de helling waarbij een schip vervuld raakt (Φ) is de helling waarbij openingen in de romp, de bovenbouwen of
      dekhuizen die niet waterdicht kunnen worden afgesloten, onder water komen, met dien verstande dat bij de toepassing
      van dit criterium kleine openingen waar doorheen, naar het oordeel van het hoofd van de scheepvaartinspectie,
      binnenstromend water niet verder het schip kan binnendringen, niet als open behoeven te worden beschouwd;


      2° de arm van statische stabiliteit bedraagt ten minste 0,20 meter bij een helling van 30 graden of meer;


      3° de maximale waarde van de armen van statische stabiliteit wordt bij voorkeur bereikt bij een helling van ten
      minste 30 graden, doch in geen geval bij een helling van minder dan 25 graden; en


      4° de aanvangsmetacenterhoogte (GM), gecorrigeerd voor de invloed van vrije vloeistofoppervlakken bij 0 graden
      helling, is ten minste 0,15 meter.


      6 In het ontwerp van een olietankschip worden de stabiliteitscriteria, bedoeld in het vierde en vijfde lid, in
      acht genomen.


      7 Voor combinatietankschepen kunnen eenvoudige aanvullende operationele procedures voor vloeistofverplaatsing
      worden toegepast, die aan de kapitein schriftelijk ter beschikking worden gesteld en die:


      1°. ten aanzien van Nederlandse schepen door het Hoofd van de Scheepvaartinspectie zijn goedgekeurd;


      2°. aangeven in welke lading- en ballasttanks, onder alle van toepassing zijnde toestanden van
      vloeistofverplaatsing en de voorkomende soortelijke massa's van de lading, vrije vloeistofoppervlakken mogen
      voorkomen waarbij aan de stabiliteitscriteria, bedoeld in het vierde en vijfde lid, wordt voldaan. Deze tanks
      behoeven niet steeds dezelfde te zijn tijdens de vloeistofverplaatsing en elke combinatie is toegestaan, mits aan
      de stabiliteitscriteria, bedoeld in het vierde en vijfde lid, wordt voldaan;


      3°. duidelijk en begrijpelijk zijn voor de dienstdoende officier, belast met de vloeistofverplaatsing;


      4°. voorzien in een vastgestelde volgorde van operaties waarbij lading, ballast dan wel beide worden verplaatst;


      5°. de mogelijkheid bieden vergelijkingen te maken tussen de verkregen en vereiste stabiliteit door middel van
      stabiliteitsgegevens in grafische of tabelvorm;


      6°. geen uitgebreide wiskundige berekeningen vereisen van de officier, bedoeld in 3°;


      7°. voorzien in corrigerende handelingen, te verrichten door de officier, bedoeld in 3°, in geval van afwijking van
      de aanbevolen waarden en in noodsituaties; en


      8°. nadrukkelijk worden weergegeven in het goedgekeurde trim- en stabiliteitsboekje en in de lading- en
      ballastcontrolekamer en in alle computersoftware waarmee stabiliteitsberekeningen worden gemaakt.
