  - number: '5'
    text: |-
      1 Het Internationaal certificaat van voorkoming van verontreiniging door olie wordt door het Hoofd van de
      Scheepvaartinspectie afgegeven na de voltooiing van een eerste of een hernieuwd onderzoek als bedoeld in
      [artikel 4, eerste lid, onder ][ref1], ten behoeve van elk olietankschip met een tonnage van 150 of meer, alsmede
      ten behoeve van elk schip geen olietankschip zijnde, met een tonnage van 400 of meer.

      2 Het certificaat wordt afgegeven tegen betaling van de kosten verbonden aan het onderzoek ter verkrijging van
      het certificaat alsmede de afgifte daarvan. Onze Minister stelt de tarieven vast voor de vergoeding van de kosten,
      verbonden aan een onderzoek als bedoeld in [artikel 4, eerste lid, onder ][ref2], voorzover dit door een ambtenaar
      van de Scheepvaartinspectie is verricht, en voor de vergoeding van de kosten, verbonden aan de afgifte van het
      certificaat.

      3 Indien afgifte wordt verlangd van meer exemplaren van het certificaat, dan wel indien afgifte wordt verlangd van
      een certificaat in verband met tussentijdse vervanging, behalve voor die welke door scheepsongevallen verloren zijn
      gegaan, worden de kosten verbonden aan de afgifte van dergelijke certificaten in rekening gebracht volgens een door
      Onze Minister vast te stellen tarief.

      4 Indien een onderzoek als bedoeld in [artikel 4, eerste lid, onder ][ref3], buiten Nederland noodzakelijk is,
      komen de reis- en verblijfkosten van de uit te zenden ambtenaren ten laste van de eigenaar.

      5 Indien in Nederland een onderzoek als bedoeld in [artikel 4, eerste lid, onder ][ref4], ten gevolge van de
      regeling der werkzaamheden in het bedrijf plaatsvindt tussen 18 uur en 8 uur, op een zaterdag, op een zondag of op
      een bij het [Algemeen Rijksambtenarenreglement][ref5] daarmee gelijkgestelde dag, is daarvoor door de eigenaar een
      vergoeding verschuldigd, volgens een door Onze Minister vast te stellen tarief.

      6 Indien buiten Nederland een onderzoek als bedoeld in [artikel 4, eerste lid, onder ][ref6], ten gevolge van de
      regeling der werkzaamheden in het bedrijf plaatsvindt buiten de ter plaatse geldende normale werkuren, is daarvoor
      door de eigenaar een vergoeding verschuldigd volgens een door Onze Minister vast te stellen tarief.


