  - number: 13C
    text: |-
      1 Het bepaalde in [het derde tot en met het vijfde lid van artikel 13][ref1] is niet van toepassing op een bestaand
      olietankschip dat uitsluitend wordt ingezet op bepaalde reizen:

      a. tussen havens binnen Nederland; of

      b. tussen havens van staten die partij zijn bij het Verdrag, voorzover deze reizen geheel plaatsvinden binnen
      een bijzonder gebied als bedoeld in [het eerste lid van artikel 10][ref2], of binnen andere, door Onze Minister
      vastgestelde grenzen.

      2 Het bepaalde in het eerste lid is alleen van toepassing indien tevens wordt voldaan aan de navolgende
      voorwaarden:

      a. de havens waar lading wordt ingenomen, zijn voorzien van havenontvangstvoorzieningen die naar het oordeel van
      Onze Minister toereikend zijn voor het ontvangen en verwerken van alle ballast- en tankwaswater van het schip;

      b. alle ballastwater daarbij inbegrepen schone ballast en restanten van het tankwassen, worden tijdens de reis
      aan boord gehouden en bij aankomst in de haven afgegeven aan havenontvangstvoorzieningen, behoudens het bepaalde
      in [artikel 11][ref3];

      c. van het bepaalde onder *b* aantekening wordt gehouden in het oliejournaal als bedoeld in [artikel 20][ref4],
      welke aantekening dient te worden gewaarmerkt door de bevoegde autoriteiten van de havenstaat;

      d. op het certificaat als bedoeld in [artikel 5][ref5] wordt aangetekend dat het schip uitsluitend wordt gebezigd
      voor de reizen als bedoeld in het eerste lid.


