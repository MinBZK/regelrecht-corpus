  - number: '21'
    text: |-
      Installaties dienen, gedurende de tijd dat zij drijven en niet worden gebezigd voor het instellen van een onderzoek
      naar delfstoffen onder de zeebodem of het winnen daarvan, te voldoen aan de bepalingen van dit besluit welke van
      toepassing zijn op schepen geen olietankschepen zijnde, met een tonnage van 400 of meer, met dien verstande dat
      zij:

      a. moeten zijn uitgerust met de voorzieningen als bedoeld in de[ artikelen 16][ref1] en [17][ref2], voorzover
      praktisch uitvoerbaar;

      b. in plaats van het oliejournaal aantekening houden in een staat, volgens een door de Minister van Economische
      Zaken vast te stellen model, van alle werkzaamheden waarbij lozingen van olierestanten of oliehoudende mengsels
      plaatsvinden; en

      c. behoudens het bepaalde in [artikel 11][ref3] geen olierestanten of oliehoudende mengsels in zee mogen lozen,
      tenzij het oliegehalte in het geloosde onverdunde mengsel niet hoger is dan 15 delen per miljoen.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel16
