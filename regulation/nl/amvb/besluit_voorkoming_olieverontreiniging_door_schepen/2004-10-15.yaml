  - number: '20'
    text: |-
      1 Elk olietankschip met een tonnage van 150 of meer en elk schip, geen olietankschip zijnde, met een tonnage
      van 400 of meer, moet zijn voorzien van een oliejournaal [deel I][ref1]. Elk olietankschip met een tonnage van
      150 of meer moet tevens zijn voorzien van een oliejournaal [deel II][ref2]. Het oliejournaal moet zijn ingericht
      overeenkomstig het model als aangegeven in Aanhangsel III van Bijlage I van het Verdrag.

      2 Het oliejournaal dient, indien van toepassing voor elke tank afzonderlijk, te worden ingevuld telkens wanneer een
      van de volgende handelingen plaats vindt aan boord van:

      a. alle schepen:

      1°. het ballasten of schoonmaken van brandstofolietanks;

      2°. het lozen van verontreinigd ballastwater of waswater uit tanks, bedoeld [onder 1°][ref3];

      3°. het verwijderen van oliehoudende restanten; en

      4°. het lozen of afgeven van lenswater dat zich in ruimten voor machines heeft verzameld;

      b. olietankschepen:

      1°. het innemen van ladingolie;

      2°. het overbrengen van ladingolie van de ene tank naar de andere tijdens de reis;

      3°. het lossen van ladingolie;

      4°. het ballasten van ladingtanks en aangewezen schone ballasttanks;

      5°. het schoonmaken van ladingtanks waaronder het wassen met ruwe olie;

      6°. het lozen van ballastwater, behalve vanuit gescheiden ballasttanks;

      7°. het lozen van water uit sloptanks;

      8°. het sluiten van de afsluiters of soortgelijke middelen na het lozen of afgeven van de inhoud van sloptanks;

      9°. het sluiten van afsluiters voor het scheiden van aangewezen schone ballasttanks van laadleidingen en
      nazuigleidingen, na lozing of afgifte van de inhoud van de sloptank; en

      10°. het verwijderen van oliehoudende restanten.

      3 Indien olierestanten of oliehoudende mengsels worden geloosd als bedoeld in [artikel 11][ref4], of indien een
      ongewilde of een buitengewone lozing van olie plaatsvindt welke niet als uitzondering geldt volgens dat artikel,
      dient melding in het oliejournaal te worden gemaakt van de omstandigheden waaronder en de redenen waarom de lozing
      geschiedde.

      4 Elke handeling als bedoeld in het tweede lid dient onverwijld en volledig te worden vermeld, en wel zodanig dat
      alle rubrieken in het oliejournaal die betrekking hebben op de handeling, worden ingevuld. Deze vermelding dient in
      de Nederlandse en in de Engelse taal te worden gesteld.

      Elk deel van het oliejournaal moet door een officier of officieren, belast met het toezicht op de betreffende
      handelingen, worden ondertekend. Elke bladzijde van het oliejournaal dient te worden ondertekend door de kapitein.

      5 a. Het oliejournaal moet, behalve in geval van onbemand gesleepte schepen, op een zodanige plaats aan boord
      worden bewaard dat het op elk redelijk tijdstip beschikbaar is voor onderzoek door de daartoe bevoegde autoriteit.

      b. Het oliejournaal moet gedurende een periode van drie jaar nadat de laatste aantekening erin is gesteld worden
      bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0003936#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0003936#Artikel20
