  - number: 13E
    text: |-
      1 Op elk nieuw ruwe olietankschip met een draagvermogen van 20.000 tonmassa of meer en op elk nieuw
      produktentankschip met een draagvermogen van 30.000 tonmassa of meer dient de ligging van de gescheiden
      ballasttanks, met een inhoud die noodzakelijk is teneinde te kunnen voldoen aan de eisen van [artikel 13][ref1]
      en die binnen het ladingtankgedeelte zijn gelegen, in overeenstemming te zijn met het bepaalde in
      [het tweede, derde en vierde lid van dit artikel][ref2] teneinde een zekere mate van bescherming te bieden tegen
      het uitstromen van olie ingeval van stranding of aanvaring.

      2 Gescheiden ballasttanks en ruimten binnen het ladingtankgedeelte (Lt), geen olietanks zijnde, dienen zodanig te
      zijn gelegen dat aan de volgende eisen wordt voldaan:

      σ PAc + σ PAs = J [Lt (B + 2 D)]

      waarin:

      PAc = voor elke gescheiden ballasttank of ruimte, geen olietank zijnde: de vertikale projektie van de oppervlakte
      van de zijbeplating van de huid, gemeten naar de mal in vierkante meters,

      PAs = voor elke zodanige tank of ruimte: de horizontale projektie van de oppervlakte van de vlakbeplating van de
      huid, gemeten naar de mal in vierkante meters,

      Lt = lengte tussen het voorste en achterste begrenzingsschot van de ladingtanks in meters,

      B = grootste breedte van het schip in meters, zoals omschreven in [het eerste lid, onder ][ref3],

      D = holte naar de mal, vertikaal gemeten van de bovenkant van de kiel tot de bovenkant van de balken van het
      vrijboorddek zoals gedefinieerd in [Bijlage I van het Schepenbesluit 1965][ref4] in de zijde in meters.

      Bij schepen waar de overgang van de huidbeplating naar de dekbeplating als een rondgezette plaat is uitgevoerd,
      moet de holte naar de mal gemeten worden tot het snijpunt van de doorgestrookte lijn van de bovenkant van de balken
      met de doorgestrookte lijn van de buitenkant van de spanten.

      J = 0,45 voor olietankschepen met een draagvermogen van 20.000 tonmassa; 0,30 voor olietankschepen met een
      draagvermogen van 200.000 tonmassa of meer, behoudens het gestelde in [het derde lid van dit artikel][ref5]. Voor
      tussengelegen waarden van het draagvermogen moet de waarde van "J" door lineaire interpolatie worden bepaald.

      Waar in dit artikel de in dit lid vermelde symbolen voorkomen, hebben zij de betekenis zoals omschreven in dit lid.

      3 Voor olietankschepen met een draagvermogen van 200.000 tonmassa of meer mag de waarde van "J" als volgt worden
      verminderd tot:

      of 0,2 welke van de twee de grootste is

      waarin:

      a = 0,25 voor olietankschepen met een draagvermogen van 200.000 tonmassa a = 0,40 voor olietankschepen met een
      draagvermogen van 300.000 tonmassa a 0,50 voor olietankschepen met een draagvermogen van 420.000 tonmassa of meer

      Voor tussengelegen waarden van het draagvermogen moet de waarde van "a" door lineaire interpolatie worden bepaald.

      Oc = als omschreven in [het eerste lid, onder ][ref6]

      Os = als omschreven in [het eerste lid, onder ][ref7]

      OA = de toelaatbare hoeveelheid uitgestroomde olie zoals bepaald in [het tweede lid van artikel 24][ref8].

      4 Bij de vaststelling van de waarden van PAc en PAs voor gescheiden ballasttanks en -ruimten, geen olietanks
      zijnde, is het volgende van toepassing:

      a. de kleinste breedte van elke zijtank of ruimte die zich over de volle hoogte van de scheepszijde, dan wel
      van het dek tot de bovenzijde van de dubbele bodem uitstrekt, mag niet minder zijn dan 2 m. De breedte dient
      binnenboord te worden gemeten vanaf de scheepshuid loodrecht op het vlak van kiel en stevens. Indien deze breedte
      geringer is mag de betreffende zijtank of ruimte niet in de berekening van de bescherming biedende oppervlakte "PAc
      " worden betrokken; en

      b. de kleinste hoogte van elke dubbele bodemtank of ruimte moet tenminste gelijk zijn aan B/15 of 2 m, welke
      van deze waarden de kleinste is. Indien de hoogte geringer is mag de betreffende bodemtank of ruimte niet in de
      berekening van de bescherming biedende oppervlakte "PAs" worden betrokken.

      De kleinste breedte en hoogte van zijtanks en dubbele bodemtanks dienen te worden gemeten buiten het gebied van de
      kimronding; de kleinste breedte moet, indien bij de overgang van huidbeplating naar dekbeplating een rondgezette
      plaat wordt toegepast, worden gemeten buiten het gebied van deze rondgezette plaat.


