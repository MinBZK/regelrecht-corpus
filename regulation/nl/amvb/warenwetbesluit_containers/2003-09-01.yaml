---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: warenwetbesluit_containers
regulatory_layer: AMVB
publication_date: '2009-10-01'
valid_from: '2003-09-01'
bwb_id: BWBR0003584
url: https://wetten.overheid.nl/BWBR0003584/2003-09-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid, mevr. mr. A. Kappeyne van de
    Coppello, in overeenstemming met Onze Minister van Verkeer en Waterstaat, van 24 januari 1983, Directoraat-Generaal
    van de Arbeid, Hoofdafdeling Wetgevingsbeleid, nr. 130773;

    Overwegende dat het wenselijk is regelen te stellen ter uitvoering van de Internationale Overeenkomst voor Veilige
    Containers (Trb. 1976, 28, en 1982, 50);

    Gelet op artikel 1, eerste lid, onder a, artikel 2, artikel 3, eerste en tweede lid, artikel 6, artikel 12, derde
    lid, en artikel 24 van de Wet op de gevaarlijke werktuigen (Stb. 1952, 104);

    De Raad van State gehoord (advies van 25 februari 1983, nr. W12.83.0071/23.3.08);

    Gezien het nader rapport van voornoemde Staatssecretaris van 21 maart 1983, Directoraat-Generaal van de Arbeid,
    Hoofdafdeling Wetgevingsbeleid, nr. 134385;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel1
  - number: 1.a
    text: |-
      container: met hoekstukken toegeruste houder, in gebruik of ten gebruike in het internationale vervoer, die
      ingericht is om meermalen te worden gebruikt voor het vervoer van goederen op of in een vervoermiddel, zonder
      tussentijdse in- of uitlading van die goederen;
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel1
  - number: 1.b
    text: |-
      hoekstukken: aan de boven- of onderzijde van een container dan wel aan die beide zijden aanwezige voorzieningen
      waaraan de container zich laat hanteren of vastzetten;
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel1
  - number: 1.c
    text: 'maximale brutomassa: de maximaal toegestane massa van de container tezamen met zijn lading;'
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel1
  - number: 1.d
    text: |-
      wet: [Warenwet][ref1]

      [ref1]: https://wetten.overheid.nl/BWBR0001969
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001969
  - number: 1.e
    text: |-
      aangewezen instelling: een krachtens [artikel 7a van de wet][ref1] met betrekking tot de keuring van containers
      aangewezen instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel7a
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 7a
  - number: 1a
    text: 'Dit besluit is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel1a
  - number: 1a.1
    text: containers voor het vervoer met behulp van luchtvaartuigen;
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel1a
  - number: 1a.2
    text: |-
      containers met een door de vier bodemhoeken begrensde oppervlakte van minder dan 14 m² of, bij aanwezigheid van
      bovenhoekstukken, van minder dan 7 m²;
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel1a
  - number: 1a.3
    text: containers, zijnde wissellaadbakken, overeenkomstig bij ministeriële regeling gestelde regels.
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel1a
  - number: '2.1'
    text: |-
      Het is verboden containers die niet voldoen aan de vervaardigingsvoorschriften van [hoofdstuk II][ref1], te
      vervaardigen, te verhandelen of te gebruiken.


      [ref1]: https://wetten.overheid.nl/BWBR0003584#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003584
        hoofdstuk: II
  - number: '2.2'
    text: |-
      Het is verboden containers te verhandelen of te gebruiken anders dan met inachtneming van de voorschriften bij of
      krachtens dit besluit gesteld met betrekking tot de aanduiding en het bezigen van vermeldingen.
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel2
  - number: '2.3'
    text: |-
      Het is verboden containers te verhandelen of te gebruiken, indien de bij of krachtens dit besluit voorgeschreven
      keuringsprocedures niet in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel2
  - number: '2.4'
    text: |-
      Het is verboden containers te behandelen of te vervoeren anders dan met inachtneming van de voorschriften bij of
      krachtens dit besluit gesteld met betrekking tot de wijze van vervoeren en behandelen.
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel2
  - number: '3'
    text: |-
      Een container is van zodanige materialen vervaardigd en is ook overigens zodanig uitgevoerd, dat hij een keuring
      als bedoeld in [artikel 8][ref1] kan doorstaan, zonder dat een blijvende vormverandering of een andere afwijking
      ontstaat, die de container ongeschikt maakt voor het gebruik waarvoor hij bestemd is.


      [ref1]: https://wetten.overheid.nl/BWBR0003584#Artikel8
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003584
        artikel: '8'
        hoofdstuk: III
  - number: '4'
    text: |-
      Onze Minister kan met betrekking tot containers die uitgerust zijn met een of meer onderdelen, bestemd om slechts
      te worden gebruikt wanneer de containers in onbeladen toestand worden gehesen of geheven, regels stellen ten
      aanzien van het aanbrengen van kentekenen op die containers.
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel4
  - number: '5.1'
    text: Een container wordt gekeurd.
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel5
  - number: '5.2'
    text: |-
      Indien van een container meerdere onderling gelijke exemplaren worden vervaardigd, kan worden volstaan met keuring
      van een of zoveel meer het type kenmerkende monsters als de aangewezen instelling in het belang van het verrichten
      van de keuring noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel5
  - number: '5.3'
    text: |-
      Voor de toepassing van het tweede lid zijn containers onderling gelijk, indien zij slechts zodanig afwijken van het
      goedgekeurde monster of de goedgekeurde monsters dat de afwijking naar het oordeel van de aangewezen instelling de
      resultaten van een keuring als bedoeld in [artikel 8][ref1] niet op onaanvaardbare wijze beïnvloedt. De aangewezen
      instelling verricht daartoe beproevingen en onderzoekingen op door haar aan te wijzen monsters.


      [ref1]: https://wetten.overheid.nl/BWBR0003584#Artikel8
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003584
        artikel: '8'
        hoofdstuk: III
  - number: '6'
    text: Een te keuren container wordt in bedrijfsvaardige staat voor keuring beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel6
  - number: '7.1'
    text: |-
      Bij toepassing van [artikel 5, tweede lid][ref1], gaat de aanvraag van de keuring vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0003584#Artikel5
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003584
        artikel: '5'
        hoofdstuk: III
  - number: 7.1.a
    text: tekeningen en een ontwerp-specificatie met betrekking tot het type van de container, alsmede
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel7
  - number: 7.1.b
    text: |-
      een opgave van de type-aanduiding en het serienummer zoals de fabrikant een en ander voor het type van de container
      heeft bestemd.
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel7
  - number: '7.2'
    text: |-
      De aangewezen instelling is bevoegd aanvullende gegevens te verlangen, indien zij dat in het belang van het
      verrichten van de keuring noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel7
  - number: '8.1'
    text: 'De keuring omvat:'
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel8
  - number: 8.1.a
    text: een hefbeproeving,
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel8
  - number: 8.1.b
    text: een stapelbeproeving,
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel8
  - number: 8.1.c
    text: een puntbelastingsbeproeving,
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel8
  - number: 8.1.d
    text: een torsiebeproeving,
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel8
  - number: 8.1.e
    text: een beproeving van de weerstand tegen vervorming in de lengterichting (statische belasting),
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel8
  - number: 8.1.f
    text: een beproeving van de kopwanden en
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel8
  - number: 8.1.g
    text: een beproeving van de zijwanden.
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel8
  - number: '8.2'
    text: Onze Minister kan met betrekking tot het in het eerste lid bepaalde nadere regelen stellen.
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel8
  - number: 8a.1
    text: |-
      Nadat de keuring heeft plaatsgevonden worden containers die naar het oordeel van de aangewezen instelling voldoen
      aan artikel 3 voorzien van een merk van goedkeuring.
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel8a
  - number: 8a.2
    text: |-
      Bij toepassing van artikel 5, tweede lid, wordt iedere container die overeenkomstig het goedgekeurde, het type
      kenmerkende monster is vervaardigd zonder nadere keuring van een merk van goedkeuring voorzien.
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel8a
  - number: 8a.3
    text: 'Bij ministeriële regeling worden nadere regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel8a
  - number: 8a.3.a
    text: het merk van goedkeuring;
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel8a
  - number: 8a.3.b
    text: het bevoegd verklaren van fabrikanten en handelaren tot het aanbrengen van het merk van goedkeuring en
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel8a
  - number: 8a.3.c
    text: |-
      de gelijkstelling van in het buitenland aangebrachte merken van goedkeuring met de in het eerste en tweede lid
      bedoelde merken van goedkeuring.
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel8a
  - number: '9'
    text: |-
      De aangewezen instelling geeft de gekeurde container of containers in de staat waarin deze zich na de keuring
      bevindt onderscheidenlijk bevinden, aan de aanvrager terug.
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel9
  - number: 9a
    text: |-
      De aangewezen instelling is bevoegd om ten aanzien van goedgekeurde containers die zodanig zijn gewijzigd dat
      daardoor structurele veranderingen zijn ontstaan, een passende, hernieuwde beproeving van de container te verlangen
      voordat een nieuw certificaat wordt afgegeven.
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel9a
  - number: '10'
    text: |-
      Degene die een container belaadt of vervoert, zorgt ervoor dat de container zodanig wordt beladen onderscheidenlijk
      vastgezet, dat hij niet wordt onderworpen aan grotere krachten dan waarvoor hij ontworpen is.
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel10
  - number: '11.1'
    text: |-
      De eigenaar van een container zorgt ervoor dat de container, indien deze wordt voorhanden gehouden, afgeleverd,
      vervoerd, gebruikt of ten toon gesteld, in een veilige staat verkeert.
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel11
  - number: '11.2'
    text: |-
      Voor de naleving van het eerste lid wordt de container in elk geval na verloop van ten hoogste vijf jaren sedert
      de datum van gereedkoming en vervolgens telkens na verloop van ten hoogste twee-en-een-half jaar op zijn veilige
      staat onderzocht.
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel11
  - number: '12.1'
    text: |-
      De eigenaar van een container zorgt ervoor dat op de container, indien deze wordt vervoerd, verhandeld
      of gebruikt, duidelijk de maand en het jaar vermeld zijn, voor het begin waarvan de container ingevolge
      [artikel 11, tweede lid][ref1], moet worden onderzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0003584#Artikel11
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003584
        artikel: '11'
        hoofdstuk: IV
  - number: '12.2'
    text: |-
      Voor de naleving van het eerste lid wordt de vermelding met betrekking tot de tweeënhalfjaarlijkse onderzoekingen
      op of zoveel mogelijk nabij het merk van goedkeuring aangebracht, tenzij daaromtrent bij regeling van Onze Minister
      een andere regel is gesteld.
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel12
  - number: '12.3'
    text: |-
      Ontheffing van het eerste lid bepaalde wordt slechts verleend, indien de eigenaar aantoont dat de container
      regelmatig op zijn veilige staat wordt onderzocht.
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel12
  - number: '13'
    text: |-
      De eigenaar van een container waarvan geen meerdere onderling gelijke exemplaren worden vervaardigd, zorgt ervoor
      dat, indien de container wordt vervoerd, verhandeld, gebruikt, hersteld, onderhouden of nagezien, het merk van
      goedkeuring duurzaam aangebracht is op een goed zichtbare en zo weinig mogelijk kwetsbare plaats op de container
      nabij andere wettelijk voorgeschreven aanduidingen.
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel13
  - number: 13a
    text: |-
      De eigenaar van een container zorgt er voor dat op de container, indien deze wordt vervoerd, verhandeld, of
      gebruikt, alle aanduidingen van de maximale brutomassa overeenstemmen met de gegevens inzake de maximale brutomassa
      op het merk van goedkeuring.
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel13a
  - number: 13b
    text: 'De eigenaar van een container verwijdert het merk van goedkeuring indien:'
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel13b
  - number: 13b.a
    text: |-
      de container door wijzigingen zodanig afwijkt van het goedgekeurde, het type kenmerkende monster of de
      goedgekeurde, het type kenmerkende monsters dat de goedkeuring niet meer kan worden geacht op de container
      betrekking te hebben;
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel13b
  - number: 13b.b
    text: de container buiten gebruik is gesteld en niet meer wordt onderhouden;
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel13b
  - number: 13b.c
    text: de goedkeuring door de aangewezen instelling is ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel13b
  - number: 13c
    text: |-
      De eigenaar van een container die na de goedkeuring zodanig is gewijzigd dat daardoor structurele veranderingen
      zijn ontstaan stelt de aangewezen instelling daarvan in kennis.
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel13c
  - number: '14'
    text: |-
      Het bepaalde in [de artikelen 11][ref1], [12][ref2], [13][ref3], [13a][ref4], [13b][ref5] en [13c][ref6] is van
      overeenkomstige toepassing op degene die ingevolge een overeenkomst met de eigenaar verplicht is tot naleving van
      die artikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003584#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003584#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0003584#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0003584#Artikel13a
      [ref5]: https://wetten.overheid.nl/BWBR0003584#Artikel13b
      [ref6]: https://wetten.overheid.nl/BWBR0003584#Artikel13c
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003584
        artikel: '11'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003584
        artikel: '12'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0003584
        artikel: '13'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0003584
        artikel: 13a
        hoofdstuk: IV
      - id: ref5
        bwb_id: BWBR0003584
        artikel: 13b
        hoofdstuk: IV
      - id: ref6
        bwb_id: BWBR0003584
        artikel: 13c
        hoofdstuk: IV
  - number: '15.1'
    text: 'Als aangewezen instelling kan worden aangewezen een instelling die:'
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel15
  - number: 15.1.a
    text: rechtspersoonlijkheid heeft;
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel15
  - number: 15.1.b
    text: haar zetel of een vestiging in Nederland heeft;
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel15
  - number: 15.1.c
    text: |-
      onafhankelijk is van degenen die bij het resultaat van de uitvoering van de taken waarvoor zij is aangewezen belang
      hebben;
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel15
  - number: 15.1.d
    text: |-
      beschikt over voldoende deskundigheid en outillage om de uitvoering van de taken waarvoor zij is aangewezen, naar
      behoren te kunnen vervullen;
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel15
  - number: 15.1.e
    text: |-
      beschikt over een behoorlijke administratie waarin de gegevens die samenhangen met en betrekking hebben op de
      uitvoering van haar taken, op een systematische wijze zijn vastgelegd. Aan de hand van deze gegevens zijn de
      gekeurde containers, die het type kenmerken, afdoende te identificeren;
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel15
  - number: 15.1.f
    text: naar behoren functioneert.
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel15
  - number: '15.2'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel15
  - number: 15a
    text: |-
      De aangewezen instelling verstrekt jaarlijks aan Onze Minister een afschrift van de polis van de afgesloten
      verzekering tegen wettelijke aansprakelijkheid tegen alle risico's die voortvloeien uit de uitoefening van de taken
      waarvoor zij is aangewezen.
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel15a
  - number: 15b.1
    text: |-
      Indien een wijziging plaatsvindt in de gegevens op grond waarvan de instelling is aangewezen, doet de instelling
      hiervan terstond mededeling aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel15b
  - number: 15b.2
    text: |-
      Indien een instelling voornemens is een of meer van de taken waarvoor zij is aangewezen, te beëindigen, doet
      de instelling hiervan terstond mededeling aan Onze Minister en de certificaathouders. In dat geval worden door
      de instelling de gegevens, bedoeld in artikel 15, eerste lid, onder e, overgedragen aan Onze Minister dan wel,
      na toestemming van Onze Minister en de certificaathouders, een andere instelling die voor dezelfde taken is
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel15b
  - number: 15c.1
    text: |-
      Een aanvraag om aanwijzing gaat vergezeld van het bewijs dat is voldaan aan de criteria, bedoeld in artikel 15,
      eerste lid, dan wel van een verklaring waaruit de bereidheid blijkt om voor eigen rekening een onderzoek naar het
      voldoen aan deze criteria te ondergaan.
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel15c
  - number: 15c.2
    text: |-
      Een aanwijzing kan worden geweigerd, dan wel worden gewijzigd of ingetrokken, indien niet of niet volledig is
      voldaan aan de bij de wet of bij of krachtens dit besluit gestelde voorschriften. Een aanwijzing kan worden
      ingetrokken indien de instelling gedurende een aaneengesloten periode van twee jaar geen werkzaamheden, waarvoor
      zij is aangewezen, heeft uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel15c
  - number: 15c.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel15c
  - number: '20'
    text: Dit besluit kan worden aangehaald als "Besluit containers".
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel20
  - number: '21'
    text: Dit besluit treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0003584/2003-09-01#Artikel21
