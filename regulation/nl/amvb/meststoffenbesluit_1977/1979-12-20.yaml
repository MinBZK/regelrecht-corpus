preamble:
  text: >-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.


    Op de voordracht van Onze Minister van Landbouw en Visserij van 27 mei 1977, nr. J. 1417, Directie Juridische en
    Bedrijfsorganisatorische Zaken;


    Overwegende dat het wenselijk is nieuwe voorschriften vast te stellen met betrekking tot het vervoeren en verkopen
    van meststoffen ter uitvoering van de Richtlijn van de Raad van de Europese Gemeenschappen van 18 december 1975
    (76/116/EEG) betreffende de onderlinge aanpassing van de wetgevingen van de Lid-Staten inzake meststoffen (Pb. 30
    januari 1976, no. L 24);


    Gelet op artikel 2 en artikel 3, eerste en derde lid, van de Meststoffenwet 1947;


    De Raad van State gehoord (advies van 15 juni 1977, nr. 16);


    Gezien het nader rapport van Onze voornoemde Minister van 6 juli 1977, nr. J. 1818, Directie Juridische en
    Bedrijfsorganisatorische Zaken;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003115/1979-12-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Dit besluit neemt over de terminologie van de [Meststoffenwet 1947][ref1] (Stb. H. 123) en verstaat voorts onder:

      "Directeur-Generaal": de Directeur-Generaal voor de Landbouw en de Voedselvoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0002028
    url: https://wetten.overheid.nl/BWBR0003115/1979-12-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002028
  - number: '2'
    text: >-
      Het is verboden een meststof, welke niet is vermeld op een door Onze Minister vast te stellen lijst, te vervoeren
      of te verkopen.
    url: https://wetten.overheid.nl/BWBR0003115/1979-12-20#Artikel2
  - number: '3'
    text: |-
      Het is verboden een meststof, welke is vermeld op de in [artikel 2][ref1] bedoelde lijst te vervoeren of te
      verkopen, indien deze niet voldoet aan door Onze Minister gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0003115#Artikel2
    url: https://wetten.overheid.nl/BWBR0003115/1979-12-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003115
        artikel: '2'
  - number: '4'
    text: |-
      Het is verboden een meststof welke is vermeld op de in [artikel 2][ref1] bedoelde lijst, te vervoeren of te
      verkopen, indien:

      a. de door Onze Minister voorgeschreven aanduidingen en vermeldingen niet goed zichtbaar, duidelijk leesbaar,
      onuitwisbaar en onveranderd voorkomen:

      - op de verpakking of op een daarop bevestigd etiket of daaraan bevestigde label indien de verpakkingseenheid een
      gewicht heeft van niet meer dan 100 kg;
      - op de verpakking of op een daarop bevestigd etiket of daaraan bevestigde label of in een daarbij gevoegd
      schriftelijk stuk, indien de verpakkingseenheid een gewicht heeft van meer dan 100 kg;
      - in een bij de meststof gevoegd schriftelijk stuk voor wat betreft onverpakte meststoffen;

      b. op verpakkingsmateriaal, waarin de meststof zich bevindt, of op een daarop bevestigd etiket of daaraan
      bevestigde label dan wel in een bij de meststof gevoegd schriftelijk stuk:

      1°. enige vermelding omtrent aard, gehalten, verdere samenstelling, hoedanigheden, merk, handelsbenaming, wijze
      van gebruik, opslag of behandeling van de meststof voorkomt, welke niet door Onze Minister is voorgeschreven of
      toegestaan;

      2°. de vermelding "EEG-MESTSTOF" of enige andere aanduiding, welke de indruk kan wekken dat de meststof voldoet
      aan door de E.G. vastgestelde normen, voorkomt, tenzij het gebruik van deze vermelding door Onze Minister is
      toegestaan;

      3°. enige aanduiding of vermelding voorkomt waardoor bij het publiek een onjuiste of misleidende indruk kan worden
      gewekt omtrent gegevens als bedoeld onder 1° en 2°;

      4°. de door Onze Minister gegeven voorschriften omtrent de onderlinge scheiding van aanduidingen of vermeldingen
      niet zijn in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003115#Artikel2
    url: https://wetten.overheid.nl/BWBR0003115/1979-12-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003115
        artikel: '2'
  - number: '5'
    text: |-
      Het is verboden een verpakte meststof, welke is vermeld op de in [artikel 2][ref1] bedoelde lijst, te vervoeren
      of te verkopen, indien de verpakking niet overeenkomstig de door Onze Minister gegeven voorschriften is gesloten
      of verzegeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003115#Artikel2
    url: https://wetten.overheid.nl/BWBR0003115/1979-12-20#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003115
        artikel: '2'
  - number: '6'
    text: |-
      Het is verboden een meststof, welke is vermeld op de in [artikel 2][ref1] bedoelde lijst, bij geschrifte te koop
      aan te bieden, indien in de schriftelijke aanbieding:

      a. niet duidelijk leesbaar en onveranderd de aanduidingen en vermeldingen, bedoeld in [artikel 4, onder a][ref2],
      voorkomen;

      b. enige aanduiding of vermelding, bedoeld in [artikel 4, onder b][ref3], voorkomt.


      [ref1]: https://wetten.overheid.nl/BWBR0003115#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003115#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003115#Artikel4
    url: https://wetten.overheid.nl/BWBR0003115/1979-12-20#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003115
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003115
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0003115
        artikel: '4'
  - number: '7'
    text: >-
      1 De Directeur-Generaal kan van de in dit besluit gestelde verbodsbepalingen, al dan niet onder voorwaarden,
      ontheffing verlenen.


      2 In de gevallen door de Directeur-Generaal aangewezen en met inachtneming van door hem gestelde regelen kan
      de directeur van het Rijks-Kwaliteitsinstituut voor land- en tuinbouwprodukten te Wageningen, al dan niet onder
      voorwaarden van de in dit besluit gestelde verbodsbepalingen een bijzondere ontheffing, betrekking hebbende op een
      bepaalde partij van een meststof, verlenen.
    url: https://wetten.overheid.nl/BWBR0003115/1979-12-20#Artikel7
  - number: '8'
    text: >-
      Onze Minister geeft voorschriften betreffende de wijze waarop de ontheffingen, bedoeld in het vorige artikel,
      moeten worden aangevraagd, de behandeling der aanvrage, de wijze waarop de ontheffingen worden verleend, alsmede de
      voldoening van de kosten van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0003115/1979-12-20#Artikel8
  - number: '9'
    text: Het Meststoffenbesluit 1951 (Stb. K. 671) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003115/1979-12-20#Artikel9
  - number: '10'
    text: >-
      Het vervoeren en verkopen van meststoffen ten aanzien waarvan niet voldaan is aan het bij of krachtens dit besluit
      bepaalde is tot 1 januari 1979 nog toegestaan, voor zover ten aanzien van die meststoffen is voldaan aan de
      bepalingen, gesteld bij of krachtens het Meststoffenbesluit 1951, zoals deze luiden op 17 december 1977.
    url: https://wetten.overheid.nl/BWBR0003115/1979-12-20#Artikel10
  - number: '11'
    text: >-
      1 Dit besluit kan worden aangehaald als: "Meststoffenbesluit 1977".


      2 Het treedt in werking met ingang van 18 december 1977.
    url: https://wetten.overheid.nl/BWBR0003115/1979-12-20#Artikel11
