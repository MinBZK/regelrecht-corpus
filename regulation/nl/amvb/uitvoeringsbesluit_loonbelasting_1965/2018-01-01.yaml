      1 Als perioden die meetellen als deelnemingsjaren, als bedoeld in [artikel 18][ref1] en [18e van de wet][ref2],
      worden in aanmerking genomen:

      a. de perioden die ingevolge [artikel 10a, eerste lid, onderdelen a, b en g][ref3], als dienstjaren in aanmerking
      zijn genomen;

      b. de perioden gedurende welke de werknemer in dienstbetrekking heeft gestaan tot een andere inhoudingsplichtige,
      indien ter zake van het in die dienstbetrekking opgebouwde ouderdomspensioen waardeoverdracht van
      pensioenkapitaal, als bedoeld in de [artikelen 71][ref4], [74][ref5], [75][ref6], [85 tot en met 88][ref7]
      en [91 van de Pensioenwet][ref8], naar de huidige inhoudingsplichtige of de pensioenuitvoerder van de huidige
      inhoudingsplichtige heeft plaatsgevonden;

      c. de perioden gedurende welke de werknemer in dienstbetrekking heeft gestaan tot een andere inhoudingsplichtige,
      indien ter zake van deze perioden met toepassing van [artikel 10a, tweede of derde lid][ref9], inkoop van
      dienstjaren heeft plaatsgevonden;

      voor zover met schriftelijke bescheiden kan worden gestaafd dat deze perioden bij de opbouw van het
      ouderdomspensioen in aanmerking zijn genomen.

      2 Als perioden die meetellen als deelnemingsjaren kunnen eveneens in aanmerking worden genomen dienstjaren
      ten gevolge van een voor 1 januari 2005 gedane waardeoverdracht van pensioenkapitaal, als bedoeld in de
      [artikelen 32, vierde lid][ref10], [32a][ref11] of [32b van de Pensioen- en spaarfondsenwet][ref12], zoals deze
      artikelen luidden op 31 december 2006, voor zover met schriftelijke bescheiden kan worden gestaafd dat deze
      dienstjaren bij de opbouw van het ouderdomspensioen in aanmerking zijn genomen.

      3 Als perioden die meetellen als deelnemingsjaren kunnen eveneens in aanmerking worden genomen perioden
      gedurende welke de werknemer in dienstbetrekking heeft gestaan tot een andere inhoudingsplichtige
      of een met de inhoudingsplichtige of een andere inhoudingsplichtige verbonden lichaam als bedoeld in
      [artikel 10a, vierde lid, van de Wet op de vennootschapsbelasting 1969][ref13], dat niet in Nederland is gevestigd,
      voor zover met schriftelijke bescheiden kan worden gestaafd dat deze perioden door die andere inhoudingsplichtige
      of dat lichaam bij de opbouw van het ouderdomspensioen of van een voorziening voor ouderdom ingevolge een
      pensioenregeling als bedoeld in [artikel 1.7, tweede lid, onderdeel c, van de Wet inkomstenbelasting 2001][ref14],
      in aanmerking zijn genomen.

      4 Bij dienstbetrekkingen in deeltijd wordt het ingevolge [artikel 18e van de wet][ref15] geldende
      maximum verlaagd overeenkomstig de per deelnemingsjaar geldende deeltijdfactor, met dien verstande dat
      [artikel 10a, vierde lid][ref16], van overeenkomstige toepassing is.

      5 Bij toepassing van het eerste lid, onderdeel c, of derde lid, wordt voor de toepassing van
      [artikel 18e, eerste lid, onderdeel b, en vierde lid, van de wet][ref17] het deelnemingsjarenpensioen opgevat met
      inbegrip van de uit die andere dienstbetrekking voortvloeiende:

      a. uitkeringen ingevolge een ouderdomspensioen;

      b. uitkeringen ingevolge een deelnemingsjarenpensioen;

      c. uitkeringen ingevolge een overbruggingspensioen als bedoeld in [artikel 18e][ref18], zoals dit artikel op 31
      december 2004 luidde;

      d. uitkeringen ingevolge een regeling voor vervroegde uittreding als bedoeld in [artikel 18i][ref19], zoals dit
      artikel op 31 december 2004 luidde;

      e. uitkeringen ingevolge een prepensioen als bedoeld in [artikel 38a][ref20], zoals dit artikel op 31 december
      2004 luidde.

      6 Indien perioden gedurende welke de werknemer in dienstbetrekking heeft gestaan tot een met
      de inhoudingsplichtige of een andere inhoudingsplichtige verbonden lichaam als bedoeld in
      [artikel 10a, vierde lid, van de Wet op de vennootschapsbelasting 1969][ref21], dat niet in Nederland
      is gevestigd, in aanmerking worden genomen als deelnemingsjaren, wordt voor de toepassing van
      [artikel 18e, eerste lid, onderdeel b, en vierde lid, van de wet][ref22] het deelnemingsjarenpensioen opgevat
      met inbegrip van de uitkeringen ingevolge de bij dat lichaam opgebouwde voorziening voor ouderdom in een
      pensioenregeling als bedoeld in [artikel 1.7, tweede lid, onderdeel c, van de Wet inkomstenbelasting 2001][ref23].


