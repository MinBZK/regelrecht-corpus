  - number: 2c
    text: |-
      1 Als dienstbetrekking wordt beschouwd de arbeidsverhouding van degene, die persoonlijk arbeid verricht op
      doorgaans ten minste 2 dagen per week tegen een bruto-inkomen dat doorgaans over een week ten minste zal bedragen
      2/5 maal het bedrag, genoemd in [artikel 8, eerste lid, onderdeel ][ref1], dan wel, voor degene, die de leeftijd
      van 22 jaar nog niet heeft bereikt en wiens bruto-inkomen uitsluitend in verband met zijn leeftijd op een lager
      bedrag is vastgesteld, 2/5 maal het krachtens genoemde wet voor een werknemer van dezelfde leeftijd geldende
      bedrag.

      2 Het eerste lid is niet van toepassing met betrekking tot een arbeidsverhouding die is aangegaan voor korter dan
      een maand.

      3 Indien binnen een maand na het einde van een arbeidsverhouding met dezelfde opdrachtgever een nieuwe
      arbeidsverhouding wordt aangegaan, geldt het bepaalde in het tweede lid niet ten aanzien van die nieuwe
      arbeidsverhouding, tenzij de tijdvakken voor welke die arbeidsverhoudingen zijn aangegaan te zamen korter zijn dan
      een maand.

      4 Het eerste lid is niet van toepassing met betrekking tot de arbeidsverhouding van degene die tegen beloning
      persoonlijk arbeid verricht, indien:

      a. zijn arbeidsverhouding tevens is een arbeidsverhouding als bedoeld in [artikel 2][ref2] of [artikel 3][ref3] van
      de wet, ongeacht of hij ingevolge het bij of krachtens die artikelen bepaalde al dan niet werknemer is;

      b. hij als bestuurder van een vereniging of stichting werkzaam is voor die vereniging of stichting.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel3
    url: https://wetten.overheid.nl/BWBR0002489/2018-01-01#Artikel2c
