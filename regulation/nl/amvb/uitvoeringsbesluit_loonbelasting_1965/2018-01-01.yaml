  - number: 2f
    text: |-
      1 Indien een arbeidsverhouding, beoordeeld uitsluitend aan de hand van de eerste leden van de
      [artikelen 2 tot en met 2c][ref1], op grond van meer dan één van die leden als dienstbetrekking wordt beschouwd,
      vindt alleen dat artikel toepassing in het eerste lid waarvan zulks voor de eerste maal geschiedt.

      2 Indien een arbeidsverhouding zowel op grond van [artikel 2ca][ref2], als op grond van [artikel 2][ref3],
      [2a][ref4], [2b][ref5] of [2c][ref6] als dienstbetrekking wordt beschouwd, vindt alleen [artikel 2ca][ref7]
      toepassing. Voor de toepassing van de eerste volzin wordt [artikel 2e, vierde lid][ref8], buiten beschouwing
      gelaten.


