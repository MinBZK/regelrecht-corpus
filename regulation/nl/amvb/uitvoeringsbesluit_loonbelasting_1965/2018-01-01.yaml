  - number: 12c
    text: |-
      1 Indien een aanspraak ingevolge een pensioenregeling waarvan een lichaam als bedoeld in
      [artikel 19a, eerste lid, onderdelen d of e, van de wet][ref1], zoals dat artikel luidde op 31 december 2016, als
      verzekeraar optreedt, wordt afgekocht of omgezet in een aanspraak ingevolge een oudedagsverplichting als bedoeld in
      artikel 38n, tweede lid, van de wet, verstrekt de werknemer of gewezen werknemer de volgende informatie:

      a. naam, fiscale woonstaat en burgerservicenummer of, bij het ontbreken van het burgerservicenummer, een hiermee
      vergelijkbaar door de fiscale woonstaat toegekend fiscaal identificatienummer van de werknemer of gewezen
      werknemer;

      b. naam en uniek nummer als bedoeld in de [Handelsregisterwet 2007][ref2], of bij het ontbreken van een
      dergelijk nummer en indien dat bestaat, een hiermee vergelijkbaar door de fiscale woonstaat toegekend fiscaal
      identificatienummer van het lichaam, bedoeld in de aanhef;

      c. indien de werknemer of gewezen werknemer een partner of gewezen partner als bedoeld in artikel 38n, vierde
      lid, van de wet heeft: naam en burgerservicenummer of, bij het ontbreken van het burgerservicenummer, een hiermee
      vergelijkbaar door de fiscale woonstaat toegekend fiscaal identificatienummer van deze partner of gewezen partner;

      d. de door de werknemer of gewezen werknemer gemaakte keuze, bedoeld in artikel 38n, tweede lid, van de wet, tussen
      afkoop en omzetting in een aanspraak ingevolge een oudedagsverplichting;

      e. het tijdstip van de afkoop of omzetting, bedoeld in artikel 38n, tweede lid, van de wet;

      f. de fiscale balanswaarde, bedoeld in artikel 38n, derde lid, van de wet, van de tegenover de aanspraak ingevolge
      een pensioenregeling, bedoeld in de aanhef, staande verplichting, bij het lichaam, bedoeld in de aanhef:

      1°. op 1 januari 2015 of, indien het boekjaar afwijkt van het kalenderjaar, op de beginbalans van het boekjaar dat
      eindigde in 2015;

      2°. op 31 december 2015 of, indien het boekjaar afwijkt van het kalenderjaar, op de eindbalans van het boekjaar dat
      eindigde in 2015;

      3°. op 31 december 2016;

      4°. op het tijdstip van afkoop of omzetting, bedoeld in de aanhef; en

      g. indien de aanspraak ingevolge een pensioenregeling, bedoeld in de aanhef, is omgezet in een aanspraak ingevolge
      een oudedagsverplichting als bedoeld in artikel 38p van de wet en de werknemer of gewezen werknemer een partner of
      gewezen partner heeft: of er een afspraak is gemaakt tussen de werknemer of gewezen werknemer en diens partner of
      gewezen partner over de verdeling van deze aanspraak ingevolge een oudedagsverplichting in geval van beëindiging
      van het partnerschap.

      2 De gegevens, bedoeld in het eerste lid, worden aangeleverd binnen een maand na het tijdstip van afkoop of
      omzetting als bedoeld in het eerste lid door het toesturen van het hiervoor door de Belastingdienst beschikbaar
      gestelde informatieformulier. Indien de werknemer of gewezen werknemer een partner of gewezen partner als bedoeld
      in artikel 38n, vierde lid, van de wet heeft, wordt het informatieformulier medeondertekend door deze partner,
      onderscheidenlijk gewezen partner.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
