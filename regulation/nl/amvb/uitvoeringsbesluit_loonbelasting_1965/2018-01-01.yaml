        artikel: 5a
  - number: 3a
    text: |-
      Ingeval degene die ter voorziening in de algemeen noodzakelijke kosten van het bestaan periodieke uitkeringen
      ingevolge de [Participatiewet][ref1] verstrekt, bij het vaststellen van de hoogte van die uitkeringen rekening
      houdt met een rechtstreeks uit het familierecht voortvloeiende uitkering of verstrekking in de zin van
      [artikel 3.101, eerste lid, onderdeel b, van de Wet inkomstenbelasting 2001][ref2], niet zijnde een termijn van
      lijfrente, als bedoeld in [artikel 11, eerste lid, onderdeel a][ref3], wordt deze geacht die uit het familierecht
      voortvloeiende uitkering of verstrekking als loon in geld ingevolge de Participatiewet te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3.101
      [ref3]: https://wetten.overheid.nl/BWBR0002489#Artikel11
    url: https://wetten.overheid.nl/BWBR0002489/2018-01-01#Artikel3a
