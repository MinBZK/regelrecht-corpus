  - number: 10eb
    text: |-
      1 Een werknemer bezit specifieke deskundigheid indien het loon, bedoeld in
      [paragraaf 3.3.1 van de Wet inkomstenbelasting 2001][ref1], op jaarbasis meer bedraagt dan € 37.296.

      2 In afwijking van het eerste lid bezit een werknemer die in het wetenschappelijk onderwijs een
      Nederlandse mastergraad of een hiermee gelijkwaardige buitenlandse graad heeft behaald en die de
      leeftijd van 30 jaar nog niet heeft bereikt, specifieke deskundigheid indien het loon, bedoeld in
      [paragraaf 3.3.1 van de Wet inkomstenbelasting 2001][ref2], op jaarbasis meer bedraagt dan € 28.350.

      3 In afwijking in zoverre van het eerste en tweede lid bezit een werknemer ook specifieke deskundigheid indien
      de werknemer:

      a. in het kader van wetenschappelijk onderzoek of wetenschappelijk onderwijs in Nederland wordt tewerkgesteld bij
      een onderzoeksinstelling als bedoeld in [artikel 1.11, onderdelen a of b, van het Vreemdelingenbesluit 2000][ref3],
      of

      b. in Nederland wordt tewerkgesteld als arts in opleiding tot specialist aan een door de Medisch Specialisten
      Registratie Commissie, de Sociaal-Geneeskundigen Registratie Commissie of de Huisarts en Verpleeghuisarts
      Registratie Commissie aangewezen opleidingsinstituut.

      4 Bij de beoordeling of de specifieke deskundigheid die een ingekomen werknemer bezit niet of schaars aanwezig
      is op de Nederlandse arbeidsmarkt, wordt in onderlinge samenhang rekening gehouden met de volgende factoren, voor
      zover relevant:

      a. het niveau van de door de werknemer gevolgde opleiding;

      b. de voor de functie relevante ervaring van de werknemer;

      c. het beloningsniveau van de onderhavige functie in Nederland in verhouding tot het beloningsniveau in het land
      van herkomst van de werknemer.

      5 Bij het begin van het kalenderjaar worden de in het eerste en tweede lid genoemde bedragen bij ministeriële
      regeling gewijzigd in andere bedragen. Deze bedragen worden berekend door de te wijzigen bedragen te
      vermenigvuldigen met de tabelcorrectiefactor, bedoeld in [artikel 10.2 van de Wet inkomstenbelasting 2001][ref4],
      en vervolgens de nodig geachte afronding aan te brengen. Indien in het voorafgaande kalenderjaar een dergelijke
      afronding is toegepast, kan bij wijziging worden uitgegaan van het niet-afgeronde bedrag.

      6 Bij ministeriële regeling kunnen nadere regels worden gesteld ter zake van de toepassing van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Paragraaf3.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Paragraaf3.3.1
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel1.11
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel10.2
