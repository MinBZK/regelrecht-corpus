  - number: 2h
    text: |-
      1 Als dienstbetrekking wordt voorts beschouwd de arbeidsverhouding van degene die arbeid verricht ten behoeve
      van een lichaam waarin hij of zijn partner een aanmerkelijk belang heeft ingeval die arbeidsverhouding niet
      reeds op grond van de wet of de [artikelen 2 tot en met 2c][ref1], in samenhang met [artikel 2e][ref2] of
      [artikel 2g][ref3], als dienstbetrekking wordt beschouwd.

      2 Voor de toepassing van dit artikel wordt verstaan onder:

      a. *partner:* een in [artikel 3.91, tweede lid, onderdeel b, onder 1°, van de Wet inkomstenbelasting 2001][ref4]
      aangeduide persoon;

      b. *een aanmerkelijk belang:* een aanmerkelijk belang in de zin van de [Wet inkomstenbelasting 2001][ref5].


