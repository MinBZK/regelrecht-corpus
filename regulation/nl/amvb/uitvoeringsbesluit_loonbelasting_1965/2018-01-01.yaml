  - number: 2e
    text: |-
      1 [Artikel 2a][ref1] is niet van toepassing met betrekking tot de arbeidsverhouding van degene, die arbeid verricht
      in de uitoefening van een bedrijf of in de zelfstandige uitoefening van een beroep.

      2 [Artikel 2][ref2], en [artikel 2][ref3], zijn niet van toepassing met betrekking tot de arbeidsverhouding van
      degene, die:

      a. arbeid verricht in de uitoefening van een bedrijf of in de zelfstandige uitoefening van een beroep;

      b. het verrichten van de arbeid rechtstreeks is overeengekomen met een natuurlijk persoon ten behoeve van diens
      persoonlijke aangelegenheden;

      c. arbeid van overwegend geestelijke aard verricht;

      d. werkzaam is in een arbeidsverhouding, die in overwegende mate beheerst wordt door een familieverhouding;

      e. anders dan bij wijze van beroep, als auteur of redactiemedewerker werkzaam is voor een uitgever;

      f. werkzaam is op basis van een voor aanvang van de betaling van de beloning gesloten schriftelijke overeenkomst
      waaruit blijkt dat het de bedoeling is van beide partijen dat de [artikelen 2b][ref4] en [2c][ref5] niet van
      toepassing zijn.

      3 Voor de toepassing van het tweede lid, onderdeel a, wordt degene die melkvervoer verricht krachtens een
      vervoersovereenkomst en die daarvoor een eigen vervoermiddel pleegt te gebruiken, geacht dit vervoer te verrichten
      in de uitoefening van een bedrijf.

      4 [Artikel 2ca][ref6] is niet van toepassing:

      a. met betrekking tot de arbeidsverhouding van degene, die arbeid verricht in de uitoefening van een bedrijf of in
      de zelfstandige uitoefening van een beroep;

      b. met betrekking tot de arbeidsverhouding van degene, die het verrichten van de arbeid rechtstreeks is
      overeengekomen met een natuurlijk persoon ten behoeve van diens persoonlijke aangelegenheden;

      c. indien wordt voldaan aan bij ministeriële regeling te stellen regels.


