  - number: 12a
    text: |-
      1 De in [artikel 35, vierde lid, van de wet][ref1] bedoelde kostenvergoedingsbeschikking kan betrekking
      hebben op een artiest of beroepssporter (individuele kostenvergoedingsbeschikking), dan wel op een gezelschap
      (gezelschapskostenvergoedingsbeschikking). De in [artikel 35g, vierde lid, van de wet][ref2] bedoelde
      kostenvergoedingsbeschikking is een gezelschapskostenvergoedingsbeschikking.

      2 De individuele kostenvergoedingsbeschikking heeft betrekking op hetgeen geacht kan worden te strekken tot
      bestrijding van kosten, lasten en afschrijvingen ter behoorlijke vervulling van het optreden of de sportbeoefening,
      dan wel een reeks van optredens of sportbeoefeningen, door de artiest of de beroepssporter.

      3 De gezelschapskostenvergoedingsbeschikking heeft betrekking op hetgeen geacht kan worden te strekken tot
      bestrijding van kosten, lasten en afschrijvingen ter behoorlijke vervulling van het optreden of de sportbeoefening,
      dan wel een reeks van optredens of sportbeoefeningen, door het gezelschap of de leden van het gezelschap.

      4 Een verzoek om een kostenvergoedingsbeschikking kan bij de inspecteur worden ingediend door:

      a. voorafgaande aan een optreden of sportbeoefening dan wel een reeks van optredens of sportbeoefeningen: de
      artiest, de beroepssporter, de leider of vertegenwoordiger van het gezelschap dan wel de inhoudingsplichtige;

      b. uiterlijk een maand na afloop van een optreden of sportbeoefening dan wel een reeks van optredens of
      sportbeoefeningen: de inhoudingsplichtige.

      5 De inspecteur kan op eigen initiatief dan wel op initiatief van degene die heeft verzocht om de
      kostenvergoedingsbeschikking, deze intrekken of vervangen door een andere kostenvergoedingsbeschikking.

      6 De inhoudingsplichtige neemt een kostenvergoedingsbeschikking slechts in aanmerking indien hij beschikt
      over een kopie daarvan en deze bij de loonadministratie bewaart. De inhoudingsplichtige neemt een individuele
      kostenvergoedingsbeschikking niet in aanmerking indien hij met betrekking tot het optreden of de sportbeoefening
      beschikt over een kopie van een gezelschapskostenvergoedingsbeschikking voor een gezelschap waartoe de artiest of
      beroepssporter behoort.

      7 Indien zulks door of namens de artiest of beroepssporter dan wel het gezelschap wordt aangegeven, wordt de
      inhoudingsplichtige die met betrekking tot het optreden of de sportbeoefening niet beschikt over een kopie van een
      kostenvergoedingsbeschikking, geacht te beschikken over:

      a. ingeval de artiest of beroepssporter geen deel uitmaakt van een gezelschap: een individuele
      kostenvergoedingsbeschikking tot het door de artiest of beroepssporter aangegeven bedrag met een maximum van € 163
      per optreden of sportbeoefening;

      b. in het geval van een gezelschap: een gezelschapskostenvergoedingsbeschikking tot het door het gezelschap
      aangegeven bedrag, met per optreden of sportbeoefening een maximum van € 163 vermenigvuldigd met het aantal leden
      van het gezelschap.

      8 Een verzoek als bedoeld in het vierde lid bevat ten minste:

      a. indien het wordt ingediend door een in Nederland wonende artiest of leider dan wel vertegenwoordiger van een
      gezelschap: zijn naam, adres, woonplaats en burgerservicenummer;

      b. indien het wordt ingediend door een niet in Nederland wonende artiest, beroepssporter of leider dan wel
      vertegenwoordiger van een gezelschap: zijn naam, adres, woonplaats, woonland en geboortedatum;

      c. indien het wordt ingediend door een inhoudingsplichtige: zijn naam, adres, woonplaats en het
      loonheffingennummer, alsmede – bij een verzoek voor een artiest of beroepssporter – de naam, adres, woonplaats
      van de artiest onderscheidenlijk beroepssporter en, indien de artiest in Nederland woont, het burgerservicenummer
      van de artiest, en – bij een verzoek voor een gezelschap – de naam, adres, woonplaats en, indien deze in Nederland
      woont, het burgerservicenummer van de leider dan wel vertegenwoordiger van het gezelschap, en voorts

      d. bij een gezelschap: de naam van het gezelschap en het aantal leden van het gezelschap;

      e. de datum van het optreden of de sportbeoefening dan wel, in geval van een reeks van optredens of
      sportbeoefeningen, de periode waarin die optredens of sportbeoefeningen plaatsvinden;

      f. een opgave van de gage, de gemaakte en nog te maken kosten, alsmede een toelichting op deze kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel35g
