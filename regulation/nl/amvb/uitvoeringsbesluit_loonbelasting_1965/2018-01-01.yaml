  - number: '12'
    text: |-
      Ten aanzien van de in [artikel 33, tweede lid, onderdeel c, onder 1°, van de wet][ref1]
      bedoelde werknemers, met uitzondering van degenen die een uitkering ontvangen op grond van het
      [Besluit bijstandverlening zelfstandigen 2004][ref2], herrekent de inhoudingsplichtige bij het einde van het
      kalenderjaar volgens bij ministeriële regeling te stellen regels de op de voet van de in die bepaling bedoelde
      tabel geheven belasting zodanig dat uiteindelijk de belasting zoveel mogelijk wordt geheven als hadden de
      werknemers loon uit vroegere arbeid genoten niet zijnde uitkeringen ingevolge de [Participatiewet][ref3]. Bij de in
      de vorige volzin bedoelde herrekening wordt het bedrag van de in aanmerking te nemen heffingskorting, in afwijking
      in zoverre van [artikel 23, tweede lid, van de wet][ref4], verminderd met het volgens bij ministeriële regeling te
      stellen regels te bepalen bedrag aan heffingskorting voor de loonbelasting, met uitzondering van de arbeidskorting
      en de werkbonus, waarmee ten aanzien van de werknemer reeds rekening is gehouden bij de inhouding van belasting op
      ander loon.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0015711
      [ref3]: https://wetten.overheid.nl/BWBR0015703
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel23
