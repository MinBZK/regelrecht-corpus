preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Minister van Financiën van 26 april 1965, nr. B5/6210, Directie Wetgeving Directe
    Belastingen;

    Gelet op de artikelen 4, 7, 33 en 34 van de Wet op de loonbelasting 1964 (Stb. 521);

    De Raad van State gehoord (advies van 12 mei 1965, nr. 64);

    Gezien het nader rapport van Onze Minister van Financiën van 14 mei 1965, nr. 135/7088, Directie Wetgeving Directe
    belastingen;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002489/2018-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Dit besluit geeft uitvoering aan de [artikelen 4][ref1], [5a][ref2], [7][ref3], [13bis][ref4],
      [18a][ref5], [18g][ref6], [19a][ref7], [31a][ref8], [33][ref9], [34][ref10], [35][ref11],
      [35f][ref12], [35g][ref13], [35n][ref14] en 38n van de Wet op de loonbelasting 1964 en aan
      [artikel 10a van de Algemene wet inzake rijksbelastingen][ref15].

      2 Dit besluit verstaat onder:

      a. wet: [Wet op de loonbelasting 1964][ref16];

      b. uitvoerder van aangenomen werk: degene, die, anders dan in de uitoefening van een bedrijf of in de zelfstandige
      uitoefening van een beroep, en anders dan als thuiswerker, ingevolge een overeenkomst tot aanneming van werk als
      bedoeld in [artikel 750 van Boek 7 van het Burgerlijk Wetboek][ref17] die niet rechtstreeks is aangegaan met een
      natuurlijke persoon ten behoeve van diens persoonlijke aangelegenheden, persoonlijk een werk tot stand brengt;

      c. loon in geld: het loon voor de loonbelasting, voor zover dit in geld wordt verstrekt;

      d. tabelloon: het loon waarop de loonbelastingtabel wordt toegepast;

      e. bruto-inkomen: het loon in de zin van de [Wet minimumloon en minimumvakantiebijslag][ref18];

      f. belasting, ingeval [artikel 27b, eerste lid, van de wet][ref19] van toepassing is: het gezamenlijke bedrag van
      de belasting en de premie voor de volksverzekeringen;

      g. gage: gage als bedoeld in [artikel 35 van de wet][ref20];

      h. gezelschap: een groep van natuurlijke personen of lichamen waarbij de leden van de groep individueel of
      gezamenlijk ingevolge een overeenkomst van korte duur als artiest in Nederland optreden of als beroep een tak van
      sport in Nederland beoefenen.


