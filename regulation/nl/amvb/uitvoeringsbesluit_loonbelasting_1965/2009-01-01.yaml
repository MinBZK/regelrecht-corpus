  - number: 10ab.1.c
    text: |-
      de perioden gedurende welke de werknemer in dienstbetrekking heeft gestaan tot een andere inhoudingsplichtige,
      indien ter zake van deze perioden met toepassing van [artikel 10a, tweede of derde lid][ref1], inkoop van
      dienstjaren heeft plaatsgevonden; voor zover met schriftelijke bescheiden kan worden gestaafd dat deze perioden bij
      de opbouw van het ouderdomspensioen in aanmerking zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002489#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel10ab
