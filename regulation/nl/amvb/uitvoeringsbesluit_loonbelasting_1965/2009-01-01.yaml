  - number: 10a.4
    text: |-
      Voor de toepassing van het eerste lid mag de aldaar genoemde vermindering van de in aanmerking te nemen perioden
      bij dienstbetrekkingen in deeltijd achterwege blijven, indien de deeltijdfunctie is aanvaard in de periode die
      aanvangt 10 jaar direct voorafgaande aan de in de pensioenregeling vastgestelde ingangsdatum. De eerste volzin is
      uitsluitend van toepassing, voor zover de omvang van het dienstverband na het aanvaarden van de deeltijdfunctie
      niet lager is dan 50% van de omvang van het dienstverband aan het eind van de periode direct voorafgaande aan de
      aanvang van de aan het slot van de eerste volzin bedoelde periode.
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel10a
