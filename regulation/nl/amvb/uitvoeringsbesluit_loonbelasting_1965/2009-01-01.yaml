    text: |-
      de perioden die ingevolge [artikel 10a, eerste lid, onderdelen a, b en g][ref1], als dienstjaren in aanmerking
      zijn genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0002489#Artikel10a
