      indien ter zake van het in die dienstbetrekking opgebouwde ouderdomspensioen waardeoverdracht van
      pensioenkapitaal, als bedoeld in de [artikelen 71][ref1], [74][ref2], [75][ref3], [85 tot en met 88][ref4]
      en [91 van de Pensioenwet][ref5], naar de huidige inhoudingsplichtige of de pensioenuitvoerder van de huidige
      inhoudingsplichtige heeft plaatsgevonden;


