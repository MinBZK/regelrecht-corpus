      met de verhouding tussen het ingevolge [artikel 18a, achtste lid, onderdeel a, eerste volzin, van de wet][ref1]
      in het kalenderjaar in aanmerking te nemen bedrag en het ingevolge
      [artikel 18a, achtste lid, onderdeel a, eerste volzin, van de wet][ref2] in het vorige kalenderjaar in aanmerking
