  - number: 10ab.2
    text: |-
      Als perioden die meetellen als deelnemingsjaren kunnen eveneens in aanmerking worden genomen dienstjaren
      ten gevolge van een voor 1 januari 2005 gedane waardeoverdracht van pensioenkapitaal, als bedoeld in de
      [artikelen 32, vierde lid][ref1], [32a][ref2] of [32b van de Pensioen- en spaarfondsenwet][ref3], zoals deze
      artikelen luidden op 31 december 2006, voor zover met schriftelijke bescheiden kan worden gestaafd dat deze
      dienstjaren bij de opbouw van het ouderdomspensioen in aanmerking zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel32a
      [ref3]: https://wetten.overheid.nl/BWBR0002089#Artikel32b
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel10ab
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: '32'
      - id: ref2
        bwb_id: BWBR0002089
        artikel: 32a
      - id: ref3
        bwb_id: BWBR0002089
        artikel: 32b
  - number: 10ab.3
    text: |-
      Als perioden die meetellen als deelnemingsjaren kunnen eveneens in aanmerking worden genomen perioden
      gedurende welke de werknemer in dienstbetrekking heeft gestaan tot een andere inhoudingsplichtige
      of een met de inhoudingsplichtige of een andere inhoudingsplichtige verbonden lichaam als bedoeld in
      [artikel 10a, vierde lid, van de Wet op de vennootschapsbelasting 1969][ref1], dat niet in Nederland is gevestigd,
      voor zover met schriftelijke bescheiden kan worden gestaafd dat deze perioden door die andere inhoudingsplichtige
      of dat lichaam bij de opbouw van het ouderdomspensioen of van een voorziening voor ouderdom ingevolge een
      pensioenregeling als bedoeld in [artikel 1.7, tweede lid, onderdeel c, van de Wet inkomstenbelasting 2001][ref2],
      in aanmerking zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel1
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel10ab
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 10a
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '1'
  - number: 10ab.4
    text: |-
      Bij dienstbetrekkingen in deeltijd wordt het ingevolge [artikel 18e van de wet][ref1] geldende
      maximum verlaagd overeenkomstig de per deelnemingsjaar geldende deeltijdfactor, met dien verstande dat
      [artikel 10b, derde lid][ref2], van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18e
      [ref2]: https://wetten.overheid.nl/BWBR0002489#Artikel10b
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel10ab
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18e
      - id: ref2
        bwb_id: BWBR0002489
        artikel: 10b
        hoofdstuk: '4'
  - number: 10ab.5
    text: |-
      Bij toepassing van het eerste lid, onderdeel c, of derde lid, wordt voor de toepassing van
      [artikel 18e, eerste lid, onderdeel b, en vierde lid, van de wet][ref1] het 40-deelnemingsjarenpensioen opgevat met
      inbegrip van de uit die andere dienstbetrekking voortvloeiende:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18e
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel10ab
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18e
  - number: 10ab.5.a
    text: uitkeringen ingevolge een ouderdomspensioen;
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel10ab
  - number: 10ab.5.b
    text: uitkeringen ingevolge een 40-deelnemingsjarenpensioen;
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel10ab
  - number: 10ab.5.c
    text: |-
      uitkeringen ingevolge een overbruggingspensioen als bedoeld in [artikel 18e][ref1], zoals dit artikel op 31
      december 2004 luidde;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18e
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel10ab
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18e
  - number: 10ab.5.d
    text: |-
      uitkeringen ingevolge een regeling voor vervroegde uittreding als bedoeld in [artikel 18i][ref1], zoals dit artikel
      op 31 december 2004 luidde;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18i
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel10ab
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18i
  - number: 10ab.5.e
    text: |-
      uitkeringen ingevolge een prepensioen als bedoeld in [artikel 38a][ref1], zoals dit artikel op 31 december 2004
      luidde.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel38a
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel10ab
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 38a
  - number: 10ab.6
    text: |-
      Indien perioden gedurende welke de werknemer in dienstbetrekking heeft gestaan tot een met
      de inhoudingsplichtige of een andere inhoudingsplichtige verbonden lichaam als bedoeld in
      [artikel 10a, vierde lid, van de Wet op de vennootschapsbelasting 1969][ref1], dat niet in Nederland
      is gevestigd, in aanmerking worden genomen als deelnemingsjaren, wordt voor de toepassing van
      [artikel 18e, eerste lid, onderdeel b, en vierde lid, van de wet][ref2] het 40-deelnemingsjarenpensioen opgevat
      met inbegrip van de uitkeringen ingevolge de bij dat lichaam opgebouwde voorziening voor ouderdom in een
      pensioenregeling als bedoeld in [artikel 1.7, tweede lid, onderdeel c, van de Wet inkomstenbelasting 2001][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18e
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel1
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel10ab
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 10a
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 18e
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '1'
  - number: 10b.1
    text: |-
      Als loonbestanddelen, als bedoeld in [artikel 18g, tweede lid, onderdeel a, van de wet][ref1] komen in aanmerking
      alle loonbestanddelen, met uitzondering van het genot van een ter beschikking gestelde auto. Voorzover over
      loonbestanddelen pensioen wordt opgebouwd volgens een eindloonstelsel komen loonstijgingen in de periode die
      aanvangt vijf jaar direct voorafgaande aan de in de pensioenregeling vastgestelde ingangsdatum in aanmerking tot
      ten hoogste 2 percent boven de gemiddelde loonindex voor de CAO-lonen per maand, inclusief bijzondere beloningen,
      zoals berekend door het Centraal Bureau voor de Statistiek, met dien verstande dat in elk geval in aanmerking komen
      loonstijgingen als gevolg van gangbare functiewijzigingen of gangbare leeftijdsperiodieken.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18g
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18g
  - number: 10b.2
    text: |-
      Voor de toepassing van [artikel 18g, tweede lid, onderdeel b, van de wet][ref1] komen niet tot het regelmatig
      genoten loon behorende loonbestanddelen slechts in aanmerking voorzover de opbouw van het pensioen volgens een
      ander stelsel dan het eindloonstelsel plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18g
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18g
  - number: 10b.3
    text: |-
      Voor de toepassing van [artikel 18g, tweede lid, onderdeel c, van de wet][ref1] mag een loonsverlaging buiten
      beschouwing blijven, voorzover deze het gevolg is van het terugtreden naar een lager gekwalificeerde functie, in de
      periode die aanvangt 10 jaar direct voorafgaande aan de in de pensioenregeling vastgestelde ingangsdatum.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18g
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18g
  - number: 10b.4
    text: |-
      Voor de toepassing van [artikel 18g, tweede lid, onderdeel d, van de wet][ref1] mag een loonsverlaging buiten
      beschouwing blijven, voor zover deze het gevolg is van ziekte of arbeidsongeschiktheid.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18g
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18g
  - number: 10c
    text: |-
      Voor de toepassing van [artikel 18h, tweede lid, van de wet][ref1] is een regeling een pensioenregeling indien zij
      voldoet aan [hoofdstuk IIB][ref2] of [hoofdstuk VIII van de wet][ref3], mits:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18h
      [ref2]: https://wetten.overheid.nl/BWBR0002471#HoofdstukIIB
      [ref3]: https://wetten.overheid.nl/BWBR0002471#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18h
      - id: ref2
        bwb_id: BWBR0002471
        hoofdstuk: IIB
      - id: ref3
        bwb_id: BWBR0002471
        hoofdstuk: VIII
  - number: 10c.a
    text: loonbestanddelen in natura niet tot het pensioengevend loon worden gerekend;
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel10c
  - number: 10c.b
    text: |-
      de bedragen die op de voet van de regeling op het loon van de werknemer worden ingehouden niet meer bedragen dan
      hetgeen door de inhoudingsplichtige wordt bijgedragen;
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel10c
  - number: 10c.c
    text: |-
      de in te bouwen uitkeringen ingevolge de [Algemene Ouderdomswet][ref1] per dienstjaar worden gesteld
      op ten minste de voor dat jaar geldende uitkeringen voor een ongehuwde persoon als bedoeld in
      [artikel 9, eerste lid, onderdeel a, en zesde lid, onderdeel a, van die wet][ref2], vermeerderd met de vakantie-
      uitkering;


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '9'
  - number: 10c.d
    text: |-
      indien de werknemer geen mogelijke partner of wees kan aanwijzen als waarop [artikel 18b][ref1] onderscheidenlijk
      [18c, van de wet][ref2] betrekking heeft, de regeling geen partnerpensioen onderscheidenlijk wezenpensioen omvat;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18b
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18c
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18b
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 18c
  - number: 10c.e
    text: |-
      een overbruggingspensioen voorzover dat dient ter overbrugging van een uitkering ingevolge de
      [Algemene Ouderdomswet][ref1] is afgestemd op het op grond van artikel 18a, achtste lid, in de pensioenregeling in
      aanmerking genomen bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 10d.1
    text: |-
      Als een verzekeraar van een pensioen als bedoeld in [artikel 19a, eerste lid, onderdeel f, van de wet][ref1] kan
      door Onze Minister worden aangewezen een verzekeraar die op grond van de [Wet op het financieel toezicht][ref2]
      diensten naar Nederland mag verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel10d
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19a
      - id: ref2
        bwb_id: BWBR0020368
  - number: 10d.2
    text: |-
      Als een pensioenfonds als bedoeld in [artikel 19a, eerste lid, onderdeel f, van de wet][ref1] kan door Onze
      Minister worden aangewezen een lichaam dat naar het recht van de staat van diens zetel bevoegd gelden beheert
      strekkende tot verzekering van aanspraken ingevolge een pensioenregeling van tenminste 100 werknemers of gewezen
      werknemers en dat met betrekking tot deze aanspraken vanuit een vestiging buiten Nederland overeenkomsten sluit.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel10d
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19a
  - number: 10d.3
    text: |-
      Alvorens tot een aanwijzing wordt overgegaan, dient de verzekeraar, onderscheidenlijk het pensioenfonds zich
      tegenover Onze Minister, onder door hem te stellen voorwaarden, te verplichten om met betrekking tot de bij deze
      verzekeraar of dit fonds verzekerde of nog te verzekeren aanspraken ingevolge een pensioenregeling, bedoeld in
      [artikel 18 van de wet][ref1] inlichtingen te verstrekken over de uitvoering van de pensioenregelingen en een in
      Nederland uitwinbare zekerheid jegens de ontvanger te stellen voor de invordering van de belasting die mocht worden
      verschuldigd door toepassing van [artikel 19b van de wet][ref2]. In afwijking van de eerste volzin behoeft een in
      een van de lidstaten van de Europese Unie gevestigde verzekeraar of gevestigd pensioenfonds jegens de ontvanger
      geen in Nederland uitwinbare zekerheid te stellen indien deze verzekeraar of dit pensioenfonds, onder door Onze
      Minister te stellen voorwaarden, ingevolge een overeenkomst met de ontvanger aansprakelijkheid aanvaardt voor de in
      die volzin bedoelde belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel19b
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel10d
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 19b
  - number: 10d.4
    text: |-
      De aanwijzing kan eveneens plaatsvinden indien de in het derde lid bedoelde zekerheid niet door de verzekeraar of
      het pensioenfonds maar door de werknemer of de gewezen werknemer wordt gesteld, waarbij deze tevens de mogelijkheid
      heeft zekerheid te stellen door middel van verpanding van de aanspraken ingevolge een pensioenregeling aan de
      ontvanger, mits de verzekeraar of het pensioenfonds instemt met deze verpanding.
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel10d
  - number: 10d.5
    text: |-
      De aanwijzing kan door Onze Minister worden ingetrokken wanneer de verzekeraar of het pensioenfonds niet meer aan
      de verplichtingen met betrekking tot het verschaffen van inlichtingen of het stellen van zekerheid voldoet of niet
      aan een juiste wijze van uitvoering van een verpanding of van de in het derde lid bedoelde overeenkomst inzake
      aansprakelijkheid meewerkt.
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel10d
  - number: 10d.6
    text: |-
      Indien de aanwijzing wordt ingetrokken, worden de aanspraken ingevolge een pensioenregeling niet op het
      onmiddellijk daaraan voorafgaande tijdstip aangemerkt als loon uit vroegere dienstbetrekking van de werknemers
      of gewezen werknemers, dan wel indien een werknemer of gewezen werknemer is overleden, van de gerechtigden tot de
      aanspraken, indien de aanspraken onder door Onze Minister te stellen voorwaarden alsnog overgaan op een verzekeraar
      van een pensioen die voldoet aan de in [artikel 19a van de wet][ref1] gestelde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel10d
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19a
  - number: 10d.7
    text: |-
      Onze Minister maakt het aanwijzen als een verzekeraar als bedoeld in het eerste lid, dan wel het aanwijzen als een
      pensioenfonds als bedoeld in het tweede lid, op een daartoe geschikte wijze publiek bekend. Indien Onze Minister
      een aanwijzing intrekt, maakt hij die intrekking ook op een daartoe geschikte wijze publiek bekend.
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel10d
  - number: 10f.1
    text: |-
      Ten aanzien van de werknemers aan wie kosten verband houdende met het vervoer als bedoeld in
      [artikel 15b, eerste lid, onderdeel a, van de wet][ref1] worden vergoed, is het toegestaan dat deze vergoedingen
      slechts als loon in aanmerking worden genomen voor zover zij in totaal meer hebben bedragen dan het aantal in
      het kalenderjaar voor vergoeding in aanmerking gekomen kilometers vermenigvuldigd met het in de genoemde bepaling
      bedoelde bedrag per kilometer.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel15b
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel10f
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 15b
  - number: 10f.2
    text: |-
      Het op de voet van het eerste lid als loon in aanmerking te nemen bedrag wordt geacht niet te behoren tot het loon
      van het kalenderjaar doch wordt geacht te behoren tot het loon van het volgende kalenderjaar en te zijn betaald op
      de laatste werkdag in januari van dat volgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel10f
  - number: 10f.3
    text: |-
      Ingeval de dienstbetrekking in de loop van het kalenderjaar is geëindigd komt bij de toepassing van het eerste
      en het tweede lid voor het kalenderjaar in de plaats het tijdvak gedurende hetwelk de dienstbetrekking in het
      kalenderjaar heeft bestaan en wordt het als loon in aanmerking te nemen bedrag geacht te behoren tot het loon van
      de kalendermaand volgende op die waarin de dienstbetrekking is geëindigd en te zijn betaald op de laatste werkdag
      van die volgende kalendermaand.
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel10f
  - number: 10f.4
    text: |-
      Ten aanzien van de werknemers aan wie kosten verband houdende met het vervoer als bedoeld in
      [artikel 15b, eerste lid, onderdeel a, van de wet][ref1] worden vergoed, is het, indien het eerste lid geen
      toepassing vindt, toegestaan dat het ter zake van die vergoedingen als loon van de maand december van het
      kalenderjaar in aanmerking te nemen bedrag wordt geacht niet te behoren tot het loon van die maand doch wordt
      geacht te behoren tot het loon van de maand januari van het volgende kalenderjaar en te zijn betaald op de laatste
      werkdag van deze maand.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel15b
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel10f
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 15b
  - number: 10g.1
    text: |-
      Ten aanzien van een in de onderneming van zijn ouder werkzaam kind dat behoort tot het huishouden van die
      ouder en niet verzekerd is ingevolge enige andere sociale verzekering dan een volksverzekering in de zin van de
      [Wet financiering sociale verzekeringen][ref1] of de zorgverzekering in de zin van de [Zorgverzekeringswet][ref2],
      kan de inspecteur onder door hem te stellen voorwaarden toestaan dat de belasting wordt ingehouden op de eerste
      werkdag van het volgende kalenderjaar, met toepassing van de loonbelastingtabellen voor het kalenderjaar waarin het
      loon is verstrekt. Alsdan wordt het in dat kalenderjaar verstrekte loon geacht in gelijke delen te zijn verstrekt
      over de kalenderkwartalen waarin het kind werkzaam is geweest, en vinden [artikel 26 van de wet][ref3] en de
      krachtens dat artikel vastgestelde loonbelastingtabellen voor bijzondere beloningen geen toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017745
      [ref2]: https://wetten.overheid.nl/BWBR0018450
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel26
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel10g
    references:
      - id: ref1
        bwb_id: BWBR0017745
      - id: ref2
        bwb_id: BWBR0018450
      - id: ref3
        bwb_id: BWBR0002471
        artikel: '26'
  - number: 10g.2
    text: |-
      Voor de toepassing van [artikel 19, eerste lid, van de Algemene wet inzake rijksbelastingen][ref1] wordt de
      belasting geacht te zijn ingehouden in het kalenderjaar waarin het loon is verstrekt.


