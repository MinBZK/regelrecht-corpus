  - number: '1.2'
    text: 'Dit besluit verstaat onder:'
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel1
  - number: 1.2.a
    text: |-
      wet: [Wet op de loonbelasting 1964][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: 1.2.b
    text: |-
      uitvoerder van aangenomen werk: degene, die, anders dan in de uitoefening van een bedrijf of in de zelfstandige
      uitoefening van een beroep, en anders dan als thuiswerker, ingevolge een overeenkomst tot aanneming van werk als
      bedoeld in [artikel 750 van Boek 7 van het Burgerlijk Wetboek][ref1] die niet rechtstreeks is aangegaan met een
      natuurlijke persoon ten behoeve van diens persoonlijke aangelegenheden, persoonlijk een werk tot stand brengt;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel750
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '750'
  - number: 1.2.c
    text: 'loon in geld: het loon voor de loonbelasting, voor zover dit in geld wordt verstrekt;'
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel1
  - number: 1.2.d
    text: 'tabelloon: het loon waarop de loonbelastingtabel wordt toegepast;'
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel1
  - number: 1.2.e
    text: |-
      bruto-inkomen: het loon in de zin van de [Wet minimumloon en minimumvakantiebijslag][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002638
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002638
  - number: 1.2.f
    text: |-
      belasting, ingeval [artikel 27b, eerste lid, van de wet][ref1] van toepassing is: het gezamenlijke bedrag van de
      belasting en de premie voor de volksverzekeringen;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel27b
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 27b
  - number: 1.2.g
    text: |-
      gage: gage als bedoeld in [artikel 35 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel35
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '35'
  - number: 1.2.h
    text: |-
      gezelschap: een groep van natuurlijke personen of lichamen waarbij de leden van de groep individueel of gezamenlijk
      ingevolge een overeenkomst van korte duur als artiest in Nederland optreden of als beroep een tak van sport in
      Nederland beoefenen.
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel1
  - number: '2'
    text: |-
      Als dienstbetrekking wordt beschouwd de arbeidsverhouding van de topsporter die op grond van het met instemming
      van Onze Minister van Volksgezondheid, Welzijn en Sport vastgestelde reglement van de stichting Fonds voor
      de Topsporter een periodieke uitkering als tegemoetkoming in de kosten van zijn levensonderhoud geniet of een
      kostenvergoeding geniet.
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel2
  - number: 2a
    text: |-
      Als dienstbetrekking wordt beschouwd de arbeidsverhouding van degene die door tussenkomst van degene tot wie
      de arbeidsverhouding bestaat, persoonlijk arbeid verricht ten behoeve van een derde, met uitzondering van de
      arbeidsverhouding van degene die:
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel2a
  - number: 2a.a
    text: |-
      doorgaans op minder dan drie dagen per week werkzaam is voor een natuurlijk persoon ten behoeve van diens
      persoonlijke aangelegenheden, tenzij loon wordt verstrekt door degene door wiens tussenkomst de arbeid wordt
      verricht;
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel2a
  - number: 2a.b
    text: bij wijze van arbeidstherapie werkzaam is.
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel2a
  - number: 2b.1
    text: |-
      Als dienstbetrekking wordt beschouwd de arbeidsverhouding van de thuiswerker of van de hulp van de thuiswerker,
      die persoonlijk arbeid verricht tegen een bruto-inkomen, dat doorgaans over een maand ten minste zal bedragen 2/5
      maal het bedrag, genoemd in [artikel 8, eerste lid, onderdeel ][ref1], dan wel, voor degene, die de leeftijd van 23
      jaar nog niet heeft bereikt en wiens bruto-inkomen uitsluitend in verband met zijn leeftijd op een lager bedrag is
      vastgesteld, 2/5 maal het krachtens genoemde wet voor een werknemer van dezelfde leeftijd geldende bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
  - number: 2b.2
    text: |-
      Het eerste lid is niet van toepassing met betrekking tot een arbeidsverhouding die is aangegaan voor korter dan
      een maand.
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel2b
  - number: 2b.3
    text: |-
      Indien binnen een maand na het einde van een arbeidsverhouding met dezelfde opdrachtgever een nieuwe
      arbeidsverhouding wordt aangegaan, geldt het bepaalde in het tweede lid niet ten aanzien van die nieuwe
      arbeidsverhouding, tenzij de tijdvakken voor welke die arbeidsverhoudingen zijn aangegaan te zamen korter zijn dan
      een maand.
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel2b
  - number: 2b.4
    text: |-
      Voor de toepassing van het eerste lid is met betrekking tot het bruto-inkomen van een thuiswerker en van de hulp
      van een thuiswerker [artikel 5, eerste lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002489#Artikel5
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0002489
        artikel: '5'
        hoofdstuk: '2'
  - number: 2b.5
    text: |-
      Het eerste lid is niet van toepassing met betrekking tot de arbeidsverhouding van de thuiswerker die zich doorgaans
      laat bijstaan door meer dan twee personen niet zijnde zijn echtgenoot of zijn tot zijn huishouden behorende
      minderjarige kinderen.
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel2b
  - number: 2c.1
    text: |-
      Als dienstbetrekking wordt beschouwd de arbeidsverhouding van degene, die persoonlijk arbeid verricht op doorgaans
      ten minste 2 dagen per week tegen een bruto-inkomen dat doorgaans over een week ten minste zal bedragen 2/5 maal
      het bedrag, genoemd in [artikel 8, eerste lid, onderdeel ][ref1], dan wel, voor degene, die de leeftijd van 23
      jaar nog niet heeft bereikt en wiens bruto-inkomen uitsluitend in verband met zijn leeftijd op een lager bedrag is
      vastgesteld, 2/5 maal het krachtens genoemde wet voor een werknemer van dezelfde leeftijd geldende bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
  - number: 2c.2
    text: |-
      Het eerste lid is niet van toepassing met betrekking tot een arbeidsverhouding die is aangegaan voor korter dan
      een maand.
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel2c
  - number: 2c.3
    text: |-
      Indien binnen een maand na het einde van een arbeidsverhouding met dezelfde opdrachtgever een nieuwe
      arbeidsverhouding wordt aangegaan, geldt het bepaalde in het tweede lid niet ten aanzien van die nieuwe
      arbeidsverhouding, tenzij de tijdvakken voor welke die arbeidsverhoudingen zijn aangegaan te zamen korter zijn dan
      een maand.
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel2c
  - number: 2c.4
    text: |-
      Het eerste lid is niet van toepassing met betrekking tot de arbeidsverhouding van degene die tegen beloning
      persoonlijk arbeid verricht, indien:
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel2c
  - number: 2c.4.a
    text: |-
      zijn arbeidsverhouding tevens is een arbeidsverhouding als bedoeld in [artikel 2][ref1] of [artikel 3][ref2] van de
      wet, ongeacht of hij ingevolge het bij of krachtens die artikelen bepaalde al dan niet werknemer is;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel3
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '3'
  - number: 2c.4.b
    text: hij als bestuurder van een vereniging of stichting werkzaam is voor die vereniging of stichting.
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel2c
  - number: 2ca.1
    text: |-
      Als dienstbetrekking wordt beschouwd de arbeidsverhouding van degene, die als sekswerker persoonlijk arbeid
      verricht.
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel2ca
  - number: 2ca.2
    text: |-
      Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt verstaan onder sekswerker: degene die
      tegen betaling seksuele handelingen met of voor een ander verricht.
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel2ca
  - number: 2d
    text: |-
      Waar in de [artikelen 2b][ref1] en [2c][ref2] wordt verwezen naar een in
      [artikel 8, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref3] genoemd bedrag, wordt, indien
      toepassing is gegeven aan [artikel 14][ref4] van die wet, als zodanig in aanmerking genomen het daarbij laatstelijk
      in de plaats daarvan gestelde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002489#Artikel2b
      [ref2]: https://wetten.overheid.nl/BWBR0002489#Artikel2c
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002638#Artikel14
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel2d
    references:
      - id: ref1
        bwb_id: BWBR0002489
        artikel: 2b
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0002489
        artikel: 2c
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0002638
        artikel: '14'
  - number: 2e.1
    text: |-
      [Artikel 2a][ref1] is niet van toepassing met betrekking tot de arbeidsverhouding van degene, die arbeid verricht
      in de uitoefening van een bedrijf of in de zelfstandige uitoefening van een beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0002489#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel2e
    references:
      - id: ref1
        bwb_id: BWBR0002489
        artikel: 2a
        hoofdstuk: '2'
  - number: 2e.2
    text: |-
      [Artikel 2][ref1], en [artikel 2][ref2], zijn niet van toepassing met betrekking tot de arbeidsverhouding van
      degene, die:


      [ref1]: https://wetten.overheid.nl/BWBR0002489#Artikel2b
      [ref2]: https://wetten.overheid.nl/BWBR0002489#Artikel2c
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel2e
    references:
      - id: ref1
        bwb_id: BWBR0002489
        artikel: 2b
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0002489
        artikel: 2c
        hoofdstuk: '2'
  - number: 2e.2.a
    text: arbeid verricht in de uitoefening van een bedrijf of in de zelfstandige uitoefening van een beroep;
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel2e
  - number: 2e.2.b
    text: |-
      het verrichten van de arbeid rechtstreeks is overeengekomen met een natuurlijk persoon ten behoeve van diens
      persoonlijke aangelegenheden;
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel2e
  - number: 2e.2.c
    text: arbeid van overwegend geestelijke aard verricht;
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel2e
  - number: 2e.2.d
    text: werkzaam is in een arbeidsverhouding, die in overwegende mate beheerst wordt door een familieverhouding;
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel2e
  - number: 2e.2.e
    text: anders dan bij wijze van beroep, als auteur of redactiemedewerker werkzaam is voor een uitgever.
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel2e
  - number: 2e.3
    text: |-
      Voor de toepassing van het tweede lid, onderdeel a, wordt degene die melkvervoer verricht krachtens een
      vervoersovereenkomst en die daarvoor een eigen vervoermiddel pleegt te gebruiken, geacht dit vervoer te verrichten
      in de uitoefening van een bedrijf.
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel2e
  - number: 2e.4
    text: |-
      [Artikel 2ca][ref1] is niet van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0002489#Artikel2ca
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel2e
    references:
      - id: ref1
        bwb_id: BWBR0002489
        artikel: 2ca
        hoofdstuk: '2'
  - number: 2e.4.a
    text: |-
      met betrekking tot de arbeidsverhouding van degene, die arbeid verricht in de uitoefening van een bedrijf of in de
      zelfstandige uitoefening van een beroep;
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel2e
  - number: 2e.4.b
    text: |-
      met betrekking tot de arbeidsverhouding van degene, die het verrichten van de arbeid rechtstreeks is overeengekomen
      met een natuurlijk persoon ten behoeve van diens persoonlijke aangelegenheden;
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel2e
  - number: 2e.4.c
    text: indien wordt voldaan aan bij ministeriële regeling te stellen regels.
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel2e
  - number: 2f.1
    text: |-
      Indien een arbeidsverhouding, beoordeeld uitsluitend aan de hand van de eerste leden van de
      [artikelen 2 tot en met 2c][ref1], op grond van meer dan één van die leden als dienstbetrekking wordt beschouwd,
      vindt alleen dat artikel toepassing in het eerste lid waarvan zulks voor de eerste maal geschiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0002489#Artikel2
    url: https://wetten.overheid.nl/BWBR0002489/2009-01-01#Artikel2f
    references:
      - id: ref1
        bwb_id: BWBR0002489
        artikel: '2'
        hoofdstuk: '2'
  - number: 2f.2
    text: |-
      Indien een arbeidsverhouding zowel op grond van [artikel 2ca][ref1], als op grond van [artikel 2][ref2],
      [2a][ref3], [2b][ref4] of [2c][ref5] als dienstbetrekking wordt beschouwd, vindt alleen [artikel 2ca][ref6]
      toepassing. Voor de toepassing van de eerste volzin wordt [artikel 2e, vierde lid][ref7], buiten beschouwing
      gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002489#Artikel2ca
      [ref2]: https://wetten.overheid.nl/BWBR0002489#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002489#Artikel2a
