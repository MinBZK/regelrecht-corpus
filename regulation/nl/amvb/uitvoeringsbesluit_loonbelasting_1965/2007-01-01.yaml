        artikel: '2'
        hoofdstuk: '2'
  - number: 2g
    text: |-
      1 Als dienstbetrekking wordt voorts beschouwd, zo nodig in afwijking van [artikel 5][ref1] van de wet, de
      arbeidsverhouding welke niet reeds op grond van de wet of [de artikelen 2 tot en met 2c][ref2], in samenhang met
      [artikel 2e][ref3], als dienstbetrekking wordt beschouwd, mits:

      a. de werkzaamheden van degene die de arbeid verricht, geen belastbare winst in zin van de
      [Wet inkomstenbelasting 2001][ref4] genereren;

      b. degene die de arbeid verricht, door middel van een gezamenlijke verklaring van hemzelf en de beoogde
      inhoudingsplichtige voor de eerste beoogde inhouding van loonbelasting aan de inspecteur meldt dat zijn
      arbeidsverhouding als dienstbetrekking moet worden beschouwd.

      2 Zodra niet meer aan de voorwaarde, bedoeld in het eerste lid, onderdeel a, wordt voldaan, meldt degene die de
      arbeid verricht, dit aan de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002489#Artikel2
