  - number: 10a
    text: |-
      1 Als perioden die meetellen als dienstjaren dan wel als diensttijd, als bedoeld in de [artikelen 18a][ref1],
      [18b][ref2], [18c][ref3], [38c][ref4], [38d][ref5] en [38f van de wet][ref6], worden in aanmerking genomen:

      a. de periode gedurende welke de dienstbetrekking heeft geduurd, daaronder begrepen perioden van – al dan niet in
      deeltijd –:

      1°. ouderschapsverlof als bedoeld in [hoofdstuk 6 van de Wet arbeid en zorg][ref7];

      2°. sabbatsverlof krachtens een schriftelijk vastgelegde regeling van de inhoudingsplichtige gedurende ten hoogste
      twaalf maanden;

      3°. studieverlof voor cursussen, voor opleidingen of studie voor een beroep, voor het op peil houden van de
      vakkennis en voor cursussen, opleidingen of studie die door de inhoudingsplichtige worden gefinancierd;

      4°. verlof als bedoeld in [artikel 19g van de wet][ref8];

      met dien verstande dat bij dienstbetrekkingen in deeltijd de aldus in aanmerking te nemen periode wordt verminderd
      overeenkomstig de deeltijdfactor.

      b. perioden gedurende welke de werknemer in dienstbetrekking heeft gestaan tot een met de inhoudingsplichtige
      verbonden lichaam als bedoeld in [artikel 10a, vierde lid, van de Wet op de vennootschapsbelasting 1969][ref9],
      dat niet in Nederland is gevestigd, voorzover hij bij dat verbonden lichaam niet heeft deelgenomen aan een
      pensioenregeling;

      c. perioden gedurende welke, in aansluiting op de in de onderdelen a en b bedoelde perioden, na onvrijwillig
      ontslag loongerelateerde uitkeringen worden ontvangen, of, onder door Onze Minister te stellen voorwaarden,
      perioden na ontslag van ten hoogste drie jaar;

      d. perioden gedurende welke, in aansluiting op de in onderdelen a en b bedoelde perioden, uitkeringen worden
      ontvangen ingevolge een regeling voor vervroegde uittreding als bedoeld in [artikel 38c van de wet][ref10];

      e. perioden gedurende welke, in aansluiting op de in onderdelen a en b bedoelde perioden, uitkeringen worden
      ontvangen ingevolge een prepensioenregeling als bedoeld in [artikel 38d van de wet][ref11];

      f. dienstjaren ten gevolge van waardeoverdracht van pensioenkapitaal, als bedoeld in de [artikelen 71][ref12],
      [74][ref13], [75][ref14], [85 tot en met 88][ref15] en [91 van de Pensioenwet][ref16], naar de huidige
      inhoudingsplichtige of de pensioenuitvoerder van de huidige inhoudingsplichtige, voor zover deze jaren op basis van
      een adequate diensttijdadministratie kunnen worden vastgesteld;

      g. perioden waarin de werknemer een tot zijn huishouden behorend kind heeft verzorgd dat de leeftijd van twaalf
      jaar niet heeft bereikt, met dien verstande dat de perioden waarin de kinderen die hij heeft verzorgd de leeftijd
      van zes jaar hebben bereikt, meetellen voor de helft. Bij dienstbetrekkingen in deeltijd wordt de aldus in
      aanmerking te nemen periode verminderd overeenkomstig de deeltijdfactor.

      2 In afwijking van het eerste lid, onderdeel a, is met betrekking tot perioden vóór 8 juli 1994 gedurende
      welke de werknemer in dienstbetrekking heeft gestaan tot vorige inhoudingsplichtigen, inkoop van ontbrekende
      dienstjaren tot 8 juli 1994 toegestaan indien de werknemer aannemelijk kan maken dat er, gerelateerd aan de
      pensioenregeling bij de huidige inhoudingsplichtige, als gevolg van het ontbreken van die dienstjaren sprake
      is van een pensioentekort, daaronder begrepen perioden vóór 8 juli 1994 gedurende welke in het buitenland
      werkzaamheden zijn verricht voor een met een vorige inhoudingsplichtige verbonden lichaam als bedoeld in
      [artikel 10a, vierde lid, van de Wet op de vennootschapsbelasting 1969][ref17], dat niet in Nederland is gevestigd.

      3 In afwijking van het eerste lid, onderdeel a, is met betrekking tot perioden gedurende welke de werknemer
      in dienstbetrekking heeft gestaan tot een vorige inhoudingsplichtige, inkoop van ontbrekende dienstjaren
      toegestaan voor zover de werknemer aannemelijk kan maken dat er, gerelateerd aan de pensioenregeling bij de
      huidige inhoudingsplichtige, sprake is van een pensioentekort als gevolg van het ontbreken van de mogelijkheid
      van waarde-overdracht van pensioenkapitaal als bedoeld in de [artikelen 71][ref18], [74][ref19], [75][ref20],
      [85 tot en met 88][ref21] en [91 van de Pensioenwet][ref22].

      4 Voor de toepassing van het eerste lid mag de aldaar genoemde vermindering van de in aanmerking te nemen perioden
      bij dienstbetrekkingen in deeltijd achterwege blijven, indien de deeltijdfunctie is aanvaard in de periode die
      aanvangt 10 jaar direct voorafgaande aan de in de pensioenregeling vastgestelde ingangsdatum. De eerste volzin is
      uitsluitend van toepassing, voor zover de omvang van het dienstverband na het aanvaarden van de deeltijdfunctie
      niet lager is dan 50% van de omvang van het dienstverband aan het eind van de periode direct voorafgaande aan de
      aanvang van de aan het slot van de eerste volzin bedoelde periode.


