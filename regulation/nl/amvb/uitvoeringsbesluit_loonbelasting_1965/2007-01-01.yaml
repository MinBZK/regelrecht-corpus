  - number: 2h
    text: |-
      Als dienstbetrekking wordt voorts beschouwd de arbeidsverhouding van degene die arbeid verricht ten behoeve van een
      vennootschap waarin hij een aanmerkelijk belang heeft in de zin van de [Wet inkomstenbelasting 2001][ref1] ingeval
      die arbeidsverhouding niet reeds op grond van de wet of de [artikelen 2 tot en met 2c][ref2], in samenhang met
      [artikel 2e][ref3] of [artikel 2g][ref4], als dienstbetrekking wordt beschouwd.


