  - number: '8'
    text: |-
      1 In dit hoofdstuk en de daarop berustende regelingen zijn de volgende definities van toepassing.

      2 Verstaan wordt onder:

      a. extraterritoriale werknemers: ingekomen werknemers en uitgezonden werknemers;

      b. ingekomen werknemer: door een inhoudingsplichtige uit een ander land aangeworven, of naar een
      inhoudingsplichtige gezonden werknemer in de zin van [artikel 2][ref1] van de wet, met een specifieke deskundigheid
      die op de Nederlandse arbeidsmarkt niet of schaars aanwezig is;

      c. uitgezonden werknemer: werknemer in de zin van [artikel 2][ref2] van de wet, door een inhoudingsplichtige naar
      het buitenland gezonden met het oog op:

      1°. plaatsing als ambtenaar bij een vertegenwoordiging van het Koninkrijk der Nederlanden in het buitenland (post);

      2°. tewerkstelling als ambtenaar, rechterlijk ambtenaar of militair op de Nederlandse Antillen of Aruba;

      3°. tewerkstelling als militair buiten het Koninkrijk der Nederlanden;

      4°. tewerkstelling in een bij ministeriële regeling, in overeenstemming met Onze Minister van
      Ontwikkelingssamenwerking, aangewezen regio;

      5°. het beoefenen van wetenschap of het geven van onderwijs.

      d. looptijd: de periode gedurende welke dit hoofdstuk voor een werknemer van toepassing is.

      3 Een werknemer wordt slechts als uitgezonden aangemerkt indien hij in een periode van twaalf maanden ten minste
      45 dagen ten behoeve van zijn werkzaamheden verblijft in een of meer plaatsen waarnaar hij is gezonden. Bij de
      bepaling of aan deze voorwaarde is voldaan worden verblijfsperioden van minder dan 15 dagen niet in aanmerking
      genomen en worden dagen waarop de werknemer zonder onderbreking naar de desbetreffende plaatsen en terug reist –
      of zou reizen bij gebruikmaking van het voor werknemers in het algemeen meest gebruikelijke vervoermiddel – als
      dagen van verblijf in die plaatsen aangemerkt. Indien aan de voorwaarde is voldaan, kan de werknemer tevens als
      uitgezonden worden beschouwd gedurende alle overige dienstreizen van ten minste 10 dagen naar de desbetreffende
      plaatsen.

      4 Ambtenaren bij een post zijn:

      a. overplaatsbare ambtenaren van de Dienst Buitenlandse Zaken van het ministerie van Buitenlandse Zaken, zijnde
      ambtenaren die zijn aangesteld om waar ook ter wereld werkzaam te zijn;

      b. niet-overplaatsbare ambtenaren van die Dienst Buitenlandse Zaken die tijdelijk aan een post zijn toegevoegd;

      c. ambtenaren van andere ministeries die op een post zijn tewerkgesteld;

      d. militairen en burgerpersoneel van het ministerie van Defensie die op een post zijn geplaatst, alsmede vlag- en
      opperofficieren die zijn geplaatst op internationale staven in het buitenland;

      e. werknemers die op basis van een arbeidsovereenkomst naar burgerlijk recht na uitzending vanuit Nederland
      werkzaamheden verrichten bij een post.

      5 Onder het beoefenen van wetenschap of het geven van onderwijs wordt verstaan:

      a. het buiten Nederland verrichten van onderzoek op de financiële basis van:

      1°. een beurs of stipendium van de Nederlandse organisatie voor wetenschappelijk onderzoek of de Stichting voor
      wetenschappelijk onderzoek van de tropen;

      2°. een NATO-fellowship;

      3°. door Onze minister aan te wijzen vergelijkbare beurzen, stipendia en fellowships;

      b. het als leerkracht of beoefenaar van wetenschap door een instelling op het gebied van onderwijs of wetenschap
      worden uitgezonden dan wel op uitnodiging van een dergelijke in het buitenland gevestigde instelling zich naar
      het buitenland begeven, met het doel aldaar onderwijs te geven aan een instelling op het gebied van onderwijs of
      wetenschap of wetenschappelijk onderzoek te verrichten voor een dergelijke instelling.

      6 Schoolgelden zijn uitgaven voor het door kinderen van de extraterritoriale werknemer volgen van basisonderwijs
      of voortgezet onderwijs aan internationale scholen en internationale afdelingen van niet-internationale scholen,
      tot de bedragen die door de school overeenkomstig haar tarieven voor onderwijs in rekening worden gebracht, met
      uitzondering van kosten van kost en inwoning maar met inbegrip van vervoerskosten.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel2
