  - number: '9'
    text: |-
      1 Vergoedingen en verstrekkingen aan extraterritoriale werknemers van kosten, respectievelijk ter voorkoming
      van kosten van verblijf buiten het land van herkomst worden, ten aanzien van ingekomen werknemers op gezamenlijk
      verzoek van de werknemer en de inhoudingsplichtige, in elk geval beschouwd als vergoeding voor extraterritoriale
      kosten tot (bewijsregel):

      a. 30% van de grondslag, waarbij de grondslag is de som van het loon uit tegenwoordige dienstbetrekking ter zake
      van het verblijf buiten het land van herkomst voorzover de ingekomen of uitgezonden werknemer ter zake geen recht
      heeft op voorkoming van dubbele belasting, en de vergoeding voor extraterritoriale kosten;

      b. het bedrag van de schoolgelden.

      2 In geval van verstrekkingen zijn de waarderingsregels krachtens [artikel 13][ref1] van de wet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel13
    url: https://wetten.overheid.nl/BWBR0002489/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '13'
  - number: 9a
    text: |-
      1 Bij de beoordeling of een ingekomen werknemer specifieke deskundigheid bezit die op de Nederlandse arbeidsmarkt
      niet of schaars aanwezig is, wordt in onderlinge samenhang rekening gehouden met de volgende factoren, voorzover
      relevant:

      a. het niveau van de door de werknemer gevolgde opleiding;

      b. de voor de functie relevante ervaring van de werknemer;

      c. het beloningsniveau van de onderhavige functie in Nederland in verhouding tot het beloningsniveau in het land
      van herkomst van de werknemer.

      2 Een werknemer van het middenkader of hoger kader van een internationaal concern met ten minste twee en een
      half jaar ervaring in dat concern die in het kader van roulatie wordt uitgezonden naar Nederland, wordt geacht
      specifieke deskundigheid te bezitten die op de Nederlandse arbeidsmarkt niet of schaars aanwezig is.
    url: https://wetten.overheid.nl/BWBR0002489/2007-01-01#Artikel9a
  - number: 9b
    text: |-
      1 Voor ingekomen werknemers bedraagt de looptijd van de bewijsregel maximaal tien jaar, ingaande op de eerste dag
      van de tewerkstelling door de inhoudingsplichtige.

      2 Voor uitgezonden werknemers is de looptijd van de bewijsregel gelijk aan de duur van de uitzending.
    url: https://wetten.overheid.nl/BWBR0002489/2007-01-01#Artikel9b
  - number: 9c
    text: |-
      1 Indien een ingekomen werknemer tijdens de looptijd een andere inhoudingsplichtige krijgt, blijft op gezamenlijk
      verzoek van de werknemer en de nieuwe inhoudingsplichtige de bewijsregel gedurende de resterende looptijd van
      toepassing, mits de periode tussen het einde van de tewerkstelling door de oude inhoudingsplichtige en de aanvang
      van de tewerkstelling door de nieuwe inhoudingsplichtige niet langer is dan drie maanden.

      2 Bij een dergelijk verzoek moet door de nieuwe inhoudingsplichtige opnieuw aannemelijk worden gemaakt dat de
      werknemer behoort te worden aangemerkt als ingekomen werknemer.
    url: https://wetten.overheid.nl/BWBR0002489/2007-01-01#Artikel9c
  - number: 9d
    text: |-
      1 Indien de ingekomen werknemer niet langer specifieke deskundigheid bezit die op de Nederlandse arbeidsmarkt niet
      of schaars aanwezig is, wordt de looptijd verminderd tot op het moment waarop deze situatie zich gaat voordoen,
      maar tot op niet minder dan vijf jaar.

      2 Met ingang van het zesde jaar van de looptijd kan de inspecteur de inhoudingsplichtige verzoeken aannemelijk te
      maken dat de werknemer nog steeds behoort te worden aangemerkt als ingekomen werknemer.

      3 Indien de inhoudingsplichtige met ingang van het zesde jaar van de looptijd aannemelijk maakt dat de werknemer
      op dat moment nog steeds behoort te worden aangemerkt als een ingekomen werknemer, is het tweede lid gedurende de
      resterende looptijd niet meer van toepassing.
    url: https://wetten.overheid.nl/BWBR0002489/2007-01-01#Artikel9d
  - number: 9e
    text: |-
      1 Indien de ingekomen werknemer voorafgaand aan de aanvang van de tewerkstelling als ingekomen werknemer door de
      inhoudingsplichtige, in Nederland is tewerkgesteld of is verbleven, wordt de looptijd verminderd met de perioden
      van eerdere tewerkstelling en eerder verblijf.

      2 Perioden van eerdere tewerkstelling en eerder verblijf die meer dan vijftien jaar voorafgaand aan de
      tewerkstelling zijn geëindigd, worden niet in aanmerking genomen.

      3 Perioden van eerdere tewerkstelling en eerder verblijf die meer dan tien jaar maar minder dan vijftien jaar
      voorafgaand aan de tewerkstelling zijn geëindigd, worden niet in aanmerking genomen indien de ingekomen werknemer
      in de periode van tien jaar niet in Nederland is tewerkgesteld of is verbleven.

      4 Voor de toepassing van het derde lid is de ingekomen werknemer niet in Nederland tewerkgesteld indien hij in elk
      kalenderjaar van de periode van tien jaar maximaal 20 dagen hier te lande heeft gewerkt.

      5 Voor de toepassing van het derde lid is de ingekomen werknemer niet in Nederland verbleven indien hij in elk
      kalenderjaar van de periode van tien jaar in totaal niet langer dan zes weken in Nederland is verbleven wegens
      vakantie, familiebezoek of andere persoonlijke omstandigheden, waarbij in de periode van tien jaar eenmalig een
      periode van maximaal drie aaneengesloten maanden in Nederland wegens vakantie, familiebezoek of andere persoonlijke
      omstandigheden niet in aanmerking wordt genomen.
    url: https://wetten.overheid.nl/BWBR0002489/2007-01-01#Artikel9e
  - number: 9f
    text: |-
      Indien een verzoek om toepassing van de bewijsregel als bedoeld in [artikel 9h][ref1] niet is gedaan binnen vier
      maanden na aanvang van de tewerkstelling als ingekomen werknemer door de inhoudingsplichtige, wordt de looptijd
      verminderd met de periode tussen het tijdstip waarop de ingekomen werknemer door de inhoudingsplichtige is
      tewerkgesteld en het tijdstip waarop de beschikking, bedoeld in [artikel 9h][ref2], voor het eerst van toepassing
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0002489#Artikel9h
      [ref2]: https://wetten.overheid.nl/BWBR0002489#Artikel9h
    url: https://wetten.overheid.nl/BWBR0002489/2007-01-01#Artikel9f
