  - number: 10d
    text: |-
      1 Als een verzekeraar van een pensioen of een voorziening voor vervroegde uittreding als bedoeld in
      [artikel 19a, eerste lid, onderdeel f, van de wet][ref1] kan door Onze Minister worden aangewezen een verzekeraar
      die op grond van de [Wet op het financieel toezicht][ref2] diensten in Nederland mag verrichten.

      2 Als een pensioenfonds als bedoeld in [artikel 19a, eerste lid, onderdeel f, van de wet][ref3] kan door Onze
      Minister worden aangewezen een lichaam dat naar het recht van de staat van diens zetel bevoegd gelden beheert
      strekkende tot verzekering van aanspraken ingevolge een pensioenregeling van tenminste 100 werknemers of gewezen
      werknemers en dat met betrekking tot deze aanspraken vanuit een vestiging buiten Nederland overeenkomsten sluit.

      3 Alvorens tot een aanwijzing wordt overgegaan, dient de verzekeraar, onderscheidenlijk het pensioenfonds zich
      tegenover Onze Minister, onder door hem te stellen voorwaarden, te verplichten om met betrekking tot de bij deze
      verzekeraar of dit fonds verzekerde of nog te verzekeren aanspraken ingevolge een pensioenregeling, bedoeld in
      [artikel 18 van de wet][ref4] inlichtingen te verstrekken over de uitvoering van de pensioenregelingen en een in
      Nederland uitwinbare zekerheid jegens de ontvanger te stellen voor de invordering van de belasting die mocht worden
      verschuldigd door toepassing van [artikel 19b van de wet][ref5]. In afwijking van de eerste volzin behoeft een in
      een van de lidstaten van de Europese Unie gevestigde verzekeraar of gevestigd pensioenfonds jegens de ontvanger
      geen in Nederland uitwinbare zekerheid te stellen indien deze verzekeraar of dit pensioenfonds, onder door Onze
      Minister te stellen voorwaarden, ingevolge een overeenkomst met de ontvanger aansprakelijkheid aanvaardt voor de in
      die volzin bedoelde belasting.

      4 De aanwijzing kan eveneens plaatsvinden indien de in het derde lid bedoelde zekerheid niet door de verzekeraar of
      het pensioenfonds maar door de werknemer of de gewezen werknemer wordt gesteld, waarbij deze tevens de mogelijkheid
      heeft zekerheid te stellen door middel van verpanding van de aanspraken ingevolge een pensioenregeling aan de
      ontvanger, mits de verzekeraar of het pensioenfonds instemt met deze verpanding.

      5 De aanwijzing kan door Onze Minister worden ingetrokken wanneer de verzekeraar of het pensioenfonds niet meer
      aan de verplichtingen met betrekking tot het verschaffen van inlichtingen of het stellen van zekerheid voldoet of
      niet aan een juiste wijze van uitvoering van een verpanding of van de in het derde lid bedoelde overeenkomst inzake
      aansprakelijkheid meewerkt.

      6 Indien de aanwijzing wordt ingetrokken, worden de aanspraken ingevolge een pensioenregeling niet op het
      onmiddellijk daaraan voorafgaande tijdstip aangemerkt als loon uit vroegere dienstbetrekking van de werknemers
      of gewezen werknemers, dan wel indien een werknemer of gewezen werknemer is overleden, van de gerechtigden tot de
      aanspraken, indien de aanspraken onder door Onze Minister te stellen voorwaarden alsnog overgaan op een verzekeraar
      van een pensioen die voldoet aan de in [artikel 19a van de wet][ref6] gestelde voorwaarden.


