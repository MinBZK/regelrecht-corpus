  - number: 12d
    text: |-
      1 Bij de beoordeling of binnen de in [artikel 18a van de wet][ref1] gestelde begrenzingen wordt gebleven, blijven
      bij een collectieve regeling buiten beschouwing:

      a. op 31 december 2005 bestaande aanspraken, voorzover deze zijn opgebouwd ten behoeve van pensioen in de periode
      voorafgaand aan de datum waarop de werknemer of gewezen werknemer de leeftijd van 65 jaar bereikt;

      b. op 31 december 2005 bestaande aanspraken, voorzover deze zijn opgebouwd door middel van een individuele
      aanvulling op de collectieve regeling.

      2 Voor de toepassing van dit artikel wordt onder een collectieve regeling verstaan een regeling of een gedeelte van
      een regeling waaraan de werknemer verplicht deelnam, voorzover de regeling of het gedeelte van de regeling voor de
      werknemer geen keuzemogelijkheid bood met betrekking tot de hoogte van het op te bouwen pensioen.

      3 Voor de toepassing van dit artikel wordt onder een individuele aanvulling verstaan een pensioen dat in aanvulling
      op een collectieve regeling is opgebouwd.


