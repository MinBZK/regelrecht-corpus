    text: |-
      1 De loonbelasting wordt mede geheven van natuurlijke personen die de navolgende tot het belastbare
      inkomen uit werk en woning dan wel het belastbare inkomen uit werk en woning in Nederland in de zin van de
      [Wet inkomstenbelasting 2001][ref1] behorende inkomsten genieten:

      a. termijnen van lijfrenten, aan een meerderjarige verstrekt door een lichaam dat het levensverzekeringbedrijf
      uitoefent;

      b. uitkeringen ingevolge de [Ziektewet][ref2] en ingevolge de Ongevallenwet 1921, de Land- en Tuinbouwongevallenwet
      1922 en de Zeeongevallenwet 1919 in verbinding met de [Liquidatiewet ongevallenwetten][ref3];

      c. uitkeringen ingevolge de [Algemene Ouderdomswet][ref4], de [Algemene nabestaandenwet][ref5], de
      [Wet werk en inkomen naar arbeidsvermogen][ref6], de [Wet op de arbeidsongeschiktheidsverzekering][ref7],
      de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref8] en de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref9];

      d. uitkeringen ingevolge de [Wet buitengewoon pensioen 1940-1945][ref10], ingevolge
      de [Wet buitengewoon pensioen zeelieden-oorlogsslachtoffers][ref11] en ingevolge de
      [Wet buitengewoon pensioen Indisch verzet][ref12];

      e.

      f. uitkeringen ingevolge de Algemene Oorlogsongevallenregeling (Staatsblad van Nederlandsch-Indië 1946 (nr. 48) en
      de beschikking van de Luitenant-Gouverneur-Generaal van Nederlandsch-Indië van 5 november 1946, nr. 6 (Staatsblad
      van Nederlandsch-Indië 1946, nr. 118), alsmede op deze uitkeringen betrekking hebbende toe- en bijslagen;

      g. uitkeringen ingevolge de [Wet werk en bijstand][ref13] alsmede de in [artikel 3a][ref14] bedoelde uit het
      familierecht voortvloeiende periodieke uitkeringen of verstrekkingen;

      h. uitkeringen ingevolge de [Werkloosheidswet][ref15];

      i. uitkeringen uit de Stichting 1940-1945, de Stichting Friesland 1940-1945 en de Stichting Hulp voor nagelaten
      betrekkingen voor illegale strijders (Stichting Sneek 1940-1945);

      j. uitkeringen uit de Stichting Notarieel Pensioenfonds te 's-Gravenhage;

      k. uitkeringen ingevolge een pensioenregeling waaraan deelneming is verplicht gesteld op grond van de
      [Wet betreffende verplichte deelneming in een beroepspensioenregeling][ref16];

      l. uitkeringen ingevolge de [Wet uitkeringen vervolgingsslachtoffers 1940-1945][ref17] en ingevolge de
      [Wet uitkeringen burger-oorlogsslachtoffers 1940-1945][ref18];

      m. uitkeringen ingevolge de [Remigratiewet][ref19] en de Remigratieregeling 1985;

      n. uitkeringen ingevolge de [Toeslagenwet][ref20];

      o. uitkeringen ingevolge de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref21] en ingevolge de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref22];

      p. uitkeringen ingevolge de [Wet inkomensvoorziening kunstenaars][ref23] en ingevolge de
      [Wet werk en inkomen kunstenaars][ref24];

      q. premies door gemeenten verstrekt in het kader van
      [artikel 7, eerste lid, onderdeel a, van de Wet werk en bijstand][ref25];

      r. uitkeringen als bedoeld in de [Wet op de (re)integratie arbeidsgehandicapten][ref26];

      s. inkomensondersteunende uitkeringen ingevolge [artikel 108, eerste lid, van de Gemeentewet][ref27];

      t. uitkeringen ingevolge de [Tijdelijke regeling tegemoetkoming AOW’ers][ref28];

      u. uitkeringen ingevolge de [Tijdelijke regeling tegemoetkoming Anw-ers][ref29].

      2 De in het eerste lid bedoelde inkomsten worden aangemerkt als loon uit vroegere arbeid.


