  - number: 10c
    text: |-
      Voor de toepassing van [artikel 18h, tweede lid, van de wet][ref1] is een regeling een pensioenregeling indien zij
      voldoet aan [hoofdstuk IIB][ref2] of [hoofdstuk VIII van de wet][ref3], mits:

      a. loonbestanddelen in natura niet tot het pensioengevend loon worden gerekend;

      b. de bedragen die op de voet van de regeling op het loon van de werknemer worden ingehouden niet meer bedragen dan
      hetgeen door de inhoudingsplichtige wordt bijgedragen;

      c. de in te bouwen uitkeringen ingevolge de [Algemene Ouderdomswet][ref4] per dienstjaar worden
      gesteld op ten minste de voor dat jaar geldende uitkeringen voor een ongehuwde persoon als bedoeld in
      [artikel 9, eerste lid, onderdeel a, en zesde lid, onderdeel a, van die wet][ref5], vermeerderd met de vakantie-
      uitkering;

      d. indien de werknemer geen mogelijke nabestaande of wees kan aanwijzen als waarop [artikel 18b][ref6]
      onderscheidenlijk [18c, van de wet][ref7] betrekking heeft, de regeling geen nabestaandenpensioen onderscheidenlijk
      wezenpensioen omvat;

      e. een overbruggingspensioen voorzover dat dient ter overbrugging van een uitkering ingevolge de
      [Algemene Ouderdomswet][ref8] is afgestemd op het op grond van artikel 18a, achtste lid, in de pensioenregeling in
      aanmerking genomen bedrag.


