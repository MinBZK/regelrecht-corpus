  - number: '11.2'
    text: De in het eerste lid bedoelde inkomsten worden aangemerkt als loon uit vroegere arbeid.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel11
  - number: 11a
    text: |-
      Ten aanzien van de werknemer die niet in Nederland woont en die werkzaamheden verricht of heeft verricht in
      de in [artikel 2, derde lid][ref1], van de wet genoemde dienstbetrekkingen, zijn de in [artikel 28][ref2] en
      [29][ref3] van de wet opgenomen verplichtingen niet van toepassing, indien het heffingsrecht over het loon uit
      die dienstbetrekking op grond van een belastingverdrag niet aan Nederland is toegewezen en de werknemer niet
      premieplichtig is voor de volksverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel29
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0002471
        artikel: '29'
  - number: '12'
    text: |-
      Ten aanzien van de in [artikel 7, eerste lid, onderdeel b][ref1], bedoelde werknemers, met uitzondering van
      degenen die een uitkering ontvangen op grond van het [Besluit bijstandverlening zelfstandigen][ref2], herrekent
      de inhoudingsplichtige bij het einde van het kalenderjaar volgens bij ministeriële regeling te stellen regels de
      op de voet van de in die bepaling bedoelde tabel geheven belasting zodanig dat uiteindelijk de belasting zoveel
      mogelijk wordt geheven als hadden de werknemers loon uit vroegere arbeid genoten ander dan uitkeringen ingevolge
      de [Algemene bijstandswet][ref3]. Bij de in de vorige volzin bedoelde herrekening wordt het bedrag van de in
      aanmerking te nemen heffingskorting, in afwijking in zoverre van [artikel 23][ref4] van de wet, verminderd met het
      volgens bij ministeriële regeling te stellen regels te bepalen bedrag aan heffingskorting voor de loonbelasting,
      met uitzondering van de arbeidskorting, waarmee ten aanzien van de werknemer reeds rekening is gehouden bij de
      inhouding van belasting op ander loon.


      [ref1]: https://wetten.overheid.nl/BWBR0002489#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007335
      [ref3]: https://wetten.overheid.nl/BWBR0007333
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel23
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002489
        artikel: '7'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007335
      - id: ref3
        bwb_id: BWBR0007333
      - id: ref4
        bwb_id: BWBR0002471
        artikel: '23'
  - number: 12a.1
    text: |-
      De in [artikel 35, vierde lid][ref1], van de wet bedoelde kostenvergoedingsbeschikking kan betrekking hebben
      op een artiest of beroepssporter (individuele kostenvergoedingsbeschikking), dan wel op een gezelschap
      (gezelschapskostenvergoedingsbeschikking). De in [artikel 35g, vierde lid][ref2], van de wet bedoelde
      kostenvergoedingsbeschikking is een gezelschapskostenvergoedingsbeschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel35g
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 35g
  - number: 12a.2
    text: |-
      De individuele kostenvergoedingsbeschikking heeft betrekking op hetgeen geacht kan worden te strekken tot
      bestrijding van kosten, lasten en afschrijvingen ter behoorlijke vervulling van het optreden of de sportbeoefening,
      dan wel een reeks van optredens of sportbeoefeningen, door de artiest of de beroepssporter.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel12a
  - number: 12a.3
    text: |-
      De gezelschapskostenvergoedingsbeschikking heeft betrekking op hetgeen geacht kan worden te strekken tot
      bestrijding van kosten, lasten en afschrijvingen ter behoorlijke vervulling van het optreden of de sportbeoefening,
      dan wel een reeks van optredens of sportbeoefeningen, door het gezelschap of de leden van het gezelschap.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel12a
  - number: 12a.4
    text: 'Een verzoek om een kostenvergoedingsbeschikking kan bij de inspecteur worden ingediend door:'
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel12a
  - number: 12a.4.a
    text: |-
      voorafgaande aan een optreden of sportbeoefening dan wel een reeks van optredens of sportbeoefeningen: de artiest,
      de beroepssporter, de leider of vertegenwoordiger van het gezelschap dan wel de inhoudingsplichtige;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel12a
  - number: 12a.4.b
    text: |-
      uiterlijk een maand na afloop van een optreden of sportbeoefening dan wel een reeks van optredens of
      sportbeoefeningen: de inhoudingsplichtige.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel12a
  - number: 12a.5
    text: |-
      De inspecteur kan op eigen initiatief dan wel op initiatief van degene die heeft verzocht om de
      kostenvergoedingsbeschikking, deze intrekken of vervangen door een andere kostenvergoedingsbeschikking.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel12a
  - number: 12a.6
    text: |-
      De inhoudingsplichtige neemt een kostenvergoedingsbeschikking slechts in aanmerking indien hij beschikt over
      een kopie daarvan en deze bij de loonadministratie bewaart. De inhoudingsplichtige neemt een individuele
      kostenvergoedingsbeschikking niet in aanmerking indien hij met betrekking tot het optreden of de sportbeoefening
      beschikt over een kopie van een gezelschapskostenvergoedingsbeschikking voor een gezelschap waartoe de artiest of
      beroepssporter behoort.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel12a
  - number: 12a.7
    text: |-
      Indien de inhoudingsplichtige met betrekking tot het optreden of de sportbeoefening niet beschikt over een kopie
      van een kostenvergoedingsbeschikking, wordt hij geacht te beschikken over:
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel12a
  - number: 12a.7.a
    text: |-
      ingeval de artiest of beroepssporter geen deel uitmaakt van een gezelschap: een individuele
      kostenvergoedingsbeschikking tot een bedrag van  € 136 per optreden of sportbeoefening;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel12a
  - number: 12a.7.b
    text: |-
      in het geval van een gezelschap: een gezelschapskostenvergoedingsbeschikking tot een bedrag van  € 136 per optreden
      of sportbeoefening, vermenigvuldigd met het aantal leden van het gezelschap.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel12a
  - number: 12a.8
    text: |-
      Indien zulks door of namens de artiest of beroepssporter dan wel het gezelschap wordt aangegeven, wordt het in het
      zevende lid, onderdeel a of b, genoemde bedrag van  € 136 per optreden of sportbeoefening, vervangen door een lager
      bedrag of blijft toepassing van het zevende lid achterwege.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel12a
  - number: 12a.9
    text: 'Een verzoek als bedoeld in het vierde lid bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel12a
  - number: 12a.9.a
    text: |-
      indien het wordt ingediend door een in Nederland wonende artiest, beroepssporter of leider dan wel
      vertegenwoordiger van een buitenlands gezelschap dan wel een inhoudingsplichtige: zijn naam, adres, woonplaats en
      sociaal-fiscaal nummer;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel12a
  - number: 12a.9.b
    text: |-
      indien het wordt ingediend door een niet in Nederland wonende artiest, beroepssporter of leider dan wel
      vertegenwoordiger van een buitenlands gezelschap als bedoeld in [artikel 5b][ref1] van de wet: zijn naam, adres,
      woonplaats, woonland en geboortedatum;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel5b
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 5b
  - number: 12a.9.c
    text: |-
      indien het wordt ingediend door een inhoudingsplichtige: zijn naam, adres, woonplaats en het loonbelastingnummer,
      alsmede – bij een verzoek voor een artiest of beroepssporter – de naam, adres, woonplaats en, indien deze in
      Nederland woont, het sociaal-fiscaalnummer, en – bij een verzoek voor een gezelschap – de naam, adres, woonplaats
      en, indien deze in Nederland woont, het sociaal-fiscaalnummer van de leider dan wel vertegenwoordiger van het
      gezelschap, en voorts
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel12a
  - number: 12a.9.d
    text: 'bij een gezelschap: de naam van het gezelschap en het aantal leden van het gezelschap;'
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel12a
  - number: 12a.9.e
    text: |-
      de datum van het optreden of de sportbeoefening dan wel, in geval van een reeks van optredens of sportbeoefeningen,
      de periode waarin die optredens of sportbeoefeningen plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel12a
  - number: 12a.9.f
    text: een opgave van de gage, de gemaakte en nog te maken kosten, alsmede een toelichting op deze kosten.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel12a
  - number: 12b.1
    text: |-
      Als gage van de artiest of de beroepssporter die deel uitmaakt van een gezelschap, wordt aangemerkt het deel
      van de met het gezelschap overeengekomen gage dat volgens de leider of vertegenwoordiger van het gezelschap aan
      zijn optreden dan wel sportbeoefening kan worden toegerekend. De leider of vertegenwoordiger van het gezelschap
      geeft aan de inhoudingsplichtige ter zake een ondertekende verklaring af (gageverdelingsverklaring). Indien
      geen verklaring wordt afgegeven of de leider of vertegenwoordiger van het gezelschap de met het gezelschap
      overeengekomen gage niet geheel over de artiesten of beroepssporters heeft verdeeld, wordt de voor het optreden van
      het gezelschap overeengekomen gage geacht door ieder lid van het gezelschap voor een gelijk deel te zijn genoten.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel12b
  - number: 12b.2
    text: 'De in het eerste lid bedoelde gageverdelingsverklaring bevat ten minste de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel12b
  - number: 12b.2.a
    text: 'van de inhoudingsplichtige: naam, adres, woon- of vestigingsplaats en loonbelastingnummer;'
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel12b
  - number: 12b.2.b
    text: |-
      van het gezelschap, niet zijnde een gezelschap als bedoeld in [artikel 5b][ref1] van de wet: naam, adres en
      woonplaats van de leden van het gezelschap, alsmede van de in Nederland wonende leden van het gezelschap het
      sociaal-fiscaalnummer;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel5b
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 5b
  - number: 12b.2.c
    text: |-
      van het gezelschap, bedoeld in [artikel 5b][ref1] van de wet: naam, adres, woonplaats en geboortedatum van de
      leider of vertegenwoordiger van het gezelschap, alsmede de namen van de leden van het gezelschap en het sociaal-
      fiscaalnummer van de in Nederland wonende leden van het gezelschap;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel5b
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 5b
  - number: 12b.2.d
    text: de naam van het gezelschap;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel12b
  - number: 12b.2.e
    text: datum, plaats en naam van de locatie van het optreden of de sportbeoefening;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel12b
  - number: 12b.2.f
    text: het bedrag van de brutogage, waaronder begrepen gage anders dan in geld en kostenvergoedingen;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel12b
  - number: 12b.2.g
    text: |-
      het deel van de brutogage, bedoeld in onderdeel f, dat op grond van het eerste lid volgens de leider of
      vertegenwoordiger van het gezelschap aan het optreden van de artiest dan wel de sportbeoefening van de
      beroepssporter kan worden toegerekend;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel12b
  - number: 12b.2.h
    text: |-
      het bedrag dat elk lid van het gezelschap als kosten in aanmerking kan nemen op grond van een
      kostenvergoedingsbeschikking.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel12b
  - number: 12c
    text: |-
      Indien ten aanzien van de ingekomen werknemer over het jaar 2000 belasting is geheven met toepassing van het
      besluit van 29 mei 1995, nr. DB95/119M, of van een van de in onderdeel 1.9.2. van dat besluit genoemde besluiten,
      behoeft geen verzoek te worden gedaan voor de aansluitende toepassing van [hoofdstuk 3][ref1] per 1 januari 2001.
      In dat geval wordt de in [hoofdstuk 3][ref2] bedoelde looptijd verminderd met de periode gedurende welke dat
      besluit ten aanzien van hem is toegepast, geldt voor de toepassing van [hoofdstuk 3][ref3] als tijdstip waarop de
      ingekomen werknemer door de inhoudingsplichtige is tewerkgesteld, de datum van 1 januari 2001, blijven toegepaste
      kortingen op de looptijd van toepassing en wordt op dat moment geacht te zijn voldaan aan de voorwaarde van
      specifieke deskundigheid en schaarste op de arbeidsmarkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002489#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0002489#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0002489#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel12c
