  - number: '1.2'
    text: 'Dit besluit verstaat onder:'
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel1
  - number: 1.2.a
    text: |-
      wet: [Wet op de loonbelasting 1964][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: 1.2.b
    text: |-
      uitvoerder van aangenomen werk: degene, die, anders dan in de uitoefening van een bedrijf of in de zelfstandige
      uitoefening van een beroep, en anders dan als thuiswerker, ingevolge een overeenkomst tot aanneming van werk als
      bedoeld in [artikel 1639 van Boek 7A van het Burgerlijk Wetboek][ref1] die niet rechtstreeks is aangegaan met een
      natuurlijke persoon ten behoeve van diens persoonlijke aangelegenheden, persoonlijk een werk tot stand brengt;


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1639
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: '1639'
  - number: 1.2.c
    text: 'loon in geld: het loon voor de loonbelasting, voor zover dit in geld wordt verstrekt;'
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel1
  - number: 1.2.d
    text: 'tabelloon: het loon waarop de loonbelastingtabel wordt toegepast;'
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel1
  - number: 1.2.e
    text: |-
      bruto-inkomen: het loon in de zin van de [Wet minimumloon en minimumvakantiebijslag][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002638
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002638
  - number: 1.2.f
    text: |-
      belasting, ingeval [artikel 27, tweede lid, eerste volzin][ref1], van de wet van toepassing is: het gezamenlijke
      bedrag van de belasting en de premie voor de volksverzekeringen;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel27
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '27'
  - number: 1.2.g
    text: |-
      gage: gage als bedoeld in [artikel 35][ref1] van de wet;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel35
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '35'
  - number: 1.2.h
    text: |-
      gezelschap: een groep van natuurlijke personen of rechtspersonen waarbij de leden van de groep individueel of
      gezamenlijk ingevolge een overeenkomst van korte duur, dan wel kortstondig krachtens een andere grond, als artiest
      in Nederland optreden of als beroep een tak van sport in Nederland beoefenen.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel1
  - number: '2'
    text: |-
      Als dienstbetrekking wordt beschouwd de arbeidsverhouding van de topsporter die op grond van het met instemming
      van Onze Minister van Volksgezondheid, Welzijn en Sport vastgestelde reglement van de stichting Fonds voor
      de Topsporter een periodieke uitkering als tegemoetkoming in de kosten van zijn levensonderhoud geniet of een
      kostenvergoeding geniet.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel2
  - number: 2a
    text: |-
      Als dienstbetrekking wordt beschouwd de arbeidsverhouding van degene die door tussenkomst van degene tot wie
      de arbeidsverhouding bestaat, persoonlijk arbeid verricht ten behoeve van een derde, met uitzondering van de
      arbeidsverhouding van degene die:
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel2a
  - number: 2a.a
    text: |-
      doorgaans op minder dan drie dagen per week werkzaam is voor een natuurlijk persoon ten behoeve van diens
      persoonlijke aangelegenheden, tenzij loon wordt verstrekt door degene door wiens tussenkomst de arbeid wordt
      verricht;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel2a
  - number: 2a.b
    text: bij wijze van arbeidstherapie werkzaam is.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel2a
  - number: 2b.1
    text: |-
      Als dienstbetrekking wordt beschouwd de arbeidsverhouding van de thuiswerker of van de hulp van de thuiswerker,
      die persoonlijk arbeid verricht tegen een bruto-inkomen, dat doorgaans over een maand ten minste zal bedragen 2/5
      maal het bedrag, genoemd in [artikel 8, eerste lid, onderdeel ][ref1], dan wel, voor degene, die de leeftijd van 23
      jaar nog niet heeft bereikt en wiens bruto-inkomen uitsluitend in verband met zijn leeftijd op een lager bedrag is
      vastgesteld, 2/5 maal het krachtens genoemde wet voor een werknemer van dezelfde leeftijd geldende bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
  - number: 2b.2
    text: |-
      Het eerste lid is niet van toepassing met betrekking tot een arbeidsverhouding die is aangegaan voor korter dan
      een maand.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel2b
  - number: 2b.3
    text: |-
      Indien binnen een maand na het einde van een arbeidsverhouding met dezelfde opdrachtgever een nieuwe
      arbeidsverhouding wordt aangegaan, geldt het bepaalde in het tweede lid niet ten aanzien van die nieuwe
      arbeidsverhouding, tenzij de tijdvakken voor welke die arbeidsverhoudingen zijn aangegaan te zamen korter zijn dan
      een maand.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel2b
  - number: 2b.4
    text: |-
      Voor de toepassing van het eerste lid is met betrekking tot het bruto-inkomen van een thuiswerker en van de hulp
      van een thuiswerker [artikel 5, eerste lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002489#Artikel5
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0002489
        artikel: '5'
        hoofdstuk: '2'
  - number: 2b.5
    text: |-
      Het eerste lid is niet van toepassing met betrekking tot de arbeidsverhouding van de thuiswerker die zich doorgaans
      laat bijstaan door meer dan twee personen niet zijnde zijn echtgenoot of zijn tot zijn huishouden behorende
      minderjarige kinderen.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel2b
  - number: 2c.1
    text: |-
      Als dienstbetrekking wordt beschouwd de arbeidsverhouding van degene, die persoonlijk arbeid verricht op doorgaans
      ten minste 2 dagen per week tegen een bruto-inkomen dat doorgaans over een week ten minste zal bedragen 2/5 maal
      het bedrag, genoemd in [artikel 8, eerste lid, onderdeel ][ref1], dan wel, voor degene, die de leeftijd van 23
      jaar nog niet heeft bereikt en wiens bruto-inkomen uitsluitend in verband met zijn leeftijd op een lager bedrag is
      vastgesteld, 2/5 maal het krachtens genoemde wet voor een werknemer van dezelfde leeftijd geldende bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
  - number: 2c.2
    text: |-
      Het eerste lid is niet van toepassing met betrekking tot een arbeidsverhouding die is aangegaan voor korter dan
      een maand.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel2c
  - number: 2c.3
    text: |-
      Indien binnen een maand na het einde van een arbeidsverhouding met dezelfde opdrachtgever een nieuwe
      arbeidsverhouding wordt aangegaan, geldt het bepaalde in het tweede lid niet ten aanzien van die nieuwe
      arbeidsverhouding, tenzij de tijdvakken voor welke die arbeidsverhoudingen zijn aangegaan te zamen korter zijn dan
      een maand.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel2c
  - number: 2c.4
    text: |-
      Het eerste lid is niet van toepassing met betrekking tot de arbeidsverhouding van degene die tegen beloning
      persoonlijk arbeid verricht, indien:
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel2c
  - number: 2c.4.a
    text: |-
      zijn arbeidsverhouding tevens is een arbeidsverhouding als bedoeld in [artikel 2][ref1] of [artikel 3][ref2] van de
      wet, ongeacht of hij ingevolge het bij of krachtens die artikelen bepaalde al dan niet werknemer is;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel3
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '3'
  - number: 2c.4.b
    text: hij als bestuurder van een vereniging of stichting werkzaam is voor die vereniging of stichting.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel2c
  - number: 2d
    text: |-
      Waar in de [artikelen 2b][ref1] en [2c][ref2] wordt verwezen naar een in
      [artikel 8, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref3] genoemd bedrag, wordt, indien
      toepassing is gegeven aan [artikel 14][ref4] van die wet, als zodanig in aanmerking genomen het daarbij laatstelijk
      in de plaats daarvan gestelde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002489#Artikel2b
      [ref2]: https://wetten.overheid.nl/BWBR0002489#Artikel2c
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002638#Artikel14
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel2d
    references:
      - id: ref1
        bwb_id: BWBR0002489
        artikel: 2b
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0002489
        artikel: 2c
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0002638
        artikel: '14'
  - number: 2e.1
    text: |-
      [Artikel 2a][ref1] is niet van toepassing met betrekking tot de arbeidsverhouding van degene, die arbeid verricht
      in de uitoefening van een bedrijf of in de zelfstandige uitoefening van een beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0002489#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel2e
    references:
      - id: ref1
        bwb_id: BWBR0002489
        artikel: 2a
        hoofdstuk: '2'
  - number: 2e.2
    text: |-
      [Artikel 2][ref1], en [artikel 2][ref2], zijn niet van toepassing met betrekking tot de arbeidsverhouding van
      degene, die:


      [ref1]: https://wetten.overheid.nl/BWBR0002489#Artikel2b
      [ref2]: https://wetten.overheid.nl/BWBR0002489#Artikel2c
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel2e
    references:
      - id: ref1
        bwb_id: BWBR0002489
        artikel: 2b
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0002489
        artikel: 2c
        hoofdstuk: '2'
  - number: 2e.2.a
    text: arbeid verricht in de uitoefening van een bedrijf of in de zelfstandige uitoefening van een beroep;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel2e
  - number: 2e.2.b
    text: |-
      het verrichten van de arbeid rechtstreeks is overeengekomen met een natuurlijk persoon ten behoeve van diens
      persoonlijke aangelegenheden;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel2e
  - number: 2e.2.c
    text: arbeid van overwegend geestelijke aard verricht;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel2e
  - number: 2e.2.d
    text: werkzaam is in een arbeidsverhouding, die in overwegende mate beheerst wordt door een familieverhouding;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel2e
  - number: 2e.2.e
    text: anders dan bij wijze van beroep, als auteur of redactiemedewerker werkzaam is voor een uitgever.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel2e
  - number: 2e.3
    text: |-
      Voor de toepassing van het tweede lid, onderdeel a, wordt degene die melkvervoer verricht krachtens een
      vervoersovereenkomst en die daarvoor een eigen vervoermiddel pleegt te gebruiken, geacht dit vervoer te verrichten
      in de uitoefening van een bedrijf.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel2e
  - number: 2f
    text: |-
      Indien een arbeidsverhouding, beoordeeld uitsluitend aan de hand van de eerste leden van
      [de artikelen 2 tot en met 2][ref1], op grond van meer dan één van die leden als dienstbetrekking wordt beschouwd,
      vindt alleen dat artikel toepassing in het eerste lid waarvan zulks voor de eerste maal geschiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0002489#Artikel2
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel2f
    references:
      - id: ref1
        bwb_id: BWBR0002489
        artikel: '2'
        hoofdstuk: '2'
  - number: 2g.1
    text: |-
      Als dienstbetrekking wordt voorts beschouwd, zo nodig in afwijking van [artikel 5][ref1] van de wet, de
      arbeidsverhouding welke niet reeds op grond van de wet of [de artikelen 2 tot en met 2c][ref2], in samenhang met
      [artikel 2e][ref3], als dienstbetrekking wordt beschouwd, mits:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002489#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002489#Artikel2e
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel2g
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0002489
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0002489
        artikel: 2e
        hoofdstuk: '2'
  - number: 2g.1.a
    text: |-
      de werkzaamheden van degene die de arbeid verricht, geen belastbare winst in zin van de
      [Wet inkomstenbelasting 2001][ref1] genereren;


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel2g
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: 2g.1.b
    text: |-
      degene die de arbeid verricht, door middel van een gezamenlijke verklaring van hemzelf en de beoogde
      inhoudingsplichtige voor de eerste beoogde inhouding van loonbelasting aan de inspecteur meldt dat zijn
      arbeidsverhouding als dienstbetrekking moet worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel2g
  - number: 2g.2
    text: |-
      Zodra niet meer aan de voorwaarde, bedoeld in het eerste lid, onderdeel a, wordt voldaan, meldt degene die de
      arbeid verricht, dit aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel2g
  - number: 2h
    text: |-
      Als dienstbetrekking wordt voorts beschouwd de arbeidsverhouding van degene die arbeid verricht ten behoeve van een
      vennootschap waarin hij een aanmerkelijk belang heeft in de zin van de [Wet inkomstenbelasting 2001][ref1] ingeval
      die arbeidsverhouding niet reeds op grond van de wet of de [artikelen 2 tot en met 2c][ref2], in samenhang met
      [artikel 2e][ref3] of [artikel 2g][ref4], als dienstbetrekking wordt beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
      [ref2]: https://wetten.overheid.nl/BWBR0002489#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002489#Artikel2e
      [ref4]: https://wetten.overheid.nl/BWBR0002489#Artikel2g
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel2h
    references:
      - id: ref1
        bwb_id: BWBR0011353
      - id: ref2
        bwb_id: BWBR0002489
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0002489
        artikel: 2e
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0002489
        artikel: 2g
        hoofdstuk: '2'
  - number: '3'
    text: |-
      Als degene tot wie de dienstbetrekking bestaat, wordt in de gevallen, bedoeld in de [artikelen 2a][ref1],
      [2c][ref2] en [2g][ref3], beschouwd degene op wie de verplichting rust het loon te betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0002489#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0002489#Artikel2c
      [ref3]: https://wetten.overheid.nl/BWBR0002489#Artikel2g
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002489
        artikel: 2a
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0002489
        artikel: 2c
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0002489
        artikel: 2g
        hoofdstuk: '2'
  - number: 3a
    text: |-
      Ingeval degene die ter voorziening in de algemeen noodzakelijke kosten van het bestaan periodieke uitkeringen
      ingevolge de [Algemene bijstandswet][ref1] verstrekt, bij het vaststellen van de hoogte van die uitkeringen
      rekening houdt met een rechtstreeks uit het familierecht voortvloeiende uitkering of verstrekking in de zin van
      [artikel 3.101, eerste lid, onderdeel b, van de Wet inkomstenbelasting 2001][ref2], niet zijnde een termijn van
      lijfrente, als bedoeld in [artikel 11, eerste lid, onderdeel ][ref3], wordt deze geacht die uit het familierecht
      voortvloeiende uitkering of verstrekking als loon in geld ingevolge de [Algemene bijstandswet][ref4] te
      verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0007333
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002489#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0007333
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0007333
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0002489
        artikel: '11'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0007333
  - number: '4'
    text: |-
      Degene tot wie een werknemer in dienstbetrekking staat - of, indien krachtens [artikel 8, tweede lid][ref1], van
      de wet een ander als inhoudingsplichtige is aangewezen, die ander - wordt geacht aan de werknemer het loon te
      verstrekken, dat deze uit hoofde van zijn dienstbetrekking geniet van een niet-inhoudingsplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel8
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '8'
  - number: '5'
    text: |-
      Als loon van een uitvoerder van aangenomen werk, en van een thuiswerker wordt aangemerkt het gehele door de
      aanbesteder, onderscheidenlijk de opdrachtgever verstrekte loon, verminderd met het loon van de hulpen. Deze
      vermindering is slechts van toepassing voor zover de uitvoerder van aangenomen werk en de thuiswerker aan de
      aanbesteder, onderscheidenlijk de opdrachtgever een door hem en zijn hulpen ondertekende verklaring doet toekomen
      waaruit het loon van ieder van de hulpen blijkt.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel5
  - number: '7.1'
    text: 'Bij ministeriële regeling worden loonbelastingtabellen vastgesteld voor:'
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel7
  - number: 7.1.a
    text: |-
      uitvoerders van aangenomen werk, hun hulpen en degenen wier arbeidsverhouding ingevolge [artikel 2][ref1] of
      [artikel 2][ref2], als dienstbetrekking wordt beschouwd;


      [ref1]: https://wetten.overheid.nl/BWBR0002489#Artikel2b
      [ref2]: https://wetten.overheid.nl/BWBR0002489#Artikel2c
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002489
        artikel: 2b
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0002489
        artikel: 2c
        hoofdstuk: '2'
  - number: 7.1.b
    text: |-
      degenen die uitkeringen ontvangen ingevolge de [Algemene bijstandswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007333
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007333
  - number: 7.1.c
    text: |-
      degenen die uitkeringen ontvangen ingevolge de [Wet inkomensvoorziening kunstenaars][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009344
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009344
  - number: '7.2'
    text: |-
      De belasting naar het belastbare loon dat wordt genoten door de in het eerste lid bedoelde werknemers, bedraagt
      het in de voor hen geldende loonbelastingtabel aangewezen percentage van het tabelloon, met dien verstande
      dat dit percentage wordt verhoogd tot 52 ingeval de werknemer zijn naam, adres of woonplaats niet aan de
      inhoudingsplichtige heeft verstrekt dan wel, ingeval de werknemer loon uit tegenwoordige dienstbetrekking geniet,
      zijn identiteit niet is vastgesteld overeenkomstig [artikel 28, eerste lid, onderdeel ][ref1], van de wet,
      alsmede ingeval de werknemer ter zake onjuiste gegevens heeft verstrekt en de inhoudingsplichtige dit weet of
      redelijkerwijs moet weten.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '28'
  - number: '7.3'
    text: 'Het tabelloon is:'
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel7
  - number: 7.3.a
    text: |-
      in de gevallen bedoeld in het eerste lid, onderdeel a: het loon vermeerderd met de bedragen bedoeld in
      [artikel 11, eerste lid, onderdeel j, onder 2° en 3°][ref1], van de wet en verminderd met tot het loon behorende
      aanspraken;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
  - number: 7.3.b
    text: |-
      in de gevallen bedoeld in het eerste lid, onderdelen b en c: het loon in geld, nadat dit is verminderd met de door
      de inhoudingsplichtige voor zijn rekening genomen belasting.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel7
  - number: '7.4'
    text: |-
      Het bepaalde in de vorige leden is niet van toepassing met betrekking tot uitkeringen ingevolge sociale
      verzekeringswetten die zonder tussenkomst van de inhoudingsplichtige worden genoten.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel7
  - number: '7.5'
    text: |-
      Voor gevallen waarin [artikel 27, tweede lid, eerste volzin][ref1], van de wet toepassing vindt, worden de in het
      eerste lid bedoelde tabellen zodanig vastgesteld dat telkens de belasting en de premie voor de volksverzekeringen
      in één percentage worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel27
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '27'
  - number: '8.1'
    text: In dit hoofdstuk en de daarop berustende regelingen zijn de volgende definities van toepassing.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel8
  - number: '8.2'
    text: 'Verstaan wordt onder:'
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel8
  - number: 8.2.a
    text: 'extraterritoriale werknemers: ingekomen werknemers en uitgezonden werknemers;'
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel8
  - number: 8.2.b
    text: |-
      ingekomen werknemer: door een inhoudingsplichtige uit een ander land aangeworven, of naar een inhoudingsplichtige
      gezonden werknemer in de zin van [artikel 2][ref1] van de wet, met een specifieke deskundigheid die op de
      Nederlandse arbeidsmarkt niet of schaars aanwezig is;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel2
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '2'
  - number: 8.2.c
    text: |-
      uitgezonden werknemer: werknemer in de zin van [artikel 2][ref1] van de wet, door een inhoudingsplichtige naar het
      buitenland gezonden met het oog op:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel2
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '2'
  - number: 8.2.c.1°
    text: plaatsing als ambtenaar bij een vertegenwoordiging van het Koninkrijk der Nederlanden in het buitenland (post);
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel8
  - number: 8.2.c.2°
    text: tewerkstelling als ambtenaar, rechterlijk ambtenaar of militair op de Nederlandse Antillen of Aruba;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel8
  - number: 8.2.c.3°
    text: tewerkstelling als militair buiten het Koninkrijk der Nederlanden;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel8
  - number: 8.2.c.4°
    text: |-
      tewerkstelling in een bij ministeriële regeling, in overeenstemming met Onze Minister van
      Ontwikkelingssamenwerking, aangewezen regio;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel8
  - number: 8.2.c.5°
    text: het beoefenen van wetenschap of het geven van onderwijs.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel8
  - number: 8.2.d
    text: 'looptijd: de periode gedurende welke dit hoofdstuk voor een werknemer van toepassing is.'
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel8
  - number: '8.3'
    text: |-
      Een werknemer wordt slechts als uitgezonden aangemerkt indien hij in een periode van twaalf maanden ten minste
      45 dagen ten behoeve van zijn werkzaamheden verblijft in een of meer plaatsen waarnaar hij is gezonden. Bij de
      bepaling of aan deze voorwaarde is voldaan worden verblijfsperioden van minder dan 15 dagen niet in aanmerking
      genomen en worden dagen waarop de werknemer zonder onderbreking naar de desbetreffende plaatsen en terug reist –
      of zou reizen bij gebruikmaking van het voor werknemers in het algemeen meest gebruikelijke vervoermiddel – als
      dagen van verblijf in die plaatsen aangemerkt. Indien aan de voorwaarde is voldaan, kan de werknemer tevens als
      uitgezonden worden beschouwd gedurende alle overige dienstreizen van ten minste 10 dagen naar de desbetreffende
      plaatsen.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel8
  - number: '8.4'
    text: 'Ambtenaren bij een post zijn:'
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel8
  - number: 8.4.a
    text: |-
      overplaatsbare ambtenaren van de Dienst Buitenlandse Zaken van het ministerie van Buitenlandse Zaken, zijnde
      ambtenaren die zijn aangesteld om waar ook ter wereld werkzaam te zijn;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel8
  - number: 8.4.b
    text: niet-overplaatsbare ambtenaren van die Dienst Buitenlandse Zaken die tijdelijk aan een post zijn toegevoegd;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel8
  - number: 8.4.c
    text: ambtenaren van andere ministeries die op een post zijn tewerkgesteld;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel8
  - number: 8.4.d
    text: |-
      militairen en burgerpersoneel van het ministerie van Defensie die op een post zijn geplaatst, alsmede vlag- en
      opperofficieren die zijn geplaatst op internationale staven in het buitenland;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel8
  - number: 8.4.e
    text: |-
      werknemers die op basis van een arbeidsovereenkomst naar burgerlijk recht na uitzending vanuit Nederland
      werkzaamheden verrichten bij een post.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel8
  - number: '8.5'
    text: 'Onder het beoefenen van wetenschap of het geven van onderwijs wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel8
  - number: 8.5.a
    text: 'het buiten Nederland verrichten van onderzoek op de financiële basis van:'
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel8
  - number: 8.5.a.1°
    text: |-
      een beurs of stipendium van de Nederlandse organisatie voor wetenschappelijk onderzoek of de Stichting voor
      wetenschappelijk onderzoek van de tropen;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel8
  - number: 8.5.a.2°
    text: een NATO-fellowship;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel8
  - number: 8.5.a.3°
    text: door Onze minister aan te wijzen vergelijkbare beurzen, stipendia en fellowships;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel8
  - number: 8.5.b
    text: |-
      het als leerkracht of beoefenaar van wetenschap door een instelling op het gebied van onderwijs of wetenschap
      worden uitgezonden dan wel op uitnodiging van een dergelijke in het buitenland gevestigde instelling zich naar
      het buitenland begeven, met het doel aldaar onderwijs te geven aan een instelling op het gebied van onderwijs of
      wetenschap of wetenschappelijk onderzoek te verrichten voor een dergelijke instelling.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel8
  - number: '8.6'
    text: |-
      Schoolgelden zijn uitgaven voor het door kinderen van de extraterritoriale werknemer volgen van basisonderwijs
      of voortgezet onderwijs aan internationale scholen en internationale afdelingen van niet-internationale scholen,
      tot de bedragen die door de school overeenkomstig haar tarieven voor onderwijs in rekening worden gebracht, met
      uitzondering van kosten van kost en inwoning maar met inbegrip van vervoerskosten.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel8
  - number: '9.1'
    text: |-
      Vergoedingen en verstrekkingen aan extraterritoriale werknemers van kosten, respectievelijk ter voorkoming van
      kosten van verblijf buiten het land van herkomst worden, ten aanzien van ingekomen werknemers op gezamenlijk
      verzoek van de werknemer en de inhoudingsplichtige, in elk geval beschouwd als vergoeding voor extraterritoriale
      kosten tot (bewijsregel):
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel9
  - number: 9.1.a
    text: |-
      30% van de grondslag, waarbij de grondslag is de som van het loon uit tegenwoordige dienstbetrekking ter zake van
      het verblijf buiten het land van herkomst voorzover de ingekomen of uitgezonden werknemer ter zake geen recht heeft
      op voorkoming van dubbele belasting, en de vergoeding voor extraterritoriale kosten;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel9
  - number: 9.1.b
    text: het bedrag van de schoolgelden.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel9
  - number: '9.2'
    text: |-
      In geval van verstrekkingen zijn de waarderingsregels krachtens [artikel 13][ref1] van de wet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel13
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '13'
  - number: 9a.1
    text: |-
      Bij de beoordeling of een ingekomen werknemer specifieke deskundigheid bezit die op de Nederlandse arbeidsmarkt
      niet of schaars aanwezig is, wordt in onderlinge samenhang rekening gehouden met de volgende factoren, voorzover
      relevant:
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel9a
  - number: 9a.1.a
    text: het niveau van de door de werknemer gevolgde opleiding;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel9a
  - number: 9a.1.b
    text: de voor de functie relevante ervaring van de werknemer;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel9a
  - number: 9a.1.c
    text: |-
      het beloningsniveau van de onderhavige functie in Nederland in verhouding tot het beloningsniveau in het land van
      herkomst van de werknemer.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel9a
  - number: 9a.2
    text: |-
      Een werknemer van het middenkader of hoger kader van een internationaal concern met ten minste twee en een
      half jaar ervaring in dat concern die in het kader van roulatie wordt uitgezonden naar Nederland, wordt geacht
      specifieke deskundigheid te bezitten die op de Nederlandse arbeidsmarkt niet of schaars aanwezig is.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel9a
  - number: 9b.1
    text: |-
      Voor ingekomen werknemers bedraagt de looptijd van de bewijsregel maximaal tien jaar, ingaande op de eerste dag van
      de tewerkstelling door de inhoudingsplichtige.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel9b
  - number: 9b.2
    text: Voor uitgezonden werknemers is de looptijd van de bewijsregel gelijk aan de duur van de uitzending.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel9b
  - number: 9c.1
    text: |-
      Indien een ingekomen werknemer tijdens de looptijd een andere inhoudingsplichtige krijgt, blijft op gezamenlijk
      verzoek van de werknemer en de nieuwe inhoudingsplichtige de bewijsregel gedurende de resterende looptijd van
      toepassing, mits de periode tussen het einde van de tewerkstelling door de oude inhoudingsplichtige en de aanvang
      van de tewerkstelling door de nieuwe inhoudingsplichtige niet langer is dan drie maanden.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel9c
  - number: 9c.2
    text: |-
      Bij een dergelijk verzoek moet door de nieuwe inhoudingsplichtige opnieuw aannemelijk worden gemaakt dat de
      werknemer behoort te worden aangemerkt als ingekomen werknemer.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel9c
  - number: 9d.1
    text: |-
      Indien de ingekomen werknemer niet langer specifieke deskundigheid bezit die op de Nederlandse arbeidsmarkt niet of
      schaars aanwezig is, wordt de looptijd verminderd tot op het moment waarop deze situatie zich gaat voordoen, maar
      tot op niet minder dan vijf jaar.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel9d
  - number: 9d.2
    text: |-
      Met ingang van het zesde jaar van de looptijd kan de inspecteur de inhoudingsplichtige verzoeken aannemelijk te
      maken dat de werknemer nog steeds behoort te worden aangemerkt als ingekomen werknemer.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel9d
  - number: 9d.3
    text: |-
      Indien de inhoudingsplichtige met ingang van het zesde jaar van de looptijd aannemelijk maakt dat de werknemer
      op dat moment nog steeds behoort te worden aangemerkt als een ingekomen werknemer, is het tweede lid gedurende de
      resterende looptijd niet meer van toepassing.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel9d
  - number: 9e.1
    text: |-
      Indien de ingekomen werknemer voorafgaand aan de aanvang van de tewerkstelling als ingekomen werknemer door de
      inhoudingsplichtige, in Nederland is tewerkgesteld of is verbleven, wordt de looptijd verminderd met de perioden
      van eerdere tewerkstelling en eerder verblijf.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel9e
  - number: 9e.2
    text: |-
      Perioden van eerdere tewerkstelling en eerder verblijf die meer dan vijftien jaar voorafgaand aan de tewerkstelling
      zijn geëindigd, worden niet in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel9e
  - number: 9e.3
    text: |-
      Perioden van eerdere tewerkstelling en eerder verblijf die meer dan tien jaar maar minder dan vijftien jaar
      voorafgaand aan de tewerkstelling zijn geëindigd, worden niet in aanmerking genomen indien de ingekomen werknemer
      in de periode van tien jaar niet in Nederland is tewerkgesteld of is verbleven.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel9e
  - number: 9e.4
    text: |-
      Voor de toepassing van het derde lid is de ingekomen werknemer niet in Nederland tewerkgesteld indien hij in elk
      kalenderjaar van de periode van tien jaar maximaal 20 dagen hier te lande heeft gewerkt.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel9e
  - number: 9e.5
    text: |-
      Voor de toepassing van het derde lid is de ingekomen werknemer niet in Nederland verbleven indien hij in elk
      kalenderjaar van de periode van tien jaar in totaal niet langer dan zes weken in Nederland is verbleven wegens
      vakantie, familiebezoek of andere persoonlijke omstandigheden, waarbij in de periode van tien jaar eenmalig een
      periode van maximaal drie aaneengesloten maanden in Nederland wegens vakantie, familiebezoek of andere persoonlijke
      omstandigheden niet in aanmerking wordt genomen.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel9e
  - number: 9f
    text: |-
      Indien een verzoek om toepassing van de bewijsregel als bedoeld in [artikel 9h][ref1] niet is gedaan binnen vier
      maanden na aanvang van de tewerkstelling als ingekomen werknemer door de inhoudingsplichtige, wordt de looptijd
      verminderd met de periode tussen het tijdstip waarop de ingekomen werknemer door de inhoudingsplichtige is
      tewerkgesteld en het tijdstip waarop de beschikking, bedoeld in [artikel 9h][ref2], voor het eerst van toepassing
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0002489#Artikel9h
      [ref2]: https://wetten.overheid.nl/BWBR0002489#Artikel9h
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel9f
    references:
      - id: ref1
        bwb_id: BWBR0002489
        artikel: 9h
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0002489
        artikel: 9h
        hoofdstuk: '3'
  - number: 9g
    text: |-
      Bij vermindering van de looptijd volgens dit hoofdstuk wordt een periode waarmee de looptijd wordt verminderd naar
      boven afgerond op gehele kalendermaanden.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel9g
  - number: 9h.1
    text: |-
      Een verzoek om toepassing of voortgezette toepassing van de bewijsregel ten aanzien van een ingekomen werknemer
      wordt gedaan aan de inspecteur. Deze beslist op het verzoek bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel9h
  - number: 9h.2
    text: |-
      Indien het verzoek is gedaan binnen vier maanden na aanvang van de tewerkstelling als extraterritoriale
      werknemer door de inhoudingsplichtige, werkt de beschikking terug tot en met de aanvang van de tewerkstelling als
      extraterritoriale werknemer. Indien het verzoek later is gedaan, is de beschikking van toepassing met ingang van de
      eerste dag van de maand volgend op de maand waarin het verzoek is gedaan.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel9h
  - number: 10a.1
    text: |-
      Als perioden die meetellen als dienstjaren dan wel als diensttijd, als bedoeld in de [artikelen 18a][ref1],
      [18b][ref2], [18c][ref3], [18e][ref4], [18i][ref5] en [38a][ref6] van de wet, worden in aanmerking genomen:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18b
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel18c
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel18e
      [ref5]: https://wetten.overheid.nl/BWBR0002471#Artikel18i
      [ref6]: https://wetten.overheid.nl/BWBR0002471#Artikel38a
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 18b
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 18c
      - id: ref4
        bwb_id: BWBR0002471
        artikel: 18e
      - id: ref5
        bwb_id: BWBR0002471
        artikel: 18i
      - id: ref6
        bwb_id: BWBR0002471
        artikel: 38a
  - number: 10a.1.a
    text: |-
      de periode gedurende welke de dienstbetrekking heeft geduurd, daaronder begrepen perioden van – al dan niet in
      deeltijd –:
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10a
  - number: 10a.1.a.1°
    text: |-
      ouderschapsverlof als bedoeld in [artikel 644 van boek 7 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel644
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '644'
  - number: 10a.1.a.2°
    text: |-
      sabbatsverlof krachtens een schriftelijk vastgelegde regeling van de inhoudingsplichtige gedurende ten hoogste
      twaalf maanden;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10a
  - number: 10a.1.a.3°
    text: |-
      studieverlof voor cursussen, voor opleidingen of studie voor een beroep, voor het op peil houden van de vakkennis
      en voor cursussen, opleidingen of studie die door de inhoudingsplichtige worden gefinancierd;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10a
  - number: 10a.1.a.4°
    text: |-
      verlof als bedoeld in artikel 1, onderdeel a, van de Wet financiering loopbaanonderbreking gedurende ten hoogste
      achttien maanden;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10a
  - number: 10a.1.b
    text: |-
      perioden gedurende welke de werknemer in dienstbetrekking heeft gestaan tot een met de inhoudingsplichtige
      verbonden lichaam als bedoeld in [artikel 10a, vierde lid, van de Wet op de vennootschapsbelasting 1969][ref1],
      dat niet in Nederland is gevestigd, voorzover hij bij dat verbonden lichaam niet heeft deelgenomen aan een
      pensioenregeling;


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 10a
  - number: 10a.1.c
    text: |-
      perioden gedurende welke, in aansluiting op de in de onderdelen a en b bedoelde perioden, na onvrijwillig ontslag
      loongerelateerde uitkeringen worden ontvangen, of, onder door Onze Minister te stellen voorwaarden, perioden na
      ontslag van ten hoogste drie jaar;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10a
  - number: 10a.1.d
    text: |-
      perioden gedurende welke, in aansluiting op de in onderdelen a en b bedoelde perioden, uitkeringen worden ontvangen
      ingevolge een regeling voor vervroegde uittreding als bedoeld in [artikel 18i][ref1] van de wet;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18i
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18i
  - number: 10a.1.e
    text: |-
      perioden gedurende welke, in aansluiting op de in onderdelen a en b bedoelde perioden, uitkeringen worden ontvangen
      ingevolge een prepensioenregeling als bedoeld in [artikel 38a][ref1] van de wet;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel38a
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 38a
  - number: 10a.1.f
    text: |-
      dienstjaren ten gevolge van waardeoverdracht van pensioenkapitaal, als bedoeld in de
      [artikelen 32, vierde lid][ref1], [32a][ref2] of [32b, van de Pensioen- en spaarfondsenwet][ref3], naar de huidige
      inhoudingsplichtige of de pensioenuitvoerder van de huidige inhoudingsplichtige, voor zover deze jaren op basis van
      een adequate diensttijdadministratie kunnen worden vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel32a
      [ref3]: https://wetten.overheid.nl/BWBR0002089#Artikel32b
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: '32'
      - id: ref2
        bwb_id: BWBR0002089
        artikel: 32a
      - id: ref3
        bwb_id: BWBR0002089
        artikel: 32b
  - number: 10a.1.g
    text: |-
      perioden waarin de werknemer een tot zijn huishouden behorend kind heeft verzorgd dat de leeftijd van twaalf jaar
      niet heeft bereikt, met dien verstande dat de perioden waarin de kinderen die hij heeft verzorgd de leeftijd van
      zes jaar hebben bereikt, meetellen voor de helft. Bij dienstbetrekkingen in deeltijd wordt de aldus in aanmerking
      te nemen periode verminderd overeenkomstig de deeltijdfactor.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10a
  - number: 10a.2
    text: |-
      In afwijking van het eerste lid, onderdeel a, is met betrekking tot perioden vóór 8 juli 1994 gedurende
      welke de werknemer in dienstbetrekking heeft gestaan tot vorige inhoudingsplichtigen, inkoop van ontbrekende
      dienstjaren tot 8 juli 1994 toegestaan indien de werknemer aannemelijk kan maken dat er, gerelateerd aan de
      pensioenregeling bij de huidige inhoudingsplichtige, als gevolg van het ontbreken van die dienstjaren sprake
      is van een pensioentekort, daaronder begrepen perioden vóór 8 juli 1994 gedurende welke in het buitenland
      werkzaamheden zijn verricht voor een met een vorige inhoudingsplichtige verbonden lichaam als bedoeld in
      [artikel 10a, vierde lid, van de Wet op de vennootschapsbelasting 1969][ref1], dat niet in Nederland is gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 10a
  - number: 10b.1
    text: |-
      Als loonbestanddelen, als bedoeld in [artikel 18g, tweede lid, onderdeel a][ref1], van de wet komen in aanmerking
      alle loonbestanddelen, met uitzondering van het genot van een ter beschikking gestelde auto. Voorzover over
      loonbestanddelen pensioen wordt opgebouwd volgens een eindloonstelsel komen loonstijgingen gedurende de vijf jaren
      voorafgaande aan de in de pensioenregeling vastgestelde ingangsdatum in aanmerking tot ten hoogste 2 percent boven
      de gemiddelde loonindex voor de CAO-lonen per maand, inclusief bijzondere beloningen, zoals berekend door het
      Centraal Bureau voor de Statistiek, met dien verstande dat in elk geval in aanmerking komen loonstijgingen als
      gevolg van gangbare functiewijzigingen of gangbare leeftijdsperiodieken.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18g
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18g
  - number: 10b.2
    text: |-
      Voor de toepassing van [artikel 18g, tweede lid, onderdeel b][ref1], van de wet komen niet tot het regelmatig
      genoten loon behorende loonbestanddelen slechts in aanmerking voorzover de opbouw van het pensioen volgens een
      ander stelsel dan het eindloonstelsel plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18g
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18g
  - number: 10b.3
    text: |-
      Voor de toepassing van [artikel 18g, tweede lid, onderdeel c][ref1], van de wet mag een loonsverlaging buiten
      beschouwing blijven, voorzover deze het gevolg is van het aanvaarden van een deeltijdfunctie die ten minste 50% van
      een voltijdfunctie beloopt, dan wel het terugtreden naar een lager gekwalificeerde functie, in de periode van tien
      jaren direct voorafgaande aan de in de pensioenregeling vastgestelde ingangsdatum.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18g
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18g
  - number: 10c
    text: |-
      Voor de toepassing van [artikel 18h, tweede lid][ref1], van de wet is een regeling een pensioenregeling indien zij
      voldoet aan [hoofdstuk IIB][ref2] van de wet, mits:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18h
      [ref2]: https://wetten.overheid.nl/BWBR0002471#HoofdstukIIB
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18h
      - id: ref2
        bwb_id: BWBR0002471
        hoofdstuk: IIB
  - number: 10c.a
    text: loonbestanddelen in natura niet tot het pensioengevend loon worden gerekend;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10c
  - number: 10c.b
    text: |-
      de bedragen die op de voet van de regeling op het loon van de werknemer worden ingehouden niet meer bedragen dan
      hetgeen door de inhoudingsplichtige wordt bijgedragen;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10c
  - number: 10c.c
    text: |-
      de in te bouwen uitkeringen ingevolge de [Algemene Ouderdomswet][ref1] per dienstjaar worden gesteld
      op ten minste de voor dat jaar geldende uitkeringen voor een ongehuwde persoon als bedoeld in
      [artikel 9, eerste lid, onderdeel a, en vijfde lid, onderdeel a][ref2], van die wet, vermeerderd met de vakantie-
      uitkering;


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '9'
  - number: 10c.d
    text: |-
      indien de werknemer geen mogelijke nabestaande of wees kan aanwijzen als waarop [artikel 18b][ref1]
      onderscheidenlijk [18c][ref2], van de wet betrekking heeft, de regeling geen nabestaandenpensioen onderscheidenlijk
      wezenpensioen omvat;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18b
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18c
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18b
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 18c
  - number: 10c.e
    text: |-
      een overbruggingspensioen voorzover dat dient ter overbrugging van een uitkering ingevolge de
      [Algemene Ouderdomswet][ref1] is afgestemd op het op grond van artikel 18a, achtste lid, in de pensioenregeling in
      aanmerking genomen bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 10d.1
    text: |-
      Als een verzekeraar van een pensioen of een voorziening voor vervroegde uittreding als bedoeld in
      [artikel 19a, eerste lid, onderdeel f][ref1], van de wet kan door Onze Minister worden aangewezen een
      verzekeraar die op grond van de [artikelen 111, eerste lid, onderdelen a tot en met c, of tweede lid][ref2],
      [113, eerste of vierde lid][ref3], [116, eerste lid, onderdelen a tot en met c, of derde lid][ref4],
      of [118, tweede of vijfde lid, van de Wet toezicht verzekeringsbedrijf 1993][ref5] bevoegd is diensten naar
      Nederland te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel111
      [ref3]: https://wetten.overheid.nl/BWBR0006509#Artikel113
      [ref4]: https://wetten.overheid.nl/BWBR0006509#Artikel116
      [ref5]: https://wetten.overheid.nl/BWBR0006509#Artikel118
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10d
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19a
      - id: ref2
        bwb_id: BWBR0006509
        artikel: '111'
      - id: ref3
        bwb_id: BWBR0006509
        artikel: '113'
      - id: ref4
        bwb_id: BWBR0006509
        artikel: '116'
      - id: ref5
        bwb_id: BWBR0006509
        artikel: '118'
  - number: 10d.2
    text: |-
      Als een pensioenfonds als bedoeld in [artikel 19a, eerste lid, onderdeel f][ref1], van de wet kan door Onze
      Minister worden aangewezen een lichaam dat naar het recht van de staat van diens zetel bevoegd gelden beheert
      strekkende tot verzekering van aanspraken ingevolge een pensioenregeling of een regeling voor vervroegde uittreding
      van tenminste 100 werknemers of gewezen werknemers en dat met betrekking tot deze aanspraken vanuit een vestiging
      buiten Nederland overeenkomsten sluit.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10d
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19a
  - number: 10d.3
    text: |-
      Alvorens tot een aanwijzing wordt overgegaan, dient de verzekeraar, onderscheidenlijk het pensioenfonds zich
      tegenover Onze Minister, onder door hem te stellen voorwaarden, te verplichten om met betrekking tot de bij
      deze verzekeraar of dit fonds verzekerde of nog te verzekeren aanspraken ingevolge een pensioenregeling of een
      regeling voor vervroegde uittreding, bedoeld in de [artikelen 18][ref1] en [18i][ref2] van de wet inlichtingen
      te verstrekken over de uitvoering van de pensioenregelingen en de regelingen voor vervroegde uittreding en een in
      Nederland uitwinbare zekerheid jegens de ontvanger te stellen voor de invordering van de belasting die mocht worden
      verschuldigd door toepassing van [artikel 19b][ref3] van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18i
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel19b
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10d
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 18i
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 19b
  - number: 10d.4
    text: |-
      De aanwijzing kan eveneens plaatsvinden indien de in het derde lid bedoelde zekerheid niet door de verzekeraar of
      het pensioenfonds maar door de werknemer of de gewezen werknemer wordt gesteld, waarbij deze tevens de mogelijkheid
      heeft zekerheid te stellen door middel van verpanding van de aanspraken ingevolge een pensioenregeling of de
      regeling voor vervroegde uittreding aan de ontvanger, mits de verzekeraar of het pensioenfonds instemt met deze
      verpanding.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10d
  - number: 10d.5
    text: |-
      De aanwijzing kan door Onze Minister worden ingetrokken wanneer de verzekeraar of het pensioenfonds niet meer aan
      de verplichtingen met betrekking tot het verschaffen van inlichtingen of het stellen van zekerheid voldoet of niet
      aan een juiste wijze van uitvoering van een verpanding meewerkt.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10d
  - number: 10d.6
    text: |-
      Indien de aanwijzing wordt ingetrokken, worden de aanspraken ingevolge een pensioenregeling of een regeling voor
      vervroegde uittreding niet op het onmiddellijk daaraan voorafgaande tijdstip aangemerkt als loon uit vroegere
      dienstbetrekking van de werknemers of gewezen werknemers, dan wel indien een werknemer of gewezen werknemer
      is overleden, van de gerechtigden tot de aanspraken, indien de aanspraken onder door Onze Minister te stellen
      voorwaarden alsnog overgaan op een verzekeraar van een pensioen of een voorziening voor vervroegde uittreding die
      voldoet aan de in [artikel 19a][ref1] van de wet gestelde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10d
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19a
  - number: 10e.1
    text: De Adviescommissie fiscale behandeling pensioenen bestaat uit een voorzitter, tevens lid, en zes andere leden.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10e
  - number: 10e.2
    text: 'De leden van de commissie zijn ten minste afkomstig uit kringen van:'
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10e
  - number: 10e.2.a
    text: werkgevers;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10e
  - number: 10e.2.b
    text: werknemers;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10e
  - number: 10e.2.c
    text: pensioenfondsen;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10e
  - number: 10e.2.d
    text: levensverzekeringsmaatschappijen;
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10e
  - number: 10e.2.e
    text: de wetenschap.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10e
  - number: 10e.3
    text: |-
      De voorzitter en de andere leden van de commissie worden in overeenstemming met Onze Minister van Sociale Zaken
      en Werkgelegenheid benoemd door Onze Minister. Zij worden benoemd voor een termijn van ten hoogste vier jaren. Zij
      zijn te allen tijde herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10e
  - number: 10e.4
    text: De commissie stelt haar eigen werkwijze vast. In het secretariaat wordt voorzien door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10e
  - number: 10e.5
    text: De kosten van de commissie komen ten laste van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10e
  - number: 10f.1
    text: |-
      Ten aanzien van de werknemers aan wie kosten verband houdende met het vervoer per auto als bedoeld in artikel 15b,
      eerste lid, onderdeel b, worden vergoed, is het toegestaan dat deze vergoedingen slechts als loon in aanmerking
      worden genomen voor zover zij in totaal meer hebben bedragen dan het aantal in het kalenderjaar voor vergoeding in
      aanmerking gekomen kilometers vermenigvuldigd met het in de genoemde bepaling bedoelde bedrag per kilometer.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10f
  - number: 10f.2
    text: |-
      Het op de voet van het eerste lid als loon in aanmerking te nemen bedrag wordt geacht niet te behoren tot het loon
      van het kalenderjaar doch wordt geacht te behoren tot het loon van het volgende kalenderjaar en te zijn betaald op
      de laatste werkdag in januari van dat volgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10f
  - number: 10f.3
    text: |-
      Ingeval de dienstbetrekking in de loop van het kalenderjaar is geëindigd komt bij de toepassing van het eerste
      en het tweede lid voor het kalenderjaar in de plaats het tijdvak gedurende hetwelk de dienstbetrekking in het
      kalenderjaar heeft bestaan en wordt het als loon in aanmerking te nemen bedrag geacht te behoren tot het loon van
      de kalendermaand volgende op die waarin de dienstbetrekking is geëindigd en te zijn betaald op de laatste werkdag
      van die volgende kalendermaand.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10f
  - number: 10f.4
    text: |-
      Ten aanzien van de werknemers aan wie kosten verband houdende met het vervoer per auto als bedoeld in artikel 15,
      eerste lid, onderdeel b, worden vergoed, is het, indien het eerste lid geen toepassing vindt, toegestaan dat het
      ter zake van die vergoedingen als loon van de maand december van het kalenderjaar in aanmerking te nemen bedrag
      wordt geacht niet te behoren tot het loon van die maand doch wordt geacht te behoren tot het loon van de maand
      januari van het volgende kalenderjaar en te zijn betaald op de laatste werkdag van deze maand.
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10f
  - number: 10g.1
    text: |-
      Ten aanzien van een in de onderneming van zijn ouder werkzaam kind dat behoort tot het huishouden van die ouder
      en niet verzekerd is ingevolge enige andere sociale verzekering dan een volksverzekering, kan de inspecteur
      onder door hem te stellen voorwaarden toestaan dat de belasting wordt ingehouden op de eerste werkdag van het
      volgende kalenderjaar, met toepassing van de loonbelastingtabellen voor het kalenderjaar waarin het loon is
      verstrekt. Alsdan wordt het in dat kalenderjaar verstrekte loon geacht in gelijke delen te zijn verstrekt over de
      kalenderkwartalen waarin het kind werkzaam is geweest, en vinden [artikel 26][ref1] van de wet en de krachtens dat
      artikel vastgestelde loonbelastingtabellen voor bijzondere beloningen geen toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel26
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10g
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '26'
  - number: 10g.2
    text: |-
      Voor de toepassing van [artikel 19, eerste lid, van de Algemene wet inzake rijksbelastingen][ref1] wordt de
      belasting geacht te zijn ingehouden in het kalenderjaar waarin het loon is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel19
    url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#Artikel10g
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '19'
  - number: '11.1'
    text: |-
