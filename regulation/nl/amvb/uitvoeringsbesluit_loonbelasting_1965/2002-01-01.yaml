    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Minister van Financiën van 26 april 1965, nr. B5/6210, Directie Wetgeving Directe
    Belastingen;

    Gelet op de artikelen 4, 7, 33 en 34 van de Wet op de loonbelasting 1964 (Stb. 521);

    De Raad van State gehoord (advies van 12 mei 1965, nr. 64);

    Gezien het nader rapport van Onze Minister van Financiën van 14 mei 1965, nr. 135/7088, Directie Wetgeving Directe
    belastingen;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002489/2002-01-01#ArtikelAanhef
