  - number: '4'
    text: |-
      Degene tot wie een werknemer in dienstbetrekking staat - of, indien krachtens [artikel 8, van de wet][ref1] een
      ander als inhoudingsplichtige is aangewezen, die ander - wordt geacht aan de werknemer het loon te verstrekken, dat
      deze uit hoofde van zijn dienstbetrekking geniet van een niet-inhoudingsplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel8
    url: https://wetten.overheid.nl/BWBR0002489/2025-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '8'
  - number: '5'
    text: |-
      Als loon van een uitvoerder van aangenomen werk, en van een thuiswerker wordt aangemerkt het gehele door de
      aanbesteder, onderscheidenlijk de opdrachtgever verstrekte loon, verminderd met het loon van de hulpen. Deze
      vermindering is slechts van toepassing voor zover de uitvoerder van aangenomen werk en de thuiswerker aan de
      aanbesteder, onderscheidenlijk de opdrachtgever een door hem en zijn hulpen ondertekende verklaring doet toekomen
      waaruit het loon van ieder van de hulpen blijkt.
    url: https://wetten.overheid.nl/BWBR0002489/2025-01-01#Artikel5
  - number: '7'
    text: |-
      1 De belasting naar het belastbare loon dat wordt genoten door de in
      [artikel 33, tweede lid, onderdeel c, van de wet][ref1] bedoelde werknemers, bedraagt het in de voor hen geldende
      loonbelastingtabel aangewezen percentage van het tabelloon, met dien verstande dat dit percentage wordt verhoogd
      tot 52 ingeval de werknemer zijn naam, adres of woonplaats niet aan de inhoudingsplichtige heeft verstrekt dan
      wel, ingeval de werknemer loon uit tegenwoordige dienstbetrekking geniet, zijn identiteit niet is vastgesteld
      overeenkomstig [artikel 28, onderdeel f, van de wet][ref2], alsmede ingeval de werknemer ter zake onjuiste gegevens
      heeft verstrekt en de inhoudingsplichtige dit weet of redelijkerwijs moet weten.

      2 Het tabelloon is:

      a. in de gevallen, bedoeld in [artikel 33, tweede lid, onderdeel c, onder 1°, van de wet][ref3]: het loon in geld,
      nadat dit is verminderd met de door de inhoudingsplichtige voor zijn rekening genomen belasting;

      b. in de gevallen, bedoeld in [artikel 33, tweede lid, onderdeel c, onder 2°, van de wet][ref4]: het loon
      vermeerderd met de bedragen, bedoeld in [artikel 11, eerste lid, onderdeel j, onder 2°, van de wet][ref5].

      3 Het bepaalde in de vorige leden is niet van toepassing met betrekking tot uitkeringen ingevolge
      socialeverzekeringswetten die zonder tussenkomst van de inhoudingsplichtige worden genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel33
