    text: |-
      1 Als degene tot wie de dienstbetrekking bestaat, wordt in de gevallen, bedoeld in de [artikelen 2a][ref1],
      [2c][ref2], [2ca][ref3] en [2g][ref4], beschouwd degene op wie de verplichting rust het loon te betalen.

      2 Ingeval van een sekswerker wordt degene met wie of voor wie de seksuele handelingen worden verricht, niet
      beschouwd als degene tot wie de dienstbetrekking bestaat.


