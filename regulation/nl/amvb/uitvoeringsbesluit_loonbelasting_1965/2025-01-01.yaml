  - number: '2'
    text: |-
      Als dienstbetrekking wordt beschouwd de arbeidsverhouding van de topsporter die op grond van het met instemming
      van Onze Minister voor Medische Zorg en Sport vastgestelde reglement van de stichting Fonds voor de Topsporter
      een periodieke uitkering als tegemoetkoming in de kosten van zijn levensonderhoud geniet of een kostenvergoeding
      geniet.
    url: https://wetten.overheid.nl/BWBR0002489/2025-01-01#Artikel2
  - number: 2a
    text: |-
      Als dienstbetrekking wordt beschouwd de arbeidsverhouding van degene die door tussenkomst van degene tot wie
      de arbeidsverhouding bestaat, persoonlijk arbeid verricht ten behoeve van een derde, met uitzondering van de
      arbeidsverhouding van degene die:

      a. doorgaans op minder dan drie dagen per week werkzaam is voor een natuurlijk persoon ten behoeve van diens
      persoonlijke aangelegenheden, tenzij loon wordt verstrekt door degene door wiens tussenkomst de arbeid wordt
      verricht;

      b. bij wijze van arbeidstherapie werkzaam is.
    url: https://wetten.overheid.nl/BWBR0002489/2025-01-01#Artikel2a
  - number: 2b
    text: |-
      1 Als dienstbetrekking wordt beschouwd de arbeidsverhouding van de thuiswerker of van
      de hulp van de thuiswerker, die persoonlijk arbeid verricht tegen een bruto-inkomen,
      dat doorgaans over een maand ten minste zal bedragen 2/5 maal het bedrag, genoemd in
      [artikel 8, eerste lid, onderdeel b, van de Wet minimumloon en minimumvakantiebijslag][ref1], dan wel, voor degene,
      die de leeftijd van 21 jaar nog niet heeft bereikt en wiens bruto-inkomen uitsluitend in verband met zijn leeftijd
      op een lager bedrag is vastgesteld, 2/5 maal het eerstgenoemde bedrag vermenigvuldigd met het krachtens genoemde
      [wet][ref2] voor een werknemer van dezelfde leeftijd geldende percentage.

      2 Het eerste lid is niet van toepassing met betrekking tot een arbeidsverhouding die is aangegaan voor korter dan
      een maand.

      3 Indien binnen een maand na het einde van een arbeidsverhouding met dezelfde opdrachtgever een nieuwe
      arbeidsverhouding wordt aangegaan, geldt het bepaalde in het tweede lid niet ten aanzien van die nieuwe
      arbeidsverhouding, tenzij de tijdvakken voor welke die arbeidsverhoudingen zijn aangegaan te zamen korter zijn dan
      een maand.

      4 Voor de toepassing van het eerste lid is met betrekking tot het bruto-inkomen van een thuiswerker en van de hulp
      van een thuiswerker [artikel 5][ref3] van overeenkomstige toepassing.

      5 Het eerste lid is niet van toepassing met betrekking tot de arbeidsverhouding van de thuiswerker die zich
      doorgaans laat bijstaan door meer dan twee personen niet zijnde zijn echtgenoot of zijn tot zijn huishouden
      behorende minderjarige kinderen.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002638
      [ref3]: https://wetten.overheid.nl/BWBR0002489#Artikel5
