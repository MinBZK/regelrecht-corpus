  - number: 10ea
    text: |-
      1 Vergoedingen en verstrekkingen aan extraterritoriale werknemers van kosten, respectievelijk ter voorkoming
      van kosten van verblijf buiten het land van herkomst worden, ten aanzien van ingekomen werknemers op gezamenlijk
      verzoek van de werknemer en de inhoudingsplichtige, in elk geval beschouwd als vergoeding voor extraterritoriale
      kosten tot (bewijsregel):

      a. 30% van de grondslag voor een periode van ten hoogste 20 maanden, 20% van de grondslag voor de daaropvolgende
      periode van ten hoogste 20 maanden en 10% van de grondslag voor de daaropvolgende periode van ten hoogste 20
      maanden, waarbij de grondslag de som is van:

      1°. het loon uit tegenwoordige dienstbetrekking ter zake van het verblijf buiten het land van herkomst dat
      is genoten tijdens de looptijd van de bewijsregel en waarover met toepassing van de [artikelen 20a][ref1],
      [20b][ref2], [26][ref3] en [26b van de wet][ref4] belasting wordt geheven, voor zover de ingekomen of uitgezonden
      werknemer ter zake geen recht heeft op voorkoming van dubbele belasting;

      2°. de vergoeding voor extraterritoriale kosten, bedoeld in
      [artikel 31a, tweede lid, onderdeel e, van de wet][ref5];

      b. het bedrag van de schoolgelden.

      2 In geval van verstrekkingen zijn de waarderingsregels krachtens [artikel 13 van de wet][ref6] van toepassing.

      3 Indien de werknemer gedurende de tewerkstelling of gedurende een deel daarvan geen vergoeding geniet waarop
      [artikel 31a, achtste lid, van de wet][ref7] van toepassing is, leidt dat niet tot een verlenging van een of meer
      van de perioden van 20 maanden. Bij een werknemer als bedoeld in [artikel 10ef][ref8] geldt, met inachtneming van
      de eerste zin, vanaf de datum van tewerkstelling gedurende de eerste periode van 20 maanden 30% van de grondslag,
      gedurende de daaropvolgende periode van 20 maanden 20% van de grondslag en voor de daaropvolgende periode van 20
      maanden 10% van de grondslag, voor zover de maximale looptijd ingevolge de artikelen [10ec tot en met 10ef][ref9]
      nog niet is verstreken.


