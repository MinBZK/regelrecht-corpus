  - number: 11a
    text: |-
      Ingeval een verzekeraar als bedoeld in [artikel 19a van de wet][ref1] overeenkomt met de inhoudingsplichtige
      die aan de werknemer loon verstrekt als bedoeld in [artikel 31, vierde lid, onderdeel h, van de wet][ref2], dat
      die verzekeraar de ter zake van dat loon verschuldigde loonbelasting inhoudt op het pensioen, wordt niet die
      inhoudingsplichtige, maar die verzekeraar ter zake van dat loon als inhoudingsplichtige beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0002489/2025-01-01#Artikel11a
