  - number: '8'
    text: |-
      1 De werknemer is gehouden voordat met de auto waarop de verklaring geen privé-gebruik, bedoeld in
      [artikel 13bis, zevende lid, van de wet][ref1], betrekking heeft op kalenderjaarbasis meer dan 500 kilometer voor
      privédoeleinden wordt gereden, mede te delen dat hij om intrekking van de verklaring verzoekt.

      2 De mededeling, bedoeld in het eerste lid, geschiedt door het duidelijk, stellig en zonder voorbehoud invullen
      van het daartoe langs elektronische weg ter beschikking gestelde modelformulier en het toezenden van het ingevulde
      modelformulier aan de inspecteur.

      3 Het niet of niet tijdig doen van de mededeling, bedoeld in het eerste lid, en het niet doen van die mededeling op
      de in het tweede lid voorgeschreven wijze worden aangemerkt als een overtreding.

      4 De bevoegdheid tot het opleggen van een vergrijpboete in de gevallen, bedoeld in het derde lid, vervalt door
      verloop van vijf jaren na afloop van het kalenderjaar waarin de verplichting tot het doen van de mededeling,
      bedoeld in het eerste lid, is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel13bis
    url: https://wetten.overheid.nl/BWBR0002489/2025-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 13bis
  - number: '9'
    text: |-
      1 Het afgeven van de verklaring uitsluitend zakelijk gebruik bestelauto, bedoeld in
      [artikel 13bis, dertiende lid, van de wet][ref1], geschiedt door het duidelijk, stellig en zonder voorbehoud
      invullen van het daartoe langs elektronische weg ter beschikking gestelde modelformulier en het toezenden van het
      ingevulde modelformulier aan de inspecteur.

      2 De werknemer is gehouden voordat met de bestelauto waarop de verklaring, bedoeld in het eerste lid, betrekking
      heeft voor privédoeleinden wordt gereden, door tussenkomst van de inhoudingsplichtige mede te delen dat hij de
      verklaring intrekt.

      3 De mededeling, bedoeld in het tweede lid, geschiedt door het toezenden van het daartoe langs elektronische weg
      ter beschikking gestelde modelformulier aan de inspecteur.

      4 Indien de inhoudingsplichtige weet of vermoedt dat de werknemer met de bestelauto waarop de verklaring, bedoeld
      in het eerste lid, betrekking heeft voor privédoeleinden heeft gereden, is de inhoudingsplichtige gehouden
      schriftelijk mededeling te doen van het ten onrechte niet intrekken van de verklaring door de werknemer.

      5 De mededeling, bedoeld in het vierde lid, bevat ten minste de volgende gegevens:

      a. de naam, het loonbelasting(sub)nummer van de inhoudingsplichtige;

      b. de naam, het adres en het burgerservicenummer van de werknemer;

      c. het kenteken van de bestelauto.

      6 Naar aanleiding van de mededeling, bedoeld in het vierde lid, beslist de inspecteur bij voor bezwaar vatbare
      beschikking, dat de verklaring uitsluitend zakelijk gebruik bestelauto geacht wordt te zijn ingetrokken met ingang
      van de dag na die van de dagtekening van die beschikking.

      7 Het niet of niet tijdig doen van de mededeling, bedoeld in het tweede en vierde lid, en het niet doen van die
      mededeling op de in het derde en vierde lid voorgeschreven wijze worden aangemerkt als een overtreding.

      8 De bevoegdheid tot het opleggen van een vergrijpboete in de gevallen, bedoeld in het zevende lid, vervalt door
      verloop van vijf jaren na afloop van het kalenderjaar waarin de verplichting tot het doen van de mededeling,
      bedoeld in het tweede en vierde lid, is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel13bis
    url: https://wetten.overheid.nl/BWBR0002489/2025-01-01#Artikel9
