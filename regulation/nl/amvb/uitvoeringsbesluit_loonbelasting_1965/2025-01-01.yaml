  - number: 2ca
    text: |-
      1 Als dienstbetrekking wordt beschouwd de arbeidsverhouding van degene, die als sekswerker persoonlijk arbeid
      verricht.

      2 Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt verstaan onder sekswerker: degene die
      tegen betaling seksuele handelingen met of voor een ander verricht.
    url: https://wetten.overheid.nl/BWBR0002489/2025-01-01#Artikel2ca
  - number: 2d
    text: |-
      Waar in de [artikelen 2b][ref1] en [2c][ref2] wordt verwezen naar een in
      [artikel 8, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref3] genoemd bedrag, wordt, indien
      toepassing is gegeven aan [artikel 14][ref4] van die wet, als zodanig in aanmerking genomen het daarbij laatstelijk
      in de plaats daarvan gestelde bedrag.


