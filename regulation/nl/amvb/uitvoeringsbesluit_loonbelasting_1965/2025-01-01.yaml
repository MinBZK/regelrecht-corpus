  - number: 10b
    text: |-
      1 Als loonbestanddelen als bedoeld in [artikel 18g, tweede lid, onderdeel a, van de wet][ref1] komen in aanmerking:

      a. alle loonbestanddelen, met uitzondering van het genot van een ter beschikking gestelde auto;

      b. ingehouden bedragen als bedoeld in [artikel 11, eerste lid, onderdeel j, van de wet][ref2];

      c. loonbestanddelen die worden geruild tegen een vermindering van de arbeidstijd tot een maximum van 10% van de
      overeengekomen arbeidsduur, mits:

      1°. De mogelijkheid van deze ruil schriftelijk is vastgelegd in een regeling waaraan ten minste driekwart van de
      werknemers kan deelnemen die behoren tot een organisatorische of functionele eenheid van de inhoudingsplichtige;

      2°. Het een regeling betreft waarbij de verlaging van het loon tijdelijk is; en

      3°. De werknemer ten minste één keer per jaar de keuze heeft om de samenstelling van zijn loon te wijzigen.

      2 In afwijking van het eerste lid, onderdeel a, komen eindheffingsbestanddelen als bedoeld in
      [artikel 31 van de wet][ref3] slechts in aanmerking, indien deze bestanddelen geïndividualiseerd zijn.

      3 In afwijking van het eerste lid, onderdeel a, mogen voor de toepassing van de [artikelen 18b][ref4] en
      [18c van de wet][ref5] regelmatig genoten loonbestanddelen worden gesteld op het gemiddelde van die regelmatig
      genoten loonbestanddelen in ten hoogste de laatste vijf kalenderjaren direct voorafgaande aan het kalenderjaar
      van overlijden van de werknemer. De eerste zin is van overeenkomstige toepassing op niet regelmatig genoten
      loonbestanddelen.

      4 Gedurende perioden van onbetaald verlof als bedoeld in [artikel 10a, tweede lid][ref6], wordt voor de toepassing
      van het eerste lid uitgegaan van de direct voorafgaande aan die perioden genoten loonbestanddelen, dan wel de
      direct na afloop van die perioden genoten loonbestanddelen.

      5 Gedurende perioden na onvrijwillig ontslag waarin loongerelateerde uitkeringen worden ontvangen als bedoeld in
      [artikel 10a, eerste lid, onderdeel c][ref7], wordt voor de toepassing van het eerste lid uitgegaan van de direct
      voorafgaande aan die perioden genoten loonbestanddelen uit tegenwoordige dienstbetrekking.

      6 Voor de toepassing van het eerste lid, onderdeel a, wordt gedurende andere perioden na ontslag dan bedoeld in
      het vijfde lid, uitgegaan van de direct voorafgaande aan die perioden genoten loonbestanddelen uit tegenwoordige
      dienstbetrekking. De eerste zin geldt voor een periode van ten hoogste drie jaar. Vanaf het vierde kalenderjaar na
      ontslag wordt geen hoger bedrag als pensioengevend loon in aanmerking genomen dan het door de gewezen werknemer in
      het tweede kalenderjaar voorafgaand aan het kalenderjaar genoten gezamenlijke bedrag van:

      1°. De winst uit onderneming vóór de ondernemersaftrek;

      2°. De genoten loonbestanddelen uit tegenwoordige dienstbetrekking;

      3°. Het belastbare resultaat uit overige werkzaamheden; en

      4°. De belastbare periodieke uitkeringen en verstrekkingen.

      7 Voor de toepassing van [artikel 18g, tweede lid, onderdeel b, van de wet][ref8] mag een loonsverlaging buiten
      beschouwing blijven, voor zover deze het gevolg is van het terugtreden naar een lager gekwalificeerde functie, in
      de periode die aanvangt 10 jaar direct voorafgaande aan de in de pensioenregeling vastgestelde ingangsdatum.

      8 Voor de toepassing van [artikel 18g, tweede lid, onderdeel c, van de wet][ref9] mag een loonsverlaging buiten
      beschouwing blijven, voor zover deze het gevolg is van ziekte of arbeidsongeschiktheid.

      9 Voor de toepassing van het vierde tot en met achtste lid kan het loon gedurende de aldaar bedoelde perioden
      worden geïndexeerd met de loonindex in de bedrijfstak waarin de werknemer werkzaam is, dan wel met de gemiddelde
      loonindex voor de CAO-lonen per maand, inclusief bijzondere beloningen, zoals berekend door het Centraal Bureau
      voor de Statistiek.


