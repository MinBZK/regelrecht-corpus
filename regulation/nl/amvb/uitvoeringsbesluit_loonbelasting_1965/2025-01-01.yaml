    text: |-
      Voor de toepassing van [artikel 10b, zesde lid, onder 1°][ref1], blijft een toevoeging aan en afneming van
      de oudedagsreserve, bedoeld in [artikel 10a.29, eerste lid, van de Wet inkomstenbelasting 2001][ref2], buiten
      aanmerking.


