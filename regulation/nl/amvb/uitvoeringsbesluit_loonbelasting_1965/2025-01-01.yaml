  - number: 3bis
    text: |-
      Degene die als musicus of anderszins als artiest optreedt, is geen artiest in de zin van
      [artikel 5a van de wet][ref1], indien hij in Nederland woont en werkzaam is op basis van een voor aanvang van
      de betaling van de beloning gesloten schriftelijke overeenkomst waaruit blijkt dat het de bedoeling is van beide
      partijen dat hij geen artiest is in de zin van artikel 5a van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel5a
    url: https://wetten.overheid.nl/BWBR0002489/2025-01-01#Artikel3bis
