  - number: '10'
    text: |-
      1 In de premie, bedoeld in [artikel 18a, eerste lid, van de wet][ref1], zijn kosten voor vermogensbeheer en voor
      het afdekken van beleggingsrisico’s begrepen. Het percentage van artikel 18a, eerste lid, van de wet wordt verhoogd
      met overige kosten ten behoeve van een aanspraak ingevolge een pensioenregeling. De overige kosten, bedoeld in
      de tweede zin, kunnen niet worden aangewend voor een ouderdomspensioen en partnerpensioen bij overlijden op of
      na pensioendatum.

      2 Het eerste lid is van overeenkomstige toepassing op de maximale premie, bedoeld in
      [artikel 38r, eerste lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel38r
