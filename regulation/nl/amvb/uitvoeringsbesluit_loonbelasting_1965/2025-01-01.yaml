  - number: 2f
    text: |-
      1 Indien een arbeidsverhouding zowel op grond van [artikel 2][ref1] als op grond van de [artikelen 2a][ref2],
      [2b][ref3] of [2c][ref4], maar niet op grond van [artikel 2ca][ref5], als dienstbetrekking wordt beschouwd, vindt
      alleen artikel 2 toepassing.

      2 Indien een arbeidsverhouding zowel op grond van [artikel 2a][ref6] als op grond van de [artikelen 2b][ref7] of
      [2c][ref8], maar niet op grond van de [artikelen 2][ref9] of [2ca][ref10], als dienstbetrekking wordt beschouwd,
      vindt alleen artikel 2a toepassing.

      3 Indien een arbeidsverhouding ingeval [artikel 2b][ref11], tweede tot en met vijfde lid, buiten beschouwing
      wordt gelaten zowel op grond van artikel 2b als op grond van [artikel 2c][ref12], maar niet op grond van de
      [artikelen 2][ref13], [2a][ref14] of [2ca][ref15], als dienstbetrekking wordt beschouwd, vindt alleen artikel 2b
      toepassing.

      4 Indien een arbeidsverhouding zowel op grond van [artikel 2ca][ref16] als op grond van de [artikelen 2][ref17],
      [2a][ref18], [2b][ref19] of [2c][ref20] als dienstbetrekking wordt beschouwd, vindt alleen artikel 2ca toepassing.
      Voor de toepassing van de eerste zin wordt [artikel 2e, vierde lid][ref21], buiten beschouwing gelaten.


