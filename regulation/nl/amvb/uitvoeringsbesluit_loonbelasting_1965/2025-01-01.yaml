  - number: 10ec
    text: |-
      1 Voor ingekomen werknemers bedraagt de looptijd van de bewijsregel maximaal vijf jaar, ingaande op de eerste
      dag van de tewerkstelling door de inhoudingsplichtige en eindigende op de laatste dag van het loontijdvak na het
      loontijdvak waarin die tewerkstelling is geëindigd.

      2 Voor uitgezonden werknemers is de looptijd van de bewijsregel gelijk aan de duur van de uitzending.
    url: https://wetten.overheid.nl/BWBR0002489/2025-01-01#Artikel10ec
  - number: 10ed
    text: |-
      1 Indien een ingekomen werknemer tijdens de looptijd een andere inhoudingsplichtige krijgt, blijft op gezamenlijk
      verzoek van de werknemer en de nieuwe inhoudingsplichtige de bewijsregel gedurende de resterende looptijd
      van toepassing, mits de periode tussen het einde van de tewerkstelling door de oude inhoudingsplichtige en de
      totstandkoming van de arbeidsovereenkomst met de nieuwe inhoudingsplichtige niet langer is dan drie maanden.

      2 Bij een dergelijk verzoek moet door de nieuwe inhoudingsplichtige opnieuw aannemelijk worden gemaakt dat de
      werknemer behoort te worden aangemerkt als ingekomen werknemer.
    url: https://wetten.overheid.nl/BWBR0002489/2025-01-01#Artikel10ed
  - number: 10ee
    text: |-
      Indien de ingekomen werknemer niet langer specifieke deskundigheid bezit die op de Nederlandse arbeidsmarkt niet of
      schaars aanwezig is, wordt de looptijd verminderd tot op het moment waarop deze situatie zich voordoet.
    url: https://wetten.overheid.nl/BWBR0002489/2025-01-01#Artikel10ee
  - number: 10ef
    text: |-
      1 Indien de ingekomen werknemer voorafgaand aan de aanvang van de tewerkstelling als ingekomen werknemer door de
      inhoudingsplichtige, in Nederland is tewerkgesteld of is verbleven, wordt de looptijd verminderd met de perioden
      van eerdere tewerkstelling en eerder verblijf.

      2 Perioden van eerdere tewerkstelling en eerder verblijf die meer dan vijfentwintig jaar voorafgaand aan de
      tewerkstelling zijn geëindigd, worden niet in aanmerking genomen.

      3 Voor de toepassing van het eerste en tweede lid is de ingekomen werknemer niet in Nederland tewerkgesteld indien
      hij in elk kalenderjaar van de periode van vijfentwintig jaar maximaal 20 dagen hier te lande heeft gewerkt.

      4 Voor de toepassing van het eerste en tweede lid is de ingekomen werknemer niet in Nederland verbleven indien
      hij in elk kalenderjaar van de periode van vijfentwintig jaar in totaal niet langer dan zes weken in Nederland
      is verbleven wegens vakantie, familiebezoek of andere persoonlijke omstandigheden, waarbij in de periode van
      vijfentwintig jaar eenmalig een periode van maximaal drie aaneengesloten maanden in Nederland wegens vakantie,
      familiebezoek of andere persoonlijke omstandigheden niet in aanmerking wordt genomen.

      5 Voor de toepassing van het eerste en tweede lid wordt een werknemer geacht in Nederland te zijn tewerkgesteld
      gedurende de gehele periode dat hij een door een inhoudingsplichtige uit een ander land aangeworven, of naar een
      inhoudingsplichtige gezonden werknemer in de zin van [artikel 2 van de wet][ref1] is.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel2
    url: https://wetten.overheid.nl/BWBR0002489/2025-01-01#Artikel10ef
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '2'
  - number: 10eg
    text: |-
      Indien een verzoek om toepassing van de bewijsregel als bedoeld in [artikel 10ei][ref1] niet is gedaan binnen vier
      maanden na aanvang van de tewerkstelling als ingekomen werknemer door de inhoudingsplichtige, wordt de looptijd
      verminderd met de periode tussen het tijdstip waarop de ingekomen werknemer door de inhoudingsplichtige is
      tewerkgesteld en het tijdstip waarop de beschikking, bedoeld in [artikel 10ei][ref2], voor het eerst van toepassing
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0002489#Artikel10ei
      [ref2]: https://wetten.overheid.nl/BWBR0002489#Artikel10ei
    url: https://wetten.overheid.nl/BWBR0002489/2025-01-01#Artikel10eg
    references:
      - id: ref1
        bwb_id: BWBR0002489
        artikel: 10ei
        hoofdstuk: 4a
      - id: ref2
        bwb_id: BWBR0002489
        artikel: 10ei
        hoofdstuk: 4a
  - number: 10eh
    text: |-
      Bij vermindering van de looptijd volgens dit hoofdstuk wordt elke periode waarmee de looptijd wordt verminderd naar
      boven afgerond op gehele kalendermaanden.
    url: https://wetten.overheid.nl/BWBR0002489/2025-01-01#Artikel10eh
  - number: 10ei
    text: |-
      1 Een verzoek om toepassing of voortgezette toepassing van de bewijsregel ten aanzien van een ingekomen werknemer
      wordt gedaan aan de inspecteur. Deze beslist op het verzoek bij voor bezwaar vatbare beschikking.

      2 Indien het verzoek is gedaan binnen vier maanden na aanvang van de tewerkstelling als extraterritoriale
      werknemer door de inhoudingsplichtige, werkt de beschikking terug tot en met de aanvang van de tewerkstelling als
      extraterritoriale werknemer. Indien het verzoek later is gedaan, is de beschikking van toepassing met ingang van de
      eerste dag van de maand volgend op de maand waarin het verzoek is gedaan.

      3 De inspecteur kan ambtshalve of op verzoek de beschikking in het voordeel van de werknemers of
      inhoudingsplichtige herzien in het geval van onjuistheden op het moment van het vaststellen van die beschikking.

      4 De inspecteur kan de beschikking in het nadeel van de werknemer of de inhoudingsplichtige intrekken of herzien
      in het geval van onjuistheden op het moment van het vaststellen van die beschikking. Een intrekking of herziening
      heeft alleen gevolgen voor een toekomstig loontijdvak.

      5 In afwijking van het vierde lid kan een intrekking of herziening ook gevolgen hebben voor voorafgaande en lopende
      loontijdvakken indien:

      a. de inspecteur aannemelijk maakt dat de inhoudingsplichtige of de werknemer te kwader trouw is ter zake van het
      feit dat heeft geleid tot een onjuistheid in de beschikking;

      b. de inspecteur aannemelijk maakt dat ten gevolge van een fout van de inspecteur de beschikking onjuist is
      vastgesteld en die fout de werknemer of inhoudingsplichtige redelijkerwijs kenbaar is.

      6 Een intrekking of herziening in het nadeel van de werknemer of inhoudingsplichtige geschiedt bij voor bezwaar
      vatbare beschikking. Rechtsmiddelen tegen deze beschikking kunnen uitsluitend betrekking hebben op de intrekking
      of herziening.

      7 Een intrekking of herziening in het nadeel van de werknemer of de inhoudingsplichtige is mogelijk
      voor zover de beschikking een loontijdvak bevat waarover de bevoegdheid tot naheffing, bedoeld in
      [artikel 20 van de Algemene wet inzake rijksbelastingen][ref1], niet is vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel20
    url: https://wetten.overheid.nl/BWBR0002489/2025-01-01#Artikel10ei
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '20'
  - number: 10ej
    text: |-
      De inhoudingsplichtige wordt voor de toepassing van de bepalingen van dit hoofdstuk ten aanzien van een ingekomen
      werknemer geacht dezelfde inhoudingsplichtige te zijn als de zonder onderbreking voorafgaande inhoudingsplichtigen
      van de werknemer mits:

      a. de inhoudingsplichtige en de zonder onderbreking voorafgaande inhoudingsplichtige behoren tot een zelfde
      samenhangende groep inhoudingsplichtigen in de zin van [artikel 27e van de wet][ref1], en

      b. aannemelijk is dat de werknemer opnieuw zou worden aangemerkt als ingekomen werknemer indien
      [artikel 10ed][ref2] zou worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0002471
      [ref2]: https://wetten.overheid.nl/BWBR0002489#Artikel10ed
    url: https://wetten.overheid.nl/BWBR0002489/2025-01-01#Artikel10ej
    references:
      - id: ref1
        bwb_id: BWBR0002471
      - id: ref2
        bwb_id: BWBR0002489
        artikel: 10ed
        hoofdstuk: 4a
  - number: '11'
    text: |-
      1 De loonbelasting wordt mede geheven van natuurlijke personen die de navolgende tot het belastbare
      inkomen uit werk en woning dan wel het belastbare inkomen uit werk en woning in Nederland in de zin van de
      [Wet inkomstenbelasting 2001][ref1] behorende inkomsten genieten:

      a. de navolgende termijnen van lijfrenten en andere periodieke uitkeringen en verstrekkingen, negatieve uitgaven
      voor inkomensvoorzieningen en afkoopsommen:

      1°. termijnen van lijfrenten verstrekt door een verzekeraar als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref2], alsmede termijnen als bedoeld in
      [artikel 3.126a, vierde, vijfde en zesde lid, van de Wet inkomstenbelasting 2001][ref3] verstrekt door een bank,
      beleggingsonderneming of beheerder als bedoeld in artikel 3.126a van die wet;

      2°. periodieke uitkeringen en verstrekkingen ter zake van invaliditeit, ziekte of ongeval als bedoeld in
      [artikel 3.100, eerste lid, onderdeel b, van de Wet inkomstenbelasting 2001][ref4], verstrekt door een verzekeraar
      als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref5];

      3°. negatieve uitgaven voor inkomensvoorzieningen ter zake van een afkoop als bedoeld in
      [artikel 3.133, tweede lid, onderdeel d, van de Wet inkomstenbelasting 2001][ref6], indien de afkoopsom is
      verstrekt door een verzekeraar als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref7]; daarbij
      wordt de loonbelasting geheven over de afkoopsom;

      4°. uitkeringen die worden verstrekt door een bank, beleggingsonderneming of beheerder
      als bedoeld in [artikel 3.126a van de Wet inkomstenbelasting 2001][ref8] en die ingevolge
      [artikel 3.133, achtste lid, van die wet][ref9] worden aangemerkt als negatieve uitgaven voor
      inkomensvoorzieningen;

      5°. afkoopsommen ter zake van lijfrenten verstrekt door een verzekeraar als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref10], voor zover met betrekking tot die afkoopsommen
      ingevolge [hoofdstuk 2, artikel I, onderdeel O, eerste lid, aanhef en onderdeel a, van de Invoeringswet Wet
      inkomstenbelasting 2001](onbekend) en artikel 75 van de Wet op de inkomstenbelasting 1964 de regels die daarvoor
      golden op 31 december 1991 van toepassing blijven;

      6°. periodieke uitkeringen en verstrekkingen en afkoopsommen daarvan verstrekt door een verzekeraar als bedoeld
      in [artikel 1:1 van de Wet op het financieel toezicht][ref11], voor zover met betrekking tot die uitkeringen of
      verstrekkingen ingevolge [hoofdstuk 2, artikel I, onderdeel O, eerste lid, aanhef en onderdeel b of d, van de
      Invoeringswet Wet inkomstenbelasting 2001](onbekend) de regels die daarvoor golden op 31 december 2000 op grond van
      de Wet op de inkomstenbelasting 1964 van toepassing blijven;

      b. uitkeringen ingevolge de [Ziektewet][ref12] en ingevolge de Ongevallenwet 1921, de Land- en Tuinbouwongevallenwet
      1922 en de Zeeongevallenwet 1919 in verbinding met de [Liquidatiewet ongevallenwetten][ref13];

      c. uitkeringen ingevolge de [Algemene Ouderdomswet][ref14], de [Algemene nabestaandenwet][ref15],
      [hoofdstuk 3, afdeling 2, paragraaf 2][ref16], [artikelen 4:2b, zevende lid][ref17], en
      [6:3, zevende lid, van de Wet arbeid en zorg][ref18], de [Wet werk en inkomen naar arbeidsvermogen][ref19],
      de [Wet op de arbeidsongeschiktheidsverzekering][ref20] en de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref21] en uitkeringen of inkomensvoorzieningen ingevolge de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref22];

      d. uitkeringen ingevolge de [Wet buitengewoon pensioen 1940-1945][ref23], ingevolge
      de [Wet buitengewoon pensioen zeelieden-oorlogsslachtoffers][ref24] en ingevolge de
      [Wet buitengewoon pensioen Indisch verzet][ref25];

      e. uitkeringen ingevolge een pensioenregeling waaraan wordt deelgenomen op grond van
      [artikel 150a van de Pensioenwet][ref26];

      f. uitkeringen ingevolge de Algemene Oorlogsongevallenregeling (Staatsblad van Nederlandsch-Indië 1946 (nr. 48) en
      de beschikking van de Luitenant-Gouverneur-Generaal van Nederlandsch-Indië van 5 november 1946, nr. 6 (Staatsblad
      van Nederlandsch-Indië 1946, nr. 118), alsmede op deze uitkeringen betrekking hebbende toe- en bijslagen;

      g. uitkeringen ingevolge de [Participatiewet][ref27], alsmede de in [artikel 3a][ref28] bedoelde uit het
      familierecht voortvloeiende periodieke uitkeringen of verstrekkingen;

      h. uitkeringen ingevolge de [Werkloosheidswet][ref29];

      i. uitkeringen uit de Stichting 1940-1945, de Stichting Friesland 1940-1945 en de Stichting Hulp voor nagelaten
      betrekkingen voor illegale strijders (Stichting Sneek 1940-1945);

      j. uitkeringen ingevolge een pensioenregeling waaraan wordt deelgenomen op grond van de
      [Wet op het notarisambt][ref30];

      k. uitkeringen ingevolge een pensioenregeling waaraan wordt deelgenomen op grond van de
      [Wet verplichte beroepspensioenregeling][ref31];

      l. uitkeringen ingevolge de [Wet uitkeringen vervolgingsslachtoffers 1940-1945][ref32] en ingevolge de
      [Wet uitkeringen burger-oorlogsslachtoffers 1940-1945][ref33];

      m. uitkeringen ingevolge de [Remigratiewet][ref34] en de Remigratieregeling 1985;

      n. uitkeringen ingevolge de [Toeslagenwet][ref35];

      o. uitkeringen ingevolge de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref36] en ingevolge de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref37];

      p. uitkeringen verstrekt door de Conterganstiftung für behinderte Menschen;

      q.

      r.

      s. inkomensondersteunende uitkeringen ingevolge [artikel 108, eerste lid, van de Gemeentewet][ref38];

      t. uitkeringen ingevolge de [Wet inkomensvoorziening oudere werklozen][ref39];

      u. uitkeringen ingevolge een pensioenregeling waaraan wordt deelgenomen op grond van de
      [Wet verplichte deelneming in een bedrijfstakpensioenfonds 2000][ref40];

      v. tegemoetkomingen ingevolge [artikel 33a van de Algemene Ouderdomswet][ref41];

      w. uitkeringen in verband met de [Wet verhoging AOW- en pensioenrichtleeftijd][ref42] op grond van de
      [artikelen 3][ref43] en [9 van de Kaderwet SZW-subsidies][ref44];

      x. uitkeringen op grond van de Gesetz zur Zahlbarmachung von Renten aus Beschäftigungen in einem Ghetto;

      y. uitkeringen op grond van de Bundesgesetz zur Entschädigung für auf dem Gebiet des ehemaligen Deutschen Reiches
      lebende Opfer der NS-Verfolgung;

      z. uitkeringen uit het Härtefonds für rassisch Verfolgte nicht jüdischen Glaubens;

      aa. uitkeringen op grond van [artikel 3 van het Besluit bijzondere militaire pensioenen][ref45]
      of op grond van de [artikelen 8][ref46] of
      __REF002___________________________________________________________________________________________________________
      __.

      2 De in het eerste lid bedoelde inkomsten worden aangemerkt als loon uit vroegere arbeid.


