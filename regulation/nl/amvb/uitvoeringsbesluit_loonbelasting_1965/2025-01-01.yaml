  - number: 12b
    text: |-
      1 Als gage van de artiest of de beroepssporter die deel uitmaakt van een gezelschap, wordt aangemerkt het deel
      van de met het gezelschap overeengekomen gage dat volgens de leider of vertegenwoordiger van het gezelschap aan
      zijn optreden dan wel sportbeoefening kan worden toegerekend. De leider of vertegenwoordiger van het gezelschap
      geeft aan de inhoudingsplichtige ter zake een ondertekende verklaring af (gageverdelingsverklaring). Indien
      geen verklaring wordt afgegeven of de leider of vertegenwoordiger van het gezelschap de met het gezelschap
      overeengekomen gage niet geheel over de artiesten of beroepssporters heeft verdeeld, wordt de voor het optreden van
      het gezelschap overeengekomen gage geacht door ieder lid van het gezelschap voor een gelijk deel te zijn genoten.

      2 De in het eerste lid bedoelde gageverdelingsverklaring bevat ten minste de volgende gegevens:

      a. van de inhoudingsplichtige: naam, adres en woon- of vestigingsplaats;

      b. van het gezelschap, niet zijnde een gezelschap als bedoeld in [artikel 5b van de wet][ref1]: naam, adres en
      woonplaats van de leden van het gezelschap, alsmede van de in Nederland wonende leden van het gezelschap het
      burgerservicenummer;

      c. van het gezelschap, bedoeld in [artikel 5b van de wet][ref2]: naam, adres, woonplaats en geboortedatum van
      de leider of vertegenwoordiger van het gezelschap, alsmede de namen van de leden van het gezelschap en het
      burgerservicenummer van de in Nederland wonende leden van het gezelschap;

      d. de naam van het gezelschap;

      e. datum, plaats en naam van de locatie van het optreden of de sportbeoefening;

      f. het bedrag van de brutogage, waaronder begrepen gage anders dan in geld en kostenvergoedingen;

      g. het deel van de brutogage, bedoeld in onderdeel f, dat op grond van het eerste lid volgens de leider
      of vertegenwoordiger van het gezelschap aan het optreden van de artiest dan wel de sportbeoefening van de
      beroepssporter kan worden toegerekend;

      h. het bedrag dat elk lid van het gezelschap als kosten in aanmerking kan nemen op grond van een
      kostenvergoedingsbeschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel5b
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel5b
