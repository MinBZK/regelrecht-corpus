  - number: 10a
    text: |-
      1 Als perioden die meetellen als dienstjaren als bedoeld in [artikel 18a van de wet][ref1], worden in aanmerking
      genomen:

      a. de periode gedurende welke de dienstbetrekking heeft geduurd, met dien verstande dat bij dienstbetrekkingen in
      deeltijd de aldus in aanmerking te nemen periode wordt verminderd overeenkomstig de deeltijdfactor;

      b. perioden gedurende welke de werknemer in dienstbetrekking heeft gestaan tot een met de inhoudingsplichtige
      verbonden lichaam als bedoeld in [artikel 10a, vierde lid, van de Wet op de vennootschapsbelasting 1969][ref2],
      dat niet in Nederland is gevestigd, voorzover hij bij dat verbonden lichaam niet heeft deelgenomen aan een
      pensioenregeling;

      c. perioden gedurende welke, in aansluiting op de in de onderdelen a en b bedoelde perioden, na onvrijwillig
      ontslag loongerelateerde uitkeringen worden ontvangen, of, perioden na ontslag van ten hoogste tien jaar voor zover
      in de laatstgenoemde perioden geen pensioen wordt opgebouwd uit hoofde van een dienstbetrekking die is ontstaan na
      aanvang van die perioden;

      d. perioden gedurende welke, in aansluiting op de in de onderdelen a en b bedoelde perioden, of in
      aansluiting op de in onderdeel c bedoelde perioden na onvrijwillig ontslag gedurende welke loongerelateerde
      uitkeringen worden ontvangen, uitkeringen worden ontvangen ingevolge een prepensioenregeling als bedoeld in
      [artikel 38d van de wet][ref3];

      e. dienstjaren ten gevolge van waardeoverdracht van pensioenkapitaal, als bedoeld in de [artikelen 70a][ref4],
      [71][ref5], [74][ref6], [75][ref7], [85 tot en met 88][ref8] en [91 van de Pensioenwet][ref9], naar de huidige
      inhoudingsplichtige of de pensioenuitvoerder van de huidige inhoudingsplichtige, voor zover deze jaren op basis van
      een adequate diensttijdadministratie kunnen worden vastgesteld;

      f. perioden waarin de werknemer een tot zijn huishouden behorend kind heeft verzorgd dat de leeftijd van twaalf
      jaar niet heeft bereikt, met dien verstande dat de perioden waarin de kinderen die hij heeft verzorgd de leeftijd
      van zes jaar hebben bereikt, meetellen voor de helft en waarbij in het geval van dienstbetrekkingen in deeltijd de
      aldus in aanmerking te nemen periode wordt verminderd overeenkomstig de deeltijdfactor.

      2 Indien de periode, bedoeld in het eerste lid, onderdeel a, bestaat uit een periode van onbetaald verlof, wordt
      die laatstgenoemde periode uitsluitend als dienstjaren in aanmerking genomen voor zover in die periode geen
      cumulatie plaatsvindt met opbouw in een pensioenregeling bij een andere inhoudingsplichtige of deelname aan
      een beroeps- of bedrijfstakpensioenregeling. De inhoudingsplichtige mag hierbij afgaan op een verklaring van de
      werknemer.

      3 In afwijking van het eerste lid, onderdeel a, is met betrekking tot perioden gedurende welke de werknemer in
      dienstbetrekking heeft gestaan tot een vorige inhoudingsplichtige, inkoop van ontbrekende dienstjaren toegestaan
      voor zover de werknemer aannemelijk kan maken dat er, gerelateerd aan de pensioenregeling bij de huidige
      inhoudingsplichtige, sprake is van een pensioentekort als gevolg van het ontbreken van de mogelijkheid van waarde-
      overdracht van pensioenkapitaal als bedoeld in de [artikelen 70a][ref10], [71][ref11], [74][ref12], [75][ref13],
      [85 tot en met 88][ref14] en [91 van de Pensioenwet][ref15].

      4 Voor de toepassing van het eerste lid mag de aldaar genoemde vermindering van de in aanmerking te nemen perioden
      bij dienstbetrekkingen in deeltijd achterwege blijven, indien de deeltijdfunctie is aanvaard in de periode die
      aanvangt 10 jaar direct voorafgaande aan de in de pensioenregeling vastgestelde ingangsdatum. De eerste volzin is
      uitsluitend van toepassing, voor zover de omvang van het dienstverband na het aanvaarden van de deeltijdfunctie
      niet lager is dan 50% van de omvang van het dienstverband aan het eind van de periode direct voorafgaande aan de
      aanvang van de aan het slot van de eerste volzin bedoelde periode.


