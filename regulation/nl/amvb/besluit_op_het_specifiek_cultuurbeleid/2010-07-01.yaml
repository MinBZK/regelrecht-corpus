  - number: '5'
    text: |-
      Specifieke uitkeringen aan provincies en gemeenten ten behoeve van het door het desbetreffende openbaar lichaam te
      voeren cultuurbeleid worden door Onze Minister verstrekt met inachtneming van de [artikelen 6 tot en met 14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027600#Artikel6
    url: https://wetten.overheid.nl/BWBR0027600/2010-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0027600
        artikel: '6'
        hoofdstuk: '2'
  - number: '6'
    text: |-
      1 De aanvraag voor een specifieke uitkering wordt uiterlijk zes maanden vóór de aanvang van de desbetreffende
      uitkeringsperiode ingediend. Bij ministeriële regeling kan een andere termijn worden vastgesteld.

      2 In de aanvraag voor een specifieke uitkering geeft gedeputeerde staten of het college van burgemeester en
      wethouders aan welke:

      a. doelen worden nagestreefd;

      b. indicatoren de realisatie van deze doelen uitdrukken; en

      c. kosten met het realiseren van deze doelen zullen zijn gemoeid.

      3 Bij ministeriële regeling kunnen indicatoren worden vastgesteld.

      4 Onze Minister kan bij ministeriële regeling bepalen dat gedeputeerde staten of het college van burgemeester en
      wethouders geen toepassing behoeft te geven aan het tweede lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0027600/2010-07-01#Artikel6
  - number: '7'
    text: |-
      Met het oog op de onderlinge afweging van aanvragen kan Onze Minister bepalen dat op een aanvraag niet wordt
      beslist voor een bepaalde datum in een kalenderjaar, dan wel op of na meerdere data in een kalenderjaar. Op een
      aanvraag wordt dertien weken voorafgaande aan de betrokken uitkeringsperiode beslist.
    url: https://wetten.overheid.nl/BWBR0027600/2010-07-01#Artikel7
  - number: '8'
    text: |-
      1 Op de verstrekking van een specifieke uitkering is [artikel 4:35 van de Algemene wet bestuursrecht][ref1] van
      overeenkomstige toepassing.

      2 De verstrekking van een specifieke uitkering wordt geweigerd voor zover Onze Minister van oordeel is dat het
      verstrekken daarvan zijn openbaar gemaakte cultuurbeleid, mede gelet op de beschikbare financiële middelen, niet of
      onvoldoende ondersteunt.

      3 De verstrekking wordt voorts geweigerd voor zover:

      a. naar het oordeel van Onze Minister mag worden verwacht dat de met verstrekking beoogde doeleinden niet zullen
      worden bereikt; of

      b. de aanvrager niet aannemelijk heeft gemaakt dat de financiële middelen met inbegrip van de specifieke uitkering
      voldoende zullen zijn om de voorgenomen activiteiten uit te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel435
    url: https://wetten.overheid.nl/BWBR0027600/2010-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:35
  - number: '9'
    text: |-
      1 Onze Minister kan regels stellen met betrekking tot de wijze waarop het bedrag van een specifieke uitkering wordt
      berekend.

      2 De specifieke uitkering bestaat uit een bedrag voor de door Onze Minister in de beslissing tot toekenning van een
      specifieke uitkering aangeduide doelen.

      3 Onze Minister verstrekt geen specifieke uitkering voor apparaatskosten van het betrokken openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0027600/2010-07-01#Artikel9
  - number: '10'
    text: |-
      1 Nadat een aanvraag voor een specifieke uitkering is ingediend kan Onze Minister betalingen doen.

      2 In de beschikking tot toekenning van een specifieke uitkering worden de hoogte en het tempo van de betalingen
      geregeld.

      3 Onze Minister kan met betrekking tot de betalingen nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0027600/2010-07-01#Artikel10
  - number: '11'
    text: |-
      Gedeputeerde staten of het college van burgemeester en wethouders doet zo spoedig mogelijk schriftelijk
      mededeling aan Onze Minister van omstandigheden die van belang kunnen zijn voor een beslissing tot
      wijziging of intrekking van een specifieke uitkering. Daarbij worden de relevante stukken overgelegd.
      [Artikel 4:49 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel449
    url: https://wetten.overheid.nl/BWBR0027600/2010-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:49
  - number: '12'
    text: |-
      Gedeputeerde staten of het college van burgemeester en wethouders werkt mee aan door of namens Onze Minister
      ingestelde onderzoekingen die erop zijn gericht Onze Minister inlichtingen te verschaffen ten behoeve van de
      ontwikkeling van het beleid.
    url: https://wetten.overheid.nl/BWBR0027600/2010-07-01#Artikel12
  - number: '13'
    text: |-
      Voor zover niet uit de jaarrekening van de provincie of gemeente, alsmede uit de
      accountantsverklaring en het verslag van bevindingen, behorend bij die jaarrekening krachtens
      [artikel 17a, eerste lid, Financiële-verhoudingswet][ref1] blijkt dat een specifieke uitkering rechtmatig is
      besteed, kan het bedrag waarvan de rechtmatige besteding niet vaststaat, worden teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0027600/2010-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
  - number: '14'
    text: |-
      Onze Minister kan, gelet op het belang dat dit besluit beoogt te beschermen, artikelen buiten toepassing laten of
      daarvan afwijken voor zover strikte toepassing leidt tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0027600/2010-07-01#Artikel14
  - number: '15'
    text: |-
