  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Onderwijs, Cultuur en Wetenschap van 3 november 2009, nr. WJZ/164386 (8253),
    directie Wetgeving en Juridische Zaken;

    Gelet op artikel 8, eerste lid, van de Wet op het specifiek cultuurbeleid;

    De Raad van State gehoord (advies van 23 december 2009, nr. W05.09.0464/I);

    Gezien het nader rapport van de Staatssecretaris van Onderwijs, Cultuur en Wetenschap van 31 maart 2010,
    nr. WJZ/199438 (8253), directie Wetgeving en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0027600/2010-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Onze Minister kan ten behoeve van cultuuruitingen als bedoeld in
      [artikel 4 van de Wet op het specifiek cultuurbeleid][ref1] jaarlijkse instellingssubsidies en projectsubsidies
      verstrekken.

      2 Een jaarlijkse instellingssubsidie is een subsidie aan een privaatrechtelijke rechtspersoon met volledige
      rechtsbevoegdheid of aan een publiekrechtelijke rechtspersoon gedurende een kalenderjaar voor het geheel of een
      gedeelte van de activiteiten van die rechtspersoon, waarbij het kalenderjaar gelijk is aan het boekjaar.

      3 Een projectsubsidie is een subsidie die anders dan per boekjaar wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0005904#Artikel4
    url: https://wetten.overheid.nl/BWBR0027600/2010-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005904
        artikel: '4'
  - number: '2'
    text: |-
      Een subsidie of een specifieke uitkering als bedoeld in [artikel 5][ref1] ten laste van
      een begroting die nog niet is vastgesteld, wordt verleend onder de voorwaarde, bedoeld in
      [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0027600#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel434
    url: https://wetten.overheid.nl/BWBR0027600/2010-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0027600
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:34
  - number: '3'
    text: |-
      1 Onze Minister kan subsidieplafonds vaststellen voor de verschillende categorieën van activiteiten waarvoor
      subsidie kan worden verstrekt.

      2 Als Onze Minister een subsidieplafond als bedoeld in het eerste lid vaststelt, wordt tegelijkertijd vermeld op
      welke wijze het beschikbare bedrag wordt verdeeld.
    url: https://wetten.overheid.nl/BWBR0027600/2010-07-01#Artikel3
  - number: '4'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot subsidieverstrekking
      als bedoeld in [artikel 1][ref1] van dit besluit en de [artikelen 4a][ref2], [4b][ref3] en
      [4c van de Wet op het specifiek cultuurbeleid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0027600#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005904#Artikel4a
