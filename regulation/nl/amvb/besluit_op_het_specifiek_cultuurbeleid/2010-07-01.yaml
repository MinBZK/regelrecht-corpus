  - number: '16'
    text: |-
      1 Aanvragen ingediend krachtens het [Bekostigingsbesluit cultuuruitingen][ref1] waar nog niet op is beslist op het
      tijdstip van inwerkingtreding van dit besluit, worden beschouwd als aanvragen ingediend krachtens dit besluit.

      2 De bepalingen krachtens dit besluit die betrekking hebben op de vaststelling van de subsidie en de
      daarmee verbonden wettelijke verplichtingen zijn van toepassing op de subsidies verleend krachtens het
      [Bekostigingsbesluit cultuuruitingen][ref2], met dien verstande dat Onze Minister op de aanvragen tot
      vaststelling van de subsidies die in 2008 zijn verleend op grond van de [artikelen 4a][ref3], [4b][ref4] en
      [4c van de Wet op het specifiek cultuurbeleid][ref5], binnen zes maanden beslist na ontvangst van die aanvragen.

      3 De bevoorschotting van besluiten genomen krachtens het [Bekostigingsbesluit cultuuruitingen][ref6], vindt plaats
      overeenkomstig dat besluit.

      4 Bezwaar- en beroepsprocedures met betrekking tot besluiten genomen krachtens het
      [Bekostigingsbesluit cultuuruitingen][ref7], vinden plaats overeenkomstig dat besluit.


