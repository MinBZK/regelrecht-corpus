  - number: '3'
    text: |-
      1 Dit artikel is van toepassing op het lozen van vuilnis buiten een bijzonder gebied.

      2 Behoudens de [artikelen 4][ref1] en [6][ref2]:

      a. is het lozen in zee van alle kunststoffen, waaronder in ieder geval worden begrepen trossen en visnetten
      van kunststof , plastic vuilniszakken en van verbrandingsovens afkomstige as van kunststofproducten die giftige
      residuen of residuen van zware metalen kan bevatten, verboden;

      b. dient het lozen in zee van vuilnis zover mogelijk van het dichtstbijzijnde land te geschieden, doch het lozen
      van vuilnis is in elk geval verboden indien de afstand tot het dichtstbijzijnde land kleiner is dan:

      1°. 25 zeemijl in geval van stuwhout, bekledings- en verpakkingsmateriaal, dat blijft drijven;

      2°. 12 zeemijl in geval van voedselresten en alle andere vuilnis daarbij inbegrepen papierproducten, lompen, glas,
      metaal, flessen, aardewerk en soortgelijk afval.

      3 Behoudens de [artikelen 4][ref3] en [6][ref4] mag vuilnis als bedoeld in het tweede lid, onder *b*, 2°, in
      zee worden geloosd nadat dit vuilnis door een afbreek- of maalinstallatie is gevoerd op een zodanige wijze dat
      het afgebroken of gemalen vuilnis een rooster met gaten van maximaal 25 mm doorsnee kan passeren. Het lozen van
      dergelijk vuilnis dient te geschieden zover als mogelijk van het dichtstbijzijnde land en is verboden indien de
      afstand tot het dichtstbijzijnde land kleiner is dan 3 zeemijl.


      [ref1]: https://wetten.overheid.nl/BWBR0004469#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004469#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0004469#Artikel4
