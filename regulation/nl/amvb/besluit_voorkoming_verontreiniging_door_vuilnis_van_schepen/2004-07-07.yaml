  - number: 8a
    text: |-
      Elk schip met een lengte van twaalf meter of meer is voorzien van informatieborden waarop de voorschriften, genoemd
      in de [artikelen 3][ref1] en [5][ref2], voorzover van toepassing, zijn vermeld in de Nederlandse taal en indien
      een reis wordt ondernomen naar een niet-Nederlandse haven of laad- en losplaats, tevens in de Engelse taal.


      [ref1]: https://wetten.overheid.nl/BWBR0004469#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004469#Artikel5
