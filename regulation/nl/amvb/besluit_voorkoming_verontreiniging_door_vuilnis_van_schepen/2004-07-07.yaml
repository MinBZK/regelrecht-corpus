  - number: '7'
    text: |-
      1 Onze Minister wijst de havens aan, waarvan de beheerders zorg dienen te dragen voor voldoende voorzieningen,
      welke geschikt zijn voor het in ontvangst nemen van vuilnis, overeenkomstig de behoeften van schepen die van die
      haven gebruik maken en waarop het lozingsverbod, bedoeld in de [artikelen 3][ref1], [4][ref2] of [5][ref3] van
      toepassing is.

      2 De beheerder van een ingevolge het eerste lid aangewezen haven wijst een zodanig aantal personen aan, die over de
      in het eerste lid bedoelde voorzieningen beschikken, dat onnodig oponthoud voor de schepen bij afgifte van vuilnis
      wordt voorkomen. Aan een aanwijzing kunnen beperkingen en voorschriften worden verbonden.

      3 Het is een persoon die niet is aangewezen niet toegestaan om vuilnis van schepen als bedoeld in het eerste lid,
      in ontvangst te nemen.

      4 Havenbeheerders doen op deugdelijke wijze mededeling van de personen die zijn aangewezen. Zij dragen ervoor
      zorg dat van de kosten die in rekening worden gebracht aan het schip, dat vuilnis afgeeft, op deugdelijke wijze
      mededeling wordt gedaan.

      5 Havenbeheerders stellen regels ten aanzien van de wijze waarop de in het eerste lid bedoelde schepen hun vuilnis
      dienen af te geven, alsmede ten aanzien van de wijze waarop deze schepen van hun behoefte tot afgifte kennis dienen
      te geven. Van deze regels wordt op deugdelijke wijze mededeling gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004469#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004469#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0004469#Artikel5
