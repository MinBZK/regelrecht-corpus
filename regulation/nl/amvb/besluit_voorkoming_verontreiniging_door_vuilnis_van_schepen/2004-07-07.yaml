  - number: '8'
    text: |-
      1 De afgifte van vuilnis afkomstig van schepen als bedoeld in [artikel 7, eerste lid][ref1], mag in Nederland
      uitsluitend geschieden aan personen welke zijn aangewezen overeenkomstig het [tweede lid van artikel 7][ref2].

      2 Indien naar het oordeel van de kapitein van een schip als bedoeld in het eerste lid, in een haven de
      voorzieningen voor het in ontvangst nemen van vuilnis ontoereikend zijn, dient hij zulks te melden aan de
      havenbeheerder en aan het Hoofd van de Scheepvaartinspectie.


      [ref1]: https://wetten.overheid.nl/BWBR0004469#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004469#Artikel7
