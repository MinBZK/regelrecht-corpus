  - number: '6'
    text: |-
      Het lozingsverbod, bedoeld in de [artikelen 3][ref1], [4][ref2] en [5][ref3] is niet van toepassing op het lozen
      in zee van vuilnis:

      a. indien dit noodzakelijk is om de veiligheid van het schip zeker te stellen of mensenlevens op zee te redden; of

      b. in geval van schade aan het schip of aan de uitrusting daarvan mits na het ontstaan van de schade alle redelijke
      voorzorgen zijn getroffen om de lozing te voorkomen of tot een minimum te beperken, uitgezonderd in geval de
      kapitein of de eigenaar handelde met de bedoeling om schade te veroorzaken, ofwel roekeloos handelde en in de
      wetenschap dat er waarschijnlijk schade zou ontstaan; of

      c. in geval van het toevallige verlies van visnetten van kunststof mits alle redelijke voorzorgen zijn genomen om
      een dergelijk verlies te voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004469#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004469#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0004469#Artikel5
    url: https://wetten.overheid.nl/BWBR0004469/2004-07-07#Artikel6
