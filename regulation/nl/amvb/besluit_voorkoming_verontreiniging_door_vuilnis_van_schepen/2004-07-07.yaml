preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Verkeer en Waterstaat, gedaan mede namens Onze Minister van
    Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 12 september 1988, nr. S/J 31.517/88, Directoraat-
    Generaal Scheepvaart en Maritieme Zaken;


    Overwegende dat het noodzakelijk is uitvoering te geven aan de bepalingen van Bijlage V van het Internationaal
    Verdrag ter voorkoming van verontreiniging door schepen met Protocollen en Bijlagen met Aanhangsels (Trb. 1975, 147
    en 1978, 187), zoals gewijzigd en aangevuld bij het op 17 februari 1978 te Londen tot stand gekomen Protocol bij
    dat Verdrag met Bijlage en Aanhangsels (Trb. 1978, 188 en 1986, 121);


    Gelet op de artikelen 1, onder e, 5, 6, 7, 10, 38 en 39 van de Wet voorkoming verontreiniging door schepen (Stb.
    1983, 683);


    De Raad van State gehoord (advies van 13 december 1988, no. W09.88.0497);


    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat, uitgebracht mede namens Onze Minister van
    Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 16 december 1988, nr. S/J 32.273/88, Directoraat-
    Generaal Scheepvaart en Maritieme Zaken;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004469/2004-07-07#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. vuilnis: alle soorten voedselresten, afval van huishoudelijke aard en afval voortvloeiende uit de dagelijkse
      bedrijfsvoering, die regelmatig of voortdurend worden verwijderd. Onder vuilnis wordt niet verstaan verse vis en
      gedeeltes daarvan, alsmede sanitair afval;

      b. van het dichtstbijzijnde land: van de basislijn van waaruit de territoriale zee van het betrokken gebied
      wordt bepaald overeenkomstig het internationale recht, behoudens dat voor de toepassing van dit besluit «van het
      dichtstbijzijnde land» onder de noordoostkust van Australië betekent: van een lijn getrokken van een punt op de
      kust van Australië gelegen op 11°00' zuiderbreedte en 142°08' oosterlengte,

      naar een punt op 10°35' zuiderbreedte en 141°55' oosterlengte,

      vandaar naar een punt op 10°00' zuiderbreedte en 142°00' oosterlengte,

      vandaar naar een punt op 9°10' zuiderbreedte en 143°52' oosterlengte,

      vandaar naar een punt op 9°00' zuiderbreedte en 144°30' oosterlengte,

      vandaar naar een punt op 10°41' zuiderbreedte en 145°00' oosterlengte,

      vandaar naar een punt op 13°00' zuiderbreedte en 145°00' oosterlengte,

      vandaar naar een punt op 15°00' zuiderbreedte en 146°00' oosterlengte,

      vandaar naar een punt op 17°30' zuiderbreedte en 147°00' oosterlengte,

      vandaar naar een punt op 21°00' zuiderbreedte en 152°55' oosterlengte,

      vandaar naar een punt op 24°30' zuiderbreedte en 154°00' oosterlengte,

      vandaar naar een punt op de kust van Australië op 24°42' zuiderbreedte en 153°15' oosterlengte;

      c. tonnage: bruto-tonnage als bedoeld in de [Meetbrievenwet 1981][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003378
    url: https://wetten.overheid.nl/BWBR0004469/2004-07-07#Artikel1
