  - number: '2'
    text: |-
      1 Tenzij uitdrukkelijk anders is bepaald, is dit besluit van toepassing op alle schepen.

      2 Indien vuilnis resten bevat waarop de bepalingen van het
      [Besluit voorkoming olieverontreiniging door schepen][ref1] (*Stb.* 1986, 160) of het
      [Besluit voorkoming verontreiniging door met schepen in bulk vervoerde schadelijke vloeistoffen][ref2] (*Stb.*
      1988, 112) van toepassing zijn, dient te worden voldaan aan de desbetreffende voorschriften van die besluiten.

      3 Indien vuilnis verschillende soorten resten of afval bevat, waarvoor de lozingsvoorschriften, bedoeld in
      [artikel 3, tweede lid][ref3], verschillen, dient de lozing van dit vuilnis te geschieden in overeenstemming met
      het strengste daarop betrekking hebbende voorschrift van [artikel 3, tweede lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003936
      [ref2]: https://wetten.overheid.nl/BWBR0004306
      [ref3]: https://wetten.overheid.nl/BWBR0004469#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0004469#Artikel3
