  - number: 8b
    text: >-
      1 Elk schip met een tonnage van 400 of meer en elk schip waarmee 15 personen of meer mogen worden vervoerd, heeft
      een vuilnisbeheersplan aan boord.


      2 Dit plan bevat de procedures die de bemanning moet volgen bij het verzamelen, opslaan, verwerken en lozen van
      vuilnis aan boord, alsmede een aanwijzing van de persoon die belast is met de uitvoering van het plan.
    url: https://wetten.overheid.nl/BWBR0004469/2004-07-07#Artikel8b
  - number: 8c
    text: |-
      1 Een vuilnisjournaal is aan boord van:

      - elk schip dat zich in het Antarctisch gebied bevindt;
      - elk schip dat zich buiten het Antarctisch gebied bevindt en een tonnage van 400 of meer heeft of waarmee 15 of
      meer personen mogen worden vervoerd.

      2 Het vuilnisjournaal is ingericht overeenkomstig het model als aangegeven in het Aanhangsel van Bijlage V van
      het Verdrag.

      3 Van elke lozing of volledige verbranding van vuilnis wordt op de datum van de lozing of de verbranding melding
      gemaakt in het vuilnisjournaal, onder vermelding van:

      a. de datum en het tijdstip waarop de lozing of verbranding geschiedde;

      b. de positie van het schip ten tijde van de lozing of verbranding; en

      c. een omschrijving van het geloosde of verbrande vuilnis, tezamen met een schatting van de hoeveelheid daarvan.

      De aantekening wordt in de Nederlandse en in de Engelse taal gesteld.

      4 Elke aantekening in het vuilnisjournaal wordt ondertekend door de officier, belast met het toezicht op de
      betreffende handeling. Elke ingevulde bladzijde van het vuilnisjournaal wordt ondertekend door de kapitein.

      5 Het vuilnisjournaal wordt op een zodanige plaats aan boord bewaard dat het binnen een redelijke tijd beschikbaar
      is voor onderzoek door de daartoe bevoegde autoriteit. Het vuilnisjournaal wordt gedurende een periode van twee
      jaar na dagtekening van de laatste aantekening bewaard.

      6 Indien een lozing als bedoeld in [artikel 6][ref1] plaatsvindt, wordt in het vuilnisjournaal melding gemaakt van
      de omstandigheden waaronder en de redenen waarom de lozing geschiedde.


      [ref1]: https://wetten.overheid.nl/BWBR0004469#Artikel6
    url: https://wetten.overheid.nl/BWBR0004469/2004-07-07#Artikel8c
