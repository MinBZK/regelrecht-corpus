  - number: '9'
    text: >-
      Ter uitvoering van internationale afspraken en besluiten van volkenrechtelijke organisaties over voorkoming van
      verontreiniging door vuilnis van schepen kunnen bij ministeriële regeling nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004469/2004-07-07#Artikel9
  - number: '10'
    text: Dit besluit treedt in werking met ingang van 31 december 1988.
    url: https://wetten.overheid.nl/BWBR0004469/2004-07-07#Artikel10
  - number: '11'
    text: 'Dit besluit kan worden aangehaald als: Besluit voorkoming verontreiniging door vuilnis van schepen.'
    url: https://wetten.overheid.nl/BWBR0004469/2004-07-07#Artikel11
