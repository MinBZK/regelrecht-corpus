  - number: '4'
    text: >-
      1 Behoudens het tweede lid is het lozen van vuilnis verboden vanaf schepen die zich bevinden langszij of binnen
      een afstand van 500 m van vaste of drijvende platforms welke worden gebezigd voor de exploratie, exploitatie en
      verwerking van minerale schatten van de zeebodem.


      2 Het lozen in zee van voedselresten vanaf schepen die zich langszij bevinden of binnen een afstand van 500 m van
      dergelijke platforms is toegestaan mits:


      a. deze platforms zich meer dan 12 zeemijl vanaf het dichtstbijzijnde land bevinden; en


      b. de voedselresten door een afbreek- of maalinstallatie zijn gevoerd op een zodanige wijze dat de afgebroken of
      gemalen resten een rooster met gaten van maximaal 25 mm doorsnee kan passeren.
    url: https://wetten.overheid.nl/BWBR0004469/2004-07-07#Artikel4
  - number: '5'
    text: |-
      1 Dit artikel is van toepassing op het lozen van vuilnis binnen een bijzonder gebied.

      2 Voor de toepassing van dit besluit worden onder bijzondere gebieden verstaan het gebied van de Noordzee, van de
      Middellandse Zee, van de Oostzee, van de Zwarte Zee, van de Rode Zee, van de Perzische Golf, het Antarctisch gebied
      en het Caribisch gebied, die als volgt worden omschreven:

      a. onder het gebied van de Noordzee wordt verstaan de Noordzee zelf, met inbegrip van de zeeën daarin, begrensd
      door:

      1°. de Noordzee ten zuiden van 62° noorderbreedte en ten oosten van 4° westerlengte,

      2°. het Skagerrak, waarvan de zuidgrens wordt bepaald ten oosten van Kaap Skagen op 55°44.8’ noorderbreedte, en

      3°. het Engelse Kanaal en zijn toegangen ten oosten van 5° westerlengte en ten noorden van 48°30’ noorderbreedte;

      b. onder het gebied van de Middellandse Zee wordt verstaan de Middellandse Zee zelf, alsmede de golven en
      zeeën daarin, waarbij de grens tussen de Middellandse en de Zwarte Zee wordt gevormd door de parallel van 41°
      noorderbreedte en de westelijke grens wordt gevormd door de Straat van Gibraltar op de meridiaan van 5°36’
      westerlengte;

      c. onder het gebied van de Oostzee wordt verstaan de Oostzee zelf met inbegrip van de Botnische Golf, de Finse
      Golf en de toegang tot de Oostzee, begrensd door de parallel van Kaap Skagen in het Skagerrak op 57°44,8’
      noorderbreedte;

      d. onder het gebied van de Zwarte Zee wordt verstaan de Zwarte Zee zelf, waarbij de grens tussen de Middellandse en
      de Zwarte Zee wordt gevormd door de parallel van 41° noorderbreedte;

      e. onder het gebied van de Rode Zee wordt verstaan de Rode Zee zelf met inbegrip van de Golf van Suez en de
      Golf van Aqaba, in het zuiden begrensd door de loxodroom tussen Ras si Ane (12°28,5’ noorderbreedte, 43°19,6’
      oosterlengte) en Husn Murad (12°40,4’ noorderbreedte, 43°30,2’ oosterlengte);

      f. onder het gebied van de Perzische Golf wordt verstaan het zeegebied ten noordwesten van de loxodroom tussen Ras
      al Hadd (22°30’ noorderbreedte, 59°48’ oosterlengte) en Ras al Fasteh (25°04’ noorderbreedte, 61°25’ oosterlengte);

      g. onder het Antarctisch gebied wordt verstaan het zeegebied ten zuiden van 60° zuiderbreedte;

      h. onder het Caribisch gebied wordt verstaan de Golf van Mexico en de Caribische Zee, alsmede de golven en de
      zeeën daarin en het gedeelte van de Atlantische Oceaan begrensd door de parallel van 30° noorderbreedte vanaf
      Florida oostwaarts naar de meridiaan 77°30’ westerlengte, vandaar een loxodroom naar het snijpunt van de parallel
      20° noorderbreedte en de meridiaan 59° westerlengte, vandaar een loxodroom naar het snijpunt van de parallel 7°20’
      noorderbreedte en de meridiaan 50° westerlengte, vandaar een loxodroom in zuidwestelijke richting naar de oostgrens
      van Frans Guyana.

      3 Behoudens [artikel 6][ref1]:

      a. is het lozen in zee verboden van:

      1°. alle kunststoffen, waaronder in ieder geval worden begrepen trossen en visnetten van kunststof en plastic
      vuilniszakken; en

      2°. alle overig vuilnis, waaronder in elk geval worden begrepen producten van papier, lompen, glas, metaal,
      flessen, aardewerk, stuwhout, bekledings- en verpakkingsmateriaal en in de bijzondere gebieden, genoemd in het
      tweede lid, onderdelen a tot en met f en h, van verbrandingsovens afkomstige as van kunststofproducten die giftige
      residuen of residuen van zware metalen kan bevatten, en in het Antarctisch gebied alle as van verbrandingsovens.

      b. en onderdeel *c*, geschiedt het lozen in zee van voedselresten zover mogelijk van het land doch in elk geval
      niet binnen 12 zeemijl van het dichtstbijzijnde land.

      c. geschiedt het lozen in het Caribisch gebied van voedselresten niet, tenzij deze door een afbreek- of
      maalinstallatie zijn gevoerd. Het lozen van voedselresten geschiedt zover mogelijk van het land doch in elk geval,
      behoudens het bepaalde in [artikel 4][ref2], niet binnen 3 zeemijl van het dichtstbijzijnde land. Voedselresten die
      door een afbreek- of maalinstallatie zijn gevoerd, zijn zodanig behandeld dat de afgebroken of gemalen resten een
      rooster met gaten van maximaal 25 mm doorsnee kunnen passeren;

      d. geschiedt het lozen in het Antarctisch gebied niet, tenzij de te lozen stoffen door een afbreek- of
      maalinstallatie zijn gevoerd. Het lozen van voedselresten geschiedt zo ver mogelijk van het land en van ijsplaten,
      maar in elk geval niet minder dan 12 zeemijlen van het dichtstbijzijnde land of de dichtstbijzijnde ijsplaten.
      Voedselresten die door een afbreek- of maalinstallatie zijn gevoerd, moeten een rooster met gaten van maximaal 25
      mm doorsnee kunnen passeren.

      4 Tot een nader bij koninklijk besluit vast te stellen tijdstip mogen schepen in het gebied van de Middellandse
      Zee, van de Zwarte Zee, van de Rode Zee, van de Perzische Golf en in het Caribisch gebied lozen volgens
      [artikel 3][ref3] in plaats van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0004469#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004469#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0004469#Artikel3
