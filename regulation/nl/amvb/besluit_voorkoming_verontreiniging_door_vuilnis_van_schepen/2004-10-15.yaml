---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_voorkoming_verontreiniging_door_vuilnis_van_schepen
regulatory_layer: AMVB
publication_date: '2004-10-07'
valid_from: '2004-10-15'
bwb_id: BWBR0004469
url: https://wetten.overheid.nl/BWBR0004469/2004-10-15
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat, gedaan mede namens Onze Minister van
    Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 12 september 1988, nr. S/J 31.517/88, Directoraat-
    Generaal Scheepvaart en Maritieme Zaken;

    Overwegende dat het noodzakelijk is uitvoering te geven aan de bepalingen van Bijlage V van het Internationaal
    Verdrag ter voorkoming van verontreiniging door schepen met Protocollen en Bijlagen met Aanhangsels (Trb. 1975, 147
    en 1978, 187), zoals gewijzigd en aangevuld bij het op 17 februari 1978 te Londen tot stand gekomen Protocol bij
    dat Verdrag met Bijlage en Aanhangsels (Trb. 1978, 188 en 1986, 121);

    Gelet op de artikelen 1, onder e, 5, 6, 7, 10, 38 en 39 van de Wet voorkoming verontreiniging door schepen (Stb.
    1983, 683);

    De Raad van State gehoord (advies van 13 december 1988, no. W09.88.0497);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat, uitgebracht mede namens Onze Minister van
    Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 16 december 1988, nr. S/J 32.273/88, Directoraat-
    Generaal Scheepvaart en Maritieme Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel1
  - number: 1.a
    text: |-
      vuilnis: alle soorten voedselresten, afval van huishoudelijke aard en afval voortvloeiende uit de dagelijkse
      bedrijfsvoering, die regelmatig of voortdurend worden verwijderd. Onder vuilnis wordt niet verstaan verse vis en
      gedeeltes daarvan, alsmede sanitair afval;
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel1
  - number: 1.b
    text: |-
      van het dichtstbijzijnde land: van de basislijn van waaruit de territoriale zee van het betrokken gebied
      wordt bepaald overeenkomstig het internationale recht, behoudens dat voor de toepassing van dit besluit «van
      het dichtstbijzijnde land» onder de noordoostkust van Australië betekent: van een lijn getrokken van een punt
      op de kust van Australië gelegen op 11°00' zuiderbreedte en 142°08' oosterlengte, naar een punt op 10°35'
      zuiderbreedte en 141°55' oosterlengte, vandaar naar een punt op 10°00' zuiderbreedte en 142°00' oosterlengte,
      vandaar naar een punt op 9°10' zuiderbreedte en 143°52' oosterlengte, vandaar naar een punt op 9°00' zuiderbreedte
      en 144°30' oosterlengte, vandaar naar een punt op 10°41' zuiderbreedte en 145°00' oosterlengte, vandaar naar
      een punt op 13°00' zuiderbreedte en 145°00' oosterlengte, vandaar naar een punt op 15°00' zuiderbreedte en
      146°00' oosterlengte, vandaar naar een punt op 17°30' zuiderbreedte en 147°00' oosterlengte, vandaar naar een
      punt op 21°00' zuiderbreedte en 152°55' oosterlengte, vandaar naar een punt op 24°30' zuiderbreedte en 154°00'
      oosterlengte, vandaar naar een punt op de kust van Australië op 24°42' zuiderbreedte en 153°15' oosterlengte;
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel1
  - number: 1.c
    text: |-
      tonnage: bruto-tonnage als bedoeld in de [Meetbrievenwet 1981][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003378
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003378
  - number: '2.1'
    text: Tenzij uitdrukkelijk anders is bepaald, is dit besluit van toepassing op alle schepen.
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel2
  - number: '2.2'
    text: |-
      Indien vuilnis resten bevat waarop de bepalingen van het
      [Besluit voorkoming olieverontreiniging door schepen][ref1] (*Stb.* 1986, 160) of het
      [Besluit voorkoming verontreiniging door met schepen in bulk vervoerde schadelijke vloeistoffen][ref2] (*Stb.*
      1988, 112) van toepassing zijn, dient te worden voldaan aan de desbetreffende voorschriften van die besluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0003936
      [ref2]: https://wetten.overheid.nl/BWBR0004306
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003936
      - id: ref2
        bwb_id: BWBR0004306
  - number: '2.3'
    text: |-
      Indien vuilnis verschillende soorten resten of afval bevat, waarvoor de lozingsvoorschriften, bedoeld in
      [artikel 3, tweede lid][ref1], verschillen, dient de lozing van dit vuilnis te geschieden in overeenstemming met
      het strengste daarop betrekking hebbende voorschrift van [artikel 3, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004469#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004469#Artikel3
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004469
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0004469
        artikel: '3'
  - number: '3.1'
    text: Dit artikel is van toepassing op het lozen van vuilnis buiten een bijzonder gebied.
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel3
  - number: '3.2'
    text: |-
      Behoudens de [artikelen 4][ref1] en [6][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0004469#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004469#Artikel6
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004469
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0004469
        artikel: '6'
  - number: 3.2.a
    text: |-
      is het lozen in zee van alle kunststoffen, waaronder in ieder geval worden begrepen trossen en visnetten van
      kunststof , plastic vuilniszakken en van verbrandingsovens afkomstige as van kunststofproducten die giftige
      residuen of residuen van zware metalen kan bevatten, verboden;
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel3
  - number: 3.2.b
    text: |-
      dient het lozen in zee van vuilnis zover mogelijk van het dichtstbijzijnde land te geschieden, doch het lozen van
      vuilnis is in elk geval verboden indien de afstand tot het dichtstbijzijnde land kleiner is dan:
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel3
  - number: 3.2.b.1°
    text: 25 zeemijl in geval van stuwhout, bekledings- en verpakkingsmateriaal, dat blijft drijven;
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel3
  - number: 3.2.b.2°
    text: |-
      12 zeemijl in geval van voedselresten en alle andere vuilnis daarbij inbegrepen papierproducten, lompen, glas,
      metaal, flessen, aardewerk en soortgelijk afval.
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel3
  - number: '3.3'
    text: |-
      Behoudens de [artikelen 4][ref1] en [6][ref2] mag vuilnis als bedoeld in het tweede lid, onder *b*, 2°, in
      zee worden geloosd nadat dit vuilnis door een afbreek- of maalinstallatie is gevoerd op een zodanige wijze dat
      het afgebroken of gemalen vuilnis een rooster met gaten van maximaal 25 mm doorsnee kan passeren. Het lozen van
      dergelijk vuilnis dient te geschieden zover als mogelijk van het dichtstbijzijnde land en is verboden indien de
      afstand tot het dichtstbijzijnde land kleiner is dan 3 zeemijl.


      [ref1]: https://wetten.overheid.nl/BWBR0004469#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004469#Artikel6
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004469
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0004469
        artikel: '6'
  - number: '4.1'
    text: |-
      Behoudens het tweede lid is het lozen van vuilnis verboden vanaf schepen die zich bevinden langszij of binnen
      een afstand van 500 m van vaste of drijvende platforms welke worden gebezigd voor de exploratie, exploitatie en
      verwerking van minerale schatten van de zeebodem.
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel4
  - number: '4.2'
    text: |-
      Het lozen in zee van voedselresten vanaf schepen die zich langszij bevinden of binnen een afstand van 500 m van
      dergelijke platforms is toegestaan mits:
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel4
  - number: 4.2.a
    text: deze platforms zich meer dan 12 zeemijl vanaf het dichtstbijzijnde land bevinden; en
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel4
  - number: 4.2.b
    text: |-
      de voedselresten door een afbreek- of maalinstallatie zijn gevoerd op een zodanige wijze dat de afgebroken of
      gemalen resten een rooster met gaten van maximaal 25 mm doorsnee kan passeren.
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel4
  - number: '5.1'
    text: Dit artikel is van toepassing op het lozen van vuilnis binnen een bijzonder gebied.
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel5
  - number: '5.2'
    text: |-
      Voor de toepassing van dit besluit worden onder bijzondere gebieden verstaan het gebied van de Noordzee, van de
      Middellandse Zee, van de Oostzee, van de Zwarte Zee, van de Rode Zee, van de Perzische Golf, het Antarctisch gebied
      en het Caribisch gebied, die als volgt worden omschreven:
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel5
  - number: 5.2.a
    text: 'onder het gebied van de Noordzee wordt verstaan de Noordzee zelf, met inbegrip van de zeeën daarin, begrensd door:'
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel5
  - number: 5.2.a.1°
    text: de Noordzee ten zuiden van 62° noorderbreedte en ten oosten van 4° westerlengte,
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel5
  - number: 5.2.a.2°
    text: het Skagerrak, waarvan de zuidgrens wordt bepaald ten oosten van Kaap Skagen op 55°44.8’ noorderbreedte, en
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel5
  - number: 5.2.a.3°
    text: het Engelse Kanaal en zijn toegangen ten oosten van 5° westerlengte en ten noorden van 48°30’ noorderbreedte;
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel5
  - number: 5.2.b
    text: |-
      onder het gebied van de Middellandse Zee wordt verstaan de Middellandse Zee zelf, alsmede de golven en zeeën
      daarin, waarbij de grens tussen de Middellandse en de Zwarte Zee wordt gevormd door de parallel van 41°
      noorderbreedte en de westelijke grens wordt gevormd door de Straat van Gibraltar op de meridiaan van 5°36’
      westerlengte;
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel5
  - number: 5.2.c
    text: |-
      onder het gebied van de Oostzee wordt verstaan de Oostzee zelf met inbegrip van de Botnische Golf, de Finse Golf en
      de toegang tot de Oostzee, begrensd door de parallel van Kaap Skagen in het Skagerrak op 57°44,8’ noorderbreedte;
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel5
  - number: 5.2.d
    text: |-
      onder het gebied van de Zwarte Zee wordt verstaan de Zwarte Zee zelf, waarbij de grens tussen de Middellandse en de
      Zwarte Zee wordt gevormd door de parallel van 41° noorderbreedte;
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel5
  - number: 5.2.e
    text: |-
      onder het gebied van de Rode Zee wordt verstaan de Rode Zee zelf met inbegrip van de Golf van Suez en de Golf van
      Aqaba, in het zuiden begrensd door de loxodroom tussen Ras si Ane (12°28,5’ noorderbreedte, 43°19,6’ oosterlengte)
      en Husn Murad (12°40,4’ noorderbreedte, 43°30,2’ oosterlengte);
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel5
  - number: 5.2.f
    text: |-
      onder het gebied van de Perzische Golf wordt verstaan het zeegebied ten noordwesten van de loxodroom tussen Ras al
      Hadd (22°30’ noorderbreedte, 59°48’ oosterlengte) en Ras al Fasteh (25°04’ noorderbreedte, 61°25’ oosterlengte);
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel5
  - number: 5.2.g
    text: onder het Antarctisch gebied wordt verstaan het zeegebied ten zuiden van 60° zuiderbreedte;
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel5
  - number: 5.2.h
    text: |-
      onder het Caribisch gebied wordt verstaan de Golf van Mexico en de Caribische Zee, alsmede de golven en de zeeën
      daarin en het gedeelte van de Atlantische Oceaan begrensd door de parallel van 30° noorderbreedte vanaf Florida
      oostwaarts naar de meridiaan 77°30’ westerlengte, vandaar een loxodroom naar het snijpunt van de parallel 20°
      noorderbreedte en de meridiaan 59° westerlengte, vandaar een loxodroom naar het snijpunt van de parallel 7°20’
      noorderbreedte en de meridiaan 50° westerlengte, vandaar een loxodroom in zuidwestelijke richting naar de oostgrens
      van Frans Guyana.
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel5
  - number: '5.3'
    text: |-
      Behoudens [artikel 6][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0004469#Artikel6
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004469
        artikel: '6'
  - number: 5.3.a
    text: 'is het lozen in zee verboden van:'
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel5
  - number: 5.3.a.1°
    text: |-
      alle kunststoffen, waaronder in ieder geval worden begrepen trossen en visnetten van kunststof en plastic
      vuilniszakken; en
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel5
  - number: 5.3.a.2°
    text: |-
      alle overig vuilnis, waaronder in elk geval worden begrepen producten van papier, lompen, glas, metaal, flessen,
      aardewerk, stuwhout, bekledings- en verpakkingsmateriaal en in de bijzondere gebieden, genoemd in het tweede lid,
      onderdelen a tot en met f en h, van verbrandingsovens afkomstige as van kunststofproducten die giftige residuen of
      residuen van zware metalen kan bevatten, en in het Antarctisch gebied alle as van verbrandingsovens.
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel5
  - number: 5.3.b
    text: |-
      en onderdeel *c*, geschiedt het lozen in zee van voedselresten zover mogelijk van het land doch in elk geval niet
      binnen 12 zeemijl van het dichtstbijzijnde land.
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel5
  - number: 5.3.c
    text: |-
      geschiedt het lozen in het Caribisch gebied van voedselresten niet, tenzij deze door een afbreek- of
      maalinstallatie zijn gevoerd. Het lozen van voedselresten geschiedt zover mogelijk van het land doch in elk geval,
      behoudens het bepaalde in [artikel 4][ref1], niet binnen 3 zeemijl van het dichtstbijzijnde land. Voedselresten die
      door een afbreek- of maalinstallatie zijn gevoerd, zijn zodanig behandeld dat de afgebroken of gemalen resten een
      rooster met gaten van maximaal 25 mm doorsnee kunnen passeren;


      [ref1]: https://wetten.overheid.nl/BWBR0004469#Artikel4
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004469
        artikel: '4'
  - number: 5.3.d
    text: |-
      geschiedt het lozen in het Antarctisch gebied niet, tenzij de te lozen stoffen door een afbreek- of maalinstallatie
      zijn gevoerd. Het lozen van voedselresten geschiedt zo ver mogelijk van het land en van ijsplaten, maar in elk
      geval niet minder dan 12 zeemijlen van het dichtstbijzijnde land of de dichtstbijzijnde ijsplaten. Voedselresten
      die door een afbreek- of maalinstallatie zijn gevoerd, moeten een rooster met gaten van maximaal 25 mm doorsnee
      kunnen passeren.
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel5
  - number: '5.4'
    text: |-
      Tot een nader bij koninklijk besluit vast te stellen tijdstip mogen schepen in het gebied van de Middellandse
      Zee, van de Zwarte Zee, van de Rode Zee, van de Perzische Golf en in het Caribisch gebied lozen volgens
      [artikel 3][ref1] in plaats van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0004469#Artikel3
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004469
        artikel: '3'
  - number: '6'
    text: |-
      Het lozingsverbod, bedoeld in de [artikelen 3][ref1], [4][ref2] en [5][ref3] is niet van toepassing op het lozen
      in zee van vuilnis:


      [ref1]: https://wetten.overheid.nl/BWBR0004469#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004469#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0004469#Artikel5
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004469
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0004469
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0004469
        artikel: '5'
  - number: 6.a
    text: indien dit noodzakelijk is om de veiligheid van het schip zeker te stellen of mensenlevens op zee te redden; of
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel6
  - number: 6.b
    text: |-
      in geval van schade aan het schip of aan de uitrusting daarvan mits na het ontstaan van de schade alle redelijke
      voorzorgen zijn getroffen om de lozing te voorkomen of tot een minimum te beperken, uitgezonderd in geval de
      kapitein of de eigenaar handelde met de bedoeling om schade te veroorzaken, ofwel roekeloos handelde en in de
      wetenschap dat er waarschijnlijk schade zou ontstaan; of
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel6
  - number: 6.c
    text: |-
      in geval van het toevallige verlies van visnetten van kunststof mits alle redelijke voorzorgen zijn genomen om een
      dergelijk verlies te voorkomen.
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel6
  - number: 8a
    text: |-
      Elk schip met een lengte van twaalf meter of meer is voorzien van informatieborden waarop de voorschriften, genoemd
      in de [artikelen 3][ref1] en [5][ref2], voorzover van toepassing, zijn vermeld in de Nederlandse taal en indien
      een reis wordt ondernomen naar een niet-Nederlandse haven of laad- en losplaats, tevens in de Engelse taal.


      [ref1]: https://wetten.overheid.nl/BWBR0004469#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004469#Artikel5
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0004469
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0004469
        artikel: '5'
  - number: 8b.1
    text: |-
      Elk schip met een tonnage van 400 of meer en elk schip waarmee 15 personen of meer mogen worden vervoerd, heeft een
      vuilnisbeheersplan aan boord.
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel8b
  - number: 8b.2
    text: |-
      Dit plan bevat de procedures die de bemanning moet volgen bij het verzamelen, opslaan, verwerken en lozen van
      vuilnis aan boord, alsmede een aanwijzing van de persoon die belast is met de uitvoering van het plan.
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel8b
  - number: 8c.1
    text: |-
      Een vuilnisjournaal is aan boord van: - elk schip dat zich in het Antarctisch gebied bevindt;
        - elk schip dat zich buiten het Antarctisch gebied bevindt en een tonnage van 400 of meer heeft of waarmee 15 of
      meer personen mogen worden vervoerd.
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel8c
  - number: 8c.2
    text: |-
      Het vuilnisjournaal is ingericht overeenkomstig het model als aangegeven in het Aanhangsel van Bijlage V van het
      Verdrag.
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel8c
  - number: 8c.3
    text: |-
      Van elke lozing of volledige verbranding van vuilnis wordt op de datum van de lozing of de verbranding melding
      gemaakt in het vuilnisjournaal, onder vermelding van:
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel8c
  - number: 8c.3.a
    text: de datum en het tijdstip waarop de lozing of verbranding geschiedde;
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel8c
  - number: 8c.3.b
    text: de positie van het schip ten tijde van de lozing of verbranding; en
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel8c
  - number: 8c.3.c
    text: een omschrijving van het geloosde of verbrande vuilnis, tezamen met een schatting van de hoeveelheid daarvan.
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel8c
  - number: 8c.4
    text: |-
      Elke aantekening in het vuilnisjournaal wordt ondertekend door de officier, belast met het toezicht op de
      betreffende handeling. Elke ingevulde bladzijde van het vuilnisjournaal wordt ondertekend door de kapitein.
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel8c
  - number: 8c.5
    text: |-
      Het vuilnisjournaal wordt op een zodanige plaats aan boord bewaard dat het binnen een redelijke tijd beschikbaar is
      voor onderzoek door de daartoe bevoegde autoriteit. Het vuilnisjournaal wordt gedurende een periode van twee jaar
      na dagtekening van de laatste aantekening bewaard.
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel8c
  - number: 8c.6
    text: |-
      Indien een lozing als bedoeld in [artikel 6][ref1] plaatsvindt, wordt in het vuilnisjournaal melding gemaakt van de
      omstandigheden waaronder en de redenen waarom de lozing geschiedde.


      [ref1]: https://wetten.overheid.nl/BWBR0004469#Artikel6
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel8c
    references:
      - id: ref1
        bwb_id: BWBR0004469
        artikel: '6'
  - number: '9'
    text: |-
      Ter uitvoering van internationale afspraken en besluiten van volkenrechtelijke organisaties over voorkoming van
      verontreiniging door vuilnis van schepen kunnen bij ministeriële regeling nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel9
  - number: '10'
    text: Dit besluit treedt in werking met ingang van 31 december 1988.
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel10
  - number: '11'
    text: 'Dit besluit kan worden aangehaald als: Besluit voorkoming verontreiniging door vuilnis van schepen.'
    url: https://wetten.overheid.nl/BWBR0004469/2004-10-15#Artikel11
