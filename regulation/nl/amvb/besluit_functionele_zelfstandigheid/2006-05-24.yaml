preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport van 21 mei 1997, CSZ/BenO-977333;

    Gelet op artikel 39 van de Wet op de beroepen in de individuele gezondheidszorg;

    Gezien de adviezen van de Raad voor de beroepen in de individuele gezondheidszorg (adviezen van 14 juni 1995 en van
    4 oktober 1996);

    De Raad van State gehoord (advies van 23 juli 1997, no. W13.97.0294);

    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport van 23-10-1997, CSZ/BO 9716742;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008985/2006-05-24#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008985/2006-05-24#Artikel1
  - number: 1.a
    text: |-
      wet: de [Wet op de beroepen in de individuele gezondheidszorg][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006251
    url: https://wetten.overheid.nl/BWBR0008985/2006-05-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006251
  - number: 1.b
    text: |-
      ambulanceverpleegkundige: een verpleegkundige die in het bezit is van het getuigschrift ambulanceverpleegkundige
      dat is afgegeven door de Stichting Opleidingen Scholing Ambulancehulpverlening.
    url: https://wetten.overheid.nl/BWBR0008985/2006-05-24#Artikel1
  - number: '2'
    text: |-
      Onverminderd artikel 33 van de wet, wordt tot het gebied van deskundigheid van de verpleegkundige gerekend het
      zonder toezicht door en tussenkomst van de opdrachtgever:
    url: https://wetten.overheid.nl/BWBR0008985/2006-05-24#Artikel2
  - number: 2.a
    text: geven van een subcutane, intramusculaire of intraveneuze injectie;
    url: https://wetten.overheid.nl/BWBR0008985/2006-05-24#Artikel2
  - number: 2.b
    text: |-
      verrichten van een catheterisatie van de blaas bij volwassenen alsmede het inbrengen van een maagsonde of een
      infuus;
    url: https://wetten.overheid.nl/BWBR0008985/2006-05-24#Artikel2
  - number: 2.c
    text: verrichten van een venapunctie en van een hielprik bij neonaten.
    url: https://wetten.overheid.nl/BWBR0008985/2006-05-24#Artikel2
  - number: '3'
    text: |-
      Onverminderd [artikel 2][ref1], worden tot het gebied van deskundigheid van de ambulanceverpleegkundige gerekend
      het zonder toezicht door en tussenkomst van de opdrachtgever:


      [ref1]: https://wetten.overheid.nl/BWBR0008985#Artikel2
    url: https://wetten.overheid.nl/BWBR0008985/2006-05-24#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008985
        artikel: '2'
  - number: 3.a
    text: toepassen van electieve cardioversie;
    url: https://wetten.overheid.nl/BWBR0008985/2006-05-24#Artikel3
  - number: 3.b
    text: toepassen van defibrillatie;
    url: https://wetten.overheid.nl/BWBR0008985/2006-05-24#Artikel3
  - number: 3.c
    text: in- of extuberen van de luchtpijp met een orale of nasale tube;
    url: https://wetten.overheid.nl/BWBR0008985/2006-05-24#Artikel3
  - number: 3.d
    text: toepassen van drainagepunctie bij een spanningspneumothorax;
    url: https://wetten.overheid.nl/BWBR0008985/2006-05-24#Artikel3
  - number: 3.e
    text: verrichten van een coniotomie.
    url: https://wetten.overheid.nl/BWBR0008985/2006-05-24#Artikel3
  - number: '4'
    text: |-
      Onverminderd
      __REF000___________________________________________________________________________________________________________
      ________________ wordt tot het gebied van deskundigheid van de mondhygiënist gerekend het zonder toezicht door
      en tussenkomst van de opdrachtgever toepassen van lokale anesthesie door het geven van een injectie alsmede
      het behandelen van primaire caviteiten door middel van preparatie ten behoeve van restauratie met plastische
      vulmaterialen.


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel17
    url: https://wetten.overheid.nl/BWBR0008985/2006-05-24#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008975
        artikel: '17'
  - number: '5'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0008985/2006-05-24#Artikel5
  - number: '6'
    text: 'Dit besluit wordt aangehaald als: Besluit functionele zelfstandigheid.'
    url: https://wetten.overheid.nl/BWBR0008985/2006-05-24#Artikel6
