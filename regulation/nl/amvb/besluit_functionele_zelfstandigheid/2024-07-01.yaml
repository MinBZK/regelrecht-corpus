$id: besluit_functionele_zelfstandigheid
regulatory_layer: AMVB
publication_date: '2024-06-19'
valid_from: '2024-07-01'
bwb_id: BWBR0008985
url: https://wetten.overheid.nl/BWBR0008985/2024-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport van 21 mei 1997, CSZ/BenO-977333;

    Gelet op artikel 39 van de Wet op de beroepen in de individuele gezondheidszorg;

    Gezien de adviezen van de Raad voor de beroepen in de individuele gezondheidszorg (adviezen van 14 juni 1995 en van
    4 oktober 1996);

    De Raad van State gehoord (advies van 23 juli 1997, no. W13.97.0294);

    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport van 23-10-1997, CSZ/BO 9716742;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel1
  - number: 1.a
    text: |-
      wet: de [Wet op de beroepen in de individuele gezondheidszorg][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006251
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006251
  - number: 1.b
    text: |-
      ambulanceverpleegkundige: een verpleegkundige als bedoeld in [artikel 3a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008985#Artikel3a
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008985
        artikel: 3a
  - number: '2'
    text: |-
      Onverminderd artikel 33 van de wet, wordt tot het gebied van deskundigheid van de verpleegkundige gerekend het
      zonder toezicht door en tussenkomst van de opdrachtgever:
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel2
  - number: 2.a
    text: geven van een subcutane, intramusculaire of intraveneuze injectie;
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel2
  - number: 2.b
    text: |-
      verrichten van een catheterisatie van de blaas bij volwassenen alsmede het inbrengen van een maagsonde of een
      infuus;
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel2
  - number: 2.c
    text: verrichten van een venapunctie en van een hielprik bij neonaten.
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel2
  - number: '3'
    text: |-
      Onverminderd [artikel 2][ref1], worden tot het gebied van deskundigheid van de ambulanceverpleegkundige gerekend
      het zonder toezicht door en tussenkomst van de opdrachtgever:


      [ref1]: https://wetten.overheid.nl/BWBR0008985#Artikel2
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008985
        artikel: '2'
  - number: 3.a
    text: toepassen van electieve cardioversie;
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3
  - number: 3.b
    text: toepassen van defibrillatie;
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3
  - number: 3.c
    text: in- of extuberen van de luchtpijp met een orale of nasale tube;
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3
  - number: 3.d
    text: toepassen van drainagepunctie bij een spanningspneumothorax;
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3
  - number: 3.e
    text: verrichten van een coniotomie.
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3
  - number: 3a.1
    text: |-
      Bevoegd tot het verrichten van handelingen als bedoeld in [artikel 3][ref1] is de verpleegkundige die in het bezit
      is van:


      [ref1]: https://wetten.overheid.nl/BWBR0008985#Artikel3
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0008985
        artikel: '3'
  - number: 3a.1.a
    text: |-
      een getuigschrift waaruit blijkt dat met goed gevolg een door onze Minister aangewezen opleiding tot
      ambulanceverpleegkundige is afgerond; of
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3a
  - number: 3a.1.b
    text: |-
      een getuigschrift voor ambulanceverpleegkundige dat vóór 1 september 2015 is afgegeven door of namens Stichting
      Opleidingen Scholingen Ambulancehulpverlening.
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3a
  - number: 3a.2
    text: 'Een opleiding als bedoeld in het eerste lid onder a, kan door onze Minister worden aangewezen, indien:'
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3a
  - number: 3a.2.1°
    text: |-
      de organisatie die de opleiding verzorgt de volgende voorwaarden hanteert om de ambulanceverpleegkundige in
      opleiding toe te laten:
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3a
  - number: 3a.2.1°.a
    text: de ambulanceverpleegkundige in opleiding heeft een aanstelling als zodanig voor ten minste 24 uur per week;
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3a
  - number: 3a.2.1°.b
    text: |-
      er is een werkbegeleider op de werkplek beschikbaar in het bezit van een getuigschrift als bedoeld in het eerste
      lid, onder a of b, die de praktijkopdrachten van de ambulanceverpleegkundige in opleiding begeleidt; en
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3a
  - number: 3a.2.1°.c
    text: |-
      tussen de ambulanceverpleegkundige in opleiding en de werkgever zijn afspraken gemaakt en vastgelegd over de
      praktijkbegeleiding;
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3a
  - number: 3a.2.2°
    text: de opleiding is erkend door Stichting College Zorg Opleidingen;
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3a
  - number: 3a.2.3°
    text: |-
      de opleiding zowel theoretisch als praktisch onderwijs omvat en erop gericht is dat betrokkene de
      competenties, bedoeld in [artikel 3aa][ref1], verwerft behorend tot het gebied van deskundigheid als bedoeld in
      [artikel 3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008985#Artikel3aa
      [ref2]: https://wetten.overheid.nl/BWBR0008985#Artikel3
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0008985
        artikel: 3aa
      - id: ref2
        bwb_id: BWBR0008985
        artikel: '3'
  - number: 3aa.1
    text: |-
      De competenties, bedoeld in [artikel 3a, tweede lid, onder 3°][ref1], zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0008985#Artikel3a
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
    references:
      - id: ref1
        bwb_id: BWBR0008985
        artikel: 3a
  - number: 3aa.1.a
    text: vakinhoudelijk handelen;
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.1.b
    text: communicatie;
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.1.c
    text: samenwerking;
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.1.d
    text: kennis en wetenschap;
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.1.e
    text: maatschappelijk handelen;
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.1.f
    text: leiderschap;
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.1.g
    text: professionaliteit.
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.2
    text: 'De competentie vakinhoudelijk handelen omvat de bekwaamheid om:'
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.2.a
    text: |-
      zich in voorspelbare en onvoorspelbare situaties op basis van de anamnese of heteroanamnese een gedetailleerd
      beeld van de al dan niet levensbedreigende gezondheidsproblematiek van de patiënt te vormen en de verpleegkundige
      diagnose te formuleren;
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.2.b
    text: |-
      op systematische wijze de zorg te plannen voor de laag-, midden- en hoogcomplexe zorg en prioriteiten te stellen in
      verpleegkundige interventies;
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.2.c
    text: |-
      op verantwoorde en doeltreffende wijze de verpleegkundige laag-, midden- en hoogcomplexe zorg uit te voeren, ook
      als geen standaarden of behandelingsvoorschriften voorhanden zijn en zorg te verlenen aan de instabiele patiënt;
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.2.d
    text: |-
      gezondheidsbedreigende symptomen op fysiek, psychisch en sociaal gebied bij de patiënt te observeren, te
      signaleren en te bewaken en op basis van deze signalen voorzorgsmaatregelen te nemen om gezondheidsbedreigingen en
      complicaties te voorkomen of te beperken;
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.2.e
    text: |-
      technische handelingen uit te voeren ten behoeve van bewaking, ondersteuning of overname van een of meerdere vitale
      functies;
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.2.f
    text: |-
      de laag-, midden- en hoogcomplexe zorg rond de patiënt en diens naasten te organiseren en te coördineren en waar
      nodig tijdig hulp van andere zorgverleners in te schakelen bij risicovolle situaties om de continuïteit van zorg
      te waarborgen;
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.2.g
    text: |-
      de patiënt voor te bereiden op transport en de bewaking van de vitale functies en de zorg tijdens het transport
      te continueren;
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.2.h
    text: op systematische wijze patiëntgegevens te evalueren, rapporteren en over te dragen.
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.3
    text: |-
      De competentie communicatie omvat de bekwaamheid om doelmatig en effectief te communiceren met de patiënt,
      diens naasten, zorgverleners, en functionarissen van betrokken organisaties, waaronder de geneeskundige
      hulpverleningsorganisatie in de regio, bedoeld in [artikel 1 van de Wet veiligheidsregio’s][ref1], rekening
      houdend met diversiteit en culturele achtergronden en rekening houdend met verschillende verantwoordelijkheden van
      functionarissen op diverse niveaus.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel1
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '1'
  - number: 3aa.4
    text: 'De competentie samenwerking omvat de bekwaamheid om:'
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.4.a
    text: |-
      doelmatig en effectief samen te werken met alle betrokkenen, inclusief de patiënt, diens naasten, zorgverleners, en
      andere hulpdiensten;
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.4.b
    text: 'samen te werken op verschillende niveaus: monodisciplinair, multidisciplinair en interprofessioneel.'
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.5
    text: 'De competentie kennis en wetenschap omvat de bekwaamheid om:'
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.5.a
    text: |-
      over vakkennis te beschikken en deze toe te passen, op wetenschappelijk bewijs gebaseerd en volgens de beste
      praktijken in de dagelijkse beroepspraktijk;
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.5.b
    text: |-
      aan de hand van de methodische kwaliteitscyclus een concrete probleem- of vraagstelling te formuleren om de
      beroepspraktijk te verbeteren;
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.5.c
    text: |-
      bij te dragen aan kwaliteitszorg, verantwoording af te leggen aan beroepsgenoten over het eigen professioneel
      handelen, en uitleg en werkinstructie te geven aan studenten of zorgverleners;
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.5.d
    text: bij te dragen aan de uitvoering van taken in onderzoeksprojecten of ontwikkel- en verbeterplannen.
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.6
    text: 'De competentie maatschappelijk handelen omvat de bekwaamheid om:'
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.6.a
    text: voorlichting te geven en waar nodig preventieve maatregelen te nemen;
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.6.b
    text: |-
      bij signalen van kindermishandeling en huiselijk geweld te
      signaleren en te handelen overeenkomstig de meldcode, bedoeld in
      [artikel 1, onderdeel a, van het Besluit verplichte meldcode huiselijk geweld en kindermishandeling][ref1], en
      hierbij oog te hebben voor de invloed van het sociale netwerk van de patiënt.


      [ref1]: https://wetten.overheid.nl/BWBR0033723#Artikel1
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
    references:
      - id: ref1
        bwb_id: BWBR0033723
        artikel: '1'
  - number: 3aa.7
    text: 'De competentie leiderschap omvat de bekwaamheid om:'
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.7.a
    text: |-
      inhoud te geven aan professioneel persoonlijk leiderschap passend bij de dagelijkse beroepspraktijk en daarbij
      invloed uit te oefenen op de operationele werksetting en het eigen functioneren daarin;
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.7.b
    text: |-
      persoonlijk leiderschap, besluitvaardigheid en overwicht te tonen in onveilige situaties, en in samenwerking met
      andere hulpdiensten in opgeschaalde crisissituaties;
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.7.c
    text: als medewerker bij te dragen aan de continuïteit van de zorgorganisatie.
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.8
    text: 'De competentie professionaliteit omvat de bekwaamheid om:'
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.8.a
    text: |-
      verantwoordelijkheid te nemen voor de eigen professionele ontwikkeling en werkzaamheden uit te voeren op integere,
      professionele en betrokken wijze;
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.8.b
    text: |-
      het signaleren en het aan de zorgorganisatie melden van incidenten of dreigende incidenten en meedenken over
      oplossingen om deze in de toekomst te voorkomen;
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.8.c
    text: het op duurzame wijze omgaan met materialen en apparatuur volgens het beleid van de zorgorganisatie;
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.8.d
    text: |-
      effectief en doelmatig te werken als professionele zorgverlener in de arbeidssituatie en de gehele keten van zorg-,
      hulp-, en dienstverlening;
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.8.e
    text: knelpunten te signaleren in de zorgverlening op afdelings- en organisatieniveau en binnen de keten;
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3aa.8.f
    text: |-
      de beschikbare tijd en medische hulpmiddelen en apparatuur verantwoord te besteden, rekening houdend met kwaliteit
      en kostenbeheersing.
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3aa
  - number: 3b.1
    text: |-
      Voor het verkrijgen van een aanwijzing als bedoeld in [artikel 3a, tweede lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0008985#Artikel3a
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0008985
        artikel: 3a
  - number: 3b.1.a
    text: wordt een aanvraag gedaan door de organisatie die de opleiding verzorgt;
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3b
  - number: 3b.1.b
    text: |-
      worden door de aanvrager bescheiden overgelegd waaruit blijkt dat de opleiding aan de vereisten voldoet, bedoeld in
      [artikel 3a, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008985#Artikel3a
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0008985
        artikel: 3a
  - number: 3b.2
    text: |-
      De aanwijzing van een opleiding als bedoeld in [artikel 3a, tweede lid][ref1], heeft een geldigheidsduur van ten
      hoogste vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0008985#Artikel3a
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0008985
        artikel: 3a
  - number: 3b.3
    text: |-
      Indien in de opleiding, bedoeld in [artikel 3a, eerste lid, onder a][ref1], wijzigingen plaatsvinden die betrekking
      hebben op de vereisten, bedoeld in artikel 3a, tweede lid, stelt de organisatie waarvan de opleiding is aangewezen
      onze Minister daarvan zo spoedig mogelijk op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0008985#Artikel3a
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0008985
        artikel: 3a
  - number: 3b.4
    text: |-
      De organisatie waarvan de opleiding is aangewezen, verstrekt onze Minister op verzoek informatie die noodzakelijk
      is om te beoordelen of de opleiding op enig moment voldoet aan de bij deze regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3b
  - number: 3b.5
    text: |-
      Onze Minister kan een aanwijzing intrekken zodra de opleiding niet of niet langer voldoet aan de in
      [artikel 3a][ref1] gestelde eisen of indien niet voldaan wordt aan het verzoek als bedoeld in het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008985#Artikel3a
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0008985
        artikel: 3a
  - number: 3b.6
    text: Van een aanwijzing of een intrekking van een aanwijzing wordt kennis gegeven in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel3b
  - number: '4'
    text: |-
      Onverminderd
      __REF000___________________________________________________________________________________________________________
      ________________ wordt tot het gebied van deskundigheid van de mondhygiënist gerekend het zonder toezicht door
      en tussenkomst van de opdrachtgever toepassen van lokale anesthesie door het geven van een injectie alsmede
      het behandelen van primaire caviteiten door middel van preparatie ten behoeve van restauratie met plastische
      vulmaterialen.


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel17
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008975
        artikel: '17'
  - number: '5'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0008985/2024-07-01#Artikel5
  - number: '6'
    text: 'Dit besluit wordt aangehaald als: Besluit functionele zelfstandigheid.'
