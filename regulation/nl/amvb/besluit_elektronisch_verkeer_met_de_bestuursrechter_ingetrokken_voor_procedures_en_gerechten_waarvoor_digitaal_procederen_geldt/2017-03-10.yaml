preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Justitie, Minister van Binnenlandse Zaken en Koninkrijksrelaties van 7 juni
    2010, nr. 5658199/10/6;

    Gelet op artikel 8:40a, tweede lid, van de Algemene wet bestuursrecht;

    De Raad van State gehoord (advies van 16 juni 2010, nr. W03.10.0224/II);

    Gezien het nader rapport van Onze Minister van Justitie, Minister van Binnenlandse Zaken en Koninkrijksrelaties van
    1 juli 2010, nr. 5658199/10/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0027917/2017-03-10#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Beroep bij de bestuursrechter kan slechts langs elektronische weg worden ingesteld op een vanwege de gerechten
      aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0027917/2017-03-10#Artikel1
  - number: '1.2'
    text: 'Het eerste lid is van overeenkomstige toepassing op:'
    url: https://wetten.overheid.nl/BWBR0027917/2017-03-10#Artikel1
  - number: 1.2.a
    text: het bij de bestuursrechter aanwenden van andere rechtsmiddelen en
    url: https://wetten.overheid.nl/BWBR0027917/2017-03-10#Artikel1
  - number: 1.2.b
    text: het bij de bestuursrechter indienen van andere geschriften in het kader van een procedure.
    url: https://wetten.overheid.nl/BWBR0027917/2017-03-10#Artikel1
  - number: '2'
    text: |-
      Voor de overeenkomstige toepassing van [artikel 2:16, eerste lid, van de Algemene wet bestuursrecht][ref1] wordt de
      methode die voor ondertekening is gebruikt in ieder geval geacht voldoende betrouwbaar te zijn indien deze van een
      door Onze Minister van Justitie aangewezen betrouwbaarheidsniveau is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0027917/2017-03-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: '3'
    text: |-
      Dit besluit treedt in werking met ingang van 1 juli 2010. Indien het Staatsblad waarin dit besluit wordt geplaatst,
      wordt uitgegeven na 30 juni 2010, treedt het in werking met ingang van de dag na de datum van uitgifte van het
      Staatsblad waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0027917/2017-03-10#Artikel3
  - number: '4'
    text: 'Dit besluit wordt aangehaald als: Besluit elektronisch verkeer met de bestuursrechter.'
    url: https://wetten.overheid.nl/BWBR0027917/2017-03-10#Artikel4
