    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 13 juli
    1992, nr. MJZ13792020, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Gelet op de artikelen 13 en 34, derde lid, van de Huisvestingswet;

    De Raad van State gehoord (advies van 24 november 1992, nr. W08.92 0334);

    Gezien het nader rapport van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 25
