articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. wet: de [Huisvestingswet][ref1];

      b. verordening: de huisvestingsverordening als bedoeld in [artikel 2 van de Huisvestingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005674
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel2
    url: https://wetten.overheid.nl/BWBR0005893/2006-01-01#Artikel1
    references:
      - id: ref1
