  - number: '10'
    text: |-
      In dit hoofdstuk wordt verstaan onder:

      a. splitsing: de splitsing van een recht op een gebouw in appartementsrechten of de verlening van deelnemings- of
      lidmaatschapsrechten, als bedoeld in artikel 33 van de wet;

      b. splitsingsvergunning: een vergunning als bedoeld in artikel 33 van de wet.
    url: https://wetten.overheid.nl/BWBR0005893/2006-01-01#Artikel10
  - number: '11'
    text: |-
      Andere gronden tot weigering van een splitsingsvergunning of tot aanhouding van de beslissing op de aanvraag om een
      vergunning, dan die, genoemd in dit hoofdstuk, worden niet in de verordening opgenomen.
    url: https://wetten.overheid.nl/BWBR0005893/2006-01-01#Artikel11
  - number: '12'
    text: |-
      1 In de verordening kan worden bepaald dat een splitsingsvergunning kan worden geweigerd, indien:

      a. het gebouw of het gedeelte van een gebouw waarop de vergunningaanvraag betrekking heeft, een of meer woonruimten
      bevat die verhuurd worden of die laatstelijk verhuurd zijn geweest,

      b. de huurprijs van een of meer van die woonruimten een door de gemeenteraad in de verordening vast te stellen
      bedrag van ten hoogste een twaalfde deel van het bedrag, op het tijdstip van de vaststelling genoemd in artikel 16,
      eerste volzin, van de Wet individuele huursubsidie, dan wel het bedrag op het tijdstip van de vaststelling genoemd
      in [artikel 13, eerste lid, onder a, van de Huursubsidiewet][ref1] dan wel de [Wet op de huurtoeslag][ref2], niet
      te boven gaat,

      c. niet gewaarborgd is, dat die woonruimte of woonruimten na de voorgenomen splitsing bestemd blijven voor verhuur
      ter bewoning, en

      d. het belang dat de vergunningaanvrager bij splitsing heeft, niet opweegt tegen het belang van het behoud van de
      woonruimtevoorraad binnen de gemeente als geheel dan wel een deel daarvan, voor zover die woonruimtevoorraad voor
      verhuur is bestemd.

      2 Indien toepassing wordt gegeven aan het bepaalde in het eerste lid, kan in de verordening tevens worden bepaald
      dat een splitsingsvergunning kan worden geweigerd, indien:

      a. het gebouw of het gedeelte van een gebouw waarop de vergunningaanvraag betrekking heeft, voor zover het geheel
      of gedeeltelijk verhuurd is geweest voor bewoning, in strijd met de voorschriften van een bestemmingsplan als
      bedoeld in [artikel 10 van de Wet op de Ruimtelijke Ordening][ref3], of met enig wettelijk voorschrift geheel of
      gedeeltelijk voor een ander doel dan voor bewoning in gebruik is genomen,

      b. de huurprijs van een of meer der voormalige woonruimten lager is dan het krachtens het eerste lid, onder *b*,
      vastgestelde bedrag,

      c. niet gewaarborgd is, dat de voormalige woonruimte of woonruimten na de voorgenomen splitsing opnieuw bestemd
      zullen worden voor verhuur ter bewoning, en

      d. het belang dat de vergunningaanvrager bij splitsing heeft, niet opweegt tegen het belang van het behoud van de
      woonruimtevoorraad binnen de gemeente als geheel dan wel een deel daarvan, voor zover die woonruimtevoorraad voor
      verhuur is bestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0008659
      [ref3]: https://wetten.overheid.nl/BWBR0002375#Artikel10
    url: https://wetten.overheid.nl/BWBR0005893/2006-01-01#Artikel12
