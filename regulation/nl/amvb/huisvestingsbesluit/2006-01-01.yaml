  - number: '14'
    text: |-
      1 In de verordening kan worden bepaald dat een splitsingsvergunning kan worden geweigerd, indien:

      a. de toestand van het gebouw waarop de vergunningaanvraag betrekking heeft, zich uit een oogpunt van indeling of
      staat van onderhoud geheel of ten dele tegen splitsing verzet, en

      b. de desbetreffende gebreken niet door het treffen van voorzieningen of het aanbrengen van verbeteringen kunnen
      worden opgeheven, dan wel onvoldoende verzekerd is dat die gebreken zullen worden opgeheven.

      2 Indien toepassing wordt gegeven aan het bepaalde in het eerste lid, kan in de verordening tevens worden bepaald
      dat de beslissing op de aanvraag om een splitsingsvergunning wordt aangehouden, indien redelijkerwijs verwacht mag
      worden dat de aanvrager van de vergunning de gebreken, als bedoeld in het eerste lid, met het oog op de voorgenomen
      splitsing zal opheffen binnen een daarvoor redelijke termijn.

      3 Indien toepassing wordt gegeven aan het tweede lid, wordt daarbij tevens bepaald dat de vergunning wordt
      verleend, indien de in het besluit tot aanhouding aangegeven gebreken zijn opgeheven binnen de daartoe in dat
      besluit aangegeven termijn.
    url: https://wetten.overheid.nl/BWBR0005893/2006-01-01#Artikel14
  - number: '15'
    text: |-
      1 Onze Minister kan afwijking van de regels van hoofdstuk 2 toestaan ten behoeve van experimenten die naar zijn
      oordeel in het belang van een evenwichtige en rechtvaardige verdeling van de woonruimte zijn.

      2 Voorts kan Onze Minister afwijking van de regels van hoofdstuk 3 toestaan ten behoeve van experimenten die naar
      zijn oordeel in het belang van het behoud of de samenstelling van de woonruimtevoorraad of in het belang van het
      voorkomen van belemmeringen van de stadsvernieuwing zijn.

      3 Het eerste en tweede lid vinden slechts toepassing, nadat een door Onze Minister aangewezen instantie hem over
      het betrokken experiment heeft geadviseerd.

      4 Onze Minister kan besluiten dat een afwijking als bedoeld in het eerste of tweede lid van kracht blijft zolang
      een door hem op basis van het experiment noodzakelijk geoordeelde wijziging van het besluit nog niet van kracht is
      geworden en in werking is getreden.
    url: https://wetten.overheid.nl/BWBR0005893/2006-01-01#Artikel15
  - number: '18'
    text: |-
      1 De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.

      2 Dit besluit kan worden aangehaald als: Huisvestingsbesluit.
    url: https://wetten.overheid.nl/BWBR0005893/2006-01-01#Artikel18
