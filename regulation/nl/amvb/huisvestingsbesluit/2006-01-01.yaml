  - number: '9'
    text: |-
      Voor zover de verordening bepaalt dat bij het verlenen van huisvestingsvergunningen voorrang wordt gegeven
      aan woningzoekenden als bedoeld in artikel 11, eerste lid, of artikel 12, eerste lid, van de wet, voorziet de
      verordening erin dat de desbetreffende bepalingen buiten toepassing blijven, indien een huisvestingsvergunning
      wordt aangevraagd:

      a. door degene die ingevolge [artikel 266, eerste lid][ref1], of
      [267, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref2] medehuurder van de betrokken woonruimte was,
      indien deze de huurovereenkomst voortzet krachtens [artikel 266, derde lid][ref3], [267, zesde lid][ref4], of
      [268, eerste lid, van Boek 7][ref5] van dat wetboek;

      b. met het oog op een voorgenomen ruil van woonruimte;

      c. door personeel als bedoeld in artikel 6, onder *b*.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel266
