        bwb_id: BWBR0005674
        artikel: '2'
  - number: '6'
    text: |-
      Een onderscheid naar economische of maatschappelijke binding wordt niet gemaakt ten aanzien van woningzoekenden:

      a. die een huisvestingsvergunning aanvragen met het oog op een voorgenomen woningruil, indien ten minste één der
      bij de ruil betrokken partijen behoort tot een categorie, genoemd in artikel 13*c*, eerste lid van de wet of aan de
      ruil een aanvaarding van een werkkring ten grondslag ligt;

      b. die als personeel in dienst zijn van het Europees laboratorium voor ruimtetechnologie van de European Space
      Research Organisation en hun functie in Nederland uitoefenen.
    url: https://wetten.overheid.nl/BWBR0005893/2006-01-01#Artikel6
  - number: '8'
    text: |-
      1 Voorzover de aanwijzing van woonruimten krachtens [artikel 5 van de wet][ref1] tot gevolg heeft dat personen
      die een zodanige woonruimte als huurder in gebruik nemen, daartoe een huisvestingsvergunning nodig hebben, neemt
      de gemeenteraad in de huisvestingsverordening criteria voor vergunningverlening op, die betrekking hebben op de
      passendheid van de verhouding tussen de persoonlijke omstandigheden van de vergunningaanvrager en degenen die tot
      diens huishouden behoren enerzijds en de kenmerken van de woonruimte waarvoor een huisvestingsvergunning wordt
      aangevraagd anderzijds.

      2 Criteria als bedoeld in het eerste lid strekken er in elk geval toe te bewerkstelligen dat bij het verlenen
      van huisvestingsvergunningen voor het als huurwoning in gebruik nemen van woonruimten als bedoeld in dat lid
      met een rekenhuur als bedoeld in [artikel 5, eerste lid, van de Wet op de huurtoeslag][ref2], die gelijk is aan
      of lager is dan de aftoppingsgrens, bedoeld in [artikel 20, tweede lid, van die wet][ref3], zo veel mogelijk
      voorrang wordt gegeven aan woningzoekenden die een zodanig de gezamenlijke toetsingsinkomens, bedoeld in
      [artikel 8 van de Algemene wet inkomensafhankelijke regelingen][ref4], die in aanmerking worden genomen voor het
      bepalen van de draagkracht, bedoeld in [artikel 7 van die wet][ref5] genieten, dat zij een beroep kunnen doen op
      een huurtoeslag in de zin van [artikel 1, onderdeel e, van de Wet op de huurtoeslag][ref6].

      3 De gemeente kan het meest recente inkomen van de woningzoekende, en de actuele vraag naar en het actuele aanbod
      ter plaatse van woonruimten, betrekken bij de toepassing van de criteria, bedoeld in het eerste lid.


