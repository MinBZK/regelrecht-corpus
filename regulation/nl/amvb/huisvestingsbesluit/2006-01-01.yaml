  - number: '13'
    text: |-
      1 In de verordening kan worden bepaald dat een splitsingsvergunning kan worden geweigerd, indien:

      a. voor het gebied waarin het gebouw is gelegen waarop de vergunningaanvraag betrekking heeft, een
      stadsvernieuwingsplan als bedoeld in [artikel 31 van de Wet op de stads- en dorpsvernieuwing][ref1] of een
      leefmilieuverordening als bedoeld in artikel 9 van die wet van kracht is, dan wel een ontwerp voor zodanig plan of
      een zodanige verordening of voor een herziening daarvan in procedure is,

      b. het ontwerp voor dat plan of voor die verordening, dan wel voor de herziening daarvan ter inzage is gelegd
      voordat de aanvraag om vergunning is ingediend, dan wel, indien de aanvraag krachtens het tweede lid is
      aangehouden, voordat die aanhouding is geëindigd,

      c. de voorgenomen splitsing nadelige gevolgen kan hebben voor de met het plan of de verordening nagestreefde of na
      te streven doeleinden, en

      d. het belang dat de vergunningaanvrager bij splitsing heeft, niet opweegt tegen het belang van het voorkomen van
      belemmering van de stadsvernieuwing.

      2 Indien toepassing wordt gegeven aan het bepaalde in het eerste lid, kan in de verordening tevens worden bepaald
      dat de beslissing op de aanvraag om een splitsingsvergunning wordt aangehouden, indien:

      a. voor het gebied waarin het gebouw is gelegen waarop de vergunningaanvraag betrekking heeft, een
      voorbereidingsbesluit als bedoeld in [artikel 21 van de Wet op de Ruimtelijke Ordening][ref2] van kracht is met het
      oog op de voorbereiding van een stadsvernieuwingsplan of van een herziening daarvan,

      b. dat besluit is genomen voordat de aanvraag om vergunning werd ingediend,

      c. redelijkerwijs verwacht mag worden dat de in het stadsvernieuwingsplan op te nemen maatregelen nadelig kunnen
      worden beïnvloed door de voorgenomen splitsing, en

      d. redelijkerwijs verwacht mag worden dat het belang dat de vergunningaanvrager bij splitsing heeft, niet opweegt
      tegen het belang van het voorkomen van belemmering van de stadsvernieuwing.

      3 Indien toepassing wordt gegeven aan het bepaalde in het tweede lid, wordt daarbij tevens bepaald
      dat de aanhouding niet langer duurt dan tot het tijdstip waarop het voorbereidingsbesluit ingevolge
      [artikel 21 van de Wet op de Ruimtelijke Ordening][ref3] is vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0003709#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0002375#Artikel21
    url: https://wetten.overheid.nl/BWBR0005893/2006-01-01#Artikel13
