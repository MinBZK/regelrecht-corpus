articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *wet:* [Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0026314/2009-09-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '2.1'
    text: |-
      Onze Minister stelt alle nodige maatregelen vast die geen onevenredige kosten meebrengen, gericht op het voor zover
      mogelijk bereiken van een in voorschrift 8.1, onder a, of 8.2, onder a, van [bijlage 2 van de wet][ref1] opgenomen
      richtwaarde voor ozon in zones of agglomeraties waar de concentraties van ozon hoger zijn dan die richtwaarde. Deze
      maatregelen kunnen worden opgenomen in een plan ter uitvoering van artikel 6 van [richtlijn 2001/81/EG](32001L0081)
      van het Europees Parlement en de Raad van 23 oktober 2001 inzake nationale emissieplafonds voor bepaalde
      luchtverontreinigende stoffen (Pb EG L 309).


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0026314/2009-09-02#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '2.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing indien de concentraties van ozon hoger zijn dan een richtwaarde
      voor de lange termijn, opgenomen in voorschrift 8.1, onder b, of 8.2, onder b, van [bijlage 2 van de wet][ref1],
      maar lager zijn dan of gelijk aan een richtwaarde voor ozon, opgenomen in voorschrift 8.1, onder a, of 8.2, onder
      a, van die bijlage, met dien verstande dat in dat geval kosteneffectieve maatregelen worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0026314/2009-09-02#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '3'
    text: |-
      Onze Minister stelt alle nodige maatregelen vast die geen onevenredige kosten meebrengen, gericht op het
      voor zover mogelijk bereiken van een in voorschrift 4.3 of 4.7 van [bijlage 2 van de wet][ref1] opgenomen
      richtwaarde voor zwevende deeltjes (PM) in zones of agglomeraties waar de concentraties van zwevende deeltjes
      (PM) hoger zijn dan die richtwaarde. Deze maatregelen kunnen deel uitmaken van een programma als bedoeld in
      [artikel 5.12, eerste lid][ref2], of [5.13, eerste lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0026314/2009-09-02#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003245
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '5'
  - number: '4'
    text: |-
      De bestuursorganen, die het aangaat, stellen alle nodige maatregelen vast die geen onevenredige kosten
      meebrengen, gericht op het voor zover mogelijk bereiken van een in voorschrift 9.1, 10.1, 11.1 of 12.1 van
      [bijlage 2 van de wet][ref1] opgenomen richtwaarde voor arseen, cadmium, nikkel of benzo(a)pyreen in zones of
      agglomeraties waar de concentraties van arseen, cadmium, nikkel of benzo(a)pyreen hoger zijn dan die richtwaarde.
      De maatregelen worden met name gericht op de grootste emissiebronnen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0026314/2009-09-02#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '5'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld als bedoeld in
      [artikel 5.15, aanhef en onder c, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0026314/2009-09-02#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
  - number: '6'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst, en werkt terug tot en met 1 augustus 2009.
    url: https://wetten.overheid.nl/BWBR0026314/2009-09-02#Artikel6
