preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 27 mei 2004, nr. HDJZ/SCH/2004-1241, Hoofddirectie
    Juridische Zaken, mede namens de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;


    Gelet op Bijlagen I, II, IV en V van het op 2 november 1973 te Londen totstandgekomen Internationaal Verdrag ter
    voorkoming van verontreiniging door schepen, met Protocollen en Bijlagen met Aanhangsels (Trb. 1975, 147) en met
    het op 17 februari 1978 te Londen totstandgekomen Protocol bij dat Verdrag met Bijlage en Aanhangsels (Trb. 1978,
    188), richtlijn nr. 2000/59/EG van het Europees Parlement en de Raad van de Europese Unie van 27 november 2000
    betreffende havenontvangstvoorzieningen voor scheepsafval en ladingresiduen (PbEG L 332) en de artikelen 6, eerste,
    tweede en derde lid, 6a, zevende lid, en 6b van de Wet voorkoming verontreiniging door schepen;


    De Raad van State gehoord (advies van 28 juni 2004, nr. W09.04.0216/V);


    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 17 augustus 2004, nr. HDJZ/SCH/2004-
    1691, Hoofddirectie Juridische Zaken, uitgebracht mede namens de Staatssecretaris van Volkshuisvesting, Ruimtelijke
    Ordening en Milieubeheer;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0017136/2022-06-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      - *frequent een haven aandoen:* met een schip minstens eenmaal per veertien dagen dezelfde haven aandoen;
      - *geregeld verkeer:* verkeer op basis van een gepubliceerde of geplande lijst van vertrek- en aankomsttijden
      tussen bepaalde havens of terugkerende overtochten die een herkenbare regeling vormen;
      - *GISIS:* Global Integrated Shipping Information System dat door de Internationale Maritieme Organisatie is
      opgezet;
      - *regelmatig een haven aandoen:* met hetzelfde schip herhaalde reizen uitvoeren die een vast patroon vormen tussen
      bepaalde havens, of een reeks reizen zonder tussenstops van en naar dezelfde haven uitvoeren;
      - *toereikende opslagcapaciteit:* voldoende capaciteit om alle scheepsafvalstoffen aan boord op te slaan vanaf
      het ogenblik van vertrek tot de volgende aanloophaven, met inbegrip van de scheepsafvalstoffen die waarschijnlijk
      zullen ontstaan tijdens de reis;
      - *wet:* [Wet voorkoming verontreiniging door schepen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003642
    url: https://wetten.overheid.nl/BWBR0017136/2022-06-01#Artikel1
