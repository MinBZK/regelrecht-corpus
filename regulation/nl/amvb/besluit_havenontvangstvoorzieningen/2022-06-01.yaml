        artikel: 6d
  - number: 9b
    text: |-
      1 Onverminderd de toepasselijke lozings- en afgiftenormen van het Verdrag, mag een schip in afwijking van
      [artikel 12b, eerste lid, van de wet][ref1] doorvaren naar de volgende aanloophaven zonder alle scheepsafvalstoffen
      af te geven als:

      a. uit de op grond van de [artikelen 6b][ref2] en [12a van de wet][ref3] beschikbare informatie blijkt dat er aan
      boord van het schip specifiek daarvoor bestemde en toereikende opslagcapaciteit is voor alle scheepsafvalstoffen
      die aan boord worden gehouden en die zullen ontstaan tijdens de geplande reis van het schip naar die haven;

      b. uit de informatie aan boord van een schip dat niet onder de richtlijn monitoring- en informatiesysteem
      zeescheepvaart valt, blijkt dat er aan boord specifiek daarvoor bestemde en toereikende opslagcapaciteit is voor
      alle scheepsafvalstoffen die aan boord worden gehouden en die zullen ontstaan tijdens de geplande reis van het
      schip naar die haven;

      c. het schip minder dan 24 uur of in slechte weersomstandigheden voor anker gaat, of de ankerplaats
      overeenkomstig artikel 3, eerste lid, van de richtlijn havenontvangstvoorzieningen van het toepassingsgebied van
      [artikel 12b van de wet][ref4] is uitgesloten.

      2 Het eerste lid is niet van toepassing als:

      a. op grond van de beschikbare informatie niet kan worden vastgesteld of in de volgende aanloophaven van het schip
      toereikende havenontvangstvoorzieningen zijn; of

      b. de volgende aanloophaven van het schip niet bekend is.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel12b
      [ref2]: https://wetten.overheid.nl/BWBR0003642#Artikel6b
      [ref3]: https://wetten.overheid.nl/BWBR0003642#Artikel12a
      [ref4]: https://wetten.overheid.nl/BWBR0003642#Artikel12b
