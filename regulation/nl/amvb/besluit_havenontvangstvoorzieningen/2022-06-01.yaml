  - number: 9d
    text: |-
      1 Onze Minister kan een houder van een onbemande havenontvangstvoorziening in een kleine haven ontheffing verlenen
      van het bepaalde bij of krachtens [artikel 6b, eerste lid, van de wet][ref1].

      2 Als een ontheffing is verleend, meldt Onze Minister aan SafeSeaNet de naam en locatie van de betrokken
      havenontvangstvoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel6b
