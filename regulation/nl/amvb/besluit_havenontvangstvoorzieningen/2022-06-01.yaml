  - number: 9c
    text: |-
      1 Onze Minister kan een schip op verzoek van de exploitant geheel of gedeeltelijk ontheffing verlenen van het
      bepaalde bij of krachtens de [artikelen 6d][ref1], [12a][ref2] of [12b van de wet][ref3] als:

      a. het schip deelneemt aan geregeld verkeer en frequent en regelmatig havens aandoet;

      b. de exploitant een regeling heeft getroffen om ervoor te zorgen dat de scheepsafvalstoffen worden afgegeven en de
      bijdragen worden betaald in een haven op de route van het schip, die:

      1° de exploitant aantoont door middel van een ondertekende overeenkomst met een havenbeheerder of een
      havenontvangstvoorziening en door afvalontvangstbewijzen;

      2° de exploitant het bestaan van een overeenkomst heeft gemeld aan alle havens op de route van het schip; en

      3° is aanvaard door de haven waar de afgifte en betaling plaatsvinden, wat een haven in of buiten de Europese Unie
      kan zijn, waarvan op basis van de informatie die elektronisch aan SafeSeaNet en in GISIS is gemeld, is vastgesteld
      dat daar toereikende havenontvangstvoorzieningen aanwezig zijn; en

      c. de ontheffing geen negatieve gevolgen heeft voor de maritieme veiligheid, de gezondheid, het leven of de
      werkomstandigheden aan boord of het mariene milieu.

      2 Een ontheffing kan onder beperkingen worden verleend en aan een ontheffing kunnen voorschriften worden verbonden
      met het oog op de belangen, bedoeld in het eerste lid, onderdeel c.

      3 Als een ontheffing is verleend, geeft Onze Minister een certificaat af volgens het model in bijlage 5 bij de
      richtlijn havenontvangstvoorzieningen en meldt deze gegevens aan SafeSeaNet.

      4 Een gedraging in strijd met de in het tweede lid bedoelde beperkingen en voorschriften is verboden.

      5 Dit artikel is ook van toepassing op buitenlandse schepen.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel6d
      [ref2]: https://wetten.overheid.nl/BWBR0003642#Artikel12a
      [ref3]: https://wetten.overheid.nl/BWBR0003642#Artikel12b
    url: https://wetten.overheid.nl/BWBR0017136/2022-06-01#Artikel9c
