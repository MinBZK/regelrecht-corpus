        bwb_id: BWBR0005537
        artikel: 3:15
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 3:17
  - number: '7'
    text: |-
      1 Binnen veertien dagen na de goedkeuring als bedoeld in [artikel 6][ref1] maakt de havenbeheerder het
      havenafvalplan op zodanige wijze bekend dat de inhoud van het havenafvalplan voor eenieder toegankelijk is.

      2 Onverminderd het eerste lid maakt de havenbeheerder, bij voorkeur op elektronische wijze, de volgende informatie
      uit het havenafvalplan openbaar en gemakkelijk toegankelijk in het Nederlands en in een taal die internationaal
      wordt gebruikt:

      a. de locatie van de havenontvangstvoorzieningen voor iedere aanlegplaats, en, indien relevant een toelichtende
      tekening of kaart;

      b. een lijst van de gewoonlijk beheerde scheepsafvalstoffen;

      c. een lijst van contactgegevens van houders van havenontvangstvoorzieningen en aangeboden diensten;

      d. een beschrijving van de afgifteprocedures; en

      e. een beschrijving van het kostendekkingssystemen, waarvan in ieder geval de grondslagen van de bijdragen bedoeld
      in [artikel 6d, eerste lid, van de wet][ref2] en de hoogte van deze bijdragen deel uitmaken, alsook, voor zover
      van toepassing, de in bijlage 4 bij de richtlijn havenontvangstvoorzieningen bedoelde afvalbeheerregelingen en
      -fondsen.

      3 De havenbeheerder houdt de in het tweede lid bedoelde informatie actueel en verstrekt de actuele informatie aan
      de scheepsexploitanten en aan SafeSeaNet.


      [ref1]: https://wetten.overheid.nl/BWBR0017136#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003642#Artikel6d
    url: https://wetten.overheid.nl/BWBR0017136/2022-06-01#Artikel7
