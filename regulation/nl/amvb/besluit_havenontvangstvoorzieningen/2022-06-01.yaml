  - number: '2'
    text: |-
      1 Bij regeling van Onze Minister worden de havens aangewezen waarvan de beheerder zorgdraagt voor de aanwezigheid
      van havenontvangstvoorzieningen die over de nodige capaciteit beschikken om de soorten en hoeveelheden
      scheepsafvalstoffen te ontvangen van de schepen die de haven gewoonlijk aandoen.

      2 Bij het bepalen van de nodige capaciteit houdt de havenbeheerder rekening met:

      a. de operationele behoeften van de havengebruikers;

      b. de grootte en geografische ligging van de haven;

      c. het type schepen dat de haven aandoet; en

      d. de op grond van [artikel 9c][ref1] verleende ontheffingen.


      [ref1]: https://wetten.overheid.nl/BWBR0017136#Artikel9c
    url: https://wetten.overheid.nl/BWBR0017136/2022-06-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017136
        artikel: 9c
        paragraaf: 5b
  - number: 2a
    text: |-
      De houder van een havenontvangstvoorziening draagt zorg dat:

      a. de formaliteiten en praktische regelingen in verband met het gebruik van de havenontvangstvoorzieningen
      eenvoudig en vlot verlopen om onnodig oponthoud voor schepen te voorkomen of beperken; en

      b. de vergoedingen die overeenkomstig [artikel 6d, derde lid, van de wet][ref1] in rekening worden gebracht,
      schepen niet ontmoedigen om gebruik te maken van de havenontvangstvoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel6d
    url: https://wetten.overheid.nl/BWBR0017136/2022-06-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: 6d
  - number: '3'
    text: >-
      1 Het havenafvalplan heeft betrekking op alle scheepsafvalstoffen van schepen die de haven gewoonlijk aandoen en is
      afgestemd op de grootte van de haven en het type schepen die de haven aandoen.


      2 Het havenafvalplan bevat in ieder geval de elementen die in bijlage 1 bij de richtlijn
      havenontvangstvoorzieningen verplicht worden gesteld. Het havenafvalplan kan tevens de overige in die bijlage
      genoemde elementen bevatten.
    url: https://wetten.overheid.nl/BWBR0017136/2022-06-01#Artikel3
  - number: '4'
    text: >-
      1 Het havenafvalplan heeft telkens een geldigheidsduur van niet meer dan vijf jaar.


      2 Indien in de werking van de haven, of in de bedrijfsvoering van de in de haven gevestigde
      havenontvangstvoorzieningen, of in het type schepen dat de haven gewoonlijk aandoet, aanzienlijke veranderingen
      plaatsvinden, stelt de havenbeheerder, onverminderd het overige in deze paragraaf bepaalde, zo spoedig mogelijk een
      geactualiseerd havenafvalplan vast.


      3 Indien geen aanzienlijke veranderingen als bedoeld in het tweede lid zich voordoen, kan de havenbeheerder
      besluiten de geldigheidsduur van het havenafvalplan te verlengen voor een opeenvolgende periode van niet meer dan
      vijf jaar.
    url: https://wetten.overheid.nl/BWBR0017136/2022-06-01#Artikel4
  - number: '5'
    text: |-
      Op de voorbereiding van het havenafvalplan en een besluit tot aanpassing of verlenging van de geldigheidsduur van
      het havenafvalplan is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0017136/2022-06-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '6'
    text: |-
      1 De havenbeheerder zendt het havenafvalplan of het besluit tot aanpassing of verlenging van de geldigheidsduur
      binnen veertien dagen na vaststelling aan de Inspectie Leefomgeving en Transport ter goedkeuring.

      2 Het havenafvalplan gaat vergezeld van een afschrift van de naar voren gebrachte zienswijzen en de verslagen,
      bedoeld in de [artikelen 3:15][ref1] en [3:17 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel315
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel317
    url: https://wetten.overheid.nl/BWBR0017136/2022-06-01#Artikel6
    references:
