  - number: '8'
    text: >-
      1 Indien naar het oordeel van de kapitein havenontvangstvoorzieningen ontoereikend zijn, kan hij of zijn
      vertegenwoordiger dit aan de desbetreffende havenbeheerder melden middels het formulier voor het melden van
      vermeende ontoereikendheid van havenontvangstvoorzieningen, behorend bij het Verdrag.


      2 De havenbeheerder registreert de melding, voorziet deze van de datum van ontvangst en zendt een afschrift van de
      melding aan Onze Minister.


      3 De havenbeheerder stelt de kapitein of zijn vertegenwoordiger gemotiveerd in kennis van de bevindingen van het
      onderzoek naar aanleiding van de melding, alsmede van de eventuele conclusies die hij daaraan verbindt.


      4 De havenbeheerder doet Onze Minister een afschrift toekomen van het rapport, bedoeld in het derde lid.


      5 Meldingen over de vermeende ontoereikendheid van in Nederland aanwezige havenontvangstvoorzieningen die door een
      vlaggenstaat of door het secretariaat van de Internationale Maritieme Organisatie aan Nederland worden doorgeleid
      worden in ontvangst genomen door Onze Minister. Onze Minister voorziet de melding van de datum van ontvangst en
      zendt een afschrift van de melding aan de havenbeheerder. De havenbeheerder zendt Onze Minister een gemotiveerde
      reactie op deze melding. Onze Minister draagt zorg voor de verzending van een afschrift van deze reactie aan het
      secretariaat van de Internationale Maritieme Organisatie en in voorkomend geval aan de vlaggenstaat.
    url: https://wetten.overheid.nl/BWBR0017136/2022-06-01#Artikel8
  - number: '9'
    text: >-
      1 De havenbeheerder laat het heffen van een bijdrage bij iedere aanloop achterwege jegens de exploitant van een
      pleziervaartuig, indien hij met de exploitant een overeenkomst is aangegaan, inhoudende:


      a. dat deze een periodieke vergoeding verschuldigd is als bijdrage in de kosten van het in de desbetreffende haven
      in ontvangst nemen, opslaan en verwerken van scheepsafvalstoffen, ongeacht het aantal malen dat het schip gedurende
      die periode die haven aandoet, en,


      b. het voldoen van de bijdrage de kapitein van het schip het niet-overdraagbare recht geeft gedurende
      het verblijf van het schip in de desbetreffende haven of havens scheepsafvalstoffen af te geven bij een
      havenontvangstvoorziening zonder daarvoor een afzonderlijke vergoeding verschuldigd te zijn. De havenbeheerder kan
      de hoeveelheid, de eigenschappen en de wijze van afgifte van de scheepsafvalstoffen bepalen.


      2 De havenbeheerder heft geen bijdrage voor specifieke soorten scheepsafvalstoffen bij de aanloop van een
      vissersvaartuig indien de exploitant van dat vaartuig aantoont dat hij een overeenkomst heeft gesloten
      voor deze scheepsafvalstoffen met een bij ministeriële regeling aangewezen rechtspersoon die hem tegen
      betaling van een periodieke bijdrage het recht verleent deze soorten scheepsafvalstoffen af te geven aan een
      havenontvangstvoorziening, ongeacht het aantal malen dat het schip gedurende die periode zijn haven aandoet.
    url: https://wetten.overheid.nl/BWBR0017136/2022-06-01#Artikel9
  - number: 9a
    text: |-
      1 De havenbeheerder stelt de indirecte bijdrage, bedoeld in [artikel 6d, eerste lid, van de wet][ref1], vast op
      grond van de werkelijke kosten voor de afvalafgifte tijdens het voorgaande jaar en hij kan daarbij rekening houden
      met de kosten in verband met het voor het komende jaar verwachte verkeersvolume. De kosten omvatten de in bijlage 4
      bij de richtlijn havenontvangstvoorzieningen vermelde elementen.

      2 Onverminderd het derde lid dekt de indirecte bijdrage:

      a. de totale indirecte administratieve kosten die voortvloeien uit het beheer van het systeem in de haven; en

      b. ten minste 30% van de totale directe exploitatiekosten die voortvloeien uit de afgifte, van scheepsafvalstoffen,
      met dien verstande dat in ieder geval de totale directe exploitatiekosten worden gedekt die voortvloeien uit de
      afgifte van afval als bedoeld in bijlage V van het Verdrag alsmede van passief opgevist afval, met uitzondering van
      ladingresiduen, en ten minste 30% van de directe exploitatiekosten worden gedekt die voortvloeien uit de afgifte
      van afval als bedoeld in bijlage I van het Verdrag, met uitzondering van ladingresiduen.

      3 De indirecte bijdrage heeft geen betrekking op de ontvangst en verwerking van:

      a. ladingresiduen;

      b. afval in de zin van bijlage V bij het Verdrag, voor zover het afgegeven afvalvolume de maximale specifiek
      daarvoor bestemde opslagcapaciteit op het schip te boven gaat; en

      c. afval van uitlaatgasreinigingssystemen.

      4 De indirecte bijdrage die op grond van [artikel 6d, eerste lid, van de wet][ref2], wordt geïnd kan worden
      gedifferentieerd op grond van:

      a. de categorie, het type en de grootte van het schip;

      b. het verlenen van diensten buiten de normale werktijd aan schepen in de haven;

      c. het gevaarlijke karakter van scheepsafvalstoffen.

      5 De indirecte bijdrage wordt verlaagd op grond van:

      a. de omstandigheid dat het schip wordt ingezet voor de korte vaart;

      b. het ontwerp, de apparatuur en de exploitatie van een schip, indien daaruit blijkt dat het schip beperkte
      hoeveelheden afval produceert en zijn afval op duurzame en milieuvriendelijke wijze beheert.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel6d
      [ref2]: https://wetten.overheid.nl/BWBR0003642#Artikel6d
    url: https://wetten.overheid.nl/BWBR0017136/2022-06-01#Artikel9a
