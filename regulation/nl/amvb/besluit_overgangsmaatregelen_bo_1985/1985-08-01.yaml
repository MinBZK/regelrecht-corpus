  - number: C3
    text: |-
      Voor de belanghebbende, voor wie volgens het bepaalde in [artikel C1][ref1] een uitzicht zou moeten worden
      vastgesteld dat lager is dan het schaalsalaris dat voor hem per 1 augustus 1985 met toepassing van het bepaalde in
      [hoofdstuk B][ref2] is berekend, wordt het uitzicht vastgesteld op het laatstbedoelde niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0003807#ArtikelC1
      [ref2]: https://wetten.overheid.nl/BWBR0003807#HoofdstukB
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelC3
    references:
      - id: ref1
        bwb_id: BWBR0003807
        artikel: C1
        hoofdstuk: C
      - id: ref2
        bwb_id: BWBR0003807
        hoofdstuk: B
  - number: C4
    text: |-
      1 De belanghebbende ontvangt binnen twee jaar na 1 augustus 1985, doch uiterlijk op de datum waarop hij wordt
      ontslagen, een door het bevoegd gezag opgestelde en door Onze minister gewaarmerkte verklaring waarin het volgens
      dit hoofdstuk vastgestelde uitzicht gedetailleerd is aangegeven. De hier bedoelde verklaring wordt slechts eenmaal
      verstrekt.

      2 De belanghebbende die op 1 augustus 1985 in dienst is van een ander bevoegd gezag dan op 31 juli 1985, ontvangt
      de in het eerste lid bedoelde verklaring van het bevoegd gezag waarbij hij op 31 juli 1985 in dienst was.
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelC4
  - number: C5
    text: |-
      1 Voor degene die op 31 juli 1985 in het genot was van een ontslaguitkering als bedoeld in hoofdstuk I-H van het
      Rechtspositiebesluit KO/LO, wordt een uitzicht vastgesteld indien hij voldoet aan de volgende voorwaarden:

      a. het ontslag terzake waarvan hij een ontslaguitkering geniet is hem verleend op of na 1 augustus 1983;

      b. het ontslag is verleend uit een betrekking als hoofdleidster of leidster bij een kleuterschool of als hoofd,
      onderwijzer of vakonderwijzer bij een lagere school of experimentele basisschool;

      c. de desbetreffende aanspraak op een ontslaguitkering is na de dag waarop het recht daarop is ingegaan zonder
      wezenlijke onderbreking blijven bestaan, waarbij een onderbreking van twee maanden of minder niet als een
      wezenlijke onderbreking wordt aangemerkt.

      Het uitzicht wordt vastgesteld op de wijze als in [artikel C1][ref1] is aangegeven waarbij een uitzicht op
      salarisvaststelling na 31 juli 1985 wordt vastgesteld volgens het maximum schaalsalaris van de schaal die voor hem
      gold in de betrekking waaruit het desbetreffende ontslag is verleend. Voor degene aan wie ontslag is verleend uit
      een betrekking als vakonderwijzer wordt een uitzicht op salarisvasstelling na 31 juli 1985 vastgesteld volgens het
      schaalsalaris dat voor hem zou hebben gegolden volgens de bepalingen van het Rechtspositiebesluit KO/LO over 15
      jaar na de datum waarop het desbetreffende ontslag is verleend.

      2 Ten aanzien van degene die op 31 juli 1985 als hoofdleidster of leidster bij een kleuterschool of als
      hoofd, onderwijzer of vakonderwijzer in dienst was bij een lagere school of experimentele basisschool en
      aan wie met ingang van 1 augustus 1985 terzake van ontslag uit die betrekking een uitkering als bedoeld in
      [hoofdstuk I-H van het Rechtspositiebesluit onderwijspersoneel][ref2] is toegekend, is het bepaalde in het eerste
      lid van overeenkomstige toepassing.

      3 In afwijking van het bepaalde in [artikel C4][ref3] wordt de verklaring, bedoeld in dit artikel afgegeven door
      Onze minister. Het bepaalde in [artikel C4][ref4] is overigens van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003807#ArtikelC1
      [ref2]: https://wetten.overheid.nl/BWBR0003771#HoofdstukI-H
      [ref3]: https://wetten.overheid.nl/BWBR0003807#ArtikelC4
      [ref4]: https://wetten.overheid.nl/BWBR0003807#ArtikelC4
