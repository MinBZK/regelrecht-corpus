  - number: B5
    text: |-
      Voor de belanghebbende die op 31 juli 1985 belast is met de waarneming van een wegens ziekte of anderszins afwezige
      hoofd, onderwijzer, hoofdleidster of leidster en op 1 augustus 1985 belast is met de waarneming van een wegens
      ziekte of anderszins afwezige directeur of leraar en wiens ambtelijk inkomen op 31 juli 1985 anders dan uitsluitend
      door wijziging van zijn taakomvang hoger is dan het ambtelijk inkomen zonder de waarneming, wordt tevens een
      inpassing toegepast als bedoeld in [artikel B2][ref1] met inbegrip van de hem op 31 juli 1985 toegekende toelage,
      bedoeld in artikel I-P26 dan wel artikel I-R22 van het Rechtspositiebesluit KO/LO.


      [ref1]: https://wetten.overheid.nl/BWBR0003807#ArtikelB2
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelB5
    references:
      - id: ref1
        bwb_id: BWBR0003807
        artikel: B2
        hoofdstuk: B
  - number: C1
    text: |-
      1 Met inachtneming van het bepaalde in [artikel C3][ref1] en de [artikelen V-P1][ref2], [V-Q201][ref3],
      [V-Q202][ref4] en [V-R201 van het Rechtspositiebesluit onderwijspersoneel][ref5] wordt voor de belanghebbende die
      op 31 juli 1985 in dienst was van een lagere school of een experimentele basisschool als hoofd een uitzicht op
      salarisvaststelling na 31 juli 1985 vastgesteld volgens het maximum schaalsalaris van de schaal die voor hem op 31
      juli 1985 volgens het Rechtspositiebesluit KO/LO van toepassing was, verminderd met het bedrag bedoeld in artikel
      I-P8, derde lid, van het Rechtspositiebesluit KO/LO indien het bepaalde in dit lid voor hem op 31 juli 1985 van
      toepassing was, en verhoogd met de salarisverhoging bedoeld in de artikelen I-P8a, I-Q3, tweede lid en IV-Q7,
      tweede lid van het Rechtspositiebesluit KO/LO indien daarop aanspraak bestond op 31 juli 1985.

      2 Indien het in het eerste lid bedoelde hoofd op 31 juli 1985 in het genot was van een toelage als bedoeld in
      artikel I-P9 van het Rechtspositiebesluit KO/LO en hij:

      a. op die datum 47 jaar of ouder is: wordt het volgens het eerste lid vastgestelde maximum schaalsalaris verhoogd
      met het bedrag van evenbedoelde toelage;

      b. op die datum 46 jaar is: wordt het volgens het eerste lid vastgestelde maximumsalaris verhoogd met de helft van
      het bedrag van evenbedoelde toelage.

      3 Met inachtneming van het bepaalde in [artikel C3][ref6] en de [artikelen V-P1][ref7], [V-Q201][ref8],
      [V-Q202][ref9] en [V-R201 van het Rechtspositiebesluit onderwijspersoneel][ref10] wordt voor de belanghebbende
      die op 31 juli 1985 in dienst was van een lagere school of een experimentele basisschool als adjunct-hoofd met
      aanspraak op de toelage adjunct-hoofd, een uitzicht op salarisvaststelling na 31 juli 1985 vastgesteld volgens
      het maximum schaalsalaris van de schaal die voor hem op 31 juli 1985 volgens het Rechtspositiebesluit KO/LO van
      toepassing was, vermeerderd met de toelage bedoeld in artikel I-P10 en de salarisverhoging bedoeld in de artikelen
      I-Q3, eerste lid en IV-Q7, eerste lid van het Rechtspositiebesluit KO/LO indien daarop aanspraak bestond op 31
      juli 1985.

      4 Met inachtneming van het bepaalde in [artikel C3][ref11] en de [artikelen V-P1][ref12], [V-Q201][ref13],
      [V-Q202][ref14] en [V-R201 van het Rechtspositiebesluit onderwijspersoneel][ref15] wordt voor de belanghebbende
      die op 31 juli 1985 in dienst was van een lagere school als onderwijzer, een uitzicht op salarisvaststelling na
      31 juli 1985 vastgesteld volgens het maximum schaalsalaris van de schaal die voor hem op 31 juli 1985 volgens het
      Rechtspositiebesluit KO/LO van toepassing was, vermeerderd met de salarisverhoging bedoeld in de artikelen I-Q3,
      eerste lid, en IV-Q7, eerste lid, van het Rechtspositiebesluit KO/LO indien daarop aanspraak bestond op 31 juli
      1985.

      5 Met inachtneming van het bepaalde in [artikel C3][ref16] en de [artikelen V-P1][ref17], [V-Q201][ref18],
      [V-Q202][ref19] en [V-R201 van het Rechtspositiebesluit onderwijspersoneel][ref20] wordt voor de belanghebbende
      die op 31 juli 1985 in dienst was van een lagere school of een experimentele basisschool als vakonderwijzer
      een uitzicht op salarisvaststelling na 31 juli 1985 vastgesteld volgens het schaalsalaris dat voor hem op 1
      augustus 2000 zou hebben gegolden in de functie die hij op 31 juli 1985 vervulde volgens de bepalingen van het
      Rechtspositiebesluit KO/LO, voor zover dat schaalsalaris hoger zou zijn dan het hoogste bedrag in schaal 9.

      6 Het in het eerste, derde, vierde en vijfde lid bedoelde uitzicht wordt uitgedrukt in het nummer van de schaal en
      het salarisnummer binnen die schaal waarbij het bedrag waarop uitzicht wordt gegeven, is vermeld.

      7 Het in het zesde lid bedoelde bedrag is een schaalsalaris, dat zo dicht mogelijk ligt bij het ingevolge dit
      hoofdstuk vast te stellen bedrag bij een normbetrekking op 31 juli 1985, in de laagste schaal waarvan het maximum
      gelijk is aan of hoger dan het bedrag waarop uitzicht wordt gegeven; indien het laatstbedoelde bedrag op gelijke
      afstand ligt tot twee bedragen in de laagste schaal, wordt het schaalsalaris vastgesteld op het naasthogere bedrag.

      8 Met de belanghebbende bedoeld in het eerste, derde, vierde en vijfde lid wordt, voor zover het bepaalde in
      [artikel C5][ref21] zulks aangeeft, gelijkgesteld degene die op 31 juli 1985 een ontslaguitkering genoot.


