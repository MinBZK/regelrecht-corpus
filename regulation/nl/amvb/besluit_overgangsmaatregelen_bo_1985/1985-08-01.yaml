  - number: B1
    text: |-
      1 De weektaakomvang met ingang van 1 augustus 1985 bedraagt 40 uur voor de belanghebbende die op 31 juli 1985 een
      salaris ontving dat werd berekend naar een normbetrekking.

      2 De weektaakomvang met ingang van 1 augustus 1985 van de belanghebbende die op 31 juli 1985 niet in een
      normbetrekking als bedoeld in het Rechtspositiebesluit KO/LO was aangesteld, wordt vastgesteld als volgt:

      a. indien de aanstelling vóór 1 augustus 1985 was uitgedrukt in een aantal uren: het getal voor de letter x in de
      breuk genoemd in artikel I-P21 dan wel artikel I-R17 van het Rechtspositiebesluit KO/LO.

      b. indien de aanstelling vóór 1 augustus 1985 was uitgedrukt in een aantal schooltijden: het totaal van het aantal
      uren gedurende welke leerlingen in de school aanwezig zijn voor onderwijs gedurende de schooltijden waarin de
      belanghebbende dienst verricht als getal voor de letter x in de breuk genoemd in artikel I-P21 dan wel artikel I-
      R17 van het Rechtspositiebesluit KO/LO.

      één en ander vermenigvuldigd met 40/26 indien de belanghebbende op 31 juli 1985 verbonden was aan een lagere school
      of een afdeling voor lager onderwijs van een experimentele basisschool dan wel met 40/22 indien de belanghebbende
      op 31 juli 1985 verbonden was aan een kleuterschool of een kleuterafdeling van een experimentele basisschool. De
      uitkomst van de berekening wordt rekenkundig afgerond op veelvouden van een kwartier.

      3 Het bepaalde in het eerste en het tweede lid is niet van toepassing indien voor de belanghebbende:

      a. op grond van de formatieregeling zoals die op 31 juli 1985 luidde met ingang van 1 augustus 1985 een
      weektaakomvang zou moeten worden vastgesteld die kleiner is dan op 31 juli 1985 voor hem gold, in welk geval de
      nieuwe weektaakomvang overeenkomstig het bepaalde in het tweede lid wordt omgerekend naar een weektaakomvang per 1
      augustus 1985;

      b. op grond van de formatieregeling zoals die op 1 augustus 1985 luidt, een grotere weektaakomvang kan
      worden toegekend dan na toepassing van het bepaalde in het tweede lid voor hem is berekend, in welk geval de
      weektaakomvang met ingang van 1 augustus 1985 wordt bepaald op die welke voor hem beschikbaar is.

      Onder formatieregeling, bedoeld onder *a*, worden mede begrepen de regelingen ten behoeve van taakrealisatie
      schoolleiding, onderwijsstimulering en culturele minderheden.
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelB1
  - number: B2
    text: |-
      1 Voor de belanghebbende wordt op 1 augustus 1985 een schaalsalaris vastgesteld in het carrièrepatroon
      van de functie waarin hij wordt benoemd volgens het bepaalde in [hoofdstuk I-Q][ref1] dan wel
      [hoofdstuk I-R van het Rechtspositiebesluit onderwijspersoneel][ref2], dat zo dicht mogelijk ligt bij en tenminste
      gelijk is aan het salaris bij een normbetrekking dat voor hem op 31 juli 1985 gold.

      2 Het salaris bij een normbetrekking, bedoeld in het eerste lid, wordt berekend aan de hand van het feitelijke
      salaris volgens de schaal die voor de belanghebbende op 31 juli 1985 voor de salarisberekening in aanmerking werd
      genomen,

      a. in voorkomend geval verminderd met het bedrag, bedoeld in artikel I-P8, derde lid, dan wel artikel I-R6, derde
      lid, van het Rechtspositiebesluit KO/LO;

      b. indien de belanghebbende op 31 juli 1985 daarop aanspraak had, verhoogd met:

      1. de salarisverhoging bedoeld in een der artikelen I-P8*a*, I-Q3 en IV-Q7, van het Rechtspositiebesluit KO/LO;

      2. de toelage bedoeld in artikel I-P9 dan wel artikel I-R7 van het Rechtspositiebesluit KO/LO dan wel

      3. de toelage bedoeld in artikel I-P10 van het Rechtspositiebesluit KO/LO.

      Het bedrag van het evenbedoeld feitelijk salaris, eventueel verminderd met het bedrag van de salarisvermindering
      bedoeld onder *a* en eventueel verhoogd met de salarisverhogingen en de toelagen bedoeld onder *b*, wordt zonodig
      omgerekend naar een bedrag bij een normbetrekking door vermenigvuldiging met 26/x indien de belanghebbende op
      31 juli 1985 verbonden was aan een lagere school of een afdeling voor lager onderwijs van een experimentele
      basisschool dan wel met 22/x indien de belanghebbende op 31 juli 1985 verbonden was aan een kleuterschool of een
      kleuterafdeling van een experimentele basisschool, waarbij x is het voor de belanghebbende op 31 juli 1985 geldende
      getal voor de letter x in de breuk genoemd in artikel I-P21 dan wel artikel I-R17 van het Rechtspositiebesluit
      KO/LO, waarna de aldus verkregen uitkomst nog wordt verhoogd met de toelage bedoeld in artikel I-U7 van het
      Rechtspositiebesluit KO/LO indien de belanghebbende op 31 juli 1985 daarop aanspraak had.

      3 Indien het salaris van een belanghebbende bij een normbetrekking op 31 juli 1985, berekend volgens het bepaalde
      in het tweede lid, hoger is dan het maximum van de bij zijn functie behorende maximumschaal per 1 augustus 1985,
      geschiedt de inpassing op een schaalsalaris dat zo dicht mogelijk ligt bij en ten minste gelijk is aan zijn salaris
      bij een normbetrekking op 31 juli 1985 en wel in de laagste schaal waarvan het maximum gelijk is aan of hoger is
      dan dat salaris bij een normbetrekking.

      4 Voor de belanghebbende die op 31 juli 1985 in dienst was als hoofdleidster van een kleuterschool en die op 31
      juli 1985 in het bezit was van de akte van bekwaamheid als hoofdleidster en het diploma van de applicatiecursus
      volledig bevoegd onderwijzer, geschiedt de inpassing op het bedrag gelegen onmiddellijk boven het schaalsalaris,
      vastgesteld volgens het bepaalde in het eerste tot en met derde lid. Indien het ingevolge het eerste lid
      vastgestelde schaalsalaris gelijk is aan het maximum van de bij zijn functie behorende maximumschaal per 1 augustus
      1985, geschiedt voor de in de eerste volzin bedoelde belanghebbende de inpassing op het naasthogere schaalsalaris
      en wel in de laagste schaal waarvan het maximum hoger is dan het ingevolge het eerste lid vastgestelde
      schaalsalaris.

      5 Voor de toepassing van het bepaalde in
      [artikel I-R106, tweede lid, van het Rechtspositiebesluit onderwijspersoneel][ref3] wordt de belanghebbende,
      wiens schaalsalaris aan de hand van dit hoofdstuk wordt vastgesteld in de laagste bij zijn functie behorende
      aanloopschaal, geacht op 1 augustus 1985 in dienst te zijn getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0003771#HoofdstukI-Q
      [ref2]: https://wetten.overheid.nl/BWBR0003771#HoofdstukI-R
      [ref3]: https://wetten.overheid.nl/BWBR0003771#ArtikelI-R106
