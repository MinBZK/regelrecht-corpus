preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Onderwijs en Wetenschappen van 6 februari 1985, nr. 149.396, Directie
    Arbeidsvoorwaardenbeleid, gedaan mede namens Onze Minister van Binnenlandse Zaken;

    Gelet op artikel 20, tweede lid, van de Wet op het basisonderwijs (Stb. 1981, 468);

    De Raad van State gehoord, advies van 21 maart 1985, nr. W05.85.0083/10.5.11;

    Gezien het nader rapport van Onze Minister van Onderwijs en Wetenschappen van 5 juni 1985, nr. 149.731, Directie
    Arbeidsvoorwaardenbeleid, uitgebracht mede namens Onze Minister van Binnenlandse Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelAanhef
articles:
  - number: A1.1
    text: |-
      In dit besluit zijn de begripsbepalingen van het [Rechtspositiebesluit onderwijspersoneel][ref1] (*Stb.* 1985, 110)
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003771
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelA1
    references:
      - id: ref1
        bwb_id: BWBR0003771
  - number: A1.2
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelA1
  - number: A1.2.a
    text: |-
      Wet: de [Wet op het basisondewijs][ref1] (*Stb.* 1981, 468);


      [ref1]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelA1
    references:
      - id: ref1
        bwb_id: BWBR0003420
  - number: A1.2.b
    text: 'Rechtspositiebesluit KO/LO: het Rechtspositiebesluit KO/LO (*Stb.* 1978, 228) zoals dat luidde op 31 juli 1985;'
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelA1
  - number: A1.2.c
    text: 'school: een school voor basisonderwijs als bedoeld in de Wet;'
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelA1
  - number: A1.2.d
    text: |-
      lagere school: een school voor gewoon lager onderwijs als bedoeld in de Lager-onderwijswet 1920 (*Stb.* 778) zoals
      die luidde op 31 juli 1985 of een school als bedoeld in het Besluit buitengewoon onderwijs 1967 (*Stb.* 1978, 582),
      artikel 2, tweede lid, zoals dat luidde op 31 juli 1985;
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelA1
  - number: A1.2.e
    text: |-
      kleuterschool: een school als bedoeld in de Kleuteronderwijswet (*Stb.* 1955, 558) zoals die luidde op 31 juli
      1985;
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelA1
  - number: A1.2.f
    text: |-
      belanghebbende: degene die op 31 juli 1985 in dienst was als hoofdleidster of leidster bij een kleuterschool of als
      hoofd, onderwijzer of vakonderwijzer bij een lagere school of experimentele basisschool;
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelA1
  - number: A1.2.g
    text: 'schaalsalaris: een bedrag in een schaal dat behoort bij een normbetrekking.'
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelA1
  - number: A2.1
    text: |-
      Ten aanzien van de belanghebbende die op 31 juli 1985 verbonden was aan een school als bedoeld in
      artikel 2, tweede lid, onder b, dan wel een afdeling voor woonwagenkinderen als bedoeld in artikel 169
      van het Besluit buitengewoon onderwijs 1967 zoals dat op 31 juli 1985 luidde, is het bepaalde in het
      [Besluit overgangsmaatregelen s.o. 1985][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003808
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelA2
    references:
      - id: ref1
        bwb_id: BWBR0003808
  - number: A2.2
    text: |-
      Het bepaalde in de [artikelen A3][ref1], [A4][ref2] en [A5][ref3] en in de [hoofdstukken B][ref4], [C][ref5] en
      [D van dit besluit][ref6] is niet van toepassing voor de belanghebbende bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003807#HoofdstukA
      [ref2]: https://wetten.overheid.nl/BWBR0003807#HoofdstukA
      [ref3]: https://wetten.overheid.nl/BWBR0003807#HoofdstukA
      [ref4]: https://wetten.overheid.nl/BWBR0003807#HoofdstukB
      [ref5]: https://wetten.overheid.nl/BWBR0003807#HoofdstukC
      [ref6]: https://wetten.overheid.nl/BWBR0003807#HoofdstukD
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelA2
    references:
      - id: ref1
