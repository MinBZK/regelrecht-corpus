  - number: C1.4
    text: |-
      Met inachtneming van het bepaalde in [artikel C3][ref1] en de [artikelen V-P1][ref2], [V-Q201][ref3],
      [V-Q202][ref4] en [V-R201 van het Rechtspositiebesluit onderwijspersoneel][ref5] wordt voor de belanghebbende die
      op 31 juli 1985 in dienst was van een lagere school als onderwijzer, een uitzicht op salarisvaststelling na 31
      juli 1985 vastgesteld volgens het maximum schaalsalaris van de schaal die voor hem op 31 juli 1985 volgens het
      Rechtspositiebesluit KO/LO van toepassing was, vermeerderd met de salarisverhoging bedoeld in de artikelen I-Q3,
      eerste lid, en IV-Q7, eerste lid, van het Rechtspositiebesluit KO/LO indien daarop aanspraak bestond op 31 juli
      1985.


