    text: Voor gevallen waarin dit besluit niet of niet naar billijkheid voorziet, beslist Onze minister.
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelD1
  - number: D2
    text: Dit besluit treedt in werking met ingang van 1 augustus 1985.
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelD2
  - number: D3
    text: Onze minister geeft nadere regelen voor de uitvoering van dit besluit.
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelD3
  - number: D4
    text: Dit besluit kan worden aangehaald als Besluit overgangsmaatregelen b.o. 1985.
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelD4
