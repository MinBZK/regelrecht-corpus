  - number: B3
    text: |-
      1 Indien voor de belanghebbende per 1 augustus 1985 een lager salaris zou moeten worden vastgesteld dan het bedrag
      van zijn bezoldiging per 31 juli 1985, vastgesteld op grond van het bepaalde in [artikel B2, tweede lid][ref1], en
      dit verschil uitsluitend is veroorzaakt door de toepassing van het bepaalde in [artikel B1, tweede lid][ref2], en
      [artikel B2][ref3], worden hem voor de vaststelling van zijn salaris zoveel kwartieren extra taakomvang toebedeeld
      als nodig is om te bereiken dat het salaris vanaf 1 augustus 1985 zo dicht mogelijk ligt bij doch ten minste gelijk
      is aan het bedrag van zijn bezoldiging dat voor hem per 31 juli 1985 gold.

      2 De in het eerste lid bedoelde extra taakomvang wordt afzonderlijk in de akte van benoeming vermeld, dient
      uitsluitend voor de berekening van het salaris en behoort overigens niet tot de weektaak waarin de belanghebbende
      is benoemd.

      3 Het bepaalde in dit artikel is niet van toepassing voor de belanghebbende voor wie een weektaakomvang per 1
      augustus 1985 is vastgesteld met toepassing van het bepaalde in [artikel B1, derde lid][ref4].


