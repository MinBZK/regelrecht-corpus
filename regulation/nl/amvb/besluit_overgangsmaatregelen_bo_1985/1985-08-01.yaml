  - number: C1.6
    text: |-
      Het in het eerste, derde, vierde en vijfde lid bedoelde uitzicht wordt uitgedrukt in het nummer van de schaal en
      het salarisnummer binnen die schaal waarbij het bedrag waarop uitzicht wordt gegeven, is vermeld.
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelC1
  - number: C1.7
    text: |-
      Het in het zesde lid bedoelde bedrag is een schaalsalaris, dat zo dicht mogelijk ligt bij het ingevolge dit
      hoofdstuk vast te stellen bedrag bij een normbetrekking op 31 juli 1985, in de laagste schaal waarvan het maximum
      gelijk is aan of hoger dan het bedrag waarop uitzicht wordt gegeven; indien het laatstbedoelde bedrag op gelijke
      afstand ligt tot twee bedragen in de laagste schaal, wordt het schaalsalaris vastgesteld op het naasthogere bedrag.
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelC1
  - number: C1.8
    text: |-
      Met de belanghebbende bedoeld in het eerste, derde, vierde en vijfde lid wordt, voor zover het bepaalde in
      [artikel C5][ref1] zulks aangeeft, gelijkgesteld degene die op 31 juli 1985 een ontslaguitkering genoot.


      [ref1]: https://wetten.overheid.nl/BWBR0003807#ArtikelC5
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelC1
    references:
      - id: ref1
        bwb_id: BWBR0003807
        artikel: C5
        hoofdstuk: C
  - number: C2
    text: |-
      Voor de belanghebbende voor wie op 31 juli 1985 bij één lagere school of bij één experimentele basisschool
      het salaris werd berekend aan de hand van verschillende schalen, wordt voor de toepassing van het bepaalde in
      [artikel C1][ref1] de hoogste voor hem op 31 juli 1985 van toepassing zijnde schaal in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003807#ArtikelC1
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelC2
    references:
      - id: ref1
        bwb_id: BWBR0003807
        artikel: C1
        hoofdstuk: C
  - number: C3
    text: |-
      Voor de belanghebbende, voor wie volgens het bepaalde in [artikel C1][ref1] een uitzicht zou moeten worden
      vastgesteld dat lager is dan het schaalsalaris dat voor hem per 1 augustus 1985 met toepassing van het bepaalde in
      [hoofdstuk B][ref2] is berekend, wordt het uitzicht vastgesteld op het laatstbedoelde niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0003807#ArtikelC1
      [ref2]: https://wetten.overheid.nl/BWBR0003807#HoofdstukB
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelC3
    references:
      - id: ref1
        bwb_id: BWBR0003807
        artikel: C1
        hoofdstuk: C
      - id: ref2
        bwb_id: BWBR0003807
        hoofdstuk: B
  - number: C4.1
    text: |-
      De belanghebbende ontvangt binnen twee jaar na 1 augustus 1985, doch uiterlijk op de datum waarop hij wordt
      ontslagen, een door het bevoegd gezag opgestelde en door Onze minister gewaarmerkte verklaring waarin het volgens
      dit hoofdstuk vastgestelde uitzicht gedetailleerd is aangegeven. De hier bedoelde verklaring wordt slechts eenmaal
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelC4
  - number: C4.2
    text: |-
      De belanghebbende die op 1 augustus 1985 in dienst is van een ander bevoegd gezag dan op 31 juli 1985, ontvangt de
      in het eerste lid bedoelde verklaring van het bevoegd gezag waarbij hij op 31 juli 1985 in dienst was.
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelC4
  - number: C5.1
    text: |-
      Voor degene die op 31 juli 1985 in het genot was van een ontslaguitkering als bedoeld in hoofdstuk I-H van het
      Rechtspositiebesluit KO/LO, wordt een uitzicht vastgesteld indien hij voldoet aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelC5
  - number: C5.1.a
    text: het ontslag terzake waarvan hij een ontslaguitkering geniet is hem verleend op of na 1 augustus 1983;
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelC5
  - number: C5.1.b
    text: |-
      het ontslag is verleend uit een betrekking als hoofdleidster of leidster bij een kleuterschool of als hoofd,
      onderwijzer of vakonderwijzer bij een lagere school of experimentele basisschool;
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelC5
  - number: C5.1.c
    text: |-
      de desbetreffende aanspraak op een ontslaguitkering is na de dag waarop het recht daarop is ingegaan zonder
      wezenlijke onderbreking blijven bestaan, waarbij een onderbreking van twee maanden of minder niet als een
      wezenlijke onderbreking wordt aangemerkt.
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelC5
  - number: C5.2
    text: |-
      Ten aanzien van degene die op 31 juli 1985 als hoofdleidster of leidster bij een kleuterschool of als
      hoofd, onderwijzer of vakonderwijzer in dienst was bij een lagere school of experimentele basisschool en
      aan wie met ingang van 1 augustus 1985 terzake van ontslag uit die betrekking een uitkering als bedoeld in
      [hoofdstuk I-H van het Rechtspositiebesluit onderwijspersoneel][ref1] is toegekend, is het bepaalde in het eerste
      lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003771#HoofdstukI-H
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelC5
    references:
      - id: ref1
        bwb_id: BWBR0003771
        hoofdstuk: I-H
  - number: C5.3
    text: |-
      In afwijking van het bepaalde in [artikel C4][ref1] wordt de verklaring, bedoeld in dit artikel afgegeven door Onze
      minister. Het bepaalde in [artikel C4][ref2] is overigens van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003807#ArtikelC4
      [ref2]: https://wetten.overheid.nl/BWBR0003807#ArtikelC4
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelC5
    references:
      - id: ref1
        bwb_id: BWBR0003807
        artikel: C4
        hoofdstuk: C
      - id: ref2
        bwb_id: BWBR0003807
        artikel: C4
        hoofdstuk: C
  - number: C6
    text: |-
      De verklaring, bedoeld in dit hoofdstuk, heeft het model zoals is opgenomen in [bijlage 1 bij dit besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003807
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelC6
    references:
      - id: ref1
        bwb_id: BWBR0003807
  - number: D1
    text: Voor gevallen waarin dit besluit niet of niet naar billijkheid voorziet, beslist Onze minister.
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelD1
  - number: D2
    text: Dit besluit treedt in werking met ingang van 1 augustus 1985.
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelD2
  - number: D3
    text: Onze minister geeft nadere regelen voor de uitvoering van dit besluit.
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelD3
  - number: D4
    text: Dit besluit kan worden aangehaald als Besluit overgangsmaatregelen b.o. 1985.
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelD4
