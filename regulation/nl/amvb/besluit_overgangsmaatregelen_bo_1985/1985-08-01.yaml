preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Onderwijs en Wetenschappen van 6 februari 1985, nr. 149.396, Directie
    Arbeidsvoorwaardenbeleid, gedaan mede namens Onze Minister van Binnenlandse Zaken;

    Gelet op artikel 20, tweede lid, van de Wet op het basisonderwijs (Stb. 1981, 468);

    De Raad van State gehoord, advies van 21 maart 1985, nr. W05.85.0083/10.5.11;

    Gezien het nader rapport van Onze Minister van Onderwijs en Wetenschappen van 5 juni 1985, nr. 149.731, Directie
    Arbeidsvoorwaardenbeleid, uitgebracht mede namens Onze Minister van Binnenlandse Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelAanhef
articles:
  - number: A1
    text: |-
      1 In dit besluit zijn de begripsbepalingen van het [Rechtspositiebesluit onderwijspersoneel][ref1] (*Stb.* 1985,
      110) van toepassing.

      2 In dit besluit wordt verstaan onder:

      a. Wet: de [Wet op het basisondewijs][ref2] (*Stb.* 1981, 468);

      b. Rechtspositiebesluit KO/LO: het Rechtspositiebesluit KO/LO (*Stb.* 1978, 228) zoals dat luidde op 31 juli 1985;

      c. school: een school voor basisonderwijs als bedoeld in de Wet;

      d. lagere school: een school voor gewoon lager onderwijs als bedoeld in de Lager-onderwijswet 1920 (*Stb.* 778)
      zoals die luidde op 31 juli 1985 of een school als bedoeld in het Besluit buitengewoon onderwijs 1967 (*Stb.* 1978,
      582), artikel 2, tweede lid, zoals dat luidde op 31 juli 1985;

      e. kleuterschool: een school als bedoeld in de Kleuteronderwijswet (*Stb.* 1955, 558) zoals die luidde op 31 juli
      1985;

      f. belanghebbende: degene die op 31 juli 1985 in dienst was als hoofdleidster of leidster bij een kleuterschool of
      als hoofd, onderwijzer of vakonderwijzer bij een lagere school of experimentele basisschool;

      g. schaalsalaris: een bedrag in een schaal dat behoort bij een normbetrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0003771
      [ref2]: https://wetten.overheid.nl/BWBR0003420
