        hoofdstuk: D
  - number: A3
    text: |-
      De aan de hand van dit besluit uit te voeren berekeningen geschieden op basis van het loonpeil dat geldt op 31
      juli 1985.
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelA3
  - number: A4
    text: |-
      Indien de belanghebbende op 31 juli 1985 verlof genoot volgens het bepaalde in een of meer van de hoofdstukken I-
      C, I-D of I-E dan wel een taakvermindering als bedoeld in hoofdstuk I-U van het Rechtspositiebesluit KO/LO worden
      uitsluitend voor de toepassing van dit besluit dit verlof of deze taakvermindering alsmede de daarmee eventueel
      samenhangende vermindering van de bezoldiging buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelA4
  - number: A5
    text: |-
      Ten aanzien van de belanghebbende op wiens verzoek op 31 juli 1985 in verband met andere door hem genoten inkomsten
      een anticumulatie als bedoeld in het Rechtspositiebesluit KO/LO werd toegepast, wordt die anticumulatie voor de
      toepassing van het bepaalde in dit besluit buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelA5
  - number: A6
    text: |-
      De beperking van de mogelijkheid voor het bevoegd gezag twee directeursfuncties te doen vervullen als aangegeven
      in [artikel I-Q208, vierde lid, van het Rechtspositiebesluit onderwijspersoneel][ref1] geldt op 1 augustus
      1985 niet ten aanzien van een basisschool waaraan met ingang van die datum een directeur wordt benoemd die op
      31 juli 1985 als hoofd van een lagere school een salaris genoot dat gelijk is aan of hoger dan het voor hem in
      [artikel I-Q208, tweede en derde lid][ref2], bij de aldaar vermelde leerlingenaantallen aangegeven maximumsalaris.


      [ref1]: https://wetten.overheid.nl/BWBR0003771#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0003771#ArtikelI
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelA6
    references:
      - id: ref1
        bwb_id: BWBR0003771
        artikel: I
      - id: ref2
        bwb_id: BWBR0003771
        artikel: I
  - number: B1.1
    text: |-
      De weektaakomvang met ingang van 1 augustus 1985 bedraagt 40 uur voor de belanghebbende die op 31 juli 1985 een
      salaris ontving dat werd berekend naar een normbetrekking.
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelB1
  - number: B1.2
    text: |-
      De weektaakomvang met ingang van 1 augustus 1985 van de belanghebbende die op 31 juli 1985 niet in een
      normbetrekking als bedoeld in het Rechtspositiebesluit KO/LO was aangesteld, wordt vastgesteld als volgt:
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelB1
  - number: B1.2.a
    text: |-
      indien de aanstelling vóór 1 augustus 1985 was uitgedrukt in een aantal uren: het getal voor de letter x in de
      breuk genoemd in artikel I-P21 dan wel artikel I-R17 van het Rechtspositiebesluit KO/LO.
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelB1
  - number: B1.2.b
    text: |-
      indien de aanstelling vóór 1 augustus 1985 was uitgedrukt in een aantal schooltijden: het totaal van het aantal
      uren gedurende welke leerlingen in de school aanwezig zijn voor onderwijs gedurende de schooltijden waarin de
      belanghebbende dienst verricht als getal voor de letter x in de breuk genoemd in artikel I-P21 dan wel artikel I-
      R17 van het Rechtspositiebesluit KO/LO.
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelB1
  - number: B1.3
    text: 'Het bepaalde in het eerste en het tweede lid is niet van toepassing indien voor de belanghebbende:'
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelB1
  - number: B1.3.a
    text: |-
      op grond van de formatieregeling zoals die op 31 juli 1985 luidde met ingang van 1 augustus 1985 een weektaakomvang
      zou moeten worden vastgesteld die kleiner is dan op 31 juli 1985 voor hem gold, in welk geval de nieuwe
      weektaakomvang overeenkomstig het bepaalde in het tweede lid wordt omgerekend naar een weektaakomvang per 1
      augustus 1985;
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelB1
  - number: B1.3.b
    text: |-
      op grond van de formatieregeling zoals die op 1 augustus 1985 luidt, een grotere weektaakomvang kan worden
      toegekend dan na toepassing van het bepaalde in het tweede lid voor hem is berekend, in welk geval de
      weektaakomvang met ingang van 1 augustus 1985 wordt bepaald op die welke voor hem beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelB1
  - number: B2.1
    text: |-
      Voor de belanghebbende wordt op 1 augustus 1985 een schaalsalaris vastgesteld in het carrièrepatroon
      van de functie waarin hij wordt benoemd volgens het bepaalde in [hoofdstuk I-Q][ref1] dan wel
      [hoofdstuk I-R van het Rechtspositiebesluit onderwijspersoneel][ref2], dat zo dicht mogelijk ligt bij en tenminste
      gelijk is aan het salaris bij een normbetrekking dat voor hem op 31 juli 1985 gold.


      [ref1]: https://wetten.overheid.nl/BWBR0003771#HoofdstukI-Q
      [ref2]: https://wetten.overheid.nl/BWBR0003771#HoofdstukI-R
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelB2
    references:
      - id: ref1
        bwb_id: BWBR0003771
        hoofdstuk: I-Q
      - id: ref2
        bwb_id: BWBR0003771
        hoofdstuk: I-R
  - number: B2.2
    text: |-
      Het salaris bij een normbetrekking, bedoeld in het eerste lid, wordt berekend aan de hand van het feitelijke
      salaris volgens de schaal die voor de belanghebbende op 31 juli 1985 voor de salarisberekening in aanmerking werd
      genomen,
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelB2
  - number: B2.2.a
    text: |-
      in voorkomend geval verminderd met het bedrag, bedoeld in artikel I-P8, derde lid, dan wel artikel I-R6, derde lid,
      van het Rechtspositiebesluit KO/LO;
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelB2
  - number: B2.2.b
    text: 'indien de belanghebbende op 31 juli 1985 daarop aanspraak had, verhoogd met:'
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelB2
  - number: B2.2.b.1
    text: de salarisverhoging bedoeld in een der artikelen I-P8*a*, I-Q3 en IV-Q7, van het Rechtspositiebesluit KO/LO;
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelB2
  - number: B2.2.b.2
    text: de toelage bedoeld in artikel I-P9 dan wel artikel I-R7 van het Rechtspositiebesluit KO/LO dan wel
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelB2
  - number: B2.2.b.3
    text: de toelage bedoeld in artikel I-P10 van het Rechtspositiebesluit KO/LO.
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelB2
  - number: B2.3
    text: |-
      Indien het salaris van een belanghebbende bij een normbetrekking op 31 juli 1985, berekend volgens het bepaalde
      in het tweede lid, hoger is dan het maximum van de bij zijn functie behorende maximumschaal per 1 augustus 1985,
      geschiedt de inpassing op een schaalsalaris dat zo dicht mogelijk ligt bij en ten minste gelijk is aan zijn salaris
      bij een normbetrekking op 31 juli 1985 en wel in de laagste schaal waarvan het maximum gelijk is aan of hoger is
      dan dat salaris bij een normbetrekking.
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelB2
  - number: B2.4
    text: |-
      Voor de belanghebbende die op 31 juli 1985 in dienst was als hoofdleidster van een kleuterschool en die op 31 juli
      1985 in het bezit was van de akte van bekwaamheid als hoofdleidster en het diploma van de applicatiecursus volledig
      bevoegd onderwijzer, geschiedt de inpassing op het bedrag gelegen onmiddellijk boven het schaalsalaris, vastgesteld
      volgens het bepaalde in het eerste tot en met derde lid. Indien het ingevolge het eerste lid vastgestelde
      schaalsalaris gelijk is aan het maximum van de bij zijn functie behorende maximumschaal per 1 augustus 1985,
      geschiedt voor de in de eerste volzin bedoelde belanghebbende de inpassing op het naasthogere schaalsalaris en wel
      in de laagste schaal waarvan het maximum hoger is dan het ingevolge het eerste lid vastgestelde schaalsalaris.
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelB2
  - number: B2.5
    text: |-
      Voor de toepassing van het bepaalde in
      [artikel I-R106, tweede lid, van het Rechtspositiebesluit onderwijspersoneel][ref1] wordt de belanghebbende,
      wiens schaalsalaris aan de hand van dit hoofdstuk wordt vastgesteld in de laagste bij zijn functie behorende
      aanloopschaal, geacht op 1 augustus 1985 in dienst te zijn getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0003771#ArtikelI
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelB2
    references:
      - id: ref1
        bwb_id: BWBR0003771
        artikel: I
  - number: B3.1
    text: |-
      Indien voor de belanghebbende per 1 augustus 1985 een lager salaris zou moeten worden vastgesteld dan het bedrag
      van zijn bezoldiging per 31 juli 1985, vastgesteld op grond van het bepaalde in [artikel B2, tweede lid][ref1], en
      dit verschil uitsluitend is veroorzaakt door de toepassing van het bepaalde in [artikel B1, tweede lid][ref2], en
      [artikel B2][ref3], worden hem voor de vaststelling van zijn salaris zoveel kwartieren extra taakomvang toebedeeld
      als nodig is om te bereiken dat het salaris vanaf 1 augustus 1985 zo dicht mogelijk ligt bij doch ten minste gelijk
      is aan het bedrag van zijn bezoldiging dat voor hem per 31 juli 1985 gold.


      [ref1]: https://wetten.overheid.nl/BWBR0003807#HoofdstukB
      [ref2]: https://wetten.overheid.nl/BWBR0003807#HoofdstukB
      [ref3]: https://wetten.overheid.nl/BWBR0003807#HoofdstukB
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelB3
    references:
      - id: ref1
        bwb_id: BWBR0003807
        hoofdstuk: B
      - id: ref2
        bwb_id: BWBR0003807
        hoofdstuk: B
      - id: ref3
        bwb_id: BWBR0003807
        hoofdstuk: B
  - number: B3.2
    text: |-
      De in het eerste lid bedoelde extra taakomvang wordt afzonderlijk in de akte van benoeming vermeld, dient
      uitsluitend voor de berekening van het salaris en behoort overigens niet tot de weektaak waarin de belanghebbende
      is benoemd.
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelB3
  - number: B3.3
    text: |-
      Het bepaalde in dit artikel is niet van toepassing voor de belanghebbende voor wie een weektaakomvang per 1
      augustus 1985 is vastgesteld met toepassing van het bepaalde in [artikel B1, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003807#HoofdstukB
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelB3
    references:
      - id: ref1
        bwb_id: BWBR0003807
        hoofdstuk: B
  - number: B4.1
    text: |-
      Voor de belanghebbende voor wie op 31 juli 1985 bij één lagere school of bij een experimentele basisschool een
      salaris wordt vastgesteld dat is berekend aan de hand van verschillende schalen, wordt een weektaakomvang per 1
      augustus 1985 vastgesteld overeenkomstig het bepaalde in [artikel B1][ref1] voor het totaal van het aantal uren
      waarnaar zijn salaris op 31 juli 1985 werd berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0003807#HoofdstukB
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelB4
    references:
      - id: ref1
        bwb_id: BWBR0003807
        hoofdstuk: B
  - number: B4.2
    text: |-
      Voor de vaststelling van het salaris bij een normbetrekking, bedoeld in artikel B2, tweede lid, wordt
      voor de in het eerste lid bedoelde belanghebbende het totaal van het salaris op 31 juli 1985 omgerekend
      naar een bedrag bij normbetrekking door vermenigvuldiging met 26 en deling door het totaal van het aantal
      uren dat op 31 juli 1985 voor de berekening van zijn salaris in aanmerking werd genomen; het bepaalde in
      [artikel B2, eerste, derde en vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003807#HoofdstukB
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelB4
    references:
      - id: ref1
        bwb_id: BWBR0003807
        hoofdstuk: B
  - number: B5
    text: |-
      Voor de belanghebbende die op 31 juli 1985 belast is met de waarneming van een wegens ziekte of anderszins afwezige
      hoofd, onderwijzer, hoofdleidster of leidster en op 1 augustus 1985 belast is met de waarneming van een wegens
      ziekte of anderszins afwezige directeur of leraar en wiens ambtelijk inkomen op 31 juli 1985 anders dan uitsluitend
      door wijziging van zijn taakomvang hoger is dan het ambtelijk inkomen zonder de waarneming, wordt tevens een
      inpassing toegepast als bedoeld in [artikel B2][ref1] met inbegrip van de hem op 31 juli 1985 toegekende toelage,
      bedoeld in artikel I-P26 dan wel artikel I-R22 van het Rechtspositiebesluit KO/LO.


      [ref1]: https://wetten.overheid.nl/BWBR0003807#HoofdstukB
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelB5
    references:
      - id: ref1
        bwb_id: BWBR0003807
        hoofdstuk: B
  - number: C1.1
    text: |-
      Met inachtneming van het bepaalde in [artikel C3][ref1] en de [artikelen V-P1][ref2], [V-Q201][ref3],
      [V-Q202][ref4] en [V-R201 van het Rechtspositiebesluit onderwijspersoneel][ref5] wordt voor de belanghebbende die
      op 31 juli 1985 in dienst was van een lagere school of een experimentele basisschool als hoofd een uitzicht op
      salarisvaststelling na 31 juli 1985 vastgesteld volgens het maximum schaalsalaris van de schaal die voor hem op 31
      juli 1985 volgens het Rechtspositiebesluit KO/LO van toepassing was, verminderd met het bedrag bedoeld in artikel
      I-P8, derde lid, van het Rechtspositiebesluit KO/LO indien het bepaalde in dit lid voor hem op 31 juli 1985 van
      toepassing was, en verhoogd met de salarisverhoging bedoeld in de artikelen I-P8a, I-Q3, tweede lid en IV-Q7,
      tweede lid van het Rechtspositiebesluit KO/LO indien daarop aanspraak bestond op 31 juli 1985.


      [ref1]: https://wetten.overheid.nl/BWBR0003807#ArtikelC3
      [ref2]: https://wetten.overheid.nl/BWBR0003771#ArtikelV
      [ref3]: https://wetten.overheid.nl/BWBR0003771#ArtikelV
      [ref4]: https://wetten.overheid.nl/BWBR0003771#ArtikelV
      [ref5]: https://wetten.overheid.nl/BWBR0003771#ArtikelV
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelC1
    references:
      - id: ref1
        bwb_id: BWBR0003807
        artikel: C3
        hoofdstuk: C
      - id: ref2
        bwb_id: BWBR0003771
        artikel: V
      - id: ref3
        bwb_id: BWBR0003771
        artikel: V
      - id: ref4
        bwb_id: BWBR0003771
        artikel: V
      - id: ref5
        bwb_id: BWBR0003771
        artikel: V
  - number: C1.2
    text: |-
      Indien het in het eerste lid bedoelde hoofd op 31 juli 1985 in het genot was van een toelage als bedoeld in artikel
      I-P9 van het Rechtspositiebesluit KO/LO en hij:
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelC1
  - number: C1.2.a
    text: |-
      op die datum 47 jaar of ouder is: wordt het volgens het eerste lid vastgestelde maximum schaalsalaris verhoogd met
      het bedrag van evenbedoelde toelage;
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelC1
  - number: C1.2.b
    text: |-
      op die datum 46 jaar is: wordt het volgens het eerste lid vastgestelde maximumsalaris verhoogd met de helft van het
      bedrag van evenbedoelde toelage.
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelC1
  - number: C1.3
    text: |-
      Met inachtneming van het bepaalde in [artikel C3][ref1] en de [artikelen V-P1][ref2], [V-Q201][ref3],
      [V-Q202][ref4] en [V-R201 van het Rechtspositiebesluit onderwijspersoneel][ref5] wordt voor de belanghebbende
      die op 31 juli 1985 in dienst was van een lagere school of een experimentele basisschool als adjunct-hoofd met
      aanspraak op de toelage adjunct-hoofd, een uitzicht op salarisvaststelling na 31 juli 1985 vastgesteld volgens
      het maximum schaalsalaris van de schaal die voor hem op 31 juli 1985 volgens het Rechtspositiebesluit KO/LO van
      toepassing was, vermeerderd met de toelage bedoeld in artikel I-P10 en de salarisverhoging bedoeld in de artikelen
      I-Q3, eerste lid en IV-Q7, eerste lid van het Rechtspositiebesluit KO/LO indien daarop aanspraak bestond op 31
      juli 1985.


      [ref1]: https://wetten.overheid.nl/BWBR0003807#ArtikelC3
      [ref2]: https://wetten.overheid.nl/BWBR0003771#ArtikelV
      [ref3]: https://wetten.overheid.nl/BWBR0003771#ArtikelV
