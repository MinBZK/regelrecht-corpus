  - number: C2
    text: |-
      Voor de belanghebbende voor wie op 31 juli 1985 bij één lagere school of bij één experimentele basisschool
      het salaris werd berekend aan de hand van verschillende schalen, wordt voor de toepassing van het bepaalde in
      [artikel C1][ref1] de hoogste voor hem op 31 juli 1985 van toepassing zijnde schaal in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003807#ArtikelC1
    url: https://wetten.overheid.nl/BWBR0003807/1985-08-01#ArtikelC2
