    text: |-
      1 Verzekerd op grond van de volksverzekeringen is de niet in Nederland wonende Nederlander die op grond van
      __REF000___________________________________________________________________________________________________________
      _________________________ werkzaam is bij een vertegenwoordiging van het Koninkrijk der Nederlanden in het
      buitenland als bedoeld in [artikel 7, tweede lid, van het Reglement Dienst Buitenlandse Zaken][ref2], tenzij hij:

      a. buiten Nederland arbeid verricht anders dan de werkzaamheden, bedoeld in de aanhef; of

      b. een uitkering ontvangt op grond van een buitenlandse wettelijke regeling inzake sociale zekerheid.

      2 Verzekerd op grond van de volksverzekeringen zijn de gezinsleden, bedoeld in artikel 2 van het Reglement Dienst
      Buitenlandse Zaken, van de in het eerste lid bedoelde verzekerde, tenzij het gezinslid:

      a. buiten Nederland arbeid verricht en de inkomsten uit deze arbeid meer bedragen dan het bedrag, genoemd in
      [artikel 8.14, eerste lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref3]; of

      b. een uitkering ontvangt op grond van een buitenlandse wettelijke regeling inzake sociale zekerheid.

      3 De gezinsleden die op grond van het tweede lid zijn verzekerd, blijven verzekerd op grond van de
      volksverzekeringen gedurende de periode van een jaar, te rekenen vanaf de datum van overlijden van de verzekerde,
      bedoeld in het eerste lid, tenzij het gezinslid:

      a. buiten Nederland arbeid verricht en de inkomsten uit deze arbeid meer bedragen dan het bedrag, genoemd in
      [artikel 8.14, eerste lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref4]; of

      b. een uitkering ontvangt op grond van een buitenlandse wettelijke regeling inzake sociale zekerheid.

      4 Verzekerd op grond van de volksverzekeringen is de niet in Nederland wonende particuliere bediende die in dienst
      is van de verzekerde, bedoeld in het eerste lid, tenzij hij:

      a. onderdaan is van de ontvangende staat;

      b. ten tijde van aanwerving niet in Nederland woonde;

      c. buiten Nederland arbeid verricht anders dan uit hoofde van vorenbedoelde dienstbetrekking; of

      d. een uitkering ontvangt op grond van een buitenlandse wettelijke regeling inzake sociale zekerheid.


