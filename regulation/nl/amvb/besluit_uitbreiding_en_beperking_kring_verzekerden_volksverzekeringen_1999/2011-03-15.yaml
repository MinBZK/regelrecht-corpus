  - number: '17'
    text: |-
      Niet verzekerd op grond van de volksverzekeringen is de persoon die in Nederland woont en die behoort tot het
      rijdend, vliegend of op de binnenwateren varend personeel van een buiten Nederland wonende of gevestigde werkgever
      die internationaal vervoer verricht, tenzij hij:

      a. in hoofdzaak in Nederland arbeid verricht; of

      b. werkt bij een filiaal of een vaste vertegenwoordiging van die werkgever in Nederland.
    url: https://wetten.overheid.nl/BWBR0010182/2011-03-15#Artikel17
  - number: '18'
    text: |-
      1 De persoon die tijdelijk in Nederland verblijft, in dienstbetrekking werkzaam is van een in Nederland gevestigde
      buitenlandse instelling zonder winstoogmerk en op wie een buitenlandse wettelijke regeling inzake sociale zekerheid
      van toepassing blijft, wordt voor de duur van ten hoogste twee jaar op zijn aanvraag of op aanvraag van de
      werkgever door de Sociale verzekeringsbank van de verzekering op grond van de volksverzekeringen ontheven, tenzij
      hij:

      a. in Nederland arbeid verricht anders dan uit hoofde van de vorenbedoelde dienstbetrekking; of

      b. een Nederlandse socialeverzekeringsuitkering ontvangt. De periode van twee jaar, bedoeld in de eerste zin, kan
      op aanvraag telkens voor de duur van twee jaar worden verlengd.

      2 Niet verzekerd op grond van de volksverzekeringen zijn de echtgenoot, kinderen en overige inwonende gezinsleden
      van een persoon die als niet verzekerd wordt aangemerkt op grond van het eerste lid, tenzij zij:

      a. in Nederland arbeid verrichten; of

      b. een Nederlandse socialeverzekeringsuitkering ontvangen.

      3 De echtgenoot, kinderen en overige inwonende gezinsleden die op grond van het tweede lid niet verzekerd zijn,
      blijven van de verzekering op grond van de volksverzekeringen uitgesloten gedurende de periode van een jaar, te
      rekenen vanaf de datum van overlijden van de persoon die als niet verzekerd wordt aangemerkt op grond van het
      eerste lid, tenzij zij:

      a. in Nederland arbeid verrichten; of

      b. een Nederlandse socialeverzekeringsuitkering ontvangen.
    url: https://wetten.overheid.nl/BWBR0010182/2011-03-15#Artikel18
  - number: '19'
    text: |-
      1 Niet verzekerd op grond van de volksverzekeringen is de persoon die niet in Nederland woont en die in Nederland
      als musicus of anderszins als artiest voor korte duur arbeid verricht.

      2 Voor de toepassing van het eerste lid wordt met artiest gelijkgesteld degene, die als beroep een tak van sport
      beoefent.
    url: https://wetten.overheid.nl/BWBR0010182/2011-03-15#Artikel19
  - number: '20'
    text: |-
      Niet verzekerd op grond van de volksverzekeringen is:

      a. de persoon die uitsluitend wegens studieredenen in Nederland woont en jonger is dan 30 jaar; en

      b. de vreemdeling die een geaccrediteerde opleiding aan een hogere onderwijsinstelling in Nederland
      heeft afgerond, en die beschikt over een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 14 van de Vreemdelingenwet 2000][ref1] op grond waarvan verblijf is toegestaan uitsluitend voor het zoeken
      naar werk.


