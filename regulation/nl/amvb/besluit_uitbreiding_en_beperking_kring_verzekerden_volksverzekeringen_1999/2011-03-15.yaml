        bwb_id: BWBR0011353
        afdeling: '7.2'
  - number: 9a
    text: |-
      Een vreemdeling die rechtmatig in Nederland verblijft, in de zin van [artikel 8, onder c, van de Vreemdelingenwet
      2000](onbekend), is, ongeacht of hij als ingezetene kan worden beschouwd, verzekerd op grond van de
      volksverzekeringen met ingang van de dag waarop positief op de verblijfsvergunningsaanvraag wordt beschikt.
    url: https://wetten.overheid.nl/BWBR0010182/2011-03-15#Artikel9a
  - number: '10'
    text: |-
      1 Verzekerd op grond van de volksverzekeringen is de in Nederland wonende
      vreemdeling die na rechtmatig in Nederland verblijf te hebben gehouden in de zin van
      [artikel 8, onder a tot en met e, of l, van de Vreemdelingenwet 2000][ref1]:

      a. voor de beëindiging van dit verblijf een aanvraag heeft ingediend om voortgezette toelating; of

      b. binnen de termijn, genoemd in [artikel 69, eerste lid, van de Vreemdelingenwet 2000][ref2], of,
      buiten die termijn, ingeval [artikel 6.11 van de Algemene wet bestuursrecht](onbekend) toepassing heeft
      gevonden, bezwaar heeft gemaakt of beroep heeft ingesteld tegen intrekking van de toelating in de zin van
      [artikel 8, onder a tot en met e, of l, van de Vreemdelingenwet 2000][ref3].

      2 De verzekering op grond van het eerste lid eindigt zodra:

      a. onherroepelijk op de aanvraag, het bezwaar of het beroep is beslist; of

      b. de uitzetting van de vreemdeling is gelast, tenzij die uitzetting op grond van de [Vreemdelingenwet 2000][ref4]
      of op grond van een rechterlijke beslissing achterwege dient te blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
