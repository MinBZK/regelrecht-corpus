        artikel: 8.14a
  - number: '4'
    text: |-
      Verzekerd op grond van de volksverzekeringen is de persoon die niet in Nederland woont en behoort tot het
      rijdend, vliegend of op de binnenwateren varend personeel van een in Nederland wonende of gevestigde werkgever die
      internationaal vervoer verricht, tenzij hij:

      a. in hoofdzaak in het land waarin hij woont arbeid verricht; of

      b. werkt bij een filiaal of een vaste vertegenwoordiging van die werkgever buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0010182/2011-03-15#Artikel4
  - number: '5'
    text: |-
      Verzekerd op grond van de volksverzekeringen zijn de aan boord van een schip wonende echtgenoot en kinderen van de
      persoon die op grond van de volksverzekeringen of van [artikel 4][ref1] verzekerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0010182#Artikel4
    url: https://wetten.overheid.nl/BWBR0010182/2011-03-15#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010182
        artikel: '4'
        paragraaf: '2'
  - number: '6'
    text: |-
      Verzekerd op grond van de volksverzekeringen blijft de persoon die niet in Nederland woont, maar die uitsluitend in
      Nederland arbeid verricht en van wie de arbeid tijdelijk wordt onderbroken:

      a. wegens ziekte, gebreken, zwangerschap, bevalling of werkloosheid; of

      b. wegens verlof, staking of uitsluiting.
    url: https://wetten.overheid.nl/BWBR0010182/2011-03-15#Artikel6
  - number: '8'
    text: |-
      1 Verzekerd op grond van de volksverzekeringen blijft de persoon die aansluitend op het wonen in Nederland
      uitsluitend wegens studieredenen niet meer in Nederland woont en jonger is dan 30 jaar.

      2 Verzekerd op grond van de volksverzekeringen blijft de persoon die aansluitend op het wonen in
      Nederland, uitsluitend omdat hij wordt verpleegd in een door Onze Minister van Volksgezondheid,
      Welzijn en Sport aan te wijzen instelling, die overeenkomt met een instelling als bedoeld in
      [artikel 1, onderdeel f, van de Wet toelating zorginstellingen][ref1] die zorg levert waarop aanspraak bestaat
      ingevolge de [Algemene Wet Bijzondere Ziektekosten][ref2], niet meer in Nederland woont.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0010182/2011-03-15#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002614
  - number: '9'
    text: |-
      Verzekerd op grond van de volksverzekeringen is de persoon die niet in Nederland woont en die belastbare winst uit
      Nederlandse onderneming als bedoeld in [afdeling 7.2 van de Wet inkomstenbelasting 2001][ref1] geniet, mits hij in
      Nederland arbeid verricht voor die onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Afdeling7.2
    url: https://wetten.overheid.nl/BWBR0010182/2011-03-15#Artikel9
