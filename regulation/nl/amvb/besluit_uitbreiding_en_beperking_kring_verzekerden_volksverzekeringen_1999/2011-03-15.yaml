    text: |-
      Door het College zorgverzekeringen voor de inwerkingtreding van dit besluit afgegeven verklaringen als bedoeld
      in [artikel 21][ref1] en verleende ontheffingen als bedoeld in [artikel 21a][ref2], worden aangemerkt als door de
      Sociale verzekeringsbank op grond van de desbetreffende artikelen afgegeven verklaringen en ontheffingen.


