  - number: 3a
    text: |-
      1 Verzekerd op grond van de volksverzekeringen is de Rijksvertegenwoordiger.

      2 Verzekerd op grond van de volksverzekeringen zijn de echtgenoot, kinderen en overige inwonende gezinsleden van de
      Rijksvertegenwoordiger, tenzij het gezinslid:

      a. buiten Nederland arbeid verricht en de inkomsten uit deze arbeid meer bedragen dan het bedrag, genoemd in
      [artikel 8.14a, eerste lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref1]; of

      b. een uitkering ontvangt op grond van een andere wettelijke regeling inzake sociale zekerheid.

      3 De echtgenoot, kinderen en overige inwonende gezinsleden die op grond van het tweede lid zijn verzekerd, blijven
      verzekerd op grond van de volksverzekeringen gedurende de periode van een jaar, te rekenen vanaf de datum van
      overlijden van de Rijksvertegenwoordiger, tenzij het gezinslid:

      a. buiten Nederland arbeid verricht en de inkomsten uit deze arbeid meer bedragen dan het bedrag, genoemd in
      [artikel 8.14a, eerste lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref2]; of

      b. een uitkering ontvangt op grond van een andere wettelijke regeling inzake sociale zekerheid.

      4 Onder Rijksvertegenwoordiger als bedoeld in dit artikel wordt verstaan: de Rijksvertegenwoordiger voor de
      openbare lichamen Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8.14a
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel8.14a
