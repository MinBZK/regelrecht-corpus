  - number: '12'
    text: |-
      1 Niet verzekerd op grond van de volksverzekeringen is de persoon die in Nederland woont en die gedurende een
      aaneengesloten periode van ten minste drie maanden uitsluitend buiten Nederland arbeid verricht, tenzij die
      arbeid uitsluitend wordt verricht uit hoofde van een dienstbetrekking met een in Nederland wonende of gevestigde
      werkgever.

      2 Voor de vaststelling van de periode van drie maanden, bedoeld in het eerste lid, worden perioden gedurende welke
      de arbeid buiten Nederland tijdelijk wordt onderbroken:

      a. wegens ziekte, gebreken, zwangerschap, bevalling of werkloosheid; of

      b. wegens verlof, staking of uitsluiting; beschouwd als perioden waarin uitsluitend buiten Nederland arbeid wordt
      verricht, tenzij tijdens deze perioden arbeid in Nederland wordt verricht.

      3 Voor de toepassing van het eerste lid wordt onder het verrichten van arbeid buiten Nederland niet verstaan arbeid
      verricht op het buiten de territoriale zee onder de Noordzee gelegen deel van de zeebodem en de ondergrond daarvan,
      voor zover het Koninkrijk der Nederlanden daar op grond van het internationale recht ten behoeve van de exploratie
      en exploitatie van natuurlijke rijkdommen soevereine rechten mag uitoefenen, mits deze arbeid plaatsvindt op
      installaties en andere inrichtingen die in, op of boven dat gebied aanwezig zijn ten behoeve van de exploratie en
      de exploitatie van natuurlijke rijkdommen van dat gebied.
    url: https://wetten.overheid.nl/BWBR0010182/2011-03-15#Artikel12
  - number: '13'
    text: |-
      1 Niet verzekerd op grond van de volksverzekeringen zijn de diplomatieke ambtenaar en de consulaire ambtenaar, niet
      zijnde honorair consul, van een andere mogendheid, tenzij zij:

      a. in Nederland arbeid verrichten anders dan uit hoofde van de vorenbedoelde dienstbetrekking; of

      b. een Nederlandse socialeverzekeringsuitkering ontvangen.

      2 Niet verzekerd op grond van de volksverzekeringen zijn de naar Nederland uitgezonden leden van het
      administratieve, technische en bedienende personeel van de diplomatieke zending of de consulaire post van een
      andere mogendheid, indien zij korter dan tien jaar in Nederland werkzaam zijn, tenzij zij:

      a. Nederlander zijn;

      b. ten tijde van aanwerving in Nederland woonden;

      c. in Nederland arbeid verrichten anders dan de werkzaamheden, bedoeld in de aanhef; of

      d. een Nederlandse socialeverzekeringsuitkering ontvangen.

      3 Niet verzekerd op grond van de volksverzekeringen zijn de leden van het administratieve, technische en bedienende
      personeel van de diplomatieke zending of de consulaire post van een andere mogendheid alsmede de particuliere
      bedienden die in dienst zijn van de ambtenaar, bedoeld in het eerste lid, of van de leden van het personeel,
      bedoeld in het tweede lid, indien zij reeds vóór 1 augustus 1987 als zodanig in dienst waren, en vanaf 1 augustus
      1987 als zodanig onafgebroken in dienst zijn, tenzij zij:

      a. in Nederland arbeid verrichten anders dan de werkzaamheden, bedoeld in de aanhef; of

      b. een Nederlandse socialeverzekeringsuitkering ontvangen.

      In afwijking van de eerste zin zijn de daar genoemde leden en particuliere bedienden verzekerd op grond van de
      volksverzekeringen indien zij dit reeds op 31 juli 1987 waren.

      4 Niet verzekerd op grond van de volksverzekeringen is de particuliere bediende die in dienst is van de ambtenaar,
      bedoeld in het eerste lid, of van de leden van het personeel, bedoeld in het tweede lid, indien hij korter dan
      tien jaar in Nederland werkzaam is en op hem het stelsel van sociale verzekering van een andere mogendheid van
      toepassing is, tenzij hij:

      a. Nederlander is;

      b. ten tijde van aanwerving in Nederland woonde;

      c. in Nederland arbeid verricht anders dan uit hoofde van de vorenbedoelde dienstbetrekking; of

      d. een Nederlandse socialeverzekeringsuitkering ontvangt.

      5 De in Nederland wonende echtgenoot, kinderen en overige inwonende gezinsleden van de ambtenaar, bedoeld in het
      eerste lid, en van de personeelsleden, bedoeld in het tweede en derde lid, zijn niet verzekerd op grond van de
      volksverzekeringen, tenzij zij:

      a. in Nederland arbeid verrichten;

      b. een Nederlandse socialeverzekeringsuitkering ontvangen; of

      c. indien die ambtenaar of die personeelsleden zijn verzekerd op grond van de volksverzekeringen.

      6 De echtgenoot, kinderen en overige inwonende gezinsleden die op grond van het vijfde lid niet zijn verzekerd,
      blijven van de verzekering op grond van de volksverzekeringen uitgesloten gedurende de periode van een jaar, te
      rekenen vanaf de datum van overlijden van de persoon, bedoeld in het eerste of tweede lid, tenzij zij:

      a. in Nederland arbeid verrichten; of

      b. een Nederlandse socialeverzekeringsuitkering ontvangen.
    url: https://wetten.overheid.nl/BWBR0010182/2011-03-15#Artikel13
  - number: '14'
    text: |-
      1 Niet verzekerd op grond van de volksverzekeringen is de persoon die in dienst is van een volkenrechtelijke
      organisatie en op wie de regeling inzake sociale zekerheid van die organisatie van toepassing is, tenzij hij:

      a. in Nederland arbeid verricht anders dan uit hoofde van de vorenbedoelde dienstbetrekking; of

      b. een Nederlandse socialeverzekeringsuitkering ontvangt.

      2 De volkenrechtelijke organisaties, bedoeld in het eerste lid, worden door Onze Ministers, in overeenstemming met
      Onze Minister van Buitenlandse Zaken, aangewezen.

      3 De in Nederland wonende echtgenoot, kinderen en overige inwonende gezinsleden van de persoon, bedoeld in
      het eerste lid, zijn niet verzekerd op grond van de volksverzekeringen, indien de zetelovereenkomst tussen het
      Koninkrijk der Nederlanden en de volkenrechtelijke organisatie zulks bepaalt, tenzij zij:

      a. in Nederland arbeid verrichten; of

      b. een Nederlandse socialeverzekeringsuitkering ontvangen.

      4 De echtgenoot, kinderen en overige inwonende gezinsleden die op grond van het derde lid niet zijn verzekerd,
      blijven van de verzekering op grond van de volksverzekeringen uitgesloten gedurende de periode van een jaar, te
      rekenen vanaf de datum van overlijden van de persoon, bedoeld in het eerste lid, tenzij zij:

      a. in Nederland arbeid verrichten; of

      b. een Nederlandse socialeverzekeringsuitkering ontvangen.
    url: https://wetten.overheid.nl/BWBR0010182/2011-03-15#Artikel14
  - number: '15'
    text: |-
      1 Niet verzekerd op grond van de volksverzekeringen is:

      a. de gevolmachtigde Minister van Aruba, de gevolmachtigde Minister van Curaçao en de gevolmachtigde Minister van
      Sint Maarten;

      b. de persoon die als ambtenaar is toegevoegd aan één van de in onderdeel a bedoelde personen en die ten tijde van
      aanwerving niet in Nederland woonde; of

      c. de persoon die als ambtenaar van Aruba, Curaçao, Sint Maarten of de openbare lichamen Bonaire, Sint Eustatius
      of Saba of een publiekrechtelijke rechtspersoon van een van de drie landen of openbare lichamen in Nederland
      een studieopdracht vervult en die ten tijde van aanwerving niet in Nederland woonde, tenzij hij: 1o. in
      Nederland arbeid verricht anders dan uit hoofde van de vorenbedoelde dienstbetrekking; of 2o. een Nederlandse
      socialeverzekeringsuitkering ontvangt.

      2 De in Nederland wonende echtgenoot, kinderen en overige inwonende gezinsleden van een persoon als bedoeld in het
      eerste lid, zijn niet verzekerd op grond van de volksverzekeringen, tenzij zij:

      a. in Nederland arbeid verrichten; of

      b. een Nederlandse socialeverzekeringsuitkering ontvangen.

      3 De echtgenoot, kinderen en overige inwonende gezinsleden die op grond van het tweede lid niet verzekerd zijn,
      blijven van de verzekering op grond van de volksverzekeringen uitgesloten gedurende de periode van een jaar, te
      rekenen vanaf de datum van overlijden van de persoon, bedoeld in het eerste lid, tenzij zij:

      a. in Nederland arbeid verrichten; of

      b. een Nederlandse sociale verzekeringsuitkering ontvangen.
    url: https://wetten.overheid.nl/BWBR0010182/2011-03-15#Artikel15
  - number: '16'
    text: |-
      1 Niet verzekerd op grond van de volksverzekeringen is de persoon, voor zover niet reeds begrepen onder
      [artikel 13][ref1], die arbeid verricht uit hoofde van een dienstbetrekking met een buitenlandse publiekrechtelijke
      rechtspersoon, tenzij hij:

      a. in Nederland arbeid verricht anders dan uit hoofde van die dienstbetrekking; of

      b. een Nederlandse socialeverzekeringsuitkering ontvangt.

      2 Niet verzekerd op grond van de volksverzekeringen zijn de echtgenoot, kinderen en overige inwonende gezinsleden
      van een persoon als bedoeld in het eerste lid, tenzij zij:

      a. in Nederland arbeid verrichten; of

      b. een Nederlandse sociale verzekeringsuitkering ontvangen.

      3 De echtgenoot, kinderen en overige inwonende gezinsleden die op grond van het tweede lid niet verzekerd zijn,
      blijven van de verzekering op grond van de volksverzekeringen uitgesloten gedurende de periode van een jaar, te
      rekenen vanaf de datum van overlijden van de persoon, bedoeld in het eerste lid, tenzij zij:

      a. in Nederland arbeid verrichten; of

      b. een Nederlandse socialeverzekeringsuitkering ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0010182#Artikel13
