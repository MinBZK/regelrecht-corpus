  - number: '21'
    text: |-
      1 Niet verzekerd op grond van de [Algemene Wet Bijzondere Ziektekosten][ref1] is de persoon die in Nederland woont,
      doch die met toepassing van een verordening van de Raad van de Europese Gemeenschappen of van een door Nederland
      met een of meer andere staten gesloten verdrag inzake sociale zekerheid, in Nederland recht kan doen gelden op
      verstrekkingen die hem in beginsel worden verleend ten laste van een andere lidstaat van de Europese Unie dan wel
      een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of een staat waarmee
      Nederland een verdrag inzake sociale zekerheid heeft gesloten.

      2 Niet verzekerd op grond van de [Algemene Wet Bijzondere Ziektekosten][ref2] is de persoon die in
      Nederland woont en die recht heeft op een uitkering of pensioen ingevolge een regeling van een op grond van
      [artikel 3, eerste lid, onder d][ref3], dan wel [artikel 14, tweede lid][ref4], aangewezen volkenrechtelijke
      organisatie, indien hij op grond van een regeling van die organisatie in Nederland aanspraak heeft op zorg, of
      op vergoeding voor de kosten daarvan, tenzij hij in Nederland arbeid verricht. De aanspraak, bedoeld in de vorige
      volzin, omvat in ieder geval opname en verpleging in ziekenhuizen en in instellingen voor langdurige verpleging
      en verzorging.

      3 De in Nederland wonende echtgenoot, kinderen en inwonende overige gezinsleden van de in het tweede lid bedoelde
      persoon, zijn eveneens niet verzekerd op grond van de [Algemene Wet Bijzondere Ziektekosten][ref5] indien zij
      ingevolge een regeling van de desbetreffende volkenrechtelijke organisatie in Nederland aanspraak hebben op zorg,
      of op vergoeding voor de kosten daarvan. De aanspraak, bedoeld in de vorige volzin, omvat in ieder geval opname en
      verpleging in ziekenhuizen en in instellingen voor langdurige verpleging en verzorging.

      4 De echtgenoot, de kinderen en inwonende overige gezinsleden die op grond van het derde lid niet verzekerd zijn
      op grond van de [Algemene Wet Bijzondere Ziektekosten][ref6], blijven van de verzekering op grond van die wet
      uitgesloten vanaf de datum van overlijden van de persoon die als niet verzekerd werd aangemerkt op grond van het
      tweede lid, zolang voornoemde aanspraak op zorg, of op vergoeding voor de kosten daarvan, bestaat.

      5 Het derde en vierde lid zijn niet van toepassing op personen die in Nederland arbeid verrichten of die een
      Nederlandse socialeverzekeringsuitkering ontvangen.

      6 De Sociale verzekeringsbank geeft op aanvraag van de persoon, bedoeld in het eerste, tweede, derde of vierde lid,
      een verklaring af dat hij niet verzekerd is.


