  - number: '11'
    text: |-
      1 Verzekerd op grond van de volksverzekeringen is de vreemdeling die rechtmatig in Nederland verblijf houdt in de
      zin van [artikel 8, onder f tot en met k, van de Vreemdelingenwet 2000][ref1] indien hij in overeenstemming met de
      [Wet arbeid vreemdelingen][ref2] arbeid in dienstbetrekking verricht uit hoofde waarvan hij aan de loonbelasting
      is onderworpen.

      2 De vreemdeling, bedoeld in het eerste lid, blijft verzekerd op grond van de volksverzekeringen indien hij
      uit hoofde van het verrichten van arbeid als bedoeld in het eerste lid recht heeft op betaling van loon als
      bedoeld in [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref3] of recht heeft op een uitkering op grond
      van de [Ziektewet][ref4], de [Werkloosheidswet][ref5] of de [Wet op de arbeidsongeschiktheidsverzekering][ref6],
      alsmede indien de arbeid, bedoeld in het eerste lid, tijdelijk is onderbroken als gevolg van verlof, staking of
      uitsluiting.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
