  - number: 21b
    text: |-
      1 Voorzover de in Nederland wonende echtgenoot, kinderen en overige inwonende gezinsleden van
      de persoon, bedoeld in [artikel 14, eerste lid][ref1], niet van de verzekering op grond van de
      [Algemene Wet Bijzondere Ziektekosten][ref2] zijn uitgesloten op grond van de [artikelen 14, derde lid][ref3],
      [21][ref4] of [21a][ref5], wordt, op aanvraag, door de Sociale verzekeringsbank een ontheffing
      verleend van de verzekering op grond van zowel de [Algemene Wet Bijzondere Ziektekosten][ref6] als de
      [Algemene Ouderdomswet][ref7], de [Algemene nabestaandenwet][ref8] en de [Algemene Kinderbijslagwet][ref9],
      indien de echtgenoot, kinderen en overige inwonende gezinsleden op grond van een regeling van een op grond van
      [artikel 14, tweede lid][ref10], aangewezen volkenrechtelijke organisatie, aanspraken hebben op zorg, waaronder in
      ieder geval opname en verpleging in ziekenhuizen en in instellingen voor langdurige verpleging en verzorging, of op
      vergoeding voor de kosten daarvan.

      2 Het eerste lid is niet van toepassing op de echtgenoot, kinderen en overige inwonende gezinsleden die in
      Nederland arbeid verrichten of een Nederlandse sociale verzekeringsuitkering ontvangen, anders dan de in
      [artikel 21a][ref11] bedoelde uitkering.

      3 De Sociale verzekeringsbank verleent de ontheffing indien en voor zolang wordt voldaan aan de in het eerste en
      tweede lid gestelde voorwaarden.

      4 Indien de aanvraag voor de ontheffing wordt ingediend binnen vier maanden nadat een persoon voor het eerst is
      gaan voldoen aan de in het eerste en tweede lid gestelde voorwaarden, gaat de ontheffing in met ingang van de dag
      waarop aan deze voorwaarden wordt voldaan.

      5 Indien de aanvraag voor de ontheffing niet binnen de in het vierde lid genoemde periode wordt ingediend, gaat de
      ontheffing in op de eerste dag van de maand volgende op de dag waarop de aanvraag door de Sociale verzekeringsbank
      is ontvangen, indien op die eerste dag aan de in het eerste en tweede lid gestelde voorwaarden wordt voldaan.

      6 De echtgenoot, kinderen en overige inwonende gezinsleden die op grond van het eerste lid zijn ontheven,
      blijven ontheven van de verzekering op grond van zowel de [Algemene Wet Bijzondere Ziektekosten][ref12] als de
      [Algemene Ouderdomswet][ref13], de [Algemene nabestaandenwet][ref14] en de [Algemene Kinderbijslagwet][ref15],
      gedurende de periode van een jaar, te rekenen vanaf de datum van overlijden van de persoon, bedoeld in
      [artikel 14, eerste lid][ref16], tenzij zij in Nederland arbeid verrichten.


