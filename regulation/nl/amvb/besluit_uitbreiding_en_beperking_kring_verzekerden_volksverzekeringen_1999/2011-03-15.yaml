    text: |-
      1 Verzekerd op grond van de volksverzekeringen is de niet in Nederland wonende Nederlander, voor zover niet reeds
      begrepen onder [artikel 2][ref1], die uit hoofde van een dienstbetrekking met een Nederlandse publiekrechtelijke
      rechtspersoon buiten Nederland arbeid verricht ten behoeve van die rechtspersoon, tenzij hij:

      a. ten tijde van aanwerving niet in Nederland woonde;

      b. buiten Nederland arbeid verricht anders dan uit hoofde van de vorenbedoelde dienstbetrekking;

      c. een uitkering ontvangt op grond van een buitenlandse wettelijke regeling inzake sociale zekerheid; of

      d. werkzaam is bij een door Onze Ministers en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties aan
      te wijzen volkenrechtelijke organisatie en op hem een regeling inzake sociale zekerheid van die organisatie van
      toepassing is.

      2 In afwijking van het eerste lid, onderdeel b, is verzekerd op grond van de volksverzekeringen de Nederlander die
      in dienst is van een publiekrechtelijke rechtspersoon in Aruba, Curaçao, Sint Maarten of in de openbare lichamen
      Bonaire, Sint Eustatius of Saba mits hij door de Nederlandse overheid is uitgezonden.

      3 Verzekerd op grond van de volksverzekeringen zijn de echtgenoot, kinderen en overige inwonende gezinsleden van de
      verzekerde, bedoeld in het eerste en tweede lid, tenzij het gezinslid:

      a. buiten Nederland arbeid verricht en de inkomsten uit deze arbeid meer bedragen dan het bedrag, genoemd in
      [artikel 8.14, eerste lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref2]; of

      b. een uitkering ontvangt op grond van een buitenlandse wettelijke regeling inzake sociale zekerheid.

      4 De echtgenoot, kinderen en overige inwonende gezinsleden die op grond van het derde lid zijn verzekerd, blijven
      verzekerd op grond van de volksverzekeringen gedurende de periode van een jaar, te rekenen vanaf de datum van
      overlijden van de verzekerde, bedoeld in het eerste en tweede lid, tenzij het gezinslid:

      a. buiten Nederland arbeid verricht en de inkomsten uit deze arbeid meer bedragen dan het bedrag, genoemd in
      [artikel 8.14, eerste lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref3]; of

      b. een uitkering ontvangt op grond van een buitenlandse wettelijke regeling inzake sociale zekerheid.


      [ref1]: https://wetten.overheid.nl/BWBR0010182#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel8.14
