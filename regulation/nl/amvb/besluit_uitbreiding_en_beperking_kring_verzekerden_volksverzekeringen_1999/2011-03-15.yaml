  - number: '22'
    text: |-
      1 De persoon die in Nederland woont en die recht heeft op een uitkering op grond van een buitenlandse
      wettelijke of bovenwettelijke regeling inzake sociale zekerheid of op grond van een regeling van een
      volkenrechtelijke organisatie wordt op zijn aanvraag, voor zolang hij geen arbeid in Nederland verricht,
      door de Sociale verzekeringsbank van de verzekering op grond van de [Algemene Ouderdomswet][ref1], de
      [Algemene nabestaandenwet][ref2] en de [Algemene Kinderbijslagwet][ref3] ontheven, zolang hij:

      a. duurzaam recht heeft op uitsluitend een uitkering als bedoeld in de
      aanhef en deze uitkering per maand ten minste gelijk is aan 70% van het in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref4] bedoelde bedrag; of

      b. naast een uitkering als bedoeld in onderdeel a, recht heeft op een Nederlandse socialeverzekeringsuitkering
      en het totaal van deze uitkering en de buitenlandse wettelijke of bovenwettelijke uitkering of de
      uitkering van de volkenrechtelijke organisatie per maand ten minste gelijk is aan 70% van het in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref5] bedoelde bedrag en
      de buitenlandse uitkering of de uitkering van de volkenrechtelijke organisatie groter is dan of gelijk is aan de
      Nederlandse uitkering.

      2 Indien de aanvraag voor de ontheffing wordt ingediend binnen een jaar na de datum waarop de persoon, bedoeld in
      het eerste lid, voor het eerst voldoet aan de in dat lid opgenomen voorwaarden, gaat de ontheffing in op die datum.
      Indien de aanvraag voor de ontheffing later wordt ingediend, gaat de ontheffing in op de datum van de aanvraag
      om ontheffing.

      3 De Sociale verzekeringsbank kan de ontheffing, bedoeld in het eerste lid, verlenen met ingang van een datum
      die gelegen is ten hoogste drie jaar vóór de datum van de aanvraag, doch niet eerder dan de datum waarop recht
      is ontstaan op de buitenlandse wettelijke of bovenwettelijke uitkering of de uitkering van de volkenrechtelijke
      organisatie, indien toepassing van het tweede lid leidt tot onbillijkheden van overwegende aard.

      4 Voor de toepassing van dit artikel wordt met een uitkering op grond van een buitenlandse wettelijke of
      bovenwettelijke regeling inzake sociale zekerheid gelijkgesteld een vergelijkbare buitenlandse uitkering krachtens
      een bijzondere regeling voor ambtenaren en wordt met een Nederlandse socialeverzekeringsuitkering gelijkgesteld een
      vergelijkbare Nederlandse uitkering krachtens een bijzondere regeling voor ambtenaren.

      5 Voor de toepassing van dit artikel wordt een uitkering op grond van een wettelijke of bovenwettelijke regeling
      inzake sociale zekerheid van Aruba, Curaçao, Sint Maarten of van Nederland ten behoeve van de openbare lichamen
      Bonaire, Sint Eustatius en Saba aangemerkt als een uitkering op grond van een buitenlandse regeling.

      6 Het tweede lid, eerste zin, en het derde lid, zijn niet van toepassing indien de persoon bedoeld in het
      eerste lid, binnen de in die leden genoemde periode van een jaar respectievelijk ten hoogste drie jaar,
      een uitkering op grond van de [Algemene nabestaandenwet][ref6] dan wel kinderbijslag op grond van de
      [Algemene Kinderbijslagwet][ref7] heeft ontvangen.


