  - number: 21a
    text: |-
      1 In afwijking van [artikel 14, derde lid, aanhef en onderdeel b][ref1], is niet verzekerd op grond van
      de [Algemene Wet Bijzondere Ziektekosten][ref2] de persoon die op grond van een regeling van de in dat lid
      bedoelde organisatie aanspraken heeft op zorg, waaronder in ieder geval opname en verpleging in ziekenhuizen
      en in instellingen voor langdurige verpleging en verzorging, of op vergoeding voor de kosten daarvan, die een
      ouderdomspensioen op grond van de [Algemene Ouderdomswet][ref3] ontvangt en aan wie de Sociale verzekeringsbank op
      zijn verzoek een ontheffing van de verzekering op grond van de [Algemene Wet Bijzondere Ziektekosten][ref4] heeft
      verleend, tenzij hij in Nederland arbeid verricht.

      2 [Artikel 21, vijfde lid][ref5], is niet van toepassing op de persoon die een ouderdomspensioen op grond van de
      [Algemene Ouderdomswet][ref6] ontvangt en aan wie de Sociale verzekeringsbank op zijn verzoek een ontheffing van
      de verzekering op grond van de [Algemene Wet Bijzondere Ziektekosten][ref7] heeft verleend, tenzij hij in Nederland
      arbeid verricht.

      3 De Sociale verzekeringsbank verleent de ontheffing indien en voor zolang wordt voldaan aan de in het eerste lid
      en aan de in [artikel 21, derde en vierde lid][ref8], gestelde voorwaarden.

      4 Indien de aanvraag wordt ingediend binnen vier maanden nadat een persoon voor het eerst is gaan voldoen aan de
      in het eerste lid genoemde voorwaarde, gaat de ontheffing in met ingang van de dag waarop aan deze voorwaarde wordt
      voldaan. Indien de aanvraag voor de ontheffing later wordt ingediend, gaat de ontheffing in op de datum van de
      aanvraag om ontheffing.


