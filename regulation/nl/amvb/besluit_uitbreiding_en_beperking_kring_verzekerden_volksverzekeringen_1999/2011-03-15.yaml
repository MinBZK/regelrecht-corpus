  - number: '25'
    text: |-
      1 De persoon, die niet in Nederland woont, en van wie de verzekering op grond van de
      [Algemene Wet Bijzondere Ziektekosten][ref1] uitsluitend wegens de inwerkingtreding van enig artikel van dit
      besluit dan wel wegens het vervallen van [artikel 26][ref2] is geëindigd, heeft niettemin met overeenkomstige
      toepassing van [artikel 20, eerste lid, onderdeel b, en derde lid, van het Besluit zorgaanspraken AWBZ][ref3],
      recht op uitkeringen ten laste van het Algemeen Fonds Bijzondere Ziektekosten, bedoeld in de
      [Wet financiering sociale verzekeringen][ref4], ter zake van de kosten van verblijf en voortgezet
      verblijf als bedoeld in de [artikelen 9][ref5] en [13 van het Besluit zorgaanspraken AWBZ][ref6],
      voor zover die zorg op de dag voorafgaande aan de inwerkingtreding van enig
      artikel van dit besluit dan wel aan het vervallen van [artikel 26][ref7] ingevolge
      [artikel 20, eerste lid, onderdeel b, en derde lid, van het Besluit zorgaanspraken AWBZ][ref8], voor rekening
      van het Algemeen Fonds Bijzondere Ziektekosten werd verleend en op een tijdstip gelegen uiterlijk op die dag was
      aangevangen maar nog niet voltooid.

      2 De belanghebbende die op grond van het eerste lid zijn aanspraak tot gelding wil brengen meldt zich daartoe
      binnen een termijn van vier maanden na de inwerkingtreding van enig artikel van dit besluit dan wel vier maanden
      na het vervallen van [artikel 26][ref9] aan bij de zorgverzekeraar. waarbij hij op de dag voorafgaande aan de
      inwerkingtreding van enig artikel van dit besluit dan wel het vervallen van [artikel 26][ref10] als verzekerde op
      grond van de [Algemene Wet Bijzondere Ziektekosten][ref11] was ingeschreven. Indien de belanghebbende op de dag
      voorafgaande aan de inwerkingtreding van enig artikel van dit besluit dan wel het vervallen van [artikel 26][ref12]
      nog niet was ingeschreven, dan wel diens inschrijving in de periode gelegen tussen die dag en de dag van aanmelding
      als belanghebbende is komen te vervallen, meldt hij zich binnen een termijn van vier maanden om zijn aanspraak tot
      gelding te brengen een zorgverzekeraar naar eigen keuze.

      3 De belanghebbende die zich niet binnen de in het tweede lid bedoelde termijn als zodanig heeft aangemeld,
      wordt geacht aan die termijn te hebben voldaan, indien hij naar het oordeel van de instelling, bedoeld in het
      tweede lid, genoegzaam aantoont dat hij zich heeft aangemeld binnen een termijn van vier maanden na de dag
      waarop hij redelijkerwijs van de inwerkingtreding van enig artikel van dit besluit dan wel het vervallen van
      [artikel 26][ref13] kennis heeft kunnen nemen.


