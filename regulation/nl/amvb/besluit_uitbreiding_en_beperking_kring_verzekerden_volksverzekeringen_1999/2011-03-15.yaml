  - number: '23'
    text: |-
      De vreemdeling die rechtmatig in Nederland verblijf houdt in de zin van
      [artikel 8, onder a tot en met e, of l, van de Vreemdelingenwet 2000][ref1], is niet op grond van het verrichten
      van arbeid, uit hoofde waarvan hij aan de loonbelasting is onderworpen, verzekerd voor de volksverzekeringen,
      indien hij voor een werkgever arbeid verricht, zonder dat aan de [Wet arbeid vreemdelingen][ref2] is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007149
