articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. de volksverzekeringen: de [Algemene Ouderdomswet][ref1], de [Algemene nabestaandenwet][ref2], de
      [Algemene Kinderbijslagwet][ref3] en de [Algemene Wet Bijzondere Ziektekosten][ref4];

      b. kind: het eigen kind, het aangehuwde kind, of het pleegkind, bedoeld in
      [artikel 7 van de Algemene Kinderbijslagwet][ref5], jonger dan 27 jaar, dat in belangrijke mate door de ouders
      wordt onderhouden;

      c. Onze Ministers: Onze Minister van Sociale Zaken en Werkgelegenheid en Onze Minister van Volksgezondheid, Welzijn
      en Sport;

      d. arbeid: arbeid verricht in het economisch verkeer en gericht op het verwerven van inkomen;

      e. Nederlandse socialeverzekeringsuitkering: een uitkering op grond van de [Werkloosheidswet][ref6],
      de [Ziektewet][ref7], [hoofdstuk 3, afdeling 2, van de Wet arbeid en zorg][ref8], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref9], de [Wet werk en inkomen naar arbeidsvermogen][ref10],
      de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref11], de [Algemene Ouderdomswet][ref12], de
      [Algemene nabestaandenwet][ref13] en de [Algemene Kinderbijslagwet][ref14].


