  - number: '24'
    text: |-
      1 De Sociale verzekeringsbank kan, met uitzondering van [artikel 22, derde lid][ref1], artikelen van dit besluit
      buiten toepassing laten of daarvan afwijken voor zover toepassing gelet op het belang van de uitbreiding en
      beperking van de kring van verzekerden zal leiden tot een onbillijkheid van overwegende aard, die uitsluitend
      voortvloeit uit de verzekeringsplicht of de uitsluiting daarvan krachtens dit besluit.

      2 Van een besluit van de Sociale verzekeringsbank op grond van het eerste lid, wordt mededeling gedaan in de
      Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0010182#Artikel22
