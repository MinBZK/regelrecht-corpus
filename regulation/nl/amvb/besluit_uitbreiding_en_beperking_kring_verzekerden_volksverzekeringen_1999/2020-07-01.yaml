  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid, J.F. Hoogervorst, van 20 november
    1998 SV/GSV/98/35098 mede namens Onze Minister van Volksgezondheid, Welzijn en Sport;

    Gelet op artikel 6, derde lid, van de Algemene Ouderdomswet, artikel 13, derde lid, van de Algemene
    nabestaandenwet, artikel 6, derde lid, van de Algemene Kinderbijslagwet en artikel 5, derde en vierde lid, van de
    Algemene Wet Bijzondere Ziektekosten;

    De Raad van State gehoord (advies van 17 december 1998, nr W12.98.0549);

