        artikel: '5'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0010182
        artikel: '6'
        paragraaf: '2'
  - number: '8.2'
    text: |-
      Verzekerd op grond van de volksverzekeringen blijft de persoon die aansluitend op het wonen in
      Nederland, uitsluitend omdat hij wordt verpleegd in een door Onze Minister van Volksgezondheid,
      Welzijn en Sport aan te wijzen instelling, die overeenkomt met een instelling als bedoeld in
      [artikel 1, eerste lid, onderdeel f, van de Wet toelating zorginstellingen][ref1] die zorg levert waarop aanspraak
      bestaat ingevolge de [Wet langdurige zorg][ref2], niet meer in Nederland woont.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0035917
  - number: '9'
    text: |-
      Verzekerd op grond van de volksverzekeringen is de persoon die niet in Nederland woont en die belastbare winst uit
      Nederlandse onderneming als bedoeld in [afdeling 7.2 van de Wet inkomstenbelasting 2001][ref1] geniet, mits hij in
      Nederland arbeid verricht voor die onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Afdeling7.2
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011353
        afdeling: '7.2'
  - number: 9a
    text: |-
      Een vreemdeling die rechtmatig in Nederland verblijft, in de zin van [artikel 8, onder c, van de Vreemdelingenwet
      2000](onbekend), is, ongeacht of hij als ingezetene kan worden beschouwd, niet eerder verzekerd op grond van de
      volksverzekeringen dan met ingang van de dag waarop positief op de verblijfsvergunningsaanvraag wordt beschikt.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel9a
  - number: '10.1'
    text: |-
      Verzekerd op grond van de volksverzekeringen is de in Nederland wonende vreemdeling
      die na rechtmatig in Nederland verblijf te hebben gehouden in de zin van
      [artikel 8, onder a tot en met e, of l, van de Vreemdelingenwet 2000][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 10.1.a
    text: voor de beëindiging van dit verblijf een aanvraag heeft ingediend om voortgezette toelating; of
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel10
  - number: 10.1.b
    text: |-
      binnen de termijn, genoemd in [artikel 69, eerste lid, van de Vreemdelingenwet 2000][ref1], of, buiten
      die termijn, ingeval [artikel 6.11 van de Algemene wet bestuursrecht](onbekend) toepassing heeft
      gevonden, bezwaar heeft gemaakt of beroep heeft ingesteld tegen intrekking van de toelating in de zin van
      [artikel 8, onder a tot en met e, of l, van de Vreemdelingenwet 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '69'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '10.2'
    text: 'De verzekering op grond van het eerste lid eindigt zodra:'
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel10
  - number: 10.2.a
    text: onherroepelijk op de aanvraag, het bezwaar of het beroep is beslist; of
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel10
  - number: 10.2.b
    text: |-
      de uitzetting van de vreemdeling is gelast, tenzij die uitzetting op grond van de [Vreemdelingenwet 2000][ref1] of
      op grond van een rechterlijke beslissing achterwege dient te blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: '11.1'
    text: |-
      Verzekerd op grond van de volksverzekeringen is de vreemdeling die rechtmatig in Nederland verblijf houdt in de zin
      van [artikel 8, onder f tot en met k, van de Vreemdelingenwet 2000][ref1] indien hij:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 11.1.a
    text: |-
      in Nederland, met uitzondering van het continentaal plat, in overeenstemming met de
      [Wet arbeid vreemdelingen][ref1] arbeid in dienstbetrekking verricht uit hoofde waarvan hij aan de loonbelasting
      is onderworpen;


      [ref1]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007149
  - number: 11.1.b
    text: |-
      op het continentaal plat arbeid in dienstbetrekking verricht uit hoofde waarvan hij aan de loonbelasting is
      onderworpen.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel11
  - number: '11.2'
    text: |-
      De vreemdeling, bedoeld in het eerste lid, blijft verzekerd op grond van de volksverzekeringen indien hij
      uit hoofde van het verrichten van arbeid als bedoeld in het eerste lid recht heeft op betaling van loon als
      bedoeld in [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref1] of recht heeft op een uitkering op grond
      van de [Ziektewet][ref2], de [Werkloosheidswet][ref3], de [Wet op de arbeidsongeschiktheidsverzekering][ref4],
      de [Wet werk en inkomen naar arbeidsvermogen][ref5], de [Wet arbeid en zorg][ref6] of de
      [Wet inkomensvoorziening oudere werklozen][ref7], alsmede indien de arbeid, bedoeld in het eerste lid, tijdelijk is
      onderbroken als gevolg van verlof, staking of uitsluiting.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0004045
      [ref4]: https://wetten.overheid.nl/BWBR0002524
      [ref5]: https://wetten.overheid.nl/BWBR0019057
      [ref6]: https://wetten.overheid.nl/BWBR0013008
      [ref7]: https://wetten.overheid.nl/BWBR0024394
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0004045
      - id: ref4
        bwb_id: BWBR0002524
      - id: ref5
        bwb_id: BWBR0019057
      - id: ref6
        bwb_id: BWBR0013008
      - id: ref7
        bwb_id: BWBR0024394
  - number: 11a.1
    text: |-
      Onverminderd de [artikelen 2][ref1] en [3][ref2] is verzekerd op grond van de volksverzekeringen de persoon die:


      [ref1]: https://wetten.overheid.nl/BWBR0010182#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010182#Artikel3
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0010182
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0010182
        artikel: '3'
        paragraaf: '2'
  - number: 11a.1.a
    text: |-
      de nationaliteit heeft van een van de lidstaten van de Europese Unie, een staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte of Zwitserland,
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel11a
  - number: 11a.1.b
    text: |-
      woont buiten Nederland in een andere lidstaat van de Europese Unie, een staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte, of Zwitserland,
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel11a
  - number: 11a.1.c
    text: een dienstbetrekking heeft met een in Nederland wonende of gevestigde werkgever, en
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel11a
  - number: 11a.1.d
    text: 'arbeid verricht voor de werkgever, bedoeld in onderdeel c, en werkzaam is buiten:'
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel11a
  - number: 11a.1.d.1
    text: Nederland of een andere lidstaat van de Europese Unie;
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel11a
  - number: 11a.1.d.2
    text: een staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, of
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel11a
  - number: 11a.1.d.3
    text: Zwitserland.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel11a
  - number: 11a.2
    text: 'Verzekerd op grond van de volksverzekeringen is de persoon die:'
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel11a
  - number: 11a.2.a
    text: niet beschikt over de nationaliteit, bedoeld in het eerste lid, onderdeel a,
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel11a
  - number: 11a.2.b
    text: |-
      die buiten Nederland rechtmatig op het grondgebied verblijft van een andere lidstaat van de Europese Unie,
      uitgezonderd Denemarken,
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel11a
  - number: 11a.2.c
    text: een dienstbetrekking heeft met een in Nederland wonende of gevestigde werkgever, en
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel11a
  - number: 11a.2.d
    text: 'arbeid verricht voor de werkgever, bedoeld in onderdeel c, en werkzaam is buiten:'
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel11a
  - number: 11a.2.d.1
    text: Nederland of een andere lidstaat van de Europese Unie;
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel11a
  - number: 11a.2.d.2
    text: een staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, of
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel11a
  - number: 11a.2.d.3
    text: Zwitserland.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel11a
  - number: '12.1'
    text: |-
      Niet verzekerd op grond van de volksverzekeringen is de persoon die in Nederland woont en die gedurende een
      aaneengesloten periode van ten minste drie maanden uitsluitend buiten Nederland arbeid verricht, tenzij die
      arbeid uitsluitend wordt verricht uit hoofde van een dienstbetrekking met een in Nederland wonende of gevestigde
      werkgever.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel12
  - number: '12.2'
    text: |-
      Voor de vaststelling van de periode van drie maanden, bedoeld in het eerste lid, worden perioden gedurende welke de
      arbeid buiten Nederland tijdelijk wordt onderbroken:
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel12
  - number: 12.2.a
    text: wegens ziekte, gebreken, zwangerschap, bevalling of werkloosheid; of
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel12
  - number: 12.2.b
    text: |-
      wegens verlof, staking of uitsluiting; beschouwd als perioden waarin uitsluitend buiten Nederland arbeid wordt
      verricht, tenzij tijdens deze perioden arbeid in Nederland wordt verricht.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel12
  - number: '13.1'
    text: |-
      Niet verzekerd op grond van de volksverzekeringen zijn de diplomatieke ambtenaar en de consulaire ambtenaar, niet
      zijnde honorair consul, van een andere mogendheid, tenzij zij:
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel13
  - number: 13.1.a
    text: in Nederland arbeid verrichten anders dan uit hoofde van de vorenbedoelde dienstbetrekking; of
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel13
  - number: 13.1.b
    text: een Nederlandse socialeverzekeringsuitkering ontvangen.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel13
  - number: '13.2'
    text: |-
      Niet verzekerd op grond van de volksverzekeringen zijn de naar Nederland uitgezonden leden van het administratieve,
      technische en bedienende personeel van de diplomatieke zending of de consulaire post van een andere mogendheid,
      indien zij korter dan tien jaar in Nederland werkzaam zijn, tenzij zij:
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel13
  - number: 13.2.a
    text: Nederlander zijn;
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel13
  - number: 13.2.b
    text: ten tijde van aanwerving in Nederland woonden;
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel13
  - number: 13.2.c
    text: in Nederland arbeid verrichten anders dan de werkzaamheden, bedoeld in de aanhef; of
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel13
  - number: 13.2.d
    text: een Nederlandse socialeverzekeringsuitkering ontvangen.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel13
  - number: '13.3'
    text: |-
      Niet verzekerd op grond van de volksverzekeringen zijn de leden van het administratieve, technische en bedienende
      personeel van de diplomatieke zending of de consulaire post van een andere mogendheid alsmede de particuliere
      bedienden die in dienst zijn van de ambtenaar, bedoeld in het eerste lid, of van de leden van het personeel,
      bedoeld in het tweede lid, indien zij reeds vóór 1 augustus 1987 als zodanig in dienst waren, en vanaf 1 augustus
      1987 als zodanig onafgebroken in dienst zijn, tenzij zij:
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel13
  - number: 13.3.a
    text: in Nederland arbeid verrichten anders dan de werkzaamheden, bedoeld in de aanhef; of
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel13
  - number: 13.3.b
    text: een Nederlandse socialeverzekeringsuitkering ontvangen.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel13
  - number: '13.4'
    text: |-
      Niet verzekerd op grond van de volksverzekeringen is de particuliere bediende die in dienst is van de ambtenaar,
      bedoeld in het eerste lid, of van de leden van het personeel, bedoeld in het tweede lid, indien hij korter dan
      tien jaar in Nederland werkzaam is en op hem het stelsel van sociale verzekering van een andere mogendheid van
      toepassing is, tenzij hij:
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel13
  - number: 13.4.a
    text: Nederlander is;
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel13
  - number: 13.4.b
    text: ten tijde van aanwerving in Nederland woonde;
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel13
  - number: 13.4.c
    text: in Nederland arbeid verricht anders dan uit hoofde van de vorenbedoelde dienstbetrekking; of
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel13
  - number: 13.4.d
    text: een Nederlandse socialeverzekeringsuitkering ontvangt.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel13
  - number: '13.5'
    text: |-
      De in Nederland wonende echtgenoot, kinderen en overige inwonende gezinsleden van de ambtenaar, bedoeld in het
      eerste lid, en van de personeelsleden, bedoeld in het tweede en derde lid, zijn niet verzekerd op grond van de
      volksverzekeringen, tenzij zij:
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel13
  - number: 13.5.a
    text: in Nederland arbeid verrichten;
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel13
  - number: 13.5.b
    text: een Nederlandse socialeverzekeringsuitkering ontvangen; of
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel13
  - number: 13.5.c
    text: indien die ambtenaar of die personeelsleden zijn verzekerd op grond van de volksverzekeringen.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel13
  - number: '13.6'
    text: |-
      De echtgenoot, kinderen en overige inwonende gezinsleden die op grond van het vijfde lid niet zijn verzekerd,
      blijven van de verzekering op grond van de volksverzekeringen uitgesloten gedurende de periode van een jaar, te
      rekenen vanaf de datum van overlijden van de persoon, bedoeld in het eerste of tweede lid, tenzij zij:
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel13
  - number: 13.6.a
    text: in Nederland arbeid verrichten; of
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel13
  - number: 13.6.b
    text: een Nederlandse socialeverzekeringsuitkering ontvangen.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel13
  - number: '14.1'
    text: |-
      Niet verzekerd op grond van de volksverzekeringen is de persoon die in dienst is van een volkenrechtelijke
      organisatie en op wie de regeling inzake sociale zekerheid van die organisatie van toepassing is, tenzij hij:
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel14
  - number: 14.1.a
    text: in Nederland arbeid verricht anders dan uit hoofde van de vorenbedoelde dienstbetrekking; of
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel14
  - number: 14.1.b
    text: een Nederlandse socialeverzekeringsuitkering ontvangt.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel14
  - number: '14.2'
    text: |-
      De volkenrechtelijke organisaties, bedoeld in het eerste lid, worden door Onze Ministers, in overeenstemming met
      Onze Minister van Buitenlandse Zaken, aangewezen.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel14
  - number: '14.3'
    text: |-
      De in Nederland wonende echtgenoot, kinderen en overige inwonende gezinsleden van de persoon, bedoeld in het eerste
      lid, zijn niet verzekerd op grond van de volksverzekeringen, indien de zetelovereenkomst tussen het Koninkrijk der
      Nederlanden en de volkenrechtelijke organisatie zulks bepaalt, tenzij zij:
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel14
  - number: 14.3.a
    text: in Nederland arbeid verrichten; of
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel14
  - number: 14.3.b
    text: een Nederlandse socialeverzekeringsuitkering ontvangen.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel14
  - number: '14.4'
    text: |-
      De echtgenoot, kinderen en overige inwonende gezinsleden die op grond van het derde lid niet zijn verzekerd,
      blijven van de verzekering op grond van de volksverzekeringen uitgesloten gedurende de periode van een jaar, te
      rekenen vanaf de datum van overlijden van de persoon, bedoeld in het eerste lid, tenzij zij:
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel14
  - number: 14.4.a
    text: in Nederland arbeid verrichten; of
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel14
  - number: 14.4.b
    text: een Nederlandse socialeverzekeringsuitkering ontvangen.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel14
  - number: '14.5'
    text: |-
      Niet verzekerd op grond van de volkverzekeringen is de particuliere bediende van de persoon, bedoeld in het
      eerste lid, die werkzaam is voor een in Nederland gevestigde volkenrechtelijke organisatie, indien hij korter dan
      tien jaar in Nederland werkzaam is en op hem het stelsel van sociale verzekering van een andere mogendheid van
      toepassing is, tenzij hij:
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel14
  - number: 14.5.a
    text: Nederlander is;
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel14
  - number: 14.5.b
    text: ten tijde van de aanwerving in Nederland woonde;
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel14
  - number: 14.5.c
    text: in Nederland arbeid verricht anders dan uit hoofde van vorenbedoelde dienstbetrekking, of
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel14
  - number: 14.5.d
    text: een Nederlandse socialeverzekeringsuitkering ontvangt.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel14
  - number: '15.1'
    text: 'Niet verzekerd op grond van de volksverzekeringen is:'
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel15
  - number: 15.1.a
    text: |-
      de gevolmachtigde Minister van Aruba, de gevolmachtigde Minister van Curaçao en de gevolmachtigde Minister van
      Sint Maarten;
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel15
  - number: 15.1.b
    text: |-
      de persoon die als ambtenaar is toegevoegd aan één van de in onderdeel a bedoelde personen en die ten tijde van
      aanwerving niet in Nederland woonde; of
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel15
  - number: 15.1.c
    text: |-
      de persoon die als ambtenaar van Aruba, Curaçao, Sint Maarten of de openbare lichamen Bonaire, Sint Eustatius
      of Saba of een publiekrechtelijke rechtspersoon van een van de drie landen of openbare lichamen in Nederland
      een studieopdracht vervult en die ten tijde van aanwerving niet in Nederland woonde, tenzij hij: 1o. in
      Nederland arbeid verricht anders dan uit hoofde van de vorenbedoelde dienstbetrekking; of 2o. een Nederlandse
      socialeverzekeringsuitkering ontvangt.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel15
  - number: '15.2'
    text: |-
      De in Nederland wonende echtgenoot, kinderen en overige inwonende gezinsleden van een persoon als bedoeld in het
      eerste lid, zijn niet verzekerd op grond van de volksverzekeringen, tenzij zij:
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel15
  - number: 15.2.a
    text: in Nederland arbeid verrichten; of
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel15
  - number: 15.2.b
    text: een Nederlandse socialeverzekeringsuitkering ontvangen.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel15
  - number: '15.3'
    text: |-
      De echtgenoot, kinderen en overige inwonende gezinsleden die op grond van het tweede lid niet verzekerd zijn,
      blijven van de verzekering op grond van de volksverzekeringen uitgesloten gedurende de periode van een jaar, te
      rekenen vanaf de datum van overlijden van de persoon, bedoeld in het eerste lid, tenzij zij:
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel15
  - number: 15.3.a
    text: in Nederland arbeid verrichten; of
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel15
  - number: 15.3.b
    text: een Nederlandse sociale verzekeringsuitkering ontvangen.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel15
  - number: '16.1'
    text: |-
      Niet verzekerd op grond van de volksverzekeringen is de persoon, voor zover niet reeds begrepen onder
      [artikel 13][ref1], die arbeid verricht uit hoofde van een dienstbetrekking met een buitenlandse publiekrechtelijke
      rechtspersoon, tenzij hij:


      [ref1]: https://wetten.overheid.nl/BWBR0010182#Artikel13
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0010182
        artikel: '13'
        paragraaf: '3'
  - number: 16.1.a
    text: in Nederland arbeid verricht anders dan uit hoofde van die dienstbetrekking; of
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel16
  - number: 16.1.b
    text: een Nederlandse socialeverzekeringsuitkering ontvangt.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel16
  - number: '16.2'
    text: |-
      Niet verzekerd op grond van de volksverzekeringen zijn de echtgenoot, kinderen en overige inwonende gezinsleden van
      een persoon als bedoeld in het eerste lid, tenzij zij:
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel16
  - number: 16.2.a
    text: in Nederland arbeid verrichten; of
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel16
  - number: 16.2.b
    text: een Nederlandse sociale verzekeringsuitkering ontvangen.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel16
  - number: '16.3'
    text: |-
      De echtgenoot, kinderen en overige inwonende gezinsleden die op grond van het tweede lid niet verzekerd zijn,
      blijven van de verzekering op grond van de volksverzekeringen uitgesloten gedurende de periode van een jaar, te
      rekenen vanaf de datum van overlijden van de persoon, bedoeld in het eerste lid, tenzij zij:
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel16
  - number: 16.3.a
    text: in Nederland arbeid verrichten; of
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel16
  - number: 16.3.b
    text: een Nederlandse socialeverzekeringsuitkering ontvangen.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel16
  - number: '17'
    text: |-
      Niet verzekerd op grond van de volksverzekeringen is de persoon die in Nederland woont en die behoort tot het
      rijdend, vliegend of op de binnenwateren varend personeel van een buiten Nederland wonende of gevestigde werkgever
      die internationaal vervoer verricht, tenzij hij:
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel17
  - number: 17.a
    text: in hoofdzaak in Nederland arbeid verricht; of
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel17
  - number: 17.b
    text: werkt bij een filiaal of een vaste vertegenwoordiging van die werkgever in Nederland.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel17
  - number: '18.1'
    text: |-
      De persoon die tijdelijk in Nederland verblijft, in dienstbetrekking werkzaam is van een in Nederland gevestigde
      buitenlandse instelling zonder winstoogmerk en op wie een buitenlandse wettelijke regeling inzake sociale zekerheid
      van toepassing blijft, wordt voor de duur van ten hoogste twee jaar op zijn aanvraag of op aanvraag van de
      werkgever door de Sociale verzekeringsbank van de verzekering op grond van de volksverzekeringen ontheven, tenzij
      hij:
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel18
  - number: 18.1.a
    text: in Nederland arbeid verricht anders dan uit hoofde van de vorenbedoelde dienstbetrekking; of
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel18
  - number: 18.1.b
    text: |-
      een Nederlandse socialeverzekeringsuitkering ontvangt. De periode van twee jaar, bedoeld in de eerste zin, kan op
      aanvraag telkens voor de duur van twee jaar worden verlengd.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel18
  - number: '18.2'
    text: |-
      Niet verzekerd op grond van de volksverzekeringen zijn de echtgenoot, kinderen en overige inwonende gezinsleden van
      een persoon die als niet verzekerd wordt aangemerkt op grond van het eerste lid, tenzij zij:
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel18
  - number: 18.2.a
    text: in Nederland arbeid verrichten; of
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel18
  - number: 18.2.b
    text: een Nederlandse socialeverzekeringsuitkering ontvangen.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel18
  - number: '18.3'
    text: |-
      De echtgenoot, kinderen en overige inwonende gezinsleden die op grond van het tweede lid niet verzekerd zijn,
      blijven van de verzekering op grond van de volksverzekeringen uitgesloten gedurende de periode van een jaar, te
      rekenen vanaf de datum van overlijden van de persoon die als niet verzekerd wordt aangemerkt op grond van het
      eerste lid, tenzij zij:
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel18
  - number: 18.3.a
    text: in Nederland arbeid verrichten; of
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel18
  - number: 18.3.b
    text: een Nederlandse socialeverzekeringsuitkering ontvangen.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel18
  - number: '19.1'
    text: |-
      Niet verzekerd op grond van de volksverzekeringen is de persoon die niet in Nederland woont en die in Nederland als
      musicus of anderszins als artiest voor korte duur arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel19
  - number: '19.2'
    text: |-
      Voor de toepassing van het eerste lid wordt met artiest gelijkgesteld degene, die als beroep een tak van sport
      beoefent.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel19
  - number: '20.1'
    text: 'Niet verzekerd op grond van de volksverzekeringen is de persoon die in Nederland verblijf houdt:'
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel20
  - number: 20.1.a
    text: |-
      op grond van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 14 van de Vreemdelingenwet 2000][ref1], die is verleend onder een beperking verband
      houdende met studie, tenzij hij in Nederland arbeid verricht dan wel arbeid heeft verricht gedurende
      een periode van zes maanden of langer en als werkzoekende staat geregistreerd als bedoeld in
      [artikel 30b, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30b
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30b
  - number: 20.1.b
    text: |-
      uitsluitend wegens studieredenen en vóór de aanvang van de studie woonachtig was in Aruba, Curaçao, Sint Maarten,
      Bonaire, Sint Eustatius of Saba.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel20
  - number: '20.2'
    text: 'Niet verzekerd op grond van de volksverzekeringen is de persoon die:'
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel20
  - number: 20.2.a
    text: |-
      een Bachelor of Master-graad heeft verkregen aan een geaccrediteerde opleiding, opgenomen in het Centraal register
      opleidingen hoger onderwijs, en
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel20
  - number: 20.2.b
    text: |-
      beschikt over een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 14 van de Vreemdelingenwet 2000][ref1] die verleend is onder een beperking verband houdend met het zoeken
      naar en verrichten van arbeid al dan niet in loondienst.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: '21.1'
    text: |-
      Niet verzekerd op grond van de [Wet langdurige zorg][ref1] is de persoon die in Nederland woont, doch die met
      toepassing van een verordening van de Raad van de Europese Gemeenschappen of van een door Nederland met een of meer
      andere staten gesloten verdrag inzake sociale zekerheid, in Nederland recht kan doen gelden op verstrekkingen die
      hem in beginsel worden verleend ten laste van een andere lidstaat van de Europese Unie dan wel een andere staat die
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of een staat waarmee Nederland een verdrag
      inzake sociale zekerheid heeft gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0035917
  - number: '21.2'
    text: |-
      Niet verzekerd op grond van de [Wet langdurige zorg][ref1] is de persoon die in Nederland woont en die recht heeft
      op een uitkering of pensioen ingevolge een regeling van een op grond van [artikel 3, eerste lid, onder d][ref2],
      dan wel [artikel 14, tweede lid][ref3], aangewezen volkenrechtelijke organisatie, indien hij op grond van een
      regeling van die organisatie in Nederland aanspraak heeft op zorg, of op vergoeding voor de kosten daarvan,
      tenzij hij in Nederland arbeid verricht. De aanspraak, bedoeld in de vorige volzin, omvat in ieder geval opname en
      verpleging in ziekenhuizen en in instellingen voor langdurige verpleging en verzorging.


      [ref1]: https://wetten.overheid.nl/BWBR0035917
      [ref2]: https://wetten.overheid.nl/BWBR0010182#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0010182#Artikel14
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0035917
      - id: ref2
        bwb_id: BWBR0010182
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0010182
        artikel: '14'
        paragraaf: '3'
  - number: '21.3'
    text: |-
      Indien het totale bedrag van de vergoedingen bedoeld in het tweede lid, ingevolge de regeling van de betreffende
      volkenrechtelijke organisatie is gemaximeerd, dient de omvang daarvan ten minste een door Onze Minister van
      Volksgezondheid, Welzijn en Sport vast te stellen minimum bedrag per persoon per jaar bedragen.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel21
  - number: '21.4'
    text: |-
      De in Nederland wonende echtgenoot, kinderen en overige inwonende gezinsleden van de in het tweede lid bedoelde
      persoon, zijn eveneens niet verzekerd op grond van de [Wet langdurige zorg][ref1] indien zij ingevolge een regeling
      van de desbetreffende volkenrechtelijke organisatie in Nederland aanspraak hebben op zorg of op vergoeding voor de
      kosten daarvan, mits wordt voldaan aan de voorwaarden bedoeld in het tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0035917
  - number: '21.5'
    text: |-
      De echtgenoot, de kinderen en overige inwonende gezinsleden die op grond van het derde lid niet verzekerd zijn
      op grond van de [Wet langdurige zorg][ref1], blijven van de verzekering op grond van die wet uitgesloten vanaf
      de datum van overlijden van de persoon die als niet verzekerd werd aangemerkt op grond van het tweede lid, zolang
      voornoemde aanspraak op zorg of op vergoeding van de kosten daarvan, mits wordt voldaan aan de voorwaarden bedoeld
      in het tweede en derde lid, bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0035917
  - number: '21.6'
    text: |-
      Het vierde en vijfde lid zijn niet van toepassing op personen die in Nederland arbeid verrichten of die een
      Nederlandse socialeverzekeringsuitkering ontvangen.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel21
  - number: '21.7'
    text: |-
      De Sociale verzekeringsbank geeft op aanvraag van de persoon, bedoeld in het eerste, tweede, vierde of vijfde lid,
      een verklaring af dat hij niet verzekerd is.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel21
  - number: 21a.1
    text: |-
      In afwijking van [artikel 14, derde lid, aanhef en onderdeel b][ref1], is niet verzekerd op grond van de
      [Wet langdurige zorg][ref2] de persoon die op grond van een regeling van de in dat lid bedoelde organisatie
      aanspraken heeft op zorg of vergoeding van de kosten daarvan, mits wordt voldaan aan de voorwaarden bedoeld in
      [artikel 21, tweede en derde lid][ref3], die een ouderdomspensioen op grond van de [Algemene Ouderdomswet][ref4]
      ontvangt en aan wie de Sociale verzekeringsbank op zijn verzoek een ontheffing van de verzekering op grond van de
      Wet langdurige zorg heeft verleend, tenzij hij in Nederland arbeid verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0010182#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0035917
      [ref3]: https://wetten.overheid.nl/BWBR0010182#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0010182
        artikel: '14'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0035917
      - id: ref3
        bwb_id: BWBR0010182
        artikel: '21'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0002221
  - number: 21a.2
    text: |-
      [Artikel 21, zesde lid][ref1], is niet van toepassing op de persoon die een ouderdomspensioen op grond van de
      [Algemene Ouderdomswet][ref2] ontvangt en aan wie de Sociale verzekeringsbank op zijn verzoek een ontheffing van de
      verzekering op grond van de [Wet langdurige zorg][ref3] heeft verleend, tenzij hij in Nederland arbeid verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0010182#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002221
      [ref3]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0010182
        artikel: '21'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002221
      - id: ref3
        bwb_id: BWBR0035917
  - number: 21a.3
    text: |-
      De Sociale verzekeringsbank verleent de ontheffing indien en voor zolang wordt voldaan aan de in het eerste lid
      gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel21a
  - number: 21a.4
    text: |-
      Indien de aanvraag wordt ingediend binnen vier maanden nadat een persoon voor het eerst is gaan voldoen aan de in
      het eerste lid genoemde voorwaarde, gaat de ontheffing in met ingang van de dag waarop aan deze voorwaarde wordt
      voldaan. Indien de aanvraag voor de ontheffing later wordt ingediend, gaat de ontheffing in op de datum van de
      aanvraag om ontheffing.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel21a
  - number: 21b.1
    text: |-
      Voorzover de in Nederland wonende echtgenoot, kinderen en overige inwonende gezinsleden van de persoon, bedoeld
      in [artikel 14, eerste lid][ref1], niet van de verzekering op grond van de [Wet langdurige zorg][ref2] zijn
      uitgesloten op grond van de [artikelen 14, derde lid][ref3], [21][ref4] of [21a][ref5], wordt, op aanvraag, door
      de Sociale verzekeringsbank een ontheffing verleend van de verzekering op grond van zowel de Wet langdurige zorg
      als de [Algemene Ouderdomswet][ref6], de [Algemene nabestaandenwet][ref7] en de [Algemene Kinderbijslagwet][ref8],
      indien de echtgenoot, kinderen en overige inwonende gezinsleden op grond van een regeling van een op grond van
      artikel 14, tweede lid, aangewezen volkenrechtelijke organisatie, aanspraken hebben op zorg of op vergoeding van de
      kosten daarvan mits wordt voldaan aan de voorwaarden bedoeld in [artikel 21, tweede en derde lid][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0010182#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0035917
      [ref3]: https://wetten.overheid.nl/BWBR0010182#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0010182#Artikel21
      [ref5]: https://wetten.overheid.nl/BWBR0010182#Artikel21a
      [ref6]: https://wetten.overheid.nl/BWBR0002221
      [ref7]: https://wetten.overheid.nl/BWBR0007795
      [ref8]: https://wetten.overheid.nl/BWBR0002368
      [ref9]: https://wetten.overheid.nl/BWBR0010182#Artikel21
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel21b
    references:
      - id: ref1
        bwb_id: BWBR0010182
        artikel: '14'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0035917
      - id: ref3
        bwb_id: BWBR0010182
        artikel: '14'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0010182
        artikel: '21'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0010182
        artikel: 21a
        paragraaf: '3'
      - id: ref6
        bwb_id: BWBR0002221
      - id: ref7
        bwb_id: BWBR0007795
      - id: ref8
        bwb_id: BWBR0002368
      - id: ref9
        bwb_id: BWBR0010182
        artikel: '21'
        paragraaf: '3'
  - number: 21b.2
    text: |-
      Het eerste lid is niet van toepassing op de echtgenoot, kinderen en overige inwonende gezinsleden die in Nederland
      arbeid verrichten of een Nederlandse sociale verzekeringsuitkering ontvangen, anders dan de in [artikel 21a][ref1]
      bedoelde uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0010182#Artikel21a
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel21b
    references:
      - id: ref1
        bwb_id: BWBR0010182
        artikel: 21a
        paragraaf: '3'
  - number: 21b.3
    text: |-
      De Sociale verzekeringsbank verleent de ontheffing indien en voor zolang wordt voldaan aan de in het eerste en
      tweede lid gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel21b
  - number: 21b.4
    text: |-
      Indien de aanvraag voor de ontheffing wordt ingediend binnen vier maanden nadat een persoon voor het eerst is gaan
      voldoen aan de in het eerste en tweede lid gestelde voorwaarden, gaat de ontheffing in met ingang van de dag waarop
      aan deze voorwaarden wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel21b
  - number: 21b.5
    text: |-
      Indien de aanvraag voor de ontheffing niet binnen de in het vierde lid genoemde periode wordt ingediend, gaat de
      ontheffing in op de eerste dag van de maand volgende op de dag waarop de aanvraag door de Sociale verzekeringsbank
      is ontvangen, indien op die eerste dag aan de in het eerste en tweede lid gestelde voorwaarden wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel21b
  - number: 21b.6
    text: |-
      De echtgenoot, kinderen en overige inwonende gezinsleden die op grond van het eerste lid zijn ontheven, blijven
      ontheven van de verzekering op grond van zowel de [Wet langdurige zorg][ref1] als de [Algemene Ouderdomswet][ref2],
      de [Algemene nabestaandenwet][ref3] en de [Algemene Kinderbijslagwet][ref4], gedurende de periode van een jaar,
      te rekenen vanaf de datum van overlijden van de persoon, bedoeld in [artikel 14, eerste lid][ref5], tenzij zij in
      Nederland arbeid verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0035917
      [ref2]: https://wetten.overheid.nl/BWBR0002221
      [ref3]: https://wetten.overheid.nl/BWBR0007795
      [ref4]: https://wetten.overheid.nl/BWBR0002368
      [ref5]: https://wetten.overheid.nl/BWBR0010182#Artikel14
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel21b
    references:
      - id: ref1
        bwb_id: BWBR0035917
      - id: ref2
        bwb_id: BWBR0002221
      - id: ref3
        bwb_id: BWBR0007795
      - id: ref4
        bwb_id: BWBR0002368
      - id: ref5
        bwb_id: BWBR0010182
        artikel: '14'
        paragraaf: '3'
  - number: 21c.1
    text: |-
      Aan de in Nederland wonende echtgenoot, kinderen en overige inwonende gezinsleden van de persoon op wie
      [artikel 3, eerste lid, aanhef en onderdeel d][ref1], van toepassing is ongeacht of deze persoon een
      dienstbetrekking heeft met een Nederlandse publiekrechtelijke rechtspersoon, of aan de in Nederland wonende
      echtgenoot, kinderen en overige inwonende gezinsleden van de persoon, bedoeld in [artikel 12][ref2], wordt,
      op aanvraag, door de Sociale Verzekeringsbank een ontheffing verleend van de verzekering op grond van zowel de
      [Wet langdurige zorg][ref3], als de [Algemene Ouderdomswet][ref4], de [Algemene nabestaandenwet][ref5] en de
      [Algemene Kinderbijslagwet][ref6], indien de echtgenoot, kinderen en overige inwonende gezinsleden op grond van
      een regeling van een op grond van artikel 3, eerste lid, onderdeel d, aangewezen volkenrechtelijke organisatie,
      aanspraak hebben op zorg of de vergoeding van de kosten daarvan, mits wordt voldaan aan de voorwaarden, bedoeld in
      [artikel 21, tweede en derde lid][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0010182#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010182#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0035917
      [ref4]: https://wetten.overheid.nl/BWBR0002221
      [ref5]: https://wetten.overheid.nl/BWBR0007795
      [ref6]: https://wetten.overheid.nl/BWBR0002368
      [ref7]: https://wetten.overheid.nl/BWBR0010182#Artikel21
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel21c
    references:
      - id: ref1
        bwb_id: BWBR0010182
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0010182
        artikel: '12'
        paragraaf: '3'
