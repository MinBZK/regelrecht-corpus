        artikel: '3'
        paragraaf: '2'
  - number: 21c.4
    text: |-
      [Artikel 21b, derde tot en met vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010182#Artikel21b
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel21c
    references:
      - id: ref1
        bwb_id: BWBR0010182
        artikel: 21b
        paragraaf: '3'
  - number: '22.1'
    text: |-
      De persoon die in Nederland woont en die recht heeft op een uitkering op grond van een buitenlandse
      wettelijke of bovenwettelijke regeling inzake sociale zekerheid of op grond van een regeling van een
      volkenrechtelijke organisatie wordt op zijn aanvraag, voor zolang hij geen arbeid in Nederland verricht,
      door de Sociale verzekeringsbank van de verzekering op grond van de [Algemene Ouderdomswet][ref1], de
      [Algemene nabestaandenwet][ref2] en de [Algemene Kinderbijslagwet][ref3] ontheven, zolang hij:


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
      [ref3]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0007795
      - id: ref3
        bwb_id: BWBR0002368
  - number: 22.1.a
    text: |-
      duurzaam recht heeft op uitsluitend een uitkering als bedoeld in de
      aanhef en deze uitkering per maand ten minste gelijk is aan 70% van het in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref1] bedoelde bedrag; of


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
  - number: 22.1.b
    text: |-
      naast een uitkering als bedoeld in onderdeel a, recht heeft op een Nederlandse socialeverzekeringsuitkering
      en het totaal van deze uitkering en de buitenlandse wettelijke of bovenwettelijke uitkering of de
      uitkering van de volkenrechtelijke organisatie per maand ten minste gelijk is aan 70% van het in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref1] bedoelde bedrag en
      de buitenlandse uitkering of de uitkering van de volkenrechtelijke organisatie groter is dan of gelijk is aan de
      Nederlandse uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
  - number: '22.2'
    text: |-
      Indien de aanvraag voor de ontheffing wordt ingediend binnen een jaar na de datum waarop de persoon, bedoeld in
      het eerste lid, voor het eerst voldoet aan de in dat lid opgenomen voorwaarden, gaat de ontheffing in op die datum.
      Indien de aanvraag voor de ontheffing later wordt ingediend, gaat de ontheffing in op de datum van de aanvraag
      om ontheffing.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel22
  - number: '22.3'
    text: |-
      De Sociale verzekeringsbank kan de ontheffing, bedoeld in het eerste lid, verlenen met ingang van een datum die
      gelegen is ten hoogste drie jaar vóór de datum van de aanvraag, doch niet eerder dan de datum waarop recht is
      ontstaan op de buitenlandse wettelijke of bovenwettelijke uitkering of de uitkering van de volkenrechtelijke
      organisatie, indien toepassing van het tweede lid leidt tot onbillijkheden van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel22
  - number: '22.4'
    text: |-
      Voor de toepassing van dit artikel wordt met een uitkering op grond van een buitenlandse wettelijke of
      bovenwettelijke regeling inzake sociale zekerheid gelijkgesteld een vergelijkbare buitenlandse uitkering krachtens
      een bijzondere regeling voor ambtenaren en wordt met een Nederlandse socialeverzekeringsuitkering gelijkgesteld een
      vergelijkbare Nederlandse uitkering krachtens een bijzondere regeling voor ambtenaren.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel22
  - number: '22.5'
    text: |-
      Voor de toepassing van dit artikel wordt een uitkering op grond van een wettelijke of bovenwettelijke regeling
      inzake sociale zekerheid van Aruba, Curaçao, Sint Maarten of van Nederland ten behoeve van de openbare lichamen
      Bonaire, Sint Eustatius en Saba aangemerkt als een uitkering op grond van een buitenlandse regeling.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel22
  - number: '22.6'
    text: |-
      Het tweede lid, eerste zin, en het derde lid, zijn niet van toepassing indien de persoon bedoeld in het eerste lid,
      binnen de in die leden genoemde periode van een jaar respectievelijk ten hoogste drie jaar, een uitkering op grond
      van de [Algemene nabestaandenwet][ref1] dan wel kinderbijslag op grond van de [Algemene Kinderbijslagwet][ref2]
      heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0002368
  - number: '23'
    text: |-
      De vreemdeling die rechtmatig in Nederland verblijf houdt in de zin van
      [artikel 8, onder a tot en met e, of l, van de Vreemdelingenwet 2000][ref1], is niet op grond van het verrichten
      van arbeid, uit hoofde waarvan hij aan de loonbelasting is onderworpen, verzekerd voor de volksverzekeringen,
      indien hij voor een werkgever in Nederland, met uitzondering van het continentaal plat, arbeid verricht, zonder dat
      aan de [Wet arbeid vreemdelingen][ref2] is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0007149
  - number: '24.1'
    text: |-
      De Sociale verzekeringsbank kan, met uitzondering van [artikel 22, derde lid][ref1], artikelen van dit besluit
      buiten toepassing laten of daarvan afwijken voor zover toepassing gelet op het belang van de uitbreiding en
      beperking van de kring van verzekerden zal leiden tot een onbillijkheid van overwegende aard, die uitsluitend
      voortvloeit uit de verzekeringsplicht of de uitsluiting daarvan krachtens dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0010182#Artikel22
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0010182
        artikel: '22'
        paragraaf: '3'
  - number: '24.2'
    text: |-
      Van een besluit van de Sociale verzekeringsbank op grond van het eerste lid, wordt mededeling gedaan in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel24
  - number: '26'
    text: |-
      [Artikel 9a][ref1] zoals dat artikel luidde op de dag voorafgaand aan de inwerkingtreding van het besluit van
      11 december 2014 tot wijziging van het Besluit uitbreiding en beperking kring verzekerden volksverzekeringen 1999,
      het Besluit uitbreiding en beperking kring verzekerden werknemersverzekeringen 1990 en het Besluit uitbreiding en
      beperking kring ingezetenen Wet Wajong (Stb. 514) blijft van toepassing ten aanzien van de vreemdeling die op die
      dag op grond van dit artikel verzekerd was voor de volksverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0010182#Artikel9a
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0010182
        artikel: 9a
        paragraaf: '2'
  - number: '27'
    text: |-
      [Artikel 14, vijfde lid][ref1], is niet van toepassing ten aanzien van de particulier bediende, bedoeld in dat
      lid, indien deze persoon op de dag van inwerkingtreding van het besluit van 11 december 2014 tot wijziging van het
      Besluit uitbreiding en beperking kring verzekerden volksverzekeringen 1999, het Besluit uitbreiding en beperking
      kring verzekerden werknemersverzekeringen 1990 en het Besluit uitbreiding en beperking kring ingezetenen Wet Wajong
      (Stb. 514) verzekerd was op grond van de volksverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0010182#Artikel14
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0010182
        artikel: '14'
        paragraaf: '3'
  - number: 27a
    text: |-
      [Artikel 20][ref1], zoals dat artikel luidde op de dag voorafgaand aan de inwerkingtreding van het besluit van
      11 december 2014 tot wijziging van het Besluit uitbreiding en beperking kring verzekerden volksverzekeringen 1999,
      het Besluit uitbreiding en beperking kring verzekerden werknemersverzekeringen 1990 en het Besluit uitbreiding en
      beperking kring ingezetenen Wet Wajong (Stb. 514) blijft van toepassing ten aanzien van de persoon die op die dag
      uitsluitend wegens studieredenen in Nederland woont en 30 jaar of ouder is.


      [ref1]: https://wetten.overheid.nl/BWBR0010182#Artikel20
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0010182
        artikel: '20'
        paragraaf: '3'
  - number: 27b
    text: |-
      De [artikelen 21, tweede en derde lid][ref1], [21a, eerste lid][ref2], en [21b, eerste lid][ref3], zoals deze
      artikelen luidden op de dag voorafgaand aan de inwerkingtreding van het besluit van 11 december 2014 tot wijziging
      van het Besluit uitbreiding en beperking kring verzekerden volksverzekeringen 1999, het Besluit uitbreiding en
      beperking kring verzekerden werknemersverzekeringen 1990 en het Besluit uitbreiding en beperking kring ingezetenen
      Wet Wajong (Stb. 514) blijven van toepassing ten aanzien van de persoon of de in Nederland wonende echtgenoot,
      kinderen en overige inwonende gezinsleden van deze persoon, bedoeld in deze artikelen, die op die dag op grond
      van artikel 21 niet waren verzekerd op grond van de [Algemene Wet Bijzondere Ziektekosten][ref4] of op grond
      van de artikelen 21a of 21b waren ontheven van de verzekeringsplicht op grond van de in die artikelen genoemde
      volksverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0010182#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0010182#Artikel21a
      [ref3]: https://wetten.overheid.nl/BWBR0010182#Artikel21b
      [ref4]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0010182
        artikel: '21'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0010182
        artikel: 21a
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0010182
        artikel: 21b
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0002614
  - number: '28'
    text: |-
      Beschikkingen, gegeven op grond van de artikelen 18, 23, 24 en 25 van het Besluit uitbreiding en beperking kring
      verzekerden volksverzekeringen 1989 worden aangemerkt als beschikkingen op grond van de [artikelen 18][ref1],
      [21][ref2], [22][ref3] en [24][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0010182#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0010182#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0010182#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0010182#Artikel24
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0010182
        artikel: '18'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0010182
        artikel: '21'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0010182
        artikel: '22'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0010182
        artikel: '24'
        paragraaf: '4'
  - number: 28a
    text: |-
      Door het Zorginstituut Nederland voor de inwerkingtreding van het Besluit van 26 februari 2011, houdende
      wijziging van het Besluit uitbreiding en beperking kring verzekerden volksverzekeringen 1999 in verband met het
      overdragen van de bevoegdheid tot het verlenen van een ontheffing van de verzekeringsplicht AWBZ aan de Sociale
      verzekeringsbank (Stb. 112) afgegeven verklaringen als bedoeld in [artikel 21][ref1] en verleende ontheffingen
      als bedoeld in [artikel 21a][ref2], worden aangemerkt als door de Sociale verzekeringsbank op grond van de
      desbetreffende artikelen afgegeven verklaringen en ontheffingen.


      [ref1]: https://wetten.overheid.nl/BWBR0010182#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0010182#Artikel21a
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0010182
        artikel: '21'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0010182
        artikel: 21a
        paragraaf: '3'
  - number: '30'
    text: Het Besluit uitbreiding en beperking kring verzekerden volksverzekeringen 1989 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel30
  - number: '31'
    text: Dit besluit treedt in werking met ingang van 1 januari 1999.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel31
  - number: '32'
    text: 'Dit besluit wordt aangehaald als: Besluit uitbreiding en beperking kring verzekerden volksverzekeringen 1999.'
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel32
