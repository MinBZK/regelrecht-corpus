    text: 'buiten Nederland arbeid verrichten: buiten Nederland en het continentaal plat arbeid verrichten.'
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel1
  - number: '2.1'
    text: |-
      Verzekerd op grond van de volksverzekeringen is de niet in Nederland wonende Nederlander die op grond van
      __REF000___________________________________________________________________________________________________________
      _________________________ werkzaam is bij een vertegenwoordiging van het Koninkrijk der Nederlanden in het
      buitenland als bedoeld in [artikel 7, tweede lid, van het Reglement Dienst Buitenlandse Zaken][ref2], tenzij hij:


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel7
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0004052
        artikel: '7'
  - number: 2.1.a
    text: buiten Nederland arbeid verricht anders dan de werkzaamheden, bedoeld in de aanhef; of
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel2
  - number: 2.1.b
    text: een uitkering ontvangt op grond van een buitenlandse wettelijke regeling inzake sociale zekerheid.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel2
  - number: '2.2'
    text: |-
      Verzekerd op grond van de volksverzekeringen zijn de gezinsleden, bedoeld in artikel 2 van het Reglement Dienst
      Buitenlandse Zaken, van de in het eerste lid bedoelde verzekerde, tenzij het gezinslid:
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel2
  - number: 2.2.a
    text: |-
      buiten Nederland arbeid verricht en de inkomsten uit deze arbeid meer bedragen dan het bedrag, genoemd in
      [artikel 8.14a, eerste lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
  - number: 2.2.b
    text: een uitkering ontvangt op grond van een buitenlandse wettelijke regeling inzake sociale zekerheid.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel2
  - number: '2.3'
    text: |-
      De gezinsleden die op grond van het tweede lid zijn verzekerd, blijven verzekerd op grond van de volksverzekeringen
      gedurende de periode van een jaar, te rekenen vanaf de datum van overlijden van de verzekerde, bedoeld in het
      eerste lid, tenzij het gezinslid:
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel2
  - number: 2.3.a
    text: |-
      buiten Nederland arbeid verricht en de inkomsten uit deze arbeid meer bedragen dan het bedrag, genoemd in
      [artikel 8.14a, eerste lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
  - number: 2.3.b
    text: een uitkering ontvangt op grond van een buitenlandse wettelijke regeling inzake sociale zekerheid.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel2
  - number: '2.4'
    text: |-
      Verzekerd op grond van de volksverzekeringen is de niet in Nederland wonende particuliere bediende die in dienst is
      van de verzekerde, bedoeld in het eerste lid, tenzij hij:
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel2
  - number: 2.4.a
    text: onderdaan is van de ontvangende staat;
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel2
  - number: 2.4.b
    text: ten tijde van aanwerving niet in Nederland woonde;
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel2
  - number: 2.4.c
    text: buiten Nederland arbeid verricht anders dan uit hoofde van vorenbedoelde dienstbetrekking; of
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel2
  - number: 2.4.d
    text: een uitkering ontvangt op grond van een buitenlandse wettelijke regeling inzake sociale zekerheid.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel2
  - number: '3.1'
    text: |-
      Verzekerd op grond van de volksverzekeringen is de niet in Nederland wonende Nederlander, voor zover niet reeds
      begrepen onder [artikel 2][ref1], die uit hoofde van een dienstbetrekking met een Nederlandse publiekrechtelijke
      rechtspersoon buiten Nederland arbeid verricht ten behoeve van die rechtspersoon, tenzij hij:


      [ref1]: https://wetten.overheid.nl/BWBR0010182#Artikel2
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010182
        artikel: '2'
        paragraaf: '2'
  - number: 3.1.a
    text: ten tijde van aanwerving niet in Nederland woonde;
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel3
  - number: 3.1.b
    text: buiten Nederland arbeid verricht anders dan uit hoofde van de vorenbedoelde dienstbetrekking;
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel3
  - number: 3.1.c
    text: een uitkering ontvangt op grond van een buitenlandse wettelijke regeling inzake sociale zekerheid; of
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel3
  - number: 3.1.d
    text: |-
      werkzaam is bij een door Onze Ministers en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties aan te
      wijzen volkenrechtelijke organisatie en op hem een regeling inzake sociale zekerheid van die organisatie van
      toepassing is.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel3
  - number: '3.2'
    text: |-
      In afwijking van het eerste lid, onderdeel b, is verzekerd op grond van de volksverzekeringen de Nederlander die
      in dienst is van een publiekrechtelijke rechtspersoon in Aruba, Curaçao, Sint Maarten of in de openbare lichamen
      Bonaire, Sint Eustatius of Saba mits hij door de Nederlandse overheid is uitgezonden.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel3
  - number: '3.3'
    text: |-
      Verzekerd op grond van de volksverzekeringen zijn de echtgenoot, kinderen en overige inwonende gezinsleden van de
      verzekerde, bedoeld in het eerste en tweede lid, tenzij het gezinslid:
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel3
  - number: 3.3.a
    text: |-
      buiten Nederland arbeid verricht en de inkomsten uit deze arbeid meer bedragen dan het bedrag, genoemd in
      [artikel 8.14a, eerste lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
  - number: 3.3.b
    text: een uitkering ontvangt op grond van een buitenlandse wettelijke regeling inzake sociale zekerheid.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel3
  - number: '3.4'
    text: |-
      De echtgenoot, kinderen en overige inwonende gezinsleden die op grond van het derde lid zijn verzekerd, blijven
      verzekerd op grond van de volksverzekeringen gedurende de periode van een jaar, te rekenen vanaf de datum van
      overlijden van de verzekerde, bedoeld in het eerste en tweede lid, tenzij het gezinslid:
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel3
  - number: 3.4.a
    text: |-
      buiten Nederland arbeid verricht en de inkomsten uit deze arbeid meer bedragen dan het bedrag, genoemd in
      [artikel 8.14a, eerste lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
  - number: 3.4.b
    text: een uitkering ontvangt op grond van een buitenlandse wettelijke regeling inzake sociale zekerheid.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel3
  - number: 3a.1
    text: Verzekerd op grond van de volksverzekeringen is de Rijksvertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel3a
  - number: 3a.2
    text: |-
      Verzekerd op grond van de volksverzekeringen zijn de echtgenoot, kinderen en overige inwonende gezinsleden van de
      Rijksvertegenwoordiger, tenzij het gezinslid:
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel3a
  - number: 3a.2.a
    text: |-
      buiten Nederland arbeid verricht en de inkomsten uit deze arbeid meer bedragen dan het bedrag, genoemd in
      [artikel 8.14a, eerste lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
  - number: 3a.2.b
    text: een uitkering ontvangt op grond van een andere wettelijke regeling inzake sociale zekerheid.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel3a
  - number: 3a.3
    text: |-
      De echtgenoot, kinderen en overige inwonende gezinsleden die op grond van het tweede lid zijn verzekerd, blijven
      verzekerd op grond van de volksverzekeringen gedurende de periode van een jaar, te rekenen vanaf de datum van
      overlijden van de Rijksvertegenwoordiger, tenzij het gezinslid:
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel3a
  - number: 3a.3.a
    text: |-
      buiten Nederland arbeid verricht en de inkomsten uit deze arbeid meer bedragen dan het bedrag, genoemd in
      [artikel 8.14a, eerste lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
  - number: 3a.3.b
    text: een uitkering ontvangt op grond van een andere wettelijke regeling inzake sociale zekerheid.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel3a
  - number: 3a.4
    text: |-
      Onder Rijksvertegenwoordiger als bedoeld in dit artikel wordt verstaan: de Rijksvertegenwoordiger voor de openbare
      lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel3a
  - number: '4'
    text: |-
      Verzekerd op grond van de volksverzekeringen is de persoon die niet in Nederland woont en behoort tot het
      rijdend, vliegend of op de binnenwateren varend personeel van een in Nederland wonende of gevestigde werkgever die
      internationaal vervoer verricht, tenzij hij:
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel4
  - number: 4.a
    text: in hoofdzaak in het land waarin hij woont arbeid verricht; of
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel4
  - number: 4.b
    text: werkt bij een filiaal of een vaste vertegenwoordiging van die werkgever buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel4
  - number: '5'
    text: |-
      Verzekerd op grond van de volksverzekeringen zijn de aan boord van een schip wonende echtgenoot en kinderen van de
      persoon die op grond van de volksverzekeringen of van [artikel 4][ref1] verzekerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0010182#Artikel4
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010182
        artikel: '4'
        paragraaf: '2'
  - number: '6'
    text: |-
      Verzekerd op grond van de volksverzekeringen blijft de persoon die niet in Nederland woont, maar die uitsluitend in
      Nederland arbeid verricht en van wie de arbeid tijdelijk wordt onderbroken:
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel6
  - number: 6.a
    text: wegens ziekte, gebreken, zwangerschap, bevalling of werkloosheid; of
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel6
  - number: 6.b
    text: wegens verlof, staking of uitsluiting.
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel6
  - number: '8.1'
    text: |-
      Verzekerd op grond van de volksverzekeringen blijft de persoon die een periode uitsluitend niet in Nederland woont
      wegens studieredenen indien die periode:
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel8
  - number: 8.1.a
    text: aansluitend is op het wonen in Nederland;
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel8
  - number: 8.1.b
    text: |-
      aansluitend is op een periode van wonen in het buitenland waarin hij op grond van [artikelen 2][ref1], [3][ref2],
      [3a][ref3], [4][ref4], [5][ref5] of [6][ref6] verzekerd was op grond van de volksverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0010182#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010182#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0010182#Artikel3a
      [ref4]: https://wetten.overheid.nl/BWBR0010182#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0010182#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0010182#Artikel6
    url: https://wetten.overheid.nl/BWBR0010182/2020-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0010182
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0010182
        artikel: '3'
        paragraaf: '2'
      - id: ref3
