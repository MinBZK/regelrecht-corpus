        artikel: '10'
        paragraaf: '3'
  - number: '7.1'
    text: 'De fokker, de leverancier en de gebruiker zorgen ervoor dat:'
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel7
  - number: 7.1.a
    text: |-
      alle dieren beschikken over huisvesting, een omgeving, voedsel, water en verzorging die passend zijn voor hun
      gezondheid en welzijn en welke ten minste voldoet aan de in bijlage III van de richtlijn gestelde eisen met ingang
      van de in die bijlage bij die eisen genoemde data;
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel7
  - number: 7.1.b
    text: |-
      iedere beperking van de mogelijkheid van de dieren om aan hun fysiologische en ethologische behoeften te voldoen,
      tot een minimum wordt beperkt;
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel7
  - number: 7.1.c
    text: |-
      de dieren en de omstandigheden waarin de dieren worden gefokt, gehouden, of gebruikt, dagelijks worden
      gecontroleerd en de uitgevoerde controles en bevindingen worden geregistreerd;
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel7
  - number: 7.1.d
    text: |-
      voorzieningen worden getroffen om een eventueel letsel of pijn, onnodig lijden, angst en blijvende schade die
      vermijdbaar zijn en die worden ontdekt, zo snel mogelijk te verhelpen,
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel7
  - number: 7.1.e
    text: de dieren onder behoorlijke omstandigheden worden vervoerd, en
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel7
  - number: 7.1.f
    text: er niet wordt gerookt in ruimten waarin zich dieren bevinden.
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel7
  - number: '7.2'
    text: Voor knaagdieren en konijnen worden geen draadkooien of draadroosterbodems gebruikt.
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel7
  - number: '7.3'
    text: |-
      De inrichtingen van de fokker, de leverancier en de gebruiker, beschikken over installaties en voorzieningen die
      geschikt zijn voor de daar gehuisveste diersoorten, en indien er dierproeven plaatsvinden, voor de uitvoering van
      die dierproeven.
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel7
  - number: '7.4'
    text: |-
      Het ontwerp, de bouw en de werking van de in het derde lid bedoelde installaties en voorzieningen zijn zodanig dat
      dierproeven zo doelmatig mogelijk kunnen worden uitgevoerd en dat met zo weinig mogelijk dieren en een minimum aan
      pijn, lijden, angst of blijvende schade naar betrouwbare resultaten wordt gestreefd.
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel7
  - number: '7.5'
    text: |-
      De in het derde lid bedoelde installaties en voorzieningen en het ontwerp, de bouw en de werking daarvan, bedoeld
      in het vierde lid, voldoen aan de in bijlage III bij de richtlijn aan installaties en voorzieningen en het ontwerp,
      de bouw en de werking daarvan, bedoeld in het vierde lid, gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel7
  - number: '7.6'
    text: 'Van het eerste lid, aanhef en onderdeel a, kan worden afgeweken:'
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel7
  - number: 7.6.a
    text: om redenen van dierenwelzijn of diergezondheid, of
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel7
  - number: 7.6.b
    text: |-
      om wetenschappelijke redenen, mits dit noodzakelijk is voor de uitvoering van het projectvoorstel waarvoor een
      projectvergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel7
  - number: '7.7'
    text: |-
      In aanvulling op het zesde lid kan Onze Minister om wetenschappelijke redenen of redenen van dierenwelzijn of
      diergezondheid op verzoek een ontheffing verlenen van de verplichtingen op grond van het eerste lid, aanhef en
      onder a.
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel7
  - number: '8.1'
    text: |-
      Personen die de hierna genoemde werkzaamheden verrichten, hebben een opleiding afgerond die voldoet aan de bij
      ministeriële regeling vast te stellen minimumeisen:
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel8
  - number: 8.1.a
    text: het verrichten van dierproeven;
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel8
  - number: 8.1.b
    text: het verzorgen van dieren; of
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel8
  - number: 8.1.c
    text: het doden van dieren.
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel8
  - number: '8.2'
    text: |-
      In aanvulling op het bepaalde in het eerste lid kunnen bij ministeriële regeling bekwaamheidseisen worden gesteld
      ten aanzien van de personen, bedoeld in het eerste lid, en kunnen regels worden gesteld met betrekking tot het
      verwerven, op peil houden en aantonen van de vereiste bekwaamheid.
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel8
  - number: '8.3'
    text: |-
      Totdat zij bewijs hebben geleverd van de vereiste bekwaamheid, staan de in het eerste lid bedoelde personen tijdens
      hun werk onder toezicht. Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de eerste
      volzin.
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel8
  - number: '8.4'
    text: |-
      Met de beroepseisen ter zake van personen als bedoeld in het eerste lid, worden gelijkgesteld beroepseisen die
      worden gesteld in een andere lidstaat van de Europese Unie of Europese Economische Ruimte en die een beroepsniveau
      waarborgen dat ten minste gelijkwaardig is aan het niveau dat met de nationale eisen wordt nagestreefd.
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel8
  - number: '9.1'
    text: |-
      De houder van een instellingsvergunning als bedoeld in [artikel 2][ref1] of [11a van de wet][ref2] draagt
      ervoor zorg dat een ieder voor wiens handelen of nalaten hij als zodanig verantwoordelijk is, aan de in
      [artikel 13f, derde en vierde lid, van de wet][ref3] bedoelde personen alle medewerking verleent die nodig is voor
      de uitoefening van de bij hen belegde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003081#Artikel11a
      [ref3]: https://wetten.overheid.nl/BWBR0003081#Artikel13f
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003081
        artikel: 11a
      - id: ref3
        bwb_id: BWBR0003081
        artikel: 13f
  - number: '9.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de in
      [artikel 13f, derde en vierde lid, van de wet][ref1] bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel13f
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 13f
  - number: '10'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de deskundigheid en bekwaamheid van de
      persoon, bedoeld in [artikel 14 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel14
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: '14'
  - number: '11.1'
    text: |-
      Bij ministeriële regeling kunnen categorieën van fokkers, leveranciers en gebruikers worden aangewezen die niet
      gehouden zijn een instantie voor dierenwelzijn als bedoeld in [artikel 14a van de wet](onbekend) in te stellen.
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel11
  - number: '11.2'
    text: |-
      Indien een fokker, leverancier, of gebruiker die valt onder de in het eerste lid bedoelde categorie geen instantie
      voor dierenwelzijn instelt, worden de bij of krachtens [artikel 14c van de wet](onbekend) aan de instantie voor
      dierenwelzijn opgedragen taken verricht door de persoon, bedoeld in [artikel 13f, derde lid, onder a, van de wet]
      (onbekend).
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel11
  - number: '12.1'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent het aantekening houden en bewaren van gegevens als bedoeld
      in de [artikelen 15][ref1] en [15a, eerste lid, van de wet](onbekend), en het verstrekken van deze gegevens aan
      Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel15
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: '15'
  - number: '12.2'
    text: |-
      Bij ministeriële regeling worden eisen gesteld aan het levensloopdossier als bedoeld in [artikel 15a, tweede lid,
      van de wet](onbekend).
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel12
  - number: '13.1'
    text: |-
      De fokker, leverancier en de gebruiker voorzien alle honden, katten en niet-menselijke primaten die zij houden
      uiterlijk op het moment dat deze dieren worden gespeend, op de minst pijnlijke wijze van een permanent individueel
      merkteken. Onze Minister kan nadere regels stellen over de wijze waarop het aanbrengen van merktekens plaats moet
      vinden.
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel13
  - number: '13.2'
    text: |-
      Wanneer een hond, kat of niet-menselijke primaat vóór het spenen wordt overgebracht naar een andere fokker,
      leverancier of gebruiker en het niet mogelijk is het dier vooraf te merken, worden gegevens over het betrokken
      dier, met name de identiteit van de moeder, door de ontvangende fokker, leverancier of gebruiker bewaard totdat het
      dier is gemerkt.
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel13
  - number: '13.3'
    text: |-
      Wanneer een fokker, leverancier of gebruiker een gespeende niet-gemerkte hond, kat of niet-menselijke primaat
      ontvangt, wordt het dier zo spoedig mogelijk op de minst pijnlijke wijze van een permanent merkteken voorzien.
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel13
  - number: '14'
    text: |-
      Het [Dierproevenbesluit][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0003802
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003802
  - number: '15'
    text: |-
      De in de [artikelen 2, eerste lid][ref1], gestelde vereisten dat de persoon, bedoeld in
      [artikel 9 van de wet][ref2], opgeleid moet zijn in een lidstaat van de Europese Unie of van de Europese
      Economische Ruimte, respectievelijk een door Onze Minister erkende cursus proefdierkunde heeft gevolgd,
      geldt niet ten aanzien van personen ten aanzien waarvan vóór de inwerkingtreding van de wet tot wijziging
      van de Wet op de dierproeven in verband met implementatie van [richtlijn 2010/63](32010L0063)/EU op grond van
      [artikel 16 van de wet][ref3] een ontheffing van het verbod in artikel 9 van de wet is verleend, voor zover deze
      ontheffing betrekking heeft op deze vereisten.


      [ref1]: https://wetten.overheid.nl/BWBR0035866#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003081#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0003081#Artikel16
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0035866
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003081
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0003081
        artikel: '16'
  - number: '17'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel17
  - number: '18'
    text: 'Dit besluit wordt aangehaald als: Dierproevenbesluit 2014.'
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel18
