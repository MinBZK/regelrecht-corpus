preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Economische Zaken van 23 september 2013, nr. WJZ / 13153474;

    Gelet op richtlijn nr. 2010/63/EU van 22 september 2010 betreffende de bescherming van dieren die voor
    wetenschappelijke doeleinden worden gebruikt (PbEU 2010, L 276) en de artikelen 9, 10a1, zevende lid, 10a4, eerste
    lid, 10e, derde lid, 11a, tweede lid, 13f, eerste en vijfde lid, 14, 14a, tweede lid, 14b, eerste lid, 14c, tweede
    lid, 15, 15a, 18, tweede lid, en 18a, tweede lid, van de Wet op de dierproeven en artikel 96 van de Gezondheids- en
    welzijnswet voor dieren;

    De Afdeling advisering van de Raad van State gehoord (advies van 23 oktober 2013, nr. W15.13.0337/IV);

    Gezien het nader rapport van de Staatssecretaris van Economische Zaken van 21 november 2014, nr. WJZ / 14026568;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder «wet»: [Wet op de dierproeven][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003081
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003081
  - number: '2.1'
    text: |-
      De persoon, bedoeld in [artikel 9 van de wet][ref1], is wetenschappelijk opgeleid in een lidstaat van de Europese
      Unie of de Europese Economische Ruimte in een richting die verband houdt met de te verrichten werkzaamheden,
      beschikt over soortspecifieke kennis en heeft een door Onze Minister erkende cursus proefdierkunde gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel9
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: '9'
  - number: '2.2'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de minimumeisen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel2
  - number: '2.3'
    text: |-
      In aanvulling op het eerste lid kunnen bij ministeriële regeling bekwaamheidseisen worden gesteld en kunnen regels
      worden gesteld met betrekking tot het verwerven, op peil houden en aantonen van de vereiste bekwaamheid.
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel2
  - number: '2.4'
    text: |-
      Met de beroepseisen ter zake van de persoon, bedoeld in [artikel 9 van de wet][ref1], worden gelijkgesteld
      beroepseisen die worden gesteld in een andere lidstaat van de Europese Unie of Europese Economische Ruimte en
      die een beroepsniveau waarborgen dat ten minste gelijkwaardig is aan het niveau dat met de nationale eisen wordt
      nagestreefd.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel9
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: '9'
  - number: '2.5'
    text: |-
      Onze Minister kan op verzoek een ontheffing verlenen van het vereiste in het eerste lid, dat de daar bedoelde
      opleiding is gevolgd in een lidstaat van de Europese Unie of de Europese Economische Ruimte, indien kan worden
      aangetoond dat de persoon, bedoeld in [artikel 9 van de wet][ref1], beschikt over een vergelijkbaar deskundigheids-
      en bekwaamheidsniveau.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel9
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: '9'
  - number: '3'
    text: |-
      Bij ministeriële regeling wordt bepaald op welke wijze de niet-technische samenvatting van een project waarvoor de
      centrale commissie dierproeven een projectvergunning heeft verleend, bekend wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel3
  - number: '4'
    text: |-
      Bij ministeriële regeling kan een vereenvoudigde procedure als bedoeld in [artikel 10a4 van de wet][ref1] worden
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel10a4
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 10a4
  - number: '5'
    text: |-
      Als bedreigde diersoorten als bedoeld in [artikel 10e, derde en vierde lid, van de wet][ref1] worden aangewezen de
      soorten, bedoeld in bijlage A bij [Verordening (EG) nr. 338/97](31997R0338) van de Raad van 9 december 1996 inzake
      de bescherming van in het wild levende dier- en plantesoorten door controle op het desbetreffende handelsverkeer,
      die niet onder het toepassingsgebied van artikel 7, eerste lid, van die verordening vallen.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel10e
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 10e
  - number: '6'
    text: |-
      Om in aanmerking te komen voor een instellingsvergunning tot het fokken of afleveren van dieren met het oog op
      dierproeven als bedoeld in [artikel 11a van de wet][ref1], dient de aanvrager aannemelijk te maken dat hij wat
      betreft de organisatie kan voldoen aan het bepaalde bij of krachtens de [artikelen 7][ref2], [9, eerste lid][ref3],
      en [11 tot en met 13][ref4] alsmede, wat betreft het personeel, aan de [artikelen 8][ref5], [9, tweede lid][ref6],
      en [10][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel11a
      [ref2]: https://wetten.overheid.nl/BWBR0035866#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0035866#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0035866#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0035866#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0035866#Artikel9
      [ref7]: https://wetten.overheid.nl/BWBR0035866#Artikel10
    url: https://wetten.overheid.nl/BWBR0035866/2020-07-17#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 11a
