  - number: '4'
    text: |-
      1 Onder opbrengst van arbeid als bedoeld in [artikel 2, onderdeel a][ref1], worden, voor zover bedoelde arbeid
      wordt verricht in dienstbetrekking doch niet in de zin van de [Coördinatiewet Sociale Verzekering][ref2], verstaan
      de gelden en alle andere voordelen welke als beloning voor die arbeid worden genoten.

      2 Ten aanzien van de gelden en alle andere voordelen uit de dienstbetrekking, bedoeld in het eerste lid, is het
      bepaalde bij of krachtens de [artikelen 5 tot en met 8 van de Coördinatiewet Sociale Verzekering][ref3] van
      overeenkomstige toepassing.

      3 In afwijking van het bepaalde in het tweede lid wordt niet als opbrengst van arbeid beschouwd een uitkering
      wegens derving van looninkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004091#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002126
      [ref3]: https://wetten.overheid.nl/BWBR0002126#Artikel5
    url: https://wetten.overheid.nl/BWBR0004091/2002-01-01#Artikel4
