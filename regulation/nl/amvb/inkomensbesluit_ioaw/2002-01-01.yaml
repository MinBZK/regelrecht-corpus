  - number: 5a
    text: |-
      Onder opbrengst van arbeid wordt tevens verstaan een financiële tegemoetkoming op grond van de Wet financiering
      loopbaanonderbreking.
    url: https://wetten.overheid.nl/BWBR0004091/2002-01-01#Artikel5a
  - number: '6'
    text: |-
      1 Onder winst als bedoeld in [artikel 2, onderdeel b][ref1], wordt verstaan de belastbare winst uit onderneming,
      bedoeld in paragraaf 3.2.1 van de [Wet inkomstenbelasting 2001][ref2], vermeerderd met de ondernemersaftrek,
      bedoeld in paragraaf 3.2.4 van die wet, met dien verstande dat de bestanddelen van de winst, bedoeld in
      [artikel 3.78, derde lid, onderdelen a, b en c, van die wet][ref3], niet geacht worden te behoren tot die winst.

      2 Indien de berekening van de in het eerste lid bedoelde winst leidt tot een negatief bedrag, wordt die winst op
      nihil gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004091#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011353
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3.78
