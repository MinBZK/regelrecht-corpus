        artikel: '3.78'
  - number: '7'
    text: |-
      1 Voor de toepassing van de wet wordt onder inkomen in verband met arbeid in het bedrijfs- of beroepsleven
      verstaan:

      a. een uitkering op grond van de verplichte verzekering van de [Werkloosheidswet][ref1],
      de [Ziektewet][ref2], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3],
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref4] of de
      [Wet op de arbeidsongeschiktheidsverzekering][ref5], een uitkering op grond van de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref6], of aanvullende uitkeringen op grond van hoofdstuk III,
      [Afdeling III van de Invoeringswet stelselherziening sociale zekerheid](onbekend) (*Stb.* 1986, 567), alsmede
      uitkeringen die naar aard en strekking daarmede overeenkomen;

      b. een uitkering op grond van een particuliere verzekering wegens derving van inkomen, welke ten behoeve van de
      werknemer in het kader van een individuele of collectieve arbeidsovereenkomst is afgesloten;

      c. een uitkering op grond van een pensioenregeling, voor zover niet begrepen [onder ][ref7];

      d. een uitkering op grond van een buitenlandse wettelijke sociale verzekeringsregeling, voor zover niet begrepen
      [onder ][ref8], met uitzondering van een uitkering, die naar aard en strekking overeenkomt met een uitkering op
      grond van de [Algemene Kinderbijslagwet][ref9] of een verstrekking op grond van de [Ziekenfondswet][ref10] (*Stb.*
      1964, 392) of de [Algemene Wet Bijzondere Ziektekosten][ref11];

      e. een uitkering op grond van een regeling voor vervroegde uittreding of een regeling, die naar aard en strekking
      daarmee overeenkomt;

      f. een uitkering op grond van een regeling voor functioneel leeftijdsontslag;

      g. loon dat uit vroegere dienstbetrekking wordt genoten, voor zover niet begrepen [onder ][ref12], [][ref13], []
      [ref14], [][ref15], [][ref16] of [][ref17];

      h. een toeslag op grond van de [Toeslagenwet][ref18];

      i. een uitkering ingevolge de [Algemene nabestaandenwet][ref19];

      j. een uitkering op grond van de [Algemene Ouderdomswet][ref20] (*Stb.* 1985, 181);

      k. een pensioen op grond van de [Wet buitengewoon pensioen 1940-1945][ref21] (*Stb.* 1977, 493);

      l. een uitkering op grond van de [Wet uitkeringen vervolgingsslachtoffers 1940-1945][ref22] (*Stb.* 1986, 386);

      m. een pensioen op grond van de [Wet buitengewoon pensioen zeelieden-oorlogsslachtoffers][ref23] (*Stb.* 1977,
      495);

      n. een uitkering op grond van de [Wet uitkeringen burger-oorlogsslachtoffers 1940-1945][ref24] (*Stb.* 1984, 94);

      o. een pensioen op grond van de [Wet buitengewoon pensioen Indisch verzet][ref25] (*Stb.* 1986, 360);

      p. een basisbeurs en een aanvullende beurs op grond van de[Wet studiefinanciering 2000][ref26], alsmede een beurs
      die naar aard en strekking daarmee overeenkomt;

      q. een bedrijfsbeëindigingsvergoeding van de door Onze Minister van Economische Zaken opgerichte Stichting
      ontwikkeling en sanering midden- en kleinbedrijf; en

      r. een maandelijkse bedrijfsbeëindigingsvergoeding van de door Onze Minister van Landbouw en Visserij opgerichte
      Stichting ontwikkelings- en saneringsfonds voor de landbouw;

      s. premies die al dan niet eenmalig boven het rechtens geldende loon worden verstrekt voor het aanvaarden van
      arbeid, voor zover deze premies binnen een tijdvak van een jaar tezamen meer bedragen dan € 1.882,00;

      t. een eenmalige premie voor het voltooien van een scholing of opleiding die noodzakelijk wordt geacht voor de
      inschakeling in de arbeid, voor zover deze premie meer bedraagt dan € 1.269,00.

      2 In afwijking van het eerste lid wordt niet als inkomen in verband met arbeid beschouwd:

      a. een aanspraak om na verloop van tijd onder een voorwaarde een of meer uitkeringen of verstrekkingen te
      ontvangen, voor zover deze niet wordt gedekt door stortingen van degene die het desbetreffende inkomen geniet;

      b. een eenmalige uitkering welke na beëindiging van de dienstbetrekking aan een werknemer in verband met die
      beëindiging wordt betaald;

      c. 81% van het bedrag waarmee de arbeidsongeschiktheidsuitkering is verhoogd met toepassing
      van [artikel 10 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref27],
      [artikel 9 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref28],
      [artikel 22 van de Wet op de arbeidsongeschiktheidsverzekering][ref29] of een combinatie van deze artikelen;

      d. een uitkering die naar aard en strekking overeenkomt met een uitkering op grond van een wettelijke vrijwillige
      verzekering of een particuliere verzekering tegen loonderving, toegekend aan een directeur-grootaandeelhouder,
      wiens arbeidsverhouding niet als een dienstbetrekking als bedoeld in [artikel 3][ref30], wordt beschouwd;

      e. afkoopsommen als bedoeld in de artikelen 32*c* , 32*d* en 32*p* van de Liquidatiewet invaliditeitswetten (*Stb.*
      1967, 307);

      f. een uitkering in verband met geleden immateriële schade, voorzover dit gelet op de aard en de hoogte van de
      uitkering verantwoord is;

      g. een vergoeding ingevolge het Reglement eenmalige silicosevergoeding oud-mijnwerkers;

      h. subsidies die op grond van [artikel 3 van de Wet inschakeling werkzoekenden][ref31] worden verstrekt voor het
      onverplicht, in georganiseerd verband, verrichten van onbetaalde maatschappelijk nuttige activiteiten, voorzover
      deze subsidies:

      1°. binnen een tijdvak van een kalendermaand minder bedragen dan het bedrag, genoemd in
      [artikel 43, tweede lid, onderdeel o, van de Algemene bijstandswet][ref32]; en,

      2°. worden verstrekt aan een langdurig werkloze als bedoeld in
      [artikel 1, eerste lid, onder e, van de Wet inschakeling werkzoekenden][ref33], dan wel aan een belanghebbende,
      die behoort tot een categorie van personen voor wie een of meer van de verplichtingen, bedoeld in
      [artikel 35, eerste lid][ref34], niet gelden op grond van de bij of krachtens de [artikelen 35, vijfde lid][ref35],
      of [36, eerste of tweede lid, van de wet][ref36] gestelde regels.

      3 Voor de toepassing van het eerste lid, onderdeel *c*, wordt onder pensioenregeling verstaan:

      a. een regeling die uitsluitend of nagenoeg uitsluitend ten doel heeft de verzorging van werknemers en gewezen
      werknemers bij invaliditeit en ouderdom en de verzorging van hun echtgenoten en van hun minderjarige kinderen en
      pleegkinderen door middel van pensioen;

      b. een door Onze Minister van Sociale Zaken en Werkgelegenheid ingevolge het bepaalde in
      [artikel 6, derde lid, van de Coördinatiewet Sociale Verzekering][ref37] aangewezen regeling.

      4 Onze Minister wijzigt de bedragen, genoemd in het eerste lid, onderdelen *s* en
      *t*, met ingang van een door hem te bepalen dag, voor zover de ontwikkeling van het in
      [artikel 55, eerste en tweede lid, van de Algemene bijstandswet][ref38] bedoelde netto-minimumloon daartoe
      aanleiding geeft.

      5 Onze Minister wijzigt de bedragen, genoemd in [artikel 3, tweede lid, onderdelen ][ref39], met ingang van een
      door hem te bepalen dag, voorzover de ontwikkeling van de in [artikel 43, tweede lid, onderdelen ][ref40] genoemde
      bedragen daartoe aanleiding geeft.


