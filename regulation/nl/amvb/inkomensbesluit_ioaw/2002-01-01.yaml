  - number: '8'
    text: |-
      1 Het inkomen uit of in verband met arbeid wordt in de maand waarover aanspraak op uitkering wordt gemaakt
      vastgesteld op het bedrag dat de werkloze werknemer en de echtgenoot over die maand verwerven of redelijkerwijs
      geacht kunnen worden te verwerven.

      2 Indien op grond van artikel 21, tweede lid, van de wet de uitkering over een kortere periode dan een maand wordt
      uitbetaald worden het inkomen en de uitkering eerst per maand vastgesteld, waarna de uitkering over een kortere
      periode naar evenredigheid wordt vastgesteld.

      3 Indien aannemelijk is dat een inkomensbestanddeel geen juiste maatstaf biedt voor de bepaling van het in het
      eerste lid bedoelde inkomen, wordt dat bestanddeel per maand vastgesteld op 1/3 onderscheidenlijk 1/12 van het
      bedrag, dat over drie maanden onderscheidenlijk een jaar is verworven.

      4 Indien winst als bedoeld in [artikel 6, eerste lid][ref1] wordt genoten, wordt het daaruit voortvloeiende
      inkomensbestanddeel per maand vastgesteld op 1/12 van de winst, genoten over het kalenderjaar of het niet met het
      kalenderjaar samenvallend boekjaar, voorafgaand aan de maand waarover aanspraak op uitkering wordt gemaakt.

      5 Indien de toepassing van de leden 1 tot en met 4, gelet op het tijdstip van verwerving van een
      inkomensbestanddeel, tot een kennelijk onredelijk resultaat leidt, bepalen burgemeester en wethouders op welke
      periode dat inkomensbestanddeel geacht moet worden betrekking te hebben en hoe dit geacht moet worden over deze
      periode te zijn verdeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004091#Artikel6
    url: https://wetten.overheid.nl/BWBR0004091/2002-01-01#Artikel8
