  - number: '9'
    text: |-
      In afwijking van artikel 3, eerste lid, en artikel 7, eerste lid, wordt de eenmalige uitkering op grond van artikel
      XV van de Wet premieheffing over uitkeringen (*Stb.* 1986, 639) niet als opbrengst van arbeid onderscheidenlijk als
      inkomen in verband met arbeid beschouwd.
    url: https://wetten.overheid.nl/BWBR0004091/2002-01-01#Artikel9
  - number: '10'
    text: Dit besluit treedt in werking met ingang van 1 januari 1987.
    url: https://wetten.overheid.nl/BWBR0004091/2002-01-01#Artikel10
  - number: '11'
    text: Dit besluit kan worden aangehaald als Inkomensbesluit IOAW.
    url: https://wetten.overheid.nl/BWBR0004091/2002-01-01#Artikel11
