  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 6 november 1986, Directoraat-
    Generaal Sociale Zekerheid, nr. SZ/SV/VV/SVV/86/09223;

    Gelet op artikel 7, tweede lid, van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze
    werknemers (Stb. 1986, 565);

    De Raad van State gehoord (advies van 15 december 1986, no. W12.86.0590);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 22 december 1986,
    Directoraat-Generaal Sociale Zekerheid, nr. SZ/SV/VV/SVV/86/10863;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004091/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder de wet: de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref1] (*Stb.* 1986, 565).


      [ref1]: https://wetten.overheid.nl/BWBR0004044
    url: https://wetten.overheid.nl/BWBR0004091/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004044
  - number: '2'
    text: |-
      Voor de toepassing van de wet wordt onder inkomen uit arbeid in het bedrijfs- en beroepsleven verstaan:

      a. opbrengst van arbeid;

      b. winst uit bedrijf en zelfstandig uitgeoefend beroep.
    url: https://wetten.overheid.nl/BWBR0004091/2002-01-01#Artikel2
  - number: '3'
    text: |-
      1 Onder opbrengst van arbeid als bedoeld in [artikel 2, onderdeel ][ref1], wordt, voor zover bedoelde arbeid in
      dienstbetrekking als bedoeld in [artikel 3][ref2] (*Stb.* 1966, 64) wordt verricht, verstaan het loon in de zin van
      die wet.

      2 In afwijking van het eerste lid wordt niet als opbrengst van arbeid beschouwd:

      a. een aanspraak om na verloop van tijd of onder een voorwaarde een of meer uitkeringen of verstrekkingen te
      ontvangen, voor zover deze niet wordt gedekt door stortingen van de werknemer;

      b. een uitkering op grond van de verplichte verzekering van de [Werkloosheidswet][ref3] (*Stb.* 1986, 566), de
      Ziektewet (*Stb.* 1967, 473) en de [Wet op de arbeidsongeschiktheidsverzekering][ref4] (*Stb.* 1977, 492), al dan
      niet vermeerderd met een toeslag op grond van de [Toeslagenwet][ref5] (*Stb.* 1986, 562);

      c. een aanvulling op de in [onderdeel ][ref6] genoemde uitkeringen;

      d. een bedrag tot € 135,42 per maand, alsmede de helft van het meerdere tot een maximum van in totaal € 246,12 per
      maand, beide voorzover de belanghebbende uitkering ontvangt en behoort tot een categorie van personen voor wie een
      of meer van de verplichtingen bedoeld in artikel 35, eerste lid, van de wet niet gelden op grond van het bepaalde
      bij of krachtens de artikelen 35, vijfde lid, of 36, tweede lid, van de wet;

      e. een bedrag tot € 135,42 per maand, alsmede de helft van het meerdere tot een maximum van in totaal € 246,12
      per maand, beide voorzover de belanghebbende uitkering ontvangt en behoort tot een categorie van personen die
      overeenkomstig een verordening van het gemeentebestuur om redenen van medische of sociale aard is aangewezen op het
      verrichten van arbeid in deeltijd.


      [ref1]: https://wetten.overheid.nl/BWBR0004091#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002126#Artikel3a
      [ref3]: https://wetten.overheid.nl/BWBR0004045
