        artikel: '63'
  - number: 7.2.d
    text: |-
      een uitkering die naar aard en strekking overeenkomt met een uitkering op grond van een wettelijke vrijwillige
      verzekering of een particuliere verzekering tegen loonderving, toegekend aan een directeur-grootaandeelhouder, die
      niet als werknemer in de zin van de [Wet financiering sociale verzekeringen][ref1] wordt beschouwd;


      [ref1]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017745
  - number: 7.2.e
    text: |-
      een uitkering in verband met geleden immateriële schade, voorzover dit gelet op de aard en de hoogte van de
      uitkering verantwoord is;
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel7
  - number: 7.2.f
    text: |-
      een eenmalige premie die door burgemeester en wethouders kan worden toegekend in het kader van een voorziening
      gericht op arbeidsinschakeling van ten hoogste€ 2.239,00 per kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel7
  - number: 7.2.g
    text: |-
      een kostenvergoeding voor het verrichten van vrijwilligerswerk van ten hoogste € 95,– per maand
      met een maximum van € 764,– per jaar, dan wel een kostenvergoeding voor het verrichten van
      vrijwilligerswerk in het kader van een voorziening gericht op arbeidsinschakeling als bedoeld in
      [artikel 7, eerste lid, onderdeel a, van de Wet werk en bijstand][ref1] van ten hoogste € 150,– per maand met een
      maximum van € 1.500,– per jaar;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
  - number: 7.2.h
    text: |-
      periodieke uitkeringen uit hoofde van een stamrecht, dat is verkregen uit een eenmalige uitkering welke na
      beëindiging van de dienstbetrekking aan de werknemer in verband met die beëindiging is toegekend, mits de werknemer
      aantoont dat de eenmalige uitkering door de werkgever betaalbaar is gesteld om naar eigen inzicht van de werknemer
      te besteden.
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel7
  - number: '7.3'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel c, wordt onder pensioenregeling verstaan hetgeen daaronder wordt
      verstaan voor de toepassing van de [Wet op de loonbelasting 1964][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: '7.4'
    text: |-
      Onze Minister wijzigt de bedragen, genoemd in het tweede lid, onderdelen h en i ,
      met ingang van een door hem te bepalen dag, voorzover de ontwikkeling van de in
      [artikel 31, tweede lid, onderdelen j en k, van de Wet werk en bijstand][ref1] genoemde bedragen, daartoe
      aanleiding geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel31
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '31'
  - number: '7.5'
    text: |-
      Onze Minister wijzigt het bedrag, genoemd in [artikel 3, tweede lid, onderdeel d][ref1],
      met ingang van een door hem te bepalen dag, voorzover de ontwikkeling van het in
      [artikel 31, tweede lid, onderdeel o, van de Wet werk en bijstand][ref2] genoemde bedrag daartoe aanleiding geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0004091#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel31
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel7
