preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 6 november 1986, Directoraat-
    Generaal Sociale Zekerheid, nr. SZ/SV/VV/SVV/86/09223;

    Gelet op artikel 7, tweede lid, van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze
    werknemers (Stb. 1986, 565);

    De Raad van State gehoord (advies van 15 december 1986, no. W12.86.0590);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 22 december 1986,
    Directoraat-Generaal Sociale Zekerheid, nr. SZ/SV/VV/SVV/86/10863;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel1
  - number: 1.a
    text: |-
      de wet: de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004044
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004044
  - number: 1.b
    text: 'een stamrecht: een recht op periodieke uitkeringen ter vervanging van gederfd of te derven loon.'
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel1
  - number: '2'
    text: 'Voor de toepassing van de wet wordt onder inkomen uit arbeid in het bedrijfs- en beroepsleven verstaan:'
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel2
  - number: 2.a
    text: opbrengst van arbeid;
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel2
  - number: 2.b
    text: winst uit bedrijf en zelfstandig uitgeoefend beroep.
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel2
  - number: '3.1'
    text: |-
      Onder opbrengst van arbeid als bedoeld in [artikel 2, onderdeel a][ref1], wordt, voorzover bedoelde arbeid door een
      werknemer in de zin van de [Wet financiering sociale verzekeringen][ref2] wordt verricht, verstaan het loon in de
      zin van [die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004091#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017745
      [ref3]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004091
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017745
      - id: ref3
        bwb_id: BWBR0017745
  - number: '3.2'
    text: 'In afwijking van het eerste lid wordt niet als opbrengst van arbeid beschouwd:'
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel3
  - number: 3.2.a
    text: |-
      een aanspraak om na verloop van tijd of onder een voorwaarde een of meer uitkeringen of verstrekkingen te
      ontvangen, voor zover deze niet wordt gedekt door stortingen van de werknemer;
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel3
  - number: 3.2.b
    text: |-
      een uitkering op grond van de verplichte verzekering van de [Werkloosheidswet][ref1] (*Stb.* 1986,
      566), de [Ziektewet][ref2] (*Stb.* 1967, 473) en de [Wet op de arbeidsongeschiktheidsverzekering][ref3]
      (*Stb.* 1977, 492), de [Wet werk en inkomen naar arbeidsvermogen][ref4] en een uitkering op grond van
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref5] aan de werknemer of gelijkgestelde,
      bedoeld in [artikel 3:6, eerste lid, van die wet][ref6], al dan niet vermeerderd met een toeslag op grond van de
      [Toeslagenwet][ref7] (*Stb.* 1986, 562);


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0019057
      [ref5]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref6]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref7]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0002524
      - id: ref4
        bwb_id: BWBR0019057
      - id: ref5
        bwb_id: BWBR0013008
        paragraaf: '1'
      - id: ref6
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref7
        bwb_id: BWBR0004043
  - number: 3.2.c
    text: een aanvulling op de in onderdeel b genoemde uitkeringen;
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel3
  - number: 3.2.d
    text: |-
      opbrengst van arbeid gedurende ten hoogste zes aaneengesloten maanden tot 25 procent van deze opbrengst, met een
      maximum van € 291,04 per maand, voor zover een uitkering wordt ontvangen en dit naar het oordeel van burgemeester
      en wethouders bijdraagt aan zijn arbeidsinschakeling.
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel3
  - number: '4.1'
    text: |-
      Onder opbrengst van arbeid als bedoeld in [artikel 2, onderdeel a][ref1], worden, voor zover
      bedoelde arbeid wordt verricht in dienstbetrekking doch niet door een werknemer in de zin van de
      [Wet financiering sociale verzekeringen][ref2], verstaan de gelden en alle andere voordelen welke als beloning voor
      die arbeid worden genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0004091#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004091
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017745
  - number: '4.2'
    text: |-
      Ten aanzien van de gelden en alle andere voordelen uit de dienstbetrekking, bedoeld in het eerste lid, is het
      bepaalde bij of krachtens [artikel 16 van de Wet financiering sociale verzekeringen][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel16
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '16'
  - number: '4.3'
    text: |-
      In afwijking van het bepaalde in het tweede lid wordt niet als opbrengst van arbeid beschouwd een uitkering wegens
      derving van looninkomen.
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel4
  - number: '5.1'
    text: |-
      Onder opbrengst van arbeid als bedoeld in [artikel 2, onderdeel a][ref1], wordt, voorzover bedoelde arbeid niet in
      dienstbetrekking wordt verricht, verstaan het belastbaar loon uit tegenwoordige arbeid of belastbaar resultaat uit
      overige werkzaamheden, bedoeld in [hoofdstuk 3][ref2] en [7 van de Wet inkomstenbelasting 2001][ref3], behoudens
      voorzover het een werkzaamheid betreft als bedoeld in de [artikelen 3.91, eerste lid, onderdelen a en b][ref4],
      en [3.92 van die wet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0004091#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk7
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004091
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011353
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0011353
        hoofdstuk: '7'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '5.2'
    text: |-
      Het bepaalde bij of krachtens [artikel 13 van de Wet op de loonbelasting 1964][ref1] is met betrekking tot het
      bepaalde in het eerste lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel13
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '13'
  - number: '6.1'
    text: |-
      Onder winst als bedoeld in [artikel 2, onderdeel b][ref1], wordt verstaan de belastbare winst uit
      onderneming, bedoeld in [paragraaf 3.2.1 van de Wet inkomstenbelasting 2001][ref2], vermeerderd met de
      ondernemersaftrek, bedoeld in [paragraaf 3.2.4 van die wet][ref3], en de MKB-winstvrijstelling, bedoeld
      in [paragraaf 3.2.5 van die wet][ref4], met dien verstande dat de bestanddelen van de winst, bedoeld in
      [artikel 3.78, derde lid, onderdelen a, b en c, van die wet][ref5], niet geacht worden te behoren tot die winst.


      [ref1]: https://wetten.overheid.nl/BWBR0004091#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Paragraaf3.2.1
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Paragraaf3.2.4
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Paragraaf3.2.5
      [ref5]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004091
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011353
        paragraaf: 3.2.1
      - id: ref3
        bwb_id: BWBR0011353
        paragraaf: 3.2.4
      - id: ref4
        bwb_id: BWBR0011353
        paragraaf: 3.2.5
      - id: ref5
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '6.2'
    text: |-
      Indien de berekening van de in het eerste lid bedoelde winst leidt tot een negatief bedrag, wordt die winst op
      nihil gesteld.
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel6
  - number: '7.1'
    text: 'Voor de toepassing van de wet wordt onder inkomen in verband met arbeid in het bedrijfs- of beroepsleven verstaan:'
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel7
  - number: 7.1.a
    text: |-
      een uitkering of inkomensvoorziening op grond van de verplichte verzekering van de [Werkloosheidswet][ref1],
      de [Ziektewet][ref2], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3], de
      [Wet werk en arbeidsondersteuning jonggehandicapten][ref4], de [Wet op de arbeidsongeschiktheidsverzekering][ref5]
      of de [Wet werk en inkomen naar arbeidsvermogen][ref6], een uitkering op grond van
      de [Wet arbeidsongeschiktheidsvoorziening militairen][ref7], een uitkering op grond
      van de [Wet inkomensvoorziening oudere werklozen][ref8] of een uitkering op grond van
      [hoofdstuk 3, afdeling 2, van de Wet arbeid en zorg][ref9] aan de werknemer of gelijkgestelde, bedoeld in
      [artikel 3:6, eerste lid, van die wet][ref10] of aan de zelfstandige of beroepsbeoefenaar op arbeidsovereenkomst,
      bedoeld in [artikel 3:17 van die wet][ref11];


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0008656
      [ref4]: https://wetten.overheid.nl/BWBR0008657
      [ref5]: https://wetten.overheid.nl/BWBR0002524
      [ref6]: https://wetten.overheid.nl/BWBR0019057
      [ref7]: https://wetten.overheid.nl/BWBR0002822
      [ref8]: https://wetten.overheid.nl/BWBR0024394
      [ref9]: https://wetten.overheid.nl/BWBR0013008#Afdeling2
      [ref10]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref11]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0001888
