        bwb_id: BWBR0015703
        artikel: '31'
  - number: '8.1'
    text: |-
      Het inkomen uit of in verband met arbeid wordt in de maand waarover aanspraak op uitkering wordt gemaakt
      vastgesteld op het bedrag dat de werkloze werknemer en de echtgenoot over die maand verwerven of redelijkerwijs
      geacht kunnen worden te verwerven.
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel8
  - number: '8.2'
    text: |-
      Indien op grond van artikel 21, tweede lid, van de wet de uitkering over een kortere periode dan een maand wordt
      uitbetaald worden het inkomen en de uitkering eerst per maand vastgesteld, waarna de uitkering over een kortere
      periode naar evenredigheid wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel8
  - number: '8.3'
    text: |-
      Indien aannemelijk is dat een inkomensbestanddeel geen juiste maatstaf biedt voor de bepaling van het in het eerste
      lid bedoelde inkomen, wordt dat bestanddeel per maand vastgesteld op 1/3 onderscheidenlijk 1/12 van het bedrag, dat
      over drie maanden onderscheidenlijk een jaar is verworven.
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel8
  - number: '8.4'
    text: |-
      Indien winst als bedoeld in [artikel 6, eerste lid][ref1] wordt genoten, wordt het daaruit voortvloeiende
      inkomensbestanddeel per maand vastgesteld op 1/12 van de winst, genoten over het kalenderjaar of het niet met het
      kalenderjaar samenvallend boekjaar, voorafgaand aan de maand waarover aanspraak op uitkering wordt gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004091#Artikel6
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004091
        artikel: '6'
        paragraaf: '2'
  - number: '8.5'
    text: |-
      Indien de toepassing van de leden 1 tot en met 4, gelet op het tijdstip van verwerving van een inkomensbestanddeel,
      tot een kennelijk onredelijk resultaat leidt, bepalen burgemeester en wethouders op welke periode dat
      inkomensbestanddeel geacht moet worden betrekking te hebben en hoe dit geacht moet worden over deze periode te
      zijn verdeeld.
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel8
  - number: '9'
    text: |-
      In afwijking van artikel 3, eerste lid, en artikel 7, eerste lid, wordt de eenmalige uitkering op grond van artikel
      XV van de Wet premieheffing over uitkeringen (*Stb.* 1986, 639) niet als opbrengst van arbeid onderscheidenlijk als
      inkomen in verband met arbeid beschouwd.
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel9
  - number: 9a
    text: |-
      In het eerste jaar waarop de [Wet werk en bijstand][ref1] betrekking heeft, blijft
      [artikel 3, tweede lid, onderdelen d en e][ref2], van toepassing op de belanghebbende ten aanzien van
      wie op de dag voorafgaand aan de inwerkingtreding van de [Wet werk en bijstand][ref3] op grond van
      [artikel 3, tweede lid, onderdelen d of e][ref4], een bedrag niet als opbrengst van arbeid werd beschouwd, met dien
      verstande dat dat bedrag wordt vermenigvuldigd met:


