        bwb_id: BWBR0013008
        afdeling: '2'
      - id: ref10
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref11
        bwb_id: BWBR0013008
        artikel: '3'
  - number: 7.1.b
    text: |-
      een uitkering op grond van een particuliere verzekering wegens derving van inkomen, welke ten behoeve van de
      werknemer in het kader van een individuele of collectieve arbeidsovereenkomst is afgesloten;
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel7
  - number: 7.1.c
    text: een uitkering op grond van een pensioenregeling, voor zover niet begrepen onder a;
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel7
  - number: 7.1.d
    text: |-
      een uitkering op grond van een buitenlandse wettelijke sociale verzekeringsregeling, voor zover niet begrepen
      onder a, met uitzondering van een uitkering, die naar aard en strekking overeenkomt met een uitkering
      op grond van de [Algemene Kinderbijslagwet][ref1] of met zorg waarop aanspraak bestaat ingevolge een
      zorgverzekering als bedoeld in [artikel 1, onderdeel d, van de Zorgverzekeringswet][ref2] of op grond van
      [artikel 6 van de Algemene Wet Bijzondere Ziektekosten][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002368
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002368
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0002614
        artikel: '6'
  - number: 7.1.e
    text: |-
      een uitkering op grond van een regeling voor vervroegde uittreding of een regeling, die naar aard en strekking
      daarmee overeenkomt;
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel7
  - number: 7.1.f
    text: een uitkering op grond van een regeling voor functioneel leeftijdsontslag;
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel7
  - number: 7.1.g
    text: loon dat uit vroegere dienstbetrekking wordt genoten, voor zover niet begrepen onder a, b, c, d, e of f;
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel7
  - number: 7.1.h
    text: |-
      een toeslag op grond van de [Toeslagenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004043
  - number: 7.1.i
    text: |-
      een uitkering ingevolge de [Algemene nabestaandenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 7.1.j
    text: |-
      een uitkering op grond van de [Algemene Ouderdomswet][ref1] (Stb. 1985, 181);


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 7.1.k
    text: |-
      een basisbeurs en een aanvullende beurs op grond van de [Wet studiefinanciering 2000][ref1], alsmede een beurs die
      naar aard en strekking daarmee overeenkomt;


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: 7.1.l
    text: |-
      een bedrijfsbeëindigingsvergoeding van de door Onze Minister van Economische Zaken opgerichte Stichting
      ontwikkeling en sanering midden- en kleinbedrijf; en
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel7
  - number: 7.1.m
    text: |-
      een maandelijkse bedrijfsbeëindigingsvergoeding van de door Onze Minister van Landbouw en Visserij opgerichte
      Stichting ontwikkelings- en saneringsfonds voor de landbouw.
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel7
  - number: '7.2'
    text: 'In afwijking van het eerste lid wordt niet als inkomen in verband met arbeid beschouwd:'
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel7
  - number: 7.2.a
    text: |-
      een aanspraak om na verloop van tijd onder een voorwaarde een of meer uitkeringen of verstrekkingen te ontvangen,
      voor zover deze niet wordt gedekt door stortingen van degene die het desbetreffende inkomen geniet;
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel7
  - number: 7.2.b
    text: |-
      een eenmalige uitkering welke na beëindiging van de dienstbetrekking aan een werknemer in verband met die
      beëindiging wordt betaald;
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel7
  - number: 7.2.c
    text: |-
      81% van het bedrag waarmee de arbeidsongeschiktheidsuitkering of inkomensvoorziening is verhoogd
      met toepassing van [artikel 10 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1],
      [artikel 2:51][ref2] of [3:9 van de Wet werk en arbeidsondersteuning jonggehandicapten][ref3],
      [artikel 22 van de Wet op de arbeidsongeschiktheidsverzekering][ref4], [artikel 53][ref5] of
      [63 van de Werk en inkomen naar arbeidsvermogen][ref6] of een combinatie van deze artikelen;


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0008657#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel22
      [ref5]: https://wetten.overheid.nl/BWBR0019057#Artikel53
      [ref6]: https://wetten.overheid.nl/BWBR0019057#Artikel63
    url: https://wetten.overheid.nl/BWBR0004091/2010-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '10'
