  - number: '5'
    text: |-
      1 Onder opbrengst van arbeid als bedoeld in [artikel 2, onderdeel a][ref1], wordt, voorzover bedoelde
      arbeid niet in dienstbetrekking wordt verricht, verstaan het belastbaar loon uit tegenwoordige
      arbeid of belastbaar resultaat uit overige werkzaamheden, bedoeld in [hoofdstuk 3][ref2] en
      [7 van de Wet inkomstenbelasting 2001][ref3], behoudens voorzover het een werkzaamheid betreft als bedoeld in de
      [artikelen 3.91, eerste lid, onderdelen a en b][ref4], en [3.92 van die wet][ref5].

      2 Het bepaalde bij of krachtens [artikel 13 van de Wet op de loonbelasting 1964][ref6] is met betrekking tot het
      bepaalde in het eerste lid van overeenkomstige toepassing.


