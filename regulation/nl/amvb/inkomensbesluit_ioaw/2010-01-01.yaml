  - number: '4'
    text: |-
      1 Onder opbrengst van arbeid als bedoeld in [artikel 2, onderdeel a][ref1], worden, voor zover
      bedoelde arbeid wordt verricht in dienstbetrekking doch niet door een werknemer in de zin van de
      [Wet financiering sociale verzekeringen][ref2], verstaan de gelden en alle andere voordelen welke als beloning voor
      die arbeid worden genoten.

      2 Ten aanzien van de gelden en alle andere voordelen uit de dienstbetrekking, bedoeld in het eerste lid, is het
      bepaalde bij of krachtens [artikel 16 van de Wet financiering sociale verzekeringen][ref3] van overeenkomstige
      toepassing.

      3 In afwijking van het bepaalde in het tweede lid wordt niet als opbrengst van arbeid beschouwd een uitkering
      wegens derving van looninkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004091#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017745
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel16
