  - number: '7'
    text: |-
      1 Voor de toepassing van de wet wordt onder inkomen in verband met arbeid in het bedrijfs- of beroepsleven
      verstaan:

      a. een uitkering of inkomensvoorziening op grond van de verplichte verzekering van de [Werkloosheidswet][ref1],
      de [Ziektewet][ref2], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3], de
      [Wet werk en arbeidsondersteuning jonggehandicapten][ref4], de [Wet op de arbeidsongeschiktheidsverzekering][ref5]
      of de [Wet werk en inkomen naar arbeidsvermogen][ref6], een uitkering op grond van
      de [Wet arbeidsongeschiktheidsvoorziening militairen][ref7], een uitkering op grond
      van de [Wet inkomensvoorziening oudere werklozen][ref8] of een uitkering op grond van
      [hoofdstuk 3, afdeling 2, van de Wet arbeid en zorg][ref9] aan de werknemer of gelijkgestelde, bedoeld in
      [artikel 3:6, eerste lid, van die wet][ref10] of aan de zelfstandige of beroepsbeoefenaar op arbeidsovereenkomst,
      bedoeld in [artikel 3:17 van die wet][ref11];

      b. een uitkering op grond van een particuliere verzekering wegens derving van inkomen, welke ten behoeve van de
      werknemer in het kader van een individuele of collectieve arbeidsovereenkomst is afgesloten;

      c. een uitkering op grond van een pensioenregeling, voor zover niet begrepen onder a;

      d. een uitkering op grond van een buitenlandse wettelijke sociale verzekeringsregeling, voor zover niet
      begrepen onder a, met uitzondering van een uitkering, die naar aard en strekking overeenkomt met een uitkering
      op grond van de [Algemene Kinderbijslagwet][ref12] of met zorg waarop aanspraak bestaat ingevolge een
      zorgverzekering als bedoeld in [artikel 1, onderdeel d, van de Zorgverzekeringswet][ref13] of op grond van
      [artikel 6 van de Algemene Wet Bijzondere Ziektekosten][ref14];

      e. een uitkering op grond van een regeling voor vervroegde uittreding of een regeling, die naar aard en strekking
      daarmee overeenkomt;

      f. een uitkering op grond van een regeling voor functioneel leeftijdsontslag;

      g. loon dat uit vroegere dienstbetrekking wordt genoten, voor zover niet begrepen onder a, b, c, d, e of f;

      h. een toeslag op grond van de [Toeslagenwet][ref15];

      i. een uitkering ingevolge de [Algemene nabestaandenwet][ref16];

      j. een uitkering op grond van de [Algemene Ouderdomswet][ref17] (Stb. 1985, 181);

      k. een basisbeurs en een aanvullende beurs op grond van de [Wet studiefinanciering 2000][ref18], alsmede een beurs
      die naar aard en strekking daarmee overeenkomt;

      l. een bedrijfsbeëindigingsvergoeding van de door Onze Minister van Economische Zaken opgerichte Stichting
      ontwikkeling en sanering midden- en kleinbedrijf; en

      m. een maandelijkse bedrijfsbeëindigingsvergoeding van de door Onze Minister van Landbouw en Visserij opgerichte
      Stichting ontwikkelings- en saneringsfonds voor de landbouw.

      2 In afwijking van het eerste lid wordt niet als inkomen in verband met arbeid beschouwd:

      a. een aanspraak om na verloop van tijd onder een voorwaarde een of meer uitkeringen of verstrekkingen te
      ontvangen, voor zover deze niet wordt gedekt door stortingen van degene die het desbetreffende inkomen geniet;

      b. een eenmalige uitkering welke na beëindiging van de dienstbetrekking aan een werknemer in verband met die
      beëindiging wordt betaald;

      c. 81% van het bedrag waarmee de arbeidsongeschiktheidsuitkering of inkomensvoorziening is verhoogd
      met toepassing van [artikel 10 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref19],
      [artikel 2:51][ref20] of [3:9 van de Wet werk en arbeidsondersteuning jonggehandicapten][ref21],
      [artikel 22 van de Wet op de arbeidsongeschiktheidsverzekering][ref22], [artikel 53][ref23] of
      [63 van de Werk en inkomen naar arbeidsvermogen][ref24] of een combinatie van deze artikelen;

      d. een uitkering die naar aard en strekking overeenkomt met een uitkering op grond van een wettelijke vrijwillige
      verzekering of een particuliere verzekering tegen loonderving, toegekend aan een directeur-grootaandeelhouder, die
      niet als werknemer in de zin van de [Wet financiering sociale verzekeringen][ref25] wordt beschouwd;

      e. een uitkering in verband met geleden immateriële schade, voorzover dit gelet op de aard en de hoogte van de
      uitkering verantwoord is;

      f. een eenmalige premie die door burgemeester en wethouders kan worden toegekend in het kader van een voorziening
      gericht op arbeidsinschakeling van ten hoogste € 2.229,00 per kalenderjaar;

      g. een kostenvergoeding voor het verrichten van vrijwilligerswerk van ten hoogste € 95,– per
      maand met een maximum van € 764,– per jaar, dan wel een kostenvergoeding voor het verrichten van
      vrijwilligerswerk in het kader van een voorziening gericht op arbeidsinschakeling als bedoeld in
      [artikel 7, eerste lid, onderdeel a, van de Wet werk en bijstand][ref26] van ten hoogste € 150,– per maand met een
      maximum van € 1.500,– per jaar;

      h. periodieke uitkeringen uit hoofde van een stamrecht, dat is verkregen uit een eenmalige uitkering welke na
      beëindiging van de dienstbetrekking aan de werknemer in verband met die beëindiging is toegekend, mits de werknemer
      aantoont dat de eenmalige uitkering door de werkgever betaalbaar is gesteld om naar eigen inzicht van de werknemer
      te besteden.

      3 Voor de toepassing van het eerste lid, onderdeel c, wordt onder pensioenregeling verstaan hetgeen daaronder wordt
      verstaan voor de toepassing van de [Wet op de loonbelasting 1964][ref27].

      4 Onze Minister wijzigt de bedragen, genoemd in het tweede lid, onderdelen h en
      i , met ingang van een door hem te bepalen dag, voorzover de ontwikkeling van de in
      [artikel 31, tweede lid, onderdelen j en k, van de Wet werk en bijstand][ref28] genoemde bedragen, daartoe
      aanleiding geeft.

      5 Onze Minister wijzigt het bedrag, genoemd in [artikel 3, tweede lid, onderdeel d][ref29],
      met ingang van een door hem te bepalen dag, voorzover de ontwikkeling van het in
      [artikel 31, tweede lid, onderdeel o, van de Wet werk en bijstand][ref30] genoemde bedrag daartoe aanleiding geeft.


