  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 6 november 1986, Directoraat-
    Generaal Sociale Zekerheid, nr. SZ/SV/VV/SVV/86/09223;

    Gelet op artikel 7, tweede lid, van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze
    werknemers (Stb. 1986, 565);

    De Raad van State gehoord (advies van 15 december 1986, no. W12.86.0590);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 22 december 1986,
    Directoraat-Generaal Sociale Zekerheid, nr. SZ/SV/VV/SVV/86/10863;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004091/2010-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. de wet: de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref1];

      b. een stamrecht: een recht op periodieke uitkeringen ter vervanging van gederfd of te derven loon.


      [ref1]: https://wetten.overheid.nl/BWBR0004044
    url: https://wetten.overheid.nl/BWBR0004091/2010-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004044
  - number: '2'
    text: |-
      Voor de toepassing van de wet wordt onder inkomen uit arbeid in het bedrijfs- en beroepsleven verstaan:

      a. opbrengst van arbeid;

      b. winst uit bedrijf en zelfstandig uitgeoefend beroep.
    url: https://wetten.overheid.nl/BWBR0004091/2010-01-01#Artikel2
  - number: '3'
    text: |-
      1 Onder opbrengst van arbeid als bedoeld in [artikel 2, onderdeel a][ref1], wordt, voorzover bedoelde arbeid door
      een werknemer in de zin van de [Wet financiering sociale verzekeringen][ref2] wordt verricht, verstaan het loon in
      de zin van [die wet][ref3].

      2 In afwijking van het eerste lid wordt niet als opbrengst van arbeid beschouwd:

      a. een aanspraak om na verloop van tijd of onder een voorwaarde een of meer uitkeringen of verstrekkingen te
      ontvangen, voor zover deze niet wordt gedekt door stortingen van de werknemer;

      b. een uitkering op grond van de verplichte verzekering van de [Werkloosheidswet][ref4] (*Stb.* 1986,
      566), de [Ziektewet][ref5] (*Stb.* 1967, 473) en de [Wet op de arbeidsongeschiktheidsverzekering][ref6]
      (*Stb.* 1977, 492), de [Wet werk en inkomen naar arbeidsvermogen][ref7] en een uitkering op grond van
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref8] aan de werknemer of gelijkgestelde,
      bedoeld in [artikel 3:6, eerste lid, van die wet][ref9], al dan niet vermeerderd met een toeslag op grond van de
      [Toeslagenwet][ref10] (*Stb.* 1986, 562);

      c. een aanvulling op de in onderdeel b genoemde uitkeringen;

      d. opbrengst van arbeid gedurende ten hoogste zes aaneengesloten maanden tot 25 procent van deze opbrengst, met een
      maximum van € 291,04 per maand, voor zover een uitkering wordt ontvangen en dit naar het oordeel van burgemeester
      en wethouders bijdraagt aan zijn arbeidsinschakeling.


