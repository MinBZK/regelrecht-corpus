preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Justitie van 26 februari 2001, 5082413/01/6, gedaan in overeenstemming met
    de Staatssecretaris van Volksgezondheid, Welzijn en Sport, Onze Minister van Sociale Zaken en Werkgelegenheid en de
    Staatssecretaris van Sociale Zaken en Werkgelegenheid, J. F. Hoogervorst;

    Gelet op de artikelen 3, tweede lid, 7, vijfde lid, 8, derde lid, 20, tweede lid, 21, tweede lid, 30, vijfde lid,
    31, vijfde lid, 37, tweede lid, 46, vierde lid, 47, vijfde lid, 52, vijfde lid, 63, tweede lid , 66, vierde lid,
    70, tweede lid, en 72, vierde lid, van de Beginselenwet justitiële jeugdinrichtingen, de artikelen 66, tweede lid,
    67, eerste lid en 68 van de Wet op de jeugdhulpverlening, artikel 77ff, tweede lid, van het Wetboek van Strafrecht,
    artikel 15 van de Gratiewet, artikel 19b, vierde lid, van de Ziektewet, de artikelen 19a, vijfde lid, en 47b,
    vierde lid, van de Wet op de arbeidsongeschiktheidsverzekering, de artikelen 7b, vijfde lid, en 21b, vierde lid,
    van de Wet arbeidsongeschiktheidsverzekering zelfstandigen, de artikelen 6b, vijfde lid, en 20a, vierde lid, van
    de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten, artikel 19, achtste lid, van de Werkloosheidswet,
    artikel 32c, derde lid, van de Algemene nabestaandenwet, artikel 9, vierde lid, van de Algemene bijstandswet,
    artikel 6, vierde lid, van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze
    werknemers, artikel 6, zesde lid, van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen
    zelfstandigen, en artikel 5, derde lid, van de Wet inkomensvoorziening kunstenaars en artikel 16, zesde lid, van de
    Arbeidsomstandighedenwet 1998;

    De Raad van State gehoord (advies van 7 mei 2001, No. W03.01.0116/I);

    Gezien het nader rapport van Onze Minister van Justitie en de Staatssecretaris van Justitie van 3 juli 2001,
    5102134/01/6, uitgebracht in overeenstemming met de Staatssecretaris van Volksgezondheid, Welzijn en Sport, Onze
    Minister van Sociale Zaken en Werkgelegenheid en de Staatssecretaris van Sociale Zaken en Werkgelegenheid, J. F.
    Hoogervorst;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel1
  - number: 1.1.a
    text: |-
      de wet: de [Beginselenwet justitiële jeugdinrichtingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011756
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011756
  - number: 1.1.b
    text: |-
      executie-indicator: de aantekening van het openbaar ministerie bij het aanbieden van een vonnis ter executie aan
      Onze Minister waarin wordt aangegeven dat het openbaar ministerie wil adviseren over te nemen beslissingen inzake
      de verschillende vormen van te verlenen vrijheden en deelname aan een scholings- en trainingsprogramma aan de
      betrokken jeugdige;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel1
  - number: 1.1.c
    text: 'jeugdreclassering: gecertificeerde instelling, bij de uitvoering van jeugdreclassering;'
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel1
  - number: 1.1.d
    text: |-
      reclassering: een reclasseringsinstelling als bedoeld in
      [artikel 1, onder b, van de Reclasseringsregeling 1995][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007120#Artikel1
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007120
        artikel: '1'
  - number: 1.1.e
    text: |-
      raad voor de kinderbescherming: de raad, bedoeld in
      [artikel 238, eerste lid, van Boek 1 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel238
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '238'
  - number: 1.1.f
    text: |-
      gecertificeerde instelling: gecertificeerde instelling als bedoeld in [artikel 1.1 van de Jeugdwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: '1.2'
    text: |-
      Onder een jeugdige wordt voor de uitvoering van dit besluit mede verstaan een jongvolwassene die
      ten tijde van het plegen van een strafbaar feit de leeftijd van 18 jaren wel maar de leeftijd
      van 23 jaren nog niet had bereikt en ten aanzien van wie recht is gedaan overeenkomstig de
      [artikelen 77g tot en met 77hh van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77aa
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77aa
  - number: '2.1'
    text: |-
      Een scholings- en trainingsprogramma omvat minimaal 26 uur per week aan activiteiten waaraan door de deelnemer aan
      dat scholings- en trainingsprogramma wordt deelgenomen.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel2
  - number: '2.2'
    text: 'De activiteiten in een scholings- en trainingsprogramma zijn gericht op:'
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel2
  - number: 2.2.a
    text: het aanleren van bepaalde sociale vaardigheden,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel2
  - number: 2.2.b
    text: het bieden van onderwijs,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel2
  - number: 2.2.c
    text: het vergroten van de kans op arbeid na het einde van de vrijheidsstraf of de vrijheidsbenemende maatregel,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel2
  - number: 2.2.d
    text: |-
      het bieden van bijzondere zorg aan de deelnemer, zoals verslavingszorg, geestelijke gezondheidszorg of
      verstandelijk gehandicaptenzorg,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel2
  - number: 2.2.e
    text: het invullen van de vrije tijd, of
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel2
  - number: 2.2.f
    text: |-
      geven op andere wijze invulling aan het met handhaving van het karakter van de vrijheidsstraf of de
      vrijheidsbenemende maatregel aanwenden van de tenuitvoerlegging daarvan aan de opvoeding dan wel behandeling van de
      jeugdige en de voorbereiding van diens terugkeer in de maatschappij.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel2
  - number: '2.3'
    text: |-
      Van een scholings- en trainingsprogramma wordt een schriftelijke omschrijving gemaakt. Deze omvat in ieder
      geval een beschrijving van de activiteiten, een regeling van de verantwoordelijkheid voor de uitvoering van het
      programma, de begeleiding van en het toezicht op de deelnemer aan het scholings- en trainingsprogramma, de melding
      van bijzondere voorvallen en de wijze en de frequentie van rapporteren over de deelnemer aan het scholings- en
      trainingsprogramma. Wanneer het scholings- en trainingsprogramma voor meerdere jeugdigen is bedoeld wordt tevens de
      doelgroep van het programma omschreven.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel2
  - number: '2.4'
    text: |-
      Onze Minister kan nadere regels stellen over de procedure voor de erkenning van een scholings- en
      trainingsprogramma en over de kwaliteitseisen waaraan een scholings- en trainingsprogramma moet voldoen.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel2
  - number: '3'
    text: 'Voor deelname aan een scholings- en trainingsprogramma komen niet in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel3
  - number: 3.a
    text: |-
      tot vrijheidsstraf veroordeelde jeugdigen ten aanzien van wie nog een andere strafvervolging is ingesteld, waarbij
      een vrijheidsstraf of vrijheidsbenemende maatregel is gevorderd;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel3
  - number: 3.b
    text: |-
      tot vrijheidsstraf veroordeelde jeugdigen ten aanzien van wie de tenuitvoerlegging van een tevens opgelegde
      maatregel van plaatsing in een inrichting voor jeugdigen nog moet aanvangen;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel3
  - number: 3.c
    text: voorlopig gehechte jeugdigen;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel3
  - number: 3.d
    text: |-
      jeugdigen ten aanzien van wie vaststaat dat zij, na de tenuitvoerlegging van de vrijheidsstraf of
      vrijheidsbenemende maatregel, Nederland dienen te verlaten dan wel zullen worden uitgezet of uitgeleverd;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel3
  - number: 3.e
    text: |-
      de jeugdigen, bedoeld in [artikel 8, eerste lid, onderdeel c, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel8
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '8'
  - number: '4.1'
    text: |-
      Een persoon ten aanzien van wie de tenuitvoerlegging van een vrijheidsstraf in de inrichting plaatsvindt, neemt
      deel aan een scholings- en trainingsprogramma, indien:
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel4
  - number: 4.1.a
    text: de jeugdige tenminste tweederde van de hem opgelegde onherroepelijke vrijheidsstraf heeft ondergaan, en
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel4
  - number: 4.1.b
    text: het strafrestant minimaal drie maanden bedraagt.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel4
  - number: '4.2'
    text: Het scholings- en trainingsprogramma, bedoeld in het eerste lid, heeft een maximale duur van drie maanden.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel4
  - number: '5.1'
    text: |-
      Een tot de maatregel van plaatsing in een inrichting voor jeugdigen veroordeelde jeugdige kan in aanmerking komen
      voor deelname aan een scholings- en trainingsprogramma.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel5
  - number: '5.2'
    text: 'Het scholings- en trainingsprogramma, bedoeld in het eerste lid, neemt op zijn vroegst een aanvang:'
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel5
  - number: 5.2.a
    text: drie maanden voor het voorwaardelijke einde van de maatregel die maximaal drie jaren duurt;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel5
  - number: 5.2.b
    text: |-
      zes maanden voor het voorwaardelijk einde van de maatregel die meer dan drie jaar en minder dan vijf jaren duurt,
      of;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel5
  - number: 5.2.c
    text: een jaar voor het voorwaardelijk einde van de maatregel die maximaal zeven jaren duurt.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel5
  - number: '5.3'
    text: In bijzondere gevallen kan voor een langere duur worden deelgenomen aan een scholings- en trainingsprogramma.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel5
  - number: '6'
    text: |-
      Jeugdigen die op grond van [artikel 6.2.2 van de Jeugdwet][ref1] in een inrichting verblijven komen niet in
      aanmerking voor deelname aan een scholings- en trainingsprogramma, tenzij de deelname aan dit programma reeds een
      aanvang had genomen voor het tijdstip waarop de in artikel 6.2.2, tweede lid, van de Jeugdwet bedoelde machtiging
      werd verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
  - number: '8.1'
    text: |-
      De directeur vraagt een machtiging tot deelname aan een scholings- en trainingsprogramma als bedoeld in
      [artikel 3 van de wet][ref1] schriftelijk aan bij Onze Minister. De directeur doet in zijn aanvraag verslag
      van de aspecten, bedoeld in [artikel 9, eerste en tweede lid][ref2], en vermeldt de voorwaarden bedoeld in
      [artikel 12, eerste lid][ref3]. De aanvraag vermeldt voorts de duur van de deelname aan het scholings- en
      trainingsprogramma.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012647#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0012647#Artikel12
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0012647
        artikel: '9'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0012647
        artikel: '12'
        hoofdstuk: '2'
  - number: '8.2'
    text: |-
      De directeur voegt bij de aanvraag het advies van het openbaar ministerie, indien de aanvraag betrekking heeft op
      een jeugdige ten aanzien van wie het openbaar ministerie een executie-indicator heeft gegeven. De aanvraag wordt
      opgesteld in samenwerking met de jeugdreclassering, dan wel de reclassering in het arrondissement waarin aan het
      scholings- en trainingsprogramma wordt deelgenomen. De raad voor de kinderbescherming wordt door de directeur in de
      gelegenheid gesteld advies uit te brengen.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel8
  - number: '8.3'
    text: De directeur overlegt met de jeugdige alvorens hij zijn aanvraag opstelt.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel8
  - number: '8.4'
    text: |-
      Bij het opstellen van de aanvraag betrekt de directeur zo veel mogelijk de ouders of voogd, stiefouder of
      pleegouders, tenzij:
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel8
  - number: 8.4.a
    text: deze te kennen geven hierbij geen rol te willen vervullen, of
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel8
  - number: 8.4.b
    text: zwaarwegende belangen van de jeugdige zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel8
  - number: '8.5'
    text: |-
      Onze Minister beslist zo spoedig mogelijk, doch uiterlijk binnen vier weken, op de aanvraag van de directeur.
      Onze Minister betrekt in zijn beslissing de aspecten, bedoeld in [artikel 9, eerste en tweede lid][ref1], en de
      voorwaarden, bedoeld in [artikel 12, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0012647#Artikel12
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: '9'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0012647
        artikel: '12'
        hoofdstuk: '2'
  - number: '8.6'
    text: 'Onze Minister kan een machtiging tot deelname aan het programma weigeren, indien:'
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel8
  - number: 8.6.a
    text: de aanvraag niet voldoet aan de eisen gesteld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel8
  - number: 8.6.b
    text: |-
      naar zijn oordeel het karakter van vrijheidsstraf of vrijheidsbenemende maatregel met de wijze waarop het programma
      is vormgegeven onverenigbaar is, of;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel8
  - number: 8.6.c
    text: dat het programma naar zijn oordeel niet zal bijdragen aan een geslaagde terugkeer in de samenleving.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel8
  - number: '8.7'
    text: |-
      De beslissing wordt schriftelijk medegedeeld aan de directeur en de jeugdreclassering, dan wel de reclassering
      die aan de aanvraag heeft meegewerkt, alsmede, voor zover het een minderjarige jeugdige betreft, aan de raad voor
      de kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel8
  - number: '8.8'
    text: |-
      Onze Minister kan nadere regels stellen over de deelname aan een scholings- en trainingsprogramma, de procedure
      voor het aanvragen en het verlenen van een machtiging tot deelname en de intrekking daarvan.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel8
  - number: '9.1'
    text: |-
      Bij zijn beslissing om een jeugdige in de gelegenheid te stellen deel te nemen aan een scholings- en
      trainingsprogramma betrekt de directeur in ieder geval de volgende aspecten:
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel9
  - number: 9.1.a
    text: |-
      het gedrag van de jeugdige, het nakomen van afspraken door de jeugdige en diens gemotiveerdheid om aan een
      scholings- en trainingsprogramma deel te nemen;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel9
  - number: 9.1.b
    text: |-
      de mate waarin de jeugdige tijdens zijn deelname in staat kan worden geacht de met de grotere vrijheden gepaard
      gaande verantwoordelijkheid te dragen;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel9
  - number: 9.1.c
    text: een aanvaardbaar verblijfadres;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel9
  - number: 9.1.d
    text: de geschiktheid van de jeugdige voor een bepaald scholings- en trainingsprogramma.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel9
  - number: '9.2'
    text: |-
      Bij jeugdigen die op strafrechtelijke titel in de inrichting verblijven betrekt de directeur tevens de volgende
      aspecten:
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel9
  - number: 9.2.a
    text: de aard, de zwaarte en de achtergronden van het gepleegde delict;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel9
  - number: 9.2.b
    text: het huidige detentieverloop;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel9
  - number: 9.2.c
    text: het gevaar voor recidive.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel9
  - number: '9.3'
    text: |-
      De directeur neemt zijn beslissing over deelname aan een scholings- en trainingsprogramma niet dan nadat de
      jeugdige zich schriftelijk bereid heeft verklaard tot deelname aan het programma en naleving van de daaraan
      verbonden voorwaarden.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel9
  - number: '9.4'
    text: |-
      De directeur stelt de raad voor de kinderbescherming voor zover het betreft minderjarige jeugdigen, het openbaar
      ministerie bij de rechtbank die in eerste aanleg kennis heeft genomen van het misdrijf terzake waarvan de maatregel
      van plaatsing in een inrichting voor jeugdigen is gelast, en het openbaar ministerie in het arrondissement
      waarin de jeugdige tijdens het scholings- en trainingsprogramma zal verblijven, schriftelijk in kennis van zijn
      beslissing.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel9
  - number: '9.5'
    text: |-
      Bij aanvang van het scholings- en trainingsprogramma ontvangt de jeugdige van de directeur een schriftelijke
      verklaring waarin de activiteiten van het scholings- en trainingsprogramma en de daaraan verbonden voorwaarden zijn
      vermeld, benevens de gronden waarop de deelname aan het scholings- en trainingsprogramma kan worden beëindigd.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel9
  - number: '10.1'
    text: |-
      De algemene verantwoordelijkheid voor de tenuitvoerlegging van een scholings- en trainingsprogramma ligt bij de
      directeur van de inrichting waarin de deelnemer aan het scholings- en trainingsprogramma is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel10
  - number: '10.2'
    text: |-
      De jeugdreclassering dan wel de reclassering die verantwoordelijk is voor de feitelijke uitvoering van het
      programma, is belast met de begeleiding van de jeugdige en houdt toezicht op het dagelijkse verloop van het
      scholings- en trainingsprogramma. Zij beoordeelt in eerste instantie of de activiteiten naar behoren worden
      verricht en de voorwaarden naar behoren worden nageleefd en kan in dat kader opdrachten geven aan de deelnemer.
      Zij kan in de wijze of het tijdstip waarop de activiteiten binnen het scholings- en trainingsprogramma worden
      uitgevoerd, wijzigingen aanbrengen. Van deze wijzigingen stelt zij de directeur onverwijld schriftelijk op
      de hoogte. Periodiek rapporteert zij aan de directeur over de deelname van de jeugdige aan het scholings- en
      trainingsprogramma.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel10
  - number: '11'
    text: |-
      De noodzakelijke kosten van bestaan tijdens deelname aan een scholings- en trainingsprogramma komen niet ten laste
      van Onze Minister, tenzij het gaat om de kosten van een pleegkind in het kader van een uithuisplaatsing en de
      Regeling vergoeding pleeggezinnen van toepassing is.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel11
  - number: '12.1'
    text: |-
      Aan de deelname door een jeugdige aan een scholings- en trainingsprogramma worden, onverminderd eventuele nader
      door de directeur te stellen bijzondere voorwaarden, de volgende algemene voorwaarden verbonden:
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel12
  - number: 12.1.a
    text: |-
      de deelnemer aan het scholings- en trainingsprogramma gedraagt zich overeenkomstig de aanwijzingen van degene die
      is belast met zijn begeleiding en het houden van toezicht op hem en verschaft aan deze alle verlangde inlichtingen;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel12
  - number: 12.1.b
    text: hij doet tevoren melding aan de directeur van een verandering van zijn verblijfplaats;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel12
  - number: 12.1.c
    text: hij maakt zich niet schuldig aan een strafbaar feit.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel12
  - number: '12.2'
    text: |-
      Aan de deelname aan een scholings- en trainingsprogramma kan de bijzondere voorwaarde worden gesteld dat de
      deelnemer zich onder elektronische toezicht laat stellen. Onze Minister kan nadere regels stellen over het
      elektronische toezicht.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel12
  - number: '12.3'
    text: |-
      Degene die belast is met de feitelijke uitvoering van het scholings- en trainingsprogramma rapporteert terstond
      aan de directeur in geval van overtreding van de voorwaarden. De directeur kan, afhankelijk van de ernst van de
      overtreding, alsdan beslissen tot:
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel12
  - number: 12.3.a
    text: het geven van een waarschuwing aan de deelnemer aan het scholings- en trainingsprogramma;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel12
  - number: 12.3.b
    text: |-
      wijziging of aanvulling van de bijzondere voorwaarden, gesteld aan deelname aan een scholings- en
      trainingsprogramma;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel12
  - number: 12.3.c
    text: tijdelijke terugplaatsing van de jeugdige in de inrichting, met bepaling van de duur daarvan;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel12
  - number: 12.3.d
    text: algehele beëindiging van het scholings- en trainingsprogramma.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel12
  - number: '12.4'
    text: |-
      De directeur geeft de deelnemer aan een scholings- en trainingsprogramma van een beslissing als bedoeld in het
      derde lid onverwijld schriftelijk en zo veel mogelijk in een voor hem begrijpelijke taal een met redenen omklede,
      gedagtekende en ondertekende mededeling.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel12
  - number: '12.5'
    text: |-
      Van het stellen van bijzondere voorwaarden, de overtreding van de voorwaarden en een beslissing als bedoeld in
      het derde lid, doet de directeur mededeling aan Onze Minister, de jeugdreclassering dan wel de reclassering die de
      jeugdige begeleidt, het openbaar ministerie en de raad voor de kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel12
  - number: 12a.1
    text: 'Onze Minister kan de machtiging intrekken:'
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel12a
  - number: 12a.1.a
    text: |-
      bij overtreding van de voorwaarden, bedoeld in [artikel 12, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel12
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: '12'
        hoofdstuk: '2'
  - number: 12a.1.b
    text: zodra de jeugdige vierentwintig uur ongeoorloofd afwezig is, tenzij sprake is van overmacht;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel12a
  - number: 12a.1.c
    text: |-
      zodra het openbaar ministerie aan de directeur meldt dat de jeugdige wordt aangemerkt als verdachte van een
      strafbaar feit waarvoor voorlopige hechtenis is toegelaten, begaan tijdens de deelname aan het scholings- en
      trainingsprogramma;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel12a
  - number: 12a.1.d
    text: |-
      indien feiten of omstandigheden bekend worden waardoor, indien deze ten tijde van het verlenen van de machtiging
      bekend waren geweest, de machtiging niet of niet in deze vorm zou zijn verleend.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel12a
  - number: 12a.2
    text: |-
      Indien Onze Minister de machtiging tot deelname aan een scholings- en trainingsprogramma intrekt, geeft hij
      daarvan terstond kennis aan de directeur, die daarop de deelname van de jeugdige aan het programma beëindigt. De
      kennisgeving wordt, onder vermelding van de datum van ingang van de beslissing, schriftelijk bevestigd.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel12a
  - number: '13.1'
    text: |-
      De deelnemer aan een scholings- en trainingsprogramma kan bij de beklagcommissie bij de inrichting waarin hij is
      ingeschreven een klacht indienen over de beslissingen, bedoeld in [artikel 12, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel12
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: '12'
        hoofdstuk: '2'
  - number: '13.2'
    text: |-
      De [artikelen 65, tweede en derde lid][ref1], [66][ref2], [67][ref3], [68][ref4], [69][ref5], [70][ref6],
      [72, met uitzondering van het derde lid, het vijfde lid, tweede volzin, en het zesde lid][ref7], [73][ref8],
      [74][ref9], [75][ref10] en [76 van de wet][ref11] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0011756#Artikel67
      [ref4]: https://wetten.overheid.nl/BWBR0011756#Artikel68
      [ref5]: https://wetten.overheid.nl/BWBR0011756#Artikel69
      [ref6]: https://wetten.overheid.nl/BWBR0011756#Artikel70
      [ref7]: https://wetten.overheid.nl/BWBR0011756#Artikel72
      [ref8]: https://wetten.overheid.nl/BWBR0011756#Artikel73
      [ref9]: https://wetten.overheid.nl/BWBR0011756#Artikel74
      [ref10]: https://wetten.overheid.nl/BWBR0011756#Artikel75
      [ref11]: https://wetten.overheid.nl/BWBR0011756#Artikel76
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '65'
      - id: ref2
        bwb_id: BWBR0011756
        artikel: '66'
      - id: ref3
        bwb_id: BWBR0011756
        artikel: '67'
      - id: ref4
        bwb_id: BWBR0011756
        artikel: '68'
      - id: ref5
        bwb_id: BWBR0011756
        artikel: '69'
      - id: ref6
        bwb_id: BWBR0011756
        artikel: '70'
      - id: ref7
        bwb_id: BWBR0011756
        artikel: '72'
      - id: ref8
        bwb_id: BWBR0011756
        artikel: '73'
      - id: ref9
        bwb_id: BWBR0011756
        artikel: '74'
      - id: ref10
        bwb_id: BWBR0011756
        artikel: '75'
      - id: ref11
        bwb_id: BWBR0011756
        artikel: '76'
  - number: '14.1'
    text: |-
      Bij elke inrichting of afdeling is een commissie van toezicht, waarvan de leden worden benoemd voor de tijd van
      vijf jaren. Zij kunnen tweemaal voor herbenoeming in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel14
  - number: '14.2'
    text: De commissie bestaat uit ten minste zes en ten hoogste een door Onze Minister vast te stellen aantal leden.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel14
  - number: '14.3'
    text: 'De commissie van toezicht is zo breed mogelijk samengesteld. Van elke commissie maken in elk geval deel uit:'
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel14
  - number: 14.3.a
    text: een met rechtspraak belast lid van de rechterlijke macht;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel14
  - number: 14.3.b
    text: een advocaat;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel14
  - number: 14.3.c
    text: een deskundige op het gebied van de gedragswetenschappen;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel14
  - number: 14.3.d
    text: een deskundige op het gebied van de pedagogische hulpverlening.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel14
  - number: '14.4'
    text: |-
      Indien de commissie toezicht houdt op een afdeling waar geneeskundige behandeling als bedoeld in de
      [artikelen 51a tot en met 51e van de wet][ref1] wordt verricht, maakt ook een psychiater van de commissie deel uit.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel51a
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: 51a
  - number: '15.1'
    text: |-
      De leden van de commissie van toezicht worden door Onze Minister benoemd en ontslagen. Onze Minister wijst uit de
      leden een voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel15
  - number: '15.2'
    text: |-
      Aan de commissie is een secretaris verbonden. Deze is geen lid van de commissie. De secretaris wordt door
      Onze Minister benoemd en ontslagen. De secretaris van de commissie van toezicht is tevens secretaris van de
      beklagcommissie.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel15
  - number: '15.3'
    text: |-
      De commissie kan uit haar midden een of meer plaatsvervangende secretarissen aanwijzen om, in overleg met de
      secretaris, bepaalde secretariaatswerkzaamheden te verrichten en de secretaris bij diens afwezigheid te vervangen.
      Onze Minister kan aan een commissie van toezicht een of meer plaatsvervangende secretarissen toevoegen die geen lid
      zijn van de commissie.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel15
  - number: '15.4'
    text: |-
      Onze Minister beslist binnen drie maanden op een verzoek tot benoeming als bedoeld in het eerste, tweede of derde
      lid.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel15
  - number: '16'
    text: 'Voor benoeming als lid, secretaris of plaatsvervangend secretaris komen niet in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel16
  - number: 16.a
    text: |-
      ambtenaren of andere personen, werkzaam onder de verantwoordelijkheid van Onze Minister op het terrein van de
      tenuitvoerlegging van vrijheidsbenemende straffen en maatregelen, niet zijnde officieren van justitie of advocaten-
      generaal;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel16
  - number: 16.b
    text: |-
      personeelsleden of medewerkers, werkzaam bij een inrichting, dan wel leden van het bestuur of de Raad van Toezicht
      van de rechtspersoon die een inrichting beheert;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel16
  - number: 16.c
    text: |-
      personen, werkzaam bij een door Onze Minister gesubsidieerde instelling die werkzaam is op het terrein van
      de tenuitvoerlegging van vrijheidsstraffen en vrijheidsbenemende maatregelen, indien zij in het kader van de
      uitoefening van hun functie te maken hebben met de personen, ingesloten in de inrichting waarbij de commissie van
      toezicht is ingesteld;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel16
  - number: 16.d
    text: |-
      personen, werkzaam onder de verantwoordelijkheid van Onze Minister, indien hun onafhankelijkheid of onpartijdigheid
      hetzij door hun positie, hetzij door de aard van hun werkzaamheden in het geding zou kunnen komen;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel16
  - number: 16.e
    text: |-
      personen tegen wie bezwaren bestaan tegen de vervulling van de functie die blijken uit de algemene
      documentatieregisters als bedoeld in het [Besluit inlichtingen justitiële documentatie][ref1] of de
      politiegegevens, bedoeld in [artikel 1, onderdeel a, van de Wet politiegegevens][ref2]. De bezwaren hebben
      betrekking op het vertrouwelijk karakter van de functie alsmede de aan de functie verbonden bevoegdheden;


      [ref1]: https://wetten.overheid.nl/BWBR0002292
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel1
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002292
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '1'
  - number: 16.f
    text: personen werkzaam bij de Raad of de Inspectie gezondheidszorg en jeugd.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel16
  - number: '17.1'
    text: 'Een lid van de commissie van toezicht wordt door Onze Minister tussentijds ontslagen:'
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel17
  - number: 17.1.a
    text: op eigen verzoek;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel17
  - number: 17.1.b
    text: |-
      bij de aanvaarding van een ambt of betrekking dat onverenigbaar is met het lidmaatschap van een commissie van
      toezicht;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel17
  - number: 17.1.c
    text: |-
      wanneer hij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij zulk
      een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel17
  - number: 17.1.d
    text: |-
      wanneer hij naar het oordeel van Onze Minister door handelen of nalaten ernstig nadeel toebrengt aan het in hem te
      stellen vertrouwen.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel17
  - number: '17.2'
    text: |-
      Aan een lid kan door Onze Minister tussentijds ontslag worden verleend bij het verlies van de hoedanigheid of
      beëindiging van de ambtsvervulling in verband waarmede de benoeming heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel17
  - number: '17.3'
    text: Hangende de procedure voor ontslag kan Onze Minister het lid in de uitoefening van zijn functie schorsen.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel17
  - number: '18.1'
    text: |-
      De leden van de commissie van toezicht hebben ten behoeve van de uitoefening van hun taak te allen tijde toegang
      tot alle plaatsen in de inrichting en tot alle plaatsen waar een scholings- en trainingsprogramma ten uitvoer wordt
      gelegd.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel18
  - number: '18.2'
    text: |-
      De leden van de commissie van toezicht ontvangen van de directeur en de personeelsleden of medewerkers bij de
      inrichting of afdeling of het scholings- en trainingsprogramma alle door hen gewenste inlichtingen ten aanzien van
      de jeugdigen onderscheidenlijk deelnemers aan een scholings- en trainingsprogramma en kunnen alle op de wijze van
      tenuitvoerlegging van vrijheidsbenemende straffen en maatregelen betrekking hebbende stukken inzien, voor zover
      dit redelijkerwijs nodig is voor de uitoefening van hun taak. Zij zijn tot geheimhouding verplicht behoudens voor
      zover enig wettelijk voorschrift hen tot bekendmaking verplicht of in verband met de tenuitvoerlegging van hun
      taak de noodzaak tot bekendmaking voortvloeit. Dossiers die jeugdigen dan wel deelnemers aan een scholings- en
      trainingsprogramma betreffen kunnen worden ingezien, tenzij de betrokkene bezwaar maakt.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel18
  - number: '18.3'
    text: |-
      De directeur brengt alle voor de uitoefening van de taak der commissie belangrijke feiten en omstandigheden ter
      kennis van de commissie.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel18
  - number: '19.1'
    text: De commissie van toezicht vergadert, in beginsel, eenmaal in de maand.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel19
  - number: '19.2'
    text: |-
      De directeur woont de vergaderingen van de commissie van toezicht bij. Hij brengt op iedere vergadering een
      algemeen verslag uit over hetgeen sedert de vorige vergadering in de inrichting of afdeling is geschied.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel19
  - number: '19.3'
    text: De commissie kan besluiten buiten tegenwoordigheid van de directeur te vergaderen.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel19
  - number: '19.4'
    text: |-
      Onze Minister is bevoegd vergaderingen van de commissie van toezicht door een door hem aan te wijzen ambtenaar van
      zijn ministerie te doen bijwonen.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel19
  - number: '19.5'
    text: |-
      In iedere vergadering van de commissie van toezicht wordt mededeling gedaan van de grieven terzake waarvan werd
      bemiddeld, de door de beklagcommissie behandelde klaagschriften en de bijzondere opmerkingen waartoe zij aanleiding
      geven.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel19
  - number: '20.1'
    text: |-
      De maandcommissaris, bedoeld in [artikel 7, vierde lid, tweede volzin, van de wet][ref1], houdt ten minste tweemaal
      per maand in de inrichting of afdeling spreekuur. Dit spreekuur wordt tijdig bekendgemaakt en kan worden bezocht
      door elke jeugdige of deelnemer aan een scholings- en trainingsprogramma die de wens daartoe te kennen geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel7
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '7'
  - number: '20.2'
    text: |-
      De maandcommissaris doet van zijn werkzaamheden verslag aan de commissie van toezicht en informeert tevens de
      directeur hierover.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel20
  - number: '21.1'
    text: |-
      De beklagcommissie of, indien [artikel 67, tweede lid, van de wet][ref1] wordt toegepast, de voorzitter dan wel
      de door hem aangewezen persoon, houdt zitting zo dikwijls als een onverwijlde behandeling en afdoening van de
      klaagschriften dit noodzakelijk maken. Deze wordt bijgestaan door een secretaris.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel67
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '67'
  - number: '21.2'
    text: |-
      Indien de beklagcommissie zitting houdt treedt bij voorkeur als voorzitter op een met rechtspraak belast lid van de
      rechterlijke macht.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel21
  - number: '22.1'
    text: |-
      De commissie van toezicht brengt jaarlijks vóór 1 mei aan Onze Minister en aan de Raad en, voor zover het een
      particuliere inrichting betreft, tevens aan het bestuur, verslag uit over haar werkzaamheden in het voorgaande
      jaar. Een afschrift van het jaarverslag wordt aan de Inspectie gezondheidszorg en jeugd gezonden.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel22
  - number: '22.2'
    text: |-
      Zij schenkt in haar verslag in het bijzonder aandacht zowel aan de door haar ingevolge
      [artikel 64 van de wet][ref1] verrichte bemiddelingen en de uitkomsten daarvan als aan de werkzaamheden van de
      beklagcommissie, onder meer door een overzicht van de klaagschriften en de daarop genomen beslissingen. Onze
      Minister kan een model vaststellen omtrent de inrichting van het verslag.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel64
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '64'
  - number: '23.1'
    text: De kosten van de commissie van toezicht worden door de Staat gedragen.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel23
  - number: '23.2'
    text: |-
      De leden van de commissie van toezicht genieten vergoeding van reis- en verblijfkosten en een vacatiegeld
      met betrekking tot hun werkzaamheden, overeenkomstig de bepalingen welke te dien aanzien voor de burgerlijke
      rijksambtenaren zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel23
  - number: '23.3'
    text: |-
      Voor zover de secretaris of de plaatsvervangend secretaris geen ambtenaar is geniet deze tevens de in het tweede
      lid bedoelde vergoeding.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel23
  - number: '24'
    text: |-
      De inrichtingen dragen zorg voor een veilige omgeving voor en een menswaardige bejegening van de jeugdigen. Zij
      dragen bij aan een beter sociaal functioneren van de jeugdige, door middel van een verplicht gesteld pedagogisch
      dagprogramma en individueel behandelprogramma. Voorts dragen zij bij aan een goede voortgang van de rechtsgang.
      Het doel van het verblijf in de inrichting is de kans op ontsporing van de jeugdige na diens terugkeer in de
      maatschappij te verminderen.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel24
  - number: '25.1'
    text: Het perspectiefplan wordt opgesteld onder de verantwoordelijkheid van de directeur.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel25
  - number: '25.2'
    text: |-
      Bij het opstellen en het wijzigen van het perspectiefplan zijn in ieder geval betrokken de groepsleider of mentor
      van de jeugdige, een leerkracht en een gedragsdeskundige.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel25
  - number: '25.3'
    text: |-
      Bij het opstellen en wijzigen van het perspectiefplan voor jeugdigen die op strafrechtelijke titel in de
      inrichting verblijven, betrekt de inrichting tevens de jeugdreclassering dan wel de reclassering en de raad voor
      de kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel25
  - number: '25.4'
    text: |-
      Bij het opstellen en wijzigen van het perspectiefplan voor jeugdigen die op grond van
      [artikel 6.2.2, tweede lid, van de Jeugdwet][ref1] in een inrichting zijn geplaatst, pleegt de inrichting overleg
      met de betrokken gecertificeerde instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
  - number: '25.5'
    text: |-
      Bij het opstellen en wijzigen van het perspectiefplan betrekt de inrichting zo veel mogelijk de ouders of voogd,
      stiefouder of pleegouders, tenzij:
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel25
  - number: 25.5.a
    text: deze te kennen geven hierbij geen rol te willen vervullen, of;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel25
  - number: 25.5.b
    text: zwaarwegende belangen van de jeugdige zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel25
  - number: '26.1'
    text: 'In het perspectiefplan wordt ten minste opgenomen:'
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel26
  - number: 26.1.a
    text: een diagnose van de problematiek van de jeugdige;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel26
  - number: 26.1.b
    text: een beschrijving van de behandeling;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel26
  - number: 26.1.c
    text: medische gegevens, voor zover deze relevant zijn voor de behandeling;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel26
  - number: 26.1.d
    text: de gestelde doelen aangaande de ontwikkeling van de jeugdige;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel26
  - number: 26.1.e
    text: de wijze waarop en de middelen waarmee die doelen bereikt kunnen worden;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel26
  - number: 26.1.f
    text: de verwachting met betrekking tot de behandelingsduur;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel26
  - number: 26.1.g
    text: een aanduiding van de groep, waarin de jeugdige verblijft;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel26
  - number: 26.1.h
    text: een omschrijving van de toegestane bewegingsvrijheid, zowel binnen als buiten de inrichting;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel26
  - number: 26.1.i
    text: de soorten activiteiten, waaraan door de jeugdige wordt deelgenomen;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel26
  - number: 26.1.j
    text: de personen van buiten de inrichting, waarmee de jeugdige contact mag onderhouden, en;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel26
  - number: 26.1.k
    text: het verplichte programma met betrekking tot onderwijs of andere pedagogische vorming.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel26
  - number: '26.2'
    text: |-
      Voor zover aan de onderdelen h tot en met k van het eerste lid voorwaarden verbonden zijn, worden deze opgenomen in
      het perspectiefplan en welke consequenties aan het niet naleven van deze voorwaarden zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel26
  - number: '26.3'
    text: |-
      Het verlofplan, het scholings- en trainingsprogramma en de voorbereiding op de nazorg maken, voor zover van
      toepassing, onderdeel uit van het perspectiefplan.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel26
  - number: '27'
    text: |-
      De directeur stelt het perspectiefplan tijdig ter beschikking aan het trajectberaad, bedoeld in
      [artikel 21a van het Besluit tenuitvoerlegging jeugdstrafrecht 1994][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007083#Artikel21a
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0007083
        artikel: 21a
  - number: '28.1'
    text: |-
      Het perspectiefplan bestrijkt een periode van vier maanden, of zoveel korter als het strafrestant of het verblijf
      in de inrichting is, of zoveel korter als het strafrestant of het verblijf in de inrichting is.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel28
  - number: '28.2'
    text: |-
      De jeugdige heeft recht op een periodieke evaluatie door de directeur van het perspectiefplan. Deze evaluatie
      vindt ten minste driemaal per jaar plaats, doch in ieder geval tijdig voor de opmaking van een advies als
      bedoeld in [artikel 77t, vijfde lid, van het Wetboek van Strafrecht][ref1] of een verlenging als bedoeld in
      [artikel 265c, eerste lid][ref2], of [305, derde lid, van Boek 1 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77t
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel265c
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel305
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77t
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 265c
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '305'
  - number: '28.3'
    text: |-
      De evaluatie van het perspectiefplan vindt plaats op basis van informatie van ten minste de functionaris en de
      gecertificeerde instelling, bedoeld in [artikel 25, vierde lid][ref1]. De jeugdige wordt in de gelegenheid gesteld
      zijn visie te geven op het verloop van het verblijf in de inrichting. Tevens worden bij de evaluatie betrokken
      de ouders of voogd, stiefouder of pleegouders van de jeugdige, met inachtneming van artikel 25, vijfde lid, en de
      betrokken gecertificeerde instelling. Van de evaluatie wordt een verslag opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel25
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: '25'
        hoofdstuk: '5'
  - number: '28.4'
    text: 'Bij de evaluatie worden de volgende aspecten betrokken:'
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel28
  - number: 28.4.a
    text: het verblijf in de groep;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel28
  - number: 28.4.b
    text: het bereiken van de gestelde doelen en de noodzaak tot wijziging van de doelen;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel28
  - number: 28.4.c
    text: de veranderingen in het toestandsbeeld van de jeugdige in het kader van de behandeling;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel28
  - number: 28.4.d
    text: de bewegingsvrijheid binnen en buiten de inrichting;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel28
  - number: 28.4.e
    text: belangrijke voorvallen waarbij de jeugdige betrokken is geweest;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel28
  - number: 28.4.f
    text: de noodzaak van verlenging van het verblijf in de inrichting.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel28
  - number: '29.1'
    text: |-
      Naar aanleiding van een evaluatie of tussentijds kan het perspectiefplan gewijzigd worden. Daarbij wordt ten minste
      het meest recente evaluatieverslag betrokken.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel29
  - number: '29.2'
    text: |-
      Een wijziging in het perspectiefplan wordt zo veel mogelijk in overleg met de jeugdige vastgesteld. De wijziging
      wordt hem voor het ingaan daarvan medegedeeld.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel29
  - number: '30'
    text: |-
      Kort voor het einde van het verblijf van de jeugdige in de inrichting wordt ter afsluiting van het perspectiefplan
      met de jeugdige nagegaan in hoeverre de doelstellingen van het plan zijn gerealiseerd. Hiervan wordt een verslag
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel30
  - number: '31.1'
    text: |-
      Bij de beoordeling van een te verlenen verlof wordt het belang van de jeugdige afgewogen tegen de risico's voor de
      continuïteit van de tenuitvoerlegging en voor de maatschappelijke orde en veiligheid. Het verlof kan slechts worden
      verleend indien de eventuele risico's aanvaardbaar worden geacht.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel31
  - number: '31.2'
    text: 'Als risico kunnen worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel31
  - number: 31.2.a
    text: onttrekking aan het verblijf in de inrichting,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel31
  - number: 31.2.b
    text: |-
      weigering in te stemmen met preventieve maatregelen ter voorkoming van onttrekking aan de vrijheidsstraf of
      vrijheidsbenemende maatregel,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel31
  - number: 31.2.c
    text: gevaar voor recidive,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel31
  - number: 31.2.d
    text: maatschappelijke onrust als gevolg van het verlof,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel31
  - number: 31.2.e
    text: |-
      vermoeden dat het verlof zal leiden tot alcohol- of drugsmisbruik dan wel poging tot invoer van ongeoorloofde
      voorwerpen in de inrichting,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel31
  - number: 31.2.f
    text: twijfel over het nakomen van afspraken,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel31
  - number: 31.2.g
    text: agressieve gedragskenmerken die een risico kunnen opleveren voor een ongestoord verloop van het verlof,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel31
  - number: 31.2.h
    text: het bestaan van ernstige spanningsvelden in de leef- of woonsfeer of rond mogelijk te ontmoeten personen,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel31
  - number: 31.2.i
    text: |-
      een mogelijke ongewenste confrontatie van de jeugdige met een slachtoffer of een anderszins bij het delict
      betrokkene,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel31
  - number: 31.2.j
    text: het vermoeden dat de jeugdige slachtoffer zal worden van een wraakactie.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel31
  - number: '31.3'
    text: 'Bij de inschatting van de risico''s betrekt de directeur in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel31
  - number: 31.3.a
    text: |-
      de aard van het delict, de door het delict veroorzaakte maatschappelijke onrust en de inschatting van het
      ontvluchtings- of recidivegevaar,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel31
  - number: 31.3.b
    text: relevante ervaringen bij eerder genoten verloven,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel31
  - number: 31.3.c
    text: recente rapportage over de jeugdige en zijn gedrag in de inrichting.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel31
  - number: '31.4'
    text: De directeur kan bepalen dat het verlof zal plaatsvinden onder begeleiding of bewaking.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel31
  - number: '31.5'
    text: |-
      De directeur vraagt het openbaar ministerie om advies, indien het openbaar ministerie een executie-indicator heeft
      gegeven.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel31
  - number: '32.1'
    text: |-
      Aan de jeugdige kan incidenteel verlof worden verleend in verband met onverwachte gebeurtenissen of omstandigheden
      in de persoonlijke levenssfeer van de jeugdige waarbij zijn aanwezigheid noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel32
  - number: '32.2'
    text: 'Gebeurtenissen of omstandigheden als bedoeld in het eerste lid zijn onder andere:'
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel32
  - number: 32.2.a
    text: het in levensgevaar verkeren van een relatie,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel32
  - number: 32.2.b
    text: het overlijden of de begrafenis van een relatie,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel32
  - number: 32.2.c
    text: het niet in staat zijn om naar de inrichting te reizen van een relatie,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel32
  - number: 32.2.d
    text: de bevalling van de partner.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel32
  - number: '32.3'
    text: |-
      Bij wijze van incidenteel verlof kan worden toegestaan dat de jeugdige een bezoek brengt aan een gedetineerde
      relatie.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel32
  - number: '32.4'
    text: |-
      Incidenteel verlof kan voorts worden verleend met het oog op de deelname aan een examen dat niet in de inrichting
      kan worden afgenomen of, ter voorbereiding op de invrijheidstelling, met het oog op de regeling van praktische
      zaken buiten de inrichting.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel32
  - number: '32.5'
    text: |-
      De directeur bepaalt de duur van het incidenteel verlof. Deze duur is niet langer dan drie etmalen. Op grond van
      dezelfde gebeurtenis kan de directeur meermalen incidenteel verlof toekennen.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel32
  - number: '33.1'
    text: |-
      Aan de jeugdige die op strafrechtelijke titel in een inrichting is geplaatst kan planmatig verlof worden verleend.
      Planmatig verlof wordt verleend in het kader van een verlofplan, dat onderdeel is van het perspectiefplan en dat
      ten doel heeft de resocialisatie van de jeugdige.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel33
  - number: '33.2'
    text: 'Het verlofplan geldt telkens voor een periode van ten hoogste zes maanden en bevat:'
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel33
  - number: 33.2.a
    text: |-
      een concrete aanduiding van het voorgenomen verloftraject in die periode wat betreft de frequentie, de duur, de
      aard en de bestemming van het verlof,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel33
  - number: 33.2.b
    text: een motivering van het belang van het verlof met het oog op de behandeling en resocialisatie,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel33
  - number: 33.2.c
    text: een afweging van de veiligheidsrisico's.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel33
  - number: '33.3'
    text: 'Planmatig verlof kan bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel33
  - number: 33.3.a
    text: eendaags begeleid verlof zonder overnachting,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel33
  - number: 33.3.b
    text: eendaags onbegeleid verlof zonder overnachting,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel33
  - number: 33.3.c
    text: onbegeleid verlof met één overnachting,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel33
  - number: 33.3.d
    text: onbegeleid verlof met meerdere overnachtingen.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel33
  - number: '33.4'
    text: Een voorlopig gehechte jeugdige komt niet in aanmerking voor planmatig verlof.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel33
  - number: '33.5'
    text: |-
      Een jeugdige ten aanzien van wie vaststaat dat hij, na de tenuitvoerlegging van de vrijheidsstraf of
      vrijheidsbenemende maatregel, Nederland zal dienen te verlaten dan wel zal worden uitgezet of uitgeleverd, komt
      niet in aanmerking voor planmatig verlof.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel33
  - number: '34.1'
    text: Het incidenteel verlof wordt door de jeugdige schriftelijk aangevraagd bij de directeur.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel34
  - number: '34.2'
    text: |-
      Indien het verzoek een voorlopig gehechte jeugdige betreft, vraagt de directeur instemming van het openbaar
      ministerie.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel34
  - number: '34.3'
    text: |-
      Indien het verzoek een civielrechtelijk geplaatste jeugdige betreft, vraagt de directeur instemming van de
      betrokken gecertificeerde instelling.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel34
  - number: '34.4'
    text: |-
      Indien het verzoek een jeugdige betreft die na de tenuitvoerlegging van de vrijheidsstraf of vrijheidsbenemende
      maatregel Nederland zal dienen te verlaten, of uitgezet of uitgeleverd zal worden, vraagt de directeur de
      Immigratie- en Naturalisatiedienst van het Ministerie van Veiligheid en Justitie om advies.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel34
  - number: '35.1'
    text: |-
      Indien de jeugdige wegens ziekte niet in staat is tijdig van het verlof naar de inrichting terug te keren, meldt
      hij dit onverwijld aan de inrichting. Desgevraagd toont de jeugdige aan dat hij om medische redenen niet in staat
      is tijdig terug te keren.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel35
  - number: '35.2'
    text: |-
      De directeur neemt, na overleg met de inrichtingsarts, en, voor zover mogelijk, gehoord de jeugdige, maatregelen
      met het oog op een zo spoedig mogelijke voortzetting van de vrijheidsontneming.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel35
  - number: '36.1'
    text: |-
      Indien zich tijdens het verlof een incident voordoet, kan de directeur, afhankelijk van de aard van het incident en
      het verlof, maatregelen nemen. Van een incident is in ieder geval sprake wanneer de jeugdige:
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel36
  - number: 36.1.a
    text: tijdens het verlof betrokken is bij een verstoring van de openbare orde of het plegen van een strafbaar feit;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel36
  - number: 36.1.b
    text: verwijtbaar te laat of niet in de inrichting terugkeert;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel36
  - number: 36.1.c
    text: onder invloed van alcohol of verdovende middelen in de inrichting terugkeert;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel36
  - number: 36.1.d
    text: bij terugkeer in de inrichting contrabande met zich meevoert.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel36
  - number: '36.2'
    text: |-
      Onverminderd de verplichting van de directeur om het incident elders te signaleren, worden gegevens over incidenten
      tijdens het verlof opgenomen in het dossier.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel36
  - number: '37.1'
    text: |-
      Aan een jeugdige die zonder begeleiding met verlof gaat, wordt door de inrichting een verlofpas van een door Onze
      Minister vastgesteld model verstrekt, waarop eventuele bijzondere voorwaarden worden vermeld.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel37
  - number: '37.2'
    text: De jeugdige draagt de verlofpas tijdens het verlof steeds bij zich.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel37
  - number: '38'
    text: De directeur kan de jeugdige een bijdrage in de reis- en verblijfkosten verstrekken.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel38
  - number: '39'
    text: |-
      Op grond van gewijzigde omstandigheden kan de directeur een reeds verleend verlof of het daarvan nog resterende
      gedeelte intrekken, naar een andere tijdstip verplaatsen of er nadere voorwaarden aan verbinden.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel39
  - number: '40'
    text: Onze Minister kan nadere regels stellen over het aanvragen en het verlenen van verlof.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel40
  - number: '48'
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *a-dwangbehandeling:* een onvrijwillige geneeskundige behandeling als
      bedoeld in [artikel 51d, onder a, van de wet][ref1];
        - *b-dwangbehandeling:* een onvrijwillige geneeskundige behandeling als bedoeld in
      [artikel 51d, onder b, van de wet][ref2];
        - *gedwongen geneeskundige handeling:* de gedwongen geneeskundige handeling als bedoeld in
      [artikel 37 van de wet][ref3];
        - *geneeskundige behandeling:* de onvrijwillige geneeskundige behandelingen, bedoeld in de onderdelen a tot en met
      c, en de vrijwillige geneeskundige behandeling, bedoeld in [artikel 51c van de wet][ref4];
        - *geneeskundig behandelingsplan:* het geneeskundig behandelingsplan, bedoeld in [artikel 51b van de wet][ref5];
        - *inspecteur:* de inspecteur, bedoeld in
      [artikel 1, onder c, van de Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref6];
        - *voorzetting van a-dwangbehandeling:* de voortzetting van a-dwangbehandeling bedoeld in
      [artikel 51e, vijfde lid, van de wet][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel51d
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel51d
      [ref3]: https://wetten.overheid.nl/BWBR0011756#Artikel37
      [ref4]: https://wetten.overheid.nl/BWBR0011756#Artikel51c
      [ref5]: https://wetten.overheid.nl/BWBR0011756#Artikel51b
      [ref6]: https://wetten.overheid.nl/BWBR0005700#Artikel1
      [ref7]: https://wetten.overheid.nl/BWBR0011756#Artikel51e
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: 51d
      - id: ref2
        bwb_id: BWBR0011756
        artikel: 51d
      - id: ref3
        bwb_id: BWBR0011756
        artikel: '37'
      - id: ref4
        bwb_id: BWBR0011756
        artikel: 51c
      - id: ref5
        bwb_id: BWBR0011756
        artikel: 51b
      - id: ref6
        bwb_id: BWBR0005700
        artikel: '1'
      - id: ref7
        bwb_id: BWBR0011756
        artikel: 51e
  - number: 48a.1
    text: |-
      Een geneeskundige behandeling wordt verricht in een daartoe geschikte ruimte, onder verantwoordelijkheid van de
      behandelend arts.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel48a
  - number: 48a.2
    text: |-
      In een inrichting of op een afdeling als bedoeld in [artikel 8, zevende lid, van de wet][ref1] is vierentwintig uur
      per dag, zeven dagen per week, voldoende psychiatrisch geschoold verpleegkundig personeel aanwezig. Bovendien is
      vierentwintig uur per dag, zeven dagen per week, een psychiater beschikbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel8
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '8'
  - number: 48a.3
    text: |-
      Een geneeskundige behandeling wordt slechts uitgevoerd door een arts of verpleegkundige die over voldoende
      deskundigheid beschikt deze behandeling uit te voeren en indien daartoe voldoende voorzieningen beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel48a
  - number: 48a.4
    text: |-
      Eens per twee weken, of vaker indien het belang van de jeugdige dit eist, vindt een multidisciplinair overleg
      plaats, waaraan in ieder geval een psychiater, een arts, een psycholoog en een verpleegkundige deelnemen. Indien
      de jeugdige de leeftijd van zestien jaar nog niet heeft bereikt, worden zijn ouders of voogd, stiefouder of
      pleegouders op de hoogte gesteld van de uitkomsten van het overleg.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel48a
  - number: 48b.1
    text: 'In het geneeskundig behandelingsplan worden ten minste opgenomen:'
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel48b
  - number: 48b.1.a
    text: de diagnose van de stoornis van de geestvermogens van de jeugdige;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel48b
  - number: 48b.1.b
    text: |-
      de therapeutische middelen, zo mogelijk gerelateerd aan de verschillende aspecten die in de stoornis te
      onderscheiden zijn, die zullen worden toegepast teneinde een zodanige verbetering van de stoornis van de
      geestvermogens van de jeugdige te bereiken, dat het gevaar op grond waarvan deze in verband met zijn geestelijke
      gezondheidstoestand op een afdeling voor intensieve zorg of intensieve behandeling behoeft te verblijven, wordt
      weggenomen;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel48b
  - number: 48b.1.c
    text: of er overeenstemming over het geneeskundig behandelingsplan is.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel48b
  - number: 48b.2
    text: |-
      Gedurende de behandeling kan het geneeskundig behandelingsplan worden gewijzigd. Bij een wijziging wordt de
      uitkomst van het multidisciplinair overleg, bedoeld in [artikel 48a, vierde lid][ref1], betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel48a
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel48b
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: 48a
        hoofdstuk: '8'
  - number: 48b.3
    text: |-
      Een wijziging van het geneeskundig behandelingsplan wordt, in overleg met de persoon, bedoeld in
      [artikel 51c, onder b, van de wet][ref1] vastgesteld. De wijziging wordt hem voor het ingaan daarvan medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel51c
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel48b
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: 51c
  - number: '49.1'
    text: 'In geval van een a- of b-dwangbehandeling wordt in het geneeskundig behandelingsplan eveneens opgenomen:'
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel49
  - number: 49.1.a
    text: |-
      welke minder bezwarende middelen zijn aangewend om het gevaar dat de stoornis van de geestvermogens de jeugdige
      doet veroorzaken weg te nemen dan wel af te wenden; en
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel49
  - number: 49.1.b
    text: |-
      de wijze waarop rekening wordt gehouden met de voorkeuren van de jeugdige en indien de jeugdige de leeftijd van
      zestien jaar nog niet heeft bereikt zijn ouders of voogd, stiefouder of pleegouders ten aanzien van de behandeling.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel49
  - number: '49.2'
    text: |-
      Het deel van het geneeskundig behandelingsplan waarover geen overeenstemming kan worden bereikt met de jeugdige
      of indien de jeugdige de leeftijd van zestien jaar nog niet heeft bereikt zijn ouders of voogd, stiefouder of
      pleegouders, wordt slechts vastgesteld door een psychiater nadat een multidisciplinair overleg heeft plaatsgehad
      waaraan in ieder geval een psychiater, een psycholoog en een verpleegkundige hebben deelgenomen.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel49
  - number: '49.3'
    text: |-
      Ingeval van a-dwangbehandeling worden de verklaringen van de psychiaters, bedoeld in
      [artikel 51e, tweede lid, van de wet][ref1], bij het in het tweede lid bedoelde overleg betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel51e
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: 51e
  - number: 49a.1
    text: |-
      Voordat de directeur beslist dat een door de arts noodzakelijk geachte b-dwangbehandeling of gedwongen
      geneeskundige handeling zal worden toegepast, pleegt de directeur overleg met die arts en met het hoofd van de
      afdeling waar de jeugdige verblijft. Indien de behandeling door een andere arts wordt verricht, wordt tevens met
      hem overlegd.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel49a
  - number: 49a.2
    text: |-
      Ingeval van b-dwangbehandeling of indien het verrichten van een gedwongen geneeskundige handeling noodzakelijk is
      ter afwending van gevaar dat voortvloeit uit de stoornis van de geestvermogens van de jeugdige, pleegt de directeur
      bovendien overleg met de voor de behandeling verantwoordelijke psychiater.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel49a
  - number: 49a.3
    text: |-
      In het in het eerste en tweede lid bedoelde overleg wordt nagegaan of het gevaar niet op een andere wijze kan
      worden afgewend.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel49a
  - number: 49b.1
    text: |-
      Zo spoedig mogelijk na de aanvang van de gedwongen geneeskundige handeling wordt door of onder verantwoordelijkheid
      van een arts een plan opgesteld gericht op een zodanige verbetering van de toestand van de jeugdige dat de
      toepassing van de gedwongen geneeskundige handeling kan worden beëindigd. Dit plan wordt opgenomen in geneeskundig
      behandelingsplan.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel49b
  - number: 49b.2
    text: |-
      Bij de keuze voor een bepaalde geneeskundige handeling wordt steeds gekozen voor de voor de jeugdige minst
      ingrijpende handeling.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel49b
  - number: 49c.1
    text: |-
      Voordat de directeur de beslissing tot voortzetting van a-dwangbehandeling neemt, pleegt hij overleg met de voor de
      behandeling verantwoordelijke psychiater en met het hoofd van de afdeling waar de jeugdige verblijft.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel49c
  - number: 49c.2
    text: |-
      In het in het eerste lid bedoelde overleg wordt nagegaan of van de voortzetting van de behandeling alsnog het
      beoogde effect kan worden verwacht.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel49c
  - number: 49c.3
    text: |-
      De uitkomsten van het multidisciplinaire overleg, bedoeld in [artikel 48a, vierde lid][ref1], worden bij de
      beslissing meegenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel48a
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel49c
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: 48a
        hoofdstuk: '8'
  - number: 49d
    text: |-
      De jeugdige wordt gedurende de periode dat de a- of b-dwangbehandeling of de gedwongen geneeskundige handeling
      wordt verricht, zo vaak als nodig is bezocht door een arts of in diens opdracht een verpleegkundige. Het verslag
      van diens bevindingen wordt opgenomen in het medische dossier.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel49d
  - number: 49e.1
    text: |-
      De directeur stelt de voorzitter van de commissie van toezicht, de raadsman van de jeugdige en indien de jeugdige
      de leeftijd van zestien jaar nog niet heeft bereikt, zijn ouders of voogd, stiefouder of pleegouders in kennis van
      het voornemen tot een beslissing tot a-dwangbehandeling uiterlijk drie dagen voor het nemen van die beslissing. Zij
      worden in de gelegenheid gesteld bezwaren tegen de beslissing kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel49e
  - number: 49e.2
    text: |-
      De voorzitter van de commissie van toezicht doet onverwijld een melding aan de maandcommissaris. De
      maandcommissaris bezoekt na de melding onverwijld de jeugdige.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel49e
  - number: 49e.3
    text: |-
      Van de toepassing van een a-dwangbehandeling, b-dwangbehandeling, gedwongen geneeskundige handeling of voortzetting
      van a-dwangbehandeling wordt uiterlijk bij de aanvang van de behandeling melding gedaan aan Onze Minister en de
      commissie van toezicht. Ingeval van a- of b-dwangbehandeling en indien een gedwongen geneeskundige handeling wordt
      toegepast in verband met een gevaar dat voortvloeit uit een stoornis van de geestvermogens van de jeugdige, wordt
      tevens melding gedaan aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel49e
  - number: 49e.4
    text: |-
      Bij de aanvang van een a-dwangbehandeling geeft de directeur daarvan eveneens kennis aan de in het eerste lid
      genoemde personen.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel49e
  - number: 49e.5
    text: |-
      De directeur zendt met de melding, bedoeld in het derde lid, een afschrift van de beslissing tot de behandeling mee
      waarin hij in ieder geval vermeldt:
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel49e
  - number: 49e.5.a
    text: |-
      in verband met welk gevaar is besloten tot een a- of b-dwangbehandeling, dan wel een gedwongen geneeskundige
      handeling;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel49e
  - number: 49e.5.b
    text: welke minder bezwarende middelen zijn aangewend om het gevaar weg te nemen dan wel af te wenden;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel49e
  - number: 49e.5.c
    text: |-
      welke personen, bedoeld in [artikel 51c, onder c, van de wet][ref1], zich tegen de behandeling verzetten;


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel51c
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel49e
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: 51c
  - number: 49e.5.d
    text: |-
      de wijze waarop rekening wordt gehouden met de voorkeuren van de jeugdige en indien de jeugdige de leeftijd van
      zestien jaar nog niet heeft bereikt de voorkeuren van zijn ouders of voogd, stiefouder of pleegouders ten aanzien
      van de behandeling; en
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel49e
  - number: 49e.5.e
    text: |-
      indien een behandeling plaatsvindt in een situatie waarin het de jeugdige is die zich verzet, of deze in staat
      kan worden geacht gebruik te kunnen maken van de regeling, vervat in [Hoofdstuk XIII–XIV][ref1] respectievelijk
      [XV van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#HoofdstukXIII
      [ref2]: https://wetten.overheid.nl/BWBR0011756#HoofdstukXV
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel49e
    references:
      - id: ref1
        bwb_id: BWBR0011756
        hoofdstuk: XIII
      - id: ref2
        bwb_id: BWBR0011756
        hoofdstuk: XV
  - number: 49e.6
    text: |-
      Ingeval van een beslissing tot a-dwangbehandeling, b-dwangbehandeling of voortzetting van a-dwangbehandeling,
      vermeldt de directeur tevens welke pogingen zijn gedaan om tot overeenstemming als bedoeld in
      [artikel 51c, onder b, van de wet][ref1] te komen. In geval van een beslissing tot a-dwangbehandeling vermeldt hij
      bovendien welke bezwaren tegen de behandeling zijn aangevoerd door de personen, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel51c
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel49e
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: 51c
  - number: 49e.7
    text: |-
      Van een beëindiging van een a-dwangbehandeling, b-dwangbehandeling of gedwongen geneeskundige handeling geeft de
      directeur kennis aan de personen, genoemd in het derde en – indien van toepassing – vierde lid.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel49e
  - number: 49e.8
    text: Onze Minister kan voor de meldingen een model vaststellen.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel49e
  - number: 49f
    text: |-
      De verantwoordelijke arts draagt zorg dat de melding van de toepassing van a-dwangbehandeling, b-dwangbehandeling,
      gedwongen geneeskundige handeling en voortzetting van a-dwangbehandeling en de resultaten van het overleg, bedoeld
      in [artikel 48a, vierde lid][ref1], [artikel 49a][ref2] en [artikel 49c][ref3], alsmede de adviezen die daarbij
      zijn gegeven en de afspraken die daarbij zijn gemaakt worden geregistreerd in het medische dossier.


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel48a
      [ref2]: https://wetten.overheid.nl/BWBR0012647#Artikel49a
      [ref3]: https://wetten.overheid.nl/BWBR0012647#Artikel49c
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel49f
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: 48a
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0012647
        artikel: 49a
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0012647
        artikel: 49c
        hoofdstuk: '8'
  - number: 49g.1
    text: |-
      De inspecteur stelt na beëindiging van elke a- of b-dwangbehandeling, doch in ieder geval na afloop van de termijn,
      bedoeld in [artikel 51e, vierde lid, van de wet][ref1], een onderzoek in of de beslissing tot de behandeling
      zorgvuldig is genomen en of de uitvoering van de behandeling zorgvuldig is geschied.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel51e
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel49g
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: 51e
  - number: 49g.2
    text: |-
      De inspecteur stelt eveneens een onderzoek in na beëindiging van elke gedwongen geneeskundige handeling indien
      die behandeling is verricht ter afwending van een gevaar dat voortvloeit uit de stoornis van de geestvermogens van
      de jeugdige.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel49g
  - number: '50.1'
    text: |-
      Indien de toepassing van de behandeling, bedoeld in [artikel 49a, tweede lid][ref1], de duur van twee weken te
      boven gaat wordt door de directeur een commissie samengesteld bestaande uit ten minste een afdelingshoofd, een
      psychiater, een arts en een psycholoog.


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel49a
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: 49a
        hoofdstuk: '8'
  - number: '50.2'
    text: |-
      De in het eerste lid bedoelde commissie brengt binnen twee dagen na de in het eerste lid bedoelde termijn en,
      indien de onvrijwillige geneeskundige behandeling langer wordt voortgezet, om de twee weken, advies uit aan de
      directeur over de voortzetting van de behandeling.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel50
  - number: 50a.1
    text: |-
      Telefoongesprekken die in verband met het toezicht, bedoeld in [artikel 44, tweede lid, van de wet][ref1] worden
      opgenomen, worden bewaard voor een periode van ten hoogste acht maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel44
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '44'
  - number: 50a.2
    text: Na het verstrijken van de periode, genoemd in het eerste lid, wordt een opgenomen telefoongesprek gewist.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel50a
  - number: 50a.3
    text: |-
      Indien bij de uitoefening van het toezicht blijkt dat een telefoongesprek met een persoon als bedoeld in
      [artikel 42, eerste lid, van de wet][ref1] is opgenomen, wordt dit opgenomen gesprek terstond gewist.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel42
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '42'
  - number: 50a.4
    text: De jeugdige wordt van het opnemen van het telefoonverkeer op de hoogte gesteld.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel50a
  - number: 50a.5
    text: |-
      Opgenomen telefoongesprekken worden slechts verstrekt aan derden die ingevolge de uitvoering van hen bij of
      krachtens de wet opgedragen taken, tot kennisneming daarvan bevoegd zijn.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel50a
  - number: 50a.6
    text: 'De verstrekking, bedoeld in het vijfde lid, kan slechts geschieden in verband met:'
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel50a
  - number: 50a.6.a
    text: de handhaving van de orde of de veiligheid in de inrichting;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel50a
  - number: 50a.6.b
    text: de voorkoming en opsporing van strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel50a
  - number: 50a.6.c
    text: de bescherming van slachtoffers van of anderszins betrokkenen bij misdrijven.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel50a
  - number: '51'
    text: |-
      Aan een inrichting zijn geestelijk verzorgers van verschillende godsdiensten of levensovertuigingen verbonden, doch
      in elk geval een geestelijk verzorger van protestantse of rooms-katholieke gezindte of een geestelijk verzorger
      behorend tot het humanistisch verbond.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel51
  - number: '52.1'
    text: |-
      Bij het Ministerie van Veiligheid en Justitie zijn een hoofdpredikant, een hoofdaalmoezenier en een hoofd
      humanistische geestelijke verzorging aangesteld. Zij treden op als vertegenwoordiging van de zendende instanties en
      dienen Onze Minister gevraagd en ongevraagd van advies omtrent de geestelijke verzorging in de inrichtingen.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel52
  - number: '52.2'
    text: |-
      De hoofden, genoemd in het eerste lid, zijn in ieder geval belast met het doen van voordrachten voor de aanstelling
      van geestelijk verzorgers bij de rijksinrichtingen, behorende tot hun gezindte of levensovertuiging.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel52
  - number: '53.1'
    text: |-
      De aanstelling van een geestelijk verzorger van protestantse of rooms-katholieke gezindte of een geestelijk
      verzorger, behorend tot het humanistisch verbond, bij een rijksinrichting geschiedt door of vanwege Onze Minister
      op voordracht van de betrokken hoofdgeestelijke, genoemd in [artikel 52, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel52
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: '52'
        hoofdstuk: '9'
  - number: '53.2'
    text: |-
      De aanstelling van een geestelijk verzorger van protestantse of rooms-katholieke gezindte of een geestelijk
      verzorger, behorend tot het humanistisch verbond, bij een particuliere inrichting geschiedt door of vanwege het
      bestuur van de inrichting gehoord de betrokken hoofdgeestelijke, genoemd in [artikel 52, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel52
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: '52'
        hoofdstuk: '9'
  - number: '54.1'
    text: |-
      Een geestelijk verzorger van een andere dan de in [artikel 53][ref1] genoemde gezindte of levensovertuiging kan
      door de directeur van een rijksinrichting aan diens inrichting worden verbonden anders dan bij wijze van een
      aanstelling. De directeur van de rijksinrichting neemt deze beslissing niet dan na overleg met de reeds aan de
      inrichting verbonden geestelijk verzorgers.


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel53
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: '53'
        hoofdstuk: '9'
  - number: '54.2'
    text: |-
      Onze Minister kan functievereisten vaststellen ten aanzien van geestelijk verzorgers als bedoeld in de eerste
      volzin van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel54
  - number: '54.3'
    text: |-
      Een geestelijk verzorger die aan een rijksinrichting is verbonden anders dan bij wijze van aanstelling, ontvangt
      een bij regeling van Onze Minister vast te stellen vergoeding voor zijn werkzaamheden en de door hem gemaakte
      kosten.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel54
  - number: '55.1'
    text: |-
      Een jeugdige kan een beroepschrift indienen tegen het medisch handelen van de inrichtingsarts. Met de
      inrichtingsarts wordt in dit hoofdstuk gelijkgesteld de verpleegkundige dan wel andere hulpverleners die door de
      inrichtingsarts bij de zorg aan jeugdigen in de inrichting zijn betrokken.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel55
  - number: '55.2'
    text: 'Onder medisch handelen als bedoeld in het eerste lid wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel55
  - number: 55.2.a
    text: |-
      enig handelen in het kader van of nalaten in strijd met de zorg die de in het eerste lid bedoelde personen in die
      hoedanigheid behoren te betrachten ten opzichte van de jeugdige, met betrekking tot wiens gezondheidstoestand zij
      bijstand verlenen of hun bijstand is ingeroepen;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel55
  - number: 55.2.b
    text: |-
      enig ander dan onder a bedoeld handelen of nalaten in die hoedanigheid in strijd met het belang van een goede
      uitoefening van de individuele gezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel55
  - number: '56.1'
    text: |-
      Alvorens een beroepschrift in te dienen doet de jeugdige een schriftelijk verzoek aan de Medisch Adviseur bij het
      Ministerie van Veiligheid en Justitie om te bemiddelen terzake van de klacht. Dit verzoek dient uiterlijk op de
      veertiende dag na die waarop het medisch handelen waartegen de klacht zich richt heeft plaatsgevonden te worden
      ingediend.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel56
  - number: '56.2'
    text: |-
      De Medisch Adviseur stelt de betrokkene in de gelegenheid de klacht schriftelijk of mondeling toe te lichten,
      tenzij hij het aanstonds duidelijk acht dat de klacht zich niet voor bemiddeling leent. Hij kan ook bij andere
      personen mondeling of schriftelijk inlichtingen inwinnen.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel56
  - number: '56.3'
    text: De Medisch Adviseur is ten behoeve van de bemiddeling bevoegd het medisch dossier van de jeugdige in te zien.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel56
  - number: '56.4'
    text: De Medisch Adviseur streeft ernaar binnen vier weken een voor beide partijen aanvaardbare oplossing te bereiken.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel56
  - number: '56.5'
    text: |-
      De Medisch Adviseur sluit de bemiddeling af met een mededeling van zijn bevindingen aan de jeugdige en de arts. De
      jeugdige wordt gewezen op de mogelijkheid van het indienen van een beroepschrift alsmede de termijn waarbinnen en
      de wijze waarop dit gedaan moet worden.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel56
  - number: '56.6'
    text: |-
      Een afschrift van de mededeling zendt de Medisch Adviseur aan de directeur van de inrichting waaraan de arts tegen
      wiens medisch handelen de klacht zich richt is verbonden.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel56
  - number: '56.7'
    text: |-
      De Medisch Adviseur is bevoegd een klacht door te verwijzen naar de beklagcommissie. Hij zendt van de
      doorverwijzing van een klacht een bericht aan de klager.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel56
  - number: '57.1'
    text: |-
      Het beroepschrift wordt ingediend bij en behandeld door een door en uit de Raad benoemde commissie van drie leden,
      bestaande uit één jurist en twee artsen, die wordt bijgestaan door een secretaris.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel57
  - number: '57.2'
    text: |-
      Het met redenen omklede beroepschrift wordt uiterlijk op de zevende dag na die van de ontvangst van het afschrift
      van de mededeling van de Medisch Adviseur ingediend. De directeur draagt zorg dat een jeugdige die beroep wenst in
      te stellen daartoe zo spoedig mogelijk in de gelegenheid wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel57
  - number: '57.3'
    text: |-
      De indiening van het beroepschrift kan door tussenkomst van de directeur van de inrichting waar de jeugdige
      verblijft geschieden. De directeur draagt in dat geval zorg dat het beroepschrift, of, indien het beroepschrift
      zich in een envelop bevindt, de envelop, van een dagtekening wordt voorzien, welke geldt als dag van indiening.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel57
  - number: '57.4'
    text: |-
      Het beroepschrift vermeldt zo nauwkeurig mogelijk het medisch handelen waarover wordt geklaagd en de redenen van
      het beroep.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel57
  - number: '57.5'
    text: |-
      Indien de jeugdige de Nederlandse taal niet voldoende beheerst kan hij het beroepschrift in een andere taal
      indienen. De voorzitter van de beroepscommissie kan bepalen dat het beroepschrift in de Nederlandse taal wordt
      vertaald. De vergoeding van de voor de vertaling gemaakte kosten geschiedt met overeenkomstige toepassing van
      [artikel 81][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel81
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: '81'
        hoofdstuk: '16'
  - number: '58.1'
    text: |-
      De beroepscommissie en de secretaris zijn ten behoeve van de behandeling van het beroepschrift bevoegd het medisch
      dossier van de klager in te zien.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel58
  - number: '58.2'
    text: |-
      De behandeling van het beroepschrift vindt niet in het openbaar plaats, behoudens ingeval de beroepscommissie van
      oordeel is dat de niet openbare behandeling niet verenigbaar is met enige een ieder verbindende bepaling van een in
      Nederland geldend verdrag.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel58
  - number: '58.3'
    text: |-
      De secretaris van de beroepscommissie zendt de arts een afschrift van het beroepschrift toe en vraagt het verslag
      van de bemiddeling op bij de Medisch Adviseur.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel58
  - number: '58.4'
    text: |-
      De beroepscommissie stelt de klager en de arts in de gelegenheid omtrent het beroepschrift mondeling of
      schriftelijk opmerkingen te maken, tenzij zij het beroep aanstonds kennelijk niet-ontvankelijk, kennelijk ongegrond
      of kennelijk gegrond acht. De beroepscommissie kan bepalen dat de mondelinge opmerkingen ten overstaan van een lid
      van de commissie kunnen worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel58
  - number: '58.5'
    text: |-
      De klager en de arts kunnen de voorzitter van de beroepscommissie de vragen opgeven die zij aan elkaar gesteld
      wensen te zien.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel58
  - number: '58.6'
    text: |-
      De beroepscommissie kan de arts en de klager buiten elkaars aanwezigheid horen. In dat geval worden zij in de
      gelegenheid gesteld vooraf de vragen op te geven die zij gesteld wensen te zien en wordt de zakelijke inhoud van
      de aldus afgelegde verklaring door de voorzitter van de beroepscommissie aan de klager onderscheidenlijk de arts
      mondeling medegedeeld.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel58
  - number: '58.7'
    text: |-
      De beroepscommissie kan ook bij andere personen mondeling of schriftelijk inlichtingen inwinnen. Indien mondeling
      inlichtingen worden ingewonnen, zijn het vijfde en zesde lid, tweede volzin, van overeenkomstige toepassing.
      De beroepscommissie kan bepalen dat ingeval bij een andere persoon mondeling inlichtingen worden ingewonnen, de
      betrokkenen uitsluitend in de gelegenheid worden gesteld schriftelijk de vragen op te geven die zij aan die persoon
      gesteld wensen te zien.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel58
  - number: '58.8'
    text: |-
      De klager heeft het recht zich te doen bijstaan door een rechtsbijstandverlener of een andere vertrouwenspersoon
      die daartoe van de beroepscommissie toestemming heeft gekregen. Indien aan de klager een advocaat is
      toegevoegd, geschieden diens beloning en de vergoeding van de door hem gemaakte kosten volgens het
      [Besluit vergoedingen rechtsbijstand 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011018
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0011018
  - number: '58.9'
    text: |-
      Indien de klager de Nederlandse taal niet voldoende beheerst, draagt de voorzitter zorg voor de bijstand van een
      tolk. De beloning van de tolk en de vergoeding van de door de tolk gemaakte kosten geschieden met overeenkomstige
      toepassing van [artikel 81][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel81
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: '81'
        hoofdstuk: '16'
  - number: '58.10'
    text: |-
      Tijdens de beroepsprocedure staat de beroepscommissie aan de klager op diens verzoek toe van de gedingstukken
      kennis te nemen.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel58
  - number: '59.1'
    text: |-
      De beroepscommissie doet zo spoedig mogelijk uitspraak. De uitspraak is met redenen omkleed en gedagtekend. Zij
      wordt door de voorzitter, alsmede door de secretaris ondertekend. Bij verhindering van één van hen wordt de reden
      daarvan in de uitspraak vermeld. Aan de klager, de arts en de directeur wordt onverwijld en kosteloos een afschrift
      van de beslissing van de beroepscommissie toegezonden of uitgereikt.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel59
  - number: '59.2'
    text: |-
      Indien de klager de Nederlandse taal niet voldoende beheerst en niet op andere wijze in een vertaling kan worden
      voorzien, draagt de voorzitter van de beroepscommissie zorg voor een vertaling van de uitspraak, bedoeld in het
      eerste lid. De vergoeding van de voor de vertaling gemaakte kosten geschiedt met overeenkomstige toepassing van
      [artikel 81][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel81
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: '81'
        hoofdstuk: '16'
  - number: '59.3'
    text: |-
      De secretaris zendt van alle uitspraken van de beroepscommissie een afschrift naar Onze Minister. Een ieder heeft
      recht op kennisneming van deze uitspraken en het ontvangen van een afschrift daarvan. Onze Minister draagt zorg dat
      dit afschrift geen gegevens bevat waaruit de identiteit van de jeugdige kan worden afgeleid. Met betrekking tot de
      kosten van het ontvangen van een afschrift is het bij of krachtens de [Wet tarieven in strafzaken][ref1] bepaalde
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002406
  - number: '60.1'
    text: 'De uitspraak van de beroepscommissie strekt tot gehele of gedeeltelijke:'
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel60
  - number: 60.1.a
    text: niet-ontvankelijkverklaring van het beroep;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel60
  - number: 60.1.b
    text: ongegrondverklaring van het beroep;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel60
  - number: 60.1.c
    text: gegrondverklaring van het beroep.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel60
  - number: '60.2'
    text: |-
      Indien de klacht door de beroepscommissie geheel of gedeeltelijk gegrond wordt geacht bepaalt de beroepscommissie
      of enige tegemoetkoming aan de klager geboden is. Zij stelt de tegemoetkoming, die geldelijk van aard kan zijn,
      vast.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel60
  - number: '61.1'
    text: |-
      De in de [artikelen 55 tot en met 58][ref1] aan de jeugdige toegekende rechten kunnen, behoudens ingeval de Medisch
      Adviseur of de beroepscommissie van oordeel is dat zwaarwegende belangen van de jeugdige zich daartegen verzetten,
      mede worden uitgeoefend door:


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel55
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: '55'
        hoofdstuk: '10'
  - number: 61.1.a
    text: de curator, indien de jeugdige onder curatele is gesteld;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel61
  - number: 61.1.b
    text: de mentor, indien ten behoeve van de jeugdige een mentorschap is ingesteld;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel61
  - number: 61.1.c
    text: de ouders of voogd, indien de jeugdige minderjarig is.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel61
  - number: '61.2'
    text: De directeur draagt zorg dat de in het eerste lid genoemde personen op deze rechten opmerkzaam worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel61
  - number: '62.1'
    text: |-
      Op het onderwijs in particuliere inrichtingen is het bepaalde bij of krachtens de [Wet op de expertisecentra][ref1]
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: '62.2'
    text: |-
      Het onderwijs in de rijksinrichting bestaat uit theoretisch onderwijs, een beroepsgerichte leerweg of
      praktijkonderwijs.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel62
  - number: '62.3'
    text: 'In ieder geval omvat het onderwijs in de rijksinrichting:'
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel62
  - number: 62.3.a
    text: rekenen en wiskunde,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel62
  - number: 62.3.b
    text: Nederlandse taal,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel62
  - number: 62.3.c
    text: wereldoriëntatie of maatschappijleer,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel62
  - number: 62.3.d
    text: sociale redzaamheid of zelfredzaamheid,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel62
  - number: 62.3.e
    text: technieken,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel62
  - number: 62.3.f
    text: lichamelijke opvoeding,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel62
  - number: 62.3.g
    text: creatieve vorming.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel62
  - number: '63.1'
    text: |-
      Elke inrichting beschrijft welk onderwijs door of vanwege de inrichting wordt aangeboden, met alle bijzonderheden,
      zoals leerinhouden, modules, toetsen, certificaten en methodes.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel63
  - number: '63.2'
    text: Het onderwijs wordt gegeven door een daartoe bevoegde persoon.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel63
  - number: '63.3'
    text: Het onderwijs maakt deel uit van het perspectiefplan. Het perspectiefplan is richtinggevend voor het onderwijs.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel63
  - number: '64.1'
    text: |-
      Ten behoeve van het onderwijs wordt door de leraar van een rijksinrichting een intake verzorgd, die de basis vormt
      voor het onderwijs dat de jeugdige zal gaan volgen. De intake omvat de nulmeting van de onderwijssituatie.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel64
  - number: '64.2'
    text: 'De intake bestaat uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel64
  - number: 64.2.a
    text: |-
      een intakegesprek dat betrekking heeft op interessegebieden, werkhouding, zelfbeeld en het niveau van kennis en
      vaardigheden,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel64
  - number: 64.2.b
    text: een toets op het gebied van de algemene taalvaardigheid,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel64
  - number: 64.2.c
    text: een toets die de rekenkundige vaardigheden meet,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel64
  - number: 64.2.d
    text: een schoolvragenlijst die betrekking heeft op de motivatie, het welbevinden en het zelfconcept van de jeugdige,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel64
  - number: 64.2.e
    text: eventuele anderen informatiebronnen.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel64
  - number: '65.1'
    text: |-
      Voor de jeugdige in een rijksinrichting wordt een onderwijstrajectkaart opgesteld waarin de onderwijskundige
      doelstellingen en resultaten of tussenresultaten zijn vastgelegd.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel65
  - number: '65.2'
    text: |-
      De onderwijstrajectkaart geeft een actueel beeld van het onderwijsverleden, test- en toetsgegevens, de
      onderwijsdoelen die worden gepland, en de doelen of tussendoelen die reeds zijn bereikt.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel65
  - number: '65.3'
    text: 'De onderwijstrajectkaart bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel65
  - number: 65.3.a
    text: de intake, waaronder de conclusies en aanbevelingen,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel65
  - number: 65.3.b
    text: de onderwijshistorie van de jeugdige,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel65
  - number: 65.3.c
    text: het onderwijstraject dat door de jeugdige wordt gevolgd,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel65
  - number: 65.3.d
    text: de voortgang van het onderwijstraject,
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel65
  - number: 65.3.e
    text: de voortgang van het onderwijs na het verblijf in de inrichting.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel65
  - number: '66'
    text: |-
      Het dossier van de jeugdige wordt op zorgvuldige wijze, volgens een vaste indeling, opgebouwd. In ieder geval
      worden hierin onderscheiden:
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel66
  - number: 66.a
    text: persoons- en identificatiegegevens;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel66
  - number: 66.b
    text: justitiële gegevens;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel66
  - number: 66.c
    text: opvang- of behandelgegevens;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel66
  - number: 66.d
    text: gegevens omtrent het verblijf.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel66
  - number: '67'
    text: |-
      Naast de in [artikel 63, eerste lid, van de wet][ref1] genoemde gegevens worden in het dossier opgenomen de
      jeugdige betreffende:


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel63
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '63'
  - number: 67.a
    text: |-
      afschriften van mededelingen, bedoeld in [artikel 62, eerste en tweede lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel62
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '62'
  - number: 67.b
    text: |-
      uitspraken van de beklagcommissie en de beroepscommissie alsmede mededelingen, bedoeld in
      [artikel 64, vijfde lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel64
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '64'
  - number: 67.c
    text: ontvangen afschriften van rechterlijke beslissingen betreffende de vrijheidsstraf of vrijheidsbenemende maatregel;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel67
  - number: 67.d
    text: kopieën van correspondentie van de inrichting over de jeugdige;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel67
  - number: 67.e
    text: |-
      formulieren betreffende verlof en daarop genomen beslissingen alsmede machtigingen van Onze Minister, bedoeld in de
      [artikelen 30, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel30
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '30'
  - number: 67.f
    text: verzoeken om strafonderbreking en daarop genomen beslissingen;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel67
  - number: 67.g
    text: gratieverzoeken en daarop genomen beslissingen;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel67
  - number: 67.h
    text: mededelingen omtrent de voorwaardelijke invrijheidstelling;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel67
  - number: 67.i
    text: |-
      gegevens omtrent de gezondheid van de jeugdige en te zijnen aanzien uitgevoerde verrichtingen, een en ander voor
      zover de opname van deze gegevens voor een goede opvang of behandeling van hem noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel67
  - number: '68.1'
    text: |-
      De jeugdige heeft, behoudens de overeenkomstig het tweede en derde lid te stellen beperkingen, recht op inzage van
      de in zijn dossier vastgelegde gegevens.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel68
  - number: '68.2'
    text: |-
      De directeur kan de jeugdige die een verzoek doet tot inzage van zijn dossier of delen daarvan, bepaalde gegevens
      onthouden, indien dit noodzakelijk is voor de handhaving van de orde of de veiligheid in de inrichting, in het
      belang van de geestelijke of lichamelijke ontwikkeling van de jeugdige, ter bescherming van de persoonlijke
      levenssfeer van anderen dan de jeugdige voor zover die niet bij de tenuitvoerlegging betrokken zijn, of wanneer de
      uitvoering van het perspectiefplan dit vereist.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel68
  - number: '68.3'
    text: |-
      De directeur kan het recht op inzage van evaluatieverslagen beperken tot een daarvan gemaakte samenvatting, indien
      de uitvoering van het perspectiefplan dit vereist.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel68
  - number: '68.4'
    text: 'De directeur kan, in geval van toepassing van het tweede of derde lid:'
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel68
  - number: 68.4.a
    text: de jeugdige mondeling kennis geven van de gegevens waarvan hij inzage verlangt, of
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel68
  - number: 68.4.b
    text: |-
      een door de jeugdige gemachtigde persoon inzage geven in de gegevens waarvan de inzage aan de jeugdige wordt
      onthouden.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel68
  - number: '68.5'
    text: |-
      Voor wat betreft het perspectiefplan en het evaluatieverslag omvat het recht op inzage tevens het recht op het
      ontvangen van een afschrift.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel68
  - number: '68.6'
    text: |-
      Met toepassing van [artikel 464 van Boek 7 van het Burgerlijk Wetboek][ref1] is [artikel 456 van dit boek][ref2]
      niet van overeenkomstige toepassing op de dossiers, bedoeld in dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel464
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel456
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '464'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '456'
  - number: '69.1'
    text: |-
      De ouders of voogd, stiefouder of pleegouders hebben recht op inzage in het dossier van de jeugdige, tenzij
      belangen van de jeugdige zich daartegen verzetten of inzage achterwege dient te blijven ter bescherming van de
      persoonlijke levenssfeer van anderen. Ten aanzien van jeugdigen van 18 jaar en ouder is instemming van de jeugdige
      vereist.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel69
  - number: '69.2'
    text: |-
      De gecertificeerde instelling, de jeugdreclassering dan wel de reclassering en de raad voor de kinderbescherming
      hebben recht op inzage in het dossier van de betrokken jeugdige voor zover dat redelijkerwijs nodig is voor de
      uitoefening van hun taak.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel69
  - number: '69.3'
    text: |-
      Aan Onze Minister, de selectiefunctionaris, de directeur en door dezen aan te wijzen personeelsleden of medewerkers
      kunnen gegevens uit het dossier worden verstrekt voor zover dat noodzakelijk is voor:
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel69
  - number: 69.3.a
    text: de behandeling van verzoeken, de jeugdige betreffende;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel69
  - number: 69.3.b
    text: de behandeling van procedures, de jeugdige betreffende;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel69
  - number: 69.3.c
    text: het beheer van de dossiers;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel69
  - number: 69.3.d
    text: de behandeling van andere beslissingen, de jeugdige betreffende.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel69
  - number: '70.1'
    text: |-
      Gedurende het verblijf van een jeugdige in een inrichting wordt zijn dossier in een afsluitbare ruimte in de
      inrichting bewaard.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel70
  - number: '70.2'
    text: |-
      De directeur zendt het dossier gelijktijdig met de overplaatsing van de jeugdige, bedoeld in
      [artikel 12 van de wet][ref1], aan de directeur van de inrichting waar de jeugdige verder zal verblijven.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel12
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '12'
  - number: '70.3'
    text: |-
      Indien de jeugdige in de gelegenheid wordt gesteld deel te nemen aan een scholings- en trainingsprogramma zendt de
      directeur het dossier aan de directeur, bedoeld in [artikel 10, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel10
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: '10'
        hoofdstuk: '2'
  - number: '70.4'
    text: |-
      Bij invrijheidstelling, ontvluchting of overlijden van de jeugdige zendt de directeur het dossier aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel70
  - number: '71.1'
    text: |-
      Het dossier wordt gedurende een termijn van tien jaren bewaard, te rekenen vanaf het tijdstip dat de vrijheidsstraf
      of vrijheidsbenemende maatregel eindigt.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel71
  - number: '71.2'
    text: |-
      Na de in het eerste lid bedoelde termijn worden de bescheiden, opgenomen in het dossier, vernietigd, of zodanig
      bewerkt dat deze niet meer tot de jeugdige kunnen worden herleid, tenzij de vernietiging of bewerking in strijd is
      met een aanmerkelijk belang van een ander dan de jeugdige.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel71
  - number: '71.3'
    text: |-
      Indien de jeugdige vóór de afloop van de in het eerste lid bedoelde termijn opnieuw tot een vrijheidsstraf
      of vrijheidsbenemende maatregel wordt veroordeeld wordt de bewaartermijn geschorst voor de duur van de
      tenuitvoerlegging van de nieuwe vrijheidsstraf of vrijheidsbenemende maatregel.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel71
  - number: '72.1'
    text: |-
      Een aanvraag tot aanwijzing als particuliere inrichting kan slechts worden gedaan door een rechtspersoon die een
      voorziening van jeugdhulpverlening als bedoeld in artikel [3b, eerste lid, van de wet][ref1] beheert.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel3b
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: 3b
  - number: '72.2'
    text: 'De aanvraag wordt bij Onze Minister ingediend en gaat vergezeld van de volgende bescheiden:'
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel72
  - number: 72.2.a
    text: de statuten of reglementen van de rechtspersoon die de residentiële voorziening van jeugdhulpverlening beheert;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel72
  - number: 72.2.b
    text: |-
      een schriftelijke verklaring, inhoudende dat een voorgenomen wijziging met betrekking tot een der onderwerpen,
      genoemd onder a en in het derde lid, ten minste een maand voordat de desbetreffende wijziging wordt doorgevoerd ter
      kennis van Onze Minister wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel72
  - number: 72.2.c
    text: |-
      een schriftelijke verklaring, inhoudende bereidverklaring de door de selectiefunctionaris geplaatste jeugdigen op
      te nemen.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel72
  - number: '72.3'
    text: 'De rechtspersoon die de residentiële voorziening van jeugdhulpverlening beheert legt tevens over:'
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel72
  - number: 72.3.a
    text: |-
      de door Onze Minister verlangde gegevens over de bouwkundige voorzieningen die van belang zijn voor de beoordeling
      van de veiligheid binnen de voorziening en de maatschappelijke veiligheid daarbuiten;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel72
  - number: 72.3.b
    text: |-
      de door Onze Minister verlangde gegevens over de personele en materiële toerusting die van belang zijn voor de
      beoordeling van de geschiktheid van de voorziening als particuliere inrichting.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel72
  - number: '72.4'
    text: Onze Minister beslist binnen zes maanden na ontvangst van een aanvraag als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel72
  - number: '73.1'
    text: 'De aanwijzing als particuliere inrichting wordt door Onze Minister ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel73
  - number: 73.1.a
    text: op verzoek van de rechtspersoon die de residentiële voorziening van jeugdhulpverlening beheert;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel73
  - number: 73.1.b
    text: |-
      indien de beveiliging dan wel de personele of materiële toerusting van de inrichting, bedoeld in
      [artikel 72, derde lid][ref1], niet meer voldoet aan de eisen die daaraan naar het oordeel van Onze Minister moeten
      worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel72
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: '72'
        hoofdstuk: '13'
  - number: '73.2'
    text: |-
      De aanwijzing als particuliere inrichting kan door Onze Minister worden ingetrokken, indien de
      rechtspersoon heeft gehandeld in strijd met de toepasselijke regelgeving of hetgeen overeenkomstig
      [artikel 72, tweede lid, onder b of c][ref1], is verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel72
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: '72'
        hoofdstuk: '13'
  - number: '74'
    text: |-
      De particuliere inrichting beschikt over een calamiteitenplan, waarin is geregeld welke acties dienen te worden
      ondernomen, en door wie, in het geval van een calamiteit.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel74
  - number: '75.1'
    text: |-
      De directeur van een rijksinrichting brengt jaarlijks vóór 1 oktober aan Onze Minister een jaarplan voor het
      volgende jaar uit. Het jaarplan omvat in ieder geval een begroting van de kosten en opbrengsten voor dat jaar.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel75
  - number: '75.2'
    text: |-
      De directeur van een rijksinrichting brengt jaarlijks vóór 1 maart aan Onze Minister een jaarverslag over het
      voorgaande jaar uit. Bij dit verslag wordt een jaarrekening gevoegd. De directeur zendt een afschrift van het
      jaarverslag aan de Inspectie gezondheidszorg en jeugd.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel75
  - number: '75.3'
    text: Onze Minister kan regels stellen aan de vorm en de inhoud van de in het eerste en tweede lid genoemde stukken.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel75
  - number: '76'
    text: |-
      De rijksinrichting beschikt over een calamiteitenplan, waarin is geregeld welke acties dienen te worden ondernomen,
      en door wie, in het geval van een calamiteit.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel76
  - number: '77'
    text: |-
      De inrichting biedt passende behandeling aan. Onder passende behandeling wordt verstaan zorg van goed niveau, die
      in ieder geval doeltreffend, doelmatig en gericht op de jeugdige wordt verleend en die afgestemd is op de reële
      behoefte van de jeugdige.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel77
  - number: '78'
    text: |-
      De inrichting organiseert het verblijf op zodanige wijze, voorziet de instelling zowel kwalitatief als kwantitatief
      zodanig van personeel en materieel en draagt zorg voor een zodanige verantwoordelijkheidsverdeling, dat een en
      ander leidt of redelijkerwijs moet leiden tot een verantwoord verblijf.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel78
  - number: '79.1'
    text: |-
      Het uitvoeren van [artikel 78][ref1] omvat mede de systematische bewaking, beheersing en verbetering van de
      kwaliteit van het verblijf.


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel78
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: '78'
        hoofdstuk: '15'
  - number: '79.2'
    text: |-
      Ter uitvoering van het eerste lid draagt de inrichting, afgestemd op de aard en omvang van de instelling, zorg
      voor:
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel79
  - number: 79.2.a
    text: |-
      het op systematische wijze verzamelen en registreren van gegevens betreffende de kwaliteit van het verblijf in
      een werkplan;
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel79
  - number: 79.2.b
    text: |-
      het aan de hand van de gegevens, bedoeld onder a, op systematische wijze toetsen in hoeverre de wijze van
      uitvoering van [artikel 78][ref1] leidt tot een verantwoord verblijf;


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel78
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: '78'
        hoofdstuk: '15'
  - number: 79.2.c
    text: |-
      het op basis van de uitkomst van de toetsing, bedoeld onder b, zo nodig veranderen van de wijze waarop
      [artikel 78][ref1] wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel78
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: '78'
        hoofdstuk: '15'
  - number: '80.1'
    text: |-
      Indien Onze Minister van oordeel is dat de [artikelen 77 tot en met 79][ref1] niet of in onvoldoende mate of op
      onjuiste wijze worden nageleefd, kan hij de directeur een schriftelijke aanwijzing geven.


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel77
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: '77'
        hoofdstuk: '15'
  - number: '80.2'
    text: |-
      In de aanwijzing omschrijft Onze Minister met redenen omkleed de punten waarop de
      [artikelen 77 tot en met 79][ref1] niet of in onvoldoende mate of op onjuiste wijze worden nageleefd, alsmede de in
      verband daarmee te nemen maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel77
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: '77'
        hoofdstuk: '15'
  - number: '80.3'
    text: |-
      De aanwijzing bevat een termijn waarbinnen de directeur eraan moet voldoen. De directeur is verplicht binnen de
      daartoe gestelde termijn aan de aanwijzing te voldoen.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel80
  - number: '81.1'
    text: |-
      De beloning van de tolk of vertaler en de vergoeding van de door hen gemaakte kosten, bedoeld in
      [artikel 66, vierde lid][ref1], [70, tweede lid][ref2], en [72, vierde lid, van de wet][ref3] geschieden volgens
      het bepaalde bij of krachtens de [Wet tarieven in strafzaken][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel70
      [ref3]: https://wetten.overheid.nl/BWBR0011756#Artikel72
      [ref4]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '66'
      - id: ref2
        bwb_id: BWBR0011756
        artikel: '70'
      - id: ref3
        bwb_id: BWBR0011756
        artikel: '72'
      - id: ref4
        bwb_id: BWBR0002406
  - number: '81.2'
    text: |-
      De secretaris van de beklag- of beroepscommissie stelt op basis van de in het eerste lid bedoelde bepalingen de
      hoogte van de beloning en vergoeding vast. Met de uitbetaling is de directeur belast.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel81
  - number: '82'
    text: |-
      Buiten geval van opzet of bewuste roekeloosheid is de aansprakelijkheid van de directeur voor voorwerpen die een
      jeugdige ingevolge [artikel 50, tweede lid, van de wet][ref1] onder zich heeft, beperkt tot vijfhonderd euro per
      voorwerp, inclusief eventuele gevolgschade.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel50
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '50'
  - number: '87'
    text: |-
      Een ieder die betrokken is bij de uitvoering van [de wet][ref1] en dit reglement en daarbij de beschikking krijgt
      over gegevens waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, en voor wie niet reeds
      uit hoofde van ambt, beroep of wettelijk voorschrift terzake van die gegevens een geheimhoudingsplicht geldt, is
      verplicht tot geheimhouding daarvan, behoudens voor zover enig wettelijk voorschrift hem tot bekendmaking verplicht
      of uit zijn taak bij de uitvoering van dit reglement de noodzaak tot bekendmaking voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0011756
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0011756
  - number: '89'
    text: Het Besluit regels inrichtingen voor justitiële kinderbescherming wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel89
  - number: '90'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel90
  - number: '91'
    text: 'Dit besluit wordt aangehaald als: Reglement justitiële jeugdinrichtingen.'
    url: https://wetten.overheid.nl/BWBR0012647/2018-08-01#Artikel91
