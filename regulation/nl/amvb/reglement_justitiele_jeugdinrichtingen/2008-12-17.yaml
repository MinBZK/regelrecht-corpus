        artikel: '456'
  - number: '69'
    text: |-
      1 De ouders of voogd, stiefouder of pleegouders hebben recht op inzage in het dossier van de jeugdige, tenzij
      belangen van de jeugdige zich daartegen verzetten of inzage achterwege dient te blijven ter bescherming van de
      persoonlijke levenssfeer van anderen. Ten aanzien van jeugdigen van 16 jaar en ouder is instemming van de jeugdige
      vereist.

      2 De stichting, de jeugdreclassering dan wel de reclassering en de raad voor de kinderbescherming hebben recht
      op inzage in het dossier van de betrokken jeugdige voor zover dat redelijkerwijs nodig is voor de uitoefening van
      hun taak.

      3 Aan Onze Minister, de selectiefunctionaris, de directeur en door dezen aan te wijzen personeelsleden of
      medewerkers kunnen gegevens uit het dossier worden verstrekt voor zover dat noodzakelijk is voor:

      a. de behandeling van verzoeken, de jeugdige betreffende;

      b. de behandeling van procedures, de jeugdige betreffende;

      c. het beheer van de dossiers;

      d. de behandeling van andere beslissingen, de jeugdige betreffende.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel69
  - number: '70'
    text: |-
      1 Gedurende het verblijf van een jeugdige in een inrichting wordt zijn dossier in een afsluitbare ruimte in de
      inrichting bewaard.

      2 De directeur zendt het dossier gelijktijdig met de overplaatsing van de jeugdige, bedoeld in
      [artikel 16 van de wet][ref1], aan de directeur van de inrichting waar de jeugdige verder zal verblijven.

      3 Indien de jeugdige in de gelegenheid wordt gesteld deel te nemen aan een scholings- en trainingsprogramma zendt
      de directeur het dossier aan de directeur, bedoeld in [artikel 10, eerste lid][ref2].

      4 Bij invrijheidstelling, ontvluchting of overlijden van de jeugdige zendt de directeur het dossier aan Onze
      Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0011756
      [ref2]: https://wetten.overheid.nl/BWBR0012647#Artikel10
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0011756
      - id: ref2
        bwb_id: BWBR0012647
        artikel: '10'
        hoofdstuk: '2'
  - number: '71'
    text: |-
      1 Het dossier wordt gedurende een termijn van tien jaren bewaard, te rekenen vanaf het tijdstip dat de
      vrijheidsstraf of vrijheidsbenemende maatregel eindigt.

      2 Na de in het eerste lid bedoelde termijn worden de bescheiden, opgenomen in het dossier, vernietigd, of zodanig
      bewerkt dat deze niet meer tot de jeugdige kunnen worden herleid, tenzij de vernietiging of bewerking in strijd is
      met een aanmerkelijk belang van een ander dan de jeugdige.

      3 Indien de jeugdige vóór de afloop van de in het eerste lid bedoelde termijn opnieuw tot een vrijheidsstraf
      of vrijheidsbenemende maatregel wordt veroordeeld wordt de bewaartermijn geschorst voor de duur van de
      tenuitvoerlegging van de nieuwe vrijheidsstraf of vrijheidsbenemende maatregel.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel71
  - number: '72'
    text: |-
      1 Een aanvraag tot aanwijzing als particuliere inrichting kan slechts worden gedaan door een rechtspersoon die een
      voorziening van jeugdhulpverlening als bedoeld in artikel [3b, eerste lid, van de wet][ref1] beheert.

      2 De aanvraag wordt bij Onze Minister ingediend en gaat vergezeld van de volgende bescheiden:

      a. de statuten of reglementen van de rechtspersoon die de residentiële voorziening van jeugdhulpverlening beheert;

      b. een schriftelijke verklaring, inhoudende dat een voorgenomen wijziging met betrekking tot een der onderwerpen,
      genoemd onder a en in het derde lid, ten minste een maand voordat de desbetreffende wijziging wordt doorgevoerd ter
      kennis van Onze Minister wordt gebracht;

      c. een schriftelijke verklaring, inhoudende bereidverklaring de door de selectiefunctionaris geplaatste jeugdigen
      op te nemen.

      3 De rechtspersoon die de residentiële voorziening van jeugdhulpverlening beheert legt tevens over:

      a. de door Onze Minister verlangde gegevens over de bouwkundige voorzieningen die van belang zijn voor de
      beoordeling van de veiligheid binnen de voorziening en de maatschappelijke veiligheid daarbuiten;

      b. de door Onze Minister verlangde gegevens over de personele en materiële toerusting die van belang zijn voor de
      beoordeling van de geschiktheid van de voorziening als particuliere inrichting.

      4 Onze Minister beslist binnen zes maanden na ontvangst van een aanvraag als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel3b
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: 3b
  - number: '73'
    text: |-
      1 De aanwijzing als particuliere inrichting wordt door Onze Minister ingetrokken:

      a. op verzoek van de rechtspersoon die de residentiële voorziening van jeugdhulpverlening beheert;

      b. indien de beveiliging dan wel de personele of materiële toerusting van de inrichting, bedoeld in
      [artikel 72, derde lid][ref1], niet meer voldoet aan de eisen die daaraan naar het oordeel van Onze Minister moeten
      worden gesteld.

      2 De aanwijzing als particuliere inrichting kan door Onze Minister worden ingetrokken, indien de
      rechtspersoon heeft gehandeld in strijd met de toepasselijke regelgeving of hetgeen overeenkomstig
      [artikel 72, tweede lid, onder b of c][ref2], is verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0012647#Artikel72
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel73
