  - number: '62'
    text: |-
      1 Op het onderwijs in particuliere inrichtingen is het bepaalde bij of krachtens de
      [Wet op de expertisecentra][ref1] van toepassing.

      2 Het onderwijs in de rijksinrichting bestaat uit theoretisch onderwijs, een beroepsgerichte leerweg of
      praktijkonderwijs.

      3 In ieder geval omvat het onderwijs in de rijksinrichting:

      a. rekenen en wiskunde,

      b. Nederlandse taal,

      c. wereldoriëntatie of maatschappijleer,

      d. sociale redzaamheid of zelfredzaamheid,

      e. technieken,

      f. lichamelijke opvoeding,

      g. creatieve vorming.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: '63'
    text: |-
      1 Elke inrichting beschrijft welk onderwijs door of vanwege de inrichting wordt aangeboden, met alle
      bijzonderheden, zoals leerinhouden, modules, toetsen, certificaten en methodes.

      2 Het onderwijs wordt gegeven door een daartoe bevoegde persoon.

      3 Het onderwijs maakt deel uit van het verblijfsplan en het behandelplan. Het verblijfsplan en het behandelplan
      zijn richtinggevend voor het onderwijs.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel63
  - number: '64'
    text: |-
      1 Ten behoeve van het onderwijs wordt door de leraar van een rijksinrichting een intake verzorgd, die de basis
      vormt voor het onderwijs dat de jeugdige zal gaan volgen. De intake omvat de nulmeting van de onderwijssituatie.

      2 De intake bestaat uit de volgende onderdelen:

      a. een intakegesprek dat betrekking heeft op interessegebieden, werkhouding, zelfbeeld en het niveau van kennis
      en vaardigheden,

      b. een toets op het gebied van de algemene taalvaardigheid,

      c. een toets die de rekenkundige vaardigheden meet,

      d. een schoolvragenlijst die betrekking heeft op de motivatie, het welbevinden en het zelfconcept van de jeugdige,

      e. eventuele anderen informatiebronnen.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel64
  - number: '65'
    text: |-
      1 Voor de jeugdige in een rijksinrichting wordt een onderwijstrajectkaart opgesteld waarin de onderwijskundige
      doelstellingen en resultaten of tussenresultaten zijn vastgelegd.

      2 De onderwijstrajectkaart geeft een actueel beeld van het onderwijsverleden, test- en toetsgegevens, de
      onderwijsdoelen die worden gepland, en de doelen of tussendoelen die reeds zijn bereikt.

      3 De onderwijstrajectkaart bestaat uit:

      a. de intake, waaronder de conclusies en aanbevelingen,

      b. de onderwijshistorie van de jeugdige,

      c. het onderwijstraject dat door de jeugdige wordt gevolgd,

      d. de voortgang van het onderwijstraject,

      e. de voortgang van het onderwijs na het verblijf in de inrichting.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel65
  - number: '66'
    text: |-
      Het dossier van de jeugdige wordt op zorgvuldige wijze, volgens een vaste indeling, opgebouwd. In ieder geval
      worden hierin onderscheiden:

      a. persoons- en identificatiegegevens;

      b. justitiële gegevens;

      c. opvang- of behandelgegevens;

      d. gegevens omtrent het verblijf.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel66
  - number: '67'
    text: |-
      Naast de in [artikel 63, eerste lid, van de wet][ref1] genoemde gegevens worden in het dossier opgenomen de
      jeugdige betreffende:

      a. afschriften van mededelingen, bedoeld in [artikel 62, eerste en tweede lid, van de wet][ref2];

      b. uitspraken van de beklagcommissie en de beroepscommissie alsmede mededelingen, bedoeld in
      [artikel 64, vijfde lid, van de wet][ref3];

      c. ontvangen afschriften van rechterlijke beslissingen betreffende de vrijheidsstraf of vrijheidsbenemende
      maatregel;

      d. kopieën van correspondentie van de inrichting over de jeugdige;

      e. formulieren betreffende verlof en daarop genomen beslissingen alsmede machtigingen van Onze Minister, bedoeld in
      de [artikelen 30, eerste lid][ref4], en [31, eerste lid, van de wet][ref5];

      f. verzoeken om strafonderbreking en daarop genomen beslissingen;

      g. gratieverzoeken en daarop genomen beslissingen;

      h. mededelingen omtrent de voorwaardelijke invrijheidstelling;

      i. gegevens omtrent de gezondheid van de jeugdige en te zijnen aanzien uitgevoerde verrichtingen, een en ander voor
      zover de opname van deze gegevens voor een goede opvang of behandeling van hem noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel63
