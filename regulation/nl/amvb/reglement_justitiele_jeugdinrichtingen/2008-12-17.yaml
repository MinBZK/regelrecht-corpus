      - id: ref2
        bwb_id: BWBR0022463
        artikel: '1'
  - number: '17'
    text: |-
      1 Een lid van de commissie van toezicht wordt door Onze Minister tussentijds ontslagen:

      a. op eigen verzoek;

      b. bij de aanvaarding van een ambt of betrekking dat onverenigbaar is met het lidmaatschap van een commissie van
      toezicht;

      c. wanneer hij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij
      zulk een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;

      d. wanneer hij naar het oordeel van Onze Minister door handelen of nalaten ernstig nadeel toebrengt aan het in hem
      te stellen vertrouwen.

      2 Aan een lid kan door Onze Minister tussentijds ontslag worden verleend bij het verlies van de hoedanigheid of
      beëindiging van de ambtsvervulling in verband waarmede de benoeming heeft plaatsgevonden.

      3 Hangende de procedure voor ontslag kan Onze Minister het lid in de uitoefening van zijn functie schorsen.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel17
  - number: '18'
    text: |-
      1 De leden van de commissie van toezicht hebben ten behoeve van de uitoefening van hun taak te allen tijde toegang
      tot alle plaatsen in de inrichting en tot alle plaatsen waar een scholings- en trainingsprogramma ten uitvoer wordt
      gelegd.

      2 De leden van de commissie van toezicht ontvangen van de directeur en de personeelsleden of medewerkers bij de
      inrichting of afdeling of het scholings- en trainingsprogramma alle door hen gewenste inlichtingen ten aanzien van
      de jeugdigen onderscheidenlijk deelnemers aan een scholings- en trainingsprogramma en kunnen alle op de wijze van
      tenuitvoerlegging van vrijheidsbenemende straffen en maatregelen betrekking hebbende stukken inzien, voor zover
      dit redelijkerwijs nodig is voor de uitoefening van hun taak. Zij zijn tot geheimhouding verplicht behoudens voor
      zover enig wettelijk voorschrift hen tot bekendmaking verplicht of in verband met de tenuitvoerlegging van hun
      taak de noodzaak tot bekendmaking voortvloeit. Dossiers die jeugdigen dan wel deelnemers aan een scholings- en
      trainingsprogramma betreffen kunnen worden ingezien, tenzij de betrokkene bezwaar maakt.

      3 De directeur brengt alle voor de uitoefening van de taak der commissie belangrijke feiten en omstandigheden ter
      kennis van de commissie.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel18
  - number: '19'
    text: |-
      1 De commissie van toezicht vergadert, in beginsel, eenmaal in de maand.

      2 De directeur woont de vergaderingen van de commissie van toezicht bij. Hij brengt op iedere vergadering een
      algemeen verslag uit over hetgeen sedert de vorige vergadering in de inrichting of afdeling is geschied.

      3 De commissie kan besluiten buiten tegenwoordigheid van de directeur te vergaderen.

      4 Onze Minister is bevoegd vergaderingen van de commissie van toezicht door een door hem aan te wijzen ambtenaar
      van zijn ministerie te doen bijwonen.

      5 In iedere vergadering van de commissie van toezicht wordt mededeling gedaan van de grieven terzake waarvan werd
      bemiddeld, de door de beklagcommissie behandelde klaagschriften en de bijzondere opmerkingen waartoe zij aanleiding
      geven.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel19
  - number: '20'
    text: |-
      1 De maandcommissaris, bedoeld in [artikel 7, vierde lid, tweede volzin, van de wet][ref1], houdt ten minste
      tweemaal per maand in de inrichting of afdeling spreekuur. Dit spreekuur wordt tijdig bekendgemaakt en kan worden
      bezocht door elke jeugdige of deelnemer aan een scholings- en trainingsprogramma die de wens daartoe te kennen
      geeft.

      2 De maandcommissaris doet van zijn werkzaamheden verslag aan de commissie van toezicht en informeert tevens de
      directeur hierover.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel7
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '7'
  - number: '21'
    text: |-
      1 De beklagcommissie of, indien [artikel 67, tweede lid, van de wet][ref1] wordt toegepast, de voorzitter dan
      wel de door hem aangewezen persoon, houdt zitting zo dikwijls als een onverwijlde behandeling en afdoening van de
      klaagschriften dit noodzakelijk maken. Deze wordt bijgestaan door een secretaris.

      2 Indien de beklagcommissie zitting houdt treedt bij voorkeur als voorzitter op een met rechtspraak belast lid van
      de rechterlijke macht.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel67
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel21
