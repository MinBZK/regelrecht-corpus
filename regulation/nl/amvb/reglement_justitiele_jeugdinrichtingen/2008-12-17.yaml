        artikel: '67'
  - number: '22'
    text: |-
      1 De commissie van toezicht brengt jaarlijks vóór 1 mei aan Onze Minister en aan de Raad en, voor zover het een
      particuliere inrichting betreft, tevens aan het bestuur, verslag uit over haar werkzaamheden in het voorgaande
      jaar. Een afschrift van het jaarverslag wordt aan de Inspectie jeugdhulpverlening en jeugdbescherming gezonden.

      2 Zij schenkt in haar verslag in het bijzonder aandacht zowel aan de door haar ingevolge
      [artikel 64 van de wet][ref1] verrichte bemiddelingen en de uitkomsten daarvan als aan de werkzaamheden van de
      beklagcommissie, onder meer door een overzicht van de klaagschriften en de daarop genomen beslissingen. Onze
      Minister kan een model vaststellen omtrent de inrichting van het verslag.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel64
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '64'
  - number: '23'
    text: |-
      1 De kosten van de commissie van toezicht worden door de Staat gedragen.

      2 De leden van de commissie van toezicht genieten vergoeding van reis- en verblijfkosten en een vacatiegeld
      met betrekking tot hun werkzaamheden, overeenkomstig de bepalingen welke te dien aanzien voor de burgerlijke
      rijksambtenaren zijn vastgesteld.

      3 Voor zover de secretaris of de plaatsvervangend secretaris geen ambtenaar is geniet deze tevens de in het tweede
      lid bedoelde vergoeding.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel23
  - number: '24'
    text: |-
      1 De opvanginrichtingen dragen zorg voor een veilige omgeving voor en een menswaardige bejegening van de
      jeugdigen. Zij dragen bij aan een beter sociaal functioneren van de jeugdige, door middel van een verplicht gesteld
      pedagogisch dagprogramma en een individueel verblijfsplan voor zover [de wet][ref1] hiertoe verplicht. Voorts
      dragen zij bij aan een goede voortgang van de rechtsgang. Het doel van het verblijf in de opvanginrichting is de
      kans op ontsporing van de jeugdige na diens terugkeer in de maatschappij te verminderen.

      2 De behandelinrichtingen dragen zorg voor een veilige omgeving voor en een menswaardige bejegening van de
      jeugdigen. Zij dragen bij aan een beter sociaal functioneren van de jeugdige, door middel van een verplicht gesteld
      pedagogisch dagprogramma en individueel behandelprogramma. Voorts dragen zij bij aan een goede voortgang van de
      rechtsgang. Het doel van het verblijf in de behandelinrichting is de kans op ontsporing van de jeugdige na diens
      terugkeer in de maatschappij te verminderen.


      [ref1]: https://wetten.overheid.nl/BWBR0011756
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0011756
  - number: '25'
    text: |-
      1 Het verblijfsplan en het behandelplan worden opgesteld onder de verantwoordelijkheid van de directeur.

      2 Bij de opstelling van het verblijfsplan en het behandelplan zijn in ieder geval betrokken de groepsleider, een
      leerkracht en een gedragsdeskundige.

      3 Bij het opstellen en wijzigen van het verblijfsplan en het behandelplan voor jeugdigen die met toepassing
      van [artikel 261][ref1] of [305, derde lid, van Boek 1 van het Burgerlijk Wetboek][ref2] in een inrichting zijn
      geplaatst, pleegt de inrichting overleg met de betrokken stichting.

      4 Bij het opstellen en wijzigen van het verblijfsplan en het behandelplan voor jeugdigen die op strafrechtelijke
      titel zijn geplaatst, betrekt de inrichting tevens de jeugdreclassering dan wel de reclassering alsmede de raad
      voor de kinderbescherming.

      5 Bij het opstellen en wijzigen van het verblijfsplan en het behandelplan betrekt de inrichting zo veel mogelijk de
      ouders of voogd, stiefouder of pleegouders, tenzij:

      a. deze te kennen geven geen rol hierbij te willen vervullen, of

      b. zwaarwegende belangen van de jeugdige zich daartegen verzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel261
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel305
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '261'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '305'
  - number: '26'
    text: |-
      1 In het verblijfsplan worden ten minste opgenomen:

      a. een omschrijving van de problemen van de jeugdige,

      b. een beschrijving van het hulpverleningsproces,

      c. medische gegevens voor zover deze relevant zijn voor het hulpverleningsproces,

      d. de gestelde doelen aangaande de ontwikkeling van de jeugdige,

      e. een aanduiding van de groep waarin de jeugdige verblijft,

      f. een omschrijving van de toegestane bewegingsvrijheid, zowel binnen als buiten de inrichting,

      g. de soorten activiteiten waaraan door de jeugdige wordt deelgenomen,

      h. de personen van buiten de inrichting waarmee de jeugdige contact mag onderhouden, en

      i. het verplichte programma met betrekking tot onderwijs of andere pedagogische vorming.

      2 Voor zover aan de onderdelen f tot en met i van het eerste lid voorwaarden verbonden zijn worden deze opgenomen
      in het verblijfsplan en wordt aangegeven welke de consequenties zijn wanneer deze voorwaarden niet worden
      nageleefd.

      3 Het verlofplan, het scholings- en trainingsprogramma en de voorbereiding op de nazorg maakt, voor zover van
      toepassing, onderdeel uit van het verblijfsplan.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel26
  - number: '27'
    text: |-
      1 In het behandelplan worden ten minste opgenomen:

      a. de diagnose van de problematiek en de indicatie voor plaatsing,

      b. medische gegevens voor zover deze relevant zijn voor de behandeling,

      c. de gestelde doelen aangaande de ontwikkeling van de jeugdige,

      d. de wijze waarop en de middelen waarmee die doelen bereikt kunnen worden,

      e. de verwachting met betrekking tot de behandelingsduur,

      f. een aanduiding van de groep waarin de jeugdige verblijft,

      g. een omschrijving van de toegestane bewegingsvrijheid, zowel binnen als buiten de inrichting,

      h. de soorten activiteiten waaraan door de jeugdige wordt deelgenomen,

      i. de personen van buiten de inrichting waarmee de jeugdige contact mag onderhouden, en

      j. het verplichte programma met betrekking tot onderwijs of andere pedagogische vorming.

      2 Voor zover aan de onderdelen h en i van het eerste lid voorwaarden verbonden zijn worden deze tevens opgenomen in
      het behandelplan en wordt aangegeven welke de consequenties zijn wanneer deze voorwaarden niet worden nageleefd.

      3 Het verlofplan, het scholings- of trainingsprogramma dan wel het proefverlof en de voorbereiding op de nazorg
      maakt onderdeel uit van het behandelplan.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel27
  - number: '28'
    text: |-
      1 Het verblijfsplan en het behandelplan bestrijken een periode van minimaal zes maanden, of zoveel korter als het
      strafrestant of het verblijf in de inrichting is.

      2 De jeugdige heeft recht op een periodieke evaluatie door de directeur van het verblijfsplan en het behandelplan.
      Deze evaluatie vindt ten minste viermaal per jaar plaats, doch in ieder geval tijdig voor de opmaking van een
      advies als bedoeld in [artikel 77t, vijfde lid, van het Wetboek van Strafrecht][ref1] of een verlenging als bedoeld
      in [artikel 262, eerste lid][ref2], of [305, derde lid, van Boek 1 van het Burgerlijk Wetboek][ref3].

      3 De evaluatie van het verblijfsplan en het behandelplan vindt plaats op basis van informatie van ten minste de
      functionarissen, bedoeld in [artikel 25, tweede lid][ref4]. De jeugdige wordt in de gelegenheid gesteld zijn visie
      te geven op het verloop van het verblijf in de inrichting. Tevens worden bij de evaluatie betrokken de ouders
      of voogd, stiefouder of pleegouders van de jeugdige, met inachtneming van [artikel 25, vijfde lid][ref5], en de
      betrokken stichting. Van de evaluatie wordt een verslag opgesteld.

      4 Bij de evaluatie worden de volgende aspecten betrokken:

      a. het verblijf in de groep;

      b. het bereiken van de gestelde doelen en de noodzaak tot wijziging van de doelen;

      c. de veranderingen in het toestandsbeeld van de jeugdige in het kader van de opvang of behandeling;

      d. de bewegingsvrijheid binnen en buiten de inrichting;

      e. belangrijke voorvallen waarbij de jeugdige betrokken is geweest;

      f. de noodzaak van verlenging van het verblijf in de inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77t
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel262
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel305
      [ref4]: https://wetten.overheid.nl/BWBR0012647#Artikel25
      [ref5]: https://wetten.overheid.nl/BWBR0012647#Artikel25
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77t
      - id: ref2
