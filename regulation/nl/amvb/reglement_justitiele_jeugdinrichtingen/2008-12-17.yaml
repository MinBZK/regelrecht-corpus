        artikel: '262'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '305'
      - id: ref4
        bwb_id: BWBR0012647
        artikel: '25'
        hoofdstuk: '5'
      - id: ref5
        bwb_id: BWBR0012647
        artikel: '25'
        hoofdstuk: '5'
  - number: '29'
    text: |-
      1 Naar aanleiding van een evaluatie of tussentijds kunnen het verblijfsplan en het behandelplan gewijzigd worden.
      Bij een tussentijdse wijziging wordt ten minste het meest recente evaluatieverslag betrokken.

      2 Een wijziging in het verblijfsplan of het behandelplan wordt zo veel mogelijk in overleg met de jeugdige
      vastgesteld. De wijziging wordt hem voor het ingaan daarvan medegedeeld.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel29
  - number: '30'
    text: |-
      Kort voor het einde van het verblijf van de jeugdige in de inrichting wordt ter afsluiting van het verblijfsplan
      en het behandelplan met de jeugdige nagegaan in hoeverre de doelstellingen van het plan zijn gerealiseerd. Hiervan
      wordt een verslag gemaakt.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel30
  - number: '31'
    text: |-
      1 Bij de beoordeling van een te verlenen verlof wordt het belang van de jeugdige afgewogen tegen de risico's voor
      de continuïteit van de tenuitvoerlegging en voor de maatschappelijke orde en veiligheid. Het verlof kan slechts
      worden verleend indien de eventuele risico's aanvaardbaar worden geacht.

      2 Als risico kunnen worden aangemerkt:

      a. onttrekking aan het verblijf in de inrichting,

      b. weigering in te stemmen met preventieve maatregelen ter voorkoming van onttrekking aan de vrijheidsstraf of
      vrijheidsbenemende maatregel,

      c. gevaar voor recidive,

      d. maatschappelijke onrust als gevolg van het verlof,

      e. vermoeden dat het verlof zal leiden tot alcohol- of drugsmisbruik dan wel poging tot invoer van ongeoorloofde
      voorwerpen in de inrichting,

      f. twijfel over het nakomen van afspraken,

      g. agressieve gedragskenmerken die een risico kunnen opleveren voor een ongestoord verloop van het verlof,

      h. het bestaan van ernstige spanningsvelden in de leef- of woonsfeer of rond mogelijk te ontmoeten personen,

      i. een mogelijke ongewenste confrontatie van de jeugdige met een slachtoffer of een anderszins bij het delict
      betrokkene,

      j. het vermoeden dat de jeugdige slachtoffer zal worden van een wraakactie.

      3 Bij de inschatting van de risico's betrekt de directeur in ieder geval:

      a. de aard van het delict, de door het delict veroorzaakte maatschappelijke onrust en de inschatting van het
      ontvluchtings- of recidivegevaar,

      b. relevante ervaringen bij eerder genoten verloven,

      c. recente rapportage over de jeugdige en zijn gedrag in de inrichting.

      4 De directeur kan bepalen dat het verlof zal plaatsvinden onder begeleiding of bewaking.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel31
  - number: '32'
    text: |-
      1 Aan de jeugdige kan incidenteel verlof worden verleend in verband met onverwachte gebeurtenissen of
      omstandigheden in de persoonlijke levenssfeer van de jeugdige waarbij zijn aanwezigheid noodzakelijk is.

      2 Gebeurtenissen of omstandigheden als bedoeld in het eerste lid zijn onder andere:

      a. het in levensgevaar verkeren van een relatie,

      b. het overlijden of de begrafenis van een relatie,

      c. het niet in staat zijn om naar de inrichting te reizen van een relatie,

      d. de bevalling van de partner.

      3 Bij wijze van incidenteel verlof kan worden toegestaan dat de jeugdige een bezoek brengt aan een gedetineerde
      relatie.

      4 Incidenteel verlof kan voorts worden verleend met het oog op de deelname aan een examen dat niet in de inrichting
      kan worden afgenomen of, ter voorbereiding op de invrijheidstelling, met het oog op de regeling van praktische
      zaken buiten de inrichting.

      5 De directeur bepaalt de duur van het incidenteel verlof. Deze duur is niet langer dan drie etmalen. Op grond van
      dezelfde gebeurtenis kan de directeur meermalen incidenteel verlof toekennen.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel32
  - number: '33'
    text: |-
      1 Aan de jeugdige die op strafrechtelijke titel in een inrichting is geplaatst kan planmatig verlof worden
      verleend. Planmatig verlof wordt verleend in het kader van een verlofplan, dat onderdeel is van het verblijfsplan
      of het behandelplan en dat ten doel heeft de resocialisatie van de jeugdige.

      2 Het verlofplan geldt telkens voor een periode van ten hoogte zes maanden en bevat:

      a. een concrete aanduiding van het voorgenomen verloftraject in die periode wat betreft de frequentie, de duur, de
      aard en de bestemming van het verlof,

      b. een motivering van het belang van het verlof met het oog op de behandeling en resocialisatie,

      c. een afweging van de veiligheidsrisico's.

      3 Planmatig verlof kan bestaan uit:

      a. eendaags begeleid verlof zonder overnachting,

      b. eendaags onbegeleid verlof zonder overnachting,

      c. onbegeleid verlof met één overnachting,

      d. onbegeleid verlof met meerdere overnachtingen.

      4 Een voorlopig gehechte jeugdige komt niet in aanmerking voor planmatig verlof. Een tot de maatregel van plaatsing
      in een inrichting voor jeugdigen veroordeelde jeugdige komt niet in aanmerking voor planmatig verlof gedurende de
      tijd dat hij in afwachting van plaatsing in een behandelinrichting in een opvanginrichting verblijft.

      5 Een jeugdige ten aanzien van wie vaststaat dat hij, na de tenuitvoerlegging van de vrijheidsstraf of
      vrijheidsbenemende maatregel, Nederland zal dienen te verlaten dan wel zal worden uitgezet of uitgeleverd, komt
      niet in aanmerking voor planmatig verlof.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel33
  - number: '34'
    text: |-
      1 Het incidenteel verlof wordt door de jeugdige schriftelijk aangevraagd bij de directeur.

      2 Indien het verzoek een voorlopig gehechte jeugdige betreft, vraagt de directeur instemming van het openbaar
      ministerie. In de overige gevallen vraagt de directeur het openbaar ministerie om advies indien het openbaar
      ministerie een executie-indicator heeft gegeven.

      3 Indien het verzoek een civielrechtelijk geplaatste jeugdige betreft, vraagt de directeur instemming van de
      betrokken stichting.

      4 Indien het verzoek een jeugdige betreft die na de tenuitvoerlegging van de vrijheidsstraf of vrijheidsbenemende
      maatregel Nederland zal dienen te verlaten, of uitgezet of uitgeleverd zal worden, vraagt de directeur de
      Immigratie- en Naturalisatiedienst van het Ministerie van Justitie om advies.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel34
  - number: '35'
    text: |-
      1 Indien de jeugdige wegens ziekte niet in staat is tijdig van het verlof naar de inrichting terug te keren, meldt
      hij dit onverwijld aan de inrichting. Desgevraagd toont de jeugdige aan dat hij om medische redenen niet in staat
      is tijdig terug te keren.

      2 De directeur neemt, na overleg met de inrichtingsarts, en, voor zover mogelijk, gehoord de jeugdige, maatregelen
      met het oog op een zo spoedig mogelijke voortzetting van de vrijheidsontneming.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel35
  - number: '36'
    text: |-
      1 Indien zich tijdens het verlof een incident voordoet, kan de directeur, afhankelijk van de aard van het incident
      en het verlof, maatregelen nemen. Van een incident is in ieder geval sprake wanneer de jeugdige:

      a. tijdens het verlof betrokken is bij een verstoring van de openbare orde of het plegen van een strafbaar feit;

      b. verwijtbaar te laat of niet in de inrichting terugkeert;

      c. onder invloed van alcohol of verdovende middelen in de inrichting terugkeert;

      d. bij terugkeer in de inrichting contrabande met zich meevoert.

      2 Onverminderd de verplichting van de directeur om het incident elders te signaleren, worden gegevens over
      incidenten tijdens het verlof opgenomen in het dossier.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel36
  - number: '37'
    text: |-
      1 Aan een jeugdige die zonder begeleiding met verlof gaat, wordt door de inrichting een verlofpas van een door Onze
      Minister vastgesteld model verstrekt, waarop eventuele bijzondere voorwaarden worden vermeld.

      2 De jeugdige draagt de verlofpas tijdens het verlof steeds bij zich.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel37
  - number: '38'
    text: De directeur kan de jeugdige een bijdrage in de reis- en verblijfkosten verstrekken.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel38
  - number: '39'
    text: |-
      Op grond van gewijzigde omstandigheden kan de directeur een reeds verleend verlof of het daarvan nog resterende
      gedeelte intrekken, naar een andere tijdstip verplaatsen of er nadere voorwaarden aan verbinden.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel39
  - number: '40'
    text: Onze Minister kan nadere regels stellen over de procedure voor het aanvragen en het verlenen van verlof.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel40
  - number: '41'
    text: |-
      1 Tijdens het proefverlof neemt de jeugdige minimaal 26 uur per week deel aan activiteiten.

      2 Het proefverlof duurt maximaal één jaar. In bijzondere gevallen kan een proefverlof langer duren.

      3 De activiteiten tijdens het proefverlof zijn gericht op:

      a. het aanleren van bepaalde sociale vaardigheden,

      b. het bieden van onderwijs,

      c. het vergroten van de kans op arbeid na het einde van de vrijheidsbenemende maatregel,

      d. het bieden van bijzondere zorg aan de deelnemer, zoals verslavingszorg, geestelijke gezondheidszorg of
      verstandelijk gehandicaptenzorg,

      e. het invullen van de vrije tijd, of

      f. geven op andere wijze invulling aan het met handhaving van het karakter van de vrijheidsbenemende maatregel
      aanwenden van de tenuitvoerlegging hiervan aan de opvoeding en behandeling van de jeugdige en de voorbereiding van
      diens terugkeer in de maatschappij.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel41
  - number: '42'
    text: |-
      1 Indien de directeur het verantwoord acht dat aan een jeugdige proefverlof wordt verleend stelt hij een
      proefverlofplan op. Het proefverlofplan wordt opgesteld in samenwerking met de jeugdreclassering dan wel de
      reclassering, zo mogelijk die in het arrondissement waarin de jeugdige tijdens dit proefverlof zal wonen.

      2 Het proefverlofplan omvat in ieder geval een beschrijving van de activiteiten en de voorwaarden, een regeling van
      de verantwoordelijkheid voor de uitvoering van het proefverlof, de begeleiding van en het toezicht op de jeugdige,
      de melding van bijzondere voorvallen en de wijze en de frequentie van rapporteren over de jeugdige.

      3 De directeur overlegt met de jeugdige alvorens hij het proefverlofplan opstelt.

      4 Bij het opstellen van het proefverlofplan betrekt de inrichting zo veel mogelijk de ouders of voogd, stiefouder
      of pleegouders, tenzij:

      a. deze te kennen geven geen rol hierbij te willen vervullen, of

      b. zwaarwegende belangen van de jeugdige zich daartegen verzetten.

      5 [Artikel 7][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel7
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: '7'
        hoofdstuk: '2'
  - number: '43'
    text: |-
      1 De machtiging tot het verlenen van proefverlof van Onze Minister wordt schriftelijk door de directeur
      aangevraagd.

      2 De directeur voegt bij zijn aanvraag het proefverlofplan en het advies van het openbaar ministerie indien
      het openbaar ministerie ten aanzien van de jeugdige een executie-indicator heeft gegeven. De raad voor de
      kinderbescherming wordt ten aanzien van minderjarige jeugdigen in de gelegenheid gesteld advies uit te brengen.

      3 Onze Minister beslist zo spoedig mogelijk op de aanvraag van de directeur. De beslissing wordt
      schriftelijk medegedeeld aan de directeur en de jeugdreclassering dan wel de reclassering die overeenkomstig
      [artikel 42, eerste lid][ref1], aan de opstelling van het proefverlofplan heeft meegewerkt, alsmede, voor zover het
      minderjarige jeugdigen betreft, aan de raad voor de kinderbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel42
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: '42'
        hoofdstuk: '7'
  - number: '44'
    text: |-
      1 Bij zijn beslissing om een jeugdige proefverlof te verlenen betrekt de directeur in ieder geval de volgende
      aspecten:

      a. de aard, de zwaarte en de achtergronden van het gepleegde delict;

      b. het huidige verloop van de vrijheidsbenemende maatregel, waaronder het gedrag van de jeugdige, het nakomen van
      afspraken door de jeugdige en diens gemotiveerdheid ten aanzien van het proefverlof;

      c. het gevaar voor recidive;

      d. de mate waarin de jeugdige tijdens het proefverlof in staat kan worden geacht de met de grotere vrijheden
      gepaard gaande verantwoordelijkheid te dragen;

      e. een aanvaardbaar verblijfadres.

      2 De directeur verleent de jeugdige niet eerder proefverlof dan nadat deze zich schriftelijk bereid heeft verklaard
      tot naleving van de aan het proefverlof verbonden voorwaarden.

      3 Aan het verlenen van proefverlof kan de bijzondere voorwaarde worden gesteld dat de jeugdige zich onder
      elektronisch toezicht laat stellen. Onze Minister kan nadere regels stellen over het elektronisch toezicht.

      4 De aan het proefverlof verbonden activiteiten en voorwaarden worden door de directeur ter kennis gebracht van de
      jeugdreclassering dan wel de reclassering die de jeugdige zal begeleiden.

      5 De directeur stelt de raad voor de kinderbescherming voor zover het betreft minderjarige jeugdigen, het openbaar
      ministerie bij de rechtbank die in eerste aanleg kennis heeft genomen van het misdrijf terzake waarvan de maatregel
      van plaatsing in een inrichting voor jeugdigen is gelast, en het openbaar ministerie in het arrondissement waarin
      de jeugdige op grond van het proefverlofplan zal verblijven, schriftelijk in kennis van zijn beslissing.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel44
  - number: '45'
    text: |-
      1 Bij aanvang van het proefverlof ontvangt de jeugdige van de directeur een schriftelijk verklaring waarin de
      voorwaarden zijn vermeld die aan het proefverlof zijn verbonden, benevens de gronden waarop de directeur het
      proefverlof kan intrekken.

      2 De noodzakelijke kosten van bestaan tijdens proefverlof komen niet ten laste van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel45
  - number: '46'
    text: |-
      1 De jeugdreclassering dan wel de reclassering is belast met de begeleiding van de jeugdige tijdens het
      proefverlof en houdt toezicht op het dagelijkse verloop van het proefverlof. Zij beoordeelt in eerste instantie
      of de activiteiten naar behoren worden verricht en of de voorwaarden naar behoren worden nageleefd en kan in dat
      kader opdrachten geven aan de jeugdige. Zij kan in de wijze of het tijdstip waarop de activiteiten tijdens het
      proefverlof worden uitgevoerd, wijzigingen aanbrengen. Van deze wijzigingen in het proefverlofplan stelt zij de
      directeur onverwijld schriftelijk op de hoogte.

      2 De jeugdreclassering dan wel de reclassering, belast met de begeleiding, rapporteert regelmatig aan de directeur
      over het verloop van het proefverlof, met dien verstande dat de eerste rapportage plaatsvindt nadat een maand van
      het proefverlof is verstreken, en dat vervolgens telkens wordt gerapporteerd nadat een periode van twee maanden
      is verstreken.

      3 De jeugdreclassering dan wel de reclassering, belast met de begeleiding, rapporteert terstond aan de directeur
      ingeval de jeugdige de voorwaarden overtreedt of de veiligheid van anderen dan wel de algemene veiligheid van
      personen of goederen in gevaar brengt of dreigt te brengen.

      4 De directeur kan in een geval als bedoeld in het derde lid beslissen tot:

      a. het geven van een waarschuwing aan de jeugdige;

      b. wijziging of aanvulling van de voorwaarden, gesteld aan het proefverlof, met inachtneming van
      [artikel 44, tweede lid][ref1];

      c. intrekking van het proefverlof.

      5 De directeur geeft de jeugdige van een beslissing als bedoeld in het vierde lid onverwijld schriftelijk en zo
      veel mogelijk in een voor hem begrijpelijke taal een met redenen omklede, gedagtekende en ondertekende mededeling.

      6 Een beslissing als bedoeld in het vierde lid wordt door de directeur ter kennis gebracht van de jeugdreclassering
      dan wel de reclassering die de jeugdige begeleidt.

      7 Indien de directeur het proefverlof intrekt geeft hij daarvan terstond kennis aan Onze Minister.
      [Artikel 44, vijfde lid][ref2], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0012647#Artikel44
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: '44'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0012647
        artikel: '44'
        hoofdstuk: '7'
  - number: '47'
    text: |-
      Indien Onze Minister de machtiging tot het verlenen van proefverlof intrekt, geeft hij daarvan terstond kennis aan
      de directeur, die daarop het proefverlof intrekt. De kennisgeving wordt, onder vermelding van de datum van ingang
      van de beslissing, schriftelijk bevestigd. De [artikelen 44, vijfde lid][ref1], en [46, zesde lid][ref2], zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0012647#Artikel46
