  - number: '48'
    text: |-
      1 Voordat de directeur beslist dat de door de arts noodzakelijk geachte geneeskundige handeling onder dwang zal
      worden toegepast, pleegt de directeur overleg met die arts en met het hoofd van de afdeling waar de jeugdige
      verblijft. Indien de handeling door een andere arts wordt verricht, wordt bovendien met hem overlegd.

      2 Indien de toepassing van een geneeskundige handeling onder dwang noodzakelijk is ter afwending van ernstig gevaar
      dat voortvloeit uit een stoornis van de geestvermogens van de jeugdige, pleegt de directeur bovendien overleg met
      een psychiater.

      3 In het in het eerste en tweede lid bedoelde overleg wordt nagegaan of het ernstige gevaar voor de gezondheid of
      de veiligheid van de jeugdige of van anderen niet op een andere wijze kan worden afgewend. Bij de keuze voor een
      bepaalde geneeskundige handeling wordt steeds gekozen voor de voor de jeugdige minst ingrijpende handeling.

      4 De verantwoordelijke arts draagt zorg dat de melding van de toepassing van [artikel 37 van de wet][ref1], de
      resultaten van het overleg alsmede de afspraken die daarbij zijn gemaakt worden geregistreerd in het medisch
      dossier.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel37
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '37'
  - number: '49'
    text: |-
      1 De gedwongen geneeskundige handeling wordt toegepast in een daartoe geschikte ruimte, onder verantwoordelijkheid
      van de arts.

      2 Van de toepassing van een gedwongen geneeskundige handeling wordt onverwijld melding gedaan aan Onze Minister en
      de commissie van toezicht. Indien de geneeskundige handeling wordt toegepast ter afwending van ernstig gevaar dat
      voortvloeit uit een stoornis van de geestvermogens van de jeugdige wordt tevens onverwijld melding gedaan aan de
      bevoegde regionale inspecteur voor de gezondheidszorg. Onze Minister kan voor de meldingen een model vaststellen.

      3 De jeugdige wordt gedurende de periode die volgt op de gedwongen geneeskundige handeling zo vaak als nodig is
      bezocht door een arts dan wel in diens opdracht door een verpleegkundige. Het verslag van diens bevindingen wordt
      opgenomen in het medisch dossier.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel49
  - number: '50'
    text: |-
      1 Zo spoedig mogelijk na de toepassing van de gedwongen geneeskundige handeling wordt door of onder
      verantwoordelijkheid van de aan de inrichting verbonden arts een plan opgesteld gericht op een zodanige verbetering
      van de toestand van de jeugdige dat de toepassing van de gedwongen geneeskundige handeling kan worden beëindigd.
      Dit plan wordt opgenomen in het medisch dossier.

      2 Indien de toepassing van een gedwongen geneeskundige handeling als bedoeld in [artikel 48, tweede lid][ref1], de
      duur van twee weken te boven gaat wordt door de directeur een commissie samengesteld bestaande uit ten minste een
      arts of een psychiater en een psycholoog.

      3 De in het tweede lid bedoelde commissie brengt binnen twee dagen na de in het tweede lid bedoelde termijn en,
      indien de gedwongen geneeskundige handeling langer wordt voortgezet, om de twee weken, advies uit aan de directeur
      over de voortzetting van de gedwongen geneeskundige handeling.


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel48
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: '48'
        hoofdstuk: '8'
  - number: '51'
    text: |-
      Aan een inrichting zijn geestelijk verzorgers van verschillende godsdiensten of levensovertuigingen verbonden, doch
      in elk geval een geestelijk verzorger van protestantse of rooms-katholieke gezindte of een geestelijk verzorger
      behorend tot het humanistisch verbond.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel51
  - number: '52'
    text: |-
      1 Bij het Ministerie van Justitie zijn een hoofdpredikant, een hoofdaalmoezenier en een hoofd humanistische
      geestelijke verzorging aangesteld. Zij treden op als vertegenwoordiging van de zendende instanties en dienen Onze
      Minister gevraagd en ongevraagd van advies omtrent de geestelijke verzorging in de inrichtingen.

      2 De hoofden, genoemd in het eerste lid, zijn in ieder geval belast met het doen van voordrachten voor de
      aanstelling van geestelijk verzorgers bij de rijksinrichtingen, behorende tot hun gezindte of levensovertuiging.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel52
  - number: '53'
    text: |-
      1 De aanstelling van een geestelijk verzorger van protestantse of rooms-katholieke gezindte of een geestelijk
      verzorger, behorend tot het humanistisch verbond, bij een rijksinrichting geschiedt door of vanwege Onze Minister
      op voordracht van de betrokken hoofdgeestelijke, genoemd in [artikel 52, eerste lid][ref1].

      2 De aanstelling van een geestelijk verzorger van protestantse of rooms-katholieke gezindte of een geestelijk
      verzorger, behorend tot het humanistisch verbond, bij een particuliere inrichting geschiedt door of vanwege het
      bestuur van de inrichting gehoord de betrokken hoofdgeestelijke, genoemd in [artikel 52, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0012647#Artikel52
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: '52'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0012647
        artikel: '52'
        hoofdstuk: '9'
  - number: '54'
    text: |-
      1 Een geestelijk verzorger van een andere dan de in [artikel 53][ref1] genoemde gezindte of levensovertuiging
      kan door de directeur van een rijksinrichting aan diens inrichting worden verbonden anders dan bij wijze van een
      aanstelling. De directeur van de rijksinrichting neemt deze beslissing niet dan na overleg met de reeds aan de
      inrichting verbonden geestelijk verzorgers.

      2 Onze Minister kan functievereisten vaststellen ten aanzien van geestelijk verzorgers als bedoeld in de eerste
      volzin van het eerste lid.

      3 Een geestelijk verzorger die aan een rijksinrichting is verbonden anders dan bij wijze van aanstelling, ontvangt
      een bij regeling van Onze Minister vast te stellen vergoeding voor zijn werkzaamheden en de door hem gemaakte
      kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel53
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: '53'
        hoofdstuk: '9'
  - number: '55'
    text: |-
      1 Een jeugdige kan een beroepschrift indienen tegen het medisch handelen van de inrichtingsarts. Met de
      inrichtingsarts wordt in dit hoofdstuk gelijkgesteld de verpleegkundige dan wel andere hulpverleners die door de
      inrichtingsarts bij de zorg aan jeugdigen in de inrichting zijn betrokken.

      2 Onder medisch handelen als bedoeld in het eerste lid wordt verstaan:

      a. enig handelen in het kader van of nalaten in strijd met de zorg die de in het eerste lid bedoelde personen in
      die hoedanigheid behoren te betrachten ten opzichte van de jeugdige, met betrekking tot wiens gezondheidstoestand
      zij bijstand verlenen of hun bijstand is ingeroepen;

      b. enig ander dan onder a bedoeld handelen of nalaten in die hoedanigheid in strijd met het belang van een goede
      uitoefening van de individuele gezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel55
  - number: '56'
    text: |-
      1 Alvorens een beroepschrift in te dienen doet de jeugdige een schriftelijk verzoek aan de Medisch Adviseur bij het
      Ministerie van Justitie om te bemiddelen terzake van de klacht. Dit verzoek dient uiterlijk op de veertiende dag na
      die waarop het medisch handelen waartegen de klacht zich richt heeft plaatsgevonden te worden ingediend.

      2 De Medisch Adviseur stelt de betrokkene in de gelegenheid de klacht schriftelijk of mondeling toe te lichten,
      tenzij hij het aanstonds duidelijk acht dat de klacht zich niet voor bemiddeling leent. Hij kan ook bij andere
      personen mondeling of schriftelijk inlichtingen inwinnen.

      3 De Medisch Adviseur is ten behoeve van de bemiddeling bevoegd het medisch dossier van de jeugdige in te zien.

      4 De Medisch Adviseur streeft ernaar binnen vier weken een voor beide partijen aanvaardbare oplossing te bereiken.

      5 De Medisch Adviseur sluit de bemiddeling af met een mededeling van zijn bevindingen aan de jeugdige en de arts.
      De jeugdige wordt gewezen op de mogelijkheid van het indienen van een beroepschrift alsmede de termijn waarbinnen
      en de wijze waarop dit gedaan moet worden.

      6 Een afschrift van de mededeling zendt de Medisch Adviseur aan de directeur van de inrichting waaraan de arts
      tegen wiens medisch handelen de klacht zich richt is verbonden.

      7 De Medisch Adviseur is bevoegd een klacht door te verwijzen naar de beklagcommissie. Hij zendt van de
      doorverwijzing van een klacht een bericht aan de klager.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel56
  - number: '57'
    text: |-
      1 Het beroepschrift wordt ingediend bij en behandeld door een door en uit de Raad benoemde commissie van drie
      leden, bestaande uit één jurist en twee artsen, die wordt bijgestaan door een secretaris.

      2 Het met redenen omklede beroepschrift wordt uiterlijk op de zevende dag na die van de ontvangst van het afschrift
      van de mededeling van de Medisch Adviseur ingediend. De directeur draagt zorg dat een jeugdige die beroep wenst in
      te stellen daartoe zo spoedig mogelijk in de gelegenheid wordt gesteld.

      3 De indiening van het beroepschrift kan door tussenkomst van de directeur van de inrichting waar de jeugdige
      verblijft geschieden. De directeur draagt in dat geval zorg dat het beroepschrift, of, indien het beroepschrift
      zich in een envelop bevindt, de envelop, van een dagtekening wordt voorzien, welke geldt als dag van indiening.

      4 Het beroepschrift vermeldt zo nauwkeurig mogelijk het medisch handelen waarover wordt geklaagd en de redenen van
      het beroep.

      5 Indien de jeugdige de Nederlandse taal niet voldoende beheerst kan hij het beroepschrift in een andere taal
      indienen. De voorzitter van de beroepscommissie kan bepalen dat het beroepschrift in de Nederlandse taal wordt
      vertaald. De vergoeding van de voor de vertaling gemaakte kosten geschiedt met overeenkomstige toepassing van
      [artikel 81][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel81
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: '81'
        hoofdstuk: '16'
  - number: '58'
    text: |-
      1 De beroepscommissie en de secretaris zijn ten behoeve van de behandeling van het beroepschrift bevoegd het
      medisch dossier van de klager in te zien.

      2 De behandeling van het beroepschrift vindt niet in het openbaar plaats, behoudens ingeval de beroepscommissie van
      oordeel is dat de niet openbare behandeling niet verenigbaar is met enige een ieder verbindende bepaling van een in
      Nederland geldend verdrag.

      3 De secretaris van de beroepscommissie zendt de arts een afschrift van het beroepschrift toe en vraagt het verslag
      van de bemiddeling op bij de Medisch Adviseur.

      4 De beroepscommissie stelt de klager en de arts in de gelegenheid omtrent het beroepschrift mondeling of
      schriftelijk opmerkingen te maken, tenzij zij het beroep aanstonds kennelijk niet-ontvankelijk, kennelijk ongegrond
      of kennelijk gegrond acht. De beroepscommissie kan bepalen dat de mondelinge opmerkingen ten overstaan van een lid
      van de commissie kunnen worden gemaakt.

      5 De klager en de arts kunnen de voorzitter van de beroepscommissie de vragen opgeven die zij aan elkaar gesteld
      wensen te zien.

      6 De beroepscommissie kan de arts en de klager buiten elkaars aanwezigheid horen. In dat geval worden zij in de
      gelegenheid gesteld vooraf de vragen op te geven die zij gesteld wensen te zien en wordt de zakelijke inhoud van
      de aldus afgelegde verklaring door de voorzitter van de beroepscommissie aan de klager onderscheidenlijk de arts
      mondeling medegedeeld.

      7 De beroepscommissie kan ook bij andere personen mondeling of schriftelijk inlichtingen inwinnen. Indien mondeling
      inlichtingen worden ingewonnen, zijn het vijfde en zesde lid, tweede volzin, van overeenkomstige toepassing.
      De beroepscommissie kan bepalen dat ingeval bij een andere persoon mondeling inlichtingen worden ingewonnen, de
      betrokkenen uitsluitend in de gelegenheid worden gesteld schriftelijk de vragen op te geven die zij aan die persoon
      gesteld wensen te zien.

      8 De klager heeft het recht zich te doen bijstaan door een rechtsbijstandverlener of een andere vertrouwenspersoon
      die daartoe van de beroepscommissie toestemming heeft gekregen. Indien aan de klager een advocaat is toegevoegd,
      geschieden diens beloning en de vergoeding van de door hem gemaakte kosten volgens het Besluit vergoedingen
      rechtsbijstand 1994.

      9 Indien de klager de Nederlandse taal niet voldoende beheerst, draagt de voorzitter zorg voor de bijstand van een
      tolk. De beloning van de tolk en de vergoeding van de door de tolk gemaakte kosten geschieden met overeenkomstige
      toepassing van [artikel 81][ref1].

      10 Tijdens de beroepsprocedure staat de beroepscommissie aan de klager op diens verzoek toe van de gedingstukken
      kennis te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel81
