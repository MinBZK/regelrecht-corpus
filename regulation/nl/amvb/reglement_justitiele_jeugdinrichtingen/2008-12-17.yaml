articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. de wet: de [Beginselenwet justitiële jeugdinrichtingen][ref1];

      b. executie-indicator: de aantekening van het openbaar ministerie bij het aanbieden van een vonnis ter executie aan
      Onze Minister waarin wordt aangegeven dat het openbaar ministerie wil adviseren over te nemen beslissingen inzake
      de verschillende vormen van te verlenen vrijheden en deelname aan een scholings- en trainingsprogramma aan de
      betrokken jeugdige;

      c. jeugdreclassering: een stichting als bedoeld in [artikel 1, onder f, van de Wet op de jeugdzorg][ref2], bij de
      uitvoering van de taken, bedoeld in [artikel 10, eerste lid, onder c en d, van die wet][ref3].

      d. reclassering: een reclasseringsinstelling als bedoeld in
      [artikel 1, onder b, van de Reclasseringsregeling 1995][ref4];

      e. raad voor de kinderbescherming: de raad, bedoeld in
      [artikel 238, eerste lid, van Boek 1 van het Burgerlijk Wetboek][ref5];

      f. stichting: een stichting als bedoeld in [artikel 1, onder f, van de Wet op de jeugdzorg][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0011756
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0016637#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0007120#Artikel1
