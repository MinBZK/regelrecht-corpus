  - number: '59'
    text: |-
      1 De beroepscommissie doet zo spoedig mogelijk uitspraak. De uitspraak is met redenen omkleed en gedagtekend. Zij
      wordt door de voorzitter, alsmede door de secretaris ondertekend. Bij verhindering van één van hen wordt de reden
      daarvan in de uitspraak vermeld. Aan de klager, de arts en de directeur wordt onverwijld en kosteloos een afschrift
      van de beslissing van de beroepscommissie toegezonden of uitgereikt.

      2 Indien de klager de Nederlandse taal niet voldoende beheerst en niet op andere wijze in een vertaling kan worden
      voorzien, draagt de voorzitter van de beroepscommissie zorg voor een vertaling van de uitspraak, bedoeld in het
      eerste lid. De vergoeding van de voor de vertaling gemaakte kosten geschiedt met overeenkomstige toepassing van
      [artikel 81][ref1].

      3 De secretaris zendt van alle uitspraken van de beroepscommissie een afschrift naar Onze Minister. Een ieder heeft
      recht op kennisneming van deze uitspraken en het ontvangen van een afschrift daarvan. Onze Minister draagt zorg dat
      dit afschrift geen gegevens bevat waaruit de identiteit van de jeugdige kan worden afgeleid. Met betrekking tot de
      kosten van het ontvangen van een afschrift is het bij of krachtens de [Wet tarieven in strafzaken][ref2] bepaalde
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0002406
