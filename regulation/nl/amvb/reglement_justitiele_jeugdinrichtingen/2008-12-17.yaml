  - number: '5'
    text: |-
      1 Een tot de maatregel van plaatsing in een inrichting voor jeugdigen veroordeelde jeugdige kan, onverminderd de
      [artikelen 8][ref1] en [9][ref2], drie maanden voor het beoogde einde van de maatregel die maximaal twee jaar
      duurt, of zes maanden voor het beoogde einde van de maatregel die meer dan twee jaar en maximaal vier jaar duurt,
      in aanmerking komen voor deelname aan een scholings- en trainingsprogramma. In bijzondere gevallen kan voor een
      langere duur worden deelgenomen aan een scholings- en trainingsprogramma.

      2 Voor deelname aan een scholings- en trainingsprogramma komt niet in aanmerking de jeugdige aan wie de maatregel
      van plaatsing in een inrichting voor jeugdigen wegens een gebrekkige ontwikkeling of ziekelijke stoornis van de
      geestvermogens als bedoeld in [artikel 77s, derde lid, van het Wetboek van Strafrecht][ref3] is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0012647#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel77s
