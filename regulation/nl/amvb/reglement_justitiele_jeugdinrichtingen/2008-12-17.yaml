  - number: '68'
    text: |-
      1 De jeugdige heeft, behoudens de overeenkomstig het tweede en derde lid te stellen beperkingen, recht op inzage
      van de in zijn dossier vastgelegde gegevens.

      2 De directeur kan de jeugdige die een verzoek doet tot inzage van zijn dossier of delen daarvan, bepaalde gegevens
      onthouden, indien dit noodzakelijk is voor de handhaving van de orde of de veiligheid in de inrichting, in het
      belang van de geestelijke of lichamelijke ontwikkeling van de jeugdige, ter bescherming van de persoonlijke
      levenssfeer van anderen dan de jeugdige voor zover die niet bij de tenuitvoerlegging betrokken zijn, of wanneer de
      uitvoering van het verblijfsplan of het behandelplan dit vereist.

      3 De directeur kan het recht op inzage van evaluatieverslagen beperken tot een daarvan gemaakte samenvatting,
      indien de uitvoering van het verblijfsplan of het behandelplan dit vereist.

      4 De directeur kan, in geval van toepassing van het tweede of derde lid:

      a. de jeugdige mondeling kennis geven van de gegevens waarvan hij inzage verlangt, of

      b. een door de jeugdige gemachtigde persoon inzage geven in de gegevens waarvan de inzage aan de jeugdige wordt
      onthouden.

      5 Voor wat betreft het verblijfsplan, het behandelplan en het evaluatieverslag omvat het recht op inzage tevens het
      recht op het ontvangen van een afschrift.

      6 Met toepassing van [artikel 464 van Boek 7 van het Burgerlijk Wetboek][ref1] is [artikel 456 van dit boek][ref2]
      niet van overeenkomstige toepassing op de dossiers, bedoeld in dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel464
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel456
