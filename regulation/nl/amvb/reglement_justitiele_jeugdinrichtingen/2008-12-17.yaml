  - number: '6'
    text: |-
      1 Een jeugdige die met toepassing van [artikel 261][ref1]
      of [305, derde lid, van Boek 1 van het Burgerlijk Wetboek][ref2] in een inrichting is geplaatst, kan, onverminderd
      de [ artikelen 8][ref3] en [9][ref4], drie maanden voor het beoogde einde van de uithuisplaatsing die in een
      inrichting ten uitvoer wordt gelegd, in aanmerking komen voor deelname aan een scholings- en trainingsprogramma.

      2 Een jeugdige als bedoeld in het eerste lid die op strafrechtelijke titel in een inrichting is geplaatst, kan
      slechts voor deelname aan een scholings- en trainingsprogramma in aanmerking komen voor zover hij op grond van de
      terzake geldende regels voor deelname aan een scholings- en trainingsprogramma in aanmerking komt.


