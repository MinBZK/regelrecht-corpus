  - number: '13'
    text: |-
      1 De deelnemer aan een scholings- en trainingsprogramma kan bij de beklagcommissie bij de inrichting waarin hij is
      ingeschreven een klacht indienen over de beslissingen, bedoeld in [artikel 12, derde lid, onderdelen a en b][ref1].

      2 De [artikelen 65, tweede en derde lid][ref2], [66][ref3], [67][ref4], [68][ref5], [69][ref6], [70][ref7],
      [72, met uitzondering van het derde lid, het vijfde lid, tweede volzin, en het zesde lid][ref8], [73][ref9],
      [74][ref10], [75][ref11] en [76 van de wet][ref12] zijn van overeenkomstige toepassing.


