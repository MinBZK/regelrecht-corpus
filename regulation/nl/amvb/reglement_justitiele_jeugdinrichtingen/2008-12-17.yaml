  - number: '87'
    text: |-
      Een ieder die betrokken is bij de uitvoering van [de wet][ref1] en dit reglement en daarbij de beschikking krijgt
      over gegevens waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, en voor wie niet reeds
      uit hoofde van ambt, beroep of wettelijk voorschrift terzake van die gegevens een geheimhoudingsplicht geldt, is
      verplicht tot geheimhouding daarvan, behoudens voor zover enig wettelijk voorschrift hem tot bekendmaking verplicht
      of uit zijn taak bij de uitvoering van dit reglement de noodzaak tot bekendmaking voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0011756
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel87
