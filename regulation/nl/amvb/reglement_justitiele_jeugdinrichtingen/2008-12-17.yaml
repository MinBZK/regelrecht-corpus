  - number: '14'
    text: |-
      1 Bij elke inrichting of afdeling is een commissie van toezicht, waarvan de leden worden benoemd voor de tijd van
      vijf jaren. Zij kunnen tweemaal voor herbenoeming in aanmerking komen.

      2 De commissie bestaat uit ten minste zes en ten hoogste een door Onze Minister vast te stellen aantal leden.

      3 De commissie van toezicht is zo breed mogelijk samengesteld. Van elke commissie maken in elk geval deel uit:

      a. een met rechtspraak belast lid van de rechterlijke macht;

      b. een advocaat;

      c. een deskundige op het gebied van de gedragswetenschappen;

      d. een deskundige op het gebied van de pedagogische hulpverlening.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel14
  - number: '15'
    text: |-
      1 De leden van de commissie van toezicht worden door Onze Minister benoemd en ontslagen. Onze Minister wijst uit de
      leden een voorzitter aan.

      2 Aan de commissie is een secretaris verbonden. Deze is geen lid van de commissie. De secretaris wordt door
      Onze Minister benoemd en ontslagen. De secretaris van de commissie van toezicht is tevens secretaris van de
      beklagcommissie.

      3 De commissie kan uit haar midden een of meer plaatsvervangende secretarissen aanwijzen om, in overleg met de
      secretaris, bepaalde secretariaatswerkzaamheden te verrichten en de secretaris bij diens afwezigheid te vervangen.
      Onze Minister kan aan een commissie van toezicht een of meer plaatsvervangende secretarissen toevoegen die geen lid
      zijn van de commissie.

      4 Onze Minister beslist binnen drie maanden op een verzoek tot benoeming als bedoeld in het eerste, tweede of derde
      lid.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel15
  - number: '16'
    text: |-
      Voor benoeming als lid, secretaris of plaatsvervangend secretaris komen niet in aanmerking:

      a. ambtenaren of andere personen, werkzaam onder de verantwoordelijkheid van Onze Minister op het terrein van de
      tenuitvoerlegging van vrijheidsbenemende straffen en maatregelen, niet zijnde officieren van justitie of advocaten-
      generaal;

      b. personeelsleden of medewerkers, werkzaam bij een inrichting, dan wel leden van het bestuur of de Raad van
      Toezicht van de rechtspersoon die een inrichting beheert;

      c. personen, werkzaam bij een door Onze Minister gesubsidieerde instelling die werkzaam is op het terrein van
      de tenuitvoerlegging van vrijheidsstraffen en vrijheidsbenemende maatregelen, indien zij in het kader van de
      uitoefening van hun functie te maken hebben met de personen, ingesloten in de inrichting waarbij de commissie van
      toezicht is ingesteld;

      d. personen, werkzaam onder de verantwoordelijkheid van Onze Minister, indien hun onafhankelijkheid of
      onpartijdigheid hetzij door hun positie, hetzij door de aard van hun werkzaamheden in het geding zou kunnen komen;

      e. personen tegen wie bezwaren bestaan tegen de vervulling van de functie die blijken uit de algemene
      documentatieregisters als bedoeld in het [Besluit inlichtingen justitiële documentatie][ref1] of de
      politiegegevens, bedoeld in [artikel 1, onderdeel a, van de Wet politiegegevens][ref2]. De bezwaren hebben
      betrekking op het vertrouwelijk karakter van de functie alsmede de aan de functie verbonden bevoegdheden;

      f. personen werkzaam bij de Raad of de Inspectie jeugdzorg.


      [ref1]: https://wetten.overheid.nl/BWBR0002292
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel1
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel16
