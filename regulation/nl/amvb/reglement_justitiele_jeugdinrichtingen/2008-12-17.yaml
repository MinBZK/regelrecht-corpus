  - number: '7'
    text: |-
      Voor deelname aan een scholings- en trainingsprogramma komen niet in aanmerking jeugdigen die na de
      tenuitvoerlegging van de vrijheidsstraf of vrijheidsbenemende maatregel Nederland zullen dienen te verlaten of
      uitgezet of uitgeleverd zullen worden.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel7
  - number: '8'
    text: |-
      1 Indien de directeur het verantwoord acht dat een ingevolge de [artikelen 3 tot en met 7][ref1] daarvoor
      in aanmerking komende jeugdige deelneemt aan een scholings- en trainingsprogramma doet hij een daartoe
      strekkende voordracht aan de selectiefunctionaris. Hij betrekt in zijn voordracht de aspecten, genoemd in
      [artikel 9, eerste en tweede lid][ref2].

      2 In het geval van een voorlopig gehechte jeugdige kan de voordracht ook door het openbaar ministerie worden
      gedaan, na advies van de raad voor de kinderbescherming. Wanneer de directeur de voordracht doet, doet hij
      deze met instemming van het openbaar ministerie, belast met de vervolging van de jeugdige, en wordt de raad
      voor de kinderbescherming in de gelegenheid gesteld advies uit te brengen. De voordracht wordt opgesteld in
      samenwerking met de jeugdreclassering dan wel de reclassering in het arrondissement waarin aan het scholings- en
      trainingsprogramma wordt deelgenomen.

      3 De directeur voegt bij zijn voordracht in het geval van een tot jeugddetentie of tot de maatregel van plaatsing
      in een inrichting voor jeugdigen veroordeelde jeugdige het advies van het openbaar ministerie indien het openbaar
      ministerie ten aanzien van de jeugdige een executie-indicator heeft gegeven. De voordracht wordt opgesteld in
      samenwerking met de jeugdreclassering dan wel de reclassering in het arrondissement waarin aan het scholings- en
      trainingsprogramma wordt deelgenomen. De raad voor de kinderbescherming wordt door de directeur in de gelegenheid
      gesteld advies uit te brengen.

      4 De directeur stelt in het geval van een jeugdige die met toepassing van [artikel 261][ref3]
      of [305, derde lid, van Boek 1 van het Burgerlijk Wetboek][ref4] in een inrichting is geplaatst, zijn voordracht op
      met instemming van de betrokken stichting.

      5 De directeur overlegt met de jeugdige alvorens hij zijn voordracht doet.

      6 Bij het opstellen van de voordracht betrekt de inrichting zo veel mogelijk de ouders of voogd, stiefouder of
      pleegouders, tenzij:

      a. deze te kennen geven geen rol hierbij te willen vervullen, of

      b. zwaarwegende belangen van de jeugdige zich daartegen verzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012647#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel261
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel305
