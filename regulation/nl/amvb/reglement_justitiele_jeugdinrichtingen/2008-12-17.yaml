  - number: '4'
    text: |-
      1 Een tot vrijheidsstraf veroordeelde jeugdige komt, onverminderd de [artikelen 8][ref1] en [9][ref2], slechts
      voor deelname aan een scholings- en trainingsprogramma in aanmerking, indien:

      a. hij ten minste de helft van de hem opgelegde onherroepelijke vrijheidsstraf heeft ondergaan, en

      b. het strafrestant ten minste een maand en ten hoogste drie maanden bedraagt.

      Van het in de eerste volzin, onder a en b, bepaalde kan worden afgeweken wanneer de jeugdige reeds tijdens de
      voorlopige hechtenis aan een scholings- en trainingsprogramma deelnam.

      2 Voor deelname aan een scholings- en trainingsprogramma komen niet in aanmerking:

      a. tot vrijheidsstraf veroordeelde jeugdigen ten aanzien van wie nog een andere strafvervolging is ingesteld
      waarbij een vrijheidsstraf of vrijheidsbenemende maatregel is gevorderd;

      b. tot vrijheidsstraf veroordeelde jeugdigen ten aanzien van wie de tenuitvoerlegging van een tevens opgelegde
      maatregel van plaatsing in een inrichting voor jeugdigen nog moet aanvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0012647#Artikel9
