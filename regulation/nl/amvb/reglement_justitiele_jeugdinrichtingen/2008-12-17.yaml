  - number: '80'
    text: |-
      1 Indien Onze Minister van oordeel is dat de [artikelen 77 tot en met 79][ref1] niet of in onvoldoende mate of op
      onjuiste wijze worden nageleefd, kan hij de directeur een schriftelijke aanwijzing geven.

      2 In de aanwijzing omschrijft Onze Minister met redenen omkleed de punten waarop de
      [artikelen 77 tot en met 79][ref2] niet of in onvoldoende mate of op onjuiste wijze worden nageleefd, alsmede de in
      verband daarmee te nemen maatregelen.

      3 De aanwijzing bevat een termijn waarbinnen de directeur eraan moet voldoen. De directeur is verplicht binnen de
      daartoe gestelde termijn aan de aanwijzing te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel77
