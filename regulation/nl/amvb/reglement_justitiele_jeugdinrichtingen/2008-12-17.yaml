  - number: '2'
    text: |-
      1 Een scholings- en trainingsprogramma omvat minimaal 26 uur per week aan activiteiten waaraan door de deelnemer
      aan dat scholings- en trainingsprogramma wordt deelgenomen.

      2 De activiteiten in een scholings- en trainingsprogramma zijn gericht op:

      a. het aanleren van bepaalde sociale vaardigheden,

      b. het bieden van onderwijs,

      c. het vergroten van de kans op arbeid na het einde van de vrijheidsstraf of de vrijheidsbenemende maatregel,

      d. het bieden van bijzondere zorg aan de deelnemer, zoals verslavingszorg, geestelijke gezondheidszorg of
      verstandelijk gehandicaptenzorg,

      e. het invullen van de vrije tijd, of

      f. geven op andere wijze invulling aan het met handhaving van het karakter van de vrijheidsstraf of de
      vrijheidsbenemende maatregel aanwenden van de tenuitvoerlegging daarvan aan de opvoeding dan wel behandeling van de
      jeugdige en de voorbereiding van diens terugkeer in de maatschappij.

      3 Van een scholings- en trainingsprogramma wordt een schriftelijke omschrijving gemaakt. Deze omvat in ieder
      geval een beschrijving van de activiteiten, een regeling van de verantwoordelijkheid voor de uitvoering van het
      programma, de begeleiding van en het toezicht op de deelnemer aan het scholings- en trainingsprogramma, de melding
      van bijzondere voorvallen en de wijze en de frequentie van rapporteren over de deelnemer aan het scholings- en
      trainingsprogramma. Wanneer het scholings- en trainingsprogramma voor meerdere jeugdigen is bedoeld wordt tevens de
      doelgroep van het programma omschreven.

      4 Onze Minister kan nadere regels stellen over de procedure voor de erkenning van een scholings- en
      trainingsprogramma en over de kwaliteitseisen waaraan een scholings- en trainingsprogramma moet voldoen.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel2
  - number: '3'
    text: |-
      Een voorlopig gehechte jeugdige komt, onverminderd de [artikelen 8][ref1] en [9][ref2], slechts voor deelname aan
      een scholings- en trainingsprogramma in aanmerking indien er ten aanzien van hem geen onherroepelijke rechterlijke
      beslissingen waarbij een vrijheidsstraf, niet zijnde vervangende jeugddetentie, of een vrijheidsbenemende maatregel
      is opgelegd, openstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0012647#Artikel9
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel3
