  - number: '60'
    text: |-
      1 De uitspraak van de beroepscommissie strekt tot gehele of gedeeltelijke:

      a. niet-ontvankelijkverklaring van het beroep;

      b. ongegrondverklaring van het beroep;

      c. gegrondverklaring van het beroep.

      2 Indien de klacht door de beroepscommissie geheel of gedeeltelijk gegrond wordt geacht bepaalt de beroepscommissie
      of enige tegemoetkoming aan de klager geboden is. Zij stelt de tegemoetkoming, die geldelijk van aard kan zijn,
      vast.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel60
  - number: '61'
    text: |-
      1 De in de [artikelen 55 tot en met 58][ref1] aan de jeugdige toegekende rechten kunnen, behoudens ingeval de
      Medisch Adviseur of de beroepscommissie van oordeel is dat zwaarwegende belangen van de jeugdige zich daartegen
      verzetten, mede worden uitgeoefend door:

      a. de curator, indien de jeugdige onder curatele is gesteld;

      b. de mentor, indien ten behoeve van de jeugdige een mentorschap is ingesteld;

      c. de ouders of voogd, indien de jeugdige minderjarig is.

      2 De directeur draagt zorg dat de in het eerste lid genoemde personen op deze rechten opmerkzaam worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel55
