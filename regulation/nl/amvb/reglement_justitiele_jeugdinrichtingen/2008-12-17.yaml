    text: |-
      Buiten geval van opzet of bewuste roekeloosheid is de aansprakelijkheid van de directeur voor voorwerpen die een
      jeugdige ingevolge [artikel 50, tweede lid, van de wet][ref1] onder zich heeft, beperkt tot vijfhonderd euro per
      voorwerp, inclusief eventuele gevolgschade.


