  - number: '9'
    text: |-
      1 Bij zijn beslissing om een jeugdige in de gelegenheid te stellen deel te nemen aan een scholings- en
      trainingsprogramma betrekt de selectiefunctionaris in ieder geval de volgende aspecten:

      a. het gedrag van de jeugdige, het nakomen van afspraken door de jeugdige en diens gemotiveerdheid om aan een
      scholings- en trainingsprogramma deel te nemen;

      b. de mate waarin de jeugdige tijdens zijn deelname in staat kan worden geacht de met de grotere vrijheden gepaard
      gaande verantwoordelijkheid te dragen;

      c. een aanvaardbaar verblijfadres;

      d. de geschiktheid van de jeugdige voor een bepaald scholings- en trainingsprogramma.

      2 Bij jeugdigen die op strafrechtelijke titel in de inrichting verblijven betrekt de selectiefunctionaris tevens de
      volgende aspecten:

      a. de aard, de zwaarte en de achtergronden van het gepleegde delict onderscheidenlijk het delict waarvan de
      jeugdige wordt verdacht;

      b. het huidige detentieverloop;

      c. het gevaar voor recidive.

      3 De selectiefunctionaris neemt zijn beslissing over deelname aan een scholings- en trainingsprogramma niet dan
      nadat de jeugdige zich schriftelijk bereid heeft verklaard tot deelname aan het programma en naleving van de
      daaraan verbonden voorwaarden.

      4 De selectiefunctionaris stelt de raad voor de kinderbescherming en het openbaar ministerie, ingeval het een
      executie-indicator heeft gegeven, in kennis van zijn beslissing.

      5 De selectiefunctionaris neemt zijn beslissing over deelname aan een scholings- en trainingsprogramma van een
      voorlopig gehechte jeugdige niet dan nadat de rechter hiermee heeft ingestemd.

      6 Bij aanvang van het scholings- en trainingsprogramma ontvangt de jeugdige van de directeur een schriftelijke
      verklaring waarin de activiteiten van het scholings- en trainingsprogramma en de daaraan verbonden voorwaarden zijn
      vermeld, benevens de gronden waarop de deelname aan het scholings- en trainingsprogramma kan worden beëindigd.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel9
  - number: '10'
    text: |-
      1 De algemene verantwoordelijkheid voor de tenuitvoerlegging van een scholings- en trainingsprogramma ligt bij de
      directeur van de inrichting waarin de deelnemer aan het scholings- en trainingsprogramma is ingeschreven.

      2 De jeugdreclassering dan wel de reclassering die verantwoordelijk is voor de feitelijke uitvoering van het
      programma, is belast met de begeleiding van de jeugdige en houdt toezicht op het dagelijkse verloop van het
      scholings- en trainingsprogramma. Zij beoordeelt in eerste instantie of de activiteiten naar behoren worden
      verricht en de voorwaarden naar behoren worden nageleefd en kan in dat kader opdrachten geven aan de deelnemer.
      Zij kan in de wijze of het tijdstip waarop de activiteiten binnen het scholings- en trainingsprogramma worden
      uitgevoerd, wijzigingen aanbrengen. Van deze wijzigingen stelt zij de directeur onverwijld schriftelijk op
      de hoogte. Periodiek rapporteert zij aan de directeur over de deelname van de jeugdige aan het scholings- en
      trainingsprogramma.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel10
  - number: '11'
    text: |-
      De noodzakelijke kosten van bestaan tijdens deelname aan een scholings- en trainingsprogramma komen niet ten laste
      van Onze Minister, tenzij het gaat om de kosten van een pleegkind in het kader van een uithuisplaatsing en de
      Regeling vergoeding pleeggezinnen van toepassing is.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel11
  - number: '12'
    text: |-
      1 Aan de deelname door een jeugdige aan een scholings- en trainingsprogramma worden, onverminderd eventuele nader
      door de directeur te stellen bijzondere voorwaarden, de volgende algemene voorwaarden verbonden:

      a. de deelnemer aan het scholings- en trainingsprogramma gedraagt zich overeenkomstig de aanwijzingen van
      degene die is belast met zijn begeleiding en het houden van toezicht op hem en verschaft aan deze alle verlangde
      inlichtingen;

      b. hij doet tevoren melding aan de directeur van een verandering van zijn verblijfplaats;

      c. hij maakt zich niet schuldig aan een strafbaar feit.

      2 Aan de deelname aan een scholings- en trainingsprogramma kan, tenzij het een jeugdige betreft ten aanzien van wie
      [artikel 261][ref1] of [305, derde lid, van Boek 1 van het Burgerlijk Wetboek][ref2] is toegepast, de bijzondere
      voorwaarde worden gesteld dat de deelnemer zich onder elektronisch toezicht laat stellen. Onze Minister kan nadere
      regels stellen over het elektronisch toezicht.

      3 Degene die belast is met de feitelijke uitvoering van het scholings- en trainingsprogramma rapporteert terstond
      aan de directeur in geval van overtreding van de voorwaarden. De directeur kan, afhankelijk van de ernst van de
      overtreding, alsdan beslissen tot:

      a. het geven van een waarschuwing aan de deelnemer aan het scholings- en trainingsprogramma;

      b. wijziging of aanvulling van de bijzondere voorwaarden, gesteld aan deelname aan een scholings- en
      trainingsprogramma;

      c. het adviseren van de selectiefunctionaris de deelname aan het scholings- en trainingsprogramma te beëindigen.

      4 Ten aanzien van jeugdigen die op civielrechtelijke titel aan een scholings- en trainingsprogramma deelnemen,
      worden de beslissingen, bedoeld in het eerste en derde lid, genomen met instemming van de betrokken stichting.
      Indien geen instemming wordt verleend, beslist de selectiefunctionaris.

      5 Ten aanzien van voorlopig gehechte jeugdigen worden de beslissingen, bedoeld in het eerste, tweede en derde lid,
      genomen met instemming van het openbaar ministerie.

      6 De directeur geeft de deelnemer aan een scholings- en trainingsprogramma van een beslissing als bedoeld in het
      derde lid onverwijld schriftelijk en zo veel mogelijk in een voor hem begrijpelijke taal een met redenen omklede,
      gedagtekende en ondertekende mededeling.

      7 Van het stellen van bijzondere voorwaarden, de overtreding van de voorwaarden en een beslissing als bedoeld in
      het derde lid, onderdelen a en b, doet de directeur mededeling aan de selectiefunctionaris.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel261
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel305
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel12
