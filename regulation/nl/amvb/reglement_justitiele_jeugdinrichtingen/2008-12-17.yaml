  - number: '74'
    text: |-
      De particuliere inrichting beschikt over een calamiteitenplan, waarin is geregeld welke acties dienen te worden
      ondernomen, en door wie, in het geval van een calamiteit.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel74
  - number: '75'
    text: |-
      1 De directeur van een rijksinrichting brengt jaarlijks vóór 1 oktober aan Onze Minister een jaarplan voor het
      volgende jaar uit. Het jaarplan omvat in ieder geval een begroting van de kosten en opbrengsten voor dat jaar.

      2 De directeur van een rijksinrichting brengt jaarlijks vóór 1 maart aan Onze Minister een jaarverslag over het
      voorgaande jaar uit. Bij dit verslag wordt een jaarrekening gevoegd. De directeur zendt een afschrift van het
      jaarverslag aan de Inspectie jeugdhulpverlening en jeugdbescherming.

      3 Onze Minister kan regels stellen aan de vorm en de inhoud van de in het eerste en tweede lid genoemde stukken.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel75
  - number: '76'
    text: |-
      De rijksinrichting beschikt over een calamiteitenplan, waarin is geregeld welke acties dienen te worden ondernomen,
      en door wie, in het geval van een calamiteit.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel76
  - number: '77'
    text: |-
      De inrichting biedt passende opvang of behandeling aan. Onder passende opvang of behandeling wordt verstaan
      zorg van goed niveau, die in ieder geval doeltreffend, doelmatig en gericht op de jeugdige wordt verleend en die
      afgestemd is op de reële behoefte van de jeugdige.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel77
  - number: '78'
    text: |-
      De inrichting organiseert de opvang of behandeling op zodanige wijze, voorziet de instelling zowel kwalitatief als
      kwantitatief zodanig van personeel en materieel en draagt zorg voor een zodanige verantwoordelijkheidsverdeling,
      dat een en ander leidt of redelijkerwijs moet leiden tot een verantwoorde opvang of behandeling.
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel78
  - number: '79'
    text: |-
      1 Het uitvoeren van [artikel 78][ref1] omvat mede de systematische bewaking, beheersing en verbetering van de
      kwaliteit van de opvang of behandeling.

      2 Ter uitvoering van het eerste lid draagt de inrichting, afgestemd op de aard en omvang van de instelling, zorg
      voor:

      a. het op systematische wijze verzamelen en registreren van gegevens betreffende de kwaliteit van de opvang of
      behandeling in een werkplan;

      b. het aan de hand van de gegevens, bedoeld onder a, op systematische wijze toetsen in hoeverre de wijze van
      uitvoering van [artikel 78][ref2] leidt tot een verantwoorde opvang of behandeling;

      c. het op basis van de uitkomst van de toetsing, bedoeld onder b, zo nodig veranderen van de wijze waarop
      [artikel 78][ref3] wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0012647#Artikel78
      [ref3]: https://wetten.overheid.nl/BWBR0012647#Artikel78
    url: https://wetten.overheid.nl/BWBR0012647/2008-12-17#Artikel79
