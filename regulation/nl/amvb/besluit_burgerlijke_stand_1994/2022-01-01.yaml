$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_burgerlijke_stand_1994
regulatory_layer: AMVB
publication_date: '2014-12-30'
valid_from: '2022-01-01'
bwb_id: BWBR0006493
url: https://wetten.overheid.nl/BWBR0006493/2022-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op voordracht van de Staatssecretaris van Justitie van 19 oktober 1993, stafafdeling Wetgeving Privaatrecht, nr
    401184/93/6;

    Gelet op de artikelen 16d, 17c, 18, derde lid, 18c, 19j, tweede lid, onder b, 20d, 21, derde lid en 24b, tweede
    lid, van Boek 1 van het Burgerlijk Wetboek, als vastgesteld bij wet van 14 oktober 1993, Stb. 555;

    De Raad van State gehoord (advies van 8 februari 1994 nr W03.93.0690);

    Gezien het nader rapport van de Staatssecretaris van Justitie van 22 februari 1994 stafafdeling Wetgeving
    Privaatrecht, nr 426987/94/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      De ambtenaar van de burgerlijke stand en de buitengewoon ambtenaar van de burgerlijke stand verrichten hun
      ambtsbezigheden in het gemeentehuis.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel1
  - number: '1.2'
    text: |-
      De ambtenaar van de burgerlijke stand en de buitengewoon ambtenaar van de burgerlijke stand kunnen ook elders
      binnen de gemeente ambtsbezigheden verrichten voor zover daartoe gewichtige redenen bestaan.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel1
  - number: '2'
    text: |-
      Burgemeester en wethouders wijzen, voor zoveel nodig, de ambtenaar van de burgerlijke stand aan die belast is met
      de leiding van de dienst.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel2
  - number: '3'
    text: |-
      De gemeente verschaft de ambtenaren van de burgerlijke stand kantoorruimte alsmede alle materiële voorzieningen
      welke voor een behoorlijke uitoefening van hun taak vereist zijn. Het salaris van het personeel, nodig om de
      ambtenaren van de burgerlijke stand bij te staan, komt ten laste van de gemeente.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel3
  - number: '4'
    text: |-
      Na overleg met de ambtenaren van de burgerlijke stand besluiten burgemeester en wethouders tot het aangaan,
      wijzigen en beëindigen van arbeidsovereenkomsten met het personeel bedoeld in [artikel 3][ref1]. Het personeel
      ontvangt van de ambtenaar van de burgerlijke stand, onder wiens leiding het zijn werkzaamheden verricht, zijn
      instructie en is aan hem of de ambtenaar die hem vervangt, onmiddellijk ondergeschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0006493#Artikel3
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006493
        artikel: '3'
        hoofdstuk: '1'
        afdeling: Eerste
  - number: '5'
    text: |-
      De ambtenaar van de burgerlijke stand verricht, tenzij gewichtige redenen zich daartegen verzetten, onverwijld de
      werkzaamheden vereist voor het houden der registers.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel5
  - number: '6.1'
    text: De registers van de burgerlijke stand zijn losbladig.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel6
  - number: '6.2'
    text: |-
      De beschreven losse bladen moeten worden samengevoegd tot een register, telkens wanneer hiervan een deel van de
      gebruikelijke omvang kan worden samengesteld.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel6
  - number: '6.3'
    text: |-
      De dubbelen van de akten van de burgerlijke stand kunnen, behalve met papier, ook worden vervaardigd door opslag op
      een door Onze Minister van Justitie te bepalen gegevensdrager.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel6
  - number: '6.4'
    text: |-
      De ambtenaar van de burgerlijke stand bewaart de onder hem berustende bescheiden en andere gegevensdragers
      zorgvuldig in een afgesloten, tegen brand beschermde ruimte. Slechts indien de uitoefening van de dienst dit
      noodzakelijk maakt, mogen registers, dubbelen of afschriften uit die ruimte worden verwijderd.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel6
  - number: '7.1'
    text: |-
      De ambtenaar van de burgerlijke stand sluit aan het eind van ieder jaar de registers af door een gedagtekende en
      ondertekende verklaring, welke onmiddellijk na de laatste akte wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel7
  - number: '7.2'
    text: |-
      Binnen een maand nadat de losse bladen tot een registerdeel zijn samengevoegd, doch uiterlijk na ieder half
      jaar worden de dubbelen of afschriften van de akten overgebracht naar de in [de achtste afdeling][ref1] bedoelde
      centrale bewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0006493#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006493
        hoofdstuk: '1'
        afdeling: Achtste
  - number: '7.3'
    text: |-
      Indien de dubbelen van de akten van de burgerlijke stand overeenkomstig het bepaalde in
      [artikel 6, derde lid][ref1], op een daar bedoelde gegevensdrager zijn opgeslagen, geschiedt de overbrenging naar
      de centrale bewaarplaats in deze vorm.


      [ref1]: https://wetten.overheid.nl/BWBR0006493#Artikel6
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006493
        artikel: '6'
        hoofdstuk: '1'
        afdeling: Tweede
  - number: '8'
    text: |-
      Van de overbrenging maakt de beheerder van de centrale bewaarplaats een verklaring op, die een specificatie van de
      overgebrachte stukken dan wel van de andere gegevensdragers inhoudt. Hij bewaart een door hem ondertekend exemplaar
      van de verklaring.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel8
  - number: '9.1'
    text: |-
      Ten aanzien van de dubbelen of de afschriften die zijn overgebracht naar een rijksarchiefbewaarplaats in de zin van
      de Archiefwet, is de beheerder van die bewaarplaats belast met het bewaren van de onder hem berustende bescheiden,
      dan wel andere gegevensdragers.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel9
  - number: '9.2'
    text: |-
      De dubbelen of de afschriften en de daarop betrekking hebbende latere vermeldingen worden op zodanige wijze
      gearchiveerd, dat het verband tussen de latere vermeldingen en de akten, waarop zij betrekking hebben, kan worden
      gelegd.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel9
  - number: '10'
    text: |-
      Onze Minister van Justitie geeft voorschriften betreffende het voor de akten en de dubbelen of de afschriften te
      gebruiken papier, de voor het opmaken van deze stukken te hanteren middelen alsmede betreffende de voor de dubbelen
      te gebruiken gegevensdrager als bedoeld in [artikel 6, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006493#Artikel6
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006493
        artikel: '6'
        hoofdstuk: '1'
        afdeling: Tweede
  - number: '11'
    text: |-
      De ambtenaar van de burgerlijke stand stelt jaarlijks per registersoort klappers samen van de akten
      die gedurende het afgelopen jaar zijn ingeschreven in de losbladige registers van geboorten, van
      huwelijken, geregistreerde partnerschappen en van overlijden, alsmede van het register, bedoeld in
      [artikel 17, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel17
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '17'
  - number: '12.1'
    text: De ambtenaar van de burgerlijke stand maakt tienjaarlijkse klappers in dubbel op.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel12
  - number: '12.2'
    text: |-
      Hij bewaart deze klappers zorgvuldig in een afgesloten, tegen brand beschermde ruimte. Slechts indien de
      uitoefening van de dienst dit noodzakelijk maakt, mogen de klappers uit die ruimte worden verwijderd.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel12
  - number: '12.3'
    text: |-
      Hij zendt het dubbel van de klapper binnen een jaar na afloop van de in het eerste lid genoemde periode toe aan de
      centrale bewaarplaats.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel12
  - number: '13'
    text: 'In de tienjaarlijkse klappers worden ten minste opgenomen:'
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel13
  - number: 13.a
    text: alfabetisch-lexicografisch geordend de geslachtsnaam van hen op wie de akten betrekking hebben;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel13
  - number: 13.b
    text: |-
      de eerste voornaam en de voorletters van de overige voornamen van [de onder a][ref1] bedoelde personen;


      [ref1]: https://wetten.overheid.nl/BWBR0006493#Artikel13
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006493
        artikel: '13'
        hoofdstuk: '1'
        afdeling: Derde
  - number: 13.c
    text: |-
      achter de namen van de gehuwden, dan wel van degenen die een geregistreerd partnerschap zijn aangegaan, de
      geslachtsnaam van degene met wie het huwelijk is gesloten, dan wel het geregistreerd partnerschap is aangegaan;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel13
  - number: 13.d
    text: |-
      de dagtekening van de akten of, voor zover het de akten van geboorte of overlijden betreft, de dag van de geboorte
      of van het overlijden;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel13
  - number: 13.e
    text: het codenummer van de akte.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel13
  - number: '14'
    text: |-
      Onze Minister kan nadere voorschriften geven omtrent de inrichting van de klappers en de daarbij te hanteren
      middelen.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel14
  - number: '15.1'
    text: |-
      De akten bevatten geen andere gegevens dan die, welke zijn vermeld in [hoofdstuk 2][ref1] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006493#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006493
        hoofdstuk: '2'
  - number: '15.2'
    text: |-
      Niettemin kunnen latere gegevens, bij wege van latere vermelding, aan de akten worden toegevoegd. Ook de latere
      vermeldingen bevatten geen andere gegevens dan die, welke zijn vermeld in [hoofdstuk 2][ref1] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006493#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006493
        hoofdstuk: '2'
  - number: '16.1'
    text: De ambtenaar van de burgerlijke stand neemt de akten doorlopend genummerd in de registers op.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel16
  - number: '16.2'
    text: Hij neemt latere vermeldingen afzonderlijk op.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel16
  - number: '16.3'
    text: |-
      Bevindt een akte waaraan een latere vermelding dient te worden toegevoegd, zich in een ingebonden register, dan kan
      deze latere vermelding aan de kant of de voet van de akte worden opgemaakt dan wel op een afzonderlijk blad, dat in
      een daarvoor bestemd supplement bij het register wordt opgenomen. Dat supplement wordt geacht deel uit te maken van
      het register.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel16
  - number: '16.4'
    text: |-
      In het geval, bedoeld in het derde lid, wordt, indien de latere vermelding op een afzonderlijk blad wordt
      opgemaakt, aan de kant of de voet van de akte een verwijzing naar de latere vermelding opgenomen.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel16
  - number: '17.1'
    text: |-
      De ambtenaar van de burgerlijke stand zorgt ervoor dat de akten duidelijk leesbaar zijn en in de Nederlandse taal
      gesteld, met inachtneming van het bepaalde in [artikel 16, vierde lid, van de Wet gebruik Friese taal][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034047#Artikel16
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0034047
        artikel: '16'
  - number: '17.2'
    text: In staatakten geeft hij vermeldingen die niet van toepassing zijn, aan door een liggend streepje.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel17
  - number: '17.3'
    text: Hij ondertekent iedere akte en iedere latere vermelding.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel17
  - number: '18.1'
    text: In de akten mag, behoudens het navolgende, niets bij verkorting worden uitgedrukt.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel18
  - number: '18.2'
    text: |-
      In de akten en de latere vermeldingen worden data in cijfers aangegeven door achtereenvolgens de dag, de maand en
      het jaar te vermelden. De eerste negen dagen van de maand en de eerste negen maanden van het jaar worden aangegeven
      door de cijfers 01 tot en met 09.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel18
  - number: '18.3'
    text: |-
      De dag van geboorte in een geboorteakte en de dag van overlijden in een overlijdensakte worden tevens in letters
      uitgedrukt. Voor zover latere vermeldingen een verbetering inhouden van een dag van geboorte of overlijden, wordt
      ook deze tevens in letters uitgedrukt.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel18
  - number: '18.4'
    text: |-
      Wanneer in een akte of een latere vermelding het uur wordt uitgedrukt, geschiedt dit naar een dagindeling in
      vierentwintig uren.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel18
  - number: '18.5'
    text: Het geslacht wordt aangegeven door de tekst "F (vrouwelijk)" en "M (mannelijk)".
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel18
  - number: '18.6'
    text: De aanduiding van een plaats omvat in elk geval de vermelding van de gemeente.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel18
  - number: '19'
    text: |-
      Bijvoegingen en doorhalingen bij het opmaken van akten of latere vermeldingen worden duidelijk aan de voet van de
      akte aangegeven en worden goedgekeurd en ondertekend door degenen die de akte of de latere vermelding ondertekenen.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel19
  - number: '20.1'
    text: |-
      Met uitzondering van de akte van geboorte en de akte van overlijden ondertekenen de verschijnende partijen en de
      ambtenaar van de burgerlijke stand achtereenvolgens de akte in elkaars bijzijn.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel20
  - number: '20.2'
    text: |-
      Indien een verschijnende partij verklaart niet te kunnen of te willen tekenen, wordt die verklaring in de akte
      vermeld.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel20
  - number: '20.3'
    text: |-
      Het in het eerste en tweede lid van dit artikel met betrekking tot de verschijnende partijen bepaalde geldt ook met
      betrekking tot de getuigen.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel20
  - number: '21'
    text: |-
      Een ambtenaar van de burgerlijke stand die een akte heeft opgemaakt, waarvan ingevolge wettelijk voorschrift een
      latere vermelding moet worden gemaakt door een ambtenaar van de burgerlijke stand van een andere gemeente, geeft
      aan deze ambtenaar kennis van de door hem opgemaakte akte.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel21
  - number: '22.1'
    text: |-
      Latere vermeldingen worden opgemaakt door de ambtenaar van de burgerlijke stand onder wie de akte berust, waaraan
      de latere vermelding moet worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel22
  - number: '22.2'
    text: |-
      Indien het register is overgebracht naar een gemeentelijke archiefbewaarplaats als bedoeld in de Archiefwet, wordt
      de latere vermelding overeenkomstig een aanwijzing van de ambtenaar van de burgerlijke stand, die het register
      laatstelijk onder zijn berusting had, opgemaakt door de beheerder van die bewaarplaats. Na het opmaken van de
      latere vermelding wordt de daarop betrekking hebbende kennisgeving vernietigd op een door Onze Minister van
      Justitie in overeenstemming met de Minister van Onderwijs, Cultuur en Wetenschappen te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel22
  - number: '22.3'
    text: |-
      Indien het dubbel van een akte is overgebracht naar een rijksarchiefbewaarplaats als bedoeld in de Archiefwet,
      wordt de latere vermelding overeenkomstig een aanwijzing van de ambtenaar van de burgerlijke stand die de akte
      laatstelijk onder zijn berusting had, gearchiveerd door de beheerder van die bewaarplaats.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel22
  - number: '23.1'
    text: |-
      De ambtenaar van de burgerlijke stand geeft buiten Nederland opgemaakte stukken, die ten behoeve van het opmaken
      van een akte van de burgerlijke stand of van een latere vermelding dienen te worden overgelegd, terug nadat hij
      zich daarvan een afschrift heeft doen overleggen.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel23
  - number: '23.2'
    text: |-
      De in het eerste lid bedoelde afschriften en de overige stukken die ten behoeve van het opmaken van een akte van
      de burgerlijke stand of van een latere vermelding in een lopend register zijn overgelegd, worden vernietigd nadat
      achttien maanden zijn verstreken sedert de datum waarop het register waarvan deze stukken de bijlagen zijn, is
      afgesloten.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel23
  - number: '23.3'
    text: |-
      De in het eerste lid bedoelde afschriften en de overige stukken die ten behoeve van het opmaken van een latere
      vermelding in een afgesloten register dienen te worden overgelegd, worden vernietigd nadat achttien maanden zijn
      verstreken sedert de datum waarop deze latere vermelding is opgemaakt.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel23
  - number: '23.4'
    text: |-
      De verklaring als bedoeld in [artikel 44][ref1], respectievelijk
      [artikel 80a, derde lid, van Boek 1 van het Burgerlijk Wetboek][ref2] wordt vernietigd nadat achttien maanden zijn
      verstreken sinds het opmaken van de huwelijksakte respectievelijk de akte van geregistreerd partnerschap.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel80a
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 80a
  - number: '23.5'
    text: |-
      De akte van erkenning en de akte van ontkenning van het vaderschap of moederschap door de moeder uit wie het kind
      is geboren worden vernietigd:
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel23
  - number: 23.5.a
    text: |-
      nadat achttien maanden zijn verstreken sedert de ontvangst van het afschrift, bedoeld in [artikel 20f][ref1],
      tweede lid, van Boek 1 van het Burgerlijk Wetboek, of


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel20f
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 20f
  - number: 23.5.b
    text: |-
      nadat achttien maanden zijn verstreken sinds het opmaken van de akte van erkenning of de akte van ontkenning van
      het vaderschap of moederschap door de moeder uit wie het kind is geboren, zonder dat een akte van geboorte is
      opgemaakt.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel23
  - number: '23.6'
    text: |-
      De akte van naamskeuze wordt vernietigd nadat achttien maanden zijn verstreken sedert de ontvangst van het
      afschrift, bedoeld in [artikel 20f][ref1], eerste lid, van Boek 1 van het Burgerlijk Wetboek.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel20f
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 20f
  - number: '23.7'
    text: |-
      Onze Minister van Justitie stelt in overeenstemming met de Minister van Onderwijs, Cultuur en Wetenschappen nadere
      regels met betrekking tot de wijze waarop de in het tweede tot en met zesde lid bedoelde vernietiging plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel23
  - number: '24.1'
    text: |-
      Het uittreksel, bedoeld in de [artikelen 19a, tweede lid][ref1] en
      [19g, tweede lid, van Boek I van het Burgerlijk Wetboek][ref2] wordt opgemaakt overeenkomstig de bepalingen van de
      op 8 september 1976 te Wenen tot stand gekomen Overeenkomst betreffende de uitgifte van meertalige uittreksels uit
      akten van de burgerlijke stand.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel19g
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 19a
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 19g
  - number: '24.2'
    text: |-
      In het geval bedoeld in [artikel 19j, tweede lid, onder b, van Boek 1 van het Burgerlijk Wetboek][ref1] wordt,
      indien het een overlijden betreft van een militair of van een andere persoon die tot de krijgsmacht behoort op
      een oorlogsvaartuig of in een militair luchtvaartuig, een uittreksel van de akte aan Onze Minister van Defensie
      toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel19j
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 19j
  - number: '25'
    text: |-
      Van akten van huwelijk of van overlijden welke vóór de inwerkingtreding van dit Besluit zijn opgemaakt, kan een
      afschrift worden uitgegeven.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel25
  - number: '26.1'
    text: |-
      Een afschrift van een akte van de burgerlijke stand bevat mede de latere vermeldingen die krachtens wettelijk
      voorschrift aan de akte zijn toegevoegd.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel26
  - number: '26.2'
    text: |-
      Een uittreksel als bedoeld in [artikel 23b, eerste lid, van Boek 1 van het Burgerlijk Wetboek][ref1] bevat de
      gegevens ter zake van de toestand op het tijdstip van afgifte.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel23b
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 23b
  - number: '26.3'
    text: |-
      De in het eerste en tweede lid bedoelde afschriften of uittreksels worden door de bewaarder van het register
      voorzien van de verklaring dat de daarin vermelde gegevens overeenstemmen met, dan wel zijn ontleend aan het
      origineel. Zij worden door hem gedagtekend en ondertekend.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel26
  - number: '27.1'
    text: 'De in verband met de aangifte van de geboorte te verstrekken verklaring van een arts of een verloskundige vermeldt:'
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel27
  - number: 27.1.a
    text: de dag en het tijdstip van de geboorte;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel27
  - number: 27.1.b
    text: de plaats waar de geboorte heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel27
  - number: 27.1.c
    text: het geslacht van het kind;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel27
  - number: 27.1.d
    text: de geslachtsnaam van de moeder uit wie het kind is geboren;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel27
  - number: 27.1.e
    text: de voornamen van de moeder uit wie het kind is geboren;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel27
  - number: 27.1.f
    text: de dag van geboorte van de moeder uit wie het kind is geboren;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel27
  - number: 27.1.g
    text: de woonplaats en het woonadres van de moeder uit wie het kind is geboren;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel27
  - number: 27.1.h
    text: de mededeling van degene die de verklaring opmaakt, dat hij al of niet bij de geboorte betrokken was;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel27
  - number: 27.1.i
    text: |-
      de mededeling van degene die de verklaring opmaakt, dat hij al dan niet overtuigd is van de juistheid van bepaalde
      daarin opgenomen gegevens, dan wel met bepaalde gegevens onbekend is;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel27
  - number: 27.1.j
    text: de datum waarop de verklaring is opgemaakt;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel27
  - number: 27.1.k
    text: de geslachtsnaam en de voorletters van de persoon die de verklaring heeft opgemaakt;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel27
  - number: 27.1.l
    text: de bevoegdheid van de onder k bedoelde persoon;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel27
  - number: 27.1.m
    text: de plaats, het adres en het telefoonnummer van de praktijk van de onder k bedoelde persoon.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel27
  - number: '27.2'
    text: |-
      De verklaring wordt door degene die haar heeft opgemaakt ondertekend. Zij wordt door hem in een daarvoor bestemde
      gesloten enveloppe aan de moeder uit wie het kind is geboren of de aangever afgegeven. Bij de aangifte van
      de geboorte in persoon wordt de verklaring in de gesloten enveloppe aan de ambtenaar van de burgerlijke stand
      overhandigd.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel27
  - number: '27.3'
    text: |-
      Indien de aangifte van de geboorte elektronisch wordt gedaan, verstrekt de arts of de verloskundige de in het
      eerste lid bedoelde gegevens aan de ambtenaar van de burgerlijke stand via een daartoe bestemd formulier.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel27
  - number: '27.4'
    text: |-
      Onze Minister van Justitie geeft nadere voorschriften betreffende de formulieren bestemd voor het opmaken van de in
      het eerste en derde lid bedoelde verklaring alsmede de in het tweede lid bedoelde enveloppen.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel27
  - number: '28.1'
    text: |-
      De verklaring omtrent het verblijfsrecht van de aanstaande echtgenoot of geregistreerde partner als bedoeld in
      [artikel 44, eerste lid, onder i, van Boek 1 van het Burgerlijk Wetboek][ref1], vermeldt voor zover van toepassing,
      de volgende gegevens betreffende de persoon op wie de verklaring betrekking heeft:


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel44
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '44'
  - number: 28.1.1°
    text: zijn nationaliteit;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel28
  - number: 28.1.2°
    text: een omschrijving van zijn identiteitsbewijs, met vermelding van het nummer, de plaats en de datum van afgifte;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel28
  - number: 28.1.3°
    text: een omschrijving van het bewijsstuk van permanent verblijf in het buitenland;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel28
  - number: 28.1.4°
    text: |-
      de volgende gegevens over de kinderen tot wie hij in familierechtelijke betrekking staat: geslachtsnaam, voornamen,
      datum, plaats en land van geboorte, nationaliteit, woon- of verblijfplaats, alsmede de geslachtsnaam en voornamen
      van de andere ouder, die tot de kinderen in familierechtelijke betrekking staat;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel28
  - number: 28.1.5°
    text: |-
      de volgende gegevens over zijn eerdere echtgenoot of echtgenoten of eerdere geregistreerde partner of
      geregistreerde partners, zijn echtgenoot of geregistreerde partner: geslachtsnaam, voornamen, datum, plaats en land
      van geboorte, nationaliteit, plaats, land en datum van de voltrekking van het huwelijk of van de huwelijken of van
      registratie van het partnerschap of van de partnerschappen, plaats, land, datum en grond van de ontbinding van het
      eerdere huwelijk of van de eerdere huwelijken en van de beëindiging van het eerdere partnerschap of van de eerdere
      partnerschappen;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel28
  - number: 28.1.6°
    text: de gegevens over de duur van zijn verblijf in Nederland;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel28
  - number: 28.1.7°
    text: andere relevante gegevens;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel28
  - number: 28.1.8°
    text: |-
      de ondertekende verklaring dat de gegevens onder 1° tot en met 7° naar waarheid zijn verstrekt, met vermelding van
      plaats en datum;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel28
  - number: '28.2'
    text: |-
      De ambtenaar van de burgerlijke stand bewaart de in het eerste lid bedoelde verklaring gedurende twaalf jaar ten
      behoeve van verificatie door de Immigratie- en Naturalisatiedienst.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel28
  - number: '29'
    text: |-
      Indien een verklaring is afgelegd overeenkomstig [artikel 55, onder b, van Boek 1 van het Burgerlijk Wetboek][ref1],
      maakt de ambtenaar van de burgerlijke stand waar het huwelijk zou worden voltrokken, dan wel het geregistreerd
      partnerschap zou worden aangegaan hiervan een akte op, welke door hem en degene die de verklaring heeft afgelegd
      wordt ondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel55
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '55'
  - number: '30.1'
    text: |-
      Er is een centrale bewaarplaats voor de dubbelen of de afschriften van de akten van geboorten, van huwelijken
      en echtscheidingen, van geregistreerde partnerschappen en beëindigingen van geregistreerde partnerschappen
      door ontbinding of met wederzijds goedvinden van omzettingen van huwelijken, van omzettingen van geregistreerde
      partnerschappen en van overlijden en voor de latere vermeldingen en de dubbelen van de tienjaarlijkse klappers.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel30
  - number: '30.2'
    text: |-
      Onze Minister van Justitie draagt zorg voor de bewaring van de zich in de centrale bewaarplaats bevindende
      bescheiden en andere gegevensdragers.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel30
  - number: '30.3'
    text: |-
      De in de centrale bewaarplaats berustende bescheiden en andere gegevensdragers zijn, voor zover niet anders
      bepaald, niet openbaar.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel30
  - number: '31'
    text: |-
      De ambtenaar van de burgerlijke stand zendt maandelijks de tekst van de door hem of op zijn aanwijzing opgemaakte
      latere vermeldingen, die betrekking hebben op onder hem berustende of berust hebbende akten, waarvan het dubbel
      of het afschrift in de centrale bewaarplaats berust, naar de centrale bewaarplaats. De toezending geschiedt met
      bericht van ontvangst, in enkelvoud, op formulieren dan wel op andere gegevensdragers, ingericht overeenkomstig het
      door de Minister van Justitie vast te stellen model.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel31
  - number: '32.1'
    text: |-
      De naar de centrale bewaarplaats overgebrachte dubbelen of afschriften, alsmede de latere vermeldingen en de
      dubbelen van de tienjaarlijkse klappers worden op een door de Minister van Justitie te bepalen wijze zorgvuldig
      bewaard in een afgesloten, tegen brand en andere gevaren beschermde ruimte. Slechts indien de uitoefening van de
      dienst dit noodzakelijk maakt, mogen deze bescheiden en de andere gegevensdragers uit die ruimte worden verwijderd.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel32
  - number: '32.2'
    text: |-
      De dubbelen of de afschriften en de daarop betrekking hebbende latere vermeldingen worden op zodanige wijze
      gearchiveerd, dat het verband tussen de latere meldingen en de akten, waarop zij betrekking hebben, kan worden
      gelegd.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel32
  - number: '33'
    text: |-
      Indien een beschikking als bedoeld in [afdeling 9](onbekend) of [afdeling 12](onbekend) van Titel 4 van Boek 1
      van het Burgerlijk Wetboek betrekking heeft op een akte die in een door een consulaire ambtenaar gehouden register
      is of had moeten zijn opgenomen, zendt de griffier van het college waarvoor de zaak laatstelijk aanhangig was,
      een afschrift van de beschikking zodra deze in kracht van gewijsde is gegaan, aan de consulaire ambtenaar die het
      register houdt.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel33
  - number: '34'
    text: |-
      Een ambtenaar van de burgerlijke stand die een akte heeft opgemaakt, waarvan ingevolge wettelijk voorschrift een
      latere vermelding moet worden geplaatst op een akte die in een door een consulaire ambtenaar gehouden register is
      opgenomen, geeft kennis van de door hem opgemaakte akte aan die consulaire ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel34
  - number: '35'
    text: |-
      Verzending aan of door consulaire ambtenaren van stukken die betrekking hebben op registers van de burgerlijke
      stand, geschiedt door tussenkomst van Onze Minister van Buitenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel35
  - number: '36'
    text: |-
      De akten van geboorte, van huwelijk, van registratie van een partnerschap, van omzetting van een registratie
      van een partnerschap en van overlijden bestaan uit vijf gedeelten die door horizontale lijnen van elkaar zijn
      gescheiden. In het eerste gedeelte worden opgenomen de gegevens die in een uittreksel uit de akte moeten worden
      opgenomen. In het tweede gedeelte worden opgenomen de gegevens die wegens hun vertrouwelijk karakter niet in een
      uittreksel worden opgenomen. In het derde gedeelte worden de overige gegevens opgenomen. In het vierde gedeelte
      worden de ambtelijke gegevens en de handtekeningen opgenomen. In het vijfde gedeelte worden de door de ambtenaar
      van de burgerlijke stand aan te brengen verbeteringen, bijvoegingen of doorhalingen opgenomen. Tevens worden daarin
      opgenomen de latere vermeldingen, dan wel verwijzingen naar de op een afzonderlijk blad aan de akte toegevoegde
      latere vermeldingen.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel36
  - number: '37'
    text: |-
      Akten van inschrijving van in het buitenland opgemaakte akten van geboorte, van huwelijk, van registratie van
      een partnerschap en van overlijden, van rechterlijke uitspraken omtrent de rechtsgeldigheid van zodanige akten in
      Nederland dan wel van rechterlijke uitspraken als bedoeld in de [artikelen 21][ref1] en [25][ref2] van Boek 1 van
      het Burgerlijk Wetboek, worden op de in [artikel 36][ref3] aangegeven wijze ingedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0006493#Artikel36
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '25'
      - id: ref3
        bwb_id: BWBR0006493
        artikel: '36'
        hoofdstuk: '2'
        afdeling: Eerste
  - number: '38'
    text: |-
      In het hoofd van elke akte worden het woord "Nederland", gevolgd door de letters (NL), de aktesoort en het jaar
      waarin de akte is opgemaakt, vermeld. In het hoofd van een akte van geboorte, van huwelijk, van registratie van
      een partnerschap, van omzetting van een registratie van een partnerschap, van erkenning, van ontkenning van het
      vaderschap of moederschap door de moeder uit wie het kind is geboren, van naamskeuze en van overlijden wordt tevens
      een nummer vermeld, overeenkomstig door de Minister van Justitie te geven voorschriften.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel38
  - number: '39.1'
    text: |-
      In het hoofd van elke akte van inschrijving van een buitenlandse akte worden vermeld de woorden "akte van
      inschrijving", gevolgd door de soort en het nummer van de ingeschreven akte, de instantie die haar heeft opgemaakt,
      alsmede het land, de plaats en de dag waar zulks is geschied.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel39
  - number: '39.2'
    text: |-
      In het hoofd van elke akte van inschrijving van een rechterlijke uitspraak worden vermeld de woorden "akte van
      inschrijving van rechterlijke uitspraak" gevolgd door datgene waartoe de uitspraak strekt, het rechterlijk college
      dat de uitspraak heeft gedaan alsmede de dag van de uitspraak. Betreft het een buitenlandse rechterlijke uitspraak,
      dan wordt tevens vermeld het land waar deze is gedaan, gevolgd door de voor de inschrijving van motorvoertuigen in
      dat land gebruikelijke letters.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel39
  - number: '39.3'
    text: |-
      In het hoofd van elke akte van inschrijving wordt tevens vermeld het jaar waarin deze is opgemaakt, alsmede een
      nummer overeenkomstig door de Minister van Justitie te geven voorschriften.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel39
  - number: '39.4'
    text: |-
      In het derde gedeelte van elke akte van inschrijving wordt vermeld op wiens verzoek de inschrijving is geschied,
      dan wel of de inschrijving ambtshalve is geschied. Betreft het een akte van inschrijving van een rechterlijke
      beschikking op grond van [artikel 25c][ref1], [artikel 417][ref2] of [artikel 426][ref3] van Boek 1 van het
      Burgerlijk Wetboek, dan wordt in dit gedeelte tevens vermeld dat de akte in overeenstemming is met de beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel25c
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel417
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel426
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 25c
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '417'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '426'
  - number: '39.5'
    text: |-
      In het vijfde gedeelte van elke akte van inschrijving worden vermeld de in het in te schrijven stuk ontbrekende
      gegevens, voor zover de ambtenaar van de burgerlijke stand deze kan ontlenen aan een hier te lande in de registers
      van de burgerlijke stand opgenomen akte, alsmede de door de ambtenaar van de burgerlijke stand aan te brengen
      verbeteringen, doorhalingen en bijvoegingen. Tevens worden daarin opgenomen de latere vermeldingen, dan wel
      verwijzingen naar de op een afzonderlijk blad aan de akte toegevoegde latere vermeldingen.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel39
  - number: '40.1'
    text: 'In het vierde gedeelte van elke akte, dan wel, indien deze niet is ingedeeld, aan de voet ervan worden vermeld:'
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel40
  - number: 40.1.a
    text: de naam en de voorletters van de ambtenaar van de burgerlijke stand die de akte heeft opgemaakt;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel40
  - number: 40.1.b
    text: de plaats en de dag waarop de akte is opgemaakt;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel40
  - number: 40.1.c
    text: |-
      de handtekeningen van de ambtenaar van de burgerlijke stand en, voor zover van toepassing, van de partijen bij de
      akte, alsmede van de getuigen, dan wel de verklaring, bedoeld in [artikel 20, tweede lid][ref1], van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006493#Artikel20
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0006493
        artikel: '20'
        hoofdstuk: '1'
        afdeling: Vierde
  - number: '40.2'
    text: |-
      In het vierde gedeelte van elke akte van inschrijving worden de in het eerste lid, onder a en b genoemde gegevens
      vermeld, alsmede de handtekening van de ambtenaar van de burgerlijke stand.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel40
  - number: '41.1'
    text: |-
      Wordt de latere vermelding op een los blad opgemaakt, dan worden in het hoofd ervan vermeld de letters "ref."
      gevolgd door het nummer van de akte waaraan de latere vermelding wordt toegevoegd, alsmede het jaar waarin die akte
      is opgemaakt.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel41
  - number: '41.2'
    text: |-
      Wordt een latere vermelding ontleend aan een akte, dan worden daarin tevens vermeld de aktesoort, het nummer van
      deze akte, de instantie die haar heeft opgemaakt alsmede de plaats en de datum waar zulks is geschied. Betreft het
      een buitenlandse akte, dan wordt voorts vermeld het land waar deze is opgemaakt.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel41
  - number: '41.3'
    text: |-
      Wordt een latere vermelding ontleend aan een rechterlijke uitspraak, dan worden vermeld het rechterlijk college dat
      de uitspraak heeft gedaan en de datum van de uitspraak, alsmede datgene waartoe de uitspraak strekt. Betreft het
      een buitenlandse rechterlijke uitspraak, dan wordt tevens vermeld het land waar deze is gedaan.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel41
  - number: '41.4'
    text: 'Aan de voet van de latere vermelding worden vermeld:'
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel41
  - number: 41.4.a
    text: de naam en de voorletters van de ambtenaar van de burgerlijke stand die deze latere vermelding heeft opgemaakt;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel41
  - number: 41.4.b
    text: de plaats en de dag waarop de latere vermelding is opgemaakt;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel41
  - number: 41.4.c
    text: de handtekening van de ambtenaar van de burgerlijke stand.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel41
  - number: '42.1'
    text: |-
      In het hoofd van elk uittreksel worden het woord "Nederland" gevolgd door de letters (NL) alsmede het woord
      "uittreksel" vermeld, gevolgd door de soort en het nummer van de akte waarop het uittreksel betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel42
  - number: '42.2'
    text: |-
      Aan de voet van elk afschrift of uittreksel worden de in [artikel 26, derde lid][ref1], genoemde gegevens
      opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006493#Artikel26
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006493
        artikel: '26'
        hoofdstuk: '1'
        afdeling: Vijfde
  - number: '43.1'
    text: 'De akte van geboorte vermeldt in het eerste gedeelte achtereenvolgens:'
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel43
  - number: 43.1.a
    text: de geslachtsnaam dan wel voorlopige geslachtsnaam van het kind;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel43
  - number: 43.1.b
    text: de voornamen dan wel voorlopige voornamen van het kind;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel43
  - number: 43.1.c
    text: de dag en, voor zover bekend, het uur en de minuut van de geboorte;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel43
  - number: 43.1.d
    text: de plaats van geboorte;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel43
  - number: 43.1.e
    text: het geslacht van het kind;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel43
  - number: '43.2'
    text: 'De akte vermeldt in het tweede gedeelte achtereenvolgens:'
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel43
  - number: 43.2.a
    text: de geslachtsnaam en de voornamen van de vader of de moeder uit wie het kind niet is geboren;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel43
  - number: 43.2.b
    text: de geslachtsnaam en de voornamen van de moeder uit wie het kind is geboren;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel43
  - number: '43.3'
    text: 'De akte vermeldt in het derde gedeelte achtereenvolgens:'
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel43
  - number: 43.3.a
    text: indien toepasselijk, dat de geslachtsnaam gekozen is;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel43
  - number: 43.3.b
    text: |-
      voor zover bekend, de plaats en de dag van de geboorte van de vader of de moeder uit wie het kind niet is geboren
      en van de moeder uit wie het kind is geboren;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel43
  - number: 43.3.c
    text: de geslachtsnaam en de voornamen alsmede de plaats en de dag van geboorte van de aangever;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel43
  - number: 43.3.d
    text: indien toepasselijk, dat de voornamen ambtshalve door de ambtenaar van de burgerlijke stand zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel43
  - number: '44.1'
    text: |-
      Is de plaats van de geboorte van het kind niet bekend, dan vermeldt de akte in het eerste gedeelte zo nauwkeurig
      mogelijk de plaats waar het is aangetroffen.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel44
  - number: '44.2'
    text: |-
      Is de dag van de geboorte van het kind niet bekend, dan vermeldt de akte in het eerste gedeelte de vermoedelijke
      dag van geboorte.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel44
  - number: '44.3'
    text: |-
      Indien de plaats of de dag van de geboorte van het kind of de naam, met inbegrip van de voornamen, van de moeder
      uit wie het kind is geboren niet bekend is, vermeldt de geboorteakte in het derde gedeelte het bevel van het
      openbaar ministerie krachtens hetwelk de akte is opgemaakt, alsmede dat bij dit opmaken de aanwijzingen van het
      openbaar ministerie zijn in acht genomen.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel44
  - number: '45.1'
    text: |-
      De in [artikel 19d][ref1], eerste lid, van Boek 1 van het Burgerlijk Wetboek bedoelde akte van geboorte vermeldt in
      het eerste gedeelte dat het geslacht van het kind niet is kunnen worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel19d
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 19d
  - number: '45.2'
    text: |-
      Het bepaalde in het eerste lid is van overeenkomstige toepassing in het geval, bedoeld in [artikel 19d][ref1],
      derde lid, van Boek 1 van het Burgerlijk Wetboek.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel19d
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 19d
  - number: '46'
    text: |-
      De akte van inschrijving van een buiten Nederland opgemaakte akte van geboorte of van de rechterlijke beschikking,
      bedoeld in [artikel 25f][ref1] van Boek 1 van het Burgerlijk Wetboek, vermeldt, voor zover deze aan het in te
      schrijven stuk kunnen worden ontleend, de in [artikel 43][ref2] genoemde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel25f
      [ref2]: https://wetten.overheid.nl/BWBR0006493#Artikel43
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 25f
      - id: ref2
        bwb_id: BWBR0006493
        artikel: '43'
        hoofdstuk: '2'
        afdeling: Derde
  - number: '47'
    text: |-
      De voorlopige akte van geboorte, bedoeld in de [artikelen 19][ref1]*a*, tweede lid, van Boek 1 van het Burgerlijk
      Wetboek vermeldt de in [artikel 43][ref2] genoemde gegevens voor zover deze bekend zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0006493#Artikel43
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0006493
        artikel: '43'
        hoofdstuk: '2'
        afdeling: Derde
  - number: '48'
    text: |-
      Het uittreksel van de akte van geboorte vermeldt de in [artikel 43, eerste lid][ref1], onderscheidenlijk
      [artikel 44, eerste en tweede lid][ref2], genoemde gegevens, met inachtneming van de gegevens blijkend uit latere
      vermeldingen dan wel uit een bijvoeging als bedoeld in [artikel 66, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006493#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0006493#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0006493#Artikel66
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0006493
        artikel: '43'
        hoofdstuk: '2'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0006493
        artikel: '44'
        hoofdstuk: '2'
        afdeling: Derde
      - id: ref3
        bwb_id: BWBR0006493
        artikel: '66'
        hoofdstuk: '2'
        afdeling: Tiende
  - number: '49.1'
    text: 'De door een ambtenaar van de burgerlijke stand opgemaakte akte van erkenning vermeldt:'
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel49
  - number: 49.1.a
    text: |-
      de geslachtsnaam, de voornamen, het geslacht, alsmede, voor zover deze bekend zijn, de plaats en de dag van
      geboorte van het kind;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel49
  - number: 49.1.b
    text: |-
      voor zover bekend, de geslachtsnaam, de voornamen en de plaats en de dag van geboorte van de moeder uit wie het
      kind is geboren;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel49
  - number: 49.1.c
    text: de geslachtsnaam, de voornamen en de plaats en de dag van geboorte van de erkenner;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel49
  - number: 49.1.d
    text: indien vereist, de toestemming van de moeder uit wie het kind is geboren en van het kind;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel49
  - number: 49.1.e
    text: |-
      de geslachtsnaam van het kind na de erkenning, indien van toepassing met vermelding dat de geslachtsnaam gekozen
      is;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel49
  - number: 49.1.f
    text: |-
      het recht dat ingevolge [artikel 95, eerste of tweede lid, van Boek 10 van het Burgerlijk Wetboek][ref1] op de
      erkenning is toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0030068#Artikel95
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0030068
        artikel: '95'
  - number: '49.2'
    text: 'De akte van ontkenning van het vaderschap of moederschap door de moeder uit wie het kind is geboren vermeldt:'
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel49
  - number: 49.2.a
    text: de geslachtsnaam, de voornamen, het geslacht, alsmede de plaats en de dag van geboorte van het kind;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel49
  - number: 49.2.b
    text: de geslachtsnaam, de voornamen en de plaats en de dag van geboorte van de moeder uit wie het kind is geboren;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel49
  - number: 49.2.c
    text: |-
      indien van toepassing, de dag waarop het huwelijk of geregistreerd partnerschap van de moeder uit wie het kind is
      geboren door de dood van haar echtgenoot of geregistreerde partner is ontbonden alsmede de geslachtsnamen en de
      voornamen van haar vroegere echtgenoot of geregistreerde partner;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel49
  - number: 49.2.d
    text: |-
      indien van toepassing, de geslachtsnaam en de voornamen van de nog levende echtgenoot of geregistreerde partner
      of ex-echtgenoot of ex-geregistreerde partner van de moeder uit wie het kind is geboren en diens toestemming tot
      de ontkenning;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel49
  - number: 49.2.e
    text: |-
      indien het kind van rechtswege in familierechtelijke betrekking is komen te staan tot de persoon met wie de moeder
      uit wie het kind is geboren is hertrouwd of opnieuw een geregistreerd partnerschap is aangegaan, de geslachtsnaam,
      de voornamen en de plaats en de dag van geboorte van de huidige echtgenoot of geregistreerde partner van de moeder.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel49
  - number: 49.2.f
    text: |-
      de geslachtsnaam van het kind na ontkenning van het vaderschap of moederschap door de moeder uit wie het kind is
      geboren, indien van toepassing met vermelding dat de geslachtsnaam gekozen is.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel49
  - number: '49.3'
    text: De latere vermelding van de erkenning vermeldt de in het eerste lid, onder c, d, e en f genoemde gegevens.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel49
  - number: '49.4'
    text: |-
      De latere vermelding van de ontkenning van het vaderschap of moederschap door de moeder uit wie het kind is geboren
      vermeldt de in het tweede lid, onder d, e en f, genoemde gegevens.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel49
  - number: '50.1'
    text: 'Wanneer de akte van erkenning het kind of de kinderen waarvan een vrouw zwanger is, betreft, vermeldt deze akte:'
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel50
  - number: 50.1.a
    text: de geslachtsnaam, de voornamen en de plaats en de dag van geboorte van de vrouw en van de erkenner;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel50
  - number: 50.1.b
    text: haar toestemming;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel50
  - number: 50.1.c
    text: de geslachtsnaam van het kind, indien van toepassing, met vermelding dat de geslachtsnaam is gekozen;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel50
  - number: 50.1.d
    text: |-
      het recht dat ingevolge [artikel 95, eerste of tweede lid, van Boek 10 van het Burgerlijk Wetboek][ref1] op de
      erkenning is toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0030068#Artikel95
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0030068
        artikel: '95'
  - number: '50.2'
    text: |-
      De erkenning als in het eerste lid bedoeld wordt bij wege van latere vermelding aan de geboorteakte toegevoegd,
      onder vermelding van de gegevens omtrent de erkenner in de geboorteakte. De latere vermelding vermeldt de in
      [artikel 49, derde lid][ref1], genoemde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0006493#Artikel49
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0006493
        artikel: '49'
        hoofdstuk: '2'
        afdeling: Vierde
  - number: '50.3'
    text: |-
      Het tweede lid is van overeenkomstige toepassing indien de erkenning dan wel ontkenning van het vaderschap of
      moederschap door de moeder uit wie het kind is geboren bij de aangifte van de geboorte van het kind plaatsvindt,
      met dien verstande dat de latere vermelding van de ontkenning van het vaderschap of moederschap door de moeder uit
      wie het kind is geboren de in [artikel 49, vierde lid][ref1], genoemde gegevens vermeldt.


      [ref1]: https://wetten.overheid.nl/BWBR0006493#Artikel49
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0006493
        artikel: '49'
        hoofdstuk: '2'
        afdeling: Vierde
  - number: '51'
    text: |-
      De latere vermelding van een notariële akte van erkenning vermeldt de in [artikel 49, derde lid][ref1], genoemde
      gegevens aan de hand van die notariële akte, met dien verstande dat de ambtenaar van de burgerlijke stand gegevens
      die ontbreken zoveel mogelijk aanvult.


      [ref1]: https://wetten.overheid.nl/BWBR0006493#Artikel49
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0006493
        artikel: '49'
        hoofdstuk: '2'
        afdeling: Vierde
  - number: '52'
    text: |-
      De latere vermelding van een buiten Nederland opgemaakte akte van erkenning, dan wel van een buiten Nederland
      gedane rechterlijke uitspraak houdende gegrondverklaring van de ontkenning van het door het huwelijk of
      geregistreerd partnerschap ontstane vaderschap of moederschap of vernietiging van de erkenning, vermeldt, voor
      zover deze aan het in te schrijven stuk kunnen worden ontleend, de in de [artikelen 49, derde lid][ref1], of
      [51][ref2] genoemde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0006493#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0006493#Artikel51
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0006493
        artikel: '49'
        hoofdstuk: '2'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0006493
        artikel: '51'
        hoofdstuk: '2'
        afdeling: Vierde
  - number: 52a.1
    text: |-
      De akte van naamskeuze die wordt opgemaakt op grond van een verklaring van de ouders
      van het kind, van één ouder, dan wel van een ouder en een niet-ouder die op grond van
      [artikel 253sa, eerste lid, van Boek 1 van het Burgerlijk Wetboek][ref1] gezamenlijk het gezag over het kind
      uitoefenen, vermeldt:


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253sa
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253sa
  - number: 52a.1.a
    text: de geslachtsnaam, de voornamen, de plaats en de dag van geboorte van de ouders dan wel;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel52a
  - number: 52a.1.b
    text: |-
      in het geval van gezamenlijke gezagsuitoefening door een ouder en een niet-ouder, de geslachtsnaam, de voornamen,
      de plaats en de dag van geboorte van de ouder en van de niet-ouder;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel52a
  - number: 52a.1.c
    text: de gekozen geslachtsnaam van het kind.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel52a
  - number: 52a.2
    text: De latere vermelding van de akte van naamskeuze vermeldt de gekozen geslachtsnaam van het kind.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel52a
  - number: 52b.1
    text: 'De akte van naamskeuze die op grond van een verklaring van het kind wordt opgemaakt, vermeldt:'
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel52b
  - number: 52b.1.a
    text: de geslachtsnaam, de voornamen, de plaats en de dag van geboorte van de ouders;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel52b
  - number: 52b.1.b
    text: |-
      de geslachtsnaam van het kind vóór het doen van naamskeuze, de voornamen, de plaats en de dag van geboorte van
      het kind;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel52b
  - number: 52b.1.c
    text: de door het kind gekozen geslachtsnaam.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel52b
  - number: 52b.2
    text: De latere vermelding van de akte van naamskeuze vermeldt de door het kind gekozen geslachtsnaam.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel52b
  - number: '53'
    text: 'De latere vermelding van een rechterlijke uitspraak waarbij adoptie wordt uitgesproken dan wel herroepen, vermeldt:'
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel53
  - number: 53.a
    text: de geslachtsnaam, de voornamen en de dag en plaats van geboorte van de adoptiefouders of van de adoptiefouder;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel53
  - number: 53.b
    text: |-
      de geslachtsnaam van het kind na de adoptie, met vermelding, indien van toepassing, dat de geslachtsnaam gekozen
      is, onderscheidenlijk de geslachtsnaam van het kind na herroeping van de adoptie;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel53
  - number: 53.c
    text: indien van toepassing, de bij de uitspraak vastgestelde voornamen van het kind;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel53
  - number: 53.d
    text: |-
      de dag waarop de uitspraak kracht van gewijsde heeft gekregen, als vermeld in een daartoe door de griffier af te
      geven getuigschrift.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel53
  - number: 53.e
    text: |-
      indien van toepassing, dat de familierechtelijke betrekking met de andere met het gezag beklede ouder in stand
      blijft.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel53
  - number: '54'
    text: |-
      De latere vermelding van een buiten Nederland gedane rechterlijke uitspraak, waarbij adoptie wordt uitgesproken
      dan wel herroepen, vermeldt, voor zover deze aan het in te schrijven stuk kunnen worden ontleend, de in
      [artikel 53][ref1] genoemde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0006493#Artikel53
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0006493
        artikel: '53'
        hoofdstuk: '2'
        afdeling: Vijfde
  - number: '57.1'
    text: 'De huwelijksakte vermeldt in het eerste gedeelte achtereenvolgens:'
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel57
  - number: 57.1.a
    text: |-
      de geslachtsnaam van de echtgenoten vóór het sluiten van het huwelijk, alsmede hun voornamen, onder aanduiding van
      hun geslacht;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel57
  - number: 57.1.b
    text: de plaats en de dag van geboorte van de echtgenoten;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel57
  - number: 57.1.c
    text: de geslachtsnaam van de echtgenoten na het sluiten van het huwelijk;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel57
  - number: 57.1.d
    text: de dag van het huwelijk en de plaats waar het is voltrokken.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel57
  - number: '57.2'
    text: De akte vermeldt in het tweede gedeelte de geslachtsnaam en de voornamen van de ouders van de echtgenoten.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel57
  - number: '57.3'
    text: 'De akte vermeldt in het derde gedeelte:'
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel57
  - number: 57.3.a
    text: de geslachtsnamen en de voornamen van de getuigen;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel57
  - number: 57.3.b
    text: de bij de huwelijksakte gegeven toestemming;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel57
  - number: 57.3.c
    text: voor zover toepasselijk, de nationaliteit die een niet Nederlandse echtgenoot vermoedelijk heeft.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel57
  - number: '57.4'
    text: |-
      De ambtenaar van de burgerlijke stand, bedoeld in [artikel 40, eerste lid, onder a][ref1], van dit besluit is de
      ambtenaar ten overstaan van wie de verklaring bedoeld in artikel 67, eerste lid, van Boek 1 van het Burgerlijk
      Wetboek is afgelegd, en die heeft verklaard dat partijen door de echt aan elkander zijn verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0006493#Artikel40
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0006493
        artikel: '40'
        hoofdstuk: '2'
        afdeling: Tweede
  - number: 57a.1
    text: 'De akte van registratie van een partnerschap vermeldt in het eerste gedeelte achtereenvolgens:'
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel57a
  - number: 57a.1.a
    text: |-
      de geslachtsnaam van de geregistreerde partners vóór het aangaan van het geregistreerde partnerschap, alsmede hun
      voornamen, onder aanduiding van hun geslacht;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel57a
  - number: 57a.1.b
    text: de plaats en de dag van geboorte van de geregistreerde partners;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel57a
  - number: 57a.1.c
    text: de geslachtsnaam van de geregistreerde partners na het aangaan van het geregistreerd partnerschap;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel57a
  - number: 57a.1.d
    text: de dag van het aangaan van het geregistreerd partnerschap en de plaats waar het is aangegaan.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel57a
  - number: 57a.2
    text: |-
      De akte vermeldt in het tweede gedeelte de geslachtsnaam en de voornamen van de ouders van de geregistreerde
      partners.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel57a
  - number: 57a.3
    text: 'De akte vermeldt in het derde gedeelte:'
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel57a
  - number: 57a.3.a
    text: de geslachtsnaam en de voornamen van de getuigen;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel57a
  - number: 57a.3.b
    text: de bij de akte van registratie van een partnerschap gegeven toestemming;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel57a
  - number: 57a.3.c
    text: voor zover toepasselijk, de nationaliteit die een niet Nederlandse geregistreerde partner vermoedelijk heeft.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel57a
  - number: 57a.4
    text: |-
      De ambtenaar van de burgerlijke stand, bedoeld in [artikel 40, eerste lid, onder a][ref1],
      van dit besluit is de ambtenaar ten overstaan van wie de registratie bedoeld in
      [artikel 80a, derde lid, van Boek 1 van het Burgerlijk Wetboek][ref2] is aangegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006493#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel80a
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel57a
    references:
      - id: ref1
        bwb_id: BWBR0006493
        artikel: '40'
        hoofdstuk: '2'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 80a
  - number: 57c.1
    text: |-
      De akte van omzetting van een registratie van een partnerschap in een huwelijk vermeldt in het eerste gedeelte
      achtereenvolgens:
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel57c
  - number: 57c.1.a
    text: |-
      de geslachtsnamen van de echtgenoten voor de omzetting van de registratie van een partnerschap in een huwelijk,
      alsmede hun voornamen, onder aanduiding van hun geslacht;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel57c
  - number: 57c.1.b
    text: de plaats en dag van geboorte van de echtgenoten;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel57c
  - number: 57c.1.c
    text: de geslachtsnamen van de echtgenoten na de omzetting van de registratie van het partnerschap in een huwelijk;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel57c
  - number: 57c.1.d
    text: |-
      de dag van de omzetting van de registratie van het partnerschap in een huwelijk en de plaats waar de omzetting
      heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel57c
  - number: 57c.2
    text: De akte vermeldt in het tweede gedeelte de geslachtsnamen en de voornamen van de ouders van de echtgenoten.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel57c
  - number: 57c.3
    text: |-
      De akte vermeldt in het derde gedeelte, voorzover toepasselijk, de nationaliteit die een niet Nederlandse
      echtgenoot ten tijde van de omzetting van de registratie van een partnerschap in het huwelijk vermoedelijk heeft.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel57c
  - number: 57c.4
    text: |-
      De ambtenaar van de burgerlijke stand, bedoeld in [artikel 40, eerste lid, onder a][ref1], van dit besluit is de
      ambtenaar bedoeld in [artikel 80f, eerste lid, van Boek 1 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006493#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel80f
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel57c
    references:
      - id: ref1
        bwb_id: BWBR0006493
        artikel: '40'
        hoofdstuk: '2'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 80f
  - number: '58.1'
    text: |-
      De akte van inschrijving van een buiten Nederland opgemaakte huwelijksakte vermeldt, voor zover deze aan het in te
      schrijven stuk kunnen worden ontleend, de in [artikel 57][ref1] genoemde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0006493#Artikel57
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0006493
        artikel: '57'
        hoofdstuk: '2'
        afdeling: Achtste
  - number: '58.2'
    text: |-
      De akte van inschrijving van een buiten Nederland opgemaakte akte van registratie van een partnerschap vermeldt,
      voor zover deze aan het in te schrijven stuk kunnen worden ontleend, de in [artikel 57a][ref1] genoemde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0006493#Artikel57a
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0006493
        artikel: 57a
        hoofdstuk: '2'
        afdeling: Achtste
  - number: '59.1'
    text: |-
      Het uittreksel van de huwelijksakte vermeldt de in [artikel 57, eerste lid][ref1], genoemde gegevens. Indien van
      toepassing bevat het uittreksel tevens de gegevens inzake de plaats en datum van de echtscheiding of de ontbinding
      van het huwelijk na scheiding van tafel en bed, dan wel inzake de omzetting van het huwelijk in een registratie van
      een partnerschap.


      [ref1]: https://wetten.overheid.nl/BWBR0006493#Artikel57
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0006493
        artikel: '57'
        hoofdstuk: '2'
        afdeling: Achtste
  - number: '59.2'
    text: |-
      Het uittreksel uit de akte van registratie van een partnerschap vermeldt de in [artikel 57a, eerste lid][ref1],
      genoemde gegevens. Indien van toepassing bevat het uittreksel tevens de gegevens inzake de plaats en datum van
      de beëindiging van het geregistreerd partnerschap met wederzijds goedvinden of van de ontbinding bedoeld in
      [artikel 80c][ref2], onder c en d, van Boek 1 van het Burgerlijk Wetboek, dan wel inzake de omzetting van de
      registratie van een partnerschap in een huwelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0006493#Artikel57a
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel80c
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0006493
        artikel: 57a
        hoofdstuk: '2'
        afdeling: Achtste
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 80c
  - number: '59.3'
    text: |-
      Het uittreksel van de akte van omzetting van de registratie van een partnerschap in een huwelijk vermeldt de in
      [artikel 57c, eerste lid][ref1], vermelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0006493#Artikel57c
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0006493
        artikel: 57c
        hoofdstuk: '2'
        afdeling: Achtste
  - number: '59.4'
    text: |-
      Het uittreksel van de akte van omzetting van een huwelijk in een registratie van een partnerschap vermeldt de in
      [artikel 57c, eerste lid][ref1], vermelde gegevens, met dien verstande dat voor «de echtgenoten» wordt gelezen
      «de geregistreerde partners», voor «de registratie van een partnerschap» wordt gelezen «het huwelijk» en voor «een
      huwelijk» wordt gelezen: een registratie van een partnerschap.


      [ref1]: https://wetten.overheid.nl/BWBR0006493#Artikel57c
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0006493
        artikel: 57c
        hoofdstuk: '2'
        afdeling: Achtste
  - number: '60.1'
    text: |-
      De akte van inschrijving van een rechterlijke uitspraak houdende echtscheiding of ontbinding van een huwelijk na
      scheiding van tafel en bed tussen echtelieden wier huwelijk niet in de Nederlandse registers van de burgerlijke
      stand is ingeschreven, vermeldt:
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel60
  - number: 60.1.a
    text: de geslachtsnaam en de voornamen der echtgenoten, alsmede het land, de plaats en de dag der huwelijksvoltrekking;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel60
  - number: 60.1.b
    text: de geslachtsnaam van elk van de echtgenoten na de uitspraak;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel60
  - number: 60.1.c
    text: op verzoek van welke echtgenoot de inschrijving geschiedt, alsmede de datum waarop dat verzoek is ontvangen.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel60
  - number: '60.2'
    text: |-
      De latere vermelding van een rechterlijke uitspraak houdende echtscheiding of ontbinding van een huwelijk na
      scheiding van tafel en bed, vermeldt de in het eerste lid, onder b en c, genoemde gegevens.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel60
  - number: 60a.1
    text: |-
      De akte van inschrijving van een verklaring tot beëindiging met wederzijds goedvinden van een geregistreerd
      partnerschap en van de rechterlijke uitspraak van een ontbinding van een geregistreerd partnerschap als bedoeld
      in [artikel 80c][ref1], onder c en d, van Boek 1 van het Burgerlijk Wetboek tussen geregistreerde partners wier
      partnerschap niet in de Nederlandse registers van de burgerlijke stand is ingeschreven, vermeldt:


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel80c
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 80c
  - number: 60a.1.a
    text: |-
      de geslachtsnaam en de voornamen van de geregistreerde partners onder aanduiding van hun geslacht, alsmede het
      land, de plaats en de dag waarop het geregistreerd partnerschap is aangegaan;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel60a
  - number: 60a.1.b
    text: |-
      de geslachtsnaam van elk der geregistreerde partners na beëindiging met wederzijds goedvinden van een geregistreerd
      partnerschap dan wel ontbinding daarvan.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel60a
  - number: 60a.2
    text: |-
      De latere vermelding van een verklaring tot beëindiging met wederzijds goedvinden van een geregistreerd
      partnerschap en van een rechterlijke uitspraak van een ontbinding van een geregistreerd partnerschap als bedoeld
      in [artikel 80c][ref1], onder c onderscheidenlijk d, van Boek 1 van het Burgerlijk Wetboek, vermeldt de in het
      eerste lid onder b genoemde gegevens, alsmede in het geval van een rechterlijke uitspraak, op verzoek van welke
      geregistreerde partner de inschrijving geschiedt en op welke datum het verzoek is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel80c
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 80c
  - number: '61.1'
    text: 'De akte van overlijden vermeldt in het eerste gedeelte achtereenvolgens:'
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel61
  - number: 61.1.a
    text: de geslachtsnaam en de voornamen van de overledene;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel61
  - number: 61.1.b
    text: voor zover bekend de plaats en de dag van geboorte van de overledene;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel61
  - number: 61.1.c
    text: het geslacht van de overledene;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel61
  - number: 61.1.d
    text: de woonplaats of de gewone verblijfplaats van de overledene;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel61
  - number: 61.1.e
    text: de dag en, voor zover bekend, het uur en de minuut van overlijden;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel61
  - number: 61.1.f
    text: de plaats van overlijden;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel61
  - number: 61.1.g
    text: |-
      de geslachtsnaam en de voornamen van de persoon met wie de overledene ten tijde van het overlijden gehuwd was dan
      wel met wie hij een geregistreerd partnerschap was aangegaan.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel61
  - number: '61.2'
    text: |-
      De akte vermeldt in het tweede gedeelte de geslachtsnaam en de voornamen van de ouders van de overledene, voor
      zover deze bekend zijn.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel61
  - number: '61.3'
    text: 'De akte vermeldt in het derde gedeelte achtereenvolgens:'
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel61
  - number: 61.3.a
    text: |-
      voor zover bekend, de geslachtsnaam en de voornamen van de persoon of van de personen, met wie de overledene eerder
      gehuwd of als partner geregistreerd was;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel61
  - number: 61.3.b
    text: de geslachtsnaam en de voornamen alsmede de plaats en de dag van geboorte van de aangever.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel61
  - number: '62.1'
    text: |-
      Indien een lijk is gevonden en de plaats of de dag van overlijden niet met voldoende nauwkeurigheid kan worden
      vastgesteld, vermeldt de akte in het eerste gedeelte achtereenvolgens:
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel62
  - number: 62.1.a
    text: de geslachtsnaam en de voornamen van de overledene;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel62
  - number: 62.1.b
    text: voor zover bekend, de plaats en de dag van geboorte van de overledene;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel62
  - number: 62.1.c
    text: het geslacht van de overledene;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel62
  - number: 62.1.d
    text: voor zover bekend, de woonplaats of de gewone verblijfplaats van de overledene;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel62
  - number: 62.1.e
    text: de plaats, de dag en het uur waarop het lijk is gevonden;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel62
  - number: 62.1.f
    text: |-
      voor zover bekend, de geslachtsnaam en de voornamen van de persoon met wie de overledene ten tijde van het
      overlijden gehuwd was dan wel met wie hij een geregistreerd partnerschap was aangegaan.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel62
  - number: '62.2'
    text: |-
      De akte vermeldt in het tweede gedeelte de geslachtsnaam en de voornamen van de ouders van de overledene, voor
      zover deze bekend zijn.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel62
  - number: '62.3'
    text: 'De akte vermeldt in het derde gedeelte:'
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel62
  - number: 62.3.a
    text: |-
      voor zover bekend, de geslachtsnaam en de voornamen van de persoon of van de personen, met wie de overledene eerder
      gehuwd of als partner geregistreerd was;
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel62
  - number: 62.3.b
    text: de schriftelijke aangifte van de hulpofficier van justitie.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel62
  - number: '62.4'
    text: De plaats waar het lijk is gevonden, wordt zo nauwkeurig mogelijk aangeduid.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel62
  - number: '63'
    text: |-
      De akte van inschrijving bedoeld in [artikel 417][ref1], onderscheidenlijk
      [artikel 429 van Boek 1 van het Burgerlijk Wetboek][ref2] vermeldt de gegevens genoemd in [artikel 61][ref3]
      van dit besluit voor zover die uit de beschikking blijken. Als dag van overlijden geldt, in het geval van
      [artikel 417][ref4], de dag waarop de vermiste vermoed wordt te zijn overleden.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel417
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel429
      [ref3]: https://wetten.overheid.nl/BWBR0006493#Artikel61
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel417
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '417'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '429'
      - id: ref3
        bwb_id: BWBR0006493
        artikel: '61'
        hoofdstuk: '2'
        afdeling: Tiende
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '417'
  - number: '64'
    text: |-
      De akte van inschrijving van een buiten Nederland opgemaakte akte van overlijden of akte van lijkvinding vermeldt,
      voor zover deze aan het in te schrijven stuk kunnen worden ontleend, de in [artikel 61][ref1] onderscheidenlijk
      [artikel 62][ref2] genoemde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0006493#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0006493#Artikel62
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0006493
        artikel: '61'
        hoofdstuk: '2'
        afdeling: Tiende
      - id: ref2
        bwb_id: BWBR0006493
        artikel: '62'
        hoofdstuk: '2'
        afdeling: Tiende
  - number: '65'
    text: |-
      De voorlopige akte van overlijden, bedoeld in [artikel 19 g, derde lid, van Boek 1 van het Burgerlijk Wetboek][ref1],
      vermeldt voor zoveel mogelijk de gegevens genoemd in [artikel 61][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0006493#Artikel61
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0006493
        artikel: '61'
        hoofdstuk: '2'
        afdeling: Tiende
  - number: '66.1'
    text: |-
      Op de akte van aangifte van een kind dat levenloos ter wereld is gekomen, zijn [de artikelen 43][ref1], [44][ref2],
      [45][ref3] en [47][ref4] van overeenkomstige toepassing, met dien verstande dat deze akte alleen een geslachtsnaam
      en voornamen van het kind vermeldt voor zover de ouders dit wensen.


      [ref1]: https://wetten.overheid.nl/BWBR0006493#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0006493#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0006493#Artikel45
      [ref4]: https://wetten.overheid.nl/BWBR0006493#Artikel47
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0006493
        artikel: '43'
        hoofdstuk: '2'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0006493
        artikel: '44'
        hoofdstuk: '2'
        afdeling: Derde
      - id: ref3
        bwb_id: BWBR0006493
        artikel: '45'
        hoofdstuk: '2'
        afdeling: Derde
      - id: ref4
        bwb_id: BWBR0006493
        artikel: '47'
        hoofdstuk: '2'
        afdeling: Derde
  - number: '66.2'
    text: |-
      De akte, bedoeld in [artikel 19i, eerste lid, van Boek 1 van het Burgerlijk Wetboek][ref1], draagt als opschrift:
      Akte van geboorte (levenloos). In het vijfde gedeelte van de akte wordt als bijvoeging opgenomen: Akte in de zin
      van artikel 1:19i, eerste lid, Burgerlijk Wetboek.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel19i
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 19i
  - number: '67'
    text: |-
      Het uittreksel van de akte van overlijden vermeldt de in [artikel 61, eerste lid][ref1], onderscheidenlijk
      [artikel 62, eerste lid][ref2], genoemde gegevens, met inachtneming van gegevens blijkend uit latere vermeldingen.
      Indien een akte van inschrijving is opgemaakt ingevolge [artikel 417][ref3], onderscheidenlijk [artikel 426][ref4]
      van Boek 1 van het Burgerlijk Wetboek, wordt dit in het hoofd van het uittreksel vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006493#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0006493#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel417
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel426
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0006493
        artikel: '61'
        hoofdstuk: '2'
        afdeling: Tiende
      - id: ref2
        bwb_id: BWBR0006493
        artikel: '62'
        hoofdstuk: '2'
        afdeling: Tiende
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '417'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '426'
  - number: 67a.1
    text: |-
      Indien de kennisgeving van een huwelijk of geregistreerd partnerschap als bedoeld in [artikel 44][ref1]
      respectievelijk [artikel 80a, derde lid, van Boek 1 van het Burgerlijk Wetboek][ref2] langs elektronische weg
      wordt gedaan, verstrekken de aanstaande echtgenoten respectievelijk aanstaande partners aan de ambtenaar van de
      burgerlijke stand tevens hun burgerservicenummer.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel80a
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel67a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 80a
  - number: 67a.2
    text: |-
      Indien de aangifte van overlijden langs elektronische weg wordt gedaan, verstrekt de persoon die de aangifte doet
      aan de ambtenaar van de burgerlijke stand tevens het burgerservicenummer van de overledene alsmede een verklaring
      van de arts die het overlijden heeft vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel67a
  - number: '68'
    text: |-
      Dit besluit treedt in werking tegelijk met de wet van 14 oktober 1993 tot herziening van Titel 4 van Boek 1
      van het Burgerlijk Wetboek en wijziging van enige andere bepalingen van [Boek 1][ref1] van dat wetboek, het
      [Wetboek van Burgerlijke Rechtsvordering][ref2] en het [Wetboek van Strafvordering][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0001827
      [ref3]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0002656
      - id: ref2
        bwb_id: BWBR0001827
      - id: ref3
        bwb_id: BWBR0001903
  - number: '69'
    text: 'Dit besluit kan worden aangehaald als: Besluit burgerlijke stand 1994.'
    url: https://wetten.overheid.nl/BWBR0006493/2022-01-01#Artikel69
