  - number: '2'
    text: |-
      1 De Wlz-uitvoerders, aangewezen krachtens [artikel 4.2.4, tweede lid, van de Wet langdurige zorg][ref1],
      worden aangewezen als zorgverzekeraar in de zin van de wet voor zover zij het in
      [artikel 4.2.2 van het Besluit langdurige zorg][ref2] aangegeven deel van de administratie verrichten voor de in de
      [Wet langdurige zorg][ref3] aangewezen zorg.

      2 Als zorgaanbieder, respectievelijk zorg in de zin van de wet wordt aangewezen de Stichting Sanquin
      Bloedvoorziening voor zover het betreft haar werkzaamheden met betrekking tot het diagnostisch
      laboratoriumonderzoek voor een zorgaanbieder en het beheer en de exploitatie van het Transfusie Register
      Irregulaire antistoffen en X(kruis)-proeven.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel4.2.4
      [ref2]: https://wetten.overheid.nl/BWBR0035948#Artikel4.2.2
      [ref3]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0023902/2018-07-28#Artikel2
