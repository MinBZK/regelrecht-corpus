  - number: '33'
    text: |-
      Onze Minister benoemt een functionaris voor de gegevensbescherming als bedoeld in artikel 37 van de Algemene
      verordening gegevensbescherming, die toeziet op de verwerking van persoonsgegevens ten behoeve van de registers, de
      SBV-Z en de toegangsmiddelen.
    url: https://wetten.overheid.nl/BWBR0023902/2018-07-28#Artikel33
  - number: '37'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0023902/2018-07-28#Artikel37
  - number: '38'
    text: 'Dit besluit wordt aangehaald als: Besluit gebruik burgerservicenummer in de zorg.'
    url: https://wetten.overheid.nl/BWBR0023902/2018-07-28#Artikel38
