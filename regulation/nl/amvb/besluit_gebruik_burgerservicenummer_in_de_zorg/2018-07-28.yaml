preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport van 16 januari 2007, MEVA/ICT-2740333,
    gedaan in overeenstemming met Onze Minister voor Bestuurlijke Vernieuwing en Koninkrijksrelaties;

    Gelet op de artikelen 2, 11, 15, 17 en 17a van de Wet gebruik burgerservicenummer in de zorg en de artikelen 17 en
    21, vierde lid, van de Wet algemene bepalingen burgerservicenummer;

    De Raad van State gehoord (advies van 21 februari 2007, nr. W13.07.0014/I);

    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport van 20 mei 2008, MEVA/ICT-2846755;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0023902/2018-07-28#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *wet:* [Wet aanvullende bepalingen verwerking persoonsgegevens in de zorg][ref1];

      b. *register van zorgaanbieders:* register van zorgaanbieders als bedoeld in
      [artikel 14, eerste lid, van de wet][ref2];

      c. *register van indicatieorganen:* register van indicatieorganen als bedoeld in
      [artikel 14, eerste lid, van de wet][ref3];

      d. *register van zorgverzekeraars:* register van zorgverzekeraars als bedoeld in
      [artikel 14, eerste lid, van de wet][ref4];

      e. *register:* register van zorgaanbieders, register van indicatieorganen of register van zorgverzekeraars;

      f. *geregistreerde:* in een register opgenomen zorgaanbieder, indicatieorgaan of zorgverzekeraar;

      g. *SBV-Z:* sectorale berichtenvoorziening in de zorg als bedoeld in [artikel 11, eerste lid][ref5];

      h. *beheervoorziening:* beheervoorziening als bedoeld in
      [artikel 3 van de Wet algemene bepalingen burgerservicenummer][ref6];

      i. *systeembeschrijving:* systeembeschrijving als bedoeld in [artikel 12][ref7];

      j. *toegangsmiddel:* certificaat of ander authenticatiemiddel als bedoeld in [artikel 18][ref8] met inbegrip van de
      drager van het toegangsmiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0023864
