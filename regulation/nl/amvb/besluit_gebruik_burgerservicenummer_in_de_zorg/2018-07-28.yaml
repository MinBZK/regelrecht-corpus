  - number: '3'
    text: |-
      Bij ministeriële regeling kan worden bepaald welke gegevens en bescheiden worden verstrekt bij de aanvraag te
      worden opgenomen in een register.
    url: https://wetten.overheid.nl/BWBR0023902/2018-07-28#Artikel3
  - number: '4'
    text: |-
      Onze Minister stelt, voor zover mogelijk aan de hand van wettelijk gestelde vereisten voor de hoedanigheid van
      zorgaanbieder, indicatieorgaan en zorgverzekeraar, vast of de aanvraag, bedoeld in [artikel 3][ref1], is gedaan
      door onderscheidenlijk een zorgaanbieder, een indicatieorgaan of een zorgverzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0023902#Artikel3
    url: https://wetten.overheid.nl/BWBR0023902/2018-07-28#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0023902
        artikel: '3'
        hoofdstuk: II
  - number: '5'
    text: |-
      De aanvraag, bedoeld in [artikel 3][ref1], wordt in ieder geval afgewezen indien deze niet is gedaan door een
      zorgaanbieder, indicatieorgaan of zorgverzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0023902#Artikel3
    url: https://wetten.overheid.nl/BWBR0023902/2018-07-28#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0023902
        artikel: '3'
        hoofdstuk: II
  - number: '6'
    text: |-
      1 In het register van zorgaanbieders wordt per inschrijving opgenomen:

      a. indien de geregistreerde een natuurlijke persoon is:

      1°. geslachtsnaam;

      2°. voornamen;

      3°. geboortedatum;

      4°. geboorteplaats;

      5°. titel in de zin van de [Wet op de beroepen in de individuele gezondheidszorg][ref1];

      b. indien de geregistreerde een rechtspersoon is: naam;

      c. indien de geregistreerde een instelling is in de zin van
      [artikel 1, eerste lid, van de Wet kwaliteit, klachten en geschillen zorg][ref2], welke wordt gevormd door een
      organisatorisch verband van natuurlijke personen die bedrijfsmatig zorg verlenen of doen verlenen dan wel door een
      natuurlijk persoon die bedrijfsmatig zorg doet verlenen: naam van de instelling.

      2 In het register van indicatieorganen en zorgverzekeraars wordt per inschrijving opgenomen de naam van
      onderscheidenlijk het indicatieorgaan en de zorgverzekeraar.

      3 In de registers wordt voorts per inschrijving opgenomen:

      a. aard van de gegevens en bescheiden aan de hand waarvan is vastgesteld dat de geregistreerde een zorgaanbieder,
      indicatieorgaan of zorgverzekeraar is;

      b. datum van opname in het register;

      c. adres van vestiging;

      d. gegevens met betrekking tot verstrekte en ingetrokken toegangsmiddelen.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld over de opname en verwerking van gegevens in het
      register.


      [ref1]: https://wetten.overheid.nl/BWBR0006251
      [ref2]: https://wetten.overheid.nl/BWBR0037173#Artikel1
    url: https://wetten.overheid.nl/BWBR0023902/2018-07-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006251
      - id: ref2
        bwb_id: BWBR0037173
        artikel: '1'
  - number: '7'
    text: |-
      De geregistreerde stelt Onze Minister onmiddellijk op de hoogte van een wijziging van de in het register
      opgenomen gegevens en van andere omstandigheden die van belang kunnen zijn voor het schorsen of doorhalen van de
      inschrijving.
    url: https://wetten.overheid.nl/BWBR0023902/2018-07-28#Artikel7
  - number: '8'
    text: |-
      Zolang de inschrijving van een zorgaanbieder in het register, bedoeld in
      [artikel 3 van de Wet op de beroepen in de individuele gezondheidszorg][ref1], is geschorst, is zijn inschrijving
      in het register van zorgaanbieders geschorst.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0023902/2018-07-28#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
  - number: '9'
    text: |-
      De inschrijving in het register wordt slechts doorgehaald:

      a. op verzoek van de geregistreerde of

      b. indien de geregistreerde geen zorgaanbieder, indicatieorgaan of zorgverzekeraar meer is.
    url: https://wetten.overheid.nl/BWBR0023902/2018-07-28#Artikel9
  - number: '10'
    text: |-
      1 Onze Minister deelt aan een ieder die daarom verzoekt mede of:

      a. een natuurlijke persoon of rechtspersoon staat ingeschreven;

      b. een aan een geregistreerde verstrekt toegangsmiddel geldig is.

      2 Indien het verzoek wordt gedaan door de SBV-Z, wordt de mededeling, bedoeld in het eerste lid, te allen tijde
      onmiddellijk gedaan.
    url: https://wetten.overheid.nl/BWBR0023902/2018-07-28#Artikel10
  - number: 10a
    text: |-
      Voor de toepassing van dit hoofdstuk wordt verstaan onder:

        - *jeugdhulpaanbieder:* jeugdhulpaanbieder als bedoeld in [artikel 1.1 van de Jeugdwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0023902/2018-07-28#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1.1'
  - number: '11'
    text: |-
      1 Onze Minister draagt zorg voor de inrichting en instandhouding van een sectorale berichtenvoorziening in de zorg,
      waarvan deel uitmaken:

      a. voorzieningen door tussenkomst waarvan zorgaanbieders, indicatieorganen, zorgverzekeraars en jeugdhulpaanbieders
      gebruik kunnen maken van de beheervoorziening;

      b. voorzieningen met behulp waarvan aan een cliënt een overzicht gegeven kan worden van het gebruik dat
      zorgaanbieders, indicatieorganen, zorgverzekeraars en jeugdhulpaanbieders van de voorzieningen, bedoeld onder a,
      hebben gemaakt teneinde het burgerservicenummer van de cliënt vast te stellen.

      2 Onze Minister is verwerkingsverantwoordelijke voor de SBV-Z.
    url: https://wetten.overheid.nl/BWBR0023902/2018-07-28#Artikel11
  - number: '12'
    text: |-
      1 Onze Minister stelt een systeembeschrijving voor de SBV-Z vast.

      2 De systeembeschrijving bevat een beschrijving van:

      a. de hoofdlijnen van de inrichting van de SBV-Z;

      b. de inrichting en werking van de voorzieningen, bedoeld in [artikel 11, eerste lid][ref1], met inbegrip van de
      wijze waarop de uitwisseling van gegevens door de SBV-Z met een zorgaanbieder, indicatieorgaan, zorgverzekeraar of
      jeugdhulpaanbieder enerzijds en de beheervoorziening anderzijds, plaatsvindt;

      c. de wijze waarop de SBV-Z het geautomatiseerde systeem van een zorgaanbieder, indicatieorgaan, zorgverzekeraar of
      jeugdhulpaanbieder in staat stelt aan te sluiten op de SBV-Z;

      d. de gevallen waarin en de wijze waarop aantekening wordt gehouden van het gebruik dat van de SBV-Z wordt gemaakt;

      e. de hoofdlijnen van het beheer van de SBV-Z.


      [ref1]: https://wetten.overheid.nl/BWBR0023902#Artikel11
    url: https://wetten.overheid.nl/BWBR0023902/2018-07-28#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0023902
        artikel: '11'
        hoofdstuk: III
  - number: '13'
    text: Onze Minister zorgt er voor dat de SBV-Z functioneert op een wijze die overeenstemt met de systeembeschrijving.
    url: https://wetten.overheid.nl/BWBR0023902/2018-07-28#Artikel13
  - number: '14'
    text: |-
      1 Onze Minister draagt zorg voor de nodige maatregelen van technische en organisatorische aard ter beveiliging van
      de gegevens die de SBV-Z verwerkt tegen verlies of aantasting van deze gegevens en tegen onbevoegde kennisneming,
      opneming, wijziging, verwijdering of verstrekking van deze gegevens.

      2 Onze Minister draagt zorg voor de nodige maatregelen van technische en organisatorische aard ter beveiliging
      van de SBV-Z tegen onbevoegd gebruik en belemmering van de goede werking van de voorzieningen, bedoeld in
      [artikel 11, eerste lid][ref1].

      3 De maatregelen, bedoeld in het eerste en tweede lid, hebben ten minste betrekking op:

      a. personen die werkzaam zijn voor Onze Minister;

      b. de toegang tot de SBV-Z, met inbegrip van de verbindingen met de SBV-Z;

      c. de toegang tot gebouwen en ruimten waar de SBV-Z of onderdelen daarvan aanwezig zijn;

      d. de apparatuur en de programmatuur van de SBV-Z;

      e. de gegevens en het beheer van de gegevens die door de SBV-Z zijn vastgelegd en bewaard;

      f. het geval dat de geheimhouding van door de SBV-Z verwerkte gegevens is geschaad;

      g. het voorkomen van calamiteiten en het afhandelen daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0023902#Artikel11
    url: https://wetten.overheid.nl/BWBR0023902/2018-07-28#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0023902
        artikel: '11'
        hoofdstuk: III
  - number: '15'
    text: |-
      Zorgaanbieders, indicatieorganen en zorgverzekeraars kunnen uitsluitend
      door tussenkomst van de SBV-Z gebruik maken van de voorzieningen, bedoeld in
      [artikel 3, eerste lid, onder c en d, van de Wet algemene bepalingen burgerservicenummer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0023902/2018-07-28#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '3'
  - number: '16'
    text: |-
      De zorgaanbieder, het indicatieorgaan, de zorgverzekeraar en de jeugdhulpaanbieder die is aangesloten op de SBV-Z
      draagt zorg dat de verbinding van zijn geautomatiseerde systeem met de SBV-Z en de uitwisseling van gegevens tussen
      zijn geautomatiseerde systeem en de SBV-Z functioneren op een wijze die overeenstemt met hetgeen daarover in de
      systeembeschrijving is vastgelegd.
    url: https://wetten.overheid.nl/BWBR0023902/2018-07-28#Artikel16
  - number: '17'
    text: |-
      Het onderzoek, bedoeld in [artikel 21, derde lid, van de Wet algemene bepalingen burgerservicenummer][ref1], leidt
      tot een oordeel over:

      a. de volledigheid, begrijpelijkheid en juistheid van de beschrijving van de inrichting, werking en beveiliging van
      de SBV-Z, gelet op de geldende regelgeving;

      b. de mate waarin de SBV-Z functioneert overeenkomstig de onder a bedoelde beschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel21
    url: https://wetten.overheid.nl/BWBR0023902/2018-07-28#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '21'
  - number: '18'
    text: |-
      Onze Minister kan op aanvraag de volgende middelen verschaffen waarmee de geregistreerde toegang kan verkrijgen tot
      de SBV-Z:

      a. een certificaat dat is verankerd in het Staat der Nederlanden Root CA Certificaat;

      b. een bij ministeriële regeling aangewezen authenticatiemiddel.
    url: https://wetten.overheid.nl/BWBR0023902/2018-07-28#Artikel18
  - number: '19'
    text: |-
      Bij ministeriële regeling kan worden bepaald welke gegevens en bescheiden worden verstrekt bij de aanvraag van
      een toegangsmiddel.
    url: https://wetten.overheid.nl/BWBR0023902/2018-07-28#Artikel19
  - number: '20'
    text: |-
      1 De aanvraag, bedoeld in [artikel 18][ref1], wordt toegekend, tenzij:

      a. de aanvraag niet is gedaan door een geregistreerde;

      b. de aanvraag een certificaat betreft en de geregistreerde niet voldoet aan de vereisten voor de toekenning van
      een certificaat;

      c. de aanvraag een authenticatiemiddel betreft en de geregistreerde niet voldoet aan de bij ministeriële regeling
      gestelde regels voor de toekenning van dat toegangsmiddel.

      2 Onze Minister verstrekt het toegekende toegangsmiddel desgevraagd aan de geregistreerde, tenzij:

      a. het een certificaat betreft en de geregistreerde niet voldoet aan de vereisten voor het verstrekken van een
      certificaat;

      b. het een ander toegangsmiddel dan een certificaat betreft en de geregistreerde niet voldoet aan de bij
      ministeriële regeling gestelde regels voor de verstrekking van dat toegangsmiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0023902#Artikel18
    url: https://wetten.overheid.nl/BWBR0023902/2018-07-28#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0023902
        artikel: '18'
        hoofdstuk: IV
  - number: '21'
    text: |-
      1 Onze Minister brengt de geregistreerde een vergoeding voor het certificaat in rekening die ten hoogste
      kostendekkend is.

      2 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de vergoeding van het certificaat,
      waarbij in afwijking van het eerste lid kan worden bepaald dat geen vergoeding in rekening wordt gebracht voor
      daarbij aan te wijzen categorieën certificaten die gedurende een daarbij aan te wijzen periode worden verstrekt.

      3 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de vergoeding van een ander
      toegangsmiddel dan een certificaat.
    url: https://wetten.overheid.nl/BWBR0023902/2018-07-28#Artikel21
  - number: '22'
    text: |-
      1 De geregistreerde gebruikt het toegangsmiddel uitsluitend overeenkomstig de bestemming van dat toegangsmiddel.

      2 De geregistreerde treft passende maatregelen om het toegangsmiddel te beveiligen tegen beschadiging, verlies en
      onrechtmatig gebruik.

      3 De geregistreerde doet Onze Minister onmiddellijk mededeling van omstandigheden die van belang kunnen zijn voor
      het wijzigen of intrekken van het toegangsmiddel.

      4 Onze Minister kan de geregistreerde aanwijzingen geven met betrekking tot het beheer, de beveiliging of het
      gebruik van het toegangsmiddel.

      5 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het beheer, de beveiliging, het
      gebruik en de intrekking van het toegangsmiddel.
    url: https://wetten.overheid.nl/BWBR0023902/2018-07-28#Artikel22
  - number: '23'
    text: |-
      Het toegangsmiddel kan worden ingetrokken:

      a. indien het toegangsmiddel niet is verstrekt op grond van [artikel 20, tweede lid, onder a of b][ref1];

      b. indien de vergoeding, bedoeld in [artikel 21][ref2], niet is voldaan;

      c. indien de inschrijving in het register is geschorst of is doorgehaald;

      d. indien het toegangsmiddel beschadigd, verloren of defect is;

      e. indien het toegangsmiddel onrechtmatig gebruikt is;

      f. indien de werking van het toegangsmiddel aangetast is;

      g. indien de geregistreerde niet voldoet aan de aanwijzingen of regels met betrekking tot het beheer, de
      beveiliging, het gebruik en de intrekking van het toegangsmiddel;

      h. in andere, bij ministeriële regeling te bepalen gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0023902#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0023902#Artikel21
    url: https://wetten.overheid.nl/BWBR0023902/2018-07-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0023902
        artikel: '20'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0023902
        artikel: '21'
        hoofdstuk: IV
  - number: '24'
    text: Bij ministeriële regeling wordt de geldigheidsduur van het toegangsmiddel bepaald.
    url: https://wetten.overheid.nl/BWBR0023902/2018-07-28#Artikel24
  - number: '25'
    text: De geregistreerde verkrijgt geen recht van eigendom of rechten van intellectuele eigendom op het toegangsmiddel.
    url: https://wetten.overheid.nl/BWBR0023902/2018-07-28#Artikel25
  - number: '26'
    text: |-
      [Artikel 5, aanhef en onder a, van de wet][ref1] geldt niet voor apothekers.


      [ref1]: https://wetten.overheid.nl/BWBR0023864#Artikel5
    url: https://wetten.overheid.nl/BWBR0023902/2018-07-28#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0023864
        artikel: '5'
  - number: '27'
    text: |-
      In afwijking van [artikel 5 van de wet][ref1] stelt een zorgaanbieder de identiteit van een persoon die op het
      moment van inwerkingtreding van de [wet][ref2] zijn cliënt is, vast voor zover dat redelijkerwijs nodig is ter
      uitvoering van [artikel 12 van de Wet algemene bepalingen burgerservicenummer][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0023864#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0023864
      [ref3]: https://wetten.overheid.nl/BWBR0022428#Artikel12
    url: https://wetten.overheid.nl/BWBR0023902/2018-07-28#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0023864
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0023864
      - id: ref3
        bwb_id: BWBR0022428
        artikel: '12'
  - number: '28'
    text: |-
      1 Indien het vaststellen van de identiteit van een cliënt door een zorgaanbieder overeenkomstig het bij
      of krachtens de [artikelen 5][ref1], [6][ref2] en [17 van de wet][ref3] bepaalde onmogelijk blijkt of een
      onevenredige inspanning kost, gebruikt de zorgaanbieder in afwijking van de [artikelen 4][ref4], [8][ref5] en
      [9 van de wet][ref6] geen burgerservicenummer.

      2 In de gevallen, bedoeld het eerste lid:

      a. neemt de zorgaanbieder in ieder geval de volgende gegevens van de cliënt in zijn administratie op:

      1°. geslachtsnaam;

      2°. voornamen;

      3°. geboortedatum;

      4°. postcode van het woonadres;

      5°. huisnummer van het woonadres en

      b. vermeldt de zorgaanbieder de gegevens, bedoeld in onderdeel a, bij het verstrekken van persoonsgegevens
      met betrekking tot de verlening van, indicatiestelling voor of verzekering van zorg aan een zorgaanbieder, een
      indicatieorgaan of een zorgverzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0023864#Artikel5
