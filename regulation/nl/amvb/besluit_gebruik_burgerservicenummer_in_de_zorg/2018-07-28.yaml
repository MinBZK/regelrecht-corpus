  - number: '29'
    text: |-
      1 In afwijking van [artikel 28][ref1] kan het burgerservicenummer worden gebruikt door apothekers en bij zorg die
      per telefoon of per elektronische bericht aan de cliënt wordt verleend, indien:

      a. de zorgaanbieder de identiteit van de cliënt aan de hand van de volgende gegevens van de cliënt controleert:

      1°. geslachtsnaam;

      2°. voornamen;

      3°. geboortedatum;

      4°. postcode van het woonadres;

      5°. huisnummer van het woonadres en

      b. de zorgaanbieder bij het verstrekken van het burgerservicenummer vermeldt dat de identiteit van de cliënt niet
      is vastgesteld.

      2 In afwijking van [artikel 28, eerste lid][ref2], kan, met betrekking tot cliënten tot de leeftijd van 14
      jaar, waarbij het vaststellen van de identiteit overeenkomstig het bij of krachtens de [artikelen 5][ref3] en
      [6 van de wet][ref4] bepaalde onmogelijk blijkt, het burgerservicenummer worden gebruikt bij jeugdgezondheidszorg
      als omschreven bij of krachtens de [Wet publieke gezondheid][ref5] en bij vaccinaties, opgenomen in een
      vaccinatieprogramma als bedoeld in [artikel 18 van het Besluit zorgaanspraken AWBZ][ref6], indien de zorgaanbieder:

      a. de identiteit van de cliënt controleert aan de hand van de gegevens genoemd in het eerste lid, onderdeel a, met
      de persoonslijst met burgerservicenummer die verstrekt is door de gemeente aan de cliënt, en

      b. bij het verstrekken van het burgerservicenummer vermeldt dat de identiteit van de cliënt niet is vastgesteld.

      3 De zorgaanbieder, bedoeld in het tweede lid, gaat bij elk volgend contact met de cliënt na of de cliënt inmiddels
      in het bezit is van een document als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref7] en gebruikt,
      indien dit het geval is, dit document eenmalig om de identiteit van de cliënt vast te stellen.

      4 Als de cliënt, bedoeld in het tweede en derde lid, de leeftijd van 14 jaren heeft bereikt, stelt de
      zorgaanbieder, bedoeld in het tweede en derde lid, alsnog eenmalig de identiteit van de cliënt vast overeenkomstig
      het bepaalde krachtens de [artikelen 5][ref8] en [6 van de wet][ref9].

      5 In afwijking van [artikel 28, eerste lid][ref10], kan met betrekking tot een pasgeborene het burgerservicenummer
      gebruikt worden bij zorg zoals huisartsen, medisch-specialisten, klinisch-psychologen, verloskundigen en
      kraamverzorgenden die plegen te bieden aan moeder en kind in verband met een bevalling als bedoeld in de
      [artikelen 2.4][ref11] en [2.12 van het Besluit zorgverzekering][ref12], indien de zorgaanbieder:

      a. tijdens de bevalling of direct daarna ter plaatse deze zorg heeft geboden en zich van de identiteit van de
      pasgeborene heeft kunnen vergewissen als kind van de kraamvrouw,

      b. de identiteit en het burgerservicenummer van de kraamvrouw overeenkomstig de
      [artikelen 5 tot en met 7 van de wet][ref13] heeft vastgesteld, en

      c. bij het verstrekken van het burgerservicenummer vermeldt dat de identiteit van de pasgeborene niet is
      vastgesteld.


