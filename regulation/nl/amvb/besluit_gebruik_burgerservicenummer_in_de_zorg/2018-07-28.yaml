  - number: '32'
    text: |-
      1 In afwijking van de [artikelen 3][ref1], [4][ref2] en [5][ref3] wordt in het register van zorgaanbieders
      opgenomen elke zorgaanbieder die een op het tijdstip van inwerkingtreding van dit besluit geldige overeenkomst
      terzake van een certificaat heeft gesloten met de Staat der Nederlanden.

      2 Op het tijdstip dat de overeenkomst, bedoeld in het eerste lid, met inachtneming van de daarvoor geldende
      termijn door Onze Minister is opgezegd, wordt een certificaat waarover de zorgaanbieder uit hoofde van
      de overeenkomst beschikt, aangemerkt als een certificaat dat op grond van dit besluit is verstrekt. De
      [artikelen 21, eerste en tweede lid][ref4], [22][ref5], [23, onderdelen b tot en met h][ref6], [24][ref7] en
      [25][ref8] zijn van overeenkomstige toepassing op het certificaat.


