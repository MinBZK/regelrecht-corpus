        artikel: '15'
        paragraaf: '3'
  - number: '7'
    text: >-
      1 De bouw, de inrichting en de voorzieningen van slachthuizen en het gebruik daarvan zijn zodanig, dat de dieren
      elke vermijdbare opwinding of pijn of elk vermijdbaar lijden wordt bespaard.


      2 De instrumenten, de installaties en de verdere voorzieningen in het slachthuis voor het fixeren, bedwelmen
      of doden van dieren zijn zo ontworpen, vervaardigd en onderhouden, en worden zo gebruikt dat de dieren snel en
      doeltreffend worden bedwelmd of gedood.


      3 Op de slachtplaats zijn voor noodgevallen passende vervangende instrumenten en verdere voorzieningen aanwezig,
      die in goede staat van onderhoud verkeren en die met het oog daarop regelmatig worden geïnspecteerd.
    url: https://wetten.overheid.nl/BWBR0008686/2006-03-22#Artikel7
  - number: '8'
    text: >-
      1 Productiedieren die in een slachthuis worden binnengebracht om er te worden geslacht, worden verplaatst en zo
      nodig ondergebracht overeenkomstig bijlage A van de richtlijn.


      2 Indien het slachten van meer dan licht zieke of licht gewonde productiedieren, bedoeld in paragraaf l, punt 6,
      van bijlage A van de richtlijn, binnen twee uur na aankomst bij het slachthuis om enigerlei reden onmogelijk is,
      doodt de keuringsdierenarts van de Voedsel en Waren Autoriteit, zoals deze is ingesteld bij besluit van de Minister
      van Volksgezondheid, Welzijn en Sport van 8 juli 2002 (Stcrt. 127) het dier terstond nadat hem die onmogelijkheid
      is gebleken en ter plaatse waar het zich bevindt door toediening van een letale dosis van een centraal depressief
      middel, dan wel laat hij het dier onder zijn toezicht doden.
    url: https://wetten.overheid.nl/BWBR0008686/2006-03-22#Artikel8
  - number: '9'
    text: >-
      Productiedieren die in een slachthuis worden binnengebracht om er te worden geslacht, worden gefixeerd
      overeenkomstig bijlage B van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0008686/2006-03-22#Artikel9
  - number: '10'
    text: |-
      1 Productiedieren die in een slachthuis worden binnengebracht om er te worden geslacht, worden voor het slachten
      bedwelmd, dan wel onmiddellijk gedood overeenkomstig bijlage C van de richtlijn.

      2 Bijlage C, paragraaf II, onderdeel 3A, punt 2a en 2b, van de richtlijn zijn niet van toepassing op elektrische
      bedwelming van pluimvee, hazen en konijnen, varkens, schapen en geiten in slachthuizen met een geringe
      slachtcapaciteit.

      3 Onder geringe slachtcapaciteit als bedoeld in het tweede lid wordt verstaan:

      a. voor pluimvee: het aantal behandelde stuks per jaar is minder dan 150 000;

      b. voor tamme hazen en konijnen: het aantal behandelde stuks per jaar is minder dan 150 000;

      c. voor varkens, schapen en geiten en gekweekt grof wild: het aantal behandelde grootvee-eenheden bedraagt per week
      ten hoogste 30 en per jaar ten hoogste 1 500, waarbij het aantal grootvee-eenheden als volgt wordt berekend:

      1°. varkens en gedomesticeerde wilde soortgenoten:

      - een varken van meer dan 100 kg levend gewicht: 0,2;
      - een ander varken: 0,15;

      2°. andere diersoorten en gedomesticeerde soortgenoten:

      - een schaap, een geit of een gedomesticeerd damhert: 0,10;
      - een lam, een jonge geit, een big, van minder dan 15 kg levend gewicht: 0,05.

      4 Het is verboden loopvogels met behulp van een waterbad te bedwelmen.
    url: https://wetten.overheid.nl/BWBR0008686/2006-03-22#Artikel10
  - number: '11'
    text: >-
      Productiedieren die in een slachthuis worden binnengebracht om er te worden geslacht, worden bij de verbloeding
      behandeld overeenkomstig bijlage D van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0008686/2006-03-22#Artikel11
  - number: '12'
    text: |-
      1 Het is verboden buiten het slachthuis rundvee, eenhoevigen of loopvogels te slachten of te doden.

      2 [De artikelen 9][ref1], [10][ref2] en [11][ref3] zijn van overeenkomstige toepassing op het buiten het slachthuis
      slachten en doden van andere productiedieren dan de in het eerste lid bedoelde dieren, met dien verstande dat
      varkens, geiten en schapen uitsluitend worden gedood door de dieren te slachten na voorafgaande bedwelming met
      een penschiettoestel.


      [ref1]: https://wetten.overheid.nl/BWBR0008686#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0008686#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0008686#Artikel11
    url: https://wetten.overheid.nl/BWBR0008686/2006-03-22#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008686
        artikel: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008686
        artikel: '10'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0008686
        artikel: '11'
        paragraaf: '2'
  - number: '13'
    text: >-
      1 Het doden van productiedieren met behulp van de kogel is zowel in als buiten een slachthuis verboden.


      2 Het eerste lid is niet van toepassing op het buiten een slachthuis doden van gekweekt grof wild waarbij de
      afstand tussen dier en schutter ten hoogste 25 meter bedraagt.
    url: https://wetten.overheid.nl/BWBR0008686/2006-03-22#Artikel13
  - number: '14'
    text: >-
      Het doden van productiedieren in het kader van de bestrijding van dierziekten geschiedt overeenkomstig bijlage E
      van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0008686/2006-03-22#Artikel14
  - number: '15'
    text: Pelsdieren worden gedood overeenkomstig bijlage F van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0008686/2006-03-22#Artikel15
  - number: '16'
    text: >-
      Eendagskuikens en embryo's van pluimvee die in broederijen overtollig zijn en die moeten worden verwijderd, worden
      zo snel mogelijk gedood overeenkomstig bijlage G van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0008686/2006-03-22#Artikel16
  - number: '17'
    text: |-
      1 Een wijziging van één of meer onderdelen van de richtlijn of van de richtlijnen, bedoeld in
      [artikel 10, tweede lid][ref1], gaat voor de toepassing van de artikelen van dit besluit, waarin naar die
      onderdelen wordt verwezen, gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering
      moet zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip
      wordt vastgesteld.

      2 Onze Minister doet van een wijzigingsrichtlijn als bedoeld in het eerste lid mededeling in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0008686#Artikel10
    url: https://wetten.overheid.nl/BWBR0008686/2006-03-22#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008686
        artikel: '10'
        paragraaf: '2'
  - number: '21'
    text: >-
      Dit besluit treedt in werking met ingang van een bij koninklijk besluit te bepalen tijdstip. Laatstbedoeld
      besluit wordt niet genomen voordat vier weken zijn verstreken nadat het onderhavige besluit is voorgelegd aan
      beide kamers der Staten-Generaal, en evenmin indien binnen die termijn door of namens een der kamers of door ten
      minste een vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen wordt gegeven dat de
      inwerkingtreding van dit besluit bij wet wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0008686/2006-03-22#Artikel21
  - number: '22'
    text: 'Dit besluit wordt aangehaald als: Besluit doden van dieren.'
    url: https://wetten.overheid.nl/BWBR0008686/2006-03-22#Artikel22
