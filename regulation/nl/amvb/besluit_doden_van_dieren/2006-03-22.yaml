preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Landbouw, Natuurbeheer en Visserij van 3 februari 1997, No. J. 971007,
    Directie Juridische Zaken;


    Gelet op richtlijn nr. 93/119/EG van de Raad van de Europese Unie van 22 december 1993 inzake de bescherming van
    dieren bij het slachten of doden (PbEG L 340), alsmede op de artikelen 1, tweede lid, 38 en 44, eerste en tweede
    lid, van de Gezondheids- en welzijnswet voor dieren;


    De Raad van State gehoord (advies van 24 maart 1997, no. W11.97.0054);


    Gezien het nader rapport van Onze Minister van Landbouw, Natuurbeheer en Visserij van 6 mei 1997, nr. J. 973847,
    Directie Juridische Zaken;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008686/2006-03-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. wet: [Gezondheids- en welzijnswet voor dieren][ref1];

      b. slachthuis: inrichting of installatie, met inbegrip van voorzieningen voor het verplaatsen of onderbrengen van
      dieren, die wordt gebruikt voor het commercieel slachten of doden van eenhoevigen, herkauwers, varkens, konijnen
      en pluimvee;

      c. verplaatsen: uitladen of drijven van dieren van de bij het slachthuis behorende losplaatsen, stallen of hokken
      naar de lokalen of plaatsen waar zij zullen worden geslacht of gedood;

      d. onderbrengen: houden en in voorkomend geval op passende wijze verzorgen door het verschaffen van water, voeder
      en rust, van dieren in door een slachthuis gebruikte stallen, hokken, overdekte plaatsen of weiden, voordat de
      dieren worden geslacht of gedood;

      e. fixeren: toepassen op een dier van een methode die erop is gericht de bewegingen van het dier te beperken
      teneinde het doeltreffend bedwelmen of doden te vergemakkelijken;

      f. bedwelmen: toepassen op een dier van een methode die het dier onmiddellijk brengt in een staat van
      bewusteloosheid die aanhoudt totdat de dood intreedt;

      g. doden: toepassen op een dier van een methode die resulteert in de dood van het dier;

      h. slachten: doden van een dier door verbloeding;

      i. productiedieren: eenhoevigen, herkauwers, varkens, konijnen en pluimvee, alle voor zover gehouden met het oog op
      het verkrijgen van producten, afkomstig van die dieren;

      j. pluimvee: kippen, kalkoenen, parelhoenders, eenden, ganzen, duiven, loopvogels en andere niet-gedomesticeerde
      vogels die in gevangenschap worden gekweekt of gehouden, anders dan eendagskuikens;

      k. pelsdier: dier dat uitsluitend wordt gefokt en gehouden met het oog op de pelsproductie;

      l. eendagskuikens: pluimvee van alle soorten dat nog geen 72 uur oud is en dat, met uitzondering van muskuseenden,
      nog niet is gevoerd;

      m. richtlijn: [richtlijn nr. 93/119/EG](31993L0119) van de Raad van de Europese Unie van 22 december 1993 inzake de
      bescherming van dieren bij het slachten of doden (*PbEG* L 340).

      2 Onder bevoegde autoriteit als bedoeld in de bijlagen C, D, E, F en G van de richtlijn wordt in dit besluit en de
      daarop rustende bepalingen verstaan: Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0005662
    url: https://wetten.overheid.nl/BWBR0008686/2006-03-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005662
  - number: '2'
    text: |-
      1 Als soorten en categorieën van dieren als bedoeld in [artikel 44, eerste lid, van de wet][ref1] worden aangewezen
      zoogdieren, reptielen, amfibieën en vogels.

      2 Dit besluit is niet van toepassing op:

      a. dieren die worden geslacht overeenkomstig de lsraëlitische of islamitische ritus;

      b. technische of wetenschappelijke experimenten die met betrekking tot de procedures voor het doden van dieren in
      geval van bestrijding van besmettelijke dierziekten worden verricht;

      c. vrij wild dat wordt gedood overeenkomstig sectie IV van bijlage III bij [verordening (EG) nr. 853/2004]
      (32004R0853) van het Europees Parlement en de Raad van de Europese Unie van 29 april 2004 houdende vaststelling van
      specifieke hygiënevoorschriften voor levensmiddelen van dierlijke oorsprong (PbEU L 139).


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel44
    url: https://wetten.overheid.nl/BWBR0008686/2006-03-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '44'
  - number: '3'
    text: >-
      Bij het verplaatsen, onderbrengen, fixeren, bedwelmen, slachten of doden wordt de dieren elke vermijdbare opwinding
      of pijn of elk vermijdbaar lijden bespaard.
    url: https://wetten.overheid.nl/BWBR0008686/2006-03-22#Artikel3
  - number: '4'
    text: >-
      1 Het verplaatsen, onderbrengen, fixeren, bedwelmen, slachten of doden van dieren wordt uitgevoerd door personen
      die de nodige kennis en vaardigheden bezitten om de taken humaan en doeltreffend uit te voeren.


      2 Onze Minister kan bij ministeriële regeling nadere regelen stellen ten aanzien van de kennis en vaardigheden van
      het personeel dat in een slachthuis met het bedwelmen, slachten of doden is belast.
    url: https://wetten.overheid.nl/BWBR0008686/2006-03-22#Artikel4
  - number: '5'
    text: |-
      Onverminderd [paragraaf 2][ref1] van dit besluit, wordt een dier gedood door toepassing van een:

      a. dodingsmethode die onmiddellijk na aanvang van de dodingshandeling leidt tot de dood van het dier,

      b. dodingsmethode die zonder onaanvaardbare opwinding of pijn leidt tot bewusteloosheid, gevolgd door de dood
      vóórdat de bewusteloosheid is geweken, of

      c. bedwelmingsmethode die zonder onaanvaardbare opwinding of pijn leidt tot bewusteloosheid, gevolgd door een
      dodingshandeling die leidt tot de dood vóórdat de bewusteloosheid is geweken.


      [ref1]: https://wetten.overheid.nl/BWBR0008686#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0008686/2006-03-22#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008686
        paragraaf: '2'
  - number: '6'
    text: |-
      [De artikelen 5][ref1], [12][ref2], [13][ref3] en [15][ref4] zijn niet van toepassing indien een dier gedood moet
      worden:

      a. ter beëindiging of voorkoming van onmiddellijk gevaar voor mens of dier;

      b. ter beëindiging van ondraaglijk lijden van het dier;

      c. in het kader van de bestrijding van een besmettelijke dierziekte.


      [ref1]: https://wetten.overheid.nl/BWBR0008686#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008686#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0008686#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0008686#Artikel15
    url: https://wetten.overheid.nl/BWBR0008686/2006-03-22#Artikel6
    references:
