preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuurbeheer en Visserij van 3 februari 1997, No. J. 971007,
    Directie Juridische Zaken;

    Gelet op richtlijn nr. 93/119/EG van de Raad van de Europese Unie van 22 december 1993 inzake de bescherming van
    dieren bij het slachten of doden (PbEG L 340), alsmede op de artikelen 1, tweede lid, 38 en 44, eerste en tweede
    lid, van de Gezondheids- en welzijnswet voor dieren;

    De Raad van State gehoord (advies van 24 maart 1997, no. W11.97.0054);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuurbeheer en Visserij van 6 mei 1997, nr. J. 973847,
    Directie Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008686/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *pluimvee:* pluimvee als bedoeld in artikel 2, onderdeel o, van Verordening (EG) nr. 1099/2009;
        - *slachten:* slachten als bedoeld in artikel 2, onderdeel j, van Verordening (EG) nr. 1099/2009;
        - *slachthuis:* slachthuis als bedoeld in artikel 2, onderdeel k, van Verordening (EG) nr. 1099/2009;
        - *Verordening (EG) nr. 1099/2009:* Verordening (EG) nr. 1099/2009 van de Raad van 24 september 2009 inzake de
      bescherming van dieren bij het doden (PbEU 2009, L 303);
        - *wet:* [Gezondheids- en welzijnswet voor dieren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005662
    url: https://wetten.overheid.nl/BWBR0008686/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005662
  - number: 1a
    text: |-
      De [artikelen 2 tot en met 6][ref1] zijn niet van toepassing op het doden van dieren en op met het doden verband
      houdende activiteiten, bedoeld in artikel 1, eerste lid, van Verordening (EG) nr. 1099/2009, met uitzondering van
      pluimvee, konijnen en hazen die door hun eigenaar voor particulier huishoudelijk verbruik buiten een slachthuis
      worden geslacht.


      [ref1]: https://wetten.overheid.nl/BWBR0008686#Artikel2
    url: https://wetten.overheid.nl/BWBR0008686/2013-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0008686
        artikel: '2'
        paragraaf: '1'
  - number: '2'
    text: |-
      1 Als soorten en categorieën van dieren als bedoeld in [artikel 44, eerste lid, van de wet][ref1] worden aangewezen
      zoogdieren, reptielen, amfibieën en vogels.

      2 Dit besluit is niet van toepassing op:

      a. dieren die worden geslacht overeenkomstig de lsraëlitische of islamitische ritus;

      b. technische of wetenschappelijke experimenten die met betrekking tot de procedures voor het doden van dieren in
      geval van bestrijding van besmettelijke dierziekten worden verricht;

      c. vrij wild dat wordt gedood overeenkomstig sectie IV van bijlage III bij [verordening (EG) nr. 853/2004]
      (32004R0853) van het Europees Parlement en de Raad van de Europese Unie van 29 april 2004 houdende vaststelling van
      specifieke hygiënevoorschriften voor levensmiddelen van dierlijke oorsprong (PbEU L 139).


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel44
    url: https://wetten.overheid.nl/BWBR0008686/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '44'
  - number: '3'
    text: |-
      Bij het doden van dieren en daarmee verband houdende activiteiten wordt de dieren elke vermijdbare opwinding of
      pijn of elk vermijdbaar lijden bespaard.
    url: https://wetten.overheid.nl/BWBR0008686/2013-01-01#Artikel3
  - number: '4'
    text: |-
      1 Het doden van dieren en daarmee verband houdende activiteiten wordt uitgevoerd door personen die de nodige kennis
      en vaardigheden bezitten om de taken humaan en doeltreffend uit te voeren.

      2 Onze Minister kan bij ministeriële regeling nadere regelen stellen ten aanzien van de in het eerste lid bedoelde
      kennis en vaardigheden.
    url: https://wetten.overheid.nl/BWBR0008686/2013-01-01#Artikel4
  - number: '5'
    text: |-
      Een dier wordt gedood door toepassing van een:

      a. dodingsmethode die onmiddellijk na aanvang van de dodingshandeling leidt tot de dood van het dier,

      b. dodingsmethode die zonder onaanvaardbare opwinding of pijn leidt tot bewusteloosheid, gevolgd door de dood
      vóórdat de bewusteloosheid is geweken, of

      c. bedwelmingsmethode die zonder onaanvaardbare opwinding of pijn leidt tot bewusteloosheid, gevolgd door een
      dodingshandeling die leidt tot de dood vóórdat de bewusteloosheid is geweken.
    url: https://wetten.overheid.nl/BWBR0008686/2013-01-01#Artikel5
  - number: '6'
    text: |-
      [ Artikel 5][ref1] is niet van toepassing indien een dier gedood moet worden:

      a. ter beëindiging of voorkoming van onmiddellijk gevaar voor mens of dier;

      b. ter beëindiging van ondraaglijk lijden van het dier.


      [ref1]: https://wetten.overheid.nl/BWBR0008686#Artikel5
    url: https://wetten.overheid.nl/BWBR0008686/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008686
        artikel: '5'
        paragraaf: '1'
  - number: '7'
    text: |-
      Het is verboden te handelen in strijd met bij ministeriële regeling aan te wijzen artikelen van Verordening (EG)
      nr. 1099/2009.
    url: https://wetten.overheid.nl/BWBR0008686/2013-01-01#Artikel7
  - number: '8'
    text: |-
      1 Bij ministeriële regeling worden regels gesteld voor een goede uitvoering van Verordening (EG) nr. 1099/2009.

      2 De regels, bedoeld in het eerste lid, kunnen betrekking hebben op:

      a. het aanwijzen van een bevoegde autoriteit;

      b. het verstrekken, schorsen en intrekken van getuigschriften van vakbekwaamheid;

      c. het goedkeuren van opleidingsprogramma’s en de inhoud en uitvoeringsbepalingen van examens;

      d. het uitvoeren van controles en inspectie die relevant zijn voor de bescherming van dieren bij het doden en met
      het doden verband houdende activiteiten;

      e. gidsen voor goede praktijken;

      f. het doden, en daarmee verband houdende activiteiten, van dieren buiten een slachthuis.
    url: https://wetten.overheid.nl/BWBR0008686/2013-01-01#Artikel8
  - number: '9'
    text: |-
      1 Het is verboden buiten het slachthuis rundvee, eenhoevigen of loopvogels te slachten of te doden.

      2 Varkens, geiten en schapen worden buiten het slachthuis uitsluitend gedood na voorafgaande bedwelming met een
      penschiettoestel.
    url: https://wetten.overheid.nl/BWBR0008686/2013-01-01#Artikel9
  - number: '21'
    text: |-
      Dit besluit treedt in werking met ingang van een bij koninklijk besluit te bepalen tijdstip. Laatstbedoeld
      besluit wordt niet genomen voordat vier weken zijn verstreken nadat het onderhavige besluit is voorgelegd aan
      beide kamers der Staten-Generaal, en evenmin indien binnen die termijn door of namens een der kamers of door ten
      minste een vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen wordt gegeven dat de
      inwerkingtreding van dit besluit bij wet wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0008686/2013-01-01#Artikel21
  - number: '22'
    text: 'Dit besluit wordt aangehaald als: Besluit doden van dieren.'
    url: https://wetten.overheid.nl/BWBR0008686/2013-01-01#Artikel22
