        bwb_id: BWBR0020368
        artikel: 5:68
      - id: ref2
        bwb_id: BWBR0020368
        artikel: 5:68
  - number: '23'
    text: |-
      Een onderneming als bedoeld in [artikel 5:68, eerste lid, van de wet][ref1], houdt van de door haar voor eigen
      rekening verrichte transacties in financiële instrumenten een administratie bij, die de volgende gegevens bevat:

      a. de per dag verrichte transacties;

      b. de financiële instrumenten waarop elke transactie betrekking heeft;

      c. de datum en het tijdstip waarop elke transactie is uitgevoerd;

      d. voor zover van toepassing, de identiteit van de derde die de transactie heeft uitgevoerd;

      e. de koers of de koersen waartegen de transacties zijn uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel568
    url: https://wetten.overheid.nl/BWBR0020417/2024-04-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 5:68
  - number: '24'
    text: |-
      1 Een onderneming als bedoeld in het tweede lid beschikt over een gedragscode voor privé-transacties
      door aan de onderneming verbonden personen die direct of indirect bij de transacties van de onderneming
      in financiële instrumenten zijn betrokken dan wel anderszins uit hoofde van werk, beroep of functie
      regelmatig over voorwetenschap beschikken of kunnen beschikken, tenzij de onderneming met toepassing van
      [artikel 25, derde lid][ref1], besluit geen personen aan te wijzen als insider als bedoeld in artikel 25. Zij
      draagt er zorg voor dat de gedragscode bekend is bij ieder wie het aangaat en ziet toe op de naleving ervan.

      2 Het eerste lid is van toepassing op:

      a. clearinginstellingen;

      b. banken die geen beleggingsdiensten mogen verlenen of beleggingsactiviteiten mogen verrichten, beheerders
      van beleggingsinstellingen, beheerders van icbe’s, beleggingsmaatschappijen, financiële instellingen die een
      verklaring van ondertoezichtstelling hebben verkregen, maatschappij voor collectieve belegging in effecten,
      ondernemingsspaarfondsen, pensioenfondsen en verzekeraars, die beschikken over een gekwalificeerde deelneming in
      een uitgevende instelling of waarvan de transacties in financiële instrumenten gedurende het afgelopen kalenderjaar
      € 20 miljoen of meer hebben bedragen.

      3 Tot de transacties in financiële instrumenten, bedoeld in het tweede lid, onderdeel b, worden niet gerekend:

      a. de transacties van een bijkantoor buiten Nederland of een dochtermaatschappij van de onderneming; en

      b. de transacties van een buiten Nederland gevestigde onderneming waarvan de onderneming een bijkantoor is.

      4 Voor de toepassing van het tweede lid, onderdeel b, worden de volgende transacties buiten beschouwing gelaten:

      a. transacties in obligaties uitgegeven door de Staat der Nederlanden, andere overheden en overheidslichamen,
      internationale verdragsorganisaties en supranationale publiekrechtelijke lichamen;

      b. transacties in financiële instrumenten waarvan het beheer is overgedragen aan een derde, op zodanige voorwaarden
      dat de onderneming geen invloed heeft op de fondsselectie of op afzonderlijke transacties;

      c. transacties in indexfondsen of in rechten van deelneming in beleggingsinstellingen die alleen openstaan voor
      professionele marktpartijen.


      [ref1]: https://wetten.overheid.nl/BWBR0020417#Artikel25
    url: https://wetten.overheid.nl/BWBR0020417/2024-04-01#Artikel24
