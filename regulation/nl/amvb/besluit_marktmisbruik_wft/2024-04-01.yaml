  - number: '22'
    text: |-
      1 Een onderneming als bedoeld in [artikel 5:68, eerste lid, van de wet][ref1], wijst een persoon aan die belast
      is met het interne toezicht op de naleving van het in dit hoofdstuk bepaalde en stelt regels ten aanzien van de
      uitoefening van dat toezicht.

      2 Een onderneming als bedoeld in [artikel 5:68, eerste en vierde lid, van de wet][ref2] beschikt over passende
      procedures die haar werknemers in staat stellen om door hen geconstateerde mogelijke of feitelijke overtredingen
      van de verordening marktmisbruik intern te melden.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel568
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel568
    url: https://wetten.overheid.nl/BWBR0020417/2024-04-01#Artikel22
    references:
