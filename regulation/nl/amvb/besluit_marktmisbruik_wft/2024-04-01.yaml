articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. wet: [Wet op het financieel toezicht][ref1];

      b. voorwetenschap: informatie als bedoeld in artikel 7, eerste lid, van de verordening marktmisbruik.

      c. privé-transactie: transactie in een financieel instrument voor eigen rekening of ten behoeve van een derde
      op wiens beleggingen de betrokkene, anders dan uit hoofde van het verlenen van een beleggingsdienst, invloed
      uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020417/2024-04-01#Artikel1
