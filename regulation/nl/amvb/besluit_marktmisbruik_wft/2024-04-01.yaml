  - number: '20'
    text: |-
      Een onderneming als bedoeld in [artikel 5:68, eerste lid, van de wet][ref1], treft adequate maatregelen teneinde
      belangenconflicten met betrekking tot transacties in financiële instrumenten te beheersen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel568
    url: https://wetten.overheid.nl/BWBR0020417/2024-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 5:68
  - number: '21'
    text: |-
      Een onderneming als bedoeld in [artikel 5:68, eerste lid, van de wet][ref1], treft adequate maatregelen teneinde:

      a. te vermijden dat voorwetenschap bekend wordt buiten de kring van personen die uit hoofde van de uitoefening van
      werk, beroep of functie daarmee bekend dienen te zijn;

      b. te waarborgen dat aan de onderneming verbonden personen de uiterste zorgvuldigheid betrachten in de behandeling
      van informatie waarvan zij weten of redelijkerwijs moeten vermoeden dat deze moet worden aangemerkt als
      voorwetenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel568
    url: https://wetten.overheid.nl/BWBR0020417/2024-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 5:68
  - number: 21a
    text: |-
      1 Een onderneming als bedoeld in [artikel 5:68, eerste lid, van de wet][ref1], niet zijnde een clearinginstelling,
      treft adequate maatregelen teneinde te vermijden dat zij:

      a. transacties uitvoert of laat uitvoeren met als oogmerk een financieel instrument te verwerven of aan te bieden
      dat is uitgegeven door een onderneming die clustermunitie als bedoeld in artikel 2 van het op 30 mei 2008 te
      Dublin tot stand gekomen Verdrag inzake clustermunitie (Trb. 2009, 45), of cruciale onderdelen daarvan, produceert,
      verkoopt of distribueert;

      b. leningen verstrekt aan een onderneming als bedoeld in onderdeel a;

      c. niet vrij verhandelbare deelnemingen in het kapitaal van een onderneming als bedoeld in onderdeel a verwerft.

      2 Het eerste lid is van overeenkomstige toepassing op het uitvoeren of laten uitvoeren van transacties met als
      oogmerk een financieel instrument te verwerven of aan te bieden dat is uitgegeven door een onderneming die meer
      dan de helft van het aandelenkapitaal in een onderneming als bedoeld in het eerste lid, onderdeel a, houdt en op
      leningen aan of niet vrij verhandelbare deelnemingen in een zodanige onderneming.

      3 Het eerste lid is niet van toepassing op:

      a. transacties gebaseerd op een index die voor minder dan vijf procent bestaat uit ondernemingen als bedoeld in het
      eerste lid, onderdeel a;

      b. transacties in door derden beheerde beleggingsinstellingen die voor minder dan vijf procent bestaan uit
      ondernemingen als bedoeld in het eerste lid, onderdeel a; en

      c. investeringen in nauwkeurig omschreven projecten van een onderneming als bedoeld in het eerste lid, onderdeel a,
      voor zover de financiering niet wordt aangewend voor de productie, verkoop of distributie van clustermunitie.

      4 Onverminderd het eerste lid, dienen ondernemingen die financiële instrumenten, leningen of niet vrij
      verhandelbare deelnemingen als bedoeld in het eerste lid bezitten, deze binnen een redelijke termijn van de hand te
      doen of te beëindigen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel568
    url: https://wetten.overheid.nl/BWBR0020417/2024-04-01#Artikel21a
