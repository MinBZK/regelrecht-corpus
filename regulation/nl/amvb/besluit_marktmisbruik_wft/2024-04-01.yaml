  - number: '30'
    text: |-
      [Artikel 24, eerste lid][ref1], is tot de eerste dag van de zevende maand na de datum van inwerkingtreding
      niet van toepassing op ondernemingen als bedoeld in [artikel 24, tweede lid, onderdeel b][ref2],
      die op de datum van inwerkingtreding van dit besluit werkzaam zijn en ingevolge
      [hoofdstuk IVA van de Vrijstellingsregeling Wet toezicht effectenverkeer 1995][ref3] waren vrijgesteld van
