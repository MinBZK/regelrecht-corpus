  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Financiën van 20 april 2006, nr. FM 2006-00969 M;

    Gelet op richtlijn nr. 2003/6/EG van het Europees Parlement en de Raad van de Europese Unie van 28 januari 2003
    betreffende handel met voorwetenschap en marktmanipulatie (PbEU L 96), richtlijn nr. 2003/124/EG van de Europese
    Commissie van 22 december 2003 tot uitvoering van richtlijn nr. 2003/6/EG van het Europees Parlement en de Raad
    wat de definitie en openbaarmaking van voorwetenschap en de definitie van marktmanipulatie betreft (PbEU L 339),
    richtlijn nr. 2003/125/EG van de Commissie van de Europese Gemeenschappen van 22 december 2003 tot uitvoering van
    richtlijn 2003/6/EG van het Europees Parlement en de Raad wat de juiste voorstelling van beleggingsaanbevelingen
    en de bekendmaking van belangenconflicten betreft (PbEU L 339), richtlijn nr. 2004/72/EG van de Commissie
    van de Europese Gemeenschappen van 29 april 2004 tot uitvoering van richtlijn nr. 2003/6/EG van het Europees
    Parlement en de Raad wat gebruikelijke marktpraktijken, de definitie van voorwetenschap met betrekking tot van
    grondstoffen afgeleide instrumenten, het opstellen van lijsten van personen met voorwetenschap, de melding van
    transacties van leidinggevende personen en de melding van verdachte transacties betreft (PbEU L 162) en richtlijn
    nr. 2004/109/EG van het Europees Parlement en de Raad van de Europese Unie van 15 december 2004 betreffende de
    transparantievereisten die gelden voor informatie over uitgevende instellingen waarvan effecten tot de handel
    op een gereglementeerde markt zijn toegelaten en tot wijziging van Richtlijn 2001/34/EG (PbEU L 390), alsmede de
    artikelen 5:56, zesde lid, 5:57, derde lid, 5:58, derde lid, 5:59, vierde en achtste lid, 5:60, eerste lid, aanhef
    en onderdeel d, derde, vijfde en zesde lid, 5:62, derde lid, 5:64, eerste lid, 5:65 en 5:68, eerste lid, van de Wet
    op het financieel toezicht;

    De Raad van State gehoord (advies van 3 juli 2006, nr. W06.06.0135/IV);

    Gezien het nader rapport van Onze Minister van Financiën van 9 oktober 2006, nr. FM 2006-01695U;

    Hebben goedgevonden en verstaan:
