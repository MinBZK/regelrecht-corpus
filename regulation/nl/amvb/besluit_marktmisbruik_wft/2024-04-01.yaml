        artikel: '25'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '25'
    text: |-
      1 De gedragscode, bedoeld in [artikel 24, eerste lid][ref1], bevat regels die gelden voor alle in dat lid bedoelde
      personen, en aanvullende regels voor insiders.

      2 Een onderneming wijst als insider aan:

      a. de personen die het dagelijks beleid van de onderneming bepalen of mede bepalen;

      b. personen van wie de werkzaamheden bestaan uit het verrichten of bewerkstelligen van transacties in financiële
      instrumenten, of uit het aanbieden, verrichten, afwikkelen of controleren van diensten op het gebied van
      bemiddeling in financiële instrumenten of op het gebied van vermogensbeheer;

      c. andere personen die uit hoofde van hun verbondenheid aan de onderneming regelmatig over voorwetenschap
      beschikken of kunnen beschikken.

      3 Een onderneming kan besluiten een in het tweede lid, onderdeel a of b, bedoelde persoon niet aan te wijzen als
      insider als deze niet regelmatig over voorwetenschap beschikt of kan beschikken.

      4 Een onderneming voorziet in procedures voor het aanwijzen van insiders en voor de toepassing van het derde lid,
      en houdt een lijst bij van de personen die als insider zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0020417#Artikel24
    url: https://wetten.overheid.nl/BWBR0020417/2024-04-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020417
        artikel: '24'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '26'
    text: |-
      De gedragscode, bedoeld in [artikel 24, eerste lid][ref1], bepaalt dat een in dat lid bedoelde persoon iedere
      vermenging van zakelijke en privé-belangen, respectievelijk de redelijkerwijs voorzienbare schijn daarvan, die te
      maken heeft met transacties in financiële instrumenten, vermijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0020417#Artikel24
    url: https://wetten.overheid.nl/BWBR0020417/2024-04-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0020417
        artikel: '24'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '27'
    text: |-
      1 De gedragscode, bedoeld in [artikel 24, eerste lid][ref1], bepaalt dat een insider als bedoeld in
      [artikel 25, tweede lid][ref2]:

      a. door hem verrichte privé-transacties meldt op de in de gedragscode voorgeschreven wijze en met inachtneming van
      de in de gedragscode opgenomen voorschriften;

      b. naar zijn beste vermogen bevordert dat derden, op wier beleggingen hij invloed uitoefent of kan uitoefenen, de
      interne toezichthouder, bedoeld in [artikel 22][ref3], op diens verzoek alle informatie verstrekken omtrent enige
      door hen verrichte of bewerkstelligde privé-transactie.

      2 De gedragscode kan bepalen dat melding van transacties in bepaalde categorieën financiële instrumenten, waarvan
      melding niet bijdraagt aan het doel van de gedragscode, achterwege kan blijven.


