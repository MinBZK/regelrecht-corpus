        artikel: '31'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0019031
        artikel: '32'
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0019031
        artikel: '33'
        hoofdstuk: VI
      - id: ref4
        bwb_id: BWBR0019031
        artikel: '35'
        hoofdstuk: VI
  - number: 36.f
    text: |-
      de omvang van het grensgebied, bedoeld in [artikel 32, tweede lid, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel32
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '32'
        hoofdstuk: VI
  - number: '37'
    text: |-
      De op grond van dit hoofdstuk en [hoofdstuk IX][ref1] bij te houden of te verstrekken gegevens worden desgevraagd
      ten genoegen van Onze Minister gestaafd met bewijsstukken.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#HoofdstukIX
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0019031
        hoofdstuk: IX
  - number: '38.1'
    text: De intermediair meldt elk van zijn intermediaire ondernemingen afzonderlijk ter registratie aan bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel38
  - number: '38.2'
    text: 'Ten behoeve van de registratie verstrekt de intermediair per onderneming in ieder geval gegevens over:'
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel38
  - number: 38.2.a
    text: |-
      de locaties van de tot de onderneming behorende gebouwen en opslagruimten voor dierlijke meststoffen,
      zuiveringsslib, compost of mengsels van zuiveringsslib en compost;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel38
  - number: 38.2.b
    text: de tenaamstelling of handelsnaam;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel38
  - number: 38.2.c
    text: de rechtsvorm;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel38
  - number: 38.2.d
    text: |-
      in voorkomend geval de aard en samenstelling van het samenwerkingsverband van personen of rechtspersonen dat de
      onderneming voert;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel38
  - number: 38.2.e
    text: de aard van de activiteiten die in het kader van de onderneming worden uitgeoefend;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel38
  - number: 38.2.f
    text: |-
      de krachtens [artikel 70, vierde lid, onderdeel b][ref1], voorgeschreven apparatuur die in het kader van zijn
      onderneming wordt gebruikt of is bestemd om te worden gebruikt;


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel70
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '70'
        hoofdstuk: X
  - number: 38.2.g
    text: de apparatuur voor automatische gegevensregistratie die exclusief bij deze onderneming in gebruik is;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel38
  - number: 38.2.h
    text: de capaciteit van de bij de onderneming behorende opslagruimten voor meststoffen in tonnen; en
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel38
  - number: 38.2.i
    text: de wijzigingen in de gegevens, bedoeld in de onderdelen a tot en met h.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel38
  - number: '38.3'
    text: |-
      Voor zover de in het tweede lid bedoelde gegevens zijn verstrekt op grond van de [Meststoffenwet][ref1] en
      niet zijn gewijzigd, behoeven deze niet opnieuw te worden verstrekt. De registratie van deze gegevens geldt als
      registratie in de zin van het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: 38a.1
    text: |-
      Een registratie kan worden geweigerd of geschrapt in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: 38a.2
    text: |-
      Een registratie kan worden geschorst voor zover de intermediair boetes zijn opgelegd voor overtreding van de
      eisen gesteld bij of krachtens de wet, die onherroepelijk zijn geworden en niet zijn betaald of voor zover de
      intermediair verbeurde dwangsommen, ten aanzien waarvan invorderingsbeschikkingen onherroepelijk zijn geworden,
      niet heeft betaald. De schorsing vervalt op het moment dat de boetes of dwangsommen die ten grondslag liggen aan de
      schorsing zijn betaald.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel38a
  - number: 38a.3
    text: |-
      Voordat toepassing wordt gegeven aan het eerste lid kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: '39.1'
    text: De intermediair houdt per onderneming een inzichtelijke administratie bij.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel39
  - number: '39.2'
    text: |-
      De administratie bevat in ieder geval de gegevens, bedoeld in [artikel 38, tweede lid][ref1], alsmede gegevens
      over:


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel38
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '38'
        hoofdstuk: VII
  - number: 39.2.a
    text: |-
      de hoeveelheden in het kader van de onderneming aan- en afgevoerde meststoffen
      waarbij, voor zover van toepassing, wordt aangegeven dat de aan- of afvoer heeft
      plaatsgevonden ter uitvoering van [artikel 21, tweede lid, onderdeel d, onder 1°][ref1],
      [artikel 33a, tweede lid, onderdeel b, onder 1°, vierde of vijfde lid][ref2], en
      [artikel 33d, eerste lid, van de wet][ref3], de datum waarop de aan- en afvoer plaatsvond en het bedrijf of de
      onderneming van herkomst, onderscheidenlijk van bestemming dan wel, ingeval geen sprake is van een bedrijf of
      onderneming, gegevens over de leverancier onderscheidenlijk afnemer van de meststoffen;


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel33a
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel33d
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: 33a
      - id: ref3
        bwb_id: BWBR0004054
        artikel: 33d
  - number: 39.2.b
    text: |-
      de hoeveelheden meststoffen die in iedere afzonderlijke opslagruimte voor meststoffen zijn aangevoerd en de
      hoeveelheden meststoffen die uit die opslagruimte zijn afgevoerd, zodanig dat steeds blijkt welke hoeveelheid
      meststoffen zich in de opslagruimte bevindt;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel39
  - number: 39.2.c
    text: |-
      de hoeveelheid dierlijke meststoffen, uitgedrukt in kilogrammen fosfaat, waarvoor de intermediair ten aanzien van
      een kalenderjaar mestverwerkingsovereenkomsten heeft gesloten, en
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel39
  - number: 39.2.d
    text: |-
      de hoeveelheden meststoffen die bij de overdracht van een opslagruimte voor meststoffen aan of door een andere
      intermediair op het moment van overdracht aanwezig is in de desbetreffende opslagruimte.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel39
  - number: '39.3'
    text: 'Indien op een onderneming dierlijke meststoffen worden behandeld, bevat de administratie tevens gegevens over:'
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel39
  - number: 39.3.a
    text: de methode van behandeling;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel39
  - number: 39.3.b
    text: de hoeveelheid behandelde dierlijke meststoffen;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel39
  - number: 39.3.c
    text: de hoeveelheid, de aard en de samenstelling van de tezamen met de dierlijke meststoffen behandelde stoffen; en
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel39
  - number: 39.3.d
    text: de hoeveelheid en de samenstelling van de eindproducten van de behandeling.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel39
  - number: '39.4'
    text: |-
      [Artikel 34][ref1] is op de administratie, bedoeld in het eerste lid, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel34
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '34'
        hoofdstuk: VI
  - number: '39.5'
    text: De intermediair bewaart de mestverwerkingsovereenkomsten als onderdeel van zijn administratie.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel39
  - number: '39.6'
    text: |-
      De intermediair houdt in verband met de verantwoording van het vervoer van dierlijke meststoffen in zijn
      administratie bij voor elke vracht dierlijke meststoffen met behulp van op de naam van die intermediair
      geregistreerde apparatuur, bedoeld in [artikel 49][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel49
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '49'
        hoofdstuk: IX
        paragraaf: '1'
  - number: 39.6.a
    text: welke persoon of personen op welk moment het vervoer heeft of hebben verricht; en
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel39
  - number: 39.6.b
    text: |-
      de positiegegevens van het betreffende transportmiddel waarmee de gedurende het vervoer afgelegde route
      inzichtelijk kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel39
  - number: '40.1'
    text: De intermediair verstrekt jaarlijks gegevens uit de administratie aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel40
  - number: '40.2'
    text: |-
      De intermediair verstrekt desgevraagd door Onze Minister gegevens uit de administratie, binnen een door Onze
      Minister bepaalde termijn en op een door Onze Minister bepaalde wijze. Verstrekking geschiedt uitsluitend langs
      elektronische weg.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel40
  - number: '41'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel41
  - number: 41.a
    text: |-
      de overige bij de aanmelding, bedoeld in [artikel 38, eerste lid][ref1], te verstrekken gegevens, de wijze waarop
      en de termijn waarbinnen de aanmelding en de doorgifte van wijzigingen geschieden;


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel38
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '38'
        hoofdstuk: VII
  - number: 41.b
    text: |-
      de wijze waarop de administratie, bedoeld in [artikel 39][ref1], wordt gevoerd, de plaats waar deze met het oog
      op het toezicht op de naleving beschikbaar moet zijn en de termijn waarbinnen de gegevens of wijzigingen in de
      gegevens in deze administratie worden opgenomen;


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel39
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '39'
        hoofdstuk: VII
  - number: 41.c
    text: |-
      de overige gegevens die de administratie, bedoeld in [artikel 39][ref1], bevat;


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel39
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '39'
        hoofdstuk: VII
  - number: 41.d
    text: |-
      de gegevens die ingevolge [artikel 40, eerste lid][ref1], worden verstrekt en de wijze waarop en de termijn
      waarbinnen deze gegevens worden verstrekt;


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel40
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '40'
        hoofdstuk: VII
  - number: 41.e
    text: |-
      de gevallen waarin en de voorwaarden waaronder de [artikelen 38][ref1], [39][ref2] of [40][ref3] geheel of
      gedeeltelijk niet van toepassing zijn; en


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0019031#Artikel40
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '38'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0019031
        artikel: '39'
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0019031
        artikel: '40'
        hoofdstuk: VII
  - number: 41.f
    text: het aanbrengen van aanduidingen op de opslagruimten voor meststoffen ter identificatie van deze ruimten.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel41
  - number: '42'
    text: |-
      De op grond van dit hoofdstuk en [hoofdstuk IX][ref1] bij te houden of te verstrekken gegevens worden desgevraagd
      ten genoegen van Onze Minister gestaafd met bewijsstukken.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#HoofdstukIX
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0019031
        hoofdstuk: IX
  - number: '43.1'
    text: |-
      De ondernemer, die een of meer ondernemingen voert in het kader waarvan diervoeders worden afgeleverd aan een
      bedrijf met staldieren of runderen, of in het kader waarvan van bedrijven afgenomen koemelk wordt verwerkt, meldt
      elk van deze ondernemingen afzonderlijk ter registratie aan bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel43
  - number: '43.2'
    text: |-
      De ondernemer die een of meer ondernemingen voert, niet zijnde een bedrijf of een intermediaire onderneming, in het
      kader waarvan meststoffen worden verhandeld, meldt elk van deze ondernemingen afzonderlijk ter registratie aan bij
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel43
  - number: '43.3'
    text: 'Ten behoeve van de registratie verstrekt de ondernemer in ieder geval gegevens over:'
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel43
  - number: 43.3.a
    text: de locaties van de onderneming;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel43
  - number: 43.3.b
    text: de tenaamstelling of handelsnaam;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel43
  - number: 43.3.c
    text: de rechtsvorm;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel43
  - number: 43.3.d
    text: |-
      in voorkomend geval de aard en samenstelling van het samenwerkingsverband van personen of rechtspersonen dat de
      onderneming voert; en
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel43
  - number: 43.3.e
    text: de wijzigingen in de gegevens, bedoeld in de onderdelen a tot en met d.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel43
  - number: '43.4'
    text: |-
      Voor zover de in het derde lid bedoelde gegevens zijn verstrekt op grond van de [Meststoffenwet][ref1] en niet zijn
      gewijzigd, behoeven deze niet opnieuw te worden verstrekt. De registratie van deze gegevens geldt als registratie
      in de zin van het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: '43.5'
    text: |-
      Voor zover de in het derde lid bedoelde gegevens worden verstrekt op grond van de krachtens
      [artikel 6.4 van de Wet dieren][ref1] met betrekking tot diervoeders gestelde regels of de krachtens de
      [artikelen 27][ref2] en [28 van de Landbouwwet][ref3] gestelde regels, behoeven deze niet nogmaals te worden
      verstrekt. De registratie van deze gegevens geldt als registratie in de zin van het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002252#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0002252#Artikel28
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0002252
        artikel: '27'
      - id: ref3
        bwb_id: BWBR0002252
        artikel: '28'
  - number: '44.1'
    text: |-
      De ondernemer, bedoeld in [artikel 43, eerste lid][ref1], houdt per onderneming een inzichtelijke administratie
      bij.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel43
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '43'
        hoofdstuk: VIII
  - number: '44.2'
    text: |-
      De administratie, bedoeld in het eerste lid, bevat in ieder geval de gegevens, bedoeld in
      [artikel 43, derde lid][ref1], alsmede gegevens over:


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel43
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '43'
        hoofdstuk: VIII
  - number: 44.2.a
    text: |-
      de hoeveelheden van de door de ondernemer afgeleverde diervoeders per bedrijf, onderscheidenlijk de hoeveelheden
      alsmede het ureumgehalte van de door de ondernemer afgenomen koemelk per bedrijf;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel44
  - number: 44.2.b
    text: de datum waarop de aflevering of de afname plaatsvond; en
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel44
  - number: 44.2.c
    text: |-
      het bedrijf waaraan de diervoeders zijn afgeleverd, onderscheidenlijk het bedrijf waar de afgenomen koemelk is
      geproduceerd.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel44
  - number: '44.3'
    text: |-
      De ondernemer, bedoeld in [artikel 43, tweede lid][ref1], en de ondernemer in het kader van wiens onderneming
      staldieren aan bedrijven worden afgeleverd dan wel staldieren of eieren van bedrijven worden afgenomen, houdt per
      onderneming een inzichtelijke administratie bij.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel43
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '43'
        hoofdstuk: VIII
  - number: '44.4'
    text: 'De administratie, bedoeld in het derde lid, bevat in ieder geval gegevens over:'
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel44
  - number: 44.4.a
    text: |-
      de hoeveelheden van de door de ondernemer afgeleverde of afgenomen meststoffen per onderneming of per bedrijf,
      met uitzondering van de aan particulieren afgeleverde hoeveelheden, de aantallen door de ondernemer afgeleverde
      of afgenomen staldieren per bedrijf, onderscheiden naar diersoort en diercategorieën per soort, voor zover dit
      onderscheid wordt gemaakt in de krachtens [artikel 36][ref1] gestelde regels, onderscheidenlijk de hoeveelheden van
      de door de ondernemer afgenomen eieren per bedrijf;


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel36
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '36'
        hoofdstuk: VI
  - number: 44.4.b
    text: de datum waarop de aflevering of de afname plaatsvond; en
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel44
  - number: 44.4.c
    text: het bedrijf of de onderneming van bestemming, onderscheidenlijk herkomst.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel44
  - number: '44.5'
    text: |-
      Indien op een onderneming zuiveringsslib wordt geproduceerd of anderszins wordt bewerkt of verwerkt, bevat de
      administratie tevens gegevens over:
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel44
  - number: 44.5.a
    text: |-
      de in [artikel 16, eerste lid][ref1], bedoelde behandelingsmethode voor zuiveringsslib;


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel16
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '16'
        hoofdstuk: III
        paragraaf: '4'
  - number: 44.5.b
    text: de hoeveelheid geproduceerd, bewerkt of verwerkt zuiveringsslib; en
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel44
  - number: 44.5.c
    text: de hoeveelheid en de samenstelling van het zuiveringsslib.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel44
  - number: '44.6'
    text: |-
      De gegevens inzake de hoeveelheden diervoeders, koemelk en eieren worden uitgedrukt in kilogrammen en, met
      uitzondering van koemelk, in kilogrammen stikstof en fosfaat.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel44
  - number: '44.7'
    text: |-
      [Artikel 34][ref1] is op de administratie, bedoeld in het eerste en derde lid, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel34
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '34'
        hoofdstuk: VI
  - number: '45.1'
    text: |-
      De ondernemer, bedoeld in [artikel 43, eerste lid][ref1] en de ondernemer in het kader van wiens onderneming
      zuiveringsslib wordt verhandeld, verstrekt jaarlijks gegevens uit de administratie aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel43
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '43'
        hoofdstuk: VIII
  - number: '45.2'
    text: |-
      De buiten Nederland gevestigde ondernemer, in het kader van wiens onderneming diervoeders worden afgeleverd aan een
      bedrijf met staldieren, verstrekt bij de aflevering aan de landbouwer een begeleidend document waarop het gewicht
      en de overeenkomstig de krachtens [artikel 70, vierde lid][ref1], vastgestelde samenstelling van de afgeleverde
      diervoeders is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel70
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '70'
        hoofdstuk: X
  - number: '45.3'
    text: Het document, bedoeld in het tweede lid, is tijdens het vervoer van de diervoeders op het transportmiddel aanwezig.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel45
  - number: '45.4'
    text: |-
      Het tweede en het derde lid gelden niet indien de ondernemer de in het tweede lid bedoelde gegevens na afloop
      van het kalenderjaar waarin de afleveringen van diervoeders hebben plaatsgevonden aan Onze Minister verstrekt en
      voorafgaand aan de eerste aflevering aan Onze Minister verklaart zulks te zullen doen.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel45
  - number: '45.5'
    text: |-
      De ondernemer, bedoeld in [artikel 43, eerste lid][ref1], of [artikel 44, derde lid][ref2], verstrekt desgevraagd
      door Onze Minister gegevens uit de administratie, binnen een door Onze Minister bepaalde termijn en op een door
      Onze Minister bepaalde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel44
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '43'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0019031
        artikel: '44'
        hoofdstuk: VIII
  - number: '46.1'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel46
  - number: 46.1.a
    text: |-
      de overige bij de aanmelding, bedoeld in [artikel 43][ref1], te verstrekken gegevens, de wijze waarop en de termijn
      waarbinnen de aanmelding en de doorgifte van wijzigingen geschieden;


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel43
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '43'
        hoofdstuk: VIII
  - number: 46.1.b
    text: |-
      de wijze waarop de administratie, bedoeld in [artikel 44][ref1], wordt gevoerd, en de termijn waarbinnen de
      gegevens en wijzigingen in de gegevens in deze administratie worden opgenomen;


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel44
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '44'
        hoofdstuk: VIII
  - number: 46.1.c
    text: |-
      de overige gegevens die de administratie, bedoeld in [artikel 44][ref1], bevat;


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel44
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '44'
        hoofdstuk: VIII
  - number: 46.1.d
    text: |-
      de gegevens die ingevolge [artikel 45][ref1] worden verstrekt en de wijze waarop en de termijn waarbinnen deze
      gegevens worden verstrekt; en


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel45
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '45'
        hoofdstuk: VIII
  - number: 46.1.e
    text: |-
      de gevallen waarin en de voorwaarden waaronder de [artikelen 43][ref1], [44][ref2] of [45][ref3] geheel of
      gedeeltelijk niet van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0019031#Artikel45
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '43'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0019031
        artikel: '44'
        hoofdstuk: VIII
      - id: ref3
        bwb_id: BWBR0019031
        artikel: '45'
        hoofdstuk: VIII
  - number: '46.2'
    text: |-
      Bij ministeriële regeling kan het hebben van een identificatienummer worden voorgeschreven voor bij die
      ministeriële regeling omschreven gevallen waarin meststoffen worden aangevoerd dan wel afgevoerd naar een persoon,
      niet zijnde een landbouwer of ondernemer.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel46
  - number: '47'
    text: |-
      De op grond van dit hoofdstuk bij te houden of te verstrekken gegevens worden desgevraagd ten genoegen van Onze
      Minister gestaafd met bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel47
  - number: '48'
    text: |-
      Dierlijke meststoffen worden vervoerd door een intermediair wiens onderneming in het kader waarvan het vervoer
      plaatsvindt overeenkomstig [artikel 38][ref1] is geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel38
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '38'
        hoofdstuk: VII
  - number: 48a
    text: |-
      Een intermediair laat dierlijke meststoffen slechts aanvoeren bij zijn intermediaire onderneming indien deze
      overeenkomstig [artikel 38][ref1] is geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel38
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '38'
        hoofdstuk: VII
  - number: 48b.1
    text: |-
      Het vervoer van een vracht drijfmest door een intermediair geschiedt met een transportmiddel dat is uitgerust met
      de krachtens [artikel 70, vierde lid, onderdeel b][ref1], voorgeschreven apparatuur die op naam van de intermediair
      is geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel70
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel48b
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '70'
        hoofdstuk: X
  - number: 48b.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop de apparatuur, bedoeld in
      het eerste lid is bevestigd en op welke wijze deze apparatuur is verbonden met de apparatuur, bedoeld in
      [artikel 49, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel49
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel48b
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '49'
        hoofdstuk: IX
        paragraaf: '1'
  - number: '49.1'
    text: |-
      Vervoer van dierlijke meststoffen geschiedt met behulp van een satellietvolgsysteem en apparatuur voor
      gegevensregistratie.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel49
  - number: '49.2'
    text: |-
      Door middel van de in het eerste lid bedoelde apparatuur worden gegevens betreffende het vervoer van de vracht
      dierlijke meststoffen langs elektronische weg vastgelegd in het systeem, bedoeld in [artikel 51][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel51
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '51'
        hoofdstuk: IX
        paragraaf: '1'
  - number: '49.3'
    text: 'Bij ministeriële regeling worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel49
  - number: 49.3.a
    text: |-
      de eisen waaraan de apparatuur, bedoeld in het eerste lid, moet voldoen, waaronder de eis dat de apparatuur behoort
      tot een type dat is gekeurd door een door Onze Minister aangewezen instelling;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel49
  - number: 49.3.b
    text: de wijze waarop de apparatuur, bedoeld in het eerste lid, is bevestigd; en
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel49
  - number: 49.3.c
    text: |-
      de gegevens die met de apparatuur, bedoeld in het eerste lid, moeten worden vastgelegd en de wijze waarop die
      gegevens moeten worden vastgelegd, bewaard en verstrekt.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel49
  - number: '49.4'
    text: |-
      De krachtens het derde lid te stellen regels kunnen voor verschillende categorieën vervoerders, mestsoorten,
      herkomst of beoogde bestemming verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel49
  - number: '50.1'
    text: |-
      Voorafgaand aan het vervoer van dierlijke meststoffen doet de vervoerder langs elektronische weg daarvan mededeling
      aan de minister.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel50
  - number: '50.2'
    text: |-
      Ten behoeve van de mededeling, bedoeld in het eerste lid, worden langs elektronische weg gegevens verstrekt die
      betrekking hebben op dat vervoer van dierlijke meststoffen, waaronder:
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel50
  - number: 50.2.a
    text: gegevens die betrekking hebben op de vervoerder;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel50
  - number: 50.2.b
    text: gegevens die betrekking hebben op de leverancier;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel50
  - number: 50.2.c
    text: gegevens die betrekking hebben op de vracht dierlijke meststoffen;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel50
  - number: 50.2.d
    text: gegevens die betrekking hebben op de afnemer;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel50
  - number: 50.2.e
    text: het geplande moment van vervoer van de vracht dierlijke meststoffen.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel50
  - number: '50.3'
    text: |-
      Voor de mededeling, bedoeld in het eerste lid, wordt gebruik gemaakt van het systeem, bedoeld in
      [artikel 51][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel51
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '51'
        hoofdstuk: IX
        paragraaf: '1'
  - number: '50.4'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over de gegevens die moeten worden verstrekt bij de
      mededeling alsmede over het moment waarop de mededeling, bedoeld in het eerste lid, door de vervoerder wordt
      gedaan. Deze regels kunnen voor verschillende gevallen verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel50
  - number: '50.5'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de mogelijkheid tot het wijzigen, aanvullen dan wel
      intrekken van de mededeling en de gegevens die daarbij zijn verstrekt en het moment waarop dit kan plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel50
  - number: '51.1'
    text: |-
      Bij het vervoer van dierlijke meststoffen wordt gebruik gemaakt van een door de minister beschikbaar gesteld
      systeem.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel51
  - number: '51.2'
    text: |-
      Gegevens worden in het systeem, bedoeld in het eerste lid, verzameld, vastgelegd en verwerkt met het
      oog op de verantwoording van het vervoer van dierlijke meststoffen en de controle op de naleving van de
      meststoffenregelgeving teneinde water te beschermen tegen verontreiniging door nitraten uit agrarische bronnen.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel51
  - number: '51.3'
    text: |-
      Ten behoeve van het systeem, bedoeld in het eerste lid, worden langs elektronische weg gegevens verstrekt die zien
      op elke afzonderlijke fase in het vervoer van dierlijke meststoffen, waaronder:
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel51
  - number: 51.3.a
    text: |-
      een melding op een bij ministeriële regeling te bepalen moment voorafgaand aan het laden waarmee de vervoerder de
      gegevens van de mededeling, bedoeld in [artikel 50, eerste lid][ref1], bevestigt;


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel50
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '50'
        hoofdstuk: IX
        paragraaf: '1'
  - number: 51.3.b
    text: gegevens die betrekking hebben op het laden van de vracht dierlijke meststoffen;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel51
  - number: 51.3.c
    text: gegevens die betrekking hebben op het wegen van de vracht dierlijke meststoffen;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel51
  - number: 51.3.d
    text: gegevens die betrekking hebben op de bemonstering van de vracht dierlijke meststoffen;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel51
  - number: 51.3.e
    text: gegevens die betrekking hebben op de hoeveelheidsbepaling van de vracht dierlijke meststoffen;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel51
  - number: 51.3.f
    text: gegevens die betrekking hebben op het vervoer van de vracht dierlijke meststoffen;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel51
  - number: 51.3.g
    text: gegevens die betrekking hebben op het lossen van de vracht dierlijke meststoffen.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel51
  - number: '51.4'
    text: |-
      De gegevens, bedoeld in het derde lid, worden voor elke fase onverwijld verstrekt en stemmen te allen tijde overeen
      met de actuele omstandigheden van het vervoer.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel51
  - number: '51.5'
    text: De gegevens, bedoeld in het derde lid, worden volledig en naar waarheid verstrekt.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel51
  - number: '51.6'
    text: |-
      Bij ministeriële regeling worden regels gesteld over de gegevens, bedoeld in het derde lid, en over wie deze
      gegevens verstrekt.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel51
  - number: '51.7'
    text: |-
      Bij ministeriële regeling kan in afwijking van het vierde lid worden bepaald dat voor aldaar omschreven gevallen de
      verstrekking van gegevens op een ander moment kan plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel51
  - number: '51.8'
    text: |-
      Bij ministeriële regeling kunnen zo nodig in afwijking van het vierde lid regels worden gesteld over de
      mogelijkheid tot het wijzigen dan wel aanvullen dan wel verwijderen van de gegevens die zijn verstrekt en het
      moment waarop dit kan plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel51
  - number: '51.9'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de wijze en het tijdstip waarop de gegevens die worden
      verstrekt worden opgemaakt en ondertekend.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel51
  - number: '51.10'
    text: |-
      De regels, bedoeld in het zesde tot en met negende lid kunnen voor verschillende gevallen verschillend worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel51
  - number: '51.11'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop toegang tot het systeem kan worden
      verkregen.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel51
  - number: '52.1'
    text: |-
      Bij ministeriële regeling worden regels gesteld voor situaties waarin het niet mogelijk is om gebruik te
      maken van dan wel gegevens te verstrekken aan het door de minister beschikbaar gestelde systeem, bedoeld in
      [artikel 51, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel51
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '51'
        hoofdstuk: IX
        paragraaf: '1'
  - number: '52.2'
    text: 'De regels, bedoeld in het eerste lid, kunnen betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel52
  - number: 52.2.a
    text: |-
      een voorziening, bestaande uit een softwareapplicatie waarmee het mogelijk is om gegevens vast te leggen ingeval er
      geen netwerkverbinding is of het systeem, bedoeld in [artikel 51, eerste lid][ref1], tijdelijk niet beschikbaar is;


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel51
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '51'
        hoofdstuk: IX
        paragraaf: '1'
  - number: 52.2.b
    text: |-
      een voorziening voor het op andere wijze verstrekken van gegevens dan langs elektronische weg voor het geval waarin
      naar het oordeel van de minister sprake is van een uitzonderlijke situatie, waarbij de voorziening, bedoeld in
      onderdeel a, niet toereikend is;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel52
  - number: 52.2.c
    text: |-
      een verplichting tot het doen van een melding langs elektronische weg via het systeem, bedoeld in
      [artikel 51, eerste lid][ref1], na gebruik van een voorziening als bedoeld in de onderdelen a of b.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel51
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '51'
        hoofdstuk: IX
        paragraaf: '1'
  - number: '52.3'
    text: 'De regels, bedoeld in het eerste lid, kunnen voorts zien op:'
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel52
  - number: 52.3.a
    text: |-
      een nadere omschrijving van situaties waarin gebruik gemaakt kan worden van de voorzieningen zoals omschreven in
      het tweede lid;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel52
  - number: 52.3.b
    text: |-
      de eisen die aan de voorziening, bedoeld in het tweede lid, onderdeel a, worden gesteld, waaronder eisen over het
      bewaren en op een later moment verstrekken van gegevens aan het systeem, bedoeld in [artikel 51, eerste lid][ref1],
      alsmede eisen aan de voor deze voorziening te gebruiken apparatuur en applicaties;


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel51
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '51'
        hoofdstuk: IX
        paragraaf: '1'
  - number: 52.3.c
    text: de eisen die aan de andere wijze van verstrekken, bedoeld in het tweede lid, onderdeel b, worden gesteld;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel52
  - number: 52.3.d
    text: |-
      een omschrijving van de gevallen waarin de melding, bedoeld in het tweede lid, onderdeel c, is vereist, alsmede de
      eisen aan die melding, waaronder het moment waarop deze melding uiterlijk plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel52
  - number: 52.3.e
    text: 'een procedure om:'
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel52
  - number: 52.3.e.1.
    text: |-
      vast te stellen dat er sprake is van een situatie waarin de voorziening, bedoeld in het tweede lid, onderdeel b,
      kan worden toegepast, en
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel52
  - number: 52.3.e.2.
    text: |-
      vast te stellen dat de aanleiding voor het toepassen van de voorziening, bedoeld in het tweede lid, onderdeel b,
      niet langer aanwezig is, en
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel52
  - number: 52.3.e.3.
    text: |-
      de wijze van communiceren over het moment van openstellen van de voorziening alsmede over het moment waarop deze
      voorziening niet meer kan worden toegepast.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel52
  - number: 52a.1
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de gevallen waarin en de voorwaarden waaronder de
      [artikelen 48][ref1], [48b][ref2], [49][ref3], [50][ref4] en [51][ref5] geheel of gedeeltelijk niet van toepassing
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel48b
      [ref3]: https://wetten.overheid.nl/BWBR0019031#Artikel49
      [ref4]: https://wetten.overheid.nl/BWBR0019031#Artikel50
      [ref5]: https://wetten.overheid.nl/BWBR0019031#Artikel51
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '48'
        hoofdstuk: IX
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019031
        artikel: 48b
        hoofdstuk: IX
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0019031
        artikel: '49'
        hoofdstuk: IX
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0019031
        artikel: '50'
        hoofdstuk: IX
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0019031
        artikel: '51'
        hoofdstuk: IX
        paragraaf: '1'
  - number: 52a.2
    text: |-
      De krachtens het eerste lid te stellen regels kunnen voor verschillende categorieën vervoerders, mestsoorten,
      herkomst of beoogde bestemming verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel52a
  - number: 54a
    text: |-
      Een vracht zuiveringsslib, compost, mengsels van zuiveringsslib en compost, of krachtens
      [artikel 55, eerste lid][ref1], aangewezen overige organische meststoffen gaat tijdens het vervoer vergezeld van
      een op de vracht betrekking hebbend vervoersbewijs, dat overeenkomstig de regels, gesteld bij of krachtens deze
      paragraaf, is opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel55
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '55'
        hoofdstuk: IX
        paragraaf: '3'
  - number: '55.1'
    text: |-
      Ter zake van het vervoer van zuiveringsslib, compost en bij ministeriële regeling aangewezen overige organische
      meststoffen, wordt door de leverancier, de vervoerder en de afnemer gezamenlijk een vervoersbewijs opgemaakt.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel55
  - number: '55.2'
    text: |-
      De leverancier en de afnemer dragen er ieder voor zijn deel, en de vervoerder voor het geheel, zorg voor dat het
      vervoersbewijs overeenkomstig de krachtens [artikel 56][ref1] gestelde regels volledig en naar waarheid wordt
      ingevuld en ondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel56
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '56'
        hoofdstuk: IX
        paragraaf: '3'
  - number: '55.3'
    text: 'Het vervoersbewijs wordt bij ministeriële regeling vastgesteld en bevat in ieder geval gegevens over:'
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel55
  - number: 55.3.a
    text: de leverancier, de vervoerder en de afnemer;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel55
  - number: 55.3.b
    text: de hoeveelheid meststoffen;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel55
  - number: 55.3.c
    text: de samenstelling van de meststoffen; en
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel55
  - number: 55.3.d
    text: de soort meststoffen.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel55
  - number: '55.4'
    text: De gegevens op het vervoersbewijs worden niet gewijzigd of onleesbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel55
  - number: '55.5'
    text: De op het vervoersbewijs ingevulde gegevens worden op elektronische wijze bij Onze Minister ingediend.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel55
  - number: '55.6'
    text: |-
      De vervoerder bewaart het vervoersbewijs en de leverancier en de afnemer bewaren een afschrift van het
      vervoersbewijs als onderdeel van de administratie, bedoeld in de [artikelen 32][ref1], [39][ref2] of [44][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0019031#Artikel44
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '32'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0019031
        artikel: '39'
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0019031
        artikel: '44'
        hoofdstuk: VIII
  - number: '55.7'
    text: |-
      Voor de ondertekening van het vervoersbewijs kunnen de leverancier, de vervoerder en de afnemer elkaar niet
      machtigen.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel55
  - number: '56'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel56
  - number: 56.a
    text: de overige op het vervoersbewijs te vermelden gegevens;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel56
  - number: 56.b
    text: |-
      de wijze en het tijdstip waarop het vervoersbewijs door de leverancier, de vervoerder en de afnemer wordt opgemaakt
      en ondertekend;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel56
  - number: 56.c
    text: de overige ter zake van de vervoerde meststoffen te verstrekken gegevens;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel56
  - number: 56.d
    text: |-
      de wijze en het tijdstip waarop de op het vervoersbewijs ingevulde gegevens alsmede de gegevens, bedoeld in
      onderdeel c, worden ingediend; en
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel56
  - number: 56.e
    text: |-
      de gevallen waarin en de voorwaarden waaronder [artikel 55][ref1] geheel of gedeeltelijk niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel55
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '55'
        hoofdstuk: IX
        paragraaf: '3'
  - number: '57'
    text: |-
      Een verwerker verwerkt de hoeveelheid dierlijke meststoffen, uitgedrukt in kilogrammen fosfaat, waarvoor hij met
      betrekking tot een kalenderjaar mestverwerkingsovereenkomsten heeft gesloten, binnen een bij ministeriële regeling
      te stellen periode.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel57
  - number: '58'
    text: |-
      Bij ministeriële regeling aan te wijzen soorten dierlijke meststoffen tellen niet mee voor het voldoen aan de
      verplichting, bedoeld in [artikel 33d, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel33d
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 33d
  - number: '59'
    text: |-
      Een overeenkomst gesloten tussen een landbouwer die op zijn bedrijf voor meer dan de helft dierlijke
      meststoffen, uitgedrukt in kilogrammen fosfaat, van kippen of kalkoenen produceert, en een landbouwer
      die op zijn bedrijf voor meer dan de helft dierlijke meststoffen, uitgedrukt in kilogrammen fosfaat, van
      één of meer andere diersoorten of diercategorieën produceert, geldt niet als overeenkomst als bedoeld in
      [artikel 33a, derde lid, onderdeel c, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel33a
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 33a
  - number: '60'
    text: 'Bij ministeriële regeling kunnen nadere regels worden gesteld inzake:'
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel60
  - number: 60.a
    text: |-
      de gegevens, bedoeld in [artikel 33b, vijfde lid, van de wet][ref1], die moeten worden gemeld;


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel33b
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 33b
  - number: 60.b
    text: |-
      de elektronische melding, bedoeld in [artikel 33b, vijfde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel33b
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 33b
  - number: '61'
    text: |-
      Als huisvestingssysteem als bedoeld in [artikel 33a, tweede lid, onderdeel d, onder 1°, van de wet][ref1] wordt
      aangewezen een huisvestingssysteem waarbij minimaal tweederde van de oppervlakte van de leefruimte van de dieren is
      ingestrooid met stro.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel33a
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 33a
  - number: '65'
    text: |-
      De aantallen dieren en hoeveelheden meststoffen, diervoeders, melk en eieren, de fosfaattoestand van de bodem en de
      gewasopbrengst ter zake waarvan een landbouwer of een ondernemer ingevolge de bij of krachtens dit besluit gestelde
      regels gegevens in zijn administratie moet opnemen of gegevens moet verstrekken worden bepaald overeenkomstig dit
      hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel65
  - number: '66.1'
    text: |-
      De door graasdieren, niet zijnde melkkoeien, in een kalenderjaar op een bedrijf geproduceerde hoeveelheid dierlijke
      meststoffen wordt bepaald op basis van het gemiddelde aantal in het desbetreffende kalenderjaar op het bedrijf
      gehouden of anderszins aanwezige dieren, onderscheiden naar diersoort en diercategorieën per soort, voor zover dit
      onderscheid wordt gemaakt in de krachtens de [artikelen 36][ref1] of [70, derde lid][ref2], gestelde regels en op
      basis van forfaitaire productienormen, uitgedrukt in kilogrammen stikstof en in kilogrammen fosfaat, per dier per
      jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel70
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '36'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0019031
        artikel: '70'
        hoofdstuk: X
  - number: '66.2'
    text: |-
      De door melkkoeien in een kalenderjaar op een bedrijf geproduceerde hoeveelheid dierlijke meststoffen wordt
      bepaald op basis van het gemiddelde aantal in het desbetreffende kalenderjaar op het bedrijf gehouden of anderszins
      aanwezige melkkoeien en op basis van forfaitaire productienormen, uitgedrukt in kilogrammen stikstof en in
      kilogrammen fosfaat, per dier per jaar, onderscheiden naar de gemiddelde melkproductie per op het bedrijf aanwezige
      melkkoe en, voor zover het stikstof betreft, het gemiddelde ureumgehalte van de geproduceerde koemelk.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel66
  - number: '66.3'
    text: |-
      De door staldieren in een kalenderjaar op een bedrijf geproduceerde hoeveelheid dierlijke meststoffen wordt bepaald
      door achtereenvolgens:
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel66
  - number: 66.3.a
    text: 'bij elkaar op te tellen de hoeveelheden stikstof, onderscheidenlijk fosfaat in:'
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel66
  - number: 66.3.a.1°
    text: de in het desbetreffende kalenderjaar op het bedrijf aangevoerde staldieren;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel66
  - number: 66.3.a.2°
    text: |-
      de in het desbetreffende kalenderjaar op het bedrijf aangevoerde of geproduceerde diervoeders bestemd voor de
      staldieren; en
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel66
  - number: 66.3.a.3°
    text: |-
      de aan het eind van het voorgaande kalenderjaar op het bedrijf aanwezige voorraden diervoeders bestemd voor de
      staldieren en door de staldieren geproduceerde eieren alsmede de aanwezige staldieren; en
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel66
  - number: 66.3.b
    text: |-
      de overeenkomstig onderdeel a berekende hoeveelheid te verminderen met de hoeveelheden stikstof, onderscheidenlijk
      fosfaat in:
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel66
  - number: 66.3.b.1°
    text: de in het desbetreffende kalenderjaar van het bedrijf afgevoerde staldieren;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel66
  - number: 66.3.b.2°
    text: |-
      de in het desbetreffende kalenderjaar van het bedrijf afgevoerde diervoeders, voor zover deze diervoeders voor de
      toepassing van dit artikel bij de hoeveelheid, bedoeld in het derde lid, onderdeel a, onder 2°, is betrokken;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel66
  - number: 66.3.b.3°
    text: de in het desbetreffende kalenderjaar van het bedrijf afgevoerde, door de staldieren geproduceerde eieren;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel66
  - number: 66.3.b.4°
    text: |-
      de in het desbetreffende kalenderjaar optredende gasvormige verliezen van stikstof uit de stal en de
      mestopslagruimte; en
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel66
  - number: 66.3.b.5°
    text: |-
      de aan het eind van het desbetreffende kalenderjaar op het bedrijf aanwezige voorraden diervoeders bestemd voor de
      staldieren en door de staldieren geproduceerde eieren alsmede de aanwezige staldieren.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel66
  - number: '67.1'
    text: |-
      De in [artikel 66, derde lid][ref1], bedoelde hoeveelheid stikstof en de hoeveelheid fosfaat in de op een bedrijf
      aan- of afgevoerde, dan wel de op het bedrijf aanwezige voorraden diervoeders worden bepaald op basis van het
      gewicht of het volume en het stikstofgehalte, onderscheidenlijk fosfaatgehalte van de desbetreffende diervoeders.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel66
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '66'
        hoofdstuk: X
  - number: '67.2'
    text: |-
      De in [artikel 66, derde lid][ref1], bedoelde hoeveelheid stikstof en de hoeveelheid fosfaat in de op een bedrijf
      geproduceerde diervoeders worden bepaald op basis van een forfaitaire opbrengst per hectare in kilogrammen en
      forfaitaire stikstofgehalten, onderscheidenlijk fosfaatgehalten per kilogram diervoeder.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel66
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '66'
        hoofdstuk: X
  - number: '67.3'
    text: |-
      De in [artikel 66, derde lid][ref1], bedoelde hoeveelheid stikstof en de hoeveelheid fosfaat in de staldieren
      worden bepaald op basis van forfaitaire stikstofgehalten, onderscheidenlijk fosfaatgehalten per dier, dan wel op
      basis van het gewicht van de dieren en op basis van forfaitaire stikstofgehalten, onderscheidenlijk fosfaatgehalten
      per kilogram levend gewicht.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel66
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '66'
        hoofdstuk: X
  - number: '67.4'
    text: |-
      De in [artikel 66, derde lid][ref1], bedoelde hoeveelheid stikstof en de hoeveelheid fosfaat in door staldieren
      geproduceerde eieren worden bepaald op basis van het gewicht van de eieren en op basis van forfaitaire
      stikstofgehalten, onderscheidenlijk fosfaatgehalten per kilogram product.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel66
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '66'
        hoofdstuk: X
  - number: '67.5'
    text: |-
      De in [artikel 66, derde lid][ref1], bedoelde hoeveelheid stikstof die in gasvorm verloren gaat wordt bepaald op
      basis van het gemiddelde aantal in het desbetreffende kalenderjaar op het bedrijf gehouden of anderszins aanwezige
      dieren en forfaitaire stikstofgehalten per dier.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel66
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '66'
        hoofdstuk: X
  - number: '68.1'
    text: |-
      De op een bedrijf of onderneming in het kader waarvan meststoffen worden verhandeld aangevoerde hoeveelheid
      meststoffen, de van een bedrijf of onderneming afgevoerde hoeveelheid meststoffen en de binnen een onderneming in
      het kader waarvan meststoffen worden verhandeld vervoerde hoeveelheid meststoffen worden bepaald op basis van het
      gewicht of het volume en het stikstofgehalte, onderscheidenlijk fosfaatgehalte van de desbetreffende meststoffen.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel68
  - number: '68.2'
    text: |-
      De in enig kalenderjaar op een bedrijf per saldo uit opslag gekomen hoeveelheid dierlijke meststoffen wordt bepaald
      door de aan het eind van het voorgaande kalenderjaar op het bedrijf opgeslagen hoeveelheid dierlijke meststoffen
      te verminderen met de aan het eind van desbetreffend kalenderjaar op het bedrijf opgeslagen hoeveelheid dierlijke
      meststoffen.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel68
  - number: '68.3'
    text: |-
      De op een bedrijf waar dierlijke meststoffen worden geproduceerd opgeslagen hoeveelheid dierlijke meststoffen wordt
      bepaald op basis van het zo nauwkeurig mogelijk bepaalde gewicht van de dierlijke meststoffen en het zo nauwkeurig
      mogelijk bepaalde stikstofgehalte, onderscheidenlijk fosfaatgehalte van de desbetreffende meststoffen.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel68
  - number: '68.4'
    text: |-
      De op een bedrijf als bedoeld in het derde lid opgeslagen hoeveelheid overige meststoffen wordt bepaald op basis
      van het gewicht of het volume en het stikstofgehalte, onderscheidenlijk fosfaatgehalte van de desbetreffende
      meststoffen.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel68
  - number: '68.5'
    text: |-
      De op een onderneming in het kader waarvan meststoffen worden verhandeld of op een bedrijf waar geen dierlijke
      meststoffen worden geproduceerd opgeslagen hoeveelheid meststoffen wordt bepaald op basis van het gewicht of het
      volume en het stikstofgehalte, onderscheidenlijk fosfaatgehalte van de desbetreffende meststoffen.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel68
  - number: '69.1'
    text: |-
      Het gemiddelde aantal in een kalenderjaar op een bedrijf gehouden varkens, kippen en kalkoenen, onderscheiden
      naar diercategorieën per soort overeenkomstig [bijlage II van de wet][ref1], alsmede runderen, onderscheiden
      naar diercategorie, voor zover dit onderscheid wordt gemaakt in de krachtens de [artikelen 36][ref2] of
      [70, derde lid][ref3], gestelde regels, wordt bepaald door de som van de dagelijkse aanwezige aantallen van deze
      dieren, te delen door het aantal dagen van het desbetreffende kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0019031#Artikel70
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0004054
      - id: ref2
        bwb_id: BWBR0019031
        artikel: '36'
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0019031
        artikel: '70'
        hoofdstuk: X
  - number: '69.2'
    text: |-
      Het gemiddelde aantal in een kalenderjaar voor gebruiks- en winstdoeleinden op het bedrijf gehouden dan wel
      anderszins aanwezige dieren, anders dan runderen, varkens, kippen en kalkoenen, onderscheiden naar diersoorten
      en diercategorieën per soort, voor zover dit onderscheid wordt gemaakt in de krachtens de [artikelen 36][ref1] of
      [70][ref2] gestelde regels, wordt bepaald door de som van de op de eerste dag van iedere maand aanwezige aantallen
      van deze dieren, te delen door twaalf.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel70
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '36'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0019031
        artikel: '70'
        hoofdstuk: X
  - number: '70.1'
    text: 'Bij ministeriële regeling worden vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel70
  - number: 70.1.a
    text: |-
      de forfaitaire productienormen, bedoeld in [artikel 66, eerste en tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel66
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '66'
        hoofdstuk: X
  - number: 70.1.b
    text: |-
      de forfaitaire gewasopbrengsten per hectare, bedoeld in [artikel 67, tweede lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel67
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '67'
        hoofdstuk: X
  - number: 70.1.c
    text: |-
      de forfaitaire stikstofgehalten, onderscheidenlijk fosfaatgehalten, bedoeld in
      [artikel 67, tweede tot en met vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel67
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '67'
        hoofdstuk: X
  - number: '70.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de gevallen waarin, de voorwaarden waaronder en de
      wijze waarop:
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel70
  - number: 70.2.a
    text: |-
      de hoeveelheid stikstof en de hoeveelheid fosfaat van de bij die regeling te onderscheiden diervoeders in zoverre
      in afwijking van [artikel 67, eerste lid][ref1], wordt bepaald op basis van de bij die regeling vast te stellen
      forfaitaire stikstofgehalten, onderscheidenlijk fosfaatgehalten; en


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel67
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '67'
        hoofdstuk: X
  - number: 70.2.b
    text: |-
      de hoeveelheid aangevoerde of afgevoerde dierlijke meststoffen in zoverre in afwijking van [artikel 68][ref1],
      wordt bepaald op basis van de bij die regeling vast te stellen forfaitaire stikstofgehalten onderscheidenlijk
      fosfaatgehalten.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel68
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '68'
        hoofdstuk: X
  - number: '70.3'
    text: |-
      De in het eerste en tweede lid bedoelde forfaits kunnen onderscheiden naar mestvorm, diersoort en diercategorie en
      bedrijfssysteem verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel70
  - number: '70.4'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de vaststellingen ten behoeve van de
      bepaling van de hoeveelheden, bedoeld in de [artikelen 66][ref1], [67][ref2], [68][ref3] en [69][ref4] en ten
      behoeve van de bepaling van de fosfaattoestand van de bodem, bedoeld in [artikel 21a, eerste lid][ref5]. Deze
      regels kunnen betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0019031#Artikel68
      [ref4]: https://wetten.overheid.nl/BWBR0019031#Artikel69
      [ref5]: https://wetten.overheid.nl/BWBR0019031#Artikel21a
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '66'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0019031
        artikel: '67'
        hoofdstuk: X
      - id: ref3
        bwb_id: BWBR0019031
        artikel: '68'
        hoofdstuk: X
      - id: ref4
        bwb_id: BWBR0019031
        artikel: '69'
        hoofdstuk: X
      - id: ref5
        bwb_id: BWBR0019031
        artikel: 21a
        hoofdstuk: IV
  - number: 70.4.a
    text: |-
      de methode van gewichtsbepaling, volumebepaling, bemonstering, analyse en bepaling van het ureumgehalte van
      koemelk;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel70
  - number: 70.4.b
    text: de ten behoeve van de vaststelling te gebruiken apparatuur;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel70
  - number: 70.4.c
    text: |-
      de bevoegdheid tot het doen van de vaststelling, welke bevoegdheid kan worden verbonden aan een door Onze Minister
      overeenkomstig bij die regeling gestelde erkenningsvoorwaarden verleende erkenning;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel70
  - number: 70.4.d
    text: |-
      de plaats, het moment en de frequentie van vaststelling, daaronder begrepen tellingen voor de vaststelling van het
      gemiddelde aantal dieren; en
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel70
  - number: 70.4.e
    text: de verantwoording van de vaststellingen.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel70
  - number: '72.1'
    text: |-
      Op verzoek van een landbouwer met een nieuw gestart bedrijf, verhoogt Onze Minister het fosfaatrecht, bedoeld in
      [artikel 23, derde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel23
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '23'
  - number: '72.2'
    text: 'Een nieuw gestart bedrijf als bedoeld in het eerste lid, is een bedrijf dat aantoonbaar:'
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel72
  - number: 72.2.a
    text: |-
      beschikt over een voor 2 juli 2015 aan de landbouwer verleende omgevingsvergunning voor het oprichten van een
      bedrijf voor het houden van melkvee of over een voor 2 juli 2015 door de landbouwer ingediende melding als bedoeld
      in [artikel 1.10 van het Activiteitenbesluit Milieubeheer][ref1] voor het houden van melkvee;


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '1'
  - number: 72.2.b
    text: onomkeerbare financiële verplichtingen is aangegaan voor 2 juli 2015;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel72
  - number: 72.2.c
    text: tussen 1 januari 2014 en 2 juli 2015 is gestart met de productie van melk bestemd voor consumptie of verwerking;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel72
  - number: 72.2.d
    text: |-
      op 1 januari 2018 minimaal 15 melk- en kalfkoeien hield als bedoeld in
      [artikel 1, eerste lid, onderdeel kk, onder 1°, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel1
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '1'
  - number: 72.2.e
    text: |-
      geen aanspraak maakt op rechten uit hoofde van [artikel 23, vierde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel23
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '23'
  - number: '72.3'
    text: |-
      De verhoging, bedoeld in het eerste lid, is 50 procent van het verschil tussen het aantal kilogrammen fosfaat
      dat uit hoofde van [artikel 23, derde lid, van de wet][ref1] is vastgesteld en het aantal kilogrammen fosfaat dat
      redelijkerwijs in een kalenderjaar met op 2 juli 2015 aanwezige stalcapaciteit voor melkvee geproduceerd had kunnen
      worden.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel23
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '23'
  - number: '72.4'
    text: |-
      De verhoging, bedoeld in het eerste lid, vindt niet plaats indien het verschil, bedoeld in het tweede lid, kleiner
      is dan 10 procent.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel72
  - number: '72.5'
    text: |-
      Het verzoek, bedoeld in het eerste lid, wordt voor 1 april 2018 ingediend met gebruikmaking van een door Onze
      Minister elektronisch beschikbaar gesteld middel.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel72
  - number: '72.6'
    text: |-
      Een bedrijf dat op 2 juli 2015 vrouwelijk jongvee voor de melkveehouderij hield en dat tussen 2 juli 2015 en
      1 januari 2018 is gestart met de productie van melk bestemd voor consumptie of verwerking, wordt in afwijking
      van het tweede lid, onderdeel c, aangemerkt als nieuw gestart bedrijf. In afwijking van het vijfde lid, wordt het
      verzoek door een landbouwer op grond van dit artikellid ingediend voor 15 oktober 2018.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel72
  - number: 72a.1
    text: |-
      Indien op een bedrijf op 2 juli 2015 tijdelijk minder melkvee werd gehouden of over minder fosfaatruimte
      werd beschikt door de realisatie van een natuurgebied of de aanleg of onderhoud van publieke
      infrastructuur, verhoogt Onze Minister op verzoek van de landbouwer het fosfaatrecht dat uit hoofde van
      [artikel 23, derde lid, van de wet][ref1], wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel23
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel72a
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '23'
  - number: 72a.2
    text: |-
      De verhoging, bedoeld in het eerste lid, bedraagt het aantal kilogrammen fosfaat waarvan de landbouwer aannemelijk
      heeft gemaakt dat deze zonder de in het eerste lid omschreven omstandigheden in de vaststelling van het
      fosfaatrecht zouden zijn betrokken.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel72a
  - number: 72a.3
    text: |-
      De verhoging, bedoeld in het eerste lid, vindt niet plaats indien deze kleiner is dan 5 procent van het
      fosfaatrecht dat wordt vastgesteld uit hoofde van [artikel 23, derde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel23
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel72a
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '23'
  - number: 72a.4
    text: |-
      Het verzoek, bedoeld in het eerste lid, wordt voor 1 april 2018 ingediend met gebruikmaking van een door Onze
      Minister elektronisch beschikbaar gesteld middel.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel72a
  - number: 72b.1
    text: |-
      Het fosfaatrecht, bedoeld in [artikel 23, derde en zesde lid][ref1], en de verhoging van het fosfaatrecht, bedoeld
      in artikel 23, vierde en negende lid, van de wet, wordt verminderd met 8,3 procent.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel23
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel72b
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '23'
  - number: 72b.2
    text: |-
      Het eerste lid is niet van toepassing op een bedrijf waarvan de productie van dierlijke meststoffen door melkvee
      in kilogrammen fosfaat in het kalenderjaar 2015, verminderd met de fosfaatruimte in dat kalenderjaar, negatief of
      nul is.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel72b
  - number: 72b.3
    text: |-
      Bij de toepassing van het percentage, bedoeld in het eerste lid, wordt, het fosfaatrecht slechts verminderd voor
      zover een gehele uitoefening van het fosfaatrecht de fosfaatruimte in het kalenderjaar 2015 van dat bedrijf te
      boven gaat.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel72b
  - number: 72c
    text: |-
      In geval van overtreding van [artikel 51, eerste lid][ref1], bedraagt de bestuurlijke boete voor de vervoerder
      € 1.500.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel51
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel72c
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '51'
        hoofdstuk: IX
        paragraaf: '1'
  - number: '73.1'
    text: |-
      De hoogte van de op grond van [artikel 62, tweede lid, van de wet][ref1] te bepalen bestuurlijke boete bedraagt
      voor de volgende categorieën:


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel62
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '62'
  - number: 73.1.a
    text: 'niet op de voorgeschreven wijze administreren, registreren, melden of invullen van gegevens: € 50;'
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel73
  - number: 73.1.b
    text: 'niet tijdig administreren, registreren, melden of indienen: € 100;'
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel73
  - number: 73.1.c
    text: 'niet volledig administreren, registreren, melden of invullen of niet ondertekenen: € 200;'
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel73
  - number: 73.1.d
    text: 'niet naar waarheid administreren, registreren, melden of invullen: € 300;'
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel73
  - number: 73.1.e
    text: 'niet administreren, registreren, melden, indienen of aanwezig hebben: € 300.'
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel73
  - number: '73.2'
    text: |-
      Bij ministeriële regeling wordt per overtreding de hoogte van de bestuurlijke boete aangewezen overeenkomstig het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel73
  - number: 73a.1
    text: |-
      Het Uitvoeringsbesluit Meststoffenwet, zoals dit zal luiden na volledige inwerkingtreding van het Besluit van
      8 april 2021, houdende wijziging van het Uitvoeringsbesluit Meststoffenwet in verband met het stellen van regels
      over digitale verantwoording van het vervoer van dierlijke meststoffen (Stb. 2021, 192) zoals gewijzigd bij Besluit
      van 7 juli 2022, houdende wijziging van het Besluit van 8 april 2021, houdende wijziging van het Uitvoeringsbesluit
      Meststoffenwet in verband met het stellen van regels over digitale verantwoording van het vervoer van
      dierlijke meststoffen (Stb. 2021, 192) in verband met enkele aanpassingen ten aanzien van de startmelding en
      de noodvoorziening (Stb. 2022, 297), kan voorafgaand aan die volledige inwerkingtreding van toepassing zijn op
      een leverancier, vervoerder of afnemer van dierlijke meststoffen, indien hij zich met het oog op vroegtijdige
      toepassing van de regels van het rVDM-systeem eenmalig bij de minister heeft gemeld.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel73a
  - number: 73a.2
    text: |-
      Na de melding, bedoeld in het eerste lid, maken de vervoerder, leverancier en afnemer per vracht dierlijke
      meststoffen een keuze of zij de huidige regels voor de verantwoording van het vervoer van dierlijke meststoffen
      toepassen dan wel volgens het Uitvoeringsbesluit Meststoffenwet, zoals dit zal luiden na volledige inwerkingtreding
      van het Besluit van 8 april 2021, houdende wijziging van het Uitvoeringsbesluit Meststoffenwet in verband met het
      stellen van regels over digitale verantwoording van het vervoer van dierlijke meststoffen (Stb. 2021, 192) zoals
      gewijzigd bij Besluit van 7 juli 2022, houdende wijziging van het Besluit van 8 april 2021, houdende wijziging
      van het Uitvoeringsbesluit Meststoffenwet in verband met het stellen van regels over digitale verantwoording
      van het vervoer van dierlijke meststoffen (Stb. 2021, 192) in verband met enkele aanpassingen ten aanzien van de
      startmelding en de noodvoorziening (Stb. 2022, 297).
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel73a
  - number: 73a.3
    text: |-
      Bij de melding, bedoeld in het eerste lid, verklaren de betrokken leverancier, vervoerder en afnemer zich met het
      oog op het vervoer van dierlijke meststoffen gebonden aan de nieuwe regels indien zij voor de betreffende vracht
      kiezen om het rVDM-systeem toe te passen.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel73a
  - number: 73a.4
    text: |-
      De keuze van de vervoerder, leverancier en afnemer voor toepassing van het rVDM-systeem, bedoeld in het tweede lid,
      blijkt uit het doen van de mededeling, bedoeld in [artikel 50, eerste lid][ref1], zoals dit zal luiden na volledige
      inwerkingtreding van het Besluit van 8 april 2021, houdende wijziging van het Uitvoeringsbesluit Meststoffenwet
      in verband met het stellen van regels over digitale verantwoording van het vervoer van dierlijke meststoffen
      (Stb. 2021, 192) zoals gewijzigd bij Besluit van 7 juli 2022, houdende wijziging van het Besluit van 8 april 2021,
      houdende wijziging van het Uitvoeringsbesluit Meststoffenwet in verband met het stellen van regels over digitale
      verantwoording van het vervoer van dierlijke meststoffen (Stb. 2021, 192) in verband met enkele aanpassingen ten
      aanzien van de startmelding en de noodvoorziening (Stb. 2022, 297).


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel50
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel73a
    references:
