        bwb_id: BWBR0019031
        artikel: '50'
        hoofdstuk: IX
        paragraaf: '1'
  - number: 73a.5
    text: 'Bij ministeriële regeling worden regels dan wel nadere regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel73a
  - number: 73a.5.a
    text: de melding, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel73a
  - number: 73a.5.b
    text: de voorwaarden voor het doen van de melding, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel73a
  - number: 73a.5.c
    text: |-
      het aanwijzen van gevallen waarvoor betrokken vervoerders, leveranciers en afnemers de nieuwe regels van het rVDM-
      systeem, per vracht dierlijke meststoffen, niet kunnen toepassen waarbij in elk geval gedifferentieerd kan worden
      op mestsoort, bijzondere situatie en vervoersstroom;
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel73a
  - number: 73a.5.d
    text: |-
      het bepalen van het ingangstijdstip alsmede de voorwaarden waaronder de nieuwe regels van toepassing zullen zijn op
      degenen die zich voor toepassing van het rVDM-systeem hebben gemeld.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel73a
  - number: 73a.6
    text: |-
      In uitzonderlijke omstandigheden kan Onze minister besluiten dat voor degenen die zich hebben aangemeld voor
      de vroegtijdige toepassing van het rVDM-systeem, bedoeld in het eerste lid, met ingang van een door hem bepaald
      tijdstip en voor een door hem bepaalde duur niettemin uitsluitend de bestaande regels voor de verantwoording van
      het vervoer van dierlijke meststoffen van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0019031/2025-12-09#Artikel73a
  - number: '74.1'
    text: |-
      Het percentage, bedoeld in [artikel 32, eerste lid, van de wet][ref1], waartoe de vergroting van het varkensrecht
      wordt beperkt, bedraagt 100 procent.


