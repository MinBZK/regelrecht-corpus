  - number: 4.3.a
    text: |-
      EG-meststoffen, voor zover ten aanzien van deze meststoffen is voldaan aan de ter uitvoering van de
      meststoffenverordening krachtens [40, tweede lid, van de Meststoffenwet][ref1], gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel40
