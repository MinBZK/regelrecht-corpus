$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: uitvoeringsbesluit_meststoffenwet
regulatory_layer: AMVB
publication_date: '2017-04-18'
valid_from: '2011-06-18'
bwb_id: BWBR0019031
url: https://wetten.overheid.nl/BWBR0019031/2011-06-18
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuur en Voedselkwaliteit van 5 juli 2005, nr. TRCJZ/2005/848,
    Directie Juridische Zaken, gedaan mede namens de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en
    Milieubeheer;

    Gelet op richtlijn nr. 91/676/EEG van de Raad van de Europese Gemeenschappen van 12 december 1991 inzake de
    bescherming van water tegen verontreiniging door nitraat uit agrarische bronnen (PbEG L 375) en verordening (EEG)
    nr. 259/93 van de Raad van de Europese Gemeenschappen van 1 februari 1993 betreffende toezicht en controle op de
    overbrenging van afvalstoffen binnen, naar en uit de Europese Gemeenschap (PbEG L 30);

    Gelet op de artikelen 1, vierde lid, 1a, eerste lid, 6, eerste en tweede lid, 6a, 59, 59a, 59b, 59c, 61 en 61a van
    de Meststoffenwet en gelet op artikel 23 van de Destructiewet;

    De Raad van State gehoord (advies van 21 oktober 2005, no. W11.05.0329/V);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuur en Voedselkwaliteit, uitgebracht mede namens
    de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 27 oktober 2005, nr.
    TRCJZ/2005/3179, Directie Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel1
  - number: 1.1.a
    text: |-
      wet: [Meststoffenwet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: 1.1.b
    text: |-
      perceel: aaneengesloten, door wegen, waterwegen, sloten, houtopstanden, muren, wallen of anderszins topografisch
      begrensde oppervlakte grond, dan wel het gedeelte daarvan behorend tot één bedrijf;
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel1
  - number: 1.1.c
    text: |-
      produceren van dierlijke meststoffen: produceren van dierlijke meststoffen door het op een bedrijf houden of
      anderszins aanwezig hebben van dieren;
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel1
  - number: 1.1.d
    text: |-
      landbouwer: natuurlijke persoon of rechtspersoon die, of samenwerkingsverband van natuurlijke personen of
      rechtspersonen dat enige vorm van landbouw uitoefent op een bedrijf;
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel1
  - number: 1.1.e
    text: |-
      graasdieren: runderen, uitgezonderd andere vleeskalveren dan rosékalveren, schapen, geiten, paarden, ezels, Midden-
      Europese edelherten, damherten en waterbuffels;
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel1
  - number: 1.1.f
    text: 'staldieren: andere dieren dan graasdieren;'
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel1
  - number: 1.1.g
    text: 'zuiveringsslib:'
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel1
  - number: 1.1.g.1°
    text: |-
      slib, dat afkomstig is van een installatie voor de zuivering van huishoudelijk, stedelijk of industrieel afvalwater
      dan wel ander afvalwater van soortgelijke samenstelling als huishoudelijk, stedelijk en industrieel afvalwater; of
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel1
  - number: 1.1.g.2°
    text: |-
      slib, dat afkomstig is van septictanks en andere installaties voor de verzameling, afvoer en behandeling van
      afvalwater met uitzondering van vet- en zandvangers;
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel1
  - number: 1.1.h
    text: |-
      compost: product dat bestaat uit één of meer organische afvalstoffen die al dan niet met bodembestanddelen zijn
      gemengd en die met behulp van micro-organismen zijn afgebroken en omgezet tot een homogeen en zodanig stabiel
      eindproduct dat daarin alleen nog een langzame afbraak van humeuze verbindingen plaatsvindt en dat niet mede
      bestaat uit dierlijke meststoffen;
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel1
  - number: 1.1.i
    text: |-
      meststoffenverordening: verordening (EG) nr. 2003/2003 van het Europees Parlement en de Raad van 13 oktober 2003
      inzake meststoffen (PbEU L 304);
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel1
  - number: 1.1.j
    text: |-
      anorganische meststoffen: meststoffen waarin de aangegeven nutriënten voorkomen in de vorm van mineralen die door
      winning of door fysische of chemische industriële processen zijn verkregen, alsmede calciumcyaanamide, ureum en de
      condensatie- en associatieproducten ervan en meststoffen die chelaatvormige of complexvormige micronutriënten als
      bedoeld in de meststoffenverordening bevatten;
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel1
  - number: 1.1.k
    text: |-
      EG-meststoffen: als «EG-meststof» aangeduide meststoffen die tot een in bijlage I van de meststoffenverordening
      vermeld type meststoffen behoren en die aan de bij of krachtens die verordening gestelde voorschriften voldoen;
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel1
  - number: 1.1.l
    text: 'overige anorganische meststoffen: anorganische meststoffen niet zijnde EG-meststoffen;'
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel1
  - number: 1.1.m
    text: 'organische meststoffen: meststoffen niet zijnde anorganische meststoffen;'
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel1
  - number: 1.1.n
    text: |-
      overige organische meststoffen: organische meststoffen niet zijnde dierlijke meststoffen, zuiveringsslib of
      compost;
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel1
  - number: 1.1.o
    text: |-
      kalkmeststoffen: organische of anorganische meststoffen die hoofdzakelijk zijn bedoeld om zuurgraad in de bodem in
      stand te houden of te verlagen;
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel1
  - number: 1.1.p
    text: |-
      afvalstoffen: afvalstoffen als bedoeld in [artikel 1.1 van de Wet milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 1.1.q
    text: |-
      intermediaire onderneming: onderneming, niet zijnde een bedrijf, in het kader waarvan al dan niet uitsluitend
      dierlijke meststoffen worden verhandeld of worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel1
  - number: 1.1.r
    text: |-
      ondernemer: natuurlijke persoon of rechtspersoon die, of samenwerkingsverband van natuurlijke personen of
      rechtspersonen dat een onderneming voert;
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel1
  - number: 1.1.s
    text: 'intermediair: ondernemer die een intermediaire onderneming voert;'
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel1
  - number: 1.1.t
    text: |-
      diervoeders: diervoeders als bedoeld in [artikel 1, eerste lid, onderdeel b, van de Kaderwet diervoeders][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015764#Artikel1
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0015764
        artikel: '1'
  - number: 1.1.u
    text: |-
      vervoeren van meststoffen: elk feitelijk transporteren van meststoffen, het laden en lossen van deze meststoffen
      inbegrepen, met uitzondering van het feitelijk transporteren binnen een bedrijf;
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel1
  - number: 1.1.v
    text: |-
      vracht meststoffen: hoeveelheid meststoffen die als eenheid in een afzonderlijk transportmiddel al dan niet met
      aanhanger wordt vervoerd;
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel1
  - number: 1.1.w
    text: |-
      leverancier van meststoffen: landbouwer of ondernemer die meststoffen feitelijk overdraagt met het oogmerk de
      meststoffen buiten zijn bedrijf of onderneming te brengen;
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel1
  - number: 1.1.x
    text: 'afnemer van meststoffen: degene die meststoffen feitelijk krijgt overgedragen;'
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel1
  - number: 1.1.y
    text: 'drijfmest: dierlijke meststoffen die verpompbaar zijn;'
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel1
  - number: 1.1.z
    text: |-
      apparatuur voor automatische gegevensregistratie: apparatuur waarmee de gegevens met betrekking tot een vracht
      meststoffen automatisch worden vastgelegd;
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel1
  - number: 1.1.aa
    text: |-
      satellietvolgapparatuur: apparatuur die met behulp van de door satellieten uitgezonden signalen automatisch de
      positie van een transportmiddel bepaalt;
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel1
  - number: 1.1.bb
    text: |-
      opslagruimte voor meststoffen: ruimte die in het kader van een bedrijf of een intermediaire onderneming wordt
      gebruikt of bestemd is om te worden gebruikt voor de opslag van meststoffen.
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel1
  - number: '1.2'
    text: |-
      Onder primaire nutriënten, secundaire nutriënten, micronutriënten, vloeibare meststof en fabrikant wordt verstaan
      hetgeen daaronder in de meststoffenverordening wordt verstaan.
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel1
  - number: 1a
    text: |-
      Dit besluit berust mede op [artikel 12.29, aanhef en onder e en f, van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel12
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '12'
  - number: '2'
    text: |-
      Voor de toepassing van dit besluit, met uitzondering van [hoofdstuk V][ref1], worden de hoeveelheden meststoffen
      uitgedrukt in kilogrammen of liters alsmede in kilogrammen stikstof en kilogrammen fosfaat.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0019031
        hoofdstuk: V
  - number: '3'
    text: |-
      Als de kaarten, bedoeld in [artikel 1, vierde lid, van de wet][ref1], worden vastgesteld de kaarten die zijn
      opgenomen als bijlage I bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel1
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel3
