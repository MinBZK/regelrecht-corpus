      dieren en mengsels van strooisel met de uitwerpselen, alsook producten daarvan voor zover aan de uitwerpselen of
      de producten daarvan geen andere meststoffen zijn toegevoegd dan meststoffen die aan de in het tweede lid bedoelde
      regels voldoen of voor zover de producten daarvan eindproducten zijn die krachtens [artikel 5, tweede lid][ref1],
      zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel5
    url: https://wetten.overheid.nl/BWBR0019031/2011-06-18#Artikel4
