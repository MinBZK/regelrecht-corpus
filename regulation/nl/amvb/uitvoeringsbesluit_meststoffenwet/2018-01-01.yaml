  - number: '73.2'
    text: |-
      Bij ministeriële regeling wordt per overtreding de hoogte van de bestuurlijke boete aangewezen overeenkomstig het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel73
  - number: '78'
    text: Dit besluit treedt in werking met ingang van 1 januari 2006.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel78
  - number: 78a
    text: |-
