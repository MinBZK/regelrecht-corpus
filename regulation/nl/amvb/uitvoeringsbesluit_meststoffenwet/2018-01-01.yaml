  - number: '4.4'
    text: Het is verboden meststoffen, niet zijnde EG-meststoffen, met de aanduiding «EG-meststof» te verhandelen.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel4
  - number: '5.1'
    text: |-
      Meststoffen, met uitzondering van zuiveringsslib, compost en herwonnen fosfaten, zijn niet geheel of gedeeltelijk
      geproduceerd uit afvalstoffen of uit reststoffen, tenzij het betreft de krachtens het tweede lid aangewezen
      stoffen.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel5
  - number: '5.2'
    text: |-
      Bij ministeriële regeling kunnen afvalstoffen of reststoffen, categorieën afvalstoffen of reststoffen of
      eindproducten van bij die regeling omschreven bewerkingsprocédés worden aangewezen, indien er naar het oordeel
      van Onze Minister geen landbouwkundige en milieukundige bezwaren bestaan dat deze stoffen als meststof worden
      verhandeld of bij de productie van meststoffen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel5
  - number: '5.3'
    text: |-
      Meststoffen zijn niet met afvalstoffen of reststoffen gemengd, tenzij het betreft de krachtens het tweede lid,
      aangewezen stoffen.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel5
  - number: '6.1'
    text: De meststof verkeert in een voor de praktijk bruikbare toestand en is gelijkmatig van samenstelling.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel6
  - number: '6.2'
    text: |-
      De meststof levert voedsel voor planten of delen van planten in de vorm van primaire of secundaire nutriënten of
      micronutriënten of verbetert de bodemeigenschappen door het leveren van organische stof dan wel door het in stand
      houden of het verlagen van de zuurgraad in de bodem en oefent de werking waarvoor de stof hoofdzakelijk is bedoeld,
      doeltreffend uit.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel6
  - number: '6.3'
    text: |-
      De meststof heeft onder normale gebruiksomstandigheden geen schadelijke gevolgen voor de gezondheid van mens, dier
      of plant of voor het milieu.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel6
  - number: '7'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de toelaatbaarheid van het onderling mengen van
      meststoffen.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel7
  - number: '8'
    text: |-
      Ten aanzien van overige anorganische meststoffen op basis van ammoniumnitraat die meer dan 28 gewichtsprocenten
      stikstof in verhouding tot het ammoniumnitraat bevatten, is voldaan aan Titel II, Hoofdstuk IV, van de
      meststoffenverordening.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel8
  - number: '9.1'
    text: |-
      Overige anorganische meststoffen die hoofdzakelijk zijn bedoeld om primaire nutriënten te leveren, bevatten ten
      minste één van de volgende nutriënten, in de daarbij vermelde minimale hoeveelheid, uitgedrukt in gewichtsprocenten
      van de droge stof:
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel9
  - number: 9.1.a
    text: 'meststof, bedoeld voor het leveren van stikstof: – stikstof (N) totaal: 5;'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel9
  - number: 9.1.b
    text: 'meststof, bedoeld voor het leveren van fosfaat: – fosfaat (PO) totaal: 5;'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel9
  - number: 9.1.c
    text: 'meststof, bedoeld voor het leveren van kali: – kali (KO) oplosbaar in water: 5.'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel9
  - number: '9.2'
    text: |-
      Overige anorganische meststoffen die hoofdzakelijk zijn bedoeld om secundaire nutriënten of micronutriënten
      te leveren, bevatten ten minste één van de bij ministeriële regeling aangewezen secundaire nutriënten of
      micronutriënten, in de bij deze regeling vastgestelde minimale hoeveelheid.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel9
  - number: '10'
    text: Kalkmeststoffen hebben een neutraliserende waarde van ten minste 25 op basis van de droge stof.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel10
  - number: '11'
    text: |-
      Overige organische meststoffen die hoofdzakelijk zijn bedoeld om organische stof te leveren, bevatten ten minste
      twintig gewichtsprocenten organische stof van de droge stof.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel11
  - number: '12.1'
    text: |-
      Vaste overige organische meststoffen die hoofdzakelijk zijn bedoeld om primaire nutriënten te leveren,
      bevatten ten minste één van de volgende nutriënten, in de daarbij vermelde minimale hoeveelheid, uitgedrukt in
      gewichtsprocenten:
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel12
  - number: 12.1.a
    text: 'meststof, bedoeld voor het leveren van stikstof: – stikstof (N) totaal: 0,5;'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel12
  - number: 12.1.b
    text: 'meststof, bedoeld voor het leveren van fosfaat: – fosfaat (PO) totaal: 0,5;'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel12
  - number: 12.1.c
    text: 'meststof, bedoeld voor het leveren van kali: – kali (KO) oplosbaar in water: 0,5.'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel12
  - number: '12.2'
    text: |-
      Vloeibare overige organische meststoffen die hoofdzakelijk zijn bedoeld om primaire nutriënten te leveren,
      bevatten ten minste één van de volgende nutriënten, in de daarbij vermelde minimale hoeveelheid, uitgedrukt in
      gewichtsprocenten van de droge stof:
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel12
  - number: 12.2.a
    text: 'meststof, bedoeld voor het leveren van stikstof: – stikstof (N) totaal: 0,5;'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel12
  - number: 12.2.b
    text: 'meststof, bedoeld voor het leveren van fosfaat: – fosfaat (PO) totaal: 0,5;'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel12
  - number: 12.2.c
    text: 'meststof, bedoeld voor het leveren van kali: – kali (KO) oplosbaar in water: 0,5.'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel12
  - number: '12.3'
    text: |-
      In overige organische meststoffen die tenminste 0,5 gewichtsprocenten stikstof bevatten, is de hoeveelheid
      organisch gebonden stikstof ten minste 85 procent van de totale hoeveelheid stikstof.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel12
  - number: '13'
    text: |-
      Overige organische meststoffen bevatten geen biologisch afbreekbare delen met een diameter groter dan 50 millimeter
      en niet meer dan 0,5 gewichtsprocent aan bodemvreemde niet-biologisch afbreekbare delen.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel13
  - number: '14.1'
    text: |-
      Overige anorganische meststoffen die hoofdzakelijk zijn bedoeld om primaire nutriënten te leveren, overige
      organische meststoffen, kalkmeststoffen, alsmede de krachtens [artikel 5, tweede lid][ref1], aangewezen
      stoffen die als meststof of bij de productie van meststoffen worden gebruikt, overschrijden niet de in
      [bijlage II, onder tabel 1][ref2], bij dit besluit opgenomen maximale waarden voor zware metalen, uitgedrukt in
      milligrammen per kilogram van het desbetreffende waardegevende bestanddeel.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0019031
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '5'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019031
  - number: '14.2'
    text: |-
      Overige anorganische meststoffen die hoofdzakelijk zijn bedoeld om secundaire nutriënten of micronutriënten
      te leveren overschrijden niet de bij ministeriële regeling vastgestelde maximale waarden voor zware metalen,
      uitgedrukt in milligrammen per kilogram van het desbetreffende waardegevende bestanddeel.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel14
  - number: '15.1'
    text: |-
      Overige organische meststoffen alsmede de krachtens [artikel 5, tweede lid][ref1], aangewezen
      stoffen die als meststof of bij de productie van meststoffen worden gebruikt, overschrijden niet
      de in [bijlage II, onder tabel 4][ref2], bij dit besluit opgenomen maximale waarden voor organische
      microverontreinigingen, uitgedrukt in milligrammen per kilogram van het desbetreffende waardegevende bestanddeel.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0019031
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '5'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019031
  - number: '15.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op kalkmeststoffen en overige anorganische meststoffen die
      organisch materiaal van dierlijke of plantaardige oorsprong bevatten, met dien verstande dat voor zover het betreft
      overige anorganische meststoffen die hoofdzakelijk zijn bedoeld om secundaire nutriënten of micronutriënten te
      leveren, de maximale waarden voor organische microverontreinigingen uitgedrukt in milligrammen per kilogram van het
      desbetreffende waardegevende bestanddeel, worden vastgesteld bij ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel15
  - number: '16.1'
    text: |-
      Zuiveringsslib is behandeld langs biologische, chemische of thermische weg, door langdurige opslag of volgens enig
      ander geschikt procédé, dat tot gevolg heeft dat het grootste deel van de in het zuiveringsslib aanwezige pathogene
      organismen afsterft.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel16
  - number: '16.2'
    text: |-
      Zuiveringsslib bevat ten minste vijftig gewichtsprocenten organische stof van de droge stof of heeft een
      neutraliserende waarde van 25 op basis van de droge stof.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel16
  - number: '16.3'
    text: |-
      Zuiveringsslib overschrijdt niet de in [bijlage II, onder tabel 2][ref1], bij dit besluit opgenomen maximale
      waarden voor zware metalen, uitgedrukt in milligrammen per kilogram droge stof.


      [ref1]: https://wetten.overheid.nl/BWBR0019031
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0019031
  - number: '17.1'
    text: |-
      Compost bevat geen biologisch afbreekbare delen met een diameter groter dan 50 millimeter en niet meer dan 0,5
      gewichtsprocent aan bodemvreemde niet-biologisch afbreekbare delen.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel17
  - number: '17.2'
    text: Compost bevat ten minste tien gewichtsprocenten organische stof van de droge stof.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel17
  - number: '17.3'
    text: |-
      Het is uitsluitend toegestaan om bij de bereiding van compost bodembestanddelen te gebruiken, indien dit
      betreft grond als bedoeld in [artikel 1 van het Besluit bodemkwaliteit][ref1], waarvan de kwaliteit de krachtens
      [artikel 40 van dat besluit][ref2], vastgestelde achtergrondwaarden niet overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel40
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '40'
  - number: '17.4'
    text: |-
      Compost overschrijdt niet de in [bijlage II, onder tabel 3][ref1], bij dit besluit opgenomen maximale waarden voor
      zware metalen, uitgedrukt in milligrammen per kilogram droge stof.


      [ref1]: https://wetten.overheid.nl/BWBR0019031
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0019031
  - number: 17a.1
    text: |-
      Herwonnen fosfaten overschrijden niet de in [bijlage II][ref1], in tabel 1, opgenomen maximale waarden voor zware
      metalen, uitgedrukt in milligrammen per kilogram van het desbetreffende waardegevende bestanddeel.


      [ref1]: https://wetten.overheid.nl/BWBR0019031
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0019031
  - number: 17a.2
    text: |-
      Herwonnen fosfaten overschrijden niet de in [bijlage II][ref1], in tabel 4, opgenomen maximale waarden voor
      organische microverontreinigingen, uitgedrukt in milligrammen per kilogram van het desbetreffende waardegevende
      bestanddeel.


      [ref1]: https://wetten.overheid.nl/BWBR0019031
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0019031
  - number: 17a.3
    text: |-
      Bij ministeriële regeling kan worden bepaald dat herwonnen fosfaten uit rioolzuiveringsslib behandeld worden
      volgens een procedé dat tot gevolg heeft dat het grootste deel van de in het rioolzuiveringsslib aanwezige
      pathogene organismen afsterft, met het oog op het minimaliseren van de risico’s voor de volksgezondheid en het
      milieu.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel17a
  - number: '18.1'
    text: |-
      Overige anorganische meststoffen die hoofdzakelijk zijn bedoeld om micronutriënten te leveren en overige
      anorganische meststoffen op basis van ammoniumnitraat die meer dan 28 gewichtsprocenten stikstof in verhouding tot
      het ammoniumnitraat bevatten, zijn verpakt.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel18
  - number: '18.2'
    text: |-
      De verpakking van de in het eerste lid bedoelde meststoffen wordt op zodanige wijze of met een zodanig systeem
      gesloten dat door het openen ervan de sluiting, het sluitzegel of de verpakking zelf onherstelbaar wordt
      beschadigd.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel18
  - number: '19.1'
    text: 'Meststoffen zijn in ieder geval voorzien van gegevens over:'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel19
  - number: 19.1.a
    text: de naam of de handelsnaam van de fabrikant van de meststoffen;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel19
  - number: 19.1.b
    text: de naam of de handelsnaam van de meststoffen;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel19
  - number: 19.1.c
    text: de werking die de meststof in hoofdzaak uitoefent;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel19
  - number: 19.1.d
    text: de gehalten stikstof en fosfaat;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel19
  - number: 19.1.e
    text: de aanwezige waardegevende bestanddelen;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel19
  - number: 19.1.f
    text: de hoeveelheid; en
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel19
  - number: 19.1.g
    text: de samenstelling.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel19
  - number: '19.2'
    text: |-
      Bij verpakte meststoffen zijn de gegevens op de verpakking of op een daaraan gehecht etiket vermeld en bij niet
      verpakte meststoffen zijn de gegevens op een begeleidend document vermeld.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel19
  - number: '19.3'
    text: De gegevens zijn onuitwisbaar en duidelijk leesbaar.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel19
  - number: '19.4'
    text: |-
      Vloeibare anorganische meststoffen zijn voorzien van aanvullende instructies betreffende de opslagtemperatuur en de
      bij de opslag in acht te nemen veiligheidsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel19
  - number: '19.5'
    text: |-
      De vermeldingen op de etiketten, op de verpakking en op het begeleidende documenten zijn in ieder geval in de
      Nederlandse taal gesteld.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel19
  - number: '19.6'
    text: Bij ministeriële regeling kan worden bepaald dat meststoffen zijn voorzien van een gebruiksaanwijzing.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel19
  - number: '20'
    text: |-
      [Artikel 4, eerste lid][ref1], is niet van toepassing op meststoffen:


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel4
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '4'
        hoofdstuk: III
        paragraaf: '1'
  - number: 20.a
    text: |-
      die rechtmatig zijn vervaardigd of in de handel zijn gebracht in een andere lidstaat van de Europese Unie of in
      een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe strekkend of mede daartoe
      strekkend Verdrag dat Nederland bindt;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel20
  - number: 20.b
    text: |-
      die voldoen aan eisen die een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het niveau dat met de
      bij of krachtens de [artikelen 5 tot en met 19][ref1] gestelde regels wordt nagestreefd; en


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel5
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '5'
        hoofdstuk: III
        paragraaf: '1'
  - number: 20.c
    text: |-
      die vergezeld gaan van een analyserapport dat voldoende informatie verschaft over de samenstelling van het product
      en is afgegeven door een in die lidstaat of staat erkend laboratorium dat gelijkwaardig is aan een in Nederland
      voor dit doel erkend laboratorium.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel20
  - number: '21.1'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel21
  - number: 21.1.a
    text: de eisen waaraan afvalstoffen of reststoffen van organische, dierlijke of plantaardige oorsprong moeten voldoen;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel21
  - number: 21.1.b
    text: |-
      de eisen waaraan het bewerkingsprocédé van zuiveringsslib, van herwonnen fosfaten en van overige afvalstoffen of
      reststoffen van organische, dierlijke of plantaardige oorsprong moet voldoen, welke eisen mede betrekking kunnen
      hebben op de te bewerken stoffen;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel21
  - number: 21.1.c
    text: de homogeniteit, de stabiliteit of de gelijkmatigheid van de samenstelling van de meststoffen;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel21
  - number: 21.1.d
    text: |-
      de wijze waarop de hoeveelheden nutriënten, organische stof, zware metalen en organische microverontreinigingen in
      meststoffen, alsmede de verdere samenstelling van meststoffen worden bepaald;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel21
  - number: 21.1.e
    text: de gebruiksaanwijzing van de meststoffen;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel21
  - number: 21.1.f
    text: de overige gegevens waarvan meststoffen zijn voorzien;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel21
  - number: 21.1.g
    text: de wijze waarop de gegevens worden aangebracht; en
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel21
  - number: 21.1.h
    text: |-
      de gevallen waarin en de voorwaarden waaronder de [artikelen 11][ref1], [14][ref2] en [15][ref3] geheel of
      gedeeltelijk niet van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0019031#Artikel15
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '11'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019031
        artikel: '14'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0019031
        artikel: '15'
        hoofdstuk: III
        paragraaf: '3'
  - number: '21.2'
    text: |-
      De in het eerste lid, onderdeel d, bedoelde regels kunnen mede betrekking hebben op de bevoegdheid tot het doen van
      vaststellingen ten behoeve van de in dat onderdeel bedoelde bepaling en op de voor die vaststellingen te gebruiken
      apparatuur.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel21
  - number: '21.3'
    text: |-
      De krachtens het eerste lid te stellen regels kunnen voor de in de regeling te onderscheiden categorieën
      meststoffen en de beoogde bestemming van de meststoffen verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel21
  - number: 21a
    text: |-
      De fosfaatgebruiksnormen voor meststoffen, bedoeld in [artikel 8, onderdeel c, van de wet][ref1], zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel8
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '8'
  - number: 21a.a
    text: |-
      vanaf 1 januari 2015 90 kilogram fosfaat per jaar per hectare grasland van de tot het bedrijf behorende oppervlakte
      landbouwgrond voor zover het grond met een neutrale fosfaattoestand betreft;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel21a
  - number: 21a.b
    text: |-
      vanaf 1 januari 2015 60 kilogram fosfaat per jaar per hectare bouwland van de tot het bedrijf behorende oppervlakte
      landbouwgrond voor zover het grond met een neutrale fosfaattoestand betreft;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel21a
  - number: 21a.c
    text: |-
      vanaf 1 januari 2015 80 kilogram fosfaat per jaar per hectare grasland van de tot het bedrijf behorende oppervlakte
      landbouwgrond voor zover het grond met een hoge fosfaattoestand betreft;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel21a
  - number: 21a.d
    text: |-
      vanaf 1 januari 2015 50 kilogram fosfaat per jaar per hectare bouwland van de tot het bedrijf behorende oppervlakte
      landbouwgrond voor zover het grond met een hoge fosfaattoestand betreft.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel21a
  - number: 21aa.1
    text: |-
      De fosfaatgebruiksnorm voor meststoffen, bedoeld in [artikel 21a, onderdeel b][ref1], wordt vermeerderd met de in
      [bijlage III, tabel 1][ref2], opgenomen tabel vermelde hoeveelheid fosfaat per hectare bouwland per jaar van de
      tot het bedrijf behorende oppervlakte landbouwgrond indien een bedrijf de in de tabel gemiddelde gewasopbrengst
      heeft van het totale areaal van een gewas als bedoeld in de tabel, gemeten over de drie aan het desbetreffende jaar
      voorafgaande jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel21a
      [ref2]: https://wetten.overheid.nl/BWBR0019031
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel21aa
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: 21a
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0019031
  - number: 21aa.2
    text: 'De landbouwer die gebruik maakt van de verhoging van de fosfaatgebruiksnorm, bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel21aa
  - number: 21aa.2.a
    text: |-
      heeft, voor zover het suikerbieten, de in [bijlage III, tabel 2][ref1], genoemde consumptieaardappelrassen,
      wintertarwe of zomergerst betreft, de afnemers, bedoeld in het derde lid, gemachtigd om desgevraagd gegevens over
      de afgenomen hoeveelheden van het desbetreffende gewas te verstrekken aan de minister;


      [ref1]: https://wetten.overheid.nl/BWBR0019031
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel21aa
    references:
      - id: ref1
        bwb_id: BWBR0019031
  - number: 21aa.2.b
    text: |-
      beschikt, voor zover het pootaardappelen, zaaiui, mais en andere consumptieaardappelrassen dan de in
      [bijlage III, tabel 2][ref1], genoemde consumptieaardappelrassen betreft, over schriftelijk bewijs waaruit blijkt
      dat het gewas aan een afnemer is geleverd en waaruit blijkt wat de gewasopbrengst is die aan een afnemer is
      geleverd. Onder schriftelijk bewijs wordt in ieder geval facturen en afleverbewijzen van de gewassen en historische
      financiële informatie verstaan;


      [ref1]: https://wetten.overheid.nl/BWBR0019031
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel21aa
    references:
      - id: ref1
        bwb_id: BWBR0019031
  - number: 21aa.2.c
    text: |-
      beschikt, voor zover het pootaardappelen, zaaiui, mais en andere consumptieaardappelrassen dan de in
      [bijlage III, tabel 2][ref1], genoemde consumptieaardappelrassen betreft, over een samenstellingsverklaring van een
      accountant waaruit blijkt dat de gewasopbrengst die aan een afnemer zou zijn geleverd in overeenstemming is met het
      door de landbouwer verstrekte schriftelijk bewijs, bedoeld in onderdeel b;


      [ref1]: https://wetten.overheid.nl/BWBR0019031
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel21aa
    references:
      - id: ref1
        bwb_id: BWBR0019031
  - number: 21aa.2.d
    text: |-
      stelt Onze Minister uiterlijk op 1 juni van het kalenderjaar ervan in kennis dat het desbetreffende bedrijf gebruik
      maakt van de verhoging van de fosfaatgebruiksnorm;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel21aa
  - number: 21aa.2.e
    text: |-
      bewaart als onderdeel van de administratie, bedoeld in [artikel 32][ref1], gegevens waaruit ter zake van elk van de
      drie aan het desbetreffende jaar voorafgaande jaren blijkt:


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel32
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel21aa
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '32'
        hoofdstuk: VI
  - number: 21aa.2.e.1°
    text: welke gewassen en rassen op het bedrijf werden geteeld;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel21aa
  - number: 21aa.2.e.2°
    text: het aantal hectaren grond dat met de desbetreffende gewassen en rassen was beteeld;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel21aa
  - number: 21aa.2.e.3°
    text: de hoogte van de gewasopbrengst;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel21aa
  - number: 21aa.2.e.4°
    text: welke mestsoorten zijn gebruikt op het bedrijf; en
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel21aa
  - number: 21aa.2.e.5°
    text: de afnemers van de desbetreffende gewassen;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel21aa
  - number: 21aa.2.f
    text: |-
      bereikt de verhoging van de gebruiksnorm door het gebruik van kunstmest, compost, champost, schuimaarde of vaste
      mest van graasdieren. Het gebruik van deze meststoffen blijkt uit de administratie van de landbouwer;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel21aa
  - number: 21aa.2.g
    text: |-
      verleent medewerking aan de monitoring door Onze Minister van de milieueffecten van de toegestane vermeerdering van
      de hoeveelheid fosfaat op grond van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel21aa
  - number: 21aa.3
    text: |-
      Voor de bepaling van de gewasopbrengst, bedoeld in het eerste lid, wordt uitsluitend in aanmerking genomen de
      hoeveelheid die door de desbetreffende landbouwer rechtstreeks is afgeleverd aan afnemers.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel21aa
  - number: 21aa.4
    text: 'In afwijking van het eerste lid, wordt de gewasopbrengst:'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel21aa
  - number: 21aa.4.a
    text: in 2017 bepaald aan de hand van het voorafgaande jaar;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel21aa
  - number: 21aa.4.b
    text: in 2018 bepaald aan de hand van de twee voorafgaande jaren.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel21aa
  - number: 21aa.5
    text: Het vierde lid en dit lid vervallen met ingang van 1 januari 2019.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel21aa
  - number: '22'
    text: |-
      Voor de toepassing van [artikel 9 van de wet][ref1] is de tot het bedrijf behorende oppervlakte landbouwgrond in
      enig kalenderjaar de oppervlakte landbouwgrond die op 15 mei van dat jaar tot het bedrijf behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel9
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '9'
  - number: '23.1'
    text: |-
      Voor de toepassing van [artikel 10, eerste lid, van de wet][ref1] is de tot het bedrijf behorende oppervlakte
      landbouwgrond in enig kalenderjaar de op 15 mei van dat jaar beteelde oppervlakte landbouwgrond die tot het bedrijf
      behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel10
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '10'
  - number: '23.2'
    text: |-
      Ingeval de teelt van gewassen na het in het eerste lid bedoelde tijdstip aanvangt, wordt de tot het bedrijf
      behorende oppervlakte landbouwgrond, bedoeld in het eerste lid, vermeerderd met de met deze gewassen beteelde
      oppervlakte landbouwgrond die op het tijdstip waarop de teelt aanvangt tot het bedrijf behoort.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel23
  - number: '23.3'
    text: |-
      De beteelde oppervlakte landbouwgrond wordt onderscheiden naar de geteelde gewassen, de toegepaste
      landbouwpraktijk, de ecologische kenmerken van een waterlichaam, de kenmerken van de bodem en de desbetreffende
      grondsoorten, bedoeld in [artikel 10, tweede lid, van de wet][ref1], voor zover dit onderscheid wordt gemaakt in de
      krachtens [artikel 10, eerste lid, van de wet][ref2], vastgestelde ministeriële regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel10
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '10'
  - number: '24.1'
    text: |-
      Voor de toepassing van [artikel 11, eerste lid, van de wet][ref1], [artikel 21a, eerste lid][ref2], van dit
      besluit en de krachtens artikel 11, vijfde lid, van de wet vastgestelde ministeriële regeling is de tot het bedrijf
      behorende oppervlakte grasland in enig kalenderjaar de oppervlakte grasland die op 15 mei van dat jaar tot het
      bedrijf behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel21a
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0019031
        artikel: 21a
        hoofdstuk: IV
  - number: '24.2'
    text: |-
      Voor de toepassing van [artikel 11, tweede lid, van de wet][ref1], [artikel 21a, tweede lid][ref2], van dit
      besluit en de krachtens artikel 11, vijfde lid, van de wet vastgestelde ministeriële regeling is de tot het bedrijf
      behorende oppervlakte bouwland in enig kalenderjaar de oppervlakte bouwland die op 15 mei van dat jaar tot het
      bedrijf behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel21a
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0019031
        artikel: 21a
        hoofdstuk: IV
  - number: '24.3'
    text: |-
      De oppervlakte grasland en bouwland wordt onderscheiden naar de fosfaattoestand van de desbetreffende grond, zoals
      deze wordt onderscheiden in [artikel 1, eerste lid, onderdelen u, v en w, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel1
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '1'
  - number: '25'
    text: |-
      Voor de toepassing van de [artikelen 9][ref1], [10, eerste lid][ref2],
      [11, eerste en tweede lid, van de wet][ref3], [artikel 21a][ref4] van dit besluit en de krachtens artikel
      11, vijfde lid, van de wet vastgestelde ministeriële regeling wordt de teeltvrije zone, bedoeld in de
      [artikelen 3.80][ref5], [3.81][ref6] en [3.85 van het Activiteitenbesluit milieubeheer][ref7], niet aangemerkt als
      tot het bedrijf behorende oppervlakte landbouwgrond.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0019031#Artikel21a
      [ref5]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref7]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0004054
        artikel: '11'
      - id: ref4
        bwb_id: BWBR0019031
        artikel: 21a
        hoofdstuk: IV
      - id: ref5
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref6
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref7
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 25a.1
    text: |-
      Voor de toepassing van [artikel 1, eerste lid, onderdeel ll, onder 1°, van de wet][ref1] is de tot het
      bedrijf behorende oppervlakte landbouwgrond in enig kalenderjaar de oppervlakte landbouwgrond die ingevolge de
      [artikelen 24][ref2] en [25][ref3] in het desbetreffende kalenderjaar tot het bedrijf behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0019031#Artikel25
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0019031
        artikel: '24'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0019031
        artikel: '25'
        hoofdstuk: IV
  - number: 25a.2
    text: |-
      Voor de toepassing van [artikel 1, eerste lid, onderdeel ll, onder 2°, van de wet][ref1] is de tot het bedrijf
      behorende oppervlakte landbouwgrond zijnde natuurterrein dat de hoofdfunctie natuur, heeft in enig kalenderjaar het
      natuurterrein dat op 15 mei van het desbetreffende kalenderjaar bij het bedrijf in gebruik is.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel1
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '1'
  - number: '26.1'
    text: 'De landbouwer verstrekt elk kalenderjaar aan Onze Minister gegevens met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel26
  - number: 26.1.a
    text: |-
      de op 15 mei van het desbetreffende kalenderjaar beteelde of te betelen oppervlakte van de percelen landbouwgrond,
      onderscheiden naar gewas en topografische ligging van deze percelen;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel26
  - number: 26.1.b
    text: |-
      de na 15 mei van het desbetreffende kalenderjaar met een volggewas te betelen oppervlakte van de percelen
      landbouwgrond, onderscheiden naar gewas en topografische ligging van deze percelen; en
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel26
  - number: 26.1.c
    text: |-
      de oppervlakte en de ligging van in het buitenland gelegen percelen die in het desbetreffende kalenderjaar bij het
      bedrijf in gebruik zijn.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel26
  - number: '26.2'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel26
  - number: 26.2.a
    text: |-
      de gegevens die ingevolge het eerste lid worden verstrekt, de wijze waarop en de uiterlijke datum waarop deze
      gegevens worden verstrekt en de termijn waarbinnen wijzigingen in deze gegevens worden doorgegeven; en
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel26
  - number: 26.2.b
    text: |-
      de overige te verstrekken gegevens, de wijze waarop en de uiterlijke datum waarop deze gegevens worden verstrekt en
      de termijn waarbinnen wijzigingen in deze gegevens worden doorgegeven.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel26
  - number: '26.3'
    text: |-
      Bij ministeriële regeling kan, in zoverre in afwijking van het eerste lid en van de [artikelen 22][ref1],
      [23, eerste lid][ref2], [24, eerste en tweede lid][ref3], en [25a][ref4], indien de weersomstandigheden of de
      bodemgesteldheid hiertoe aanleiding geven, een latere datum dan 15 mei worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0019031#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0019031#Artikel25a
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '22'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0019031
        artikel: '23'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0019031
        artikel: '24'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0019031
        artikel: 25a
        hoofdstuk: IV
  - number: '27.1'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt als opslagruimte voor meststoffen uitsluitend in aanmerking
      genomen de opslagruimte voor dierlijke meststoffen waarvoor een omgevingsvergunning geldt als bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref1], of waarop een
      algemene maatregel van bestuur op grond van [artikel 8.40 van de Wet milieubeheer][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
  - number: '27.2'
    text: Voor de toepassing van dit hoofdstuk wordt de hoeveelheid dierlijke meststoffen uitgedrukt in kubieke meters.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel27
  - number: '28.1'
    text: |-
      De producent van dierlijke meststoffen draagt er zorg voor dat de capaciteit van de opslagruimte voor dierlijke
      meststoffen op het bedrijf voldoende is voor de opslag van de hoeveelheid dierlijke meststoffen die in de periode
      van augustus tot en met februari op het bedrijf wordt geproduceerd.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel28
  - number: '28.2'
    text: 'De hoeveelheid dierlijke meststoffen, bedoeld in het eerste lid, wordt berekend door vermenigvuldiging van:'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel28
  - number: 28.2.a
    text: |-
      het aantal dieren van de onderscheiden diersoorten en diercategorieën dat op grond van de omgevingsvergunning,
      bedoeld in [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref1], in de
      tot het bedrijf behorende stallen kan worden gehouden, met


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 28.2.b
    text: de voor de betrokken diersoort en diercategorie bij ministeriële regeling vastgestelde forfaitaire productienormen.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel28
  - number: '28.3'
    text: |-
      Ingeval voor het bedrijf ingevolge [artikel 8.40 van de Wet milieubeheer][ref1] geen vergunningplicht geldt, wordt,
      in plaats van het in het tweede lid, onderdeel a, bedoelde aantal dieren, als uitgangspunt genomen het aantal
      dieren van de onderscheiden diersoorten en diercategorieën dat in de bij het bedrijf behorende stallen kan worden
      gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: '28.4'
    text: |-
      De in het tweede lid, onderdeel b, bedoelde productienormen kunnen verschillend worden vastgesteld al naar gelang
      het gehanteerde bedrijfssysteem.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel28
  - number: '29.1'
    text: |-
      De capaciteit van de opslagruimte voor dierlijke meststoffen kan kleiner zijn dan de ingevolge [artikel 28][ref1]
      vereiste capaciteit, voor zover de producent van dierlijke meststoffen kan aantonen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel28
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '28'
        hoofdstuk: V
  - number: 29.1.a
    text: |-
      de overeenkomstig [artikel 28, tweede en derde lid][ref1], berekende hoeveelheid dierlijke meststoffen die wordt
      geproduceerd boven de werkelijke opslagcapaciteit op een voor het milieu onschadelijke wijze van het bedrijf zal
      worden verwijderd;


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel28
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '28'
        hoofdstuk: V
  - number: 29.1.b
    text: |-
      de overeenkomstig [artikel 28, tweede en derde lid][ref1], berekende hoeveelheid dierlijke meststoffen die wordt
      geproduceerd boven de werkelijke opslagcapaciteit zal worden aangewend op tot het bedrijf behorend bouwland of
      grasland waarvoor het in [artikel 4 van het Besluit gebruik meststoffen][ref2] gestelde verbod niet geldt;


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0009066#Artikel4
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '28'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0009066
        artikel: '4'
  - number: 29.1.c
    text: |-
      het aantal dieren dat in de periode van augustus tot en met februari feitelijk in de tot het bedrijf
      behorende stallen kan worden gehouden kleiner is dan op grond van de omgevingsvergunning, bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref1], is toegestaan;
      of


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 29.1.d
    text: |-
      in de periode van augustus tot en met februari stelselmatig minder dieren worden gehouden in de bij het bedrijf
      behorende stallen.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel29
  - number: '29.2'
    text: |-
      Het eerste lid, aanhef en onderdeel b, geldt niet voor de hoeveelheid dierlijke meststoffen die in februari wordt
      geproduceerd.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel29
  - number: '30'
    text: |-
      Ingeval de producent kan aantonen dat, als gevolg van bijzondere omstandigheden betreffende de soort of de
      categorie van de gehouden dieren, het huisvestingssysteem, het drinkwatersysteem, de samenstelling van het
      diervoeder of andere aspecten van het bedrijfssysteem, de hoeveelheid dierlijke meststoffen per dier lager is
      dan de krachtens [artikel 28, tweede lid, onderdeel b][ref1], vastgestelde norm, geldt deze lagere waarde voor de
      toepassing van de [artikelen 28][ref2] en [29][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0019031#Artikel29
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '28'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0019031
        artikel: '28'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0019031
        artikel: '29'
        hoofdstuk: V
  - number: '31.1'
    text: De landbouwer meldt elk van zijn bedrijven afzonderlijk ter registratie aan bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel31
  - number: '31.2'
    text: 'Ten behoeve van de registratie verstrekt de landbouwer per bedrijf in ieder geval gegevens over:'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel31
  - number: 31.2.a
    text: de locaties van het bedrijf;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel31
  - number: 31.2.b
    text: de tenaamstelling of handelsnaam;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel31
  - number: 31.2.c
    text: de rechtsvorm;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel31
  - number: 31.2.d
    text: |-
      in voorkomend geval de aard en samenstelling van het samenwerkingsverband van personen of rechtspersonen dat het
      bedrijf voert;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel31
  - number: 31.2.e
    text: de toegepaste huisvestingssystemen; en
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel31
  - number: 31.2.f
    text: de wijzigingen in de gegevens, bedoeld in de onderdelen a tot en met e.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel31
  - number: '31.3'
    text: |-
      Voor zover de in het tweede lid bedoelde gegevens zijn verstrekt op grond van de [Meststoffenwet][ref1], de
      [Wet herstructurering varkenshouderij][ref2] en de [Wet verplaatsing mestproductie][ref3] en niet zijn gewijzigd,
      behoeven deze niet opnieuw te worden verstrekt. De registratie van deze gegevens geldt als registratie in de zin
      van het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
      [ref2]: https://wetten.overheid.nl/BWBR0009542
      [ref3]: https://wetten.overheid.nl/BWBR0006285
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004054
      - id: ref2
        bwb_id: BWBR0009542
      - id: ref3
        bwb_id: BWBR0006285
  - number: '31.4'
    text: |-
      Voor zover de in het tweede lid bedoelde gegevens worden verstrekt op grond van de krachtens de
      [artikelen 24][ref1] en [25 van de Landbouwwet][ref2] of de [artikelen 4][ref3], [10 tot en met 14][ref4] en
      [96 van de Gezondheids- en welzijnswet voor dieren][ref5] gestelde regels, behoeven deze niet nogmaals te worden
      verstrekt. De registratie van deze gegevens geldt als registratie in de zin van het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002252#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0005662#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0005662#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0005662#Artikel96
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0002252
        artikel: '25'
      - id: ref3
        bwb_id: BWBR0005662
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0005662
        artikel: '10'
      - id: ref5
        bwb_id: BWBR0005662
        artikel: '96'
  - number: '32.1'
    text: De landbouwer houdt per bedrijf en per kalenderjaar een inzichtelijke administratie bij.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel32
  - number: '32.2'
    text: |-
      De administratie bevat in ieder geval de gegevens, bedoeld in [artikel 31, tweede lid][ref1], alsmede gegevens
      over:


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel31
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '31'
        hoofdstuk: VI
  - number: 32.2.a
    text: |-
      de civielrechtelijke titel die het exclusieve gebruiksgenot verschaft van elk van de tot het bedrijf behorende
      productie-eenheden;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel32
  - number: 32.2.b
    text: |-
      de oppervlakte en gegevens ter identificatie van de percelen van de tot het bedrijf behorende oppervlakte
      landbouwgrond, onderscheiden naar:
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel32
  - number: 32.2.b.1
    text: de verschillende teelten of andere vormen van gebruik;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel32
  - number: 32.2.b.2
    text: |-
      de fosfaattoestand van de tot het bedrijf behorende oppervlakte landbouwgrond, zoals deze wordt onderscheiden in
      [artikel 1, eerste lid, onderdelen u, v en w, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel1
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '1'
  - number: 32.2.b.3
    text: grasland en bouwland, en
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel32
  - number: 32.2.b.4°
    text: |-
      voor zover het betreft tot het bedrijf behorende oppervlakte landbouwgrond zijnde natuurterrein dat de hoofdfunctie
      natuur heeft, het beheersregime dat ingevolge [artikel 2, tweede lid, van het Besluit gebruik meststoffen][ref1],
      op de desbetreffende percelen ten aanzien van mestgebruik geldt;


      [ref1]: https://wetten.overheid.nl/BWBR0009066#Artikel2
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0009066
        artikel: '2'
  - number: 32.2.c
    text: |-
      de oppervlakte en gegevens ter identificatie van de exclusief bij het bedrijf in gebruik zijnde percelen
      landbouwgrond die zijn gelegen in België en Duitsland in het grensgebied met Nederland, onderscheiden naar de
      verschillende teelten of andere vormen van gebruik;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel32
  - number: 32.2.d
    text: |-
      de aantallen op het bedrijf gehouden dan wel anderszins aanwezige varkens, kippen en kalkoenen en het gemiddeld
      in het kalenderjaar op het bedrijf gehouden aantal van deze dieren, onderscheiden naar diercategorieën per soort
      overeenkomstig [bijlage II van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: 32.2.e
    text: |-
      de aantallen voor gebruiks- of winstdoeleinden op het bedrijf gehouden dan wel anderszins aanwezige dieren, anders
      dan varkens, kippen en kalkoenen, onderscheiden naar diersoorten en diercategorieën per soort, voor zover dit
      onderscheid wordt gemaakt in de krachtens [artikel 36][ref1] gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel36
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '36'
        hoofdstuk: VI
  - number: 32.2.f
    text: |-
      de hoeveelheden aan- en afgevoerde meststoffen waarbij, voor zover van toepassing, wordt aangegeven dat
      de afvoer heeft plaatsgevonden ter uitvoering van [artikel 21, tweede lid, onderdeel d, onder 1°][ref1],
      [artikel 33a, tweede lid, onderdeel b, onder 1°, onderdeel e, of vijfde lid, van de wet][ref2], de datum waarop
      de aan- of afvoer plaatsvond en gegevens over het bedrijf of de onderneming van herkomst, onderscheidenlijk
      van bestemming, dan wel, ingeval geen sprake is van een bedrijf of onderneming, gegevens over de leverancier
      onderscheidenlijk afnemer van de meststoffen;


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel33a
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: 33a
  - number: 32.2.g
    text: |-
      de hoeveelheid dierlijke meststoffen, uitgedrukt in kilogrammen fosfaat, waarvoor de landbouwer ten aanzien
      van een kalenderjaar overeenkomsten als bedoeld in [artikel 21, tweede lid, onderdeel d, onder 4][ref1] en
      [artikel 33a, tweede lid, onderdeel e, van de wet][ref2] heeft gesloten;


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel33a
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: 33a
  - number: 32.2.h
    text: |-
      de hoeveelheid dierlijke meststoffen, uitgedrukt in kilogrammen fosfaat, waarvoor de landbouwer ten aanzien van een
      kalenderjaar overeenkomsten als bedoeld in [artikel 33a, derde lid, onderdeel c, van de wet][ref1] heeft gesloten,
      waarbij onderscheid wordt gemaakt in de hoeveelheid die de landbouwer laat verwerken door middel van het sluiten
      van die overeenkomst, en de hoeveelheid die een landbouwer ingevolge artikel 33a, vijfde lid, van de wet moet laten
      verwerken;


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel33a
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 33a
  - number: 32.2.i
    text: de capaciteit van de bij het bedrijf behorende opslagruimte voor dierlijke meststoffen in kubieke meters;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel32
  - number: 32.2.j
    text: de aan het begin en het eind van het kalenderjaar op het bedrijf aanwezige hoeveelheden meststoffen;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel32
  - number: 32.2.k
    text: |-
      de hoeveelheden en de samenstelling van de aan andere bedrijven of ondernemingen afgeleverde diervoeders,
      uitgedrukt in kilogrammen alsmede in kilogrammen stikstof en fosfaat; en
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel32
  - number: 32.2.l
    text: |-
      de gewasopbrengst, voor zover deze relevant is voor de toepassing van de krachtens
      [artikel 10, eerste lid, van de wet][ref1] vastgestelde ministeriële regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel10
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '10'
  - number: '32.3'
    text: |-
      De landbouwer bewaart de mestverwerkingsovereenkomsten, en de overeenkomsten,
      bedoeld in [artikel 21, tweede lid, onderdeel d, onder 4°][ref1] en
      [artikel 33a, tweede lid, onderdeel e, en derde lid, onderdeel c, van de wet][ref2], als onderdeel van zijn
      administratie.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel33a
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: 33a
  - number: '33.1'
    text: |-
      Indien op een bedrijf dierlijke meststoffen worden geproduceerd afkomstig van melkkoeien, bevat de administratie,
      bedoeld in [artikel 32, eerste lid][ref1], tevens gegevens over:


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel32
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '32'
        hoofdstuk: VI
  - number: 33.1.a
    text: de geproduceerde hoeveelheid koemelk; en
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel33
  - number: 33.1.b
    text: het ureumgehalte per kilogram geproduceerde koemelk.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel33
  - number: '33.2'
    text: |-
      Indien op een bedrijf dierlijke meststoffen worden geproduceerd afkomstig van staldieren, bevat de administratie
      tevens gegevens over:
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel33
  - number: 33.2.a
    text: |-
      de aantallen en de herkomst of de bestemming van de aan- en afgevoerde staldieren, onderscheiden naar diersoort
      en diercategorieën per soort, voor zover dit onderscheid wordt gemaakt in de krachtens [artikel 36][ref1] gestelde
      regels;


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel36
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '36'
        hoofdstuk: VI
  - number: 33.2.b
    text: |-
      de samenstelling en de hoeveelheid van de op het bedrijf geproduceerde diervoeders, alsmede de samenstelling, de
      hoeveelheid en de herkomst van de op het bedrijf aangevoerde diervoeders;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel33
  - number: 33.2.c
    text: de op het bedrijf geproduceerde eieren die van het bedrijf zijn afgevoerd;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel33
  - number: 33.2.d
    text: |-
      de aan het eind van het kalenderjaar op het bedrijf aanwezige voorraden diervoeders en geproduceerde eieren,
      alsmede de aanwezige staldieren, onderscheiden naar diersoort en diercategorieën per soort, voor zover dit
      onderscheid wordt gemaakt in de krachtens [artikel 36][ref1] gestelde regels; en


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel36
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '36'
        hoofdstuk: VI
  - number: 33.2.e
    text: de op het bedrijf toegepaste stalsystemen.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel33
  - number: '33.3'
    text: 'Indien op een bedrijf dierlijke meststoffen worden behandeld, bevat de administratie tevens gegevens over:'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel33
  - number: 33.3.a
    text: de methode van behandeling;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel33
  - number: 33.3.b
    text: de hoeveelheid behandelde dierlijke meststoffen;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel33
  - number: 33.3.c
    text: de hoeveelheid, de aard en de samenstelling van de tezamen met de dierlijke meststoffen behandelde stoffen; en
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel33
  - number: 33.3.d
    text: de hoeveelheid en de samenstelling van de eindproducten van de behandeling.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel33
  - number: '33.4'
    text: |-
      De gegevens inzake de hoeveelheden koemelk, diervoeders, eieren en de stoffen, bedoeld in het derde lid, onderdeel
      c, worden uitgedrukt in kilogrammen en, met uitzondering van koemelk, in kilogrammen stikstof en fosfaat.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel33
  - number: '34.1'
    text: De administratie wordt per kalenderjaar, tijdig, volledig en naar waarheid bijgehouden.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel34
  - number: '34.2'
    text: |-
      De administratie en de daarop betrekking hebbende bewijsstukken worden gedurende vijf jaren na afloop van het
      desbetreffende kalenderjaar door de landbouwer op het bedrijf bewaard.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel34
  - number: '35.1'
    text: 'Uit de administratie worden jaarlijks gegevens verstrekt aan Onze Minister door:'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel35
  - number: 35.1.a
    text: |-
      landbouwers die in een kalenderjaar een grotere hoeveelheid dierlijke meststoffen produceren dan 170 kilogram
      stikstof per hectare van de tot het bedrijf behorende oppervlakte landbouwgrond; en
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel35
  - number: 35.1.b
    text: de bij ministeriële regeling aangewezen categorieën van landbouwers.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel35
  - number: '35.2'
    text: |-
      De landbouwer verstrekt desgevraagd door Onze Minister gegevens uit de administratie, binnen een door Onze Minister
      bepaalde termijn en op een door Onze Minister bepaalde wijze.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel35
  - number: '35.3'
    text: |-
      De ingevolge het eerste en tweede lid verstrekte gegevens kunnen mede worden gebruikt voor de kwaliteitsbeoordeling
      van een PRTR-verslag, bedoeld in artikel 9, tweede lid, van de EG-verordening PRTR.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel35
  - number: '36'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel36
  - number: 36.a
    text: |-
      de overige bij de aanmelding, bedoeld in [artikel 31, eerste lid][ref1], te verstrekken gegevens, de wijze waarop
      en de termijn waarbinnen de aanmelding en de doorgifte van wijzigingen geschieden;


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel31
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '31'
        hoofdstuk: VI
  - number: 36.b
    text: |-
      de wijze waarop de administratie, bedoeld in de [artikelen 32][ref1] en [33][ref2], wordt gevoerd, de plaats waar
      deze met het oog op het toezicht op de naleving beschikbaar moet zijn en de termijn waarbinnen de gegevens of
      wijzigingen in de gegevens in deze administratie worden opgenomen;


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel33
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '32'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0019031
        artikel: '33'
        hoofdstuk: VI
  - number: 36.c
    text: |-
      de overige gegevens die de administratie, bedoeld in de [artikelen 32][ref1] en [33][ref2], bevat;


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel33
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '32'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0019031
        artikel: '33'
        hoofdstuk: VI
  - number: 36.d
    text: |-
      de gegevens die ingevolge [artikel 35, eerste lid][ref1], worden verstrekt en de wijze waarop en de termijn
      waarbinnen deze gegevens worden verstrekt;


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel35
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '35'
        hoofdstuk: VI
  - number: 36.e
    text: |-
      de gevallen waarin en de voorwaarden waaronder de [artikelen 31][ref1], [32][ref2], [33][ref3] of [35][ref4] geheel
      of gedeeltelijk niet van toepassing zijn ten aanzien van bedrijven of onderdelen van bedrijven; en


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0019031#Artikel33
      [ref4]: https://wetten.overheid.nl/BWBR0019031#Artikel35
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '31'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0019031
        artikel: '32'
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0019031
        artikel: '33'
        hoofdstuk: VI
      - id: ref4
        bwb_id: BWBR0019031
        artikel: '35'
        hoofdstuk: VI
  - number: 36.f
    text: |-
      de omvang van het grensgebied, bedoeld in [artikel 32, tweede lid, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel32
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '32'
        hoofdstuk: VI
  - number: '37'
    text: |-
      De op grond van dit hoofdstuk en [hoofdstuk IX][ref1] bij te houden of te verstrekken gegevens worden desgevraagd
      ten genoegen van Onze Minister gestaafd met bewijsstukken.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#HoofdstukIX
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0019031
        hoofdstuk: IX
  - number: '38.1'
    text: De intermediair meldt elk van zijn intermediaire ondernemingen afzonderlijk ter registratie aan bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel38
  - number: '38.2'
    text: 'Ten behoeve van de registratie verstrekt de intermediair per onderneming in ieder geval gegevens over:'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel38
  - number: 38.2.a
    text: |-
      de locaties van de tot de onderneming behorende gebouwen en opslagruimten voor dierlijke meststoffen,
      zuiveringsslib, compost of mengsels van zuiveringsslib en compost;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel38
  - number: 38.2.b
    text: de tenaamstelling of handelsnaam;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel38
  - number: 38.2.c
    text: de rechtsvorm;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel38
  - number: 38.2.d
    text: |-
      in voorkomend geval de aard en samenstelling van het samenwerkingsverband van personen of rechtspersonen dat de
      onderneming voert;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel38
  - number: 38.2.e
    text: de aard van de activiteiten die in het kader van de onderneming worden uitgeoefend;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel38
  - number: 38.2.f
    text: |-
      de krachtens [artikel 70, vierde lid, onderdeel b][ref1], voorgeschreven apparatuur die in het kader van zijn
      onderneming wordt gebruikt of is bestemd om te worden gebruikt;


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel70
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '70'
        hoofdstuk: X
  - number: 38.2.g
    text: de apparatuur voor automatische gegevensregistratie die exclusief bij deze onderneming in gebruik is;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel38
  - number: 38.2.h
    text: de capaciteit van de bij de onderneming behorende opslagruimten voor meststoffen in tonnen; en
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel38
  - number: 38.2.i
    text: de wijzigingen in de gegevens, bedoeld in de onderdelen a tot en met h.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel38
  - number: '38.3'
    text: |-
      Voor zover de in het tweede lid bedoelde gegevens zijn verstrekt op grond van de [Meststoffenwet][ref1] en
      niet zijn gewijzigd, behoeven deze niet opnieuw te worden verstrekt. De registratie van deze gegevens geldt als
      registratie in de zin van het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: 38a.1
    text: |-
      Een registratie kan worden geweigerd of geschrapt in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: 38a.2
    text: |-
      Een registratie kan worden geschorst voor zover de intermediair boetes zijn opgelegd voor overtreding van de
      eisen gesteld bij of krachtens de wet, die onherroepelijk zijn geworden en niet zijn betaald of voor zover de
      intermediair verbeurde dwangsommen, ten aanzien waarvan invorderingsbeschikkingen onherroepelijk zijn geworden,
      niet heeft betaald. De schorsing vervalt op het moment dat de boetes of dwangsommen die ten grondslag liggen aan de
      schorsing zijn betaald.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel38a
  - number: 38a.3
    text: |-
      Voordat toepassing wordt gegeven aan het eerste lid kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: '39.1'
    text: De intermediair houdt per onderneming een inzichtelijke administratie bij.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel39
  - number: '39.2'
    text: |-
      De administratie bevat in ieder geval de gegevens, bedoeld in [artikel 38, tweede lid][ref1], alsmede gegevens
      over:


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel38
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '38'
        hoofdstuk: VII
  - number: 39.2.a
    text: |-
      de hoeveelheden in het kader van de onderneming aan- en afgevoerde meststoffen
      waarbij, voor zover van toepassing, wordt aangegeven dat de aan- of afvoer heeft
      plaatsgevonden ter uitvoering van [artikel 21, tweede lid, onderdeel d, onder 1°][ref1],
      [artikel 33a, tweede lid, onderdeel b, onder 1°, vierde of vijfde lid][ref2], en
      [artikel 33d, eerste lid, van de wet][ref3], de datum waarop de aan- en afvoer plaatsvond en het bedrijf of de
      onderneming van herkomst, onderscheidenlijk van bestemming dan wel, ingeval geen sprake is van een bedrijf of
      onderneming, gegevens over de leverancier onderscheidenlijk afnemer van de meststoffen;


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel33a
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel33d
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: 33a
      - id: ref3
        bwb_id: BWBR0004054
        artikel: 33d
  - number: 39.2.b
    text: |-
      de hoeveelheden meststoffen die in iedere afzonderlijke opslagruimte voor meststoffen zijn aangevoerd en de
      hoeveelheden meststoffen die uit die opslagruimte zijn afgevoerd, zodanig dat steeds blijkt welke hoeveelheid
      meststoffen zich in de opslagruimte bevindt;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel39
  - number: 39.2.c
    text: |-
      de hoeveelheid dierlijke meststoffen, uitgedrukt in kilogrammen fosfaat, waarvoor de intermediair ten aanzien van
      een kalenderjaar mestverwerkingsovereenkomsten heeft gesloten, en
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel39
  - number: 39.2.d
    text: |-
      de hoeveelheden meststoffen die bij de overdracht van een opslagruimte voor meststoffen aan of door een andere
      intermediair op het moment van overdracht aanwezig is in de desbetreffende opslagruimte.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel39
  - number: '39.3'
    text: 'Indien op een onderneming dierlijke meststoffen worden behandeld, bevat de administratie tevens gegevens over:'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel39
  - number: 39.3.a
    text: de methode van behandeling;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel39
  - number: 39.3.b
    text: de hoeveelheid behandelde dierlijke meststoffen;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel39
  - number: 39.3.c
    text: de hoeveelheid, de aard en de samenstelling van de tezamen met de dierlijke meststoffen behandelde stoffen; en
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel39
  - number: 39.3.d
    text: de hoeveelheid en de samenstelling van de eindproducten van de behandeling.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel39
  - number: '39.4'
    text: |-
      [Artikel 34][ref1] is op de administratie, bedoeld in het eerste lid, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel34
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '34'
        hoofdstuk: VI
  - number: '39.5'
    text: De intermediair bewaart de mestverwerkingsovereenkomsten als onderdeel van zijn administratie.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel39
  - number: '40.1'
    text: De intermediair verstrekt jaarlijks gegevens uit de administratie aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel40
  - number: '40.2'
    text: |-
      De intermediair verstrekt desgevraagd door Onze Minister gegevens uit de administratie, binnen een door Onze
      Minister bepaalde termijn en op een door Onze Minister bepaalde wijze.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel40
  - number: '41'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel41
  - number: 41.a
    text: |-
      de overige bij de aanmelding, bedoeld in [artikel 38, eerste lid][ref1], te verstrekken gegevens, de wijze waarop
      en de termijn waarbinnen de aanmelding en de doorgifte van wijzigingen geschieden;


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel38
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '38'
        hoofdstuk: VII
  - number: 41.b
    text: |-
      de wijze waarop de administratie, bedoeld in [artikel 39][ref1], wordt gevoerd, de plaats waar deze met het oog
      op het toezicht op de naleving beschikbaar moet zijn en de termijn waarbinnen de gegevens of wijzigingen in de
      gegevens in deze administratie worden opgenomen;


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel39
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '39'
        hoofdstuk: VII
  - number: 41.c
    text: |-
      de overige gegevens die de administratie, bedoeld in [artikel 39][ref1], bevat;


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel39
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '39'
        hoofdstuk: VII
  - number: 41.d
    text: |-
      de gegevens die ingevolge [artikel 40, eerste lid][ref1], worden verstrekt en de wijze waarop en de termijn
      waarbinnen deze gegevens worden verstrekt;


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel40
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '40'
        hoofdstuk: VII
  - number: 41.e
    text: |-
      de gevallen waarin en de voorwaarden waaronder de [artikelen 38][ref1], [39][ref2] of [40][ref3] geheel of
      gedeeltelijk niet van toepassing zijn; en


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0019031#Artikel40
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '38'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0019031
        artikel: '39'
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0019031
        artikel: '40'
        hoofdstuk: VII
  - number: 41.f
    text: het aanbrengen van aanduidingen op de opslagruimten voor meststoffen ter identificatie van deze ruimten.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel41
  - number: '42'
    text: |-
      De op grond van dit hoofdstuk en [hoofdstuk IX][ref1] bij te houden of te verstrekken gegevens worden desgevraagd
      ten genoegen van Onze Minister gestaafd met bewijsstukken.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#HoofdstukIX
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0019031
        hoofdstuk: IX
  - number: '43.1'
    text: |-
      De ondernemer, die een of meer ondernemingen voert in het kader waarvan diervoeders worden afgeleverd aan een
      bedrijf met staldieren of runderen, of in het kader waarvan van bedrijven afgenomen koemelk wordt verwerkt, meldt
      elk van deze ondernemingen afzonderlijk ter registratie aan bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel43
  - number: '43.2'
    text: |-
      De ondernemer die een of meer ondernemingen voert, niet zijnde een bedrijf of een intermediaire onderneming, in het
      kader waarvan meststoffen worden verhandeld, meldt elk van deze ondernemingen afzonderlijk ter registratie aan bij
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel43
  - number: '43.3'
    text: 'Ten behoeve van de registratie verstrekt de ondernemer in ieder geval gegevens over:'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel43
  - number: 43.3.a
    text: de locaties van de onderneming;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel43
  - number: 43.3.b
    text: de tenaamstelling of handelsnaam;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel43
  - number: 43.3.c
    text: de rechtsvorm;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel43
  - number: 43.3.d
    text: |-
      in voorkomend geval de aard en samenstelling van het samenwerkingsverband van personen of rechtspersonen dat de
      onderneming voert; en
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel43
  - number: 43.3.e
    text: de wijzigingen in de gegevens, bedoeld in de onderdelen a tot en met d.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel43
  - number: '43.4'
    text: |-
      Voor zover de in het derde lid bedoelde gegevens zijn verstrekt op grond van de [Meststoffenwet][ref1] en niet zijn
      gewijzigd, behoeven deze niet opnieuw te worden verstrekt. De registratie van deze gegevens geldt als registratie
      in de zin van het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: '43.5'
    text: |-
      Voor zover de in het derde lid bedoelde gegevens worden verstrekt op grond van de krachtens
      [artikel 6.4 van de Wet dieren][ref1] met betrekking tot diervoeders gestelde regels of de krachtens de
      [artikelen 27][ref2] en [28 van de Landbouwwet][ref3] gestelde regels, behoeven deze niet nogmaals te worden
      verstrekt. De registratie van deze gegevens geldt als registratie in de zin van het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002252#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0002252#Artikel28
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0002252
        artikel: '27'
      - id: ref3
        bwb_id: BWBR0002252
        artikel: '28'
  - number: '44.1'
    text: |-
      De ondernemer, bedoeld in [artikel 43, eerste lid][ref1], houdt per onderneming een inzichtelijke administratie
      bij.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel43
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '43'
        hoofdstuk: VIII
  - number: '44.2'
    text: |-
      De administratie, bedoeld in het eerste lid, bevat in ieder geval de gegevens, bedoeld in
      [artikel 43, derde lid][ref1], alsmede gegevens over:


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel43
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '43'
        hoofdstuk: VIII
  - number: 44.2.a
    text: |-
      de hoeveelheden van de door de ondernemer afgeleverde diervoeders per bedrijf, onderscheidenlijk de hoeveelheden
      alsmede het ureumgehalte van de door de ondernemer afgenomen koemelk per bedrijf;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel44
  - number: 44.2.b
    text: de datum waarop de aflevering of de afname plaatsvond; en
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel44
  - number: 44.2.c
    text: |-
      het bedrijf waaraan de diervoeders zijn afgeleverd, onderscheidenlijk het bedrijf waar de afgenomen koemelk is
      geproduceerd.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel44
  - number: '44.3'
    text: |-
      De ondernemer, bedoeld in [artikel 43, tweede lid][ref1], en de ondernemer in het kader van wiens onderneming
      staldieren aan bedrijven worden afgeleverd dan wel staldieren of eieren van bedrijven worden afgenomen, houdt per
      onderneming een inzichtelijke administratie bij.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel43
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '43'
        hoofdstuk: VIII
  - number: '44.4'
    text: 'De administratie, bedoeld in het derde lid, bevat in ieder geval gegevens over:'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel44
  - number: 44.4.a
    text: |-
      de hoeveelheden van de door de ondernemer afgeleverde of afgenomen meststoffen per onderneming of per bedrijf,
      met uitzondering van de aan particulieren afgeleverde hoeveelheden, de aantallen door de ondernemer afgeleverde
      of afgenomen staldieren per bedrijf, onderscheiden naar diersoort en diercategorieën per soort, voor zover dit
      onderscheid wordt gemaakt in de krachtens [artikel 36][ref1] gestelde regels, onderscheidenlijk de hoeveelheden van
      de door de ondernemer afgenomen eieren per bedrijf;


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel36
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '36'
        hoofdstuk: VI
  - number: 44.4.b
    text: de datum waarop de aflevering of de afname plaatsvond; en
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel44
  - number: 44.4.c
    text: het bedrijf of de onderneming van bestemming, onderscheidenlijk herkomst.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel44
  - number: '44.5'
    text: |-
      Indien op een onderneming zuiveringsslib wordt geproduceerd of anderszins wordt bewerkt of verwerkt, bevat de
      administratie tevens gegevens over:
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel44
  - number: 44.5.a
    text: |-
      de in [artikel 16, eerste lid][ref1], bedoelde behandelingsmethode voor zuiveringsslib;


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel16
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '16'
        hoofdstuk: III
        paragraaf: '4'
  - number: 44.5.b
    text: de hoeveelheid geproduceerd, bewerkt of verwerkt zuiveringsslib; en
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel44
  - number: 44.5.c
    text: de hoeveelheid en de samenstelling van het zuiveringsslib.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel44
  - number: '44.6'
    text: |-
      De gegevens inzake de hoeveelheden diervoeders, koemelk en eieren worden uitgedrukt in kilogrammen en, met
      uitzondering van koemelk, in kilogrammen stikstof en fosfaat.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel44
  - number: '44.7'
    text: |-
      [Artikel 34][ref1] is op de administratie, bedoeld in het eerste en derde lid, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel34
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '34'
        hoofdstuk: VI
  - number: '45.1'
    text: |-
      De ondernemer, bedoeld in [artikel 43, eerste lid][ref1] en de ondernemer in het kader van wiens onderneming
      zuiveringsslib wordt verhandeld, verstrekt jaarlijks gegevens uit de administratie aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel43
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '43'
        hoofdstuk: VIII
  - number: '45.2'
    text: |-
      De buiten Nederland gevestigde ondernemer, in het kader van wiens onderneming diervoeders worden afgeleverd aan een
      bedrijf met staldieren, verstrekt bij de aflevering aan de landbouwer een begeleidend document waarop het gewicht
      en de overeenkomstig de krachtens [artikel 70, vierde lid][ref1], vastgestelde samenstelling van de afgeleverde
      diervoeders is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel70
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '70'
        hoofdstuk: X
  - number: '45.3'
    text: Het document, bedoeld in het tweede lid, is tijdens het vervoer van de diervoeders op het transportmiddel aanwezig.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel45
  - number: '45.4'
    text: |-
      Het tweede en het derde lid gelden niet indien de ondernemer de in het tweede lid bedoelde gegevens na afloop
      van het kalenderjaar waarin de afleveringen van diervoeders hebben plaatsgevonden aan Onze Minister verstrekt en
      voorafgaand aan de eerste aflevering aan Onze Minister verklaart zulks te zullen doen.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel45
  - number: '45.5'
    text: |-
      De ondernemer, bedoeld in [artikel 43, eerste lid][ref1], of [artikel 44, derde lid][ref2], verstrekt desgevraagd
      door Onze Minister gegevens uit de administratie, binnen een door Onze Minister bepaalde termijn en op een door
      Onze Minister bepaalde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel44
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '43'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0019031
        artikel: '44'
        hoofdstuk: VIII
  - number: '46'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel46
  - number: 46.a
    text: |-
      de overige bij de aanmelding, bedoeld in [artikel 43][ref1], te verstrekken gegevens, de wijze waarop en de termijn
      waarbinnen de aanmelding en de doorgifte van wijzigingen geschieden;


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel43
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '43'
        hoofdstuk: VIII
  - number: 46.b
    text: |-
      de wijze waarop de administratie, bedoeld in [artikel 44][ref1], wordt gevoerd, en de termijn waarbinnen de
      gegevens en wijzigingen in de gegevens in deze administratie worden opgenomen;


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel44
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '44'
        hoofdstuk: VIII
  - number: 46.c
    text: |-
      de overige gegevens die de administratie, bedoeld in [artikel 44][ref1], bevat;


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel44
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '44'
        hoofdstuk: VIII
  - number: 46.d
    text: |-
      de gegevens die ingevolge [artikel 45][ref1] worden verstrekt en de wijze waarop en de termijn waarbinnen deze
      gegevens worden verstrekt; en


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel45
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '45'
        hoofdstuk: VIII
  - number: 46.e
    text: |-
      de gevallen waarin en de voorwaarden waaronder de [artikelen 43][ref1], [44][ref2] of [45][ref3] geheel of
      gedeeltelijk niet van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0019031#Artikel45
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '43'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0019031
        artikel: '44'
        hoofdstuk: VIII
      - id: ref3
        bwb_id: BWBR0019031
        artikel: '45'
        hoofdstuk: VIII
  - number: '47'
    text: |-
      De op grond van dit hoofdstuk bij te houden of te verstrekken gegevens worden desgevraagd ten genoegen van Onze
      Minister gestaafd met bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel47
  - number: '48'
    text: |-
      Dierlijke meststoffen worden vervoerd door een intermediair wiens onderneming in het kader waarvan het vervoer
      plaatsvindt overeenkomstig [artikel 38][ref1] is geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel38
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '38'
        hoofdstuk: VII
  - number: 48a
    text: |-
      Een intermediair laat dierlijke meststoffen slechts aanvoeren bij zijn intermediaire onderneming indien deze
      overeenkomstig [artikel 38][ref1] is geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel38
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '38'
        hoofdstuk: VII
  - number: '49.1'
    text: |-
      Het vervoer van een vracht drijfmest geschiedt met een transportmiddel dat is uitgerust met de krachtens
      [artikel 70, vierde lid, onderdeel b][ref1], voorgeschreven apparatuur die op naam van de intermediair is
      geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel70
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '70'
        hoofdstuk: X
  - number: '49.2'
    text: |-
      Het vervoer van een vracht dierlijke meststoffen geschiedt met een transportmiddel dat is uitgerust met op naam van
      de intermediair geregistreerde apparatuur voor automatische gegevensregistratie.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel49
  - number: '49.3'
    text: |-
      Het vervoer van een vracht dierlijke meststoffen geschiedt met een transportmiddel dat is uitgerust met
      satellietvolgapparatuur.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel49
  - number: '49.4'
    text: |-
      Met behulp van de in het tweede en derde lid bedoelde apparatuur worden gegevens betreffende het vervoer van de
      vracht dierlijke meststoffen vastgelegd.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel49
  - number: '50.1'
    text: |-
      Een vracht dierlijke meststoffen gaat tijdens het vervoer vergezeld van een op de vracht betrekking hebbend
      vervoersbewijs, dat overeenkomstig de regels gesteld bij of krachtens [paragraaf 2 van dit hoofdstuk][ref1] is
      opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#HoofdstukIX
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0019031
        hoofdstuk: IX
        paragraaf: '2'
  - number: '50.2'
    text: |-
      Een vracht zuiveringsslib, compost, mengsels van zuiveringsslib en compost, of krachtens
      [artikel 55, eerste lid][ref1], aangewezen overige organische meststoffen gaat tijdens het vervoer vergezeld
      van een op de vracht betrekking hebbend vervoersbewijs, dat overeenkomstig de regels, gesteld bij of krachtens
      [paragraaf 3 van dit hoofdstuk][ref2], is opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0019031#HoofdstukIX
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '55'
        hoofdstuk: IX
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0019031
        hoofdstuk: IX
        paragraaf: '3'
  - number: '51.1'
    text: |-
      De bij ministeriële regeling aangewezen categorieën vervoerders doen vóór het vervoer van dierlijke meststoffen
      plaatsvindt daarvan mededeling aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel51
  - number: '51.2'
    text: |-
      Onze Minister kan een vervoerder verplichten gedurende een door de minister te bepalen periode van ten hoogste één
      jaar, vóór het vervoer plaatsvindt daarvan steeds mededeling aan de minister te doen.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel51
  - number: '51.3'
    text: De in het tweede lid bedoelde periode kan telkens worden verlengd met één jaar.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel51
  - number: '51.4'
    text: |-
      Bij de ministeriële regeling kan worden voorgeschreven dat de mededeling, bedoeld in het eerste en tweede lid, op
      elektronische wijze geschiedt of vergezeld gaat van door de vervoerder te verstrekken bescheiden.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel51
  - number: '52.1'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel52
  - number: 52.1.a
    text: |-
      de gevallen waarin en voorwaarden waaronder de [artikelen 48][ref1] en [49][ref2] geheel of gedeeltelijk niet van
      toepassing zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel49
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '48'
        hoofdstuk: IX
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019031
        artikel: '49'
        hoofdstuk: IX
        paragraaf: '1'
  - number: 52.1.b
    text: |-
      de wijze waarop de apparatuur, bedoeld in [artikel 49][ref1], is bevestigd;


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel49
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '49'
        hoofdstuk: IX
        paragraaf: '1'
  - number: 52.1.c
    text: |-
      de eisen waaraan de apparatuur voor automatische gegevensregistratie, bedoeld in [artikel 49, tweede lid][ref1],
      en de satellietvolgapparatuur, bedoeld in [artikel 49, derde lid][ref2], moeten voldoen, waaronder de eis dat de
      apparatuur behoort tot een type dat is gekeurd door een door Onze Minister aangewezen instelling;


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel49
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '49'
        hoofdstuk: IX
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019031
        artikel: '49'
        hoofdstuk: IX
        paragraaf: '1'
  - number: 52.1.d
    text: |-
      de gegevens die met de in onderdeel c bedoelde apparatuur moeten worden vastgelegd en de wijze waarop die gegevens
      moeten worden vastgelegd, bewaard en verstrekt; en
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel52
  - number: 52.1.e
    text: |-
      de wijze waarop en de termijn waarbinnen de mededeling, bedoeld in [artikel 51][ref1], wordt gedaan, alsmede de
      gegevens die de mededeling ten minste bevat of de bescheiden waarvan de mededeling vergezeld gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel51
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '51'
        hoofdstuk: IX
        paragraaf: '1'
  - number: '52.2'
    text: |-
      De krachtens het eerste lid te stellen regels kunnen voor de in de regeling te onderscheiden mestsoorten en de
      beoogde bestemming van de meststoffen verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel52
  - number: '53.1'
    text: |-
      Terzake van het vervoer van een vracht dierlijke meststoffen wordt door de leverancier, de vervoerder en de afnemer
      gezamenlijk een vervoersbewijs opgemaakt.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel53
  - number: '53.2'
    text: |-
      De leverancier en de afnemer dragen er ieder voor zijn deel, en de vervoerder voor het geheel, zorg voor dat het
      vervoersbewijs overeenkomstig de krachtens [artikel 54][ref1] gestelde regels volledig en naar waarheid wordt
      ingevuld en ondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel54
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '54'
        hoofdstuk: IX
        paragraaf: '2'
  - number: '53.3'
    text: 'Het vervoersbewijs wordt bij ministeriële regeling vastgesteld en bevat in ieder geval gegevens over:'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel53
  - number: 53.3.a
    text: de leverancier, de vervoerder en de afnemer;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel53
  - number: 53.3.b
    text: het tijdstip en de locatie van laden en lossen;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel53
  - number: 53.3.c
    text: de hoeveelheid meststoffen; en
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel53
  - number: 53.3.d
    text: het soort meststoffen.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel53
  - number: '53.4'
    text: De gegevens op het vervoersbewijs worden niet gewijzigd of onleesbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel53
  - number: '53.5'
    text: |-
      Terzake van de ondertekening van het vervoersbewijs kunnen de leverancier, de vervoerder en de afnemer elkaar niet
      machtigen.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel53
  - number: '53.6'
    text: De op het vervoersbewijs ingevulde gegevens worden op elektronische wijze bij Onze Minister ingediend.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel53
  - number: '53.7'
    text: |-
      De vervoerder bewaart het vervoersbewijs en de leverancier en de afnemer bewaren een afschrift van
      het vervoersbewijs als onderdeel van de administratie, bedoeld in [artikel, 39][ref1]onderscheidenlijk
      [artikel 32][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel32
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '39'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0019031
        artikel: '32'
        hoofdstuk: VI
  - number: '54'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel54
  - number: 54.a
    text: de overige op het vervoersbewijs te vermelden gegevens;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel54
  - number: 54.b
    text: |-
      de wijze en het tijdstip waarop het vervoersbewijs door de leverancier, de vervoerder en de afnemer wordt opgemaakt
      en ondertekend;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel54
  - number: 54.c
    text: de overige ter zake van een vracht dierlijke meststoffen te verstrekken gegevens;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel54
  - number: 54.d
    text: |-
      de wijze en het tijdstip waarop de op het vervoersbewijs ingevulde gegevens alsmede de gegevens, bedoeld in
      onderdeel c, worden ingediend; en
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel54
  - number: 54.e
    text: |-
      de gevallen waarin en de voorwaarden waaronder [artikel 53][ref1] geheel of gedeeltelijk niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel53
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '53'
        hoofdstuk: IX
        paragraaf: '2'
  - number: '55.1'
    text: |-
      Ter zake van het vervoer van zuiveringsslib, compost en bij ministeriële regeling aangewezen overige organische
      meststoffen, wordt door de leverancier, de vervoerder en de afnemer gezamenlijk een vervoersbewijs opgemaakt.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel55
  - number: '55.2'
    text: |-
      De leverancier en de afnemer dragen er ieder voor zijn deel, en de vervoerder voor het geheel, zorg voor dat het
      vervoersbewijs overeenkomstig de krachtens [artikel 56][ref1] gestelde regels volledig en naar waarheid wordt
      ingevuld en ondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel56
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '56'
        hoofdstuk: IX
        paragraaf: '3'
  - number: '55.3'
    text: 'Het vervoersbewijs wordt bij ministeriële regeling vastgesteld en bevat in ieder geval gegevens over:'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel55
  - number: 55.3.a
    text: de leverancier, de vervoerder en de afnemer;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel55
  - number: 55.3.b
    text: de hoeveelheid meststoffen;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel55
  - number: 55.3.c
    text: de samenstelling van de meststoffen; en
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel55
  - number: 55.3.d
    text: de soort meststoffen.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel55
  - number: '55.4'
    text: |-
      [Artikel 53, vierde en vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel53
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '53'
        hoofdstuk: IX
        paragraaf: '2'
  - number: '55.5'
    text: De op het vervoersbewijs ingevulde gegevens worden op elektronische wijze bij Onze Minister ingediend.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel55
  - number: '55.6'
    text: |-
      De vervoerder bewaart het vervoersbewijs en de leverancier en de afnemer bewaren een afschrift van het
      vervoersbewijs als onderdeel van de administratie, bedoeld in de [artikelen 32][ref1], [39][ref2] of [44][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0019031#Artikel44
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '32'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0019031
        artikel: '39'
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0019031
        artikel: '44'
        hoofdstuk: VIII
  - number: '56'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel56
  - number: 56.a
    text: de overige op het vervoersbewijs te vermelden gegevens;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel56
  - number: 56.b
    text: |-
      de wijze en het tijdstip waarop het vervoersbewijs door de leverancier, de vervoerder en de afnemer wordt opgemaakt
      en ondertekend;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel56
  - number: 56.c
    text: de overige ter zake van de vervoerde meststoffen te verstrekken gegevens;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel56
  - number: 56.d
    text: |-
      de wijze en het tijdstip waarop de op het vervoersbewijs ingevulde gegevens alsmede de gegevens, bedoeld in
      onderdeel c, worden ingediend; en
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel56
  - number: 56.e
    text: |-
      de gevallen waarin en de voorwaarden waaronder [artikel 55][ref1] geheel of gedeeltelijk niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel55
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '55'
        hoofdstuk: IX
        paragraaf: '3'
  - number: '57'
    text: |-
      Een verwerker verwerkt de hoeveelheid dierlijke meststoffen, uitgedrukt in kilogrammen fosfaat, waarvoor hij met
      betrekking tot een kalenderjaar mestverwerkingsovereenkomsten heeft gesloten, binnen een bij ministeriële regeling
      te stellen periode.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel57
  - number: '58'
    text: |-
      Bij ministeriële regeling aan te wijzen soorten dierlijke meststoffen tellen niet mee voor het voldoen aan de
      verplichting, bedoeld in [artikel 33d, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel33d
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 33d
  - number: '59'
    text: |-
      Een overeenkomst gesloten tussen een landbouwer die op zijn bedrijf voor meer dan de helft dierlijke
      meststoffen, uitgedrukt in kilogrammen fosfaat, van kippen of kalkoenen produceert, en een landbouwer
      die op zijn bedrijf voor meer dan de helft dierlijke meststoffen, uitgedrukt in kilogrammen fosfaat, van
      één of meer andere diersoorten of diercategorieën produceert, geldt niet als overeenkomst als bedoeld in
      [artikel 33a, derde lid, onderdeel c, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel33a
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 33a
  - number: '60'
    text: 'Bij ministeriële regeling kunnen nadere regels worden gesteld inzake:'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel60
  - number: 60.a
    text: |-
      de gegevens, bedoeld in [artikel 33b, vijfde lid, van de wet][ref1], die moeten worden gemeld;


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel33b
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 33b
  - number: 60.b
    text: |-
      de elektronische melding, bedoeld in [artikel 33b, vijfde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel33b
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 33b
  - number: '61'
    text: |-
      Als huisvestingssysteem als bedoeld in [artikel 33a, tweede lid, onderdeel d, onder 1°, van de wet][ref1] wordt
      aangewezen een huisvestingssysteem waarbij minimaal tweederde van de oppervlakte van de leefruimte van de dieren is
      ingestrooid met stro.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel33a
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 33a
  - number: '65'
    text: |-
      De aantallen dieren en hoeveelheden meststoffen, diervoeders, melk en eieren, de fosfaattoestand van de bodem en de
      gewasopbrengst ter zake waarvan een landbouwer of een ondernemer ingevolge de bij of krachtens dit besluit gestelde
      regels gegevens in zijn administratie moet opnemen of gegevens moet verstrekken worden bepaald overeenkomstig dit
      hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel65
  - number: '66.1'
    text: |-
      De door graasdieren, niet zijnde melkkoeien, in een kalenderjaar op een bedrijf geproduceerde hoeveelheid dierlijke
      meststoffen wordt bepaald op basis van het gemiddelde aantal in het desbetreffende kalenderjaar op het bedrijf
      gehouden of anderszins aanwezige dieren, onderscheiden naar diersoort en diercategorieën per soort, voor zover dit
      onderscheid wordt gemaakt in de krachtens de [artikelen 36][ref1] of [70, derde lid][ref2], gestelde regels en op
      basis van forfaitaire productienormen, uitgedrukt in kilogrammen stikstof en in kilogrammen fosfaat, per dier per
      jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel70
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '36'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0019031
        artikel: '70'
        hoofdstuk: X
  - number: '66.2'
    text: |-
      De door melkkoeien in een kalenderjaar op een bedrijf geproduceerde hoeveelheid dierlijke meststoffen wordt
      bepaald op basis van het gemiddelde aantal in het desbetreffende kalenderjaar op het bedrijf gehouden of anderszins
      aanwezige melkkoeien en op basis van forfaitaire productienormen, uitgedrukt in kilogrammen stikstof en in
      kilogrammen fosfaat, per dier per jaar, onderscheiden naar de gemiddelde melkproductie per op het bedrijf aanwezige
      melkkoe en, voor zover het stikstof betreft, het gemiddelde ureumgehalte van de geproduceerde koemelk.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel66
  - number: '66.3'
    text: |-
      De door staldieren in een kalenderjaar op een bedrijf geproduceerde hoeveelheid dierlijke meststoffen wordt bepaald
      door achtereenvolgens:
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel66
  - number: 66.3.a
    text: 'bij elkaar op te tellen de hoeveelheden stikstof, onderscheidenlijk fosfaat in:'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel66
  - number: 66.3.a.1°
    text: de in het desbetreffende kalenderjaar op het bedrijf aangevoerde staldieren;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel66
  - number: 66.3.a.2°
    text: |-
      de in het desbetreffende kalenderjaar op het bedrijf aangevoerde of geproduceerde diervoeders bestemd voor de
      staldieren; en
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel66
  - number: 66.3.a.3°
    text: |-
      de aan het eind van het voorgaande kalenderjaar op het bedrijf aanwezige voorraden diervoeders bestemd voor de
      staldieren en door de staldieren geproduceerde eieren alsmede de aanwezige staldieren; en
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel66
  - number: 66.3.b
    text: |-
      de overeenkomstig onderdeel a berekende hoeveelheid te verminderen met de hoeveelheden stikstof, onderscheidenlijk
      fosfaat in:
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel66
  - number: 66.3.b.1°
    text: de in het desbetreffende kalenderjaar van het bedrijf afgevoerde staldieren;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel66
  - number: 66.3.b.2°
    text: |-
      de in het desbetreffende kalenderjaar van het bedrijf afgevoerde diervoeders, voor zover deze diervoeders voor de
      toepassing van dit artikel bij de hoeveelheid, bedoeld in het derde lid, onderdeel a, onder 2°, is betrokken;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel66
  - number: 66.3.b.3°
    text: de in het desbetreffende kalenderjaar van het bedrijf afgevoerde, door de staldieren geproduceerde eieren;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel66
  - number: 66.3.b.4°
    text: |-
      de in het desbetreffende kalenderjaar optredende gasvormige verliezen van stikstof uit de stal en de
      mestopslagruimte; en
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel66
  - number: 66.3.b.5°
    text: |-
      de aan het eind van het desbetreffende kalenderjaar op het bedrijf aanwezige voorraden diervoeders bestemd voor de
      staldieren en door de staldieren geproduceerde eieren alsmede de aanwezige staldieren.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel66
  - number: '67.1'
    text: |-
      De in [artikel 66, derde lid][ref1], bedoelde hoeveelheid stikstof en de hoeveelheid fosfaat in de op een bedrijf
      aan- of afgevoerde, dan wel de op het bedrijf aanwezige voorraden diervoeders worden bepaald op basis van het
      gewicht of het volume en het stikstofgehalte, onderscheidenlijk fosfaatgehalte van de desbetreffende diervoeders.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel66
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '66'
        hoofdstuk: X
  - number: '67.2'
    text: |-
      De in [artikel 66, derde lid][ref1], bedoelde hoeveelheid stikstof en de hoeveelheid fosfaat in de op een bedrijf
      geproduceerde diervoeders worden bepaald op basis van een forfaitaire opbrengst per hectare in kilogrammen en
      forfaitaire stikstofgehalten, onderscheidenlijk fosfaatgehalten per kilogram diervoeder.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel66
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '66'
        hoofdstuk: X
  - number: '67.3'
    text: |-
      De in [artikel 66, derde lid][ref1], bedoelde hoeveelheid stikstof en de hoeveelheid fosfaat in de staldieren
      worden bepaald op basis van forfaitaire stikstofgehalten, onderscheidenlijk fosfaatgehalten per dier, dan wel op
      basis van het gewicht van de dieren en op basis van forfaitaire stikstofgehalten, onderscheidenlijk fosfaatgehalten
      per kilogram levend gewicht.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel66
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '66'
        hoofdstuk: X
  - number: '67.4'
    text: |-
      De in [artikel 66, derde lid][ref1], bedoelde hoeveelheid stikstof en de hoeveelheid fosfaat in door staldieren
      geproduceerde eieren worden bepaald op basis van het gewicht van de eieren en op basis van forfaitaire
      stikstofgehalten, onderscheidenlijk fosfaatgehalten per kilogram product.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel66
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '66'
        hoofdstuk: X
  - number: '67.5'
    text: |-
      De in [artikel 66, derde lid][ref1], bedoelde hoeveelheid stikstof die in gasvorm verloren gaat wordt bepaald op
      basis van het gemiddelde aantal in het desbetreffende kalenderjaar op het bedrijf gehouden of anderszins aanwezige
      dieren en forfaitaire stikstofgehalten per dier.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel66
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '66'
        hoofdstuk: X
  - number: '68.1'
    text: |-
      De op een bedrijf of onderneming in het kader waarvan meststoffen worden verhandeld aangevoerde hoeveelheid
      meststoffen, de van een bedrijf of onderneming afgevoerde hoeveelheid meststoffen en de binnen een onderneming in
      het kader waarvan meststoffen worden verhandeld vervoerde hoeveelheid meststoffen worden bepaald op basis van het
      gewicht of het volume en het stikstofgehalte, onderscheidenlijk fosfaatgehalte van de desbetreffende meststoffen.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel68
  - number: '68.2'
    text: |-
      De in enig kalenderjaar op een bedrijf per saldo uit opslag gekomen hoeveelheid dierlijke meststoffen wordt bepaald
      door de aan het eind van het voorgaande kalenderjaar op het bedrijf opgeslagen hoeveelheid dierlijke meststoffen
      te verminderen met de aan het eind van desbetreffend kalenderjaar op het bedrijf opgeslagen hoeveelheid dierlijke
      meststoffen.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel68
  - number: '68.3'
    text: |-
      De op een bedrijf waar dierlijke meststoffen worden geproduceerd opgeslagen hoeveelheid dierlijke meststoffen wordt
      bepaald op basis van het zo nauwkeurig mogelijk bepaalde gewicht van de dierlijke meststoffen en het zo nauwkeurig
      mogelijk bepaalde stikstofgehalte, onderscheidenlijk fosfaatgehalte van de desbetreffende meststoffen.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel68
  - number: '68.4'
    text: |-
      De op een bedrijf als bedoeld in het derde lid opgeslagen hoeveelheid overige meststoffen wordt bepaald op basis
      van het gewicht of het volume en het stikstofgehalte, onderscheidenlijk fosfaatgehalte van de desbetreffende
      meststoffen.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel68
  - number: '68.5'
    text: |-
      De op een onderneming in het kader waarvan meststoffen worden verhandeld of op een bedrijf waar geen dierlijke
      meststoffen worden geproduceerd opgeslagen hoeveelheid meststoffen wordt bepaald op basis van het gewicht of het
      volume en het stikstofgehalte, onderscheidenlijk fosfaatgehalte van de desbetreffende meststoffen.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel68
  - number: '69.1'
    text: |-
      Het gemiddelde aantal in een kalenderjaar op een bedrijf gehouden varkens, kippen en kalkoenen, onderscheiden
      naar diercategorieën per soort overeenkomstig [bijlage II van de wet][ref1], alsmede runderen, onderscheiden
      naar diercategorie, voor zover dit onderscheid wordt gemaakt in de krachtens de [artikelen 36][ref2] of
      [70, derde lid][ref3], gestelde regels, wordt bepaald door de som van de dagelijkse aanwezige aantallen van deze
      dieren, te delen door het aantal dagen van het desbetreffende kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0019031#Artikel70
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0004054
      - id: ref2
        bwb_id: BWBR0019031
        artikel: '36'
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0019031
        artikel: '70'
        hoofdstuk: X
  - number: '69.2'
    text: |-
      Het gemiddelde aantal in een kalenderjaar voor gebruiks- en winstdoeleinden op het bedrijf gehouden dan wel
      anderszins aanwezige dieren, anders dan runderen, varkens, kippen en kalkoenen, onderscheiden naar diersoorten
      en diercategorieën per soort, voor zover dit onderscheid wordt gemaakt in de krachtens de [artikelen 36][ref1] of
      [70][ref2] gestelde regels, wordt bepaald door de som van de op de eerste dag van iedere maand aanwezige aantallen
      van deze dieren, te delen door twaalf.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel70
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '36'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0019031
        artikel: '70'
        hoofdstuk: X
  - number: 69a
    text: |-
      Bij ministeriële regeling worden regels gesteld over de bepaling van de fosfaattoestand van de
      bodem en van de gewasopbrengst, voor zover deze relevant is voor de toepassing van de krachtens
      [artikel 10, eerste lid, van de wet][ref1] vastgestelde ministeriële regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel10
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel69a
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '10'
  - number: '70.1'
    text: 'Bij ministeriële regeling worden vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel70
  - number: 70.1.a
    text: |-
      de forfaitaire productienormen, bedoeld in [artikel 66, eerste en tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel66
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '66'
        hoofdstuk: X
  - number: 70.1.b
    text: |-
      de forfaitaire gewasopbrengsten per hectare, bedoeld in [artikel 67, tweede lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel67
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '67'
        hoofdstuk: X
  - number: 70.1.c
    text: |-
      de forfaitaire stikstofgehalten, onderscheidenlijk fosfaatgehalten, bedoeld in
      [artikel 67, tweede tot en met vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel67
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '67'
        hoofdstuk: X
  - number: '70.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de gevallen waarin, de voorwaarden waaronder en de
      wijze waarop:
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel70
  - number: 70.2.a
    text: |-
      de hoeveelheid stikstof en de hoeveelheid fosfaat van de bij die regeling te onderscheiden diervoeders in zoverre
      in afwijking van [artikel 67, eerste lid][ref1], wordt bepaald op basis van de bij die regeling vast te stellen
      forfaitaire stikstofgehalten, onderscheidenlijk fosfaatgehalten; en


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel67
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '67'
        hoofdstuk: X
  - number: 70.2.b
    text: |-
      de hoeveelheid aangevoerde of afgevoerde dierlijke meststoffen in zoverre in afwijking van [artikel 68][ref1],
      wordt bepaald op basis van de bij die regeling vast te stellen forfaitaire stikstofgehalten onderscheidenlijk
      fosfaatgehalten.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel68
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '68'
        hoofdstuk: X
  - number: '70.3'
    text: |-
      De in het eerste en tweede lid bedoelde forfaits kunnen onderscheiden naar mestvorm, diersoort en diercategorie en
      bedrijfssysteem verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel70
  - number: '70.4'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot devaststellingen ten behoeve van de
      bepaling van de hoeveelheden, bedoeld in de [artikelen 66][ref1], [67][ref2], [68][ref3] en [69][ref4] en ten
      behoeve van de bepaling van de fosfaattoestand en de gewasopbrengst, bedoeld in [artikel 69a][ref5]. Deze regels
      kunnen betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0019031#Artikel68
      [ref4]: https://wetten.overheid.nl/BWBR0019031#Artikel69
      [ref5]: https://wetten.overheid.nl/BWBR0019031#Artikel69a
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '66'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0019031
        artikel: '67'
        hoofdstuk: X
      - id: ref3
        bwb_id: BWBR0019031
        artikel: '68'
        hoofdstuk: X
      - id: ref4
        bwb_id: BWBR0019031
        artikel: '69'
        hoofdstuk: X
      - id: ref5
        bwb_id: BWBR0019031
        artikel: 69a
        hoofdstuk: X
  - number: 70.4.a
    text: |-
      de methode van gewichtsbepaling, volumebepaling, bemonstering, analyse en bepaling van het ureumgehalte van
      koemelk;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel70
  - number: 70.4.b
    text: de ten behoeve van de vaststelling te gebruiken apparatuur;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel70
  - number: 70.4.c
    text: |-
      de bevoegdheid tot het doen van de vaststelling, welke bevoegdheid kan worden verbonden aan een door Onze Minister
      overeenkomstig bij die regeling gestelde erkenningsvoorwaarden verleende erkenning;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel70
  - number: 70.4.d
    text: |-
      de plaats, het moment en de frequentie van vaststelling, daaronder begrepen tellingen voor de vaststelling van het
      gemiddelde aantal dieren; en
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel70
  - number: 70.4.e
    text: de verantwoording van de vaststellingen.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel70
  - number: 70a.1
    text: |-
      Het melkveefosfaatoverschot dat in enig jaar voor mestverwerking als bedoeld in
      [artikel 21, tweede lid, onderdeel d, van de wet][ref1] in aanmerking komt is het melkveefosfaatoverschot dat in
      het jaar 2014 is ontstaan, vermeerderd met:


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel21
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel70a
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '21'
  - number: 70a.1.a
    text: |-
      ten hoogste 100% van het aantal additionele kilogrammen fosfaat dat in dat jaar ten opzichte van het jaar 2014 met
      melkvee wordt geproduceerd indien het overschot per hectare lager is dan 20 kg/ha;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel70a
  - number: 70a.1.b
    text: |-
      ten hoogste 75% van het aantal additionele kilogrammen fosfaat dat in dat jaar ten opzichte van het jaar 2014 met
      melkvee wordt geproduceerd indien het overschot per hectare gelijk is aan of hoger is dan 20kg/ha en gelijk is aan
      of lager is dan 50 kg/ha;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel70a
  - number: 70a.1.c
    text: |-
      ten hoogste 50% van het aantal additionele kilogrammen fosfaat dat in dat jaar ten opzichte van het jaar 2014 met
      melkvee wordt geproduceerd indien het overschot per hectare hoger is dan 50 kg/ha.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel70a
  - number: 70a.2
    text: |-
      Het overschot per hectare, bedoeld in het eerste lid wordt berekend door de productie van dierlijke meststoffen
      door melkvee op een bedrijf in kilogrammen fosfaat in het voorgaande kalenderjaar, verminderd met de fosfaatruimte
      van het bedrijf in het voorgaande kalenderjaar te delen door het aantal hectaren tot het bedrijf behorende
      oppervlakte landbouwgrond in het voorgaande kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel70a
  - number: 70a.3
    text: 'Het eerste lid is niet van toepassing op een bedrijf dat:'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel70a
  - number: 70a.3.a
    text: |-
      voor 1 februari 2016 aantoont dat het voor 30 maart 2015 financiële verplichtingen is aangegaan ten einde het
      gehele melkveefosfaatoverschot te laten verwerken, waardoor naleving van het eerste lid leidt tot disproportionele
      financiële last en
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel70a
  - number: 70a.3.b
    text: |-
      het bedrijf binnen drie maanden na afloop van elk kalenderjaar aantoont dat het melkveefosfaatoverschot is verwerkt
      door degene met wie de financiële verplichtingen, bedoeld in onderdeel a, is aangegaan.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel70a
  - number: '71.1'
    text: |-
      Voor de toepassing van de krachtens [artikel 11, zesde lid, van de wet][ref1] gestelde regels meldt de landbouwer
      zijn bedrijf uiterlijk 31 december van het desbetreffende jaar aan bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel11
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '11'
  - number: '71.2'
    text: |-
      De in het eerste lid bedoelde melding vindt plaats door indiening van het volledig en naar waarheid ingevulde en
      ondertekende daartoe bestemde formulier, dat door Onze Minister wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel71
  - number: '72.1'
    text: |-
      Op verzoek van een landbouwer met een nieuw gestart bedrijf, verhoogt Onze Minister het fosfaatrecht, bedoeld in
      [artikel 23, derde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel23
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '23'
  - number: '72.2'
    text: 'Een nieuw gestart bedrijf als bedoeld in het eerste lid, is een bedrijf dat aantoonbaar:'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel72
  - number: 72.2.a
    text: |-
      beschikt over een voor 2 juli 2015 aan de landbouwer verleende omgevingsvergunning voor het oprichten van een
      bedrijf voor het houden van melkvee of over een voor 2 juli 2015 door de landbouwer ingediende melding als bedoeld
      in [artikel 1.10 van het Activiteitenbesluit Milieubeheer][ref1] voor het houden van melkvee;


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '1'
  - number: 72.2.b
    text: onomkeerbare financiële verplichtingen is aangegaan voor 2 juli 2015;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel72
  - number: 72.2.c
    text: tussen 1 januari 2014 en 2 juli 2015 is gestart met de productie van melk bestemd voor consumptie of verwerking;
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel72
  - number: 72.2.d
    text: |-
      op 1 januari 2018 minimaal 15 melk- en kalfkoeien hield als bedoeld in
      [artikel 1, eerste lid, onderdeel kk, onder 1°, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel1
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '1'
  - number: 72.2.e
    text: |-
      geen aanspraak maakt op rechten uit hoofde van [artikel 23, vierde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel23
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '23'
  - number: '72.3'
    text: |-
      De verhoging, bedoeld in het eerste lid, is 50 procent van het verschil tussen het aantal kilogrammen fosfaat
      dat uit hoofde van [artikel 23, derde lid, van de wet][ref1] is vastgesteld en het aantal kilogrammen fosfaat dat
      redelijkerwijs in een kalenderjaar met op 2 juli 2015 aanwezige stalcapaciteit voor melkvee geproduceerd had kunnen
      worden.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel23
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '23'
  - number: '72.4'
    text: |-
      De verhoging, bedoeld in het eerste lid, vindt niet plaats indien het verschil, bedoeld in het tweede lid, kleiner
      is dan 10 procent.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel72
  - number: '72.5'
    text: |-
      Het verzoek, bedoeld in het eerste lid, wordt voor 1 april 2018 ingediend met gebruikmaking van een door Onze
      Minister elektronisch beschikbaar gesteld middel.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel72
  - number: 72a.1
    text: |-
      Indien op een bedrijf op 2 juli 2015 tijdelijk minder melkvee werd gehouden of over minder fosfaatruimte
      werd beschikt door de realisatie van een natuurgebied of de aanleg of onderhoud van publieke
      infrastructuur, verhoogt Onze Minister op verzoek van de landbouwer het fosfaatrecht dat uit hoofde van
      [artikel 23, derde lid, van de wet][ref1], wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel23
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel72a
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '23'
  - number: 72a.2
    text: |-
      De verhoging, bedoeld in het eerste lid, bedraagt het aantal kilogrammen fosfaat waarvan de landbouwer aannemelijk
      heeft gemaakt dat deze zonder de in het eerste lid omschreven omstandigheden in de vaststelling van het
      fosfaatrecht zouden zijn betrokken.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel72a
  - number: 72a.3
    text: |-
      De verhoging, bedoeld in het eerste lid, vindt niet plaats indien deze kleiner is dan 5 procent van het
      fosfaatrecht dat wordt vastgesteld uit hoofde van [artikel 23, derde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel23
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel72a
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '23'
  - number: 72a.4
    text: |-
      Het verzoek, bedoeld in het eerste lid, wordt voor 1 april 2018 ingediend met gebruikmaking van een door Onze
      Minister elektronisch beschikbaar gesteld middel.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel72a
  - number: 72b.1
    text: |-
      Het fosfaatrecht, bedoeld in [artikel 23, derde en zesde lid][ref1], en de verhoging van het fosfaatrecht, bedoeld
      in artikel 23, vierde en negende lid, van de wet, wordt verminderd met 8,3 procent.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel23
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel72b
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '23'
  - number: 72b.2
    text: |-
      Het eerste lid is niet van toepassing op een bedrijf waarvan de productie van dierlijke meststoffen door melkvee
      in kilogrammen fosfaat in het kalenderjaar 2015, verminderd met de fosfaatruimte in dat kalenderjaar, negatief of
      nul is.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel72b
  - number: 72b.3
    text: |-
      Bij de toepassing van het percentage, bedoeld in het eerste lid, wordt, het fosfaatrecht slechts verminderd voor
      zover een gehele uitoefening van het fosfaatrecht de fosfaatruimte in het kalenderjaar 2015 van dat bedrijf te
      boven gaat.
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel72b
  - number: '73.1'
    text: |-
      De hoogte van de op grond van [artikel 62, tweede lid, van de wet][ref1] te bepalen bestuurlijke boete bedraagt
      voor de volgende categorieën:


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel62
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '62'
  - number: 73.1.a
    text: 'niet op de voorgeschreven wijze administreren, registreren, melden of invullen van gegevens: € 50;'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel73
  - number: 73.1.b
    text: 'niet tijdig administreren, registreren, melden of indienen: € 100;'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel73
  - number: 73.1.c
    text: 'niet volledig administreren, registreren, melden of invullen of niet ondertekenen: € 200;'
    url: https://wetten.overheid.nl/BWBR0019031/2018-01-01#Artikel73
