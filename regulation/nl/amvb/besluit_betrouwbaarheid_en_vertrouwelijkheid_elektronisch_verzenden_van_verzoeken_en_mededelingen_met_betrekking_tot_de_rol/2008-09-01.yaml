articles:
  - number: '1'
    text: >-
      Aan de betrouwbaarheid en vertrouwelijkheid van het elektronisch verzenden van verzoeken en mededelingen met
      betrekking tot de rol worden de volgende eisen gesteld:


      a. een gerecht gebruikt een systeem voor gegevensverwerking dat in staat is om de verzender te identificeren en na
      te gaan of een bericht authentiek is en daadwerkelijk afkomstig is van de verzender;


      b. een gerecht gebruikt een systeem voor gegevensverwerking dat in staat is om te controleren of het bericht
      volledig is en niet onbevoegdelijk is gewijzigd;


      c. een gerecht gebruikt een systeem voor gegevensverwerking dat volgens nationale en internationale standaarden
      voor informatiebeveiliging ingericht is.
    url: https://wetten.overheid.nl/BWBR0024155/2008-09-01#Artikel1
  - number: '2'
    text: >-
      Een gerecht bevestigt onverwijld elektronisch de ontvangst van elektronisch verzonden verzoeken en mededelingen
      aangaande de rol.
    url: https://wetten.overheid.nl/BWBR0024155/2008-09-01#Artikel2
  - number: '3'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop de
      [Wet afschaffing procuraat en invoering elektronisch berichtenverkeer][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0023725
    url: https://wetten.overheid.nl/BWBR0024155/2008-09-01#Artikel3
