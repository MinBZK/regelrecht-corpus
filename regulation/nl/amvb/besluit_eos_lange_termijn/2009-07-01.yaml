---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_eos_lange_termijn
regulatory_layer: AMVB
publication_date: '2009-10-22'
valid_from: '2009-07-01'
bwb_id: BWBR0017234
url: https://wetten.overheid.nl/BWBR0017234/2009-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 3 februari 2004, nr. WJZ 4005807;

    Gelet op artikel 3 van de Kaderwet EZ-subsidies;

    De Raad van State gehoord (advies van 12 maart 2004, nr. W10.04.0056/II);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 20 september 2004, nr. WJZ 4057440;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel1
  - number: 1.1.a
    text: |-
      ondernemer: een natuurlijke persoon of rechtspersoon, niet zijnde een rechtspersoon die krachtens publiekrecht is
      ingesteld, die een onderneming in stand houdt;
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel1
  - number: 1.1.b
    text: 'groep: een economische eenheid, waarin organisatorisch zijn verbonden:'
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel1
  - number: 1.1.b.1°
    text: |-
      een natuurlijke persoon of privaatrechtelijke rechtspersoon, die direct of indirect: - meer dan de helft van het
      geplaatste kapitaal verschaft aan,
        - volledig aansprakelijk vennoot is van of
        - overwegende zeggenschap heeft over een of meer rechtspersonen of vennootschappen, en
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel1
  - number: 1.1.b.2°
    text: laatstbedoelde rechtspersonen of vennootschappen;
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel1
  - number: 1.1.c
    text: |-
      samenwerkingsverband: een geen rechtspersoonlijkheid bezittend verband, bestaande uit ten minste twee, niet in een
      groep verbonden natuurlijke personen of rechtspersonen;
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel1
  - number: 1.1.d
    text: 'project: lange termijn-project of neo-project;'
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel1
  - number: 1.1.e
    text: |-
      lange termijn-project: een nieuw, planmatig geheel van activiteiten, bestaande uit fundamenteel of industrieel
      onderzoek, of een combinatie van beide, naar een duurzame energiehuishouding, waarvan de onderzoeksresultaten naar
      verwachting niet eerder dan na tien jaar na het tijdstip van subsidieverlening in de markt worden of kunnen worden
      toegepast;
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel1
  - number: 1.1.f
    text: |-
      neo-project: een nieuw, planmatig geheel van activiteiten, bestaande uit een haalbaarheidsstudie, fundamenteel
      of industrieel onderzoek, of een combinatie van fundamenteel en industrieel onderzoek, met betrekking tot een
      innovatief, niet-conventioneel idee voor energietechniek, dat een duurzame energiehuishouding stimuleert, dat kan
      leiden tot een nieuw onderzoeksgebied of een nieuwe richting binnen een bestaand onderzoeksgebied en dat een hoge
      technologische risicograad heeft;
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel1
  - number: 1.1.g
    text: |-
      haalbaarheidsstudie: het tot stand brengen van een schriftelijk rapport, inhoudende een systematisch opgezette
      en afgeronde analyse alsmede een inschatting van de technische mogelijkheden van fundamenteel of industrieel
      onderzoek, of een combinatie van fundamenteel en industrieel onderzoek;
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel1
  - number: 1.1.h
    text: |-
      duurzame energiehuishouding: energiehuishouding die economisch efficiënt is, het milieu minder zwaar belast of
      voorziet in beschikbaarheid van energie in voldoende mate en van voldoende kwaliteit;
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel1
  - number: 1.1.i
    text: |-
      fundamenteel onderzoek: onderzoek, gericht op het uitbreiden van de algemene wetenschappelijke en technische
      kennis, zonder industriële of commerciële doelstellingen;
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel1
  - number: 1.1.j
    text: |-
      industrieel onderzoek: het opdoen van nieuwe kennis met het doel deze te gebruiken bij de ontwikkeling van nieuwe
      producten, processen of diensten of om bestaande producten, processen of diensten aanmerkelijk te verbeteren;
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel1
  - number: 1.1.k
    text: 'kennisinstelling:'
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel1
  - number: 1.1.k.1°
    text: |-
      een onder a of b van de [bijlage van de Wet op het hoger onderwijs en wetenschappelijk onderzoek](onbekend)
      genoemde instelling voor hoger onderwijs;
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel1
  - number: 1.1.k.2°
    text: |-
      een andere dan onder 1° bedoelde geheel of gedeeltelijk door de rijksoverheid gefinancierde onderzoeksinstelling
      die activiteiten verricht met als doel de algemene wetenschappelijke en technische kennis uit te breiden;
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel1
  - number: 1.1.k.3°
    text: |-
      een geheel of gedeeltelijk door een andere staat gefinancierde openbare instelling voor hoger onderwijs
      gelijkwaardig aan een instelling als bedoeld onder 1°, of
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel1
  - number: 1.1.k.4°
    text: |-
      een geheel of gedeeltelijk door een andere staat gefinancierde onderzoeksinstelling die activiteiten verricht met
      als doel de algemene wetenschappelijke en technische kennis uit te breiden.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel1
  - number: '1.2'
    text: Bij regeling van Onze Minister kunnen activiteiten worden aangewezen die niet tot een project worden gerekend.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel1
  - number: '1.3'
    text: |-
      Bij regeling van Onze Minister kunnen ondernemers en kennisinstellingen worden uitgesloten van subsidiëring op
      grond van dit besluit.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel1
  - number: '1.4'
    text: |-
      Bij regeling van Onze Minister kunnen andere dan de in het eerste lid, onder h, bedoelde instellingen als
      kennisinstelling worden aangewezen die ten minste gelijkwaardig zijn aan een instelling voor hoger onderwijs als
      genoemd onder f, g en h van de [bijlage van de Wet op het hoger onderwijs en wetenschappelijk onderzoek](onbekend).
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel1
  - number: '2.1'
    text: 'Onze Minister verstrekt op aanvraag een subsidie aan:'
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel2
  - number: 2.1.a
    text: |-
      een in Nederland gevestigde ondernemer of kennisinstelling die voor eigen rekening en risico een lange termijn-
      project uitvoert dat past in een onderzoeksprogramma;
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel2
  - number: 2.1.b
    text: |-
      de in Nederland gevestigde deelnemers in een samenwerkingsverband die voor gezamenlijke rekening en risico een
      lange termijn-project uitvoeren dat past in een onderzoeksprogramma;
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel2
  - number: 2.1.c
    text: degene die in Nederland voor eigen rekening en risico een neo-project uitvoert dat past in een onderzoeksprogramma;
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel2
  - number: 2.1.d
    text: |-
      de deelnemers in een samenwerkingsverband die in Nederland voor gezamenlijke rekening en risico een neo-project
      uitvoeren dat past in een onderzoeksprogramma.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel2
  - number: '2.2'
    text: |-
      Als onderzoeksprogramma’s worden aangewezen de door Onze Minister vast te stellen programma’s met betrekking tot de
      volgende gebieden of combinaties daarvan:
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel2
  - number: 2.2.a
    text: biomassa;
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel2
  - number: 2.2.b
    text: nieuw gas/schoon fossiel;
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel2
  - number: 2.2.c
    text: energie-efficiëntie in de industriële en agrarische sector;
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel2
  - number: 2.2.d
    text: gebouwde omgeving;
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel2
  - number: 2.2.e
    text: opwekking en netten;
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel2
  - number: 2.2.f
    text: nieuw energieonderzoek.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel2
  - number: '2.3'
    text: |-
      Indien de aanvragers deelnemers in een samenwerkingsverband zijn, wordt de subsidie verstrekt aan de in Nederland
      gevestigde deelnemers gezamenlijk en betaald aan de deelnemer die als indiener van de aanvraag om subsidie in de
      zin van dit besluit is opgetreden.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel2
  - number: '2.4'
    text: 'Geen subsidie wordt verstrekt:'
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel2
  - number: 2.4.a
    text: indien voor het project reeds door Onze Minister subsidie is verstrekt;
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel2
  - number: 2.4.b
    text: aan een overheid of overheidsinstelling, tenzij het een kennisinstelling betreft;
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel2
  - number: 2.4.c
    text: |-
      voor zover door verlening van de subsidie in het kalenderjaar waarin de beschikking wordt gegeven aan de aanvrager
      dan wel aan de tot dezelfde groep als de aanvrager behorende ondernemers meer dan een bij regeling van Onze
      Minister vast te stellen bedrag aan subsidie op grond van dit besluit zou worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel2
  - number: '3.1'
    text: |-
      De subsidie bedraagt 100 procent van de projectkosten voor zover deze betrekking hebben op fundamenteel onderzoek,
      maar niet meer dan een bij regeling van Onze Minister vast te stellen bedrag. Daarbij kan de hoogte van het
      subsidiepercentage, genoemd in de eerste volzin, per periode als bedoeld in [artikel 6][ref1] op een lager
      percentage worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0017234#Artikel6
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017234
        artikel: '6'
        paragraaf: '2'
  - number: '3.2'
    text: |-
      De subsidie bedraagt 50 procent van de projectkosten voor zover deze betrekking hebben op industrieel onderzoek,
      maar niet meer dan een bij regeling van Onze Minister vast te stellen bedrag. Daarbij kan de hoogte van het
      subsidiepercentage, genoemd in de eerste volzin, per periode als bedoeld in [artikel 6][ref1] op een lager
      percentage worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0017234#Artikel6
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017234
        artikel: '6'
        paragraaf: '2'
  - number: '3.3'
    text: |-
      Indien de subsidiabele projectkosten betrekking hebben op zowel fundamenteel als industrieel onderzoek, bedraagt
      de subsidie het gewogen gemiddelde van de in het eerste en tweede lid genoemde percentages van de desbetreffende
      subsidiabele projectkosten, maar niet meer dan een bij regeling van Onze Minister vast te stellen bedrag.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel3
  - number: '3.4'
    text: |-
      De subsidie bedraagt 100 procent van de projectkosten voor zover deze betrekking hebben op een haalbaarheidsstudie
      voorafgaand aan fundamenteel onderzoek en 75 procent van de projectkosten voor zover deze betrekking hebben op een
      haalbaarheidsstudie voorafgaand aan industrieel onderzoek, maar niet meer dan een bij regeling van Onze Minister
      vast te stellen bedrag. Daarbij kan de hoogte van de subsidiepercentages, genoemd in de eerste volzin, per periode
      als bedoeld in [artikel 6][ref1] op een lager percentage worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0017234#Artikel6
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017234
        artikel: '6'
        paragraaf: '2'
  - number: '3.5'
    text: |-
      Het in het tweede lid genoemde percentage wordt met 10 procentpunten verhoogd, indien de aanvrager een ondernemer
      is die een kleine of middelgrote onderneming in stand houdt in de zin van [verordening (EG) nr. 70/2001]
      (32001R0070) van de Commissie van de Europese Gemeenschappen van 12 januari 2001 betreffende de toepassing van de
      artikelen 87 en 88 van het EG-Verdrag op staatssteun voor kleine en middelgrote ondernemingen (PbEG L 10), naar
      de tekst zoals deze bij die verordening is vastgesteld en voor zover de projectkosten worden gemaakt en betaald
      door de ondernemer. Indien subsidie wordt verstrekt aan deelnemers in een samenwerkingsverband is de eerste volzin
      van overeenkomstige toepassing voor zover de projectkosten worden gemaakt en betaald door een deelnemer die een
      onderneming is als bedoeld in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel3
  - number: '3.6'
    text: |-
      Onverminderd het vijfde lid wordt het in het tweede lid genoemde percentage met 10 procentpunten verhoogd, indien
      subsidie wordt verstrekt aan deelnemers in een samenwerkingsverband, indien:
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel3
  - number: 3.6.a
    text: zich onder deze deelnemers ten minste één kennisinstelling en ten minste één ondernemer bevinden, of
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel3
  - number: 3.6.b
    text: |-
      ten minste één deelnemer in het samenwerkingsverband in een andere lidstaat van de Europese Unie dan Nederland is
      gevestigd en niet behoort tot een groep van een in Nederland gevestigde deelnemer en deze deelnemer een wezenlijke
      bijdrage levert aan het project.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel3
  - number: '3.7'
    text: |-
      Indien ter zake van de projectkosten of een deel daarvan reeds door een ander bestuursorgaan of door de Commissie
      van de Europese Gemeenschappen subsidie is verstrekt, wordt slechts een zodanig bedrag aan subsidie verstrekt,
      dat het totale bedrag aan subsidies uitgedrukt in een percentage van de projectkosten, niet meer bedraagt dan het
      ingevolge het eerste tot en met zesde lid geldende percentage.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel3
  - number: '4.1'
    text: 'Als projectkosten worden uitsluitend in aanmerking genomen:'
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel4
  - number: 4.1.a
    text: |-
      de volgende rechtstreeks aan de uitvoering van het project toe te rekenen, na de indiening van de aanvraag door de
      subsidie-ontvanger gemaakte en betaalde kosten:
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel4
  - number: 4.1.a.1°
    text: |-
      loonkosten, met dien verstande dat wordt uitgegaan van een uurloon, berekend op basis van het jaarloon bij een
      volledige dienstbetrekking volgens de kolom «loon voor de loonbelasting» van de loonstaat van het betrokken directe
      personeel, verhoogd met de wettelijke dan wel de op grond van een individuele of collectieve arbeidsovereenkomst
      verschuldigde opslagen voor sociale lasten, en van 1650 productieve uren per jaar;
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel4
  - number: 4.1.a.2°
    text: |-
      kosten van aangeschafte machines en apparatuur, met dien verstande dat wordt uitgegaan van de aan het project toe
      te rekenen afschrijvingskosten, berekend op basis van de historische aanschafprijzen en de door de belastingdienst
      geaccepteerde afschrijvingstermijnen, met uitzondering van mogelijkheden tot vervroegde afschrijving, of lease-
      termijnen, met uitzondering van financieringskosten, en gebaseerd op de bedrijfseconomische levensduur;
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel4
  - number: 4.1.a.3°
    text: kosten van verbruikte materialen en hulpmiddelen, gebaseerd op historische aanschafprijzen;
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel4
  - number: 4.1.a.4°
    text: |-
      andere aan derden verschuldigde kosten, met uitzondering van: - behoudens voorafgaande schriftelijke ontheffing van
      Onze Minister: die kosten van activiteiten van het project die zijn uitbesteed aan een niet in Nederland gevestigde
      kennisinstelling of ondernemer, indien een in Nederland gevestigde instelling of ondernemer over ten minste
      gelijkwaardige kennis en middelen beschikt om de bedoelde activiteiten uit te voeren;
        - binnenlandse reis- en verblijfkosten;
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel4
  - number: 4.1.b
    text: een opslag voor algemene kosten, groot 50 procent van de onder a, onder 1°, bedoelde kosten.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel4
  - number: '4.2'
    text: |-
      Kosten van machines en apparatuur die niet uitsluitend voor het project zijn aangeschaft, worden slechts als
      projectkosten op de voet van het eerste lid, onder a, onder 2°, in aanmerking genomen, indien een door middel van
      een sluitende tijdschrijving vastgestelde urenverantwoording per machine respectievelijk van de apparatuur aanwezig
      is.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel4
  - number: '4.3'
    text: |-
      Indien geen loonkosten als bedoeld in het eerste lid, onder a, onder 1°, worden gemaakt, maar niettemin arbeid
      ten behoeve van het project wordt verricht, wordt voor de berekening van de projectkosten uitgegaan van een bij
      regeling van Onze Minister vast te stellen uurtarief.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel4
  - number: '4.4'
    text: |-
      Bij regeling van Onze Minister kan aan de kosten, bedoeld in het eerste lid, onder a, onder 4°, een maximum worden
      verbonden en kunnen regels worden gesteld over daartoe te rekenen categorieën van kosten.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel4
  - number: '4.5'
    text: |-
      De kosten worden in aanmerking genomen met inbegrip van omzetbelasting, indien de subsidie-ontvanger die de kosten
      heeft gemaakt omzetbelasting niet in aftrek kan brengen.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel4
  - number: '4.6'
    text: Aan een ontheffing als bedoeld in het eerste lid, onder a, onder 4°, kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel4
  - number: '5.1'
    text: |-
      Er is een Adviescommissie lange termijn energieonderzoek en nieuw energieonderzoek, die tot taak heeft Onze
      Minister op zijn verzoek te adviseren omtrent aanvragen om subsidie voor een project.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel5
  - number: '5.2'
    text: De adviezen van de commissie gaan vergezeld van een deugdelijke motivering.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel5
  - number: '5.3'
    text: |-
      De commissie bestaat uit een voorzitter en ten minste 5 en ten hoogste 35 andere leden. De leden zijn deskundig op
      het terrein waarop de commissie een taak heeft en zijn geen ambtenaren, werkzaam bij het Ministerie van Economische
      Zaken.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel5
  - number: '5.4'
    text: |-
      De voorzitter en de leden worden door Onze Minister voor een termijn van ten hoogste vier jaar benoemd. Ze zijn te
      allen tijde opnieuw benoembaar.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel5
  - number: '5.5'
    text: Onze Minister kan deelcommissies instellen en leden van de commissie benoemen in deelcommissies.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel5
  - number: '5.6'
    text: |-
      Onze Minister kan op verzoek van de commissie met het oog op de uitoefening van haar taak deskundigen opdracht
      verlenen onderzoek te verrichten naar een door haar aangewezen project.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel5
  - number: '5.7'
    text: De commissie stelt haar werkwijze schriftelijk vast.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel5
  - number: '5.8'
    text: |-
      Een lid van de commissie en een deskundige als bedoeld in het zesde lid nemen niet deel aan de voorbereiding en
      vaststelling van een advies, indien zij een persoonlijk belang hebben bij de beschikking op een aanvraag.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel5
  - number: '5.9'
    text: Onze Minister kan waarnemers aanwijzen, die het recht hebben de vergaderingen van de commissie bij te wonen.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel5
  - number: '5.10'
    text: In het secretariaat van de commissie wordt door Onze Minister voorzien.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel5
  - number: '5.11'
    text: |-
      Het beheer van de bescheiden betreffende de werkzaamheden van de commissie geschiedt op overeenkomstige wijze als
      bij het Ministerie van Economische Zaken. De bescheiden worden na beëindiging van de werkzaamheden van de commissie
      bewaard in het archief van dat ministerie.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel5
  - number: '5.12'
    text: |-
      De commissie verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde inlichtingen.
      Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van zijn
      taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel5
  - number: '5.13'
    text: |-
      De commissie stelt jaarlijks voor 1 april een verslag op van haar werkzaamheden in het afgelopen kalenderjaar.
      Op verzoek van Onze Minister, maar ten minste elk vierde jaar, stelt de commissie tevens een evaluatieverslag op,
      waarin zij aandacht besteedt aan de doelmatigheid en doeltreffendheid van haar taakvervulling. Het jaarverslag en
      het evaluatieverslag worden aan Onze Minister toegezonden en algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel5
  - number: '6.1'
    text: |-
      Onze Minister stelt bij ministeriële regeling perioden vast na afloop waarvan de aanvragen om een subsidie voor een
      project die in die periode zijn ontvangen en voldoen aan de wettelijke voorschriften worden behandeld.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel6
  - number: '6.2'
    text: |-
      Onze Minister stelt voorts bij ministeriële regeling een subsidieplafond vast voor het verlenen van in het eerste
      lid bedoelde subsidies op in die periode ontvangen aanvragen. Daarbij kan hij afzonderlijke subsidieplafonds
      vaststellen voor bepaalde categorieën aanvragers en voor bepaalde categorieën projecten.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel6
  - number: '7.1'
    text: |-
      Een aanvraag om subsidie op grond van dit besluit wordt ingediend met gebruikmaking van een ondertekend formulier,
      dat door Onze Minister wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel7
  - number: '7.2'
    text: |-
      De aanvraag gaat vergezeld van een projectplan en een begroting voor het project alsmede van andere bescheiden,
      overeenkomstig hetgeen in het formulier is vermeld.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel7
  - number: '7.3'
    text: |-
      Indien de aanvraag een project betreft dat wordt uitgevoerd door een samenwerkingsverband, dient een der deelnemers
      in het samenwerkingsverband de aanvraag mede namens de andere deelnemers in en gaat de aanvraag vergezeld van de
      overeenkomst waarin de samenwerking tussen de deelnemers in het samenwerkingsverband is geregeld, overeenkomstig
      hetgeen in het formulier is vermeld.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel7
  - number: '8'
    text: |-
      Onze Minister geeft een beschikking op een aanvraag binnen dertien weken na afloop van de in
      [artikel 6, eerste lid][ref1], bedoelde periode.


      [ref1]: https://wetten.overheid.nl/BWBR0017234#Artikel6
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0017234
        artikel: '6'
        paragraaf: '2'
  - number: '9.1'
    text: |-
      Indien op de aanvraag niet afwijzend wordt beslist, en deze een project betreft dat wordt uitgevoerd door een
      samenwerkingsverband, vermeldt de beschikking tot subsidieverlening een raming van de projectkosten per deelnemer
      in het samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel9
  - number: '9.2'
    text: |-
      Elke deelnemer in het samenwerkingsverband is tot ten hoogste het naar rato van de voor hem geraamde projectkosten
      berekende bedrag aansprakelijk voor terugbetaling van de subsidie, voor zover de subsidie-ontvangers daartoe
      verplicht zijn.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel9
  - number: '10'
    text: 'Onze Minister beslist in ieder geval afwijzend op een aanvraag:'
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel10
  - number: 10.a
    text: indien de aanvraag niet voldoet aan dit besluit en de daarop berustende bepalingen;
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel10
  - number: 10.b
    text: 'indien hij het onaannemelijk acht dat:'
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel10
  - number: 10.b.1°
    text: het lange termijn-project binnen vier jaren kan worden voltooid;
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel10
  - number: 10.b.2°
    text: |-
      het neo-project dat een haalbaarheidsstudie betreft binnen één jaar kan worden voltooid en het neo-project dat een
      fundamenteel onderzoek, een industrieel onderzoek of een combinatie van beide betreft binnen twee jaren kan worden
      voltooid.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel10
  - number: 10.c
    text: indien gegronde vrees bestaat dat de betrokkenen het project niet kunnen financieren.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel10
  - number: '11.1'
    text: |-
      Onze Minister wint omtrent de aanvragen waarop niet met toepassing van [artikel 10][ref1] afwijzend is beslist het
      advies in van de Adviescommissie lange termijn energieonderzoek en nieuw energieonderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0017234#Artikel10
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0017234
        artikel: '10'
        paragraaf: '2'
  - number: '11.2'
    text: Onze Minister wint geen advies in over een aanvraag voor een haalbaarheidsstudie.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel11
  - number: '11.3'
    text: 'De commissie geeft aan Onze Minister in ieder geval een negatief advies:'
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel11
  - number: 11.3.a
    text: indien het project onvoldoende bijdraagt aan de doelstelling van het besluit en de daarop berustende bepalingen;
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel11
  - number: 11.3.b
    text: indien onvoldoende vertrouwen bestaat in de technische haalbaarheid van het project;
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel11
  - number: 11.3.c
    text: |-
      indien toepassing van het het resultaat van het lange termijn-project in de markt naar verwachting eerder zal
      plaatsvinden dan tien jaren na het tijdstip van de subsidieverlening;
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel11
  - number: 11.3.d
    text: |-
      indien onvoldoende vertrouwen bestaat dat de betrokkenen de capaciteiten hebben om het project naar behoren uit
      te voeren;
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel11
  - number: 11.3.e
    text: |-
      indien het neo-project onvoldoende potentie heeft om bij te dragen aan de opbouw van een sterkere kennispositie
      in Nederland.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel11
  - number: '11.4'
    text: |-
      De commissie rangschikt per groep van aanvragen waarvoor een subsidieplafond geldt de aanvragen waaromtrent zij
      positief adviseert zodanig, dat een project hoger gerangschikt wordt naar mate het meer bijdraagt aan bij regeling
      van Onze Minister vast te stellen criteria omtrent een duurzame energiehuishouding of aan de versterking van de
      kennispositie van Nederland omtrent duurzame energiehuishouding.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel11
  - number: '11.5'
    text: Bij regeling van Onze Minister kunnen voor de rangschikking wegingsfactoren worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel11
  - number: '12.1'
    text: |-
      Onze Minister beslist afwijzend op een aanvraag, indien de Adviescommissie lange termijn energieonderzoek en nieuw
      energieonderzoek een negatief advies heeft uitgebracht.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel12
  - number: '12.2'
    text: Onze Minister verdeelt het beschikbare bedrag in de volgorde van rangschikking van de aanvragen door de commissie.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel12
  - number: '12.3'
    text: |-
      Onze Minister kan afwijken van het eerste en tweede lid, indien een advies van de commissie in strijd is met dit
      besluit dan wel niet op zorgvuldige wijze tot stand is gekomen.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel12
  - number: 12a
    text: |-
      In afwijking van [artikel 12][ref1] verdeelt Onze Minister het beschikbare bedrag voor haalbaarheidsstudies
      in de volgorde van de ontvangst van de aanvragen, met dien verstande dat indien een aanvrager niet heeft
      voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de aanvraag en met toepassing van
      [artikel 4:5 van de Algemene wet bestuursrecht][ref2] de gelegenheid heeft gehad de aanvraag aan te vullen, de dag
      waarop de aanvraag voldoet aan de wettelijke voorschriften met betrekking tot de verdeling als datum van ontvangst
      geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0017234#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0017234
        artikel: '12'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '13.1'
    text: |-
      Aan de subsidieverlening zijn, voor zover daarbij niet anders bepaald, voor alle subsidie-ontvangers de
      in de [artikelen 14 tot en met 17][ref1] opgenomen verplichtingen verbonden, met dien verstande dat de in
      [artikelen 16][ref2] opgenomen verplichtingen slechts gelden voor de subsidie-ontvanger die als indiener van de
      aanvraag om subsidie in de zin van dit besluit is opgetreden.


      [ref1]: https://wetten.overheid.nl/BWBR0017234#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0017234#Artikel16
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0017234
        artikel: '14'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0017234
        artikel: '16'
        paragraaf: '3'
  - number: '13.2'
    text: |-
      De in de [artikelen 14 tot en met 16][ref1] opgenomen verplichtingen gelden tot de dag waarop de subsidie wordt
      vastgesteld. De in [artikel 17][ref2] opgenomen verplichtingen gelden totdat vijf jaren na die dag zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0017234#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0017234#Artikel17
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0017234
        artikel: '14'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0017234
        artikel: '17'
        paragraaf: '3'
  - number: '14.1'
    text: |-
      De subsidie-ontvanger voert het project uit overeenkomstig het projectplan waarop de subsidieverlening betrekking
      heeft en voltooit het uiterlijk op het bij de subsidieverlening bepaalde tijdstip, behoudens voorafgaande
      schriftelijke ontheffing van Onze Minister voor het vertragen, essentieel wijzigen of stopzetten van het project.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel14
  - number: '14.2'
    text: |-
      De subsidie-ontvanger voert het project in Nederland uit, behoudens voorafgaande schriftelijke ontheffing van Onze
      Minister voor gedeeltelijke uitvoering buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel14
  - number: '14.3'
    text: Aan een ontheffing als bedoeld in het eerste of tweede lid kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel14
  - number: '15.1'
    text: |-
      De subsidie-ontvanger voert een administratie die zodanig is ingericht, dat daaruit te allen tijde op
      eenvoudige en duidelijke wijze alle projectkosten kunnen worden afgelezen, gespecificeerd overeenkomstig de in
      [artikel 4, eerste lid][ref1], onderscheiden kostensoorten, met dien verstande dat ter zake van de loonkosten een
      door middel van een sluitende tijdschrijving vastgestelde urenverantwoording per werknemer aanwezig dient te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0017234#Artikel4
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0017234
        artikel: '4'
        paragraaf: '1'
  - number: '15.2'
    text: |-
      De subsidie-ontvanger doet onverwijld mededeling aan Onze Minister van de indiening bij de rechtbank van een
      verzoek tot het op hem van toepassing verklaren van de schuldsaneringsregeling natuurlijke personen, tot verlening
      van surséance van betaling aan hem of tot faillietverklaring van hem.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel15
  - number: '16'
    text: |-
      De subsidie-ontvanger brengt steeds, behoudens voorafgaande schriftelijke ontheffing van Onze Minister, na afloop
      van een periode van zes maanden aan Onze Minister schriftelijk verslag uit omtrent de uitvoering van het project,
      met inbegrip van een vergelijking van die uitvoering met het projectplan en de bij de subsidieverlening vermelde
      raming van de projectkosten.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel16
  - number: '17.1'
    text: |-
      De subsidie-ontvanger brengt desgevraagd aan Onze Minister verslag uit omtrent de toepassing van de resultaten van
      het project en draagt zorg voor de openbaarmaking en verspreiding van de resultaten van het project.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel17
  - number: '17.2'
    text: 'De subsidie-ontvanger zal, behoudens voorafgaande schriftelijke ontheffing van Onze Minister, niet:'
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel17
  - number: 17.2.a
    text: |-
      indien hij een rechtspersoon is, de rechtspersoon ontbinden of geheel of gedeeltelijk vervreemden noch zijn
      statutaire zetel verplaatsen buiten Nederland;
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel17
  - number: 17.2.b
    text: |-
      indien hij deelneemt in een commanditaire vennootschap, een vennootschap onder firma of maatschap, meewerken aan de
      ontbinding ervan of aan het uittreden van een of meer deelnemers ervan.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel17
  - number: '17.3'
    text: Aan een ontheffing als bedoeld in het tweede lid kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel17
  - number: '18'
    text: 'Onze Minister kan bij de subsidieverlening verplichtingen opleggen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel18
  - number: 18.a
    text: het geven van bekendheid aan het project en de resultaten ervan;
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel18
  - number: 18.b
    text: het verlenen van medewerking aan onder zijn zorg openbaar te maken en te verspreiden resultaten van het project;
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel18
  - number: 18.c
    text: |-
      het verlenen van medewerking aan een door hem over de toepassing en de effecten van dit besluit ingesteld
      evaluatie-onderzoek, voor zover hij aan die medewerking redelijkerwijs behoefte heeft;
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel18
  - number: 18.d
    text: |-
      de tenaamstelling, verwerving, instandhouding, exploitatie en vervreemding van rechten van intellectuele eigendom
      en de instandhouding van andere voor de uitvoering van het project van belang zijnde en door de uitvoering van het
      project opgedane kennis.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel18
  - number: '19.1'
    text: |-
      Voorschotten kunnen door Onze Minister slechts op aanvraag van de subsidie-ontvanger worden verstrekt op een
      subsidie ter zake waarvan een beschikking tot subsidieverlening geldt.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel19
  - number: '19.2'
    text: |-
      Een voorschot wordt berekend naar rato van de gemaakte en betaalde projectkosten, voor zover deze nog niet eerder
      bij de verstrekking van een voorschot in aanmerking zijn genomen. In totaal zal het bedrag aan voorschotten niet
      groter zijn dan 80 procent van het bij de subsidieverlening vermelde maximale subsidiebedrag.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel19
  - number: '19.3'
    text: |-
      In afwijking van het eerste en tweede lid wordt aan een ondernemer als bedoeld in [artikel 3, vierde lid][ref1],
      het eerste voorschot ambtshalve verstrekt bij de subsidieverlening; dit voorschot bedraagt 25 procent van het bij
      de subsidieverlening vermelde maximale subsidiebedrag en wordt betaald binnen twee weken nadat de ondernemer Onze
      Minister schriftelijk heeft medegedeeld dat met de uitvoering van het project is begonnen onder vermelding van de
      daartoe behorende activiteiten met het desbetreffende tijdstip van aanvang. Indien de ondernemer deelnemer is in
      een samenwerkingsverband vindt overeenkomstige toepassing plaats van de eerste volzin op de andere leden van het
      samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0017234#Artikel3
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0017234
        artikel: '3'
        paragraaf: '1'
  - number: '19.4'
    text: |-
      Bij de toepassing van het tweede lid wordt de opslag, bedoeld in [artikel 4, eerste lid, onder b][ref1], geacht
      gemaakt en betaald te zijn voor zover de kosten waarover hij wordt berekend zijn gemaakt en betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0017234#Artikel4
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0017234
        artikel: '4'
        paragraaf: '1'
  - number: '19.5'
    text: |-
      Een voorschot, uitgezonderd het eerste voorschot, bedoeld in het derde lid, wordt slechts verstrekt, indien het
      bedrag aan voorschot meer is dan een bij regeling van Onze Minister te bepalen bedrag.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel19
  - number: '20.1'
    text: |-
      Een aanvraag om een voorschot, niet zijnde een eerste voorschot als bedoeld in [artikel 19, derde lid][ref1], wordt
      ingediend gelijktijdig met het uitbrengen van een verslag als bedoeld in [artikel 16][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017234#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0017234#Artikel16
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0017234
        artikel: '19'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0017234
        artikel: '16'
        paragraaf: '3'
  - number: '20.2'
    text: |-
      De aanvraag wordt ingediend met gebruikmaking van een ondertekend formulier, dat door Onze Minister wordt
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel20
  - number: '20.3'
    text: |-
      Indien de aanvraag een project betreft dat wordt uitgevoerd door een samenwerkingsverband, dient de deelnemer in
      het samenwerkingsverband die als indiener van de aanvraag om subsidie in de zin van dit besluit is opgetreden, de
      aanvraag mede namens de andere deelnemers in.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel20
  - number: '21'
    text: |-
      Onze Minister kan in ieder geval afwijzend beschikken op een aanvraag om een voorschot, indien een subsidie-
      ontvanger niet heeft voldaan aan ingevolge de subsidieverlening voor hem geldende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel21
  - number: '22.1'
    text: |-
      Een aanvraag om subsidievaststelling wordt binnen zes maanden na het tijdstip waarop het in het eerste lid bedoelde
      project ingevolge [artikel 14, eerste lid][ref1], moet zijn voltooid bij Onze Minister ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0017234#Artikel14
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0017234
        artikel: '14'
        paragraaf: '3'
  - number: '22.2'
    text: |-
      De aanvraag wordt ingediend met gebruikmaking van een ondertekend formulier, dat door Onze Minister wordt
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel22
  - number: '22.3'
    text: 'De aanvraag gaat, overeenkomstig hetgeen in het formulier is vermeld, vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel22
  - number: 22.3.a
    text: een eindverslag omtrent de uitvoering en de resultaten van het project,
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel22
  - number: 22.3.b
    text: |-
      indien het bedrag waarop de subsidie ten hoogste kan worden vastgesteld € 50 000 of meer bedraagt, een
      accountantsverklaring die is opgesteld op de in het formulier aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel22
  - number: '22.4'
    text: |-
      Indien de aanvraag een project betreft dat wordt uitgevoerd door een samenwerkingsverband, dient de deelnemer in
      het samenwerkingsverband die als indiener van de aanvraag om subsidie in de zin van dit besluit is opgetreden, de
      aanvraag mede namens de andere deelnemers in.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel22
  - number: '23'
    text: |-
      Onze Minister geeft de beschikking tot subsidievaststelling binnen dertien weken na ontvangst van de aanvraag
      daartoe dan wel nadat de voor het indienen ervan geldende termijn is verstreken.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel23
  - number: '24'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel24
  - number: '25'
    text: 'Dit besluit wordt aangehaald als: Besluit EOS: lange termijn.'
    url: https://wetten.overheid.nl/BWBR0017234/2009-07-01#Artikel25
