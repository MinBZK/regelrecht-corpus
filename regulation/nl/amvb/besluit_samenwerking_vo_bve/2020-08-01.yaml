      [ref2]: https://wetten.overheid.nl/BWBR0018736
    url: https://wetten.overheid.nl/BWBR0019143/2020-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0019143
        artikel: '9'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0018736
  - number: '10.2'
    text: |-
      [Artikel 9][ref1] treedt in werking met ingang van een bij koninklijk besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0019143#Artikel9
    url: https://wetten.overheid.nl/BWBR0019143/2020-08-01#Artikel10
