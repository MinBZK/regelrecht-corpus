preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Onderwijs, Cultuur en Wetenschap van 14 oktober 2005, nr. WJZ/2005/44254
    (3800), directie Wetgeving en Juridische Zaken, gedaan mede namens Onze Minister van Landbouw, Natuur en
    Voedselkwaliteit;

    Gelet op de artikelen 25a, vierde lid, 29 en 106, derde lid, van de Wet op het voortgezet onderwijs;

    De Raad van State gehoord (advies van 9 november 2005, nr. W05.05.0464/III);

    Gezien het nader rapport van Onze Minister van Onderwijs, Cultuur en Wetenschap van 25 november 2005, nr.
    WJZ2005/48453 (3800), directie Wetgeving en Juridische Zaken, uitgebracht mede namens Onze Minister van Landbouw,
    Natuur en Voedselkwaliteit;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0019143/2020-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019143/2020-08-01#Artikel1
  - number: 1.a
    text: |-
      WVO: [Wet op het voortgezet onderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0019143/2020-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002399
  - number: 1.b
    text: |-
      WEB: [Wet educatie en beroepsonderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0019143/2020-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: 1.c
    text: |-
      VAVO: voortgezet algemeen volwassenenonderwijs als bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel a, van de WEB][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0019143/2020-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 1a
    text: |-
      In [hoofdstuk 2][ref1] wordt verstaan onder: - *school:* een uit ’s Rijks kas bekostigde school voor voortgezet
      onderwijs als bedoeld in [artikel 1 van de WVO][ref2];
        - *instelling:* een uit ’s Rijks kas bekostigde instelling als bedoeld in
      [artikel 1.1.1, onderdeel b, sub 1, van de WEB][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019143#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0019143/2020-08-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0019143
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '1'
  - number: '2.1'
    text: |-
      Het bevoegd gezag van een school kan de volgende leerlingen in de gelegenheid stellen in het kader van het
      onderwijs waarvoor zij aan de school zijn ingeschreven, ook onderwijs te ontvangen dat een school van een ander
      bevoegd gezag of een instelling verzorgt:
    url: https://wetten.overheid.nl/BWBR0019143/2020-08-01#Artikel2
  - number: 2.1.a
    text: |-
      voor het in [artikel 25a, tweede lid onder a, van de WVO][ref1] bedoelde doel, leerlingen die het derde of
      het vierde leerjaar van het voorbereidend beroepsonderwijs of het middelbaar algemeen voortgezet onderwijs
      volgen en naar het oordeel van het bevoegd gezag zonder gerichte ondersteuning een vergrote kans lopen
      om het onderwijs te verlaten zonder ten minste een diploma van een basisberoepsopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdeel b, van de WEB][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel25a
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0019143/2020-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 25a
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 2.1.b
    text: |-
      voor het in [artikel 25a, tweede lid, onderdeel b, van de WVO][ref1] bedoelde doel, leerlingen die naar het oordeel
      van het bevoegd gezag een grotere kans hebben om vervolgonderwijs met gunstig resultaat te volgen door extra
      verrijking, verdieping en oriëntatie naast hun reguliere opleiding, of door onderdelen van beroepsopleidingen of
      opleidingen educatie als bedoeld in de [WEB][ref2] te volgen, naast hun opleiding in het voortgezet onderwijs;


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel25a
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0019143/2020-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 25a
      - id: ref2
        bwb_id: BWBR0007625
  - number: 2.1.c
    text: |-
      voor het in [artikel 25a, tweede lid, onderdeel c, van de WVO][ref1] bedoelde doel, iedere leerling.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel25a
    url: https://wetten.overheid.nl/BWBR0019143/2020-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 25a
  - number: '2.2'
    text: |-
      Een leerling als bedoeld in het eerste lid volgt voor ten hoogste de helft van het aantal klokuren van het
      onderwijsprogramma, bedoeld in [artikel 24, tweede lid, van de WVO][ref1], lessen of stages aan de andere school of
      aan een instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel24
    url: https://wetten.overheid.nl/BWBR0019143/2020-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '24'
  - number: '2.3'
    text: |-
      Bij de toepassing van het eerste lid dient op elke school die betrokken is bij de samenwerkingsovereenkomst bedoeld
      in [artikel 25a, derde lid, van de WVO][ref1], ten minste een deel van het onderwijs in de bovenbouw op de eigen
      school te worden verzorgd. Voor de verschillende schoolsoorten gelden de volgende voorschriften:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel25a
    url: https://wetten.overheid.nl/BWBR0019143/2020-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 25a
  - number: 2.3.a
    text: |-
      indien het betreft een school voor voorbereidend wetenschappelijk onderwijs of een school voor hoger algemeen
      voortgezet onderwijs, dient op de eigen school het onderwijs te worden verzorgd in ten minste één van de profielen
      bedoeld in [artikel 12, derde lid, van de WVO][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel12
    url: https://wetten.overheid.nl/BWBR0019143/2020-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '12'
  - number: 2.3.b
    text: |-
      indien het betreft een school voor middelbaar algemeen voortgezet onderwijs, dient op de eigen school het onderwijs
      te worden verzorgd in ten minste één van de profielen bedoeld in [artikel 10, derde lid, van de WVO][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
    url: https://wetten.overheid.nl/BWBR0019143/2020-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
  - number: 2.3.c
    text: |-
      indien het betreft een school voor voorbereidend beroepsonderwijs, dient op de eigen school het onderwijs te worden
      verzorgd in ten minste één van de profielen bedoeld in [artikel 10b, derde lid, van de WVO][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0019143/2020-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
  - number: 2.3.d
    text: |-
      indien het betreft onderwijs in de gemengde leerweg als bedoeld in [artikel 10d van de WVO][ref1] aan een school
      voor middelbaar algemeen voortgezet onderwijs of aan een school voor voorbereidend beroepsonderwijs, dient op de
      eigen school het onderwijs te worden verzorgd in ten minste één van de profielen bedoeld in het derde lid van dat
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
    url: https://wetten.overheid.nl/BWBR0019143/2020-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10d
  - number: '2.4'
    text: |-
      In de samenwerkingsovereenkomst, bedoeld in [artikel 25a van de WVO][ref1], worden afspraken gemaakt over de wijze
      waarop de school geregeld contact onderhoudt met de leerlingen die aan die school zijn ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel25a
    url: https://wetten.overheid.nl/BWBR0019143/2020-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 25a
  - number: '3.1'
    text: |-
      Het bevoegd gezag van een school kan de volgende leerlingen in de gelegenheid stellen in het kader van het
      onderwijs waarvoor zij aan de school zijn ingeschreven, deel te nemen aan een opleiding VAVO en die opleiding met
      een examen af te sluiten:
    url: https://wetten.overheid.nl/BWBR0019143/2020-08-01#Artikel3
  - number: 3.1.a
    text: |-
      leerlingen van 16 en 17 jaar die naar het oordeel van het bevoegd gezag een grotere kans hebben een diploma of
      volgend diploma als bedoeld in [artikel 29, derde lid, van de WVO][ref1] te behalen indien zij VAVO volgen in
      plaats van voortgezet onderwijs;


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel29
    url: https://wetten.overheid.nl/BWBR0019143/2020-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '29'
  - number: 3.1.b
    text: |-
      leerlingen van 18 jaar of ouder die ononderbroken in het voortgezet onderwijs of daarmee op grond
      van de [Leerplichtwet 1969][ref1] gelijkgesteld onderwijs ingeschreven zijn geweest en die naar het
      oordeel van het bevoegd gezag een grotere kans hebben om een diploma of volgend diploma als bedoeld in
      [artikel 29, derde lid, van de WVO][ref2] te behalen indien zij VAVO volgen in plaats van voortgezet onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002628
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel29
    url: https://wetten.overheid.nl/BWBR0019143/2020-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002628
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '29'
  - number: '3.2'
    text: |-
      Het eerste lid, aanhef en onder b, vindt ten aanzien van de daar bedoelde leerlingen toepassing voor ten hoogste de
      periode van de resterende cursusduur van de opleiding waarvoor zij aan de school zijn ingeschreven, vermeerderd met
      een jaar.
    url: https://wetten.overheid.nl/BWBR0019143/2020-08-01#Artikel3
  - number: '4'
    text: |-
      Overdracht van een deel van de bekostiging met toepassing van [artikel 96s van de WVO][ref1] is uitsluitend
      mogelijk voor een leerling:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96s
    url: https://wetten.overheid.nl/BWBR0019143/2020-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96s
  - number: 4.a
    text: |-
      ten aanzien van wie na 1 oktober van het schooljaar blijkt dat deze is aangewezen op onderwijs aan een andere
      school of aan een instelling,
    url: https://wetten.overheid.nl/BWBR0019143/2020-08-01#Artikel4
  - number: 4.b
    text: die in verband daarmee in dat schooljaar wordt uitgeschreven aan de school, en
    url: https://wetten.overheid.nl/BWBR0019143/2020-08-01#Artikel4
  - number: 4.c
    text: |-
      die aansluitend in dat schooljaar wordt ingeschreven als leerling aan een andere school of als mbo-student of vavo-
      student aan een instelling.
    url: https://wetten.overheid.nl/BWBR0019143/2020-08-01#Artikel4
  - number: '5'
    text: |-
      In afwijking van [artikel 33, eerste lid, van de WVO][ref1] kan onderwijs ook worden verzorgd door docenten van
      de instelling waarmee het bevoegd gezag van de school een samenwerkingsovereenkomst heeft gesloten als bedoeld in
      [artikel 25a, derde lid, van de WVO][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel25a
    url: https://wetten.overheid.nl/BWBR0019143/2020-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '33'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 25a
  - number: '6'
    text: |-
      Voor de toepassing van [hoofdstuk 8a van de WEB][ref1] gelden leerlingen als bedoeld in de [artikelen 2][ref2] en
      [3][ref3] ten aanzien van het onderwijs dat zij volgen aan een instelling tevens als mbo-student of vavo-student
      in de zin van de [WEB][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk8a
      [ref2]: https://wetten.overheid.nl/BWBR0019143#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0019143#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0019143/2020-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        hoofdstuk: 8a
      - id: ref2
        bwb_id: BWBR0019143
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0019143
        artikel: '3'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0007625
  - number: '7'
    text: |-
      Het bevoegd gezag van een ingevolge [artikel 56 van de WVO][ref1] aangewezen school kan leerlingen van 16 en 17
      jaar die naar het oordeel van het bevoegd gezag een grotere kans hebben een diploma of volgend diploma als bedoeld
      in [artikel 29, derde lid, van de WVO][ref2] te behalen indien zij VAVO volgen in plaats van voortgezet onderwijs,
      in de gelegenheid stellen in het kader van het onderwijs waarvoor zij aan de school zijn ingeschreven, deel te
      nemen aan een opleiding VAVO aan een instelling waarvoor wat betreft genoemde opleiding toepassing is gegeven
      aan [artikel 1.4a.1, eerste lid, van de WEB][ref3], en die opleiding met een examen van genoemde opleiding af te
      sluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0019143/2020-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '56'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '1'
  - number: '10.1'
    text: |-
      Dit besluit treedt, met uitzondering van [artikel 9][ref1], in werking met ingang van het tijdstip waarop de
