  - number: '2'
    text: |-
      1 Het bevoegd gezag van een school kan de volgende leerlingen in de gelegenheid stellen in het kader van het
      onderwijs waarvoor zij aan de school zijn ingeschreven, ook onderwijs te ontvangen dat een school van een ander
      bevoegd gezag of een instelling verzorgt:

      a. voor het in [artikel 25a, tweede lid onder a, van de WVO][ref1] bedoelde doel, leerlingen die het derde
      of het vierde leerjaar van het voorbereidend beroepsonderwijs of het middelbaar algemeen voortgezet onderwijs
      volgen en naar het oordeel van het bevoegd gezag zonder gerichte ondersteuning een vergrote kans lopen
      om het onderwijs te verlaten zonder ten minste een diploma van een basisberoepsopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdeel b, van de WEB][ref2];

      b. voor het in [artikel 25a, tweede lid, onderdeel b, van de WVO][ref3] bedoelde doel, leerlingen die naar het
      oordeel van het bevoegd gezag een grotere kans hebben om vervolgonderwijs met gunstig resultaat te volgen door
      extra verrijking, verdieping en oriëntatie naast hun reguliere opleiding, of door onderdelen van beroepsopleidingen
      of opleidingen educatie als bedoeld in de [WEB][ref4] te volgen, naast hun opleiding in het voortgezet onderwijs;

      c. voor het in [artikel 25a, tweede lid, onderdeel c, van de WVO][ref5] bedoelde doel, iedere leerling.

      2 Een leerling als bedoeld in het eerste lid volgt per leerjaar voor ten hoogste de helft van het aantal klokuren
      per schooljaar die blijkens het onderwijsprogramma, bedoeld in [artikel 24, tweede lid, van de WVO][ref6], worden
      besteed aan het volgen van lessen of stages, aan de andere school of aan de instelling. Toepassing van het eerste
      lid leidt er niet toe dat het bevoegd gezag zelf uitsluitend nog de stage van die leerling verzorgt.

      3 Indien het betreft het verzorgen van vakken of programma-onderdelen als bedoeld in
      [artikel 10b, zesde of zevende lid][ref7], of [artikel 10d, zesde of zevende lid, van de WVO][ref8],
      kan het bevoegd gezag van de school op grond van een samenwerkingsovereenkomst als
      bedoeld in [artikel 25a, derde lid, van de WVO][ref9] of een regeling als bedoeld in
      [artikel 25a, vijfde lid, van de WVO][ref10] afwijken van het tweede lid.


