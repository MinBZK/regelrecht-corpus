articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. WVO: [Wet op het voortgezet onderwijs][ref1];

      b. WEB: [Wet educatie en beroepsonderwijs][ref2];

      c. school: een uit ’s Rijks kas bekostigde school voor voortgezet onderwijs als bedoeld in
      [artikel 1 van de WVO][ref3];

      d. instelling: een uit ’s Rijks kas bekostigde instelling als bedoeld in
      [artikel 1.1.1, onderdeel b, van de WEB][ref4];

      e. VAVO: voortgezet algemeen volwassenenonderwijs als bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel a, van de WEB][ref5].


