  - number: '4'
    text: |-
      Overdracht van een deel van de bekostiging met toepassing van [artikel 96s van de WVO][ref1] is uitsluitend
      mogelijk voor een leerling:

      a. ten aanzien van wie na 1 oktober van het schooljaar blijkt dat deze is aangewezen op onderwijs aan een andere
      school of aan een instelling,

      b. die in verband daarmee in dat schooljaar wordt uitgeschreven aan de school, en

      c. die aansluitend in dat schooljaar wordt ingeschreven als leerling aan een andere school of als deelnemer aan
      een instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96s
    url: https://wetten.overheid.nl/BWBR0019143/2016-08-01#Artikel4
