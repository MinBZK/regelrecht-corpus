  - number: 1a
    text: |-
      In [hoofdstuk 2][ref1] wordt verstaan onder:

        - *school:* een uit ’s Rijks kas bekostigde school voor voortgezet onderwijs als bedoeld in
      [artikel 1 van de WVO][ref2];
        - *instelling:* een uit ’s Rijks kas bekostigde instelling als bedoeld in
      [artikel 1.1.1, onderdeel b, sub 1, van de WEB][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019143#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1.1.1
