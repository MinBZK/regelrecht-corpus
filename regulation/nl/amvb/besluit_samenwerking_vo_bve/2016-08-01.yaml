  - number: '2'
    text: |-
      1 Het bevoegd gezag van een school kan de volgende leerlingen in de gelegenheid stellen in het kader van het
      onderwijs waarvoor zij aan de school zijn ingeschreven, ook onderwijs te ontvangen dat een school van een ander
      bevoegd gezag of een instelling verzorgt:

      a. voor het in [artikel 25a, tweede lid onder a, van de WVO][ref1] bedoelde doel, leerlingen die het derde
      of het vierde leerjaar van het voorbereidend beroepsonderwijs of het middelbaar algemeen voortgezet onderwijs
      volgen en naar het oordeel van het bevoegd gezag zonder gerichte ondersteuning een vergrote kans lopen
      om het onderwijs te verlaten zonder ten minste een diploma van een basisberoepsopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdeel b, van de WEB][ref2];

      b. voor het in [artikel 25a, tweede lid, onderdeel b, van de WVO][ref3] bedoelde doel, leerlingen die naar het
      oordeel van het bevoegd gezag een grotere kans hebben om vervolgonderwijs met gunstig resultaat te volgen door
      extra verrijking, verdieping en oriëntatie naast hun reguliere opleiding, of door onderdelen van beroepsopleidingen
      of opleidingen educatie als bedoeld in de [WEB][ref4] te volgen, naast hun opleiding in het voortgezet onderwijs;

      c. voor het in [artikel 25a, tweede lid, onderdeel c, van de WVO][ref5] bedoelde doel, iedere leerling.

      2 Een leerling als bedoeld in het eerste lid volgt voor ten hoogste de helft van het aantal klokuren van het
      onderwijsprogramma, bedoeld in [artikel 24, tweede lid, van de WVO][ref6], lessen of stages aan de andere school of
      aan een instelling.

      3 Bij de toepassing van het eerste lid dient op elke school die betrokken is bij de samenwerkingsovereenkomst
      bedoeld in [artikel 25a, derde lid, van de WVO][ref7], ten minste een deel van het onderwijs in de bovenbouw op de
      eigen school te worden verzorgd. Voor de verschillende schoolsoorten gelden de volgende voorschriften:

      a. indien het betreft een school voor voorbereidend wetenschappelijk onderwijs of een school voor hoger algemeen
      voortgezet onderwijs, dient op de eigen school het onderwijs te worden verzorgd in ten minste één van de profielen
      bedoeld in [artikel 12, derde lid, van de WVO][ref8];

      b. indien het betreft een school voor middelbaar algemeen voortgezet onderwijs, dient op de
      eigen school het onderwijs te worden verzorgd in ten minste één van de profielen bedoeld in
      [artikel 10, derde lid, van de WVO][ref9];

      c. indien het betreft een school voor voorbereidend beroepsonderwijs, dient op de eigen school het onderwijs te
      worden verzorgd in ten minste één van de profielen bedoeld in [artikel 10b, derde lid, van de WVO][ref10];

      d. indien het betreft onderwijs in de gemengde leerweg als bedoeld in [artikel 10d van de WVO][ref11] aan een
      school voor middelbaar algemeen voortgezet onderwijs of aan een school voor voorbereidend beroepsonderwijs, dient
      op de eigen school het onderwijs te worden verzorgd in ten minste één van de profielen bedoeld in het derde lid van
      dat artikel.

      4 In de samenwerkingsovereenkomst, bedoeld in [artikel 25a van de WVO][ref12], worden afspraken gemaakt over de
      wijze waarop de school geregeld contact onderhoudt met de leerlingen die aan die school zijn ingeschreven.


