    text: |-
      Voor de toepassing van [hoofdstuk 8a van de WEB][ref1] gelden leerlingen als bedoeld in de [artikelen 2][ref2]
      en [3][ref3] ten aanzien van het onderwijs dat zij volgen aan een instelling tevens als deelnemer in de zin van
      de [WEB][ref4].


