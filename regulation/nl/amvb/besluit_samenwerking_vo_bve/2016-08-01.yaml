  - number: '3'
    text: |-
      1 Het bevoegd gezag van een school kan de volgende leerlingen in de gelegenheid stellen in het kader van het
      onderwijs waarvoor zij aan de school zijn ingeschreven, deel te nemen aan een opleiding VAVO en die opleiding met
      een examen af te sluiten:

      a. leerlingen van 16 en 17 jaar die naar het oordeel van het bevoegd gezag een grotere kans hebben een diploma
      of volgend diploma als bedoeld in [artikel 29, derde lid, van de WVO][ref1] te behalen indien zij VAVO volgen in
      plaats van voortgezet onderwijs;

      b. leerlingen van 18 jaar of ouder die ononderbroken in het voortgezet onderwijs of daarmee op grond
      van de [Leerplichtwet 1969][ref2] gelijkgesteld onderwijs ingeschreven zijn geweest en die naar het
      oordeel van het bevoegd gezag een grotere kans hebben om een diploma of volgend diploma als bedoeld in
      [artikel 29, derde lid, van de WVO][ref3] te behalen indien zij VAVO volgen in plaats van voortgezet onderwijs.

      2 Het eerste lid, aanhef en onder b, vindt ten aanzien van de daar bedoelde leerlingen toepassing voor ten hoogste
      de periode van de resterende cursusduur van de opleiding waarvoor zij aan de school zijn ingeschreven, vermeerderd
      met een jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0002628
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel29
