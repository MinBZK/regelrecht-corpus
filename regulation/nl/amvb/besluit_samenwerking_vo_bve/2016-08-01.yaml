articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. WVO: [Wet op het voortgezet onderwijs][ref1];

      b. WEB: [Wet educatie en beroepsonderwijs][ref2];

      c. VAVO: voortgezet algemeen volwassenenonderwijs als bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel a, van de WEB][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0007625
