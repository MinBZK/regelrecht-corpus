  - number: '17'
    text: |-
      1 De ambtenaar, die als militair in werkelijke dienst is, wordt geacht in zijn burgerlijke betrekking met verlof
      te zijn.

      2 Hij behoudt over de tijd van deze dienst het genot van de aan zijn ambt verbonden bezoldiging, slechts voor zover
      hem bij of krachtens de artikelen 18 tot en met 20 daarop aanspraak is verleend. Voor zover die werkelijke dienst
      wordt vervuld in aan hem verleend vacantieverlof, behoudt hij in ieder geval het genot van de volle aan zijn ambt
      verbonden bezoldiging.

      3 Voor de toepassing van het vorige lid en de artikelen 18 tot en met 20 en
      20*d* wordt - ingeval de ambtenaar in het genot is van een toelage als bedoeld in
      [artikel 17 van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1] - dit bezoldigingsdeel vastgesteld
      op het bedrag dat hem ingevolge de voor hem geldende werktijdregeling zou zijn toegekend, indien hij niet aan zijn
      burgerlijke betrekking zou zijn onttrokken.

      Is de vaststelling van het bedrag op deze wijze niet mogelijk, dan wordt dit, met inachtneming van de percentages
      en het berekeningsmaximum zoals genoemd in artikel 17 van vorengenoemd besluit, berekend over het voor de
      ambtenaar geldende salaris, zulks naar de aantallen uren als bedoeld in dat artikel waarop door hem gedurende de
      drie kalendermaanden voorafgaande aan het tijdstip met ingang waarvan hij aan zijn burgerlijke betrekking werd
      onttrokken, ingevolge de voor hem geldende werktijdregeling gemiddeld per maand is gewerkt.

      4 Voor de toepassing van het tweede lid en de artikelen 18 tot en met 20 en 20*d* wordt - ingeval de ambtenaar in
      het genot is van een toelage als bedoeld in [artikel 18][ref2] - dit bezoldigingsdeel vastgesteld op het bedrag
      dat hem ingevolge het voor hem geldende consignatierooster zou zijn toegekend, indien hij niet aan zijn burgerlijke
      betrekking zou zijn onttrokken. Is de vaststelling van het bedrag op deze wijze niet mogelijk, dan wordt dit
      bedrag berekend naar de berekeningsgrondslag en de percentages zoals genoemd in artikel 18*a* van vorengenoemd
      besluit, zulks naar de aantallen uren als bedoeld in dat artikel waarop door hem gedurende de drie kalendermaanden
      voorafgaande aan het tijdstip met ingang waarvan hij aan zijn burgerlijke betrekking werd onttrokken, gemiddeld per
      maand consignatiediensten zijn verricht.

      5 Voor zover de ambtenaar ingevolge de voor hem geldende bezoldigingsregeling aanspraak heeft op een vakantie-
      uitkering geniet hij deze uitkering slechts voor zoveel die uitgaat boven de vakantie-uitkering waarop hij als
      militair aanspraak heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel18a
