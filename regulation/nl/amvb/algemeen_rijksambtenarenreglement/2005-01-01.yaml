        artikel: '39'
  - number: '34'
    text: |-
      1 Buitengewoon verlof van lange duur kan aan de ambtenaar op zijn aanvraag worden verleend, al dan niet met behoud
      van bezoldiging en al dan niet onder bepaalde voorwaarden.

      2 Het verlof, bedoeld in het eerste lid, gaat niet in dan nadat de ambtenaar schriftelijk heeft verklaard dat hij
      de daaraan verbonden voorwaarden aanvaardt.

      3 Indien het verlof, bedoeld in het eerste lid, naar het oordeel van het bevoegd gezag uitsluitend strekt in het
      persoonlijk belang van de ambtenaar, wordt hem dit niet verleend dan zonder behoud van bezoldiging en voor ten
      hoogste een jaar.

      4 Aan de ambtenaar die wordt uitgezonden om in de burgerlijke landsdienst van de Nederlandse Antillen of Aruba
      tijdelijk een betrekking te vervullen, wordt het verlof, bedoeld in het eerste lid, verleend op de voet van de
      bepalingen van het [West-Indisch Detacheeringsbesluit 1930][ref1], met dien verstande dat dit verlof in afwijking
      van genoemd besluit ook kan worden verleend met behoud van bezoldiging.

      5 Indien het verlof, bedoeld in het eerste lid, verband houdt met een benoeming van de ambtenaar tot bezoldigd
      bestuurder van een vereniging van ambtenaren, van een centrale of van een internationale organisatie van zodanige
      verenigingen, wordt hem dit niet verleend dan zonder behoud van bezoldiging en voor ten hoogste twee jaren. Artikel
      33*b*, vijfde lid, is van overeenkomstige toepassing.

      6 Indien de ambtenaar aan wie verlof is verleend als bedoeld in het eerste lid, met geheel of gedeeltelijk behoud
      van bezoldiging, gedurende dat verlof of gedurende een bepaalde periode van dat verlof tevens recht heeft op een
      financiële tegemoetkoming op basis van [hoofdstuk 7 van de Wet arbeid en zorg][ref2], wordt gedurende de periode
      waarin sprake is van samenloop een inhouding op de bezoldiging toegepast welke overeenkomt met het bedrag van
      bedoelde financiële tegemoetkoming. Indien de financiële tegemoetkoming hoger is dan hetgeen over de verlofuren
      wordt doorbetaald aan bezoldiging wordt de inhouding vastgesteld op het laatstbedoelde bedrag.

      7 Indien aan de in [hoofdstuk 7 van de Wet arbeid en zorg][ref3] gestelde voorwaarden voor het toekennen van een
      financiële tegemoetkoming is voldaan maar geen financiële tegemoetkoming is toegekend omdat de ambtenaar geen
      aanvraag heeft ingediend, past het bevoegd gezag het zesde lid op overeenkomstige wijze toe. In dat geval wordt
      rekening gehouden met de financiële tegemoetkoming die aan de ambtenaar zou zijn toegekend indien hij wel een
      aanvraag zou hebben ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0001949
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk7
