    text: |-
      1 De ambtenaar heeft in verband met de adoptie van een kind aanspraak op verlof met behoud van bezoldiging.

      2 De aanspraak op verlof in verband met adoptie van een kind bedraagt ten hoogste vier aaneengesloten weken. De
      aanspraak bestaat gedurende een tijdvak van achttien weken te rekenen vanaf twee weken vóór de eerste dag dat
      de feitelijke opneming ter adoptie een aanvang heeft genomen of zal nemen zoals die dag is aangeduid in een door
      de ambtenaar aan het bevoegd gezag overgelegd document waaruit blijkt dat een kind ter adoptie is of zal worden
      opgenomen.

      3 Indien als gevolg van een adoptieverzoek tegelijkertijd twee of meer kinderen feitelijk ter adoptie worden
      opgenomen, bestaat de aanspraak op verlof slechts ten aanzien van één van die kinderen.

      4 De ambtenaar meldt aan het bevoegd gezag het verlof in verband met adoptie uiterlijk drie weken voor de dag van
      ingang van het verlof onder opgave van de omvang van het verlof. Bij de melding worden documenten gevoegd waaruit
      blijkt dat een kind ter adoptie is of zal worden opgenomen.

      5 Indien de ambtenaar aan wie verlof is verleend gedurende dat verlof of gedurende een bepaalde periode van dat
      verlof tevens recht heeft op een financiële tegemoetkoming op basis van de Wet arbeid en zorg, wordt gedurende de
      periode waarin sprake is van samenloop een inhouding op de doorbetaling van bezoldiging als bedoeld in het eerste
      lid toegepast welke overeenkomt met het bedrag van bedoelde financiële tegemoetkoming.

      6 Indien aan gestelde voorwaarden voor het toekennen van een financiële tegemoetkoming als bedoeld in het vijfde
      lid is voldaan maar geen financiële tegemoetkoming is toegekend omdat de ambtenaar geen aanvraag heeft ingediend,
      past het bevoegd gezag het vijfde lid op overeenkomstige wijze toe. In dat geval wordt rekening gehouden met de
      financiële tegemoetkoming die aan de ambtenaar zou zijn toegekend indien hij wel een aanvraag zou hebben ingediend.

      7 De bepalingen in dit artikel zijn van overeenkomstige toepassing op de ambtenaar die een pleegkind opneemt als
      bedoeld in [artikel 5:1, tweede lid, onderdeel d, van de Wet arbeid en zorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel51
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel33h
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: 5:1
  - number: 33i
    text: |-
      1 Tenzij een zwaarwegend dienstbelang zich daartegen verzet wordt aan de ambtenaar verlof met behoud van
      bezoldiging verleend voor de noodzakelijke verzorging in verband met ziekte van:

      a. zijn echtgenote of echtgenoot;

      b. een inwonend kind tot wie de ambtenaar als ouder in een familierechtelijke betrekking staat;

      c. een inwonend kind van zijn echtgenote of echtgenoot;

      d. een pleegkind dat blijkens verklaringen uit de gemeentelijke basisadministratie op hetzelfde adres woont
      als de ambtenaar en door hem duurzaam wordt verzorgd en opgevoed op basis van een pleegcontract als bedoeld in
      [artikel 39 van de Wet op de jeugdhulpverlening][ref1].

      2 Tenzij een zwaarwegend dienstbelang zich daartegen verzet wordt aan de ambtenaar verlof met behoud van
      bezoldiging verleend voor de noodzakelijke verzorging in verband met ernstige ziekte van: echtgenote, echtgenoot,
      ouders, stiefouders, pleegouders, schoonouders, kinderen, stiefkinderen, pleegkinderen of aangehuwde kinderen.

      3 Het verlof, bedoeld in het eerste en tweede lid, bedraagt in elk kalenderjaar ten hoogste tweemaal de arbeidsduur
      per week.

      4 De ambtenaar meldt vooraf aan het bevoegd gezag dat hij het verlof, bedoeld in het eerste en tweede lid, opneemt
      onder opgave van de reden. Indien dit niet mogelijk is, meldt de ambtenaar het opnemen van het verlof zo spoedig
      mogelijk aan het bevoegd gezag onder opgave van de reden. Bij die melding geeft de ambtenaar ook de omvang, de
      wijze van opneming en de vermoedelijke duur van het verlof aan.

      5 Het bevoegd gezag kan achteraf van de ambtenaar verlangen dat hij aannemelijk maakt dat hij zijn arbeid niet
      heeft verricht in verband met de noodzakelijke verzorging als bedoeld in het eerste en tweede lid.

      6 Indien de ambtenaar aan wie verlof is verleend gedurende dat verlof of gedurende een bepaalde periode van dat
      verlof tevens recht heeft op een financiële tegemoetkoming op basis van de Wet arbeid en zorg, wordt gedurende de
      periode waarin sprake is van samenloop een inhouding op de doorbetaling van bezoldiging als bedoeld in het eerste
      en tweede lid toegepast welke overeenkomt met het bedrag van bedoelde financiële tegemoetkoming.

      7 Indien aan gestelde voorwaarden voor het toekennen van een financiële tegemoetkoming als bedoeld in het zesde
      lid is voldaan maar geen financiële tegemoetkoming is toegekend omdat de ambtenaar geen aanvraag heeft ingediend,
      past het bevoegd gezag het zesde lid op overeenkomstige wijze toe. In dat geval wordt rekening gehouden met de
      financiële tegemoetkoming die aan de ambtenaar zou zijn toegekend indien hij wel een aanvraag zou hebben ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel39
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel33i
