      1 Voor de ontslagverlening als bedoeld in [artikel 125][ref1], is overeenstemming vereist met Onze Minister
      van Binnenlandse Zaken en Koninkrijksrelaties. Deze is gehouden het advies in te winnen van de Adviescommissie
      grondrechten en functie-uitoefening ambtenaren.

      2 Indien het voornemen tot ontslagverlening afkomstig is van Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties is overeenstemming vereist met Onze Minister-President.


