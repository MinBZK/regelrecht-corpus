  - number: 102b
    text: |-
      1 Indien het overlijden van de ambtenaar is veroorzaakt door een dienstongeval of een door het verrichten van zijn
      arbeid opgelopen beroepsziekte, wordt aan degene die in verband met dit overlijden krachtens het Pensioenreglement
      van de Stichting Pensioenfonds ABP, een nabestaandenpensioen geniet, een uitkering toegekend ten bedrage van 18
      procent van het resultaat van de vermenigvuldiging van:

      a) indien het gaat om de partner, bedoeld in artikel 7.1 van het Pensioenreglement van de Stichting
      Pensioenfonds ABP, vijf zevende deel van 1,75 procent van de berekeningsgrondslag, bedoeld in artikel 6.2 van het
      Pensioenreglement van de Stichting Pensioenfonds ABP en de pensioengeldige diensttijd, bedoeld in hoofdstuk 5 van
      het Pensioenreglement van de Stichting Pensioenfonds ABP;

      b) indien het gaat om de wees, bedoeld in artikel 7.7, eerste lid, aanhef, onderdeel a, van het Pensioenreglement
      van de Stichting Pensioenfonds ABP, een zevende deel van 1,75 procent van de berekeningsgrondslag, bedoeld in
      artikel 6.2 van het Pensioenreglement van de Stichting Pensioenfonds ABP, en de pensioengeldige diensttijd, bedoeld
      in hoofdstuk 5 van het Pensioenreglement van de Stichting Pensioenfonds ABP;

      c) indien het gaat om de wees, bedoeld in artikel 7.7, eerste lid, aanhef, onderdeel b, van het Pensioenreglement
      van de Stichting Pensioenfonds ABP, twee zevende deel van 1,75 procent van de berekeningsgrondslag, bedoeld in
      artikel 6.2 van het Pensioenreglement van de Stichting Pensioenfonds ABP, en de pensioengeldige diensttijd, bedoeld
      in hoofdstuk 5 van het Pensioenreglement van de Stichting Pensioenfonds ABP.

      Indien de weduwe of weduwnaar een samenlevingscontract sluit dan wel een geregistreerd partnerschap aangaat,
      eindigt de uitkering met ingang van de maand volgend op de datum van het sluiten van het samenlevingscontract dan
      wel het aangaan van het geregistreerd partnerschap.

      2 De uitkering eindigt met ingang van de dag waarop de overledene de leeftijd van 65 jaar zou hebben bereikt, dan
      wel, indien de partner, bedoeld in artikel 7.1 van het Pensioenreglement van de Stichting Pensioenfonds ABP, aan
      wie een pensioen werd toegekend, hertrouwt, met ingang van de maand volgende op de datum van het hertrouwen. Indien
      de weduwe of weduwnaar een samenlevingscontract sluit dan wel een geregistreerd partnerschap aangaat, eindigt de
      uitkering met ingang van de maand volgende op de datum van het sluiten van het samenlevingscontract dan wel van het
      aangaan van het geregistreerd partnerschap.

      3 Het eerste lid is van overeenkomstige toepassing op de gewezen ambtenaar ten aanzien van wie artikel 38, derde
      lid, toepassing heeft gevonden, indien zijn overlijden het rechtstreeks gevolg is van de arbeidsongeschiktheid,
      bedoeld in dat artikel.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel102b
  - number: '103'
    text: |-
      1 Gedurende de maand van het overlijden en de volgende drie maanden behouden de achterblijvende gezinsleden het
      gebruik der ambts- of dienstwoning, waarin zij met de ambtenaar woonden. Daarvan kan echter worden afgeweken als
      Onze Minister dat in het belang van de dienst noodzakelijk acht. Alsdan wordt door Onze Minister naar billijkheid
      een schadevergoeding gegeven.

      2 Bij vrijwillig verlaten van de ambts- of dienstwoning binnen de termijn, gedurende welke de woning nog mag worden
      gebruikt, kan Onze Minister te zijner beoordeling een vergoeding geven.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel103
  - number: '104'
    text: |-
      Indien door de ambtenaar voor het gebruik der ambts- of dienstwoning een vergoeding verschuldigd was, voldoen de
      achtergebleven gezinsleden deze over de tijd, gedurende welke zij het gebruik dier woning behouden.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel104
  - number: 104a
    text: |-
      1 Bij vermissing van de ambtenaar vinden, behoudens het bepaalde in het tweede lid, de bepalingen van de artikelen
      102 tot en met 104 overeenkomstige toepassing. De ambtenaar wordt daarbij geacht te zijn overleden op een door Onze
      Minister te bepalen dag.

      2 Het bepaalde in het tweede lid van artikel 102 vindt geen toepassing indien gegronde vermoedens bestaan, dat de
      vermissing het gevolg is van ongeoorloofde afwezigheid.

      3 Indien blijkt, dat de als vermist beschouwde ambtenaar in leven is, kan ter beoordeling van het bevoegde gezag
      de bezoldiging alsnog worden uitbetaald, tenzij gegronde vermoedens bestaan, dat de vermissing het gevolg was van
      ongeoorloofde afwezigheid.

      4 Indien uit hoofde van de vermissing van de ambtenaar pensioen of enige andere uitkering, voortvloeiende uit
      zijn ambtelijke rechtspositieregeling, is toegekend over het tijdvak, waarover naar het oordeel van het bevoegde
      gezag aanspraak bestaat op bezoldiging, wordt die bezoldiging verminderd met de over dat tijdvak aldus uitbetaalde
      bedragen.

      5 De bezoldiging, waarop de ambtenaar ingevolge het derde en het vierde lid aanspraak heeft, kan aan anderen dan de
      ambtenaar worden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel104a
  - number: '105'
    text: |-
      1 Over aangelegenheden van algemeen belang voor de rechtstoestand van de ambtenaren in de zin van dit besluit met
      inbegrip van de algemene regels volgens welke het personeelsbeleid zal worden gevoerd, wordt niet beslist dan nadat
      daarover door of namens Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties overleg is gepleegd met de
      Sectorcommissie overleg rijkspersoneel.

      2 De Sectorcommissie bestaat uit vertegenwoordigers van:

      a. de Algemene Centrale van Overheidspersoneel;

      b. de Christelijke Centrale van Overheids- en Onderwijspersoneel;

      c. het Ambtenarencentrum;

      d. de Centrale van Middelbare en Hogere Functionarissen bij Overheid en Onderwijs, Bedrijven en Instellingen;

      e. andere door Ons tot het overleg toegelaten centrales van verenigingen van ambtenaren, welke onder meer gelet
      op het aantal ambtenaren, dat zij vertegenwoordigen, eveneens als representatief kunnen worden aangemerkt en tegen
      wier toelating het algemeen belang zich niet verzet.

      3 Indien een voorstel, waarover overleg dient plaats te vinden, strekt tot invoering of wijziging van een regeling
      met rechten of verplichtingen van individuele ambtenaren wordt dit voorstel slechts ten uitvoer gebracht, indien
      daarover overeenstemming bestaat met de Sectorcommissie. Het standpunt van de Sectorcommissie wordt bepaald bij
      meerderheid van stemmen. Elke centrale brengt één stem uit. Indien de stemmen binnen de Sectorcommissie staken,
      beslist Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties of het voorstel ten uitvoer wordt gebracht.

      4 In de Sectorcommissie wordt geen overleg gevoerd over voorstellen die betrekking hebben op het gehele
      overheidspersoneel.

      5 Indien een voorstel als bedoeld in het vierde lid, ziet op het van toepassing verklaren op overheidspersoneel
      van een wettelijke regeling die betrekking heeft op werknemers, die krachtens arbeidsovereenkomst als bedoeld
      in artikel 1637*a* van het Burgerlijk Wetboek werkzaam zijn, vindt in de Sectorcommissie overleg plaats over
      de gevolgen van een desbetreffend voorstel voor ambtenaren en de eventueel daarmee samenhangende wijzigingen
      in de voor hen geldende regelingen. Het overeenstemmingsvereiste, bedoeld in het derde lid, is daarbij niet
      van toepassing, mits het totaal van rechten en verplichtingen van ambtenaren over het geheel beoordeeld niet
      ongunstiger wordt.

      6 Indien bij het overleg, bedoeld in het vijfde lid, een geschil ontstaat over de vraag of wordt voldaan aan
      de voorwaarde dat het totaal van rechten en verplichtingen van de ambtenaren over het geheel beoordeeld niet
      ongunstiger wordt, wordt dat geschil onderworpen aan arbitrage door de Advies- en Arbitragecommissie, genoemd in
      artikel 110*g*.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel105
  - number: '106'
    text: |-
      1 Elke centrale is bevoegd tot aanwijzing van twee leden en twee plaatsvervangende leden van de Sectorcommissie.

      2 Wij behouden Ons voor een toelating tot het overleg krachtens artikel 105 te schorsen en een toelating tot het
      overleg krachtens het tweede lid van dat artikel, onder *e*, in te trekken, indien de centrale van verenigingen
      van ambtenaren naar Ons oordeel niet meer representatief is dan wel het algemeen belang zich tegen haar verdere
      toelating verzet.

      3 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties is bevoegd een lid of plaatsvervangend lid van de
      Sectorcommissie van deelneming aan het overleg uit te sluiten indien naar het oordeel van Onze genoemde Minister
      het dienstbelang dit in verband met zijn werkzaamheden als Rijksambtenaar vordert. De uitsluiting geschiedt niet
      dan nadat het bestuur van de daarbij betrokken zijnde centrale van verenigingen van ambtenaren over het voornemen
      daartoe is gehoord, en het advies van de overige leden van de Sectorcommissie daarover is ingewonnen.

      In afwachting van de beslissing van Onze Minister neemt het betrokken lid of plaatsvervangend lid niet of niet meer
      deel aan het overleg.

      Na de uitsluiting wijst de desbetreffende centrale een andere vertegenwoordiger aan als lid of plaatsvervangend lid
      van de Sectorcommissie in de plaats van de uitgeslotene.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel106
  - number: '107'
    text: |-
      1 Het overleg staat onder leiding van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties. Hij is bevoegd
      de leiding van het overleg op te dragen aan de directeur-generaal Management en Personeelsbeleid van het ministerie
      van Binnenlandse Zaken en Koninkrijksrelaties, indien de aard van de te bespreken aangelegenheden dit toelaat.

      2 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties wijst functionarissen aan die hem, dan wel de
      functionaris die namens hem het overleg voert, bij het overleg terzijde staan.

      3 Het secretariaat van het overleg wordt gevoerd door een door Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties benoemde of aangewezen secretaris, die ten dienste staat van zowel de voorzitter en de in het
      tweede lid bedoeld ambtenaren als van de Sectorcommissie. De benoeming of aanwijzing van de secretaris geschiedt in
      overeenstemming met de Sectorcommissie.

      4 Bij de behandeling van bepaalde aangelegenheden kan op uitnodiging of met toestemming van de voorzitter ook door
      anderen dan degenen, die daartoe ingevolge de vorige bepalingen van dit hoofdstuk bevoegd zijn, aan het overleg
      worden deelgenomen.

      5 De leden van de Sectorcommissie kunnen zich na overleg met de voorzitter ter vergadering voor de behandeling van
      een bepaald onderwerp door een deskundige doen bijstaan.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel107
  - number: 107a
    text: |-
      De centrales van verenigingen van ambtenaren, die van de in artikel 106, eerste lid, vermelde bevoegdheid hebben
      gebruik gemaakt, doen aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties mededeling van haar statuten
      en huishoudelijke reglementen en van de daarin aangebrachte wijzigingen, zomede van de statuten en van de daarin
      aangebrachte wijzigingen van de bij haar aangesloten verenigingen van ambtenaren.

      Zij stellen Onze genoemde Minister voorts jaarlijks in kennis van het totale ledental van de bij elk der centrales
      aangesloten verenigingen.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel107a
  - number: '108'
    text: |-
      1 De in artikel 105 bedoelde aangelegenheden worden door Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties aan de Sectorcommissie voorgelegd.

      2 Ieder der tot het overleg toegelaten centrales van verenigingen van ambtenaren is bevoegd aan Onze Minister
      van Binnenlandse Zaken en Koninkrijksrelaties bepaalde onderwerpen, behorende tot de in artikel 105 bedoelde, ter
      plaatsing op de agenda op te geven.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel108
  - number: 108a
    text: |-
      Een wijziging van het [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1], betrekking hebbende op een ambt
      dat is vermeld in bijlage A van dat besluit, behoort niet tot de in artikel 105 bedoelde aangelegenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel108a
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: 108a_bis
    text: |-
      1 Het overleg wordt gevoerd op plaats, dag en uur door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      te bepalen.

      2 De vergaderingen worden in de regel te 's-Gravenhage gehouden.

      3 Indien de vertegenwoordigers van tenminste twee tot het overleg toegelaten centrales van verenigingen van
      ambtenaren Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, onder vermelding van hetgeen zij behandeld
      wensen te zien, verzoeken daartoe een vergadering uit te schrijven, vindt deze binnen 14 dagen plaats.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel108a
  - number: '109'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties verleent zijn bemiddeling om aan de Sectorcommissie een
      lokaliteit in een Rijksgebouw ter beschikking te stellen, indien deze Sectorcommissie daartoe een verzoek doet ten
      behoeve van een door haar te houden vergadering.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel109
  - number: '110'
    text: |-
      1 Indien het wenselijk blijkt over de in artikel 105 bedoelde aangelegenheden voorbereidende besprekingen
      te voeren of in het overleg genomen besluiten uit te werken, geschiedt deze voorbereiding of uitwerking door
      werkgroepen bestaande uit vertegenwoordigers van de Sectorcommissie en door Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties daartoe aangewezen functionarissen.

      2 Het bepaalde in het vierde en vijfde lid van artikel 107 is daarbij van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel110
  - number: 110a
    text: |-
      1 Het standpunt van de Sectorcommissie wordt bepaald bij eenvoudige meerderheid van stemmen.

      2 Elke centrale brengt één stem uit.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel110a
  - number: 110b
    text: |-
      Voor de toepassing van het bepaalde in de artikelen 110*d* en volgende wordt verstaan onder:

      a. "deelnemers aan het overleg": de voorzitter en de tot het overleg toegelaten centrales van verenigingen van
      ambtenaren;

      b. "Advies- en Arbitragecommissie": de Advies- en Arbitragecommissie genoemd in artikel 110*g*.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel110b
  - number: 110c
    text: |-
      De artikelen 110*d* tot en met 110*h* zijn slechts van toepassing op geschillen inzake aangelegenheden als bedoeld
      in artikel 105 voorzover die aangelegenheden uitsluitend de rechtstoestand van ambtenaren met inbegrip van de
      algemene regels volgens welke het personeelsbeleid zal worden gevoerd, betreffen.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel110c
  - number: 110d
    text: |-
      Indien de voorzitter dan wel een of meer van de centrales, in het overleg tot het oordeel komen dat dit overleg
      niet tot een uitkomst zal leiden die de instemming van alle deelnemers aan dat overleg zal hebben, brengen zij
      dat oordeel binnen 3 dagen nadat zij daarvan in het overleg blijk hebben gegeven, schriftelijk ter kennis van de
      overige deelnemers aan het overleg.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel110d
  - number: 110e
    text: |-
      1 Binnen vijf dagen na de kennisgeving bedoeld in het vorige artikel, schrijft de voorzitter een overlegvergadering
      uit. De vergadering moet worden gehouden binnen zeven dagen nadat deze is uitgeschreven.

      2 Tenzij door de voorzitter en de Sectorcommissie wordt besloten het overleg voort te zetten dan wel te beëindigen
      wordt in de vergadering nagegaan of overeenstemming bestaat over de vraag wat het onderwerp en de inhoud van het
      geschil is en of een oplossing van dat geschil zal worden gezocht door middel van voortzetting van het overleg
      nadat het advies is ingewonnen van de Advies- en Arbitragecommissie, dan wel door middel van onderwerping van het
      geschil aan een arbitrale uitspraak van de Advies- en Arbitragecommissie.

      3 Tot het inwinnen van advies is zowel de voorzitter als de Sectorcommissie bevoegd.

      4 Voor onderwerping van het geschil aan arbitrage is overeenstemming vereist tussen alle deelnemers aan het
      overleg.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel110e
  - number: 110f
    text: |-
      1 Binnen drie dagen na de vergadering bedoeld in het vorige artikel, wordt het verzoek om advies ter kennis
      gebracht van de voorzitter van de Advies- en Arbitragecommissie. Het verzoek wordt ondertekend door de deelnemers
      aan het overleg die zich voor inwinning van advies hebben uitgesproken en bevat tenminste het onderwerp en de
      inhoud van het geschil. Indien in de vergadering bedoeld in het vorige artikel geen overeenstemming is bereikt
      tussen alle deelnemers aan het overleg over de vraag wat het onderwerp en de inhoud van het geschil is, brengen
      de overige deelnemers aan het overleg hun visie op het onderwerp en de inhoud van het geschil eveneens binnen drie
      dagen na eerdergenoemde vergadering ter kennis van de voorzitter van de Advies- en Arbitragecommissie.

      2 Het bepaalde in de eerste volzin van het vorige lid is van overeenkomstige toepassing ten aanzien van het
      onderwerpen van het geschil aan een arbitrale uitspraak. Het verzoek daartoe wordt ondertekend door alle deelnemers
      aan het overleg en dient tenminste te bevatten:

      a. het onderwerp en de inhoud van het geschil;

      b. de standpunten van alle deelnemers aan het overleg omtrent onderwerp en inhoud van het geschil.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel110f
  - number: 110g
    text: |-
      1 Er is een Advies- en Arbitragecommissie, die tot taak heeft te adviseren dan wel een bindende uitspraak te doen
      in de geschillen die haar ingevolge de voorgaande artikelen worden voorgelegd.

      2 De Advies- en Arbitragecommissie is gevestigd te 's-Gravenhage. Zij bestaat uit vijf leden, onder wie de
      voorzitter, en vijf plaatsvervangende leden. Zij worden door Ons benoemd voor een tijdvak van zes jaar.

      3 Wij benoemen de voorzitter en diens plaatsvervanger op gezamenlijke voordracht van Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties en de Sectorcommissie. Van de andere vier leden en hun plaatsvervangers benoemen wij:

      a. twee leden en hun plaatsvervangers op voordracht van Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties; alsmede

      b. twee leden en hun plaatsvervangers op voordracht van de Sectorcommissie.

      4 Uitgesloten van het lidmaatschap en plaatsvervangend lidmaatschap zijn:

      a. personen die lid dan wel plaatsvervangend lid zijn van de Sectorcommissie;

      b. personen die bestuurslid zijn van, dan wel werkzaam zijn bij een centrale van verenigingen van ambtenaren als
      bedoeld in artikel 105 of een daarbij aangesloten vereniging;

      c. personen die werkzaam zijn bij de departementen van algemeen bestuur en de daaronder ressorterende instellingen,
      diensten en bedrijven, wier onafhankelijkheid en onpartijdigheid op grond van hun dienstverband door de deelnemers
      aan het overleg onvoldoende wordt geacht.

      Deze personen zijn eveneens uitgesloten van het lidmaatschap of plaatsvervangend lidmaatschap gedurende de periode
      van twee jaar na beëindiging van het lidmaatschap, plaatsvervangend lidmaatschap of bestuurslidmaatschap onder *a*
      en *b* bedoeld, alsmede na beëindiging van de werkzaamheden bedoeld onder *b* en *c*.

      5 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties wijst in overeenstemming met de Sectorcommissie en
      met de voorzitter van de Advies- en Arbitragecommissie een secretaris aan, die de Advies- en Arbitragecommissie
      bijstaat.

      6 Aan de leden en plaatsvervangende leden worden uit ’s Rijks kas vergoedingen voor reis- en verblijfkosten
      verleend volgens de regels welke voor de vergoeding voor reis- en verblijfkosten wegens reizen voor ’s Rijks dienst
      gelden.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel110g
  - number: 110h
    text: |-
      1 De Advies- en Arbitragecommissie treedt in geval van advies op in een samenstelling van drie leden, onder wie
      de voorzitter, een van de twee leden bedoeld in het derde lid onder *a* van het vorige artikel en een van de twee
      leden bedoeld in het derde lid onder *b* van dat artikel. De overige twee leden treden te zamen met de voorzitter
      op in geval van arbitrage. Bij verhindering van een der leden treedt diens plaatsvervanger op.

      2 Indien het verzoek om arbitrage naar het oordeel van de voorzitter een zelfde geschil betreft als waarover door
      de Advies- en Arbitragecommissie reeds advies is uitgebracht, treedt voor een lid die bij het uitbrengen van dat
      advies betrokken was, diens plaatsvervanger op.

      3 De voorzitter draagt er zorg voor dat het advies of de uitspraak binnen vier weken, nadat de kennisgeving bedoeld
      in artikel 110*f*, is ontvangen, aan de deelnemers aan het overleg ter kennis wordt gebracht.

      4 De Advies- en Arbitragecommissie stelt nadere regels vast met betrekking tot haar werkwijze.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel110h
  - number: 110i
    text: |-
      1 De Advies- en Arbitragecommissie besluit bij meerderheid van stemmen.

      2 Het advies of de uitspraak moet inhouden:

      a. de namen van de deelnemers die het advies of de arbitrale uitspraak hebben aangevraagd;

      b. een overzicht van de standpunten van alle deelnemers over het onderwerp en over de inhoud van het geschil;

      c. het advies dan wel de beslissing en de redenen die daaraan ten grondslag liggen.

      3 Het advies of de uitspraak wordt gedagtekend en door ieder der optredende leden van de Advies- en
      Arbitragecommissie ondertekend.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel110i
  - number: 110j
    text: Binnen twee weken na ontvangst van het advies wordt het overleg over het geschil voortgezet.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel110j
  - number: 110k
    text: De uitspraak van de Advies- en Arbitragecommissie heeft bindende kracht.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel110k
  - number: 110l
    text: |-
      1 Het standpunt van de Sectorcommissie over de haar voorgelegde dan wel op verzoek van haar zijde in het overleg
      besproken aangelegenheden wordt schriftelijk aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      bevestigd, waarbij desverlangd een samenvatting van de aan dit standpunt ten grondslag liggende argumenten wordt
      gegeven.

      2 Indien in de Sectorcommissie een minderheidsstandpunt blijkt te bestaan, wordt daarvan desverlangd in het
      geschrift bedoeld in het vorige lid, melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel110l
  - number: '111'
    text: |-
      Indien over een aangelegenheid in afwijking van het standpunt van de Sectorcommissie wordt beslist, brengt Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties de redenen dier afwijking zo spoedig mogelijk ter kennis van
      de Sectorcommissie.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel111
  - number: '112'
    text: |-
      Van het in de vergaderingen van het overleg en de werkgroepen behandelde maakt de secretaris notulen. Bovendien
      wordt een verslag opgemaakt, bevattende een beknopte samenvatting van het verhandelde, voor zover dat voor
      openbaarmaking geschikt kan worden geacht.

      Na overleg met de Sectorcommissie onderscheidenlijk de door deze in de betrokken werkgroep aangewezen leden, kan
      de voorzitter ten aanzien van het in vorenbedoelde vergaderingen verhandelde, geheimhouding opleggen. De plicht
      tot geheimhouding geldt niet, indien en voor zover de leden van de Sectorcommissie dan wel de door haar in de
      betrokken werkgroep aangewezen leden in bespreking treden met de door hen vertegenwoordigde centrales of de daarbij
      aangesloten verenigingen.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel112
  - number: '113'
    text: |-
      1 Voor zover Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties in overeenstemming met de Sectorcommissie
      overleg rijkspersoneel niet anders heeft bepaald, wordt over voorgenomen besluiten tot invoering of wijziging van
      regels met rechten of verplichtingen van individuele ambtenaren en over voorgenomen besluiten tot een belangrijke
      reorganisatie, niet door Onze Minister beslist dan nadat door hem overleg is gevoerd met de centrales van
      verenigingen van ambtenaren.

      2 Het overleg heeft geen betrekking op aangelegenheden waarover overleg dient te worden gevoerd met de
      Sectorcommissie overleg rijkspersoneel.

      3 Een voorgenomen besluit tot invoering of wijziging van regels met rechten of verplichtingen van individuele
      ambtenaren waarover overleg met de centrales moet worden gevoerd, wordt slechts ten uitvoer gebracht indien
      daarover overeenstemming bestaat met ten minste de helft van de tot het overleg toegelaten centrales.

      4 Het overleg over voorgenomen besluiten tot een belangrijke reorganisatie heeft slechts betrekking op de
      bijzondere rechtspositionele en sociale gevolgen van het voorgenomen besluit voor de betrokken ambtenaren.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel113
  - number: '114'
    text: |-
      1 Onze Minister laat tot het overleg toe de tot de Sectorcommissie overleg rijkspersoneel toegelaten centrales.

      2 Schorsing dan wel intrekking van een toelating van een centrale tot de Sectorcommissie overleg rijkspersoneel,
      heeft tot gevolg schorsing respectievelijk intrekking van de toelating tot het overleg.

      3 Onze Minister kan een vertegenwoordiger van een centrale uitsluiten van deelneming aan het overleg indien
      naar het oordeel van Onze Minister het dienstbelang dit in verband met de werkzaamheden van betrokkene als
      Rijksambtenaar vordert. Voordat tot uitsluiting wordt besloten wordt het bestuur van de desbetreffende centrale
      in de gelegenheid gesteld zijn zienswijze naar voren te brengen. In afwachting van de beslissing van Onze Minister
      neemt betrokkene niet of niet meer deel aan het overleg.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel114
  - number: '115'
    text: |-
      In geval van een geschil omtrent een voorgenomen besluit tot invoering of wijziging van regels met rechten
      of verplichtingen van individuele ambtenaren waarover overleg met de centrales moet worden gevoerd, zijn de
      artikelen 110b en 110d tot en met 110k van overeenkomstige toepassing, met dien verstande dat de Advies- en
      Arbitragecommissie, genoemd in artikel 110g, voor de behandeling van het geschil wordt uitgebreid met twee
      bijzondere leden die worden benoemd door Onze Minister. Van deze leden wordt één lid benoemd op voordracht van de
      tot het overleg toegelaten centrales. Niet benoembaar tot bijzonder lid zijn:

      a. personen die ingevolge artikel 110g, vierde lid, zijn uitgesloten van het lidmaatschap en het plaatsvervangend
      lidmaatschap;

      b. personen die namens de centrales aan het overleg deelnemen, dan wel wier deelname aan het overleg nog niet
      langer dan twee jaar is beëindigd.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel115
  - number: '116'
    text: |-
      Onze Minister kan geheimhouding opleggen ten aanzien van hetgeen in het overleg is behandeld. De plicht tot
      geheimhouding geldt niet voor zover degenen die namens de centrales aan het overleg deelnemen in bespreking treden
      met de door hen vertegenwoordigde centrales of de daarbij aangesloten verenigingen.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel116
  - number: '117'
    text: |-
      Onze Minister draagt er zorg voor dat de ambtenaar, die in het overleg optreedt of heeft opgetreden namens een
      centrale, en de ambtenaar, die lid is geweest van een bijzondere commissie, niet uit dien hoofde worden benadeeld
      in hun positie als ambtenaar.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel117
  - number: '118'
    text: |-
      De artikelen 113 tot en met 117 zijn van overeenkomstige toepassing op de Raad van State, de Algemene Rekenkamer
      en de Nationale ombudsman, met dien verstande dat voor Onze Minister telkens wordt gelezen respectievelijk de vice-
      president van de Raad van State, het College van de Algemene Rekenkamer en de Nationale ombudsman.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel118
  - number: '130'
    text: |-
      Met ingang van den dag van inwerkingtreding van dit besluit vervallen:

      a. het Koninklijk besluit van 5 November 1851 (*Staatsblad* n°. 141);

      b. het Koninklijk besluit van 24 Juli 1869 (*Staatsblad* n°. 142), zooals dit besluit sedert is gewijzigd;

      c. Ons besluit van 20 December 1919 (*Staatsblad* n°. 819), zooals dit besluit sedert is gewijzigd;

      d. Ons besluit van 14 Februari 1920 (*Staatsblad* n°. 76);

      e. Ons besluit van 2 Mei 1921 (*Staatsblad* n°. 703), zooals dit besluit sedert is gewijzigd;

      f. Ons besluit van 6 Mei 1922 (*Staatsblad* n°. 260), zooals dit besluit sedert is gewijzigd;

      g. Ons besluit van 26 October 1923 (*Staatsblad* n°. 494), zooals dit besluit sedert is gewijzigd;

      h. Ons besluit van 1 December 1923 (*Staatsblad* n°. 535), zooals dit besluit sedert is gewijzigd;

      i. Ons besluit van 13 Maart 1924 (*Staatsblad* n°. 122);

      j. Ons besluit van 8 December 1926, n°. 4, behoudens het bepaalde onder ten 3°. daarin;

      k. Ons besluit van 14 Maart 1927 (*Staatsblad* n°. 53), zooals dit besluit sedert is gewijzigd.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel130
  - number: '131'
    text: |-
      Op personen, die op het tijdstip van inwerkingtreding van dit besluit in het genot zijn van een wachtgeld,
      toegekend krachtens het Koninklijk besluit van 24 Juli 1869 (*Staatsblad* n°. 142), zooals dat besluit laatstelijk
      is gewijzigd, blijven de bepalingen van dat besluit van toepassing.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel131
  - number: '132'
    text: |-
      Voor zover voor ambtenaren bij een dienstvak nadere regels ter uitwerking of aanvulling van de bepalingen van dit
      besluit worden vereist, worden die regels door Ons, of in overeenstemming met Ons door Onze Minister, vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel132
  - number: 132a
    text: |-
      De [Algemene Termijnenwet][ref1] is niet van toepassing op de termijnen in dit besluit gesteld met uitzondering
      van die, genoemd in de artikelen 10, tweede en derde lid, [artikel 36b, derde en vierde lid][ref2], alsmede in
      hoofdstuk XI.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel36b
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel132a
    references:
      - id: ref1
        bwb_id: BWBR0002448
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 36b
        hoofdstuk: VI
        paragraaf: '2'
  - number: 132b
    text: |-
      Van de bevoegdheid tot het stellen van regels met een sterk technisch karakter krachtens dit besluit, anders
      dan krachtens de artikelen 4a, 9 en 10, kunnen Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, Onze
      Minister van Financiën en Onze Minister mandaat verlenen.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel132b
  - number: '133'
    text: Dit besluit treedt in werking met ingang van 1 September 1931.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel133
  - number: '134'
    text: Dit besluit kan worden aangehaald als "Algemeen Rijksambtenarenreglement".
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel134
