  - number: 40a
    text: |-
      1 De aanspraken van de ambtenaar en de gewezen ambtenaar op grond van dit hoofdstuk vervallen indien de ambtenaar
      of de gewezen ambtenaar:

      a) niet binnen redelijke termijn gezondheidskundige hulp inroept;

      b) zich niet gedurende het gehele verloop van de ziekte onder gezondheidskundige behandeling blijft stellen;

      c) de voorschriften van de behandelende arts niet opvolgt;

      d) zich schuldig maakt aan gedragingen waardoor zijn genezing wordt belemmerd;

      e) verzuimt de Arbo-dienst op eerste aanvraag mee te delen om welke reden hij ongeschikt is tot werken;

      f) zonder deugdelijke grond nalaat gevolg te geven aan een verzoek van de Arbo-dienst om te verschijnen;

      g) er de oorzaak van is dat het arbeidsgezondheidskundig onderzoek door een door de Arbo-dienst aangewezen arts
      niet kan plaatshebben;

      h) niet binnen twee dagen na de aanvang van de ongeschiktheid tot werken wegens ziekte dit heeft gemeld bij zijn
      werkgever;

      i) weigert aangeboden passende of gangbare arbeid, waartoe de Arbo-dienst hem in staat acht, te verkrijgen of te
      aanvaarden, dan wel, zonder deugdelijke grond weigert deze arbeid, waartoe het bevoegd gezag hem in de gelegenheid
      stelt, te verrichten;

      j) zich niet houdt aan de ten aanzien van hem geldende regels met betrekking tot de wijze waarop invulling wordt
      gegeven aan de verzuimbegeleiding en de arbeidsgezondheidskundige begeleiding en de daarbij in acht te nemen
      procedure;

      k) zijn ongeschiktheid tot werken opzettelijk heeft veroorzaakt;

      l) weigert inzage te geven in een op hem betrekking hebbend document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] of een geldig rijbewijs als bedoeld in artikel 9, eerste
      lid, van de Wegenverkeerswet, voor zover dit redelijkerwijs nodig is voor de uitvoering van wetten;

      m) tijdens de ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte arbeid voor zichzelf of voor derden
      verricht, tenzij dit door de Arbo-dienst in het belang van zijn genezing wenselijk wordt geacht;

      n) vóór de betaling van de bezoldiging weigert mededeling te doen van inkomsten uit arbeid die hij heeft in verband
      met het verrichten van door de Arbo-dienst in het belang van zijn genezing wenselijk geachte arbeid voor zichzelf
      of voor derden;

      o) niet onverwijld op verzoek of uit eigen beweging alle feiten en omstandigheden meedeelt, waarvan hem
      redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op het recht of op de hoogte van een aan hem
      toegekende arbeidsongeschiktheidsuitkering;

      p) zijn arbeid verzuimt te hervatten op het door de Arbo-dienst bepaalde tijdstip en in de door deze dienst
      bepaalde mate, indien zulks hem is opgedragen, tenzij hij daarvoor een door de Arbo-dienst als geldig erkende reden
      heeft opgegeven;

      q) zonder deugdelijke grond weigert gevolg te geven aan door het bevoegd gezag of een door het bevoegd gezag
      aangewezen deskundige gegeven redelijke voorschriften of mee te werken aan getroffen maatregelen die erop gericht
      zijn om de betrokkene in staat te stellen passende of gangbare arbeid te verrichten;

      r) zonder deugdelijke grond weigert mee te werken aan het opstellen, evalueren of bijstellen van een plan van
      aanpak, bedoeld in [artikel 71a, tweede lid, van de WAO][ref2];

      s) geen aanspraak heeft op een WAO-uitkering in verband met de toepassing van [artikel 25][ref3] of
      [28, onder a of b, van de WAO][ref4];

      t) zijn medewerking weigert bij de doelmatige uitvoering van de bepalingen van dit hoofdstuk.

      2 De aanspraak op de doorbetaling van bezoldiging of de bovenwettelijke arbeidsongeschiktheidsuitkering, kan
      geheel of gedeeltelijk vervallen worden verklaard in het geval de ambtenaar of de gewezen ambtenaar de regels heeft
      overtreden die ter zake van afwezigheid wegens ziekte zijn vastgesteld.

      3 De ingevolge het eerste lid vervallen aanspraken herleven met ingang van het tijdstip waarop de ambtenaar of de
      gewezen ambtenaar alsnog gevolg geeft aan de betreffende verplichting op grond van dat lid.

      4 Onze Minister kan op grond van bijzondere omstandigheden bepalen, dat de aanspraak op de doorbetaling van
      bezoldiging of de bovenwettelijke arbeidsongeschiktheidsuitkering, niet vervalt maar geheel of ten dele aan anderen
      dan aan de ambtenaar of de gewezen ambtenaar zal worden uitbetaald.

      5 Voor zover Onze Minister van de bevoegdheid, bedoeld in het vierde lid, geen gebruik
      heeft gemaakt, wordt de niet uitbetaalde bezoldiging of de niet uitbetaalde bovenwettelijke
      arbeidsongeschiktheidsuitkering, alsnog aan de ambtenaar of de gewezen ambtenaar uitbetaald, indien het in
      [artikel 30, eerste lid, onderdeel e, van de Wet SUWI][ref5], bedoelde oordeel ten gunste van de ambtenaar of de
      gewezen ambtenaar uitvalt.

      6 Indien betrokkene aanspraak heeft op een WAO-uitkering, is op de aanspraak die de ambtenaar of de gewezen
      ambtenaar heeft op doorbetaling van de bezoldiging, het verplichtingen- en sanctieregime van de WAO van
      overeenkomstige toepassing.

      7 Indien ten aanzien van de WAO-uitkering, die de ambtenaar of de gewezen ambtenaar geniet, een verplichting
      wordt opgelegd of een sanctie wordt toegepast, wordt door Onze Minister zoveel mogelijk dezelfde
      verplichting opgelegd dan wel een overeenkomende sanctie toegepast op de aanspraken als bedoeld in de
      [artikelen 37, eerste, tweede, en derde lid][ref6], [38, eerste en tweede lid][ref7], of [39, tweede lid][ref8].

      8 Indien als gevolg van handelingen of het nalaten van handelingen door de ambtenaar, de WAO-uitkering vermindering
      ondergaat, dan wel de aanspraak daarop geheel of gedeeltelijk wordt geweigerd, wordt de WAO-uitkering voor het
      vaststellen van zijn aanspraak op een bovenwettelijke arbeidsongeschiktheidsuitkering, steeds geacht onverminderd
      te zijn genoten.


