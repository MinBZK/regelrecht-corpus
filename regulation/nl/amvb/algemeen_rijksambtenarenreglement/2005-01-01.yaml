  - number: '58'
    text: |-
      1 De ambtenaar kan worden verplicht tijdelijk andere ambtelijke werkzaamheden te verrichten dan die, welke hij
      gewoonlijk verricht, mits die werkzaamheden hem redelijkerwijs kunnen worden opgedragen. Hij kan echter niet
      worden verplicht werkzaamheden te verrichten in de plaats van stakers of uitgeslotenen in particuliere dienst,
      tenzij de opgedragen werkzaamheden worden verricht in dienst van het lichaam, waarbij hij werkzaam is, en voor de
      openbare dienst tijdens de staking of uitsluiting, dan wel als onmiddellijk gevolg daarvan redelijkerwijze dadelijk
      noodzakelijk zijn te achten.

      2 Voorts kan aan de ambtenaar door Onze Minister de verplichting worden opgelegd in tijden van oorlog,
      oorlogsgevaar of andere buitengewone omstandigheden andere werkzaamheden te verrichten dan die, welke hij
      gewoonlijk verricht, mits die werkzaamheden strekken ter uitvoering van de taak, welke het ministerie waarbij hij
      werkzaam is of waaronder de dienst of instelling, waarbij hij werkzaam is, ressorteert, in die tijden heeft of zal
      krijgen, dan wel ertoe strekken een zo goed en ongestoord mogelijke uitvoering van die taak te verzekeren.

      3 De ambtenaar aan wie de in het vorige lid bedoelde verplichting is opgelegd, is tevens te allen tijde verplicht
      lessen te volgen en deel te nemen aan oefeningen, die verband houden met de in dat lid bedoelde werkzaamheden.

      4 Bij de toepassing van het bepaalde in de vorige leden wordt voor zoveel mogelijk rekening gehouden met de
      persoonlijke omstandigheden van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel58
  - number: 58a
    text: |-
      1 De ambtenaar die door het bevoegd gezag is aangewezen als bedrijfshulpverlener als bedoeld in
      [artikel 15 van de Arbeidsomstandighedenwet 1998][ref1] en die naast zijn normale werkzaamheden de
      bedrijfshulpverleningstaken naar behoren heeft uitgevoerd, ontvangt een toelage.

      2 De toelage wordt bepaald volgens door Onze Minister vast te stellen regels en bedraagt tenminste € 158,82 per
      jaar.

      3 De vast te stellen regels bevatten in ieder geval de criteria die gehanteerd worden bij de toekenning van een
      bedrijfshulpverleningstoelage.

      4 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan het in het tweede lid genoemde bedrag aanpassen
      overeenkomstig de algemene salarisontwikkeling van het rijkspersoneel.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel15
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '15'
  - number: '59'
    text: |-
      1 De ambtenaar kan in het belang van de Rijksdienst worden verplicht om scholing te volgen, voor zover dat
      redelijkerwijs van hem kan worden gevergd.

      2 Aan de ambtenaar, die op grond van het eerste lid is verplicht om scholing te volgen, wordt een volledige
      vergoeding van de noodzakelijk te maken scholingskosten toegekend. Onze Minister kan in bijzondere gevallen
      afwijken van de vorige volzin.

      3 Aan de ambtenaar, die op grond van het eerste lid is verplicht om scholing te volgen, kan scholingsverlof met
      behoud van bezoldiging worden verleend.

      4 Indien de ambtenaar aan wie scholingsverlof als bedoeld in het derde lid is verleend gedurende dat verlof of
      gedurende een bepaalde periode van dat verlof tevens recht heeft op een financiële tegemoetkoming op basis van
      [hoofdstuk 7 van de Wet arbeid en zorg][ref1], wordt gedurende de periode waarin sprake is van samenloop een
      inhouding op de bezoldiging toegepast welke overeenkomt met het bedrag van bedoelde financiële tegemoetkoming.
      Indien de financiële tegemoetkoming hoger is dan hetgeen over de verlofuren wordt doorbetaald aan bezoldiging wordt
      de inhouding vastgesteld op het laatstbedoelde bedrag.

      5 Indien aan de in [hoofdstuk 7 van de Wet arbeid en zorg][ref2] gestelde voorwaarden voor het toekennen van een
      financiële tegemoetkoming is voldaan maar geen financiële tegemoetkoming is toegekend omdat de ambtenaar geen
      aanvraag heeft ingediend, past het bevoegd gezag het vierde lid op overeenkomstige wijze toe. In dat geval wordt
      rekening gehouden met de financiële tegemoetkoming die aan de ambtenaar zou zijn toegekend indien hij wel een
      aanvraag zou hebben ingediend.

      6 De ambtenaar, die op grond van het eerste lid is verplicht om scholing te volgen, kan worden verplicht tot
      terugbetaling van de aan hem toegekende vergoeding van de scholingskosten:

      a. bij onvoldoende resultaat in de scholing en bij tussentijds afbreken van de scholing, indien dit aan eigen
      schuld of toedoen van de ambtenaar is te wijten;

      b. bij ontslag tijdens het volgen van de scholing en in bijzondere gevallen bij ontslag binnen een termijn van
      maximaal drie jaren na het met voldoende resultaat afronden van de scholing, tenzij de ambtenaar binnen een maand
      na zijn ontslag elders in dienst treedt binnen de Rijksdienst of aansluitend aan zijn ontslag recht heeft op een
      uitkering op grond van werkloosheid, arbeidsongeschiktheid of ouderdomspensioen.

      7 De verplichting tot terugbetaling wordt niet opgelegd aan de ambtenaar die binnen 18 maanden nadat hij is
      aangewezen als herplaatsingskandidaat als bedoeld in de [artikelen 49d][ref3] en [49e][ref4], op zijn aanvraag
      eervol ontslag wordt verleend wegens de aanvaarding van een functie buiten de Rijksdienst.

      8 Bij ministeriële regeling kunnen ten aanzien van dit artikel nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk7
      [ref3]: https://wetten.overheid.nl/BWBR0001950#Artikel49d
      [ref4]: https://wetten.overheid.nl/BWBR0001950#Artikel49e
