  - number: '50'
    text: |-
      1 De ambtenaar is gehouden de plichten uit zijn functie voortvloeiende nauwgezet en ijverig te vervullen en zich te
      gedragen, zoals een goed ambtenaar betaamt.

      2 Het is de ambtenaar verboden in dienst uniformkledingstukken te dragen, tenzij deze van regeringswege zijn
      verstrekt of voorgeschreven.

      3 Het is de ambtenaar verboden bij gekleed gaan in uniform insignes of andere onderscheidingstekens te dragen,
      tenzij deze van regeringswege zijn verstrekt of voorgeschreven of tot het dragen daarvan door Onze Minister-
      President vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel50
  - number: '51'
    text: |-
      1 De ambtenaar is verplicht een eed of een belofte af te leggen.

      2 Bij ministeriële regeling worden regels gesteld inzake het afleggen door de ambtenaar van de eed of de belofte.

      3 Bij regeling van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties wordt het formulier vastgesteld dat
      wordt gebruikt voor het afleggen door de ambtenaar van de eed of de belofte.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel51
  - number: '52'
    text: |-
      Ter zake van niet-naleving van bepalingen, welke redelijkerwijs niet kunnen worden geacht den ambtenaar bekend te
      zijn, worden hem geen voordeelen onthouden of nadeelen toegebracht.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel52
  - number: '54'
    text: |-
      Indien de ambtenaar verhinderd is zijn dienst te verrichten, is hij verplicht daarvan, onder opgave van redenen,
      zoo tijdig mogelijk mededeeling te doen, ten einde vertraging of hinder in den dienst zooveel doenlijk te
      voorkomen.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel54
  - number: '55'
    text: |-
      1 De ambtenaar kan worden verplicht te gaan wonen of te blijven wonen in of nabij de gemeente die hem als
      standplaats is aangewezen of waartoe zijn standplaats behoort, indien dit naar het oordeel van het bevoegd gezag
      noodzakelijk is in verband met de goede vervulling van zijn functie.

      2 De ambtenaar aan wie de verplichting is opgelegd in of nabij de in het eerste lid bedoelde gemeente te gaan
      wonen, is gehouden zo spoedig mogelijk, maar uiterlijk twee jaar nadat die verplichting is opgelegd, daaraan gevolg
      te geven.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel55
  - number: '56'
    text: |-
      1 De ambtenaar is verplicht, indien hem eene ambts- of dienstwoning ter bewoning is aangewezen, deze te betrekken
      en zich ter zake van de bewoning en het gebruik te gedragen naar de voorschriften, die daaromtrent zijn gesteld.

      2 Hij draagt de onderhoudskosten, welke volgens de wet en het plaatselijk gebruik gemeenlijk voor rekening van den
      huurder zijn, tenzij door het bevoegd gezag ter zake eene afwijkende regeling is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel56
  - number: '57'
    text: |-
      1 De ambtenaar kan op zijn aanvraag een andere functie worden opgedragen.

      2 Wanneer het belang van de dienst zulks vordert, is de ambtenaar verplicht, een andere passende functie te
      aanvaarden:

      a. overeenkomstig het bepaalde in artikel 49*h* indien het gaat om een verplaatsing in het kader van een
      reorganisatie, en;

      b. overeenkomstig het bepaalde in artikel 49*h*, eerste lid in de overige gevallen.

      3 Het opdragen van een andere functie aan de ambtenaar, bedoeld in artikel 4, vijfde lid, onder a, vindt plaats
      door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties in overeenstemming met Onze Minister.

      4 Het opdragen van een andere functie aan de ambtenaar, bedoeld in artikel 4, vijfde lid, onder b of c, vindt
      plaats door Onze Minister in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel57
  - number: 57a
    text: |-
      1 De ambtenaar, die ongeschikt is tot het verrichten van zijn arbeid wegens ziekte kan een andere betrekking worden
      opgedragen.

      2 Gedurende het tijdvak als bedoeld in
      [artikel 19, eerste lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1], waarin de ambtenaar die
      ongeschikt is tot het verrichten van zijn arbeid wegens ziekte is hij verplicht een hem aangeboden betrekking te
      aanvaarden indien sprake is van passende arbeid als bedoeld in [artikel 35, onderdeel l][ref2].

      3 Indien de ambtenaar na ommekomst van het tijdvak, bedoeld in het tweede lid, nog ongeschikt is tot het verrichten
      van zijn arbeid wegens ziekte is hij verplicht een hem aangeboden betrekking te aanvaarden indien sprake is van
      gangbare arbeid als bedoeld in [artikel 35, onderdeel e][ref3]. Deze verplichting geldt eveneens na afloop van het
      tweede jaar.

      4 Dit artikel is op overeenkomstige wijze van toepassing indien aan de ambtenaar de eigen betrekking wordt
      opgedragen onder andere voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0001950#Artikel35
