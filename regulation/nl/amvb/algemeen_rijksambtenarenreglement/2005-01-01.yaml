  - number: 36c
    text: |-
      1 De leden van de commissie bedoeld in [artikel 36b, vierde en vijfde lid][ref1], worden per verzoek om een
      hernieuwd onderzoek aangewezen door Onze Minister. De geneeskundige die het medisch advies heeft uitgebracht
      waarvan herziening wordt gevraagd, heeft in de commissie geen zitting.

      2 De commissie deelt haar oordeel schriftelijk mee aan:

      a) de ambtenaar;

      b) Onze Minister;

      c) de behandelend arts, bedoeld in [artikel 36b, vijfde lid][ref2].


