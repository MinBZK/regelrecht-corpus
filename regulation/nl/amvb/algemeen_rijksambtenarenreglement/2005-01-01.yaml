  - number: '45'
    text: |-
      1 Bij samenloop van een aanspraak krachtens dit hoofdstuk met een ZW-uitkering, een WW-uitkering of een
      bovenwettelijke WW-uitkering, wordt deze aanspraak verminderd met het bedrag van deze uitkeringen, tenzij het een
      tegemoetkoming op grond van artikel 47 of 48 betreft.

      2 Indien als gevolg van handelingen of het nalaten van handelingen door de ambtenaar of de gewezen ambtenaar de
      ZW-uitkering, de WW-uitkering of de bovenwettelijke WW-uitkering een vermindering ondergaat, dan wel de aanspraak
      daarop geheel of gedeeltelijk wordt geweigerd, wordt de ZW-uitkering, de WW-uitkering of de bovenwettelijke WW-
      uitkering voor het vaststellen van de vermindering, bedoeld in het eerste lid, steeds geacht onverminderd te zijn
      genoten.

      3 Indien ten aanzien van de ZW-uitkering, die de ambtenaar of de gewezen ambtenaar geniet, een verplichting wordt
      opgelegd of een sanctie wordt toegepast, wordt door Onze Minister zoveel mogelijk dezelfde verplichting opgelegd
      dan wel een overeenkomende sanctie toegepast op de aanspraken op grond van dit hoofdstuk waarop de ZW-uitkering in
      mindering is gebracht.

      4 Indien de ambtenaar of de gewezen ambtenaar tevens een ZW-uitkering of een WAO-uitkering ontvangt uit een
      dienstbetrekking buiten het gezagsbereik van Onze Minister, wordt voor de vermeerdering of vermindering van de
      aanspraken op grond van dit hoofdstuk slechts rekening gehouden met de ZW-uitkering of de WAO-uitkering, die
      voortvloeit uit de dienstbetrekking bij Onze Minister.

      5 De inkomsten die de ambtenaar of de gewezen ambtenaar geniet in verband met het verrichten van in het belang
      van zijn genezing door de Arbo-dienst wenselijk geachte arbeid, worden op de aanspraak op de doorbetaling van de
      bezoldiging of de bovenwettelijke arbeidsongeschiktheidsuitkering in mindering gebracht, voorzover deze te samen
      met de aanspraak op de doorbetaling van de bezoldiging of de WAO-uitkering, vermeerderd met de bovenwettelijke
      arbeidsongeschiktheidsuitkering, de bezoldiging te boven gaan.

      6 Inkomsten uit of in verband met arbeid of bedrijf worden op het bedrag, waarop de gewezen ambtenaar ingevolge dit
      hoofdstuk recht heeft, in mindering gebracht, tenzij:

      a) de gewezen ambtenaar deze inkomsten reeds vóór het intreden van de ongeschiktheid tot het verrichten van zijn
      arbeid wegens ziekte genoot; en

      b) de omvang van die arbeid niet is toegenomen.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel45
  - number: '46'
    text: |-
      1 Voor zolang de gewezen ambtenaar na beëindiging van de haar ingevolge
      [artikel 33fc, het eerste, tweede of het vierde lid][ref1], toekomende uitkering:

      a) wegens ziekte ongeschikt is tot werken, dan wel

      b) binnen een maand na deze beëindiging ongeschikt wordt tot werken, heeft zij gedurende een tijdvak van 52 weken
      recht op de doorbetaling van de bezoldiging overeenkomstig [artikel 38][ref2]. De termijn van 52 weken wordt
      geacht aan te vangen na beëindiging van voornoemde periode respectievelijk met ingang van de eerste dag waarop zij
      ongeschikt is een naar aard en omvang soortgelijke functie te vervullen.

      2 Ongeschikt tot werken, geheel of gedeeltelijk, in de zin van het eerste lid is de vrouwelijke gewezen ambtenaar
      die als rechtstreeks en objectief medisch vast te stellen gevolg van ziekte of gebreken geheel of gedeeltelijk niet
      in staat is om een naar aard en omvang soortgelijke betrekking als zij vervulde, te vervullen.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel33fc
