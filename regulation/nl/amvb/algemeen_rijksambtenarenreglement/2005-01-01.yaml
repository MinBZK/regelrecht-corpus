  - number: 49a
    text: |-
      1 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan regels vaststellen omtrent de te volgen procedure
      bij reorganisaties en het herplaatsen van ambtenaren.

      2 Onze Minister kan nadere procedures en regels vaststellen omtrent reorganisaties en het herplaatsen van
      ambtenaren.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel49a
  - number: 49b
    text: |-
      1 Bij een reorganisatie zijn de bepalingen van dit hoofdstuk van toepassing.

      2 Onder reorganisatie als bedoeld in het eerste lid wordt verstaan:

      a. iedere wijziging van de organisatiestructuur, de omvang of de taakinhoud van een ministerie of een onderdeel
      daarvan, waaraan personele consequenties zijn verbonden.

      b. iedere wijziging van de organisatiestructuur, de omvang of de taakinhoud van de Algemene Rekenkamer, de Hoge
      Raad van Adel, het Kabinet der Koningin, de Kanselarij der Nederlandse Orden, de Nationale Ombudsman, de Raad van
      State of een onderdeel daarvan, waaraan personele consequenties zijn verbonden.

      3 De bepalingen van dit hoofdstuk zijn van overeenkomstige toepassing op de overgang van de ambtenaar naar een
      private onderneming of zelfstandig bestuursorgaan in verband met de privatisering of verzelfstandiging van het
      dienstonderdeel van het ministerie waarbij de ambtenaar werkzaam is, tenzij bij algemeen verbindend voorschrift
      anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel49b
  - number: 49c
    text: |-
      Indien de bepalingen in dit hoofdstuk worden toegepast op de Algemene Rekenkamer, de Hoge Raad van Adel, het
      Kabinet der Koningin, de Kanselarij der Nederlandse Orden, de Nationale Ombudsman en de Raad van State, dient voor
      Onze Minister telkens te worden gelezen het College van de Algemene Rekenkamer, de Voorziter van de Hoge Raad van
      Adel, de directeur van het Kabinet der Koningin, de Kanselier der Nederlandse Orden, de Nationale Ombudsman of de
      Vice-President van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel49c
  - number: 49ca
    text: |-
      1 Door of namens Onze Minister worden de centrales van verenigingen van ambtenaren tijdig geïnformeerd over een
      voorgenomen besluit tot een reorganisatie.

      2 Door of namens Onze Minister worden de betrokken ondernemingsraden tijdig geïnformeerd over een voorgenomen
      besluit tot een reorganisatie.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel49ca
  - number: 49d
    text: |-
      De ambtenaar die is aangesteld in tijdelijke dienst voor een proeftijd en de ambtenaar aangesteld in vaste dienst,
      wier functie in verband met een reorganisatie is opgeheven, worden aangewezen als te herplaatsen ambtenaar, hierna
      te noemen: herplaatsingskandidaat.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel49d
  - number: 49e
    text: |-
      1 Van overtolligheid is sprake indien binnen het te reorganiseren ministerie, het Kabinet der Koningin, de Algemene
      Rekenkamer, de Hoge Raad van Adel, de Kanselarij der Nederlandse Orden, de Nationale ombudsman, de Raad van State,
      of een onderdeel daarvan, meer ambtenaren een vergelijkbare of uitwisselbare functie vervullen en het totale aantal
      van die functies zodanig wordt verminderd dat onvoldoende van die functies voor de betrokken ambtenaren resteren.

      2 De ambtenaar die is aangesteld in tijdelijke dienst voor een proeftijd en de ambtenaar aangesteld in vaste
      dienst, die in verband met een reorganisatie overtollig zijn, worden aangewezen als herplaatsingskandidaat,
      waarbij de ambtenaar die het geringste aantal jaren in overheidsdienst heeft doorgebracht het eerst als
      herplaatsingskandidaat wordt aangewezen.

      3 Voor de berekening van het aantal in overheidsdienst doorgebrachte jaren wordt mede in aanmerking genomen
      tijd gewijd aan de verzorging van tot het huishouden van de ambtenaar behorende 0–4 jarige eigen, stief- of
      pleegkinderen, tot een maximum van in totaal zes jaren.

      4 Onze Minister kan van de volgorde in het tweede lid afwijken indien zulks naar zijn oordeel noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel49e
  - number: 49f
    text: De ambtenaar wordt omtrent zijn aanwijzing als herplaatsingskandidaat zo spoedig mogelijk geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel49f
  - number: 49g
    text: |-
      1 Onverminderd het gestelde in artikel 96, eerste lid is Onze Minister verplicht om de ambtenaar binnen een periode
      van 18 maanden, te rekenen vanaf het moment dat de ambtenaar is aangewezen als herplaatsingskandidaat, ten minste
      één passende functie aan te bieden.

      2 Onze Minister kan de termijn als bedoeld in het eerste lid verkorten indien:

      a. de herplaatsingskandidaat heeft geweigerd te voldoen aan een hem op grond van dit hoofdstuk opgelegde
      verplichting, of;

      b. reeds eerder in overleg met de ambtenaar binnen de termijn kan worden vastgesteld dat er geen mogelijkheden zijn
      om de herplaatsingskandidaat te herplaatsen.

      3 Onze Minister kan de termijn verlengen of opschorten, indien de omstandigheden naar zijn oordeel daartoe
      aanleiding geven.

      4 De ambtenaar wordt gelijktijdig met zijn aanwijzing als herplaatsingskandidaat geïnformeerd over de aanvang en
      het einde van de termijn als bedoeld in het eerste lid.

      5 Door Onze Minister wordt de herplaatsingskandidaat geïnformeerd over het verkorten, verlengen of opschorten van
      de termijn als bedoeld in het tweede en het derde lid.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel49g
  - number: 49h
    text: |-
      1 Van een passende functie als bedoeld in [artikel 49g][ref1] is sprake indien de herplaatsingskandidaat naar
      het oordeel van Onze Minister beschikt over de kennis en kunde die noodzakelijk worden geacht om de functie naar
      behoren te kunnen uitoefenen danwel indien de herplaatsingskandidaat naar het oordeel van Onze Minister binnen
      redelijke termijn om-, her- of bijgeschoold kan worden, en deze functie hem in verband met zijn persoonlijkheid,
      zijn omstandigheden en de voor hem bestaande vooruitzichten, redelijkerwijs kan worden opgedragen.

      2 Bij het eerste lid geldt de beperking dat uitsluitend sprake kan zijn van een passende functie indien de voor
      de functie geldende salarisschaal niet meer dan twee schalen lager is dan de salarisschaal die geldt voor de
      herplaatsingskandidaat.

      3 Onze Minister kan de herplaatsingskandidaat plaatsen op een functie waarvan de geldende salarisschaal meer
      dan twee schalen lager is dan de salarisschaal die geldt voor de herplaatsingskandidaat indien er bijzondere
      omstandigheden zijn die zulks rechtvaardigen en indien de herplaatsingskandidaat daarmee instemt.

      4 Bij een herplaatsing met toepassing van het derde lid zijn de [artikelen 49k][ref2] en 49n van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49g
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel49k
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel49h
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49g
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 49k
        hoofdstuk: VII
  - number: 49i
    text: |-
      Onze Minister kan de naar zijn oordeel meest geschikte herplaatsingskandidaat, voor wie de functie als passend
      wordt aangemerkt, herplaatsen in die functie.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel49i
  - number: 49j
    text: |-
      1 Onverminderd het bepaalde in artikel 49*g*, eerste lid, is de herplaatsingskandiaat verplicht al het mogelijke te
      doen om een passende functie te vinden.

      2 De herplaatsingskandidaat is verplicht een passende functie te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel49j
  - number: 49k
    text: |-
      De herplaatsingskandidaat die slechts in een voor hem passende functie kan worden herplaatst na om-, her- of
      bijscholing kan hiertoe worden verplicht, voor zover dat redelijkerwijs van hem kan worden gevergd. Artikel 59,
      tweede lid, eerste volzin, derde, zesde en zevende lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel49k
  - number: 49l
    text: |-
      1 De herplaatsingskandidaat die heeft geweigerd te voldoen aan een hem op grond van dit hoofdstuk opgelegde
      verplichting, kan in verband daarmee ontslag worden verleend.

      2 Bij een ontslagverlening op grond van het eerste lid wordt een opzeggingstermijn van drie maanden in acht
      genomen.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel49l
  - number: 49n
    text: |-
      1 De ambtenaar die in verband met zijn herplaatsing of plaatsing in een passende functie in opdracht van Onze
      Minister is verhuisd, wordt eenmalig een bedrag toegekend van € 10 890,73 bruto ter tegemoetkoming in de daarmee
      verband houdende kosten.

      2 In de gevallen waarin de ambtenaar en zijn echtgenoot beiden in aanmerking komen voor het bedrag bedoeld in het
      eerste lid ontvangt elk de helft daarvan.

      3 Het bedrag bedoeld in het eerste lid wordt niet toegekend, indien de verhuizing niet heeft plaatsgevonden binnen
      twee jaren nadat de opdracht om te verhuizen is gegeven.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel49n
  - number: 49o
    text: |-
      Onze Minister kan de herplaatsingskandidaat een premie in het vooruitzicht stellen ter grootte van maximaal
      drie maandsalarissen indien aan hem binnen 18 maanden nadat hij is aangewezen als herplaatsingskandidaat op zijn
      aanvraag eervol ontslag wordt verleend.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel49o
  - number: 49p
    text: |-
      1 De herplaatsingskandidaat aan wie eervol ontslag op zijn aanvraag is verleend wegens de aanvaarding van een
      functie kan, onverminderd het bepaalde in artikel 49*o*, een salarissuppletie worden toegekend indien het in de
      nieuwe functie genoten salaris lager is dan het salaris in de oorspronkelijke functie.

      2 De suppletie als bedoeld in het eerste lid wordt toegekend gedurende maximaal 5 jaar en is ten hoogste gelijk aan
      het verschil tussen het in de oorspronkelijke functie genoten salaris en het salaris in de nieuwe functie.

      3 Onder door Onze Minister te stellen voorwaarden kan het recht op suppletie op aanvraag van de
      herplaatsingskandidaat worden afgekocht.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel49p
  - number: 49q
    text: |-
      Onze Minister kan de [artikelen 49j, tweede lid][ref1], [49k][ref2], [49n][ref3] en [49p][ref4] toepassen op de
      ambtenaar wiens functie binnen afzienbare tijd wordt opgeheven of die als overtollig zal worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49j
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel49k
      [ref3]: https://wetten.overheid.nl/BWBR0001950#Artikel49n
      [ref4]: https://wetten.overheid.nl/BWBR0001950#Artikel49p
