  - number: 34e
    text: |-
      1 De ambtenaar, die na afloop van hem verleend buitengewoon verlof van lange duur en zonder dat dit is verlengd,
      zijn dienst niet tijdig hervat, wordt voor de toepassing van dit reglement geacht een aanvraag tot ontslag te
      hebben ingediend.

      2 Het eerste lid is niet van toepassing, indien de ambtenaar binnen een redelijke termijn ten genoegen van Onze
      Minister aannemelijk maakt, dat hij geldige redenen had zijn dienst niet te hervatten, in welk geval het verlof
      geacht wordt te zijn verlengd tot het tijdstip, waarop bedoelde geldige redenen hebben opgehouden te bestaan.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel34e
  - number: 34f
    text: |-
      Voor de toepassing van deze paragraaf is - ingeval de ambtenaar in het genot is van een toelage als bedoeld in
      [artikel 17][ref1], dan wel [artikel 18][ref2] - met betrekking tot de vaststelling van dit bezoldigingsdeel, het
      derde, respectievelijk vierde lid van artikel 17 van overeenkomstige toepassing.


