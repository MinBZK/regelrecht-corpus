  - number: '61'
    text: |-
      1 De ambtenaar is verplicht aan Onze Minister, op een door Onze Minister te bepalen wijze, opgave te doen van de
      nevenwerkzaamheden die hij verricht of voornemens is te gaan verrichten, die de belangen van de dienst voor zover
      deze in verband staan met zijn functievervulling, kunnen raken.

      2 Onze Minister voert een registratie op basis van de op grond van het eerste lid gedane opgaven.

      3 Het is de ambtenaar verboden nevenwerkzaamheden te verrichten waardoor de goede vervulling van zijn functie of
      de goede functionering van de openbare dienst, voor zover deze in verband staat met zijn functievervulling, niet in
      redelijkheid zou zijn verzekerd. Bij ministeriële regeling kunnen nadere regels omtrent dit verbod worden gesteld.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel61
  - number: '62'
    text: |-
      1 Het is den ambtenaar verboden, middellijk of onmiddellijk deel te nemen aan aannemingen en leveringen ten behoeve
      van openbare diensten, tenzij daarvoor toestemming is verleend.

      2 Hij is verplicht zich te gedragen naar hetgeen voor hem is bepaald ten aanzien van het deelnemen, middellijk of
      onmiddellijk, aan aannemingen en leveringen ten behoeve van anderen.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel62
  - number: 63a
    text: |-
      1 De ambtenaar, die een besturende, beherende dan wel toezichthoudende functie vervult in een naamloze
      vennootschap of ander rechtspersoonlijkheid bezittend lichaam, en voor de in die functie verrichte of te verrichten
      werkzaamheden, anders dan uit ’s Rijks kas, een vergoeding ontvangt, is verplicht die vergoeding in genoemde kas te
      storten, indien de benoeming in die functie

      a. heeft plaats gehad door dan wel in overeenstemming met Onze Minister;

      b. is voortgevloeid uit een wettelijk voorschrift dan wel uit een overeenkomst, welke met instemming van Onze
      Minister of de Raad van Ministers is tot stand gekomen.

      2 Het eerste lid is van overeenkomstige toepassing ten aanzien van de ambtenaar die werkzaamheden vervult
      die verband houden met het door hem beklede ambt en hem zijn opgedragen door Onze Minister, en die voor die
      werkzaamheden, anders dan uit ’s Rijks kas, een vergoeding ontvangt.

      3 De vorige leden vinden geen toepassing in de gevallen, waarin dit door Onze Minister-President is bepaald.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel63a
  - number: '64'
    text: |-
      1 Het is den ambtenaar in zijn ambt verboden, anders dan met goedvinden van het bevoegd gezag, vergoedingen,
      belooningen, giften of beloften van derden te vorderen, te verzoeken of aan te nemen.

      2 Het aannemen van steekpenningen is onvoorwaardelijk en ten strengste verboden.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel64
  - number: '65'
    text: |-
      De ambtenaar is verplicht de dienstkleding en de onderscheidingstekenen te dragen, voor zover dit door Onze
      Minister voorgeschreven is.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel65
  - number: '66'
    text: |-
      1 De ambtenaar kan worden verplicht tot geheele of gedeeltelijke vergoeding van de door den dienst geleden schade,
      voor zoover deze aan hem is te wijten.

      2 Het bedrag van de schadevergoeding wordt niet vastgesteld, dan nadat de ambtenaar in de gelegenheid is gesteld
      zich schriftelijk of mondeling te verantwoorden.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel66
  - number: '67'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan regels stellen ten aanzien van telewerken. Deze
      regels hebben in ieder geval betrekking op:

      a. de inrichting van de telewerkplek;

      b. de beschikbaarstelling door het bevoegd gezag van apparatuur;

      c. de wijze waarop de werkcontacten tussen de ambtenaar en zijn dienstonderdeel zullen plaatsvinden;

      d. de wijze waarop wordt voorzien in een vergoeding van de door de ambtenaar gemaakte kosten;

      e. de wijze waarop het overleg met de vertegenwoordigers van het personeel wordt gevoerd.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel67
  - number: '68'
    text: |-
      1 De ambtenaar heeft recht op vergoeding wegens reis- en verblijfkosten ter zake van dienstreizen.

      2 Deze vergoeding wordt vastgesteld overeenkomstig de daarvoor gestelde regels.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel68
  - number: '69'
    text: |-
      1 Onze Minister kan naar billijkheid de ambtenaar schadeloos stellen, kosten vergoeden of overigens een geldelijke
      tegemoetkoming verlenen.

      2 Onze Minister is bevoegd omtrent schadeloosstelling, kostenvergoedingen en overige geldelijke tegemoetkomingen
      aan groepen van ambtenaren in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      regels te geven.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel69
  - number: '70'
    text: |-
      1 De ambtenaar, die in contact staat of kort geleden gestaan heeft met een persoon, die een ziekte heeft, waarvoor
      ingevolge het krachtens de [Infectieziektenwet][ref1] bepaalde een nominatieve aangifteplicht geldt, mag zijn
      dienst niet verrichten en heeft geen toegang tot dienstgebouwen, -lokalen en -terreinen dan met toestemming van het
      bevoegd gezag, dat deze toestemming slechts kan verlenen na positief medisch advies van de Arbo-dienst, bedoeld in
      hoofdstuk VI.

      2 De ambtenaar, die verkeert in de in het vorige lid omschreven situatie, is verplicht daarvan ten spoedigste
      kennis te geven aan de Arbo-dienst, bedoeld in hoofdstuk VI. Hij is gehouden zich te gedragen naar de vanwege de
      Arbo-dienst, bedoeld in hoofdstuk VI gegeven aanwijzingen, waaronder die met betrekking tot het ondergaan van een
      arbeidsgezondheidskundig onderzoek.

      3 Gedurende de periode dat de ambtenaar ingevolge het bepaalde in dit artikel zijn dienst niet verricht, geniet hij
      zijn volle bezoldiging.


      [ref1]: https://wetten.overheid.nl/BWBR0009684
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0009684
  - number: '71'
    text: |-
      1 Met de ambtenaar wordt minimaal een keer per jaar door een functionaris, aangewezen door het bevoegd gezag,
      gesproken over:

      a. de wijze waarop de ambtenaar de opgedragen werkzaamheden heeft uitgevoerd en de resultaten die daarbij zijn
      gehaald;

      b. de omstandigheden waaronder de opgedragen werkzaamheden zijn uitgevoerd;

      c. welke werkzaamheden de ambtenaar zullen worden opgedragen en welke resultaten daarbij behaald moeten worden;

      d. de omstandigheden waaronder die op te dragen werkzaamheden zullen worden uitgevoerd;

      e. de wijze waarop de persoonlijke ontwikkeling van de ambtenaar bevorderd kan worden.

      2 Indien de ambtenaar gedurende vijf aaneengesloten jaren dezelfde functie heeft vervuld, wordt in het gesprek als
      bedoeld in het eerste lid specifieke aandacht besteed aan de continuering van de loopbaan.

      3 Van het met de ambtenaar besprokene wordt een schriftelijk verslag gemaakt.

      4 Over de in het eerste lid, onder c, d en e, genoemde onderwerpen worden met de ambtenaar afspraken gemaakt.

      5 Onze Minister stelt vast aan welke eisen een gesprek als bedoeld in het eerste lid alsmede een verslag daarvan
      moet voldoen.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel71
  - number: 71a
    text: |-
      1 Indien het bevoegd gezag dit wenselijk vindt of de ambtenaar dit aanvraagt, wordt een beoordeling opgemaakt.

      2 Een beoordeling wordt eerst vastgesteld nadat deze met de ambtenaar is besproken en hij zijn zienswijze kenbaar
      heeft kunnen maken.

      3 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt nadere regels omtrent het opmaken en
      vaststellen van beoordelingen.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel71a
  - number: 71b
    text: |-
      1 De werkgever stelt een loopbaanscan beschikbaar ten behoeve van de ambtenaar. Onder loopbaanscan wordt verstaan
      een instrument waarmee de loopbaanmogelijkheden van de ambtenaar in kaart kunnen worden gebracht.

      2 De ambtenaar heeft het recht eenmaal per drie jaar van de loopbaanscan gebruik te maken.

      3 De ambtenaar kan de uitkomsten van de loopbaanscan inbrengen in het jaarlijks gesprek, bedoeld in
      [artikel 71][ref1], ter ondersteuning van het maken van afspraken over de verdere loopbaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel71
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel71b
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '71'
        hoofdstuk: VIIa
  - number: '72'
    text: Verplichting tot zekerheidsstelling wordt den ambtenaar niet opgelegd.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel72
  - number: '73'
    text: |-
      1 De ambtenaar die namens een minister is belast met de in artikel 24, tweede en derde lid, van de
      Comptabiliteitswet 2001 vermelde taken, is verplicht een tekort geheel of gedeeltelijk aan te zuiveren, wanneer hem
      ter zake van dat tekort een ernstig verwijt kan worden gemaakt.

      2 De ambtenaar die namens een minister is belast met het in artikel 25, tweede lid, van de Comptabiliteitswet 2001
      bedoelde beheer, is verplicht schade te vergoeden, wanneer hem ter zake van die schade een ernstig verwijt kan
      worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel73
  - number: '76'
    text: |-
      Aan de vrouwelijke ambtenaar, die een borstkind heeft en hiervan aan het hoofd van dienst heeft kennis gegeven,
      behoort gelegenheid te worden gegeven haar kind te zoogen.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel76
  - number: '77'
    text: |-
      1 Aan den ambtenaar kan door het bevoegd gezag de toegang tot de dienstlokalen, dienstgebouwen of het werk, dan wel
      het verblijf aldaar, worden ontzegd.

      2 Hij is verplicht zich te gedragen naar de maatregelen van orde, die ten aanzien van het verblijf aldaar zijn
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel77
  - number: '78'
    text: |-
      Het is den ambtenaar verboden gedurende den werktijd alcoholhoudende dranken te gebruiken, bij zich te hebben of in
      de dienstlokalen te bewaren.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel78
  - number: '79'
    text: |-
      1 De ambtenaar heeft aanspraak op een gratificatie bij ambtsjubileum volgens door Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties te stellen regels.

      2 De ambtenaar die een diensttijd heeft van 10 jaar of meer en aan wie ontslag is verleend op grond van artikel,
      96 of 98, eerste lid onder *f* wordt een diensttijdgratificatie toegekend ter grootte van een in verhouding tot de
      doorgebrachte diensttijd evenredig gedeelte van een gratificatie bij ambtsjubileum als bedoeld in het eerste lid.
      Toekenning vindt niet plaats indien niet binnen een termijn van vijf jaar na de datum van ingang van het ontslag
      aanspraak op een gratificatie bij ambtsjubileum zou hebben bestaan.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel79
  - number: '80'
    text: |-
      1 De ambtenaar, die de hem opgelegde verplichtingen niet nakomt of zich overigens aan plichtsverzuim schuldig
      maakt, kan deswege disciplinair worden gestrafd.

      2 Plichtsverzuim omvat zowel het overtreden van enig voorschrift als het doen of nalaten van iets, hetwelk een goed
      ambtenaar in gelijke omstandigheden behoort na te laten of te doen.

      3 Tenzij door Ons of met Onze machtiging door Onze Minister anders is bepaald, wordt de straf opgelegd door het
      gezag, dat bevoegd is tot aanstelling in het door de ambtenaar beklede ambt. Indien deze bevoegdheid bij Ons
      berust, geschiedt de bestraffing, behalve voor zover betreft de straffen genoemd in artikel 81, eerste lid, onder
      *i* en *l*, door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel80
  - number: '81'
    text: |-
      1 De disciplinaire straffen, welke kunnen worden opgelegd, zijn:

      a. schriftelijke berisping;

      b. buitengewone dienst op andere dagen dan zondag en de voor de ambtenaar geldende kerkelijke feestdagen, zonder
      beloning of tegen een lagere dan de normale beloning en wel voor ten hoogste 6 uren met een maximum van 3 uren
      per dag;

      c. vermindering van het recht op jaarlijkse vakantie met ten hoogste 1/3 van het aantal uren, waarop in het
      desbetreffende kalenderjaar aanspraak bestaat;

      d. geldboete van ten hoogste € 22;

      e. gehele of gedeeltelijke inhouding van salaris tot een bedrag van ten hoogste het salaris over een halve maand;

      f. vaststelling van het salaris op een bedrag in de voor de ambtenaar geldende salarisschaal dat maximaal
      twee jaarlijkse periodieke salarisverhogingen minder bedraagt dan ingevolge de op hem van toepassing zijnde
      bezoldigingsregeling behoort te gelden, of indien voor het door de ambtenaar beklede ambt geen salarisschaal geldt,
      vermindering van het salaris met ten hoogste 5%, een en ander voor de tijd van niet langer dan twee jaren;

      g. het niet toekennen van periodieke salarisverhogingen gedurende ten hoogste vier jaren;

      h. uitsluiting voor de tijd van ten hoogste vier jaren van indeling in een salarisschaal waarvoor een hoger
      maximumsalaris geldt, indien zodanige indeling anders volgens de daarvoor geldende regeling zou hebben
      plaatsgevonden;

      i. indeling in een salarisschaal waarvoor een lager maximumsalaris geldt dan dat verbonden aan de salarisschaal
      welke ingevolge de van toepassing zijnde bezoldigingsregeling behoort te gelden, een en ander al dan niet voor een
      bepaalde tijd en met of zonder vermindering van bezoldiging;

      j. verplaatsing, al dan niet met verlening van een tegemoetkoming in mogelijke verplaatsingskosten tot ten hoogste
      het bedrag, dat in geval van verplaatsing in het belang van de dienst zou kunnen worden verleend krachtens het
      [Verplaatsingskostenbesluit 1989][ref1];

      k. schorsing voor een bepaalde tijd met gehele of gedeeltelijke inhouding van bezoldiging;

      l. ontslag.

      2 Indien een straf, als bedoeld in het eerste lid onder *g*, *h* of *i* is opgelegd, kan - zo het verdere gedrag
      van de ambtenaar naar het oordeel van het tot oplegging van de straf bevoegd gezag daartoe aanleiding heeft gegeven
        - zijn positie met ingang van een bepaald tijdstip geheel of ten dele in overeenstemming worden gebracht met de
      positie, zoals deze zonder de strafoplegging zou zijn geweest.

      3 Bij het opleggen van een straf kan worden bepaald, dat zij niet ten uitvoer zal worden gelegd, indien de
      ambtenaar zich gedurende een vastgestelde termijn niet schuldig maakt aan soortgelijk plichtsverzuim, als waarvoor
      de bestraffing plaats vindt, noch aan enig ander ernstig plichtsverzuim en zich houdt aan bij het opleggen van de
      straf eventueel gestelde bijzondere voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0004630
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0004630
  - number: '82'
    text: |-
      1 Indien de ambtenaar verantwoording aflegt doet hij dit ten overstaan van het gezag dat tot de voorgenomen
      strafoplegging bevoegd is, of van een door dit gezag aangewezen autoriteit, tenzij bij koninklijk besluit anders
      wordt bepaald. Indien deze bevoegdheid bij Ons berust, geschiedt de verantwoording ten overstaan van Onze Minister
      of van een door deze aangewezen autoriteit. Het gezag, ten overstaan waarvan de verantwoording zal plaats vinden,
      bepaalt of deze mondeling of schriftelijk zal geschieden, met dien verstande dat bij schriftelijke verantwoording
      de ambtenaar op zijn verzoek gelegenheid wordt gegeven tot nadere mondelinge toelichting.

      2 Van de mondelinge verantwoording en van een eventuele nadere mondelinge toelichting wordt aanstonds proces-
      verbaal opgemaakt, dat na voorlezing wordt getekend door hem, te wiens overstaan de verantwoording heeft plaats
      gevonden, en door de ambtenaar. Weigert de ambtenaar de ondertekening, dan wordt daarvan in het proces-verbaal,
      zo mogelijk met vermelding van de redenen, melding gemaakt. Een afschrift van het proces-verbaal wordt aan de
      ambtenaar uitgereikt.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel82
  - number: 82a
    text: |-
      De ambtenaar kan niet gestraft worden wegens overtreding van [artikel 125][ref1], dan nadat daarover advies is
      ingewonnen van de Adviescommissie grondrechten en functie-uitoefening ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125a
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel82a
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: 125a
  - number: '83'
    text: |-
      De ambtenaar dient van de ontvangst van een besluit inzake strafoplegging te doen blijken door onverwijlde
      terugzending van een door hem ondertekend en gedateerd ontvangstbewijs.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel83
  - number: '84'
    text: |-
      De straf, behalve die van schriftelijke berisping, wordt niet ten uitvoer gelegd, zolang zij niet onherroepelijk is
      geworden, tenzij bij de strafoplegging onmiddellijke tenuitvoerlegging is bevolen.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel84
  - number: '90'
    text: |-
      De ambtenaar is van rechtswege in zijn ambt geschorst, wanneer hij krachtens wettelijke maatregel van zijn
      vrijheid is beroofd, tenzij de vrijheidsbeneming het gevolg is van een maatregel, anders dan op grond van de
      [Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref1], genomen in het belang van de volksgezondheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005700
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0005700
  - number: '91'
    text: |-
      1 Onverminderd het bepaalde in artikel 81, eerste lid onder *k*, kan de ambtenaar in zijn ambt worden geschorst:

      a. Indien een strafrechtelijke vervolging ter zake van misdrijf tegen hem is ingesteld;

      b. wanneer hem door het daartoe bevoegde gezag het voornemen tot bestraffing met onvoorwaardelijk ontslag is te
      kennen gegeven, dan wel hem die straf is opgelegd;

      c. wanneer, naar het oordeel van het bevoegde gezag, het belang van de dienst zulks vordert.

      2 Schorsing geschiedt door het gezag, dat bevoegd is tot aanstelling in het ambt, waarin geschorst wordt, met dien
      verstande dat de schorsing van de ambtenaar, die is aangesteld overeenkomstig artikel 7, eerste lid, onder *c*
      geschiedt door Onze Minister. Berust die bevoegdheid bij Ons, dan geschiedt de schorsing door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel91
  - number: '92'
    text: |-
      1 Tijdens de schorsing kan de bezoldiging voor één derde gedeelte worden ingehouden; na verloop van zes weken kan
      een verdere inhouding, ook van het volle bedrag der bezoldiging, plaatsvinden.

      Geen inhouding vindt plaats in geval van schorsing in het belang van de dienst, bedoeld in het eerste lid onder *c*
      van het vorige artikel, van plaatsing in een krankzinnigengesticht of daarmede gelijk te stellen inrichting dan wel
      van politiebewaring of inverzekeringstelling als bedoeld in [artikel 57 van het Wetboek van Strafvordering][ref1],
      mits niet gevolgd door inbewaringstelling.

      2 De ingehouden bezoldiging kan alsnog geheel of gedeeltelijk aan de ambtenaar worden uitbetaald, indien de
      schorsing niet wordt gevolgd door een onvoorwaardelijk ontslag bij wijze van straf of ontslag op grond van artikel
      98, eerste lid onder *e.* Op de aldus uit te keren bezoldiging worden in mindering gebracht de inkomsten, welke
      de ambtenaar sedert de schorsing heeft genoten uit arbeid, die hij als gevolg van de schorsing heeft kunnen
      verrichten, tenzij zulks, naar het oordeel van het bevoegde gezag, onredelijk of onbillijk is.

      3 Het niet ingehouden gedeelte van de bezoldiging van de geschorste ambtenaar kan aan anderen worden uitbetaald.

      4 In geval van schorsing tijdens ziekte van de ambtenaar wordt onder bezoldiging verstaan, hetgeen daaronder voor
      de toepassing van hoofdstuk VI wordt verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel57
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '57'
  - number: '93'
    text: |-
      Ontslag wordt gegeven door het gezag dat bevoegd is tot aanstelling in het desbetreffende ambt. De voordracht
      voor het ontslag van de ambtenaar, bedoeld in artikel 4, vijfde lid, onder a, geschiedt door Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties. De voordracht voor het ontslag van de ambtenaar, bedoeld in artikel 4,
      vijfde lid, onder b of c, geschiedt door Onze Minister in overeenstemming met Onze Minister van Binnenlandse Zaken
      en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel93
  - number: '94'
    text: |-
      1 De ambtenaar wordt op zijn aanvraag ontslag verleend.

      2 Behoudens in het geval, bedoeld in artikel 34*e*, eerste lid, wordt dit ontslag verleend met ingang van een dag
      niet vroeger dan een maand of later dan drie maanden na de dag, waarop de aanvraag om ontslag is ingekomen.

      3 Van het bepaalde in het eerste lid kan worden afgeweken, indien een strafrechtelijke vervolging ter zake van
      misdrijf tegen de ambtenaar is ingesteld of indien wordt overwogen de disciplinaire straf van ontslag op te leggen.

      4 Van het bepaalde in het tweede lid kan worden afgeweken:

      a. indien wordt overwogen de ambtenaar een disciplinaire straf op te leggen;

      b. indien het belang van de dienst zulks vordert, met dien verstande, dat de termijn van drie maanden, vermeld in
      het tweede lid, tot ten hoogste zes maanden kan worden verlengd en dat bij de verlenging in redelijkheid met het
      belang van de ambtenaar rekening wordt gehouden;

      c. ingevolge een aanvraag van de ambtenaar.

      5 Het ontslag op aanvraag van de ambtenaar wordt eervol verleend.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel94
  - number: 94a
    text: |-
      1 Onder de Centrale vut-overeenkomst overheids- en onderwijspersoneel, als bedoeld in dit artikel, wordt verstaan
      de overeenkomst die is aangegaan op grond van [artikel 2 van de Wet kaderregeling vut overheidspersoneel][ref1].
      Onder het Pensioenreglement van de Stichting Pensioenfonds Abp, als bedoeld in dit artikel, wordt verstaan het
      reglement van die stichting dat is vastgesteld met inachtneming van de overeenkomst, bedoeld in artikel 4, eerste
      lid, van de Wet privatisering Abp.

      2 Aan de ambtenaar die ontslag vraagt met het oog op een uitkering op grond van de Regeling flexibel pensioen
      en uittreden, bedoeld in artikel 3 van de Centrale vut-overeenkomst overheids- en onderwijspersoneel en artikel
      1.5 van het Pensioenreglement van de Stichting pensioenfonds Abp wordt ontslag verleend, indien het bestuur
      van de Stichting fonds vrijwillig vervroegd uittreden overheidspersoneel alsmede het bestuur van de Stichting
      Pensioenfonds Abp op grond van een desbetreffende aanvraag hebben vastgesteld dat na dat te verlenen ontslag recht
      bestaat op een uitkering op grond van die regeling. Het ontslag gaat niet eerder in dan met ingang van de dag
      waarop het recht op de in de vorige volzin bedoelde uitkering ontstaat.

      3 Op aanvraag van de ambtenaar kan het in het tweede lid bedoelde ontslag ook voor een gedeelte van de voor hem
      geldende arbeidsduur worden verleend, tenzij de belangen van de dienst zich hiertegen verzetten. Het gedeelte
      van dit ontslag bedraagt ten minste 10% van de omvang van de dienstverhouding. Ontslag voor een gedeelte van de
      arbeidsduur waaruit reeds eerder gedeeltelijk ontslag met het oog op de in het tweede lid bedoelde uitkering heeft
      plaatsgevonden bedraagt ten minste 10% van de oorspronkelijke arbeidsduur.

      4 Artikel 94 , tweede tot en met vijfde lid, is zoveel mogelijk van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007792#Artikel2
