  - number: '12'
    text: |-
      1 Aan de ambtenaar wordt, zo mogelijk vóór de aanvaarding van zijn ambt, een akte van aanstelling uitgereikt,
      waarin in ieder geval worden vermeld:

      a. de naam, de voornamen en de geboortedatum van de ambtenaar;

      b. de naam van het ministerie, de dienst, het bedrijf of de instelling, waarbij hij werkzaam zal zijn, al dan niet
      als lid van de Algemene Bestuursdienst;

      c. de datum, met ingang waarvan hij wordt aangesteld;

      d. of de aanstelling geschiedt in vaste of tijdelijke dienst.

      2 Indien de aanstelling geschiedt in tijdelijke dienst, wordt bovendien in de akte van aanstelling vermeld:

      a. de duur van de aanstelling in tijdelijke dienst;

      b. de toepasselijke, in artikel 6, tweede lid, omschreven grond(en) voor de aanstelling in tijdelijke dienst;

      c. de specifieke reden, indien sprake is van een aanstelling op grond van artikel 6, tweede lid, onder f.

      3 Indien de aanstelling geschiedt in tijdelijke dienst met toepassing van artikel 6*a*, eerste lid, wordt bovendien
      in de akte van aanstelling vermeld welke van de in dat artikellid bedoelde regelingen geheel of gedeeltelijk buiten
      toepassing zijn verklaard.

      4 Indien de aanstelling geschiedt voor een variabel aantal uren wordt in de akte van aanstelling in voorkomende
      gevallen bovendien het op grond van artikel 6b, tweede lid, voor de ambtenaar geldende aantal garantie-uren
      vermeld.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel12
  - number: 12a
    text: |-
      Voor zover deze gegevens op hem betrekking hebben en niet reeds in de akte van aanstelling zijn vermeld, worden aan
      de ambtenaar zo spoedig mogelijk schriftelijk medegedeeld:

      a. het ministerie, de afdeling of het dienstvak waarbij, de betrekking waarin, en de periode gedurende welke hij in
      die betrekking wordt te werk gesteld, zomede de hem dienovereenkomstig aangewezen standplaats;

      b. de salarisschaal en de voor de bepaling van die schaal in acht genomen regels;

      c. het salaris dat hem is toegekend, zomede, het salarisnummer en het tijdstip waarop het salaris voor de eerste
      maal periodiek zal worden verhoogd;

      d. andere hem mogelijk toegekende voordelen, onder verwijzing naar de desbetreffende kortingsregeling.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel12a
  - number: 12c
    text: |-
      1 De ambtenaar wordt bij zijn aanstelling schriftelijk op de hoogte gesteld van de hoofdlijnen van zijn
      rechtspositie.

      2 Regelingen waarin zijn rechtspositie is neergelegd worden op een voor de ambtenaar gemakkelijk toegankelijke
      plaats ter inzage gelegd. Van deze regelingen kan hij kosteloos afschriften maken voor zover dat redelijkerwijs
      nodig is.

      3 De schriftelijk vastgestelde en voor hem geldende regelingen en instructies, welke hij bij de vervulling van
      zijn dienst heeft na te leven, worden eveneens op een voor de ambtenaar gemakkelijk toegankelijke plaats ter inzage
      gelegd. In het geval vermelde regelingen en instructies niet schriftelijk zijn vastgesteld, worden deze behoorlijk
      te zijner kennis gebracht.

      4 Over belangrijke wijzigingen in regelingen betreffende zijn rechtspositie wordt de ambtenaar periodiek op de
      hoogte gesteld.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel12c
  - number: '13'
    text: |-
      1 Wij behouden Ons voor op de voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, die in de
      daarvoor in aanmerking komende gevallen overleg pleegt met Onze betrokken Minister, regels vast te stellen omtrent
      loopbaanvorming in het algemeen en omtrent daarmede verband houdende bijzondere regelingen ter bepaling van de voor
      de ambtenaar geldende salarisschaal.

      2 Voor zover dit niet door Ons is geschied, kunnen deze regels en bijzondere regelingen ook worden vastgesteld
      door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties dan wel, passend in het door deze gecoördineerde
      beleid, door Onze Minister, hoofd van het desbetreffende departement van algemeen bestuur.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel13
  - number: '14'
    text: |-
      De ambtenaar ontvangt over den tijd, gedurende welken hij in strijd met zijne verplichtingen opzettelijk nalaat
      zijn dienst te verrichten, geen bezoldiging.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel14
  - number: '15'
    text: |-
      De beloning van de ambtenaar, die is aangesteld voor enkele diensten, niet vallende binnen de taak van het
      betrokken dienstvak, wordt bepaald op een voor elk geval of voor elke te verrichten dienst, afzonderlijk vast te
      stellen bedrag.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel15
  - number: '16'
    text: |-
      1 Aan de ambtenaar die in verband met de werkzaamheden die voortvloeien uit een functie in een publiekrechtelijk
      college, waarin hij is benoemd of verkozen, tijdelijk is ontheven van de waarneming van zijn ambt wordt
      gedurende zijn ontheffing een non-activiteitswedde toegekend. De non-activiteitswedde is het bedrag waarmee de
      laatstelijkdoor hem in zijn ambt genoten bezoldiging het bedrag van de inkomsten die de ambtenaar in verband met
      zijn werkzaamheden in dat publiekrechtelijk college geniet, overschrijdt.

      2 Voor de toepassing van het eerste lid geldt voorts dat:

      a. toekenning van de non-activiteitswedde plaatsvindt op de voet van het
      bepaalde in de [artikelen 4, tweede, derde, vierde en vijfde lid][ref1], en
      [5 van de Wet Incompatibiliteiten Staten-Generaal en Europees Parlement][ref2];

      b. onder inkomsten die in verband met zijn werkzaamheden in dat publiekrechtelijk college worden genoten wordt
      verstaan: alle inkomsten die aan die werkzaamheden zijn verbonden.

      3 Voor de toepassing van dit artikel wordt de functie van substituut-ombudsman met de in het eerste lid bedoelde
      functie gelijkgesteld.

      4 Dit artikel is niet van toepassing op degenen die een non-activiteitswedde geniet uit hoofde van
      [artikel 4, eerste lid, van de Wet Incompatibiliteiten Staten-Generaal en Europees Parlement][ref3].


