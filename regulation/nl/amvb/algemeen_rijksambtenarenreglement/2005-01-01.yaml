  - number: '3'
    text: |-
      1 De bepalingen van dit besluit vinden slechts toepassing, voor zoover niet bij of krachtens eene wet anders is of
      wordt bepaald.

      2 De bepalingen van dit besluit of sommige daarvan vinden niet toepassing op ambtenaren of groepen van ambtenaren,
      ten aanzien van wie een algemeene maatregel van bestuur of een uit kracht daarvan gegeven voorschrift, om
      bijzondere redenen hare toepasselijkheid uitsluit.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel3
  - number: '4'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. Onze Minister: het hoofd van het betrokken ministerie;

      b. hoofd van dienst: de door Ons of door Onze Minister als zodanig aangewezen autoriteit;

      c. volledige arbeidsduur: een arbeidsduur welke gemiddeld 36 werkuren per week omvat;

      d. arbeidsduurfactor: een breuk, waarvan de teller bestaat uit de voor de ambtenaar vastgestelde arbeidsduur en de
      noemer bestaat uit het getal 36.

      2 Tenzij anders is bepaald wordt voor de toepassing van dit besluit verstaan onder salaris, onderscheidenlijk
      bezoldiging, hetgeen daaronder wordt verstaan in het [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1].

      3 Ingeval de bezoldiging van de ambtenaar is geregeld krachtens een andere bezoldigingsregeling
      dan die bedoeld in het tweede lid, wordt voor de toepassing van dit besluit onder salaris,
      onderscheidenlijk bezoldiging verstaan, het bedrag dat op overeenkomstige wijze is vastgesteld als in het
      [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref2].

      4 In dit besluit wordt onder echtgenoot of echtgenote mede verstaan de levenspartner met wie de niet gehuwde
      ambtenaar samenwoont en – met het oogmerk duurzaam samen te leven – een gemeenschappelijke huishouding voert op
      basis van een notarieel verleden samenlevingscontract bevattende de wederzijdse rechten en verplichtingen ter zake
      van die samenwoning en gemeenschappelijke huishouding alsmede de geregistreerde partner. Onder weduwe of weduwnaar
      wordt mede verstaan de achtergebleven levenspartner of de achtergebleven geregistreerde partner. Tegelijkertijd
      kan slechts een persoon als echtgenoot of echtgenote dan wel weduwe of weduwnaar worden aangemerkt. Onder gezinslid
      wordt in voorkomend geval mede verstaan de geregistreerde partner of de levenspartner.

      Onze Minister kan verlangen dat een schriftelijke verklaring van een notaris wordt overgelegd waaruit blijkt dat
      een samenlevingscontract is gesloten.

      5 In dit besluit wordt onder lid van de Algemene Bestuursdienst verstaan:

      a. de ambtenaar die het ambt van lid van de topmanagementgroep, genoemd in de
      [bijlage A van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref3], vervult;

      b. de ambtenaar die een functie vervult waarvoor salarisschaal 17 of 18 van de
      [bijlage B van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref4] geldt;

      c. de ambtenaar die een functie vervult waarvoor salarisschaal 16 of 15 van de
      [bijlage B van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref5] geldt en die daartoe door of namens
      Onze Minister in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties is aangewezen.


