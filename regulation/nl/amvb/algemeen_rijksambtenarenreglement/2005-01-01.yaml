  - number: 40b
    text: |-
      1 Het bevoegd gezag is verplicht zo tijdig mogelijk zodanige maatregelen te treffen en voorschriften te geven als
      redelijkerwijs nodig is, opdat de ambtenaar, die in verband met ongeschiktheid ten gevolge van ziekte verhinderd
      is zijn arbeid te verrichten, in staat wordt gesteld de eigen of andere passende arbeid te verrichten. Indien
      vaststaat dat de eigen arbeid niet meer kan worden verricht en binnen het gezagsbereik van Onze Minister geen
      andere passende arbeid voorhanden is, bevordert het bevoegd gezag de inschakeling van de ambtenaar in voor hem
      passende arbeid buiten het gezagsbereik van Onze Minister.

      2 Uit hoofde van zijn verplichting, bedoeld in het eerste lid, stelt het bevoegd gezag in overeenstemming met de
      ambtenaar een plan van aanpak op als bedoeld in [artikel 71a, tweede lid, van de WAO][ref1]. Het plan van aanpak
      wordt met medewerking van de ambtenaar regelmatig geëvalueerd en zo nodig bijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
