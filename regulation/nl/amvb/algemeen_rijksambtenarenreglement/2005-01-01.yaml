  - number: 35a
    text: |-
      Indien de bepalingen in dit hoofdstuk worden toegepast op de Algemene Rekenkamer, de Hoge Raad van Adel, het
      Kabinet der Koningin, de Kanselarij der Nederlandse Orden, de Nationale ombudsman en de Raad van State, dient voor
      Onze Minister telkens respectievelijk te worden gelezen het College van de Algemene Rekenkamer, de voorzitter van
      de Hoge Raad van Adel, de directeur van het Kabinet der Koningin, de kanselier der Nederlandse Orden, de Nationale
      ombudsman of de vice-president van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel35a
  - number: '36'
    text: |-
      1 Onze Minister verricht zijn taak met betrekking tot begeleiding van verzuim en de arbeidsgezondheidskundige
      begeleiding op grond van de [Arbeidsomstandighedenwet 1998][ref1] en de bepalingen in dit hoofdstuk.

      2 Onze Minister kan regels vaststellen met betrekking tot de wijze waarop invulling wordt gegeven aan de
      begeleiding van verzuim, de arbeidsgezondheidskundige begeleiding en de daarbij in acht te nemen procedures.

      3 De ambtenaar is in geval van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte verplicht dit zo
      spoedig mogelijk, doch in elk geval niet later dan op de tweede dag van die ongeschiktheid, te melden.

      4 Onze Minister kan ten aanzien van de ambtenaar die korter dan een jaar volledig ongeschikt is geweest zijn arbeid
      te verrichten bepalen dat hij zijn arbeid slechts mag hervatten, nadat Onze Minister hiervoor toestemming heeft
      verleend;

      5 De ambtenaar die wegens ziekte gedurende een jaar of langer volledig ongeschikt is geweest zijn arbeid te
      verrichten mag zijn arbeid slechts hervatten, nadat Onze Minister hiervoor toestemming heeft verleend.

      6 Onze Minister verleent de toestemming, bedoeld in het vierde en vijfde lid, eerst nadat er een medisch advies is
      van de Arbo-dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0010346
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0010346
  - number: 36a
    text: |-
      1 De ambtenaar kan worden verplicht om een arbeidsgezondheidskundig onderzoek te ondergaan:

      a) voor zover dit noodzakelijk is om te beoordelen of de ambtenaar van 55 jaar en ouder in staat is nachtarbeid
      te verrichten;

      b) indien Onze Minister gegronde redenen heeft om te twijfelen aan de goede gezondheidstoestand van de ambtenaar;

      c) indien de ambtenaar niet meer volledig geschikt is gebleken voor het verrichten van zijn arbeid;

      d) ter beantwoording van de vraag of de ambtenaar tijdens het tijdvak waarin hij wegens ziekte ongeschikt is om
      zijn arbeid te verrichten, in het belang van zijn genezing arbeid mag verrichten en om vast te stellen welke arbeid
      wenselijk wordt geacht;

      e) indien de ambtenaar in contact staat of kort geleden heeft gestaan met een persoon die een ziekte heeft waarvoor
      ingevolge de [Infectieziektenwet][ref1], een nominatieve aangifteplicht geldt;

      f) om te beoordelen of de ambtenaar, die een functie vervult als bedoeld in artikel 97, eerste lid, lichamelijk en
      psychisch in staat kan worden geacht zijn functie te blijven waarnemen, nadat hij de voor zijn functie vastgestelde
      leeftijdsgrens heeft bereikt;

      g) om te beoordelen of er sprake is van een situatie als bedoeld in artikel 98, derde lid, aanhef en onderdelen a
      en b;

      h) om te beoordelen of de ambtenaar die wegens ziekte volledig ongeschikt is geweest zijn arbeid te verrichten zijn
      arbeid mag hervatten;

      i) voorzover dit voortvloeit uit enige wettelijke verplichting;

      j) indien hij in verband met de uitoefening van zijn werkzaamheden aan bijzonder gevaar voor zijn gezondheid
      blootstaat of hij is benoemd in een functie waarvoor bij aanstelling een geneeskundig onderzoek is vereist als
      bedoeld in artikel 9, vierde lid, onderdeel b.

      2 Onze Minister stelt de ambtenaar buiten dienst indien na een arbeidsgezondheidskundig onderzoek als bedoeld in
      het eerste lid, blijkt dat sprake is van een zodanige lichamelijke of geestelijke toestand dat de belangen van de
      ambtenaar, van de dienst of van bij het verrichten van de arbeid betrokken derden zich er tegen verzetten dat de
      ambtenaar zijn arbeid blijft verrichten. De ambtenaar wordt niet buiten dienst gesteld indien hem andere passende
      werkzaamheden kunnen worden opgedragen. Indien de ambtenaar buiten dienst wordt gesteld, wordt hij geacht wegens
      ziekte ongeschikt te zijn tot het verrichten van zijn arbeid, in welk geval de overige bepalingen van dit hoofdstuk
      van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009684
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0009684
  - number: 36b
    text: |-
      1 In geval van een geschil over het wel of niet bestaan van ongeschiktheid tot werken wegens ziekte voorziet
      [artikel 30, eerste lid, onderdeel e, van de Wet SUWI][ref1] in het instellen van een onderzoek en het geven van
      een oordeel.

      2 Het medisch advies dat door de Arbo-dienst wordt uitgebracht naar aanleiding van een arbeidsgezondheidskundig
      onderzoek als bedoeld in [artikel 18 van de Arbeidsomstandighedenwet 1998][ref2] en [artikel 36a][ref3], wordt zo
      spoedig mogelijk aan de ambtenaar en Onze Minister medegedeeld.

      3 De ambtenaar of de gewezen ambtenaar kan de Arbo-dienst binnen drie dagen na ontvangst van het medisch advies,
      schriftelijk een hernieuwd onderzoek vragen indien hij het niet eens is met het medisch advies. De Arbo-dienst
      stelt Onze Minister in kennis van een ingediend verzoek om een hernieuwd onderzoek.

      4 Zo spoedig mogelijk na ontvangst van het schriftelijk verzoek om een hernieuwd onderzoek, doch uiterlijk binnen
      vier weken, vindt het hernieuwd onderzoek door een commissie van drie geneeskundigen plaats.

      5 Op verzoek van de ambtenaar of de gewezen ambtenaar wordt zijn behandelend arts in de gelegenheid gesteld
      mondeling of schriftelijk zijn mening aan de commissie van drie geneeskundigen kenbaar te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0001950#Artikel36a
