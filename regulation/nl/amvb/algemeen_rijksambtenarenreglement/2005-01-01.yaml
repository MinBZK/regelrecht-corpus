  - number: 4a
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt regels ten aanzien van de werving en selectie
      van ambtenaren.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel4a
  - number: '5'
    text: |-
      1 De aanstelling geschiedt in vaste of tijdelijke dienst.

      2 De aanstelling geschiedt in vaste dienst, tenzij er grond is een aanstelling in tijdelijke dienst te verlenen.

      3 Degene die geen Nederlander is, kan slechts worden aangesteld indien hem verblijf is toegestaan op grond van
      artikel 9 van de Vreemdelingenwet en de vergunning tot verblijf het verrichten van arbeid in loondienst niet
      uitsluit, of indien hem verblijf is toegestaan op grond van artikel 10 van de Vreemdelingenwet.

      4 Evenmin vindt aanstelling plaats in een functie waaruit ontslag op grond van artikel 97, tweede of derde lid,
      kan worden verleend, van personen die onmiddellijk voorafgaande aan de vroegst mogelijke datum van dat ontslag
      geen ononderbroken diensttijd van ten minste 5 jaar, doorgebracht in een of meer zodanige functies, zouden kunnen
      aanwijzen.

      5 Het in het vorige lid bepaalde is van overeenkomstige toepassing in geval van plaatsing van een ambtenaar in een
      functie als in dat lid bedoeld.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel5
  - number: 5a
    text: De aanstelling in vaste dienst geschiedt in algemene dienst van het rijk.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel5a
  - number: '6'
    text: |-
      1 Een aanstelling in tijdelijke dienst wordt verleend voor:

      a. een kalenderperiode, of

      b. een andere objectief bepaalbare periode.

      2 Een aanstelling in tijdelijke dienst kan plaatsvinden:

      a. voor een proeftijd van ten hoogste twee jaar, zonodig ambtshalve te verlengen met de tijd gedurende welke de
      ambtenaar de proeftijd niet in werkelijke dienst heeft doorgebracht;

      b. voor een tijd van ten hoogste drie maanden, indien de betrokkene de verlangde verklaring omtrent het gedrag,
      bedoeld in artikel 9, zesde lid, nog niet in zijn bezit heeft;

      c. voor het verrichten van werkzaamheden, waarvoor slechts tijdelijk een beroep op de arbeidsmarkt kan worden
      gedaan;

      d. voor een opleiding tot een beroep of verdere theoretische of praktische vorming;

      e. voor oproepkrachten;

      f. voor een andere reden.

      3 In het geval een aanstelling in tijdelijke dienst voor een proeftijd is voorafgegaan door een andere aanstelling
      in tijdelijke dienst krachtens het tweede lid, onder b tot en met f, wordt de maximale duur van de proeftijd
      verminderd met de duur van die andere aanstelling, indien:

      a. beide aanstellingen in tijdelijke dienst zijn verleend door Onze Minister;

      b. de andere aanstelling in tijdelijke dienst is beëindigd binnen een periode van drie maanden direct voorafgaande
      aan de aanstelling in tijdelijke dienst voor een proeftijd; en

      c. het in deze beide aanstellingen in tijdelijke dienst dezelfde werkzaamheden betreft.

      4 Vanaf de dag waarop na het verstrijken van de door Onze Minister vastgestelde proeftijd de aanstelling in
      tijdelijke dienst stilzwijgend wordt voortgezet, geldt dat er een aanstelling in vaste dienst is verleend.

      5 De aanstelling in tijdelijke dienst, bedoeld in het tweede lid, onder b tot en met f, wordt geacht opnieuw
      voor dezelfde tijd, maar telkens ten hoogste voor een jaar op dezelfde voorwaarden te zijn verleend in geval van
      stilzwijgende voortzetting na het verstrijken van de tijd, voor welke zij is verleend.

      6 De aanstelling in tijdelijke dienst geldt als een aanstelling in vaste dienst vanaf de dag waarop:

      a. door Onze Minister verleende aanstellingen in tijdelijke dienst elkaar met tussenpozen van niet meer dan drie
      maanden hebben opgevolgd en een periode van 36 maanden, deze tussenpozen inbegrepen, hebben overschreden;

      b. meer dan drie door Onze Minister verleende aanstellingen in tijdelijke dienst elkaar hebben opgevolgd met
      tussenpozen van niet meer dan drie maanden.

      7 Het zesde lid is van overeenkomstige toepassing, indien de ambtenaar voorafgaande aan een door Onze Minister
      verleende aanstelling in tijdelijke dienst dan wel tussen twee door Onze Minister verleende aanstellingen in
      tijdelijke dienst binnen zijn gezagsbereik op een andere titel dan een aanstelling dezelfde werkzaamheden heeft
      verricht.

      8 Het zesde lid, aanhef en onder a, is niet van toepassing op een aanstelling, aangegaan voor niet meer dan drie
      maanden, die onmiddellijk volgt op een aanstelling van 36 maanden of langer.

      9 Voorzover de aanstelling betrekking heeft op een functie bij de Algemene Rekenkamer, de Hoge Raad van Adel, het
      Kabinet der Koningin, de Kanselarij der Nederlandse Orden, de Nationale ombudsman of de Raad van State dient in
      het derde, het vierde, het zesde en het zevende lid voor Onze Minister telkens te worden gelezen: het College van
      de Algemene Rekenkamer, respectievelijk de voorzitter van de Hoge Raad van Adel, de directeur van het Kabinet der
      Koningin, de kanselier der Nederlandse Orden, de Nationale ombudsman of de vice-president van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel6
  - number: 6a
    text: |-
      1 In zeer bijzondere gevallen kan op verzoek van betrokkene een aanstelling in tijdelijke dienst worden verleend
      waarin ten aanzien van hem dit besluit gedeeltelijk of andere algemene maatregelen van bestuur als bedoeld in
      [artikel 125, eerste lid, van de Ambtenarenwet][ref1] die specifiek betrekking hebben op ambtenaren in de zin van
      dit besluit, geheel of gedeeltelijk buiten toepassing worden verklaard.

      2 Bij regeling van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kunnen nadere regels worden gesteld
      omtrent het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125
