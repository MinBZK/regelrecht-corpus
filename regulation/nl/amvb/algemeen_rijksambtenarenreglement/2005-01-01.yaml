    text: |-
      1 De ambtenaar kan in het kader van een reorganisatie eervol ontslag worden verleend indien het niet mogelijk is
      gebleken om hem te herplaatsen in een passende functie.

      2 Aan de ambtenaar die in het kader van een reorganisatie is herplaatst kan alsnog het ontslag, bedoeld in het
      eerste lid worden verleend indien binnen een periode van uiterlijk één jaar te rekenen vanaf de datum waarop de
      functie is opgedragen, blijkt dat de betreffende functie niet passend is voor die ambtenaar en het niet mogelijk is
      om de ambtenaar binnen een redelijke termijn op een passende functie te plaatsen.

      3 Bij een ontslagverlening op grond van het eerste lid van dit artikel wordt een opzeggingstermijn van drie maanden
      in acht genomen. Bij een ontslagverlening op grond van het tweede lid van dit artikel geldt geen opzeggingstermijn.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel96
  - number: 96a
    text: |-
      1 Aan de ambtenaar kan eervol ontslag worden verleend indien van hem in redelijkheid niet kan worden verlangd, dat
      hij zich zal voegen in zijn verplaatsing over een aanmerkelijke afstand tengevolge van een verplaatsing van zijn
      functie.

      2 Aan de ambtenaar kan binnen een periode van uiterlijk één jaar nadat hij is verplaatst over een aanmerkelijke
      afstand, alsnog het ontslag, bedoeld in het eerste lid worden verleend indien van hem in redelijkheid niet kan
      worden verlangd dat hij zich zal blijven voegen in zijn verplaatsing over een aanmerkelijke afstand tengevolge van
      een verplaatsing van zijn functie.

      3 De artikelen 49*h* tot en met 49*l*, 49*o* en 49*p* zijn op de ambtenaar van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel96a
  - number: 96b
    text: |-
      1 Aan de ambtenaar die in verband met de aanvaarding van een functie in een publiekrechtelijk college, waarin hij
      is benoemd of verkozen, tijdelijk is ontheven van de waarneming van zijn ambt, wordt, indien hij ophoudt zodanige
      functie te bekleden en hij naar het oordeel van het bevoegd gezag niet in actieve dienst kan worden hersteld,
      eervol ontslag verleend.

      2 Tenzij artikel 34*e*, eerste lid, van toepassing is, wordt eervol ontslag eveneens verleend aan de ambtenaar, die
      na afloop van het verlof, verleend met toepassing van artikel 34, uitgezonderd het vierde en vijfde lid, naar het
      oordeel van het bevoegd gezag niet in actieve dienst kan worden hersteld.

      3 Het eerste lid vindt eveneens toepassing voor de ambtenaar die ophoudt de functie te bekleden, bedoeld in artikel
      16, derde lid.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel96b
  - number: 96c
    text: |-
      Aan de ambtenaar die een benoeming tot minister of staatssecretaris aanvaardt wordt, met ingang van de dag van het
      aanvaarden van deze betrekking, eervol ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel96c
  - number: '97'
    text: |-
      1 Bij besluit van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties wordt een in categorie A en B
      onderverdeelde lijst met functies vastgesteld, die uit hoofde van de aard van de aan die functies verbonden
      werkzaamheden als substantieel bezwarend worden aangemerkt.

      2 De ambtenaar, belast met een functie die is ingedeeld in categorie A van de in het eerste lid bedoelde lijst,
      wordt eervol ontslag verleend op de eerste dag van de maand volgende op die waarin hij de leeftijd van 60 jaar
      heeft bereikt.

      3 De ambtenaar, belast met een functie die is ingedeeld in categorie B van de in het eerste lid bedoelde lijst,
      wordt eervol ontslag verleend op de eerste dag van de maand volgende op die waarin hij de leeftijd van 55 jaar
      heeft bereikt.

      4 Het bevoegd gezag kan van het verlenen van het ontslag, bedoeld in het tweede en het derde lid, voor de
      duur van telkens ten hoogste één jaar afzien, indien het dienstbelang zich daartegen niet verzet, de ambtenaar
      zulks heeft aangevraagd of daarmee instemt en hij blijkens de uitslag van een door de Arbo-dienst ingesteld
      arbeidsgezondheidskundig onderzoek, als bedoeld in [artikel 36a, eerste lid, onder f][ref1], lichamelijk en
      psychisch in staat kan worden geacht zijn functie te blijven vervullen.

      5 Indien niet meer wordt voldaan aan een of meer van de in het vierde lid genoemde voorwaarden, vindt eervol
      ontslag plaats.

      6 Het ontslag, bedoeld in het vijfde lid, wordt verleend met ingang van een dag niet vroeger dan een maand of niet
      later dan drie maanden na de dag, waarop niet langer aan een of meer van de in het vierde lid gestelde voorwaarden
      wordt voldaan.

      7 De ambtenaar, aan wie op grond van het tweede, derde of vijfde lid ontslag is verleend, heeft recht op een
      uitkering overeenkomstig door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties te stellen regels.

      8 Het ontslag op grond van het tweede, derde of vijfde lid wordt geacht een ontslag te zijn als bedoeld in artikel
      94a, tweede lid, indien ten aanzien van dat ontslag wordt voldaan aan de in dat artikel genoemde voorwaarden.


