  - number: 33c
    text: |-
      1 Tenzij de belangen van de dienst zich daartegen verzetten, wordt buitengewoon verlof met behoud van volle
      bezoldiging verleend:

      a. voor het zoeken van een woning in geval van overplaatsing: ten hoogste twee dagen;

      b. bij verhuizing ingeval van overplaatsing: aan hen, die een eigen huishouding hebben: twee dagen, zo nodig te
      verlengen tot drie en in zeer bijzondere gevallen tot vier dagen en aan hen, die niet een eigen huishouding hebben:
      ten hoogste twee dagen;

      c. bij verhuizing anders dan in geval van overplaatsing: aan hen, die een eigen huishouding hebben, eenmaal in een
      kalenderjaar en ten hoogste twee dagen.

      2 Onze Minister kan regels stellen in aanvulling op of in afwijking van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel33c
  - number: 33d
    text: |-
      1 Tenzij de belangen van de dienst zich daartegen verzetten, wordt aan de ambtenaar buitengewoon verlof met behoud
      van volle bezoldiging verleend:

      a. bij zijn ondertrouw; één dag;

      b. bij zijn huwelijk: vier dagen;

      c. tot het bijwonen van een huwelijk van bloed- of aanverwanten in de eerste en de tweede graad: één dag indien dit
      huwelijk wordt gesloten in zijn woon- of standplaats en ten hoogste twee dagen, indien dit huwelijk wordt gesloten
      buiten zijn woon- of standplaats;

      d. bij overlijden van:

      1°. in artikel 33i, tweede lid, genoemde personen: vier dagen;

      2°. bloed- of aanverwanten in de tweede graad: twee dagen;

      3°. bloed- of aanverwanten in de derde of vierde graad: ten hoogste één dag;

      indien de ambtenaar is belast met de regeling van de lijkbezorging of van de nalatenschap dan wel van beide: ten
      hoogste vier dagen;

      e. bij bevalling van zijn echtgenote: ten hoogste twee dagen;

      f. bij zijn 25-, 40-, en 50-jarig ambts- of huwelijksjubileum en bij 25-, 40-, 50- en 60-jarig huwelijksjubileum
      van ouders, stiefouders, pleegouders, schoonouders of grootouders: één dag.

      2 Voor de toepassing van dit artikel wordt onder huwelijk mede begrepen het sluiten van een samenlevingscontract
      als bedoeld in artikel 4, vierde lid, of het aangaan van een geregistreerd partnerschap.

      3 Buitengewoon verlof dat aan de ambtenaar op grond van het eerste lid wordt verleend in verband met
      aanverwantschap die door zijn huwelijk is ontstaan met bloedverwanten van zijn echtgenote wordt op gelijke wijze
      verleend aan de ambtenaar die ongehuwd samenwoont als bedoeld in artikel 4, vierde lid, of aan de ambtenaar die een
      geregistreerd partnerschap is aangegaan, met betrekking tot dezelfde bloedverwanten van zijn levenspartner of van
      zijn geregistreerde partner.

      4 Onze Minister kan regels stellen in aanvulling op of in afwijking van de vorige leden.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel33d
  - number: 33e
    text: |-
      1 Buitengewoon verlof van korte duur, al dan niet met behoud van volle bezoldiging, kan bovendien worden verleend
      in de gevallen, waarin hij, die tot verlenen van dat verlof bevoegd is verklaard, oordeelt, dat daartoe aanleiding
      bestaat.

      2 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties is bevoegd ter uitvoering van het eerste lid zo nodig
      nadere regels vast te stellen.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel33e
  - number: 33f
    text: |-
      1 Behoudens in dringende gevallen moet buitengewoon verlof van korte duur tenminste 24 uren tevoren schriftelijk of
      mondeling worden aangevraagd.

      2 Indien de ambtenaar, die niet vooraf een aanvraag voor buitengewoon verlof van korte duur heeft ingediend, ten
      genoegen van de in het eerste lid bedoelde autoriteit aantoont, dat hij daartoe geen gelegenheid heeft gehad,
      terwijl er voor zijn afwezigheid gegronde redenen bestonden, wordt deze afwezigheid beschouwd als buitengewoon
      verlof met behoud van volle bezoldiging.

      3 Een gegronde reden als bedoeld in het tweede lid is slechts aanwezig:

      a. indien een der in de voorgaande artikelen genoemde omstandigheden aanwezig is geweest, op grond waarvan aan
      de ambtenaar op zijn aanvraag buitengewoon verlof wordt verleend, zulks met inachtneming van de daarbij vermelde
      voorwaarden en termijnen;

      b. in alle andere gevallen, indien de ambtenaar, alle omstandigheden in aanmerking genomen, redelijkerwijze de
      dienst mocht verzuimen.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel33f
  - number: 33fa
    text: |-
      1 De ambtenaar die zorg draagt voor een of meer personen als bedoeld in het vierde lid heeft aanspraak op
      zorgverlof bij calamiteiten onder behoud van zijn volle bezoldiging.

      2 Onder calamiteit wordt verstaan ziekte of een andere onverwachte gebeurtenis waardoor een noodsituatie ontstaat
      in de verzorging van een of meer van de in het vierde lid bedoelde personen.

      3 Het verlof is bedoeld als eerste opvang en voor het treffen van verdere voorzieningen en bedraagt maximaal 1 dag
      per calamiteit.

      4 De personen voor wier verzorging het verlof kan worden verleend zijn: de echtgenote, ouders, stiefouders,
      pleegouders, schoonouders, kinderen, stiefkinderen, pleegkinderen of aangehuwdkinderen van de ambtenaar.

      5 De ambtenaar informeert het bevoegd gezag vooraf over het opnemen van het verlof onder vermelding van de reden.

      6 Het bevoegd gezag kan eisen dat de ambtenaar achteraf aannemelijk maakt dat daadwerkelijk sprake was van een
      noodsituatie. Indien de ambtenaar daar naar het oordeel van het bevoegd gezag niet in slaagt kunnen de opgenomen
      uren in mindering worden gebracht op het vakantieverlof.

      7 Voor de toepassing van dit artikel is het derde lid van artikel 33*d* van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel33fa
  - number: 33fb
    text: |-
      1 De vrouwelijke ambtenaar heeft in verband met haar bevalling aanspraak op zwangerschaps- en bevallingsverlof.

      2 Gedurende het zwangerschaps- en bevallingsverlof behoudt de vrouwelijke ambtenaar haar aanspraak op bezoldiging.

      3 De vrouwelijke ambtenaar heeft recht op een zwangerschapsverlof vanaf de dag waarop de bevalling blijkens een
      verklaring van een arts of van een verloskundige aangevende de vermoedelijke datum van de bevalling, binnen zes
      weken is te verwachten. Het verlof vangt uiterlijk aan vier weken voorafgaand aan de vermoedelijke datum van de
      bevalling.

      4 De vrouwelijke ambtenaar heeft recht op een bevallingsverlof van tien weken vanaf de dag volgend op die van de
      bevalling. Dit verlof wordt verlengd tot ten hoogste zestien weken, voor zover het zwangerschapsverlof voorafgaand
      aan de vermoedelijke datum van bevalling, om andere redenen dan wegens ziekte minder dan zes weken heeft bedragen.

      5 Indien de vrouwelijke ambtenaar aan wie verlof is verleend gedurende dat verlof of gedurende een bepaalde periode
      van dat verlof tevens recht heeft op een financiële tegemoetkoming op basis van de [Wet arbeid en zorg][ref1],
      wordt gedurende de periode waarin sprake is van samenloop een inhouding op de doorbetaling van bezoldiging als
      bedoeld in het tweede lid toegepast welke overeenkomt met het bedrag van bedoelde financiële tegemoetkoming.

      6 Indien aan de gestelde voorwaarden voor het toekennen van een financiële tegemoetkoming als bedoeld in het vijfde
      lid is voldaan maar geen financiële tegemoetkoming is toegekend omdat de vrouwelijke ambtenaar geen aanvraag heeft
      ingediend, past het bevoegd gezag het vijfde lid op overeenkomstige wijze toe. In dat geval wordt rekening gehouden
      met de financiële tegemoetkoming die aan de vrouwelijke ambtenaar zou zijn toegekend indien zij wel een aanvraag
      zou hebben ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0013008
