  - number: 34g
    text: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt regels ten aanzien van verlofsparen.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel34g
  - number: '35'
    text: |-
      In dit hoofdstuk wordt verstaan onder:

      a) arbeidsongeschiktheid: arbeidsongeschiktheid als bedoeld in artikel 18, eerste lid, van de WAO;

      b) Arbo-dienst: een deskundige dienst als bedoeld in
      [artikel 14, derde lid, laatste volzin, van de Arbeidsomstandighedenwet 1998][ref1];

      c) beroepsziekte: een ziekte, welke in overwegende mate haar oorzaak vindt in de aard van de aan de ambtenaar
      opgedragen werkzaamheden of in de bijzondere omstandigheden, waaronder deze moesten worden verricht, en niet aan
      zijn schuld of onvoorzichtigheid is te wijten;

      d) dienstongeval: een ongeval, welke in overwegende mate zijn oorzaak vindt in de aard van de aan de ambtenaar
      opgedragen werkzaamheden of in de bijzondere omstandigheden, waaronder deze moesten worden verricht, en niet aan
      zijn schuld of onvoorzichtigheid is te wijten;

      e) gangbare arbeid: arbeid als bedoeld in artikel 18, vijfde lid, van de WAO;

      f) herplaatsen: het opdragen van een andere betrekking op grond van artikel 57a;

      g) herplaatsingstoelage: een herplaatsingstoelage als bedoeld in hoofdstuk 9 van het Pensioenreglement van de
      Stichting Pensioenfonds ABP;

      h) invaliditeitspensioen: een invaliditeitspensioen als bedoeld in hoofdstuk 8 van het Pensioenreglement van de
      Stichting Pensioenfonds ABP;

      i) medisch advies: een advies van de Arbo-dienst dat ten aanzien van de ambtenaar is uitgebracht na een
      arbeidsgezondheidskundig onderzoek als bedoeld in [artikel 18 van de Arbeidsomstandighedenwet 1998][ref2] en
      artikel 36a van dit reglement;

      j) gewezen ambtenaar: een ambtenaar aan wie ontslag is verleend, met ingang van de dag waarop het ontslag is
      ingetreden;

      k) UWV: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in [hoofdstuk 5 van de Wet SUWI][ref3];

      l) passende arbeid: alle arbeid die voor de krachten en bekwaamheden van de ambtenaar is berekend, tenzij
      aanvaarding om redenen van lichamelijke, geestelijke of sociale aard niet van hem kan worden gevergd;

      m) Pensioenreglement: het Pensioenreglement van de Stichting Pensioenfonds ABP;

      n) Stichting Pensioenfonds ABP: de Stichting Pensioenfonds ABP, bedoeld in
      [artikel 6 van de Wet privatisering ABP][ref4];

      o) Wet SUWI: de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref5];

      p) WW-uitkering: een uitkering op grond van de [Werkloosheidswet][ref6];

      q) bovenwettelijke WW-uitkering: de uitkering bedoeld in
      __REF000___________________________________________________________________________________________________________
      _____;

      r) WAO: de [Wet op de arbeidsongeschiktheidsverzekering][ref8];

      s) WAO-uitkering: een uitkering op grond van de WAO;

      t) ZW: de [Ziektewet][ref9];

      u) ZW-uitkering: ziekengeld als bedoeld in artikel 19 van de ZW;

      v) zijn arbeid: hetgeen daaronder wordt verstaan ingevolge artikel 19 van de ZW.


