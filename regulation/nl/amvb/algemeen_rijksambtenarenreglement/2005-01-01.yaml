        artikel: '125'
  - number: 6b
    text: |-
      1 De aanstelling geschiedt voor een vast aantal uren of voor een variabel aantal uren.

      2 Indien de aanstelling geschiedt voor een variabel aantal uren wordt daarbij een aantal garantie-uren bepaald.

      3 Indien het dienstbelang zich in bijzondere gevallen verzet tegen het bepalen van een aantal garantie-uren kan
      Onze Minister regels stellen waarbij wordt afgeweken van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel6b
  - number: '7'
    text: |-
      1 Tenzij Wij anders hebben bepaald geschiedt de aanstelling en, voor zover nodig, de vaststelling van de
      salarisschaal door Ons, indien het betreft:

      a. een lid van de Algemene Bestuursdienst;

      b. de ambtenaar die een ambt vervult genoemd in de
      [bijlage A van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1], niet zijnde dat van lid van de
      topmanagementgroep;

      c. de ambtenaar die een functie vervult waarvoor salarisschaal 16 of 15 van de
      [bijlage B van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref2] geldt en die niet is aangewezen tot
      lid van de Algemene Bestuursdienst.

      2 Tenzij Wij anders hebben bepaald geschiedt de in het eerste lid bedoelde aanstelling en vaststelling van de
      salarisschaal op de voordracht van:

      a. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, indien het betreft een lid van de
      topmanagementgroep, bedoeld in artikel 4, vijfde lid, onder a;

      b. Onze Minister in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, indien het
      betreft een ambtenaar bedoeld in artikel 4, vijfde lid, onder b of c;

      c. Onze Minister, indien het betreft een ambtenaar, bedoeld in het eerste lid, onder b of c.

      3 In de overige gevallen vindt de aanstelling en vaststelling van de salarisschaal plaats door Onze Minister.

      4 De ambtenaar die is aangesteld tot lid van de topmanagementgroep wordt door Onze Minister van Binnenlandse Zaken
      en Koninkrijksrelaties in overeenstemming met Onze Minister voor een periode van maximaal zeven jaar benoemd in een
      van de volgende functies:

        - secretaris-generaal
        - directeur-generaal
        - inspecteur-generaal
        - thesaurier-generaal
        - directeur Bureau voor de Industriële eigendom
        - directeur van het Centraal Planbureau
        - hoofd van de Algemene Inlichtingen- en Veiligheidsdienst.

      5 In bijzondere gevallen kan de periode van zeven jaar, genoemd in het vierde lid, worden verlengd dan wel
      voortijdig worden beëindigd. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt regels ten aanzien
      van de wijze waarop tot verlenging respectievelijk voortijdige beëindiging wordt gekomen, alsmede over de gevolgen
      voor de rechtspositie van de ambtenaar.

      6 Tenzij Wij anders hebben bepaald wordt de ambtenaar, bedoeld in artikel 4, vijfde lid, onder b of c, voor een
      periode van in beginsel ten hoogste vijf jaar in een functie benoemd. Deze benoeming duurt voort, zolang na afloop
      van die periode geen nieuwe functie wordt opgedragen.

      7 Voor zover de aanstelling betrekking heeft op een functie bij de Algemene Rekenkamer, de Hoge Raad van Adel,
      het Kabinet der Koningin, de Kanselarij der Nederlandse Orden, de Nationale Ombudsman of de Raad van State, dient
      in het tweede en derde lid voor Onze Minister telkens te worden gelezen: het College van de Algemene Rekenkamer
      respectievelijk de voorzitter van de Hoge Raad van Adel, de directeur van het Kabinet der Koningin, de kanselier
      der Nederlandse Orden, de Nationale Ombudsman of de vice-president van de Raad van State.


