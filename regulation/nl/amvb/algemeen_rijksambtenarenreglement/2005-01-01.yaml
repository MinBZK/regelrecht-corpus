  - number: 48b
    text: |-
      1 De aanspraak van de ambtenaar en de gewezen ambtenaar op de bovenwettelijke arbeidsongeschiktheidsuitkering wordt
      zoveel mogelijk op gelijke wijze gewijzigd als een aan hem toegekende WAO-uitkering.

      2 Het eerste lid vindt geen toepassing indien de ambtenaar en de gewezen ambtenaar aanspraak op een WAO-uitkering
      hebben wegens de ongeschiktheid tot werken voor een betrekking die de ambtenaar of de gewezen ambtenaar heeft
      vervuld naast zijn betrekking ter zake waarvan de ambtenaar of de gewezen ambtenaar op een uitkering krachtens dit
      hoofdstuk aanspraak heeft, voor zover de WAO-uitkering naar de inkomsten uit die andere betrekking wordt berekend
      of geacht kan worden te zijn berekend.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel48b
  - number: '49'
    text: |-
      1 De ambtenaar die aanspraak heeft op een bovenwettelijke arbeidsongeschiktheidsuitkering, heeft aanspraak op een
      vakantie-uitkering ter grootte van 8% van de bovenwettelijke arbeidsongeschiktheidsuitkering.

      2 De [artikelen 21][ref1] en [22 van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel21
