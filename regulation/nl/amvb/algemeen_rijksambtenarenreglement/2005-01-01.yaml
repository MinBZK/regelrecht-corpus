  - number: '42'
    text: |-
      1 De doorbetaling van de bezoldiging en de bovenwettelijke arbeidsongeschiktheidsuitkering, bedoeld in artikel 37,
      eerste tot en met het vierde lid, eindigen na ommekomst van de uitkeringsduur, maar in ieder geval:

      a) met ingang van de dag waarop de ambtenaar op grond van artikel 57a is herplaatst; of

      b) met ingang van de dag waarop de ambtenaar ontslag is verleend; of

      c) met ingang van de dag waarop de ambtenaar de leeftijd van 65 jaar heeft bereikt; of

      d) met ingang van de dag volgende op die waarop de ambtenaar is overleden.

      2 De doorbetaling van de bezoldiging en de bovenwettelijke arbeidsongeschiktheidsuitkering, bedoeld in artikel 37,
      vijfde en zesde lid, eindigen na ommekomst van de uitkeringsduur, maar in ieder geval:

      a) met ingang van de dag waarop de ambtenaar niet meer voldoet aan de in bedoelde artikelen genoemde voorwaarden;
      of

      b) met ingang van de dag waarop de ambtenaar ontslag is verleend, waaronder het ontslag op grond van artikel 98,
      eerste lid en aanhef, onderdeel f; of

      c) met ingang van de dag waarop de ambtenaar de leeftijd van 65 jaar bereikt; of

      d) met ingang van de dag volgende op die waarop de ambtenaar is overleden.

      3 De doorbetaling van de bezoldiging en de bovenwettelijke arbeidsongeschiktheidsuitkering, bedoeld in artikel 38,
      eerste en tweede lid, eindigen na ommekomst van de uitkeringsduur, maar in ieder geval:

      a) met ingang van de dag waarop de gewezen ambtenaar is herplaatst overeenkomstig artikel 57a;

      b) met ingang van de dag waarop de gewezen ambtenaar de leeftijd van 65 jaar bereikt; of

      c) met ingang van de dag volgende op die waarop de gewezen ambtenaar is overleden.

      4 De aanvullende uitkering, bedoeld in [artikel 38, derde lid][ref1], eindigt:

      a) met ingang van de dag waarop de gewezen ambtenaar niet meer voldoet aan de in bedoelde artikelen genoemde
      voorwaarden; of

      b) met ingang van de dag waarop de gewezen ambtenaar de leeftijd van 65 jaar heeft bereikt, of;

      c) met ingang van de dag volgende op die waarop de gewezen ambtenaar is overleden.

      5 De aanvulling tot zijn bezoldiging, bedoeld in artikel 39, tweede lid, eindigt na ommekomst van de
      uitkeringsduur, maar in ieder geval:

      a) met ingang van de dag waarop de ambtenaar niet meer voldoet aan de in bedoelde artikelen genoemde voorwaarden;
      of

      b) met ingang van de dag waarop de ambtenaar op grond van artikel 57a wordt herplaatst; of

      c) met ingang van de dag waarop de ambtenaar ontslag is verleend; of

      d) met ingang van de dag waarop de ambtenaar de leeftijd van 65 jaar heeft bereikt; of

      e) met ingang van de dag volgende op die waarop de ambtenaar is overleden.

      6 [Artikel 41, zesde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel41
