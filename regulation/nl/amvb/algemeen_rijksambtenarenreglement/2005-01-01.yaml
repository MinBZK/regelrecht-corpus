  - number: '39'
    text: |-
      1 De ambtenaar en de gewezen ambtenaar hebben geen aanspraak op doorbetaling van de bezoldiging, een
      bovenwettelijke arbeidsongeschiktheidsuitkering of een aanvullende uitkering als bedoeld in de artikelen 37 en 38,
      indien zij geen deelnemer zijn in de zin van het Pensioenreglement.

      2 De ambtenaar die geen deelnemer is in de zin van het Pensioenreglement, heeft bij ongeschiktheid tot het
      verrichten van zijn arbeid wegens ziekte tijdens de duur van zijn dienstverband recht op:

      a) doorbetaling van zijn bezoldiging gedurende de eerste 52 weken;

      b) gedurende de daaropvolgende 26 weken:

      I) indien hij geen recht heeft op een WAO-uitkering: doorbetaling van zijn bezoldiging; of

      II) indien hij recht heeft op een WAO-uitkering: een aanvulling tot zijn bezoldiging op WAO-uitkering; en

      c) daarna:

      I) indien hij geen recht heeft op een WAO-uitkering: doorbetaling van 80% van zijn bezoldiging; of

      II) indien hij recht heeft op een WAO-uitkering: een aanvulling tot 80% van zijn bezoldiging op een eventueel
      toegekende WAO-uitkering.

      3 Indien de ambtenaar, die geen deelnemer is in de zin van het Pensioenreglement, geen ZW-uitkering of WAO-
      uitkering kan worden toegekend tengevolge van handelingen of het nalaten van handelingen door de ambtenaar, wordt
      bedoelde uitkering voor het vaststellen van zijn aanspraak op een bovenwettelijke arbeidsongeschiktheidsuitkering,
      steeds geacht onverminderd te zijn genoten.

      4 Indien als gevolg van handelingen of het nalaten van handelingen door de ambtenaar, die geen deelnemer is
      in de zin van het Pensioenreglement, de WAO-uitkering vermindering ondergaat, dan wel de aanspraak daarop
      geheel of gedeeltelijk wordt geweigerd, wordt bedoelde uitkering voor het vaststellen van zijn aanspraak op een
      bovenwettelijke arbeidsongeschiktheidsuitkering, steeds geacht onverminderd te zijn genoten.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel39
  - number: '40'
    text: |-
      1 De ambtenaar en de gewezen ambtenaar hebben geen aanspraak op doorbetaling van de bezoldiging of een
      bovenwettelijke arbeidsongeschiktheidsuitkering:

      a) indien de ziekte is voorgewend, althans zodanig overdreven wordt voorgesteld, dat ongeschiktheid tot het
      verrichten van arbeid wegens ziekte niet kan worden aangenomen;

      b) indien de ambtenaar de ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte opzettelijk heeft
      veroorzaakt, tenzij hem daarvan op grond van zijn psychische toestand geen verwijt kan worden gemaakt;

      c) indien de ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte zich voordoet binnen een half jaar
      na het geneeskundig onderzoek, bedoeld in artikel 9, vierde lid, onderdeel b en blijkt dat de ambtenaar onjuiste
      informatie omtrent zijn gezondheidstoestand heeft verstrekt of gegevens heeft verzwegen, ten gevolge waarvan de
      verklaring van geschiktheid, de aan de desbetreffende functie verbonden werkzaamheden te verrichten, ten onrechte
      heeft plaatsgevonden, tenzij de ambtenaar aannemelijk maakt dat hij te goeder trouw heeft gehandeld.

      2 De gewezen ambtenaar heeft geen aanspraak op doorbetaling van zijn laatstelijk genoten bezoldiging of de
      bovenwettelijke arbeidsongeschiktheidsuitkering, indien hij op grond van een aanvaarde andere betrekking aanspraak
      kan maken op doorbetaling van zijn loon of bezoldiging, dan wel op een ZW-uitkering.
