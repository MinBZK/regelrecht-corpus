preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onzen Minister van Justitie van 20 Februari 1931, n°. 974, 2de Afdeeling A;

    Gelet op de artikelen 125, eerste lid en 133, eerste lid, van de Ambtenarenwet 1929;

    Den Raad van State gehoord (advies van 31 Maart 1931, n°. 22);

    Gezien het nader rapport van Onzen Minister voornoemd van 9 Juni 1931, n°. 918, 2 A;

    Hebben goedgevonden en verstaan:

    vast te stellen de navolgende bepalingen.
  url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Ambtenaar in de zin van dit besluit is degene, die door het Rijk is aangesteld om in burgerlijke openbare dienst
      werkzaam te zijn.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel1
  - number: '2'
    text: |-
      1 Voor de toepassing van dit besluit worden niet als ambtenaren beschouwd:

      a. ministers en staatssecretarissen;

      b. Commissarissen des Konings;

      c. krachtens [Grondwet][ref1] of wet voor hun leven aangestelde ambtenaren;

      d. de Nationale ombudsman en substituut-ombudsmannen;

      e. burgemeesters;

      f. de voorzitter en de leden van de Wetenschappelijke Raad voor het Regeringsbeleid;

      g. de voorzitters van de huurcommissies, bedoeld in de [Uitvoeringswet huurprijzen woonruimte][ref2].

      2 De hoofdstukken III, IV en V zijn niet van toepassing op ambtenaren met gedeeltelijke dag-, week- of jaartaken,
      die niet regelmatig dienst doen. Ten aanzien van de in die hoofdstukken geregelde onderwerpen worden voor hen voor
      elk betrokken dienstvak de nodige bepalingen vastgesteld.

      3 Op de ambtenaar die is aangesteld voor het verrichten van enkele diensten niet vallende binnen de taak van het
      betrokken dienstvak, waarbij per dienst een afzonderlijke beloning wordt vastgesteld, zijn niet van toepassing:

      a. hoofdstuk II, paragraaf 4;

      b. de artikelen 14 en 16 tot en met 20*d*;

      c. de hoofdstukken IV en V;

      d. hoofdstuk VI, paragrafen 2 en 3;

      e. de artikelen 33fb, 39, 47 en 48a.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
      [ref2]: https://wetten.overheid.nl/BWBR0014315
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel2
    references:
