  - number: '23'
    text: |-
      1 De ambtenaar is vrij te bepalen wanneer hij vakantie opneemt, voor zoveel de belangen van de dienst zich
      daartegen niet verzetten.

      2 De ambtenaar dient in elk kalenderjaar ten minste 108 uur vakantie op te nemen waarvan ten minste 72 uur over een
      aaneengesloten periode indien voor hem een volledige werktijd geldt en tot in evenredigheid lagere getallen indien
      voor hem een onvolledige werktijd geldt.

      3 Het bevoegde gezag kan toestaan, dat een ambtenaar in enig kalenderjaar meer uren vakantie opneemt dan zijn
      aanspraak tot en met het lopende jaar bedraagt, met dien verstande, dat de opgenomen vakantie de aanspraak tot en
      met het lopende jaar nimmer met meer dan 57,6 uren mag overschrijden. Voor de ambtenaar met onvolledige werktijd
      wordt het in de vorige volzin bedoelde aantal uren van de maximaal toegestane overschrijding verminderd naar
      evenredigheid van de werktijd. De in een kalenderjaar teveel genoten vakantie wordt in mindering gebracht op de
      aanspraak op vakantie over het eerstvolgende jaar.

      4 De ambtenaar meldt het voornemen vakantie op te nemen ruimschoots van tevoren.

      5 Tenzij gewichtige redenen van dienstbelang zich hiertegen verzetten, is het de ambtenaar toegestaan op het
      voornemen vakantie op te nemen, terug te komen, dan wel het opnemen niet voort te zetten. De vorige volzin geldt in
      geval van ziekte of ongeval alleen indien de ambtenaar ten genoege van het bevoegd gezag die ziekte of dat ongeval
      aantoont.

      6 Wanneer dringende redenen van dienstbelang dat noodzakelijk maken, kan het bevoegde gezag aan de ambtenaar
      verleende toestemming vakantie op te nemen intrekken, zowel vóór als tijdens de vakantie. Indien de ambtenaar ten
      gevolge van het intrekken van de toestemming vakantie op te nemen geldelijke schade lijdt, wordt deze hem vergoed.

      7 Niet-opgenomen vakantie, waaronder eventuele van vorige jaren overgeboekte vakantie, wordt naar het volgende
      kalenderjaar overgeboekt tot een maximum van de aanspraak van de ambtenaar over een vol kalenderjaar berekend
      volgens artikel 22, verminderd met de in het tweede lid van dit artikel bedoelde vakantie.

      8 Het bevoegd gezag kan toestaan dat in individuele gevallen in een bepaald jaar wordt afgeweken van de
      overeenkomstig het zevende lid maximaal naar een volgend kalenderjaar over te boeken vakantie-aanspraken.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel23
  - number: '24'
    text: |-
      1 Indien de ambtenaar op de datum van zijn ontslag nog aanspraak heeft op vakantie, wordt hem voor ieder uur
      vakantie dat hij niet heeft opgenomen een vergoeding toegekend ten bedrage van het salaris per uur dat de ambtenaar
      direct voorafgaand aan zijn ontslag genoot. De vergoeding wordt berekend over ten hoogste twee maal de aanspraak op
      vakantie over een vol kalenderjaar, uitgaande van het salaris en de werktijd zoals die direct voorafgaand aan het
      ontslag voor de ambtenaar golden en de leeftijd welke hij bereikt in het kalenderjaar waarin de dienstbetrekking
      wordt beëindigd.

      2 Indien op de dag van zijn ontslag blijkt, dat de ambtenaar teveel vakantie heeft genoten, is hij voor ieder uur
      teveel genoten vakantie een bedrag verschuldigd ten bedrage van het salaris per uur.

      3 In geval van overgang zonder onderbreking naar een andere functie binnen de rijksdienst in de loop van een
      kalenderjaar kan de ambtenaar er - in zoverre in afwijking van lid 1 - voor kiezen de vakantieaanspraken van het
      lopende kalenderjaar die niet genoten zijn, te behouden. Daarbij wordt vakantie die in het lopende kalenderjaar
      genoten is in mindering gebracht op de aanspraken in dat jaar.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel24
  - number: '25'
    text: |-
      Ingeval de ambtenaar in het genot is van een toelage als bedoeld in artikel 17 dan wel artikel 18*a* van het BBRA
      1984 is - met betrekking tot de vaststelling van dat bezoldigingsdeel tijdens vakantie - van artikel 17 lid 3,
      respectievelijk lid 4, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel25
  - number: '26'
    text: Onze Minister is bevoegd nadere en zonodig afwijkende regels vast te stellen.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel26
  - number: '32'
    text: |-
      Onverminderd het bepaalde in de hoofdstukken III en VI, geniet verlof:

      a. de ambtenaar, die als militair dan wel op grond van een verbintenis als vrijwilliger in de zin van artikel 2,
      eerste lid, onder *a* of *b* van de Rechtstoestandregeling reservepolitie of van een overeenkomstige verbintenis,
      als bedoeld in de artikelen 53 en 54 van die regeling in werkelijke dienst is;

      b. de ambtenaar, die zich bevindt in een der omstandigheden, genoemd in artikel 20*b*;

      c. de ambtenaar, die uit hoofde van ziekte of ongeval verhinderd is dienst te verrichten.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel32
  - number: 32a
    text: |-
      1 Indien de Rijksdienst op een daartoe aangewezen kerkelijke of nationale, landelijk, regionaal of plaatselijk
      erkende feest- of gedenkdag is gesloten, geniet de desbetreffende ambtenaar verlof voor zoveel het dienstbelang
      niet anders vereist.

      2 Het vorige lid vindt geen toepassing, indien de sluiting van de Rijksdienst regionaal of plaatselijk plaats vindt
      en de ambtenaar elders werkzaam is.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel32a
  - number: 32b
    text: |-
      1 Onverminderd artikel 76 wordt aan de ambtenaar in de gevallen en onder de voorwaarden genoemd in de volgende
      artikelen van deze paragraaf buitengewoon verlof verleend.

      2 Onder zeer bijzondere persoonlijke omstandigheden als bedoeld in [artikel 4:1 van de Wet arbeid en zorg][ref1]
      worden in ieder geval begrepen de omstandigheden genoemd in de artikelen 33c, 33d en 33fa.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel41
