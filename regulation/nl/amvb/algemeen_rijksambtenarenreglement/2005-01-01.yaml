  - number: '8'
    text: |-
      1 In deze paragraaf wordt verstaan onder "het bevoegd gezag": het tot aanstelling bevoegd gezag of, indien de
      aanstelling bij koninklijk besluit geschiedt, Onze Minister.

      2 Voor zover de aanstelling bij koninklijk besluit geschiedt en betrekking heeft op een functie bij de Raad van
      State, de Algemene Rekenkamer of het bureau van de Nationale ombudsman wordt verstaan onder het bevoegd gezag: de
      vice-president van de Raad van State respectievelijk de Algemene Rekenkamer of de Nationale ombudsman.
    url: https://wetten.overheid.nl/BWBR0001950/2005-01-01#Artikel8
  - number: '9'
    text: |-
      1 Een aanstelling voor de tijd van langer dan drie maanden kan slechts plaatsvinden, indien het bevoegd gezag op
      grond van de gegevens waarover het beschikt van oordeel is dat de betrokkene in voldoende mate geschikt en bekwaam
      is voor de desbetreffende functie.

      2 Het bevoegd gezag kan voor een bepaalde functie of voor een groep van functies eisen van geschiktheid en
      bekwaamheid vaststellen waaraan de betrokkene moet voldoen om voor een aanstelling in aanmerking te komen.

      3 Teneinde vast te stellen of de betrokkene in voldoende mate geschikt of bekwaam is, wordt deze aan een onderzoek
      onderworpen, waaronder begrepen het verifiëren en zo nodig aanvullen van de gegevens die door de betrokkene
      desgevraagd zijn verstrekt.

      4 Het onderzoek, bedoeld in het derde lid, omvat tevens:

      a. een psychologisch onderzoek, indien daaraan naar het oordeel van het bevoegd gezag behoefte bestaat;

      b. een geneeskundig onderzoek, indien dit op grond van een wettelijk voorschrift verplicht is gesteld dan wel
      indien op grond van functie-eisen een onderzoek naar de medische geschiktheid van de betrokkene noodzakelijk is.

      5 Onze Minister stelt vast voor welke functies een onderzoek naar de medische geschiktheid van de betrokkene
      noodzakelijk is.

      6 Het bevoegd gezag kan, met uitzondering van de gevallen, bedoeld in het zevende en het achtste lid, van de
      betrokkene vergen dat deze een verklaring omtrent het gedrag als bedoeld in de [Wet justitiële gegevens][ref1]
      overlegt.

      7 Indien een functie niet zijnde een vertrouwensfunctie als bedoeld in
      [artikel 1, eerste lid, onder a, van de Wet veiligheidsonderzoeken][ref2], bijzondere eisen stelt aan de
      integriteit of de verantwoordelijkheid van degene die deze functie vervult en indien een zwaarwegend algemeen
      belang dit vordert, kunnen aan het bevoegd gezag justitiële gegevens worden verstrekt voor het verrichten van
      een onderzoek naar de betrouwbaarheid en de geschiktheid van een kandidaat voor die functie. Aanstelling in een
      zodanige functie is slechts mogelijk, indien op grond van het onderzoek tegen de vervulling door betrokkene van de
      desbetreffende functie geen bezwaar blijkt te bestaan.

      8 Aanstelling in een vertrouwensfunctie als bedoeld in [artikel 1, eerste lid, onder ][ref3] is slechts mogelijk,
      indien ten aanzien van de betrokkene een verklaring als bedoeld in artikel 1, eerste lid, onder *b*, van die wet
      is afgegeven.

      9 Onze Minister stelt nadere regels vast ter uitvoering van het onderzoek, bedoeld in het zevende lid. Deze
      nadere regels dienen in ieder geval waarborgen te bevatten omtrent een voldoende bescherming van de persoonlijke
      levenssfeer van betrokkene.

      10 Het geneeskundig onderzoek, bedoeld in het vierde lid, onderdeel *b*, mag pas plaatsvinden, indien de betrokkene
      naar het oordeel van het bevoegd gezag op grond van het onderzoek, bedoeld in het derde lid, en eventueel na het
      psychologisch onderzoek, bedoeld in het vierde lid, onderdeel *a*, overigens voldoende bekwaam en geschikt is voor
      de desbetreffende functie. Ook een verklaring omtrent het gedrag mag dan pas worden gevraagd.

      11 Een onderzoek als bedoeld in het zevende lid of een veiligheidsonderzoek wordt pas ingesteld als naar het
      oordeel van het bevoegd gezag de betrokkene bekwaam en geschikt is voor de betreffende functie.

      12 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan omtrent het onderzoek, bedoeld in het derde lid,
      nadere regels vaststellen.


