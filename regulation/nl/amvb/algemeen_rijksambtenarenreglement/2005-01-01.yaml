  - number: '41'
    text: |-
      1 Het tijdvak gedurende welke de ambtenaar en de gewezen ambtenaar aanspraak hebben op de doorbetaling van hun
      bezoldiging vangt aan op de eerste dag waarop:

      a) wegens ziekte geheel of gedeeltelijk niet is gewerkt;

      b) het werken wegens ziekte geheel of gedeeltelijk is gestaakt;

      c) wegens ziekte geheel of gedeeltelijk niet zou zijn gewerkt;

      d) het werken wegens ziekte geheel of gedeeltelijk zou zijn gestaakt.

      2 Het tijdvak gedurende welke de ambtenaar en de gewezen ambtenaar aanspraak hebben op de doorbetaling van hun
      bezoldiging eindigt na 52 weken. Voor het bepalen van het einde van het tijdvak van 52 weken worden perioden
      van ongeschiktheid tot werken wegens ziekte samengeteld, indien de perioden van ongeschiktheid elkaar met een
      onderbreking van minder dan vier weken opvolgen.

      3 Het tijdvak van 26 weken gedurende welke de ambtenaar of de gewezen ambtenaar als bedoeld in
      [artikel 38, eerste lid][ref1], aanspraak hebben op de doorbetaling van de bezoldiging of op de bovenwettelijke
      arbeidsongeschiktheidsuitkering, vangt aan op de dag nadat het tijdvak van 52 weken is geëindigd. Het tijdvak van
      26 weken eindigt na 26 weken, vermeerderd met de tijdvakken waarin de ambtenaar gerekend vanaf de eerste ziektedag:

      a) zijn arbeid voor ten minste 45% heeft verricht;

      b) in het belang van zijn genezing door de Arbo-dienst wenselijk geachte andere arbeid heeft verricht, voor ten
      minste 45% van de voor hem geldende arbeidsduur, verminderd met de dagen waarop de ambtenaar gedurende de termijn
      van 52 weken, als bedoeld in het tweede lid, volledig geschikt is geweest zijn arbeid te verrichten;

      c) arbeid heeft verricht als bedoeld in [artikel 37, derde lid, onder sub c][ref2].

      4 Bij buitengewoon verlof zonder behoud van bezoldiging vangt het tijdvak, bedoeld in het eerste lid, aan op de dag
      volgende op die waarop het buitengewoon verlof is beëindigd.

      5 Indien Onze Minister de aangifte bedoeld in artikel 38, eerste lid van de ZW doet na de eerste dag nadat de
      ongeschiktheid tot werken dertien weken heeft geduurd, wordt:

      a) het tijdvak gedurende welke de ambtenaar en de gewezen ambtenaar aanspraak hebben op de doorbetaling van hun
      bezoldiging vermeerderd met een tijdvak ter grootte van het tijdvak tussen de eerste dag nadat de ongeschiktheid
      tot werken dertien weken heeft geduurd en de dag waarop Onze Minister de aangifte heeft gedaan; en

      b) het tijdvak van 26 weken gedurende welke de ambtenaar en de gewezen ambtenaar aanspraak hebben op doorbetaling
      van de bezoldiging of op de bovenwettelijke arbeidsongeschiktheidsuitkering ter grootte van het verschil tussen
      zijn bezoldiging en de WAO-uitkering, verminderd met het tijdvak ter grootte van het tijdvak tussen de eerste dag
      nadat de ongeschiktheid tot werken dertien weken heeft geduurd en de dag waarop Onze Minister de aangifte heeft
      gedaan.

      6 Onverminderd het in dit artikel bepaalde, kan het tijdvak als bedoeld in
      [artikel XV, tweede lid, van de Wet terugdringing ziekteverzuim][ref3], worden verlengd overeenkomstig het
      [veertiende en vijftiende lid van dat artikel][ref4].


