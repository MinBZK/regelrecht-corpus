  - number: '38'
    text: |-
      1 De gewezen ambtenaar die wegens ziekte, ontstaan voor het tijdstip van ingang van zijn ontslag, na zijn ontslag
      anders dan op grond van artikel 98, eerste lid, aanhef en onderdeel f, nog ongeschikt is een naar aard en omvang
      soortgelijke functie te vervullen, heeft:

      a) zolang hij ongeschikt tot werken is wegens ziekte, doch niet langer dan een tijdvak van ten hoogste 52 weken,
      aanspraak op de doorbetaling van zijn laatstelijk genoten bezoldiging vermeerderd met de vakantie-uitkering.

      b) zolang hij na afloop van het tijdvak, bedoeld in onderdeel a, nog ongeschikt is tot het verrichten van arbeid
      wegens ziekte maar niet langer dan 26 weken, indien hij op grond van zijn dienstbetrekking

      I) geen aanspraak heeft op een WAO-uitkering: aanspraak op doorbetaling van zijn laatstelijk genoten bezoldiging;
      of

      II) aanspraak heeft op een WAO-uitkering: aanspraak op een bovenwettelijke arbeidsongeschiktheidsuitkering ter
      grootte van het verschil tussen zijn laatstelijk genoten bezoldiging vermeerderd met de vakantieuitkering, en de
      WAO-uitkering.

      2 De gewezen ambtenaar die binnen een maand na het tijdstip van zijn ontslag wegens ziekte ongeschikt wordt een
      naar aard en omvang soortgelijke functie te vervullen, heeft zolang betrokkene ongeschikt is tot werken wegens
      ziekte, maar niet langer dan 52 weken, aanspraak op doorbetaling van zijn laatstelijk genoten bezoldiging indien
      hij gedurende ten minste twee maanden onmiddellijk aan het ontslag voorafgaande in dienst is geweest.

      3 De gewezen ambtenaar die aanspraak heeft op een WAO-uitkering ter zake van de dienstbetrekking die hij voor zijn
      ontslag vervulde, heeft aanspraak op een aanvullende uitkering indien de arbeidsongeschiktheid is veroorzaakt door
      een dienstongeval of een door het verrichten van zijn arbeid opgelopen beroepsziekte.

      4 De in het derde lid bedoelde aanvullende uitkering is gelijk aan het verschil tussen:

      a) een percentage van de laatstelijk genoten bezoldiging vermeerderd met de vakantie-uitkering, in het jaar
      voorafgaande aan zijn ontslag; en

      b) de aan de ambtenaar toegekende WAO-uitkering, in voorkomend geval vermeerderd met een hem toegekend
      invaliditeitspensioen en een hem toegekende herplaatsingstoelage.

      5 Het percentage, bedoeld in het vierde lid, onderdeel a, is afhankelijk van de mate van arbeidsongeschiktheid en
      bedraagt bij een arbeidsongeschiktheid van:








                    80% of meer:


                    90,02%;




                    65 tot 80%:


                    65,26%;




                    55 tot 65%:


                    54,01%;




                    45 tot 55%:


                    45,01%;




                    35 tot 45%:


                    36,01%;




                    25 tot 35%:


                    27,01%;




                    15 tot 25%:


                    18,00%.






      6 De gewezen ambtenaar aan wie eervol ontslag is verleend op grond van artikel 94a, heeft slechts aanspraak op
      de doorbetaling van zijn laatstelijk genoten bezoldiging of de bovenwettelijke arbeidsongeschiktheidsuitkering
      voorzover deze te samen met de aanvullende uitkering bedoeld in artikel 4 van het FPU-reglement basis- en
      aanvullende uitkering, de laatstgenoten bezoldiging niet overschrijdt.
