  - number: '37'
    text: |-
      1 De ambtenaar heeft bij ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte gedurende een tijdvak van
      52 weken recht op de doorbetaling van zijn bezoldiging.

      2 De ambtenaar die na afloop van het tijdvak, bedoeld in het eerste lid, nog ongeschikt is tot het verrichten van
      zijn arbeid wegens ziekte, heeft, indien hij op grond van zijn dienstbetrekking

      a. geen aanspraak heeft op een WAO uitkering:

      I) gedurende ten hoogste 26 weken aanspraak op doorbetaling van zijn bezoldiging, en

      II) in de periode daarna aanspraak op 80% van zijn bezoldiging; of

      b. aanspraak heeft op een WAO-uitkering:

      I) gedurende ten hoogste 26 weken aanspraak op een bovenwettelijke arbeidsongeschiktheidsuitkering ter grootte van
      het verschil tussen zijn bezoldiging en de WAO-uitkering; en

      II) in de periode daarna aanspraak op een bovenwettelijke arbeidsongeschiktheidsuitkering ter grootte van het
      verschil tussen 80% van zijn bezoldiging en de WAO-uitkering.

      3 De ambtenaar geniet ook na afloop van het tijdvak van 26 weken de bovenwettelijke arbeidsongeschiktheidsuitkering
      ter grootte van het verschil tussen zijn bezoldiging en de WAO-uitkering:

      a) voor zo lang hij zijn arbeid voor ten minste 45% verricht; dan wel

      b) indien hij in het belang van zijn genezing door de Arbo-dienst wenselijk geachte andere arbeid verricht voor ten
      minste 45% van de voor hem geldende arbeidsduur; danwel

      c) indien hij tijdelijk andere arbeid verricht voor ten minste 45% van de voor hem geldende arbeidsduur en het
      bevoegd gezag advies inwint bij de Arbo-dienst alvorens de ambtenaar de arbeid verricht; dan wel

      d) indien de ziekte, uit hoofde waarvan hij ongeschikt is zijn arbeid te verrichten, is veroorzaakt door een
      dienstongeval of een door het verrichten van zijn arbeid opgelopen beroepsziekte.

      4 De ambtenaar die op grond van artikel 57a, eerste lid, is herplaatst, voordat de termijn van twee jaar, bedoeld
      in artikel 98, derde lid, onderdeel a, is verstreken, heeft tot het eind van genoemde termijn aanspraak op een
      aanvullende uitkering, indien zijn bezoldiging als gevolg van zijn herplaatsing vermindering ondergaat, ter grootte
      van het verschil tussen:

      a) het bedrag waarop de ambtenaar op grond van dit artikel recht zou hebben gehad indien hem geen andere betrekking
      zou zijn opgedragen, maar in plaats daarvan voor dezelfde arbeidsduur zijn eigen betrekking; en

      b) zijn bezoldiging na herplaatsing, in voorkomend geval vermeerderd met een uit zijn arbeidsongeschiktheid
      voortvloeiend recht op een WAO-uitkering, een invaliditeitspensioen of een herplaatsingstoelage.

      5 De ambtenaar die is herplaatst op grond van artikel 57a, eerste lid, heeft tevens aanspraak op een aanvullende
      uitkering nadat de termijn van twee jaar is verstreken, indien de ziekte, uit hoofde waarvan de ambtenaar
      ongeschikt is zijn arbeid te verrichten wordt veroorzaakt door een dienstongeval of een door het verrichten van
      zijn arbeid opgelopen beroepsziekte, ter grootte van het verschil tussen:

      a) een percentage van zijn bezoldiging vermeerderd met de vakantie-uitkering, zoals die zou zijn op de dag voor
      zijn herplaatsing indien de ambtenaar op die dag niet ongeschikt zou zijn geweest tot werken; en

      b) zijn bezoldiging na herplaatsing vermeerderd met de vakantie-uitkering vermeerderd met een uit
      de oorspronkelijke betrekking voortvloeiend recht op een WAO-uitkering, invaliditeitspensioen en een
      herplaatsingstoelage.

      6 Het percentage, bedoeld in het vijfde lid, onderdeel a, is afhankelijk van de mate van arbeidsongeschiktheid en
      bedraagt bij een arbeidsongeschiktheid van:








                    80% of meer:


                    90,02%;




                    65 tot 80%:


                    65,26%;




                    55 tot 65%:


                    54,01%;




                    45 tot 55%:


                    45,01%;




                    35 tot 45%:


                    36,01%;




                    25 tot 35%:


                    27,01%;




                    15 tot 25%:


                    18,00%.
