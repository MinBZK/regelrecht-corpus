  - number: '102'
    text: |-
      1 De bezoldiging van de ambtenaar wordt niet langer uitbetaald dan tot en met de dag van overlijden. Artikel 24,
      lid 1 wordt voorts overeenkomstig toegepast.

      2 Met inachtneming van het bepaalde in het vijfde lid wordt zo spoedig mogelijk na het overlijden aan de weduwe
      of weduwnaar, van wie de overleden ambtenaar niet duurzaam gescheiden leefde, een bedrag uitgekeerd gelijk aan
      de bezoldiging over een tijdvak van drie maanden. Als maatstaf bij de berekening van het in de vorige volzin
      bedoelde bedrag geldt, behoudens het hierna bepaalde, de bezoldiging, welke de ambtenaar op de dag van het
      overlijden genoot of, indien hij op die dag aanspraak maakt op een uitkering op grond van de [Ziektewet][ref1],
      de [Werkloosheidswet][ref2] of de [Wet op de arbeidsongeschiktheidsverzekering][ref3] dan wel een bovenwettelijke
      arbeidsongeschiktheidsuitkering, bedoeld in hoofdstuk VI, zou hebben genoten indien hij op die dag arbeidsgeschikt
      zou zijn geweest.

      De uitkering wordt vermeerderd met een bedrag gelijk aan drie maal dat van de vakantie-uitkering over een maand
      berekend op de voet van het bepaalde in het [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref4], naar de
      bezoldiging die de ambtenaar in de maand van het overlijden zou hebben genoten. Indien de ambtenaar in het genot
      was van een toelage als bedoeld in artikel 17, dan wel artikel 18*a* van eerdervermeld besluit, wordt het gedeelte
      van de in de eerste volzin bedoelde uitkering dat betrekking heeft op bovenbedoelde toelagen gesteld op het bedrag
      dat de overleden ambtenaar in de drie kalendermaanden voorafgaand aan de dag van het overlijden aan zodanige
      toelagen is toegekend.

      Bij ontstentenis van een weduwe of weduwnaar, van wie de overledene niet duurzaam gescheiden leefde, geschiedt de
      uitkering ten behoeve van de minderjarige kinderen. Onder kinderen in de zin van dit artikel worden mede verstaan
      natuurlijke kinderen en kinderen, waarover de overledene de pleegouderlijke zorg droeg. Onder pleegouderlijke zorg
      wordt verstaan de zorg voor het onderhoud en de opvoeding van het kind als was het een eigen kind, onafhankelijk
      van enige verplichting daartoe of van het genieten van een vergoeding daarvoor. Ontbreken ook zodanige kinderen dan
      geschiedt de uitkering aan degenen die geheel of grotendeels afhankelijk waren van de bezoldiging van de ambtenaar.

      3 Indien de overledene geen betrekkingen, als bedoeld in het tweede lid, nalaat, kan het daarbedoelde bedrag door
      het bevoegde gezag geheel of ten dele worden uitgekeerd voor de betaling van de kosten van de laatste ziekte en van
      de lijkbezorging, indien de nalatenschap van de overledene voor de betaling van die kosten ontoereikend is.

      4 Voor de toepassing van dit artikel wordt, indien de ambtenaar op de dag van het overlijden wegens ziekte of
      ongeval verhinderd was zijn dienst te verrichten, onder bezoldiging verstaan hetgeen daaronder voor de toepassing
      van hoofdstuk VI wordt verstaan.

      5 Indien de ambtenaar voor zijn overlijden te veel vakantie heeft genoten, vindt artikel 24, tweede lid,
      overeenkomstige toepassing. Het aldus verschuldigde bedrag en de reeds voor zijn overlijden aan de ambtenaar
      uitbetaalde bezoldiging over een na zijn overlijden gelegen tijdvak worden in mindering gebracht op het eventueel
      aan de nagelaten betrekkingen of rechtverkrijgenden van de ambtenaar verschuldigde bedrag wegens nog niet vergolden
      aanspraken van de ambtenaar, en bij gebreke hiervan of indien en voorzover dit bedrag daarvoor niet toereikend is,
      op de uitkering bedoeld in het tweede lid.

      6 Op het bedrag, bedoeld in het tweede lid, wordt in mindering gebracht een uitkering op grond van
      [artikel 35 van de Ziektewet][ref5] of [artikel 53 van de Wet op de arbeidsongeschiktheidsverzekering][ref6]
      en naar aard en strekking daarmee overeenkomende uitkeringen, indien deze uitkeringen worden uitgekeerd. Alleen
      uitkeringen die voortvloeien uit de dienstbetrekking bij Onze Minister worden in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0002524
