        bwb_id: BWBR0005889
  - number: '11'
    text: |-
      1 Aan de betrokkene die is onderworpen aan een psychologisch onderzoek als bedoeld in artikel 9, vierde lid,
      onderdeel *a*, wordt op zijn verzoek binnen twee weken na de vaststelling van de uitslag van het onderzoek inzage
      verleend in die uitslag. Dit vindt plaats in het kader van een nagesprek met de psycholoog die het onderzoek heeft
      verricht.

      2 Mededeling van de uitslag van het onderzoek aan het bevoegd gezag blijft achterwege, indien de betrokkene
      uiterlijk een week nadat hij van de uitslag van het onderzoek heeft kennis genomen zijn wens daartoe schriftelijk
      heeft meegedeeld aan degene die met het onderzoek is belast.

      3 De uitslag van het onderzoek wordt niet eerder dan twee weken nadat betrokkene van de uitslag van het onderzoek
      heeft kennis genomen, medegedeeld aan het tot aanstelling bevoegd gezag, tenzij die mededeling op een eerder
      tijdstip is geboden en de betrokkene met die eerdere mededeling schriftelijk heeft ingestemd.

      4 Voor zover dit niet heeft plaatsgevonden overeenkomstig het bepaalde in het eerste lid heeft de betrokkene recht
      op een nagesprek met de psycholoog die het onderzoek heeft verricht.

      5 De betrokkene kan na afloop van het in het eerste en vierde lid bedoelde nagesprek afschrift
      nemen van de uitslag of daarvan een fotocopie krijgen overeenkomstig het bij en krachtens
      [artikel 12 van de Wet openbaarheid van bestuur][ref1] bepaalde.

      6 De kosten van het onderzoek en van het nagesprek komen voor rekening van het Rijk. De betrokkene ontvangt voor
      ten behoeve van het onderzoek gemaakte reis- en verblijfkosten een vergoeding op de voet van de bepalingen van het
      [Reisbesluit binnenland][ref2].

      7 Het eerste, tweede en derde lid zijn niet van toepassing op vergelijkende vooronderzoeken in de door Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties te bepalen gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005889
