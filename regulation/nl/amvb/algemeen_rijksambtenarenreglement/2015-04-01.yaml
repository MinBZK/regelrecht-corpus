  - number: 35a
    text: |-
      Indien de bepalingen in dit hoofdstuk worden toegepast op de Algemene Rekenkamer, de Hoge Raad van Adel, het
      Kabinet van de Koning, de Kanselarij der Nederlandse Orden, de Nationale ombudsman, de Raad van State en het
      secretariaat van de commissie van toezicht op de inlichtingen- en veiligheidsdiensten, dient voor Onze Minister
      telkens respectievelijk te worden gelezen het college van de Algemene Rekenkamer, de voorzitter van de Hoge Raad
      van Adel, de directeur van het Kabinet van de Koning, de kanselier der Nederlandse Orden, de Nationale ombudsman,
      de vice-president van de Raad van State of de voorzitter van de commissie van toezicht op de inlichtingen- en
      veiligheidsdiensten.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel35a
  - number: '36.1'
    text: |-
      Onze Minister verricht zijn taak met betrekking tot begeleiding van verzuim en de arbeidsgezondheidskundige
      begeleiding op grond van de [Arbeidsomstandighedenwet][ref1] en de bepalingen in dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0010346
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0010346
  - number: '36.2'
    text: |-
      Onze Minister kan regels vaststellen met betrekking tot de wijze waarop invulling wordt gegeven aan de begeleiding
      van verzuim, de arbeidsgezondheidskundige begeleiding en de daarbij in acht te nemen procedures.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel36
  - number: '36.3'
    text: |-
      De ambtenaar is in geval van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte verplicht dit zo
      spoedig mogelijk, doch in elk geval niet later dan op de tweede dag van die ongeschiktheid, te melden.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel36
  - number: '36.4'
    text: |-
      Onze Minister kan ten aanzien van de ambtenaar die korter dan een jaar volledig ongeschikt is geweest zijn arbeid
      te verrichten bepalen dat hij zijn arbeid slechts mag hervatten, nadat Onze Minister hiervoor toestemming heeft
      verleend;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel36
  - number: '36.5'
    text: |-
      De ambtenaar die wegens ziekte gedurende een jaar of langer volledig ongeschikt is geweest zijn arbeid te
      verrichten mag zijn arbeid slechts hervatten, nadat Onze Minister hiervoor toestemming heeft verleend.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel36
  - number: '36.6'
    text: |-
      Onze Minister verleent de toestemming, bedoeld in het vierde en vijfde lid, eerst nadat er een medisch advies is
      van de deskundige persoon of de arbodienst.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel36
  - number: 36a.1
    text: 'De ambtenaar kan worden verplicht om een arbeidsgezondheidskundig onderzoek te ondergaan:'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel36a
  - number: 36a.1.a)
    text: |-
      voor zover dit noodzakelijk is om te beoordelen of de ambtenaar van 55 jaar en ouder in staat is nachtarbeid te
      verrichten;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel36a
  - number: 36a.1.b)
    text: indien Onze Minister gegronde redenen heeft om te twijfelen aan de goede gezondheidstoestand van de ambtenaar;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel36a
  - number: 36a.1.c)
    text: indien de ambtenaar niet meer volledig geschikt is gebleken voor het verrichten van zijn arbeid;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel36a
  - number: 36a.1.d)
    text: |-
      ter beantwoording van de vraag of de ambtenaar tijdens het tijdvak waarin hij wegens ziekte ongeschikt is om zijn
      arbeid te verrichten, in het belang van zijn genezing arbeid mag verrichten en om vast te stellen welke arbeid
      wenselijk wordt geacht;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel36a
  - number: 36a.1.e)
    text: |-
      indien de ambtenaar in contact staat of kort geleden heeft gestaan met een persoon die een ziekte heeft waarvoor
      ingevolge de [Wet publieke gezondheid][ref1], een nominatieve aangifteplicht geldt;


      [ref1]: https://wetten.overheid.nl/BWBR0024705
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0024705
  - number: 36a.1.f)
    text: |-
      om te beoordelen of er sprake is van een situatie als bedoeld in
      [artikel 98, derde lid, aanhef en onderdelen a en b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel98
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '98'
        hoofdstuk: X
  - number: 36a.1.g)
    text: |-
      om te beoordelen of de ambtenaar die wegens ziekte volledig ongeschikt is geweest zijn arbeid te verrichten zijn
      arbeid mag hervatten;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel36a
  - number: 36a.1.h)
    text: voorzover dit voortvloeit uit enige wettelijke verplichting;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel36a
  - number: 36a.1.i)
    text: |-
      indien hij in verband met de uitoefening van zijn werkzaamheden aan bijzonder gevaar voor zijn gezondheid
      blootstaat of hij is benoemd in een functie waarvoor bij aanstelling een geneeskundig onderzoek is vereist als
      bedoeld in [artikel 9, vierde lid, onderdeel b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel9
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
  - number: 36a.1.j)
    text: |-
      om bij een verzoek als bedoeld in [artikel 98, negende lid][ref1], te beoordelen of de ambtenaar lichamelijk en
      psychisch in staat is zijn functie te blijven vervullen.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel98
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '98'
        hoofdstuk: X
  - number: 36a.2
    text: |-
      Onze Minister stelt de ambtenaar buiten dienst indien na een arbeidsgezondheidskundig onderzoek als bedoeld in
      het eerste lid, blijkt dat sprake is van een zodanige lichamelijke of geestelijke toestand dat de belangen van de
      ambtenaar, van de dienst of van bij het verrichten van de arbeid betrokken derden zich er tegen verzetten dat de
      ambtenaar zijn arbeid blijft verrichten. De ambtenaar wordt niet buiten dienst gesteld indien hem andere passende
      werkzaamheden kunnen worden opgedragen. Indien de ambtenaar buiten dienst wordt gesteld, wordt hij geacht wegens
      ziekte ongeschikt te zijn tot het verrichten van zijn arbeid, in welk geval de overige bepalingen van dit hoofdstuk
      van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel36a
  - number: 36b.1
    text: |-
      In geval van een geschil over het wel of niet bestaan van ongeschiktheid tot werken wegens ziekte voorziet
      [artikel 32, eerste lid, van de Wet SUWI][ref1] in het instellen van een onderzoek en het geven van een oordeel.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel32
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '32'
  - number: 36b.2
    text: |-
      Het medisch advies dat door de deskundige persoon of de arbodienst wordt uitgebracht naar aanleiding van
      een arbeidsgezondheidskundig onderzoek als bedoeld in [artikel 18 van de Arbeidsomstandighedenwet][ref1] en
      [artikel 36a][ref2], wordt zo spoedig mogelijk aan de ambtenaar en Onze Minister medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel36a
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 36a
        hoofdstuk: VI
        paragraaf: '2'
  - number: 36b.3
    text: |-
      De ambtenaar of de gewezen ambtenaar kan de deskundige persoon of de arbodienst binnen drie dagen na ontvangst van
      het medisch advies, schriftelijk een hernieuwd onderzoek vragen indien hij het niet eens is met het medisch advies.
      De deskundige persoon of de arbodienst stelt Onze Minister in kennis van een ingediend verzoek om een hernieuwd
      onderzoek.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel36b
  - number: 36b.4
    text: |-
      Zo spoedig mogelijk na ontvangst van het schriftelijk verzoek om een hernieuwd onderzoek, doch uiterlijk binnen
      vier weken, vindt het hernieuwd onderzoek door een commissie van drie geneeskundigen plaats.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel36b
  - number: 36b.5
    text: |-
      Op verzoek van de ambtenaar of de gewezen ambtenaar wordt zijn behandelend arts in de gelegenheid gesteld mondeling
      of schriftelijk zijn mening aan de commissie van drie geneeskundigen kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel36b
  - number: 36c.1
    text: |-
      De leden van de commissie bedoeld in [artikel 36b, vierde en vijfde lid][ref1], worden per verzoek om een hernieuwd
      onderzoek aangewezen door Onze Minister. De geneeskundige die het medisch advies heeft uitgebracht waarvan
      herziening wordt gevraagd, heeft in de commissie geen zitting.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel36b
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel36c
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 36b
        hoofdstuk: VI
        paragraaf: '2'
  - number: 36c.2
    text: 'De commissie deelt haar oordeel schriftelijk mee aan:'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel36c
  - number: 36c.2.a)
    text: de ambtenaar of de gewezen ambtenaar;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel36c
  - number: 36c.2.b)
    text: Onze Minister;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel36c
  - number: 36c.2.c)
    text: |-
      de behandelend arts, bedoeld in [artikel 36b, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel36b
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel36c
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 36b
        hoofdstuk: VI
        paragraaf: '2'
  - number: 36d
    text: |-
      De kosten, verbonden aan het onderzoek, bedoeld in [artikel 36b, eerste lid][ref1], respectievelijk, het hernieuwd
      onderzoek bedoeld in het [artikel 36b, derde lid][ref2], komen voor rekening van Onze Minister. Eventuele reis- en
      verblijfkosten van de ambtenaar worden hem vergoed volgens de geldende regels ter zake van dienstreizen.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel36b
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel36b
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel36d
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 36b
        hoofdstuk: VI
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 36b
        hoofdstuk: VI
        paragraaf: '2'
  - number: '37.1'
    text: |-
      De ambtenaar heeft bij ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte gedurende een tijdvak van
      52 weken recht op doorbetaling van zijn bezoldiging. Bij voortdurende ongeschiktheid heeft hij vervolgens recht op
      doorbetaling van 70% van zijn bezoldiging.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel37
  - number: '37.2'
    text: |-
      Het tijdvak van 52 weken, bedoeld in het eerste lid, vangt aan op de eerste dag waarop wegens ziekte geheel
      of gedeeltelijk niet is of zou zijn gewerkt, of het werken wegens ziekte geheel of gedeeltelijk is of zou zijn
      gestaakt. Indien de ambtenaar buitengewoon verlof zonder behoud van bezoldiging geniet, vangt het tijdvak aan op de
      dag volgend op die waarop het buitengewoon verlof is beëindigd.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel37
  - number: '37.3'
    text: 'Voor de toepassing van het eerste lid worden perioden van ongeschiktheid samengeteld indien:'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel37
  - number: 37.3.a
    text: |-
      zij direct voorafgaan aan en aansluiten op een periode waarin zwangerschaps- of bevallingsverlof wordt genoten
      overeenkomstig [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref1], tenzij de ongeschiktheid
      redelijkerwijs niet geacht kan worden voort te vloeien uit dezelfde oorzaak, of


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: 37.3.b
    text: zij elkaar met een onderbreking van minder dan vier weken opvolgen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel37
  - number: '37.4'
    text: |-
      In afwijking van het eerste lid, heeft de ambtenaar ook na afloop van het tijdvak van 52 weken, bedoeld in het
      eerste lid, recht op doorbetaling van zijn bezoldiging indien de ongeschiktheid om zijn arbeid te verrichten wordt
      veroorzaakt door een beroepsincident.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel37
  - number: '37.5'
    text: |-
      In afwijking van het eerste lid, heeft de ambtenaar ook na afloop van het tijdvak van 52 weken, bedoeld in het
      eerste lid, recht op doorbetaling van zijn bezoldiging over het aantal uren dat hij passende arbeid heeft verricht
      of zou hebben verricht indien die arbeid hem zou zijn aangeboden.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel37
  - number: '37.6'
    text: 'De doorbetaling van de bezoldiging eindigt:'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel37
  - number: 37.6.a
    text: |-
      met ingang van de dag waarop de ambtenaar op grond van [artikel 37a, eerste lid][ref1], is herplaatst;


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel37a
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 37a
        hoofdstuk: VI
        paragraaf: '3'
  - number: 37.6.b
    text: met ingang van de dag waarop de ambtenaar ontslag is verleend; of
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel37
  - number: 37.6.c
    text: met ingang van de dag volgende op die waarop de ambtenaar is overleden.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel37
  - number: '37.7'
    text: |-
      Het eerste lid, tweede volzin, is niet van toepassing op de ambtenaar die na het bereiken van de
      pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], wegens
      ziekte ongeschikt is tot het verrichten van zijn arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 37a.1
    text: |-
      De ambtenaar die ongeschikt is tot het verrichten van zijn arbeid wegens ziekte is verplicht een andere functie te
      aanvaarden indien sprake is van passende arbeid.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel37a
  - number: 37a.2
    text: |-
      De ambtenaar die door het UWV in het kader van de [WIA][ref1] minder dan 35% arbeidsongeschikt is verklaard, wordt
      herplaatst in een functie die passende arbeid omvat, tenzij een zwaarwegend dienstbelang zich daartegen verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0019057
  - number: 37a.3
    text: |-
      De ambtenaar die op grond van het eerste lid is herplaatst voordat de termijn van twee jaar, bedoeld in
      [artikel 98, derde lid, onderdeel a][ref1], is verstreken, heeft tot het eind van genoemde termijn rechtop een
      aanvullende uitkering ter grootte van het verschil tussen:


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel98
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '98'
        hoofdstuk: X
  - number: 37a.3.a
    text: |-
      het bedrag waarop de ambtenaar op grond van [artikel 37][ref1] recht zou hebben gehad indien hem geen andere
      functie zou zijn opgedragen, vermeerderd met de vakantie-uitkering en de eindejaarsuitkering; en


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel37
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '37'
        hoofdstuk: VI
        paragraaf: '3'
  - number: 37a.3.b
    text: zijn bezoldiging na herplaatsing, vermeerderd met de vakantie-uitkering en de eindejaarsuitkering.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel37a
  - number: 37a.4
    text: |-
      Indien de ziekte uit hoofde waarvan de ambtenaar ongeschikt is zijn arbeid te verrichten, wordt veroorzaakt door
      een beroepsincident, heeft de ambtenaar, bedoeld in het derde lid, van wie de arbeidsongeschiktheid ten minste 35%
      bedraagt, nadat de termijn van twee jaar is verstreken tevens recht op een aanvullende uitkering ter grootte van
      het verschil tussen:
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel37a
  - number: 37a.4.a
    text: |-
      een percentage van zijn bezoldiging vermeerderd met de vakantie-uitkering en de eindejaarsuitkering, zoals die zou
      zijn op de dag voor zijn herplaatsing indien de ambtenaar op die dag niet ongeschikt zou zijn geweest tot werken,
      en
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel37a
  - number: 37a.4.b
    text: |-
      zijn bezoldiging na herplaatsing vermeerderd met de vakantie-uitkering, de eindejaarsuitkering en een uit de
      oorspronkelijke functie voortvloeiend recht op een WIA-uitkering en een AAOP-uitkering.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel37a
  - number: 37a.5
    text: |-
      Het percentage, bedoeld in het vierde lid, onderdeel a, is afhankelijk van de mate van arbeidsongeschiktheid en
      bedraagt bij een arbeidsongeschiktheid van:






                    80% of meer:


                    90,02%;




                    65 tot 80%:


                    65,26%;




                    55 tot 65%:


                    54,01%;




                    45 tot 55%:


                    45,01%;




                    35 tot 45%:


                    36,01%;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel37a
  - number: 37a.6
    text: 'De aanvullende uitkeringen, bedoeld in het derde en vierde lid, eindigen in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel37a
  - number: 37a.6.a
    text: met ingang van de dag waarop de ambtenaar ontslag is verleend; of
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel37a
  - number: 37a.6.b
    text: met ingang van de dag volgende op die waarop de ambtenaar is overleden.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel37a
  - number: 37a.7
    text: |-
      In zoverre in afwijking van het derde lid, bedraagt voor de ambtenaar die na het bereiken van de
      pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], wegens
      ziekte ongeschikt is tot het verrichten van zijn arbeid, de aanvullende uitkering na de eerste 52 weken weken het
      verschil tussen:


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 37a.7.a
    text: |-
      het bedrag waarop de ambtenaar op grond van [artikel 76a van de Ziektewet][ref1] recht zou hebben gehad indien hem
      geen andere functie zou zijn opgedragen, vermeerderd met de vakantie-uitkering en eindejaarsuitkering; en


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel76a
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 76a
  - number: 37a.7.b
    text: zijn bezoldiging na herplaatsing, vermeerderd met de vakantie-uitkering en de eindejaarsuitkering.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel37a
  - number: 37b.1
    text: |-
      De ambtenaar, bedoeld in [artikel 37a, tweede lid][ref1], die voor 1 januari 2015 is herplaatst, ontvangt bij
      voortdurende arbeidsongeschiktheid gedurende hoogstens vijf jaar een uitkering van 70% van het verschil tussen:


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel37a
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel37b
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 37a
        hoofdstuk: VI
        paragraaf: '3'
  - number: 37b.1.a
    text: |-
      zijn bezoldiging, vermeerderd met de vakantie-uitkering en de eindejaarsuitkering zoals die zou zijn geweest op de
      dag voor zijn herplaatsing indien de ambtenaar op die dag niet ongeschikt zou zijn geweest tot werken, en
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel37b
  - number: 37b.1.b
    text: |-
      zijn bezoldiging na herplaatsing verminderd met eventuele daarna volgende verhogingen op grond van
      [artikel 7 van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1], en vermeerderd met de vakantie-
      uitkering en de eindejaarsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel7
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel37b
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '7'
  - number: 37b.2
    text: |-
      In afwijking van het eerste lid heeft de ambtenaar die arbeidsongeschikt is geworden ten gevolge van een
      beroepsincident, ook nadat de termijn van vijf jaar is verstreken recht op een uitkering.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel37b
  - number: 37b.3
    text: 'De uitkering eindigt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel37b
  - number: 37b.3.a
    text: met ingang van de dag waarop de ambtenaar ontslag is verleend;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel37b
  - number: 37b.3.b
    text: met ingang van de dag volgend op die waarop de ambtenaar is overleden.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel37b
  - number: 37b.4
    text: |-
      Bij eventuele samenloop van een recht op uitkering op grond van dit artikel en een recht op uitkering op grond van
      [artikel 37a, derde of vierde lid][ref1], vervalt het laatstbedoelde recht.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel37a
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel37b
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 37a
        hoofdstuk: VI
        paragraaf: '3'
  - number: '38.1'
    text: |-
      De gewezen ambtenaar die wegens ziekte, ontstaan voor het tijdstip van ingang van zijn ontslag, na zijn ontslag
      anders dan op grond van [artikel 98, eerste lid, onderdeel f][ref1], nog ongeschikt is een naar aard en omvang
      soortgelijke functie te vervullen, heeft:


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel98
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '98'
        hoofdstuk: X
  - number: 38.1.a
    text: |-
      zolang hij ongeschikt tot werken is wegens ziekte, maar niet langer dan een tijdvak van 52 weken, recht
      op doorbetaling van zijn laatstelijk genoten bezoldiging vermeerderd met de vakantie-uitkering en de
      eindejaarsuitkering;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel38
  - number: 38.1.b
    text: |-
      zolang hij na afloop van het tijdvak, bedoeld in onderdeel a, nog ongeschikt is tot het verrichten van arbeid
      wegens ziekte, gedurende maximaal 26 weken recht op doorbetaling van 70% van zijn laatstelijk genoten bezoldiging
      vermeerderd met de vakantie-uitkering en de eindejaarsuitkering.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel38
  - number: '38.2'
    text: |-
      De gewezen ambtenaar die binnen vier weken na het tijdstip van zijn ontslag wegens ziekte ongeschikt wordt een
      naar aard en omvang soortgelijke functie te vervullen, heeft, zolang hij ongeschikt is tot werken wegens ziekte,
      gedurende maximaal 52 weken recht op doorbetaling van zijn laatstelijk genoten bezoldiging indien hij gedurende ten
      minste twee maanden onmiddellijk aan het ontslag voorafgaande in dienst is geweest.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel38
  - number: '38.3'
    text: |-
      De gewezen ambtenaren, bedoeld in het eerste en tweede lid, hebben gedurende een tijdvak van 104 weken als bedoeld
      in [artikel 23 van de WIA][ref1], recht op doorbetaling van hun laatstelijk genoten bezoldiging vermeerderd
      met de vakantie-uitkering en de eindejaarsuitkering indien hun arbeidsongeschiktheid wordt veroorzaakt door een
      beroepsincident.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel23
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '23'
  - number: '38.4'
    text: |-
      Het tijdvak gedurende welke de gewezen ambtenaar recht heeft op doorbetaling van zijn laatstelijk genoten
      bezoldiging vangt aan op de eerste dag waarop wegens ziekte geheel of gedeeltelijk niet is of zou zijn gewerkt of
      het werken wegens ziekte geheel of gedeeltelijk is of zou zijn gestaakt. Indien de gewezen ambtenaar onmiddellijk
      voorafgaand aan het ontslag buitengewoon verlof zonder behoud van bezoldiging genoot, vangt het tijdvak, bedoeld in
      het eerste lid, onderdeel a, aan op de dag waarop het ontslag is ingegaan.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel38
  - number: '38.5'
    text: |-
      Voor het bepalen van het einde van het tijdvak van 52 weken, bedoeld in het eerste en tweede lid, worden perioden
      van ongeschiktheid tot werken wegens ziekte samengeteld indien:
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel38
  - number: 38.5.a
    text: |-
      zij direct voorafgaan aan en aansluiten op een periode waarin zwangerschap- of bevallingsverlof wordt genoten
      overeenkomstig [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref1], of een uitkering op grond van
      [artikel 3:8][ref2] of [3:10, eerste lid, van die wet][ref3], tenzij de ongeschiktheid redelijkerwijs niet geacht
      kan worden voort te vloeien uit dezelfde oorzaak, of


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
  - number: 38.5.b
    text: zij elkaar met een onderbreking van minder dan vier weken opvolgen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel38
  - number: '38.6'
    text: |-
      De doorbetaling van de laatstelijk genoten bezoldiging, bedoeld in het eerste, tweede en derde lid, eindigt in
      ieder geval:
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel38
  - number: 38.6.a
    text: |-
      met ingang van de dag waarop de gewezen ambtenaar de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], heeft bereikt; of


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 38.6.b
    text: met ingang van de dag volgende op die waarop de gewezen ambtenaar is overleden.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel38
  - number: '38.7'
    text: |-
      De gewezen ambtenaar die recht heeft op een WIA-uitkering ter zake van de dienstbetrekking die hij voor zijn
      ontslag vervulde, heeft recht op een aanvullende uitkering indien de arbeidsongeschiktheid is veroorzaakt door
      een beroepsincident.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel38
  - number: '38.8'
    text: 'De aanvullende uitkering, bedoeld in het zevende lid, is gelijk aan het verschil tussen:'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel38
  - number: 38.8.a
    text: |-
      een percentage van de laatstelijk genoten bezoldiging vermeerderd met de vakantie-uitkering en de
      eindejaarsuitkering, in het jaar voorafgaande aan zijn ontslag; en
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel38
  - number: 38.8.b
    text: |-
      de aan de gewezen ambtenaar toegekende WIA-uitkering, in voorkomend geval vermeerderd met een hem toegekende AAOP-
      uitkering.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel38
  - number: '38.9'
    text: |-
      Het percentage, bedoeld in het achtste lid, onderdeel a, is afhankelijk van de mate van arbeidsongeschiktheid en
      bedraagt bij een arbeidsongeschiktheid van:






                    80% of meer:


                    90,02%;




                    65 tot 80%:


                    65,26%;




                    55 tot 65%:


                    54,01%;




                    45 tot 55%:


                    45,01%;




                    35 tot 45%:


                    36,01%;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel38
  - number: '38.10'
    text: 'De aanvullende uitkering, bedoeld in het zevende lid, eindigt:'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel38
  - number: 38.10.a
    text: |-
      met ingang van de dag waarop de gewezen ambtenaar de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], heeft bereikt; of


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 38.10.b
    text: met ingang van de dag volgende op die waarop de gewezen ambtenaar is overleden.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel38
  - number: '38.11'
    text: |-
      De gewezen ambtenaar aan wie eervol ontslag is verleend op grond van [artikel 94a][ref1], heeft slechts recht
      op doorbetaling van zijn laatstelijk genoten bezoldiging of aanvullende uitkering voorzover deze tezamen met de
      aanvullende uitkering, bedoeld in artikel 4 van het FPU-reglement basis- en aanvullende uitkering, de laatstgenoten
      bezoldiging niet overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel94a
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 94a
        hoofdstuk: X
  - number: 38a.1
    text: |-
      De ambtenaar die ongeschikt is zijn arbeid te verrichten wegens een dienstongeval of een beroepsziekte doch
      niet door een beroepsincident, wordt op zijn aanvraag voor de toepassing van dit hoofdstuk gelijkgesteld met de
      ambtenaar die ongeschikt is zijn arbeid te verrichten wegens een beroepsincident.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel38a
  - number: 38a.2
    text: |-
      De gewezen ambtenaar van wie de arbeidsongeschiktheid wordt veroorzaakt door een dienstongeval of een beroepsziekte
      doch niet door een beroepsincident, wordt op zijn aanvraag voor de toepassing van dit hoofdstuk gelijkgesteld met
      de gewezen ambtenaar van wie de arbeidsongeschiktheid wordt veroorzaakt door een beroepsincident.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel38a
  - number: '39'
    text: |-
      De [artikelen 37, vierde lid][ref1], [37a, derde tot en met zevende lid][ref2], [38][ref3], [38a][ref4]
      en [69, tweede lid][ref5], zijn niet van toepassing op de ambtenaar en de gewezen ambtenaar die geen
      overheidswerknemer zijn als bedoeld in [artikel 2, eerste lid, van de Wet privatisering ABP][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel37a
      [ref3]: https://wetten.overheid.nl/BWBR0001950#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0001950#Artikel38a
      [ref5]: https://wetten.overheid.nl/BWBR0001950#Artikel69
      [ref6]: https://wetten.overheid.nl/BWBR0007791#Artikel2
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '37'
        hoofdstuk: VI
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 37a
        hoofdstuk: VI
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0001950
        artikel: '38'
        hoofdstuk: VI
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0001950
        artikel: 38a
        hoofdstuk: VI
        paragraaf: '3'
      - id: ref5
