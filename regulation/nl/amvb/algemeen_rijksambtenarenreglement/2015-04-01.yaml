        bwb_id: BWBR0007791
        artikel: '2'
  - number: '40.1'
    text: 'De ambtenaar en de gewezen ambtenaar hebben geen aanspraak op doorbetaling van de bezoldiging:'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel40
  - number: 40.1.a)
    text: |-
      indien de ziekte is voorgewend, althans zodanig overdreven wordt voorgesteld, dat ongeschiktheid tot het verrichten
      van arbeid wegens ziekte niet kan worden aangenomen;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel40
  - number: 40.1.b)
    text: |-
      indien de ambtenaar de ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte opzettelijk heeft
      veroorzaakt, tenzij hem daarvan op grond van zijn psychische toestand geen verwijt kan worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel40
  - number: 40.1.c)
    text: |-
      indien de ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte zich voordoet binnen een half jaar na het
      geneeskundig onderzoek, bedoeld in [artikel 9, vierde lid, onderdeel b][ref1] en blijkt dat de ambtenaar onjuiste
      informatie omtrent zijn gezondheidstoestand heeft verstrekt of gegevens heeft verzwegen, ten gevolge waarvan de
      verklaring van geschiktheid, de aan de desbetreffende functie verbonden werkzaamheden te verrichten, ten onrechte
      heeft plaatsgevonden, tenzij de ambtenaar aannemelijk maakt dat hij te goeder trouw heeft gehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel9
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
  - number: '40.2'
    text: |-
      De gewezen ambtenaar heeft geen aanspraak op doorbetaling van zijn laatstelijk genoten bezoldiging, indien hij
      op grond van een aanvaarde andere betrekking aanspraak kan maken op betaling van loon of bezoldiging, dan wel
      aanspraak kan maken op een ZW-uitkering.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel40
  - number: 40a.1
    text: |-
      De aanspraken van de ambtenaar en de gewezen ambtenaar op grond van dit hoofdstuk vervallen indien de ambtenaar of
      de gewezen ambtenaar:
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel40a
  - number: 40a.1.a)
    text: niet binnen redelijke termijn gezondheidskundige hulp inroept;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel40a
  - number: 40a.1.b)
    text: zich niet gedurende het gehele verloop van de ziekte onder gezondheidskundige behandeling blijft stellen;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel40a
  - number: 40a.1.c)
    text: de voorschriften van de behandelende arts niet opvolgt;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel40a
  - number: 40a.1.d)
    text: zich schuldig maakt aan gedragingen waardoor zijn genezing wordt belemmerd;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel40a
  - number: 40a.1.e)
    text: |-
      verzuimt de deskundige persoon of de arbodienst op eerste aanvraag mee te delen om welke reden hij ongeschikt is
      tot werken;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel40a
  - number: 40a.1.f)
    text: |-
      zonder deugdelijke grond nalaat gevolg te geven aan een verzoek van de deskundige persoon of de arbodienst om te
      verschijnen;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel40a
  - number: 40a.1.g)
    text: |-
      er de oorzaak van is dat het arbeidsgezondheidskundig onderzoek door een door de deskundige persoon of de
      arbodienst aangewezen arts niet kan plaatshebben;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel40a
  - number: 40a.1.h)
    text: |-
      niet binnen twee dagen na de aanvang van de ongeschiktheid tot werken wegens ziekte dit heeft gemeld bij zijn
      werkgever;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel40a
  - number: 40a.1.i)
    text: |-
      weigert aangeboden passende arbeid, waartoe de deskundige persoon of de arbodienst hem in staat acht, te
      verrichten;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel40a
  - number: 40a.1.j)
    text: |-
      zich niet houdt aan de ten aanzien van hem geldende regels met betrekking tot de wijze waarop invulling wordt
      gegeven aan de verzuimbegeleiding en de arbeidsgezondheidskundige begeleiding en de daarbij in acht te nemen
      procedure;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel40a
  - number: 40a.1.k)
    text: zijn ongeschiktheid tot werken opzettelijk heeft veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel40a
  - number: 40a.1.l)
    text: |-
      weigert inzage te geven in een op hem betrekking hebbend document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] of een geldig rijbewijs als bedoeld in artikel 9, eerste
      lid, van de Wegenverkeerswet, voor zover dit redelijkerwijs nodig is voor de uitvoering van wetten;


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 40a.1.m)
    text: |-
      tijdens de ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte arbeid voor zichzelf of voor derden
      verricht, tenzij dit door de deskundige persoon of de arbodienst in het belang van zijn genezing wenselijk wordt
      geacht;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel40a
  - number: 40a.1.n)
    text: |-
      vóór de betaling van de bezoldiging weigert mededeling te doen van inkomsten uit arbeid die hij heeft in verband
      met het verrichten van door de deskundige persoon of de arbodienst in het belang van zijn genezing wenselijk
      geachte arbeid voor zichzelf of voor derden;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel40a
  - number: 40a.1.o)
    text: |-
      niet onverwijld op verzoek of uit eigen beweging alle feiten en omstandigheden meedeelt, waarvan hem redelijkerwijs
      duidelijk moet zijn dat zij van invloed kunnen zijn op het recht of op de hoogte van een aan hem toegekende
      arbeidsongeschiktheidsuitkering;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel40a
  - number: 40a.1.p)
    text: |-
      zijn arbeid verzuimt te hervatten op het door de deskundige persoon of de arbodienst bepaalde tijdstip en in
      de door deze persoon of dienst bepaalde mate, indien zulks hem is opgedragen, tenzij hij daarvoor een door de
      deskundige persoon of de arbodienst als geldig erkende reden heeft opgegeven;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel40a
  - number: 40a.1.q)
    text: |-
      zonder deugdelijke grond weigert gevolg te geven aan door het bevoegd gezag of een door het bevoegd gezag
      aangewezen deskundige gegeven redelijke voorschriften of mee te werken aan getroffen maatregelen die erop gericht
      zijn om de betrokkene in staat te stellen passende arbeid te verrichten;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel40a
  - number: 40a.1.r)
    text: |-
      zonder deugdelijke grond weigert mee te werken aan het opstellen, evalueren of bijstellen van een plan van aanpak,
      bedoeld in [artikel 25, tweede lid, van de WIA][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel25
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '25'
  - number: 40a.1.s)
    text: |-
      geen aanspraak heeft op een WIA-uitkering omdat geen aanvraag is ingediend of in verband met de toepassing van
      [artikel 88 van de WIA][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel88
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '88'
  - number: 40a.1.t)
    text: zijn medewerking weigert bij de doelmatige uitvoering van de bepalingen van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel40a
  - number: 40a.2
    text: |-
      De aanspraak op de doorbetaling van bezoldiging, kan geheel of gedeeltelijk vervallen worden verklaard in het geval
      de ambtenaar of de gewezen ambtenaar de regels heeft overtreden die ter zake van afwezigheid wegens ziekte zijn
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel40a
  - number: 40a.3
    text: |-
      De ingevolge het eerste lid vervallen aanspraken herleven met ingang van het tijdstip waarop de ambtenaar of de
      gewezen ambtenaar alsnog gevolg geeft aan de betreffende verplichting op grond van dat lid.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel40a
  - number: 40a.4
    text: |-
      Onze Minister kan op grond van bijzondere omstandigheden bepalen, dat de aanspraak op de doorbetaling van
      bezoldiging, niet vervalt maar geheel of ten dele aan anderen dan aan de ambtenaar of de gewezen ambtenaar zal
      worden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel40a
  - number: 40a.5
    text: |-
      Voor zover Onze Minister van de bevoegdheid, bedoeld in het vierde lid, geen gebruik heeft gemaakt, wordt
      de niet uitbetaalde bezoldiging, alsnog aan de ambtenaar of de gewezen ambtenaar uitbetaald, indien het in
      [artikel 32, eerste lid, van de Wet SUWI][ref1], bedoelde oordeel ten gunste van de ambtenaar of de gewezen
      ambtenaar uitvalt.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel32
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '32'
  - number: 40b.1
    text: |-
      Het bevoegd gezag is verplicht zo tijdig mogelijk zodanige maatregelen te treffen en voorschriften te geven als
      redelijkerwijs nodig is, opdat de ambtenaar die in verband met ongeschiktheid ten gevolge van ziekte verhinderd is
      zijn arbeid te verrichten, in staat wordt gesteld de eigen of andere passende arbeid te verrichten.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel40b
  - number: 40b.2
    text: |-
      De maatregelen en voorschriften, bedoeld in het eerste lid, zijn gericht op duurzame reïntegratie in de eigen
      arbeid of in andere passende arbeid in de sector Rijk waarvan de voor die arbeid geldende salarisschaal niet meer
      dan twee schalen lager is dan de salarisschaal die voor de ambtenaar geldt en waarbij de resterende mogelijkheden
      van de ambtenaar volledig worden benut. Indien na overleg tussen het bevoegd gezag en de ambtenaar vaststaat dat
      dergelijke arbeid niet voorhanden is, zullen de maatregelen en voorschriften zich richten op duurzame reïntegratie
      in andere passende arbeid, zo mogelijk binnen een van de overheidssectoren.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel40b
  - number: 40b.3
    text: |-
      Zolang duurzame reïntegratie als bedoeld in het tweede lid niet mogelijk is, stelt het bevoegd gezag de ambtenaar
      in de gelegenheid andere passende arbeid te verrichten.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel40b
  - number: 40b.4
    text: |-
      Uit hoofde van zijn verplichting, bedoeld in het eerste lid, stelt het bevoegd gezag in overeenstemming met de
      ambtenaar een plan van aanpak op als bedoeld in [artikel 25, tweede lid, van de WIA][ref1]. Het plan van aanpak
      wordt met medewerking van de ambtenaar regelmatig geëvalueerd en zo nodig bijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel25
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '25'
  - number: 40b.5
    text: |-
      De ambtenaar die van mening is dat het bevoegd gezag de in het eerste lid bedoelde verplichtingen niet of
      onvoldoende nakomt, legt bij zijn verzoek tot nakoming aan het bevoegd gezag een oordeel van het UWV als bedoeld
      in [artikel 32, derde lid, onderdeel b, van de Wet SUWI][ref1] over. Het bevoegd gezag beslist binnen zes weken op
      het verzoek en deelt daarbij mee tot welke aanpassingen in de reïntegratie-inspanningen het verzoek hem aanleiding
      geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel32
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '32'
  - number: '45.1'
    text: |-
      Bij samenloop van een recht krachtens dit hoofdstuk met een ZW-uitkering, WIA-uitkering, AAOP-uitkering, WW-
      uitkering of bovenwettelijke WW-uitkering, dan wel een daarmee vergelijkbare uitkering, op grond van dezelfde
      dienstbetrekking, wordt deze uitkering in mindering gebracht op dit recht, tenzij het een recht op grond van de
      [artikelen 47][ref1] of [48][ref2] betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel48
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '47'
        hoofdstuk: VI
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '48'
        hoofdstuk: VI
        paragraaf: '5'
  - number: '45.2'
    text: |-
      Indien als gevolg van handelingen of het nalaten van handelingen door de ambtenaar of de gewezen ambtenaar de ZW-
      uitkering, de WIA-uitkering, de AAOP-uitkering, de WW-uitkering of de bovenwettelijke WW-uitkering een vermindering
      ondergaat, dan wel de aanspraak daarop geheel of gedeeltelijk wordt geweigerd, wordt de ZW-uitkering, de WIA-
      uitkering, de AAOP-uitkering, de WW-uitkering of de bovenwettelijke WW-uitkering voor het vaststellen van de
      vermindering, bedoeld in het eerste lid, steeds geacht onverminderd te zijn genoten.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel45
  - number: '45.3'
    text: |-
      Indien de ambtenaar of de gewezen ambtenaar recht heeft op een ZW-uitkering of een WIA-uitkering, is het
      verplichtingen- en sanctieregime van de [ZW][ref1] of de [WIA][ref2] van overeenkomstige toepassing op zijn recht
      krachtens dit hoofdstuk op grond van dezelfde dienstbetrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0019057
  - number: '45.4'
    text: |-
      De inkomsten die de ambtenaar of de gewezen ambtenaar geniet in verband met het verrichten van in het belang van
      zijn genezing door de deskundige persoon of de arbodienst wenselijk geachte arbeid, worden op de aanspraak op
      de doorbetaling van de bezoldiging vermeerderd met de vakantie-uitkering en de eindejaarsuitkering in mindering
      gebracht, voor zover deze inkomsten tezamen met de aanspraak op de doorbetaling van de bezoldiging vermeerderd
      met de vakantie-uitkering en de eindejaarsuitkering of de WIA-uitkering, vermeerderd met de AAOP-uitkering, de
      bezoldiging vermeerderd met de vakantie-uitkering en de eindejaarsuitkering te boven gaan.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel45
  - number: '45.5'
    text: |-
      Inkomsten uit of in verband met arbeid of bedrijf worden op het bedrag, waarop de gewezen ambtenaar ingevolge dit
      hoofdstuk recht heeft, in mindering gebracht, tenzij:
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel45
  - number: 45.5.a)
    text: |-
      de gewezen ambtenaar deze inkomsten reeds vóór het intreden van de ongeschiktheid tot het verrichten van zijn
      arbeid wegens ziekte genoot; en
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel45
  - number: 45.5.b)
    text: de omvang van die arbeid niet is toegenomen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel45
  - number: '46.1'
    text: |-
      Voor zolang de gewezen ambtenaar na beëindiging van de haar ingevolge
      [artikel 33fc, het eerste, tweede of het vierde lid][ref1], toekomende uitkering:


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel33fc
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 33fc
        hoofdstuk: V
        paragraaf: '2'
  - number: 46.1.a)
    text: wegens ziekte ongeschikt is tot werken, dan wel
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel46
  - number: 46.1.b)
    text: |-
      binnen een maand na deze beëindiging ongeschikt wordt tot werken, heeft zij gedurende een tijdvak van 52 weken
      recht op de doorbetaling van de bezoldiging overeenkomstig [artikel 38][ref1]. De termijn van 52 weken wordt
      geacht aan te vangen na beëindiging van voornoemde periode respectievelijk met ingang van de eerste dag waarop zij
      ongeschikt is een naar aard en omvang soortgelijke functie te vervullen.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel38
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '38'
        hoofdstuk: VI
        paragraaf: '3'
  - number: '46.2'
    text: |-
      Ongeschikt tot werken, geheel of gedeeltelijk, in de zin van het eerste lid is de vrouwelijke gewezen ambtenaar die
      als rechtstreeks en objectief medisch vast te stellen gevolg van ziekte of gebreken geheel of gedeeltelijk niet in
      staat is om een naar aard en omvang soortgelijke betrekking als zij vervulde, te vervullen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel46
  - number: '47.1'
    text: |-
      In bijzondere gevallen kan aan de ambtenaar een tegemoetkoming worden toegekend in noodzakelijk gemaakte kosten die
      verband houden met ziekte, welke de ambtenaar voor zichzelf en voor zijn medebelanghebbenden heeft gemaakt:
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel47
  - number: 47.1.a)
    text: indien hierin niet ingevolge een andere regeling kan worden voorzien; en
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel47
  - number: 47.1.b)
    text: deze kosten redelijkerwijs niet voor zijn rekening kunnen blijven.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel47
  - number: '47.2'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan omtrent het bepaalde in het eerste lid nadere
      regels vaststellen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel47
  - number: '48.1'
    text: |-
      Indien de ziekte, uit hoofde waarvan de ambtenaar of de gewezen ambtenaar ongeschikt is zijn arbeid te verrichten,
      voortvloeit uit een dienstongeval of een door het verrichten van zijn arbeid opgelopen beroepsziekte, worden
      hem vergoed de naar het oordeel van Onze Minister noodzakelijk gemaakte kosten van geneeskundige behandeling of
      verzorging die voor rekening van de ambtenaar blijven.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel48
  - number: '48.2'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan omtrent het bepaalde in het eerste lid nadere
      regels vaststellen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel48
  - number: 48a.1
    text: |-
      Het bedrag van de bezoldiging of de laatstgenoten bezoldiging, bedoeld in de [artikelen 37][ref1],
      [37a, derde lid][ref2], en [38][ref3], en het bedrag van de eindejaarsuitkering, bedoeld in de genoemde artikelen,
      worden in voorkomende gevallen gewijzigd overeenkomstig een algemene wijziging van het salaris respectievelijk
      de eindejaarsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel37a
      [ref3]: https://wetten.overheid.nl/BWBR0001950#Artikel38
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '37'
        hoofdstuk: VI
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 37a
        hoofdstuk: VI
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0001950
        artikel: '38'
        hoofdstuk: VI
        paragraaf: '3'
  - number: 48a.2
    text: |-
      Indien de ambtenaar in het genot is van een toelage als bedoeld in [artikel 17][ref1], [17a][ref2], [18][ref3]
      of [18a van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref4], worden die toelagen voor de
      vaststelling van het in het eerste lid bedoelde bedrag, vastgesteld op het bedrag dat hem ingevolge de voor hem
      geldende werktijdregeling zou zijn toegekend indien hij niet ongeschikt was geworden tot het verrichten van zijn
      arbeid wegens ziekte. Indien de vaststelling van het bedrag op deze wijze niet mogelijk is, dan wordt dit bedrag
      vastgesteld op het gemiddelde van het bedrag dat de ambtenaar per maand aan die toelagen heeft genoten over de drie
      kalendermaanden voorafgaande aan:


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel17a
      [ref3]: https://wetten.overheid.nl/BWBR0003630#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0003630#Artikel18a
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0003630
        artikel: 17a
      - id: ref3
        bwb_id: BWBR0003630
        artikel: '18'
      - id: ref4
        bwb_id: BWBR0003630
        artikel: 18a
  - number: 48a.2.a)
    text: de kalendermaand waarin de ambtenaar ongeschikt is geworden tot het verrichten van zijn arbeid wegens ziekte; of
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel48a
  - number: 48a.2.b)
    text: |-
      de kalendermaand waarin de gewezen ambtenaar wegens ziekte ongeschikt is geworden een naar aard en omvang
      soortgelijke betrekking te vervullen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel48a
  - number: 48a.3
    text: |-
      Indien ook voor het overige de bezoldiging niet in een vast bedrag per maand kan worden uitgedrukt, wordt gerekend
      met het bedrag dat gemiddeld per maand is toegekend over de drie kalendermaanden voorafgaande aan de maand waarin:
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel48a
  - number: 48a.3.a)
    text: de ambtenaar ongeschikt is geworden tot het verrichten van zijn arbeid wegens ziekte;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel48a
  - number: 48a.3.b)
    text: |-
      de gewezen ambtenaar wegens ziekte ongeschikt is geworden een naar aard en omvang soortgelijke betrekking te
      vervullen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel48a
  - number: 48a.4
    text: |-
      Voor zover de ambtenaar of de gewezen ambtenaar geen drie kalendermaanden in dienst is geweest, wordt voor
      de toepassing van het tweede en derde lid gerekend met het bedrag dat hem gemiddeld aan bezoldiging per maand
      is toegekend over het tijdvak waarin hij in dienst is geweest vóór het ontstaan van de ongeschiktheid tot het
      verrichten van zijn arbeid respectievelijk tot het vervullen van een naar aard en omvang soortgelijke betrekking.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel48a
  - number: '49'
    text: |-
      Tenzij anders is bepaald, zijn de bepalingen van dit hoofdstuk niet van toepassing in de periode van 15 april 2013
      tot en met 31 december 2015, onverminderd [artikel 49yy][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49yy
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49yy
        hoofdstuk: VIIbis
        paragraaf: '6'
  - number: 49a.1
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan regels vaststellen omtrent de te volgen procedure
      bij reorganisaties en het herplaatsen van ambtenaren.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49a
  - number: 49a.2
    text: Onze Minister kan nadere procedures en regels vaststellen omtrent reorganisaties en het herplaatsen van ambtenaren.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49a
  - number: 49b.1
    text: Bij een reorganisatie zijn de bepalingen van dit hoofdstuk van toepassing.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49b
  - number: 49b.2
    text: 'Onder reorganisatie als bedoeld in het eerste lid wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49b
  - number: 49b.2.a
    text: |-
      iedere wijziging van de organisatiestructuur, de omvang of de taakinhoud van een ministerie of een onderdeel
      daarvan, waaraan personele consequenties zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49b
  - number: 49b.2.b
    text: |-
      iedere wijziging van de organisatiestructuur, de omvang of de taakinhoud van de Algemene Rekenkamer, de Hoge Raad
      van Adel, het Kabinet van de Koning, de Kanselarij der Nederlandse Orden, de Nationale ombudsman, het secretariaat
      van de commissie van toezicht op de inlichtingen- en veiligheidsdiensten, de Raad van State of een onderdeel
      daarvan, waaraan personele consequenties zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49b
  - number: 49b.3
    text: |-
      De bepalingen van dit hoofdstuk zijn van overeenkomstige toepassing op de overgang van de ambtenaar naar een
      private onderneming of zelfstandig bestuursorgaan in verband met de privatisering of verzelfstandiging van het
      dienstonderdeel van het ministerie waarbij de ambtenaar werkzaam is, tenzij bij algemeen verbindend voorschrift
      anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49b
  - number: 49c
    text: |-
      Indien de bepalingen in dit hoofdstuk worden toegepast op de Algemene Rekenkamer, de Hoge Raad van Adel, het
      Kabinet van de Koning, de Kanselarij der Nederlandse Orden, de Nationale ombudsman, het secretariaat van de
      commissie van toezicht op de inlichtingen- en veiligheidsdiensten en de Raad van State, dient voor Onze Minister
      telkens te worden gelezen het college van de Algemene Rekenkamer, de Voorziter van de Hoge Raad van Adel, de
      directeur van het Kabinet van de Koning, de Kanselier der Nederlandse Orden, de Nationale ombudsman, de voorzitter
      van de commissie van toezicht op de inlichtingen- en veiligheidsdiensten of de vice-president van de Raad van
      State.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49c
  - number: 49ca.1
    text: |-
      Door of namens Onze Minister worden de centrales van verenigingen van ambtenaren tijdig geïnformeerd over een
      voorgenomen besluit tot een reorganisatie.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49ca
  - number: 49ca.2
    text: |-
      Door of namens Onze Minister worden de betrokken ondernemingsraden tijdig geïnformeerd over een voorgenomen besluit
      tot een reorganisatie.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49ca
  - number: 49d
    text: |-
      De ambtenaar die is aangesteld in tijdelijke dienst voor een proeftijd en de ambtenaar aangesteld in vaste dienst,
      wier functie in verband met een reorganisatie is opgeheven, worden aangewezen als te herplaatsen ambtenaar, hierna
      te noemen: herplaatsingskandidaat.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49d
  - number: 49e.1
    text: |-
      Van overtolligheid is sprake indien binnen het te reorganiseren ministerie, het Kabinet van de Koning, de Algemene
      Rekenkamer, de Hoge Raad van Adel, de Kanselarij der Nederlandse Orden, de Nationale ombudsman, het secretariaat
      van de commissie van toezicht op de inlichtingen- en veiligheidsdiensten, de Raad van State, of een onderdeel
      daarvan, meer ambtenaren een vergelijkbare of uitwisselbare functie vervullen en het totale aantal van die functies
      zodanig wordt verminderd dat onvoldoende van die functies voor de betrokken ambtenaren resteren.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49e
  - number: 49e.2
    text: |-
      De ambtenaar die is aangesteld in tijdelijke dienst voor een proeftijd en de ambtenaar aangesteld in vaste dienst,
      die in verband met een reorganisatie overtollig zijn, worden aangewezen als herplaatsingskandidaat, waarbij de
      ambtenaar die het geringste aantal jaren in overheidsdienst heeft doorgebracht het eerst als herplaatsingskandidaat
      wordt aangewezen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49e
  - number: 49e.3
    text: |-
      Voor de berekening van het aantal in overheidsdienst doorgebrachte jaren wordt mede in aanmerking genomen
      tijd gewijd aan de verzorging van tot het huishouden van de ambtenaar behorende 0–4 jarige eigen, stief- of
      pleegkinderen, tot een maximum van in totaal zes jaren.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49e
  - number: 49e.4
    text: Onze Minister kan van de volgorde in het tweede lid afwijken indien zulks naar zijn oordeel noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49e
  - number: 49f
    text: De ambtenaar wordt omtrent zijn aanwijzing als herplaatsingskandidaat zo spoedig mogelijk geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49f
  - number: 49g.1
    text: |-
      Onverminderd het gestelde in [artikel 96, eerste lid][ref1] is Onze Minister verplicht om de ambtenaar binnen een
      periode van 18 maanden, te rekenen vanaf het moment dat de ambtenaar is aangewezen als herplaatsingskandidaat, ten
      minste één passende functie aan te bieden.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel96
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49g
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '96'
        hoofdstuk: X
  - number: 49g.2
    text: 'Onze Minister kan de termijn als bedoeld in het eerste lid verkorten indien:'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49g
  - number: 49g.2.a
    text: |-
      de herplaatsingskandidaat heeft geweigerd te voldoen aan een hem op grond van dit hoofdstuk opgelegde verplichting,
      of;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49g
  - number: 49g.2.b
    text: |-
      reeds eerder in overleg met de ambtenaar binnen de termijn kan worden vastgesteld dat er geen mogelijkheden zijn om
      de herplaatsingskandidaat te herplaatsen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49g
  - number: 49g.3
    text: |-
      Onze Minister kan de termijn verlengen of opschorten, indien de omstandigheden naar zijn oordeel daartoe aanleiding
      geven.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49g
  - number: 49g.4
    text: |-
      De ambtenaar wordt gelijktijdig met zijn aanwijzing als herplaatsingskandidaat geïnformeerd over de aanvang en het
      einde van de termijn als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49g
  - number: 49g.5
    text: |-
      Door Onze Minister wordt de herplaatsingskandidaat geïnformeerd over het verkorten, verlengen of opschorten van de
      termijn als bedoeld in het tweede en het derde lid.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49g
  - number: 49g.6
    text: |-
      Op verzoek van de herplaatsingskandidaat wordt de termijn, bedoeld in het eerste lid, met maximaal een
      jaar verlengd ingeval de herplaatsingskandidaat bij het einde van de termijn, bedoeld in het eerste
      lid, in combinatie met de duur van de bovenwettelijke uitkering bij werkloosheid, de pensioengerechtigde
      leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], nog niet heeft bereikt
      en door deze verlenging recht ontstaat op een bovenwettelijke uitkering bij werkloosheid, op grond van
      [artikel 2, tweede lid, van het Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Rijk][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0008114#Artikel2
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49g
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0008114
        artikel: '2'
  - number: 49h.1
    text: |-
      Van een passende functie als bedoeld in [artikel 49g][ref1] is sprake indien de herplaatsingskandidaat naar het
      oordeel van Onze Minister beschikt over de kennis en kunde die noodzakelijk worden geacht om de functie naar
      behoren te kunnen uitoefenen danwel indien de herplaatsingskandidaat naar het oordeel van Onze Minister binnen
      redelijke termijn om-, her- of bijgeschoold kan worden, en deze functie hem in verband met zijn persoonlijkheid,
      zijn omstandigheden en de voor hem bestaande vooruitzichten, redelijkerwijs kan worden opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49g
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49h
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49g
        hoofdstuk: VII
  - number: 49h.2
    text: |-
      Bij het eerste lid geldt de beperking dat uitsluitend sprake kan zijn van een passende functie indien de voor
      de functie geldende salarisschaal niet meer dan twee schalen lager is dan de salarisschaal die geldt voor de
      herplaatsingskandidaat.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49h
  - number: 49h.3
    text: |-
      Onze Minister kan de herplaatsingskandidaat plaatsen op een functie waarvan de geldende salarisschaal meer dan twee
      schalen lager is dan de salarisschaal die geldt voor de herplaatsingskandidaat indien er bijzondere omstandigheden
      zijn die zulks rechtvaardigen en indien de herplaatsingskandidaat daarmee instemt.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49h
  - number: 49h.4
    text: |-
      Bij een herplaatsing met toepassing van het derde lid is [artikel 49n][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49n
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49h
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49n
        hoofdstuk: VII
  - number: 49i
    text: |-
      Onze Minister kan de naar zijn oordeel meest geschikte herplaatsingskandidaat, voor wie de functie als passend
      wordt aangemerkt, herplaatsen in die functie.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49i
  - number: 49j.1
    text: |-
      Onverminderd het bepaalde in artikel 49*g*, eerste lid, is de herplaatsingskandiaat verplicht al het mogelijke te
      doen om een passende functie te vinden.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49j
  - number: 49j.2
    text: De herplaatsingskandidaat is verplicht een passende functie te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49j
  - number: 49l.1
    text: |-
      De herplaatsingskandidaat die heeft geweigerd te voldoen aan een hem op grond van dit hoofdstuk opgelegde
      verplichting, kan in verband daarmee ontslag worden verleend.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49l
  - number: 49l.2
    text: Bij een ontslagverlening op grond van het eerste lid wordt een opzeggingstermijn van drie maanden in acht genomen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49l
  - number: 49m.1
    text: |-
      Indien de reistijd voor woon-werkverkeer door een wijziging van de plaats van tewerkstelling van de ambtenaar als
      gevolg van een reorganisatie met meer dan 15 minuten per enkele reis toeneemt, wordt deze extra reistijd, voor
      zover deze meer is dan 15 minuten, gedurende een jaar als werktijd aangemerkt.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49m
  - number: 49m.2
    text: |-
      Gedurende het tweede, derde en vierde jaar wordt respectievelijk 75%, 50% en 25% van de in het eerste lid bedoelde
      extra reistijd als werktijd aangemerkt.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49m
  - number: 49m.3
    text: |-
      Voor de ambtenaar die de in het eerste lid bedoelde aanspraak heeft, en voor wie binnen twee jaar als gevolg van
      reorganisatie opnieuw de plaats van tewerkstelling wijzigt, wordt bij de berekening van de extra reistijd uitgegaan
      van de totale toename ten opzichte van de reistijd zoals die was voor de eerste wijziging.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49m
  - number: 49m.4
    text: |-
      Indien de tweede toename van de reistijd meer dan 15 minuten bedraagt ten opzichte van de reistijd zoals die was na
      de eerste wijziging, wordt de in het eerste en tweede lid genoemde termijn, gedurende welke de aanspraak bestaat,
      opnieuw gestart.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49m
  - number: 49m.5
    text: |-
      De ambtenaar voor wie binnen twee jaar voor de tweede maal de plaats van tewerkstelling als gevolg van een
      reorganisatie wijzigt en voor wie pas na de tweede wijziging de toename van de reistijd meer dan 15 minuten
      bedraagt, heeft aanspraak op de voorziening, bedoeld in het eerste en tweede lid vanaf de tweede wijziging.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49m
  - number: 49m.6
    text: |-
      Voor de bepaling van de reistijd wordt uitgegaan van de route met de minste reistijd, berekend met de ANWB-
      routeplanner.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49m
  - number: 49n.1
    text: |-
      De ambtenaar die in verband met zijn herplaatsing of plaatsing in een passende functie in opdracht van Onze
      Minister is verhuisd, wordt eenmalig een bedrag toegekend van € 11.637,69 bruto ter tegemoetkoming in de daarmee
      verband houdende kosten.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49n
  - number: 49n.2
    text: |-
      In de gevallen waarin de ambtenaar en zijn echtgenoot beiden in aanmerking komen voor het bedrag bedoeld in het
      eerste lid ontvangt elk de helft daarvan.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49n
  - number: 49n.3
    text: |-
      Het bedrag bedoeld in het eerste lid wordt niet toegekend, indien de verhuizing niet heeft plaatsgevonden binnen
      twee jaren nadat de opdracht om te verhuizen is gegeven.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49n
  - number: 49o
    text: |-
      Onze Minister kan de herplaatsingskandidaat een premie in het vooruitzicht stellen ter grootte van maximaal
      drie maandsalarissen indien aan hem binnen 18 maanden nadat hij is aangewezen als herplaatsingskandidaat op zijn
      aanvraag eervol ontslag wordt verleend.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49o
  - number: 49p.1
    text: |-
      De herplaatsingskandidaat aan wie eervol ontslag op zijn aanvraag is verleend wegens de aanvaarding van een functie
      kan, onverminderd het bepaalde in artikel 49*o*, een salarissuppletie worden toegekend indien het in de nieuwe
      functie genoten salaris lager is dan het salaris in de oorspronkelijke functie.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49p
  - number: 49p.2
    text: |-
      De suppletie als bedoeld in het eerste lid wordt toegekend gedurende maximaal 5 jaar en is ten hoogste gelijk aan
      het verschil tussen het in de oorspronkelijke functie genoten salaris en het salaris in de nieuwe functie.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49p
  - number: 49p.3
    text: |-
      Onder door Onze Minister te stellen voorwaarden kan het recht op suppletie op aanvraag van de
      herplaatsingskandidaat worden afgekocht.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49p
  - number: 49q
    text: |-
      Onze Minister kan de [artikelen 49j, tweede lid][ref1], [49k][ref2], [49n][ref3] en [49p][ref4] toepassen op de
      ambtenaar wiens functie binnen afzienbare tijd wordt opgeheven of die als overtollig zal worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49j
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel49k
      [ref3]: https://wetten.overheid.nl/BWBR0001950#Artikel49n
      [ref4]: https://wetten.overheid.nl/BWBR0001950#Artikel49p
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49q
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49j
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 49k
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0001950
        artikel: 49n
        hoofdstuk: VII
      - id: ref4
        bwb_id: BWBR0001950
        artikel: 49p
        hoofdstuk: VII
  - number: 49r
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen, wordt verstaan onder: - *begeleidingstraject:* het
      begeleidingstraject van werk naar werk, bedoeld in [artikel 49y, vijfde lid][ref1], bij de uitvoering van het VWNW-
      plan;
        - *commissie:* de commissie, bedoeld in [artikel 49uu, eerste lid][ref2];
        - *plaats van tewerkstelling:* de plaats van tewerkstelling, bedoeld in
      [artikel 2, eerste lid, onderdeel d, van het Verplaatsingskostenbesluit 1989][ref3];
        - *reorganisatie:* iedere wijziging van de organisatiestructuur, de omvang of de taakinhoud van een onderdeel van
      de sector Rijk, waaraan personele consequenties zijn verbonden;
        - *verplichte VWNW-kandidaat:* de ambtenaar 1°. die krachtens [artikel 49w, tweede lid][ref4], als overtollig
      is aangewezen, 2°. van wie de functie in verband met een reorganisatie is opgeheven, 3°. ten aanzien van
      wie het bevoegd gezag heeft besloten dat in redelijkheid niet kan worden verlangd dat hij zich zal voegen
      in zijn verplaatsing over een aanmerkelijke afstand tengevolge van een besluit tot wijziging van de plaats
      van tewerkstelling, of 4°. die in de periode van 1 januari 2012 tot en met 14 april 2013 is aangewezen als
      herplaatsingskandidaat en die vóór 1 juli 2013 aan het bevoegd gezag kenbaar heeft gemaakt als verplichte VWNW-
      kandidaat gebruik te gaan maken van het begeleidingstraject;
        - *VWNW:* van werk naar werk;
        - *vrijwillige fase:* de vrijwillige fase, bedoeld in [artikel 49s, eerste lid][ref5], waarin een onderdeel van de
      sector Rijk zich bevindt;
        - *vrijwillige VWNW-kandidaat:* de ambtenaar, die deel uitmaakt van een aangewezen groep als bedoeld in artikel
      49s, tweede lid, en aanvangt met de uitvoering van het VWNW-plan;
        - *VWNW-kandidaat:* de vrijwillige VWNW-kandidaat of de verplichte VWNW-kandidaat;
        - *VWNW-onderzoek:* het VWNW-onderzoek, bedoeld in [artikel 49x][ref6];
        - *VWNW-plan:* het VWNW-plan, bedoeld in [artikel 49y][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49y
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel49uu
      [ref3]: https://wetten.overheid.nl/BWBR0004630#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0001950#Artikel49w
      [ref5]: https://wetten.overheid.nl/BWBR0001950#Artikel49s
      [ref6]: https://wetten.overheid.nl/BWBR0001950#Artikel49x
      [ref7]: https://wetten.overheid.nl/BWBR0001950#Artikel49y
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49r
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49y
        hoofdstuk: VIIbis
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 49uu
        hoofdstuk: VIIbis
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0004630
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0001950
        artikel: 49w
        hoofdstuk: VIIbis
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0001950
        artikel: 49s
        hoofdstuk: VIIbis
        paragraaf: '1'
      - id: ref6
        bwb_id: BWBR0001950
        artikel: 49x
        hoofdstuk: VIIbis
        paragraaf: '2'
      - id: ref7
        bwb_id: BWBR0001950
        artikel: 49y
        hoofdstuk: VIIbis
        paragraaf: '2'
  - number: 49s.1
    text: |-
      Een voorgenomen besluit tot een belangrijke reorganisatie wordt voorafgegaan door een vrijwillige fase,
      onverminderd [artikel 49u][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49u
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49s
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49u
        hoofdstuk: VIIbis
        paragraaf: '1'
  - number: 49s.2
    text: 'Het bevoegd gezag besluit tot een vrijwillige fase in de volgende gevallen:'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49s
  - number: 49s.2.a
    text: |-
      om te voorkomen dat op termijn ambtenaren als verplichte VWNW-kandidaten worden aangemerkt omdat hun functie wordt
      opgeheven,
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49s
  - number: 49s.2.b
    text: |-
      om te voorkomen dat op termijn overtolligheid ontstaat binnen een door het bevoegd gezag aangewezen groep
      ambtenaren die een uitwisselbare functie vervullen indien het totale aantal van die functies zodanig wordt
      verminderd dat onvoldoende van die functies resteren voor de betrokken ambtenaren, of
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49s
  - number: 49s.2.c
    text: |-
      bij een besluit tot wijziging van de plaats van tewerkstelling voor een door het bevoegd gezag aangewezen groep
      ambtenaren naar een locatie die ten opzichte van de oorspronkelijke plaats van tewerkstelling is gelegen op een
      reisafstand van meer dan een half uur per enkele reis.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49s
  - number: 49s.3
    text: |-
      Een aangewezen groep ambtenaren als bedoeld in het tweede lid, bestaat uit ambtenaren die zijn aangesteld in
      tijdelijke dienst voor een proeftijd en uit ambtenaren die zijn aangesteld in vaste dienst.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49s
  - number: 49s.4
    text: |-
      Het bevoegd gezag besluit wanneer de vrijwillige fase begint en eindigt. De duur van de vrijwillige fase kan door
      het bevoegd gezag worden verlengd of verkort.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49s
  - number: 49s.5
    text: |-
      Gedurende de vrijwillige fase neemt een aangewezen groep ambtenaren als bedoeld in het tweede lid, deel aan een
      VWNW-onderzoek.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49s
  - number: 49t.1
    text: |-
      De centrales van verenigingen van ambtenaren, bedoeld in [artikel 113][ref1] en [artikel 118][ref2], en de
      betrokken ondernemingsraden worden door het bevoegd gezag tijdig geïnformeerd over een voorgenomen besluit tot
      aanvang van een vrijwillige fase.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel113
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel118
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49t
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '113'
        hoofdstuk: XI
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '118'
        hoofdstuk: XI
        paragraaf: '2'
  - number: 49t.2
    text: |-
      De contouren van de voorgenomen organisatieverandering of de voorgenomen wijziging van de plaats van tewerkstelling
      worden aan de betrokken ondernemingsraden ter advisering voorgelegd.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49t
  - number: 49t.3
    text: |-
      De centrales van verenigingen van ambtenaren worden, na advies door de betrokken ondernemingsraden, door
      het bevoegd gezag in de gelegenheid gesteld advies uit te brengen over welke groep ambtenaren als bedoeld
      in [artikel 49s, tweede lid][ref1], wordt aangewezen en over duur en over de verlenging of verkorting van de
      vrijwillige fase. Van dit advies kan slechts gemotiveerd worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49s
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49t
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49s
        hoofdstuk: VIIbis
        paragraaf: '1'
  - number: 49u.1
    text: |-
      In afwijking van [artikel 49s][ref1], kan het bevoegd gezag afzien van een vrijwillige fase indien de
      omstandigheden daartoe aanleiding geven, nadat het bevoegd gezag de centrales van verenigingen van ambtenaren in de
      gelegenheid heeft gesteld daarover advies uit te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49s
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49u
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49s
        hoofdstuk: VIIbis
        paragraaf: '1'
  - number: 49u.2
    text: |-
      Een geschil tussen het bevoegd gezag en de centrales van verenigingen van ambtenaren naar aanleiding van het
      advies, bedoeld in het eerste lid, wordt door of namens Onze Minister voor Wonen en Rijksdienst voorgelegd aan de
      Sectorcommissie overleg rijkspersoneel, bedoeld in [artikel 105][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel105
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49u
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '105'
        hoofdstuk: XI
        paragraaf: '1'
  - number: 49u.3
    text: |-
      Het geschil, bedoeld in het tweede lid, wordt door of namens Onze Minister voor Wonen en Rijksdienst of
      door de Sectorcommissie overleg rijkspersoneel voorgelegd aan de Advies- en Arbitragecommissie, bedoeld in
      [artikel 110g][ref1], indien hierover in het overleg geen overeenstemming is bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel110g
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49u
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 110g
        hoofdstuk: XI
        paragraaf: '1'
  - number: 49v.1
    text: |-
      Indien na afloop van de vrijwillige fase sprake is van overtolligheid of van ambtenaren van wie de functie wordt
      opgeheven, zijn de regels omtrent de te volgen procedure bij reorganisaties die krachtens [artikel 49a][ref1] zijn
      vastgesteld, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49a
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49v
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49a
        hoofdstuk: VII
  - number: 49v.2
    text: |-
      Door het bevoegd gezag worden de centrales van verenigingen van ambtenaren tijdig geïnformeerd over een voorgenomen
      besluit tot een reorganisatie.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49v
  - number: 49v.3
    text: |-
      Door het bevoegd gezag worden de betrokken ondernemingsraden tijdig geïnformeerd over een voorgenomen besluit tot
      een reorganisatie.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49v
  - number: 49w.1
    text: |-
      Van overtolligheid is sprake indien binnen het te reorganiseren onderdeel van de sector Rijk, meer ambtenaren een
      uitwisselbare functie vervullen en het totale aantal van die functies zodanig wordt verminderd dat onvoldoende van
      die functies voor de betrokken ambtenaren resteren.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49w
  - number: 49w.2
    text: |-
      De overtolligheid wordt door het bevoegd gezag vastgesteld per leeftijdsgroep binnen de categorie uitwisselbare
      functies. Hierbij wordt het eerst als overtollig aangewezen de ambtenaar die het geringste aantal jaren
      overheidswerknemer is als bedoeld in [artikel 2, eerste lid, van de Wet privatisering ABP][ref1]. In bijzondere
      gevallen kan het bevoegd gezag van deze volgorde afwijken.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel2
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49w
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '2'
  - number: 49w.3
    text: |-
      De leeftijdsgroepen, bedoeld in het tweede lid, omvatten de leeftijd van 15 tot en met 24 jaar, 25 tot en met 34
      jaar, 35 tot en met 44 jaar, 45 tot en met 54 jaar, en 55 jaar en ouder.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49w
  - number: 49w.4
    text: Om te bepalen tot welke leeftijdsgroep een ambtenaar behoort, stelt het bevoegd gezag een peildatum vast.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49w
  - number: 49w.5
    text: |-
      Ambtenaren van wie de aanstelling binnen 26 weken na de peildatum eindigt blijven buiten beschouwing bij het
      vaststellen van overtolligheid.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49w
  - number: 49w.6
    text: |-
      Bij regeling van Onze Minister voor Wonen en Rijksdienst worden nadere regels gesteld over de toepassing van dit
      artikel.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49w
  - number: 49x.1
    text: |-
      De ambtenaar die deel uitmaakt van een aangewezen groep als bedoeld in [artikel 49s, tweede lid][ref1], en de
      verplichte VWNW-kandidaat nemen deel aan een VWNW-onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49s
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49x
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49s
        hoofdstuk: VIIbis
        paragraaf: '1'
  - number: 49x.2
    text: |-
      Van een VWNW-onderzoek kan gedurende de vrijwillige fase worden afgezien indien de omstandigheden daartoe
      aanleiding geven en het bevoegd gezag en de betrokken ambtenaar die deel uitmaakt van een aangewezen groep als
      bedoeld in [artikel 49s, tweede lid][ref1], daarmee instemmen.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49s
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49x
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49s
        hoofdstuk: VIIbis
        paragraaf: '1'
  - number: 49x.3
    text: |-
      Het VWNW-onderzoek richt zich op de wensen en ontwikkelmogelijkheden van de ambtenaar die deelneemt aan het
      onderzoek en diens mogelijkheden voor het vinden van een passende functie in of buiten de sector Rijk.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49x
  - number: 49x.4
    text: Het VWNW-onderzoek vindt plaats onder onafhankelijke professionele begeleiding.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49x
  - number: 49x.5
    text: Naar aanleiding van het VWNW-onderzoek wordt een advies uitgebracht aan de ambtenaar en het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49x
  - number: 49x.6
    text: |-
      Uit het advies naar aanleiding van het VWNW-onderzoek volgt welke loopbaanbegeleiding de ambtenaar nodig heeft en
      of scholing dan wel het tijdelijk verrichten van andere werkzaamheden nodig is.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49x
  - number: 49x.7
    text: |-
      De ambtenaar met een aanstelling in tijdelijke dienst als bedoeld in
      [artikel 6, tweede lid, onder b tot en met f][ref1], waarvan de aanstelling afloopt tijdens de vrijwillige fase,
      bedoeld in [artikel 49s, eerste lid][ref2], of waarvan de aanstelling eindigt binnen 26 weken na de peildatum,
      bedoeld in [artikel 49w, vijfde lid][ref3], kan deelnemen aan een VWNW-onderzoek. Het derde tot en met het zesde
      lid, zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel49s
      [ref3]: https://wetten.overheid.nl/BWBR0001950#Artikel49w
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49x
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 49s
        hoofdstuk: VIIbis
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0001950
        artikel: 49w
        hoofdstuk: VIIbis
        paragraaf: '1'
  - number: 49x.8
    text: |-
      Indien de ambtenaar of het bevoegd gezag zich niet kan vinden in het advies naar aanleiding van het VWNW-onderzoek,
      kan op verzoek van de ambtenaar of het bevoegd gezag binnen twee weken nadat het advies is vastgesteld, onder
      onafhankelijke professionele begeleiding een nieuw advies worden uitgebracht.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49x
  - number: 49x.9
    text: |-
      Bij regeling van Onze Minister voor Wonen en Rijksdienst kunnen nadere regels worden gesteld over de toepassing van
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49x
  - number: 49y.1
    text: |-
      Het bevoegd gezag stelt na overleg met de betrokken ambtenaar op basis van het advies, bedoeld in
      [artikel 49x, vijfde lid][ref1], of een nieuw advies, bedoeld artikel 49x, achtste lid, een VWNW-plan vast.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49x
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49y
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49x
        hoofdstuk: VIIbis
        paragraaf: '2'
  - number: 49y.2
    text: |-
      Binnen twee weken na de datum van de vaststelling van het VWNW-plan maakt de ambtenaar, die deel uitmaakt van een
      aangewezen groep als bedoeld in [artikel 49s, tweede lid][ref1], aan het bevoegd gezag kenbaar of hij het plan
      gaat uitvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49s
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49y
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49s
        hoofdstuk: VIIbis
        paragraaf: '1'
  - number: 49y.3
    text: |-
      Met ingang van de datum waarop de ambtenaar, bedoeld in het tweede lid, aanvangt met de uitvoering van het plan,
      heeft hij als vrijwillige VWNW-kandidaat aanspraak op het begeleidingstraject en de voorzieningen, bedoeld in
      [paragraaf 3][ref1] van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#HoofdstukVIIbis
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49y
    references:
      - id: ref1
        bwb_id: BWBR0001950
        hoofdstuk: VIIbis
        paragraaf: '3'
  - number: 49y.4
    text: Het bevoegd gezag begeleidt de VWNW-kandidaat bij de uitvoering van het VWNW-plan.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49y
  - number: 49y.5
    text: 'Het bevoegd gezag kan ten behoeve van het begeleidingstraject de volgende faciliteiten toekennen in het VWNW-plan:'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49y
  - number: 49y.5.a
    text: |-
      de voor de uitvoering van het VWNW-plan benodigde opleiding, waarbij verlof met behoud van bezoldiging wordt
      verleend voor de tijd die is gemoeid met het volgen van die opleiding,
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49y
  - number: 49y.5.b
    text: het tijdelijk verrichten van andere werkzaamheden of het volgen van een stage om werkervaring op te doen,
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49y
  - number: 49y.5.c
    text: de voor de uitvoering van het VWNW-plan benodigde loopbaanbegeleiding en de wijze waarop daarin wordt voorzien, en
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49y
  - number: 49y.5.d
    text: overige voorzieningen die voor de uitvoering van het VWNW-plan nodig zijn.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49y
  - number: 49y.6
    text: |-
      In het VWNW-plan worden naast de faciliteiten, bedoeld in het vijfde lid, het zoekbereik voor een andere functie en
      voor de vrijwillige VWNW-kandidaat de datum waarop de uitvoering van het VWNW-plan aanvangt, vastgelegd.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49y
  - number: 49y.7
    text: Het bevoegd gezag kan het VWNW-plan herzien indien bijzondere omstandigheden daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49y
  - number: 49z.1
    text: De VWNW-kandidaat voert het VWNW-plan uit.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49z
  - number: 49z.2
    text: |-
      De VWNW-kandidaat is verplicht een aangeboden passende functie te aanvaarden, binnen het voor hem geldende
      plaatsingsbereik, bedoeld in [artikel 49cc, eerste of tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49cc
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49z
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49cc
        hoofdstuk: VIIbis
        paragraaf: '2'
  - number: 49z.3
    text: |-
      Er is sprake van een aangeboden functie indien acceptatie van de functie door de VWNW-kandidaat leidt tot plaatsing
      in de functie.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49z
  - number: 49z.4
    text: 'Ontslag kan worden verleend aan de verplichte VWNW-kandidaat die heeft geweigerd te voldoen aan:'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49z
  - number: 49z.4.a
    text: de verplichting, bedoeld in het tweede lid, of
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49z
  - number: 49z.4.b
    text: een hem op grond van dit hoofdstuk opgelegde andere verplichting.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49z
  - number: 49z.5
    text: Bij ontslagverlening op grond van het vierde lid wordt een opzegtermijn van drie maanden in acht genomen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49z
  - number: 49z.6
    text: |-
      Voor de vrijwillige VWNW-kandidaat die drie maal heeft geweigerd te voldoen aan de verplichting, bedoeld in het
      tweede lid, vervalt zijn status van vrijwillige VWNW-kandidaat en vervalt zijn aanspraak op het begeleidingstraject
      en op de voorzieningen, bedoeld in [paragraaf 3][ref1] van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#HoofdstukVIIbis
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49z
    references:
      - id: ref1
        bwb_id: BWBR0001950
        hoofdstuk: VIIbis
        paragraaf: '3'
  - number: 49aa
    text: |-
      Van een passende functie is sprake indien de VWNW-kandidaat naar het oordeel van het bevoegd gezag beschikt over
      de kennis en kunde die noodzakelijk worden geacht om de functie naar behoren te kunnen uitoefenen, dan wel indien
      de VWNW-kandidaat naar het oordeel van het bevoegd gezag binnen redelijke termijn om-, her- of bijgeschoold kan
      worden, en deze functie hem in verband met zijn persoonlijkheid, zijn omstandigheden en de voor hem bestaande
      vooruitzichten, redelijkerwijs kan worden opgedragen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49aa
  - number: 49bb.1
    text: |-
      Het begeleidingstraject bestaat uit drie elkaar opvolgende perioden van elk zes maanden, met dien verstande dat
      bij een aanstelling in tijdelijke dienst het begeleidingstraject bestaat uit maximaal de resterende periode van
      die aanstelling.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49bb
  - number: 49bb.2
    text: |-
      De eerste periode van het begeleidingstraject vangt voor de verplichte VWNW-kandidaat aan met ingang van de
      datum van vaststelling van het VWNW-plan, met dien verstande dat voor de verplichte VWNW-kandidaat, bedoeld in
      [artikel 49r, onderdeel e, onder 1° en 2°][ref1], het begeleidingstraject niet eerder aanvangt dan nadat hij niet
      meer met zijn functie wordt belast.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49r
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49bb
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49r
        hoofdstuk: VIIbis
        paragraaf: '1'
  - number: 49bb.3
    text: |-
      Voor de ambtenaar, die deel uitmaakt van een aangewezen groep als bedoeld in [artikel 49s, tweede lid][ref1], vangt
      het begeleidingstraject aan vanaf de datum waarop hij aanvangt met de uitvoering van het plan.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49s
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49bb
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49s
        hoofdstuk: VIIbis
        paragraaf: '1'
  - number: 49bb.4
    text: |-
      De vrijwillige VWNW-kandidaat kan nadat de vrijwillige fase is geëindigd, gebruik blijven maken van het
      begeleidingstraject en de voorzieningen, bedoeld in [paragraaf 3][ref1] van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#HoofdstukVIIbis
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49bb
    references:
      - id: ref1
        bwb_id: BWBR0001950
        hoofdstuk: VIIbis
        paragraaf: '3'
  - number: 49bb.5
    text: |-
      De perioden, bedoeld in het eerste lid, worden slechts opgeschort indien de VWNW-kandidaat op verzoek van het
      bevoegd gezag andere werkzaamheden verricht die de uitvoering van het VWNW-plan ophouden.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49bb
  - number: 49bb.6
    text: |-
      Voor de vrijwillige VWNW-kandidaat die verplichte VWNW-kandidaat wordt, vangt een nieuw begeleidingstraject aan,
      onverminderd de reeds genoten begeleiding als vrijwillige VWNW-kandidaat.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49bb
  - number: 49bb.7
    text: |-
      Het bevoegd gezag kan een periode als bedoeld in het eerste lid, verlengen indien ernstige persoonlijke
      omstandigheden bij de VWNW-kandidaat of het begeleidingstraject hiertoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49bb
  - number: 49cc.1
    text: 'Het plaatsingsbereik waarbinnen een aangeboden functie voor een verplichte VWNW-kandidaat passend is, is gedurende:'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49cc
  - number: 49cc.1.a
    text: |-
      de eerste periode, bedoeld in [artikel 49bb, eerste lid][ref1]: een functie binnen de sector Rijk indien de voor
      de functie geldende salarisschaal ten minste gelijk is aan de salarisschaal die behoort bij de laatstelijk door de
      verplichte VWNW-kandidaat vervulde functie,


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49bb
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49cc
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49bb
        hoofdstuk: VIIbis
        paragraaf: '2'
  - number: 49cc.1.b
    text: |-
      de tweede periode, bedoeld in [artikel 49bb, eerste lid][ref1]: een functie binnen de sector Rijk indien de voor
      de functie geldende salarisschaal niet meer dan twee schalen lager is dan de salarisschaal die behoort bij de
      laatstelijk door de verplichte VWNW-kandidaat vervulde functie,


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49bb
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49cc
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49bb
        hoofdstuk: VIIbis
        paragraaf: '2'
  - number: 49cc.1.c
    text: |-
      de derde periode, bedoeld in [artikel 49bb, eerste lid][ref1]: een dienstverband bij een bij de Stichting
      Pensioenfonds ABP aangesloten organisatie, indien het maximumsalaris van de voor de functie geldende salarisschaal
      niet lager is dan het maximumsalaris van de salarisschaal die twee schalen lager is dan de salarisschaal die
      behoort bij de laatstelijk door de verplichte VWNW-kandidaat vervulde functie, en het voor een verplichte VWNW-
      kandidaat met een aanstelling in vaste dienst een dienstverband voor onbepaalde tijd dan wel een dienstverband voor
      bepaalde tijd met uitzicht op een dienstverband voor onbepaalde tijd betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49bb
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49cc
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49bb
        hoofdstuk: VIIbis
        paragraaf: '2'
  - number: 49cc.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een vrijwillige VWNW-kandidaat, met dien verstande dat de
      functie passend is indien het maximumsalaris van de salarisschaal in de nieuwe functie ten minste gelijk is aan
      het maximumsalaris van de salarisschaal die behoort bij de laatstelijk door de vrijwillige VWNW-kandidaat vervulde
      functie.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49cc
  - number: 49cc.3
    text: |-
      Bij plaatsing van de VWNW-kandidaat in een functie waarvan de salarisschaal lager is dan de salarisschaal die
      behoort bij de laatstelijk door de VWNW-kandidaat vervulde functie, heeft betrokkene gedurende twee jaar recht
      op VWNW-begeleiding, gericht op de plaatsing in een functie met dezelfde salarisschaal als de salarisschaal die
      behoort bij de laatstelijk door de VWNW-kandidaat vervulde functie.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49cc
  - number: 49cc.4
    text: Indien de VWNW-kandidaat daarmee instemt, kan het bevoegd gezag afwijken van het eerste tot en met het derde lid.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49cc
  - number: 49dd.1
    text: |-
      Indien de vrijwillige VWNW-kandidaat na afloop van de derde periode van het begeleidingstraject niet geplaatst
      is in een andere functie, vervalt zijn status als vrijwillige VWNW-kandidaat en vervalt zijn aanspraak op het
      begeleidingstraject en op de voorzieningen, bedoeld in [paragraaf 3][ref1] van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#HoofdstukVIIbis
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49dd
    references:
      - id: ref1
        bwb_id: BWBR0001950
        hoofdstuk: VIIbis
        paragraaf: '3'
  - number: 49dd.2
    text: |-
      Indien de verplichte VWNW-kandidaat na afloop van de derde periode van het begeleidingstraject niet geplaatst is
      in een andere functie, wordt onder onafhankelijke professionele begeleiding een individueel vervolgtraject bepaald,
      dat in beginsel is gericht op de aanvaarding van een andere functie door de verplichte VWNW-kandidaat.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49dd
  - number: 49dd.3
    text: |-
      Tijdens het vervolgtraject, bedoeld in het tweede lid, heeft de verplichte VWNW-kandidaat aanspraak op een nieuw
      begeleidingstraject en heeft hij aanspraak op de voorzieningen, bedoeld in [paragraaf 3][ref1] van dit hoofdstuk,
      met dien verstande dat [artikel 49cc, eerste lid][ref2], en [49gg, zesde en zevende lid][ref3] niet van toepassing
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#HoofdstukVIIbis
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel49cc
      [ref3]: https://wetten.overheid.nl/BWBR0001950#Artikel49gg
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49dd
    references:
      - id: ref1
        bwb_id: BWBR0001950
        hoofdstuk: VIIbis
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 49cc
        hoofdstuk: VIIbis
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0001950
        artikel: 49gg
        hoofdstuk: VIIbis
        paragraaf: '3'
  - number: 49ee.1
    text: |-
      VWNW-kandidaten hebben aanspraak op de voorzieningen, bedoeld in de [artikelen 49ff tot en met 49ss][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49ff
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49ee
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49ff
        hoofdstuk: VIIbis
        paragraaf: '3'
  - number: 49ee.2
    text: |-
      Indien sprake is van een aanstelling in tijdelijke dienst geldt de aanspraak, bedoeld in het eerste lid, gedurende
      maximaal de resterende periode van die aanstelling.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49ee
  - number: 49ff
    text: |-
      [Artikel 100a][ref1] is van overeenkomstige toepassing op de VWNW-kandidaten met een aanstelling in vaste dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel100a
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49ff
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 100a
        hoofdstuk: X
  - number: 49gg.1
    text: |-
      Aan de VWNW-kandidaat wordt een salarisgarantie gedurende twee jaar toegekend indien hij een aangeboden functie
      aanvaardt waarvan de berekeningsbasis lager is dan de berekeningsbasis in de laatstelijk door de VWNW-kandidaat
      vervulde functie.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49gg
  - number: 49gg.2
    text: |-
      Bij het bepalen van de hoogte van de salarisgarantie wordt bij een functie binnen de
      sector Rijk voor de berekeningsbasis uitgegaan van de som van het salaris op basis van
      [artikel 5, tweede lid, van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1], de vakantie-uitkering
      en de eindejaarsuitkering. Bij aanvaarding van een functie buiten de sector Rijk wordt voor de berekeningsbasis
      uitgegaan van de aldaar geldende vaste inkomensbestanddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel5
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49gg
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '5'
  - number: 49gg.3
    text: Bij plaatsing in een functie binnen de sector Rijk wordt de salarisgarantie maandelijks uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49gg
  - number: 49gg.4
    text: |-
      Bij aanvaarding van een functie buiten de sector Rijk wordt de volledige aanspraak op de salarisgarantie eenmalig
      uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49gg
  - number: 49gg.5
    text: |-
      Na de periode van twee jaar, bedoeld in het eerste lid, kan de VWNW-kandidaat jaarlijks suppletie op zijn salaris
      aanvragen, waarvan de hoogte wordt bepaald op grond van het tweede lid. De salarissuppletie wordt één maal per jaar
      uitbetaald en volgt de algemene salarisontwikkeling van de sector Rijk.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49gg
  - number: 49gg.6
    text: |-
      De salarisgarantie en de salarissuppletie zijn ten hoogste gelijk aan het verschil tussen de berekeningsbasis in de
      laatstelijk vervulde functie en de berekeningsbasis van een functie die twee schalen lager is, met dien verstande
      dat indien voor de laatstelijk vervulde functie een lagere salarisschaal geldt dan die welke waarin de VWNW-
      kandidaat is ingedeeld, voor de berekeningsbasis uitgegaan wordt van de salarisschaal waarin de VWNW-kandidaat
      is ingedeeld.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49gg
  - number: 49gg.7
    text: |-
      In afwijking van het zesde lid, zijn de salarisgarantie en de salarissuppletie gelijk aan het verschil tussen
      de berekeningsbasis in de oorspronkelijke functie en de berekeningsbasis in de nieuwe functie, indien de VWNW-
      kandidaat heeft ingestemd met een plaatsing in een functie waarvan de salarisschaal meer dan twee schalen lager is
      dan de salarisschaal die behoort bij de laatstelijk door de VWNW-kandidaat vervulde functie.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49gg
  - number: 49gg.8
    text: |-
      Bij regeling van Onze Minister voor Wonen en Rijksdienst kunnen nadere regels worden gesteld over de
      berekeningswijze van de salarisgarantie en de salarissuppletie en de wijze waarop de salarissuppletie aangevraagd
      wordt.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49gg
  - number: 49hh.1
    text: |-
      In afwijking van [artikel 18b, eerste en derde lid, van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1]
      bedraagt de aflopende toelage, bedoeld in het eerste lid van dat artikel, voor VWNW-kandidaten gedurende het
      eerste en tweede jaar 100%, het derde jaar 75%, het vierde jaar 50% en het vijfde jaar 25% van de berekeningsbasis,
      bedoeld in het tweede lid van dat artikel, indien zijn bezoldiging als gevolg van de toepassing van de bepalingen
      van dit hoofdstuk een blijvende verlaging ondergaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel18b
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49hh
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: 18b
  - number: 49hh.2
    text: |-
      Bij de aanvaarding van een functie buiten de sector Rijk wordt de volledige aanspraak op de aflopende toelage,
      bedoeld in het eerste lid, eenmalig uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49hh
  - number: 49hh.3
    text: |-
      Bij regeling van Onze Minister voor Wonen en Rijksdienst kunnen nadere regels worden gesteld over de toepassing van
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49hh
  - number: 49ii
    text: |-
      In afwijking van [artikel 12ba, tweede lid][ref1], en het bepaalde krachtens
      [artikel 12bb van het Verplaatsingskostenbesluit 1989][ref2] heeft de VWNW-kandidaat, die als gevolg van een
      wijziging van de plaats van tewerkstelling wordt verplaatst, gedurende twee jaar na verplaatsing recht op volledige
      vergoeding van de door het bevoegd gezag redelijk geachte pensionkosten.


      [ref1]: https://wetten.overheid.nl/BWBR0004630#Artikel12ba
      [ref2]: https://wetten.overheid.nl/BWBR0004630#Artikel12bb
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49ii
    references:
      - id: ref1
        bwb_id: BWBR0004630
        artikel: 12ba
      - id: ref2
        bwb_id: BWBR0004630
        artikel: 12bb
  - number: 49jj.1
    text: |-
      Indien de reistijd van de VNWN-kandidaat voor woon-werkverkeer door een wijziging van de plaats van tewerkstelling
      met meer dan 15 minuten per enkele reis toeneemt, wordt deze extra reistijd, voor zover deze meer is dan 15
      minuten, gedurende twee jaar als werktijd aangemerkt.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49jj
  - number: 49jj.2
    text: |-
      Gedurende het derde, vierde en vijfde jaar wordt respectievelijk 75%, 50% en 25% van de in het eerste lid bedoelde
      extra reistijd als werktijd aangemerkt.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49jj
  - number: 49jj.3
    text: |-
      Voor de VWNW-kandidaat die de in het eerste lid bedoelde aanspraak heeft, en voor wie binnen twee jaar opnieuw de
      plaats van tewerkstelling wijzigt, wordt bij de berekening van de extra reistijd uitgegaan van de totale toename
      ten opzichte van de reistijd zoals die was voor de eerste wijziging.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49jj
  - number: 49jj.4
    text: |-
      Indien de tweede toename van de reistijd meer dan 15 minuten bedraagt ten opzichte van de reistijd zoals die was na
      de eerste wijziging, vangt de in het eerste en tweede lid genoemde termijn, gedurende welke de aanspraak bestaat,
      opnieuw aan.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49jj
  - number: 49jj.5
    text: |-
      De ambtenaar voor wie binnen twee jaar voor de tweede maal de plaats van tewerkstelling wijzigt en voor wie pas
      na de tweede wijziging de toename van de reistijd meer dan 15 minuten bedraagt, heeft aanspraak op de voorziening,
      bedoeld in het eerste en tweede lid, vanaf de tweede wijziging.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49jj
  - number: 49jj.6
    text: |-
      Voor de bepaling van de reistijd wordt uitgegaan van de route met de minste reistijd, berekend met de ANWB-
      routeplanner.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49jj
  - number: 49jj.7
    text: |-
      Bij de plaatsing in een functie binnen de sector Rijk kan het bevoegd gezag de werktijd, bedoeld in het eerste
      en tweede lid, vergelden tegen het voor de VWNW-kandidaat geldende salaris per uur direct voorafgaande aan de
      plaatsing in de nieuwe functie, indien de VWNW-kandidaat daarmee instemt.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49jj
  - number: 49jj.8
    text: |-
      Bij de aanvaarding van een functie buiten de sector Rijk door de VWNW-kandidaat wordt de volledige omvang van de
      werktijd, bedoeld in het eerste lid en tweede lid, eenmalig vergolden tegen het voor hem geldende salaris per uur
      direct voorafgaande aan het ontslag.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49jj
  - number: 49kk.1
    text: |-
      In afwijking van [artikel 12b1, derde lid, van het Verplaatsingskostenbesluit 1989][ref1] bedraagt de in het eerste
      en tweede lid van dat artikel bedoelde tegemoetkoming voor VWNW-kandidaten na plaatsing op grond van de bepalingen
      van dit hoofdstuk, het eerste en tweede jaar 100%, het derde jaar 75%, het vierde jaar 50% en het vijfde jaar 25%
      van de tegemoetkoming.


      [ref1]: https://wetten.overheid.nl/BWBR0004630#Artikel12b1
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49kk
    references:
      - id: ref1
        bwb_id: BWBR0004630
        artikel: 12b1
  - number: 49kk.2
    text: |-
      Bij de aanvaarding van een dienstbetrekking buiten de sector Rijk wordt de volledige aanspraak op de
      tegemoetkoming, bedoeld in het eerste lid, eenmalig uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49kk
  - number: 49ll.1
    text: |-
      Aan de VWNW-kandidaat die in verband met zijn plaatsing in een functie in opdracht van het bevoegd gezag is
      verhuisd, wordt eenmalig een bedrag toegekend van € 11.637,69 ter tegemoetkoming in de daarmee verband houdende
      kosten, indien de verhuizing plaatsvindt binnen twee jaar nadat de opdracht om te verhuizen is gegeven.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49ll
  - number: 49ll.2
    text: |-
      In de gevallen waarin de VWNW-kandidaat en zijn echtgenoot beiden in aanmerking komen voor het bedrag bedoeld in
      het eerste lid ontvangt elk de helft daarvan.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49ll
  - number: 49mm
    text: |-
      Het bevoegd gezag draagt er zorg voor dat de VWNW-kandidaat desgewenst na plaatsing in een functie binnen de
      sector Rijk minimaal 20% van zijn werktijd flexibel kan werken indien het aanvaarden van die functie hierdoor
      wordt bevorderd, tenzij de aard van de werkzaamheden zich daartegen verzet. De flexibiliteit heeft betrekking op de
      werktijden en de plaats waar gewerkt wordt.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49mm
  - number: 49nn
    text: |-
      Indien het bevoegd gezag binnen zes maanden na plaatsing in een functie binnen de sector Rijk besluit dat de VWNW-
      kandidaat is geplaatst in een functie die niet passend is, heeft betrokkene vanaf de dag dat hem dit besluit hem
      ter kennis is gebracht, aanspraak op het begeleidingstraject en de voorzieningen, bedoeld in [paragraaf 3][ref1]
      van dit hoofdstuk, met dien verstande dat de perioden van het begeleidingstraject die voor de plaatsing in de
      nieuwe functie zijn doorlopen, in mindering worden gebracht op de periode van het nieuwe begeleidingstraject.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#HoofdstukVIIbis
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49nn
    references:
      - id: ref1
        bwb_id: BWBR0001950
        hoofdstuk: VIIbis
        paragraaf: '3'
  - number: 49oo.1
    text: |-
      Een VWNW-kandiaat met een aanstelling in vaste dienst die buiten de sector Rijk een dienstverband voor onbepaalde
      tijd heeft aanvaard en die buiten zijn schuld of toedoen binnen de eerste twaalf maanden daarvan wordt ontslagen,
      wordt ondersteund door zijn voormalig bevoegd gezag bij het vinden van ander werk.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49oo
  - number: 49oo.2
    text: |-
      Een VWNW-kandidaat met een aanstelling in vaste dienst die buiten de sector Rijk een dienstverband voor bepaalde
      tijd heeft aanvaard met uitzicht op een dienstverband voor onbepaalde tijd en die buiten zijn schuld of toedoen
      wordt ontslagen, wordt ondersteund door zijn voormalig bevoegd gezag bij het vinden van ander werk.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49oo
  - number: 49pp.1
    text: |-
      De VWNW-kandidaat heeft bij eervol ontslag aanspraak op een diensttijdgratificatie als bedoeld in
      [artikel 79, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel79
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49pp
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '79'
        hoofdstuk: VIIa
  - number: 49pp.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de ambtenaar die deel uitmaakt van een aangewezen groep als
      bedoeld in [artikel 49s, tweede lid][ref1], en die aan een VWNW-onderzoek heeft deelgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49s
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49pp
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49s
        hoofdstuk: VIIbis
        paragraaf: '1'
  - number: 49qq.1
    text: |-
      Het bevoegd gezag legt de VWNW-kandidaat bij eervol ontslag niet de terugbetalingsverplichting, bedoeld in
      [artikel 33g, achtste lid][ref1], en [artikel 59, zesde lid][ref2], op.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel33g
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel59
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49qq
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 33g
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '59'
        hoofdstuk: VIIa
  - number: 49qq.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de ambtenaar die deel uitmaakt van een aangewezen groep als
      bedoeld in [artikel 49s, tweede lid][ref1], en die aan een VWNW-onderzoek heeft deelgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49s
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49qq
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49s
        hoofdstuk: VIIbis
        paragraaf: '1'
  - number: 49rr
    text: |-
      De verplichte VWNW-kandidaat heeft bij de vervulling van vacatures binnen de sector Rijk een voorrangspositie op
      andere ambtenaren, voor zover die geen voorrangspositie hebben.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49rr
  - number: 49ss.1
    text: |-
      Aan de verplichte VWNW-kandidaat die een functie aanvaardt bij een organisatie die niet is aangesloten bij de
      Stichting Pensioenfonds ABP en die aanspraak heeft op een voorwaardelijke pensioenaanspraak, kent het bevoegd
      gezag een bijdrage toe ter hoogte van die aanspraak. Tevens kan het bevoegd gezag de verplichte VWNW-kandidaat een
      aanvullende bijdrage toekennen voor het in de toekomst op te bouwen pensioen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49ss
  - number: 49ss.2
    text: |-
      Aan de vrijwillige VWNW-kandidaat die een functie aanvaardt bij een organisatie die niet is aangesloten bij de
      Stichting Pensioenfonds ABP, kan het bevoegd gezag een bijdrage toekennen voor de pensioenopbouw.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49ss
  - number: 49ss.3
    text: |-
      De in het eerste en tweede lid bedoelde bijdrage wordt twee jaar na verlening van ontslag uitbetaald aan een
      pensioenfonds of verzekeringsmaatschappij, dan wel gestort op een rekening voor banksparen indien het bevoegd gezag
      daarmee instemt, voor zover de ambtenaar in die periode geen aanspraak heeft gemaakt op de in [artikel 49ff][ref1]
      bedoelde voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49ff
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49ss
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49ff
        hoofdstuk: VIIbis
        paragraaf: '3'
  - number: 49tt.1
    text: |-
      Aan de VWNW-kandidaat wordt op zijn aanvraag een stimuleringspremie bij ontslag toegekend, indien hij afziet van
      zijn aanspraak op het begeleidingstraject en de voorzieningen, bedoeld in [paragraaf 3 van dit hoofdstuk][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#HoofdstukVIIbis
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49tt
    references:
      - id: ref1
        bwb_id: BWBR0001950
        hoofdstuk: VIIbis
        paragraaf: '3'
  - number: 49tt.2
    text: |-
      Het eerste lid is niet van toepassing op de ambtenaar die VWNW-kandidaat is geworden gedurende een vrijwillige fase
      in verband met een wijziging van de plaats van tewerkstelling zonder dat sprake is van een dreigende opheffing van
      functies of vermindering van uitwisselbare functies als bedoeld in [artikel 49s, tweede lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49s
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49tt
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49s
        hoofdstuk: VIIbis
        paragraaf: '1'
  - number: 49tt.3
    text: |-
      De hoogte van de stimuleringspremie bedraagt één maandsalaris per rekenkundige maand, bedoeld in het vierde lid,
      vermenigvuldigd met de breuk waarvan de teller het aantal voor de VWNW-kandidaat resterende maanden voor het
      begeleidingstraject bedraagt en de noemer 18.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49tt
  - number: 49tt.4
    text: 'De rekenkundige maanden, bedoeld in het derde lid, zijn:'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49tt
  - number: 49tt.4.a
    text: |-
      vier maanden voor VWNW-kandidaten die minder dan tien jaren overheidswerknemer zijn als bedoeld in
      [artikel 2, eerste lid, van de Wet privatisering ABP][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel2
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49tt
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '2'
  - number: 49tt.4.b
    text: |-
      acht maanden voor VWNW-kandidaten die tien tot twintig jaren overheidswerknemer zijn als bedoeld in
      [artikel 2, eerste lid, van de Wet privatisering ABP][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel2
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49tt
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '2'
  - number: 49tt.4.c
    text: |-
      twaalf maanden voor VWNW-kandidaten die twintig tot dertig jaren overheidswerknemer zijn als bedoeld in
      [artikel 2, eerste lid, van de Wet privatisering ABP][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel2
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49tt
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '2'
  - number: 49tt.4.d
    text: |-
      vierentwintig maanden voor VWNW-kandidaten die dertig of meer jaren overheidswerknemer zijn als bedoeld in
      [artikel 2, eerste lid, van de Wet privatisering ABP][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel2
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49tt
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '2'
  - number: 49tt.5
    text: |-
      Bij het vaststellen van de teller, bedoeld in het derde lid, wordt uitgegaan van de datum waarop de VWNW-kandidaat
      het ontslag wil laten ingaan waarbij tussen de aanvraag en de gewenste ontslagdatum de opzegtermijn ten minste een
      maand bedraagt, met dien verstande dat een maand opzegtermijn niet in mindering wordt gebracht op de resterende
      maanden van het begeleidingstraject in de teller.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49tt
  - number: 49tt.6
    text: |-
      De stimuleringspremie bedraagt ten hoogste € 75.000. Indien de som van twaalf maandsalarissen verhoogd met
      de vakantie-uitkering en de eindejaarsuitkering van de VWNW-kandidaat hoger is dan € 75.000, bedraagt de
      stimuleringspremie maximaal twaalf maandsalarissen verhoogd met de vakantie-uitkering en de eindejaarsuitkering.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49tt
  - number: 49tt.7
    text: 'De stimuleringspremie wordt terugbetaald indien:'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49tt
  - number: 49tt.7.a
    text: |-
      de voormalige VWNW-kandidaat terugkeert naar een functie binnen de sector Rijk binnen het aantal maanden van zijn
      volgens het vierde lid vastgestelde rekenkundige periode van VWNW-begeleiding, of
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49tt
  - number: 49tt.7.b
    text: |-
      de voormalige VWNW-kandidaat vanwege ontslag op zijn aanvraag een werkloosheidsuitkering wordt toegekend ten laste
      van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49tt
  - number: 49tt.8
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld over het aan de VWNW-kandidaat verlenen van
      buitengewoon verlof met behoud van bezoldiging voorgaand aan ontslag op aanvraag, indien de VWNW-kandidaat afziet
      van een stimuleringspremie.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49tt
  - number: 49uu.1
    text: Er is een rijksbrede commissie VWNW-beleid.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49uu
  - number: 49uu.2
    text: 'De commissie, bedoeld in het eerste lid, heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49uu
  - number: 49uu.2.a
    text: |-
      op verzoek van het bevoegd gezag of op verzoek van de ambtenaar die het betreft het bevoegd gezag te adviseren
      over het advies naar aanleiding van een VWNW-onderzoek nadat een nieuw advies is uitgebracht als bedoeld in
      [artikel 49x, achtste lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49x
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49uu
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49x
        hoofdstuk: VIIbis
        paragraaf: '2'
  - number: 49uu.2.b
    text: |-
      het bevoegd gezag te adviseren over de te nemen beslissing op een bezwaarschrift tegen een besluit als bedoeld in
      [artikel 49y, vijfde lid][ref1], inzake toekenning van faciliteiten in het VWNW-plan,


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49y
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49uu
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49y
        hoofdstuk: VIIbis
        paragraaf: '2'
  - number: 49uu.2.c
    text: |-
      het bevoegd gezag te adviseren over de te nemen beslissing op een bezwaarschrift tegen een besluit als bedoeld in
      [artikel 49bb, zevende lid][ref1], om een periode van het begeleidingstraject niet te verlengen,


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49bb
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49uu
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49bb
        hoofdstuk: VIIbis
        paragraaf: '2'
  - number: 49uu.2.d
    text: |-
      het bevoegd gezag te adviseren over de afhandeling van een klacht over gedragingen van het bevoegd gezag in het
      kader van het VWNW-begeleidingstraject,
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49uu
  - number: 49uu.2.e
    text: |-
      op verzoek van het bevoegd gezag of op verzoek van de verplichte VWNW-kandidaat die het betreft het bevoegd
      gezag te adviseren over een geschil over een voorgenomen besluit inzake het vervolgtraject, bedoeld in
      [artikel 49dd, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49dd
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49uu
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49dd
        hoofdstuk: VIIbis
        paragraaf: '2'
  - number: 49uu.3
    text: |-
      De commissie spant zich in haar advies uiterlijk vier weken na ontvangst van een verzoek als bedoeld in het tweede
      lid, onder a of e, uit te brengen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49uu
  - number: 49uu.4
    text: Het bevoegd gezag kan van het advies, bedoeld in het tweede lid, onder a of e, slechts gemotiveerd afwijken.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49uu
  - number: 49uu.5
    text: |-
      De commissie brengt jaarlijks verslag uit van haar werkzaamheden aan het overleg van Onze Minister voor Wonen en
      Rijksdienst met de Sectorcommissie overleg rijkspersoneel.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49uu
  - number: 49uu.6
    text: |-
      Bij regeling van Onze Minister voor Wonen en Rijksdienst worden regels gesteld met betrekking tot de benoeming van
      de leden en de werkwijze van de commissie.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49uu
  - number: 49vv.1
    text: |-
      Indien een onderdeel van de sector Rijk wordt geprivatiseerd of verzelfstandigd dan wel de werkzaamheden van dat
      onderdeel worden uitbesteed of overgedragen aan andere overheden buiten de sector Rijk, wordt een sociaal plan
      opgesteld.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49vv
  - number: 49vv.2
    text: |-
      De betrokken ambtenaren gaan overeenkomstig het bepaalde in het sociaal plan over naar de private onderneming, het
      zelfstandig bestuursorgaan of de andere overheden buiten de sector Rijk. Aan hen wordt eervol ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49vv
  - number: 49vv.3
    text: |-
      De betrokken ambtenaar die op basis van het sociaal plan niet kan overgaan naar de private onderneming, het
      zelfstandig bestuursorgaan of de andere overheden buiten de sector Rijk, wordt verplichte VWNW-kandidaat.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49vv
  - number: 49vv.4
    text: |-
      In afwijking van het tweede lid, kan de ambtenaar die is aangesteld in tijdelijke dienst voor een proeftijd of
      de ambtenaar die is aangesteld in vaste dienst, op zijn aanvraag voor de duur van maximaal achttien maanden in
      dienst blijven. Bij de overgang naar een bij de Stichting Pensioenfonds ABP aangesloten organisatie kan betrokkene
      maximaal twaalf maanden in dienst blijven. De ambtenaar in vaste dienst wordt eervol ontslag verleend indien hij
      gedurende deze periode niet kan worden geplaatst in een andere functie.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49vv
  - number: 49vv.5
    text: |-
      Tijdens de periode, bedoeld in het vierde lid, heeft de ambtenaar overeenkomstig de verplichte kandidaat aanspraak
      op het begeleidingtraject en de voorzieningen bedoeld in [paragraaf 3][ref1] van dit hoofdstuk, met dien verstande
      dat [artikel 49dd, tweede en derde lid][ref2], niet van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#HoofdstukVIIbis
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel49dd
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49vv
    references:
      - id: ref1
        bwb_id: BWBR0001950
        hoofdstuk: VIIbis
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 49dd
        hoofdstuk: VIIbis
        paragraaf: '2'
  - number: 49ww
    text: |-
      De [artikelen 96][ref1] en [96a][ref2] zijn niet van toepassing op de VWNW-kandidaat.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel96
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel96a
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49ww
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '96'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 96a
        hoofdstuk: X
  - number: 49xx
    text: |-
      Het bevoegd gezag kan de aanspraak op het begeleidingstraject en de voorzieningen, bedoeld in [paragraaf 3][ref1]
      en [4][ref2] van dit hoofdstuk toekennen aan andere ambtenaren voor zover daarmee de plaatsing van een VWNW-
      kandidaat wordt gerealiseerd of hiermee een bijdrage wordt geleverd aan het realiseren van een taakstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#HoofdstukVIIbis
      [ref2]: https://wetten.overheid.nl/BWBR0001950#HoofdstukVIIbis
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49xx
    references:
      - id: ref1
        bwb_id: BWBR0001950
        hoofdstuk: VIIbis
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0001950
        hoofdstuk: VIIbis
        paragraaf: '4'
  - number: 49yy.1
    text: |-
      De ambtenaar die in de periode van 1 januari 2012 tot en met 14 april 2013 is aangewezen als herplaatsingskandidaat
      kan voor 1 juli 2013 aan het bevoegd gezag kenbaar maken dat hij als verplichte VWNW-kandidaat gebruik gaat maken
      van het begeleidingstraject en de voorzieningen bedoeld in [paragraaf 3][ref1] van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#HoofdstukVIIbis
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49yy
    references:
      - id: ref1
        bwb_id: BWBR0001950
        hoofdstuk: VIIbis
        paragraaf: '3'
  - number: 49yy.2
    text: |-
      Indien de ambtenaar, bedoeld in het eerste lid, voor 1 juli 2013 aan het bevoegd gezag kenbaar heeft gemaakt
      als verplichte VWNW-kandidaat gebruik te gaan maken van het begeleidingstraject en de voorzieningen bedoeld in
      [paragraaf 3][ref1], worden de resterende maanden van de periode, bedoeld in [artikel 49g, eerste lid][ref2],
      omgezet in een periode voor een begeleidingstraject van dezelfde omvang. Zo nodig wordt voor het
      begeleidingstraject een VWNW-plan opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#HoofdstukVIIbis
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel49g
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49yy
    references:
      - id: ref1
        bwb_id: BWBR0001950
        hoofdstuk: VIIbis
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 49g
        hoofdstuk: VII
  - number: 49yy.3
    text: |-
      De ambtenaar die met toepassing van het [Besluit sociaal flankerend beleid sector Rijk 2008–2012][ref1] als
      herplaatsingskandidaat is aangewezen, kan de resterende maanden van zijn herplaatsingstermijn vergelden in een
      stimuleringspremie bij ontslag op zijn aanvraag. [Artikel 49tt][ref2] is van overeenkomstige toepassing, met dien
      verstande dat de in aanmerking te nemen noemer dertig bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0027815
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel49tt
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49yy
    references:
      - id: ref1
        bwb_id: BWBR0027815
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 49tt
        hoofdstuk: VIIbis
        paragraaf: '4'
  - number: 49yy.4
    text: |-
      [Hoofdstuk VII][ref1] blijft van toepassing op de ambtenaar die:


      [ref1]: https://wetten.overheid.nl/BWBR0001950#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49yy
    references:
      - id: ref1
        bwb_id: BWBR0001950
        hoofdstuk: VII
  - number: 49yy.4.a
    text: |-
      voor 15 april 2013 is aangewezen als herplaatsingskandidaat en die geen gebruik maakt van het begeleidingstraject
      en de voorzieningen bedoeld in paragraaf 3 van dit hoofdstuk, of
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49yy
  - number: 49yy.4.b
    text: |-
      met toepassing van het [Besluit sociaal flankerend beleid sector Rijk 2008–2012][ref1] als herplaatsingskandidaat
      is aangewezen, en de resterende maanden van zijn herplaatsingstermijn niet vergeldt in een stimuleringspremie.


      [ref1]: https://wetten.overheid.nl/BWBR0027815
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49yy
    references:
      - id: ref1
        bwb_id: BWBR0027815
  - number: 49zz
    text: |-
      De [artikelen 49jj, eerste tot en met het zevende lid][ref1], [49kk, eerste lid][ref2], en [artikel 49ll][ref3]
      zijn van overeenkomstige toepassing op de ambtenaar van wie de plaats van tewerkstelling wijzigt vanwege een
      wijziging van de locatie van zijn organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49jj
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel49kk
      [ref3]: https://wetten.overheid.nl/BWBR0001950#Artikel49ll
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49zz
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49jj
        hoofdstuk: VIIbis
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 49kk
        hoofdstuk: VIIbis
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0001950
        artikel: 49ll
        hoofdstuk: VIIbis
        paragraaf: '3'
  - number: 49aaa
    text: |-
      Het bevoegd gezag kan afwijken van de bepalingen in dit hoofdstuk voor zover toepassing gelet op het belang dat
      deze bepalingen beogen te beschermen, zal leiden tot een onbillijkheid van overwegende aard voor de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel49aaa
  - number: '50.1'
    text: |-
      De ambtenaar is gehouden de plichten uit zijn functie voortvloeiende nauwgezet en ijverig te vervullen en zich te
      gedragen, zoals een goed ambtenaar betaamt.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel50
  - number: '50.2'
    text: |-
      Het is de ambtenaar verboden in dienst uniformkledingstukken te dragen, tenzij deze van regeringswege zijn
      verstrekt of voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel50
  - number: '50.3'
    text: |-
      Het is de ambtenaar verboden bij gekleed gaan in uniform insignes of andere onderscheidingstekens te dragen, tenzij
      deze van regeringswege zijn verstrekt of voorgeschreven of tot het dragen daarvan door Onze Minister-President
      vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel50
  - number: '51.1'
    text: De ambtenaar is verplicht een eed of een belofte af te leggen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel51
  - number: '51.2'
    text: Bij ministeriële regeling worden regels gesteld inzake het afleggen door de ambtenaar van de eed of de belofte.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel51
  - number: '51.3'
    text: |-
      Bij regeling van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties wordt het formulier vastgesteld dat
      wordt gebruikt voor het afleggen door de ambtenaar van de eed of de belofte.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel51
  - number: '52'
    text: |-
      Ter zake van niet-naleving van bepalingen, welke redelijkerwijs niet kunnen worden geacht den ambtenaar bekend te
      zijn, worden hem geen voordeelen onthouden of nadeelen toegebracht.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel52
  - number: '54'
    text: |-
      Indien de ambtenaar verhinderd is zijn dienst te verrichten, is hij verplicht daarvan, onder opgave van redenen,
      zoo tijdig mogelijk mededeeling te doen, ten einde vertraging of hinder in den dienst zooveel doenlijk te
      voorkomen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel54
  - number: '55.1'
    text: |-
      De ambtenaar kan worden verplicht te gaan wonen of te blijven wonen in of nabij de gemeente die hem als standplaats
      is aangewezen of waartoe zijn standplaats behoort, indien dit naar het oordeel van het bevoegd gezag noodzakelijk
      is in verband met de goede vervulling van zijn functie.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel55
  - number: '55.2'
    text: |-
      De ambtenaar aan wie de verplichting is opgelegd in of nabij de in het eerste lid bedoelde gemeente te gaan wonen,
      is gehouden zo spoedig mogelijk, maar uiterlijk twee jaar nadat die verplichting is opgelegd, daaraan gevolg te
      geven.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel55
  - number: '56.1'
    text: |-
      De ambtenaar is verplicht, indien hem eene ambts- of dienstwoning ter bewoning is aangewezen, deze te betrekken en
      zich ter zake van de bewoning en het gebruik te gedragen naar de voorschriften, die daaromtrent zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel56
  - number: '56.2'
    text: |-
      Hij draagt de onderhoudskosten, welke volgens de wet en het plaatselijk gebruik gemeenlijk voor rekening van den
      huurder zijn, tenzij door het bevoegd gezag ter zake eene afwijkende regeling is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel56
  - number: '57.1'
    text: De ambtenaar kan op zijn aanvraag een andere functie worden opgedragen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel57
  - number: '57.2'
    text: |-
      Wanneer het belang van de dienst zulks vordert, is de ambtenaar verplicht, een andere passende functie te
      aanvaarden:
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel57
  - number: 57.2.a
    text: |-
      overeenkomstig het bepaalde in artikel 49*h* indien het gaat om een verplaatsing in het kader van een
      reorganisatie, en;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel57
  - number: 57.2.b
    text: overeenkomstig het bepaalde in artikel 49*h*, eerste lid in de overige gevallen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel57
  - number: '57.3'
    text: |-
      Het opdragen van een andere functie aan de ambtenaar, bedoeld in artikel 4, vijfde lid, onder a, vindt plaats door
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties in overeenstemming met Onze Minister.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel57
  - number: '57.4'
    text: |-
      Het opdragen van een andere functie aan de ambtenaar, bedoeld in artikel 4, vijfde lid, onder b of c, vindt plaats
      door Onze Minister in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel57
  - number: 57b.1
    text: |-
      Indien de ambtenaar van 57 jaar of ouder op diens aanvraag een functie wordt opgedragen waaraan een salarisschaal
      is verbonden met een lager maximumsalaris dan dat van de reeds voor hem geldende salarisschaal, wordt op zijn
      salaris een inhouding toegepast.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel57b
  - number: 57b.2
    text: |-
      De inhouding is gelijk aan het verschil tussen het salaris dat de ambtenaar geniet en het salaris dat de ambtenaar
      zou genieten bij inpassing in de bij de nieuwe functie behorende salarisschaal op hetzelfde salarisnummer.
      Indien dit salarisnummer in laatstbedoelde salarisschaal niet voorkomt, geschiedt de inpassing op het naastlagere
      salarisnummer.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel57b
  - number: 57b.3
    text: |-
      Indien na 52 weken ziekte de doorbetaling van de bezoldiging op grond van [artikel 37, eerste lid][ref1], wordt
      teruggebracht tot 70%, wordt de inhouding over die uren opgeschort voor de duur van de ziekte.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel37
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel57b
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '37'
        hoofdstuk: VI
        paragraaf: '3'
  - number: 57b.4
    text: In bijzondere gevallen kan Onze Minister geheel of gedeeltelijk van de inhouding afzien.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel57b
  - number: '58.1'
    text: |-
      De ambtenaar kan worden verplicht tijdelijk andere ambtelijke werkzaamheden te verrichten dan die, welke hij
      gewoonlijk verricht, mits die werkzaamheden hem redelijkerwijs kunnen worden opgedragen. Hij kan echter niet
      worden verplicht werkzaamheden te verrichten in de plaats van stakers of uitgeslotenen in particuliere dienst,
      tenzij de opgedragen werkzaamheden worden verricht in dienst van het lichaam, waarbij hij werkzaam is, en voor de
      openbare dienst tijdens de staking of uitsluiting, dan wel als onmiddellijk gevolg daarvan redelijkerwijze dadelijk
      noodzakelijk zijn te achten.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel58
  - number: '58.2'
    text: |-
      Voorts kan aan de ambtenaar door Onze Minister de verplichting worden opgelegd in tijden van oorlog, oorlogsgevaar
      of andere buitengewone omstandigheden andere werkzaamheden te verrichten dan die, welke hij gewoonlijk verricht,
      mits die werkzaamheden strekken ter uitvoering van de taak, welke het ministerie waarbij hij werkzaam is of
      waaronder de dienst of instelling, waarbij hij werkzaam is, ressorteert, in die tijden heeft of zal krijgen, dan
      wel ertoe strekken een zo goed en ongestoord mogelijke uitvoering van die taak te verzekeren.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel58
  - number: '58.3'
    text: |-
      De ambtenaar aan wie de in het vorige lid bedoelde verplichting is opgelegd, is tevens te allen tijde verplicht
      lessen te volgen en deel te nemen aan oefeningen, die verband houden met de in dat lid bedoelde werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel58
  - number: '58.4'
    text: |-
      Bij de toepassing van het bepaalde in de vorige leden wordt voor zoveel mogelijk rekening gehouden met de
      persoonlijke omstandigheden van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel58
  - number: 58a.1
    text: |-
      De ambtenaar die door het bevoegd gezag is aangewezen om tevens werkzaam te zijn als bedrijfshulpverlener als
      bedoeld in artikel 15 van de Arbeidsomstandighedenwet ontvangt een vergoeding indien hij de taken in verband met
      bedrijfshulpverlening in voldoende omvang verricht.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel58a
  - number: 58a.2
    text: 'De vergoeding, bedoeld in het eerste lid, bedraagt per jaar:'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel58a
  - number: 58a.2.a
    text: 'voor de basisbedrijfshulpverlener: € 220,00;'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel58a
  - number: 58a.2.b
    text: 'voor de allroundbedrijfshulpverlener: € 440,00;'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel58a
  - number: 58a.2.c
    text: |-
      voor de bedrijfshulpverlener die door het bevoegd gezag is aangewezen om leidinggevende taken met betrekking tot
      bedrijfshulpverlening uit te oefenen: € 660,00.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel58a
  - number: 58a.3
    text: |-
      De aanspraak op de vergoeding wordt berekend naar het bedrag van de vergoeding, bedoeld in het tweede lid, op de
      eerste dag van de maand die volgt op het verstrijken van het jaar waarin betrokkene bedrijfshulpverlener was. De
      vergoeding voor een gedeelte van een jaar wordt berekend naar evenredigheid van het aantal hele maanden dat de
      aanwijzing tot bedrijfshulpverlener heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel58a
  - number: 58a.4
    text: |-
      De ambtenaar, bedoeld in het eerste lid, ontvangt vijf jaar na diens aanwijzing tot bedrijfshulpverlener en
      vervolgens elke vijf jaar daarna zolang de aanwijzing duurt, een jubileumtoeslag ten bedrage van:
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel58a
  - number: 58a.4.a
    text: € 360,00 na vijf jaar;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel58a
  - number: 58a.4.b
    text: € 440,00 na tien jaar;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel58a
  - number: 58a.4.c
    text: € 525,00 na vijftien jaar en na elke vijf jaar daaropvolgend.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel58a
  - number: 58a.5
    text: |-
      In afwijking van [artikel 23 van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1] worden taken in
      het kader van de bedrijfshulpverlening die in opdracht van het bevoegd gezag als overwerk worden verricht, vergoed
      voor alle aangewezen ambtenaren en uitsluitend met een bedrag in geld, met dien verstande dat voor elk uur overwerk
      een vergoeding wordt toegekend ten bedrage van 125% van het salaris per uur, behorende bij het maximumsalaris van
      salarisschaal 7.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel24
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '24'
  - number: 58a.6
    text: |-
      Onze Minister voor Wonen en Rijksdienst past de bedragen, bedoeld in het tweede en vierde lid, aan overeenkomstig
      de algemene salarisontwikkeling van het rijkspersoneel.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel58a
  - number: 58b.1
    text: |-
      Het bevoegd gezag breidt de formatie van de organisatorische eenheid waar de ambtenaar die lid is van
      de ondernemingsraad werkzaam is, uit met de tijd die met toepassing van de [artikelen 17][ref1] en
      [18 van de Wet op de ondernemingsraden][ref2] voor die ambtenaar is vastgesteld, voor zover dit noodzakelijk is
      om gedurende de periode van het lidmaatschap de door de organisatorische eenheid te verrichten werkzaamheden te
      realiseren.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002747#Artikel18
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel58b
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0002747
        artikel: '18'
  - number: 58b.2
    text: |-
      De ambtenaar, bedoeld in het eerste lid, heeft op zijn aanvraag voor de resterende duur van zijn lidmaatschap van
      de ondernemingsraad recht op uitbreiding van zijn arbeidsduur met het aantal uren waarmee het bevoegd gezag vanwege
      dat lidmaatschap op grond van het eerste lid de formatie heeft uitgebreid. [Artikel 21, tweede lid][ref1], is van
      overeenkomstige toepassing. Een aanvraag als bedoeld in de eerste volzin wordt niet toegewezen zolang de ambtenaar
      geheel of gedeeltelijk ongeschikt is tot het verrichten van zijn arbeid wegens ziekte.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel21
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel58b
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '21'
        hoofdstuk: IV
  - number: '59.1'
    text: |-
      De ambtenaar kan in het belang van de rijksdienst worden verplicht om scholing te volgen, voor zover dat
      redelijkerwijs van hem kan worden verlangd. Bij het opleggen van de verplichting tot het volgen van scholing worden
      studiefaciliteiten toegekend.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel59
  - number: '59.2'
    text: |-
      De ambtenaar die is aangewezen als herplaatsingskandidaat als bedoeld in de [artikelen 49d][ref1] en
      [49e][ref2], en die een studie volgt of gaat volgen die aantoonbaar bijdraagt aan het realiseren van vastgelegde
      loopbaanafspraken dan wel het kunnen plaatsen in een andere functie worden studiefaciliteiten toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49d
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel49e
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49d
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 49e
        hoofdstuk: VII
  - number: '59.3'
    text: 'De in het eerste en tweede lid bedoelde faciliteiten zijn:'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel59
  - number: 59.3.a
    text: een volledige vergoeding van de met de studie gemoeide scholingskosten;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel59
  - number: 59.3.b
    text: '100% verlof met behoud van bezoldiging voor de tijd die is gemoeid met:'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel59
  - number: 59.3.b.1
    text: het volgen van lessen en stages die een onlosmakelijk onderdeel uitmaken van de opleiding;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel59
  - number: 59.3.b.2
    text: contacturen die een onlosmakelijk onderdeel uitmaken van de opleiding;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel59
  - number: 59.3.b.3
    text: zelfstudie van maximaal een dag per week, en
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel59
  - number: 59.3.b.4
    text: het afleggen van examens.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel59
  - number: '59.4'
    text: |-
      Aan de ambtenaar, niet zijnde de ambtenaar, bedoeld in het eerste of tweede lid, die een studie volgt of gaat
      volgen die naar het oordeel van het bevoegd gezag aantoonbaar bijdraagt aan het realiseren van vastgelegde
      loopbaanafspraken worden de volgende studiefaciliteiten toegekend:
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel59
  - number: 59.4.a
    text: een volledige vergoeding van de met de studie gemoeide scholingskosten;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel59
  - number: 59.4.b
    text: '50% verlof met behoud van bezoldiging voor de tijd die is gemoeid met:'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel59
  - number: 59.4.b.1
    text: het volgen van lessen en stages die een onlosmakelijk onderdeel uitmaken van de opleiding;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel59
  - number: 59.4.b.2
    text: contacturen die een onlosmakelijk onderdeel uitmaken van de opleiding;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel59
  - number: 59.4.b.3
    text: zelfstudie van maximaal een dag per week, en
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel59
  - number: 59.4.b.4
    text: het afleggen van examens.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel59
  - number: '59.5'
    text: |-
      Aan de niet in het eerste tot en met vierde lid bedoelde ambtenaar die een studie volgt of gaat volgen, kan het
      bevoegd gezag de volgende studiefaciliteiten toekennen:
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel59
  - number: 59.5.a
    text: een vergoeding van de met de studie gemoeide scholingskosten tot ten hoogste 50% van deze scholingskosten;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel59
  - number: 59.5.b
    text: |-
      ten hoogste 25% verlof met behoud van bezoldiging voor de tijd die is gemoeid met het volgen van lessen en stages
      die een onlosmakelijk onderdeel uitmaken van de opleiding, en het afleggen van examens.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel59
  - number: '59.6'
    text: 'De ambtenaar kan worden verplicht tot terugbetaling van de aan hem toegekende vergoeding van de scholingskosten:'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel59
  - number: 59.6.a
    text: |-
      bij onvoldoende resultaat in de scholing en bij tussentijds afbreken van de scholing, indien dit aan eigen schuld
      of toedoen van de ambtenaar is te wijten;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel59
  - number: 59.6.b
    text: |-
      bij ontslag tijdens het volgen van de scholing en in bijzondere gevallen bij ontslag binnen een termijn van ten
      hoogste drie jaren na het met voldoende resultaat afronden van de scholing, tenzij de ambtenaar binnen een maand
      na zijn ontslag elders in dienst treedt binnen de rijksdienst of aansluitend aan zijn ontslag recht heeft op een
      uitkering op grond van werkloosheid, arbeidsongeschiktheid of ouderdomspensioen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel59
  - number: '59.7'
    text: |-
      De verplichting tot terugbetaling wordt niet opgelegd aan de ambtenaar die binnen de in [artikel 49g][ref1]
      bedoelde termijn nadat hij is aangewezen als herplaatsingskandidaat als bedoeld in de [artikelen 49d][ref2]
      en [49e][ref3], op zijn aanvraag eervol ontslag wordt verleend wegens de aanvaarding van een functie buiten de
      rijksdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49g
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel49d
      [ref3]: https://wetten.overheid.nl/BWBR0001950#Artikel49e
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49g
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 49d
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0001950
        artikel: 49e
        hoofdstuk: VII
  - number: '59.8'
    text: |-
      Het bevoegd gezag kan toestaan dat het verlof voor zelfstudie, bedoeld in het derde lid, onderdeel b, onder 3°, en
      vierde lid, onderdeel b, onder 3°, geldt voor meer dan maximaal een dag per week.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel59
  - number: '59.9'
    text: |-
      De reis- en verblijfkosten, die de ambtenaar in het kader van scholing als bedoeld in het eerste, tweede of
      vierde lid maakt, worden vergoed overeenkomstig het bepaalde in het [Reisbesluit binnenland][ref1] of het
      [Reisbesluit buitenland][ref2]. In afwijking van [artikel 6, tweede lid, van het Reisbesluit binnenland][ref3] en
      [artikel 6, tweede lid, van het Reisbesluit buitenland][ref4], geldt dat de vergoeding van reiskosten, voor zover
      met de trein wordt gereisd, gelijk is aan de gemaakte kosten op basis van het tarief van de tweede klasse.


      [ref1]: https://wetten.overheid.nl/BWBR0005889
      [ref2]: https://wetten.overheid.nl/BWBR0006842
      [ref3]: https://wetten.overheid.nl/BWBR0005889#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0006842#Artikel6
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005889
      - id: ref2
        bwb_id: BWBR0006842
      - id: ref3
        bwb_id: BWBR0005889
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0006842
        artikel: '6'
  - number: '59.10'
    text: |-
      In deze bepaling wordt onder scholingskosten verstaan de kosten voor de door de onderwijsinstelling verplicht
      gestelde onderwijsmiddelen, les- en examengelden en verplicht gestelde excursies of studiereizen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel59
  - number: '60'
    text: |-
      Bij regeling van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kunnen nadere regels worden gesteld om
      ambtenaren die werkzaam zijn in een substantieel bezwarende functie als bedoeld in [artikel 94b, eerste lid][ref1],
      te stimuleren na verloop van tijd de overstap te maken naar een niet substantieel bezwarende functie.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel94b
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 94b
        hoofdstuk: X
  - number: '61.1'
    text: |-
      De ambtenaar is verplicht aan Onze Minister, op een door Onze Minister te bepalen wijze, opgave te doen van de
      nevenwerkzaamheden die hij verricht of voornemens is te gaan verrichten, die de belangen van de dienst voor zover
      deze in verband staan met zijn functievervulling, kunnen raken.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel61
  - number: '61.2'
    text: Onze Minister voert een registratie op basis van de op grond van het eerste lid gedane opgaven.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel61
  - number: '61.3'
    text: |-
      De door de leden van de topmanagementgroep, bedoeld in [artikel 4, vijfde lid, onder a][ref1], juncto
      [artikel 7, vierde lid][ref2], en door de directeur-generaal Algemene Bestuursdienst gemelde nevenwerkzaamheden
      worden openbaar gemaakt met vermelding van eventueel door Onze Minister aan het verrichten van de
      nevenwerkzaamheden gestelde beperkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel7
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '4'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
  - number: '61.4'
    text: |-
      Het is de ambtenaar verboden nevenwerkzaamheden te verrichten waardoor de goede vervulling van zijn functie of de
      goede functionering van de openbare dienst, voor zover deze in verband staat met zijn functievervulling, niet in
      redelijkheid zou zijn verzekerd. Bij ministeriële regeling kunnen nadere regels omtrent dit verbod worden gesteld.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel61
  - number: 61a.1
    text: |-
      Onze Minister wijst de ambtenaren aan die werkzaamheden verrichten waaraan in het bijzonder het risico van
      financiële belangenverstrengeling of het risico van oneigenlijk gebruik van koersgevoelige informatie verbonden
      is. De aangewezen ambtenaar meldt financiële belangen, alsmede het bezit van en transacties met effecten die de
      belangen van de dienst voor zover deze in verband staan met zijn functievervulling kunnen raken, aan een daartoe
      aangewezen functionaris.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel61a
  - number: 61a.2
    text: Onze Minister voert een registratie van de op grond van het eerste lid gedane meldingen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel61a
  - number: 61a.3
    text: |-
      De ambtenaar verstrekt nadere informatie of bescheiden met betrekking tot de financiële belangen of het bezit van
      of de transacties met effecten, indien daarvoor naar het oordeel van Onze Minister of de aangewezen functionaris,
      bedoeld in het eerste lid, aanleiding bestaat op grond van de melding of na de melding gebleken feiten of
      omstandigheden.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel61a
  - number: 61a.4
    text: |-
      Het is de ambtenaar verboden financiële belangen te hebben, effecten te bezitten of effectentransacties te
      verrichten waardoor de goede vervulling van zijn functie of het goed functioneren van de openbare dienst, voorzover
      dit in verband staat met zijn functievervulling, niet in redelijkheid zou zijn verzekerd.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel61a
  - number: 61a.5
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de melding, bedoeld in het eerste lid, de
      registratie, bedoeld in het tweede lid, en het verbod, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel61a
  - number: '62.1'
    text: |-
      Het is den ambtenaar verboden, middellijk of onmiddellijk deel te nemen aan aannemingen en leveringen ten behoeve
      van openbare diensten, tenzij daarvoor toestemming is verleend.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel62
  - number: '62.2'
    text: |-
      Hij is verplicht zich te gedragen naar hetgeen voor hem is bepaald ten aanzien van het deelnemen, middellijk of
      onmiddellijk, aan aannemingen en leveringen ten behoeve van anderen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel62
  - number: 63a.1
    text: |-
      De ambtenaar, die een besturende, beherende dan wel toezichthoudende functie vervult in een naamloze vennootschap
      of ander rechtspersoonlijkheid bezittend lichaam, en voor de in die functie verrichte of te verrichten
      werkzaamheden, anders dan uit ’s Rijks kas, een vergoeding ontvangt, is verplicht die vergoeding in genoemde kas te
      storten, indien de benoeming in die functie
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel63a
  - number: 63a.1.a
    text: heeft plaats gehad door dan wel in overeenstemming met Onze Minister;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel63a
  - number: 63a.1.b
    text: |-
      is voortgevloeid uit een wettelijk voorschrift dan wel uit een overeenkomst, welke met instemming van Onze Minister
      of de Raad van Ministers is tot stand gekomen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel63a
  - number: 63a.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van de ambtenaar die werkzaamheden vervult die verband
      houden met het door hem beklede ambt en hem zijn opgedragen door Onze Minister, en die voor die werkzaamheden,
      anders dan uit ’s Rijks kas, een vergoeding ontvangt.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel63a
  - number: 63a.3
    text: De vorige leden vinden geen toepassing in de gevallen, waarin dit door Onze Minister-President is bepaald.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel63a
  - number: '64.1'
    text: |-
      Het is den ambtenaar in zijn ambt verboden, anders dan met goedvinden van het bevoegd gezag, vergoedingen,
      belooningen, giften of beloften van derden te vorderen, te verzoeken of aan te nemen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel64
  - number: '64.2'
    text: Het aannemen van steekpenningen is onvoorwaardelijk en ten strengste verboden.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel64
  - number: '65'
    text: |-
      De ambtenaar is verplicht de dienstkleding en de onderscheidingstekenen te dragen, voor zover dit door Onze
      Minister voorgeschreven is.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel65
  - number: '66.1'
    text: |-
      De ambtenaar kan worden verplicht tot geheele of gedeeltelijke vergoeding van de door den dienst geleden schade,
      voor zoover deze aan hem is te wijten.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel66
  - number: '66.2'
    text: |-
      Het bedrag van de schadevergoeding wordt niet vastgesteld, dan nadat de ambtenaar in de gelegenheid is gesteld zich
      schriftelijk of mondeling te verantwoorden.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel66
  - number: '67'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan regels stellen ten aanzien van telewerken. Deze
      regels hebben in ieder geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel67
  - number: 67.a
    text: de inrichting van de telewerkplek;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel67
  - number: 67.b
    text: de beschikbaarstelling door het bevoegd gezag van apparatuur;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel67
  - number: 67.c
    text: de wijze waarop de werkcontacten tussen de ambtenaar en zijn dienstonderdeel zullen plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel67
  - number: 67.d
    text: de wijze waarop wordt voorzien in een vergoeding van de door de ambtenaar gemaakte kosten;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel67
  - number: 67.e
    text: de wijze waarop het overleg met de vertegenwoordigers van het personeel wordt gevoerd.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel67
  - number: '68.1'
    text: De ambtenaar heeft recht op vergoeding wegens reis- en verblijfkosten ter zake van dienstreizen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel68
  - number: '68.2'
    text: Deze vergoeding wordt vastgesteld overeenkomstig de daarvoor gestelde regels.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel68
  - number: 68a.1
    text: |-
      De ambtenaar die een functie als bedoeld in het derde lid uitoefent of ten minste drie maanden waarneemt, ontvangt
      een maandelijkse tegemoetkoming in verband met representatiekosten.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel68a
  - number: 68a.2
    text: |-
      In deze bepaling wordt onder representatiekosten verstaan de door de ambtenaar gemaakte of te maken kosten in
      verband met de eisen die de uitoefening van de functie stelt ten aanzien van het onderhouden van externe contacten
      en het verrichten van representatieve activiteiten, waaronder worden begrepen de kosten in verband met:
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel68a
  - number: 68a.2.a
    text: huur of aanschaf van kleding en schoeisel of andere persoonlijke attributen;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel68a
  - number: 68a.2.b
    text: aanpassing en inrichting van de eigen woning;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel68a
  - number: 68a.2.c
    text: persoonlijke verzorging;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel68a
  - number: 68a.2.d
    text: contributies en lidmaatschappen;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel68a
  - number: 68a.2.e
    text: ontvangsten van bescheiden omvang in de eigen woning;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel68a
  - number: 68a.2.f
    text: het aanbieden van lunches, diners en overige consumpties, persoonlijke attenties en geschenken, en
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel68a
  - number: 68a.2.g
    text: fooien.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel68a
  - number: 68a.3
    text: 'De tegemoetkoming, bedoeld in het eerste lid, bedraagt:'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel68a
  - number: 68a.3.a
    text: |-
      voor een functie, genoemd in [artikel 7, vierde lid][ref1]: € 533,33;


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel7
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel68a
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
  - number: 68a.3.b
    text: 'voor het structurele plaatsvervangerschap van een functie als bedoeld onder a: 75% van het onder a genoemde bedrag;'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel68a
  - number: 68a.3.c
    text: |-
      voor de functie van directeur of daarmee door het bevoegd gezag voor de toepassing van dit artikel gelijk te
      stellen functie: 50% van het onder a genoemde bedrag;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel68a
  - number: 68a.3.d
    text: |-
      voor een andere functie waaraan representatiekosten zijn verbonden, voor zover deze functie is vermeld op een
      daartoe door het bevoegd gezag vastgestelde lijst: het bij die functie vermelde bedrag dat maximaal 25% van het
      onder a genoemde bedrag kan zijn.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel68a
  - number: 68a.4
    text: |-
      Indien de ambtenaar op grond van het derde lid in aanmerking zou komen voor meer dan één tegemoetkoming ontvangt
      hij uitsluitend de tegemoetkoming met het hoogste bedrag.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel68a
  - number: 68a.5
    text: |-
      In afwijking van het derde lid, aanhef en onder d, kan in bijzondere gevallen een hogere tegemoetkoming aan de
      betrokken ambtenaar worden toegekend, die maximaal gelijk is aan het bedrag, bedoeld in het derde lid, onder c.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel68a
  - number: 68a.6
    text: |-
      De tegemoetkoming wordt niet uitbetaald vanaf de eerste dag van de kalendermaand volgend op die waarin de
      ambtenaar in het geheel geen dienst heeft verricht, tenzij het niet verrichten van de dienst het gevolg is van
      vakantieverlof of ziekte voor zover het de eerste vier weken van de ziekte betreft. De uitbetaling wordt hervat in
      de kalendermaand volgend op die waarin de ambtenaar zijn dienst heeft hervat.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel68a
  - number: 68a.7
    text: |-
      De ambtenaar die een tegemoetkoming als bedoeld in het eerste lid ontvangt, kan geen representatiekosten
      declareren.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel68a
  - number: 68a.8
    text: |-
      Aan de ambtenaar die geen tegemoetkoming als bedoeld in het eerste lid ontvangt, of de ambtenaar, bedoeld in het
      eerste lid, die kosten voor representatieve activiteiten heeft gemaakt, die niet zijn genoemd in het tweede lid,
      kunnen daadwerkelijk gemaakte representatiekosten geheel of gedeeltelijk worden vergoed, indien:
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel68a
  - number: 68a.8.a
    text: |-
      het onderhouden van externe contacten en het verrichten van representatieve activiteiten plaatsvindt met
      voorafgaande toestemming van of in opdracht van het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel68a
  - number: 68a.8.b
    text: |-
      de declaratie van representatiekosten is ingediend binnen zes maanden na de kalendermaand waarin de kosten zijn
      gemaakt, en
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel68a
  - number: 68a.8.c
    text: daarbij door de ambtenaar bewijsstukken worden overgelegd waaruit blijkt dat de kosten daadwerkelijk zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel68a
  - number: 68a.9
    text: |-
      Het bedrag, bedoeld in het derde lid, onder a, wordt per 1 januari van elk jaar bij regeling van Onze Minister
      voor Wonen en Rijksdienst aangepast voor zover de consumentenprijsindex van het Centraal bureau voor de statistiek,
      geldend voor de maand september van het voorafgaande jaar, daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel68a
  - number: '69.1'
    text: |-
      Onze Minister kan naar billijkheid de ambtenaar schadeloos stellen, kosten vergoeden of overigens een geldelijke
      tegemoetkoming verlenen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel69
  - number: '69.2'
    text: |-
      De ambtenaar en de gewezen ambtenaar die een beroepsincident als bedoeld in [artikel 35][ref1], hebben gehad,
      hebben recht op volledige vergoeding van de schade die zij ten gevolge van dat beroepsincident lijden. In
      overeenstemming met de ambtenaar kan deze vergoeding mede strekken ter vervanging van de uitkering, bedoeld in
      [artikel 38, zevende lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel38
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '35'
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '38'
        hoofdstuk: VI
        paragraaf: '3'
  - number: '69.3'
    text: |-
      Onze Minister is bevoegd omtrent schadeloosstelling, kostenvergoedingen en overige geldelijke tegemoetkomingen aan
      groepen van ambtenaren in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties regels
      te geven.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel69
  - number: '69.4'
    text: |-
      Bij ministeriële regeling kan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties regels stellen omtrent de
      schadeloosstelling, kostenvergoedingen en overige geldelijke tegemoetkomingen aan groepen van ambtenaren.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel69
  - number: '70.1'
    text: |-
      De ambtenaar, die in contact staat of kort geleden gestaan heeft met een persoon, die een ziekte heeft, waarvoor
      ingevolge het krachtens de [Wet publieke gezondheid][ref1] bepaalde een nominatieve aangifteplicht geldt, mag zijn
      dienst niet verrichten en heeft geen toegang tot dienstgebouwen, -lokalen en -terreinen dan met toestemming van het
      bevoegd gezag, dat deze toestemming slechts kan verlenen na positief medisch advies van de deskundige persoon of de
      arbodienst, bedoeld in [hoofdstuk VI][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024705
      [ref2]: https://wetten.overheid.nl/BWBR0001950#HoofdstukVI
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0024705
      - id: ref2
        bwb_id: BWBR0001950
        hoofdstuk: VI
  - number: '70.2'
    text: |-
      De ambtenaar, die verkeert in de in het vorige lid omschreven situatie, is verplicht daarvan ten spoedigste
      kennis te geven aan de deskundige persoon of de arbodienst, bedoeld in [hoofdstuk VI][ref1]. Hij is gehouden
      zich te gedragen naar de vanwege de deskundige persoon of de arbodienst, bedoeld in [hoofdstuk VI][ref2] gegeven
      aanwijzingen, waaronder die met betrekking tot het ondergaan van een arbeidsgezondheidskundig onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#HoofdstukVI
      [ref2]: https://wetten.overheid.nl/BWBR0001950#HoofdstukVI
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0001950
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0001950
        hoofdstuk: VI
  - number: '70.3'
    text: |-
      Gedurende de periode dat de ambtenaar ingevolge het bepaalde in dit artikel zijn dienst niet verricht, geniet hij
      zijn volle bezoldiging.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel70
  - number: '71.1'
    text: |-
      Met de ambtenaar wordt minimaal een keer per jaar door een functionaris, aangewezen door het bevoegd gezag,
      gesproken over:
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel71
  - number: 71.1.a
    text: |-
      de wijze waarop de ambtenaar de opgedragen werkzaamheden heeft uitgevoerd en de resultaten die daarbij zijn
      gehaald;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel71
  - number: 71.1.b
    text: de omstandigheden waaronder de opgedragen werkzaamheden zijn uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel71
  - number: 71.1.c
    text: welke werkzaamheden de ambtenaar zullen worden opgedragen en welke resultaten daarbij behaald moeten worden;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel71
  - number: 71.1.d
    text: de omstandigheden waaronder die op te dragen werkzaamheden zullen worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel71
  - number: 71.1.e
    text: de wijze waarop de persoonlijke ontwikkeling van de ambtenaar bevorderd kan worden.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel71
  - number: '71.2'
    text: |-
      Indien de ambtenaar gedurende vijf aaneengesloten jaren dezelfde functie heeft vervuld, wordt in het gesprek als
      bedoeld in het eerste lid specifieke aandacht besteed aan de continuering van de loopbaan.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel71
  - number: '71.3'
    text: Van het met de ambtenaar besprokene wordt een schriftelijk verslag gemaakt.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel71
  - number: '71.4'
    text: Over de in het eerste lid, onder c, d en e, genoemde onderwerpen worden met de ambtenaar afspraken gemaakt.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel71
  - number: '71.5'
    text: |-
      Onze Minister stelt vast aan welke eisen een gesprek als bedoeld in het eerste lid alsmede een verslag daarvan
      moet voldoen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel71
  - number: 71a.1
    text: Indien het bevoegd gezag dit wenselijk vindt of de ambtenaar dit aanvraagt, wordt een beoordeling opgemaakt.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel71a
  - number: 71a.2
    text: |-
      Een beoordeling wordt eerst vastgesteld nadat deze met de ambtenaar is besproken en hij zijn zienswijze kenbaar
      heeft kunnen maken.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel71a
  - number: 71a.3
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt nadere regels omtrent het opmaken en vaststellen
      van beoordelingen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel71a
  - number: 71b.1
    text: |-
      De ambtenaar die ten minste drie jaar een functie dan wel vergelijkbare of uitwisselbare functies vervult, heeft
      de mogelijkheid om, op kosten van het bevoegd gezag, eenmaal per vijf jaar een vertrouwelijke loopbaanscan te doen,
      met behulp van een professionele loopbaandeskundige.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel71b
  - number: 71b.2
    text: |-
      De ambtenaar kan de uitkomsten van de loopbaanscan inbrengen in het gesprek, bedoeld in [artikel 71][ref1], ter
      ondersteuning van het maken van afspraken over de verdere loopbaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel71
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel71b
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '71'
        hoofdstuk: VIIa
  - number: '72'
    text: Verplichting tot zekerheidsstelling wordt den ambtenaar niet opgelegd.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel72
  - number: '73.1'
    text: |-
      De ambtenaar die namens een minister is belast met de in artikel 24, tweede en derde lid, van de Comptabiliteitswet
      2001 vermelde taken, is verplicht een tekort geheel of gedeeltelijk aan te zuiveren, wanneer hem ter zake van dat
      tekort een ernstig verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel73
  - number: '73.2'
    text: |-
      De ambtenaar die namens een minister is belast met het in artikel 25, tweede lid, van de Comptabiliteitswet 2001
      bedoelde beheer, is verplicht schade te vergoeden, wanneer hem ter zake van die schade een ernstig verwijt kan
      worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel73
  - number: '76'
    text: |-
      Aan de vrouwelijke ambtenaar, die een borstkind heeft en hiervan aan het hoofd van dienst heeft kennis gegeven,
      behoort gelegenheid te worden gegeven haar kind te zoogen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel76
  - number: '77.1'
    text: |-
      Aan den ambtenaar kan door het bevoegd gezag de toegang tot de dienstlokalen, dienstgebouwen of het werk, dan wel
      het verblijf aldaar, worden ontzegd.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel77
  - number: '77.2'
    text: |-
      Hij is verplicht zich te gedragen naar de maatregelen van orde, die ten aanzien van het verblijf aldaar zijn
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel77
  - number: '78'
    text: |-
      Het is den ambtenaar verboden gedurende den werktijd alcoholhoudende dranken te gebruiken, bij zich te hebben of in
      de dienstlokalen te bewaren.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel78
  - number: '79.1'
    text: |-
      De ambtenaar heeft aanspraak op een gratificatie bij ambtsjubileum volgens door Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties te stellen regels.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel79
  - number: '79.2'
    text: |-
      De ambtenaar die een diensttijd heeft van tien jaar of meer en aan wie ontslag is verleend op grond van
      [artikel 96][ref1] of [98, eerste lid, onder f][ref2], wordt een diensttijdgratificatie toegekend, indien binnen
      een termijn van vijf jaar na de datum van ingang van het ontslag aanspraak op een gratificatie bij ambtsjubileum
      zou hebben bestaan. De diensttijdgratificatie bedraagt een in verhouding tot de doorgebrachte diensttijd evenredig
      gedeelte van een gratificatie bij ambtsjubileum als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel96
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel98
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '96'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '98'
        hoofdstuk: X
  - number: '80.1'
    text: |-
      De ambtenaar, die de hem opgelegde verplichtingen niet nakomt of zich overigens aan plichtsverzuim schuldig maakt,
      kan deswege disciplinair worden gestraft.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel80
  - number: '80.2'
    text: |-
      Plichtsverzuim omvat zowel het overtreden van enig voorschrift als het doen of nalaten van iets, hetwelk een goed
      ambtenaar in gelijke omstandigheden behoort na te laten of te doen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel80
  - number: '80.3'
    text: |-
      Tenzij door Ons of met Onze machtiging door Onze Minister anders is bepaald, wordt de straf opgelegd door het
      gezag, dat bevoegd is tot aanstelling in het door de ambtenaar beklede ambt. Indien deze bevoegdheid bij Ons
      berust, geschiedt de bestraffing, behalve voor zover betreft de straffen genoemd in artikel 81, eerste lid, onder
      *i* en *l*, door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel80
  - number: '81.1'
    text: 'De disciplinaire straffen, welke kunnen worden opgelegd, zijn:'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel81
  - number: 81.1.a
    text: schriftelijke berisping;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel81
  - number: 81.1.b
    text: |-
      buitengewone dienst op andere dagen dan zondag en de voor de ambtenaar geldende kerkelijke feestdagen, zonder
      beloning of tegen een lagere dan de normale beloning en wel voor ten hoogste 6 uren met een maximum van 3 uren
      per dag;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel81
  - number: 81.1.c
    text: |-
      vermindering van het recht op jaarlijkse vakantie met ten hoogste 1/3 van het aantal uren, waarop in het
      desbetreffende kalenderjaar aanspraak bestaat;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel81
  - number: 81.1.d
    text: geldboete van ten hoogste € 22;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel81
  - number: 81.1.e
    text: gehele of gedeeltelijke inhouding van salaris tot een bedrag van ten hoogste het salaris over een halve maand;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel81
  - number: 81.1.f
    text: |-
      vaststelling van het salaris op een bedrag in de voor de ambtenaar geldende salarisschaal dat maximaal
      twee jaarlijkse periodieke salarisverhogingen minder bedraagt dan ingevolge de op hem van toepassing zijnde
      bezoldigingsregeling behoort te gelden, of indien voor het door de ambtenaar beklede ambt geen salarisschaal geldt,
      vermindering van het salaris met ten hoogste 5%, een en ander voor de tijd van niet langer dan twee jaren;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel81
  - number: 81.1.g
    text: het niet toekennen van periodieke salarisverhogingen gedurende ten hoogste vier jaren;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel81
  - number: 81.1.h
    text: |-
      uitsluiting voor de tijd van ten hoogste vier jaren van indeling in een salarisschaal waarvoor een hoger
      maximumsalaris geldt, indien zodanige indeling anders volgens de daarvoor geldende regeling zou hebben
      plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel81
  - number: 81.1.i
    text: |-
      indeling in een salarisschaal waarvoor een lager maximumsalaris geldt dan dat verbonden aan de salarisschaal
      welke ingevolge de van toepassing zijnde bezoldigingsregeling behoort te gelden, een en ander al dan niet voor een
      bepaalde tijd en met of zonder vermindering van bezoldiging;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel81
  - number: 81.1.j
    text: |-
      verplaatsing, al dan niet met verlening van een tegemoetkoming in mogelijke verplaatsingskosten tot ten hoogste
      het bedrag, dat in geval van verplaatsing in het belang van de dienst zou kunnen worden verleend krachtens het
      [Verplaatsingskostenbesluit 1989][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004630
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0004630
  - number: 81.1.k
    text: schorsing voor een bepaalde tijd met gehele of gedeeltelijke inhouding van bezoldiging;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel81
  - number: 81.1.l
    text: ontslag.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel81
  - number: '81.2'
    text: |-
      Indien een straf, als bedoeld in het eerste lid onder *g*, *h* of *i* is opgelegd, kan - zo het verdere gedrag van
      de ambtenaar naar het oordeel van het tot oplegging van de straf bevoegd gezag daartoe aanleiding heeft gegeven
        - zijn positie met ingang van een bepaald tijdstip geheel of ten dele in overeenstemming worden gebracht met de
      positie, zoals deze zonder de strafoplegging zou zijn geweest.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel81
  - number: '81.3'
    text: |-
      Bij het opleggen van een straf kan worden bepaald, dat zij niet ten uitvoer zal worden gelegd, indien de ambtenaar
      zich gedurende een vastgestelde termijn niet schuldig maakt aan soortgelijk plichtsverzuim, als waarvoor de
      bestraffing plaats vindt, noch aan enig ander ernstig plichtsverzuim en zich houdt aan bij het opleggen van de
      straf eventueel gestelde bijzondere voorwaarden.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel81
  - number: '82.1'
    text: |-
      Indien de ambtenaar verantwoording aflegt doet hij dit ten overstaan van het gezag dat tot de voorgenomen
      strafoplegging bevoegd is, of van een door dit gezag aangewezen autoriteit, tenzij bij koninklijk besluit anders
      wordt bepaald. Indien deze bevoegdheid bij Ons berust, geschiedt de verantwoording ten overstaan van Onze Minister
      of van een door deze aangewezen autoriteit. Het gezag, ten overstaan waarvan de verantwoording zal plaats vinden,
      bepaalt of deze mondeling of schriftelijk zal geschieden, met dien verstande dat bij schriftelijke verantwoording
      de ambtenaar op zijn verzoek gelegenheid wordt gegeven tot nadere mondelinge toelichting.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel82
  - number: '82.2'
    text: |-
      Van de mondelinge verantwoording en van een eventuele nadere mondelinge toelichting wordt aanstonds proces-verbaal
      opgemaakt, dat na voorlezing wordt getekend door hem, te wiens overstaan de verantwoording heeft plaats gevonden,
      en door de ambtenaar. Weigert de ambtenaar de ondertekening, dan wordt daarvan in het proces-verbaal, zo mogelijk
      met vermelding van de redenen, melding gemaakt. Een afschrift van het proces-verbaal wordt aan de ambtenaar
      uitgereikt.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel82
  - number: 82a
    text: |-
      De ambtenaar kan niet gestraft worden wegens overtreding van [artikel 125][ref1], dan nadat daarover advies is
      ingewonnen van de Adviescommissie grondrechten en functie-uitoefening ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125a
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel82a
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: 125a
  - number: '83'
    text: |-
      De ambtenaar dient van de ontvangst van een besluit inzake strafoplegging te doen blijken door onverwijlde
      terugzending van een door hem ondertekend en gedateerd ontvangstbewijs.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel83
  - number: '84'
    text: |-
      De straf, behalve die van schriftelijke berisping, wordt niet ten uitvoer gelegd, zolang zij niet onherroepelijk is
      geworden, tenzij bij de strafoplegging onmiddellijke tenuitvoerlegging is bevolen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel84
  - number: '90'
    text: |-
      De ambtenaar is van rechtswege in zijn ambt geschorst, wanneer hij krachtens wettelijke maatregel van zijn
      vrijheid is beroofd, tenzij de vrijheidsbeneming het gevolg is van een maatregel, anders dan op grond van de
      [Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref1], genomen in het belang van de volksgezondheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005700
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0005700
  - number: '91.1'
    text: |-
      Onverminderd het bepaalde in [artikel 81, eerste lid onder k][ref1], kan de ambtenaar in zijn ambt worden
      geschorst:


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel81
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '81'
        hoofdstuk: VIII
  - number: 91.1.a
    text: Indien een strafrechtelijke vervolging ter zake van misdrijf tegen hem is ingesteld;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel91
  - number: 91.1.b
    text: |-
      wanneer hem door het daartoe bevoegde gezag het voornemen tot bestraffing met onvoorwaardelijk ontslag is te kennen
      gegeven, dan wel hem die straf is opgelegd;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel91
  - number: 91.1.c
    text: wanneer, naar het oordeel van het bevoegde gezag, het belang van de dienst zulks vordert.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel91
  - number: '91.2'
    text: |-
      Schorsing geschiedt door het gezag, dat bevoegd is tot aanstelling in het ambt, waarin geschorst wordt. Berust die
      bevoegdheid bij Ons, dan geschiedt de schorsing door Onze minister.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel91
  - number: '92.1'
    text: |-
      Tijdens de schorsing kan de bezoldiging voor één derde gedeelte worden ingehouden; na verloop van zes weken kan
      een verdere inhouding, ook van het volle bedrag der bezoldiging, plaatsvinden. Geen inhouding vindt plaats in
      geval van schorsing in het belang van de dienst, bedoeld in het eerste lid onder *c* van het vorige artikel, van
      plaatsing in een krankzinnigengesticht of daarmede gelijk te stellen inrichting dan wel van politiebewaring of
      inverzekeringstelling als bedoeld in [artikel 57 van het Wetboek van Strafvordering][ref1], mits niet gevolgd door
      inbewaringstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel57
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '57'
  - number: '92.2'
    text: |-
      De ingehouden bezoldiging kan alsnog geheel of gedeeltelijk aan de ambtenaar worden uitbetaald, indien de schorsing
      niet wordt gevolgd door een onvoorwaardelijk ontslag bij wijze van straf of ontslag op grond van artikel 98, eerste
      lid onder *e.* Op de aldus uit te keren bezoldiging worden in mindering gebracht de inkomsten, welke de ambtenaar
      sedert de schorsing heeft genoten uit arbeid, die hij als gevolg van de schorsing heeft kunnen verrichten, tenzij
      zulks, naar het oordeel van het bevoegde gezag, onredelijk of onbillijk is.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel92
  - number: '92.3'
    text: Het niet ingehouden gedeelte van de bezoldiging van de geschorste ambtenaar kan aan anderen worden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel92
  - number: '92.4'
    text: |-
      In geval van schorsing tijdens ziekte van de ambtenaar wordt onder bezoldiging verstaan, hetgeen daaronder voor de
      toepassing van hoofdstuk VI wordt verstaan.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel92
  - number: '93'
    text: |-
      Ontslag wordt gegeven door het gezag dat bevoegd is tot aanstelling in het desbetreffende ambt. De
      voordracht voor het ontslag van de ambtenaar, bedoeld in [artikel 4, vijfde lid, onder a][ref1], geschiedt
      door Onze minister van Binnenlandse Zaken en Koninkrijksrelaties. Het ontslag van de ambtenaar, bedoeld in
      [artikel 4, vijfde lid, onder b of c][ref2], vindt plaats in overeenstemming met Onze minister van Binnenlandse
      Zaken en Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel4
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '4'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '4'
        hoofdstuk: I
  - number: '94.1'
    text: De ambtenaar wordt op zijn aanvraag ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94
  - number: '94.2'
    text: |-
      Behoudens in het geval, bedoeld in artikel 34*e*, eerste lid, wordt dit ontslag verleend met ingang van een dag
      niet vroeger dan een maand of later dan drie maanden na de dag, waarop de aanvraag om ontslag is ingekomen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94
  - number: '94.3'
    text: |-
      Van het bepaalde in het eerste lid kan worden afgeweken, indien een strafrechtelijke vervolging ter zake van
      misdrijf tegen de ambtenaar is ingesteld of indien wordt overwogen de disciplinaire straf van ontslag op te leggen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94
  - number: '94.4'
    text: 'Van het bepaalde in het tweede lid kan worden afgeweken:'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94
  - number: 94.4.a
    text: indien wordt overwogen de ambtenaar een disciplinaire straf op te leggen;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94
  - number: 94.4.b
    text: |-
      indien het belang van de dienst zulks vordert, met dien verstande, dat de termijn van drie maanden, vermeld in het
      tweede lid, tot ten hoogste zes maanden kan worden verlengd en dat bij de verlenging in redelijkheid met het belang
      van de ambtenaar rekening wordt gehouden;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94
  - number: 94.4.c
    text: ingevolge een aanvraag van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94
  - number: '94.5'
    text: Het ontslag op aanvraag van de ambtenaar wordt eervol verleend.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94
  - number: 94a.1
    text: |-
      Aan de ambtenaar die ontslag vraagt met het oog op een uitkering op grond van de
      [Wet kaderregeling vut overheidspersoneel][ref1] en een ontslaguitkering van de Stichting Pensioenfonds ABP
      ten aanzien van overheidspersoneel, wordt ontslag verleend indien het bestuur van de Stichting fonds vrijwillig
      vervroegd uittreden overheidspersoneel en het bestuur van de Stichting Pensioenfonds ABP op grond van een
      desbetreffende aanvraag hebben vastgesteld dat na het te verlenen ontslag recht bestaat op een uitkering. Het
      ontslag gaat niet eerder in dan met ingang van de dag waarop het recht op de in de vorige volzin bedoelde uitkering
      ontstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0007792
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94a
    references:
      - id: ref1
        bwb_id: BWBR0007792
  - number: 94a.2
    text: |-
      Op aanvraag van de ambtenaar kan het in het eerste lid bedoelde ontslag ook voor een gedeelte van de voor hem
      geldende arbeidsduur worden verleend, tenzij de belangen van de dienst zich hiertegen verzetten. Het gedeelte van
      dit ontslag bedraagt ten minste 10% van de arbeidsduur. Ontslag voor een gedeelte van de arbeidsduur waaruit reeds
      eerder gedeeltelijk ontslag met het oog op de in het eerste lid bedoelde uitkering heeft plaatsgevonden, bedraagt
      ten minste 10% van de oorspronkelijke arbeidsduur.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94a
  - number: 94a.3
    text: |-
      [Artikel 94, tweede tot en met vijfde lid][ref1], is zoveel mogelijk van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel94
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94a
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '94'
        hoofdstuk: X
  - number: 94b.1
    text: |-
      Bij regeling van Onze Minister voor Wonen en Rijksdienst worden functies aangewezen die uit hoofde van de aard van
      de aan die functies verbonden werkzaamheden als substantieel bezwarend worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94b
  - number: 94b.2
    text: |-
      Aan de ambtenaar die is belast met een functie die is aangemerkt als substantieel bezwarend wordt op zijn verzoek
      eervol ontslag verleend met het oog op een uitkering op grond van het achtste lid, indien onmiddellijk voorafgaand
      aan het ontslag een aaneengesloten diensttijd van ten minste vijf jaar is doorgebracht in een of meer substantieel
      bezwarende functies.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94b
  - number: 94b.3
    text: |-
      Het ontslag, bedoeld in het tweede lid, kan niet eerder ingaan dan met ingang van de eerst
      mogelijke datum waarop het ouderdomspensioen op grond van de overeenkomst, bedoeld in
      [artikel 4, eerste lid, van de Wet privatisering ABP][ref1], in kan gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel4
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94b
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '4'
  - number: 94b.4
    text: |-
      Op aanvraag van de ambtenaar kan het ontslag voor een gedeelte van de voor hem geldende arbeidsduur worden
      verleend. Dit gedeelte bedraagt ten minste 10% en ten hoogste 50% van de omvang van de voor hem geldende
      arbeidsduur.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94b
  - number: 94b.5
    text: |-
      Het vierde lid is niet van toepassing indien de werktijd van de ambtenaar is teruggebracht op grond van
      [artikel 21a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel21a
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94b
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 21a
        hoofdstuk: IV
  - number: 94b.6
    text: |-
      Na het ontslag, bedoeld in het vierde lid, kan op aanvraag van de ambtenaar ontslag worden verleend voor de
      resterende arbeidsduur.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94b
  - number: 94b.7
    text: |-
      Ontslag uit een substantieel bezwarende functie wordt uiterlijk verleend op de dag waarop de pensioengerechtigde
      leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], is bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94b
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 94b.8
    text: |-
      De ambtenaar, aan wie op grond van het tweede, vierde of zesde lid voor het bereiken van de pensioengerechtigde
      leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1] ontslag is verleend, heeft recht
      op een uitkering. Onze Minister voor Wonen en Rijksdienst stelt regels over de uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94b
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 94b.9
    text: |-
      Het tweede tot en met achtste lid zijn niet van toepassing op de ambtenaar die gebruik heeft gemaakt van de
      op grond van [artikel 60][ref1], door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties vastgestelde
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel60
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94b
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '60'
        hoofdstuk: VIIa
  - number: 94c.1
    text: 'Onze Minister voor Wonen en Rijksdienst stelt bij ministeriële regeling een lijst vast met:'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94c
  - number: 94c.1.a
    text: functies waarvan de aanmerking als substantieel bezwarend na 31 maart 2015 vervalt;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94c
  - number: 94c.1.b
    text: |-
      functies waarvan de aanmerking als substantieel bezwarend is vervallen in de periode van 1 januari 2000 tot en met
      31 maart 2015;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94c
  - number: 94c.1.c
    text: |-
      functies, bedoeld in [artikel 3 van het Besluit overgangsrecht FLO-functies][ref1], zoals dat luidde op 31 maart
      2015.


      [ref1]: https://wetten.overheid.nl/BWBR0010859#Artikel3
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94c
    references:
      - id: ref1
        bwb_id: BWBR0010859
        artikel: '3'
  - number: 94c.2
    text: |-
      De ambtenaar die een functie als bedoeld in het eerste lid vervult, kan het bevoegd gezag verzoeken om eervol
      ontslag met het oog op een uitkering als bedoeld in het zevende lid. Dit ontslag kan niet eerder ingaan dan
      met ingang van de eerst mogelijke datum waarop het ouderdomspensioen op grond van de overeenkomst, bedoeld in
      [artikel 4, eerste lid, van de Wet privatisering ABP][ref1], in kan gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel4
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94c
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '4'
  - number: 94c.3
    text: |-
      Aan de ambtenaar die een functie als bedoeld in het eerste lid, onder a, vervult, wordt ontslag als bedoeld in het
      tweede lid verleend, indien de ambtenaar voldoet aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94c
  - number: 94c.3.a
    text: |-
      de ambtenaar heeft op de dag waarop de aanmerking als substantieel bezwarende functie vervalt een aaneengesloten
      diensttijd van ten minste vijf jaar doorgebracht in een substantieel bezwarende functie en blijft deze functie
      vervullen tot zijn ontslag, en
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94c
  - number: 94c.3.b
    text: |-
      de ambtenaar is op de dag waarop de aanmerking als substantieel bezwarende functie vervalt maximaal vijf jaar
      verwijderd van de eerst mogelijke datum waarop zijn ouderdomspensioen op grond van de overeenkomst, bedoeld in
      [artikel 4, eerste lid, van de Wet privatisering ABP][ref1], in kan gaan of heeft op die dag een aaneengesloten
      diensttijd van ten minste twintig jaar doorgebracht in een substantieel bezwarende functie.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel4
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94c
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '4'
  - number: 94c.4
    text: |-
      Aan de ambtenaar die een functie als bedoeld in het eerste lid, onder b, vervult, wordt ontslag als bedoeld in het
      tweede lid verleend, indien de ambtenaar voldoet aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94c
  - number: 94c.4.a
    text: |-
      de ambtenaar heeft op de dag waarop de aanmerking als substantieel bezwarende functie is vervallen een
      aaneengesloten diensttijd van ten minste vijf jaar doorgebracht in een substantieel bezwarende functie en blijft
      deze functie vervullen tot zijn ontslag, en
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94c
  - number: 94c.4.b
    text: |-
      de ambtenaar is op 1 april 2015 maximaal vijf jaar verwijderd van de eerst mogelijke
      datum waarop zijn ouderdomspensioen op grond van de overeenkomst, bedoeld in
      [artikel 4, eerste lid, van de Wet privatisering ABP][ref1], in kan gaan of heeft op de dag waarop de aanmerking
      als substantieel bezwarende functie is vervallen een aaneengesloten diensttijd van ten minste twintig jaar
      doorgebracht in een substantieel bezwarende functie.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel4
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94c
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '4'
  - number: 94c.5
    text: |-
      Aan de ambtenaar die een functie als bedoeld in het eerste lid, onder c, vervult, wordt ontslag als bedoeld in het
      tweede lid verleend, indien de ambtenaar voldoet aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94c
  - number: 94c.5.a
    text: |-
      de ambtenaar heeft op 1 januari 2000 een aaneengesloten diensttijd van ten minste vijf jaar doorgebracht in een
      functie als bedoeld in het eerste lid, onder c, en blijft deze functie vervullen tot zijn ontslag, en
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94c
  - number: 94c.5.b
    text: |-
      de ambtenaar is met ingang van 1 april 2015 maximaal vijf jaar verwijderd van de eerst
      mogelijke datum waarop zijn ouderdomspensioen op grond van de overeenkomst, bedoeld in
      [artikel 4, eerste lid, van de Wet privatisering ABP][ref1], in kan gaan of heeft op 1 januari 2000 een
      aaneengesloten diensttijd van ten minste twintig jaar doorgebracht in een FLO-functie.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel4
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94c
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '4'
  - number: 94c.6
    text: |-
      Bij ontslag op grond van het tweede lid zijn [artikel 94b, vierde, vijfde en zesde lid][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel94b
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94c
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 94b
        hoofdstuk: X
  - number: 94c.7
    text: |-
      De ambtenaar aan wie op grond van dit artikel voor het bereiken van de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], ontslag is verleend, heeft recht op een uitkering.
      Onze Minister voor Wonen en Rijksdienst stelt regels over de uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel94c
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: '95.1'
    text: |-
      Aan de ambtenaar die is aangesteld in tijdelijke dienst wordt geacht eervol ontslag te zijn verleend zodra de duur
      van de aanstelling in tijdelijke dienst is verstreken, tenzij sprake is van een stilzwijgende voortzetting als
      bedoeld in artikel 6, vierde of vijfde lid.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel95
  - number: '95.2'
    text: |-
      Aan de ambtenaar die is aangesteld in tijdelijke dienst kan ontslag worden verleend, mits een opzegtermijn in acht
      wordt genomen van:
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel95
  - number: 95.2.a
    text: |-
      drie maanden, indien de ambtenaar ten tijde van de opzegging laatstelijke tenminste twaalf maanden onafgebroken in
      dienst is geweest;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel95
  - number: 95.2.b
    text: |-
      twee maanden, indien de ambtenaar ten tijde van de opzegging laatstelijke tenminste zes maanden doch korter dan
      twaalf maanden onafgebroken in dienst is geweest;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel95
  - number: 95.2.c
    text: |-
      één maand, indien de ambtenaar ten tijde van de opzegging laatstelijk korter dan zes maanden onafgebroken in dienst
      is geweest.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel95
  - number: '95.3'
    text: |-
      Opzegging als in het vorige lid bedoeld kan niet geschieden gedurende de zwangerschap van de vrouwelijke ambtenaar,
      noch gedurende het verlof bedoeld in artikel 33fb, vierde lid, noch – indien zij haar dienst heeft vervat –
      gedurende een periode van zes weken volgend op dat verlof. Het bevoegd gezag kan ter staving van de zwangerschap
      een verklaring van een arts of van een verloskundige verlangen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel95
  - number: '95.4'
    text: |-
      Opzegging als bedoeld in het tweede lid kan niet geschieden wegens het aanvragen of het opnemen van
      ouderschapsverlof.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel95
  - number: '95.5'
    text: |-
      Opzegging als bedoeld in het tweede lid kan niet geschieden wegens de omstandigheid dat de ambtenaar in of buiten
      rechte een beroep heeft gedaan op het beginsel van gelijke behandeling van mannen en vrouwen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel95
  - number: '95.6'
    text: |-
      Opzegging als bedoeld in het tweede lid kan niet plaatsvinden wegens het feit dat de ambtenaar door een
      centrale als bedoeld in artikel 105 of door een daarbij aangesloten vereniging is aangewezen om bestuurlijke
      of vertegenwoordigende aktiviteiten te ontplooien binnen zijn centrale of een daarbij aangesloten vereniging
      dan wel binnen de organisatie van de werkgever, die er toe strekken de doelstellingen van zijn centrale van
      overheidspersoneel en daarbij aangesloten verenigingen te ondersteunen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel95
  - number: '95.7'
    text: |-
      Opzegging als bedoeld in het tweede lid kan niet geschieden wegens de omstandigheid dat de ambtenaar is geplaatst
      op een kandidatenlijst als bedoeld in [artikel 9 van de Wet op de ondernemingsraden][ref1], noch wegens het
      lidmaatschap of het korter dan twee jaar geleden beëindigde lidmaatschap van de ambtenaar van de ondernemingsraad
      of van een commissie van die raad.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel9
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '9'
  - number: '95.8'
    text: |-
      Het ontslag kan, al dan niet op aanvraag van de ambtenaar, ingaan voor de afloop van de opzeggingstermijn.
      Indien dit niet op de aanvraag van de ambtenaar geschiedt, wordt hem over de tijd, welke aan de opzeggingstermijn
      ontbreekt, een bedrag uitbetaald gelijk aan de laatstgenoten bezoldiging, vermeerderd met de vakantie-uitkering en
      de eindejaarsuitkering.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel95
  - number: '96.1'
    text: |-
      De ambtenaar kan in het kader van een reorganisatie eervol ontslag worden verleend indien het niet mogelijk is
      gebleken om hem te herplaatsen in een passende functie.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel96
  - number: '96.2'
    text: |-
      Aan de ambtenaar die in het kader van een reorganisatie is herplaatst kan alsnog het ontslag, bedoeld in het eerste
      lid worden verleend indien binnen een periode van uiterlijk één jaar te rekenen vanaf de datum waarop de functie
      is opgedragen, blijkt dat de betreffende functie niet passend is voor die ambtenaar en het niet mogelijk is om de
      ambtenaar binnen een redelijke termijn op een passende functie te plaatsen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel96
  - number: '96.3'
    text: |-
      Bij een ontslagverlening op grond van het eerste lid van dit artikel wordt een opzeggingstermijn van drie maanden
      in acht genomen. Bij een ontslagverlening op grond van het tweede lid van dit artikel geldt geen opzeggingstermijn.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel96
  - number: 96a.1
    text: |-
      Aan de ambtenaar kan eervol ontslag worden verleend indien van hem in redelijkheid niet kan worden verlangd, dat
      hij zich zal voegen in zijn verplaatsing over een aanmerkelijke afstand tengevolge van een verplaatsing van zijn
      functie.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel96a
  - number: 96a.2
    text: |-
      Aan de ambtenaar kan binnen een periode van uiterlijk één jaar nadat hij is verplaatst over een aanmerkelijke
      afstand, alsnog het ontslag, bedoeld in het eerste lid worden verleend indien van hem in redelijkheid niet kan
      worden verlangd dat hij zich zal blijven voegen in zijn verplaatsing over een aanmerkelijke afstand tengevolge van
      een verplaatsing van zijn functie.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel96a
  - number: 96a.3
    text: De artikelen 49*h* tot en met 49*l*, 49*o* en 49*p* zijn op de ambtenaar van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel96a
  - number: 96b.1
    text: |-
      Aan de ambtenaar die in verband met de aanvaarding van een functie in een publiekrechtelijk college, waarin hij
      is benoemd of verkozen, tijdelijk is ontheven van de waarneming van zijn ambt, wordt, indien hij ophoudt zodanige
      functie te bekleden en hij naar het oordeel van het bevoegd gezag niet in actieve dienst kan worden hersteld,
      eervol ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel96b
  - number: 96b.2
    text: |-
      Tenzij [artikel 34e, eerste lid][ref1], van toepassing is, wordt eervol ontslag eveneens verleend aan de ambtenaar,
      die na afloop van het verlof, verleend met toepassing van [artikel 34, uitgezonderd het vierde en vijfde lid][ref2]
      en in verband met het vervullen van een functie bij een internationale volkenrechtelijke organisatie, naar het
      oordeel van het bevoegd gezag niet in actieve dienst kan worden hersteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel34e
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel34
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel96b
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 34e
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '34'
        hoofdstuk: V
        paragraaf: '2'
  - number: 96b.3
    text: |-
      Het eerste lid vindt eveneens toepassing voor de ambtenaar die ophoudt de functie te bekleden, bedoeld in
      [artikel 16, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel16
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel96b
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '16'
        hoofdstuk: III
  - number: 96c
    text: |-
      Aan de ambtenaar die een benoeming tot minister of staatssecretaris aanvaardt wordt, met ingang van de dag van het
      aanvaarden van deze betrekking, eervol ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel96c
  - number: 97b.1
    text: |-
      Voor de ontslagverlening als bedoeld in [artikel 125][ref1], is overeenstemming vereist met Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties. Deze is gehouden het advies in te winnen van de Adviescommissie
      grondrechten en functie-uitoefening ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125e
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel97b
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: 125e
  - number: 97b.2
    text: |-
      Indien het voornemen tot ontslagverlening afkomstig is van Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties is overeenstemming vereist met Onze Minister-President.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel97b
  - number: '98.1'
    text: |-
      Anders dan op aanvraag van de ambtenaar, bij wijze van straf of ingevolge het bepaalde bij
      [artikel 7 van de Wet Incompatibiliteiten Staten-Generaal en Europees Parlement][ref1], de [artikelen 94b][ref2],
      [94c][ref3], [95][ref4], [96][ref5], [96a][ref6], [96b][ref7] en [96][ref8] van dit besluit en bij
      [artikel 125e, tweede lid, van de Ambtenarenwet][ref9], kan de ambtenaar worden ontslagen op grond van:


      [ref1]: https://wetten.overheid.nl/BWBR0006612#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel94b
      [ref3]: https://wetten.overheid.nl/BWBR0001950#Artikel94c
      [ref4]: https://wetten.overheid.nl/BWBR0001950#Artikel95
      [ref5]: https://wetten.overheid.nl/BWBR0001950#Artikel96
      [ref6]: https://wetten.overheid.nl/BWBR0001950#Artikel96a
      [ref7]: https://wetten.overheid.nl/BWBR0001950#Artikel96b
      [ref8]: https://wetten.overheid.nl/BWBR0001950#Artikel96
      [ref9]: https://wetten.overheid.nl/BWBR0001947#Artikel125e
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0006612
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 94b
        hoofdstuk: X
      - id: ref3
        bwb_id: BWBR0001950
        artikel: 94c
        hoofdstuk: X
      - id: ref4
        bwb_id: BWBR0001950
        artikel: '95'
        hoofdstuk: X
      - id: ref5
        bwb_id: BWBR0001950
        artikel: '96'
        hoofdstuk: X
      - id: ref6
        bwb_id: BWBR0001950
        artikel: 96a
        hoofdstuk: X
      - id: ref7
        bwb_id: BWBR0001950
        artikel: 96b
        hoofdstuk: X
      - id: ref8
        bwb_id: BWBR0001950
        artikel: '96'
        hoofdstuk: X
      - id: ref9
        bwb_id: BWBR0001947
        artikel: 125e
  - number: 98.1.a
    text: |-
      het verlies van een vereiste voor de benoembaarheid, door het bevoegde gezag gesteld bij een regeling aan de
      benoeming voorafgegaan, tenzij het vereiste alleen voor de aanvang van het ambt geldt;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel98
  - number: 98.1.b
    text: het aangaan van een graad van zwagerschap, die de benoembaarheid tot het ambt zou uitsluiten;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel98
  - number: 98.1.c
    text: onherroepelijk geworden rechterlijke uitspraak, waarbij de ambtenaar onder curatele is gesteld;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel98
  - number: 98.1.d
    text: het ondergaan van lijfsdwang wegens schulden krachtens onherroepelijk geworden rechterlijke uitspraak;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel98
  - number: 98.1.e
    text: onherroepelijk geworden veroordeling tot vrijheidsstraf wegens misdrijf;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel98
  - number: 98.1.f
    text: ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel98
  - number: 98.1.g
    text: onbekwaamheid of ongeschiktheid voor het door hem beklede ambt, anders dan op grond van ziels- of lichaamsgebreken;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel98
  - number: 98.1.h
    text: het bereiken van de leeftijd van zeventig jaar;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel98
  - number: 98.1.i
    text: |-
      het bij of in verband met indiensttreding en/of keuring verstrekken van onjuiste of onvolledige inlichtingen,
      zonder welke handelwijze niet tot indienstneming of goedkeuring zou zijn overgegaan, tenzij de ambtenaar
      aannemelijk maakt dat hij te goeder trouw heeft gehandeld.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel98
  - number: '98.2'
    text: |-
      Een ontslag op grond van het bepaalde in het eerste lid onder *a*, *b*, *f*, *g* en *h* wordt steeds eervol
      verleend.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel98
  - number: '98.3'
    text: 'Een ontslag als bedoeld in het eerste lid, onderdeel *f*, kan slechts plaatsvinden indien:'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel98
  - number: 98.3.a
    text: |-
      er sprake is van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte gedurende een ononderbroken
      periode van twee jaar,
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel98
  - number: 98.3.b
    text: |-
      herstel van zijn ziekte niet binnen een periode van zes maanden na de in onderdeel *a* genoemde termijn van twee
      jaar te verwachten is, en
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel98
  - number: 98.3.c
    text: |-
      het bevoegd gezag van oordeel is dat duurzame reïntegratie in arbeid die aansluit bij de benutbare mogelijkheden
      van de ambtenaar, niet binnen een redelijke termijn te verwachten is.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel98
  - number: '98.4'
    text: 'De termijn van twee jaar, bedoeld in het derde lid, onderdeel a, wordt verlengd:'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel98
  - number: 98.4.a
    text: |-
      met de duur van de vertraging indien het bevoegd gezag de aangifte, bedoeld in
      [artikel 38, eerste lid, van de Ziektewet][ref1] later doet dan op grond van [dat artikel van de Ziektewet][ref2]
      is voorgeschreven;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel38
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '38'
  - number: 98.4.b
    text: |-
      met de duur van de verlenging van de wachttijd, bedoeld in [artikel 23, eerste lid, van de WIA][ref1], indien de
      wachttijd op grond van [artikel 24, eerste lid, van de WIA][ref2] wordt verlengd;


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel24
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '24'
  - number: 98.4.c
    text: |-
      met de duur van het tijdvak dat het UWV op grond van [artikel 25, negende lid, van de WIA][ref1] heeft vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel25
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '25'
  - number: '98.5'
    text: |-
      Voor de berekening van het tijdvak van twee jaar, bedoeld in het derde lid, onderdeel a, worden perioden van
      ongeschiktheid tot het verrichten van arbeid wegens ziekte tengevolge van zwangerschap voorafgaand aan het
      zwangerschapsverlof en perioden van ongeschiktheid tijdens het zwangerschaps- of bevallingsverlof, bedoeld in
      [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref1], niet in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '98.6'
    text: |-
      Perioden van ongeschiktheid tot het verrichten van zijn arbeid, anders dan bedoeld in het vijfde lid, worden
      samengeteld indien zij elkaar met een onderbreking van minder dan vier weken opvolgen, of indien zij direct
      voorafgaan aan en aansluiten op een periode waarin zwangerschaps- of bevallingsverlof wordt genoten overeenkomstig
      [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref1], tenzij de ongeschiktheid redelijkerwijs niet
      geacht kan worden voort te vloeien uit dezelfde oorzaak.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '98.7'
    text: |-
      Bij de beoordeling of er sprake is van een situatie als bedoeld in het derde lid, betrekt het bevoegd gezag de
      uitslag van de beoordeling door het UWV van de claim in het kader van de [WIA][ref1]. Indien deze beoordeling niet
      of langer dan een jaar geleden heeft plaatsgevonden, vraagt het bevoegd gezag aan het UWV een oordeel als bedoeld
      in [artikel 32, derde lid, van de Wet SUWI][ref2] en betrekt dit bij zijn beoordeling.


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel32
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '32'
  - number: '98.8'
    text: |-
      Indien herplaatsing als bedoeld in [artikel 37a][ref1] plaatsvindt in een betrekking voor minder uren dan het
      aantal waarvoor de ambtenaar was aangesteld, heeft het ontslag uitsluitend betrekking op het meerdere aantal uren.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel37a
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 37a
        hoofdstuk: VI
        paragraaf: '3'
  - number: '98.9'
    text: |-
      Van ontslag als bedoeld in het eerste lid, onderdeel h, wordt op verzoek van de ambtenaar afgezien voor de duur van
      telkens ten hoogste één jaar, indien de ambtenaar volgens de uitslag van een arbeidsgezondheidskundig onderzoek als
      bedoeld in [artikel 36a, eerste lid, onderdeel k][ref1], in staat is zijn functie te blijven vervullen.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel36a
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 36a
        hoofdstuk: VI
        paragraaf: '2'
  - number: '98.10'
    text: |-
      Een verzoek als bedoeld in het negende lid wordt door de ambtenaar ten minste drie maanden voor het bereiken van de
      leeftijd van zeventig jaar of ouder, ingediend.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel98
  - number: '98.11'
    text: |-
      Een arbeidsgezondheidskundig onderzoek als bedoeld in het negende lid wordt niet eerder dan vier maanden voor het
      bereiken van de leeftijd van zeventig jaar of ouder, bij de ambtenaar uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel98
  - number: 98a
    text: |-
      Indien aan de ambtenaar gedurende de tijd, dat hij recht heeft op wachtgeld een voor hem passend geachte betrekking
      is aangeboden en die betrekking binnen een periode van uiterlijk één jaar, nadat hij haar is gaan vervullen, niet
      passend voor hem blijkt te zijn, kan hem binnen die periode op zijn aanvraag eervol ontslag uit die betrekking
      worden verleend, welk ontslag ten aanzien van zijn aanspraken op een wachtgeld wordt geacht niet door eigen toedoen
      te zijn verleend.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel98a
  - number: 98b.1
    text: |-
      Aan de ambtenaar die ten gevolge van ziekte verhinderd is zijn arbeid te verrichten kan ontslag worden verleend,
      indien hij zonder deugdelijke grond weigert:
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel98b
  - number: 98b.1.a
    text: |-
      gevolg te geven aan door het bevoegd gezag of een door het bevoegd gezag aangewezen deskundige gegeven redelijke
      voorschriften of mee te werken aan door het bevoegd gezag of een door het bevoegd gezag aangewezen deskundige
      getroffen maatregelen om hem in staat te stellen de eigen of passende andere arbeid te verrichten, of
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel98b
  - number: 98b.1.b
    text: passende arbeid te verrichten waartoe het bevoegd gezag hem in de gelegenheid stelt, of
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel98b
  - number: 98b.1.c
    text: |-
      zijn medewerking te verlenen aan het opstellen, evalueren of bijstellen van een plan van aanpak als bedoeld in
      [artikel 25, tweede lid, van de WIA][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel25
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel98b
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '25'
  - number: 98b.1.d
    text: een WIA-uitkering aan te vragen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel98b
  - number: 98b.2
    text: |-
      Bij de beoordeling of er sprake is van een situatie als bedoeld in het eerste lid, kan het bevoegd gezag de uitslag
      van beoordeling door het UWV van de claim in het kader van de [WIA][ref1] betrekken indien deze minder dan een jaar
      geleden heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel98b
    references:
      - id: ref1
        bwb_id: BWBR0019057
  - number: '99.1'
    text: |-
      Aan de ambtenaar in vaste dienst kan ook op andere gronden dan die in artikel 98 zijn geregeld of waarnaar in dat
      artikel wordt verwezen, ontslag worden gegeven. Dat ontslag wordt eervol verleend.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel99
  - number: '99.2'
    text: |-
      In geval van ontslag ingevolge het eerste lid wordt door het tot ontslagverlening bevoegde gezag een
      voorziening getroffen waarbij de ambtenaar een uitkering verleend wordt, die, naar het oordeel van
      dat bevoegde gezag, met het oog op de omstandigheden redelijk is te achten. Deze uitkering zal ten
      minste gelijk zijn aan het voor de ambtenaar geldende totaal van uitkeringen berekend op basis van de
      [Werkloosheidswet][ref1] en het [Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Rijk][ref2],
      als ware als gevolg van het ontslag geen sprake van verwijtbare werkloosheid als bedoeld in
      [artikel 24 van de Werkloosheidswet][ref3]. Voor zover door het bevoegde gezag ten gunste van de
      ambtenaar niet anders is beslist, zijn op de uitkering voor het overige de [Werkloosheidswet][ref4] en het
      [Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Rijk][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0008114
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0004045
      [ref5]: https://wetten.overheid.nl/BWBR0008114
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0008114
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '24'
      - id: ref4
        bwb_id: BWBR0004045
      - id: ref5
        bwb_id: BWBR0008114
  - number: '99.3'
    text: |-
      Indien de ambtenaar terzake van zijn ontslag ingevolge het eerste lid recht heeft op een uitkering krachtens de
      [Werkloosheidswet][ref1] of het [Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Rijk][ref2],
      wordt de in het tweede lid bedoelde uitkering met die uitkering verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0008114
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0008114
  - number: 100a.1
    text: |-
      De ambtenaar aan wie op zijn aanvraag eervol ontslag wordt verleend in verband met de aanvaarding van een functie
      buiten de overheid, heeft op grond van zijn ontslag als ambtenaar aanspraak op een uitkering overeenkomstig het
      [Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Rijk][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008114
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel100a
    references:
      - id: ref1
        bwb_id: BWBR0008114
  - number: 100a.2
    text: |-
      Het bepaalde in het eerste lid geldt slechts indien de ambtenaar is aangewezen als herplaatsingskandidaat als
      bedoeld in de artikelen 49d en 49e en hij binnen twee jaar na zijn indiensttreding buiten de overheid buiten zijn
      schuld of toedoen wordt ontslagen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel100a
  - number: 100a.3
    text: |-
      Indien de ambtenaar terzake van zijn ontslag ingevolge het tweede lid recht heeft op een uitkering krachtens de
      [Werkloosheidswet][ref1] wordt de in het eerste lid bedoelde uitkering met die uitkering verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel100a
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '102.1'
    text: De bezoldiging van de ambtenaar wordt uitbetaald tot en met de dag van overlijden.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel102
  - number: '102.2'
    text: |-
      Indien de ambtenaar bij zijn overlijden een positief of negatief vakantiesaldo heeft, vinden
      [artikel 24, eerste en tweede lid][ref1], overeenkomstige toepassing. Het aldus openstaande bedrag en de reeds
      voor zijn overlijden aan de ambtenaar uitbetaalde bezoldiging over een na zijn overlijden gelegen tijdvak worden
      verrekend met het eventueel aan de nagelaten betrekkingen of rechtverkrijgenden van de ambtenaar verschuldigde
      bedrag wegens nog niet vergolden aanspraken van de ambtenaar, en bij gebreke hiervan of indien dit bedrag daarvoor
      niet toereikend is, op de uitkering, bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel24
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '24'
        hoofdstuk: V
        paragraaf: '1'
  - number: '102.3'
    text: |-
      Aan de nabestaande, van wie de overleden ambtenaar niet duurzaam gescheiden leefde, wordt een bedrag uitgekeerd
      gelijk aan de bezoldiging over drie maanden, vermeerderd met de vakantie-uitkering en de eindejaarsuitkering
      over die maanden. Indien de ambtenaar op de dag direct voorafgaand aan zijn overlijden aanspraak maakte op een
      uitkering op grond van de [Ziektewet][ref1], [Werkloosheidswet][ref2] of de [WIA][ref3], wordt als maatstaf voor
      de bezoldiging uitgegaan van de bezoldiging die hij zou hebben genoten als hij op die dag arbeidsgeschikt zou zijn
      geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0019057
  - number: '102.4'
    text: |-
      Indien de ambtenaar in het genot was van een toelage als bedoeld in de [artikelen 17][ref1], [17a][ref2],
      [18][ref3] en [18a][ref4] en [18b, van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref5], wordt de in
      het derde lid bedoelde bezoldiging in zoverre gesteld op het gemiddelde van het bedrag dat de overleden ambtenaar
      is toegekend of zou zijn toegekend in de drie kalendermaanden voorafgaande aan de dag van overlijden, of het
      intreden van de arbeidsongeschiktheid.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel17a
      [ref3]: https://wetten.overheid.nl/BWBR0003630#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0003630#Artikel18a
      [ref5]: https://wetten.overheid.nl/BWBR0003630#Artikel18b
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0003630
        artikel: 17a
      - id: ref3
        bwb_id: BWBR0003630
        artikel: '18'
      - id: ref4
        bwb_id: BWBR0003630
        artikel: 18a
      - id: ref5
        bwb_id: BWBR0003630
        artikel: 18b
  - number: '102.5'
    text: |-
      Op het bedrag, bedoeld in het derde lid, wordt in mindering gebracht een uitkering op grond van
      [artikel 35 van de ZW][ref1], [artikel 74 van de WIA][ref2], of een overlijdensuitkering die is verleend door de
      Stichting Pensioenfonds ABP indien recht bestaat op arbeidsongeschiktheidspensioen of andere naar aard en strekking
      hiermee overeenkomende uitkeringen die voortvloeien uit dezelfde dienstbetrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel74
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '74'
  - number: '102.6'
    text: |-
      Bij ontstentenis van een nabestaande, van wie de overledene niet duurzaam gescheiden leefde, geschiedt de
      uitkering, bedoeld in het derde lid, ten behoeve van de minderjarige kinderen. Onder kinderen in de zin van dit
      artikel worden mede verstaan natuurlijke kinderen en kinderen waarover de overledene de pleegouderlijke zorg droeg.
      Onder pleegouderlijke zorg wordt verstaan de zorg voor het onderhoud en de opvoeding van het kind als was het een
      eigen kind, onafhankelijk van enige verplichting daartoe of van het genieten van een vergoeding daarvoor. Ontbreken
      ook zodanige kinderen dan geschiedt de uitkering aan degenen die geheel of grotendeels afhankelijk waren van de
      bezoldiging van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel102
  - number: '102.7'
    text: |-
      Indien de ambtenaar geen betrekkingen als bedoeld in het derde en zesde lid nalaat, kan de daar bedoelde uitkering
      door het bevoegd gezag geheel of ten dele worden uitgekeerd voor de betaling van de kosten van de laatste ziekte en
      van de lijkbezorging indien de nalatenschap van de overledene hiertoe ontoereikend is.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel102
  - number: 102a
    text: |-
      Na het overlijden van de gewezen ambtenaar, die op de dag van zijn overlijden op grond van de [artikelen 38][ref1]
      en [46][ref2] in het genot was van doorbetaling van zijn laatstelijk genoten bezoldiging, wordt aan de in
      [artikel 102][ref3] bedoelde personen en met overeenkomstige toepassing van dat artikel een bedrag uitgekeerd,
      gelijk aan de bezoldiging welke de gewezen ambtenaar op de dag van zijn overlijden genoot, berekend over een
      tijdvak van drie maanden. Op deze uitkering wordt in mindering gebracht het bedrag van de uitkering op grond
      van de [artikelen 35][ref4] en [36 van de ZW][ref5], [artikel 74 van de WIA][ref6], de [artikelen 6][ref7] en
      [11 van het Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Rijk][ref8] of naar aard en
      strekking daarmee overeenkomende uitkeringen die voortvloeien uit dezelfde dienstbetrekking. Alleen uitkeringen die
      voortvloeien uit de dienstbetrekking bij Onze Minister worden in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0001950#Artikel102
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel35
      [ref5]: https://wetten.overheid.nl/BWBR0001888#Artikel36
      [ref6]: https://wetten.overheid.nl/BWBR0019057#Artikel74
      [ref7]: https://wetten.overheid.nl/BWBR0008114#Artikel6
      [ref8]: https://wetten.overheid.nl/BWBR0008114#Artikel11
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel102a
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '38'
        hoofdstuk: VI
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '46'
        hoofdstuk: VI
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0001950
        artikel: '102'
        hoofdstuk: X
      - id: ref4
        bwb_id: BWBR0001888
        artikel: '35'
      - id: ref5
        bwb_id: BWBR0001888
        artikel: '36'
      - id: ref6
        bwb_id: BWBR0019057
        artikel: '74'
      - id: ref7
        bwb_id: BWBR0008114
        artikel: '6'
      - id: ref8
        bwb_id: BWBR0008114
        artikel: '11'
  - number: 102b.1
    text: |-
      Indien het overlijden van de ambtenaar is veroorzaakt door een dienstongeval of een door het verrichten van zijn
      arbeid opgelopen beroepsziekte, wordt aan degene die in verband met dit overlijden krachtens het Pensioenreglement
      van de Stichting Pensioenfonds ABP, een nabestaandenpensioen geniet, een uitkering toegekend ten bedrage van 18
      procent van het resultaat van de vermenigvuldiging van:
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel102b
  - number: 102b.1.a
    text: |-
      indien het gaat om de partner, vijf zevende deel van 1,75 procent van het pensioengevend inkomen en de
      pensioengeldige diensttijd, zoals deze begrippen door de Stichting Pensioenfonds ABP worden gehanteerd ten aanzien
      van overheidswerknemers als bedoeld in [artikel 2, eerste lid, van de Wet privatisering ABP][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel2
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel102b
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '2'
  - number: 102b.1.b
    text: |-
      indien het gaat om de wees waarvan de verzorger geen recht heeft op partnerpensioen of bijzonder partnerpensioen,
      een zevende deel van 1,75 procent van het pensioengevend inkomen en de pensioengeldige diensttijd, zoals deze
      begrippen door de Stichting Pensioenfonds ABP worden gehanteerd ten aanzien van overheidswerknemers als bedoeld in
      [artikel 2, eerste lid, van de Wet privatisering ABP][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel2
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel102b
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '2'
  - number: 102b.1.c
    text: |-
      indien het gaat om de wees zonder verzorger als bedoeld in onderdeel b, twee zevende deel van 1,75
      procent van het pensioengevend inkomen en de pensioengeldige diensttijd, zoals deze begrippen door
      de Stichting Pensioenfonds ABP worden gehanteerd ten aanzien van overheidswerknemers als bedoeld in
      [artikel 2, eerste lid, van de Wet privatisering ABP][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel2
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel102b
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '2'
  - number: 102b.2
    text: |-
      De uitkering eindigt met ingang van de dag waarop de overledene de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], zou hebben bereikt, dan wel, indien de partner, zoals
      dit begrip door de Stichting Pensioenfonds ABP wordt gehanteerd ten aanzien van overheidswerknemers als bedoeld
      in [artikel 2, eerste lid, van de Wet privatisering ABP][ref2] aan wie een pensioen werd toegekend, hertrouwt, met
      ingang van de maand volgende op de datum van het hertrouwen. Indien de weduwe of weduwnaar een samenlevingscontract
      sluit dan wel een geregistreerd partnerschap aangaat, eindigt de uitkering met ingang van de maand volgende op de
      datum van het sluiten van het samenlevingscontract dan wel van het aangaan van het geregistreerd partnerschap.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0007791#Artikel2
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel102b
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0007791
        artikel: '2'
  - number: 102b.3
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de gewezen ambtenaar ten aanzien van wie
      [artikel 38, derde lid][ref1], toepassing heeft gevonden, indien zijn overlijden het rechtstreeks gevolg is van de
      arbeidsongeschiktheid, bedoeld in dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel38
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel102b
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '38'
        hoofdstuk: VI
        paragraaf: '3'
  - number: '103.1'
    text: |-
      Gedurende de maand van het overlijden en de volgende drie maanden behouden de achterblijvende gezinsleden het
      gebruik der ambts- of dienstwoning, waarin zij met de ambtenaar woonden. Daarvan kan echter worden afgeweken als
      Onze Minister dat in het belang van de dienst noodzakelijk acht. Alsdan wordt door Onze Minister naar billijkheid
      een schadevergoeding gegeven.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel103
  - number: '103.2'
    text: |-
      Bij vrijwillig verlaten van de ambts- of dienstwoning binnen de termijn, gedurende welke de woning nog mag worden
      gebruikt, kan Onze Minister te zijner beoordeling een vergoeding geven.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel103
  - number: '104'
    text: |-
      Indien door de ambtenaar voor het gebruik der ambts- of dienstwoning een vergoeding verschuldigd was, voldoen de
      achtergebleven gezinsleden deze over de tijd, gedurende welke zij het gebruik dier woning behouden.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel104
  - number: 104a.1
    text: |-
      Bij vermissing van de ambtenaar vinden, behoudens het bepaalde in het tweede lid, de bepalingen van de artikelen
      102 tot en met 104 overeenkomstige toepassing. De ambtenaar wordt daarbij geacht te zijn overleden op een door Onze
      Minister te bepalen dag.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel104a
  - number: 104a.2
    text: |-
      Het bepaalde in het tweede lid van artikel 102 vindt geen toepassing indien gegronde vermoedens bestaan, dat de
      vermissing het gevolg is van ongeoorloofde afwezigheid.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel104a
  - number: 104a.3
    text: |-
      Indien blijkt, dat de als vermist beschouwde ambtenaar in leven is, kan ter beoordeling van het bevoegde gezag
      de bezoldiging alsnog worden uitbetaald, tenzij gegronde vermoedens bestaan, dat de vermissing het gevolg was van
      ongeoorloofde afwezigheid.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel104a
  - number: 104a.4
    text: |-
      Indien uit hoofde van de vermissing van de ambtenaar pensioen of enige andere uitkering, voortvloeiende uit zijn
      ambtelijke rechtspositieregeling, is toegekend over het tijdvak, waarover naar het oordeel van het bevoegde gezag
      aanspraak bestaat op bezoldiging, wordt die bezoldiging verminderd met de over dat tijdvak aldus uitbetaalde
      bedragen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel104a
  - number: 104a.5
    text: |-
      De bezoldiging, waarop de ambtenaar ingevolge het derde en het vierde lid aanspraak heeft, kan aan anderen dan de
      ambtenaar worden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel104a
  - number: '105.1'
    text: |-
      Over aangelegenheden van algemeen belang voor de rechtstoestand van de ambtenaren in de zin van dit besluit met
      inbegrip van de algemene regels volgens welke het personeelsbeleid zal worden gevoerd, wordt niet beslist dan nadat
      daarover door of namens Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties overleg is gepleegd met de
      Sectorcommissie overleg rijkspersoneel.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel105
  - number: '105.2'
    text: 'De Sectorcommissie bestaat uit vertegenwoordigers van:'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel105
  - number: 105.2.a
    text: de Algemene Centrale van Overheidspersoneel;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel105
  - number: 105.2.b
    text: de Christelijke Centrale van Overheids- en Onderwijspersoneel;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel105
  - number: 105.2.c
    text: het Ambtenarencentrum;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel105
  - number: 105.2.d
    text: de Centrale van Middelbare en Hogere Functionarissen bij Overheid en Onderwijs, Bedrijven en Instellingen;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel105
  - number: 105.2.e
    text: |-
      andere door Ons tot het overleg toegelaten centrales van verenigingen van ambtenaren, welke onder meer gelet op het
      aantal ambtenaren, dat zij vertegenwoordigen, eveneens als representatief kunnen worden aangemerkt en tegen wier
      toelating het algemeen belang zich niet verzet.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel105
  - number: '105.3'
    text: |-
      Indien een voorstel, waarover overleg dient plaats te vinden, strekt tot invoering of wijziging van een regeling
      met rechten of verplichtingen van individuele ambtenaren wordt dit voorstel slechts ten uitvoer gebracht, indien
      daarover overeenstemming bestaat met de Sectorcommissie. Het standpunt van de Sectorcommissie wordt bepaald bij
      meerderheid van stemmen. Elke centrale brengt één stem uit. Indien de stemmen binnen de Sectorcommissie staken,
      beslist Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties of het voorstel ten uitvoer wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel105
  - number: '105.4'
    text: |-
      In de Sectorcommissie wordt geen overleg gevoerd over voorstellen die betrekking hebben op het gehele
      overheidspersoneel.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel105
  - number: '105.5'
    text: |-
      Indien een voorstel als bedoeld in het vierde lid, ziet op het van toepassing verklaren op overheidspersoneel
      van een wettelijke regeling die betrekking heeft op werknemers, die krachtens arbeidsovereenkomst als bedoeld in
      [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1] werkzaam zijn, vindt in de Sectorcommissie
      overleg plaats over de gevolgen van een desbetreffend voorstel voor ambtenaren en de eventueel daarmee
      samenhangende wijzigingen in de voor hen geldende regelingen. Het overeenstemmingsvereiste, bedoeld in het derde
      lid, is daarbij niet van toepassing, mits het totaal van rechten en verplichtingen van ambtenaren over het geheel
      beoordeeld niet ongunstiger wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '610'
  - number: '105.6'
    text: |-
      Indien bij het overleg, bedoeld in het vijfde lid, een geschil ontstaat over de vraag of wordt voldaan aan
      de voorwaarde dat het totaal van rechten en verplichtingen van de ambtenaren over het geheel beoordeeld niet
      ongunstiger wordt, wordt dat geschil onderworpen aan arbitrage door de Advies- en Arbitragecommissie, genoemd in
      [artikel 110g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel110g
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 110g
        hoofdstuk: XI
        paragraaf: '1'
  - number: '106.1'
    text: Elke centrale is bevoegd tot aanwijzing van twee leden en twee plaatsvervangende leden van de Sectorcommissie.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel106
  - number: '106.2'
    text: |-
      Wij behouden Ons voor een toelating tot het overleg krachtens artikel 105 te schorsen en een toelating tot het
      overleg krachtens het tweede lid van dat artikel, onder *e*, in te trekken, indien de centrale van verenigingen
      van ambtenaren naar Ons oordeel niet meer representatief is dan wel het algemeen belang zich tegen haar verdere
      toelating verzet.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel106
  - number: '106.3'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties is bevoegd een lid of plaatsvervangend lid van de
      Sectorcommissie van deelneming aan het overleg uit te sluiten indien naar het oordeel van Onze genoemde Minister
      het dienstbelang dit in verband met zijn werkzaamheden als Rijksambtenaar vordert. De uitsluiting geschiedt niet
      dan nadat het bestuur van de daarbij betrokken zijnde centrale van verenigingen van ambtenaren over het voornemen
      daartoe is gehoord, en het advies van de overige leden van de Sectorcommissie daarover is ingewonnen. In afwachting
      van de beslissing van Onze Minister neemt het betrokken lid of plaatsvervangend lid niet of niet meer deel aan
      het overleg. Na de uitsluiting wijst de desbetreffende centrale een andere vertegenwoordiger aan als lid of
      plaatsvervangend lid van de Sectorcommissie in de plaats van de uitgeslotene.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel106
  - number: '107.1'
    text: |-
      Het overleg staat onder leiding van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties. Hij is bevoegd
      de leiding van het overleg op te dragen aan een door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      aan te wijzen ambtenaar die is aangesteld als lid van de topmanagementgroep, indien de aard van de te bespreken
      aangelegenheden dit toelaat.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel107
  - number: '107.2'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties wijst functionarissen aan die hem, dan wel de
      functionaris die namens hem het overleg voert, bij het overleg terzijde staan.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel107
  - number: '107.3'
    text: |-
      Het secretariaat van het overleg wordt gevoerd door een door Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties benoemde of aangewezen secretaris, die ten dienste staat van zowel de voorzitter en de in het
      tweede lid bedoeld ambtenaren als van de Sectorcommissie. De benoeming of aanwijzing van de secretaris geschiedt in
      overeenstemming met de Sectorcommissie.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel107
  - number: '107.4'
    text: |-
      Bij de behandeling van bepaalde aangelegenheden kan op uitnodiging of met toestemming van de voorzitter ook door
      anderen dan degenen, die daartoe ingevolge de vorige bepalingen van dit hoofdstuk bevoegd zijn, aan het overleg
      worden deelgenomen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel107
  - number: '107.5'
    text: |-
      De leden van de Sectorcommissie kunnen zich na overleg met de voorzitter ter vergadering voor de behandeling van
      een bepaald onderwerp door een deskundige doen bijstaan.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel107
  - number: 107a
    text: |-
      De centrales van verenigingen van ambtenaren, die van de in artikel 106, eerste lid, vermelde bevoegdheid hebben
      gebruik gemaakt, doen aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties mededeling van haar statuten
      en huishoudelijke reglementen en van de daarin aangebrachte wijzigingen, zomede van de statuten en van de daarin
      aangebrachte wijzigingen van de bij haar aangesloten verenigingen van ambtenaren. Zij stellen Onze genoemde
      Minister voorts jaarlijks in kennis van het totale ledental van de bij elk der centrales aangesloten verenigingen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel107a
  - number: '108.1'
    text: |-
      De in artikel 105 bedoelde aangelegenheden worden door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      aan de Sectorcommissie voorgelegd.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel108
  - number: '108.2'
    text: |-
      Ieder der tot het overleg toegelaten centrales van verenigingen van ambtenaren is bevoegd aan Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties bepaalde onderwerpen, behorende tot de in artikel 105 bedoelde, ter
      plaatsing op de agenda op te geven.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel108
  - number: 108a
    text: |-
      Een wijziging van het [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1], betrekking hebbende op een ambt
      dat is vermeld in bijlage A van dat besluit, behoort niet tot de in artikel 105 bedoelde aangelegenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel108a
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: 108b.1
    text: |-
      Het overleg wordt gevoerd op plaats, dag en uur door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      te bepalen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel108b
  - number: 108b.2
    text: De vergaderingen worden in de regel te 's-Gravenhage gehouden.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel108b
  - number: 108b.3
    text: |-
      Indien de vertegenwoordigers van tenminste twee tot het overleg toegelaten centrales van verenigingen van
      ambtenaren Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, onder vermelding van hetgeen zij behandeld
      wensen te zien, verzoeken daartoe een vergadering uit te schrijven, vindt deze binnen 14 dagen plaats.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel108b
  - number: '109'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties verleent zijn bemiddeling om aan de Sectorcommissie een
      lokaliteit in een Rijksgebouw ter beschikking te stellen, indien deze Sectorcommissie daartoe een verzoek doet ten
      behoeve van een door haar te houden vergadering.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel109
  - number: '110.1'
    text: |-
      Indien het wenselijk blijkt over de in artikel 105 bedoelde aangelegenheden voorbereidende besprekingen te voeren
      of in het overleg genomen besluiten uit te werken, geschiedt deze voorbereiding of uitwerking door werkgroepen
      bestaande uit vertegenwoordigers van de Sectorcommissie en door Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties daartoe aangewezen functionarissen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110
  - number: '110.2'
    text: Het bepaalde in het vierde en vijfde lid van artikel 107 is daarbij van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110
  - number: 110a.1
    text: Het standpunt van de Sectorcommissie wordt bepaald bij eenvoudige meerderheid van stemmen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110a
  - number: 110a.2
    text: Elke centrale brengt één stem uit.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110a
  - number: 110b
    text: 'Voor de toepassing van het bepaalde in de artikelen 110*d* en volgende wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110b
  - number: 110b.a
    text: |-
      "deelnemers aan het overleg": de voorzitter en de tot het overleg toegelaten centrales van verenigingen van
      ambtenaren;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110b
  - number: 110b.b
    text: '"Advies- en Arbitragecommissie": de Advies- en Arbitragecommissie genoemd in artikel 110*g*.'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110b
  - number: 110c
    text: |-
      De artikelen 110*d* tot en met 110*h* zijn slechts van toepassing op geschillen inzake aangelegenheden als bedoeld
      in artikel 105 voorzover die aangelegenheden uitsluitend de rechtstoestand van ambtenaren met inbegrip van de
      algemene regels volgens welke het personeelsbeleid zal worden gevoerd, betreffen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110c
  - number: 110d
    text: |-
      Indien de voorzitter dan wel een of meer van de centrales, in het overleg tot het oordeel komen dat dit overleg
      niet tot een uitkomst zal leiden die de instemming van alle deelnemers aan dat overleg zal hebben, brengen zij
      dat oordeel binnen 3 dagen nadat zij daarvan in het overleg blijk hebben gegeven, schriftelijk ter kennis van de
      overige deelnemers aan het overleg.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110d
  - number: 110e.1
    text: |-
      Binnen vijf dagen na de kennisgeving bedoeld in het vorige artikel, schrijft de voorzitter een overlegvergadering
      uit. De vergadering moet worden gehouden binnen zeven dagen nadat deze is uitgeschreven.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110e
  - number: 110e.2
    text: |-
      Tenzij door de voorzitter en de Sectorcommissie wordt besloten het overleg voort te zetten dan wel te beëindigen
      wordt in de vergadering nagegaan of overeenstemming bestaat over de vraag wat het onderwerp en de inhoud van het
      geschil is en of een oplossing van dat geschil zal worden gezocht door middel van voortzetting van het overleg
      nadat het advies is ingewonnen van de Advies- en Arbitragecommissie, dan wel door middel van onderwerping van het
      geschil aan een arbitrale uitspraak van de Advies- en Arbitragecommissie.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110e
  - number: 110e.3
    text: Tot het inwinnen van advies is zowel de voorzitter als de Sectorcommissie bevoegd.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110e
  - number: 110e.4
    text: Voor onderwerping van het geschil aan arbitrage is overeenstemming vereist tussen alle deelnemers aan het overleg.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110e
  - number: 110f.1
    text: |-
      Binnen drie dagen na de vergadering bedoeld in het vorige artikel, wordt het verzoek om advies ter kennis gebracht
      van de voorzitter van de Advies- en Arbitragecommissie. Het verzoek wordt ondertekend door de deelnemers aan het
      overleg die zich voor inwinning van advies hebben uitgesproken en bevat tenminste het onderwerp en de inhoud van
      het geschil. Indien in de vergadering bedoeld in het vorige artikel geen overeenstemming is bereikt tussen alle
      deelnemers aan het overleg over de vraag wat het onderwerp en de inhoud van het geschil is, brengen de overige
      deelnemers aan het overleg hun visie op het onderwerp en de inhoud van het geschil eveneens binnen drie dagen na
      eerdergenoemde vergadering ter kennis van de voorzitter van de Advies- en Arbitragecommissie.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110f
  - number: 110f.2
    text: |-
      Het bepaalde in de eerste volzin van het vorige lid is van overeenkomstige toepassing ten aanzien van het
      onderwerpen van het geschil aan een arbitrale uitspraak. Het verzoek daartoe wordt ondertekend door alle deelnemers
      aan het overleg en dient tenminste te bevatten:
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110f
  - number: 110f.2.a
    text: het onderwerp en de inhoud van het geschil;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110f
  - number: 110f.2.b
    text: de standpunten van alle deelnemers aan het overleg omtrent onderwerp en inhoud van het geschil.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110f
  - number: 110g.1
    text: |-
      Er is een Advies- en Arbitragecommissie, die tot taak heeft te adviseren dan wel een bindende uitspraak te doen in
      de geschillen die haar ingevolge de voorgaande artikelen worden voorgelegd.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110g
  - number: 110g.2
    text: |-
      De Advies- en Arbitragecommissie is gevestigd te ’s-Gravenhage. Zij bestaat uit vijf leden, onder wie de
      voorzitter, en vijf plaatsvervangende leden. Zij worden door Ons benoemd voor een tijdvak van ten hoogste vier
      jaar. Herbenoeming kan twee maal en telkens voor ten hoogste vier jaar plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110g
  - number: 110g.3
    text: |-
      Wij benoemen de voorzitter en diens plaatsvervanger op gezamenlijke voordracht van Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties en de Sectorcommissie. Van de andere vier leden en hun plaatsvervangers benoemen wij:
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110g
  - number: 110g.3.a
    text: |-
      twee leden en hun plaatsvervangers op voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;
      alsmede
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110g
  - number: 110g.3.b
    text: twee leden en hun plaatsvervangers op voordracht van de Sectorcommissie.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110g
  - number: 110g.4
    text: 'Uitgesloten van het lidmaatschap en plaatsvervangend lidmaatschap zijn:'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110g
  - number: 110g.4.a
    text: personen die lid dan wel plaatsvervangend lid zijn van de Sectorcommissie;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110g
  - number: 110g.4.b
    text: |-
      personen die bestuurslid zijn van, dan wel werkzaam zijn bij een centrale van verenigingen van ambtenaren als
      bedoeld in artikel 105 of een daarbij aangesloten vereniging;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110g
  - number: 110g.4.c
    text: |-
      personen die werkzaam zijn bij de departementen van algemeen bestuur en de daaronder ressorterende instellingen,
      diensten en bedrijven, wier onafhankelijkheid en onpartijdigheid op grond van hun dienstverband door de deelnemers
      aan het overleg onvoldoende wordt geacht.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110g
  - number: 110g.5
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties wijst in overeenstemming met de Sectorcommissie en
      met de voorzitter van de Advies- en Arbitragecommissie een secretaris aan, die de Advies- en Arbitragecommissie
      bijstaat.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110g
  - number: 110g.6
    text: |-
      Aan de leden en plaatsvervangende leden worden uit ’s Rijks kas vergoedingen voor reis- en verblijfkosten verleend
      volgens de regels welke voor de vergoeding voor reis- en verblijfkosten wegens reizen voor ’s Rijks dienst gelden.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110g
  - number: 110h.1
    text: |-
      De Advies- en Arbitragecommissie treedt in geval van advies op in een samenstelling van drie leden, onder wie de
      voorzitter, een van de twee leden bedoeld in het derde lid onder *a* van het vorige artikel en een van de twee
      leden bedoeld in het derde lid onder *b* van dat artikel. De overige twee leden treden te zamen met de voorzitter
      op in geval van arbitrage. Bij verhindering van een der leden treedt diens plaatsvervanger op.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110h
  - number: 110h.2
    text: |-
      Indien het verzoek om arbitrage naar het oordeel van de voorzitter een zelfde geschil betreft als waarover door
      de Advies- en Arbitragecommissie reeds advies is uitgebracht, treedt voor een lid die bij het uitbrengen van dat
      advies betrokken was, diens plaatsvervanger op.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110h
  - number: 110h.3
    text: |-
      De voorzitter draagt er zorg voor dat het advies of de uitspraak binnen vier weken, nadat de kennisgeving bedoeld
      in artikel 110*f*, is ontvangen, aan de deelnemers aan het overleg ter kennis wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110h
  - number: 110h.4
    text: De Advies- en Arbitragecommissie stelt nadere regels vast met betrekking tot haar werkwijze.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110h
  - number: 110i.1
    text: De Advies- en Arbitragecommissie besluit bij meerderheid van stemmen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110i
  - number: 110i.2
    text: 'Het advies of de uitspraak moet inhouden:'
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110i
  - number: 110i.2.a
    text: de namen van de deelnemers die het advies of de arbitrale uitspraak hebben aangevraagd;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110i
  - number: 110i.2.b
    text: een overzicht van de standpunten van alle deelnemers over het onderwerp en over de inhoud van het geschil;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110i
  - number: 110i.2.c
    text: het advies dan wel de beslissing en de redenen die daaraan ten grondslag liggen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110i
  - number: 110i.3
    text: |-
      Het advies of de uitspraak wordt gedagtekend en door ieder der optredende leden van de Advies- en
      Arbitragecommissie ondertekend.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110i
  - number: 110j
    text: Binnen twee weken na ontvangst van het advies wordt het overleg over het geschil voortgezet.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110j
  - number: 110k
    text: De uitspraak van de Advies- en Arbitragecommissie heeft bindende kracht.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110k
  - number: 110l.1
    text: |-
      Het standpunt van de Sectorcommissie over de haar voorgelegde dan wel op verzoek van haar zijde in het overleg
      besproken aangelegenheden wordt schriftelijk aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      bevestigd, waarbij desverlangd een samenvatting van de aan dit standpunt ten grondslag liggende argumenten wordt
      gegeven.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110l
  - number: 110l.2
    text: |-
      Indien in de Sectorcommissie een minderheidsstandpunt blijkt te bestaan, wordt daarvan desverlangd in het geschrift
      bedoeld in het vorige lid, melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel110l
  - number: '111'
    text: |-
      Indien over een aangelegenheid in afwijking van het standpunt van de Sectorcommissie wordt beslist, brengt Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties de redenen dier afwijking zo spoedig mogelijk ter kennis van
      de Sectorcommissie.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel111
  - number: '112'
    text: |-
      Van het in de vergaderingen van het overleg en de werkgroepen behandelde maakt de secretaris notulen. Bovendien
      wordt een verslag opgemaakt, bevattende een beknopte samenvatting van het verhandelde, voor zover dat voor
      openbaarmaking geschikt kan worden geacht. Na overleg met de Sectorcommissie onderscheidenlijk de door deze in
      de betrokken werkgroep aangewezen leden, kan de voorzitter ten aanzien van het in vorenbedoelde vergaderingen
      verhandelde, geheimhouding opleggen. De plicht tot geheimhouding geldt niet, indien en voor zover de leden van de
      Sectorcommissie dan wel de door haar in de betrokken werkgroep aangewezen leden in bespreking treden met de door
      hen vertegenwoordigde centrales of de daarbij aangesloten verenigingen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel112
  - number: '113.1'
    text: |-
      Voor zover Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties in overeenstemming met de Sectorcommissie
      overleg rijkspersoneel niet anders heeft bepaald, wordt over voorgenomen besluiten tot invoering of wijziging van
      regels met rechten of verplichtingen van individuele ambtenaren en over voorgenomen besluiten tot een belangrijke
      reorganisatie, niet door Onze Minister beslist dan nadat door hem overleg is gevoerd met de centrales van
      verenigingen van ambtenaren.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel113
  - number: '113.2'
    text: |-
      Het overleg heeft geen betrekking op aangelegenheden waarover overleg dient te worden gevoerd met de
      Sectorcommissie overleg rijkspersoneel.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel113
  - number: '113.3'
    text: |-
      Een voorgenomen besluit tot invoering of wijziging van regels met rechten of verplichtingen van individuele
      ambtenaren waarover overleg met de centrales moet worden gevoerd, wordt slechts ten uitvoer gebracht indien
      daarover overeenstemming bestaat met ten minste de helft van de tot het overleg toegelaten centrales.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel113
  - number: '113.4'
    text: |-
      Het overleg over voorgenomen besluiten tot een belangrijke reorganisatie heeft slechts betrekking op de bijzondere
      rechtspositionele en sociale gevolgen van het voorgenomen besluit voor de betrokken ambtenaren.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel113
  - number: '114.1'
    text: Onze Minister laat tot het overleg toe de tot de Sectorcommissie overleg rijkspersoneel toegelaten centrales.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel114
  - number: '114.2'
    text: |-
      Schorsing dan wel intrekking van een toelating van een centrale tot de Sectorcommissie overleg rijkspersoneel,
      heeft tot gevolg schorsing respectievelijk intrekking van de toelating tot het overleg.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel114
  - number: '114.3'
    text: |-
      Onze Minister kan een vertegenwoordiger van een centrale uitsluiten van deelneming aan het overleg indien naar het
      oordeel van Onze Minister het dienstbelang dit in verband met de werkzaamheden van betrokkene als Rijksambtenaar
      vordert. Voordat tot uitsluiting wordt besloten wordt het bestuur van de desbetreffende centrale in de gelegenheid
      gesteld zijn zienswijze naar voren te brengen. In afwachting van de beslissing van Onze Minister neemt betrokkene
      niet of niet meer deel aan het overleg.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel114
  - number: '115'
    text: |-
      In geval van een geschil omtrent een voorgenomen besluit tot invoering of wijziging van regels met rechten
      of verplichtingen van individuele ambtenaren waarover overleg met de centrales moet worden gevoerd, zijn de
      artikelen 110b en 110d tot en met 110k van overeenkomstige toepassing, met dien verstande dat de Advies- en
      Arbitragecommissie, genoemd in artikel 110g, voor de behandeling van het geschil wordt uitgebreid met twee
      bijzondere leden die worden benoemd door Onze Minister. Van deze leden wordt één lid benoemd op voordracht van de
      tot het overleg toegelaten centrales. Niet benoembaar tot bijzonder lid zijn:
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel115
  - number: 115.a
    text: |-
      personen die ingevolge artikel 110g, vierde lid, zijn uitgesloten van het lidmaatschap en het plaatsvervangend
      lidmaatschap;
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel115
  - number: 115.b
    text: |-
      personen die namens de centrales aan het overleg deelnemen, dan wel wier deelname aan het overleg nog niet langer
      dan twee jaar is beëindigd.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel115
  - number: '116'
    text: |-
      Onze Minister kan geheimhouding opleggen ten aanzien van hetgeen in het overleg is behandeld. De plicht tot
      geheimhouding geldt niet voor zover degenen die namens de centrales aan het overleg deelnemen in bespreking treden
      met de door hen vertegenwoordigde centrales of de daarbij aangesloten verenigingen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel116
  - number: '117'
    text: |-
      Onze Minister draagt er zorg voor dat de ambtenaar, die in het overleg optreedt of heeft opgetreden namens een
      centrale, en de ambtenaar, die lid is geweest van een bijzondere commissie, niet uit dien hoofde worden benadeeld
      in hun positie als ambtenaar.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel117
  - number: '118'
    text: |-
      De [artikelen 113 tot en met 117][ref1] zijn van overeenkomstige toepassing op de Raad van State, de Algemene
      Rekenkamer, de Nationale ombudsman en het secretariaat van de commissie van toezicht op de inlichtingen- en
      veiligheidsdiensten, met dien verstande dat voor Onze Minister telkens wordt gelezen respectievelijk de vice-
      president van de Raad van State, het college van de Algemene Rekenkamer, de Nationale ombudsman en de voorzitter
      van de commissie van toezicht op de inlichtingen- en veiligheidsdiensten.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel113
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '113'
        hoofdstuk: XI
        paragraaf: '2'
  - number: '129'
    text: |-
      Met uitzondering van de ambtenaar die is aangesteld als lid van de topmanagementgroep als bedoeld in
      [artikel 4, vijfde lid, onder a][ref1], wordt de ambtenaar die voorafgaand aan 1 maart 2007 op grond
      van dit besluit bij Koninklijk Besluit is aangesteld, aangemerkt als te zijn aangesteld op grond van
      [artikel 7, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel7
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '4'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
  - number: '130.1'
    text: |-
      Ten aanzien van de ambtenaar en de gewezen ambtenaar van wie de eerste dag van ongeschiktheid tot het verrichten
      van zijn arbeid wegens ziekte is gelegen voor 1 januari 2004, blijven de [artikelen 21a][ref1], [57a][ref2],
      [57b][ref3], [98][ref4], [98b][ref5], [102][ref6], [102a][ref7] en [hoofdstuk VI][ref8] van het Algemeen
      Rijksambtenarenreglement van toepassing zoals deze luidden op 30 november 2005, met dien verstande dat voor
      [artikel 40b][ref9] in genoemd [hoofdstuk VI][ref10] in de plaats treedt [artikel 40b][ref11] zoals dat thans
      luidt.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel21a
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel57a
      [ref3]: https://wetten.overheid.nl/BWBR0001950#Artikel57b
      [ref4]: https://wetten.overheid.nl/BWBR0001950#Artikel98
      [ref5]: https://wetten.overheid.nl/BWBR0001950#Artikel98b
      [ref6]: https://wetten.overheid.nl/BWBR0001950#Artikel102
      [ref7]: https://wetten.overheid.nl/BWBR0001950#Artikel102a
      [ref8]: https://wetten.overheid.nl/BWBR0001950#HoofdstukVI
      [ref9]: https://wetten.overheid.nl/BWBR0001950#Artikel40b
      [ref10]: https://wetten.overheid.nl/BWBR0001950#HoofdstukVI
      [ref11]: https://wetten.overheid.nl/BWBR0001950#Artikel40b
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 21a
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 57a
        hoofdstuk: VIIa
      - id: ref3
        bwb_id: BWBR0001950
        artikel: 57b
        hoofdstuk: VIIa
      - id: ref4
        bwb_id: BWBR0001950
        artikel: '98'
        hoofdstuk: X
      - id: ref5
        bwb_id: BWBR0001950
        artikel: 98b
        hoofdstuk: X
      - id: ref6
        bwb_id: BWBR0001950
        artikel: '102'
        hoofdstuk: X
      - id: ref7
        bwb_id: BWBR0001950
        artikel: 102a
        hoofdstuk: X
      - id: ref8
        bwb_id: BWBR0001950
        hoofdstuk: VI
      - id: ref9
        bwb_id: BWBR0001950
        artikel: 40b
        hoofdstuk: VI
        paragraaf: '3'
      - id: ref10
        bwb_id: BWBR0001950
        hoofdstuk: VI
      - id: ref11
        bwb_id: BWBR0001950
        artikel: 40b
        hoofdstuk: VI
        paragraaf: '3'
  - number: '130.2'
    text: |-
      Voor de toepassing van het eerste lid worden perioden van ongeschiktheid tot werken geacht eenzelfde, niet
      onderbroken periode van ongeschiktheid te vormen, indien zij elkaar met een onderbreking van minder dan vier weken
      opvolgen of indien zij direct voorafgaan aan en aansluiten op een periode waarin zwangerschaps- of bevallingsverlof
      wordt genoten overeenkomstig [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref1] of een uitkering
      op grond van [artikel 3:8][ref2], of [3:10, eerste lid, van die wet][ref3], tenzij de ongeschiktheid redelijkerwijs
      niet geacht kan worden voort te vloeien uit dezelfde oorzaak.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
  - number: 130a
    text: |-
      De ambtenaar en de gewezen ambtenaar worden geacht een aanvraag te hebben ingediend als bedoeld in
      [artikel 38a][ref1] indien de eerste dag van ongeschiktheid tot het verrichten van zijn arbeid wegens een
      dienstongeval of een beroepsziekte is gelegen in de periode van 1 januari 2004 tot en met 30 november 2005.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel38a
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel130a
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 38a
        hoofdstuk: VI
        paragraaf: '3'
  - number: 130b
    text: |-
      [Artikel 69, tweede lid][ref1], is niet van toepassing op beroepsincidenten die zich hebben voorgedaan vóór 1
      december 2005.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel69
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel130b
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '69'
        hoofdstuk: VIIa
  - number: 130c.1
    text: |-
      Onze Minister voor Wonen en Rijksdienst stelt bij ministeriële regeling een lijst vast met functies die op 31
      maart 2015 zijn ingedeeld in categorie B van de lijst, bedoeld in [artikel 97, eerste lid][ref1], van het Algemeen
      Rijksambtenarenreglement, zoals dat luidde voor inwerkingtreding van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel97
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel130c
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '97'
        hoofdstuk: X
  - number: 130c.2
    text: |-
      Bij regeling van Onze Minister van Infrastructuur en Milieu worden regels gesteld voor ambtenaren die op 31 maart
      2015 werkzaam zijn in een functie als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel130c
  - number: 131a.1
    text: |-
      De ambtenaar, bedoeld in [artikel 58a, eerste lid][ref1], die voor de datum van inwerkingtreding van het Besluit
      van 26 november 2013 tot wijziging van het Algemeen Rijksambtenarenreglement, het Ambtenarenreglement Staten-
      Generaal en het Reglement Dienst Buitenlandse Zaken in verband met de harmonisatie van enkele secundaire
      arbeidsvoorwaarden Rijk en het herstel van enkele technische omissies (Stb. 2013, nr. 489) is aangewezen om tevens
      werkzaam te zijn als bedrijfshulpverlener, ontvangt eenmalig een compensatievergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel58a
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel131a
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 58a
        hoofdstuk: VIIa
  - number: 131a.2
    text: |-
      De compensatievergoeding, bedoeld in het eerste lid, bedraagt tweemaal het positieve verschil tussen de vergoeding,
      bedoeld in [artikel 58a, eerste lid][ref1], op jaarbasis van het jaar voor inwerkingtreding en de vergoeding op
      jaarbasis van het jaar na inwerkingtreding van genoemd besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel58a
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel131a
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 58a
        hoofdstuk: VIIa
  - number: 131a.3
    text: |-
      Indien de ambtenaar op het moment van inwerkingtreding van genoemd besluit, korter dan één jaar als
      bedrijfshulpverlener is aangewezen, wordt het verschil, bedoeld in het tweede lid, vermenigvuldigd met de breuk van
      het aantal maanden dat hij is aangewezen als bedrijfshulpverlener in de teller en twaalf in de noemer.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel131a
  - number: '132'
    text: |-
      Voor zover voor ambtenaren bij een dienstvak nadere regels ter uitwerking of aanvulling van de bepalingen van dit
      besluit worden vereist, worden die regels door Ons, of in overeenstemming met Ons door Onze Minister, vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel132
  - number: 132a
    text: |-
      De [Algemene Termijnenwet][ref1] is niet van toepassing op de termijnen in dit besluit gesteld met uitzondering
      van die, genoemd in de artikelen 10, tweede en derde lid, [artikel 36b, derde en vierde lid][ref2], alsmede in
      hoofdstuk XI.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel36b
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel132a
    references:
      - id: ref1
        bwb_id: BWBR0002448
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 36b
        hoofdstuk: VI
        paragraaf: '2'
  - number: 132b
    text: |-
      Van de bevoegdheid tot het stellen van regels met een sterk technisch karakter krachtens dit besluit, anders
      dan krachtens de artikelen 4a, 9 en 10, kunnen Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, Onze
      Minister van Financiën en Onze Minister mandaat verlenen.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel132b
  - number: '133'
    text: Dit besluit treedt in werking met ingang van 1 September 1931.
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel133
  - number: '134'
    text: Dit besluit kan worden aangehaald als "Algemeen Rijksambtenarenreglement".
    url: https://wetten.overheid.nl/BWBR0001950/2015-04-01#Artikel134
