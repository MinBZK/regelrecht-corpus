---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: algemeen_rijksambtenarenreglement
regulatory_layer: AMVB
publication_date: '2019-06-05'
valid_from: '2006-07-07'
bwb_id: BWBR0001950
url: https://wetten.overheid.nl/BWBR0001950/2006-07-07
preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onzen Minister van Justitie van 20 Februari 1931, n°. 974, 2de Afdeeling A;

    Gelet op de artikelen 125, eerste lid en 133, eerste lid, van de Ambtenarenwet 1929;

    Den Raad van State gehoord (advies van 31 Maart 1931, n°. 22);

    Gezien het nader rapport van Onzen Minister voornoemd van 9 Juni 1931, n°. 918, 2 A;

    Hebben goedgevonden en verstaan:

    vast te stellen de navolgende bepalingen.
  url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Ambtenaar in de zin van dit besluit is degene, die door het Rijk is aangesteld om in burgerlijke openbare dienst
      werkzaam te zijn.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel1
  - number: '2.1'
    text: 'Voor de toepassing van dit besluit worden niet als ambtenaren beschouwd:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel2
  - number: 2.1.a
    text: ministers en staatssecretarissen;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel2
  - number: 2.1.b
    text: Commissarissen des Konings;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel2
  - number: 2.1.c
    text: |-
      krachtens [Grondwet][ref1] of wet voor hun leven aangestelde ambtenaren;


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 2.1.d
    text: de Nationale ombudsman en substituut-ombudsmannen;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel2
  - number: 2.1.e
    text: burgemeesters;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel2
  - number: 2.1.f
    text: de voorzitter en de leden van de Wetenschappelijke Raad voor het Regeringsbeleid;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel2
  - number: 2.1.g
    text: |-
      de voorzitters van de huurcommissies, bedoeld in de [Uitvoeringswet huurprijzen woonruimte][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014315
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014315
  - number: '2.2'
    text: |-
      De hoofdstukken III, IV en V zijn niet van toepassing op ambtenaren met gedeeltelijke dag-, week- of jaartaken, die
      niet regelmatig dienst doen. Ten aanzien van de in die hoofdstukken geregelde onderwerpen worden voor hen voor elk
      betrokken dienstvak de nodige bepalingen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel2
  - number: '2.3'
    text: |-
      Op de ambtenaar die is aangesteld voor het verrichten van enkele diensten niet vallende binnen de taak van het
      betrokken dienstvak, waarbij per dienst een afzonderlijke beloning wordt vastgesteld, zijn niet van toepassing:
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel2
  - number: 2.3.a
    text: hoofdstuk II, paragraaf 4;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel2
  - number: 2.3.b
    text: de artikelen 14 en 16 tot en met 20*d*;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel2
  - number: 2.3.c
    text: de hoofdstukken IV en V;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel2
  - number: 2.3.d
    text: hoofdstuk VI, paragrafen 2 en 3;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel2
  - number: 2.3.e
    text: de artikelen 33fb, 39, 47 en 48a.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel2
  - number: '3.1'
    text: |-
      De bepalingen van dit besluit vinden slechts toepassing, voor zoover niet bij of krachtens eene wet anders is of
      wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel3
  - number: '3.2'
    text: |-
      De bepalingen van dit besluit of sommige daarvan vinden niet toepassing op ambtenaren of groepen van ambtenaren,
      ten aanzien van wie een algemeene maatregel van bestuur of een uit kracht daarvan gegeven voorschrift, om
      bijzondere redenen hare toepasselijkheid uitsluit.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel3
  - number: '4.1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel4
  - number: 4.1.a
    text: 'Onze Minister: het hoofd van het betrokken ministerie;'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel4
  - number: 4.1.b
    text: 'hoofd van dienst: de door Ons of door Onze Minister als zodanig aangewezen autoriteit;'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel4
  - number: 4.1.c
    text: 'volledige arbeidsduur: een arbeidsduur welke gemiddeld 36 werkuren per week omvat;'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel4
  - number: 4.1.d
    text: |-
      arbeidsduurfactor: een breuk, waarvan de teller bestaat uit de voor de ambtenaar vastgestelde arbeidsduur en de
      noemer bestaat uit het getal 36.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel4
  - number: '4.2'
    text: |-
      Tenzij anders is bepaald wordt voor de toepassing van dit besluit verstaan onder salaris, onderscheidenlijk
      bezoldiging, hetgeen daaronder wordt verstaan in het [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: '4.3'
    text: |-
      Ingeval de bezoldiging van de ambtenaar is geregeld krachtens een andere bezoldigingsregeling dan die
      bedoeld in het tweede lid, wordt voor de toepassing van dit besluit onder salaris, onderscheidenlijk
      bezoldiging verstaan, het bedrag dat op overeenkomstige wijze is vastgesteld als in het
      [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: '4.4'
    text: |-
      In dit besluit wordt onder echtgenoot of echtgenote mede verstaan de levenspartner met wie de niet gehuwde
      ambtenaar samenwoont en – met het oogmerk duurzaam samen te leven – een gemeenschappelijke huishouding voert op
      basis van een notarieel verleden samenlevingscontract bevattende de wederzijdse rechten en verplichtingen ter zake
      van die samenwoning en gemeenschappelijke huishouding alsmede de geregistreerde partner. Onder weduwe of weduwnaar
      wordt mede verstaan de achtergebleven levenspartner of de achtergebleven geregistreerde partner. Tegelijkertijd
      kan slechts een persoon als echtgenoot of echtgenote dan wel weduwe of weduwnaar worden aangemerkt. Onder gezinslid
      wordt in voorkomend geval mede verstaan de geregistreerde partner of de levenspartner. Onze Minister kan verlangen
      dat een schriftelijke verklaring van een notaris wordt overgelegd waaruit blijkt dat een samenlevingscontract is
      gesloten.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel4
  - number: '4.5'
    text: 'In dit besluit wordt onder lid van de Algemene Bestuursdienst verstaan:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel4
  - number: 4.5.a
    text: |-
      de ambtenaar die het ambt van lid van de topmanagementgroep, genoemd in de
      [bijlage A van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1], vervult;


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: 4.5.b
    text: |-
      de ambtenaar die een functie vervult waarvoor salarisschaal 17 of 18 van de
      [bijlage B van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1] geldt;


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: 4.5.c
    text: |-
      de ambtenaar die een functie vervult waarvoor salarisschaal 16 of 15 van de
      [bijlage B van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1] geldt en die daartoe door of namens
      Onze Minister in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: 4a
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt regels ten aanzien van de werving en selectie
      van ambtenaren.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel4a
  - number: '5.1'
    text: De aanstelling geschiedt in vaste of tijdelijke dienst.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel5
  - number: '5.2'
    text: De aanstelling geschiedt in vaste dienst, tenzij er grond is een aanstelling in tijdelijke dienst te verlenen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel5
  - number: '5.3'
    text: |-
      Degene die geen Nederlander is, kan slechts worden aangesteld indien hem verblijf is toegestaan op grond van
      artikel 9 van de Vreemdelingenwet en de vergunning tot verblijf het verrichten van arbeid in loondienst niet
      uitsluit, of indien hem verblijf is toegestaan op grond van artikel 10 van de Vreemdelingenwet.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel5
  - number: '5.4'
    text: |-
      Evenmin vindt aanstelling plaats in een functie waaruit ontslag op grond van artikel 97, tweede of derde lid,
      kan worden verleend, van personen die onmiddellijk voorafgaande aan de vroegst mogelijke datum van dat ontslag
      geen ononderbroken diensttijd van ten minste 5 jaar, doorgebracht in een of meer zodanige functies, zouden kunnen
      aanwijzen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel5
  - number: '5.5'
    text: |-
      Het in het vorige lid bepaalde is van overeenkomstige toepassing in geval van plaatsing van een ambtenaar in een
      functie als in dat lid bedoeld.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel5
  - number: 5a
    text: De aanstelling in vaste dienst geschiedt in algemene dienst van het rijk.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel5a
  - number: '6.1'
    text: 'Een aanstelling in tijdelijke dienst wordt verleend voor:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel6
  - number: 6.1.a
    text: een kalenderperiode, of
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel6
  - number: 6.1.b
    text: een andere objectief bepaalbare periode.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel6
  - number: '6.2'
    text: 'Een aanstelling in tijdelijke dienst kan plaatsvinden:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel6
  - number: 6.2.a
    text: |-
      voor een proeftijd van ten hoogste twee jaar, zonodig ambtshalve te verlengen met de tijd gedurende welke de
      ambtenaar de proeftijd niet in werkelijke dienst heeft doorgebracht;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel6
  - number: 6.2.b
    text: |-
      voor een tijd van ten hoogste drie maanden, indien de betrokkene de verlangde verklaring omtrent het gedrag,
      bedoeld in artikel 9, zesde lid, nog niet in zijn bezit heeft;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel6
  - number: 6.2.c
    text: voor het verrichten van werkzaamheden, waarvoor slechts tijdelijk een beroep op de arbeidsmarkt kan worden gedaan;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel6
  - number: 6.2.d
    text: voor een opleiding tot een beroep of verdere theoretische of praktische vorming;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel6
  - number: 6.2.e
    text: voor oproepkrachten;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel6
  - number: 6.2.f
    text: voor een andere reden.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel6
  - number: '6.3'
    text: |-
      In het geval een aanstelling in tijdelijke dienst voor een proeftijd is voorafgegaan door een andere aanstelling
      in tijdelijke dienst krachtens het tweede lid, onder b tot en met f, wordt de maximale duur van de proeftijd
      verminderd met de duur van die andere aanstelling, indien:
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel6
  - number: 6.3.a
    text: beide aanstellingen in tijdelijke dienst zijn verleend door Onze Minister;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel6
  - number: 6.3.b
    text: |-
      de andere aanstelling in tijdelijke dienst is beëindigd binnen een periode van drie maanden direct voorafgaande aan
      de aanstelling in tijdelijke dienst voor een proeftijd; en
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel6
  - number: 6.3.c
    text: het in deze beide aanstellingen in tijdelijke dienst dezelfde werkzaamheden betreft.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel6
  - number: '6.4'
    text: |-
      Vanaf de dag waarop na het verstrijken van de door Onze Minister vastgestelde proeftijd de aanstelling in
      tijdelijke dienst stilzwijgend wordt voortgezet, geldt dat er een aanstelling in vaste dienst is verleend.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel6
  - number: '6.5'
    text: |-
      De aanstelling in tijdelijke dienst, bedoeld in het tweede lid, onder b tot en met f, wordt geacht opnieuw voor
      dezelfde tijd, maar telkens ten hoogste voor een jaar op dezelfde voorwaarden te zijn verleend in geval van
      stilzwijgende voortzetting na het verstrijken van de tijd, voor welke zij is verleend.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel6
  - number: '6.6'
    text: 'De aanstelling in tijdelijke dienst geldt als een aanstelling in vaste dienst vanaf de dag waarop:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel6
  - number: 6.6.a
    text: |-
      door Onze Minister verleende aanstellingen in tijdelijke dienst elkaar met tussenpozen van niet meer dan drie
      maanden hebben opgevolgd en een periode van 36 maanden, deze tussenpozen inbegrepen, hebben overschreden;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel6
  - number: 6.6.b
    text: |-
      meer dan drie door Onze Minister verleende aanstellingen in tijdelijke dienst elkaar hebben opgevolgd met
      tussenpozen van niet meer dan drie maanden.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel6
  - number: '6.7'
    text: |-
      Het zesde lid is van overeenkomstige toepassing, indien de ambtenaar voorafgaande aan een door Onze Minister
      verleende aanstelling in tijdelijke dienst dan wel tussen twee door Onze Minister verleende aanstellingen in
      tijdelijke dienst binnen zijn gezagsbereik op een andere titel dan een aanstelling dezelfde werkzaamheden heeft
      verricht.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel6
  - number: '6.8'
    text: |-
      Het zesde lid, aanhef en onder a, is niet van toepassing op een aanstelling, aangegaan voor niet meer dan drie
      maanden, die onmiddellijk volgt op een aanstelling van 36 maanden of langer.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel6
  - number: '6.9'
    text: |-
      Voorzover de aanstelling betrekking heeft op een functie bij de Algemene Rekenkamer, de Hoge Raad van Adel, het
      Kabinet der Koningin, de Kanselarij der Nederlandse Orden, de Nationale ombudsman of de Raad van State dient in
      het derde, het vierde, het zesde en het zevende lid voor Onze Minister telkens te worden gelezen: het College van
      de Algemene Rekenkamer, respectievelijk de voorzitter van de Hoge Raad van Adel, de directeur van het Kabinet der
      Koningin, de kanselier der Nederlandse Orden, de Nationale ombudsman of de vice-president van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel6
  - number: 6a.1
    text: |-
      In zeer bijzondere gevallen kan op verzoek van betrokkene een aanstelling in tijdelijke dienst worden verleend
      waarin ten aanzien van hem dit besluit gedeeltelijk of andere algemene maatregelen van bestuur als bedoeld in
      [artikel 125, eerste lid, van de Ambtenarenwet][ref1] die specifiek betrekking hebben op ambtenaren in de zin van
      dit besluit, geheel of gedeeltelijk buiten toepassing worden verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '125'
  - number: 6a.2
    text: |-
      Bij regeling van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kunnen nadere regels worden gesteld
      omtrent het eerste lid.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel6a
  - number: 6b.1
    text: De aanstelling geschiedt voor een vast aantal uren of voor een variabel aantal uren.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel6b
  - number: 6b.2
    text: Indien de aanstelling geschiedt voor een variabel aantal uren wordt daarbij een aantal garantie-uren bepaald.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel6b
  - number: 6b.3
    text: |-
      Indien het dienstbelang zich in bijzondere gevallen verzet tegen het bepalen van een aantal garantie-uren kan Onze
      Minister regels stellen waarbij wordt afgeweken van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel6b
  - number: '7.1'
    text: |-
      Tenzij Wij anders hebben bepaald geschiedt de aanstelling en, voor zover nodig, de vaststelling van de
      salarisschaal door Ons, indien het betreft:
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel7
  - number: 7.1.a
    text: een lid van de Algemene Bestuursdienst;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel7
  - number: 7.1.b
    text: |-
      de ambtenaar die een ambt vervult genoemd in de
      [bijlage A van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1], niet zijnde dat van lid van de
      topmanagementgroep;


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: 7.1.c
    text: |-
      de ambtenaar die een functie vervult waarvoor salarisschaal 16 of 15 van de
      [bijlage B van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1] geldt en die niet is aangewezen tot
      lid van de Algemene Bestuursdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: '7.2'
    text: |-
      Tenzij Wij anders hebben bepaald geschiedt de in het eerste lid bedoelde aanstelling en vaststelling van de
      salarisschaal op de voordracht van:
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel7
  - number: 7.2.a
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, indien het betreft een lid van de topmanagementgroep,
      bedoeld in artikel 4, vijfde lid, onder a;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel7
  - number: 7.2.b
    text: |-
      Onze Minister in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, indien het
      betreft een ambtenaar bedoeld in artikel 4, vijfde lid, onder b of c;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel7
  - number: 7.2.c
    text: Onze Minister, indien het betreft een ambtenaar, bedoeld in het eerste lid, onder b of c.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel7
  - number: '7.3'
    text: In de overige gevallen vindt de aanstelling en vaststelling van de salarisschaal plaats door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel7
  - number: '7.4'
    text: |-
      De ambtenaar die is aangesteld tot lid van de topmanagementgroep wordt door Onze Minister van Binnenlandse Zaken
      en Koninkrijksrelaties in overeenstemming met Onze Minister voor een periode van maximaal zeven jaar benoemd in een
      van de volgende functies: - secretaris-generaal
        - directeur-generaal
        - inspecteur-generaal
        - thesaurier-generaal
        - directeur Bureau voor de Industriële eigendom
        - directeur van het Centraal Planbureau
        - hoofd van de Algemene Inlichtingen- en Veiligheidsdienst.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel7
  - number: '7.5'
    text: |-
      In bijzondere gevallen kan de periode van zeven jaar, genoemd in het vierde lid, worden verlengd dan wel voortijdig
      worden beëindigd. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt regels ten aanzien van de
      wijze waarop tot verlenging respectievelijk voortijdige beëindiging wordt gekomen, alsmede over de gevolgen voor de
      rechtspositie van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel7
  - number: '7.6'
    text: |-
      Tenzij Wij anders hebben bepaald wordt de ambtenaar, bedoeld in artikel 4, vijfde lid, onder b of c, voor een
      periode van in beginsel ten hoogste vijf jaar in een functie benoemd. Deze benoeming duurt voort, zolang na afloop
      van die periode geen nieuwe functie wordt opgedragen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel7
  - number: '7.7'
    text: |-
      Voor zover de aanstelling betrekking heeft op een functie bij de Algemene Rekenkamer, de Hoge Raad van Adel, het
      Kabinet der Koningin, de Kanselarij der Nederlandse Orden, de Nationale Ombudsman of de Raad van State, dient
      in het tweede en derde lid voor Onze Minister telkens te worden gelezen: het College van de Algemene Rekenkamer
      respectievelijk de voorzitter van de Hoge Raad van Adel, de directeur van het Kabinet der Koningin, de kanselier
      der Nederlandse Orden, de Nationale Ombudsman of de vice-president van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel7
  - number: '8.1'
    text: |-
      In deze paragraaf wordt verstaan onder "het bevoegd gezag": het tot aanstelling bevoegd gezag of, indien de
      aanstelling bij koninklijk besluit geschiedt, Onze Minister.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel8
  - number: '8.2'
    text: |-
      Voor zover de aanstelling bij koninklijk besluit geschiedt en betrekking heeft op een functie bij de Raad van
      State, de Algemene Rekenkamer of het bureau van de Nationale ombudsman wordt verstaan onder het bevoegd gezag: de
      vice-president van de Raad van State respectievelijk de Algemene Rekenkamer of de Nationale ombudsman.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel8
  - number: '9.1'
    text: |-
      Een aanstelling voor de tijd van langer dan drie maanden kan slechts plaatsvinden, indien het bevoegd gezag op
      grond van de gegevens waarover het beschikt van oordeel is dat de betrokkene in voldoende mate geschikt en bekwaam
      is voor de desbetreffende functie.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel9
  - number: '9.2'
    text: |-
      Het bevoegd gezag kan voor een bepaalde functie of voor een groep van functies eisen van geschiktheid en
      bekwaamheid vaststellen waaraan de betrokkene moet voldoen om voor een aanstelling in aanmerking te komen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel9
  - number: '9.3'
    text: |-
      Teneinde vast te stellen of de betrokkene in voldoende mate geschikt of bekwaam is, wordt deze aan een onderzoek
      onderworpen, waaronder begrepen het verifiëren en zo nodig aanvullen van de gegevens die door de betrokkene
      desgevraagd zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel9
  - number: '9.4'
    text: 'Het onderzoek, bedoeld in het derde lid, omvat tevens:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel9
  - number: 9.4.a
    text: een psychologisch onderzoek, indien daaraan naar het oordeel van het bevoegd gezag behoefte bestaat;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel9
  - number: 9.4.b
    text: |-
      een geneeskundig onderzoek, indien dit op grond van een wettelijk voorschrift verplicht is gesteld dan wel indien
      op grond van functie-eisen een onderzoek naar de medische geschiktheid van de betrokkene noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel9
  - number: '9.5'
    text: |-
      Onze Minister stelt vast voor welke functies een onderzoek naar de medische geschiktheid van de betrokkene
      noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel9
  - number: '9.6'
    text: |-
      Het bevoegd gezag kan, met uitzondering van de gevallen, bedoeld in het zevende en het achtste lid, van de
      betrokkene vergen dat deze een verklaring omtrent het gedrag als bedoeld in de [Wet justitiële gegevens][ref1]
      overlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: '9.7'
    text: |-
      Indien een functie niet zijnde een vertrouwensfunctie als bedoeld in
      [artikel 1, eerste lid, onder a, van de Wet veiligheidsonderzoeken][ref1], bijzondere eisen stelt aan de
      integriteit of de verantwoordelijkheid van degene die deze functie vervult en indien een zwaarwegend algemeen
      belang dit vordert, kunnen aan het bevoegd gezag justitiële gegevens worden verstrekt voor het verrichten van
      een onderzoek naar de betrouwbaarheid en de geschiktheid van een kandidaat voor die functie. Aanstelling in een
      zodanige functie is slechts mogelijk, indien op grond van het onderzoek tegen de vervulling door betrokkene van de
      desbetreffende functie geen bezwaar blijkt te bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel1
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008277
        artikel: '1'
  - number: '9.8'
    text: |-
      Aanstelling in een vertrouwensfunctie als bedoeld in [artikel 1, eerste lid, onder ][ref1] is slechts mogelijk,
      indien ten aanzien van de betrokkene een verklaring als bedoeld in artikel 1, eerste lid, onder *b*, van die wet
      is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel1
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008277
        artikel: '1'
  - number: '9.9'
    text: |-
      Onze Minister stelt nadere regels vast ter uitvoering van het onderzoek, bedoeld in het zevende lid. Deze
      nadere regels dienen in ieder geval waarborgen te bevatten omtrent een voldoende bescherming van de persoonlijke
      levenssfeer van betrokkene.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel9
  - number: '9.10'
    text: |-
      Het geneeskundig onderzoek, bedoeld in het vierde lid, onderdeel *b*, mag pas plaatsvinden, indien de betrokkene
      naar het oordeel van het bevoegd gezag op grond van het onderzoek, bedoeld in het derde lid, en eventueel na het
      psychologisch onderzoek, bedoeld in het vierde lid, onderdeel *a*, overigens voldoende bekwaam en geschikt is voor
      de desbetreffende functie. Ook een verklaring omtrent het gedrag mag dan pas worden gevraagd.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel9
  - number: '9.11'
    text: |-
      Een onderzoek als bedoeld in het zevende lid of een veiligheidsonderzoek wordt pas ingesteld als naar het oordeel
      van het bevoegd gezag de betrokkene bekwaam en geschikt is voor de betreffende functie.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel9
  - number: '9.12'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan omtrent het onderzoek, bedoeld in het derde lid,
      nadere regels vaststellen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel9
  - number: 9a
    text: |-
      Bij wijziging van een tijdelijk in een vast dienstverband dan wel in geval van wijziging van tewerkstelling in
      een andere niet-vertrouwensfunctie wordt geen verklaring omtrent het gedrag verlangd of, indien het een functie
      betreft die bijzondere eisen stelt aan de integriteit of verantwoordelijkheid van de betrokkene, wordt niet
      verzocht om justitiële gegevens, tenzij naar het oordeel van het bevoegd gezag door gewijzigde omstandigheden
      betreffende de functie of de tewerkstelling een verklaring omtrent het gedrag dan wel een onderzoek, bedoeld in
      [artikel 9, zevende lid][ref1], nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel9
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
  - number: '10.1'
    text: |-
      De kosten van het geneeskundig onderzoek en het hernieuwd geneeskundig onderzoek komen voor rekening van het
      Rijk. De betrokkene ontvangt een vergoeding van reis- en verblijfkosten op de voet van de bepalingen van het
      [Reisbesluit binnenland][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005889
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005889
  - number: '10.2'
    text: |-
      De uitslag van het geneeskundig onderzoek wordt uiterlijk binnen twee weken na vaststelling aan de betrokkene
      medegedeeld.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel10
  - number: '10.3'
    text: |-
      De betrokkene kan binnen twee weken nadat hem de uitslag van het geneeskundig onderzoek is meegedeeld, een
      hernieuwd geneeskundig onderzoek aanvragen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel10
  - number: '10.4'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt omtrent het hernieuwd geneeskundig onderzoek
      nadere regels vast. Dit hernieuwd geneeskundig onderzoek mag niet worden verricht door de arts die het geneeskundig
      onderzoek heeft verricht.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel10
  - number: '10.5'
    text: |-
      Bij wijziging van een tijdelijk in een vast dienstverband vindt niet opnieuw een geneeskundig onderzoek plaats,
      tenzij ten aanzien van de geschiktheid van de betrokkene ernstige twijfel is gerezen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel10
  - number: '10.6'
    text: |-
      De betrokkene die op grond van artikel 9, vierde lid, onderdeel *b*, is onderworpen aan een geneeskundig onderzoek,
      wordt bij aanstelling in een andere functie opnieuw aan een onderzoek naar de medische geschiktheid onderworpen
      indien betrokkene voor het vervullen van die functie aan andere medische eisen dient te voldoen dan voor de tot
      dusverre vervulde functie.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel10
  - number: '11.1'
    text: |-
      Aan de betrokkene die is onderworpen aan een psychologisch onderzoek als bedoeld in artikel 9, vierde lid,
      onderdeel *a*, wordt op zijn verzoek binnen twee weken na de vaststelling van de uitslag van het onderzoek inzage
      verleend in die uitslag. Dit vindt plaats in het kader van een nagesprek met de psycholoog die het onderzoek heeft
      verricht.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel11
  - number: '11.2'
    text: |-
      Mededeling van de uitslag van het onderzoek aan het bevoegd gezag blijft achterwege, indien de betrokkene uiterlijk
      een week nadat hij van de uitslag van het onderzoek heeft kennis genomen zijn wens daartoe schriftelijk heeft
      meegedeeld aan degene die met het onderzoek is belast.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel11
  - number: '11.3'
    text: |-
      De uitslag van het onderzoek wordt niet eerder dan twee weken nadat betrokkene van de uitslag van het onderzoek
      heeft kennis genomen, medegedeeld aan het tot aanstelling bevoegd gezag, tenzij die mededeling op een eerder
      tijdstip is geboden en de betrokkene met die eerdere mededeling schriftelijk heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel11
  - number: '11.4'
    text: |-
      Voor zover dit niet heeft plaatsgevonden overeenkomstig het bepaalde in het eerste lid heeft de betrokkene recht op
      een nagesprek met de psycholoog die het onderzoek heeft verricht.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel11
  - number: '11.5'
    text: |-
      De betrokkene kan na afloop van het in het eerste en vierde lid bedoelde nagesprek afschrift
      nemen van de uitslag of daarvan een fotocopie krijgen overeenkomstig het bij en krachtens
      [artikel 12 van de Wet openbaarheid van bestuur][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel12
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '12'
  - number: '11.6'
    text: |-
      De kosten van het onderzoek en van het nagesprek komen voor rekening van het Rijk. De betrokkene ontvangt voor
      ten behoeve van het onderzoek gemaakte reis- en verblijfkosten een vergoeding op de voet van de bepalingen van het
      [Reisbesluit binnenland][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005889
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005889
  - number: '11.7'
    text: |-
      Het eerste, tweede en derde lid zijn niet van toepassing op vergelijkende vooronderzoeken in de door Onze Minister
      van Binnenlandse Zaken en Koninkrijksrelaties te bepalen gevallen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel11
  - number: '12.1'
    text: |-
      Aan de ambtenaar wordt, zo mogelijk vóór de aanvaarding van zijn ambt, een akte van aanstelling uitgereikt, waarin
      in ieder geval worden vermeld:
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel12
  - number: 12.1.a
    text: de naam, de voornamen en de geboortedatum van de ambtenaar;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel12
  - number: 12.1.b
    text: |-
      de naam van het ministerie, de dienst, het bedrijf of de instelling, waarbij hij werkzaam zal zijn, al dan niet als
      lid van de Algemene Bestuursdienst;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel12
  - number: 12.1.c
    text: de datum, met ingang waarvan hij wordt aangesteld;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel12
  - number: 12.1.d
    text: of de aanstelling geschiedt in vaste of tijdelijke dienst.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel12
  - number: '12.2'
    text: 'Indien de aanstelling geschiedt in tijdelijke dienst, wordt bovendien in de akte van aanstelling vermeld:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel12
  - number: 12.2.a
    text: de duur van de aanstelling in tijdelijke dienst;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel12
  - number: 12.2.b
    text: de toepasselijke, in artikel 6, tweede lid, omschreven grond(en) voor de aanstelling in tijdelijke dienst;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel12
  - number: 12.2.c
    text: de specifieke reden, indien sprake is van een aanstelling op grond van artikel 6, tweede lid, onder f.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel12
  - number: '12.3'
    text: |-
      Indien de aanstelling geschiedt in tijdelijke dienst met toepassing van artikel 6*a*, eerste lid, wordt bovendien
      in de akte van aanstelling vermeld welke van de in dat artikellid bedoelde regelingen geheel of gedeeltelijk buiten
      toepassing zijn verklaard.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel12
  - number: '12.4'
    text: |-
      Indien de aanstelling geschiedt voor een variabel aantal uren wordt in de akte van aanstelling in voorkomende
      gevallen bovendien het op grond van artikel 6b, tweede lid, voor de ambtenaar geldende aantal garantie-uren
      vermeld.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel12
  - number: 12a
    text: |-
      Voor zover deze gegevens op hem betrekking hebben en niet reeds in de akte van aanstelling zijn vermeld, worden aan
      de ambtenaar zo spoedig mogelijk schriftelijk medegedeeld:
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel12a
  - number: 12a.a
    text: |-
      het ministerie, de afdeling of het dienstvak waarbij, de betrekking waarin, en de periode gedurende welke hij in
      die betrekking wordt te werk gesteld, zomede de hem dienovereenkomstig aangewezen standplaats;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel12a
  - number: 12a.b
    text: de salarisschaal en de voor de bepaling van die schaal in acht genomen regels;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel12a
  - number: 12a.c
    text: |-
      het salaris dat hem is toegekend, zomede, het salarisnummer en het tijdstip waarop het salaris voor de eerste maal
      periodiek zal worden verhoogd;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel12a
  - number: 12a.d
    text: andere hem mogelijk toegekende voordelen, onder verwijzing naar de desbetreffende kortingsregeling.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel12a
  - number: 12c.1
    text: |-
      De ambtenaar wordt bij zijn aanstelling schriftelijk op de hoogte gesteld van de hoofdlijnen van zijn
      rechtspositie.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel12c
  - number: 12c.2
    text: |-
      Regelingen waarin zijn rechtspositie is neergelegd worden op een voor de ambtenaar gemakkelijk toegankelijke plaats
      ter inzage gelegd. Van deze regelingen kan hij kosteloos afschriften maken voor zover dat redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel12c
  - number: 12c.3
    text: |-
      De schriftelijk vastgestelde en voor hem geldende regelingen en instructies, welke hij bij de vervulling van zijn
      dienst heeft na te leven, worden eveneens op een voor de ambtenaar gemakkelijk toegankelijke plaats ter inzage
      gelegd. In het geval vermelde regelingen en instructies niet schriftelijk zijn vastgesteld, worden deze behoorlijk
      te zijner kennis gebracht.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel12c
  - number: 12c.4
    text: |-
      Over belangrijke wijzigingen in regelingen betreffende zijn rechtspositie wordt de ambtenaar periodiek op de hoogte
      gesteld.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel12c
  - number: '13.1'
    text: |-
      Wij behouden Ons voor op de voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, die in de
      daarvoor in aanmerking komende gevallen overleg pleegt met Onze betrokken Minister, regels vast te stellen omtrent
      loopbaanvorming in het algemeen en omtrent daarmede verband houdende bijzondere regelingen ter bepaling van de voor
      de ambtenaar geldende salarisschaal.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel13
  - number: '13.2'
    text: |-
      Voor zover dit niet door Ons is geschied, kunnen deze regels en bijzondere regelingen ook worden vastgesteld
      door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties dan wel, passend in het door deze gecoördineerde
      beleid, door Onze Minister, hoofd van het desbetreffende departement van algemeen bestuur.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel13
  - number: '14'
    text: |-
      De ambtenaar ontvangt over den tijd, gedurende welken hij in strijd met zijne verplichtingen opzettelijk nalaat
      zijn dienst te verrichten, geen bezoldiging.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel14
  - number: '15'
    text: |-
      De beloning van de ambtenaar, die is aangesteld voor enkele diensten, niet vallende binnen de taak van het
      betrokken dienstvak, wordt bepaald op een voor elk geval of voor elke te verrichten dienst, afzonderlijk vast te
      stellen bedrag.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel15
  - number: '16.1'
    text: |-
      Aan de ambtenaar die in verband met de werkzaamheden die voortvloeien uit een functie in een publiekrechtelijk
      college, waarin hij is benoemd of verkozen, tijdelijk is ontheven van de waarneming van zijn ambt wordt
      gedurende zijn ontheffing een non-activiteitswedde toegekend. De non-activiteitswedde is het bedrag waarmee de
      laatstelijkdoor hem in zijn ambt genoten bezoldiging het bedrag van de inkomsten die de ambtenaar in verband met
      zijn werkzaamheden in dat publiekrechtelijk college geniet, overschrijdt.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel16
  - number: '16.2'
    text: 'Voor de toepassing van het eerste lid geldt voorts dat:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel16
  - number: 16.2.a
    text: |-
      toekenning van de non-activiteitswedde plaatsvindt op de voet van het
      bepaalde in de [artikelen 4, tweede, derde, vierde en vijfde lid][ref1], en
      [5 van de Wet Incompatibiliteiten Staten-Generaal en Europees Parlement][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006612#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006612#Artikel5
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006612
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0006612
        artikel: '5'
  - number: 16.2.b
    text: |-
      onder inkomsten die in verband met zijn werkzaamheden in dat publiekrechtelijk college worden genoten wordt
      verstaan: alle inkomsten die aan die werkzaamheden zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel16
  - number: '16.3'
    text: |-
      Voor de toepassing van dit artikel wordt de functie van substituut-ombudsman met de in het eerste lid bedoelde
      functie gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel16
  - number: '16.4'
    text: |-
      Dit artikel is niet van toepassing op degenen die een non-activiteitswedde geniet uit hoofde van
      [artikel 4, eerste lid, van de Wet Incompatibiliteiten Staten-Generaal en Europees Parlement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006612#Artikel4
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006612
        artikel: '4'
  - number: '17.1'
    text: |-
      De ambtenaar, die als militair in werkelijke dienst is, wordt geacht in zijn burgerlijke betrekking met verlof
      te zijn.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel17
  - number: '17.2'
    text: |-
      Hij behoudt over de tijd van deze dienst het genot van de aan zijn ambt verbonden bezoldiging, slechts voor zover
      hem bij of krachtens de artikelen 18 tot en met 20 daarop aanspraak is verleend. Voor zover die werkelijke dienst
      wordt vervuld in aan hem verleend vacantieverlof, behoudt hij in ieder geval het genot van de volle aan zijn ambt
      verbonden bezoldiging.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel17
  - number: '17.3'
    text: |-
      Voor de toepassing van het vorige lid en de artikelen 18 tot en met 20 en 20*d*
      wordt - ingeval de ambtenaar in het genot is van een toelage als bedoeld in
      [artikel 17 van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1] - dit bezoldigingsdeel vastgesteld
      op het bedrag dat hem ingevolge de voor hem geldende werktijdregeling zou zijn toegekend, indien hij niet aan
      zijn burgerlijke betrekking zou zijn onttrokken. Is de vaststelling van het bedrag op deze wijze niet mogelijk,
      dan wordt dit, met inachtneming van de percentages en het berekeningsmaximum zoals genoemd in artikel 17 van
      vorengenoemd besluit, berekend over het voor de ambtenaar geldende salaris, zulks naar de aantallen uren als
      bedoeld in dat artikel waarop door hem gedurende de drie kalendermaanden voorafgaande aan het tijdstip met ingang
      waarvan hij aan zijn burgerlijke betrekking werd onttrokken, ingevolge de voor hem geldende werktijdregeling
      gemiddeld per maand is gewerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel17
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '17'
  - number: '17.4'
    text: |-
      Voor de toepassing van het tweede lid en de artikelen 18 tot en met 20 en 20*d* wordt - ingeval de ambtenaar in
      het genot is van een toelage als bedoeld in [artikel 18][ref1] - dit bezoldigingsdeel vastgesteld op het bedrag
      dat hem ingevolge het voor hem geldende consignatierooster zou zijn toegekend, indien hij niet aan zijn burgerlijke
      betrekking zou zijn onttrokken. Is de vaststelling van het bedrag op deze wijze niet mogelijk, dan wordt dit
      bedrag berekend naar de berekeningsgrondslag en de percentages zoals genoemd in artikel 18*a* van vorengenoemd
      besluit, zulks naar de aantallen uren als bedoeld in dat artikel waarop door hem gedurende de drie kalendermaanden
      voorafgaande aan het tijdstip met ingang waarvan hij aan zijn burgerlijke betrekking werd onttrokken, gemiddeld per
      maand consignatiediensten zijn verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel18a
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: 18a
  - number: '17.5'
    text: |-
      Voor zover de ambtenaar ingevolge de voor hem geldende bezoldigingsregeling aanspraak heeft op een vakantie-
      uitkering geniet hij deze uitkering slechts voor zoveel die uitgaat boven de vakantie-uitkering waarop hij als
      militair aanspraak heeft.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel17
  - number: '18.1'
    text: |-
      De ambtenaar, die ingevolge wettelijke verplichting anders dan voor herhalingsoefening als militair in werkelijke
      dienst is, geniet onverminderd het bepaalde in artikel 92 de aan zijn ambt verbonden bezoldiging voor zoveel deze
      meer bedraagt dan zijn militaire beloning, met dien verstande, dat indien de ambtenaar ongehuwd is, hij slechts
      de aan zijn ambt verbonden bezoldiging geniet, voor zoveel 70 ten honderd daarvan meer bedraagt dan zijn militaire
      beloning.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel18
  - number: '18.2'
    text: |-
      Zonodig in afwijking van het bepaalde in het eerste lid blijft de ambtenaar als daar bedoeld in ieder geval
      de aan zijn ambt verbonden bezoldiging genieten tot een bedrag, dat gelijk is aan het bedrag van het op hem
      te verhalen gedeelte van de pensioenbijdrage en van de premie voor de Regeling flexibel pensioen en uittreden,
      bedoeld in artikel 3 van de Centrale vut-overeenkomst overheids- en onderwijspersoneel en artikel 1.5 van het
      Pensioenreglement van de Stichting Pensioenfonds ABP.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel18
  - number: '18.3'
    text: |-
      Ongehuwde enige kostwinners worden voor de toepassing van het eerste lid gelijk gesteld met gehuwden. Onze
      Minister, Hoofd van het betrokken departement van algemeen bestuur, beslist of een ongehuwde als enig kostwinner
      wordt beschouwd.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel18
  - number: '18.4'
    text: |-
      Voor de toepassing van het eerste lid wordt de militaire beloning verminderd met een eventuele aftrek wegens genot
      van voeding en huisvesting.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel18
  - number: '18.5'
    text: |-
      Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van Financiën stellen bij gemeenschappelijke
      ministeriële regeling vast hetgeen voor de toepassing van dit artikel onder militaire beloning wordt verstaan.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel18
  - number: '19.1'
    text: |-
      Het bepaalde in artikel 18 is eerst van toepassing, nadat de ambtenaar als militair de opleiding en oefening heeft
      volbracht.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel19
  - number: '19.2'
    text: |-
      De ambtenaar, die ingevolge een wettelijke verplichting voor opleiding en oefening als militair in werkelijke
      dienst is, geniet gedurende deze opleiding en oefening, de aan zijn ambt verbonden bezoldiging tot een
      bedrag, hetwelk gelijk is aan het op hem te verhalen gedeelte van de pensioenbijdrage en van de premie voor de
      Regeling flexibel pensioen en uittreden, bedoeld in artikel 3 van de Centrale vut-overeenkomst overheids- en
      onderwijspersoneel en artikel 1.5 van het Pensioenreglement van de Stichting Pensioenfonds ABP.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel19
  - number: '19.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing ten aanzien van ambtenaren op wie bij koninklijk besluit de
      artikelen 17 en 18 van overeenkomstige toepassing zijn verklaard.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel19
  - number: '19.4'
    text: |-
      Indien de ambtenaar bij opkomst in militaire dienst voldoet aan de voorwaarde, gesteld in het eerste lid, dan wel
      indien ingevolge het derde lid bij opkomst in militaire dienst deze voorwaarde niet voor hem geldt, geniet hij
      in afwijking van het bepaalde in artikel 18 gedurende twee weken na zijn opkomst de volle aan zijn ambt verbonden
      bezoldiging.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel19
  - number: '20.1'
    text: |-
      De ambtenaar die voor een herhalingsoefening als militair in werkelijke dienst is, geniet de aan zijn ambt
      verbonden bezoldiging voor zoveel deze meer bedraagt dan zijn militaire beloning. Artikel 18, tweede, vierde en
      vijfde lid, is van toepassing.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel20
  - number: '20.2'
    text: Voor zoveel nodig bepaalt Onze Minister van Defensie welke dienst als herhalingsoefening wordt beschouwd.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel20
  - number: '20.3'
    text: |-
      Voor de toepassing of voortgezette toepassing van het eerste lid worden met inachtneming van hetgeen daaromtrent is
      bepaald in de [Kaderwet dienstplicht][ref1] of in de Wet voor het reservepersoneel der krijgsmacht en onverminderd
      het bepaalde in artikel 92 van dit reglement met herhalingsoefeningen gelijk gesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0008589
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0008589
  - number: 20.3.a
    text: |-
      het in dienst komen dan wel het in aansluiting aan een herhalingsoefening langer in dienst blijven voor een
      onderzoek omtrent een strafbaar feit of een krijgstuchtelijk vergrijp, waarvan de militair verdacht of beklaagd
      wordt;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel20
  - number: 20.3.b
    text: |-
      het in dienst komen dan wel het in aansluiting aan een herhalingsoefening langer in dienst blijven ten einde
      rekening en verantwoording af te leggen van gevoerd beheer;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel20
  - number: 20.3.c
    text: 'het in aansluiting aan een herhalingsoefening langer in dienst blijven wegens:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel20
  - number: 20.3.c.1
    text: ziekte;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel20
  - number: 20.3.c.2
    text: het niet tijdig bereiken van de vereiste graad van geoefendheid als gevolg van ziekte;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel20
  - number: 20.3.c.3
    text: het heersen of geheerst hebben van een besmettelijke ziekte;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel20
  - number: 20.3.d
    text: |-
      het in dienst komen om gehoord te worden omtrent een bij Ons of bij Onze Minister van Defensie ingediend
      beroepschrift onderscheidenlijk bezwaarschrift.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel20
  - number: 20a
    text: |-
      Indien de ambtenaar, als militair in werkelijke dienst zijnde, overlijdt, wordt de uitkering, bedoeld in artikel
      102, verminderd met het bedrag van de overeenkomstige uitkering, welke uit hoofde van de militaire dienst ter zake
      van dit overlijden wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel20a
  - number: 20b.1
    text: 'Het bepaalde in de artikelen 17 tot en met 20*a* is van overeenkomstige toepassing ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel20b
  - number: 20b.1.a
    text: |-
      de ambtenaar, die is tewerkgesteld in de zin van [artikel 9 van de Wet gewetensbezwaren militaire dienst][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel9
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '9'
  - number: 20b.1.b
    text: de ambtenaar, die in werkelijke dienst is op grond van een verbintenis bij het Korps Nationale Reserve;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel20b
  - number: 20b.1.c
    text: |-
      de ambtenaar, die als militair in werkelijke dienst is op grond van een verbintenis bij het reserve-personeel der
      krijgsmacht;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel20b
  - number: 20b.1.d
    text: |-
      de ambtenaar, die op grond van een andere bijzondere verbintenis in werkelijke militaire of daarmede gelijk te
      stellen dienst is, ter zake waarvan Wij zulks hebben bepaald.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel20b
  - number: 20b.2
    text: Wij behouden Ons voor met betrekking tot de uitvoering van het eerste lid nadere regels te stellen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel20b
  - number: 20c
    text: |-
      Op de ambtenaar, die in tijdelijke dienst is aangesteld, zijn de bepalingen, vervat in de artikelen 17 tot en met
      20*b*, slechts van toepassing tot en met de dag, waarop de burgerlijke betrekking zou zijn beëindigd, indien hij
      daaraan niet door de militaire dienst zou zijn onttrokken.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel20c
  - number: 20d.1
    text: |-
      De ambtenaar, die op grond van een verbintenis als vrijwilliger in de zin van artikel 2, eerste lid onder *a*
      of *b*, van de Rechtstoestandsregeling reservepolitie of van een overeenkomstige verbintenis, als bedoeld in de
      artikelen 53 en 54 van die regeling in werkelijke dienst is, wordt geacht met verlof te zijn.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel20d
  - number: 20d.2
    text: |-
      De in het eerste lid bedoelde ambtenaar blijft gedurende het aldaar bedoelde verlof, onverminderd het bepaalde
      in artikel 92, in het genot van de aan zijn ambt verbonden bezoldiging, met dien verstande, dat deze bezoldiging,
      indien het verlof langer dan twee weken duurt, voor de verdere duur van het verlof wordt verminderd met de
      beloning, waarop de ambtenaar als vrijwilliger aanspraak heeft.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel20d
  - number: 20d.3
    text: |-
      De in het tweede lid bedoelde vermindering wordt slechts toegepast tot een zodanig bedrag, dat de ambtenaar in het
      genot blijft van een bedrag gelijk aan het op hem te verhalen gedeelte van de pensioenbijdrage en van de premie
      voor de Regeling flexibel pensioen en uittreden, bedoeld in artikel 3 van de Centrale vut-overeenkomst overheids-
      en onderwijspersoneel en artikel 1.5 van het Pensioenreglement van de Stichting Pensioenfonds ABP.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel20d
  - number: 20d.4
    text: |-
      Het bepaalde in het eerste, tweede en derde lid is niet van toepassing indien de ambtenaar de werkelijke dienst als
      vrijwilliger vervult tijdens aan hem verleend vakantieverlof.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel20d
  - number: 20d.5
    text: Het bepaalde in artikel 20*c* is voor zoveel mogelijk van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel20d
  - number: '21.1'
    text: |-
      Met inachtneming van het bepaalde in dit hoofdstuk en van het bepaalde in of krachtens wetten, houdende regels
      tot beperking van de werktijd, stelt het bevoegd gezag voor de ambtenaren werktijdregelingen vast. Onder
      werktijdregeling wordt verstaan een van tevoren bekend gemaakt schema van aanvang en einde van de dagelijkse
      werktijden gedurende een bepaalde periode. Het in de werktijdregeling opgenomen aantal te werken uren op jaarbasis
      kan niet hoger zijn dan gemiddeld 40 uur per week.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel21
  - number: '21.2'
    text: |-
      De arbeidsduur bedraagt gemiddeld ten hoogste 36 uur per week. De werktijd wordt behoorlijk door rusttijd
      onderbroken. De ambtenaar kan bij het bevoegd gezag een aanvraag indienen om de arbeidsduur in hele uren vast
      te stellen op meer dan gemiddeld 36 uur per week, waarbij een maximum geldt van gemiddeld 40 uur per week. Deze
      aanvraag wordt toegewezen tenzij het dienstbelang zich daartegen verzet. Een aanvraag tot het vaststellen van de
      arbeidsduur op meer dan gemiddeld 36 uur per week wordt niet toegewezen voor:
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel21
  - number: 21.2.a
    text: |-
      de ambtenaar wiens gemiddelde wekelijkse werktijd op basis van [artikel 21a][ref1] is teruggebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel21a
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 21a
        hoofdstuk: IV
  - number: 21.2.b
    text: |-
      de ambtenaar die op basis van [artikel 33g][ref1] betaald ouderschapsverlof geniet;


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel33g
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 33g
        hoofdstuk: V
        paragraaf: '2'
  - number: 21.2.c
    text: |-
      de ambtenaar die op basis van [artikel 34][ref1] buitengewoon verlof van lange duur geniet;


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel34
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '34'
        hoofdstuk: V
        paragraaf: '2'
  - number: 21.2.d
    text: |-
      de ambtenaar aan wie op basis van [artikel 94a, derde lid][ref1], gedeeltelijk ontslag is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel94a
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 94a
        hoofdstuk: X
  - number: 21.2.e
    text: |-
      de arbeidsgehandicapte in de zin van [artikel 2 van de Wet op de (re)ïntegratie arbeidsgehandicapten][ref1],
      waarbij een verminderde arbeidsprestatie is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel2
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '2'
  - number: '21.3'
    text: |-
      Het aantal te werken uren per jaar bedraagt: het aantal kalenderdagen per jaar verminderd met het aantal zaterdagen
      en zondagen en niet op zaterdag of zondag vallende feestdagen, genoemd in het zevende lid, onder a, in dat jaar,
      vermenigvuldigd met 7,2 en vervolgens vermenigvuldigd met de voor de ambtenaar geldende arbeidsduurfactor.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel21
  - number: '21.4'
    text: Het aantal te werken uren, bedoeld in het derde lid, wordt rekenkundig op hele uren afgerond.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel21
  - number: '21.5'
    text: |-
      Aan de ambtenaar van 55 jaar en ouder wordt niet opgedragen dienst te verrichten tussen 22.00 uur en 06.00 uur
      tenzij het een gedeelte van een dienst betreft die doorloopt na 22.00 uur en ten laatste eindigt om 24.00 uur.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel21
  - number: '21.6'
    text: |-
      Van het bepaalde in het vorige lid kan voor de duur van telkens ten hoogste één jaar worden afgeweken indien
      de ambtenaar dit heeft aangevraagd danwel zeer gewichtige redenen van dienstbelang hiertoe noodzaken, mits de
      deskundige persoon of de arbodienst als bedoeld in [hoofdstuk VI][ref1], daaromtrent een positief medisch advies
      heeft uitgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#HoofdstukVI
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001950
        hoofdstuk: VI
  - number: 21.7.a
    text: |-
      Geen dienst wordt geëist op zondagen, alsmede op de Nieuwjaarsdag, de Tweede Paasdag, de Hemelvaartsdag, de Tweede
      Pinksterdag, de beide Kerstdagen, de dag, waarop de verjaardag van de Koningin wordt gevierd en op 5 mei.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel21
  - number: 21.7.b
    text: |-
      Van onderdeel a van dit artikellid kan slechts worden afgeweken indien het dienstbelang dit onvermijdelijk maakt en
      met inachtneming van het navolgende:
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel21
  - number: 21.7.b.1
    text: geen dienst wordt geëist op ten minste dertien zondagen per periode van zes maanden;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel21
  - number: 21.7.b.2
    text: |-
      de ambtenaar wordt zo weinig mogelijk in zijn zondagsrust beperkt en hem wordt zoveel mogelijk de gelegenheid
      geboden op zondag en op de voor hem geldende kerkelijke feestdagen zijn kerk te bezoeken.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel21
  - number: 21.7.c
    text: |-
      De onderdelen a en b vinden ten aanzien van de zondag voor de ambtenaar die aan het hoofd van dienst heeft
      medegedeeld dat hij, in verband met zijn godsdienstige opvattingen, de wekelijkse rustdag op een andere dag dan de
      zondag viert, overeenkomstige toepassing voor die dag in plaats van ten aanzien van de zondag.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel21
  - number: 21.7.d
    text: Op zaterdag kan dienst worden geëist, mits de belangen van de dienst daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel21
  - number: 21.8.a
    text: |-
      De ambtenaar van 18 jaar of ouder heeft een onafgebroken rusttijd van hetzij ten minste 36 uren in elke
      aaneengesloten tijdruimte van 7 maal 24 uren, hetzij ten minste 60 uren in elke aaneengesloten tijdruimte van 9
      maal 24 uren welke rusttijd éénmaal in elke periode van 5 achtereenvolgende weken mag worden bekort tot 32 uren.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel21
  - number: 21.8.b
    text: |-
      De ambtenaar van 16 of 17 jaar heeft een onafgebroken rusttijd van ten minste 36 uren in elke aaneengesloten
      tijdruimte van 7 maal 24 uren.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel21
  - number: '21.9'
    text: |-
      Van de voor de ambtenaar vastgestelde werktijdregeling kan slechts worden afgeweken indien het dienstbelang dit
      onvermijdelijk maakt en - behoudens in geval van oorlog, oorlogsgevaar of andere buitengewone omstandigheden -
      mits ervoor wordt gezorgd, dat de ambtenaar in of over het desbetreffende tijdvak van zeven dagen een ononderbroken
      rusttijd van ten minste 36 uren geniet.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel21
  - number: '21.10'
    text: |-
      In bijzondere gevallen kan van de vaststelling van een werktijdregeling als bedoeld in het eerste lid worden
      afgezien. In die gevallen vindt in het tweede tot en met negende lid overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel21
  - number: '21.11'
    text: |-
      In overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan in uitzonderlijke
      gevallen van het bepaalde in het tweede tot en met negende lid, alsmede van het bepaalde in de tweede volzin
      van het tiende lid, worden afgeweken voorzover dat niet in strijd is met het bepaalde bij of krachtens de
      [Arbeidstijdenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007671
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0007671
  - number: '21.12'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties is bevoegd ter zake van de uitvoering van het bepaalde
      in dit artikel nadere regels vast te stellen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel21
  - number: 21a.1
    text: |-
      De gemiddelde wekelijkse werktijd van een ambtenaar van 57 jaar en ouder die daartoe een aanvraag heeft ingediend,
      wordt, met behoud van zijn arbeidsduur, teruggebracht met 15,8%, tenzij het dienstbelang zich daartegen verzet. De
      ambtenaar voor wie de arbeidsduur op meer dan gemiddeld 36 uur is vastgesteld, kan een aanvraag als bedoeld in de
      eerste volzin eerst indienen nadat op zijn aanvraag door het bevoegd gezag zijn arbeidsduur is vastgesteld op ten
      hoogste gemiddeld 36 uur.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel21a
  - number: 21a.2
    text: |-
      De in het eerste lid bedoelde ambtenaar dient op het moment van de vermindering van de werktijd tenminste 5
      aaneengesloten jaren in dienst te zijn van het rijk.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel21a
  - number: 21a.3
    text: |-
      Voor de uren die het wekelijkse verschil vormen tussen de in het eerste lid bedoelde arbeidsduur en de
      teruggebrachte werktijd wordt de ambtenaar geacht met verlof te zijn.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel21a
  - number: 21a.4
    text: |-
      Op het salaris van de in het eerste lid bedoelde ambtenaar wordt een inhouding toegepast. De hoogte van deze
      inhouding is afhankelijk van de leeftijd op de datum dat de werktijdvermindering op grond van dit artikel
      ingaat en bedraagt een percentage volgens onderstaande tabel van het salaris dat voor hem zou gelden zonder
      werktijdvermindering op grond van dit artikel, nadat dit salaris is verminderd met een eventuele inhouding als
      bedoeld in artikel 57b:






                    Leeftijd


                    Inhouding in procenten






                    57


                    5




                    58


                    5




                    59


                    3,5




                    60


                    3,5




                    61


                    2




                    62


                    2




                    63


                    1




                    64


                    1
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel21a
  - number: 21a.5
    text: |-
      De inhouding, bedoeld in het vierde lid, wordt teruggebracht tot 70% voor zover op grond van
      [artikel 37, eerste lid][ref1], niet meer dan 70% van de bezoldiging wordt doorbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel37
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '37'
        hoofdstuk: VI
        paragraaf: '3'
  - number: 21a.6
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt omtrent de verrekening van extra inkomsten uit
      arbeid of bedrijf met het salaris van de in het eerste lid bedoelde ambtenaar regels vast.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel21a
  - number: 21b
    text: |-
      De ambtenaar heeft het recht om, op zijn verzoek, in deeltijd te gaan werken, tenzij hieruit bezwaren voor de
      dienst voortvloeien.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel21b
  - number: 21c
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt regels ten aanzien van individuele
      keuzemogelijkheden in het arbeidsvoorwaardenpakket.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel21c
  - number: '22.1'
    text: De ambtenaar heeft jaarlijks aanspraak op vakantie met behoud van zijn volle bezoldiging.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel22
  - number: '22.2'
    text: De aanspraak op vakantie wordt uitgedrukt in hele uren.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel22
  - number: '22.3'
    text: 'De omvang van de aanspraak op vakantie is afhankelijk van:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel22
  - number: 22.3.a
    text: de leeftijd van de ambtenaar;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel22
  - number: 22.3.b
    text: de werktijd van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel22
  - number: '22.4'
    text: |-
      Voor de ambtenaar met volledige werktijd bedraagt de aanspraak op vakantie 165,6 uren per kalenderjaar. Onder
      volledige werktijd wordt verstaan een werktijd welke gemiddeld 36 werkuren per week omvat.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel22
  - number: '22.5'
    text: |-
      De op grond van het vierde lid geldende aanspraak op vakantie wordt verhoogd volgens onderstaande tabel afhankelijk
      van de leeftijd die de ambtenaar in het desbetreffende kalenderjaar bereikt:






                    leeftijd:


                    verhoging:




                    van 45 tot en met 49 jaar


                    7,2 uren






                    van 50 tot en met 54 jaar


                    14,4 uren




                    van 55 tot en met 59 jaar


                    21,6 uren




                    vanaf 60 jaar


                    28,8 uren.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel22
  - number: '22.6'
    text: |-
      De ingevolge het vierde en vijfde lid geldende aanspraak op vakantie wordt vermenigvuldigd met de voor de ambtenaar
      geldende arbeidsduurfactor. Zo nodig vindt afronding naar boven op hele uren plaats.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel22
  - number: '22.7'
    text: |-
      Bij beëindiging of aanvang van het dienstverband in de loop van een kalenderjaar, wordt de aanspraak op vakantie
      vastgesteld naar evenredigheid van de dienst, die hij in dat jaar verricht heeft of zal verrichten.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel22
  - number: '22.8'
    text: |-
      Indien de werktijd van de ambtenaar wordt gewijzigd, wordt de aanspraak op vakantie over een eventueel resterend
      gedeelte van het desbetreffende kalenderjaar opnieuw vastgesteld, rekening houdend met de nieuwe werktijd. De
      tot aan de datum van ingang van de wijziging van de werktijd verworven aanspraak op vakantie blijft ongewijzigd
      gehandhaafd.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel22
  - number: '22.9'
    text: |-
      Over kalendermaanden gedurende welke de ambtenaar in afwijking van de voor hem geldende werktijdregeling in
      het geheel geen dienst verricht, heeft hij geen aanspraak op vakantie. Over kalendermaanden gedurende welke de
      ambtenaar in afwijking van de voor hem geldende werktijdregeling gedeeltelijk dienst verricht, heeft hij aanspraak
      op vakantie naar evenredigheid van het gedeelte van de werktijd waarop hij volgens de werktijdregeling dienst
      verricht.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel22
  - number: '22.10'
    text: 'Lid 9 is niet van toepassing, indien geheel of gedeeltelijk geen dienst wordt verricht wegens:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel22
  - number: 22.10.a
    text: genoten vakantie;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel22
  - number: 22.10.b
    text: |-
      ziekte, voor zover de verhindering tot dienstverrichting korter duurt dan 26 weken, waarbij een hervatting van de
      dienstverrichting gedurende vier weken of minder geen nieuwe periode van 26 weken inluidt.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel22
  - number: 22.10.c
    text: |-
      zwangerschaps- en bevallingsverlof als bedoeld in [artikel 33fb, derde en vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel33fb
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 33fb
        hoofdstuk: V
        paragraaf: '2'
  - number: 22.10.d
    text: verblijf in militaire dienst wegens herhalingsoefeningen;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel22
  - number: 22.10.e
    text: |-
      verlof verleend op basis van artikel [32a][ref1], [33][ref2], [33b][ref3], [33c][ref4], [33d][ref5], [33h][ref6]
      of [33i van dit besluit][ref7];


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel32a
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0001950#Artikel33b
      [ref4]: https://wetten.overheid.nl/BWBR0001950#Artikel33c
      [ref5]: https://wetten.overheid.nl/BWBR0001950#Artikel33d
      [ref6]: https://wetten.overheid.nl/BWBR0001950#Artikel33h
      [ref7]: https://wetten.overheid.nl/BWBR0001950#Artikel33i
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 32a
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '33'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0001950
        artikel: 33b
        hoofdstuk: V
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0001950
        artikel: 33c
        hoofdstuk: V
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0001950
        artikel: 33d
        hoofdstuk: V
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0001950
        artikel: 33h
        hoofdstuk: V
        paragraaf: '2'
      - id: ref7
        bwb_id: BWBR0001950
        artikel: 33i
        hoofdstuk: V
        paragraaf: '2'
  - number: 22.10.f
    text: |-
      het minder uren werken op basis van de in [artikel 21c van dit besluit][ref1] bedoelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel21c
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 21c
        hoofdstuk: IV
  - number: '22.11'
    text: |-
      In afwijking van het tiende lid, onder b, heeft de ambtenaar gedurende de periode dat
      [artikel 40a, eerste lid, onderdeel i, q of r][ref1], toepassing vindt, geen aanspraak op vakantie.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel40a
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 40a
        hoofdstuk: VI
        paragraaf: '3'
  - number: '22.12'
    text: |-
      Met ingang van de dag dat de ambtenaar op grond van [artikel 21a][ref1] gedeeltelijk geen dienst verricht vervalt
      de in het vijfde lid bedoelde verhoging van de vakantieaanspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel21a
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 21a
        hoofdstuk: IV
  - number: '22.13'
    text: |-
      Indien het belang van de dienst zich daartegen niet verzet, kan het bevoegd gezag op aanvraag van de ambtenaar
      eenmaal per kalenderjaar zijn aanspraak op vakantie verlagen. Het aantal uren vakantie waarmee de aanspraak
      kan worden verlaagd, bedraagt ten hoogste het aantal uren vakantie waarop de ambtenaar over het desbetreffende
      kalenderjaar aanspraak heeft, verminderd met: 144 uur vermenigvuldigd met de voor de ambtenaar geldende
      arbeidsduurfactor. Zo nodig vindt afronding naar boven plaats.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel22
  - number: '22.14'
    text: |-
      Het bevoegd gezag stelt vast voor welke datum aanvragen als bedoeld in het dertiende lid kunnen worden ingediend en
      geeft op of na die datum gelijktijdig beschikkingen op de voor die datum ingediende aanvragen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel22
  - number: '22.15'
    text: |-
      De ambtenaar wordt voor elk uur vakantie waarmee zijn aanspraak op vakantie overeenkomstig het dertiende lid wordt
      verlaagd, een vergoeding toegekend ten bedrage van het salaris per uur dat hij geniet op de door het bevoegd gezag
      krachtens het veertiende lid vastgestelde datum.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel22
  - number: '22.16'
    text: |-
      Indien de ambtenaar de vergoeding, genoemd in het vijftiende lid, volledig inzet ten behoeve van levensloopverlof,
      bedoeld in [artikel 34g][ref1], bedraagt, in afwijking van het dertiende lid, het aantal uren waarmee de
      aanspraak op vakantie kan worden verlaagd ten hoogste het aantal uren waarop de ambtenaar over het desbetreffende
      kalenderjaar aanspraak heeft, verminderd met: 108 uur vermenigvuldigd met de voor de ambtenaar geldende
      arbeidsduurfactor. Zo nodig vindt afronding naar boven op hele uren plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel34g
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 34g
        hoofdstuk: V
        paragraaf: '2'
  - number: '23.1'
    text: |-
      De ambtenaar is vrij te bepalen wanneer hij vakantie opneemt, voor zoveel de belangen van de dienst zich daartegen
      niet verzetten.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel23
  - number: '23.2'
    text: |-
      De ambtenaar dient in elk kalenderjaar ten minste 108 uur vakantie op te nemen waarvan ten minste 72 uur over een
      aaneengesloten periode indien voor hem een volledige werktijd geldt en tot in evenredigheid lagere getallen indien
      voor hem een onvolledige werktijd geldt.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel23
  - number: '23.3'
    text: |-
      Het bevoegde gezag kan toestaan, dat een ambtenaar in enig kalenderjaar meer uren vakantie opneemt dan zijn
      aanspraak tot en met het lopende jaar bedraagt, met dien verstande, dat de opgenomen vakantie de aanspraak tot en
      met het lopende jaar nimmer met meer dan 57,6 uren mag overschrijden. Voor de ambtenaar met onvolledige werktijd
      wordt het in de vorige volzin bedoelde aantal uren van de maximaal toegestane overschrijding verminderd naar
      evenredigheid van de werktijd. De in een kalenderjaar teveel genoten vakantie wordt in mindering gebracht op de
      aanspraak op vakantie over het eerstvolgende jaar.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel23
  - number: '23.4'
    text: De ambtenaar meldt het voornemen vakantie op te nemen ruimschoots van tevoren.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel23
  - number: '23.5'
    text: |-
      Tenzij gewichtige redenen van dienstbelang zich hiertegen verzetten, is het de ambtenaar toegestaan op het
      voornemen vakantie op te nemen, terug te komen, dan wel het opnemen niet voort te zetten. De vorige volzin geldt in
      geval van ziekte of ongeval alleen indien de ambtenaar ten genoege van het bevoegd gezag die ziekte of dat ongeval
      aantoont.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel23
  - number: '23.6'
    text: |-
      Wanneer dringende redenen van dienstbelang dat noodzakelijk maken, kan het bevoegde gezag aan de ambtenaar
      verleende toestemming vakantie op te nemen intrekken, zowel vóór als tijdens de vakantie. Indien de ambtenaar ten
      gevolge van het intrekken van de toestemming vakantie op te nemen geldelijke schade lijdt, wordt deze hem vergoed.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel23
  - number: '23.7'
    text: |-
      Niet-opgenomen vakantie, waaronder eventuele van vorige jaren overgeboekte vakantie, wordt naar het volgende
      kalenderjaar overgeboekt tot een maximum van de aanspraak van de ambtenaar over een vol kalenderjaar berekend
      volgens artikel 22, verminderd met de in het tweede lid van dit artikel bedoelde vakantie.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel23
  - number: '23.8'
    text: |-
      Het bevoegd gezag kan toestaan dat in individuele gevallen in een bepaald jaar wordt afgeweken van de
      overeenkomstig het zevende lid maximaal naar een volgend kalenderjaar over te boeken vakantie-aanspraken.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel23
  - number: '24.1'
    text: |-
      Indien de ambtenaar op de datum van zijn ontslag nog aanspraak heeft op vakantie, wordt hem voor ieder uur vakantie
      dat hij niet heeft opgenomen een vergoeding toegekend ten bedrage van het salaris per uur dat de ambtenaar direct
      voorafgaand aan zijn ontslag genoot. De vergoeding wordt berekend over ten hoogste twee maal de aanspraak op
      vakantie over een vol kalenderjaar, uitgaande van het salaris en de werktijd zoals die direct voorafgaand aan het
      ontslag voor de ambtenaar golden en de leeftijd welke hij bereikt in het kalenderjaar waarin de dienstbetrekking
      wordt beëindigd.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel24
  - number: '24.2'
    text: |-
      Indien op de dag van zijn ontslag blijkt, dat de ambtenaar teveel vakantie heeft genoten, is hij voor ieder uur
      teveel genoten vakantie een bedrag verschuldigd ten bedrage van het salaris per uur.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel24
  - number: '24.3'
    text: |-
      In geval van overgang zonder onderbreking naar een andere functie binnen de rijksdienst in de loop van een
      kalenderjaar kan de ambtenaar er - in zoverre in afwijking van lid 1 - voor kiezen de vakantieaanspraken van het
      lopende kalenderjaar die niet genoten zijn, te behouden. Daarbij wordt vakantie die in het lopende kalenderjaar
      genoten is in mindering gebracht op de aanspraken in dat jaar.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel24
  - number: '25'
    text: |-
      Ingeval de ambtenaar in het genot is van een toelage als bedoeld in artikel 17 dan wel artikel 18*a* van het BBRA
      1984 is - met betrekking tot de vaststelling van dat bezoldigingsdeel tijdens vakantie - van artikel 17 lid 3,
      respectievelijk lid 4, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel25
  - number: '26'
    text: Onze Minister is bevoegd nadere en zonodig afwijkende regels vast te stellen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel26
  - number: '32'
    text: 'Onverminderd het bepaalde in de hoofdstukken III en VI, geniet verlof:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel32
  - number: 32.a
    text: |-
      de ambtenaar, die als militair dan wel op grond van een verbintenis als vrijwilliger in de zin van artikel 2,
      eerste lid, onder *a* of *b* van de Rechtstoestandregeling reservepolitie of van een overeenkomstige verbintenis,
      als bedoeld in de artikelen 53 en 54 van die regeling in werkelijke dienst is;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel32
  - number: 32.b
    text: de ambtenaar, die zich bevindt in een der omstandigheden, genoemd in artikel 20*b*;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel32
  - number: 32.c
    text: de ambtenaar, die uit hoofde van ziekte of ongeval verhinderd is dienst te verrichten.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel32
  - number: 32a.1
    text: |-
      Indien de Rijksdienst op een daartoe aangewezen kerkelijke of nationale, landelijk, regionaal of plaatselijk
      erkende feest- of gedenkdag is gesloten, geniet de desbetreffende ambtenaar verlof voor zoveel het dienstbelang
      niet anders vereist.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel32a
  - number: 32a.2
    text: |-
      Het vorige lid vindt geen toepassing, indien de sluiting van de Rijksdienst regionaal of plaatselijk plaats vindt
      en de ambtenaar elders werkzaam is.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel32a
  - number: 32b.1
    text: |-
      Onverminderd artikel 76 wordt aan de ambtenaar in de gevallen en onder de voorwaarden genoemd in de volgende
      artikelen van deze paragraaf buitengewoon verlof verleend.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel32b
  - number: 32b.2
    text: |-
      Onder zeer bijzondere persoonlijke omstandigheden als bedoeld in [artikel 4:1 van de Wet arbeid en zorg][ref1]
      worden in ieder geval begrepen de omstandigheden genoemd in de artikelen 33c, 33d en 33fa.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel4
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '4'
  - number: '33'
    text: |-
      Tenzij de belangen van de dienst zich daartegen verzetten, wordt buitengewoon verlof met behoud van volle
      bezoldiging verleend:
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33
  - number: 33.a
    text: voor de uitoefening van kiesrecht;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33
  - number: 33.b
    text: |-
      voor het voldoen aan een wettelijke verplichting, een en ander, voor zover dit niet in vrije tijd kan geschieden en
      omzetting van dienst niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33
  - number: 33a.1
    text: |-
      Indien de ambtenaar een vaste vergoeding ontvangt uit de functie waarvoor hem het in [artikel 125][ref1] bedoelde
      verlof wordt verleend, wordt op zijn bezoldiging een inhouding toegepast over de tijd dat hij het verlof geniet.
      Deze inhouding gaat hetgeen hij geacht kan worden te ontvangen als vaste vergoeding voor de met het verlof
      overeenkomende tijd in de bedoelde functie niet te boven.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125c
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: 125c
  - number: 33a.2
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan nadere regels ter uitvoering van het eerste lid
      vaststellen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33a
  - number: 33b.1
    text: |-
      Tenzij de belangen van de dienst zich daartegen verzetten wordt jaarlijks ten hoogste 120 uren buitengewoon
      verlof met behoud van volle bezoldiging verleend voor het bijwonen van vergaderingen van statutaire organen
      van verenigingen van ambtenaren, van centrale organisaties, waarbij deze verenigingen zijn aangesloten of van
      internationale ambtenarenorganisaties, mits de ambtenaar hieraan deelneemt:
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33b
  - number: 33b.1.a
    text: |-
      voor zover betreft vergaderingen van verenigingen van ambtenaren als bestuurslid van die vereniging dan wel als
      afgevaardigde of bestuurslid van een onderdeel daarvan;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33b
  - number: 33b.1.b
    text: |-
      voor zover betreft vergaderingen van centrale organisaties, waarbij verenigingen van ambtenaren zijn aangesloten,
      als bestuurslid van die centrale organisatie dan wel als afgevaardigde of bestuurslid van een bij die organisatie
      aangesloten vereniging van ambtenaren;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33b
  - number: 33b.1.c
    text: |-
      voor zover betreft vergaderingen van een internationale ambtenarenorganisatie als bestuurslid van deze organisatie
      dan wel als afgevaardigde of besuurslid van een bij die organisatie aangesloten vereniging van ambtenaren.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33b
  - number: 33b.2
    text: |-
      Tenzij de belangen van de dienst zich daartegen verzetten, wordt tot ten hoogste 208 uren per jaar buitengewoon
      verlof met behoud van volle bezoldiging verleend aan de ambtenaar, die door een centrale als bedoeld in artikel
      105 of door een daarbij aangesloten vereniging is aangewezen om bestuurlijke en/of vertegenwoordigende activiteiten
      te ontplooien binnen zijn centrale of een daarbij aangesloten vereniging c.q. binnen de organisatie van de
      werkgever, die er toe strekken de doelstellingen van zijn centrale van overheidspersoneel en de daarbij aangesloten
      verenigingen te ondersteunen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33b
  - number: 33b.3
    text: |-
      Tenzij de belangen van de dienst zich daartegen verzetten, wordt buitengewoon verlof met behoud van volle
      bezoldiging verleend aan de ambtenaar voor het - op uitnodiging van een organisatie van ambtenaren - als cursist
      deelnemen aan een cursus, met dien verstande dat dit verlof ten hoogste 48 uren per twee jaren bedraagt.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33b
  - number: 33b.4
    text: |-
      Het aantal uren dat op grond van het eerste, tweede en derde lid alsmede op grond van
      [artikel 18 van de Wet op de ondernemingsraden][ref1] aan een ambtenaar mag worden verleend, bedraagt te zamen ten
      hoogste 240 uren per jaar, met dien verstande dat ten hoogste 320 uren worden verleend


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel18
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33b
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '18'
  - number: 33b.4.a
    text: |-
      aan leden van de hoofdbesturen van de centrale organisaties, genoemd in artikel 105, tweede lid onder *a* en *b*,
      en van organisaties, die rechtstreeks bij die centrale organisaties zijn aangesloten;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33b
  - number: 33b.4.b
    text: |-
      aan leden van het hoofdbestuur van het Ambtenarencentrum en aan leden van het dagelijks bestuur van de bij die
      organisatie aangesloten centrales;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33b
  - number: 33b.4.c
    text: |-
      aan leden van het hoofdbestuur van de Centrale van Middelbare en Hogere Functionarissen bij Overheid, Onderwijs,
      Bedrijven en Instellingen, alsmede aan de bestuursleden van de sectoren en secties van die organisatie.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33b
  - number: 33b.5
    text: |-
      Het verlof bedoeld in de vorige leden, wordt slechts verleend aan ambtenaren, die lid zijn van verenigingen
      van ambtenaren, welke zijn aangesloten bij centrales van verenigingen van ambtenaren, die deel uitmaken van de
      Sectorcommissie overleg rijkspersoneel.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33b
  - number: 33b.6
    text: |-
      Tenzij andere belangen van de dienst zich daartegen verzetten, wordt buitengewoon verlof met behoud van volle
      bezoldiging verleend voor het bijwonen van vergaderingen van georganiseerd overleg, in ambtenarenzaken. Dit geldt
      eveneens voor één voorvergadering per in de vorige volzin bedoelde vergadering.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33b
  - number: 33c.1
    text: |-
      Tenzij de belangen van de dienst zich daartegen verzetten, wordt buitengewoon verlof met behoud van volle
      bezoldiging verleend:
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33c
  - number: 33c.1.a
    text: 'voor het zoeken van een woning in geval van overplaatsing: ten hoogste twee dagen;'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33c
  - number: 33c.1.b
    text: |-
      bij verhuizing ingeval van overplaatsing: aan hen, die een eigen huishouding hebben: twee dagen, zo nodig te
      verlengen tot drie en in zeer bijzondere gevallen tot vier dagen en aan hen, die niet een eigen huishouding hebben:
      ten hoogste twee dagen;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33c
  - number: 33c.1.c
    text: |-
      bij verhuizing anders dan in geval van overplaatsing: aan hen, die een eigen huishouding hebben, eenmaal in een
      kalenderjaar en ten hoogste twee dagen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33c
  - number: 33c.2
    text: Onze Minister kan regels stellen in aanvulling op of in afwijking van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33c
  - number: 33d.1
    text: |-
      Tenzij de belangen van de dienst zich daartegen verzetten, wordt aan de ambtenaar buitengewoon verlof met behoud
      van volle bezoldiging verleend:
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33d
  - number: 33d.1.a
    text: bij zijn ondertrouw; één dag;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33d
  - number: 33d.1.b
    text: 'bij zijn huwelijk: vier dagen;'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33d
  - number: 33d.1.c
    text: |-
      tot het bijwonen van een huwelijk van bloed- of aanverwanten in de eerste en de tweede graad: één dag indien dit
      huwelijk wordt gesloten in zijn woon- of standplaats en ten hoogste twee dagen, indien dit huwelijk wordt gesloten
      buiten zijn woon- of standplaats;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33d
  - number: 33d.1.d
    text: 'bij overlijden van:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33d
  - number: 33d.1.d.1°
    text: 'in artikel 33i, tweede lid, genoemde personen: vier dagen;'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33d
  - number: 33d.1.d.2°
    text: 'bloed- of aanverwanten in de tweede graad: twee dagen;'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33d
  - number: 33d.1.d.3°
    text: 'bloed- of aanverwanten in de derde of vierde graad: ten hoogste één dag;'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33d
  - number: 33d.1.e
    text: 'bij bevalling van zijn echtgenote: ten hoogste twee dagen;'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33d
  - number: 33d.1.f
    text: |-
      bij zijn 25-, 40-, en 50-jarig ambts- of huwelijksjubileum en bij 25-, 40-, 50- en 60-jarig huwelijksjubileum van
      ouders, stiefouders, pleegouders, schoonouders of grootouders: één dag.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33d
  - number: 33d.2
    text: |-
      Voor de toepassing van dit artikel wordt onder huwelijk mede begrepen het sluiten van een samenlevingscontract als
      bedoeld in artikel 4, vierde lid, of het aangaan van een geregistreerd partnerschap.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33d
  - number: 33d.3
    text: |-
      Buitengewoon verlof dat aan de ambtenaar op grond van het eerste lid wordt verleend in verband met aanverwantschap
      die door zijn huwelijk is ontstaan met bloedverwanten van zijn echtgenote wordt op gelijke wijze verleend aan de
      ambtenaar die ongehuwd samenwoont als bedoeld in artikel 4, vierde lid, of aan de ambtenaar die een geregistreerd
      partnerschap is aangegaan, met betrekking tot dezelfde bloedverwanten van zijn levenspartner of van zijn
      geregistreerde partner.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33d
  - number: 33d.4
    text: Onze Minister kan regels stellen in aanvulling op of in afwijking van de vorige leden.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33d
  - number: 33e.1
    text: |-
      Buitengewoon verlof van korte duur, al dan niet met behoud van volle bezoldiging, kan bovendien worden verleend
      in de gevallen, waarin hij, die tot verlenen van dat verlof bevoegd is verklaard, oordeelt, dat daartoe aanleiding
      bestaat.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33e
  - number: 33e.2
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties is bevoegd ter uitvoering van het eerste lid zo nodig
      nadere regels vast te stellen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33e
  - number: 33f.1
    text: |-
      Behoudens in dringende gevallen moet buitengewoon verlof van korte duur tenminste 24 uren tevoren schriftelijk of
      mondeling worden aangevraagd.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33f
  - number: 33f.2
    text: |-
      Indien de ambtenaar, die niet vooraf een aanvraag voor buitengewoon verlof van korte duur heeft ingediend, ten
      genoegen van de in het eerste lid bedoelde autoriteit aantoont, dat hij daartoe geen gelegenheid heeft gehad,
      terwijl er voor zijn afwezigheid gegronde redenen bestonden, wordt deze afwezigheid beschouwd als buitengewoon
      verlof met behoud van volle bezoldiging.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33f
  - number: 33f.3
    text: 'Een gegronde reden als bedoeld in het tweede lid is slechts aanwezig:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33f
  - number: 33f.3.a
    text: |-
      indien een der in de voorgaande artikelen genoemde omstandigheden aanwezig is geweest, op grond waarvan aan de
      ambtenaar op zijn aanvraag buitengewoon verlof wordt verleend, zulks met inachtneming van de daarbij vermelde
      voorwaarden en termijnen;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33f
  - number: 33f.3.b
    text: |-
      in alle andere gevallen, indien de ambtenaar, alle omstandigheden in aanmerking genomen, redelijkerwijze de dienst
      mocht verzuimen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33f
  - number: 33fa.1
    text: |-
      De ambtenaar die zorg draagt voor een of meer personen als bedoeld in het vierde lid heeft aanspraak op zorgverlof
      bij calamiteiten onder behoud van zijn volle bezoldiging.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33fa
  - number: 33fa.2
    text: |-
      Onder calamiteit wordt verstaan ziekte of een andere onverwachte gebeurtenis waardoor een noodsituatie ontstaat in
      de verzorging van een of meer van de in het vierde lid bedoelde personen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33fa
  - number: 33fa.3
    text: |-
      Het verlof is bedoeld als eerste opvang en voor het treffen van verdere voorzieningen en bedraagt maximaal 1 dag
      per calamiteit.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33fa
  - number: 33fa.4
    text: |-
      De personen voor wier verzorging het verlof kan worden verleend zijn: de echtgenote, ouders, stiefouders,
      pleegouders, schoonouders, kinderen, stiefkinderen, pleegkinderen of aangehuwdkinderen van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33fa
  - number: 33fa.5
    text: De ambtenaar informeert het bevoegd gezag vooraf over het opnemen van het verlof onder vermelding van de reden.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33fa
  - number: 33fa.6
    text: |-
      Het bevoegd gezag kan eisen dat de ambtenaar achteraf aannemelijk maakt dat daadwerkelijk sprake was van een
      noodsituatie. Indien de ambtenaar daar naar het oordeel van het bevoegd gezag niet in slaagt kunnen de opgenomen
      uren in mindering worden gebracht op het vakantieverlof.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33fa
  - number: 33fa.7
    text: Voor de toepassing van dit artikel is het derde lid van artikel 33*d* van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33fa
  - number: 33fb.1
    text: De vrouwelijke ambtenaar heeft in verband met haar bevalling aanspraak op zwangerschaps- en bevallingsverlof.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33fb
  - number: 33fb.2
    text: Gedurende het zwangerschaps- en bevallingsverlof behoudt de vrouwelijke ambtenaar haar aanspraak op bezoldiging.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33fb
  - number: 33fb.3
    text: |-
      De vrouwelijke ambtenaar heeft recht op een zwangerschapsverlof vanaf de dag waarop de bevalling blijkens een
      verklaring van een arts of van een verloskundige aangevende de vermoedelijke datum van de bevalling, binnen zes
      weken is te verwachten. Het verlof vangt uiterlijk aan vier weken voorafgaand aan de vermoedelijke datum van de
      bevalling.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33fb
  - number: 33fb.4
    text: |-
      De vrouwelijke ambtenaar heeft recht op een bevallingsverlof van tien weken vanaf de dag volgend op die van de
      bevalling. Dit verlof wordt verlengd tot ten hoogste zestien weken, voor zover het zwangerschapsverlof voorafgaand
      aan de vermoedelijke datum van bevalling, om andere redenen dan wegens ziekte minder dan zes weken heeft bedragen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33fb
  - number: 33fb.5
    text: |-
      Indien de vrouwelijke ambtenaar aan wie verlof is verleend gedurende dat verlof of gedurende een bepaalde periode
      van dat verlof tevens recht heeft op een financiële tegemoetkoming op basis van de [Wet arbeid en zorg][ref1],
      wordt gedurende de periode waarin sprake is van samenloop een inhouding op de doorbetaling van bezoldiging als
      bedoeld in het tweede lid toegepast welke overeenkomt met het bedrag van bedoelde financiële tegemoetkoming.


      [ref1]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33fb
    references:
      - id: ref1
        bwb_id: BWBR0013008
  - number: 33fb.6
    text: |-
      Indien aan de gestelde voorwaarden voor het toekennen van een financiële tegemoetkoming als bedoeld in het vijfde
      lid is voldaan maar geen financiële tegemoetkoming is toegekend omdat de vrouwelijke ambtenaar geen aanvraag heeft
      ingediend, past het bevoegd gezag het vijfde lid op overeenkomstige wijze toe. In dat geval wordt rekening gehouden
      met de financiële tegemoetkoming die aan de vrouwelijke ambtenaar zou zijn toegekend indien zij wel een aanvraag
      zou hebben ingediend.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33fb
  - number: 33fc.1
    text: |-
      De gewezen vrouwelijke ambtenaar, wier tijdstip van ingang van haar ontslag is gelegen in de periode, bedoeld in
      [artikel 33fb, eerste lid][ref1], behoudt haar aanspraak op bezoldiging vermeerderd met haar vakantie-uitkering.
      De aanspraak eindigt na 16 weken, te rekenen vanaf de eerste dag waarop haar zwangerschapsverlof als bedoeld in
      [artikel 33fb, derde lid][ref2], een aanvang heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel33fb
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel33fb
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33fc
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 33fb
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 33fb
        hoofdstuk: V
        paragraaf: '2'
  - number: 33fc.2
    text: |-
      De gewezen ambtenaar, wier bevalling waarschijnlijk is binnen vier maanden na het tijdstip van ingang van haar
      ontslag, ontvangt haar laatstelijk genoten bezoldiging vermeerderd met haar vakantie-uitkering gedurende de periode
      die:
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33fc
  - number: 33fc.2.a
    text: aanvangt op de 41e dag voorafgaande aan de vermoedelijke datum van bevalling; en
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33fc
  - number: 33fc.2.b
    text: eindigt op de 70e dag na de datum waarop de bevalling heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33fc
  - number: 33fc.3
    text: |-
      De periode, bedoeld in het tweede lid, wordt verlengd tot 16 weken, indien die periode door een voortijdige
      bevalling minder dan 16 weken heeft bedragen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33fc
  - number: 33fc.4
    text: |-
      De gewezen ambtenaar wier bevalling niet wordt verwacht binnen vier maanden na het tijdstip van ingang van haar
      ontslag, maar die niettemin binnen die termijn bevalt, ontvangt haar laatstelijk genoten bezoldiging vermeerderd
      met haar vakantie-uitkering gedurende de periode die:
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33fc
  - number: 33fc.4.a
    text: aanvangt op de datum van bevalling; en
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33fc
  - number: 33fc.4.b
    text: eindigt op de 70e dag na de datum waarop de bevalling heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33fc
  - number: 33fc.5
    text: |-
      De [artikelen 33fb, vijfde en zesde lid][ref1], [40, tweede lid][ref2], en [48a][ref3], zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel33fb
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0001950#Artikel48a
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33fc
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 33fb
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '40'
        hoofdstuk: VI
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0001950
        artikel: 48a
        hoofdstuk: VI
        paragraaf: '6'
  - number: 33g.1
    text: |-
      De ambtenaar die als ouder in familierechtelijke betrekking staat tot een kind, heeft aanspraak op verlof. Indien
      de ambtenaar met ingang van hetzelfde tijdstip tot meer dan één kind in familierechtelijke betrekking komt te
      staan, bestaat er ten aanzien van ieder van die kinderen aanspraak op verlof.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33g
  - number: 33g.2
    text: |-
      De ambtenaar die blijkens verklaringen uit de gemeentelijke basisadministratie op hetzelfde adres woont als een
      kind en duurzaam de verzorging en de opvoeding van dat kind als eigen kind op zich heeft genomen, heeft aanspraak
      op verlof. Indien de ambtenaar met ingang van hetzelfde tijdstip de verzorging en opvoeding van meer dan één kind
      op zich heeft genomen, bestaat er ten aanzien van ieder van die kinderen aanspraak op verlof.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33g
  - number: 33g.3
    text: Geen aanspraak op verlof bestaat na de datum waarop het kind de leeftijd van acht jaren heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33g
  - number: 33g.4
    text: |-
      Het verlof wordt uitsluitend verleend aan de ambtenaar wiens dienstbetrekking ten minste een jaar heeft geduurd.
      Indien de dienstbetrekking buiten Nederland wordt vervuld bestaat aanspraak op verlof tenzij gewichtige redenen van
      dienstbelang zich hiertegen verzetten.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33g
  - number: 33g.5
    text: |-
      Het aantal uren verlof waarop de ambtenaar per keer ten hoogste aanspraak heeft, bedraagt een kwart van het aantal
      door de ambtenaar te werken uren in het kalenderjaar waarin het verlof aanvangt uitgaande van zijn arbeidsduur op
      het tijdstip waarop het verlof aanvangt. Indien de arbeidsduur van de ambtenaar gedurende het verlof wijzigt, wordt
      de aanspraak op het verlof opnieuw vastgesteld, rekening houdend met de mate waarin de arbeidsduur is gewijzigd en
      de mate waarin de periode gedurende welke het verlof wordt genoten is verstreken.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33g
  - number: 33g.6
    text: |-
      Het verlof wordt opgenomen gedurende een aaneengesloten periode van ten hoogste zes maanden en gelijkmatig over
      deze periode verdeeld. In afwijking van de eerste volzin kan de ambtenaar het bevoegd gezag verzoeken om het verlof
      op een andere wijze aaneengesloten te genieten of het verlof op te delen in ten hoogste drie perioden, waarbij
      iedere periode ten minste een maand bedraagt. Het bevoegd gezag stemt in met het verzoek tenzij een zwaarwegend
      dienstbelang zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33g
  - number: 33g.7
    text: Over de uren waarop de ambtenaar verlof is verleend, behoudt hij 75% van zijn bezoldiging.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33g
  - number: 33g.8
    text: |-
      Indien de ambtenaar aan wie verlof is verleend gedurende dat verlof of gedurende een bepaalde
      periode van dat verlof tevens recht heeft op een financiële tegemoetkoming op basis van
      [hoofdstuk 7 van de Wet arbeid en zorg][ref1], wordt gedurende de periode waarin sprake is van samenloop een
      inhouding op de doorbetaling van bezoldiging als bedoeld in het vijfde lid toegepast welke overeenkomt met het
      bedrag van bedoelde financiële tegemoetkoming.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33g
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '7'
  - number: 33g.9
    text: |-
      Indien aan de in [hoofdstuk 7 van de Wet arbeid en zorg][ref1] gestelde voorwaarden voor het toekennen van een
      financiële tegemoetkoming is voldaan maar geen financiële tegemoetkoming is toegekend omdat de ambtenaar geen
      aanvraag heeft ingediend, past het bevoegd gezag het zesde lid op overeenkomstige wijze toe. In dat geval wordt
      rekening gehouden met de financiële tegemoetkoming die aan de ambtenaar zou zijn toegekend indien hij wel een
      aanvraag zou hebben ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33g
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '7'
  - number: 33g.10
    text: |-
      De ambtenaar is verplicht tot terugbetaling van de bezoldiging over de genoten verlofuren wanneer hem tijdens
      de verlofperiode of binnen een jaar na afloop van het verlof ontslag wordt verleend op aanvraag dan wel niet op
      aanvraag op grond van aan de ambtenaar te wijten feiten of omstandigheden. Ontslag op aanvraag gevolgd door een
      overgang binnen een maand naar een andere functie binnen de rijksdienst wordt niet als ontslag beschouwd. Het
      bevoegd gezag kan de ambtenaar ontheffen van de in de eerste volzin bedoelde verplichting indien er bijzondere
      omstandigheden zijn die dat naar het oordeel van het bevoegd gezag rechtvaardigen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33g
  - number: 33g.11
    text: |-
      De ambtenaar meldt het voornemen verlof te nemen ten minste twee maanden voor het door hem gewenste tijdstip van
      ingang van het verlof schriftelijk aan het tot verlening van het verlof bevoegde gezag onder opgave van:
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33g
  - number: 33g.11.a
    text: de aaneengesloten periode van het verlof;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33g
  - number: 33g.11.b
    text: het aantal uren verlof per week;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33g
  - number: 33g.11.c
    text: de spreiding van de verlofuren over de week.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33g
  - number: 33g.12
    text: |-
      Het bevoegd gezag is verplicht in te stemmen met een aanvraag van de ambtenaar het verlof niet op te nemen of niet
      voort te zetten op grond van onvoorziene omstandigheden, tenzij gewichtige redenen van dienstbelang zich hiertegen
      verzetten. Het bevoegd gezag behoeft aan de aanvraag niet met ingang van een vroeger tijdstip gevolg te geven dan
      vier weken na de aanvraag. In het geval het verlof met toepassing van de eerste volzin, na het tijdstip van ingang
      daarvan niet wordt voortgezet, vervalt de aanspraak op het overige deel van dat verlof.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33g
  - number: 33g.13
    text: |-
      Het bevoegd gezag kan, na overleg met de ambtenaar, de spreiding van de uren over de week op grond van gewichtige
      redenen van dienstbelang wijzigen tot vier weken voor het tijdstip van ingang van het verlof.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33g
  - number: 33h.1
    text: De ambtenaar heeft in verband met de adoptie van een kind aanspraak op verlof met behoud van bezoldiging.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33h
  - number: 33h.2
    text: |-
      De aanspraak op verlof in verband met adoptie van een kind bedraagt ten hoogste vier aaneengesloten weken. De
      aanspraak bestaat gedurende een tijdvak van achttien weken te rekenen vanaf twee weken vóór de eerste dag dat
      de feitelijke opneming ter adoptie een aanvang heeft genomen of zal nemen zoals die dag is aangeduid in een door
      de ambtenaar aan het bevoegd gezag overgelegd document waaruit blijkt dat een kind ter adoptie is of zal worden
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33h
  - number: 33h.3
    text: |-
      Indien als gevolg van een adoptieverzoek tegelijkertijd twee of meer kinderen feitelijk ter adoptie worden
      opgenomen, bestaat de aanspraak op verlof slechts ten aanzien van één van die kinderen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33h
  - number: 33h.4
    text: |-
      De ambtenaar meldt aan het bevoegd gezag het verlof in verband met adoptie uiterlijk drie weken voor de dag van
      ingang van het verlof onder opgave van de omvang van het verlof. Bij de melding worden documenten gevoegd waaruit
      blijkt dat een kind ter adoptie is of zal worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33h
  - number: 33h.5
    text: |-
      Indien de ambtenaar aan wie verlof is verleend gedurende dat verlof of gedurende een bepaalde periode van dat
      verlof tevens recht heeft op een financiële tegemoetkoming op basis van de Wet arbeid en zorg, wordt gedurende de
      periode waarin sprake is van samenloop een inhouding op de doorbetaling van bezoldiging als bedoeld in het eerste
      lid toegepast welke overeenkomt met het bedrag van bedoelde financiële tegemoetkoming.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33h
  - number: 33h.6
    text: |-
      Indien aan gestelde voorwaarden voor het toekennen van een financiële tegemoetkoming als bedoeld in het vijfde
      lid is voldaan maar geen financiële tegemoetkoming is toegekend omdat de ambtenaar geen aanvraag heeft ingediend,
      past het bevoegd gezag het vijfde lid op overeenkomstige wijze toe. In dat geval wordt rekening gehouden met de
      financiële tegemoetkoming die aan de ambtenaar zou zijn toegekend indien hij wel een aanvraag zou hebben ingediend.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33h
  - number: 33h.7
    text: |-
      De bepalingen in dit artikel zijn van overeenkomstige toepassing op de ambtenaar die een pleegkind opneemt als
      bedoeld in [artikel 5:1, tweede lid, onderdeel d, van de Wet arbeid en zorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel5
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33h
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '5'
  - number: 33i.1
    text: |-
      Tenzij een zwaarwegend dienstbelang zich daartegen verzet wordt aan de ambtenaar verlof met behoud van bezoldiging
      verleend voor de noodzakelijke verzorging in verband met ziekte van:
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33i
  - number: 33i.1.a
    text: zijn echtgenote of echtgenoot;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33i
  - number: 33i.1.b
    text: een inwonend kind tot wie de ambtenaar als ouder in een familierechtelijke betrekking staat;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33i
  - number: 33i.1.c
    text: een inwonend kind van zijn echtgenote of echtgenoot;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33i
  - number: 33i.1.d
    text: |-
      een pleegkind dat blijkens verklaringen uit de gemeentelijke basisadministratie op hetzelfde adres woont als
      de ambtenaar en door hem duurzaam wordt verzorgd en opgevoed op basis van een pleegcontract als bedoeld in
      [artikel 22, eerste lid, van de Wet op de jeugdzorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel22
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33i
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '22'
  - number: 33i.2
    text: |-
      Tenzij een zwaarwegend dienstbelang zich daartegen verzet wordt aan de ambtenaar verlof met behoud van bezoldiging
      verleend voor de noodzakelijke verzorging in verband met ernstige ziekte van: echtgenote, echtgenoot, ouders,
      stiefouders, pleegouders, schoonouders, kinderen, stiefkinderen, pleegkinderen of aangehuwde kinderen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33i
  - number: 33i.3
    text: |-
      Het verlof, bedoeld in het eerste en tweede lid, bedraagt in elk kalenderjaar ten hoogste tweemaal de arbeidsduur
      per week.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33i
  - number: 33i.4
    text: |-
      De ambtenaar meldt vooraf aan het bevoegd gezag dat hij het verlof, bedoeld in het eerste en tweede lid, opneemt
      onder opgave van de reden. Indien dit niet mogelijk is, meldt de ambtenaar het opnemen van het verlof zo spoedig
      mogelijk aan het bevoegd gezag onder opgave van de reden. Bij die melding geeft de ambtenaar ook de omvang, de
      wijze van opneming en de vermoedelijke duur van het verlof aan.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33i
  - number: 33i.5
    text: |-
      Het bevoegd gezag kan achteraf van de ambtenaar verlangen dat hij aannemelijk maakt dat hij zijn arbeid niet heeft
      verricht in verband met de noodzakelijke verzorging als bedoeld in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33i
  - number: 33i.6
    text: |-
      Indien de ambtenaar aan wie verlof is verleend gedurende dat verlof of gedurende een bepaalde periode van dat
      verlof tevens recht heeft op een financiële tegemoetkoming op basis van de Wet arbeid en zorg, wordt gedurende de
      periode waarin sprake is van samenloop een inhouding op de doorbetaling van bezoldiging als bedoeld in het eerste
      en tweede lid toegepast welke overeenkomt met het bedrag van bedoelde financiële tegemoetkoming.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33i
  - number: 33i.7
    text: |-
      Indien aan gestelde voorwaarden voor het toekennen van een financiële tegemoetkoming als bedoeld in het zesde
      lid is voldaan maar geen financiële tegemoetkoming is toegekend omdat de ambtenaar geen aanvraag heeft ingediend,
      past het bevoegd gezag het zesde lid op overeenkomstige wijze toe. In dat geval wordt rekening gehouden met de
      financiële tegemoetkoming die aan de ambtenaar zou zijn toegekend indien hij wel een aanvraag zou hebben ingediend.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel33i
  - number: '34.1'
    text: |-
      Buitengewoon verlof van lange duur kan aan de ambtenaar op zijn aanvraag worden verleend, al dan niet met behoud
      van bezoldiging en al dan niet onder bepaalde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel34
  - number: '34.2'
    text: |-
      Het verlof, bedoeld in het eerste lid, gaat niet in dan nadat de ambtenaar schriftelijk heeft verklaard dat hij de
      daaraan verbonden voorwaarden aanvaardt.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel34
  - number: '34.3'
    text: |-
      Indien het verlof, bedoeld in het eerste lid, naar het oordeel van het bevoegd gezag uitsluitend strekt in het
      persoonlijk belang van de ambtenaar, wordt hem dit niet verleend dan zonder behoud van bezoldiging en voor ten
      hoogste een jaar.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel34
  - number: '34.4'
    text: |-
      Aan de ambtenaar die wordt uitgezonden om in de burgerlijke landsdienst van de Nederlandse Antillen of Aruba
      tijdelijk een betrekking te vervullen, wordt het verlof, bedoeld in het eerste lid, verleend op de voet van de
      bepalingen van het [West-Indisch Detacheeringsbesluit 1930][ref1], met dien verstande dat dit verlof in afwijking
      van genoemd besluit ook kan worden verleend met behoud van bezoldiging.


      [ref1]: https://wetten.overheid.nl/BWBR0001949
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0001949
  - number: '34.5'
    text: |-
      Indien het verlof, bedoeld in het eerste lid, verband houdt met een benoeming van de ambtenaar tot bezoldigd
      bestuurder van een vereniging van ambtenaren, van een centrale of van een internationale organisatie van zodanige
      verenigingen, wordt hem dit niet verleend dan zonder behoud van bezoldiging en voor ten hoogste twee jaren. Artikel
      33*b*, vijfde lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel34
  - number: '34.6'
    text: |-
      Indien de ambtenaar aan wie verlof is verleend als bedoeld in het eerste lid, met geheel of gedeeltelijk behoud
      van bezoldiging, gedurende dat verlof of gedurende een bepaalde periode van dat verlof tevens recht heeft op een
      financiële tegemoetkoming op basis van [hoofdstuk 7 van de Wet arbeid en zorg][ref1], wordt gedurende de periode
      waarin sprake is van samenloop een inhouding op de bezoldiging toegepast welke overeenkomt met het bedrag van
      bedoelde financiële tegemoetkoming. Indien de financiële tegemoetkoming hoger is dan hetgeen over de verlofuren
      wordt doorbetaald aan bezoldiging wordt de inhouding vastgesteld op het laatstbedoelde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '7'
  - number: '34.7'
    text: |-
      Indien aan de in [hoofdstuk 7 van de Wet arbeid en zorg][ref1] gestelde voorwaarden voor het toekennen van een
      financiële tegemoetkoming is voldaan maar geen financiële tegemoetkoming is toegekend omdat de ambtenaar geen
      aanvraag heeft ingediend, past het bevoegd gezag het zesde lid op overeenkomstige wijze toe. In dat geval wordt
      rekening gehouden met de financiële tegemoetkoming die aan de ambtenaar zou zijn toegekend indien hij wel een
      aanvraag zou hebben ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '7'
  - number: 34e.1
    text: |-
      De ambtenaar, die na afloop van hem verleend buitengewoon verlof van lange duur en zonder dat dit is verlengd, zijn
      dienst niet tijdig hervat, wordt voor de toepassing van dit reglement geacht een aanvraag tot ontslag te hebben
      ingediend.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel34e
  - number: 34e.2
    text: |-
      Het eerste lid is niet van toepassing, indien de ambtenaar binnen een redelijke termijn ten genoegen van Onze
      Minister aannemelijk maakt, dat hij geldige redenen had zijn dienst niet te hervatten, in welk geval het verlof
      geacht wordt te zijn verlengd tot het tijdstip, waarop bedoelde geldige redenen hebben opgehouden te bestaan.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel34e
  - number: 34f
    text: |-
      Voor de toepassing van deze paragraaf is - ingeval de ambtenaar in het genot is van een toelage als bedoeld in
      [artikel 17][ref1], dan wel [artikel 18][ref2] - met betrekking tot de vaststelling van dit bezoldigingsdeel, het
      derde, respectievelijk vierde lid van artikel 17 van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel18a
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel34f
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0003630
        artikel: 18a
  - number: 34g
    text: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt regels ten aanzien van levensloopverlof.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel34g
  - number: '35'
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel35
  - number: 35.a)
    text: |-
      arbeidsongeschiktheid: arbeidsongeschiktheid als bedoeld in [artikel 18, eerste lid, van de WAO][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel18
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '18'
  - number: 35.b)
    text: |-
      arbodienst: een arbodienst als bedoeld in de [Arbeidsomstandighedenwet 1998][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010346
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0010346
  - number: 35.c)
    text: |-
      deskundige persoon: een deskundige persoon als bedoeld in
      [artikel 14, eerste lid, van de Arbeidsomstandighedenwet 1998][ref1] die belast is met de taken, bedoeld in
      [artikel 14, eerste lid, onderdelen b of c, van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '14'
  - number: 35.d)
    text: |-
      beroepsziekte: een ziekte, welke in overwegende mate haar oorzaak vindt in de aard van de aan de ambtenaar
      opgedragen werkzaamheden of in de bijzondere omstandigheden, waaronder deze moesten worden verricht, en niet aan
      zijn schuld of onvoorzichtigheid is te wijten;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel35
  - number: 35.e)
    text: |-
      dienstongeval: een ongeval, welke in overwegende mate zijn oorzaak vindt in de aard van de aan de ambtenaar
      opgedragen werkzaamheden of in de bijzondere omstandigheden, waaronder deze moesten worden verricht, en niet aan
      zijn schuld of onvoorzichtigheid is te wijten;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel35
  - number: 35.f)
    text: |-
      beroepsincident: een dienstongeval of een beroepsziekte voortvloeiend uit een gevaarzettende situatie die
      rechtstreeks verband houdt met de uitvoering van zijn taak waaraan de ambtenaar zich vanwege zijn specifieke
      functie niet kan onttrekken;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel35
  - number: 35.g)
    text: |-
      herplaatsingstoelage: een herplaatsingstoelage als bedoeld in hoofdstuk 9 van het Pensioenreglement van de
      Stichting Pensioenfonds ABP;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel35
  - number: 35.h)
    text: |-
      invaliditeitspensioen: een invaliditeitspensioen als bedoeld in hoofdstuk 8 van het Pensioenreglement van de
      Stichting Pensioenfonds ABP;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel35
  - number: 35.i)
    text: |-
      medisch advies: een advies van de deskundige persoon of de arbodienst dat ten aanzien
      van de ambtenaar is uitgebracht na een arbeidsgezondheidskundig onderzoek als bedoeld in
      [artikel 18 van de Arbeidsomstandighedenwet 1998][ref1] en [artikel 36a][ref2] van dit reglement;


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel36a
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 36a
        hoofdstuk: VI
        paragraaf: '2'
  - number: 35.j)
    text: |-
      gewezen ambtenaar: een ambtenaar aan wie ontslag is verleend, met ingang van de dag waarop het ontslag is
      ingetreden;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel35
  - number: 35.k)
    text: |-
      UWV: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in [hoofdstuk 5 van de Wet SUWI][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: 35.l)
    text: |-
      passende arbeid: alle arbeid die voor de krachten en bekwaamheden van de ambtenaar is berekend, tenzij aanvaarding
      om redenen van lichamelijke, geestelijke of sociale aard niet van hem kan worden gevergd;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel35
  - number: 35.m)
    text: 'Pensioenreglement: het Pensioenreglement van de Stichting Pensioenfonds ABP;'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel35
  - number: 35.n)
    text: |-
      Stichting Pensioenfonds ABP: de Stichting Pensioenfonds ABP, bedoeld in
      [artikel 6 van de Wet privatisering ABP][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel6
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '6'
  - number: 35.o)
    text: |-
      Wet SUWI: de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0013060
  - number: 35.p)
    text: |-
      WW-uitkering: een uitkering op grond van de [Werkloosheidswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 35.q)
    text: |-
      bovenwettelijke WW-uitkering: de uitkering bedoeld in
      __REF000___________________________________________________________________________________________________________
      _____;


      [ref1]: https://wetten.overheid.nl/BWBR0008114#Artikel1
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0008114
        artikel: '1'
  - number: 35.r)
    text: |-
      WAO: de [Wet op de arbeidsongeschiktheidsverzekering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 35.s)
    text: |-
      WAO-uitkering: een uitkering op grond van de [WAO][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 35.t)
    text: |-
      ZW: de [Ziektewet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 35.u)
    text: |-
      ZW-uitkering: ziekengeld als bedoeld in [artikel 19 van de ZW][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel19
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '19'
  - number: 35.v)
    text: |-
      zijn arbeid: hetgeen daaronder wordt verstaan ingevolge [artikel 19 van de ZW][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel19
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '19'
  - number: 35a
    text: |-
      Indien de bepalingen in dit hoofdstuk worden toegepast op de Algemene Rekenkamer, de Hoge Raad van Adel, het
      Kabinet der Koningin, de Kanselarij der Nederlandse Orden, de Nationale ombudsman en de Raad van State, dient voor
      Onze Minister telkens respectievelijk te worden gelezen het College van de Algemene Rekenkamer, de voorzitter van
      de Hoge Raad van Adel, de directeur van het Kabinet der Koningin, de kanselier der Nederlandse Orden, de Nationale
      ombudsman of de vice-president van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel35a
  - number: '36.1'
    text: |-
      Onze Minister verricht zijn taak met betrekking tot begeleiding van verzuim en de arbeidsgezondheidskundige
      begeleiding op grond van de [Arbeidsomstandighedenwet 1998][ref1] en de bepalingen in dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0010346
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0010346
  - number: '36.2'
    text: |-
      Onze Minister kan regels vaststellen met betrekking tot de wijze waarop invulling wordt gegeven aan de begeleiding
      van verzuim, de arbeidsgezondheidskundige begeleiding en de daarbij in acht te nemen procedures.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel36
  - number: '36.3'
    text: |-
      De ambtenaar is in geval van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte verplicht dit zo
      spoedig mogelijk, doch in elk geval niet later dan op de tweede dag van die ongeschiktheid, te melden.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel36
  - number: '36.4'
    text: |-
      Onze Minister kan ten aanzien van de ambtenaar die korter dan een jaar volledig ongeschikt is geweest zijn arbeid
      te verrichten bepalen dat hij zijn arbeid slechts mag hervatten, nadat Onze Minister hiervoor toestemming heeft
      verleend;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel36
  - number: '36.5'
    text: |-
      De ambtenaar die wegens ziekte gedurende een jaar of langer volledig ongeschikt is geweest zijn arbeid te
      verrichten mag zijn arbeid slechts hervatten, nadat Onze Minister hiervoor toestemming heeft verleend.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel36
  - number: '36.6'
    text: |-
      Onze Minister verleent de toestemming, bedoeld in het vierde en vijfde lid, eerst nadat er een medisch advies is
      van de deskundige persoon of de arbodienst.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel36
  - number: 36a.1
    text: 'De ambtenaar kan worden verplicht om een arbeidsgezondheidskundig onderzoek te ondergaan:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel36a
  - number: 36a.1.a)
    text: |-
      voor zover dit noodzakelijk is om te beoordelen of de ambtenaar van 55 jaar en ouder in staat is nachtarbeid te
      verrichten;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel36a
  - number: 36a.1.b)
    text: indien Onze Minister gegronde redenen heeft om te twijfelen aan de goede gezondheidstoestand van de ambtenaar;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel36a
  - number: 36a.1.c)
    text: indien de ambtenaar niet meer volledig geschikt is gebleken voor het verrichten van zijn arbeid;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel36a
  - number: 36a.1.d)
    text: |-
      ter beantwoording van de vraag of de ambtenaar tijdens het tijdvak waarin hij wegens ziekte ongeschikt is om zijn
      arbeid te verrichten, in het belang van zijn genezing arbeid mag verrichten en om vast te stellen welke arbeid
      wenselijk wordt geacht;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel36a
  - number: 36a.1.e)
    text: |-
      indien de ambtenaar in contact staat of kort geleden heeft gestaan met een persoon die een ziekte heeft waarvoor
      ingevolge de [Infectieziektenwet][ref1], een nominatieve aangifteplicht geldt;


      [ref1]: https://wetten.overheid.nl/BWBR0009684
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0009684
  - number: 36a.1.f)
    text: |-
      om te beoordelen of de ambtenaar, die een functie vervult als bedoeld in artikel 97, eerste lid, lichamelijk en
      psychisch in staat kan worden geacht zijn functie te blijven waarnemen, nadat hij de voor zijn functie vastgestelde
      leeftijdsgrens heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel36a
  - number: 36a.1.g)
    text: |-
      om te beoordelen of er sprake is van een situatie als bedoeld in artikel 98, derde lid, aanhef en onderdelen a
      en b;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel36a
  - number: 36a.1.h)
    text: |-
      om te beoordelen of de ambtenaar die wegens ziekte volledig ongeschikt is geweest zijn arbeid te verrichten zijn
      arbeid mag hervatten;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel36a
  - number: 36a.1.i)
    text: voorzover dit voortvloeit uit enige wettelijke verplichting;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel36a
  - number: 36a.1.j)
    text: |-
      indien hij in verband met de uitoefening van zijn werkzaamheden aan bijzonder gevaar voor zijn gezondheid
      blootstaat of hij is benoemd in een functie waarvoor bij aanstelling een geneeskundig onderzoek is vereist als
      bedoeld in artikel 9, vierde lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel36a
  - number: 36a.2
    text: |-
      Onze Minister stelt de ambtenaar buiten dienst indien na een arbeidsgezondheidskundig onderzoek als bedoeld in
      het eerste lid, blijkt dat sprake is van een zodanige lichamelijke of geestelijke toestand dat de belangen van de
      ambtenaar, van de dienst of van bij het verrichten van de arbeid betrokken derden zich er tegen verzetten dat de
      ambtenaar zijn arbeid blijft verrichten. De ambtenaar wordt niet buiten dienst gesteld indien hem andere passende
      werkzaamheden kunnen worden opgedragen. Indien de ambtenaar buiten dienst wordt gesteld, wordt hij geacht wegens
      ziekte ongeschikt te zijn tot het verrichten van zijn arbeid, in welk geval de overige bepalingen van dit hoofdstuk
      van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel36a
  - number: 36b.1
    text: |-
      In geval van een geschil over het wel of niet bestaan van ongeschiktheid tot werken wegens ziekte voorziet
      [artikel 30, eerste lid, onderdeel e, van de Wet SUWI][ref1] in het instellen van een onderzoek en het geven van
      een oordeel.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
  - number: 36b.2
    text: |-
      Het medisch advies dat door de deskundige persoon of de arbodienst wordt uitgebracht naar aanleiding van een
      arbeidsgezondheidskundig onderzoek als bedoeld in [artikel 18 van de Arbeidsomstandighedenwet 1998][ref1] en
      [artikel 36a][ref2], wordt zo spoedig mogelijk aan de ambtenaar en Onze Minister medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel36a
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 36a
        hoofdstuk: VI
        paragraaf: '2'
  - number: 36b.3
    text: |-
      De ambtenaar of de gewezen ambtenaar kan de deskundige persoon of de arbodienst binnen drie dagen na ontvangst van
      het medisch advies, schriftelijk een hernieuwd onderzoek vragen indien hij het niet eens is met het medisch advies.
      De deskundige persoon of de arbodienst stelt Onze Minister in kennis van een ingediend verzoek om een hernieuwd
      onderzoek.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel36b
  - number: 36b.4
    text: |-
      Zo spoedig mogelijk na ontvangst van het schriftelijk verzoek om een hernieuwd onderzoek, doch uiterlijk binnen
      vier weken, vindt het hernieuwd onderzoek door een commissie van drie geneeskundigen plaats.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel36b
  - number: 36b.5
    text: |-
      Op verzoek van de ambtenaar of de gewezen ambtenaar wordt zijn behandelend arts in de gelegenheid gesteld mondeling
      of schriftelijk zijn mening aan de commissie van drie geneeskundigen kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel36b
  - number: 36c.1
    text: |-
      De leden van de commissie bedoeld in [artikel 36b, vierde en vijfde lid][ref1], worden per verzoek om een hernieuwd
      onderzoek aangewezen door Onze Minister. De geneeskundige die het medisch advies heeft uitgebracht waarvan
      herziening wordt gevraagd, heeft in de commissie geen zitting.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel36c
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel36c
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 36c
        hoofdstuk: VI
        paragraaf: '2'
  - number: 36c.2
    text: 'De commissie deelt haar oordeel schriftelijk mee aan:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel36c
  - number: 36c.2.a)
    text: de ambtenaar;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel36c
  - number: 36c.2.b)
    text: Onze Minister;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel36c
  - number: 36c.2.c)
    text: |-
      de behandelend arts, bedoeld in [artikel 36b, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel36b
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel36c
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 36b
        hoofdstuk: VI
        paragraaf: '2'
  - number: 36d
    text: |-
      De kosten, verbonden aan het onderzoek, bedoeld in [artikel 36b, eerste lid][ref1], respectievelijk, het hernieuwd
      onderzoek bedoeld in het [artikel 36b, derde lid][ref2], komen voor rekening van Onze Minister. Eventuele reis- en
      verblijfkosten van de ambtenaar worden hem vergoed volgens de geldende regels ter zake van dienstreizen.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel36b
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel36b
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel36d
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 36b
        hoofdstuk: VI
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 36b
        hoofdstuk: VI
        paragraaf: '2'
  - number: '37.1'
    text: |-
      De ambtenaar heeft bij ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte gedurende een tijdvak van
      52 weken recht op doorbetaling van zijn bezoldiging. Bij voortdurende ongeschiktheid heeft hij vervolgens recht op
      doorbetaling van 70% van zijn bezoldiging.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel37
  - number: '37.2'
    text: |-
      Het tijdvak van 52 weken, bedoeld in het eerste lid, vangt aan op de eerste dag waarop wegens ziekte geheel
      of gedeeltelijk niet is of zou zijn gewerkt, of het werken wegens ziekte geheel of gedeeltelijk is of zou zijn
      gestaakt. Indien de ambtenaar buitengewoon verlof zonder behoud van bezoldiging geniet, vangt het tijdvak aan op de
      dag volgend op die waarop het buitengewoon verlof is beëindigd.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel37
  - number: '37.3'
    text: |-
      Voor de toepassing van het eerste lid worden perioden van ongeschiktheid samengeteld indien zij
      elkaar met een onderbreking van minder dan vier weken opvolgen of indien zij direct voorafgaan aan
      en aansluiten op een periode waarin zwangerschaps- of bevallingsverlof wordt genoten overeenkomstig
      [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref1], tenzij de ongeschiktheid redelijkerwijs niet
      geacht kan worden voort te vloeien uit dezelfde oorzaak.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '37.4'
    text: |-
      In afwijking van het eerste lid, heeft de ambtenaar ook na afloop van het tijdvak van 52 weken, bedoeld in het
      eerste lid, recht op doorbetaling van zijn bezoldiging indien de ongeschiktheid om zijn arbeid te verrichten wordt
      veroorzaakt door een beroepsincident.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel37
  - number: '37.5'
    text: |-
      In afwijking van het eerste lid, heeft de ambtenaar ook na afloop van het tijdvak van 52 weken, bedoeld in het
      eerste lid, recht op doorbetaling van zijn bezoldiging over het aantal uren dat hij passende arbeid heeft verricht
      of zou hebben verricht indien die arbeid hem zou zijn aangeboden.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel37
  - number: '37.6'
    text: 'De doorbetaling van de bezoldiging eindigt:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel37
  - number: 37.6.a
    text: |-
      met ingang van de dag waarop de ambtenaar op grond van [artikel 37a, eerste lid][ref1], is herplaatst;


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel37a
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 37a
        hoofdstuk: VI
        paragraaf: '3'
  - number: 37.6.b
    text: met ingang van de dag waarop de ambtenaar ontslag is verleend;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel37
  - number: 37.6.c
    text: met ingang van de dag waarop de ambtenaar de leeftijd van 65 jaar heeft bereikt; of
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel37
  - number: 37.6.d
    text: met ingang van de dag volgende op die waarop de ambtenaar is overleden.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel37
  - number: 37a.1
    text: |-
      De ambtenaar die ongeschikt is tot het verrichten van zijn arbeid wegens ziekte is verplicht een andere functie te
      aanvaarden indien sprake is van passende arbeid.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel37a
  - number: 37a.2
    text: |-
      De ambtenaar die op grond van het eerste lid is herplaatst voordat de termijn van twee jaar, bedoeld in
      [artikel 98, derde lid, onderdeel a][ref1], is verstreken, heeft tot het eind van genoemde termijn rechtop een
      aanvullende uitkering ter grootte van het verschil tussen:


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel98
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '98'
        hoofdstuk: X
  - number: 37a.2.a
    text: |-
      het bedrag waarop de ambtenaar op grond van [artikel 37][ref1] recht zou hebben gehad indien hem geen andere
      functie zou zijn opgedragen; en


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel37
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '37'
        hoofdstuk: VI
        paragraaf: '3'
  - number: 37a.2.b
    text: zijn bezoldiging na herplaatsing.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel37a
  - number: 37a.3
    text: |-
      Indien de ziekte uit hoofde waarvan de ambtenaar ongeschikt is zijn arbeid te verrichten, wordt veroorzaakt door
      een beroepsincident, heeft de ambtenaar, bedoeld in het tweede lid, tevens recht op een aanvullende uitkering nadat
      de termijn van twee jaar is verstreken ter grootte van het verschil tussen:
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel37a
  - number: 37a.3.a
    text: |-
      een percentage van zijn bezoldiging vermeerderd met de vakantie-uitkering, zoals die zou zijn op de dag voor zijn
      herplaatsing indien de ambtenaar op die dag niet ongeschikt zou zijn geweest tot werken; en
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel37a
  - number: 37a.3.b
    text: |-
      zijn bezoldiging na herplaatsing vermeerderd met de vakantie-uitkering en vermeerderd met een uit
      de oorspronkelijke functie voortvloeiend recht op een WAO-uitkering, invaliditeitspensioen en een
      herplaatsingstoelage.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel37a
  - number: 37a.4
    text: |-
      Het percentage, bedoeld in het derde lid, onderdeel a, is afhankelijk van de mate van arbeidsongeschiktheid en
      bedraagt bij een arbeidsongeschiktheid van:






                    80% of meer:


                    90,02%;




                    65 tot 80%:


                    65,26%;




                    55 tot 65%:


                    54,01%;




                    45 tot 55%:


                    45,01%;




                    35 tot 45%:


                    36,01%;




                    25 tot 35%:


                    27,01%;




                    15 tot 25%:


                    18,00%.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel37a
  - number: 37a.5
    text: 'De aanvullende uitkeringen, bedoeld in het tweede en derde lid, eindigen in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel37a
  - number: 37a.5.a
    text: met ingang van de dag waarop de ambtenaar ontslag is verleend;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel37a
  - number: 37a.5.b
    text: met ingang van de dag waarop de ambtenaar de leeftijd van 65 jaar heeft bereikt; of
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel37a
  - number: 37a.5.c
    text: met ingang van de dag volgende op die waarop de ambtenaar is overleden.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel37a
  - number: '38.1'
    text: |-
      De gewezen ambtenaar die wegens ziekte, ontstaan voor het tijdstip van ingang van zijn ontslag, na zijn ontslag
      anders dan op grond van [artikel 98, eerste lid, onderdeel f][ref1], nog ongeschikt is een naar aard en omvang
      soortgelijke functie te vervullen, heeft:


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel98
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '98'
        hoofdstuk: X
  - number: 38.1.a
    text: |-
      zolang hij ongeschikt tot werken is wegens ziekte, maar niet langer dan een tijdvak van 52 weken, recht op
      doorbetaling van zijn laatstelijk genoten bezoldiging vermeerderd met de vakantie-uitkering;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel38
  - number: 38.1.b
    text: |-
      zolang hij na afloop van het tijdvak, bedoeld in onderdeel a, nog ongeschikt is tot het verrichten van arbeid
      wegens ziekte, gedurende maximaal 26 weken recht op doorbetaling van 70% van zijn laatstelijk genoten bezoldiging
      vermeerderd met de vakantie-uitkering.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel38
  - number: '38.2'
    text: |-
      De gewezen ambtenaar die binnen een maand na het tijdstip van zijn ontslag wegens ziekte ongeschikt wordt een
      naar aard en omvang soortgelijke functie te vervullen, heeft, zolang hij ongeschikt is tot werken wegens ziekte,
      gedurende maximaal 52 weken recht op doorbetaling van zijn laatstelijk genoten bezoldiging indien hij gedurende ten
      minste twee maanden onmiddellijk aan het ontslag voorafgaande in dienst is geweest.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel38
  - number: '38.3'
    text: |-
      De gewezen ambtenaren, bedoeld in het eerste en tweede lid, hebben gedurende een tijdvak van 104 weken als bedoeld
      in [artikel 19, eerste lid, van de WAO][ref1], recht op doorbetaling van hun laatstelijk genoten bezoldiging
      vermeerderd met de vakantie-uitkering indien hun arbeidsongeschiktheid wordt veroorzaakt door een beroepsincident.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
  - number: '38.4'
    text: |-
      Het tijdvak gedurende welke de gewezen ambtenaar recht heeft op doorbetaling van zijn laatstelijk genoten
      bezoldiging vangt aan op de eerste dag waarop wegens ziekte geheel of gedeeltelijk niet is of zou zijn gewerkt of
      het werken wegens ziekte geheel of gedeeltelijk is of zou zijn gestaakt. Indien de gewezen ambtenaar onmiddellijk
      voorafgaand aan het ontslag buitengewoon verlof zonder behoud van bezoldiging genoot, vangt het tijdvak, bedoeld in
      het eerste lid, onderdeel a, aan op de dag waarop het ontslag is ingegaan.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel38
  - number: '38.5'
    text: |-
      Voor het bepalen van het einde van het tijdvak van 52 weken, bedoeld in het eerste en tweede lid, worden
      perioden van ongeschiktheid tot werken wegens ziekte samengeteld indien de perioden van ongeschiktheid
      elkaar met een onderbreking van minder dan vier weken opvolgen of indien zij direct voorafgaan aan
      en aansluiten op een periode waarin zwangerschaps- of bevallingsverlof wordt genoten overeenkomstig
      [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref1] of een uitkering op grond van
      [artikel 3:8][ref2], of [3:10, eerste lid, van die wet][ref3], tenzij de ongeschiktheid redelijkerwijs niet geacht
      kan worden voort te vloeien uit dezelfde oorzaak.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '38.6'
    text: |-
      De doorbetaling van de laatstelijk genoten bezoldiging, bedoeld in het eerste, tweede en derde lid, eindigt in
      ieder geval:
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel38
  - number: 38.6.a
    text: met ingang van de dag waarop de gewezen ambtenaar de leeftijd van 65 jaar heeft bereikt; of
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel38
  - number: 38.6.b
    text: met ingang van de dag volgende op die waarop de gewezen ambtenaar is overleden.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel38
  - number: '38.7'
    text: |-
      De gewezen ambtenaar die recht heeft op een WAO-uitkering ter zake van de dienstbetrekking die hij voor zijn
      ontslag vervulde, heeft recht op een aanvullende uitkering indien de arbeidsongeschiktheid is veroorzaakt door
      een beroepsincident.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel38
  - number: '38.8'
    text: 'De aanvullende uitkering, bedoeld in het zevende lid, is gelijk aan het verschil tussen:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel38
  - number: 38.8.a
    text: |-
      een percentage van de laatstelijk genoten bezoldiging vermeerderd met de vakantie-uitkering, in het jaar
      voorafgaande aan zijn ontslag; en
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel38
  - number: 38.8.b
    text: |-
      de aan de ambtenaar toegekende WAO-uitkering, in voorkomend geval vermeerderd met een hem toegekend
      invaliditeitspensioen en een hem toegekende herplaatsingstoelage.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel38
  - number: '38.9'
    text: |-
      Het percentage, bedoeld in het achtste lid, onderdeel a, is afhankelijk van de mate van arbeidsongeschiktheid en
      bedraagt bij een arbeidsongeschiktheid van:






                    80% of meer:


                    90,02%;




                    65 tot 80%:


                    65,26%;




                    55 tot 65%:


                    54,01%;




                    45 tot 55%:


                    45,01%;




                    35 tot 45%:


                    36,01%;




                    25 tot 35%:


                    27,01%;




                    15 tot 25%:


                    18,00%.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel38
  - number: '38.10'
    text: 'De aanvullende uitkering, bedoeld in het zevende lid, eindigt:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel38
  - number: 38.10.a
    text: met ingang van de dag waarop de gewezen ambtenaar de leeftijd van 65 jaar heeft bereikt; of
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel38
  - number: 38.10.b
    text: met ingang van de dag volgende op die waarop de gewezen ambtenaar is overleden.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel38
  - number: '38.11'
    text: |-
      De gewezen ambtenaar aan wie eervol ontslag is verleend op grond van [artikel 94a][ref1], heeft slechts recht
      op doorbetaling van zijn laatstelijk genoten bezoldiging of aanvullende uitkering voorzover deze tezamen met de
      aanvullende uitkering, bedoeld in artikel 4 van het FPU-reglement basis- en aanvullende uitkering, de laatstgenoten
      bezoldiging niet overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel94a
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 94a
        hoofdstuk: X
  - number: 38a.1
    text: |-
      De ambtenaar die ongeschikt is zijn arbeid te verrichten wegens een dienstongeval of een beroepsziekte doch
      niet door een beroepsincident, wordt op zijn aanvraag voor de toepassing van dit hoofdstuk gelijkgesteld met de
      ambtenaar die ongeschikt is zijn arbeid te verrichten wegens een beroepsincident.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel38a
  - number: 38a.2
    text: |-
      De gewezen ambtenaar van wie de arbeidsongeschiktheid wordt veroorzaakt door een dienstongeval of een beroepsziekte
      doch niet door een beroepsincident, wordt op zijn aanvraag voor de toepassing van dit hoofdstuk gelijkgesteld met
      de gewezen ambtenaar van wie de arbeidsongeschiktheid wordt veroorzaakt door een beroepsincident.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel38a
  - number: '39'
    text: |-
      De [artikelen 37, vierde lid][ref1], [37a, tweede tot en met vijfde lid][ref2], [38][ref3], [38a][ref4] en
      [69, tweede lid][ref5], zijn niet van toepassing op de ambtenaar en de gewezen ambtenaar die geen deelnemer zijn in
      de zin van het Pensioenreglement.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel37a
      [ref3]: https://wetten.overheid.nl/BWBR0001950#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0001950#Artikel38a
      [ref5]: https://wetten.overheid.nl/BWBR0001950#Artikel69
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '37'
        hoofdstuk: VI
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 37a
        hoofdstuk: VI
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0001950
        artikel: '38'
        hoofdstuk: VI
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0001950
        artikel: 38a
        hoofdstuk: VI
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0001950
        artikel: '69'
        hoofdstuk: VIIa
  - number: '40.1'
    text: |-
      De ambtenaar en de gewezen ambtenaar hebben geen aanspraak op doorbetaling van de bezoldiging of een
      bovenwettelijke arbeidsongeschiktheidsuitkering:
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel40
  - number: 40.1.a)
    text: |-
      indien de ziekte is voorgewend, althans zodanig overdreven wordt voorgesteld, dat ongeschiktheid tot het verrichten
      van arbeid wegens ziekte niet kan worden aangenomen;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel40
  - number: 40.1.b)
    text: |-
      indien de ambtenaar de ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte opzettelijk heeft
      veroorzaakt, tenzij hem daarvan op grond van zijn psychische toestand geen verwijt kan worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel40
  - number: 40.1.c)
    text: |-
      indien de ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte zich voordoet binnen een half jaar na
      het geneeskundig onderzoek, bedoeld in artikel 9, vierde lid, onderdeel b en blijkt dat de ambtenaar onjuiste
      informatie omtrent zijn gezondheidstoestand heeft verstrekt of gegevens heeft verzwegen, ten gevolge waarvan de
      verklaring van geschiktheid, de aan de desbetreffende functie verbonden werkzaamheden te verrichten, ten onrechte
      heeft plaatsgevonden, tenzij de ambtenaar aannemelijk maakt dat hij te goeder trouw heeft gehandeld.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel40
  - number: '40.2'
    text: |-
      De gewezen ambtenaar heeft geen aanspraak op doorbetaling van zijn laatstelijk genoten bezoldiging of de
      bovenwettelijke arbeidsongeschiktheidsuitkering, indien hij op grond van een aanvaarde andere betrekking aanspraak
      kan maken op doorbetaling van zijn loon of bezoldiging, dan wel op een ZW-uitkering.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel40
  - number: 40a.1
    text: |-
      De aanspraken van de ambtenaar en de gewezen ambtenaar op grond van dit hoofdstuk vervallen indien de ambtenaar of
      de gewezen ambtenaar:
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel40a
  - number: 40a.1.a)
    text: niet binnen redelijke termijn gezondheidskundige hulp inroept;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel40a
  - number: 40a.1.b)
    text: zich niet gedurende het gehele verloop van de ziekte onder gezondheidskundige behandeling blijft stellen;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel40a
  - number: 40a.1.c)
    text: de voorschriften van de behandelende arts niet opvolgt;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel40a
  - number: 40a.1.d)
    text: zich schuldig maakt aan gedragingen waardoor zijn genezing wordt belemmerd;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel40a
  - number: 40a.1.e)
    text: |-
      verzuimt de deskundige persoon of de arbodienst op eerste aanvraag mee te delen om welke reden hij ongeschikt is
      tot werken;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel40a
  - number: 40a.1.f)
    text: |-
      zonder deugdelijke grond nalaat gevolg te geven aan een verzoek van de deskundige persoon of de arbodienst om te
      verschijnen;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel40a
  - number: 40a.1.g)
    text: |-
      er de oorzaak van is dat het arbeidsgezondheidskundig onderzoek door een door de deskundige persoon of de
      arbodienst aangewezen arts niet kan plaatshebben;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel40a
  - number: 40a.1.h)
    text: |-
      niet binnen twee dagen na de aanvang van de ongeschiktheid tot werken wegens ziekte dit heeft gemeld bij zijn
      werkgever;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel40a
  - number: 40a.1.i)
    text: |-
      weigert aangeboden passende arbeid, waartoe de deskundige persoon of de arbodienst hem in staat acht, te verkrijgen
      of te aanvaarden, dan wel, zonder deugdelijke grond weigert deze arbeid, waartoe het bevoegd gezag hem in de
      gelegenheid stelt, te verrichten;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel40a
  - number: 40a.1.j)
    text: |-
      zich niet houdt aan de ten aanzien van hem geldende regels met betrekking tot de wijze waarop invulling wordt
      gegeven aan de verzuimbegeleiding en de arbeidsgezondheidskundige begeleiding en de daarbij in acht te nemen
      procedure;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel40a
  - number: 40a.1.k)
    text: zijn ongeschiktheid tot werken opzettelijk heeft veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel40a
  - number: 40a.1.l)
    text: |-
      weigert inzage te geven in een op hem betrekking hebbend document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] of een geldig rijbewijs als bedoeld in artikel 9, eerste
      lid, van de Wegenverkeerswet, voor zover dit redelijkerwijs nodig is voor de uitvoering van wetten;


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 40a.1.m)
    text: |-
      tijdens de ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte arbeid voor zichzelf of voor derden
      verricht, tenzij dit door de deskundige persoon of de arbodienst in het belang van zijn genezing wenselijk wordt
      geacht;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel40a
  - number: 40a.1.n)
    text: |-
      vóór de betaling van de bezoldiging weigert mededeling te doen van inkomsten uit arbeid die hij heeft in verband
      met het verrichten van door de deskundige persoon of de arbodienst in het belang van zijn genezing wenselijk
      geachte arbeid voor zichzelf of voor derden;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel40a
  - number: 40a.1.o)
    text: |-
      niet onverwijld op verzoek of uit eigen beweging alle feiten en omstandigheden meedeelt, waarvan hem redelijkerwijs
      duidelijk moet zijn dat zij van invloed kunnen zijn op het recht of op de hoogte van een aan hem toegekende
      arbeidsongeschiktheidsuitkering;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel40a
  - number: 40a.1.p)
    text: |-
      zijn arbeid verzuimt te hervatten op het door de deskundige persoon of de arbodienst bepaalde tijdstip en in
      de door deze persoon of dienst bepaalde mate, indien zulks hem is opgedragen, tenzij hij daarvoor een door de
      deskundige persoon of de arbodienst als geldig erkende reden heeft opgegeven;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel40a
  - number: 40a.1.q)
    text: |-
      zonder deugdelijke grond weigert gevolg te geven aan door het bevoegd gezag of een door het bevoegd gezag
      aangewezen deskundige gegeven redelijke voorschriften of mee te werken aan getroffen maatregelen die erop gericht
      zijn om de betrokkene in staat te stellen passende arbeid te verrichten;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel40a
  - number: 40a.1.r)
    text: |-
      zonder deugdelijke grond weigert mee te werken aan het opstellen, evalueren of bijstellen van een plan van aanpak,
      bedoeld in [artikel 71a, tweede lid, van de WAO][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
  - number: 40a.1.s)
    text: |-
      geen aanspraak heeft op een WAO-uitkering in verband met de toepassing van [artikel 25][ref1] of
      [28, onder a of b, van de WAO][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel28
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '28'
  - number: 40a.1.t)
    text: zijn medewerking weigert bij de doelmatige uitvoering van de bepalingen van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel40a
  - number: 40a.2
    text: |-
      De aanspraak op de doorbetaling van bezoldiging of de bovenwettelijke arbeidsongeschiktheidsuitkering, kan geheel
      of gedeeltelijk vervallen worden verklaard in het geval de ambtenaar of de gewezen ambtenaar de regels heeft
      overtreden die ter zake van afwezigheid wegens ziekte zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel40a
  - number: 40a.3
    text: |-
      De ingevolge het eerste lid vervallen aanspraken herleven met ingang van het tijdstip waarop de ambtenaar of de
      gewezen ambtenaar alsnog gevolg geeft aan de betreffende verplichting op grond van dat lid.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel40a
  - number: 40a.4
    text: |-
      Onze Minister kan op grond van bijzondere omstandigheden bepalen, dat de aanspraak op de doorbetaling van
      bezoldiging of de bovenwettelijke arbeidsongeschiktheidsuitkering, niet vervalt maar geheel of ten dele aan anderen
      dan aan de ambtenaar of de gewezen ambtenaar zal worden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel40a
  - number: 40a.5
    text: |-
      Voor zover Onze Minister van de bevoegdheid, bedoeld in het vierde lid, geen gebruik heeft
      gemaakt, wordt de niet uitbetaalde bezoldiging of de niet uitbetaalde bovenwettelijke
      arbeidsongeschiktheidsuitkering, alsnog aan de ambtenaar of de gewezen ambtenaar uitbetaald, indien het in
      [artikel 30, eerste lid, onderdeel e, van de Wet SUWI][ref1], bedoelde oordeel ten gunste van de ambtenaar of de
      gewezen ambtenaar uitvalt.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
  - number: 40b.1
    text: |-
      Het bevoegd gezag is verplicht zo tijdig mogelijk zodanige maatregelen te treffen en voorschriften te geven als
      redelijkerwijs nodig is, opdat de ambtenaar die in verband met ongeschiktheid ten gevolge van ziekte verhinderd is
      zijn arbeid te verrichten, in staat wordt gesteld de eigen of andere passende arbeid te verrichten.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel40b
  - number: 40b.2
    text: |-
      De maatregelen en voorschriften, bedoeld in het eerste lid, zijn gericht op duurzame reïntegratie in de eigen
      arbeid of in andere passende arbeid in de sector Rijk waarvan de voor die arbeid geldende salarisschaal niet meer
      dan twee schalen lager is dan de salarisschaal die voor de ambtenaar geldt en waarbij de resterende mogelijkheden
      van de ambtenaar volledig worden benut. Indien na overleg tussen het bevoegd gezag en de ambtenaar vaststaat dat
      dergelijke arbeid niet voorhanden is, zullen de maatregelen en voorschriften zich richten op duurzame reïntegratie
      in andere passende arbeid, zo mogelijk binnen een van de overheidssectoren.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel40b
  - number: 40b.3
    text: |-
      Zolang duurzame reïntegratie als bedoeld in het tweede lid niet mogelijk is, stelt het bevoegd gezag de ambtenaar
      in de gelegenheid andere passende arbeid te verrichten.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel40b
  - number: 40b.4
    text: |-
      Uit hoofde van zijn verplichting, bedoeld in het eerste lid, stelt het bevoegd gezag in overeenstemming met de
      ambtenaar een plan van aanpak op als bedoeld in [artikel 71a, tweede lid, van de WAO][ref1]. Het plan van aanpak
      wordt met medewerking van de ambtenaar regelmatig geëvalueerd en zo nodig bijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
  - number: 40b.5
    text: |-
      De ambtenaar die van mening is dat het bevoegd gezag de in het eerste lid bedoelde verplichtingen niet of
      onvoldoende nakomt, legt bij zijn verzoek tot nakoming aan het bevoegd gezag een oordeel van het UWV als bedoeld
      in [artikel 30, eerste lid, onder g, van de Wet SUWI][ref1] over. Het bevoegd gezag beslist binnen zes weken op
      het verzoek en deelt daarbij mee tot welke aanpassingen in de reïntegratie-inspanningen het verzoek hem aanleiding
      geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
  - number: '45.1'
    text: |-
      Bij samenloop van een recht krachtens dit hoofdstuk met een ZW-uitkering, WAO-uitkering, WW-uitkering of
      bovenwettelijke WW-uitkering op grond van dezelfde dienstbetrekking, wordt deze uitkering in mindering gebracht op
      dit recht, tenzij het een recht op grond van de [artikelen 47][ref1] of [48][ref2] betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel48
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '47'
        hoofdstuk: VI
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '48'
        hoofdstuk: VI
        paragraaf: '5'
  - number: '45.2'
    text: |-
      Indien als gevolg van handelingen of het nalaten van handelingen door de ambtenaar of de gewezen ambtenaar de ZW-
      uitkering, de WAO-uitkering, de WW-uitkering of de bovenwettelijke WW-uitkering een vermindering ondergaat, dan
      wel de aanspraak daarop geheel of gedeeltelijk wordt geweigerd, wordt de ZW-uitkering, de WAO-uitkering, de WW-
      uitkering of de bovenwettelijke WW-uitkering voor het vaststellen van de vermindering, bedoeld in het eerste lid,
      steeds geacht onverminderd te zijn genoten.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel45
  - number: '45.3'
    text: |-
      Indien de ambtenaar of de gewezen ambtenaar recht heeft op een ZW-uitkering of een WAO-uitkering, is het
      verplichtingen- en sanctieregime van de ZW of de WAO van overeenkomstige toepassing op zijn recht krachtens dit
      hoofdstuk op grond van dezelfde dienstbetrekking.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel45
  - number: '45.4'
    text: |-
      De inkomsten die de ambtenaar of de gewezen ambtenaar geniet in verband met het verrichten van in het belang van
      zijn genezing door de deskundige persoon of de arbodienst wenselijk geachte arbeid, worden op de aanspraak op
      de doorbetaling van de bezoldiging of de bovenwettelijke arbeidsongeschiktheidsuitkering in mindering gebracht,
      voorzover deze te samen met de aanspraak op de doorbetaling van de bezoldiging of de WAO-uitkering, vermeerderd met
      de bovenwettelijke arbeidsongeschiktheidsuitkering, de bezoldiging te boven gaan.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel45
  - number: '45.5'
    text: |-
      Inkomsten uit of in verband met arbeid of bedrijf worden op het bedrag, waarop de gewezen ambtenaar ingevolge dit
      hoofdstuk recht heeft, in mindering gebracht, tenzij:
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel45
  - number: 45.5.a)
    text: |-
      de gewezen ambtenaar deze inkomsten reeds vóór het intreden van de ongeschiktheid tot het verrichten van zijn
      arbeid wegens ziekte genoot; en
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel45
  - number: 45.5.b)
    text: de omvang van die arbeid niet is toegenomen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel45
  - number: '46.1'
    text: |-
      Voor zolang de gewezen ambtenaar na beëindiging van de haar ingevolge
      [artikel 33fc, het eerste, tweede of het vierde lid][ref1], toekomende uitkering:


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel33fc
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 33fc
        hoofdstuk: V
        paragraaf: '2'
  - number: 46.1.a)
    text: wegens ziekte ongeschikt is tot werken, dan wel
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel46
  - number: 46.1.b)
    text: |-
      binnen een maand na deze beëindiging ongeschikt wordt tot werken, heeft zij gedurende een tijdvak van 52 weken
      recht op de doorbetaling van de bezoldiging overeenkomstig [artikel 38][ref1]. De termijn van 52 weken wordt
      geacht aan te vangen na beëindiging van voornoemde periode respectievelijk met ingang van de eerste dag waarop zij
      ongeschikt is een naar aard en omvang soortgelijke functie te vervullen.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel38
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '38'
        hoofdstuk: VI
        paragraaf: '3'
  - number: '46.2'
    text: |-
      Ongeschikt tot werken, geheel of gedeeltelijk, in de zin van het eerste lid is de vrouwelijke gewezen ambtenaar die
      als rechtstreeks en objectief medisch vast te stellen gevolg van ziekte of gebreken geheel of gedeeltelijk niet in
      staat is om een naar aard en omvang soortgelijke betrekking als zij vervulde, te vervullen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel46
  - number: '47.1'
    text: |-
      In bijzondere gevallen kan aan de ambtenaar een tegemoetkoming worden toegekend in noodzakelijk gemaakte kosten die
      verband houden met ziekte, welke de ambtenaar voor zichzelf en voor zijn medebelanghebbenden heeft gemaakt:
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel47
  - number: 47.1.a)
    text: indien hierin niet ingevolge een andere regeling kan worden voorzien; en
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel47
  - number: 47.1.b)
    text: deze kosten redelijkerwijs niet voor zijn rekening kunnen blijven.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel47
  - number: '47.2'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan omtrent het bepaalde in het eerste lid nadere
      regels vaststellen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel47
  - number: '48.1'
    text: |-
      Indien de ziekte, uit hoofde waarvan de ambtenaar of de gewezen ambtenaar ongeschikt is zijn arbeid te verrichten,
      voortvloeit uit een dienstongeval of een door het verrichten van zijn arbeid opgelopen beroepsziekte, worden
      hem vergoed de naar het oordeel van Onze Minister noodzakelijk gemaakte kosten van geneeskundige behandeling of
      verzorging die voor rekening van de ambtenaar blijven.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel48
  - number: '48.2'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan omtrent het bepaalde in het eerste lid nadere
      regels vaststellen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel48
  - number: 48a.1
    text: |-
      Het bedrag van de bezoldiging of de laatstelijk genoten bezoldiging, bedoeld in de [artikelen 37][ref1], [38][ref2]
      en [39][ref3], wordt in voorkomende gevallen gewijzigd overeenkomstig een algemene salariswijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0001950#Artikel39
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '37'
        hoofdstuk: VI
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '38'
        hoofdstuk: VI
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0001950
        artikel: '39'
        hoofdstuk: VI
        paragraaf: '3'
  - number: 48a.2
    text: |-
      Indien de ambtenaar in het genot is van een toelage als bedoeld in [artikel 17][ref1], [17a][ref2], [18][ref3]
      of [18a van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref4], worden die toelagen voor de
      vaststelling van het in het eerste lid bedoelde bedrag, vastgesteld op het bedrag dat hem ingevolge de voor hem
      geldende werktijdregeling zou zijn toegekend indien hij niet ongeschikt was geworden tot het verrichten van zijn
      arbeid wegens ziekte. Indien de vaststelling van het bedrag op deze wijze niet mogelijk is, dan wordt dit bedrag
      vastgesteld op het gemiddelde van het bedrag dat de ambtenaar per maand aan die toelagen heeft genoten over de drie
      kalendermaanden voorafgaande aan:


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel17a
      [ref3]: https://wetten.overheid.nl/BWBR0003630#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0003630#Artikel18a
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0003630
        artikel: 17a
      - id: ref3
        bwb_id: BWBR0003630
        artikel: '18'
      - id: ref4
        bwb_id: BWBR0003630
        artikel: 18a
  - number: 48a.2.a)
    text: de kalendermaand waarin de ambtenaar ongeschikt is geworden tot het verrichten van zijn arbeid wegens ziekte; of
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel48a
  - number: 48a.2.b)
    text: |-
      de kalendermaand waarin de gewezen ambtenaar wegens ziekte ongeschikt is geworden een naar aard en omvang
      soortgelijke betrekking te vervullen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel48a
  - number: 48a.3
    text: |-
      Indien ook voor het overige de bezoldiging niet in een vast bedrag per maand kan worden uitgedrukt, wordt gerekend
      met het bedrag dat gemiddeld per maand is toegekend in de drie kalendermaanden voorafgaande aan de maand waarin:
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel48a
  - number: 48a.3.a)
    text: de ambtenaar ongeschikt is geworden tot het verrichten van zijn arbeid wegens ziekte;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel48a
  - number: 48a.3.b)
    text: |-
      de gewezen ambtenaar wegens ziekte ongeschikt is geworden een naar aard en omvang soortgelijke betrekking te
      vervullen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel48a
  - number: 48a.4
    text: |-
      Voor zover de ambtenaar of de gewezen ambtenaar geen drie kalendermaanden in dienst is geweest, wordt voor
      de toepassing van het tweede en derde lid gerekend met het bedrag dat hem gemiddeld aan bezoldiging per maand
      is toegekend over het tijdvak waarin hij in dienst is geweest vóór het ontstaan van de ongeschiktheid tot het
      verrichten van zijn arbeid respectievelijk tot het vervullen van een naar aard en omvang soortgelijke betrekking.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel48a
  - number: 48b.1
    text: |-
      De aanspraak van de ambtenaar en de gewezen ambtenaar op de bovenwettelijke arbeidsongeschiktheidsuitkering wordt
      zoveel mogelijk op gelijke wijze gewijzigd als een aan hem toegekende WAO-uitkering.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel48b
  - number: 48b.2
    text: |-
      Het eerste lid vindt geen toepassing indien de ambtenaar en de gewezen ambtenaar aanspraak op een WAO-uitkering
      hebben wegens de ongeschiktheid tot werken voor een betrekking die de ambtenaar of de gewezen ambtenaar heeft
      vervuld naast zijn betrekking ter zake waarvan de ambtenaar of de gewezen ambtenaar op een uitkering krachtens dit
      hoofdstuk aanspraak heeft, voor zover de WAO-uitkering naar de inkomsten uit die andere betrekking wordt berekend
      of geacht kan worden te zijn berekend.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel48b
  - number: '49.1'
    text: |-
      De ambtenaar die aanspraak heeft op een bovenwettelijke arbeidsongeschiktheidsuitkering, heeft aanspraak op een
      vakantie-uitkering ter grootte van 8% van de bovenwettelijke arbeidsongeschiktheidsuitkering.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49
  - number: '49.2'
    text: |-
      De [artikelen 21][ref1] en [22 van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel22
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0003630
        artikel: '22'
  - number: 49a.1
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan regels vaststellen omtrent de te volgen procedure
      bij reorganisaties en het herplaatsen van ambtenaren.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49a
  - number: 49a.2
    text: Onze Minister kan nadere procedures en regels vaststellen omtrent reorganisaties en het herplaatsen van ambtenaren.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49a
  - number: 49b.1
    text: Bij een reorganisatie zijn de bepalingen van dit hoofdstuk van toepassing.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49b
  - number: 49b.2
    text: 'Onder reorganisatie als bedoeld in het eerste lid wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49b
  - number: 49b.2.a
    text: |-
      iedere wijziging van de organisatiestructuur, de omvang of de taakinhoud van een ministerie of een onderdeel
      daarvan, waaraan personele consequenties zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49b
  - number: 49b.2.b
    text: |-
      iedere wijziging van de organisatiestructuur, de omvang of de taakinhoud van de Algemene Rekenkamer, de Hoge Raad
      van Adel, het Kabinet der Koningin, de Kanselarij der Nederlandse Orden, de Nationale Ombudsman, de Raad van State
      of een onderdeel daarvan, waaraan personele consequenties zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49b
  - number: 49b.3
    text: |-
      De bepalingen van dit hoofdstuk zijn van overeenkomstige toepassing op de overgang van de ambtenaar naar een
      private onderneming of zelfstandig bestuursorgaan in verband met de privatisering of verzelfstandiging van het
      dienstonderdeel van het ministerie waarbij de ambtenaar werkzaam is, tenzij bij algemeen verbindend voorschrift
      anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49b
  - number: 49c
    text: |-
      Indien de bepalingen in dit hoofdstuk worden toegepast op de Algemene Rekenkamer, de Hoge Raad van Adel, het
      Kabinet der Koningin, de Kanselarij der Nederlandse Orden, de Nationale Ombudsman en de Raad van State, dient voor
      Onze Minister telkens te worden gelezen het College van de Algemene Rekenkamer, de Voorziter van de Hoge Raad van
      Adel, de directeur van het Kabinet der Koningin, de Kanselier der Nederlandse Orden, de Nationale Ombudsman of de
      Vice-President van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49c
  - number: 49ca.1
    text: |-
      Door of namens Onze Minister worden de centrales van verenigingen van ambtenaren tijdig geïnformeerd over een
      voorgenomen besluit tot een reorganisatie.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49ca
  - number: 49ca.2
    text: |-
      Door of namens Onze Minister worden de betrokken ondernemingsraden tijdig geïnformeerd over een voorgenomen besluit
      tot een reorganisatie.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49ca
  - number: 49d
    text: |-
      De ambtenaar die is aangesteld in tijdelijke dienst voor een proeftijd en de ambtenaar aangesteld in vaste dienst,
      wier functie in verband met een reorganisatie is opgeheven, worden aangewezen als te herplaatsen ambtenaar, hierna
      te noemen: herplaatsingskandidaat.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49d
  - number: 49e.1
    text: |-
      Van overtolligheid is sprake indien binnen het te reorganiseren ministerie, het Kabinet der Koningin, de Algemene
      Rekenkamer, de Hoge Raad van Adel, de Kanselarij der Nederlandse Orden, de Nationale ombudsman, de Raad van State,
      of een onderdeel daarvan, meer ambtenaren een vergelijkbare of uitwisselbare functie vervullen en het totale aantal
      van die functies zodanig wordt verminderd dat onvoldoende van die functies voor de betrokken ambtenaren resteren.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49e
  - number: 49e.2
    text: |-
      De ambtenaar die is aangesteld in tijdelijke dienst voor een proeftijd en de ambtenaar aangesteld in vaste dienst,
      die in verband met een reorganisatie overtollig zijn, worden aangewezen als herplaatsingskandidaat, waarbij de
      ambtenaar die het geringste aantal jaren in overheidsdienst heeft doorgebracht het eerst als herplaatsingskandidaat
      wordt aangewezen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49e
  - number: 49e.3
    text: |-
      Voor de berekening van het aantal in overheidsdienst doorgebrachte jaren wordt mede in aanmerking genomen
      tijd gewijd aan de verzorging van tot het huishouden van de ambtenaar behorende 0–4 jarige eigen, stief- of
      pleegkinderen, tot een maximum van in totaal zes jaren.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49e
  - number: 49e.4
    text: Onze Minister kan van de volgorde in het tweede lid afwijken indien zulks naar zijn oordeel noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49e
  - number: 49f
    text: De ambtenaar wordt omtrent zijn aanwijzing als herplaatsingskandidaat zo spoedig mogelijk geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49f
  - number: 49g.1
    text: |-
      Onverminderd het gestelde in artikel 96, eerste lid is Onze Minister verplicht om de ambtenaar binnen een periode
      van 18 maanden, te rekenen vanaf het moment dat de ambtenaar is aangewezen als herplaatsingskandidaat, ten minste
      één passende functie aan te bieden.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49g
  - number: 49g.2
    text: 'Onze Minister kan de termijn als bedoeld in het eerste lid verkorten indien:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49g
  - number: 49g.2.a
    text: |-
      de herplaatsingskandidaat heeft geweigerd te voldoen aan een hem op grond van dit hoofdstuk opgelegde verplichting,
      of;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49g
  - number: 49g.2.b
    text: |-
      reeds eerder in overleg met de ambtenaar binnen de termijn kan worden vastgesteld dat er geen mogelijkheden zijn om
      de herplaatsingskandidaat te herplaatsen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49g
  - number: 49g.3
    text: |-
      Onze Minister kan de termijn verlengen of opschorten, indien de omstandigheden naar zijn oordeel daartoe aanleiding
      geven.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49g
  - number: 49g.4
    text: |-
      De ambtenaar wordt gelijktijdig met zijn aanwijzing als herplaatsingskandidaat geïnformeerd over de aanvang en het
      einde van de termijn als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49g
  - number: 49g.5
    text: |-
      Door Onze Minister wordt de herplaatsingskandidaat geïnformeerd over het verkorten, verlengen of opschorten van de
      termijn als bedoeld in het tweede en het derde lid.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49g
  - number: 49h.1
    text: |-
      Van een passende functie als bedoeld in [artikel 49g][ref1] is sprake indien de herplaatsingskandidaat naar het
      oordeel van Onze Minister beschikt over de kennis en kunde die noodzakelijk worden geacht om de functie naar
      behoren te kunnen uitoefenen danwel indien de herplaatsingskandidaat naar het oordeel van Onze Minister binnen
      redelijke termijn om-, her- of bijgeschoold kan worden, en deze functie hem in verband met zijn persoonlijkheid,
      zijn omstandigheden en de voor hem bestaande vooruitzichten, redelijkerwijs kan worden opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49g
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49h
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49g
        hoofdstuk: VII
  - number: 49h.2
    text: |-
      Bij het eerste lid geldt de beperking dat uitsluitend sprake kan zijn van een passende functie indien de voor
      de functie geldende salarisschaal niet meer dan twee schalen lager is dan de salarisschaal die geldt voor de
      herplaatsingskandidaat.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49h
  - number: 49h.3
    text: |-
      Onze Minister kan de herplaatsingskandidaat plaatsen op een functie waarvan de geldende salarisschaal meer dan twee
      schalen lager is dan de salarisschaal die geldt voor de herplaatsingskandidaat indien er bijzondere omstandigheden
      zijn die zulks rechtvaardigen en indien de herplaatsingskandidaat daarmee instemt.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49h
  - number: 49h.4
    text: |-
      Bij een herplaatsing met toepassing van het derde lid zijn de [artikelen 49k][ref1] en 49n van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49k
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49h
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49k
        hoofdstuk: VII
  - number: 49i
    text: |-
      Onze Minister kan de naar zijn oordeel meest geschikte herplaatsingskandidaat, voor wie de functie als passend
      wordt aangemerkt, herplaatsen in die functie.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49i
  - number: 49j.1
    text: |-
      Onverminderd het bepaalde in artikel 49*g*, eerste lid, is de herplaatsingskandiaat verplicht al het mogelijke te
      doen om een passende functie te vinden.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49j
  - number: 49j.2
    text: De herplaatsingskandidaat is verplicht een passende functie te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49j
  - number: 49k
    text: |-
      De herplaatsingskandidaat die slechts in een voor hem passende functie kan worden herplaatst na om-, her- of
      bijscholing kan hiertoe worden verplicht, voor zover dat redelijkerwijs van hem kan worden gevergd. Artikel 59,
      tweede lid, eerste volzin, derde, zesde en zevende lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49k
  - number: 49l.1
    text: |-
      De herplaatsingskandidaat die heeft geweigerd te voldoen aan een hem op grond van dit hoofdstuk opgelegde
      verplichting, kan in verband daarmee ontslag worden verleend.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49l
  - number: 49l.2
    text: Bij een ontslagverlening op grond van het eerste lid wordt een opzeggingstermijn van drie maanden in acht genomen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49l
  - number: 49n.1
    text: |-
      De ambtenaar die in verband met zijn herplaatsing of plaatsing in een passende functie in opdracht van Onze
      Minister is verhuisd, wordt eenmalig een bedrag toegekend van € 10 890,73 bruto ter tegemoetkoming in de daarmee
      verband houdende kosten.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49n
  - number: 49n.2
    text: |-
      In de gevallen waarin de ambtenaar en zijn echtgenoot beiden in aanmerking komen voor het bedrag bedoeld in het
      eerste lid ontvangt elk de helft daarvan.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49n
  - number: 49n.3
    text: |-
      Het bedrag bedoeld in het eerste lid wordt niet toegekend, indien de verhuizing niet heeft plaatsgevonden binnen
      twee jaren nadat de opdracht om te verhuizen is gegeven.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49n
  - number: 49o
    text: |-
      Onze Minister kan de herplaatsingskandidaat een premie in het vooruitzicht stellen ter grootte van maximaal
      drie maandsalarissen indien aan hem binnen 18 maanden nadat hij is aangewezen als herplaatsingskandidaat op zijn
      aanvraag eervol ontslag wordt verleend.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49o
  - number: 49p.1
    text: |-
      De herplaatsingskandidaat aan wie eervol ontslag op zijn aanvraag is verleend wegens de aanvaarding van een functie
      kan, onverminderd het bepaalde in artikel 49*o*, een salarissuppletie worden toegekend indien het in de nieuwe
      functie genoten salaris lager is dan het salaris in de oorspronkelijke functie.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49p
  - number: 49p.2
    text: |-
      De suppletie als bedoeld in het eerste lid wordt toegekend gedurende maximaal 5 jaar en is ten hoogste gelijk aan
      het verschil tussen het in de oorspronkelijke functie genoten salaris en het salaris in de nieuwe functie.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49p
  - number: 49p.3
    text: |-
      Onder door Onze Minister te stellen voorwaarden kan het recht op suppletie op aanvraag van de
      herplaatsingskandidaat worden afgekocht.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49p
  - number: 49q
    text: |-
      Onze Minister kan de [artikelen 49j, tweede lid][ref1], [49k][ref2], [49n][ref3] en [49p][ref4] toepassen op de
      ambtenaar wiens functie binnen afzienbare tijd wordt opgeheven of die als overtollig zal worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49j
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel49k
      [ref3]: https://wetten.overheid.nl/BWBR0001950#Artikel49n
      [ref4]: https://wetten.overheid.nl/BWBR0001950#Artikel49p
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel49q
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49j
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 49k
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0001950
        artikel: 49n
        hoofdstuk: VII
      - id: ref4
        bwb_id: BWBR0001950
        artikel: 49p
        hoofdstuk: VII
  - number: '50.1'
    text: |-
      De ambtenaar is gehouden de plichten uit zijn functie voortvloeiende nauwgezet en ijverig te vervullen en zich te
      gedragen, zoals een goed ambtenaar betaamt.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel50
  - number: '50.2'
    text: |-
      Het is de ambtenaar verboden in dienst uniformkledingstukken te dragen, tenzij deze van regeringswege zijn
      verstrekt of voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel50
  - number: '50.3'
    text: |-
      Het is de ambtenaar verboden bij gekleed gaan in uniform insignes of andere onderscheidingstekens te dragen, tenzij
      deze van regeringswege zijn verstrekt of voorgeschreven of tot het dragen daarvan door Onze Minister-President
      vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel50
  - number: '51.1'
    text: De ambtenaar is verplicht een eed of een belofte af te leggen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel51
  - number: '51.2'
    text: Bij ministeriële regeling worden regels gesteld inzake het afleggen door de ambtenaar van de eed of de belofte.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel51
  - number: '51.3'
    text: |-
      Bij regeling van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties wordt het formulier vastgesteld dat
      wordt gebruikt voor het afleggen door de ambtenaar van de eed of de belofte.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel51
  - number: '52'
    text: |-
      Ter zake van niet-naleving van bepalingen, welke redelijkerwijs niet kunnen worden geacht den ambtenaar bekend te
      zijn, worden hem geen voordeelen onthouden of nadeelen toegebracht.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel52
  - number: '54'
    text: |-
      Indien de ambtenaar verhinderd is zijn dienst te verrichten, is hij verplicht daarvan, onder opgave van redenen,
      zoo tijdig mogelijk mededeeling te doen, ten einde vertraging of hinder in den dienst zooveel doenlijk te
      voorkomen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel54
  - number: '55.1'
    text: |-
      De ambtenaar kan worden verplicht te gaan wonen of te blijven wonen in of nabij de gemeente die hem als standplaats
      is aangewezen of waartoe zijn standplaats behoort, indien dit naar het oordeel van het bevoegd gezag noodzakelijk
      is in verband met de goede vervulling van zijn functie.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel55
  - number: '55.2'
    text: |-
      De ambtenaar aan wie de verplichting is opgelegd in of nabij de in het eerste lid bedoelde gemeente te gaan wonen,
      is gehouden zo spoedig mogelijk, maar uiterlijk twee jaar nadat die verplichting is opgelegd, daaraan gevolg te
      geven.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel55
  - number: '56.1'
    text: |-
      De ambtenaar is verplicht, indien hem eene ambts- of dienstwoning ter bewoning is aangewezen, deze te betrekken en
      zich ter zake van de bewoning en het gebruik te gedragen naar de voorschriften, die daaromtrent zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel56
  - number: '56.2'
    text: |-
      Hij draagt de onderhoudskosten, welke volgens de wet en het plaatselijk gebruik gemeenlijk voor rekening van den
      huurder zijn, tenzij door het bevoegd gezag ter zake eene afwijkende regeling is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel56
  - number: '57.1'
    text: De ambtenaar kan op zijn aanvraag een andere functie worden opgedragen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel57
  - number: '57.2'
    text: |-
      Wanneer het belang van de dienst zulks vordert, is de ambtenaar verplicht, een andere passende functie te
      aanvaarden:
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel57
  - number: 57.2.a
    text: |-
      overeenkomstig het bepaalde in artikel 49*h* indien het gaat om een verplaatsing in het kader van een
      reorganisatie, en;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel57
  - number: 57.2.b
    text: overeenkomstig het bepaalde in artikel 49*h*, eerste lid in de overige gevallen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel57
  - number: '57.3'
    text: |-
      Het opdragen van een andere functie aan de ambtenaar, bedoeld in artikel 4, vijfde lid, onder a, vindt plaats door
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties in overeenstemming met Onze Minister.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel57
  - number: '57.4'
    text: |-
      Het opdragen van een andere functie aan de ambtenaar, bedoeld in artikel 4, vijfde lid, onder b of c, vindt plaats
      door Onze Minister in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel57
  - number: 57b.1
    text: |-
      Indien de ambtenaar van 57 jaar of ouder op diens aanvraag een functie wordt opgedragen waaraan een salarisschaal
      is verbonden met een lager maximumsalaris dan dat van de reeds voor hem geldende salarisschaal, wordt op zijn
      salaris een inhouding toegepast.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel57b
  - number: 57b.2
    text: |-
      De inhouding is gelijk aan het verschil tussen het salaris dat de ambtenaar geniet en het salaris dat de ambtenaar
      zou genieten bij inpassing in de bij de nieuwe functie behorende salarisschaal op hetzelfde salarisnummer.
      Indien dit salarisnummer in laatstbedoelde salarisschaal niet voorkomt, geschiedt de inpassing op het naastlagere
      salarisnummer.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel57b
  - number: 57b.3
    text: |-
      Indien na 52 weken ziekte de doorbetaling van de bezoldiging op grond van [artikel 37, eerste lid][ref1], wordt
      teruggebracht tot 70%, wordt de inhouding opgeschort voor de duur van de ziekte.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel37
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel57b
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '37'
        hoofdstuk: VI
        paragraaf: '3'
  - number: 57b.4
    text: In bijzondere gevallen kan Onze Minister geheel of gedeeltelijk van de inhouding afzien.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel57b
  - number: '58.1'
    text: |-
      De ambtenaar kan worden verplicht tijdelijk andere ambtelijke werkzaamheden te verrichten dan die, welke hij
      gewoonlijk verricht, mits die werkzaamheden hem redelijkerwijs kunnen worden opgedragen. Hij kan echter niet
      worden verplicht werkzaamheden te verrichten in de plaats van stakers of uitgeslotenen in particuliere dienst,
      tenzij de opgedragen werkzaamheden worden verricht in dienst van het lichaam, waarbij hij werkzaam is, en voor de
      openbare dienst tijdens de staking of uitsluiting, dan wel als onmiddellijk gevolg daarvan redelijkerwijze dadelijk
      noodzakelijk zijn te achten.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel58
  - number: '58.2'
    text: |-
      Voorts kan aan de ambtenaar door Onze Minister de verplichting worden opgelegd in tijden van oorlog, oorlogsgevaar
      of andere buitengewone omstandigheden andere werkzaamheden te verrichten dan die, welke hij gewoonlijk verricht,
      mits die werkzaamheden strekken ter uitvoering van de taak, welke het ministerie waarbij hij werkzaam is of
      waaronder de dienst of instelling, waarbij hij werkzaam is, ressorteert, in die tijden heeft of zal krijgen, dan
      wel ertoe strekken een zo goed en ongestoord mogelijke uitvoering van die taak te verzekeren.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel58
  - number: '58.3'
    text: |-
      De ambtenaar aan wie de in het vorige lid bedoelde verplichting is opgelegd, is tevens te allen tijde verplicht
      lessen te volgen en deel te nemen aan oefeningen, die verband houden met de in dat lid bedoelde werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel58
  - number: '58.4'
    text: |-
      Bij de toepassing van het bepaalde in de vorige leden wordt voor zoveel mogelijk rekening gehouden met de
      persoonlijke omstandigheden van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel58
  - number: 58a.1
    text: |-
      De ambtenaar die door het bevoegd gezag is aangewezen als bedrijfshulpverlener als bedoeld in
      [artikel 15 van de Arbeidsomstandighedenwet 1998][ref1] en die naast zijn normale werkzaamheden de
      bedrijfshulpverleningstaken naar behoren heeft uitgevoerd, ontvangt een toelage.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel15
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '15'
  - number: 58a.2
    text: De toelage wordt bepaald volgens door Onze Minister vast te stellen regels en bedraagt tenminste € 158,82 per jaar.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel58a
  - number: 58a.3
    text: |-
      De vast te stellen regels bevatten in ieder geval de criteria die gehanteerd worden bij de toekenning van een
      bedrijfshulpverleningstoelage.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel58a
  - number: 58a.4
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan het in het tweede lid genoemde bedrag aanpassen
      overeenkomstig de algemene salarisontwikkeling van het rijkspersoneel.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel58a
  - number: '59.1'
    text: |-
      De ambtenaar kan in het belang van de Rijksdienst worden verplicht om scholing te volgen, voor zover dat
      redelijkerwijs van hem kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel59
  - number: '59.2'
    text: |-
      Aan de ambtenaar, die op grond van het eerste lid is verplicht om scholing te volgen, wordt een volledige
      vergoeding van de noodzakelijk te maken scholingskosten toegekend. Onze Minister kan in bijzondere gevallen
      afwijken van de vorige volzin.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel59
  - number: '59.3'
    text: |-
      Aan de ambtenaar, die op grond van het eerste lid is verplicht om scholing te volgen, kan scholingsverlof met
      behoud van bezoldiging worden verleend.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel59
  - number: '59.4'
    text: |-
      Indien de ambtenaar aan wie scholingsverlof als bedoeld in het derde lid is verleend gedurende dat verlof of
      gedurende een bepaalde periode van dat verlof tevens recht heeft op een financiële tegemoetkoming op basis van
      [hoofdstuk 7 van de Wet arbeid en zorg][ref1], wordt gedurende de periode waarin sprake is van samenloop een
      inhouding op de bezoldiging toegepast welke overeenkomt met het bedrag van bedoelde financiële tegemoetkoming.
      Indien de financiële tegemoetkoming hoger is dan hetgeen over de verlofuren wordt doorbetaald aan bezoldiging wordt
      de inhouding vastgesteld op het laatstbedoelde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '7'
  - number: '59.5'
    text: |-
      Indien aan de in [hoofdstuk 7 van de Wet arbeid en zorg][ref1] gestelde voorwaarden voor het toekennen van een
      financiële tegemoetkoming is voldaan maar geen financiële tegemoetkoming is toegekend omdat de ambtenaar geen
      aanvraag heeft ingediend, past het bevoegd gezag het vierde lid op overeenkomstige wijze toe. In dat geval wordt
      rekening gehouden met de financiële tegemoetkoming die aan de ambtenaar zou zijn toegekend indien hij wel een
      aanvraag zou hebben ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '7'
  - number: '59.6'
    text: |-
      De ambtenaar, die op grond van het eerste lid is verplicht om scholing te volgen, kan worden verplicht tot
      terugbetaling van de aan hem toegekende vergoeding van de scholingskosten:
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel59
  - number: 59.6.a
    text: |-
      bij onvoldoende resultaat in de scholing en bij tussentijds afbreken van de scholing, indien dit aan eigen schuld
      of toedoen van de ambtenaar is te wijten;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel59
  - number: 59.6.b
    text: |-
      bij ontslag tijdens het volgen van de scholing en in bijzondere gevallen bij ontslag binnen een termijn van
      maximaal drie jaren na het met voldoende resultaat afronden van de scholing, tenzij de ambtenaar binnen een maand
      na zijn ontslag elders in dienst treedt binnen de Rijksdienst of aansluitend aan zijn ontslag recht heeft op een
      uitkering op grond van werkloosheid, arbeidsongeschiktheid of ouderdomspensioen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel59
  - number: '59.7'
    text: |-
      De verplichting tot terugbetaling wordt niet opgelegd aan de ambtenaar die binnen 18 maanden nadat hij is
      aangewezen als herplaatsingskandidaat als bedoeld in de [artikelen 49d][ref1] en [49e][ref2], op zijn aanvraag
      eervol ontslag wordt verleend wegens de aanvaarding van een functie buiten de Rijksdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49d
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel49e
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49d
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 49e
        hoofdstuk: VII
  - number: '59.8'
    text: Bij ministeriële regeling kunnen ten aanzien van dit artikel nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel59
  - number: '60.1'
    text: |-
      Aan de ambtenaar die op eigen initiatief scholing gaat volgen, kan op zijn aanvraag een vergoeding van de
      noodzakelijk te maken scholingskosten worden toegekend of scholingsverlof met behoud van bezoldiging worden
      verleend, indien het belang van de Rijksdienst bij het volgen van de scholing is gebaat.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel60
  - number: '60.2'
    text: |-
      Indien de ambtenaar aan wie scholingsverlof als bedoeld in het eerste lid is verleend gedurende dat verlof of
      gedurende een bepaalde periode van dat verlof tevens recht heeft op een financiële tegemoetkoming op basis van
      [hoofdstuk 7 van de Wet arbeid en zorg][ref1], wordt gedurende de periode waarin sprake is van samenloop een
      inhouding op de bezoldiging toegepast welke overeenkomt met het bedrag van bedoelde financiële tegemoetkoming.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '7'
  - number: '60.3'
    text: |-
      Indien aan de in [hoofdstuk 7 van de Wet arbeid en zorg][ref1] gestelde voorwaarden voor het toekennen van een
      financiële tegemoetkoming is voldaan maar geen financiële tegemoetkoming is toegekend omdat de ambtenaar geen
      aanvraag heeft ingediend, past het bevoegd gezag het tweede lid op overeenkomstige wijze toe. In dat geval wordt
      rekening gehouden met de financiële tegemoetkoming die aan de ambtenaar zou zijn toegekend indien hij wel een
      aanvraag zou hebben ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '7'
  - number: '60.4'
    text: |-
      De ambtenaar, aan wie op grond van het eerste lid een vergoeding van scholingskosten is toegekend, kan worden
      verplicht tot terugbetaling van die vergoeding:
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel60
  - number: 60.4.a
    text: |-
      bij onvoldoende resultaat in de scholing en bij tussentijds afbreken van de scholing, indien dit aan eigen schuld
      of toedoen van de ambtenaar is te wijten;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel60
  - number: 60.4.b
    text: |-
      bij ontslag tijdens het volgen van de scholing en bij ontslag binnen een termijn van maximaal drie jaren na het
      met voldoende resultaat afronden van de scholing, tenzij de ambtenaar binnen een maand na zijn ontslag elders
      in dienst treedt binnen de Rijksdienst of aansluitend aan zijn ontslag recht heeft op een uitkering op grond van
      werkloosheid, arbeidsongeschiktheid of ouderdomspensioen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel60
  - number: '60.5'
    text: |-
      De verplichting tot terugbetaling wordt niet opgelegd aan de ambtenaar die binnen 18 maanden nadat hij is
      aangewezen als herplaatsingskandidaat als bedoeld in de artikelen [49d][ref1] en [49e][ref2], op zijn aanvraag
      eervol ontslag wordt verleend wegens de aanvaarding van een functie buiten de Rijksdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49d
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel49e
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49d
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 49e
        hoofdstuk: VII
  - number: '60.6'
    text: Bij ministeriële regeling kunnen ten aanzien van dit artikel nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel60
  - number: '61.1'
    text: |-
      De ambtenaar is verplicht aan Onze Minister, op een door Onze Minister te bepalen wijze, opgave te doen van de
      nevenwerkzaamheden die hij verricht of voornemens is te gaan verrichten, die de belangen van de dienst voor zover
      deze in verband staan met zijn functievervulling, kunnen raken.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel61
  - number: '61.2'
    text: Onze Minister voert een registratie op basis van de op grond van het eerste lid gedane opgaven.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel61
  - number: '61.3'
    text: |-
      De door de leden van de topmanagementgroep, bedoeld in [artikel 4, vijfde lid, onder a][ref1], juncto
      [artikel 7, vierde lid][ref2], en door de directeur-generaal Algemene Bestuursdienst gemelde nevenwerkzaamheden
      worden openbaar gemaakt met vermelding van eventueel door Onze Minister aan het verrichten van de
      nevenwerkzaamheden gestelde beperkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel7
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '4'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
  - number: '61.4'
    text: |-
      Het is de ambtenaar verboden nevenwerkzaamheden te verrichten waardoor de goede vervulling van zijn functie of de
      goede functionering van de openbare dienst, voor zover deze in verband staat met zijn functievervulling, niet in
      redelijkheid zou zijn verzekerd. Bij ministeriële regeling kunnen nadere regels omtrent dit verbod worden gesteld.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel61
  - number: 61a.1
    text: |-
      Onze Minister wijst de ambtenaren aan die werkzaamheden verrichten waaraan in het bijzonder het risico van
      financiële belangenverstrengeling of het risico van oneigenlijk gebruik van koersgevoelige informatie verbonden
      is. De aangewezen ambtenaar meldt financiële belangen, alsmede het bezit van en transacties met effecten die de
      belangen van de dienst voor zover deze in verband staan met zijn functievervulling kunnen raken, aan een daartoe
      aangewezen functionaris.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel61a
  - number: 61a.2
    text: Onze Minister voert een registratie van de op grond van het eerste lid gedane meldingen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel61a
  - number: 61a.3
    text: |-
      De ambtenaar verstrekt nadere informatie of bescheiden met betrekking tot de financiële belangen of het bezit van
      of de transacties met effecten, indien daarvoor naar het oordeel van Onze Minister of de aangewezen functionaris,
      bedoeld in het eerste lid, aanleiding bestaat op grond van de melding of na de melding gebleken feiten of
      omstandigheden.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel61a
  - number: 61a.4
    text: |-
      Het is de ambtenaar verboden financiële belangen te hebben, effecten te bezitten of effectentransacties te
      verrichten waardoor de goede vervulling van zijn functie of het goed functioneren van de openbare dienst, voorzover
      dit in verband staat met zijn functievervulling, niet in redelijkheid zou zijn verzekerd.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel61a
  - number: 61a.5
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de melding, bedoeld in het eerste lid, de
      registratie, bedoeld in het tweede lid, en het verbod, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel61a
  - number: '62.1'
    text: |-
      Het is den ambtenaar verboden, middellijk of onmiddellijk deel te nemen aan aannemingen en leveringen ten behoeve
      van openbare diensten, tenzij daarvoor toestemming is verleend.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel62
  - number: '62.2'
    text: |-
      Hij is verplicht zich te gedragen naar hetgeen voor hem is bepaald ten aanzien van het deelnemen, middellijk of
      onmiddellijk, aan aannemingen en leveringen ten behoeve van anderen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel62
  - number: 63a.1
    text: |-
      De ambtenaar, die een besturende, beherende dan wel toezichthoudende functie vervult in een naamloze vennootschap
      of ander rechtspersoonlijkheid bezittend lichaam, en voor de in die functie verrichte of te verrichten
      werkzaamheden, anders dan uit ’s Rijks kas, een vergoeding ontvangt, is verplicht die vergoeding in genoemde kas te
      storten, indien de benoeming in die functie
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel63a
  - number: 63a.1.a
    text: heeft plaats gehad door dan wel in overeenstemming met Onze Minister;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel63a
  - number: 63a.1.b
    text: |-
      is voortgevloeid uit een wettelijk voorschrift dan wel uit een overeenkomst, welke met instemming van Onze Minister
      of de Raad van Ministers is tot stand gekomen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel63a
  - number: 63a.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van de ambtenaar die werkzaamheden vervult die verband
      houden met het door hem beklede ambt en hem zijn opgedragen door Onze Minister, en die voor die werkzaamheden,
      anders dan uit ’s Rijks kas, een vergoeding ontvangt.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel63a
  - number: 63a.3
    text: De vorige leden vinden geen toepassing in de gevallen, waarin dit door Onze Minister-President is bepaald.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel63a
  - number: '64.1'
    text: |-
      Het is den ambtenaar in zijn ambt verboden, anders dan met goedvinden van het bevoegd gezag, vergoedingen,
      belooningen, giften of beloften van derden te vorderen, te verzoeken of aan te nemen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel64
  - number: '64.2'
    text: Het aannemen van steekpenningen is onvoorwaardelijk en ten strengste verboden.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel64
  - number: '65'
    text: |-
      De ambtenaar is verplicht de dienstkleding en de onderscheidingstekenen te dragen, voor zover dit door Onze
      Minister voorgeschreven is.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel65
  - number: '66.1'
    text: |-
      De ambtenaar kan worden verplicht tot geheele of gedeeltelijke vergoeding van de door den dienst geleden schade,
      voor zoover deze aan hem is te wijten.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel66
  - number: '66.2'
    text: |-
      Het bedrag van de schadevergoeding wordt niet vastgesteld, dan nadat de ambtenaar in de gelegenheid is gesteld zich
      schriftelijk of mondeling te verantwoorden.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel66
  - number: '67'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan regels stellen ten aanzien van telewerken. Deze
      regels hebben in ieder geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel67
  - number: 67.a
    text: de inrichting van de telewerkplek;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel67
  - number: 67.b
    text: de beschikbaarstelling door het bevoegd gezag van apparatuur;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel67
  - number: 67.c
    text: de wijze waarop de werkcontacten tussen de ambtenaar en zijn dienstonderdeel zullen plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel67
  - number: 67.d
    text: de wijze waarop wordt voorzien in een vergoeding van de door de ambtenaar gemaakte kosten;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel67
  - number: 67.e
    text: de wijze waarop het overleg met de vertegenwoordigers van het personeel wordt gevoerd.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel67
  - number: '68.1'
    text: De ambtenaar heeft recht op vergoeding wegens reis- en verblijfkosten ter zake van dienstreizen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel68
  - number: '68.2'
    text: Deze vergoeding wordt vastgesteld overeenkomstig de daarvoor gestelde regels.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel68
  - number: '69.1'
    text: |-
      Onze Minister kan naar billijkheid de ambtenaar schadeloos stellen, kosten vergoeden of overigens een geldelijke
      tegemoetkoming verlenen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel69
  - number: '69.2'
    text: |-
      De ambtenaar en de gewezen ambtenaar die een beroepsincident als bedoeld in [artikel 35, onderdeel f][ref1], hebben
      gehad, hebben recht op volledige vergoeding van de schade die zij ten gevolge van dat beroepsincident lijden. In
      overeenstemming met de ambtenaar kan deze vergoeding mede strekken ter vervanging van de uitkering, bedoeld in
      [artikel 38, zevende lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel38
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '35'
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '38'
        hoofdstuk: VI
        paragraaf: '3'
  - number: '69.3'
    text: |-
      Onze Minister is bevoegd omtrent schadeloosstelling, kostenvergoedingen en overige geldelijke tegemoetkomingen aan
      groepen van ambtenaren in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties regels
      te geven.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel69
  - number: '70.1'
    text: |-
      De ambtenaar, die in contact staat of kort geleden gestaan heeft met een persoon, die een ziekte heeft, waarvoor
      ingevolge het krachtens de [Infectieziektenwet][ref1] bepaalde een nominatieve aangifteplicht geldt, mag zijn
      dienst niet verrichten en heeft geen toegang tot dienstgebouwen, -lokalen en -terreinen dan met toestemming van het
      bevoegd gezag, dat deze toestemming slechts kan verlenen na positief medisch advies van de deskundige persoon of de
      arbodienst, bedoeld in [hoofdstuk VI][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009684
      [ref2]: https://wetten.overheid.nl/BWBR0001950#HoofdstukVI
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0009684
      - id: ref2
        bwb_id: BWBR0001950
        hoofdstuk: VI
  - number: '70.2'
    text: |-
      De ambtenaar, die verkeert in de in het vorige lid omschreven situatie, is verplicht daarvan ten spoedigste kennis
      te geven aan de deskundige persoon of de arbodienst, bedoeld in hoofdstuk VI. Hij is gehouden zich te gedragen naar
      de vanwege de deskundige persoon of de arbodienst, bedoeld in [hoofdstuk VI][ref1] gegeven aanwijzingen, waaronder
      die met betrekking tot het ondergaan van een arbeidsgezondheidskundig onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#HoofdstukVI
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0001950
        hoofdstuk: VI
  - number: '70.3'
    text: |-
      Gedurende de periode dat de ambtenaar ingevolge het bepaalde in dit artikel zijn dienst niet verricht, geniet hij
      zijn volle bezoldiging.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel70
  - number: '71.1'
    text: |-
      Met de ambtenaar wordt minimaal een keer per jaar door een functionaris, aangewezen door het bevoegd gezag,
      gesproken over:
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel71
  - number: 71.1.a
    text: |-
      de wijze waarop de ambtenaar de opgedragen werkzaamheden heeft uitgevoerd en de resultaten die daarbij zijn
      gehaald;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel71
  - number: 71.1.b
    text: de omstandigheden waaronder de opgedragen werkzaamheden zijn uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel71
  - number: 71.1.c
    text: welke werkzaamheden de ambtenaar zullen worden opgedragen en welke resultaten daarbij behaald moeten worden;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel71
  - number: 71.1.d
    text: de omstandigheden waaronder die op te dragen werkzaamheden zullen worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel71
  - number: 71.1.e
    text: de wijze waarop de persoonlijke ontwikkeling van de ambtenaar bevorderd kan worden.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel71
  - number: '71.2'
    text: |-
      Indien de ambtenaar gedurende vijf aaneengesloten jaren dezelfde functie heeft vervuld, wordt in het gesprek als
      bedoeld in het eerste lid specifieke aandacht besteed aan de continuering van de loopbaan.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel71
  - number: '71.3'
    text: Van het met de ambtenaar besprokene wordt een schriftelijk verslag gemaakt.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel71
  - number: '71.4'
    text: Over de in het eerste lid, onder c, d en e, genoemde onderwerpen worden met de ambtenaar afspraken gemaakt.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel71
  - number: '71.5'
    text: |-
      Onze Minister stelt vast aan welke eisen een gesprek als bedoeld in het eerste lid alsmede een verslag daarvan
      moet voldoen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel71
  - number: 71a.1
    text: Indien het bevoegd gezag dit wenselijk vindt of de ambtenaar dit aanvraagt, wordt een beoordeling opgemaakt.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel71a
  - number: 71a.2
    text: |-
      Een beoordeling wordt eerst vastgesteld nadat deze met de ambtenaar is besproken en hij zijn zienswijze kenbaar
      heeft kunnen maken.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel71a
  - number: 71a.3
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt nadere regels omtrent het opmaken en vaststellen
      van beoordelingen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel71a
  - number: 71b.1
    text: |-
      De werkgever stelt een loopbaanscan beschikbaar ten behoeve van de ambtenaar. Onder loopbaanscan wordt verstaan een
      instrument waarmee de loopbaanmogelijkheden van de ambtenaar in kaart kunnen worden gebracht.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel71b
  - number: 71b.2
    text: De ambtenaar heeft het recht eenmaal per drie jaar van de loopbaanscan gebruik te maken.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel71b
  - number: 71b.3
    text: |-
      De ambtenaar kan de uitkomsten van de loopbaanscan inbrengen in het jaarlijks gesprek, bedoeld in
      [artikel 71][ref1], ter ondersteuning van het maken van afspraken over de verdere loopbaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel71
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel71b
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '71'
        hoofdstuk: VIIa
  - number: '72'
    text: Verplichting tot zekerheidsstelling wordt den ambtenaar niet opgelegd.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel72
  - number: '73.1'
    text: |-
      De ambtenaar die namens een minister is belast met de in artikel 24, tweede en derde lid, van de Comptabiliteitswet
      2001 vermelde taken, is verplicht een tekort geheel of gedeeltelijk aan te zuiveren, wanneer hem ter zake van dat
      tekort een ernstig verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel73
  - number: '73.2'
    text: |-
      De ambtenaar die namens een minister is belast met het in artikel 25, tweede lid, van de Comptabiliteitswet 2001
      bedoelde beheer, is verplicht schade te vergoeden, wanneer hem ter zake van die schade een ernstig verwijt kan
      worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel73
  - number: '76'
    text: |-
      Aan de vrouwelijke ambtenaar, die een borstkind heeft en hiervan aan het hoofd van dienst heeft kennis gegeven,
      behoort gelegenheid te worden gegeven haar kind te zoogen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel76
  - number: '77.1'
    text: |-
      Aan den ambtenaar kan door het bevoegd gezag de toegang tot de dienstlokalen, dienstgebouwen of het werk, dan wel
      het verblijf aldaar, worden ontzegd.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel77
  - number: '77.2'
    text: |-
      Hij is verplicht zich te gedragen naar de maatregelen van orde, die ten aanzien van het verblijf aldaar zijn
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel77
  - number: '78'
    text: |-
      Het is den ambtenaar verboden gedurende den werktijd alcoholhoudende dranken te gebruiken, bij zich te hebben of in
      de dienstlokalen te bewaren.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel78
  - number: '79.1'
    text: |-
      De ambtenaar heeft aanspraak op een gratificatie bij ambtsjubileum volgens door Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties te stellen regels.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel79
  - number: '79.2'
    text: |-
      De ambtenaar die een diensttijd heeft van 10 jaar of meer en aan wie ontslag is verleend op grond van artikel, 96
      of 98, eerste lid onder *f* wordt een diensttijdgratificatie toegekend ter grootte van een in verhouding tot de
      doorgebrachte diensttijd evenredig gedeelte van een gratificatie bij ambtsjubileum als bedoeld in het eerste lid.
      Toekenning vindt niet plaats indien niet binnen een termijn van vijf jaar na de datum van ingang van het ontslag
      aanspraak op een gratificatie bij ambtsjubileum zou hebben bestaan.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel79
  - number: 79a
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel79a
  - number: 79a.a
    text: |-
      vermoeden van een misstand: een op redelijke gronden gebaseerd vermoeden van het zich voordoen in de organisatie
      waar de ambtenaar werkzaam is van een grove schending van wettelijke voorschriften of beleidsregels, een groot
      gevaar voor de gezondheid, de veiligheid of het milieu, dan wel een zeer onbehoorlijke wijze van functioneren, die
      het goed functioneren van de openbare dienst in gevaar kan brengen;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel79a
  - number: 79a.b
    text: 'het bevoegd gezag: de hoogste ambtelijke leidinggevende van de organisatie.'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel79a
  - number: 79b.1
    text: |-
      Onverminderd verplichtingen tot aangifte van strafbare feiten meldt de ambtenaar het vermoeden van een misstand aan
      de leidinggevende. Indien de ambtenaar melding aan de leidinggevende niet wenselijk acht, meldt de ambtenaar het
      vermoeden aan de naast hogere leidinggevende of aan een daartoe aangewezen vertrouwenspersoon.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel79b
  - number: 79b.2
    text: |-
      Indien zwaarwegende redenen in de weg staan aan de toepassing van de in het eerste lid bedoelde procedure, meldt de
      ambtenaar het vermoeden van een misstand rechtstreeks schriftelijk aan de Commissie integriteit overheid.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel79b
  - number: 79c.1
    text: |-
      De leidinggevende of de vertrouwenspersoon, bedoeld in [artikel 79b, eerste lid][ref1], draagt er zorg voor dat
      het bevoegd gezag onverwijld via de hiërarchische lijn schriftelijk op de hoogte wordt gesteld van het gemelde
      vermoeden van een misstand en van de datum waarop de melding is ontvangen. Indien de melding is gedaan bij de
      vertrouwenspersoon, vergewist deze zich ervan dat de ambtenaar heeft ingestemd met melding aan het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel79b
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel79c
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 79b
        hoofdstuk: VIIb
  - number: 79c.2
    text: 'Het bevoegd gezag:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel79c
  - number: 79c.2.a
    text: |-
      bewerkstelligt dat onverwijld een onderzoek wordt ingesteld naar aanleiding van de melding van een vermoeden van
      een misstand;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel79c
  - number: 79c.2.b
    text: |-
      bevestigt schriftelijk aan de ambtenaar die een vermoeden van een misstand heeft gemeld het moment van die melding
      en de inhoud ervan en
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel79c
  - number: 79c.2.c
    text: |-
      informeert de persoon of personen op wie het gemelde vermoeden van een misstand betrekking heeft, dat een melding
      is gedaan, tenzij dit het onderzoeksbelang kan schaden.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel79c
  - number: 79c.3
    text: |-
      Binnen acht weken na de melding wordt de ambtenaar die een vermoeden van een misstand heeft gemeld door het bevoegd
      gezag schriftelijk op de hoogte gesteld van het inhoudelijke standpunt van het bevoegd gezag omtrent het gemelde
      vermoeden.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel79c
  - number: 79c.4
    text: |-
      Indien het standpunt niet binnen acht weken kan worden gegeven, stelt het bevoegd gezag de ambtenaar hiervan in
      kennis en vermeldt het daarbij de termijn waarbinnen een standpunt tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel79c
  - number: 79c.5
    text: |-
      Nadat het bevoegd gezag het standpunt omtrent het gemelde vermoeden heeft bepaald, stelt het de persoon of personen
      op wie het vermoeden van een misstand betrekking had, schriftelijk op de hoogte van dat standpunt, alsmede van de
      melding, indien bedoelde persoon of personen daarover met toepassing van het tweede lid, onderdeel c, niet eerder
      was of waren geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel79c
  - number: 79d.1
    text: 'De ambtenaar kan het vermoeden van een misstand melden bij de Commissie integriteit overheid, indien:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel79d
  - number: 79d.1.a
    text: |-
      de ambtenaar het niet eens is met het standpunt van het bevoegd gezag, bedoeld in [artikel 79c, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel79c
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel79d
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 79c
        hoofdstuk: VIIb
  - number: 79d.1.b
    text: |-
      de ambtenaar niet binnen de in [artikel 79c, derde lid][ref1], gestelde termijn een standpunt of een bericht als
      bedoeld in [artikel 79c, vierde lid][ref2], heeft ontvangen, of


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel79c
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel79c
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel79d
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 79c
        hoofdstuk: VIIb
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 79c
        hoofdstuk: VIIb
  - number: 79d.1.c
    text: |-
      de ambtenaar niet binnen de in [artikel 79c, vierde lid][ref1], bedoelde termijn een standpunt heeft ontvangen dan
      wel die termijn onredelijk lang is.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel79c
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel79d
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 79c
        hoofdstuk: VIIb
  - number: 79d.2
    text: |-
      De ambtenaar meldt het vermoeden van een misstand bij de Commissie integriteit overheid, indien de situatie,
      bedoeld in [artikel 79b, tweede lid][ref1], zich voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel79b
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel79d
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 79b
        hoofdstuk: VIIb
  - number: 79d.3
    text: |-
      Binnen vier weken nadat de Commissie integriteit overheid advies heeft uitgebracht, deelt het bevoegd gezag
      de ambtenaar die het vermoeden van een misstand heeft gemeld, schriftelijk gemotiveerd mee of het advies wordt
      opgevolgd. Een afschrift van deze mededeling wordt gezonden aan de Commissie integriteit overheid.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel79d
  - number: 79d.4
    text: |-
      Het bevoegd gezag informeert de persoon of personen op wie het vermoeden van een misstand betrekking had over het
      advies, bedoeld in het derde lid, en het gevolg dat daaraan wordt gegeven, alsmede over de melding, indien bedoelde
      persoon of personen daarover niet eerder was of waren geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel79d
  - number: 79e
    text: |-
      De vertrouwenspersoon wordt op geen enkele wijze benadeeld als gevolg van het uitoefenen van zijn taken op basis
      van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel79e
  - number: '80.1'
    text: |-
      De ambtenaar, die de hem opgelegde verplichtingen niet nakomt of zich overigens aan plichtsverzuim schuldig maakt,
      kan deswege disciplinair worden gestrafd.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel80
  - number: '80.2'
    text: |-
      Plichtsverzuim omvat zowel het overtreden van enig voorschrift als het doen of nalaten van iets, hetwelk een goed
      ambtenaar in gelijke omstandigheden behoort na te laten of te doen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel80
  - number: '80.3'
    text: |-
      Tenzij door Ons of met Onze machtiging door Onze Minister anders is bepaald, wordt de straf opgelegd door het
      gezag, dat bevoegd is tot aanstelling in het door de ambtenaar beklede ambt. Indien deze bevoegdheid bij Ons
      berust, geschiedt de bestraffing, behalve voor zover betreft de straffen genoemd in artikel 81, eerste lid, onder
      *i* en *l*, door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel80
  - number: '81.1'
    text: 'De disciplinaire straffen, welke kunnen worden opgelegd, zijn:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel81
  - number: 81.1.a
    text: schriftelijke berisping;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel81
  - number: 81.1.b
    text: |-
      buitengewone dienst op andere dagen dan zondag en de voor de ambtenaar geldende kerkelijke feestdagen, zonder
      beloning of tegen een lagere dan de normale beloning en wel voor ten hoogste 6 uren met een maximum van 3 uren
      per dag;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel81
  - number: 81.1.c
    text: |-
      vermindering van het recht op jaarlijkse vakantie met ten hoogste 1/3 van het aantal uren, waarop in het
      desbetreffende kalenderjaar aanspraak bestaat;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel81
  - number: 81.1.d
    text: geldboete van ten hoogste € 22;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel81
  - number: 81.1.e
    text: gehele of gedeeltelijke inhouding van salaris tot een bedrag van ten hoogste het salaris over een halve maand;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel81
  - number: 81.1.f
    text: |-
      vaststelling van het salaris op een bedrag in de voor de ambtenaar geldende salarisschaal dat maximaal
      twee jaarlijkse periodieke salarisverhogingen minder bedraagt dan ingevolge de op hem van toepassing zijnde
      bezoldigingsregeling behoort te gelden, of indien voor het door de ambtenaar beklede ambt geen salarisschaal geldt,
      vermindering van het salaris met ten hoogste 5%, een en ander voor de tijd van niet langer dan twee jaren;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel81
  - number: 81.1.g
    text: het niet toekennen van periodieke salarisverhogingen gedurende ten hoogste vier jaren;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel81
  - number: 81.1.h
    text: |-
      uitsluiting voor de tijd van ten hoogste vier jaren van indeling in een salarisschaal waarvoor een hoger
      maximumsalaris geldt, indien zodanige indeling anders volgens de daarvoor geldende regeling zou hebben
      plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel81
  - number: 81.1.i
    text: |-
      indeling in een salarisschaal waarvoor een lager maximumsalaris geldt dan dat verbonden aan de salarisschaal
      welke ingevolge de van toepassing zijnde bezoldigingsregeling behoort te gelden, een en ander al dan niet voor een
      bepaalde tijd en met of zonder vermindering van bezoldiging;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel81
  - number: 81.1.j
    text: |-
      verplaatsing, al dan niet met verlening van een tegemoetkoming in mogelijke verplaatsingskosten tot ten hoogste
      het bedrag, dat in geval van verplaatsing in het belang van de dienst zou kunnen worden verleend krachtens het
      [Verplaatsingskostenbesluit 1989][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004630
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0004630
  - number: 81.1.k
    text: schorsing voor een bepaalde tijd met gehele of gedeeltelijke inhouding van bezoldiging;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel81
  - number: 81.1.l
    text: ontslag.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel81
  - number: '81.2'
    text: |-
      Indien een straf, als bedoeld in het eerste lid onder *g*, *h* of *i* is opgelegd, kan - zo het verdere gedrag van
      de ambtenaar naar het oordeel van het tot oplegging van de straf bevoegd gezag daartoe aanleiding heeft gegeven
        - zijn positie met ingang van een bepaald tijdstip geheel of ten dele in overeenstemming worden gebracht met de
      positie, zoals deze zonder de strafoplegging zou zijn geweest.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel81
  - number: '81.3'
    text: |-
      Bij het opleggen van een straf kan worden bepaald, dat zij niet ten uitvoer zal worden gelegd, indien de ambtenaar
      zich gedurende een vastgestelde termijn niet schuldig maakt aan soortgelijk plichtsverzuim, als waarvoor de
      bestraffing plaats vindt, noch aan enig ander ernstig plichtsverzuim en zich houdt aan bij het opleggen van de
      straf eventueel gestelde bijzondere voorwaarden.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel81
  - number: '82.1'
    text: |-
      Indien de ambtenaar verantwoording aflegt doet hij dit ten overstaan van het gezag dat tot de voorgenomen
      strafoplegging bevoegd is, of van een door dit gezag aangewezen autoriteit, tenzij bij koninklijk besluit anders
      wordt bepaald. Indien deze bevoegdheid bij Ons berust, geschiedt de verantwoording ten overstaan van Onze Minister
      of van een door deze aangewezen autoriteit. Het gezag, ten overstaan waarvan de verantwoording zal plaats vinden,
      bepaalt of deze mondeling of schriftelijk zal geschieden, met dien verstande dat bij schriftelijke verantwoording
      de ambtenaar op zijn verzoek gelegenheid wordt gegeven tot nadere mondelinge toelichting.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel82
  - number: '82.2'
    text: |-
      Van de mondelinge verantwoording en van een eventuele nadere mondelinge toelichting wordt aanstonds proces-verbaal
      opgemaakt, dat na voorlezing wordt getekend door hem, te wiens overstaan de verantwoording heeft plaats gevonden,
      en door de ambtenaar. Weigert de ambtenaar de ondertekening, dan wordt daarvan in het proces-verbaal, zo mogelijk
      met vermelding van de redenen, melding gemaakt. Een afschrift van het proces-verbaal wordt aan de ambtenaar
      uitgereikt.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel82
  - number: 82a
    text: |-
      De ambtenaar kan niet gestraft worden wegens overtreding van [artikel 125][ref1], dan nadat daarover advies is
      ingewonnen van de Adviescommissie grondrechten en functie-uitoefening ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125a
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel82a
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: 125a
  - number: '83'
    text: |-
      De ambtenaar dient van de ontvangst van een besluit inzake strafoplegging te doen blijken door onverwijlde
      terugzending van een door hem ondertekend en gedateerd ontvangstbewijs.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel83
  - number: '84'
    text: |-
      De straf, behalve die van schriftelijke berisping, wordt niet ten uitvoer gelegd, zolang zij niet onherroepelijk is
      geworden, tenzij bij de strafoplegging onmiddellijke tenuitvoerlegging is bevolen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel84
  - number: '90'
    text: |-
      De ambtenaar is van rechtswege in zijn ambt geschorst, wanneer hij krachtens wettelijke maatregel van zijn
      vrijheid is beroofd, tenzij de vrijheidsbeneming het gevolg is van een maatregel, anders dan op grond van de
      [Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref1], genomen in het belang van de volksgezondheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005700
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0005700
  - number: '91.1'
    text: 'Onverminderd het bepaalde in artikel 81, eerste lid onder *k*, kan de ambtenaar in zijn ambt worden geschorst:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel91
  - number: 91.1.a
    text: Indien een strafrechtelijke vervolging ter zake van misdrijf tegen hem is ingesteld;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel91
  - number: 91.1.b
    text: |-
      wanneer hem door het daartoe bevoegde gezag het voornemen tot bestraffing met onvoorwaardelijk ontslag is te kennen
      gegeven, dan wel hem die straf is opgelegd;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel91
  - number: 91.1.c
    text: wanneer, naar het oordeel van het bevoegde gezag, het belang van de dienst zulks vordert.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel91
  - number: '91.2'
    text: |-
      Schorsing geschiedt door het gezag, dat bevoegd is tot aanstelling in het ambt, waarin geschorst wordt, met dien
      verstande dat de schorsing van de ambtenaar, die is aangesteld overeenkomstig artikel 7, eerste lid, onder *c*
      geschiedt door Onze Minister. Berust die bevoegdheid bij Ons, dan geschiedt de schorsing door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel91
  - number: '92.1'
    text: |-
      Tijdens de schorsing kan de bezoldiging voor één derde gedeelte worden ingehouden; na verloop van zes weken kan
      een verdere inhouding, ook van het volle bedrag der bezoldiging, plaatsvinden. Geen inhouding vindt plaats in
      geval van schorsing in het belang van de dienst, bedoeld in het eerste lid onder *c* van het vorige artikel, van
      plaatsing in een krankzinnigengesticht of daarmede gelijk te stellen inrichting dan wel van politiebewaring of
      inverzekeringstelling als bedoeld in [artikel 57 van het Wetboek van Strafvordering][ref1], mits niet gevolgd door
      inbewaringstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel57
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '57'
  - number: '92.2'
    text: |-
      De ingehouden bezoldiging kan alsnog geheel of gedeeltelijk aan de ambtenaar worden uitbetaald, indien de schorsing
      niet wordt gevolgd door een onvoorwaardelijk ontslag bij wijze van straf of ontslag op grond van artikel 98, eerste
      lid onder *e.* Op de aldus uit te keren bezoldiging worden in mindering gebracht de inkomsten, welke de ambtenaar
      sedert de schorsing heeft genoten uit arbeid, die hij als gevolg van de schorsing heeft kunnen verrichten, tenzij
      zulks, naar het oordeel van het bevoegde gezag, onredelijk of onbillijk is.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel92
  - number: '92.3'
    text: Het niet ingehouden gedeelte van de bezoldiging van de geschorste ambtenaar kan aan anderen worden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel92
  - number: '92.4'
    text: |-
      In geval van schorsing tijdens ziekte van de ambtenaar wordt onder bezoldiging verstaan, hetgeen daaronder voor de
      toepassing van hoofdstuk VI wordt verstaan.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel92
  - number: '93'
    text: |-
      Ontslag wordt gegeven door het gezag dat bevoegd is tot aanstelling in het desbetreffende ambt. De voordracht
      voor het ontslag van de ambtenaar, bedoeld in artikel 4, vijfde lid, onder a, geschiedt door Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties. De voordracht voor het ontslag van de ambtenaar, bedoeld in artikel 4,
      vijfde lid, onder b of c, geschiedt door Onze Minister in overeenstemming met Onze Minister van Binnenlandse Zaken
      en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel93
  - number: '94.1'
    text: De ambtenaar wordt op zijn aanvraag ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel94
  - number: '94.2'
    text: |-
      Behoudens in het geval, bedoeld in artikel 34*e*, eerste lid, wordt dit ontslag verleend met ingang van een dag
      niet vroeger dan een maand of later dan drie maanden na de dag, waarop de aanvraag om ontslag is ingekomen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel94
  - number: '94.3'
    text: |-
      Van het bepaalde in het eerste lid kan worden afgeweken, indien een strafrechtelijke vervolging ter zake van
      misdrijf tegen de ambtenaar is ingesteld of indien wordt overwogen de disciplinaire straf van ontslag op te leggen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel94
  - number: '94.4'
    text: 'Van het bepaalde in het tweede lid kan worden afgeweken:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel94
  - number: 94.4.a
    text: indien wordt overwogen de ambtenaar een disciplinaire straf op te leggen;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel94
  - number: 94.4.b
    text: |-
      indien het belang van de dienst zulks vordert, met dien verstande, dat de termijn van drie maanden, vermeld in het
      tweede lid, tot ten hoogste zes maanden kan worden verlengd en dat bij de verlenging in redelijkheid met het belang
      van de ambtenaar rekening wordt gehouden;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel94
  - number: 94.4.c
    text: ingevolge een aanvraag van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel94
  - number: '94.5'
    text: Het ontslag op aanvraag van de ambtenaar wordt eervol verleend.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel94
  - number: 94a.1
    text: |-
      Onder de Centrale vut-overeenkomst overheids- en onderwijspersoneel, als bedoeld in dit artikel, wordt verstaan de
      overeenkomst die is aangegaan op grond van [artikel 2 van de Wet kaderregeling vut overheidspersoneel][ref1]. Onder
      het Pensioenreglement van de Stichting Pensioenfonds Abp, als bedoeld in dit artikel, wordt verstaan het reglement
      van die stichting dat is vastgesteld met inachtneming van de overeenkomst, bedoeld in artikel 4, eerste lid, van de
      Wet privatisering Abp.


      [ref1]: https://wetten.overheid.nl/BWBR0007792#Artikel2
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel94a
    references:
      - id: ref1
        bwb_id: BWBR0007792
        artikel: '2'
  - number: 94a.2
    text: |-
      Aan de ambtenaar die ontslag vraagt met het oog op een uitkering op grond van de Regeling flexibel pensioen en
      uittreden, bedoeld in artikel 3 van de Centrale vut-overeenkomst overheids- en onderwijspersoneel en artikel
      1.5 van het Pensioenreglement van de Stichting pensioenfonds Abp wordt ontslag verleend, indien het bestuur
      van de Stichting fonds vrijwillig vervroegd uittreden overheidspersoneel alsmede het bestuur van de Stichting
      Pensioenfonds Abp op grond van een desbetreffende aanvraag hebben vastgesteld dat na dat te verlenen ontslag recht
      bestaat op een uitkering op grond van die regeling. Het ontslag gaat niet eerder in dan met ingang van de dag
      waarop het recht op de in de vorige volzin bedoelde uitkering ontstaat.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel94a
  - number: 94a.3
    text: |-
      Op aanvraag van de ambtenaar kan het in het tweede lid bedoelde ontslag ook voor een gedeelte van de voor hem
      geldende arbeidsduur worden verleend, tenzij de belangen van de dienst zich hiertegen verzetten. Het gedeelte
      van dit ontslag bedraagt ten minste 10% van de omvang van de dienstverhouding. Ontslag voor een gedeelte van de
      arbeidsduur waaruit reeds eerder gedeeltelijk ontslag met het oog op de in het tweede lid bedoelde uitkering heeft
      plaatsgevonden bedraagt ten minste 10% van de oorspronkelijke arbeidsduur.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel94a
  - number: 94a.4
    text: Artikel 94 , tweede tot en met vijfde lid, is zoveel mogelijk van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel94a
  - number: '95.1'
    text: |-
      Aan de ambtenaar die is aangesteld in tijdelijke dienst wordt geacht eervol ontslag te zijn verleend zodra de duur
      van de aanstelling in tijdelijke dienst is verstreken, tenzij sprake is van een stilzwijgende voortzetting als
      bedoeld in artikel 6, vierde of vijfde lid.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel95
  - number: '95.2'
    text: |-
      Aan de ambtenaar die is aangesteld in tijdelijke dienst kan ontslag worden verleend, mits een opzegtermijn in acht
      wordt genomen van:
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel95
  - number: 95.2.a
    text: |-
      drie maanden, indien de ambtenaar ten tijde van de opzegging laatstelijke tenminste twaalf maanden onafgebroken in
      dienst is geweest;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel95
  - number: 95.2.b
    text: |-
      twee maanden, indien de ambtenaar ten tijde van de opzegging laatstelijke tenminste zes maanden doch korter dan
      twaalf maanden onafgebroken in dienst is geweest;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel95
  - number: 95.2.c
    text: |-
      één maand, indien de ambtenaar ten tijde van de opzegging laatstelijk korter dan zes maanden onafgebroken in dienst
      is geweest.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel95
  - number: '95.3'
    text: |-
      Opzegging als in het vorige lid bedoeld kan niet geschieden gedurende de zwangerschap van de vrouwelijke ambtenaar,
      noch gedurende het verlof bedoeld in artikel 33fb, vierde lid, noch – indien zij haar dienst heeft vervat –
      gedurende een periode van zes weken volgend op dat verlof. Het bevoegd gezag kan ter staving van de zwangerschap
      een verklaring van een arts of van een verloskundige verlangen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel95
  - number: '95.4'
    text: |-
      Opzegging als bedoeld in het tweede lid kan niet geschieden wegens het aanvragen of het opnemen van
      ouderschapsverlof.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel95
  - number: '95.5'
    text: |-
      Opzegging als bedoeld in het tweede lid kan niet geschieden wegens de omstandigheid dat de ambtenaar in of buiten
      rechte een beroep heeft gedaan op het beginsel van gelijke behandeling van mannen en vrouwen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel95
  - number: '95.6'
    text: |-
      Opzegging als bedoeld in het tweede lid kan niet plaatsvinden wegens het feit dat de ambtenaar door een
      centrale als bedoeld in artikel 105 of door een daarbij aangesloten vereniging is aangewezen om bestuurlijke
      of vertegenwoordigende aktiviteiten te ontplooien binnen zijn centrale of een daarbij aangesloten vereniging
      dan wel binnen de organisatie van de werkgever, die er toe strekken de doelstellingen van zijn centrale van
      overheidspersoneel en daarbij aangesloten verenigingen te ondersteunen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel95
  - number: '95.7'
    text: |-
      Opzegging als bedoeld in het tweede lid kan niet geschieden wegens de omstandigheid dat de ambtenaar is geplaatst
      op een kandidatenlijst als bedoeld in [artikel 9 van de Wet op de ondernemingsraden][ref1], noch wegens het
      lidmaatschap of het korter dan twee jaar geleden beëindigde lidmaatschap van de ambtenaar van de ondernemingsraad
      of van een commissie van die raad.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel9
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '9'
  - number: '95.8'
    text: |-
      Het ontslag kan, al dan niet op aanvraag van de ambtenaar, ingaan voor de afloop van de opzeggingstermijn.
      Indien dit niet op de aanvraag van de ambtenaar geschiedt, wordt hem over de tijd, welke aan de opzeggingstermijn
      ontbreekt, een bedrag uitbetaald gelijk aan de laatstgenoten bezoldiging, vermeerderd met de vakantie-uitkering,
      berekend op de voet van het bepaalde in het [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: '96.1'
    text: |-
      De ambtenaar kan in het kader van een reorganisatie eervol ontslag worden verleend indien het niet mogelijk is
      gebleken om hem te herplaatsen in een passende functie.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel96
  - number: '96.2'
    text: |-
      Aan de ambtenaar die in het kader van een reorganisatie is herplaatst kan alsnog het ontslag, bedoeld in het eerste
      lid worden verleend indien binnen een periode van uiterlijk één jaar te rekenen vanaf de datum waarop de functie
      is opgedragen, blijkt dat de betreffende functie niet passend is voor die ambtenaar en het niet mogelijk is om de
      ambtenaar binnen een redelijke termijn op een passende functie te plaatsen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel96
  - number: '96.3'
    text: |-
      Bij een ontslagverlening op grond van het eerste lid van dit artikel wordt een opzeggingstermijn van drie maanden
      in acht genomen. Bij een ontslagverlening op grond van het tweede lid van dit artikel geldt geen opzeggingstermijn.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel96
  - number: 96a.1
    text: |-
      Aan de ambtenaar kan eervol ontslag worden verleend indien van hem in redelijkheid niet kan worden verlangd, dat
      hij zich zal voegen in zijn verplaatsing over een aanmerkelijke afstand tengevolge van een verplaatsing van zijn
      functie.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel96a
  - number: 96a.2
    text: |-
      Aan de ambtenaar kan binnen een periode van uiterlijk één jaar nadat hij is verplaatst over een aanmerkelijke
      afstand, alsnog het ontslag, bedoeld in het eerste lid worden verleend indien van hem in redelijkheid niet kan
      worden verlangd dat hij zich zal blijven voegen in zijn verplaatsing over een aanmerkelijke afstand tengevolge van
      een verplaatsing van zijn functie.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel96a
  - number: 96a.3
    text: De artikelen 49*h* tot en met 49*l*, 49*o* en 49*p* zijn op de ambtenaar van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel96a
  - number: 96b.1
    text: |-
      Aan de ambtenaar die in verband met de aanvaarding van een functie in een publiekrechtelijk college, waarin hij
      is benoemd of verkozen, tijdelijk is ontheven van de waarneming van zijn ambt, wordt, indien hij ophoudt zodanige
      functie te bekleden en hij naar het oordeel van het bevoegd gezag niet in actieve dienst kan worden hersteld,
      eervol ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel96b
  - number: 96b.2
    text: |-
      Tenzij artikel 34*e*, eerste lid, van toepassing is, wordt eervol ontslag eveneens verleend aan de ambtenaar, die
      na afloop van het verlof, verleend met toepassing van artikel 34, uitgezonderd het vierde en vijfde lid, naar het
      oordeel van het bevoegd gezag niet in actieve dienst kan worden hersteld.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel96b
  - number: 96b.3
    text: |-
      Het eerste lid vindt eveneens toepassing voor de ambtenaar die ophoudt de functie te bekleden, bedoeld in artikel
      16, derde lid.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel96b
  - number: 96c
    text: |-
      Aan de ambtenaar die een benoeming tot minister of staatssecretaris aanvaardt wordt, met ingang van de dag van het
      aanvaarden van deze betrekking, eervol ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel96c
  - number: '97.1'
    text: |-
      Bij besluit van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties wordt een in categorie A en B
      onderverdeelde lijst met functies vastgesteld, die uit hoofde van de aard van de aan die functies verbonden
      werkzaamheden als substantieel bezwarend worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel97
  - number: '97.2'
    text: |-
      De ambtenaar, belast met een functie die is ingedeeld in categorie A van de in het eerste lid bedoelde lijst, wordt
      eervol ontslag verleend op de eerste dag van de maand volgende op die waarin hij de leeftijd van 60 jaar heeft
      bereikt.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel97
  - number: '97.3'
    text: |-
      De ambtenaar, belast met een functie die is ingedeeld in categorie B van de in het eerste lid bedoelde lijst, wordt
      eervol ontslag verleend op de eerste dag van de maand volgende op die waarin hij de leeftijd van 55 jaar heeft
      bereikt.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel97
  - number: '97.4'
    text: |-
      Het bevoegd gezag kan van het verlenen van het ontslag, bedoeld in het tweede en het derde lid, voor de duur van
      telkens ten hoogste één jaar afzien, indien het dienstbelang zich daartegen niet verzet, de ambtenaar zulks heeft
      aangevraagd of daarmee instemt en hij blijkens de uitslag van een door de deskundige persoon of de arbodienst
      ingesteld arbeidsgezondheidskundig onderzoek, als bedoeld in [artikel 36a, eerste lid, onder f][ref1], lichamelijk
      en psychisch in staat kan worden geacht zijn functie te blijven vervullen.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel36a
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 36a
        hoofdstuk: VI
        paragraaf: '2'
  - number: '97.5'
    text: |-
      Indien niet meer wordt voldaan aan een of meer van de in het vierde lid genoemde voorwaarden, vindt eervol ontslag
      plaats.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel97
  - number: '97.6'
    text: |-
      Het ontslag, bedoeld in het vijfde lid, wordt verleend met ingang van een dag niet vroeger dan een maand of niet
      later dan drie maanden na de dag, waarop niet langer aan een of meer van de in het vierde lid gestelde voorwaarden
      wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel97
  - number: '97.7'
    text: |-
      De ambtenaar, aan wie op grond van het tweede, derde of vijfde lid ontslag is verleend, heeft recht op een
      uitkering overeenkomstig door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties te stellen regels.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel97
  - number: '97.8'
    text: |-
      Het ontslag op grond van het tweede, derde of vijfde lid wordt geacht een ontslag te zijn als bedoeld in artikel
      94a, tweede lid, indien ten aanzien van dat ontslag wordt voldaan aan de in dat artikel genoemde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel97
  - number: 97b.1
    text: |-
      Voor de ontslagverlening als bedoeld in [artikel 125][ref1], is overeenstemming vereist met Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties. Deze is gehouden het advies in te winnen van de Adviescommissie
      grondrechten en functie-uitoefening ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125e
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel97b
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: 125e
  - number: 97b.2
    text: |-
      Indien het voornemen tot ontslagverlening afkomstig is van Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties is overeenstemming vereist met Onze Minister-President.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel97b
  - number: '98.1'
    text: |-
      Anders dan op aanvraag van de ambtenaar, bij wijze van straf of ingevolge het bepaalde bij
      [artikel 7 van de Wet Incompatibiliteiten Staten-Generaal en Europees Parlement][ref1], de
      [artikelen 95][ref2], [96][ref3], [96a][ref4], [96b][ref5], [96c][ref6] en [97][ref7] van dit besluit en bij
      [artikel 125e, tweede lid, van de Ambtenarenwet][ref8], kan de ambtenaar worden ontslagen op grond van:


      [ref1]: https://wetten.overheid.nl/BWBR0006612#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel95
      [ref3]: https://wetten.overheid.nl/BWBR0001950#Artikel96
      [ref4]: https://wetten.overheid.nl/BWBR0001950#Artikel96a
      [ref5]: https://wetten.overheid.nl/BWBR0001950#Artikel96b
      [ref6]: https://wetten.overheid.nl/BWBR0001950#Artikel96c
      [ref7]: https://wetten.overheid.nl/BWBR0001950#Artikel97
      [ref8]: https://wetten.overheid.nl/BWBR0001947#Artikel125e
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0006612
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '95'
        hoofdstuk: X
      - id: ref3
        bwb_id: BWBR0001950
        artikel: '96'
        hoofdstuk: X
      - id: ref4
        bwb_id: BWBR0001950
        artikel: 96a
        hoofdstuk: X
      - id: ref5
        bwb_id: BWBR0001950
        artikel: 96b
        hoofdstuk: X
      - id: ref6
        bwb_id: BWBR0001950
        artikel: 96c
        hoofdstuk: X
      - id: ref7
        bwb_id: BWBR0001950
        artikel: '97'
        hoofdstuk: X
      - id: ref8
        bwb_id: BWBR0001947
        artikel: 125e
  - number: 98.1.a
    text: |-
      het verlies van een vereiste voor de benoembaarheid, door het bevoegde gezag gesteld bij een regeling aan de
      benoeming voorafgegaan, tenzij het vereiste alleen voor de aanvang van het ambt geldt;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel98
  - number: 98.1.b
    text: het aangaan van een graad van zwagerschap, die de benoembaarheid tot het ambt zou uitsluiten;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel98
  - number: 98.1.c
    text: onherroepelijk geworden rechterlijke uitspraak, waarbij de ambtenaar onder curatele is gesteld;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel98
  - number: 98.1.d
    text: het ondergaan van lijfsdwang wegens schulden krachtens onherroepelijk geworden rechterlijke uitspraak;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel98
  - number: 98.1.e
    text: onherroepelijk geworden veroordeling tot vrijheidsstraf wegens misdrijf;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel98
  - number: 98.1.f
    text: ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel98
  - number: 98.1.g
    text: onbekwaamheid of ongeschiktheid voor het door hem beklede ambt, anders dan op grond van ziels- of lichaamsgebreken;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel98
  - number: 98.1.h
    text: het bereiken van de pensioengerechtigde leeftijd;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel98
  - number: 98.1.i
    text: |-
      het bij of in verband met indiensttreding en/of keuring verstrekken van onjuiste of onvolledige inlichtingen,
      zonder welke handelwijze niet tot indienstneming of goedkeuring zou zijn overgegaan, tenzij de ambtenaar
      aannemelijk maakt dat hij te goeder trouw heeft gehandeld.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel98
  - number: '98.2'
    text: |-
      Een ontslag op grond van het bepaalde in het eerste lid onder *a*, *b*, *f*, *g* en *h* wordt steeds eervol
      verleend.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel98
  - number: '98.3'
    text: 'Een ontslag als bedoeld in het eerste lid, onderdeel *f*, kan slechts plaatsvinden indien:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel98
  - number: 98.3.a
    text: |-
      er sprake is van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte gedurende een ononderbroken
      periode van twee jaar,
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel98
  - number: 98.3.b
    text: |-
      herstel van zijn ziekte niet binnen een periode van zes maanden na de in onderdeel *a* genoemde termijn van twee
      jaar te verwachten is, en
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel98
  - number: 98.3.c
    text: |-
      het bevoegd gezag van oordeel is dat duurzame reïntegratie in arbeid die aansluit bij de benutbare mogelijkheden
      van de ambtenaar, niet binnen een redelijke termijn te verwachten is.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel98
  - number: '98.4'
    text: 'De termijn van twee jaar, bedoeld in het derde lid, onderdeel a, wordt verlengd:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel98
  - number: 98.4.a
    text: |-
      met de duur van de vertraging indien het bevoegd gezag de aangifte, bedoeld in
      [artikel 38, eerste lid, van de Ziektewet][ref1] later doet dan op grond van [dat artikel van de Ziektewet][ref2]
      is voorgeschreven;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel38
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '38'
  - number: 98.4.b
    text: |-
      met de duur van de verlenging van de wachttijd, bedoeld in
      [artikel 19, eerste lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1], indien de wachttijd op grond
      van het zevende lid van dat artikel wordt verlengd;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
  - number: 98.4.c
    text: |-
      met de duur van het tijdvak, dat het Uitvoeringsinstituut werknemersverzekeringen op grond van
      [artikel 71a, negende lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1] heeft vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
  - number: '98.5'
    text: |-
      Voor de berekening van het tijdvak van twee jaar, bedoeld in het derde lid, onderdeel a, worden perioden van
      ongeschiktheid tot het verrichten van arbeid wegens ziekte tengevolge van zwangerschap voorafgaand aan het
      zwangerschapsverlof en perioden van ongeschiktheid tijdens het zwangerschaps- of bevallingsverlof, bedoeld in
      [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref1], niet in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '98.6'
    text: |-
      Perioden van ongeschiktheid tot het verrichten van zijn arbeid, anders dan bedoeld in het vijfde lid, worden
      samengeteld indien zij elkaar met een onderbreking van minder dan vier weken opvolgen, of indien zij direct
      voorafgaan aan en aansluiten op een periode waarin zwangerschaps- of bevallingsverlof wordt genoten overeenkomstig
      [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref1], tenzij de ongeschiktheid redelijkerwijs niet
      geacht kan worden voort te vloeien uit dezelfde oorzaak.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '98.7'
    text: |-
      Om te beoordelen of er sprake is van een situatie, bedoeld in het derde lid, onderdelen a en b, vraagt het
      bevoegd gezag het oordeel van een daartoe door het Uitvoeringsinstituut werknemersverzekeringen, die de
      [Wet arbeidsongeschiktheidsverzekering][ref1] uitvoert ten aanzien van de ambtenaar, aangewezen arts.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: '98.8'
    text: |-
      De in het zevende lid bedoelde arts betrekt bij zijn beoordeling een door het bevoegd gezag aangewezen arts en,
      indien de ambtenaar dit wenst, een door de ambtenaar aangewezen arts.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel98
  - number: '98.9'
    text: |-
      Het bevoegd gezag stelt de ambtenaar er schriftelijk van in kennis dat de procedure, bedoeld in het zevende lid,
      wordt ingesteld. Daarbij wijst het bevoegd gezag de ambtenaar op de mogelijkheid om een arts van zijn keuze te
      laten deelnemen aan de procedure.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel98
  - number: '98.10'
    text: |-
      De kennisgeving, bedoeld in het negende lid, geschiedt niet eerder dan nadat de ambtenaar gedurende een
      onafgebroken periode van 18 maanden ongeschikt is geweest tot het verrichten van zijn arbeid wegens ziekte. Het
      zesde lid is hierbij van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel98
  - number: '98.11'
    text: |-
      De in het zevende lid bedoelde arts stelt naar aanleiding van zijn bevindingen een rapport op. Hij zendt dit
      rapport aan het bevoegd gezag. Tevens zendt hij een afschrift van dit rapport aan de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel98
  - number: '98.12'
    text: |-
      Indien herplaatsing als bedoeld in [artikel 37a][ref1] plaatsvindt in een betrekking voor minder uren dan het
      aantal waarvoor de ambtenaar was aangesteld, heeft het ontslag uitsluitend betrekking op het meerdere aantal uren.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel37a
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 37a
        hoofdstuk: VI
        paragraaf: '3'
  - number: 98a
    text: |-
      Indien aan de ambtenaar gedurende de tijd, dat hij recht heeft op wachtgeld, daaronder mede begrepen
      herplaatsingswachtgeld, een uitkering krachtens de Uitkeringsregeling 1966 of een suppletie op grond van de
      Suppletieregeling gedeeltelijk arbeidsongeschikten sector Rijk , een voor hem passend geachte betrekking is
      aangeboden en die betrekking binnen een periode van uiterlijk één jaar, nadat hij haar is gaan vervullen, niet
      passend voor hem blijkt te zijn, kan hem binnen die periode op zijn aanvraag eervol ontslag uit die betrekking
      worden verleend, welk ontslag ten aanzien van zijn aanspraken op een wachtgeld of uitkering als evenbedoeld, wordt
      geacht niet door eigen toedoen te zijn verleend.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel98a
  - number: 98b.1
    text: |-
      Onverminderd het bepaalde in [artikel 98, derde lid, onderdeel a][ref1], kan aan de ambtenaar die ten gevolge
      van ziekte verhinderd is zijn arbeid te verrichten, ontslag worden verleend, indien hij zonder deugdelijke grond
      weigert:


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel98
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel98b
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '98'
        hoofdstuk: X
  - number: 98b.1.a
    text: |-
      gevolg te geven aan door het bevoegd gezag of een door het bevoegd gezag aangewezen deskundige gegeven
      redelijke voorschriften of mee te werken aan door het bevoegd gezag of een door het bevoegd gezag aangewezen
      deskundige getroffen maatregelen om hem in staat te stellen de eigen of andere passende arbeid, bedoeld in
      [artikel 35, onderdeel l][ref1], te verrichten, of


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel35
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel98b
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '35'
        hoofdstuk: VI
        paragraaf: '1'
  - number: 98b.1.b
    text: passende arbeid te verrichten waartoe het bevoegd gezag hem in de gelegenheid stelt, of
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel98b
  - number: 98b.1.c
    text: |-
      zijn medewerking te verlenen aan het opstellen, evalueren of bijstellen van een plan van aanpak als bedoeld in
      [artikel 71a, tweede lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel98b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
  - number: 98b.2
    text: |-
      Om te beoordelen of er sprake is van een situatie als bedoeld in het eerste lid, vraagt het bevoegd gezag een
      hierop betrekking hebbend advies van het Uitvoeringsinstituut werknemersverzekeringen en neemt dit mede in
      beschouwing.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel98b
  - number: '99.1'
    text: |-
      Aan de ambtenaar in vaste dienst kan ook op andere gronden dan die in artikel 98 zijn geregeld of waarnaar in dat
      artikel wordt verwezen, ontslag worden gegeven. Dat ontslag wordt eervol verleend.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel99
  - number: '99.2'
    text: |-
      In geval van ontslag ingevolge het eerste lid wordt door het tot ontslagverlening bevoegde gezag een
      voorziening getroffen waarbij de ambtenaar een uitkering verleend wordt, die, naar het oordeel van
      dat bevoegde gezag, met het oog op de omstandigheden redelijk is te achten. Deze uitkering zal ten
      minste gelijk zijn aan het voor de ambtenaar geldende totaal van uitkeringen berekend op basis van de
      [Werkloosheidswet][ref1] en het [Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Rijk][ref2],
      als ware als gevolg van het ontslag geen sprake van verwijtbare werkloosheid als bedoeld in
      [artikel 24 van de Werkloosheidswet][ref3]. Voor zover door het bevoegde gezag ten gunste van de
      ambtenaar niet anders is beslist, zijn op de uitkering voor het overige de [Werkloosheidswet][ref4] en het
      [Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Rijk][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0008114
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0004045
      [ref5]: https://wetten.overheid.nl/BWBR0008114
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0008114
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '24'
      - id: ref4
        bwb_id: BWBR0004045
      - id: ref5
        bwb_id: BWBR0008114
  - number: '99.3'
    text: |-
      Indien de ambtenaar terzake van zijn ontslag ingevolge het eerste lid recht heeft op een uitkering krachtens de
      [Werkloosheidswet][ref1] of het [Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Rijk][ref2],
      wordt de in het tweede lid bedoelde uitkering met die uitkering verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0008114
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0008114
  - number: 100a.1
    text: |-
      De ambtenaar aan wie op zijn aanvraag eervol ontslag wordt verleend in verband met de aanvaarding van een functie
      buiten de overheid, heeft op grond van zijn ontslag als ambtenaar aanspraak op een uitkering overeenkomstig het
      [Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Rijk][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008114
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel100a
    references:
      - id: ref1
        bwb_id: BWBR0008114
  - number: 100a.2
    text: |-
      Het bepaalde in het eerste lid geldt slechts indien de ambtenaar is aangewezen als herplaatsingskandidaat als
      bedoeld in de artikelen 49d en 49e en hij binnen twee jaar na zijn indiensttreding buiten de overheid buiten zijn
      schuld of toedoen wordt ontslagen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel100a
  - number: 100a.3
    text: |-
      Indien de ambtenaar terzake van zijn ontslag ingevolge het tweede lid recht heeft op een uitkering krachtens de
      [Werkloosheidswet][ref1] wordt de in het eerste lid bedoelde uitkering met die uitkering verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel100a
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '102.1'
    text: |-
      De bezoldiging van de ambtenaar wordt niet langer uitbetaald dan tot en met de dag van overlijden. Artikel 24, lid
      1 wordt voorts overeenkomstig toegepast.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel102
  - number: '102.2'
    text: |-
      Met inachtneming van het bepaalde in het vijfde lid wordt zo spoedig mogelijk na het overlijden aan de
      weduwe of weduwnaar, van wie de overleden ambtenaar niet duurzaam gescheiden leefde, een bedrag uitgekeerd
      gelijk aan de bezoldiging over een tijdvak van drie maanden. Als maatstaf bij de berekening van het in de
      vorige volzin bedoelde bedrag geldt, behoudens het hierna bepaalde, de bezoldiging, welke de ambtenaar op
      de dag van het overlijden genoot of, indien hij op die dag aanspraak maakt op een uitkering op grond van
      de [Ziektewet][ref1], de [Werkloosheidswet][ref2] of de [Wet op de arbeidsongeschiktheidsverzekering][ref3]
      dan wel een bovenwettelijke arbeidsongeschiktheidsuitkering, bedoeld in hoofdstuk VI, zou hebben genoten
      indien hij op die dag arbeidsgeschikt zou zijn geweest. De uitkering wordt vermeerderd met een bedrag gelijk
      aan drie maal dat van de vakantie-uitkering over een maand berekend op de voet van het bepaalde in het
      [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref4], naar de bezoldiging die de ambtenaar in de maand van
      het overlijden zou hebben genoten. Indien de ambtenaar in het genot was van een toelage als bedoeld in artikel 17,
      dan wel artikel 18*a* van eerdervermeld besluit, wordt het gedeelte van de in de eerste volzin bedoelde uitkering
      dat betrekking heeft op bovenbedoelde toelagen gesteld op het bedrag dat de overleden ambtenaar in de drie
      kalendermaanden voorafgaand aan de dag van het overlijden aan zodanige toelagen is toegekend. Bij ontstentenis van
      een weduwe of weduwnaar, van wie de overledene niet duurzaam gescheiden leefde, geschiedt de uitkering ten behoeve
      van de minderjarige kinderen. Onder kinderen in de zin van dit artikel worden mede verstaan natuurlijke kinderen en
      kinderen, waarover de overledene de pleegouderlijke zorg droeg. Onder pleegouderlijke zorg wordt verstaan de zorg
      voor het onderhoud en de opvoeding van het kind als was het een eigen kind, onafhankelijk van enige verplichting
      daartoe of van het genieten van een vergoeding daarvoor. Ontbreken ook zodanige kinderen dan geschiedt de uitkering
      aan degenen die geheel of grotendeels afhankelijk waren van de bezoldiging van de ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0002524
      - id: ref4
        bwb_id: BWBR0003630
  - number: '102.3'
    text: |-
      Indien de overledene geen betrekkingen, als bedoeld in het tweede lid, nalaat, kan het daarbedoelde bedrag door het
      bevoegde gezag geheel of ten dele worden uitgekeerd voor de betaling van de kosten van de laatste ziekte en van de
      lijkbezorging, indien de nalatenschap van de overledene voor de betaling van die kosten ontoereikend is.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel102
  - number: '102.4'
    text: |-
      Voor de toepassing van dit artikel wordt, indien de ambtenaar op de dag van het overlijden wegens ziekte of ongeval
      verhinderd was zijn dienst te verrichten, onder bezoldiging verstaan hetgeen daaronder voor de toepassing van
      hoofdstuk VI wordt verstaan.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel102
  - number: '102.5'
    text: |-
      Indien de ambtenaar voor zijn overlijden te veel vakantie heeft genoten, vindt artikel 24, tweede lid,
      overeenkomstige toepassing. Het aldus verschuldigde bedrag en de reeds voor zijn overlijden aan de ambtenaar
      uitbetaalde bezoldiging over een na zijn overlijden gelegen tijdvak worden in mindering gebracht op het eventueel
      aan de nagelaten betrekkingen of rechtverkrijgenden van de ambtenaar verschuldigde bedrag wegens nog niet vergolden
      aanspraken van de ambtenaar, en bij gebreke hiervan of indien en voorzover dit bedrag daarvoor niet toereikend is,
      op de uitkering bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel102
  - number: '102.6'
    text: |-
      Op het bedrag, bedoeld in het tweede lid, wordt in mindering gebracht een uitkering op grond van
      [artikel 35 van de Ziektewet][ref1] of [artikel 53 van de Wet op de arbeidsongeschiktheidsverzekering][ref2]
      en naar aard en strekking daarmee overeenkomende uitkeringen, indien deze uitkeringen worden uitgekeerd. Alleen
      uitkeringen die voortvloeien uit de dienstbetrekking bij Onze Minister worden in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel53
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '53'
  - number: 102a
    text: |-
      Na het overlijden van de gewezen ambtenaar, die op de dag van zijn overlijden op grond van de artikelen 38 en 46
      in het genot was van doorbetaling van zijn laatstelijk genoten bezoldiging, wordt aan de in artikel 102 bedoelde
      personen en met overeenkomstige toepassing van dat artikel een bedrag uitgekeerd, gelijk aan de bezoldiging welke
      de gewezen ambtenaar op de dag van zijn overlijden genoot, berekend over een tijdvak van drie maanden. Op deze
      uitkering wordt in mindering gebracht het bedrag van de uitkering op grond van [artikel 35 Ziektewet][ref1],
      [artikel 53 van de Wet op de arbeidsongeschiktheidsverzekering][ref2], de [artikelen 6][ref3] en
      [11 van het Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Rijk][ref4] en naar aard en
      strekking daarmee overeenkomende uitkeringen, indien deze uitkeringen worden uitgekeerd. Alleen uitkeringen die
      voortvloeien uit de dienstbetrekking bij Onze Minister worden in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0008114#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0008114#Artikel11
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel102a
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '53'
      - id: ref3
        bwb_id: BWBR0008114
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0008114
        artikel: '11'
  - number: 102b.1
    text: |-
      Indien het overlijden van de ambtenaar is veroorzaakt door een dienstongeval of een door het verrichten van zijn
      arbeid opgelopen beroepsziekte, wordt aan degene die in verband met dit overlijden krachtens het Pensioenreglement
      van de Stichting Pensioenfonds ABP, een nabestaandenpensioen geniet, een uitkering toegekend ten bedrage van 18
      procent van het resultaat van de vermenigvuldiging van:
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel102b
  - number: 102b.1.a)
    text: |-
      indien het gaat om de partner, bedoeld in artikel 7.1 van het Pensioenreglement van de Stichting Pensioenfonds ABP,
      vijf zevende deel van 1,75 procent van de berekeningsgrondslag, bedoeld in artikel 6.2 van het Pensioenreglement
      van de Stichting Pensioenfonds ABP en de pensioengeldige diensttijd, bedoeld in hoofdstuk 5 van het
      Pensioenreglement van de Stichting Pensioenfonds ABP;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel102b
  - number: 102b.1.b)
    text: |-
      indien het gaat om de wees, bedoeld in artikel 7.7, eerste lid, aanhef, onderdeel a, van het Pensioenreglement van
      de Stichting Pensioenfonds ABP, een zevende deel van 1,75 procent van de berekeningsgrondslag, bedoeld in artikel
      6.2 van het Pensioenreglement van de Stichting Pensioenfonds ABP, en de pensioengeldige diensttijd, bedoeld in
      hoofdstuk 5 van het Pensioenreglement van de Stichting Pensioenfonds ABP;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel102b
  - number: 102b.1.c)
    text: |-
      indien het gaat om de wees, bedoeld in artikel 7.7, eerste lid, aanhef, onderdeel b, van het Pensioenreglement van
      de Stichting Pensioenfonds ABP, twee zevende deel van 1,75 procent van de berekeningsgrondslag, bedoeld in artikel
      6.2 van het Pensioenreglement van de Stichting Pensioenfonds ABP, en de pensioengeldige diensttijd, bedoeld in
      hoofdstuk 5 van het Pensioenreglement van de Stichting Pensioenfonds ABP.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel102b
  - number: 102b.2
    text: |-
      De uitkering eindigt met ingang van de dag waarop de overledene de leeftijd van 65 jaar zou hebben bereikt, dan
      wel, indien de partner, bedoeld in artikel 7.1 van het Pensioenreglement van de Stichting Pensioenfonds ABP, aan
      wie een pensioen werd toegekend, hertrouwt, met ingang van de maand volgende op de datum van het hertrouwen. Indien
      de weduwe of weduwnaar een samenlevingscontract sluit dan wel een geregistreerd partnerschap aangaat, eindigt de
      uitkering met ingang van de maand volgende op de datum van het sluiten van het samenlevingscontract dan wel van het
      aangaan van het geregistreerd partnerschap.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel102b
  - number: 102b.3
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de gewezen ambtenaar ten aanzien van wie artikel 38, derde lid,
      toepassing heeft gevonden, indien zijn overlijden het rechtstreeks gevolg is van de arbeidsongeschiktheid, bedoeld
      in dat artikel.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel102b
  - number: '103.1'
    text: |-
      Gedurende de maand van het overlijden en de volgende drie maanden behouden de achterblijvende gezinsleden het
      gebruik der ambts- of dienstwoning, waarin zij met de ambtenaar woonden. Daarvan kan echter worden afgeweken als
      Onze Minister dat in het belang van de dienst noodzakelijk acht. Alsdan wordt door Onze Minister naar billijkheid
      een schadevergoeding gegeven.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel103
  - number: '103.2'
    text: |-
      Bij vrijwillig verlaten van de ambts- of dienstwoning binnen de termijn, gedurende welke de woning nog mag worden
      gebruikt, kan Onze Minister te zijner beoordeling een vergoeding geven.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel103
  - number: '104'
    text: |-
      Indien door de ambtenaar voor het gebruik der ambts- of dienstwoning een vergoeding verschuldigd was, voldoen de
      achtergebleven gezinsleden deze over de tijd, gedurende welke zij het gebruik dier woning behouden.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel104
  - number: 104a.1
    text: |-
      Bij vermissing van de ambtenaar vinden, behoudens het bepaalde in het tweede lid, de bepalingen van de artikelen
      102 tot en met 104 overeenkomstige toepassing. De ambtenaar wordt daarbij geacht te zijn overleden op een door Onze
      Minister te bepalen dag.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel104a
  - number: 104a.2
    text: |-
      Het bepaalde in het tweede lid van artikel 102 vindt geen toepassing indien gegronde vermoedens bestaan, dat de
      vermissing het gevolg is van ongeoorloofde afwezigheid.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel104a
  - number: 104a.3
    text: |-
      Indien blijkt, dat de als vermist beschouwde ambtenaar in leven is, kan ter beoordeling van het bevoegde gezag
      de bezoldiging alsnog worden uitbetaald, tenzij gegronde vermoedens bestaan, dat de vermissing het gevolg was van
      ongeoorloofde afwezigheid.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel104a
  - number: 104a.4
    text: |-
      Indien uit hoofde van de vermissing van de ambtenaar pensioen of enige andere uitkering, voortvloeiende uit zijn
      ambtelijke rechtspositieregeling, is toegekend over het tijdvak, waarover naar het oordeel van het bevoegde gezag
      aanspraak bestaat op bezoldiging, wordt die bezoldiging verminderd met de over dat tijdvak aldus uitbetaalde
      bedragen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel104a
  - number: 104a.5
    text: |-
      De bezoldiging, waarop de ambtenaar ingevolge het derde en het vierde lid aanspraak heeft, kan aan anderen dan de
      ambtenaar worden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel104a
  - number: '105.1'
    text: |-
      Over aangelegenheden van algemeen belang voor de rechtstoestand van de ambtenaren in de zin van dit besluit met
      inbegrip van de algemene regels volgens welke het personeelsbeleid zal worden gevoerd, wordt niet beslist dan nadat
      daarover door of namens Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties overleg is gepleegd met de
      Sectorcommissie overleg rijkspersoneel.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel105
  - number: '105.2'
    text: 'De Sectorcommissie bestaat uit vertegenwoordigers van:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel105
  - number: 105.2.a
    text: de Algemene Centrale van Overheidspersoneel;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel105
  - number: 105.2.b
    text: de Christelijke Centrale van Overheids- en Onderwijspersoneel;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel105
  - number: 105.2.c
    text: het Ambtenarencentrum;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel105
  - number: 105.2.d
    text: de Centrale van Middelbare en Hogere Functionarissen bij Overheid en Onderwijs, Bedrijven en Instellingen;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel105
  - number: 105.2.e
    text: |-
      andere door Ons tot het overleg toegelaten centrales van verenigingen van ambtenaren, welke onder meer gelet op het
      aantal ambtenaren, dat zij vertegenwoordigen, eveneens als representatief kunnen worden aangemerkt en tegen wier
      toelating het algemeen belang zich niet verzet.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel105
  - number: '105.3'
    text: |-
      Indien een voorstel, waarover overleg dient plaats te vinden, strekt tot invoering of wijziging van een regeling
      met rechten of verplichtingen van individuele ambtenaren wordt dit voorstel slechts ten uitvoer gebracht, indien
      daarover overeenstemming bestaat met de Sectorcommissie. Het standpunt van de Sectorcommissie wordt bepaald bij
      meerderheid van stemmen. Elke centrale brengt één stem uit. Indien de stemmen binnen de Sectorcommissie staken,
      beslist Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties of het voorstel ten uitvoer wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel105
  - number: '105.4'
    text: |-
      In de Sectorcommissie wordt geen overleg gevoerd over voorstellen die betrekking hebben op het gehele
      overheidspersoneel.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel105
  - number: '105.5'
    text: |-
      Indien een voorstel als bedoeld in het vierde lid, ziet op het van toepassing verklaren op overheidspersoneel
      van een wettelijke regeling die betrekking heeft op werknemers, die krachtens arbeidsovereenkomst als bedoeld
      in artikel 1637*a* van het Burgerlijk Wetboek werkzaam zijn, vindt in de Sectorcommissie overleg plaats over
      de gevolgen van een desbetreffend voorstel voor ambtenaren en de eventueel daarmee samenhangende wijzigingen
      in de voor hen geldende regelingen. Het overeenstemmingsvereiste, bedoeld in het derde lid, is daarbij niet
      van toepassing, mits het totaal van rechten en verplichtingen van ambtenaren over het geheel beoordeeld niet
      ongunstiger wordt.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel105
  - number: '105.6'
    text: |-
      Indien bij het overleg, bedoeld in het vijfde lid, een geschil ontstaat over de vraag of wordt voldaan aan
      de voorwaarde dat het totaal van rechten en verplichtingen van de ambtenaren over het geheel beoordeeld niet
      ongunstiger wordt, wordt dat geschil onderworpen aan arbitrage door de Advies- en Arbitragecommissie, genoemd in
      artikel 110*g*.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel105
  - number: '106.1'
    text: Elke centrale is bevoegd tot aanwijzing van twee leden en twee plaatsvervangende leden van de Sectorcommissie.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel106
  - number: '106.2'
    text: |-
      Wij behouden Ons voor een toelating tot het overleg krachtens artikel 105 te schorsen en een toelating tot het
      overleg krachtens het tweede lid van dat artikel, onder *e*, in te trekken, indien de centrale van verenigingen
      van ambtenaren naar Ons oordeel niet meer representatief is dan wel het algemeen belang zich tegen haar verdere
      toelating verzet.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel106
  - number: '106.3'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties is bevoegd een lid of plaatsvervangend lid van de
      Sectorcommissie van deelneming aan het overleg uit te sluiten indien naar het oordeel van Onze genoemde Minister
      het dienstbelang dit in verband met zijn werkzaamheden als Rijksambtenaar vordert. De uitsluiting geschiedt niet
      dan nadat het bestuur van de daarbij betrokken zijnde centrale van verenigingen van ambtenaren over het voornemen
      daartoe is gehoord, en het advies van de overige leden van de Sectorcommissie daarover is ingewonnen. In afwachting
      van de beslissing van Onze Minister neemt het betrokken lid of plaatsvervangend lid niet of niet meer deel aan
      het overleg. Na de uitsluiting wijst de desbetreffende centrale een andere vertegenwoordiger aan als lid of
      plaatsvervangend lid van de Sectorcommissie in de plaats van de uitgeslotene.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel106
  - number: '107.1'
    text: |-
      Het overleg staat onder leiding van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties. Hij is bevoegd de
      leiding van het overleg op te dragen aan de directeur-generaal Management en Personeelsbeleid van het ministerie
      van Binnenlandse Zaken en Koninkrijksrelaties, indien de aard van de te bespreken aangelegenheden dit toelaat.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel107
  - number: '107.2'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties wijst functionarissen aan die hem, dan wel de
      functionaris die namens hem het overleg voert, bij het overleg terzijde staan.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel107
  - number: '107.3'
    text: |-
      Het secretariaat van het overleg wordt gevoerd door een door Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties benoemde of aangewezen secretaris, die ten dienste staat van zowel de voorzitter en de in het
      tweede lid bedoeld ambtenaren als van de Sectorcommissie. De benoeming of aanwijzing van de secretaris geschiedt in
      overeenstemming met de Sectorcommissie.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel107
  - number: '107.4'
    text: |-
      Bij de behandeling van bepaalde aangelegenheden kan op uitnodiging of met toestemming van de voorzitter ook door
      anderen dan degenen, die daartoe ingevolge de vorige bepalingen van dit hoofdstuk bevoegd zijn, aan het overleg
      worden deelgenomen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel107
  - number: '107.5'
    text: |-
      De leden van de Sectorcommissie kunnen zich na overleg met de voorzitter ter vergadering voor de behandeling van
      een bepaald onderwerp door een deskundige doen bijstaan.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel107
  - number: 107a
    text: |-
      De centrales van verenigingen van ambtenaren, die van de in artikel 106, eerste lid, vermelde bevoegdheid hebben
      gebruik gemaakt, doen aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties mededeling van haar statuten
      en huishoudelijke reglementen en van de daarin aangebrachte wijzigingen, zomede van de statuten en van de daarin
      aangebrachte wijzigingen van de bij haar aangesloten verenigingen van ambtenaren. Zij stellen Onze genoemde
      Minister voorts jaarlijks in kennis van het totale ledental van de bij elk der centrales aangesloten verenigingen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel107a
  - number: '108.1'
    text: |-
      De in artikel 105 bedoelde aangelegenheden worden door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      aan de Sectorcommissie voorgelegd.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel108
  - number: '108.2'
    text: |-
      Ieder der tot het overleg toegelaten centrales van verenigingen van ambtenaren is bevoegd aan Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties bepaalde onderwerpen, behorende tot de in artikel 105 bedoelde, ter
      plaatsing op de agenda op te geven.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel108
  - number: 108a
    text: |-
      Een wijziging van het [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1], betrekking hebbende op een ambt
      dat is vermeld in bijlage A van dat besluit, behoort niet tot de in artikel 105 bedoelde aangelegenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel108a
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: 108a_bis.1
    text: |-
      Het overleg wordt gevoerd op plaats, dag en uur door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      te bepalen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel108a
  - number: 108a_bis.2
    text: De vergaderingen worden in de regel te 's-Gravenhage gehouden.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel108a
  - number: 108a_bis.3
    text: |-
      Indien de vertegenwoordigers van tenminste twee tot het overleg toegelaten centrales van verenigingen van
      ambtenaren Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, onder vermelding van hetgeen zij behandeld
      wensen te zien, verzoeken daartoe een vergadering uit te schrijven, vindt deze binnen 14 dagen plaats.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel108a
  - number: '109'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties verleent zijn bemiddeling om aan de Sectorcommissie een
      lokaliteit in een Rijksgebouw ter beschikking te stellen, indien deze Sectorcommissie daartoe een verzoek doet ten
      behoeve van een door haar te houden vergadering.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel109
  - number: '110.1'
    text: |-
      Indien het wenselijk blijkt over de in artikel 105 bedoelde aangelegenheden voorbereidende besprekingen te voeren
      of in het overleg genomen besluiten uit te werken, geschiedt deze voorbereiding of uitwerking door werkgroepen
      bestaande uit vertegenwoordigers van de Sectorcommissie en door Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties daartoe aangewezen functionarissen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110
  - number: '110.2'
    text: Het bepaalde in het vierde en vijfde lid van artikel 107 is daarbij van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110
  - number: 110a.1
    text: Het standpunt van de Sectorcommissie wordt bepaald bij eenvoudige meerderheid van stemmen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110a
  - number: 110a.2
    text: Elke centrale brengt één stem uit.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110a
  - number: 110b
    text: 'Voor de toepassing van het bepaalde in de artikelen 110*d* en volgende wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110b
  - number: 110b.a
    text: |-
      "deelnemers aan het overleg": de voorzitter en de tot het overleg toegelaten centrales van verenigingen van
      ambtenaren;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110b
  - number: 110b.b
    text: '"Advies- en Arbitragecommissie": de Advies- en Arbitragecommissie genoemd in artikel 110*g*.'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110b
  - number: 110c
    text: |-
      De artikelen 110*d* tot en met 110*h* zijn slechts van toepassing op geschillen inzake aangelegenheden als bedoeld
      in artikel 105 voorzover die aangelegenheden uitsluitend de rechtstoestand van ambtenaren met inbegrip van de
      algemene regels volgens welke het personeelsbeleid zal worden gevoerd, betreffen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110c
  - number: 110d
    text: |-
      Indien de voorzitter dan wel een of meer van de centrales, in het overleg tot het oordeel komen dat dit overleg
      niet tot een uitkomst zal leiden die de instemming van alle deelnemers aan dat overleg zal hebben, brengen zij
      dat oordeel binnen 3 dagen nadat zij daarvan in het overleg blijk hebben gegeven, schriftelijk ter kennis van de
      overige deelnemers aan het overleg.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110d
  - number: 110e.1
    text: |-
      Binnen vijf dagen na de kennisgeving bedoeld in het vorige artikel, schrijft de voorzitter een overlegvergadering
      uit. De vergadering moet worden gehouden binnen zeven dagen nadat deze is uitgeschreven.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110e
  - number: 110e.2
    text: |-
      Tenzij door de voorzitter en de Sectorcommissie wordt besloten het overleg voort te zetten dan wel te beëindigen
      wordt in de vergadering nagegaan of overeenstemming bestaat over de vraag wat het onderwerp en de inhoud van het
      geschil is en of een oplossing van dat geschil zal worden gezocht door middel van voortzetting van het overleg
      nadat het advies is ingewonnen van de Advies- en Arbitragecommissie, dan wel door middel van onderwerping van het
      geschil aan een arbitrale uitspraak van de Advies- en Arbitragecommissie.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110e
  - number: 110e.3
    text: Tot het inwinnen van advies is zowel de voorzitter als de Sectorcommissie bevoegd.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110e
  - number: 110e.4
    text: Voor onderwerping van het geschil aan arbitrage is overeenstemming vereist tussen alle deelnemers aan het overleg.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110e
  - number: 110f.1
    text: |-
      Binnen drie dagen na de vergadering bedoeld in het vorige artikel, wordt het verzoek om advies ter kennis gebracht
      van de voorzitter van de Advies- en Arbitragecommissie. Het verzoek wordt ondertekend door de deelnemers aan het
      overleg die zich voor inwinning van advies hebben uitgesproken en bevat tenminste het onderwerp en de inhoud van
      het geschil. Indien in de vergadering bedoeld in het vorige artikel geen overeenstemming is bereikt tussen alle
      deelnemers aan het overleg over de vraag wat het onderwerp en de inhoud van het geschil is, brengen de overige
      deelnemers aan het overleg hun visie op het onderwerp en de inhoud van het geschil eveneens binnen drie dagen na
      eerdergenoemde vergadering ter kennis van de voorzitter van de Advies- en Arbitragecommissie.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110f
  - number: 110f.2
    text: |-
      Het bepaalde in de eerste volzin van het vorige lid is van overeenkomstige toepassing ten aanzien van het
      onderwerpen van het geschil aan een arbitrale uitspraak. Het verzoek daartoe wordt ondertekend door alle deelnemers
      aan het overleg en dient tenminste te bevatten:
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110f
  - number: 110f.2.a
    text: het onderwerp en de inhoud van het geschil;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110f
  - number: 110f.2.b
    text: de standpunten van alle deelnemers aan het overleg omtrent onderwerp en inhoud van het geschil.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110f
  - number: 110g.1
    text: |-
      Er is een Advies- en Arbitragecommissie, die tot taak heeft te adviseren dan wel een bindende uitspraak te doen in
      de geschillen die haar ingevolge de voorgaande artikelen worden voorgelegd.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110g
  - number: 110g.2
    text: |-
      De Advies- en Arbitragecommissie is gevestigd te 's-Gravenhage. Zij bestaat uit vijf leden, onder wie de
      voorzitter, en vijf plaatsvervangende leden. Zij worden door Ons benoemd voor een tijdvak van zes jaar.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110g
  - number: 110g.3
    text: |-
      Wij benoemen de voorzitter en diens plaatsvervanger op gezamenlijke voordracht van Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties en de Sectorcommissie. Van de andere vier leden en hun plaatsvervangers benoemen wij:
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110g
  - number: 110g.3.a
    text: |-
      twee leden en hun plaatsvervangers op voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;
      alsmede
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110g
  - number: 110g.3.b
    text: twee leden en hun plaatsvervangers op voordracht van de Sectorcommissie.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110g
  - number: 110g.4
    text: 'Uitgesloten van het lidmaatschap en plaatsvervangend lidmaatschap zijn:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110g
  - number: 110g.4.a
    text: personen die lid dan wel plaatsvervangend lid zijn van de Sectorcommissie;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110g
  - number: 110g.4.b
    text: |-
      personen die bestuurslid zijn van, dan wel werkzaam zijn bij een centrale van verenigingen van ambtenaren als
      bedoeld in artikel 105 of een daarbij aangesloten vereniging;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110g
  - number: 110g.4.c
    text: |-
      personen die werkzaam zijn bij de departementen van algemeen bestuur en de daaronder ressorterende instellingen,
      diensten en bedrijven, wier onafhankelijkheid en onpartijdigheid op grond van hun dienstverband door de deelnemers
      aan het overleg onvoldoende wordt geacht.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110g
  - number: 110g.5
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties wijst in overeenstemming met de Sectorcommissie en
      met de voorzitter van de Advies- en Arbitragecommissie een secretaris aan, die de Advies- en Arbitragecommissie
      bijstaat.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110g
  - number: 110g.6
    text: |-
      Aan de leden en plaatsvervangende leden worden uit ’s Rijks kas vergoedingen voor reis- en verblijfkosten verleend
      volgens de regels welke voor de vergoeding voor reis- en verblijfkosten wegens reizen voor ’s Rijks dienst gelden.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110g
  - number: 110h.1
    text: |-
      De Advies- en Arbitragecommissie treedt in geval van advies op in een samenstelling van drie leden, onder wie de
      voorzitter, een van de twee leden bedoeld in het derde lid onder *a* van het vorige artikel en een van de twee
      leden bedoeld in het derde lid onder *b* van dat artikel. De overige twee leden treden te zamen met de voorzitter
      op in geval van arbitrage. Bij verhindering van een der leden treedt diens plaatsvervanger op.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110h
  - number: 110h.2
    text: |-
      Indien het verzoek om arbitrage naar het oordeel van de voorzitter een zelfde geschil betreft als waarover door
      de Advies- en Arbitragecommissie reeds advies is uitgebracht, treedt voor een lid die bij het uitbrengen van dat
      advies betrokken was, diens plaatsvervanger op.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110h
  - number: 110h.3
    text: |-
      De voorzitter draagt er zorg voor dat het advies of de uitspraak binnen vier weken, nadat de kennisgeving bedoeld
      in artikel 110*f*, is ontvangen, aan de deelnemers aan het overleg ter kennis wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110h
  - number: 110h.4
    text: De Advies- en Arbitragecommissie stelt nadere regels vast met betrekking tot haar werkwijze.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110h
  - number: 110i.1
    text: De Advies- en Arbitragecommissie besluit bij meerderheid van stemmen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110i
  - number: 110i.2
    text: 'Het advies of de uitspraak moet inhouden:'
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110i
  - number: 110i.2.a
    text: de namen van de deelnemers die het advies of de arbitrale uitspraak hebben aangevraagd;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110i
  - number: 110i.2.b
    text: een overzicht van de standpunten van alle deelnemers over het onderwerp en over de inhoud van het geschil;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110i
  - number: 110i.2.c
    text: het advies dan wel de beslissing en de redenen die daaraan ten grondslag liggen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110i
  - number: 110i.3
    text: |-
      Het advies of de uitspraak wordt gedagtekend en door ieder der optredende leden van de Advies- en
      Arbitragecommissie ondertekend.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110i
  - number: 110j
    text: Binnen twee weken na ontvangst van het advies wordt het overleg over het geschil voortgezet.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110j
  - number: 110k
    text: De uitspraak van de Advies- en Arbitragecommissie heeft bindende kracht.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110k
  - number: 110l.1
    text: |-
      Het standpunt van de Sectorcommissie over de haar voorgelegde dan wel op verzoek van haar zijde in het overleg
      besproken aangelegenheden wordt schriftelijk aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      bevestigd, waarbij desverlangd een samenvatting van de aan dit standpunt ten grondslag liggende argumenten wordt
      gegeven.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110l
  - number: 110l.2
    text: |-
      Indien in de Sectorcommissie een minderheidsstandpunt blijkt te bestaan, wordt daarvan desverlangd in het geschrift
      bedoeld in het vorige lid, melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel110l
  - number: '111'
    text: |-
      Indien over een aangelegenheid in afwijking van het standpunt van de Sectorcommissie wordt beslist, brengt Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties de redenen dier afwijking zo spoedig mogelijk ter kennis van
      de Sectorcommissie.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel111
  - number: '112'
    text: |-
      Van het in de vergaderingen van het overleg en de werkgroepen behandelde maakt de secretaris notulen. Bovendien
      wordt een verslag opgemaakt, bevattende een beknopte samenvatting van het verhandelde, voor zover dat voor
      openbaarmaking geschikt kan worden geacht. Na overleg met de Sectorcommissie onderscheidenlijk de door deze in
      de betrokken werkgroep aangewezen leden, kan de voorzitter ten aanzien van het in vorenbedoelde vergaderingen
      verhandelde, geheimhouding opleggen. De plicht tot geheimhouding geldt niet, indien en voor zover de leden van de
      Sectorcommissie dan wel de door haar in de betrokken werkgroep aangewezen leden in bespreking treden met de door
      hen vertegenwoordigde centrales of de daarbij aangesloten verenigingen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel112
  - number: '113.1'
    text: |-
      Voor zover Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties in overeenstemming met de Sectorcommissie
      overleg rijkspersoneel niet anders heeft bepaald, wordt over voorgenomen besluiten tot invoering of wijziging van
      regels met rechten of verplichtingen van individuele ambtenaren en over voorgenomen besluiten tot een belangrijke
      reorganisatie, niet door Onze Minister beslist dan nadat door hem overleg is gevoerd met de centrales van
      verenigingen van ambtenaren.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel113
  - number: '113.2'
    text: |-
      Het overleg heeft geen betrekking op aangelegenheden waarover overleg dient te worden gevoerd met de
      Sectorcommissie overleg rijkspersoneel.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel113
  - number: '113.3'
    text: |-
      Een voorgenomen besluit tot invoering of wijziging van regels met rechten of verplichtingen van individuele
      ambtenaren waarover overleg met de centrales moet worden gevoerd, wordt slechts ten uitvoer gebracht indien
      daarover overeenstemming bestaat met ten minste de helft van de tot het overleg toegelaten centrales.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel113
  - number: '113.4'
    text: |-
      Het overleg over voorgenomen besluiten tot een belangrijke reorganisatie heeft slechts betrekking op de bijzondere
      rechtspositionele en sociale gevolgen van het voorgenomen besluit voor de betrokken ambtenaren.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel113
  - number: '114.1'
    text: Onze Minister laat tot het overleg toe de tot de Sectorcommissie overleg rijkspersoneel toegelaten centrales.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel114
  - number: '114.2'
    text: |-
      Schorsing dan wel intrekking van een toelating van een centrale tot de Sectorcommissie overleg rijkspersoneel,
      heeft tot gevolg schorsing respectievelijk intrekking van de toelating tot het overleg.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel114
  - number: '114.3'
    text: |-
      Onze Minister kan een vertegenwoordiger van een centrale uitsluiten van deelneming aan het overleg indien naar het
      oordeel van Onze Minister het dienstbelang dit in verband met de werkzaamheden van betrokkene als Rijksambtenaar
      vordert. Voordat tot uitsluiting wordt besloten wordt het bestuur van de desbetreffende centrale in de gelegenheid
      gesteld zijn zienswijze naar voren te brengen. In afwachting van de beslissing van Onze Minister neemt betrokkene
      niet of niet meer deel aan het overleg.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel114
  - number: '115'
    text: |-
      In geval van een geschil omtrent een voorgenomen besluit tot invoering of wijziging van regels met rechten
      of verplichtingen van individuele ambtenaren waarover overleg met de centrales moet worden gevoerd, zijn de
      artikelen 110b en 110d tot en met 110k van overeenkomstige toepassing, met dien verstande dat de Advies- en
      Arbitragecommissie, genoemd in artikel 110g, voor de behandeling van het geschil wordt uitgebreid met twee
      bijzondere leden die worden benoemd door Onze Minister. Van deze leden wordt één lid benoemd op voordracht van de
      tot het overleg toegelaten centrales. Niet benoembaar tot bijzonder lid zijn:
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel115
  - number: 115.a
    text: |-
      personen die ingevolge artikel 110g, vierde lid, zijn uitgesloten van het lidmaatschap en het plaatsvervangend
      lidmaatschap;
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel115
  - number: 115.b
    text: |-
      personen die namens de centrales aan het overleg deelnemen, dan wel wier deelname aan het overleg nog niet langer
      dan twee jaar is beëindigd.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel115
  - number: '116'
    text: |-
      Onze Minister kan geheimhouding opleggen ten aanzien van hetgeen in het overleg is behandeld. De plicht tot
      geheimhouding geldt niet voor zover degenen die namens de centrales aan het overleg deelnemen in bespreking treden
      met de door hen vertegenwoordigde centrales of de daarbij aangesloten verenigingen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel116
  - number: '117'
    text: |-
      Onze Minister draagt er zorg voor dat de ambtenaar, die in het overleg optreedt of heeft opgetreden namens een
      centrale, en de ambtenaar, die lid is geweest van een bijzondere commissie, niet uit dien hoofde worden benadeeld
      in hun positie als ambtenaar.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel117
  - number: '118'
    text: |-
      De artikelen 113 tot en met 117 zijn van overeenkomstige toepassing op de Raad van State, de Algemene Rekenkamer
      en de Nationale ombudsman, met dien verstande dat voor Onze Minister telkens wordt gelezen respectievelijk de vice-
      president van de Raad van State, het College van de Algemene Rekenkamer en de Nationale ombudsman.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel118
  - number: '130.1'
    text: |-
      Ten aanzien van de ambtenaar en de gewezen ambtenaar van wie de eerste dag van ongeschiktheid tot het verrichten
      van zijn arbeid wegens ziekte is gelegen voor 1 januari 2004, blijven de [artikelen 21a][ref1], [57a][ref2] en
      [57b][ref3] en [hoofdstuk VI][ref4] van het Algemeen Rijksambtenarenreglement van toepassing zoals deze luidden
      op 30 november 2005, met dien verstande dat voor [artikel 40b][ref5] in genoemd [hoofdstuk VI][ref6] in de plaats
      treedt [artikel 40b][ref7] zoals dat thans luidt.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel21a
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel57a
      [ref3]: https://wetten.overheid.nl/BWBR0001950#Artikel57b
      [ref4]: https://wetten.overheid.nl/BWBR0001950#HoofdstukVI
      [ref5]: https://wetten.overheid.nl/BWBR0001950#Artikel40b
      [ref6]: https://wetten.overheid.nl/BWBR0001950#HoofdstukVI
