        bwb_id: BWBR0001950
        artikel: '69'
        hoofdstuk: VIIa
  - number: '131'
    text: |-
      Op personen, die op het tijdstip van inwerkingtreding van dit besluit in het genot zijn van een wachtgeld,
      toegekend krachtens het Koninklijk besluit van 24 Juli 1869 (*Staatsblad* n°. 142), zooals dat besluit laatstelijk
      is gewijzigd, blijven de bepalingen van dat besluit van toepassing.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel131
  - number: '132'
    text: |-
      Voor zover voor ambtenaren bij een dienstvak nadere regels ter uitwerking of aanvulling van de bepalingen van dit
      besluit worden vereist, worden die regels door Ons, of in overeenstemming met Ons door Onze Minister, vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel132
  - number: 132a
    text: |-
      De [Algemene Termijnenwet][ref1] is niet van toepassing op de termijnen in dit besluit gesteld met uitzondering
      van die, genoemd in de artikelen 10, tweede en derde lid, [artikel 36b, derde en vierde lid][ref2], alsmede in
      hoofdstuk XI.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel36b
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel132a
    references:
      - id: ref1
        bwb_id: BWBR0002448
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 36b
        hoofdstuk: VI
        paragraaf: '2'
  - number: 132b
    text: |-
      Van de bevoegdheid tot het stellen van regels met een sterk technisch karakter krachtens dit besluit, anders
      dan krachtens de artikelen 4a, 9 en 10, kunnen Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, Onze
      Minister van Financiën en Onze Minister mandaat verlenen.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel132b
  - number: '133'
    text: Dit besluit treedt in werking met ingang van 1 September 1931.
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel133
  - number: '134'
    text: Dit besluit kan worden aangehaald als "Algemeen Rijksambtenarenreglement".
    url: https://wetten.overheid.nl/BWBR0001950/2006-07-07#Artikel134
