  - number: '17'
    text: |-
      1 De hoogte van de inkomenssuppletie, bedoeld in [artikel 65d van de WAO][ref1], [artikel 67b van de WAZ][ref2] en
      de [artikelen 2:26][ref3] en [3:68 van de Wajong][ref4], bedraagt:

      a. gedurende het eerste jaar 100%,

      b. gedurende het tweede jaar 75%,

      c. gedurende het derde jaar 50% en

      d. gedurende het vierde jaar 25%

      van het verschil tussen het bedrag van de arbeidsongeschiktheidsuitkering die zou worden verkregen indien
      de resterende verdiencapaciteit per uur bezien zou worden verlaagd tot het feitelijk door betrokkene per uur
      verdiende inkomen en het bedrag van de feitelijke arbeidsongeschiktheidsuitkering, met dien verstande dat de
      inkomenssuppletie niet meer bedraagt dan 20% van zijn resterende verdiencapaciteit.

      2 Indien betrokkene in het bedrijf of beroep minder uren werkt dan waartoe hij bij de vaststelling van de mate
      van arbeidsongeschiktheid in staat wordt geacht, wordt het bedrag van de inkomenssuppletie vermenigvuldigd met een
      breuk waarvan de teller wordt gevormd door het aantal uren waarin in het bedrijf of beroep arbeid wordt verricht en
      de noemer door het aantal uren waarop de resterende verdiencapaciteit is gebaseerd.

      3 De inkomenssuppletie bedraagt tezamen met de arbeidsongeschiktheidsuitkering, het inkomen uit het bedrijf of
      beroep en, indien van toepassing,

      a. het loon,

      b. de loonsuppletie, bedoeld in [artikel 16][ref5],

      c. een uitkering op grond van de [Ziektewet][ref6] of een daarmee naar aard en strekking overeenkomende uitkering,

      d. een uitkering op grond van de [Werkloosheidswet][ref7] of een daarmee naar aard en strekking overeenkomende
      uitkering,

      e. een uitkering op grond van [hoofdstuk 3, afdeling 2, van de Wet arbeid en zorg][ref8], of

      f. een uitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref9],

      niet meer dan het voor betrokkene vastgestelde maatmaninkomen, bedoeld in
      [artikel 6 van het Schattingsbesluit arbeidsongeschiktheidswetten][ref10].


