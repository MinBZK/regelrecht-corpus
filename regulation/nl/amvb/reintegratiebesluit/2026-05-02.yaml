      2 Op de verlening van voorzieningen, bedoeld in het eerste lid, zijn [artikel 8, eerste lid][ref3], en
      [artikel 10][ref4] van overeenkomstige toepassing.

      3 Op de verlening van voorzieningen als bedoeld in
      [artikel 10h, tweede lid, onderdelen c en d, van de Participatiewet][ref5] is [artikel 10][ref6] van
      overeenkomstige toepassing.


