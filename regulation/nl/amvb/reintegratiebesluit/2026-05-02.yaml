  - number: '20'
    text: |-
      Indien ten aanzien van een werknemer als bedoeld in de [artikelen 29b][ref1] en [90 van de Ziektewet][ref2]
      wordt vastgesteld dat hij lijdt aan ziekte of gebreken, die maken dat hij binnen de in
      [artikel 29b, eerste en vierde lid, van die wet][ref3] bedoelde termijn van vijf jaren na aanvang van de
      dienstbetrekking respectievelijk na vaststelling van het recht op uitkering een aanzienlijk verhoogd risico heeft
      op ernstige gezondheidsklachten, wordt die termijn van vijf jaar voor afloop daarvan verlengd, indien op dat moment
      de ziekte of gebreken dan wel het verhoogde risico op ernstige gezondheidsklachten naar het oordeel van het UWV
      nog bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29b
