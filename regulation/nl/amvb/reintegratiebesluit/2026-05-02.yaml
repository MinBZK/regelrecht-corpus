  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 8 juli 2005, Directie Sociale
    verzekeringen, nr. SV/R&S/05/51579;

    Gelet op artikel 2.17, achtste lid, van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen,
    de artikelen 52d en 87 van de Ziektewet, de artikelen 34, tweede lid, 35, vierde lid, en 36, eerste lid, onderdeel
    a, en vierde lid, van de Wet werk en inkomen naar arbeidsvermogen, de artikelen 65c, vijfde lid, 65d, vierde lid,
    en 65e van de Wet op de arbeidsongeschiktheidsverzekering, de artikelen 59b, 59f, vijfde lid, en 59g, vierde lid,
    van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten en de artikelen 67a, vijfde lid, 67b, vierde lid, en
    67c van de Wet arbeidsongeschiktheidsverzekering zelfstandigen;

    De Raad van State gehoord (advies van 10 augustus 2005, No. W12.05.0322/IV);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid van 28 november 2005, Directie
    Sociale Verzekeringen, nr. SV/R&S /05/95731;

    Hebben goedgevonden en verstaan:
