articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. arbeidsongeschiktheidsuitkering: een arbeidsongeschiktheidsuitkering of inkomensvoorziening op grond van de
      [WAZ][ref1], de [Wajong][ref2] of de [WAO][ref3];

      b. WAO: [Wet op de arbeidsongeschiktheidsverzekering][ref4];

      c. Wajong: [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref5];

      d. WAZ: [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref6];

      e. Wet WIA: [Wet werk en inkomen naar arbeidsvermogen][ref7].


