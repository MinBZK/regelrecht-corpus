    text: |-
      [Artikel 2][ref1], zoals dat luidde voor de inwerkingtreding van het Besluit van 12 december 2012, tot wijziging
      van het Reïntegratiebesluit in verband met het uitsluiten van de verstrekking van hulpmiddelen gerelateerd aan
      stoornissen in de hoorfunctie (Stb. 656) blijft van toepassing op de verlening van een voorziening in de vorm van
      een uitwendig hulpmiddel gerelateerd aan stoornissen in de hoorfunctie, indien deze is aangevraagd voor de dag van
      inwerkingtreding van dat besluit.


