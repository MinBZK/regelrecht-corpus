  - number: '6'
    text: |-
      1 Onder winst als bedoeld in [artikel 2, onderdeel b][ref1], wordt verstaan de belastbare winst uit onderneming,
      bedoeld in [paragraaf 3.2.1 van de Wet inkomstenbelasting 2001][ref2], vermeerderd met de ondernemersaftrek,
      bedoeld in [paragraaf 3.2.4 van die wet][ref3], met dien verstande dat de bestanddelen van de winst, bedoeld in
      [artikel 3.78, derde lid, onderdelen a, b en c, van die wet][ref4], niet geacht worden te behoren tot die winst.

      2 Indien de berekening van de in het eerste lid bedoelde winst leidt tot een negatief bedrag, wordt die winst op
      nihil gesteld.

      3 Van de winst uit bedrijf en zelfstandig uitgeoefend beroep, zoals vastgesteld op grond van het eerste en tweede
      lid, wordt slechts een deel in aanmerking genomen. De laatste volzin van [artikel 5, derde lid][ref5], is voor het
      vaststellen van dit deel van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008086#Artikel2
