  - number: '7'
    text: |-
      1 Voor de toepassing van [artikel 10, eerste lid, van de wet][ref1] wordt onder inkomen in verband met arbeid in
      het bedrijfs- of beroepsleven verstaan:

      a. een loondervingsuitkering alsmede uitkeringen die naar aard en strekking daarmee overeenkomen, met uitzondering
      van de uitkeringen die op grond van [artikel 3, derde lid][ref2], en [artikel 4, vierde lid][ref3], als opbrengst
      van arbeid worden beschouwd;

      b. een basisbeurs en een aanvullende beurs op grond van de [Wet studiefinanciering 2000][ref4] alsmede een beurs,
      die naar aard en strekking daarmee overeenkomt;

      c. een bedrijfsbeëindigingsvergoeding van de door Onze Minister van Economische Zaken opgerichte Stichting
      ontwikkeling en sanering midden- en kleinbedrijf;

      d. een maandelijkse bedrijfsbeëindigingsvergoeding van de door Onze Minister van Landbouw, Natuurbeheer en Visserij
      opgerichte Stichting ontwikkelings- en saneringsfonds voor de Landbouw.

      e. een uitkering ingevolge de wetgeving van de Nederlandse Antillen, Aruba, een volkenrechtelijke organisatie of
      een andere Mogendheid, die naar aard en strekking overeenkomt met een uitkering als bedoeld in dit lid, voorzover
      niet al begrepen onder *a*, met uitzondering van een uitkering, die naar aard en strekking overeenkomt met
      een uitkering op grond van de [Algemene Kinderbijslagwet][ref5] of met zorg waarop aanspraak bestaat ingevolge
      een zorgverzekering als bedoeld in [artikel 1, onderdeel d, van de Zorgverzekeringswet][ref6] of op grond van
      [artikel 6 van de Algemene Wet Bijzondere Ziektekosten][ref7]; en

      f. het bedrag van de uitkering bedoeld in onderdeel *e*, waarop recht bestaat, maar die niet wordt uitbetaald,
      omdat onder de toepasselijke wetgeving gebruik is gemaakt van het daarin voorziene recht af te zien van het recht
      op die uitkering of de uitbetaling daarvan.

      2 In afwijking van het eerste lid, wordt niet als inkomen in verband met arbeid beschouwd:

      a. het bedrag waarmee de arbeidsongeschiktheidsuitkering is verhoogd met toepassing
      van [artikel 10 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref8],
      [artikel 9 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref9],
      [artikel 22 van de Wet op de arbeidsongeschiktheidsverzekering][ref10], [artikel 53][ref11] of
      [63 van de Werk en inkomen naar arbeidsvermogen][ref12], of een combinatie van deze artikelen;

      b. vakantie-uitkering, over de in het eerste lid lid genoemde inkomensbestanddelen;

      c. een vakantie-bon, verstrekt naast een loondervingsuitkering, voorzover niet begrepen onder b;

      d. een uitkering die naar aard en strekking overeenkomt met een loondervingsuitkering, toegekend aan een directeur-
      grootaandeelhouder, die niet als werknemer in de zin van de [Wet financiering sociale verzekeringen][ref13] wordt
      beschouwd.

      3 Voor zover over een inkomen, genoemd in het eerste lid, geen aanspraak op vakantieuitkering bestaat, wordt dit
      inkomen slechts voor een deel in aanmerking genomen. De laatste volzin van [artikel 5, derde lid][ref14] is voor
      het vaststellen van dit deel van overeenkomstige toepassing.

      4 Indien een uitkering als bedoeld in het eerste lid, gekort of geweigerd is op grond van een boete of maatregel,
      wordt voor de toepassing van dit besluit als inkomen beschouwd de uitkering zonder deze korting of weigering.


