  - number: '13'
    text: |-
      Indien de toepassing van [artikel 8, eerste lid][ref1], of [artikel 11][ref2] van dit besluit tot een kennelijk
      onredelijk resultaat leidt, bepaalt de Sociale verzekeringsbank het inkomen, of de wijze waarop een uitkering
      als bedoeld in [artikel 11][ref3] op een uitkering als bedoeld in [artikel 14][ref4], [artikel 22][ref5] of
      [artikel 26][ref6] in mindering wordt gebracht, op andere wijze.


