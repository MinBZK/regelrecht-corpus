  - number: '8'
    text: |-
      1 Het inkomen uit of in verband met arbeid uit het bedrijfs- of beroepsleven wordt vastgesteld op het tot een
      bedrag per maand herleide inkomen, bedoeld in de [artikelen 3 tot en met 7][ref1], dat de uitkeringsgerechtigde in
      de maand waarover het recht op uitkering wordt vastgesteld, verwerft.

      2 Voor de toepassing van het eerste lid wordt de maand gesteld op 21,75 dagen.

      3 Bij per maand wisselende inkomsten kan op basis van een geschat inkomen een gemiddeld inkomen per maand worden
      bepaald, waarna per periode van zes maanden een herberekening plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0008086#Artikel3
    url: https://wetten.overheid.nl/BWBR0008086/2008-04-01#Artikel8
