  - number: '10'
    text: |-
      Het bepaalde in dit besluit ten aanzien van de onderscheiden inkomensbestanddelen is van overeenkomstige toepassing
      op de overhevelingstoeslag, bedoeld in de Wet overhevelingstoeslag opslagpremies voorzover die inkomensbestanddelen
      met die overhevelingstoeslag zijn vermeerderd.
    url: https://wetten.overheid.nl/BWBR0008086/2008-04-01#Artikel10
  - number: '11'
    text: |-
      1 Een op grond van de wetgeving van de Nederlandse Antillen, Aruba, een volkenrechtelijke organisatie of een
      andere Mogendheid toegekende uitkering, waaronder mede begrepen een verhoging van een uitkering, die naar aard
      en strekking overeenkomt met een uitkering als bedoeld in [artikel 14][ref1], een uitkering als bedoeld in
      [artikel 22][ref2] of een uitkering als bedoeld in [artikel 26 van de wet][ref3] anders dan op grond van de
      vrijwillige verzekering, wordt op de uitkering, bedoeld in [artikel 14][ref4] respectievelijk op de uitkering
      bedoeld in [artikel 22][ref5] of op de uitkering bedoeld in [artikel 26][ref6] in mindering gebracht.

      2 Indien bij de vaststelling van de hoogte van een toegekende uitkering als bedoeld in het eerste lid, die naar
      aard en strekking overeenkomt met een uitkering als bedoeld in [artikel 14 van de wet][ref7], rekening wordt
      gehouden met tot het gezin van de nabestaande behorende kinderen, worden voor de toepassing van het eerste lid,
      de uitkeringen bedoeld in [artikel 14][ref8] en [artikel 22 van de wet][ref9] samengeteld en als één uitkering
      beschouwd.

      3 Indien een op grond van de wetgeving van de Nederlandse Antillen, Aruba, een volkenrechtelijke organisatie of een
      andere Mogendheid toegekende uitkering als bedoeld in het eerste en tweede lid gekort of geweigerd is op grond van
      een boete of maatregel, wordt voor de toepassing van het eerste en tweede lid als uitkering beschouwd, de uitkering
      zonder deze korting of weigering.

      4 Indien een uitkering waarop recht bestaat op grond van de wetgeving van de Nederlandse Antillen, Aruba, een
      volkenrechtelijke organisatie of een andere Mogendheid, niet wordt uitbetaald omdat onder de toepasselijke
      wetgeving gebruik is gemaakt van het daarin voorziene recht af te zien van het recht op die uitkering of
      de uitbetaling daarvan, wordt voor de toepassing van het eerste en tweede lid uitgegaan van het bedrag van
      de uitkering indien geen gebruik zou zijn gemaakt van het recht af te zien van het recht op uitkering of de
      uitbetaling daarvan.


