    text: |-
      Voor de toepassing van [artikel 10, eerste lid, van de wet][ref1] wordt onder inkomen uit arbeid in het bedrijfs-
      en beroepsleven verstaan:

      a. opbrengst van arbeid;

      b. winst uit bedrijf en zelfstandig uitgeoefend beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel10
    url: https://wetten.overheid.nl/BWBR0008086/2008-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '10'
  - number: '3'
    text: |-
      1 Onder opbrengst van arbeid als bedoeld in [artikel 2, onderdeel a][ref1], wordt, voorzover bedoelde arbeid door
      een werknemer in de zin van de [Wet financiering sociale verzekeringen][ref2] wordt verricht, verstaan het loon in
      de zin van die wet.

      2 In afwijking van het eerste lid wordt niet als opbrengst van arbeid beschouwd:

      a. een aanspraak om na verloop van tijd of onder een voorwaarde een of meer uitkeringen of verstrekkingen te
      ontvangen, voor zover deze niet wordt gedekt door stortingen van de werknemer;

      b. een loondervingsuitkering;

      c. vakantie-uitkering.

      3 In afwijking van het tweede lid, onderdeel *b*, worden voor zolang de dienstbetrekking voortduurt,
      uitkeringen op grond van de verplichte verzekering van de [Ziektewet][ref3], op grond van [hoofdstuk
      3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg](onbekend) aan de werknemer of gelijkgestelde,
      bedoeld in [artikel 3:6, eerste lid, van die wet][ref4] en op grond van de verplichte verzekering van de
      [Werkloosheidswet][ref5] als opbrengst van arbeid beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0008086#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017745
      [ref3]: https://wetten.overheid.nl/BWBR0001888
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Artikel36
      [ref5]: https://wetten.overheid.nl/BWBR0004045
