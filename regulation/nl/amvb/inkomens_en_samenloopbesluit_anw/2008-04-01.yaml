        bwb_id: BWBR0008086
        artikel: '3'
        paragraaf: '2'
  - number: '9'
    text: |-
      1 De bij de toepassing van de voorgaande artikelen noodzakelijke omrekening in euro van het niet in euro
      uitgedrukte inkomen uit of in verband met arbeid geschiedt met behulp van de door de Europese Centrale Bank
      geadviseerde wisselkoersen.

      2 Een wijziging van de in het eerste lid bedoelde koers beïnvloedt het op grond van [artikel 8][ref1] vastgestelde
      inkomen niet, met dien verstande dat:

      a. bij wijziging van het inkomen uit of in verband met arbeid, anders dan ten gevolge van de koersmutaties, een
      omrekening plaatsvindt; en

      b. tenminste eens per jaar een omrekening plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0008086#Artikel8
