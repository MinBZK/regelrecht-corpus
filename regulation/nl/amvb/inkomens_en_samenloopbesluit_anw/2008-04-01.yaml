  - number: 5a
    text: |-
      1 Onverminderd de [artikelen 3][ref1], [4][ref2] en [5][ref3] wordt tevens onder opbrengst van arbeid verstaan:

      a. een uitkering op grond van een particuliere verzekering wegens derving van inkomen, welke ten behoeve van de
      werknemer in het kader van een individuele of collectieve arbeidsovereenkomst is afgesloten;

      b. een uitkering op grond van een pensioenregeling met uitzondering van een weduwen-, weduwnaars- en
      partnerpensioen;

      c. een uitkering op grond van een regeling voor vervroegde uittreding of een regeling, die naar aard en strekking
      daarmee overeenkomt;

      d. een uitkering op grond van een regeling voor functioneel leeftijdsontslag of op grond van de
      [Uitkeringswet gewezen militairen][ref4];

      e. loon dat uit vroegere dienstbetrekking van de nabestaande wordt genoten;

      f. een financiële tegemoetkoming op grond van [hoofdstuk 7 van de Wet arbeid en zorg][ref5].

      2 In afwijking van het eerste lid, wordt niet onder opbrengst van arbeid verstaan:

      a. een aanspraak om na verloop van tijd of onder een voorwaarde een of meer uitkeringen of verstrekkingen te
      ontvangen, voor zover deze niet worden gedekt door stortingen van degene die het betreffende inkomen geniet;

      b. een eenmalige uitkering die na beëindiging van de dienstbetrekking aan een werknemer in verband met die
      beëindiging wordt betaald;

      c. vakantie-uitkering, over de in het eerste lid genoemde inkomensbestanddelen;

      d. een vakantie-bon, vertrekt naast een loondervingsuitkering, voor zover niet begrepen onder c;

      e. periodieke uitkeringen uit hoofde van een stamrecht, dat is verkregen uit een eenmalige uitkering welke na
      beëindiging van de dienstbetrekking aan de werknemer in verband met die beëindiging is toegekend, mits de werknemer
      aantoont dat de eenmalige uitkering door de werkgever betaalbaar is gesteld om naar eigen inzicht van de werknemer
      te besteden.

      3 Voor de toepassing van het eerste lid, onderdeel b, wordt onder pensioenregeling verstaan hetgeen daaronder wordt
      verstaan voor de toepassing van de [Wet op de loonbelasting 1964][ref6].

      4 Voor zover over een inkomen, genoemd in het eerste lid, geen aanspraak op vakantieuitkering bestaat, wordt dit
      inkomen slechts voor een deel in aanmerking genomen. De laatste volzin van [artikel 5, derde lid][ref7], is voor
      het vaststellen van dit deel van overeenkomstige toepassing.


