articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder

      a. de wet: de [Algemene nabestaandenwet][ref1];

      b. een loondervingsuitkering: een uitkering krachtens de verplichte verzekering op grond van de
      [Werkloosheidswet][ref2], de [Ziektewet][ref3], de [Wet op de arbeidsongeschiktheidsverzekering][ref4], de
      [Wet werk en inkomen naar arbeidsvermogen][ref5] en de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref6],
      alsmede een uitkering krachtens de [Wet arbeidsongeschiktheidsvoorziening militairen][ref7],
      krachtens [hoofdstuk 3, afdeling 2, van de Wet arbeid en zorg][ref8] en de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref9];

      c. een stamrecht: een recht op periodieke uitkeringen ter vervanging van gederfd of te derven loon.


