    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 7 juli 1994, nr.
    MJZ07794033, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Gelet op de artikelen 68, derde lid, 71, vierde lid, en 174 van de Wet geluidhinder;

    De Raad van State gehoord (advies van 23 september 1994, nr. W08.94.0437);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 8
    december 1994 nr. MJZ 08d94037, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007107/1998-04-23#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. wet: [Wet geluidhinder][ref1];

      b. akoestisch onderzoek: onderzoek als bedoeld in artikel 62 van de wet;

      c. saneringsprogramma: programma van maatregelen als bedoeld in artikel 71, tweede lid, van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003227
    url: https://wetten.overheid.nl/BWBR0007107/1998-04-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003227
  - number: '2'
    text: |-
      1 Een saneringsprogramma kan uitsluitend een of meer maatregelen bevatten die strekken tot:

      a. vermindering van de geluidproduktie van de op het industrieterrein aanwezige geluidsbronnen;

      b. vermindering van de geluidsoverdracht vanuit de op het industrieterrein aanwezige geluidsbronnen naar de
      betrokken woningen;

      c. aanbrengen van geluidwerende voorzieningen aan de betrokken woningen;

      d. verplaatsing van één of meer van de aanwezige geluidsbronnen op het industrieterrein naar een ander
      industrieterrein of

      e. onttrekking aan de bestemming van één of meer van de betrokken woningen.

      2 Maatregelen als bedoeld in het eerste lid, onder *b* en *c*, komen slechts in aanmerking voor opneming in het
      saneringsprogramma, voor zover de toepassing van maatregelen als bedoeld in het eerste lid, onder *a*, onvoldoende
      doeltreffend zal zijn dan wel overwegende bezwaren ontmoet van financiële aard.

      3 Maatregelen als bedoeld in het eerste lid, onder *d* en *e*, komen slechts in aanmerking voor opneming in het
      saneringsprogramma, voor zover de toepassing van maatregelen als bedoeld in het eerste lid, onder *a*, *b*, of
      *c*, onvoldoende doeltreffend zal zijn dan wel overwegende bezwaren ontmoet van stedebouwkundige, verkeerskundige,
      landschappelijke of financiële aard.
    url: https://wetten.overheid.nl/BWBR0007107/1998-04-23#Artikel2
  - number: '3'
    text: |-
      1 Maatregelen als bedoeld in [artikel 2, eerste lid][ref1], kunnen slechts in een saneringsprogramma worden
      opgenomen, voor zover de redelijke verwachting bestaat dat zij uiterlijk in het kalenderjaar 2002 zijn uitgevoerd.

      2 Onze Minister kan op een met redenen omkleed verzoek van gedeputeerde staten toestaan, dat de in een
      saneringsprogramma opgenomen maatregelen na 31 december 2002 worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0007107#Artikel2
    url: https://wetten.overheid.nl/BWBR0007107/1998-04-23#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007107
        artikel: '2'
  - number: '4'
    text: |-
      1 Gedeputeerde staten bereiden het saneringsprogramma voor overeenkomstig
      [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1].

      2 Ingeval Onze Minister overeenkomstig artikel 170, derde lid, van de wet een saneringsprogramma opstelt is het
      eerste lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0007107/1998-04-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '5'
    text: |-
      1 Het saneringsprogramma bevat ten minste:

      a. een beschrijving van de wijze waarop aan de voorschriften inzake geluidhinder, die zijn verbonden aan de
      vergunning, wordt voldaan met betrekking tot op het industrieterrein gelegen:

      1°. inrichtingen die zijn aangewezen krachtens artikel 41 van de wet, en

      2°. andere inrichtingen dan die bedoeld onder 1°, waarvoor krachtens
      [artikel 8.1, eerste lid, van de Wet milieubeheer][ref1], de [Mijnwet 1903][ref2] of de [Kernenergiewet][ref3] een
      vergunning is verleend;

      b. een opsomming van de woningen die ten tijde van de vaststelling van de zone een hogere geluidsbelasting, vanwege
      het industrieterrein, ondervonden dan 55 dB(A);

      c. een beschrijving van de mogelijk te treffen maatregelen als bedoeld in
      [artikel 2, onder a, b, d en e, onder][ref4] vermelding van het effect daarvan op de geluidsbelasting, vanwege het
      industrieterrein, van de mogelijk aan te brengen fasering in de uitvoering van deze maatregelen, van de geschatte
      kosten die aan deze maatregelen zijn verbonden, alsmede van de geluidsbelasting die de onder *b* bedoelde woningen
      blijven ondervinden vanwege het industrieterrein indien deze maatregelen zijn uitgevoerd;

      d. de keuze die gemaakt is uit de onder *c* bedoelde maatregelen, onder overeenkomstige vermelding van de onder *c*
      bedoelde gegevens;

      e. een verklaring dat maatregelen als bedoeld in artikel 111, eerste lid, van de wet, zullen worden getroffen,
      indien de geluidsbelasting binnen de woning bij gesloten ramen meer bedraagt dan 40 dB(A).

      2 Een saneringsprogramma bevat voorts één of meer kaarten, met bijbehorende verklaring, waarbij in elk
      geval de begrenzing van het industrieterrein en de rond dat terrein vastgestelde zone met een duidelijke
      lijn op de kaarten wordt aangegeven. Artikel 16, eerste lid, onder *a, b, c, d, f, g* en *h*, van het
      [Besluit op de ruimtelijke ordening 1985][ref5] is van overeenkomstige toepassing.

      3 Bij ministeriële regeling worden nadere eisen gesteld met betrekking tot de vormgeving en inrichting van het
      saneringsprogramma en tot de gegevens die het saneringsprogramma dienen te vergezellen.


