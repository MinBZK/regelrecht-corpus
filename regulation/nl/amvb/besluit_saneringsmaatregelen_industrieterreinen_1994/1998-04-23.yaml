      De [artikelen 2][ref1] tot en met [6][ref2] zijn van overeenkomstige toepassing met betrekking tot de in
      [artikel 9 van het Besluit grenswaarden binnen zones rond industrieterreinen][ref3] bedoelde gebouwen en terreinen.


