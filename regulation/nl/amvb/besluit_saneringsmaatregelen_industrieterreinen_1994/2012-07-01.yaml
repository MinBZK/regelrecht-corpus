---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_saneringsmaatregelen_industrieterreinen_1994
regulatory_layer: AMVB
publication_date: '2020-12-28'
valid_from: '2012-07-01'
bwb_id: BWBR0007107
url: https://wetten.overheid.nl/BWBR0007107/2012-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 7 juli 1994, nr.
    MJZ07794033, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Gelet op de artikelen 68, derde lid, 71, vierde lid, en 174 van de Wet geluidhinder;

    De Raad van State gehoord (advies van 23 september 1994, nr. W08.94.0437);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 8
    december 1994 nr. MJZ 08d94037, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel1
  - number: 1.a
    text: |-
      wet: [Wet geluidhinder][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0003227
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003227
  - number: 1.b
    text: |-
      akoestisch onderzoek: onderzoek als bedoeld in [artikel 62 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel62
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '62'
  - number: 1.c
    text: |-
      saneringsprogramma: programma van maatregelen als bedoeld in [artikel 62, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel62
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '62'
  - number: '2.1'
    text: 'Een saneringsprogramma kan uitsluitend een of meer maatregelen bevatten die strekken tot:'
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel2
  - number: 2.1.a
    text: vermindering van de geluidproduktie van de op het industrieterrein aanwezige geluidsbronnen;
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel2
  - number: 2.1.b
    text: |-
      vermindering van de geluidsoverdracht vanuit de op het industrieterrein aanwezige geluidsbronnen naar de betrokken
      woningen;
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel2
  - number: 2.1.c
    text: aanbrengen van geluidwerende voorzieningen aan de betrokken woningen;
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel2
  - number: 2.1.d
    text: |-
      verplaatsing van één of meer van de aanwezige geluidsbronnen op het industrieterrein naar een ander
      industrieterrein of
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel2
  - number: 2.1.e
    text: onttrekking aan de bestemming van één of meer van de betrokken woningen.
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel2
  - number: '2.2'
    text: |-
      Maatregelen als bedoeld in het eerste lid, onder *b* en *c*, komen slechts in aanmerking voor opneming in het
      saneringsprogramma, voor zover de toepassing van maatregelen als bedoeld in het eerste lid, onder *a*, onvoldoende
      doeltreffend zal zijn dan wel overwegende bezwaren ontmoet van financiële aard.
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel2
  - number: '2.3'
    text: |-
      Maatregelen als bedoeld in het eerste lid, onder *d* en *e*, komen slechts in aanmerking voor opneming in het
      saneringsprogramma, voor zover de toepassing van maatregelen als bedoeld in het eerste lid, onder *a*, *b*, of
      *c*, onvoldoende doeltreffend zal zijn dan wel overwegende bezwaren ontmoet van stedebouwkundige, verkeerskundige,
      landschappelijke of financiële aard.
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel2
  - number: 2a
    text: |-
      Gedeputeerde staten kunnen bij het opstellen van een saneringsprogramma uitgaan van een geluidsbelasting,
      vanwege het industrieterrein, die het gevolg is van de te verwachten ontwikkelingen, indien een maatregel als
      bedoeld in [artikel 2, eerste lid, onder d][ref1], wordt genomen in het kader van een herstructurering van een
      industrieterrein.


      [ref1]: https://wetten.overheid.nl/BWBR0007107#Artikel2
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0007107
        artikel: '2'
  - number: '3.1'
    text: |-
      Maatregelen als bedoeld in [artikel 2, eerste lid][ref1], kunnen slechts in een saneringsprogramma worden
      opgenomen, voor zover de redelijke verwachting bestaat dat zij uiterlijk in het kalenderjaar 2002 zijn uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0007107#Artikel2
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007107
        artikel: '2'
  - number: '3.2'
    text: |-
      Indien [artikel 2a][ref1] van toepassing is, kunnen in afwijking van het eerste lid, maatregelen als bedoeld in
      [artikel 2, eerste lid][ref2], in een saneringsprogramma worden opgenomen, voor zover de redelijke verwachting
      bestaat dat zij uiterlijk in het kalenderjaar 2009 zijn uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0007107#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0007107#Artikel2
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007107
        artikel: 2a
      - id: ref2
        bwb_id: BWBR0007107
        artikel: '2'
  - number: '3.3'
    text: |-
      Onze Minister kan op een met redenen omkleed verzoek van gedeputeerde staten toestaan, dat de in een
      saneringsprogramma opgenomen maatregelen na 31 december 2002 worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel3
  - number: '4.1'
    text: |-
      Op de voorbereiding van het door gedeputeerde staten op te stellen saneringsprogramma is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '4.2'
    text: |-
      Ingeval Onze Minister overeenkomstig artikel 170, derde lid, van de wet een saneringsprogramma opstelt is het
      eerste lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel4
  - number: '5.1'
    text: 'Het saneringsprogramma bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel5
  - number: 5.1.a
    text: |-
      een beschrijving van de wijze waarop aan de voorschriften inzake geluidhinder, die zijn verbonden aan de
      vergunning, wordt voldaan met betrekking tot op het industrieterrein gelegen:
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel5
  - number: 5.1.a.1°
    text: |-
      inrichtingen die zijn aangewezen krachtens [artikel 41 van de wet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel41
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '41'
  - number: 5.1.a.2°
    text: |-
      andere inrichtingen dan die bedoeld onder 1°, waarvoor krachtens
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref1] of de
      [Kernenergiewet][ref2] een vergunning is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002402
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002402
  - number: 5.1.b
    text: |-
      een opsomming van de woningen die ten tijde van de vaststelling van de zone een hogere geluidsbelasting, vanwege
      het industrieterrein, ondervonden dan 55 dB(A);
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel5
  - number: 5.1.c
    text: |-
      een beschrijving van de mogelijk te treffen maatregelen als bedoeld in
      [artikel 2, eerste lid, onder a, b, d en e][ref1], onder vermelding van het effect daarvan op de geluidsbelasting,
      vanwege het industrieterrein, van de mogelijk aan te brengen fasering in de uitvoering van deze maatregelen, van de
      geschatte kosten die aan deze maatregelen zijn verbonden, alsmede van de geluidsbelasting die de onder b bedoelde
      woningen blijven ondervinden vanwege het industrieterrein indien deze maatregelen zijn uitgevoerd;


      [ref1]: https://wetten.overheid.nl/BWBR0007107#Artikel2
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007107
        artikel: '2'
  - number: 5.1.d
    text: |-
      de keuze die gemaakt is uit de onder c bedoelde maatregelen, onder overeenkomstige vermelding van de onder c
      bedoelde gegevens;
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel5
  - number: 5.1.e
    text: |-
      een onderbouwing van de geluidsbelasting die het gevolg is van te verwachten ontwikkelingen ingeval van maatregelen
      als bedoeld in [artikel 2a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007107#Artikel2a
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007107
        artikel: 2a
  - number: 5.1.f
    text: |-
      een verklaring dat maatregelen als bedoeld in [artikel 111b, eerste lid, van de wet][ref1], zullen worden
      getroffen, indien de geluidsbelasting binnen de woning bij gesloten ramen meer bedraagt dan 40 dB(A).


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel111b
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 111b
  - number: '5.2'
    text: |-
      Een saneringsprogramma bevat voorts één of meer kaarten, met bijbehorende verklaring, waarbij in elk geval de
      begrenzing van het industrieterrein en de rond dat terrein vastgestelde zone met een duidelijke lijn op de kaarten
      wordt aangegeven. Deze kaart of kaarten worden ingericht met inachtneming van de volgende voorschriften:
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel5
  - number: 5.2.a
    text: de kaarten worden getekend op een duidelijke ondergrond;
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel5
  - number: 5.2.b
    text: |-
      de begrenzing van het gebied waarop het plan betrekking heeft, wordt met een duidelijke lijn op de kaarten
      aangegeven;
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel5
  - number: 5.2.c
    text: |-
      de kaarten worden vervaardigd op een schaal van ten minste 1 op 10 000, tenzij de omvang van het gebied of de aard
      van het plan een andere schaal noodzakelijk maakt;
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel5
  - number: 5.2.d
    text: uit de kaarten moet blijken de aansluiting van het in het plan begrepen gebied aan het daaromheen gelegen gebied;
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel5
  - number: 5.2.e
    text: |-
      indien een bestemmingsplan uit meerdere kaarten bestaat, moet uit een overzichtskaart de aansluiting van de kaarten
      onderling en de aansluiting aan het daaromheen gelegen gebied blijken;
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel5
  - number: 5.2.f
    text: op de kaarten worden de schaal en de noordpijl aangegeven;
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel5
  - number: 5.2.g
    text: |-
      op de kaarten worden de bestaande gebouwen en de namen van de belangrijkste wegen, straten en waterwegen
      aangegeven.
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel5
  - number: '5.3'
    text: |-
      Bij ministeriële regeling worden nadere eisen gesteld met betrekking tot de vormgeving en inrichting van het
      saneringsprogramma en tot de gegevens die het saneringsprogramma dienen te vergezellen.
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel5
  - number: '10'
    text: 'Dit besluit wordt aangehaald als: Besluit saneringsmaatregelen industrieterreinen 1994.'
    url: https://wetten.overheid.nl/BWBR0007107/2012-07-01#Artikel10
