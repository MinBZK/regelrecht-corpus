---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_hefschroefvliegtuigen_bij_ziekenhuizen_milieubeheer
regulatory_layer: AMVB
publication_date: '2015-10-01'
valid_from: '2003-02-01'
bwb_id: BWBR0014484
url: https://wetten.overheid.nl/BWBR0014484/2003-02-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 18 april 2002,
    nr. MJZ 2002035388, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Gelet op artikel 8.44 van de Wet milieubeheer;

    De Raad van State gehoord (advies van 9 juli 2002, nr. W08.02.0180/V);

    Gezien het nader rapport van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 11
    december 2002, nr. MJZ 2002105095, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0014484/2003-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014484/2003-02-01#Artikel1
  - number: 1.a
    text: |-
      inrichting: een inrichting die behoort tot een categorie als aangewezen in
      [bijlage I, onder 23.1, onder a, van het Inrichtingen- en vergunningenbesluit milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005829
    url: https://wetten.overheid.nl/BWBR0014484/2003-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005829
  - number: 1.b
    text: |-
      helitraumacentrum: een academisch ziekenhuis dat binnen de inrichting beschikt over een voorziening voor het
      landen en opstijgen van hefschroefvliegtuigen en die voorziening hoofdzakelijk in gebruik heeft voor het regulier
      vervoeren van een mobiel medisch team;
    url: https://wetten.overheid.nl/BWBR0014484/2003-02-01#Artikel1
  - number: 1.c
    text: 'neonaten: pasgeboren kinderen die spoedeisende medische zorg behoeven;'
    url: https://wetten.overheid.nl/BWBR0014484/2003-02-01#Artikel1
  - number: 1.d
    text: 'patiënten: ongevalslachtoffers en zieken die spoedeisend medische zorg behoeven;'
    url: https://wetten.overheid.nl/BWBR0014484/2003-02-01#Artikel1
  - number: 1.e
    text: |-
      mobiel medisch team: team bestaande uit in ieder geval een arts en een verpleegkundige, ieder met een specifieke
      opleiding en ervaring op het gebied van de pre-hospitale spoedeisende medische hulpverlening.
    url: https://wetten.overheid.nl/BWBR0014484/2003-02-01#Artikel1
  - number: '2'
    text: |-
      Dit besluit is van toepassing op een inrichting die beschikt over een voorziening voor het landen en opstijgen
      van hefschroefvliegtuigen.
    url: https://wetten.overheid.nl/BWBR0014484/2003-02-01#Artikel2
  - number: '3'
    text: |-
      Degene die een helitraumacentrum drijft, draagt er zorg voor dat het geluidsvermogensniveau van
      hefschroefvliegtuigen die door hem worden ingezet voor het vervoer van mobiele medische teams niet hoger is dan
      140 dB(A).
    url: https://wetten.overheid.nl/BWBR0014484/2003-02-01#Artikel3
  - number: '4'
    text: |-
      Degene die een inrichting, niet zijnde een helitraumacentrum, drijft, draagt ervoor zorg dat zijn voorziening ten
      behoeve van het landen en opstijgen van hefschroefvliegtuigen uitsluitend door hefschroefvliegtuigen wordt gebruikt
      indien dit bijzonder is aangewezen voor:
    url: https://wetten.overheid.nl/BWBR0014484/2003-02-01#Artikel4
  - number: 4.a
    text: het vervoer van patiënten, met inbegrip van apparatuur en begeleidend personeel;
    url: https://wetten.overheid.nl/BWBR0014484/2003-02-01#Artikel4
  - number: 4.b
    text: het vervoer van neonaten, met inbegrip van apparatuur en begeleidend personeel;
    url: https://wetten.overheid.nl/BWBR0014484/2003-02-01#Artikel4
  - number: 4.c
    text: het vervoer van organen of transplantatieteams in het kader van transplantatie;
    url: https://wetten.overheid.nl/BWBR0014484/2003-02-01#Artikel4
  - number: 4.d
    text: |-
      het vervoer van een lid van een mobiel medisch team die, nadat het mobiel medisch team met een hefschroefvliegtuig
      op een ongevallenlocatie is ingezet, met een patiënt anders dan met een hefschroefvliegtuig naar de inrichting
      is vervoerd;
    url: https://wetten.overheid.nl/BWBR0014484/2003-02-01#Artikel4
  - number: 4.e
    text: |-
      het verplaatsen van een hefschroefvliegtuig in verband met opleiding en training van de piloot tot ten hoogste 20
      vliegbewegingen per inrichting per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0014484/2003-02-01#Artikel4
  - number: '5'
    text: |-
      Degene die een helitraumacentrum drijft, draagt ervoor zorg dat zijn voorziening ten behoeve van het landen en
      opstijgen van hefschroefvliegtuigen uitsluitend door hefschroefvliegtuigen wordt gebruikt indien dit bijzonder
      aangewezen is voor:
    url: https://wetten.overheid.nl/BWBR0014484/2003-02-01#Artikel5
  - number: 5.a
    text: het vervoer van patiënten, met inbegrip van apparatuur en begeleidend personeel;
    url: https://wetten.overheid.nl/BWBR0014484/2003-02-01#Artikel5
  - number: 5.b
    text: het vervoer van neonaten, met inbegrip van apparatuur en begeleidend personeel;
    url: https://wetten.overheid.nl/BWBR0014484/2003-02-01#Artikel5
  - number: 5.c
    text: het vervoer van organen of transplantatieteams in het kader van transplantatie;
    url: https://wetten.overheid.nl/BWBR0014484/2003-02-01#Artikel5
  - number: 5.d
    text: het vervoer van mobiele medische teams, met inbegrip van apparatuur naar en van ongevallenlocaties;
    url: https://wetten.overheid.nl/BWBR0014484/2003-02-01#Artikel5
  - number: 5.e
    text: |-
      het verplaatsen van een hefschroefvliegtuig in verband met de komst van een ander hefschroefvliegtuig dat
      patiënten, neonaten, organen of transplantatieteams vervoert;
    url: https://wetten.overheid.nl/BWBR0014484/2003-02-01#Artikel5
  - number: 5.f
    text: |-
      het verplaatsen van een hefschroefvliegtuig tot ten hoogste 400 vliegbewegingen per helitraumacentrum per
      kalenderjaar in verband met:
    url: https://wetten.overheid.nl/BWBR0014484/2003-02-01#Artikel5
  - number: 5.f.1
    text: onderhoud of reparatie;
    url: https://wetten.overheid.nl/BWBR0014484/2003-02-01#Artikel5
  - number: 5.f.2
    text: tankvluchten;
    url: https://wetten.overheid.nl/BWBR0014484/2003-02-01#Artikel5
  - number: 5.f.3
    text: opleiding en training van de piloot en van het mobiel medisch team.
    url: https://wetten.overheid.nl/BWBR0014484/2003-02-01#Artikel5
  - number: '6.1'
    text: |-
      Degene die de inrichting drijft, registreert met betrekking tot het gebruik van zijn voorziening ten behoeve van
      het landen en opstijgen van hefschroefvliegtuigen ten minste de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0014484/2003-02-01#Artikel6
  - number: 6.1.a
    text: de reden voor het gebruik van de voorziening;
    url: https://wetten.overheid.nl/BWBR0014484/2003-02-01#Artikel6
  - number: 6.1.b
    text: tijd van vertrek;
    url: https://wetten.overheid.nl/BWBR0014484/2003-02-01#Artikel6
  - number: 6.1.c
    text: tijd van aankomst.
    url: https://wetten.overheid.nl/BWBR0014484/2003-02-01#Artikel6
  - number: '6.2'
    text: |-
      De registratie wordt binnen twee werkdagen na gebruik van de voorziening bijgewerkt en ten minste vijf jaar bewaard
      na vastlegging in de registratie.
    url: https://wetten.overheid.nl/BWBR0014484/2003-02-01#Artikel6
  - number: '7.1'
    text: |-
      Dit besluit is op het moment van inwerkingtreding ook van toepassing op inrichtingen die al zijn opgericht op het
      tijdstip waarop dit besluit in werking treedt.
    url: https://wetten.overheid.nl/BWBR0014484/2003-02-01#Artikel7
  - number: '7.2'
    text: |-
      In afwijking van [artikel 3][ref1] is het degene die op het moment van inwerkingtreding van dit besluit
      een helitraumacentrum drijft, tot het moment van vervanging van het hefschroefvliegtuig dat ten tijde van
      inwerkingtreding van dit besluit wordt ingezet voor het vervoer van mobiele medische teams, toegestaan een
      hefschroefvliegtuig in te zetten met een geluidsvermogensniveau van ten hoogste 145 dB(A).


      [ref1]: https://wetten.overheid.nl/BWBR0014484#Artikel3
    url: https://wetten.overheid.nl/BWBR0014484/2003-02-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0014484
        artikel: '3'
  - number: '7.3'
    text: |-
      Het is degene die een helitraumacentrum drijft tot 1 januari 2005 toegestaan zijn voorziening ten behoeve van het
      landen en opstijgen van hefschroefvliegtuigen ook te gebruiken voor het verplaatsen van het hefschroefvliegtuig van
      en naar een stallingsplaats buiten het terrein van de inrichting tot ten hoogste 800 vliegbewegingen per jaar.
    url: https://wetten.overheid.nl/BWBR0014484/2003-02-01#Artikel7
  - number: '8'
    text: |-
      Dit besluit treedt in werking met ingang van de eerste dag van de tweede kalendermaand na de datum van uitgifte van
      het Staatsblad waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0014484/2003-02-01#Artikel8
  - number: '9'
    text: 'Dit besluit wordt aangehaald als: Besluit hefschroefvliegtuigen bij ziekenhuizen milieubeheer.'
    url: https://wetten.overheid.nl/BWBR0014484/2003-02-01#Artikel9
