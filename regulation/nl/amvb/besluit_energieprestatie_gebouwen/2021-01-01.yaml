  - number: '2.3'
    text: |-
      Degene die een gebouw te koop of te huur aanbiedt door middel van advertenties in commerciële media,
      vermeldt in die advertenties de energieprestatie-indicator van een geldig energielabel, bedoeld in
      [artikel 2.1, achtste lid][ref1], dat is afgegeven voor dat gebouw, met uitzondering van gebouwen waarop artikel
      2.1 niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0023734#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0023734/2021-01-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0023734
        artikel: '2.1'
        afdeling: '2'
  - number: '2.4'
    text: |-
      1 De eigenaar van een gebouw brengt een daarvoor afgegeven geldig energielabel aan op een voor het publiek
      duidelijk zichtbare plaats in dat gebouw, indien:

      a. van dat gebouw een gebruiksoppervlakte van meer dan 250 m2 in gebruik is bij een overheidsinstelling en dat
      gebouw veelvuldig door het publiek wordt bezocht, of

      b. voor het gebouw een geldig energielabel is afgegeven zoals bedoeld in
      [artikel 2.1, eerste tot en met vijfde lid][ref1], een gebruiksoppervlakte van meer dan 250 m2 heeft en veelvuldig
      door het publiek wordt bezocht.

      2 Bij ministeriële regeling kan worden bepaald dat het eerste lid van toepassing is op een of meer bij die regeling
      aan te wijzen onderdelen van het energielabel.


      [ref1]: https://wetten.overheid.nl/BWBR0023734#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0023734/2021-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0023734
        artikel: '2.1'
        afdeling: '2'
  - number: '2.5'
    text: |-
      1 Een overheidsinstantie voert voor een gebouw in haar eigendom de in het voor dat gebouw afgegeven energielabel
      opgenomen aanbevelingen uit binnen de geldigheidsperiode van dat energielabel.

      2 Met het uitvoeren van de in het eerste lid bedoelde aanbevelingen wordt gelijkgesteld het treffen van
      voorzieningen die een zelfde mate van verbetering van de energieprestatie opleveren als beoogd met de in het eerste
      lid bedoelde aanbevelingen.
    url: https://wetten.overheid.nl/BWBR0023734/2021-01-01#Artikel2.5
  - number: '3.1'
    text: Bij ministeriële regeling worden nadere voorschriften gegeven omtrent het in dit besluit bepaalde.
    url: https://wetten.overheid.nl/BWBR0023734/2021-01-01#Artikel3.1
  - number: '4.1'
    text: |-
      Voor een gebouw waarvoor tussen 1 juli 2002 en het tijdstip van inwerkingtreding van dit artikel een Energie
      Prestatie Advies is uitgebracht dat voldoet aan de [Tijdelijke regeling energiepremies 2003][ref1] zoals deze
      laatstelijk luidde voor haar intrekking, kan aan de in [artikel 2.1][ref2] gestelde verplichtingen worden voldaan
      door het verstrekken van dit advies, mits dit niet ouder is dan tien jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0014481
      [ref2]: https://wetten.overheid.nl/BWBR0023734#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0023734/2021-01-01#Artikel4.1
