articles:
  - number: '1.1'
    text: |-
      1 Voor de toepassing van de bij of krachtens dit besluit gegeven voorschriften wordt verstaan onder:

      ***energieprestatie:*** berekende of gemeten hoeveelheid energie die nodig is om aan de vraag naar energie te
      voldoen die verband houdt met een normaal gebruik van een gebouw, waaronder energie die wordt gebruikt voor
      verwarming, koeling, ventilatie, warmwatervoorziening en verlichting;

      **energielabel:** op een gebouw betrekking hebbende schriftelijke verklaring:

      1°. waarin het resultaat is vermeld van de berekening van de energieprestatie;

      2°. waarin referentiewaarden zijn vermeld waarmee de energieprestatie kan worden vergeleken en beoordeeld en

      3°. die aanbevelingen voor een kostenoptimale of kosteneffectieve verbetering van de energieprestatie bevat, tenzij
      er voor een dergelijke verbetering geen redelijk potentieel is ten opzichte van de geldende energieprestatie-eisen.
      Deze aanbevelingen zijn technisch haalbaar voor het gebouw waarvoor het energielabel is afgegeven en kunnen een
      raming bieden van de terugverdientijden of kostenvoordelen gedurende de economische levensduur. Deze aanbevelingen
      omvatten in ieder geval maatregelen betreffende de ingrijpende renovatie van de bouwschil of technische
      bouwsystemen en maatregelen voor individuele onderdelen van een gebouw zonder dat er sprake is van een ingrijpende
      renovatie, alsmede een vindplaats voor extra informatie;

      **wet**: [Woningwet][ref1].

      2 Voor de toepassing van de bij of krachtens dit besluit gegeven voorschriften wordt onder gebouw mede verstaan
      delen van een gebouw die zijn ontworpen of aangepast om afzonderlijk te worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0023734/2021-01-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: '2.1'
    text: |-
      1 Bij de oplevering van een gebouw stelt de verkoper van het gebouw een geldig energielabel beschikbaar aan de
      koper.

      2 In afwijking van het eerste lid zorgt de eigenaar van een gebouw voor de aanwezigheid van een geldig energielabel
      bij de oplevering van dat gebouw indien dat gebouw is gebouwd in opdrachtgeverschap waarbij die eigenaar de
      eigendom verkrijgt en volledige zeggenschap heeft over en verantwoordelijkheid draagt voor de bouw van dat gebouw.

      3 Bij de verhuur van een gebouw stelt de eigenaar een afschrift van een geldig energielabel voor dat gebouw
      beschikbaar aan de nieuwe huurder.

      4 Bij de verkoop van een gebouw stelt de eigenaar een geldig energielabel voor dat gebouw beschikbaar aan de koper.

      5 Het vierde lid is van overeenkomstige toepassing op de verkoop van een deelnemings- of lidmaatschapsrecht dat
      recht geeft op het gebruik van een gebouw.

      6 De eigenaar van een gebouw waarvan een gebruiksoppervlakte van meer dan 250 m2 in gebruik is bij een
      overheidsinstelling en dat veelvuldig door het publiek wordt bezocht, heeft een geldig energielabel voor dat
      gebouw.

      7 Een energielabel is geldig gedurende tien jaar na de datum van opname van de gegevens voor de afgifte ervan.

      8 Een energielabel bevat tenminste een numerieke energieprestatie-indicator van het primair fossiel energiegebruik
      in kWh/m2.jr en een in een letter of lettercombinatie uitgedrukte weergave van de energieprestatie.
    url: https://wetten.overheid.nl/BWBR0023734/2021-01-01#Artikel2.1
  - number: '2.2'
    text: |-
      [Artikel 2.1][ref1] is niet van toepassing op:

      a. gebouwen waarvoor geen energie gebruikt wordt om het binnenklimaat te regelen;

      b. rijksmonumenten als bedoeld in [artikel 1.1 van de Erfgoedwet][ref2], monumenten waarvoor het ontwerpbesluit,
      bedoeld in [artikel 3.2, vierde lid, van de Erfgoedwet][ref3], ter inzage is gelegd, vanaf de dag van die ter
      inzagelegging tot het moment van inschrijving in het rijksmonumentenregister, bedoeld in artikel 1.1 van die wet,
      of het moment waarop vaststaat dat het monument niet wordt ingeschreven in dat register, krachtens een provinciale
      of gemeentelijke verordening aangewezen monumenten en monumenten waarop, voordat zij zijn aangewezen, een zodanige
      verordening van overeenkomstige toepassing is;

      c. gebouwen die worden gebruikt voor erediensten en religieuze activiteiten;

      d. gebouwen die bestemd zijn om te worden gebruikt voor het bedrijfsmatig bewerken of opslaan van materialen en
      goederen, of voor agrarische doeleinden, en die een lage energiebehoefte hebben;

      e. gebouwen die ten hoogste twee jaar worden gebruikt;

      f. voor bewoning bestemde gebouwen die minder dan vier maanden per jaar worden gebruikt, en met een verwacht
      energieverbruik van minder dan 25% van het energieverbruik bij permanent gebruik;

      g. alleenstaande gebouwen met een gebruiksoppervlakte van minder dan 50 m2 en

      h. gebouwen die bij minnelijke overeenkomst als bedoeld in [artikel 17 van de Onteigeningswet][ref4] worden
      verkregen en, met het oog op de uitvoering van het werk waarmee die verkrijging verband houdt, zullen worden
      gesloopt.


      [ref1]: https://wetten.overheid.nl/BWBR0023734#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037521#Artikel1.1
      [ref3]: https://wetten.overheid.nl/BWBR0037521#Artikel3.2
      [ref4]: https://wetten.overheid.nl/BWBR0001842#Artikel17
