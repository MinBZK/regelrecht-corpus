$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_geluidproduktie_motorvoertuigen
regulatory_layer: AMVB
publication_date: '2015-09-04'
valid_from: '1998-12-18'
bwb_id: BWBR0003464
url: https://wetten.overheid.nl/BWBR0003464/1998-12-18
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid en Milieuhygiëne van 15 juli 1981, DGMH/G, nr. 53089, gedaan
    in overeenstemming met Onze Ministers van Verkeer en Waterstaat en van Economische Zaken;

    Gelet op de artikelen 2, 4, 6 en 146 van de Wet geluidhinder (Stb. 1979, 99);

    Gelet op de richtlijn van de Raad van de Europese Gemeenschappen van 6 februari 1970, nr. 70/157/EEG (Pb. E.G. L
    42) inzake de onderlinge aanpassing van de wetgevingen van de Lid-Staten betreffende het toegestane geluidsniveau
    en de uitlaatinrichting van motorvoertuigen, zoals laatstelijk gewijzigd bij de richtlijn van de Raad van de
    Europese Gemeenschappen van 8 maart 1977, nr. 77/212/EEG (Pb. E.G. L 66) en gelet op de richtlijn van de Raad
    van de Europese Gemeenschappen van 23 november 1978, nr. 78/1015/EEG (Pb. E.G. L 349), inzake de onderlinge
    aanpassing van de wetgevingen der Lid-Staten betreffende het toegestane geluidsniveau en de uitlaatinrichting van
    motorrijwielen;

    Gezien het advies van de Voorlopige Centrale Raad voor de Milieuhygiëne;

    De Raad van State gehoord (advies van 30 september 1981, no. 810923/32);

    Gezien het nader rapport van de Staatssecretaris van Volksgezondheid en Milieuhygiëne van 17 november 1981, DGMH/G,
    no. 55099, uitgebracht in overeenstemming met Onze Ministers van Verkeer en Waterstaat en van Economische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel1
  - number: 1.1.a
    text: 'Onze Ministers: Onze Minister en Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel1
  - number: 1.1.b
    text: |-
      [richtlijn 70/156](31970L0156): [richtlijn nr. 70/156/EEG](31970L0156) van de Raad van de Europese Gemeenschappen
      van 6 februari 1970 inzake de onderlinge aanpassing van de wetgevingen van de Lid-Staten betreffende de goedkeuring
      van motorvoertuigen en aanhangwagens daarvan (*PbEG* L 42);
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel1
  - number: 1.1.c
    text: |-
      [richtlijn 70/157](31970L0157): [richtlijn nr. 70/157/EEG](31970L0157) van de Raad van de Europese Gemeenschappen
      van 6 februari 1970 inzake de onderlinge aanpassing van de wetgevingen van de Lid-Staten betreffende het toegestane
      geluidsniveau en de uitlaatinrichting van motorvoertuigen (*PbEG* L 42);
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel1
  - number: 1.1.d
    text: |-
      [richtlijn 87/403](31987L0403): [richtlijn nr. 87/403/EEG](31987L0403) van de Raad van de Europese Gemeenschappen
      van 25 juni 1987 (*PbEG* L 220) tot aanvulling van bijlage I van [Richtlijn 70/156/EEG](31970L0156) inzake
      de onderlinge aanpassing van de wetgevingen der Lid-Staten betreffende de goedkeuring van motorvoertuigen en
      aanhangwagens daarvan;
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel1
  - number: 1.1.e
    text: |-
      [richtlijn 92/53](31992L0053): [richtlijn nr. 92/53/EEG](31992L0053) van de Raad van de Europese Gemeenschappen van
      18 juni 1992 (*PbEG* L 225) tot wijziging van [Richtlijn 70/156/EEG](31970L0156) inzake de onderlinge aanpassing
      van de wetgevingen der Lid-Staten betreffende de goedkeuring van motorvoertuigen en aanhangwagens daarvan;
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel1
  - number: 1.1.f
    text: |-
      [richtlijn 92/61](31992L0061): [richtlijn nr. 92/61/EEG](31992L0061) van de Raad van de Europese Gemeenschappen van
      30 juni 1992 betreffende de goedkeuring van twee- of driewielige motorvoertuigen (PbEG L 225);
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel1
  - number: 1.1.g
    text: |-
      [richtlijn 97/24](31997L0024): [richtlijn nr. 97/24/EG](31997L0024) van het Europees Parlement en de Raad van de
      Europese Unie van 17 juni 1997 betreffende bepaalde onderdelen of eigenschappen van motorvoertuigen op twee of drie
      wielen (PbEG L 226).
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel1
  - number: '1.2'
    text: |-
      Dit besluit is niet van toepassing op motorvoertuigen die ingevolge
      [artikel 37, eerste lid, van de Wegenverkeerswet 1994][ref1] zijn uitgezonderd van de in
      [artikel 36, eerste lid, van die wet][ref2] neergelegde verplichting dat voor het voertuig een kenteken is
      opgegeven, met dien verstande dat dit besluit wel van toepassing is op zodanige motorvoertuigen die behoren tot een
      door Onze Ministers bij ministeriële aangewezen categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel36
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '37'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '36'
  - number: '2'
    text: |-
      Het is verboden motorvoertuigen op ten minste vier wielen te vervaardigen, in te voeren, in voorraad te hebben, te
      koop aan te bieden, af te leveren of te vervoeren, die niet behoren tot een type:
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel2
  - number: 2.a
    text: |-
      waarvoor een goedkeuring geldt ingevolge een keuring, door de Dienst Wegverkeer of een andere door Onze Minister
      van Verkeer en Waterstaat aangewezen instantie verricht aan de hand van de krachtens [artikel 7][ref1] geldende
      voorschriften, of


      [ref1]: https://wetten.overheid.nl/BWBR0003464#Artikel7
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003464
        artikel: '7'
        hoofdstuk: III
  - number: 2.b
    text: 'dat voldoet aan de voorschriften van [richtlijn 70/157](31970L0157):'
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel2
  - number: 2.b.1°
    text: |-
      blijkens een goedkeuringsformulier als bedoeld in artikel 4, derde lid, van [richtlijn 70/156](31970L0156),
      zoals gewijzigd bij [richtlijn 92/53](31992L0053), indien het betreft een personenauto als bedoeld in
      [artikel 1.1, onder ][ref1], met een verbrandingsmotor, of


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel1
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: '1'
  - number: 2.b.2°
    text: |-
      blijkens een document als bedoeld in artikel 10, eerste lid, tweede streepje, van [richtlijn 70/156](31970L0156),
      zoals gewijzigd bij [richtlijn 87/403](31987L0403), in andere gevallen.
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel2
  - number: '3'
    text: |-
      Het is verboden motorvoertuigen op minder dan vier wielen te vervaardigen, in te voeren, in voorraad te hebben, te
      koop aan te bieden, af te leveren of te vervoeren, die niet behoren tot een type:
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel3
  - number: 3.a
    text: |-
      waarvoor een goedkeuring geldt ingevolge een keuring, door de Dienst Wegverkeer of een andere door Onze Minister
      van Verkeer en Waterstaat aangewezen instantie verricht aan de hand van de krachtens [artikel 7][ref1] geldende
      voorschriften, of


      [ref1]: https://wetten.overheid.nl/BWBR0003464#Artikel7
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003464
        artikel: '7'
        hoofdstuk: III
  - number: 3.b
    text: |-
      dat blijkens een goedkeuringscertificaat als bedoeld in artikel 4, vierde lid, van [richtlijn 92/61](31992L0061)
      voldoet aan de voorschriften van hoofdstuk 9 van [richtlijn 97/24](31997L0024).
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel3
  - number: '5.1'
    text: |-
      Het in de [artikelen 2][ref1] en [3][ref2] bepaalde geldt niet indien de handelingen geschieden met het oog op het
      buiten Nederland in de handel brengen van motorvoertuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0003464#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003464#Artikel3
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003464
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003464
        artikel: '3'
        hoofdstuk: II
  - number: '5.2'
    text: |-
      Het in de [artikelen 2][ref1] en [3][ref2] bepaalde geldt voorts niet ten aanzien van motorvoertuigen:


      [ref1]: https://wetten.overheid.nl/BWBR0003464#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003464#Artikel3
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003464
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003464
        artikel: '3'
        hoofdstuk: II
  - number: 5.2.a
    text: die zich in het kader van bedrijfsmatige vervaardiging nog bevinden in het stadium van beproeving of onderzoek;
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel5
  - number: 5.2.b
    text: die dienen als monster bij een ingevolge dit besluit te verrichten keuring;
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel5
  - number: 5.2.c
    text: 'die uitsluitend worden gehouden om te worden tentoongesteld of om aan overeenkomstige manifestaties deel te nemen:'
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel5
  - number: 5.2.c.1°
    text: |-
      blijkens de aantekening die het daartoe bevoegde orgaan heeft geplaatst onder "Bijzonderheden" in het
      kentekenbewijs, afgegeven voor het motorvoertuig krachtens [artikel 36 van de Wegenverkeerswet 1994][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '36'
  - number: 5.2.c.2°
    text: |-
      blijkens de ontheffing, afgegeven voor het motorvoertuig ingevolge [hoofdstuk 7 van het Voertuigreglement][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006746
        hoofdstuk: '7'
  - number: 5.2.d
    text: |-
      waarvoor, blijkens het daarvoor afgegeven kentekenbewijs, een kenteken is opgegeven als bedoeld in
      [artikel 4 van het Kentekenreglement][ref1], doch slechts wat de lettergroep ZZ en de enkele letters betreft;


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel4
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '4'
  - number: 5.2.e
    text: |-
      die blijkens een aantekening als bedoeld onder *c*, hier te lande aanwezig zijn met een vrijstelling onder
      voorwaarde van uitvoer met betrekking tot de voor het motorvoertuig geheven belastingen.
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel5
  - number: '7.1'
    text: |-
      Onze Ministers stellen de voorschriften vast, aan de hand waarvan de in de [artikel 2, onder a][ref1], en
      [artikel 3, onder a][ref2], bedoelde keuringen worden verricht. De voorschriften hebben uitsluitend betrekking
      op de eigenschappen of onderdelen van motorvoertuigen, die bepalend zijn voor de geluidproduktie van deze
      motorvoertuigen, en bevatten mede een omschrijving van het keuringsproces.


      [ref1]: https://wetten.overheid.nl/BWBR0003464#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003464#Artikel3
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003464
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003464
        artikel: '3'
        hoofdstuk: II
  - number: '7.2'
    text: |-
      [Artikel 22, eerste en derde lid, van de Wegenverkeerswet 1994][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '22'
  - number: '14.1'
    text: |-
      In geval van wijziging in de keuringsvoorschriften die ten grondslag hebben gelegen aan een goedkeuring als bedoeld
      in [artikel 2, onder a][ref1], en [artikel 3, onder a][ref2], kunnen Onze Ministers bepalen dat bij het verstrijken
      van een in hun besluit te stellen termijn die goedkeuring ophoudt te gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0003464#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003464#Artikel3
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003464
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003464
        artikel: '3'
        hoofdstuk: II
  - number: '14.2'
    text: |-
      De termijn, bedoeld in het eerste lid, dient voor de onderscheidene in de [artikelen 2][ref1] en [3][ref2]
      genoemde handelingen verschillend te zijn, zulks in een met het onderscheid, te dien aanzien gemaakt in
      [artikel 15][ref3], overeenkomstige zin.


      [ref1]: https://wetten.overheid.nl/BWBR0003464#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003464#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003464#Artikel15
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003464
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003464
        artikel: '3'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003464
        artikel: '15'
        hoofdstuk: VII
  - number: '15'
    text: |-
      Het in de [artikelen 2][ref1] en [3][ref2] genoemde verbod om in te voeren, in voorraad te hebben, te koop aan te
      bieden, af te leveren of te vervoeren, geldt niet voor motorvoertuigen die in Nederland voor het gebruik op de weg
      waren toegelaten vóór de inwerkingtreding van dit besluit voor de betrokken motorvoertuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0003464#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003464#Artikel3
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003464
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003464
        artikel: '3'
        hoofdstuk: II
  - number: '16'
    text: |-
      Motorvoertuigen als bedoeld in [artikel 15][ref1] waarvoor een goedkeuring is verkregen op grond van een
      keuring, waarbij het motorvoertuig bleek te voldoen aan keuringsvoorschriften die naar het oordeel van Onze
      Ministers gelijkwaardig zijn aan de keuringsvoorschriften voor het desbetreffende type motorvoertuig, geldende
      krachtens [artikel 7][ref2], worden gelijkgesteld met motorvoertuigen, behorende tot een type als bedoeld in de
      [artikelen 2][ref3] en [3][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003464#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003464#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003464#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0003464#Artikel3
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003464
        artikel: '15'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0003464
        artikel: '7'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0003464
        artikel: '2'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0003464
        artikel: '3'
        hoofdstuk: II
  - number: '17'
    text: |-
      Het in [artikel 3, onder b][ref1], gestelde verbod is tot 17 juni 1999 niet van toepassing op motorvoertuigen
      die behoren tot een type dat blijkens een certificaat als bedoeld in artikel 3 van [richtlijn nr. 78/1015/EEG]
      (31978L1015) van de Raad van de Europese Gemeenschappen van 23 november 1978 inzake de onderlinge aanpassing van
      de wetgevingen der Lid-Staten betreffende het toegestane geluidsniveau en de uitlaatinrichting van motorrijwielen
      (PbEG L 349) voldoet aan de voorschriften van die richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003464#Artikel3
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003464
        artikel: '3'
        hoofdstuk: II
  - number: '19'
    text: 'Dit besluit kan worden aangehaald als: Besluit geluidproduktie motorvoertuigen.'
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel19
  - number: '20.1'
    text: |-
      Dit besluit treedt, behalve voor wat betreft motorvoertuigen bedoeld in het tweede lid, in werking met ingang van
      1 februari 1982, met uitzondering van de [artikelen 4][ref1], en [15, vierde lid][ref2], die in werking treden op 1
      maart 1982.


      [ref1]: https://wetten.overheid.nl/BWBR0003464#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003464#Artikel15
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003464
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003464
        artikel: '15'
        hoofdstuk: VII
  - number: '20.2'
    text: |-
      Dit besluit treedt voor wat betreft motorvoertuigen op ten minste vier wielen, ingericht voor het vervoer van meer
      dan 8 personen, de bestuurder daaronder niet begrepen, met een motorvermogen van ten minste 147 kW, in werking met
      ingang van 1 april 1982, met uitzondering van de [artikelen 4][ref1], en [15, vierde lid][ref2], die in werking
      treden op 1 mei 1982.


      [ref1]: https://wetten.overheid.nl/BWBR0003464#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003464#Artikel15
    url: https://wetten.overheid.nl/BWBR0003464/1998-12-18#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003464
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003464
        artikel: '15'
        hoofdstuk: VII
