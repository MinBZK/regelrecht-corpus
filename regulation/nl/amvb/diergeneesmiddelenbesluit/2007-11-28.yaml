        artikel: '21'
      - id: ref2
        bwb_id: BWBR0018901
        artikel: '43'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0003818
        artikel: '21'
  - number: '86'
    text: |-
      1 Op een diergeneesmiddel als bedoeld in [artikel 58, tweede lid, van de wet][ref1] is
      [hoofdstuk III, paragraaf 4][ref2], van dit besluit niet van toepassing tot het tijdstip waarop de beslissing op de
      aanvraag tot registratie van dat middel onherroepelijk is geworden.

      2 Voor zolang de beslissing, bedoeld in het eerste lid, niet onherroepelijk is, is het slechts toegestaan om een
      diergeneesmiddel als bedoeld in [artikel 58, tweede lid, van de wet][ref3] af te leveren indien op de verpakking
      van het diergeneesmiddel of een het diergeneesmiddel begeleidend document, ingeval het diergeneesmiddel onverpakt
      is, ten minste de volgende aanduidingen zijn geplaatst:

      a. de naam van het diergeneesmiddel;

      b. de naam of de handelsnaam en het adres van degene die voor het in de handel brengen van het diergeneesmiddel in
      Nederland verantwoordelijk is;

      c. de naam van de werkzame stof of stoffen in het diergeneesmiddel;

      d. één van de volgende vermeldingen: diergeneesmiddel, voor diergeneeskundig gebruik, ad usum veterinarium of ad.
      us. vet.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0018901#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0003818#Artikel58
