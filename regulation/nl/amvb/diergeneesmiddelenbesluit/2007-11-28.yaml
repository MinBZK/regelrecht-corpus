  - number: '16'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de wijze waarop de informatie, bedoeld in de
      [artikelen 14][ref1] en [15][ref2], wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel14
