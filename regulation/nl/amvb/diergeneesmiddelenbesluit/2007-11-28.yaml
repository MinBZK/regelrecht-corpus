preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuur en Voedselkwaliteit van 24 mei 2005, nr. TRCJZ/2005/1613,
    Directie Juridische Zaken, gedaan in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport en na
    overleg met Onze Minister van Sociale Zaken en Werkgelegenheid;

    Gelet op:

    – richtlijn nr. 90/167/EEG van de Raad van de Europese Gemeenschappen van 26 maart 1990 tot vaststelling van de
    voorwaarden voor de bereiding, het in de handel brengen en het gebruik van diervoeders met medicinale werking (PbEG
    L 92);

    – richtlijn nr. 91/412/EEG van de Commissie van de Europese Gemeenschappen van 23 juli 1991 tot vastlegging van
    beginselen en richtsnoeren inzake goede praktijken bij het vervaardigen van geneesmiddelen voor diergeneeskundig
    gebruik (PbEG L 228);

    – richtlijn nr. 96/22/EG van de Raad van de Europese Unie van 29 april 1996 betreffende het verbod op het gebruik,
    in de veehouderij, van bepaalde stoffen met hormonale werking en van bepaalde stoffen met thyreostatische werking,
    alsmede van ß-agonisten en tot intrekking van de Richtlijnen 81/602/EEG, 88/146/EEG en 88/299/EEG (PbEG L 125);

    – richtlijn nr. 96/23/EG van de Raad van de Europese Unie van 29 april 1996 inzake controlemaatregelen ten aanzien
    van bepaalde stoffen en residuen daarvan in levende dieren en in produkten daarvan en tot intrekking van de
    Richtlijnen 85/358/EEG en 86/469/EEG en de Beschikkingen 89/187/EEG en 91/664/EEG (PbEG L 125);

    – richtlijn nr. 2001/82/EG van het Europees Parlement en de Raad van de Europese Unie van 6 november 2001 tot
    vaststelling van een communautair wetboek betreffende geneesmiddelen voor diergeneeskundig gebruik (PbEG L 311);

    – richtlijn nr. 2004/28/EG van het Europees Parlement en de Raad van de Europese Unie van 31 maart 2004 tot
    wijziging van Richtlijn 2001/82/EG tot vaststelling van een communautair wetboek betreffende geneesmiddelen voor
    diergeneeskundig gebruik (PbEU L 136);

    – verordening (EG) nr. 726/2004 van het Europees Parlement en de Raad van de Europese Unie van 31 maart 2004 tot
    vaststelling van communautaire procedures voor het verlenen van vergunningen en het toezicht op geneesmiddelen voor
    menselijk en diergeneeskundig gebruik en tot oprichting van een Europees Geneesmiddelenbureau (PbEU L 136);

    Gelet op de artikelen 3, derde lid, 11, tweede lid, 20, eerste lid, 23, eerste lid, 28, 33, tweede en derde lid,
    39, 42, eerste lid, 43, eerste lid en 49 van de Diergeneesmiddelenwet;

    De Raad van State gehoord (advies van 26 augustus 2005, nr. W11.05.0199/V);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuur en Voedselkwaliteit van 13 oktober 2005, nr.
    TRCJZ/2005/2934, Directie Juridische Zaken, uitgebracht in overeenstemming met Onze Minister van Volksgezondheid,
    Welzijn en Sport en na overleg met Onze Minister van Sociale Zaken en Werkgelegenheid;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt, in afwijking van
      [artikel 1, eerste lid, van de wet][ref1], verstaan onder bijwerking: een schadelijke en onbedoelde reactie bij
      dieren op de toediening van doses aan diergeneesmiddelen die gewoonlijk worden gebruikt voor de profylaxe, diagnose
      of behandeling van een ziekte dan wel voor het herstellen, verbeteren of wijzigen van een fysiologische functie.

      2 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. aquacultuurdier: levende vis die, onderscheidenlijk schaal- of weekdier dat, bestemd is voor een bedrijf of
      afkomstig is van een bedrijf;

      b. bijsluiter: informatieblad ten behoeve van de gebruiker, dat het diergeneesmiddel vergezelt;

      c. bijwerking bij de mens: schadelijke en onbedoelde reactie bij een mens ten gevolge van de blootstelling aan
      een diergeneesmiddel;

      d. buitenverpakking: verpakking waarin de primaire verpakking is of wordt geplaatst;

      e. communautaire maatregel: verordening, richtlijn of beschikking als bedoeld in artikel 249 van het Verdrag tot
      oprichting van de Europese Economische Gemeenschap ter zake van diergeneesmiddelen en de daarmee verband houdende
      onderwerpen;

      f. derde land: ander land dan een lidstaat;

      g. ernstige bijwerking: bijwerking bij dieren die tot de dood leidt, levensgevaar oplevert dan wel een significante
      handicap, een lichamelijke ongeschiktheid, een aangeboren afwijking, een geboorteafwijking of blijvende of
      langdurige verschijnselen veroorzaakt;

      h. etiketteren: plaatsen van aanduidingen en vermeldingen op de verpakking;

      i. halffabrikaat met medicinale werking: mengsel van een voormengsel met medicinale werking en één of meer
      diervoedergrondstoffen, dat als zodanig is bestemd voor rechtstreekse verwerking tot gemedicineerd voeder;

      j. homeopathisch diergeneesmiddel: diergeneesmiddel dat overeenkomstig een homeopathisch fabricageprocédé,
      beschreven in de krachtens het Verdrag inzake de samenstelling van een Europese farmacopee van 22 juli 1964, Trb
      1966, nr. 115 samengestelde Europese farmacopee of, bij afwezigheid daarvan, in een farmacopee die officieel in
      een lidstaat wordt gebruikt, wordt verkregen uit grondstoffen die in de homeopathisch-farmaceutische vakliteratuur
      worden aangeduid als homeopathische grondstoffen;

      k. in het vrije verkeer brengen: uitvoering van de handelingen die bij invoer noodzakelijk zijn voor het verkrijgen
      van de douanestatus van communautaire goederen als bedoeld in artikel 4 van [verordening (EEG) nr. 2913/92]
      (31992R2913) van de Raad van de Europese Gemeenschappen van 12 oktober 1992 tot vaststelling van het communautair
      douanewetboek (PbEG L 302);

      l. landbouwhuisdieren: als huisdier gehouden runderen, varkens, schapen, geiten, eenhoevigen, pluimvee en tamme
      konijnen, alsook wilde dieren van genoemde soorten en wilde herkauwers, voor zover zij op een bedrijf wordt
      gehouden;

      m. lidstaat: lidstaat van de Europese Unie of andere staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte;

      n. omdoos: verpakking waarin een aantal buitenverpakkingen van eenzelfde diergeneesmiddel of gemedicineerd voeder
      zijn of worden geplaatst;

      o. primaire verpakking: recipiënt of enige andere verpakkingsvorm die rechtstreeks met een diergeneesmiddel of
      gemedicineerd voeder in aanraking komt;

      p. [richtlijn nr. 90/167/EEG](31990L0167): [richtlijn nr. 90/167/EEG](31990L0167) van de Raad van de Europese
      Gemeenschappen van 26 maart 1990 tot vaststelling van de voorwaarden voor de bereiding, het in de handel brengen en
      het gebruik van diervoeders met medicinale werking (PbEG L 92);

      q. [richtlijn nr. 96/23/EG](31996L0023): [richtlijn nr. 96/23/EG](31996L0023) van de Raad van de Europese Unie van
      29 april 1996 inzake controlemaatregelen ten aanzien van bepaalde stoffen en residuen daarvan in levende dieren en
      in producten daarvan en tot intrekking van de [Richtlijnen 85/358/EEG](31985L0358) en [86/469/EEG](31986L0469) en
      de Beschikkingen [89/187/EEG](31989L0187) en [91/664/EEG](31991L0664) (PbEG L 125);

      r. [richtlijn nr. 2001/82/EG](32001L0082): [richtlijn nr. 2001/82/EG](32001L0082) van het Europees Parlement
      en de Raad van de Europese Unie van 6 november 2001 tot vaststelling van een communautair wetboek betreffende
      geneesmiddelen voor diergeneeskundig gebruik (PbEG L 311);

      s. [verordening (EEG) nr. 2377/90](31990R2377): [verordening (EEG) nr. 2377/90](31990R2377) van de Raad van de
      Europese Gemeenschappen van 26 juni 1990 houdende een communautaire procedure tot vaststelling van maximumwaarden
      voor residuen van geneesmiddelen voor diergeneeskundig gebruik in levensmiddelen van dierlijke oorsprong (PbEG
      L 224);

      t. [verordening (EG) nr. 726/2004](32004R0726): [verordening (EG) nr. 726/2004](32004R0726) van het Europees
      Parlement en de Raad van de Europese Unie van 31 maart 2004 tot vaststelling van communautaire procedures voor
      het verlenen van vergunningen en het toezicht op geneesmiddelen voor menselijk en diergeneeskundig gebruik en tot
      oprichting van een Europees Geneesmiddelenbureau (PbEU L 136);

      u. verpakken: brengen van de verpakking in de toestand waarin deze in het verkeer zal worden gebracht, in
      voorkomend geval met inbegrip van:

      1°. het plaatsen van de primaire verpakking in een buitenverpakking;

      2°. het plaatsen van de buitenverpakking in een omdoos;

      3°. het etiketteren;

      v. verpakking: primaire verpakking, buitenverpakking of omdoos;

      w. voormengsel met medicinale werking: diergeneesmiddel dat van tevoren is bereid om later verwerkt te worden tot
      gemedicineerd voeder;

      x. wachttermijn: tijd die, overeenkomstig de bij of krachtens de wet gestelde regels alsmede de gebruiksvoorwaarden
      die op een diergeneesmiddel van toepassing zijn, ten minste na de laatste toediening van dat diergeneesmiddel aan
      een dier moet verstrijken alvorens tot productie van levensmiddelen, afkomstig van dat dier, kan worden overgegaan;

      y. wet: [Diergeneesmiddelenwet][ref2].

      3 Voor de toepassing van dit besluit en de daarop berustende bepalingen:

      a. worden omhulsels, waarin diergeneesmiddelen aan een dier worden toegediend, alsmede poederpapier geacht deel uit
      te maken van het diergeneesmiddel;

      b. wordt onder het bereiden van een diergeneesmiddel of gemedicineerd voeder tevens verstaan het verrichten van één
      of meer deelbewerkingen welke noodzakelijk zijn voor het bereiden, met inbegrip van het vullen en sluiten van de
      primaire verpakking van dat middel, onderscheidenlijk voeder.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003818
