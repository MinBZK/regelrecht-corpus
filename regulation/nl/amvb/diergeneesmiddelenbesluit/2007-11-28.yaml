    text: |-
      1 Indien een registratiehouder informatie verstrekt aan het publiek over vraagstukken die verband houden met de
      geneesmiddelenbewaking, stelt hij Onze Minister hiervan vooraf of gelijktijdig in kennis.

      2 De informatie, bedoeld in het eerste lid, wordt objectief gepresenteerd en is niet misleidend.
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel17
  - number: '18'
    text: |-
      Ingeval een wijziging van de bijlagen bij [verordening (EEG) nr. 2377/90](31990R2377) noopt tot wijziging van
      de gegevens op grond waarvan een registratie is verleend, dan wel tot intrekking van een registratie, neemt de
      registratiehouder binnen zestig dagen na de bekendmaking van eerstbedoelde wijziging in het Publicatieblad van de
      Europese Unie alle maatregelen die noodzakelijk zijn voor die wijziging of intrekking.
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel18
  - number: '19'
    text: |-
      De [artikelen 2, eerste lid][ref1], en [19 van de wet][ref2] zijn niet van toepassing op:

      a. homeopathische diergeneesmiddelen die zijn opgenomen in de lijst, bedoeld in [artikel 20, eerste lid][ref3];

      b. diergeneesmiddelen op basis van radioactieve isotopen;

      c. diergeneesmiddelen die aan elk van de volgende voorwaarden voldoen:

      1°. de bepalingen van [hoofdstuk IV van de wet][ref4] zijn niet op die middelen van toepassing;

      2°. zij bevatten geen substanties die zijn aangewezen krachtens [artikel 5 van de wet][ref5];

      3°. zij zijn uitsluitend bestemd voor toepassing bij de volgende dieren, die niet zijn bestemd voor consumptie en
      waarvan in voorkomend geval de eieren evenmin zijn bestemd voor consumptie:

        - aquariumvissen;
        - terrariumdieren;
        - vogels, gehouden in kooien of volières;
        - postduiven;
        - kleine knaagdieren, konijnen en fretten die niet bedrijfsmatig worden gehouden;

      d. halffabrikaten met medicinale werking;

      e. entstoffen die zijn bereid met behulp van uit één of meer dieren geïsoleerde smetstoffen met het oog op de
      incidentele toepassing bij datzelfde dier of diezelfde dieren of dieren die daarmee tezamen worden gehouden;

      f. diergeneesmiddelen die uitsluitend substanties, aangewezen door Onze Minister, als werkzaam bestanddeel
      bevatten;

      g. diergeneesmiddelen die bestemd zijn en uitsluitend worden gebruikt voor toepassing op niet levend materiaal van
      dierlijke herkomst, ter onderkenning van een ziekte of de immunologische status van dieren.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0018901#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0003818#HoofdstukIV
      [ref5]: https://wetten.overheid.nl/BWBR0003818#Artikel5
