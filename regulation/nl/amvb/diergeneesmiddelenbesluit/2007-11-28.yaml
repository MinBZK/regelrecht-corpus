  - number: '41'
    text: |-
      1 Het is verboden diergeneesmiddelen af te leveren in het kader van markthandel, handel te water, straathandel, of
      handel via Internet, inclusief de vorm van handel waarbij diergeneesmiddelen worden afgeleverd aan vaste afnemers
      aan hun woningen en straathandel waarbij diergeneesmiddelen aan willekeurige gegadigden worden afgeleverd anders
      dan op een vaste standplaats.

      2 Het eerste lid is niet van toepassing indien aan elk van de volgende voorwaarden is voldaan:

      a. er worden geen diergeneesmiddelen waarop de bepalingen van [hoofdstuk IV van de wet][ref1] van toepassing zijn
      afgeleverd;

      b. de diergeneesmiddelen worden op de plaats van verkoop duidelijk gescheiden gehouden van andere producten;

      c. de diergeneesmiddelen worden in een dusdanige toestand gehouden dat de kwaliteit voldoende blijft gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0003818
        hoofdstuk: IV
  - number: '42'
    text: |-
      1 Het is de dierenarts en de apotheker verboden een diergeneesmiddel waarop de bepalingen van
      [hoofdstuk IV van de wet][ref1] van toepassing zijn af te leveren aan houders van dieren.

      2 Het eerste lid is niet van toepassing indien de verpakking is voorzien van een aanduiding die goed zichtbaar,
      duidelijk leesbaar en onuitwisbaar is, en de volgende vermeldingen bevat:

      a. het woord «dierenarts», onderscheidenlijk «apotheker»;

      b. de naam en het adres van de betreffende dierenarts of apotheker, en

      c. de datum van afleveren van het diergeneesmiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003818
        hoofdstuk: IV
  - number: 42a
    text: |-
      1 Het recept bevat in ieder geval de volgende informatie:

      a. de datum van uitschrijven;

      b. de benaming en het registratienummer van het voorgeschreven diergeneesmiddel;

      c. de diersoort waarvoor het middel bestemd is;

      d. de af te leveren hoeveelheid;

      e. de naam en het adres van de betreffende dierenarts;

      f. de naam van de ontvanger en het adres of uniek bedrijfsnummer van de locatie waar de dieren, waarvoor het recept
      bedoeld is, gehouden worden;

      g. in voorkomend geval, de in acht te nemen wachttermijn en

      h. de handtekening van de betreffende dierenarts.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de inhoud van recepten en het uitschrijven
      en afgeven daarvan, alsmede omtrent het voorschrijven van diergeneesmiddelen door dierenartsen.
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel42a
  - number: '43'
    text: |-
      1 Het is verboden diergeneesmiddelen, afkomstig van een derde land, in Nederland in het vrije verkeer te brengen.

      2 Het eerste lid is niet van toepassing indien degene die het diergeneesmiddel in het vrije verkeer brengt beschikt
      over een vergunning als bedoeld in [artikel 21 van de wet][ref1] voor het bereiden van dat diergeneesmiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
  - number: '44'
    text: |-
      1 Het is verboden diergeneesmiddelen, afkomstig van een derde land, die in Nederland in het vrije verkeer zijn
      gebracht, door te voeren naar een lidstaat.

      2 Het eerste lid is niet van toepassing indien bij de diergeneesmiddelen een bewijsstuk is gevoegd waaruit blijkt
      dat degene die de middelen doorvoert beschikt over een vergunning als bedoeld in [artikel 43, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel43
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '43'
        hoofdstuk: IV
  - number: '45'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de invoer, uitvoer en doorvoer van
      diergeneesmiddelen. Daarbij kan onder meer worden bepaald dat degene die diergeneesmiddelen invoert de
      registratiehouder of Onze Minister daarvan op de hoogte stelt.
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel45
  - number: '46'
    text: |-
      1 Het is verboden een door Onze Minister, in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en
      Sport, aangewezen substantie aan landbouwhuisdieren of aquacultuurdieren toe te dienen.

      2 Onze Minister kan, in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport, bepalen
      onder welke omstandigheden een substantie als bedoeld in het eerste lid, in afwijking van het eerste lid aan
      landbouwhuisdieren of aquacultuurdieren mag worden toegediend.

      3 In afwijking van [artikel 2, tweede lid, aanhef in samenhang met onderdeel b, van de wet][ref1] is het verboden
      om een substantie als bedoeld in het eerste lid die wordt doorgevoerd of bestemd is voor uitvoer te bereiden,
      voorhanden of in voorraad te hebben en af te leveren.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '2'
  - number: '47'
    text: |-
      1 Onze Minister schorst de vergunning, bedoeld in [artikel 21, eerste lid, van de wet][ref1] voor het bereiden,
      en in voorkomend geval verpakken of etiketteren, van een diergeneesmiddel geheel of gedeeltelijk gedurende een
      door hem te bepalen periode, indien de houder van die vergunning een diergeneesmiddel dat, onderscheidenlijk een
      substantie die krachtens een communautaire maatregel niet aan landbouwhuisdieren of aquacultuurdieren mag worden
      toegediend heeft bereid dan wel voorhanden of in voorraad heeft of heeft gehad.

      2 Onze Minister trekt de vergunning, bedoeld in het eerste lid, definitief in indien de houder van die vergunning
      voor een tweede keer een diergeneesmiddel dat, onderscheidenlijk een substantie die krachtens een communautaire
      maatregel niet aan landbouwhuisdieren of aquacultuurdieren mag worden toegediend heeft bereid dan wel voorhanden of
      in voorraad heeft of heeft gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
  - number: '48'
    text: |-
      De [artikelen 46, derde lid][ref1], en [47][ref2] zijn niet van toepassing ingeval het diergeneesmiddel of de
      substantie, bedoeld in die artikelen, aantoonbaar is bestemd voor een andere toepassing dan de toediening aan
      landbouwhuisdieren of aquacultuurdieren in een lidstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0018901#Artikel47
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '46'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0018901
        artikel: '47'
        hoofdstuk: V
  - number: '49'
    text: |-
      Het bestuur van het Productschap Diervoeder stelt bij verordening eisen aan de vergunning, bedoeld in
      [artikel 33, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel33
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '33'
  - number: '50'
    text: |-
      Degene die halffabrikaten met medicinale werking bereidt, verpakt, etiketteert of aflevert beschikt over een
      vergunning als bedoeld in [artikel 33, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel33
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '33'
  - number: '51'
    text: |-
      1 Het is verboden om een halffabrikaat met medicinale werking te bereiden uit een voormengsel met medicinale
      werking dat niet is geregistreerd.

      2 Het is verboden om een halffabrikaat met medicinale werking te bereiden uit meer dan één voormengsel met
      medicinale werking.
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel51
  - number: '52'
    text: |-
      1 Bij de verwerking van een voormengsel met medicinale werking tot een halffabrikaat met medicinale werking worden
      de voorschriften in acht genomen over die verwerking zoals vastgesteld bij de registratie van dat voormengsel.

      2 Een halffabrikaat met medicinale werking wordt op zodanige wijze bereid dat het daarin verwerkte voormengsel met
      medicinale werking zijn werkzaamheid behoudt.
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel52
  - number: '53'
    text: |-
      1 Bij ministeriële regeling kan worden bepaald dat degene die halffabrikaten met medicinale werking bereidt daarvan
      opgave doet overeenkomstig bij ministeriële regeling te stellen regels.

      2 De regels, bedoeld in het eerste lid, kunnen in elk geval betrekking hebbenop de bij de opgave te vermelden
      gegevens, de frequentie van opgave en degene aan wie opgave wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel53
  - number: '54'
    text: |-
      De verpakking van een halffabrikaat met medicinale werking voldoet aan elk van de volgende voorwaarden:

      a. zij is van een zodanige aard en kwaliteit dat:

      1°. zij is bestand tegen elke normale behandeling;

      2°. niets van de inhoud kan ontsnappen;

      3°. zij is geschikt om de samenstelling en de zuiverheid van het daarin verpakte halffabrikaat te waarborgen
      gedurende de aangegeven houdbaarheidstermijn onder de voorgeschreven of aanbevolen bewaaromstandigheden;

      b. de sluiting is van zodanige aard dat deze niet zonder zichtbare en onherstelbare beschadiging kan worden
      geopend.
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel54
  - number: '55'
    text: |-
      1 Op of aan de verpakking van een halffabrikaat met medicinale werking, of in voorkomend geval de bijsluiter
      daarbij, komen de volgende aanduidingen en vermeldingen voor:

      a. het gewicht van het halffabrikaat;

      b. de naam, het registratienummer en de hoeveelheid werkzame stof van het voormengsel met medicinale werking dat in
      het halffabrikaat is verwerkt;

      c. de voorschriften inzake de verwerking van het voormengsel met medicinale werking in het gemedicineerde voeder
      zoals vastgesteld bij de registratie van dat voormengsel;

      d. dat het halffabrikaat niet als zodanig aan dieren mag worden toegediend maar uitsluitend via gemedicineerd
      voeder;

      e. de in acht te nemen veiligheidsmaatregelen;

      f. de uiterste gebruiksdatum, rekening houdend met het voormengsel met medicinale werking in het halffabrikaat.

      2 Indien een halffabrikaat met medicinale werking onverpakt wordt afgeleverd, worden de aanduidingen en
      vermeldingen in afwijking van het eerste lid op een het halffabrikaat begeleidend document geplaatst.
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel55
  - number: '56'
    text: |-
      1 De aanduidingen en vermeldingen, bedoeld in [artikel 55][ref1], voldoen aan elk van de volgende voorwaarden:

      a. zij zijn gesteld in de Nederlandse taal of, ingeval een halffabrikaat met medicinale werking is bestemd voor
      uitvoer, in de taal van het land van bestemming;

      b. zij zijn goed leesbaar en onuitwisbaar.

      2 Andere aanduidingen en vermeldingen dan die bedoeld in het eerste lid kunnen uitsluitend op of bij de verpakking,
      onderscheidenlijk het bij een partij behorend begeleidend document, worden geplaatst voor zover zij:

      a. niet in strijd zijn met de voorgeschreven aanduidingen of vermeldingen;

      b. niet misleidend zijn ten aanzien van de aard, samenstelling, eigenschappen en toepassingswijze van het
      halffabrikaat met medicinale werking.


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel55
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '55'
        hoofdstuk: VI
        paragraaf: '2'
  - number: '57'
    text: |-
      1 Het is verboden om halffabrikaten met medicinale werking af te leveren.

      2 Het eerste lid is niet van toepassing op het afleveren van halffabrikaten met medicinale werking aan:

      a. houders van een vergunning als bedoeld in [artikel 33, eerste lid, van de wet][ref1] voor het bereiden van
      gemedicineerde voeders;

      b. afnemers in andere landen dan lidstaten.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel33
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '33'
  - number: '58'
    text: |-
      Voormengsels met medicinale werking of halffabrikaten met medicinale werking worden bewaard in afgesloten ruimten
      of in naar categorie hermetisch afgesloten recipiënten, die speciaal zijn ontworpen voor het bewaren van deze
      producten.
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel58
  - number: '59'
    text: |-
      Vervoer van een halffabrikaat met medicinale werking in bulk vindt plaats in transportmiddelen of containers die
      op zodanige wijze zijn gereinigd, dat ongewenste wisselwerking met of besmetting van een later daarmee te vervoeren
      halffabrikaat met medicinale werking of gemedicineerd voeder wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel59
  - number: '60'
    text: |-
      1 Met halffabrikaten met medicinale werking als bedoeld in dit besluit worden gelijkgesteld halffabrikaten met
      medicinale werking die rechtmatig zijn vervaardigd of in de handel zijn gebracht in een andere lidstaat van de
      Europese Unie dan wel rechtmatig zijn vervaardigd in een staat, niet zijnde een lidstaat van de Europese Unie, die
      partij is bij een daartoe strekkend of mede daartoe strekkend verdrag dat Nederland bindt, en die voldoen aan eisen
      die een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het niveau dat met de nationale eisen wordt
      nagestreefd.

      2 De aanduidingen op of aan de verpakking van halffabrikaten met medicinale werking, bedoeld in het eerste lid, of
      in voorkomend geval de bijsluiter daarbij, zijn gesteld in de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel60
  - number: '61'
    text: |-
      Het is verboden om gemedicineerd voeder te bereiden uit meer dan één voormengsel met medicinale werking of
      halffabrikaat met medicinale werking.
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel61
  - number: '62'
    text: |-
      1 Gemedicineerd voeder wordt op zodanige wijze bereid dat aan elk van de volgende voorwaarden is voldaan:

      a. de voorschriften inzake de verwerking van het voormengsel met medicinale werking in het gemedicineerde voeder
      zoals vastgesteld bij de registratie van dat voormengsel, zijn in acht genomen;

      b. het daarin gebruikte diervoeder en het daarin verwerkte voormengsel met medicinale werking of halffabrikaat met
      medicinale werking zijn vermengd tot een homogeen en stabiel product ontstaat;

      c. het daarin verwerkte voormengsel met medicinale werking of halffabrikaat met medicinale werking heeft zijn
      werkzaamheid behouden;

      d. een ongewenste wisselwerking tussen de daarin verwerkte diergeneesmiddelen, toevoegingsmiddelen en diervoeders
      is uitgesloten;

      e. het gemedicineerde voeder is ten minste houdbaar gedurende het tijdvak dat het is voorgeschreven.

      2 Ingeval in het gemedicineerde voeder een voormengsel met medicinale werking of halffabrikaat met medicinale
      werking wordt gebruikt dat antibiotica of coccidiostatica bevat, bevat het voor de bereiding van het gemedicineerde
      voeder te gebruiken diervoeder niet dezelfde antibiotica of coccidiostatica.
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel62
  - number: '63'
    text: |-
      1 Op of bij de verpakking van gemedicineerd voeder dat wordt afgeleverd komen de aanduidingen of vermeldingen
      voor die bij de registratie van het zich daarin bevindende voormengsel met medicinale werking zijn voorgeschreven,
      alsmede de woorden «gemedicineerd voeder».

      2 Indien gemedicineerd voeder onverpakt wordt afgeleverd, worden de aanduidingen en vermeldingen in afwijking van
      het eerste lid op een het gemedicineerd voeder begeleidend document geplaatst.
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel63
  - number: '64'
    text: |-
      1 Aan de houder van voedselproducerende dieren wordt geen gemedicineerd voeder afgeleverd in een grotere
      hoeveelheid dan is voorgeschreven in het recept dat voor de behandeling van de betrokken dieren is afgegeven door
      een dierenarts.

      2 Onverminderd het eerste lid wordt geen grotere hoeveelheid aan gemedicineerd voeder afgeleverd dan benodigd voor
      de behandeling van de in het recept aangewezen dieren gedurende één maand.
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel64
  - number: '65'
    text: |-
      1 Het is verboden om gemedicineerd voeder waarvoor een wachttermijn geldt af te leveren aan degene die
      bedrijfsmatig dieren houdt, zonder daarbij schriftelijk de noodzakelijke gegevens te verstrekken omtrent dat
      gemedicineerde voeder.

      2 Bij ministeriële regeling kunnen nadere voorschriften worden gesteld met betrekking tot het verstrekken van de
      gegevens, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel65
  - number: '66'
    text: |-
      1 Het is degene die bedrijfsmatig dieren houdt verboden gemedicineerd voeder aan dieren te vervoederen.

      2 Het eerste lid is niet van toepassing indien de houder van de dieren in het bezit is van:

      a. een bewijsstuk waaruit blijkt dat het gemedicineerde voeder afkomstig is van een houder van een vergunning als
      bedoeld in [artikel 33 van de wet][ref1], of

      b. een verklaring als bedoeld in [artikel 67, tweede lid, onderdeel c][ref2], van dit besluit of een afschrift
      daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0018901#Artikel67
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '33'
      - id: ref2
        bwb_id: BWBR0018901
        artikel: '67'
        hoofdstuk: VI
        paragraaf: '3'
  - number: '67'
    text: |-
      1 Het is verboden om gemedicineerd voeder, waarin een niet in Nederland geregistreerd voormengsel met medicinale
      werking is verwerkt, uit een lidstaat in te voeren en voorhanden of in voorraad te hebben.

      2 Het eerste lid is niet van toepassing indien aan elk van de volgende voorwaarden is voldaan:

      a. het gemedicineerde voeder is bereid in een lidstaat, overeenkomstig de voorschriften van [richtlijn nr. 90/167/
      EEG](31990L0167);

      b. het in dat gemedicineerde voeder verwerkte voormengsel met medicinale werking:

      1°. is geregistreerd in de lidstaat, bedoeld in onderdeel a;

      2°. bevat dezelfde werkzame stoffen als een in Nederland geregistreerd voormengsel met medicinale werking en bezit
      een soortgelijke kwalitatieve en kwantitatieve samenstelling als dat voormengsel;

      c. de zending gaat vergezeld van een volledig ingevulde verklaring als bedoeld in artikel 10, derde lid, van
      [richtlijn nr. 90/167/EEG](31990L0167), die is afgegeven door de bevoegde instantie van de lidstaat waarvan het
      gemedicineerde voeder afkomstig is.
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel67
  - number: '68'
    text: |-
      De bepalingen met betrekking tot halffabrikaten met medicinale werking, neergelegd in de [artikelen 54][ref1],
      [58][ref2] en [59][ref3], zijn van overeenkomstige toepassing op gemedicineerde voeders.


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0018901#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0018901#Artikel59
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '54'
        hoofdstuk: VI
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018901
        artikel: '58'
        hoofdstuk: VI
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0018901
        artikel: '59'
        hoofdstuk: VI
        paragraaf: '2'
  - number: '69'
    text: |-
      1 Het is een dierenarts verboden om gemedicineerd voeder voor te schrijven:

      a. dat is bereid met een voormengsel met medicinale werking dat niet is geregistreerd, tenzij het voormengsel
      dezelfde werkzame stoffen bevat als een in Nederland geregistreerd voormengsel met medicinale werking en een
      soortgelijke kwalitatieve en kwantitatieve samenstelling als dat voormengsel bezit;

      b. dat is bereid met een diergeneesmiddel waarvan verwerking tot een voormengsel met medicinale werking niet bij
      registratie van dat middel is toegestaan;

      c. anders dan met inachtneming van de bij de registratie van het daarin verwerkte dan wel te verwerken
      diergeneesmiddel gegeven voorschriften;

      d. in een hoeveelheid die groter is dan nodig voor de behandeling, ingevolge de door hem gestelde diagnose;

      e. dat als werkzame stof hetzelfde antibioticum of coccidiostaticum bevat dat gewoonlijk als toevoegingsmiddel is
      verwerkt in het diervoeder dat de houder van de dieren waarvoor de hulp van de dierenarts is ingeroepen aan deze
      dieren vervoedert.

      2 Het is de dierenarts verboden om gemedicineerd voeder waarvoor een wachttermijn geldt voor te schrijven aan
      degene die bedrijfsmatig dieren houdt, zonder daarbij schriftelijk de noodzakelijke gegevens te verstrekken omtrent
      dat gemedicineerde voeder.

      3 Bij ministeriële regeling kunnen nadere voorschriften worden gesteld met betrekking tot het verstrekken van de
      gegevens, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel69
  - number: '70'
    text: |-
      1 Het is de dierenarts verboden om een recept af te geven voor het afleveren van gemedicineerd voeder:

      a. dat niet voldoet aan bij ministeriële regeling gestelde regels met betrekking tot het model van het recept en de
      daarop te vermelden gegevens;

      b. zonder voorafgaande diagnose met betrekking tot de dieren waarvoor het gemedicineerde voeder is bestemd;

      c. met een geldigheidsduur van meer dan drie maanden;

      d. voor meer dan één behandeling.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het recept, bedoeld in het
      eerste lid.

      3 De regels, bedoeld in het tweede lid, kunnen in elk geval betrekking hebben op het aantal afschriften van het
      recept en de bewaring daarvan.
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel70
  - number: '71'
    text: |-
      Het bestuur van het Productschap Diervoeder stelt bij verordening regels dan wel nadere regels met betrekking tot:

      a. de bereiding van gemedicineerd voeder, bedoeld in
      [artikel 62, eerste lid, aanhef in samenhang met onderdeel a][ref1];

      b. het bewaren van gemedicineerd voeder op een wijze dat aan de eigenschappen en de samenstelling daarvan geen
      afbreuk wordt gedaan;

      c. het etiketteren van gemedicineerd voeder.


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel62
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '62'
        hoofdstuk: VI
        paragraaf: '3'
  - number: '72'
    text: |-
      Het bestuur van het Productschap Diervoeder kan bij verordening regels stellen met betrekking tot het voorhanden
      en in voorraad hebben van gemedicineerde voeders op een bedrijfseenheid waar gewoonlijk bedrijfsmatig dieren worden
      gehouden.
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel72
  - number: '73'
    text: |-
      1 Bij ministeriële regeling worden ter uitvoering van communautaire maatregelen regels als bedoeld in
      [artikel 39, eerste en tweede lid, van de wet][ref1] gesteld.

      2 Bij ministeriële regeling kunnen regels met betrekking tot de controle van de administratie, bedoeld in
      [artikel 40, eerste lid, van de wet][ref2] worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel40
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '39'
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '40'
  - number: '74'
    text: |-
      In aanvulling op [artikel 40, eerste lid, van de wet][ref1] kan bij ministeriële regeling worden bepaald dat uit
      de administratie, bedoeld in dat artikellid, tevens blijkt op welke datum dieren zijn onderzocht en behandeld,
      hun aantal, de diagnose, de aard en hoeveelheid van toegepaste diergeneesmiddelen, de duur van de behandeling en
      voorgeschreven wachttermijnen, alsmede wie de houder van die dieren is.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel40
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '40'
  - number: '75'
    text: |-
      1 Het is toegestaan om een diergeneesmiddel in afwijking van de [artikelen 2, eerste lid][ref1], en
      [21, eerste lid, van de wet][ref2] te bereiden, te verpakken, te etiketteren, voorhanden of in voorraad te hebben,
      af te leveren en bij dieren toe te passen, indien aan elk van de volgende voorwaarden is voldaan:

      a. het diergeneesmiddel verkeert als zodanig dan wel voor wat betreft een uitbreiding van de
      toepassingsmogelijkheden kennelijk in een proefstadium;

      b. Onze Minister heeft voor de proefneming toestemming verleend op aanvraag;

      c. de dieren waarbij het diergeneesmiddel wordt toegepast worden niet gebruikt voor de productie van
      levensmiddelen, tenzij dit naar het oordeel van Onze Minister geen ongunstige gevolgen heeft voor de
      diergezondheid, de menselijke gezondheid of het milieu.

      2 Onze Minister kan toestemming verlenen om in afwijking van [artikel 32 van de wet][ref3] bij de bereiding van
      gemedicineerd voeder gebruik te maken van het diergeneesmiddel waarop een proefneming als bedoeld in het eerste lid
      betrekking heeft. Op dat gemedicineerde voeder is het eerste lid, onderdeel c, van overeenkomstige toepassing.

      3 Aan de toestemming, bedoeld in het eerste lid, onderdeel b, en tweede lid, kunnen voorwaarden worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0003818#Artikel32
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '21'
      - id: ref3
        bwb_id: BWBR0003818
        artikel: '32'
  - number: '76'
    text: |-
      1 Bij ministeriële regeling worden regels gesteld omtrent het indienen van een aanvraag om toestemming als bedoeld
      in [artikel 75, eerste lid, onderdeel b, en tweede lid][ref1], de verlenging of wijziging daarvan alsmede omtrent
      de wijze van behandeling.

      2 De regels, bedoeld in het eerste lid, kunnen onder meer betrekking hebben op de gegevens en bescheiden die moeten
      worden overgelegd alvorens een aanvraag in behandeling wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel75
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '75'
        hoofdstuk: VII
        paragraaf: '3'
  - number: '77'
    text: |-
      De ambtenaren, bedoeld in [artikel 52 van de wet][ref1], zijn bevoegd om van landbouwhuisdieren monsters te nemen
      van lichaamsvloeistoffen en uitscheidingsproducten, alsmede om van aquacultuurdieren en het vangstwater monsters
      te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel52
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '52'
  - number: '78'
    text: |-
      Op een monster dat op grond van [artikel 77][ref1] is genomen zijn de [artikelen 56][ref2] en [57 van de wet][ref3]
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0003818#Artikel57
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '77'
        hoofdstuk: VII
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '56'
      - id: ref3
        bwb_id: BWBR0003818
        artikel: '57'
  - number: '79'
    text: |-
      1 Indien in een monster, afkomstig van een landbouwhuisdier, aquacultuurdier of vangstwater, dan wel van een
      product, afkomstig van die dieren, residuen van diergeneesmiddelen of substanties die krachtens een communautaire
      maatregel niet aan landbouwhuisdieren of aquacultuurdieren mogen worden toegediend worden aangetroffen, worden de
      kosten van onderzoeken als bedoeld in artikel 16 van [richtlijn nr. 96/23/EG](31996L0023) in rekening gebracht bij
      de eigenaar of de houder van de bemonsterde dieren dan wel van de dieren waarvan de bemonsterde producten afkomstig
      zijn.

      2 Onze Minister kan regels stellen omtrent de aard van de in het eerste lid bedoelde kosten, de hoogte van die
      kosten, het verschuldigd worden van die kosten en de wijze waarop die kosten in rekening worden gebracht.
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel79
  - number: '80'
    text: |-
      Indien de uitkomst van de analyse van een monster wordt aangevochten, wordt die analyse op kosten van ongelijk
      bevestigd door het nationale referentielaboratorium dat overeenkomstig artikel 14, eerste lid, van [richtlijn nr.
      96/23/EG](31996L0023) voor de analyse van het residu of de substantie in het monster is aangewezen.
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel80
  - number: '81'
    text: |-
      Onverminderd [artikel 19 van de wet][ref1] is het verboden om een diergeneesmiddel aan te bevelen of aan te prijzen
      aan het publiek ingeval dat diergeneesmiddel aan een van de volgende voorwaarden voldoet:

      a. het mag uitsluitend op recept van een dierenarts worden verstrekt;

      b. het bevat psychotrope stoffen of verdovende middelen als bedoeld in [lijst I][ref2] en
      [II bij de Opiumwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0001941
      [ref3]: https://wetten.overheid.nl/BWBR0001941
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0001941
      - id: ref3
        bwb_id: BWBR0001941
  - number: '82'
    text: |-
      1 Het is verboden in strijd te handelen met de artikelen 38, vierde lid, 41, 47, derde alinea, 48, 49, eerste,
      tweede, derde en vijfde lid, van [verordening (EG) nr. 726/2004](32004R0726).

      2 Onze Minister is de bevoegde autoriteit, bedoeld in artikel 39, zevende lid, van [verordening (EG) nr. 726/2004]
      (32004R0726) alsmede de bevoegde nationale instantie, bedoeld in artikel 47, derde alinea, van [verordening (EG)
      nr. 726/2004](32004R0726).
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel82
  - number: '83'
    text: |-
