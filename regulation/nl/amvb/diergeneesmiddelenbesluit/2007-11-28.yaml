  - number: '84'
    text: |-
      1 [Artikel 4][ref1] is niet van toepassing indien een aanvrager tot registratie van een diergeneesmiddel naar
      gegevens verwijst die door een registratiehouder van eenzelfde diergeneesmiddel met het oog op de aanvraag tot
      registratie van dat middel in een lidstaat zijn verstrekt vóór het tijdstip van inwerkingtreding van dit besluit.

      2 Een verwijzen als bedoeld in het eerste lid is verboden zolang nog geen 10 jaar zijn verstreken sinds de eerdere
      registratie, tenzij de eerdere aanvrager schriftelijk heeft verklaard tegen een dergelijk verwijzen geen bezwaar
      te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel4
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '4'
        hoofdstuk: II
        paragraaf: '2'
  - number: '85'
    text: |-
      Een vergunning als bedoeld in [artikel 21 van de wet][ref1] voor het afleveren van een diergeneesmiddel die is
      verleend ten behoeve van de invoer van dat diergeneesmiddel, wordt voor de toepassing van [artikel 43][ref2]
      gelijkgesteld met een vergunning als bedoeld in [artikel 21 van de wet][ref3] voor het bereiden van dat
      diergeneesmiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0018901#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel85
    references:
