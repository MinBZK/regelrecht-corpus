        paragraaf: '6'
  - number: '24'
    text: |-
      1 Indien bij een voedselproducerend dier een middel als bedoeld in [artikel 22][ref1] wordt toegepast, schrijft de
      dierenarts de wachttermijn voor die op grond van diergeneeskundige inzichten noodzakelijk is om te garanderen dat
      de producten, afkomstig van het dier, geen residuen bevatten die gevaarlijk zijn voor de consument.

      2 De wachttermijn, bedoeld in het eerste lid, is ten minste even lang als de wachttermijn die met betrekking tot
      de diersoort waartoe het dier behoort is aangegeven bij het middel, of, indien geen wachttermijn is aangegeven,
      ten minste:

      a. 7 dagen voor melk en eieren;

      b. 28 dagen voor vlees van pluimvee of zoogdieren, met inbegrip van vet en slachtafval;

      c. 500 graaddagen voor visvlees.

      3 In afwijking van het tweede lid, onderdelen a, b en c, bedraagt de wachttermijn ten minste 0 dagen of graaddagen
      indien het middel een homeopathisch diergeneesmiddel is dat uitsluitend de werkzame bestanddelen bevat die zijn
      vermeld in bijlage II bij [verordening (EG) nr. 2377/90](31990R2377).

      4 Bij ministeriële regeling kunnen wachttermijnen worden voorgeschreven in afwijking van of in aanvulling op het
      tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel22
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel24
