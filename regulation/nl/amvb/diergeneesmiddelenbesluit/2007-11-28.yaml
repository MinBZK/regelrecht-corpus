  - number: '26'
    text: |-
      Bij ministeriële regeling worden ter uitvoering van communautaire maatregelen eisen als bedoeld in
      [artikel 23, eerste lid, van de wet][ref1] gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel23
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel26
