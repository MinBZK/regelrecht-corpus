  - number: '22'
    text: |-
      1 Indien er in Nederland geen diergeneesmiddel beschikbaar is dat is geregistreerd om een bepaalde
      aandoening, ziekte, ziekteverschijnsel, pijn, verwonding of gebrek bij een dier te genezen, lenigen
      of voorkomen, is het de dierenarts bij diergeneeskundige noodzaak toegestaan om, in afwijking van
      [artikel 2, eerste lid, van de wet][ref1], en met inachtneming van de [artikelen 23][ref2] en [24][ref3], de
      volgende middelen toe te passen bij een dier en in verband daarmee in voorraad of voorhanden te hebben:

      a. diergeneesmiddelen die zijn geregistreerd om te worden toegepast bij:

      1°. andere diersoorten om een aandoening, ziekte, ziekteverschijnsel, pijn, verwonding of gebrek bij een dier te
      genezen, lenigen of voorkomen, of

      2°. dezelfde diersoort om een andere aandoening, ziekte, ziekteverschijnsel, pijn, verwonding of gebrek bij een
      dier te genezen, lenigen of voorkomen;

      b. ingeval geen diergeneesmiddelen als bedoeld in onderdeel a beschikbaar zijn:

      1°. geneesmiddelen als bedoeld in [artikel 1, eerste lid, onder b, van de Geneesmiddelenwet][ref4], of

      2°. diergeneesmiddelen die overeenkomstig [richtlijn nr. 2001/82/EG](32001L0082) in een lidstaat zijn toegelaten
      om dezelfde of een andere aandoening, ziekte, ziekteverschijnsel, pijn, verwonding of gebrek te genezen, lenigen of
      voorkomen bij een dier van dezelfde diersoort of:

        - een andere diersoort, ingeval het dier niet voedselproducerend is;
        - een andere voedselproducerende diersoort, ingeval het dier voedselproducerend is.

      2 Het eerste lid is van overeenkomstige toepassing op een persoon die onder de directe verantwoordelijkheid van een
      dierenarts middelen als bedoeld in het eerste lid toedient.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018901#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0018901#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0021505#Artikel1
