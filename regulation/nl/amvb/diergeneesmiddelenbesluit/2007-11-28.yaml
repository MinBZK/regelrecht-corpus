  - number: '6'
    text: |-
      1 In afwijking van [artikel 6, tweede lid, van de wet][ref1] wordt de registratie voor onbepaalde tijd verlengd
      nadat daartoe door de registratiehouder een aanvraag op de krachtens [artikel 3, tweede lid, van de wet][ref2]
      voorgeschreven wijze is ingediend, tenzij Onze Minister, in overeenstemming met Onze Minister van Volksgezondheid,
      Welzijn en Sport, besluit de registratie eenmaal met vijf jaar te verlengen.

      2 In afwijking van [artikel 6, tweede lid, van de wet][ref3] wordt een registratie die binnen het tijdvak van
      vijf jaar voor het tijdstip van inwerkingtreding van dit besluit is verlengd, aangemerkt als een registratie voor
      onbepaalde tijd.


