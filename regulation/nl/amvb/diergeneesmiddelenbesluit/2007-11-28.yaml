  - number: '23'
    text: |-
      1 Een middel als bedoeld in [artikel 22][ref1] dat wordt toegepast bij een voedselproducerend dier bevat
      uitsluitend werkzame stoffen die zijn opgenomen in bijlage I, II of III bij [verordening (EG) nr. 2377/90]
      (31990R2377).

      2 Onze Minister kan werkzame stoffen aanwijzen die in afwijking van het eerste lid aan voedselproducerende
      paardachtigen mogen worden toegediend.


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel22
