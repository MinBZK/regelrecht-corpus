        artikel: '19'
  - number: '21'
    text: |-
      1 De vermelding van een diergeneesmiddel op de lijst, bedoeld in [artikel 20, eerste lid][ref1], wordt doorgehaald
      in de volgende gevallen:

      a. op verzoek van degene op wiens verzoek het desbetreffende diergeneesmiddel in die lijst is opgenomen;

      b. indien zich een van de volgende gevallen voordoet:

      1°. het diergeneesmiddel past niet meer in de veterinaire homeopathie, onder meer door zijn bereiding en de
      aanbevolen toepassingswijze;

      2°. het diergeneesmiddel is bij de aanbevolen toepassingswijze schadelijk voor de gezondheid van mens of dier.

      2 De datum van doorhaling wordt niet gesteld op een datum die vroeger ligt dan zes maanden na de datum waarop
      het besluit tot doorhaling is genomen, tenzij een onverwijlde doorhaling naar het oordeel van Onze Minister
      noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel20
