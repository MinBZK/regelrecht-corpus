        bwb_id: BWBR0018901
        artikel: '32'
        hoofdstuk: III
        paragraaf: '3'
  - number: '34'
    text: |-
      1 Het is verboden om een diergeneesmiddel als bedoeld in [artikel 2, tweede lid, onderdeel a, van de wet][ref1], in
      voorraad te hebben.

      2 Het is de dierenarts verboden om grondstoffen of substanties, bestemd voor de bereiding van een diergeneesmiddel
      als bedoeld in [artikel 2, tweede lid, onderdeel a, van de wet][ref2], in voorraad of voorhanden te hebben in een
      grotere hoeveelheid dan noodzakelijk voor de bereiding onder de voorwaarden, gesteld in [artikel 32][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0018901#Artikel32
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0018901
        artikel: '32'
        hoofdstuk: III
        paragraaf: '3'
  - number: '35'
    text: |-
      Een lokaliteit als bedoeld in [artikel 32, onderdeel d][ref1], voldoet aan elk van de volgende voorwaarden:

      a. de lokaliteit is voldoende groot en zodanig ingericht dat daarin alle handelingen, benodigd voor de bereiding
      van een diergeneesmiddel als bedoeld in [artikel 2, tweede lid, onderdeel a, van de wet][ref2], naar behoren kunnen
      worden verricht;

      b. de lokaliteit is goed onderhouden, schoon, opgeruimd en goed verlicht;

      c. de lokaliteit is voorzien van een zodanige klimaatbeheersing dat de temperatuur en de vochtigheidsgraad geen
      ongewenste invloed uitoefenen op de zich daarin bevindende grondstoffen en diergeneesmiddelen;

      d. de lokaliteit is voorzien van een vlakke, gladde en ondoorlaatbare vloer, zonder scheuren of open afvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel2
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '32'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '2'
  - number: '36'
    text: Deze paragraaf is niet van toepassing op halffabrikaten met medicinale werking.
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel36
  - number: '37'
    text: |-
      1 De verpakking van een diergeneesmiddel voldoet aan elk van de volgende voorwaarden:

      a. zij is bestand tegen elke normale behandeling;

      b. de inhoud kan niet ontsnappen, en

      c. zij is geschikt om de samenstelling en de zuiverheid van het daarin verpakte diergeneesmiddel te waarborgen
      gedurende de aangegeven houdbaarheidstermijn onder de voorgeschreven of aanbevolen bewaaromstandigheden.

      2 De sluiting van de primaire verpakking en, in voorkomend geval, van de buitenverpakking is van zodanige aard dat
      deze niet zonder zichtbare en onherstelbare beschadiging kan worden geopend.
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel37
  - number: '38'
    text: |-
      Bij ministeriële regeling worden ter uitvoering van communautaire maatregelen regels gesteld met betrekking tot het
      etiketteren van diergeneesmiddelen.
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel38
  - number: '39'
    text: |-
      1 Het is verboden om een diergeneesmiddel af te leveren aan houders van dieren indien:

      a. de houdbaarheidstermijn is verstreken;

      b. de aanduidingen op de primaire verpakking en in voorkomend geval de buitenverpakking of bijsluiter onleesbaar
      zijn of daarin wijzigingen zijn aangebracht, of

      c. de oorspronkelijke sluiting van de primaire verpakking en in voorkomend geval de buitenverpakking is verbroken.

      2 Het eerste lid, aanhef in samenhang met onderdeel c, is niet van toepassing ingeval een diergeneesmiddel door een
      dierenarts of apotheker wordt afgeleverd, onder voorwaarde dat de oorspronkelijke sluiting is vervangen door een
      sluiting welke is voorzien van de naam en het adres van de betreffende dierenarts of apotheker.
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel39
  - number: '40'
    text: |-
      1 Het is verboden om een diergeneesmiddel af te leveren zonder verpakking, tenzij aan elk van de volgende
      voorwaarden is voldaan:

      a. het diergeneesmiddel wordt afgeleverd aan de houder van een vergunning als bedoeld in de [artikelen 21][ref1]
      of [33 van de wet][ref2];

      b. bij het diergeneesmiddel is een document gevoegd dat de gegevens bevat die krachtens [artikel 38][ref3] op de
      verpakking van het diergeneesmiddel moeten worden vermeld.

      2 Het is verboden om een diergeneesmiddel af te leveren zonder buitenverpakking, tenzij alle informatie die
      krachtens [artikel 38][ref4] op de buitenverpakking moet worden geplaatst, is aangebracht op de primaire
      verpakking.

      3 Het is verboden om een diergeneesmiddel af te leveren zonder bijsluiter, tenzij alle informatie die krachtens
      [artikel 38][ref5] op de bijsluiter moet worden geplaatst, is aangebracht op de verpakking.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0018901#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0018901#Artikel38
      [ref5]: https://wetten.overheid.nl/BWBR0018901#Artikel38
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel40
