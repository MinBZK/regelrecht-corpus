  - number: '20'
    text: |-
      1 Onze Minister houdt een lijst van homeopathische diergeneesmiddelen bij waarop de
      [artikelen 2, eerste lid][ref1], en [19 van de wet][ref2] niet van toepassing zijn.

      2 Bij ministeriële regeling worden regels gesteld met betrekking tot:

      a. de inrichting van die lijst;

      b. de wijze waarop kennis kan worden genomen van de in die lijst opgenomen gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel19
