  - number: '2'
    text: |-
      De wijziging van een communautaire maatregel waarnaar in dit besluit of in regels, gesteld krachtens de wet
      of dit besluit, wordt verwezen, gaat voor de toepassing van dit besluit en de regels, gesteld krachtens de wet
      of dit besluit, gelden met ingang van de dag waarop aan die wijziging uitvoering moet zijn gegeven, tenzij bij
      ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel2
  - number: '3'
    text: |-
      1 De vergoeding, bedoeld in [artikel 3, derde lid, van de wet][ref1], is jaarlijks verschuldigd met ingang van de
      dertiende kalendermaand nadat een aanvraag tot registratie van een diergeneesmiddel is ingediend.

      2 Bij ministeriële regeling worden regels gesteld met betrekking tot:

      a. de hoogte van de vergoeding;

      b. de wijze en het tijdstip van betaling van de vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel3
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '3'
  - number: '4'
    text: |-
      1 In afwijking van [artikel 3, vijfde lid, van de wet][ref1] is het volgende aanvragers tot registratie van
      een diergeneesmiddel niet toegestaan om naar gegevens te verwijzen die door een registratiehouder van eenzelfde
      diergeneesmiddel met het oog op de aanvraag tot registratie van dat middel in een lidstaat zijn verstrekt zolang
      nog geen 8 jaar zijn verstreken sinds die eerdere registratie.

      2 Een registratie als bedoeld in het eerste lid die aan een volgende aanvrager wordt verleend gaat niet eerder
      in dan:

      a. 13 jaar na het tijdstip waarop de eerdere registratie is verleend, ingeval de registratie betrekking heeft op
      diergeneesmiddelen die zijn bestemd om te worden toegepast bij bijen of vissen;

      b. 10 jaar na het tijdstip waarop de eerdere registratie is verleend, behoudens het in het derde lid bepaalde, in
      overige gevallen.

      3 Ingeval de eerdere registratie binnen de periode van vijf jaar nadat die is verleend wordt gewijzigd teneinde het
      aantal diersoorten waarop de registratie betrekking heeft uit te breiden, wordt de termijn, bedoeld in het tweede
      lid, onderdeel b, per voedselproducerend diersoort waarmee de registratie wordt uitgebreid telkens met een jaar
      verlengd tot ten hoogste drie jaar, indien aan elk van de volgende voorwaarden is voldaan:

      a. het diergeneesmiddel bevat een nieuwe werkzame stof die op 30 april 2004 nog niet was opgenomen op bijlage I,
      II, of III bij [verordening (EEG) nr. 2377/90](31990R2377), en

      b. de registratiehouder heeft een aanvraag ingediend tot vaststelling van de maximumwaarden voor residuen van
      de werkzame stof in de diersoort waarop de uitbreiding betrekking heeft, overeenkomstig [verordening (EEG) nr.
      2377/90](31990R2377).

      4 Bij ministeriële regeling kunnen in aanvulling op het tweede lid, onderdeel a, diersoorten worden aangewezen
      waarop de termijn, bedoeld in dat onderdeel, eveneens van toepassing is.

      5 Voor de toepassing van dit artikel worden wijzigingen of uitbreidingen van een registratie, alsmede nieuwe
      registraties die tot doel hebben de toepassing van een geregistreerd diergeneesmiddel uit te breiden tot andere
      diersoorten of andere concentraties, farmaceutische vormen, toedieningswijzen of aanbiedingsvormen van dat
      diergeneesmiddel mogelijk te maken, geacht onderdeel uit te maken van de oorspronkelijke registratie.

      6 Dit artikel is niet van toepassing ingeval de registratiehouder schriftelijk heeft verklaard geen bezwaar te
      hebben tegen een verwijzen als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel3
