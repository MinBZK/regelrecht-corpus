        artikel: '23'
  - number: '27'
    text: |-
      Het is de houder van een vergunning als bedoeld in [artikel 21, eerste lid, van de wet][ref1] verboden om
      diergeneesmiddelen te bereiden, te verpakken, te etiketteren of af te leveren, anders dan met inachtneming van de
      eisen, bedoeld in [artikel 26][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0018901#Artikel26
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0018901
        artikel: '26'
        hoofdstuk: III
        paragraaf: '1'
  - number: '28'
    text: |-
      De houder van een vergunning als bedoeld in [artikel 21, eerste lid, van de wet][ref1] draagt er zorg voor dat de
      handelingen, genoemd in die vergunning, worden verricht overeenkomstig de gegevens op grond waarvan registratie van
      een in de vergunning genoemde diergeneesmiddel is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
  - number: '29'
    text: |-
      1 De houder van een vergunning als bedoeld in [artikel 21, eerste lid, van de wet][ref1] voor het bereiden,
      verpakken of etiketteren van een diergeneesmiddel evalueert regelmatig de methoden van bereiding, verpakking en
      etikettering.

      2 De evaluatie, bedoeld in het eerste lid, heeft tot doel verbeteringen aan te brengen in de methoden van
      bereiding, verpakking en etikettering die nodig zijn om te waarborgen dat het diergeneesmiddel volgens algemeen
      aanvaarde wetenschappelijke methoden wordt bereid, verpakt en geëtiketteerd.

      3 Ingeval uit de evaluatie volgt dat een aanpassing van de gegevens op grond waarvan een registratie van een
      diergeneesmiddel is verleend, noodzakelijk is, stelt de vergunninghouder de houder van voorbedoelde registratie
      daarvan onverwijld in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
  - number: '30'
    text: |-
      1 De houder van een vergunning als bedoeld in [artikel 21, eerste lid, van de wet][ref1] voor het afleveren van
      een diergeneesmiddel stelt Onze Minister onverwijld onder opgaaf van reden in kennis van elke beslissing die door
      hem wordt genomen om het afleveren van een diergeneesmiddel op te schorten of te beperken, indien deze beslissing
      betrekking heeft op:

      a. de werkzaamheid van het diergeneesmiddel;

      b. de bescherming van de volksgezondheid.

      2 Indien de beslissing, bedoeld in het eerste lid, is genomen omwille van de bescherming van de volksgezondheid,
      stelt de vergunninghouder tevens de Minister van Volksgezondheid, Welzijn en Sport in kennis van die beslissing.

      3 Bij de kennisgeving, bedoeld in het eerste lid, wordt in voorkomend geval de bestemming van de diergeneesmiddelen
      aangeduid.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
  - number: '31'
    text: |-
      1 [Artikel 21, eerste lid, van de wet][ref1] is niet van toepassing op:

      a. halffabrikaten met medicinale werking;

      b. het afleveren aan houders van dieren van een diergeneesmiddel dat niet is bestemd om te worden toegepast bij
      voedselproducerende dieren.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het afleveren, bedoeld in het
      eerste lid, onderdeel b.

      3 De regels, bedoeld in het tweede lid, kunnen onder meer betrekking hebben op de door degene die aflevert te
      voeren administratie, waaruit de voorraad, de productie, de be- of verwerking, de ontvangst, de herkomst, het
      afleveren, de vernietiging, de bestemming en het verbruik van het diergeneesmiddel moet kunnen blijken.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
  - number: '32'
    text: |-
      In afwijking van [artikel 2, tweede lid, aanhef in samenhang met onderdeel a, van de wet][ref1] is het verboden om
      een diergeneesmiddel te bereiden, en dat diergeneesmiddel voorhanden te hebben, af te leveren of bij dieren toe te
      passen, tenzij aan elk van de volgende voorwaarden is voldaan:

      a. er is in Nederland geen geregistreerd diergeneesmiddel beschikbaar, alsmede geen middel beschikbaar op grond
      van [artikel 22][ref2], om een aandoening, ziekte, ziekteverschijnsel, pijn, verwonding of gebrek bij een dier te
      genezen, lenigen of voorkomen;

      b. er is sprake van een diergeneeskundige noodzaak;

      c. het diergeneesmiddel bevat, indien het is bestemd om te worden toegepast bij een voedselproducerend dier,
      uitsluitend werkzame stoffen die zijn opgenomen in bijlage I, II of III bij [verordening (EG) nr. 2377/90]
      (31990R2377);

      d. ingeval het diergeneesmiddel door een dierenarts wordt bereid, vindt deze bereiding plaats in een lokaliteit die
      aan elk van de voorwaarden, gesteld in [artikel 35][ref3], voldoet;

      e. ingeval van bereiding door een apotheker, wordt het diergeneesmiddel uitsluitend afgeleverd aan de dierenarts op
      wiens recept het middel is bereid;

      f. het diergeneesmiddel wordt uitsluitend toegepast door de dierenarts, of door een persoon die onder zijn directe
      verantwoordelijkheid valt;

      g. de dierenarts schrijft, overeenkomstig [artikel 24][ref4], een wachttermijn voor, indien het diergeneesmiddel
      bij een voedselproducerend dier wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018901#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0018901#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0018901#Artikel24
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel32
