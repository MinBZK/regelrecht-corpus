  - number: '33'
    text: |-
      In afwijking van [artikel 2, tweede lid, aanhef in samenhang met onderdeel a, van de wet][ref1] is
      het de dierenarts verboden om een recept voor de bereiding van een diergeneesmiddel als bedoeld in
      [artikel 2, tweede lid, onderdeel a, van de wet][ref2] uit te schrijven of af te geven, tenzij is voldaan aan de
      voorwaarden, gesteld in [artikel 32, onderdelen a tot en met d][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0018901#Artikel32
