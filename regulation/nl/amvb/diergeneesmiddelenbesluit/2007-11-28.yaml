  - number: '25'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat de dierenarts of de apotheker Onze Minister
      informeert over het voorhanden of in voorraad hebben van diergeneesmiddelen als bedoeld in
      [artikel 22, eerste lid, onderdeel b, onder 2°][ref1]. Daarbij kunnen nadere regels worden gesteld omtrent de
      wijze waarop de informatie wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel22
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel25
