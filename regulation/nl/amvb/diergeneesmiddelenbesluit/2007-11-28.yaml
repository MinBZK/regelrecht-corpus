  - number: '11'
    text: |-
      1 De registratiehouder evalueert regelmatig de fabricage- en controlemethoden, bedoeld in artikel 12, derde lid,
      onderdelen d en i, van [richtlijn nr. 2001/82/EG](32001L0082), die zijn vermeld in het dossier op grond waarvan
      registratie te zijner naam van een diergeneesmiddel is verleend.

      2 De evaluatie, bedoeld in het eerste lid, heeft tot doel wijzigingen in de fabricage- en controlemethoden aan
      te brengen die nodig zijn om te waarborgen dat het diergeneesmiddel volgens algemeen aanvaarde wetenschappelijke
      methoden wordt vervaardigd en gecontroleerd.

      3 Indien een evaluatie tot een wijziging van de fabricage- of controlemethoden leidt, neemt de registratiehouder
      alle maatregelen die noodzakelijk zijn voor wijziging van de gegevens die dienaangaande zijn vermeld in het dossier
      op grond waarvan registratie te zijner naam van het diergeneesmiddel is verleend.
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel11
  - number: '12'
    text: |-
      1 De registratiehouder houdt aantekening van alle vermoedelijke bijwerkingen en vermoedelijke bijwerkingen bij de
      mens die zich in een lidstaat of in een derde land voordoen.

      2 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de wijze van het houden van de
      aantekening, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel12
  - number: '13'
    text: |-
      1 De registratiehouder wordt voortdurend en zonder onderbreking bijgestaan door een voor de geneesmiddelenbewaking
      gekwalificeerde en verantwoordelijke persoon.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de kwalificatie en verantwoordelijkheden
      van de persoon, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel13
  - number: '14'
    text: |-
      1 De registratiehouder stelt Onze Minister onverwijld doch uiterlijk binnen 15 dagen in kennis van:

      a. alle nieuwe informatie die kan leiden tot wijziging van de gegevens op grond waarvan registratie te zijner naam
      van een diergeneesmiddel is verleend, in het bijzonder:

      1°. elk verbod of elke beperking, opgelegd door de bevoegde instantie van een land waar een vergunning voor het in
      de handel brengen als bedoeld in artikel 5 van [richtlijn nr. 2001/82/EG](32001L0082) is verleend, met betrekking
      tot dat diergeneesmiddel;

      2°. alle andere nieuwe informatie die op de beoordeling van de voordelen en risico’s van het gebruik van dat
      diergeneesmiddel van invloed kan zijn;

      3°. elke vermoedelijke ernstige bijwerking of bijwerking bij de mens die zich in een lidstaat of in een derde land
      voordoet en waarvan redelijkerwijs kan worden verwacht dat hij daarvan op de hoogte is of waarvan hij in kennis
      is gesteld;

      4°. elke vermoedelijke overdracht via een diergeneesmiddel van infectieuze stoffen die zich in een derde land
      voordoet en waarvan redelijkerwijs kan worden verwacht dat hij daarvan op de hoogte is of waarvan hij in kennis
      is gesteld;

      b. elke door hem voorgenomen wijziging van de gegevens op grond waarvan registratie te zijner naam van een
      diergeneesmiddel is verleend.

      2 Een dierenarts stelt Onze Minister onverwijld doch uiterlijk binnen 15 dagen in kennis van elke vermoedelijk
      ernstige of onverwachte bijwerking of vermoedelijke bijwerking bij de mens waarvan redelijkerwijs kan worden
      verwacht dat hij daarvan op de hoogte is of waarvan hij in kennis is gesteld, indien bij de registratie van het
      door hem toegepaste diergeneesmiddel dit voorschrift is gesteld.

      3 Onze Minister meldt elke ernstige bijwerking die tevens betrekking heeft op de bescherming van de
      volksgezondheid, en elke bijwerking bij de mens aan Onze Minister van Volksgezondheid, Welzijn en Sport, en stelt
      de daarbij behorende gegevens ter beschikking.
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel14
  - number: '15'
    text: |-
      1 De registratiehouder stelt Onze Minister onverwijld nadat een diergeneesmiddel is geregistreerd in kennis van de
      datum waarop dat middel voor het eerst in Nederland in de handel wordt gebracht.

      2 De registratiehouder stelt Onze Minister ten minste twee maanden voordat een diergeneesmiddel tijdelijk of
      definitief uit de handel wordt genomen in kennis van de beslissing daartoe.

      3 De registratiehouder verstrekt op verzoek aan Onze Minister of de ambtenaren, bedoeld in
      [artikel 52 van de wet][ref1], alle informatie over het afzetvolume van een diergeneesmiddel alsmede alle gegevens
      die hij in bezit heeft over het aantal voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel52
    url: https://wetten.overheid.nl/BWBR0018901/2007-11-28#Artikel15
