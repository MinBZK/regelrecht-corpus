        bwb_id: BWBR0001941
      - id: ref2
        bwb_id: BWBR0001941
  - number: '82.1'
    text: |-
      Het is verboden in strijd te handelen met de artikelen 38, vierde lid, 41, 47, derde alinea, 48, 49, eerste,
      tweede, derde en vijfde lid, van [verordening (EG) nr. 726/2004](32004R0726).
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel82
  - number: '82.2'
    text: |-
      Onze Minister is de bevoegde autoriteit, bedoeld in artikel 39, zevende lid, van [verordening (EG) nr. 726/2004]
      (32004R0726) alsmede de bevoegde nationale instantie, bedoeld in artikel 47, derde alinea, van [verordening (EG)
      nr. 726/2004](32004R0726).
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel82
  - number: '83.1'
    text: |-
      Een regeling als bedoeld in de [artikelen 12, tweede lid][ref1], [13, tweede lid][ref2], [16][ref3],
