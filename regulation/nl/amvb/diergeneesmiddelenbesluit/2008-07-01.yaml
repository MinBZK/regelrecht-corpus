---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: diergeneesmiddelenbesluit
regulatory_layer: AMVB
publication_date: '2011-07-12'
valid_from: '2008-07-01'
bwb_id: BWBR0018901
url: https://wetten.overheid.nl/BWBR0018901/2008-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuur en Voedselkwaliteit van 24 mei 2005, nr. TRCJZ/2005/1613,
    Directie Juridische Zaken, gedaan in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport en na
    overleg met Onze Minister van Sociale Zaken en Werkgelegenheid;

    Gelet op:

    – richtlijn nr. 90/167/EEG van de Raad van de Europese Gemeenschappen van 26 maart 1990 tot vaststelling van de
    voorwaarden voor de bereiding, het in de handel brengen en het gebruik van diervoeders met medicinale werking (PbEG
    L 92);

    – richtlijn nr. 91/412/EEG van de Commissie van de Europese Gemeenschappen van 23 juli 1991 tot vastlegging van
    beginselen en richtsnoeren inzake goede praktijken bij het vervaardigen van geneesmiddelen voor diergeneeskundig
    gebruik (PbEG L 228);

    – richtlijn nr. 96/22/EG van de Raad van de Europese Unie van 29 april 1996 betreffende het verbod op het gebruik,
    in de veehouderij, van bepaalde stoffen met hormonale werking en van bepaalde stoffen met thyreostatische werking,
    alsmede van ß-agonisten en tot intrekking van de Richtlijnen 81/602/EEG, 88/146/EEG en 88/299/EEG (PbEG L 125);

    – richtlijn nr. 96/23/EG van de Raad van de Europese Unie van 29 april 1996 inzake controlemaatregelen ten aanzien
    van bepaalde stoffen en residuen daarvan in levende dieren en in produkten daarvan en tot intrekking van de
    Richtlijnen 85/358/EEG en 86/469/EEG en de Beschikkingen 89/187/EEG en 91/664/EEG (PbEG L 125);

    – richtlijn nr. 2001/82/EG van het Europees Parlement en de Raad van de Europese Unie van 6 november 2001 tot
    vaststelling van een communautair wetboek betreffende geneesmiddelen voor diergeneeskundig gebruik (PbEG L 311);

    – richtlijn nr. 2004/28/EG van het Europees Parlement en de Raad van de Europese Unie van 31 maart 2004 tot
    wijziging van Richtlijn 2001/82/EG tot vaststelling van een communautair wetboek betreffende geneesmiddelen voor
    diergeneeskundig gebruik (PbEU L 136);

    – verordening (EG) nr. 726/2004 van het Europees Parlement en de Raad van de Europese Unie van 31 maart 2004 tot
    vaststelling van communautaire procedures voor het verlenen van vergunningen en het toezicht op geneesmiddelen voor
    menselijk en diergeneeskundig gebruik en tot oprichting van een Europees Geneesmiddelenbureau (PbEU L 136);

    Gelet op de artikelen 3, derde lid, 11, tweede lid, 20, eerste lid, 23, eerste lid, 28, 33, tweede en derde lid,
    39, 42, eerste lid, 43, eerste lid en 49 van de Diergeneesmiddelenwet;

    De Raad van State gehoord (advies van 26 augustus 2005, nr. W11.05.0199/V);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuur en Voedselkwaliteit van 13 oktober 2005, nr.
    TRCJZ/2005/2934, Directie Juridische Zaken, uitgebracht in overeenstemming met Onze Minister van Volksgezondheid,
    Welzijn en Sport en na overleg met Onze Minister van Sociale Zaken en Werkgelegenheid;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt, in afwijking van
      [artikel 1, eerste lid, van de wet][ref1], verstaan onder bijwerking: een schadelijke en onbedoelde reactie bij
      dieren op de toediening van doses aan diergeneesmiddelen die gewoonlijk worden gebruikt voor de profylaxe, diagnose
      of behandeling van een ziekte dan wel voor het herstellen, verbeteren of wijzigen van een fysiologische functie.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel1
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '1'
  - number: '1.2'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel1
  - number: 1.2.a
    text: |-
      aquacultuurdier: levende vis die, onderscheidenlijk schaal- of weekdier dat, bestemd is voor een bedrijf of
      afkomstig is van een bedrijf;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel1
  - number: 1.2.b
    text: 'bijsluiter: informatieblad ten behoeve van de gebruiker, dat het diergeneesmiddel vergezelt;'
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel1
  - number: 1.2.c
    text: |-
      bijwerking bij de mens: schadelijke en onbedoelde reactie bij een mens ten gevolge van de blootstelling aan een
      diergeneesmiddel;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel1
  - number: 1.2.d
    text: 'buitenverpakking: verpakking waarin de primaire verpakking is of wordt geplaatst;'
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel1
  - number: 1.2.e
    text: |-
      communautaire maatregel: verordening, richtlijn of beschikking als bedoeld in artikel 249 van het Verdrag tot
      oprichting van de Europese Economische Gemeenschap ter zake van diergeneesmiddelen en de daarmee verband houdende
      onderwerpen;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel1
  - number: 1.2.f
    text: 'derde land: ander land dan een lidstaat;'
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel1
  - number: 1.2.g
    text: |-
      ernstige bijwerking: bijwerking bij dieren die tot de dood leidt, levensgevaar oplevert dan wel een significante
      handicap, een lichamelijke ongeschiktheid, een aangeboren afwijking, een geboorteafwijking of blijvende of
      langdurige verschijnselen veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel1
  - number: 1.2.h
    text: 'etiketteren: plaatsen van aanduidingen en vermeldingen op de verpakking;'
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel1
  - number: 1.2.i
    text: |-
      halffabrikaat met medicinale werking: mengsel van een voormengsel met medicinale werking en één of meer
      diervoedergrondstoffen, dat als zodanig is bestemd voor rechtstreekse verwerking tot gemedicineerd voeder;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel1
  - number: 1.2.j
    text: |-
      homeopathisch diergeneesmiddel: diergeneesmiddel dat overeenkomstig een homeopathisch fabricageprocédé, beschreven
      in de krachtens het Verdrag inzake de samenstelling van een Europese farmacopee van 22 juli 1964, Trb 1966, nr.
      115 samengestelde Europese farmacopee of, bij afwezigheid daarvan, in een farmacopee die officieel in een lidstaat
      wordt gebruikt, wordt verkregen uit grondstoffen die in de homeopathisch-farmaceutische vakliteratuur worden
      aangeduid als homeopathische grondstoffen;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel1
  - number: 1.2.k
    text: |-
      in het vrije verkeer brengen: uitvoering van de handelingen die bij invoer noodzakelijk zijn voor het verkrijgen
      van de douanestatus van communautaire goederen als bedoeld in artikel 4 van [verordening (EEG) nr. 2913/92]
      (31992R2913) van de Raad van de Europese Gemeenschappen van 12 oktober 1992 tot vaststelling van het communautair
      douanewetboek (PbEG L 302);
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel1
  - number: 1.2.l
    text: |-
      landbouwhuisdieren: als huisdier gehouden runderen, varkens, schapen, geiten, eenhoevigen, pluimvee en tamme
      konijnen, alsook wilde dieren van genoemde soorten en wilde herkauwers, voor zover zij op een bedrijf wordt
      gehouden;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel1
  - number: 1.2.m
    text: |-
      lidstaat: lidstaat van de Europese Unie of andere staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel1
  - number: 1.2.n
    text: |-
      omdoos: verpakking waarin een aantal buitenverpakkingen van eenzelfde diergeneesmiddel of gemedicineerd voeder zijn
      of worden geplaatst;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel1
  - number: 1.2.o
    text: |-
      primaire verpakking: recipiënt of enige andere verpakkingsvorm die rechtstreeks met een diergeneesmiddel of
      gemedicineerd voeder in aanraking komt;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel1
  - number: 1.2.p
    text: |-
      [richtlijn nr. 90/167/EEG](31990L0167): [richtlijn nr. 90/167/EEG](31990L0167) van de Raad van de Europese
      Gemeenschappen van 26 maart 1990 tot vaststelling van de voorwaarden voor de bereiding, het in de handel brengen en
      het gebruik van diervoeders met medicinale werking (PbEG L 92);
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel1
  - number: 1.2.q
    text: |-
      [richtlijn nr. 96/23/EG](31996L0023): [richtlijn nr. 96/23/EG](31996L0023) van de Raad van de Europese Unie van
      29 april 1996 inzake controlemaatregelen ten aanzien van bepaalde stoffen en residuen daarvan in levende dieren en
      in producten daarvan en tot intrekking van de [Richtlijnen 85/358/EEG](31985L0358) en [86/469/EEG](31986L0469) en
      de Beschikkingen [89/187/EEG](31989L0187) en [91/664/EEG](31991L0664) (PbEG L 125);
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel1
  - number: 1.2.r
    text: |-
      [richtlijn nr. 2001/82/EG](32001L0082): [richtlijn nr. 2001/82/EG](32001L0082) van het Europees Parlement en
      de Raad van de Europese Unie van 6 november 2001 tot vaststelling van een communautair wetboek betreffende
      geneesmiddelen voor diergeneeskundig gebruik (PbEG L 311);
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel1
  - number: 1.2.s
    text: |-
      [verordening (EEG) nr. 2377/90](31990R2377): [verordening (EEG) nr. 2377/90](31990R2377) van de Raad van de
      Europese Gemeenschappen van 26 juni 1990 houdende een communautaire procedure tot vaststelling van maximumwaarden
      voor residuen van geneesmiddelen voor diergeneeskundig gebruik in levensmiddelen van dierlijke oorsprong (PbEG
      L 224);
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel1
  - number: 1.2.t
    text: |-
      [verordening (EG) nr. 726/2004](32004R0726): [verordening (EG) nr. 726/2004](32004R0726) van het Europees Parlement
      en de Raad van de Europese Unie van 31 maart 2004 tot vaststelling van communautaire procedures voor het verlenen
      van vergunningen en het toezicht op geneesmiddelen voor menselijk en diergeneeskundig gebruik en tot oprichting van
      een Europees Geneesmiddelenbureau (PbEU L 136);
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel1
  - number: 1.2.u
    text: |-
      verpakken: brengen van de verpakking in de toestand waarin deze in het verkeer zal worden gebracht, in voorkomend
      geval met inbegrip van:
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel1
  - number: 1.2.u.1°
    text: het plaatsen van de primaire verpakking in een buitenverpakking;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel1
  - number: 1.2.u.2°
    text: het plaatsen van de buitenverpakking in een omdoos;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel1
  - number: 1.2.u.3°
    text: het etiketteren;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel1
  - number: 1.2.v
    text: 'verpakking: primaire verpakking, buitenverpakking of omdoos;'
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel1
  - number: 1.2.w
    text: |-
      voormengsel met medicinale werking: diergeneesmiddel dat van tevoren is bereid om later verwerkt te worden tot
      gemedicineerd voeder;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel1
  - number: 1.2.x
    text: |-
      wachttermijn: tijd die, overeenkomstig de bij of krachtens de wet gestelde regels alsmede de gebruiksvoorwaarden
      die op een diergeneesmiddel van toepassing zijn, ten minste na de laatste toediening van dat diergeneesmiddel aan
      een dier moet verstrijken alvorens tot productie van levensmiddelen, afkomstig van dat dier, kan worden overgegaan;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel1
  - number: 1.2.y
    text: |-
      wet: [Diergeneesmiddelenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003818
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003818
  - number: '1.3'
    text: 'Voor de toepassing van dit besluit en de daarop berustende bepalingen:'
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel1
  - number: 1.3.a
    text: |-
      worden omhulsels, waarin diergeneesmiddelen aan een dier worden toegediend, alsmede poederpapier geacht deel uit te
      maken van het diergeneesmiddel;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel1
  - number: 1.3.b
    text: |-
      wordt onder het bereiden van een diergeneesmiddel of gemedicineerd voeder tevens verstaan het verrichten van één
      of meer deelbewerkingen welke noodzakelijk zijn voor het bereiden, met inbegrip van het vullen en sluiten van de
      primaire verpakking van dat middel, onderscheidenlijk voeder.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel1
  - number: '2'
    text: |-
      De wijziging van een communautaire maatregel waarnaar in dit besluit of in regels, gesteld krachtens de wet
      of dit besluit, wordt verwezen, gaat voor de toepassing van dit besluit en de regels, gesteld krachtens de wet
      of dit besluit, gelden met ingang van de dag waarop aan die wijziging uitvoering moet zijn gegeven, tenzij bij
      ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel2
  - number: '3.1'
    text: |-
      De vergoeding, bedoeld in [artikel 3, derde lid, van de wet][ref1], is jaarlijks verschuldigd met ingang van de
      dertiende kalendermaand nadat een aanvraag tot registratie van een diergeneesmiddel is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel3
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '3'
  - number: '3.2'
    text: 'Bij ministeriële regeling worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel3
  - number: 3.2.a
    text: de hoogte van de vergoeding;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel3
  - number: 3.2.b
    text: de wijze en het tijdstip van betaling van de vergoeding.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel3
  - number: '4.1'
    text: |-
      In afwijking van [artikel 3, vijfde lid, van de wet][ref1] is het volgende aanvragers tot registratie van een
      diergeneesmiddel niet toegestaan om naar gegevens te verwijzen die door een registratiehouder van eenzelfde
      diergeneesmiddel met het oog op de aanvraag tot registratie van dat middel in een lidstaat zijn verstrekt zolang
      nog geen 8 jaar zijn verstreken sinds die eerdere registratie.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel3
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '3'
  - number: '4.2'
    text: |-
      Een registratie als bedoeld in het eerste lid die aan een volgende aanvrager wordt verleend gaat niet eerder in
      dan:
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel4
  - number: 4.2.a
    text: |-
      13 jaar na het tijdstip waarop de eerdere registratie is verleend, ingeval de registratie betrekking heeft op
      diergeneesmiddelen die zijn bestemd om te worden toegepast bij bijen of vissen;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel4
  - number: 4.2.b
    text: |-
      10 jaar na het tijdstip waarop de eerdere registratie is verleend, behoudens het in het derde lid bepaalde, in
      overige gevallen.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel4
  - number: '4.3'
    text: |-
      Ingeval de eerdere registratie binnen de periode van vijf jaar nadat die is verleend wordt gewijzigd teneinde het
      aantal diersoorten waarop de registratie betrekking heeft uit te breiden, wordt de termijn, bedoeld in het tweede
      lid, onderdeel b, per voedselproducerend diersoort waarmee de registratie wordt uitgebreid telkens met een jaar
      verlengd tot ten hoogste drie jaar, indien aan elk van de volgende voorwaarden is voldaan:
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel4
  - number: 4.3.a
    text: |-
      het diergeneesmiddel bevat een nieuwe werkzame stof die op 30 april 2004 nog niet was opgenomen op bijlage I, II,
      of III bij [verordening (EEG) nr. 2377/90](31990R2377), en
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel4
  - number: 4.3.b
    text: |-
      de registratiehouder heeft een aanvraag ingediend tot vaststelling van de maximumwaarden voor residuen van de
      werkzame stof in de diersoort waarop de uitbreiding betrekking heeft, overeenkomstig [verordening (EEG) nr.
      2377/90](31990R2377).
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel4
  - number: '4.4'
    text: |-
      Bij ministeriële regeling kunnen in aanvulling op het tweede lid, onderdeel a, diersoorten worden aangewezen waarop
      de termijn, bedoeld in dat onderdeel, eveneens van toepassing is.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel4
  - number: '4.5'
    text: |-
      Voor de toepassing van dit artikel worden wijzigingen of uitbreidingen van een registratie, alsmede nieuwe
      registraties die tot doel hebben de toepassing van een geregistreerd diergeneesmiddel uit te breiden tot andere
      diersoorten of andere concentraties, farmaceutische vormen, toedieningswijzen of aanbiedingsvormen van dat
      diergeneesmiddel mogelijk te maken, geacht onderdeel uit te maken van de oorspronkelijke registratie.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel4
  - number: '4.6'
    text: |-
      Dit artikel is niet van toepassing ingeval de registratiehouder schriftelijk heeft verklaard geen bezwaar te hebben
      tegen een verwijzen als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel4
  - number: '5'
    text: |-
      [Artikel 3, zesde lid, van de wet][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel3
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '3'
  - number: '6.1'
    text: |-
      In afwijking van [artikel 6, tweede lid, van de wet][ref1] wordt de registratie voor onbepaalde tijd verlengd
      nadat daartoe door de registratiehouder een aanvraag op de krachtens [artikel 3, tweede lid, van de wet][ref2]
      voorgeschreven wijze is ingediend, tenzij Onze Minister, in overeenstemming met Onze Minister van Volksgezondheid,
      Welzijn en Sport, besluit de registratie eenmaal met vijf jaar te verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel3
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '3'
  - number: '6.2'
    text: |-
      In afwijking van [artikel 6, tweede lid, van de wet][ref1] wordt een registratie die binnen het tijdvak van vijf
      jaar voor het tijdstip van inwerkingtreding van dit besluit is verlengd, aangemerkt als een registratie voor
      onbepaalde tijd.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel6
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '6'
  - number: '7.1'
    text: |-
      De registratie van een diergeneesmiddel dat een substantie bevat die ingevolge een besluit op grond van artikel
      8 of 9, tweede of derde lid, van [verordening (EEG) nr. 2377/90](31990R2377) op bijlage IV bij die verordening is
      geplaatst, vervalt van rechtswege op de dag waarop dat besluit in werking treedt.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel7
  - number: '7.2'
    text: |-
      Het eerste lid is uitsluitend van toepassing voor zover het diergeneesmiddel waarop de registratie betrekking heeft
      is bestemd om te worden toegepast bij voedselproducerende dieren.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel7
  - number: '8.1'
    text: |-
      De registratie van een diergeneesmiddel dat ter uitvoering van [richtlijn nr. 96/22/EG](31996L0022) is aangewezen
      als substantie als bedoeld in [artikel 5 van de wet][ref1], vervalt van rechtswege op de dag waarop die aanwijzing
      in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel5
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '5'
  - number: '8.2'
    text: |-
      De registratie van een diergeneesmiddel dat specifiek is bestemd om te worden toegepast bij paardachtigen die
      niet voedselproducerend zijn, vervalt van rechtswege op de dag dat in Nederland een registratie of in een andere
      lidstaat dan Nederland een vergunning voor het in de handel brengen van een ander diergeneesmiddel dat tevens is
      bestemd om eenzelfde aandoening, ziekte, ziekteverschijnsel, pijn, verwonding of gebrek bij voedselproducerende
      paardachtigen te genezen, lenigen of voorkomen, is verleend.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel8
  - number: '9.1'
    text: |-
      De registratie van een diergeneesmiddel vervalt van rechtswege indien het diergeneesmiddel gedurende drie
      opeenvolgende jaren niet in Nederland in de handel is geweest.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel9
  - number: '9.2'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport, bepalen dat het
      eerste lid niet van toepassing is op door hem aangewezen registraties.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel9
  - number: '10'
    text: |-
      Onverminderd de [artikelen 10][ref1] en [11 van de wet][ref2] kan Onze Minister in overeenstemming met Onze
      Minister van Volksgezondheid, Welzijn en Sport een registratie geheel of gedeeltelijk schorsen dan wel geheel of
      gedeeltelijk doorhalen indien een verpakking of bijsluiter niet voldoet aan de regels, gesteld bij of krachtens
      [hoofdstuk III, paragraaf 4][ref3], van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0018901#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0018901
        hoofdstuk: III
        paragraaf: '4'
  - number: '11.1'
    text: |-
      De registratiehouder evalueert regelmatig de fabricage- en controlemethoden, bedoeld in artikel 12, derde lid,
      onderdelen d en i, van [richtlijn nr. 2001/82/EG](32001L0082), die zijn vermeld in het dossier op grond waarvan
      registratie te zijner naam van een diergeneesmiddel is verleend.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel11
  - number: '11.2'
    text: |-
      De evaluatie, bedoeld in het eerste lid, heeft tot doel wijzigingen in de fabricage- en controlemethoden aan te
      brengen die nodig zijn om te waarborgen dat het diergeneesmiddel volgens algemeen aanvaarde wetenschappelijke
      methoden wordt vervaardigd en gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel11
  - number: '11.3'
    text: |-
      Indien een evaluatie tot een wijziging van de fabricage- of controlemethoden leidt, neemt de registratiehouder alle
      maatregelen die noodzakelijk zijn voor wijziging van de gegevens die dienaangaande zijn vermeld in het dossier op
      grond waarvan registratie te zijner naam van het diergeneesmiddel is verleend.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel11
  - number: '12.1'
    text: |-
      De registratiehouder houdt aantekening van alle vermoedelijke bijwerkingen en vermoedelijke bijwerkingen bij de
      mens die zich in een lidstaat of in een derde land voordoen.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel12
  - number: '12.2'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de wijze van het houden van de
      aantekening, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel12
  - number: '13.1'
    text: |-
      De registratiehouder wordt voortdurend en zonder onderbreking bijgestaan door een voor de geneesmiddelenbewaking
      gekwalificeerde en verantwoordelijke persoon.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel13
  - number: '13.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de kwalificatie en verantwoordelijkheden van
      de persoon, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel13
  - number: '14.1'
    text: 'De registratiehouder stelt Onze Minister onverwijld doch uiterlijk binnen 15 dagen in kennis van:'
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel14
  - number: 14.1.a
    text: |-
      alle nieuwe informatie die kan leiden tot wijziging van de gegevens op grond waarvan registratie te zijner naam van
      een diergeneesmiddel is verleend, in het bijzonder:
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel14
  - number: 14.1.a.1°
    text: |-
      elk verbod of elke beperking, opgelegd door de bevoegde instantie van een land waar een vergunning voor het in de
      handel brengen als bedoeld in artikel 5 van [richtlijn nr. 2001/82/EG](32001L0082) is verleend, met betrekking tot
      dat diergeneesmiddel;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel14
  - number: 14.1.a.2°
    text: |-
      alle andere nieuwe informatie die op de beoordeling van de voordelen en risico’s van het gebruik van dat
      diergeneesmiddel van invloed kan zijn;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel14
  - number: 14.1.a.3°
    text: |-
      elke vermoedelijke ernstige bijwerking of bijwerking bij de mens die zich in een lidstaat of in een derde land
      voordoet en waarvan redelijkerwijs kan worden verwacht dat hij daarvan op de hoogte is of waarvan hij in kennis
      is gesteld;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel14
  - number: 14.1.a.4°
    text: |-
      elke vermoedelijke overdracht via een diergeneesmiddel van infectieuze stoffen die zich in een derde land voordoet
      en waarvan redelijkerwijs kan worden verwacht dat hij daarvan op de hoogte is of waarvan hij in kennis is gesteld;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel14
  - number: 14.1.b
    text: |-
      elke door hem voorgenomen wijziging van de gegevens op grond waarvan registratie te zijner naam van een
      diergeneesmiddel is verleend.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel14
  - number: '14.2'
    text: |-
      Een dierenarts stelt Onze Minister onverwijld doch uiterlijk binnen 15 dagen in kennis van elke vermoedelijk
      ernstige of onverwachte bijwerking of vermoedelijke bijwerking bij de mens waarvan redelijkerwijs kan worden
      verwacht dat hij daarvan op de hoogte is of waarvan hij in kennis is gesteld, indien bij de registratie van het
      door hem toegepaste diergeneesmiddel dit voorschrift is gesteld.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel14
  - number: '14.3'
    text: |-
      Onze Minister meldt elke ernstige bijwerking die tevens betrekking heeft op de bescherming van de volksgezondheid,
      en elke bijwerking bij de mens aan Onze Minister van Volksgezondheid, Welzijn en Sport, en stelt de daarbij
      behorende gegevens ter beschikking.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel14
  - number: '15.1'
    text: |-
      De registratiehouder stelt Onze Minister onverwijld nadat een diergeneesmiddel is geregistreerd in kennis van de
      datum waarop dat middel voor het eerst in Nederland in de handel wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel15
  - number: '15.2'
    text: |-
      De registratiehouder stelt Onze Minister ten minste twee maanden voordat een diergeneesmiddel tijdelijk of
      definitief uit de handel wordt genomen in kennis van de beslissing daartoe.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel15
  - number: '15.3'
    text: |-
      De registratiehouder verstrekt op verzoek aan Onze Minister of de ambtenaren, bedoeld in
      [artikel 52 van de wet][ref1], alle informatie over het afzetvolume van een diergeneesmiddel alsmede alle gegevens
      die hij in bezit heeft over het aantal voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel52
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '52'
  - number: '16'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de wijze waarop de informatie, bedoeld in de
      [artikelen 14][ref1] en [15][ref2], wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0018901#Artikel15
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '14'
        hoofdstuk: II
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0018901
        artikel: '15'
        hoofdstuk: II
        paragraaf: '5'
  - number: '17.1'
    text: |-
      Indien een registratiehouder informatie verstrekt aan het publiek over vraagstukken die verband houden met de
      geneesmiddelenbewaking, stelt hij Onze Minister hiervan vooraf of gelijktijdig in kennis.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel17
  - number: '17.2'
    text: De informatie, bedoeld in het eerste lid, wordt objectief gepresenteerd en is niet misleidend.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel17
  - number: '18'
    text: |-
      Ingeval een wijziging van de bijlagen bij [verordening (EEG) nr. 2377/90](31990R2377) noopt tot wijziging van
      de gegevens op grond waarvan een registratie is verleend, dan wel tot intrekking van een registratie, neemt de
      registratiehouder binnen zestig dagen na de bekendmaking van eerstbedoelde wijziging in het Publicatieblad van de
      Europese Unie alle maatregelen die noodzakelijk zijn voor die wijziging of intrekking.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel18
  - number: '19'
    text: |-
      De [artikelen 2, eerste lid][ref1], en [19 van de wet][ref2] zijn niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel19
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '19'
  - number: 19.a
    text: |-
      homeopathische diergeneesmiddelen die zijn opgenomen in de lijst, bedoeld in [artikel 20, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel20
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '20'
        hoofdstuk: II
        paragraaf: '6'
  - number: 19.b
    text: diergeneesmiddelen op basis van radioactieve isotopen;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel19
  - number: 19.c
    text: 'diergeneesmiddelen die aan elk van de volgende voorwaarden voldoen:'
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel19
  - number: 19.c.1°
    text: |-
      de bepalingen van [hoofdstuk IV van de wet][ref1] zijn niet op die middelen van toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0003818#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003818
        hoofdstuk: IV
  - number: 19.c.2°
    text: |-
      zij bevatten geen substanties die zijn aangewezen krachtens [artikel 5 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel5
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '5'
  - number: 19.c.3°
    text: |-
      zij zijn uitsluitend bestemd voor toepassing bij de volgende dieren, die niet zijn bestemd voor consumptie en
      waarvan in voorkomend geval de eieren evenmin zijn bestemd voor consumptie: - aquariumvissen;
        - terrariumdieren;
        - vogels, gehouden in kooien of volières;
        - postduiven;
        - kleine knaagdieren, konijnen en fretten die niet bedrijfsmatig worden gehouden;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel19
  - number: 19.d
    text: halffabrikaten met medicinale werking;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel19
  - number: 19.e
    text: |-
      entstoffen die zijn bereid met behulp van uit één of meer dieren geïsoleerde smetstoffen met het oog op de
      incidentele toepassing bij datzelfde dier of diezelfde dieren of dieren die daarmee tezamen worden gehouden;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel19
  - number: 19.f
    text: diergeneesmiddelen die uitsluitend substanties, aangewezen door Onze Minister, als werkzaam bestanddeel bevatten;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel19
  - number: 19.g
    text: |-
      diergeneesmiddelen die bestemd zijn en uitsluitend worden gebruikt voor toepassing op niet levend materiaal van
      dierlijke herkomst, ter onderkenning van een ziekte of de immunologische status van dieren.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel19
  - number: '20.1'
    text: |-
      Onze Minister houdt een lijst van homeopathische diergeneesmiddelen bij waarop de [artikelen 2, eerste lid][ref1],
      en [19 van de wet][ref2] niet van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel19
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '19'
  - number: '20.2'
    text: 'Bij ministeriële regeling worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel20
  - number: 20.2.a
    text: de inrichting van die lijst;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel20
  - number: 20.2.b
    text: de wijze waarop kennis kan worden genomen van de in die lijst opgenomen gegevens.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel20
  - number: '21.1'
    text: |-
      De vermelding van een diergeneesmiddel op de lijst, bedoeld in [artikel 20, eerste lid][ref1], wordt doorgehaald in
      de volgende gevallen:


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel20
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '20'
        hoofdstuk: II
        paragraaf: '6'
  - number: 21.1.a
    text: op verzoek van degene op wiens verzoek het desbetreffende diergeneesmiddel in die lijst is opgenomen;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel21
  - number: 21.1.b
    text: 'indien zich een van de volgende gevallen voordoet:'
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel21
  - number: 21.1.b.1°
    text: |-
      het diergeneesmiddel past niet meer in de veterinaire homeopathie, onder meer door zijn bereiding en de aanbevolen
      toepassingswijze;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel21
  - number: 21.1.b.2°
    text: het diergeneesmiddel is bij de aanbevolen toepassingswijze schadelijk voor de gezondheid van mens of dier.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel21
  - number: '21.2'
    text: |-
      De datum van doorhaling wordt niet gesteld op een datum die vroeger ligt dan zes maanden na de datum waarop
      het besluit tot doorhaling is genomen, tenzij een onverwijlde doorhaling naar het oordeel van Onze Minister
      noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel21
  - number: '22.1'
    text: |-
      Indien er in Nederland geen diergeneesmiddel beschikbaar is dat is geregistreerd om een bepaalde
      aandoening, ziekte, ziekteverschijnsel, pijn, verwonding of gebrek bij een dier te genezen, lenigen
      of voorkomen, is het de dierenarts bij diergeneeskundige noodzaak toegestaan om, in afwijking van
      [artikel 2, eerste lid, van de wet][ref1], en met inachtneming van de [artikelen 23][ref2] en [24][ref3], de
      volgende middelen toe te passen bij een dier en in verband daarmee in voorraad of voorhanden te hebben:


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018901#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0018901#Artikel24
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0018901
        artikel: '23'
        hoofdstuk: II
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0018901
        artikel: '24'
        hoofdstuk: II
        paragraaf: '6'
  - number: 22.1.a
    text: 'diergeneesmiddelen die zijn geregistreerd om te worden toegepast bij:'
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel22
  - number: 22.1.a.1°
    text: |-
      andere diersoorten om een aandoening, ziekte, ziekteverschijnsel, pijn, verwonding of gebrek bij een dier te
      genezen, lenigen of voorkomen, of
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel22
  - number: 22.1.a.2°
    text: |-
      dezelfde diersoort om een andere aandoening, ziekte, ziekteverschijnsel, pijn, verwonding of gebrek bij een dier te
      genezen, lenigen of voorkomen;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel22
  - number: 22.1.b
    text: 'ingeval geen diergeneesmiddelen als bedoeld in onderdeel a beschikbaar zijn:'
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel22
  - number: 22.1.b.1°
    text: |-
      geneesmiddelen als bedoeld in [artikel 1, eerste lid, onder b, van de Geneesmiddelenwet][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel1
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '1'
  - number: 22.1.b.2°
    text: |-
      diergeneesmiddelen die overeenkomstig [richtlijn nr. 2001/82/EG](32001L0082) in een lidstaat zijn toegelaten om
      dezelfde of een andere aandoening, ziekte, ziekteverschijnsel, pijn, verwonding of gebrek te genezen, lenigen of
      voorkomen bij een dier van dezelfde diersoort of: - een andere diersoort, ingeval het dier niet voedselproducerend
      is;
        - een andere voedselproducerende diersoort, ingeval het dier voedselproducerend is.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel22
  - number: '22.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een persoon die onder de directe verantwoordelijkheid van een
      dierenarts middelen als bedoeld in het eerste lid toedient.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel22
  - number: '23.1'
    text: |-
      Een middel als bedoeld in [artikel 22][ref1] dat wordt toegepast bij een voedselproducerend dier bevat uitsluitend
      werkzame stoffen die zijn opgenomen in bijlage I, II of III bij [verordening (EG) nr. 2377/90](31990R2377).


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel22
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '22'
        hoofdstuk: II
        paragraaf: '6'
  - number: '23.2'
    text: |-
      Onze Minister kan werkzame stoffen aanwijzen die in afwijking van het eerste lid aan voedselproducerende
      paardachtigen mogen worden toegediend.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel23
  - number: '24.1'
    text: |-
      Indien bij een voedselproducerend dier een middel als bedoeld in [artikel 22][ref1] wordt toegepast, schrijft de
      dierenarts de wachttermijn voor die op grond van diergeneeskundige inzichten noodzakelijk is om te garanderen dat
      de producten, afkomstig van het dier, geen residuen bevatten die gevaarlijk zijn voor de consument.


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel22
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '22'
        hoofdstuk: II
        paragraaf: '6'
  - number: '24.2'
    text: |-
      De wachttermijn, bedoeld in het eerste lid, is ten minste even lang als de wachttermijn die met betrekking tot de
      diersoort waartoe het dier behoort is aangegeven bij het middel, of, indien geen wachttermijn is aangegeven, ten
      minste:
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel24
  - number: 24.2.a
    text: 7 dagen voor melk en eieren;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel24
  - number: 24.2.b
    text: 28 dagen voor vlees van pluimvee of zoogdieren, met inbegrip van vet en slachtafval;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel24
  - number: 24.2.c
    text: 500 graaddagen voor visvlees.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel24
  - number: '24.3'
    text: |-
      In afwijking van het tweede lid, onderdelen a, b en c, bedraagt de wachttermijn ten minste 0 dagen of graaddagen
      indien het middel een homeopathisch diergeneesmiddel is dat uitsluitend de werkzame bestanddelen bevat die zijn
      vermeld in bijlage II bij [verordening (EG) nr. 2377/90](31990R2377).
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel24
  - number: '24.4'
    text: |-
      Bij ministeriële regeling kunnen wachttermijnen worden voorgeschreven in afwijking van of in aanvulling op het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel24
  - number: '25'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat de dierenarts of de apotheker Onze Minister
      informeert over het voorhanden of in voorraad hebben van diergeneesmiddelen als bedoeld in
      [artikel 22, eerste lid, onderdeel b, onder 2°][ref1]. Daarbij kunnen nadere regels worden gesteld omtrent de
      wijze waarop de informatie wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel22
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '22'
        hoofdstuk: II
        paragraaf: '6'
  - number: '26'
    text: |-
      Bij ministeriële regeling worden ter uitvoering van communautaire maatregelen eisen als bedoeld in
      [artikel 23, eerste lid, van de wet][ref1] gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel23
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '23'
  - number: '27'
    text: |-
      Het is de houder van een vergunning als bedoeld in [artikel 21, eerste lid, van de wet][ref1] verboden om
      diergeneesmiddelen te bereiden, te verpakken, te etiketteren of af te leveren, anders dan met inachtneming van de
      eisen, bedoeld in [artikel 26][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0018901#Artikel26
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0018901
        artikel: '26'
        hoofdstuk: III
        paragraaf: '1'
  - number: '28'
    text: |-
      De houder van een vergunning als bedoeld in [artikel 21, eerste lid, van de wet][ref1] draagt er zorg voor dat de
      handelingen, genoemd in die vergunning, worden verricht overeenkomstig de gegevens op grond waarvan registratie van
      een in de vergunning genoemde diergeneesmiddel is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
  - number: '29.1'
    text: |-
      De houder van een vergunning als bedoeld in [artikel 21, eerste lid, van de wet][ref1] voor het bereiden, verpakken
      of etiketteren van een diergeneesmiddel evalueert regelmatig de methoden van bereiding, verpakking en etikettering.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
  - number: '29.2'
    text: |-
      De evaluatie, bedoeld in het eerste lid, heeft tot doel verbeteringen aan te brengen in de methoden van bereiding,
      verpakking en etikettering die nodig zijn om te waarborgen dat het diergeneesmiddel volgens algemeen aanvaarde
      wetenschappelijke methoden wordt bereid, verpakt en geëtiketteerd.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel29
  - number: '29.3'
    text: |-
      Ingeval uit de evaluatie volgt dat een aanpassing van de gegevens op grond waarvan een registratie van een
      diergeneesmiddel is verleend, noodzakelijk is, stelt de vergunninghouder de houder van voorbedoelde registratie
      daarvan onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel29
  - number: '30.1'
    text: |-
      De houder van een vergunning als bedoeld in [artikel 21, eerste lid, van de wet][ref1] voor het afleveren van
      een diergeneesmiddel stelt Onze Minister onverwijld onder opgaaf van reden in kennis van elke beslissing die door
      hem wordt genomen om het afleveren van een diergeneesmiddel op te schorten of te beperken, indien deze beslissing
      betrekking heeft op:


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
  - number: 30.1.a
    text: de werkzaamheid van het diergeneesmiddel;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel30
  - number: 30.1.b
    text: de bescherming van de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel30
  - number: '30.2'
    text: |-
      Indien de beslissing, bedoeld in het eerste lid, is genomen omwille van de bescherming van de volksgezondheid,
      stelt de vergunninghouder tevens de Minister van Volksgezondheid, Welzijn en Sport in kennis van die beslissing.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel30
  - number: '30.3'
    text: |-
      Bij de kennisgeving, bedoeld in het eerste lid, wordt in voorkomend geval de bestemming van de diergeneesmiddelen
      aangeduid.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel30
  - number: '31.1'
    text: |-
      [Artikel 21, eerste lid, van de wet][ref1] is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
  - number: 31.1.a
    text: halffabrikaten met medicinale werking;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel31
  - number: 31.1.b
    text: |-
      het afleveren aan houders van dieren van een diergeneesmiddel dat niet is bestemd om te worden toegepast bij
      voedselproducerende dieren.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel31
  - number: '31.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het afleveren, bedoeld in het
      eerste lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel31
  - number: '31.3'
    text: |-
      De regels, bedoeld in het tweede lid, kunnen onder meer betrekking hebben op de door degene die aflevert te voeren
      administratie, waaruit de voorraad, de productie, de be- of verwerking, de ontvangst, de herkomst, het afleveren,
      de vernietiging, de bestemming en het verbruik van het diergeneesmiddel moet kunnen blijken.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel31
  - number: '32'
    text: |-
      In afwijking van [artikel 2, tweede lid, aanhef in samenhang met onderdeel a, van de wet][ref1] is het verboden om
      een diergeneesmiddel te bereiden, en dat diergeneesmiddel voorhanden te hebben, af te leveren of bij dieren toe te
      passen, tenzij aan elk van de volgende voorwaarden is voldaan:


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '2'
  - number: 32.a
    text: |-
      er is in Nederland geen geregistreerd diergeneesmiddel beschikbaar, alsmede geen middel beschikbaar op grond van
      [artikel 22][ref1], om een aandoening, ziekte, ziekteverschijnsel, pijn, verwonding of gebrek bij een dier te
      genezen, lenigen of voorkomen;


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel22
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '22'
        hoofdstuk: II
        paragraaf: '6'
  - number: 32.b
    text: er is sprake van een diergeneeskundige noodzaak;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel32
  - number: 32.c
    text: |-
      het diergeneesmiddel bevat, indien het is bestemd om te worden toegepast bij een voedselproducerend dier,
      uitsluitend werkzame stoffen die zijn opgenomen in bijlage I, II of III bij [verordening (EG) nr. 2377/90]
      (31990R2377);
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel32
  - number: 32.d
    text: |-
      ingeval het diergeneesmiddel door een dierenarts wordt bereid, vindt deze bereiding plaats in een lokaliteit die
      aan elk van de voorwaarden, gesteld in [artikel 35][ref1], voldoet;


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel35
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '35'
        hoofdstuk: III
        paragraaf: '3'
  - number: 32.e
    text: |-
      ingeval van bereiding door een apotheker, wordt het diergeneesmiddel uitsluitend afgeleverd aan de dierenarts op
      wiens recept het middel is bereid;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel32
  - number: 32.f
    text: |-
      het diergeneesmiddel wordt uitsluitend toegepast door de dierenarts, of door een persoon die onder zijn directe
      verantwoordelijkheid valt;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel32
  - number: 32.g
    text: |-
      de dierenarts schrijft, overeenkomstig [artikel 24][ref1], een wachttermijn voor, indien het diergeneesmiddel bij
      een voedselproducerend dier wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel24
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '24'
        hoofdstuk: II
        paragraaf: '6'
  - number: '33'
    text: |-
      In afwijking van [artikel 2, tweede lid, aanhef in samenhang met onderdeel a, van de wet][ref1] is
      het de dierenarts verboden om een recept voor de bereiding van een diergeneesmiddel als bedoeld in
      [artikel 2, tweede lid, onderdeel a, van de wet][ref2] uit te schrijven of af te geven, tenzij is voldaan aan de
      voorwaarden, gesteld in [artikel 32, onderdelen a tot en met d][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0018901#Artikel32
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0018901
        artikel: '32'
        hoofdstuk: III
        paragraaf: '3'
  - number: '34.1'
    text: |-
      Het is verboden om een diergeneesmiddel als bedoeld in [artikel 2, tweede lid, onderdeel a, van de wet][ref1], in
      voorraad te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '2'
  - number: '34.2'
    text: |-
      Het is de dierenarts verboden om grondstoffen of substanties, bestemd voor de bereiding van een diergeneesmiddel
      als bedoeld in [artikel 2, tweede lid, onderdeel a, van de wet][ref1], in voorraad of voorhanden te hebben in een
      grotere hoeveelheid dan noodzakelijk voor de bereiding onder de voorwaarden, gesteld in [artikel 32][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018901#Artikel32
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0018901
        artikel: '32'
        hoofdstuk: III
        paragraaf: '3'
  - number: '35'
    text: |-
      Een lokaliteit als bedoeld in [artikel 32, onderdeel d][ref1], voldoet aan elk van de volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel32
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '32'
        hoofdstuk: III
        paragraaf: '3'
  - number: 35.a
    text: |-
      de lokaliteit is voldoende groot en zodanig ingericht dat daarin alle handelingen, benodigd voor de bereiding van
      een diergeneesmiddel als bedoeld in [artikel 2, tweede lid, onderdeel a, van de wet][ref1], naar behoren kunnen
      worden verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '2'
  - number: 35.b
    text: de lokaliteit is goed onderhouden, schoon, opgeruimd en goed verlicht;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel35
  - number: 35.c
    text: |-
      de lokaliteit is voorzien van een zodanige klimaatbeheersing dat de temperatuur en de vochtigheidsgraad geen
      ongewenste invloed uitoefenen op de zich daarin bevindende grondstoffen en diergeneesmiddelen;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel35
  - number: 35.d
    text: de lokaliteit is voorzien van een vlakke, gladde en ondoorlaatbare vloer, zonder scheuren of open afvoeren.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel35
  - number: '36'
    text: Deze paragraaf is niet van toepassing op halffabrikaten met medicinale werking.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel36
  - number: '37.1'
    text: 'De verpakking van een diergeneesmiddel voldoet aan elk van de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel37
  - number: 37.1.a
    text: zij is bestand tegen elke normale behandeling;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel37
  - number: 37.1.b
    text: de inhoud kan niet ontsnappen, en
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel37
  - number: 37.1.c
    text: |-
      zij is geschikt om de samenstelling en de zuiverheid van het daarin verpakte diergeneesmiddel te waarborgen
      gedurende de aangegeven houdbaarheidstermijn onder de voorgeschreven of aanbevolen bewaaromstandigheden.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel37
  - number: '37.2'
    text: |-
      De sluiting van de primaire verpakking en, in voorkomend geval, van de buitenverpakking is van zodanige aard dat
      deze niet zonder zichtbare en onherstelbare beschadiging kan worden geopend.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel37
  - number: '38'
    text: |-
      Bij ministeriële regeling worden ter uitvoering van communautaire maatregelen regels gesteld met betrekking tot het
      etiketteren van diergeneesmiddelen.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel38
  - number: '39.1'
    text: 'Het is verboden om een diergeneesmiddel af te leveren aan houders van dieren indien:'
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel39
  - number: 39.1.a
    text: de houdbaarheidstermijn is verstreken;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel39
  - number: 39.1.b
    text: |-
      de aanduidingen op de primaire verpakking en in voorkomend geval de buitenverpakking of bijsluiter onleesbaar zijn
      of daarin wijzigingen zijn aangebracht, of
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel39
  - number: 39.1.c
    text: de oorspronkelijke sluiting van de primaire verpakking en in voorkomend geval de buitenverpakking is verbroken.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel39
  - number: '39.2'
    text: |-
      Het eerste lid, aanhef in samenhang met onderdeel c, is niet van toepassing ingeval een diergeneesmiddel door een
      dierenarts of apotheker wordt afgeleverd, onder voorwaarde dat de oorspronkelijke sluiting is vervangen door een
      sluiting welke is voorzien van de naam en het adres van de betreffende dierenarts of apotheker.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel39
  - number: '40.1'
    text: |-
      Het is verboden om een diergeneesmiddel af te leveren zonder verpakking, tenzij aan elk van de volgende voorwaarden
      is voldaan:
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel40
  - number: 40.1.a
    text: |-
      het diergeneesmiddel wordt afgeleverd aan de houder van een vergunning als bedoeld in de [artikelen 21][ref1] of
      [33 van de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel33
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '33'
  - number: 40.1.b
    text: |-
      bij het diergeneesmiddel is een document gevoegd dat de gegevens bevat die krachtens [artikel 38][ref1] op de
      verpakking van het diergeneesmiddel moeten worden vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel38
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '38'
        hoofdstuk: III
        paragraaf: '4'
  - number: '40.2'
    text: |-
      Het is verboden om een diergeneesmiddel af te leveren zonder buitenverpakking, tenzij alle informatie die krachtens
      [artikel 38][ref1] op de buitenverpakking moet worden geplaatst, is aangebracht op de primaire verpakking.


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel38
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '38'
        hoofdstuk: III
        paragraaf: '4'
  - number: '40.3'
    text: |-
      Het is verboden om een diergeneesmiddel af te leveren zonder bijsluiter, tenzij alle informatie die krachtens
      [artikel 38][ref1] op de bijsluiter moet worden geplaatst, is aangebracht op de verpakking.


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel38
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '38'
        hoofdstuk: III
        paragraaf: '4'
  - number: '41.1'
    text: |-
      Het is verboden diergeneesmiddelen af te leveren in het kader van markthandel, handel te water, straathandel, of
      handel via Internet, inclusief de vorm van handel waarbij diergeneesmiddelen worden afgeleverd aan vaste afnemers
      aan hun woningen en straathandel waarbij diergeneesmiddelen aan willekeurige gegadigden worden afgeleverd anders
      dan op een vaste standplaats.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel41
  - number: '41.2'
    text: 'Het eerste lid is niet van toepassing indien aan elk van de volgende voorwaarden is voldaan:'
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel41
  - number: 41.2.a
    text: |-
      er worden geen diergeneesmiddelen waarop de bepalingen van [hoofdstuk IV van de wet][ref1] van toepassing zijn
      afgeleverd;


      [ref1]: https://wetten.overheid.nl/BWBR0003818#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0003818
        hoofdstuk: IV
  - number: 41.2.b
    text: de diergeneesmiddelen worden op de plaats van verkoop duidelijk gescheiden gehouden van andere producten;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel41
  - number: 41.2.c
    text: de diergeneesmiddelen worden in een dusdanige toestand gehouden dat de kwaliteit voldoende blijft gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel41
  - number: '42.1'
    text: |-
      Het is de dierenarts, de apotheker en, in voorkomende gevallen, de houder van een vergunning voor het afleveren van
      diergeneesmiddelen als bedoeld in [artikel 21 van de wet][ref1], verboden een diergeneesmiddel waarop de bepalingen
      van [hoofdstuk IV van de wet][ref2] van toepassing zijn af te leveren aan de houders van dieren.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0003818#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0003818
        hoofdstuk: IV
  - number: '42.2'
    text: |-
      Het eerste lid is niet van toepassing indien de verpakking is voorzien van een aanduiding die goed zichtbaar,
      duidelijk leesbaar en onuitwisbaar is, en de volgende vermeldingen bevat:
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel42
  - number: 42.2.a
    text: het woord «dierenarts», «apotheker» of «vergunninghouder»;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel42
  - number: 42.2.b
    text: |-
      de naam en het adres van de betreffende dierenarts, apotheker of houder van een vergunning voor het afleveren van
      diergeneesmiddelen als bedoeld in [artikel 21 van de wet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
  - number: 42.2.c
    text: de datum van afleveren van het diergeneesmiddel.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel42
  - number: 42a.1
    text: 'Het recept bevat in ieder geval de volgende informatie:'
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel42a
  - number: 42a.1.a
    text: de datum van uitschrijven;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel42a
  - number: 42a.1.b
    text: de benaming en het registratienummer van het voorgeschreven diergeneesmiddel;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel42a
  - number: 42a.1.c
    text: de diersoort waarvoor het middel bestemd is;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel42a
  - number: 42a.1.d
    text: de af te leveren hoeveelheid;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel42a
  - number: 42a.1.e
    text: de naam en het adres van de betreffende dierenarts;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel42a
  - number: 42a.1.f
    text: |-
      de naam van de ontvanger en het adres of uniek bedrijfsnummer van de locatie waar de dieren, waarvoor het recept
      bedoeld is, gehouden worden;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel42a
  - number: 42a.1.g
    text: in voorkomend geval, de in acht te nemen wachttermijn en
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel42a
  - number: 42a.1.h
    text: de handtekening van de betreffende dierenarts.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel42a
  - number: 42a.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de inhoud van recepten en het uitschrijven en
      afgeven daarvan, alsmede omtrent het voorschrijven van diergeneesmiddelen door dierenartsen.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel42a
  - number: '43.1'
    text: Het is verboden diergeneesmiddelen, afkomstig van een derde land, in Nederland in het vrije verkeer te brengen.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel43
  - number: '43.2'
    text: |-
      Het eerste lid is niet van toepassing indien degene die het diergeneesmiddel in het vrije verkeer brengt beschikt
      over een vergunning als bedoeld in [artikel 21 van de wet][ref1] voor het bereiden van dat diergeneesmiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
  - number: '44.1'
    text: |-
      Het is verboden diergeneesmiddelen, afkomstig van een derde land, die in Nederland in het vrije verkeer zijn
      gebracht, door te voeren naar een lidstaat.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel44
  - number: '44.2'
    text: |-
      Het eerste lid is niet van toepassing indien bij de diergeneesmiddelen een bewijsstuk is gevoegd waaruit blijkt dat
      degene die de middelen doorvoert beschikt over een vergunning als bedoeld in [artikel 43, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel43
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '43'
        hoofdstuk: IV
  - number: '45'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de invoer, uitvoer en doorvoer van
      diergeneesmiddelen. Daarbij kan onder meer worden bepaald dat degene die diergeneesmiddelen invoert de
      registratiehouder of Onze Minister daarvan op de hoogte stelt.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel45
  - number: '46.1'
    text: |-
      Het is verboden een door Onze Minister, in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport,
      aangewezen substantie aan landbouwhuisdieren of aquacultuurdieren toe te dienen.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel46
  - number: '46.2'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport, bepalen onder welke
      omstandigheden een substantie als bedoeld in het eerste lid, in afwijking van het eerste lid aan landbouwhuisdieren
      of aquacultuurdieren mag worden toegediend.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel46
  - number: '46.3'
    text: |-
      In afwijking van [artikel 2, tweede lid, aanhef in samenhang met onderdeel b, van de wet][ref1] is het verboden
      om een substantie als bedoeld in het eerste lid die wordt doorgevoerd of bestemd is voor uitvoer te bereiden,
      voorhanden of in voorraad te hebben en af te leveren.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '2'
  - number: '47.1'
    text: |-
      Onze Minister schorst de vergunning, bedoeld in [artikel 21, eerste lid, van de wet][ref1] voor het bereiden, en in
      voorkomend geval verpakken of etiketteren, van een diergeneesmiddel geheel of gedeeltelijk gedurende een door hem
      te bepalen periode, indien de houder van die vergunning een diergeneesmiddel dat, onderscheidenlijk een substantie
      die krachtens een communautaire maatregel niet aan landbouwhuisdieren of aquacultuurdieren mag worden toegediend
      heeft bereid dan wel voorhanden of in voorraad heeft of heeft gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
  - number: '47.2'
    text: |-
      Onze Minister trekt de vergunning, bedoeld in het eerste lid, definitief in indien de houder van die vergunning
      voor een tweede keer een diergeneesmiddel dat, onderscheidenlijk een substantie die krachtens een communautaire
      maatregel niet aan landbouwhuisdieren of aquacultuurdieren mag worden toegediend heeft bereid dan wel voorhanden of
      in voorraad heeft of heeft gehad.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel47
  - number: '48'
    text: |-
      De [artikelen 46, derde lid][ref1], en [47][ref2] zijn niet van toepassing ingeval het diergeneesmiddel of de
      substantie, bedoeld in die artikelen, aantoonbaar is bestemd voor een andere toepassing dan de toediening aan
      landbouwhuisdieren of aquacultuurdieren in een lidstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0018901#Artikel47
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '46'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0018901
        artikel: '47'
        hoofdstuk: V
  - number: '49'
    text: |-
      Het bestuur van het Productschap Diervoeder stelt bij verordening eisen aan de vergunning, bedoeld in
      [artikel 33, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel33
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '33'
  - number: '50'
    text: |-
      Degene die halffabrikaten met medicinale werking bereidt, verpakt, etiketteert of aflevert beschikt over een
      vergunning als bedoeld in [artikel 33, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel33
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '33'
  - number: '51.1'
    text: |-
      Het is verboden om een halffabrikaat met medicinale werking te bereiden uit een voormengsel met medicinale werking
      dat niet is geregistreerd.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel51
  - number: '51.2'
    text: |-
      Het is verboden om een halffabrikaat met medicinale werking te bereiden uit meer dan één voormengsel met medicinale
      werking.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel51
  - number: '52.1'
    text: |-
      Bij de verwerking van een voormengsel met medicinale werking tot een halffabrikaat met medicinale werking worden de
      voorschriften in acht genomen over die verwerking zoals vastgesteld bij de registratie van dat voormengsel.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel52
  - number: '52.2'
    text: |-
      Een halffabrikaat met medicinale werking wordt op zodanige wijze bereid dat het daarin verwerkte voormengsel met
      medicinale werking zijn werkzaamheid behoudt.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel52
  - number: '53.1'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat degene die halffabrikaten met medicinale werking bereidt daarvan
      opgave doet overeenkomstig bij ministeriële regeling te stellen regels.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel53
  - number: '53.2'
    text: |-
      De regels, bedoeld in het eerste lid, kunnen in elk geval betrekking hebbenop de bij de opgave te vermelden
      gegevens, de frequentie van opgave en degene aan wie opgave wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel53
  - number: '54'
    text: 'De verpakking van een halffabrikaat met medicinale werking voldoet aan elk van de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel54
  - number: 54.a
    text: 'zij is van een zodanige aard en kwaliteit dat:'
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel54
  - number: 54.a.1°
    text: zij is bestand tegen elke normale behandeling;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel54
  - number: 54.a.2°
    text: niets van de inhoud kan ontsnappen;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel54
  - number: 54.a.3°
    text: |-
      zij is geschikt om de samenstelling en de zuiverheid van het daarin verpakte halffabrikaat te waarborgen gedurende
      de aangegeven houdbaarheidstermijn onder de voorgeschreven of aanbevolen bewaaromstandigheden;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel54
  - number: 54.b
    text: de sluiting is van zodanige aard dat deze niet zonder zichtbare en onherstelbare beschadiging kan worden geopend.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel54
  - number: '55.1'
    text: |-
      Op of aan de verpakking van een halffabrikaat met medicinale werking, of in voorkomend geval de bijsluiter daarbij,
      komen de volgende aanduidingen en vermeldingen voor:
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel55
  - number: 55.1.a
    text: het gewicht van het halffabrikaat;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel55
  - number: 55.1.b
    text: |-
      de naam, het registratienummer en de hoeveelheid werkzame stof van het voormengsel met medicinale werking dat in
      het halffabrikaat is verwerkt;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel55
  - number: 55.1.c
    text: |-
      de voorschriften inzake de verwerking van het voormengsel met medicinale werking in het gemedicineerde voeder zoals
      vastgesteld bij de registratie van dat voormengsel;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel55
  - number: 55.1.d
    text: dat het halffabrikaat niet als zodanig aan dieren mag worden toegediend maar uitsluitend via gemedicineerd voeder;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel55
  - number: 55.1.e
    text: de in acht te nemen veiligheidsmaatregelen;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel55
  - number: 55.1.f
    text: de uiterste gebruiksdatum, rekening houdend met het voormengsel met medicinale werking in het halffabrikaat.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel55
  - number: '55.2'
    text: |-
      Indien een halffabrikaat met medicinale werking onverpakt wordt afgeleverd, worden de aanduidingen en vermeldingen
      in afwijking van het eerste lid op een het halffabrikaat begeleidend document geplaatst.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel55
  - number: '56.1'
    text: |-
      De aanduidingen en vermeldingen, bedoeld in [artikel 55][ref1], voldoen aan elk van de volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel55
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '55'
        hoofdstuk: VI
        paragraaf: '2'
  - number: 56.1.a
    text: |-
      zij zijn gesteld in de Nederlandse taal of, ingeval een halffabrikaat met medicinale werking is bestemd voor
      uitvoer, in de taal van het land van bestemming;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel56
  - number: 56.1.b
    text: zij zijn goed leesbaar en onuitwisbaar.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel56
  - number: '56.2'
    text: |-
      Andere aanduidingen en vermeldingen dan die bedoeld in het eerste lid kunnen uitsluitend op of bij de verpakking,
      onderscheidenlijk het bij een partij behorend begeleidend document, worden geplaatst voor zover zij:
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel56
  - number: 56.2.a
    text: niet in strijd zijn met de voorgeschreven aanduidingen of vermeldingen;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel56
  - number: 56.2.b
    text: |-
      niet misleidend zijn ten aanzien van de aard, samenstelling, eigenschappen en toepassingswijze van het
      halffabrikaat met medicinale werking.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel56
  - number: '57.1'
    text: Het is verboden om halffabrikaten met medicinale werking af te leveren.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel57
  - number: '57.2'
    text: 'Het eerste lid is niet van toepassing op het afleveren van halffabrikaten met medicinale werking aan:'
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel57
  - number: 57.2.a
    text: |-
      houders van een vergunning als bedoeld in [artikel 33, eerste lid, van de wet][ref1] voor het bereiden van
      gemedicineerde voeders;


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel33
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '33'
  - number: 57.2.b
    text: afnemers in andere landen dan lidstaten.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel57
  - number: '58'
    text: |-
      Voormengsels met medicinale werking of halffabrikaten met medicinale werking worden bewaard in afgesloten ruimten
      of in naar categorie hermetisch afgesloten recipiënten, die speciaal zijn ontworpen voor het bewaren van deze
      producten.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel58
  - number: '59'
    text: |-
      Vervoer van een halffabrikaat met medicinale werking in bulk vindt plaats in transportmiddelen of containers die
      op zodanige wijze zijn gereinigd, dat ongewenste wisselwerking met of besmetting van een later daarmee te vervoeren
      halffabrikaat met medicinale werking of gemedicineerd voeder wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel59
  - number: '60.1'
    text: |-
      Met halffabrikaten met medicinale werking als bedoeld in dit besluit worden gelijkgesteld halffabrikaten met
      medicinale werking die rechtmatig zijn vervaardigd of in de handel zijn gebracht in een andere lidstaat van de
      Europese Unie dan wel rechtmatig zijn vervaardigd in een staat, niet zijnde een lidstaat van de Europese Unie, die
      partij is bij een daartoe strekkend of mede daartoe strekkend verdrag dat Nederland bindt, en die voldoen aan eisen
      die een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het niveau dat met de nationale eisen wordt
      nagestreefd.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel60
  - number: '60.2'
    text: |-
      De aanduidingen op of aan de verpakking van halffabrikaten met medicinale werking, bedoeld in het eerste lid, of in
      voorkomend geval de bijsluiter daarbij, zijn gesteld in de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel60
  - number: '61'
    text: |-
      Het is verboden om gemedicineerd voeder te bereiden uit meer dan één voormengsel met medicinale werking of
      halffabrikaat met medicinale werking.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel61
  - number: '62.1'
    text: 'Gemedicineerd voeder wordt op zodanige wijze bereid dat aan elk van de volgende voorwaarden is voldaan:'
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel62
  - number: 62.1.a
    text: |-
      de voorschriften inzake de verwerking van het voormengsel met medicinale werking in het gemedicineerde voeder zoals
      vastgesteld bij de registratie van dat voormengsel, zijn in acht genomen;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel62
  - number: 62.1.b
    text: |-
      het daarin gebruikte diervoeder en het daarin verwerkte voormengsel met medicinale werking of halffabrikaat met
      medicinale werking zijn vermengd tot een homogeen en stabiel product ontstaat;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel62
  - number: 62.1.c
    text: |-
      het daarin verwerkte voormengsel met medicinale werking of halffabrikaat met medicinale werking heeft zijn
      werkzaamheid behouden;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel62
  - number: 62.1.d
    text: |-
      een ongewenste wisselwerking tussen de daarin verwerkte diergeneesmiddelen, toevoegingsmiddelen en diervoeders
      is uitgesloten;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel62
  - number: 62.1.e
    text: het gemedicineerde voeder is ten minste houdbaar gedurende het tijdvak dat het is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel62
  - number: '62.2'
    text: |-
      Ingeval in het gemedicineerde voeder een voormengsel met medicinale werking of halffabrikaat met medicinale werking
      wordt gebruikt dat antibiotica of coccidiostatica bevat, bevat het voor de bereiding van het gemedicineerde voeder
      te gebruiken diervoeder niet dezelfde antibiotica of coccidiostatica.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel62
  - number: '63.1'
    text: |-
      Op of bij de verpakking van gemedicineerd voeder dat wordt afgeleverd komen de aanduidingen of vermeldingen voor
      die bij de registratie van het zich daarin bevindende voormengsel met medicinale werking zijn voorgeschreven,
      alsmede de woorden «gemedicineerd voeder».
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel63
  - number: '63.2'
    text: |-
      Indien gemedicineerd voeder onverpakt wordt afgeleverd, worden de aanduidingen en vermeldingen in afwijking van het
      eerste lid op een het gemedicineerd voeder begeleidend document geplaatst.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel63
  - number: '64.1'
    text: |-
      Aan de houder van voedselproducerende dieren wordt geen gemedicineerd voeder afgeleverd in een grotere hoeveelheid
      dan is voorgeschreven in het recept dat voor de behandeling van de betrokken dieren is afgegeven door een
      dierenarts.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel64
  - number: '64.2'
    text: |-
      Onverminderd het eerste lid wordt geen grotere hoeveelheid aan gemedicineerd voeder afgeleverd dan benodigd voor de
      behandeling van de in het recept aangewezen dieren gedurende één maand.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel64
  - number: '65.1'
    text: |-
      Het is verboden om gemedicineerd voeder waarvoor een wachttermijn geldt af te leveren aan degene die bedrijfsmatig
      dieren houdt, zonder daarbij schriftelijk de noodzakelijke gegevens te verstrekken omtrent dat gemedicineerde
      voeder.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel65
  - number: '65.2'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gesteld met betrekking tot het verstrekken van de
      gegevens, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel65
  - number: '66.1'
    text: Het is degene die bedrijfsmatig dieren houdt verboden gemedicineerd voeder aan dieren te vervoederen.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel66
  - number: '66.2'
    text: 'Het eerste lid is niet van toepassing indien de houder van de dieren in het bezit is van:'
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel66
  - number: 66.2.a
    text: |-
      een bewijsstuk waaruit blijkt dat het gemedicineerde voeder afkomstig is van een houder van een vergunning als
      bedoeld in [artikel 33 van de wet][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel33
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '33'
  - number: 66.2.b
    text: |-
      een verklaring als bedoeld in [artikel 67, tweede lid, onderdeel c][ref1], van dit besluit of een afschrift
      daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel67
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '67'
        hoofdstuk: VI
        paragraaf: '3'
  - number: '67.1'
    text: |-
      Het is verboden om gemedicineerd voeder, waarin een niet in Nederland geregistreerd voormengsel met medicinale
      werking is verwerkt, uit een lidstaat in te voeren en voorhanden of in voorraad te hebben.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel67
  - number: '67.2'
    text: 'Het eerste lid is niet van toepassing indien aan elk van de volgende voorwaarden is voldaan:'
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel67
  - number: 67.2.a
    text: |-
      het gemedicineerde voeder is bereid in een lidstaat, overeenkomstig de voorschriften van [richtlijn nr. 90/167/
      EEG](31990L0167);
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel67
  - number: 67.2.b
    text: 'het in dat gemedicineerde voeder verwerkte voormengsel met medicinale werking:'
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel67
  - number: 67.2.b.1°
    text: is geregistreerd in de lidstaat, bedoeld in onderdeel a;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel67
  - number: 67.2.b.2°
    text: |-
      bevat dezelfde werkzame stoffen als een in Nederland geregistreerd voormengsel met medicinale werking en bezit een
      soortgelijke kwalitatieve en kwantitatieve samenstelling als dat voormengsel;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel67
  - number: 67.2.c
    text: |-
      de zending gaat vergezeld van een volledig ingevulde verklaring als bedoeld in artikel 10, derde lid, van
      [richtlijn nr. 90/167/EEG](31990L0167), die is afgegeven door de bevoegde instantie van de lidstaat waarvan het
      gemedicineerde voeder afkomstig is.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel67
  - number: '68'
    text: |-
      De bepalingen met betrekking tot halffabrikaten met medicinale werking, neergelegd in de [artikelen 54][ref1],
      [58][ref2] en [59][ref3], zijn van overeenkomstige toepassing op gemedicineerde voeders.


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0018901#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0018901#Artikel59
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '54'
        hoofdstuk: VI
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018901
        artikel: '58'
        hoofdstuk: VI
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0018901
        artikel: '59'
        hoofdstuk: VI
        paragraaf: '2'
  - number: '69.1'
    text: 'Het is een dierenarts verboden om gemedicineerd voeder voor te schrijven:'
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel69
  - number: 69.1.a
    text: |-
      dat is bereid met een voormengsel met medicinale werking dat niet is geregistreerd, tenzij het voormengsel dezelfde
      werkzame stoffen bevat als een in Nederland geregistreerd voormengsel met medicinale werking en een soortgelijke
      kwalitatieve en kwantitatieve samenstelling als dat voormengsel bezit;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel69
  - number: 69.1.b
    text: |-
      dat is bereid met een diergeneesmiddel waarvan verwerking tot een voormengsel met medicinale werking niet bij
      registratie van dat middel is toegestaan;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel69
  - number: 69.1.c
    text: |-
      anders dan met inachtneming van de bij de registratie van het daarin verwerkte dan wel te verwerken
      diergeneesmiddel gegeven voorschriften;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel69
  - number: 69.1.d
    text: in een hoeveelheid die groter is dan nodig voor de behandeling, ingevolge de door hem gestelde diagnose;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel69
  - number: 69.1.e
    text: |-
      dat als werkzame stof hetzelfde antibioticum of coccidiostaticum bevat dat gewoonlijk als toevoegingsmiddel is
      verwerkt in het diervoeder dat de houder van de dieren waarvoor de hulp van de dierenarts is ingeroepen aan deze
      dieren vervoedert.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel69
  - number: '69.2'
    text: |-
      Het is de dierenarts verboden om gemedicineerd voeder waarvoor een wachttermijn geldt voor te schrijven aan degene
      die bedrijfsmatig dieren houdt, zonder daarbij schriftelijk de noodzakelijke gegevens te verstrekken omtrent dat
      gemedicineerde voeder.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel69
  - number: '69.3'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gesteld met betrekking tot het verstrekken van de
      gegevens, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel69
  - number: '70.1'
    text: 'Het is de dierenarts verboden om een recept af te geven voor het afleveren van gemedicineerd voeder:'
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel70
  - number: 70.1.a
    text: |-
      dat niet voldoet aan bij ministeriële regeling gestelde regels met betrekking tot het model van het recept en de
      daarop te vermelden gegevens;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel70
  - number: 70.1.b
    text: zonder voorafgaande diagnose met betrekking tot de dieren waarvoor het gemedicineerde voeder is bestemd;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel70
  - number: 70.1.c
    text: met een geldigheidsduur van meer dan drie maanden;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel70
  - number: 70.1.d
    text: voor meer dan één behandeling.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel70
  - number: '70.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het recept, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel70
  - number: '70.3'
    text: |-
      De regels, bedoeld in het tweede lid, kunnen in elk geval betrekking hebben op het aantal afschriften van het
      recept en de bewaring daarvan.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel70
  - number: '71'
    text: 'Het bestuur van het Productschap Diervoeder stelt bij verordening regels dan wel nadere regels met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel71
  - number: 71.a
    text: |-
      de bereiding van gemedicineerd voeder, bedoeld in
      [artikel 62, eerste lid, aanhef in samenhang met onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel62
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '62'
        hoofdstuk: VI
        paragraaf: '3'
  - number: 71.b
    text: |-
      het bewaren van gemedicineerd voeder op een wijze dat aan de eigenschappen en de samenstelling daarvan geen afbreuk
      wordt gedaan;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel71
  - number: 71.c
    text: het etiketteren van gemedicineerd voeder.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel71
  - number: '72'
    text: |-
      Het bestuur van het Productschap Diervoeder kan bij verordening regels stellen met betrekking tot het voorhanden
      en in voorraad hebben van gemedicineerde voeders op een bedrijfseenheid waar gewoonlijk bedrijfsmatig dieren worden
      gehouden.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel72
  - number: '73.1'
    text: |-
      Bij ministeriële regeling worden ter uitvoering van communautaire maatregelen regels als bedoeld in
      [artikel 39, eerste en tweede lid, van de wet][ref1] gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel39
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '39'
  - number: '73.2'
    text: |-
      Bij ministeriële regeling kunnen regels met betrekking tot de controle van de administratie, bedoeld in
      [artikel 40, eerste lid, van de wet][ref1] worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel40
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '40'
  - number: '74'
    text: |-
      In aanvulling op [artikel 40, eerste lid, van de wet][ref1] kan bij ministeriële regeling worden bepaald dat uit
      de administratie, bedoeld in dat artikellid, tevens blijkt op welke datum dieren zijn onderzocht en behandeld,
      hun aantal, de diagnose, de aard en hoeveelheid van toegepaste diergeneesmiddelen, de duur van de behandeling en
      voorgeschreven wachttermijnen, alsmede wie de houder van die dieren is.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel40
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '40'
  - number: '75.1'
    text: |-
      Het is toegestaan om een diergeneesmiddel in afwijking van de [artikelen 2, eerste lid][ref1], en
      [21, eerste lid, van de wet][ref2] te bereiden, te verpakken, te etiketteren, voorhanden of in voorraad te hebben,
      af te leveren en bij dieren toe te passen, indien aan elk van de volgende voorwaarden is voldaan:


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '21'
  - number: 75.1.a
    text: |-
      het diergeneesmiddel verkeert als zodanig dan wel voor wat betreft een uitbreiding van de toepassingsmogelijkheden
      kennelijk in een proefstadium;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel75
  - number: 75.1.b
    text: Onze Minister heeft voor de proefneming toestemming verleend op aanvraag;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel75
  - number: 75.1.c
    text: |-
      de dieren waarbij het diergeneesmiddel wordt toegepast worden niet gebruikt voor de productie van levensmiddelen,
      tenzij dit naar het oordeel van Onze Minister geen ongunstige gevolgen heeft voor de diergezondheid, de menselijke
      gezondheid of het milieu.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel75
  - number: '75.2'
    text: |-
      Onze Minister kan toestemming verlenen om in afwijking van [artikel 32 van de wet][ref1] bij de bereiding van
      gemedicineerd voeder gebruik te maken van het diergeneesmiddel waarop een proefneming als bedoeld in het eerste lid
      betrekking heeft. Op dat gemedicineerde voeder is het eerste lid, onderdeel c, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel32
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '32'
  - number: '75.3'
    text: Aan de toestemming, bedoeld in het eerste lid, onderdeel b, en tweede lid, kunnen voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel75
  - number: '76.1'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent het indienen van een aanvraag om toestemming als bedoeld in
      [artikel 75, eerste lid, onderdeel b, en tweede lid][ref1], de verlenging of wijziging daarvan alsmede omtrent de
      wijze van behandeling.


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel75
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '75'
        hoofdstuk: VII
        paragraaf: '3'
  - number: '76.2'
    text: |-
      De regels, bedoeld in het eerste lid, kunnen onder meer betrekking hebben op de gegevens en bescheiden die moeten
      worden overgelegd alvorens een aanvraag in behandeling wordt genomen.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel76
  - number: '77'
    text: |-
      De ambtenaren, bedoeld in [artikel 52 van de wet][ref1], zijn bevoegd om van landbouwhuisdieren monsters te nemen
      van lichaamsvloeistoffen en uitscheidingsproducten, alsmede om van aquacultuurdieren en het vangstwater monsters
      te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel52
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '52'
  - number: '78'
    text: |-
      Op een monster dat op grond van [artikel 77][ref1] is genomen zijn de [artikelen 56][ref2] en [57 van de wet][ref3]
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0003818#Artikel57
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '77'
        hoofdstuk: VII
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '56'
      - id: ref3
        bwb_id: BWBR0003818
        artikel: '57'
  - number: '79.1'
    text: |-
      Indien in een monster, afkomstig van een landbouwhuisdier, aquacultuurdier of vangstwater, dan wel van een product,
      afkomstig van die dieren, residuen van diergeneesmiddelen of substanties die krachtens een communautaire maatregel
      niet aan landbouwhuisdieren of aquacultuurdieren mogen worden toegediend worden aangetroffen, worden de kosten van
      onderzoeken als bedoeld in artikel 16 van [richtlijn nr. 96/23/EG](31996L0023) in rekening gebracht bij de eigenaar
      of de houder van de bemonsterde dieren dan wel van de dieren waarvan de bemonsterde producten afkomstig zijn.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel79
  - number: '79.2'
    text: |-
      Onze Minister kan regels stellen omtrent de aard van de in het eerste lid bedoelde kosten, de hoogte van die
      kosten, het verschuldigd worden van die kosten en de wijze waarop die kosten in rekening worden gebracht.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel79
  - number: '80'
    text: |-
      Indien de uitkomst van de analyse van een monster wordt aangevochten, wordt die analyse op kosten van ongelijk
      bevestigd door het nationale referentielaboratorium dat overeenkomstig artikel 14, eerste lid, van [richtlijn nr.
      96/23/EG](31996L0023) voor de analyse van het residu of de substantie in het monster is aangewezen.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel80
  - number: '81'
    text: |-
      Onverminderd [artikel 19 van de wet][ref1] is het verboden om een diergeneesmiddel aan te bevelen of aan te prijzen
      aan het publiek ingeval dat diergeneesmiddel aan een van de volgende voorwaarden voldoet:


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel19
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '19'
  - number: 81.a
    text: het mag uitsluitend op recept van een dierenarts worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel81
  - number: 81.b
    text: |-
      het bevat psychotrope stoffen of verdovende middelen als bedoeld in [lijst I][ref1] en [II bij de Opiumwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001941
      [ref2]: https://wetten.overheid.nl/BWBR0001941
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel81
    references:
