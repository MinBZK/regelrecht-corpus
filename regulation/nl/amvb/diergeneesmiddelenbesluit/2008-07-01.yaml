  - number: '84.1'
    text: |-
      [Artikel 4][ref1] is niet van toepassing indien een aanvrager tot registratie van een diergeneesmiddel naar
      gegevens verwijst die door een registratiehouder van eenzelfde diergeneesmiddel met het oog op de aanvraag tot
      registratie van dat middel in een lidstaat zijn verstrekt vóór het tijdstip van inwerkingtreding van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel4
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '4'
        hoofdstuk: II
        paragraaf: '2'
  - number: '84.2'
    text: |-
      Een verwijzen als bedoeld in het eerste lid is verboden zolang nog geen 10 jaar zijn verstreken sinds de eerdere
      registratie, tenzij de eerdere aanvrager schriftelijk heeft verklaard tegen een dergelijk verwijzen geen bezwaar
      te hebben.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel84
  - number: '85'
    text: |-
      Een vergunning als bedoeld in [artikel 21 van de wet][ref1] voor het afleveren van een diergeneesmiddel die is
      verleend ten behoeve van de invoer van dat diergeneesmiddel, wordt voor de toepassing van [artikel 43][ref2]
      gelijkgesteld met een vergunning als bedoeld in [artikel 21 van de wet][ref3] voor het bereiden van dat
      diergeneesmiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0018901#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0018901
        artikel: '43'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0003818
        artikel: '21'
  - number: '86.1'
    text: |-
      Op een diergeneesmiddel als bedoeld in [artikel 58, tweede lid, van de wet][ref1] is
      [hoofdstuk III, paragraaf 4][ref2], van dit besluit niet van toepassing tot het tijdstip waarop de beslissing op de
      aanvraag tot registratie van dat middel onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0018901#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '58'
      - id: ref2
        bwb_id: BWBR0018901
        hoofdstuk: III
        paragraaf: '4'
  - number: '86.2'
    text: |-
      Voor zolang de beslissing, bedoeld in het eerste lid, niet onherroepelijk is, is het slechts toegestaan om een
      diergeneesmiddel als bedoeld in [artikel 58, tweede lid, van de wet][ref1] af te leveren indien op de verpakking
      van het diergeneesmiddel of een het diergeneesmiddel begeleidend document, ingeval het diergeneesmiddel onverpakt
      is, ten minste de volgende aanduidingen zijn geplaatst:


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel58
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '58'
  - number: 86.2.a
    text: de naam van het diergeneesmiddel;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel86
  - number: 86.2.b
    text: |-
      de naam of de handelsnaam en het adres van degene die voor het in de handel brengen van het diergeneesmiddel in
      Nederland verantwoordelijk is;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel86
  - number: 86.2.c
    text: de naam van de werkzame stof of stoffen in het diergeneesmiddel;
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel86
  - number: 86.2.d
    text: |-
      één van de volgende vermeldingen: diergeneesmiddel, voor diergeneeskundig gebruik, ad usum veterinarium of ad.
      us. vet.
    url: https://wetten.overheid.nl/BWBR0018901/2008-07-01#Artikel86
  - number: '87.1'
    text: |-
      De grondslag voor ontheffingen, verleend op grond van
      [artikel 27, zesde lid, van het Eisen- en controlebesluit vergunningen diergeneesmiddelen 1993][ref1], is met
      ingang van de datum van inwerkingtreding van dit besluit [artikel 45, eerste lid, van de wet][ref2].


