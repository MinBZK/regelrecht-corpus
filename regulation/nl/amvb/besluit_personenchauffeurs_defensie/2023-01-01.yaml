  - number: '3'
    text: De arbeidstijd voor de personenchauffeur met een volledige arbeidstijd bedraagt gemiddeld 45 uur per week.
    url: https://wetten.overheid.nl/BWBR0010280/2023-01-01#Artikel3
  - number: '4'
    text: |-
      1 De personenchauffeur ontvangt een aanvulling op zijn salaris per maand.

      2 Deze aanvulling bedraagt per maand voor de personenchauffeur met een volledige arbeidstijd 30 maal het salaris
      per uur, bedoeld in [artikel 1 van het inkomstenbesluit][ref1], vermenigvuldigd met de factor 1,5.

      3 De aanvulling wordt berekend over het voor de personenchauffeur geldende salaris per uur, met dien verstande dat
      het salaris per uur ten hoogste kan bedragen het salaris per uur dat is afgeleid van het salaris behorende bij het
      maximum van salarisschaal 4 van [bijlage A van het inkomstenbesluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018191
    url: https://wetten.overheid.nl/BWBR0010280/2023-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0018191
  - number: '5'
    text: |-
      De personenchauffeur met een volledige arbeidstijd ontvangt een vaste toelage onregelmatige dienst ten bedrage van
      € 165,59 bruto per maand.
    url: https://wetten.overheid.nl/BWBR0010280/2023-01-01#Artikel5
  - number: '6'
    text: |-
      1 De personenchauffeur wordt gedurende de pauzes consignatie als bedoeld in
      [artikel 4.6:2 van het Arbeidstijdenbesluit][ref1] opgelegd.

      2 De personenchauffeur heeft recht op een maandelijkse consignatietoelage.

      3 In afwijking van [artikel 23, tweede en derde lid, van het inkomstenbesluit][ref2] bedraagt de in het tweede lid
      bedoelde consignatietoelage, over ten hoogste het aantal van 45 geconsigneerde uren per maand, per uur: 1/195 van
      de som van het salaris en de in [artikel 4][ref3] genoemde aanvulling op het salaris, vermenigvuldigd met de factor
      0,5.

      4 De consignatietoelage wordt berekend over het voor de personenchauffeur geldende salaris per uur, met dien
      verstande dat het salaris per uur ten hoogste kan bedragen het salaris per uur dat is afgeleid van het salaris
      behorende bij het maximum van salarisschaal 4 van [bijlage A van het inkomstenbesluit][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007687#Artikel4.62
      [ref2]: https://wetten.overheid.nl/BWBR0018191#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0010280#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0018191
