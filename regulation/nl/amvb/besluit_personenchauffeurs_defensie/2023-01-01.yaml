  - number: '11'
    text: |-
      1 Voor de toepassing van dit artikel wordt onder personenchauffeur verstaan: de ambtenaar die krachtens artikel 1
      van het Besluit van 3 mei 1989 (Stb. 1989, 194), houdende een nadere werktijd regeling en overwerkvergoeding voor
      personenchauffeurs is aangewezen als personenchauffeur.

      2 Voor de toepassing van dit artikel wordt verstaan onder maandelijkse inkomsten:

      a. het salaris, bedoeld in [bijlage A van het inkomstenbesluit][ref1];

      b. de vakantieuitkering, bedoeld in [artikel 43 van het inkomstenbesluit][ref2];

      c. de eindejaarsuitkering, bedoeld in [artikel 8][ref3] van dit besluit ;

      d. de maandelijkse toelage en de geldelijke vergoeding voor 45 uren overwerk, bedoeld in het Besluit van 3 mei
      1989 (Stb. 1989, 194), houdende een nadere werktijd regeling en overwerkvergoeding voor personenchauffeurs,
      [artikelen 2][ref4] en [4, tweede lid][ref5];

      e. de aanvulling op het salaris, bedoeld in [artikel 4][ref6] van dit besluit;

      f. de vaste toelage onregelmatige dienst, bedoeld in [artikel 5][ref7] van dit besluit;

      g. de consignatietoelage op basis van 45 uren consignatie, bedoeld in [artikel 6, derde lid][ref8], van dit
      besluit.

      3 Aan de personenchauffeur wordt een overgangstoelage per maand toegekend, die éénmalig wordt afgeleid van
      het verschil tussen de inkomsten per maand, bedoeld in het tweede lid onder a, b, c en d op de dag vóór
      inwerkingtreding van dit besluit, en de inkomsten per maand, bedoeld in het tweede lid onder a, b, c, e, f en g,
      met ingang van de datum van inwerkingtreding van dit besluit.

      4 Indien het salaris van de personenchauffeur in de periode van 1 januari 1998 tot de datum van inwerkingtreding
      van dit besluit is verhoogd van salarisschaal 3 naar salarisschaal 4, wordt voor de toepassing van het derde lid
      het laatstelijk voor hem geldende salaris in de salarisschaal 3 in aanmerking genomen.

      5 Indien het salaris van de personenchauffeur na de datum van inwerkingtreding van dit besluit wordt verhoogd van
      salarisschaal 3 naar salarisschaal 4, wordt de overgangstoelage overeenkomstig verminderd met het bedrag van deze
      salarisverhoging.

      6 Voor de personenchauffeur, die op 31 december 2000 aanspraak heeft op de overgangstoelage, wordt de
      overgangstoelage met ingang van 1 januari 2001 verhoogd met 1,9%.


