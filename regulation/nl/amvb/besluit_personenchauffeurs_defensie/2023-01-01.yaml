  - number: '9'
    text: |-
      In afwijking van [artikel 32, vierde lid, van het reglement][ref1] bedraagt de aanspraak op vakantie voor de
      personenchauffeur met een volledige arbeidstijd 218 uren per kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel32
    url: https://wetten.overheid.nl/BWBR0010280/2023-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '32'
  - number: '10'
    text: |-
      Voor de personenchauffeur met een onvolledige arbeidstijd worden de in de [artikel 4][ref1] genoemde
      aanvulling op het salaris, de in [artikel 5][ref2] genoemde vaste toelage voor onregelmatige dienst, het in
      [artikel 6, derde lid][ref3], genoemde aantal uren consignatie en de in [artikel 9][ref4] genoemde aanspraak op
      vakantie, vastgesteld op een evenredig deel van die aanvulling, de toelage, het aantal uren consignatie en het
      aantal uren vakantie bij een volledige arbeidstijd.


      [ref1]: https://wetten.overheid.nl/BWBR0010280#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0010280#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0010280#Artikel6
