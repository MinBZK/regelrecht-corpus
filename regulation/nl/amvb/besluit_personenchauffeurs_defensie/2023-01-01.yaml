  - number: '7'
    text: |-
      De in de [artikelen 4][ref1], [5][ref2], en [6][ref3] genoemde aanvulling op het salaris, de vaste
      toelage voor onregelmatige dienst en de consignatietoelage behoren tot de bezoldiging, bedoeld in
      [artikel 1 van het inkomstenbesluit][ref4].


