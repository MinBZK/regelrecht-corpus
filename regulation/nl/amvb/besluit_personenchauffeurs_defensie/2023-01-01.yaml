  - number: '8'
    text: |-
      Over de in de [artikelen 4][ref1], [5][ref2], en [6][ref3] genoemde aanvulling op het maandsalaris, de
      vaste toelage voor onregelmatige dienst en de consignatietoelage heeft de personenchauffeur recht op een
      eindejaarsuitkering als bedoeld in [artikel 44 van het inkomstenbesluit][ref4].


