articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. personenchauffeur:

      de krachtens dit besluit door Onze Minister van Defensie aangewezen ambtenaren die de functie van personenchauffeur
      uitoefenen, alsmede de krachtens artikel 1 van het Besluit van 3 mei 1989 (Stb. 1989, 194), houdende een nadere
      werktijd regeling en overwerkvergoeding voor personenchauffeurs aangewezen ambtenaar;

      b. het inkomstenbesluit:

      het [Inkomstenbesluit burgerlijke ambtenaren defensie][ref1];

      c. het reglement:

      het [Burgerlijk ambtenarenreglement defensie][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018191
      [ref2]: https://wetten.overheid.nl/BWBR0006040
    url: https://wetten.overheid.nl/BWBR0010280/2023-01-01#Artikel1
