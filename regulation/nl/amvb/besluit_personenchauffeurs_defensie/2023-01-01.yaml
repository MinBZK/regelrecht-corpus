      Het Besluit van 3 mei 1989 (Stb. 1989, 194), houdende een nadere werktijd regeling en overwerkvergoeding voor
      personenchauffeurs wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0010280/2023-01-01#Artikel12
