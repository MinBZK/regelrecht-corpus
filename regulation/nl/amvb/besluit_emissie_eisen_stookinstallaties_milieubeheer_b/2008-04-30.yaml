---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_emissie_eisen_stookinstallaties_milieubeheer_b
regulatory_layer: AMVB
publication_date: '2010-04-01'
valid_from: '2008-04-30'
bwb_id: BWBR0004833
url: https://wetten.overheid.nl/BWBR0004833/2008-04-30
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 2 februari
    1989, Centrale Directie Juridische Zaken, afdeling Wetgeving, nr. MJZ 0229029, gedaan in overeenstemming met de
    Staatssecretaris van Sociale Zaken en Werkgelegenheid;

    Gelet op artikelen 2a en 30e van de Hinderwet (Stb. 1981, 410);

    De Raad van State gehoord (advies van 12 juli 1989, nr. W08.89.0074);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 23 april
    1990, Centrale Directie Juridische Zaken, afdeling Wetgeving, nr. MJZ 23490011, uitgebracht in overeenstemming met
    de Staatssecretaris van Sociale Zaken en Werkgelegenheid;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel1
  - number: 1.1.a
    text: |-
      brandstof: een brandstof in de zin van de [Wet inzake de luchtverontreiniging][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002731
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002731
  - number: 1.1.b
    text: 'kolen: steenkool of uit steenkool vervaardigde vaste brandstoffen, bruinkool en geperste bruinkool;'
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel1
  - number: 1.1.c
    text: |-
      zware stookolie: zware stookolie in de zin van de [Wet op de accijns][ref1] (*Stb.* 1991, 561) alsmede aardolie en
      produkten van aardolie waarvan het vloeipunt boven 40°C ligt;


      [ref1]: https://wetten.overheid.nl/BWBR0005251
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005251
  - number: 1.1.d
    text: |-
      gasolie: gasolie in de zin van de [Wet op de accijns][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005251
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005251
  - number: 1.1.e
    text: |-
      ketelinstallatie: een installatie, bestaande uit een ketel waarin brandstoffen worden verstookt, daaronder begrepen
      de bij de installatie behorende voorzieningen voor de reiniging van rookgas, en in hoofdzaak bedoeld om kracht op
      te wekken of om warmte over te dragen aan water of stoom dan wel een combinatie daarvan;
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel1
  - number: 1.1.f
    text: |-
      bestaande ketelinstallatie: een ketelinstallatie die voor 1 augustus 1990 is opgericht of met betrekking waartoe
      voor 1 augustus 1990 een vergunning is verleend, tenzij na dat tijdstip de ketelinstallatie geheel vervangen is dan
      wel, anders dan ter voldoening aan dit besluit, de combinatie van brander en vuurhaard door een andere is vervangen
      of aan die combinatie wijzigingen zijn aangebracht die met nieuwbouw overeenkomen;
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel1
  - number: 1.1.g
    text: |-
      gasturbine: een werktuig, bestaande uit een compressor, één of meer verbrandingskamers en een turbine waarin
      brandstof met behulp van door de compressor gecomprimeerde lucht wordt verstookt, waarna het geproduceerde
      verbrandingsgas in de turbine tot een lagere druk expandeert en daarbij arbeid afgeeft aan een roterende as;
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel1
  - number: 1.1.h
    text: |-
      bestaande gasturbine: een gasturbine die voor 1 augustus 1990 is opgericht of met betrekking waartoe voor 1
      augustus 1990 een vergunning is verleend, tenzij na dat tijdstip de gasturbine geheel vervangen is dan wel, anders
      dan ter voldoening aan dit besluit, wijzigingen zijn aangebracht die met nieuwbouw overeenkomen;
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel1
  - number: 1.1.i
    text: |-
      gasturbine-installatie: een installatie, bestaande uit een of meer gasturbines waarin brandstof wordt verstookt,
      met een of meer bijbehorende ketelinstallaties waar de verbrandingsgassen van deze gasturbine dan wel gasturbines
      doorheen worden gevoerd teneinde warmte over te dragen aan een medium dat niet in direct contact treedt met die
      gassen en waarin al of niet brandstof wordt verstookt en waarbij geen dan wel nagenoeg geen extra lucht voor de
      verbranding wordt toegevoerd;
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel1
  - number: 1.1.j
    text: |-
      bestaande gasturbine-installatie: een gasturbine-installatie die voor 1 augustus 1990 is opgericht of met
      betrekking waartoe voor 1 augustus 1990 een vergunning is verleend, tenzij na dat tijdstip de gasturbineinstallatie
      geheel vervangen is dan wel, anders dan ter voldoening aan dit besluit, wijzigingen zijn aangebracht die met
      nieuwbouw overeenkomen;
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel1
  - number: 1.1.k
    text: |-
      zuigermotor: een installatie, bestaande uit een toestel waarin een door verbranding van brandstof verkregen
      gasmengsel een zuiger in beweging brengt voor de aandrijving van een werktuig;
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel1
  - number: 1.1.l
    text: |-
      bestaande zuigermotor: een zuigermotor die voor 1 augustus 1990 is opgericht of met betrekking waartoe voor 1
      augustus 1990 een vergunning is verleend, tenzij na dat tijdstip de zuigermotor geheel is vervangen;
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel1
  - number: 1.1.m
    text: |-
      stookinstallatie: een ketelinstallatie, een gasturbine-installatie, een gasturbine of een zuigermotor, die is
      opgesteld in een inrichting waarop het [Besluit emissie-eisen stookinstallaties milieubeheer A][ref1] niet van
      toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0004147
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004147
  - number: 1.1.n
    text: |-
      warmte-inhoud van een hoeveelheid brandstof: de op de onderste verbrandingswaarde betrokken hoeveelheid energie die
      bij de verbranding van die hoeveelheid brandstof vrijkomt;
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel1
  - number: 1.1.o
    text: |-
      thermisch vermogen: de warmte-inhoud van de maximale hoeveelheid brandstof die per tijdseenheid kan worden
      toegevoerd aan een stookinstallatie;
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel1
  - number: 1.1.p
    text: |-
      bevoegd gezag: het bestuursorgaan dat bevoegd is of zou zijn een vergunning krachtens
      [artikel 8.1 van de Wet milieubeheer][ref1] voor de betrokken inrichting te verlenen;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 1.1.q
    text: |-
      vergunning: een vergunning krachtens [artikel 8.1 van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: '1.2'
    text: |-
      Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt het begrip vergunning uitsluitend
      gebruikt ter aanduiding van het gedeelte van de vergunning dat betrekking heeft op de stookinstallatie.
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel1
  - number: '1.3'
    text: |-
      Voor stookinstallaties die behoren tot een inrichting waarvoor de vergunningplicht is opgeheven, geldt voor
      de toepassing van dit besluit in plaats van de datum van vergunningverlening de datum van oprichting van de
      stookinstallatie.
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel1
  - number: '2.1'
    text: 'Dit besluit is van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel2
  - number: 2.1.a
    text: |-
      een ketelinstallatie, een gasturbine of een gasturbine-installatie, waarin kolen, zware stookolie, gasolie of
      aardgas dan wel een mengsel van twee of meer van deze brandstoffen wordt verstookt;
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel2
  - number: 2.1.b
    text: |-
      een zuigermotor waarin gasolie of gasvormige brandstoffen dan wel een mengsel van deze brandstoffen wordt
      verstookt, en welke wordt gebruikt voor de aandrijving van:
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel2
  - number: 2.1.b.1°
    text: |-
      een elektrische generator of gascompressor in een installatie voor warmtekrachtkoppeling onderscheidenlijk in een
      warmtepompinstallatie;
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel2
  - number: 2.1.b.2°
    text: |-
      een pomp of een compressor, die continu wordt gebruikt voor de produktie of het transport van aardgas, welke
      ontworpen is voor een jaarlijkse bedrijfstijd van ten minste 5000 uur.
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel2
  - number: '2.2'
    text: 'In afwijking van het eerste lid, zijn van de toepassing van dit besluit uitgezonderd:'
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel2
  - number: 2.2.a
    text: een bestaande gasturbine-installatie, waarvan tenminste een ketelinstallatie op kolen wordt gestookt;
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel2
  - number: 2.2.b
    text: |-
      een met zware stookolie, gasolie of aardgas gestookte ketelinstallatie met een thermisch vermogen van 0,9 MW of
      minder per ketel;
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel2
  - number: 2.2.c
    text: een gasturbine-installatie of een gasturbine, die jaarlijks minder dan 500 uren in bedrijf is;
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel2
  - number: 2.2.d
    text: een gasturbine-installatie of een gasturbine, waarvan het netto asvermogen minder bedraagt dan 1 MW;
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel2
  - number: 2.2.e
    text: |-
      een bestaande zuigermotor, waarin het aandeel van gasvormige brandstoffen in de warmte-inhoud van de toegevoerde
      brandstof minder dan 50% bedraagt;
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel2
  - number: 2.2.f
    text: |-
      een stookinstallatie die blijkens een daarvoor verleende vergunning wordt gebruikt voor het onderzoeken, beproeven
      of demonstreren van experimentele verbrandingstechnieken of van technieken ter bestrijding van de uitworp van
      zwaveldioxide, stikstofoxiden of stof;
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel2
  - number: 2.2.g
    text: een bestaande ketelinstallatie die bestemd is voor tijdelijk bedrijf van niet meer dan 500 uren per jaar;
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel2
  - number: 2.2.h
    text: |-
      een stookinstallatie waarvoor emissie-eisen zijn gesteld bij of krachtens het
      [Besluit verbranden afvalstoffen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016460
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0016460
  - number: '3.1'
    text: |-
      Degene die een inrichting drijft, waarin zich een stookinstallatie bevindt, voldoet aan de voorschriften die aan de
      vergunning zijn verbonden en aan de voorschriften die zijn opgenomen in de bij dit besluit behorende bijlage.
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel3
  - number: '3.2'
    text: |-
      Degene die een inrichting drijft, waarin zich een stookinstallatie bevindt en waarvoor een algemene maatregel
      van bestuur krachtens [artikel 8.40 van de Wet milieubeheer][ref1] geldt, voldoet aan de voorschriften die zijn
      opgenomen in de bij dit besluit behorende bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: '4'
    text: |-
      Onze Minister stelt nadere regels met betrekking tot de wijze waarop de concentraties aan zwaveldioxide,
      stikstofoxiden en stof in het rookgas en het voldoen aan de andere vereisten van dit besluit moeten worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel4
  - number: '5.1'
    text: |-
      Dit besluit treedt in werking met ingang van de derde kalendermaand na de datum van uitgifte van het *Staatsblad*
      waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel5
  - number: '5.2'
    text: 'In afwijking van het eerste lid treden:'
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel5
  - number: 5.2.a
    text: voorschrift 3.1.1, onder *c*,
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel5
  - number: 5.2.b
    text: voorschrift 4.1.1, onder *c*,
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel5
  - number: 5.2.c
    text: voorschrift 4.1.2, onder *c*,
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel5
  - number: 5.2.d
    text: voorschrift 5.1.4, onder *b*,
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel5
  - number: 5.2.e
    text: voorschrift 5.2.2, onder *b*, en
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel5
  - number: 5.2.f
    text: voorschrift 7.1, onder *a*, 2°,
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel5
  - number: '6'
    text: 'Dit besluit kan worden aangehaald als: Besluit emissie-eisen stookinstallaties milieubeheer B.'
    url: https://wetten.overheid.nl/BWBR0004833/2008-04-30#Artikel6
