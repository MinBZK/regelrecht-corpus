preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 18 augustus 1999,
    nr. MJZ99202475, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Gelet op richtlijn nr. 91/689/EEG van de Raad van de Europese Gemeenschappen van 12 december 1991 betreffende
    gevaarlijke afvalstoffen (PbEG L 377), richtlijn nr. 91/271/EEG van de Raad van de Europese Gemeenschappen van 21
    mei 1991 betreffende stedelijk afvalwater (PbEG L 135) en de artikelen 8.40, 8.41 en 8.42 van de Wet milieubeheer;

    De Raad van State gehoord (advies van 24 januari 2000, nr. W08.99.0446/V);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 7 juni
    2000, nr. MJZ 2000064166, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel1
  - number: 1.a
    text: |-
      bevoegd gezag: bestuursorgaan dat bevoegd zou zijn een vergunning te verlenen voor een inrichting als bedoeld in
      [artikel 2][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0011417#Artikel2
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011417
        artikel: '2'
  - number: 1.b
    text: |-
      vergunning: vergunning die is verleend krachtens [artikel 8.1 van de Wet milieubeheer][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 1.c
    text: 'bijlage: de bij dit besluit behorende bijlage,'
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel1
  - number: 1.d
    text: 'brandbare vloeistof: vloeistof of een verfproduct waarvan het vlampunt gelegen is op 55°C of hoger (K3-vloeistof),'
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel1
  - number: 1.e
    text: |-
      gevaarlijke stof: stof die of preparaat dat bij of krachtens het
      [Besluit verpakking en aanduiding milieugevaarlijke stoffen en preparaten][ref1] is ingedeeld in een categorie als
      bedoeld in [artikel 34, tweede lid, van de Wet milieugevaarlijke stoffen][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0004220
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel34
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004220
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '34'
  - number: 1.f
    text: |-
      geluidniveau: niveau van het ter plaatse optredende geluid, uitgedrukt in dB(A), overeenkomstig de door de
      Internationale Electrotechnische Commissie (IEC) opgestelde regels, zoals neergelegd in de IEC-publicatie nr. 651,
      uitgave 1979,
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel1
  - number: 1.g
    text: |-
      langtijdgemiddeld beoordelingsniveau (LAr, LT): gemiddelde van de afwisselende niveaus van het ter plaatse
      optredende geluid, gemeten in de loop van een bepaalde periode en vastgesteld en beoordeeld overeenkomstig de
      «Handleiding meten en rekenen industrielawaai», uitgave 1999,
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel1
  - number: 1.h
    text: |-
      woning: gebouw of gedeelte van een gebouw dat voor bewoning wordt gebruikt of daartoe is bestemd, met uitzondering
      van een dienst- of bedrijfswoning:
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel1
  - number: 1.h.1°
    text: |-
      behorende bij een inrichting als bedoeld in [artikel 2][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0011417#Artikel2
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011417
        artikel: '2'
  - number: 1.h.2°
    text: |-
      die op een bedrijventerrein is gelegen met een gemiddelde dichtheid aan dienst- of bedrijfswoningen van ten hoogste
      één per hectare,
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel1
  - number: 1.i
    text: |-
      geluidgevoelige bestemmingen: gebouwen of objecten, aangewezen krachtens de [artikelen 49][ref1] en
      [68 van de Wet geluidhinder][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel68
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '49'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '68'
  - number: 1.j
    text: 'piekniveau (LAmax): maximaal geluidniveau gemeten in de meterstand« F» of «fast»,'
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel1
  - number: 1.k
    text: 'goederen: roerende zaken, met uitzondering van binnenlandse en buitenlandse wettige betaalmiddelen,'
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel1
  - number: 1.l
    text: |-
      gasfles: een cilindrische drukhouder, voorzien van één aansluiting met klep of naaldafsluiter, die bedoeld is voor
      meermalig gebruik en een waterinhoud heeft van ten hoogste 150 liter,
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel1
  - number: 1.m
    text: |-
      verstikkende gassen: niet oxiderende, niet brandbare en niet giftige gassen die de zuurstof die gewoonlijk in de
      atmosfeer aanwezig is, verdunnen of verdringen,
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel1
  - number: 1.n
    text: 'CPR: Commissie Preventie van Rampen door Gevaarlijke Stoffen, en'
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel1
  - number: 1.o
    text: 'CPR 1: Richtlijn 1 van de CPR, getiteld «Nitraathoudende meststoffen, opslag en vervoer», derde druk, uitgave 1991.'
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel1
  - number: '2.1'
    text: 'Dit besluit is van toepassing op een inrichting die uitsluitend of in hoofdzaak bestemd is voor:'
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel2
  - number: 2.1.a
    text: het opslaan, overslaan en transporteren over de weg, van goederen of producten, of
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel2
  - number: 2.1.b
    text: |-
      het parkeren, stallen of verhuren van voor het vervoer van mensen of goederen over de weg bestemde motorvoertuigen,
      gelede motorvoertuigen, aanhangwagens of caravans.
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel2
  - number: '2.2'
    text: |-
      Dit besluit is eveneens van toepassing op inrichtingen die uitsluitend of in hoofdzaak bestemd zijn voor een
      samenstel van bedrijvigheden als bedoeld in het eerste lid, onder a en b.
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel2
  - number: '3.1'
    text: |-
      Dit besluit is niet van toepassing op een inrichting als bedoeld in [artikel 2][ref1], indien in de inrichting:


      [ref1]: https://wetten.overheid.nl/BWBR0011417#Artikel2
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011417
        artikel: '2'
  - number: 3.1.a
    text: |-
      één of meer stooktoestellen voor verwarming of warmtekrachtopwekking aanwezig zijn met een thermisch vermogen per
      toestel van 7500 kW of meer,
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
  - number: 3.1.b
    text: |-
      één of meer installaties of voorzieningen aanwezig zijn, die kunnen worden gebruikt voor het verstoken van andere
      brandstoffen dan aardgas, propaangas, butaangas of gasolie,
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
  - number: 3.1.c
    text: |-
      koel- en vriesinstallaties of warmtepompen aanwezig zijn met een capaciteit of een totale capaciteit van meer dan
      200 kg ammoniak of van meer dan 100 kg propaan, butaan of mengsels van propaan en butaan,
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
  - number: 3.1.d
    text: |-
      afvalstoffen worden op- of overgeslagen, die van buiten de inrichting afkomstig zijn, voorzover de inrichting
      beschikt over een opslagcapaciteit:
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
  - number: 3.1.d.1°
    text: van meer dan 35 m3 voor de opslag van afvalstoffen,
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
  - number: 3.1.d.2°
    text: voor de opslag van gevaarlijke afvalstoffen, of
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
  - number: 3.1.d.3°
    text: van meer dan 1 000 m3 per jaar voor de overslag van afvalstoffen,
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
  - number: 3.1.e
    text: dieren bedrijfsmatig worden gehouden,
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
  - number: 3.1.f
    text: |-
      gassen in tanks worden op- of overgeslagen, met uitzondering van gassen die in tanks worden op- of overgeslagen,
      waarop het [Besluit voorzieningen en installaties milieubeheer][ref1] van toepassing is,


      [ref1]: https://wetten.overheid.nl/BWBR0012897
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012897
  - number: 3.1.g
    text: |-
      onbewerkte huiden of vellen, ruwe tabak, ruwe tropische producten, asbest, blauwleer, vis, schaal- of weekdieren of
      niet als conserven verpakte producten hiervan worden op- of overgeslagen,
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
  - number: 3.1.h
    text: meer dan 50 m3 aan brandbare vloeistoffen wordt opgeslagen in bovengrondse tanks,
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
  - number: 3.1.i
    text: |-
      vloeibare gevaarlijke stoffen, vloeibare gevaarlijke afvalstoffen of brandbare vloeistoffen in tanks worden op- of
      overgeslagen, tenzij sprake is van:
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
  - number: 3.1.i.1°
    text: |-
      opslaan in ondergrondse tanks waarop het [Besluit opslaan in ondergrondse tanks 1998][ref1] van toepassing is,


      [ref1]: https://wetten.overheid.nl/BWBR0009747
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009747
  - number: 3.1.i.2°
    text: opslaan van brandbare vloeistoffen in bovengrondse tanks en
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
  - number: 3.1.i.3°
    text: opslaan van stoffen, genoemd in voorschrift 2.1.8,
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
  - number: 3.1.j
    text: |-
      organische meststoffen of nitraathoudende kunstmeststoffen anders dan die van type C als bedoeld in CPR 1 worden
      opgeslagen,
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
  - number: 3.1.k
    text: gasflessen of spuitbussen worden gevuld,
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
  - number: 3.1.l
    text: |-
      één of meer reparatie- of onderhoudswerkplaatsen aanwezig zijn, die niet in hoofdzaak worden gebruikt voor
      onderhoud, ondersteuning of reparatie van tot de inrichting behorende gebouwen, installaties, toestellen of
      voertuigen,
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
  - number: 3.1.m
    text: 'voorzieningen of installaties aanwezig zijn voor het afleveren van:'
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
  - number: 3.1.m.1°
    text: LPG of
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
  - number: 3.1.m.2°
    text: andere brandstoffen die niet in hoofdzaak worden gebruikt ten behoeve van transportmiddelen voor eigen gebruik,
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
  - number: 3.1.n
    text: |-
      meer dan in totaal 30 000 kg aan gevaarlijke stoffen en brandbare vloeistoffen in emballage als bedoeld in de
      voorschriften 2.1.4, 2.2.6 en 2.2.8 worden opgeslagen, niet zijnde gassen of gasmengsels in gasflessen of binnen
      één van de vormen van opslag als bedoeld in de voorschriften 2.1.4, 2.2.6 en 2.2.8 meer dan 10 000 kg wordt
      opgeslagen,
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
  - number: 3.1.o
    text: meer dan in totaal 1000 kg aan stoffen met een groot aquatoxisch karakter worden opgeslagen,
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
  - number: 3.1.p
    text: |-
      meer dan in totaal 2500 kg aan bestrijdingsmiddelen in de zin van de [Bestrijdingsmiddelenwet][ref1] wordt
      opgeslagen,


      [ref1]: https://wetten.overheid.nl/BWBR0002380
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002380
  - number: 3.1.q
    text: |-
      gassen of gasmengsels in gasflessen worden opgeslagen, met uitzondering van in totaal 10 000 liter aan verstikkende
      gassen, brandbare gassen of oxiderende gassen,
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
  - number: 3.1.r
    text: |-
      los gestorte fijnkorrelige stoffen, anders dan zand, grond of grind, op het open terrein van de inrichting worden
      opgeslagen, of
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
  - number: 3.1.s
    text: in hoofdzaak hout of producten van hout worden opgeslagen.
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
  - number: 3.1.t
    text: carcinogene, teratogene, mutagene stoffen of organische peroxiden worden op- of overgeslagen.
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
  - number: '3.2'
    text: |-
      Dit besluit is evenmin van toepassing op een inrichting als bedoeld in [artikel 2][ref1], indien de inrichting:


      [ref1]: https://wetten.overheid.nl/BWBR0011417#Artikel2
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011417
        artikel: '2'
  - number: 3.2.a
    text: behoort tot [categorie 3 van bijlage I bij het Inrichtingen- en vergunningenbesluit milieubeheer](onbekend),
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
  - number: 3.2.b
    text: |-
      een zodanige technische of functionele binding heeft met een laad- en loswal aan voor goederentransport bevaarbaar
      oppervlaktewater, dat sprake is van één inrichting als bedoeld in [artikel 1, vierde lid, tweede volzin, van de Wet
      milieubeheer](onbekend),
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
  - number: 3.2.c
    text: is ingericht als brandweerkazerne,
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
  - number: 3.2.d
    text: is ingericht voor de opslag, onderhoud of het transport van militair materieel, of
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
  - number: 3.2.e
    text: |-
      behoort tot een van de categorieën van inrichtingen waarop het [Besluit risico's zware ongevallen 1999][ref1] van
      toepassing is,


      [ref1]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010475
  - number: 3.2.t
    text: carcinogene, teratogene, mutagene stoffen of organische peroxiden worden op- of overgeslagen.
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel3
  - number: '4.1'
    text: |-
      De voorschriften die zijn opgenomen in de bijlage, gelden voor een ieder die de inrichting drijft. Deze draagt er
      zorg voor dat de voorschriften worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel4
  - number: '4.2'
    text: |-
      Indien een voorschrift dat is opgenomen in de bijlage, hoofdstukken 1 tot en met 3, inhoudt dat daarbij aangegeven
      middelen ter bescherming van het milieu moeten worden toegepast, meldt degene die de inrichting drijft en die
      voornemens is andere middelen toe te passen, dit voornemen ten minste vier weken voordat hij die andere middelen
      wil toepassen aan het bevoegd gezag, onder overlegging van de in [artikel 6, twaalfde lid][ref1], bedoelde
      gegevens. Het bevoegd gezag beslist over de juistheid van een gekozen middel.


      [ref1]: https://wetten.overheid.nl/BWBR0011417#Artikel6
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011417
        artikel: '6'
  - number: '5.1'
    text: 'Het bevoegd gezag kan nadere eisen stellen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel5
  - number: 5.1.a
    text: |-
      de in de bijlage opgenomen voorschriften ten aanzien van geluid, trilling, energie, afvalstoffen, afvalwater,
      lucht, verlichting, veiligheid, opslag en bodembescherming, voorzover dat in hoofdstuk 4 van de bijlage is
      aangegeven, of
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel5
  - number: 5.1.b
    text: |-
      de aanwezigheid van brandbestrijdingsmiddelen, de veiligheid van toestellen en installaties voor gas of
      elektriciteit, de veiligheid van de opslag van stoffen, het verbruik van grondstoffen, de gevolgen van het verkeer
      van personen of goederen van en naar de inrichting en de nadelige gevolgen voor het milieu die de inrichting kan
      veroorzaken waarop voorschrift 1.8.1 van de bijlage betrekking heeft, indien dat bijzonder is aangewezen in het
      belang van de bescherming van het milieu.
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel5
  - number: '5.2'
    text: |-
      De nadere eisen gelden voor een ieder die de inrichting drijft. Deze draagt er zorg voor dat de nadere eisen worden
      nageleefd.
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel5
  - number: '5.3'
    text: |-
      Het bevoegd gezag kan nadere eisen wijzigen of aanvullen in het belang van de bescherming van het milieu, of
      wijzigen of intrekken indien het belang van de bescherming van het milieu zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel5
  - number: '6.1'
    text: Degene die een inrichting opricht, meldt dit ten minste vier weken voor de oprichting aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel6
  - number: '6.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot het veranderen van een inrichting en het
      veranderen van de werking daarvan. Deze melding is niet vereist, indien eerder een melding overeenkomstig dit
      artikel is gedaan en door dit veranderen geen afwijking ontstaat van de bij die melding verstrekte gegevens.
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel6
  - number: '6.3'
    text: 'Bij de melding wordt vermeld:'
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel6
  - number: 6.3.a
    text: het adres van de inrichting,
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel6
  - number: 6.3.b
    text: |-
      de naam en het adres van degene die de inrichting opricht dan wel verandert of de werking daarvan verandert, en,
      indien dit iemand anders is, van degene die de inrichting drijft of zal drijven,
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel6
  - number: 6.3.c
    text: de aard en omvang van de activiteiten of processen in de inrichting,
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel6
  - number: 6.3.d
    text: de indeling en uitvoering van de inrichting, en
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel6
  - number: 6.3.e
    text: |-
      het tijdstip waarop de inrichting in werking zal zijn, de verandering daarvan gereed zal zijn, dan wel de
      verandering van de werking daarvan verwezenlijkt zal zijn.
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel6
  - number: '6.4'
    text: |-
      Indien de melding betrekking heeft op een inrichting waar transportbewegingen in de periode van 19:00 uur tot 07:00
      uur plaatsvinden, wordt bij de melding tevens een rapportage van een akoestisch onderzoek gevoegd, tenzij binnen
      een afstand van 50 m van de grens van de inrichting geen woningen van derden of andere geluidgevoelige bestemmingen
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel6
  - number: '6.5'
    text: |-
      Uit het rapport van het akoestisch onderzoek blijkt op grond van verrichte geluidmetingen of geluidberekeningen
      of aan de waarden in voorschrift 1.1.1 of 1.1.3 van de bijlage kan worden voldaan, voorzover het de periode
      tussen 19:00 uur en 07:00 uur betreft. In het rapport wordt aangegeven welke voorzieningen worden getroffen om te
      voorkomen dat de in de eerste volzin bedoelde waarden worden overschreden.
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel6
  - number: '6.6'
    text: |-
      Voorzover het een melding betreft als bedoeld in het tweede lid, is het overleggen van een rapport van een
      akoestisch onderzoek alleen vereist, indien een beoogde uitbreiding of verandering van de inrichting of het
      veranderen van de werking daarvan naar verwachting van nadelige invloed kan zijn op de geluidbelasting die door de
      inrichting wordt veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel6
  - number: '6.7'
    text: |-
      Indien bij de melding geen rapport van een akoestisch onderzoek is gevoegd, kan het bevoegd gezag besluiten
      dat het overleggen van een zodanig rapport niet is vereist, indien het aannemelijk is dat het langtijdgemiddeld
      beoordelingsniveau (LAr, LT) en het piekniveau (LAmax), veroorzaakt door de inrichting, niet meer bedragen dan de
      waarden bedoeld in voorschrift 1.1.1 of 1.1.3 van de bijlage.
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel6
  - number: '6.8'
    text: |-
      Bij de melding wordt een rapport van een onderzoek naar de nulsituatie van de bodem gevoegd. Het onderzoek naar
      de nulsituatie richt zich uitsluitend op de stoffen die door de werkzaamheden ter plaatse een bedreiging voor de
      bodemkwaliteit vormen en op de plaatsen waar bodembedreigende handelingen plaatsvinden dan wel zullen plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel6
  - number: '6.9'
    text: |-
      Indien bij de melding geen rapport van een onderzoek naar de nulsituatie van de bodem is gevoegd, kan het bevoegd
      gezag besluiten dat een zodanig onderzoek niet is vereist, indien aannemelijk is dat de kans op toekomstige
      bodemverontreiniging afwezig is.
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel6
  - number: '6.10'
    text: |-
      De in het derde tot en met het vijfde lid en in het achtste lid vermelde gegevens behoeven niet te worden verstrekt
      indien het bevoegd gezag over die gegevens beschikt.
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel6
  - number: '6.11'
    text: |-
      Degene die de melding doet, geeft bij de melding aan welke van de ingevolge dit artikel over te leggen gegevens hij
      reeds aan het bevoegd gezag heeft verschaft.
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel6
  - number: '6.12'
    text: |-
      Bij de melding overeenkomstig [artikel 4, tweede lid][ref1], worden aan het bevoegd gezag gegevens verstrekt
      waaruit blijkt dat met de volgens die melding toe te passen andere middelen een ten minste gelijkwaardige
      bescherming voor het milieu wordt bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0011417#Artikel4
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011417
        artikel: '4'
  - number: '7.1'
    text: |-
      Voor een inrichting die op het tijdstip van inwerkingtreding van dit besluit reeds was opgericht en waarvoor
      onmiddellijk daaraan voorafgaand een vergunning in werking en onherroepelijk was, blijven de voorschriften van
      die vergunning in verbinding met de gegevens die behoren bij de aanvraag, alsmede de aanvraag voorzover die deel
      uitmaakt van de vergunning en gegevens bevat die zich lenen voor opname of omzetting in voorschriften, gelden
      als nadere eis, bedoeld in [artikel 5][ref1], behoudens eerdere wijziging of intrekking van die voorschriften,
      gedurende drie jaar na het tijdstip van het van toepassing worden van dit besluit op die inrichting, mits het
      voorschrift betrekking heeft op een onderwerp dat is genoemd in [artikel 5, eerste lid, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011417#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011417#Artikel5
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011417
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0011417
        artikel: '5'
  - number: '7.2'
    text: |-
      De nadere eisen die onmiddellijk voorafgaande aan de inwerkingtreding van dit besluit golden krachtens de
      vergunning dan wel krachtens het Besluit opslag goederen milieubeheer blijven gelden als nadere eis, bedoeld in
      [artikel 5][ref1], na het tijdstip van de inwerkingtreding van dit besluit, mits het voorschrift betrekking heeft
      op een onderwerp dat is genoemd in [artikel 5, eerste lid, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011417#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011417#Artikel5
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011417
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0011417
        artikel: '5'
  - number: '8.1'
    text: |-
      Indien op het tijdstip waarop dit besluit in werking treedt, een inrichting reeds is opgericht en voor die
      inrichting onmiddellijk voor dat tijdstip geen vergunning in werking en onherroepelijk was of geen melding was
      gedaan krachtens het Besluit opslag goederen milieubeheer, meldt degene die de inrichting drijft, aan het bevoegd
      gezag dat hij de inrichting in werking heeft.
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel8
  - number: '8.2'
    text: |-
      De melding geschiedt binnen twaalf weken na het tijdstip waarop dit besluit in werking treedt. [Artikel 6][ref1],
      derde tot en met vijfde en zevende tot en met negende lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011417#Artikel6
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011417
        artikel: '6'
  - number: '8.3'
    text: |-
      Indien op het tijdstip waarop dit besluit in werking treedt, bij het bevoegd gezag een aanvraag om een vergunning
      is ingediend voor het oprichten van een inrichting waarop dit besluit van toepassing is of zal zijn, zijn het
      eerste en tweede lid niet van toepassing. De aanvraag wordt in dat geval aangemerkt als een melding overeenkomstig
      [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011417#Artikel6
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011417
        artikel: '6'
  - number: '9.1'
    text: Het Besluit opslag goederen milieubeheer wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel9
  - number: '9.2'
    text: |-
      Na de inwerkingtreding van dit besluit berust de Regeling slibvangputten en vet- of olie-afscheiders mede op het in
      de bijlage opgenomen voorschrift 1.3.12, onder b en c.
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel9
  - number: '10'
    text: Dit besluit treedt in werking met ingang van 1 oktober 2000.
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel10
  - number: '11'
    text: 'Dit besluit wordt aangehaald als: Besluit opslag- en transportbedrijven milieubeheer.'
    url: https://wetten.overheid.nl/BWBR0011417/2002-03-01#Artikel11
