  - number: '4'
    text: |-
      1 De voorschriften die zijn opgenomen in de bijlage, gelden voor een ieder die de inrichting drijft. Deze draagt er
      zorg voor dat de voorschriften worden nageleefd.

      2 Indien een voorschrift dat is opgenomen in de bijlage, hoofdstukken 1 tot en met 3, inhoudt dat daarbij
      aangegeven middelen ter bescherming van het milieu moeten worden toegepast, meldt degene die de inrichting drijft
      en die voornemens is andere middelen toe te passen, dit voornemen ten minste vier weken voordat hij die andere
      middelen wil toepassen aan het bevoegd gezag, onder overlegging van de in [artikel 6, twaalfde lid][ref1], bedoelde
      gegevens. Het bevoegd gezag beslist over de juistheid van een gekozen middel.


      [ref1]: https://wetten.overheid.nl/BWBR0011417#Artikel6
    url: https://wetten.overheid.nl/BWBR0011417/2004-08-13#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011417
        artikel: '6'
  - number: '5'
    text: |-
      1 Het bevoegd gezag kan nadere eisen stellen met betrekking tot:

      a. de in de bijlage opgenomen voorschriften ten aanzien van geluid, trilling, energie, afvalstoffen, afvalwater,
      lucht, verlichting, veiligheid, opslag en bodembescherming, voorzover dat in hoofdstuk 4 van de bijlage is
      aangegeven, of

      b. de aanwezigheid van brandbestrijdingsmiddelen, de veiligheid van toestellen en installaties voor gas of
      elektriciteit, de veiligheid van de opslag van stoffen, het verbruik van grondstoffen, de gevolgen van het verkeer
      van personen of goederen van en naar de inrichting en de nadelige gevolgen voor het milieu die de inrichting kan
      veroorzaken waarop voorschrift 1.8.1 van de bijlage betrekking heeft, indien dat bijzonder is aangewezen in het
      belang van de bescherming van het milieu.

      2 De nadere eisen gelden voor een ieder die de inrichting drijft. Deze draagt er zorg voor dat de nadere eisen
      worden nageleefd.

      3 Het bevoegd gezag kan nadere eisen wijzigen of aanvullen in het belang van de bescherming van het milieu, of
      wijzigen of intrekken indien het belang van de bescherming van het milieu zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0011417/2004-08-13#Artikel5
  - number: '6'
    text: |-
      1 Degene die een inrichting opricht, meldt dit ten minste vier weken voor de oprichting aan het bevoegd gezag.

      2 Het eerste lid is van overeenkomstige toepassing met betrekking tot het veranderen van een inrichting en het
      veranderen van de werking daarvan. Deze melding is niet vereist, indien eerder een melding overeenkomstig dit
      artikel is gedaan en door dit veranderen geen afwijking ontstaat van de bij die melding verstrekte gegevens.

      3 Bij de melding wordt vermeld:

      a. het adres van de inrichting,

      b. de naam en het adres van degene die de inrichting opricht dan wel verandert of de werking daarvan verandert, en,
      indien dit iemand anders is, van degene die de inrichting drijft of zal drijven,

      c. de aard en omvang van de activiteiten of processen in de inrichting,

      d. de indeling en uitvoering van de inrichting, en

      e. het tijdstip waarop de inrichting in werking zal zijn, de verandering daarvan gereed zal zijn, dan wel de
      verandering van de werking daarvan verwezenlijkt zal zijn.

      4 Indien de melding betrekking heeft op een inrichting waar transportbewegingen in de periode van 19:00 uur tot
      07:00 uur plaatsvinden, wordt bij de melding tevens een rapportage van een akoestisch onderzoek gevoegd, tenzij
      binnen een afstand van 50 m van de grens van de inrichting geen woningen van derden of andere geluidgevoelige
      bestemmingen aanwezig zijn.

      5 Uit het rapport van het akoestisch onderzoek blijkt op grond van verrichte geluidmetingen of geluidberekeningen
      of aan de waarden in voorschrift 1.1.1 of 1.1.3 van de bijlage kan worden voldaan, voorzover het de periode
      tussen 19:00 uur en 07:00 uur betreft. In het rapport wordt aangegeven welke voorzieningen worden getroffen om te
      voorkomen dat de in de eerste volzin bedoelde waarden worden overschreden.

      6 Voorzover het een melding betreft als bedoeld in het tweede lid, is het overleggen van een rapport van een
      akoestisch onderzoek alleen vereist, indien een beoogde uitbreiding of verandering van de inrichting of het
      veranderen van de werking daarvan naar verwachting van nadelige invloed kan zijn op de geluidbelasting die door de
      inrichting wordt veroorzaakt.

      7 Indien bij de melding geen rapport van een akoestisch onderzoek is gevoegd, kan het bevoegd gezag besluiten
      dat het overleggen van een zodanig rapport niet is vereist, indien het aannemelijk is dat het langtijdgemiddeld
      beoordelingsniveau (LAr, LT) en het piekniveau (LAmax), veroorzaakt door de inrichting, niet meer bedragen dan de
      waarden bedoeld in voorschrift 1.1.1 of 1.1.3 van de bijlage.

      8 Bij de melding wordt een rapport van een onderzoek naar de nulsituatie van de bodem gevoegd. Het onderzoek naar
      de nulsituatie richt zich uitsluitend op de stoffen die door de werkzaamheden ter plaatse een bedreiging voor de
      bodemkwaliteit vormen en op de plaatsen waar bodembedreigende handelingen plaatsvinden dan wel zullen plaatsvinden.

      9 Indien bij de melding geen rapport van een onderzoek naar de nulsituatie van de bodem is gevoegd, kan het
      bevoegd gezag besluiten dat een zodanig onderzoek niet is vereist, indien aannemelijk is dat de kans op toekomstige
      bodemverontreiniging afwezig is.

      10 De in het derde tot en met het vijfde lid en in het achtste lid vermelde gegevens behoeven niet te worden
      verstrekt indien het bevoegd gezag over die gegevens beschikt.

      11 Degene die de melding doet, geeft bij de melding aan welke van de ingevolge dit artikel over te leggen gegevens
      hij reeds aan het bevoegd gezag heeft verschaft.

      12 Bij de melding overeenkomstig [artikel 4, tweede lid][ref1], worden aan het bevoegd gezag gegevens verstrekt
      waaruit blijkt dat met de volgens die melding toe te passen andere middelen een ten minste gelijkwaardige
      bescherming voor het milieu wordt bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0011417#Artikel4
