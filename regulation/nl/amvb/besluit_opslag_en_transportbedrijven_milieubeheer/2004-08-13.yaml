      1 Het Besluit opslag goederen milieubeheer wordt ingetrokken.

      2 Na de inwerkingtreding van dit besluit berust de Regeling slibvangputten en vet- of olie-afscheiders mede op het
      in de bijlage opgenomen voorschrift 1.3.12, onder b en c.
