  - number: '2'
    text: |-
      1 Dit besluit is van toepassing op een inrichting die uitsluitend of in hoofdzaak bestemd is voor:

      a. het opslaan, overslaan en transporteren over de weg, van goederen of producten, of

      b. het parkeren, stallen of verhuren van voor het vervoer van mensen of goederen over de weg bestemde
      motorvoertuigen, gelede motorvoertuigen, aanhangwagens of caravans.

      2 Dit besluit is eveneens van toepassing op inrichtingen die uitsluitend of in hoofdzaak bestemd zijn voor een
      samenstel van bedrijvigheden als bedoeld in het eerste lid, onder a en b.
    url: https://wetten.overheid.nl/BWBR0011417/2004-08-13#Artikel2
  - number: '3'
    text: |-
      1 Dit besluit is niet van toepassing op een inrichting als bedoeld in [artikel 2][ref1], indien in de inrichting:

      a. één of meer stooktoestellen voor verwarming of warmtekrachtopwekking aanwezig zijn met een thermisch vermogen
      per toestel van 7500 kW of meer,

      b. één of meer installaties of voorzieningen aanwezig zijn, die kunnen worden gebruikt voor het verstoken van
      andere brandstoffen dan aardgas, propaangas, butaangas of gasolie,

      c. koel- en vriesinstallaties of warmtepompen aanwezig zijn met een capaciteit of een totale capaciteit van meer
      dan 200 kg ammoniak of van meer dan 100 kg propaan, butaan of mengsels van propaan en butaan,

      d. afvalstoffen worden op- of overgeslagen, die van buiten de inrichting afkomstig zijn, voorzover de inrichting
      beschikt over een opslagcapaciteit:

      1°. van meer dan 35 m3 voor de opslag van afvalstoffen,

      2°. voor de opslag van gevaarlijke afvalstoffen, tenzij het betreft opslag met een capaciteit van 35 m3 of
      minder van afgedankte apparatuur, in de bijlage bij beschikking nr. 2000/532/EG van de Commissie van de Europese
      gemeenschappen van 3 mei 2000 houdende vaststelling van de lijst van afvalstoffen overeenkomstig artikel I, onder
      a), van [Richtlijn 75/442/EEG](31975L0442) van de Raad van de Europese Gemeenschappen betreffende afvalstoffen
      en Beschikking 94/409/EG van de Raad van de Europese Unie tot vaststelling van een lijst van afvalstoffen
      overeenkomstig artikel 1, lid 4, van [Richtlijn 91/689/EEG](31991L0689) van de Raad van de Europese Gemeenschappen
      betreffende gevaarlijke afvalstoffen (PbEG L 226/3) aangeduid met een van de afvalstoffencodes 16 02 11*,
      16 02 12*, 16 02 13*, 20 01 23*, 20 01 35* of 21 01 21*, of

      3°. van meer dan 1 000 m3 per jaar voor de overslag van afvalstoffen,

      e. dieren bedrijfsmatig worden gehouden,

      f. gassen in tanks worden op- of overgeslagen, met uitzondering van gassen die in tanks worden op- of overgeslagen,
      waarop het [Besluit voorzieningen en installaties milieubeheer][ref2] van toepassing is,

      g. onbewerkte huiden of vellen, ruwe tabak, ruwe tropische producten, asbest, blauwleer, vis, schaal- of weekdieren
      of niet als conserven verpakte producten hiervan worden op- of overgeslagen,

      h. meer dan 50 m3 aan brandbare vloeistoffen wordt opgeslagen in bovengrondse tanks,

      i. vloeibare gevaarlijke stoffen, vloeibare gevaarlijke afvalstoffen of brandbare vloeistoffen in tanks worden op-
      of overgeslagen, tenzij sprake is van:

      1°. opslaan in ondergrondse tanks waarop het [Besluit opslaan in ondergrondse tanks 1998][ref3] van toepassing is,

      2°. opslaan van brandbare vloeistoffen in bovengrondse tanks en

      3°. opslaan van stoffen, genoemd in voorschrift 2.1.8,

      j. organische meststoffen of nitraathoudende kunstmeststoffen anders dan die van type C als bedoeld in CPR 1 worden
      opgeslagen,

      k. gasflessen of spuitbussen worden gevuld,

      l. één of meer reparatie- of onderhoudswerkplaatsen aanwezig zijn, die niet in hoofdzaak worden gebruikt voor
      onderhoud, ondersteuning of reparatie van tot de inrichting behorende gebouwen, installaties, toestellen of
      voertuigen,

      m. voorzieningen of installaties aanwezig zijn voor het afleveren van:

      1°. LPG of

      2°. andere brandstoffen die niet in hoofdzaak worden gebruikt ten behoeve van transportmiddelen voor eigen gebruik,

      n. meer dan in totaal 30 000 kg aan gevaarlijke stoffen en brandbare vloeistoffen in emballage als bedoeld in de
      voorschriften 2.1.4, 2.2.6 en 2.2.8 worden opgeslagen, niet zijnde gassen of gasmengsels in gasflessen of binnen
      één van de vormen van opslag als bedoeld in de voorschriften 2.1.4, 2.2.6 en 2.2.8 meer dan 10 000 kg wordt
      opgeslagen,

      o. meer dan in totaal 1000 kg aan stoffen met een groot aquatoxisch karakter worden opgeslagen,

      p. meer dan in totaal 2500 kg aan bestrijdingsmiddelen in de zin van de [Bestrijdingsmiddelenwet][ref4] wordt
      opgeslagen,

      q. gassen of gasmengsels in gasflessen worden opgeslagen, met uitzondering van in totaal 10 000 liter aan
      verstikkende gassen, brandbare gassen of oxiderende gassen,

      r. los gestorte fijnkorrelige stoffen, anders dan zand, grond of grind, op het open terrein van de inrichting
      worden opgeslagen, of

      s. in hoofdzaak hout of producten van hout worden opgeslagen,

      t. carcinogene, teratogene, mutagene stoffen of organische peroxiden worden op- of overgeslagen.

      2 Dit besluit is evenmin van toepassing op een inrichting als bedoeld in [artikel 2][ref5], indien de inrichting:

      a. behoort tot [categorie 3 van bijlage I bij het Inrichtingen- en vergunningenbesluit milieubeheer](onbekend),

      b. een zodanige technische of functionele binding heeft met een laad- en loswal aan voor goederentransport
      bevaarbaar oppervlaktewater, dat sprake is van één inrichting als bedoeld in [artikel 1, vierde lid, tweede volzin,
      van de Wet milieubeheer](onbekend),

      c. is ingericht als brandweerkazerne,

      d. is ingericht voor de opslag, onderhoud of het transport van militair materieel, of

      e. behoort tot een van de categorieën van inrichtingen waarop het [Besluit risico's zware ongevallen 1999][ref6]
      van toepassing is,

      3 Een wijziging van de bijlage bij beschikking nr. 2000/532/EG gaat voor de toepassing van het eerste lid,
      onderdeel d, onder 2°, gelden met ingang van de dag waarop aan die wijziging uitvoering moet zijn gegeven, tenzij
      bij ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.


