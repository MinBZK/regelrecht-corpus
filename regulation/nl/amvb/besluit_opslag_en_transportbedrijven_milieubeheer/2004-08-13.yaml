articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. bevoegd gezag: bestuursorgaan dat bevoegd zou zijn een vergunning te verlenen voor een inrichting als bedoeld
      in [artikel 2][ref1],

      b. vergunning: vergunning die is verleend krachtens [artikel 8.1 van de Wet milieubeheer][ref2],

      c. bijlage: de bij dit besluit behorende bijlage,

      d. brandbare vloeistof: vloeistof of een verfproduct waarvan het vlampunt gelegen is op 55°C of hoger (K3-
      vloeistof),

      e. gevaarlijke stof: stof die of preparaat dat bij of krachtens het
      [Besluit verpakking en aanduiding milieugevaarlijke stoffen en preparaten][ref3] is ingedeeld in een categorie als
      bedoeld in [artikel 34, tweede lid, van de Wet milieugevaarlijke stoffen][ref4],

      f. geluidniveau: niveau van het ter plaatse optredende geluid, uitgedrukt in dB(A), overeenkomstig de door de
      Internationale Electrotechnische Commissie (IEC) opgestelde regels, zoals neergelegd in de IEC-publicatie nr. 651,
      uitgave 1979,

      g. langtijdgemiddeld beoordelingsniveau (LAr, LT): gemiddelde van de afwisselende niveaus van het ter plaatse
      optredende geluid, gemeten in de loop van een bepaalde periode en vastgesteld en beoordeeld overeenkomstig de
      «Handleiding meten en rekenen industrielawaai», uitgave 1999,

      h. woning: gebouw of gedeelte van een gebouw dat voor bewoning wordt gebruikt of daartoe is bestemd, met
      uitzondering van een dienst- of bedrijfswoning:

      1°. behorende bij een inrichting als bedoeld in [artikel 2][ref5], of

      2°. die op een bedrijventerrein is gelegen met een gemiddelde dichtheid aan dienst- of bedrijfswoningen van ten
      hoogste één per hectare,

      i. geluidgevoelige bestemmingen: gebouwen of objecten, aangewezen krachtens de [artikelen 49][ref6] en
      [68 van de Wet geluidhinder][ref7],

      j. piekniveau (LAmax): maximaal geluidniveau gemeten in de meterstand« F» of «fast»,

      k. goederen: roerende zaken, met uitzondering van binnenlandse en buitenlandse wettige betaalmiddelen,

      l. gasfles: een cilindrische drukhouder, voorzien van één aansluiting met klep of naaldafsluiter, die bedoeld is
      voor meermalig gebruik en een waterinhoud heeft van ten hoogste 150 liter,

      m. verstikkende gassen: niet oxiderende, niet brandbare en niet giftige gassen die de zuurstof die gewoonlijk in de
      atmosfeer aanwezig is, verdunnen of verdringen,

      n. CPR: Commissie Preventie van Rampen door Gevaarlijke Stoffen, en

      o. CPR 1: Richtlijn 1 van de CPR, getiteld «Nitraathoudende meststoffen, opslag en vervoer», derde druk, uitgave
      1991.


