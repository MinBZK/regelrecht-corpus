  - number: '3'
    text: |-
      1 Zuigelingenvoeding moet

      a. het gebruiksdoel in aanmerking genomen, deugdelijk van samenstelling zijn en in een deugdelijke toestand
      verkeren;

      b. worden gepresenteerd in overeenstemming met haar aard en bestemming.

      2 Zuigelingenvoeding mag niet bevatten

      a. stoffen in een hoeveelheid, waarin deze schadelijk zijn of kunnen zijn voor de gezondheid;

      b. zichtbare vreemde bestanddelen, vuil of andere verontreinigingen, tenzij hiervoor krachtens [artikel 6][ref1]
      maximaal toelaatbare hoeveelheden zijn vastgesteld, in welk geval het betreffende maximum niet mag worden
      overschreden;

      c. micro-organismen, zodanig naar soort en aantal, dat schade aan de gezondheid kan ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003732#Artikel6
    url: https://wetten.overheid.nl/BWBR0003732/1999-11-26#Artikel3
    references:
