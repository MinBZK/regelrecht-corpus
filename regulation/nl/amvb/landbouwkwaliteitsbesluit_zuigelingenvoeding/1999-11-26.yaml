        artikel: '1'
  - number: '15'
    text: |-
      1 Van het bij of krachtens dit besluit bepaalde kunnen Onze Minister en Onze Minister van Welzijn, Volksgezondheid
      en Cultuur te zamen vrijstelling en, op aanvrage, ontheffing verlenen.

      2 Bij het stellen van regelen of nadere regelen, als bedoeld in [artikel 6, eerste lid][ref1], kunnen Onze Minister
      en Onze Minister van Welzijn, Volksgezondheid en Cultuur te zamen bepalen dat een ontheffing, als bedoeld in het
      eerste lid, kan worden verleend door de in [artikel 12][ref2] genoemde controle-instelling, of enig orgaan hiervan,
      dan wel door een door hen aan te wijzen autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0003732#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003732#Artikel12
