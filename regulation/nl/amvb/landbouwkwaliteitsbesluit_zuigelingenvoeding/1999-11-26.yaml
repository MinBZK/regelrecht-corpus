        artikel: '10'
      - id: ref2
        bwb_id: BWBR0003732
        artikel: '8'
  - number: '13'
    text: |-
      1 De voorzitter van de in [artikel 12][ref1] genoemde controle-instelling wordt door Onze Minister, telkens voor
      ten hoogste vier jaren, benoemd. Hij is terstond weder benoembaar.

      2 Het bestuur van de controle-instelling doet aan Onze Minister een voordracht voor de benoeming.

      3 De voorzitter mag niet rechtstreeks betrokken zijn bij de bereiding van of de handel in zuigelingenvoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0003732#Artikel12
    url: https://wetten.overheid.nl/BWBR0003732/1999-11-26#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003732
        artikel: '12'
  - number: '14'
    text: |-
      Onze Minister kan in overeenstemming met Onze Minister van Financiën plaatsen aanwijzen, waarop
      zuigelingenvoeding of bepaalde tot deze categorie behorende produkten ten uitvoer, als bedoeld in
      [artikel 1, eerste lid, van de In- en uitvoerwet][ref1] moeten worden aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0002376#Artikel1
    url: https://wetten.overheid.nl/BWBR0003732/1999-11-26#Artikel14
