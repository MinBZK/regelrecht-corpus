preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Landbouw en Visserij, de Staatssecretaris van Welzijn, Volksgezondheid
    en Cultuur en de Staatssecretaris van Economische Zaken (P. H. van Zeil) van 19 augustus 1983, (Directie Juridische
    en Bedrijfsorganisatorische Zaken, no. J 5225);

    Overwegende, dat ter bevordering van de afzet regelen met betrekking tot de kwaliteit van zuigelingenvoeding worden
    gesteld;

    Gelet op de artikelen 2, 3, 4, 6, 7, 8, 9, 12, eerste lid, en 19 van de Landbouwkwaliteitswet (Stb. 1971, 371);

    Gehoord:

    het Produktschap voor Zuivel,

    het Centraal Orgaan Zuivelcontrole,

    het Controlestation voor Melkprodukten,

    de Koninklijke Nederlandse Zuivelbond FNZ,

    de Vereeniging voor Zuivelindustrie en Melkhygiëne (VVZM),

    de Vereniging van Nederlandse Fabrikanten van Kinder- en Dieetvoedingsmiddelen,

    de Nederlandse Vereniging van Fabrikanten van Geconserveerde Melk,

    de Bond van Coöperatieve Zuivelverkoopverenigingen,

    de Vereniging van Groothandelaren in Melkprodukten,

    de Consumentenbond,

    het Konsumenten Kontakt en

    de Werkgroep Babyvoeding en de Derde Wereld;

    De Raad van State gehoord (advies van 22 november 1983, no. W 11.83.0463/22.3.47);

    Gezien het nader rapport van de Staatssecretaris van Landbouw en Visserij, de Staatssecretaris van Welzijn,
    Volksgezondheid en Cultuur en de Staatssecretaris van Economische Zaken (P. H. van Zeil) van 4 oktober 1984, no. J
    5377, Directie Juridische en Bedrijfsorganisatorische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003732/1999-11-26#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      wet: [Landbouwkwaliteitswet][ref1] (*Stb.* 1971, 371);

      zuigelingen: kinderen jonger dan twaalf maanden;

      zuigelingenvoeding: volledige zuigelingenvoeding en opvolgzuigelingenvoeding;

      volledige zuigelingenvoeding: voedingsmiddelen die speciaal zijn bedoeld om als voeding voor zuigelingen in de
      eerste vier tot zes levensmaanden te worden gebruikt, en die volledig aan de voedingseisen van deze categorie
      personen voldoen;

      opvolgzuigelingenvoeding: voedingsmiddelen die speciaal zijn bedoeld om als voeding voor zuigelingen die ouder
      zijn dan vier maanden te worden gebruikt en die het belangrijkste vloeibare bestanddeel vormen van de steeds
      gevarieerder wordende voeding van deze personen;

      verhandelen: bedrijfsmatig voorhanden of in voorraad hebben, te koop aanbieden, verkopen, afleveren of vervoeren.

      2 Onder zuigelingenvoeding in de zin van dit besluit wordt niet verstaan het produkt waarvan door middel van
      aanduidingen op de verpakking tot uitdrukking wordt gebracht dat het op grond van samenstelling of bereidingswijze
      uitsluitend bestemd is als voeding voor zuigelingen wier assimilatieproces of stofwisseling is verstoord.

      3 In dit besluit en de daarop berustende bepalingen wordt onder bereiden mede verstaan door Onze Minister en
      Onze Minister van Welzijn, Volksgezondheid en Cultuur bij de in [artikel 6, eerste lid][ref2], bedoelde regelen
      aangewezen vormen van behandeling van zuigelingenvoeding die de kwaliteit van dit produkt in belangrijke mate
      kunnen beïnvloeden.

      4 Het bij of krachtens de [artikelen 2 tot en met 11][ref3] van dit besluit bepaalde is niet van toepassing op
      zuigelingenvoeding die kennelijk bestemd is om binnen het grondgebied van een lid-staat van de Europese Unie of van
      een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte te worden afgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0002755
      [ref2]: https://wetten.overheid.nl/BWBR0003732#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0003732#Artikel2
