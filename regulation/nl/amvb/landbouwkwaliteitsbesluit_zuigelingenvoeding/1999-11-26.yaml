        artikel: '8'
  - number: '10'
    text: |-
      1 Onze Minister kan bepalen dat zuigelingenvoeding of bepaalde tot deze categorie behorende produkten aan een
      keuring kunnen of moeten worden onderworpen.

      2 Onze Minister kan regelen stellen inzake de keuring.
    url: https://wetten.overheid.nl/BWBR0003732/1999-11-26#Artikel10
  - number: '11'
    text: |-
      Onze Minister en Onze Minister van Welzijn, Volksgezondheid en Cultuur te zamen stellen regelen inzake de methoden
      van monsterneming en onderzoek, aan te wenden bij de toepassing van het bij of krachtens dit besluit bepaalde.
    url: https://wetten.overheid.nl/BWBR0003732/1999-11-26#Artikel11
  - number: '12'
    text: |-
      1 De Stichting Centraal Orgaan voor Kwaliteitsaangelegenheden in de Zuivel te Leusden is

      a. belast met het toezicht op de naleving door de bij haar aangeslotenen van de bij of krachtens dit besluit
      gestelde regelen;

      b. belast met de in [artikel 10][ref1] bedoelde keuring van zuigelingenvoeding;

      c. bevoegd tot het uitreiken van de in [artikel 8][ref2] bedoelde tekenen of bewijsstukken. Deze tekenen of
      bewijsstukken worden, voor zover het bereiders van zuigelingenvoeding betreft, uitsluitend uitgereikt aan
      aangeslotenen bij de in de aanhef genoemde controle-instelling.

      2 Het bedrijfsmatig bereiden van zuigelingenvoeding is uitsluitend toegestaan aan aangeslotenen bij de in het
      vorige lid genoemde controle-instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0003732#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003732#Artikel8
    url: https://wetten.overheid.nl/BWBR0003732/1999-11-26#Artikel12
