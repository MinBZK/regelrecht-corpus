    text: |-
      1 Het is verboden zuigelingenvoeding bedrijfsmatig te bereiden, tenzij dit geschiedt:

      a. in overeenstemming met krachtens [artikel 6, eerste lid][ref1], gestelde en op de bereiding betrekking hebbende
      regelen;

      b. in bedrijfsgebouwen welke voldoen aan krachtens [artikel 6, eerste lid, onder ][ref2]., gestelde regelen.

      2 Het is, onverminderd het bepaalde in het derde lid, verboden zuigelingenvoeding bedrijfsmatig te vervoeren in
      vervoermiddelen, welke niet voldoen aan krachtens [artikel 6, eerste lid, onder ][ref3]., gestelde regelen.

      3 Het is verboden zuigelingenvoeding te verhandelen of bedrijfsmatig te ontvangen, tenzij deze

      a. voldoet aan

        - ten eerste: het in de [artikelen 3][ref4], [4][ref5] en [5][ref6] bepaalde;
        - ten tweede: krachtens [artikel 6, eerste lid, onder ][ref7], gestelde regelen, andere dan de in het eerste lid
      onder *a*. bedoelde

      b. is voorzien van een in [artikel 8, eerste lid][ref8], bedoeld teken of bewijsstuk, voor zover het betreft
      zuigelingenvoeding waarop het bepaalde in [artikel 8, tweede lid][ref9], toepassing vindt.

      4 Dit artikel is niet van toepassing op goederen die op regelmatige wijze zijn aangebracht en aangegeven of op
      regelmatige wijze zijn aangebracht onder geleide van een document voor communautair douanevervoer en die nog
      niet zijn vrijgegeven voor een van de douaneregelingen als bedoeld in artikel 4, onderdeel 16, onder a of f, van
      [verordening (EEG) nr. 2913/92](31992R2913) van de Raad van de Europese Gemeenschappen van 12 oktober 1992 tot
      vaststelling van het communautair douanewetboek (PbEG L 302).


