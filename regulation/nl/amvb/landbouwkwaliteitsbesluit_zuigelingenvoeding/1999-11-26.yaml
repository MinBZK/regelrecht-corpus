        artikel: '6'
  - number: '4'
    text: |-
      Zuigelingenvoeding dient verpakt te zijn in een verpakking, die bij gebruik overeenkomstig haar bestemming en
      rekening houdend met de te verwachten bewaaromstandigheden,

      a. geen gevaar oplevert of kan opleveren voor de gezondheid;

      b. de eigenschappen van het verpakte produkt niet in ongunstige zin beïnvloedt of kan beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0003732/1999-11-26#Artikel4
  - number: '5'
    text: |-
      Zuigelingenvoeding mag op, in of bij haar verpakking niet zijn voorzien van aanduidingen of afbeeldingen, welke,
      doordat zij onjuist of onvolledig zijn of een onjuiste indruk wekken, misleidend zijn met betrekking tot aard,
      eigenschappen, samenstelling, oorsprong, herkomst, hoeveelheid, bereidingswijze, houdbaarheid of gebruiksdoel van
      dit produkt.
    url: https://wetten.overheid.nl/BWBR0003732/1999-11-26#Artikel5
  - number: '6'
    text: |-
      1 Onze Minister en Onze Minister van Welzijn, Volksgezondheid en Cultuur te zamen

      a. stellen nadere regelen met betrekking tot de hoedanigheid, de aanduiding en de verpakking van zuigelingenvoeding
      of van bepaalde tot deze categorie behorende produkten;

      b. stellen regelen met betrekking tot de oorsprong, de verzorging, de vorm, de afwerking, de maat of het gewicht
      van zuigelingenvoeding of van bepaalde tot deze categorie behorende produkten;

      c. kunnen met betrekking tot zuigelingenvoeding regelen stellen inzake

        - ten eerste: de inrichting en het gebruik van bedrijfsgebouwen en vervoermiddelen;
        - ten tweede: het gebruik en verbruik van grondstoffen, hulpstoffen en toevoegingen;
        - ten derde: de be- of verwerkingswijze;
        - ten vierde: het gebruik van machines, werktuigen en gereedschappen;
        - ten vijfde: de hoedanigheid en het gebruik van verpakkingsmiddelen.

      2 Bij de in het eerste lid bedoelde regelen kunnen terzake van de bereiding van zuigelingenvoeding regelen worden
      gesteld met betrekking tot het verhandelen van grondstoffen daarvoor.

      3 Bij de in het eerste lid bedoelde regelen kunnen ter zake van de aanduiding van zuigelingenvoeding regelen
      worden gesteld, waarbij het gebruik op, in of bij de verpakking van bepaalde vermeldingen, verband houdende met het
      juiste of meest wenselijk geachte gebruik van dit produkt, verplicht wordt gesteld. Deze regelen kunnen onder meer
      inhouden, dat daarbij nader vastgestelde aanduidingen gebezigd moeten worden waarbij:

        - de voordelen van borstvoeding boven het gebruik van zuigelingenvoeding worden benadrukt;
        - verklaard wordt, dat het produkt slechts op advies van personen, werkzaam in de gezondheidszorg, ware te
      gebruiken;
        - omtrent de juiste dosering en de hygiënische toebereiding van het produkt duidelijke instructies worden gegeven,
      waarbij de noodzaak wordt benadrukt deze nauwkeurig op te volgen.

      4 Bij de in het eerste lid bedoelde regelen kunnen regelen worden gesteld ter zake van de aanduiding van produkten,
      welke in eigenschappen of uiterlijk voorkomen gelijken op zuigelingenvoeding dan wel bestemd of geschikt zijn om
      deze te vervangen dan wel associaties kunnen oproepen aan melkvoeding van zuigelingen tot een jaar.

      5 De in het eerste lid bedoelde regelen kunnen verschillen naar gelang van oorsprong, gebruiksdoel of geografische
      bestemming van de zuigelingenvoeding.
    url: https://wetten.overheid.nl/BWBR0003732/1999-11-26#Artikel6
  - number: '7'
    text: |-
      1 Onze Minister en Onze Minister van Welzijn, Volksgezondheid en Cultuur te zamen kunnen bij de regelen of nadere
      regelen, als bedoeld in [artikel 6][ref1], bepalen dat ter uitvoering daarvan nadere regelen door het bestuur van
      het Produktschap voor Zuivel bij verordening worden vastgesteld.

      2 Indien het eerste lid toepassing vindt, kunnen Onze Minister en Onze Minister van Welzijn, Volksgezondheid
      en Cultuur te zamen daarbij bepalen dat krachtens een verordening, als aldaar bedoeld, genomen besluiten de
      goedkeuring behoeven van een door hen aangewezen autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0003732#Artikel6
    url: https://wetten.overheid.nl/BWBR0003732/1999-11-26#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003732
        artikel: '6'
  - number: '8'
    text: |-
      1 Onze Minister kan tekenen en bewijsstukken, als bedoeld in artikel 7, eerste lid, van de wet, vaststellen.

      2 Onze Minister kan het gebruik van de in het eerste lid bedoelde tekenen of bewijsstukken in door hem te bepalen
      gevallen verplicht stellen.

      3 Onze Minister stelt regelen betreffende het vervaardigen, voorhanden en in voorraad hebben, zomede het afleveren
      of gebruiken van de in het eerste lid bedoelde tekenen of bewijsstukken en van cliché's, stempels en andere
      werktuigen tot het vervaardigen of aanbrengen van die tekenen of bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0003732/1999-11-26#Artikel8
  - number: '9'
    text: |-
      1 Zuigelingenvoeding, waarvoor een teken of bewijsstuk, als bedoeld in [artikel 8][ref1], wordt gebruikt, dient te
      voldoen aan de eisen, geldend voor de zuigelingenvoeding, waarvoor dat teken of bewijsstuk is vastgesteld.

      2 Het is, onverminderd het in [artikel 5][ref2] bepaalde, verboden met betrekking tot zuigelingenvoeding
      aanduidingen of afbeeldingen, handelsmerken daaronder begrepen, te gebruiken, welke een zodanige gelijkenis
      vertonen met de in dit artikel bedoelde tekenen of bewijsstukken, dat daardoor verwarring kan ontstaan.

      3 Het is verboden de in [artikel 8][ref3] bedoelde tekenen of bewijsstukken te gebruiken in strijd met het bij of
      krachtens dit besluit bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0003732#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003732#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0003732#Artikel8
    url: https://wetten.overheid.nl/BWBR0003732/1999-11-26#Artikel9
