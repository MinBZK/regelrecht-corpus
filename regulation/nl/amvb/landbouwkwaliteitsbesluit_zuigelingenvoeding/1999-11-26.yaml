  - number: '16'
    text: |-
      Het Uitvoercontrolebesluit 1957 (Melk en Melkprodukten) (*Stb.* 1957, 63) is buiten werking gesteld voor
      zuigelingenvoeding.
    url: https://wetten.overheid.nl/BWBR0003732/1999-11-26#Artikel16
  - number: '17'
    text: |-
      1 Dit besluit kan worden aangehaald als "Landbouwkwaliteitsbesluit zuigelingenvoeding".

      2 Het treedt in werking op 1 januari 1985.
    url: https://wetten.overheid.nl/BWBR0003732/1999-11-26#Artikel17
