  - number: '23'
    text: |-
      De betrokkene, bedoeld in [de artikelen 19 tot en met 22][ref1], heeft na afloop van de suppletie recht op
      uitkering op grond van het [Werkloosheidsbesluit defensiepersoneel][ref2] indien de duur van de uitkering
      langer is dan die van de suppletie. Voor de vaststelling van de duur en de hoogte van de uitkering is het
      [Werkloosheidsbesluit defensiepersoneel][ref3] van toepassing, met dien verstande dat uitgegaan wordt vanaf het
      tijdstip waarop het ontslag is ingegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008977#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0008113
      [ref3]: https://wetten.overheid.nl/BWBR0008113
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel23
