      het genoten recht op aanvullende uitkering op grond van het Besluit aanvulling arbeidsongeschiktheidsuitkering
      militairen, berekend aan de hand van [artikel 6, derde lid][ref1], met ingang van de dag waarop de
      Suppletieregeling op betrokkene van toepassing wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0008977#Artikel6
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel22
