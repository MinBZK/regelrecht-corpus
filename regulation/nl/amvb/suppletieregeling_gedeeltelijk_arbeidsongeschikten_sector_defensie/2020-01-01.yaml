  - number: '19.4'
    text: |-
      [Artikel 6, eerste lid][ref1], is van toepassing, met dien verstande dat het dagloon, zoals dat op de dag
      voorafgaande aan die waarop de Suppletieregeling op betrokkene van toepassing wordt gold met inachtneming
      van het bepaalde in artikel 17, vijfde lid, van de Suppletieregeling burgerlijke ambtenaren defensie, de
      berekeningsgrondslag is van de suppletie;


      [ref1]: https://wetten.overheid.nl/BWBR0008977#Artikel6
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel19
    references:
      - id: ref1
