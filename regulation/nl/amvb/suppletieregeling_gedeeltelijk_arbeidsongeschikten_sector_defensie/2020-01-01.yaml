        artikel: '6'
        paragraaf: '3'
  - number: '19.5'
    text: Ambtshalve wordt van iedere betrokkene als bedoeld in het eerste lid het recht op suppletie vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel19
  - number: '20.1'
    text: |-
      De betrokkene, bedoeld in [artikel 1, onderdeel ][ref1], heeft recht op suppletie indien:


      [ref1]: https://wetten.overheid.nl/BWBR0008977#Artikel1
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0008977
        artikel: '1'
        paragraaf: '1'
  - number: 20.1.a
    text: |-
      het ontslag ter zake waarvan hem een recht op suppletie op grond van de Suppletieregeling burgerlijke ambtenaren
      defensie is toegekend, nà 31 december 1995 is verleend, en
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel20
  - number: 20.1.b
    text: |-
      hij op de dag voorafgaande aan die waarop de Suppletieregeling op hem van toepassing wordt nog recht heeft op
      suppletie op grond van artikel 2 van de Suppletieregeling burgerlijke ambtenaren defensie, zoals die regeling
      luidde op de dag voorafgaande aan die waarop de Suppletieregeling op hem van toepassing wordt, en waarvan de duur
      op de invoeringsdatum van de Suppletieregeling nog niet is verstreken.
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel20
  - number: '20.2'
    text: |-
      Het in het eerste lid bedoelde recht op suppletie geldt voor een periode die gelijk is aan de resterende duur
      van het genoten recht op suppletie op grond van de Suppletieregeling burgerlijke ambtenaren defensie, berekend
      aan de hand van [artikel 6, derde lid][ref1], met ingang van de dag waarop de Suppletieregeling op betrokkene van
      toepassing wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0008977#Artikel6
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0008977
        artikel: '6'
        paragraaf: '3'
  - number: '20.3'
    text: |-
      [De artikelen 3 tot en met 5][ref1], [6, eerste en tweede lid][ref2], [7 tot en met 11][ref3], alsmede
      [de artikelen 12, derde lid, tot en met 16][ref4] zijn van toepassing.


