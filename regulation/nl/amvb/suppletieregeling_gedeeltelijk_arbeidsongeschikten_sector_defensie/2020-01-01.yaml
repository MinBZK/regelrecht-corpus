valid_from: '2020-01-01'
bwb_id: BWBR0008977
url: https://wetten.overheid.nl/BWBR0008977/2020-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Defensie van 24 juli 1997, nr. P/97004787;

    Gelet op de artikelen 125, eerste lid, van de Ambtenarenwet en 12 van de Militaire Ambtenarenwet 1931;

    De Raad van State gehoord (advies van 27 augustus 1997, nr. WO7.97.0496);

    Gezien het nader rapport van de Staatssecretaris van Defensie van 20 oktober 1997, nr. P97006643 ;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel1
  - number: 1.a
    text: '*Onze Minister:*Onze Minister van Defensie;'
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel1
  - number: 1.b
    text: '*betrokkene:*'
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel1
  - number: 1.b.1°
    text: |-
      de ambtenaar die op basis van het [Burgerlijke ambtenarenreglement defensie][ref1] werkzaam is geweest, en aan wie
      ontslag is verleend op grond van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte als bedoeld in
      [artikel 121, eerste lid, onderdeel f, van het Burgerlijk ambtenarenreglement defensie][ref2], en die ten tijde van
      dat ontslag minder dan 80% arbeidsongeschikt is,


      [ref1]: https://wetten.overheid.nl/BWBR0006040
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel121
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006040
      - id: ref2
        bwb_id: BWBR0006040
        artikel: '121'
  - number: 1.b.2°
    text: |-
      de beroepsmilitair, die ter zake van ziekten of gebreken is ontslagen, ten tijde van het ontslag minder dan
      80% arbeidsongeschikt is, en uit dien hoofde aanspraak heeft op een pensioen ingevolge de bij of krachtens de
      [Kaderwet militaire pensioenen][ref1] vastgestelde bepalingen;


      [ref1]: https://wetten.overheid.nl/BWBR0011955
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011955
  - number: 1.b.3°
    text: |-
      de zonder aanspraak op een uitkering krachtens de [Uitkeringswet gewezen militairen][ref1] ontslagen
      beroepsmilitair, die binnen een maand na zijn ontslag of indien dat ontslag is gevolgd door een pensioengevende
      ontslaguitkering, binnen een maand volgend op die ontslaguitkering, recht heeft op een pensioen ingevolge de bij of
      krachtens de [Kaderwet militaire pensioenen][ref2] vastgestelde bepalingen, en met ingang van het tijdstip waarop
      hij uit hoofde van ziekten of gebreken blijvend ongeschikt is geworden voor het vervullen van de militaire dienst
      minder dan 80% arbeidsongeschikt is;


      [ref1]: https://wetten.overheid.nl/BWBR0002540
      [ref2]: https://wetten.overheid.nl/BWBR0011955
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002540
      - id: ref2
        bwb_id: BWBR0011955
  - number: 1.b.4°
    text: 'de beroepsmilitair:'
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel1
  - number: 1.b.4°.a
    text: die anders dan ter zake van ziekten of gebreken is ontslagen;
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel1
  - number: 1.b.4°.b
    text: |-
      voor wie ten tijde van dat ontslag en niet reeds ten tijde van een eerder ontslag sprake was van invaliditeit met
      dienstverband;
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel1
  - number: 1.b.4°.c
    text: |-
      die recht heeft op pensioen ter zake van ziekten of gebreken ingevolge de bij of krachtens de
      [Kaderwet militaire pensioenen][ref1] vastgestelde bepalingen;


      [ref1]: https://wetten.overheid.nl/BWBR0011955
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011955
  - number: 1.b.4°.d
    text: ten tijde van dat ontslag minder dan 80% arbeidsongeschikt is en;
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel1
  - number: 1.b.4°.e
    text: het resterende verdienvermogen in een of meer aangehouden dienstbetrekkingen niet volledig benut.
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel1
  - number: 1.c
    text: |-
      *arbeidsongeschiktheid:*arbeidsongeschiktheid als bedoeld in [artikel 18, eerste lid, van de WAO][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel18
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '18'
  - number: 1.d
    text: |-
      *uitkering ter zake van arbeidsongeschiktheid:*een periodieke uitkering ter zake van arbeidsongeschiktheid, die
      voortvloeit uit enige dienstbetrekking van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel1
  - number: 1.e
    text: |-
      *berekeningsgrondslag van de suppletie:*het dagloon van de betrokkene op de dag voorafgaande aan het ontslag
      ter zake waarvan hem recht op suppletie wordt toegekend, voor zover dat betrekking heeft op het inkomen uit het
      dienstverband waaraan het recht op suppletie wordt ontleend;
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel1
  - number: 1.f
    text: |-
      *dagloon:* het dagloon in de zin van [artikel 14 van de Wet op de arbeidsongeschiktheidsverzekering][ref1] en
      [artikel 13 van de Wet werk en inkomen naar arbeidsvermogen][ref2] zonder toepassing van het bedrag, bedoeld in
      [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref3] met betrekking tot een loontijdvak
      van een dag, vermeerderd met het bedrag aan pensioenbijdrageverhaal op grond van de overeenkomst naar burgerlijk
      recht, bedoeld in [artikel 4 van de Wet privatisering ABP][ref4], waarin de aanspraken van overheidswerknemers in
      de zin van die wet, gewezen overheidswerknemers en hun nagelaten betrekkingen ter zake van pensioenen, alsmede hun
      daarmee samenhangende verplichtingen, zijn neergelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0007791#Artikel4
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '13'
      - id: ref3
        bwb_id: BWBR0017745
        artikel: '17'
      - id: ref4
        bwb_id: BWBR0007791
        artikel: '4'
  - number: 1.g
    text: |-
      *suppletie:* de suppletie, bedoeld in [artikel 6][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008977#Artikel6
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008977
        artikel: '6'
        paragraaf: '3'
  - number: 1.h
    text: '*Suppletieregeling:*Suppletieregeling gedeeltelijk arbeidsongeschikten sector Defensie;'
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel1
  - number: 1.i
    text: |-
      *werkloosheidsuitkering:*een periodieke uitkering ter zake van ontslag of werkloosheid, die voortvloeit uit enige
      dienstbetrekking van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel1
  - number: 1.j
    text: |-
      *WAO:*de [Wet op de arbeidsongeschiktheidsverzekering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 1.k
    text: |-
      *gangbare arbeid:* alle algemeen geaccepteerde arbeid waartoe de betrokkene met zijn krachten en bekwaamheden in
      staat is;
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel1
  - number: 1.l
    text: |-
      ZW-uitkering: ziekengeld als bedoeld in [artikel 19 van de Ziektewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel19
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '19'
  - number: 1.m
    text: |-
      *pensioengerechtigde leeftijd:* de pensioengerechtigde leeftijd die voor de betrokkene geldt op grond van
      [artikel 7a van de Algemene Ouderdomswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: '2.1'
    text: De betrokkene heeft recht op suppletie met ingang van het tijdstip waarop aan hem ontslag is verleend.
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel2
  - number: '2.2'
    text: |-
      Het eerste lid is niet van toepassing indien het in dat lid bedoelde ontslag wordt verleend nadat de
      arbeidsongeschiktheid 90 maanden onafgebroken heeft geduurd. Voor het bepalen van genoemde periode van 90 maanden
      worden perioden van arbeidsongeschiktheid samengeteld indien die elkaar met een onderbreking van minder dan vier
      weken opvolgen.
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel2
  - number: '2.3'
    text: |-
      In afwijking van het eerste lid heeft de betrokkene, bedoeld in [artikel 1, onderdeel ][ref1], recht op suppletie
      met ingang van het tijdstip waarop hij uit hoofde van ziekten of gebreken blijvend ongeschikt is geworden voor het
      vervullen van de militaire dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0008977#Artikel1
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008977
        artikel: '1'
        paragraaf: '1'
  - number: '3.1'
    text: |-
      Het verplichtingen- en sanctieregime van de [Werkloosheidswet][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '3.2'
    text: |-
      Onverminderd het eerste lid omvat passende arbeid in de zin van de [Werkloosheidswet][ref1] voor de toepassing van
      de Suppletieregeling mede gangbare arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '4'
    text: 'Het recht op suppletie komt niet tot uitbetaling zolang:'
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel4
  - number: 4.a
    text: |-
      de betrokkene een uitkering op grond van de [WAO][ref1] ontvangt, berekend naar een mate van arbeidsongeschiktheid
      van 80% of meer;


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 4.b
    text: |-
      de betrokkene is herplaatst in een functie waaraan hij recht kan ontlenen op herplaatsingstoelage als
      bedoeld in paragraaf 9 van het pensioenreglement Stichting Pensioenfonds ABP of de bij of krachtens de
      [Kaderwet militaire pensioenen][ref1] vastgestelde bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011955
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011955
  - number: '5.1'
    text: 'Het recht op suppletie eindigt:'
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel5
  - number: 5.1.a
    text: na ommekomst van de duur van de suppletie;
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel5
  - number: 5.1.b
    text: met ingang van de dag volgende op die waarop de betrokkene is overleden;
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel5
  - number: 5.1.c
    text: met ingang van de dag waarop de betrokkene de pensioengerechtigde leeftijd bereikt.
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel5
  - number: '5.2'
    text: |-
      In afwijking van [artikel 5, onder c][ref1], eindigt het recht op suppletie met ingang
      van de dag waarop de leeftijd van 65 jaar wordt bereikt voor de militair aan wie voor
      1 januari 2017 ontslag is verleend of die een aanvraag heeft ingediend als bedoeld in
      [artikel 39a, eerste tot en met vierde lid, van het Algemeen militair ambtenarenreglement][ref2], alsmede voor de
      ambtenaar aan wie voor 1 januari 2018 ontslag is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0008977#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel39a
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008977
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: 39a
  - number: '6.1'
    text: De suppletie bedraagt een percentage van de berekeningsgrondslag van de suppletie.
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel6
  - number: '6.2'
    text: |-
      De berekeningsgrondslag van de suppletie wordt in voorkomende gevallen gewijzigd overeenkomstig een algemene
      salariswijziging.
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel6
  - number: '6.3'
    text: 'Het in het eerste lid bedoelde percentage bedraagt:'
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel6
  - number: 6.3.a
    text: gedurende de eerste 33 maanden 80%; en
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel6
  - number: 6.3.b
    text: gedurende de daaropvolgende 33 maanden 70%.
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel6
  - number: '7.1'
    text: |-
      In afwijking van [artikel 6, derde lid][ref1], wordt, indien het in [artikel 2, eerste en tweede lid][ref2],
      bedoelde ontslag is verleend op een latere datum dan het moment waarop de arbeidsongeschiktheid 24 maanden
      onafgebroken heeft geduurd, de in [artikel 6, derde lid][ref3], genoemde periode verminderd met de periode die
      gelegen is tussen het moment waarop de arbeidsongeschiktheid 24 maanden onafgebroken heeft geduurd en het ontslag.
      Deze vermindering wordt ten eerste toegepast op de in [onderdeel a van het derde lid van artikel 6][ref4] genoemde
      periode gedurende welke de betrokkene recht heeft op 80% van de berekeningsgrondslag van de suppletie.


      [ref1]: https://wetten.overheid.nl/BWBR0008977#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008977#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0008977#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0008977#Artikel6
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008977
        artikel: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0008977
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0008977
        artikel: '6'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0008977
        artikel: '6'
        paragraaf: '3'
  - number: '7.2'
    text: |-
      Voor het bepalen van de in het eerste lid bedoelde periode van 24 maanden worden perioden van arbeidsongeschiktheid
      samengeteld indien die elkaar met een onderbreking van minder dan vier weken opvolgen.
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel7
  - number: '7.3'
    text: |-
      In afwijking van [artikel 6, derde lid][ref1], wordt de in onderdeel a en b van dat lid genoemde periode
      verminderd met de periode die gelegen is tussen de ontslagdatum en het moment waarop het recht op suppletie
      op grond van [artikel 2, derde lid][ref2], is toegekend. Deze vermindering wordt ten eerste toegepast op de in
      [onderdeel a van het derde lid van artikel 6][ref3] genoemde periode gedurende welke de betrokkene recht heeft op
      80% van de berekeningsgrondslag van de suppletie.


      [ref1]: https://wetten.overheid.nl/BWBR0008977#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008977#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0008977#Artikel6
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008977
        artikel: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0008977
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0008977
        artikel: '6'
        paragraaf: '3'
  - number: '7.4'
    text: |-
      In afwijking van [artikel 6, derde lid][ref1], worden de in dat lid genoemde percentages
      verhoogd tot 90,02% ingeval van toekenning van suppletie aan een betrokkene als bedoeld in
      [artikel 1, onderdeel b, onder 2° , 3° en 4°][ref2], bij arbeidsongeschiktheid met dienstverband als bedoeld in
      de bij of krachtens de [Kaderwet militaire pensioenen][ref3] vastgestelde bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0008977#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008977#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0011955
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008977
        artikel: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0008977
        artikel: '1'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0011955
  - number: '8.1'
    text: |-
      Indien de betrokkene gedurende de periode dat recht bestaat op suppletie, ter zake van het dienstverband
      waaruit hij is ontslagen, een werkloosheidsuitkering, een ZW-uitkering, dan wel een uitkering ter zake van
      arbeidsongeschiktheid ontvangt, wordt het bedrag van genoemde uitkering of uitkeringen in mindering gebracht op het
      bedrag van de suppletie. Indien de bedoelde betrokkene uit hoofde van twee of meer dienstbetrekkingen recht heeft
      op uitkering op grond van de WAO wordt die uitkering voor de toepassing van de eerste volzin, toegerekend aan het
      dienstverband ter zake waarvan hem recht op suppletie is toegekend, naar rato van het feitelijk genoten inkomen uit
      hoofde van de desbetreffende dienstbetrekkingen.
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel8
  - number: '8.2'
    text: |-
      Indien de betrokkene recht heeft op uitkering op grond van de WAO die kan worden toegerekend aan een
      dienstbetrekking, waaruit hij is ontslagen op een datum, gelegen vóór de datum van ontslag uit het dienstverband
      ter zake waarvan hem recht op suppletie is toegekend, welk recht voortduurt na laatstgenoemde datum, wordt, ingeval
      van een verhoging van de mate van de arbeidsongeschiktheid waardoor het bedrag van die uitkering verhoogd wordt,
      uitsluitend het bedrag van die verhoging in mindering gebracht op het bedrag van de suppletie.
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel8
  - number: '8.3'
    text: |-
      Onze Minister kan ten gunste van de betrokkene afwijken van de toerekeningswijze, bedoeld in het tweede lid, voor
      zover toepassing daarvan gelet op het belang dat dit artikel beoogt te beschermen zal leiden tot een onbillijkheid
      van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel8
  - number: '9.1'
    text: |-
      Indien de betrokkene gedurende de periode dat recht bestaat op suppletie inkomen verwerft uit of in verband
      met arbeid of bedrijf, anders dan bedoeld in [artikel 8][ref1], wordt de berekeningsgrondslag van de suppletie
      verminderd met dat inkomen uit of in verband met arbeid of bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0008977#Artikel8
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008977
        artikel: '8'
        paragraaf: '3'
  - number: '9.2'
    text: |-
      Onder inkomen uit of in verband met arbeid of bedrijf als bedoeld in het eerste lid, wordt begrepen inkomen dat de
      betrokkene verwerft
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel9
  - number: 9.2.a
    text: met ingang van of na de dag waarop het ontslag, ter zake waarvan de betrokkene suppletie is toegekend, is verleend;
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel9
  - number: 9.2.b
    text: |-
      gedurende buitengewoon verlof, vakantieverlof of verlof onmiddellijk voorafgaande aan het ontslag ter zake waarvan
      de betrokkene suppletie is toegekend;
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel9
  - number: 9.2.c
    text: |-
      vóór de dag van het ontslag ter zake waarvan de betrokkene suppletie is toegekend, anders dan bedoeld in onderdeel
      *a* en *b*, en [artikel 8, tweede lid][ref1], voor zover uit deze arbeid of dit bedrijf na die dag inkomen of meer
      inkomen wordt genoten door de betrokkene, terwijl dat inkomen of dat meerdere inkomen of een gedeelte daarvan, het
      gevolg is van een verhoogde werkzaamheid dan wel verband houdt met het ontslag.


      [ref1]: https://wetten.overheid.nl/BWBR0008977#Artikel8
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008977
        artikel: '8'
        paragraaf: '3'
  - number: '9.3'
    text: |-
      In bijzondere gevallen kan Onze Minister ten gunste van de betrokkene afwijken van het tweede lid, voor zover
      toepassing daarvan gelet op het belang dat dit artikel beoogt te beschermen zal leiden tot een onbillijkheid van
      overwegende aard.
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel9
  - number: '10'
    text: |-
      Voor de toepassing van [de artikelen 8][ref1] en [9][ref2] worden uitkeringen steeds geacht onverminderd door
      de betrokkene te zijn genoten indien, als gevolg van handelingen van of het nalaten van handelingen door de
      betrokkene, één of meer werkloosheidsuitkeringen, uitkeringen ter zake van arbeidsongeschiktheid, uitkeringen
      op grond van de [Ziektewet][ref3] dan wel uitkeringen die naar aard en strekking overeenkomen met laatstgenoemde
      uitkeringen, waarop de betrokkene recht heeft,


      [ref1]: https://wetten.overheid.nl/BWBR0008977#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0008977#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008977
        artikel: '8'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0008977
        artikel: '9'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0001888
  - number: 10.a
    text: vermindering ondergaan;
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel10
  - number: 10.b
    text: blijvend geheel geweigerd worden;
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel10
  - number: 10.c
    text: tijdelijk of blijvend gedeeltelijk geweigerd worden; dan wel
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel10
  - number: 10.d
    text: in uitkeringsduur beperkt worden.
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel10
  - number: '11.1'
    text: |-
      Zo spoedig mogelijk na het overlijden van de betrokkene, aan wie een suppletie is toegekend, wordt een bedrag
      uitgekeerd, gelijk aan de berekeningsgrondslag van de suppletie van de betrokkene over een tijdvak van drie
      maanden.
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel11
  - number: '11.2'
    text: 'Het in het eerste lid bedoelde bedrag wordt uitgekeerd:'
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel11
  - number: 11.2.a
    text: |-
      aan de langstlevende der echtgenoten indien de overleden betrokkene niet duurzaam van de andere echtgenoot
      gescheiden leefde;
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel11
  - number: 11.2.b
    text: |-
      bij ontstentenis van de onder *a* bedoelde persoon aan de minderjarige wettige of natuurlijke kinderen van de
      overleden betrokkene;
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel11
  - number: 11.2.c
    text: |-
      bij ontstentenis van de onder *a* en *b* bedoelde personen aan degenen ten aanzien van wie de overleden betrokkene
      grotendeels in de kosten van het bestaan voorzag en met wie hij in gezinsverband leefde.
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel11
  - number: '11.3'
    text: |-
      Voor de toepassing van het tweede lid wordt onder echtgenoot mede verstaan de geregistreerde partner dan wel
      de partner die is aangemeld bij de Stichting Pensioenfonds ABP en door het bestuur van dat fonds als zodanig is
      aangemerkt.
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel11
  - number: '11.4'
    text: |-
      Op het uit te keren bedrag, bedoeld in het eerste lid, wordt in mindering gebracht het bedrag van de uitkering
      waarop de nagelaten betrekkingen van de betrokkene ter zake van diens overlijden aanspraak kunnen maken uit hoofde
      van een of meer werkloosheidsuitkeringen, uitkeringen ter zake van arbeidsongeschiktheid, uitkeringen op grond van
      de [Ziektewet][ref1] dan wel uitkeringen die naar aard en strekking overeenkomen met laatstgenoemde uitkeringen,
      waarop de betrokkene recht had.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '12.1'
    text: Op aanvraag stelt Onze Minister het recht op suppletie vast.
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel12
  - number: '12.2'
    text: Een aanvraag wordt ingediend door middel van een daartoe beschikbaar gesteld aanvraagformulier.
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel12
  - number: '12.3'
    text: |-
      De suppletie wordt zo spoedig mogelijk uitbetaald, doch uiterlijk binnen een maand nadat het recht op die suppletie
      is vastgesteld. Onze Minister betaalt achteraf per maand de suppletie.
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel12
  - number: '12.4'
    text: |-
      De suppletie die niet in ontvangst is genomen of is ingevorderd binnen drie maanden na de dag van
      betaalbaarstelling, wordt niet meer betaald.
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel12
  - number: '12.5'
    text: |-
      In bijzondere gevallen kan Onze Minister ten gunste van de betrokkene afwijken van de eerste volzin, voor zover
      toepassing daarvan gelet op het belang dat dit artikel beoogt te beschermen zal leiden tot een onbillijkheid van
      overwegende aard.
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel12
  - number: '13.1'
    text: |-
      Ambtshalve kan een naar redelijkheid vast te stellen voorschot op een suppletie worden betaald indien uitsluitend
      onzekerheid bestaat omtrent de hoogte van de suppletie, omtrent het van de suppletie aan de betrokkene te betalen
      bedrag of omtrent het nakomen van een verplichting als bedoeld in [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008977#Artikel3
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008977
        artikel: '3'
        paragraaf: '2'
  - number: '13.2'
    text: Op aanvraag van de betrokkene kan een naar redelijkheid vast te stellen voorschot op een suppletie worden betaald.
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel13
  - number: '13.3'
    text: Het voorschot, bedoeld in het eerste en tweede lid, wordt beschouwd als een suppletie.
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel13
  - number: '14.1'
    text: |-
      Onze Minister kan regels stellen op grond waarvan in bij die regels aan te geven gevallen en met inachtneming
      van bij die regels te stellen beperkingen de betrokkene bevoegd is deel te nemen aan een opleiding of scholing
      in dagonderwijs.
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel14
  - number: '14.2'
    text: |-
      Indien de betrokkene die recht heeft op suppletie gaat deelnemen aan een voor hem noodzakelijke opleiding of
      scholing, blijft volgens door Onze Minister te stellen regels het recht op suppletie bestaan totdat die opleiding
      of scholing is geëindigd.
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel14
  - number: '14.3'
    text: |-
      In de regels, bedoeld in het tweede lid, worden in ieder geval voorschriften en beperkingen gegeven met betrekking
      tot de aard, de omvang en de duur van de in het tweede lid bedoelde opleiding of scholing.
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel14
  - number: '15.1'
    text: De betrokkene die onbeloonde activiteiten verricht is verplicht daarvan mededeling te doen.
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel15
  - number: '15.2'
    text: |-
      De betrokkene heeft voor het verrichten van bijzondere vormen van onbeloonde activiteiten voorafgaande toestemming
      nodig.
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel15
  - number: '15.3'
    text: Onze Minister kan nadere regels stellen ten aanzien van het in het tweede lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel15
  - number: '16'
    text: 'Bij ministeriële regeling worden nadere regels vastgesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel16
  - number: 16.a
    text: een doelmatige controle op het naleven door de betrokkene van de op hem rustende verplichtingen;
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel16
  - number: 16.b
    text: het genieten van vakantieverlof tijdens de duur van de suppletie.
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel16
  - number: '17'
    text: |-
      Indien het niveau van de uitkering op grond van de WAO een algemene neerwaartse wijziging ondergaat, wordt deze
      neerwaartse wijziging, tenzij door sociale partners in het sectoroverleg Defensie anders overeengekomen binnen zes
      maanden na de datum van het *Staatsblad* waarin de maatregel tot wijziging van de uitkering op grond van de WAO is
      gepubliceerd, op overeenkomstige wijze ten aanzien van de suppletie doorgevoerd. Dat geschiedt niet eerder dan zes
      maanden na de datum van het *Staatsblad*, waarin de betreffende wijzigingsmaatregel wordt gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel17
  - number: '18'
    text: |-
      De in [artikel 6, derde lid][ref1], genoemde periode wordt voor de toepassing van de bij of krachtens de
      [Kaderwet militaire pensioenen][ref2] vastgestelde bepalingen inzake voor pensioen geldige tijd, die is
      doorgebracht als beroepsmilitair, reservist of dienstplichtige, gelijk gesteld met diensttijd die in werkelijke
      dienst is doorgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0008977#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011955
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008977
        artikel: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0011955
  - number: '19.1'
    text: |-
      De betrokkene, bedoeld in [artikel 1, onderdeel ][ref1], die op 31 december 1995 recht had op
      herplaatsingswachtgeld als bedoeld in [artikel K 4, tweede lid](onbekend), juncto [artikel K6 van de Algemene
      burgerlijke pensioenwet](onbekend) , en die op de dag voorafgaande aan die waarop de Suppletieregeling op hem
      van toepassing wordt nog recht heeft op suppletie op grond van artikel 17 van de Suppletieregeling burgerlijke
      ambtenaren defensie, zoals die regeling luidde op de dag voorafgaande aan die waarop de Suppletieregeling op hem
      van toepassing wordt, en waarvan de duur op de invoeringsdatum van de Suppletieregeling nog niet is verstreken,
      heeft recht op suppletie.


      [ref1]: https://wetten.overheid.nl/BWBR0008977#Artikel1
    url: https://wetten.overheid.nl/BWBR0008977/2020-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0008977
        artikel: '1'
        paragraaf: '1'
