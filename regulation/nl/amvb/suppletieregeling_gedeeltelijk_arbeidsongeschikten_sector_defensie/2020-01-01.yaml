  - number: '21.1'
    text: |-
      De betrokkene, bedoeld in [artikel 1, onderdeel ][ref1], op wie artikel III van het Besluit van de Staatssecretaris
      van Defensie van 30 januari 1996 (*Stb.*1996, 87) van toepassing was, en die op de dag voorafgaande aan die waarop
      de Suppletieregeling op hem van toepassing wordt nog recht heeft op aanvullende uitkering op grond van artikel 2,
      tweede lid, onderdeel *a* en *b*, van het Besluit aanvulling arbeidsongeschiktheidsuitkering militairen, zoals dat
      besluit luidde op de dag voorafgaande aan die waarop de Suppletieregeling op hem van toepassing wordt, en waarvan
      de duur op de invoeringsdatum van de Suppletieregeling nog niet is verstreken, heeft recht op suppletie.


      [ref1]: https://wetten.overheid.nl/BWBR0008977#Artikel1
