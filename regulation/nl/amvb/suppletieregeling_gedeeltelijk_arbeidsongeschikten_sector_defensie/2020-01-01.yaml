  - number: '19.3'
    text: |-
      [De artikelen 3 tot en met 5][ref1], [6, tweede lid][ref2], [7 tot en met 11][ref3], alsmede
      [de artikelen 12, derde lid][ref4], tot en met [16][ref5] zijn van toepassing.


