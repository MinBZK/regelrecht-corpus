  - number: '22.1'
    text: |-
      De betrokkene, bedoeld in [artikel 1, onderdeel ][ref1], die op de dag voorafgaande aan die waarop de
      Suppletieregeling op hem van toepassing wordt nog recht heeft op aanvullende uitkering op grond van artikel 2,
      tweede lid, onderdeel *a* en *b*, van het Besluit aanvulling arbeidsongeschiktheidsuitkering militairen, zoals dat
      besluit luidde op die dag voorafgaande aan die waarop de Suppletieregeling op betrokkene van toepassing wordt, en
      waarvan de duur op de invoeringsdatum van de Suppletieregeling nog niet is verstreken, heeft recht op suppletie.


