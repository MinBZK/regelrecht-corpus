  - number: '5'
    text: |-
      1 Aangeduid moet worden met een der benamingen: *witte kandij* of *blanke kandij*: kandij, waarvan het
      saccharosegehalte ten minste 99% en het asgehalte ten hoogste 0,05% bedragen.

      2 In de in het eerste lid bedoelde waar mogen geen andere bestanddelen aanwezig zijn dan die welke verkregen zijn
      van de plant waaruit de waar is bereid, en zwaveldioxide onder de voorwaarden die ter zake gesteld zijn krachtens
      het [Warenwetbesluit Levensmiddelenadditieven][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005456
    url: https://wetten.overheid.nl/BWBR0003089/1998-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005456
  - number: '6'
    text: |-
      1 Aangeduid moet worden met een der benamingen: *gele kandij, bruine kandij* of *Boerhaavese kandij*, naar gelang
      de gele, bruine of donkerbruine kleur van de kandij: kandij, waarvan het saccharosegehalte ten minste 96%, en het
      asgehalte ten hoogste 0,3% bedragen.

      2 In de in het eerste lid bedoelde waar mogen geen andere bestanddelen aanwezig zijn dan die welke verkregen
      zijn van de plant waaruit de waar is bereid, alsmede een geringe hoeveelheid katoenvezel, de natuurlijke
      kleurstof van gebrande suiker, en zwaveldioxide onder de voorwaarden die ter zake gesteld zijn krachtens het
      [Warenwetbesluit Levensmiddelenadditieven][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005456
    url: https://wetten.overheid.nl/BWBR0003089/1998-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005456
  - number: '7'
    text: |-
      1 Aangeduid moet worden met een der benamingen *witte basterdsuiker* of *blanke basterdsuiker*, dan wel *lichte
      basterdsuiker* of *gele basterdsuiker*, onderscheidenlijk *bruine basterdsuiker* of *donkere basterdsuiker*,
      al naar gelang de witte, lichtgele, onderscheidenlijk lichtbruine of donkerbruine kleur van de basterdsuiker:
      basterdsuiker, waarvan het suikergehalte, ten minste 90% van de droge stof, het gehalte aan invertsuiker ten minste
      0,5% en het asgehalte ten hoogste 2,5% van de droge stof bedragen.

      2 In de in het eerste lid bedoelde waar mogen geen andere bestanddelen aanwezig zijn dan die welke in kooksels
      van planten, waaruit de waar is bereid, plegen voor te komen, en zwaveldioxide onder de voorwaarden die ter zake
      gesteld zijn krachtens het [Warenwetbesluit Levensmiddelenadditieven][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005456
    url: https://wetten.overheid.nl/BWBR0003089/1998-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005456
  - number: '8'
    text: |-
      1 Aangeduid moet worden met de naam *melksuiker*: het vaste koolhydraat, verkregen uit zoete wei, van welke waar
      het lactosegehalte ten minste 99% en het asgehalte ten hoogste 0,1% bedragen.

      2 In de in het eerste lid bedoelde waar moeten andere dan uit zoete wei afkomstige bestanddelen afwezig zijn.
    url: https://wetten.overheid.nl/BWBR0003089/1998-04-01#Artikel8
  - number: '9'
    text: |-
      1 Aangeduid moet worden met een der benamingen *massé* of *zetmeelsuiker*: het mengsel van vaste koolhydraten, welk
      mengsel wordt verkregen door hydrolisering van zetmeel en van welk mengsel het extractgehalte ten ten minste 80%,
      het gehalte aan dextrine ten hoogste 15% van de droge stof, het reducerend vermogen vóór inversie, uitgedrukt als
      dextrose, ten minste 81% van de droge stof en het asgehalte ten hoogste 1,5% van de droge stof bedragen.

      2 De in het eerste lid bedoelde waar moet voldoen aan de volgende eisen:

      a. andere stoffen dan afkomstig uit en gevormd bij hydrolysering van zetmeel mogen niet aanwezig zijn, met
      inachtneming van het bepaalde onder *b* en *c*;

      b. in 0,5 g van de waar mag arsenicum niet aantoonbaar zijn.

      c. zwaveldioxide mag aanwezig zijn onder de voorwaarden die ter zake zijn gesteld krachtens het
      [Warenwetbesluit Levensmiddelenadditieven][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005456
    url: https://wetten.overheid.nl/BWBR0003089/1998-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005456
  - number: '10'
    text: |-
      1 Aangeduid mag uitsluitend en moet worden met een der benamingen *vanillesuiker* of *vanilliensuiker*: het mengsel
      van suiker of van geraffineerde suiker of van beide, als bedoeld in [artikel 2 , onder ][ref1] respectievelijk
      *c*, met vanilline (3 methoxy-4 hydroxy-benzaldehyd) of met aethylvanilline (3 ethoxy-4 hydroxy-benzaldehyd) en
      eventueel enig zetmeel, van welk mengsel het gehalte aan suiker ten minste 97% en het gehalte aan vanilline (3
      methoxy-4 hydroxy-benzaldehyd) ten minste 1% dan wel aan aethyl vanilline (3 ethoxy-4 hydroxy-benzaldehyd) ten
      minste 0,25% bedragen.

      2 In de in het eerste lid bedoelde waar moeten andere stoffen dan de daar genoemde afwezig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003089#Artikel2
    url: https://wetten.overheid.nl/BWBR0003089/1998-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003089
        artikel: '2'
  - number: '11'
    text: |-
      1 Aangeduid mag uitsluitend en moet worden met de naam *kandijstroop*: de stroperige vloeistof, verkregen als
      naprodukt bij de bereiding van kandij, van welke vloeistof het extractgehalte ten minste 80%, het asgehalte ten
      hoogste 1,5% en de schijnbare zuiverheidsfactor ten minste 80% bedragen.

      2 In de in het eerste lid bedoelde waar mogen geen andere bestanddelen aanwezig zijn dan die welke verkregen zijn
      van de plant waaruit de waar is bereid, en zwaveldioxide onder de voorwaarden die ter zake gesteld zijn krachtens
      het [Warenwetbesluit Levensmiddelenadditieven][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005456
    url: https://wetten.overheid.nl/BWBR0003089/1998-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005456
  - number: '12'
    text: |-
      1 Aangeduid moet en mag uitsluitend worden met de naam *suikerstroop*, al dan niet voorafgegaan door de naam van
      de plant waaruit de waar is bereid: de stroperige vloeistof, verkregen uit de kooksels van de plant waaruit de waar
      is bereid, nadat daaruit suiker in kristallen is verwijderd, van welke vloeistof het extractgehalte ten minste 80%,
      het asgehalte ten hoogste 4,0% en de schijnbare zuiverheidsfactor ten minste 73% bedragen.

      2 In de in het eerste lid bedoelde waar mogen geen andere bestanddelen aanwezig zijn dan die welke in kooksels
      van de plant, waaruit de waar is bereid, plegen voor te komen, en zwaveldioxide onder de voorwaarden die ter zake
      gesteld zijn krachtens het [Warenwetbesluit Levensmiddelenadditieven][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005456
    url: https://wetten.overheid.nl/BWBR0003089/1998-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005456
  - number: '13'
    text: |-
      1 Aangeduid mag uitsluitend en moet worden met de naam *huishoudstroop*: het mengsel van kandijstroop, suikerstroop
      of melasse en glucosestroop, als bedoeld in [artikel 2, onder ][ref1], van welk mengsel het suikergehalte ten
      minste 30%, het extractgehalte ten minste 80% en het asgehalte ten hoogste 5% bedragen.

      2 In de in het eerste lid bedoelde waar mogen geen andere bestanddelen aanwezig zijn dan glucosestroop en
      bestanddelen welke in kooksels van de plant, waaruit de waar is bereid, plegen voor te komen, en zwaveldioxide
      onder de voorwaarden die ter zake gesteld zijn krachtens het [Warenwetbesluit Levensmiddelenadditieven][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003089#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005456
