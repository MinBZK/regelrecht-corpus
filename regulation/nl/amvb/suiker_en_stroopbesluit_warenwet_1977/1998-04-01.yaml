  - number: '18'
    text: |-
      In een winkel, op een markt of op enige andere voor het publiek toegankelijke verkoopplaats moeten, indien het
      betreft onverpakte waar, de voor die waar van toepassing zijnde aanduidingen zijn aangebracht op het voorwerp,
      waarin of waarop die waar zich bevindt, of op een onmiddellijk boven genoemd voorwerp geplaatst bord. De
      aanduidingen moeten voor het publiek duidelijk zichtbaar zijn. Zijn beide kanten van het bord voor het publiek
      zichtbaar, dan moeten de aanduidingen aan weerszijden zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0003089/1998-04-01#Artikel18
  - number: '19'
    text: |-
      1 De aanduiding van de hoeveelheid als bedoeld in het tweede lid van [artikel 20][ref1], juncto
      [artikel 9, lid 3, van het Hoeveelheidsaanduidingenbesluit (Warenwet)][ref2], moet ten aanzien van de waren als
      bedoeld in de [artikelen 11][ref3] tot en met [15][ref4] zijn uitgedrukt in kilogram (kg) of gram (g).

      2 In aanvulling op [artikel 9, onder a tot en met g, van het Warenwetbesluit Etikettering van levensmiddelen][ref5],
      behoeft op de waren bedoeld in de [artikelen 5][ref6], [6][ref7], [7][ref8], [8][ref9], [11][ref10], [12][ref11]
      en [15][ref12] geen vermelding betreffende de lijst van ingrediënten te worden aangebracht.


