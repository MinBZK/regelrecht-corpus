  - number: '14'
    text: |-
      1 Aangeduid mag uitsluitend en moet worden met de naam *keukenstroop*: het mengsel van kandijstroop, suikerstroop
      of melasse en glucosestroop, als bedoeld in [artikel 2, onder ][ref1], van welk mengsel het suikergehalte ten
      minste 15% en minder dan 30%, het extractgehalte ten minste 80% en het asgehalte ten hoogste 4% bedragen.

      2 In de in het eerste lid bedoelde waar mogen geen andere bestanddelen aanwezig zijn dan glucosestroop en
      bestanddelen welke in kooksels van de plant, waaruit de waar is bereid, plegen voor te komen, en zwaveldioxide
      onder de voorwaarden die ter zake gesteld zijn krachtens het [Warenwetbesluit Levensmiddelenadditieven][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003089#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005456
    url: https://wetten.overheid.nl/BWBR0003089/1998-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003089
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005456
  - number: '15'
    text: |-
      1 Met de benamingen *melado* of *melasse* mag uitsluitend en met een dezer benamingen moet worden aangeduid: de
      stroperige vloeistof, verkregen uit de kooksels van de plant waaruit de waar is bereid, nadat daaruit suiker in
      kristallen is verwijderd, van welke vloeistof het asgehalte meer dan 4,0% bedraagt.

      2 In afwijking van het eerste lid moet de daar bedoelde aanduiding worden aangevuld met de aanduiding "zoute
      stroop" indien van de in het eerste lid bedoelde waar het extractgehalte ten minste 80%, het asgehalte ten hoogste
      7% en de schijnbare zuiverheidsfactor ten minste 73% bedragen en de waar aanwezig is in een verpakking met een
      inhoudsmaat kleiner dan 2 kg en bestemd voor aflevering aan particulieren.

      3 In de in het eerste lid bedoelde waar mogen geen andere bestanddelen aanwezig zijn dan die welke in kooksels van
      suikerriet of beetwortels plegen voor te komen, en zwaveldioxide onder de voorwaarden die ter zake gesteld zijn
      krachtens het [Warenwetbesluit Levensmiddelenadditieven][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005456
    url: https://wetten.overheid.nl/BWBR0003089/1998-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005456
  - number: '17'
    text: |-
      1 De waren, bedoeld in [artikel 2, eerste lid][ref1], aanwezig in een verpakking, bestemd of geschikt om met de
      inhoud aan de verbruiker te worden afgeleverd, moeten op de buitenzijde van de verpakking zijn voorzien van

      a. een aanduiding, aangevende de naam van de waar, welke in [artikel 2, eerste lid][ref2], voor de waar is
      vastgesteld, alsmede de overige aanduidingen die ten aanzien van de waar in [artikel 2][ref3] zijn voorgeschreven;

      b. een aanduiding, aangevende het nettogewicht van de in de verpakking aanwezige waar, met uitzondering van de
      waren in verpakkingen welke minder dan 50 g bevatten, met dien verstande dat voor laatstgenoemde waren, die worden
      afgeleverd in verzamelverpakkingen, waarvan het totale nettogewicht 50 g of meer bedraagt, op de verzamelverpakking
      het totale nettogewicht van de daarin aanwezige waar moet worden aangegeven;

      c. een aanduiding aangevende de naam of de handelsnaam en het adres van de fabrikant, van de verpakker of van een
      verkoper, gevestigd binnen het gebied, waarop het Verdrag tot oprichting van de Europese Economische Gemeenschap
      dan wel de Overeenkomst betreffende de Europese Economische Ruimte van toepassing is;

      d. voor wat betreft de waren, bedoeld in [artikel 2, eerste lid onder ][ref4], een aanduiding, aangevende de
      gehaltes aan droge stof in procenten en aan invertsuiker in procenten van de droge stof;

      e. voor wat betreft de waar, bedoeld in [artikel 2, eerste lid, onder ][ref5], die kristallen in de oplossing
      heeft, de aanduiding "gekristalliseerd".

      2 In afwijking van het eerste lid, onder *c*, mag de aanduiding van het adres worden vervangen door de aanduiding
      van de plaats van vestiging.

      3 De in het eerste lid bedoelde aanduidingen moeten duidelijk zichtbaar, gemakkelijk leesbaar en onuitwisbaar zijn
      en de in dat lid onder *a, d* en *e* bedoelde aanduidingen moeten zijn aangebracht in de Nederlandse taal.

      4 Indien de waren, bedoeld in [artikel 2, eerste lid, onder ][ref6], aanwezig zijn in een verpakking, waarin zij
      aan andere verbruikers dan particulieren worden afgeleverd, en het nettogewicht van de in de verpakking aanwezige
      waar ten minste 10 kg bedraagt, behoeft ten aanzien van die waren niet aan het eerste lid, onder *b, d* en *e* te
      worden voldaan, indien die waren vergezeld gaan van op die waren betrekking hebbende bescheiden, waarin de voor die
      waren in het eerste lid, onder *b, d* en *e* voorgeschreven aanduidingen worden gebezigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003089#Artikel2
