articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *suiker:* saccharose;

      b. *dextrose:* D-glucose;

      c. *fructose:* D-fructose;

      d. *invertsuiker:* mengsel van nagenoeg gelijke delen dextrose en fructose;

      e. *kandij:* het produkt bestaande uit de grote kristallen, verkregen bij afkoeling van sterk geconcentreerde
      suikeroplossingen;

      f. *basterdsuiker:* een mengsel van fijn-kristallijne saccharose en enig invertsuiker, verkregen als naprodukt
      van suikerraffinaderijen of door vermenging van fijne suikerkristallen met kleurloze of min of meer gekleurde
      invertsuikerhoudende stropen;

      g. *procenten of %:* aantal grammen per 100 g;

      h. *suikergehalte:* de som van saccharose en invertsuiker, de laatste omgerekend tot saccharose;

      i. *polarisatie:* de draaiing van gepolariseerd licht door een oplossing;

      j. *een punt van het kleurtype:* 0,5 eenheid volgens de methode opgenomen in [bijlage I][ref1], [onder A][ref2];

      k. *een punt van het asgehalte:* 0,0018% volgens de methode opgenomen in [bijlage I][ref3], [onder B][ref4];

      l. *een punt van de kleur van de oplossing:* 7,5 eenheden volgens de methode opgenomen in [bijlage I][ref5],
      [onder C][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0003089
      [ref2]: https://wetten.overheid.nl/BWBR0003089
      [ref3]: https://wetten.overheid.nl/BWBR0003089
      [ref4]: https://wetten.overheid.nl/BWBR0003089
