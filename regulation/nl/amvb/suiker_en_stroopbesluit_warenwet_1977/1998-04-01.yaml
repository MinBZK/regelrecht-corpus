        artikel: '4'
      - id: ref2
        bwb_id: BWBR0003089
        artikel: '15'
  - number: '4'
    text: |-
      1 Aangeduid moet worden met de benaming poedersuiker: suiker of witte suiker zoals bedoeld in
      [artikel 2, eerste lid, onder ][ref1], en geraffineerde suiker of geraffineerde witte suiker zoals bedoeld in
      [artikel 2, eerste lid, onder ][ref2], in poedervorm, waaraan zijn toegevoegd levensmiddelenadditieven die ter
      zake krachtens het [Warenwetbesluit Levensmiddelenadditieven][ref3] zijn toegelaten onder de daarbij vermelde
      voorwaarden, dan wel ten hoogste 5% zetmeel.

      2 In de in het eerste lid bedoelde waar mogen geen andere bestanddelen aanwezig zijn dan zwaveldioxide, onder de
      voorwaarden die ter zake gesteld zijn krachtens het [Warenwetbesluit Levensmiddelenadditieven][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003089#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003089#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005456
      [ref4]: https://wetten.overheid.nl/BWBR0005456
