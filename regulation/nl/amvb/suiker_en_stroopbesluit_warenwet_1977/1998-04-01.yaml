  - number: '20'
    text: |-
      De waar, die door een opschrift of op enige andere wijze wordt aangeduid als, of kennelijk voorhanden is als een
      der waren, bedoeld in een der [artikelen 2][ref1], [2bis][ref2] en [4][ref3] tot en met [15][ref4], moet voldoen
      aan het voor die waar bij dit besluit bepaalde.


