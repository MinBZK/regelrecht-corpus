    text: |-
      1 Dit besluit kan worden aangehaald als Suiker- en stroopbesluit (Warenwet) 1977.

      2 Het treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst.
