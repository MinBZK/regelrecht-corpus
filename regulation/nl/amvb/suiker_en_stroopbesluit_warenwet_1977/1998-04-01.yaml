        artikel: '2'
  - number: '3'
    text: |-
      De in [artikelen 4][ref1] tot en met [15][ref2] bedoelde waren moeten voldoen aan de volgende eisen:

      a. kleur, geur en smaak moeten normaal zijn;

      b. bederf (bijvoorbeeld gisting) moet afwezig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003089#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003089#Artikel15
