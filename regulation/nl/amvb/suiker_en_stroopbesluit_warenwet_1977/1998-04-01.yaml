  - number: '2'
    text: |-
      1 Aangeduid mag uitsluitend en moet worden met een der benamingen:

      a. *halfwitte suiker*: gezuiverde gekristalliseerde suiker, waarvan de polarisatie ten minste 99,5°, het gehalte
      aan invertsuiker ten hoogste 0,10%, en het verlies bij het drogen ten hoogste 0,10% bedragen;

      b. *suiker of witte suiker*: gezuiverde gekristalliseerde suiker, waarvan de polarisatie ten minste 99,7°, het
      gehalte aan invertsuiker ten hoogste 0,04%, het verlies bij het drogen ten hoogste 0,10%, en het kleurtype ten
      hoogste 12 punten bedragen;

      c. *geraffineerde suiker of geraffineerde witte suiker*: gezuiverde gekristalliseerde suiker, waarvan de
      polarisatie, het gehalte aan invertsuiker en het verlies bij het drogen overeenstemmen met de voor de onder *b*
      bedoelde waar genoemde gehaltes en waarvan het totaal aantal punten niet meer bedraagt dan 8, met dien verstande
      dat het kleurtype niet meer dan 4 punten, het asgehalte niet meer dan 6 punten, en de kleur van de oplossing niet
      meer dan 3 punten bedragen;

      d. *vloeibare suiker*: de waterige oplossing van suiker, van welke oplossing het gehalte aan droge stof ten minste
      62%, het gehalte aan invertsuiker (verhouding fructose dextrose: 1,0 ± 0,2) ten hoogste 3% van de droge stof,
      het conductometrisch vastgestelde asgehalte ten hoogste 0,1% van de droge stof, en de kleur van de oplossing ten
      hoogste 45 ICUMSA-eenheden bedragen;

      e. *vloeibare invertsuiker*: de waterige oplossing van suiker, in welke oplossing gedeeltelijk inversie door
      hydrolyse heeft plaatsgevonden, met een niet-overwegende hoeveelheid invertsuiker en van welke oplossing het
      gehalte aan droge stof ten minste 62%, het gehalte aan invertsuiker (verhouding fructose dextrose: 1,0 ± 0,1) meer
      dan 3% en niet meer dan 50% van de droge stof, en het conductometrisch vastgestelde asgehalte ten hoogste 0,4% van
      de droge stof bedragen;

      f. *invertsuikerstroop*: de waterige al dan niet gedeeltelijk gekristalliseerde oplossing van suiker, in welke
      oplossing gedeeltelijke inversie door hydrolyse heeft plaatsgevonden, met een overwegende hoeveelheid invertsuiker
      en van welke oplossing het gehalte aan droge stof niet minder dan 62%, het gehalte aan invertsuiker (verhouding
      fructose dextrose: 1,0 ± 0,1) meer dan 50% van de droge stof, en het conductometrisch vastgestelde asgehalte ten
      hoogste 0,4% van de droge stof bedragen;

      g. *glucosestroop*: de gezuiverde, geconcentreerde, waterige oplossing van eetbare sacchariden verkregen uit
      zetmeel, van welke oplossing het gehalte aan droge stof ten minste 70%, het dextrose-equivalent ten minste 20% van
      de droge stof berekend als dextrose, en het gehalte aan sulfaat-as ten hoogste 1% van de droge stof bedragen;

      h. *gedehydrateerde glucosestroop, gedroogde glucosestroop of watervrije glucosestroop*: de gezuiverde,
      geconcentreerde, waterige oplossing van eetbare sacchariden verkregen uit zetmeel, welke oplossing gedeeltelijk is
      gedroogd, en waarvan het gehalte aan droge stof ten minste 93%, het dextrose-equivalent ten minste 20% van de droge
      stof berekend als dextrose, en het gehalte aan sulfaat-as ten hoogste 1% van de droge stof bedragen;

      i. *dextrose monohydraat, dextrose met kristalwater of druivensuiker met kristalwater*: gezuiverde
      gekristalliseerde dextrose met een molecule kristalwater, van welke waar het gehalte aan dextrose ten minste 99,5%
      van de droge stof, het gehalte aan droge stof ten minste 90%, en het gehalte aan sulfaat-as ten hoogste 0,25% van
      de droge stof bedragen;

      j. *watervrije dextrose, dextrose zonder kristalwater of druivensuiker zonder kristalwater*: gezuiverde
      gekristalliseerde dextrose zonder kristalwater, van welke waar het gehalte aan dextrose ten minste 99,5% van de
      droge stof, het gehalte aan droge stof ten minste 98%, en het gehalte aan sulfaat-as ten hoogste 0,25% van de droge
      stof bedragen.

      2 In afwijking van het eerste lid mag een der benamingen suiker of witte suiker tevens worden gebezigd voor de in
      het eerste lid, onder *c*, bedoelde waar in plaats van de daar genoemde benamingen.

      3 De aanduiding *wit* mag voor de in het eerste lid bedoelde waren uitsluitend worden toegevoegd aan de benamingen,
      bedoeld in het eerste lid, onder *d*, *e* en *f* onder onderstaande beperkingen:

      a. voor de waar, bedoeld in het eerste lid, onder *d*, waarvan de kleuring van de oplossing ten hoogste 25 ICUMSA-
      eenheden bedraagt;

      b. voor de waren, bedoeld in het eerste lid, onder *e* en *f*, waarvan het asgehalte niet hoger is dan 0,1% en
      waarvan de kleuring van de oplossing ten hoogste 25 ICUMSA-eenheden bedraagt;

      4 De in het eerste lid bedoelde waren mogen niet worden onderworpen aan een blauwingsprocédé.

      5 De in het eerste lid bedoelde waren mogen niet kunstmatig zijn gekleurd, tenzij zij bestemd zijn om als
      grondstof te worden gebruikt voor de bereiding van andere eet- en drinkwaren, waarin kleuring is toegelaten,
      in welk geval zij mogen zijn gekleurd met een of meer kleurstoffen die ter zake zijn toegelaten krachtens het
      [Warenwetbesluit Levensmiddelenadditieven][ref1] onder de daarbij vermelde voorwaarden. Indien de in de vorige
      volzin bedoelde kleuring heeft plaatsgevonden, moet de aanduiding "gekleurd" aan de in het eerste lid genoemde
      benamingen worden toegevoegd en mag de in het zesde lid bedoelde aanduiding "wit" niet worden gebezigd.

      6 In afwijking van het eerste lid, onder *i* en *j*, behoeven de woorden "monohydraat", "met kristalwater",
      "watervrije" en "zonder kristalwater" in de daar genoemde benamingen niet te worden gebezigd voor de in het eerste
      lid, onder *i* en *j*, bedoelde waren die zijn bestemd voor aflevering aan particulieren.


      [ref1]: https://wetten.overheid.nl/BWBR0005456
    url: https://wetten.overheid.nl/BWBR0003089/1998-04-01#Artikel2
