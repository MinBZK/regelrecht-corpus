  - number: '22'
    text: |-
      1 Voor de beoordeling of de waren in dit besluit bedoeld, voldoen aan de daarin gestelde eisen, moet worden gebruik
      gemaakt van de methoden van onderzoek, aangegeven in [bijlage I][ref1] bij dit besluit, en, voor zover de methoden
      aangegeven in die bijlage daarin niet voorzien, van de van toepassing zijnde methoden van onderzoek opgenomen in
      [bijlage II][ref2] bij dit besluit.

      2 Waar meer dan één methode van onderzoek is voorgeschreven, moet bij de uitkomst van het onderzoek tevens worden
      aangegeven welke methode is toegepast.


