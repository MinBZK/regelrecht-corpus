  - number: 2bis
    text: |-
      1 Aangeduid mag uitsluitend en moet worden met een der benamingen:

      a. *ruwe suiker*, waarbij tussen de woorden "ruwe" en "suiker" al dan niet de naam van de plant waaruit de waar is
      bereid is opgenomen:

      gekristalliseerde suiker, welke niet gemalen of geplet is en waarvan de polarisatie tenminste 94 bedraagt, maar
      lager is dan 99,5 en waarvan het sulfaatasgehalte ten hoogste 2,5%, het invertsuikergehalte ten hoogste 1,5% en het
      gewichtsverlies bij drogen ten hoogste 1,5% bedraagt;

      b. *fructose:* gezuiverde, gekristalliseerde fructose, van welke waar het gehalte aan fructose tenminste 99,5% van
      de droge stof, het gehalte aan droge stof tenminste 99,5%, het gehalte aan sulfaatas ten hoogste 0,10% van de droge
      stof en het kleurtype ten hoogste 25 ICUMSA-eenheden bedraagt;

      c. *fructosestroop:* de gezuiverde, geconcentreerde, waterige oplossing van eetbare sacchariden, van welke
      oplossing het gehalte aan fructose tenminste 97% van de droge stof, het gehalte aan droge stof tenminste 70%, het
      gehalte aan sulfaatas ten hoogste 1% en de kleur van de oplossing ten hoogste 25 ICUMSA-eenheden bedraagt.

      2 Het bepaalde in de [leden 4 en 5 van artikel 2][ref1] is van overeenkomstige toepassing op de in het eerste lid
      bedoelde waren.


      [ref1]: https://wetten.overheid.nl/BWBR0003089#Artikel2
    url: https://wetten.overheid.nl/BWBR0003089/1998-04-01#Artikel2bis
