preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van de Staatssecretaris van Volksgezondheid en Milieuhygiëne van 15 november 1976, DG Vgz/VA, nr.
    62402, van Onze Minister van Landbouw en Visserij en van de Staatssecretaris van Economische Zaken;

    Overwegende, dat het gewenst is, zulks mede ter uitvoering van de Richtlijn van de Raad van de Europese
    Gemeenschappen van 11 december 1973 betreffende de onderlinge aanpassing van de wetgevingen der Lid-Staten inzake
    bepaalde voor menselijke consumptie bestemde suikers (73/437/EEG) (Pb. E.G. L 356), met betrekking tot suiker een
    nieuwe regeling vast te stellen;

    Gelet op de artikelen 14, 14a, 16 en 16a van de Warenwet (Stb. 1935, 793);

    Gezien het advies van de Adviescommissie Warenwet van 2 maart 1976, nr. 12360/335;

    De Raad van State gehoord (advies van 22 december 1976, nr. 29);

    Gezien het nader rapport van de Staatssecretaris van Volksgezondheid en Milieuhygiëne van 4 februari 1977, DG Vgz/
    VA, nr. 168002, van Onze Minister van Landbouw en Visserij en van de Staatssecretaris van Economische Zaken;

    Hebben goedgevonden en verstaan:
