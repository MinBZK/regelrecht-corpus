  - number: X
    text: |-
      1 In dit artikel wordt verstaan onder richtlijn: [richtlijn nr. 2004/39/EG](32004L0039) van het Europees Parlement
      en de Raad van de Europese Unie van 21 april 2004 betreffende markten voor financiële instrumenten, tot wijziging
      van de [Richtlijnen 85/611/EEG](31985L0611) en [93/6/EEG](31993L0006) van de Raad en van [Richtlijn 2000/12/EG]
      (32000L0012) van het Europees Parlement en de Raad en houdende intrekking van [Richtlijn 93/22/EEG](31993L0022) van
      de Raad (PbEU L 145).

      2 Tot 1 januari 2011 kan de Nederlandsche Bank, op verzoek, aan een beleggingsonderneming die een limiet als
      bedoeld in [artikel 102, eerste of tweede lid, van het Besluit prudentiële regels Wft][ref1] overschrijdt
      toestemming verlenen om [artikel 60, eerste lid, onderdeel b, van dat koninklijk besluit][ref2] niet toe te passen
      indien:

      a. de beleggingsonderneming beleggingsdiensten en beleggingsactiviteiten als bedoeld in artikel 4, eerste lid,
      onder punt 2, van de richtlijn verricht die verband houden met de financiële instrumenten genoemd in bijlage I,
      afdeling C, punten 5, 6, 7, 9 en 10 van de richtlijn;

      b. de beleggingsonderneming dergelijke beleggingsdiensten en beleggingsactiviteiten niet voor of namens
      particuliere cliënten als bedoeld in artikel 4, eerste lid, onder punt 10, van de richtlijn verricht;

      c. overschrijdingen van de limieten, bedoeld in de aanhef, in verband met risico’s die voorvloeien uit
      overeenkomsten die financiële instrumenten zijn als bedoeld in onderdeel a, en betrekking hebben op
      grondstoffen of onderliggende waarden als bedoeld in bijlage I, afdeling C, punt 10, van de richtlijn, en
      worden berekend in overeenstemming met het bij of krachtens [artikel 61, vijfde lid, onderdeel c][ref3], en
      [bijlage B van het Besluit prudentiële regels Wft][ref4] bepaalde, of uit overeenkomsten over de levering van
      grondstoffen of emissierechten; en

      d. de beleggingsonderneming beschikt over een vastgelegde strategie voor beheer.

      3 De beleggingsonderneming stelt de Nederlandsche Bank onverwijld op de hoogte van de in het tweede lid, onderdeel
      d, bedoelde strategie en van alle wijzigingen daarvan. De beleggingsonderneming treft maatregelen om te zorgen
      voor voortdurende controle op de kredietwaardigheid van de debiteuren, in overeenstemming met het effect op het
      concentratierisico. Deze maatregelen stellen de beleggingsonderneming in staat adequaat op te treden bij iedere
      verslechtering van de kredietwaardigheid.

      4 Indien de beleggingsonderneming de interne grenzen, vastgelegd ingevolge de strategie, bedoeld in het tweede lid,
      onderdeel d, overschrijdt, stelt zij onverwijld de Nederlandsche Bank op de hoogte van de omvang en de aard van de
      overschrijding en van de betrokken wederpartij.

      5 De toestemming, bedoeld in het tweede lid, vervalt op het tijdstip van inwerkingtreding van een voorstel als
      bedoeld in artikel 119 van de herziene richtlijn banken tot wijziging van de bepalingen in titel V, hoofdstuk 2,
      afdeling 5, van de herziene richtlijn banken indien die wijziging vóór 31 december 2010 in werking treedt en die
      wijziging zich niet verdraagt met de toestemming.


