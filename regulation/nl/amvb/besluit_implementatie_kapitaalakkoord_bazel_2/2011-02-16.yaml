preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Financiën van 26 september 2006, nr. FM2006-02251 M;

    Gelet op de artikelen 3:17, tweede lid, aanhef en onderdeel c, 3:53, derde lid, 3:57, tweede en zevende lid,
    3:259, derde lid, 3:280b, 4:22 en5:58, derde lid, van de Wet op het financieel toezicht en de richtlijnen nr.
    2006/48/EG van het Europees Parlement en de Raad van de Europese Unie van 14 juni 2006 betreffende de toegang
    tot en de uitoefening van de werkzaamheden van kredietinstellingen (herschikking) (PbEU L 177), en nr. 2006/49/EG
    van het Europees Parlement en de Raad van de Europese Unie van 14 juni 2006 inzake de kapitaaltoereikendheid van
    beleggingsondernemingen en kredietinstellingen (herschikking) (PbEU L 177);

    De Raad van State gehoord, advies van 20 oktober 2006, nr. W06.060417/IV;

    Gezien het nader rapport van Onze Minister van Financiën van 4 december 2006, nr. FM2006-02508 U;

    Hebben goedgevonden en verstaan:
