  - number: XI
    text: |-
      1 De Nederlandsche Bank kan tot 1 januari 2012 op verzoek toestaan dat een beleggingsonderneming waarop
      [artikel 62a van het Besluit prudentiële regels Wft][ref1] niet van toepassing is, niet voldoet aan
      [artikel 60, eerste lid, onderdeel d, van dat koninklijk besluit][ref2] indien:

      a. de handelsportefeuille niet op enig moment meer bedraagt dan € 50 miljoen; en

      b. het gemiddeld aantal relevante werknemers over het boekjaar niet meer bedraagt dan honderd.

      2 De beleggingsonderneming, bedoeld in het eerste lid, beschikt in plaats van het bedrag, bedoeld in
      [artikel 60, eerste lid, onderdeel d, van het Besluit prudentiële regels Wft][ref3] over een bedrag dat ten minste
      gelijk is aan 12/88 van het hoogste van de volgende bedragen:

      a. de som van de bedragen, bedoeld in
      [artikel 60, eerste lid, onderdelen a tot en met c, van het Besluit prudentiële regels Wft][ref4];

      b. het bedrag, bedoeld in [artikel 60, derde lid, van het Besluit prudentiële regels Wft][ref5].

      3 De beleggingsonderneming verhoogt ten minste jaarlijks het bedrag waarover zij beschikt,
      zodat zij uiterlijk per 31 december 2011 beschikt over het bedrag, vereist op grond van
      [artikel 60, eerste lid, onderdeel d, van het Besluit prudentiële regels Wft][ref6].

      4 De toepassing van het eerste tot en met derde lid leidt niet tot een verlaging van de
      minimumomvang van het toetsingsvermogen zoals dat gold voor het tijdstip van inwerkingtreding van het
      [Besluit prudentiële regels Wft][ref7], tenzij die verlaging een gevolg is van vermindering van de activiteiten
      waarover toetsingsvermogen wordt aangehouden.


