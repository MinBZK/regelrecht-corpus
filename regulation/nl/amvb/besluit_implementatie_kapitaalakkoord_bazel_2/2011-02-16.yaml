  - number: VIII
    text: |-
      1 Een bank, beleggingsonderneming of clearinginstelling kan het bedrag van de naar risico
      gewogen activa en posten buiten de balanstelling tot 1 januari 2008 berekenen ingevolge
      [artikel 61 van het Besluit prudentiële regels Wft][ref1] zoals dit luidde voorafgaand aan het tijdstip van
      inwerkingtreding van dit artikel, met dien verstande dat kredietderivaten worden beschouwd als een post buiten de
      balanstelling met een volledig risico als bedoeld in het tweede lid, onderdeel b, van genoemd artikel.

      2 Het bij of krachtens de [artikelen 3:18a][ref2] en [3:74a van de wet][ref3] bepaalde alsmede het bij of krachtens
      [artikel 24a][ref4] en [paragraaf 10.3 van het Besluit prudentiële regels Wft][ref5] bepaalde is niet van
      toepassing op een financiële onderneming die het eerste lid toepast.

      3 Een financiële onderneming die het eerste lid toepast, kan het bij of krachtens
      [paragraaf 10.4 van het Besluit prudentiële regels Wft][ref6] bepaalde buiten beschouwing laten. Indien deze
      financiële onderneming de genoemde paragraaf niet buiten beschouwing laat, wordt zij voor de toepassing daarvan
      verondersteld [artikel 61 van het Besluit prudentiële regels Wft][ref7] toe te passen.

      4 Een financiële onderneming die het eerste lid toepast, vermindert het bedrag
      van het solvabiliteitsvereiste ter dekking van het operationeel risico, bedoeld in
      [artikel 60, eerste lid, onderdeel d, van het Besluit prudentiële regels Wft][ref8], met een bedrag dat gelijk
      is aan het quotiënt van de waarde van de activa en posten buiten de balanstelling waarop het eerste lid wordt
      toegepast en de waarde van alle activa en posten buiten de balanstelling, vermenigvuldigd met het bedrag van dat
      solvabiliteitsvereiste.

      5 Een financiële onderneming die het eerste lid op alle activa en posten buiten de balanstelling toepast, kan
      het bij of krachtens [hoofdstuk 10 van het Besluit prudentiële regels Wft][ref9] bepaalde, zoals dat luidde
      voorafgaand aan het tijdstip van inwerkingtreding van onderhavig besluit, toepassen.

      6 Een financiële onderneming die het eerste lid op alle activa en posten buiten de balanstelling
      toepast, kan in plaats van het bepaalde bij of krachtens de [hoofdstukken 9][ref10], [10][ref11] en
      [13 van het Besluit prudentiële regels Wft][ref12] het bepaalde ingevolge de [artikelen 11, tweede lid][ref13],
      [20, derde lid][ref14], en [55, tweede lid, van de Wet toezicht kredietwezen 1992][ref15] dan wel de
      [artikelen 1 tot en met 8 van de Nadere regeling prudentieel toezicht effectenverkeer 2002][ref16], zoals dat
      luidde op 31 december 2006, toepassen.


