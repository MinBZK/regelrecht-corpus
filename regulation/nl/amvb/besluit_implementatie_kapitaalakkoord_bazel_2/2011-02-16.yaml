articles:
  - number: VII
    text: |-
      1 Het minimumbedrag aan toetsingsvermogen van een bank of beleggingsonderneming die het bedrag
      van de naar risico gewogen activa en posten buiten de balanstelling berekent volgens een
      interne modellenmethode is in de boekjaren 2007, 2008 en 2009 ten minste gelijk aan 95, 90
      onderscheidenlijk 80 procent van het minimumbedrag aan toetsingsvermogen zoals berekend ingevolge de
      [artikelen 60 tot en met 62 van het Besluit prudentiële regels Wft][ref1] zoals deze luidden voorafgaand aan het
      tijdstip van inwerkingtreding van dit artikel.

      2 Het minimumbedrag aan toetsingsvermogen van een bank of beleggingsonderneming die
      het solvabiliteitsvereiste ter dekking van het operationeel risico berekent ingevolge
      [artikel 78 van het Besluit prudentiële regels Wft][ref2] is in de boekjaren 2008 en 2009 ten minste gelijk
      aan 90 onderscheidenlijk 80 procent van het minimumbedrag aan toetsingsvermogen zoals berekend ingevolge de
      [artikelen 60 tot en met 62 van het Besluit prudentiële regels Wft][ref3] zoals deze luidden voorafgaand aan het
      tijdstip van inwerkingtreding van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel78
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel60
