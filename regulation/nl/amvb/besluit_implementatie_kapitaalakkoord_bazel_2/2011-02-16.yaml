  - number: IX
    text: |-
      1 De Nederlandsche Bank kan tot en met 31 december 2009 een financiële onderneming als bedoeld in
      [artikel 69, eerste lid, van het Besluit prudentiële regels Wft][ref1] die een verzoek als bedoeld in
      [artikel 69, vierde lid, van dat koninklijk besluit][ref2] heeft ingediend, in geval van inwilliging van dat
      verzoek toestaan dat in plaats van de termijn van drie jaren een kortere termijn geldt, met dien verstande dat deze
      termijn niet korter is dan een jaar.

      2 De Nederlandsche Bank kan tot en met 31 december 2008 op verzoek van een financiële onderneming
      als bedoeld in [artikel 69, eerste lid, van het Besluit prudentiële regels Wft][ref3] die
      [artikel 69, vijfde lid, van dat koninklijk besluit][ref4] toepast, toestaan dat in plaats van de termijn van drie
      jaren een termijn van twee jaren geldt.

      3 De Nederlandsche Bank kan een financiële onderneming toestaan dat
      [artikel 94, eerste en tweede lid, van het Besluit prudentiële regels Wft][ref5] zoals dit luidde voorafgaand
      aan het tijdstip van inwerkingtreding van dit artikel tot 1 januari 2013 van toepassing blijft op deelnemingen als
      bedoeld in [artikel 94, tweede lid, onderdeel d, van het Besluit prudentiële regels Wft][ref6] die vóór 20 juli
      2006 zijn verworven.

      4 De Nederlandsche Bank kan toestaan dat een financiële onderneming als bedoeld in
      [artikel 70, derde lid, van het Besluit prudentiële regels Wft][ref7] met zetel in Nederland
      in afwijking van dat lid tot 1 januari 2018 in plaats van een interne modellenmethode de
      [artikelen 60 tot en met 61a van het Besluit prudentiële regels Wft][ref8] toepast op posities in aandelen die zij
      op 31 december 2007 aanhield.

      5 Tot 1 januari 2012 kan de Nederlandsche Bank in het geval van vorderingen op
      ondernemingen in plaats van de termijn van negentig dagen in de definitie van wanbetaling in
      [artikel 1 van het Besluit prudentiële regels Wft][ref9] een langere termijn vaststellen. De termijn is niet
      langer dan 180 dagen of, in het geval van vorderingen op ondernemingen met zetel in een andere lidstaat, niet
      langer dan de termijn die door de toezichthoudende instantie van die lidstaat is vastgesteld.


