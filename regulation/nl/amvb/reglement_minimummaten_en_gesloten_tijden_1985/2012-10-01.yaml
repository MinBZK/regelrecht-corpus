  - number: '11'
    text: Onze Minister kan vrijstelling of ontheffing verlenen van de bepalingen bij of krachtens dit besluit.
    url: https://wetten.overheid.nl/BWBR0003805/2012-10-01#Artikel11
  - number: '12'
    text: >-
      Aan vrijstellingen en ontheffingen kunnen voorschriften worden verbonden. Zij kunnen onder beperkingen worden
      verleend. Zij kunnen te allen tijde worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003805/2012-10-01#Artikel12
  - number: '15'
    text: Het Reglement minimummaten en gesloten tijden 1970 (*Stb.* 178) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003805/2012-10-01#Artikel15
  - number: '16'
    text: >-
      Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin het
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0003805/2012-10-01#Artikel16
  - number: '17'
    text: >-
      Dit besluit kan worden aangehaald als "Reglement minimummaten en gesloten tijden", met vermelding van het jaartal
      van het *Staatsblad,* waarin het zal worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0003805/2012-10-01#Artikel17
