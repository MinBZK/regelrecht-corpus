        artikel: '1'
  - number: '8'
    text: |-
      In afwijking van het bepaalde in [artikel 3, aanhef en onderdeel b][ref1], is het toegestaan na de zesde dag na
      de aanvang van de gesloten tijd vis van de in [artikel 2, tweede lid][ref2], bedoelde soorten, welke op die dag
      opgeslagen is in een vrieshuis dat voldoet aan de eisen van sectie VIII, hoofdstuk III, onderdeel B, van bijlage
      III van verordening (EG) nr. 853/2004 van het Europees Parlement en de Raad van 29 april 2004 houdende vaststelling
      van specifieke hygiënevoorschriften voor levensmiddelen van dierlijke oorsprong (PBEG 2004, L 139):

      a. in dat vrieshuis voorhanden of in voorraad te hebben;

      b. naar een werkplaats tot het verwerken of bewerken van vis of een daartoe behorende inrichting te vervoeren,
      aldaar voorhanden of in voorraad te hebben, te bewerken of te verwerken;

      c. nadien te vervoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0003805#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003805#Artikel2
    url: https://wetten.overheid.nl/BWBR0003805/2012-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003805
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003805
        artikel: '2'
  - number: '9'
    text: |-
      De artikelen [1][ref1], [2][ref2] en [3][ref3] zijn niet van toepassing op vis waarvan wordt aangetoond dat
      deze:

      a. afkomstig is uit een viskwekerij als bedoeld in artikel 3, eerste lid, onderdeel h, van richtlijn nr. 2006/88/
      EG van de Raad van 24 oktober 2006, betreffende veterinairrechtelijke voorschriften van aquacultuurdieren en de
      producten daarvan betreffende de preventie en bestrijding van bepaalde ziekten bij waterdieren (PbEG 2006, L 328),
      of

      b. is geïmporteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003805#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003805#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003805#Artikel3
    url: https://wetten.overheid.nl/BWBR0003805/2012-10-01#Artikel9
